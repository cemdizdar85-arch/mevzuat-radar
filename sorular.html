<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Soru Çöz · Sınavını seç | Tetikte</title>
<meta name="description" content="Staja Giriş, Staj Bitirme ve Bağımsız Denetçilik: sınavını seç, dersler sınavdaki ağırlığıyla sıralı, her soru çözümüyle.">
<link rel="stylesheet" href="stil.css">
<!--
  SORU ÇÖZ KAPISI (13.09.2026)
  Cem: "soru çözmeye başla dediğinde direkt sorular geliyor; başta sınavlar gelmesi lazım
  (staja giriş, staj bitirme, bağımsız denetim; SPK bitirirsek onu alırız), onların altında
  sorular ders ders olmalı. Büyük rakipler nasıl yapıyor bak."
  Rakip ölçümü: UWorld/Becker bölüm -> konu -> test; Müşavirler Kulübü SBS/Yeterlilik -> soru
  bankası -> konu. Hepsinde sıra aynı: SINAV -> DERS -> SORU.

  VERİ: veri/soru-dizini.json (motor/soru-dizini.js; Kaydır-Çöz sayfalarından sayar) +
  veri/sinav-takvimi.json (TÜRMOB resmî takvimi, "sınava kaç gün"). Rakam elle yazılmaz.
  SPK bilerek yok (Cem: bitince eklenir). Sayfası olmayan sınav "Hazırlanıyor" der, düğme açmaz.
  Konu adları BİLEREK gösterilmiyor: 13.09 ölçümünde yarısı harf katlanmış ("denklem cozme"),
  bir kısmı başka dersin konusu çıktı - etiket onarımı bitmeden vitrine çıkmaz.
-->
<style>
  /* 13.09 Cem (ekran görüntüsü): "görüntümüz bu mu olacak, hepsi koyu yapsak" - GM önerisi de bu:
     sayfa bir KAPI/vitrin, ana sayfanın koyu kahramanıyla aynı dil. Üst koyu + alt açık iki parçaya
     bölünüyordu ve menu.js'in "← Geri" hapı aradaki beyazda yetim kalıyordu.
     Jetonlar BODY'de yeniden tanımlanır: stil.css/stil-acik.css ve menu.js'in eklediği ögeler (Geri,
     Araçlar düğmesi) aynı jetonları okuduğu için kendiliğinden koyuya uyar.
     Soru çözme ekranları (kaydir/) 09.09 kararıyla BEYAZ kalır - uzun okumada göz yormaz. */
  body.sc-koyu{
    --bz-gece:#0a0b0e; --bz-gece2:#12151b;
    --bz-ak:#f2f4f8; --bz-ak-govde:#aab3c0; --bz-ak-sonuk:#78828f;
    --bz-bronz:#cfa163; --bz-bronz-acik:#eccb96; --bz-cta-yazi:#221704;
    --ink:#f2f4f8; --muted:#aab3c0; --dim:#8a93a0; --panel:#12151b; --panel2:#171b22;
    --line:#232833; --line2:#2e3440; --amber:#e3b877; --accent:#e3b877; --yuzey:#12151b;
    --bg:#0a0b0e; --bg2:#101319;
    background:var(--bz-gece);color:var(--ink)}
  .sc-ust{position:relative;overflow:hidden;color:var(--bz-ak)}
  /* site başlık şeridi (.top): menu.js "← Geri"yi buraya, marka yazısının önüne yerleştirir.
     stil-acik.css .top'a koyu gri kutu verir; burada zemin zaten koyu, kutu kaldırılır. */
  .sc-ust .sc-bar .top{background:transparent;border:0;margin:0;padding:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sc-ust:before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(55% 70% at 80% 0%,rgba(207,161,99,.20),transparent 62%),
      radial-gradient(40% 60% at 0% 100%,rgba(207,161,99,.08),transparent 70%)}
  .sc-ic{position:relative;max-width:1180px;margin:0 auto;padding:0 28px}
  .sc-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0}
  .sc-marka{display:inline-flex;align-items:center;gap:10px;color:var(--bz-ak);text-decoration:none;font-weight:800;font-size:19px;letter-spacing:-.01em}
  .sc-lamba{width:12px;height:12px;border-radius:50%;background:var(--bz-bronz-acik);box-shadow:0 0 0 5px rgba(236,203,150,.14),0 0 18px rgba(236,203,150,.5)}
  .sc-bar a.sc-geri{color:var(--bz-ak-govde);text-decoration:none;font-size:14px}
  .sc-bar a.sc-geri:hover{color:var(--bz-ak)}
  .sc-bas{padding:34px 0 30px}
  body{margin:0}
  .sc-bas .sc-goz{font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--bz-bronz);margin:0 0 14px}
  .sc-bas h1{font-size:44px;line-height:1.1;letter-spacing:-.03em;margin:0 0 12px;color:var(--bz-ak);font-weight:700}
  .sc-bas p{font-size:16.5px;line-height:1.6;color:var(--bz-ak-govde);margin:0;max-width:40em}

  .sc-sinavlar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 0 44px}
  .sc-sinav{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;
    background:rgba(30,34,43,.62);border:1px solid rgba(214,180,126,.18);border-radius:16px;padding:20px 20px 18px;
    transition:border-color .15s,transform .15s,background .15s}
  .sc-sinav:hover{border-color:rgba(214,180,126,.45);transform:translateY(-2px)}
  .sc-sinav:focus-visible{outline:2px solid var(--bz-bronz-acik);outline-offset:3px}
  .sc-sinav[aria-pressed="true"]{border-color:var(--bz-bronz);background:rgba(207,161,99,.10);box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .sc-sinav .sc-kod{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--bz-bronz)}
  .sc-sinav .sc-ad{font-size:23px;font-weight:750;color:var(--bz-ak);letter-spacing:-.015em}
  .sc-sinav .sc-uzun{font-size:13px;color:var(--bz-ak-sonuk)}
  .sc-sinav .sc-say{font-size:14px;color:var(--bz-ak-govde);margin-top:10px}
  .sc-sinav .sc-say b{color:var(--bz-ak);font-weight:700}
  .sc-sinav .sc-gun{font-size:13px;color:var(--bz-bronz-acik);font-weight:650}
  .sc-cip{align-self:flex-start;font-size:11.5px;font-weight:700;border-radius:99px;padding:4px 10px;margin-top:10px}
  .sc-cip.acik{color:var(--bz-cta-yazi);background:linear-gradient(180deg,var(--bz-bronz-acik),var(--bz-bronz))}
  .sc-cip.hazir{color:var(--bz-ak-govde);border:1px solid rgba(214,180,126,.30)}

  .sc-govde{max-width:1180px;margin:0 auto;padding:38px 28px 70px;text-align:left}
  .sc-gbas{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .sc-gbas h2{font-size:26px;margin:0;color:var(--ink);letter-spacing:-.02em}
  .sc-gbas span{font-size:13.5px;color:var(--dim)}
  .sc-aciklama{font-size:14.5px;color:var(--muted);margin:0 0 24px;max-width:48em;line-height:1.6}
  .sc-bolum{margin:0 0 28px}
  .sc-bolum h3{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:700}
  .sc-bolum h3 s{text-decoration:none;font-weight:600;letter-spacing:.04em;text-transform:none;margin-left:6px}
  .sc-dersler{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
  .sc-ders{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit}
  a.sc-ders:hover{border-color:var(--amber)}
  .sc-ders .sc-dad{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.3}
  .sc-ders .sc-dalt{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.4}
  /* 13.09 Cem: "kırmızılar tam dolmamış, eksiğimiz var gibi" - ağırlık ÇUBUĞU ilerleme çubuğu gibi
     okunuyordu. Becker bölüm ağırlığını YAZIYLA verir ("Area I ... 30–40%"); UWorld'de çubuk yalnız
     öğrencinin KENDİ başarısında. Ağırlık artık yazı; çubuk ileride öğrencinin ilerlemesine ayrılır. */
  .sc-ders .sc-agirlik{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .sc-ders .sc-agirlik b{display:inline-block;font-weight:700;color:var(--bz-bronz-acik);
    border:1px solid rgba(214,180,126,.28);background:rgba(207,161,99,.08);border-radius:99px;padding:2px 9px}
  .sc-sinav,.sc-ders{box-shadow:none}
  a.sc-ders{transition:border-color .15s,transform .15s,background .15s}
  a.sc-ders:hover{background:var(--panel2);transform:translateY(-1px)}
  .sc-ders .sc-git{font-size:13.5px;font-weight:750;color:var(--amber);white-space:nowrap}
  .sc-ders.kapali{opacity:.72}
  .sc-ders.kapali .sc-git{color:var(--dim);font-weight:600}
  .sc-deneme{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;text-decoration:none;color:inherit;
    margin:0 0 30px;padding:20px 22px;border-radius:14px;border:1px solid var(--bz-bronz);
    background:linear-gradient(135deg,rgba(207,161,99,.16),rgba(207,161,99,.04));transition:transform .15s,box-shadow .15s}
  .sc-deneme:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(0,0,0,.4)}
  .sc-deneme>span:first-child{display:flex;flex-direction:column;gap:5px;max-width:44em}
  .sc-deneme-et{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--bz-bronz-acik)}
  .sc-deneme b{font-size:20px;color:var(--ink);letter-spacing:-.01em}
  .sc-deneme-alt{font-size:14px;color:var(--muted);line-height:1.5}
  .sc-deneme-git{font-size:15px;font-weight:750;color:var(--bz-cta-yazi);background:linear-gradient(180deg,var(--bz-bronz-acik),var(--bz-bronz));
    border-radius:10px;padding:11px 20px;white-space:nowrap}
  .sc-not{font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:14px;margin-top:8px;line-height:1.6}
  .sc-yuk{color:var(--dim);font-size:14px;padding:30px 0}

  @media(max-width:900px){
    .sc-sinavlar{grid-template-columns:1fr;gap:10px}
    .sc-bas h1{font-size:32px}
    .sc-ic,.sc-govde{padding-left:18px;padding-right:18px}
    .sc-dersler{grid-template-columns:1fr}
  }
</style>
</head>
<body class="sc-koyu">
<a class="atla" href="#icerik">İçeriğe atla</a>

<header class="sc-ust">
  <div class="sc-ic">
    <div class="sc-bar">
      <!-- .top = site başlık şeridi: menu.js "← Geri / Ana sayfa" düğmesini buranın başına koyar. -->
      <div class="top"><a class="sc-marka" href="index.html"><span class="sc-lamba" aria-hidden="true"></span>tetikte</a></div>
    </div>
    <div class="sc-bas">
      <p class="sc-goz">Soru çöz</p>
      <h1>Hangi sınava hazırlanıyorsun?</h1>
      <p>Sınavını seç. Dersler sınavdaki ağırlığıyla sıralı; her sorunun her şıkkı gerekçesiyle, gerekçesi mevzuattaki maddesiyle.</p>
    </div>
    <div class="sc-sinavlar" id="scSinavlar" role="group" aria-label="Sınav seçimi">
      <div class="sc-yuk" style="color:var(--bz-ak-sonuk)">Sınavlar yükleniyor…</div>
    </div>
  </div>
</header>

<main class="sc-govde" id="icerik">
  <div id="scDersler"><div class="sc-yuk">Dersler yükleniyor…</div></div>
</main>

<script>
(function(){
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var sayi=function(n){return Number(n||0).toLocaleString('tr-TR');};
  var sinavlarEl=document.getElementById('scSinavlar'), derslerEl=document.getElementById('scDersler');
  var DIZIN=null, TAKVIM=null, SECILI=null, DENEME={};
  /* takvimdeki anahtar: dizin kodu -> sinav-takvimi.json sinavlar.<KOD> */
  var TAKVIM_KOD={sgs:'SGS', smmm:'SMMM', kgk:'KGK'};
  /* Alan Bilgisi 100 soru, Genel Kültür 20, Yabancı Dil 10 - büyükten küçüğe */
  var BOLUM_SIRA=['Alan Bilgisi','Genel Kültür ve Yetenek','Yabancı Dil'];

  function sonrakiSinav(kod){
    var s=TAKVIM&&TAKVIM.sinavlar&&TAKVIM.sinavlar[TAKVIM_KOD[kod]]; if(!s||!s.donemler) return null;
    var bugun=new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Istanbul'})); bugun.setHours(0,0,0,0);
    for(var i=0;i<s.donemler.length;i++){
      var d=s.donemler[i]; var t=new Date(d.tarih+'T00:00:00');
      if(t>=bugun) return {gun:Math.round((t-bugun)/86400000), yazi:d.tarihYazi};
    }
    return null;
  }

  function sinavlariCiz(){
    sinavlarEl.innerHTML=DIZIN.sinavlar.map(function(s){
      var acik=s.durum==='acik', ss=sonrakiSinav(s.kod);
      return '<button type="button" class="sc-sinav" data-kod="'+esc(s.kod)+'" aria-pressed="'+(s.kod===SECILI)+'">'
        +'<span class="sc-kod">'+esc(s.uzun)+'</span>'
        +'<span class="sc-ad">'+esc(s.ad)+'</span>'
        +'<span class="sc-say"><b>'+s.ders_sayisi+' ders</b>'+(acik?' · <b>'+sayi(s.soru)+'</b> çözümlü soru':'')+'</span>'
        +(ss?'<span class="sc-gun">Sınava '+ss.gun+' gün · '+esc(ss.yazi)+'</span>':'')
        +'<span class="sc-cip '+(acik?'acik':'hazir')+'">'+(acik?'Soru çözmeye hazır':'Hazırlanıyor')+'</span>'
        +'</button>';
    }).join('');
    sinavlarEl.querySelectorAll('.sc-sinav').forEach(function(b){
      b.addEventListener('click',function(){ sec(b.getAttribute('data-kod'), true); });
    });
  }

  function dersKart(d, sinavToplam, acik){
    /* yüzde = bu dersin sınavdaki soru payı (TESMER dağılımı; SGS'de toplam 130) */
    var pay=(d.sinav_soru>0&&sinavToplam>0)?' · %'+Math.round(100*d.sinav_soru/sinavToplam):'';
    var agirlik=(d.sinav_soru>0||d.soru)?'<span class="sc-agirlik">'
        +(d.sinav_soru>0?'<b>Sınavda '+d.sinav_soru+' soru'+pay+'</b>':'<span></span>')
        +(d.soru?'<span>'+sayi(d.soru)+' çözümlü soru</span>':'')+'</span>':'';
    var ic='<span><span class="sc-dad">'+esc(d.ad)+'</span>'+(d.alt?'<span class="sc-dalt" style="display:block">'+esc(d.alt)+'</span>':'')+'</span>'
      +'<span class="sc-git">'+(d.sayfa?'Çöz →':'Hazırlanıyor')+'</span>'+agirlik;
    return d.sayfa&&acik?'<a class="sc-ders" href="'+esc(d.sayfa)+'">'+ic+'</a>':'<div class="sc-ders kapali">'+ic+'</div>';
  }

  function dersleriCiz(){
    var s=DIZIN.sinavlar.filter(function(x){return x.kod===SECILI;})[0]; if(!s) return;
    var acik=s.durum==='acik';
    var sinavToplam=s.dersler.reduce(function(t,d){return t+(+d.sinav_soru||0);},0);
    var gruplar={}, sira=[];
    s.dersler.forEach(function(d){ var b=d.bolum||''; if(!gruplar[b]){ gruplar[b]=[]; sira.push(b); } gruplar[b].push(d); });
    sira.sort(function(a,b){ var ia=BOLUM_SIRA.indexOf(a), ib=BOLUM_SIRA.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
    /* 13.09 Cem "sınav gibi her dersten soru çıkacak bir şey": hazır set dizini varsa derslerin ÜSTÜNDE büyük kart */
    var dn=DENEME[s.kod];
    var denemeKart=(acik&&dn)?'<a class="sc-deneme" href="sinav-gibi.html"><span><span class="sc-deneme-et">Sınav gibi çöz</span>'
      +'<b>'+dn.toplam_soru+' soru · '+dn.sure_dk+' dakika · gerçek ders dağılımı</b>'
      +'<span class="sc-deneme-alt">Çözerken cevap görünmez; bitince ders ders karne ve her yanlışın Nöbetçi anlatımı. '+dn.set_sayisi+' set, aynı soru iki kez gelmez.</span></span>'
      +'<span class="sc-deneme-git">Başla →</span></a>':'';
    var h=denemeKart+'<div class="sc-gbas"><h2>'+esc(s.ad)+' · dersler</h2><span>'+esc(s.uzun)+'</span></div>'
      +'<p class="sc-aciklama">'+(acik
        ?'Dersi seç, sorular sınavdaki gibi gelsin. Yanlış yaparsan Nöbetçi adım adım anlatır; yanlışın kutuna düşer, 2 gün sonra karşına yeniden çıkar.'
        :'Bu sınavın soruları hakem ve çözüm kapılarından geçiyor. Açıldığında dersler burada, Staja Giriş\'teki gibi ders ders görünecek.')+'</p>';
    sira.forEach(function(b){
      var liste=gruplar[b].slice().sort(function(x,y){ return (y.sinav_soru-x.sinav_soru)||(y.soru-x.soru); });
      var toplam=liste.reduce(function(t,d){return t+d.sinav_soru;},0);
      var baslik=b?b.charAt(0).toLocaleUpperCase('tr')+b.slice(1):'';
      h+='<section class="sc-bolum">'+(sira.length>1&&baslik?'<h3>'+esc(baslik)+(toplam?'<s>· sınavda '+toplam+' soru</s>':'')+'</h3>':'')
        +'<div class="sc-dersler">'+liste.map(function(d){return dersKart(d,sinavToplam,acik);}).join('')+'</div></section>';
    });
    h+='<p class="sc-not">Sınavdaki soru sayıları TESMER yönergesindeki ders dağılımından; sınav tarihi TÜRMOB 2026 resmî takviminden. Çözümlü soru sayısı yayındaki sayfalardan her basımda yeniden sayılır.</p>';
    derslerEl.innerHTML=h;
  }

  function sec(kod, kullanici){
    if(!DIZIN||!DIZIN.sinavlar.some(function(s){return s.kod===kod;})) return;
    SECILI=kod;
    sinavlarEl.querySelectorAll('.sc-sinav').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-kod')===kod)); });
    dersleriCiz();
    try{ history.replaceState(null,'','#'+kod); }catch(e){}
    if(kullanici&&window.matchMedia('(max-width:900px)').matches){ document.getElementById('icerik').scrollIntoView({behavior:'smooth',block:'start'}); }
  }

  Promise.all([
    fetch('veri/soru-dizini.json',{cache:'no-store'}).then(function(y){return y.ok?y.json():null;}).catch(function(){return null;}),
    fetch('veri/sinav-takvimi.json',{cache:'no-store'}).then(function(y){return y.ok?y.json():null;}).catch(function(){return null;}),
    fetch('veri/deneme/sgs-dizin.json',{cache:'no-store'}).then(function(y){return y.ok?y.json():null;}).catch(function(){return null;})
  ]).then(function(r){
    DIZIN=r[0]; TAKVIM=r[1]; if(r[2]&&r[2].setler&&r[2].setler.length) DENEME[r[2].sinav]=r[2];
    if(!DIZIN||!DIZIN.sinavlar||!DIZIN.sinavlar.length){
      sinavlarEl.innerHTML=''; derslerEl.innerHTML='<p class="sc-yuk">Sınav listesi şu an okunamadı. Sayfayı yenilemeyi dene.</p>'; return;
    }
    var ilkAcik=(DIZIN.sinavlar.filter(function(s){return s.durum==='acik';})[0]||DIZIN.sinavlar[0]).kod;
    var istek=(location.hash||'').replace('#','');
    SECILI=DIZIN.sinavlar.some(function(s){return s.kod===istek;})?istek:ilkAcik;
    sinavlariCiz(); sec(SECILI,false);
  });
})();
</script>

<script src="menu.js" defer></script>
<link rel="stylesheet" href="komut.css">
<script src="komut.js" defer></script>
<link rel="stylesheet" href="stil-acik.css">
</body>
</html>
