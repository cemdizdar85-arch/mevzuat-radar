<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- 04.10.2026 (Cem "başlayalım", V2 madde 53): GitHub Pages bulunamayan HER adreste bu dosyayı o adreste sunar
     (ör. /kaydir/sgs/eski-sayfa.html) -> bütün bağlantılar KÖKTEN (/...) yazılır, göreli yol kırılır. -->
<script src="/tema-bas.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı | Tetikte</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/stil.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",system-ui,Roboto,Arial,sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:12vh 18px 90px}
.kod{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--amber);margin:0 0 6px}
h1{font-size:clamp(26px,5vw,34px);letter-spacing:-.6px;margin:0 0 10px}
p{color:var(--muted);font-size:16px;margin:0 0 22px}
.yollar{display:grid;gap:10px}
.yollar a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:12px 16px;border:1px solid var(--line2);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700;background:var(--kagit)}
.yollar a span{color:var(--muted);font-weight:500;font-size:14px}
.yollar a.ana{background:var(--amber-dolgu);color:var(--amber-uzeri);border-color:transparent}
.yollar a.ana span{color:var(--amber-uzeri)}
.yollar a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
</style>
</head>
<body>
<main class="wrap">
  <p class="kod">404</p>
  <h1>Bu sayfa burada yok.</h1>
  <p>Adres değişmiş ya da sayfa kaldırılmış olabilir. Aradığın şey büyük ihtimalle şunlardan biri:</p>
  <nav class="yollar" aria-label="Sık kullanılan sayfalar">
    <a class="ana" href="/seviye-testi.html">30 soruda seviyeni ölç <span>ücretsiz →</span></a>
    <a href="/sorular.html">Sınavlar ve sorular <span>→</span></a>
    <a href="/satin-al.html">Fiyatlar <span>→</span></a>
    <a href="/index.html">Ana sayfa <span>→</span></a>
  </nav>
</main>
<script>
/* Kırık bağlantıları görmek için sayaca yalnız istenen yol gider (kişi verisi yok). */
window.goatcounter={path:function(){ return '404'+location.pathname; }};
</script>
<script data-goatcounter="https://mevzuatradar.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<link rel="stylesheet" href="/stil-acik.css">
</body>
</html>
