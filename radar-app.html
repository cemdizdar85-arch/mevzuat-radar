// TELEFON: Türkiye cep hattı 0 ile başlar (05XX XXX XX XX = 11 hane). VKN/TCKN 0 ile
// başlamaz — bu ayrım karışıklığı önler. telSayi: ham 11 hane; telBicim: input'a
// otomatik 0 ekle + boşlukla grupla; telGecerli: 05 + 9 hane doğrula.
const telSayi=s=>{ let d=(s||'').replace(/\D/g,''); if(d.startsWith('90')) d=d.slice(2); if(d.length && d[0]!=='0' && d[0]==='5') d='0'+d; return d.slice(0,11); };
const telGecerli=s=>/^05\d{9}$/.test(telSayi(s));
function telBicim(el){ const d=telSayi(el.value); let f=d; if(d.length>4) f=d.slice(0,4)+' '+d.slice(4); if(d.length>7) f=d.slice(0,4)+' '+d.slice(4,7)+' '+d.slice(7); if(d.length>9) f=d.slice(0,4)+' '+d.slice(4,7)+' '+d.slice(7,9)+' '+d.slice(9); el.value=f; }
const trUp=s=>(s||'').replace(/i/g,'İ').replace(/ı/g,'I').toLocaleUpperCase('tr-TR');
let SECILI=null, IHALE=null, KARTLAR=null;
// KAPIYA GORE UYELIK (30.07 Cem): "adam GTIP icin uye olduysa GTIP'ini

  marka:   { baslik:'Firma unvanını gir, markalarını biz bulalım', alan:'f_marka', ipucu:'Marka adı yazmana gerek yok: robot unvanını TÜRKPATENT kayıtlarında arar, adına tescilli bütün markaları ve yenileme tarihlerini getirir (SMK m.23: koruma 10 yıl, yenileme son 6 ayda).' },
  musavir: { baslik:'İlk mükellefini ekle, her firmaya ayrı radar', alan:'f_ad', ipucu:'Mali müşavirsen tüm mükelleflerini tek panelde izlersin.' },
  ihale:   { baslik:'İlini ve sektörünü gir, ihaleler sana gelsin', alan:'f_il', ipucu:'İline çıkan ihaleler günlük tek özet mail olarak gelir; son teklif tarihi yaklaşanlar üstte.' },
  firsat:  { baslik:'İlini gir, icradan satış fırsatları sana gelsin', alan:'f_il', ipucu:'İlindeki icra ve açık artırma satışları (makine, stok, taşınmaz) panelde birikir; abonelikte günlük özet maille gelir.' },
  // TAM ABONELIK (30.07 Cem): "sinav harici HER SEYI isteyen olursa tum
  // bilgileri istememiz lazim." Dogru - ama anket gibi degil: her alanin
  // HANGI RADARI ACTIGI soylenir; bos birakilan alan = kapali radar,

  tam: { baslik:'Tam nöbet, firma profilini doldur, her alan bir radarı açar', alan:'f_ad', tam:true,
    ipucu:'Boş bıraktığın alanın radarı kapalı kalır; panelden sonra da açabilirsin. Defter/evrak tarafı (mükelleften evrak toplama + fiş üretimi) ayrı modüldür.' }
};
let NIYET = (new URLSearchParams(location.search).get('niyet')||'').toLowerCase();
if(NIYET && NIYETLER[NIYET]){ try{ localStorage.setItem('tetikteNiyet', NIYET); }catch(e){} }
else { try{ NIYET = localStorage.getItem('tetikteNiyet')||''; }catch(e){} }
const gtipNorm=s=>String(s==null?'':s).replace(/[^\d]/g,'');
function gtipEslesir(firmaKod, kartKod){ const a=gtipNorm(firmaKod), b=gtipNorm(kartKod); if(a.length<4||b.length<4) return false; const k=Math.min(a.length,b.length); return a.slice(0,k)===b.slice(0,k); }

    if(!data.session)$('#ahata').textContent='Kayıt alındı, giriş yapabilirsin.';

// 28.08: Supabase hatalari INGILIZCE geliyordu ("Invalid login credentials"),
// kullanici ne yapacagini anlamiyordu. Bilinen kodlar Turkcelestirilir;
// taninmayan hata OLDUGU GIBI gosterilir (yutulmaz - yoksa sessiz kalir).
function trHata(e){
  const k=(e&&(e.code||e.error_code))||'', m=(e&&e.message)||'';
  if(/invalid_credentials/i.test(k)||/invalid login/i.test(m)) return 'E-posta veya şifre hatalı. Henüz üye değilsen "Yeni üyelik"e bas.';
  if(/weak_password/i.test(k)||/at least 6/i.test(m))          return 'Şifre en az 6 karakter olmalı.';
  if(/user_already_exists/i.test(k)||/already registered/i.test(m)) return 'Bu e-posta zaten kayıtlı. "Giriş yap"ı dene.';
  if(/validation_failed/i.test(k)||/invalid.*email/i.test(m))   return 'E-posta adresi geçerli görünmüyor.';
  if(/email_not_confirmed/i.test(k))                            return 'E-postanı doğrulaman gerekiyor: gelen kutunu kontrol et.';
  if(/over_email_send_rate_limit|rate limit/i.test(k+m))        return 'Çok sık denendi. Bir dakika bekleyip tekrar dene.';
  if(/signup_disabled/i.test(k))                                return 'Yeni üyelik şu an kapalı.';
  if(/Failed to fetch|NetworkError/i.test(m))                   return 'Sunucuya ulaşılamadı. Bağlantını kontrol edip tekrar dene.';
  return m||'Beklenmeyen bir hata oldu, tekrar dene.';
}

async function app(){
  const {data:{user}}=await sb.auth.getUser();
  ustSag.innerHTML=`<span class="mini">${esc(user?.email||'')}</span> · <a href="#" id="cikis">çıkış</a>`;
  $('#cikis').onclick=e=>{e.preventDefault();sb.auth.signOut();};
  const {data:firmalar,error}=await sb.from('firmalar').select('*').order('created_at');
  if(error){ ekran.innerHTML=`<div class="kutu"><p class="hata">Tablo bulunamadı. Supabase'de radar-app/schema.sql'i çalıştır.</p><p class="mini">${esc(error.message)}</p></div>`; return; }
  if(!SECILI && firmalar.length) SECILI=firmalar[0].id;
  const sf=firmalar.find(f=>f.id===SECILI);
  // #4 MARKA WATCH: markana benzer yeni basvuru uyarilari (robot marka_uyari'ya yazar)
  let uyariBanner='';
  try{
    const {data:uy}=await sb.from('marka_uyari').select('*').eq('goruldu',false).order('created_at',{ascending:false}).limit(15);
    if(uy&&uy.length){
      uyariBanner=`<div style="background:rgba(255,107,94,.10);border:1px solid rgba(255,107,94,.4);border-radius:14px;padding:16px 18px;margin:0 0 18px">
        <div style="font-weight:800;color:var(--red);font-size:15px;margin-bottom:8px">🚨 ${uy.length} marka uyarısı</div>
        ${uy.map(u=>(['durum-degisikligi','yenileme','portfoy-yenileme','rakip-yeni'].indexOf(u.tip)>=0)
          ?`<div style="font-size:13px;color:var(--muted);margin-bottom:5px">${u.tip==='rakip-yeni'?'🎯':(u.tip==='durum-degisikligi'?'📌':'🔔')} <b style="color:var(--ink)">${esc(u.marka)}</b>${u.tip==='rakip-yeni'?' → yeni marka: ':': '}${esc(u.benzer_ad)}</div>`
          :`<div style="font-size:13px;color:var(--muted);margin-bottom:5px"><b style="color:var(--ink)">${esc(u.marka)}</b> ← <b style="color:var(--ink)">${esc(u.benzer_ad)}</b> <span class="mini">(başvuru ${esc(u.basvuru_no)}, %${u.risk} risk${u.sinif_cakisiyor?', sınıf çakışıyor':''}${u.tip==='benzer-intl'?', 🌍 '+esc(u.ofis||'yurt dışı'):''})</span></div>`).join('')}
        <div style="margin-top:8px;font-size:12.5px"><a href="marka-izleme.html" style="color:var(--accent2);font-weight:700">Detay + itiraz süresi →</a> <span class="mini">İtiraz süresi yayımdan 2 aydır (SMK m.18).</span></div>
      </div>`;
    }
  }catch(e){}
  // 20.08 UNVANDAN PORTFOY: robot (marka-portfoy-hasat.ps1) firma unvanini
  // TURKPATENT/TMview'de arayip butun markalari marka_portfoy'a yazar. Kullanici
  // tek marka girmemis olsa bile burada gorur - "senin 7 markan var" bandi.
  let portfoyBanner='', TARANMAMIS=[], RAKIPLER=[];
  try{
    const {data:pf}=await sb.from('marka_portfoy').select('unvan,marka_sayisi,tescilli,yenileme_yakin,ek_surede,dusmus,guncelleme');
    // 21.08: Henuz taranmamis firma unvanlari - kullanici ertesi gunu beklemesin,
    // dugmeye basinca kuyruga girer (marka_talep_ac), robot 5 dk icinde doldurur.
    const taranan=new Set((pf||[]).map(p=>(p.unvan||'').trim().toLowerCase()));
    TARANMAMIS=firmalar.filter(f=>f.firma_adi && !taranan.has(f.firma_adi.trim().toLowerCase()));
    if(pf&&pf.length){
      const acilToplam=pf.reduce((t,p)=>t+(p.yenileme_yakin||0)+(p.ek_surede||0),0);
      const markaToplam=pf.reduce((t,p)=>t+(p.marka_sayisi||0),0);
      if(markaToplam) portfoyBanner=`<div style="background:rgba(245,165,36,.08);border:1px solid rgba(245,165,36,.32);border-radius:14px;padding:16px 18px;margin:0 0 18px">
        <div style="font-weight:800;color:var(--accent2);font-size:15px;margin-bottom:8px">®️ Sicilde adına ${markaToplam} marka bulundu${acilToplam?` — ${acilToplam} tanesinin yenileme tarihi kapıda`:''}</div>
        ${pf.filter(p=>p.marka_sayisi).map(p=>`<div style="font-size:13px;color:var(--muted);margin-bottom:5px"><b style="color:var(--ink)">${esc(p.unvan)}</b>: ${p.marka_sayisi} marka · ${p.tescilli||0} tescilli${p.yenileme_yakin?` · <b style="color:var(--amber)">${p.yenileme_yakin} yenileme penceresi açık</b>`:''}${p.ek_surede?` · <b style="color:var(--red)">${p.ek_surede} ek sürede</b>`:''}${p.dusmus?` · ${p.dusmus} düşmüş`:''}</div>`).join('')}
        <div style="margin-top:8px;font-size:12.5px"><a href="marka-portfoy.html" style="color:var(--accent2);font-weight:700">Tarih takvimini aç →</a> <span class="mini">Koruma başvurudan 10 yıl, yenileme son 6 ayda (SMK m.23).</span></div>
      </div>`;
    }
    // 21.08 RAKIP NOBETI: rakibin unvanini ekle, yeni marka aldigi gun haber ver.
    try{
      const {data:rk}=await sb.from('marka_rakip').select('id,unvan,son_sayi,guncelleme,aktif').order('olusturma');

    }catch(e){ RAKIPLER=[]; }
    portfoyBanner += `<div class="kutu" style="margin:0 0 18px">
      <div style="font-weight:800;color:var(--accent2);font-size:15px;margin-bottom:6px">🎯 Rakip nöbeti${RAKIPLER.length?` (${RAKIPLER.length})`:''}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:9px">Rakibinin unvanını yaz; <b style="color:var(--ink)">sicilde yeni marka aldığı gün</b> haber verelim. Yayımlanan başvuruya itiraz süresi yayımdan 2 aydır (SMK m.18) — kaçırılan süre geri gelmiyor.</div>
      ${RAKIPLER.map(r=>`<div style="font-size:13px;color:var(--muted);margin-bottom:5px" data-rid="${r.id}"><b style="color:var(--ink)">${esc(r.unvan)}</b> <span class="mini">${r.guncelleme?`son bakış ${new Date(r.guncelleme).toLocaleDateString('tr-TR')} · ${r.son_sayi||0} kayıt`:'ilk tarama sırada'}</span> <a href="#" class="rakipSil" data-rid="${r.id}" style="color:var(--dim);font-size:12px">· kaldır</a></div>`).join('')}
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input class="gir" id="rakipUnvan" placeholder="ör. RAKİP SANAYİ VE TİCARET A.Ş." style="flex:1;min-width:220px"><button class="btn sm" id="rakipEkle">Nöbete al</button></div>
      <div id="rakipOut" class="mini" style="margin-top:8px"></div>
    </div>`;
    if(TARANMAMIS.length){
      portfoyBanner += `<div class="kutu" style="margin:0 0 18px">
        <div style="font-weight:800;color:var(--accent2);font-size:15px;margin-bottom:6px">®️ ${TARANMAMIS.length} firmanın markaları henüz taranmadı</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:9px">TÜRKPATENT kayıtlarına bakalım: adına kaç marka var, hangisinin <b style="color:var(--ink)">yenileme penceresi açıldı</b>, hangisi düşmüş. Marka adı girmene gerek yok, unvan yetiyor.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${TARANMAMIS.map(f=>`<button class="btn ghost sm mtara" data-unvan="${esc(f.firma_adi)}">${esc(f.firma_adi)} → sicilde ara</button>`).join('')}</div>
        <div id="mtaraOut" class="mini" style="margin-top:9px"></div>
      </div>`;
    }
  }catch(e){}
  // 21.08 DESTEK TAKIBI (Cem "buraya tasisak"): destekler.html'deki girissiz
  // kayit kutusunun UYE YUZU. AYNI tablo (destek_takip), AYNI robot - ikinci
  // bir abone listesi acilmadi. Kural destek-kural.js'ten gelir, kopya YOK.
  // RLS: select politikasi auth.uid()=user_id, yani burada yalniz KENDI satirin
  // gorunur; vitrinden gelen anonim kayitlar (user_id NULL) kimseye gorunmez.
  const dkVar = typeof window.destekKurumlari === 'function';
  let DESTEK=null, DESTEK_GONDERIM=[], destekBanner='';
  if(dkVar){
    try{
      const {data:dt}=await sb.from('destek_takip').select('*').eq('aktif',true).order('olusturma',{ascending:false}).limit(1);
      DESTEK=(dt&&dt.length)?dt[0]:null;
      if(DESTEK){
        const {data:du}=await sb.from('destek_uyari').select('kurum,baslik,cagri_url,son_tarih').eq('mail_gitti',true).order('olusturma',{ascending:false}).limit(5);
        DESTEK_GONDERIM=du||[];
      }
    }catch(e){}
    destekBanner = DESTEK
      ? `<div class="kutu" style="margin:0 0 18px">
          <div style="font-weight:800;color:var(--accent2);font-size:15px;margin-bottom:6px">Destek takibin açık</div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:8px">İzlenen kurumlar: <b style="color:var(--ink)">${(DESTEK.kurumlar||[]).map(esc).join(' · ')||'—'}</b>${DESTEK.ab?' <span class="mini">+ AB</span>':''}</div>
          ${DESTEK_GONDERIM.length
            ? `<div style="font-size:12.5px;color:var(--dim);margin-bottom:5px">Sana gönderilen son çağrılar:</div>`+DESTEK_GONDERIM.map(g=>`<div style="font-size:13px;color:var(--muted);margin-bottom:4px"><b style="color:var(--ink)">${esc(g.kurum)}</b> · <a href="${esc(g.cagri_url)}" target="_blank" rel="noopener">${esc(g.baslik)}</a>${g.son_tarih?` <span class="mini">son ${esc(g.son_tarih)}</span>`:''}</div>`).join('')
            : `<p class="mini">Henüz çağrı gönderilmedi. Robot her sabah bakıyor; bu kurumlardan yeni çağrı düştüğü gün mail gelir. Sessizlik, o kurumlardan yeni çağrı çıkmadığı anlamına gelir.</p>`}
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn ghost sm" id="destekDegistir">Profili değiştir</button>
            <button class="btn ghost sm" id="destekKapat">Bildirimi kapat</button>
          </div>
          <div id="destekForm" class="gizli" style="margin-top:12px"></div>
        </div>`
      : `<div class="kutu" style="margin:0 0 18px">
          <div style="font-weight:800;color:var(--accent2);font-size:15px;margin-bottom:6px">Destek takibi kurulu değil</div>
          <div style="font-size:13px;color:var(--muted);margin-bottom:8px">5 soru cevapla; sana açık kurumlardan (KOSGEB, TÜBİTAK, kalkınma ajansı…) <b style="color:var(--ink)">yeni çağrı düştüğü gün</b> mail atalım. <a href="destekler.html">Destek Radarı</a>'ndaki listenin kişiye özel nöbeti.</div>
          <button class="btn sm" id="destekKur">Takibi kur</button>
          <div id="destekForm" class="gizli" style="margin-top:12px"></div>
        </div>`;
  }
  ekran.innerHTML=`
    <h1>Benim Mevzuatım</h1>
    ${uyariBanner}
    ${portfoyBanner}
    ${destekBanner}
    <p class="lead">Firmalarını ekle, her birine özel radar çalışsın. Mali müşavirsen tüm mükelleflerini buraya gir.</p>
    <h2>Firmalarım (${firmalar.length})</h2>
    <div id="firmaListe">${firmalar.map(f=>`
      <div class="firmakart ${f.id===SECILI?'sec':''}" data-id="${f.id}">
        <h3>${esc(f.firma_adi)}</h3>
        <div class="ozet">${esc(f.rol||'—')} · ${esc(f.il||'il yok')} · ${(f.gtip_kodlari||[]).length} GTİP · ${(f.markalar||[]).length} marka</div>
      </div>`).join('') || '<p class="mini">Henüz firma yok, aşağıdan ekle.</p>'}
    </div>
    <button class="btn ghost sm" id="yeniFirma">+ Firma ekle</button>
    <div id="formAlan" class="gizli"></div>
    <div id="pano"></div>`;
  document.querySelectorAll('.firmakart').forEach(k=>k.onclick=()=>{SECILI=k.dataset.id;app();});
  $('#yeniFirma').onclick=()=>firmaForm();
  // Rakip nobeti: ekle / kaldir
  const rEkle=$('#rakipEkle');
  if(rEkle) rEkle.onclick=async()=>{
    const unvan=($('#rakipUnvan').value||'').trim(), out=$('#rakipOut');
    if(unvan.length<3){ out.innerHTML='<span style="color:var(--red)">Rakibin unvanını yaz (en az 3 karakter).</span>'; return; }
    rEkle.disabled=true; out.textContent='Ekleniyor…';
    const {data:{user}}=await sb.auth.getUser();
    const {error}=await sb.from('marka_rakip').insert({ user_id:user.id, unvan });
    rEkle.disabled=false;
    if(error){ out.innerHTML='<span style="color:var(--red)">'+esc(error.message)+'</span>'; return; }
    // ilk taramayi hemen kuyruga at ki kullanici bugun de gorsun (nobet yarindan itibaren fark bildirir)
    try{ await talepAc(unvan); }catch(e){}
    app();
  };
  document.querySelectorAll('.rakipSil').forEach(a=>a.onclick=async e=>{
    e.preventDefault();
    if(!confirm('Bu rakip nöbetten çıkarılsın mı?')) return;
    await sb.from('marka_rakip').delete().eq('id', a.dataset.rid);
    app();
  });
  // Sicil taramasini kuyruga at (TMview CORS'a kapali, sorguyu robot yapar).
  document.querySelectorAll('.mtara').forEach(b=>b.onclick=async()=>{
    const out=$('#mtaraOut'); b.disabled=true; out.textContent='Sıraya alınıyor…';
    const {error}=await talepAc(b.dataset.unvan);
    if(error){ out.innerHTML=`<span style="color:var(--red)">Olmadı: ${esc(error.message)}</span>`; b.disabled=false; return; }
    b.textContent=b.dataset.unvan+' → sırada ⏳';
    // Ölçüm (21.08): GitHub Actions cron'u */5 yazılsa da yoğunlukta 30-50 dk
    // gecikmeyle koşuyor. "5 dakika" demek yanlış söz olurdu.
    out.innerHTML='Tarama sıraya girdi. Kuyruğu işleyen robot <b style="color:var(--ink)">genelde yarım saat içinde</b> bakıyor; sonuç bu sayfada kendiliğinden belirir. Sayfayı kapatabilirsin, kayıt duruyor.';
    setTimeout(()=>app(), 90000);
  });
  // ---- destek takibi: form + kaydet + kapat ----
  if(dkVar){
    const destekForm=()=>{
      const cev=Object.assign({}, (DESTEK&&DESTEK.profil)||{});
      const f=$('#destekForm'); f.classList.remove('gizli');
      const ciz=()=>{
        f.innerHTML=window.DESTEK_SORULAR.map(s=>`
          <div style="margin-bottom:10px">
            <div style="font-size:13px;font-weight:700;margin-bottom:5px">${esc(s.ad)}</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">${s.se.map(o=>`<button class="btn ghost sm dsec" data-k="${s.k}" data-v="${o[0]}"${cev[s.k]===o[0]?' style="border-color:var(--accent2);color:var(--accent2)"':''}>${esc(o[1])}</button>`).join('')}</div>
          </div>`).join('')
          +`<label style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:10px 0"><input type="checkbox" id="destekAb"${(DESTEK&&DESTEK.ab)?' checked':''} style="width:auto;accent-color:var(--accent)"> AB çağrıları da gelsin <span class="mini">(hacim yüksek, dosya aylar sürer)</span></label>`
          +`<div id="destekKapsam" style="font-size:12.5px;margin:8px 0"></div>`
          +`<div style="display:flex;gap:8px"><button class="btn sm" id="destekKaydet">Kaydet</button><button class="btn ghost sm" id="destekVaz">Vazgeç</button></div>`
          +`<div class="hata" id="destekHata"></div>`;
        // Kaydetmeden ÖNCE ne izleneceğini göster - kapalı kutu satmayız.
        const kp=$('#destekKapsam');
        if(window.destekProfilDolu(cev)){
          const acik=window.destekKurumlari(cev), kapali=window.destekKapaliKurumlar(cev);
          kp.innerHTML=`<b style="color:var(--green)">İzlenecek:</b> <b style="color:var(--ink)">${acik.map(esc).join(' · ')}</b>`
            +(kapali.length?` <span class="mini">· izlenmeyecek: ${kapali.map(esc).join(', ')}</span>`:'');
        } else kp.innerHTML=`<span class="mini">Beş soruyu da cevapla; izlenecek kurumları burada göstereceğim.</span>`;
        f.querySelectorAll('.dsec').forEach(b=>b.onclick=()=>{ cev[b.dataset.k]=b.dataset.v; ciz(); });
        $('#destekVaz').onclick=()=>{ f.classList.add('gizli'); f.innerHTML=''; };
        $('#destekKaydet').onclick=async()=>{
          const h=$('#destekHata');
          if(!window.destekProfilDolu(cev)){ h.textContent='Beş sorunun hepsini cevapla.'; return; }
          const kayit={ email:user.email, profil:cev, kurumlar:window.destekKurumlari(cev),
                        ab:$('#destekAb').checked, user_id:user.id, aktif:true };
          const {error} = DESTEK
            ? await sb.from('destek_takip').update(kayit).eq('id',DESTEK.id)
            : await sb.from('destek_takip').insert(kayit);
          if(error){ h.textContent=error.message; return; }
          app();
        };
      };
      ciz();
    };
    if($('#destekKur')) $('#destekKur').onclick=destekForm;
    if($('#destekDegistir')) $('#destekDegistir').onclick=destekForm;
    if($('#destekKapat')) $('#destekKapat').onclick=async()=>{
      if(!confirm('Destek bildirimlerini kapatmak istediğine emin misin? Profilin silinmez, istediğinde yeniden açarsın.')) return;
      const {error}=await sb.from('destek_takip').update({aktif:false}).eq('id',DESTEK.id);
      if(error){ alert(error.message); return; }
      app();
    };
  }
  // KAPIYA GORE UYELIK: panel bosken kullaniciyi bos ekranla karsilamak
  // yerine ilk soru KENDILIGINDEN acilir - niyetine gore odaklanmis halde.
  if(!firmalar.length){ firmaForm(); }
  if(sf) pano(sf);
}

function firmaForm(){
  const fa=$('#formAlan'); fa.classList.remove('gizli');
  const ny = NIYETLER[NIYET];
  const baslik = ny ? ny.baslik : 'Firma ekle';
  // tam abonelikte "hangi alan hangi radari acar" haritasi acikca gosterilir
  const tamLejant = (ny && ny.tam) ? `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:0 0 12px">
      ${[['İl','ihale radarı'],['GTİP kodları','Resmî Gazete radarı'],['Markalar','yenileme nöbeti'],['Borçlu VKN','alacak radarı'],['Telefon','SMS/WhatsApp uyarısı']]
        .map(x=>`<span style="font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 10px"><b style="color:var(--accent2)">${x[0]}</b> → ${x[1]}</span>`).join('')}
    </div>` : '';
  const ipucu = ny ? `<div style="font-size:12.5px;color:var(--muted);margin:0 0 10px">${esc(ny.ipucu)}${ny.tam?'':' <span style="color:var(--dim)">Kalanını sonra panelden tamamlarsın, şimdilik yalnız firma adı yeter.</span>'}</div>${tamLejant}` : '';
  fa.innerHTML=`<div class="kutu">
    <h3 style="margin:0 0 4px;font-size:16px">${esc(baslik)}</h3>
    ${ipucu}
    <div class="grid2">
      <div class="alan" data-a="f_ad"><label>Firma adı *</label><input id="f_ad" placeholder="ör. Ege Seramik Ltd."></div>
      <div class="alan" data-a="f_rol"><label>Rol</label><select id="f_rol"><option value="ithalatci">İthalatçı</option><option value="ihracatci">İhracatçı</option><option value="uretici">Üretici</option><option value="tuccar">Tüccar</option><option value="musteri">Müşavir müşterisi</option></select></div>
      <div class="alan" data-a="f_il"><label>İl</label><input id="f_il" placeholder="ör. İzmir"></div>
      <div class="alan" data-a="f_sektor"><label>Sektör</label><input id="f_sektor" placeholder="ör. seramik, tekstil"></div>
    </div>
    <div class="alan" data-a="f_gtip"><label>GTİP kodların <span class="mini">(virgülle: 6907.21, 8471.30)</span></label><textarea id="f_gtip" placeholder="6907.21.00, 6907.22.00"></textarea></div>
    <div class="alan" data-a="f_marka"><label>Markaların <span class="mini">(virgülle · boş bırakabilirsin)</span></label><textarea id="f_marka" placeholder="ABC, 2016/12345"></textarea><div class="mini" style="margin-top:4px">Yazmasan da olur: robot <b>firma unvanını</b> TÜRKPATENT kayıtlarında arayıp adına tescilli bütün markaları ve yenileme tarihlerini kendisi bulur.</div></div>
    <div class="alan" data-a="f_vkn"><label>İzlenecek borçlu VKN'leri <span class="mini">(alacak radarı, virgülle)</span></label><textarea id="f_vkn" placeholder="1234567890, 9876543210"></textarea></div>
    <div class="grid2">
      <div class="alan" data-a="f_kanal"><label>Uyarı kanalı</label><select id="f_kanal"><option value="mail">E-posta</option><option value="sms">SMS</option><option value="whatsapp">WhatsApp</option></select></div>
      <div class="alan" data-a="f_tel"><label>Telefon <span class="mini">(SMS/WhatsApp için, 0 ile başlar)</span></label><input id="f_tel" type="tel" inputmode="numeric" maxlength="14" placeholder="05xx xxx xx xx" oninput="telBicim(this)"></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px"><button class="btn" id="kaydet">Kaydet</button><button class="btn ghost" id="iptal">Vazgeç</button></div>
    <div class="hata" id="fhata"></div>
  </div>`;
  // niyet alani vurgulanir ve imlec oraya gider - "hangi soruyu soracagiz"
  // tartismasi bitti: geldigi kapi neyse soru o.
  if(ny){
    const alanEl = document.getElementById(ny.alan);
    if(alanEl){
      alanEl.style.borderColor='var(--accent)';
      alanEl.style.boxShadow='0 0 0 3px rgba(245,165,36,.18)';
      setTimeout(()=>{ alanEl.focus(); alanEl.scrollIntoView({behavior:'smooth',block:'center'}); },150);
    }
  }
  // Niyete gore ALANLARI BUDA: her radar yalniz kendi sorusunu sorsun (Cem 15.08:
  // "alacaga uye olan marka/GTIP gormesin, ne isteyeceksek onu"). tam/musavir/
  // niyetsiz = HEPSI gorunur (bilincli, tam profil). Gizli alan bos gider = kapali radar.
  const NIYET_ALAN = {
    alacak: ['f_ad','f_vkn','f_kanal','f_tel'],
    gtip:   ['f_ad','f_rol','f_sektor','f_gtip','f_kanal','f_tel'],
    marka:  ['f_ad','f_marka','f_kanal','f_tel'],
    ihale:  ['f_ad','f_il','f_sektor','f_kanal','f_tel'],
    firsat: ['f_ad','f_il','f_kanal','f_tel']
  };
  const izin = NIYET_ALAN[NIYET];
  if(izin){ fa.querySelectorAll('.alan').forEach(w=>{ if(izin.indexOf(w.dataset.a)<0) w.style.display='none'; }); }
  $('#iptal').onclick=()=>{fa.classList.add('gizli');fa.innerHTML='';};
  $('#kaydet').onclick=async()=>{
    const ad=$('#f_ad').value.trim(); if(!ad){$('#fhata').textContent='Firma adı gerekli.';return;}
    const kanal=$('#f_kanal').value, telHam=$('#f_tel').value.trim();
    // SMS/WhatsApp kanalı seçiliyse telefon zorunlu ve geçerli cep olmalı (0 ile başlar)
    if((kanal==='sms'||kanal==='whatsapp') && !telGecerli(telHam)){ $('#fhata').textContent='SMS/WhatsApp için geçerli cep numarası gir (0 ile başlar, 11 hane, ör. 0532 123 45 67).'; return; }
    if(telHam && !telGecerli(telHam)){ $('#fhata').textContent='Telefon 0 ile başlamalı ve 11 hane olmalı (ör. 0532 123 45 67).'; return; }
    const {data:{user}}=await sb.auth.getUser();
    const kayit={ user_id:user.id, email:user.email, firma_adi:ad, rol:$('#f_rol').value, il:$('#f_il').value.trim(), sektor:$('#f_sektor').value.trim(),
      gtip_kodlari:arr($('#f_gtip').value), markalar:arr($('#f_marka').value), borclu_vkn:arr($('#f_vkn').value),
      kanal:kanal, telefon:telHam?telSayi(telHam):null };
    const {data,error}=await sb.from('firmalar').insert(kayit).select().single();
    if(error){$('#fhata').textContent=error.message;return;}
    // 21.08: Firma eklenir eklenmez sicil taramasini kuyruga at - kullanici
    // "kaydettim ama hicbir sey olmadi" hissi yasamasin. Robot 5 dk icinde
    // marka_portfoy'u doldurur, panel bandi kendiliginden gelir.
    try{ await talepAc(ad); }catch(e){}
    SECILI=data.id; app();
  };
}

async function pano(f){
  const p=$('#pano');
  const gtipChips=(f.gtip_kodlari||[]).map(g=>`<span class="chip">${esc(g)}</span>`).join('')||'<span class="mini">yok</span>';
  const markaChips=(f.markalar||[]).map(m=>`<span class="chip" style="font-family:inherit">${esc(m)}</span>`).join('')||'<span class="mini">yok</span>';
  // canlı ihale eşleşmesi (il'e göre)
  if(!IHALE){ try{ IHALE=await (await fetch('veri/ihale-yurtici.json?cb='+Date.now())).json(); }catch(e){ IHALE={ilanlar:[]}; } }
  const ilU=trUp(f.il);
  // 31.07: havuz artik hasat robotunda slug ile temizleniyor (yalniz ihale-duyurulari);
  // uyelik sozu "panelde HEPSINI gorursun" - 4'luk kirpma kaldirildi (emniyet tavani 40).
  const ihaleMi=x=>("/"+(x.url||"")).split("/").pop().indexOf('ihale-duyurulari')===0 || !!x.tur;
  const TUR_AD={mal:'Mal alımı',hizmet:'Hizmet alımı',yapim:'Yapım-inşaat'};
  const eslesen=(IHALE.ilanlar||[]).filter(x=> ihaleMi(x) && ilU && trUp(x.il)===ilU ).slice(0,40);
  const ihaleHtml = eslesen.length
    ? eslesen.map(x=>`<div class="radar-kart eslesme"><h4>${esc(x.baslik)}</h4><p>${esc(x.kurum||'')} · ${esc(x.il||'')}${TUR_AD[x.tur]?' · '+TUR_AD[x.tur]:''} · ${esc(x.tarih||'')} · <a href="${esc(x.url)}" target="_blank" rel="noopener">ilan →</a></p></div>`).join('')
    : `<div class="radar-kart"><p>${ilU?('“'+esc(f.il)+'” için bugün eşleşen ihale yok, robot her gün tarar.'):'İl gir, sana uygun ihaleleri gösterelim.'}</p></div>`;

  // ESKI -> YENI SERIDI (17.08). Firma kendi GTIP'ine dokunan degisiklikte
  // "eskiden neydi"yi burada gorur. Yuzde BURADA hesaplanir, modele sorulmaz;
  // sayinin yaninda TANINAN BIR BIRIM yoksa yuzde yazilmaz - "(II/C/6.3.)"
  // gibi bolum atiflarindan sahte artis uretilmesin diye. Eski deger hic
  // yoksa uydurulmaz, onceki resmi belgenin linki verilir.
  const _BIRIM=/(-?\d{1,3}(?:\.\d{3})*(?:,\d+)?|-?\d+(?:,\d+)?)\s*(%|ABD|USD|Dolar|Avro|Euro|EUR|TL|kg|Kg|KG|ton|adet)\b/;
  const _sayi=s=>{const t=String(s||'');if(t.indexOf('(')>=0||t.indexOf(')')>=0)return null;const m=t.match(_BIRIM);if(!m)return null;const v=parseFloat(m[1].replace(/\./g,'').replace(',','.'));return isFinite(v)?v:null;};
  const _birim=s=>{const m=String(s||'').match(_BIRIM);return m?m[2].toLowerCase():null;};
  function degisimSerit(k){
    const ey=(k.eski_yeni||[]).filter(r=>r&&r.eski&&r.yeni);
    const onc=k.onceki_belge;
    const oncH=onc?`<p style="font-size:11.5px;opacity:.75">Bu tebliğin bir önceki hâli: <a href="${esc(onc.url)}" target="_blank" rel="noopener">${esc(onc.tarih)} tarihli RG</a> (Tebliğ ${esc(onc.teblig_no)})</p>`:'';
    if(!ey.length) return oncH;
    return oncH+ey.slice(0,3).map(r=>{
      const a=_sayi(r.eski), b=_sayi(r.yeni); let o='';
      if(a!==null&&b!==null&&a!==0&&_birim(r.eski)===_birim(r.yeni)){
        const p=Math.round((b-a)/Math.abs(a)*100);
        if(p!==0) o=` <b style="color:${p>0?'var(--red)':'var(--green)'}">${p>0?'▲':'▼'}%${Math.abs(p)}</b>`;
      }
      return `<p style="font-size:12px;font-variant-numeric:tabular-nums"><span style="opacity:.6">${esc(r.konu||'')}</span><br><s style="opacity:.55">${esc(r.eski)}</s> → <b>${esc(r.yeni)}</b>${o}</p>`;
    }).join('');
  }

  // canlı RG kartı ↔ GTİP eşleşmesi
  if(!KARTLAR){ try{ KARTLAR=await (await fetch('veri/kartlar-guncel.json?cb='+Date.now())).json(); }catch(e){ KARTLAR={kartlar:[]}; } }
  const fgtip=f.gtip_kodlari||[];
  const kartEslesen=(KARTLAR.kartlar||[]).filter(k=> fgtip.some(fk=> (k.gtip||[]).some(kk=> gtipEslesir(fk,kk)) )).slice(0,5);
  const yon=v=>({'ithalatci aleyhine':['var(--red)','⚠ aleyhine'],'ithalatci lehine':['var(--green)','✓ lehine'],'karisik':['var(--amber)','~ karışık']})[(v||'').replace(/İ/g,'i').toLowerCase()]||['var(--dim)',''];
  const kartHtml = kartEslesen.length
    ? kartEslesen.map(k=>{const y=yon(k.etki);return `<div class="radar-kart eslesme"><h4>${esc(k.baslik)}</h4><p>${esc(k.ne_oldu||'').slice(0,150)} ${k.etki?`<b style="color:${y[0]}">${y[1]}</b>`:''} · <a href="${esc(k.url)}" target="_blank" rel="noopener">tebliğ →</a></p>${degisimSerit(k)}</div>`;}).join('')
    : `<div class="radar-kart"><p>${fgtip.length?('GTİP kodlarına ('+fgtip.slice(0,3).join(', ')+'…) bugün dokunan değişiklik yok, robot her sabah tarar.'):'GTİP kodlarını gir, seni ilgilendiren mevzuat değişikliklerini burada gör.'}</p></div>`;

  // robotun yazdığı uyarılar
  let uyarilar=[]; try{ const {data}=await sb.from('firma_uyarilari').select('*').eq('firma_id',f.id).order('created_at',{ascending:false}).limit(10); uyarilar=data||[]; }catch(e){}
  const uyariHtml = uyarilar.length
    ? uyarilar.map(u=>`<div class="radar-kart ${u.onem==='yuksek'?'eslesme':'akt'}"><span class="durum ${u.okundu?'d-bek':'d-akt'}">${u.okundu?'okundu':'● YENİ'} · ${esc(u.tur||'')}</span><h4>${esc(u.baslik)}</h4><p>${esc(u.detay||'')} ${u.url?`· <a href="${esc(u.url)}" target="_blank" rel="noopener">aç →</a>`:''}</p></div>`).join('')
    : '';

  p.innerHTML=`
    ${uyarilar.length?`<h2>Radar uyarıların (${uyarilar.length})</h2>${uyariHtml}`:''}
    <h2>${esc(f.firma_adi)}, profil</h2>
    <div class="kutu">
      <div class="ozet mini">${esc(f.rol||'—')} · ${esc(f.il||'il yok')} · ${esc(f.sektor||'')}</div>
      <label style="margin-top:12px">GTİP kodların</label><div>${gtipChips}</div>
      <label style="margin-top:10px">Markaların</label><div>${markaChips}</div>
      <label style="margin-top:10px">İzlenen borçlu VKN</label><div>${(f.borclu_vkn||[]).length?f.borclu_vkn.map(v=>`<span class="chip">${esc(v)}</span>`).join(''):'<span class="mini">yok</span>'}</div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="silFirma">Firmayı sil</button></div>
    </div>

    <h2>Bugün seni ilgilendiren mevzuat (RG)</h2>
    ${kartHtml}

    <h2>🇹🇷 Sana uygun güncel ihaleler${eslesen.length?` (${eslesen.length})`:''}</h2>
    ${ihaleHtml}

    <h2>İzlenen radarların</h2>
    <div class="radar-kart ${(f.gtip_kodlari||[]).length?'akt':''}"><span class="durum ${(f.gtip_kodlari||[]).length?'d-akt':'d-bek'}">${(f.gtip_kodlari||[]).length?'● AKTİF':'○ GTİP GİR'}</span><h4>Mevzuat / RG radarı</h4><p>GTİP kodlarına dokunan Resmî Gazete değişikliği çıkınca hap kart + uyarı gelir.</p></div>
    <div class="radar-kart ${(f.markalar||[]).length?'akt':''}"><span class="durum ${(f.markalar||[]).length?'d-akt':'d-bek'}">${(f.markalar||[]).length?'● AKTİF':'○ MARKA GİR'}</span><h4>Marka radarı</h4><p>Yenileme 6 ay kala + benzer başvuru çıkınca uyarı.</p></div>
    <div class="radar-kart ${(f.borclu_vkn||[]).length?'akt':''}"><span class="durum ${(f.borclu_vkn||[]).length?'d-akt':'d-bek'}">${(f.borclu_vkn||[]).length?'● AKTİF':'○ VKN GİR'}</span><h4>Alacak radarı</h4><p>İzlediğin borçlu konkordato/iflas ilan ederse 15 günlük süreyle uyarı.</p></div>
    <div class="radar-kart akt"><span class="durum d-akt">● AKTİF</span><h4>Süre & belge radarı</h4><p>DİİB/KDV/SGK süreleri + belge geçerlilikleri için <a href="belge-kasasi.html">Belge Kasası</a>.</p></div>
    <p class="mini" style="margin-top:12px">Uyarılar <b>${esc(f.kanal||'mail')}</b> ile gönderilecek. Robot bildirim motoru yakında; şimdilik pano canlı eşleşmeyi gösterir.</p>`;
  $('#silFirma').onclick=async()=>{ if(!confirm('Bu firmayı silmek istediğine emin misin?'))return; await sb.from('firmalar').delete().eq('id',f.id); SECILI=null; app(); };
}
</script>
