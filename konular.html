  var q=new URLSearchParams(location.search), dersQ=(q.get('ders')||'').replace(/[^a-z0-9-]/g,'');

    if(!HAVUZ||!KANIT){ $('kListe').innerHTML='<p class="bos">Konu listesi şu an okunamadı. Sayfayı yenile.</p>'; return; }

    $('kDersler').innerHTML=DL.map(function(x){ return '<a href="konular.html?ders='+esc(x.kod)+'"'+(x===D?' aria-current="page"':'')+'>'+esc(x.ad)+'</a>'; }).join('');

    var H=HAVUZ.dersler[D.ad], KN=(KANIT.dersler&&KANIT.dersler[D.ad])||{};

      var kn=KN[ad]||[], dm={}, sira=[]; kn.forEach(function(p){ if(!dm[p[0]]){ dm[p[0]]=[]; sira.push(p[0]); } dm[p[0]].push(p[1]); });
      sira.sort(function(a,b){ return b.localeCompare(a,'tr',{numeric:true}); });

     12.10'dan beri var: süre işler, cevaplar sonda, bitince puan + konu karnesi). Süre: Yeterlilik'te 20 soru 45 dk → soru başı 2,25 dk. */
  /* 24.11 Cem 'sayacı ekle': seçim penceresi açıldı / hangi yol + kaç soru seçildi / kapatıldı (goatcounter olayı; kişi verisi yok) */
  var say=function(yol,bas){ try{ var gc=window.goatcounter; if(gc&&typeof gc.count==='function') gc.count({path:yol,title:bas,event:true}); }catch(e){} };
  var SECIM={href:'',ad:'',ders:'',mod:'ogren'}; try{ if(localStorage.getItem('kn_mod')==='sinav') SECIM.mod='sinav'; }catch(e){}
  function secimCiz(){ var son='10'; try{ son=localStorage.getItem('kn_adet')||'10'; }catch(e){}
    var sn=SECIM.mod==='sinav';
    document.querySelectorAll('#kSecim .mod button').forEach(function(b){ b.setAttribute('aria-pressed',String(b.getAttribute('data-m')===SECIM.mod)); });
    $('kSecimAlt').textContent=sn?'Süre işler, cevaplar sonda açılır; bitince puanın (baraj 50) ve her yanlışın anlatımı gelir.':'Her cevabından hemen sonra doğrusu ve nedeni açılır; bitince puanını görürsün, istersen sonraki sete geçersin.';
    $('kSecimSay').innerHTML=['5','10','20'].map(function(n){
      var h=sn?'sinav-gibi.html?tur=ders&sinav=smmm&ders='+encodeURIComponent(SECIM.ders)+'&konu='+encodeURIComponent(SECIM.ad)+'&adet='+n:SECIM.href+'&adet='+n;
      var alt=sn?Math.round(n*2.25)+' dk süre':'≈ '+n+' dk';
      return '<a href="'+esc(h)+'" data-a="'+n+'"'+(n===son?' class="son"':'')+'><b>'+n+'</b><small>soru · '+alt+'</small></a>'; }).join(''); }
  function secimAc(href,ad){ SECIM.href=href; SECIM.ad=ad; SECIM.ders=($('kBas').textContent||'');
    $('kSecimBas').textContent=ad?buyuk(ad)+' · kaç soru çözelim?':'Kaç soru çözelim?';
    secimCiz(); $('kSecim').hidden=false; say('konu/secim/acildi','Konu: kaç soru penceresi açıldı'); try{ $('kSecimSay').querySelector('.son').focus(); }catch(e){} }
  document.querySelector('#kSecim .mod').addEventListener('click',function(e){ var b=e.target.closest('button[data-m]'); if(!b) return; SECIM.mod=b.getAttribute('data-m'); try{ localStorage.setItem('kn_mod',SECIM.mod); }catch(x){} secimCiz(); });
  $('kSecimSay').addEventListener('click',function(e){ var a=e.target.closest('a[data-a]'); if(a){ try{ localStorage.setItem('kn_adet',a.getAttribute('data-a')); }catch(x){} say('konu/secim/'+SECIM.mod+'/'+a.getAttribute('data-a'),'Konu: '+(SECIM.mod==='sinav'?'sınav gibi':'öğrenerek')+' '+a.getAttribute('data-a')+' soru'); } });
  $('kSecimX').addEventListener('click',function(){ $('kSecim').hidden=true; say('konu/secim/kapatildi','Konu: seçim kapatıldı'); });
  $('kSecim').addEventListener('click',function(e){ if(e.target===$('kSecim')) $('kSecim').hidden=true; });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') $('kSecim').hidden=true; });
  document.addEventListener('click',function(e){ var a=e.target.closest&&e.target.closest('a[data-konu]'); if(!a||e.ctrlKey||e.metaKey) return; e.preventDefault(); secimAc(a.getAttribute('href'),a.getAttribute('data-konu')); });
  document.getElementById('kSirala').addEventListener('click',function(e){ var b=e.target.closest('button[data-s]'); if(!b) return; SIRA=b.getAttribute('data-s'); try{ localStorage.setItem('kn_sira',SIRA); }catch(e2){} ciz(); });
  /* yalnız yerel sınama: 127.0.0.1/localhost + ?sahte=1 → hesap yerine uydurma özet (canlıda çalışmaz) */
  var SAHTE=/^(127\.0\.0\.1|localhost)$/.test(location.hostname)&&q.get('sahte')==='1';
  var uye=SAHTE?new Promise(function(ok){ var bekle=function(){ if(!HAVUZ) return setTimeout(bekle,100); var L=[]; Object.keys(HAVUZ.dersler).forEach(function(d){ HAVUZ.dersler[d].konular.forEach(function(k,i){ if(!k||i%3===2) return; var c=3+((i*7)%15), dg=Math.round(c*[0.3,0.5,0.62,0.8,0.9][i%5]); L.push({sinav:'smmm',ders:d,konu:k,cevap:c,dogru:dg,cozulen:c-1}); }); }); OZET={konular:L}; ok(true); }; bekle(); })
    :!sb?Promise.resolve(false):sb.auth.getSession().then(function(r){ var s=r&&r.data&&r.data.session; if(!s) return false;
    return sb.rpc('uye_calisma_ozetim').then(function(x){ OZET=(x&&!x.error&&x.data)?x.data:null; return true; },function(){ return true; }); },function(){ return false; });
  Promise.all([getir('veri/deneme/smmm-ders-havuz.json'),getir('veri/deneme/smmm-konu-kanit.json')]).then(function(r){ HAVUZ=r[0]; KANIT=r[1]; ciz();
    uye.then(function(g){ GIRIS=g; ciz(); }); });
})();
</script>
