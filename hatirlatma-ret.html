<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hatırlatmalardan çık — Tetikte</title>
<link rel="stylesheet" href="stil.css">
<link rel="stylesheet" href="stil-acik.css">
<style>
  .hr-kap{max-width:560px;margin:64px auto;padding:0 16px}
  .hr-kutu{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
  .hr-kutu h1{font-size:22px;margin:0 0 10px;color:var(--ink)}
  .hr-kutu p{margin:0 0 10px;color:var(--muted);line-height:1.6}
</style>
</head>
<body style="background:var(--bg);color:var(--ink)">
<!-- 06.10 (Cem "1 yap"): seviye testi hatırlatma mailindeki tek tık çıkış. Adreste e-posta YOK, yalnız jeton
     (radar-app/sql/2026-10-06-hatirlatma-ret.sql). Sayfa açılınca kaydeder; ikinci açılış zararsız. -->
<main class="hr-kap">
  <div class="hr-kutu" role="status" aria-live="polite">
    <h1 id="hrBas">Kaydediliyor…</h1>
    <p id="hrMetin"></p>
    <p><a href="index.html">Tetikte ana sayfa</a></p>
  </div>
</main>
<script>
(function(){
  var SB='https://bjrleanjpyujtajmazxn.supabase.co', KEY='sb_publishable_kTZpYwrL7skw8Ryj5Vs8_Q_-5_Fhkcg';
  var t=(/[?&]t=([0-9a-f]{64})\b/.exec(location.search)||[])[1];
  var bas=document.getElementById('hrBas'), metin=document.getElementById('hrMetin');
  if(!t){ bas.textContent='Bağlantı eksik'; metin.textContent='Bağlantı tam açılmamış olabilir. E-postadaki "bir daha gönderme" bağlantısına yeniden bas ya da destek@tetikte.com adresine yaz.'; return; }
  fetch(SB+'/rest/v1/rpc/hatirlatma_ret',{ method:'POST', headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY}, body:JSON.stringify({p_jeton:t}) })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(ok){ if(!ok) throw 0; bas.textContent='Tamam, artık hatırlatma göndermeyeceğiz.'; metin.textContent='Seviye testi ve sınav hatırlatmalarından çıktın. Hesabın ve paketin olduğu gibi duruyor; sipariş ve şifre gibi hesap e-postaları gelmeye devam eder.'; })
    .catch(function(){ bas.textContent='Şu an kaydedilemedi'; metin.textContent='Biraz sonra bağlantıyı yeniden aç ya da destek@tetikte.com adresine "hatırlatma istemiyorum" yaz; elle çıkarırız.'; });
})();
</script>
</body>
</html>
