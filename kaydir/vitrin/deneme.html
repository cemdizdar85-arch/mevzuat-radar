<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".
   Varsayılan = sitenin açık paleti (stil-acik.css değerleri; stil.css BAĞLANMAZ: .kart/.sik/.btn/.kutu seçicileri çakışır).
   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. 24.09 Cem: VARSAYILAN KOYU ("sitenin rengi bu olsun"); beyaz yalnız düğmeyle (kc_tema=light) ya da ?tema=acik ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}
:root[data-theme="dark"]{--bg:#141518;--bg2:#0f1013;--kart:#1e2026;--cizgi:#2e3138;--yazi:#e9e9ec;--metin:#e9e9ec;--dim:#9aa1ad;--mavi:#78b4ff;--yesil:#8fc98f;--kirmizi:#e07b7b;--altin:#e0a458;--ustYazi:#0f1013}
.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
/* 13.09 Cem: "nöbetçi çöz dediğinde sadece ekrandaki soru çözsün, başka alt alta soru olmasın."
   ?tek=1 = ana sayfa çerçevesi: YALNIZ #s=<sıra> kartı görünür, akış kaydırılamaz,
   "Sonraki" ve "yukarı kaydır" ipucu gizlenir (sonraki kart yokken yanıltır). */
:root[data-tek] #akis{overflow:hidden;scroll-snap-type:none}
:root[data-tek] #akis>*:not(.tekKart){display:none}
:root[data-tek] .bSonraki,:root[data-tek] .ipucu{display:none}
/* tek kartta dizi göstergeleri yanıltır: ilerleme noktaları, "10 / 10" sayacı, hazırlık skoru ve yanlış kutusu çipleri gizli. */
:root[data-tek] .noktalar,:root[data-tek] .ustSag{display:none}
/* 13.09 Cem: "renk koyu olsa, site rengi". Ana sayfa çerçevesi koyu açılır (tema=koyu);
   koyu temanın MAVİ vurgusu yalnız çerçevede sitenin BRONZUNA çevrilir. Ürünün kendi
   teması değişmez - kural data-tek'e bağlı, normal Kaydır-Çöz'e dokunmaz. */
:root[data-tek][data-theme="dark"]{--mavi:#e3b877}
/* 13.09 Cem onayı: akran satırı ("👥 9 adayın %89'u senin gibi B dedi") çerçevede gizli.
   Örneklem küçükken ilk kez gelen ziyaretçi "sitede 9 kişi var" diye okur. Üründe durur. */
:root[data-tek] .akranNot{display:none}
/* Aynı akran verisi şıkların üstüne de basılıyor (.sikYuzde: "B) 1,50 %89", "C) 1,67 %0").
   Öğrenci turunda görüldü: doğru cevabın yanında %0, ilk gelene "site bozuk mu" dedirtiyor. */
:root[data-tek] .sikYuzde{display:none}
/* 13.09 Cem seçimi (tek tek gidildi): Alarm rozeti (kişisel ustalık seviyesi, ilk gelene
   anlamsız ve kırmızı "Alarm" hata gibi okunuyor) ile cevap sonrası ikinci "Kâğıdım" düğmesi
   (üstteki "Kâğıt" aynı işi yapıyor) çerçevede gizli. "Daha fazla" ve "Sen çöz" KALDI. */
:root[data-tek] .seviye,:root[data-tek] .cKagit{display:none}
/* 13.09 Cem: "Hata bildir'i sil". Vitrinden gelen bildirim gerçek adayların bildirimleriyle
   aynı kutuya düşerdi; ana sayfa ziyaretçisine hata düğmesi de güven vermez. Üründe durur. */
/* Özgüllük: ürünün ".cipler.acikEk .cip2.ek{display:inline-block}" kuralı (0,4,0) "Daha fazla"
   açılınca ":root[data-tek] .cHata"yı (0,3,0) eziyordu - ölçüldü. Seçici (0,5,0)'a çıkarıldı, !important yok. */
:root[data-tek] .cipler .cip2.cHata{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}

/* MASAUSTU (Cem 03.09: "ikisine de farkli goruntu"): genis sutun, ogretmen ekraninda tablo solda adimlar sagda */
@media (min-width:900px){
  /* Cem 03.09: "sik tiklayinca cok asagida kaliyor" - masaustunde ALT PANEL YOK; iki kolon: sol soru+siklar,
     sag cevap paneli (UWorld/Becker duzeni). Telefon alt panelde kalir. */
  .kart{max-width:1360px;padding:22px 32px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:28px}
  .ust{grid-column:1/3}.govde{grid-column:1;grid-row:2;padding-bottom:24px}.ipucu{left:32px;right:auto;width:calc(50% - 46px);bottom:10px}
  .soru{font-size:1.08em}.sik{font-size:1em;padding:13px 16px}
  .panel{position:static;grid-column:2;grid-row:2;max-height:calc(100vh - 92px);width:auto;left:auto;right:auto;transform:none;border:1px solid var(--cizgi);border-radius:16px;padding:16px 22px 24px;box-shadow:none;transition:opacity .28s ease}
  .panel:not(.acik){visibility:hidden;opacity:0}.panel.acik{visibility:visible;opacity:1;transform:none}
  .tutamac{display:none}.cip2.ana{margin-left:auto}
  .ders,.oyun{width:min(100%,1100px)}
  .ders{display:none;padding:18px 0 0;height:100vh;height:100dvh;overflow:hidden}.ders.acik{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;column-gap:18px}
  .ders .basl{grid-column:1/3}.ders .tabloSar{grid-column:1;grid-row:2;max-height:none;min-height:0;padding-left:22px}
  .ders .serit{grid-column:2;grid-row:2;padding:0 22px 0 0;min-height:0}.adimK{inset:0 22px 0 0}.ders .altc{grid-column:1/3}
  .ders .altc .adimBar{flex:1;max-width:520px;margin:0 auto}
  .oyun{padding:22px 28px}.satir{grid-template-columns:1fr 1fr;gap:12px}.kutu{min-height:64px}
  /* hesap kâğıdı masaüstü: cevaptan önce sağ kolon (panelin yeri), cevaptan sonra çiple açılan üst katman */
  /* özgüllük .kart .kagit: temel .kagit kuralı bu bloktan SONRA yazılı, aynı özgüllükte sonraki kazanırdı (06.09 tarayıcıda görüldü) */
  .kart .kagit{position:static;grid-column:2;grid-row:2;transform:none;visibility:visible;height:auto;min-height:0;max-height:calc(100vh - 92px);border:1px dashed var(--cizgi);border-radius:16px;padding:14px 18px 16px;transition:none}
  .kart .kagitGovde{min-height:240px}
  .kart:not(.cevaplandi) .kagitKapat,.kart .kagitAc{display:none}
  .kart.cevaplandi .kagit{display:none}.kart.cevaplandi .kagit.acik{display:flex;position:absolute;top:60px;right:32px;bottom:20px;width:min(46%,640px);z-index:7;background:var(--kart);border-style:solid}
}
/* 06.09 HESAP KÂĞIDI (Cem "yan tarafa kâğıt kalem", "1.2.3 yap, telefona uysun"): TESMER SGS kılavuzu hesap makinesini ve
   müsvedde kâğıdını sınava sokmayı yasaklıyor → kâğıt HESAPLAMAZ, kitapçık kenarı gibidir. Telefon: alt sayfa, parmakla çizim + yazı
   sekmeleri, varsayılan kapalı (✏️ düğmesi). Masaüstü: cevaptan önce sağ kolonda açık, cevaptan sonra "✏️ Kâğıdım" çipiyle üstte açılır.
   Soru başına yerelde saklanır (kc_kagit); kutudan dönen aday eski kâğıdını görür. */
.kagit{position:absolute;left:0;right:0;bottom:0;height:74%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s;display:flex;flex-direction:column;padding:10px 12px 12px;z-index:6}

.kagitUst{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8em;color:var(--dim);margin-bottom:6px}.kagitUst b{color:var(--yazi);font-size:1.05em}
.kagitSek{margin-left:auto;display:flex;gap:4px}.kagitSek button{font:inherit;font-size:.82em;background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:4px 10px;cursor:pointer}.kagitSek button.acik{border-color:var(--mavi);color:var(--mavi)}
.kagitGovde{flex:1;min-height:0;position:relative}
.kagitYaz{width:100%;height:100%;resize:none;background:var(--bg);color:var(--yazi);border:1px dashed var(--cizgi);border-radius:10px;padding:8px 12px;font:inherit;font-size:1.02em;line-height:27px;background-image:repeating-linear-gradient(transparent 0 26px,var(--cizgi) 26px 27px);background-attachment:local;outline:none}
.kagitCiz{width:100%;height:100%;display:block;background:var(--bg);border:1px dashed var(--cizgi);border-radius:10px;touch-action:none;cursor:crosshair}
.kagit[data-sek="ciz"] .kagitYaz,.kagit[data-sek="yaz"] .kagitCiz{display:none}
.kagitAc{position:absolute;right:14px;bottom:44px;z-index:5;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:8px 12px;font:inherit;font-size:.86em;cursor:pointer}.kagitAc.var{border-color:var(--altin);color:var(--altin)}
.kagitNot{font-size:.78em;color:var(--altin);margin-top:4px;min-height:1em}
.tt td.kagitVar::after{content:'✏️';font-size:.72em;margin-left:5px;opacity:.9}

.kararRozet{display:inline-block;font-weight:700;padding:4px 10px;border-radius:8px;margin:0 0 8px}.kararRozet.dog{background:color-mix(in srgb,var(--yesil) 16%,transparent);color:var(--yesil)}.kararRozet.yan{background:color-mix(in srgb,var(--kirmizi) 16%,transparent);color:var(--kirmizi)}

.girisK>*{opacity:0;animation:girisBlok .45s ease forwards}.girisK>:nth-child(1){animation-delay:.05s}.girisK>:nth-child(2){animation-delay:.35s}.girisK>:nth-child(3){animation-delay:.65s}.girisK>:nth-child(4){animation-delay:.95s}.girisK>:nth-child(5){animation-delay:1.25s}.girisK>:nth-child(6){animation-delay:1.55s}.girisK>:nth-child(7){animation-delay:1.85s}.girisK>:nth-child(8){animation-delay:2.15s}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=true; /* demo: canlı kasaya yazma kapalı */
const TEK=/[?&]tek=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t!=='light') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');   /* 24.09 Cem: varsayılan koyu */
  if(VITRIN) d.setAttribute('data-vitrin','1');
  if(TEK) d.setAttribute('data-tek','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };
    ikon(); b.addEventListener('click',()=>{ const y=d.getAttribute('data-theme')==='dark'?'light':'dark'; if(y==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme'); try{ localStorage.setItem('kc_tema',y); }catch(e){} ikon(); }); });
})();
const SORULAR=[{"capa":null,"kural":"NGD = nihai satış değeri - ek işleme maliyeti; B payı, dağıtılacak net ortak maliyetin (Z düşülmüş) NGD oranına eşittir; yan ürünün satış geliri bu net tutara geri eklenerek gerçek ortak maliyete ulaşılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 58","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ters sorularda önce 'sonuç verilmiş, hangi ara adım isteniyor' diye zincire baştan değil sondan bak; oranı bul, oradan geriye giderek dağıtılacak taban tutarı hesapla.","konu":"ortak maliyet dağıtımı","tablo":{"satirlar":[["VERİLENLER","-"],["A ek işleme maliyeti","100.000 TL"],["B ek işleme maliyeti","30.000 TL"],["A nihai satış değeri","300.000 TL"],["B nihai satış değeri","150.000 TL"],["Z yan ürün satış geliri","20.000 TL"],["B'ye dağıtılan ortak maliyet payı","96.000 TL"],["HESAP","-"],["A ürünü net gerçekleşebilir değeri (300.000-100.000)","200.000"],["B ürünü net gerçekleşebilir değeri (150.000-30.000)","120.000"],["Toplam net gerçekleşebilir değer","320.000"],["B ürünü dağıtım oranı (120.000/320.000)","%37,5"],["Dağıtılacak net ortak maliyet (96.000/0,375)","256.000"],["Toplam birleşik (ortak) üretim maliyeti (256.000+20.000)","276.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"276.000","E":"308.000","A":"236.000","D":"288.000","B":"256.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Net Gerçekleşebilir Değeri hesaplarken ek işleme maliyetlerini çıkarmadığın için yanlış orana göre dağıttın, ayrıca yan ürün tutarını da hiç eklemedin.","E":"Hem ek işleme maliyetini dağıtım oranında kullanmadın hem de sonuçla yan ürün tutarını düzensiz şekilde birleştirerek iki hata yaptın.","A":"Yan ürün gelirini ortak maliyetten çıkarırken ayrıca net tutardan da çıkardığın için cevap küçük çıktı. Yan ürün tutarını bir kez düşülüyor, sonra toplam maliyeti bulurken geri ekliyoruz.","B":"Net dağıtılacak tutarı 256.000 TL olarak buldukten sonra durdum, yan ürünün indirilmiş tutarını geri eklemeyi unuttun. Bu 256.000 zaten yan ürün sonrası tutardır, toplam için üzerine yan ürün geliri eklenir."},"dogru":"Yan ürünün satış geliri ortak maliyetten düşülerek net dağıtılacak tutar bulunur. Bu net tutarı, B ürününün Net Gerçekleşebilir Değer oranına bölerek toplam net maliyeti elde ederiz. Son adımda yan ürünün tutarını geri ekleyerek gerçek ortak maliyete ulaşırız.","sinav":"Net Gerçekleşebilir Değer yöntemi, ayrılma noktasından sonra ek işleme maliyeti düşüldükten sonra kalan satış değerine göre ortak maliyeti orantılı olarak dağıtır ve yan ürüne pay verilmeyip satış geliri ortak maliyetten indirilir.","kavramlar":[{"kaynak":"TEORI","tanim":"Ürünün nihai satış değerinden ek işleme ve satış maliyetleri çıkarıldıktan sonra kalan tutar; ortak maliyetin dağıtılması sırasında dağıtım anahtarı olarak kullanılır.","ad":"Net Gerçekleşebilir Değer (NGD)"},{"kaynak":"TEORI","tanim":"Aynı hammadde ve süreçten ayrılma noktasına kadar birden fazla ürünün birlikte katlandığı, doğrudan izlenmesi mümkün olmayan maliyet.","ad":"Ortak (Birleşik) Maliyet"},{"kaynak":"TEORI","tanim":"Birleşik üretim sürecinde ana ürünle birlikte ortaya çıkan, satış değeri ana ürüne göre düşük kalan ürün; ortak maliyetten pay almaz, satış geliri ortak maliyetten düşülür.","ad":"Yan Ürün"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":13,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Toplam birleşik (ortak) üretim maliyeti (verilen)","300.000"],["P ürünü net gerçekleşebilir değeri (400.000-50.000)","350.000"],["R ürünü net gerçekleşebilir değeri (250.000-40.000)","210.000"],["Toplam net gerçekleşebilir değer","560.000"],["P ürünü dağıtım oranı (350.000/560.000)","%62,5"],["Dağıtılacak net ortak maliyet (300.000-15.000)","285.000"],["P ürününe isabet eden ortak maliyet payı (285.000x0,625)","178.125"]]},"tur":"tablo","soru":"Bir mobilya işletmesinde P ve R ana ürünleri ile T yan ürünü aynı ortak üretim sürecinden elde edilmektedir. Ayrılma noktasından sonra P ürününe 50.000 TL, R ürününe 40.000 TL ek işleme maliyeti yüklenmekte; P ürününün nihai satış değeri 400.000 TL, R ürününün nihai satış değeri 250.000 TL'dir. T yan ürününün satış geliri 15.000 TL olup yan ürüne ortak maliyetten pay verilmemekte, bu tutar ortak maliyetten düşülmektedir. İşletmenin toplam birleşik (ortak) üretim maliyeti 300.000 TL'dir. Net gerçekleşebilir değer yöntemine göre dağıtım yapıldığında P ürününe isabet eden ortak maliyet payı kaç TL'dir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve P ürününe isabet eden ortak maliyet payının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir tekstil işletmesinde A ve B ana ürünleri ile Z yan ürünü aynı ortak üretim sürecinden elde edilmektedir. Ayrılma noktasından sonra A ürününe 100.000 TL, B ürününe 30.000 TL ek işleme maliyeti yüklenmekte; A ürününün nihai satış değeri 300.000 TL, B ürününün nihai satış değeri 150.000 TL'dir. Z yan ürününün satış geliri 20.000 TL olup yan ürüne ortak maliyetten pay verilmemekte, bu tutar ortak maliyetten düşülmektedir. Net gerçekleşebilir değer yöntemine göre yapılan dağıtım sonucunda B ürününe isabet eden ortak maliyet payı 96.000 TL olarak hesaplanmıştır. Buna göre işletmenin toplam birleşik (ortak) üretim maliyeti kaç TL'dir?","kayitBaslik":"","id":"sgs-t1-maliyet-cokzor/kp-01","verilenler":[{"deger":"100.000 TL","anlam":"A ürününün ayrılma noktasından sonraki ek maliyeti; NGD hesabında nihai satış değerinden düşülür","ad":"A ek işleme maliyeti"},{"deger":"30.000 TL","anlam":"B ürününün ayrılma noktasından sonraki ek maliyeti; NGD hesabında nihai satış değerinden düşülür","ad":"B ek işleme maliyeti"},{"deger":"300.000 TL","anlam":"A ürününün tamamlanmış haldeki satış değeri; NGD hesabının başlangıç noktası","ad":"A nihai satış değeri"},{"deger":"150.000 TL","anlam":"B ürününün tamamlanmış haldeki satış değeri; NGD hesabının başlangıç noktası","ad":"B nihai satış değeri"},{"deger":"20.000 TL","anlam":"Yan ürüne pay verilmez, bu tutar önce ortak maliyetten düşülür, toplam ortak maliyeti bulurken geri eklenir","ad":"Z yan ürün satış geliri"},{"deger":"96.000 TL","anlam":"Sonuç olarak verilen tutar; buradan geriye gidilerek toplam ortak maliyet bulunur (ters soru)","ad":"B'ye dağıtılan ortak maliyet payı"}],"dayanak":"Ortak maliyet dağıtımı - net gerçekleşebilir değer yöntemi ve yan ürün maliyetlendirmesi (maliyet muhasebesi teorisi, mevzuat maddesi yok)","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: A ek işleme maliyeti 100.000 TL (soruda verilen); B ek işleme maliyeti 30.000 TL (soruda verilen); A nihai satış değeri 300.000 TL (soruda verilen); B nihai satış değeri 150.000 TL (soruda verilen); Z satış geliri 20.000 TL (soruda verilen); B'ye isabet eden ortak maliyet payı 96.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: A'ya 100.000 TL, B'ye 30.000 TL ek işleme maliyeti var. A'nın nihai satışı 300.000 TL, B'nin 150.000 TL, Z'nin satış geliri 20.000 TL ve B'ye düşen pay 96.000 TL olarak verilmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]]},{"formul":"Net Gerçekleşebilir Değer = Nihai Satış Değeri - Ek İşleme Maliyeti","anlatim":"Net gerçekleşebilir değer, ürünün son satış fiyatından kalan ek işleme maliyetinin çıkarılmasıyla bulunur. Bunu neden yapıyoruz? Çünkü ortak maliyeti ayrılma noktasındaki gerçek değere göre paylaştırmak istiyoruz.","doldur":[]},{"formul":"A ürünü net gerçekleşebilir değeri = 300.000 (soruda verilen) - 100.000 (soruda verilen) = 200.000","anlatim":"Önce A'nın net gerçekleşebilir değerini buluyoruz. A'nın satış değerinden kendi ek işleme maliyetini düşüyoruz.","doldur":[[8,1]]},{"formul":"B ürünü net gerçekleşebilir değeri = 150.000 (soruda verilen) - 30.000 (soruda verilen) = 120.000","anlatim":"Aynı işlemi B için yapıyoruz - B'nin satış değerinden kendi ek işleme maliyetini çıkarıyoruz.","doldur":[[9,1]]},{"formul":"Toplam net gerçekleşebilir değer = 200.000 (2. adımda bulduk) + 120.000 (3. adımda bulduk) = 320.000","anlatim":"Dağıtım oranını kurabilmek için iki ürünün net gerçekleşebilir değerlerini topluyoruz. Bu toplam, paylaştırma işleminin paydası olacak.","doldur":[[10,1]]},{"formul":"B ürünü dağıtım oranı = 120.000 (3. adımda bulduk) / 320.000 (4. adımda bulduk) = %37,5","anlatim":"B'nin toplam içindeki payını oran olarak buluyoruz. Bu oran, ortak maliyetten B'ye ne kadar düşeceğini belirler.","doldur":[[11,1]]},{"formul":"Dağıtılacak net ortak maliyet = B payı / B oranı = 96.000 (soruda verilen) / %37,5 (5. adımda bulduk) = 256.000; Dahil değil: Z yan ürünü satış geliri 20.000 (soruda verilen) burada henüz eklenmiyor","anlatim":"Soru bize B'nin payını zaten vermiş, biz de oranı biliyoruz - geriye doğru giderek dağıtılacak toplam net ortak maliyeti buluyoruz. Dikkat: Z'nin geliri bu aşamada henüz devrede değil, çünkü yan ürüne pay verilmiyor.","doldur":[[12,1]]},{"formul":"Toplam birleşik (ortak) üretim maliyeti = 256.000 (6. adımda bulduk) + 20.000 (soruda verilen) = 276.000","anlatim":"Yan ürünün satış geliri ortak maliyetten düşülerek dağıtım yapılmıştı, o yüzden gerçek toplam maliyete ulaşmak için bu tutarı geri ekliyoruz. Çünkü Z'nin geliri baştan ortak maliyeti azaltmıştı.","doldur":[[13,1]]},{"formul":"Ters durum: yan ürüne pay verilseydi → Z geliri ortak maliyetten düşülmez, direkt gelir yazılır","anlatim":"Ters durumda: yan ürüne de pay verilseydi, Z'nin satış geliri ortak maliyetten düşülmez, direkt hasılat olarak kaydedilirdi.","doldur":[]},{"formul":"Yanlış yol: dağıtılacak net ortak maliyeti direkt cevap yazmak = 256.000 (HATALI) → doğrusu 20.000 eklenip 276.000 (7. adımda bulduk)","anlatim":"En sık hata: 256.000'i cevap sanıp Z'nin gelirini eklemeyi unutmak. Soru net ortak maliyeti değil, toplam birleşik üretim maliyetini soruyor.","doldur":[]}],"anahtar":[{"ornek":"maliyetinin","kok":"maliye"},{"ornek":"geliri","kok":"geliri"},{"ornek":"gerçekleşebilir","kok":"gerçek"},{"ornek":"işleme","kok":"işleme"},{"ornek":"ürünün","kok":"ürünün"},{"ornek":"değerinden","kok":"değeri"}],"konuGiris":{"harita":"Ne zaman test edilir: Ayrılma noktasından sonra ek işlem gören ürünlerin ortak maliyeti paylaşılacağında. Nasıl ölçülür: Her ürünün net gerçekleşebilir değeri (nihai satış - ek maliyet) bulunup toplam ortak maliyet bu oranla dağıtılır. Nasıl kaydedilir: Yan ürün geliri ortak maliyetten düşülür, kalan tutar ana ürünlere NGD oranında paylaştırılır.","desen":"Sınav genelde bir ürünün payını verip toplam ortak maliyeti geriye doğru buldurur, öğrenci NGD hesabında ek maliyeti düşmeyi unutur. Yan ürün gelirinin ortak maliyetten düşülmesi de sıkça atlanır. Bu soru p.28'deki NGD dağıtım ve yan ürün geliri düşümü noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Nihai satış değerinden ayrılma noktası sonrası ek işleme maliyeti düşülünce kalan tutar","ad":"Net gerçekleşebilir değer (NGD)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Ayrılma noktasına kadar tüm ürünler için birlikte katlanılan, dağıtılacak tek maliyet havuzu","ad":"Ortak (birleşik) maliyet","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Ayrılma noktasından sonra tek bir ürüne doğrudan yüklenen, dağıtılmayan maliyet","ad":"Ek işleme maliyeti","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Yan ürünün satış gelirinin ortak maliyet havuzundan indirilmesi kuralı","ad":"Yan ürün geliri düşümü","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Ürünlerin nihai satış değerleri, ek işleme maliyetleri, yan ürün geliri ve bir ürüne isabet eden pay verilip toplam ortak maliyet istenir.","panel_ornek":"Sen ve iki arkadaşın ortak bir kargo kutusu paylaşıyorsunuz, kutunun kargo ücreti 60 TL. Senin eşyan daha değerli olduğu için payını değerine göre hesaplıyorsun, arkadaşınki daha ucuz eşya olduğu için daha az ödüyor. Kutudaki bir küçük eşyayı ise ücretsiz taşıtıyorsunuz, onun payı hiç hesaba katılmıyor.","ornek":"Sen ve iki arkadaşın ortak bir kargo kutusu paylaşıyorsunuz, kutunun kargo ücreti 60 TL. Senin eşyan daha değerli olduğu için payını değerine göre hesaplıyorsun, arkadaşınki daha ucuz eşya olduğu için daha az ödüyor. Kutudaki bir küçük eşyayı ise ücretsiz taşıtıyorsunuz, onun payı hiç hesaba katılmıyor.","yontemler":"Tek yöntem NGD'dir: her ürünün NGD'si bulunur, oranı verilen pay üzerinden toplam ortak maliyet (yan ürün geliri düşüldükten sonraki tutar) ters çözülür, sonra yan ürün geliri geri eklenir.","nedir":"Ortak maliyet dağıtımı, aynı süreçten çıkan birden fazla ürüne ayrılma noktasına kadarki maliyeti paylaştırma yöntemidir. Sınav, net gerçekleşebilir değere göre doğru orantılama yapılıp yapılamadığını ölçer."},"olay":"NGD_A=300.000-100.000=200.000; NGD_B=150.000-30.000=120.000; toplam NGD=320.000; B oranı=120.000/320.000=0,375; net ortak maliyet=96.000/0,375=256.000; toplam ortak maliyet=256.000+20.000=276.000.","tuzak":{"D":{"ad":"Ölçüt Karışıklığı Tuzağı","metin":"NGD hesaplarken ek işleme maliyetlerini düşmeden doğrudan nihai satış değerlerini oranladın, ayrıca yan ürün gelirini eklemedin. Doğrusu: dağıtım anahtarı ek işleme maliyeti düşülmüş NGD'dir, nihai satış değeri değildir."},"E":{"ad":"Bileşik Hata Tuzağı","metin":"hem yanlış oranla (ek işleme maliyetini düşmeden) net tutarı buldun hem de sonuna Z'yi ekleyerek iki hatayı birleştirdin. Doğrusu: doğru oran NGD'den, doğru toplam ise Z'nin doğru orana dayalı net tutara eklenmesinden gelir."},"A":{"ad":"Ters İşaret Tuzağı","metin":"Yan ürün satış gelirinin ortak maliyetten düşüldüğünü gördüğün için toplam ortak maliyeti bulurken bu tutarı dağıtılacak net tutardan bir kez daha çıkardın. Doğrusu: Z'nin satış geliri, net dağıtılacak tutara geri EKLENEREK toplam birleşik maliyete ulaşılır."},"B":{"ad":"Atlanan Katman Tuzağı","metin":"96.000 TL'yi 0,375 orana bölerek bulduğun 256.000'i doğrudan toplam ortak maliyet sandın, yan ürünün düşülmüş olan payını geri eklemeyi unuttun. Doğrusu: 256.000, Z düşüldükten SONRAKİ net dağıtılabilir tutardır, toplam ortak maliyet için üzerine Z eklenir."}},"celdiriciYol":{"D":"96.000 / (150.000/450.000) = 288.000 (NGD hesaplarken ek işleme maliyetini düşmeden nihai satış değerlerini oranladı, Z'yi eklemedi)","E":"96.000 / (150.000/450.000) + 20.000 = 308.000 (yanlış oranla bulunan tutara üstüne Z'yi ekledi)","A":"256.000 - 20.000 = 236.000 (Z yan ürün satış gelirini toplam ortak maliyetten ikinci kez çıkardı)","B":"96.000 / 0,375 = 256.000 (yan ürün satış gelirini toplam ortak maliyete hiç eklemedi, net tutarı toplam sandı)"},"hap":"Net gerçekleşebilir değer yönteminde dağıtım anahtarı, nihai satış değerinden ek işleme maliyetinin düşülmesiyle bulunan NGD'dir; yan ürünün ortak maliyetten düşülen satış geliri, toplam birleşik maliyete geri eklenerek bulunur.","teshis":{"C":{"gercek":"NGD oranıyla bulunan net tutara yan ürün satış geliri eklenince gerçek (birleşik) ortak maliyete ulaşılır.","ayirt":"Yan ürünün payını hem oran hesabından hem de son toplamdan doğru yerde mi kullandım?","paragraf":"Ortak maliyet dağıtımı ve yan ürün kuralı","yanilgi":"Bu şıkkı atlayan öğrenci, dağıtım oranını doğru kurduğu halde Z'yi toplama eklemeyi gözden kaçırmıştır."},"E":{"gercek":"Z'yi eklemek doğru adımdır ama önce oranın (NGD'nin) doğru hesaplanmış olması gerekir; yanlış tabana doğru bir ekleme yapmak sonucu düzeltmez.","ayirt":"Eklediğim düzeltme, doğru bir tabana mı uygulanıyor?","paragraf":"Ortak maliyet dağıtımı - NGD yöntemi teorisi","yanilgi":"Yanlış oranla bulduğun net tutarın hatalı olduğunu fark etmeden üzerine Z'yi ekleyip 'düzelttiğini' sandın."},"A":{"gercek":"Z'nin satış geliri net dağıtılacak tutardan BİR KEZ düşülür; toplam ortak maliyete geri dönerken aynı tutar geri eklenir, ikinci kez çıkarılmaz.","ayirt":"Bu işlemi zaten bir kez yaptım mı, şimdi tersini mi yapmam gerekiyor?","paragraf":"Ortak maliyet dağıtımı - NGD yöntemi teorisi","yanilgi":"Z'nin ortak maliyetten düşüldüğünü öğrendiğin için toplam maliyeti bulurken de aynı işlemi tekrar uygulayıp çıkarma yaptın."},"D":{"gercek":"NGD, nihai satış değerinden ek işleme maliyetinin düşülmesiyle bulunur; bu düşülmeden yapılan oran yanlış dağıtım anahtarı üretir.","ayirt":"Kullandığım değer ayrılma noktasındaki NET değer mi, yoksa ham nihai satış fiyatı mı?","paragraf":"Net gerçekleşebilir değer yöntemi tanımı","yanilgi":"NGD'yi hesaplarken ek işleme maliyetini düşmeyi gereksiz sanıp doğrudan nihai satış değerlerini oranladın."},"B":{"gercek":"Bu tutar yalnızca Z düşüldükten sonraki net dağıtılabilir ortak maliyettir; toplam birleşik maliyet için yan ürün geliri geri eklenir.","ayirt":"Bulduğum tutar 'net' mi yoksa 'toplam' mı; soru hangisini istiyor?","paragraf":"Yan ürün maliyetlendirmesi - ters hesaplama notu","yanilgi":"96.000/0,375 işleminden çıkan sayının doğrudan soruda istenen toplam ortak maliyet olduğunu sandın."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"donem":13,"hesaplar":{}},{"capa":null,"kural":"TMS 40 p.65'e göre tamamlanma tarihindeki gerçeğe uygun değer ile önceki defter değeri arasındaki fark kâr veya zarar olarak finansal tablolara yansıtılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 54","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"140.000","taraf":"B","hesap":"25 YATIRIM AMAÇLI GAYRİMENKULLER"},{"tutar":"140.000","taraf":"A","hesap":"649 DİĞER OLAĞAN GELİR VE KÂRLAR"}],"teori":false,"taktik":"Önce defter değerini (arsa bedeli + inşaat harcamaları) topla, sonra gerçeğe uygun değerden çıkar; kâr çıkarsa gelir hesabı alacak, zarar çıkarsa gider hesabı borç çalışır.","konu":"tms 40 yatırım amaçlı gayrimenkul","tablo":{"satirlar":[["VERİLENLER","-"],["Arsa bedeli","850.000 TL"],["İnşaat harcamaları","620.000 TL"],["Gerçeğe uygun değer","1.610.000 TL"],["HESAP","-"],["Toplam defter değeri (arsa + inşaat harcamaları)","1.470.000"],["Değerleme farkı (1.610.000 - 1.470.000)","140.000"],["649 Diğer Olağan Gelir ve Karlar hesabına alacak kaydedilecek tutar","140.000"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"258 YAPILMAKTA OLAN YATIRIMLAR hesabı 140.000 TL borç kaydedilir.","E":"Fark gerçekleşmemiş kâr sayıldığından hiçbir hesaba kaydedilmez, yalnız dipnotlarda açıklanır.","A":"649 DİĞER OLAĞAN GELİR VE KARLAR hesabı 140.000 TL alacak kaydedilir.","D":"649 DİĞER OLAĞAN GELİR VE KARLAR hesabı 990.000 TL alacak kaydedilir.","B":"659 DİĞER OLAĞAN GİDER VE ZARARLAR hesabı 140.000 TL borç kaydedilir."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[{"kayit":[{"tutar":"1.470.000","taraf":"B","hesap":"25 YATIRIM AMAÇLI GAYRİMENKULLER"},{"tutar":"1.470.000","taraf":"A","hesap":"258 YAPILMAKTA OLAN YATIRIMLAR"}],"baslik":"İnşaatın tamamlanarak aktifleştirilmesi"},{"kayit":[{"tutar":"140.000","taraf":"B","hesap":"25 YATIRIM AMAÇLI GAYRİMENKULLER"},{"tutar":"140.000","taraf":"A","hesap":"649 DİĞER OLAĞAN GELİR VE KÂRLAR"}],"baslik":"Gerçeğe uygun değer farkının kaydı"}],"sade":{"siklar":{"C":"Gayrimenkulü 258 hesabından çıkarırken yapılmakta olan yatırımlar hesabı yalnız defter değeriyle kapatılır. Farkın 140.000 TL fazlalığı ayrıca gelir hesabına kaydedilir.","E":"Gerçekleşmemiş kârlar da Türmob Muhasebe Standartları 40'a göre doğrudan gelir ve karlar hesabına yansıtılır, dipnotla açıklanmakla kalmaz.","D":"Arsa bedelini unutup sadece inşaat harcamasından fark hesaplarsanız 990.000 TL bulursunuz. Defter değer arsa (850.000) ve inşaat (620.000) harcamalarının toplamı olan 1.470.000 TL'dir.","B":"Farkın zarar olduğu düşüncesiyle gider hesabına yazarsanız yanlışlık yapar. Gerçeğe uygun değer defter değerinden büyük olunca fark kârdır, gelir hesabına alacak kaydedilir."},"dogru":"Gayrimenkul tamamlandığında gerçeğe uygun değeri (1.610.000 TL) defter değerinden (1.470.000 TL) 140.000 TL fazladır. Bu fark kâr olduğu için gelir hesabına alacak kaydedilir.","sinav":"Türmob Muhasebe Standartları 40 paragraf 65'e göre, kendisi tarafından inşa edilen yatırım amaçlı gayrimenkulün tamamlanmasında, gerçeğe uygun değer ile defter değeri arasındaki fark kâr veya zarar olarak finansal tablolara yansıtılır.","kavramlar":[{"kaynak":"Türmob Muhasebe Standartları 40 paragraf 5","tanim":"Kira geliri veya sermaye kazancı elde etmek amacıyla sahibi tarafından elde tutulan arsa, bina veya her ikisidir.","ad":"Yatırım amaçlı gayrimenkul"},{"kaynak":"Türmob Muhasebe Standartları 40 paragraf 5","tanim":"Piyasa katılımcıları arasında ölçüm tarihinde gerçekleşen olağan işlemde bir varlığın satışında elde edilecek tutardır.","ad":"Gerçeğe uygun değer"},{"kaynak":"Türmob Muhasebe Standartları 40 paragraf 5","tanim":"Bir varlığın finansal durum tablosunda yer alan değeridir.","ad":"Defter değeri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":8,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[2,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Toplam defter değeri (arsa + inşaat harcamaları)","1.490.000"],["Değerleme farkı (1.700.000 - 1.490.000)","210.000"],["649 Diğer Olağan Gelir ve Karlar hesabına alacak kaydedilecek tutar","210.000"]]},"tur":"tablo","soru":"İşletme, kira geliri elde etmek amacıyla kendi imkanlarıyla inşa ettirdiği ve gerçeğe uygun değer yöntemiyle izlenen yatırım amaçlı gayrimenkulünü 2026'da tamamlamıştır. İnşaat sürecinde arsa bedeli 950.000 TL, inşaat harcamaları 540.000 TL olup 258 Yapılmakta Olan Yatırımlar hesabındadır. Tamamlanma tarihindeki gerçeğe uygun değeri 1.700.000 TL'dir. Buna göre tabloyu doldur ve 649 Diğer Olağan Gelir ve Karlar hesabına alacak kaydedilecek tutarın ne olduğunu bul.","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve 649 Diğer Olağan Gelir ve Karlar hesabına alacak kaydedilecek tutarın ne olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, kira geliri elde etmek amacıyla kendi imkanlarıyla inşa ettirdiği ve gerçeğe uygun değer yöntemiyle izlenen yatırım amaçlı gayrimenkulünü 2026'da tamamlamıştır. İnşaat sürecinde arsa bedeli 850.000 TL, inşaat harcamaları 620.000 TL olup 258 Yapılmakta Olan Yatırımlar hesabındadır. Tamamlanma tarihindeki gerçeğe uygun değeri 1.610.000 TL'dir. Buna göre yapılacak kayıt aşağıdakilerden hangisidir?","kayitBaslik":"2) Gerçeğe uygun değer farkının kaydı","id":"sgs-t2-fmuh-zor/kp-01","verilenler":[{"deger":"850.000 TL","anlam":"Gayrimenkulün defter değerine dahil edilecek arsa maliyeti","ad":"Arsa bedeli"},{"deger":"620.000 TL","anlam":"258 hesapta biriken inşaat maliyeti, defter değerine dahildir","ad":"İnşaat harcamaları"},{"deger":"1.610.000 TL","anlam":"Tamamlanma tarihindeki piyasa değeri, farkın hesaplanmasında defter değerinden çıkarılır","ad":"Gerçeğe uygun değer"}],"dayanak":"TMS 40 p.65","dogru":"A","oyunBonus":{"soru":"İşletme, kira geliri elde etmek amacıyla kendi imkanlarıyla inşa ettirdiği ve gerçeğe uygun değer yöntemiyle izlenen yatırım amaçlı gayrimenkulünü 2026'da tamamlamıştır. İnşaat sürecinde arsa bedeli 1.700.000 TL, inşaat harcamaları 1.240.000 TL olup 258 Yapılmakta Olan Yatırımlar hesabındadır. Tamamlanma tarihindeki gerçeğe uygun değeri 3.220.000 TL'dir. Buna göre yapılacak kayıt aşağıdakilerden hangisidir?","tur":"olcek","kayit":[{"tutar":"280.000","taraf":"B","hesap":"25 YATIRIM AMAÇLI GAYRİMENKULLER"},{"tutar":"280.000","taraf":"A","hesap":"649 DİĞER OLAĞAN GELİR VE KÂRLAR"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Arsa bedeli 850.000 TL (soruda verilen); İnşaat harcamaları 620.000 TL (soruda verilen); Tamamlanma tarihindeki gerçeğe uygun değer 1.610.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: arsa bedeli, inşaat harcamaları ve tamamlanma tarihindeki gerçeğe uygun değer. Bu üç rakam üstünden farkı biz hesaplayacağız.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"258 Yapılmakta Olan Yatırımlar = arsa + inşaat harcamaları (kapsam)","anlatim":"258 Yapılmakta Olan Yatırımlar nedir? İnşaat süren, henüz bitmemiş yatırımın tüm maliyetlerinin biriktiği hesaptır. Tamamlanınca bu hesap kapanır, tutar ilgili duran varlık hesabına aktarılır.","doldur":[]},{"formul":"Toplam defter değeri = arsa bedeli + inşaat harcamaları = 850.000 (soruda verilen) + 620.000 (soruda verilen) = 1.470.000","anlatim":"Önce inşaat bitene kadar harcanan toplam parayı buluyoruz - buna defter değeri deniyor. Bu, gerçeğe uygun değerle karşılaştıracağımız eşik.","doldur":[[5,1]]},{"formul":"Değerleme farkı = gerçeğe uygun değer − toplam defter değeri = 1.610.000 (soruda verilen) − 1.470.000 (3. adımda bulduk) = 140.000","anlatim":"Şimdi tamamlanma anındaki piyasa değeriyle bu defter değerini kıyaslıyoruz. TMS 40'a göre aradaki fark doğrudan kâr veya zarar olur.","doldur":[[6,1]]},{"formul":"649 Diğer Olağan Gelir ve Karlar = kambiyo karları, menkul kıymet satış karları ve benzeri kalemler (kapsam)","anlatim":"649 Diğer Olağan Gelir ve Karlar nedir? Ana faaliyet dışı, olağan nitelikli kâr ve gelirlerin alacak kaydedildiği hesaptır. Değerleme farkı burada toplanır çünkü satış değil bir değer artışıdır.","doldur":[]},{"formul":"255 YATIRIM AMAÇLI GAYRİMENKULLER (BORÇ) 1.610.000 = 1.470.000 (3. adımda bulduk) + 140.000 (4. adımda bulduk); 258 YAPILMAKTA OLAN YATIRIMLAR (ALACAK) 1.470.000 (3. adımda bulduk); 649 DİĞER OLAĞAN GELİR VE KÂRLAR (ALACAK) 140.000 (4. adımda bulduk)","anlatim":"Fark pozitif çıktı, yani gerçeğe uygun değer arttı - bu bir kâr. Gayrimenkul hesabına borç, kaynak olan yatırım hesabından çıkışa alacak, kâra da alacak yazılır.","doldur":[[7,1]]},{"formul":"Ters durum: gerçeğe uygun değer < defter değeri → 659 DİĞER OLAĞAN GİDER VE ZARARLAR (BORÇ)","anlatim":"Ters durumda: gerçeğe uygun değer defter değerinden düşük çıksaydı, aradaki fark kâr değil zarar olurdu. O zaman 649 yerine 659 Diğer Olağan Gider ve Zararlar hesabına borç yazılırdı.","doldur":[]},{"formul":"Yanlış yol: 255 YATIRIM AMAÇLI GAYRİMENKULLER 1.470.000 = 258 YAPILMAKTA OLAN YATIRIMLAR 1.470.000 (HATALI) → doğrusu 1.610.000, 140.000 fark 649'a alacak (6. adımda bulduk)","anlatim":"En sık hata: öğrenciler farkı 258 hesabında bırakıp sadece maliyet değeriyle aktarım yapıyor. Oysa GUD yöntemiyle izlenen gayrimenkulde fark mutlaka kâr/zarara yazılmalı.","doldur":[]}],"anahtar":[{"ornek":"gerçeğe","kok":"gerçeğ"},{"ornek":"değeri","kok":"değeri"},{"ornek":"tamamlandığında","kok":"tamaml"},{"ornek":"defter","kok":"defter"},{"ornek":"yatırım","kok":"yatırı"},{"ornek":"değerle","kok":"değerl"},{"ornek":"649","kok":"649"}],"konuGiris":{"harita":"Ne zaman test edilir: kendi inşa ettiği yatırım amaçlı gayrimenkul tamamlandığında. Nasıl ölçülür: tamamlanma tarihindeki gerçeğe uygun değer ile önceki defter değeri karşılaştırılarak. Nasıl kaydedilir: aradaki fark kâr veya zarar olarak finansal tablolara yansıtılır, varlık gerçeğe uygun değerle tabloya alınır.","desen":"Sorular genelde arsa ve inşaat maliyetini toplayıp defter değeri oluşturur, sonra tamamlanma tarihindeki gerçeğe uygun değerle karşılaştırma yapılır. Tuzak, farkı maliyete eklemek yerine kâr/zarar hesabına atmayı unutmaktır; öğrenciler genelde 258 hesabı doğrudan kapatıp aradaki farkı hiç kaydetmez. Bu soru p.65 Transferler hükmünden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Varlığın finansal durum tablosunda o ana kadar yer alan tutarı","ad":"Defter değeri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Piyasa katılımcıları arasında ölçüm tarihinde gerçekleşecek satış tutarı","ad":"Gerçeğe uygun değer","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Tamamlanma anındaki gerçeğe uygun değer ile önceki defter değeri arasındaki tutar","ad":"Transfer farkı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Tamamlanana kadar harcamaların biriktiği ara hesap","ad":"Yapılmakta olan yatırımlar hesabı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Arsa ve inşaat maliyeti ile tamamlanma tarihindeki gerçeğe uygun değer verilir, doğru muhasebe kaydı istenir.","panel_ornek":"Bir arkadaşın kendi imkanlarıyla bahçesine kiraya vereceği küçük bir stüdyo yaptırıyor: arsa 40, inşaat 30 birim tuttu, bittiğinde emlakçı değeri 90 birim söyledi. Aradaki 20 birim fark, defterine kâr olarak yazılıyor.","ornek":"Bir arkadaşın kendi imkanlarıyla bahçesine kiraya vereceği küçük bir stüdyo yaptırıyor: arsa 40, inşaat 30 birim tuttu, bittiğinde emlakçı değeri 90 birim söyledi. Aradaki 20 birim fark, defterine kâr olarak yazılıyor.","yontemler":"Önceki defter değeri (arsa+inşaat) ile gerçeğe uygun değer arasındaki fark bulunur ve bu fark kâr/zarar hesabına, varlık ise gerçeğe uygun değeriyle ilgili hesaba aktarılır.","nedir":"Yatırım amaçlı gayrimenkul, kira geliri veya değer kazancı için elde tutulan arsa ve binaları ele alan muhasebe kuralıdır. Sınav, gerçeğe uygun değer yöntemiyle izlenen bu varlıkların tamamlanma anındaki değer farkının nasıl kayda geçtiğini ölçer."},"olay":"Defter değeri 850.000+620.000=1.470.000; fark 1.610.000-1.470.000=140.000 TL kârdır.","tuzak":{"C":{"ad":"Hesap Seçimi Tuzağı","metin":"farkın, gayrimenkulün transfer edildiği 258 hesabına yazılacağını sanırsın. Doğrusu: 258 hesap yalnız defter değeriyle kapatılır, fark ayrı olarak gelir hesabına kaydedilir."},"E":{"ad":"Kapsam Tuzağı","metin":"ihtiyatlılık düşüncesiyle gerçekleşmemiş kârın hiç kaydedilmeyeceğini sanırsın. Doğrusu: TMS 40 p.65 farkın muhasebeleştirilmemesine değil, doğrudan kâr/zarara yansıtılmasına hükmeder."},"D":{"ad":"Tutar Tuzağı","metin":"arsa bedelini defter değerine katmayı unutup 1.610.000-620.000=990.000 hesaplarsın. Doğrusu: defter değeri arsa ve inşaat harcamalarının toplamıdır, 850.000+620.000=1.470.000 alınmalıdır."},"B":{"ad":"Taraf Tuzağı","metin":"farkın kâr olduğunu göremeyip zarar sanarak gider hesabına borç yazarsın. Doğrusu: gerçeğe uygun değer defter değerinden büyük olduğundan fark kârdır, gelir hesabına alacak kaydedilir."}},"celdiriciYol":{"C":"1.610.000 - 1.470.000 = 140.000 (farkı transfer hesabı olan 258'e borç yazma - hesap seçimi hatası)","E":"Hiç kayıt yapılmaz (140.000 TL'lik farkın kâr/zarara yansıtılması gerektiği TMS 40 p.65 gözden kaçırılır)","D":"1.610.000 - 620.000 = 990.000 (arsa bedelini defter değerine katmayı unutma - eksik katman hatası)","B":"1.610.000 - 1.470.000 = 140.000 (kârı zarar sayıp 659 hesabına borç yazma - taraf/yön hatası)"},"hap":"Kendi inşa edilen ve gerçeğe uygun değerle izlenen yatırım amaçlı gayrimenkul tamamlandığında, tamamlanma tarihindeki gerçeğe uygun değer ile önceki defter değeri arasındaki fark kâr veya zarar olarak finansal tablolara yansıtılır.","teshis":{"C":{"gercek":"258 Yapılmakta Olan Yatırımlar hesabı yalnızca birikmiş maliyetle (defter değeriyle) kapatılır; değerleme farkı ayrı bir gelir/gider hesabına gider.","ayirt":"Bu hesap defter değerini mi yoksa farkı mı taşıyor?","paragraf":"TMS 40 p.65","yanilgi":"258 hesabın hem transfer hem fark kaydını taşıdığını sanırsın."},"E":{"gercek":"TMS 40 p.65 açıkça bu farkın kâr veya zarar olarak finansal tablolara yansıtılmasını emreder, kayıt dışı bırakma seçeneği yoktur.","ayirt":"Standart bu farkı ertelemeyi mi yoksa doğrudan tanımayı mı söylüyor?","paragraf":"TMS 40 p.65","yanilgi":"Gerçekleşmemiş kârın ihtiyatlılık gereği hiç kaydedilmeyeceğini sanırsın."},"A":{"gercek":"TMS 40 p.65 tamamlanma tarihindeki gerçeğe uygun değer ile önceki defter değeri arasındaki farkın kâr veya zarar olarak finansal tablolara yansıtılacağını söyler.","ayirt":"Bu fark bir varlık değişimi mi yoksa dönem sonucu mu?","paragraf":"TMS 40 p.65","yanilgi":"Bu şıkkı eleyen öğrenci farkın gelir hesabına değil bilanço hesabına yazılacağını düşünür."},"D":{"gercek":"Kaynak metindeki defter değeri tanımı, varlığın finansal durum tablosundaki toplam değeridir; burada arsa ve inşaat harcamalarının tamamını kapsar.","ayirt":"Defter değerine hangi kalemler dahil edildi, tek tek saydım mı?","paragraf":"TMS 40 p.5","yanilgi":"Arsa bedelinin ayrı bir hesapta izlendiğini düşünüp defter değerine dahil etmezsin."},"B":{"gercek":"TMS 40 p.65 farkın işaretine göre kâr ya da zarar olarak kaydedilmesini öngörür; burada 1.610.000>1.470.000 olduğundan sonuç kârdır.","ayirt":"Gerçeğe uygun değer defter değerinden büyük mü küçük mü?","paragraf":"TMS 40 p.65","yanilgi":"Gerçeğe uygun değerin defter değerinden büyük olduğunu fark etmeden otomatik olarak zarar hesabına yazarsın."}},"verilen":[[1,1],[2,1],[3,1]],"donem":8,"hesaplar":{"258":{"ad":"YAPILMAKTA OLAN YATIRIMLAR","tanim":"İşletmede, yapımı süren ve tamamlandığında ilgili maddi duran varlık hesabına aktarılacak olan, her türlü madde ve malzeme ile işçilik ve genel giderlerle ilgili harcamaların izlendiği hesaptır."},"649":{"ad":"FAALİYETLE İLGİLİ DİĞER OLAĞAN GELİR VE KARLAR","tanim":"Yukarıdaki hesaplar kapsamına girmeyen diğer olağan faaliyetlerden sağlanan gelir ve karların izlendiği hesaptır. Bu hesapta kambiyo karları, menkul kıymet satış karları ve benzerleri izlenir."},"659":{"ad":"Diğer Olağan Gider ve Zararlar (-)","tanim":"Yukarıdaki hesaplar kapsamına girmeyen diğer olağan faaliyetlerle ilgili kambiyo zararları, menkul kıymet satış zararları ve benzeri gider ve zararların izlendiği hesaptır."}}},{"capa":null,"kural":"m.17/3 uyarınca aynı işkolunda birden çok sendikaya üyelik yasaktır ancak farklı işverenlere ait işyerlerinde çalışanlar için bu yasak uygulanmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 108","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Sendika üyeliği sorularında önce 'aynı işveren mi farklı işveren mi' ayrımını yap; istisna hep farklı işveren cümlesinde gizlidir.","konu":"sendika üyeliği","tablo":{"satirlar":[["VERİLENLER","-","-"],["işkolu","metal işkolu","-"],["işveren sayısı","iki farklı işveren","-"],["HESAP","-","-"],["A) Ahmet, aynı işkolunda aynı anda yalnızca bir sendikaya ü…","p.m.17/3","YANLIŞ ifade"],["B) Ahmet, aynı işkolunda ve aynı zamanda farklı işverenlere…","p.m.17/3","doğru ifade"],["C) Ahmet, on sekiz yaşını doldurmadıkça hiçbir işçi sendika…","p.m.17/1","YANLIŞ ifade"],["D) Ahmet'in sendikaya üyeliği, işverenine yazılı başvuruda …","p.m.17/5","YANLIŞ ifade"],["E) Ahmet aynı işkolunda birden fazla sendikaya üye olursa, …","p.m.17/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Ahmet, on sekiz yaşını doldurmadıkça hiçbir işçi sendikasına üye olamaz.","E":"Ahmet aynı işkolunda birden fazla sendikaya üye olursa, farklı işverenlere bağlı olması gözetilmeksizin ikinci üyeliği her durumda geçersizdir.","A":"Ahmet, aynı işkolunda aynı anda yalnızca bir sendikaya üye olabilir; farklı işverenlere bağlı olması bu kuralı değiştirmez.","D":"Ahmet'in sendikaya üyeliği, işverenine yazılı başvuruda bulunması ile kazanılır.","B":"Ahmet, aynı işkolunda ve aynı zamanda farklı işverenlere ait işyerlerinde çalıştığından birden çok sendikaya üye olabilir."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Yaş sınırını yanlış bilirsin; kanuna göre işçi sendikasına üyelik için gerekli yaş on beş olup Ahmet bunu karşılaması halinde yaşından dolayı engel yoktur.","E":"İstisnayı görmezden gelirsin; kanun açıkça farklı işverenlerde çalışanlar için çoklu üyeliği izin verdiğinden ikinci üyelik bu durumda geçerli kalır, geçersiz sayılmaz.","D":"Üyelik yolunu yanlış çıkarırsın; başvuru e-Devlet kapısından elektronik olarak yapılır ve işverene yazılı başvuru değildir, sendikanın kabulü ile kazanılır.","A":"Genel kuralı sanırsın ama kanun farklı işverenlerde çalışanlar için istisna yaratır; Ahmet iki işverene bağlı olduğundan her iki sendikaya da üye olabilir."},"dogru":"Ahmet farklı işverenlerin işyerlerinde çalıştığı için, aynı işkolunda birden çok sendikaya üye olabilir. Kanun, aynı işkolundaki çoklu üyeliği yasaklar ancak farklı işverenlere bağlı çalışanlar için istisna yaratır.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 17. madde uyarınca farklı işverenlere ait işyerlerinde çalışan işçiler aynı işkolunda birden çok sendikaya üye olabilir.","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 17. madde","tanim":"İşçi veya işverenler aynı işkolunda ve aynı zamanda birden çok sendikaya üye olamaz; ancak farklı işverenlere ait işyerlerinde çalışan işçiler bu yasağın dışında tutulur.","ad":"Aynı işkolunda birden çok sendikaya üyelik yasağı"},{"kaynak":"Sendikalar ve TİS K. 17. madde","tanim":"Üyelik, Bakanlıkça sağlanan elektronik başvuru sistemine e-Devlet kapısından başvuru yapılması ve sendika tarafından kabul edilmesi ile kazanılır; otuz gün içinde reddedilmemesi halinde kabul edilmiş sayılır.","ad":"Sendikaya üyelik kazanımı"},{"kaynak":"Sendikalar ve TİS K. 17. madde","tanim":"On beş yaşını doldurmuş ve kanun hükümlerine göre işçi sayılan kişiler işçi sendikalarına üye olabilir.","ad":"İşçi sendikasına üyelik yaş şartı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Ahmet, metal işkolunda faaliyet gösteren iki farklı işverene ait işyerinde aynı dönemde çalışmakta olup bu işkolunda kurulu iki ayrı sendikaya üye olmak istemektedir. 6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu'na göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-d2-issgk-kolay-r4/kp-01","verilenler":[{"deger":"metal işkolu","anlam":"Ahmet'in çalıştığı iki işyerinin aynı işkolunda olduğunu gösterir, yasağın ilk şartıdır.","ad":"işkolu"},{"deger":"iki farklı işveren","anlam":"İşkolu aynı olsa da işverenlerin farklı olması m.17/3 istisnasını devreye sokar.","ad":"işveren sayısı"}],"dayanak":"6356 s.K. m.17/1, m.17/3, m.17/5","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Mehmet, hem X A.Ş. hem de Y Ltd. Şti.'ye ait metal işkolundaki iki ayrı fabrikada aynı anda kısmi süreli çalışıyor ve her iki işyerinde kurulu iki farklı işçi sendikasına 2024 Mart'ta üye olmak istiyor.","anlatim":"Kural bu olayda Mehmet'in çoklu üyeliğine izin verip vermediğini test edecek. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: m.17/3 diyor ki aynı işkolunda aynı anda tek sendika kuralı var, ama farklı işverenlere bağlıysan bu yasak kalkıyor.","anlatim":"Mehmet farklı işverenlere bağlı olduğu için kuralın istisnasına giriyor mu, buna bakacağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"p.m.17/3","karar":"yanlış","anlatim":"Mehmet iki ayrı işverene bağlı olduğu için bu görüş yanlış çıkar. m.17/3'teki istisna tam da bu durum için var.","formul":"Şık A: biri sana 'Mehmet aynı işkolunda olduğu için işveren farkı önemsiz, tek sendikayla sınırlı' derse, katılır mısın?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"p.m.17/3","karar":"doğru","anlatim":"m.17/3'ün istisna cümlesi tam olarak bu, farklı işverenlere ait işyerlerinde çalışan işçi birden çok sendikaya üye olabilir. Mehmet bu istisnaya giriyor.","formul":"Şık B: Mehmet'e 'sen farklı işverenlere bağlı çalıştığın için iki sendikaya birden üye olabilirsin' desen, doğru mu söylemiş olursun?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"p.m.17/1","karar":"yanlış","anlatim":"Kanun on sekiz değil on beş yaşını yazıyor. Bu yüzden bu ifade yanlış olur.","formul":"Şık C: 'Mehmet on sekiz yaşını doldurmadıkça hiçbir sendikaya üye olamaz' desen, kanuna uygun mu konuşmuş olursun?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"p.m.17/5","karar":"yanlış","anlatim":"Üyelik işverene yazılı başvuruyla değil, e-Devlet kapısı üzerinden başvuru ve sendikanın kabulüyle kazanılır. Bu yüzden bu ifade yanlış olur.","formul":"Şık D: 'Mehmet'in üyeliği işverenine yazılı başvuruyla kazanılır' dersen, doğru bir usul mü tarif etmiş olursun?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.m.17/3","karar":"yanlış","anlatim":"Geçersizlik sonucu yalnızca yasağa aykırı çoklu üyelik için geçerli, Mehmet'in durumu istisna kapsamında olduğu için geçersizlik doğmaz. Bu yüzden bu ifade yanlış olur.","formul":"Şık E: 'Mehmet ikinci sendikaya üye olursa, işveren farkı önemsenmeksizin bu üyelik her durumda geçersizdir' desen, doğru mu olur?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru cümle, farklı işverenlere bağlı işçinin çoklu sendika üyeliğine izin veren istisna. Kendine hep şunu sor: bu işçi aynı işverene mi yoksa farklı işverenlere mi bağlı?","doldur":[]}],"anahtar":[{"ornek":"işverenlere","kok":"işvere"},{"ornek":"farklı","kok":"farklı"},{"ornek":"istisnasına","kok":"istisn"},{"ornek":"sendikaya","kok":"sendik"},{"ornek":"mehmet","kok":"mehmet"},{"ornek":"yanlış","kok":"yanlış"}],"konuGiris":{"harita":"Ne zaman birden fazla sendikaya üyelik mümkün olur: aynı işkolunda fakat farklı işverenlere ait işyerlerinde aynı anda çalışılıyorsa. Nasıl belirlenir: kanundaki istisna hükmüne bakılarak. Nasıl kayıt altına alınır: e-Devlet kapısı üzerinden üyelik başvurusu ve sendikanın kabulüyle.","desen":"Sınav genelde 'aynı işveren' ile 'farklı işveren' ayrımını karıştırtarak tuzak kurar; öğrenci ikisini aynı zannedip yanlış seçeneğe yönelir. Soru metninde işçinin iki ayrı işverene bağlı olduğu vurgusu, istisnanın uygulanacağının işaretidir (m.17/3). Bu soru m.17/3'teki farklı işveren istisnası noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşçinin çalıştığı sektörün yasal sınıflandırması","ad":"işkolu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Aynı işkolunda aynı anda birden fazla sendikaya üye olamama kuralı","ad":"aynı işkolunda çoklu üyelik yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Aynı işkolunda farklı işverenlere ait işyerlerinde çalışanların çok üyeliğe izinli olması","ad":"farklı işveren istisnası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yasağa aykırı ikinci üyeliğin hükümsüz sayılması sonucu","ad":"sonraki üyeliğin geçersizliği","kim":"kanun sabitler"}],"sinavda":"Aynı işkolunda iki ayrı işverene bağlı çalışan bir işçinin iki sendikaya üyeliğinin geçerli olup olmadığı sorulur.","panel_ornek":"Bir kurye hem bir markette hem bir kafede yarı zamanlı çalışıyor, ikisi de aynı sektörde ama farklı patronlara ait. İki işyerinden de aylık 3 bin lira maaş alıyor. Farklı işverenlere bağlı olduğu için iki yerde de aynı işkolu sendikasına üye olabiliyor.","ornek":"Bir kurye hem bir markette hem bir kafede yarı zamanlı çalışıyor, ikisi de aynı sektörde ama farklı patronlara ait. İki işyerinden de aylık 3 bin lira maaş alıyor. Farklı işverenlere bağlı olduğu için iki yerde de aynı işkolu sendikasına üye olabiliyor.","yontemler":"Önce 'aynı işveren mi farklı işveren mi' ayrımını yap, sonra istisna hükmünü uygula.","nedir":"Sendika üyeliği, işçinin kendi işkolunda kurulu bir sendikaya özgürce katılma hakkıdır. Sınav, aynı işkolunda birden çok sendikaya üyeliğin hangi şartla mümkün olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Yaş Tuzağı","metin":"On sekiz yaşın işçi sendikasına üyelik için aranan yaş olduğunu düşünürsün. Doğrusu: m.17/1'e göre işçi sendikasına üyelik için aranan yaş on beştir."},"E":{"ad":"İstisnayı Yok Sayma Tuzağı","metin":"Birden çok üyelik yasağının hiçbir istisnası olmadığını düşünürsün. Doğrusu: m.17/3, farklı işverenlere ait işyerlerinde çalışanları bu yasağın dışında tutar, dolayısıyla üyelik geçersiz sayılmaz."},"D":{"ad":"Kazanım Yolu Tuzağı","metin":"Üyeliğin işverene yapılan yazılı başvuru ile kazanıldığını sanırsın. Doğrusu: m.17/5'e göre üyelik, Bakanlıkça sağlanan elektronik başvuru sistemine e-Devlet kapısından yapılan başvuru ve sendikanın kabulü ile kazanılır."},"A":{"ad":"Genel Kural Tuzağı","metin":"Aynı işkolunda ve aynı zamanda birden çok sendikaya üyelik yasağının istisnasız uygulandığını sanırsın. Doğrusu: Kanun, farklı işverenlere ait işyerlerinde çalışanlar için bu yasağa açıkça istisna getirir."}},"celdiriciYol":null,"hap":"Aynı işkolunda aynı anda birden çok sendikaya üyelik yasaktır; ancak farklı işverenlere ait işyerlerinde çalışan işçiler bu yasağın dışındadır.","teshis":{"C":{"gercek":"m.17/1'e göre işçi sendikasına üyelik yaşı on beştir.","ayirt":"Bu yaş sınırı hangi maddede, kaç yaş yazıyor diye kaynağa bakıyor muyum?","paragraf":"m.17/1","yanilgi":"Sendika üyeliği yaşını, diğer iş hukuku işlemlerindeki on sekiz yaşla karıştırıyorsun."},"E":{"gercek":"m.17/3'teki geçersizlik sonucu yalnızca yasağa aykırı çoklu üyelik için geçerlidir; farklı işverene bağlı olma hâli bu yasağın kapsamı dışındadır.","ayirt":"Bu işçi yasağın kapsamına mı giriyor yoksa istisna kapsamında mı, önce onu belirliyor muyum?","paragraf":"m.17/3","yanilgi":"Yasağa aykırılığın sonucu olan 'sonraki üyeliğin geçersizliği' hükmünün istisna durumunda da uygulanacağını sanıyorsun."},"A":{"gercek":"m.17/3, aynı işkolunda ve aynı zamanda farklı işverenlere ait işyerlerinde çalışan işçilere birden çok sendikaya üye olma imkânı tanır.","ayirt":"İşçi aynı işverene mi yoksa farklı işverenlere mi bağlı, önce bunu ayırt ediyor muyum?","paragraf":"m.17/3","yanilgi":"Aynı işkolunda çalışan herkesin tek sendikayla sınırlı olduğunu, işveren farkının önemsiz olduğunu düşünüyorsun."},"D":{"gercek":"m.17/5, üyeliğin e-Devlet kapısı üzerinden başvuru ve sendika tüzüğündeki yetkili organın kabulüyle kazanılacağını belirtir.","ayirt":"Üyelik başvurusu kime, hangi sistem üzerinden yapılıyor diye soruyor muyum?","paragraf":"m.17/5","yanilgi":"Üyeliğin klasik yazılı dilekçe usulüyle kazanıldığını, elektronik sistemin yalnızca bildirim aracı olduğunu düşünüyorsun."},"B":{"gercek":"m.17/3 açıkça farklı işverenlere ait işyerlerinde çalışan işçilerin birden çok sendikaya üye olabileceğini düzenler.","ayirt":"Kanun metninde istisna cümlesi 'ancak' ile başlıyor mu, onu arıyor muyum?","paragraf":"m.17/3","yanilgi":"Bu şıkkı eleyen öğrenci, farklı işveren istisnasının yalnızca teoride var olduğunu, pratikte uygulanmadığını sanır."}},"verilen":[[1,1],[2,1]],"donem":6,"hesaplar":{}},{"capa":null,"kural":"Vergi Usul Kanunu madde 287 uyarınca cari döneme ait olup henüz ödenmemiş giderler mukayyet değerleri üzerinden pasifleştirilir; gün esası 360 gün, süre takvim günü olarak alınır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 32","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"55.200","taraf":"B","hesap":"780 FİNANSMAN GİDERLERİ"},{"tutar":"55.200","taraf":"A","hesap":"381 GİDER TAHAKKUKLARI"}],"teori":false,"taktik":"Faiz tahakkukunda önce yıllık tutarı bul, sonra 360'a böl, en son kullanım tarihinden dönem sonuna kadarki gerçek gün sayısını çarp.","konu":"gider tahakkuku","tablo":{"satirlar":[["VERİLENLER","-"],["Kredi anaparası","900.000 TL"],["Yıllık faiz oranı","%24"],["Kredi kullanım tarihi","01.10.2026"],["Vade tarihi","30.09.2027"],["Yıl esası","360 gün"],["HESAP","-"],["Yıllık faiz tutarı (900.000×%24)","216.000"],["Günlük faiz (216.000/360)","600"],["2026 yılına isabet eden gün sayısı (Ekim 31+Kasım 30+Aralık 31)","92"],["2026 gider tahakkuku (600×92)","55.200"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"54.444","E":"216.000","A":"36.600","D":"55.200","B":"54.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Faizi 365 güne bölersen günlük tutarı küçük hesaplarsın; kanunun uygulamasında yıl 360 gün esas alınır.","E":"Kredinin vadesi 2027'de sona erdiği için faizin tamamını 2026'ya ait sanırsan bu tutara ulaşırsın; oysa yalnız geçen 92 günün faizi tahakkuk ettirilir, kalan 2027'ye aittir.","A":"Ekim ayını gün sayısından çıkarıp sadece Kasım-Aralık'ı (61 gün) sayarsan bu tutara ulaşırsın; oysa kredi 01 Ekim'de kullanıldığından hesaplamaya o günden başlanmalı.","B":"Her ayı yu ek seferde ödenecek 900.000 TL kredi kullanmıştır. Faiz hesabında yıl 360 gün kabul edilmekte, gün sayısı ise takvim günü olarak dikkate alınmaktadır. Buna göre işletmenin 31.12.2026 tarihli gider tahakkuku kaydında yer alacak tutar kaç TL'dir?","kayitBaslik":"1) 31.12.2026 - Kredi faiz gider tahakkuku","id":"sgs-d2-fmuh-zor-r1/kp-01","verilenler":[{"deger":"900.000 TL","anlam":"Faiz hesaplamasının tabanı olan tutar.","ad":"Kredi anaparası"},{"deger":"%24","anlam":"Anapara üzerinden yıllık faiz tutarını bulmak için kullanılır.","ad":"Yıllık faiz oranı"},{"deger":"01.10.2026","anlam":"Gün sayımının başlangıç tarihi, faizin işlemeye başladığı gündür.","ad":"Kredi kullanım tarihi"},{"deger":"30.09.2027","anlam":"Faizin tamamının nakden ödeneceği tarih; dönemler arası bölüştürme gerektirir.","ad":"Vade tarihi"},{"deger":"360 gün","anlam":"Günlük faizi bulmak için yıllık faizin bölüneceği gün sayısı.","ad":"Yıl esası"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.287; Tekdüzen Hesap Planı 381 Gider Tahakkukları","dogru":"D","oyunBonus":{"soru":"İşletme, 01.20.4046 tarihinde bankadan yıllık %24 faiz oranlı, faizi vade sonunda (30.18.4047) tek seferde ödenecek 1.800.000 TL kredi kullanmıştır. Faiz hesabında yıl 360 gün kabul edilmekte, gün sayısı ise takvim günü olarak dikkate alınmaktadır. Buna göre işletmenin 31.24.4046 tarihli gider tahakkuku kaydında yer alacak tutar kaç TL'dir?","tur":"olcek","kayit":[{"tutar":"110.400","taraf":"B","hesap":"780 FİNANSMAN GİDERLERİ"},{"tutar":"110.400","taraf":"A","hesap":"381 GİDER TAHAKKUKLARI"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Kredi anaparası 900.000 TL (soruda verilen); Yıllık faiz oranı %24 (soruda verilen); Kredi başlangıcı 01.10.2026, vade 30.09.2027 (soruda verilen); Yıl 360 gün, gün sayısı takvim günü (soruda verilen)","anlatim":"Soru bize şunları vermiş: kredi anaparası, yıllık faiz oranı, kullanım tarihi ve yıl olarak 360 gün kabulü. Faiz vade sonunda ödenecek ama gideri döneme göre ayrılacak.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[7,1],[9,1]]},{"formul":"381 Gider Tahakkukları nedir?","anlatim":"381 Gider Tahakkukları nedir? Faturası ya da ödemesi gelmemiş ama bu döneme ait olan giderin karşılığını tutan hesaptır. Gider bu dönemin sayılınca alacak tarafı büyür.","doldur":[]},{"formul":"780 Finansman Giderleri nedir?","anlatim":"780 Finansman Giderleri nedir? Kredi kullanımından doğan faiz gibi finansman maliyetlerini gösteren gider hesabıdır. Gider arttığı için borç çalışır.","doldur":[]},{"formul":"Yıllık faiz tutarı = Anapara × Faiz oranı = 900.000 (soruda verilen) × %24 (soruda verilen) = 216.000 TL","anlatim":"Önce kredinin bir yıllık toplam faizini buluyoruz. Bunu bulmamızın nedeni, sonra günlük faize bölebilmek.","doldur":[[7,1]]},{"formul":"Günlük faiz = Yıllık faiz / 360 = 216.000 (3. adımda bulduk) / 360 (soruda verilen) = 600 TL","anlatim":"Şimdi yıllık faizi 360'a bölüp bir günlük faizi buluyoruz. Çünkü dönemi gün bazında paylaştıracağız.","doldur":[[8,1]]},{"formul":"2026'ya isabet eden gün sayısı = Ekim + Kasım + Aralık = 31 + 30 + 31 = 92 gün","anlatim":"Kredi 01.10.2026'da başladığı için 2026 yılına Ekim, Kasım, Aralık ayları düşer. Bu üç ayın takvim günlerini topluyoruz.","doldur":[[9,1]]},{"formul":"2026 gider tahakkuku = Günlük faiz × Gün sayısı = 600 (5. adımda bulduk) × 92 (6. adımda bulduk) = 55.200 TL","anlatim":"Günlük faizi 92 günle çarparak 2026 yılına ait faiz giderini buluyoruz. Bu tutar 31.12.2026'da tahakkuk ettirilir.","doldur":[[10,1]]},{"formul":"780 FİNANSMAN GİDERLERİ (BORÇ) 55.200 = 600 (5. adımda bulduk) × 92 (6. adımda bulduk); 381 GİDER TAHAKKUKLARI (ALACAK) 55.200 (7. adımda bulduk)","anlatim":"780 FİNANSMAN GİDERLERİ (BORÇ) hesabı gider arttığı için borçlanır, 381 GİDER TAHAKKUKLARI (ALACAK) hesabı ise henüz ödenmemiş yükümlülük olduğu için alacaklanır.","doldur":[]},{"formul":"Sonuç: 2026 gider tahakkuku = 55.200 TL (7. adımda bulduk)","anlatim":"Sonuç olarak 2026 gider tahakkuku 55.200 TL çıktı. Bu tutar 31.12.2026 tarihli kayıtta yer alacaktır.","doldur":[]},{"formul":"Yanlış yol: 216.000 × (3/12) = 54.000 (HATALI) → doğrusu 55.200 (7. adımda bulduk)","anlatim":"Ters durumda faiz vade başında peşin alınsaydı, kalan dönemin faizi 180 Gelecek Aylara Ait Giderler hesabında aktifleşirdi. En sık hata ise faizi 360 gün yerine 12 aya bölüp 3 ayı '3/12' ile hesaplamaktır; bu, gün esasını göz ardı ettiği için hatalıdır.","doldur":[]}],"anahtar":[{"ornek":"tahakkukları","kok":"tahakk"},{"ornek":"alacak","kok":"alacak"},{"ornek":"giderler","kok":"giderl"},{"ornek":"döneme","kok":"döneme"},{"ornek":"gideri","kok":"gideri"},{"ornek":"ödenmemiş","kok":"ödenme"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda henüz ödenmemiş ama cari döneme ait giderler hesaplanırken test edilir. Nasıl ölçülür: kredi anaparası, oran ve geçen gün sayısı üzerinden gün bazlı orantı kurularak ölçülür. Nasıl kaydedilir: ilgili gider hesabına borç, 381 Gider Tahakkukları hesabına alacak kaydedilir.","desen":"Bu tip soruların tuzağı, kredi kullanım tarihinden dönem sonuna kadar geçen gün sayısının takvim günü olarak sayılması ve yıl 360 gün kabul edilmesidir (Vergi Usul Kanunu m.287). Öğrenciler genellikle ay sayısını 3 alıp basit oranlama yapar, ama gün sayısını yanlış hesaplar. Bu soru Vergi Usul Kanunu m.287 pasif geçici hesap kıymetleri hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"cari döneme ait olup henüz ödenmemiş giderin dönem sonunda kayda alınması","ad":"Tahakkuk","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"kredi sözleşmesinde belirlenen yıllık faiz yüzdesi","ad":"Faiz oranı","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"kredi başlangıcından dönem sonuna kadar geçen takvim günü","ad":"Gün sayısı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"henüz ödenmemiş ama cari döneme ait giderlerin izlendiği pasif hesap","ad":"381 Gider Tahakkukları","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Kredi tutarı, faiz oranı ve kullanım tarihi verilir; dönem sonuna kadar tahakkuk eden faiz gideri tutarı istenir.","panel_ornek":"Arkadaşın 1 Mart'ta 10.000 TL, yıllık %12 faizli bir borç aldı ve faizi vade sonunda ödeyecek. 31 Aralık'ta henüz ödenmemiş olsa da geçen ay için faiz gideri o yılın defterine yazılır, gün sayısı önemlidir.","ornek":"Arkadaşın 1 Mart'ta 10.000 TL, yıllık %12 faizli bir borç aldı ve faizi vade sonunda ödeyecek. 31 Aralık'ta henüz ödenmemiş olsa da geçen ay için faiz gideri o yılın defterine yazılır, gün sayısı önemlidir.","yontemler":"Gün sayısı = kredi başlangıç tarihinden dönem sonuna kadar geçen takvim günü olarak hesaplanır; faiz = anapara × oran × gün/360 formülüyle bulunur.","nedir":"Gider tahakkuku, cari döneme ait olup henüz ödenmemiş giderlerin ilgili dönem sonunda hesaplanıp kaydedilmesidir. Sınav, giderin hangi döneme ve hangi gün sayısına göre paylaştırıldığını ölçer."},"olay":"Yıllık faiz=900.000×%24=216.000; günlük faiz=216.000/360=600; Ekim(31)+Kasım(30)+Aralık(31)=92 gün; 600×92=55.200.","tuzak":{"C":{"ad":"365 Gün Esası Tuzağı","metin":"Faiz oranını yıllık 360 gün yerine 365 güne bölerek günlük faizi küçük hesaplarsın. Doğrusu: Soru verisinde ve Vergi Usul Kanunu uygulamasında yıl 360 gün kabul edilir, bölme işlemi 360'a göre yapılır."},"E":{"ad":"Tüm Yıl Tuzağı","metin":"Kredinin vadesi 2027'de bittiği için faizin tamamının 2026'ya ait olduğunu düşünüp gün kesrini hiç dikkate almazsın. Doğrusu: Yalnızca 2026 yılına isabet eden 92 günlük kısım tahakkuk ettirilir, kalan 2027'ye aittir."},"A":{"ad":"Eksik Gün Tuzağı","metin":"Kredinin kullanıldığı Ekim ayını gün sayısına dahil etmeyip yalnız Kasım-Aralık'ı (61 gün) sayarsın. Doğrusu: Gün sayısı kredinin kullanıldığı 01.10.2026'dan itibaren, yani 92 gün olarak hesaplanır."},"B":{"ad":"Yuvarlak Ay Tuzağı","metin":"Üç ayı kabaca 90 gün (30'ar gün) sayıp gerçek takvim gününü hesaba katmazsın. Doğrusu: Ekim 31, Kasım 30, Aralık 31 gün olmak üzere toplam 92 takvim günü esas alınır."}},"celdiriciYol":{"C":"216.000×92/365=54.444 (360 gün yerine 365 gün esası kullanma)","E":"900.000×0,24=216.000 (gün kesrini düşünmeden tüm yıl faizini tahakkuk ettirme)","A":"216.000/360=600; 600×61=36.600 (Ekim ayı gün sayısını sayıma katmama)","B":"216.000/360=600; 600×90=54.000 (üç ayı 90 gün olarak yuvarlama)"},"hap":"Cari döneme ait olup henüz ödenmemiş giderler, ait olduğu güne kadar hesaplanarak Gider Tahakkukları hesabına alacak kaydedilir.","teshis":{"C":{"gercek":"Soruda yıl esası açıkça 360 gün olarak verilmiştir; bölen 360'tır, 365 değildir.","ayirt":"Soru metninde yıl esası olarak hangi sayı verildi, onu mu kullandım?","paragraf":"THP 381 Gider Tahakkukları işleyişi","yanilgi":"Finansal matematikteki bileşik faiz alışkanlığıyla yıl esasını her zaman 365 gün sanıyorsun."},"E":{"gercek":"Dönemsellik ilkesi ve Vergi Usul Kanunu m.287 gereği yalnızca cari döneme (2026) isabet eden 92 günlük kısım tahakkuk ettirilir.","ayirt":"Bu tutarın tamamı gerçekten sadece 2026 yılına mı ait, yoksa vade tarihine kadar süren bir döneme mi yayılıyor?","paragraf":"213 sayılı Vergi Usul Kanunu m.287","yanilgi":"Faizin ödeme tarihi 2027 olduğu için tamamının 2027'ye ait olacağını, dolayısıyla 2026'ya tüm yıl tutarının yazılması gerektiğini karıştırıp tam tersini yapıyorsun."},"A":{"gercek":"Vergi Usul Kanunu m.287 kapsamında tahakkuk, fiilen paranın kullanıldığı 01.10.2026'dan itibaren işler; bu tarih gün sayımına dahildir.","ayirt":"Faiz gün sayımına, kredinin kullanıldığı gün de dahil mi diye kendime soruyor muyum?","paragraf":"213 sayılı Vergi Usul Kanunu m.287","yanilgi":"Kredinin kullanıldığı ay içinde faiz işlemeye başladığını unutup gün saymaya bir sonraki aydan başladığını sanıyorsun."},"D":{"gercek":"Vergi Usul Kanunu m.287, cari döneme ait olup henüz ödenmemiş giderlerin ilgili döneme isabet eden kısmının pasifleştirilmesini emreder; bu da gün kesrine göre bölüştürmeyi gerektirir.","ayirt":"Faiz gideri, ait olduğu döneme göre bölüştürüldü mü?","paragraf":"213 sayılı Vergi Usul Kanunu m.287","yanilgi":"Bu şıkkı eleyen öğrenci, gün kesrine göre tahakkuk ayırmanın gerekli olmadığını, faizin tamamının bir kalemde kaydedileceğini düşünür."},"B":{"gercek":"Soru verisi açıkça takvim gününü esas aldığından Ekim 31, Kasım 30, Aralık 31 gün ayrı ayrı sayılır.","ayirt":"Ayları 30 gün mü yoksa gerçek gün sayısıyla mı saymam gerektiğini soru bana söylüyor mu?","paragraf":"213 sayılı Vergi Usul Kanunu m.287","yanilgi":"Ayları hep 30 gün kabul ederek üç ayı 90 gün sanıyorsun, oysa soru gerçek takvim gününü istiyor."}},"verilen":[[7,1],[9,1],[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":7,"hesaplar":{"381":{"ad":"GİDER TAHAKKUKLARI","tanim":"Gelecek aylarda ödemesi yapılacak ve kesinlikle belgeye dayalı gider tahakkuklarının izlendiği hesaptır. İşleyişi : Yapılan tahakkuklar ilgili gider ve zarar hesaplarına borç, bu hesaba alacak, yapılan ödemeler borç kaydedilir."},"780":{"ad":"Finansman Giderleri Hesabı","tanim":"İşletme faaliyetlerinin aksamadan yürütülebilmesi amacıyla borçlanılan tutarlarla ilgili faiz, kur farkları, komisyon ve benzeri giderler bu hesaba borç kaydedilir."}}},{"capa":null,"kural":"Türk Borçlar Kanununun 72 nci maddesi uyarınca fiil, ceza kanunlarının daha uzun zamanaşımı öngördüğü cezayı gerektiren bir fiilden doğmuşsa iki yıllık ve on yıllık süreler yerine bu daha uzun süre uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 128","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Tarihli zamanaşımı sorularında önce hangi sürenin (2-10-15 yıl) hangi tarihten başladığını ayrı ayrı hesapla, sonra en uzun süreyi mi yoksa özel bir istisnayı mı uygulaman gerektiğine bak.","konu":"haksız fiil zamanaşımı","tablo":{"satirlar":[["VERİLENLER","-","-","-"],["Fiil tarihi","05.01.2016","-","-"],["Öğrenme tarihi",
