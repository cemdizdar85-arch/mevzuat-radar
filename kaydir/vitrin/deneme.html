deliye kayıyor.","yontemler":"Sadece bir yıl içinde vadesi gelecek anapara taksiti ile buna ait tahakkuk etmiş faiz toplanır; toplam bakiyenin kalan kısmı 405 hesapta uzun vadeli olarak kalır.","nedir":"Bilanço, işletmenin belirli bir tarihteki varlık, borç ve öz kaynaklarını gösteren tabloyu düzenleme işlemidir. Sınav, uzun vadeli bir borcun kısa vadeye alınan kısmının doğru hesaba ve doğru tutarla taşınıp taşınmadığını ölçer."},"olay":"185.000+12.500=197.500","tuzak":{"D":{"ad":"Tümünü Aktarma Tuzağı","metin":"Öğrenci kredinin vade ayrımı yapmadan tamamını kısa vadeli hesaba taşır. Doğrusu: Sadece bir yıl içinde ödenecek 185.000 ₺'lik kısım ile faizi 303 hesabına aktarılır, kalan uzun vadeli olarak izlenir."},"E":{"ad":"Toplam Anaparaya Faiz Ekleme Tuzağı","metin":"Öğrenci kredinin tüm anaparasını kısa vadeye alır ve üstüne faizi ekler. Doğrusu: 303 hesabına aktarılacak tutar sadece bir yıl içinde ödenecek 185.000 ₺ ile faizin toplamı olan 197.500 ₺'dir."},"A":{"ad":"Yalnızca Faiz Tuzağı","metin":"Öğrenci sadece tahakkuk eden faizi 303 hesabına aktarır, anapara taksitini unutur. Doğrusu: 303 hesabı hem taksiti hem faizi kapsar, tutar 185.000+12.500=197.500 olmalıdır."},"B":{"ad":"Yalnızca Anapara Tuzağı","metin":"Öğrenci taksit tutarını doğru bulur ama tahakkuk eden faizi 303 hesabına eklemeyi unutur. Doğrusu: 303 hesabı anapara taksiti ile faizin toplamını kapsar, 197.500 olmalıdır."}},"celdiriciYol":{"D":"640.000 = 640.000 (kredinin tüm anaparasını vade ayrımı yapmadan kısa vadeli hesaba aktardı)","E":"640.000 + 12.500 = 652.500 (kredinin tamamını kısa vadeye aldı ve üzerine tahakkuk eden faizi ekledi)","A":"12.500 = 12.500 (yalnızca tahakkuk eden faizi aldı, anapara taksitini eklemedi)","B":"185.000 = 185.000 (anapara taksitini doğru buldu ama tahakkuk eden faizi 303 hesabına eklemedi)"},"hap":"Uzun vadeli kredinin bilanço tarihinden itibaren bir yıl içinde ödenecek anapara taksiti, buna ait tahakkuk etmiş ödenmemiş faiziyle birlikte 303 Uzun Vadeli Kredilerin Anapara Taksitleri ve Faizleri hesabına aktarılır.","teshis":{"C":{"gercek":"THP 303 hesabı, bilanço tarihinden itibaren bir yıl içinde ödenecek anapara taksitleri ile bunlara ilişkin tahakkuk etmiş ödenmemiş faizlerin toplamını kapsar.","ayirt":"Aktarılacak tutar, sadece bir yıl içindeki taksit mi, yoksa bununla birlikte faiz de dahil mi?","paragraf":"THP 303","yanilgi":"Bu şıkkı eleyen öğrenci, toplam kredi tutarının tamamının veya sadece bir bileşeninin aktarılması gerektiğini düşünür."},"E":{"gercek":"303 hesabına yalnız bir yıl içinde ödenecek taksit ile ona ait faiz aktarılır; kredinin kalan uzun vadeli kısmı bu hesaba girmez.","ayirt":"Toplamı hesaplarken kredinin tamamını mı yoksa sadece kısa vadeye düşen bölümünü mü kullandım?","paragraf":"THP 303","yanilgi":"Kredinin tüm anaparasını kısa vadeye taşıyıp üstüne faizi eklediğini, bunun doğru toplama tutar olduğunu düşünüyorsun."},"A":{"gercek":"THP 303 hesabı bir yıl içinde ödenecek anapara taksitlerini VE bunlara ilişkin tahakkuk etmiş ödenmemiş faizleri birlikte kapsar.","ayirt":"Bu hesaba yalnız faiz mi yoksa anapara+faiz mi yazılıyor?","paragraf":"THP 303","yanilgi":"303 hesabının sadece faiz tutarını izlediğini, anapara taksitinin başka bir hesapta kaldığını düşünüyorsun."},"D":{"gercek":"THP 303 sadece vadesi bir yılın altına düşen kısmı kapsar; kalan tutar uzun vadeli olarak sınıflandırılmaya devam eder.","ayirt":"Kredinin tamamı mı, yalnızca bir yıl içinde ödenecek kısmı mı vade değiştiriyor?","paragraf":"THP 303","yanilgi":"Kredinin tamamının bir yıl içinde ödeneceğini veya vade ayrımı yapılmadan tümünün kısa vadeye taşınması gerektiğini düşünüyorsun."},"B":{"gercek":"THP 303 tanımı, taksitlerin yanı sıra bunların tahakkuk ettiği halde henüz ödenmeyen faizlerini de açıkça kapsar.","ayirt":"Faiz tahakkuk etmiş mi, ödenmemiş mi? Öyleyse 303'e girer mi?","paragraf":"THP 303","yanilgi":"Kısa vadeye alınacak tutarın sadece anapara taksiti olduğunu, tahakkuk eden faizin ayrı bir hesapta kalacağını düşünüyorsun."}},"verilen":[[5,1],[6,1],[1,1],[2,1],[3,1]],"donem":30,"hesaplar":{"303":{"ad":"UZUN VADELİ KREDİLERİN ANAPARA TAKSİTLERİ VE FAİZLERİ","tanim":"Vadelerine bir yıldan fazla süre bulunmakla birlikte uzun vadeli kredilerin, bilanço tarihinden itibaren bir yıl içinde ödenecek anapara taksitleri ile vadesi bir yılın altına düşenleri ve bunların tahakkuk ettiği halde henüz ödenmeyen faizlerini kapsar."},"400":{"ad":"BANKA KREDİLERİ","tanim":"Banka ve diğer finans kuruluşlarından alınan uzun vadeli kredilerin yer aldığı hesaptır. İşleyişi: Alınan uzun vadeli krediler bu hesaba alacak, ödenmeleri halinde borç kaydedilir."}}},{"capa":null,"kural":"Toplam faizden önceki dönemde 381'de tahakkuk eden kısım ayrılır, kalan yalnızca cari döneme (2026) düşen faiz 780'e yazılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/2 ders 01 Soru 14","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"7.200","taraf":"B","hesap":"780 FİNANSMAN GİDERLERİ"},{"tutar":"7.200","taraf":"A","hesap":"381 GİDER TAHAKKUKLARI"}],"teori":false,"taktik":"Önce toplam faizi bul, sonra önceki dönemde 381'e yazılan tutarı düş; kalan cari döneme düşen paydır ve 780'e o yazılır.","konu":"kredi faiz tahakkuku","tablo":{"satirlar":[["VERİLENLER","-"],["Anapara","120.000 ₺"],["Vade","6 ay"],["Yıllık faiz oranı","%24"],["Kullanım tarihi","1 Ekim 2025"],["Vade sonu tarihi","31 Mart 2026"],["HESAP","-"],["Aylık faiz (120.000 × 0,24 / 12)","2.400"],["2025 dönem sonu tahakkuku (Ekim-Aralık, 3 ay, 381'e alacak)","7.200"],["Toplam faiz (6 ay, 120.000 × 0,24 × 6/12)","14.400"],["2026 dönemine düşen faiz (Ocak-Mart, 3 ay) = 780'e borç","7.200"]],"basliklar":["Kalem","Tutar (₺)"]},"siklar":{"C":"7.200","E":"14.400","A":"2.400","D":"12.000","B":"4.800"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Banka kredisi faiz tahakkuku ve geri ödemesi (300 Banka Kredileri, 381 Gider Tahakkukları, 780 Finansman Giderleri)","metin":"TEORİ/TEKNİK (finansal muhasebe; Tekdüzen Hesap Planı 300, 381, 780 işleyişi; dönemsellik kavramı; Vergi Usul Kanunu m.287 pasif geçici hesap kıymetleri ad olarak). KURAL: Kredi alındığında 102 BANKALAR BORÇ / 300 BANKA KREDİLERİ ALACAK (anapara). Anapara ve faizi vade sonunda ödenecek kredide DÖNEM SONUNDA o döneme düşen faiz DÖNEMSELLİK gereği tahakkuk ettirilir: 780 FİNANSMAN GİDERLERİ BORÇ / 381 GİDER TAHAKKUKLARI ALACAK (uygulamada faizin 300 Banka Kredileri'ne alacak kaydedilmesi de görülür; sınavda 381 esas alınır). Faiz hesabı: Anapara × yıllık oran × ay/12 (veya gün/360). VADEDE ÖDEME: 300 BANKA KREDİLERİ BORÇ (anapara), 381 GİDER TAHAKKUKLARI BORÇ (önceki dönem faizi), 780 FİNANSMAN GİDERLERİ BORÇ (bu döneme düşen faiz); 102 BANKALAR ALACAK (toplam ödeme). Vade bir yılı aşan krediler 400 BANKA KREDİLERİ'nde izlenir, yılı gelen taksitler 303'e aktarılır. Alacak tarafındaki simetrik hesap 181 GELİR TAHAKKUKLARI'dır (henüz tahsil edilmemiş faiz alacağı). ÖRNEK: 1.9.2026'da 90.000 TL, yıllık %20, 9 ay vadeli kredi; 31.12.2026'da 4 aylık faiz: 90.000 × 0,20 × 4/12 = 6.000 TL → 780 Finansman Giderleri 6.000 borç / 381 Gider Tahakkukları 6.000 alacak. 1.6.2027 vadede: toplam faiz 90.000 × 0,20 × 9/12 = 13.500; kayıt 300 Banka Kredileri 90.000 borç, 381 Gider Tahakkukları 6.000 borç, 780 Finansman Giderleri 7.500 borç; 102 Bankalar 103.500 alacak. SINAV TUZAĞI: (1) Dönem sonu faizi gider yazılır ama ödenmez; karşılığı 381'dir, 100 Kasa değil. (2) 181 Gelir Tahakkukları alacak tarafı için; kredi faizinde kullanılmaz. (3) Vadede önceki yılın faizi 381'den kapatılır, yeniden…"},{"ad":"VUK (213 s.K.) m.283 - Aktif geçici hesap kıymetleri","metin":"Aktif geçici hesap kıymetleri: Madde 283 – Gelecek bir hesap dönemine ait olarak peşin ödenen giderler ile cari hesap dönemine ait olup da henüz tahsil edilmemiş olan hasılat, mukayyet değerleri üzerinden aktifleştirilmek suretiyle değerlenir. Zirai işletmelerde henüz idrak edilmemiş olan mahsuller için yapılan giderler (Hazırlık işleri giderleri gibi) de bu madde hükmüne göre aktifleştirilerek değerlenir. Kasa mevcudu: “Alacaklar mukayyet değerleriyle değerlenir.”şeklindeki bu fıkra; 16/7/2004 tarihli ve 5228 sayılı Kanunun 59 uncu maddesindeki (213 sayılı Kanunun “b)Alacaklar mukayyet değerleriyle değerlenir.”ibaresi,\"Mevduat veya kredi sözleşmelerine müstenit alacaklar değerleme gününe kadar hesaplanacak faizleriyle birlikte dikkate alınır.”şeklinde değiştirilmiştir .) hükümlerine istinaden metinde yer aldığı şekilde değiştirilmiştir. 91"}],"hakem":"Soru, kredi faiz tahakkuku ve vade sonu ödeme kaydında 780 Finansman Giderleri hesabına yazılacak tutarı doğru kural ve hesaplamaya göre soruyor; tüm kapılar uyumluluk göstermektedir."},"kayitlar":[{"kayit":[{"tutar":"120.000","taraf":"B","hesap":"102 BANKALAR"},{"tutar":"120.000","taraf":"A","hesap":"300 BANKA KREDİLERİ"}],"baslik":"01.10.2025 - Banka kredisi kullanımı"},{"kayit":[{"tutar":"7.200","taraf":"B","hesap":"780 FİNANSMAN GİDERLERİ"},{"tutar":"7.200","taraf":"A","hesap":"381 GİDER TAHAKKUKLARI"}],"baslik":"31.12.2025 - Dönem sonu faiz tahakkuku"},{"kayit":[{"tutar":"120.000","taraf":"B","hesap":"300 BANKA KREDİLERİ"},{"tutar":"7.200","taraf":"B","hesap":"381 GİDER TAHAKKUKLARI"},{"tutar":"7.200","taraf":"B","hesap":"780 FİNANSMAN GİDERLERİ"},{"tutar":"134.400","taraf":"A","hesap":"102 BANKALAR"}],"baslik":"31.03.2026 - Vade sonu kredi ödemesi"}],"sade":{"siklar":{"D":"Toplam kredi vadesini 5 ay gibi sayarsanız bu tutar ortaya çıkar. 1 Ekim 2025'ten 31 Mart 2026'ya kadar gerçek vade 6 aydır.","E":"2025'te 381'de kaydedilen 7.200 ₺'yi yeniden gider yazarsanız bu çıkar. Önceki yıl faizi 381'den silinir, cari döneme sadece 7.200 ₺ yeni faiz yazılır.","A":"1 aylık faiz tutuyor. Oysa 2026'da Ocak, Şubat, Mart olmak üzere tam 3 ay faiz hesaplanması gerekir.","B":"2 aylık faiz hesaplarsanız çıkıyor. Doğru hesaplamada 1 Ocak ile 31 Mart arasının tamamı (3 ay) alınmalıdır."},"dogru":"Kredi 6 ayda toplam 14.400 ₺ faiz getiriyor. 2025'te 3 ay geçtiği için 7.200 ₺ faiz o yıla ait olarak kaydedildi. 2026'da kalan 3 aylık 7.200 ₺ faiz Finansman Giderleri hesabına borç yazılır.","sinav":"Vergi Usul Kanunu 283. madde hükmü çerçevesinde dönemsellik ilkesi gereği cari döneme düşen faiz giderleştirilir.","kavramlar":[{"kaynak":"TEORI","tanim":"Dönem sonunda o döneme ait giderler fiilen ödenmemiş olsa bile muhasebe kayıtlarında tanınması ve giderleştirilmesidir. Dönemsellik ilkesi gereği uygulanır.","ad":"Gider tahakkuku"},{"kaynak":"TEORI","tanim":"Kredilerden kaynaklanan faiz ve benzeri maliyetlerin kaydedildiği hesaptır. Her dönemin sonunda o döneme ait faiz bu hesaba borç yazılır.","ad":"Finansman giderleri"},{"kaynak":"TEORI","tanim":"Henüz ödenmemiş ancak cari dönemine ait giderlerin muhasebeleştirildiği geçici hesaptır. Vade sonu ödeme kaydında bu hesaptan borçlandırılarak kapatılır.","ad":"Gider tahakkukları"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":12,"ornekler":[],"donemler":["2025/1","2024/2","2022/2","2020/2","2020/1","2018/1","2017/2","2014/1","2013/2","2012/3","2011/2","2009/2"]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Kalem","Tutar (₺)"],"satirlar":[["Aylık faiz (150.000 × 0,18 / 12)","2.250"],["2025 dönem sonu tahakkuku (Kasım-Aralık, 2 ay, 381'e alacak)","4.500"],["Toplam faiz (6 ay, 150.000 × 0,18 × 6/12)","13.500"],["2026 dönemine düşen faiz (Ocak-Nisan, 4 ay) = 780'e borç","9.000"]]},"tur":"tablo","soru":"İşletme, 1 Kasım 2025'te bankadan 6 ay vadeli, yıllık %18 faizli 150.000 ₺ kredi kullanmıştır. Anapara ve faizin tamamı vade sonunda ödenecektir. 2025 dönem sonunda o döneme düşen faiz tahakkuk ettirilmiştir. Vade sonu olan 30 Nisan 2026'da yapılan ödeme kaydında 780 Finansman Giderleri hesabına kaç ₺ borç yazılır?","verilen":[],"hedef":"Tabloyu doldur ve 780 Finansman Giderleri hesabına borç yazılacak tutarın kaç ₺ olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, 1 Ekim 2025'te bankadan 6 ay vadeli, yıllık %24 faizli 120.000 ₺ kredi kullanmıştır. Anapara ve faizin tamamı vade sonunda ödenecektir. 2025 dönem sonunda o döneme düşen faiz tahakkuk ettirilmiştir. Vade sonu olan 31 Mart 2026'da yapılan ödeme kaydında 780 Finansman Giderleri hesabına kaç ₺ borç yazılır?","kayitBaslik":"2) 31.12.2025 - Dönem sonu faiz tahakkuku","id":"smmm-4k-a-fmuh-zor-r3/kp-04","verilenler":[{"deger":"120.000 ₺","anlam":"Kredinin ana tutarı; 300 Banka Kredileri hesabına yazılan miktardır.","ad":"Anapara"},{"deger":"6 ay","anlam":"Kredinin toplam süresidir, toplam faizin hesaplanmasında kullanılır.","ad":"Vade"},{"deger":"%24","anlam":"Faiz tutarının hesaplanmasında kullanılan orandır.","ad":"Yıllık faiz oranı"},{"deger":"1 Ekim 2025","anlam":"Kredinin alındığı tarih; 2025 dönem sonuna kadar geçen ay sayısını belirler.","ad":"Kullanım tarihi"},{"deger":"31 Mart 2026","anlam":"Anapara ve faizin ödendiği tarih; 2026'ya düşen ay sayısını belirler.","ad":"Vade sonu tarihi"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı 780 Finansman Giderleri / 381 Gider Tahakkukları hesap işleyişi; dönemsellik kavramı","dogru":"C","oyunBonus":{"soru":"İşletme, 1 Ekim 2025'te bankadan 6 ay vadeli, yıllık %24 faizli 240.000 ₺ kredi kullanmıştır. Anapara ve faizin tamamı vade sonunda ödenecektir. 2025 dönem sonunda o döneme düşen faiz tahakkuk ettirilmiştir. Vade sonu olan 31 Mart 2026'da yapılan ödeme kaydında 780 Finansman Giderleri hesabına kaç ₺ borç yazılır?","tur":"olcek","kayit":[{"tutar":"14.400","taraf":"B","hesap":"780 FİNANSMAN GİDERLERİ"},{"tutar":"14.400","taraf":"A","hesap":"381 GİDER TAHAKKUKLARI"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Anapara 120.000 ₺ (soruda verilen); Yıllık faiz oranı %24 (soruda verilen); Vade 6 ay (soruda verilen); 2025 tahakkuk süresi Ekim-Aralık 3 ay (soruda verilen); 2026 kalan süre Ocak-Mart 3 ay (soruda verilen)","anlatim":"Soru bize şunları vermiş: kredi 120.000 ₺, yıllık faiz oranı %24, vade 6 ay. Tahakkuk 2025'te 3 ay (Ekim-Aralık), kalan 3 ay 2026'ya (Ocak-Mart) düşüyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"381 GİDER TAHAKKUKLARI: dönem sonunda oluşan ama ödemesi gelecek dönemde yapılacak gider için kullanılır","anlatim":"381 Gider Tahakkukları nedir? Belgeye dayalı ama henüz ödenmemiş, döneme ait gideri gösterir. Tahakkukta ilgili gider hesabına borç, buraya alacak yazılır.","doldur":[]},{"formul":"780 FİNANSMAN GİDERLERİ: kredi faizi, komisyon gibi borçlanma giderleri borç kaydedilir","anlatim":"780 Finansman Giderleri nedir? İşletmenin borçlanmasından doğan faiz gibi giderleri toplar. Faiz gideri oluştukça bu hesaba borç yazılır.","doldur":[]},{"formul":"Aylık faiz = Anapara × Yıllık oran / 12 = 120.000 (soruda verilen) × %24 (soruda verilen) / 12 = 2.400 ₺","anlatim":"Önce bir aylık faizi buluyoruz, çünkü sonraki tüm hesaplar buna dayanıyor. Yıllık oranı 12'ye bölüp aylık faizi çıkarıyoruz.","doldur":[[7,1]]},{"formul":"2025 tahakkuku = Aylık faiz × 3 ay = 2.400 (4. adımda bulduk) × 3 (soruda verilen) = 7.200 ₺","anlatim":"2025 yılına düşen faizi buluyoruz, çünkü kredi Ekim'de açıldı ve yıl sonuna kadar 3 ay geçti. Bu tutar 381'e alacak yazılıp gider tarafına borç kaydedilir.","doldur":[[8,1]]},{"formul":"Toplam faiz = Anapara × Yıllık oran × 6/12 = 120.000 (soruda verilen) × %24 (soruda verilen) × 6/12 (soruda verilen) = 14.400 ₺","anlatim":"Şimdi 6 aylık toplam faizi buluyoruz, çünkü vade sonunda ödenecek tam tutarı bilmemiz gerekiyor. Bu, 2025 ve 2026 paylarının toplamı olacak.","doldur":[[9,1]]},{"formul":"2026 payı = Toplam faiz − 2025 tahakkuku = 14.400 (6. adımda bulduk) − 7.200 (5. adımda bulduk) = 7.200 ₺","anlatim":"2026'ya düşen faizi buluyoruz, çünkü asıl soru bunu istiyor. Toplam faizden 2025'te tahakkuk eden kısmı çıkarınca cari döneme düşen kalır.","doldur":[[10,1]]},{"formul":"Ters durum: kredi tamamı cari dönemde açılsaydı → 780 borcu = Toplam faiz (14.400 ₺), 381 kullanılmaz","anlatim":"Ters durumda: eğer kredi Ocak ayında alınıp tamamı 2026'da faiz doğursaydı, 381 hiç kullanılmaz, tüm 14.400 direkt 780'e borç yazılırdı.","doldur":[]},{"formul":"Yanlış yol: 780 borcu = 14.400 (HATALI) → doğrusu 780 borcu = 7.200 (7. adımda bulduk)","anlatim":"En sık hata: öğrenci 2025'te tahakkuk edilen 7.200'ü unutup toplam 14.400'ü 780'e borç yazar. Ama o tutarın yarısı zaten önceki dönemde 381'e alacak kaydedilmişti.","doldur":[]}],"anahtar":[{"ornek":"tahakkuk","kok":"tahakk"},{"ornek":"buluyoruz","kok":"buluyo"},{"ornek":"döneme","kok":"döneme"},{"ornek":"alacak","kok":"alacak"},{"ornek":"önceki","kok":"önceki"},{"ornek":"gideri","kok":"gideri"}],"konuGiris":{"harita":"Ne zaman test edilir: Vadesi bir dönemi aşan, anapara ve faizi vade sonunda ödenen kredilerde. Nasıl ölçülür: Anapara × yıllık oran × geçen ay/12 formülüyle her dönem için ayrı ayrı hesaplanır. Nasıl kaydedilir: Dönem sonunda 780 borç/381 alacak, vadede ödemede 300, 381 ve 780 borç, 102 alacak yazılır.","desen":"Sınav, dönem sonu tahakkuk eden faizin vade sonunda tekrar 780'e yazılıp çift gider oluşturulmasını tuzak olarak kurar. Önceki dönem faizi 381'den kapatılır, sadece bu döneme ait ay sayısı 780'e yazılır. Bu soru dönem sonu-vade sonu faiz ayrımı ve ay hesaplaması noktasından geliyor (p.28, 12 dönemde soruldu).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Henüz ödenmemiş ama döneme ait olan faizin gider olarak kaydedilmesi","ad":"Faiz tahakkuku","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Önceki dönemde tahakkuk eden, henüz ödenmeyen faizin izlendiği hesap","ad":"381 Gider Tahakkukları","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"O döneme ait faiz giderinin borç yazıldığı gider hesabı","ad":"780 Finansman Giderleri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Bankadan alınan ve vade sonunda geri ödenecek olan borç tutarı","ad":"Kredi anaparası","kim":"piyasa fiyatlar"}],"sinavda":"Vade sonu ödeme kaydında sadece bu döneme (1 Ocak-31 Mart 2026) düşen faiz tutarının 780 hesabına borç yazılması istenir.","panel_ornek":"Arkadaşın 10.000 ₺ kredi çekiyor, yıllık %10 faizli, 6 ay sonra tek seferde ödeyecek. 3 ay geçince henüz ödeme yapmasa da o 3 aylık faiz zaten oluşmuş sayılır ve not defterine 'borcum var' diye yazması gerekir. İşte bu, faizin gerçekleşip gerçekleşmediğine değil, zamana bakarak kayıt yapmaktır.","ornek":"Arkadaşın 10.000 ₺ kredi çekiyor, yıllık %10 faizli, 6 ay sonra tek seferde ödeyecek. 3 ay geçince henüz ödeme yapmasa da o 3 aylık faiz zaten oluşmuş sayılır ve not defterine 'borcum var' diye yazması gerekir. İşte bu, faizin gerçekleşip gerçekleşmediğine değil, zamana bakarak kayıt yapmaktır.","yontemler":"Toplam faiz süresi iki döneme bölünerek her döneme ait ay sayısı üzerinden ayrı ayrı hesaplanır; önceki dönem faizi 381'den kapatılır, sadece kalan ay 780'e yazılır.","nedir":"Kredi faiz tahakkuku, dönem sonunda henüz ödenmemiş ama o döneme ait olan faizin gider olarak kaydedilmesidir. Sınav, dönemsellik kavramına göre doğru hesap ve doğru tutarı hesaplayıp hesaplayamadığını ölçer."},"olay":"120.000×0,24×6/12=14.400 toplam faiz; 2025'e düşen 3 aylık kısım 7.200 (381'de); 2026'ya düşen kısım 14.400-7.200=7.200.","tuzak":{"D":{"ad":"Vade Süresi Tuzağı","metin":"Toplam kredi vadesini 6 ay yerine 5 ay alırsan bu tutara ulaşırsın. Doğrusu: Kredi süresi 1 Ekim 2025-31 Mart 2026 arası tam 6 aydır."},"E":{"ad":"Çift Gider Tuzağı","metin":"Önceki dönemde 381'e alacak yazılan faizi unutup vade sonunda toplam faizin tamamını yeniden 780'e yazarsan bu tutar çıkar. Doğrusu: 2025'e ait 7.200 ₺'lik kısım 381 Gider Tahakkukları hesabından borçlandırılarak kapatılır, 780'e yalnız cari dönem payı yazılır."},"A":{"ad":"Ay Sayısı Tuzağı","metin":"Vade sonu kaydında cari döneme düşen ayı yalnız 1 ay sayarsan bu tutara varırsın. Doğrusu: 1 Ocak-31 Mart 2026 arası 3 aylık faiz hesaplanmalıdır."},"B":{"ad":"Eksik Ay Tuzağı","metin":"Cari döneme düşen süreyi 2 ay alırsan bu tutar çıkar. Doğrusu: Ocak-Mart 2026 dönemi 3 tam ay olduğundan 3 ay üzerinden hesap yapılmalıdır."}},"celdiriciYol":{"D":"120.000 × 0,24 × 5/12 = 12.000 (toplam vade süresini 6 yerine 5 ay aldı)","E":"120.000 × 0,24 × 6/12 = 14.400 (önceki dönemde 381'e tahakkuk eden faizi kapatmayı unutup toplam faizi yeniden 780'e yazdı)","A":"120.000 × 0,24 × 1/12 = 2.400 (cari döneme düşen ayı yalnız 1 ay saydı)","B":"120.000 × 0,24 × 2/12 = 4.800 (cari döneme düşen ayı 2 ay saydı)"},"hap":"Vade sonu ödemesinde önceki dönemde tahakkuk eden faiz 381 Gider Tahakkukları'ndan kapatılır, yalnız cari döneme düşen faiz 780'e yeniden yazılır.","teshis":{"C":{"gercek":"Dönemsellik kavramı gereği önceki dönemde tahakkuk eden faiz 381'den kapatılır, yalnız cari döneme düşen kısım 780'e gider olarak yazılır.","ayirt":"Bu faizin hangi kısmı zaten önceki dönemde gider yazılmıştı?","paragraf":"MSUGT THP 780/381; dönemsellik kavramı","yanilgi":"Bu şıkkı eleyen öğrenci toplam faizi tek seferde 780'e yazılması gerektiğini düşünür."},"E":{"gercek":"Vade sonu kaydında 381 Gider Tahakkukları borçlandırılarak önceki dönem faizi kapatılır; 780'e yalnız cari dönem payı yazılır, aksi halde gider çift sayılır.","ayirt":"Bu tutarın bir kısmı zaten geçen dönemde 780'e yazılmış mıydı?","paragraf":"MSUGT THP 780/381; dönemsellik kavramı","yanilgi":"Önceki dönemde 381'e alacak kaydedilen faizi unutup toplam faizi ikinci kez 780'e yazdın."},"A":{"gercek":"Cari dönem 1 Ocak-31 Mart 2026 arası tam 3 aydır; faiz bu süre üzerinden hesaplanır.","ayirt":"Vade sonu ile dönem başı arasında kaç tam ay var, saydım mı?","paragraf":"MSUGT THP 780/381","yanilgi":"Vade sonu ayını hesaba katmayı unutup dönem başlangıcından yalnız bir ay geçtiğini düşünüyorsun."},"D":{"gercek":"1 Ekim 2025'ten 31 Mart 2026'ya kadar geçen süre tam 6 aydır; vade süresi eksik sayılamaz.","ayirt":"Kullanım tarihinden vade sonuna kadar tam olarak kaç ay var?","paragraf":"MSUGT THP 780/381","yanilgi":"Kredinin toplam vadesini 6 ay değil 5 ay olarak saydın."},"B":{"gercek":"Ocak, Şubat, Mart 2026 üç tam aydır; ikisi değil üçü faize dahildir.","ayirt":"Ocak'tan Mart'a kadar hangi aylar tamamen bu döneme ait?","paragraf":"MSUGT THP 780/381","yanilgi":"Ay sayımını yaparken bir ayı atlayıp iki ay üzerinden hesapladın."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":12,"hesaplar":{"381":{"ad":"GİDER TAHAKKUKLARI","tanim":"Gelecek aylarda ödemesi yapılacak ve kesinlikle belgeye dayalı gider tahakkuklarının izlendiği hesaptır. İşleyişi : Yapılan tahakkuklar ilgili gider ve zarar hesaplarına borç, bu hesaba alacak, yapılan ödemeler borç kaydedilir."},"780":{"ad":"Finansman Giderleri Hesabı","tanim":"İşletme faaliyetlerinin aksamadan yürütülebilmesi amacıyla borçlanılan tutarlarla ilgili faiz, kur farkları, komisyon ve benzeri giderler bu hesaba borç kaydedilir."}}},{"capa":null,"kural":"645 Menkul Kıymet Satış Kârları, satış bedeli ile menkul kıymetin defterdeki (alış) bedeli arasındaki farktır; karşılık hareketleri 644 hesabında ayrı izlenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/2 ders 01 Soru 10","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"205.000","taraf":"B","hesap":"102 BANKALAR"},{"tutar":"180.000","taraf":"A","hesap":"110 HİSSE SENETLERİ"},{"tutar":"25.000","taraf":"A","hesap":"645 MENKUL KIYMET SATIŞ KÂRLARI"}],"teori":false,"taktik":"Karşılık hareketlerini (654/119/644) satış kaydından (110/645) ayrı iki işlem gibi çöz, birini diğerine karıştırma.","konu":"hisse senedi satışı","tablo":{"satirlar":[["VERİLENLER","-"],["Alış bedeli","180.000 ₺"],["2024 yıl sonu borsa değeri","150.000 ₺"],["2025 yıl sonu borsa değeri","168.000 ₺"],["Satış bedeli","205.000 ₺"],["HESAP","-"],["2024 yıl sonu ayrılan karşılık (180.000-150.000)","30.000"],["2025 yıl sonu gereken karşılık (180.000-168.000)","12.000"],["2025 yılında iptal edilen karşılık (30.000-12.000)","18.000"],["2026 satışta iptal edilen kalan karşılık","12.000"],["645 Menkul Kıymet Satış Kârları (205.000-180.000)","25.000"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"37.000","E":"25.000","A":"13.000","D":"43.000","B":"55.000"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Tahvilin hisse senedine dönüşümü kaydı: hisse senediyle değiştirilebilir tahvil, 405 Çıkarılmış Tahviller, 500 Sermaye, 520 Hisse Senedi İhraç Primleri","metin":"TEORİ (Finansal Muhasebe; MSUGT Sıra No:1 Tekdüzen Hesap Planı 405, 304, 500, 501, 520 hesap açıklamaları; VUK m.266 itibari değer). TANIM: Hisse senediyle değiştirilebilir tahvil, sahibine vadesinde veya belirlenen dönemde tahvili ihraççı şirketin hisse senetleriyle değiştirme hakkı veren borçlanma aracıdır. THP 405: işletmece hisse senedi ile değiştirilebilir tahvil çıkarılmışsa tutar ve nitelikleri dipnotlarda ayrıca belirtilir; tahviller NOMİNAL bedelleriyle 405'e alacak kaydedilir. KURAL: Dönüşüm anında tahvil borcu kapanır, karşılığında sermaye doğar. Sade kayıt: 405 ÇIKARILMIŞ TAHVİLLER borç (tahvilin nominal değeri); 500 SERMAYE alacak (verilen hisse senetlerinin itibari değeri). Tahvilin nominal değeri verilen hisselerin itibari değerinden büyükse fark 520 HİSSE SENEDİ İHRAÇ PRİMLERİ hesabına alacak yazılır (THP 520: 'hisse senedinin nominal fiyatı ile satış fiyatı arasındaki fark bu hesabın alacağına'). Sermaye artırımı tescile bağlı olduğundan ders kitapları iki aşamalı kaydı da gösterir: tescilde 501 ÖDENMEMİŞ SERMAYE (-) borç / 500 Sermaye alacak; dönüşümde 405 borç / 501 alacak (ve varsa 520 alacak). Tahvilin vadesi bilanço gününden itibaren bir yılın içine girmişse tutar 304 TAHVİL ANAPARA BORÇ TAKSİT VE FAİZLERİ hesabına aktarılmış olur; dönüşümde tahvil hangi hesapta izleniyorsa o hesap borçlandırılır. Dönüşüme kadar işlemiş kupon faizi nakden ödenir ve 780 Finansman Giderleri / 381 Gider Tahakkukları ile izlenir; faiz sermayeye dönüşmez. ÖRNEK: 500.000 TL nominal değiştirilebilir tahvil, itibari değeri toplam 400.000 TL olan hisse senetleriyle değiştirildi…"},{"ad":"Teori Notu - hisse senedi degerleme temettu modeli","metin":"Hisse senedinin icsel degeri, beklenen temettulerinin bugunku degeridir. Sabit buyume (Gordon) modeli: P0 = D1 / (k - g). Burada D1 bir yil sonra beklenen temettu (D1 = D0 x (1+g)), k ozsermaye maliyeti (yatirimcinin istedigi getiri), g temettulerin sabit buyume oranidir. Modelin calismasi icin k > g olmalidir; g, k'ye yaklastikca deger sonsuza gider ve model anlamini yitirir. Temettu dagitmayan ya da duzensiz buyuyen sirketlerde cok asamali modeller veya carpan yontemleri kullanilir. Fiyat/Kazanc (F/K) orani = hisse fiyati / hisse basina kar; benzer sirketlerin F/K ortalamasi ile sirketin karini carparak yaklasik deger bulunur. Buyume orani icin ic kaynak formulu: g = alikoyma orani x ozsermaye karliligi (b x ROE). Tipik tuzaklar: D0 ile D1'i karistirmak (formul GELECEK yilin temettusunu ister) ve g'nin temettu degil KAR buyumesi sanilmasi."}],"hakem":"Soru hisse senedi satışında 645 hesabına kaydedilecek tutarı sormakta; kural kaynak metinde açıkça tanımlanmış ve hesaplama (satış bedeli 205.000 − alış bedeli 180.000 = 25.000) doğrudur."},"kayitlar":[{"kayit":[{"tutar":"30.000","taraf":"B","hesap":"654 KARŞILIK GİDERLERİ"},{"tutar":"30.000","taraf":"A","hesap":"119 MENKUL KIYMETLER DEĞER DÜŞÜKLÜĞÜ KARŞILIĞI"}],"baslik":"31.12.2024 - Değer düşüklüğü karşılığı ayrılması"},{"kayit":[{"tutar":"18.000","taraf":"B","hesap":"119 MENKUL KIYMETLER DEĞER DÜŞÜKLÜĞÜ KARŞILIĞI"},{"tutar":"18.000","taraf":"A","hesap":"644 KONUSU KALMAYAN KARŞILIKLAR"}],"baslik":"31.12.2025 - Karşılığın kısmen iptali"},{"kayit":[{"tutar":"205.000","taraf":"B","hesap":"102 BANKALAR"},{"tutar":"180.000","taraf":"A","hesap":"110 HİSSE SENETLERİ"},{"tutar":"25.000","taraf":"A","hesap":"645 MENKUL KIYMET SATIŞ KÂRLARI"}],"baslik":"2026 - Hisse senetlerinin satışı"},{"kayit":[{"tutar":"12.000","taraf":"B","hesap":"119 MENKUL KIYMETLER DEĞER DÜŞÜKLÜĞÜ KARŞILIĞI"},{"tutar":"12.000","taraf":"A","hesap":"644 KONUSU KALMAYAN KARŞILIKLAR"}],"baslik":"2026 - Kalan karşılığın iptali"}],"sade":{"siklar":{"C":"2025 yılı borsa değeri olan 168.000'i hissenin kayıtlı bedeli zannederek 205.000 − 168.000 = 37.000 hesaplayan hata; defteri kaydında hisse hep 180.000 tutarındadır.","A":"Borsa değerinin düştüğü 2024 yılındaki karşılığı (30.000) ve 2025'te iptal edilen karşılığı (18.000) satış kârından çıkaran, toplam 12.000 kalanı da düşüren hata; karşılık hareketleri 644'te ayrı işlenir.","D":"Satış kârına, 2025'te iptal edilen 18.000 ₺ karşılığı ekleyen hata; bu tutar önceki dönem gelir tablosunda 644'te zaten gelir yazılmışken, satış kâr hesaplamasında yeniden kullanılamaz.","B":"2024 yılı borsa değeri olan 150.000'i hissenin alış bedeli sanarak 205.000 − 150.000 = 55.000 hesaplayan hata; alış bedeli başlangıçtan itibaren 180.000'dir, borsa değerleri yalnız karşılık için kullanılır."},"dogru":"Hisse senedi satışında kâr, satış bedeli ile alış bedeli arasındaki farktır. Borsa değerinin düşüşü ve artışına karşılık hesabında ayrı izlenir, satış kârına karışmaz. 205.000 − 180.000 = 25.000 ₺.","sinav":"645 Menkul Kıymet Satış Kârları hesabına kaydedilecek tutar, menkul kıymetin satış bedeli ile defterdeki alış bedeli arasındaki farktır; karşılık düzeltmeleri 644 hesabında izlenir.","kavramlar":[{"kaynak":"TEORI","tanim":"Hisse senedi gibi menkul kıymetlerin satış bedeli ile defterdeki alış bedeli (itibari değeri) arasındaki pozitif farktır.","ad":"Menkul kıymet satış kârı"},{"kaynak":"TEORI","tanim":"Borsa değerindeki düşüşe karşılık olarak ayrılan ve 644 hesabında izlenen tutar; satış anında son dönem değerine göre iptal edilir.","ad":"Karşılık"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":12,"ornekler":[],"donemler":["2025/2","2023/3","2022/1","2021/3","2019/2","2017/2","2016/1","2015/3","2014/2","2012/2","2012/1","2008/3"]},"oyun":{"bosluk":[[0,1],[1,1],[2,1 rita":"Ne zaman test edilir: menkul kıymet elden çıkarıldığında ve önceki karşılık kayıtları kapatıldığında test edilir. Nasıl ölçülür: satış bedeli ile ilk maliyet bedeli arasındaki fark ölçülür, ara dönem karşılık düzeltmeleri bu farkı etkilemez. Nasıl kaydedilir: satış kârı 645 hesaba, karşılık iptali ayrı bir gelir hesabına kaydedilir.","desen":"Sınav, ara dönemlerde ayrılan ve düzeltilen karşılık tutarlarını satış kârına dahil etmeye çalışan bir çeldiriciyle kurulur; öğrenci karşılık iptalini 645 hesabına ekleme hatasına düşer. Doğru yaklaşımda 645 hesabına yalnız satış bedeli ile ilk maliyet bedeli arasındaki fark yazılır, karşılık iptali ayrı bir gelir hesabında izlenir. Bu soru karşılık ile satış kârının birbirine karıştırılması noktasından geliyor (12 dönemde çıkmış).","terimler":[{"kaynak":"soruda verilir","tanim":"Menkul kıymetin ilk alış anında kayda geçen tutarı","ad":"Maliyet bedeli","kim":"piyasa fiyatlar (alış bedeli gerçekleşen tutardır)"},{"kaynak":"soruda verilir","tanim":"Menkul kıymetin elden çıkarıldığı anda alınan tutar","ad":"Satış bedeli","kim":"piyasa fiyatlar (satış bedeli gerçekleşen tutardır)"},{"kaynak":"soruda verilir","tanim":"Borsa değerinin maliyetin altına düştüğünde ayrılan geçici zarar tutarı","ad":"Değer düşüklüğü karşılığı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Satış bedelinden ilk maliyet bedeli düşüldükten sonra kalan olumlu fark","ad":"Satış kârı (645)","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Alış maliyeti, ara dönem borsa değerleri ve satış bedeli verilir; 645 Menkul Kıymet Satış Kârları hesabına kaydedilecek tutar istenir.","panel_ornek":"Bir genç, 4.000 ₺'ye aldığı ikinci el bir bisikleti önce değer kaybı yüzünden 3.500 ₺ olarak defterine not eder, sonra fiyatlar toparlanır ve bisikleti 4.600 ₺'ye satar. Satıştan doğan gerçek kazanç, alış fiyatıyla satış fiyatı arasındaki 600 ₺'dir; ara dönemdeki değer düşüşü notları bu kazancı değiştirmez.","or       // tablosunun SONUÇ satırını (son satır) dolduran adım; yoksa yukarıdaki geri düşüş
      if(s.tablo&&s.tablo.satirlar&&s.tablo.satirlar.length&&!(s.teori)){ const sonR=s.tablo.satirlar.length-1; for(let q=s.adimlar.length-1;q>=0;q--){ if((s.adimlar[q].doldur||[]).some(p=>p[0]===sonR)){ hedefIdx=q; break; } } }
      const sonBas=adimBaslik(s.adimlar[hedefIdx]); const sonrakiBas=(j+1<s.adimlar.length)?adimBaslik(s.adimlar[j+1]):'';
      // Cem 04.09 "yol haritası ekranı kaplıyor": tek satır — numaralı noktalar (geçilen yeşil, buradasın kalın, hedef altın bayrak),
      // yalnız bulunduğun adımın adı yazılı; başlıklar üstüne gelince görünür. Kartın altına yaslanır.
      const yolH='<div class="yol"><div class="yolCip">'+s.adimlar.map((x,q)=>'<span class="yc '+(q<j?'gecti':(q===j?'simdi':(q===hedefIdx?'hedef':'')))+'" title="'+esc(adimBaslik(x))+'">'+(q===hedefIdx&&q!==j?'🏁':(q+1))+'</span>').join('<span class="ycb"></span>')+'<span class="yolAd">'+esc(adimBaslik(a))+'</span></div>'
        +(a.giris?('<div class="neden">'+(((s.teori||(s.tablo&&s.tablo.basliklar&&s.tablo.basliklar[0]==='Adım')))
            ?'Önce konunun haritası: nedir, sınav nasıl sorar. Sonra kural, sonra şıklar kuralla tek tek sınanır; en sonda senin seçimin.'   // 07.09 Ö55(2): teori cümlesi (hesap kalıbı "verilenler, hesap, ters durum" teori soruda anlamsızdı)
            :'Önce konunun haritası: nedir, sınav ne sorar, hangi yöntem ne zaman. Sonra sorunun verilenleri, sonra hesap; hedef <b>'+esc(sonBas)+'</b>.')+'</div>')
          :(verilenAdimMi&&s.verilenler&&s.verilenler.length)?'<div class="neden">Önce elimizdekileri tanıyoruz: <b>'+s.verilenler.length+' verilen</b>. Hesap bloğundaki her satır bunlardan kurulacak; hedef <b>'+esc(sonBas)+'</b>.</div>'
          :son?'<div class="neden">Hedefe ulaştık: <b>'+esc(sonBas)+'</b>. Şimdi aynı yolu sen yürü.</div>'
          :(j>=hedefIdx?'<div class="neden">Hedef bulundu (<b>'+esc(sonBas)+'</b>). '+(a.kisi?'Bu adım <b>senin seçtiğin şıkkın</b> neden yanlış olduğunu gösterir.':'Bu adım, adayların en sık düştüğü yanlış yolu gösterir.')+'</div>'
          :(j+1===hedefIdx?'<div class="neden">Bu adım niye var? Burada bulduğumuz değer doğrudan hedefe götürür: sıradaki adım <b>'+esc(sonBas)+'</b>.</div>'
          :'<div class="neden">Bu adım niye var? Burada bulduğumuz değer sıradaki adımda (<b>'+esc(sonrakiBas)+'</b>) kullanılacak; hedef <b>'+esc(sonBas)+'</b>.</div>')))+'</div>';
      serit.innerHTML='<div class="adimK'+(son?' sonAdim':'')+(yon<0?' geri':'')+'"><div class="say"><span>ADIM '+(j+1)+' / '+s.adimlar.length+'</span><span class="baslik">'+esc(adimBaslik(a))+'</span></div><code class="mat0">'+fH+'</code><p>'+anlatimH+'</p>'+yolH+sonBtn+'</div>';
      // Cem 04.09 "numaralara basarak sayfa değiştirsek": yol haritası yuvarlakları tıklanınca o adıma gider
      serit.querySelectorAll('.yc').forEach((el,q)=>el.addEventListener('click',()=>adimGit(q-adimNo)));
      const bo=serit.querySelector('.bDersOyun'); if(bo){ bo.addEventListener('click',()=>{ ders.classList.remove('acik'); oyunKur(); oyun.classList.add('acik'); }); }
      const bb=serit.querySelector('.bDersBitti'); if(bb){ bb.addEventListener('click',()=>{ ders.classList.remove('acik'); const cA=k.querySelector('.cAnlat'); if(cA){ if(cA.offsetParent===null){ const bd=k.querySelector('.bDaha'); if(bd) bd.click(); } cA.click(); const ta=k.querySelector('.anlatK'); if(ta) setTimeout(()=>ta.focus(),200); } }); }
      // tablo: bu adimin hucreleri acilir ve yanar; onceki adimlarda acilanlar acik kalir
      tabloSar.querySelectorAll('td.vurgu,td.kaynakH').forEach(td=>{ td.classList.remove('vurgu'); td.classList.remove('kaynakH'); }); tabloSar.querySelectorAll('tr.kayit.vurguS').forEach(tr=>tr.classList.remove('vurguS'));
      // 06.09 Cem "5'ten 3'e dönünce 5'in cevabı kalıyor": açık hücre kümesi her adımda 0..j'den YENİDEN kurulur; geri gidince sonraki adımların hücresi tekrar kapanır
      acilan.clear(); for(let q=0;q<=j;q++){ (s.adimlar[q].doldur||[]).forEach(p=>acilan.add(p[0]+','+p[1])); }
      kaynakH.forEach(k=>acilan.add(k));   // formülde kullanılan hücre görünür olmalı
      if(son&&s.tablo){ s.tablo.satirlar.forEach((st,r)=>st.forEach((c,ci)=>{ if(ci>0) acilan.add(r+','+ci); })); }
      tabloSar.querySelectorAll('td[data-r]').forEach(td=>{ const key=td.dataset.r+','+td.dataset.c; if(acilan.has(key)){ if(td.classList.contains('gizliH')){ td.classList.remove('gizliH'); td.classList.add('acildi'); } } else if(td.classList.contains('acildi')){ td.classList.add('gizliH'); td.classList.remove('acildi'); } });
      (a.doldur||[]).forEach(p=>{ const td=tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]'); if(td) td.classList.add('vurgu'); });
      // 05.09 Cem "%80 çıktığını o rakamı tabloya doldurduğumuzu göstersek": sonuç formülden tablodaki hücreye UÇAR
      // 05.09 Cem "bir anda çözümler geliyor, sırayla çözüyor gibi yapsa": adımda birden çok hesap varsa formül kutuları
      // SIRAYLA belirir (900 ms arayla), her kutunun sonucu belirince kendi hücresine uçar; hücre uçuş bitene dek boş kalır.
      if(yon>=0&&j>0&&!verilenAdimMi&&!a.giris){
        const mats=[...serit.querySelectorAll('.mat')]; const hedefler=(a.doldur||[]).map(p=>tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]')).filter(Boolean);
        const cokKutu=mats.length>1; const adimBu=j;
        hedefler.forEach(td=>td.classList.add('bekliyor'));
        mats.forEach((m,q)=>{ if(q>0&&cokKutu){ m.classList.add('gizliMat'); } });
        hedefler.forEach((td,pi)=>{ const kaynakM=mats[Math.min(pi,Math.max(0,mats.length-1))]; const gecikme=cokKutu?pi*900:pi*120;
          setTimeout(()=>{ if(adimNo!==adimBu||!document.body.contains(td)){ td.classList.remove('bekliyor'); return; }
            if(kaynakM){ kaynakM.classList.remove('gizliMat'); kaynakM.classList.add('geldi'); }
            const kaynakEl=kaynakM?kaynakM.querySelector('.matSonuc'):null; const from=kaynakEl?kaynakEl.getBoundingClientRect():null, to=td.getBoundingClientRect();
            if(!from||!from.width||!to.width){ td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); return; }
            const u=document.createElement('div'); u.className='ucan'; u.textContent=td.textContent.trim()||kaynakEl.textContent.trim(); document.body.appendChild(u); u.style.left=from.left+'px'; u.style.top=from.top+'px';
            requestAnimationFrame(()=>{ u.style.transform='translate('+(to.left-from.left)+'px,'+(to.top-from.top)+'px) scale(.85)'; u.style.opacity='0.15'; });
            setTimeout(()=>{ u.remove(); td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); },650); }, gecikme); });
        // hedefi olmayan fazladan kutular da sırayla gelsin
        mats.forEach((m,q)=>{ if(q>=hedefler.length&&m.classList.contains('gizliMat')){ setTimeout(()=>{ if(adimNo===adimBu){ m.classList.remove('gizliMat'); m.classList.add('geldi'); } }, q*900); } });
      }
      kaynakH.forEach(k=>{ const [r,c]=k.split(','); const td=tabloSar.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]'); if(td) td.classList.add('kaynakH'); });
      // 06.09: VERİLENLER bloğu Adım 1'den sonra katlanır; bu adımın formülünde kullanılan verilen satırı açık kalır (mavi), başlık tıklanınca hepsi açılır
      tabloSar.querySelectorAll('tr.vblok').forEach(tr=>{ const td=tr.querySelector('td[data-r]'); const key=td?td.dataset.r+','+td.dataset.c:''; tr.classList.toggle('katli', j>0 && !kaynakH.has(key) && !hedef.has(key)); });
      let lej=tabloSar.querySelector('.lejant'); if(!lej){ lej=document.createElement('div'); lej.className='lejant'; tabloSar.appendChild(lej); }
      lej.innerHTML=kaynakH.size?'<i class="m"></i>nereden geldi <i class="a"></i>bu adımda bulundu':(hedef.size?'<i class="a"></i>bu adımda bulundu':''); lej.style.display=lej.innerHTML?'block':'none';
      // kayit satirlari: adimda anilan hesap kodu (uc hane; "100.000" icindeki 100 sayilmaz)
      const kodOf=x=>new Set([...(String(x.formul)+' '+String(x.anlatim)).matchAll(/(?<![\d.,])(\d{3})(?![\d.,]|\s*(?:TL|%|adet|gün|yıl|ay))/g)].map(m=>m[1]));
      const kodlar=kodOf(a);
      // gösterilen kayıt satırları da 0..j'den yeniden kurulur (geri gidince sonraki adımın satırı gizlenir)
      gosterilen.clear(); for(let q=0;q<=j;q++){ kodOf(s.adimlar[q]).forEach(c=>gosterilen.add(c)); }
      tabloSar.querySelectorAll('tr.kayit[data-kod]').forEach(tr=>{ const k2=tr.dataset.kod; const an=k2&&kodlar.has(k2); if(son){ gosterilen.add(k2); } tr.classList.toggle('goster',gosterilen.has(k2)); tr.classList.toggle('vurguS',!!an); });
      tabloSar.querySelectorAll('tr.ara').forEach(ara=>{ const gi=ara.dataset.grp; ara.classList.toggle('goster',[...tabloSar.querySelectorAll('tr.kayit[data-kod][data-grp="'+gi+'"]')].some(tr=>tr.classList.contains('goster'))); });
      adimBar.querySelectorAll('i').forEach(n=>{ const q=parseInt(n.dataset.j); n.classList.toggle('simdi',q===j); n.classList.toggle('gecti',q<j); });
      bOnce.disabled=(j===0); bSonra.disabled=son; bSonra.textContent=son?'Bitti ✓':'İleri ▶';
      const vurgu=tabloSar.querySelector('td.vurgu, tr.vurguS'); if(vurgu) vurgu.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    const adimGit=d=>{ const cur=s.adimlar[adimNo]; if(d>0&&cur&&tahminGerek(cur,adimNo,adimNo===s.adimlar.length-1)&&serit.querySelector('.tahminK')){ tahmin[adimNo]={atla:true}; adimGoster(adimNo,1); return; }   // 06.09: tahmin ekranında ileri = "göster"
      const j=Math.min(s.adimlar.length-1,Math.max(0,adimNo+d)); if(j===adimNo) return; adimGoster(j,d); };
    bOnce.addEventListener('click',()=>adimGit(-1)); bSonra.addEventListener('click',()=>adimGit(1));
    // fare tekerlegi, klavye oklari, parmakla yatay kaydirma (sola = ileri)
    let tekerKilit=0; serit.addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-tekerKilit<350) return; tekerKilit=t; adimGit((e.deltaY||e.deltaX)>0?1:-1); },{passive:false});
    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});

if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i.simdi').forEach(n=>n.classList.remove('simdi')); document.querySelectorAll(i>=SORULAR.length?'.noktalar i[data-j="son"]':'.noktalar i[data-j="'+i+'"]').forEach(n=>n.classList.add('simdi'));

window.addEventListener('load',function(){ try{ var m=location.hash.match(/#s=(\d+)/); var a=document.getElementById('akis'); if(!a) return;
  /* ?tek=1: hedef kart işaretlenir, gerisi CSS ile gizli. Sıra yoksa/aralık dışıysa ilk kart - boş çerçeve kalmaz. */
