lden doğan zararın karşılanmasını talep etme hakkıdır.","ad":"Tazminat istemi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[0,3],[1,1],[1,2],[1,3],[2,1],[2,2]],"tablo":{"basliklar":["Süre türü","Başlangıç","Bitiş tarihi","Dava tarihinde durum"],"satirlar":[["2 yıllık süre (öğrenme)","08.06.2021","08.06.2023","Dolmuş (uygulanmaz)"],["10 yıllık süre (fiil)","12.04.2015","12.04.2025","Dolmuş (uygulanmaz)"],["20 yıllık ceza zamanaşımı (fiil)","12.04.2015","12.04.2035","Henüz dolmamış - uygulanan süre"]]},"tur":"tablo","soru":"Bir haksız fiil 12.04.2015'te işlenmiş, zarar gören zararı ve tazminat yükümlüsünü 08.06.2021'de öğrenmiştir. Fiil, ceza kanununda 20 yıllık dava zamanaşımı öngörülen bir suçu da oluşturmaktadır. Zarar gören 25.09.2026 tarihinde tazminat davası açmıştır.","verilen":[[0,1],[2,3]],"hedef":"Tabloyu doldur ve davada hangi zamanaşımı süresinin uygulanacağını bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir haksız fiil 05.01.2016'da işlenmiş, zarar gören zararı ve tazminat yükümlüsünü 10.03.2019'da öğrenmiştir. Fiil, ceza kanununda 15 yıllık dava zamanaşımı öngörülen bir suçu da oluşturmaktadır. Zarar gören 20.02.2026 tarihinde tazminat davası açmıştır. Aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-02","verilenler":[{"deger":"05.01.2016","anlam":"On yıllık ve on beş yıllık sürelerin başlangıcı","ad":"Fiil tarihi"},{"deger":"10.03.2019","anlam":"İki yıllık sürenin başlangıcı","ad":"Öğrenme tarihi"},{"deger":"15 yıl","anlam":"Ceza kanununda öngörülen daha uzun süre, m.72/1 istisnası","ad":"Ceza zamanaşımı süresi"},{"deger":"20.02.2026","anlam":"Zamanaşımının dolup dolmadığının kontrol edileceği tarih","ad":"Dava tarihi"}],"dayanak":"Türk Borçlar Kanunu m.72/1","dogru":"E","oyunBonus":null,"ders":"Borçlar Hukuku","adimlar":[{"formul":"Verilen: Fiil tarihi 05.01.2016 (soruda verilen); Öğrenme tarihi 10.03.2019 (soruda verilen); Ceza zamanaşımı süresi 15 yıl (soruda verilen); Dava tarihi 20.02.2026 (soruda verilen)","anlatim":"Soru bize şunları vermiş: haksız fiil 05.01.2016'da işlenmiş, zarar gören zararı ve failini 10.03.2019'da öğrenmiş. Fiil ayrıca ceza kanununda 15 yıllık dava zamanaşımı öngörülen bir suç ve dava 20.02.2026'da açılmış.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[6,1],[7,1],[8,1],[8,0]]},{"formul":"Genel kural: 2 yıllık öğrenme süresi + 10 yıllık fiil süresi; fiil daha uzun ceza zamanaşımlı bir suçsa o süre uygulanır","anlatim":"Türk Borçlar Kanunu nedir? Haksız fiil sorumluluğunu ve zamanaşımı sürelerini düzenleyen kanun. 72. madde tam burada devreye giriyor.","doldur":[]},{"formul":"2 yıllık süre bitişi = Öğrenme tarihi + 2 yıl = 10.03.2019 (soruda verilen) + 2 yıl = 10.03.2021","anlatim":"2 yıllık süre öğrenme tarihinden başlar, biz bunu hesaplıyoruz. Bu süre zarar görenin dava açması için normal süre.","doldur":[[6,0],[6,2]]},{"formul":"Karşılaştırma: 20.02.2026 (soruda verilen) ile 10.03.2021 (3. adımda bulduk) → dava tarihi sonra → dolmuş","anlatim":"Dava tarihini bu bitişle karşılaştırıyoruz. Dava 2026'da açılmış, 2021'i çoktan geçmiş yani bu süre dolmuş.","doldur":[[6,3]]},{"formul":"10 yıllık süre bitişi = Fiil tarihi + 10 yıl = 05.01.2016 (soruda verilen) + 10 yıl = 05.01.2026","anlatim":"10 yıllık süre fiil tarihinden başlar, öğrenmeye bakmaz. Bu süre azami sınır olarak konur.","doldur":[[7,0],[7,2]]},{"formul":"Karşılaştırma: 20.02.2026 (soruda verilen) ile 05.01.2026 (5. adımda bulduk) → dava tarihi sonra → dolmuş","anlatim":"Yine dava tarihiyle kıyaslıyoruz. Dava 20.02.2026, bitiş 05.01.2026'dan sonra geldiği için bu süre de dolmuş.","doldur":[[7,3]]},{"formul":"Dahil değil: 2 yıllık süre 10.03.2021 (3. adımda bulduk), 10 yıllık süre 05.01.2026 (5. adımda bulduk); Türk Borçlar Kanunu m.72 gereği daha uzun ceza zamanaşımı uygulanır","anlatim":"Dahil değil: normalde iki ve on yıllık süreler dolunca dava hakkı biter, ama burada özel bir kural araya giriyor. Fiil aynı zamanda 15 yıllık ceza zamanaşımlı bir suç olduğu için bu iki süre uygulanmaz.","doldur":[]},{"formul":"15 yıllık süre bitişi = Fiil tarihi + 15 yıl = 05.01.2016 (soruda verilen) + 15 yıl = 05.01.2031","anlatim":"15 yıllık ceza zamanaşımı fiil tarihinden başlar, çünkü ceza kanunu suçu fiil anına bağlar. Bu süre şimdi devreye giren gerçek süre.","doldur":[[8,0],[8,2]]},{"formul":"Karşılaştırma: 20.02.2026 (soruda verilen) ile 05.01.2031 (8. adımda bulduk) → dava tarihi önce → henüz dolmamış","anlatim":"Dava tarihini bu son bitişle kıyaslıyoruz. 20.02.2026, 05.01.2031'den önce olduğu için süre henüz dolmamış, dava zamanında açılmış.","doldur":[[8,3]]},{"formul":"Ters durum: ceza zamanaşımı süresi 10 yıldan kısa olsaydı → genel 10 yıllık süre (1. ve 5. adımdaki gibi) uygulanır","anlatim":"Ters durumda: fiil 15 yıllık değil de sıradan bir ceza zamanaşımına tabi olsaydı, yani ceza süresi 10 yıldan kısa olsaydı, genel 10 yıllık süre uygulanır ve dava 05.01.2026'da zamanaşımına uğrardı.","doldur":[]},{"formul":"Yanlış yol: sadece 10 yıllık süreye bakıp 20.02.2026 > 05.01.2026 (5. adımda bulduk) → zamanaşımına uğramış (HATALI) → doğrusu 15 yıllık ceza zamanaşımı 05.01.2031 (8. adımda bulduk) henüz dolmadı → zamanaşımına uğramamıştır","anlatim":"En sık hata: öğrenciler sadece 2 ve 10 yıllık süreye bakıp 'zamanaşımına uğramış' der, ama fiil aynı zamanda daha uzun ceza zamanaşımlı bir suç olduğunu gözden kaçırır. Doğrusu, 15 yıllık ceza zamanaşımı henüz dolmadığı için tazminat istemi zamanaşımına uğramamıştır.","doldur":[]}],"anahtar":[{"ornek":"yıllık","kok":"yıllık"},{"ornek":"zamanaşımı","kok":"zamana"},{"ornek":"tarihinden","kok":"tarihi"},{"ornek":"kanununda","kok":"kanunu"},{"ornek":"süreler","kok":"sürele"},{"ornek":"uygulanır","kok":"uygula"}],"konuGiris":{"harita":"Ne zaman test edilir: öğrenme tarihinden itibaren iki yıllık ve fiil tarihinden itibaren on yıllık sürelerin ikisi de dolmuş mu diye bakılır. Nasıl ölçülür: fiil ceza kanununda daha uzun zamanaşımı gerektiren bir suç oluşturuyorsa, o uzun ceza zamanaşımı süresi uygulanır. Nasıl kaydedilir: dava tarihi ile bu sürelerin bitiş tarihleri karşılaştırılarak zamanaşımının dolup dolmadığı sonucu yazılır.","desen":"Sınav genelde öğrenme tarihinden iki yıl geçmiş gibi görünse de fiilin ceza kanununda uzun zamanaşımlı bir suç oluşturduğu bilgisini vererek asıl uygulanacak sürenin uzun süre olduğunu test eder. Tuzak, öğrenciyi sadece iki veya on yıllık genel kurala bakıp ceza zamanaşımı istisnasını gözden kaçırmaya iter (Türk Borçlar Kanunu m.72). Bu soru m.72'deki ceza zamanaşımı istisnası noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"zarar ve failin öğrenildiği tarihten başlayan iki yıllık kısa süre","ad":"öğrenme süresi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"haksız fiilin işlendiği tarihten başlayan on yıllık genel üst sınır","ad":"fiil süresi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"fiil daha uzun ceza zamanaşımlı suç oluşturuyorsa uygulanan uzatılmış süre","ad":"ceza zamanaşımı istisnası","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"her sürenin hangi olaydan itibaren işlemeye başladığını gösteren tarih","ad":"sürelerin başlangıç tarihi","kim":"kanun sabitler"}],"sinavda":"Fiil, öğrenme ve dava tarihleri verilip zamanaşımının dolup dolmadığının hangi kurala göre belirleneceği sorulur.","panel_ornek":"Bir arkadaşın komşusunun camını kırdı, komşu bunu 3 ay sonra öğrendi. Ama caddeye kamera koyduran belediye, kamera görüntülerinin saklama süresini 10 yıl olarak belirlemiş. Kısa fark eden süre mi işler yoksa uzun olan mı, kafanı karıştırabilir; işte zamanaşımı hesabı tam da bunu netleştirir.","ornek":"Bir arkadaşın komşusunun camını kırdı, komşu bunu 3 ay sonra öğrendi. Ama caddeye kamera koyduran belediye, kamera görüntülerinin saklama süresini 10 yıl olarak belirlemiş. Kısa fark eden süre mi işler yoksa uzun olan mı, kafanı karıştırabilir; işte zamanaşımı hesabı tam da bunu netleştirir.","yontemler":"Önce iki yıllık ve on yıllık süreleri hesapla, sonra fiilin ceza kanununda daha uzun süreli bir suç oluşturup oluşturmadığını kontrol et; oluşturuyorsa o süreyi esas al.","nedir":"Haksız fiilden doğan tazminat davasının hangi sürede açılması gerektiğini gösteren kurumdur. Sınav, öğrenme tarihinden başlayan kısa süre ile fiilin işlenmesinden başlayan uzun süreyi ve ceza zamanaşımı istisnasını doğru uygulayıp uygulayamadığını ölçer."},"olay":"Fiil tarihi 05.01.2016 + 15 yıl = 05.01.2031; dava tarihi 20.02.2026 bu tarihten öncedir.","tuzak":{"C":{"ad":"Yanlış Hesap Tuzağı","metin":"On yıllık sürenin 05.01.2026'da dolduğunu gözden kaçırıp henüz dolmadığını düşünüyorsun; sonucu doğru bulsan da gerekçen yanlıştır. Doğrusu: On yıllık süre fiilen dolmuştur, zamanaşımına uğramama sebebi on beş yıllık ceza zamanaşımının uygulanmasıdır."},"A":{"ad":"İki Yıl Yeter Tuzağı","metin":"Öğrenmeden başlayan iki yıllık sürenin dolmuş olmasını tek başına yeterli sanıyorsun. Doğrusu: Fiil ceza kanununda daha uzun zamanaşımı öngörülen bir suçu oluşturduğundan iki yıllık ve on yıllık süreler yerine on beş yıllık süre uygulanır."},"D":{"ad":"Süre Hesabı Tuzağı","metin":"On beş yıllık sürenin 2026'da dolduğunu sanıyorsun; oysa süre fiil tarihinden başlar ve 2031'de dolar. Doğrusu: On beş yıllık ceza zamanaşımı süresi 2026 yılında henüz dolmamıştır."},"B":{"ad":"Genel Süre Tuzağı","metin":"On yıllık sürenin dolmuş olmasından hareketle zamanaşımına uğradığı sonucuna varıyorsun ve ceza kanunundaki daha uzun süreyi gözden kaçırıyorsun. Doğrusu: Ceza kanunu daha uzun zamanaşımı öngördüğünden bu süre uygulanır, on yıllık süre artık esas alınmaz."}},"celdiriciYol":{"C":"05.01.2016 + 10 yıl = 05.01.2026 tarihini dava tarihinden (20.02.2026) sonraymış gibi okuma (süre hesabı hatası)","A":"10.03.2019 + 2 yıl = 10.03.2021 (dolmuş) → doğrudan zamanaşımına uğradı sonucu (ceza zamanaşımı istisnasını atlama)","D":"05.01.2016 + 15 yıl hesabını 2026 sayarak yapma, yani süreyi dava yılıyla karıştırma (süre başlangıcı hatası)","B":"05.01.2016 + 10 yıl = 05.01.2026 (dava 20.02.2026'dan önce dolmuş) → doğrudan zamanaşımına uğradı sonucu (ceza zamanaşımı istisnasını atlama)"},"hap":"Haksız fiil ceza gerektiren ve ceza kanununda daha uzun zamanaşımı öngörülen bir suçu oluşturuyorsa, iki yıllık ve on yıllık süreler yerine bu daha uzun ceza zamanaşımı süresi uygulanır.","teshis":{"C":{"gercek":"On yıllık süre 05.01.2026'da fiilen dolmuştur; zamanaşımına uğramama nedeni bu değil, on beş yıllık ceza zamanaşımının uygulanmasıdır.","ayirt":"Zamanaşımına uğramama gerekçem hangi süreye dayanıyor, doğru süre bu mu?","paragraf":"TBK m.72/1","yanilgi":"Doğru sonuca ulaşsan da on yıllık sürenin dolduğunu fark etmeyip yanlış gerekçeyle savunuyorsun."},"E":{"gercek":"Türk Borçlar Kanunu m.72/1 cümle 2, ceza kanununun daha uzun zamanaşımı öngördüğü fiillerde bu sürenin uygulanacağını emreder; süre fiil tarihinden başlar ve dava tarihinde henüz dolmamıştır.","ayirt":"Fiil bir suç oluşturuyor mu ve o suç için öngörülen ceza zamanaşımı, genel sürelerden uzun mu?","paragraf":"TBK m.72/1","yanilgi":"Bu şıkkı eleyen öğrenci genellikle on yıllık sürenin dolmuş olmasına bakıp zamanaşımının gerçekleştiğini sanır, ceza zamanaşımının önceliğini gözden kaçırır."},"A":{"gercek":"Türk Borçlar Kanunu m.72/1 cümle 2 uyarınca fiil daha uzun ceza zamanaşımı öngörülen bir suçu oluşturuyorsa iki ve on yıllık süreler devre dışı kalır.","ayirt":"Fiil aynı zamanda bir suç mu, ceza kanunu daha uzun süre mi öngörüyor?","paragraf":"TBK m.72/1","yanilgi":"İki yıllık öğrenme süresinin dolmasını tek başına yeterli sayıp ceza zamanaşımı istisnasını hiç aramıyorsun."},"D":{"gercek":"Ceza zamanaşımı da fiilin işlendiği tarihten itibaren işler; 05.01.2016 + 15 yıl = 05.01.2031.","ayirt":"Süreyi hangi tarihten başlatarak hesapladım, fiil tarihinden mi?","paragraf":"TBK m.72/1","yanilgi":"On beş yıllık süreyi de dava yılına (2026) göre hesaplayıp fiil tarihinden başlatmayı unutuyorsun."},"B":{"gercek":"Ceza kanunu daha uzun zamanaşımı öngördüğünde bu süre genel on yıllık süreyi tamamen ikame eder.","ayirt":"On yıllık süre dolmuş olsa da, olayda daha uzun bir ceza zamanaşımı var mı?","paragraf":"TBK m.72/1","yanilgi":"On yıllık sürenin dolmuş olmasını gördüğünde işin bittiğini düşünüp ceza zamanaşımı istisnasını atlıyorsun."}},"verilen":[[6,1],[7,1],[8,1],[8,0],[1,1],[2,1],[3,1],[4,1]],"donem":4,"hesaplar":{}},{"capa":null,"kural":"Net satışlar eksi satılan malın maliyeti brüt satış kârına eşittir; satılan malın maliyeti dönem başı stok artı net alışlar eksi dönem sonu stok formülünden alışlar ters çözülür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/2 ders 03 Soru 8","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ters sorularda önce hangi büyüklüğün isteneceğini belirle, sonra formülü o değişken için yeniden düzenle.","konu":"satışların maliyeti tablosu","tablo":{"satirlar":[["VERİLENLER","-"],["Brüt satışlar","685.000 ₺"],["Satıştan iadeler","12.500 ₺"],["Satış iskontoları","8.700 ₺"],["Dönem başı ticari mal stoku","47.350 ₺"],["Dönem sonu ticari mal stoku","39.900 ₺"],["Pazarlama ve genel yönetim gideri","65.200 ₺"],["Finansman gideri","21.400 ₺"],["Brüt satış kârı","210.150 ₺"],["HESAP","-"],["Net Satışlar (685.000-12.500-8.700)","663.800"],["Satılan Ticari Malların Maliyeti (663.800-210.150)","453.650"],["Dönem İçi Net Alışlar (453.650-47.350+39.900)","446.200"]],"basliklar":["Kalem","Tutar (₺)"]},"siklar":{"C":"454.900","E":"467.400","A":"202.700","D":"461.100","B":"446.200"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Brüt satış kârı hesaplama ve gelir tablosu akışı (net satışlar, satışların maliyeti, brüt satış kârı, faaliyet kârı)","metin":"TEORİ/TEKNİK (finansal muhasebe; Tekdüzen Muhasebe Sistemi gelir tablosu düzeni ve 6. sınıf hesaplar). KURAL: Gelir tablosu kademeli kurulur. BRÜT SATIŞLAR (600 Yurt İçi Satışlar + 601 Yurt Dışı Satışlar + 602 Diğer Gelirler) − SATIŞ İNDİRİMLERİ (610 Satıştan İadeler + 611 Satış İskontoları + 612 Diğer İndirimler) = NET SATIŞLAR. NET SATIŞLAR − SATIŞLARIN MALİYETİ (620 Satılan Mamuller Maliyeti, 621 Satılan Ticari Mallar Maliyeti, 622 Satılan Hizmet Maliyeti, 623 Diğer Satışların Maliyeti) = BRÜT SATIŞ KÂRI (veya zararı). BRÜT SATIŞ KÂRI − FAALİYET GİDERLERİ (630 Araştırma Geliştirme, 631 Pazarlama Satış Dağıtım, 632 Genel Yönetim) = FAALİYET KÂRI. FAALİYET KÂRI + Diğer Faaliyetlerden Olağan Gelir ve Kârlar (64 grubu) − Diğer Faaliyetlerden Olağan Gider ve Zararlar (65 grubu) − Finansman Giderleri (66 grubu) = OLAĞAN KÂR. + Olağandışı Gelir ve Kârlar (67) − Olağandışı Gider ve Zararlar (68) = DÖNEM KÂRI. − Vergi ve yasal yükümlülük karşılıkları = DÖNEM NET KÂRI. Satılan ticari malların maliyeti (aralıklı envanter): Dönem başı stok + Dönem içi net alışlar − Dönem sonu stok. BRÜT SATIŞ KÂRI DEĞİŞİMİ: Satış fiyatı, satış miktarı ya da birim maliyet değişince brüt kâr değişir; kârlılık oranı = brüt satış kârı / net satışlar. ÖRNEK: Brüt satışlar 800.000; satıştan iadeler 20.000; satış iskontoları 30.000 → Net satışlar 750.000. Dönem başı stok 100.000 + alışlar 500.000 − dönem sonu stok 150.000 = satılan malın maliyeti 450.000 → Brüt satış kârı 300.000. Faaliyet giderleri 120.000 → Faaliyet kârı 180.000. Brüt kâr oranı 300.000 / 750.000 = %40. SINAV TUZAĞI: (1) Brüt satış kârı N…"},{"ad":"TEORI - Safha maliyet sisteminde maliyet dağıtım tablosu: miktar dengesi, eşdeğer birim, birim maliyet ve maliyet dağıtımı basamakları; ağırlıklı ortalama ile ilk giren ilk çıkar karşılaştırması","metin":"TEORİ (Maliyet Muhasebesi; MSUGT Sıra No:1 Tekdüzen Hesap Planı 151 Yarı Mamuller-Üretim, 152 Mamuller; ders kitabı kuralı). TANIM: Safha (evre) maliyet sistemi, birbirinin aynı ürünlerin kesintisiz üretildiği işletmelerde kullanılır; maliyet siparişe değil SAFHAYA toplanır ve safhanın toplam maliyeti o safhadan geçen eşdeğer birim sayısına bölünür. BASAMAK 1 - MİKTAR DENGESİ: Dönem başı yarı mamul + üretime başlanan = tamamlanıp sonraki safhaya gönderilen + dönem sonu yarı mamul. Bu denge kurulmadan eşdeğer birim hesaplanmaz; sınavda dönem sonu yarı mamul çoğu kez bu dengeden bulunur. BASAMAK 2 - EŞDEĞER BİRİM: Her maliyet unsuru için ayrı hesaplanır, çünkü tamamlanma dereceleri farklıdır. Direkt ilk madde genellikle safha başında verildiği için yarı mamullerde yüzde 100, şekillendirme (dönüştürme) maliyeti ise ilerledikçe eklendiği için kısmi sayılır. AĞIRLIKLI ORTALAMADA eşdeğer birim = tamamlanan + dönem sonu yarı mamul × tamamlanma yüzdesi; dönem başı yarı mamul tamamlananların içinde TAM sayılır ve geçen dönem yapılmış işi ayrıştırılmaz. İLK GİREN İLK ÇIKARDA (ilk giren ilk çıkar (FIFO)) eşdeğer birim = dönem başı yarı mamulün TAMAMLANMASI için kalan yüzde + bu dönem başlanıp tamamlanan + dönem sonu yarı mamul × tamamlanma yüzdesi; yalnız bu dönem yapılan iş sayılır. İki yöntemin eşdeğer birim farkı, dönem başı yarı mamulün geçen dönem yapılmış işine eşittir. BASAMAK 3 - BİRİM MALİYET: Ağırlıklı ortalamada birim maliyet = (dönem başı yarı mamul maliyeti + dönem maliyeti) / eşdeğer birim; ilk giren ilk çıkar yönteminde birim maliyet = YALNIZ dönem maliyeti / eşdeğer birim, devreden maliyet paya girmez. BASAMAK 4 …"}],"hakem":"Soru Brüt satış kârı formülü (Net satışlar − Satışların maliyeti = Brüt satış kârı) ve satılan ticari malların maliyeti formülünün (Dönem başı stok + Net alışlar − Dönem sonu stok) uygulanmasını ölçmektedir; her iki kural kaynak metinde açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Satış iskontosunu hesaplamaya almayıp brüt satışları net satış gibi kullanırsan, net satışları yüksek bulursun ve bu da satılan malın maliyetini ve alışları düşük hesaplamanı sağlar. Net satışlar, brüt satışlardan hem iadeler hem iskontolar eksiği ile bulunmalıdır.","E":"Satış indirimlerini hiç düşmeyip brüt satışları net satış olarak işleme aldığında, satılan malın maliyetini ve buradan alışları yüksek bulursun. Net satışlar brüt satışlardan satıştan iadeler ve iskontolar düşülerek elde edilir.","D":"Dönem başında stokun az, dönem sonunda çoksa bu yanılsam; dönem başı stoğun maliyete eklenmesi, dönem sonunun çıkarılması gerekir çünkü dönem sonu stok satılmamıştır. Yanlış sıra kullanmak alışları yanlış hesaplamaya yönlendirir.","A":"Brüt satış kârını doğrudan satılan malın maliyeti sandığında, alışları hemen bu kârdan çıkarmış olursun. Yapılması gereken: önce net satışlardan brüt kârı çıkartıp satılan malın maliyetini, ardından stok formülünü uygulamaktır."},"dogru":"Net satışları bulmak için brüt satışlardan iadeler ve iskontolar çıkarılır (663.800 ₺). Sonra bu net satışlardan brüt satış kârı çıkarılarak satılan malın maliyeti bulunur (453.650 ₺). Son olarak satılan malın maliyet formülünden alışlar ters çözülür: dönem başı stok artı alışlar eksi dönem sonu stok eşittir satılan maliyet; buradan alışlar 446.200 ₺ çıkar.","sinav":"Brüt satış kârı net satışlardan hesaplanır ve satılan ticari malların maliyeti dönem başı stok artı dönem içi net alışlar eksi dönem sonu stoktan bulunur.","kavramlar":[{"kaynak":"TEORI","tanim":"Brüt satışlardan satıştan iadeler, satış iskontoları ve diğer indirimler düşülerek bulunan satış geliridir.","ad":"Net satışlar"},{"kaynak":"TEORI","tanim":"Dönem içinde satılan ticari malların maliyetidir; dönem başı stok artı dönem içi net alışlar eksi dönem sonu stok formülü ile hesaplanır.","ad":"Satılan ticari malların maliyeti"},{"kaynak":"TEORI","tanim":"Net satışlardan satışların maliyeti çıkartılarak bulunan kârdır ve faaliyet giderleri hesaplanmadan önceki kârda bulunur.","ad":"Brüt satış kârı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":11,"ornekler":[],"donemler":["2026/2","2019/1","2016/3","2014/3","2014/2","2014/1","2013/3","2012/3","2011/2","2009/1","2008/2","2008/1"]},"oyun":{"bosluk":[[2,1]],"tablo":{"basliklar":["Kalem","Tutar (₺)"],"satirlar":[["Net Satışlar (720.000-15.000-9.400)","695.600"],["Satılan Ticari Malların Maliyeti (695.600-225.300)","470.300"],["Dönem İçi Net Alışlar (470.300-52.400+41.500)","459.400"]]},"tur":"tablo","soru":"İşletme, dönem içinde 720.000 ₺ brüt satış gerçekleştirmiştir; satıştan iadeler 15.000 ₺, satış iskontoları 9.400 ₺'dir. Ticari mal dönem başı stoku 52.400 ₺, dönem sonu stoku 41.500 ₺'dir. Ayrıca dönem içinde 58.700 ₺ pazarlama ve genel yönetim gideri, 19.800 ₺ finansman gideri gerçekleşmiştir. Brüt satış kârı 225.300 ₺ olarak hesaplanmıştır. Bu bilgilere göre dönem içi net alışlar tutarı kaç ₺'dir?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve dönem içi net alışlar tutarının kaç ₺ olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, dönem içinde 685.000 ₺ brüt satış gerçekleştirmiştir; satıştan iadeler 12.500 ₺, satış iskontoları 8.700 ₺'dir. Ticari mal dönem başı stoku 47.350 ₺, dönem sonu stoku 39.900 ₺'dir. Ayrıca dönem içinde 65.200 ₺ pazarlama ve genel yönetim gideri, 21.400 ₺ finansman gideri gerçekleşmiştir. Brüt satış kârı 210.150 ₺ olarak hesaplanmıştır. Bu bilgilere göre dönem içi net alışlar tutarı kaç ₺'dir?","kayitBaslik":"","id":"smmm-4k-a-maliyet-cokzor-r9/kp-01","verilenler":[{"deger":"685.000 ₺","anlam":"Net satışlar hesabının başlangıç tutarı, indirimler bundan düşülür.","ad":"Brüt satışlar"},{"deger":"12.500 ₺","anlam":"Net satışlar hesaplanırken brüt satışlardan düşülen bir satış indirimi kalemi.","ad":"Satıştan iadeler"},{"deger":"8.700 ₺","anlam":"Net satışlar hesaplanırken brüt satışlardan düşülen ikinci satış indirimi kalemi.","ad":"Satış iskontoları"},{"deger":"47.350 ₺","anlam":"Satılan malın maliyeti formülüne eklenen başlangıç stok tutarı.","ad":"Dönem başı ticari mal stoku"},{"deger":"39.900 ₺","anlam":"Satılan malın maliyeti formülünden çıkarılan dönem sonu stok tutarı.","ad":"Dönem sonu ticari mal stoku"},{"deger":"65.200 ₺","anlam":"Faaliyet giderleridir; satışların maliyeti tablosuna ve bu hesaplamaya dahil değildir.","ad":"Pazarlama ve genel yönetim gideri"},{"deger":"21.400 ₺","anlam":"Faaliyet kârından sonra düşülür; satılan malın maliyeti hesaplamasına dahil değildir.","ad":"Finansman gideri"},{"deger":"210.150 ₺","anlam":"Net satışlar ile satılan malın maliyeti arasındaki farktır; sorudaki bilinen sonuç değeridir.","ad":"Brüt satış kârı"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı - Gelir Tablosu Düzeni (600-623 hesap grupları)","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Brüt satış 685.000 (soruda verilen); Satıştan iadeler 12.500 (soruda verilen); Satış iskontoları 8.700 (soruda verilen); Dönem başı stok 47.350 (soruda verilen); Dönem sonu stok 39.900 (soruda verilen); Brüt satış kârı 210.150 (soruda verilen)","anlatim":"Soru bize şunları vermiş: brüt satış 685.000, iadeler 12.500, iskontolar 8.700. Ayrıca dönem başı stok 47.350, dönem sonu stok 39.900 ve brüt satış kârı 210.150 verilmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]]},{"formul":"Net Satışlar = Brüt Satış − İadeler − İskontolar = 685.000 (soruda verilen) − 12.500 (soruda verilen) − 8.700 (soruda verilen) = 663.800 ₺","anlatim":"Net satışlar nedir? Brüt satıştan iade ve iskontoları çıkarınca müşteriye kalan gerçek satış tutarı bulunur.","doldur":[[10,1]]},{"formul":"Satılan Malların Maliyeti = Net Satışlar − Brüt Satış Kârı = 663.800 (2. adımda bulduk) − 210.150 (soruda verilen) = 453.650 ₺","anlatim":"Satılan ticari malların maliyeti nedir? Net satışlardan brüt kârı çıkarırsak satılan malın maliyetine ulaşırız, çünkü brüt kâr bu ikisinin farkıdır.","doldur":[[11,1]]},{"formul":"Net Alışlar = Satılan Malların Maliyeti − Dönem Başı Stok + Dönem Sonu Stok = 453.650 (3. adımda bulduk) − 47.350 (soruda verilen) + 39.900 (soruda verilen) = 446.200 ₺","anlatim":"Şimdi biz hesaplıyoruz: satılan malın maliyeti formülünü tersten çözüp net alışları buluyoruz. Formül dönem başı stok artı net alışlar eksi dönem sonu stok şeklindeydi.","doldur":[[12,1]]},{"formul":"Dönem İçi Net Alışlar = 446.200 ₺ (4. adımda bulduk)","anlatim":"Sonuç: dönem içi net alışlar tutarı 446.200 ₺ çıktı. Bu, işletmenin dönem içinde ticari mal için yaptığı toplam alış tutarıdır.","doldur":[]},{"formul":"Ters durum: net alışlar verilseydi → Satılan Malların Maliyeti = Dönem Başı Stok + Net Alışlar − Dönem Sonu Stok","anlatim":"Ters durumda: soru net alışlar verip brüt kârı sorsaydı, aynı formülü ileri yönde kurup satılan maliyeti önce bulman gerekirdi.","doldur":[]},{"formul":"Yanlış yol: 453.650 − 65.200 − 21.400 = 367.050 (HATALI) → doğrusu 446.200 (4. adımda bulduk)","anlatim":"En sık hata: pazarlama gideri 65.200 ve finansman gideri 21.400'ü hesaba katıp net alışları farklı çıkarmak. Bu giderler brüt kâr hesabına girmez, faaliyet giderleridir.","doldur":[]}],"anahtar":[{"ornek":"satılan","kok":"satıla"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"alışlar","kok":"alışla"},{"ornek":"formülü","kok":"formül"},{"ornek":"satışlardan","kok":"satışl"},{"ornek":"ticari","kok":"ticari"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu kalemleri verilip brüt kâr veya net alış gibi bir ara değer istendiğinde test edilir. Nasıl ölçülür: net satışlar, satılan malın maliyeti ve brüt satış kârı arasındaki ters işlem kurulup kurulamadığına bakılır. Nasıl kaydedilir: sonuç yalnız istenen tek tutar olarak, ara işlemler gösterilmeden yazılır.","desen":"Sınav çoğunlukla brüt kârı ya da stok kalemlerinden birini vererek net alışları geriye dönük buldurur; tuzak faaliyet giderlerinin veya finansman giderinin bu hesaba karıştırılmasıdır (p.28). İkinci tuzak, dönem sonu stokun büyüklüğünün maliyeti nasıl etkilediğinin gözden kaçırılmasıdır. Bu soru brüt satış kârından geriye giderek satılan malın maliyeti ve net alışların bulunması noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Brüt satışlardan iade ve iskonto gibi indirimler düşüldükten sonra kalan tutar","ad":"Net satışlar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönem başı stok ile net alışlar toplamından dönem sonu stok çıkarılarak bulunan tutar","ad":"Satılan ticari mal maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönem başı ve dönem sonu stok ile satılan malın maliyeti arasındaki ilişkiden geriye dönük bulunan alış tutarı","ad":"Dönem içi net alışlar","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Net satışlardan satılan malın maliyeti düşüldükten sonra kalan kâr","ad":"Brüt satış kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Brüt satışlar, indirimler, dönem başı-sonu stok ve brüt satış kârı verilir; dönem içi net alışlar tutarı istenir.","panel_ornek":"İkinci el bir telefon satıcısı düşün: elinde 10 adet dönem başı telefon var, dönem içinde 40 adet daha alıyor, dönem sonunda elinde 6 adet kaldı; satılan telefon sayısı 10+40-6=44'tür. Aynı mantıkla stok tutarları üzerinden satılan malın maliyeti bulunur, kargo ya da mağaza kirası gibi giderler bu hesaba girmez.","ornek":"İkinci el bir telefon satıcısı düşün: elinde 10 adet dönem başı telefon var, dönem içinde 40 adet daha alıyor, dönem sonunda elinde 6 adet kaldı; satılan telefon sayısı 10+40-6=44'tür. Aynı mantıkla stok tutarları üzerinden satılan malın maliyeti bulunur, kargo ya da mağaza kirası gibi giderler bu hesaba girmez.","yontemler":"Önce net satışlar bulunur, brüt kârdan satılan malın maliyeti geriye dönük hesaplanır; sonra stok dengesinden net alışlara ulaşılır. Pazarlama, genel yönetim ve finansman giderleri bu hesaplamaya hiç dahil edilmez.","nedir":"Satışların maliyeti tablosu, net satışlardan brüt satış kârına giderken satılan malın maliyetinin nasıl bulunduğunu gösteren gelir tablosu basamağıdır. Sınav bu basamakta hangi kalemin hangi tutara girip girmediğini ölçer."},"olay":"Net satışlar 663.800 eksi Brüt kâr 210.150 eşittir Satılan maliyet 453.650; 453.650 eksi 47.350 artı 39.900 eşittir 446.200.","tuzak":{"C":{"ad":"İskonto Atlama Tuzağı","metin":"Satış iskontosunu net satışlar hesaplamasına dahil etmeyi unuttun. Doğrusu: Net satışlar, brüt satışlardan hem iadeler hem iskontolar düşülerek bulunur."},"E":{"ad":"Net Satış Atlama Tuzağı","metin":"Satış indirimlerini hiç düşmeyip brüt satışları net satış olarak kullandın. Doğrusu: Net satışlar brüt satışlardan satıştan iadeler ve iskontolar düşülerek hesaplanır."},"D":{"ad":"Stok Karıştırma Tuzağı","metin":"Dönem başı ve dönem sonu ticari mal stoklarını birbirinin yerine kullandın. Doğrusu: Dönem sonu stok maliyetten çıkarılır, dönem başı stok maliyete eklenir."},"A":{"ad":"Brüt Kârı Maliyet Sanma Tuzağı","metin":"Brüt satış kârını doğrudan satılan ticari malların maliyeti gibi kullanıp alışları buldun. Doğrusu: Önce net satışlardan brüt kâr çıkarılarak satılan maliyet bulunmalıdır."}},"celdiriciYol":{"C":"685.000 - 12.500 - 210.150 = 462.350; 462.350 - 47.350 + 39.900 = 454.900 (satış iskontosunu net satışlardan düşmeyi unuttun)","E":"685.000 - 210.150 = 474.850; 474.850 - 47.350 + 39.900 = 467.400 (satış indirimlerini net satışlar hesabına dahil etmedin, brüt satışları net satış saydın)","D":"453.650 - 39.900 + 47.350 = 461.100 (dönem başı ve dönem sonu stok tutarlarını birbirine karıştırdın)","A":"210.150 - 47.350 + 39.900 = 202.700 (brüt satış kârını satılan ticari malların maliyeti sandın)"},"hap":"Brüt satış kârı net satışlardan hesaplanır; satılan malın maliyeti formülü ters çözülerek alış tutarına ulaşılabilir.","teshis":{"C":{"gercek":"Net satışlar hesaplanırken 610 Satıştan İadeler ile 611 Satış İskontoları birlikte brüt satışlardan düşülür.","ayirt":"Brüt satışlardan hem iade hem iskonto düştüm mü?","paragraf":"THP 610-611","yanilgi":"Satış iskontosunun net satışları etkilemediğini, sadece iadelerin düşüldüğünü sanıyorsun."},"E":{"gercek":"Net satışlar eşittir brüt satışlar eksi satış indirimleri; bu adım atlanınca sonraki tüm katmanlar hatalı çıkar.","ayirt":"Brüt satışlardan indirimleri düştüm mü?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Brüt satışların doğrudan net satış olduğunu, indirimlerin ihmal edilebileceğini düşünüyorsun."},"A":{"gercek":"Brüt satış kârı net satışlardan satılan malın maliyeti çıkarılarak bulunur; ikisi ayrı katmandır.","ayirt":"Bu tutar net satışlardan mı çıkarıldı, yoksa doğrudan mı kullandım?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Brüt satış kârının satılan malın maliyetiyle aynı şey olduğunu düşünüyorsun."},"D":{"gercek":"Satılan malın maliyeti formülünde dönem başı stok eklenir, dönem sonu stok çıkarılır; sıra değişmez.","ayirt":"Hangi stok eklendi, hangisi çıkarıldı, yönlerini kontrol ettim mi?","paragraf":"MSUGT 153","yanilgi":"Dönem başı ve dönem sonu stokun formülde birbirinin yerine geçebileceğini düşünüyorsun."},"B":{"gercek":"Satılan malın maliyeti formülü tersine çözülerek net alışlar bulunabilir; bu safha maliyet dağıtım mantığının aynısıdır.","ayirt":"Denklemi ileri değil ters yönde kurdum mu?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Bu şıkkı eleyen öğrenci, brüt satış kârından geriye doğru alış tutarına ulaşmanın mümkün olmadığını düşünür."}},"verilen":[[10,1],[11,1],[12,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]],"donem":11,"hesaplar":{}},{"capa":null,"kural":"TBK m.139/3, zamanaşımına uğramış alacağın takasını, takas edilebileceği anda henüz zamanaşımına uğramamış olması koşuluyla kabul eder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/1 ders 06 Soru 3","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Takas sorularında 'ne zaman' sorusunu beyan tarihine göre değil, iki borcun birlikte muaccel olduğu tarihe göre çöz.","konu":"borcu sona erdiren sebepler","tablo":{"satirlar":[["VERİLENLER","-","-"],["İşletme'nin alacağı","60.000 ₺","-"],["Kişi'nin alacağı","60.000 ₺","-"],["Borçların birlikte varlık tarihi","2023","-"],["Beyan tarihi","2026","-"],["HESAP","-","-"],["A) Takas beyanının zamanaşımı süresi dolduktan sonra yapılm…","TBK m.139/3","YANLIŞ ifade"],["B) İşletme'nin alacağı, iki borcun birlikte var olduğu anda…","TBK m.139/3","doğru ifade"],["C) Alacaklardan birinin ödünç bedeline, diğerinin malzeme b…","TBK m.139/1","YANLIŞ ifade"],["D) Zamanaşımına uğramış bir alacak, Türk Borçlar Kanunu uya…","TBK m.139/3","YANLIŞ ifade"],["E) Taraflar arasında alacaklı ve borçlu sıfatları aynı kişi…","TBK m.135","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Alacaklardan birinin ödünç bedeline, diğerinin malzeme bedeline dayanması, edimlerin özdeş sayılmasını engellediğinden takas mümkün değildir.","E":"Taraflar arasında alacaklı ve borçlu sıfatları aynı kişide birleştiğinden borç zaten sona ermiş olup takas beyanına gerek kalmamıştır.","A":"Takas beyanının zamanaşımı süresi dolduktan sonra yapılmış olması, İşletme'nin takas hakkını ortadan kaldırır.","D":"Zamanaşımına uğramış bir alacak, Türk Borçlar Kanunu uyarınca hiçbir koşulda takasa konu edilemeyeceğinden İşletme'nin beyanı sonuçsuzdur.","B":"İşletme'nin alacağı, iki borcun birlikte var olduğu anda zamanaşımına uğramamış olduğundan, takas beyanı geçerli olarak ileri sürülebilir."},"kaynak":{"alinti":"","liste":[{"ad":"TBK (6098 s.K.) m.133","metin":"MADDE 133- Yeni bir borçla mevcut bir borcun sona erdirilmesi, ancak tarafların bu yöndeki açık iradesi ile olur. Özellikle mevcut borç için kambiyo taahhüdünde bulunulması veya yeni bir alacak senedi ya da yeni bir kefalet senedi düzenlenmesi, tarafların açık yenileme iradeleri olmadıkça yenileme sayılmaz. II. Cari hesaplarda"},{"ad":"TBK (6098 s.K.) m.135","metin":"MADDE 135- Alacaklı ve borçlu sıfatlarının aynı kişide birleşmesiyle borç sona erer. Ancak, üçüncü kişilerin alacak üzerinde önceden mevcut olan hakları birleşmeden etkilenmez. Birleşme geçmişe etkili olarak ortadan kalkarsa, borç varlığını sürdürür. Taşınmaz rehni ve kıymetli evraka ilişkin özel hükümler saklıdır. E. İfa imkânsızlığı I. Genel olarak"}],"hakem":"Soru, TBK m.139/3'te yer alan zamanaşımına uğramış alacağın takas koşulunu doğru şekilde ölçmekte ve kaynak metinde açıkça desteklenen kural uygulanmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Alacakların farklı kaynaklardan doğmasını edim özdeşliğinin önü kesen bir engel sanırsın. Oysa her iki borç da para borcu olduğundan, tanımlanan özdeşlik şartı sağlanmıştır.","E":"Alacaklı-borçlu sıfatlarının aynı kişide toplanması kuralını burada uygulamaya çalışırsın. Oysa bu durum İşletme ve Kişi gibi ayrı iki kişinin arasındaki borçlara değil, aynı kişi için geçerlidir.","D":"Zamanaşımına uğramış alacağın hiçbir koşulda takasa konu olamayacağını genel kural sayarsın. Kanun bunun istisnaları olduğunu, iki borcun muaccel olduğu anda zamanaşımı dolduysa takasın mümkün olabileceğini açıkça belirtir.","A":"Takas beyanının zamanlaması ile takas hakkının geçerliliğini karıştırırsın. Kanun, beyanın ne zaman yapıldığını değil, iki borcun birlikte var olduğu andaki durumunu ölçüt alır."},"dogru":"İşletme'nin takas hakkı, 2023'te her iki borç birlikte var olduğu ve alacağı henüz zamanaşımına uğramamış olduğu için geçerlidir. 2026'da beyan yapması önemli değildir, çünkü kanun önemli olan anda iki borcun mevcut olmasını şart koşar.","sinav":"Türk Borçlar Kanunu 139. madde üçüncü fıkrası uyarınca, zamanaşımına uğramış alacağın takası, takas edilebileceği anda henüz zamanaşımına uğramamış olması koşuluyla ileri sürülebilir.","kavramlar":[{"kaynak":"Türk Borçlar Kanunu 139. madde","tanim":"İki kişinin birbirlerine karşılıklı olarak borçlu oldukları edimlerini, alacaklı sıfatıyla karşılaştırıp birbirlerine karşı ortadan kaldırması işlemidir.","ad":"Takas"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":4,"ornekler":[],"donemler":["2019/2","2015/2","2013/3","2011/2"]},"oyun":null,"tip":"teori","soru":"Mobilya üreticisi İşletme'nin, tedarikçisi Kişi'den 2019 yılında verdiği ödünç paraya ilişkin 60.000 ₺ alacağı vardır. Kişi'nin de İşletme'den 2023 yılında teslim ettiği malzeme bedeline ilişkin 60.000 ₺ alacağı bulunmaktadır. İşletme'nin alacağı, iki borcun birlikte var olduğu 2023 yılında zamanaşımına uğramamışken, 2026 yılında zamanaşımına uğramış ve İşletme takas beyanını bu tarihte yapmıştır. Buna göre, aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"smmm-w7-1-yhukuk-zor/kp-01","verilenler":[{"deger":"60.000 ₺","anlam":"İşletme'nin Kişi'den 2019'da doğan ödünç para alacağı, takasa konu edilen alacaktır","ad":"İşletme'nin alacağı"},{"deger":"60.000 ₺","anlam":"Kişi'nin İşletme'den 2023'te doğan malzeme bedeli alacağı, karşı takas konusu borçtur","ad":"Kişi'nin alacağı"},{"deger":"2023","anlam":"İki borcun birlikte muaccel olduğu, takas edilebilir hale geldiği tarihtir","ad":"Borçların birlikte varlık tarihi"},{"deger":"2026","anlam":"İşletme'nin takas beyanını yaptığı, alacağının zaten zamanaşımına uğramış olduğu tarihtir","ad":"Beyan tarihi"}],"dayanak":"TBK m.139/3","dogru":"B","oyunBonus":null,"ders":"Hukuk","adimlar":[{"formul":"Olay: Mobilya üreticisi İşletme, tedarikçisi Kişi'ye 2019'da 60.000 ₺ ödünç vermiş; Kişi de 2023'te İşletme'ye teslim ettiği malzeme bedeli olarak 60.000 ₺ alacaklı olmuş. 2023'te iki borç birlikte varken İşletme'nin alacağı henüz zamanaşımına uğramamış. Zamanaşımı 2026'da tamamlanmış ve İşletme takas beyanını 2026'da yapmış.","anlatim":"Bu olayı iyi çiz kafanda: 2023'te iki borç yan yana duruyor, hiçbiri ölmemiş. 2026'da İşletme'nin alacağı zamanaşımına uğruyor ama beyan yine de o tarihte geliyor.","doldur":[]},{"formul":"Ne yapacağız: TBK m.139/3'e göre zamanaşımına uğramış bir alacak, takas edilebileceği anda henüz zamanaşımına uğramamışsa takasa konu olabilir. 2023'te İşletme'nin alacağı sağlamdı, 2026'da zamanaşımı doldu ama beyan geçerli olabilir mi diye soracağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural tek: önemli olan beyan tarihi değil, borçların birlikte var olduğu andaki durum. Şimdi her şıkkı bu olaya uygulayalım.","doldur":[]},{"doldur":[[6,1],[6,2]],"sik":"A","paragraf":"TBK m.139/3","karar":"yanlış","anlatim":"Olayda beyan 2026'da yapılmış ama 2023'te borçlar sağlamken takas hakkı doğmuş. Kanun beyan tarihine değil, birlikte var olma anına bakar. Bu yüzden bu ifade yanlış.","formul":"Şık A: 'Beyan zamanaşımı dolduktan sonra yapıldı, bu yüzden takas hakkı ortadan kalktı' diyorsun, katılır mısın?"},{"doldur":[[7,1],[7,2]],"sik":"B","paragraf":"TBK m.139/3","karar":"doğru","anlatim":"2023'te iki borç birlikte var ve İşletme'nin alacağı henüz zamanaşımına uğramamıştı, tam da kanunun istediği koşul bu. Sonra 2026'da zamanaşımı dolması artık takası engellemiyor. Bu ifade doğru.","formul":"Şık B: 'İşletme'nin alacağı 2023'te zamanaşımına uğramamıştı, o yüzden takas beyanı geçerli' diyorsun, doğru mu?"},{"doldur":[[8,1],[8,2]],"sik":"C","paragraf":"TBK m.139/1","karar":"yanlış","anlatim":"İki borç da sonuçta para borcu, kaynağının ödünç ya da satış olması önemli değil. Kanun edimin cinsine bakar, kaynağına bakmaz. Bu ifade yanlış.","formul":"Şık C: 'Biri ödünç parası biri malzeme bedeli, edimler özdeş değil, takas olmaz' diyorsun, haklı mısın?"},{"doldur":[[9,1],[9,2]],"sik":"D","paragraf":"TBK m.139/3","karar":"yanlış","anlatim":"Kanun burada istisna koymuş: takas edilebilir anda zamanaşımı dolmamışsa takas yapılabilir, tam bu olaydaki gibi. Demek ki 'hiçbir koşulda' ifadesi yanlış.","formul":"Şık D: 'Zamanaşımına uğramış alacak hiçbir koşulda takasa konu olamaz' diyorsun, bu genel kural her zaman geçerli mi?"},{"doldur":[[10,1],[10,2]],"sik":"E","paragraf":"TBK m.135","karar":"yanlış","anlatim":"Olayda İşletme ve Kişi iki ayrı taraf, hiçbiri diğerinin yerine geçmiş değil. Sıfatların birleşmesi tamamen başka bir kurum, burada uygulanmaz. Bu ifade yanlış.","formul":"Şık E: 'Alacaklı ve borçlu sıfatları aynı kişide birleşti, borç zaten sona erdi' diyorsun, olayda böyle bir birleşme var mı?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru B, çünkü zamanaşımı sorusunda kanun beyan tarihine değil borçların birlikte var olduğu ana bakar. Kendine hep şunu sor: 'Zamanaşımı, iki borç bir aradayken mi yoksa daha sonra mı tamamlandı?'","doldur":[]}],"anahtar":[{"ornek":"zamanaşımına","kok":"zamana"},{"ornek":"birlikte","kok":"birlik"},{"ornek":"alacağın","kok":"alacağ"},{"ornek":"borçların","kok":"borçla"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"tarihi","kok":"tarihi"}],"konuGiris":{"harita":"Ne zaman ileri sürülür: Takas beyanının yapıldığı andaki zamanaşımı durumuna bakılır, borcun doğduğu ana değil. Nasıl ölçülür: Takas edilecek alacağın, beyan anında zamanaşımına uğramamış olması aranır. Nasıl kaydedilir: Beyan tarihi ile zamanaşımı süresinin dolduğu tarih karşılaştırılarak sonuca varılır.","desen":"Sınav burada tarih karıştırma tuzağı kurar: borcun doğduğu yıl ile takas beyanının yapıldığı yıl farklı verilir ve öğrencinin yanlış tarihe bakması beklenir. Doğru çözüm, yalnızca beyan anındaki zamanaşımı durumuna bakmayı gerektirir; borcun önceden zamanaşımına uğramamış olması yeterli değildir. Bu soru TBK m.139/3 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Karşılıklı muaccel iki borcun birbirine mahsup edilerek sona ermesi","ad":"Takas","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Borcun ifasının istenebilir hale gelmesi, vadenin dolması","ad":"Muacceliyet","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Alacağın dava edilebilirliğini ortadan kaldıran kanuni süre","ad":"Zamanaşımı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Takas iradesinin açıklandığı, zamanaşımı kontrolünün yapıldığı tarih","ad":"Takas beyanı anı","kim":"kanun sabitler"}],"sinavda":"İki karşılıklı borcun doğum ve zamanaşımı tarihleri verilip takas beyanının geçerli olup olmadığı sorulur.","panel_ornek":"Genç, arkadaşına 500 ₺ borç vermiş; aynı arkadaşı da ona kırtasiyeden aldığı kitap için 500 ₺ borçlu. İki borç da vadesi geldiğinde genç 'ikisini eşitleyelim, ödeşmiş sayalım' diyor. İşte bu karşılıklı borçları eşitleyip sıfırlama işlemine takas denir; ama bunu ancak borç zamanaşımına uğramadan önce yapabilir.","ornek":"Genç, arkadaşına 500 ₺ borç vermiş; aynı arkadaşı da ona kırtasiyeden aldığı kitap için 500 ₺ borçlu. İki borç da vadesi geldiğinde genç 'ikisini eşitleyelim, ödeşmiş sayalım' diyor. İşte bu karşılıklı borçları eşitleyip sıfırlama işlemine takas denir; ama bunu ancak borç zamanaşımına uğramadan önce yapabilir.","yontemler":"Tek kritik kural: zamanaşımı kontrolü, borcun doğduğu tarihte değil takas beyanının yapıldığı tarihte yapılır; beyan anında alacak zamanaşımına uğramışsa takas geçersizdir.","nedir":"Borcu sona erdiren sebepler, bir borç ilişkisinin hangi hukuki olaylarla ortadan kalktığını gösterir. Sınav, hangi sona erme yolunun (takas, birleşme, imkânsızlık) somut olaya uygulanacağını ve koşullarının bilinip bilinmediğini ölçer."},"olay":"2023'te iki borç birlikte mevcut ve İşletme'nin alacağı henüz zamanaşımına uğramamış, zamanaşımı ancak 2026'da tamamlanmıştır.","tuzak":{"C":{"ad":"Kapsam Tuzağı","metin":"Alacakların farklı hukuki kaynaklardan (ödünç, malzeme bedeli) doğmasının edim özdeşliğini bozduğunu düşünürsün. Doğrusu: TBK m.139/1 aynı cins ve nitelikte edimi esas alır, her iki alacak da para borcu olduğundan özdeşlik koşulu sağlanmıştır."},"E":{"ad":"Kurum Karıştırma Tuzağı","metin":"Alacaklı-borçlu sıfatlarının birleşmesini (m.135) takas ile aynı olaya uygularsın. Doğrusu: Birleşme, alacaklı ve borçlunun aynı kişide toplanmasını gerektirir; olayda İşletme ve Kişi ayrı kişiler olduğundan birleşme söz konusu değildir."},"D":{"ad":"Kural Genelleme Tuzağı","metin":"Zamanaşımına uğramış her alacağın takasa konu olamayacağını genel kural sayarsın. Doğrusu: TBK m.139/3 bu genel kurala açık bir istisna getirir; takas edilebilir anda zamanaşımı dolmamışsa takas ileri sürülebilir."},"A":{"ad":"Zamanlama Tuzağı","metin":"Beyanın hangi tarihte yapıldığını belirleyici sanırsın. Doğrusu: TBK m.139/3'e göre önemli olan iki borcun birlikte var olduğu andaki durumdur, beyanın sonradan yapılması hakkı ortadan kaldırmaz."}},"celdiriciYol":{},"hap":"Zamanaşımına uğramış alacağın takası, borçların birlikte var olduğu (takas edilebilir hale geldiği) anda zamanaşımı henüz dolmamışsa geçerlidir.","teshis":{"C":{"gercek":"TBK m.139/1 aynı cins borçları esas alır; kaynağın ödünç ya da satış bedeli olması edimin özdeşliğini etkilemez.","ayirt":"Her iki edim de aynı tür ve nitelikte (para) mi?","paragraf":"TBK m.139/1","yanilgi":"Alacaklardan birinin ödünç para, diğerinin malzeme bedeli olmasının edimlerin özdeşliğini bozduğunu düşünüyorsun."},"E":{"gercek":"Sıfatların birleşmesi (m.135) alacaklı ve borçlunun aynı kişide toplanmasını gerektirir; olayda taraflar farklı kişilerdir, birleşme söz konusu değildir.","ayirt":"Alacaklı ve borçlu aynı kişi mi, yoksa karşılıklı iki ayrı borç mu var?","paragraf":"TBK m.135","yanilgi":"Alacaklı-borçlu sıfatlarının birleşmesiyle borcun sona ermesi kurumunu (m.135), takas ile aynı olaya uygulanabilir sanıyorsun."},"A":{"gercek":"TBK m.139/3 uyarınca belirleyici olan, iki borcun birlikte var olduğu (takas edilebilir hale geldiği) andaki durumdur; beyanın sonradan yapılması hakkı ortadan kaldırmaz.","ayirt":"Zamanaşımı, borçların birlikte var olduğu anda mı yoksa daha sonra mı tamamlanmış?","paragraf":"TBK m.139/3","yanilgi":"Takas beyanının hangi tarihte yapıldığının, hakkın varlığı için belirleyici olduğunu düşünüyorsun."},"D":{"gercek":"TBK m.139/3 istisna getirir: takas edilebilir anda henüz zamanaşımına uğramamışsa takas ileri sürülebilir.","ayirt":"Kanun bu genel kurala istisna getirmiş mi?","paragraf":"TBK m.139/3","yanilgi":"Zamanaşımına uğramış her alacağın takasa konu olamayacağı genel kuralını, kanunun istisnasını görmeden uyguluyorsun."},"B":{"gercek":"TBK m.139/3, takas edilebilir anda zamanaşımı dolmamışsa sonraki zamanaşımının takas hakkını etkilemeyeceğini öngörür.","ayirt":"İki borç birlikte mevcutken zamanaşımı doldu mu, sonra mı doldu?","paragraf":"TBK m.139/3","yanilgi":"Beyan tarihinde alacağın zamanaşımına uğramış olmasının takası tek başına engelleyeceğini düşünüp bu şıkkı elersin."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":4,"hesaplar":{}},{"capa":null,"kural":"303 hesabı bir yıl içinde ödenecek anapara taksitleri ile bunlara ilişkin tahakkuk etmiş ancak ödenmemiş faizleri kapsar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/1 ders 01 Soru 2","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"197.500","taraf":"B","hesap":"400 BANKA KREDİLERİ"},{"tutar":"197.500","taraf":"A","hesap":"303 UZUN VADELİ KREDİLERİN ANAPARA TAKSİTLERİ VE FAİZLERİ"}],"teori":false,"taktik":"Bilanço tarihinden itibaren bir yıl içindeki vadeyi gör; sadece o kısmı aktar, kredinin tamamını değil.","konu":"bilanço düzenleme","tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["VERİLENLER","-"],["Toplam kredi anapara bakiyesi","640.000 ₺"],["Bir yıl içinde ödenecek taksit","185.000 ₺"],["Tahakkuk eden faiz","12.500 ₺"],["HESAP","-"],["Bir yıl içinde ödenecek anapara taksiti","185.000"],["Tahakkuk eden ödenmemiş faiz","12.500"],["303 UZUN VADELİ KREDİLERİN ANAPARA TAKSİTLERİ VE FAİZLERİ hesabı aktarılacak toplam","197.500"]]},"siklar":{"C":"197.500","E":"652.500","A":"12.500","D":"640.000","B":"185.000"},"kaynak":{"alinti":"","liste":[{"ad":"THP 122 - ALACAK SENETLERİ REESKONTU (-)","metin":"122 ALACAK SENETLERİ REESKONTU (-): Bilanço gününde, senetli alacakların tasarruf değeri ile değerlenmesini sağlamak üzere alacak senetleri için ayrılan reeskont tutarlarının izlenmesinde kullanılır. İşleyişi: Hesaplanan reeskont tutarları bu hesaba alacak, \"65- Diğer Faaliyetlerden Olağan Gider ve Zararlar\" grubundaki \"652- Reeskont Faiz Giderleri Hesabı\"na gider yazılır. İzleyen dönemde bu hesap \"65- Diğer Faaliyetlerden Olağan Gelir ve Kârlar\" grubundaki \"642- Faiz Gelirleri Hesabı\"na aktarılarak kapatılır."},{"ad":"THP 129 - ŞÜPHELİ TİCARİ ALACAKLAR KARŞILIĞI (-)","metin":"129 ŞÜPHELİ TİCARİ ALACAKLAR KARŞILIĞI (-): \"128- Şüpheli Ticari Alacaklar\" için ayrılacak karşılıklarla, perakende satış yöntemi kullanarak bilanço gününden önceki iki hesap döneminde vadesinde tahsil edilemeyen alacakların ilgili dönemlerdeki toplam vadeli satışlara oranlarının ortalamasının değerleme dönemindeki vadeli satışlara uygulanması suretiyle bulunacak şüpheli alacaklar için ayrılan karşılıkları kapsar. Teminatlı alacaklarda karşılık, teminatı aşan kısım için ayrılır. Bu hesap amaca uygun olarak bölümlenebilir. İşleyişi: Hesaplanan karşılık tutarı bu hesaba alacak, \"654- Karşılık Giderleri\" hesabına borç kaydedilir. Şüpheli alacağın tahsiline bağlı olarak, tahmin olunan zararın kısmen ya da tamamen gerçekleşmemesi halinde, gerçekleşmeyen kısım \"644- Konusu Kalmayan Karşılıklar Hesabı\" alacağına devredilerek bu hesaba borç kaydedilir. Şüpheli alacağın tahsilinin imkansız olduğu kesinleştiği takdirde bu hesaba borç, ilgili hesaba da alacak kaydedilir. Gerçekleşen zararın ayrılan karşılıklardan fazla olması halinde, ayrılan karşılık kadar bu hesaba borç, zarar fazlası ise \"681- Önceki Dönem Gider ve Zararları\" hesabına borç, tahsil edilemeyen tutar, ilgili alacak hesabına alacak kaydolunur. Perakende satış yönteminin uygulanması sonucunda bulunan, dönemin karşılık tutarının o tarihteki şüpheli alacaklar karşılığı tutarından az olması durumunda, aradaki fark \"644- Konusu Kalmayan Karşılıklar Hesabı\"na aktarılmak üzere bu hesaba borç yazılır. Daha önce alacaklardan düşülen ve bu hesaba borç kaydedilen alacakların tahsili söz konusu olduğu takdirde, oluşlarına göre \"67…"}],"hakem":"Soru, 303 hesabının tanımı ve işleyişine dayanarak bilanço tarihinden itibaren bir yıl içinde ödenecek anapara taksiti (185.000) ile tahakkuk etmiş faiz (12.500) toplamını (197.500) doğru olarak hesaplamıştır."},"kayitlar":[],"sade":{"siklar":{"D":"Kredinin tamamını kısa vadeli hesaba aktarır, vadeler , şimdi kaydını da yap."},"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Bir yıl içinde ödenecek anapara taksiti 185.000 ₺ (soruda verilen); Tahakkuk eden ödenmemiş faiz 12.500 ₺ (soruda verilen)","anlatim":"Soru bize şunları vermiş: bir yıl içinde ödenecek anapara taksiti ve tahakkuk eden faiz tutarı.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[5,1],[6,1]]},{"formul":"Kapsam = bir yıl içinde ödenecek anapara taksiti + buna ilişkin tahakkuk etmiş ödenmemiş faiz","anlatim":"303 UZUN VADELİ KREDİLERİN ANAPARA TAKSİTLERİ VE FAİZLERİ nedir? Uzun vadeli kredinin bir yıl içinde ödenecek kısmını ve buna ait ödenmemiş faizi taşır. Bilanço tarihinde bu hesaba alacak kaydı yapılır çünkü kısa vadeye aktarılan kaynak artmıştır.","doldur":[]},{"formul":"303 hesabına aktarılacak toplam = anapara taksiti + faiz = 185.000 (soruda verilen) + 12.500 (soruda verilen) = 197.500 ₺","anlatim":"Şimdi biz hesaplıyoruz: iki kalemi topluyoruz çünkü 303 hesabı ikisini birlikte kapsıyor. Anapara taksiti ile faiz ayrı ayrı değil, toplam olarak aktarılır.","doldur":[[7,1]]},{"formul":"Sonuç = 197.500 ₺ (3. adımda bulduk)","anlatim":"Sonuç: 303 hesabına 197.500 ₺ aktarılır. Bu tutar bilançoda kısa vadeli yabancı kaynaklar arasında görünür.","doldur":[]},{"formul":"Yanlış yol: 185.000 = 185.000 (HATALI) → doğrusu 197.500 (3. adımda bulduk)","anlatim":"En sık hata: yalnızca anapara taksitini yazıp faizi unutmak. Faiz tahakkuk etmiş ama ödenmemişse yine 303 hesabına dahildir, atlanamaz.","doldur":[]}],"anahtar":[{"ornek":"anapara","kok":"anapar"},{"ornek":"taksiti","kok":"taksit"},{"ornek":"vadeli","kok":"vadeli"},{"ornek":"ödenecek","kok":"ödenec"},{"ornek":"aktarılır","kok":"aktarı"},{"ornek":"içinde","kok":"içinde"}],"konuGiris":{"harita":"Ne zaman test edilir: bilanço tarihinde bir yıl içinde vadesi gelecek uzun vadeli borç kısmının ayrıştırılması gerektiğinde test edilir. Nasıl ölçülür: anapara taksit tutarı ile bu taksite ait tahakkuk etmiş faiz tutarı toplanarak ölçülür. Nasıl
