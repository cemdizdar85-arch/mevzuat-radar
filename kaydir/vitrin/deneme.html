erleri borç kaydedilir","anlatim":"780 Finansman Giderleri nedir? İşletmenin borçlanmasından doğan faiz gibi giderleri toplar. Faiz gideri oluştukça bu hesaba borç yazılır.","doldur":[]},{"formul":"Aylık faiz = Anapara × Yıllık oran / 12 = 120.000 (soruda verilen) × %24 (soruda verilen) / 12 = 2.400 ₺","anlatim":"Önce bir aylık faizi buluyoruz, çünkü sonraki tüm hesaplar buna dayanıyor. Yıllık oranı 12'ye bölüp aylık faizi çıkarıyoruz.","doldur":[[7,1]]},{"formul":"2025 tahakkuku = Aylık faiz × 3 ay = 2.400 (4. adımda bulduk) × 3 (soruda verilen) = 7.200 ₺","anlatim":"2025 yılına düşen faizi buluyoruz, çünkü kredi Ekim'de açıldı ve yıl sonuna kadar 3 ay geçti. Bu tutar 381'e alacak yazılıp gider tarafına borç kaydedilir.","doldur":[[8,1]]},{"formul":"Toplam faiz = Anapara × Yıllık oran × 6/12 = 120.000 (soruda verilen) × %24 (soruda verilen) × 6/12 (soruda verilen) = 14.400 ₺","anlatim":"Şimdi 6 aylık toplam faizi buluyoruz, çünkü vade sonunda ödenecek tam tutarı bilmemiz gerekiyor. Bu, 2025 ve 2026 paylarının toplamı olacak.","doldur":[[9,1]]},{"formul":"2026 payı = Toplam faiz − 2025 tahakkuku = 14.400 (6. adımda bulduk) − 7.200 (5. adımda bulduk) = 7.200 ₺","anlatim":"2026'ya düşen faizi buluyoruz, çünkü asıl soru bunu istiyor. Toplam faizden 2025'te tahakkuk eden kısmı çıkarınca cari döneme düşen kalır.","doldur":[[10,1]]},{"formul":"Ters durum: kredi tamamı cari dönemde açılsaydı → 780 borcu = Toplam faiz (14.400 ₺), 381 kullanılmaz","anlatim":"Ters durumda: eğer kredi Ocak ayında alınıp tamamı 2026'da faiz doğursaydı, 381 hiç kullanılmaz, tüm 14.400 direkt 780'e borç yazılırdı.","doldur":[]},{"formul":"Yanlış yol: 780 borcu = 14.400 (HATALI) → doğrusu 780 borcu = 7.200 (7. adımda bulduk)","anlatim":"En sık hata: öğrenci 2025'te tahakkuk edilen 7.200'ü unutup toplam 14.400'ü 780'e borç yazar. Ama o tutarın yarısı zaten önceki dönemde 381'e alacak kaydedilmişti.","doldur":[]}],"anahtar":[{"ornek":"tahakkuk","kok":"tahakk"},{"ornek":"buluyoruz","kok":"buluyo"},{"ornek":"döneme","kok":"döneme"},{"ornek":"alacak","kok":"alacak"},{"ornek":"önceki","kok":"önceki"},{"ornek":"gideri","kok":"gideri"}],"konuGiris":{"harita":"Ne zaman test edilir: Vadesi bir dönemi aşan, anapara ve faizi vade sonunda ödenen kredilerde. Nasıl ölçülür: Anapara × yıllık oran × geçen ay/12 formülüyle her dönem için ayrı ayrı hesaplanır. Nasıl kaydedilir: Dönem sonunda 780 borç/381 alacak, vadede ödemede 300, 381 ve 780 borç, 102 alacak yazılır.","desen":"Sınav, dönem sonu tahakkuk eden faizin vade sonunda tekrar 780'e yazılıp çift gider oluşturulmasını tuzak olarak kurar. Önceki dönem faizi 381'den kapatılır, sadece bu döneme ait ay sayısı 780'e yazılır. Bu soru dönem sonu-vade sonu faiz ayrımı ve ay hesaplaması noktasından geliyor (p.28, 12 dönemde soruldu).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Henüz ödenmemiş ama döneme ait olan faizin gider olarak kaydedilmesi","ad":"Faiz tahakkuku","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Önceki dönemde tahakkuk eden, henüz ödenmeyen faizin izlendiği hesap","ad":"381 Gider Tahakkukları","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"O döneme ait faiz giderinin borç yazıldığı gider hesabı","ad":"780 Finansman Giderleri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Bankadan alınan ve vade sonunda geri ödenecek olan borç tutarı","ad":"Kredi anaparası","kim":"piyasa fiyatlar"}],"sinavda":"Vade sonu ödeme kaydında sadece bu döneme (1 Ocak-31 Mart 2026) düşen faiz tutarının 780 hesabına borç yazılması istenir.","panel_ornek":"Arkadaşın 10.000 ₺ kredi çekiyor, yıllık %10 faizli, 6 ay sonra tek seferde ödeyecek. 3 ay geçince henüz ödeme yapmasa da o 3 aylık faiz zaten oluşmuş sayılır ve not defterine 'borcum var' diye yazması gerekir. İşte bu, faizin gerçekleşip gerçekleşmediğine değil, zamana bakarak kayıt yapmaktır.","ornek":"Arkadaşın 10.000 ₺ kredi çekiyor, yıllık %10 faizli, 6 ay sonra tek seferde ödeyecek. 3 ay geçince henüz ödeme yapmasa da o 3 aylık faiz zaten oluşmuş sayılır ve not defterine 'borcum var' diye yazması gerekir. İşte bu, faizin gerçekleşip gerçekleşmediğine değil, zamana bakarak kayıt yapmaktır.","yontemler":"Toplam faiz süresi iki döneme bölünerek her döneme ait ay sayısı üzerinden ayrı ayrı hesaplanır; önceki dönem faizi 381'den kapatılır, sadece kalan ay 780'e yazılır.","nedir":"Kredi faiz tahakkuku, dönem sonunda henüz ödenmemiş ama o döneme ait olan faizin gider olarak kaydedilmesidir. Sınav, dönemsellik kavramına göre doğru hesap ve doğru tutarı hesaplayıp hesaplayamadığını ölçer."},"olay":"120.000×0,24×6/12=14.400 toplam faiz; 2025'e düşen 3 aylık kısım 7.200 (381'de); 2026'ya düşen kısım 14.400-7.200=7.200.","tuzak":{"D":{"ad":"Vade Süresi Tuzağı","metin":"Toplam kredi vadesini 6 ay yerine 5 ay alırsan bu tutara ulaşırsın. Doğrusu: Kredi süresi 1 Ekim 2025-31 Mart 2026 arası tam 6 aydır."},"E":{"ad":"Çift Gider Tuzağı","metin":"Önceki dönemde 381'e alacak yazılan faizi unutup vade sonunda toplam faizin tamamını yeniden 780'e yazarsan bu tutar çıkar. Doğrusu: 2025'e ait 7.200 ₺'lik kısım 381 Gider Tahakkukları hesabından borçlandırılarak kapatılır, 780'e yalnız cari dönem payı yazılır."},"A":{"ad":"Ay Sayısı Tuzağı","metin":"Vade sonu kaydında cari döneme düşen ayı yalnız 1 ay sayarsan bu tutara varırsın. Doğrusu: 1 Ocak-31 Mart 2026 arası 3 aylık faiz hesaplanmalıdır."},"B":{"ad":"Eksik Ay Tuzağı","metin":"Cari döneme düşen süreyi 2 ay alırsan bu tutar çıkar. Doğrusu: Ocak-Mart 2026 dönemi 3 tam ay olduğundan 3 ay üzerinden hesap yapılmalıdır."}},"celdiriciYol":{"D":"120.000 × 0,24 × 5/12 = 12.000 (toplam vade süresini 6 yerine 5 ay aldı)","E":"120.000 × 0,24 × 6/12 = 14.400 (önceki dönemde 381'e tahakkuk eden faizi kapatmayı unutup toplam faizi yeniden 780'e yazdı)","A":"120.000 × 0,24 × 1/12 = 2.400 (cari döneme düşen ayı yalnız 1 ay saydı)","B":"120.000 × 0,24 × 2/12 = 4.800 (cari döneme düşen ayı 2 ay saydı)"},"hap":"Vade sonu ödemesinde önceki dönemde tahakkuk eden faiz 381 Gider Tahakkukları'ndan kapatılır, yalnız cari döneme düşen faiz 780'e yeniden yazılır.","teshis":{"C":{"gercek":"Dönemsellik kavramı gereği önceki dönemde tahakkuk eden faiz 381'den kapatılır, yalnız cari döneme düşen kısım 780'e gider olarak yazılır.","ayirt":"Bu faizin hangi kısmı zaten önceki dönemde gider yazılmıştı?","paragraf":"MSUGT THP 780/381; dönemsellik kavramı","yanilgi":"Bu şıkkı eleyen öğrenci toplam faizi tek seferde 780'e yazılması gerektiğini düşünür."},"E":{"gercek":"Vade sonu kaydında 381 Gider Tahakkukları borçlandırılarak önceki dönem faizi kapatılır; 780'e yalnız cari dönem payı yazılır, aksi halde gider çift sayılır.","ayirt":"Bu tutarın bir kısmı zaten geçen dönemde 780'e yazılmış mıydı?","paragraf":"MSUGT THP 780/381; dönemsellik kavramı","yanilgi":"Önceki dönemde 381'e alacak kaydedilen faizi unutup toplam faizi ikinci kez 780'e yazdın."},"A":{"gercek":"Cari dönem 1 Ocak-31 Mart 2026 arası tam 3 aydır; faiz bu süre üzerinden hesaplanır.","ayirt":"Vade sonu ile dönem başı arasında kaç tam ay var, saydım mı?","paragraf":"MSUGT THP 780/381","yanilgi":"Vade sonu ayını hesaba katmayı unutup dönem başlangıcından yalnız bir ay geçtiğini düşünüyorsun."},"D":{"gercek":"1 Ekim 2025'ten 31 Mart 2026'ya kadar geçen süre tam 6 aydır; vade süresi eksik sayılamaz.","ayirt":"Kullanım tarihinden vade sonuna kadar tam olarak kaç ay var?","paragraf":"MSUGT THP 780/381","yanilgi":"Kredinin toplam vadesini 6 ay değil 5 ay olarak saydın."},"B":{"gercek":"Ocak, Şubat, Mart 2026 üç tam aydır; ikisi değil üçü faize dahildir.","ayirt":"Ocak'tan Mart'a kadar hangi aylar tamamen bu döneme ait?","paragraf":"MSUGT THP 780/381","yanilgi":"Ay sayımını yaparken bir ayı atlayıp iki ay üzerinden hesapladın."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":12,"hesaplar":{"381":{"ad":"GİDER TAHAKKUKLARI","tanim":"Gelecek aylarda ödemesi yapılacak ve kesinlikle belgeye dayalı gider tahakkuklarının izlendiği hesaptır. İşleyişi : Yapılan tahakkuklar ilgili gider ve zarar hesaplarına borç, bu hesaba alacak, yapılan ödemeler borç kaydedilir."},"780":{"ad":"Finansman Giderleri Hesabı","tanim":"İşletme faaliyetlerinin aksamadan yürütülebilmesi amacıyla borçlanılan tutarlarla ilgili faiz, kur farkları, komisyon ve benzeri giderler bu hesaba borç kaydedilir."}}},{"capa":null,"kural":"645 Menkul Kıymet Satış Kârları, satış bedeli ile menkul kıymetin defterdeki (alış) bedeli arasındaki farktır; karşılık hareketleri 644 hesabında ayrı izlenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/2 ders 01 Soru 10","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"205.000","taraf":"B","hesap":"102 BANKALAR"},{"tutar":"180.000","taraf":"A","hesap":"110 HİSSE SENETLERİ"},{"tutar":"25.000","taraf":"A","hesap":"645 MENKUL KIYMET SATIŞ KÂRLARI"}],"teori":false,"taktik":"Karşılık hareketlerini (654/119/644) satış kaydından (110/645) ayrı iki işlem gibi çöz, birini diğerine karıştırma.","konu":"hisse senedi satışı","tablo":{"satirlar":[["VERİLENLER","-"],["Alış bedeli","180.000 ₺"],["2024 yıl sonu borsa değeri","150.000 ₺"],["2025 yıl sonu borsa değeri","168.000 ₺"],["Satış bedeli","205.000 ₺"],["HESAP","-"],["2024 yıl sonu ayrılan karşılık (180.000-150.000)","30.000"],["2025 yıl sonu gereken karşılık (180.000-168.000)","12.000"],["2025 yılında iptal edilen karşılık (30.000-12.000)","18.000"],["2026 satışta iptal edilen kalan karşılık","12.000"],["645 Menkul Kıymet Satış Kârları (205.000-180.000)","25.000"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"37.000","E":"25.000","A":"13.000","D":"43.000","B":"55.000"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Tahvilin hisse senedine dönüşümü kaydı: hisse senediyle değiştirilebilir tahvil, 405 Çıkarılmış Tahviller, 500 Sermaye, 520 Hisse Senedi İhraç Primleri","metin":"TEORİ (Finansal Muhasebe; MSUGT Sıra No:1 Tekdüzen Hesap Planı 405, 304, 500, 501, 520 hesap açıklamaları; VUK m.266 itibari değer). TANIM: Hisse senediyle değiştirilebilir tahvil, sahibine vadesinde veya belirlenen dönemde tahvili ihraççı şirketin hisse senetleriyle değiştirme hakkı veren borçlanma aracıdır. THP 405: işletmece hisse senedi ile değiştirilebilir tahvil çıkarılmışsa tutar ve nitelikleri dipnotlarda ayrıca belirtilir; tahviller NOMİNAL bedelleriyle 405'e alacak kaydedilir. KURAL: Dönüşüm anında tahvil borcu kapanır, karşılığında sermaye doğar. Sade kayıt: 405 ÇIKARILMIŞ TAHVİLLER borç (tahvilin nominal değeri); 500 SERMAYE alacak (verilen hisse senetlerinin itibari değeri). Tahvilin nominal değeri verilen hisselerin itibari değerinden büyükse fark 520 HİSSE SENEDİ İHRAÇ PRİMLERİ hesabına alacak yazılır (THP 520: 'hisse senedinin nominal fiyatı ile satış fiyatı arasındaki fark bu hesabın alacağına'). Sermaye artırımı tescile bağlı olduğundan ders kitapları iki aşamalı kaydı da gösterir: tescilde 501 ÖDENMEMİŞ SERMAYE (-) borç / 500 Sermaye alacak; dönüşümde 405 borç / 501 alacak (ve varsa 520 alacak). Tahvilin vadesi bilanço gününden itibaren bir yılın içine girmişse tutar 304 TAHVİL ANAPARA BORÇ TAKSİT VE FAİZLERİ hesabına aktarılmış olur; dönüşümde tahvil hangi hesapta izleniyorsa o hesap borçlandırılır. Dönüşüme kadar işlemiş kupon faizi nakden ödenir ve 780 Finansman Giderleri / 381 Gider Tahakkukları ile izlenir; faiz sermayeye dönüşmez. ÖRNEK: 500.000 TL nominal değiştirilebilir tahvil, itibari değeri toplam 400.000 TL olan hisse senetleriyle değiştirildi…"},{"ad":"Teori Notu - hisse senedi degerleme temettu modeli","metin":"Hisse senedinin icsel degeri, beklenen temettulerinin bugunku degeridir. Sabit buyume (Gordon) modeli: P0 = D1 / (k - g). Burada D1 bir yil sonra beklenen temettu (D1 = D0 x (1+g)), k ozsermaye maliyeti (yatirimcinin istedigi getiri), g temettulerin sabit buyume oranidir. Modelin calismasi icin k > g olmalidir; g, k'ye yaklastikca deger sonsuza gider ve model anlamini yitirir. Temettu dagitmayan ya da duzensiz buyuyen sirketlerde cok asamali modeller veya carpan yontemleri kullanilir. Fiyat/Kazanc (F/K) orani = hisse fiyati / hisse basina kar; benzer sirketlerin F/K ortalamasi ile sirketin karini carparak yaklasik deger bulunur. Buyume orani icin ic kaynak formulu: g = alikoyma orani x ozsermaye karliligi (b x ROE). Tipik tuzaklar: D0 ile D1'i karistirmak (formul GELECEK yilin temettusunu ister) ve g'nin temettu degil KAR buyumesi sanilmasi."}],"hakem":"Soru hisse senedi satışında 645 hesabına kaydedilecek tutarı sormakta; kural kaynak metinde açıkça tanımlanmış ve hesaplama (satış bedeli 205.000 − alış bedeli 180.000 = 25.000) doğrudur."},"kayitlar":[{"kayit":[{"tutar":"30.000","taraf":"B","hesap":"654 KARŞILIK GİDERLERİ"},{"tutar":"30.000","taraf":"A","hesap":"119 MENKUL KIYMETLER DEĞER DÜŞÜKLÜĞÜ KARŞILIĞI"}],"baslik":"31.12.2024 - Değer düşüklüğü karşılığı ayrılması"},{"kayit":[{"tutar":"18.000","taraf":"B","hesap":"119 MENKUL KIYMETLER DEĞER DÜŞÜKLÜĞÜ KARŞILIĞI"},{"tutar":"18.000","taraf":"A","hesap":"644 KONUSU KALMAYAN KARŞILIKLAR"}],"baslik":"31.12.2025 - Karşılığın kısmen iptali"},{"kayit":[{"tutar":"205.000","taraf":"B","hesap":"102 BANKALAR"},{"tutar":"180.000","taraf":"A","hesap":"110 HİSSE SENETLERİ"},{"tutar":"25.000","taraf":"A","hesap":"645 MENKUL KIYMET SATIŞ KÂRLARI"}],"baslik":"2026 - Hisse senetlerinin satışı"},{"kayit":[{"tutar":"12.000","taraf":"B","hesap":"119 MENKUL KIYMETLER DEĞER DÜŞÜKLÜĞÜ KARŞILIĞI"},{"tutar":"12.000","taraf":"A","hesap":"644 KONUSU KALMAYAN KARŞILIKLAR"}],"baslik":"2026 - Kalan karşılığın iptali"}],"sade":{"siklar":{"C":"2025 yılı borsa değeri olan 168.000'i hissenin kayıtlı bedeli zannederek 205.000 − 168.000 = 37.000 hesaplayan hata; defteri kaydında hisse hep 180.000 tutarındadır.","A":"Borsa değerinin düştüğü 2024 yılındaki karşılığı (30.000) ve 2025'te iptal edilen karşılığı (18.000) satış kârından çıkaran, toplam 12.000 kalanı da düşüren hata; karşılık hareketleri 644'te ayrı işlenir.","D":"Satış kârına, 2025'te iptal edilen 18.000 ₺ karşılığı ekleyen hata; bu tutar önceki dönem gelir tablosunda 644'te zaten gelir yazılmışken, satış kâr hesaplamasında yeniden kullanılamaz.","B":"2024 yılı borsa değeri olan 150.000'i hissenin alış bedeli sanarak 205.000 − 150.000 = 55.000 hesaplayan hata; alış bedeli başlangıçtan itibaren 180.000'dir, borsa değerleri yalnız karşılık için kullanılır."},"dogru":"Hisse senedi satışında kâr, satış bedeli ile alış bedeli arasındaki farktır. Borsa değerinin düşüşü ve artışına karşılık hesabında ayrı izlenir, satış kârına karışmaz. 205.000 − 180.000 = 25.000 ₺.","sinav":"645 Menkul Kıymet Satış Kârları hesabına kaydedilecek tutar, menkul kıymetin satış bedeli ile defterdeki alış bedeli arasındaki farktır; karşılık düzeltmeleri 644 hesabında izlenir.","kavramlar":[{"kaynak":"TEORI","tanim":"Hisse senedi gibi menkul kıymetlerin satış bedeli ile defterdeki alış bedeli (itibari değeri) arasındaki pozitif farktır.","ad":"Menkul kıymet satış kârı"},{"kaynak":"TEORI","tanim":"Borsa değerindeki düşüşe karşılık olarak ayrılan ve 644 hesabında izlenen tutar; satış anında son dönem değerine göre iptal edilir.","ad":"Karşılık"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":12,"ornekler":[],"donemler":["2025/2","2023/3","2022/1","2021/3","2019/2","2017/2","2016/1","2015/3","2014/2","2012/2","2012/1","2008/3"]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["2024 yıl sonu ayrılan karşılık (350.000-300.000)","50.000"],["2025 yıl sonu gereken karşılık (350.000-310.000)","40.000"],["2025 yılında iptal edilen karşılık (50.000-40.000)","10.000"],["2026 satışta iptal edilen kalan karşılık","40.000"],["645 Menkul Kıymet Satış Kârları (380.000-350.000)","30.000"]]},"tur":"tablo","soru":"İşletme, 350.000 ₺'ye aldığı hisse senetlerini elinde tutmaktadır. 2024 yılı sonunda borsa değeri 300.000 ₺'ye düşmüş ve karşılık ayrılmıştır. 2025 yılı sonunda borsa değeri 310.000 ₺'ye çıkmış, karşılık buna göre düzeltilmiştir. 2026 yılında hisse senetleri 380.000 ₺'ye satılmış ve kalan karşılık tamamen iptal edilmiştir. Buna göre satış nedeniyle 645 Menkul Kıymet Satış Kârları hesabına kaydedilecek tutar kaç ₺'dir?","verilen":[],"hedef":"Tabloyu doldur ve 645 Menkul Kıymet Satış Kârları hesabına kaydedilecek tutarın kaç ₺ olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, 180.000 ₺'ye aldığı hisse senetlerini elinde tutmaktadır. 2024 yılı sonunda borsa değeri 150.000 ₺'ye düşmüş ve karşılık ayrılmıştır. 2025 yılı sonunda borsa değeri 168.000 ₺'ye çıkmış, karşılık buna göre düzeltilmiştir. 2026 yılında hisse senetleri 205.000 ₺'ye satılmış ve kalan karşılık tamamen iptal edilmiştir. Buna göre satış nedeniyle 645 Menkul Kıymet Satış Kârları hesabına kaydedilecek tutar kaç ₺'dir?","kayitBaslik":"3) 2026 - Hisse senetlerinin satışı","id":"smmm-w1-fmuh-zor/kp-05","verilenler":[{"deger":"180.000 ₺","anlam":"Hisse senedinin 110 hesabındaki kayıtlı (defter) değeridir, satış kârı hesaplanırken esas alınır.","ad":"Alış bedeli"},{"deger":"150.000 ₺","anlam":"İlk yıl ayrılacak değer düşüklüğü karşılığının (654/119) hesaplanmasında kullanılır.","ad":"2024 yıl sonu borsa değeri"},{"deger":"168.000 ₺","anlam":"Karşılığın kısmen iptal edilerek düzeltilmesinde (119/644) kullanılır.","ad":"2025 yıl sonu borsa değeri"},{"deger":"205.000 ₺","anlam":"Satış anında Bankalar hesabına giren tutar ve 645 hesabındaki satış kârının hesaplanmasında kullanılır.","ad":"Satış bedeli"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı 110, 119, 644, 645 hesap açıklamaları","dogru":"E","oyunBonus":{"soru":"İşletme, 360.000 ₺'ye aldığı hisse senetlerini elinde tutmaktadır. 2024 yılı sonunda borsa değeri 300.000 ₺'ye düşmüş ve karşılık ayrılmıştır. 2025 yılı sonunda borsa değeri 336.000 ₺'ye çıkmış, karşılık buna göre düzeltilmiştir. 2026 yılında hisse senetleri 410.000 ₺'ye satılmış ve kalan karşılık tamamen iptal edilmiştir. Buna göre satış nedeniyle 645 Menkul Kıymet Satış Kârları hesabına kaydedilecek tutar kaç ₺'dir?","tur":"olcek","kayit":[{"tutar":"410.000","taraf":"B","hesap":"102 BANKALAR"},{"tutar":"360.000","taraf":"A","hesap":"110 HİSSE SENETLERİ"},{"tutar":"50.000","taraf":"A","hesap":"645 MENKUL KIYMET SATIŞ KÂRLARI"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Alış bedeli 180.000 ₺ (soruda verilen); 2024 borsa değeri 150.000 ₺ (soruda verilen); 2025 borsa değeri 168.000 ₺ (soruda verilen); 2026 satış bedeli 205.000 ₺ (soruda verilen)","anlatim":"Soru bize şunları vermiş: hisse senedi alış bedeli 180.000 ₺; 2024 yıl sonu borsa değeri 150.000 ₺; 2025 yıl sonu borsa değeri 168.000 ₺; 2026 satış bedeli 205.000 ₺.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"645 = satış bedeli - alış maliyeti (kapsam: karşılık tutarları dahil değil)","anlatim":"645 MENKUL KIYMET SATIŞ KÂRLARI nedir? Satış bedeli ile alış (maliyet) bedeli arasındaki olumlu farkı gösterir. Karşılık hareketleri buraya girmez, onlar 644 hesabında ayrı izlenir.","doldur":[]},{"formul":"2024 karşılığı = Alış bedeli - 2024 borsa değeri = 180.000 (soruda verilen) - 150.000 (soruda verilen) = 30.000","anlatim":"Önce 2024 sonunda değer düşüşü için ayrılan karşılığı buluyoruz. Borsa değeri alış bedelinin altına düştüğü için karşılık ayrılır.","doldur":[[6,1]]},{"formul":"2025 gereken karşılık = Alış bedeli - 2025 borsa değeri = 180.000 (soruda verilen) - 168.000 (soruda verilen) = 12.000","anlatim":"2025 sonunda borsa değeri yükselince gereken karşılık yeniden hesaplanır. Karşılık her yıl güncel farka göre düzeltilir.","doldur":[[7,1]]},{"formul":"2025 iptal edilen = 2024 karşılığı - 2025 gereken karşılık = 30.000 (3. adımda bulduk) - 12.000 (4. adımda bulduk) = 18.000","anlatim":"Eski karşılıkla yeni gereken karşılık arasındaki fark 2025'te iptal edilir. Karşılık fazlası gelir olarak değil, karşılık iptali olarak kayıtlara girer.","doldur":[[8,1]]},{"formul":"2026 iptal edilen kalan karşılık = 2025 gereken karşılık = 12.000 (4. adımda bulduk)","anlatim":"2026'da hisse senedi satılınca kalan karşılığın tamamı iptal edilir. Bu iptal 645 hesabını değil, karşılık iptali hesabını ilgilendirir.","doldur":[[9,1]]},{"formul":"645 Menkul Kıymet Satış Kârları = Satış bedeli - Alış bedeli = 205.000 (soruda verilen) - 180.000 (soruda verilen) = 25.000","anlatim":"Şimdi asıl istenen 645 tutarını hesaplıyoruz. Satış bedelinden alış bedelini çıkarırız, karşılık rakamları bu hesaba girmez.","doldur":[[10,1]]},{"formul":"Ters durum: satış bedeli < alış bedeli → 655 MENKUL KIYMET SATIŞ ZARARLARI","anlatim":"Ters durumda satış bedeli alış bedelinin altında kalsaydı fark 655 hesabına yazılırdı. Kâr yerine zarar oluşurdu, hesap değişir ama mantık aynı kalır.","doldur":[]},{"formul":"Yanlış yol: 205.000 - 168.000 = 37.000 (HATALI) → doğrusu 25.000 (7. adımda bulduk)","anlatim":"En sık hata: öğrenci karşılık tutarlarını 645'e katıp 25.000 yerine farklı bir sayı bulur. 645 sadece satış-alış farkıdır, karşılık düzeltmeleri ayrı hesaba (644) yazılır.","doldur":[]}],"anahtar":[{"ornek":"karşılık","kok":"karşıl"},{"ornek":"bedeli","kok":"bedeli"},{"ornek":"hesabıyla","kok":"hesabı"},{"ornek":"arasındaki","kok":"arasın"},{"ornek":"değeri","kok":"değeri"},{"ornek":"senedi","kok":"senedi"}],"konuGiris":{"harita":"Ne zaman test edilir: menkul kıymet elden çıkarıldığında ve önceki karşılık kayıtları kapatıldığında test edilir. Nasıl ölçülür: satış bedeli ile ilk maliyet bedeli arasındaki fark ölçülür, ara dönem karşılık düzeltmeleri bu farkı etkilemez. Nasıl kaydedilir: satış kârı 645 hesaba, karşılık iptali ayrı bir gelir hesabına kaydedilir.","desen":"Sınav, ara dönemlerde ayrılan ve düzeltilen karşılık tutarlarını satış kârına dahil etmeye çalışan bir çeldiriciyle kurulur; öğrenci karşılık iptalini 645 hesabına ekleme hatasına düşer. Doğru yaklaşımda 645 hesabına yalnız satış bedeli ile ilk maliyet bedeli ar   if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

// 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}

    const cipler=[...gercek.map(t=>({t,d:0})),...celdirici.map(t=>({t,d:1}))]; for(let i=cipler.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cipler[i],cipler[j]]=[cipler[j],cipler[i]]; }

    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});
// --- son kart
const son=document.createElement('section'); son.className='kart son';
son.innerHTML='<div class="ust"><span>Nöbet bitti</span>'+noktalar(-1)+'<span>&nbsp;</span></div><div class="govde son" style="display:flex;flex-direction:column;justify-content:center"><div id="sonSkor"></div></div>';
akis.appendChild(son);
document.querySelectorAll('.skorCip,.kutuCip').forEach(b=>b.addEventListener('click',kutuEkraniAc)); skorCiz();
if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i.simdi').forEach(n=>n.classList.remove('simdi')); document.querySelectorAll(i>=SORULAR.length?'.noktalar i[data-j="son"]':'.noktalar i[data-j="'+i+'"]').forEach(n=>n.classList.add('simdi'));
  if(i<SORULAR.length&&durum.cevap[i]===undefined&&!durum.t0[i]) durum.t0[i]=Date.now();   // 06.09: karta gelince süre başlar
  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='PageDown'){ akis.scrollBy({top:akis.clientHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='PageUp'){ akis.scrollBy({top:-akis.clientHeight,behavior:'smooth'}); } });
/* 09.09 derin bağlantı (ana sayfa kartı → günün sorusu): #s=<sıra> kartını açar; yoksa baştan. */
window.addEventListener('load',function(){ try{ var m=location.hash.match(/#s=(\d+)/); var a=document.getElementById('akis'); if(!a) return;
  /* ?tek=1: hedef kart işaretlenir, gerisi CSS ile gizli. Sıra yoksa/aralık dışıysa ilk kart - boş çerçeve kalmaz. */
  if(TEK){ var n=(m&&a.children[+m[1]])?+m[1]:0; if(a.children[n]) a.children[n].classList.add('tekKart'); a.scrollTop=0; return; }
  if(m&&a.children[+m[1]]) a.scrollTo({top:a.children[+m[1]].offsetTop,behavior:'instant'}); }catch(e){} });
</script>
