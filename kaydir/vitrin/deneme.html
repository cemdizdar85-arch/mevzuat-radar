<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".
   Varsayılan = sitenin açık paleti (stil-acik.css değerleri; stil.css BAĞLANMAZ: .kart/.sik/.btn/.kutu seçicileri çakışır).
   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. 24.09 Cem: VARSAYILAN KOYU ("sitenin rengi bu olsun"); beyaz yalnız düğmeyle (kc_tema=light) ya da ?tema=acik ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}
:root[data-theme="dark"]{--bg:#141518;--bg2:#0f1013;--kart:#1e2026;--cizgi:#2e3138;--yazi:#e9e9ec;--metin:#e9e9ec;--dim:#9aa1ad;--mavi:#78b4ff;--yesil:#8fc98f;--kirmizi:#e07b7b;--altin:#e0a458;--ustYazi:#0f1013}
.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
/* 13.09 Cem: "nöbetçi çöz dediğinde sadece ekrandaki soru çözsün, başka alt alta soru olmasın."
   ?tek=1 = ana sayfa çerçevesi: YALNIZ #s=<sıra> kartı görünür, akış kaydırılamaz,
   "Sonraki" ve "yukarı kaydır" ipucu gizlenir (sonraki kart yokken yanıltır). */
:root[data-tek] #akis{overflow:hidden;scroll-snap-type:none}
:root[data-tek] #akis>*:not(.tekKart){display:none}
:root[data-tek] .bSonraki,:root[data-tek] .ipucu{display:none}
/* tek kartta dizi göstergeleri yanıltır: ilerleme noktaları, "10 / 10" sayacı, hazırlık skoru ve yanlış kutusu çipleri gizli. */
:root[data-tek] .noktalar,:root[data-tek] .ustSag{display:none}
/* 13.09 Cem: "renk koyu olsa, site rengi". Ana sayfa çerçevesi koyu açılır (tema=koyu);
   koyu temanın MAVİ vurgusu yalnız çerçevede sitenin BRONZUNA çevrilir. Ürünün kendi
   teması değişmez - kural data-tek'e bağlı, normal Kaydır-Çöz'e dokunmaz. */
:root[data-tek][data-theme="dark"]{--mavi:#e3b877}
/* 13.09 Cem onayı: akran satırı ("👥 9 adayın %89'u senin gibi B dedi") çerçevede gizli.
   Örneklem küçükken ilk kez gelen ziyaretçi "sitede 9 kişi var" diye okur. Üründe durur. */
:root[data-tek] .akranNot{display:none}
/* Aynı akran verisi şıkların üstüne de basılıyor (.sikYuzde: "B) 1,50 %89", "C) 1,67 %0").
   Öğrenci turunda görüldü: doğru cevabın yanında %0, ilk gelene "site bozuk mu" dedirtiyor. */
:root[data-tek] .sikYuzde{display:none}
/* 13.09 Cem seçimi (tek tek gidildi): Alarm rozeti (kişisel ustalık seviyesi, ilk gelene
   anlamsız ve kırmızı "Alarm" hata gibi okunuyor) ile cevap sonrası ikinci "Kâğıdım" düğmesi
   (üstteki "Kâğıt" aynı işi yapıyor) çerçevede gizli. "Daha fazla" ve "Sen çöz" KALDI. */
:root[data-tek] .seviye,:root[data-tek] .cKagit{display:none}
/* 13.09 Cem: "Hata bildir'i sil". Vitrinden gelen bildirim gerçek adayların bildirimleriyle
   aynı kutuya düşerdi; ana sayfa ziyaretçisine hata düğmesi de güven vermez. Üründe durur. */
/* Özgüllük: ürünün ".cipler.acikEk .cip2.ek{display:inline-block}" kuralı (0,4,0) "Daha fazla"
   açılınca ":root[data-tek] .cHata"yı (0,3,0) eziyordu - ölçüldü. Seçici (0,5,0)'a çıkarıldı, !important yok. */
:root[data-tek] .cipler .cip2.cHata{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}

/* MASAUSTU (Cem 03.09: "ikisine de farkli goruntu"): genis sutun, ogretmen ekraninda tablo solda adimlar sagda */
@media (min-width:900px){
  /* Cem 03.09: "sik tiklayinca cok asagida kaliyor" - masaustunde ALT PANEL YOK; iki kolon: sol soru+siklar,
     sag cevap paneli (UWorld/Becker duzeni). Telefon alt panelde kalir. */
  .kart{max-width:1360px;padding:22px 32px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:28px}
  .ust{grid-column:1/3}.govde{grid-column:1;grid-row:2;padding-bottom:24px}.ipucu{left:32px;right:auto;width:calc(50% - 46px);bottom:10px}
  .soru{font-size:1.08em}.sik{font-size:1em;padding:13px 16px}
  .panel{position:static;grid-column:2;grid-row:2;max-height:calc(100vh - 92px);width:auto;left:auto;right:auto;transform:none;border:1px solid var(--cizgi);border-radius:16px;padding:16px 22px 24px;box-shadow:none;transition:opacity .28s ease}
  .panel:not(.acik){visibility:hidden;opacity:0}.panel.acik{visibility:visible;opacity:1;transform:none}
  .tutamac{display:none}.cip2.ana{margin-left:auto}
  .ders,.oyun{width:min(100%,1100px)}
  .ders{display:none;padding:18px 0 0;height:100vh;height:100dvh;overflow:hidden}.ders.acik{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;column-gap:18px}
  .ders .basl{grid-column:1/3}.ders .tabloSar{grid-column:1;grid-row:2;max-height:none;min-height:0;padding-left:22px}
  .ders .serit{grid-column:2;grid-row:2;padding:0 22px 0 0;min-height:0}.adimK{inset:0 22px 0 0}.ders .altc{grid-column:1/3}
  .ders .altc .adimBar{flex:1;max-width:520px;margin:0 auto}
  .oyun{padding:22px 28px}.satir{grid-template-columns:1fr 1fr;gap:12px}.kutu{min-height:64px}
  /* hesap kâğıdı masaüstü: cevaptan önce sağ kolon (panelin yeri), cevaptan sonra çiple açılan üst katman */
  /* özgüllük .kart .kagit: temel .kagit kuralı bu bloktan SONRA yazılı, aynı özgüllükte sonraki kazanırdı (06.09 tarayıcıda görüldü) */
  .kart .kagit{position:static;grid-column:2;grid-row:2;transform:none;visibility:visible;height:auto;min-height:0;max-height:calc(100vh - 92px);border:1px dashed var(--cizgi);border-radius:16px;padding:14px 18px 16px;transition:none}
  .kart .kagitGovde{min-height:240px}
  .kart:not(.cevaplandi) .kagitKapat,.kart .kagitAc{display:none}
  .kart.cevaplandi .kagit{display:none}.kart.cevaplandi .kagit.acik{display:flex;position:absolute;top:60px;right:32px;bottom:20px;width:min(46%,640px);z-index:7;background:var(--kart);border-style:solid}
}
/* 06.09 HESAP KÂĞIDI (Cem "yan tarafa kâğıt kalem", "1.2.3 yap, telefona uysun"): TESMER SGS kılavuzu hesap makinesini ve
   müsvedde kâğıdını sınava sokmayı yasaklıyor → kâğıt HESAPLAMAZ, kitapçık kenarı gibidir. Telefon: alt sayfa, parmakla çizim + yazı
   sekmeleri, varsayılan kapalı (✏️ düğmesi). Masaüstü: cevaptan önce sağ kolonda açık, cevaptan sonra "✏️ Kâğıdım" çipiyle üstte açılır.
   Soru başına yerelde saklanır (kc_kagit); kutudan dönen aday eski kâğıdını görür. */
.kagit{position:absolute;left:0;right:0;bottom:0;height:74%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s;display:flex;flex-direction:column;padding:10px 12px 12px;z-index:6}

.kagitUst{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8em;color:var(--dim);margin-bottom:6px}.kagitUst b{color:var(--yazi);font-size:1.05em}
.kagitSek{margin-left:auto;display:flex;gap:4px}.kagitSek button{font:inherit;font-size:.82em;background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:4px 10px;cursor:pointer}.kagitSek button.acik{border-color:var(--mavi);color:var(--mavi)}
.kagitGovde{flex:1;min-height:0;position:relative}
.kagitYaz{width:100%;height:100%;resize:none;background:var(--bg);color:var(--yazi);border:1px dashed var(--cizgi);border-radius:10px;padding:8px 12px;font:inherit;font-size:1.02em;line-height:27px;background-image:repeating-linear-gradient(transparent 0 26px,var(--cizgi) 26px 27px);background-attachment:local;outline:none}
.kagitCiz{width:100%;height:100%;display:block;background:var(--bg);border:1px dashed var(--cizgi);border-radius:10px;touch-action:none;cursor:crosshair}
.kagit[data-sek="ciz"] .kagitYaz,.kagit[data-sek="yaz"] .kagitCiz{display:none}
.kagitAc{position:absolute;right:14px;bottom:44px;z-index:5;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:8px 12px;font:inherit;font-size:.86em;cursor:pointer}.kagitAc.var{border-color:var(--altin);color:var(--altin)}
.kagitNot{font-size:.78em;color:var(--altin);margin-top:4px;min-height:1em}
.tt td.kagitVar::after{content:'✏️';font-size:.72em;margin-left:5px;opacity:.9}

.kararRozet{display:inline-block;font-weight:700;padding:4px 10px;border-radius:8px;margin:0 0 8px}.kararRozet.dog{background:color-mix(in srgb,var(--yesil) 16%,transparent);color:var(--yesil)}.kararRozet.yan{background:color-mix(in srgb,var(--kirmizi) 16%,transparent);color:var(--kirmizi)}

.girisK>*{opacity:0;animation:girisBlok .45s ease forwards}.girisK>:nth-child(1){animation-delay:.05s}.girisK>:nth-child(2){animation-delay:.35s}.girisK>:nth-child(3){animation-delay:.65s}.girisK>:nth-child(4){animation-delay:.95s}.girisK>:nth-child(5){animation-delay:1.25s}.girisK>:nth-child(6){animation-delay:1.55s}.girisK>:nth-child(7){animation-delay:1.85s}.girisK>:nth-child(8){animation-delay:2.15s}

yapılan direkt işçilik ve direkt ilkmadde ve malzeme dışında kalan giderlerin izlendiği hesaptır."},"770":{"ad":"Genel Yönetim Giderleri","tanim":"Bir işletmenin yönetim fonksiyonları, işletme politikasının tayini, organizasyon ve kadro kuruluşu, büro hizmetleri, kamu ilişkileri, güvenlik, hukuk işleri, personel işleri, kredi ve tahsilatı da kapsayan muhasebe ve mali işler servislerinin giderleri bu hesaba borç kaydedilir."}}},{"capa":null,"kural":"NGD = nihai satış değeri - ek işleme maliyeti; B payı, dağıtılacak net ortak maliyetin (Z düşülmüş) NGD oranına eşittir; yan ürünün satış geliri bu net tutara geri eklenerek gerçek ortak maliyete ulaşılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 58","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ters sorularda önce 'sonuç verilmiş, hangi ara adım isteniyor' diye zincire baştan değil sondan bak; oranı bul, oradan geriye giderek dağıtılacak taban tutarı hesapla.","konu":"ortak maliyet dağıtımı","tablo":{"satirlar":[["VERİLENLER","-"],["A ek işleme maliyeti","100.000 TL"],["B ek işleme maliyeti","30.000 TL"],["A nihai satış değeri","300.000 TL"],["B nihai satış değeri","150.000 TL"],["Z yan ürün satış geliri","20.000 TL"],["B'ye dağıtılan ortak maliyet payı","96.000 TL"],["HESAP","-"],["A ürünü net gerçekleşebilir değeri (300.000-100.000)","200.000"],["B ürünü net gerçekleşebilir değeri (150.000-30.000)","120.000"],["Toplam net gerçekleşebilir değer","320.000"],["B ürünü dağıtım oranı (120.000/320.000)","%37,5"],["Dağıtılacak net ortak maliyet (96.000/0,375)","256.000"],["Toplam birleşik (ortak) üretim maliyeti (256.000+20.000)","276.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"276.000","E":"308.000","A":"236.000","D":"288.000","B":"256.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Net Gerçekleşebilir Değeri hesaplarken ek işleme maliyetlerini çıkarmadığın için yanlış orana göre dağıttın, ayrıca yan ürün tutarını da hiç eklemedin.","E":"Hem ek işleme maliyetini dağıtım oranında kullanmadın hem de sonuçla yan ürün tutarını düzensiz şekilde birleştirerek iki hata yaptın.","A":"Yan ürün gelirini ortak maliyetten çıkarırken ayrıca net tutardan da çıkardığın için cevap küçük çıktı. Yan ürün tutarını bir kez düşülüyor, sonra toplam maliyeti bulurken geri ekliyoruz.","B":"Net dağıtılacak tutarı 256.000 TL olarak buldukten sonra durdum, yan ürünün indirilmiş tutarını geri eklemeyi unuttun. Bu 256.000 zaten yan ürün sonrası tutardır, toplam için üzerine yan ürün geliri eklenir."},"dogru":"Yan ürünün satış geliri ortak maliyetten düşülerek net dağıtılacak tutar bulunur. Bu net tutarı, B ürününün Net Gerçekleşebilir Değer oranına bölerek toplam net maliyeti elde ederiz. Son adımda yan ürünün tutarını geri ekleyerek gerçek ortak maliyete ulaşırız.","sinav":"Net Gerçekleşebilir Değer yöntemi, ayrılma noktasından sonra ek işleme maliyeti düşüldükten sonra kalan satış değerine göre ortak maliyeti orantılı olarak dağıtır ve yan ürüne pay verilmeyip satış geliri ortak maliyetten indirilir.","kavramlar":[{"kaynak":"TEORI","tanim":"Ürünün nihai satış değerinden ek işleme ve satış maliyetleri çıkarıldıktan sonra kalan tutar; ortak maliyetin dağıtılması sırasında dağıtım anahtarı olarak kullanılır.","ad":"Net Gerçekleşebilir Değer (NGD)"},{"kaynak":"TEORI","tanim":"Aynı hammadde ve süreçten ayrılma noktasına kadar birden fazla ürünün birlikte katlandığı, doğrudan izlenmesi mümkün olmayan maliyet.","ad":"Ortak (Birleşik) Maliyet"},{"kaynak":"TEORI","tanim":"Birleşik üretim sürecinde ana ürünle birlikte ortaya çıkan, satış değeri ana ürüne göre düşük kalan ürün; ortak maliyetten pay almaz, satış geliri ortak maliyetten düşülür.","ad":"Yan Ürün"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":13,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Toplam birleşik (ortak) üretim maliyeti (verilen)","300.000"],["P ürünü net gerçekleşebilir değeri (400.000-50.000)","350.000"],["R ürünü net gerçekleşebilir değeri (250.000-40.000)","210.000"],["Toplam net gerçekleşebilir değer","560.000"],["P ürünü dağıtım oranı (350.000/560.000)","%62,5"],["Dağıtılacak net ortak maliyet (300.000-15.000)","285.000"],["P ürününe isabet eden ortak maliyet payı (285.000x0,625)","178.125"]]},"tur":"tablo","soru":"Bir mobilya işletmesinde P ve R ana ürünleri ile T yan ürünü aynı ortak üretim sürecinden elde edilmektedir. Ayrılma noktasından sonra P ürününe 50.000 TL, R ürününe 40.000 TL ek işleme maliyeti yüklenmekte; P ürününün nihai satış değeri 400.000 TL, R ürününün nihai satış değeri 250.000 TL'dir. T yan ürününün satış geliri 15.000 TL olup yan ürüne ortak maliyetten pay verilmemekte, bu tutar ortak maliyetten düşülmektedir. İşletmenin toplam birleşik (ortak) üretim maliyeti 300.000 TL'dir. Net gerçekleşebilir değer yöntemine göre dağıtım yapıldığında P ürününe isabet eden ortak maliyet payı kaç TL'dir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve P ürününe isabet eden ortak maliyet payının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir tekstil işletmesinde A ve B ana ürünleri ile Z yan ürünü aynı ortak üretim sürecinden elde edilmektedir. Ayrılma noktasından sonra A ürününe 100.000 TL, B ürününe 30.000 TL ek işleme maliyeti yüklenmekte; A ürününün nihai satış değeri 300.000 TL, B ürününün nihai satış değeri 150.000 TL'dir. Z yan ürününün satış geliri 20.000 TL olup yan ürüne ortak maliyetten pay verilmemekte, bu tutar ortak maliyetten düşülmektedir. Net gerçekleşebilir değer yöntemine göre yapılan dağıtım sonucunda B ürününe isabet eden ortak maliyet payı 96.000 TL olarak hesaplanmıştır. Buna göre işletmenin toplam birleşik (ortak) üretim maliyeti kaç TL'dir?","kayitBaslik":"","id":"sgs-t1-maliyet-cokzor/kp-01","verilenler":[{"deger":"100.000 TL","anlam":"A ürününün ayrılma noktasından sonraki ek maliyeti; NGD hesabında nihai satış değerinden düşülür","ad":"A ek işleme maliyeti"},{"deger":"30.000 TL","anlam":"B ürününün ayrılma noktasından sonraki ek maliyeti; NGD hesabında nihai satış değerinden düşülür","ad":"B ek işleme maliyeti"},{"deger":"300.000 TL","anlam":"A ürününün tamamlanmış haldeki satış değeri; NGD hesabının başlangıç noktası","ad":"A nihai satış değeri"},{"deger":"150.000 TL","anlam":"B ürününün tamamlanmış haldeki satış değeri; NGD hesabının başlangıç noktası","ad":"B nihai satış değeri"},{"deger":"20.000 TL","anlam":"Yan ürüne pay verilmez, bu tutar önce ortak maliyetten düşülür, toplam ortak maliyeti bulurken geri eklenir","ad":"Z yan ürün satış geliri"},{"deger":"96.000 TL","anlam":"Sonuç olarak verilen tutar; buradan geriye gidilerek toplam ortak maliyet bulunur (ters soru)","ad":"B'ye dağıtılan ortak maliyet payı"}],"dayanak":"Ortak maliyet dağıtımı - net gerçekleşebilir değer yöntemi ve yan ürün maliyetlendirmesi (maliyet muhasebesi teorisi, mevzuat maddesi yok)","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: A ek işleme maliyeti 100.000 TL (soruda verilen); B ek işleme maliyeti 30.000 TL (soruda verilen); A nihai satış değeri 300.000 TL (soruda verilen); B nihai satış değeri 150.000 TL (soruda verilen); Z satış geliri 20.000 TL (soruda verilen); B'ye isabet eden ortak maliyet payı 96.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: A'ya 100.000 TL, B'ye 30.000 TL ek işleme maliyeti var. A'nın nihai satışı 300.000 TL, B'nin 150.000 TL, Z'nin satış geliri 20.000 TL ve B'ye düşen pay 96.000 TL olarak verilmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]]},{"formul":"Net Gerçekleşebilir Değer = Nihai Satış Değeri - Ek İşleme Maliyeti","anlatim":"Net gerçekleşebilir değer, ürünün son satış fiyatından kalan ek işleme maliyetinin çıkarılmasıyla bulunur. Bunu neden yapıyoruz? Çünkü ortak maliyeti ayrılma noktasındaki gerçek değere göre paylaştırmak istiyoruz.","doldur":[]},{"formul":"A ürünü net gerçekleşebilir değeri = 300.000 (soruda verilen) - 100.000 (soruda verilen) = 200.000","anlatim":"Önce A'nın net gerçekleşebilir değerini buluyoruz. A'nın satış değerinden kendi ek işleme maliyetini düşüyoruz.","doldur":[[8,1]]},{"formul":"B ürünü net gerçekleşebilir değeri = 150.000 (soruda verilen) - 30.000 (soruda verilen) = 120.000","anlatim":"Aynı işlemi B için yapıyoruz - B'nin satış değerinden kendi ek işleme maliyetini çıkarıyoruz.","doldur":[[9,1]]},{"formul":"Toplam net gerçekleşebilir değer = 200.000 (2. adımda bulduk) + 120.000 (3. adımda bulduk) = 320.000","anlatim":"Dağıtım oranını kurabilmek için iki ürünün net gerçekleşebilir değerlerini topluyoruz. Bu toplam, paylaştırma işleminin paydası olacak.","doldur":[[10,1]]},{"formul":"B ürünü dağıtım oranı = 120.000 (3. adımda bulduk) / 320.000 (4. adımda bulduk) = %37,5","anlatim":"B'nin toplam içindeki payını oran olarak buluyoruz. Bu oran, ortak maliyetten B'ye ne kadar düşeceğini belirler.","doldur":[[11,1]]},{"formul":"Dağıtılacak net ortak maliyet = B payı / B oranı = 96.000 (soruda verilen) / %37,5 (5. adımda bulduk) = 256.000; Dahil değil: Z yan ürünü satış geliri 20.000 (soruda verilen) burada henüz eklenmiyor","anlatim":"Soru bize B'nin payını zaten vermiş, biz de oranı biliyoruz - geriye doğru giderek dağıtılacak toplam net ortak maliyeti buluyoruz. Dikkat: Z'nin geliri bu aşamada henüz devrede değil, çünkü yan ürüne pay verilmiyor.","doldur":[[12,1]]},{"formul":"Toplam birleşik (ortak) üretim maliyeti = 256.000 (6. adımda bulduk) + 20.000 (soruda verilen) = 276.000","anlatim":"Yan ürünün satış geliri ortak maliyetten düşülerek dağıtım yapılmıştı, o yüzden gerçek toplam maliyete ulaşmak için bu tutarı geri ekliyoruz. Çünkü Z'nin geliri baştan ortak maliyeti azaltmıştı.","doldur":[[13,1]]},{"formul":"Ters durum: yan ürüne pay verilseydi → Z geliri ortak maliyetten düşülmez, direkt gelir yazılır","anlatim":"Ters durumda: yan ürüne de pay verilseydi, Z'nin satış geliri ortak maliyetten düşülmez, direkt hasılat olarak kaydedilirdi.","doldur":[]},{"formul":"Yanlış yol: dağıtılacak net ortak maliyeti direkt cevap yazmak = 256.000 (HATALI) → doğrusu 20.000 eklenip 276.000 (7. adımda bulduk)","anlatim":"En sık hata: 256.000'i cevap sanıp Z'nin gelirini eklemeyi unutmak. Soru net ortak maliyeti değil, toplam birleşik üretim maliyetini soruyor.","doldur":[]}],"anahtar":[{"ornek":"maliyetinin","kok":"maliye"},{"ornek":"geliri","kok":"geliri"},{"ornek":"gerçekleşebilir","kok":"gerçek"},{"ornek":"işleme","kok":"işleme"},{"ornek":"ürünün","kok":"ürünün"},{"ornek":"değerinden","kok":"değeri"}],"konuGiris":{"harita":"Ne zaman test edilir: Ayrılma noktasından sonra ek işlem gören ürünlerin ortak maliyeti paylaşılacağında. Nasıl ölçülür: Her ürünün net gerçekleşebilir değeri (nihai satış - ek maliyet) bulunup toplam ortak maliyet bu oranla dağıtılır. Nasıl kaydedilir: Yan ürün geliri ortak maliyetten düşülür, kalan tutar ana ürünlere NGD oranında paylaştırılır.","desen":"Sınav genelde bir ürünün payını verip toplam ortak maliyeti geriye doğru buldurur, öğrenci NGD hesabında ek maliyeti düşmeyi unutur. Yan ürün gelirinin ortak maliyetten düşülmesi de sıkça atlanır. Bu soru p.28'deki NGD dağıtım ve yan ürün geliri düşümü noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Nihai satış değerinden ayrılma noktası sonrası ek işleme maliyeti düşülünce kalan tutar","ad":"Net gerçekleşebilir değer (NGD)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Ayrılma noktasına kadar tüm ürünler için birlikte katlanılan, dağıtılacak tek maliyet havuzu","ad":"Ortak (birleşik) maliyet","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Ayrılma noktasından sonra tek bir ürüne doğrudan yüklenen, dağıtılmayan maliyet","ad":"Ek işleme maliyeti","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Yan ürünün satış gelirinin ortak maliyet havuzundan indirilmesi kuralı","ad":"Yan ürün geliri düşümü","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Ürünlerin nihai satış değerleri, ek işleme maliyetleri, yan ürün geliri ve bir ürüne isabet eden pay verilip toplam ortak maliyet istenir.","panel_ornek":"Sen ve iki arkadaşın ortak bir kargo kutusu paylaşıyorsunuz, kutunun kargo ücreti 60 TL. Senin eşyan daha değerli olduğu için payını değerine göre hesaplıyorsun, arkadaşınki daha ucuz eşya olduğu için daha az ödüyor. Kutudaki bir küçük eşyayı ise ücretsiz taşıtıyorsunuz, onun payı hiç hesaba katılmıyor.","ornek":"Sen ve iki arkadaşın ortak bir kargo kutusu paylaşıyorsunuz, kutunun kargo ücreti 60 TL. Senin eşyan daha değerli olduğu için payını değerine göre hesaplıyorsun, arkadaşınki daha ucuz eşya olduğu için daha az ödüyor. Kutudaki bir küçük eşyayı ise ücretsiz taşıtıyorsunuz, onun payı hiç hesaba katılmıyor.","yontemler":"Tek yöntem NGD'dir: her ürünün NGD'si bulunur, oranı verilen pay üzerinden toplam ortak maliyet (yan ürün geliri düşüldükten sonraki tutar) ters çözülür, sonra yan ürün geliri geri eklenir.","nedir":"Ortak maliyet dağıtımı, aynı süreçten çıkan birden fazla ürüne ayrılma noktasına kadarki maliyeti paylaştırma yöntemidir. Sınav, net gerçekleşebilir değere göre doğru orantılama yapılıp yapılamadığını ölçer."},"olay":"NGD_A=300.000-100.000=200.000; NGD_B=150.000-30.000=120.000; toplam NGD=320.000; B oranı=120.000/320.000=0,375; net ortak maliyet=96.000/0,375=256.000; toplam ortak maliyet=256.000+20.000=276.000.","tuzak":{"D":{"ad":"Ölçüt Karışıklığı Tuzağı","metin":"NGD hesaplarken ek işleme maliyetlerini düşmeden doğrudan nihai satış değerlerini oranladın, ayrıca yan ürün gelirini eklemedin. Doğrusu: dağıtım anahtarı ek işleme maliyeti düşülmüş NGD'dir, nihai satış değeri değildir."},"E":{"ad":"Bileşik Hata Tuzağı","metin":"hem yanlış oranla (ek işleme maliyetini düşmeden) net tutarı buldun hem de sonuna Z'yi ekleyerek iki hatayı birleştirdin. Doğrusu: doğru oran NGD'den, doğru toplam ise Z'nin doğru orana dayalı net tutara eklenmesinden gelir."},"A":{"ad":"Ters İşaret Tuzağı","metin":"Yan ürün satış gelirinin ortak maliyetten düşüldüğünü gördüğün için toplam ortak maliyeti bulurken bu tutarı dağıtılacak net tutardan bir kez daha çıkardın. Doğrusu: Z'nin satış geliri, net dağıtılacak tutara geri EKLENEREK toplam birleşik maliyete ulaşılır."},"B":{"ad":"Atlanan Katman Tuzağı","metin":"96.000 TL'yi 0,375 orana bölerek bulduğun 256.000'i doğrudan toplam ortak maliyet sandın, yan ürünün düşülmüş olan payını geri eklemeyi unuttun. Doğrusu: 256.000, Z düşüldükten SONRAKİ net dağıtılabilir tutardır, toplam ortak maliyet için üzerine Z eklenir."}},"celdiriciYol":{"D":"96.000 / (150.000/450.000) = 288.000 (NGD hesaplarken ek işleme maliyetini düşmeden nihai satış değerlerini oranladı, Z'yi eklemedi)","E":"96.000 / (150.000/450.000) + 20.000 = 308.000 (yanlış oranla bulunan tutara üstüne Z'yi ekledi)","A":"256.000 - 20.000 = 236.000 (Z yan ürün satış gelirini toplam ortak maliyetten ikinci kez çıkardı)","B":"96.000 / 0,375 = 256.000 (yan ürün satış gelirini toplam ortak maliyete hiç eklemedi, net tutarı toplam sandı)"},"hap":"Net gerçekleşebilir değer yönteminde dağıtım anahtarı, nihai satış değerinden ek işleme maliyetinin düşülmesiyle bulunan NGD'dir; yan ürünün ortak maliyetten düşülen satış geliri, toplam birleşik maliyete geri eklenerek bulunur.","teshis":{"C":{"gercek":"NGD oranıyla bulunan net tutara yan ürün satış geliri eklenince gerçek (birleşik) ortak maliyete ulaşılır.","ayirt":"Yan ürünün payını hem oran hesabından hem de son toplamdan doğru yerde mi kullandım?","paragraf":"Ortak maliyet dağıtımı ve yan ürün kuralı","yanilgi":"Bu şıkkı atlayan öğrenci, dağıtım oranını doğru kurduğu halde Z'yi toplama eklemeyi gözden kaçırmıştır."},"E":{"gercek":"Z'yi eklemek doğru adımdır ama önce oranın (NGD'nin) doğru hesaplanmış olması gerekir; yanlış tabana doğru bir ekleme yapmak sonucu düzeltmez.","ayirt":"Eklediğim düzeltme, doğru bir tabana mı uygulanıyor?","paragraf":"Ortak maliyet dağıtımı - NGD yöntemi teorisi","yanilgi":"Yanlış oranla bulduğun net tutarın hatalı olduğunu fark etmeden üzerine Z'yi ekleyip 'düzelttiğini' sandın."},"A":{"gercek":"Z'nin satış geliri net dağıtılacak tutardan BİR KEZ düşülür; toplam ortak maliyete geri dönerken aynı tutar geri eklenir, ikinci kez çıkarılmaz.","ayirt":"Bu işlemi zaten bir kez yaptım mı, şimdi tersini mi yapmam gerekiyor?","paragraf":"Ortak maliyet dağıtımı - NGD yöntemi teorisi","yanilgi":"Z'nin ortak maliyetten düşüldüğünü öğrendiğin için toplam maliyeti bulurken de aynı işlemi tekrar uygulayıp çıkarma yaptın."},"D":{"gercek":"NGD, nihai satış değerinden ek işleme maliyetinin düşülmesiyle bulunur; bu düşülmeden yapılan oran yanlış dağıtım anahtarı üretir.","ayirt":"Kullandığım değer ayrılma noktasındaki NET değer mi, yoksa ham nihai satış fiyatı mı?","paragraf":"Net gerçekleşebilir değer yöntemi tanımı","yanilgi":"NGD'yi hesaplarken ek işleme maliyetini düşmeyi gereksiz sanıp doğrudan nihai satış değerlerini oranladın."},"B":{"gercek":"Bu tutar yalnızca Z düşüldükten sonraki net dağıtılabilir ortak maliyettir; toplam birleşik maliyet için yan ürün geliri geri eklenir.","ayirt":"Bulduğum tutar 'net' mi yoksa 'toplam' mı; soru hangisini istiyor?","paragraf":"Yan ürün maliyetlendirmesi - ters hesaplama notu","yanilgi":"96.000/0,375 işleminden çıkan sayının doğrudan soruda istenen toplam ortak maliyet olduğunu sandın."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"donem":13,"hesaplar":{}},{"capa":null,"kural":"180 Gelecek Aylara Ait Giderler ve 380 Gelecek Aylara Ait Gelirler hesapları kullanılmadan tamamı gider/gelir yazılırsa yalnız cari döneme ait paylar kâra girmelidir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/1 ders 01 Soru 17","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"t ":{"C":"100.000 ₺ doğru tutarı bulunmuş ama işareti ters yazılmış; gider fazlası gelir fazlasından büyük olduğundan kâr düşük, yüksek değildir.","A":"Sadece kira geliri farkına (60.000 - 20.000 = 40.000) dikkat edilip gider farkı hesaba katılmamış; gider hatası da etki yaratır.","D":"Yalnız kira gideri farkına (180.000 - 40.000 = 140.000) bakılıp gelir farkı göz ardı edilmiş; gelir hatası da kâra etki eder.","B":"Hem gider hem gelir farkı bilinse de yönü ters çevrilmiş; doğru sonuç 140.000 - 40.000 = 100.000 ₺ düşük olmalıdır."},"dogru":"İşletme 180.000 ₺ kira giderini bütünü 2026'da yazmış ama sadece 40.000 ₺'si 2026'ya ait (Eylül-Aralık 4 ay); gelir olarak 60.000 ₺ aldığı halde sadece 20.000 ₺'si 2026'ya ait (Kasım-Aralık 2 ay). Gider fazlası (140.000 ₺) gelir fazlasından (40.000 ₺) büyük olduğu için kâr 100.000 ₺ düşük gösterildi.","sinav":"Vergi Usul Kanunu 283. madde - peşin ödenen giderler ve henüz tahsil edilmemiş gelirler cari dönem tarafına ayrılarak değerlendirilir, ödeme veya tahsil zamanı değil tahakkuk esası geçerlidir.","kavramlar":[{"kaynak":"TEORI","tanim":"Gelir ve giderler, ödeme veya tahsil zamanına bakılmaksızın ait oldukları muhasebe dönemine kaydedilmesi ilkesidir.","ad":"Dönemsellik"},{"kaynak":"Tekdüzen Hesap Planı 180","tanim":"Peşin ödenen ama gelecek dönemlerde gerçekleşecek giderlerin geçici olarak kaydedildiği hesaptır; cari dönem başladığında ilgili gider hesaplarına aktarılır.","ad":"Gelecek Aylara Ait Giderler"},{"kaynak":"Vergi Usul Kanunu 283. madde","tanim":"Gelecek dönemlere ait peşin ödenen giderler ile cari dönemlere ait henüz tahsil edilmemiş gelirler, tahakkuk esasıyla bilançoya yazılan varlık kalemleridir.","ad":"Aktif Geçici Hesap Kıymetleri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":14,"ornekler":[{"yil":"2026/2","alinti":"Anapara ve faiz vade sonunda ödenecektir. Buna göre kredinin alındığı yılın sonunda yapılması gereken kayıtla ilgili aşağıdakilerden hangisi doğrudur?"},{"yil":"2026/1","alinti":"Aradaki farkın, satıcılara ödendiği halde kayıtlara geçirilmeyen bir ödemeden kaynaklandığı saptanmıştır. Buna göre yapılacak günlük defter kaydıyla ilgili aşağıdakilerden hangisi doğrudur?"}],"donemler":["2025/2","2025/1","2024/2","2023/3","2023/2","2023/1","2022/3","2021/3","2021/2","2020/2","2019/2","2017/1","2016/2","2008/3"]},"oyun":{"bosluk":[[0,1],[2,1],[3,1],[5,1],[6,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Kira gideri - cari döneme ait pay (4 ay x 10.000)","40.000"],["Kaydedilen gider (hatalı)","150.000"],["Gider fazlası (kârı azaltan)","110.000"],["Kira geliri - cari döneme ait pay (3 ay x 10.000)","30.000"],["Kaydedilen gelir (hatalı)","60.000"],["Gelir fazlası (kârı artıran)","30.000"],["Net kâr etkisi (110.000-30.000)","80.000 ₺ düşük"]]},"tur":"tablo","soru":"İşletme, 1.09.2026 tarihinde depo için 15 aylık 150.000 ₺ kirayı peşin ödemiş ve tamamını Genel Yönetim Giderleri hesabına gider yazmıştır. Aynı işletme 1.10.2026 tarihinde boş bir depo alanını 6 ay süreyle kiraya vermiş, tahsil ettiği 60.000 ₺'nin tamamını gelir hesabına kaydetmiştir. Dönemsellik kavramına göre 2026 yılı kârı bu işlemler nedeniyle kaç ₺ yüksek ya da düşük gösterilmiştir?","verilen":[[1,1],[4,1]],"hedef":"Tabloyu doldur ve 2026 yılı kârının bu işlemler nedeniyle kaç ₺ yüksek ya da düşük gösterildiğini bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, 1.09.2026 tarihinde depo için 18 aylık 180.000 ₺ kirayı peşin ödemiş ve tamamını Genel Yönetim Giderleri hesabına gider yazmıştır. Aynı işletme 1.11.2026 tarihinde boş bir depo alanını 6 ay süreyle kiraya vermiş, tahsil ettiği 60.000 ₺'nin tamamını gelir hesabına kaydetmiştir. Dönemsellik kavramına göre 2026 yılı kârı bu işlemler nedeniyle kaç ₺ yüksek ya da düşük gösterilmiştir?","kayitBaslik":"","id":"smmm-4k-a-fmuh-zor-r3/kp-02","verilenler":[{"deger":"180.000 ₺","anlam":"1.09.2026'da 18 aylık depo kirası için peşin ödenen toplam tutar, tamamı gider yazılmış.","ad":"Kira ödemesi tutarı"},{"deger":"1.09.2026, 18 ay","anlam":"2026'da geçen ay sayısını (Eylül-Aralık=4 ay) bulmak için kullanılır.","ad":"Kira ödeme tarihi ve süresi"},{"deger":"60.000 ₺","anlam":"1.11.2026'da 6 aylık kiralama için peşin tahsil edilen toplam tutar, tamamı gelir yazılmış.","ad":"Kira tahsilatı tutarı"},{"deger":"1.11.2026, 6 ay","anlam":"2026'da geçen ay sayısını (Kasım-Aralık=2 ay) bulmak için kullanılır.","ad":"Kira tahsilat tarihi ve süresi"}],"dayanak":"VUK m.283 (aktif geçici hesap kıymetleri); MSUGT Sıra No:1 Tekdüzen Hesap Planı 180/380 işleyişi","dogru":"E","oyunBonus":null,"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Kaydedilen gider 180.000 (soruda verilen); Kaydedilen gelir 60.000 (soruda verilen); Gider süresi 18 ay, 1.09.2026 başlangıç (soruda verilen); Gelir süresi 6 ay, 1.11.2026 başlangıç (soruda verilen)","anlatim":"Soru bize şunları vermiş: 180.000 ₺ kira 18 aylık peşin ödenip tamamı gider yazılmış, 60.000 ₺ kira 6 aylık peşin alınıp tamamı gelir yazılmış. Sorulan: bu işlemler 2026 kârını kaç ₺ etkilemiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[7,1],[10,1]]},{"formul":"Cari döneme ait gider payı = aylık pay × geçen ay = 10.000 × 4 = 40.000 ₺","anlatim":"180.000 ₺'nin aylık payı 10.000 ₺, 2026'da sadece eylül-aralık yani 4 ay geçmiş. Sadece bu 4 aylık kısım cari dönemin gerçek giderdir.","doldur":[[6,1]]},{"formul":"Gider fazlası = 180.000 (soruda verilen) − 40.000 (2. adımda bulduk) = 140.000 ₺","anlatim":"Şirket 180.000'in tamamını gider yazmış ama gerçek pay 40.000. Aradaki fark kârı gereksiz yere düşüren fazla gider.","doldur":[[8,1]]},{"formul":"Cari döneme ait gelir payı = aylık pay × geçen ay = 10.000 × 2 = 20.000 ₺","anlatim":"60.000 ₺'nin aylık payı 10.000 ₺, kasım-aralık yani sadece 2 ay geçmiş. Cari döneme ait gelir bu 2 aylık kısımdır.","doldur":[[9,1]]},{"formul":"Gelir fazlası = 60.000 (soruda verilen) − 20.000 (4. adımda bulduk) = 40.000 ₺","anlatim":"60.000'in tamamı gelir yazılmış ama gerçek pay 20.000. Fark kârı yapay şekilde şişiren fazla gelirdir.","doldur":[[11,1]]},{"formul":"Net etki = Gider fazlası − Gelir fazlası = 140.000 (3. adımda bulduk) − 40.000 (5. adımda bulduk) = 100.000 ₺ düşük","anlatim":"Gider fazlası kârı azaltır, gelir fazlası kârı artırır; ikisini birbirinden çıkarıp net etkiyi buluyoruz. Sonuç negatif çıkarsa kâr düşük gösterilmiş demektir.","doldur":[[12,1]]},{"formul":"Ters durum: gelir fazlası > gider fazlası olsaydı → kâr yüksek gösterilir","anlatim":"Ters durumda gelir fazlası gider fazlasından büyük olsaydı kâr yüksek gösterilirdi. Yön hep büyük olan fazlaya göre belirlenir.","doldur":[]},{"formul":"Yanlış yol: 180.000 − 60.000 = 120.000 (HATALI) → doğrusu 100.000 ₺ düşük (6. adımda bulduk)","anlatim":"En sık hata: 180.000 ve 60.000'i doğrudan çıkarıp 120.000 diyoruz ama bu yanlış, önce her birinin cari döneme ait payını ayırmak gerekir. 180 Gelecek Aylara Ait Giderler ve 380 Gelecek Aylara Ait Gelirler hesapları kullanılmadığı için hata oluşmuştur.","doldur":[]}],"anahtar":[{"ornek":"gelecek","kok":"gelece"},{"ornek":"tamamı","kok":"tamamı"},{"ornek":"döneme","kok":"döneme"},{"ornek":"aylara","kok":"aylara"},{"ornek":"fazlası","kok":"fazlas"},{"ornek":"hesaplanır","kok":"hesapl"}],"konuGiris":{"harita":"Ne zaman test edilir: Peşin ödenen gider ya da peşin tahsil edilen gelirin dönem kârına doğru dağıtılıp dağıtılmadığı sorulduğunda. Nasıl ölçülür: Toplam tutar süreye bölünüp geçen ay sayısıyla çarpılarak cari döneme ait pay bulunur. Nasıl kaydedilir: Cari döneme ait pay ilgili gider veya gelir hesabında, kalan gelecek döneme ait pay 180 veya 380 hesabında tutulur.","desen":"Soru genelde peşin ödenen bir giderin veya peşin alınan bir gelirin tamamının yanlışlıkla ilgili döneme yazıldığını verir ve kârın kaç ₺ yanlış gösterildiğini sorar. Tuzak, gider ve gelirin süresini karıştırıp ay sayısını yanlış bölmek ya da iki işlemin etkisini birbirinden çıkarmayı unutmaktır. Bu soru Tekdüzen Hesap Planı 180/380 işleyişi ve dönemsellik kavramı noktasından geliyor (14 dönemde çıkmış).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Gelir ve giderin ödeme zamanına değil ait olduğu döneme yazılması ilkesi","ad":"Dönemsellik kavramı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Peşin ödenen ama sonraki döneme ait gider payını izleyen aktif hesap","ad":"180 Gelecek Aylara Ait Giderler","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Peşin tahsil edilen ama sonraki döneme ait gelir payını izleyen pasif hesap","ad":"380 Gelecek Aylara Ait Gelirler","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Toplam tutarın yalnızca geçen aylara denk gelen kısmı","ad":"Cari döneme ait pay","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Peşin ödenen kira gideri ile peşin tahsil edilen kira geliri tutarları ve süreleri verilir, bunların dönem kârını ne kadar saptırdığı istenir.","panel_ornek":"Bir öğrenci, 6 aylık spor salonu üyeliğine peşin 60 lira ödedi ama daha 1 ay geçti. O 60 liranın hepsini 'bu ayki harcamam' saymak yanlış olur; sadece 10 lirası bu aya ait. Kalan 50 lira gelecek aylar için bir hak, yani gelecekte kullanılacak bir varlık gibi durur.","ornek":"Bir öğrenci, 6 aylık spor salonu üyeliğine peşin 60 lira ödedi ama daha 1 ay geçti. O 60 liranın hepsini 'bu ayki harcamam' saymak yanlış olur; sadece 10 lirası bu aya ait. Kalan 50 lira gelecek aylar için bir hak, yani gelecekte kullanılacak bir varlık gibi durur.","yontemler":"Her tutarı kendi süresine bölüp cari döneme ait ay sayısıyla çarparak gerçek payı bul; fazla yazılan gider kârı düşürür, fazla yazılan gelir kârı yükseltir, ikisinin net etkisini birlikte değerlendir.","nedir":"Gelecek aylara ait gider, işletmenin peşin ödediği ama henüz yararlanmadığı dönemlere ait tutarı ayırmasıdır. Sınav bu ayırımın kâra doğru dönemde yansıyıp yansımadığını ölçer."},"olay":"Gider fazlası 180.000-40.000=140.000 (kârı azaltır); gelir fazlası 60.000-20.000=40.000 (kârı artırır); net 140.000-40.000=100.000.","tuzak":{"C":{"ad":"Yön Tuzağı","metin":"Doğru tutarı bulup işaretini ters çevirdiğinde bu şıkka varılır. Doğrusu: Gider fazlası gelir fazlasından büyük olduğundan kâr düşük gösterilmiştir, yüksek değil."},"A":{"ad":"Gelir Tarafı Tuzağı","metin":"Yalnız kira geliri farkına bakıp gider farkını gözden kaçırdığında bulunan tutardır. Doğrusu: Gider hatası da hesaba katılmalı, kâr 100.000 ₺ düşük gösterilmiştir."},"D":{"ad":"Gider Tarafı Tuzağı","metin":"Yalnız kira gideri farkına bakıp gelir farkını gözden kaçırdığında bulunan tutardır. Doğrusu: Gelir hatası da hesaba katılmalı, kâr 100.000 ₺ düşük gösterilmiştir."},"B":{"ad":"Karma Tuzak","metin":"Gelir farkı atlanıp ayrıca yön ters çevrildiğinde bu tutara ulaşılır. Doğrusu: Doğru net etki 140.000-40.000=100.000 ₺ düşük gösterilmiştir."}},"celdiriciYol":{"C":"140.000-40.000=100.000, işaret ters çevrildi (yön hatası)","A":"60.000-20.000=40.000 (gider tarafı atlanıp yalnız gelir farkına bakıldı)","D":"180.000-40.000=140.000 (gelir tarafı atlanıp yalnız gider farkına bakıldı)","B":"180.000-40.000=140.000, gelir farkı atlanıp yön de ters çevrildi"},"hap":"Peşin ödenen giderin ve peşin tahsil edilen gelirin gelecek döneme ait kısımları ayrı ayrı hesaplanır, kâr etkisi bu iki farkın netleştirilmesiyle bulunur.","teshis":{"C":{"gercek":"Fazla yazılan gider kârı azaltıcı, fazla yazılan gelir kârı artırıcı yöndedir; gider fazlası büyük olduğu için net etki kârı düşürür.","ayirt":"Hangi fazlalık daha büyük, gider mi gelir mi? Büyük olan yönü belirler.","paragraf":"MSUGT Temel Kavramlar - Dönemsellik","yanilgi":"Doğru tutarı bulduğunu düşünüp kâr yönünü rastgele 'yüksek' olarak işaretlediğin an bu hataya düşersin."},"E":{"gercek":"VUK m.283 gereği gelecek döneme ait peşin ödenen gider aktifleştirilir, peşin tahsil edilen gelir pasifleştirilir; ikisinin cari dönem dışı payları netleştirilerek kâr etkisi bulunur.","ayirt":"Gider fazlası ile gelir fazlasını ayrı ayrı bulup birbirinden çıkardım mı?","paragraf":"VUK m.283; THP 180/380","yanilgi":"Bu şıkkı eleyen öğrenci genellikle iki farkı ayrı ayrı bulup toplamak yerine birini atlar veya işaretini karıştırır."},"A":{"gercek":"Dönemsellik gereği hem gider hem gelir tarafı aynı anda cari döneme ait paya indirilir; tek taraf düzeltilirse net etki eksik hesaplanır.","ayirt":"Sadece bir hesabı mı düzelttim, karşı taraftaki peşin işlemi unuttum mu?","paragraf":"MSUGT THP 180-380 işleyişi","yanilgi":"Sen kira gelirinin cari döneme ait olmayan kısmını hesapladın ama peşin ödenen kira giderinin de aynı şekilde bölünmesi gerektiğini unuttun."},"D":{"gercek":"Peşin tahsil edilen gelirin gelecek döneme ait kısmı da 380 hesabına aktarılmalı, aksi halde kâr etkisi tek yönlü hesaplanır.","ayirt":"Gelir tarafında da bir peşin tahsilat var mı, onu da böldüm mü?","paragraf":"THP 380 Gelecek Aylara Ait Gelirler","yanilgi":"Sen kira giderinin gelecek döneme ait kısmını doğru buldun ama kira geliri tarafında da aynı ayrımı yapman gerektiğini gözden kaçırdın."},"B":{"gercek":"Doğru çözümde hem her iki taraf ayrı ayrı hesaplanır hem de büyük olan fazlalığın yönü esas alınır; burada gider fazlası büyük olduğundan kâr düşük gösterilir.","ayirt":"İki hatayı aynı anda mı yaptım: bir taraf eksik, bir de yön ters mi?","paragraf":"MSUGT Temel Kavramlar - Dönemsellik","yanilgi":"Sen gelir tarafını atladın ve üstüne bir de kâr yönünü ters çevirdin, iki hatayı üst üste yaptın."}},"verilen":[[7,1],[10,1],[1,1],[2,1],[3,1],[4,1]],"donem":14,"hesaplar":{}},{"capa":null,"kural":"Normal maliyet yönteminde sabit genel üretim giderinin mamule yüklenen kısmı, tam kapasite bütçesinin fiili kapasite kullanım oranı kadarıdır; bütçeye ulaşmak için yüklenen tutar fiili orana bölünür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 63","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Metinde iki farklı kapasite kullanım oranı verilmişse, yükleme hesabında her zaman FİİLEN GERÇEKLEŞEN oranı kullan.","konu":"normal maliyet yöntemi","tablo":{"satirlar":[["VERİLENLER","-"],["Normal kapasite","20.000 adet"],["Fiili üretim","15.000 adet"],["Direkt ilk madde ve malzeme","300.000 TL"],["Direkt işçilik","180.000 TL"],["Değişken genel üretim gideri","90.000 TL"],["Planlanan kapasite kullanım oranı","%80"],["Fiili kapasite kullanım oranı","%75"],["Toplam üretim maliyeti","720.000 TL"],["HESAP","-"],["Toplam Üretim Maliyeti (verilen)","720.000"],["Direkt İlk Madde ve Malzeme","300.000"],["Direkt İşçilik","180.000"],["Değişken Genel Üretim Gideri","90.000"],["Yüklenen Sabit Genel Üretim Gideri (720.000-300.000-180.000-90.000)","150.000"],["Fiili Kapasite Kullanım Oranı (15.000/20.000)","%75"],["Sabit Genel Üretim Gideri Bütçesi (150.000/0,75)","200.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"187.500","E":"240.000","A":"112.500","D":"200.000","B":"150.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Fiili kapasite oranı (yüzde 75) yerine işletmenin planlama aşamasında öngördüğü (yüzde 80) oranını kullanırsanız 150.000 ÷ 0,80 = 187.500 bulursunuz; normal maliyet yönteminde geçerli olan dönem sonunda gerçekleşen orandır.","E":"Toplam üretim maliyetinden yalnız direkt giderleri (300.000 + 180.000 = 480.000) çıkarıp kalan 240.000'in tamamını sabit bütçe zannederseniz hata yaparsınız; bu tutardan değişken genel üretim gideri (90.000) de ayrıca düşülmelidir.","A":"Yüklenen sabit gideri gerçek kapasite oranıyla çarparsanız 150.000 × 0,75 = 112.500 bulursunuz; ama bütçeye ulaşmak için orana bölmek gerekir, çarpmamak.","B":"Yüklenen sabit giderin 150.000 TL'nin kendisini tam kapasite bütçesi zannederseniz bu cevap çıkar; oysa bu miktar ancak yüzde 75'lik kapasite kullanımında ortaya çıkmıştır, bütçe daha yüksektir."},"dogru":"Normal maliyet yönteminde sabit genel üretim giderinin mamule yüklenen kısmı, tam kapasitenin gerçekleşen kapasite kullanım oranı kadarıdır. Yüklenen sabit gider (150.000 TL) gerçek oranına (yüzde 75) bölünerek tam kapasite bütçesi bulunur: 150.000 ÷ 0,75 = 200.000 TL.","sinav":"TMS 2 Stoklar paragraf 13 uyarınca sabit genel üretim giderleri üretim tesislerinin normal kapasitesi esas alınarak kapasite kullanım oranına göre dönüştürme maliyetlerine dağıtılır.","kavramlar":[{"kaynak":"Teori Notu","tanim":"Değişken genel üretim giderinin tamamı, sabit genel üretim giderinin ise yalnız kapasite kullanım oranına düşen kısmı mamul maliyetine yüklenir; boş kapasiteye düşen sabit gider dönem gideri olur.","ad":"Normal maliyet yöntemi"},{"kaynak":"TMS 2 paragraf 13","tanim":"Üretim tesisinin normal kapasitesi esas alınarak dönüştürme maliyetlerine dağıtılan, üretim miktarından bağımsız giderlerdir.","ad":"Sabit genel üretim gideri"},{"kaynak":"TEORI","tanim":"Fiili üretim miktarının normal kapasite miktarına oranıdır; sabit genel üretim giderinin mamule yüklenen kısmını belirler.","ad":"Kapasite kullanım oranı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[4,1],[5,1],[6,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Toplam Üretim Maliyeti (verilen)","900.000"],["Direkt İlk Madde ve Malzeme","400.000"],["Direkt İşçilik","240.000"],["Değişken Genel Üretim Gideri","120.000"],["Yüklenen Sabit Genel Üretim Gideri (900.000-400.000-240.000-120.000)","140.000"],["Fiili Kapasite Kullanım Oranı (20.000/25.000)","%80"],["Sabit Genel Üretim Gideri Bütçesi (140.000/0,80)","175.000"]]},"tur":"tablo","soru":"Bir üretim işletmesinin aylık normal kapasitesi 25.000 adet mamuldür. İlgili dönemde fiilen 20.000 adet mamul üretilmiştir. Aynı dönemde direkt ilk madde ve malzeme giderleri 400.000 TL, direkt işçilik giderleri 240.000 TL, değişken genel üretim giderleri 120.000 TL olarak gerçekleşmiştir. İşletmenin planlama aşamasında öngördüğü (bütçelenen) kapasite kullanım oranı yüzde 90'dır. Dönem başı ve dönem sonu yarı mamul stoku bulunmayan işletmede normal maliyet yöntemi uygulandığında toplam üretim maliyeti 900.000 TL olarak hesaplanmıştır. Bu işletmenin tam kapasitede oluşacak sabit genel üretim gideri bütçesi kaç TL'dir?","verilen":[[0,1],[1,1],[2,1],[3,1]],"hedef":"Tabloyu doldur ve tam kapasitede oluşacak sabit genel üretim gideri bütçesinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir üretim işletmesinin aylık normal kapasitesi 20.000 adet mamuldür. İlgili dönemde fiilen 15.000 adet mamul üretilmiştir. Aynı dönemde direkt ilk madde ve malzeme giderleri 300.000 TL, direkt işçilik giderleri 180.000 TL, değişken genel üretim giderleri 90.000 TL olarak gerçekleşmiştir. İşletmenin planlama aşamasında öngördüğü (bütçelenen) kapasite kullanım oranı yüzde 80 olmakla birlikte, dönem sonunda gerçekleşen kapasite kullanım oranı yüzde 75'te kalmıştır. Dönem başı ve dönem sonu yarı mamul stoku bulunmayan işletmede normal maliyet yöntemi uygulandığında toplam üretim maliyeti 720.000 TL olarak hesaplanmıştır. Bu işletmenin tam kapasitede oluşacak sabit genel üretim gideri bütçesi kaç TL'dir?","kayitBaslik":"","id":"sgs-p-maliyet-cokzor-r3/kp-01","verilenler":[{"deger":"20.000 adet","anlam":"Fiili kapasite kullanım oranının hesaplanmasında payda olarak kullanılan tam kapasite miktarı.","ad":"Normal kapasite"},{"deger":"15.000 adet","anlam":"Dönemde gerçekleşen üretim miktarı; fiili kapasite kullanım oranının payını oluşturur.","ad":"Fiili üretim"},{"deger":"300.000 TL","anlam":"Toplam maliyetten çıkarılacak değişken maliyet unsurlarından biri.","ad":"Direkt ilk madde ve malzeme"},{"deger":"180.000 TL","anlam":"Toplam maliyetten çıkarılacak değişken maliyet unsurlarından biri.","ad":"Direkt işçilik"},{"deger":"90.000 TL","anlam":"Toplam maliyetten çıkarılacak değişken maliyet unsurlarından biri.","ad":"Değişken genel üretim gideri"},{"deger":"%80","anlam":"Çeldirici verilen; hesaplamada kullanılmaz, yalnız planlama aşamasına aittir.","ad":"Planlanan kapasite kullanım oranı"},{"deger":"%75","anlam":"Yüklenen sabit gideri bütçeye dönüştürmek için bölünecek oran.","ad":"Fiili kapasite kullanım oranı"},{"deger":"720.000 TL","anlam":"Normal maliyet yöntemine göre hesaplanmış sonuç; yüklenen sabit gideri bulmak için diğer unsurların çıkarılacağı toplam.","ad":"Toplam üretim maliyeti"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı 730-680; TMS 2 sabit genel üretim giderinin normal kapasiteye göre yüklenmesi kuralı","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Toplam Üretim Maliyeti 720.000 TL (soruda verilen); Direkt İlk Madde ve Malzeme 300.000 TL (soruda verilen); Direkt İşçilik 180.000 TL (soruda verilen); Değişken Genel Üretim Gideri 90.000 TL (soruda verilen); Normal kapasite 20.000 adet (soruda verilen); Fiili üretim 15.000 adet (soruda verilen)","anlatim":"Soru bize toplam üretim maliyetini ve giderleri vermiş: toplam maliyet 720.000 TL, direkt ilk madde 300.000 TL, direkt işçilik 180.000 TL, değişken genel üretim gideri 90.000 TL. Ayrıca normal kapasite 20.000 adet, fiili üretim 15.000 adet.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[10,1],[11,1],[12,1],[13,1]]},{"formul":"Genel üretim gideri nedir?","anlatim":"Genel üretim gideri nedir? Direkt madde ve işçilik dışında kalan, mamulün üretiminde katlanılan diğer giderlerdir; değişken ve sabit kısmı ayrı izlenir.","doldur":[]},{"formul":"Normal maliyet yönteminde sabit gider mamule tam değil, kapasite kullanım oranı kadar yüklenir.","anlatim":"Normal maliyet yönteminde sabit gider mamule tam değil, kapasite kullanım oranı kadar yüklenir. Kalan kısım yüklenmemiş sabit gider olarak ayrı gösterilir.","doldur":[]},{"formul":"Yüklenen Sabit Genel Üretim Gideri = Toplam Üretim Maliyeti − direkt ilk madde ve malzeme − Direkt İşçilik − Değişken genel üretim gideri = 720.000 (soruda verilen) − 300.000 (soruda verilen) − 180.000 (soruda verilen) − 90.000 (soruda verilen) = 150.000 TL","anlatim":"Toplam maliyetten bildiğimiz üç gideri çıkarınca geriye yüklenen sabit genel üretim gideri kalır. Bu, mamule fiilen yansıyan sabit gider payıdır.","doldur":[[14,1]]},{"formul":"Fiili Kapasite Kullanım Oranı = Fiili Üretim / Normal Kapasite = 15.000 (soruda verilen) / 20.000 (soruda verilen) = %75","anlatim":"Fiili kapasite kullanım oranı, gerçek üretimin normal kapasiteye oranıdır. Bütçelenen %80 burada işimize yaramaz, çünkü yükleme fiili orana göre yapılır.","doldur":[[15,1]]},{"formul":"Sabit Genel Üretim Gideri Bütçesi = Yüklenen Sabit genel üretim gideri / Fiili Kapasite Kullanım Oranı = 150.000 (4. adımda bulduk) / %75 = 200.000 TL","anlatim":"Yüklenen sabit gider, tam kapasite bütçesinin fiili oran kadarıdır. Bütçeyi bulmak için yüklenen tutarı fiili orana böleriz.","doldur":[[16,1]]},{"formul":"Sağlama: 200.000 (6. adımda bulduk) × %75 = 150.000 (4. adımda bulduk) ✓","anlatim":"Sağlama yapalım: bütçenin %75'i yüklenen tutara eşit çıkmalı. 200.000 × %75 = 150.000, ilk bulduğumuzla aynı, doğru.","doldur":[]},{"formul":"Sonuç: Sabit Genel Üretim Gideri Bütçesi = 200.000 TL","anlatim":"Sonuç: tam kapasitede oluşacak sabit genel üretim gideri bütçesi 200.000 TL'dir.","doldur":[]},{"formul":"Ters durum: bütçelenen oran kullanılsaydı → 150.000 / %80 = 187.500 TL (HATALI)","anlatim":"Ters durumda bütçelenen %80 kullanılsaydı bütçe yanlış çıkardı; çünkü yükleme her zaman fiili orana göre yapılır.","doldur":[]},{"formul":"Yanlış yol: 150.000 / %80 = 187.500 (HATALI) → doğrusu 150.000 / %75 = 200.000 (6. adımda bulduk)","anlatim":"En sık hata: öğrenci 150.000'i bütçelenen %80'e böler, 187.500 çıkarır. Doğrusu fiili orana bölmektir, çünkü yükleme fiili kapasiteye göre yapılır.","doldur":[]}],"anahtar":[{"ornek":"kapasite","kok":"kapasi"},{"ornek":"üretim","kok":"üretim"},{"ornek":"yüklenen","kok":"yüklen"},{"ornek":"giderinin","kok":"gideri"},{"ornek":"maliyet","kok":"maliye"},{"ornek":"normal","kok":"normal"}],"konuGiris":{"harita":"Ne zaman test edilir: Fiili üretim, normal kapasitenin altında kaldığında test edilir. Nasıl ölçülür: Sabit genel üretim gideri, kapasite kullanım oranına göre mamule yüklenir. Nasıl kaydedilir: Yüklenmeyen kısım, çalışılmayan kısım gideri olarak dönem gideri yazılır.","desen":"Soru genelde önce toplam maliyetten geriye doğru yüklenen sabit genel üretim gideri'u buldurur, sonra bunu kapasite kullanım oranına bölerek tam kapasitedeki bütçeyi istetir. Tuzak, bütçelenen kapasite oranı ile gerçekleşen oranın karıştırılmasıdır; hesapta gerçekleşen oran kullanılmalıdır. Bu soru TMS 2 p.13 sabit genel üretim giderinin normal kapasiteye göre dağıtılması noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşletmenin planlanan bakım dahil ortalama üretebileceği miktar","ad":"Normal kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Fiili üretimin normal kapasiteye bölünmesiyle bulunan oran","ad":"Kapasite kullanım oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Sabit giderin kapasite kullanım oranı kadar mamule aktarılan kısmı","ad":"Yüklenen sabit genel üretim gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Boş kapasiteye düşen sabit giderin dönem gideri yazılan kısmı","ad":"Çalışmayan kısım gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Toplam üretim maliyeti ve giderler verilip tam kapasitedeki sabit genel üretim gideri bütçesi istenir.","panel_ornek":"Bir kırtasiye 10 kalem alımı için depo kapasitesi 100 kutu ayırmış ama o ay sadece 60 kutu doldurmuş. Boş kalan 40 kutuluk yer için ödenen kira gideri o ay doğrudan zarar yazılır, mala eklenmez.","ornek":"Bir kırtasiye 10 kalem alımı için depo kapasitesi 100 kutu ayırmış ama o ay sadece 60 kutu doldurmuş. Boş kalan 40 kutuluk yer için ödenen kira gideri o ay doğrudan zarar yazılır, mala eklenmez.","yontemler":"Önce toplam maliyetten değişken giderler çıkarılarak yüklenen sabit genel üretim gideri bulunur, sonra bu tutar gerçekleşen kapasite kullanım oranına bölünerek tam kapasite bütçesine ulaşılır.","nedir":"Normal maliyet yöntemi, mamul maliyetine sabit giderlerin ancak kullanılan kapasite kadarını yükleyen bir maliyetleme şekli. Sınav bu yöntemle atıl kapasiteye düşen sabit giderin nasıl ayrıldığını ölçer."},"olay":"Yüklenen sabit gider = 720.000-300.000-180.000-90.000 = 150.000; Bütçe = 150.000/0,75 = 200.000.","tuzak":{"C":{"ad":"Planlanan Oran Tuzağı","metin":"Fiili kapasite kullanım oranı yerine işletmenin öngördüğü (planlanan) yüzde 80 oranını kullandın. Doğrusu: normal maliyet yönteminde yükleme, dönem sonunda GERÇEKLEŞEN kapasite kullanım oranına göre yapılır."},"E":{"ad":"Değişken Gider Karıştırma Tuzağı","metin":"Değişken genel üretim giderini toplamdan düşmeyi unutup kalan tutarın tamamını sabit gider bütçesi sandın. Doğrusu: önce değişken genel üretim gideri de düşülüp yalnız yüklenen sabit kısım bulunur."},"A":{"ad":"Sabit Yükleme Hatası Tuzağı","metin":"Yüklenen sabit genel üretim giderini fiili kapasite kullanım oranıyla çarpıp bütçeye ulaşacağını sandın. Doğrusu: bütçeye ulaşmak için yüklenen tutar orana bölünür, çarpılmaz."},"B":{"ad":"Oran Atlama Tuzağı","metin":"Yüklenen sabit genel üretim giderinin kendisini tam kapasite bütçesi sandın, kapasite kullanım oranını hiç uygulamadın. Doğrusu: yüklenen tutar bütçenin ancak yüzde 75'idir, bütçe için 0,75'e bölünür."}},"celdiriciYol":{"C":"150.000 / 0,80 = 187.500 (fiili yerine planlanan kapasite kullanım oranını kullanma)","E":"720.000 - 300.000 - 180.000 = 240.000 (değişken genel üretim giderini düşmeyi unutma)","A":"150.000 x 0,75 = 112.500 (bölme yerine çarpma hatası)","B":"720.000 - 300.000 - 180.000 - 90.000 = 150.000 (orana bölmeyi unutma, yüklenen tutarı bütçe sanma)"},"hap":"Normal maliyet yönteminde sabit genel üretim giderinin mamule yüklenen kısmı, tam kapasite bütçesinin FİİLİ kapasite kullanım oranı kadarıdır.","teshis":{"C":{"gercek":"Normal maliyet yönteminde yükleme oranı, dönem sonunda GERÇEKLEŞEN (fiili) kapasite kullanım oranına göre belirlenir; planlanan oran yalnız bütçeleme aşamasına aittir.","ayirt":"Kullandığım oran, metinde 'gerçekleşen' diye geçen mi yoksa 'öngörülen/planlanan' diye geçen oran mı?","paragraf":"Teori Notu - normal maliyet yöntemi, fiili kapasite kullanım oranı kuralı","yanilgi":"İşletmenin planlama aşamasında öngördüğü kapasite kullanım oranını, dönem sonu hesaplamasında da geçerli sanıyorsun."},"E":{"gercek":"Toplam maliyetten önce direkt ilk madde ve malzeme, direkt işçilik ve değişken genel üretim gideri düşülür; kalan tutar yalnız YÜKLENEN sabit gideri verir, bütçenin kendisi değildir.","ayirt":"Toplamdan çıkardığım kalemler arasında değişken genel üretim gideri var mıydı?","paragraf":"Teori Notu - normal maliyet yöntemi, maliyet unsurları ayrımı","yanilgi":"Değişken genel üretim giderini toplam maliyetten düşmeyi unutup kalan tutarın tümünü sabit gider bütçesi sanıyorsun."},"A":{"gercek":"Yüklenen tutar, bütçenin kapasite kullanım oranı kadarlık payıdır; tam bütçeye dönmek için yüklenen tutar orana bölünür, çarpılmaz.","ayirt":"Bulduğum tutar, verilen orandan daha küçük mü çıktı - bölme mi çarpma mı yaptım?","paragraf":"MSUGT Sıra No:1 THP 730-680","yanilgi":"Bütçeye ulaşmak için yüklenen tutarı orana bölmek yerine oranla çarpmam gerektiğini düşünüyorsun."},"D":{"gercek":"Normal maliyet yönteminde yüklenen sabit gider = bütçe × fiili kapasite kullanım oranı olduğundan, bütçe = yüklenen tutar / fiili oran ile bulunur.","ayirt":"Yüklenen sabit gideri bulduktan sonra, bütçeye dönmek için doğru orana böldüm mü?","paragraf":"MSUGT Sıra No:1 THP 730-680; TMS 2 sabit GÜG normal kapasiteye göre yükleme kuralı","yanilgi":"Bu şıkkı eleyen öğrenci, sabit gider bütçesini bulmak için yüklenen tutarı orana bölmek gerektiğini fark edemez ve doğrudan bir toplam veya çarpım sonucunu doğru sanır."},"B":{"gercek":"Normal maliyet yönteminde mamule yüklenen sabit gider, tam kapasite bütçesinin yalnız kapasite kullanım oranı kadarlık kısmıdır; bütçenin tamamı değildir.","ayirt":"Bu tutar, fiili kapasite kullanım oranıyla çarpıldığında mı elde edildi yoksa oran hiç mi uygulanmadı?","paragraf":"TMS 2 stok maliyeti - sabit GÜG normal kapasiteye göre yükleme kuralı","yanilgi":"Yüklenen sabit genel üretim giderini doğrudan tam kapasite bütçesi olarak kabul ediyorsun, kapasite kullanım oranını hesaba katmıyorsun."}},"verilen":[[10,1],[11,1],[12,1],[13,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]],"donem":7,"hesaplar":{}},{"capa":null,"kural":"Tekdüzen Hesap Planı 192 ve 291'e göre, indirim hakkı doğan tutarlar mahsuptan önce 191 hesabına aktarılır ve 191'in nihai toplamı 391 ile karşılaştırılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/1 ders 01 Soru 4","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"1.045.000","taraf":"B","hesap":"391 HESAPLANAN KDV"},{"tutar":"895.000","taraf":"A","hesap":"191 İNDİRİLECEK KDV"},{"tutar":"150.000","taraf":"A","hesap":"360 ÖDENECEK VERGİ VE FONLAR"}],"teori":false,"taktik":"Mahsuba geçmeden önce 191 hesabına giren TÜM aktarımları (192, 291) tek tek topla, sonra 391 ile karşılaştır.","konu":"kdv mahsup kaydı","tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["VERİLENLER","-"],["Dönem içi İndirilecek KDV","812.500 ₺"],["192'den aktarılan tutar","47.350 ₺"],["291'den aktarılan tutar","35.150 ₺"],["Hesaplanan KDV","1.045.000 ₺"],["HESAP","-"],["192'den 191'e aktarılan tutar","47.350"],["291'den 191'e aktarılan tutar","35.150"],["Toplam İndirilecek KDV (191)","895.000"],["Hesaplanan KDV (391)","1.045.000"],["360 ÖDENECEK VERGİ VE FONLAR hesabı alacak kaydedilecek Ödenecek KDV","150.000"]]},"siklar":{"C":"197.350","E":"244.700","A":"150.000","D":"232.500","B":"185.150"},"kaynak":{"alinti":"","liste":[{"ad":"THP 191 hesapta eksik gösterirsin; oysa bu aktarım 191 hesabını artıran bir borç kaydıdır.","D":"İndirim haklarının yalnız dönem içi alışlardan kaynaklandığını düşünüp 192 ve 291'den gelen aktarımların her ikisini de dışarıda bırakırsın; halbuki her iki tutarın da 191 toplamına eklenmesi zorunludur.","B":"192 ve 291'den gelen aktarımların toplanması gerekiyorken 291'i göz ardı edip yalnız 812.500 artı 47.350 ile işlem yaparsın; ancak amortismana tabi kıymet KDV'si de 191'e dahil olduğu için sonuç hatalı çıkar."},"dogru":"Şirketi ay sonunda ödemesi gereken KDV'yi bulmak için önce tüm indirim haklarını toplayacaksın: dönem içi indirilebilir 812.500 artı teşvikli yatırım 47.350 artı amortismana tabi 35.150 eşittir 895.000; bunu hesaplanan 1.045.000'den çıkarırsan 150.000 kalır, işte ödenecek KDV bu.","sinav":"Tekdüzen Hesap Planı 191, 192 ve 291 hesaplarında kayıtlı katma değer vergisi indirim haklarından kaynaklanan tutarlar ay sonu mahsuplamada 191 hesabına aktarıldıktan sonra 391 hesabından düşülür.","kavramlar":[{"kaynak":"Tekdüzen Hesap Planı 191","tanim":"Mal ve hizmet satın alırken satıcıya ödenen katma değer vergisinden, mevzuat kurallarına göre indirme hakkı olan tutar.","ad":"İndirilecek KDV"},{"kaynak":"Tekdüzen Hesap Planı 192","tanim":"Teşvikli yatırım mallarının ithalatında ödenmesi gerektiği halde ertelenen ve belirli koşullarda indirilebilir hale gelen katma değer vergisi.","ad":"Teşvikli yatırım malı ithalat KDV'si"},{"kaynak":"Tekdüzen Hesap Planı 291","tanim":"Amortismana tabi kıymetler için bir yıldan daha uzun süre içinde bölümlenerek indirilebilecek katma değer vergisi tutarı.","ad":"Gelecek yıllarda indirilebilecek KDV"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":14,"ornekler":[],"donemler":["2025/2","2024/3","2023/2","2023/1","2021/2","2019/3","2018/2","2018/1","2017/2","2014/2","2013/3","2013/1","2012/1","2010/2"]},"oyun":{"bosluk":[[2,1],[4,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar
