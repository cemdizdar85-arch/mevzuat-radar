n alacak toplamı; 191 ile mahsup edilecek karşı tutar.","ad":"Hesaplanan KDV"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı - 191/192/291 İşleyiş hükümleri","dogru":"A","oyunBonus":{"soru":"Bir makine imalat işletmesinde 2026 Mart ayı KDV verileri şöyledir: 191 hesaptaki dönem içi İndirilecek KDV 1.625.000 ₺; 192 hesabındaki teşvikli yatırım malı ithalat KDV'sinden indirim hakkı doğup 191'e aktarılan tutar 94.700 ₺; 291 hesaptaki amortismana tabi kıymet KDV'sinden bu yıl indirilebilir hale gelip 191'e aktarılan tutar 70.300 ₺; Hesaplanan KDV (391) 2.090.000 ₺'dir. Ay sonu mahsup kaydında 360 hesabına alacak kaydedilecek tutar kaç ₺'dir?","tur":"olcek","kayit":[{"tutar":"2.090.000","taraf":"B","hesap":"391 HESAPLANAN KDV"},{"tutar":"1.790.000","taraf":"A","hesap":"191 İNDİRİLECEK KDV"},{"tutar":"300.000","taraf":"A","hesap":"360 ÖDENECEK VERGİ VE FONLAR"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: 192'den 191'e aktarılan 47.350 (soruda verilen); 291'den 191'e aktarılan 35.150 (soruda verilen); Hesaplanan KDV 1.045.000 (soruda verilen); dönem içi 191 812.500 (soruda verilen)","anlatim":"Soru bize 192'den aktarılan 47.350, 291'den aktarılan 35.150 ve Hesaplanan KDV 1.045.000'i vermiş. Dönem içi 191 tutarı olan 812.500 de soru metninde verilen bir bilgi.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[6,1],[7,1],[9,1]]},{"formul":"192 Diğer KDV, teşvikli ithalatta ertelenen KDV'yi tutar.","anlatim":"192 Diğer KDV, teşvikli ithalatta ertelenen KDV'yi tutar. İndirim hakkı doğunca bu tutar 191'e aktarılır.","doldur":[]},{"formul":"291 Gelecek Yıllarda İndirilecek KDV, amortismana tabi kıymetin uzun vadeli KDV'sini tutar.","anlatim":"291 Gelecek Yıllarda İndirilecek KDV, amortismana tabi kıymetin uzun vadeli KDV'sini tutar. İndirilebilir hale gelince 191'e devrolur.","doldur":[]},{"formul":"Toplam İndirilecek KDV (191) = dönem içi + 192 payı + 291 payı = 812.500 (soruda verilen) + 47.350 (soruda verilen) + 35.150 (soruda verilen) = 895.000","anlatim":"191 İndirilecek KDV, alışlarda ödenen KDV'yi biriktirir. Buraya hem dönem içi tutar hem de 192 ve 291'den gelen paylar eklenir.","doldur":[[8,1]]},{"formul":"391 Hesaplanan KDV, satışlardan doğan KDV'yi tutar.","anlatim":"391 Hesaplanan KDV, satışlardan doğan KDV'yi tutar. Dönem sonunda 191 ile karşılaştırılır.","doldur":[]},{"formul":"360'a alacak = Hesaplanan KDV - Toplam İndirilecek KDV = 1.045.000 (soruda verilen) - 895.000 (4. adımda bulduk) = 150.000","anlatim":"360 Ödenecek Vergi ve Fonlar, 391 bakiyesi 191'i aşınca farkı taşır. Fark burada alacak yazılır çünkü ödenecek borç doğmuştur.","doldur":[[10,1]]},{"formul":"Ters durum: 191 > 391 → 190 DEVREDEN KDV (BORÇ)","anlatim":"Ters durumda 391 yerine 191 büyük çıksaydı fark devreden KDV olur. O zaman 360 değil 190 DEVREDEN KDV hesabı borçlanırdı.","doldur":[]},{"formul":"Yanlış yol: 1.045.000 - 812.500 = 232.500 (HATALI) → doğrusu 150.000 (6. adımda bulduk)","anlatim":"En sık hata, 812.500'ü doğrudan 391 ile karşılaştırıp 232.500 bulmaktır. Bu yanlıştır çünkü 192 ve 291'den gelen paylar 191'e eklenmeden karşılaştırma yapılamaz.","doldur":[]}],"anahtar":[{"ornek":"indirim","kok":"indiri"},{"ornek":"aktarılan","kok":"aktarı"},{"ornek":"karşılaştırılır","kok":"karşıl"},{"ornek":"paylar","kok":"paylar"},{"ornek":"tutarları","kok":"tutarl"},{"ornek":"ödenecek","kok":"ödenec"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonu KDV mahsup/kapama kaydı yapılırken. Nasıl ölçülür: 191 hesabının dönem içi bakiyesine 192 ve 291'den aktarılan tutarlar eklenip toplam indirilecek KDV bulunarak. Nasıl kaydedilir: 391 Hesaplanan KDV borçlandırılıp, 191 toplam tutarı alacaklandırılır; kalan fark 360 hesabına alacak yazılır.","desen":"Sınav, 192 ve 291'den 191'e aktarılan tutarların dönem içi 191 bakiyesine eklenmesi gerektiğini unutturmaya çalışır; bu iki aktarım kalemi genelde ayrı satırlarda verilip toplanması istenir. Bazı adaylar sadece 191'in kendi bakiyesini 391'den düşer, aktarılan tutarları atlar. Bu soru 192 ve 291'den 191'e aktarım mantığının unutulması noktasından geliyor (p.28).","terimler":[{"kaynak":"soruda verilir","tanim":"Mal/hizmet alımında ödenen, indirim konusu yapılabilecek KDV tutarı","ad":"191 İndirilecek KDV","kim":"Tekdüzen hesap planı"},{"kaynak":"soruda verilir","tanim":"Teşvikli yatırım malı ithalinde ertelenip sonradan indirilebilir hale gelen KDV","ad":"192 Diğer KDV","kim":"Tekdüzen hesap planı"},{"kaynak":"soruda verilir","tanim":"Amortismana tabi kıymetle ilgili bir yıldan uzun sürede indirilebilecek KDV","ad":"291 Gelecek Yıllarda İndirilecek KDV","kim":"Tekdüzen hesap planı"},{"kaynak":"sen hesaplarsın","tanim":"Hesaplanan KDV'den toplam indirilecek KDV düşüldükten sonra kalan ödenecek net tutar","ad":"360 Ödenecek Vergi ve Fonlar","kim":"kanun sabitler"}],"sinavda":"391 Hesaplanan KDV ile 191, 192, 291 hesaplarındaki tutarlar verilir; ay sonu mahsup kaydında 360 hesabına yazılacak alacak tutarı istenir.","panel_ornek":"Bir öğrenci ay içinde kırtasiyeden aldığı defterler için 40 ₺, arkadaşından ikinci el hesap makinesi alırken 15 ₺ KDV ödemiş; ayrıca geçen yıldan devreden 10 ₺'lik indirim hakkı da bu ay kullanılabilir hale gelmiş. Ay sonunda tüm bu tutarları toplayıp, harçlıktan ödediği KDV ile karşılaştırarak ne kadar borcu kaldığını bulur.","ornek":"Bir öğrenci ay içinde kırtasiyeden aldığı defterler için 40 ₺, arkadaşından ikinci el hesap makinesi alırken 15 ₺ KDV ödemiş; ayrıca geçen yıldan devreden 10 ₺'lik indirim hakkı da bu ay kullanılabilir hale gelmiş. Ay sonunda tüm bu tutarları toplayıp, harçlıktan ödediği KDV ile karşılaştırarak ne kadar borcu kaldığını bulur.","yontemler":"Önce 191, 192'den aktarılan ve 291'den aktarılan tutarlar toplanarak toplam indirilecek KDV bulunur; bu toplam Hesaplanan KDV'den (391) çıkarılarak 360'a alacak yazılacak tutar elde edilir.","nedir":"KDV mahsup kaydı, dönem içinde tahsil edilen ve indirilecek KDV tutarlarının netleştirilerek ödenecek ya da devreden tutara ulaşılmasını gösterir. Sınav, hangi hesabın hangi yönde ve hangi tutarla kapatıldığını doğru toplayıp toplayamadığınızı ölçer."},"olay":"812.500+47.350+35.150=895.000; 1.045.000-895.000=150.000.","tuzak":{"C":{"ad":"192 Aktarımını Atlama Tuzağı","metin":"192'den 191'e aktarılan 47.350'yi unutup 812.500+35.150=847.650'yi 191 toplamı sandın. Doğrusu: 192'den gelen 47.350 de 191'e dahildir, ödenecek KDV 150.000'dir."},"E":{"ad":"Yön Karıştırma Tuzağı","metin":"192 hesabından 191'e aktarımın 191'i azalttığını (alacak yönlü) sandın. Doğrusu: Tekdüzen Hesap Planı 192 işleyişine göre bu aktarım 191'e BORÇ, yani artış yönündedir."},"D":{"ad":"Kapsam Daraltma Tuzağı","metin":"191 hesabının yalnız dönem içi alışlardan oluştuğunu düşünüp 192 ve 291'den gelen aktarımların ikisini de gözden kaçırdın. Doğrusu: 191 toplamı 895.000 olup ödenecek KDV 150.000'dir."},"B":{"ad":"291 Aktarımını Atlama Tuzağı","metin":"291'den 191'e aktarılan 35.150'yi hesaba katmayı unutup yalnız 812.500+47.350=859.850'yi 191 toplamı sandın. Doğrusu: 291'den gelen 35.150 de 191'e dahildir, ödenecek KDV 150.000'dir."}},"celdiriciYol":{"C":"1.045.000-(812.500+35.150)=197.350 (192 aktarımını unuttun)","E":"1.045.000-(812.500-47.350+35.150)=244.700 (192 aktarımını ters yönde işledin)","D":"1.045.000-812.500=232.500 (191 hesabını yalnız dönem içi alışlarla sınırlı tuttun)","B":"1.045.000-(812.500+47.350)=185.150 (291 aktarımını unuttun)"},"hap":"Ay sonu KDV mahsubunda 191 hesabının toplamı yalnız dönem içi alışları değil, 192 ve 291'den o ay indirim hakkı doğan aktarılan tutarları da kapsar.","teshis":{"C":{"gercek":"THP 192 işleyişi, ertelenen KDV'nin fiilen indirilmesi mümkün olduğunda 191 hesabına aktarılacağını öngörür.","ayirt":"192'den 191'e aktarılan 47.350'yi toplama dahil ettim mi?","paragraf":"THP 192 işleyiş hükmü","yanilgi":"192 hesabındaki teşvikli yatırım malı KDV'sinin ithalat aşamasında kaldığını, indirim hakkı doğsa da 191'e geçmediğini sanıyorsun."},"E":{"gercek":"THP 192 işleyişi bu aktarımın 191 hesabına BORÇ kaydedileceğini açıkça belirtir; 191 artar, azalmaz.","ayirt":"Aktarım kaydının 191'de borç mu alacak mı olduğunu hesap işleyişinden kontrol ettim mi?","paragraf":"THP 192 işleyiş hükmü","yanilgi":"192'den 191'e aktarımın 191'i azaltan bir işlem olduğunu, yani alacak kaydı gibi çalıştığını sanıyorsun."},"A":{"gercek":"THP 191 işleyişi, indirim hakkı doğan her tutarın (192, 291 dahil) 191'e borç kaydedilmesini öngörür; mahsup bu nihai bakiyeyle yapılır.","ayirt":"191 hesabının o ayki nihai toplamına giren TÜM kalemleri saydım mı?","paragraf":"THP 191/192/291 işleyiş hükümleri","yanilgi":"Bu şıkkı eleyen öğrenci, 192 ve 291'den gelen aktarımların ay sonu mahsuba dahil olmadığını düşünür."},"D":{"gercek":"THP 191 hesabına yalnız alışlardan değil, 192 ve 291'den yapılan aktarımlardan da borç kaydı gelir.","ayirt":"191 hesabına başka hesaplardan aktarım geldi mi diye kontrol ettim mi?","paragraf":"THP 191/192/291 işleyiş hükümleri","yanilgi":"191 hesabının yalnızca cari ay alış faturalarından oluştuğunu, diğer hesaplardan aktarım gelemeyeceğini düşünüyorsun."},"B":{"gercek":"THP 291 işleyişi, indirilebilme dönemine isabet eden tutarın bilanço dönemi sonunda 191 hesabına aktarılacağını belirtir.","ayirt":"291'den bu ay indirilebilir hale gelen tutarı 191'e eklemeyi unuttum mu?","paragraf":"THP 291 işleyiş hükmü","yanilgi":"291 hesabındaki amortismana tabi kıymet KDV'sinin ay sonu mahsubuyla ilgisiz, ayrı bir kalem olduğunu sanıyorsun."}},"verilen":[[6,1],[7,1],[9,1],[1,1],[2,1],[3,1],[4,1]],"donem":14,"hesaplar":{"191":{"ad":"İNDİRİLECEK KDV","tanim":"Her türlü mal ve hizmetin satın alınması sırasında satıcılara ödenen katma değer vergisinin kaydedildiği ve izlendiği hesaptır. İşleyişi: Mal ve hizmet alımlarında indirilecek katma değer vergisi bu hesaba borç, mevzuat gereği yapılabilecek indirimler ve hesaba yapılan düzeltmeler alacak kaydedilir."},"360":{"ad":"ÖDENECEK VERGİ VE FONLAR","tanim":"İşletmenin ekonomik faaliyetlerde bulunmasının sonucu ilgili mali mevzuat uyarınca mükellef veya sorumlu sıfatıyla işletmenin kendisine, personeline ve üçüncü kişilere ilişkin olarak ödenmesi gereken vergi, resim, harç ve fonların izlendiği hesaptır."},"391":{"ad":"HESAPLANAN KDV","tanim":"Bu hesap; teslim edilen mal veya ifa edilen hizmetler üzerinden hesaplanan Katma Değer Vergisi ile işlemi gerçekleşmeyen ya da işlemden vazgeçilen mal ve hizmetlere ilişkin katma değer vergisinin izlendiği hesaptır. İşleyişi: Hesaplanan Katma Değer Vergisi bu hesaba alacak kaydedilir. Düzeltmeler bu hesaba borç kaydedilir."}}},{"capa":null,"kural":"Net satışlar eksi satılan malın maliyeti brüt satış kârına eşittir; satılan malın maliyeti dönem başı stok artı net alışlar eksi dönem sonu stok formülünden alışlar ters çözülür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/2 ders 03 Soru 8","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ters sorularda önce hangi büyüklüğün isteneceğini belirle, sonra formülü o değişken için yeniden düzenle.","konu":"satışların maliyeti tablosu","tablo":{"satirlar":[["VERİLENLER","-"],["Brüt satışlar","685.000 ₺"],["Satıştan iadeler","12.500 ₺"],["Satış iskontoları","8.700 ₺"],["Dönem başı ticari mal stoku","47.350 ₺"],["Dönem sonu ticari mal stoku","39.900 ₺"],["Pazarlama ve genel yönetim gideri","65.200 ₺"],["Finansman gideri","21.400 ₺"],["Brüt satış kârı","210.150 ₺"],["HESAP","-"],["Net Satışlar (685.000-12.500-8.700)","663.800"],["Satılan Ticari Malların Maliyeti (663.800-210.150)","453.650"],["Dönem İçi Net Alışlar (453.650-47.350+39.900)","446.200"]],"basliklar":["Kalem","Tutar (₺)"]},"siklar":{"C":"454.900","E":"467.400","A":"202.700","D":"461.100","B":"446.200"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Brüt satış kârı hesaplama ve gelir tablosu akışı (net satışlar, satışların maliyeti, brüt satış kârı, faaliyet kârı)","metin":"TEORİ/TEKNİK (finansal muhasebe; Tekdüzen Muhasebe Sistemi gelir tablosu düzeni ve 6. sınıf hesaplar). KURAL: Gelir tablosu kademeli kurulur. BRÜT SATIŞLAR (600 Yurt İçi Satışlar + 601 Yurt Dışı Satışlar + 602 Diğer Gelirler) − SATIŞ İNDİRİMLERİ (610 Satıştan İadeler + 611 Satış İskontoları + 612 Diğer İndirimler) = NET SATIŞLAR. NET SATIŞLAR − SATIŞLARIN MALİYETİ (620 Satılan Mamuller Maliyeti, 621 Satılan Ticari Mallar Maliyeti, 622 Satılan Hizmet Maliyeti, 623 Diğer Satışların Maliyeti) = BRÜT SATIŞ KÂRI (veya zararı). BRÜT SATIŞ KÂRI − FAALİYET GİDERLERİ (630 Araştırma Geliştirme, 631 Pazarlama Satış Dağıtım, 632 Genel Yönetim) = FAALİYET KÂRI. FAALİYET KÂRI + Diğer Faaliyetlerden Olağan Gelir ve Kârlar (64 grubu) − Diğer Faaliyetlerden Olağan Gider ve Zararlar (65 grubu) − Finansman Giderleri (66 grubu) = OLAĞAN KÂR. + Olağandışı Gelir ve Kârlar (67) − Olağandışı Gider ve Zararlar (68) = DÖNEM KÂRI. − Vergi ve yasal yükümlülük karşılıkları = DÖNEM NET KÂRI. Satılan ticari malların maliyeti (aralıklı envanter): Dönem başı stok + Dönem içi net alışlar − Dönem sonu stok. BRÜT SATIŞ KÂRI DEĞİŞİMİ: Satış fiyatı, satış miktarı ya da birim maliyet değişince brüt kâr değişir; kârlılık oranı = brüt satış kârı / net satışlar. ÖRNEK: Brüt satışlar 800.000; satıştan iadeler 20.000; satış iskontoları 30.000 → Net satışlar 750.000. Dönem başı stok 100.000 + alışlar 500.000 − dönem sonu stok 150.000 = satılan malın maliyeti 450.000 → Brüt satış kârı 300.000. Faaliyet giderleri 120.000 → Faaliyet kârı 180.000. Brüt kâr oranı 300.000 / 750.000 = %40. SINAV TUZAĞI: (1) Brüt satış kârı N…"},{"ad":"TEORI - Safha maliyet sisteminde maliyet dağıtım tablosu: miktar dengesi, eşdeğer birim, birim maliyet ve maliyet dağıtımı basamakları; ağırlıklı ortalama ile ilk giren ilk çıkar karşılaştırması","metin":"TEORİ (Maliyet Muhasebesi; MSUGT Sıra No:1 Tekdüzen Hesap Planı 151 Yarı Mamuller-Üretim, 152 Mamuller; ders kitabı kuralı). TANIM: Safha (evre) maliyet sistemi, birbirinin aynı ürünlerin kesintisiz üretildiği işletmelerde kullanılır; maliyet siparişe değil SAFHAYA toplanır ve safhanın toplam maliyeti o safhadan geçen eşdeğer birim sayısına bölünür. BASAMAK 1 - MİKTAR DENGESİ: Dönem başı yarı mamul + üretime başlanan = tamamlanıp sonraki safhaya gönderilen + dönem sonu yarı mamul. Bu denge kurulmadan eşdeğer birim hesaplanmaz; sınavda dönem sonu yarı mamul çoğu kez bu dengeden bulunur. BASAMAK 2 - EŞDEĞER BİRİM: Her maliyet unsuru için ayrı hesaplanır, çünkü tamamlanma dereceleri farklıdır. Direkt ilk madde genellikle safha başında verildiği için yarı mamullerde yüzde 100, şekillendirme (dönüştürme) maliyeti ise ilerledikçe eklendiği için kısmi sayılır. AĞIRLIKLI ORTALAMADA eşdeğer birim = tamamlanan + dönem sonu yarı mamul × tamamlanma yüzdesi; dönem başı yarı mamul tamamlananların içinde TAM sayılır ve geçen dönem yapılmış işi ayrıştırılmaz. İLK GİREN İLK ÇIKARDA (ilk giren ilk çıkar (FIFO)) eşdeğer birim = dönem başı yarı mamulün TAMAMLANMASI için kalan yüzde + bu dönem başlanıp tamamlanan + dönem sonu yarı mamul × tamamlanma yüzdesi; yalnız bu dönem yapılan iş sayılır. İki yöntemin eşdeğer birim farkı, dönem başı yarı mamulün geçen dönem yapılmış işine eşittir. BASAMAK 3 - BİRİM MALİYET: Ağırlıklı ortalamada birim maliyet = (dönem başı yarı mamul maliyeti + dönem maliyeti) / eşdeğer birim; ilk giren ilk çıkar yönteminde birim maliyet = YALNIZ dönem maliyeti / eşdeğer birim, devreden maliyet paya girmez. BASAMAK 4 …"}],"hakem":"Soru Brüt satış kârı formülü (Net satışlar − Satışların maliyeti = Brüt satış kârı) ve satılan ticari malların maliyeti formülünün (Dönem başı stok + Net alışlar − Dönem sonu stok) uygulanmasını ölçmektedir; her iki kural kaynak metinde açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Satış iskontosunu hesaplamaya almayıp brüt satışları net satış gibi kullanırsan, net satışları yüksek bulursun ve bu da satılan malın maliyetini ve alışları düşük hesaplamanı sağlar. Net satışlar, brüt satışlardan hem iadeler hem iskontolar eksiği ile bulunmalıdır.","E":"Satış indirimlerini hiç düşmeyip brüt satışları net satış olarak işleme aldığında, satılan malın maliyetini ve buradan alışları yüksek bulursun. Net satışlar brüt satışlardan satıştan iadeler ve iskontolar düşülerek elde edilir.","D":"Dönem başında stokun az, dönem sonunda çoksa bu yanılsam; dönem başı stoğun maliyete eklenmesi, dönem sonunun çıkarılması gerekir çünkü dönem sonu stok satılmamıştır. Yanlış sıra kullanmak alışları yanlış hesaplamaya yönlendirir.","A":"Brüt satış kârını doğrudan satılan malın maliyeti sandığında, alışları hemen bu kârdan çıkarmış olursun. Yapılması gereken: önce net satışlardan brüt kârı çıkartıp satılan malın maliyetini, ardından stok formülünü uygulamaktır."},"dogru":"Net satışları bulmak için brüt satışlardan iadeler ve iskontolar çıkarılır (663.800 ₺). Sonra bu net satışlardan brüt satış kârı çıkarılarak satılan malın maliyeti bulunur (453.650 ₺). Son olarak satılan malın maliyet formülünden alışlar ters çözülür: dönem başı stok artı alışlar eksi dönem sonu stok eşittir satılan maliyet; buradan alışlar 446.200 ₺ çıkar.","sinav":"Brüt satış kârı net satışlardan hesaplanır ve satılan ticari malların maliyeti dönem başı stok artı dönem içi net alışlar eksi dönem sonu stoktan bulunur.","kavramlar":[{"kaynak":"TEORI","tanim":"Brüt satışlardan satıştan iadeler, satış iskontoları ve diğer indirimler düşülerek bulunan satış geliridir.","ad":"Net satışlar"},{"kaynak":"TEORI","tanim":"Dönem içinde satılan ticari malların maliyetidir; dönem başı stok artı dönem içi net alışlar eksi dönem sonu stok formülü ile hesaplanır.","ad":"Satılan ticari malların maliyeti"},{"kaynak":"TEORI","tanim":"Net satışlardan satışların maliyeti çıkartılarak bulunan kârdır ve faaliyet giderleri hesaplanmadan önceki kârda bulunur.","ad":"Brüt satış kârı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":11,"ornekler":[],"donemler":["2026/2","2019/1","2016/3","2014/3","2014/2","2014/1","2013/3","2012/3","2011/2","2009/1","2008/2","2008/1"]},"oyun":{"bosluk":[[2,1]],"tablo":{"basliklar":["Kalem","Tutar (₺)"],"satirlar":[["Net Satışlar (720.000-15.000-9.400)","695.600"],["Satılan Ticari Malların Maliyeti (695.600-225.300)","470.300"],["Dönem İçi Net Alışlar (470.300-52.400+41.500)","459.400"]]},"tur":"tablo","soru":"İşletme, dönem içinde 720.000 ₺ brüt satış gerçekleştirmiştir; satıştan iadeler 15.000 ₺, satış iskontoları 9.400 ₺'dir. Ticari mal dönem başı stoku 52.400 ₺, dönem sonu stoku 41.500 ₺'dir. Ayrıca dönem içinde 58.700 ₺ pazarlama ve genel yönetim gideri, 19.800 ₺ finansman gideri gerçekleşmiştir. Brüt satış kârı 225.300 ₺ olarak hesaplanmıştır. Bu bilgilere göre dönem içi net alışlar tutarı kaç ₺'dir?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve dönem içi net alışlar tutarının kaç ₺ olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, dönem içinde 685.000 ₺ brüt satış gerçekleştirmiştir; satıştan iadeler 12.500 ₺, satış iskontoları 8.700 ₺'dir. Ticari mal dönem başı stoku 47.350 ₺, dönem sonu stoku 39.900 ₺'dir. Ayrıca dönem içinde 65.200 ₺ pazarlama ve genel yönetim gideri, 21.400 ₺ finansman gideri gerçekleşmiştir. Brüt satış kârı 210.150 ₺ olarak hesaplanmıştır. Bu bilgilere göre dönem içi net alışlar tutarı kaç ₺'dir?","kayitBaslik":"","id":"smmm-4k-a-maliyet-cokzor-r9/kp-01","verilenler":[{"deger":"685.000 ₺","anlam":"Net satışlar hesabının başlangıç tutarı, indirimler bundan düşülür.","ad":"Brüt satışlar"},{"deger":"12.500 ₺","anlam":"Net satışlar hesaplanırken brüt satışlardan düşülen bir satış indirimi kalemi.","ad":"Satıştan iadeler"},{"deger":"8.700 ₺","anlam":"Net satışlar hesaplanırken brüt satışlardan düşülen ikinci satış indirimi kalemi.","ad":"Satış iskontoları"},{"deger":"47.350 ₺","anlam":"Satılan malın maliyeti formülüne eklenen başlangıç stok tutarı.","ad":"Dönem başı ticari mal stoku"},{"deger":"39.900 ₺","anlam":"Satılan malın maliyeti formülünden çıkarılan dönem sonu stok tutarı.","ad":"Dönem sonu ticari mal stoku"},{"deger":"65.200 ₺","anlam":"Faaliyet giderleridir; satışların maliyeti tablosuna ve bu hesaplamaya dahil değildir.","ad":"Pazarlama ve genel yönetim gideri"},{"deger":"21.400 ₺","anlam":"Faaliyet kârından sonra düşülür; satılan malın maliyeti hesaplamasına dahil değildir.","ad":"Finansman gideri"},{"deger":"210.150 ₺","anlam":"Net satışlar ile satılan malın maliyeti arasındaki farktır; sorudaki bilinen sonuç değeridir.","ad":"Brüt satış kârı"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı - Gelir Tablosu Düzeni (600-623 hesap grupları)","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Brüt satış 685.000 (soruda verilen); Satıştan iadeler 12.500 (soruda verilen); Satış iskontoları 8.700 (soruda verilen); Dönem başı stok 47.350 (soruda verilen); Dönem sonu stok 39.900 (soruda verilen); Brüt satış kârı 210.150 (soruda verilen)","anlatim":"Soru bize şunları vermiş: brüt satış 685.000, iadeler 12.500, iskontolar 8.700. Ayrıca dönem başı stok 47.350, dönem sonu stok 39.900 ve brüt satış kârı 210.150 verilmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]]},{"formul":"Net Satışlar = Brüt Satış − İadeler − İskontolar = 685.000 (soruda verilen) − 12.500 (soruda verilen) − 8.700 (soruda verilen) = 663.800 ₺","anlatim":"Net satışlar nedir? Brüt satıştan iade ve iskontoları çıkarınca müşteriye kalan gerçek satış tutarı bulunur.","doldur":[[10,1]]},{"formul":"Satılan Malların Maliyeti = Net Satışlar − Brüt Satış Kârı = 663.800 (2. adımda bulduk) − 210.150 (soruda verilen) = 453.650 ₺","anlatim":"Satılan ticari malların maliyeti nedir? Net satışlardan brüt kârı çıkarırsak satılan malın maliyetine ulaşırız, çünkü brüt kâr bu ikisinin farkıdır.","doldur":[[11,1]]},{"formul":"Net Alışlar = Satılan Malların Maliyeti − Dönem Başı Stok + Dönem Sonu Stok = 453.650 (3. adımda bulduk) − 47.350 (soruda verilen) + 39.900 (soruda verilen) = 446.200 ₺","anlatim":"Şimdi biz hesaplıyoruz: satılan malın maliyeti formülünü tersten çözüp net alışları buluyoruz. Formül dönem başı stok artı net alışlar eksi dönem sonu stok şeklindeydi.","doldur":[[12,1]]},{"formul":"Dönem İçi Net Alışlar = 446.200 ₺ (4. adımda bulduk)","anlatim":"Sonuç: dönem içi net alışlar tutarı 446.200 ₺ çıktı. Bu, işletmenin dönem içinde ticari mal için yaptığı toplam alış tutarıdır.","doldur":[]},{"formul":"Ters durum: net alışlar verilseydi → Satılan Malların Maliyeti = Dönem Başı Stok + Net Alışlar − Dönem Sonu Stok","anlatim":"Ters durumda: soru net alışlar verip brüt kârı sorsaydı, aynı formülü ileri yönde kurup satılan maliyeti önce bulman gerekirdi.","doldur":[]},{"formul":"Yanlış yol: 453.650 − 65.200 − 21.400 = 367.050 (HATALI) → doğrusu 446.200 (4. adımda bulduk)","anlatim":"En sık hata: pazarlama gideri 65.200 ve finansman gideri 21.400'ü hesaba katıp net alışları farklı çıkarmak. Bu giderler brüt kâr hesabına girmez, faaliyet giderleridir.","doldur":[]}],"anahtar":[{"ornek":"satılan","kok":"satıla"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"alışlar","kok":"alışla"},{"ornek":"formülü","kok":"formül"},{"ornek":"satışlardan","kok":"satışl"},{"ornek":"ticari","kok":"ticari"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu kalemleri verilip brüt kâr veya net alış gibi bir ara değer istendiğinde test edilir. Nasıl ölçülür: net satışlar, satılan malın maliyeti ve brüt satış kârı arasındaki ters işlem kurulup kurulamadığına bakılır. Nasıl kaydedilir: sonuç yalnız istenen tek tutar olarak, ara işlemler gösterilmeden yazılır.","desen":"Sınav çoğunlukla brüt kârı ya da stok kalemlerinden birini vererek net alışları geriye dönük buldurur; tuzak faaliyet giderlerinin veya finansman giderinin bu hesaba karıştırılmasıdır (p.28). İkinci tuzak, dönem sonu stokun büyüklüğünün maliyeti nasıl etkilediğinin gözden kaçırılmasıdır. Bu soru brüt satış kârından geriye giderek satılan malın maliyeti ve net alışların bulunması noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Brüt satışlardan iade ve iskonto gibi indirimler düşüldükten sonra kalan tutar","ad":"Net satışlar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönem başı stok ile net alışlar toplamından dönem sonu stok çıkarılarak bulunan tutar","ad":"Satılan ticari mal maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönem başı ve dönem sonu stok ile satılan malın maliyeti arasındaki ilişkiden geriye dönük bulunan alış tutarı","ad":"Dönem içi net alışlar","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Net satışlardan satılan malın maliyeti düşüldükten sonra kalan kâr","ad":"Brüt satış kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Brüt satışlar, indirimler, dönem başı-sonu stok ve brüt satış kârı verilir; dönem içi net alışlar tutarı istenir.","panel_ornek":"İkinci el bir telefon satıcısı düşün: elinde 10 adet dönem başı telefon var, dönem içinde 40 adet daha alıyor, dönem sonunda elinde 6 adet kaldı; satılan telefon sayısı 10+40-6=44'tür. Aynı mantıkla stok tutarları üzerinden satılan malın maliyeti bulunur, kargo ya da mağaza kirası gibi giderler bu hesaba girmez.","ornek":"İkinci el bir telefon satıcısı düşün: elinde 10 adet dönem başı telefon var, dönem içinde 40 adet daha alıyor, dönem sonunda elinde 6 adet kaldı; satılan telefon sayısı 10+40-6=44'tür. Aynı mantıkla stok tutarları üzerinden satılan malın maliyeti bulunur, kargo ya da mağaza kirası gibi giderler bu hesaba girmez.","yontemler":"Önce net satışlar bulunur, brüt kârdan satılan malın maliyeti geriye dönük hesaplanır; sonra stok dengesinden net alışlara ulaşılır. Pazarlama, genel yönetim ve finansman giderleri bu hesaplamaya hiç dahil edilmez.","nedir":"Satışların maliyeti tablosu, net satışlardan brüt satış kârına giderken satılan malın maliyetinin nasıl bulunduğunu gösteren gelir tablosu basamağıdır. Sınav bu basamakta hangi kalemin hangi tutara girip girmediğini ölçer."},"olay":"Net satışlar 663.800 eksi Brüt kâr 210.150 eşittir Satılan maliyet 453.650; 453.650 eksi 47.350 artı 39.900 eşittir 446.200.","tuzak":{"C":{"ad":"İskonto Atlama Tuzağı","metin":"Satış iskontosunu net satışlar hesaplamasına dahil etmeyi unuttun. Doğrusu: Net satışlar, brüt satışlardan hem iadeler hem iskontolar düşülerek bulunur."},"E":{"ad":"Net Satış Atlama Tuzağı","metin":"Satış indirimlerini hiç düşmeyip brüt satışları net satış olarak kullandın. Doğrusu: Net satışlar brüt satışlardan satıştan iadeler ve iskontolar düşülerek hesaplanır."},"D":{"ad":"Stok Karıştırma Tuzağı","metin":"Dönem başı ve dönem sonu ticari mal stoklarını birbirinin yerine kullandın. Doğrusu: Dönem sonu stok maliyetten çıkarılır, dönem başı stok maliyete eklenir."},"A":{"ad":"Brüt Kârı Maliyet Sanma Tuzağı","metin":"Brüt satış kârını doğrudan satılan ticari malların maliyeti gibi kullanıp alışları buldun. Doğrusu: Önce net satışlardan brüt kâr çıkarılarak satılan maliyet bulunmalıdır."}},"celdiriciYol":{"C":"685.000 - 12.500 - 210.150 = 462.350; 462.350 - 47.350 + 39.900 = 454.900 (satış iskontosunu net satışlardan düşmeyi unuttun)","E":"685.000 - 210.150 = 474.850; 474.850 - 47.350 + 39.900 = 467.400 (satış indirimlerini net satışlar hesabına dahil etmedin, brüt satışları net satış saydın)","D":"453.650 - 39.900 + 47.350 = 461.100 (dönem başı ve dönem sonu stok tutarlarını birbirine karıştırdın)","A":"210.150 - 47.350 + 39.900 = 202.700 (brüt satış kârını satılan ticari malların maliyeti sandın)"},"hap":"Brüt satış kârı net satışlardan hesaplanır; satılan malın maliyeti formülü ters çözülerek alış tutarına ulaşılabilir.","teshis":{"C":{"gercek":"Net satışlar hesaplanırken 610 Satıştan İadeler ile 611 Satış İskontoları birlikte brüt satışlardan düşülür.","ayirt":"Brüt satışlardan hem iade hem iskonto düştüm mü?","paragraf":"THP 610-611","yanilgi":"Satış iskontosunun net satışları etkilemediğini, sadece iadelerin düşüldüğünü sanıyorsun."},"E":{"gercek":"Net satışlar eşittir brüt satışlar eksi satış indirimleri; bu adım atlanınca sonraki tüm katmanlar hatalı çıkar.","ayirt":"Brüt satışlardan indirimleri düştüm mü?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Brüt satışların doğrudan net satış olduğunu, indirimlerin ihmal edilebileceğini düşünüyorsun."},"A":{"gercek":"Brüt satış kârı net satışlardan satılan malın maliyeti çıkarılarak bulunur; ikisi ayrı katmandır.","ayirt":"Bu tutar net satışlardan mı çıkarıldı, yoksa doğrudan mı kullandım?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Brüt satış kârının satılan malın maliyetiyle aynı şey olduğunu düşünüyorsun."},"D":{"gercek":"Satılan malın maliyeti formülünde dönem başı stok eklenir, dönem sonu stok çıkarılır; sıra değişmez.","ayirt":"Hangi stok eklendi, hangisi çıkarıldı, yönlerini kontrol ettim mi?","paragraf":"MSUGT 153","yanilgi":"Dönem başı ve dönem sonu stokun formülde birbirinin yerine geçebileceğini düşünüyorsun."},"B":{"gercek":"Satılan malın maliyeti formülü tersine çözülerek net alışlar bulunabilir; bu safha maliyet dağıtım mantığının aynısıdır.","ayirt":"Denklemi ileri değil ters yönde kurdum mu?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Bu şıkkı eleyen öğrenci, brüt satış kârından geriye doğru alış tutarına ulaşmanın mümkün olmadığını düşünür."}},"verilen":[[10,1],[11,1],[12,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]],"donem":11,"hesaplar":{}},{"capa":null,"kural":"nakit taahhüt edilen 150.000 TL'lik kısım nominal değerle 501 hesabı kapatır, %30 fazlasının doğurduğu fark 520 Hisse Senedi İhraç Primleri hesabına alacak yazılır; yedeklerden gelen 50.000 TL bu ödemeye dahil değildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 38","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"195.000","taraf":"B","hesap":"102 BANKALAR"},{"tutar":"150.000","taraf":"A","hesap":"501 ÖDENMEMİŞ SERMAYE"},{"tutar":"45.000","taraf":"A","hesap":"520 HİSSE SENEDİ İHRAÇ PRİMLERİ"}],"teori":false,"taktik":"Soruda birden fazla kaynak (nakit + yedek) varsa önce hangi tutarın gerçekten bankaya girdiğini ayır, primi yalnız o kısım üzerinden hesapla.","konu":"sermaye artirimi","tablo":{"satirlar":[["VERİLENLER","-"],["Toplam nominal artırım","200.000 TL"],["Nakit karşılığı taahhüt edilen kısım","150.000 TL"],["Yedeklerden karşılanan kısım","50.000 TL"],["İhraç fazlası oranı","%30"],["HESAP","-"],["Nakit karşılığı taahhüt edilen nominal tutar","150.000"],["İhraç bedeli (150.000 x 1,30)","195.000"],["Hisse Senedi İhraç Primi (195.000 - 150.000)","45.000"],["Sonuç: Bankalar 195.000 borç; Ödenmemiş Sermaye 150.000 ve Hisse Senedi İhraç Primleri 45.000 alacak","195.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"102 Bankalar hesabı 260.000 TL borçlandırılır; 501 Ödenmemiş Sermaye hesabı 200.000 TL, 520 Hisse Senedi İhraç Primleri hesabı 60.000 TL alacaklandırılır.","E":"102 Bankalar hesabı 195.000 TL borçlandırılır; 501 Ödenmemiş Sermaye hesabı 150.000 TL, 520 Hisse Senedi İhraç Primleri hesabı 45.000 TL alacaklandırılır.","A":"501 Ödenmemiş Sermaye hesabı 150.000 TL, 520 Hisse Senedi İhraç Primleri hesabı 45.000 TL borçlandırılır; 102 Bankalar hesabı 195.000 TL alacaklandırılır.","D":"102 Bankalar hesabı 195.000 TL borçlandırılır; 501 Ödenmemiş Sermaye hesabı 195.000 TL alacaklandırılır.","B":"102 Bankalar hesabı 195.000 TL borçlandırılır; 500 Sermaye hesabı 195.000 TL alacaklandırılır."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Yedeklerden karşılanan 50.000 TL'yi de nakit sermaye taahhüdüne dahil edilmiş, toplamda 200.000 TL üzerinden prim hesaplanmıştır. Yedeklerden artırımda banka hareketi olmaz, prim yalnız nakit taahhüt kısmı üzerinden hesaplanır.","A":"Borç ve alacak tarafları ters yazılmıştır. Bankaya para girdiye (borç) karşı, sermaye taahhüdü ve prim hesapları kapatılır (alacak).","D":"İhraç priminin ayrı hesapta izlenmemesi hatası yapılmış; 195.000 TL'nin tamamı 501 Ödenmemiş Sermaye hesabına yazılmıştır. Oysa 501 yalnız nominal 150.000 TL kapanır, 45.000 TL nominal üstü kısım 520 hesabına alacak yazılır.","B":"İhraç primi ayrı izlenmemiş, tüm 195.000 TL'lik tutarın 500 Sermaya hesabına yazılmasıdır. Oysa 500 hesabı yalnız nominal 150.000 TL değerini taşır; 45.000 TL farkı 520 hesabına gider."},"dogru":"Nakit taahhüt edilen 150.000 TL, nominal değerinin %30 fazlasıyla (195.000 TL) ihraç edildi. Bankaya giren 195.000 TL'den 150.000 TL nominal sermaye, kalan 45.000 TL ise ihraç primisidir. Yedeklerden karşılanan 50.000 TL'nin banka hareketi yoktur.","sinav":"Hisse senetlerinin nominal değerden fazla bedelle ihraç edilmesi durumunda farkın Tekdüzen Hesap Planı 520 Hisse Senedi İhraç Primleri hesabında izlenmesi.","kavramlar":[{"kaynak":"Tekdüzen Hesap Planı 501","tanim":"Ortaklarca taahhüt edilen ancak henüz ödenmemiş sermayenin izlendiği, özkaynak ayarlaması yapan (eksi) hesap.","ad":"Ödenmemiş Sermaye"},{"kaynak":"Tekdüzen Hesap Planı 520","tanim":"Hisse senetlerinin nominal değerinden yüksek bedelle satılması sonucu ortaya çıkan fark; sermaye yedekleri içinde izlenir.","ad":"Hisse Senedi İhraç Primleri"},{"kaynak":"Teori Notu","tanim":"Ortaklardan veya yeni yatırımcılardan nakit karşılığı alınarak yapılan sermaye artırımı; şirkete dışarıdan kaynak girişi sağlar.","ad":"Bedelli Sermaye Artırımı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Nakit karşılığı taahhüt edilen nominal tutar","220.000"],["İhraç bedeli (220.000 x 1,20)","264.000"],["Hisse Senedi İhraç Primi (264.000 - 220.000)","44.000"],["Sonuç: Bankalar 264.000 borç; Ödenmemiş Sermaye 220.000 ve Hisse Senedi İhraç Primleri 44.000 alacak","264.000"]]},"tur":"tablo","soru":"Bir işletmenin 300.000 TL nominal değerli sermaye artırımının 220.000 TL'lik kısmı nakit karşılığı ortaklara taahhüt ettirilmiş, kalan 80.000 TL ise yasal yedeklerden karşılanmıştır. Nakit taahhüt edilen kısım, nominal değerinin %20 fazlasıyla ihraç edilmiş ve tutarın tamamı bankaya yatırılmıştır. Buna göre bankaya yatırma işlemine ilişkin muhasebe kaydıyla ilgili aşağıdakilerden hangisi doğrudur?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve bankaya yatırma kaydında Bankalar hesabının kaç TL borçlandırılacağını bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir işletmenin 200.000 TL nominal değerli sermaye artırımının 150.000 TL'lik kısmı nakit karşılığı ortaklara taahhüt ettirilmiş, kalan 50.000 TL ise yasal yedeklerden karşılanmıştır. Nakit taahhüt edilen kısım, nominal değerinin %30 fazlasıyla ihraç edilmiş ve tutarın tamamı bankaya yatırılmıştır. Buna göre bankaya yatırma işlemine ilişkin muhasebe kaydıyla ilgili aşağıdakilerden hangisi doğrudur?","kayitBaslik":"1) Nakit taahhüdün bankaya yatırılması","id":"sgs-p-fmuh-cokzor-r2/kp-02","verilenler":[{"deger":"200.000 TL","anlam":"Sermaye artırımının toplam nominal (itibari) değeri; 500 Sermaye hesabının nihai artış tutarı.","ad":"Toplam nominal artırım"},{"deger":"150.000 TL","anlam":"Ortaklardan nakit alınacak nominal tutar; ihraç priminin hesaplanacağı taban.","ad":"Nakit karşılığı taahhüt edilen kısım"},{"deger":"50.000 TL","anlam":"İç kaynaktan (yasal yedeklerden) sermayeye eklenen tutar; banka hareketi doğurmaz, sorulan kayda dahil değildir.","ad":"Yedeklerden karşılanan kısım"},{"deger":"%30","anlam":"Nakit kısmın nominal değerin üzerinde satıldığı oran; ihraç primi bu oranla nominal tutar çarpılarak bulunur.","ad":"İhraç fazlası oranı"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı 500-501-520 hesap işleyişi; Türk Ticaret Kanunu sermaye artırımı hükümleri","dogru":"E","oyunBonus":{"soru":"Bir işletmenin 400.000 TL nominal değerli sermaye artırımının 300.000 TL'lik kısmı nakit karşılığı ortaklara taahhüt ettirilmiş, kalan 100.000 TL ise yasal yedeklerden karşılanmıştır. Nakit taahhüt edilen kısım, nominal değerinin %30 fazlasıyla ihraç edilmiş ve tutarın tamamı bankaya yatırılmıştır. Buna göre bankaya yatırma işlemine ilişkin muhasebe kaydıyla ilgili aşağıdakilerden hangisi doğrudur?","tur":"olcek","kayit":[{"tutar":"390.000","taraf":"B","hesap":"102 BANKALAR"},{"tutar":"300.000","taraf":"A","hesap":"501 ÖDENMEMİŞ SERMAYE"},{"tutar":"90.000","taraf":"A","hesap":"520 HİSSE SENEDİ İHRAÇ PRİMLERİ"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Nakit taahhüt edilen nominal tutar 150.000 TL (soruda verilen); İhraç primi oranı %30 (soruda verilen); Yedeklerden karşılanan 50.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: sermaye artırımı 200.000 TL, nakit taahhüt edilen kısım 150.000 TL (soruda verilen), yasal yedekten karşılanan 50.000 TL, ihraç oranı nominalin %30 fazlası.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[6,1]]},{"formul":"501 ÖDENMEMİŞ SERMAYE = taahhüt edilen ama ödenmemiş kısım","anlatim":"501 Ödenmemiş Sermaye, ortakların henüz ödemediği taahhüt tutarını tutar. Ödeme geldikçe bu hesap alacak çalışır ve kapanır.","doldur":[]},{"formul":"İhraç Bedeli = Nakit Taahhüt Edilen Tutar × %130 = 150.000 (soruda verilen) × %130 = 195.000","anlatim":"Şimdi ihraç bedelini hesaplıyoruz: nakit taahhüt edilen kısım nominalin %30 fazlasıyla satılıyor. Bu yüzden 150.000'i 1,30 ile çarpıyoruz.","doldur":[[7,1]]},{"formul":"Hisse Senedi İhraç Primi = İhraç Bedeli − Nominal Tutar = 195.000 (3. adımda bulduk) − 150.000 (soruda verilen) = 45.000","anlatim":"520 Hisse Senedi İhraç Primleri, hisse nominal fiyatının üstünde satıldığında oluşan farkı tutar. Fark bu hesabın alacağına yazılır.","doldur":[[8,1]]},{"formul":"Bankaya yatırma kaydı = sadece nakit taahhüt edilen kısım; Dahil değil: yasal yedeklerden karşılanan 50.000 (soruda verilen)","anlatim":"Yedeklerden karşılanan 50.000 TL bu bankaya yatırma kaydına hiç girmez, çünkü nakit taahhüt değil. Dikkat: bu tutar zaten daha önce başka bir kayıtla sermayeye eklenmişti.","doldur":[]},{"formul":"102 BANKALAR = bankaya yatan tutar (borç)","anlatim":"102 Bankalar, işletmenin banka hesabına giren veya çıkan parayı izler. Para banka hesabına girince bu hesap borçlanır.","doldur":[]},{"formul":"102 BANKALAR (BORÇ) 195.000 = 150.000 nominal (soruda verilen) + 45.000 prim (4. adımda bulduk); 501 ÖDENMEMİŞ SERMAYE (ALACAK) 150.000 (soruda verilen); 520 HİSSE SENEDİ İHRAÇ PRİMLERİ (ALACAK) 45.000 (4. adımda bulduk)","anlatim":"Şimdi bankaya yatırma kaydını yapıyoruz: banka artıyor borç, ödenmemiş sermaye kapanıyor borç tarafından alacaklanıyor, prim de alacak yazılıyor.","doldur":[[9,1]]},{"formul":"Ters durum: ihraç bedeli nominalin altında olsaydı → 523 HİSSE SENEDİ İHRAÇ İSKONTOSU (borç)","anlatim":"Ters durumda, yani ihraç nominalin altında yapılsaydı fark 520 yerine 523 Hisse Senedi İhraç İskontosu hesabına borç yazılırdı. Bu durum primli değil iskontolu ihraç olurdu.","doldur":[]},{"formul":"Yanlış yol: 200.000 × %130 = 260.000 (HATALI) → doğrusu 195.000 (3. adımda bulduk)","anlatim":"En sık hata: öğrenci 200.000 TL'nin tamamını veya 50.000 TL'lik yedek kısmını da bankaya yatırma kaydına dahil eder. Oysa yedekten karşılanan kısımda nakit hareketi yoktur, bu kayda girmez.","doldur":[]}],"anahtar":[{"ornek":"nominal","kok":"nomina"},{"ornek":"sermaye","kok":"sermay"},{"ornek":"taahhüt","kok":"taahhü"},{"ornek":"alacak","kok":"alacak"},{"ornek":"senedi","kok":"senedi"},{"ornek":"kaydına","kok":"kaydın"},{"ornek":"102","kok":"102"},{"ornek":"501","kok":"501"},{"ornek":"520","kok":"520"}],"konuGiris":{"harita":"Ne zaman test edilir: nakit karşılığı taahhüt edilen sermaye bankaya yatırıldığında hangi hesapların hareket ettiği sorulduğunda. Nasıl ölçülür: nominal değer ile ihraç bedeli arasındaki fark ayrıştırılarak hesaplanır. Nasıl kaydedilir: nominal tutar 500 ve 501 hesaplarında, prim farkı 520 hesabında izlenir.","desen":"Sınav, %30 fazlasıyla ihraç edilen tutarın tamamının 500 hesaba yazıldığı yanılgısını kurar; oysa fark 520'ye ayrılmalıdır. Ayrıca yasal yedeklerden karşılanan kısmın bankaya girmediği, nakit hareketi doğurmadığı gözden kaçırılır. Bu soru Tekdüzen Hesap Planı 500-501-520 hesapların işleyişi noktasından geliyor (p.28, 7 dönemde soruldu).","terimler":[{"kaynak":"soruda verilir","tanim":"hisse senedinin üzerinde yazan itibari değeri","ad":"Nominal değer","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"satış bedelinin nominal değeri aşan kısmı, sermaye yedeği","ad":"İhraç primi","kim":"piyasa fiyatlar"},{"kaynak":"kuraldan bilinir","tanim":"taahhüt edilip henüz ödenmeyen sermaye kısmını gösteren düzenleyici hesap","ad":"501 Ödenmemiş Sermaye","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"nominal değer üstü satış farkının kaydedildiği sermaye yedeği hesabı","ad":"520 Hisse Senedi İhraç Primleri","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Nakit taahhüt edilen kısmın bankaya yatırılmasına ilişkin doğru muhasebe kaydı istenir; nominal değer ile prim farkının hangi hesaplara dağıldığı sorulur.","panel_ornek":"Arkadaşın ikinci el bir bisikleti 2.000 TL'ye satın alıp, üstüne 600 TL fazladan ödediğini düşün. O 2.000 TL bisikletin gerçek etiket fiyatıdır, 600 TL ise alıcının 'buna değer' dediği fazlalıktır ve ayrı bir yerde not edilir, etiket fiyatına eklenmez. Şirketler de hisse satarken nominal değeri ile üstündeki fazlalığı ayrı ayrı kaydeder.","ornek":"Arkadaşın ikinci el bir bisikleti 2.000 TL'ye satın alıp, üstüne 600 TL fazladan ödediğini düşün. O 2.000 TL bisikletin gerçek etiket fiyatıdır, 600 TL ise alıcının 'buna değer' dediği fazlalıktır ve ayrı bir yerde not edilir, etiket fiyatına eklenmez. Şirketler de hisse satarken nominal değeri ile üstündeki fazlalığı ayrı ayrı kaydeder.","yontemler":"Önce nominal tutar ile ihraç bedeli farkını ayır; nominal kısmı 501'den 102'ye, fark kısmı 520 hesabına alacak yaz.","nedir":"Bu konu, işletmelerin sermaye artırırken hangi tutarları hangi hesaba yazdığını gösterir. Sınav, nominal değer ile prim farkını doğru hesaba ayırıp ayıramadığını ölçer."},"olay":"150.000×1,30=195.000; 195.000-150.000=45.000.","tuzak":{"C":{"ad":"Çeldirici Verilen Tuzağı","metin":"yedeklerden karşılanan 50.000 TL'yi de nakit sermaye taahhüdüne dahil edip 200.000 TL üzerinden prim hesaplarsın. Doğrusu: yedeklerden artırımda kasa/banka hareketi yoktur, prim yalnız nakit kısım üzerinden hesaplanır."},"A":{"ad":"Ters Kayıt Tuzağı","metin":"doğru tutarları bulup borç-alacak taraflarını karıştırırsın. Doğrusu: banka hesabına giriş borç, sermaye taahhüdü ile prim hesapları alacak tarafında kapanır."},"D":{"ad":"Prim Ayrıştırmama Tuzağı","metin":"ihraç bedelinin tamamını 501 Ödenmemiş Sermaye hesabına yazıp primi hiç ayırmazsın. Doğrusu: 501 hesabı yalnız nominal tutar kadar kapanır, nominal üstü kısım 520 hesabına gider."},"B":{"ad":"Nominale Katma Tuzağı","metin":"ihraç primini ayrı hesapta izlemeyi unutup tüm bankaya giren tutarı 500 Sermaye hesabına yazarsın. Doğrusu: 500 Sermaye yalnız nominal (150.000) değeri taşır, farkı 520 hesabı karşılar."}},"celdiriciYol":{"C":"200.000×1,30=260.000; 260.000-200.000=60.000 (yedeklerden gelen 50.000'i de nakit taahhüde dahil etme hatası)","A":"150.000 ve 45.000 tutarları doğru bulunup borç/alacak tarafları ters yazıldı (ters kayıt hatası)","D":"150.000×1,30=195.000; prim ayrıştırılmadan tamamı 501'e yazıldı = 195.000 (ihraç primini ayırmama hatası)","B":"150.000×1,30=195.000; tamamı 500 Sermaye'ye yazıldı = 195.000 (ihraç primini nominale katma hatası)"},"hap":"Sermaye artırımında 500 Sermaye hesabı yalnız nominal değeri, nominal üstü fark ise 520 Hisse Senedi İhraç Primleri hesabını taşır; iç kaynaktan gelen kısımda kasa/banka hiç hareket etmez.","teshis":{"C":{"gercek":"İç kaynaklardan (yedeklerden) yapılan sermaye artırımında banka/kasa hareketi olmaz; yalnız ilgili yedek hesabı borçlanır.","ayirt":"Bu tutar gerçekten bankaya giren nakit mi, yoksa iç kaynak aktarımı mı?","paragraf":"Teori Notu - bedelsiz sermaye artırımı","yanilgi":"Yedeklerden karşılanan kısmın da nakit girdiği bir işlem olduğunu sanıyorsun."},"E":{"gercek":"Tekdüzen Hesap Planı'nda 500 Sermaye yalnız nominal değeri taşır; nominal üstü tutar 520 Hisse Senedi İhraç Primleri'nde sermaye yedeği olarak izlenir.","ayirt":"Bu tutar nominal değerin kendisi mi, yoksa nominali aşan fark mı?","paragraf":"MSUGT Sıra No:1 THP 500-501-520 işleyişi","yanilgi":"Bu şıkkı eleyen öğrenci, primin de nominal sermayeye dahil olması gerektiğini düşünür."},"A":{"gercek":"Bankaya giren tutar varlık artışıdır ve borç tarafına yazılır; sermaye ve prim hesapları özkaynak artışı olduğundan alacak tarafına yazılır.","ayirt":"Banka hesabına para girdiğinde bu hesap borçlanır mı, alacaklanır mı?","paragraf":"MSUGT Sıra No:1 THP 102 işleyişi","yanilgi":"Doğru tutarları bulduğun için kaydın da otomatik doğru olduğunu sanıp taraf kontrolü yapmıyorsun."},"D":{"gercek":"501 hesabı yalnız taahhüt edilen nominal tutar kadar kapanır; nominal üstü fark ayrı olarak 520 hesabına yazılır.","ayirt":"501 hesabının kapanması gereken tutar nominal mi, yoksa ihraç bedeli mi?","paragraf":"MSUGT Sıra No:1 THP 501","yanilgi":"İhraç bedelinin tamamının Ödenmemiş Sermaye hesabına yazılması gerektiğini düşünüyorsun."},"B":{"gercek":"520 hesabı, nominal üstü bedelin izlendiği ayrı bir sermaye yedeği hesabıdır; 500 hesabına karıştırılmaz.","ayirt":"Bu tutarın tamamı nominal mi, yoksa içinde prim payı var mı?","paragraf":"MSUGT Sıra No:1 THP 520","yanilgi":"İhraç primini nominal sermayeden ayırmadan tek hesapta topluyorsun."}},"verilen":[[6,1],[1,1],[2,1],[3,1],[4,1]],"donem":7,"hesaplar":{"102":{"ad":"Bankalar","tanim":"Bu hesap, işletmece yurt içi ve yurt dışı banka ve benzeri finans kurumlarına yatırılan ve çekilen paraların izlenmesini kapsar. İşleyişi : Bankalara para olarak veya hesaben yatırılan değerler borç, çekilen tutarlar ile üçüncü kişilerce tahsil edildiği anlaşılan çek ve ödeme emirleri alacak kaydedilir."},"500":{"ad":"SERMAYE","tanim":"İşletmeye tahsis edilen veya işletmelerin ana sözleşmelerinde yer alan ve Ticaret Sicili'ne tescil edilmiş bulunan sermaye tutarı bu hesapta yer alır. Kayıtlı sermaye sistemine alınan ortaklıklarda çıkarılmış sermaye gösterilir. Kayıtlı sermaye tavanı ayrıca dipnotlarda belirtilir."},"501":{"ad":"ÖDENMEMİŞ SERMAYE (-)","tanim":"İşletmeye tahsis edilen veya ortaklarca yüklenilen sermayenin henüz ödenmemiş kısmıdır. İşleyişi: Taahhüt edilen sermaye tutarı \"500- Sermaye Hesabı\" alacağı ile bu hesaba borç, ödenen tutarlar alacak kaydedilir."},"520":{"ad":"HİSSE SENEDİ İHRAÇ PRİMLERİ","tanim":"Yeni çıkarılan hisse senetlerinin primli satışından kaynaklanan tutarlar bu hesapta izlenir. İşleyişi: Hisse senedinin nominal fiyatı ile satış fiyatı arasındaki fark bu hesabın alacağına satış biçimine bağlı olarak ilgili hesabın borcuna kaydedilir."}}},{"capa":null,"kural":"Bütçe sapması, fiili genel üretim giderinin, fiili faaliyet hacmi için hazırlanan esnek bütçe genel üretim giderinden farkıdır; fiili gider büyükse sapma olumsuzdur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 59","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce esnek bütçeyi (sabit gider + değişken oran × fiili hacim) kur, sonra fiili gideri onunla karşılaştır; yüklenen gideri sadece kapasite sapmasında kullan.","konu":"sipariş maliyet sistemi","tablo":{"satirlar":[["VERİLENLER","-"],["Normal kapasite","20.000 makine saati"],["Bütçelenen sabit GUG","400.000 TL"],["Bütçelenen değişken GUG oranı","20 TL/mks"],["Fiili makine saati","18.000"],["Fiili genel üretim gideri","774.000 TL"],["Genel idare gideri","90.000 TL"],["İşçilik saat ücreti","35 TL/saat"],["HESAP","-"],["Bütçelenen toplam genel üretim gideri (400.000+20×20.000)","800.000"],["Yükleme oranı (800.000/20.000)","40"],["Yüklenen genel üretim gideri (18.000×40)","720.000"],["Esnek bütçe genel üretim gideri (400.000+20×18.000)","760.000"],["Bütçe (harcama) sapması (774.000-760.000)","14.000 (olumsuz)"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"40.000 olumlu","E":"54.000 olumsuz","A":"14.000 olumlu","D":"40.000 olumsuz","B":"14.000 olumsuz"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Kapasite sapmasını (40.000) bütçe sapması sandın; bu fark yüklenen gider (720.000) ile esnek bütçe (760.000) arasındadır, bütçe sapması değildir.","E":"Fiili gider (774.000) ile yüklenen gider (720.000) arasındaki toplam farkı (54.000) bütçe sapması yaptın; bu fark iki katmana ayrışır: kapasite 40.000, bütçe 14.000 TL'dir.","D":"Yine kapasite sapmasını (40.000) bütçe sapması ile karıştırdın; ikisi farklı katmanlar; bütçe sapması 14.000 TL'dir.","A":"Tutar doğru (14.000) ancak yön ters işaretlenmiş; fiili gider esnek bütçeden büyük olduğu için sapma işletmeye zararlı, yani olumsuzdur."},"dogru":"Fiili genel üretim gideri 774.000 TL, fiili makine saati 18.000 için esnek bütçe 760.000 TL olduğundan bütçe sapması 14.000 TL olumsuztur; giderlerin beklentiden fazla çıkması işletmeye zararlıdır.","sinav":"Bütçe sapması, fiili genel üretim giderinin fiili faaliyet hacmi için hazırlanan esnek bütçe genel üretim giderinden farkıdır; fiili gider büyükse sapma olumsuzdur.","kavramlar":[{"kaynak":"TEORI","tanim":"Fiili genel üretim giderinin, fiili faaliyet hacmi için hazırlanan esnek bütçe genel üretim giderinden farkıdır; gider kalemlerindeki fiyat ve tüketim farklarından doğan, kontrol edilebilir bir sapmadır.","ad":"Bütçe (harcama) sapması"},{"kaynak":"TEORI","tanim":"Fiili faaliyet hacmi için önceden belirlenen yükleme oranı uygulanarak hesaplanan bütçelenen genel üretim gideridir; sabit gider artı değişken gider oranı çarpı fiili faaliyet hacmından oluşur.","ad":"Esnek bütçe"},{"kaynak":"TEORI","tanim":"Birbirinden farklı ve ayırt edilebilir ürünlerin müşteri siparişine göre üretildiği işletmelerde, her sipariş için ayrı bir maliyet kartı açılarak maliyetin takip edildiği sistemdir.","ad":"Sipariş maliyet sistemi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Bütçelenen toplam genel üretim gideri (500.000+15×25.000)","875.000"],["Yükleme oranı (875.000/25.000)","35"],["Yüklenen genel üretim gideri (22.000×35)","770.000"],["Esnek bütçe genel üretim gideri (500.000+15×22.000)","830.000"],["Bütçe (harcama) sapması (850.000-830.000)","20.000 (olumsuz)"]]},"tur":"tablo","soru":"İşletme sipariş maliyet sistemi kullanmaktadır. Genel üretim giderleri, makine saati esas alınarak dönem başında belirlenen yükleme oranıyla siparişlere yüklenmektedir. Normal kapasite 25.000 makine saati olarak planlanmış; bu kapasitede bütçelenen sabit genel üretim gideri 500.000 TL, değişken genel üretim gideri oranı ise makine saati başına 15 TL olarak öngörülmüştür. Dönemde fiilen çalışılan makine saati 22.000'dir ve aynı dönemde fiili genel üretim gideri toplamı 850.000 TL olarak gerçekleşmiştir. İşletme ayrıca dönemde 120.000 TL genel yönetim gideri yapmış, direkt işçilerine ise saat başına 40 TL ücret ödemiştir. Buna göre dönemin bütçe (harcama) sapması kaç TL'dir ve yönü nedir?","verilen":[],"hedef":"Tabloyu doldur ve dönemin bütçe (harcama) sapmasının kaç TL olduğunu ve yönünü bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme sipariş maliyet sistemi kullanmaktadır. Genel üretim giderleri, makine saati esas alınarak dönem başında belirlenen yükleme oranıyla siparişlere yüklenmektedir. Normal kapasite 20.000 makine saati olarak planlanmış; bu kapasitede bütçelenen sabit genel üretim gideri 400.000 TL, değişken genel üretim gideri oranı ise makine saati başına 20 TL olarak öngörülmüştür. Dönemde fiilen çalışılan makine saati 18.000'dir ve aynı dönemde fiili genel üretim gideri toplamı 774.000 TL olarak gerçekleşmiştir. İşletme ayrıca dönemde 90.000 TL genel yönetim gideri yapmış, direkt işçilerine ise saat başına 35 TL ücret ödemiştir. Buna göre dönemin bütçe (harcama) sapması kaç TL'dir ve yönü nedir?","kayitBaslik":"","id":"sgs-d2-maliyet-cokzor-r1/kp-01","verilenler":[{"deger":"20.000 makine saati","anlam":"Bütçelenen faaliyet hacmidir; yükleme oranının hesaplanmasında paydayı oluşturur.","ad":"Normal kapasite"},{"deger":"400.000 TL","anlam":"Normal kapasitede bütçelenen sabit genel üretim giderinin tutarıdır, esnek bütçenin sabit kısmıdır.","ad":"Bütçelenen sabit GUG"},{"deger":"20 TL/mks","anlam":"Makine saati başına bütçelenen değişken gider oranıdır, esnek bütçe hesaplanırken fiili hacme uygulanır.","ad":"Bütçelenen değişken GUG oranı"},{"deger":"18.000","anlam":"Dönemde fiilen çalışılan hacimdir; yüklenen GUG ve esnek bütçenin hesaplanmasında kullanılır.","ad":"Fiili makine saati"},{"deger":"774.000 TL","anlam":"Dönemde gerçekten katlanılan genel üretim gideridir; bütçe sapmasının çıkış noktasıdır.","ad":"Fiili genel üretim gideri"},{"deger":"90.000 TL","anlam":"Çeldirici veridir; genel üretim gideri sapması hesaplamasına dahil değildir.","ad":"Genel idare gideri"},{"deger":"35 TL/saat","anlam":"Çeldirici veridir; yükleme oranıyla karıştırılmaması gereken direkt işçilik ücretidir, hesaba girmez.","ad":"İşçilik saat ücreti"}],"dayanak":"Maliyet muhasebesi - Sipariş maliyet sisteminde genel üretim gideri bütçe/kapasite sapması kuralı (mevzuat maddesi yok)","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Normal kapasite 20.000 saat (soruda verilen); Sabit genel üretim gideri 400.000 TL (soruda verilen); Değişken genel üretim gideri oranı 20 TL/saat (soruda verilen); Fiili saat 18.000 (soruda verilen); Fiili genel üretim gideri 774.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: normal kapasite 20.000 makine saati, sabit genel üretim gideri 400.000 TL, değişken genel üretim gideri oranı 20 TL/saat, fiili saat 18.000, fiili genel üretim gideri 774.000 TL. Ayrıca genel yönetim gideri 90.000 TL ve işçi ücreti 35 TL/saat de verilmiş ama bu soruda kullanılmayacak.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]]},{"formul":"Bütçelenen toplam genel üretim gideri = Sabit genel üretim gideri + Değişken genel üretim gideri oranı × Normal kapasite = 400.000 (soruda verilen) + 20 (soruda verilen) × 20.000 (soruda verilen) = 800.000 TL","anlatim":"Yükleme oranı, kapasitede bütçelenen toplam genel üretim gideri'ün kapasiteye bölünmesiyle çıkar. Önce normal kapasitedeki toplam bütçeyi buluyoruz çünkü oranın payı bu.","doldur":[[9,1]]},{"formul":"Yükleme oranı = Bütçelenen toplam genel üretim gideri / Normal kapasite = 800.000 (1. adımda bulduk) / 20.000 (soruda verilen) = 40 TL/saat","anlatim":"Yükleme oranı, siparişlere genel üretim gideri'ün hangi katsayıyla dağıtılacağını gösterir. Bunu bulmak için toplam bütçeyi kapasiteye böleriz.","doldur":[[10,1]]},{"formul":"Yüklenen genel üretim gideri = Fiili saat × Yükleme oranı = 18.000 (soruda verilen) × 40 (2. adımda bulduk) = 720.000 TL","anlatim":"Yüklenen genel üretim gideri, fiili çalışılan saate yükleme oranı uygulanarak bulunur. Bu, siparişlere fiilen ne kadar genel üretim gideri dağıtıldığını gösterir.","doldur":[[11,1]]},{"formul":"Esnek bütçe genel üretim gideri = Sabit genel üretim gideri + Değişken genel üretim gideri oranı × Fiili saat = 400.000 (soruda verilen) + 20 (soruda verilen) × 18.000 (soruda verilen) = 760.000 TL","anlatim":"Esnek bütçe, fiili çalışılan saat için olması gereken genel üretim gideri'ü gösterir. Sabit kısım değişmez, değişken kısım fiili saatle çarpılır - dikkat, burada normal kapasite değil fiili saat kullanılır.","doldur":[[12,1]]},{"formul":"Bütçe (harcama) sapması = Fiili genel üretim gideri - Esnek bütçe genel üretim gideri = 774.000 (soruda verilen) - 760.000 (5. adımda bulduk) = 14.000 TL, olumsuz","anlatim":"Bütçe sapması, fiili genel üretim gideri ile esnek bütçe genel üretim gideri arasındaki farktır. Fiili gider esnek bütçeden büyükse sapma olumsuzdur.","doldur":[[13,1]]},{"formul":"Ters durum: Fiili genel üretim gideri < Esnek bütçe genel üretim gideri olsaydı → sapma olumlu","anlatim":"Ters durumda fiili gider esnek bütçeden az çıksaydı sapma olumlu olurdu. Yön hep fiilin esnek bütçeye göre büyük ya da küçük olmasına bakar.","doldur":[]},{"formul":"Sonuç: Bütçe sapması = 774.000 (soruda verilen) - 760.000 (5. adımda bulduk) = 14.000 TL (olumsuz)","anlatim":"Sonuç: dönemin bütçe (harcama) sapması 14.000 TL ve olumsuzdur. Çünkü fiili gider, fiili hacim için olması gereken tutarı aşmıştır.","doldur":[]},{"formul":"Yanlış yol: 774.000 - 720.000 = 54.000 (HATALI) → doğrusu 774.000 - 760.000 = 14.000 (6. adımda bulduk)","anlatim":"En sık hata: öğrenci fiili genel üretim gideri'den yüklenen genel üretim gideri'ü çıkarıp toplam sapma sanıyor. Ama o hacim sapmasıyla bütçe sapmasının toplamıdır, sadece bütçe sapması değildir.","doldur":[]}],"anahtar":[{"ornek":"gideri","kok":"gideri"},{"ornek":"üretim","kok":"üretim"},{"ornek":"sapması","kok":"sapmas"},{"ornek":"kapasite","kok":"kapasi"},{"ornek":"gösterir","kok":"göster"},{"ornek":"olması","kok":"olması"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda fiili genel üretim gideri ile fiili kapasiteye göre yeniden hesaplanan bütçe tutarı karşılaştırılırken test edilir. Nasıl ölçülür: Fiili genel üretim gideri eksi (fiili faaliyet hacmi için bütçelenen sabit+değişken genel üretim gideri) farkı alınarak ölçülür. Nasıl kaydedilir: fark önemsizse doğrudan Satılan Mamul Maliyeti hesabına, önemliyse yarı mamul-mamul-SMM arasında oranlı olarak kaydedilir.","desen":"Sınav genellikle direkt işçilik ücretini ve genel yönetim giderini soruya ekleyip dikkat dağıtır, bunlar bütçe sapması hesabına girmez. Öğrenciler çoğu zaman normal kapasiteye göre bütçelenen tutarı kullanır, oysa doğru karşılaştırma fiili çalışılan saate göre yeniden hesaplanan bütçe tutarıdır. Bu soru p.28 genel üretim gideri bütçe/kapasite sapması ayrımı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşletmenin dönem başında planladığı faaliyet hacmi ölçüsü","ad":"Normal kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Fiili çalışılan hacim için sabit ve değişken giderin yeniden hesaplanmış toplamı","ad":"Bütçelenen genel üretim gideri","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Dönemde gerçekten oluşan toplam genel üretim gideri tutarı","ad":"Fiili genel üretim gideri","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Fiili giderle fiili hacim için bütçelenen gider arasındaki fark","ad":"Bütçe (harcama) sapması","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda normal kapasite, bütçelenen sabit/değişken genel üretim gideri oranları, fiili çalışılan saat ve fiili genel üretim gideri verilir; bütçe sapmasının tutarı ve yönü istenir.","panel_ornek":"Bir kafe ayda 500 fincan kahve satmayı planlar, her fincan için 10 TL malzeme öngörür; yani bütçelenen gider 5.000 TL'dir. Ay sonunda 480 fincan satılmış ama malzeme gideri 5.200 TL çıkmış. Aradaki 5.200-4.800=400 TL fark, harcamada bütçeden sapıldığını gösterir; işte bütçe sapması budur.","ornek":"Bir kafe ayda 500 fincan kahve satmayı planlar, her fincan için 10 TL malzeme öngörür; yani bütçelenen gider 5.000 TL'dir. Ay sonunda 480 fincan satılmış ama malzeme gideri 5.200 TL çıkmış. Aradaki 5.200-4.800=400 TL fark, harcamada bütçeden sapıldığını gösterir; işte bütçe sapması budur.","yontemler":"Fiili çalışılan saat için bütçelenen genel üretim gideri'yi (sabit + değişken×fiili saat) yeniden hesapla, fiili genel üretim gideri'den çıkar; fiili>bütçelenen ise olumsuz (eksik), tersi olumlu (fazla) sapmadır.","nedir":"Sipariş maliyet sisteminde genel üretim gideri bütçe (harcama) sapması, fiili giderin fiilen çalışılan kapasite için bütçelenen tutardan ne kadar farklı olduğunu gösterir. Sınav bu farkın tutarını ve yönünü (olumlu/olumsuz) doğru hesaplayıp yorumlayabilmeyi ölçer."},"olay":"Esnek bütçe = 400.000+20×18.000=760.000; sapma=774.000-760.000=14.000.","tuzak":{"C":{"ad":"Katman Tuzağı","metin":"Esnek bütçe ile yüklenen gider arasındaki kapasite sapmasını (760.000-720.000=40.000) bütçe sapması sanmış, ayrıca yönünü de ters işaretlemişsin. Doğrusu: Bu tutar kapasite sapmasıdır, bütçe sapması değildir."},"E":{"ad":"Ayrıştırma Tuzağı","metin":"Fiili gideri doğrudan yüklenen giderle karşılaştırıp toplam yükleme farkını (774.000-720.000=54.000) bütçe sapması sandın. Doğrusu: Bu tutar toplam yükleme farkıdır, bütçe ve kapasite sapmalarına ayrıştırılmamıştır."},"D":{"ad":"Katman Tuzağı","metin":"Esnek bütçe ile yüklenen gider arasındaki kapasite sapmasını (760.000-720.000=40.000) bütçe sapması sandın. Doğrusu: Bu tutar kapasite sapmasına aittir, bütçe sapması ayrı bir katmandır ve 14.000 TL'dir."},"A":{"ad":"Yön Tuzağı","metin":"Fiili gider esnek bütçeden büyük olduğu için sapmayı işletme aleyhine değil lehine (olumlu) işaretlemiş olabilirsin. Doğrusu: Fiili gider esnek bütçeden büyük olduğunda sapma olumsuzdur, tutar 14.000 TL'dir."}},"celdiriciYol":{"C":"760.000-720.000=40.000 (kapasite sapması bütçe sapması sanıldı, yön de ters işaretlendi)","E":"774.000-720.000=54.000 (esnek bütçe adımı atlanıp toplam yükleme farkı bütçe sapması sanıldı)","D":"760.000-720.000=40.000 (kapasite sapması bütçe sapması sanıldı)","A":"774.000-760.000=14.000 (yön ters işaretlendi, olumsuz yerine olumlu yazıldı)"},"hap":"Bütçe sapması fiili genel üretim gideri ile esnek bütçe genel üretim gideri'ün farkıdır, kapasite sapması ise esnek bütçe ile yüklenen genel üretim gideri'ün farkıdır; ikisi ayrı katmandır.","teshis":{"C":{"gercek":"Kapasite sapması = Esnek bütçe GUG - Yüklenen GUG = 760.000-720.000=40.000; bu, sabit giderin yeterince yüklenip yüklenmediğini gösterir, bütçe sapması değildir.","ayirt":"Bu farkı fiili gider mi, yüklenen gider mi ile aldım?","paragraf":"Maliyet muhasebesi - GUG kapasite sapması kuralı","yanilgi":"Esnek bütçe ile yüklenen gider farkını (kapasite sapması) bütçe sapması olarak kullanıyor, üstüne yönünü de ters çeviriyorsun."},"E":{"gercek":"Fiili-Yüklenen farkı (774.000-720.000=54.000) toplam yükleme farkıdır; bu tutar bütçe sapması ve kapasite sapması olarak ikiye ayrıştırılmadan bütçe sapması olarak kullanılamaz.","ayirt":"Esnek bütçe adımını atladım mı?","paragraf":"Maliyet muhasebesi - GUG toplam yükleme farkı kuralı","yanilgi":"Fiili GUG'den doğrudan yüklenen GUG'ü çıkarıp bunu bütçe sapması sanıyorsun."},"A":{"gercek":"Fiili gider esnek bütçeden fazlaysa harcama kontrolsüz artmış demektir, bu durum kontrol edilebilir ve olumsuz bir sapmadır.","ayirt":"Fiili gider mi esnek bütçeden büyük, esnek bütçe mi fiiliden büyük?","paragraf":"Maliyet muhasebesi - GUG bütçe sapması kuralı","yanilgi":"Fiili gider esnek bütçeden fazla çıktığında bunu işletme lehine bir durum sanıyorsun."},"D":{"gercek":"Kapasite sapması (760.000-720.000=40.000) ile bütçe sapması (774.000-760.000=14.000) birbirinden ayrı iki hesaptır, tek bir sapma değildir.","ayirt":"Sorulan sapma esnek bütçe-yüklenen mi, fiili-esnek bütçe mi?","paragraf":"Maliyet muhasebesi - GUG kapasite sapması kuralı","yanilgi":"Kapasite sapması tutarını doğru işaretle bulmuş olsan da bunu bütçe sapmasıyla aynı katman sanıyorsun."},"B":{"gercek":"Bütçe sapması, fiili GUG ile fiili hacim için hazırlanan esnek bütçe GUG'ün farkıdır; esnek bütçe=400.000+20×18.000=760.000, fark=14.000 ve olumsuzdur.","ayirt":"Karşılaştırdığım ikinci tutar yüklenen gider mi, esnek bütçe mi?","paragraf":"Maliyet muhasebesi - GUG bütçe sapması kuralı","yanilgi":"Bu şıkkı eleyen öğrenci genelde esnek bütçeyi kurmadan doğrudan fiili ile yüklenen gideri karşılaştırır."}},"verilen":[[9,1],[10,1],[11,1],[12,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"donem" ara), 381 GİDER TAHAKKUKLARI BORÇ (önceki dönem faizi), 780 FİNANSMAN GİDERLERİ BORÇ (bu döneme düşen faiz); 102 BANKALAR ALACAK (toplam ödeme). Vade bir yılı aşan krediler 400 BANKA KREDİLERİ'nde izlenir, yılı gelen taksitler 303'e aktarılır. Alacak tarafındaki simetrik hesap 181 GELİR TAHAKKUKLARI'dır (henüz tahsil edilmemiş faiz alacağı). ÖRNEK: 1.9.2026'da 90.000 TL, yıllık %20, 9 ay vadeli kredi; 31.12.2026'da 4 aylık faiz: 90.000 × 0,20 × 4/12 = 6.000 TL → 780 Finansman Giderleri 6.000 borç / 381 Gider Tahakkukları 6.000 alacak. 1.6.2027 vadede: toplam faiz 90.000 × 0,20 × 9/12 = 13.500; kayıt 300 Banka Kredileri 90.000 borç, 381 Gider Tahakkukları 6.000 borç, 780 Finansman Giderleri 7.500 borç; 102 Bankalar 103.500 alacak. SINAV TUZAĞI: (1) Dönem sonu faizi gider yazılır ama ödenmez; karşılığı 381'dir, 100 Kasa değil. (2) 181 Gelir Tahakkukları alacak tarafı için; kredi faizinde kullanılmaz. (3) Vadede önceki yılın faizi 381'den kapatılır, yeniden…"},{"ad":"VUK (213 s.K.) m.283 - Aktif geçici hesap kıymetleri","metin":"Aktif geçici hesap kıymetleri: Madde 283 – Gelecek bir hesap dönemine ait olarak peşin ödenen giderler ile cari hesap dönemine ait olup da henüz tahsil edilmemiş olan hasılat, mukayyet değerleri üzerinden aktifleştirilmek suretiyle değerlenir. Zirai işletmelerde henüz idrak edilmemiş olan mahsuller için yapılan giderler (Hazırlık işleri giderleri gibi) de bu madde hükmüne göre aktifleştirilerek değerlenir. Kasa mevcudu: “Alacaklar mukayyet değerleriyle değerlenir.”şeklindeki bu fıkra; 16/7/2004 tarihli ve 5228 sayılı Kanunun 59 uncu maddesindeki (213 sayılı Kanunun “b)Alacaklar mukayyet değerleriyle değerlenir.”ibaresi,\"Mevduat veya kredi sözleşmelerine müstenit alacaklar değerleme gününe kadar hesaplanacak faizleriyle birlikte dikkate alınır.”şeklinde değiştirilmiştir .) hükümlerine istinaden metinde yer aldığı şekilde değiştirilmiştir. 91"}],"hakem":"Soru, kredi faiz tahakkuku ve vade sonu ödeme kaydında 780 Finansman Giderleri hesabına yazı
