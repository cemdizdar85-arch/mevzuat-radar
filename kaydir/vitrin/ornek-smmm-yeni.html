Object.assign(TB,{"smmm-4k-a-yhukuk-zor-r7/kp-05":{"soz":true,"kural":"Zamanaşımına uğramış bir borcu ödeyen, ödediğini sebepsiz zenginleşme hükümleriyle geri isteyemez.","dyn":"TBK m.78 ikinci fıkra","tut":"Zamanaşımına uğramış borcu ödeyen ya da ahlaki bir ödevi yerine getiren ödediğini geri isteyemez; kendini borçlu sanarak ödeyen ise yanıldığını ispat ederse geri isteyebilir.","s":[["Borçlu sanarak ödeme","Geri istenir, yanılgı ispatlanırsa"],["Geçersiz sözleşmeyle ödeme","Geri istenir"],["Gerçekleşmemiş, sona ermiş sebep","Geri istenir"],["Zamanaşımına uğramış borç","Geri istenemez"],["Doğru cevap","E: zamanaşımına uğramış borç"]],"sen":{"A":{"b":"Kendini borçlu sanarak ödeyenin geri isteyebildiğini unuttun.","v":["Geri istenemez","Geri istenir","Geri istenir","Geri istenir","A: borçlu sanarak ödeme"]},"B":{"b":"Geçersiz sözleşmeye dayanan ödemeyi geri istenemez sandın.","v":["Geri istenir, yanılgı ispatlanırsa","Geri istenemez","Geri istenir","Geri istenir","B: geçersiz sözleşmeyle ödeme"]},"C":{"b":"Gerçekleşmemiş sebebe dayanan ödemeyi geri istenemez sandın.","v":["Geri istenir, yanılgı ispatlanırsa","Geri istenir","Gerçekleşmemişte geri istenemez","Geri istenir","C: gerçekleşmemiş sebep"]},"D":{"b":"Sona ermiş sebebe dayanan ödemeyi geri istenemez sandın.","v":["Geri istenir, yanılgı ispatlanırsa","Geri istenir","Sona ermişte geri istenemez","Geri istenir","D: sona ermiş sebep"]}}},"smmm-gm13-1-ydenetim-kolay/kp-05":{"soz":true,"kural":"Makul güvence yüksek ama mutlak olmayan bir güvencedir; denetçi denetim riskini kabul edilebilir düşük bir seviyeye indirecek yeterli ve uygun kanıtı elde edince bu güvenceyi sağlamış olur.","dyn":"BDS 200 p.13 (Tanımlar) ve p.17","tut":"Makul güvence yüksek ama mutlak olmayan güvencedir: denetim riski sıfıra değil, kabul edilebilir düşük bir seviyeye indirilir.","s":[["Görüşün konusu","Tabloların çerçeveye uygunluğu"],["Aranan yanlışlık","Önemli yanlışlıklar"],["Güvence düzeyi","Yüksek ama mutlak değil"],["Denetim riski","K Tarifede; altında iş yasak","Yayım gerekmez","Mevcut tarife uygulanır","Birlik tek başına","C: yayım şart değil"]},"D":{"b":"Yeni tarife gecikince eskisinin sürdüğünü unuttun.","v":["Tarifede; altında iş yasak","Resmî Gazete'de yayım","Tarifesiz dönem olur","Birlik tek başına","D: eski tarife biter"]}}},"smmm-w3-yspk-zor/kp-14":{"soz":true,"kural":"Kanunun amacı; sermaye piyasasının güvenilir, şeffaf, etkin, istikrarlı, adil ve rekabetçi bir ortamda işleyişinin ve gelişmesinin sağlanması, yatırımcıların hak ve menfaatlerinin korunması için sermaye piyasasının düzenlenmesi ve denetlenmesidir.","dyn":"6362 sayılı Kanun m.1","tut":"Madde 1'in amacı, güvenilir, şeffaf, etkin, istikrarlı, adil ve rekabetçi işleyiş ve gelişme ile yatırımcının korunması için piyasanın düzenlenmesi ve denetlenmesidir; sermaye birikimi bu maddede geçmez.","s":[["Güvenilir işleyiş, gelişme","Madde 1'de var"],["Yatırımcıyı korumak","Madde 1'de var"],["Düzenleme ve denetleme","Madde 1'de var"],["Sermaye birikimini hızlandırmak","Madde 1'de yok"],["Doğru cevap","E: sermaye birikimi"]],"sen":{"A":{"b":"Güvenilir ve adil işleyişin amaç cümlesinde geçtiğini atladın.","v":["İşleyiş madde 1'de yok","Madde 1'de var","Madde 1'de var","Madde 1'de var","A: güvenilir işleyiş"]},"B":{"b":"Yatırımcının korunmasının amaçta açıkça sayıldığını unuttun.","v":["Madde 1'de var","Madde 1'de yok","Madde 1'de var","Madde 1'de var","B: yatırımcının korunması"]},"C":{"b":"Düzenleme ve denetlemenin amacın kendisi olduğunu atladın.","v":["Madde 1'de var","Madde 1'de var","Madde 1'de yok","Madde 1'de var","C: düzenleme ve denetleme"]},"D":{"b":"Piyasanın gelişmesinin de amaç cümlesinde geçtiğini atladın.","v":["Gelişme madde 1'de yok","Madde 1'de var","Madde 1'de var","Madde 1'de var","D: piyasanın gelişmesi"]}}}});Object.assign(N,{"smmm-4k-a-yhukuk-zor-r7/kp-05":{"soz":true,"iste":"Geri istenemeyen ödeme","dusun":"Hangi ödemede kanun geri istemeyi kapatır?","istC":"Kök olumsuz: geri istenebilen dört ödemeyi ele, kalan ödeme cevaptır.","ver":[["Borçlu sanarak borçsuz ödeme","A"],["Geçersiz sözleşmeye dayanan ödeme","B"],["Gerçekleşmemiş sebebe dayanan ödeme","C"],["Sona ermiş sebebe dayanan ödeme","D"],["Zamanaşımına uğramış borcun ifası","E"]],"verC":"Beş şıkta beş ayrı ödeme var; her birine \"geri istenir mi?\" diye bak.","on":[4],"onC":"Zamanaşımı sözü, kanunun geri istemeyi açıkça kapattığı bir hâli gösterir.","kuralH":"<span>Zamanaşımı ve ahlaki ödev: geri istenemez</span>","kuralC":"Haklı bir sebep olmadan başkasının malvarlığından zenginleşen, zenginleşmeyi geri verir; sebep geçersiz, gerçekleşmemiş ya da sona ermişse de bu borç doğar. Zamanaşımına uğramış bir borcun ifası ise geri istenemez.","ara":[["A: borçlu sandı, ödedi","Yanılgıyı ispatlarsa geri ister"],["B: sözleşme geçersiz","Geçerli sebep yok, geri ister"],["C ve D: sebep yok","Geri ister"],["E: borç zamanaşımına uğramıştı","Geri isteyemez"]],"son":"Geri istenemeyen ödeme E: zamanaşımına uğramış borcun ifası.","cozC":"A, B, C ve D'de zenginleşmenin haklı bir sebebi yoktur ya da ödeyen yanılmıştır; bu ödemeler geri istenebilir. E'de ise kanun geri istemeyi açıkça kapatır: zamanaşımına uğramış borcu ödeyen, sonradan \"borç zaten düşmüştü\" diyerek parasını isteyemez.","not":"Zamanaşımı ve ahlaki ödev: geri istenemez","notC":"Olumsuz kökte istisnayı ara: kanunun geri istenemez dediği hâller zamanaşımına uğramış borcun ifası, ahlaki ödevin yerine getirilmesi ve hukuka ya da ahlaka aykırı bir sonuç için verilen şeydir.","basit":"Ayşe, Ali'ye olan borcunu yıllarca ödememiş ve borç zamanaşımına uğramış. Ayşe yine de borcunu ödüyor, sonra pişman oluyor: parasını geri isteyemez. Ayşe'nin hiç borcu olmasaydı ve kendini borçlu sanarak ödeseydi, yanıldığını ispat ederek parasını geri isteyebilirdi."},"smmm-gm13-1-ydenetim-kolay/kp-05":{"soz":true,"iste":"Makul güvencenin doğru anlatımı","dusun":"Denetçi tablolardaki her yanlışlığı bulabilir mi?","istC":"Kök olumlu: standarda uyan tek ifadeyi bul.","ver":[["A","Görüş yok, yanlışlık listesi"],["B","Önemsizler dahil bütün yanlışlıklar"],["C","Yüksek ama mutlak değil"],["D","Risk sıfırsa güvence"],["E","Yönetimin etkinliğine güvence"]],"verC":"Şıklar güvencenin düzeyini ve görüşün neyi kapsadığını farklı anlatıyor.","on":[2,3],"onC":"C ile D aynı kavramı anlatıyor: biri güvencenin mutlak olmadığını, öbürü riskin sıfırlandığını söylüyor; ikisi birlikte doğru olamaz.","kuralH":"<span>Makul ≠ mutlak, risk ≠ sıfır</span>","kuralC":"Makul güvence, finansal tabloların denetiminde yüksek ama mutlak olmayan güvence seviyesidir. Denetçi, denetim riskini kabul edilebilir düşük bir seviyeye indirecek yeterli ve uygun kanıtı elde ettiğinde makul güvence sağlamış olur.","ara":[["A: görüş yok","Denetçi görüş bildirir"],["B: bütün yanlışlıklar","Bakılan önemli yanlışlıklar"],["C: mutlak değil","Tanımın aynısı"],["D: risk sıfır","Risk düşük seviyeye iner"],["E: yönetimin etkinliği","Görüş bunu kapsamaz"]],"son":"Doğru cevap C: makul güvence yüksek ama mutlak değildir.","cozC":"Denetçi, tabloların bir bütün olarak önemli yanlışlık içerip içermediğine dair makul güvence elde eder ve görüş bildirir. Kanıtların çoğu kesin değil ikna edici olduğu için bu güvence mutlak olamaz; risk sıfıra değil, kabul edilebilir düşük bir seviyeye indirilir. Bu yüzden yalnız C standarda uyar.","not":"Makul ≠ mutlak, risk ≠ sıfır","notC":"Şıkta \"mutlak\", \"tam\", \"bütün yanlışlıklar\" ya da \"riski sıfıra indirmek\" sözlerini görürsen dikkat et; makul güvence bunların hiçbiri değildir.","basit":"Bir mobilya şirketinin denetçisi bütün faturaları tek tek okuyamaz; riskli alanlara yoğunlaşıp yeterli kanıt toplar. Sonunda \"tablolar önemli yönleriyle doğru\" der, \"yüzde yüz doğru\" demez. Bu görüş, şirketin gelecekte kazanacağını ya da yönetimin işi iyi yürüttüğünü de söylemez."},"smmm-4k-a-ymeslek-zor-r1/kp-20":{"soz":true,"iste":"Kanuna aykırı ifade","dusun":"Tarifeyi kim hazırlar, kim tasdik eder?","istC":"Kök olumsuz: Kanuna uyan dört ifadeyi ele, kalan cevaptır.","ver":[["A","Asgari ücret tarifeyle"],["B","Altında iş: disiplin cezası"],["C","Resmî Gazete'de yürürlük"],["D","Yenisine kadar eskisi"],["E","Tasdiksiz, Birlikçe yürürlük"]],"verC":"Dört şık Kanunun cümleleriyle aynı; biri bir basamağı atlıyor.","on":[4],"onC":"\"Aranmaksızın\" sözü Kanunun öngördüğü tasdik basamağını düşürüyor.","kuralH":"<span>Hazırlayan Birlik, tasdik eden Bakanlık</span>","kuralC":"Kanuna göre ücretin asgari miktarı tarifeyle belirlenir; altında iş kabulü yasaktır ve disiplin cezası gerektirir. Birlik yönetim kurulu tarifeyi hazırlayıp Bakanlığa gönderir; Bakanlık aynen ya da değiştirerek tasdik eder, tarife Resmî Gazete'de yayımlanarak yürürlüğe girer, yenisi tasdik edilene kadar mevcut tarife uygulanır.","ara":[["A: tarifeyle belirlenir","Kanuna uygun"],["B: altında iş cezalı","Kanuna uygun"],["C: Resmî Gazete","Kanuna uygun"],["D: eskisi sürer","Kanuna uygun"],["E: tasdik aranmaz","Kanuna aykırı"]],"son":"Yanlış ifade E: tarife Bakanlık tasdikinden geçer.","cozC":"A, B, C ve D Kanunun cümleleriyle aynıdır, bu yüzden elenir. E tasdik basamağını atlıyor: Birlik tarifeyi hazırlayıp Bakanlığa gönderir, Bakanlık aynen ya da değiştirerek tasdik eder. Bu yüzden yanlış ifade E'dir.","not":"Hazırlayan Birlik, tasdik eden Bakanlık","notC":"Tarife sorularında hazırlayan, tasdik eden ve yayımlandığı yer ayrı ayrı sorulur; birini başkasıyla değiştiren ya da bir basamağı atlayan şık yanlıştır.","basit":"Bir meslek birliğinin üyeleri için en az ücret listesi hazırladığını düşün. Liste, bir üst makam onaylamadan ve resmî olarak duyurulmadan geçerli olmaz; birlik \"onaya gerek yok, biz yürürlüğe koyarız\" diyemez. Yeni liste onaylanana kadar da eski liste geçerli kalır."},"smmm-w3-yspk-zor/kp-14":{"soz":true,"iste":"Madde 1'de olmayan amaç","dusun":"Amaç cümlesinde hangi sözler geçiyor?","istC":"Kök olumsuz: madde 1'de geçen dört ifadeyi ele, geçmeyen cevaptır.","ver":[["A","Güvenilir, şeffaf, adil işleyiş"],["B","Yatırımcının korunması"],["C","Düzenleme ve denetleme"],["D","Piyasanın gelişmesi"],["E","Sermaye birikiminin hızlandırılması"]],"verC":"Dört şık aynı cümlenin parçaları; biri bu cümlenin dışından getirilmiş.","on":[4],"onC":"Sermaye birikimi, finansal piyasaların işlevleri arasında anılır; Kanunun amaç maddesinde yazmaz.","kuralH":"<span>Amaç maddesi ≠ piyasanın işlevleri</span>","kuralC":"Kanunun amacı; sermaye piyasasının güvenilir, şeffaf, etkin, istikrarlı, adil ve rekabetçi bir ortamda işleyişinin ve gelişmesinin sağlanması, yatırımcıların hak ve menfaatlerinin korunması için sermaye piyasasının düzenlenmesi ve denetlenmesidir.","ara":[["A: işleyiş","Amaç cümlesinde var"],["B: yatırımcı","Amaç cümlesinde var"],["C: düzenleme, denetleme","Amaç cümlesinde var"],["D: gelişme","Amaç cümlesinde var"],["E: sermaye birikimi","Amaç cümlesinde yok"]],"son":"Yanlış ifade E: sermaye birikimi madde 1'de sayılmaz.","cozC":"Madde 1 tek cümledir: piyasanın güvenilir, şeffaf, etkin, istikrarlı, adil ve rekabetçi bir ortamda işleyişi ve gelişmesi ile yatırımcının korunması için piyasa düzenlenir ve denetlenir. A, B, C ve D bu cümlenin parçalarıdır, bu yüzden elenir. Sermaye birikimini oluşturmak ise sınav komisyonunun finansal piyasaların işlevleri arasında saydığı bir kalemdir; amaç maddesinde geçmez.","not":"Amaç maddesi ≠ piyasanın işlevleri","notC":"Kanunun bir maddesi sorulduğunda yalnız o maddenin sözlerine bak; piyasanın işlevi olarak bildiğin sözler (sermaye birikimi, likidite, mülkiyeti tabana yaymak) amaç maddesinde yoktur.","basit":"Bir spor federasyonunun tüzüğü \"ligin adil ve güvenli oynanması ve taraftarın korunması için maçlar düzenlenir ve denetlenir\" diyorsa, \"yeni stat yapmak\" o maddede yazmaz; başka yerde anılan bir faydadır. Sermaye Piyasası Kanunu'nun 1. maddesi de böyle: güvenilir işleyiş, gelişme, yatırımcının korunması, düzenleme ve denetleme var; sermaye birikimi yok."}});

 if(d[a].t===null)return `<div class="tht"><div class="sor y">${kac(d[a].s)}</div></div>`;
