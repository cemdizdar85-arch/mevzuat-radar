":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Genel amaçlı kredilerin tutarına göre hesaplanan ortalama faiz yüzdesi","ad":"Ağırlıklı ortalama faiz oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Özel ve genel borçlanmalardan varlığa yüklenecek toplam faiz tutarı","ad":"Aktifleştirilecek finansman gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Özel ve genel amaçlı kredi tutarları, faiz oranları, geçici yatırım geliri ve inşaata harcanan tutar verilir; aktifleştirilecek toplam finansman gideri istenir.","panel_ornek":"Arkadaşın motosiklet almak için özel olarak 10.000 TL kredi çekmiş, %10 faiz ödemiş ama parayı hemen kullanmayıp bir hafta bankada bekletip 50 TL faiz geliri kazanmış. Motosikletin maliyetine yazılacak faiz, ödenen faizden bu 50 TL\u0027nin düşülmesiyle bulunur. Ayrıca elindeki genel bir borcun bir kısmını da motosiklete harcarsa, o kısmın faizi de orantılı eklenir.","ornek":"Arkadaşın motosiklet almak için özel olarak 10.000 TL kredi çekmiş, %10 faiz ödemiş ama parayı hemen kullanmayıp bir hafta bankada bekletip 50 TL faiz geliri kazanmış. Motosikletin maliyetine yazılacak faiz, ödenen faizden bu 50 TL\u0027nin düşülmesiyle bulunur. Ayrıca elindeki genel bir borcun bir kısmını da motosiklete harcarsa, o kısmın faizi de orantılı eklenir.","yontemler":"Önce özel kredinin net faizi (ödenen faiz - geçici yatırım geliri) bulunur. Sonra genel kredilerin ağırlıklı ortalama oranı, inşaata harcanan genel kredi tutarına uygulanıp özel kredinin net faizine eklenir.","nedir":"Bu konu, bir varlığın inşası için alınan kredilere ödenen faizin ne kadarının o varlığın maliyetine ekleneceğini belirler. Sınav, özel amaçlı ve genel amaçlı kredi faizlerinin hangi kısmının aktifleştirileceğini hesaplayabiliyor musun diye ölçer."},"olay":"özel kredi faizi 1.500.000×%20=300.000; net özel faiz 300.000-47.350=252.650; genel borçlanma toplam faizi (750.000×%16)+(450.000×%20)=120.000+90.000=210.000; ağırlıklı ortalama oran 210.000/1.200.000=%17,5; genel borçlanma payı 400.000×%17,5=70.000; toplam 252.650+70.000=322.650.","tuzak":{"D":{"ad":"Ortalama Oran Karışıklığı Tuzağı","metin":"Öğrenci ağırlıklı ortalamayı bulmak yerine (%16+%20)/2=%18 basit ortalamasını alıp 400.000×%18=72.000 hesaplar, 252.650 ile toplayarak 324.650 bulur. Doğrusu: oran, faiz tutarlarının borç tutarlarına oranıyla ağırlıklandırılır."},"E":{"ad":"Geçici Yatırım Gelirini Düşmeme Tuzağı","metin":"Öğrenci genel borçlanma payını doğru ekler ama özel kredi faizinden 47.350 TL\u0027lik geçici yatırım gelirini düşmeyi unutur, 300.000+70.000=370.000 yazar. Doğrusu: geçici yatırım geliri özel kredi faizinden mutlaka düşülmelidir."},"A":{"ad":"Genel Borçlanma Payını Atlama Tuzağı","metin":"Öğrenci yalnız özel kredinin net faizini (300.000-47.350) hesaplayıp genel borçlanmadan gelen 70.000 TL\u0027lik payı hiç eklemez. Doğrusu: aktifleştirilecek tutar özel kredi net faizi ile genel borçlanma payının toplamıdır."},"B":{"ad":"Katman Atlama Tuzağı","metin":"Öğrenci hem geçici yatırım gelirini düşmeyi hem genel borçlanma payını eklemeyi unutup yalnız 1.500.000×%20=300.000 brüt özel kredi faizini yazar. Doğrusu: her iki katman da hesaba dahil edilmelidir."}},"celdiriciYol":{"D":"(%16+%20)/2=%18; 400.000×%18=72.000; 252.650+72.000=324.650 (ağırlıklı ortalama yerine basit ortalama faiz oranı kullandın)","E":"300.000 + 70.000 = 370.000 (geçici yatırım gelirini toplam tutardan düşmeyi unuttun)","A":"300.000 - 47.350 = 252.650 (genel borçlanma payını atladın, sadece özel kredi net faizini yazdın)","B":"1.500.000 × %20 = 300.000 (hem geçici yatırım gelirini düşmeyi hem genel borçlanma payını eklemeyi unuttun)"},"hap":"TMS 23\u0027e göre özel borçlanmadan elde edilen geçici yatırım geliri aktifleştirilecek faizden düşülür; genel borçlanmalarda ise harcamaya ağırlıklı ortalama kapitalizasyon oranı uygulanır.","teshis":{"C":{"gercek":"Dört katman (özel faiz, geçici gelir düşümü, ağırlıklı ortalama oran, genel pay) sırasıyla uygulanınca TMS 23\u0027e göre doğru toplam 322.650 TL\u0027dir.","ayirt":"Her katmanı sırayla uyguladım mı, birini atlamadım mı?","paragraf":"TMS 23 p.12-17","yanilgi":"Bu kadar çok katmanlı bir hesabın tek şıkta doğru çıkamayacağını düşünüp başka şıkka yönelebilirsin."},"E":{"gercek":"TMS 23 p.12 özel borçlanmadan elde edilen geçici yatırım gelirinin aktifleştirilecek borçlanma maliyetinden düşülmesini açıkça ister.","ayirt":"Krediyi henüz harcamadığım dönemde faiz geliri elde ettim mi, düştüm mü?","paragraf":"TMS 23 p.12","yanilgi":"Geçici yatırım gelirinin sadece bilanço kaleminde gösterileceğini, aktifleştirme hesabını etkilemeyeceğini sanıyorsun."},"A":{"gercek":"TMS 23 p.14, özel borçlanma dışındaki nitelikli varlık harcamaları için genel borçlanmalara ağırlıklı ortalama kapitalizasyon oranı uygulanmasını zorunlu kılar.","ayirt":"Nitelikli varlık için özel kredi dışında başka harcama var mı diye sordum mu?","paragraf":"TMS 23 p.14","yanilgi":"Genel borçlanmalardan yapılan harcamanın da aktifleştirmeye konu olabileceğini fark etmiyorsun, sadece özel krediyi hesaba katıyorsun."},"D":{"gercek":"TMS 23 p.17 ağırlıklı ortalama kapitalizasyon oranını, dönem faiz giderlerinin borç tutarlarına oranı olarak tanımlar.","ayirt":"Oranı bulurken faiz tutarlarını mı yoksa sadece yüzdeleri mi ortaladım?","paragraf":"TMS 23 p.17","yanilgi":"İki farklı faiz oranı olduğunda bunların basit aritmetik ortalamasının yeterli olduğunu düşünüyorsun."},"B":{"gercek":"TMS 23 p.12 özel kredinin geçici yatırım gelirinin düşülmesini, p.14 ise genel borçlanma payının eklenmesini şart koşar.","ayirt":"Hesaplamamda kaç katman var, hepsini kullandım mı?","paragraf":"TMS 23 p.12, p.14","yanilgi":"Geçici yatırım gelirini ve genel borçlanma katmanını ikisini birden atlayarak en basit yolu seçtiğini sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 84"},"kural":"Vergi Usul Kanunu m.262 uyarınca mala doğrudan bağlı nakliye gideri maliyete dahil edilir, genel yönetim gideri dahil edilmez; çıkış ilk giren ilk çıkar sırasına göre yapılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 84","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce her partinin birim maliyetini Vergi Usul Kanunu m.262 kapsamına giren giderlerle düzelt, sonra ilk giren ilk çıkar sırasını uygula.","konu":"fıfo stok değerleme","tablo":{"satirlar":[["VERİLENLER","-"],["1. parti miktarı","800 birim"],["1. parti birim fiyatı","100 TL"],["1. parti nakliye gideri","4.000 TL"],["2. parti miktarı","600 birim"],["2. parti birim fiyatı","110 TL"],["2. parti genel yönetim gideri","3.000 TL"],["satılan miktar","1.000 birim"],["HESAP","-"],["1. Parti toplam maliyeti (80.000 mal bedeli + 4.000 nakliye)","84.000"],["1. Parti birim maliyeti (84.000 / 800 birim)","105"],["2. Parti toplam maliyeti (yalnız 66.000 mal bedeli, genel yönetim gideri hariç)","66.000"],["2. Parti birim maliyeti (66.000 / 600 birim)","110"],["Satılan 800 birim (1. parti) maliyeti","84.000"],["Satılan 200 birim (2. parti) maliyeti","22.000"],["Satılan malın maliyeti (84.000 + 22.000)","106.000"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"106.000","E":"108.000","A":"102.000","D":"107.000","B":"103.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["1. Parti toplam maliyeti (60.000 mal bedeli + 5.000 nakliye)","65.000"],["1. Parti birim maliyeti (65.000 / 500 birim)","130"],["2. Parti toplam maliyeti (yalnız 98.000 mal bedeli, genel yönetim gideri hariç)","98.000"],["2. Parti birim maliyeti (98.000 / 700 birim)","140"],["Satılan 500 birim (1. parti) maliyeti","65.000"],["Satılan 400 birim (2. parti) maliyeti","56.000"],["Kalan 300 birim (2. parti) stok maliyeti (98.000 - 56.000)","42.000"]]},"tur":"tablo","soru":"İşletme, stok çıkışlarını ilk giren ilk çıkar yöntemine göre değerlemektedir. Önce 500 birim mal 120 TL/birimden alınmış, bu alıma ilişkin 5.000 TL nakliye gideri yapılmıştır. Ardından 700 birim mal 140 TL/birimden alınmış, bu alıma ilişkin 3.500 TL genel yönetim gideri katlanılmıştır. Dönemde 900 birim satılmıştır. Buna göre, dönem sonu stok maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve dönem sonu stok maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, stok çıkışlarını ilk giren ilk çıkar yöntemine göre değerlemektedir. Önce 800 birim mal 100 TL/birimden alınmış, bu alıma ilişkin 4.000 TL nakliye gideri yapılmıştır. Ardından 600 birim mal 110 TL/birimden alınmış, bu alıma ilişkin 3.000 TL genel yönetim gideri katlanılmıştır. Dönemde 1.000 birim satılmıştır. Buna göre, satılan malın maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-fmuh-zor/kp-65","verilenler":[{"deger":"800 birim","anlam":"İlk alınan partinin birim sayısı, ilk giren ilk çıkar sırasında önce tükenecek stok.","ad":"1. parti miktarı"},{"deger":"100 TL","anlam":"1. partinin mal bedeli, maliyet hesaplamasının başlangıç tutarı.","ad":"1. parti birim fiyatı"},{"deger":"4.000 TL","anlam":"Mala doğrudan bağlı gider, VUK m.262 gereği 1. parti maliyetine eklenir.","ad":"1. parti nakliye gideri"},{"deger":"600 birim","anlam":"İkinci alınan partinin birim sayısı.","ad":"2. parti miktarı"},{"deger":"110 TL","anlam":"2. partinin mal bedeli.","ad":"2. parti birim fiyatı"},{"deger":"3.000 TL","anlam":"Mala doğrudan bağlı olmadığı için maliyete dahil edilmeyen gider.","ad":"2. parti genel yönetim gideri"},{"deger":"1.000 birim","anlam":"Dönemde çıkışı yapılan toplam stok miktarı, ilk giren ilk çıkar sırasıyla partilere dağıtılır.","ad":"satılan miktar"}],"dayanak":"213 sayılı Vergi Usul Kanunu madde 262","dogru":"C","oyunBonus":null,"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: 1. parti 800 birim × 100 TL/birim (soruda verilen); nakliye 4.000 TL (soruda verilen); 2. parti 600 birim × 110 TL/birim (soruda verilen); genel yönetim gideri 3.000 TL (soruda verilen); satılan 1.000 birim (soruda verilen)","anlatim":"Soru bize şunları vermiş: 1. parti 800 birim × 100 TL, nakliye 4.000 TL (soruda verilen); 2. parti 600 birim × 110 TL, genel yönetim gideri 3.000 TL (soruda verilen); satılan miktar 1.000 birim (soruda verilen).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]]},{"formul":"1. Parti toplam maliyeti = mal bedeli + nakliye = 80.000 (soruda verilen) + 4.000 (soruda verilen) = 84.000 TL","anlatim":"Nakliye gideri mala doğrudan bağlı, o yüzden maliyete girer. Vergi Usul Kanunu m.262 bunu şart koşar.","doldur":[[9,1]]},{"formul":"1. Parti birim maliyeti = 84.000 (1. adımda bulduk) / 800 (soruda verilen) = 105 TL/birim","anlatim":"Birim maliyeti bulmak için toplamı adete bölüyoruz. Bu ilk giren ilk çıkar yönteminde ilk çıkacak partinin fiyatı olacak.","doldur":[[10,1]]},{"formul":"2. Parti toplam maliyeti = mal bedeli = 66.000 (soruda verilen); Dahil değil: genel yönetim gideri 3.000 (soruda verilen)","anlatim":"Genel yönetim gideri mala doğrudan bağlı değil, maliyete girmez. Dahil değil: genel yönetim gideri 3.000 (soruda verilen), gider hesabına yazılır.","doldur":[[11,1]]},{"formul":"2. Parti birim maliyeti = 66.000 (2. adımda bulduk) / 600 (soruda verilen) = 110 TL/birim","anlatim":"Aynı şekilde ikinci partinin birim maliyetini buluyoruz. Bu ilk giren ilk çıkar yönteminde ikinci çıkacak partinin fiyatı.","doldur":[[12,1]]},{"formul":"Satılan 800 birim (1. parti) maliyeti = 800 (soruda verilen) × 105 (3. adımda bulduk) = 84.000 TL","anlatim":"ilk giren ilk çıkar yönteminde önce giren mal önce çıkar, yani ilk parti tamamen satılır. 800 birim tamamen ilk parti fiyatından gider.","doldur":[[13,1]]},{"formul":"Satılan 200 birim (2. parti) maliyeti = 200 (1.000 satılan soruda verilen − 800 önceki adımda bulduk) × 110 (5. adımda bulduk) = 22.000 TL","anlatim":"1.000 birimin 800\u0027ü ilk partiden gitti, kalan 200 birim ikinci partiden çıkar. Bu kalan miktarı ikinci parti fiyatıyla çarpıyoruz.","doldur":[[14,1]]},{"formul":"Satılan malın maliyeti = 84.000 (6. adımda bulduk) + 22.000 (7. adımda bulduk) = 106.000 TL","anlatim":"İki partiden çıkan maliyetleri topluyoruz, satılan malın toplam maliyeti çıkıyor. Bu tutar satışın maliyeti olarak gelir tablosuna gider.","doldur":[[15,1]]},{"formul":"Yanlış yol: (66.000 + 3.000) / 600 = 115 (HATALI) → doğrusu 110 (5. adımda bulduk)","anlatim":"Yanlış yol genel yönetim giderini de maliyete katmaktır. Vergi Usul Kanunu bu gideri maliyete değil döneme yazar.","doldur":[]}],"anahtar":[{"ornek":"maliyeti","kok":"maliye"},{"ornek":"gideri","kok":"gideri"},{"ornek":"yönetim","kok":"yöneti"},{"ornek":"fiyatı","kok":"fiyatı"},{"ornek":"partiden","kok":"partid"},{"ornek":"doğrudan","kok":"doğrud"}],"konuGiris":{"harita":"Ne zaman test edilir: birden fazla alım fiyatıyla stok girişi yapılıp kısmi satış olduğunda. Nasıl ölçülür: giriş sırasına göre önce eski partiden, bitince yeni partiden birim maliyet alınarak toplanır. Nasıl kaydedilir: satılan malın maliyeti tutarı gider hesabına, kalan stok yeni partinin birim maliyetiyle bilançoya yazılır.","desen":"Sınav genellikle iki farklı alım fiyatı ve bunlara karışık şekilde eklenen giderler (nakliye maliyete girer, genel yönetim gideri girmez) vererek dikkat dağıtır. Öğrenci genel yönetim giderini de maliyete katarsa yanlış sonuca ulaşır. Bu soru maliyete dahil edilecek giderin ayrıştırılması noktasından geliyor (p.28, Vergi Usul Kanunu m.262).","terimler":[{"kaynak":"soruda verilir","tanim":"Malın alış bedeli ile doğrudan ilgili nakliye, gümrük gibi giderlerin toplamı","ad":"Maliyet bedeli","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Malın alımıyla doğrudan ilgili olmayan, maliyete dahil edilmeyen dönem gideri","ad":"Genel yönetim gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Her alımın toplam maliyetinin o alımdaki birim sayısına bölünmesiyle bulunan tutar","ad":"Parti (kademe) birim maliyeti","kim":"piyasa fiyatlar belirler"},{"kaynak":"sen hesaplarsın","tanim":"ilk giren ilk çıkar (FIFO) sırasına göre satılan birimlerin ait olduğu partilerin maliyetleri toplamı","ad":"Satılan malın maliyeti","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"İki farklı alım partisinin miktar, birim fiyat ve giderleri verilip toplam satış miktarına göre satılan malın maliyeti istenir.","panel_ornek":"Bir kırtasiyeci önce 50 adet defteri 3 TL\u0027den, sonra 30 adet aynı defteri 4 TL\u0027den almış; 60 defter satınca ilk aldığı 50 tanesini önce, kalan 10 tanesini ikinci partiden düşer. Yani eski ve ucuz mal önce tükenmiş sayılır.","ornek":"Bir kırtasiyeci önce 50 adet defteri 3 TL\u0027den, sonra 30 adet aynı defteri 4 TL\u0027den almış; 60 defter satınca ilk aldığı 50 tanesini önce, kalan 10 tanesini ikinci partiden düşer. Yani eski ve ucuz mal önce tükenmiş sayılır.","yontemler":"ilk giren ilk çıkar yönteminde yalnızca ilgili giderler (nakliye gibi) maliyete eklenir; genel yönetim gideri gibi dolaylı giderler maliyete dahil edilmez.","nedir":"ilk giren ilk çıkar (FIFO), stok çıkışlarının ilk giren malın ilk çıktığı varsayımıyla değerlenmesidir; sınav satılan malın maliyetini bu sıraya göre doğru hesaplayıp hesaplamadığını ölçer."},"olay":"1. parti birim maliyeti (84.000/800)=105, 2. parti birim maliyeti (66.000/600)=110; 800 birim x 105 + 200 birim x 110 = 84.000+22.000=106.000.","tuzak":{"D":{"ad":"Kapsam Genişletme Tuzağı","metin":"Genel yönetim giderini de maliyete katarak 2. parti birim maliyetini 115 TL yapıp 800x105+200x115=107.000 bulursun. Doğrusu: genel yönetim gideri mala doğrudan bağlı olmadığından maliyete dahil edilmez."},"E":{"ad":"Sıra Karıştırma Tuzağı","metin":"İlk giren ilk çıkar yerine son giren ilk çıkar mantığıyla önce 2. partiyi düşüp 600x110+400x105=108.000 bulursun. Doğrusu: ilk giren ilk çıkar yönteminde satış önce en eski partiden (1. parti) düşülür."},"A":{"ad":"Nakliye Giderini Dışlama Tuzağı","metin":"Nakliyeyi maliyete katmadan 800x100+200x110 hesabıyla 102.000 bulursun. Doğrusu: nakliye giderinin malın iktisabıyla doğrudan ilgili olması nedeniyle 1. parti maliyetine eklenmesi gerekir."},"B":{"ad":"Çifte Hata Tuzağı","metin":"Nakliyeyi hariç tutup genel yönetim giderini dahil ederek 800x100+200x115=103.000 bulursun. Doğrusu: nakliye dahil edilir, genel yönetim gideri dahil edilmez, bu iki hatanın toplanması sonucu bozar."}},"celdiriciYol":{"D":"800x105 + 200x115 = 84.000+23.000 = 107.000 (genel yönetim giderini maliyete dahil ettin)","E":"600x110 + 400x105 = 66.000+42.000 = 108.000 (ilk giren ilk çıkar yerine son giren ilk çıkar sırasını uyguladın)","A":"800x100 + 200x110 = 80.000+22.000 = 102.000 (nakliye giderini maliyete dahil etmeyi atladın)","B":"800x100 + 200x115 = 80.000+23.000 = 103.000 (nakliyeyi atladın ve genel yönetim giderini yanlışlıkla maliyete kattın)"},"hap":"İlk giren ilk çıkar yönteminde satılan malın maliyeti en eski partiden başlanarak sırayla hesaplanır; parti maliyetine yalnız mala doğrudan bağlı giderler dahil edilir, genel yönetim gideri dahil edilmez.","teshis":{"C":{"gercek":"VUK m.262/a nakliye gibi doğrudan bağlı giderleri maliyete dahil eder; m.262 kapsamı dışındaki genel yönetim gideri dahil edilmez.","ayirt":"Bu gider malın stoklara girmesiyle mi yoksa genel yönetim faaliyetiyle mi ilgili?","paragraf":"VUK m.262/a, ç","yanilgi":"Bu şıkkı eleyenler, nakliye giderinin de tıpkı genel yönetim gideri gibi maliyete dahil edilmemesi gerektiğini sanır."},"E":{"gercek":"İlk giren ilk çıkar yönteminde satışlar önce en eski partiden düşülür, sondan değil.","ayirt":"Hangi parti önce stoklara girdi, satış ondan mı düşüldü?","paragraf":"THP 153 işleyişi","yanilgi":"İlk giren ilk çıkar yöntemini son giren ilk çıkar mantığıyla karıştırıyorsun."},"A":{"gercek":"VUK m.262/a\u0027ya göre iktisadi kıymetin iktisabıyla doğrudan ilgili yükleme-nakliye giderleri maliyet bedeline dahildir.","ayirt":"Bu gider malın işletmeye getirilmesiyle doğrudan ilgili mi?","paragraf":"VUK m.262/a","yanilgi":"Nakliye gibi mala doğrudan bağlı giderlerin maliyete değil doğrudan gidere yazılacağını düşünüyorsun."},"D":{"gercek":"VUK m.262 yalnız iktisapla doğrudan ilgili giderleri sayar; genel yönetim gideri bu kapsamda değildir.","ayirt":"Bu gider malın alınmasıyla mı yoksa işletmenin genel idaresiyle mi ilgili?","paragraf":"VUK m.262","yanilgi":"Her satın alma gideri stok maliyetine girer sanıyorsun."},"B":{"gercek":"Nakliye gideri maliyete dahildir, genel yönetim gideri değildir; her ikisi ayrı kurallara tabidir.","ayirt":"Her gideri tek tek doğrudan ilgili mi diye ayrı sorguladım mı?","paragraf":"VUK m.262/a, ç","yanilgi":"Hem nakliyeyi hariç tutup hem de ilgisiz bir gideri maliyete katarak iki hatayı birden yapıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 117"},"kural":"3065 sayılı Katma Değer Vergisi Kanunu m.24 uyarınca taşıma-yükleme-boşaltma giderleri, ambalaj-sigorta-komisyon gibi gider karşılıkları ve vade farkı-fiyat farkı-kur farkı-faiz-prim gibi gelirler matraha dahildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 117","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Matraha dahil olmayan bir kalem aramadan önce, m.24\u0027te sayılan taşıma, ambalaj, sigorta, komisyon, vade farkı gibi tüm kalemleri tek tek listeleyip topla; atlanan tek kalem sonucu değiştirir.","konu":"kdv matrahına dahil unsurlar","tablo":{"satirlar":[["VERİLENLER","-"],["Mal bedeli","200.000 TL"],["Taşıma gideri","10.000 TL"],["Ambalaj gideri","5.000 TL"],["Sigorta gideri","3.000 TL"],["Komisyon gideri","2.000 TL"],["Vade farkı","8.000 TL"],["KDV oranı","%20"],["HESAP","-"],["Taşıma + Ambalaj Gideri","15.000"],["Sigorta + Komisyon Gideri","5.000"],["Vade Farkı","8.000"],["Toplam KDV Matrahı","228.000"],["Hesaplanan KDV (228.000 x %20)","45.600"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"45.000","E":"46.600","A":"42.600","D":"45.600","B":"44.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Nakliye + Paketleme Gideri","10.000"],["Sigorta + Komisyon Gideri","4.000"],["Vade Farkı","6.000"],["Toplam KDV Matrahı","170.000"],["Hesaplanan KDV (170.000 x %18)","30.600"]]},"tur":"tablo","soru":"İşletme, bir mal tesliminde 150.000 TL mal bedeline ek olarak 6.000 TL nakliye, 4.000 TL paketleme, 2.500 TL sigorta, 1.500 TL komisyon gideri ile 6.000 TL vade farkı tahsil etmiştir. KDV oranı %18 olduğuna göre, bu teslime ilişkin hesaplanan KDV tutarı kaç TL\u0027dir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve Hesaplanan KDV tutarının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, bir mal tesliminde 200.000 TL mal bedeline ek olarak 10.000 TL taşıma, 5.000 TL ambalaj, 3.000 TL sigorta, 2.000 TL komisyon gideri ile 8.000 TL vade farkı tahsil etmiştir. KDV oranı %20 olduğuna göre, bu teslime ilişkin hesaplanan KDV tutarı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-vergi-zor/kp-24","verilenler":[{"deger":"200.000 TL","anlam":"KDV matrahının esas unsuru olan satış bedeli","ad":"Mal bedeli"},{"deger":"10.000 TL","anlam":"Katma Değer Vergisi Kanunu m.24/a gereği matraha dahil edilecek taşıma-yükleme-boşaltma gideri","ad":"Taşıma gideri"},{"deger":"5.000 TL","anlam":"Katma Değer Vergisi Kanunu m.24/b gereği matraha dahil ambalaj gideri","ad":"Ambalaj gideri"},{"deger":"3.000 TL","anlam":"Katma Değer Vergisi Kanunu m.24/b gereği matraha dahil sigorta bedeli","ad":"Sigorta gideri"},{"deger":"2.000 TL","anlam":"Katma Değer Vergisi Kanunu m.24/b gereği matraha dahil komisyon","ad":"Komisyon gideri"},{"deger":"8.000 TL","anlam":"Katma Değer Vergisi Kanunu m.24/c gereği matraha dahil vade farkı","ad":"Vade farkı"},{"deger":"%20","anlam":"Toplam matraha uygulanarak hesaplanan KDV\u0027yi bulmak için kullanılan oran","ad":"KDV oranı"}],"dayanak":"3065 sayılı Katma Değer Vergisi Kanunu m.24","dogru":"D","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Verilen: Mal bedeli 200.000 (soruda verilen); Taşıma 10.000 (soruda verilen); Ambalaj 5.000 (soruda verilen); Sigorta 3.000 (soruda verilen); Komisyon 2.000 (soruda verilen); Vade farkı 8.000 (soruda verilen); KDV oranı %20 (soruda verilen)","anlatim":"Soru bize şunları vermiş: mal bedeli 200.000 TL, taşıma 10.000 TL, ambalaj 5.000 TL, sigorta 3.000 TL, komisyon 2.000 TL, vade farkı 8.000 TL ve KDV oranı %20. Bunların hepsi soru metninde doğrudan sayılmış.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[11,1]]},{"formul":"Kapsam: mal bedeli + teslimle ilgili giderler + fiyat farkı unsurları","anlatim":"KDV matrahı nedir? Katma Değer Vergisi Kanunu madde 24\u0027e göre teslim bedeline bağlı taşıma, yükleme, ambalaj, sigorta, komisyon gibi gider karşılıkları matraha girer. Dikkat: bunlar ayrı fatura edilse bile aynı işleme bağlı oldukları için matrahtan ayrılmaz.","doldur":[]},{"formul":"Taşıma + Ambalaj = 10.000 (soruda verilen) + 5.000 (soruda verilen) = 15.000","anlatim":"Şimdi taşıma ile ambalaj giderini topluyoruz, çünkü ikisi de teslime bağlı doğrudan giderler. Bu toplam matraha eklenecek ilk parça.","doldur":[[9,1]]},{"formul":"Sigorta + Komisyon = 3.000 (soruda verilen) + 2.000 (soruda verilen) = 5.000","anlatim":"Sigorta ve komisyon giderlerini de topluyoruz, bunlar da kanunun saydığı gider karşılığı türünden. Ayrı ayrı fatura edilmiş olmaları matraha girmelerine engel değil.","doldur":[[10,1]]},{"formul":"Kapsam: vade farkı = ödeme vadesi nedeniyle alınan ek bedel = 8.000 (soruda verilen)","anlatim":"Vade farkı nedir? Alıcının vadeli ödeme yaptığı için üstüne binen ek tutardır, kanun bunu da matraha dahil eder. Dikkat: vade farkı ayrı bir finansman geliri gibi görünse de KDV\u0027den istisna değildir.","doldur":[]},{"formul":"Toplam KDV Matrahı = Mal bedeli + (Taşıma+Ambalaj) + (Sigorta+Komisyon) + Vade farkı = 200.000 (soruda verilen) + 15.000 (3. adımda bulduk) + 5.000 (4. adımda bulduk) + 8.000 (soruda verilen) = 228.000","anlatim":"Şimdi bütün unsurları topluyoruz, çünkü KDV matrahı tek bir tutar olarak hesaplanır. Mal bedeli ile yukarıdaki üç toplamı bir araya getiriyoruz.","doldur":[[12,1]]},{"formul":"Hesaplanan KDV = Toplam KDV Matrahı × %20 = 228.000 (5. adımda bulduk) × %20 = 45.600","anlatim":"Şimdi hesaplanan KDV\u0027yi buluyoruz, matrahı oranla çarpıyoruz. Bu işlem her KDV hesabında aynı mantıkla yapılır: matrah × oran.","doldur":[[13,1]]},{"formul":"Sonuç: Hesaplanan KDV = 45.600 TL (6. adımda bulduk)","anlatim":"Sonuç: Hesaplanan KDV 45.600 TL\u0027dir. Bütün unsurlar matraha girdiği için bu tutar doğrudan bulunur.","doldur":[]},{"formul":"Yanlış yol: Sadece 200.000 × %20 = 40.000 (HATALI) → doğrusu 228.000 × %20 = 45.600 (6. adımda bulduk)","anlatim":"En sık hata: vade farkı veya komisyon gibi kalemleri \u0027ayrı işlem\u0027 sanıp matrahtan çıkarmak. Bunlar teslimle bağlantılı olduğu için kanun gereği matraha eklenir, çıkarılırsa yanlış sonuç çıkar.","doldur":[]}],"anahtar":[{"ornek":"matrahına","kok":"matrah"},{"ornek":"komisyon","kok":"komisy"},{"ornek":"taşıma","kok":"taşıma"},{"ornek":"sigorta","kok":"sigort"},{"ornek":"ambalaj","kok":"ambala"},{"ornek":"bunların","kok":"bunlar"}],"konuGiris":{"harita":"Ne zaman test edilir: mal/hizmet bedeline ek giderler olduğunda. Nasıl ölçülür: tüm ek unsurlar bedele eklenerek matrah bulunur. Nasıl kaydedilir: matrah üzerinden oran uygulanıp KDV hesaplanır.","desen":"Sınav genelde bazı giderlerin matraha dahil olup olmadığını karıştırmaya çalışır. Öğrenci taşıma, ambalaj, sigorta, komisyon ve vade farkını unutup yalnız mal bedelini esas alabilir. Bu soru KDVK m.24 hükmünden geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"KDV\u0027nin üzerinden hesaplandığı toplam tutar","ad":"Matrah","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"satıcının teslimle ilgili yaptığı ek masraflar, matraha dahildir","ad":"Taşıma-ambalaj-sigorta-komisyon gideri","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"geç ödeme nedeniyle alınan ek gelir, matraha dahildir","ad":"Vade farkı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"matraha uygulanan yüzdelik vergi katsayısı","ad":"KDV oranı","kim":"kanun sabitler"}],"sinavda":"Mal bedeli ve çeşitli ek giderler verilip toplam KDV tutarı istenir.","panel_ornek":"Bir arkadaşın ikinci el bisiklet satıyor: 1.000 TL bisiklet fiyatına 50 TL kargo, 20 TL kutu ücreti ekliyor. Alıcı toplamda 1.070 TL ödüyor, işte KDV de bu toplam üzerinden hesaplanır.","ornek":"Bir arkadaşın ikinci el bisiklet satıyor: 1.000 TL bisiklet fiyatına 50 TL kargo, 20 TL kutu ücreti ekliyor. Alıcı toplamda 1.070 TL ödüyor, işte KDV de bu toplam üzerinden hesaplanır.","yontemler":"Tüm ek unsurlar mal bedeline eklenip matrah bulunur, sonra oran uygulanır.","nedir":"KDV matrahı, verginin hesaplanacağı tutarı belirler. Sınav, hangi ek giderlerin bu tutara dahil olduğunu ölçer."},"olay":"200.000+10.000+5.000+3.000+2.000+8.000=228.000; 228.000x%20=45.600.","tuzak":{"C":{"ad":"Kavram Tuzağı","metin":"Sigorta bedelinin satıcının kendi rizikosu için yaptığı gider olduğunu düşünüp matraha dahil etmemiştir (200.000+10.000+5.000+2.000+8.000=225.000; 225.000x%20=45.000). Doğrusu: Kanun sigortayı ambalaj ve komisyonla birlikte gider karşılığı olarak sayar."},"E":{"ad":"Mükerrer Sayım Tuzağı","metin":"Ambalaj giderini hem taşıma kalemiyle birlikte hem ayrıca ikinci kez toplamıştır (228.000+5.000=233.000; 233.000x%20=46.600). Doğrusu: Her gider kalemi matraha yalnızca bir kez eklenir."},"A":{"ad":"Toplama Eksikliği Tuzağı","metin":"Taşıma ve ambalaj giderlerinin matraha dahil olduğunu atlayıp yalnız sigorta, komisyon ve vade farkını mal bedeline eklemiştir (200.000+3.000+2.000+8.000=213.000; 213.000x%20=42.600). Doğrusu: Katma Değer Vergisi Kanunu m.24/a taşıma-yükleme-boşaltma giderini de matraha dahil eder."},"B":{"ad":"Zamanlama/Kapsam Tuzağı","metin":"Vade farkının teslimden sonra ortaya çıktığını düşünüp matrah dışında bırakmıştır (200.000+10.000+5.000+3.000+2.000=220.000; 220.000x%20=44.000). Doğrusu: Katma Değer Vergisi Kanunu m.24/c vade farkını teslim anına bakılmaksızın matraha dahil sayar."}},"celdiriciYol":{"C":"(200.000+10.000+5.000+2.000+8.000)x%20 = 45.000 (sigorta gideri matraha dahil edilmemiş)","E":"(228.000+5.000)x%20 = 46.600 (ambalaj gideri mükerrer sayılmış)","A":"(200.000+3.000+2.000+8.000)x%20 = 42.600 (taşıma ve ambalaj gideri matrahtan dışlanmış)","B":"(200.000+10.000+5.000+3.000+2.000)x%20 = 44.000 (vade farkı matraha dahil edilmemiş)"},"hap":"Katma Değer Vergisi Kanunu m.24 uyarınca taşıma, ambalaj, sigorta, komisyon gibi gider karşılıkları ile vade farkı, fiyat farkı, kur farkı, faiz ve prim gibi gelirler KDV matrahına dahildir.","teshis":{"C":{"gercek":"Katma Değer Vergisi Kanunu m.24/b sigortayı ambalaj ve komisyonla birlikte \u0027gider karşılığı\u0027 olarak matraha dahil sayar.","ayirt":"Bu gider karşılığı, teslime bağlı olarak alıcıya yansıtılan bir bedel mi?","paragraf":"KDVK m.24/b","yanilgi":"Sigorta giderinin satıcının kendi rizikosunu karşılamak için yaptığı bir masraf olduğunu, alıcıya yüklenen bir bedel sayılmayacağını düşünüyorsun."},"E":{"gercek":"Her gider kalemi Katma Değer Vergisi Kanunu m.24 kapsamında matraha yalnızca bir defa dahil edilir; mükerrer sayım matrahı gerçek dışı büyütür.","ayirt":"Aynı gider kalemini hesaplamada iki farklı satırda mı kullandım?","paragraf":"KDVK m.24/b","yanilgi":"Ambalaj giderinin hem taşıma sürecinin hem de ayrı bir kalemin parçası olduğunu düşünüp iki kez saymışsındır."},"A":{"gercek":"Katma Değer Vergisi Kanunu m.24/a, teslim alanın gösterdiği yere kadar yapılan taşıma-yükleme-boşaltma giderlerini açıkça matraha dahil eder.","ayirt":"Bu gider, malın alıcıya ulaşması için satıcı tarafından yapılmış mı?","paragraf":"KDVK m.24/a","yanilgi":"Taşıma ve ambalaj giderlerinin satıcının kendi iç maliyeti olduğunu, alıcıya yansıtılmadığı için matrahı etkilemeyeceğini düşünüyorsun."},"D":{"gercek":"Katma Değer Vergisi Kanunu m.24, taşıma, ambalaj, sigorta, komisyon gibi gider karşılıklarını ve vade farkı gibi gelirleri TEK TEK sayarak hepsinin matraha dahil olduğunu belirtir.","ayirt":"Kanunun m.24\u0027te saydığı altı unsurdan hiçbirini atlamadan mı topladım?","paragraf":"KDVK m.24","yanilgi":"Bu kadar çok kalemin tek tek toplanması gerektiğine inanmayıp bir kısmını gözden kaçırıyorsun."},"B":{"gercek":"Katma Değer Vergisi Kanunu m.24/c vade farkını \u0027çeşitli gelirler\u0027 arasında sayarak açıkça matraha dahil eder.","ayirt":"Bu gelir, teslimle bağlantılı olarak alıcıdan tahsil edildi mi?","paragraf":"KDVK m.24/c","yanilgi":"Vade farkının teslim bedelinden ayrı, sonradan doğan bir finansman geliri olduğu için matraha girmeyeceğini düşünüyorsun."}},"verilen":[[11,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 86"},"kural":"Fazlalık düzeltilmezse stoklar az gösterilir, satılan malın maliyeti yüksek çıkar, kâr olumsuz etkilenir; noksanlık düzeltilmezse stoklar fazla gösterilir, kâr olumlu etkilenir; iki etki netleştirilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 86","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce her depodaki fark miktarını ve yönünü (fazla=olumsuz, noksan=olumlu) ayrı belirle, sonra tutarları netleştirerek tek sonuca in.","konu":"stok sayım fazlası","tablo":{"satirlar":[["VERİLENLER","-"],["A deposu kayıtlı miktar","1.000 br"],["A deposu sayım miktarı","1.200 br"],["A deposu birim maliyet","40 TL"],["B deposu kayıtlı miktar","800 br"],["B deposu sayım miktarı","700 br"],["B deposu birim maliyet","60 TL"],["HESAP","-"],["A deposu (X) fazlalığı: 200 br x 40 TL","8.000 (olumsuz)"],["B deposu (Y) noksanlığı: 100 br x 60 TL","6.000 (olumlu)"],["Net etki (8.000 olumsuz - 6.000 olumlu)","2.000 (olumsuz)"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"6.000 olumsuz","E":"8.000 olumsuz","A":"2.000 olumsuz","D":"8.000 olumlu","B":"6.000 olumlu"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["P deposu (M) fazlalığı: 250 br x 30 TL","7.500 (olumsuz)"],["N deposu (R) noksanlığı: 80 br x 50 TL","4.000 (olumlu)"],["Net etki (7.500 olumsuz - 4.000 olumlu)","3.500 (olumsuz)"]]},"tur":"tablo","soru":"İşletmenin stok sayımında P deposunda M mamulünde kayıtlı 900 br yerine 1.150 br (birim maliyet 30 TL), N deposunda R mamulünde kayıtlı 500 br yerine 420 br (birim maliyet 50 TL) sayılmıştır. Denetçiye göre düzeltilmemiş net etkinin dönem kârı üzerindeki yönünü ve tutarını bul.","verilen":[],"hedef":"Tabloyu doldur ve net etkinin dönem kârı üzerindeki yönünü ve tutarını bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin stok sayımında A deposunda X mamulünde kayıtlı 1.000 br yerine 1.200 br (birim maliyet 40 TL), B deposunda Y mamulünde kayıtlı 800 br yerine 700 br (birim maliyet 60 TL) sayılmıştır. Denetçiye göre düzeltilmemiş net etkinin dönem kârı üzerindeki yönü ve tutarı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t2-denetim-zor/kp-22","verilenler":[{"deger":"1.000 br","anlam":"X mamulünün defter (kayıtlı) stok miktarı, fazlalığı bulmak için sayım miktarından çıkarılır.","ad":"A deposu kayıtlı miktar"},{"deger":"1.200 br","anlam":"Fiziki sayımda bulunan miktar; kayıtlı miktardan 200 br fazladır.","ad":"A deposu sayım miktarı"},{"deger":"40 TL","anlam":"A deposundaki fazlalığın parasal tutarını (200x40) bulmak için kullanılır.","ad":"A deposu birim maliyet"},{"deger":"800 br","anlam":"Y mamulünün defter (kayıtlı) stok miktarı, noksanlığı bulmak için sayım miktarıyla karşılaştırılır.","ad":"B deposu kayıtlı miktar"},{"deger":"700 br","anlam":"Fiziki sayımda bulunan miktar; kayıtlı miktardan 100 br azdır.","ad":"B deposu sayım miktarı"},{"deger":"60 TL","anlam":"B deposundaki noksanlığın parasal tutarını (100x60) bulmak için kullanılır.","ad":"B deposu birim maliyet"}],"dayanak":"BDS 450 Bağımsız Denetim Sırasında Belirlenen Yanlışlıkların Değerlendirilmesi, p.11","dogru":"A","oyunBonus":null,"ders":"Denetim","adimlar":[{"formul":"Verilen: A deposu kayıtlı 1.000 br, sayılan 1.200 br, birim maliyet 40 TL (soruda verilen); B deposu kayıtlı 800 br, sayılan 700 br, birim maliyet 60 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: A deposunda X mamulü kayıtlı 1.000 br yerine sayımda 1.200 br çıkmış, birim maliyeti 40 TL. B deposunda Y mamulü kayıtlı 800 br yerine 700 br çıkmış, birim maliyeti 60 TL.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]]},{"formul":"A deposu fazlalık miktarı = sayılan − kayıtlı = 1.200 (soruda verilen) − 1.000 (soruda verilen) = 200 br","anlatim":"Sayım fazlası nedir? Depoda kayıttan fazla mal çıkmasıdır - düzeltilmezse defterdeki stok gerçekte olandan az görünür. Bu da satılan malın maliyetini gereğinden yüksek gösterir, kâr olumsuz etkilenir.","doldur":[]},{"formul":"A deposu fazlalık tutarı = fazlalık miktarı × birim maliyet = 200 (2. adımda bulduk) × 40 (soruda verilen) = 8.000 TL (olumsuz)","anlatim":"Şimdi bu fazlalığın tutarını buluyoruz - miktar farkını birim maliyetle çarpıyoruz. Bu 8.000 TL, kârı olumsuz yönde etkileyecek.","doldur":[[8,0],[8,1]]},{"formul":"B deposu noksanlık miktarı = kayıtlı − sayılan = 800 (soruda verilen) − 700 (soruda verilen) = 100 br","anlatim":"Sayım noksanı nedir? Depoda kayıttan az mal çıkmasıdır - düzeltilmezse stok olduğundan fazla görünür. Bu da maliyeti düşük gösterir, kâr olumlu etkilenir.","doldur":[]},{"formul":"B deposu noksanlık tutarı = noksanlık miktarı × birim maliyet = 100 (4. adımda bulduk) × 60 (soruda verilen) = 6.000 TL (olumlu)","anlatim":"Aynı mantıkla noksanlık tutarını hesaplıyoruz. Bu 6.000 TL, kârı olumlu yönde etkileyecek.","doldur":[[9,0],[9,1]]},{"formul":"Net etki = olumsuz etki − olumlu etki = 8.000 (3. adımda bulduk) − 6.000 (5. adımda bulduk) = 2.000 TL (olumsuz)","anlatim":"İki etkiyi netleştiriyoruz çünkü biri kârı düşürüyor biri artırıyor - ikisi aynı anda yaşanıyor. Büyük olan etki yön belirler.","doldur":[[10,0],[10,1]]},{"formul":"Sonuç: Net etki = 2.000 TL (olumsuz) (6. adımda bulduk)","anlatim":"Sonuç: düzeltme yapılmazsa dönem kârı 2.000 TL olumsuz etkilenir. Yön belirleyici olan A deposundaki fazlalığın tutarca daha büyük olmasıdır.","doldur":[]},{"formul":"Ters durum: A\u0027da noksan, B\u0027de fazla olsaydı → A\u0027nın etkisi olumlu, B\u0027nin etkisi olumsuz olurdu","anlatim":"Ters durumda ne olurdu? A deposunda noksan, B deposunda fazla çıksaydı roller değişirdi.","doldur":[]},{"formul":"Yanlış yol: 8.000 + 6.000 = 14.000 TL (HATALI) → doğrusu 8.000 − 6.000 = 2.000 TL olumsuz (6. adımda bulduk)","anlatim":"En sık hata: öğrenci iki tutarı toplayıp 14.000 TL der, oysa etkiler zıt yönlü olduğu için toplanmaz, netleştirilir. Ayrıca fazlalığı olumlu, noksanı olumsuz sanmak da ters yönde bir hatadır.","doldur":[]}],"anahtar":[{"ornek":"etkileri","kok":"etkile"},{"ornek":"düzeltilmezse","kok":"düzelt"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"noksanlığı","kok":"noksan"},{"ornek":"olumsuz","kok":"olumsu"},{"ornek":"fazlalığı","kok":"fazlal"}],"konuGiris":{"harita":"Ne zaman test edilir: denetçi fiili sayım sonuçlarını kayıtlı stok tutarıyla karşılaştırdığında test edilir. Nasıl ölçülür: her kalemdeki miktar farkı birim maliyetle çarpılıp fazlalık ve eksiklik tutarları ayrı hesaplanarak net etki bulunur. Nasıl kaydedilir: net etki düzeltilmemiş yanlışlık olarak biriktirilir ve kârı artırıcı ya da azaltıcı yön belirtilerek raporlanır.","desen":"Soru iki farklı depoda hem fazla hem noksan çıkan kalemleri birlikte vererek öğrencinin yönleri ayrı ayrı hesaplayıp doğru işaretle toplamasını test eder. Tuzak, fazlalığı ve noksanı aynı yöne toplamak veya birim maliyetleri karıştırmaktır (BDS 450 p.11). Bu soru düzeltilmemiş yanlışlıkların net etkisinin değerlendirilmesi noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Fiili sayımda kayıtlı miktarı aşan kısım, kârı artırıcı yanlışlıktır","ad":"Sayım fazlası","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"soruda verilir","tanim":"Fiili sayımda kayıtlı miktarın altında kalan kısım, kârı azaltıcı yanlışlıktır","ad":"Sayım noksanı","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"sen hesaplarsın","tanim":"Denetim boyunca biriktirilmiş ancak finansal tablolarda düzeltilmemiş fark tutarı","ad":"Düzeltilmemiş yanlışlık","kim":"standart (BDS) sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Fazlalık tutarından noksan tutarının çıkarılmasıyla kalan toplam kâr etkisi","ad":"Net etki","kim":"denetçi mesleki yargıyla belirler"}],"sinavda":"İki depodaki kayıtlı ve sayılan miktarlar ile birim maliyetler verilir, net kâr etkisinin yönü ve tutarı istenir.","panel_ornek":"Bir gencin dolabında kayıtlarda 10 tişört yazarken sayımda 12 tişört çıkmış, her tişört 5 TL değerinde sayılmış; başka bir çekmecede kayıtlı 8 çorap yerine 6 çorap bulunmuş, çorap birim değeri 3 TL. Fazla çıkan tişörtler kayıtlı değeri artırır, eksik çıkan çoraplar azaltır; ikisi net etkide birleştirilir.","ornek":"Bir gencin dolabında kayıtlarda 10 tişört yazarken sayımda 12 tişört çıkmış, her tişört 5 TL değerinde sayılmış; başka bir çekmecede kayıtlı 8 çorap yerine 6 çorap bulunmuş, çorap birim değeri 3 TL. Fazla çıkan tişörtler kayıtlı değeri artırır, eksik çıkan çoraplar azaltır; ikisi net etkide birleştirilir.","yontemler":"Her kalemde (sayılan-kayıtlı) miktar farkı birim maliyetle çarpılır, fazlalık ve noksanlık tutarları ayrı bulunup cebirsel olarak toplanır; en kritik kural fazlalığın kârı artırdığı, noksanlığın azalttığıdır.","nedir":"Stok sayım farkları, kayıtlı miktar ile fiili sayım miktarı arasındaki farkın kâr üzerindeki etkisini gösterir. Sınav burada denetçinin düzeltilmemiş yanlışlığın yönünü ve tutarını doğru hesaplayıp hesaplayamadığını ölçer."},"olay":"A deposu 200 br x 40 TL = 8.000 TL olumsuz; B deposu 100 br x 60 TL = 6.000 TL olumlu; net = 8.000-6.000 = 2.000 TL olumsuz.","tuzak":{"C":{"ad":"Yön Tersine Çevirme Tuzağı","metin":"B deposundaki noksanlığın kârı artırıcı (olumlu) olduğunu unutup olumsuz sayarsın, ayrıca A deposunu hiç hesaba katmazsın. Doğrusu: Noksanlık düzeltilmezse kâr yüksek gösterilir, yani etki olumludur."},"E":{"ad":"Kapsam Atlama Tuzağı","metin":"A deposunun 8.000 TL\u0027lik olumsuz etkisini doğru yönle bulup B deposundaki noksanlığı hesaba katmayı unutursun. Doğrusu: İki depodaki fark birlikte netleştirilmeden sonuca gidilemez."},"D":{"ad":"Yön Tersine Çevirme Tuzağı","metin":"A deposundaki fazlalığı otomatik olarak kâr artırıcı sanırsın, oysa fazlalık düzeltilmezse kâr düşük gösterilir; ayrıca B deposunu hesaba katmazsın. Doğrusu: Fazlalığın etkisi olumsuzdur ve netleştirme B ile birlikte yapılmalıdır."},"B":{"ad":"Miktar Atlama Tuzağı","metin":"B deposu farkını (100x60=6.000) doğru yönle (olumlu) hesaplayıp A deposu fazlalığını değerlendirmeyi unutursun. Doğrusu: A deposunun 8.000 TL\u0027lik olumsuz etkisi de netleştirmeye katılmalıdır."}},"celdiriciYol":{"C":"100 × 60 = 6.000, yön ters çevrilir (kâr artırıcıyken kâr azaltıcı sayılır) ve A deposu hesaba katılmaz","E":"200 × 40 = 8.000 (A deposu fazlalığı doğru yönle hesaplanır ama B deposu noksanlığı netleştirmeye katılmaz)","D":"200 × 40 = 8.000, yön ters çevrilir (kâr azaltıcıyken kâr artırıcı sayılır) ve B deposu hesaba katılmaz","B":"100 × 60 = 6.000 (B deposu noksanlığı doğru yönle hesaplanır ama A deposu fazlalığı netleştirmeye katılmaz)"},"hap":"Stok fazlalığı düzeltilmezse kâr düşük, stok noksanlığı düzeltilmezse kâr yüksek gösterilir; denetçi bu etkileri netleştirerek değerlendirir.","teshis":{"C":{"gercek":"Kayıtlı miktar fiziki sayımdan fazlaysa dönem sonu stok değeri kayıtta yüksek kalır, satılan malın maliyeti düşük hesaplanır ve kâr yüksek (olumlu) gösterilir.","ayirt":"Stok kayıtta mı yoksa fizikte mi daha az, bu hangi yöne kâr yaratır?","paragraf":"BDS 450 p.11","yanilgi":"Noksanlığın kayıtlı stoku fazla gösterdiğini, dolayısıyla kârı şişirdiğini değil, düşürdüğünü düşünürsün."},"E":{"gercek":"Soruda iki bağımsız depo farkı verilmiştir; denetçi tek kalemi değil toplam (net) etkiyi raporlar.","ayirt":"Soruda birden fazla kalem var mı, hepsini işleme kattım mı?","paragraf":"BDS 450 p.11","yanilgi":"Bir depodaki farkı doğru hesapladığın için sorunun tamamlandığını düşünürsün."},"A":{"gercek":"BDS 450 kapsamında denetçi tespit edilen tüm düzeltilmemiş yanlışlıkları kümülatif olarak, yönleriyle birlikte netleştirerek değerlendirir.","ayirt":"Bu iki farkı ayrı ayrı mı yoksa toplamda mı değerlendiriyorum?","paragraf":"BDS 450 p.11","yanilgi":"Bu şıkkı eleyen öğrenci, iki farklı depodaki farkın ayrı ayrı kalıp birbirini etkilemeyeceğini düşünür."},"D":{"gercek":"Fazlalık düzeltilmezse dönem sonu stok kayıtlarda düşük kalır, satılan malın maliyeti yüksek çıkar ve kâr düşük (olumsuz) gösterilir.","ayirt":"Kayıtlı miktar fiziki sayımdan az mı çok mu, kâr bu farktan nasıl etkilenir?","paragraf":"BDS 450 p.11","yanilgi":"Fazlalığı gördüğünde \u0027stok fazla, değer fazla, kâr da fazla\u0027 diye otomatik olumlu yön kurarsın."},"B":{"gercek":"Soru net etkiyi sormaktadır; her iki depodaki fark da kâr üzerinde zıt yönde etki yapar ve birlikte değerlendirilmelidir.","ayirt":"Soruda kaç ayrı stok farkı verilmiş, hepsini kullandım mı?","paragraf":"BDS 450 p.11","yanilgi":"Sadece hesapladığın kalemin doğru olduğunu, diğer depodaki farkın soruyu etkilemediğini sanırsın."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 69"},"kural":"net satış = kalem tutarı / (kalem yüzdesi/100); ardından her kalem kendi yüzdesiyle net satıştan türetilir, faaliyet karı yüzdesi = 100 - SMM yüzdesi - faaliyet gideri yüzdesi.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 69","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce hangi kalemin hem tutarı hem yüzdesi verilmiş bul, tabanı (net satışı) oradan kur; finansman gideri gibi faaliyet dışı kalemleri zincire hiç sokma.","konu":"dikey yüzde analizi","tablo":{"satirlar":[["VERİLENLER","-"],["SMM yüzdesi","%65"],["SMM tutarı","520.000 TL"],["Faaliyet giderleri yüzdesi","%20"],["Finansman gideri","30.000 TL"],["HESAP","-"],["Net Satışlar (520.000 / 0,65)","800.000"],["Satılan Malın Maliyeti","520.000"],["Brüt Satış Karı (800.000 - 520.000)","280.000"],["Faaliyet Giderleri (800.000 x 0,20)","160.000"],["Faaliyet Karı (280.000 - 160.000)","120.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"120.000","E":"640.000","A":"50.700","D":"176.000","B":"90.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Net Satışlar (600.000 / 0,60)","1.000.000"],["Satılan Malın Maliyeti","600.000"],["Brüt Satış Karı (1.000.000 - 600.000)","400.000"],["Faaliyet Giderleri (1.000.000 x 0,25)","250.000"],["Faaliyet Karı (400.000 - 250.000)","150.000"]]},"tur":"tablo","soru":"İşletmenin 2026 yılı gelir tablosu dikey yüzde analizinde satılan malın maliyeti net satışların %60\u0027ı, faaliyet giderleri toplamı ise net satışların %25\u0027idir. Aynı döneme ait satılan malın maliyeti 600.000 TL, finansman gideri ise 40.000 TL olarak gerçekleşmiştir. Bu verilere göre işletmenin brüt satış karı kaç TL\u0027dir?","verilen":[[1,1]],"hedef":"Tabloyu doldur ve işletmenin brüt satış karının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin 2026 yılı gelir tablosu dikey yüzde analizinde satılan malın maliyeti net satışların %65\u0027i, faaliyet giderleri toplamı ise net satışların %20\u0027sidir. Aynı döneme ait satılan malın maliyeti 520.000 TL, finansman gideri ise 30.000 TL olarak gerçekleşmiştir. Bu verilere göre işletmenin faaliyet karı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-mta-cokzor/kp-01","verilenler":[{"deger":"%65","anlam":"Satılan malın maliyetinin net satışlar içindeki dikey yüzdesi; net satışı türetmek için bölen olarak kullanılır.","ad":"SMM yüzdesi"},{"deger":"520.000 TL","anlam":"Satılan malın maliyetinin gerçekleşen tutarı; yüzdesiyle birlikte net satışı bulmayı sağlar.","ad":"SMM tutarı"},{"deger":"%20","anlam":"Faaliyet giderlerinin net satışlar içindeki payı; net satışa uygulanarak faaliyet gideri tutarı bulunur.","ad":"Faaliyet giderleri yüzdesi"},{"deger":"30.000 TL","anlam":"Çeldirici veri; faaliyet karından sonra düşülen bir kalemdir, faaliyet karı hesabına dahil edilmez.","ad":"Finansman gideri"}],"dayanak":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","dogru":"C","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Soruda ne var: SMM yüzdesi %65, faaliyet gideri yüzdesi %20 (soruda verilen); SMM tutarı 520.000 (soruda verilen); istenen: faaliyet karı","anlatim":"Soru bize şunları vermiş: satılan malın maliyeti net satışların %65\u0027i, faaliyet giderleri net satışların %20\u0027si; satılan malın maliyeti 520.000 TL (soruda verilen), finansman gideri 30.000 TL (soruda verilen, bu soruda kullanılmayacak).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[7,1]]},{"formul":"Net Satışlar = SMM Tutarı / (SMM Yüzdesi) = 520.000 (soruda verilen) / %65 (soruda verilen) = 800.000 TL","anlatim":"Dikey yüzde analizi nedir? Her kalemi net satışlara bölüp yüzde olarak gösteririz. Burada SMM\u0027nin yüzdesini ve tutarını bilince net satışı geriye doğru bulabiliriz.","doldur":[[6,1]]},{"formul":"Satılan Malın Maliyeti = 520.000 (soruda verilen)","anlatim":"Net satışları bulduk, şimdi satılan malın maliyetini tabloya yerleştiriyoruz. Bu değer zaten soruda verilmişti, tekrar hesaplamıyoruz.","doldur":[[7,1]]},{"formul":"Brüt Satış Karı = Net Satışlar - SMM = 800.000 (2. adımda bulduk) - 520.000 (soruda verilen) = 280.000 TL","anlatim":"Brüt satış karı nedir? Net satıştan malın maliyetini çıkarınca kalan tutardır - satışın ilk kâr katmanıdır.","doldur":[[8,1]]},{"formul":"Faaliyet Giderleri = Net Satışlar × %20 (soruda verilen) = 800.000 (2. adımda bulduk) × %20 = 160.000 TL","anlatim":"Faaliyet giderleri nedir? Pazarlama, genel yönetim gibi giderlerdir; burada net satışın %20\u0027si olarak verilmiş, net satışı bulunca tutarını çıkarabiliriz.","doldur":[[9,1]]},{"formul":"Kapsam: Faaliyet Karı = Brüt Satış Karı - Faaliyet Giderleri; Dahil değil: finansman gideri 30.000 (soruda verilen)","anlatim":"Finansman gideri 30.000 TL soruda verilmiş ama faaliyet karına dahil değil, çünkü faaliyet karı esas faaliyetten doğan giderleri kapsar. Dahil değil: finansman gideri 30.000 (soruda verilen).","doldur":[]},{"formul":"Faaliyet Karı = Brüt Satış Karı - Faaliyet Giderleri = 280.000 (4. adımda bulduk) - 160.000 (5. adımda bulduk) = 120.000 TL","anlatim":"Faaliyet karı nedir? Brüt kârdan faaliyet giderlerini düşünce kalan, işletmenin asıl işinden kazandığı kârdır.","doldur":[[10,1]]},{"formul":"Sonuç: Faaliyet Karı = 120.000 TL","anlatim":"Sonuç olarak işletmenin faaliyet karı net satıştan düşülüp brüt satış karı bulunmalıdır."},"A":{"ad":"Ters Oran Tuzağı","metin":"Net satışı bulmak için SMM tutarını yüzdesine bölmen gerekirken yüzdesiyle çarparsın, böylece net satışı olduğundan küçük (338.000) hesaplarsın. Doğrusu: net satış 520.000/0,65=800.000\u0027dir, faaliyet karı da buradan 120.000 çıkar."},"B":{"ad":"Finansman Giderini Faaliyet Karına Dahil Etme Tuzağı","metin":"Finansman giderinin faaliyet karından sonra düşüldüğünü unutup 120.000\u0027den 30.000\u0027i çıkarırsın. Doğrusu: finansman gideri faaliyet karı hesabına hiç girmez, olağan kâra geçişte düşülür."}},"celdiriciYol":{"D":"520.000 x 0,20 = 104.000; 280.000 - 104.000 = 176.000 (faaliyet giderini SMM tabanı üzerinden hesaplama)","E":"800.000 - 160.000 = 640.000 (satılan malın maliyetini faaliyet karı zincirinden dışlama)","A":"520.000 x 0,65 = 338.000; 338.000 x 0,15 = 50.700 (net satışı bölme yerine çarparak bulma)","B":"120.000 - 30.000 = 90.000 (finansman giderini faaliyet karına dahil etme)"},"hap":"Dikey yüzde ve bir kalemin tutarı biliniyorsa net satış = tutar / (yüzde/100) ile bulunur, diğer tüm kalemler bu tabandan kendi yüzdeleriyle türetilir.","teshis":{"C":{"gercek":"Bir kalemin hem tutarı hem yüzdesi verilirse taban (net satış) bulunur, kalan tüm kalemler kendi yüzdeleriyle bu tabandan türetilir.","ayirt":"Verilen tek tutar ve yüzdeden tabanı doğru kurdum mu, sonra istenen kalemi bu tabandan mı hesapladım?","paragraf":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","yanilgi":"Bu şıkkı eleyen öğrenci, dikey yüzdelerden yalnız oran değil tutar da türetilebileceğini fark edemez ve soruyu çözülemez sanır."},"E":{"gercek":"Faaliyet karına ulaşmak için önce net satıştan SMM düşülüp brüt satış karı bulunur, ardından faaliyet giderleri düşülür; adım atlanamaz.","ayirt":"Brüt satış karını hesapladım mı, yoksa doğrudan net satıştan mı gittim?","paragraf":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","yanilgi":"Faaliyet karına gid rilen)","anlatim":"Alacak 2 protesto edilmiş, bu da tek başına şüpheli alacak şartını sağlar. Teminat olmadığı için tam tutar karşılığa girer.","doldur":[]},{"formul":"Karşılığa esas tutar = Alacak tutarı - Teminat tutarı = 50.000 (soruda verilen) - 15.000 (soruda verilen) = 35.000 TL","anlatim":"Alacak 4 dava safhasında ama kısmen teminatlı. Kanun teminatlı kısmı zaten güvende sayar, karşılık yalnız kalan kısma yazılır.","doldur":[[8,1]]},{"formul":"Şüpheli alacak şartı: protesto edilmiş veya en az iki defa yazıyla istenmiş olmalı; Alacak 3 yalnız bir kez yazıyla istenmiş (soruda verilen) → şart sağlanmıyor = 0 TL","anlatim":"Alacak 3 yalnız bir kez yazıyla istenmiş ve protesto da edilmemiş. Şart iki koşuldan hiçbirini karşılamadığı için şüpheli sayılmaz.","doldur":[[9,1]]},{"formul":"Toplam şüpheli alacak karşılığı = Alacak 1 + Alacak 2 + Alacak 4 kalan kısım = 40.000 (1. adımda bulduk) + 20.000 (1. adımda bulduk) + 35.000 (5. adımda bulduk) = 95.000 TL","anlatim":"Şimdi biz hesaplıyoruz: şüpheli sayılan alacakların karşılığa esas tutarlarını topluyoruz. Alacak 3 zaten dahil değil.","doldur":[[10,1]]},{"formul":"Ters durum: iki defa yazıyla istenmiş ve protesto edilmemiş → şüpheli alacak sayılır, toplam 125.000 TL olurdu","anlatim":"Ters durumda: Alacak 3 en az iki kez yazıyla istenmiş olsaydı şüpheli sayılırdı. O zaman toplam karşılık artardı.","doldur":[]},{"formul":"Yanlış yol: 40.000 + 20.000 + 30.000 + 50.000 = 140.000 (HATALI) → doğrusu 95.000 (7. adımda bulduk)","anlatim":"En sık hata: dört alacağın tamamını toplamak. Alacak 3 şartı sağlamadığı ve Alacak 4\u0027ün teminatlı kısmı düşülmediği için bu yanlış.","doldur":[]}],"anahtar":[{"ornek":"alacakta","kok":"alacak"},{"ornek":"teminatlı","kok":"temina"},{"ornek":"şüpheli","kok":"şüphel"},{"ornek":"karşılık","kok":"karşıl"},{"ornek":"protesto","kok":"protes"},{"ornek":"yazıyla","kok":"yazıyl"}],"konuGiris":{"harita":"Ne zaman test edilir: alacak dava/icra safhasına girdiğinde veya protesto edilip ya da birden fazla yazıyla istendiğinde. Nasıl ölçülür: teminatsız kısım tam, teminatlı kısım teminat düşülerek hesaplanır. Nasıl kaydedilir: şüpheli hale geldiği dönemde karşılık ayrılır, sonradan tahsil edilirse gelir yazılır.","desen":"Sınav genelde \u0027tek yazıyla istenmiş\u0027 ile \u0027birden fazla yazıyla istenmiş\u0027 ayrımını karıştırtır; tek yazı şüpheli sayılmaz. Bir diğer tuzak teminatlı alacakta karşılığın teminat düşüldükten sonraki kısma münhasır olmasıdır. Bu soru Vergi Usul Kanunu m.323 bent 1-2 ve teminat fıkrasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"alacağın mahkeme veya icra takibine girmiş olması","ad":"dava/icra safhası","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"borçludan birden fazla kez yazıyla veya protestoyla istenmiş olma şartı","ad":"protesto/tekrarlı yazı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"karşılığın teminattan arta kalan kısımla sınırlı olduğu alacak türü","ad":"teminatlı alacak","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"sen hesaplarsın","tanim":"tasarruf değerine göre pasifte ayrılan, şart uyan alacaklara mahsus tutar","ad":"şüpheli alacak karşılığı","kim":"kanun sabitler"}],"sinavda":"Alacak listesi ve durumları verilir, ayrılabilecek toplam şüpheli alacak karşılığı istenir.","panel_ornek":"Bir arkadaşın üç kişiye borç vermiş: biri mahkemelik olmuş, biri tek mesajla hatırlatılmış, biri de kefilli. Hangisi için gerçekten \u0027tahsil edemeyebilirim\u0027 diyebilir, hangisi için henüz erken, düşünmen lazım.","ornek":"Bir arkadaşın üç kişiye borç vermiş: biri mahkemelik olmuş, biri tek mesajla hatırlatılmış, biri de kefilli. Hangisi için gerçekten \u0027tahsil edemeyebilirim\u0027 diyebilir, hangisi için henüz erken, düşünmen lazım.","yontemler":"Her alacak tek tek şart kontrolünden geçirilir: dava/icra mi, protesto/tekrarlı yazı mı, teminat var mı; uygun olmayan (tek yazı gibi) toplama katılmaz, teminatlı kısımda sadece teminatsız kalan tutar dahil edilir.","nedir":"Vergi Usul Kanunu 323 şüpheli alacak karşılığı, tahsili şüpheli hale gelen ticari alacaklar için ayrılan vergi matrahını etkileyen bir gider kalemidir. Sınav bu karşılığın hangi alacaklara ne kadar ayrılabileceğini ölçer."},"olay":"40.000 (dava, tam) + 20.000 (protesto, tam) + 35.000 (50.000-15.000 teminatlı kısım) = 95.000; 30.000 TL\u0027lik alacak yalnız bir kez yazıyla istendiği ve protesto edilmediği için şart oluşmaz, dahil edilmez.","tuzak":{"D":{"ad":"Teminatı Düşmeme Tuzağı","metin":"Dava safhasındaki alacağın teminatlı kısmının karşılık dışı bırakılması gerektiğini atlayıp 50.000 TL\u0027nin tamamını hesaba katarsın. Doğrusu: Teminatlı alacaklarda karşılık, teminattan geri kalan miktara inhisar eder; bu alacak için yalnız 35.000 TL dikkate alınır."},"E":{"ad":"Eksik Şartla Kabul Tuzağı","metin":"Alacağın yalnız bir kez yazıyla istenmesini, kanundaki \u0027protesto veya bir defadan fazla yazılı istem\u0027 şartını sağlıyor sanıp bu alacağı da şüpheli sayarsın. Doğrusu: Madde, protesto edilmemişse en az bir defadan fazla yazılı istemi arar; tek seferlik istem bu şartı karşılamaz, 30.000 TL karşılığa dahil edilmez."},"A":{"ad":"Teminatlı Alacağı Toptan Eleme Tuzağı","metin":"Alacağın teminatlı olmasının onu şüpheli alacak olmaktan çıkardığını sanıp 50.000 TL\u0027yi hesaba hiç katmazsın. Doğrusu: Teminatlı alacakta karşılık yalnız teminattan geri kalan 35.000 TL\u0027ye ayrılır, tamamı elenmez."},"B":{"ad":"Şart Kontrolü Eksik Tuzağı","metin":"Protesto edilmiş alacağın da şüpheli alacak sayılabileceğini gözden kaçırıp yalnız dava safhasındakileri sayarsın. Doğrusu: Protesto edilmiş ve 25.000 TL\u0027yi aşmayan alacak da şüpheli alacak kapsamındadır, 20.000 TL karşılığa dahildir."}},"celdiriciYol":{"D":"40.000 + 20.000 + 50.000 = 110.000 (teminatı düşmeme)","E":"40.000 + 20.000 + 35.000 + 30.000 = 125.000 (tek seferlik yazılı istemi yeterli sayma)","A":"40.000 + 20.000 = 60.000 (teminatlı alacağı tamamen dışlama)","B":"40.000 + 35.000 = 75.000   KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });

        fH='<div class="soruIsaret"><div class="et">Soru, verilenler işaretli</div>'+soruH+'</div>';
        // 06.09: VERİLENLERİ TANI — her verilen ad · değer · tek cümle anlam (hiç bilmeyene ders burada başlar)
        if(s.verilenler&&s.verilenler.length){ fH+='<ul class="verilenListe">'+s.verilenler.map(v=>'<li><b>'+esc(v.deger)+'</b> · '+esc(v.ad)+(v.anlam?'<i> — '+esc(v.anlam)+'</i>':'')+'</li>').join('')+'</ul>'; }
        const dk=String(a.anlatim||'').match(/((?:Dikkat|Not|Önemli)[^.!?]*[.!?])/i)||String(a.anlatim||'').match(/([^.!?]*(?:anahtar|belirleyici|yöntem)[^.!?]*[.!?])/i);
        anlatimH=esc(dk?dk[1].trim():String(a.anlatim||'').split(/(?<=[.!?])\s+/).slice(-1)[0]);
      }
      // hedef = "Sonuç" adımı; son adım "Yanlış yol / en sık hata" ise ondan önceki sonuç adımıdır
      let hedefIdx=s.adimlar.length-1; for(let q=s.adimlar.length-1;q>=0;q--){ const b=adimBaslik(s.adimlar[q]); if(!/^(yanlış|en sık hata|tuzak|senin seçimin|takıldığın yer|ters durum|kapanış)/i.test(b)){ hedefIdx=q; break; } }
      // 07.09 Cem ekranı: hedef "654 KARŞILIK GİDERLERİ (BORÇ)" yazıyordu — sonuçtan sonra gelen yevmiye adımı hedef sanılmıştı. Hedef = çözüm
      // tablosunun SONUÇ satırını (son satır) dolduran adım; yoksa yukarıdaki geri düşüş
      if(s.tablo&&s.tablo.satirlar&&s.tablo.satirlar.length&&!(s.teori)){ const sonR=s.tablo.satirlar.length-1; for(let q=s.adimlar.length-1;q>=0;q--){ if((s.adimlar[q].doldur||[]).some(p=>p[0]===sonR)){ hedefIdx=q; break; } } }
      const sonBas=adimBaslik(s.adimlar[hedefIdx]); const sonrakiBas=(j+1<s.adimlar.length)?adimBaslik(s.adimlar[j+1]):'';
      // Cem 04.09 "yol haritası ekranı kaplıyor": tek satır — numaralı noktalar (geçilen yeşil, buradasın kalın, hedef altın bayrak),
      // yalnız bulunduğun adımın adı yazılı; başlıklar üstüne gelince görünür. Kartın altına yaslanır.
      const yolH='<div class="yol"><div class="yolCip">'+s.adimlar.map((x,q)=>'<span class="yc '+(q<j?'gecti':(q===j?'simdi':(q===hedefIdx?'hedef':'')))+'" title="'+esc(adimBaslik(x))+'">'+(q===hedefIdx&&q!==j?'🏁':(q+1))+'</span>').join('<span class="ycb"></span>')+'<span class="yolAd">'+esc(adimBaslik(a))+'</span></div>'
        +(a.giris?('<div class="neden">'+(((s.teori||(s.tablo&&s.tablo.basliklar&&s.tablo.basliklar[0]==='Adım')))
            ?'Önce konunun haritası: nedir, sınav nasıl sorar. Sonra kural, sonra şıklar kuralla tek tek sınanır; en sonda senin seçimin.'   // 07.09 Ö55(2): teori cümlesi (hesap kalıbı "verilenler, hesap, ters durum" teori soruda anlamsızdı)
            :'Önce konunun haritası: nedir, sınav ne sorar, hangi yöntem ne zaman. Sonra sorunun verilenleri, sonra hesap; hedef <b>'+esc(sonBas)+'</b>.')+'</div>')
          :(verilenAdimMi&&s.verilenler&&s.verilenler.length)?'<div class="neden">Önce elimizdekileri tanıyoruz: <b>'+s.verilenler.length+' verilen</b>. Hesap bloğundaki her satır bunlardan kurulacak; hedef <b>'+esc(sonBas)+'</b>.</div>'
          :son?'<div class="neden">Hedefe ulaştık: <b>'+esc(sonBas)+'</b>. Şimdi aynı yolu sen yürü.</div>'
          :(j>=hedefIdx?'<div class="neden">Hedef bulundu (<b>'+esc(sonBas)+'</b>). '+(a.kisi?'Bu adım <b>senin seçtiğin şıkkın</b> neden yanlış olduğunu gösterir.':'Bu adım, adayların en sık düştüğü yanlış yolu gösterir.')+'</div>'
          :(j+1===hedefIdx?'<div class="neden">Bu adım niye var? Burada bulduğumuz değer doğrudan hedefe götürür: sıradaki adım <b>'+esc(sonBas)+'</b>.</div>'
          :'<div class="neden">Bu adım niye var? Burada bulduğumuz değer sıradaki adımda (<b>'+esc(sonrakiBas)+'</b>) kullanılacak; hedef <b>'+esc(sonBas)+'</b>.</div>')))+'</div>';
      serit.innerHTML='<div class="adimK'+(son?' sonAdim':'')+(yon<0?' geri':'')+'"><div class="say"><span>ADIM '+(j+1)+' / '+s.adimlar.length+'</span><span class="baslik">'+esc(adimBaslik(a))+'</span></div><code class="mat0">'+fH+'</code><p>'+anlatimH+'</p>'+yolH+sonBtn+'</div>';
      // Cem 04.09 "numaralara basarak sayfa değiştirsek": yol haritası yuvarlakları tıklanınca o adıma gider
      serit.querySelectorAll('.yc').forEach((el,q)=>el.addEventListener('click',()=>adimGit(q-adimNo)));
      const bo=serit.querySelector('.bDersOyun'); if(bo){ bo.addEventListener('click',()=>{ ders.classList.remove('acik'); oyunKur(); oyun.classList.add('acik'); }); }
      const bb=serit.querySelector('.bDersBitti'); if(bb){ bb.addEventListener('click',()=>{ ders.classList.remove('acik'); const cA=k.querySelector('.cAnlat'); if(cA){ if(cA.offsetParent===null){ const bd=k.querySelector('.bDaha'); if(bd) bd.click(); } cA.click(); const ta=k.querySelector('.anlatK'); if(ta) setTimeout(()=>ta.focus(),200); } }); }
      // tablo: bu adimin hucreleri acilir ve yanar; onceki adimlarda acilanlar acik kalir
      tabloSar.querySelectorAll('td.vurgu,td.kaynakH').forEach(td=>{ td.classList.remove('vurgu'); td.classList.remove('kaynakH'); }); tabloSar.querySelectorAll('tr.kayit.vurguS').forEach(tr=>tr.classList.remove('vurguS'));
      // 06.09 Cem "5'ten 3'e dönünce 5'in cevabı kalıyor": açık hücre kümesi her adımda 0..j'den YENİDEN kurulur; geri gidince sonraki adımların hücresi tekrar kapanır
      acilan.clear(); for(let q=0;q<=j;q++){ (s.adimlar[q].doldur||[]).forEach(p=>acilan.add(p[0]+','+p[1])); }
      kaynakH.forEach(k=>acilan.add(k));   // formülde kullanılan hücre görünür olmalı
      if(son&&s.tablo){ s.tablo.satirlar.forEach((st,r)=>st.forEach((c,ci)=>{ if(ci>0) acilan.add(r+','+ci); })); }
      tabloSar.querySelectorAll('td[data-r]').forEach(td=>{ const key=td.dataset.r+','+td.dataset.c; if(acilan.has(key)){ if(td.classList.contains('gizliH')){ td.classList.remove('gizliH'); td.classList.add('acildi'); } } else if(td.classList.contains('acildi')){ td.classList.add('gizliH'); td.classList.remove('acildi'); } });
      (a.doldur||[]).forEach(p=>{ const td=tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]'); if(td) td.classList.add('vurgu'); });
      // 05.09 Cem "%80 çıktığını o rakamı tabloya doldurduğumuzu göstersek": sonuç formülden tablodaki hücreye UÇAR
      // 05.09 Cem "bir anda çözümler geliyor, sırayla çözüyor gibi yapsa": adımda birden çok hesap varsa formül kutuları
      // SIRAYLA belirir (900 ms arayla), her kutunun sonucu belirince kendi hücresine uçar; hücre uçuş bitene dek boş kalır.
      if(yon>=0&&j>0&&!verilenAdimMi&&!a.giris){
        const mats=[...serit.querySelectorAll('.mat')]; const hedefler=(a.doldur||[]).map(p=>tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]')).filter(Boolean);
        const cokKutu=mats.length>1; const adimBu=j;
        hedefler.forEach(td=>td.classList.add('bekliyor'));
        mats.forEach((m,q)=>{ if(q>0&&cokKutu){ m.classList.add('gizliMat'); } });
        hedefler.forEach((td,pi)=>{ const kaynakM=mats[Math.min(pi,Math.max(0,mats.length-1))]; const gecikme=cokKutu?pi*900:pi*120;
          setTimeout(()=>{ if(adimNo!==adimBu||!document.body.contains(td)){ td.classList.remove('bekliyor'); return; }
            if(kaynakM){ kaynakM.classList.remove('gizliMat'); kaynakM.classList.add('geldi'); }
            const kaynakEl=kaynakM?kaynakM.querySelector('.matSonuc'):null; const from=kaynakEl?kaynakEl.getBoundingClientRect():null, to=td.getBoundingClientRect();
            if(!from||!from.width||!to.width){ td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); return; }
            const u=document.createElement('div'); u.className='ucan'; u.textContent=td.textContent.trim()||kaynakEl.textContent.trim(); document.body.appendChild(u); u.style.left=from.left+'px'; u.style.top=from.top+'px';
            requestAnimationFrame(()=>{ u.style.transform='translate('+(to.left-from.left)+'px,'+(to.top-from.top)+'px) scale(.85)'; u.style.opacity='0.15'; });
            setTimeout(()=>{ u.remove(); td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); },650); }, gecikme); });
        // hedefi olmayan fazladan kutular da sırayla gelsin
        mats.forEach((m,q)=>{ if(q>=hedefler.length&&m.classList.contains('gizliMat')){ setTimeout(()=>{ if(adimNo===adimBu){ m.classList.remove('gizliMat'); m.classList.add('geldi'); } }, q*900); } });
      }
      kaynakH.forEach(k=>{ const [r,c]=k.split(','); const td=tabloSar.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]'); if(td) td.classList.add('kaynakH'); });
      // 06.09: VERİLENLER bloğu Adım 1'den sonra katlanır; bu adımın formülünde kullanılan verilen satırı açık kalır (mavi), başlık tıklanınca hepsi açılır
      tabloSar.querySelectorAll('tr.vblok').forEach(tr=>{ const td=tr.querySelector('td[data-r]'); const key=td?td.dataset.r+','+td.dataset.c:''; tr.classList.toggle('katli', j>0 && !kaynakH.has(key) && !hedef.has(key)); });
      let lej=tabloSar.querySelector('.lejant'); if(!lej){ lej=document.createElement('div'); lej.className='lejant'; tabloSar.appendChild(lej); }
      lej.innerHTML=kaynakH.size?'<i class="m"></i>nereden geldi <i class="a"></i>bu adımda bulundu':(hedef.size?'<i class="a"></i>bu adımda bulundu':''); lej.style.display=lej.innerHTML?'block':'none';
      // kayit satirlari: adimda anilan hesap kodu (uc hane; "100.000" icindeki 100 sayilmaz)
      const kodOf=x=>new Set([...(String(x.formul)+' '+String(x.anlatim)).matchAll(/(?<![\d.,])(\d{3})(?![\d.,]|\s*(?:TL|%|adet|gün|yıl|ay))/g)].map(m=>m[1]));
      const kodlar=kodOf(a);
      // gösterilen kayıt satırları da 0..j'den yeniden kurulur (geri gidince sonraki adımın satırı gizlenir)
      gosterilen.clear(); for(let q=0;q<=j;q++){ kodOf(s.adimlar[q]).forEach(c=>gosterilen.add(c)); }
      tabloSar.querySelectorAll('tr.kayit[data-kod]').forEach(tr=>{ const k2=tr.dataset.kod; const an=k2&&kodlar.has(k2); if(son){ gosterilen.add(k2); } tr.classList.toggle('goster',gosterilen.has(k2)); tr.classList.toggle('vurguS',!!an); });
      tabloSar.querySelectorAll('tr.ara').forEach(ara=>{ const gi=ara.dataset.grp; ara.classList.toggle('goster',[...tabloSar.querySelectorAll('tr.kayit[data-kod][data-grp="'+gi+'"]')].some(tr=>tr.classList.contains('goster'))); });
      adimBar.querySelectorAll('i').forEach(n=>{ const q=parseInt(n.dataset.j); n.classList.toggle('simdi',q===j); n.classList.toggle('gecti',q<j); });
      bOnce.disabled=(j===0); bSonra.disabled=son; bSonra.textContent=son?'Bitti ✓':'İleri ▶';
      const vurgu=tabloSar.querySelector('td.vurgu, tr.vurguS'); if(vurgu) vurgu.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    const adimGit=d=>{ const cur=s.adimlar[adimNo]; if(d>0&&cur&&tahminGerek(cur,adimNo,adimNo===s.adimlar.length-1)&&serit.querySelector('.tahminK')){ tahmin[adimNo]={atla:true}; adimGoster(adimNo,1); return; }   // 06.09: tahmin ekranında ileri = "göster"
      const j=Math.min(s.adimlar.length-1,Math.max(0,adimNo+d)); if(j===adimNo) return; adimGoster(j,d); };
    bOnce.addEventListener('click',()=>adimGit(-1)); bSonra.addEventListener('click',()=>adimGit(1));
    // fare tekerlegi, klavye oklari, parmakla yatay kaydirma (sola = ileri)
    let tekerKilit=0; serit.addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-tekerKilit<350) return; tekerKilit=t; adimGit((e.deltaY||e.deltaX)>0?1:-1); },{passive:false});
    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});
// --- son kart
const son=document.createElement('section'); son.className='kart son';
son.innerHTML='<div class="ust"><span>Nöbet bitti</span>'+noktalar(-1)+'<span>&nbsp;</span></div><div class="govde son" style="display:flex;flex-direction:column;justify-content:center"><div id="sonSkor"></div></div>';
akis.appendChild(son);
document.querySelectorAll('.skorCip,.kutuCip').forEach(b=>b.addEventListener('click',kutuEkraniAc)); skorCiz();
if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i').forEach(n=>n.classList.toggle('simdi',n.dataset.j==String(i)||(i>=SORULAR.length&&n.dataset.j==='son')));
  if(i<SORULAR.length&&durum.cevap[i]===undefined&&!durum.t0[i]) durum.t0[i]=Date.now();   // 06.09: karta gelince süre başlar
  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='PageDown'){ akis.scrollBy({top:akis.clientHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='PageUp'){ akis.scrollBy({top:-akis.clientHeight,behavior:'smooth'}); } });
</script></body></html>
