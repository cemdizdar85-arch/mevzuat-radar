<div id="akis"></div><button id="temaB" class="temaB" type="button" aria-label="Koyu temaya geç">☾</button>
<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

const SORULAR=[{"capa":{"kaynak":"SGS 2025/2 Soru 62"},"kural":"yan mamulün net gerçekleşebilir değeri ortak maliyetten düşülür, kalan esas maliyet ayrılma noktası satış değerlerine göre dağıtılır, ayrılma sonrası ek işleme maliyeti eklenir ve nihai satış fiyatından birim maliyet düşülerek brüt kâr bulunur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 62","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ortak maliyet sorularında dört katmanı (yan mamul düşümü, dağıtım oranı, ek işleme eklemesi, birim/kâr hesabı) sırayla tek tek işaretleyerek ilerle, hiçbirini atlama.","konu":"ortak ürün maliyet dağıtımı","tablo":{"satirlar":[["VERİLENLER","-"],["Ortak maliyet toplamı","600.000 TL"],["A Mamulü üretim miktarı","5.000 birim"],["A Mamulü ayrılma noktası birim satış değeri","80 TL"],["B Mamulü üretim miktarı","5.000 birim"],["B Mamulü ayrılma noktası birim satış değeri","40 TL"],["B Mamulü ek işleme maliyeti","50.000 TL"],["B Mamulü nihai birim satış fiyatı","54 TL"],["C Yan Mamulü üretim miktarı","2.000 birim"],["C Yan Mamulü birim satış değeri","30 TL"],["C Yan Mamulü satılabilir hale getirme ek maliyeti","30.000 TL"],["HESAP","-"],["C Yan Mamulü satış değeri (2.000×30)","60.000"],["C Yan Mamulü net gerçekleşebilir değeri (60.000-30.000)","30.000"],["Dağıtıma esas ortak maliyet (600.000-30.000)","570.000"],["A Mamulü satış değeri (5.000×80)","400.000"],["B Mamulü satış değeri (5.000×40)","200.000"],["Toplam satış değeri (A+B)","600.000"],["B Mamulü ortak maliyet payı (570.000×200.000/600.000)","190.000"],["B Mamulü toplam maliyeti (190.000+50.000)","240.000"],["B Mamulü birim maliyeti (240.000/5.000)","48"],["B Mamulü birim brüt kârı (54-48)","6"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"6","E":"16","A":"2","D":"8","B":"4"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["S Yan Mamulü satış değeri (1.000×50)","50.000"],["S Yan Mamulü net gerçekleşebilir değeri (50.000-30.000)","20.000"],["Dağıtıma esas ortak maliyet (500.000-20.000)","480.000"],["P Mamulü satış değeri (5.000×90)","450.000"],["R Mamulü satış değeri (5.000×30)","150.000"],["Toplam satış değeri (P+R)","600.000"],["P Mamulü ortak maliyet payı (480.000×450.000/600.000)","360.000"],["P Mamulü birim maliyeti (360.000/5.000)","72"],["P Mamulü birim brüt kârı (90-72)","18"]]},"tur":"tablo","soru":"Bir gıda işletmesinde ortak üretim sürecinden P, R mamulleri ile S yan mamulü elde edilmektedir. İşletme ortak maliyeti, mamullerin ayrılma noktasındaki satış değerine göre dağıtmakta, yan mamulün net gerçekleşebilir değerini ortak maliyetten düşmektedir. Ortak maliyet toplamı 500.000 TL\u0027dir. P Mamulü: 5.000 birim, ayrılma noktası birim satış değeri 90 TL. R Mamulü: 5.000 birim, ayrılma noktası birim satış değeri 30 TL; ayrılma sonrası 40.000 TL ek işleme maliyetine katlanılıp birim 46 TL\u0027den satılmaktadır. S Yan Mamulü: 1.000 birim, birim satış değeri 50 TL, satılabilir hale getirme ek maliyeti toplam 30.000 TL\u0027dir. Buna göre, P Mamulünün birim brüt kârı kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve P Mamulünün birim brüt kârının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir gıda işletmesinde ortak üretim sürecinden A, B mamulleri ile C yan mamulü elde edilmektedir. İşletme ortak maliyeti, mamullerin ayrılma noktasındaki satış değerine göre dağıtmakta, yan mamulün net gerçekleşebilir değerini ortak maliyetten düşmektedir. Ortak maliyet toplamı 600.000 TL\u0027dir. A Mamulü: 5.000 birim, ayrılma noktası birim satış değeri 80 TL. B Mamulü: 5.000 birim, ayrılma noktası birim satış değeri 40 TL; ayrılma sonrası 50.000 TL ek işleme maliyetine katlanılıp birim 54 TL\u0027den satılmaktadır. C Yan Mamulü: 2.000 birim, birim satış değeri 30 TL; satılabilir hale getirme ek maliyeti toplam 30.000 TL\u0027dir. Buna göre, B Mamulünün birim brüt kârı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-06","verilenler":[{"deger":"600.000 TL","anlam":"A, B ve C mamullerine ayrılma noktasına kadar oluşan, dağıtılacak toplam birleşik maliyettir.","ad":"Ortak maliyet toplamı"},{"deger":"5.000 birim","anlam":"A\u0027nın satış değerini hesaplamak için kullanılan miktardır.","ad":"A Mamulü üretim miktarı"},{"deger":"80 TL","anlam":"A\u0027nın toplam satış değerini bulmakta kullanılır, dağıtım oranının paydasına girer.","ad":"A Mamulü ayrılma noktası birim satış değeri"},{"deger":"5.000 birim","anlam":"B\u0027nin satış değeri ve birim maliyetinin bulunmasında kullanılır.","ad":"B Mamulü üretim miktarı"},{"deger":"40 TL","anlam":"B\u0027nin toplam satış değerini bulmakta kullanılır, dağıtım oranında yer alır.","ad":"B Mamulü ayrılma noktası birim satış değeri"},{"deger":"50.000 TL","anlam":"Ayrılma sonrası B\u0027ye doğrudan yüklenen, dağıtıma esas maliyete eklenen ek işleme tutarıdır.","ad":"B Mamulü ek işleme maliyeti"},{"deger":"54 TL","anlam":"Brüt kârın hesaplanmasında birim maliyetten çıkarılacak nihai satış fiyatıdır.","ad":"B Mamulü nihai birim satış fiyatı"},{"deger":"2.000 birim","anlam":"C\u0027nin satış değerinin hesaplanmasında kullanılır.","ad":"C Yan Mamulü üretim miktarı"},{"deger":"30 TL","anlam":"C\u0027nin toplam satış değerini bulmakta kullanılır.","ad":"C Yan Mamulü birim satış değeri"},{"deger":"30.000 TL","anlam":"Net gerçekleşebilir değeri bulmak için C\u0027nin satış değerinden düşülen tutardır.","ad":"C Yan Mamulü satılabilir hale getirme ek maliyeti"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.275; ortak (birleşik) maliyet dağıtımı ve net gerçekleşebilir değer yöntemi - maliyet muhasebesi teorisi","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Ortak maliyet 600.000 TL (soruda verilen); A 5.000 birim, 80 TL/birim (soruda verilen); B 5.000 birim, 40 TL/birim, ek işleme 50.000 TL, satış 54 TL (soruda verilen); C 2.000 birim, 30 TL/birim, ek maliyet 30.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: ortak maliyet 600.000 TL, A 5.000 birim×80 TL, B 5.000 birim×40 TL (ek işleme 50.000, satış 54 TL), C 2.000 birim×30 TL (ek maliyet 30.000). Yan mamulün net gerçekleşebilir değeri ortak maliyetten düşülüyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1]]},{"formul":"C satış değeri = birim × miktar = 30 (soruda verilen) × 2.000 (soruda verilen) = 60.000 TL","anlatim":"C yan mamulünün ayrılma noktasındaki satış değerini buluyoruz. Bunu birim fiyatla birim sayısını çarparak buluruz.","doldur":[[12,1]]},{"formul":"C net gerçekleşebilir değer = satış değeri - ek maliyet = 60.000 (2. adımda bulduk) - 30.000 (soruda verilen) = 30.000 TL","anlatim":"Yan mamulün net gerçekleşebilir değeri, satış değerinden ek maliyetin düşülmesiyle bulunur. Bu değer ortak maliyetten çıkarılacak.","doldur":[[13,1]]},{"formul":"Dağıtıma esas ortak maliyet = ortak maliyet - C net gerçekleşebilir değer = 600.000 (soruda verilen) - 30.000 (3. adımda bulduk) = 570.000 TL","anlatim":"Yan mamulün net gerçekleşebilir değeri ortak maliyetten düşülür, kalan tutar A ve B\u0027ye dağıtılır. Yan mamul üretim maliyetine dahil değil, düşülen bir kalemdir.","doldur":[[14,1]]},{"formul":"A satış değeri = birim × miktar = 80 (soruda verilen) × 5.000 (soruda verilen) = 400.000 TL","anlatim":"A Mamulünün ayrılma noktasındaki satış değerini buluyoruz. Dağıtım oranı bu değere göre hesaplanacak.","doldur":[[15,1]]},{"formul":"B satış değeri = birim × miktar = 40 (soruda verilen) × 5.000 (soruda verilen) = 200.000 TL","anlatim":"B Mamulünün ayrılma noktasındaki satış değerini buluyoruz. Ek işleme maliyeti henüz bu değere dahil değil.","doldur":[[16,1]]},{"formul":"Toplam satış değeri = A satış değeri + B satış değeri = 400.000 (5. adımda bulduk) + 200.000 (6. adımda bulduk) = 600.000 TL","anlatim":"A ve B\u0027nin satış değerlerini topluyoruz, dağıtım oranını bu toplama göre kuracağız. C zaten hesaptan çıkmıştı.","doldur":[[17,1]]},{"formul":"B ortak maliyet payı = dağıtıma esas maliyet × (B satış değeri / toplam satış değeri) = 570.000 (4. adımda bulduk) × (200.000 (6. adımda bulduk) / 600.000 (7. adımda bulduk)) = 190.000 TL","anlatim":"B\u0027nin payını, toplam satış değeri içindeki oranına göre dağıtıma esas maliyetten alıyoruz. Bu yöntem satış değeri yöntemidir.","doldur":[[18,1]]},{"formul":"B toplam maliyeti = ortak maliyet payı + ek işleme maliyeti = 190.000 (8. adımda bulduk) + 50.000 (soruda verilen) = 240.000 TL","anlatim":"B ayrıldıktan sonra ek işleme görüyor, bu maliyeti kendi payına ekliyoruz. Ek işleme maliyeti sadece B\u0027ye aittir.","doldur":[[19,1]]},{"formul":"B birim maliyeti = toplam maliyet / miktar = 240.000 (9. adımda bulduk) / 5.000 (soruda verilen) = 48 TL","anlatim":"Toplam maliyeti birim sayısına bölerek B\u0027nin birim maliyetini buluyoruz. Brüt kâr için birim maliyet gerekiyor.","doldur":[[20,1]]},{"formul":"B birim brüt kârı = satış fiyatı - birim maliyet = 54 (soruda verilen) - 48 (10. adımda bulduk) = 6 TL","anlatim":"Birim satış fiyatından birim maliyeti düşerek birim brüt kârı buluyoruz. Sonuç 6 TL çıkıyor.","doldur":[[21,1]]},{"formul":"Ters durum: satış fiyatı \u003c birim maliyet → brüt zarar (negatif sonuç)","anlatim":"Ters durumda B\u0027nin satış fiyatı birim maliyetin altında kalsaydı, brüt kâr negatif çıkar, yani brüt zarar oluşurdu.","doldur":[]},{"formul":"Yanlış yol: B payı = 600.000 × (200.000/600.000) = 200.000 (HATALI) → doğrusu 190.000 (8. adımda bulduk)","anlatim":"En sık hata, C\u0027nin net gerçekleşebilir değerini düşmeden dağıtıma esas maliyeti 600.000 TL almaktır. Bu, B\u0027nin payını ve dolayısıyla birim maliyetini yanlış büyütür.","doldur":[]}],"anahtar":[{"ornek":"maliyet","kok":"maliye"},{"ornek":"değeri","kok":"değeri"},{"ornek":"mamulün","kok":"mamulü"},{"ornek":"dağıtımında","kok":"dağıtı"},{"ornek":"işleme","kok":"işleme"},{"ornek":"ayrılma","kok":"ayrılm"}],"konuGiris":{"harita":"Ne zaman test edilir: ayrılma noktasından önceki ortak maliyet mamullere paylaştırılırken test edilir. Nasıl ölçülür: seçilen dağıtım anahtarına (satış değeri, fiziki miktar, NGD) göre oranlanarak ölçülür. Nasıl kaydedilir: her mamulün payına düşen ortak maliyet, o mamulün birim maliyetine eklenip ek işleme maliyeti varsa üzerine eklenerek kaydedilir.","desen":"Bu tip sorularda öğrenciler önce yan mamulün NGD\u0027sini ortak maliyetten düşmeyi unutur, doğrudan tüm 600.000\u0027i A ve B\u0027ye dağıtır. İkinci tuzak, B\u0027nin ek işleme maliyetinin ortak maliyet dağıtımına değil doğrudan B\u0027nin kendi maliyetine eklenmesi gerektiğinin atlanmasıdır. Bu soru ortak maliyet dağıtımı ve yan mamul düşümü noktasından geliyor (p.28, 3 dönemde çıkmış).","terimler":[{"kaynak":"soruda verilir","tanim":"Ortak üretimin bittiği, mamullerin birbirinden ayrıldığı nokta","ad":"Ayrılma noktası","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Ortak maliyetin ayrılma noktasındaki satış değerleri oranında dağıtılması","ad":"Satış değeri yöntemi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Yan mamulün nihai satış değerinden ek işleme maliyetinin düşülmesiyle bulunan değer","ad":"Net gerçekleşebilir değer","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Birim satış fiyatından birim toplam maliyetin düşülmesiyle kalan tutar","ad":"Birim brüt kâr","kim":"piyasa fiyatlar"}],"sinavda":"Ortak maliyet, mamul miktarları, ayrılma noktası satış değerleri ve ek işleme maliyetleri verilip belirli bir mamulün birim brüt kârı istenir.","panel_ornek":"Annen pazardan 90 TL\u0027ye aldığı büyük bir karpuzu kesip komşularla paylaşıyor; herkes aldığı dilimin büyüklüğüne göre para veriyor. Küçük bir dilimi de bedava veriyor çünkü değeri çok az. İşte \u0027ortak maliyeti değere göre paylaştırma, değersiz parçayı hariç tutma\u0027 mantığı budur.","ornek":"Annen pazardan 90 TL\u0027ye aldığı büyük bir karpuzu kesip komşularla paylaşıyor; herkes aldığı dilimin büyüklüğüne göre para veriyor. Küçük bir dilimi de bedava veriyor çünkü değeri çok az. İşte \u0027ortak maliyeti değere göre paylaştırma, değersiz parçayı hariç tutma\u0027 mantığı budur.","yontemler":"Önce yan mamulün NGD\u0027si (satış değeri − ek maliyet) ortak maliyetten düşülür, kalan tutar A ve B\u0027ye ayrılma noktası satış değerleri oranında dağıtılır; B\u0027nin toplam maliyetine kendi ek işleme maliyeti eklenip birim maliyet bulunur, satış fiyatından çıkarılarak birim brüt kâr hesaplanır.","nedir":"Ortak üretim sürecinde tek bir maliyetten birden çok mamul çıktığında, bu ortak maliyetin mamuller arasında paylaştırılması yöntemidir. Sınav, hangi tutarın dağıtıma girdiğini ve hangi tutarın ürüne doğrudan yüklendiğini ayırt edebilmeni ölçer."},"olay":"C\u0027nin net gerçekleşebilir değeri 60.000-30.000=30.000 TL, dağıtıma esas maliyet 600.000-30.000=570.000 TL, toplam satış değeri 400.000+200.000=600.000 TL, B payı 570.000×200.000/600.000=190.000 TL, B toplam maliyeti 190.000+50.000=240.000 TL, birim maliyeti 240.000/5.000=48 TL.","tuzak":{"D":{"ad":"Ölçüm Hatası Tuzağı","metin":"Öğrenci yan mamulün ek maliyetini düşmeden satış değerinin tamamını (60.000 TL) ortak maliyetten çıkarmış; esas maliyet 540.000 TL, B payı 540.000×200.000/600.000=180.000, ek maliyetle 230.000 TL toplam, birim 46 TL bulmuş. Doğrusu: net gerçekleşebilir değer, satış değerinden satılabilir hale getirme maliyeti düşülerek bulunur."},"E":{"ad":"Katman Atlama Tuzağı","metin":"Öğrenci ayrılma noktası payını (190.000 TL) doğrudan birim maliyet gibi kullanmış, 50.000 TL\u0027lik ek işleme maliyetini eklemeyi unutmuş; birim maliyeti 38 TL, kârı 16 TL bulmuş. Doğrusu: ayrılma sonrası ek işleme maliyeti mamul maliyetine mutlaka eklenir."},"A":{"ad":"Yön Hatası Tuzağı","metin":"Öğrenci yan mamulün net gerçekleşebilir değerini ortak maliyetten düşmek yerine ortak maliyete eklemiş, esas maliyeti 630.000 TL almış; 630.000×200.000/600.000=210.000 payı bulup 50.000 TL ek maliyetle 260.000 TL toplam, birim maliyeti 52 TL çıkarmış. Doğrusu: net gerçekleşebilir değer ortak maliyetten düşülür, eklenmez."},"B":{"ad":"Kapsam Atlama Tuzağı","metin":"Öğrenci yan mamulün net gerçekleşebilir değerini hiç dikkate almadan 600.000 TL\u0027nin tamamını A ve B\u0027ye dağıtmış; B payı 600.000×200.000/600.000=200.000, ek maliyetle 250.000 TL toplam, birim 50 TL bulmuş. Doğrusu: yan mamulün net gerçekleşebilir değeri dağıtımdan önce mutlaka düşülür."}},"celdiriciYol":{"D":"540.000 × 200.000/600.000 = 180.000; 180.000+50.000=230.000; 230.000/5.000=46; 54-46 = 8 (net gerçekleşebilir değer yerine satış değerinin tamamını kullanma hatası)","E":"190.000/5.000 = 38; 54-38 = 16 (ek işleme maliyetini toplam maliyete eklememe hatası)","A":"630.000 × 200.000/600.000 = 210.000; 210.000+50.000=260.000; 260.000/5.000=52; 54-52 = 2 (net gerçekleşebilir değeri ortak maliyete ekleme hatası)","B":"600.000 × 200.000/600.000 = 200.000; 200.000+50.000=250.000; 250.000/5.000=50; 54-50 = 4 (yan mamulün net gerçekleşebilir değerini hiç düşmeme hatası)"},"hap":"Ortak maliyet dağıtımında önce yan mamulün net gerçekleşebilir değeri ortak maliyetten düşülür, kalan tutar satış değerine göre dağıtılır ve ayrılma sonrası ek işleme maliyeti mutlaka eklenir.","teshis":{"C":{"gercek":"Doğru sonuç, hem net gerçekleşebilir değer düşümünü hem ek işleme maliyetinin eklenmesini birlikte uygular.","ayirt":"Tüm katmanları (NGD düşümü, dağıtım, ek maliyet) sırayla uyguladım mı?","paragraf":"Ortak maliyet dağıtımı ve ayrılma sonrası maliyetler","yanilgi":"Dağıtım oranını doğru bulsan da ek işleme maliyetini eklemeyi gereksiz sanıp bu şıkkı elersin."},"E":{"gercek":"Ayrılma noktasından sonraki ek işleme maliyeti doğrudan ilgili mamule yüklenir ve toplam maliyete eklenir.","ayirt":"Ayrılma noktasından sonra ek bir işlem/maliyet var mı?","paragraf":"Ayrılma noktası sonrası maliyetler","yanilgi":"Ortak maliyetten alınan payı doğrudan nihai birim maliyet sanıyor, ayrılma sonrası maliyeti unutuyorsun."},"A":{"gercek":"Yan mamulün net gerçekleşebilir değeri ortak maliyetten düşülür; yan ürün ana mamullerin taşıdığı yükü hafifletir.","ayirt":"Yan mamul değeri ana mamullerin maliyetini artırır mı, azaltır mı?","paragraf":"Ortak maliyet dağıtımı teorisi","yanilgi":"Yan mamulün değerini ortak maliyeti artıran bir kalem gibi görüp ortak maliyete ekliyorsun."},"D":{"gercek":"Net gerçekleşebilir değer = satış değeri - satılabilir hale getirme (ek) maliyeti.","ayirt":"Satış değerinden ek maliyeti düştüm mü?","paragraf":"Net gerçekleşebilir değer yöntemi","yanilgi":"Net gerçekleşebilir değer ile satış değerini aynı şey sanıyor, ek maliyeti düşmeyi unutuyorsun."},"B":{"gercek":"Yan mamulün net gerçekleşebilir değeri dağıtımdan önce ortak maliyetten düşülmelidir.","ayirt":"Yan mamul için ayrı bir değer hesapladım mı?","paragraf":"Ortak maliyet dağıtımı teorisi","yanilgi":"Yan mamulün ortak maliyet üzerindeki etkisini tamamen göz ardı edip tüm tutarı ana mamullere dağıtıyorsun."}},"verilen":[[12,1],[13,1],[14,1],[15,1],[16,1],[17,1],[18,1],[19,1],[20,1],[21,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 62"},"kural":"ağırlıklı ortalama yöntemde eşdeğer birim, tamamlanan birim artı dönem sonu yarı mamulün tamamlanma yüzdesiyle çarpımı ile bulunur; bu hesap direkt ilk madde ve dönüştürme maliyeti için ayrı yapılır, birim maliyetler toplanıp tamamlanan miktarla çarpılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 62","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce hangi tamamlanma yüzdesinin hangi maliyet unsuruna ait olduğunu tabloya yaz, sonra eşdeğer birimleri ayrı ayrı hesapla.","konu":"eşdeğer birim maliyeti","tablo":{"satirlar":[["VERİLENLER","-","-"],["Dönem başı yarı mamul miktarı","1.000 birim","-"],["Dönem başı yarı mamul ilk madde tamamlanma derecesi","%100","-"],["Dönem başı yarı mamul dönüştürme tamamlanma derecesi","%60","-"],["Dönem başı yarı mamul ilk madde maliyeti","9.000 TL","-"],["Dönem başı yarı mamul dönüştürme maliyeti","3.600 TL","-"],["Dönem içi üretime başlanan miktar","9.000 birim","-"],["Tamamlanıp devredilen miktar","8.000 birim","-"],["Dönem sonu yarı mamul miktarı","2.000 birim","-"],["Dönem sonu yarı mamul ilk madde tamamlanma derecesi","%100","-"],["Dönem sonu yarı mamul dönüştürme tamamlanma derecesi","%50","-"],["Dönem içi ilk madde gideri","81.000 TL","-"],["Dönem içi dönüştürme maliyeti","77.400 TL","-"],["HESAP","-","-"],["Direkt ilk madde ve malzeme eşdeğer birimi","8.000 + 2.000 x %100","10.000"],["Dönüştürme maliyeti eşdeğer birimi","8.000 + 2.000 x %50","9.000"],["Direkt ilk madde ve malzeme toplam maliyeti","9.000 + 81.000","90.000"],["Dönüştürme toplam maliyeti","3.600 + 77.400","81.000"],["Direkt ilk madde ve malzeme birim maliyeti","90.000 / 10.000","9"],["Dönüştürme birim maliyeti","81.000 / 9.000","9"],["Toplam eşdeğer birim maliyeti","9 + 9","18"],["Tamamlanan 8.000 birimin toplam maliyeti","8.000 x 18","144.000"]],"basliklar":["Kalem","Hesaplama","Tutar"]},"siklar":{"C":"144.000","E":"171.000","A":"133.600","D":"144.800","B":"136.800"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2],[5,1],[5,2],[6,1],[6,2],[7,1],[7,2]],"tablo":{"basliklar":["Kalem","Hesaplama","Tutar"],"satirlar":[["Direkt ilk madde ve malzeme eşdeğer birimi","8.000 + 1.200 x %100","9.200"],["Dönüştürme maliyeti eşdeğer birimi","8.000 + 1.200 x %50","8.600"],["Direkt ilk madde ve malzeme toplam maliyeti","10.800 + 81.200","92.000"],["Dönüştürme toplam maliyeti","4.320 + 81.680","86.000"],["Direkt ilk madde ve malzeme birim maliyeti","92.000 / 9.200","10"],["Dönüştürme birim maliyeti","86.000 / 8.600","10"],["Toplam eşdeğer birim maliyeti","10 + 10","20"],["Dönem sonu yarı mamul stokunun toplam maliyeti","(1.200 x 10) + (600 x 10)","18.000"]]},"tur":"tablo","soru":"Tek safhada üretim yapan bir işletme, mamul maliyetini ağırlıklı ortalama yöntemiyle hesaplamaktadır. Direkt ilk madde ve malzeme sürecin başında tam verilir; dönüştürme maliyeti süreç boyunca eşit hızda gerçekleşir. Dönem başı yarı mamul 1.200 birim olup ilk madde açısından %100, dönüştürme açısından %60 tamamlanmıştır; maliyeti 10.800 TL ilk madde, 4.320 TL dönüştürmedir. Dönem içinde 8.000 birim üretime başlanmış, 8.000 birim tamamlanıp devredilmiş, kalan 1.200 birim dönem sonu yarı mamul ilk madde açısından %100, dönüştürme açısından %50 tamamlanmıştır. Dönem içi ilk madde gideri 81.200 TL, dönüştürme maliyeti 81.680 TL\u0027dir. Dönem sonu yarı mamul stokunun toplam maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve dönem sonu yarı mamul stokunun toplam maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Tek safhada üretim yapan işletme, mamul maliyetini ağırlıklı ortalama yöntemiyle hesaplamaktadır. Direkt ilk madde ve malzeme sürecin başında tam verilir; dönüştürme maliyeti (işçilik ve genel üretim gideri) süreç boyunca eşit hızda gerçekleşir. Dönem başı yarı mamul 1.000 birim olup ilk madde açısından %100, dönüştürme açısından %60 tamamlanmıştır; maliyeti 9.000 TL ilk madde, 3.600 TL dönüştürmedir. Dönem içinde 9.000 birim üretime başlanmış, 8.000 birim tamamlanıp devredilmiş, kalan 2.000 birim dönem sonu yarı mamul ilk madde açısından %100, dönüştürme açısından %50 tamamlanmıştır. Dönem içi ilk madde gideri 81.000 TL, dönüştürme maliyeti 77.400 TL\u0027dir. Tamamlanan 8.000 birimin toplam maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-44","verilenler":[{"deger":"1.000 birim","anlam":"Dönem başında üretimde bulunan, tamamlanmamış yarı mamul sayısıdır.","ad":"Dönem başı yarı mamul miktarı"},{"deger":"%100","anlam":"Dönem başı yarı mamulün direkt ilk madde açısından ne kadar tamamlandığını gösterir; ağırlıklı ortalama yönteminde eşdeğer birim hesabına doğrudan girmez, bilgi amaçlıdır.","ad":"Dönem başı yarı mamul ilk madde tamamlanma derecesi"},{"deger":"%60","anlam":"Dönem başı yarı mamulün dönüştürme maliyeti açısından tamamlanma oranıdır; ağırlıklı ortalama yönteminde eşdeğer birim hesabına girmez, bilgi amaçlıdır.","ad":"Dönem başı yarı mamul dönüştürme tamamlanma derecesi"},{"deger":"9.000 TL","anlam":"Dönem başı yarı mamulün taşıdığı direkt ilk madde ve malzeme maliyetidir, dönem içi maliyetle toplanır.","ad":"Dönem başı yarı mamul ilk madde maliyeti"},{"deger":"3.600 TL","anlam":"Dönem başı yarı mamulün taşıdığı dönüştürme maliyetidir, dönem içi maliyetle toplanır.","ad":"Dönem başı yarı mamul dönüştürme maliyeti"},{"deger":"9.000 birim","anlam":"Bu dönem içinde üretime yeni başlanan birim sayısıdır, toplam üretilebilir miktarı belirler.","ad":"Dönem içi üretime başlanan miktar"},{"deger":"8.000 birim","anlam":"Bu dönemde tamamlanarak bir sonraki safhaya aktarılan birim sayısıdır, eşdeğer birim ve istenen maliyetin tabanıdır.","ad":"Tamamlanıp devredilen miktar"},{"deger":"2.000 birim","anlam":"Dönem sonunda hâlâ tamamlanmamış birim sayısıdır, eşdeğer birime tamamlanma yüzdesiyle ağırlıklandırılarak eklenir.","ad":"Dönem sonu yarı mamul miktarı"},{"deger":"%100","anlam":"Dönem sonu yarı mamulün direkt ilk madde açısından tamamlanma oranı, ilk madde eşdeğer birimi hesabında kullanılır.","ad":"Dönem sonu yarı mamul ilk madde tamamlanma derecesi"},{"deger":"%50","anlam":"Dönem sonu yarı mamulün dönüştürme maliyeti açısından tamamlanma oranı, dönüştürme eşdeğer birimi hesabında kullanılır.","ad":"Dönem sonu yarı mamul dönüştürme tamamlanma derecesi"},{"deger":"81.000 TL","anlam":"Bu dönemde gerçekleşen direkt ilk madde ve malzeme giderinin toplamıdır, dönem başı maliyetiyle toplanır.","ad":"Dönem içi ilk madde gideri"},{"deger":"77.400 TL","anlam":"Bu dönemde gerçekleşen işçilik ve genel üretim gideri toplamıdır, dönem başı maliyetiyle toplanır.","ad":"Dönem içi dönüştürme maliyeti"}],"dayanak":"Maliyet Muhasebesi Teori Notu - Safha Maliyet Sisteminde Eşdeğer Ürün Birimleri (ağırlıklı ortalama yöntemi)","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Dönem başı yarı mamul 1.000 birim, ilk madde %100 dönüştürme %60 tamamlanmış (soruda verilen); dönem başı maliyeti 9.000 TL ilk madde ve 3.600 TL dönüştürme (soruda verilen); üretime başlanan 9.000 birim (soruda verilen); tamamlanıp devredilen 8.000 birim (soruda verilen); dönem sonu yarı mamul 2.000 birim, ilk madde %100 dönüştürme %50 (soruda verilen); dönem içi ilk madde gideri 81.000 TL, dönüştürme maliyeti 77.400 TL (soruda verilen)","anlatim":"Soru bize dönem başı ve dönem sonu yarı mamul miktarlarını, tamamlanma yüzdelerini ve maliyetleri vermiş. Ağırlıklı ortalama yöntemiyle çözeceğiz, bu yüzden dönem başı maliyeti dönem içi maliyetle birleştireceğiz.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[11,1],[12,1]]},{"formul":"Eşdeğer birim = Tamamlanan birim + Dönem sonu yarı mamul × tamamlanma yüzdesi","anlatim":"Eşdeğer birim nedir? Yarım kalan üretimi tam birim cinsinden ifade etmemizi sağlar, çünkü 2.000 birimin yarısı bitmişse bu 1.000 tam birim gibi sayılır.","doldur":[]},{"formul":"Direkt ilk madde ve malzeme eşdeğer birimi = Tamamlanan + Dönem sonu yarı mamul × tamamlanma% = 8.000 (soruda verilen) + 2.000 (soruda verilen) × %100 (soruda verilen) = 10.000","anlatim":"Direkt ilk madde sürecin başında tam verildiği için dönem sonu stok da bu kalemde zaten %100 tamamlanmış sayılır. Bu yüzden ilk madde eşdeğer birimi tamamlanan ile dönem sonu stokun toplamı olur.","doldur":[[14,2],[14,1],[15,1],[20,1],[21,1]]},{"formul":"Dönüştürme maliyeti eşdeğer birimi = Tamamlanan + Dönem sonu yarı mamul × tamamlanma% = 8.000 (soruda verilen) + 2.000 (soruda verilen) × %50 (soruda verilen) = 9.000","anlatim":"Dönüştürme maliyeti süreç boyunca eşit hızda oluştuğu için dönem sonu stok sadece %50 tamamlanmış sayılır. Bu yüzden bu kalemde eşdeğer birim ilk maddeden daha düşük çıkar.","doldur":[[15,2]]},{"formul":"Direkt ilk madde ve malzeme toplam maliyeti = Dönem başı maliyeti + Dönem içi gider = 9.000 (soruda verilen) + 81.000 (soruda verilen) = 90.000","anlatim":"Ağırlıklı ortalama yöntemde dönem başı stokun maliyeti dönem içi maliyetle birleştirilir, ikisi ayrılmaz. Bu yüzden ilk madde toplam maliyetini bulmak için ikisini topluyoruz.","doldur":[[16,2],[16,1],[18,1],[19,1]]},{"formul":"Dönüştürme toplam maliyeti = Dönem başı maliyeti + Dönem içi maliyet = 3.600 (soruda verilen) + 77.400 (soruda verilen) = 81.000","anlatim":"Aynı mantığı dönüştürme maliyeti için de uyguluyoruz, dönem başı ve dönem içi tutarları topluyoruz.","doldur":[[17,2],[17,1]]},{"formul":"Direkt ilk madde ve malzeme birim maliyeti = Toplam maliyet / Eşdeğer birim = 90.000 (5. adımda bulduk) / 10.000 (3. adımda bulduk) = 9 TL/birim","anlatim":"Şimdi ilk madde birim maliyetini buluyoruz, toplam maliyeti eşdeğer birime bölüyoruz. Bu bize her bir eşdeğer birimin ilk madde açısından ne kadara mal olduğunu gösterir.","doldur":[[18,2]]},{"formul":"Dönüştürme birim maliyeti = Toplam maliyet / Eşdeğer birim = 81.000 (6. adımda bulduk) / 9.000 (4. adımda bulduk) = 9 TL/birim","anlatim":"Dönüştürme birim maliyetini de aynı yöntemle buluyoruz. Eşdeğer birim daha düşük olduğu için toplam maliyet küçük olsa da birim maliyet ilk maddeyle aynı çıkabilir.","doldur":[[19,2]]},{"formul":"Toplam eşdeğer birim maliyeti = İlk madde birim maliyet + Dönüştürme birim maliyet = 9 (7. adımda bulduk) + 9 (8. adımda bulduk) = 18 TL/birim","anlatim":"Bir birimin toplam maliyetini bulmak için ilk madde ve dönüştürme birim maliyetlerini topluyoruz. Bu, tamamlanan bir birimin üzerindeki toplam yükü verir.","doldur":[[20,2]]},{"formul":"Tamamlanan 8.000 birimin toplam maliyeti = Tamamlanan birim × Toplam eşdeğer birim maliyeti = 8.000 (soruda verilen) × 18 (9. adımda bulduk) = 144.000 TL","anlatim":"Artık 8.000 birimin toplam maliyetini bulabiliriz, tamamlanan birimi toplam birim maliyetle çarpıyoruz. Bu bize devredilen mamulün defterlere geçecek tutarını verir.","doldur":[[21,2]]},{"formul":"Ters durum: yöntem ilk giren ilk çıkar (FIFO) olsaydı → dönem başı stok maliyeti eşdeğer birime karışmaz, ayrı hesaplanır","anlatim":"Ters durum: yöntem ilk giren ilk çıkar (FIFO) olsaydı dönem başı stok ayrı işlem görürdü. Dönem başı yarı mamulün tamamlanmamış kısmı ayrı eşdeğer birime eklenir, ağırlıklı ortalamadaki gibi baştan sayılmazdı.","doldur":[]},{"formul":"Yanlış yol: 81.000 / 10.000 + 77.400 / 9.000 = 8,1 + 8,6 = 16,7 TL/birim (HATALI) → doğrusu 90.000 / 10.000 + 81.000 / 9.000 = 18 TL/birim (7,8. adımda bulduk)","anlatim":"En sık hata: dönem başı yarı mamul maliyetini (9.000+3.600) toplam maliyete katmayı unutup sadece dönem içi giderleri bölmek. Ağırlıklı ortalamada dönem başı stok maliyeti mutlaka toplam maliyete dahil edilir.","doldur":[]}],"anahtar":[{"ornek":"maliyeti","kok":"maliye"},{"ornek":"tamamlanan","kok":"tamaml"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"birimin","kok":"birimi"},{"ornek":"dönüştürme","kok":"dönüşt"},{"ornek":"ortalama","kok":"ortala"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda hem tamamlanan hem yarı mamul birimler varken. Nasıl ölçülür: tamamlanan birim artı dönem sonu yarı mamulün tamamlanma yüzdesiyle çarpımı toplanarak. Nasıl kaydedilir: bulunan eşdeğer birime göre toplam maliyet bölünüp birim maliyet üretim maliyeti tablosuna işlenir.","desen":"Sınav genelde ilk madde ile dönüştürme maliyetinin tamamlanma yüzdelerini karıştırmayı hedefler, öğrenci tek yüzde kullanarak yanlış eşdeğer birim bulur. İkinci tuzak dönem başı yarı mamul maliyetini ağırlıklı ortalamada ayrı tutmaya çalışmaktır, oysa toplanır. Bu soru p.Teori Notu safha maliyet eşdeğer birim formülü noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"tamamlanan birim ile yarı mamulün tamamlanma oranına göre ağırlıklandırılmış toplam birim","ad":"eşdeğer birim","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"yarı mamulün ilgili maliyet unsuru açısından ne kadar işlem gördüğünü gösteren oran","ad":"tamamlanma yüzdesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Dönem başı yarı mamul maliyetiyle dönem içi maliyetin birlikte harmanlandığı hesaplama şekli","ad":"ağırlıklı ortalama yöntemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"toplam maliyetin (dönem başı+dönem içi) eşdeğer birime bölünmesiyle bulunan tutar","ad":"birim maliyet","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Dönem başı ve dönem içi veriler verilir, tamamlanan birimlerin toplam maliyeti istenir.","panel_ornek":"Bir pastane haftalık 40 kg un siparişi veriyor, hafta başında 5 kg\u0027lık açık koli kalmıştı. Yeni gelen unla eskisi karışıp toplam maliyet toplam kiloya bölünüyor. Böylece her kilogram unun ortalama maliyeti çıkıyor.","ornek":"Bir pastane haftalık 40 kg un siparişi veriyor, hafta başında 5 kg\u0027lık açık koli kalmıştı. Yeni gelen unla eskisi karışıp toplam maliyet toplam kiloya bölünüyor. Böylece her kilogram unun ortalama maliyeti çıkıyor.","yontemler":"Ağırlıklı ortalama yönteminde dönem başı yarı mamul maliyeti dönem içi maliyetle toplanıp tek eşdeğer birime bölünür; ilk giren ilk çıkar (FIFO) ile karıştırılmamalıdır.","nedir":"Eşdeğer birim maliyeti, safha üretiminde tamamlanan ve yarı mamul kalan birimleri ortak ölçüde birleştirip birim maliyet bulmayı sağlar. Sınav bu ortak ölçünün doğru kurulup kurulmadığını ölçer."},"olay":"İlk madde eşdeğer birimi=8.000+2.000x%100=10.000, dönüştürme eşdeğer birimi=8.000+2.000x%50=9.000; ilk madde toplam maliyet=9.000+81.000=90.000, dönüştürme toplam maliyet=3.600+77.400=81.000; ilk madde birim maliyet=90.000/10.000=9, dönüştürme birim maliyet=81.000/9.000=9; toplam birim maliyet=18; 8.000x18=144.000.","tuzak":{"D":{"ad":"Tamamlanma Derecesi Ters Kullanma Tuzağı","metin":"Dönem sonu yarı mamulün ilk madde ve dönüştürme tamamlanma yüzdelerini birbirine karıştırıp ters uygularsın. Doğrusu: ilk madde açısından %100, dönüştürme açısından %50 tamamlanma derecesi doğru unsura uygulanmalıdır."},"E":{"ad":"Dönem Sonu Yarı Mamulü Yok Sayma Tuzağı","metin":"Dönem sonunda hâlâ tamamlanmamış 2.000 birimi eşdeğer birim hesabına hiç katmayıp tüm maliyeti yalnız tamamlanan birimlere yüklersin. Doğrusu: dönem sonu yarı mamul, tamamlanma derecesiyle ağırlıklandırılarak eşdeğer birime dahil edilir."},"A":{"ad":"Dönem Başı Maliyeti İhmali Tuzağı","metin":"Dönem başı yarı mamulün maliyetini toplam maliyete katmadan yalnız dönem içi giderleri eşdeğer birime bölersin. Doğrusu: birim maliyet, dönem başı ve dönem içi maliyetlerin toplamının eşdeğer birime bölünmesiyle bulunur."},"B":{"ad":"Tek Eşdeğer Birim Tuzağı","metin":"Direkt ilk madde ve malzeme ile dönüştürme maliyetinin süreçte aynı hızda tamamlandığını varsayıp ikisi için de aynı (ilk madde) eşdeğer birimi kullanırsın. Doğrusu: her maliyet unsurunun kendi tamamlanma derecesine göre ayrı eşdeğer birimi vardır."}},"celdiriciYol":{"D":"(90.000/9.000 + 81.000/10.000) x 8.000 = (10+8,1) x 8.000 = 144.800 (tamamlanma derecelerini ilk madde ve dönüştürme arasında ters uyguladın)","E":"(90.000/8.000 + 81.000/8.000) x 8.000 = (11,25+10,125) x 8.000 = 171.000 (dönem sonu yarı mamulü eşdeğer birime dahil etmedin)","A":"(81.000/10.000 + 77.400/9.000) x 8.000 = (8,1+8,6) x 8.000 = 133.600 (dönem başı yarı mamul maliyetini toplama dahil etmedin)","B":"(90.000/10.000 + 81.000/10.000) x 8.000 = (9+8,1) x 8.000 = 136.800 (dönüştürme maliyeti için de ilk madde eşdeğer birimini kullandın)"},"hap":"Ağırlıklı ortalama yöntemde eşdeğer birim, tamamlanan birim artı dönem sonu yarı mamul x tamamlanma yüzdesi ile bulunur ve direkt ilk madde ile dönüştürme maliyeti için ayrı ayrı hesaplanır.","teshis":{"C":{"gercek":"Ağırlıklı ortalama yöntemde dönem başı ve dönem içi maliyetler unsur bazında toplanır, her unsurun eşdeğer birimine ayrı ayrı bölünüp elde edilen birim maliyetler toplanır.","ayirt":"İlk madde ile dönüştürme maliyetinin tamamlanma yüzdesini ayrı ayrı mı hesapladım?","paragraf":"Teori Notu - Safha Maliyet Sisteminde Eşdeğer Ürün Birimleri","yanilgi":"Direkt ilk madde ile dönüştürme maliyetinin tamamlanma derecesinin aynı olması gerektiğini düşünüp tek bir eşdeğer birim ile daha hızlı sonuca ulaşabileceğini sanırsın."},"E":{"gercek":"Dönem sonu yarı mamul, o dönemde katlanılan kaynağın bir kısmını taşıdığı için tamamlanma derecesiyle ağırlıklandırılarak eşdeğer birime dahil edilmelidir.","ayirt":"Eşdeğer birim hesabına dönem sonu yarı mamulü kattım mı?","paragraf":"Teori Notu - Safha Maliyet Sisteminde Eşdeğer Ürün Birimleri","yanilgi":"Dönem sonunda hâlâ tamamlanmamış birimlerin bu dönemin maliyetine hiç katkısı olmadığını düşünüyorsun."},"A":{"gercek":"Ağırlıklı ortalama yöntemde dönem başı yarı mamulün maliyeti, dönem içi maliyetle harmanlanarak tek bir birim maliyet oluşturur; ayrı tutulmaz.","ayirt":"Toplam maliyete dönem başı yarı mamulün maliyetini eklediler mi?","paragraf":"Teori Notu - Safha Maliyet Sisteminde Eşdeğer Ürün Birimleri","yanilgi":"Dönem başı yarı mamulün maliyetinin zaten geçmiş döneme ait olduğunu, bu yüzden bu dönemin hesabına girmeyeceğini düşünüyorsun."},"D":{"gercek":"İlk madde sürecin başında tam verildiği için tamamlanma derecesi genelde %100\u0027dür; dönüştürme maliyeti ise kısmi tamamlanmayı yansıtır.","ayirt":"Hangi yüzde ilk maddeye, hangisi dönüştürmeye ait, tabloya ayrı yazdım mı?","paragraf":"Teori Notu - Şekillendirme (Dönüştürme) Maliyeti ve Birim Maliyet","yanilgi":"Verilen yüzdelerin hangi maliyet unsuruna ait olduğunu karıştırıp %50\u0027yi ilk maddeye, %100\u0027ü dönüştürmeye uyguluyorsun."},"B":{"gercek":"Direkt ilk madde sürecin başında tam verilirken dönüştürme maliyeti süreç boyunca yayılır; bu nedenle iki unsurun eşdeğer birimi genelde farklıdır.","ayirt":"İlk madde ve dönüştürme için ayrı eşdeğer birim mi hesapladım?","paragraf":"Teori Notu - Şekillendirme (Dönüştürme) Maliyeti ve Birim Maliyet","yanilgi":"İki maliyet unsurunun tamamlanma hızının aynı olduğunu varsayıp işlemi kısaltmaya çalışıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[11,1],[12,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 63"},"kural":"önce D yan mamulünün net gerçekleşebilir değeri ortak maliyetten düşülür, kalan tutar katsayılı yönteme göre (miktar x katsayı) A ve B\u0027ye dağıtılır, A\u0027ya ayrılma sonrası ek işleme maliyeti eklenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 63","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Dört katmanı sırayla yaz: önce yan ürün NGD\u0027sini düş, sonra eşdeğer birimlerle dağıt, sonra ek işleme maliyetini ekle, en son ton sayısına böl.","konu":"ortak maliyet-katsayılı yöntem","tablo":{"satirlar":[["VERİLENLER","-"],["Toplam ortak maliyet","180.000 TL"],["D üretim miktarı","4 ton"],["D satış fiyatı","3.000 TL/ton"],["D ek işleme maliyeti","2.000 TL"],["A üretim miktarı ve katsayısı","10 ton, katsayı 2"],["B üretim miktarı ve katsayısı","15 ton, katsayı 4"],["A ek işleme maliyeti","7.500 TL"],["HESAP","-"],["D yan mamulü net gerçekleşebilir değeri (4x3.000-2.000)","10.000"],["Dağıtıma esas kalan ortak maliyet (180.000-10.000)","170.000"],["Eşdeğer birim A (10x2)","20"],["Eşdeğer birim B (15x4)","60"],["Toplam eşdeğer birim (20+60)","80"],["Birim eşdeğer maliyet (170.000/80)","2.125"],["A mamulü ortak maliyet payı (20x2.125)","42.500"],["A mamulü toplam maliyet (42.500+7.500)","50.000"],["A mamulü ton başına maliyet (50.000/10)","5.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"5.000","E":"7.550","A":"4.250","D":"5.250","B":"4.950"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["R yan mamulü net gerçekleşebilir değeri (5x2.500-2.500)","10.000"],["Dağıtıma esas kalan ortak maliyet (250.000-10.000)","240.000"],["Eşdeğer birim P (15x2)","30"],["Eşdeğer birim Q (18x5)","90"],["Toplam eşdeğer birim (30+90)","120"],["Birim eşdeğer maliyet (240.000/120)","2.000"],["Q mamulü ortak maliyet payı (90x2.000)","180.000"],["Q mamulü toplam maliyet (180.000+9.000)","189.000"],["Q mamulü ton başına maliyet (189.000/18)","10.500"]]},"tur":"tablo","soru":"İşletme, tek bir hammaddeden P ve Q ana mamulleri ile R yan mamulünü üretmekte, ortak maliyetlerin dağıtımında katsayılı yöntemi kullanmakta ve R yan mamulünün net gerçekleşebilir değerini ortak maliyetten düşerek hesaplama yapmaktadır. Dönemde toplam ortak maliyet 250.000 TL\u0027dir. R yan mamulü 5 ton üretilmiş, ton başına 2.500 TL\u0027den satılmakta, satılabilir hale getirilmesi için toplam 2.500 TL ek işleme maliyeti yapılmaktadır. P mamulü 15 ton (katsayı 2), Q mamulü 18 ton (katsayı 5) üretilmiş olup Q mamulüne ayrılma noktası sonrasında toplam 9.000 TL ek işleme maliyeti yüklenmiştir. Buna göre, Q mamulünün ton başına maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve Q mamulünün ton başına maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, tek bir hammaddeden A ve B ana mamulleri ile D yan mamulünü üretmekte, ortak maliyetlerin dağıtımında katsayılı yöntemi kullanmakta ve D yan mamulünün net gerçekleşebilir değerini ortak maliyetten düşerek hesaplama yapmaktadır. Dönemde toplam ortak maliyet 180.000 TL\u0027dir. D yan mamulü 4 ton üretilmiş, ton başına 3.000 TL\u0027den satılmakta, satılabilir hale getirilmesi için toplam 2.000 TL ek işleme maliyeti yapılmaktadır. A mamulü 10 ton (katsayı 2), B mamulü 15 ton (katsayı 4) üretilmiş olup A mamulüne ayrılma noktası sonrasında toplam 7.500 TL ek işleme maliyeti yüklenmiştir. Buna göre, A mamulünün ton başına maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-15","verilenler":[{"deger":"180.000 TL","anlam":"Ayrılma noktasına kadar oluşan ve tüm mamullere paylaştırılacak toplam maliyet.","ad":"Toplam ortak maliyet"},{"deger":"4 ton","anlam":"Yan mamulün net gerçekleşebilir değerini hesaplamak için gereken miktar.","ad":"D üretim miktarı"},{"deger":"3.000 TL/ton","anlam":"Yan mamulün tahmini satış değerini bulmak için kullanılır.","ad":"D satış fiyatı"},{"deger":"2.000 TL","anlam":"Yan mamulün satılabilir hale getirilmesi için katlanılan, satış değerinden düşülecek maliyet.","ad":"D ek işleme maliyeti"},{"deger":"10 ton, katsayı 2","anlam":"A mamulünün eşdeğer birimini bulmak için kullanılır.","ad":"A üretim miktarı ve katsayısı"},{"deger":"15 ton, katsayı 4","anlam":"B mamulünün eşdeğer birimini bulmak için kullanılır, toplam eşdeğer birime dahil edilir.","ad":"B üretim miktarı ve katsayısı"},{"deger":"7.500 TL","anlam":"A mamulüne ayrılma noktası sonrasında doğrudan yüklenen ve ortak maliyet payına eklenen maliyet.","ad":"A ek işleme maliyeti"}],"dayanak":"Teori Notu - birleşik maliyette katsayılı bölme yöntemi; Teori Notu - yan ürün maliyetinde ters hesaplama","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Toplam ortak maliyet 180.000 TL (soruda verilen); D üretimi 4 ton (soruda verilen); D satış fiyatı 3.000 TL/ton (soruda verilen); D ek işleme maliyeti 2.000 TL (soruda verilen); A miktarı 10 ton, katsayı 2 (soruda verilen); B miktarı 15 ton, katsayı 4 (soruda verilen); A ek işleme maliyeti 7.500 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: toplam ortak maliyet, D yan mamulünün miktarı ve satış fiyatı, ek işleme maliyetleri, A ve B\u0027nin miktar ve katsayıları.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]]},{"formul":"D net gerçekleşebilir değeri = (miktar × satış fiyatı) − ek işleme maliyeti = (4 (soruda verilen) × 3.000 (soruda verilen)) − 2.000 (soruda verilen) = 10.000","anlatim":"Yan mamul, ana mamullerin yanında istemeden çıkan ve değeri düşük olan üründür. D\u0027nin satışından beklenen net kazanç, ortak maliyetten düşülür - çünkü D kendi parasını kendi öder.","doldur":[[9,1]]},{"formul":"Dağıtıma esas ortak maliyet = Toplam ortak maliyet − D net gerçekleşebilir değeri = 180.000 (soruda verilen) − 10.000 (2. adımda bulduk) = 170.000","anlatim":"D\u0027nin değeri toplam ortak maliyetten düşülüyor ki geriye yalnız A ve B\u0027ye dağıtılacak tutar kalsın. Bu adım katsayılı yönteme giriş kapısıdır.","doldur":[[10,1]]},{"formul":"Eşdeğer birim A = miktar × katsayı = 10 (soruda verilen) × 2 (soruda verilen) = 20","anlatim":"Katsayılı yöntemde her mamulün gerçek miktarı katsayıyla çarpılıp eşdeğer birime çevrilir. A\u0027nın katsayısı 2, yani her tonu iki birim ağırlık taşır.","doldur":[[11,1]]},{"formul":"Eşdeğer birim B = miktar × katsayı = 15 (soruda verilen) × 4 (soruda verilen) = 60","anlatim":"Aynı işlemi B için de yapıyoruz - B\u0027nin katsayısı 4 olduğu için birim değeri daha yüksek sayılır.","doldur":[[12,1]]},{"formul":"Toplam eşdeğer birim = Eşdeğer birim A + Eşdeğer birim B = 20 (4. adımda bulduk) + 60 (5. adımda bulduk) = 80","anlatim":"Ortak maliyeti paylaştırmadan önce toplam eşdeğer birimi buluyoruz - pay bu toplama göre bölünecek.","doldur":[[13,1]]},{"formul":"Birim eşdeğer maliyet = Dağıtıma esas ortak maliyet / Toplam eşdeğer birim = 170.000 (3. adımda bulduk) / 80 (6. adımda bulduk) = 2.125","anlatim":"Şimdi bir eşdeğer birime düşen ortak maliyeti buluyoruz - bu, dağıtımın anahtar rakamıdır.","doldur":[[14,1]]},{"formul":"A mamulü ortak maliyet payı = Eşdeğer birim A × Birim eşdeğer maliyet = 20 (4. adımda bulduk) × 2.125 (7. adımda bulduk) = 42.500","anlatim":"A\u0027nın eşdeğer birimini bu birim maliyetle çarpınca A\u0027ya düşen ortak maliyet payını buluruz.","doldur":[[15,1]]},{"formul":"A mamulü toplam maliyet = A ortak maliyet payı + A ek işleme maliyeti = 42.500 (8. adımda bulduk) + 7.500 (soruda verilen) = 50.000","anlatim":"A, ayrılma noktasından sonra ek işlemden geçiyor - bu maliyet A\u0027nın toplam maliyetine ayrıca eklenir.","doldur":[[16,1]]},{"formul":"A mamulü ton başına maliyet = A toplam maliyet / miktar = 50.000 (9. adımda bulduk) / 10 (soruda verilen) = 5.000 TL","anlatim":"Toplam maliyeti üretilen ton sayısına bölünce A\u0027nın ton başına maliyetine ulaşırız - soru bunu istiyor.","doldur":[[17,1]]},{"formul":"Ters durum: B mamulünün ton başına maliyeti sorulsaydı → B ortak maliyet payı = 60 × 2.125 = 127.500, sonra 15 tona bölünürdü","anlatim":"Aynı yöntem B için de işler ama B\u0027de A ek işleme maliyeti eklenmez, B kendi ek işleme maliyetiyle (varsa) hesaplanır.","doldur":[]},{"formul":"Yanlış yol: 180.000 / 80 = 2.250; 2.250 × 20 = 45.000; (45.000+7.500)/10 = 5.250 (HATALI) → doğrusu 5.000 TL (10. adımda bulduk)","anlatim":"En sık hata: öğrenciler D\u0027nin net gerçekleşebilir değerini düşmeyi unutup 180.000\u0027i doğrudan 80 eşdeğer birime bölerler.","doldur":[]}],"anahtar":[{"ornek":"maliyetten","kok":"maliye"},{"ornek":"katsayılı","kok":"katsay"},{"ornek":"değeri","kok":"değeri"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"miktar","kok":"miktar"},{"ornek":"yöntemde","kok":"yöntem"}],"konuGiris":{"harita":"Ne zaman test edilir: yan ürün net gerçekleşebilir değeri ortak maliyetten düşüldükten sonra kalan tutar katsayılı yönteme göre ana ürünlere dağıtılırken. Nasıl ölçülür: her ana ürünün miktarı katsayısıyla çarpılıp eşdeğer birim bulunur, kalan ortak maliyet toplam eşdeğer birime bölünüp birim maliyet elde edilir. Nasıl kaydedilir: bulunan pay, ürüne ait ayrılma sonrası ek işleme maliyetiyle toplanıp toplam ton sayısına bölünerek birim maliyet raporlanır.","desen":"Sınav önce yan ürünün net gerçekleşebilir değerini ortak maliyetten düşürtür, sonra kalan tutarı katsayılı yöntemle ana ürünlere dağıttırır. Tuzak, ayrılma sonrası ek işleme maliyetinin dağıtıma girmeyip doğrudan ilgili ürüne eklenmesidir. Bu soru p.28 katsayılı bölme yöntemi noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Satış tutarından ek işleme maliyeti düşülünce kalan tutar","ad":"Net gerçekleşebilir değer (yan ürün)","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Ürün miktarı ile teknik katsayının çarpımından oluşan ağırlıklı miktar","ad":"Eşdeğer birim","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Ürünler arası kalite/değer farkını yansıtan teknik ağırlık faktörü","ad":"Katsayı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Ayrılma noktası sonrası doğrudan ürüne yüklenen maliyet","ad":"Ek işleme maliyeti","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Toplam ortak maliyet, yan ürün bilgileri ve ana ürünlerin miktar-katsayı-ek maliyet bilgileri verilir, ana ürünün ton başına maliyeti istenir.","panel_ornek":"Bir fırın aynı hamurdan büyük ve küçük ekmek yapıyor; büyük ekmeğe katsayı 2, küçüğe katsayı 1 veriliyor. Toplam un maliyeti 200 TL, büyük ekmek 30 adet küçük ekmek 40 adet ise, maliyet adet değil bu ağırlıklı sayıya göre bölünüyor.","ornek":"Bir fırın aynı hamurdan büyük ve küçük ekmek yapıyor; büyük ekmeğe katsayı 2, küçüğe katsayı 1 veriliyor. Toplam un maliyeti 200 TL, büyük ekmek 30 adet küçük ekmek 40 adet ise, maliyet adet değil bu ağırlıklı sayıya göre bölünüyor.","yontemler":"Önce yan ürünün net gerçekleşebilir değeri bulunup ortak maliyetten düşülür; sonra kalan tutar eşdeğer birim oranında paylaştırılıp ürüne özel ek maliyet eklenerek birim maliyet bulunur.","nedir":"Ortak maliyet-katsayılı yöntem, tek üretim sürecinden çıkan farklı ürünlere ortak maliyeti teknik bir ağırlık ölçüsüyle paylaştırır. Sınav bu paylaşımın doğru hesaplanıp hesaplanmadığını ölçer."},"olay":"D NGD=4x3.000-2.000=10.000; kalan ortak maliyet=180.000-10.000=170.000; eşdeğer birim A=10x2=20, B=15x4=60, toplam=80; birim eşdeğer maliyet=170.000/80=2.125; A payı=20x2.125=42.500; A toplam maliyet=42.500+7.500=50.000; ton başına=50.000/10=5.000.","tuzak":{"D":{"ad":"Yan Ürünü Yok Sayma Tuzağı","metin":"D yan mamulünün net gerçekleşebilir değerini ortak maliyetten hiç düşmeden, 180.000 TL\u0027nin tamamını A ve B\u0027ye katsayılı yöntemle dağıtıyorsun. Doğrusu: dağıtıma esas tutar, yan ürün değeri düşüldükten sonraki 170.000 TL olmalıdır."},"E":{"ad":"Yöntem Karıştırma Tuzağı","metin":"Katsayılı yöntem yerine fiziksel ölçü (miktar) yöntemini uygulayıp ortak maliyeti yalnızca ton oranına göre paylaştırıyorsun. Doğrusu: katsayılı yöntemde dağıtım anahtarı miktar değil, miktar ile katsayının çarpımından oluşan eşdeğer birimdir."},"A":{"ad":"Ek İşleme Maliyetini Atlama Tuzağı","metin":"A mamulüne isabet eden ortak maliyet payını doğrudan ton sayısına bölüp ayrılma sonrası 7.500 TL\u0027lik ek işleme maliyetini eklemeyi unutuyorsun. Doğrusu: ek işleme maliyeti toplam maliyete eklendikten sonra ton sayısına bölünür."},"B":{"ad":"Yan Ürün Değerini Yanlış Ölçme Tuzağı","metin":"D yan mamulünün satılabilir hale getirilmesi için katlanılan 2.000 TL\u0027lik ek işleme maliyetini düşmeden, D\u0027nin tüm satış değerini (12.000 TL) ortak maliyetten düşüyorsun. Doğrusu: ortak maliyetten yalnız net gerçekleşebilir değer (satış değeri eksi ek işleme maliyeti) düşülür."}},"celdiriciYol":{"D":"180.000/80=2.250; 20x2.250=45.000; 45.000+7.500=52.500; 52.500/10=5.250 (yan ürünün net gerçekleşebilir değeri ortak maliyetten hiç düşülmedi)","E":"170.000x(10/25)=68.000; 68.000+7.500=75.500; 75.500/10=7.550 (katsayı yerine fiziksel miktar oranı kullanıldı)","A":"170.000/80=2.125; 20x2.125=42.500; 42.500/10=4.250 (ek işleme maliyeti eklenmeden bölündü)","B":"180.000-12.000=168.000; 168.000/80=2.100; 20x2.100=42.000; 42.000+7.500=49.500; 49.500/10=4.950 (yan ürünün ek işleme maliyeti düşülmeden tam satış değeri düşüldü)"},"hap":"Katsayılı yöntemde dağıtım anahtarı eşdeğer birimdir (miktar x katsayı); yan ürünün net gerçekleşebilir değeri önce ortak maliyetten düşülür, ayrılma sonrası ek işleme maliyeti ise dağıtım payına ayrıca eklenir.","teshis":{"C":{"gercek":"Katsayılı yöntemde eşdeğer birim = miktar x katsayı; dağıtıma esas tutar yan ürün net gerçekleşebilir değeri düşüldükten sonraki kalan ortak maliyettir; sonuca ek işleme maliyeti eklenir.","ayirt":"Dört katmanı da sırasıyla uyguladım mı: yan ürün düşme, katsayılı dağıtım, ek işleme ekleme, ton başına bölme?","paragraf":"Teori Notu - birleşik maliyette katsayılı bölme yöntemi","yanilgi":"Bu şıkkı eleyen öğrenci, dört katmanı (yan ürün NGD düşme, katsayılı dağıtım, ek işleme ekleme, ton başına bölme) tek adımda birleştirilebileceğini düşünüp kısayol arar ve hata yapar."},"E":{"gercek":"Katsayılı yöntemde dağıtım anahtarı miktar değil, miktar ile teknik/fiziksel katsayının çarpımı olan eşdeğer birimdir; bu, fiziksel ölçü yönteminin geliştirilmiş halidir.","ayirt":"Dağıtımı yaparken katsayıyı miktarla çarptım mı, yoksa yalnız miktar oranını mı kullandım?","paragraf":"Teori Notu - birleşik maliyette katsayılı bölme yöntemi","yanilgi":"Katsayılı yöntem ile fiziksel ölçü (miktar) yönteminin aynı şey olduğunu sanıyorsun."},"A":{"gercek":"Ayrılma noktasından sonraki maliyetler her ürüne doğrudan yüklenir; katsayılı dağıtım payına eklenerek toplam maliyet bulunur.","ayirt":"Bu maliyet ayrılma noktasından önce mi sonra mı oluştu, ve toplam maliyete eklendi mi?","paragraf":"Teori Notu - birleşik (ortak) maliyet, ayrılma noktası sonrası maliyetler","yanilgi":"Ayrılma noktasından sonraki ek işleme maliyetinin de A\u0027nın maliyetine dahil edilmesi gerektiğini atlıyorsun."},"D":{"gercek":"Yan ürünün net gerçekleşebilir değeri, dağıtıma esas ortak maliyeti bulmak için önce ortak maliyetten düşülmelidir.","ayirt":"Dağıtıma esas tutarı hesaplarken yan ürünü hiç düşürmedim mi?","paragraf":"Teori Notu - birleşik (ortak) maliyetin dağıtımı","yanilgi":"Yan ürünün ortak maliyet hesabına hiç girmediğini, sadece ana ürünlerin önemli olduğunu düşünüyorsun."},"B":{"gercek":"Ters hesaplama yaklaşımında yan ürün maliyeti = satış fiyatı - satılabilir hale getirme (ek işleme) maliyeti olarak bulunur ve bu net tutar düşülür.","ayirt":"Düştüğüm tutar yan ürünün net gerçekleşebilir değeri mi, yoksa tam satış değeri mi?","paragraf":"Teori Notu - yan ürün maliyetinde ters hesaplama","yanilgi":"Yan ürünün toplam satış değerinin doğrudan ortak maliyetten düşülebileceğini sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 39"},"kural":"Tekdüzen Hesap Planı 261\u0027e göre şerefiye, ödenen bedel ile rayiç bedelle hesaplanan net varlık (varlık-borç) arasındaki olumlu farktır; sermaye ve geçmiş yıl kârları gibi defter kalemleri bu hesaba girmez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 39","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce Net Varlık = Ödenen Bedel - Şerefiye eşitliğini kur, sonra borçları ekleyip bilinen varlıkları çıkararak bilinmeyen kalemi bul.","konu":"şerefiye hesaplama","tablo":{"satirlar":[["VERİLENLER","-"],["Ödenen bedel","170.000 TL"],["Kasa","20.000 TL"],["Alacak Senetleri","40.000 TL"],["Ticari Mallar","60.000 TL"],["Satıcılar","30.000 TL"],["Banka Kredileri","20.000 TL"],["Sermaye","90.000 TL"],["Geçmiş Yıl Kârları","15.000 TL"],["Şerefiye","40.000 TL"],["HESAP","-"],["Net varlık (rayiç) = Ödenen bedel - Şerefiye","130.000"],["Toplam borçlar (Satıcılar+Banka Kredileri)","50.000"],["Toplam rayiç varlıklar (Net varlık+Borçlar)","180.000"],["Bilinen varlıklar toplamı (Kasa+Alacak Sen.+Ticari Mallar)","120.000"],["Demirbaşlar (rayiç bedeli)","60.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"40.000","E":"140.000","A":"10.000","D":"60.000","B":"35.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Net varlık (rayiç) = Ödenen bedel - Şerefiye","170.000"],["Toplam borçlar (Satıcılar+Banka Kredileri)","65.000"],["Toplam rayiç varlıklar (Net varlık+Borçlar)","235.000"],["Bilinen varlıklar toplamı (Kasa+Alacak Sen.+Ticari Mallar)","125.000"],["Demirbaşlar (rayiç bedeli)","110.000"]]},"tur":"tablo","soru":"İşletme, Ege Turizm İşletmesini bankadan 220.000 TL ödeyerek devralmıştır. Devralınanın rayiç varlıkları: Kasa 25.000 TL, Alacak Senetleri 35.000 TL, Ticari Mallar 65.000 TL; borçları: Satıcılar 40.000 TL, Banka Kredileri 25.000 TL\u0027dir. Defterlerinde Sermaye 100.000 TL, Geçmiş Yıl Kârları 20.000 TL kayıtlıdır. 261 ŞEREFİYE hesabına 50.000 TL borç kaydedilmiştir. Demirbaşların rayiç bedeli kaç TL\u0027dir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve Demirbaşların rayiç bedelinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, Deniz Turizm İşletmesini bankadan 170.000 TL ödeyerek devralmıştır. Devralınanın rayiç varlıkları: Kasa 20.000 TL, Alacak Senetleri 40.000 TL, Ticari Mallar 60.000 TL; borçları: Satıcılar 30.000 TL, Banka Kredileri 20.000 TL\u0027dir. Defterlerinde Sermaye 90.000 TL, Geçmiş Yıl Kârları 15.000 TL kayıtlıdır. 261 ŞEREFİYE hesabına 40.000 TL borç kaydedilmiştir. Demirbaşların rayiç bedeli kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-fmuh-cokzor/kp-24","verilenler":[{"deger":"170.000 TL","anlam":"İşletmenin devralma için bankadan ödediği toplam nakit tutar; net varlıkla karşılaştırılıp şerefiye bulunur.","ad":"Ödenen bedel"},{"deger":"20.000 TL","anlam":"Devralınan işletmenin rayiç bedelle kasa varlığı, bilinen varlıklar toplamına dahil edilir.","ad":"Kasa"},{"deger":"40.000 TL","anlam":"Devralınan işletmenin rayiç bedelle alacak senedi varlığı, bilinen varlıklar toplamına dahil edilir.","ad":"Alacak Senetleri"},{"deger":"60.000 TL","anlam":"Devralınan işletmenin rayiç bedelle ticari mal varlığı, bilinen varlıklar toplamına dahil edilir.","ad":"Ticari Mallar"},{"deger":"30.000 TL","anlam":"Devralınan işletmenin borç kalemi; net varlığa ulaşmak için toplam varlıklara eklenir.","ad":"Satıcılar"},{"deger":"20.000 TL","anlam":"Devralınan işletmenin borç kalemi; net varlığa ulaşmak için toplam varlıklara eklenir.","ad":"Banka Kredileri"},{"deger":"90.000 TL","anlam":"Çeldirici verilen: defter değeri kalemidir, rayiç net varlık hesaplamasına dahil edilmez.","ad":"Sermaye"},{"deger":"15.000 TL","anlam":"Çeldirici verilen: defter değeri kalemidir, rayiç net varlık hesaplamasına dahil edilmez.","ad":"Geçmiş Yıl Kârları"},{"deger":"40.000 TL","anlam":"261 ŞEREFİYE hesabına kaydedilen tutar; ödenen bedelden çıkarılarak net varlık bulunur.","ad":"Şerefiye"}],"dayanak":"MSUGT Sıra No:1, Tekdüzen Hesap Planı - 261 ŞEREFİYE hesabı açıklaması","dogru":"D","oyunBonus":null,"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Ödenen bedel 170.000 TL (soruda verilen); Şerefiye 40.000 TL (soruda verilen); Kasa 20.000 (soruda verilen); Alacak Senetleri 40.000 (soruda verilen); Ticari Mallar 60.000 (soruda verilen); Satıcılar 30.000 (soruda verilen); Banka Kredileri 20.000 (soruda verilen); Sermaye 90.000 (soruda verilen); Geçmiş Yıl Kârları 15.000 (soruda verilen)","anlatim":"Soru bize şunları vermiş: ödenen bedel 170.000 TL, 261 ŞEREFİYE hesabına kaydedilen 40.000 TL, rayiç Kasa 20.000, Alacak Senetleri 40.000, Ticari Mallar 60.000, Satıcılar 30.000, Banka Kredileri 20.000, defterde Sermaye 90.000 ve Geçmiş Yıl Kârları 15.000.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1]]},{"formul":"261 ŞEREFİYE (BORÇ) = Ödenen bedel - Net rayiç varlık","anlatim":"261 ŞEREFİYE nedir? Bir işletme devralınırken ödenen bedelin, devralınan varlığın rayiç değerinden fazla olan kısmını gösterir. Borç tarafına yazılır çünkü bu fazladan ödenen bir varlık gibi kayda girer.","doldur":[]},{"formul":"Net varlık (rayiç) = Ödenen bedel - Şerefiye = 170.000 (soruda verilen) - 40.000 (soruda verilen) = 130.000","anlatim":"Şimdi net varlığı hesaplıyoruz: ödenen bedelden şerefiye tutarını çıkarınca devralınanın gerçek net değeri kalır. Bu net değer, rayiç varlıklar eksi borçlardır.","doldur":[[11,1]]},{"formul":"Dahil değil: Sermaye 90.000 (soruda verilen), Geçmiş Yıl Kârları 15.000 (soruda verilen)","anlatim":"Dikkat: Sermaye ve Geçmiş Yıl Kârları burada hiç kullanılmaz, çünkü şerefiye hesaplamasında defter kayıtları değil rayiç varlık-borç farkı önemlidir.","doldur":[]},{"formul":"Toplam borçlar = Satıcılar + Banka Kredileri = 30.000 (soruda verilen) + 20.000 (soruda verilen) = 50.000","anlatim":"Şimdi borçları topluyoruz, çünkü net varlığa borçları eklersek toplam rayiç varlık tutarına ulaşırız. Satıcılar ve Banka Kredileri devralınan işletmenin borçlarıdır.","doldur":[[12,1]]},{"formul":"Toplam rayiç varlıklar = Net varlık + Toplam borçlar = 130.000 (3. adımda bulduk) + 50.000 (5. adımda bulduk) = 180.000","anlatim":"Şimdi toplam rayiç varlıkları buluyoruz: net varlık zaten varlık eksi borçtu, borcu geri eklersek toplam varlık çıkar. Bu adım bize tüm varlıkların rayiç toplamını verir.","doldur":[[13,1]]},{"formul":"Bilinen varlıklar toplamı = Kasa + Alacak Senetleri + Ticari Mallar = 20.000 (soruda verilen) + 40.000 (soruda verilen) + 60.000 (soruda verilen) = 120.000","anlatim":"Şimdi bilinen varlıkları topluyoruz: Kasa, Alacak Senetleri ve Ticari Mallar soruda sayılan varlıklar. Demirbaş bunların dışında kalan, verilmemiş tek kalem.","doldur":[[14,1]]},{"formul":"Demirbaşlar (rayiç bedeli) = Toplam rayiç varlıklar - Bilinen varlıklar toplamı = 180.000 (6. adımda bulduk) - 120.000 (7. adımda bulduk) = 60.000 TL","anlatim":"Şimdi demirbaşı buluyoruz: toplam rayiç varlıklardan bilinen varlıkları çıkarırsak geriye kalan tek kalem demirbaş olur. Çünkü soru sadece bu kalemi vermemiş.","doldur":[[15,1]]},{"formul":"Ters durum: Ödenen bedel \u003c Net rayiç varlık ise → fark \u0027karlı satın alma\u0027 olarak gelir hesaplarına yazılır, 261 kullanılmaz","anlatim":"Ters durumda: eğer ödenen bedel net rayiç varlıktan düşük olsaydı, aradaki fark 261 ŞEREFİYE değil 671 gibi bir olumlu duran varlık satış kârı hesabına giderdi. Bu soruda ödenen bedel daha yüksek olduğu için şerefiye borçlu kaydedilmiş.","doldur":[]},{"formul":"Yanlış yol: 180.000 - (Sermaye 90.000 + Geçmiş Yıl Kârları 15.000) = 75.000 (HATALI) → doğrusu 180.000 - 120.000 = 60.000 (8. adımda bulduk)","anlatim":"En sık hata: öğrenciler Sermaye ve Geçmiş Yıl Kârları rakamlarını hesaplamaya dahil edip yanlış sonuca ulaşıyor. Bu kalemler defter kaydı olduğu için rayiç varlık-borç hesabına hiç girmez.","doldur":[]}],"anahtar":[{"ornek":"varlıklar","kok":"varlık"},{"ornek":"şerefiye","kok":"şerefi"},{"ornek":"ödenen","kok":"ödenen"},{"ornek":"defter","kok":"defter"},{"ornek":"hesaplamaya","kok":"hesapl"},{"ornek":"geçmiş","kok":"geçmiş"}],"konuGiris":{"harita":"Ne zaman test edilir: bir işletme başka bir işletmeyi devraldığında ödenen bedel ile rayiç net varlık arasında fark çıktığında. Nasıl ölçülür: ödenen bedelden şerefiye tutarı çıkarılarak rayiç net varlık bulunur, sonra bu net varlık rayiç aktif ve pasif kalemlerine eşitlenerek bilinmeyen kalem bulunur. Nasıl kaydedilir: şerefiye 261 hesabına borç yazılır ve 5 yılda eşit taksitlerle amortismana tabi tutulur.","desen":"Soru genelde bilinmeyen bir aktif kalemini (burada demirbaş) buldurur; öğrenci sermaye ve geçmiş yıl kârları gibi defter değerlerini rayiç hesaba yanlışlıkla karıştırır. Asıl tuzak, şerefiyenin ödenen bedelden mi yoksa rayiç varlıktan mı çıkarılacağının karıştırılmasıdır. Bu soru Tekdüzen Hesap Planı 261 Şerefiye maddesindeki \u0027ödenen bedel ile rayiç net varlık farkı\u0027 tanımından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"işletmenin devralınması için nakden ödenen toplam tutar","ad":"Devralma bedeli","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"ödenen bedel ile rayiç net varlık değeri arasındaki olumlu fark","ad":"Şerefiye","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"devralınan varlıkların güncel değerinden borçların düşülmesiyle kalan tutar","ad":"Rayiç net varlık","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"bir varlığın devralma anındaki güncel piyasa değeri","ad":"Rayiç bedel","kim":"piyasa fiyatlar"}],"sinavda":"Ödenen devralma bedeli, şerefiye tutarı ve devralınan varlık-borç kalemlerinin çoğu verilir, eksik kalan bir varlık kaleminin rayiç bedeli istenir.","panel_ornek":"İkinci el bir telefonu 5.000 TL\u0027ye alıyorsun ama telefonun piyasa değeri, içindeki parçalar toplanınca 4.000 TL ediyor. Aradaki 1.000 TL\u0027yi \u0027marka değeri, güven\u0027 için fazladan ödemiş oluyorsun; işletmeler de böyle bir farkı şerefiye diye kaydeder.","ornek":"İkinci el bir telefonu 5.000 TL\u0027ye alıyorsun ama telefonun piyasa değeri, içindeki parçalar toplanınca 4.000 TL ediyor. Aradaki 1.000 TL\u0027yi \u0027marka değeri, güven\u0027 için fazladan ödemiş oluyorsun; işletmeler de böyle bir farkı şerefiye diye kaydeder.","yontemler":"Önce ödenen bedelden şerefiye çıkarılarak rayiç net varlık bulunur; sonra bu net varlık, bilinen rayiç aktif ve pasif kalemleriyle eşitlenip bilinmeyen kalem çözülür. Sermaye ve geçmiş yıl kârları gibi defter kayıtları bu hesaplamaya karıştırılmaz.","nedir":"Şerefiye, bir işletme devralınırken ödenen bedel ile devralınan varlığın rayiç değerle hesaplanan net değeri arasındaki olumlu farktır. Sınav bu farkı ve bilinmeyen bir varlık kalemini bulmayı ölçer."},"olay":"Net varlık=170.000-40.000=130.000; Borçlar=30.000+20.000=50.000; Toplam varlık=130.000+50.000=180.000; Bilinen varlıklar=20.000+40.000+60.000=120.000; Demirbaş=180.000-120.000=60.000.","tuzak":{"C":{"ad":"Eksik Borç Toplama Tuzağı","metin":"Net varlığa yalnız Satıcılar tutarını ekleyip Banka Kredilerini borç toplamına katmayı unuttun. Doğrusu: her iki borç kalemi de (30.000+20.000=50.000) net varlığa eklenmelidir."},"E":{"ad":"Ters İşaret Tuzağı","metin":"Şerefiyeyi net varlıktan çıkarmak yerine ödenen bedele ekleyip (170.000+40.000) net varlığı ters yönde büyüttün. Doğrusu: şerefiye ödenen bedelden düşülerek net varlığa ulaşılır, eklenmez."},"A":{"ad":"Borç Düşmeme Tuzağı","metin":"Ödenen bedelden şerefiyeyi çıkarınca bulduğun 130.000\u0027i doğrudan rayiç varlık toplamı sanıp Satıcılar ile Banka Kredilerini hiç eklemedin. Doğrusu: 130.000, net varlık (varlık-borç) farkıdır; varlık toplamına ulaşmak için borçların eklenmesi gerekir."},"B":{"ad":"Defter Değeri Karışıklığı Tuzağı","metin":"Sermaye ile Geçmiş Yıl Kârları toplamını rayiç net varlık sandın; oysa bunlar Tekdüzen Hesap Planı 261 hesaplamasına hiç girmeyen defter değeri kalemleridir. Doğrusu: net varlık yalnız ödenen bedel ile şerefiye farkından bulunur."}},"celdiriciYol":{"C":"170.000-40.000=130.000; 130.000+30.000=160.000 (yalnız Satıcılar eklendi, Banka Kredileri unutuldu); 160.000-120.000=40.000 (borç kalemlerinden birini atlama)","E":"170.000+40.000=210.000 (şerefiye ters yönde eklendi); 210.000+50.000=260.000; 260.000-120.000=140.000 (şerefiyeyi çıkarma yerine ekleme, ters işaret)","A":"170.000-40.000=130.000 (borçları eklemeden doğrudan varlık toplamı sanıldı); 130.000-120.000=10.000 (borç toplamını net varlığa eklemeyi unutma)","B":"90.000+15.000=105.000 (sermaye+geçmiş yıl kârı rayiç net varlık sanıldı); 105.000+50.000=155.000; 155.000-120.000=35.000 (defter değeri kalemini rayiç net varlık yerine kullanma)"},"hap":"Şerefiye = Ödenen bedel - (Rayiç varlıklar toplamı - Borçlar toplamı); sermaye ve geçmiş yıl kârları gibi defter değeri kalemleri bu hesaplamaya girmez.","teshis":{"C":{"gercek":"Rayiç varlık toplamına ulaşmak için devralınan işletmenin TÜM borçları (Satıcılar+Banka Kredileri) net varlığa eklenmelidir.","ayirt":"Soruda verilen borç kalemlerinin tamamını mı topladım?","paragraf":"MSUGT Sıra No:1, THP 261 ŞEREFİYE","yanilgi":"Borç kalemlerinden yalnız birini (Satıcılar) net varlığa eklemenin yeterli olduğunu düşünüyorsun."},"E":{"gercek":"THP 261\u0027de şerefiye, ödenen bedelin net varlığı AŞAN kısmıdır; yani net varlık=ödenen bedel-şerefiye şeklinde çıkarılarak bulunur, eklenerek değil.","ayirt":"Şerefiyeyi denklemde doğru yönde mi (çıkararak) kullandım?","paragraf":"MSUGT Sıra No:1, THP 261 ŞEREFİYE","yanilgi":"Şerefiyenin net varlığı azaltan değil artıran bir kalem olduğunu düşünüyorsun."},"A":{"gercek":"THP 261\u0027e göre bu fark NET varlıktır (varlık-borç); toplam varlığa geçmek için borçların geri eklenmesi gerekir.","ayirt":"Bulduğum tutar varlık toplamı mı yoksa varlık-borç farkı mı?","paragraf":"MSUGT Sıra No:1, THP 261 ŞEREFİYE","yanilgi":"Ödenen bedelden şerefiyeyi çıkardığın anda varlık toplamına ulaştığını sanıyorsun."},"D":{"gercek":"Net varlık=Ödenen bedel-Şerefiye; toplam rayiç varlık=Net varlık+Borçlar; bilinmeyen varlık=Toplam varlık-Bilinen varlıklar. Bu zincir eksiksiz kurulduğunda 60.000 TL\u0027ye ulaşılır.","ayirt":"Denklemin her katmanını (net varlık, borç ekleme, bilinen varlıkları çıkarma) tek tek kontrol ettim mi?","paragraf":"MSUGT Sıra No:1, THP 261 ŞEREFİYE","yanilgi":"Bu şıkkı eleyen öğrenci, borçları eklemeden ya da defter değeri kalemlerini karıştırarak farklı bir tutara ulaşır."},"B":{"gercek":"THP 261 şerefiyeyi ÖDENEN BEDEL ile RAYİÇ BEDELLE hesaplanan net varlık arasındaki farktan tanımlar; sermaye/geçmiş yıl kârları defter değeri kalemleridir ve bu hesaba girmez.","ayirt":"Kullandığım tutar rayiç bedelle mi hesaplandı, yoksa defterde kayıtlı bir öz kaynak kalemi mi?","paragraf":"MSUGT Sıra No:1, THP 261 ŞEREFİYE","yanilgi":"Sermaye ve geçmiş yıl kârları toplamının, devralınan işletmenin rayiç net varlığı olduğunu sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 50"},"kural":"özel borçlanmada geçici yatırım geliri faizden düşülür; genel borçlanmada harcamaya ağırlıklı ortalama kapitalizasyon oranı uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 50","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Özel kredi ve genel kredi katmanlarını ayrı ayrı hesapla, sonra geçici yatırım gelirini ve ağırlıklı ortalama oranı unutma.","konu":"borçlanma maliyetleri aktifleştirme","tablo":{"satirlar":[["VERİLENLER","-"],["Özel kredi tutarı","1.500.000 TL"],["Özel kredi faiz oranı","%20"],["Geçici yatırım geliri","47.350 TL"],["Genel kredi A tutarı","750.000 TL"],["Genel kredi A faiz oranı","%16"],["Genel kredi B tutarı","450.000 TL"],["Genel kredi B faiz oranı","%20"],["Genel borçlanmalardan harcama","400.000 TL"],["HESAP","-"],["Özel kredi brüt faizi","300.000"],["Net özel kredi faizi (geçici yatırım geliri düşülmüş)","252.650"],["Genel borçlanma toplam faizi","210.000"],["Ağırlıklı ortalama kapitalizasyon oranı","%17,5"],["Genel borçlanma payı","70.000"],["Toplam aktifleştirilecek finansman gideri","322.650"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"322.650","E":"370.000","A":"252.650","D":"324.650","B":"300.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Özel kredi brüt faizi","360.000"],["Net özel kredi faizi (geçici yatırım geliri düşülmüş)","299.500"],["Genel borçlanma toplam faizi","249.000"],["Ağırlıklı ortalama kapitalizasyon oranı","%16,6"],["Genel borçlanma payı","83.000"],["Toplam aktifleştirilecek finansman gideri","382.500"]]},"tur":"tablo","soru":"İşletme, fabrika inşaatı için özel olarak kullandığı 2.000.000 TL krediye %18 faiz ödemiş, henüz harcanmayan kısmını geçici yatırıma yönlendirerek 60.500 TL faiz geliri elde etmiştir. Ayrıca genel amaçlı 900.000 TL krediye %15, 600.000 TL krediye %19 faiz uygulanmış; inşaat için genel borçlanmalardan 500.000 TL harcanmıştır.","verilen":[],"hedef":"Tabloyu doldur ve genel borçlanmalardan inşaata ilişkin aktifleştirilecek finansman giderinin (genel borçlanma payının) kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, depo inşaatı için özel olarak kullandığı 1.500.000 TL krediye %20 faiz ödemiş, henüz harcanmayan kısmını geçici yatırıma yönlendirerek 47.350 TL faiz geliri elde etmiştir. Ayrıca genel amaçlı 750.000 TL krediye %16, 450.000 TL krediye %20 faiz uygulanmış; inşaat için genel borçlanmalardan 400.000 TL harcanmıştır. TMS 23\u0027e göre aktifleştirilecek finansman gideri kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-fmuh-zor-b/kp-155","verilenler":[{"deger":"1.500.000 TL","anlam":"Depo inşaatına özel olarak kullanılan kredinin anapara tutarı, aktifleştirme hesabının ilk katmanıdır.","ad":"Özel kredi tutarı"},{"deger":"%20","anlam":"Özel kredi üzerinden yıllık katlanılan faiz oranıdır, brüt faizi hesaplamak için kullanılır.","ad":"Özel kredi faiz oranı"},{"deger":"47.350 TL","anlam":"Henüz harcanmayan kredi tutarının geçici değerlendirilmesinden elde edilen gelir, özel kredi faizinden düşülür.","ad":"Geçici yatırım geliri"},{"deger":"750.000 TL","anlam":"Genel amaçlı borçlanmalardan biri, ağırlıklı ortalama oranın paydasına girer.","ad":"Genel kredi A tutarı"},{"deger":"%16","anlam":"Genel kredi A\u0027nın faiz oranı, ağırlıklı ortalama faiz tutarının hesaplanmasında kullanılır.","ad":"Genel kredi A faiz oranı"},{"deger":"450.000 TL","anlam":"Genel amaçlı borçlanmalardan diğeri, ağırlıklı ortalama oranın paydasına girer.","ad":"Genel kredi B tutarı"},{"deger":"%20","anlam":"Genel kredi B\u0027nin faiz oranı, ağırlıklı ortalama faiz tutarının hesaplanmasında kullanılır.","ad":"Genel kredi B faiz oranı"},{"deger":"400.000 TL","anlam":"İnşaat için genel borçlanma kaynaklarından yapılan harcama, ağırlıklı ortalama oranın uygulanacağı tutardır.","ad":"Genel borçlanmalardan harcama"}],"dayanak":"TMS 23 Borçlanma Maliyetleri p.12 (özel borçlanmada geçici yatırım gelirinin düşülmesi) ve p.14, p.17 (genel borçlanmada ağırlıklı ortalama kapitalizasyon oranının harcamaya uygulanması)","dogru":"C","oyunBonus":null,"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Özel kredi 1.500.000 TL (soruda verilen); Özel kredi faiz oranı %20 (soruda verilen); Geçici yatırım faiz geliri 47.350 TL (soruda verilen); Genel kredi 1: 750.000 TL, %16 (soruda verilen); Genel kredi 2: 450.000 TL, %20 (soruda verilen); İnşaata harcanan genel borçlanma 400.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: özel kredi 1.500.000 TL ve %20 faiz, geçici yatırım geliri 47.350 TL. Genel krediler 750.000 TL %16 ve 450.000 TL %20, inşaata harcanan genel borçlanma 400.000 TL.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]]},{"formul":"Özel Kredi Brüt Faizi = Kredi Tutarı × Faiz Oranı = 1.500.000 (soruda verilen) × %20 (soruda verilen) = 300.000 TL","anlatim":"Depo için alınan özel kredi doğrudan bu yatırıma bağlı, faizi tamamen inşaatla ilgili. Önce bu kredinin brüt faizini buluyoruz.","doldur":[[10,1]]},{"formul":"Net Özel Kredi Faizi = Brüt Faiz − Geçici Yatırım Geliri = 300.000 (2. adımda bulduk) − 47.350 (soruda verilen) = 252.650 TL","anlatim":"Kredi henüz harcanmamışsa parayı geçici yatırıma koyup gelir elde edebilirsin, bu gelir gideri azaltır. TMS 23 böyle diyor: özel borçlanmada yatırım geliri faizden düşülür.","doldur":[[11,1]]},{"formul":"Genel Kredi 1 Faizi = 750.000 (soruda verilen) × %16 (soruda verilen) = 120.000 TL","anlatim":"Genel amaçlı krediler tek bir varlık için alınmamış, havuz gibi kullanılıyor. Her genel kredinin kendi faizini ayrı ayrı hesaplıyoruz, sonra toplayacağız.","doldur":[]},{"formul":"Genel Kredi 2 Faizi = 450.000 (soruda verilen) × %20 (soruda verilen) = 90.000 TL","anlatim":"İkinci genel kredinin faizini de aynı mantıkla buluyoruz. Farklı oranlar olduğu için ayrı hesaplamak zorundayız.","doldur":[]},{"formul":"Genel Borçlanma Toplam Faizi = Genel Kredi 1 Faizi + Genel Kredi 2 Faizi = 120.000 (4. adımda bulduk) + 90.000 (5. adımda bulduk) = 210.000 TL","anlatim":"Şimdi genel borçlanmaların toplam faiz yükünü buluyoruz, çünkü bu havuzdan inşaata pay dağıtacağız.","doldur":[[12,1]]},{"formul":"Ağırlıklı Ortalama Kapitalizasyon Oranı = Genel Borçlanma Toplam Faizi / Toplam Genel Borçlanma Tutarı = 210.000 (6. adımda bulduk) / 1.200.000 (750.000 soruda verilen + 450.000 soruda verilen) = %17,5","anlatim":"Genel borçlanmalar tek tek izlenemediği için ortalama bir oran kullanılır, buna ağırlıklı ortalama kapitalizasyon oranı denir. Bu oran, toplam faizi toplam kredi tutarına bölerek bulunur.","doldur":[[13,1]]},{"formul":"Genel Borçlanma Payı = İnşaata Harcanan Tutar × Ağırlıklı Ortalama Kapitalizasyon Oranı = 400.000 (soruda verilen) × %17,5 (7. adımda bulduk) = 70.000 TL","anlatim":"Genel borçlanma faizinin ne kadarının inşaata gideceğini bulmak için bu oranı, inşaata harcanan tutara uyguluyoruz. Dikkat: 400.000 TL toplam genel borçlanma değil, sadece bu inşaata harcanan kısım.","doldur":[[14,1]]},{"formul":"Toplam Aktifleştirilecek Finansman Gideri = Net Özel Kredi Faizi + Genel Borçlanma Payı = 252.650 (3. adımda bulduk) + 70.000 (8. adımda bulduk) = 322.650 TL","anlatim":"Artık iki kaynaktan gelen finansman giderini topluyoruz: özel kredinin net faizi ve genel borçlanmadan gelen pay. TMS 23\u0027e göre aktifleştirilecek tutar budur.","doldur":[[15,1]]},{"formul":"Ters durum: geçici yatırım geliri olmasaydı → Özel Kredi Faizi 300.000 (2. adımda bulduk) doğrudan aktifleştirilir","anlatim":"Ters durumda özel kredi geçici yatırıma hiç yönlendirilmeseydi, geliri düşme işlemi de olmayacaktı. O zaman brüt faiz olan 300.000 TL doğrudan aktifleştirilirdi.","doldur":[]},{"formul":"Yanlış yol: 300.000 + 210.000 = 510.000 (HATALI) → doğrusu 322.650 (9. adımda bulduk)","anlatim":"En sık hata: öğrenciler geçici yatırım gelirini düşmeyi unutup 300.000 TL\u0027yi doğrudan kullanır ya da genel borçlanmaya ağırlıklı ortalama oran yerine tek bir oranı uygular.","doldur":[]}],"anahtar":[{"ornek":"borçlanmadan","kok":"borçla"},{"ornek":"yatırım","kok":"yatırı"},{"ornek":"geliri","kok":"geliri"},{"ornek":"geçici","kok":"geçici"},{"ornek":"inşaata","kok":"inşaat"},{"ornek":"ortalama","kok":"ortala"}],"konuGiris":{"harita":"Ne zaman test edilir: Özellikli bir varlık için hem özel hem genel amaçlı borçlanma birlikte kullanıldığında test edilir. Nasıl ölçülür: Özel kredinin faizinden geçici yatırım geliri düşülür, genel kredilerin ağırlıklı ortalama faiz oranı harcanan tutara uygulanır ve ikisi toplanır. Nasıl kaydedilir: Bulunan toplam tutar, ilgili özellikli varlığın (örneğin inşaat halindeki yapının) maliyetine eklenir.","desen":"Sınav genellikle hem özel hem genel amaçlı krediyi aynı soruda verip öğrencinin geçici yatırım gelirini düşmeyi unutmasını veya genel kredide ağırlıklı ortalama yerine tek bir oranı kullanmasını bekler. Genel kredilerin ağırlıklı ortalama oranının, sadece inşaata harcanan tutara uygulanması gerektiği sıkça atlanır. Bu soru TMS 23 p.1 temel ilke maddesinden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Belirli bir varlık için alınan kredinin ödenen faiz tutarı","ad":"Özel amaçlı borçlanma faizi","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Henüz harcanmamış kredi tutarının geçici yatırımdan kazandırdığı faiz geliri","ad":"Geçici yatırım geliri","kim
