","adimlar":[{"formul":"Olay: Bir mobilya mağazası, hazır sözleşme metnine \u0027ürün kusurlu çıksa bile iade yok\u0027 hükmünü koymuş. Müşteriye imza attırırken \u0027bu maddeyi tek tek okuduk, kabul ettin\u0027 diye bir de tutanak imzalatmışlar. Ama bu hüküm hem sözleşmenin niteliğine hem işin özelliğine tamamen yabancı.","anlatim":"Mağaza binlerce müşteriyle aynı metni kullanıyor, hüküm önceden hazırlanmış ve tek taraflı sunulmuş. Kayıt tutmuş olmaları hükmü otomatik geçerli kılar mı, sen buna bakacaksın.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu madde 20\u0027ye göre kabul kaydı tek başına hükmü genel işlem koşulu olmaktan çıkarmaz, işin özelliğine yabancı hükümler ise yazılmamış sayılır. Bu iki kuralı mağazanın tutanağına uygulayacağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.20 f.2-3","karar":"doğru","anlatim":"Evet, çünkü kayıt hükmü GİK olmaktan çıkarmıyor, hüküm yine de yabancı olduğu için yazılmamış sayılıyor. İki kural aynı maddede yan yana durur. Kanun bunu açıkça söyler.","formul":"Şık A: mağazanın elinde \u0027tartıştık, kabul etti\u0027 tutanağı var, buna rağmen sen bu iade-yok hükmünü geçersiz mi sayarsın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.20 f.3","karar":"yanlış","anlatim":"Hayır, kanun kaydın \u0027tek başına\u0027 yeterli olmadığını özellikle vurguluyor. İçerik denetimi ayrıca yapılır ve yabancı hüküm elenir.","formul":"Şık B: müşteri tutanağı imzaladı diye \u0027artık hüküm kesin geçerli\u0027 der misin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.20 f.2","karar":"yanlış","anlatim":"Hayır, metinlerin özdeş olmaması GİK sayılmayı engellemez, bu ayrı bir kural. Bizim olayımızda hüküm zaten GİK niteliğinde, bu itiraz işe yaramaz.","formul":"Şık C: mağazanın başka şubelerdeki sözleşme metinleri birbirinden biraz farklıysa \u0027zaten GİK sayılmaz\u0027 der misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.20 f.1","karar":"yanlış","anlatim":"Hayır, kanun yer, kapsam, yazı türü ve şeklinin nitelendirmede önem taşımadığını açıkça söyler. Ekte olması hiçbir şeyi değiştirmez.","formul":"Şık D: hüküm sözleşmenin ekinde, ana metinde değil, yazılıymış; bu durumda tutanakla birlikte sonuç değişir mi dersin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.20 f.2-3","karar":"yanlış","anlatim":"Hayır, kanun sadece kaydın tek başına yetersiz olduğunu söylüyor, kuralın devre dışı kaldığını söylemiyor. Bu abartılı bir yorum olur.","formul":"Şık E: tutanak var diye \u0027yazılmamışlık kuralı artık hiç uygulanamaz\u0027 der misin?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Kabul kaydı tek başına hiçbir hükmü kurtarmaz, yabancı hüküm yine yazılmamış sayılır. Kendine hep şunu sor: bu kayıt hükmü GİK olmaktan çıkarıyor mu, yoksa sadece bir imza mı?","doldur":[]}],"anahtar":[{"ornek":"yabancı","kok":"yabanc"},{"ornek":"başına","kok":"başına"},{"ornek":"yazılmamış","kok":"yazılm"},{"ornek":"sayılır","kok":"sayılı"},{"ornek":"olmaktan","kok":"olmakt"},{"ornek":"çıkarmaz","kok":"çıkarm"}],"konuGiris":{"harita":"Ne zaman test edilir: Hüküm, sözleşmenin niteliğine ve işin özelliğine yabancıysa test edilir. Nasıl ölçülür: Tartışılarak kabul edildiğine dair kayıt tek başına yeterli sayılır mı sorusuyla ölçülür. Nasıl kaydedilir: Kanun metnindeki \u0027tek başına, genel işlem koşulu olmaktan çıkarmaz\u0027 ifadesiyle kaydedilir.","desen":"Sınav bu konuyu, tartışılarak kabul kaydı varmış gibi göstererek öğrenciyi yanıltmaya çalışır. Tuzak, kaydın tek başına hükmü genel işlem koşulu olmaktan çıkarmayacağını unutturmaktır (m.20). Bu soru m.20/4 fıkrasındaki \u0027tek başına onları genel işlem koşulu olmaktan çıkarmaz\u0027 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Önceden hazırlanıp çok sayıda sözleşmede kullanılmak üzere karşı tarafa sunulan hüküm.","ad":"Genel işlem koşulu","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Hükmün ayrı ayrı görüşülüp kabul edildiğine dair sözleşmeye konan not.","ad":"Tartışılarak kabul kaydı","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"soruda verilir","tanim":"Hükmün sözleşmenin niteliğine ve işin özelliğine aykırı, alışılmadık olması durumu.","ad":"Yabancılık ölçütü","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Genel işlem koşulunun geçersiz kabul edilip hiç var olmamış gibi işlem görmesi.","ad":"Yazılmamış sayılma","kim":"kanun sabitler"}],"sinavda":"Standart sözleşmedeki yabancı bir hükmün tartışılarak kabul edildiğine dair kayıt verilir ve bunun sonucu sorulur.","panel_ornek":"Bir arkadaşın kiraladığı evin sözleşmesinde ev sahibi hazır bir kağıt sunmuş ve kiracıya \u0027her maddeyi ayrı ayrı konuştuk\u0027 diye imzalatmış. Ama kiracı aslında hiçbir maddeyi tartışma fırsatı bulamamış, sadece imzalamış. İşin garibi, o kağıttaki bir madde de kiralık evle hiç alakası olmayan tuhaf bir şart içeriyormuş, mesela evcil hayvan yasağıyla ilgisi olmayan bir sigorta şartı gibi.","ornek":"Bir arkadaşın kiraladığı evin sözleşmesinde ev sahibi hazır bir kağıt sunmuş ve kiracıya \u0027her maddeyi ayrı ayrı konuştuk\u0027 diye imzalatmış. Ama kiracı aslında hiçbir maddeyi tartışma fırsatı bulamamış, sadece imzalamış. İşin garibi, o kağıttaki bir madde de kiralık evle hiç alakası olmayan tuhaf bir şart içeriyormuş, mesela evcil hayvan yasağıyla ilgisi olmayan bir sigorta şartı gibi.","yontemler":"Kayıt varlığı ile hükmün geçerliliğini birbirinden ayır; tek başına kayıt hükmü kurtarmaz.","nedir":"Genel işlem koşulları, bir tarafın önceden hazırlayıp karşı tarafa dayattığı standart sözleşme hükümleridir. Sınav, bu hükümlerin ne zaman geçersiz sayılacağını ve tartışılarak kabul kaydının hükmü kurtarıp kurtarmayacağını ölçer."},"olay":"Bu iki kural birlikte uygulanınca kayıt tek başına yeterli olmadığından hüküm genel işlem koşulu vasfını korur ve yabancılık nedeniyle yazılmamış sayılır.","tuzak":{"C":{"ad":"Özdeşlik Tuzağı","metin":"Öğrenci metinlerin özdeş olmaması kuralını ters yönde kullanıp hükmün zaten genel işlem koşulu sayılmayacağını sanır. Doğrusu: Metinlerin özdeş olmaması genel işlem koşulu sayılmayı engellemez, bu kural farklı bir olguya ilişkindir."},"E":{"ad":"Mutlaklaştırma Tuzağı","metin":"Öğrenci \u0027tek başına yeterli değildir\u0027 ifadesini \u0027hiçbir şekilde uygulanamaz\u0027 şeklinde ters çevirir. Doğrusu: Kanun yalnız kaydın tek başına yetersizliğini söyler, yazılmamışlık hükmünün uygulanmasını engellemez."},"D":{"ad":"Şekil Tuzağı","metin":"Öğrenci hükmün metinde mi ekte mi yer aldığının nitelendirmeyi etkilediğini sanır. Doğrusu: Yer, kapsam, yazı türü ve şekli nitelendirmede önem taşımaz; bu unsur kabul kaydıyla birleştirilemez."},"B":{"ad":"Yeterlilik Tuzağı","metin":"Öğrenci kabul kaydının tek başına yeterli olduğunu düşünüp hükmü geçerli sayar. Doğrusu: Kanun kaydın \u0027tek başına\u0027 yeterli olmadığını açıkça belirtir, yazılmamışlık hükmü ayrıca uygulanır."}},"celdiriciYol":null,"hap":"Tartışılarak kabul edildiğine ilişkin kayıt, hükmü tek başına genel işlem koşulu olmaktan çıkarmaz; işin özelliğine yabancı hüküm yine de yazılmamış sayılır.","teshis":{"C":{"gercek":"Metinlerin özdeş olmaması yalnız GİK sayılmayı engellemediğini gösteren ayrı bir kuraldır, somut olayla ilgisizdir.","ayirt":"Bu kural hangi olguyu düzenliyor, benim olayımla örtüşüyor mu?","paragraf":"m.20 f.2","yanilgi":"Metin özdeşliği kuralını, hükmün GİK sayılıp sayılmayacağı sorusuna yanlış uyguluyorsun."},"E":{"gercek":"Kanun sadece kaydın tek başına yetersizliğini söyler, yazılmamışlık hükmünün devre dışı kaldığını söylemez.","ayirt":"Metinde mutlak bir yasak mı var yoksa sadece bir yetersizlik mi ifade ediliyor?","paragraf":"m.20 f.2-3","yanilgi":"\u0027Tek başına yeterli değil\u0027 ifadesini \u0027hiçbir zaman uygulanamaz\u0027 şeklinde abartıyorsun."},"A":{"gercek":"Türk Borçlar Kanunu m.20 hem kabul kaydının tek başına yetersizliğini hem de yabancı hükmün yazılmamış sayılacağını aynı maddede düzenler.","ayirt":"Kayıt bu hükmü GİK olmaktan çıkarıyor mu, yoksa sadece bir belge mi?","paragraf":"m.20 f.2-3","yanilgi":"Bu şıkkı eleyen öğrenci, iki ayrı fıkranın aynı olayda birlikte uygulanabileceğini fark edemez."},"D":{"gercek":"Kanun yer, kapsam, yazı türü ve şeklinin nitelendirmede önem taşımadığını açıkça söyler.","ayirt":"Kanun bu unsura önem atfediyor mu diye maddeyi tekrar okudum mu?","paragraf":"m.20 f.1","yanilgi":"Hükmün sözleşmede mi ekte mi olduğunun sonucu değiştireceğini düşünüyorsun."},"B":{"gercek":"Kanun kaydın \u0027tek başına\u0027 yeterli olmadığını özellikle vurgular; içerik denetimi ayrıca yapılır.","ayirt":"Kanun metninde \u0027tek başına\u0027 ibaresini gördün mü?","paragraf":"m.20 f.3","yanilgi":"Kabul kaydı varsa hükmün her türlü denetimden muaf olacağını sanıyorsun."}},"verilen":[],"donem":9,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 103"},"kural":"haksız rekabet halleri 55 inci maddede sayılırken, sermaye taahhüdünün ödenmemişliğini bilerek onay verenlerin sorumluluğu 550 nci maddenin ikinci fıkrasında düzenlenen bir kuruluş sorumluluğu halidir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 103","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklarda madde numarası farklıysa önce hangi bölümün (haksız rekabet mi, kuruluş sorumluluğu mu) konusu olduğuna bak.","konu":"haksız rekabet reklam yasağı","tablo":{"satirlar":[["A) Başkalarının mallarını, iş ürünlerini veya faaliyetlerin…","m.55/1-a-1","doğru ifade"],["B) Kendisi veya işletmesi hakkında gerçek dışı ya da yanılt…","m.55/1-a-2","doğru ifade"],["C) Almadığı bir paye, diploma veya ödüle sahipmiş gibi hare…","m.55/1-a-3","doğru ifade"],["D) Sermaye taahhüdünde bulunanın ödeme yeterliliğinin bulun…","m.550/2","YANLIŞ ifade"],["E) Başkasının malları, iş ürünleri veya faaliyetleriyle kar…","m.55/1-a-4","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Almadığı bir paye, diploma veya ödüle sahipmiş gibi hareket ederek müstesna yeteneğe sahip olduğu izlenimini uyandırmak.","E":"Başkasının malları, iş ürünleri veya faaliyetleriyle karıştırılmaya yol açacak önlemler almak.","A":"Başkalarının mallarını, iş ürünlerini veya faaliyetlerini yanlış, yanıltıcı veya gereksiz yere incitici açıklamalarla kötülemek.","D":"Sermaye taahhüdünde bulunanın ödeme yeterliliğinin bulunmadığını bilerek buna onay veren kişinin, bu borcun ödenmemesinden doğan zarardan sorumlu tutulması.","B":"Kendisi veya işletmesi hakkında gerçek dışı ya da yanıltıcı açıklamalarda bulunarak üçüncü kişiyi rekabette öne geçirmek."},"kaynak":{"alinti":"","liste":[{"ad":"TTK (6102 s.K.) m.55 [1/4]","metin":"MADDE 55- (1) Aşağıda sayılan hâller haksız rekabet hâllerinin başlıcalarıdır: a) Dürüstlük kuralına aykırı reklamlar ve satış yöntemleri ile diğer hukuka aykırı davranışlar ve özellikle; 1. Başkalarını veya onların mallarını, iş ürünlerini, fiyatlarını, faaliyetlerini veya ticari işlerini yanlış, yanıltıcı veya gereksiz yere incitici açıklamalarla kötülemek, 2. Kendisi, ticari işletmesi, işletme işaretleri, malları, iş ürünleri, faaliyetleri, fiyatları, stokları, satış kampanyalarının biçimi ve iş ilişkileri hakkında gerçek dışı veya yanıltıcı açıklamalarda bulunmak veya aynı yollarla üçüncü kişiyi rekabette öne geçirmek, 3. Paye, diploma veya ödül almadığı hâlde bunlara sahipmişçesine hareket ederek müstesna yeteneğe malik bulunduğu zannını uyandırmaya çalışmak veya buna elverişli doğru olmayan meslek adları ve sembolleri kullanmak, 4. Başkasının malları, iş ürünleri, faaliyetleri veya işleri ile karıştırılmaya yol açan önlemler almak, 5. Kendisini, mallarını, iş ürünlerini, faaliyetlerini, fiyatlarını, gerçeğe aykırı, yanıltıcı, rakibini gereksiz yere kötüleyici veya gereksiz yere onun tanınmışlığından yararlanacak şekilde; başkaları, malları, iş ürünleri veya fiyatlarıyla karşılaştırmak ya da üçüncü kişiyi benzer yollardan öne geçirmek, 6."},{"ad":"TTK (6102 s.K.) m.55 [2/4]","metin":"Seçilmiş bazı malları, iş ürünlerini veya faaliyetleri birden çok kere tedarik fiyatının altında satışa sunmak, bu sunumları reklamlarında özellikle vurgulamak ve bu şekilde müşterilerini, kendisinin veya rakiplerinin yeteneği hakkında yanıltmak; şu kadar ki, satış fiyatının, aynı çeşit malların, iş ürünlerinin veya faaliyetlerinin benzer hacimde alımında uygulanan tedarik fiyatının altında olması hâlinde yanıltmanın varlığı karine olarak kabul olunur; davalı, gerçek tedarik fiyatını ispatladığı takdirde bu fiyat değerlendirmeye esas olur, 7. Müşteriyi ek edimlerle sunumun gerçek değeri hakkında yanıltmak, 8. Müşterinin karar verme özgürlüğünü özellikle saldırgan satış yöntemleri ile sınırlamak, 9. Malların, iş ürünlerinin veya faaliyetlerin özelliklerini, miktarını, kullanım amaçlarını, yararlarını veya tehlikelerini gizlemek ve bu şekilde müşteriyi yanıltmak, 10. Taksitle satım sözleşmelerine veya buna benzer hukuki işlemlere ilişkin kamuya yapılan ilanlarda unvanını açıkça belirtmemek, peşin veya toplam satış fiyatını veya taksitle satımdan kaynaklanan ek maliyeti Türk Lirası ve yıllık oranlar üzerinden belirtmemek, 11. Tüketici kredilerine ilişkin kamuya yapılan ilanlarda unvanını açıkça belirtmemek veya kredilerin net tutarlarına, toplam giderlerine, efektif yıllık faizlerine ilişkin açık beyanlarda bulunmamak, 12. İşletmesine ilişkin faaliyetleri çerçevesinde, taksitle satım veya tüketici kredisi sözleşmeleri sunan veya akdeden ve bu bağlamda sözleşmenin konusu, fiyatı, ödeme şartları, sözleşme süresi, müşterinin cayma veya fesih hakkına veya kalan borcu vadeden önce …"}],"hakem":"Kaynak metinde TTK m.55 haksız rekabet hallerini detaylı olarak sayarken, TTK m.550/2 sermaye taahhüdü sorumluluğunu ayrı bir hüküm olarak düzenlemektedir; doğru sık bu ayrımı doğru yansıtmaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":["2026/2","2025/3","2020/3","2020/2","2019/2","2017/1","2015/3"]},"oyun":null,"tip":"teori","soru":"Türk Ticaret Kanunu\u0027na göre aşağıdakilerden hangisi dürüstlük kuralına aykırı reklam ve satış yöntemleri kapsamında bir haksız rekabet hali değildir?","kayitBaslik":"","id":"sgs-t1-ticaret-kolay/kp-02","verilenler":[],"dayanak":"Türk Ticaret Kanunu m.55/1-a ve m.550/2","dogru":"D","oyunBonus":null,"ders":"Ticaret Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: İstanbul\u0027da bir elektronik market zinciri, rakip mağazayı \u0027ürünleri yanıyor, mağazasından uzak durun\u0027 diyerek kötüledi; aynı hafta kendisi hakkında \u0027sektörün en güvenilir satıcısıyız\u0027 diye yanıltıcı ilan verdi; müdürü hiç almadığı bir \u0027yılın satıcısı\u0027 ödülünü almış gibi tabelaya astı; ayrıca ambalajları rakip markanın kutusuna çok benzeyen ürünler sattı. Bu arada aynı şirketin kurucu ortağı, diğer ortağın sermaye taahhüdünü hiç ödemediğini bilerek buna onay vermişti.","anlatim":"Beş farklı davranış var, hepsi aynı şirkette geçiyor. Sen her birine bakıp haksız rekabet mi, değil mi diyeceksin.","doldur":[]},{"formul":"Ne yapacağız: Türk Ticaret Kanunu\u0027nun 55 inci maddesi haksız rekabet hallerini sayar, 550 nci maddesi ise sermaye taahhüdüne onay verenlerin sorumluluğunu ayrı düzenler. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.55/1-a-1","karar":"doğru","anlatim":"Bu gereksiz yere incitici bir kötüleme, kanun bunu açıkça sayıyor. Rakibi zedelemek için değil, nesnel eleştiri için yapılsaydı durum değişirdi.","formul":"Şık A: Market rakibini \u0027ürünleri yanıyor\u0027 diye kötülüyor, bu haksız rekabet mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.55/1-a-2","karar":"doğru","anlatim":"Gerçek dışı ya da yanıltıcı kendini övme kanunda ayrıca sayılmış bir haldir. Buradaki amaç rakibi geride bırakmak, tüketiciyi yanıltmaktır.","formul":"Şık B: Market kendisi için \u0027sektörün en güvenilir satıcısıyız\u0027 diye yanıltıcı ilan veriyor, bu haksız rekabet mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.55/1-a-3","karar":"doğru","anlatim":"Almadığı bir ödüle sahipmiş gibi davranmak müstesna yetenek izlenimi uyandırır, kanun bunu ayrı bent olarak sayar. Belgesi yoksa bu davranış doğrudan haksız rekabettir.","formul":"Şık C: Müdür almadığı \u0027yılın satıcısı\u0027 ödülünü almış gibi tabelaya asıyor, bu haksız rekabet mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.550/2","karar":"yanlış","anlatim":"Bu davranış rekabeti bozmuyor, şirket kuruluşundan doğan bir sorumluluk halidir. 550 nci madde bunu düzenler, 55 inci maddenin listesine hiç girmez.","formul":"Şık D: Kurucu ortak, diğerinin sermaye taahhüdünü ödemediğini bilerek buna onay veriyor, bu haksız rekabet mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.55/1-a-4","karar":"doğru","anlatim":"Karıştırılmaya yol açan önlemler kanunda açıkça haksız rekabet hali sayılır. Tüketici iki markayı ayırt edemiyorsa bu bent devreye girer.","formul":"Şık E: Ambalajlar rakip markanın kutusuna çok benziyor, bu haksız rekabet mi?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Dört davranış rekabeti bozuyor ve 55 inci maddede sayılıyor, D ise sermaye borcuna ilişkin ayrı bir kurumdur. Kendine hep şunu sor: bu davranış rakiple ilişkiyi mi bozuyor, yoksa şirket içi bir sermaye/kuruluş meselesi mi?","doldur":[]}],"anahtar":[{"ornek":"rekabet","kok":"rekabe"},{"ornek":"davranış","kok":"davran"},{"ornek":"haksız","kok":"haksız"},{"ornek":"şirket","kok":"şirket"},{"ornek":"sorumluluk","kok":"soruml"},{"ornek":"kuruluşundan","kok":"kurulu"}],"konuGiris":{"harita":"Ne zaman haksız rekabet sayılır: davranış dürüstlük kuralına aykırı, yanlış, yanıltıcı veya gereksiz incitici nitelikte olduğunda. Nasıl ayırt edilir: açıklamanın gerçeğe uygun ve meşru olup olmadığına, yoksa yanıltma veya kötüleme içerip icermedigine bakılarak. Nasıl sorulur: kanunda sayılan hallerden biri gibi görünüp aslında dürüst/gerçek davranış olan seçenek bulunarak.","desen":"Soru genellikle kanunda sayılan haksız rekabet hallerinden dördünü verip, gerçeği doğru şekilde aciklayan veya meşru rekabet sayılan bir seçeneği bunların arasına karıştırır. Tuzak, doğru ve gerçeğe dayalı bir açıklamanın da haksız rekabetmis gibi sunulmasidir. Bu soru dürüstlük kuralına aykırı reklam ve satış yöntemleri düzenlemesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Ticari ilişkilerde tarafların birbirine karşı göstermesi gereken doğruluk ve iyi niyet standardı","ad":"Dürüstlük kuralı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Gerçek durumu carpitarak müsteriyi yanlış karara yönelten beyan","ad":"Yanıltıcı açıklama","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Rakibi veya mallarını gereksiz yere incitici şekilde asagilamak","ad":"Kötüleme","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Kendi malını rakibinkiyle kiyaslayarak öne çıkma girisimi, gerçeğe aykirysa haksizdir","ad":"Karşılaştırmalı reklam","kim":"kanun sabitler"}],"sinavda":"Dört seçenek haksız rekabet hali olarak sunulur, sizden dürüstlük kuralına aykırı olmayan yani gerçeğe dayalı veya meşru olan seçeneği bulmaniz istenir.","panel_ornek":"Bir arkadasin ikinci el telefon satarken \u00273 ay önce 2 defa tamir gördü\u0027 diye gerçeği söylüyor, bu dürüst bir açıklama. Ama bir başka satıcı rakibinin telefonlari için \u0027hepsi bozuk çıkıyor\u0027 diye asilsiz laf yayarsa, bu gerçek dışı kötüleme olur. Gerçeği söylemek haksız rekabet değildir, yalan ve yanıltma haksız rekabettir.","ornek":"Bir arkadasin ikinci el telefon satarken \u00273 ay önce 2 defa tamir gördü\u0027 diye gerçeği söylüyor, bu dürüst bir açıklama. Ama bir başka satıcı rakibinin telefonlari için \u0027hepsi bozuk çıkıyor\u0027 diye asilsiz laf yayarsa, bu gerçek dışı kötüleme olur. Gerçeği söylemek haksız rekabet değildir, yalan ve yanıltma haksız rekabettir.","yontemler":"Her seçeneği \u0027gerçek mi, yanlış/yanıltıcı mi\u0027 sorusuyla test et; gerçeğe dayalı ve kötüleme içermeyen açıklama haksız rekabet değildir.","nedir":"Haksız rekabet, dürüstlük kuralına aykırı reklam ve satış yöntemleriyle piyasada rakiplere veya müsteriye zarar veren davranışları düzenler. Sınav, hangi davranışın kanunda sayılan haksız rekabet hali olduğunu, hangisinin normal ve meşru ticari davranış olduğunu ayırt etmeni ölçer."},"olay":"","tuzak":{"C":{"ad":"Sıfat Yanılgısı Tuzağı","metin":"Almadığı ödülü almış gibi göstermeyi yalnız etik ihlal sayıp kanuni haksız rekabet halinden ayrı tutarsın. Doğrusu: 3 üncü alt bent bunu haksız rekabet hali olarak düzenler."},"E":{"ad":"Karıştırma Tuzağı","metin":"Bu önlemleri yalnız marka hukukunun konusu sanırsın. Doğrusu: 4 üncü alt bent karıştırılmaya yol açan önlemleri haksız rekabet hali sayar, bu şık da soruya cevap değildir."},"A":{"ad":"Kötüleme Tuzağı","metin":"Bu ifadeyi kanunun konu dışı bıraktığını sanırsın ama Türk Ticaret Kanununun 55 inci maddesinin birinci fıkrasının (a) bendinin 1 inci alt bendi tam olarak bunu haksız rekabet hali sayar. Doğrusu: bu bir haksız rekabet hali olduğu için soruya cevap değildir."},"B":{"ad":"Öne Geçirme Tuzağı","metin":"Gerçek dışı açıklamayı sadece \u0027reklam serbestisi\u0027 sanıp haksız rekabet dışı zannedersin. Doğrusu: aynı maddenin 2 nci alt bendi bunu açıkça haksız rekabet hali sayar."}},"celdiriciYol":{},"hap":"Türk Ticaret Kanununun 55 inci maddesi haksız rekabet hallerini sayar; 550 ve 551 inci maddeler ise şirket kuruluşundan doğan ayrı sorumluluk hallerini düzenler, ikisi karıştırılmaz.","teshis":{"C":{"gercek":"1/a-3 bendi, almadığı paye veya ödüle sahipmiş gibi davranmayı haksız rekabet hali sayar.","ayirt":"Bu unvan/ödül gerçekten alınmış mı, belgesi var mı?","paragraf":"m.55/1-a-3","yanilgi":"Sahte unvan kullanmayı yalnız meslek etiği sorunu sanıp kanun kapsamı dışında görürsün."},"E":{"gercek":"1/a-4 bendi, başkasının malı veya iş ürünüyle karıştırılmaya yol açan önlemleri haksız rekabet hali sayar.","ayirt":"Bu önlem tüketiciyi başka bir işletmeyle karıştırmaya mı yol açıyor?","paragraf":"m.55/1-a-4","yanilgi":"Karıştırılmaya yol açan önlemleri yalnız marka tescili meselesi sanıp haksız rekabet dışı görürsün."},"A":{"gercek":"Türk Ticaret Kanununun 55 inci maddesinin 1/a-1 bendi, gereksiz yere incitici kötülemeyi açıkça haksız rekabet hali sayar.","ayirt":"Bu açıklama rakibi gereksiz yere mi zedeliyor, yoksa nesnel bir karşılaştırma mı?","paragraf":"m.55/1-a-1","yanilgi":"Kötüleyici açıklamayı sıradan bir ticari eleştiri sanıp haksız rekabet listesinden çıkarırsın."},"D":{"gercek":"550 nci madde, sermaye taahhüdünün yerine getirilmediğini bilerek onay verenlerin şirket kuruluşundan doğan müteselsil sorumluluğunu düzenler; bu, 55 inci maddedeki haksız rekabet hallerinden ayrı bir kurumdur.","ayirt":"Bu davranış rekabeti mi bozuyor, yoksa sermaye koyma borcuna mı ilişkin?","paragraf":"m.550/2","yanilgi":"Kanundaki her sorumluluk hükmünü haksız rekabet listesine ait sanırsın; 550 inci maddeyi de 55 inci maddenin devamı zannedersin."},"B":{"gercek":"Aynı maddenin 1/a-2 bendi, gerçek dışı veya yanıltıcı açıklamayı haksız rekabet hali sayar.","ayirt":"Açıklama gerçeğe mi dayanıyor yoksa yanıltıcı mı?","paragraf":"m.55/1-a-2","yanilgi":"Kendi işletmesi hakkında abartılı reklamı serbest pazarlama sanırsın."}},"verilen":[],"donem":7,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 77"},"kural":"BDS 520 paragraf 5 uyarınca denetçi kayıtlı tutara ilişkin bir beklenti geliştirir; beklentinin kapsamadığı kalemler karşılaştırmadan önce ayıklanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 77","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Sapma sorularında önce beklentiyi kur, sonra kayıtlı tutarı beklentiyle aynı kapsama indir, yönü kayıtlı-beklenen farkının işaretinden oku.","konu":"analitik prosedürler","tablo":{"satirlar":[["VERİLENLER","-"],["Geçmiş yıl kira geliri","800.000 TL"],["Beklenen artış oranı","%25"],["Yeni gayrimenkulün kira geliri","30.000 TL"],["Kayıtlı toplam kira geliri","1.040.000 TL"],["HESAP","-"],["Beklenen tutar (800.000x1,25)","1.000.000"],["Düzeltilmiş kayıtlı tutar (1.040.000-30.000)","1.010.000"],["Sapma (Düzeltilmiş kayıtlı - Beklenen)","10.000 olumlu"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"40.000 olumlu","E":"Sapma yok","A":"10.000 olumlu","D":"40.000 olumsuz","B":"10.000 olumsuz"},"kaynak":{"alinti":"","liste":[{"ad":"BDS 520 p.4 - Giriş - Tanımlar","metin":"BDS 520 (Analitik Prosedürler) paragraf 4: BDS\u0027lerin amaçlarına uygun olarak, \"analitik prosedürler\" terimi, finansal ve finansal olmayan veriler arasındaki anlamlı ilişkilerin analiz edilmesi yoluyla, finansal bilgilerin değerlendirilmesini ifade eder. Analitik prosedürler ayrıca, beklenen değerlerden ciddi ölçüde farklılık gösteren veya diğer ilgili bilgilerle tutarsızlık gösteren belirlenmiş dalgalanmaların veya ilişkilerin gerektiğinde araştırılmasını da kapsar (Bakınız: A1-A3 paragrafları)."},{"ad":"BDS 520 p.5 - Ana Hükümler - Analitik Maddi Doğrulama Prosedürleri","metin":"BDS 520 (Analitik Prosedürler) paragraf 5: Denetçi, BDS 330 uyarınca analitik maddi doğrulama prosedürlerini tek başına veya detay testleri ile birlikte, maddi doğrulama prosedürü olarak tasarlar ve uygularken (Bakınız: A4-A5 paragrafları): (1) İlgili yönetim beyanları için -varsa- detay testleri ile değerlendirilmiş önemli yanlışlık risklerini dikkate alarak, bu yönetim beyanları için belirli analitik maddi doğrulama prosedürlerinin uygunluğuna karar verir (Bakınız: A6-A11 paragrafları), (2) Mevcut bilgilerin kaynağı, karşılaştırılabilirliği, niteliği ve ihtiyaca uygunluğu ile bu bilgilerin hazırlanma süreci üzerindeki kontrolleri de dikkate alarak, kayıtlı tutarlara veya oranlara ilişkin denetçinin geliştirdiği beklentinin dayanağı olan verilerin güvenilirliğini değerlendirir (Bakınız: A12-A14 paragrafları), (3) Kayıtlı tutarlara veya oranlara ilişkin bir beklenti geliştirir ve bu beklentinin, tek başına veya diğer yanlışlıklarla birlikte finansal tablolarda önemli bir yanlışlığa sebep olabilecek bir yanlışlığı belirlemek için yeterince kesin olup olmadığını değerlendirir (Bakınız: A15 paragrafı), (4) 7 inci paragrafın zorunlu kıldığı ilave araştırma yapılmaksızın, beklenen değerlerle kayıtlı tutarlar arasındaki kabul edilebilir tutar farklarını belirler (Bakınız: A16 paragrafı)."}],"hakem":"BDS 520 p.5(3) uyarınca denetçi kayıtlı tutarlara ilişkin beklenti geliştirir ve beklentinin kapsamadığı kalemler (yeni eklenen gayrimenkul) karşılaştırmadan önce ayıklanır; sapma hesaplaması (1.010.000 - 1.000.000 = 10.000 olumlu) bu kuraldan açıkça çıkmaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":5,"ornekler":[],"donemler":["2026/1","2025/1","2024/2","2019/2","2019/1"]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Beklenen tutar (600.000x1,20)","720.000"],["Düzeltilmiş kayıtlı tutar (750.000-20.000)","730.000"],["Sapma (Düzeltilmiş kayıtlı - Beklenen)","10.000 olumlu"]]},"tur":"tablo","soru":"Kira geliri hesabında analitik maddi doğrulama prosedürü uygulanmaktadır. Geçmiş yıl tutarı 600.000 TL, beklenen artış %20\u0027dir. Yıl içinde eklenen bir gayrimenkulün 20.000 TL geliri, 750.000 TL kayıtlı tutara dahildir. Sapma tutarı ve yönü nedir?","verilen":[],"hedef":"Tabloyu doldur ve sapma tutarının 10.000 TL olumlu olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Kira geliri hesabında analitik maddi doğrulama prosedürü uygulanmaktadır. Geçmiş yıl tutarı 800.000 TL, beklenen artış %25\u0027tir. Yıl içinde eklenen bir gayrimenkulün 30.000 TL geliri, 1.040.000 TL kayıtlı tutara dahildir. Sapma tutarı ve yönü nedir?","kayitBaslik":"","id":"sgs-t1-denetim-cokzor/kp-03","verilenler":[{"deger":"800.000 TL","anlam":"Beklenen tutarın hesaplanacağı taban tutar.","ad":"Geçmiş yıl kira geliri"},{"deger":"%25","anlam":"Geçmiş yıl tutarına uygulanarak beklenen tutarı verir.","ad":"Beklenen artış oranı"},{"deger":"30.000 TL","anlam":"Geçmiş yılda portföyde bulunmayan varlığın geliri; beklenti bunu kapsamadığından karşılaştırma öncesi kayıtlı tutardan çıkarılır.","ad":"Yeni gayrimenkulün kira geliri"},{"deger":"1.040.000 TL","anlam":"Muhasebe kayıtlarındaki toplam tutar; düzeltilip beklenenle karşılaştırılır.","ad":"Kayıtlı toplam kira geliri"}],"dayanak":"BDS 520 p.5","dogru":"A","oyunBonus":null,"ders":"Denetim","adimlar":[{"formul":"Verilen: Geçmiş yıl kira geliri 800.000 TL (soruda verilen); Beklenen artış %25 (soruda verilen); Kayıtlı tutar 1.040.000 TL (soruda verilen); Yeni gayrimenkulün geliri 30.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: geçmiş yıl kira geliri 800.000 TL, beklenen artış %25. Yıl içinde eklenen gayrimenkulün 30.000 TL\u0027lik geliri, 1.040.000 TL kayıtlı tutara dahil.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Analitik inceleme nedir?","anlatim":"Analitik inceleme nedir? Denetçi geçmiş verilerden bir beklenti kurar, kayıtlı tutarla karşılaştırır. Fark büyükse nedeni araştırılır.","doldur":[]},{"formul":"Beklenen tutar = Geçmiş yıl tutarı × (1 + %25) = 800.000 (soruda verilen) × %125 = 1.000.000 TL","anlatim":"Önce beklenti kuruyoruz - geçmiş yılın üstüne beklenen artışı ekliyoruz. Bu bize karşılaştıracağımız referans sayıyı verir.","doldur":[[6,1]]},{"formul":"Düzeltilmiş kayıtlı tutar = Kayıtlı tutar - yeni gayrimenkul geliri = 1.040.000 (soruda verilen) - 30.000 (soruda verilen); Dahil değil: yeni gayrimenkulün 30.000 TL geliri (soruda verilen), beklenti bu kalemi kapsamıyor = 1.010.000 TL","anlatim":"Kayıtlı tutarın içinde beklentimizin kapsamadığı bir kalem var - yeni alınan gayrimenkulün geliri. Bunu düzeltmeden karşılaştırırsak sapma yanlış çıkar.","doldur":[[7,1]]},{"formul":"Sapma = Düzeltilmiş kayıtlı tutar - Beklenen tutar = 1.010.000 (2. adımda bulduk) - 1.000.000 (1. adımda bulduk) = 10.000 TL, olumlu","anlatim":"Şimdi düzeltilmiş kayıtlı tutarı beklenen tutarla karşılaştırıyoruz. Fark pozitifse kayıtlı tutar beklenenden fazladır, bu olumlu sapmadır.","doldur":[[8,1]]},{"formul":"Ters durum: Düzeltilmiş kayıtlı tutar \u003c Beklenen tutar → sapma olumsuz","anlatim":"Ters durumda: düzeltilmiş kayıtlı tutar beklenenden düşük olsaydı sapma olumsuz olurdu. Bu durumda gelirin eksik kaydedildiği araştırılırdı.","doldur":[]},{"formul":"Yanlış yol: 1.040.000 (soruda verilen) - 1.000.000 (1. adımda bulduk) = 40.000 olumlu (HATALI) → doğrusu 10.000 TL olumlu (5. adımda bulduk)","anlatim":"En sık hata: öğrenci 30.000 TL\u0027yi düzeltmeden direkt 1.040.000\u0027i beklenenle karşılaştırıyor. Bu yanlış çünkü beklenti o yeni gayrimenkulü hiç kapsamıyordu.","doldur":[]}],"anahtar":[{"ornek":"beklenti","kok":"beklen"},{"ornek":"karşılaştırılan","kok":"karşıl"},{"ornek":"kayıtlı","kok":"kayıtl"},{"ornek":"kapsamaz","kok":"kapsam"},{"ornek":"düzeltmeden","kok":"düzelt"},{"ornek":"geliri","kok":"geliri"}],"konuGiris":{"harita":"Ne zaman test edilir: Maddi doğrulama aşamasında veya denetimin sonunda genel tutarlılık kontrolünde. Nasıl ölçülür: Beklenen tutar hesaplanır, kayıtlı tutardan çıkarılır, kalan sapma tutarı ve yönü belirlenir. Nasıl kaydedilir: Sapmanın kabul edilebilir sınırın içinde olup olmadığı ve varsa ek unsurdan kaynaklanıp kaynaklanmadığı denetim çalışma kağıdında değerlendirilir.","desen":"Soru genelde beklenti hesaplattırıp kayıtlı tutarla karşılaştırma ister ve içine yeni eklenen bir kalemi sapmanın açıklayıcısı olarak gizler. Öğrenci ek unsuru fark etmezse sapmayı yanlışlık sanıp yanılır. Bu soru BDS 520 paragraf 5 maddesindeki beklenti oluşturma ve kabul edilebilir fark belirleme noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Geçmiş tutar ve artış oranından hesaplanan tahmini değer","ad":"Beklenti","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"soruda verilir","tanim":"İşletme kayıtlarında yer alan gerçek tutar","ad":"Kayıtlı tutar","kim":"standart (BDS) sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Kayıtlı tutar ile beklenti arasındaki fark, yön dahil","ad":"Sapma tutarı","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"kuraldan bilinir","tanim":"Ek araştırma gerektirmeyen izin verilen sapma sınırı","ad":"Kabul edilebilir fark","kim":"denetçi mesleki yargıyla belirler"}],"sinavda":"Geçmiş tutar, artış oranı, kayıtlı tutar ve içindeki ek unsur verilir; sapma tutarı ve yönü istenir.","panel_ornek":"Bir arkadaşının markette geçen ay 200 lira harcadığını, bu ay yüzde 10 zam beklendiğini düşün, yani beklenti 220 lira olur. Ama fişte 260 lira çıkarsa aradaki 40 liralık fark seni şüphelendirir. Sen de bu farkın nereden geldiğini araştırırsın, belki yeni bir ürün eklenmiştir.","ornek":"Bir arkadaşının markette geçen ay 200 lira harcadığını, bu ay yüzde 10 zam beklendiğini düşün, yani beklenti 220 lira olur. Ama fişte 260 lira çıkarsa aradaki 40 liralık fark seni şüphelendirir. Sen de bu farkın nereden geldiğini araştırırsın, belki yeni bir ürün eklenmiştir.","yontemler":"Önce geçmiş tutar üzerinden artış oranıyla beklenti hesaplanır, sonra kayıtlı tutardan ek unsur çıkarılarak karşılaştırılabilir hale getirilir; en kritik kural, ek unsurun beklenti dışı olduğunun unutulmamasıdır.","nedir":"Analitik prosedürler, finansal verilerdeki ilişkileri inceleyerek tutarların mantıklı olup olmadığını değerlendirmektir. Sınav, beklenen tutarla kayıtlı tutar arasındaki sapmayı hesaplayıp yorumlayabilmeyi ölçer."},"olay":"Beklenen tutar 800.000x1,25=1.000.000; düzeltilmiş kayıtlı tutar 1.040.000-30.000=1.010.000; sapma 1.010.000-1.000.000=10.000.","tuzak":{"C":{"ad":"Çeldirici Verilen Tuzağı","metin":"Yeni gayrimenkulün 30.000 TL gelirinin beklentiyle ilgisiz olduğunu görmezden gelip kayıtlı tutardan düşmeyi atlarsın. Doğrusu: Beklenti eski portföye dayandığından bu tutar önce düşülmeli, sonuç 10.000 TL olumlu sapmadır."},"E":{"ad":"Beklenti Kurmama Tuzağı","metin":"Kayıtlı tutarı doğrudan geçmiş yıl tutarıyla kıyaslayıp aradaki artışı normal sayarsın. Doğrusu: Beklenti 800.000x1,25 ile kurulur; karşılaştırma sıfır sapma vermez."},"D":{"ad":"Çift Hata Tuzağı","metin":"Hem yeni gayrimenkulün gelirini düşmeyi atlar hem de yönü ters alırsın. Doğrusu: Doğru düzeltme ve doğru yönle sapma 10.000 TL olumludur."},"B":{"ad":"Yön Karıştırma Tuzağı","metin":"Kayıtlı tutarın beklenenden fazla çıktığını görüp bunu otomatik olumsuz sapma sayarsın. Doğrusu: Kayıtlı tutar beklenenden fazlaysa sapma olumludur; 10.000 TL olumlu sapma doğrudur."}},"celdiriciYol":{"C":"1.040.000-1.000.000=40.000 (çeldirici verilen yeni gayrimenkul gelirini hesaptan çıkarmadın)","E":"800.000 ile 1.040.000 doğrudan kıyaslanıp fark yorumlanmadı (beklenti hiç kurulmadı)","D":"1.040.000-1.000.000=40.000 (çeldirici veriyi çıkarmadın ve yönü ters aldın)","B":"1.010.000-1.000.000=10.000 (yönü ters aldın, kayıtlı beklenenden fazlayken olumsuz dedin)"},"hap":"Analitik prosedürde beklenti, karşılaştırılan dönemde mevcut olmayan kalemleri kapsamaz; kıyaslamadan önce bu kalemler ayıklanmalıdır.","teshis":{"C":{"gercek":"BDS 520 p.5(2), beklentinin dayanağı verinin ilgisini ve uygunluğunu değerlendirmeyi ister; kapsam dışı kalem ayıklanır.","ayirt":"Bu kalem geçmiş yıl beklentisinin parçası mıydı?","paragraf":"BDS 520 p.5","yanilgi":"Soruda geçen her tutarın doğrudan karşılaştırmaya girmesi gerektiğini düşünürsün."},"E":{"gercek":"BDS 520 p.5(3), denetçinin kayıtlı tutara ilişkin somut bir beklenti geliştirmesini ve bu beklentiyle karşılaştırma yapmasını zorunlu kılar.","ayirt":"Beklenen tutarı hesapladım mı, yoksa geçmiş yıl tutarını mı beklenti sandım?","paragraf":"BDS 520 p.5","yanilgi":"Beklenti kurmadan kayıtlı tutarı geçmiş yıl tutarıyla kıyaslayıp farkı fark etmezsin."},"A":{"gercek":"BDS 520 p.5(2)-(3), beklentinin dayandığı verinin karşılaştırılabilir olmasını şart koşar; kapsam dışı kalem düzeltilmeden karşılaştırma yapılamaz.","ayirt":"Kayıtlı tutardaki her kalem, beklentimin dayandığı geçmiş dönemde de var mıydı?","paragraf":"BDS 520 p.5","yanilgi":"Bu şıkkı eleyen öğrenci beklentiye dahil olmayan kalemi ayıklamayı gereksiz görür."},"D":{"gercek":"Hem kapsam ayıklaması hem yön tayini ayrı ayrı doğru uygulanmalıdır; biri eksik kalırsa sonuç geçersizdir.","ayirt":"Hem düzeltmeyi hem yönü tek tek kontrol ettim mi?","paragraf":"BDS 520 p.5","yanilgi":"İki farklı hatayı aynı anda yapıp yine de mantıklı bir sonuca ulaştığını sanırsın."},"B":{"gercek":"Sapmanın yönü işaretle belirlenir: kayıtlı-beklenen pozitifse olumlu, negatifse olumsuzdur; bu bir iyi/kötü yargısı değildir.","ayirt":"Farkın işareti pozitif mi negatif mi, ben bunu mu yorumluyorum yoksa öznel bir izlenimi mi?","paragraf":"BDS 520 p.5","yanilgi":"Kayıtlı tutar beklenenden büyükse bunun \u0027kötü\u0027 yani olumsuz sapma olduğunu sanırsın."}},"verilen":[[6,1],[7,1],[1,1],[2,1],[3,1],[4,1]],"donem":5,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"6356 sayılı Kanun m.39/3\u0027e göre imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren taraf sendika üyesi, sözleşmesinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanmaya devam eder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Her zaman doğrudur\u0027 sorularında istisna barındırmayan, mutlak ifade taşıyan fıkrayı ara; \u0027aksine hüküm yoksa\u0027 veya \u0027onay aranmaz\u0027 gibi kesin kalıpları taşıyan cümle doğru olma ihtimali yüksektir.","konu":"toplu is sözleşmesi","tablo":{"satirlar":[["A) Toplu görüşmelere işvereni temsilen katılan kişi, görüşm…","m.39/7","YANLIŞ ifade"],["B) Dayanışma aidatı ödemek isteyen, imza tarihinde taraf se…","m.39/4","YANLIŞ ifade"],["C) Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi a…","m.39/3","doğru ifade"],["D) Aynı işverene ait, aynı işkolunda birden çok işyeri bulu…","m.34/2","YANLIŞ ifade"],["E) İmza tarihinden sonra taraf işçi sendikasına üye olan iş…","m.39/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren taraf sendika üyesi, iş sözleşmesinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanır.","E":"İmza tarihinden sonra taraf işçi sendikasına üye olan işçi, üyeliğinin işverene bildirilmesini beklemeksizin üyelik tarihinden itibaren sözleşmeden yararlanır.","A":"Toplu görüşmelere işvereni temsilen katılan kişi, görüşmeler sona erdikten sonra işçi sendikasına üye olursa toplu iş sözleşmesinden yararlanır.","D":"Aynı işverene ait, aynı işkolunda birden çok işyeri bulunması hâlinde, işletme düzeyinde toplu iş sözleşmesi şartı aranmaksızın bu işyerlerinden birinde işyeri düzeyinde toplu iş sözleşmesi yapılabilir.","B":"Dayanışma aidatı ödemek isteyen, imza tarihinde taraf sendikaya üye olmayan işçinin sözleşmeden yararlanabilmesi, taraf işçi sendikasının onayına bağlıdır."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.34","metin":"MADDE 34 – (1) Bir toplu iş sözleşmesi aynı işkolunda bir veya birden çok işyerini kapsayabilir. (2) Bir gerçek ve tüzel kişiye veya bir kamu kurum ve kuruluşuna ait aynı işkolunda birden çok işyerinin bulunduğu işyerlerinde, toplu iş sözleşmesi ancak işletme düzeyinde yapılabilir. (3) Grup toplu iş sözleşmesi, tarafların anlaşması üzerine bir işçi sendikası ile bir işveren sendikası arasında, birden çok üye işverene ait aynı işkolunda kurulu işyerleri ve işletmeleri kapsamak üzere yapılır. (4) İşletme toplu iş sözleşmesi yapılacak işyerlerinin aranılan niteliğe sahip olup olmadıklarına ilişkin uyuşmazlıklar, işletme merkezinin bulunduğu yerdeki mahkemede on beş gün içinde karara bağlanır. (Değişik cümle: 12/10/2017-7036/32 md.) Karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi on beş gün içinde kesin olarak karar verir. Toplu iş sözleşmesinin şekli ve süresi"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.39","metin":"MADDE 39 – (1) Toplu iş sözleşmesinden taraf işçi sendikasının üyeleri yararlanır. (2) Toplu iş sözleşmesinden, sözleşmenin imzalanması tarihinde taraf sendikaya üye olanlar yürürlük tarihinden, imza tarihinden sonra üye olanlar ise üyeliklerinin taraf işçi sendikasınca işverene bildirildiği tarihten itibaren yararlanır. (3) Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren üyeler de, iş sözleşmelerinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanır. (4) Toplu iş sözleşmesinin imzası sırasında taraf işçi sendikasına üye olmayanlar, sonradan işyerine girip de üye olmayanlar veya imza tarihinde taraf işçi sendikasına üye olup da ayrılanlar veya çıkarılanların toplu iş sözleşmesinden yararlanabilmeleri, toplu iş sözleşmesinin tarafı olan işçi sendikasına dayanışma aidatı ödemelerine bağlıdır. Bunun için işçi sendikasının onayı aranmaz. Dayanışma aidatı ödemek suretiyle toplu iş sözleşmesinden yararlanma, talep tarihinden geçerlidir. (İptal dördüncü cümle:Anayasa Mahkemesinin 30/12/2020 tarihli ve E.:2020/57; K.:2020/83 sayılı Kararı ile) (5) Dayanışma aidatının miktarı, üyelik aidatından fazla olmamak kaydıyla sendika tüzüğünde belirlenir. (6) Faaliyeti durdurulmuş sendikalara dayanışma aidatı ödenmez. (7) Bu Kanun anlamında işveren vekilleri ile toplu iş sözleşmesi görüşmelerine işvereni temsilen katılanlar, toplu iş sözleşmesinden yararlanamaz. (8) Grev sonunda yapılan toplu iş sözleşmesinden, 65 inci maddeye göre zorunlu olarak çalışanlar dışında işyerinde çalışmış olanlar aksine hüküm bulunmadıkça yararlanamaz. Teşmil"}],"hakem":"6356 sayılı Kanun m.39/3, imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren sendika üyelerinin sözleşmelerinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanacağını açıkça ve istisnasız hüküm altına almaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":["2026/2","2024/2","2021/1","2020/3","2019/2","2019/1"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre toplu iş sözleşmesinin kapsamı ve sözleşmeden yararlanmaya ilişkin aşağıdaki durumlardan hangisi HER ZAMAN doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-01","verilenler":[],"dayanak":"6356 sayılı Kanun m.39/2, m.39/3, m.39/4, m.39/7 ve m.34/2","dogru":"C","oyunBonus":null,"ders":"Is ve Sosyal Guvenlik Hukuku|Is ve Sosyal Guvenlik","adimlar":[{"formul":"Olay: Konfeksiyon A.Ş.\u0027de TİS 5 Ocak 2024\u0027te imzalanıyor, yürürlük tarihi 1 Şubat 2024. Üye işçi Ayşe\u0027nin iş sözleşmesi 20 Ocak 2024\u0027te sona eriyor. Aynı işkolunda işverenin 3 ayrı işyeri daha var. Toplu görüşmelere işvereni temsilen katılan Mehmet, görüşmeler bitince sendikaya üye oluyor.","anlatim":"Bu tek olayda beş farklı kişi var, her biri ayrı bir kural sorusu doğuruyor. Rakamlar ve tarihler hep aynı olayda geçecek.","doldur":[]},{"formul":"Ne yapacağız: m.39 ve m.34\u0027teki kuralları bu tarihlere ve kişilere uygulayacağız; hangi ifade HER ZAMAN doğru çıkıyor bulacağız.","anlatim":"İmza tarihi, yürürlük tarihi, üyelik tarihi ve işyeri sayısı hep bu olaydaki gibi somut olacak. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.39/7","karar":"yanlış","anlatim":"m.39/7 mutlak bir yasak koyar, görüşmelerde işvereni temsil eden kişi hiçbir zaman yararlanamaz. Sonradan üye olması bu yasağı kaldırmaz.","formul":"Şık A: Mehmet, toplu görüşmelerde işvereni temsil etti ve görüşmeler bitince sendikaya üye oldu; bu Mehmet\u0027i TİS\u0027ten yararlandırır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.39/3","karar":"doğru","anlatim":"m.39/3 imza ile yürürlük arasında sözleşmesi sona eren üyeyi, sona erme tarihine kadar korur. Bu kural istisnasız ve mutlak işler.","formul":"Şık C: Ayşe\u0027nin iş sözleşmesi 20 Ocak\u0027ta sona eriyor, imza 5 Ocak, yürürlük 1 Şubat; Ayşe 20 Ocak\u0027a kadar TİS\u0027ten yararlanır mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.39/4","karar":"yanlış","anlatim":"m.39/4 açıkça onay aranmadığını söyler, sadece dayanışma aidatı ödenmesi yeterlidir. Yararlanma talep tarihinden itibaren başlar.","formul":"Şık B: Üye olmayan bir işçi dayanışma aidatı ödemek istiyor, taraf sendikanın onayı gerekir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.34/2","karar":"yanlış","anlatim":"m.34/2 gereği aynı işverene ait aynı işkolunda birden çok işyeri varsa TİS ancak işletme düzeyinde yapılabilir. İşyeri düzeyi seçeneği burada tamamen kapanır.","formul":"Şık D: İşverenin aynı işkolunda 4 işyeri varsa, bunlardan birinde işyeri düzeyinde TİS yapılabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.39/2","karar":"yanlış","anlatim":"m.39/2\u0027ye göre imza sonrası üye olanlar üyeliğin işverene bildirildiği tarihten itibaren yararlanır. Bildirim şartı beklenmeden yararlanma başlamaz.","formul":"Şık E: İmza sonrası üye olan işçi, üyeliği işverene bildirilmeden hemen sözleşmeden yararlanır mı?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Sadece imza-yürürlük arasında sözleşmesi sona eren üyeyi koruyan kural mutlaktır, gerisi hep bir şarta bağlıdır. Kendine sor: bu ifade herhangi bir koşula bağlı mı, yoksa istisnasız mı işliyor?","doldur":[]}],"anahtar":[{"ornek":"tarihi","kok":"tarihi"},{"ornek":"sözleşmesinin","kok":"sözleş"},{"ornek":"yararlanma","kok":"yararl"},{"ornek":"yürürlük","kok":"yürürl"},{"ornek":"olayda","kok":"olayda"},{"ornek":"işyeri","kok":"işyeri"}],"konuGiris":{"harita":"Ne zaman test edilir: Kapsam ve yararlanma koşullarının hangi durumda \u0027her zaman doğru\u0027 olduğu sorulduğunda test edilir. Nasıl ölçülür: Madde 34 ve 39\u0027daki istisnasız kurallar ile şarta bağlı kurallar ayırt edilerek ölçülür. Nasıl kaydedilir: Doğru seçenek, hiçbir istisnası olmayan kural cümlesi olarak kaydedilir.","desen":"Sınav genellikle m.39\u0027daki şarta bağlı yararlanma durumlarını (dayanışma aidatı, imza sonrası üyelik) \u0027her zaman doğru\u0027 gibi gösterip yanıltır. Doğru seçenek, istisnasız kesin kuralı içerir; diğerleri şarta bağlıdır. Bu soru m.34 ve m.39 hükümlerinin kapsam-yararlanma ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Aynı işverene ait birden çok işyerinde zorunlu uygulanan sözleşme türü","ad":"İşletme toplu iş sözleşmesi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Üye olmayanın sözleşmeden yararlanmak için ödediği bedel","ad":"Dayanışma aidatı","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Üyenin sözleşme haklarından fiilen faydalanmaya başladığı an","ad":"Yararlanma tarihi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Birden çok işverene ait işyerlerini kapsayan anlaşmalı sözleşme türü","ad":"Grup toplu iş sözleşmesi","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Soruda toplu iş sözleşmesinin kapsamı ve yararlanma koşullarına dair durumlar verilir, hangisinin istisnasız doğru olduğu istenir.","panel_ornek":"Bir apartmanda 5 daire sahibi ortak bir bahçe bakım anlaşması yapıyor; anlaşmaya sonradan katılan komşu, aidatını ödemeden faydalanamıyor. Aidat ödeyen komşu ise ödeme tarihinden itibaren bahçe hizmetinden yararlanıyor. Ödemeyen ise hiç yararlanamıyor, bu net bir kural.","ornek":"Bir apartmanda 5 daire sahibi ortak bir bahçe bakım anlaşması yapıyor; anlaşmaya sonradan katılan komşu, aidatını ödemeden faydalanamıyor. Aidat ödeyen komşu ise ödeme tarihinden itibaren bahçe hizmetinden yararlanıyor. Ödemeyen ise hiç yararlanamıyor, bu net bir kural.","yontemler":"Her seçenekte \u0027her zaman\u0027 ifadesinin şarta bağlı olup olmadığını kontrol et; şart içeren seçenekleri hemen ele.","nedir":"Toplu iş sözleşmesi, işkolu/işletme düzeyinde uygulanan ve kimlerin yararlanacağını belirleyen bir sözleşme türüdür. Sınav, kapsam kuralları ile yararlanma koşullarının hangi durumda kesin uyguladığını ölçer."},"olay":"","tuzak":{"D":{"ad":"İşyeri-İşletme Kesişimi Tuzağı","metin":"işletme düzeyi şartının esnetilebileceğini, tarafların anlaşmasıyla işyeri düzeyinde de yapılabileceğini düşünürsün. Doğrusu: m.34/2 gereği aynı işverene ait aynı işkolundaki birden çok işyerinde toplu iş sözleşmesi ANCAK işletme düzeyinde yapılabilir."},"E":{"ad":"Tarih Karışıklığı Tuzağı","metin":"yararlanmanın üyelik tarihinden başladığını sanırsın. Doğrusu: m.39/2\u0027ye göre imza tarihinden sonra üye olanlar, üyeliğin taraf işçi sendikasınca işverene BİLDİRİLDİĞİ tarihten itibaren yararlanır, üyelik tarihinden değil."},"A":{"ad":"İstisnanın Zamanla Kalkması Tuzağı","metin":"işveren vekili sıfatının sonradan üyelikle ortadan kalkacağını sanırsın. Doğrusu: m.39/7 mutlak bir yasaktır; TİS görüşmelerine işvereni temsilen katılan kişi hiçbir şekilde o sözleşmeden yararlanamaz."},"B":{"ad":"Onay Tuzağı","metin":"dayanışma aidatı ödeyerek yararlanmanın sendikanın iznine bağlı olduğunu düşünürsün. Doğrusu: m.39/4\u0027e göre bunun için işçi sendikasının onayı aranmaz, yararlanma talep tarihinden itibaren geçerli olur."}},"celdiriciYol":{},"hap":"Toplu iş sözleşmesinin işyeri/işletme düzeyindeki kapsamı ile sözleşmeden yararlanma kuralları birbirinden bağımsız iki kural setidir; biri diğerinin istisnası sayılamaz.","teshis":{"D":{"gercek":"m.34/2 gereği aynı işverene ait aynı işkolunda birden çok işyeri varsa TİS ancak işletme düzeyinde yapılabilir, işyeri düzeyi kapanır.","ayirt":"Bu işverenin aynı işkolunda başka işyeri var mı?","paragraf":"6356 s.K. m.34/2","yanilgi":"İşletme düzeyi şartının tercihe bağlı olduğunu düşünürsün."},"E":{"gercek":"m.39/2\u0027ye göre imza sonrası üye olanlar, üyeliğin işverene BİLDİRİLDİĞİ tarihten itibaren yararlanır.","ayirt":"Üyelik işverene ne zaman bildirildi?","paragraf":"6356 s.K. m.39/2","yanilgi":"Yararlanmanın üyelik anından başladığını sanırsın."},"A":{"gercek":"m.39/7 mutlak bir yasaktır, TİS görüşmelerinde işvereni temsil eden kişi hiçbir zaman o sözleşmeden yararlanamaz.","ayirt":"Bu kişi görüşmelerde işvereni mi temsil etti?","paragraf":"6356 s.K. m.39/7","yanilgi":"İşveren vekili/temsilci istisnasının sonradan üyelikle kalkacağını sanırsın."},"C":{"gercek":"m.39/3\u0027e göre imza-yürürlük arası sona eren üye, sözleşmesinin sona erdiği tarihe kadar TİS\u0027ten yararlanmaya devam eder.","ayirt":"Sözleşme, imza ile yürürlük tarihi arasında mı sona erdi ve kişi o an üye miydi?","paragraf":"6356 s.K. m.39/3","yanilgi":"Bu şıkkı eleyen öğrenci, sözleşme sona erdiğinde tüm hakların da anında biteceğini sanır."},"B":{"gercek":"m.39/4 açıkça onay aranmadığını, yararlanmanın talep tarihinden geçerli olduğunu belirtir.","ayirt":"Kanun burada bir onay şartı koymuş mu?","paragraf":"6356 s.K. m.39/4","yanilgi":"Dayanışma aidatının sendika onayına bağlı olduğunu düşünürsün."}},"verilen":[],"donem":6,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 108"},"kural":"madde 17/3 uyarınca aynı işkolunda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok sendikaya üye olabilirken, madde 20/1 uyarınca bir sendika aynı zamanda yalnızca bir üst kuruluşa üye olabilir; aksi hâlde sonraki üyelik geçersizdir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 108","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 17\u0027deki işçi istisnasını madde 20\u0027deki üst kuruluş kuralına taşıma en sık düşülen tuzaktır, iki maddeyi ayrı oku.","konu":"sendika üyeliği","tablo":{"satirlar":[["A) Üst kuruluş üyeliğinden çekilme, üst kuruluşa yapılan bi…","m.20/2","YANLIŞ ifade"],["B) Aynı işkolunda farklı işverenlere ait işyerlerinde çalış…","m.20/1","YANLIŞ ifade"],["C) İşçi sendikasına üye olabilmek için on sekiz yaşını dold…","m.17/1","YANLIŞ ifade"],["D) Aynı işkolunda ve aynı zamanda farklı işverenlere ait iş…","m.17/3, m.20/1","doğru ifade"],["E) Aynı işkolunda ve aynı zamanda birden çok sendikaya üye …","m.17/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşçi sendikasına üye olabilmek için on sekiz yaşını doldurmuş ve işçi sayılıyor olmak gerekir.","E":"Aynı işkolunda ve aynı zamanda birden çok sendikaya üye olan işçinin bu sendikalara ilişkin tüm üyelikleri geçersiz sayılır.","A":"Üst kuruluş üyeliğinden çekilme, üst kuruluşa yapılan bildirim tarihinde derhal geçerlilik kazanır.","D":"Aynı işkolunda ve aynı zamanda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok işçi sendikasına üye olabilir; ancak bir sendika aynı anda yalnızca bir üst kuruluşa üye olabilir.","B":"Aynı işkolunda farklı işverenlere ait işyerlerinde çalışan işçiler için tanınan istisna, üst kuruluş üyeliği bakımından da geçerlidir ve bir sendika aynı anda birden fazla üst kuruluşa üye olabilir."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.17","metin":"MADDE 17 – (1) On beş yaşını dolduran ve bu Kanun hükümlerine göre işçi sayılanlar, işçi sendikalarına üye olabilir. (2) Bu Kanun anlamında işveren sayılanlar, işveren sendikalarına üye olabilir. (3) Sendikaya üye olmak serbesttir. Hiç kimse sendikaya üye olmaya veya olmamaya zorlanamaz. İşçi veya işverenler aynı işkolunda ve aynı zamanda birden çok sendikaya üye olamaz. Ancak aynı işkolunda ve aynı zamanda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok sendikaya üye olabilir. İşçi ve işverenlerin bu hükme aykırı şekilde birden çok sendikaya üye olmaları hâlinde sonraki üyelikler geçersizdir. (4) Bir işyerinde yardımcı işlerde çalışan işçiler de, işyerinin girdiği işkolunda kurulu bir sendikaya üye olabilir. (5) Sendikaya üyelik, Bakanlıkça sağlanacak elektronik başvuru sistemine e-Devlet kapısı üzerinden üyelik başvurusunda bulunulması ve sendika tüzüğünde belirlenen yetkili organın kabulü ile e-Devlet kapısı üzerinden kazanılır. Üyelik başvurusu, sendika tarafından otuz gün içinde reddedilmediği takdirde üyelik talebi kabul edilmiş sayılır. Haklı bir neden gösterilmeden üyelik başvurusu kabul edilmeyenler, bu kararın kendilerine tebliğinden itibaren otuz gün içinde dava açabilir. Mahkemenin kararı kesindir. Mahkemenin davacı lehine karar vermesi hâlinde üyelik, red kararının alındığı tarihte kazanılmış sayılır. Üyelik aidatı"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.20","metin":"MADDE 20 – (1) Üst kuruluş üyeliğine başvuru genel kurul kararına bağlıdır. Üst kuruluş üyeliği, tüzükte belirlenen yetkili organın kabulüyle kazanılır. Aynı zamanda birden fazla üst kuruluşa üye olunamaz. Aksi hâlde sonraki üyelikler geçersizdir. (2) Üst kuruluş üyeliğinden çekilme genel kurul kararına bağlıdır. Çekilme, üst kuruluşa bildirim tarihinden itibaren bir ay sonra geçerlilik kazanır. (3) Üst kuruluş üyeliğinden çıkarılma, üst kuruluş genel kurulu kararıyla olur. (4) Üye olma, üyelikten çekilme ve çıkarılma kararları, üst kuruluş tarafından bir ay içerisinde Bakanlığa bildirilir. Uluslararası işçi ve işveren kuruluşlarına üyelik"}],"hakem":"Dogru sikkin dayandigi her iki kural (m.17/3 ve m.20/1) kaynak metinde acikca yer almakta ve sorunun cevabini tam olarak desteklemektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":["2026/1","2025/3","2025/2","2025/1","2016/1","2015/3"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre sendika üyeliği ve üst kuruluş üyeliğine ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-02","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.17/1, m.17/3, m.20/1, m.20/2","dogru":"D","oyunBonus":null,"ders":"Is ve Sosyal Guvenlik Hukuku|Is ve Sosyal Guvenlik","adimlar":[{"formul":"Olay: bir metal fabrikasında çalışan Kemal, aynı işkolunda hem A firmasında hem B firmasında yarı zamanlı çalışıyor ve iki ayrı işçi sendikasına üye oluyor; bu iki sendika da aynı üst kuruluşa mı yoksa farklı üst kuruluşlara mı üye olabilir tartışılıyor.","anlatim":"Kemal\u0027in iki sendikaya üyeliği tartışma konusu değil, asıl mesele sendikaların üst kuruluşla ilişkisi. Olay bize işçi düzeyi ile sendika düzeyinin farklı kurallara tabi olduğunu gösteriyor. Bu ayrımı beş ifadede tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: madde 17/3 işçiye çoklu sendika yasağına istisna tanır, madde 20/1 ise sendikaya çoklu üst kuruluş yasağını istisnasız koyar; şimdi beş ifadeyi Kemal\u0027in olayında tek tek deneyeceğiz.","anlatim":"Kural iki katmanlı: bir işçi şartlı olarak birden çok sendikaya üye olabilir ama bir sendika hiçbir şartla birden çok üst kuruluşa üye olamaz. Bu farkı unutursan hepsi karışır.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.20/2","karar":"yanlış","anlatim":"Hayır, olayda bildirim yapılsa bile üyelik o an bitmiyor. Madde 20/2 bir aylık bekleme süresi koyuyor. Çekilme ancak bildirimden bir ay sonra geçerlilik kazanır.","formul":"Şık A: Kemal\u0027in sendikası üst kuruluştan çekilme bildirimi yaptığı gün çekilme derhal geçerli olur mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.20/1","karar":"yanlış","anlatim":"Hayır, olayda işçiye tanınan çoklu üyelik hakkı sendikaya taşınmıyor. Madde 20/1 istisnasız biçimde tek üst kuruluş kuralı koyuyor. Sendika iki üst kuruluşa birden üye olamaz.","formul":"Şık B: Kemal\u0027in sendikası, işçi düzeyindeki istisnaya dayanarak aynı anda iki üst kuruluşa üye olabilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.17/1","karar":"yanlış","anlatim":"Evet olabilir ama şart on sekiz değil on beştir. Madde 17/1 on beş yaşını dolduran ve işçi sayılanı yeterli görür. Bu şık yaşı yanlış yazdığı için hatalı.","formul":"Şık C: Kemal on sekiz yaşında olmasa, örneğin on altı yaşında olsa yine de sendikaya üye olabilir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.17/3, m.20/1","karar":"doğru","anlatim":"Evet, tam olay bu. Madde 17/3 işçiye istisna tanırken madde 20/1 sendikaya istisnasız tek üst kuruluş kuralı koyuyor. İki katman birbirinden bağımsız çalışıyor.","formul":"Şık D: Kemal aynı işkolunda farklı işverenlerde çalıştığı için iki sendikaya üye olabilir, ama bu iki sendikadan her biri yine de sadece bir üst kuruluşa üye olabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.17/3","karar":"yanlış","anlatim":"Hayır, sadece sonraki üyelik geçersiz sayılır. Madde 17/3 ilk üyeliği korur, sonrakini iptal eder. Bütün üyelikleri silmek kanunun sözüne aykırı olur.","formul":"Şık E: Kemal aynı işkolunda aynı anda iki sendikaya üye olsa, kuraldışı bu iki üyeliğin ikisi de mi geçersiz sayılır?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Kemal\u0027in olayı sana işçi düzeyi ile sendika düzeyinin ayrı kurallara bağlı olduğunu öğretti. Kendine hep şunu sor: bu istisna işçiye mi yoksa sendikaya mı ait?","doldur":[]}],"anahtar":[{"ornek":"sendika","kok":"sendik"},{"ornek":"kuruluşa","kok":"kurulu"},{"ornek":"istisnası","kok":"istisn"},{"ornek":"üyelik","kok":"üyelik"},{"ornek":"olabilir","kok":"olabil"},{"ornek":"düzeyinde","kok":"düzeyi"}],"konuGiris":{"harita":"Ne zaman geçersiz sayılır: Aynı işkolunda aynı anda birden çok sendikaya üye olunduğunda sonraki üyelik geçersiz sayılır. Nasıl kazanılır: Üyelik, e-Devlet üzerinden başvuru ve yetkili organ kabulüyle kazanılır. Nasıl kaydedilir: Otuz gün içinde reddedilmeyen başvuru kabul edilmiş sayılır ve bu şekilde kayda geçer.","desen":"Sınav genellikle \u0027aynı işkolunda birden çok üyelik geçerli midir\u0027 veya \u0027üyelik ne zaman kazanılır\u0027 sorularıyla tuzak kurar. Bazı seçenekler otuz günlük ret süresini veya farklı işverenlere ait işyerlerinde çalışma istisnasını çarpıtır. Bu soru m.17 ve m.20\u0027deki üyelik kazanma ve çokluk yasağı hükümlerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"On beş yaşını dolduran işçi sayılanların sendikaya katılma hakkı","ad":"İşçi sendikası üyeliği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Aynı işkolunda aynı anda tek sendikaya üye olunabilmesi kuralı","ad":"Birden çok üyelik yasağı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Sendikanın başvuruyu reddedebileceği otuz günlük süre","ad":"Üyelik başvurusu ret süresi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Üst kuruluş tüzüğündeki yetkili organın üyeliği onaylaması","ad":"Üst kuruluş üyeliği kabulü","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soru kökünde sendika ve üst kuruluş üyeliğine dair bir durum verilir, doğru hükmü seçmeniz istenir.","panel_ornek":"Bir arkadaşın aynı anda iki farklı spor kulübüne üye olmak istiyor ama kulüp tüzüğü buna izin vermiyor. Sonradan yaptığı ikinci başvuru geçersiz sayılıyor, sadece ilk üyeliği geçerli kalıyor. Yani aynı anda iki yerde birden tam üyelik olmuyor.","ornek":"Bir arkadaşın aynı anda iki farklı spor kulübüne üye olmak istiyor ama kulüp tüzüğü buna izin vermiyor. Sonradan yaptığı ikinci başvuru geçersiz sayılıyor, sadece ilk üyeliği geçerli kalıyor. Yani aynı anda iki yerde birden tam üyelik olmuyor.","yontemler":"Metni madde madde karşılaştırarak hangi seçeneğin kanun lafzına birebir uyduğunu bulun; \u0027ancak\u0027 ve \u0027aksi hâlde\u0027 gibi istisna ifadelerine dikkat edin.","nedir":"Bu konu, işçi ve işverenlerin sendika ile üst kuruluşlara üyelik kural ve sınırlarını düzenler. Sınav, üyeliğin nasıl kazanıldığını ve hangi hallerde geçersiz sayıldığını bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Yaş Tuzağı","metin":"öğrenci iş hukukundaki genel erginlik yaşını (on sekiz) sendika üyeliğine uygular. Doğrusu: madde 17/1 açıkça on beş yaşını dolduran ve işçi sayılanların işçi sendikasına üye olabileceğini belirtir."},"E":{"ad":"Kapsam Tuzağı","metin":"öğrenci \u0027sonraki üyelikler geçersizdir\u0027 ifadesini tüm üyeliklerin geçersizliği şeklinde okur. Doğrusu: madde 17/3 yalnızca ilk üyelikten sonraki üyeliklerin geçersiz sayılacağını düzenler, ilk üyelik geçerliliğini korur."},"A":{"ad":"Zamanlama Tuzağı","metin":"öğrenci bildirimle birlikte çekilmenin anında sonuç doğurduğunu düşünür. Doğrusu: madde 20/2 uyarınca çekilme, bildirim tarihinden itibaren bir ay sonra geçerlilik kazanır."},"B":{"ad":"İstisnayı Taşıma Tuzağı","metin":"öğrenci işçi için tanınan çoklu üyelik istisnasının sendika-üst kuruluş ilişkisine de uygulanacağını sanır. Doğrusu: madde 20/1 hiçbir istisna öngörmeden bir sendikanın aynı anda birden fazla üst kuruluşa üye olamayacağını düzenler."}},"celdiriciYol":{},"hap":"İşçi düzeyinde farklı işverenlerde çalışanlara çoklu sendika üyeliği istisnası tanınır, ama bir sendika aynı anda yalnızca bir üst kuruluşa üye olabilir; bu istisnasızdır.","teshis":{"C":{"gercek":"Madde 17/1 işçi sendikasına üyelik için on beş yaşını doldurmuş ve işçi sayılmayı yeterli görür.","ayirt":"Kanun metninde hangi yaş açıkça yazılı?","paragraf":"m.17/1","yanilgi":"Sendika üyeliği için genel medeni erginlik yaşı olan on sekizi arıyorsun."},"E":{"gercek":"Madde 17/3 yalnızca sonraki üyelikleri geçersiz sayar, önceki (ilk) üyelik geçerliliğini korur.","ayirt":"Geçersizlik hangi üyelikler için, ilk mi sonraki mi?","paragraf":"m.17/3","yanilgi":"Geçersizlik sonucunun ilk üyeliği de kapsadığını sanıyorsun."},"D":{"gercek":"6356 sayılı Kanun m.17/3\u0027teki istisna yalnız işçi-sendika ilişkisine özgüdür; m.20/1 üst kuruluş için istisnasız tek üyelik kuralı koyar.","ayirt":"Bu istisna işçi düzeyinde mi yoksa sendika-üst kuruluş düzeyinde mi düzenlenmiş?","paragraf":"m.17/3, m.20/1","yanilgi":"Bu şıkkı elerken işçi düzeyindeki istisnayı üst kuruluşa da uygulanır sanıyorsun."},"B":{"gercek":"Madde 20/1 istisnasız biçimde bir sendikanın aynı anda birden fazla üst kuruluşa üye olamayacağını belirtir.","ayirt":"Bu kural işçiye mi sendikaya mı hitap ediyor?","paragraf":"m.20/1","yanilgi":"İşçi için tanınan çoklu üyelik istisnasının sendikalar arası ilişkiye de yansıdığını sanıyorsun."},"A":{"gercek":"Madde 20/2 çekilmenin bildirim tarihinden bir ay sonra geçerlilik kazanacağını öngörür.","ayirt":"Bildirim ile geçerlilik anı aynı gün mü, süre var mı?","paragraf":"m.20/2","yanilgi":"Bildirimin kendisinin hukuki sonucu anında doğurduğunu düşünüyorsun."}},"verilen":[],"donem":6,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 68"},"kural":"Cari oran 1\u0027den büyükken pay ve paydadan eşit tutar düşülürse oran artar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 68","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce başlangıç oranının 1\u0027in üstünde mi altında mı olduğuna bak, sonra işlemin payı mı paydayı mı yoksa ikisini de mi eşit tutarda etkilediğini belirle.","konu":"cari oran hesaplama","tablo":{"satirlar":[["VERİLENLER","-","-"],["Dönen Varlıklar","180.000 TL","-"],["Kısa Vadeli Yabancı Kaynaklar","120.000 TL","-"],["Nakit Ödeme Tutarı","30.000 TL","-"],["HESAP","-","-"],["Dönen Varlıklar","180.000","150.000"],["Kısa Vadeli Yabancı Kaynaklar","120.000","90.000"],["Cari Oran","1,50","1,67"]],"basliklar":["Kalem","Ödeme Öncesi","Ödeme Sonrası"]},"siklar":{"C":"1,67","E":"2,00","A":"1,25","D":"1,75","B":"1,50"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Cari orani artiran/azaltan islemler","metin":"TEORİ/TEKNİK (mali analiz, mevzuat maddesi yok). CARİ ORAN = Dönen Varlıklar / Kısa Vadeli Yabancı Kaynaklar. BİR İŞLEMİN ORANA ETKİSİ, oranın BAŞLANGIÇTA 1\u0027DEN BÜYÜK MU KÜÇÜK MU olduğunu bilmeyi gerektirir. UC DURUM: (1) ORANI DEĞİŞTİRMEYEN İŞLEMLER - hem payı hem paydayı ETKİLEMEYEN veya sadece DÖNEN VARLIK KALEMLERİ ARASINDA yer değiştiren işlemler: peşin mal alımı (kasa azalır, stok artar), alacağın tahsili (alacak azalır, kasa artar), stoğun MALİYET BEDELİYLE peşin satışı. Toplam dönen varlık değişmez, oran AYNI KALIR. (2) ORANI ARTIRAN İŞLEMLER (oran 1\u0027den BÜYÜKSE): kısa vadeli borcun nakit ödenmesi (pay ve payda EŞİT tutarda azalır; oran 1\u0027den büyükse ARTAR), duran varlığın peşin satılması (dönen varlık artar, KVYK değişmez), sermaye artirimi/nakit girişi, uzun vadeli borçlanıp nakit girmesi (dönen varlık artar, KVYK değişmez), kârla satış (stok çıkar, daha büyük tutarda alacak/kasa girer). (3) ORANI AZALTAN İŞLEMLER: duran varlığın kısa vadeli borçla alınması (KVYK artar, dönen varlık değişmez), uzun vadeli borcun kısa vadeye dönüşmesi, nakitle temettü ödenmesi, zararla satış. KRİTİK KURAL: pay ve paydadan EŞİT TUTAR düşüldüğünde oran 1\u0027den BÜYÜKSE ARTAR, 1\u0027den KÜÇÜKSE AZALIR, 1\u0027e EŞİTSE DEĞİŞMEZ. SINAV TUZAĞI: \u0027kısa vadeli borç ödemek cari oranı her zaman artırır\u0027 önermesi YANLIŞTIR - oran 1\u0027in altındaysa ödeme oranı DAHA DA DÜŞÜRÜR. Soruda başlangıç oranı mutlaka kontrol edilmelidir."}],"hakem":"Cari oran formülü (Dönen Varlıklar / Kısa Vadeli Yabancı Kaynaklar) ve nakit borç ödemesinin oran üzerindeki etkisi (1\u0027den büyük oran ise eşit tutar düşülmesiyle oran artar) kaynak metinde açıkça tanımlanmış ve kurala uygun şekilde uygulanmıştır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[{"yil":"2024/3","alinti":"…) oranı 0,5 olarak gerçekleşmiştir. Dönen Varlıklar Duran Varlıklar Kısa Vadeli Yabancı Kaynaklar Uzun Vadeli Yabancı Kaynaklar Özkaynaklar 2022 ? ₺ ? ₺ 10.000 ₺ ? ₺ ? ₺ 2023 20.000 ₺ ? ₺ ? ₺ 20.000 ₺ 30.000 ₺ Buna göre işletmenin 2022 yılı dönen varlıklar ve 2023 yılı kısa vadeli yabancı kaynaklar toplamı kaç ₺’dir?"}],"donemler":["2025/1","2024/3","2016/3","2015/1"]},"oyun":{"bosluk":[[0,2],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Kalem","Ödeme Öncesi","Ödeme Sonrası"],"satirlar":[["Dönen Varlıklar","250.000","200.000"],["Kısa Vadeli Yabancı Kaynaklar","200.000","150.000"],["Cari Oran","1,25","1,33"]]},"tur":"tablo","soru":"İşletmenin ödeme öncesi dönen varlıkları 250.000 TL, kısa vadeli yabancı kaynakları 200.000 TL\u0027dir. İşletme, 50.000 TL tutarın // 06.09 seviye: ölçümden türer (bkz. kart kurulumu). k = sınıf anahtarı, ad = ekran adı (Nöbet dili: Isınma / Nöbet / Alarm), neden = ipucu.
function seviyeHesapla(s){
  const o=s.olcum||{}; const tip=s.tip||'teori'; const ders=String(s.ders||'');
  if(o.sim&&o.sim.dogru===false) return {k:'alarm',ad:'🔴 Alarm',neden:'Nöbetçi öğrencisi bu anlatımla ikizi çözemedi; dikkat ister'};
  if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

// ===== YANLIS KUTUSU + HAZIRLIK SKORU (Cem 04.09 "1 yap goreyim") — Surgent ReadySCORE + Duolingo Mistakes Hub =====
const GUN=86400000; const KUTU={ kayit:[], kutu:[], oyun:[], ileri:0 };   // ileri: demo icin "zaman ileri sarma" (ms)
try{ KUTU.kayit=JSON.parse(localStorage.getItem('kc_kayit')||'[]'); KUTU.kutu=JSON.parse(localStorage.getItem('kc_kutu')||'[]'); KUTU.oyun=JSON.parse(localStorage.getItem('kc_oyun')||'[]'); KUTU.ileri=parseInt(localStorage.getItem('kc_ileri')||'0')||0; }catch(e){}
const simdi=()=>Date.now()+KUTU.ileri;
function kutuKaydet(){ try{ localStorage.setItem('kc_kayit',JSON.stringify(KUTU.kayit.slice(-500))); localStorage.setItem('kc_kutu',JSON.stringify(KUTU.kutu)); localStorage.setItem('kc_oyun',JSON.stringify(KUTU.oyun.slice(-500))); localStorage.setItem('kc_ileri',String(KUTU.ileri)); }catch(e){} }
// 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;

      if(son&&s.tablo){ s.tablo.satirlar.forEach((st,r)=>st.forEach((c,ci)=>{ if(ci>0) acilan.add(r+','+ci); })); }
      tabloSar.querySelectorAll('td[data-r]').forEach(td=>{ const key=td.dataset.r+','+td.dataset.c; if(acilan.has(key)){ if(td.classList.contains('gizliH')){ td.classList.remove('gizliH'); td.classList.add('acildi'); } } else if(td.classList.contains('acildi')){ td.classList.add('gizliH'); td.classList.remove('acildi'); } });
      (a.doldur||[]).forEach(p=>{ const td=tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]'); if(td) td.classList.add('vurgu'); });
      // 05.09 Cem "%80 çıktığını o rakamı tabloya doldurduğumuzu göstersek": sonuç formülden tablodaki hücreye UÇAR
      // 05.09 Cem "bir anda çözümler geliyor, sırayla çözüyor gibi yapsa": adımda birden çok hesap varsa formül kutuları
      // SIRAYLA belirir (900 ms arayla), her kutunun sonucu belirince kendi hücresine uçar; hücre uçuş bitene dek boş kalır.
      if(yon>=0&&j>0&&!verilenAdimMi&&!a.giris){
        const mats=[...serit.querySelectorAll('.mat')]; const hedefler=(a.doldur||[]).map(p=>tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]')).filter(Boolean);
        const cokKutu=mats.length>1; const adimBu=j;
        hedefler.forEach(td=>td.classList.add('bekliyor'));
        mats.forEach((m,q)=>{ if(q>0&&cokKutu){ m.classList.add('gizliMat'); } });
        hedefler.forEach((td,pi)=>{ const kaynakM=mats[Math.min(pi,Math.max(0,mats.length-1))]; const gecikme=cokKutu?pi*900:pi*120;
          setTimeout(()=>{ if(adimNo!==adimBu||!document.body.contains(td)){ td.classList.remove('bekliyor'); return; }
            if(kaynakM){ kaynakM.classList.remove('gizliMat'); kaynakM.classList.add('geldi'); }
            const kaynakEl=kaynakM?kaynakM.querySelector('.matSonuc'):null; const from=kaynakEl?kaynakEl.getBoundingClientRect():null, to=td.getBoundingClientRect();
            if(!from||!from.width||!to.width){ td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); return; }
            const u=document.createElement('div'); u.className='ucan'; u.textContent=td.textContent.trim()||kaynakEl.textContent.trim(); document.body.appendChild(u); u.style.left=from.left+'px'; u.style.top=from.top+'px';
            requestAnimationFrame(()=>{ u.style.transform='translate('+(to.left-from.left)+'px,'+(to.top-from.top)+'px) scale(.85)'; u.style.opacity='0.15'; });
            setTimeout(()=>{ u.remove(); td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); },650); }, gecikme); });
        // hedefi olmayan fazladan kutular da sırayla gelsin
        mats.forEach((m,q)=>{ if(q>=hedefler.length&&m.classList.contains('gizliMat')){ setTimeout(()=>{ if(adimNo===adimBu){ m.classList.remove('gizliMat'); m.classList.add('geldi'); } }, q*900); } });
      }
      kaynakH.forEach(k=>{ const [r,c]=k.split(','); const td=tabloSar.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]'); if(td) td.classList.add('kaynakH'); });
      // 06.09: VERİLENLER bloğu Adım 1'den sonra katlanır; bu adımın formülünde kullanılan verilen satırı açık kalır (mavi), başlık tıklanınca hepsi açılır
      tabloSar.querySelectorAll('tr.vblok').forEach(tr=>{ const td=tr.querySelector('td[data-r]'); const key=td?td.dataset.r+','+td.dataset.c:''; tr.classList.toggle('katli', j>0 && !kaynakH.has(key) && !hedef.has(key)); });
      let lej=tabloSar.querySelector('.lejant'); if(!lej){ lej=document.createElement('div'); lej.className='lejant'; tabloSar.appendChild(lej); }
      lej.innerHTML=kaynakH.size?'<i class="m"></i>nereden geldi <i class="a"></i>bu adımda bulundu':(hedef.size?'<i class="a"></i>bu adımda bulundu':''); lej.style.display=lej.innerHTML?'block':'none';
      // kayit satirlari: adimda anilan hesap kodu (uc hane; "100.000" icindeki 100 sayilmaz)
      const kodOf=x=>new Set([...(String(x.formul)+' '+String(x.anlatim)).matchAll(/(?<![\d.,])(\d{3})(?![\d.,]|\s*(?:TL|%|adet|gün|yıl|ay))/g)].map(m=>m[1]));
      const kodlar=kodOf(a);
      // gösterilen kayıt satırları da 0..j'den yeniden kurulur (geri gidince sonraki adımın satırı gizlenir)
      gosterilen.clear(); for(let q=0;q<=j;q++){ kodOf(s.adimlar[q]).forEach(c=>gosterilen.add(c)); }
      tabloSar.querySelectorAll('tr.kayit[data-kod]').forEach(tr=>{ const k2=tr.dataset.kod; const an=k2&&kodlar.has(k2); if(son){ gosterilen.add(k2); } tr.classList.toggle('goster',gosterilen.has(k2)); tr.classList.toggle('vurguS',!!an); });
      tabloSar.querySelectorAll('tr.ara').forEach(ara=>{ const gi=ara.dataset.grp; ara.classList.toggle('goster',[...tabloSar.querySelectorAll('tr.kayit[data-kod][data-grp="'+gi+'"]')].some(tr=>tr.classList.contains('goster'))); });
      adimBar.querySelectorAll('i').forEach(n=>{ const q=parseInt(n.dataset.j); n.classList.toggle('simdi',q===j); n.classList.toggle('gecti',q<j); });
      bOnce.disabled=(j===0); bSonra.disabled=son; bSonra.textContent=son?'Bitti ✓':'İleri ▶';
      const vurgu=tabloSar.querySelector('td.vurgu, tr.vurguS'); if(vurgu) vurgu.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    const adimGit=d=>{ const cur=s.adimlar[adimNo]; if(d>0&&cur&&tahminGerek(cur,adimNo,adimNo===s.adimlar.length-1)&&serit.querySelector('.tahminK')){ tahmin[adimNo]={atla:true}; adimGoster(adimNo,1); return; }   // 06.09: tahmin ekranında ileri = "göster"
      const j=Math.min(s.adimlar.length-1,Math.max(0,adimNo+d)); if(j===adimNo) return; adimGoster(j,d); };
    bOnce.addEventListener('click',()=>adimGit(-1)); bSonra.addEventListener('click',()=>adimGit(1));
    // fare tekerlegi, klavye oklari, parmakla yatay kaydirma (sola = ileri)
    let tekerKilit=0; serit.addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-tekerKilit<350) return; tekerKilit=t; adimGit((e.deltaY||e.deltaX)>0?1:-1); },{passive:false});
    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});

window.addEventListener('load',function(){ try{ var m=location.hash.match(/#s=(\d+)/); var a=document.getElementById('akis'); if(!a) return;
  /* ?tek=1: hedef kart işaretlenir, gerisi CSS ile gizli. Sıra yoksa/aralık dışıysa ilk kart - boş çerçeve kalmaz. */
  if(TEK){ var n=(m&&a.children[+m[1]])?+m[1]:0; if(a.children[n]) a.children[n].classList.add('tekKart'); a.scrollTop=0; return; }
  if(m&&a.children[+m[1]]) a.scrollTo({top:a.children[+m[1]].offsetTop,behavior:'instant'}); }catch(e){} });
