<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".
   Varsayılan = sitenin açık paleti (stil-acik.css değerleri; stil.css BAĞLANMAZ: .kart/.sik/.btn/.kutu seçicileri çakışır).
   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. Koyu tema yalnız düğmeyle (data-theme="dark", tarayıcıda kc_tema) ya da ?tema=koyu ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}
:root[data-theme="dark"]{--bg:#141518;--bg2:#0f1013;--kart:#1e2026;--cizgi:#2e3138;--yazi:#e9e9ec;--metin:#e9e9ec;--dim:#9aa1ad;--mavi:#78b4ff;--yesil:#8fc98f;--kirmizi:#e07b7b;--altin:#e0a458;--ustYazi:#0f1013}
.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
/* 13.09 Cem: "nöbetçi çöz dediğinde sadece ekrandaki soru çözsün, başka alt alta soru olmasın."
   ?tek=1 = ana sayfa çerçevesi: YALNIZ #s=<sıra> kartı görünür, akış kaydırılamaz,
   "Sonraki" ve "yukarı kaydır" ipucu gizlenir (sonraki kart yokken yanıltır). */
:root[data-tek] #akis{overflow:hidden;scroll-snap-type:none}
:root[data-tek] #akis>*:not(.tekKart){display:none}
:root[data-tek] .bSonraki,:root[data-tek] .ipucu{display:none}
/* tek kartta dizi göstergeleri yanıltır: ilerleme noktaları, "10 / 10" sayacı, hazırlık skoru ve yanlış kutusu çipleri gizli. */
:root[data-tek] .noktalar,:root[data-tek] .ustSag{display:none}
/* 13.09 Cem: "renk koyu olsa, site rengi". Ana sayfa çerçevesi koyu açılır (tema=koyu);
   koyu temanın MAVİ vurgusu yalnız çerçevede sitenin BRONZUNA çevrilir. Ürünün kendi
   teması değişmez - kural data-tek'e bağlı, normal Kaydır-Çöz'e dokunmaz. */
:root[data-tek][data-theme="dark"]{--mavi:#e3b877}
/* 13.09 Cem onayı: akran satırı ("👥 9 adayın %89'u senin gibi B dedi") çerçevede gizli.
   Örneklem küçükken ilk kez gelen ziyaretçi "sitede 9 kişi var" diye okur. Üründe durur. */
:root[data-tek] .akranNot{display:none}
/* 13.09 Cem seçimi (tek tek gidildi): Alarm rozeti (kişisel ustalık seviyesi, ilk gelene
   anlamsız ve kırmızı "Alarm" hata gibi okunuyor) ile cevap sonrası ikinci "Kâğıdım" düğmesi
   (üstteki "Kâğıt" aynı işi yapıyor) çerçevede gizli. "Daha fazla" ve "Sen çöz" KALDI. */
:root[data-tek] .seviye,:root[data-tek] .cKagit{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}
#akis{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.kart{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;max-width:560px;margin:0 auto}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.78em;color:var(--dim);margin-bottom:8px}
.noktalar{display:flex;gap:5px}.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--cizgi);display:block}.noktalar i.ok{background:var(--yesil)}.noktalar i.yan{background:var(--kirmizi)}.noktalar i.simdi{outline:2px solid var(--mavi);outline-offset:1px}
.noktalar.cok{gap:3px;flex-wrap:wrap;max-width:58%;justify-content:center}.noktalar.cok i{width:5px;height:5px}
.tt.teori td:first-child{white-space:nowrap;font-weight:700;color:var(--dim);width:1%}
.sinavDil{font:inherit;font-size:.78em;color:var(--mavi);background:transparent;border:1px solid var(--cizgi);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer}
.sinavDilM{margin-top:6px;font-size:.86em;color:var(--dim);border-left:2px solid var(--cizgi);padding-left:8px}
.govde{flex:1;overflow-y:auto;padding-bottom:90px}
.rozet{display:inline-block;font-size:.72em;color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 50%,transparent);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}
.ipucu{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:.8em;pointer-events:none;animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.panel.acik{transform:translateY(0)}.tutamac{width:38px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 10px}
/* Cem 03.09 "gorunum boyle geliyor": KAPALI panel kartin altina (105%) kayiyor ve SONRAKI KARTIN ustune biniyordu.
   Kapaliyken gorunmez + kart tasan iceriği kirpar. */
.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}
/* tek ekran paneli: uc satir + cipler; bolumler dokununca */
.ozet{font-size:.93em;margin:0 0 8px;line-height:1.45}.ozet b{color:var(--yesil)}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}
.cip2.birincil{background:var(--mavi);color:var(--ustYazi);font-weight:800;border:0;padding:9px 14px;font-size:.9em}
.cip2.ek{display:none}.cipler.acikEk .cip2.ek{display:inline-block}.cipler.acikEk .bDaha{color:var(--dim)}
.cipler .bDaha{border-style:dashed;color:var(--dim)}
.sek{display:none;margin-top:8px}.sek.acik{display:block;animation:gir .2s ease}
.panel{overscroll-behavior:contain}
.kavramL{margin:4px 0 8px;padding-left:18px}.kavramL li{margin:3px 0}.kavramL i{color:var(--dim);font-style:normal;font-size:.85em}
.panelBas{position:sticky;bottom:4px;display:block;margin:10px 0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:.84em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent)}
.panelBas.gor{opacity:1;pointer-events:auto}
.diger{font-size:.88em;color:var(--dim)}.diger div{margin:6px 0}
/* yanlis kutusu + hazirlik skoru */
.ustSag{display:flex;align-items:center;gap:6px}
.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}
.kutuEkran{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}.kutuEkran.acik{display:flex}
.kutuIc{background:var(--kart);width:min(100%,640px);max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 22px;border:1px solid var(--cizgi)}
@media(min-width:900px){.kutuEkran{align-items:center}.kutuIc{border-radius:18px}}
.kutuIc .basl{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}
.skorBuyuk{font-size:3em;font-weight:900;color:var(--yesil);line-height:1}
.dersSat{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92em}.dersSat .bar{height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden}.dersSat .bar i{display:block;height:100%;background:var(--yesil)}
.kutuSat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.92em}
/* kaynak metni */
.kaynakAd{color:var(--mavi);font-weight:800;font-size:.85em;margin:8px 0 4px}.kaynakMetin{font-size:.9em;line-height:1.55;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px}.kaynakMetin mark{background:color-mix(in srgb,var(--altin) 35%,transparent);color:var(--yazi);padding:1px 2px;border-radius:3px}
/* sen anlat / t-hesabi / sinavda */
.ipnot{font-size:.84em;color:var(--dim);margin:2px 0 8px}
.anlatK{width:100%;background:var(--bg2);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 11px;font-size:.95em;font-family:inherit;resize:vertical}
.anlatSonuc{font-size:.92em;margin-top:8px;line-height:1.5}.anlatPuan{font-weight:800;font-size:1.05em;margin-bottom:4px}.anlatOrnek{margin-top:8px;border-left:4px solid var(--altin);padding:6px 10px;background:color-mix(in srgb,var(--altin) 8%,transparent);border-radius:0 8px 8px 0}
.tKutular{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:600px){.tKutular{grid-template-columns:1fr 1fr}}
.tHesap{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px}.tAd{font-weight:800;text-align:center;margin-bottom:6px;font-size:.92em}
.tGovde{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--yazi);min-height:88px}.tSol{border-right:2px solid var(--yazi);padding:6px 8px}.tSag{padding:6px 8px;text-align:right}
.tBaslik{font-size:.75em;color:var(--dim);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.tTutar{font-weight:800;color:var(--altin);font-variant-numeric:tabular-nums;transition:opacity .5s,transform .5s}.tTutar.gizliT{opacity:0;transform:translateY(-14px)}.tTutar.gelir{opacity:1;transform:none}
.tBakiye{text-align:center;font-size:.85em;color:var(--yesil);font-weight:700;margin-top:6px;min-height:18px;opacity:0;transition:opacity .5s}.tBakiye.gelir{opacity:1}
.cikmisK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.88em;color:var(--dim);line-height:1.45}.cikmisK .yil{display:inline-block;background:color-mix(in srgb,var(--mavi) 15%,transparent);color:var(--mavi);font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.85em}
/* hic bilmeyene: hesap tanimlari */
.ogret{margin:4px 0 6px}.thpNot{font-size:.85em;color:var(--dim);margin:2px 0 8px}
.hesapK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.9em;line-height:1.45}.hesapK.yan{border-color:color-mix(in srgb,var(--kirmizi) 60%,transparent)}.hesapK.dog{border-color:color-mix(in srgb,var(--yesil) 60%,transparent)}
.hesapK .rol{font-size:.78em;color:var(--dim);margin-left:6px}.hesapK.yan .rol{color:var(--kirmizi)}.hesapK.dog .rol{color:var(--yesil)}.hesapK div{color:var(--yazi);margin-top:3px}
.neden{font-size:.93em;border-left:4px solid var(--yesil);padding:6px 10px;margin:6px 0}
.oyun .soruMini{font-size:.86em;color:var(--dim);background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin-bottom:10px;max-height:26%;overflow-y:auto;line-height:1.45}.oyun .soruMini b{color:var(--yazi)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.btn{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;font-size:.9em;cursor:pointer}.btn.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0}.btn.mavi{border-color:var(--mavi);color:var(--mavi)}
/* surukleme oyunu */
/* Cem 03.09: "ekranlar tam sigmiyor" - tam ekran katmanlar karta degil PENCEREYE sabitlenir (fixed) */
.oyun{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:20;overflow-y:auto}.oyun.acik{display:flex}
.oyun{right:auto}
#akis,.govde,.tabloSar,.serit,.panel,.oyun{scrollbar-width:none}#akis::-webkit-scrollbar,.govde::-webkit-scrollbar,.tabloSar::-webkit-scrollbar,.serit::-webkit-scrollbar,.panel::-webkit-scrollbar,.oyun::-webkit-scrollbar{display:none}
.oyun h3{margin:4px 0 2px;font-size:1em}.oyun .alt{color:var(--dim);font-size:.82em;margin-bottom:10px}
.satir{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;margin:8px 0;position:relative}
.hesapAd{grid-column:1/3;font-weight:600;font-size:.9em;margin-bottom:2px}
.kutu{border:2px dashed var(--cizgi);border-radius:12px;min-height:56px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:.8em;position:relative}.kutu.borc{border-color:color-mix(in srgb,var(--mavi) 50%,transparent)}.kutu.alacak{border-color:color-mix(in srgb,var(--altin) 50%,transparent)}
.kutu.dolu{border-style:solid}.kutu.dog{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.kutu.yan{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}
.cip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--altin);color:var(--ustYazi);font-weight:800;padding:10px 16px;border-radius:30px;touch-action:none;cursor:grab;user-select:none;box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:3;white-space:nowrap}.cip.tasiniyor{transition:none;cursor:grabbing}.cip.yerlesti{position:static;transform:none;box-shadow:none;padding:8px 14px}
/* 06.09 Cem "hepsini yapsın, yanlış yapsın": tutar havuzu + serbest sürükleme + çeldirici */
.cipHavuz{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px 10px;border:1px dashed var(--cizgi);border-radius:12px;margin:6px 0 10px;align-items:center}.cip.havuzda{position:static;transform:none;box-shadow:none;padding:9px 14px}.cip.ucuyor{position:fixed;z-index:60;pointer-events:none;transform:none;box-shadow:0 10px 24px rgba(0,0,0,.5);opacity:.95}

.oyun .msj{margin-top:10px;font-weight:800;min-height:24px}
.satir .neden{grid-column:1/3;font-size:.86em;color:var(--yazi);border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:6px 10px;border-radius:0 8px 8px 0;margin-top:2px;line-height:1.45}.satir .neden b{color:var(--kirmizi)}
.ok{color:var(--yesil)}.hata{color:var(--kirmizi)}

.ders .tabloSar{padding:0 14px;overflow:auto;max-height:44%;flex:0 0 auto}
/* Cem 03.09: "521 kaplama tam kapanmiyor" - hucre hucre outline yerine SATIR cercevesi (ic golge; tablo
   koseleri kirpmaz, hucre araliklari cerceveyi bolmez) */

.serit{min-height:0}.adimK{min-height:120px}

  .panel:not(.acik){visibility:hidden;opacity:0}.panel.acik{visibility:visible;opacity:1;transform:none}
  .tutamac{display:none}.cip2.ana{margin-left:auto}
  .ders,.oyun{width:min(100%,1100px)}

  .oyun{padding:22px 28px}.satir{grid-template-columns:1fr 1fr;gap:12px}.kutu{min-height:64px}
  /* hesap kâğıdı masaüstü: cevaptan önce sağ kolon (panelin yeri), cevaptan sonra çiple açılan üst katman */
  /* özgüllük .kart .kagit: temel .kagit kuralı bu bloktan SONRA yazılı, aynı özgüllükte sonraki kazanırdı (06.09 tarayıcıda görüldü) */

(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}

const SORULAR=[{"capa":{"kaynak":"SGS 2026/2 Soru 69"},"kural":"net satış = kalem tutarı / (kalem yüzdesi/100); ardından her kalem kendi yüzdesiyle net satıştan türetilir, faaliyet karı yüzdesi = 100 - SMM yüzdesi - faaliyet gideri yüzdesi.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 69","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce hangi kalemin hem tutarı hem yüzdesi verilmiş bul, tabanı (net satışı) oradan kur; finansman gideri gibi faaliyet dışı kalemleri zincire hiç sokma.","konu":"dikey yüzde analizi","tablo":{"satirlar":[["VERİLENLER","-"],["SMM yüzdesi","%65"],["SMM tutarı","520.000 TL"],["Faaliyet giderleri yüzdesi","%20"],["Finansman gideri","30.000 TL"],["HESAP","-"],["Net Satışlar (520.000 / 0,65)","800.000"],["Satılan Malın Maliyeti","520.000"],["Brüt Satış Karı (800.000 - 520.000)","280.000"],["Faaliyet Giderleri (800.000 x 0,20)","160.000"],["Faaliyet Karı (280.000 - 160.000)","120.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"120.000","E":"640.000","A":"50.700","D":"176.000","B":"90.000"},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.275 - İmal edilen emtia","metin":"İmal edilen emtia: Madde 275 – İmal edilen emtianın (Tam ve yarı mamul mallar) maliyet bedeli aşağıda yazılı unsurları ihtiva eder: 1. Mamulün vücuda getirilmesinde sarf olunan iptidai ve ham maddelerin bedeli; 2. Mamule isabet eden işçilik; 3. Genel imal giderlerinden mamule düşen hisse; 4. Genel idare giderlerinden mamule düşen hisse; (Bu hissenin mamulün maliyetine katılması ihtiyaridir.) 5. Ambalajlı olarak piyasaya arz edilmesi zaruri olan mamullerde ambalaj malzemesinin bedeli. Mükellefler, imal ettikleri emtianın maliyet bedellerini yukarıki unsurları ihtiva etmek şartiyle diledikleri usulde tayin edebilirler. (Üçüncü fıkra mülga: 30/12/1980-2365/51 md.)"},{"ad":"Teori Notu - dikey yuzde analizi","metin":"Tetikte Teori Notu (mali analiz literatürünün yerleşik tanımı): Dikey yüzde yönteminde her tablo kalemi, ait olduğu toplamın yüzdesi olarak ifade edilir. Bilançoda baz AKTİF TOPLAMI (pasif tarafında pasif toplamı) = 100; gelir tablosunda baz NET SATIŞLAR = 100 alınır. Ayrıca kalemin kendi grubu içindeki payı da (grup yüzdesi) hesaplanabilir. Dikey analiz TEK dönemin iç yapısını gösterir; işletmeler arası karşılaştırmaya ve sektör ortalamasıyla kıyasa uygundur. Dönemler arası GELİŞİMİ ölçmek için karşılaştırmalı tablolar (yatay) analizi ve eğilim (trend) yüzdeleri kullanılır: yatay analizde iki dönem arasındaki mutlak ve yüzde değişim; trend analizinde baz yıl 100 kabul edilerek her yılın baz yıla oranı hesaplanır. Yaygın tuzaklar: gelir tablosunda brüt satışları baz almak (doğrusu net satışlar), bilanço ile gelir tablosunun bazlarını karıştırmak, dikey analizle dönemler arası eğilim yorumu yapmak."}],"hakem":"Soru, dikey yüzde analizinde net satışlardan hareketle faaliyet karını hesaplama kuralını ve tekniğini soruyor; kaynak metinlerde (Teori Notu - dikey yuzdelerden net satış ve gelir tablosu hesaplamaları) bu kural açıkça desteklenmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[],"donemler":["2026/2","2025/3","2024/3","2024/2","2020/2","2019/3","2019/1","2018/3","2016/2","2015/2","2015/1"]},"oyun":{"bosluk":[[0,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Net Satışlar (600.000 / 0,60)","1.000.000"],["Satılan Malın Maliyeti","600.000"],["Brüt Satış Karı (1.000.000 - 600.000)","400.000"],["Faaliyet Giderleri (1.000.000 x 0,25)","250.000"],["Faaliyet Karı (400.000 - 250.000)","150.000"]]},"tur":"tablo","soru":"İşletmenin 2026 yılı gelir tablosu dikey yüzde analizinde satılan malın maliyeti net satışların %60\u0027ı, faaliyet giderleri toplamı ise net satışların %25\u0027idir. Aynı döneme ait satılan malın maliyeti 600.000 TL, finansman gideri ise 40.000 TL olarak gerçekleşmiştir. Bu verilere göre işletmenin brüt satış karı kaç TL\u0027dir?","verilen":[[1,1]],"hedef":"Tabloyu doldur ve işletmenin brüt satış karının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin 2026 yılı gelir tablosu dikey yüzde analizinde satılan malın maliyeti net satışların %65\u0027i, faaliyet giderleri toplamı ise net satışların %20\u0027sidir. Aynı döneme ait satılan malın maliyeti 520.000 TL, finansman gideri ise 30.000 TL olarak gerçekleşmiştir. Bu verilere göre işletmenin faaliyet karı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-mta-cokzor/kp-01","verilenler":[{"deger":"%65","anlam":"Satılan malın maliyetinin net satışlar içindeki dikey yüzdesi; net satışı türetmek için bölen olarak kullanılır.","ad":"SMM yüzdesi"},{"deger":"520.000 TL","anlam":"Satılan malın maliyetinin gerçekleşen tutarı; yüzdesiyle birlikte net satışı bulmayı sağlar.","ad":"SMM tutarı"},{"deger":"%20","anlam":"Faaliyet giderlerinin net satışlar içindeki payı; net satışa uygulanarak faaliyet gideri tutarı bulunur.","ad":"Faaliyet giderleri yüzdesi"},{"deger":"30.000 TL","anlam":"Çeldirici veri; faaliyet karından sonra düşülen bir kalemdir, faaliyet karı hesabına dahil edilmez.","ad":"Finansman gideri"}],"dayanak":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","dogru":"C","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Soruda ne var: SMM yüzdesi %65, faaliyet gideri yüzdesi %20 (soruda verilen); SMM tutarı 520.000 (soruda verilen); istenen: faaliyet karı","anlatim":"Soru bize şunları vermiş: satılan malın maliyeti net satışların %65\u0027i, faaliyet giderleri net satışların %20\u0027si; satılan malın maliyeti 520.000 TL (soruda verilen), finansman gideri 30.000 TL (soruda verilen, bu soruda kullanılmayacak).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[7,1]]},{"formul":"Net Satışlar = SMM Tutarı / (SMM Yüzdesi) = 520.000 (soruda verilen) / %65 (soruda verilen) = 800.000 TL","anlatim":"Dikey yüzde analizi nedir? Her kalemi net satışlara bölüp yüzde olarak gösteririz. Burada SMM\u0027nin yüzdesini ve tutarını bilince net satışı geriye doğru bulabiliriz.","doldur":[[6,1]]},{"formul":"Satılan Malın Maliyeti = 520.000 (soruda verilen)","anlatim":"Net satışları bulduk, şimdi satılan malın maliyetini tabloya yerleştiriyoruz. Bu değer zaten soruda verilmişti, tekrar hesaplamıyoruz.","doldur":[[7,1]]},{"formul":"Brüt Satış Karı = Net Satışlar - SMM = 800.000 (2. adımda bulduk) - 520.000 (soruda verilen) = 280.000 TL","anlatim":"Brüt satış karı nedir? Net satıştan malın maliyetini çıkarınca kalan tutardır - satışın ilk kâr katmanıdır.","doldur":[[8,1]]},{"formul":"Faaliyet Giderleri = Net Satışlar × %20 (soruda verilen) = 800.000 (2. adımda bulduk) × %20 = 160.000 TL","anlatim":"Faaliyet giderleri nedir? Pazarlama, genel yönetim gibi giderlerdir; burada net satışın %20\u0027si olarak verilmiş, net satışı bulunca tutarını çıkarabiliriz.","doldur":[[9,1]]},{"formul":"Kapsam: Faaliyet Karı = Brüt Satış Karı - Faaliyet Giderleri; Dahil değil: finansman gideri 30.000 (soruda verilen)","anlatim":"Finansman gideri 30.000 TL soruda verilmiş ama faaliyet karına dahil değil, çünkü faaliyet karı esas faaliyetten doğan giderleri kapsar. Dahil değil: finansman gideri 30.000 (soruda verilen).","doldur":[]},{"formul":"Faaliyet Karı = Brüt Satış Karı - Faaliyet Giderleri = 280.000 (4. adımda bulduk) - 160.000 (5. adımda bulduk) = 120.000 TL","anlatim":"Faaliyet karı nedir? Brüt kârdan faaliyet giderlerini düşünce kalan, işletmenin asıl işinden kazandığı kârdır.","doldur":[[10,1]]},{"formul":"Sonuç: Faaliyet Karı = 120.000 TL","anlatim":"Sonuç olarak işletmenin faaliyet karı 120.000 TL çıktı. Bu tutar sadece esas faaliyetten gelen kârı gösterir.","doldur":[]},{"formul":"Yanlış yol: 280.000 - 160.000 - 30.000 = 90.000 (HATALI) → doğrusu 120.000 (7. adımda bulduk)","anlatim":"En sık hata: finansman giderini de faaliyet giderlerine katıp 280.000-160.000-30.000 yapmak. Finansman gideri esas faaliyet dışıdır, faaliyet karına girmez.","doldur":[]}],"anahtar":[{"ornek":"faaliyet","kok":"faaliy"},{"ornek":"yüzdesi","kok":"yüzdes"},{"ornek":"giderleri","kok":"giderl"},{"ornek":"gideri","kok":"gideri"},{"ornek":"finansman","kok":"finans"},{"ornek":"maliyeti","kok":"maliye"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu veya bilançoda kalemlerin yalnızca yüzdeleri (bazen bir kalemin tutarı) verildiğinde. Nasıl ölçülür: verilen tutar ve yüzdeden önce net satışlar bulunur, sonra diğer kalemler kendi yüzdeleriyle hesaplanır. Nasıl kaydedilir: zincirleme çıkarma ile net satışlardan SMM ve faaliyet giderleri düşülerek faaliyet karına ulaşılır.","desen":"Sınav genelde bir kalemin hem tutarını hem yüzdesini vererek önce net satışları buldurur, sonra zincirleme diğer kalemlere geçer. Tuzak, finansman giderinin faaliyet giderleri arasına katılmasıdır; oysa finansman gideri faaliyet karından sonra düşülür. Bu soru, gelir tablosu dikey yüzdelerinden net satış ve faaliyet karı hesaplama noktasından geliyor (p. Teori-Dikey yüzdelerden net satış).","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Gelir tablosu dikey analizinde baz alınan, %100 kabul edilen tutar","ad":"Net satışlar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"SMM\u0027nin net satışlara oranı, brüt kâr hesabında kullanılır","ad":"Satılan malın maliyeti yüzdesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Pazarlama, genel yönetim gibi giderlerin net satışlara oranı","ad":"Faaliyet giderleri yüzdesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Brüt satış karından faaliyet giderleri düşüldükten sonra kalan tutar","ad":"Faaliyet karı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"SMM tutarı ve yüzdesi, faaliyet giderleri yüzdesi ve finansman gideri tutarı verilip faaliyet karının TL tutarı istenir.","panel_ornek":"Bir gencin aylık 3.000 TL bütçesinde kira 1.800 TL, yani bütçenin %60\u0027ı; yemeğe de 600 TL, yani %20\u0027si ayrılıyor. Kira tutarını bilip yüzdesini bilirsen, önce toplam bütçeyi (3.000 TL) bulup sonra diğer kalemleri de yüzdeleriyle hesaplayabilirsin.","ornek":"Bir gencin aylık 3.000 TL bütçesinde kira 1.800 TL, yani bütçenin %60\u0027ı; yemeğe de 600 TL, yani %20\u0027si ayrılıyor. Kira tutarını bilip yüzdesini bilirsen, önce toplam bütçeyi (3.000 TL) bulup sonra diğer kalemleri de yüzdeleriyle hesaplayabilirsin.","yontemler":"Önce Net Satış = SMM tutarı / (SMM yüzdesi/100) formülüyle bulunur; sonra Faaliyet Karı yüzdesi = %100 - SMM% - Faaliyet Gideri% hesaplanıp bu yüzde net satışla çarpılır. Finansman gideri bu hesaba katılmaz, çünkü faaliyet karından sonraki bir kalemdir.","nedir":"Dikey yüzde analizi, bir mali tablodaki her kalemi aynı tablonun toplamına oranlayarak yüzde şeklinde gösteren yöntemdir. Sınav bu yöntemle, tek dönem içindeki kalemler arasındaki oransal ilişkileri kurup kurmadığını ölçer."},"olay":"Net satış=520.000/0,65=800.000; Brüt satış karı=800.000-520.000=280.000; Faaliyet giderleri=800.000x0,20=160.000; Faaliyet karı=280.000-160.000=120.000.","tuzak":{"D":{"ad":"Taban Karıştırma Tuzağı","metin":"Faaliyet giderleri yüzdesini net satış yerine SMM tutarı üzerinden uygularsın (520.000x0,20=104.000), böylece faaliyet karını olduğundan yüksek (176.000) bulursun. Doğrusu: yüzdeler her zaman net satışlar tabanına uygulanır."},"E":{"ad":"SMM\u0027i Dışlama Tuzağı","metin":"Faaliyet karını hesaplarken brüt satış karı adımını atlayıp doğrudan net satıştan yalnız faaliyet giderini düşersin, SMM\u0027i unutursun. Doğrusu: faaliyet karına ulaşmadan önce SMM mutlaka net satıştan düşülüp brüt satış karı bulunmalıdır."},"A":{"ad":"Ters Oran Tuzağı","metin":"Net satışı bulmak için SMM tutarını yüzdesine bölmen gerekirken yüzdesiyle çarparsın, böylece net satışı olduğundan küçük (338.000) hesaplarsın. Doğrusu: net satış 520.000/0,65=800.000\u0027dir, faaliyet karı da buradan 120.000 çıkar."},"B":{"ad":"Finansman Giderini Faaliyet Karına Dahil Etme Tuzağı","metin":"Finansman giderinin faaliyet karından sonra düşüldüğünü unutup 120.000\u0027den 30.000\u0027i çıkarırsın. Doğrusu: finansman gideri faaliyet karı hesabına hiç girmez, olağan kâra geçişte düşülür."}},"celdiriciYol":{"D":"520.000 x 0,20 = 104.000; 280.000 - 104.000 = 176.000 (faaliyet giderini SMM tabanı üzerinden hesaplama)","E":"800.000 - 160.000 = 640.000 (satılan malın maliyetini faaliyet karı zincirinden dışlama)","A":"520.000 x 0,65 = 338.000; 338.000 x 0,15 = 50.700 (net satışı bölme yerine çarparak bulma)","B":"120.000 - 30.000 = 90.000 (finansman giderini faaliyet karına dahil etme)"},"hap":"Dikey yüzde ve bir kalemin tutarı biliniyorsa net satış = tutar / (yüzde/100) ile bulunur, diğer tüm kalemler bu tabandan kendi yüzdeleriyle türetilir.","teshis":{"C":{"gercek":"Bir kalemin hem tutarı hem yüzdesi verilirse taban (net satış) bulunur, kalan tüm kalemler kendi yüzdeleriyle bu tabandan türetilir.","ayirt":"Verilen tek tutar ve yüzdeden tabanı doğru kurdum mu, sonra istenen kalemi bu tabandan mı hesapladım?","paragraf":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","yanilgi":"Bu şıkkı eleyen öğrenci, dikey yüzdelerden yalnız oran değil tutar da türetilebileceğini fark edemez ve soruyu çözülemez sanır."},"E":{"gercek":"Faaliyet karına ulaşmak için önce net satıştan SMM düşülüp brüt satış karı bulunur, ardından faaliyet giderleri düşülür; adım atlanamaz.","ayirt":"Brüt satış karını hesapladım mı, yoksa doğrudan net satıştan mı gittim?","paragraf":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","yanilgi":"Faaliyet karına giden zincirde satılan malın maliyeti adımını atlanabilir bir ara işlem sanıyorsun."},"A":{"gercek":"Yüzde bir oran olduğundan tabanı (net satışı) bulmak için tutar, yüzdenin ondalık karşılığına bölünür; bu Teori Notu\u0027nun \u0027tersine okuma\u0027 kuralıdır.","ayirt":"Bulduğum taban, verilen tutardan büyük mü olmalıydı küçük mü?","paragraf":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","yanilgi":"Dikey yüzdeden tutar bulurken tutarı yüzdesine bölmek yerine yüzdesiyle çarpılacağını sanıyorsun."},"D":{"gercek":"Gelir tablosu dikey yüzdelerinde tek taban net satışlardır; her kalem yüzdesi yalnız net satışa uygulanır.","ayirt":"Bu yüzdeyi hangi büyüklüğe çarptım, o büyüklük net satış mıydı?","paragraf":"Teori Notu - Dikey yüzde analizi ve bilanco yorumu","yanilgi":"Faaliyet giderleri yüzdesinin hangi tabana uygulandığını karıştırıp SMM tutarını taban sanıyorsun."},"B":{"gercek":"Faaliyet karı, faaliyet giderleri düşüldükten sonra durur; finansman gideri faaliyet karından SONRA, olağan kâra geçişte düşülür.","ayirt":"Bu kalem faaliyet giderleri arasında mı sayılıyor, yoksa faaliyet dışı mı?","paragraf":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","yanilgi":"Finansman giderinin faaliyet giderleri gibi faaliyet karından düşüldüğünü sanıyorsun."}},"verilen":[[7,1],[1,1],[2,1],[3,1],[4,1]],"donem":11,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"3568 sayılı Kanunun 48 inci maddesine göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında önce fiilin \u0027genel vakar ihlali\u0027 mi yoksa \u0027kanunun ayrıca saydığı özel ağır fiil\u0027 mi olduğunu ayırt et.","konu":"disiplin cezalari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Fiil","Mükellefle birlikte kasten vergi ziyaına sebebiyet verme","-"],["Kesinleşme durumu","Mahkeme kararıyla kesinleşmiş","-"],["HESAP","-","-"],["A) Uyarma","p.48/1","YANLIŞ ifade"],["B) Kınama","p.48/1","YANLIŞ ifade"],["C) Geçici olarak mesleki faaliyetten alıkoyma","p.48/2","YANLIŞ ifade"],["D) Yeminli sıfatını kaldırma","p.48/1","YANLIŞ ifade"],["E) Meslekten çıkarma","p.48/2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Geçici olarak mesleki faaliyetten alıkoyma","E":"Meslekten çıkarma","A":"Uyarma","D":"Yeminli sıfatını kaldırma","B":"Kınama"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"3568 sayılı Kanun m.48\u0027de mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararıyla kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir hükmü açıkça yer almaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[{"yil":"2018/3","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, disiplin cezalarına ilişkin aşağıdakilerden hangisi yanlıştır?"},{"yil":"2018/1","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, serbest muhasebeci mali müşavirlere uygulanabilecek disiplin cezaları ile ilgili aşağıdakilerden hangisi yanlıştır?"},{"yil":"2017/2","alinti":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliğine göre, yukarıdaki disiplin cezalarından hangileri Resmî Gazete’de ilan edilmez?"}],"donemler":["2025/1","2024/2","2021/1","2020/1","2018/3","2018/1","2017/3","2017/2","2017/1","2016/2","2015/2"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavirin, mükellefiyle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşmiştir. 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre bu meslek mensubuna hangi disiplin cezası verilir?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-01","verilenler":[{"deger":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verme","anlam":"Hangi disiplin cezasının uygulanacağını belirleyen fiildir.","ad":"Fiil"},{"deger":"Mahkeme kararıyla kesinleşmiş","anlam":"Cezanın uygulanabilmesi için fiilin mahkeme kararıyla kesinleşmiş olması gerektiğini gösterir.","ad":"Kesinleşme durumu"}],"dayanak":"3568 sayılı SMMM K. m.48","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: bir başka ilde, bir SMMM ile mükellefi 2019 yılında birlikte hareket edip 340.000 TL vergi ziyaına kasten sebep olmuş, olay mahkemeye taşınmış ve 2022\u0027de karar kesinleşmiştir.","anlatim":"Mahkeme kararı kesinleşince artık tartışma bitmiştir. Disiplin kurulu bu meslek mensubuna hangi cezayı vereceğine bakar.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun madde 48\u0027de beş ceza var; uyarma, kınama, geçici alıkoyma, yeminli sıfatını kaldırma, meslekten çıkarma. Bu beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Her ceza farklı bir fiile bağlanmıştır, hepsi aynı kefeye konmaz. Şimdi olayımızdaki fiil hangi bende denk geliyor onu arayacağız.","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"p.48/1","karar":"yanlış","anlatim":"Uyarma yalnız mesleğin vakar ve onuruna aykırı davranışın ilk kez görülmesinde uygulanır. Bizim olayımızda ayrı ve özel bir hüküm var, mükellefle kasten vergi ziyaı. Bu yüzden uyarma burada uygulanmaz.","formul":"Şık A: disiplin kurulu \u0027ilk defa oluyor, sadece uyarma verelim\u0027 diyor, bu doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"p.48/1","karar":"yanlış","anlatim":"Kınama da aynı genel vakar/onur ihlali hükmünün tekrarına özgüdür. Olayımızdaki fiil kanunun ayrıca saydığı özel bir haldir, genel hükme girmez. Kınama burada yanlış olur.","formul":"Şık B: \u0027daha önce böyle bir olay yaşamıştı, tekrar ettiği için kınama verelim\u0027 diyor, katılır mısın?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"p.48/2","karar":"yanlış","anlatim":"Geçici alıkoyma bağımsızlık, tarafsızlık, dürüstlük ihlaline ya da tasdik yetkisinin ilk kez kötüye kullanımına bağlıdır. Bizim olayda mükellefle birlikte kasten vergi ziyaı var, bu ayrı bir bent. Geçici alıkoyma burada uygulanmaz.","formul":"Şık C: \u0027altı ay mesleki faaliyetten alıkoyalım, yeter\u0027 diyor, doğru mu bu karar?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"p.48/1","karar":"yanlış","anlatim":"Bu ceza yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrür edip mahkeme kararıyla kesinleşmesine özgüdür. Olayımızda tasdik yetkisi kötüye kullanımı yok, mükellefle kasten vergi ziyaı var. D burada da yanlış.","formul":"Şık D: \u0027yeminli mali müşavirse yeminli sıfatını kaldıralım\u0027 diyor, sen ne dersin?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.48/2","karar":"doğru","anlatim":"Kanun açıkça der: mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası verilir. Olayımız tam bu tanıma uyuyor. Bu yüzden E doğrudur.","formul":"Şık E: \u0027meslekten çıkarma cezası verelim\u0027 diyor, sence bu doğru mu?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.48/2","karar":"doğru","anlatim":"Bu ceza kademeli bir süreçten geçmez, kanun onu doğrudan ve özel olarak bağlamıştır. Kendine hep şunu sor: bu fiil genel vakar/onur ihlali mi, yoksa kanunun ayrıca saydığı özel bir fiil mi?","formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓"}],"anahtar":[{"ornek":"meslek","kok":"meslek"},{"ornek":"mükellefle","kok":"mükell"},{"ornek":"kesinleşen","kok":"kesinl"},{"ornek":"olayımızdaki","kok":"olayım"},{"ornek":"kasten","kok":"kasten"},{"ornek":"kararıyla","kok":"kararı"}],"konuGiris":{"harita":"Ne zaman verilir: fiilin ağırlığına göre beş dereceli cezalardan biri seçilerek uygulanır. Nasıl belirlenir: kanunda sayılan fiil tipleri ile ceza doğrudan eşleştirilir. Nasıl kesinleşir: savunma alınıp disiplin kurulu kararıyla, bildirimden sonra yürürlüğe girer.","desen":"Soru genelde mahkeme kararıyla kesinleşmiş vergi ziyaı fiilini verip doğrudan ceza türünü sordurur; tuzak, bu fiili geçici alıkoyma ya da kınama gibi hafif cezalarla karıştırmaktır. Çıkmışlarda öğrenciler tekerrür şartlarını (3 yıl, 5 yıl) bu maddeyle karıştırıp yanlış ceza seçebilir. Bu soru m.48 fıkra 2\u0027deki \u0027mükellefle birlikte kasten vergi ziyaı\u0027 ibaresinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Daha dikkatli davranılması gerektiğinin yazıyla bildirilmesi","ad":"Uyarma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"6 ay ila 1 yıl arası mesleki faaliyetten men edilme","ad":"Geçici alıkoyma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ruhsatın geri alınıp mesleğe tekrar izin verilmemesi","ad":"Meslekten çıkarma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mükellefle birlikte kasten vergi kaybına neden olma","ad":"Vergi ziyaı fiili","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Mahkeme kararıyla kesinleşmiş bir fiil verilip buna karşılık gelen disiplin cezası sorulur.","panel_ornek":"Bir spor kulübü üyesi, kulüp kurallarını ilk kez ihlal ederse sözlü uyarı alır; aynı hatayı 3 kez tekrarlarsa üyeliği tamamen iptal edilir. Küçük hata küçük ceza, büyük ve tekrar eden hata ise en ağır cezayı getirir.","ornek":"Bir spor kulübü üyesi, kulüp kurallarını ilk kez ihlal ederse sözlü uyarı alır; aynı hatayı 3 kez tekrarlarsa üyeliği tamamen iptal edilir. Küçük hata küçük ceza, büyük ve tekrar eden hata ise en ağır cezayı getirir.","yontemler":"Fiil cümlesini kanundaki kalıp ifadelerle birebir eşleştirip doğrudan ceza adını seçmek yeterlidir, hesaplama yapılmaz.","nedir":"Meslek mensuplarının mesleki kurallara aykırı davranışlarına karşı uygulanan yaptırım sistemidir. Sınav, hangi fiile hangi ceza derecesinin karşılık geldiğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Bağımsızlık İhlali Tuzağı","metin":"Görevi bağımsızlık, tarafsızlık ve dürüstlükle yapmama halinin cezasıyla bu özel fiili karıştırıyorsun. Doğrusu: Geçici alıkoyma cezası bağımsızlık/tarafsızlık ihlali ile tasdik yetkisinin gerçeğe aykırı ilk kullanımına özgüdür, mükellefle kasten vergi ziyaına sebebiyet fiiline uygulanmaz."},"A":{"ad":"İlk Aşama Tuzağı","metin":"Her disiplin ihlalinin ilk defasında uyarma cezası ile başladığını sanıyorsun. Doğrusu: Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verilip bu husus mahkeme kararıyla kesinleştiğinde ilk aşama uygulamadan doğrudan meslekten çıkarma cezasını öngörür."},"D":{"ad":"Yeminli Sıfatı Tuzağı","metin":"Bu cezanın her ağır fiilde uygulanan genel bir yaptırım olduğunu sanıyorsun. Doğrusu: Yeminli sıfatının kaldırılması yalnız yeminli mali müşavirlerin tasdik yetkisini gerçeğe aykırı kullanmasının tekerrürüne özgü özel bir cezadır."},"B":{"ad":"Tekerrür Tuzağı","metin":"Kınama cezasının basit kusurlu davranışın tekrarında uygulandığını, olayı da böyle bir tekrar sanıyorsun. Doğrusu: Buradaki fiil mükellefle birlikte kasten vergi ziyaına sebep olmaktır, bu fiile kanun doğrudan en ağır cezayı bağlamıştır."}},"celdiriciYol":{},"hap":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu husus mahkeme kararıyla kesinleşen meslek mensubuna kademesiz doğrudan meslekten çıkarma cezası verilir.","teshis":{"C":{"gercek":"Geçici alıkoyma; bağımsızlık, tarafsızlık, dürüstlük ihlali ile tasdik yetkisinin ilk kez gerçeğe aykırı kullanımına özgüdür.","ayirt":"Fiil bağımsızlık/tasdik yetkisi ihlali mi, yoksa mükellefle birlikte vergi ziyaı mı?","paragraf":"3568 s.K. m.48","yanilgi":"Geçici alıkoymayı her ağır sayılan fiilin standart cezası sanıyorsun."},"E":{"gercek":"Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verilip bunun mahkeme kararıyla kesinleşmesi halini doğrudan meslekten çıkarma sebebi saymıştır.","ayirt":"Fiil kanunda ayrıca sayılan doğrudan ağır ceza gerektiren hallerden biri mi?","paragraf":"3568 s.K. m.48","yanilgi":"Bu kadar ağır bir cezanın kademeli süreç olmadan uygulanamayacağını düşünüp bu şıkkı elersin."},"A":{"gercek":"Madde 48, ağırlığına göre bazı fiillere kademesiz doğrudan ağır ceza bağlar; kasten vergi ziyaı bunlardan biridir.","ayirt":"Bu fiil kademeli mi ağırlaşır yoksa kanunun kendisi mi doğrudan ağır cezayı buyuruyor?","paragraf":"3568 s.K. m.48","yanilgi":"Bütün disiplin süreçlerinin uyarma ile başladığını düşünüyorsun."},"D":{"gercek":"Bu ceza yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrür edip mahkeme kararıyla kesinleşmesine özgüdür.","ayirt":"Olayda tasdik yetkisinin tekerrür eden kötüye kullanımı mı var, yoksa mükellefle kasten vergi ziyaı mı var?","paragraf":"3568 s.K. m.48","yanilgi":"Yeminli sıfatını kaldırmayı her yeminli mali müşavir hatasının cezası sanıyorsun."},"B":{"gercek":"Kınama yalnız mesleğin vakar ve onuruna aykırı hareketin tekrarında uygulanır, kasten vergi ziyaı ayrı ve özel bir hükümle düzenlenmiştir.","ayirt":"Olaydaki fiil genel vakar/onur ihlali mi, yoksa kanunun ayrıca saydığı özel bir fiil mi?","paragraf":"3568 s.K. m.48","yanilgi":"Kınamayı her tekrarlanan hatanın otomatik cezası sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":11,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 82"},"kural":"Ticari borçların az gösterilip gösterilmediği test edilirken kayıtlı olmayan kalemler (ödenmemiş faturalar, teyide yanıt vermeyenler) ihtiyaca uygun kanıttır ve iptal edilen sipariş tutarı borç toplamına dahil edilmez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 82","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Sapma sorularında önce \u0027kayıtlı mı büyük gerçek mi büyük\u0027 sorusunu kendine sor, sonra soruda geçen her sayının hesaba girip girmediğini tek tek kontrol et.","konu":"denetim kanıtı yeterliliği","tablo":{"satirlar":[["VERİLENLER","-"],["Kayıtlı ticari borç","940.000 TL"],["Teyitten doğrulanan tutar","900.000 TL"],["Ödenmemiş fatura tutarı","75.000 TL"],["İptal edilen sipariş tutarı","5.000 TL"],["HESAP","-"],["Gerçek borç toplamı (900.000 + 75.000)","975.000"],["Kayıtlı borç - Gerçek toplam farkı (975.000 - 940.000)","35.000 (az gösterme)"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"40.000 az gösterme","E":"Sapma yok","A":"35.000 az gösterme","D":"40.000 fazla gösterme","B":"35.000 fazla gösterme"},"kaynak":{"alinti":"","liste":[{"ad":"BDS 500 p.7 - Denetim Kanıtı Olarak Kullanılacak Bilgiler","metin":"BDS 500 (Bağımsız Denetim Kanıtları) paragraf 7: Denetçi, denetim prosedürlerini tasarlar ve uygularken, denetim kanıtı olarak kullanılacak bilgilerin ihtiyaca uygunluğunu ve güvenilirliğini mütalaa eder (Bkz.: A26-A33A34 paragrafları)."},{"ad":"BDS 500 p.A28 - Açıklayıcı Hükümler ve Uygulama - Denetim Kanıtı Olarak Kullanılacak Bilgiler - İhtiyaca Uygunluk","metin":"BDS 500 (Bağımsız Denetim Kanıtları) paragraf A28: Belirli denetim prosedürleri, belirli yönetim beyanlarıyla ilgili denetim kanıtı sağlarken, diğer beyanlarla ilgili kanıt sağlamayabilir. Örneğin, alacakların bilanço tarihinden sonraki bir dönemde tahsil edilmesiyle ilgili belgelerin tetkiki, var olma ve değerlemeyle ilgili denetim kanıtı sağlarken, hesap kesimiyle ilgili kanıt sağlamayabilir. Benzer şekilde, stokların mevcudiyeti gibi belirli bir yönetim beyanıyla ilgili denetim kanıtının elde edilmesi, stokların değerlemesi gibi başka bir yönetim beyanıyla ilgili denetim kanıtının elde edilmesinin ikamesi olmaz. Öte yandan, farklı kaynaklardan elde edilen veya farklı nitelikteki denetim kanıtları çoğu zaman aynı yönetim beyanıyla ilgili olabilir."}],"hakem":"BDS 500 p.A27\u0027de ticari borçların az gösterilip gösterilmediği test edilirken ödenmemiş faturalar ve tedarikçi beyanlarının ihtiyaca uygun kanıt olduğu, kayıtlı tutarın bu kaynaklardan elde edilen gerçek tutarla karşılaştırılması gerektiği açıkça belirtilmiştir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":9,"ornekler":[],"donemler":["2025/3","2020/2","2019/3","2019/1","2018/2","2017/2","2017/1","2016/3","2015/2"]},"oyun":{"bosluk":[[1,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Gerçek borç toplamı (800.000 + 90.000)","890.000"],["Kayıtlı borç - Gerçek toplam farkı (890.000 - 860.000)","30.000 (az gösterme)"]]},"tur":"tablo","soru":"İşletmenin kayıtlı ticari borç tutarı 860.000 TL\u0027dir. Tedarikçi teyitlerinden 800.000 TL doğrulanmış, teyide yanıt vermeyenler için ödenmemiş faturalardan 90.000 TL ek borç tespit edilmiştir. Dönem içinde iptal edilen sipariş tutarı 6.000 TL\u0027dir. Tespit edilen sapmanın tutarı ve yönü nedir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve sapmanın tutarı ile yönünü bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin kayıtlı ticari borç tutarı 940.000 TL\u0027dir. Tedarikçi teyitlerinden 900.000 TL doğrulanmış, teyide yanıt vermeyenler için ödenmemiş faturalardan 75.000 TL ek borç tespit edilmiştir. Dönem içinde iptal edilen sipariş tutarı 5.000 TL\u0027dir. Tespit edilen sapmanın tutarı ve yönü nedir?","kayitBaslik":"","id":"sgs-t1-denetim-cokzor/kp-01","verilenler":[{"deger":"940.000 TL","anlam":"İşletmenin defter kayıtlarındaki ticari borç bakiyesi, karşılaştırmanın esas alındığı tutar.","ad":"Kayıtlı ticari borç"},{"deger":"900.000 TL","anlam":"Tedarikçi teyit mektuplarıyla doğrudan doğrulanan borç kısmı, gerçek toplamın bir parçası.","ad":"Teyitten doğrulanan tutar"},{"deger":"75.000 TL","anlam":"Teyide yanıt vermeyenler için dönem sonrası tespit edilen ek borç, az gösterme testinde ihtiyaca uygun kanıt.","ad":"Ödenmemiş fatura tutarı"},{"deger":"5.000 TL","anlam":"Ticari borç bakiyesiyle ilgisi olmayan çeldirici veri, hesaba dahil edilmez.","ad":"İptal edilen sipariş tutarı"}],"dayanak":"BDS 500 p.A27 (ihtiyaca uygunluk ve test yönü); p.A28 (farklı kaynaklardan kanıtın aynı beyanı desteklemesi)","dogru":"A","oyunBonus":null,"ders":"Denetim","adimlar":[{"formul":"Soruda ne var: kayıtlı borç 940.000 TL (soruda verilen); teyitle doğrulanan 900.000 TL (soruda verilen); ek borç 75.000 TL (soruda verilen); iptal sipariş 5.000 TL (soruda verilen); sapma tutarı ve yönü soruluyor","anlatim":"Soru bize şunları vermiş: kayıtlı ticari borç 940.000 TL, teyitle doğrulanan 900.000 TL, teyide yanıt vermeyenlerin ödenmemiş faturalarından tespit edilen ek borç 75.000 TL. İptal edilen sipariş tutarı 5.000 TL de verilmiş ama bu borç toplamına girmeyecek bir çeldirici.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"BDS 500 nedir?","anlatim":"BDS 500 nedir? Denetçinin kanıt toplarken uyacağı kuralları anlatan standart - burada \u0027yeterli ve uygun kanıt\u0027 ilkesi devrede. Teyide yanıt vermeyen tedarikçiler için ödenmemiş fatura incelemesi bu standarda göre alternatif kanıttır.","doldur":[]},{"formul":"Gerçek borç toplamı = teyitle doğrulanan + ek borç = 900.000 (soruda verilen) + 75.000 (soruda verilen) = 975.000 TL","anlatim":"Şimdi biz hesaplıyoruz: teyitle doğrulanan tutar ile teyide cevap vermeyenlerden bulunan ek borcu topluyoruz. Bu iki kalem birlikte işletmenin gerçek borç toplamını verir.","doldur":[[6,1]]},{"formul":"Gerçek borç toplamı = teyitle doğrulanan + ek borç = 900.000 (soruda verilen) + 75.000 (soruda verilen) = 975.000 TL; Dahil değil: iptal edilen sipariş tutarı 5.000 (soruda verilen)","anlatim":"Dikkat: iptal edilen sipariş tutarı bu toplama girmez. Sipariş iptal olunca ortada bir borç doğmaz, o yüzden ticari borç hesaplamasında yeri yok.","doldur":[]},{"formul":"Sapma = gerçek toplam - kayıtlı borç = 975.000 (3. adımda bulduk) - 940.000 (soruda verilen) = 35.000 TL","anlatim":"Şimdi kayıtlı tutar ile gerçek toplamı karşılaştırıyoruz. Fark bize sapmanın büyüklüğünü verir.","doldur":[[7,1]]},{"formul":"büyük olan: kayıtlı 940.000 (soruda verilen) ile gerçek 975.000 (3. adımda bulduk) → gerçek büyük, yön: az gösterme","anlatim":"Sapmanın yönünü de belirliyoruz. Kayıtlı tutar gerçek tutardan küçük çıktığı için işletme borcunu az göstermiş.","doldur":[]},{"formul":"Sapma = 975.000 (3. adımda bulduk) - 940.000 (soruda verilen) = 35.000 TL, yön: az gösterme","anlatim":"SONUÇ: sapma 35.000 TL\u0027dir ve ticari borçlar az gösterilmiştir. Kayıtlı tutar gerçek tutarın altında kaldığı için yön hep \u0027az gösterme\u0027 çıkıyor.","doldur":[]},{"formul":"Ters durum: kayıtlı \u003e gerçek toplam → yön fazla gösterme","anlatim":"Ters durumda: kayıtlı tutar gerçek tutardan büyük olsaydı yön \u0027fazla gösterme\u0027 olurdu. Aynı yöntemle fark hesaplanır, sadece işaretin yorumu değişir.","doldur":[]},{"formul":"Yanlış yol: 900.000 + 75.000 + 5.000 = 980.000 TL (HATALI) → doğrusu 975.000 TL (3. adımda bulduk), sapma 35.000 TL","anlatim":"En sık hata: öğrenciler iptal edilen 5.000 TL\u0027yi de gerçek toplama ekleyip 980.000 TL buluyor. Bu yanlış çünkü iptal olan sipariş borç doğurmaz, kanıt kapsamına girmez.","doldur":[]}],"anahtar":[{"ornek":"kayıtlı","kok":"kayıtl"},{"ornek":"gösterme","kok":"göster"},{"ornek":"gerçek","kok":"gerçek"},{"ornek":"toplamına","kok":"toplam"},{"ornek":"edilen","kok":"edilen"},{"ornek":"sipariş","kok":"sipari"}],"konuGiris":{"harita":"Ne zaman test edilir: yönetim beyanının hangi yönde (fazla/az gösterme) risk taşıdığı belirlendiğinde test yönü seçilir. Nasıl ölçülür: kayıtlı tutarla bağımsız kaynaklardan (teyit, fatura, ödeme) elde edilen tutar karşılaştırılarak sapma hesaplanır. Nasıl kaydedilir: sapmanın tutarı ve yönü (fazla/az gösterim) çalışma kağıdında gerekçesiyle belirtilir.","desen":"Soru, kayıtlı tutarı test etmenin borçların eksik gösterilmesini yakalamaya uygun olmadığını, bunun yerine ödenmemiş faturalar ve teyitlerin kullanılmasını hatırlatır (p.A27). Tuzak, iptal edilen sipariş tutarının hesaplamaya dahil edilmesi gibi ilgisiz bir rakamın verilmesidir. Bu soru A27 paragrafındaki \u0027az gösterme testi\u0027 örneğinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Prosedürün amacı ile test edilen beyan arasındaki mantıksal bağlantı","ad":"İhtiyaca uygunluk","kim":"standart (BDS) sabitler"},{"kaynak":"soruda verilir","tanim":"Hesabın fazla mı az mı gösterildiğinin test edilme yönü","ad":"Test yönü","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"soruda verilir","tanim":"Üçüncü taraftan doğrudan alınan bağımsız borç tutarı bilgisi","ad":"Tedarikçi teyidi","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"sen hesaplarsın","tanim":"Kayıtlı tutardan gerçek/doğrulanmış tutarın çıkarılmasıyla bulunan fark","ad":"Sapma tutarı","kim":"denetçi mesleki yargıyla belirler"}],"sinavda":"Kayıtlı borç tutarı, teyit sonuçları ve ek tespit edilen fatura tutarı verilir; sapmanın tutarı ve yönü istenir.","panel_ornek":"İkinci el bir telefon ilanında satıcı \u0027borcu yok\u0027 diyor ama sen kutudaki faturayı, kargo kaydını ve son taksit dekontunu ayrı ayrı kontrol ediyorsun; sadece ilana bakmak yetmiyor. 3 farklı kaynak birbirini doğrulamazsa fiyat pazarlığında haklı çıkarsın.","ornek":"İkinci el bir telefon ilanında satıcı \u0027borcu yok\u0027 diyor ama sen kutudaki faturayı, kargo kaydını ve son taksit dekontunu ayrı ayrı kontrol ediyorsun; sadece ilana bakmak yetmiyor. 3 farklı kaynak birbirini doğrulamazsa fiyat pazarlığında haklı çıkarsın.","yontemler":"Doğrulanan teyit tutarına, teyide cevap vermeyenlerden tespit edilen ek borç eklenerek gerçek tutar bulunur; kayıtlı tutardan büyükse borç az gösterilmiştir. İptal edilen sipariş tutarı borç hesabını ilgilendirmediği için hesaplamaya katılmaz.","nedir":"Denetim kanıtı yeterliliği, denetçinin görüşünü dayandırdığı bilginin miktar ve kalite olarak yeterli olup olmadığıdır. Sınav, testin yönü ile hesabın şişirilme mi eksik gösterilme mi riskine karşı doğru prosedürün seçilip seçilmediğini ölçer."},"olay":"900.000 + 75.000 = 975.000; 975.000 - 940.000 = 35.000; kayıtlı tutar gerçek tutardan düşük olduğu için borç az gösterilmiştir.","tuzak":{"C":{"ad":"Çeldirici Veri Yükleme Tuzağı","metin":"Soruda geçen iptal edilen sipariş tutarını hesaba dahil ederek 900.000+75.000+5.000-940.000 işlemiyle 40.000 TL bulursun; oysa iptal edilen sipariş kayıtlı borçla ilgisiz bir veridir. Doğrusu: İptal edilen sipariş toplamdan çıkarılır, gerçek sapma 35.000 TL\u0027dir."},"E":{"ad":"Kanıt Karıştırma Tuzağı","metin":"Teyit ve ödenmemiş fatura farklı kaynaklardan geldiği için birbirini teyit edip sapmayı sıfırladığını düşünürsün; oysa BDS 500 A28 uyarınca farklı kaynaklardan gelen kanıtlar aynı beyanı destekler, birbirini iptal etmez. Doğrusu: İki kanıt toplanarak kayıtlı tutarla karşılaştırılır ve 35.000 TL\u0027lik gerçek bir sapma ortaya çıkar."},"D":{"ad":"Çift Tuzak (Tutar+Yön) Tuzağı","metin":"Hem çeldirici sipariş tutarını hesaba katıp hem de yönü ters çevirerek 40.000 TL fazla gösterme dersin; bu iki ayrı hatanın üst üste binmesidir. Doğrusu: Doğru hesapta çeldirici veri dışlanır ve yön az göstermedir, sonuç 35.000 TL az göstermedir."},"B":{"ad":"Yön Tersleme Tuzağı","metin":"Kayıtlı tutarın gerçek tutardan düşük çıktığını görünce bunu \u0027fazla gösterme\u0027 sanırsın, oysa kayıtlı tutarın düşük kalması az gösterme demektir. Doğrusu: Aynı 35.000 TL fark az gösterme yönündedir, fazla gösterme değildir."}},"celdiriciYol":{"C":"900.000 + 75.000 + 5.000 - 940.000 = 40.000 (iptal edilen sipariş tutarı hataen borca dahil edildi)","D":"900.000 + 75.000 + 5.000 - 940.000 = 40.000 (çeldirici veri eklendi ve yön ters yorumlandı)","B":"975.000 - 940.000 = 35.000 (yön ters yorumlandı, az yerine fazla gösterme dendi)"},"hap":"İhtiyaca uygunluk test yönüne göre değişir; az gösterme şüphesinde kayıtlı olmayan kalemler (ödenmemiş fatura, teyit dışı borç) test edilir, kayıtlı tutar tek başına yeterli değildir.","teshis":{"C":{"gercek":"İhtiyaca uygunluk ilkesi gereği yalnız incelenen beyanla mantıksal bağlantısı olan kanıtlar hesaba katılır; iptal edilen sipariş ticari borç bakiyesiyle ilgisizdir.","ayirt":"Bu sayı, test ettiğim beyanla (ticari borç) doğrudan bağlantılı mı?","paragraf":"BDS 500 p.A27","yanilgi":"Soruda geçen her sayının hesaba girmesi gerektiğini düşünüp iptal edilen sipariş tutarını da toplarsın."},"E":{"gercek":"BDS 500 p.A28 uyarınca farklı kaynaklardan elde edilen kanıtlar çoğu zaman aynı beyanı birlikte destekler, toplanarak değerlendirilir.","ayirt":"Bu iki kanıt aynı beyanı mı destekliyor, birbirini mi iptal ediyor?","paragraf":"BDS 500 p.A28","yanilgi":"Farklı kaynaklardan gelen kanıtların birbirini geçersiz kıldığını ya da dengelediğini sanırsın."},"A":{"gercek":"BDS 500 p.A27 uyarınca az gösterme testinde kayıtlı olmayan kalemler toplanıp kayıtlı tutarla karşılaştırılır; fark doğrudan sapma tutarıdır.","ayirt":"Hesaba yalnız gerçek borcu oluşturan kanıtları mı kattım, çeldirici veriyi dışladım mı?","paragraf":"BDS 500 p.A27","yanilgi":"Bu şıkkı eleyen öğrenci, doğru sonucun basit bir çıkarma işlemiyle değil daha karmaşık bir formülle bulunması gerektiğini sanır."},"D":{"gercek":"Doğru çözümde hem çeldirici veri dışlanır hem de yön kayıtlı-gerçek farkının işaretine göre doğru belirlenir.","ayirt":"Hem tutarı hem yönü ayrı ayrı kontrol ettim mi?","paragraf":"BDS 500 p.A27","yanilgi":"Hem gereksiz veriyi eklersin hem de yönü ters çevirirsin, iki hatayı birden yaparsın."},"B":{"gercek":"Kayıtlı tutar gerçek tutardan düşükse borç az gösterilmiştir; yön kayıtlı-gerçek farkının işaretiyle belirlenir.","ayirt":"Kayıtlı tutar mı büyük, gerçek tutar mı büyük, önce bunu belirledim mi?","paragraf":"BDS 500 p.A27","yanilgi":"Kayıtlı tutarın düşük çıkmasını \u0027borç fazla yazılmış\u0027 gibi ters yorumlarsın."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":9,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 71"},"kural":"Yüzde Değişim = (Cari Dönem - Baz Dönem) / Baz Dönem x 100, baz dönem her zaman payda olur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 71","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Şıklarda 100 ve endeks (cari/baz x100) değeri görürsen, bunları yüzde DEĞİŞİM ile karıştırmadığından emin ol; değişim endeksten 100 çıkarılarak bulunur.","konu":"yatay analiz","tablo":{"satirlar":[["VERİLENLER","-"],["2025 yılı ticari alacaklar (Baz Dönem)","200.000 TL"],["2026 yılı ticari alacaklar (Cari Dönem)","250.000 TL"],["HESAP","-"],["Tutar Farkı (250.000-200.000)","50.000"],["Yüzde Değişim (50.000/200.000x100)","25"]],"basliklar":["İşlem","Tutar"]},"siklar":{"C":"50","E":"125","A":"20","D":"100","B":"25"},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.275 - İmal edilen emtia","metin":"İmal edilen emtia: Madde 275 – İmal edilen emtianın (Tam ve yarı mamul mallar) maliyet bedeli aşağıda yazılı unsurları ihtiva eder: 1. Mamulün vücuda getirilmesinde sarf olunan iptidai ve ham maddelerin bedeli; 2. Mamule isabet eden işçilik; 3. Genel imal giderlerinden mamule düşen hisse; 4. Genel idare giderlerinden mamule düşen hisse; (Bu hissenin mamulün maliyetine katılması ihtiyaridir.) 5. Ambalajlı olarak piyasaya arz edilmesi zaruri olan mamullerde ambalaj malzemesinin bedeli. Mükellefler, imal ettikleri emtianın maliyet bedellerini yukarıki unsurları ihtiva etmek şartiyle diledikleri usulde tayin edebilirler. (Üçüncü fıkra mülga: 30/12/1980-2365/51 md.)"},{"ad":"TEORI - Yatay (karsilastirmali) analiz kurallari","metin":"TEORİ/TEKNİK (mali analiz, mevzuat maddesi yok). YATAY (KARŞILAŞTIRMALI) ANALİZ: en az iki dönemin aynı kalemleri yan yana konur; TUTAR FARKI ve YÜZDE DEĞİŞİM hesaplanır. YÜZDE DEĞİŞİM = (Cari Dönem - Baz Dönem) / BAZ DÖNEM x 100. BAZ YIL KURALI: karşılaştırmada ilk (en eski) dönem baz alınır; eğilim (trend) analizinde baz yıl 100 kabul edilip diğer yıllar ona endekslenir. UC KURAL: (1) BAZ DÖNEM TUTARI SIFIRSA veya negatifse yüzde değişim HESAPLANAMAZ/ANLAMSİZDİR - yalnızca tutar farkı verilir. (2) Küçük tutarlı kalemlerde yüzde değişim AŞIRI BÜYÜK çıkar ve yanıltır; mutlaka TUTAR farkıyla birlikte okunmalıdır. (3) Dönemlerin AYNI UZUNLUKTA ve aynı muhasebe politikalarıyla hazırlanmış olması gerekir; politika degistiyse karşılaştırma bozulur. ENFLASYON UYARISI: yüksek enflasyon dönemlerinde nominal artış GERÇEK BÜYÜME anlamına gelmez; düzeltme yapılmadan yorum yanilticidir. YATAY-DİKEY FARKI: yatay analiz ZAMAN İÇİNDEKİ DEĞİŞİMİ, dikey analiz TEK DÖNEMİN IC YAPISINI gösterir; ikisi birbirinin alternatifi değil TAMAMLAYICISIDIR. SINAV TUZAĞI: bir kalemin yüzde artışı yüksek diye \u0027önemli\u0027 sayılmaz - örneğin küçük bir kalemin ikiye katlanmasi %100 artıştır ama tutar etkisi önemsiz olabilir. Tersine büyük bir kalemdeki %5 artış daha önemlidir. Analizde ÖLÇEK gozetilir."}],"hakem":"Yatay analiz yüzde değişim formülü (Cari Dönem - Baz Dönem) / Baz Dönem x 100 kaynak metinde açıkça tanımlanmış; hesaplama ve sonuç (%25) doğrudur."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":8,"ornekler":[{"yil":"2025/3","alinti":"Bu bilgilere dayanarak işletmenin 2024 yılındaki yatay analiz sonuçlarına göre en yüksek oransal artış hangi kalemde gerçekleşmiştir?"},{"yil":"2021/1","alinti":"Brüt satış kârı 2.000 ₺ olan bir işletmede, satışlarının maliyeti 18.000 ₺ ise brüt satış kârlılığı aşağıdakilerden hangisidir?"},{"yil":"2020/2","alinti":"Buna göre yapılacak bir yatay analizde, 2018 yılına göre 2019 yılında işletmenin kısa vadeli yabancı kaynaklarına ilişkin yatay analiz yüzdesi kaç olur?"}],"donemler":["2025/3","2021/1","2020/2","2019/3","2019/1","2017/2","2016/3","2016/2"]},"oyun":{"bosluk":[[0,1],[1,1]],"tablo":{"basliklar":["İşlem","Tutar"],"satirlar":[["Tutar Farkı (234.000-180.000)","54.000"],["Yüzde Değişim (54.000/180.000x100)","30"]]},"tur":"tablo","soru":"Bir üretim işletmesinin stokları 2025 yılında 180.000 TL, 2026 yılında 234.000 TL olarak gerçekleşmiştir. Yatay analiz tekniğine göre stoklardaki yüzde değişimi bulunuz.","verilen":[],"hedef":"Tabloyu doldur ve stoklardaki yüzde değişimin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir perakende işletmesinin ticari alacakları 2025 yılında 200.000 TL, 2026 yılında 250.000 TL olarak gerçekleşmiştir. Yatay analiz tekniğine göre ticari alacaklardaki yüzde değişim kaçtır?","kayitBaslik":"","id":"sgs-t1-mta-kolay/kp-02","verilenler":[{"deger":"200.000 TL","anlam":"Yatay analizde formülün paydasını oluşturan, en eski (baz) dönem tutarıdır.","ad":"2025 yılı ticari alacaklar (Baz Dönem)"},{"deger":"250.000 TL","anlam":"Karşılaştırmanın cari dönem tutarıdır; baz dönemden çıkarılarak fark bulunur.","ad":"2026 yılı ticari alacaklar (Cari Dönem)"}],"dayanak":"TEORİ - Yatay (karşılaştırmalı) analiz kuralları: Yüzde Değişim = (Cari Dönem - Baz Dönem)/Baz Dönem x 100","dogru":"B","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Verilen: 2025 Ticari Alacaklar 200.000 TL (soruda verilen); 2026 Ticari Alacaklar 250.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: 2025 ticari alacak 200.000 TL, 2026 ticari alacak 250.000 TL.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Tutar Farkı = Cari Dönem − Baz Dönem = 250.000 (soruda verilen) − 200.000 (soruda verilen) = 50.000","anlatim":"Yatay analizde önce iki dönem arasındaki tutar farkını buluruz. Baz yıl her zaman eski yıldır, burada 2025.","doldur":[[4,1]]},{"formul":"Yüzde Değişim = Tutar Farkı / Baz Dönem × %100 = 50.000 (1. adımda bulduk) / 200.000 (soruda verilen) × %100 = %25","anlatim":"Şimdi bu farkı baz yıla oranlayıp yüzdeye çeviriyoruz. Baz yıl her zaman paydada olur, yoksa oran yanlış çıkar.","doldur":[[5,1]]},{"formul":"Sağlama = 200.000 (soruda verilen) + 200.000 × %25 = 200.000 + 50.000 = 250.000 ✓","anlatim":"Sağlama yapalım: baz tutarın %25 fazlası cari tutara eşit olmalı.","doldur":[]},{"formul":"Ters durum: cari dönem \u003c baz dönem → yüzde değişim negatif işaretli","anlatim":"Ters durumda: alacaklar azalsaydı fark negatif çıkar, yüzde değişim de negatif yazılırdı.","doldur":[]},{"formul":"Yanlış yol: 50.000 / 250.000 × %100 = %20 (HATALI) → doğrusu 50.000 / 200.000 × %100 = %25 (3. adımda bulduk)","anlatim":"Sonuç: ticari alacaklardaki yüzde değişim %25\u0027tir. En sık hata, farkı cari döneme bölmektir.","doldur":[]}],"anahtar":[{"ornek":"değişimin","kok":"değişi"},{"ornek":"alacak","kok":"alacak"},{"ornek":"ticari","kok":"ticari"},{"ornek":"negatifse","kok":"negati"},{"ornek":"analizde","kok":"analiz"},{"ornek":"tutarıdır","kok":"tutarı"}],"konuGiris":{"harita":"Ne zaman test edilir: en az iki dönemin aynı kalemi karşılaştırılırken test edilir. Nasıl ölçülür: cari dönem ile baz dönem arasındaki fark, baz döneme bölünerek yüzde bulunur. Nasıl kaydedilir: tutar farkı ve yüzde değişim birlikte, baz dönem payda olacak şekilde raporlanır.","desen":"Bu soru genelde iki dönem tutarı verip doğrudan formül uygulatarak sorulur; tuzak baz dönemi cari dönemle karıştırmak veya paydayı yanlış seçmektir. Bazı sorularda baz dönem sıfır ya da negatif verilip \u0027hesaplanamaz\u0027 cevabı beklenir. Bu soru, yatay analizde baz dönemin payda olması kuralı noktasından geliyor (p. Teori-Yatay analiz kuralları).","terimler":[{"kaynak":"soruda verilir","tanim":"karşılaştırmada payda olan, genelde en eski dönem tutarı","ad":"Baz dönem","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"karşılaştırılan, incelenen güncel dönem tutarı","ad":"Cari dönem","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"cari dönem tutarından baz dönem tutarının çıkarılmasıyla bulunan fark","ad":"Tutar farkı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"tutar farkının baz dönem tutarına oranının yüz ile çarpılmış hali","ad":"Yüzde değişim","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"İki farklı döneme ait aynı kalemin tutarları verilir ve aralarındaki yüzde değişim istenir.","panel_ornek":"Bir gencin cep telefonu geçen yıl 10.000 TL değerindeyken bu yıl 15.000 TL\u0027ye çıkmış olsun. Artış tutarı 5.000 TL, yüzde değişim ise (15.000-10.000)/10.000x100 = %50\u0027dir. Burada baz alınan geçen yılki değerdir, bu yılki değil.","ornek":"Bir gencin cep telefonu geçen yıl 10.000 TL değerindeyken bu yıl 15.000 TL\u0027ye çıkmış olsun. Artış tutarı 5.000 TL, yüzde değişim ise (15.000-10.000)/10.000x100 = %50\u0027dir. Burada baz alınan geçen yılki değerdir, bu yılki değil.","yontemler":"Tek yöntem: yüzde değişim = (cari dönem - baz dönem) / baz dönem x 100 formülü uygulanır; baz dönem her zaman en eski/ilk dönemdir.","nedir":"Yatay analiz, işletmenin aynı kalemini birden fazla dönem arasında karşılaştırıp değişimi ölçen bir tekniktir. Sınav, baz dönemi doğru seçip yüzde değişimi doğru formülle hesaplayabilmeyi ölçer."},"olay":"(250.000-200.000)/200.000x100 = 50.000/200.000x100 = 25.","tuzak":{"C":{"ad":"Ölçek Hatası","metin":"50.000 TL\u0027lik tutar farkını doğrudan yüzde değere çevirip 50 yazdın. Doğrusu: tutar farkı yüzdeye çevrilirken mutlaka baz döneme bölünüp 100 ile çarpılır, farkın kendisi yüzde değil."},"E":{"ad":"Endeks-Değişim Karışıklığı","metin":"yeni dönemin baz döneme oranı olan endeksi (250.000/200.000x100=125) yüzde değişimin kendisi sandın. Doğrusu: 125 endeks değeridir, yüzde DEĞİŞİM bundan 100 çıkarılarak bulunur ve %25\u0027e eşittir."},"D":{"ad":"Trend Analizi Karışıklığı","metin":"trend (eğilim) analizinde baz yılın kendisi 100 kabul edilir kuralını buraya taşıyıp cari yılın baz döneme oranı yerine sabit 100 yazdın. Doğrusu: bu kural yatay analizin yüzde değişim formülüyle karıştırılmamalıdır, yatay analizde 100 sabit bir değer değildir."},"A":{"ad":"Taban Yılı Tuzağı","metin":"Cari yılı (2026) payda alıp (250.000-200.000)/250.000x100 işlemini yaptın. Doğrusu: yatay analizde baz alınan payda her zaman ESKİ (baz) dönemdir, cari dönem değil."}},"celdiriciYol":{"C":"50.000/1.000 = 50 (tutar farkını ölçeklendirmeden doğrudan yüzde sanma)","E":"250.000/200.000x100 = 125 (endeks değerini yüzde değişimle karıştırma)","D":"200.000/200.000x100 = 100 (trend analizindeki baz yıl=100 kuralını yatay analize taşıma)","A":"(250.000-200.000)/250.000x100 = 20 (baz dönem olarak cari yılı alma hatası)"},"hap":"Yatay analizde yüzde değişimin paydası her zaman BAZ (eski) dönem tutarıdır; bu değer sıfır ya da negatifse yüzde değişim hesaplanamaz.","teshis":{"C":{"gercek":"Tutar farkı yalnızca ara adımdır; yüzde değişim elde etmek için mutlaka baz döneme bölünüp 100 ile çarpılması gerekir.","ayirt":"Bulduğum sayı bir TL tutarı mı yoksa oranlanmış bir yüzde mi?","paragraf":"TEORİ - Yatay analiz kuralları","yanilgi":"Tutar farkını hesapladıktan sonra bunun otomatik olarak yüzde değişim olduğunu düşünüyorsun."},"E":{"gercek":"Endeks (cari/baz x100) ile yüzde değişim farklı kavramlardır; yüzde değişim endeksten 100 çıkarılarak elde edilir (125-100=25).","ayirt":"Bulduğum yüzde, dönemler arası ORAN mı yoksa aradaki DEĞİŞİM mi?","paragraf":"TEORİ - Yatay analiz kuralları","yanilgi":"Cari dönemin baz döneme oranını (endeks) doğrudan yüzde değişim olarak okuyorsun."},"A":{"gercek":"Yatay analizde payda daima BAZ (eski) dönem tutarıdır; cari dönem yalnızca payda çıkarma işleminde pay tarafında yer alır.","ayirt":"Bölme işleminde paydaya yazdığım tutar zaman olarak daha ESKİ mi?","paragraf":"TEORİ - Yatay analiz kuralları","yanilgi":"Yüzde değişim formülünde hangi dönemin payda olacağını cari-baz ayrımına dikkat etmeden karıştırıyorsun."},"D":{"gercek":"Baz yılın 100 kabul edilmesi yalnızca TREND (eğilim) analizine özgüdür; yatay analizde yüzde değişim doğrudan formülle hesaplanır.","ayirt":"Şu an tek bir baz yıla endekslenen uzun bir seri mi inceliyorum, yoksa iki dönemi mi karşılaştırıyorum?","paragraf":"TEORİ - Mali tablolar analizinde yatay, dikey ve trend analizi kuralları","yanilgi":"Trend analizindeki \u0027baz yıl 100 kabul edilir\u0027 kuralını her karşılaştırma tekniğine uygulanabilir sanıyorsun."},"B":{"gercek":"Yüzde Değişim = (Cari Dönem - Baz Dönem) / Baz Dönem x 100; baz dönem her zaman en eski dönemdir.","ayirt":"Farkı böldüğüm tutar, karşılaştırmanın başlangıç (baz) yılına mı ait?","paragraf":"TEORİ - Yatay analiz kuralları","yanilgi":"Bu şıkkı eleyen öğrenci formülü ezberlemiş ama hangi tutarın pay, hangisinin payda olduğunu netleştirmemiştir."}},"verilen":[[4,1],[5,1],[1,1],[2,1]],"donem":8,"hesaplar":{"100":{"ad":"Kasa","tanim":"Bu hesap, işletmenin elinde bulunan ulusal ve yabancı paraların TL. karşılığının izlenmesi için kullanılır. İşleyişi : Tahsil olunan para tutarları borç, ödemeler ve bankaya yatırılan para tutarları alacak kaydedilir. Hesap daima borç bakiyesi verir veya sıfır olur. Hiçbir şekilde alacak bakiyesi vermez."}}},{"capa":{"kaynak":"SGS 2026/1 Soru 125"},"kural":"Türk Borçlar Kanununa göre kabul edildiğine ilişkin kayıtlar hükmü tek başına genel işlem koşulu olmaktan çıkarmaz; ayrıca işin özelliğine yabancı hükümler yazılmamış sayılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 125","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Genel işlem koşulu sorularında \u0027tek başına\u0027 ibaresi geçen fıkrayı mutlak bir kural gibi okuma, kanunun bilerek bıraktığı sınırı gözden kaçırma.","konu":"genel işlem koşulları","tablo":{"satirlar":[["A) Tartışılarak kabul edildiğine ilişkin kayıt, hükmü tek b…","m.20 f.2-3","doğru ifade"],["B) Kabul kaydı bulunduğundan, hükmün işin özelliğine yabanc…","m.20 f.3","YANLIŞ ifade"],["C) İşletmenin diğer sözleşmelerinin metinleri özdeş olmadığ…","m.20 f.2","YANLIŞ ifade"],["D) Hükmün sözleşme metninde değil ekinde yer alması hâlinde…","m.20 f.1","YANLIŞ ifade"],["E) Kabul kaydı kanunda öngörülen tek geçerlilik şartı olduğ…","m.20 f.2-3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşletmenin diğer sözleşmelerinin metinleri özdeş olmadığından, bu hüküm zaten genel işlem koşulu sayılmaz ve yazılmamışlık hükmü uygulanmaz.","E":"Kabul kaydı kanunda öngörülen tek geçerlilik şartı olduğundan, bu kayıt varken yazılmamışlık hükmü hiçbir şekilde uygulanamaz.","A":"Tartışılarak kabul edildiğine ilişkin kayıt, hükmü tek başına genel işlem koşulu olmaktan çıkarmadığından, işin özelliğine yabancı olan bu hüküm yazılmamış sayılır.","D":"Hükmün sözleşme metninde değil ekinde yer alması hâlinde, kabul kaydıyla birlikte nitelendirme değişir ve hüküm yazılmamış sayılmaz.","B":"Kabul kaydı bulunduğundan, hükmün işin özelliğine yabancı olması sonucu değiştirmez ve hüküm geçerli kabul edilir."},"kaynak":{"alinti":"II. Kapsamı 1. Yazılmamış sayılma","liste":[{"ad":"TBK (6098 s.K.) m.20","metin":"MADDE 20- Genel işlem koşulları, bir sözleşme yapılırken düzenleyenin, ileride çok sayıdaki benzer sözleşmede kullanmak amacıyla, önceden, tek başına hazırlayarak karşı tarafa sunduğu sözleşme hükümleridir. Bu koşulların, sözleşme metninde veya ekinde yer alması, kapsamı, yazı türü ve şekli, nitelendirmede önem taşımaz. Aynı amaçla düzenlenen sözleşmelerin metinlerinin özdeş olmaması, bu sözleşmelerin içerdiği hükümlerin, genel işlem koşulu sayılmasını engellemez. Genel işlem koşulları içeren sözleşmeye veya ayrı bir sözleşmeye konulan bu koşulların her birinin tartışılarak kabul edildiğine ilişkin kayıtlar, tek başına, onları genel işlem koşulu olmaktan çıkarmaz. Genel işlem koşullarıyla ilgili hükümler, sundukları hizmetleri kanun veya yetkili makamlar tarafından verilen izinle yürütmekte olan kişi ve kuruluşların hazırladıkları sözleşmelere de, niteliklerine bakılmaksızın uygulanır. II. Kapsamı 1. Yazılmamış sayılma"},{"ad":"TBK (6098 s.K.) m.200","metin":"MADDE 200- Dış üstlenme sözleşmesi hükümsüz hâle gelirse, iyiniyetli üçüncü kişilerin hakları saklı kalmak üzere, eski borç bütün bağlı borçlarıyla birlikte varlığını sürdürür. Bundan başka, borcu üstlenen üstlenme sözleşmesinin hükümsüz hâle gelmesinde ve alacaklının zarara uğramasında kendisine bir kusur yüklenemeyeceğini ispat etmedikçe alacaklı, önceden sağlanmış güvenceyi yitirmesi yüzünden veya başka herhangi bir sebeple uğradığı zararın giderilmesini üstlenenden isteyebilir. E. Borca katılma"}],"hakem":"Kaynak metinde TBK m.20, tartışılarak kabul edildiğine ilişkin kayıtların tek başına genel işlem koşulu olmaktan çıkarmadığını açıkça belirtmektedir; hükmün işin özelliğine yabancı olması halinde yazılmamış sayılma kuralı ise m.20\u0027nin \u0027II. Kapsamı 1. Yazılmamış sayılma\u0027 bölümünde düzenlenmiştir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":9,"ornekler":[],"donemler":["2026/1","2023/2","2022/2","2021/3","2019/2","2018/1","2017/1","2016/1","2015/2"]},"oyun":null,"tip":"teori","soru":"Bir işletme, standart sözleşmeye koyduğu bir hükmün ayrı ayrı tartışılarak kabul edildiğine dair kayıt düşmüştür. Hüküm, sözleşmenin niteliğine ve işin özelliğine yabancıdır. Türk Borçlar Kanunu\u0027na göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-ticaret-cokzor/kp-01","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.20","dogru":"A","oyunBonus":null,"ders":"Ticaret Hukuku|Ticaret ve Borclar
