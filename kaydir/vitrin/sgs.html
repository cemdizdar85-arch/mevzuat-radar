fazlalık miktarı","8"],["HESAP","-"],["Kökler toplamı (x1+x2)","2k + 2"],["Kökler çarpımı (x1·x2)","K² + k − 2"],["Kurulan denklem (çarpım = toplam + 8)","K² + k − 2 = 2k + 10"],["Sadeleştirilmiş k denklemi","K² − k − 12 = 0"],["Çarpanlara ayırma","(k − 4)(k + 3) = 0 → k = 4 veya k = −3"],["Δx = 4k + 12 kontrolü (k=4)","Δx = 28 \u003e 0 → GEÇERLİ"],["Δx = 4k + 12 kontrolü (k=−3)","Δx = 0 → GEÇERSİZ (çakışık kök)"],["Sonuç","K = 4"]],"basliklar":["Adım","İfade / Sonuç"]},"siklar":{"C":"3","E":"6","A":"-3","D":"4","B":"-2"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Çarpan işaretleri karıştırılıp (k−3)(k+4) yazılırsa k²+k−12 elde edilir; orta terim −k olması gerektiğinden bu çarpanlama yanlıştır.","E":"k = 6, yanlış çarpanlama (k−6)(k+2) = 0\u0027dan elde edilir; bu ifade asıl k²−k−12 denklemini sağlamaz.","A":"k²−k−12 = 0 denkleminin her iki kökü bulunur ama k = −3 için diskriminant 4(−3)+12 = 0 olur, kökler çakışık hale gelir; soru iki farklı kök istediğinden bu değer elenir.","B":"k²−k−12 ifadesi yanlış çarpanlara ayrılırsa (k−6)(k+2) yazılır; ancak bu açıldığında k²−4k−12 verir, orijinal denklemle uyuşmaz."},"dogru":"Vieta kuralından kökler toplamı 2k+2, çarpımı k²+k−2\u0027dir. Çarpım toplamdan 8 fazla olduğu için k²+k−2 = (2k+2)+8 yazılır, bu k²−k−12 = 0 verir. Çarpanlara ayırınca k = 4 ya da k = −3 bulunur; ama k = −3 için diskriminant sıfır olup kökler çakışır, iki farklı kök şartını sağlamaz. Doğru cevap k = 4\u0027tür.","sinav":"İkinci dereceden denklemde Vieta formülleri uygulanarak kökler toplamı −b/a, kökler çarpımı c/a ve diskriminant b² − 4ac kullanılır; iki farklı gerçel kök için diskriminant pozitif olmalıdır.","kavramlar":[{"kaynak":"TEORI","tanim":"İkinci derece denklemde Δ = b² − 4ac değeridir; Δ \u003e 0 ise iki farklı gerçel kök, Δ = 0 ise çakışık kök, Δ \u003c 0 ise gerçel kök yoktur.","ad":"Diskriminant"},{"kaynak":"TEORI","tanim":"ax² + bx + c = 0 denkleminde kökler toplamı x₁ + x₂ = −b/a, kökler çarpımı x₁·x₂ = c/a\u0027dır.","ad":"Vieta formülleri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"tablo":{"basliklar":["Adım","İfade / Sonuç"],"satirlar":[["Kökler toplamı (x1+x2)","2m + 3"],["Kökler çarpımı (x1·x2)","m² − 5"],["Kurulan denklem (çarpım = toplam + 7)","m² − 5 = 2m + 10"],["Sadeleştirilmiş m denklemi","m² − 2m − 15 = 0"],["Çarpanlara ayırma","(m − 5)(m + 3) = 0 → m = 5 veya m = −3"],["Δx = 12m + 29 kontrolü (m=5)","Δx = 89 \u003e 0 → GEÇERLİ"],["Δx = 12m + 29 kontrolü (m=−3)","Δx = −7 \u003c 0 → GEÇERSİZ (reel kök yok)"],["Sonuç","m = 5"]]},"tur":"tablo","soru":"x² − (2m + 3)x + (m² − 5) = 0 denkleminin iki farklı reel kökü x₁, x₂\u0027dir. Köklerin çarpımı, köklerin toplamından 7 fazladır. Buna göre m kaçtır?","verilen":[[0,1],[2,1]],"hedef":"Tabloyu doldur ve m\u0027nin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"x² − (2k + 2)x + (k² + k − 2) = 0 denkleminin iki farklı reel kökü x₁, x₂\u0027dir. Köklerin çarpımı, köklerin toplamından 8 fazladır. Buna göre k kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-01","verilenler":[{"deger":"2","anlam":"Denklemdeki −(2k+2)x teriminin katsayısını oluşturur; kökler toplamı x1+x2=2k+2\u0027dir.","ad":"x katsayısındaki sabit çarpan"},{"deger":"−2","anlam":"Kökler çarpımı ifadesindeki sabit terimdir; x1·x2=k²+k−2 olarak kullanılır.","ad":"sabit terimdeki fark"},{"deger":"8","anlam":"Çarpımın toplamdan ne kadar fazla olduğunu belirtir; k²+k−2=(2k+2)+8 denklemini kurmakta kullanılır.","ad":"fazlalık miktarı"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - İkinci Derece Denklemler: Vieta bağıntıları (x1+x2=−b/a, x1·x2=c/a) ve diskriminant kuralı (Δ=b²−4ac; Δ\u003e0 iki farklı gerçel kök)","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: x² − (2k+2)x + (k²+k−2) = 0 (soruda verilen); çarpım = toplam + 8 şartı (soruda verilen); \u0027iki farklı reel kök\u0027 ayırt edici kelime","anlatim":"Soru bize denklemi ve bir şart veriyor: kökler çarpımı, kökler toplamından 8 fazla. Ayrıca iki farklı reel kök isteniyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kökler toplamı = x1 + x2 = 2k + 2 (soruda verilen katsayıdan)","anlatim":"Vieta formülüyle kökler toplamı katsayıdan direkt okunur. Burada x1+x2, x\u0027in katsayısının eksi işaretlisidir.","doldur":[[5,1],[6,1]]},{"formul":"Kökler çarpımı = x1 × x2 = k² + k − 2 (soruda verilen katsayıdan)","anlatim":"Vieta\u0027nın ikinci kuralı kökler çarpımını sabit terimden verir. Bu da denklemin sabit teriminin kendisidir.","doldur":[]},{"formul":"Kurulan denklem = çarpım = toplam + 8 = (k² + k − 2) (3. adımda bulduk) = (2k + 2) (2. adımda bulduk) + 8 = k² + k − 2 = 2k + 10","anlatim":"Şimdi biz soruda verilen şartı kuruyoruz: çarpım, toplamdan 8 fazla. Bu bize k için bir denklem verir.","doldur":[[7,1]]},{"formul":"Sadeleştirilmiş denklem = k² + k − 2 − 2k − 10 = 0 (4. adımda bulduk) → k² − k − 12 = 0","anlatim":"Şimdi biz denklemi sadeleştiriyoruz, tüm terimleri bir tarafa topluyoruz. Böylece k için çözülebilir ikinci derece denklem çıkar.","doldur":[[8,1]]},{"formul":"Çarpanlara ayırma = k² − k − 12 (5. adımda bulduk) = (k − 4)(k + 3) = 0 → k = 4 veya k = −3","anlatim":"Şimdi biz bu ikinci derece denklemi çarpanlarına ayırıyoruz. Çarpımları −12, toplamları −1 olan iki sayı −4 ve 3\u0027tür.","doldur":[[9,1]]},{"formul":"Δx = 4k + 12 → k = 4 (6. adımda bulduk) için Δx = 4 × 4 + 12 = 28 \u003e 0 → GEÇERLİ","anlatim":"Denklemin iki farklı reel kökü olması için diskriminant sıfırdan büyük olmalı. k=4 değerini bu şarta koyup kontrol ediyoruz.","doldur":[]},{"formul":"Δx = 4k + 12 → k = −3 (6. adımda bulduk) için Δx = 4 × (−3) + 12 = 0 → GEÇERSİZ (çakışık kök)","anlatim":"Aynı diskriminant şartını k=−3 için de deniyoruz. Sıfır çıkarsa kökler çakışık olur, bu da \u0027iki farklı reel kök\u0027 şartını bozar.","doldur":[]},{"formul":"Sonuç = k = 4 (6. adımda bulduk)","anlatim":"Diskriminant testinden geçen tek değer k=4 olduğu için sonuç budur. k=−3 elendiği için tabloya girmez.","doldur":[[12,1]]},{"formul":"Ters durum: çarpım = toplam − 8 → k² − k + 4 = 0","anlatim":"Ters durumda: soru \u0027çarpım, toplamdan 8 az\u0027 deseydi denklem k² + k − 2 = 2k + 2 − 8 olurdu. O zaman katsayılar değişir, kökler farklı çıkar.","doldur":[]},{"formul":"Yanlış yol: Δx kontrolü atlanıp k = −3 de kabul edilir → k = −3 (HATALI, A şıkkı) → doğrusu k = 4 (6. adımda bulduk), k = −3 ise Δx = 0 olduğu için elenir","anlatim":"En sık hata: öğrenci k=−3\u0027ü de geçerli sanıp iki cevap yazar. Oysa diskriminant kontrolü yapılmazsa çakışık kök veren değer elenmez.","doldur":[]}],"anahtar":[{"ornek":"denklemde","kok":"denkle"},{"ornek":"kökler","kok":"kökler"},{"ornek":"farklı","kok":"farklı"},{"ornek":"çarpımı","kok":"çarpım"},{"ornek":"toplamından","kok":"toplam"},{"ornek":"diskriminant","kok":"diskri"}],"konuGiris":{"harita":"Ne zaman test edilir: ikinci derece denklemde köklerin toplamı ve çarpımı arasında bir ilişki verildiğinde. Nasıl ölçülür: Vieta formülleri (x1+x2=-b/a, x1*x2=c/a) doğru katsayılarla kurulup denklem çözülerek. Nasıl kaydedilir: bulunan k değeri, diskriminant pozitiflik şartına da uyup uymadığı kontrol edilerek yazılır.","desen":"Soru, k\u0027yı içeren katsayılarla Vieta ilişkisini kurdurup denklem çözmeyi hedefler; tuzak, toplam ve çarpım formüllerindeki eksi işaretinin unutulmasıdır. Bazı öğrenciler diskriminant şartını (iki farklı reel kök) kontrol etmeyi atlar ve geçersiz k değerini de cevap sanır. Bu soru Vieta formülleri ve diskriminant şartı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"b²-4ac ifadesi; kökün gerçel ve farklı olup olmadığını belirler.","ad":"Diskriminant (Δ)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"İki kökün birbirine eklenmiş hali, -b/a\u0027ya eşittir.","ad":"Kökler toplamı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"İki kökün çarpımı, c/a\u0027ya eşittir.","ad":"Kökler çarpımı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Denklemdeki x², x ve sabit terimin önündeki sayılar.","ad":"Katsayı (a,b,c)","kim":"kanun sabitler"}],"sinavda":"Verilen ikinci derece denklemde köklerin çarpımı ile toplamı arasındaki ilişkiden k değeri istenir.","panel_ornek":"Bir markette 2 poşet elma ile 3 poşet armut toplam 20 lira, poşet sayıları ve fiyat ilişkisi bilindiğinde tek poşetin fiyatı bulunabilir. Burada da bilinmeyeni izole edip küçük bir eşitlik kurarsın. Sonuçta tek bir sayıya ulaşırsın.","ornek":"Bir markette 2 poşet elma ile 3 poşet armut toplam 20 lira, poşet sayıları ve fiyat ilişkisi bilindiğinde tek poşetin fiyatı bulunabilir. Burada da bilinmeyeni izole edip küçük bir eşitlik kurarsın. Sonuçta tek bir sayıya ulaşırsın.","yontemler":"Vieta formülleri ile toplam ve çarpım k\u0027ya bağlı yazılıp aralarındaki ilişki eşitlenir; bulunan k, diskriminant pozitiflik şartıyla test edilir.","nedir":"Denklem çözme, bilinmeyen sayının değerini bulma işidir. Sınav, kök toplamı-çarpımı (Vieta) ilişkisini doğru kurup denklemi çözebilme becerini ölçer."},"olay":"k²+k−2=(2k+2)+8 → k²−k−12=0 → (k−4)(k+3)=0 → k=4 veya k=−3; k=−3 için Δx=0 (çakışık kök) olduğundan elenir, k=4 için Δx=28\u003e0 geçerlidir.","tuzak":{"C":{"ad":"İşaret Karıştırma Tuzağı","metin":"(k−4)(k+3) çarpanlarının işaretini karıştırıp (k−3)(k+4) yazarsın; bu k²+k−12 verir, orta terim uymaz, k=3 yanlış çıkar. Doğrusu: orta terim −k olduğundan çarpanlar (k−4) ve (k+3)\u0027tür."},"E":{"ad":"Yanlış Çarpanlama Tuzağı","metin":"aynı hatalı (k−6)(k+2)=0 çarpanlamasından bu kez öteki kökü, k=6\u0027yı seçersin; bu çarpanlama zaten orijinal k²−k−12\u0027yi vermez. Doğrusu: gerçek çarpanlar (k−4)(k+3)\u0027tür, k=4 doğru köktür."},"A":{"ad":"Çakışık Kök Tuzağı","metin":"k²−k−12=0 denklemini çözüp k=−3\u0027ü de kabul edersin, ama bu k için Δx=0 olur; kökler çakışıktır, \u0027iki farklı reel kök\u0027 şartını sağlamaz. Doğrusu: Δx\u003e0 kontrolü yapılmadan k=−3 elenmelidir."},"B":{"ad":"Yanlış Çarpanlama Tuzağı","metin":"k²−k−12=0 ifadesini orta terimi denetlemeden (k−6)(k+2) diye çarpanlarına ayırıp k=−2 bulursun; bu çarpım açıldığında k²−4k−12 verir, aslındaki denklemi karşılamaz. Doğrusu: doğru çarpanlama (k−4)(k+3)=0\u0027dır."}},"celdiriciYol":{"C":"k²−k−12=0 çarpanlarının işareti karıştırılıp (k−3)(k+4)=k²+k−12 yazılır → k=3 (işaret karıştırma)","E":"(k−6)(k+2)=k²−4k−12 yanlış çarpanlamasının öteki kökü alınır → k=6 (yanlış çarpanlama)","A":"k²−k−12=0 → (k−4)(k+3)=0 kökleri k=4 ve k=−3; Δx=4k+12 kontrolü atlanıp k=−3 de kabul edilir = -3 (çakışık kök gözden kaçırılır)","B":"k²−k−12=0 yanlış çarpanlanır: (k−6)(k+2)=k²−4k−12 (orta terim denetlenmez) → k=-2 (yanlış çarpanlama)"},"hap":"İkinci derece denklemde parametre bulunurken çıkan her kök için, sorunun istediği \u0027farklı reel kök\u0027 şartını Δ üzerinden mutlaka tekrar sına.","teshis":{"C":{"gercek":"(k−a)(k−b)=k²−(a+b)k+ab formunda, toplam=−(−1)=1 ve çarpım=−12 olacak şekilde a,b seçilmelidir; bu yalnızca 4 ve −3 ile sağlanır.","ayirt":"Seçtiğim çarpanların toplamı, denklemdeki orta terimin işaretiyle uyuşuyor mu?","paragraf":"Vieta bağıntıları (toplam/çarpım)","yanilgi":"Çarpanların işaretlerini toplam ve çarpım kurallarına bakmadan rastgele dağıtabileceğini sanıyorsun."},"E":{"gercek":"(k−6)(k+2) açılımı k²−4k−12 verir, hedef denklem k²−k−12 ile örtüşmez; dolayısıyla bu çarpanlamadan çıkan hiçbir kök geçerli değildir.","ayirt":"Çarpanlarımı açtığımda orta terim gerçekten −1k mi çıkıyor?","paragraf":"Çarpanlara ayırma adımı","yanilgi":"Yanlış kurduğun bir çarpanlamadan çıkan iki kökü de doğru sanıp aralarından rastgele birini cevap yapabileceğini düşünüyorsun."},"A":{"gercek":"Δ=0 durumunda kökler çakışıktır (tek bir reel kök tekrar eder), bu \u0027iki farklı reel kök\u0027 ifadesini sağlamaz; TESMER SGS Matematik-İstatistik Ders Notu diskriminant kuralı Δ\u003e0 iki farklı gerçel kök şartını koyar.","ayirt":"Bulduğum k değeri için Δx=4k+12\u0027yi hesapladım mı, Δx\u003e0 mı çıktı?","paragraf":"Diskriminant kuralı","yanilgi":"k için bulduğun her cebirsel kökü, denklemin \u0027iki farklı reel kök\u0027 şartını kontrol etmeden geçerli sayıyorsun."},"D":{"gercek":"x1+x2=−b/a=2k+2, x1·x2=c/a=k²+k−2 kuralı ile kurulan k²−k−12=0 denkleminin iki kökünden yalnız Δx\u003e0 şartını sağlayanı kabul edilir; bu da k=4\u0027tür.","ayirt":"Vieta\u0027dan bulduğum k adaylarının her birini orijinal denklemin diskriminant şartına geri koydum mu?","paragraf":"Vieta bağıntıları + Diskriminant kuralı","yanilgi":"Bu şıkkı eleyen öğrenci, Vieta bağıntısını kurup denklemi çözdükten sonra iki adaydan hangisinin gerçekten geçerli olduğunu sınamayı gereksiz sanır."},"B":{"gercek":"Çarpanlara ayırma, açılımın orta terimi de tutturması gerekir; (k−6)(k+2)=k²−4k−12 olup hedef k²−k−12 ile aynı değildir.","ayirt":"Bulduğum çarpanları açıp orijinal denklemi verip vermediğini kontrol ettim mi?","paragraf":"Çarpanlara ayırma adımı","yanilgi":"İkinci dereceden denklemi çarpanlarına ayırırken orta terimi (katsayıyı) tekrar kontrol etmeden \u0027göz kararı\u0027 çarpanlama yapabileceğini düşünüyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":7,"hesaplar":{}},{"capa":null,"kural":"bağlaç olan \u0027de/da\u0027, kendisinden önceki sözcük sert ünsüzle bitse bile sertleşip \u0027te/ta\u0027 biçimine dönüşmez; bu ses değişimi yalnız bulunma hâli ekine özgüdür (Mehmet\u0027te).","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 2","sonDonem":3,"sim":null,"hakem":"","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şüpheli sözcüğü cümleden çıkar: anlam bozulmuyorsa bağlaçtır ve ayrı yazılır, bozuluyorsa hâl ekidir ve bitişik yazılır.","konu":"yazım kuralları","tablo":{"satirlar":[["A) Öğretmen de bizim gibi çok üzüldü.","TDK Yazım Kuralları - \u0027de\u0027 bağlacı","YANLIŞ ifade"],["B) Sabahki toplantıya herkes geldi.","TDK Yazım Kuralları - \u0027-ki\u0027 eki","YANLIŞ ifade"],["C) Bu çanta senin mi, benim mi?","TDK Yazım Kuralları - \u0027mi\u0027 soru eki","YANLIŞ ifade"],["D) Yarın Mehmet te bizimle aynı saatte buluşacak.","TDK Yazım Kuralları - \u0027de/da\u0027 bağlacının sertleşmezliği","doğru ifade"],["E) Kardeşim, sınavda çok heyecanlandığını söyledi.","TDK Yazım Kuralları - bulunma hâli eki","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Bu çanta senin mi, benim mi?","E":"Kardeşim, sınavda çok heyecanlandığını söyledi.","A":"Öğretmen de bizim gibi çok üzüldü.","D":"Yarın Mehmet te bizimle aynı saatte buluşacak.","B":"Sabahki toplantıya herkes geldi."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Soru eki \u0027mi\u0027nin bitişik yazılması gerektiği düşünülebilir. Fakat \u0027mi\u0027 her zaman ayrı yazılır; kendisinden sonraki ekler bitişir ve cümle kurala uygundur.","E":"Bulunma hâli eki \u0027-da\u0027 ile bağlaç \u0027da\u0027 karıştırılabilir. \u0027sınavda\u0027 sözcüğündeki \u0027-da\u0027 ek olup bitişik yazılmıştır; yazım kurala uygundur.","A":"Bağlaç \u0027de\u0027nin bulunma hâli eki \u0027-de\u0027 ile karıştırılabilir. Ancak bağlaç olan \u0027de\u0027 cümleden çıkarılabilir olduğu için ayrı yazılır ve yazım kurala uygundur.","B":"\u0027-ki\u0027 eki bağlaç \u0027ki\u0027 ile karıştırılabilir. Burada \u0027-ki\u0027 sıfat yapan ek olup bitişik yazılmalıdır; \u0027sabahki\u0027 doğru yazılmıştır ve kurala uygundur."},"dogru":"D şıkkında \u0027Mehmet te\u0027 yazılmış ama buradaki sözcük bağlaçtır. Bağlaç \u0027de/da\u0027, kendisinden önceki sözcük sert ünsüzle bitse bile \u0027te/ta\u0027 şekline dönüşmez, her zaman ayrı yazılır. Doğrusu \u0027Yarın Mehmet de bizimle aynı saatte buluşacak.\u0027 olmalıydı.","sinav":"Türkçe yazım kurallarına göre bağlaç \u0027de/da\u0027 bulunma hâli ekinin aksine hiçbir koşulda sertleşip \u0027te/ta\u0027 biçimine dönüşmez.","kavramlar":[{"kaynak":"TEORI","tanim":"İsimlere eklenen ve sözcüğün hangi yerde olduğunu belirten ek. Cümleden çıkarılamaz ve sözcüğe bitişik yazılır.","ad":"Bulunma hâli eki \u0027-de/-da/-te/-ta\u0027"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":16,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Aşağıdaki cümlelerin hangisinde yazım kuralına aykırı bir kullanım vardır?","kayitBaslik":"","id":"sgs-t3-turkce-zor/kp-01","verilenler":[],"dayanak":"TDK Yazım Kuralları - \u0027de/da\u0027 bağlacı ve bulunma hâli eki ayrımı","dogru":"D","oyunBonus":null,"ders":"Türkçe","adimlar":[{"formul":"Olay: Fabrika müdürü akşam vardiyasına not yazıyor: \u0027İşçiler ne zaman gelirse gelsin, nöbetçi mühendis Ahmet te o saatte orada olsun.\u0027 Yazıyı okuyan katıp \u0027burada bir hata var\u0027 diyor.","anlatim":"Katıp haklı, çünkü \u0027te\u0027 burada bağlaç görevinde kullanılmış. \u0027Ahmet\u0027 sert ünsüzle bitse de bağlaç olan \u0027de/da\u0027 hiçbir zaman sertleşip \u0027te/ta\u0027 olmaz. Bu notta \u0027Ahmet de\u0027 yazılmalıymış.","doldur":[]},{"formul":"Ne yapacağız: beş cümledeki \u0027de/da/ki/mi\u0027 benzeri ekleri tek tek \u0027çıkarınca anlam bozulur mu\u0027 testinden geçireceğiz. Bozulmuyorsa bağlaçtır, ayrı yazılır ve sertleşmez. Bozuluyorsa ek olabilir, bitişik yazılır ve sertleşebilir.","anlatim":"Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TDK Yazım Kuralları - \u0027de\u0027 bağlacı","karar":"yanlış","anlatim":"\u0027De\u0027yi çıkarınca cümle hâlâ anlamlı kalıyor, o yüzden bu bir bağlaç. Bağlaç ayrı yazılır ve burada doğru yazılmış. Yazım kuralına aykırılık yok.","formul":"Şık A: \u0027Öğretmen de bizim gibi çok üzüldü\u0027 cümlesinde \u0027de\u0027yi çıkarsan anlam bozulur mu, sence bu doğru yazılmış mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TDK Yazım Kuralları - \u0027-ki\u0027 eki","karar":"yanlış","anlatim":"Buradaki \u0027-ki\u0027 sıfat yapan ektir, bağımsız bağlaç değildir. Sıfat yapan \u0027-ki\u0027 bitişik yazılır, tıpkı \u0027benimki\u0027 gibi. Bu cümlede kural ihlali yok.","formul":"Şık B: \u0027Sabahki toplantıya herkes geldi\u0027 cümlesinde \u0027sabahki\u0027 bitişik yazılmış, bu sence doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TDK Yazım Kuralları - \u0027mi\u0027 soru eki","karar":"yanlış","anlatim":"\u0027Mi\u0027 soru eki her zaman ayrı yazılır, burada da öyle yapılmış. Yanına gelecek kişi ekleri olsaydı onlar bitişirdi ama burada yok. Bu cümlede hata yok.","formul":"Şık C: \u0027Bu çanta senin mi, benim mi?\u0027 cümlesinde soru eki \u0027mi\u0027 ayrı yazılmış, bu doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TDK Yazım Kuralları - \u0027de/da\u0027 bağlacının sertleşmezliği","karar":"doğru","anlatim":"Çıkarınca \u0027Yarın Mehmet bizimle aynı saatte buluşacak\u0027 hâlâ anlamlı, yani bu bir bağlaç. Bağlaç olan \u0027de/da\u0027 sert ünsüzden sonra bile \u0027te/ta\u0027 olmaz, doğrusu \u0027Mehmet de\u0027 olmalıydı. Bu cümlede yazım kuralı çiğnenmiş.","formul":"Şık D: fabrika müdürünün notundaki gibi, \u0027Yarın Mehmet te bizimle aynı saatte buluşacak\u0027 cümlesindeki \u0027te\u0027yi çıkarsan anlam bozulur mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TDK Yazım Kuralları - bulunma hâli eki","karar":"yanlış","anlatim":"Çıkarınca \u0027Kardeşim, sınav çok heyecanlandığını söyledi\u0027 olur, cümle bozulur; bu yüzden \u0027-da\u0027 hâl ekidir, bağlaç değil. Bulunma hâli eki bitişik yazılır ve sertleşebilir, burada doğru kullanılmış. Kural ihlali yok.","formul":"Şık E: \u0027Kardeşim, sınavda çok heyecanlandığını söyledi\u0027 cümlesinde \u0027sınavda\u0027daki \u0027-da\u0027yı çıkarsan cümle anlamlı kalır mı?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Tek yanlış olan D, çünkü bağlaç \u0027de\u0027 orada \u0027te\u0027ye sertleşmiş ki bu asla olmaz. Kendine hep şunu sor: bu sözcüğü çıkarsam cümle anlamsız mı olur, olmuyorsa bağlaçtır ve sertleşemez.","doldur":[]}],"anahtar":[{"ornek":"bağlaç","kok":"bağlaç"},{"ornek":"sertleşmez","kok":"sertle"},{"ornek":"burada","kok":"burada"},{"ornek":"çıkarılabilir","kok":"çıkarı"},{"ornek":"bitişik","kok":"bitişi"},{"ornek":"cümleden","kok":"cümled"}],"konuGiris":{"harita":"Ne zaman test edilir: dört-beş seçenekli cümlelerden hangisinde yazım kuralı ihlali olduğu sorulduğunda. Nasıl ölçülür: \u0027de/da\u0027, \u0027ki\u0027, \u0027mi\u0027 gibi ek-bağlaç ayrımını ve büyük harf kurallarını cümlede tanıyabilme ile ölçülür. Nasıl kaydedilir: doğru seçenek, kuralı ihlal eden tek cümle olarak işaretlenir.","desen":"Sınav en çok \u0027de/da\u0027 bağlacı ile bulunma hâli ekini karıştırtarak sorar, ayrıca \u0027ki\u0027 ve \u0027mi\u0027 eklerinin yazımını da tuzaklar (TDK yazım kuralları, p. genel). Seçeneklerin çoğu doğru yazılmıştır, yalnız biri kuralı bozar ve dikkatsiz gözden kolayca kaçar. Bu soru \u0027de/da\u0027 bağlacı ile hal eki ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"cümleden çıkarılabilen, her zaman ayrı yazılan ve sertleşmeyen sözcük","ad":"bağlaç \u0027de/da\u0027","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"isme bitişik yazılan, yer-zaman bildiren ek, cümleden çıkarılamaz","ad":"bulunma hâli eki \u0027-de/-da\u0027","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"ilgi zamiri ya da sıfat yapan bitişik ek, bağlaç \u0027ki\u0027 ise ayrı yazılır","ad":"\u0027-ki\u0027 eki","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"kişi, kurum, eser gibi özel adların baş harfinin büyük yazılması kuralı","ad":"özel ad büyük harfi","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Dört-beş cümle verilir, bunlardan yazım kuralına aykırı olan tek cümle seçilmesi istenir.","panel_ornek":"Arkadaşın sana \u00273 lira da bende kalsın\u0027 dediğinde bu \u0027da\u0027 bir bağlaçtır ve cümleden çıkarılabilir, mesela 5 kişilik bir yemek faturasını bölüşürken kimin ne kadar ödediğini böyle ayırt edersin. Aynı sözcük eğer \u0027evde kalsın\u0027 gibi bir yerde bulunmayı gösteriyorsa bitişik yazılır.","ornek":"Arkadaşın sana \u00273 lira da bende kalsın\u0027 dediğinde bu \u0027da\u0027 bir bağlaçtır ve cümleden çıkarılabilir, mesela 5 kişilik bir yemek faturasını bölüşürken kimin ne kadar ödediğini böyle ayırt edersin. Aynı sözcük eğer \u0027evde kalsın\u0027 gibi bir yerde bulunmayı gösteriyorsa bitişik yazılır.","yontemler":"Şüpheli \u0027de/da\u0027yı cümleden çıkarıp anlam bozuluyor mu diye kontrol et; bozulmuyorsa bağlaçtır ve ayrı yazılır, bozuluyorsa ek olup bitişik yazılır.","nedir":"Bu konu Türkçede büyük harf, bitişik-ayrı yazım ve ek-bağlaç ayrımlarını doğru uygulamayı kapsar. Sınav, hangi cümlede bu kurallardan birinin çiğnendiğini fark etmeni ölçer."},"olay":"","tuzak":{"C":{"ad":"Ek Kaynaşması Tuzağı","metin":"soru eki \u0027mi\u0027nin kendisinden önceki sözcükle bitişmesi gerektiğini düşünürsün. Doğrusu: \u0027mi\u0027 daima ayrı yazılır, yalnız kendisinden SONRA gelen ekler bitişir; cümle kuralına uygundur."},"E":{"ad":"Ayırma Yanılgısı Tuzağı","metin":"\u0027sınavda\u0027 sözcüğünü bağlaç \u0027da\u0027 ile karıştırıp \u0027sınav da\u0027 biçiminde ayrı yazılması gerektiğini düşünürsün. Doğrusu: burada \u0027sınav\u0027 sözcüğüne bulunma hâli eki \u0027-da\u0027 eklenmiştir, bu ek bitişik yazılır; cümle kuralına uygundur."},"A":{"ad":"Bitişik Yazım Tuzağı","metin":"\u0027de\u0027 bağlacını bulunma hâli ekiyle karıştırıp bitişik yazılması gerektiğini düşünürsün. Doğrusu: bağlaç olan \u0027de\u0027 cümleden çıkarılabilir, bu yüzden her zaman ayrı yazılır; cümle kuralına uygundur."},"B":{"ad":"Ayrı Yazım Tuzağı","metin":"\u0027-ki\u0027 ekini bağlaç \u0027ki\u0027 ile karıştırıp ayrı yazılması gerektiğini düşünürsün. Doğrusu: burada \u0027sabah\u0027 sözcüğüne sıfat yapan \u0027-ki\u0027 eklenmiştir, bu ek bitişik yazılır; cümle kuralına uygundur."}},"celdiriciYol":{"C":"Soru eki \u0027mi\u0027, diğer ekler gibi sözcüğe bitişmesi gerektiği sanılarak bitişik yazım beklenir (ek kaynaşması hatası).","E":"Bulunma hâli eki \u0027-da\u0027, bağlaç \u0027da\u0027 ile aynı sözcük sanılarak ayrı yazım beklenir (ek/bağlaç karışıklığı).","A":"Bağlaç \u0027de\u0027nin bulunma hâli ekiyle aynı ses grubunda olduğu sanılarak bitişik yazım beklenir (kural karışıklığı).","B":"Sıfat yapan \u0027-ki\u0027 eki, bağlaç \u0027ki\u0027 ile aynı ses grubunda olduğu sanılarak ayrı yazım beklenir (ek/bağlaç karışıklığı)."},"hap":"Bağlaç olan \u0027de/da\u0027 cümleden çıkarılabilir, her zaman ayrı yazılır ve asla sertleşmez; hâl eki \u0027-de/-da\u0027 ise bitişik yazılır ve sertleşebilir.","teshis":{"C":{"gercek":"TDK yazım kuralına göre \u0027mi\u0027 soru eki daima ayrı yazılır; ondan sonra gelen kişi/zaman ekleri ise bitişik yazılır.","ayirt":"\u0027mi\u0027 ayrı mı yazılmış, kendisinden sonraki ekler ona bitişmiş mi?","paragraf":"TDK Yazım Kuralları - \u0027mi\u0027 soru eki","yanilgi":"Soru ekinin de diğer ekler gibi sözcüğe yapışması gerektiğini düşünürsün."},"E":{"gercek":"TDK yazım kuralına göre bulunma hâli eki \u0027-de/-da/-te/-ta\u0027 isme bitişik yazılır ve sertleşebilir; bağlaçtan farklı olarak cümleden çıkarılamaz.","ayirt":"Bu eki çıkarsam cümle anlamsız mı olur? Olursa hâl ekidir, bitişik yazılır.","paragraf":"TDK Yazım Kuralları - bulunma hâli eki","yanilgi":"\u0027-da\u0027 ekini gördüğünde bunun her zaman bağlaç olduğunu ve ayrı yazılması gerektiğini düşünürsün."},"A":{"gercek":"TDK yazım kuralına göre bağlaç olan \u0027de/da\u0027 cümleden çıkarıldığında anlam bozulmaz, bu yüzden her zaman ayrı yazılır.","ayirt":"Bu sözcüğü cümleden çıkarsam anlam bozulur mu?","paragraf":"TDK Yazım Kuralları - \u0027de\u0027 bağlacı","yanilgi":"\u0027de\u0027 sözcüğünü gördüğün her yerde onu ismin hâl ekiyle aynı sözcük sanıp bitişik yazılması gerektiğini düşünürsün."},"D":{"gercek":"TDK yazım kuralına göre bağlaç olan \u0027de/da\u0027, sert ünsüzle biten sözcükten sonra da sertleşmez; sertleşmiş \u0027te/ta\u0027 biçimi yalnız bulunma hâli ekinde görülür (Mehmet\u0027te gibi).","ayirt":"Bu sözcük cümleden çıkarılabiliyor mu (bağlaç) yoksa bir isme mi eklenmiş (hâl eki)?","paragraf":"TDK Yazım Kuralları - \u0027de/da\u0027 bağlacının sertleşmezliği","yanilgi":"Bu şıkkı eleyen öğrenci \u0027Mehmet\u0027 sert ünsüzle bittiği için bağlacın da \u0027te\u0027 biçimine dönüşebileceğini sanır ve cümleyi doğru zanneder."},"B":{"gercek":"TDK yazım kuralına göre sıfat yapan ya da ilgi zamiri olan \u0027-ki\u0027 eki bitişik yazılır; sadece bağlaç olan \u0027ki\u0027 ayrı yazılır.","ayirt":"Bu \u0027ki\u0027 bir sözcüğe ek olarak mı geldi, yoksa bağımsız bir bağlaç mı?","paragraf":"TDK Yazım Kuralları - \u0027-ki\u0027 eki / \u0027ki\u0027 bağlacı ayrımı","yanilgi":"\u0027-ki\u0027 harfini gördüğünde bunun her zaman bağlaç \u0027ki\u0027 olduğunu ve ayrı yazılması gerektiğini düşünürsün."}},"verilen":[],"donem":16,"hesaplar":{}},{"capa":null,"kural":"3568 sayılı Kanunun 48 inci maddesine göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında önce fiilin \u0027genel vakar ihlali\u0027 mi yoksa \u0027kanunun ayrıca saydığı özel ağır fiil\u0027 mi olduğunu ayırt et.","konu":"disiplin cezalari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Fiil","Mükellefle birlikte kasten vergi ziyaına sebebiyet verme","-"],["Kesinleşme durumu","Mahkeme kararıyla kesinleşmiş","-"],["HESAP","-","-"],["A) Uyarma","p.48/1","YANLIŞ ifade"],["B) Kınama","p.48/1","YANLIŞ ifade"],["C) Geçici olarak mesleki faaliyetten alıkoyma","p.48/2","YANLIŞ ifade"],["D) Yeminli sıfatını kaldırma","p.48/1","YANLIŞ ifade"],["E) Meslekten çıkarma","p.48/2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Geçici olarak mesleki faaliyetten alıkoyma","E":"Meslekten çıkarma","A":"Uyarma","D":"Yeminli sıfatını kaldırma","B":"Kınama"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Geçici mesleki faaliyetten alıkoyma, bağımsızlık ve tarafsızlık ihlalleri ile tasdik yetkisinin gerçeğe aykırı ilk kullanımına özgüdür. Kasten vergi ziyaına sebebiyet vermek için bu ceza değil, meslekten çıkarma uygulanır.","A":"Uyarma cezası hafif kusurlar için ilk defa uygulanır. Ancak kasten vergi ziyaına sebebiyet vermek gibi ağır fiiller için kanun doğrudan en ağır cezayı bağlamış, ilk aşama uygulamasını ortadan kaldırmıştır.","D":"Yeminli sıfatının kaldırılması yalnızca yeminli mali müşavirlerin tasdik yetkisini gerçeğe aykırı kullanmasının tekerrürüne özgü bir cezadır. Kasten vergi ziyaına sebebiyet veren tüm meslek mensuplarına meslekten çıkarma cezası verilir.","B":"Kınama cezası mesleğin vakar ve onuruna aykırı basit davranışların tekrarında kullanılır. Mükellefle kasten vergi ziyaına sebebiyet vermek bundan çok daha ağır bir fiil olup doğrudan meslekten çıkarma cezasını gerektirir."},"dogru":"Serbest muhasebeci mali müşavir, mükellefle birlikte kasten vergi ziyaına sebebiyet verip mahkeme bunu kesinleştirmişse meslekten çıkarılır. Bu, kanunun öngördüğü en ağır cezadır ve doğrudan uygulanır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 48. maddesine göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir.","kavramlar":[{"kaynak":"SMMM K. 48. madde","tanim":"Serbest muhasebeci mali müşavirin mükellefle birlikte bilerek ve isteyerek devletin vergi gelirini azaltıcı davranışta bulunmasıdır.","ad":"Kasten vergi ziyaına sebebiyet verme"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir.","ad":"Meslekten çıkarma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavirin, mükellefiyle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşmiştir. 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre bu meslek mensubuna hangi disiplin cezası verilir?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-01","verilenler":[{"deger":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verme","anlam":"Hangi disiplin cezasının uygulanacağını belirleyen fiildir.","ad":"Fiil"},{"deger":"Mahkeme kararıyla kesinleşmiş","anlam":"Cezanın uygulanabilmesi için fiilin mahkeme kararıyla kesinleşmiş olması gerektiğini gösterir.","ad":"Kesinleşme durumu"}],"dayanak":"3568 sayılı SMMM K. m.48","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: bir başka ilde, bir SMMM ile mükellefi 2019 yılında birlikte hareket edip 340.000 TL vergi ziyaına kasten sebep olmuş, olay mahkemeye taşınmış ve 2022\u0027de karar kesinleşmiştir.","anlatim":"Mahkeme kararı kesinleşince artık tartışma bitmiştir. Disiplin kurulu bu meslek mensubuna hangi cezayı vereceğine bakar.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun madde 48\u0027de beş ceza var; uyarma, kınama, geçici alıkoyma, yeminli sıfatını kaldırma, meslekten çıkarma. Bu beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Her ceza farklı bir fiile bağlanmıştır, hepsi aynı kefeye konmaz. Şimdi olayımızdaki fiil hangi bende denk geliyor onu arayacağız.","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"p.48/1","karar":"yanlış","anlatim":"Uyarma yalnız mesleğin vakar ve onuruna aykırı davranışın ilk kez görülmesinde uygulanır. Bizim olayımızda ayrı ve özel bir hüküm var, mükellefle kasten vergi ziyaı. Bu yüzden uyarma burada uygulanmaz.","formul":"Şık A: disiplin kurulu \u0027ilk defa oluyor, sadece uyarma verelim\u0027 diyor, bu doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"p.48/1","karar":"yanlış","anlatim":"Kınama da aynı genel vakar/onur ihlali hükmünün tekrarına özgüdür. Olayımızdaki fiil kanunun ayrıca saydığı özel bir haldir, genel hükme girmez. Kınama burada yanlış olur.","formul":"Şık B: \u0027daha önce böyle bir olay yaşamıştı, tekrar ettiği için kınama verelim\u0027 diyor, katılır mısın?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"p.48/2","karar":"yanlış","anlatim":"Geçici alıkoyma bağımsızlık, tarafsızlık, dürüstlük ihlaline ya da tasdik yetkisinin ilk kez kötüye kullanımına bağlıdır. Bizim olayda mükellefle birlikte kasten vergi ziyaı var, bu ayrı bir bent. Geçici alıkoyma burada uygulanmaz.","formul":"Şık C: \u0027altı ay mesleki faaliyetten alıkoyalım, yeter\u0027 diyor, doğru mu bu karar?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"p.48/1","karar":"yanlış","anlatim":"Bu ceza yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrür edip mahkeme kararıyla kesinleşmesine özgüdür. Olayımızda tasdik yetkisi kötüye kullanımı yok, mükellefle kasten vergi ziyaı var. D burada da yanlış.","formul":"Şık D: \u0027yeminli mali müşavirse yeminli sıfatını kaldıralım\u0027 diyor, sen ne dersin?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.48/2","karar":"doğru","anlatim":"Kanun açıkça der: mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası verilir. Olayımız tam bu tanıma uyuyor. Bu yüzden E doğrudur.","formul":"Şık E: \u0027meslekten çıkarma cezası verelim\u0027 diyor, sence bu doğru mu?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.48/2","karar":"doğru","anlatim":"Bu ceza kademeli bir süreçten geçmez, kanun onu doğrudan ve özel olarak bağlamıştır. Kendine hep şunu sor: bu fiil genel vakar/onur ihlali mi, yoksa kanunun ayrıca saydığı özel bir fiil mi?","formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓"}],"anahtar":[{"ornek":"meslek","kok":"meslek"},{"ornek":"mükellefle","kok":"mükell"},{"ornek":"kararıyla","kok":"kararı"},{"ornek":"kesinleşen","kok":"kesinl"},{"ornek":"olayımızdaki","kok":"olayım"},{"ornek":"kasten","kok":"kasten"}],"konuGiris":{"harita":"Ne zaman verilir: fiilin ağırlığına göre beş dereceli cezalardan biri seçilerek uygulanır. Nasıl belirlenir: kanunda sayılan fiil tipleri ile ceza doğrudan eşleştirilir. Nasıl kesinleşir: savunma alınıp disiplin kurulu kararıyla, bildirimden sonra yürürlüğe girer.","desen":"Soru genelde mahkeme kararıyla kesinleşmiş vergi ziyaı fiilini verip doğrudan ceza türünü sordurur; tuzak, bu fiili geçici alıkoyma ya da kınama gibi hafif cezalarla karıştırmaktır. Çıkmışlarda öğrenciler tekerrür şartlarını (3 yıl, 5 yıl) bu maddeyle karıştırıp yanlış ceza seçebilir. Bu soru m.48 fıkra 2\u0027deki \u0027mükellefle birlikte kasten vergi ziyaı\u0027 ibaresinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Daha dikkatli davranılması gerektiğinin yazıyla bildirilmesi","ad":"Uyarma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"6 ay ilâ 1 yıl arası mesleki faaliyetten men edilme","ad":"Geçici alıkoyma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ruhsatın geri alınıp mesleğe tekrar izin verilmemesi","ad":"Meslekten çıkarma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mükellefle birlikte kasten vergi kaybına neden olma","ad":"Vergi ziyaı fiili","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Mahkeme kararıyla kesinleşmiş bir fiil verilip buna karşılık gelen disiplin cezası sorulur.","panel_ornek":"Bir spor kulübü üyesi, kulüp kurallarını ilk kez ihlal ederse sözlü uyarı alır; aynı hatayı 3 kez tekrarlarsa üyeliği tamamen iptal edilir. Küçük hata küçük ceza, büyük ve tekrar eden hata ise en ağır cezayı getirir.","ornek":"Bir spor kulübü üyesi, kulüp kurallarını ilk kez ihlal ederse sözlü uyarı alır; aynı hatayı 3 kez tekrarlarsa üyeliği tamamen iptal edilir. Küçük hata küçük ceza, büyük ve tekrar eden hata ise en ağır cezayı getirir.","yontemler":"Fiil cümlesini kanundaki kalıp ifadelerle birebir eşleştirip doğrudan ceza adını seçmek yeterlidir, hesaplama yapılmaz.","nedir":"Meslek mensuplarının mesleki kurallara aykırı davranışlarına karşı uygulanan yaptırım sistemidir. Sınav, hangi fiile hangi ceza derecesinin karşılık geldiğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Bağımsızlık İhlali Tuzağı","metin":"Görevi bağımsızlık, tarafsızlık ve dürüstlükle yapmama halinin cezasıyla bu özel fiili karıştırıyorsun. Doğrusu: Geçici alıkoyma cezası bağımsızlık/tarafsızlık ihlali ile tasdik yetkisinin gerçeğe aykırı ilk kullanımına özgüdür, mükellefle kasten vergi ziyaına sebebiyet fiiline uygulanmaz."},"A":{"ad":"İlk Aşama Tuzağı","metin":"Her disiplin ihlalinin ilk defasında uyarma cezası ile başladığını sanıyorsun. Doğrusu: Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verilip bu husus mahkeme kararıyla kesinleştiğinde ilk aşama uygulamadan doğrudan meslekten çıkarma cezasını öngörür."},"D":{"ad":"Yeminli Sıfatı Tuzağı","metin":"Bu cezanın her ağır fiilde uygulanan genel bir yaptırım olduğunu sanıyorsun. Doğrusu: Yeminli sıfatının kaldırılması yalnız yeminli mali müşavirlerin tasdik yetkisini gerçeğe aykırı kullanmasının tekerrürüne özgü özel bir cezadır."},"B":{"ad":"Tekerrür Tuzağı","metin":"Kınama cezasının basit kusurlu davranışın tekrarında uygulandığını, olayı da böyle bir tekrar sanıyorsun. Doğrusu: Buradaki fiil mükellefle birlikte kasten vergi ziyaına sebep olmaktır, bu fiile kanun doğrudan en ağır cezayı bağlamıştır."}},"celdiriciYol":{},"hap":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu husus mahkeme kararıyla kesinleşen meslek mensubuna kademesiz doğrudan meslekten çıkarma cezası verilir.","teshis":{"C":{"gercek":"Geçici alıkoyma; bağımsızlık, tarafsızlık, dürüstlük ihlali ile tasdik yetkisinin ilk kez gerçeğe aykırı kullanımına özgüdür.","ayirt":"Fiil bağımsızlık/tasdik yetkisi ihlali mi, yoksa mükellefle birlikte vergi ziyaı mı?","paragraf":"3568 s.K. m.48","yanilgi":"Geçici alıkoymayı her ağır sayılan fiilin standart cezası sanıyorsun."},"E":{"gercek":"Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verilip bunun mahkeme kararıyla kesinleşmesi halini doğrudan meslekten çıkarma sebebi saymıştır.","ayirt":"Fiil kanunda ayrıca sayılan doğrudan ağır ceza gerektiren hallerden biri mi?","paragraf":"3568 s.K. m.48","yanilgi":"Bu kadar ağır bir cezanın kademeli süreç olmadan uygulanamayacağını düşünüp bu şıkkı elersin."},"A":{"gercek":"Madde 48, ağırlığına göre bazı fiillere kademesiz doğrudan ağır ceza bağlar; kasten vergi ziyaı bunlardan biridir.","ayirt":"Bu fiil kademeli mi ağırlaşır yoksa kanunun kendisi mi doğrudan ağır cezayı buyuruyor?","paragraf":"3568 s.K. m.48","yanilgi":"Bütün disiplin süreçlerinin uyarma ile başladığını düşünüyorsun."},"D":{"gercek":"Bu ceza yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrür edip mahkeme kararıyla kesinleşmesine özgüdür.","ayirt":"Olayda tasdik yetkisinin tekerrür eden kötüye kullanımı mı var, yoksa mükellefle kasten vergi ziyaı mı var?","paragraf":"3568 s.K. m.48","yanilgi":"Yeminli sıfatını kaldırmayı her yeminli mali müşavir hatasının cezası sanıyorsun."},"B":{"gercek":"Kınama yalnız mesleğin vakar ve onuruna aykırı hareketin tekrarında uygulanır, kasten vergi ziyaı ayrı ve özel bir hükümle düzenlenmiştir.","ayirt":"Olaydaki fiil genel vakar/onur ihlali mi, yoksa kanunun ayrıca saydığı özel bir fiil mi?","paragraf":"3568 s.K. m.48","yanilgi":"Kınamayı her tekrarlanan hatanın otomatik cezası sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":11,"hesaplar":{}},{"capa":null,"kural":"Koşulların tartışılarak kabul edildiğine ilişkin kayıtlar TEK BAŞINA onları genel işlem koşulu olmaktan çıkarmaz; kural olarak çıkardığı söylenemez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 125","sonDonem":2,"sim":{"dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"TEK BAŞINA / KURAL OLARAK gibi zarf kelimeleri metinle karşılaştır; ters çevrilen ifadeler genelde bu kelimede saklanır.","konu":"genel işlem koşulları","tablo":{"satirlar":[["A) Genel işlem koşulları, düzenleyenin ileride çok sayıda b…","m.20/1","doğru ifade"],["B) Bu koşulların sözleşme metninde veya ekinde yer alması, …","m.20/2","doğru ifade"],["C) Aynı amaçla düzenlenen sözleşmelerin metinlerinin özdeş …","m.20/3","doğru ifade"],["D) Genel işlem koşulları içeren sözleşmeye konulan bu koşul…","m.20/3","YANLIŞ ifade"],["E) Genel işlem koşullarıyla ilgili hükümler, sundukları hiz…","m.20/4","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Aynı amaçla düzenlenen sözleşmelerin metinlerinin özdeş olmaması, bu sözleşmelerin içerdiği hükümlerin genel işlem koşulu sayılmasını engellemez.","E":"Genel işlem koşullarıyla ilgili hükümler, sundukları hizmetleri kanun veya yetkili makamlar tarafından verilen izinle yürütmekte olan kişi ve kuruluşların hazırladıkları sözleşmelere de niteliklerine bakılmaksızın uygulanır.","A":"Genel işlem koşulları, düzenleyenin ileride çok sayıda benzer sözleşmede kullanmak amacıyla önceden tek başına hazırlayıp karşı tarafa sunduğu sözleşme hükümleridir.","D":"Genel işlem koşulları içeren sözleşmeye konulan bu koşulların her birinin tartışılarak kabul edildiğine ilişkin kayıtlar, kural olarak onları genel işlem koşulu olmaktan çıkarır.","B":"Bu koşulların sözleşme metninde veya ekinde yer alması, kapsamı, yazı türü ve şekli, nitelendirmede önem taşımaz."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Sözleşme metinleri farklı olsa bile aynı amaçla düzenlenmişse yine genel işlem koşulu sayılabilir; bu mümkündür.","E":"Kanun yetkilendirilmiş kuruluşların sözleşmelerine de niteliklerine bakılmaksızın uygulanacağını belirtir; hiçbir istisna yoktur.","A":"Tanım birebir kanundaki ifadeyle eşleşir; sözleşme hükümleri önceden tek başına hazırlanıp sunulmuş olması gerekir ve bu doğru tanımlanmıştır.","B":"Kanun açıkça söyler ki yazı türü, şekil, nerede yer aldığı nitelendirmeyi etkilemez; bu koşullar önemsizdir."},"dogru":"Kanun söylüyor ki, taraflar koşulları tartışarak kabul etse bile bu tek başına onları genel işlem koşulu olmaktan çıkarmaz. D şıkkı ters söylüyor; bu yüzden yanlıştır.","sinav":"Türk Borçlar Kanunu 20. madde","kavramlar":[{"kaynak":"Türk Borçlar Kanunu 20. madde","tanim":"Bir kişi tarafından ileride çok sayıda benzer sözleşmede kullanmak amacıyla önceden tek başına hazırlanıp karşı tarafa sunulan sözleşme hükümleridir.","ad":"Genel işlem koşulu"},{"kaynak":"Türk Borçlar Kanunu 20. madde","tanim":"Sözleşmeye konan her koşulun taraflar arasında tartışılarak kabul edildiğine dair yapılan yazılı belgelendirmedir; tek başına genel işlem koşulu olmaktan çıkarmaz.","ad":"Tartışarak kabul kaydı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":9,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027na göre genel işlem koşulları hakkında aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-ticaret-kolay/kp-01","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.20","dogru":"D","oyunBonus":null,"ders":"Ticaret Hukuku","adimlar":[{"formul":"Olay: Bir bankanın kredi kartı sözleşmesi var. Ayşe, 15 Mart günü şubede bu sözleşmeyi imzalıyor. Sözleşmenin altında \u0027her maddeyi okudum, tartıştım, kabul ediyorum\u0027 yazan bir kutucuğu da işaretlemiş.","anlatim":"Sözleşme bankanın önceden hazırladığı, binlerce müşteriye aynen sunulan bir metin. Ayşe\u0027nin imzaladığı kutucuk, aslında hiç pazarlık yapılmadığı hâlde \u0027tartışıldı\u0027 izlenimi veriyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.20\u0027deki beş cümleyi Ayşe\u0027nin sözleşmesine tek tek uygulayacağız; her cümle olayda doğru mu çıkıyor bakacağız.","anlatim":"Kural şu: önceden hazırlanan, çok sayıda sözleşmede kullanılan, tek taraflı hükümler genel işlem koşuludur. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.20/1","karar":"doğru","anlatim":"Evet, banka tam da bunu yapıyor: önceden, tek başına hazırlayıp çok sayıda müşteriye sunuyor. Kanun tanımı tam bunu söylüyor, ekstra şekil şartı aramıyor.","formul":"Şık A: Banka sana \u0027biz bu sözleşmeyi Ayşe için özel yazmadık, önceden hazırladık ve herkese aynısını sunuyoruz\u0027 diyor; bu tanım genel işlem koşulunu doğru anlatıyor mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.20/2","karar":"doğru","anlatim":"Hayır, kanun yer, kapsam, yazı türü ve şeklin önemsiz olduğunu açıkça söylüyor. Ek sayfada küçük punto olsun ya da olmasın nitelik değişmiyor.","formul":"Şık B: Ayşe \u0027ama bu hüküm ekte küçük puntoyla yazılmış, asıl metinde değil\u0027 dese, bu durum onu genel işlem koşulu olmaktan çıkarır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.20/3","karar":"doğru","anlatim":"Hayır, metinler özdeş olmasa bile amaç aynıysa hüküm yine genel işlem koşuludur. Ayşe\u0027nin ve diğer müşterinin metinleri farklı görünse de ikisi de aynı kural.","formul":"Şık C: Banka bir başka müşteriye biraz farklı cümlelerle aynı hükmü sunmuş; bu farklılık hükmün genel işlem koşulu sayılmasını engeller mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.20/3","karar":"yanlış","anlatim":"Hayır, kanun böyle bir kaydın TEK BAŞINA yeterli olmadığını, koşulu genel işlem koşulu olmaktan çıkarmayacağını söylüyor. Şıktaki \u0027kural olarak çıkarır\u0027 ifadesi kanunun tam tersi.","formul":"Şık D: Ayşe o kutucuğu işaretlediği için, banka \u0027bu artık genel işlem koşulu olmaktan çıktı, tartışıldı\u0027 diyor; bu doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.20/4","karar":"doğru","anlatim":"Hayır, kanun izinle hizmet sunan kişi ve kuruluşların sözleşmelerine de niteliklerine bakılmaksızın bu hükümlerin uygulanacağını söylüyor. Banka bu kuraldan kaçamaz.","formul":"Şık E: Bu banka, yetkili makamdan izinle faaliyet gösteriyor diye \u0027bize bu hükümler uygulanmaz\u0027 dese, haklı mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Tek yanlış ifade D; çünkü kanun \u0027tartışıldı\u0027 kaydının TEK BAŞINA yetmediğini söylerken, şık bunu tersine çevirip \u0027kural olarak çıkarır\u0027 diyor. Kendine hep şunu sor: kayıt TEK BAŞINA mı yeterli sayılıyor, yoksa kanun bunu reddediyor mu?","doldur":[]}],"anahtar":[{"ornek":"koşulu","kok":"koşulu"},{"ornek":"başina","kok":"başina"},{"ornek":"tartışılarak","kok":"tartış"},{"ornek":"söylüyor","kok":"söylüy"},{"ornek":"çıkarmaz","kok":"çıkarm"},{"ornek":"müşteriye","kok":"müşter"}],"konuGiris":{"harita":"Ne zaman test edilir: bir hükmün genel işlem koşulu sayılıp sayılmayacağı tartışıldığında test edilir. Nasıl ölçülür: kanundaki tanım kriterleri (önceden hazırlanma, çok sayıda sözleşmede kullanılma, tek taraflılık) ile ölçülür. Nasıl kaydedilir: hüküm sözleşme metninde veya ekinde yer alsa da aynı şekilde nitelendirilir.","desen":"Soru genellikle \u0027hangisi yanlıştır\u0027 formatında, m.20\u0027deki sayılan kriterlerden birini tersine çevirerek sorar; örneğin \u0027metinlerin özdeş olmaması genel işlem koşulu sayılmasını engeller\u0027 gibi yanlış bir önerme eklenir. Tuzak, \u0027tartışılarak kabul edilmesi\u0027 ve \u0027metinde/ekte yer alması\u0027 gibi ayrıntıların önemsiz sayıldığı noktalardadır. Bu soru m.20\u0027nin kapsam ve nitelendirme fıkralarından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Düzenleyenin önceden hazırlayıp çok sayıda benzer sözleşmede tek başına sunduğu hükümler","ad":"genel işlem koşulu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Metinde/ekte yer alma, kapsam, yazı türü ve şekli nitelendirmede önem taşımayan unsurlardır","ad":"nitelendirme kriterleri","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Hükümlerin tartışılıp kabul edildiğine dair kayıt, tek başına genel işlem koşulu niteliğini kaldırmaz","ad":"tartışılarak kabul kaydı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kanun veya yetkili makam izniyle hizmet veren kişi/kuruluşların sözleşmelerine de bu hükümler uygulanır","ad":"izinli kuruluş sözleşmeleri","kim":"kanun sabitler"}],"sinavda":"Soru kökünde beş seçenek verilir ve genel işlem koşulları hakkında kanuna aykırı olan ifade sorulur.","panel_ornek":"Bir müzik dinleme uygulamasına üye olurken karşına 40 maddelik bir kullanım sözleşmesi çıkıyor; bu maddeleri sen yazmadın, şirket herkese aynısını sunuyor. Sözleşmeyi tek tek okuyup \u0027kabul ediyorum\u0027 desen bile maddeler yine standart kalıyor. Şirket bu metni 5 yıldır değiştirmeden kullanıyor.","ornek":"Bir müzik dinleme uygulamasına üye olurken karşına 40 maddelik bir kullanım sözleşmesi çıkıyor; bu maddeleri sen yazmadın, şirket herkese aynısını sunuyor. Sözleşmeyi tek tek okuyup \u0027kabul ediyorum\u0027 desen bile maddeler yine standart kalıyor. Şirket bu metni 5 yıldır değiştirmeden kullanıyor.","yontemler":"Çözüm, m.20 metnindeki her cümleyi tek tek seçeneklerle eşleştirip ters çevrilmiş ifadeyi bulmaktır; en kritik kural, metinde sayılan \u0027önemsiz sayılan haller\u0027 listesinin ezbere bilinmesidir.","nedir":"Genel işlem koşulları, bir tarafın önceden hazırlayıp çok sayıda sözleşmede tek tip kullandığı standart hükümlerdir. Sınav, bu hükümlerin kanuni tanımını ve hangi hâllerin bu niteliği etkilemediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Metin Özdeşliği Tuzağı","metin":"Öğrenci, sözleşme metinlerinin birebir aynı olması gerektiğini, aksi hâlde genel işlem koşulu sayılmayacağını sanır. Doğrusu: Metinlerin özdeş olmaması bu nitelendirmeyi engellemez, ifade doğrudur."},"E":{"ad":"Kapsam Daraltma Tuzağı","metin":"Öğrenci, izinle faaliyet gösteren kuruluşların sözleşmelerinin niteliğine göre bu hükümlerden muaf tutulabileceğini sanır. Doğrusu: Kanun bu sözleşmelere niteliklerine bakılmaksızın uygulanacağını söyler, ifade doğrudur."},"A":{"ad":"Tanım Eksikliği Tuzağı","metin":"öğrenci genel işlem koşulu tanımında ayrıca yazılı şekil gibi bir şart arandığını sanıp bu ifadeyi yanlış sayar; oysa Türk Borçlar Kanunu m.20 genel işlem koşulunu, düzenleyenin ileride çok sayıda benzer sözleşmede kullanmak amacıyla önceden tek başına hazırlayıp karşı tarafa sunduğu hükümler olarak tanımlar; ifade doğrudur (TBK m.20)."},"B":{"ad":"Şekil Şartı Tuzağı","metin":"Öğrenci, koşulun sözleşme metninde mi ekinde mi yer aldığının ya da yazı türünün nitelendirmeyi etkileyeceğini sanır. Doğrusu: Kanun bu unsurların nitelendirmede önem taşımadığını açıkça belirtir, ifade doğrudur."}},"celdiriciYol":{},"hap":"Genel işlem koşullarında tartışılarak kabul edildiğine ilişkin kayıt, TEK BAŞINA o hükmü genel işlem koşulu olmaktan çıkarmaz.","teshis":{"C":{"gercek":"Metinlerin özdeş olmaması, içerdikleri hükümlerin genel işlem koşulu sayılmasını engellemez.","ayirt":"Metin farklı ama amaç ve hazırlanış tek taraflı mı?","paragraf":"TBK m.20/3","yanilgi":"Farklı müşterilere sunulan metinlerin birbirinin aynısı olması gerektiğini sanıyorsun."},"E":{"gercek":"Kanun, kanun veya yetkili makam izniyle hizmet sunanların sözleşmelerine de niteliklerine bakılmaksızın bu hükümlerin uygulanacağını söyler.","ayirt":"Kuruluşun niteliği bir istisna yaratıyor mu, yoksa kanun bunu açıkça reddediyor mu?","paragraf":"TBK m.20/4","yanilgi":"İzinle faaliyet gösteren kuruluşların sözleşmelerinin özel nitelikleri sebebiyle bu hükümlerden istisna tutulacağını sanıyorsun."},"A":{"gercek":"Madde 20 tanımı tek cümlede verir: önceden, tek başına hazırlama ve çok sayıda sözleşmede kullanma amacı yeterlidir.","ayirt":"Hüküm önceden mi hazırlandı, çok sayıda sözleşmede mi kullanılacak?","paragraf":"TBK m.20/1","yanilgi":"Bu tanımın eksik olduğunu, ayrıca yazılı şekil şartı arandığını düşünüyorsun."},"D":{"gercek":"Kanun böyle bir kaydın TEK BAŞINA yeterli olmadığını, koşulu genel işlem koşulu olmaktan çıkarmayacağını belirtir; şıktaki \u0027kural olarak çıkarır\u0027 ifadesi bu kuralın tersidir.","ayirt":"Kayıt TEK BAŞINA mı yeterli sayılıyor, yoksa kanun bunu reddediyor mu?","paragraf":"TBK m.20/3","yanilgi":"Tartışılarak kabul edildiğine dair imza veya kayıt varsa, bu kaydın hükmü genel işlem koşulu olmaktan tamamen çıkardığını sanıyorsun."},"B":{"gercek":"Kanun, yer, kapsam, yazı türü ve şeklin nitelendirmede önemsiz olduğunu açıkça söyler.","ayirt":"Şekil unsurları nitelendirmeyi etkiler mi, yoksa madde bunu ayrıca mı dışlar?","paragraf":"TBK m.20/2","yanilgi":"Koşulun sözleşme ekinde küçük puntoyla yazılmasının onu genel işlem koşulu olmaktan çıkaracağını sanıyorsun."}},"verilen":[],"donem":9,"hesaplar":{}},{"capa":null,"kural":"TMS 40 p.65\u0027e göre tamamlanma tarihindeki gerçeğe uygun değer ile önceki defter değeri arasındaki fark kâr veya zarar olarak finansal tablolara yansıtılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 54","sonDonem":2,"sim":{"dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"140.000","taraf":"B","hesap":"25 YATIRIM AMAÇLI GAYRİMENKULLER"},{"tutar":"140.000","taraf":"A","hesap":"649 DİĞER OLAĞAN GELİR VE KÂRLAR"}],"teori":false,"taktik":"Önce defter değerini (arsa bedeli + inşaat harcamaları) topla, sonra gerçeğe uygun değerden çıkar; kâr çıkarsa gelir hesabı alacak, zarar çıkarsa gider hesabı borç çalışır.","konu":"tms 40 yatırım amaçlı gayrimenkul","tablo":{"satirlar":[["VERİLENLER","-"],["Arsa bedeli","850.000 TL"],["İnşaat harcamaları","620.000 TL"],["Gerçeğe uygun değer","1.610.000 TL"],["HESAP","-"],["Toplam defter değeri (arsa + inşaat harcamaları)","1.470.000"],["Değerleme farkı (1.610.000 - 1.470.000)","140.000"],["649 Diğer Olağan Gelir ve Karlar hesabına alacak kaydedilecek tutar","140.000"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"258 YAPILMAKTA OLAN YATIRIMLAR hesabı 140.000 TL borç kaydedilir.","E":"Fark gerçekleşmemiş kâr sayıldığından hiçbir hesaba kaydedilmez, yalnız dipnotlarda açıklanır.","A":"649 DİĞER OLAĞAN GELİR VE KARLAR hesabı 140.000 TL alacak kaydedilir.","D":"649 DİĞER OLAĞAN GELİR VE KARLAR hesabı 990.000 TL alacak kaydedilir.","B":"659 DİĞER OLAĞAN GİDER VE ZARARLAR hesabı 140.000 TL borç kaydedilir."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[{"kayit":[{"tutar":"1.470.000","taraf":"B","hesap":"25 YATIRIM AMAÇLI GAYRİMENKULLER"},{"tutar":"1.470.000","taraf":"A","hesap":"258 YAPILMAKTA OLAN YATIRIMLAR"}],"baslik":"İnşaatın tamamlanarak aktifleştirilmesi"},{"kayit":[{"tutar":"140.000","taraf":"B","hesap":"25 YATIRIM AMAÇLI GAYRİMENKULLER"},{"tutar":"140.000","taraf":"A","hesap":"649 DİĞER OLAĞAN GELİR VE KÂRLAR"}],"baslik":"Gerçeğe uygun değer farkının kaydı"}],"sade":{"siklar":{"C":"Gayrimenkulü 258 hesabından çıkarırken yapılmakta olan yatırımlar hesabı yalnız defter değeriyle kapatılır. Farkın 140.000 TL fazlalığı ayrıca gelir hesabına kaydedilir.","E":"Gerçekleşmemiş kârlar da TMS 40\u0027a göre doğrudan gelir ve karlar hesabına yansıtılır, dipnotla açıklanmakla kalmaz.","D":"Arsa bedelini unutup sadece inşaat harcamasından fark hesaplarsanız 990.000 TL bulursunuz. Defter değer arsa (850.000) ve inşaat (620.000) harcamalarının toplamı olan 1.470.000 TL\u0027dir.","B":"Farkın zarar olduğu düşüncesiyle gider hesabına yazarsanız yanlışlık yaparsınız. Gerçeğe uygun değer defter değerinden büyük olunca fark kârdır, gelir hesabına alacak kaydedilir."},"dogru":"Gayrimenkul tamamlandığında gerçeğe uygun değeri (1.610.000 TL) defter değerinden (1.470.000 TL) 140.000 TL fazladır. Bu fark kâr olduğu için gelir hesabına alacak kaydedilir.","sinav":"Türkiye Muhasebe Standardı (TMS) 40 paragraf 65\u0027e göre, kendisi tarafından inşa edilen yatırım amaçlı gayrimenkulün tamamlanmasında, gerçeğe uygun değer ile defter değeri arasındaki fark kâr veya zarar olarak finansal tablolara yansıtılır.","kavramlar":[{"kaynak":"TMS 40 paragraf 5","tanim":"Kira geliri veya sermaye kazancı elde etmek amacıyla sahibi tarafından elde tutulan arsa, bina veya her ikisidir.","ad":"Yatırım amaçlı gayrimenkul"},{"kaynak":"TMS 40 paragra luyoruz - buna defter değeri deniyor. Bu, gerçeğe uygun değerle karşılaştıracağımız eşik.","doldur":[[5,1]]},{"formul":"Değerleme farkı = gerçeğe uygun değer − toplam defter değeri = 1.610.000 (soruda verilen) − 1.470.000 (3. adımda bulduk) = 140.000","anlatim":"Şimdi tamamlanma anındaki piyasa değeriyle bu defter değerini kıyaslıyoruz. TMS 40\u0027a göre aradaki fark doğrudan kâr veya zarar olur.","doldur":[[6,1]]},{"formul":"649 Diğer Olağan Gelir ve Karlar = faaliyetle ilgili olup 640-648 hesaplarına girmeyen olağan gelir ve kârlar (kambiyo kârı 646, menkul kıymet satış kârı 645\u0027te izlenir) (kapsam)","anlatim":"649 Diğer Olağan Gelir ve Karlar nedir? Ana faaliyet dışı, olağan nitelikli kâr ve gelirlerin alacak kaydedildiği hesaptır. Değerleme farkı burada toplanır çünkü satış değil bir değer artışıdır.","doldur":[]},{"formul":"25 YATIRIM AMAÇLI GAYRİMENKULLER (BORÇ) 1.610.000 = 1.470.000 (3. adımda bulduk) + 140.000 (4. adımda bulduk); 258 YAPILMAKTA OLAN YATIRIMLAR (ALACAK) 1.470.000 (3. adımda bulduk); 649 DİĞER OLAĞAN GELİR VE KÂRLAR (ALACAK) 140.000 (4. adımda bulduk)","anlatim":"Fark pozitif çıktı, yani gerçeğe uygun değer arttı - bu bir kâr. Gayrimenkul hesabına borç, kaynak olan yatırım hesabından çıkışa alacak, kâra da alacak yazılır.","doldur":[[7,1]]},{"formul":"Ters durum: gerçeğe uygun değer \u003c defter değeri → 659 DİĞER OLAĞAN GİDER VE ZARARLAR (BORÇ)","anlatim":"Ters durumda: gerçeğe uygun değer defter değerinden düşük çıksaydı, aradaki fark kâr değil zarar olurdu. O zaman 649 yerine 659 Diğer Olağan Gider ve Zararlar hesabına borç yazılırdı.","doldur":[]},{"formul":"Yanlış yol: 25 YATIRIM AMAÇLI GAYRİMENKULLER 1.470.000 = 258 YAPILMAKTA OLAN YATIRIMLAR 1.470.000 (HATALI) → doğrusu 1.610.000, 140.000 fark 649\u0027a alacak (6. adımda bulduk)","anlatim":"En sık hata: öğrenciler farkı 258 hesabında bırakıp sadece maliyet değeriyle aktarım yapıyor. Oysa GUD yöntemiyle izlenen gayrimenkulde fark mutlaka kâr/zarara yazılmalı.","doldur":[]}],"anahtar":[{"ornek":"değeri","kok":"değeri"},{"ornek":"gerçeğe","kok":"gerçeğ"},{"ornek":"tamamlandığında","kok":"tamaml"},{"ornek":"defter","kok":"defter"},{"ornek":"yatırım","kok":"yatırı"},{"ornek":"olağan","kok":"olağan"},{"ornek":"649","kok":"649"}],"konuGiris":{"harita":"Ne zaman test edilir: kendi inşa ettiği yatırım amaçlı gayrimenkul tamamlandığında. Nasıl ölçülür: tamamlanma tarihindeki gerçeğe uygun değer ile önceki defter değeri karşılaştırılarak. Nasıl kaydedilir: aradaki fark kâr veya zarar olarak finansal tablolara yansıtılır, varlık gerçeğe uygun değerle tabloya alınır.","desen":"Sorular genelde arsa ve inşaat maliyetini toplayıp defter değeri oluşturur, sonra tamamlanma tarihindeki gerçeğe uygun değerle karşılaştırma yapılır. Tuzak, farkı maliyete eklemek yerine kâr/zarar hesabına atmayı unutmaktır; öğrenciler genelde 258 hesabı doğrudan kapatıp aradaki farkı hiç kaydetmez. Bu soru p.65 Transferler hükmünden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Varlığın finansal durum tablosunda o ana kadar yer alan tutarı","ad":"Defter değeri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Piyasa katılımcıları arasında ölçüm tarihinde gerçekleşecek satış tutarı","ad":"Gerçeğe uygun değer","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Tamamlanma anındaki gerçeğe uygun değer ile önceki defter değeri arasındaki tutar","ad":"Transfer farkı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Tamamlanana kadar harcamaların biriktiği ara hesap","ad":"Yapılmakta olan yatırımlar hesabı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Arsa ve inşaat maliyeti ile tamamlanma tarihindeki gerçeğe uygun değer verilir, doğru muhasebe kaydı istenir.","panel_ornek":"Bir arkadaşın kendi imkanlarıyla bahçesine kiraya vereceği küçük bir stüdyo yaptırıyor: arsa 40, inşaat 30 birim tuttu, bittiğinde emlakçı değeri 90 birim söyledi. Aradaki 20 birim fark, d erine katmayı unutma - eksik katman hatası)","B":"1.610.000 - 1.470.000 = 140.000 (kârı zarar sayıp 659 hesabına borç yazma - taraf/yön hatası)"},"hap":"Kendi inşa edilen ve gerçeğe uygun değerle izlenen yatırım amaçlı gayrimenkul tamamlandığında, tamamlanma tarihindeki gerçeğe uygun değer ile önceki defter değeri arasındaki fark kâr veya zarar olarak finansal tablolara yansıtılır.","teshis":{"C":{"gercek":"258 Yapılmakta Olan Yatırımlar hesabı yalnızca birikmiş maliyetle (defter değeriyle) kapatılır; değerleme farkı ayrı bir gelir/gider hesabına gider.","ayirt":"Bu hesap defter değerini mi yoksa farkı mı taşıyor?","paragraf":"TMS 40 p.65","yanilgi":"258 hesabın hem transfer hem fark kaydını taşıdığını sanırsın."},"E":{"gercek":"TMS 40 p.65 açıkça bu farkın kâr veya zarar olarak finansal tablolara yansıtılmasını emreder, kayıt dışı bırakma seçeneği yoktur.","ayirt":"Standart bu farkı ertelemeyi mi yoksa doğrudan tanımayı mı söylüyor?","paragraf":"TMS 40 p.65","yanilgi":"Gerçekleşmemiş kârın ihtiyatlılık gereği hiç kaydedilmeyeceğini sanırsın."},"A":{"gercek":"TMS 40 p.65 tamamlanma tarihindeki gerçeğe uygun değer ile önceki defter değeri arasındaki farkın kâr veya zarar olarak finansal tablolara yansıtılacağını söyler.","ayirt":"Bu fark bir varlık değişimi mi yoksa dönem sonucu mu?","paragraf":"TMS 40 p.65","yanilgi":"Bu şıkkı eleyen öğrenci farkın gelir hesabına değil bilanço hesabına yazılacağını düşünür."},"D":{"gercek":"Kaynak metindeki defter değeri tanımı, varlığın finansal durum tablosundaki toplam değeridir; burada arsa ve inşaat harcamalarının tamamını kapsar.","ayirt":"Defter değerine hangi kalemler dahil edildi, tek tek saydım mı?","paragraf":"TMS 40 p.5","yanilgi":"Arsa bedelinin ayrı bir hesapta izlendiğini düşünüp defter değerine dahil etmezsin."},"B":{"gercek":"TMS 40 p.65 farkın işaretine göre kâr ya da zarar olarak kaydedilmesini öngörür; burada 1.610.000\u003e1.470.000 olduğundan sonuç kârdır.","ayirt":"Gerçeğe uygun değer defter değerinden büyük mü küçük mü?","paragraf":"TMS 40 p.65","yanilgi":"Gerçeğe uygun değerin defter değerinden büyük olduğunu fark etmeden otomatik olarak zarar hesabına yazarsın."}},"verilen":[[1,1],[2,1],[3,1]],"donem":8,"hesaplar":{"649":{"ad":"FAALİYETLE İLGİLİ DİĞER OLAĞAN GELİR VE KARLAR","tanim":"Yukarıdaki hesaplar kapsamına girmeyen diğer olağan faaliyetlerden sağlanan gelir ve karların izlendiği hesaptır. Bu hesapta kambiyo karları, menkul kıymet satış karları ve benzerleri izlenir."},"659":{"ad":"Diğer Olağan Gider ve Zararlar (-)","tanim":"Yukarıdaki hesaplar kapsamına girmeyen diğer olağan faaliyetlerle ilgili kambiyo zararları, menkul kıymet satış zararları ve benzeri gider ve zararların izlendiği hesaptır."},"258":{"ad":"YAPILMAKTA OLAN YATIRIMLAR","tanim":"İşletmede, yapımı süren ve tamamlandığında ilgili maddi duran varlık hesabına aktarılacak olan, her türlü madde ve malzeme ile işçilik ve genel giderlerle ilgili harcamaların izlendiği hesaptır."}}}];

function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}

      // Cem 04.09 "yol haritası ekranı kaplıyor": tek satır — numaralı noktalar (geçilen yeşil, buradasın kalın, hedef altın bayrak),
      // yalnız bulunduğun adımın adı yazılı; başlıklar üstüne gelince görünür. Kartın altına yaslanır.
      const yolH='<div class="yol"><div class="yolCip">'+s.adimlar.map((x,q)=>'<span class="yc '+(q<j?'gecti':(q===j?'simdi':(q===hedefIdx?'hedef':'')))+'" title="'+esc(adimBaslik(x))+'">'+(q===hedefIdx&&q!==j?'🏁':(q+1))+'</span>').join('<span class="ycb"></span>')+'<span class="yolAd">'+esc(adimBaslik(a))+'</span></div>'
        +(a.giris?('<div class="neden">'+(((s.teori||(s.tablo&&s.tablo.basliklar&&s.tablo.basliklar[0]==='Adım')))
            ?'Önce konunun haritası: nedir, sınav nasıl sorar. Sonra kural, sonra şıklar kuralla tek tek sınanır; en sonda senin seçimin.'   // 07.09 Ö55(2): teori cümlesi (hesap kalıbı "verilenler, hesap, ters durum" teori soruda anlamsızdı)
            :'Önce konunun haritası: nedir, sınav ne sorar, hangi yöntem ne zaman. Sonra sorunun verilenleri, sonra hesap; hedef <b>'+esc(sonBas)+'</b>.')+'</div>')
          :(verilenAdimMi&&s.verilenler&&s.verilenler.length)?'<div class="neden">Önce elimizdekileri tanıyoruz: <b>'+s.verilenler.length+' verilen</b>. Hesap bloğundaki her satır bunlardan kurulacak; hedef <b>'+esc(sonBas)+'</b>.</div>'
          :son?'<div class="neden">Hedefe ulaştık: <b>'+esc(sonBas)+'</b>. Şimdi aynı yolu sen yürü.</div>'
          :(j>=hedefIdx?'<div class="neden">Hedef bulundu (<b>'+esc(sonBas)+'</b>). '+(a.kisi?'Bu adım <b>senin seçtiğin şıkkın</b> neden yanlış olduğunu gösterir.':'Bu adım, adayların en sık düştüğü yanlış yolu gösterir.')+'</div>'
          :(j+1===hedefIdx?'<div class="neden">Bu adım niye var? Burada bulduğumuz değer doğrudan hedefe götürür: sıradaki adım <b>'+esc(sonBas)+'</b>.</div>'
          :'<div class="neden">Bu adım niye var? Burada bulduğumuz değer sıradaki adımda (<b>'+esc(sonrakiBas)+'</b>) kullanılacak; hedef <b>'+esc(sonBas)+'</b>.</div>')))+'</div>';
      serit.innerHTML='<div class="adimK'+(son?' sonAdim':'')+(yon<0?' geri':'')+'"><div class="say"><span>ADIM '+(j+1)+' / '+s.adimlar.length+'</span><span class="baslik">'+esc(adimBaslik(a))+'</span></div><code class="mat0">'+fH+'</code><p>'+anlatimH+'</p>'+yolH+sonBtn+'</div>';
      // Cem 04.09 "numaralara basarak sayfa değiştirsek": yol haritası yuvarlakları tıklanınca o adıma gider
      serit.querySelectorAll('.yc').forEach((el,q)=>el.addEventListener('click',()=>adimGit(q-adimNo)));
      const bo=serit.querySelector('.bDersOyun'); if(bo){ bo.addEventListener('click',()=>{ ders.classList.remove('acik'); oyunKur(); oyun.classList.add('acik'); }); }
      const bb=serit.querySelector('.bDersBitti'); if(bb){ bb.addEventListener('click',()=>{ ders.classList.remove('acik'); const cA=k.querySelector('.cAnlat'); if(cA){ if(cA.offsetParent===null){ const bd=k.querySelector('.bDaha'); if(bd) bd.click(); } cA.click(); const ta=k.querySelector('.anlatK'); if(ta) setTimeout(()=>ta.focus(),200); } }); }
      // tablo: bu adimin hucreleri acilir ve yanar; onceki adimlarda acilanlar acik kalir
      tabloSar.querySelectorAll('td.vurgu,td.kaynakH').forEach(td=>{ td.classList.remove('vurgu'); td.classList.remove('kaynakH'); }); tabloSar.querySelectorAll('tr.kayit.vurguS').forEach(tr=>tr.classList.remove('vurguS'));
      // 06.09 Cem "5'ten 3'e dönünce 5'in cevabı kalıyor": açık hücre kümesi her adımda 0..j'den YENİDEN kurulur; geri gidince sonraki adımların hücresi tekrar kapanır
      acilan.clear(); for(let q=0;q<=j;q++){ (s.adimlar[q].doldur||[]).forEach(p=>acilan.add(p[0]+','+p[1])); }
      kaynakH.forEach(k=>acilan.add(k));   // formülde kullanılan hücre görünür olmalı
      if(son&&s.tablo){ s.tablo.satirlar.forEach((st,r)=>st.forEach((c,ci)=>{ if(ci>0) acilan.add(r+','+ci); })); }
      tabloSar.querySelectorAll('td[data-r]').forEach(td=>{ const key=td.dataset.r+','+td.dataset.c; if(acilan.has(key)){ if(td.classList.contains('gizliH')){ td.classList.remove('gizliH'); td.classList.add('acildi'); } } else if(td.classList.contains('acildi')){ td.classList.add('gizliH'); td.classList.remove('acildi'); } });
      (a.doldur||[]).forEach(p=>{ const td=tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]'); if(td) td.classList.add('vurgu'); });
      // 05.09 Cem "%80 çıktığını o rakamı tabloya doldurduğumuzu göstersek": sonuç formülden tablodaki hücreye UÇAR
      // 05.09 Cem "bir anda çözümler geliyor, sırayla çözüyor gibi yapsa": adımda birden çok hesap varsa formül kutuları
      // SIRAYLA belirir (900 ms arayla), her kutunun sonucu belirince kendi hücresine uçar; hücre uçuş bitene dek boş kalır.
      if(yon>=0&&j>0&&!verilenAdimMi&&!a.giris){
        const mats=[...serit.querySelectorAll('.mat')]; const hedefler=(a.doldur||[]).map(p=>tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]')).filter(Boolean);
        const cokKutu=mats.length>1; const adimBu=j;
        hedefler.forEach(td=>td.classList.add('bekliyor'));
        mats.forEach((m,q)=>{ if(q>0&&cokKutu){ m.classList.add('gizliMat'); } });
        hedefler.forEach((td,pi)=>{ const kaynakM=mats[Math.min(pi,Math.max(0,mats.length-1))]; const gecikme=cokKutu?pi*900:pi*120;
          setTimeout(()=>{ if(adimNo!==adimBu||!document.body.contains(td)){ td.classList.remove('bekliyor'); return; }
            if(kaynakM){ kaynakM.classList.remove('gizliMat'); kaynakM.classList.add('geldi'); }
            const kaynakEl=kaynakM?kaynakM.querySelector('.matSonuc'):null; const from=kaynakEl?kaynakEl.getBoundingClientRect():null, to=td.getBoundingClientRect();
            if(!from||!from.width||!to.width){ td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); return; }
            const u=document.createElement('div'); u.className='ucan'; u.textContent=td.textContent.trim()||kaynakEl.textContent.trim(); document.body.appendChild(u); u.style.left=from.left+'px'; u.style.top=from.top+'px';
            requestAnimationFrame(()=>{ u.style.transform='translate('+(to.left-from.left)+'px,'+(to.top-from.top)+'px) scale(.85)'; u.style.opacity='0.15'; });
            setTimeout(()=>{ u.remove(); td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); },650); }, gecikme); });
        // hedefi olmayan fazladan kutular da sırayla gelsin
        mats.forEach((m,q)=>{ if(q>=hedefler.length&&m.classList.contains('gizliMat')){ setTimeout(()=>{ if(adimNo===adimBu){ m.classList.remove('gizliMat'); m.classList.add('geldi'); } }, q*900); } });
      }
      kaynakH.forEach(k=>{ const [r,c]=k.split(','); const td=tabloSar.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]'); if(td) td.classList.add('kaynakH'); });
      // 06.09: VERİLENLER bloğu Adım 1'den sonra katlanır; bu adımın formülünde kullanılan verilen satırı açık kalır (mavi), başlık tıklanınca hepsi açılır
      tabloSar.querySelectorAll('tr.vblok').forEach(tr=>{ const td=tr.querySelector('td[data-r]'); const key=td?td.dataset.r+','+td.dataset.c:''; tr.classList.toggle('katli', j>0 && !kaynakH.has(key) && !hedef.has(key)); });
      let lej=tabloSar.querySelector('.lejant'); if(!lej){ lej=document.createElement('div'); lej.className='lejant'; tabloSar.appendChild(lej); }
      lej.innerHTML=kaynakH.size?'<i class="m"></i>nereden geldi <i class="a"></i>bu adımda bulundu':(hedef.size?'<i class="a"></i>bu adımda bulundu':''); lej.style.display=lej.innerHTML?'block':'none';
      // kayit satirlari: adimda anilan hesap kodu (uc hane; "100.000" icindeki 100 sayilmaz)
      const kodOf=x=>new Set([...(String(x.formul)+' '+String(x.anlatim)).matchAll(/(?<![\d.,])(\d{3})(?![\d.,]|\s*(?:TL|%|adet|gün|yıl|ay))/g)].map(m=>m[1]));
      const kodlar=kodOf(a);
      // gösterilen kayıt satırları da 0..j'den yeniden kurulur (geri gidince sonraki adımın satırı gizlenir)
      gosterilen.clear(); for(let q=0;q<=j;q++){ kodOf(s.adimlar[q]).forEach(c=>gosterilen.add(c)); }
      tabloSar.querySelectorAll('tr.kayit[data-kod]').forEach(tr=>{ const k2=tr.dataset.kod; const an=k2&&kodlar.has(k2); if(son){ gosterilen.add(k2); } tr.classList.toggle('goster',gosterilen.has(k2)); tr.classList.toggle('vurguS',!!an); });
      tabloSar.querySelectorAll('tr.ara').forEach(ara=>{ const gi=ara.dataset.grp; ara.classList.toggle('goster',[...tabloSar.querySelectorAll('tr.kayit[data-kod][data-grp="'+gi+'"]')].some(tr=>tr.classList.contains('goster'))); });
      adimBar.querySelectorAll('i').forEach(n=>{ const q=parseInt(n.dataset.j); n.classList.toggle('simdi',q===j); n.classList.toggle('gecti',q<j); });
      bOnce.disabled=(j===0); bSonra.disabled=son; bSonra.textContent=son?'Bitti ✓':'İleri ▶';
      const vurgu=tabloSar.querySelector('td.vurgu, tr.vurguS'); if(vurgu) vurgu.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    const adimGit=d=>{ const cur=s.adimlar[adimNo]; if(d>0&&cur&&tahminGerek(cur,adimNo,adimNo===s.adimlar.length-1)&&serit.querySelector('.tahminK')){ tahmin[adimNo]={atla:true}; adimGoster(adimNo,1); return; }   // 06.09: tahmin ekranında ileri = "göster"
      const j=Math.min(s.adimlar.length-1,Math.max(0,adimNo+d)); if(j===adimNo) return; adimGoster(j,d); };
    bOnce.addEventListener('click',()=>adimGit(-1)); bSonra.addEventListener('click',()=>adimGit(1));
    // fare tekerlegi, klavye oklari, parmakla yatay kaydirma (sola = ileri)
    let tekerKilit=0; serit.addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-tekerKilit<350) return; tekerKilit=t; adimGit((e.deltaY||e.deltaX)>0?1:-1); },{passive:false});
    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
}
