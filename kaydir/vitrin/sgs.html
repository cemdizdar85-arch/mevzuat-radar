<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".
   Varsayılan = sitenin açık paleti (stil-acik.css değerleri; stil.css BAĞLANMAZ: .kart/.sik/.btn/.kutu seçicileri çakışır).
   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. 24.09 Cem: VARSAYILAN KOYU ("sitenin rengi bu olsun"); beyaz yalnız düğmeyle (kc_tema=light) ya da ?tema=acik ile; işletim sistemi izlenmez, site de izlemiyor. */
/* 04.10 (Cem: kart ekranı da sitenin görsel dilinde): yazı lacivert (eski #16191d), ikincil lacivert-gri (eski #4b5563), vurgu laciverte çekildi (eski parlak mavi #1d4ed8), altın = site amberi (eski #a04a08). Zemin SAF BEYAZ kalır (09.09 Cem). */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#0f1b2d;--metin:#0f1b2d;--dim:#3d4b63;--mavi:#1f3b73;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#8a6224;--ustYazi:#ffffff}
:root[data-theme="dark"]{--bg:#141518;--bg2:#0f1013;--kart:#1e2026;--cizgi:#2e3138;--yazi:#e9e9ec;--metin:#e9e9ec;--dim:#9aa1ad;--mavi:#78b4ff;--yesil:#8fc98f;--kirmizi:#e07b7b;--altin:#e0a458;--ustYazi:#0f1013}
.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
/* 13.09 Cem: "nöbetçi çöz dediğinde sadece ekrandaki soru çözsün, başka alt alta soru olmasın."
   ?tek=1 = ana sayfa çerçevesi: YALNIZ #s=<sıra> kartı görünür, akış kaydırılamaz,
   "Sonraki" ve "yukarı kaydır" ipucu gizlenir (sonraki kart yokken yanıltır). */
:root[data-tek] #akis{overflow:hidden;scroll-snap-type:none}
:root[data-tek] #akis>*:not(.tekKart){display:none}
:root[data-tek] .bSonraki,:root[data-tek] .ipucu{display:none}
/* tek kartta dizi göstergeleri yanıltır: ilerleme noktaları, "10 / 10" sayacı, hazırlık skoru ve yanlış kutusu çipleri gizli. */
:root[data-tek] .noktalar,:root[data-tek] .ustSag{display:none}
/* 13.09 Cem: "renk koyu olsa, site rengi". Ana sayfa çerçevesi koyu açılır (tema=koyu);
   koyu temanın MAVİ vurgusu yalnız çerçevede sitenin BRONZUNA çevrilir. Ürünün kendi
   teması değişmez - kural data-tek'e bağlı, normal Kaydır-Çöz'e dokunmaz. */
:root[data-tek][data-theme="dark"]{--mavi:#e3b877}
/* 13.09 Cem onayı: akran satırı ("👥 9 adayın %89'u senin gibi B dedi") çerçevede gizli.
   Örneklem küçükken ilk kez gelen ziyaretçi "sitede 9 kişi var" diye okur. Üründe durur. */
:root[data-tek] .akranNot{display:none}
/* Aynı akran verisi şıkların üstüne de basılıyor (.sikYuzde: "B) 1,50 %89", "C) 1,67 %0").
   Öğrenci turunda görüldü: doğru cevabın yanında %0, ilk gelene "site bozuk mu" dedirtiyor. */
:root[data-tek] .sikYuzde{display:none}
/* 13.09 Cem seçimi (tek tek gidildi): Alarm rozeti (kişisel ustalık seviyesi, ilk gelene
   anlamsız ve kırmızı "Alarm" hata gibi okunuyor) ile cevap sonrası ikinci "Kâğıdım" düğmesi
   (üstteki "Kâğıt" aynı işi yapıyor) çerçevede gizli. "Daha fazla" ve "Sen çöz" KALDI. */
:root[data-tek] .seviye,:root[data-tek] .cKagit{display:none}
/* 13.09 Cem: "Hata bildir'i sil". Vitrinden gelen bildirim gerçek adayların bildirimleriyle
   aynı kutuya düşerdi; ana sayfa ziyaretçisine hata düğmesi de güven vermez. Üründe durur. */
/* Özgüllük: ürünün ".cipler.acikEk .cip2.ek{display:inline-block}" kuralı (0,4,0) "Daha fazla"
   açılınca ":root[data-tek] .cHata"yı (0,3,0) eziyordu - ölçüldü. Seçici (0,5,0)'a çıkarıldı, !important yok. */
:root[data-tek] .cipler .cip2.cHata{display:none}
/* 03.10 (Cem "Nöbetçi kartına sen bak"): tek kartta Kâğıt düğmesi alttan sağ üste - telefonda çerçeve kısa, soru/şık metninin
   üstüne biniyordu (canlı 390 px ölçüldü); üst köşe tek kipte boş (sayaç ve çipler gizli). Düğme kalır (13.09 Cem seçimi). */
:root[data-tek] .kagitAc{bottom:auto;top:8px;right:8px;padding:5px 10px;font-size:.78em}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:-apple-system,"Segoe UI",system-ui,Roboto,Arial,sans-serif;overflow:hidden}

.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}

.soruArac{display:flex;gap:6px;justify-content:flex-end;margin:-2px 0 4px}
.soruArac .arac{all:unset;box-sizing:border-box;cursor:pointer;font-size:.76em;font-weight:700;color:var(--dim);border:1px solid var(--cizgi);border-radius:999px;padding:4px 10px;min-height:28px;display:inline-flex;align-items:center}

.kutuNot{margin-top:6px;font-size:.88em;color:var(--dim)}
.tekrarUyari{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;font-size:.92em;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);box-shadow:0 8px 24px color-mix(in srgb,var(--yazi) 18%,transparent)}

.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}

@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}

.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}

.panel{overscroll-behavior:contain}

.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
const TEK=/[?&]tek=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');   /* 04.10 Cem (V2 madde 21): varsayılan AÇIK, site ile aynı (tema-bas.js); 24.09 'koyu' kararının yerine */
  if(VITRIN) d.setAttribute('data-vitrin','1');
  if(TEK) d.setAttribute('data-tek','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };
    ikon(); b.addEventListener('click',()=>{ const y=d.getAttribute('data-theme')==='dark'?'light':'dark'; if(y==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme'); try{ localStorage.setItem('kc_tema',y); }catch(e){} ikon(); }); });
})();

 ortaya çıkmaz.","E":"Kesin mizanda hesap kalanları hâlâ vardır ve sıfırlanmamıştır. Kalanların sıfırlanması ancak hesaplar kapatıldıktan sonra düzenlenen kapanış mizanında görülür.","D":"Genel geçici mizan envanterden ÖNCEki durumu gösterir, envanter kayıtlarını içermez. Mali tablolar kesin mizandan düzenlenir; geçici mizandan değil.","B":"Kesin mizan envanter işlemlerinden SONRA düzenlenir, değil öncesinde. Mali tablolar da bu kesin mizandan yapılır. Soruya göre genel geçici mizan envanterden önce, kesin mizan sonrasıdır."},"dogru":"Mizan yalnız borç ve alacak toplamlarının eşit olup olmadığını kontrol eder. 18.000 TL yanlış hesaba yazılıp karşı taraf doğru tutarla alacaklandırıldığından toplamlar yine eşit çıkar; bu hata mizanla yakalanmaz.","sinav":"Vergi Usul Kanunu 227. madde; mizan yalnız aritmetik eşitliği denetler, yanlış hesaba yapılan fakat borç-alacak dengesini koruyan kayıtlar mizanda görülmez.","kavramlar":[{"kaynak":"TEORI","tanim":"Defter-i kebir hesaplarının borç ve alacak toplamları ile kalanlarını gösteren; borç toplamı eşittir alacak toplamı ve borç kalanları eşittir alacak kalanları ilkesine göre denetim yapan cetveldir.","ad":"Mizan"},{"kaynak":"TEORI","tanim":"Dönem sonunda, envanter ve dönem sonu kayıtlarından ÖNCE düzenlenen mizan türüdür.","ad":"Genel geçici mizan"},{"kaynak":"TEORI","tanim":"Envanter ve dönem sonu kayıtlarından SONRA düzenlenen, mali tabloların düzenlendiği mizan türüdür.","ad":"Kesin mizan"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":10,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"İşletmenin muhasebe departmanı 2026 yılı Aralık ayında şu işlemleri gerçekleştirmiştir: Yevmiyede 153 Ticari Mallar hesabına kaydedilmesi gereken 18.000 TL\u0027lik mal alışı sehven 255 Demirbaşlar hesabına borç kaydedilmiş, karşılığında 100 Kasa hesabı doğru tutarla alacaklandırılmıştır; ayrıca dönem sonu envanter ve değerleme işlemleri tamamlanmıştır. Bu bilgilere göre aşağıdakilerden hangisi her zaman doğrudur?","kayitBaslik":"","id":"sgs-t2-fmuh-cokzor/kp-01","verilenler":[{"deger":"18.000 TL","anlam":"153 Ticari Mallar yerine 255 Demirbaşlar hesabına borç yazılan tutar; karşı taraf (100 Kasa) doğru tutarla alacaklandığı için borç-alacak toplamları yine eşit çıkar, bu yüzden mizanda görünmez.","ad":"Yanlış kayıt tutarı"}],"dayanak":"Muhasebe süreci ve mizan türleri - ders kitabı bilgisi (mizan sınırı ve genel geçici/kesin mizan ayrımı)","dogru":"A","oyunBonus":null,"ders":"Finansal Muhasebe","adimlar":[{"formul":"Olay: bir tekstil firmasında Ekim ayında 25.000 TL\u0027lik kumaş alışı sehven 255 Demirbaşlar hesabına borç kaydedilmiş, karşılığında 100 Kasa hesabı doğru tutarla alacaklandırılmış.","anlatim":"Kayıt hangi hesaba yazıldıysa yazılsın, borç tarafına 25.000 TL, alacak tarafına da 25.000 TL girmiş. Muhasebeci bu hatayı fark etmeden mizanı düzenliyor. Şimdi bu olayda mizanın ne göreceğine bakalım.","doldur":[]},{"formul":"Ne yapacağız: mizan sadece borç toplamı = alacak toplamı eşitliğini kontrol eder, 25.000 TL\u0027nin hangi hesaba yazıldığını denetlemez. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural tek: mizan aritmetik bir terazi gibi çalışır, hesap seçimi hatasını göremez. Şimdi A\u0027dan E\u0027ye kadar her ifadenin bu olayda geçerli olup olmadığını test edeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"p.mizan sınırı","karar":"doğru","anlatim":"Kumaş 255\u0027e yazılmış ama Kasa doğru tutarla alacaklandığı için borç toplamı yine alacak toplamına eşit. Mizan sadece toplam eşitliğine bakar, hangi hesaba yazıldığına bakmaz. O yüzden genel geçici mizanda da kesin mizanda da bu hata görünmez.","formul":"Şık A: muhasebeci \u0027bu hata hangi mizan düzenlenirse düzenlensin yakalanamaz\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"p.mizan türleri","karar":"yanlış","anlatim":"Bu olayda envanter işlemleri tamamlandıktan sonra düzenlenen mizan kesin mizandır, envanterden önce değil. Genel geçici mizan envanterden öncedir, kesin mizan sonrasıdır. Bu ifade sırayı ters kurduğu için yanlış.","formul":"Şık B: muhtar \u0027kesin mizan envanterden önce düzenlenir, mali tablolar buradan çıkar\u0027 diyor, doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"p.mizan sınırı","karar":"yanlış","anlatim":"Olayda 255\u0027e yazılan 25.000 TL borç, Kasa\u0027ya yazılan 25.000 TL alacakla dengeli. Toplamlar yine eşit çıkar, hiçbir mizanda fark oluşmaz. Bu yüzden bu ifade yanlış.","formul":"Şık C: kasiyer \u0027yanlış hesaba yapılan kayıt toplamları eşitsiz yapar, ilk mizanda görünür\u0027 diyor, haklı mı?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"p.mizan türleri","karar":"yanlış","anlatim":"Genel geçici mizan bu olayda envanterden önceki tabloyu gösterir, envanter kayıtlarını içermez. Mali tablolar ancak envanter sonrası düzenlenen kesin mizandan çıkar. Bu ifade kapsamı yanlış yerleştirdiği için yanlış.","formul":"Şık D: muhasebe müdürü \u0027mali tablolar genel geçici mizandan çıkar, çünkü o mizan envanteri de kapsar\u0027 diyor, onaylar mısın?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"p.mizan türleri","karar":"yanlış","anlatim":"Kesin mizanda hesapların kalanları hâlâ durur, bu olaydaki 255 ve 100 hesabı kalanlarıyla görünür. Kalanların sıfırlanması ancak hesaplar kapatıldıktan sonraki kapanış mizanına özgüdür. Bu ifade aşamayı karıştırdığı için yanlış.","formul":"Şık E: stajyer \u0027kesin mizanda hesap kalanları sıfırlanmış görünür\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Tek gerçek şu: mizan yalnız borç-alacak toplamlarının eşitliğini denetler, hesap seçimi hatasını hiçbir mizan yakalayamaz. Kendine hep şunu sor: bu hata iki tarafın toplamını mı bozuyor, yoksa sadece hangi hesaba yazıldığını mı değiştiriyor?","doldur":[]}],"anahtar":[{"ornek":"alacak","kok":"alacak"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"eşitliğini","kok":"eşitli"},{"ornek":"olayda","kok":"olayda"},{"ornek":"envanter","kok":"envant"},{"ornek":"mizanda","kok":"mizand"}],"konuGiris":{"harita":"Ne zaman test edilir: Hata, kayıt hesaba yanlış sınıflanmışsa mizan aşamasında değil, ancak hesap bazlı incelemede fark edilir. Nasıl ölçülür: Mizanın borç-alacak toplamları ve kalanları eşitliği aritmetik olarak kontrol edilir. Nasıl kaydedilir: Envanterden önce genel geçici mizan, envanter ve dönem sonu kayıtlarından sonra kesin mizan düzenlenir.","desen":"Soru, yanlış hesaba doğru tutarla yapılan kaydın mizan eşitliğini bozmayacağı tuzağını kurar; adaylar mizanın hatayı yakalayacağını düşünüp yanılır. Aynı zamanda dönem sonu envanter işlemleri tamamlandığı belirtildiği için kesin mizanın düzenlenmiş olduğu çıkarımı beklenir. Bu soru mizan sınırlılığı ve mizan türleri noktasından geliyor; arşivde 10 dönemde soruldu.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İşlemlerin tarih sırasıyla ilk kaydedildiği kronolojik defter","ad":"Yevmiye defteri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Envanter işlemlerinden önce düzenlenen dönem sonu mizanı","ad":"Genel geçici mizan","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Envanter ve dönem sonu kayıtlarından sonra, mali tabloların çıktığı mizan","ad":"Kesin mizan","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Borç toplamının alacak toplamına, borç kalanının alacak kalanına eşit olması denetimi","ad":"Mizan eşitliği","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda yanlış hesaba doğru tutarla yapılan bir kayıt ve envanter işleminin tamamlandığı verilir, hangi ifadenin her zaman doğru olduğu istenir.","panel_ornek":"Bir arkadaşın market alışverişinde 30 TL\u0027lik ekmeği yanlışlıkla \u0027temizlik ürünleri\u0027 fişine yazdırdığını düşün; toplam fiş tutarı yine doğru çıkar çünkü kasa toplamda hata görünmez, sadece hangi kalemin ne olduğu yanlıştır. Kasadaki toplamı kontrol eden görevli bu hatayı fark edemez, çünkü o sadece rakamların toplamını denetler.","ornek":"Bir arkadaşın market alışverişinde 30 TL\u0027lik ekmeği yanlışlıkla \u0027temizlik ürünleri\u0027 fişine yazdırdığını düşün; toplam fiş tutarı yine doğru çıkar çünkü kasa toplamda hata görünmez, sadece hangi kalemin ne olduğu yanlıştır. Kasadaki toplamı kontrol eden görevli bu hatayı fark edemez, çünkü o sadece rakamların toplamını denetler.","yontemler":"Mizanın yalnız aritmetik eşitliği kontrol ettiği, hangi hesaba yazıldığını denetlemediği kuralı uygulanır; envanter tamamlandığına göre düzenlenecek mizanın kesin mizan olacağı bilgisiyle seçenekler elenir.","nedir":"Muhasebe bilgi sistemi, mali işlemlerin belgeden mizana ve mali tabloya kadar hangi sırayla işlendiğini anlatan süreç bilgisidir. Sınav, bir hatanın hangi aşamada yakalanıp yakalanmayacağını ve mizan türlerinin ne zaman düzenlendiğini ölçer."},"olay":"18.000 TL, 153 yerine 255\u0027e borç yazılmış ama karşı taraf (100 Kasa) doğru tutarla alacaklandırılmış, dolayısıyla toplamlar yine eşit çıkar.","tuzak":{"C":{"ad":"Mizan Sınırı Tuzağı","metin":"öğrenci mizanı bir hata denetim aracı sanır, her yanlış kaydın mizanda görüneceğini düşünür. Doğrusu: mizan yalnız iki tarafın toplam eşitliğini gösterir; doğru tutarla ama yanlış hesaba yapılan kayıt eşitliği bozmadığı için mizanda ortaya çıkmaz."},"E":{"ad":"Mizan Türü Karıştırma Tuzağı","metin":"öğrenci kesin mizan ile kapanış mizanını aynı aşama sanır, kalanların ne zaman sıfırlandığını yanlış yerleştirir. Doğrusu: kesin mizanda hesap kalanları hâlâ vardır, kalanların sıfırlanması ancak hesaplar kapatıldıktan sonra düzenlenen kapanış mizanında görülür."},"D":{"ad":"Kapsam-Sıra Karışımı Tuzağı","metin":"öğrenci genel geçici mizanın da envanter kayıtlarını içerdiğini sanarak iki farklı kuralı (mizan türü sırası ve mali tablo kaynağı) birlikte yanlış kurar. Doğrusu: genel geçici mizan envanterden önceki durumu gösterir, mali tablolar yalnız kesin mizandan düzenlenir."},"B":{"ad":"Sıra Tuzağı","metin":"öğrenci genel geçici mizan ile kesin mizanın zamanlamasını karıştırır, envanterden önce/sonra ayrımını ters kurar. Doğrusu: kesin mizan envanter ve dönem sonu kayıtlarından SONRA düzenlenir, genel geçici mizan ise envanterden ÖNCEdir."}},"celdiriciYol":{"C":"Mizanın yalnız aritmetik eşitlik denetlediği unutulup her hesap hatasının mizanda görüneceği varsayılırsa bu ifadeye ulaşılır (mizan sınırı yanılgısı)","E":"Kesin mizan ile kapanış mizanı aynı aşama sayılırsa bu ifadeye ulaşılır (mizan türü karıştırma)","D":"Mizan türü sırası ile mali tabloların kaynağı kuralı üst üste yanlış birleştirilirse bu ifadeye ulaşılır (kapsam-sıra karışımı)","B":"Envanterden önce/sonra sırası ters kurulursa \u0027kesin mizan envanterden önce düzenlenir\u0027 sonucuna varılır (sıra tuzağı)"},"hap":"Mizan yalnız borç toplamı = alacak toplamı eşitliğini denetler; yanlış hesaba doğru tutarla yapılan kayıt bu eşitliği bozmadığı için hiçbir mizan türünde görünmez.","teshis":{"C":{"gercek":"Mizan yalnız iki tarafın toplam eşitliğini kontrol eder; hesap seçimi hatası toplamları etkilemediği için mizanda görünmez.","ayirt":"Hata, borç ile alacak toplamlarının birbirine eşitliğini bozuyor mu?","paragraf":"Muhasebe süreci ders bilgisi - mizan sınırı","yanilgi":"Mizanı bir hata avcısı gibi görüp, yanlış hesaba yapılan her kaydın mizanda mutlaka görüneceğine inanıyorsun."},"E":{"gercek":"Kesin mizanda hesap kalanları hâlâ mevcuttur; kalanların sıfırlanmış olması yalnız hesaplar kapatıldıktan sonra düzenlenen kapanış mizanına özgüdür.","ayirt":"Bu mizanda hesapların kalanı var mı, yoksa hepsi sıfırlanmış mı?","paragraf":"Muhasebe süreci ders bilgisi - mizan türleri","yanilgi":"Kesin mizan ile kapanış mizanını aynı aşamada sanıp kalanların kesin mizanda da sıfırlandığını düşünüyorsun."},"A":{"gercek":"Mizan yalnız borç toplamı = alacak toplamı eşitliğini denetler; yanlış hesaba doğru tutarla yapılan kayıt bu eşitliği bozmaz, dolayısıyla hiçbir mizan türünde yakalanmaz.","ayirt":"Bu hata iki tarafın toplamını değiştiriyor mu, yoksa sadece hangi hesaba yazıldığını mı değiştiriyor?","paragraf":"Muhasebe süreci ders bilgisi - mizan sınırı","yanilgi":"Bu şıkkı eleyen öğrenci, mizanın aritmetik bir kontrol aracı olduğunu gözden kaçırıp her hatanın mizanda görüneceğini düşünür."},"D":{"gercek":"Genel geçici mizan envanterden önceki durumu gösterir, dönem sonu kayıtlarını içermez; mali tablolar yalnız kesin mizandan düzenlenir.","ayirt":"Bu mizan envanter işlemlerini kapsıyor mu, yoksa öncesini mi gösteriyor?","paragraf":"Muhasebe süreci ders bilgisi - mizan türleri","yanilgi":"İki ayrı kuralı (mizan türlerinin sırası ve mali tabloların hangi mizandan çıktığı) birbirine karıştırıp genel geçici mizana envanter sonrası kapsam yüklüyorsun."},"B":{"gercek":"Kesin mizan, envanter ve dönem sonu (ayarlama) kayıtlarından SONRA düzenlenir ve mali tabloların kaynağıdır; genel geçici mizan bundan öncedir.","ayirt":"Bu mizan envanter kayıtlarından önce mi sonra mı hazırlanıyor?","paragraf":"Muhasebe süreci ders bilgisi - mizan türleri","yanilgi":"Genel geçici mizan ile kesin mizanın zamanlamasını ters kurup envanterden önceki mizanı \u0027kesin\u0027 sanıyorsun."}},"verilen":[[1,1]],"donem":10,"hesaplar":{}},{"capa":null,"kural":"Ticari borçların az gösterilip gösterilmediği test edilirken kayıtlı olmayan kalemler (ödenmemiş faturalar, teyide yanıt vermeyenler) ihtiyaca uygun kanıttır ve iptal edilen sipariş tutarı borç toplamına dahil edilmez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 82","sonDonem":3,"sim":{"dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Sapma sorularında önce \u0027kayıtlı mı büyük gerçek mi büyük\u0027 sorusunu kendine sor, sonra soruda geçen her sayının hesaba girip girmediğini tek tek kontrol et.","konu":"denetim kanıtı yeterliliği","tablo":{"satirlar":[["VERİLENLER","-"],["Kayıtlı ticari borç","940.000 TL"],["Teyitten doğrulanan tutar","900.000 TL"],["Ödenmemiş fatura tutarı","75.000 TL"],["İptal edilen sipariş tutarı","5.000 TL"],["HESAP","-"],["Gerçek borç toplamı (900.000 + 75.000)","975.000"],["Kayıtlı borç - Gerçek toplam farkı (975.000 - 940.000)","35.000 (az gösterme)"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"40.000 az gösterme","E":"Sapma yok","A":"35.000 az gösterme","D":"40.000 fazla gösterme","B":"35.000 fazla gösterme"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"İptal edilen sipariş (5.000 TL) hata ile dahil edilmiştir. Sapma kayıtlı borçla ilgisiz bu veriyi içermemelidir.","E":"Farklı kaynaklardan kanıtlar birbirini iptal etmez, aynı beyanı destekleyerek birleştirilir ve sapma ortaya çıkar.","A":"Doğru cevap. Gerçek borç 975.000 TL, kayıtlı tutar 940.000 TL olup fark 35.000 TL eksiktir.","D":"Hem iptal siparişini yanlış ekleyip hem de yönü tersine çevirmiştir. Doğru hesapta çeldirici veri dışlanır.","B":"Yön hatasıdır. Kayıtlı tutar gerçekten düşük çıkması az göstermeyi, fazla göstermeyi değil anlamına gelir."},"dogru":"Tedarikçi teyitleri (900.000) ve ödenmemiş faturalar (75.000) birleştirilince gerçek borç 975.000 TL çıkıyor. Kayıtlı 940.000 TL\u0027den 35.000 TL düşüktür. Borçlar az gösterilmiştir.","sinav":"Bağımsız Denetim Kanıtları Standardı 500 paragraf A31 uyarınca ticari borçların az gösterilip gösterilmediği test edilirken ödenmemiş faturalar ve tedarikçi beyanları gibi kayıtlı olmayan kanıtlar ihtiyaca uygundur.","kavramlar":[{"kaynak":"BDS 500 p.A31","tanim":"Denetim kanıtının testin amacı ile yönetim beyanı arasında mantıksal ilişki taşıması. Az gösterme testi için kayıtlı olmayan kalemler (ödenmemiş faturalar, tedarikçi beyanları) ihtiyaca uygundur.","ad":"İhtiyaca uygunluk"},{"kaynak":"BDS 500 paragraf 5","tanim":"Denetçinin denetim prosedürlerinden veya diğer kaynaklardan elde ettiği, ihtiyaca uygunluğu ve güvenilirliği değerlendirilen bilgiler.","ad":"Denetim kanıtı"},{"kaynak":"BDS 500 p.A32","tanim":"Farklı nitelikteki veya kaynaktan elde edilen denetim kanıtları çoğu zaman aynı yönetim beyanıyla ilgili olabilir ve birbirini iptal etmez, birleştirilebilir.","ad":"Farklı kaynaklardan kanıt"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":9,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Gerçek borç toplamı (800.000 + 90.000)","890.000"],["Gerçek toplam - Kayıtlı borç farkı (890.000 - 860.000)","30.000 (az gösterme)"]]},"tur":"tablo","soru":"İşletmenin kayıtlı ticari borç tutarı 860.000 TL\u0027dir. Tedarikçi teyitlerinden 800.000 TL doğrulanmış, teyide yanıt vermeyenler için ödenmemiş faturalardan 90.000 TL ek borç tespit edilmiştir. Dönem içinde iptal edilen sipariş tutarı 6.000 TL\u0027dir. Tespit edilen sapmanın tutarı ve yönü nedir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve sapmanın tutarı ile yönünü bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin kayıtlı ticari borç tutarı 940.000 TL\u0027dir. Tedarikçi teyitlerinden 900.000 TL doğrulanmış, teyide yanıt vermeyenler için ödenmemiş faturalardan 75.000 TL ek borç tespit edilmiştir. Dönem içinde iptal edilen sipariş tutarı 5.000 TL\u0027dir. Tespit edilen sapmanın tutarı ve yönü nedir?","kayitBaslik":"","id":"sgs-t1-denetim-cokzor/kp-01","verilenler":[{"deger":"940.000 TL","anlam":"İşletmenin defter kayıtlarındaki ticari borç bakiyesi, karşılaştırmanın esas alındığı tutar.","ad":"Kayıtlı ticari borç"},{"deger":"900.000 TL","anlam":"Tedarikçi teyit mektuplarıyla doğrudan doğrulanan borç kısmı, gerçek toplamın bir parçası.","ad":"Teyitten doğrulanan tutar"},{"deger":"75.000 TL","anlam":"Teyide yanıt vermeyenler için dönem sonrası tespit edilen ek borç, az gösterme testinde ihtiyaca uygun kanıt.","ad":"Ödenmemiş fatura tutarı"},{"deger":"5.000 TL","anlam":"Ticari borç bakiyesiyle ilgisi olmayan çeldirici veri, hesaba dahil edilmez.","ad":"İptal edilen sipariş tutarı"}],"dayanak":"BDS 500 p.A31 (ihtiyaca uygunluk ve test yönü); p.A32 (farklı kaynaklardan kanıtın aynı beyanı desteklemesi)","dogru":"A","oyunBonus":null,"ders":"Denetim","adimlar":[{"formul":"Soruda ne var: kayıtlı borç 940.000 TL (soruda verilen); teyitle doğrulanan 900.000 TL (soruda verilen); ek borç 75.000 TL (soruda verilen); iptal sipariş 5.000 TL (soruda verilen); sapma tutarı ve yönü soruluyor","anlatim":"Soru bize şunları vermiş: kayıtlı ticari borç 940.000 TL, teyitle doğrulanan 900.000 TL, teyide yanıt vermeyenlerin ödenmemiş faturalarından tespit edilen ek borç 75.000 TL. İptal edilen sipariş tutarı 5.000 TL de verilmiş ama bu borç toplamına girmeyecek bir çeldirici.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"BDS 500 nedir?","anlatim":"BDS 500 nedir? Denetçinin kanıt toplarken uyacağı kuralları anlatan standart - burada \u0027yeterli ve uygun kanıt\u0027 ilkesi devrede. Teyide yanıt vermeyen tedarikçiler için ödenmemiş fatura incelemesi bu standarda göre alternatif kanıttır.","doldur":[]},{"formul":"Gerçek borç toplamı = teyitle doğrulanan + ek borç = 900.000 (soruda verilen) + 75.000 (soruda verilen) = 975.000 TL","anlatim":"Şimdi biz hesaplıyoruz: teyitle doğrulanan tutar ile teyide cevap vermeyenlerden bulunan ek borcu topluyoruz. Bu iki kalem birlikte işletmenin gerçek borç toplamını verir.","doldur":[[6,1]]},{"formul":"Gerçek borç toplamı = teyitle doğrulanan + ek borç = 900.000 (soruda verilen) + 75.000 (soruda verilen) = 975.000 TL; Dahil değil: iptal edilen sipariş tutarı 5.000 (soruda verilen)","anlatim":"Dikkat: iptal edilen sipariş tutarı bu toplama girmez. Sipariş iptal olunca ortada bir borç doğmaz, o yüzden ticari borç hesaplamasında yeri yok.","doldur":[]},{"formul":"Sapma = gerçek toplam - kayıtlı borç = 975.000 (3. adımda bulduk) - 940.000 (soruda verilen) = 35.000 TL","anlatim":"Şimdi kayıtlı tutar ile gerçek toplamı karşılaştırıyoruz. Fark bize sapmanın büyüklüğünü verir.","doldur":[[7,1]]},{"formul":"büyük olan: kayıtlı 940.000 (soruda verilen) ile gerçek 975.000 (3. adımda bulduk) → gerçek büyük, yön: az gösterme","anlatim":"Sapmanın yönünü de belirliyoruz. Kayıtlı tutar gerçek tutardan küçük çıktığı için işletme borcunu az göstermiş.","doldur":[]},{"formul":"Sapma = 975.000 (3. adımda bulduk) - 940.000 (soruda verilen) = 35.000 TL, yön: az gösterme","anlatim":"SONUÇ: sapma 35.000 TL\u0027dir ve ticari borçlar az gösterilmiştir. Kayıtlı tutar gerçek tutarın altında kaldığı için yön hep \u0027az gösterme\u0027 çıkıyor.","doldur":[]},{"formul":"Ters durum: kayıtlı \u003e gerçek toplam → yön fazla gösterme","anlatim":"Ters durumda: kayıtlı tutar gerçek tutardan büyük olsaydı yön \u0027fazla gösterme\u0027 olurdu. Aynı yöntemle fark hesaplanır, sadece işaretin yorumu değişir.","doldur":[]},{"formul":"Yanlış yol: 900.000 + 75.000 + 5.000 = 980.000 TL (HATALI) → doğrusu 975.000 TL (3. adımda bulduk), sapma 35.000 TL","anlatim":"En sık hata: öğrenciler iptal edilen 5.000 TL\u0027yi de gerçek toplama ekleyip 980.000 TL buluyor. Bu yanlış çünkü iptal olan sipariş borç doğurmaz, kanıt kapsamına girmez.","doldur":[]}],"anahtar":[{"ornek":"kayıtlı","kok":"kayıtl"},{"ornek":"gösterme","kok":"göster"},{"ornek":"gerçek","kok":"gerçek"},{"ornek":"edilen","kok":"edilen"},{"ornek":"sipariş","kok":"sipari"},{"ornek":"toplamına","kok":"toplam"}],"konuGiris":{"harita":"Ne zaman test edilir: yönetim beyanının hangi yönde (fazla/az gösterme) risk taşıdığı belirlendiğinde test yönü seçilir. Nasıl ölçülür: kayıtlı tutarla bağımsız kaynaklardan (teyit, fatura, ödeme) elde edilen tutar karşılaştırılarak sapma hesaplanır. Nasıl kaydedilir: sapmanın tutarı ve yönü (fazla/az gösterim) çalışma kağıdında gerekçesiyle belirtilir.","desen":"Soru, kayıtlı tutarı test etmenin borçların eksik gösterilmesini yakalamaya uygun olmadığını, bunun yerine ödenmemiş faturalar ve teyitlerin kullanılmasını hatırlatır (p.A31). Tuzak, iptal edilen sipariş tutarının hesaplamaya dahil edilmesi gibi ilgisiz bir rakamın verilmesidir. Bu soru A31 paragrafındaki \u0027az gösterme testi\u0027 örneğinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Prosedürün amacı ile test edilen beyan arasındaki mantıksal bağlantı","ad":"İhtiyaca uygunluk","kim":"standart (BDS) sabitler"},{"kaynak":"soruda verilir","tanim":"Hesabın fazla mı az mı gösterildiğinin test edilme yönü","ad":"Test yönü","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"soruda verilir","tanim":"Üçüncü taraftan doğrudan alınan bağımsız borç tutarı bilgisi","ad":"Tedarikçi teyidi","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"sen hesaplarsın","tanim":"Kayıtlı tutardan gerçek/doğrulanmış tutarın çıkarılmasıyla bulunan fark","ad":"Sapma tutarı","kim":"denetçi mesleki yargıyla belirler"}],"sinavda":"Kayıtlı borç tutarı, teyit sonuçları ve ek tespit edilen fatura tutarı verilir; sapmanın tutarı ve yönü istenir.","panel_ornek":"İkinci el bir telefon ilanında satıcı \u0027borcu yok\u0027 diyor ama sen kutudaki faturayı, kargo kaydını ve son taksit dekontunu ayrı ayrı kontrol ediyorsun; sadece ilana bakmak yetmiyor. 3 farklı kaynak birbirini doğrulamazsa fiyat pazarlığında haklı çıkarsın.","ornek":"İkinci el bir telefon ilanında satıcı \u0027borcu yok\u0027 diyor ama sen kutudaki faturayı, kargo kaydını ve son taksit dekontunu ayrı ayrı kontrol ediyorsun; sadece ilana bakmak yetmiyor. 3 farklı kaynak birbirini doğrulamazsa fiyat pazarlığında haklı çıkarsın.","yontemler":"Doğrulanan teyit tutarına, teyide cevap vermeyenlerden tespit edilen ek borç eklenerek gerçek tutar bulunur; kayıtlı tutardan büyükse borç az gösterilmiştir. İptal edilen sipariş tutarı borç hesabını ilgilendirmediği için hesaplamaya katılmaz.","nedir":"Denetim kanıtı yeterliliği, denetçinin görüşünü dayandırdığı bilginin miktar ve kalite olarak yeterli olup olmadığıdır. Sınav, testin yönü ile hesabın şişirilme mi eksik gösterilme mi riskine karşı doğru prosedürün seçilip seçilmediğini ölçer."},"olay":"900.000 + 75.000 = 975.000; 975.000 - 940.000 = 35.000; kayıtlı tutar gerçek tutardan düşük olduğu için borç az gösterilmiştir.","tuzak":{"C":{"ad":"Çeldirici Veri Yükleme Tuzağı","metin":"Soruda geçen iptal edilen sipariş tutarını hesaba dahil ederek 900.000+75.000+5.000-940.000 işlemiyle 40.000 TL bulursun; oysa iptal edilen sipariş kayıtlı borçla ilgisiz bir veridir. Doğrusu: İptal edilen sipariş hesaba hiç katılmaz, gerçek sapma 35.000 TL\u0027dir."},"E":{"ad":"Kanıt Karıştırma Tuzağı","metin":"Teyit ve ödenmemiş fatura farklı kaynaklardan geldiği için birbirini teyit edip sapmayı sıfırladığını düşünürsün; oysa BDS 500 A32 uyarınca farklı kaynaklardan gelen kanıtlar aynı beyanı destekler, birbirini iptal etmez. Doğrusu: İki kanıt toplanarak kayıtlı tutarla karşılaştırılır ve 35.000 TL\u0027lik gerçek bir sapma ortaya çıkar."},"D":{"ad":"Çift Tuzak (Tutar+Yön) Tuzağı","metin":"Hem çeldirici sipariş tutarını hesaba katıp hem de yönü ters çevirerek 40.000 TL fazla gösterme dersin; bu iki ayrı hatanın üst üste binmesidir. Doğrusu: Doğru hesapta çeldirici veri dışlanır ve yön az göstermedir, sonuç 35.000 TL az göstermedir."},"B":{"ad":"Yön Tersleme Tuzağı","metin":"Kayıtlı tutarın gerçek tutardan düşük çıktığını görünce bunu \u0027fazla gösterme\u0027 sanırsın, oysa kayıtlı tutarın düşük kalması az gösterme demektir. Doğrusu: Aynı 35.000 TL fark az gösterme yönündedir, fazla gösterme değildir."}},"celdiriciYol":{"C":"900.000 + 75.000 + 5.000 - 940.000 = 40.000 (iptal edilen sipariş tutarı hataen borca dahil edildi)","D":"900.000 + 75.000 + 5.000 - 940.000 = 40.000 (çeldirici veri eklendi ve yön ters yorumlandı)","B":"975.000 - 940.000 = 35.000 (yön ters yorumlandı, az yerine fazla gösterme dendi)"},"hap":"İhtiyaca uygunluk test yönüne göre değişir; az gösterme şüphesinde kayıtlı olmayan kalemler (ödenmemiş fatura, teyit dışı borç) test edilir, kayıtlı tutar tek başına yeterli değildir.","teshis":{"C":{"gercek":"İhtiyaca uygunluk ilkesi gereği yalnız incelenen beyanla mantıksal bağlantısı olan kanıtlar hesaba katılır; iptal edilen sipariş ticari borç bakiyesiyle ilgisizdir.","ayirt":"Bu sayı, test ettiğim beyanla (ticari borç) doğrudan bağlantılı mı?","paragraf":"BDS 500 p.A31","yanilgi":"Soruda geçen her sayının hesaba girmesi gerektiğini düşünüp iptal edilen sipariş tutarını da toplarsın."},"E":{"gercek":"BDS 500 p.A32 uyarınca farklı kaynaklardan elde edilen kanıtlar çoğu zaman aynı beyanı birlikte destekler, toplanarak değerlendirilir.","ayirt":"Bu iki kanıt aynı beyanı mı destekliyor, birbirini mi iptal ediyor?","paragraf":"BDS 500 p.A32","yanilgi":"Farklı kaynaklardan gelen kanıtların birbirini geçersiz kıldığını ya da dengelediğini sanırsın."},"A":{"gercek":"BDS 500 p.A31 uyarınca az gösterme testinde kayıtlı olmayan kalemler toplanıp kayıtlı tutarla karşılaştırılır; fark doğrudan sapma tutarıdır.","ayirt":"Hesaba yalnız gerçek borcu oluşturan kanıtları mı kattım, çeldirici veriyi dışladım mı?","paragraf":"BDS 500 p.A31","yanilgi":"Bu şıkkı eleyen öğrenci, doğru sonucun basit bir çıkarma işlemiyle değil daha karmaşık bir formülle bulunması gerektiğini sanır."},"D":{"gercek":"Doğru çözümde hem çeldirici veri dışlanır hem de yön kayıtlı-gerçek farkının işaretine göre doğru belirlenir.","ayirt":"Hem tutarı hem yönü ayrı ayrı kontrol ettim mi?","paragraf":"BDS 500 p.A31","yanilgi":"Hem gereksiz veriyi eklersin hem de yönü ters çevirirsin, iki hatayı birden yaparsın."},"B":{"gercek":"Kayıtlı tutar gerçek tutardan düşükse borç az gösterilmiştir; yön kayıtlı-gerçek farkının işaretiyle belirlenir.","ayirt":"Kayıtlı tutar mı büyük, gerçek tutar mı büyük, önce bunu belirledim mi?","paragraf":"BDS 500 p.A31","yanilgi":"Kayıtlı tutarın düşük çıkmasını \u0027borç fazla yazılmış\u0027 gibi ters yorumlarsın."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":9,"hesaplar":{}},{"capa":null,"kural":"\u0027Although\u0027 zıtlık bağlacıdır; yan cümlede beklenen sonucun tersi ana cümlede yer alır. Burada yan cümle \u0027tüm kayıtlara tam erişim vardı\u0027 diyor; beklenen sonuç \u0027her şey doğrulandı\u0027 olurdu.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Cümle tamamlamada önce bağlacı işaretle, sonra \u0027bu bağlaç ne ilişkisi kuruyor\u0027 diye sor. Bağlaçla başlayan şıklar (because, so that, although) genelde çeldiricidir: cümlede zaten bir bağlaç vardır.","konu":"cümle tamamlama","tablo":{"satirlar":[["VERİLENLER","-"],["Bağlaç","Although"],["Yan cümle","Tüm kayıtlara tam erişim vardı"],["HESAP","-"],["Ne soruluyor","\u0027Although\u0027 ile başlayan yan cümleyi anlamca tamamlayan ana cümle isteniyor."],["Kural","\u0027Although\u0027 zıtlık bağlacıdır; yan cümlede beklenen sonucun tersi ana cümlede yer alır. Burada yan cümle \u0027tüm kayıtlara tam erişim vardı\u0027 diyor; beklenen sonuç \u0027her şey doğrulandı\u0027 olurdu."],["Doğru şık","C) they still could not verify the origin of several large payments"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"they still could not verify the origin of several large payments","E":"an independent expert was appointed by the board of directors","A":"they were able to complete the whole review well ahead of schedule","D":"the financial statements had been prepared in line with the standards","B":"the management refused to sign the letter of representation"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Mali tabloların standartlara uygun hazırlanması, tam erişimle aynı yönde olumlu bir yargıdır; zıtlık doğmadığından although ile bağlanamaz.","E":"Bağımsız uzman atanması ayrı bir olayı anlatır; denetçilerin kayıtlara erişebilmesiyle herhangi bir zıtlık ilişkisi kurmaz.","A":"İşin erken bitmesi, kayıtlara tam erişim sağlanması ile aynı yönde olumlu bir olaydır; although ile kurulması gereken zıtlık yoktur.","B":"Yönetimin beyan mektubunu imzalamaması, denetçilerin kayıtlara erişim imkanı ile mantıksal bir bağı yoktur; zıtlık ilişkisi kurmaz."},"dogru":"Denetçiler tüm muhasebe kayıtlarına erişebilmelerine rağmen, bazı büyük ödemelerin nereden geldiğini doğrulayamamışlardır. \u0027Rağmen\u0027 sözcüğü beklenen sonucun tersini gerektirir; erişim varsa doğrulama da olmalı, fakat burada doğrulama başarısız olmuştur.","sinav":"Although bağlacı zıtlık kurar; yan cümlede olumlu bir durum (tam erişim) varsa, ana cümlede beklenenin tersi sonuç gerekir; erişime rağmen bazı ödemelerin doğrulanamaması bu zıtlığı kurar.","kavramlar":[]},"cikmis":{"pencereDonemler":[],"kopru":18,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Although the audit team had full access to all the accounting records, ----.","kayitBaslik":"","id":"sgs-a6e-yabancidil-p1b/kp-01","verilenler":[{"deger":"Although","anlam":"Zıtlık kurar: yan cümlenin beklenen sonucu ana cümlede bozulur.","ad":"Bağlaç"},{"deger":"Tüm kayıtlara tam erişim vardı","anlam":"Beklenen sonuç: her şey doğrulandı.","ad":"Yan cümle"}],"dayanak":"Yabancı Dil dilbilgisi kuralı - Zıtlık bağlaçları (although / though / even though): yan cümlede belirtilen durumun doğal sonucu ana cümlede GERÇEKLEŞMEZ. Cümle tamamlamada ilk adım bağlacın kurduğu anlam ilişkisini (zıtlık, neden, amaç, koşul, zaman) belirlemektir.","dogru":"C","oyunBonus":null,"ders":"Yabancı Dil","adimlar":[{"formul":"Adım 1 = Bağlacı bul: Although -\u003e ZITLIK","anlatim":"Cümle tamamlamada bağlaç, aranacak anlam ilişkisini söyler. Although zıtlık kurar.","doldur":[]},{"formul":"Adım 2 = Yan cümlenin beklenen sonucunu yaz: tam erişim -\u003e her şey doğrulanır","anlatim":"Beklenen sonucu kendi cümlenle kurmak, doğru şıkkı görmeyi kolaylaştırır.","doldur":[[5,1]]},{"formul":"Adım 3 = Beklenenin TERSİNİ veren şıkkı seç: bazı ödemeler doğrulanamadı","anlatim":"C şıkkı erişime rağmen doğrulama yapılamadığını söyler; zıtlık tamdır.","doldur":[]},{"formul":"Adım 4 = Bağlaçla başlayan şıkları ele: because, so that, although","anlatim":"Cümlede zaten bağlaç var; ikinci bir bağlaçla başlayan şık yapıca bozuktur.","doldur":[[6,1]]}],"anahtar":[{"ornek":"cümlede","kok":"cümled"},{"ornek":"beklenenin","kok":"beklen"},{"ornek":"bağlaç","kok":"bağlaç"},{"ornek":"although","kok":"althou"},{"ornek":"zıtlık","kok":"zıtlık"},{"ornek":"sonucun","kok":"sonucu"}],"konuGiris":{"harita":"Ne zaman test edilir: cümledeki bağlaç ile boşluktaki anlam ilişkisinin uyup uymadığına bakılır. Nasıl ölçülür: seçilen şıkkın hem anlam hem yapı (isim mi cümle mi aldığı) kuralına uyup uymadığına bakılır. Nasıl kaydedilir: doğru şık, bağlacın gerektirdiği zıtlık/sebep/sonuç ilişkisini bozmayan tek seçenek olarak işaretlenir.","desen":"Sınav en çok zıtlık bağlaçlarını sorar, çünkü \u0027although\u0027 cümle alırken \u0027despite/in spite of\u0027 isim alır ve bu fark öğrenciyi kolayca tuzağa düşürür. Anlamca doğru görünen ama yapısı bozuk şıklar en çok kaybettiren noktadır. Bu soru bağlaç-yapı tuzağı noktasından geliyor (p. genel dilbilgisi kuralı, 18 dönemde çıkmış).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"zıtlık anlamı verir, kendisinden sonra tam cümle alır","ad":"although","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"zıtlık anlamı verir ama isim veya -ing alır, cümle almaz","ad":"despite / in spite of","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"sebep bildirir; because cümle, because of isim alır","ad":"because / because of","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"bağlaçların zıtlık, sebep, sonuç, amaç, zaman, koşul gruplarına ayrılmış listesi","ad":"anlam ilişkisi haritası","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Başında \u0027although\u0027 bulunan yarım bir cümle verilir, boşluğa bu zıtlık ilişkisini tam cümle biçiminde tamamlayan şık istenir.","panel_ornek":"Bir arkadaşın telefonuna 3 kere şifre denedi ama açamadı; \u0027her ne kadar 3 hakkı olsa da\u0027 sonuçta telefonu açamadı çünkü bilgi yanlıştı. İşte \u0027although\u0027 da tam böyle: elindeki şeye rağmen beklenmeyen bir sonuç anlatır.","ornek":"Bir arkadaşın telefonuna 3 kere şifre denedi ama açamadı; \u0027her ne kadar 3 hakkı olsa da\u0027 sonuçta telefonu açamadı çünkü bilgi yanlıştı. İşte \u0027although\u0027 da tam böyle: elindeki şeye rağmen beklenmeyen bir sonuç anlatır.","yontemler":"Önce boşluktan önceki bağlacı bul ve anlam grubunu belirle, sonra şıklardan bu bağlacın gerektirdiği yapıyı (cümle mi isim mi) taşıyanı seç.","nedir":"Bu konu, cümlenin başındaki bağlaca göre boşluğa mantıken ve dilbilgisel olarak uyan parçayı bulmayı öğretir. Sınav, bağlaç-anlam ilişkisini ve zaman/yapı uyumunu doğru kurup kurmadığını ölçer."},"olay":"","tuzak":{"D":{"ad":"Yön Tuzağı","metin":"Tabloların standartlara uygun hazırlanmış olması erişimle aynı yönde olumlu bir yargıdır. Doğrusu: zıtlık için olumsuz bir sonuç gerekir."},"E":{"ad":"Bağlantı Tuzağı","metin":"Bağımsız uzman atanması ayrı bir olaydır, yan cümleyle zıtlık ilişkisi kurmaz. Doğrusu: ana cümle yan cümlenin beklentisini bozmalıdır."},"A":{"ad":"Zıtlık Tuzağı","metin":"\u0027Although\u0027 iki yargı arasında zıtlık kurar; erişim kolaylığı ile işin erken bitmesi aynı yönde olduğu için zıtlık doğmaz. Doğrusu: yan cümleyle ters düşen bir sonuç gerekir."},"B":{"ad":"İlgi Tuzağı","metin":"Yönetimin beyan mektubunu imzalamaması, kayıtlara erişimle mantıksal olarak bağlanmaz. Doğrusu: sonuç, erişim olgusuyla çelişmelidir."}},"celdiriciYol":{},"hap":"Although gördüğünde ana cümlede beklenenin TERSİNİ ara; iki olumlu yargı yan yana gelmez.","teshis":{"C":{"gercek":"Zıtlık bağlacı, yan cümledeki koşulun beklenen sonucunu ana cümlede bozar; \u0027erişim vardı ama doğrulayamadılar\u0027 tam bu yapıdır.","ayirt":"Beklenen sonuç bozuluyor mu?","paragraf":"Cümle tamamlama - zıtlık bağlaçları","yanilgi":"Bu şıkkı eleyen öğrenci, \u0027although\u0027 cümlesinde ana cümleyi de olumlu kurmaya çalışır."},"E":{"gercek":"İlgi yetmez, mantıksal karşıtlık gerekir.","ayirt":"Karşıtlık var mı?","paragraf":"Cümle tamamlama - anlam ilişkisi","yanilgi":"Konuyla ilgili görünen her cümleyi uygun sanıyorsun."},"A":{"gercek":"\u0027Although\u0027 uyum değil çelişki ister.","ayirt":"İki yargı aynı yöne mi bakıyor?","paragraf":"Cümle tamamlama - zıtlık bağlaçları","yanilgi":"Zıtlığı gözden kaçırıp anlamca uyumlu ilk seçeneği alıyorsun."},"D":{"gercek":"\u0027Although\u0027 olumlu-olumlu birleşimi kabul etmez.","ayirt":"Yargılar ters mi?","paragraf":"Cümle tamamlama - zıtlık bağlaçları","yanilgi":"İki olumlu yargıyı yan yana koyuyorsun."},"B":{"gercek":"Olumsuzluk yetmez, olumsuzluk yan cümlenin konusuyla ilgili olmalıdır.","ayirt":"Olumsuzluk aynı konuda mı?","paragraf":"Cümle tamamlama - anlam ilişkisi","yanilgi":"Olumsuz bir yargı görünce zıtlık kurulduğunu sanıyorsun."}},"verilen":[[4,1],[1,1],[2,1]],"donem":18,"hesaplar":{}},{"capa":null,"kural":"NGD = nihai satış değeri - ek işleme maliyeti; B payı, dağıtılacak net ortak maliyetin (Z düşülmüş) NGD oranına eşittir; yan ürünün satış geliri bu net tutara geri eklenerek gerçek ortak maliyete ulaşılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 58","sonDonem":4,"sim":{"dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ters sorularda önce \u0027sonuç verilmiş, hangi ara adım isteniyor\u0027 diye zincire baştan değil sondan bak; oranı bul, oradan geriye giderek dağıtılacak taban tutarı hesapla.","konu":"ortak maliyet dağıtımı","tablo":{"satirlar":[["VERİLENLER","-"],["A ek işleme maliyeti","100.000 TL"],["B ek işleme maliyeti","30.000 TL"],["A nihai satış değeri","300.000 TL"],["B nihai satış değeri","150.000 TL"],["Z yan ürün satış geliri","20.000 TL"],["B\u0027ye dağıtılan ortak maliyet payı","96.000 TL"],["HESAP","-"],["A ürünü net gerçekleşebilir değeri (300.000-100.000)","200.000"],["B ürünü net gerçekleşebilir değeri (150.000-30.000)","120.000"],["Toplam net gerçekleşebilir değer","320.000"],["B ürünü dağıtım oranı (120.000/320.000)","%37,5"],["Dağıtılacak net ortak maliyet (96.000/0,375)","256.000"],["Toplam birleşik (ortak) üretim maliyeti (256.000+20.000)","276.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"276.000","E":"308.000","A":"236.000","D":"288.000","B":"256.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Net Gerçekleşebilir Değeri hesaplarken ek işleme maliyetlerini çıkarmadığın için yanlış orana göre dağıttın, ayrıca yan ürün tutarını da hiç eklemedin.","E":"Hem ek işleme maliyetini dağıtım oranında kullanmadın hem de sonuçla yan ürün tutarını düzensiz şekilde birleştirerek iki hata yaptın.","A":"Yan ürün gelirini ortak maliyetten çıkarırken ayrıca net tutardan da çıkardığın için cevap küçük çıktı. Yan ürün tutarı bir kez düşülüyor, sonra toplam maliyeti bulurken geri ekliyoruz.","B":"Net dağıtılacak tutarı 256.000 TL olarak bulduktan sonra durdun, yan ürünün indirilmiş tutarını geri eklemeyi unuttun. Bu 256.000 zaten yan ürün sonrası tutardır, toplam için üzerine yan ürün geliri eklenir."},"dogru":"Yan ürünün satış geliri ortak maliyetten düşülerek net dağıtılacak tutar bulunur. Bu net tutarı, B ürününün Net Gerçekleşebilir Değer oranına bölerek toplam net maliyeti elde ederiz. Son adımda yan ürünün tutarını geri ekleyerek gerçek ortak maliyete ulaşırız.","sinav":"Net Gerçekleşebilir Değer yöntemi, ayrılma noktasından sonra ek işleme maliyeti düşüldükten sonra kalan satış değerine göre ortak maliyeti orantılı olarak dağıtır ve yan ürüne pay verilmeyip satış geliri ortak maliyetten indirilir.","kavramlar":[{"kaynak":"TEORI","tanim":"Ürünün nihai satış değerinden ek işleme ve satış maliyetleri çıkarıldıktan sonra kalan tutar; ortak maliyetin dağıtılması sırasında dağıtım anahtarı olarak kullanılır.","ad":"Net Gerçekleşebilir Değer (NGD)"},{"kaynak":"TEORI","tanim":"Aynı hammadde ve süreçten ayrılma noktasına kadar birden fazla ürünün birlikte katlandığı, doğrudan izlenmesi mümkün olmayan maliyet.","ad":"Ortak (Birleşik) Maliyet"},{"kaynak":"TEORI","tanim":"Birleşik üretim sürecinde ana ürünle birlikte ortaya çıkan, satış değeri ana ürüne göre düşük kalan ürün; ortak maliyetten pay almaz, satış geliri ortak maliyetten düşülür.","ad":"Yan Ürün"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":13,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Toplam birleşik (ortak) üretim maliyeti (verilen)","300.000"],["P ürünü net gerçekleşebilir değeri (400.000-50.000)","350.000"],["R ürünü net gerçekleşebilir değeri (250.000-40.000)","210.000"],["Toplam net gerçekleşebilir değer","560.000"],["P ürünü dağıtım oranı (350.000/560.000)","%62,5"],["Dağıtılacak net ortak maliyet (300.000-15.000)","285.000"],["P ürününe isabet eden ortak maliyet payı (285.000x0,625)","178.125"]]},"tur":"tablo","soru":"Bir mobilya işletmesinde P ve R ana ürünleri ile T yan ürünü aynı ortak üretim sürecinden elde edilmektedir. Ayrılma noktasından sonra P ürününe 50.000 TL, R ürününe 40.000 TL ek işleme maliyeti yüklenmekte; P ürününün nihai satış değeri 400.000 TL, R ürününün nihai satış değeri 250.000 TL\u0027dir. T yan ürününün satış geliri 15.000 TL olup yan ürüne ortak maliyetten pay verilmemekte, bu tutar ortak maliyetten düşülmektedir. İşletmenin toplam birleşik (ortak) üretim maliyeti 300.000 TL\u0027dir. Net gerçekleşebilir değer yöntemine göre dağıtım yapıldığında P ürününe isabet eden ortak maliyet payı kaç TL\u0027dir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve P ürününe isabet eden ortak maliyet payının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir tekstil işletmesinde A ve B ana ürünleri ile Z yan ürünü aynı ortak üretim sürecinden elde edilmektedir. Ayrılma noktasından sonra A ürününe 100.000 TL, B ürününe 30.000 TL ek işleme maliyeti yüklenmekte; A ürününün nihai satış değeri 300.000 TL, B ürününün nihai satış değeri 150.000 TL\u0027dir. Z yan ürününün satış geliri 20.000 TL olup yan ürüne ortak maliyetten pay verilmemekte, bu tutar ortak maliyetten düşülmektedir. Net gerçekleşebilir değer yöntemine göre yapılan dağıtım sonucunda B ürününe isabet eden ortak maliyet payı 96.000 TL olarak hesaplanmıştır. Buna göre işletmenin toplam birleşik (ortak) üretim maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-cokzor/kp-01","verilenler":[{"deger":"100.000 TL","anlam":"A ürününün ayrılma noktasından sonraki ek maliyeti; NGD hesabında nihai satış değerinden düşülür","ad":"A ek işleme maliyeti"},{"deger":"30.000 TL","anlam":"B ürününün ayrılma noktasından sonraki ek maliyeti; NGD hesabında nihai satış değerinden düşülür","ad":"B ek işleme maliyeti"},{"deger":"300.000 TL","anlam":"A ürününün tamamlanmış haldeki satış değeri; NGD hesabının başlangıç noktası","ad":"A nihai satış değeri"},{"deger":"150.000 TL","anlam":"B ürününün tamamlanmış haldeki satış değeri; NGD hesabının başlangıç noktası","ad":"B nihai satış değeri"},{"deger":"20.000 TL","anlam":"Yan ürüne pay verilmez, bu tutar önce ortak maliyetten düşülür, toplam ortak maliyeti bulurken geri eklenir","ad":"Z yan ürün satış geliri"},{"deger":"96.000 TL","anlam":"Sonuç olarak verilen tutar; buradan geriye gidilerek toplam ortak maliyet bulunur (ters soru)","ad":"B\u0027ye dağıtılan ortak maliyet payı"}],"dayanak":"Ortak maliyet dağıtımı - net gerçekleşebilir değer yöntemi ve yan ürün maliyetlendirmesi (maliyet muhasebesi teorisi, mevzuat maddesi yok)","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: A ek işleme maliyeti 100.000 TL (soruda verilen); B ek işleme maliyeti 30.000 TL (soruda verilen); A nihai satış değeri 300.000 TL (soruda verilen); B nihai satış değeri 150.000 TL (soruda verilen); Z satış geliri 20.000 TL (soruda verilen); B\u0027ye isabet eden ortak maliyet payı 96.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: A\u0027ya 100.000 TL, B\u0027ye 30.000 TL ek işleme maliyeti var. A\u0027nın nihai satışı 300.000 TL, B\u0027nin 150.000 TL, Z\u0027nin satış geliri 20.000 TL ve B\u0027ye düşen pay 96.000 TL olarak verilmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]]},{"formul":"Net Gerçekleşebilir Değer = Nihai Satış Değeri - Ek İşleme Maliyeti","anlatim":"Net gerçekleşebilir değer, ürünün son satış fiyatından kalan ek işleme maliyetinin çıkarılmasıyla bulunur. Bunu neden yapıyoruz? Çünkü ortak maliyeti ayrılma noktasındaki gerçek değere göre paylaştırmak istiyoruz.","doldur":[]},{"formul":"A ürünü net gerçekleşebilir değeri = 300.000 (soruda verilen) - 100.000 (soruda verilen) = 200.000","anlatim":"Önce A\u0027nın net gerçekleşebilir değerini buluyoruz. A\u0027nın satış değerinden kendi ek işleme maliyetini düşüyoruz.","doldur":[[8,1]]},{"formul":"B ürünü net gerçekleşebilir değeri = 150.000 (soruda verilen) - 30.000 (soruda verilen) = 120.000","anlatim":"Aynı işlemi B için yapıyoruz - B\u0027nin satış değerinden kendi ek işleme maliyetini çıkarıyoruz.","doldur":[[9,1]]},{"formul":"Toplam net gerçekleşebilir değer = 200.000 (3. adımda bulduk) + 120.000 (4. adımda bulduk) = 320.000","anlatim":"Dağıtım oranını kurabilmek için iki ürünün net gerçekleşebilir değerlerini topluyoruz. Bu toplam, paylaştırma işleminin paydası olacak.","doldur":[[10,1]]},{"formul":"B ürünü dağıtım oranı = 120.000 (4. adımda bulduk) / 320.000 (5. adımda bulduk) = %37,5","anlatim":"B\u0027nin toplam içindeki payını oran olarak buluyoruz. Bu oran, ortak maliyetten B\u0027ye ne kadar düşeceğini belirler.","doldur":[[11,1]]},{"formul":"Dağıtılacak net ortak maliyet = B payı / B oranı = 96.000 (soruda verilen) / %37,5 (6. adımda bulduk) = 256.000; Dahil değil: Z yan ürünü satış geliri 20.000 (soruda verilen) burada henüz eklenmiyor","anlatim":"Soru bize B\u0027nin payını zaten vermiş, biz de oranı biliyoruz - geriye doğru giderek dağıtılacak toplam net ortak maliyeti buluyoruz. Dikkat: Z\u0027nin geliri bu aşamada henüz devrede değil, çünkü yan ürüne pay verilmiyor.","doldur":[[12,1]]},{"formul":"Toplam birleşik (ortak) üretim maliyeti = 256.000 (7. adımda bulduk) + 20.000 (soruda verilen) = 276.000","anlatim":"Yan ürünün satış geliri ortak maliyetten düşülerek dağıtım yapılmıştı, o yüzden gerçek toplam maliyete ulaşmak için bu tutarı geri ekliyoruz. Çünkü Z\u0027nin geliri baştan ortak maliyeti azaltmıştı.","doldur":[[13,1]]},{"formul":"Ters durum: yan ürüne pay verilseydi → Z geliri ortak maliyetten düşülmez, direkt gelir yazılır","anlatim":"Ters durumda: yan ürüne de pay verilseydi, Z\u0027nin satış geliri ortak maliyetten düşülmez, direkt hasılat olarak kaydedilirdi.","doldur":[]},{"formul":"Yanlış yol: dağıtılacak net ortak maliyeti direkt cevap yazmak = 256.000 (HATALI) → doğrusu 20.000 eklenip 276.000 (8. adımda bulduk)","anlatim":"En sık hata: 256.000\u0027i cevap sanıp Z\u0027nin gelirini eklemeyi unutmak. Soru net ortak maliyeti değil, toplam birleşik üretim maliyetini soruyor.","doldur":[]}],"anahtar":[{"ornek":"maliyetinin","kok":"maliye"},{"ornek":"geliri","kok":"geliri"},{"ornek":"gerçekleşebilir","kok":"gerçek"},{"ornek":"işleme","kok":"işleme"},{"ornek":"dağıtım","kok":"dağıtı"},{"ornek":"değerinden","kok":"değeri"}],"konuGiris":{"harita":"Ne zaman test edilir: Ayrılma noktasından sonra ek işlem gören ürünlerin ortak maliyeti paylaşılacağında. Nasıl ölçülür: Her ürünün net gerçekleşebilir değeri (nihai satış - ek maliyet) bulunup toplam ortak maliyet bu oranla dağıtılır. Nasıl kaydedilir: Yan ürün geliri ortak maliyetten düşülür, kalan tutar ana ürünlere NGD oranında paylaştırılır.","desen":"Sınav genelde bir ürünün payını verip toplam ortak maliyeti geriye doğru buldurur, öğrenci NGD hesabında ek maliyeti düşmeyi unutur. Yan ürün gelirinin ortak maliyetten düşülmesi de sıkça atlanır. Bu soru NGD dağıtım ve yan ürün geliri düşümü noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Nihai satış değerinden ayrılma noktası sonrası ek işleme maliyeti düşülünce kalan tutar","ad":"Net gerçekleşebilir değer (NGD)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Ayrılma noktasına kadar tüm ürünler için birlikte katlanılan, dağıtılacak tek maliyet havuzu","ad":"Ortak (birleşik) maliyet","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Ayrılma noktasından sonra tek bir ürüne doğrudan yüklenen, dağıtılmayan maliyet","ad":"Ek işleme maliyeti","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Yan ürünün satış gelirinin ortak maliyet havuzundan indirilmesi kuralı","ad":"Yan ürün geliri düşümü","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Ürünlerin nihai satış değerleri, ek işleme maliyetleri, yan ürün geliri ve bir ürüne isabet eden pay verilip toplam ortak maliyet istenir.","panel_ornek":"Sen ve iki arkadaşın ortak bir kargo kutusu paylaşıyorsunuz, kutunun kargo ücreti 60 TL. Senin eşyan daha değerli olduğu için payını değerine göre hesaplıyorsun, arkadaşınki daha ucuz eşya olduğu için daha az ödüyor. Kutudaki bir küçük eşyayı ise ücretsiz taşıtıyorsunuz, onun payı hiç hesaba katılmıyor.","ornek":"Sen ve iki arkadaşın ortak bir kargo kutusu paylaşıyorsunuz, kutunun kargo ücreti 60 TL. Senin eşyan daha değerli olduğu için payını değerine göre hesaplıyorsun, arkadaşınki daha ucuz eşya olduğu için daha az ödüyor. Kutudaki bir küçük eşyayı ise ücretsiz taşıtıyorsunuz, onun payı hiç hesaba katılmıyor.","yontemler":"Tek yöntem NGD\u0027dir: her ürünün NGD\u0027si bulunur, oranı verilen pay üzerinden toplam ortak maliyet (yan ürün geliri düşüldükten sonraki tutar) ters çözülür, sonra yan ürün geliri geri eklenir.","nedir":"Ortak maliyet dağıtımı, aynı süreçten çıkan birden fazla ürüne ayrılma noktasına kadarki maliyeti paylaştırma yöntemidir. Sınav, net gerçekleşebilir değere göre doğru orantılama yapılıp yapılamadığını ölçer."},"olay":"NGD_A=300.000-100.000=200.000; NGD_B=150.000-30.000=120.000; toplam NGD=320.000; B oranı=120.000/320.000=0,375; net ortak maliyet=96.000/0,375=256.000; toplam ortak maliyet=256.000+20.000=276.000.","tuzak":{"D":{"ad":"Ölçüt Karışıklığı Tuzağı","metin":"NGD hesaplarken ek işleme maliyetlerini düşmeden doğrudan nihai satış değerlerini oranladın, ayrıca yan ürün gelirini eklemedin. Doğrusu: dağıtım anahtarı ek işleme maliyeti düşülmüş NGD\u0027dir, nihai satış değeri değildir."},"E":{"ad":"Bileşik Hata Tuzağı","metin":"hem yanlış oranla (ek işleme maliyetini düşmeden) net tutarı buldun hem de sonuna Z\u0027yi ekleyerek iki hatayı birleştirdin. Doğrusu: doğru oran NGD\u0027den, doğru toplam ise Z\u0027nin doğru orana dayalı net tutara eklenmesinden gelir."},"A":{"ad":"Ters İşaret Tuzağı","metin":"Yan ürün satış gelirinin ortak maliyetten düşüldüğünü gördüğün için toplam ortak maliyeti bulurken bu tutarı dağıtılacak net tutardan bir kez daha çıkardın. Doğrusu: Z\u0027nin satış geliri, net dağıtılacak tutara geri EKLENEREK toplam birleşik maliyete ulaşılır."},"B":{"ad":"Atlanan Katman Tuzağı","metin":"96.000 TL\u0027yi 0,375 orana bölerek bulduğun 256.000\u0027i doğrudan toplam ortak maliyet sandın, yan ürünün düşülmüş olan payını geri eklemeyi unuttun. Doğrusu: 256.000, Z düşüldükten SONRAKİ net dağıtılabilir tutardır, toplam ortak maliyet için üzerine Z eklenir."}},"celdiriciYol":{"D":"96.000 / (150.000/450.000) = 288.000 (NGD hesaplarken ek işleme maliyetini düşmeden nihai satış değerlerini oranladı, Z\u0027yi eklemedi)","E":"96.000 / (150.000/450.000) + 20.000 = 308.000 (yanlış oranla bulunan tutara üstüne Z\u0027yi ekledi)","A":"256.000 - 20.000 = 236.000 (Z yan ürün satış gelirini toplam ortak maliyetten ikinci kez çıkardı)","B":"96.000 / 0,375 = 256.000 (yan ürün satış gelirini toplam ortak maliyete hiç eklemedi, net tutarı toplam sandı)"},"hap":"Net gerçekleşebilir değer yönteminde dağıtım anahtarı, nihai satış değerinden ek işleme maliyetinin düşülmesiyle bulunan NGD\u0027dir; yan ürünün ortak maliyetten düşülen satış geliri, toplam birleşik maliyete geri eklenerek bulunur.","teshis":{"C":{"gercek":"NGD oranıyla bulunan net tutara yan ürün satış geliri eklenince gerçek (birleşik) ortak maliyete ulaşılır.","ayirt":"Yan ürünün payını hem oran hesabından hem de son toplamdan doğru yerde mi kullandım?","paragraf":"Ortak maliyet dağıtımı ve yan ürün kuralı","yanilgi":"Bu şıkkı atlayan öğrenci, dağıtım oranını doğru kurduğu halde Z\u0027yi toplama eklemeyi gözden kaçırmıştır."},"E":{"gercek":"Z\u0027yi eklemek doğru adımdır ama önce oranın (NGD\u0027nin) doğru hesaplanmış olması gerekir; yanlış tabana doğru bir ekleme yapmak sonucu düzeltmez.","ayirt":"Eklediğim düzeltme, doğru bir tabana mı uygulanıyor?","paragraf":"Ortak maliyet dağıtımı - NGD yöntemi teorisi","yanilgi":"Yanlış oranla bulduğun net tutarın hatalı olduğunu fark etmeden üzerine Z\u0027yi ekleyip \u0027düzelttiğini\u0027 sandın."},"A":{"gercek":"Z\u0027nin satış geliri net dağıtılacak tutardan BİR KEZ düşülür; toplam ortak maliyete geri dönerken aynı tutar geri eklenir, ikinci kez çıkarılmaz.","ayirt":"Bu işlemi zaten bir kez yaptım mı, şimdi tersini mi yapmam gerekiyor?","paragraf":"Ortak maliyet dağıtımı - NGD yöntemi teorisi","yanilgi":"Z\u0027nin ortak maliyetten düşüldüğünü öğrendiğin için toplam maliyeti bulurken de aynı işlemi tekrar uygulayıp çıkarma yaptın."},"D":{"gercek":"NGD, nihai satış değerinden ek işleme maliyetinin düşülmesiyle bulunur; bu düşülmeden yapılan oran yanlış dağıtım anahtarı üretir.","ayirt":"Kullandığım değer ayrılma noktasındaki NET değer mi, yoksa ham nihai satış fiyatı mı?","paragraf":"Net gerçekleşebilir değer yöntemi tanımı","yanilgi":"NGD\u0027yi hesaplarken ek işleme maliyetini düşmeyi gereksiz sanıp doğrudan nihai satış değerlerini oranladın."},"B":{"gercek":"Bu tutar yalnızca Z düşüldükten sonraki net dağıtılabilir ortak maliyettir; toplam birleşik maliyet için yan ürün geliri geri eklenir.","ayirt":"Bulduğum tutar \u0027net\u0027 mi yoksa \u0027toplam\u0027 mı; soru hangisini istiyor?","paragraf":"Yan ürün maliyetlendirmesi - ters hesaplama notu","yanilgi":"96.000/0,375 işleminden çıkan sayının doğrudan soruda istenen toplam ortak maliyet olduğunu sandın."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"donem":13,"hesaplar":{}},{"capa":null,"kural":"Net satış = kalem tutarı / (kalem yüzdesi/100); ardından her kalem kendi yüzdesiyle net satıştan türetilir, faaliyet karı yüzdesi = 100 - SMM yüzdesi - faaliyet gideri yüzdesi.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 69","sonDonem":4,"sim":{"dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce hangi kalemin hem tutarı hem yüzdesi verilmiş bul, tabanı (net satışı) oradan kur; finansman gideri gibi faaliyet dışı kalemleri zincire hiç sokma.","konu":"dikey yüzde analizi","tablo":{"satirlar":[["VERİLENLER","-"],["SMM yüzdesi","%65"],["SMM tutarı","520.000 TL"],["Faaliyet giderleri yüzdesi","%20"],["Finansman gideri","30.000 TL"],["HESAP","-"],["Net Satışlar (520.000 / 0,65)","800.000"],["Satılan Malın Maliyeti","520.000"],["Brüt Satış Karı (800.000 - 520.000)","280.000"],["Faaliyet Giderleri (800.000 x 0,20)","160.000"],["Faaliyet Karı (280.000 - 160.000)","120.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"120.000","E":"640.000","A":"50.700","D":"176.000","B":"90.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Faaliyet giderlerini yüzde oranı olarak net satışlara değil de satılan malın maliyeti tutarına uygularsan (520.000 × 0,20), faaliyet karını olduğundan yüksek hesaplarsın.","E":"Brüt satış karı adımını atlayıp doğrudan net satışlardan yalnız faaliyet giderini düşüp satılan malın maliyetini hiç hesaba katmazsan, faaliyet karını yüksek bulursun.","A":"Net satışı bulmak için satılan malın maliyetini yüzdesine bölmen gerekirken yüzdesiyle çarparsan (520.000 × 0,65), net satışı çok küçük bulursun ve faaliyet karı da hatalı çıkar.","B":"Faaliyet karı hesaplandıktan sonra finansman gideri düşülür; faaliyet karı hesabında finansman gideri hiç yer almadığı halde 120.000\u0027den 30.000 çıkarıp yanılırsın."},"dogru":"Net satışı bulmak için satılan malın maliyeti tutarını yüzdesine böl (520.000 ÷ 0,65 = 800.000). Brüt satış karını hesapla (800.000 − 520.000 = 280.000). Faaliyet giderlerini net satışlardan çıkar (800.000 × 0,20 = 160.000) ve faaliyet karını bul (280.000 − 160.000 = 120.000).","sinav":"Gelir tablosu dikey yüzde analizinde net satışlar tabanından hareketle satılan malın maliyeti ve faaliyet giderleri kalemlerinin tutarları hesaplanarak faaliyet karına ulaşılır.","kavramlar":[{"kaynak":"Teori Notu","tanim":"Gelir tablosunda her kalemin net satışlara oranı yüzde olarak ifade edilmesi. Bu yöntemde net satışlar %100 tabanını oluşturur ve tüm kalemler bu taban üzerinden gösterilir.","ad":"Dikey yüzde analizi"},{"kaynak":"TEORI","tanim":"Brüt satış karından faaliyet giderleri (araştırma-geliştirme, pazarlama-satış-dağıtım, genel yönetim) toplamının çıkarılmasıyla bulunan kâr. Finansman giderleri faaliyet karı hesabında yer almaz.","ad":"Faaliyet karı"},{"kaynak":"Vergi Usul Kanunu 275. madde","tanim":"Satılan emtianın üretimine katılan ilk madde, işçilik, genel imalat giderleri ve gerekli durumlarda ambalaj malzemesi tutarlarının toplamı.","ad":"Satılan malın maliyeti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Net Satışlar (600.000 / 0,60)","1.000.000"],["Satılan Malın Maliyeti","600.000"],["Brüt Satış Karı (1.000.000 - 600.000)","400.000"],["Faaliyet Giderleri (1.000.000 x 0,25)","250.000"],["Faaliyet Karı (400.000 - 250.000)","150.000"]]},"tur":"tablo","soru":"İşletmenin 2026 yılı gelir tablosu dikey yüzde analizinde satılan malın maliyeti net satışların %60\u0027ı, faaliyet giderleri toplamı ise net satışların %25\u0027idir. Aynı döneme ait satılan malın maliyeti 600.000 TL, finansman gideri ise 40.000 TL olarak gerçekleşmiştir. Bu verilere göre işletmenin brüt satış karı kaç TL\u0027dir?","verilen":[[1,1]],"hedef":"Tabloyu doldur ve işletmenin brüt satış karının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin 2026 yılı gelir tablosu dikey yüzde analizinde satılan malın maliyeti net satışların %65\u0027i, faaliyet giderleri toplamı ise net satışların %20\u0027sidir. Aynı döneme ait satılan malın maliyeti 520.000 TL, finansman gideri ise 30.000 TL olarak gerçekleşmiştir. Bu verilere göre işletmenin faaliyet karı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-mta-cokzor/kp-01","verilenler":[{"deger":"%65","anlam":"Satılan malın maliyetinin net satışlar içindeki dikey yüzdesi; net satışı türetmek için bölen olarak kullanılır.","ad":"SMM yüzdesi"},{"deger":"520.000 TL","anlam":"Satılan malın maliyetinin gerçekleşen tutarı; yüzdesiyle birlikte net satışı bulmayı sağlar.","ad":"SMM tutarı"},{"deger":"%20","anlam":"Faaliyet giderlerinin net satışlar içindeki payı; net satışa uygulanarak faaliyet gideri tutarı bulunur.","ad":"Faaliyet giderleri yüzdesi"},{"deger":"30.000 TL","anlam":"Çeldirici veri; faaliyet karından sonra düşülen bir kalemdir, faaliyet karı hesabına dahil edilmez.","ad":"Finansman gideri"}],"dayanak":"TEORİ - Dikey yüzdelerden net satış ve gelir tablosu hesapları (net satış = kalem tutarı / (kalem yüzdesi / 100); faaliyet kârı = brüt satış kârı − faaliyet giderleri; finansman gideri faaliyet kârından sonra düşülür, faaliyet giderleri arasında sayılmaz)","dogru":"C","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Soruda ne var: SMM yüzdesi %65, faaliyet gideri yüzdesi %20 (soruda verilen); SMM tutarı 520.000 (soruda verilen); istenen: faaliyet karı","anlatim":"Soru bize şunları vermiş: satılan malın maliyeti net satışların %65\u0027i, faaliyet giderleri net satışların %20\u0027si; satılan malın maliyeti 520.000 TL (soruda verilen), finansman gideri 30.000 TL (soruda verilen, bu soruda kullanılmayacak).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[7,1]]},{"formul":"Net Satışlar = SMM Tutarı / (SMM Yüzdesi) = 520.000 (soruda verilen) / %65 (soruda verilen) = 800.000 TL","anlatim":"Dikey yüzde analizi nedir? Her kalemi net satışlara bölüp yüzde olarak gösteririz. Burada SMM\u0027nin yüzdesini ve tutarını bilince net satışı geriye doğru bulabiliriz.","doldur":[[6,1]]},{"formul":"Satılan Malın Maliyeti = 520.000 (soruda verilen)","anlatim":"Net satışları bulduk, şimdi satılan malın maliyetini tabloya yerleştiriyoruz. Bu değer zaten soruda verilmişti, tekrar hesaplamıyoruz.","doldur":[[7,1]]},{"formul":"Brüt Satış Karı = Net Satışlar - SMM = 800.000 (2. adımda bulduk) - 520.000 (soruda verilen) = 280.000 TL","anlatim":"Brüt satış karı nedir? Net satıştan malın maliyetini çıkarınca kalan tutardır - satışın ilk kâr katmanıdır.","doldur":[[8,1]]},{"formul":"Faaliyet Giderleri = Net Satışlar × %20 (soruda verilen) = 800.000 (2. adımda bulduk) × %20 = 160.000 TL","anlatim":"Faaliyet giderleri nedir? Pazarlama, genel yönetim gibi giderlerdir; burada net satışın %20\u0027si olarak verilmiş, net satışı bulunca tutarını çıkarabiliriz.","doldur":[[9,1]]},{"formul":"Kapsam: Faaliyet Karı = Brüt Satış Karı - Faaliyet Giderleri; Dahil değil: finansman gideri 30.000 (soruda verilen)","anlatim":"Finansman gideri 30.000 TL soruda verilmiş ama faaliyet karına dahil değil, çünkü faaliyet karı esas faaliyetten doğan giderleri kapsar. Dahil değil: finansman gideri 30.000 (soruda verilen).","doldur":[]},{"formul":"Faaliyet Karı = Brüt Satış Karı - Faaliyet Giderleri = 280.000 (4. adımda bulduk) - 160.000 (5. adımda bulduk) = 120.000 TL","anlatim":"Faaliyet karı nedir? Brüt kârdan faaliyet giderlerini düşünce kalan, işletmenin asıl işinden kazandığı kârdır.","doldur":[[10,1]]},{"formul":"Sonuç: Faaliyet Karı = 120.000 TL","anlatim":"Sonuç olarak işletmenin faaliyet karı 120.000 TL çıktı. Bu tutar sadece esas faaliyetten gelen kârı gösterir.","doldur":[]},{"formul":"Yanlış yol: 280.000 - 160.000 - 30.000 = 90.000 → B şıkkı (HATALI) → doğrusu 120.000 (7. adımda bulduk)","anlatim":"En sık hata: finansman giderini de faaliyet giderlerine katıp 280.000-160.000-30.000 yapmak. Finansman gideri esas faaliyet dışıdır, faaliyet karına girmez.","doldur":[]}],"anahtar":[{"ornek":"faaliyet","kok":"faaliy"},{"ornek":"giderleri","kok":"giderl"},{"ornek":"yüzdesi","kok":"yüzdes"},{"ornek":"gideri","kok":"gideri"},{"ornek":"finansman","kok":"finans"},{"ornek":"satışı","kok":"satışı"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu veya bilançoda kalemlerin yalnızca yüzdeleri (bazen bir kalemin tutarı) verildiğinde. Nasıl ölçülür: verilen tutar ve yüzdeden önce net satışlar bulunur, sonra diğer kalemler kendi yüzdeleriyle hesaplanır. Nasıl kaydedilir: zincirleme çıkarma ile net satışlardan SMM ve faaliyet giderleri düşülerek faaliyet karına ulaşılır.","desen":"Sınav genelde bir kalemin hem tutarını hem yüzdesini vererek önce net satışları buldurur, sonra zincirleme diğer kalemlere geçer. Tuzak, finansman giderinin faaliyet giderleri arasına katılmasıdır; oysa finansman gideri faaliyet karından sonra düşülür. Bu soru, gelir tablosu dikey yüzdelerinden net satış ve faaliyet karı hesaplama noktasından geliyor (p. Teori-Dikey yüzdelerden net satış).","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Gelir tablosu dikey analizinde baz alınan, %100 kabul edilen tutar","ad":"Net satışlar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"SMM\u0027nin net satışlara oranı, brüt kâr hesabında kullanılır","ad":"Satılan malın maliyeti yüzdesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Pazarlama, genel yönetim gibi giderlerin net satışlara oranı","ad":"Faaliyet giderleri yüzdesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Brüt satış karından faaliyet giderleri düşüldükten sonra kalan tutar","ad":"Faaliyet karı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"SMM tutarı ve yüzdesi, faaliyet giderleri yüzdesi ve finansman gideri tutarı verilip faaliyet karının TL tutarı istenir.","panel_ornek":"Bir gencin aylık 3.000 TL bütçesinde kira 1.800 TL, yani bütçenin %60\u0027ı; yemeğe de 600 TL, yani %20\u0027si ayrılıyor. Kira tutarını bilip yüzdesini bilirsen, önce toplam bütçeyi (3.000 TL) bulup sonra diğer kalemleri de yüzdeleriyle hesaplayabilirsin.","ornek":"Bir gencin aylık 3.000 TL bütçesinde kira 1.800 TL, yani bütçenin %60\u0027ı; yemeğe de 600 TL, yani %20\u0027si ayrılıyor. Kira tutarını bilip yüzdesini bilirsen, önce toplam bütçeyi (3.000 TL) bulup sonra diğer kalemleri de yüzdeleriyle hesaplayabilirsin.","yontemler":"Önce Net Satış = SMM tutarı / (SMM yüzdesi/100) formülüyle bulunur; sonra Faaliyet Karı yüzdesi = %100 - SMM% - Faaliyet Gideri% hesaplanıp bu yüzde net satışla çarpılır. Finansman gideri bu hesaba katılmaz, çünkü faaliyet karından sonraki bir kalemdir.","nedir":"Dikey yüzde analizi, bir mali tablodaki her kalemi aynı tablonun toplamına oranlayarak yüzde şeklinde gösteren yöntemdir. Sınav bu yöntemle, tek dönem içindeki kalemler arasındaki oransal ilişkileri kurup kurmadığını ölçer."},"olay":"Net satış=520.000/0,65=800.000; Brüt satış karı=800.000-520.000=280.000; Faaliyet giderleri=800.000x0,20=160.000; Faaliyet karı=280.000-160.000=120.000.","tuzak":{"D":{"ad":"Taban Karıştırma Tuzağı","metin":"Faaliyet giderleri yüzdesini net satış yerine SMM tutarı üzerinden uygularsın (520.000x0,20=104.000), böylece faaliyet karını olduğundan yüksek (176.000) bulursun. Doğrusu: Yüzdeler her zaman net satışlar tabanına uygulanır."},"E":{"ad":"SMM\u0027yi Dışlama Tuzağı","metin":"Faaliyet karını hesaplarken brüt satış karı adımını atlayıp doğrudan net satıştan yalnız faaliyet giderini düşersin, SMM\u0027yi unutursun. Doğrusu: Faaliyet karına ulaşmadan önce SMM mutlaka net satıştan düşülüp brüt satış karı bulunmalıdır."},"A":{"ad":"Ters Oran Tuzağı","metin":"Net satışı bulmak için SMM tutarını yüzdesine bölmen gerekirken yüzdesiyle çarparsın, böylece net satışı olduğundan küçük (338.000) hesaplarsın. Doğrusu: Net satış 520.000/0,65=800.000\u0027dir, faaliyet karı da buradan 120.000 çıkar."},"B":{"ad":"Finansman Giderini Faaliyet Karına Dahil Etme Tuzağı","metin":"Finansman giderinin faaliyet karından sonra düşüldüğünü unutup 120.000\u0027den 30.000\u0027i çıkarırsın. Doğrusu: Finansman gideri faaliyet karı hesabına hiç girmez, olağan kâra geçişte düşülür."}},"celdiriciYol":{"D":"520.000 x 0,20 = 104.000; 280.000 - 104.000 = 176.000 (faaliyet giderini SMM tabanı üzerinden hesaplama)","E":"800.000 - 160.000 = 640.000 (satılan malın maliyetini faaliyet karı zincirinden dışlama)","A":"520.000 x 0,65 = 338.000; 338.000 x 0,15 = 50.700 (net satışı bölme yerine çarparak bulma)","B":"120.000 - 30.000 = 90.000 (finansman giderini faaliyet karına dahil etme)"},"hap":"Dikey yüzde ve bir kalemin tutarı biliniyorsa net satış = tutar / (yüzde/100) ile bulunur, diğer tüm kalemler bu tabandan kendi yüzdeleriyle türetilir.","teshis":{"C":{"gercek":"Bir kalemin hem tutarı hem yüzdesi verilirse taban (net satış) bulunur, kalan tüm kalemler kendi yüzdeleriyle bu tabandan türetilir.","ayirt":"Verilen tek tutar ve yüzdeden tabanı doğru kurdum mu, sonra istenen kalemi bu tabandan mı hesapladım?","paragraf":"TEORİ - Dikey yüzdelerden net satış ve gelir tablosu hesapları","yanilgi":"Bu şıkkı eleyen öğrenci, dikey yüzdelerden yalnız oran değil tutar da türetilebileceğini fark edemez ve soruyu çözülemez sanır."},"E":{"gercek":"Faaliyet karına ulaşmak için önce net satıştan SMM düşülüp brüt satış karı bulunur, ardından faaliyet giderleri düşülür; adım atlanamaz.","ayirt":"Brüt satış karını hesapladım mı, yoksa doğrudan net satıştan mı gittim?","paragraf":"TEORİ - Dikey yüzdelerden net satış ve gelir tablosu hesapları","yanilgi":"Faaliyet karına giden zincirde satılan malın maliyeti adımını atlanabilir bir ara işlem sanıyorsun."},"A":{"gercek":"Yüzde bir oran olduğundan tabanı (net satışı) bulmak için tutar, yüzdenin ondalık karşılığına bölünür; dikey yüzde analizinde buna tersine okuma denir.","ayirt":"Bulduğum taban, verilen tutardan büyük mü olmalıydı küçük mü?","paragraf":"TEORİ - Dikey yüzdelerden net satış ve gelir tablosu hesapları","yanilgi":"Dikey yüzdeden tutar bulurken tutarı yüzdesine bölmek yerine yüzdesiyle çarpılacağını sanıyorsun."},"D":{"gercek":"Gelir tablosu dikey yüzdelerinde tek taban net satışlardır; her kalem yüzdesi yalnız net satışa uygulanır.","ayirt":"Bu yüzdeyi hangi büyüklüğe çarptım, o büyüklük net satış mıydı?","paragraf":"TEORİ - Dikey yüzdelerden net satış ve gelir tablosu hesapları","yanilgi":"Faaliyet giderleri yüzdesinin hangi tabana uygulandığını karıştırıp SMM tutarını taban sanıyorsun."},"B":{"gercek":"Faaliyet karı, faaliyet giderleri düşüldükten sonra durur; finansman gideri faaliyet karından SONRA, olağan kâra geçişte düşülür.","ayirt":"Bu kalem faaliyet giderleri arasında mı sayılıyor, yoksa faaliyet dışı mı?","paragraf":"TEORİ - Dikey yüzdelerden net satış ve gelir tablosu hesapları","yanilgi":"Finansman giderinin faaliyet giderleri gibi faaliyet karından düşüldüğünü sanıyorsun."}},"verilen":[[7,1],[1,1],[2,1],[3,1],[4,1]],"donem":11,"hesaplar":{}},{"capa":null,"kural":"Vieta\u0027ya göre x1+x2=2k+2, x1·x2=k²+k−2; ayrıca \u0027iki farklı reel kök\u0027 şartı Δx=4k+12\u003e0 gerektirir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 10","sonDonem":1,"sim":{"dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Vieta ile parametreye ait denklemi kurduktan sonra bulduğun her adayı orijinal denklemin diskriminantına geri koy; sınav çoğu zaman geçersiz adayı tam da bu noktada eler.","konu":"denklem cozme","tablo":{"satirlar":[["VERİLENLER","-"],["x katsayısındaki sabit çarpan","2"],["sabit terimdeki fark","−2"],["
