0.000 (2. adımda bulduk) = 120.000 ₺","anlatim":"Şimdi Türk şirketinden gelen kâr payının matraha giren kısmını buluyoruz. İstisna düşüldükten sonra kalan kısım vergiye tabi olur.","doldur":[[5,1]]},{"formul":"Alman şirketi kâr payı (istisna uygulanmaz) = 85.400 (soruda verilen)","anlatim":"Alman şirketi dar mükellef, yani yabancı kurum sayılır - GVK m.22\u0027deki istisna burada işlemez. Tam mükellef gerçek kişi yurt dışı kazancını tam tutarıyla beyan eder.","doldur":[[6,1]]},{"formul":"Gelir vergisi matrahına dahil edilecek toplam kâr payı = Türk A.Ş. matraha giren kısım + Alman şirketi kâr payı = 120.000 (3. adımda bulduk) + 85.400 (4. adımda bulduk) = 205.400 ₺","anlatim":"Şimdi iki kaynaktan matraha giren tutarları topluyoruz. Bu toplam Bay M\u0027nin beyan edeceği kâr payı tutarını verir.","doldur":[[7,1]]},{"formul":"SONUÇ: Gelir vergisi matrahına dahil edilecek toplam kâr payı = 205.400 ₺","anlatim":"Sonuç: Bay M\u0027nin 2026 matrahına dahil edeceği toplam kâr payı 205.400 ₺\u0027dir. Türk kısmı yarı istisnalı, Alman kısmı tam vergiye tabi.","doldur":[]},{"formul":"Ters durum: kaynak yurt dışı yerine Türkiye\u0027de kurulu tam mükellef kurum olsaydı → o tutarın da yarısı istisna olurdu","anlatim":"Ters durumda: kâr payı Almanya\u0027daki dar mükellef şirketten değil de Türkiye\u0027de kurulu başka bir Türk A.Ş.\u0027den gelseydi, o tutara da yarı istisna uygulanırdı.","doldur":[]},{"formul":"Yanlış yol: 240.000/2 + 85.400/2 = 162.700 (HATALI) → doğrusu 120.000 + 85.400 = 205.400 (5. adımda bulduk)","anlatim":"En sık hata: öğrenciler Alman şirketinden gelen kâr payına da yanlışlıkla yarı istisna uygular. Oysa istisna sadece tam mükellef Türk kurumundan gelen kâr payı için geçerlidir.","doldur":[]}],"anahtar":[{"ornek":"istisnası","kok":"istisn"},{"ornek":"mükellef","kok":"mükell"},{"ornek":"şirketinden","kok":"şirket"},{"ornek":"tutarıyla","kok":"tutarı"},{"ornek":"kurumdan","kok":"kurumd"},{"ornek":"payının","kok":"payını"}],"konuGiris":{"harita":"Ne zaman test edilir: kâr payı geliri hem yerli hem yabancı kaynaktan elde edildiğinde matraha giren kısım sorulur. Nasıl ölçülür: her kaynağın istisna kuralı ayrı uygulanıp bulunan tutarlar toplanır. Nasıl kaydedilir: sonuç tek bir toplam kâr payı tutarı olarak matraha yazılır.","desen":"Soru genelde iki kaynaklı kâr payı verip öğrencinin istisnayı sadece yerli kuruma uygulayıp uygulamadığını sınar. Tuzak, yabancı şirket kâr payına da yarım istisna uygulamaya çalışmaktır; GVK m.22 yalnız tam mükellef kurumları kapsar. Bu soru istisnanın kapsamının kaynak ülkeye göre değişmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Türkiye\u0027de kurulu şirketten alınan kâr payının yarısı vergiden muaftır","ad":"Tam mükellef kurum kâr payı istisnası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yurt dışında kurulu şirketten elde edilen kâr payı, istisna kapsamı dışında kalır","ad":"Dar mükellef kurum kâr payı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Ödeme sırasında kaynakta kesilen vergi; burada uygulanmamıştır","ad":"Tevkifat","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Menkul sermaye iradı sayılan kazanç türü, kâr payını kapsar","ad":"Gelirin unsuru","kim":"kanun sabitler"}],"sinavda":"İki farklı kaynaktan kâr payı tutarları verilir ve matraha girecek toplam kâr payı istenir.","panel_ornek":"Bir öğrenci iki ayrı yerden kâr payı benzeri gelir elde etse, biri yerli şirketten 10.000 lira, öbürü yabancı bir siteden 4.000 lira olsun. Yerli olanın yarısı vergiden muaf sayılıyorsa 5.000 lira, yabancı olanın tamamı sayılıyorsa 4.000 lira eklenir; toplam 9.000 lira matraha girer.","ornek":"Bir öğrenci iki ayrı yerden kâr payı benzeri gelir elde etse, biri yerli şirketten 10.000 lira, öbürü yabancı bir siteden 4.000 lira olsun. Yerli olanın yarısı vergiden muaf sayılıyorsa 5.000 lira, yabancı olanın tamamı sayılıyorsa 4.000 lira eklenir; toplam 9.000 lira matraha girer.","yontemler":"Yerli kurum kâr payının yarısı alınır, yabancı kurum kâr payı tam olarak eklenir, ikisi toplanır. Tek kritik kural, istisnanın yalnız tam mükellef kuruma uygulanmasıdır.","nedir":"Gelir vergisi matrahı, kişinin yıl içinde elde ettiği kazançlardan istisna ve indirimler düşüldükten sonra vergiye tabi kalan tutardır. Sınav, hangi gelirin ne kadarının matraha gireceğini kanun maddesine göre hesaplayabilmeyi ölçer."},"olay":"240.000/2=120.000 (Türk kısmı matraha giren) + 85.400 (yabancı kısmı tam) = 205.400.","tuzak":{"C":{"ad":"İstisnayı Genelleme Tuzağı","metin":"GVK m.22\u0027deki yarı istisnanın her kâr payına uygulandığı sanılmış, yabancı kurumdan gelen 85.400 ₺\u0027nin de yarısı istisna edilmiş. Doğrusu: bu istisna yalnız tam mükellef kurumdan elde edilen kâr paylarına tanınmıştır, yabancı kurum kâr payı tam tutarıyla matraha girer."},"E":{"ad":"İstisnayı Atlama Tuzağı","metin":"GVK m.22\u0027deki yarı istisna hiç uygulanmadan Türk A.Ş. kâr payının tamamı matraha katılmış. Doğrusu: tam mükellef kurumdan gelen kâr payının yalnızca yarısı matraha girer, tamamı değil."},"A":{"ad":"Ne soruluyor","metin":"iki kaynaktan gelen kâr paylarının matraha giren toplamı isteniyor. Kural: GVK m.3 tam mükellef gerçek kişiyi Türkiye içi ve dışı kazancının tamamı üzerinden vergilendirir; kaynağın yerli/yabancı olması beyan yükümlülüğünü kaldırmaz. Hesap: 0 (atlanan Türk kısmı) + 85.400 (yabancı kısım) = 85.400. Doğrusu: Türk A.Ş. kâr payının istisna sonrası kısmı da matraha eklenmelidir."},"B":{"ad":"Yabancı Kurum Muafiyeti Tuzağı","metin":"yurt dışındaki şirketin dar mükellef olması nedeniyle bu kâr payının Türkiye\u0027de hiç vergilenmeyeceği düşünülmüş. Doğrusu: GVK m.3 gereği mükellefin kendisi tam mükellef olduğundan yabancı kaynaklı kâr payı da tam tutarıyla matraha girer."}},"celdiriciYol":{"C":"240.000/2 + 85.400/2 = 120.000 + 42.700 = 162.700 (istisna hem Türk hem yabancı kâr payına uygulandı)","E":"240.000 + 85.400 = 325.400 (Türk kurum kâr payına GVK m.22 istisnası hiç uygulanmadı)","A":"0 + 85.400 = 85.400 (Türk kurum kâr payı tam mükellefiyet ilkesi atlanarak hiç dahil edilmedi)","B":"240.000/2 = 120.000 (yabancı kurum kâr payı dar mükellef kaynaklı sayılarak matrah dışı bırakıldı)"},"hap":"GVK m.22\u0027deki kâr payı istisnası yalnız tam mükellef kurumdan gelen kâr payının yarısına uygulanır; yabancı kurumdan gelen kâr payı tam tutarıyla matraha girer.","teshis":{"C":{"gercek":"Kâr payı istisnası yalnız tam mükellef kurumdan elde edilen kâr payına tanınmıştır; yabancı (dar mükellef) kurumdan gelen kâr payı tam tutarıyla vergilenir.","ayirt":"Bu kâr payını dağıtan kurum Türkiye\u0027de kurulu tam mükellef bir kurum mu?","paragraf":"GVK m.22","yanilgi":"GVK m.22\u0027deki yarı istisnanın her kâr payı için geçerli genel bir kural olduğunu düşünüyorsun."},"E":{"gercek":"GVK m.22 tam mükellef kurumdan elde edilen kâr payının yarısını istisna eder; bu indirim uygulanmadan matrah bulunamaz.","ayirt":"Kâr payı hangi kurumdan geldi, istisna oranını uyguladım mı?","paragraf":"GVK m.22","yanilgi":"Kâr payı istisnasının varlığını bilmiyor ya da unutuyor, gelen tüm tutarı doğrudan matraha yazıyorsun."},"A":{"gercek":"GVK m.3 tam mükellef gerçek kişinin Türkiye içi ve dışı bütün kazançlarını matraha dahil eder; hiçbir kalem gözden kaçırılamaz.","ayirt":"Elde ettiğim her gelir kaynağını listeye yazdım mı?","paragraf":"GVK m.3","yanilgi":"Yalnız gerçekten kâr payı verdiğini bildiğin, tevkifatsız yabancı kaynağı yazarsan yeterli sanıyorsun, Türk kurum kısmını unutuyorsun."},"D":{"gercek":"GVK m.22 istisnası yalnız tam mükellef kurum kâr payının yarısına uygulanır, kalan yarı ile yabancı kurum kâr payının tamamı matraha girer.","ayirt":"İstisnayı doğru kalemin doğru kısmına mı uyguladım?","paragraf":"GVK m.22, GVK m.3","yanilgi":"İstisnayı hem yerli hem yabancı kâr payına uygulamayı ya da hiç uygulamamayı düşünenler bu şıkkı yanlışlıkla eleyebilir."},"B":{"gercek":"Vergilendirmede belirleyici olan mükellefin (kişinin) tam mükellef olmasıdır, kurumun kaynağı değil; GVK m.3 tüm kazancı kapsar.","ayirt":"Beyan yükümlülüğünü doğuran şey gelirin kaynağı mı yoksa mükellefin statüsü mü?","paragraf":"GVK m.3","yanilgi":"Kâr payının geldiği kurum yurt dışında olduğu için bu tutarın Türkiye\u0027de vergiye tabi olmadığını düşünüyorsun."}},"verilen":[[4,1],[6,1],[1,1],[2,1]],"donem":7,"hesaplar":{}},{"capa":null,"kural":"3568 sayılı Kanun m.48\u0027in beşinci fıkrası uyarınca mükellefle birlikte kasten vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına doğrudan meslekten çıkarma cezası verilir; bu fiilde önceki cezaların tekerrürü şart değildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/2 ders 07 Soru 13","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Fiili önce tanımla: \u0027kasten vergi ziyaı + mahkeme kararı kesinleşmesi\u0027 ifadesi görülünce tekerrür aramadan doğrudan meslekten çıkarmaya git.","konu":"meslekten çıkarma cezası","tablo":{"satirlar":[["VERİLENLER","-","-"],["Fiil","Mükellefle birlikte kasten vergi ziyaına sebebiyet verme","-"],["Kesinleşme durumu","Mahkeme kararı ile kesinleşmiş","-"],["HESAP","-","-"],["A) Uyarma","p.48/2","YANLIŞ ifade"],["B) Kınama","p.48/2","YANLIŞ ifade"],["C) Geçici olarak mesleki faaliyetten alıkoyma","p.48/3-4","YANLIŞ ifade"],["D) Yeminli sıfatını kaldırma","p.48/4","YANLIŞ ifade"],["E) Meslekten çıkarma","p.48/5","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Geçici olarak mesleki faaliyetten alıkoyma","E":"Meslekten çıkarma","A":"Uyarma","D":"Yeminli sıfatını kaldırma","B":"Kınama"},"kaynak":{"alinti":"","liste":[],"hakem":"Soru, 3568 sayılı Kanun m.48 fıkra 2\u0027de açıkça yer alan ve mükellefle birlikte kasten vergi ziyaına sebebiyet verenlere doğrudan meslekten çıkarma cezası uygulanacağını belirten kurala dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Geçici alıkoyma, tasdik yetkisinin gerçeğe aykırı kullanılması ve Maliye Bakanlığı tarafından ilk tespiti hâlinde yeminli mali müşavire uygulanır; burada söz konusu olan kasten vergi ziyaı fiili olup cezası meslekten çıkarmadır.","E":"Kasten vergi ziyaına sebebiyet veren ve mahkeme kararı kesinleşen meslek mensubu doğrudan meslekten çıkarma cezasına çarptırılır; ruhsatnamesi geri alınır ve mesleği icra edemez.","A":"Uyarma mesleğin vakar ve onuruna aykırı davranışlara ilk kez uygulanır; fakat kasten vergi ziyaı bu hafif cezalar kategorisine değil, doğrudan çıkarma cezasına tabi özel bir fiildir.","D":"Yeminli sıfatını kaldırma, tasdik yetkisinin gerçeğe aykırı kullanılmasının tekerrür edip mahkeme kararıyla kesinleşmesi hâlinde uygulanır; kasten vergi ziyaı fiili için bu ceza yanlıştır.","B":"Kınama, mesleğin vakar ve onuruna aykırı davranışlarda tekerrür hâlinde verilir; kasten vergi ziyaı ise ilk defasında bile doğrudan meslekten çıkarmayı gerektirir, tekerrür şartı aranmaz."},"dogru":"Ahmet mükellefiyle birlikte bilerek vergi kaybına neden olmuş ve mahkeme bunu kesin kararla belgelemiştir. Kanun bu durumda tekerrür şartı aramaksızın doğrudan meslekten çıkarmayı öngörür. Ahmet\u0027in ruhsatnamesi geri alınacak ve mesleği bırakması zorunlu olur.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 48. madde uyarınca mükellefle birlikte kasten vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası uygulanır.","kavramlar":[{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun mükellefiyle birlikte bilerek ve isteyerek devlete vergi ödenmesini engellemesi veya azaltması fiilidir. Mahkeme kararı ile kesinleşmesi durumunda doğrudan meslekten çıkarma cezası uygulanır.","ad":"Kasten vergi ziyaı"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. En ağır disiplin cezasıdır.","ad":"Meslekten çıkarma"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensuplarının görevlerini yerine getirmemesi, kusurlu davranması veya mesleğin vakar ve onuruna aykırı fiil işlemesi hâlinde, muhasebe ve müşavirlik hizmetlerinin düzgün yürütülmesi için verilen uyarma, kınama, geçici alıkoyma, yeminli sıfatını kaldırma veya meslekten çıkarma cezalarıdır.","ad":"Disiplin cezası"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":6,"ornekler":[],"donemler":["2023/2","2022/2","2021/1","2019/1","2018/1","2015/1"]},"oyun":null,"tip":"teori","soru":"Serbest muhasebeci mali müşavir Ahmet, mükellefiyle birlikte kasten vergi ziyaına sebebiyet vermiş ve bu husus mahkeme kararı ile kesinleşmiştir. 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre Ahmet hakkında hangi disiplin cezası uygulanır?","kayitBaslik":"","id":"smmm-4k-a-ymeslek-kolay-r4/kp-02","verilenler":[{"deger":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verme","anlam":"Disiplin cezasının hangi maddeye göre belirleneceğini gösteren temel olgu","ad":"Fiil"},{"deger":"Mahkeme kararı ile kesinleşmiş","anlam":"Cezanın uygulanabilmesi için kanunda öngörülen şart; kesinleşme olmadan ceza uygulanamaz","ad":"Kesinleşme durumu"}],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.48, fıkra 5","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: SMMM Zeynep, müşterisi bir tekstil firmasıyla anlaşarak fatura tutarlarını 2022 yılında bilerek düşük göstermiş, 850.000 ₺ vergi ziyaına sebep olmuş ve bu durum 2024\u0027te mahkeme kararıyla kesinleşmiş.","anlatim":"Bu olay soruyla aynı kurala dayanıyor ama farklı bir meslek mensubu ve farklı rakamlarla anlatılıyor.","doldur":[]},{"formul":"Ne yapacağız: Zeynep mükellefle birlikte kasten vergi ziyaına sebep olmuş ve mahkeme kararı kesinleşmiş; kanun bu fiile doğrudan bir ceza bağlıyor. Şimdi beş cezayı bu olayda tek tek deneyeceğiz.","anlatim":"Kural şu: kasten vergi ziyaı + mahkeme kararının kesinleşmesi = doğrudan tek bir sonuç. Beş şıkkı sırayla bu olaya uygulayacağız.","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"p.48/2","karar":"yanlış","anlatim":"Uyarma, mesleğin vakar ve onuruna aykırı hafif davranışlarda ilk seferde uygulanır. Zeynep\u0027in fiili kasten vergi ziyaı, bu çok daha ağır ve kanunda ayrı bir fıkrada düzenlenmiş.","formul":"Şık A: disiplin kurulu \u0027Zeynep\u0027e sadece uyarma cezası verelim\u0027 diyor, doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"p.48/2","karar":"yanlış","anlatim":"Kınama, mesleki kusurun tekrarında uygulanan hafif bir cezadır. Zeynep\u0027in fiilinde tekerrür şartı aranmaz, kanun doğrudan ağır ceza öngörür.","formul":"Şık B: kurul \u0027Zeynep\u0027e kınama cezası verelim\u0027 diyor, doğru mu?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"p.48/3-4","karar":"yanlış","anlatim":"Geçici alıkoyma, bağımsızlık-tarafsızlık ihlalinde ya da YMM\u0027nin tasdik yetkisini ilk kez gerçeğe aykırı kullanmasında uygulanır. Zeynep\u0027in fiili bu değil, mükellefle birlikte kasten vergi ziyaıdır.","formul":"Şık C: birisi \u0027Zeynep\u0027i altı ay geçici olarak faaliyetten alıkoyalım\u0027 diyor, ekler misin?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"p.48/4","karar":"yanlış","anlatim":"Yeminli sıfatını kaldırma yalnız yeminli mali müşavirlere ve tasdik yetkisinin tekrar gerçeğe aykırı kullanılmasına özgüdür. Zeynep SMMM\u0027dir ve fiili tasdik değil, vergi ziyaıdır.","formul":"Şık D: biri \u0027Zeynep\u0027in yeminli sıfatını kaldıralım\u0027 diyor, doğru mu?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.48/5","karar":"doğru","anlatim":"Kanun tam bunu söylüyor: mükellefle birlikte kasten vergi ziyaına sebep olup mahkeme kararı kesinleşen meslek mensubuna meslekten çıkarma verilir. Zeynep\u0027in olayı bu tanıma tam uyuyor, tekerrür de gerekmiyor.","formul":"Şık E: kurul \u0027mahkeme kararı kesinleşti, kasten vergi ziyaı var, Zeynep\u0027i meslekten çıkaralım\u0027 diyor, doğru mu?"}],"anahtar":[{"ornek":"meslek","kok":"meslek"},{"ornek":"kasten","kok":"kasten"},{"ornek":"zeynep","kok":"zeynep"},{"ornek":"birlikte","kok":"birlik"},{"ornek":"doğrudan","kok":"doğrud"},{"ornek":"tekerrür","kok":"tekerr"}],"konuGiris":{"harita":"Ne zaman uygulanır: kasten vergi ziyaına sebep olma mahkeme kararıyla kesinleştiğinde uygulanır. Nasıl belirlenir: fiilin niteliği ve ağırlığına göre kanunda sayılan cezalardan biri seçilir. Nasıl kayıtlanır: disiplin kurulu kararı meslek mensubuna bildirilerek kesinleşir.","desen":"Soru genelde kasten vergi ziyaı ile diğer disiplin cezalarını (uyarma, kınama, alıkoyma) karıştırmayı hedefler. Tuzak, mahkeme kararının kesinleşmiş olması şartının atlanmasıdır. Bu soru m.48/2 fıkrasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Ruhsatnamenin geri alınıp mesleğin bir daha icra edilememesi","ad":"Meslekten çıkarma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mükellefle birlikte bilerek vergi kaybına sebep olma fiili","ad":"Kasten vergi ziyaı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Fiilin yargı yoluyla kesin olarak sabit hale gelmesi","ad":"Mahkeme kararının kesinleşmesi","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Cezanın hangi derecede uygulanacağını belirleyen kurul kararı","ad":"Disiplin kurulu kararı","kim":"meslek kuruluşu düzenler"}],"sinavda":"Kasten vergi ziyaına sebep olduğu mahkeme kararıyla kesinleşen meslek mensubuna hangi cezanın verileceği sorulur.","panel_ornek":"Bir öğrenci, sınavda kopya çektiği ikinci kez tespit edilince okuldan kalıcı olarak uzaklaştırılır. Küçük kusurlarda önce uyarı, tekrarında daha ağır ceza gelir. Burada en ağır fiil, en ağır sonucu doğurur.","ornek":"Bir öğrenci, sınavda kopya çektiği ikinci kez tespit edilince okuldan kalıcı olarak uzaklaştırılır. Küçük kusurlarda önce uyarı, tekrarında daha ağır ceza gelir. Burada en ağır fiil, en ağır sonucu doğurur.","yontemler":"Fiilin ağırlığına göre doğru cezayı kanun metninden eşleştir; mahkeme kararının kesinleşmiş olması şartı atlanmamalıdır.","nedir":"Bu konu, meslek mensuplarının kusurlu davranışlarına uygulanan disiplin cezalarını düzenler. Sınav, hangi fiile hangi cezanın uygulandığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Geçici Alıkoyma Tuzağı","metin":"Öğrenci bunu, tasdik yetkisinin gerçeğe aykırı kullanıldığının Maliye Bakanlığınca ilk tespiti hâlindeki cezayla karıştırıyor; o kural yalnız yeminli mali müşavirlere ve farklı bir fiile ilişkindir. Doğrusu: kasten vergi ziyaına sebebiyet verip mahkeme kararı kesinleşen meslek mensubuna meslekten çıkarma cezası verilir."},"A":{"ad":"Uyarma Tuzağı","metin":"Öğrenci bu cezayı \u0027mesleğin vakar ve onuruna aykırı ilk fiil\u0027 kuralıyla karıştırıyor. Doğrusu: mükellefle birlikte kasten vergi ziyaına sebebiyet verilip mahkeme kararı kesinleşmesi hali doğrudan meslekten çıkarmayı gerektirir, uyarma bu fiile uygulanmaz."},"D":{"ad":"Yeminli Sıfatını Kaldırma Tuzağı","metin":"Öğrenci bunu, tasdik yetkisinin gerçeğe aykırı kullanılmasının tekerrür edip mahkeme kararıyla kesinleşmesi hâlindeki cezayla karıştırıyor; bu ceza yalnız yeminli mali müşavire ve tasdik fiiline özgüdür. Doğrusu: burada söz konusu olan kasten vergi ziyaı fiili olup sonucu meslekten çıkarmadır."},"B":{"ad":"Kınama Tuzağı","metin":"Öğrenci \u0027ilk defasında uyarma, tekrarında kınama\u0027 kuralını bu olaya uyguluyor; oysa bu kural vakar ve onura aykırı genel davranışlar içindir. Doğrusu: kasten vergi ziyaı fiilinde tekerrür şartı aranmaz, doğrudan meslekten çıkarma uygulanır."}},"celdiriciYol":{},"hap":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu husus mahkeme kararı ile kesinleşen meslek mensubuna, tekerrür şartı olmaksızın doğrudan meslekten çıkarma cezası verilir.","teshis":{"C":{"gercek":"Geçici alıkoyma, YMM\u0027nin tasdik yetkisini ilk defa gerçeğe aykırı kullanmasına özgüdür; kasten vergi ziyaı ayrı ve daha ağır bir fiildir.","ayirt":"Olaydaki fiil tasdik yetkisinin kötüye kullanılması mı, yoksa mükellefle birlikte vergi ziyaına sebebiyet verme mi?","paragraf":"3568 s.K. m.48/3-4","yanilgi":"Tasdik yetkisinin ilk kez gerçeğe aykırı kullanılması hâlindeki geçici alıkoyma cezasını bu olaya taşıyorsun."},"E":{"gercek":"3568 s.K. m.48/5, mükellefle birlikte kasten vergi ziyaına sebebiyet verip bunu mahkeme kararıyla kesinleştiren meslek mensubuna doğrudan meslekten çıkarma cezasını öngörür.","ayirt":"Kanun bu fiili tek başına mı en ağır cezaya bağlamış, yoksa önceki cezaların tekerrürünü mü şart koşmuş?","paragraf":"3568 s.K. m.48/5","yanilgi":"Bu cezanın çok ağır olduğunu düşünüp tekerrür ya da ek şart arıyorsun."},"A":{"gercek":"Kanun bu fiili ağırlığı nedeniyle doğrudan en ağır cezaya bağlamıştır; uyarma yalnız hafif ve ilk defa işlenen mesleki kusurlara uygulanır.","ayirt":"Bu fiil kanunda özel olarak meslekten çıkarmaya mı bağlanmış, yoksa genel vakar-onur kuralına mı tabi?","paragraf":"3568 s.K. m.48/2, m.48/5","yanilgi":"Vergi ziyaını basit bir dikkatsizlik gibi görüp en hafif cezanın uygulanacağını sanıyorsun."},"D":{"gercek":"Yeminli sıfatını kaldırma cezası yalnız YMM\u0027nin tasdik yetkisini tekrar gerçeğe aykırı kullanmasına bağlıdır; burada fiil kasten vergi ziyaıdır.","ayirt":"Cezanın dayandığı fiil tasdik raporu mu, yoksa mükellefle birlikte vergi ziyaına sebebiyet verme mi?","paragraf":"3568 s.K. m.48/4","yanilgi":"Tasdik yetkisinin tekerrüren gerçeğe aykırı kullanılması hâlindeki yeminli sıfatını kaldırma cezasını bu olaya uyguluyorsun."},"B":{"gercek":"Kasten vergi ziyaı fiilinde tekerrür beklenmez; mahkeme kararının kesinleşmesiyle birlikte doğrudan meslekten çıkarma uygulanır.","ayirt":"Bu fiil için kanunda tekerrür şartı var mı, yoksa ilk seferde mi en ağır ceza geliyor?","paragraf":"3568 s.K. m.48/2, m.48/5","yanilgi":"Bu fiili \u0027tekrarında ağırlaşan ceza\u0027 kalıbına oturtup kınamayı seçiyorsun."}},"verilen":[[1,1],[2,1]],"donem":6,"hesaplar":{}},{"capa":null,"kural":"Madde 35/1\u0027de yatırım kuruluşları, kolektif yatırım kuruluşları, bağımsız denetim/değerleme/derecelendirme kuruluşları, portföy yönetim şirketleri, ipotek finansmanı kuruluşları, konut finansmanı ve varlık finansmanı fonları, varlık kiralama şirketleri, merkezî takas kuruluşları, merkezî saklama kuruluşları, veri depolama kuruluşları ve Kurulca belirlenen diğer sermaye piyasası kurumları sayılmıştır; mevduat kabul eden bankalar bu listede yer almaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/1 ders 08 Soru 5","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 35\u0027in on bir bendini isim isim ezberle; listede yer almayan klasik finans kurumları (banka, sigorta şirketi) genelde doğru cevap adayıdır.","konu":"sermaye piyasası kurumları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Madde numarası","35","-"],["HESAP","-","-"],["A) Merkezî takas kuruluşları","m.35/1-g","doğru ifade"],["B) Konut finansmanı ve varlık finansmanı fonları","m.35/1-e","doğru ifade"],["C) Veri depolama kuruluşları","m.35/1-h","doğru ifade"],["D) Varlık kiralama şirketleri","m.35/1-f","doğru ifade"],["E) Mevduat kabul eden bankalar","m.35/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Veri depolama kuruluşları","E":"Mevduat kabul eden bankalar","A":"Merkezî takas kuruluşları","D":"Varlık kiralama şirketleri","B":"Konut finansmanı ve varlık finansmanı fonları"},"kaynak":{"alinti":"Mevduat kabul eden bankalar","liste":[],"hakem":"Soru olumsuz kokludur; doğru sikkin (E) \u0027Mevduat kabul eden bankalar\u0027 kurala aykırı/dışlanmış olduğu kaynak metindeki m.35/1\u0027den açıkça çıkmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Veri depolama kuruluşları teknik bir destek görünseler de sermaye piyasasında işlem kayıtlarının tutulması için kanunda bu kurumlar sayılmıştır.","A":"Merkezî takas kuruluşları takas işlemlerini yönetmek için başka bir kuruma bağlı değil, kanunda sermaye piyasası kurumu olarak bağımsız sayılmıştır.","D":"Varlık kiralama şirketleri kira sertifikası gibi araçlar çıkarsalar da bağımsız bir sermaye piyasası kurumu türü olarak kanunda yer almıştır.","B":"Konut finansmanı ve varlık finansmanı fonları tüzel kişiliği olmayan araçlar olsalar da kanunda sermaye piyasası kurumu olarak tanımlanmıştır."},"dogru":"Mevduat kabul eden bankalar sermaye piyasası kurumları listesinde yer almaz. Diğer dört seçenek (merkezî takas kuruluşları, konut finansmanı fonları, varlık kiralama şirketleri, veri depolama kuruluşları) kanunda açıkça sayılmıştır.","sinav":"Sermaye Piyasası Kanunu 35. madde","kavramlar":[{"kaynak":"Sermaye Piyasası Kanunu 35. madde","tanim":"Sermaye Piyasası Kanunu\u0027na göre faaliyette bulunmak üzere kanunda sayılan kurum ve kuruluşlar; yatırım kuruluşları, kolektif yatırım kuruluşları, denetim ve değerleme kuruluşları, konut finansmanı fonları, merkezî takas kuruluşları, veri depolama kuruluşları ve benzeri türlerden oluşur.","ad":"Sermaye piyasası kurumları"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":6,"ornekler":[],"donemler":["2021/1","2019/2","2016/3","2016/2","2015/3","2015/2"]},"oyun":null,"tip":"teori","soru":"6362 sayılı Sermaye Piyasası Kanunu\u0027nun 35. maddesinde, bu Kanuna göre faaliyette bulunabilecek sermaye piyasası kurumları tek tek sayılmıştır. Buna göre, aşağıdakilerden hangisi 6362 sayılı Kanun\u0027un 35. maddesinde sayılan sermaye piyasası kurumlarından biri değildir?","kayitBaslik":"","id":"smmm-4k-a-yspk-zor-r8/kp-01","verilenler":[{"deger":"35","anlam":"Sermaye Piyasası Kurumları\u0027nın tek tek sayıldığı 6362 sayılı Kanun\u0027un maddesi; sorunun cevabını belirleyen yasal kaynak.","ad":"Madde numarası"}],"dayanak":"6362 sayılı Sermaye Piyasası Kanunu m.35/1","dogru":"E","oyunBonus":null,"ders":"Sermaye Piyasası Mevzuatı","adimlar":[{"formul":"Olay: Yıldız Menkul A.Ş.\u0027nin hukuk müşaviri, 6362 sayılı Kanun\u0027un 35. maddesindeki listeyi masaya yatırıp beş kurumu tek tek kontrol ediyor: takas merkezi, iki fon türü, veri kayıt şirketi, kiralama şirketi ve bir mevduat bankası.","anlatim":"Müşavir elindeki listeyi madde metniyle karşılaştırıyor. Amacı hangi isimlerin bentlerde yazılı olduğunu bulmak. Bu tek olayda beş ifadeyi sırayla süzeceğiz.","doldur":[]},{"formul":"Ne yapacağız: m.35/1\u0027deki bentleri tek tek açıp her ismin karşılığını arayacağız.","anlatim":"Madde on bir bent halinde sermaye piyasası kurumlarını sayar. Listede olmayan isim doğru cevap olur. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.35/1-g","karar":"doğru","anlatim":"Müşavir m.35/1-g\u0027yi açıyor, merkezî takas kuruluşları orada yazılı. Demek ki bu isim listede var. Bu ifade doğrudur.","formul":"Şık A: müşavir \u0027merkezî takas kuruluşu listede mi?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.35/1-e","karar":"doğru","anlatim":"Müşavir m.35/1-e\u0027ye bakıyor, bu iki fon türü orada açıkça sayılmış. Fonun tüzel kişiliği olmaması onu listeden çıkarmıyor. Bu ifade doğrudur.","formul":"Şık B: müşavir \u0027konut ve varlık finansmanı fonları listede mi?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.35/1-h","karar":"doğru","anlatim":"Müşavir m.35/1-h\u0027ye bakıyor, veri depolama kuruluşları orada ayrı bent olarak yazılı. Teknik bir yapı gibi görünse de Kanun onu kurum sayıyor. Bu ifade doğrudur.","formul":"Şık C: müşavir \u0027veri depolama kuruluşu listede mi?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.35/1-f","karar":"doğru","anlatim":"Müşavir m.35/1-f\u0027yi açıyor, varlık kiralama şirketleri orada yazılı. Kira sertifikası çıkaran araç değil, doğrudan kurum sayılıyor. Bu ifade doğrudur.","formul":"Şık D: müşavir \u0027varlık kiralama şirketi listede mi?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.35/1","karar":"yanlış","anlatim":"Müşavir m.35/1\u0027in tamamını tarıyor ama banka ismine hiçbir bentte rastlamıyor. Bankalar 5411 sayılı Bankacılık Kanunu\u0027na tabidir, bu listeye girmez. Bu ifade yanlıştır.","formul":"Şık E: müşavir \u0027mevduat kabul eden banka listede mi?\u0027 diye soruyor, sen ne dersin?"},{"formul":"Kapanış: Doğru cevap E. Soru olumsuz sorduğu için aranan, ifadesi kurala UYMAYAN şıktır: E. Kurala uyan şıklar: A, B, C, D.","anlatim":"Dört isim madde metninde bent olarak yazılıyken banka hiçbir bentte geçmiyor. Kendine hep şunu sor: bu isim m.35/1\u0027in bentlerinden birinde harfiyen yazılı mı, yoksa başka bir kanuna mı tabi?","doldur":[]}],"anahtar":[{"ornek":"kuruluşları","kok":"kurulu"},{"ornek":"müşavir","kok":"müşavi"},{"ornek":"yazılı","kok":"yazılı"},{"ornek":"doğrudur","kok":"doğrud"},{"ornek":"bankalar","kok":"bankal"},{"ornek":"listede","kok":"listed"}],"konuGiris":{"harita":"Ne zaman test edilir: kanunda sayılan kurum listesi ile sayılmayan bir kurum karıştırılmak istendiğinde. Nasıl ölçülür: şıklardaki kurum adlarının listede geçip geçmediği tek tek kontrol edilerek. Nasıl kaydedilir: listede olmayan kurum doğru cevap olarak işaretlenir.","desen":"Soru genelde listedeki dokuz-on kurumdan birini değiştirip listede olmayan benzer isimli bir kurumu şık olarak koyar. Tuzak, gerçek hayatta var olan ama bu kanun listesinde yer almayan bir kurumun (örneğin sigorta şirketi, banka) şıklara eklenmesidir. Bu soru 6362 sayılı Kanun\u0027un ilgili maddesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Sermaye piyasası araçlarıyla ilgili işlem yapan aracı kurumlardır.","ad":"yatırım kuruluşları","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Yatırımcıların parasını topluca yöneten fon ve ortaklık türü kuruluşlardır.","ad":"kolektif yatırım kuruluşları","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İşlemlerin karşılıklı olarak sonuçlandırılmasını sağlayan kuruluşlardır.","ad":"merkezî takas kuruluşları","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Faaliyet esasları düzenleyici kurulca belirlenen ek kurum türleridir.","ad":"Kurulca belirlenen diğer kurumlar","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Şıklarda sayılan kurum adlarından hangisinin kanundaki listede yer almadığı sorulur.","panel_ornek":"Bir gencin oturduğu apartmanda yönetici, kapıcı, tesisatçı ve temizlikçi gibi görev tanımlı kişiler vardır; ama komşusunun kuzeni bu listeye dahil değildir. Herkes apartmanla ilgilenir ama yönetim planında sadece belirli görevler yazılıdır. Listede olmayan biri, işle ilgili görünse de resmi görevli sayılmaz.","ornek":"Bir gencin oturduğu apartmanda yönetici, kapıcı, tesisatçı ve temizlikçi gibi görev tanımlı kişiler vardır; ama komşusunun kuzeni bu listeye dahil değildir. Herkes apartmanla ilgilenir ama yönetim planında sadece belirli görevler yazılıdır. Listede olmayan biri, işle ilgili görünse de resmi görevli sayılmaz.","yontemler":"Listeyi ezberlemek yerine \u0027yatırım-fon-takas-saklama-değerleme\u0027 temalarını gruplandırarak hatırlamak yeterlidir; listede olmayan yabancı kurum adı (banka, sigorta şirketi gibi) hemen elenmelidir.","nedir":"Sermaye piyasası kurumları, kanunda tek tek sayılan yatırım kuruluşları, fonlar ve destek kuruluşlarıdır. Sınav bu listede sayılan ile sayılmayanı ayırt etmeyi ölçer."},"olay":"","tuzak":{"C":{"ad":"Yeni Kurum Yabancılaşması Tuzağı","metin":"Öğrenci veri depolama kuruluşlarını teknik-idari bir birim sanıp Kanun kapsamı dışında görür. Doğrusu: Veri depolama kuruluşları madde 35/1-h bendinde sermaye piyasası kurumu olarak sayılmıştır."},"A":{"ad":"Kapsam Daraltma Tuzağı","metin":"Öğrenci takas kuruluşlarını borsa bünyesinde bir birim sanıp ayrı bir kurum türü olarak Kanun\u0027da sayılmadığını düşünür. Doğrusu: Merkezî takas kuruluşları madde 35/1-g bendinde sermaye piyasası kurumu olarak açıkça sayılmıştır."},"D":{"ad":"Sukuk Aracı Karıştırma Tuzağı","metin":"Öğrenci varlık kiralama şirketlerini yalnız kira sertifikası çıkaran bir araç sanıp ayrı kurum sayılmadığını düşünür. Doğrusu: Varlık kiralama şirketleri madde 35/1-f bendinde sermaye piyasası kurumu olarak sayılmıştır."},"B":{"ad":"Fon-Kurum Karıştırma Tuzağı","metin":"Öğrenci tüzel kişiliği bulunmayan fonların kurum sayılmayacağını düşünür. Doğrusu: Konut finansmanı ve varlık finansmanı fonları madde 35/1-e bendinde sermaye piyasası kurumu olarak sayılmıştır."}},"celdiriciYol":{},"hap":"6362 sayılı Kanun m.35\u0027te sayılan sermaye piyasası kurumları arasında bankalar yoktur; bankalar 5411 sayılı Bankacılık Kanunu\u0027na tabidir.","teshis":{"C":{"gercek":"6362 s.K. m.35/1-h veri depolama kuruluşlarını sermaye piyasası kurumu olarak sayar.","ayirt":"Bu isim madde metninde ayrı bent halinde yer alıyor mu?","paragraf":"m.35/1-h","yanilgi":"Veri depolama kuruluşlarını teknik-idari bir yapı sanıp Kanun kapsamı dışında bıraktın."},"E":{"gercek":"6362 s.K. m.35/1\u0027de bankalar sayılmamıştır; bankalar 5411 sayılı Bankacılık Kanunu\u0027na tabidir, sermaye piyasası faaliyeti için ayrıca yetkilendirilseler de m.35\u0027in kurum sayımında yer almazlar.","ayirt":"Bu isim madde metninde bent olarak açıkça yazılı mı, yoksa başka bir kanuna mı tabi?","paragraf":"m.35/1","yanilgi":"Bankaların saklama ve aracılık hizmeti sunması nedeniyle m.35 listesinde sayıldığını düşünüyorsun."},"A":{"gercek":"6362 s.K. m.35/1-g merkezî takas kuruluşlarını ayrı bir sermaye piyasası kurumu olarak sayar.","ayirt":"Bu kurum türü madde metninde bent olarak açıkça yazılı mı?","paragraf":"m.35/1-g","yanilgi":"Takas işlevinin borsanın iç birimi olduğunu, ayrı bir kurum sayılmadığını düşünüyorsun."},"D":{"gercek":"6362 s.K. m.35/1-f varlık kiralama şirketlerini sermaye piyasası kurumu olarak sayar.","ayirt":"Bu şirket türü madde metninde ayrı bent olarak geçiyor mu?","paragraf":"m.35/1-f","yanilgi":"Varlık kiralama şirketlerini yalnız bir finansal araç (kira sertifikası) sanıp kurum saymadın."},"B":{"gercek":"6362 s.K. m.35/1-e konut finansmanı ve varlık finansmanı fonlarını sermaye piyasası kurumu olarak sayar.","ayirt":"Madde metninde fon türleri ayrı bent olarak geçiyor mu?","paragraf":"m.35/1-e","yanilgi":"Fonların tüzel kişiliği olmadığı için Kanun\u0027un kurum saydığı listeye giremeyeceğini düşünüyorsun."}},"verilen":[[1,1]],"donem":6,"hesaplar":{}},{"capa":null,"kural":"TBK m.139/3, zamanaşımına uğramış alacağın takasını, takas edilebileceği anda henüz zamanaşımına uğramamış olması koşuluyla kabul eder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/1 ders 06 Soru 3","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Takas sorularında \u0027ne zaman\u0027 sorusunu beyan tarihine göre değil, iki borcun birlikte muaccel olduğu tarihe göre çöz.","konu":"borcu sona erdiren sebepler","tablo":{"satirlar":[["VERİLENLER","-","-"],["İşletme\u0027nin alacağı","60.000 ₺","-"],["Kişi\u0027nin alacağı","60.000 ₺","-"],["Borçların birlikte varlık tarihi","2023","-"],["Beyan tarihi","2026","-"],["HESAP","-","-"],["A) Takas beyanının zamanaşımı süresi dolduktan sonra yapılm…","TBK m.139/3","YANLIŞ ifade"],["B) İşletme\u0027nin alacağı, iki borcun birlikte var olduğu anda…","TBK m.139/3","doğru ifade"],["C) Alacaklardan birinin ödünç bedeline, diğerinin malzeme b…","TBK m.139/1","YANLIŞ ifade"],["D) Zamanaşımına uğramış bir alacak, Türk Borçlar Kanunu uya…","TBK m.139/3","YANLIŞ ifade"],["E) Taraflar arasında alacaklı ve borçlu sıfatları aynı kişi…","TBK m.135","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Alacaklardan birinin ödünç bedeline, diğerinin malzeme bedeline dayanması, edimlerin özdeş sayılmasını engellediğinden takas mümkün değildir.","E":"Taraflar arasında alacaklı ve borçlu sıfatları aynı kişide birleştiğinden borç zaten sona ermiş olup takas beyanına gerek kalmamıştır.","A":"Takas beyanının zamanaşımı süresi dolduktan sonra yapılmış olması, İşletme\u0027nin takas hakkını ortadan kaldırır.","D":"Zamanaşımına uğramış bir alacak, Türk Borçlar Kanunu uyarınca hiçbir koşulda takasa konu edilemeyeceğinden İşletme\u0027nin beyanı sonuçsuzdur.","B":"İşletme\u0027nin alacağı, iki borcun birlikte var olduğu anda zamanaşımına uğramamış olduğundan, takas beyanı geçerli olarak ileri sürülebilir."},"kaynak":{"alinti":"","liste":[],"hakem":"Soru, TBK m.139/3\u0027te yer alan zamanaşımına uğramış alacağın takas koşulunu doğru şekilde ölçmekte ve kaynak metinde açıkça desteklenen kural uygulanmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Alacakların farklı kaynaklardan doğmasını edim özdeşliğinin önü kesen bir engel sanırsın. Oysa her iki borç da para borcu olduğundan, tanımlanan özdeşlik şartı sağlanmıştır.","E":"Alacaklı-borçlu sıfatlarının aynı kişide toplanması kuralını burada uygulamaya çalışırsın. Oysa bu durum İşletme ve Kişi gibi ayrı iki kişinin arasındaki borçlara değil, aynı kişi için geçerlidir.","D":"Zamanaşımına uğramış alacağın hiçbir koşulda takasa konu olamayacağını genel kural sayarsın. Kanun bunun istisnasını açıkça belirtir: takas edilebileceği anda alacak henüz zamanaşımına uğramamışsa takas ileri sürülebilir.","A":"Takas beyanının zamanlaması ile takas hakkının geçerliliğini karıştırırsın. Kanun, beyanın ne zaman yapıldığını değil, iki borcun birlikte var olduğu andaki durumunu ölçüt alır."},"dogru":"İşletme\u0027nin takas hakkı, 2023\u0027te her iki borç birlikte var olduğu ve alacağı henüz zamanaşımına uğramamış olduğu için geçerlidir. 2026\u0027da beyan yapması önemli değildir, çünkü kanun önemli olan anda iki borcun mevcut olmasını şart koşar.","sinav":"Türk Borçlar Kanunu 139. madde üçüncü fıkrası uyarınca, zamanaşımına uğramış alacağın takası, takas edilebileceği anda henüz zamanaşımına uğramamış olması koşuluyla ileri sürülebilir.","kavramlar":[{"kaynak":"Türk Borçlar Kanunu 139. madde","tanim":"İki kişinin birbirlerine karşılıklı olarak borçlu oldukları edimlerini, alacaklı sıfatıyla karşılaştırıp birbirlerine karşı ortadan kaldırması işlemidir.","ad":"Takas"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":4,"ornekler":[],"donemler":["2019/2","2015/2","2013/3","2011/2"]},"oyun":null,"tip":"teori","soru":"Mobilya üreticisi İşletme\u0027nin, tedarikçisi Kişi\u0027den 2019 yılında verdiği ödünç paraya ilişkin 60.000 ₺ alacağı vardır. Kişi\u0027nin de İşletme\u0027den 2023 yılında teslim ettiği malzeme bedeline ilişkin 60.000 ₺ alacağı bulunmaktadır. İşletme\u0027nin alacağı, iki borcun birlikte var olduğu 2023 yılında zamanaşımına uğramamışken, 2026 yılında zamanaşımına uğramış ve İşletme takas beyanını bu tarihte yapmıştır. Buna göre, aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"smmm-w7-1-yhukuk-zor/kp-01","verilenler":[{"deger":"60.000 ₺","anlam":"İşletme\u0027nin Kişi\u0027den 2019\u0027da doğan ödünç para alacağı, takasa konu edilen alacaktır","ad":"İşletme\u0027nin alacağı"},{"deger":"60.000 ₺","anlam":"Kişi\u0027nin İşletme\u0027den 2023\u0027te doğan malzeme bedeli alacağı, karşı takas konusu borçtur","ad":"Kişi\u0027nin alacağı"},{"deger":"2023","anlam":"İki borcun birlikte muaccel olduğu, takas edilebilir hale geldiği tarihtir","ad":"Borçların birlikte varlık tarihi"},{"deger":"2026","anlam":"İşletme\u0027nin takas beyanını yaptığı, alacağının zaten zamanaşımına uğramış olduğu tarihtir","ad":"Beyan tarihi"}],"dayanak":"TBK m.139/3","dogru":"B","oyunBonus":null,"ders":"Hukuk","adimlar":[{"formul":"Olay: Mobilya üreticisi İşletme, tedarikçisi Kişi\u0027ye 2019\u0027da 60.000 ₺ ödünç vermiş; Kişi de 2023\u0027te İşletme\u0027ye teslim ettiği malzeme bedeli olarak 60.000 ₺ alacaklı olmuş. 2023\u0027te iki borç birlikte varken İşletme\u0027nin alacağı henüz zamanaşımına uğramamış. Zamanaşımı 2026\u0027da tamamlanmış ve İşletme takas beyanını 2026\u0027da yapmış.","anlatim":"Bu olayı iyi çiz kafanda: 2023\u0027te iki borç yan yana duruyor, hiçbiri ölmemiş. 2026\u0027da İşletme\u0027nin alacağı zamanaşımına uğruyor ama beyan yine de o tarihte geliyor.","doldur":[]},{"formul":"Ne yapacağız: TBK m.139/3\u0027e göre zamanaşımına uğramış bir alacak, takas edilebileceği anda henüz zamanaşımına uğramamışsa takasa konu olabilir. 2023\u0027te İşletme\u0027nin alacağı sağlamdı, 2026\u0027da zamanaşımı doldu ama beyan geçerli olabilir mi diye soracağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural tek: önemli olan beyan tarihi değil, borçların birlikte var olduğu andaki durum. Şimdi her şıkkı bu olaya uygulayalım.","doldur":[]},{"doldur":[[6,1],[6,2]],"sik":"A","paragraf":"TBK m.139/3","karar":"yanlış","anlatim":"Olayda beyan 2026\u0027da yapılmış ama 2023\u0027te borçlar sağlamken takas hakkı doğmuş. Kanun beyan tarihine değil, birlikte var olma anına bakar. Bu yüzden bu ifade yanlış.","formul":"Şık A: \u0027Beyan zamanaşımı dolduktan sonra yapıldı, bu yüzden takas hakkı ortadan kalktı\u0027 diyorsun, katılır mısın?"},{"doldur":[[7,1],[7,2]],"sik":"B","paragraf":"TBK m.139/3","karar":"doğru","anlatim":"2023\u0027te iki borç birlikte var ve İşletme\u0027nin alacağı henüz zamanaşımına uğramamıştı, tam da kanunun istediği koşul bu. Sonra 2026\u0027da zamanaşımı dolması artık takası engellemiyor. Bu ifade doğru.","formul":"Şık B: \u0027İşletme\u0027nin alacağı 2023\u0027te zamanaşımına uğramamıştı, o yüzden takas beyanı geçerli\u0027 diyorsun, doğru mu?"},{"doldur":[[8,1],[8,2]],"sik":"C","paragraf":"TBK m.139/1","karar":"yanlış","anlatim":"İki borç da sonuçta para borcu, kaynağının ödünç ya da satış olması önemli değil. Kanun edimin cinsine bakar, kaynağına bakmaz. Bu ifade yanlış.","formul":"Şık C: \u0027Biri ödünç parası biri malzeme bedeli, edimler özdeş değil, takas olmaz\u0027 diyorsun, haklı mısın?"},{"doldur":[[9,1],[9,2]],"sik":"D","paragraf":"TBK m.139/3","karar":"yanlış","anlatim":"Kanun burada istisna koymuş: takas edilebilir anda zamanaşımı dolmamışsa takas yapılabilir, tam bu olaydaki gibi. Demek ki \u0027hiçbir koşulda\u0027 ifadesi yanlış.","formul":"Şık D: \u0027Zamanaşımına uğramış alacak hiçbir koşulda takasa konu olamaz\u0027 diyorsun, bu genel kural her zaman geçerli mi?"},{"doldur":[[10,1],[10,2]],"sik":"E","paragraf":"TBK m.135","karar":"yanlış","anlatim":"Olayda İşletme ve Kişi iki ayrı taraf, hiçbiri diğerinin yerine geçmiş değil. Sıfatların birleşmesi tamamen başka bir kurum, burada uygulanmaz. Bu ifade yanlış.","formul":"Şık E: \u0027Alacaklı ve borçlu sıfatları aynı kişide birleşti, borç zaten sona erdi\u0027 diyorsun, olayda böyle bir birleşme var mı?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru B, çünkü zamanaşımı sorusunda kanun beyan tarihine değil borçların birlikte var olduğu ana bakar. Kendine hep şunu sor: \u0027Zamanaşımı, iki borç bir aradayken mi yoksa daha sonra mı tamamlandı?\u0027","doldur":[]}],"anahtar":[{"ornek":"zamanaşımına","kok":"zamana"},{"ornek":"birlikte","kok":"birlik"},{"ornek":"borçların","kok":"borçla"},{"ornek":"alacağın","kok":"alacağ"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"edilebilir","kok":"edileb"}],"konuGiris":{"harita":"Ne zaman ileri sürülür: Takas beyanının yapıldığı andaki zamanaşımı durumuna bakılır, borcun doğduğu ana değil. Nasıl ölçülür: Takas edilecek alacağın, beyan anında zamanaşımına uğramamış olması aranır. Nasıl kaydedilir: Beyan tarihi ile zamanaşımı süresinin dolduğu tarih karşılaştırılarak sonuca varılır.","desen":"Sınav burada tarih karıştırma tuzağı kurar: borcun doğduğu yıl ile takas beyanının yapıldığı yıl farklı verilir ve öğrencinin yanlış tarihe bakması beklenir. Doğru çözüm, yalnızca beyan anındaki zamanaşımı durumuna bakmayı gerektirir; borcun önceden zamanaşımına uğramamış olması yeterli değildir. Bu soru TBK m.139/3 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Karşılıklı muaccel iki borcun birbirine mahsup edilerek sona ermesi","ad":"Takas","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Borcun ifasının istenebilir hale gelmesi, vadenin dolması","ad":"Muacceliyet","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Alacağın dava edilebilirliğini ortadan kaldıran kanuni süre","ad":"Zamanaşımı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Takas iradesinin açıklandığı, zamanaşımı kontrolünün yapıldığı tarih","ad":"Takas beyanı anı","kim":"kanun sabitler"}],"sinavda":"İki karşılıklı borcun doğum ve zamanaşımı tarihleri verilip takas beyanının geçerli olup olmadığı sorulur.","panel_ornek":"Genç, arkadaşına 500 ₺ borç vermiş; aynı arkadaşı da ona kırtasiyeden aldığı kitap için 500 ₺ borçlu. İki borç da vadesi geldiğinde genç \u0027ikisini eşitleyelim, ödeşmiş sayalım\u0027 diyor. İşte bu karşılıklı borçları eşitleyip sıfırlama işlemine takas denir; ama bunu ancak borç zamanaşımına uğramadan önce yapabilir.","ornek":"Genç, arkadaşına 500 ₺ borç vermiş; aynı arkadaşı da ona kırtasiyeden aldığı kitap için 500 ₺ borçlu. İki borç da vadesi geldiğinde genç \u0027ikisini eşitleyelim, ödeşmiş sayalım\u0027 diyor. İşte bu karşılıklı borçları eşitleyip sıfırlama işlemine takas denir; ama bunu ancak borç zamanaşımına uğramadan önce yapabilir.","yontemler":"Tek kritik kural: zamanaşımı kontrolü, borcun doğduğu tarihte değil takas beyanının yapıldığı tarihte yapılır; beyan anında alacak zamanaşımına uğramışsa takas geçersizdir.","nedir":"Borcu sona erdiren sebepler, bir borç ilişkisinin hangi hukuki olaylarla ortadan kalktığını gösterir. Sınav, hangi sona erme yolunun (takas, birleşme, imkânsızlık) somut olaya uygulanacağını ve koşullarının bilinip bilinmediğini ölçer."},"olay":"2023\u0027te iki borç birlikte mevcut ve İşletme\u0027nin alacağı henüz zamanaşımına uğramamış, zamanaşımı ancak 2026\u0027da tamamlanmıştır.","tuzak":{"C":{"ad":"Kapsam Tuzağı","metin":"Alacakların farklı hukuki kaynaklardan (ödünç, malzeme bedeli) doğmasının edim özdeşliğini bozduğunu düşünürsün. Doğrusu: TBK m.139/1 aynı cins ve nitelikte edimi esas alır, her iki alacak da para borcu olduğundan özdeşlik koşulu sağlanmıştır."},"E":{"ad":"Kurum Karıştırma Tuzağı","metin":"Alacaklı-borçlu sıfatlarının birleşmesini (m.135) takas ile aynı olaya uygularsın. Doğrusu: Birleşme, alacaklı ve borçlunun aynı kişide toplanmasını gerektirir; olayda İşletme ve Kişi ayrı kişiler olduğundan birleşme söz konusu değildir."},"D":{"ad":"Kural Genelleme Tuzağı","metin":"Zamanaşımına uğramış her alacağın takasa konu olamayacağını genel kural sayarsın. Doğrusu: TBK m.139/3 bu genel kurala açık bir istisna getirir; takas edilebilir anda zamanaşımı dolmamışsa takas ileri sürülebilir."},"A":{"ad":"Zamanlama Tuzağı","metin":"Beyanın hangi tarihte yapıldığını belirleyici sanırsın. Doğrusu: TBK m.139/3\u0027e göre önemli olan iki borcun birlikte var olduğu andaki durumdur, beyanın sonradan yapılması hakkı ortadan kaldırmaz."}},"celdiriciYol":{},"hap":"Zamanaşımına uğramış alacağın takası, borçların birlikte var olduğu (takas edilebilir hale geldiği) anda zamanaşımı henüz dolmamışsa geçerlidir.","teshis":{"C":{"gercek":"TBK m.139/1 aynı cins borçları esas alır; kaynağın ödünç ya da satış bedeli olması edimin özdeşliğini etkilemez.","ayirt":"Her iki edim de aynı tür ve nitelikte (para) mi?","paragraf":"TBK m.139/1","yanilgi":"Alacaklardan birinin ödünç para, diğerinin malzeme bedeli olmasının edimlerin özdeşliğini bozduğunu düşünüyorsun."},"E":{"gercek":"Sıfatların birleşmesi (m.135) alacaklı ve borçlunun aynı kişide toplanmasını gerektirir; olayda taraflar farklı kişilerdir, birleşme söz konusu değildir.","ayirt":"Alacaklı ve borçlu aynı kişi mi, yoksa karşılıklı iki ayrı borç mu var?","paragraf":"TBK m.135","yanilgi":"Alacaklı-borçlu sıfatlarının birleşmesiyle borcun sona ermesi kurumunu (m.135), takas ile aynı olaya uygulanabilir sanıyorsun."},"A":{"gercek":"TBK m.139/3 uyarınca belirleyici olan, iki borcun birlikte var olduğu (takas edilebilir hale geldiği) andaki durumdur; beyanın sonradan yapılması hakkı ortadan kaldırmaz.","ayirt":"Zamanaşımı, borçların birlikte var olduğu anda mı yoksa daha sonra mı tamamlanmış?","paragraf":"TBK m.139/3","yanilgi":"Takas beyanının hangi tarihte yapıldığının, hakkın varlığı için belirleyici olduğunu düşünüyorsun."},"D":{"gercek":"TBK m.139/3 istisna getirir: takas edilebilir anda henüz zamanaşımına uğramamışsa takas ileri sürülebilir.","ayirt":"Kanun bu genel kurala istisna getirmiş mi?","paragraf":"TBK m.139/3","yanilgi":"Zamanaşımına uğramış her alacağın takasa konu olamayacağı genel kuralını, kanunun istisnasını görmeden uyguluyorsun."},"B":{"gercek":"TBK m.139/3, takas edilebilir anda zamanaşımı dolmamışsa sonraki zamanaşımının takas hakkını etkilemeyeceğini öngörür.","ayirt":"İki borç birlikte mevcutken zamanaşımı doldu mu, sonra mı doldu?","paragraf":"TBK m.139/3","yanilgi":"Beyan tarihinde alacağın zamanaşımına uğramış olmasının takası tek başına engelleyeceğini düşünüp bu şıkkı elersin."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":4,"hesaplar":{}},{"capa":null,"kural":"303 hesabı bir yıl içinde ödenecek anapara taksitleri ile bunlara ilişkin tahakkuk etmiş ancak ödenmemiş faizleri kapsar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/1 ders 01 Soru 2","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"197.500","taraf":"B","hesap":"400 BANKA KREDİLERİ"},{"tutar":"197.500","taraf":"A","hesap":"303 UZUN VADELİ KREDİLERİN ANAPARA TAKSİTLERİ VE FAİZLERİ"}],"teori":false,"taktik":"Bilanço tarihinden itibaren bir yıl içindeki vadeyi gör; sadece o kısmı aktar, kredinin tamamını değil.","konu":"bilanço düzenleme","tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["VERİLENLER","-"],["Toplam kredi anapara bakiyesi","640.000 ₺"],["Bir yıl içinde ödenecek taksit","185.000 ₺"],["Tahakkuk eden faiz","12.500 ₺"],["HESAP","-"],["Bir yıl içinde ödenecek anapara taksiti","185.000"],["Tahakkuk eden ödenmemiş faiz","12.500"],["303 UZUN VADELİ KREDİLERİN ANAPARA TAKSİTLERİ VE FAİZLERİ hesabı aktarılacak toplam","197.500"]]},"siklar":{"C":"197.500","E":"652.500","A":"12.500","D":"640.000","B":"185.000"},"kaynak  ₺ olan uzun vadeli banka kredisinden, bilanço tarihinden itibaren bir yıl içinde ödenecek 210.000 ₺\u0027lik taksit tutarı ile buna ilişkin tahakkuk etmiş ancak henüz ödenmemiş 9.400 ₺ faiz bulunmaktadır. Bu tutarların 303 Uzun Vadeli Kredilerin Anapara Taksitleri ve Faizleri hesabına aktarılacak toplamı kaç ₺\u0027dir?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve 303 hesabına aktarılacak toplamın kaç ₺ olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin 2026 yılı bilançosunun düzenlenmesinde, toplam anapara bakiyesi 640.000 ₺ olan uzun vadeli banka kredisinden, bilanço tarihinden itibaren bir yıl içinde ödenecek 185.000 ₺\u0027lik taksit tutarı ile buna ilişkin tahakkuk etmiş ancak henüz ödenmemiş 12.500 ₺ faiz bulunmaktadır. Bu tutarların 303 Uzun Vadeli Kredilerin Anapara Taksitleri ve Faizleri hesabına aktarılacak toplamı kaç ₺\u0027dir?","kayitBaslik":"1) Kredinin kısa vadeye sınıflandırılması","id":"smmm-w7-2-fmuh-kolay/kp-01","verilenler":[{"deger":"640.000 ₺","anlam":"Kredinin toplam anapara tutarıdır; yalnız vadesi bir yıl içine düşen kısım 303 hesabına aktarılır, tamamı değildir (çeldirici veri).","ad":"Toplam kredi anapara bakiyesi"},{"deger":"185.000 ₺","anlam":"Bilanço tarihinden itibaren bir yıl içinde ödenecek anapara taksit tutarıdır; 303 hesabına aktarılır.","ad":"Bir yıl içinde ödenecek taksit"},{"deger":"12.500 ₺","anlam":"Taksite ilişkin tahakkuk etmiş ancak henüz ödenmemiş faiz tutarıdır; 303 hesabına anaparayla birlikte aktarılır.","ad":"Tahakkuk eden faiz"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı - 303 Uzun Vadeli Kredilerin Anapara Taksitleri ve Faizleri","dogru":"C","oyunBonus":{"soru":"İşletmenin 2026 yılı bilançosunun düzenlenmesinde, toplam anapara bakiyesi 1.280.000 ₺ olan uzun vadeli banka kredisinden, bilanço tarihinden itibaren bir yıl içinde ödenecek 370.000 ₺\u0027lik taksit tutarı ile buna ilişkin tahakkuk etmiş ancak henüz ödenmemiş 25.000 ₺ faiz bulunmaktadır. Bu tutarların 303 Uzun Vadeli Kredilerin Anapara Taksitleri ve Faizleri hesabına aktarılacak toplamı kaç ₺\u0027dir?","tur":"olcek","kayit":[{"tutar":"395.000","taraf":"B","hesap":"400 BANKA KREDİLERİ"},{"tutar":"395.000","taraf":"A","hesap":"303 UZUN VADELİ KREDİLERİN ANAPARA TAKSİTLERİ VE FAİZLERİ"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Bir yıl içinde ödenecek anapara taksiti 185.000 ₺ (soruda verilen); Tahakkuk eden ödenmemiş faiz 12.500 ₺ (soruda verilen)","anlatim":"Soru bize şunları vermiş: bir yıl içinde ödenecek anapara taksiti ve tahakkuk eden faiz tutarı.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[5,1],[6,1]]},{"formul":"Kapsam = bir yıl içinde ödenecek anapara taksiti + buna ilişkin tahakkuk etmiş ödenmemiş faiz","anlatim":"303 UZUN VADELİ KREDİLERİN ANAPARA TAKSİTLERİ VE FAİZLERİ nedir? Uzun vadeli kredinin bir yıl içinde ödenecek kısmını ve buna ait ödenmemiş faizi taşır. Bilanço tarihinde bu hesaba alacak kaydı yapılır çünkü kısa vadeye aktarılan kaynak artmıştır.","doldur":[]},{"formul":"303 hesabına aktarılacak toplam = anapara taksiti + faiz = 185.000 (soruda verilen) + 12.500 (soruda verilen) = 197.500 ₺","anlatim":"Şimdi biz hesaplıyoruz: iki kalemi topluyoruz çünkü 303 hesabı ikisini birlikte kapsıyor. Anapara taksiti ile faiz ayrı ayrı değil, toplam olarak aktarılır.","doldur":[[7,1]]},{"formul":"Sonuç = 197.500 ₺ (3. adımda bulduk)","anlatim":"Sonuç: 303 hesabına 197.500 ₺ aktarılır. Bu tutar bilançoda kısa vadeli yabancı kaynaklar arasında görünür.","doldur":[]},{"formul":"Yanlış yol: 185.000 = 185.000 (HATALI) → doğrusu 197.500 (3. adımda bulduk)","anlatim":"En sık hata: yalnızca anapara taksitini yazıp faizi unutmak. Faiz tahakkuk etmiş ama ödenmemişse yine 303 hesabına dahildir, atlanamaz.","doldur":[]}],"anahtar":[{"ornek":"anapara","kok":"anapar"},{"ornek":"taksiti","kok":"taksit"},{"ornek":"ödenecek","kok":"ödenec"},{"ornek":"ödenmemiş","kok":"ödenme"},{"ornek":"tahakkuk","kok":"tahakk"},{"ornek":"içinde","kok":"içinde"}],"konuGiris":{"harita":"Ne zaman test edilir: bilanço tarihinde bir yıl içinde vadesi gelecek uzun vadeli borç kısmının ayrıştırılması gerektiğinde test edilir. Nasıl ölçülür: anapara taksit tutarı ile bu taksite ait tahakkuk etmiş faiz tutarı toplanarak ölçülür. Nasıl kaydedilir: bulunan toplam, 303 Uzun Vadeli Kredilerin Anapara Taksitleri ve Faizleri hesabına aktarılarak kısa vadeli yabancı kaynaklar grubunda kaydedilir.","desen":"Sınav genellikle toplam anapara bakiyesini tuzak olarak verir; öğrenci tüm bakiyeyi 303\u0027e taşırsa yanlış yapar, sadece kısa vadeli kısım ve faizi toplaması gerekir. Bazı dönemlerde faiz tutarı unutulup sadece taksit yazılması istenen tuzaktır. Bu soru kısa vadeli kısmın ayrıştırılması ve 303 hesabın kapsamı noktasından geliyor (30 dönemde soruldu).","terimler":[{"kaynak":"soruda verilir","tanim":"Uzun vadeli kredinin bir yıl içinde ödenecek anapara kısmı","ad":"Anapara taksit tutarı","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Dönem sonuna kadar hesaplanmış ama ödenmemiş faiz tutarı","ad":"Tahakkuk eden faiz","kim":"piyasa fiyatlar"},{"kaynak":"kuraldan bilinir","tanim":"Uzun vadeli kredinin bir yıl içinde ödenecek anapara ve faiz kısmının izlendiği hesap","ad":"303 hesap","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Kredinin henüz ödenmemiş tüm anapara tutarı, kısa-uzun ayrımı yapılmamış hali","ad":"Toplam anapara bakiyesi","kim":"piyasa fiyatlar"}],"sinavda":"Toplam kredi bakiyesi, bir yıl içinde ödenecek taksit tutarı ve buna ait tahakkuk etmiş faiz verilir; 303 hesaba aktarılacak toplam tutar istenir.","panel_ornek":"Bir genç, 90.000 ₺ kalan araba kredisinden gelecek 12 ay içinde ödeyeceği 20.000 ₺ taksit tutarını ve bu taksite ait henüz ödenmemiş 1.000 ₺ faizi not defterine \u0027bu yıl çıkacak\u0027 diye ayırıyor. Toplamda 21.000 ₺\u0027yi kısa vadeli olarak görüyor. Yani uzun vadeli borcun bir kısmı, vadesi yaklaşınca kısa vadeliye kayıyor.","ornek":"Bir genç, 90.000 ₺ kalan araba kredisinden gelecek 12 ay içinde ödeyeceği 20.000 ₺ taksit tutarını ve bu taksite ait henüz ödenmemiş 1.000 ₺ faizi not defterine \u0027bu yıl çıkacak\u0027 diye ayırıyor. Toplamda 21.000 ₺\u0027yi kısa vadeli olarak görüyor. Yani uzun vadeli borcun bir kısmı, vadesi yaklaşınca kısa vadeliye kayıyor.","yontemler":"Sadece bir yıl içinde vadesi gelecek anapara taksiti ile buna ait tahakkuk etmiş faiz toplanır; toplam bakiyenin kalan kısmı 405 hesapta uzun vadeli olarak kalır.","nedir":"Bilanço, işletmenin belirli bir tarihteki varlık, borç ve öz kaynaklarını gösteren tabloyu düzenleme işlemidir. Sınav, uzun vadeli bir borcun kısa vadeye alınan kısmının doğru hesaba ve doğru tutarla taşınıp taşınmadığını ölçer."},"olay":"185.000+12.500=197.500","tuzak":{"D":{"ad":"Tümünü Aktarma Tuzağı","metin":"Öğrenci kredinin vade ayrımı yapmadan tamamını kısa vadeli hesaba taşır. Doğrusu: Sadece bir yıl içinde ödenecek 185.000 ₺\u0027lik kısım ile faizi 303 hesabına aktarılır, kalan uzun vadeli olarak izlenir."},"E":{"ad":"Toplam Anaparaya Faiz Ekleme Tuzağı","metin":"Öğrenci kredinin tüm anaparasını kısa vadeye alır ve üstüne faizi ekler. Doğrusu: 303 hesabına aktarılacak tutar sadece bir yıl içinde ödenecek 185.000 ₺ ile faizin toplamı olan 197.500 ₺\u0027dir."},"A":{"ad":"Yalnızca Faiz Tuzağı","metin":"Öğrenci sadece tahakkuk eden faizi 303 hesabına aktarır, anapara taksitini unutur. Doğrusu: 303 hesabı hem taksiti hem faizi kapsar, tutar 185.000+12.500=197.500 olmalıdır."},"B":{"ad":"Yalnızca Anapara Tuzağı","metin":"Öğrenci taksit tutarını doğru bulur ama tahakkuk eden faizi 303 hesabına eklemeyi unutur. Doğrusu: 303 hesabı anapara taksiti ile faizin toplamını kapsar, 197.500 olmalıdır."}},"celdiriciYol":{"D":"640.000 = 640.000 (kredinin tüm anaparasını vade ayrımı yapmadan kısa vadeli hesaba aktardı)","E":"640.000 + 12.500 = 652.500 (kredinin t inin dönem boyunca taşınan stok seviyesini temsil ettiğini düşündün."}},"verilen":[[6,1],[7,1],[9,1],[1,1],[2,1],[3,1],[4,1]],"donem":13,"hesaplar":{}}];

  if(o.sim&&o.sim.dogru===false) return {k:'alarm',ad:'🔴 Alarm',neden:'Nöbetçi öğrencisi bu anlatımla ikizi çözemedi; dikkat ister'};
  if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}

      // hedef = "Sonuç" adımı; son adım "Yanlış yol / en sık hata" ise ondan önceki sonuç adımıdır

      serit.innerHTML='<div class="adimK'+(son?' sonAdim':'')+(yon<0?' geri':'')+'"><div class="say"><span>ADIM '+(j+1)+' / '+s.adimlar.length+'</span><span class="baslik">'+esc(adimBaslik(a))+'</span></div><code class="mat0">'+fH+'</code><p>'+anlatimH+'</p>'+yolH+sonBtn+'</div>';
      // Cem 04.09 "numaralara basarak sayfa değiştirsek": yol haritası yuvarlakları tıklanınca o adıma gider

      const bo=serit.querySelector('.bDersOyun'); if(bo){ bo.addEventListener('click',()=>{ ders.classList.remove('acik'); oyunKur(); oyun.classList.add('acik'); }); }
      const bb=serit.querySelector('.bDersBitti'); if(bb){ bb.addEventListener('click',()=>{ ders.classList.remove('acik'); const cA=k.querySelector('.cAnlat'); if(cA){ if(cA.offsetParent===null){ const bd=k.querySelector('.bDaha'); if(bd) bd.click(); } cA.click(); const ta=k.querySelector('.anlatK'); if(ta) setTimeout(()=>ta.focus(),200); } }); }
