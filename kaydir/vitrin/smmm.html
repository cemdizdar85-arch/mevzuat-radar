<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".
   Varsayılan = sitenin açık paleti (stil-acik.css değerleri; stil.css BAĞLANMAZ: .kart/.sik/.btn/.kutu seçicileri çakışır).
   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. 24.09 Cem: VARSAYILAN KOYU ("sitenin rengi bu olsun"); beyaz yalnız düğmeyle (kc_tema=light) ya da ?tema=acik ile; işletim sistemi izlenmez, site de izlemiyor. */
/* 04.10 (Cem: kart ekranı da sitenin görsel dilinde): yazı lacivert (eski #16191d), ikincil lacivert-gri (eski #4b5563), vurgu laciverte çekildi (eski parlak mavi #1d4ed8), altın = site amberi (eski #a04a08). Zemin SAF BEYAZ kalır (09.09 Cem). */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#0f1b2d;--metin:#0f1b2d;--dim:#3d4b63;--mavi:#1f3b73;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#8a6224;--ustYazi:#ffffff}
:root[data-theme="dark"]{--bg:#141518;--bg2:#0f1013;--kart:#1e2026;--cizgi:#2e3138;--yazi:#e9e9ec;--metin:#e9e9ec;--dim:#9aa1ad;--mavi:#78b4ff;--yesil:#8fc98f;--kirmizi:#e07b7b;--altin:#e0a458;--ustYazi:#0f1013}
.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
/* 13.09 Cem: "nöbetçi çöz dediğinde sadece ekrandaki soru çözsün, başka alt alta soru olmasın."
   ?tek=1 = ana sayfa çerçevesi: YALNIZ #s=<sıra> kartı görünür, akış kaydırılamaz,
   "Sonraki" ve "yukarı kaydır" ipucu gizlenir (sonraki kart yokken yanıltır). */
:root[data-tek] #akis{overflow:hidden;scroll-snap-type:none}
:root[data-tek] #akis>*:not(.tekKart){display:none}
:root[data-tek] .bSonraki,:root[data-tek] .ipucu{display:none}
/* tek kartta dizi göstergeleri yanıltır: ilerleme noktaları, "10 / 10" sayacı, hazırlık skoru ve yanlış kutusu çipleri gizli. */
:root[data-tek] .noktalar,:root[data-tek] .ustSag{display:none}
/* 13.09 Cem: "renk koyu olsa, site rengi". Ana sayfa çerçevesi koyu açılır (tema=koyu);
   koyu temanın MAVİ vurgusu yalnız çerçevede sitenin BRONZUNA çevrilir. Ürünün kendi
   teması değişmez - kural data-tek'e bağlı, normal Kaydır-Çöz'e dokunmaz. */
:root[data-tek][data-theme="dark"]{--mavi:#e3b877}
/* 13.09 Cem onayı: akran satırı ("👥 9 adayın %89'u senin gibi B dedi") çerçevede gizli.
   Örneklem küçükken ilk kez gelen ziyaretçi "sitede 9 kişi var" diye okur. Üründe durur. */
:root[data-tek] .akranNot{display:none}
/* Aynı akran verisi şıkların üstüne de basılıyor (.sikYuzde: "B) 1,50 %89", "C) 1,67 %0").
   Öğrenci turunda görüldü: doğru cevabın yanında %0, ilk gelene "site bozuk mu" dedirtiyor. */
:root[data-tek] .sikYuzde{display:none}
/* 13.09 Cem seçimi (tek tek gidildi): Alarm rozeti (kişisel ustalık seviyesi, ilk gelene
   anlamsız ve kırmızı "Alarm" hata gibi okunuyor) ile cevap sonrası ikinci "Kâğıdım" düğmesi
   (üstteki "Kâğıt" aynı işi yapıyor) çerçevede gizli. "Daha fazla" ve "Sen çöz" KALDI. */
:root[data-tek] .seviye,:root[data-tek] .cKagit{display:none}
/* 13.09 Cem: "Hata bildir'i sil". Vitrinden gelen bildirim gerçek adayların bildirimleriyle
   aynı kutuya düşerdi; ana sayfa ziyaretçisine hata düğmesi de güven vermez. Üründe durur. */
/* Özgüllük: ürünün ".cipler.acikEk .cip2.ek{display:inline-block}" kuralı (0,4,0) "Daha fazla"
   açılınca ":root[data-tek] .cHata"yı (0,3,0) eziyordu - ölçüldü. Seçici (0,5,0)'a çıkarıldı, !important yok. */
:root[data-tek] .cipler .cip2.cHata{display:none}
/* 03.10 (Cem "Nöbetçi kartına sen bak"): tek kartta Kâğıt düğmesi alttan sağ üste - telefonda çerçeve kısa, soru/şık metninin
   üstüne biniyordu (canlı 390 px ölçüldü); üst köşe tek kipte boş (sayaç ve çipler gizli). Düğme kalır (13.09 Cem seçimi). */
:root[data-tek] .kagitAc{bottom:auto;top:8px;right:8px;padding:5px 10px;font-size:.78em}

const VITRIN=/[?&]vitrin=1/.test(location.search);

ders 02 Soru 5","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Elindeki tutarin hangi yuzdeye karşılık geldigini yaz, önce tabani (net satisi) bul, sonra istenen kalemin yuzdesini o tabana uygula.","konu":"dikey yüzde analizi","tablo":{"satirlar":[["VERİLENLER","-","-"],["SMM tutarı","720.000 ₺","-"],["SMM yüzdesi","%60","-"],["Brüt satış kârı yüzdesi","%40","-"],["Faaliyet giderleri yüzdesi","%25","-"],["HESAP","-","-"],["Net Satışlar","720.000/0,60","1.200.000"],["Brüt Satış Kârı","1.200.000x0,40","480.000"],["Faaliyet Giderleri","1.200.000x0,25","300.000"],["Faaliyet Kârı Yüzdesi","%40-%25","%15"],["Faaliyet Kârı","1.200.000x0,15","180.000"]],"basliklar":["Kalem","Hesap","Tutar"]},"siklar":{"C":"288.000","E":"480.000","A":"180.000","D":"300.000","B":"270.000"},"kaynak":{"alinti":"","liste":[],"hakem":"Soru dikey yüzde analizinin temel kuralını (gelir tablosunda taban net satışlar) ve faaliyet kârı hesaplamasını doğru ölçüyor; kaynak metinde açıkça desteklenen yöntem ve kural uygulanmıştır."},"kayitlar":[],"sade":{"siklar":{"C":"Satılan malın maliyeti tutarını doğrudan net satış sanmış, brüt kâr yüzdesini buna uygulamak yanlış; önce toplam net satışı bulup daha sonra faaliyet kârı yüzdesini uygulamalısın.","E":"Brüt satış kârını faaliyet giderlerini hiç çıkartmadan faaliyet kârı sanmış; faaliyet giderleri mutlaka brüt kârdan düşülmesi gerekir.","D":"Faaliyet giderleri tutarını brüt kârdan eksiltmeden tek başına faaliyet kârı olarak aldın; faaliyet kârına ulaşmak için yüzdeler farkını alıp net satışlarla çarpmalısın.","B":"Net satışı bulmak için maliyeti (1 − 0,60) ile bölmek yanlış; doğru işlem maliyeti kendi yüzdesine bölmektir. Bu hata net satışı 1.800.000 olarak yanlış hesaplattığı için faaliyet kârı da 270.000 çıkıyor."},"dogru":"Net satışları bulmak için satılan malın maliyeti tutarını, maliyetin yüzdesine bölüyoruz: 720.000 ÷ 0,60 = 1.200.000 ₺. Faaliyet kârı, brüt kâr yüzdesinden faaliyet giderleri yüzdesini çıkartıp net satışlarla çarparak bulunur: (0,40 − 0,25) × 1.200.000 = 180.000 ₺.","sinav":"Dikey yüzde analizinde gelir tablosunun tabanı net satışlardır; satılan malın maliyeti tutarından net satışlar ters hesapla bulunur, faaliyet kârı brüt kâr yüzdesinden faaliyet giderleri yüzdesinin farkı ile hesaplanır.","kavramlar":[{"kaynak":"TEORI","tanim":"Tek bir dönemin mali tablosunda her kalemin, ait olduğu toplam içindeki payını yüzde olarak gösterir. Gelir tablosunda net satışlar 100 kabul edilerek diğer kalemler bu taban üzerinden hesaplanır.","ad":"Dikey yüzde analizi"},{"kaynak":"TEORI","tanim":"Gelir tablosunda dikey yüzde analizinin tabanı olarak alınan, işletmenin gerçek satış geliridir.","ad":"Net satışlar"},{"kaynak":"TEORI","tanim":"Brüt satış kârından faaliyet giderlerinin çıkartılması sonucu elde edilen kârdır; işletmenin temel faaliyetlerinden elde ettiği kazancı gösterir.","ad":"Faaliyet kârı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":14,"ornekler":[],"donemler":["2026/2","2026/1","2025/3","2025/2","2024/1","2023/2","2022/3","2014/3","2014/1","2013/3","2013/1","2012/1","2011/3","2010/3"]},"oyun":{"bosluk":[[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2]],"tablo":{"basliklar":["Kalem","Hesap","Tutar"],"satirlar":[["Net Satışlar","850.000/0,50","1.700.000"],["Brüt Satış Kârı","1.700.000x0,50","850.000"],["Faaliyet Giderleri","1.700.000x0,20","340.000"],["Faaliyet Kârı Yüzdesi","%50-%20","%30"],["Faaliyet Kârı","1.700.000x0,30","510.000"]]},"tur":"tablo","soru":"İşletme, gelir tablosunun dikey yüzde analizinde net satışları taban almaktadır. Satılan malın maliyeti 850.000 ₺ ve net satışların %50\u0027si, brüt satış kârı net satışların %50\u0027si, faaliyet giderleri net satışların %20\u0027sidir. Brüt satış kârı kaç ₺\u0027dir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve Brüt Satış Kârı\u0027nın kaç ₺ olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, gelir tablosunun dikey yüzde analizinde net satışları taban almaktadır. Satılan malın maliyeti 720.000 ₺ ve net satışların %60\u0027ı, brüt satış kârı net satışların %40\u0027ı, faaliyet giderleri net satışların %25\u0027idir. Faaliyet kârı kaç ₺\u0027dir?","kayitBaslik":"","id":"smmm-4k-a-yfta-zor-r6/kp-01","verilenler":[{"deger":"720.000 ₺","anlam":"Satılan malın maliyetinin gerçek tutarı, net satışın %60\u0027ina karşılık gelir, net satışı bulmakta kullanılır.","ad":"SMM tutarı"},{"deger":"%60","anlam":"SMM tutarının net satışlara oranı, net satışı geri çıkarmak için bölen olarak kullanılır.","ad":"SMM yüzdesi"},{"deger":"%40","anlam":"Net satışların brüt kâr olarak kalan payı, faaliyet kârı yüzdesini bulmakta başlangıç değeridir.","ad":"Brüt satış kârı yüzdesi"},{"deger":"%25","anlam":"Brüt kârdan düşülecek faaliyet giderlerinin net satışlara oranı, faaliyet kârı yüzdesini bulmakta çıkarılan değerdir.","ad":"Faaliyet giderleri yüzdesi"}],"dayanak":"Teori Notu - Dikey Yuzdelerden Net Satış ve Gelir Tablosu Hesaplari (Mali Tablolar Analizi)","dogru":"A","oyunBonus":null,"ders":"Finansal Tablolar ve Analizi","adimlar":[{"formul":"Verilen: Satılan malın maliyeti 720.000 ₺ (soruda verilen); Satılan malın maliyeti oranı %60 (soruda verilen); Brüt satış kârı oranı %40 (soruda verilen); Faaliyet giderleri oranı %25 (soruda verilen)","anlatim":"Soru bize satılan malın maliyetini veriyor: 720.000 ₺, net satışların %60\u0027ı. Diğer yüzdeleri de veriyor: brüt satış kârı %40, faaliyet giderleri %25.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Net Satışlar = Satılan Malın Maliyeti / Oran = 720.000 (soruda verilen) / %60 (soruda verilen) = 1.200.000","anlatim":"Dikey yüzde analizinde taban net satışlardır - her kalem ona bölünerek yüzde bulunur. Biz tersini yapıyoruz: tutarı yüzdesine bölüp tabanı buluyoruz.","doldur":[[6,1],[6,2]]},{"formul":"Brüt Satış Kârı = Net Satışlar × Oran = 1.200.000 (2. adımda bulduk) × %40 (soruda verilen) = 480.000","anlatim":"Net satışları bulduk, artık brüt satış kârını yüzdesinden hesaplayabiliriz. Yüzde biliniyorsa taban ile çarpmak yeterli.","doldur":[[7,1],[7,2]]},{"formul":"Faaliyet Giderleri = Net Satışlar × Oran = 1.200.000 (2. adımda bulduk) × %25 (soruda verilen) = 300.000","anlatim":"Faaliyet giderlerini de aynı mantıkla buluyoruz, taban yine net satışlar. Bu tutar faaliyet kârından düşülecek.","doldur":[[8,1],[8,2]]},{"formul":"Faaliyet Kârı Yüzdesi = Brüt Satış Kârı Oranı - Faaliyet Giderleri Oranı = %40 (soruda verilen) - %25 (soruda verilen) = %15","anlatim":"Faaliyet kârı yüzdesini tutar hesaplamadan, direkt yüzdeler üzerinden bulabiliriz. Brüt kâr yüzdesinden faaliyet gideri yüzdesini çıkarmak yeter.","doldur":[[9,1],[9,2]]},{"formul":"Faaliyet Kârı = Net Satışlar × Oran = 1.200.000 (2. adımda bulduk) × %15 (5. adımda bulduk) = 180.000","anlatim":"Şimdi bu yüzdeyi net satışlarla çarpıp gerçek tutarı buluyoruz. Bu bize sorulan faaliyet kârı tutarıdır.","doldur":[[10,1],[10,2]]},{"formul":"Sonuç: Faaliyet Kârı = 180.000 ₺","anlatim":"Faaliyet kârı 180.000 ₺ olarak bulundu. Bu, tüm yüzde hesaplarının doğru taban üzerinden yapılmasıyla çıkan sonuçtur.","doldur":[]},{"formul":"Ters durum: Faaliyet giderleri oranı \u003e Brüt satış kârı oranı → Faaliyet Zararı (negatif fark)","anlatim":"Ters durumda faaliyet gideri oranı brüt kâr oranından büyük olsaydı, faaliyet kârı negatif çıkar, yani faaliyet zararı oluşurdu. Bu durumda yüzde farkı eksi işaretli olur.","doldur":[]},{"formul":"Yanlış yol: 720.000 × %40 = 288.000 (HATALI) → doğrusu 180.000 (6. adımda bulduk)","anlatim":"En sık hata: net satışları bulmadan 720.000\u0027i net satış sanıp yüzde uygulamak; bu yol C şıkkına (288.000) götürür. Taban her zaman net satışlardır, satılan malın maliyeti değil.","doldur":[]}],"anahtar":[{"ornek":"faaliyet","kok":"faaliy"},{"ornek":"yüzdesine","kok":"yüzdes"},{"ornek":"satışlardır","kok":"satışl"},{"ornek":"gideri","kok":"gideri"},{"ornek":"bulunur","kok":"bulunu"},{"ornek":"bölünerek","kok":"bölüne"}],"konuGiris":{"harita":"Ne zaman test edilir: net satışlar taban alınıp maliyet-gider-kâr kalemleri yüzdeye çevrilmesi istendiğinde. Nasıl ölçülür: her kalem net satışlara bölünüp yüzde bulunur, sonra tutarlar toplanıp çıkarılarak faaliyet kârı hesaplanır. Nasıl kaydedilir: bulunan yüzdeler ve tutarlar net satış = 100 tabanına göre karşılaştırmalı yazılır.","desen":"Sınav genelde bir kalemi tutar, diğerlerini yüzde vererek karışık bilgi sunar; öğrenci tutarı önce net satışa çevirmeyi unutur. Tuzak, doğrudan verilen yüzdeleri toplamak yerine önce net satış tutarını bulmayı gerektirir. Bu soru gelir tablosunda net satış tabanından tersine hesaplama noktasından geliyor (p.28, 14 dönemde soruldu).","terimler":[{"kaynak":"soruda verilir","tanim":"Gelir tablosunda dikey analizde taban alınan, %100 kabul edilen tutar","ad":"Net satışlar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Net satışların belirli yüzdesi olarak verilen maliyet kalemi","ad":"Satılan malın maliyeti","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Net satışlardan satılan malın maliyeti düşüldükten sonra kalan tutar","ad":"Brüt satış kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Brüt satış kârından faaliyet giderleri düşüldükten sonra kalan tutar","ad":"Faaliyet kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soru, satılan malın maliyeti tutarı ile net satışların bazı kalemlerinin yüzdelerini verip faaliyet kârının tutarını sormaktadır.","panel_ornek":"Bir genç ayda 10.000 ₺ kazanıyor; kirası gelirinin %30\u0027u, yemek gideri %20\u0027si. Kalan tutarları 100 üzerinden yüzdeyle görünce nereye ne kadar harcadığını daha net anlıyor.","ornek":"Bir genç ayda 10.000 ₺ kazanıyor; kirası gelirinin %30\u0027u, yemek gideri %20\u0027si. Kalan tutarları 100 üzerinden yüzdeyle görünce nereye ne kadar harcadığını daha net anlıyor.","yontemler":"Önce SMM tutarından net satış tutarı bulunur (tutar/yüzde), sonra brüt kâr ve faaliyet gideri yüzdeleri bu net satışa uygulanarak faaliyet kârı hesaplanır.","nedir":"Dikey yüzde analizi, tek bir dönemde tablo kalemlerinin toplam içindeki payını gösterir. Gelir tablosunda sınav, net satışları taban alarak maliyet, kâr ve gider kalemlerinin yüzdesini doğru okuyup okumadığını ölçer."},"olay":"Net Satışlar=720.000/0,60=1.200.000; Faaliyet Kârı yüzdesi=%40-%25=%15; Faaliyet Kârı=1.200.000x0,15=180.000.","tuzak":{"C":{"ad":"Kademe Atlama Tuzağı","metin":"SMM tutarını net satış sanıp doğrudan brüt kâr yüzdesiyle çarptın (720.000x0,40). Doğrusu: önce net satış 1.200.000 bulunur, faaliyet kârı bu tutarın yüzde 15idir, yani 180.000 dir."},"E":{"ad":"Katman Eksik Tuzağı","metin":"brüt satış kârını faaliyet giderlerini hiç düşmeden faaliyet kârı sandın (1.200.000x0,40). Doğrusu: faaliyet giderleri brüt kârdan düşülmeden faaliyet kârına ulaşılmaz; sonuç 180.000 dir."},"D":{"ad":"Yön Karıştırma Tuzağı","metin":"faaliyet giderleri tutarını brüt kârdan düşmeyi atlayıp onu tek başına faaliyet kârı sandın (1.200.000x0,25). Doğrusu: faaliyet kârı, brüt kâr yüzdesinden faaliyet gideri yüzdesi düşülerek (%15) hesaplanan tutardır, 180.000 dir."},"B":{"ad":"Taban Karıştırma Tuzağı","metin":"SMM tutarını net satış yerine (1-SMM yüzdesi) ile bölerek net satışı 1.800.000 buldun, halbuki doğru işlem tutarın kendi yüzdesine bölünmesidir. Doğrusu: net satış 720.000/0,60=1.200.000 olup faaliyet kârı 180.000 dir."}},"celdiriciYol":{"C":"720.000x0,40=288.000 (SMM tutarını net satış sanıp doğrudan brüt kâr yüzdesini uygulama)","E":"1.200.000x0,40=480.000 (brüt satış kârını faaliyet giderlerini düşmeden faaliyet kârı sanma)","D":"1.200.000x0,25=300.000 (faaliyet giderleri tutarını faaliyet kârı sanma)","B":"720.000/0,40=1.800.000; 1.800.000x0,15=270.000 (net satışı tümleyen yüzdeyle bulma hatası)"},"hap":"Gelir tablosu dikey yüzdelerinde taban net satışlardır; bilinen bir kalemin tutarı kendi yüzdesine bölünerek net satış, faaliyet kârı yüzdesi ise brüt kâr yüzdesinden faaliyet gideri yüzdesi düşülerek bulunur.","teshis":{"C":{"gercek":"SMM tutarı net satışın yalnızca %60\u0027ini temsil eder; önce tutar/(yüzde/100) ile net satış bulunmadan diğer yüzdeler tutara çevrilemez.","ayirt":"Elimdeki tutar toplamın kendisi mi yoksa bir pay mı?","paragraf":"Teori Notu - Dikey Yüzdelerden Net Satış Hesabı","yanilgi":"SMM tutarının doğrudan net satış olduğunu ya da SMM\u0027nin net satışa oranını hesaba katmadan işlem yapılabileceğini düşünürsün."},"E":{"gercek":"Faaliyet giderleri (araştırma-geliştirme, pazarlama-satış-dağıtım, genel yönetim) brüt satış kârından düşülerek faaliyet kârına ulaşılır; bu katman atlanamaz.","ayirt":"Brüt kârdan sonra düşülmesi gereken bir gider grubu var mı?","paragraf":"Teori Notu - Dikey Yüzdelerden Net Satış ve Gelir Tablosu Hesapları","yanilgi":"Brüt satış kârının, faaliyet giderleri düşülmeden faaliyet kârı ile aynı şey olduğunu düşünürsün."},"A":{"gercek":"Dikey yüzde analizinde gelir tablosu tabanı net satışlardır; bilinen bir kalemin tutarı yüzdesine bölünerek taban geri çıkarılır, sonra diğer kalemler bu tabanın yüzdesi olarak bulunur.","ayirt":"Elimdeki tutar hangi yüzdeye karşılık geliyor, tabanı (net satışı) bulmadan diğer kalemi hesaplayabilir miyim?","paragraf":"Teori Notu - Dikey Yüzdelerden Net Satış ve Gelir Tablosu Hesapları","yanilgi":"Bu şıkkı eleyen öğrenci net satışı bulmadan doğrudan verilen tutarlarla işlem yapabileceğini düşünür."},"D":{"gercek":"Faaliyet Kârı yüzdesi = Brüt Satış Kârı yüzdesi - Faaliyet Giderleri yüzdesi; faaliyet giderleri tutarı faaliyet kârı değil, ondan önce düşülmesi gereken bir kalemdir.","ayirt":"Bu tutar bir gider mi yoksa gider düşüldükten sonraki kâr mı?","paragraf":"Teori Notu - Dikey Yüzdelerden Net Satış ve Gelir Tablosu Hesapları","yanilgi":"Faaliyet giderleri tutarını bulmanın faaliyet kârını bulmakla aynı işlem olduğunu sanırsın."},"B":{"gercek":"Net Satış = Kalem Tutarı / (Kalem Yüzdesi/100) formülü SMM yüzdesinin kendisiyle böler, tümleyeniyle değil.","ayirt":"Bu kalemin yüzdesi net satışın kendisine mi yoksa tümleyenine mi karşılık geliyor?","paragraf":"Teori Notu - Dikey Yüzdelerden Net Satış Hesabı","yanilgi":"Bir yüzdeyi tabana dönüştürmek için tutarı yüzdesine bölmek yerine (1-yüzde) ile bölebileceğini düşünürsün."}},"verilen":[[6,2],[1,1],[2,1],[3,1],[4,1]],"donem":14,"hesaplar":{}},{"capa":null,"kural":"Net satışlar eksi satılan malın maliyeti brüt satış kârına eşittir; satılan malın maliyeti dönem başı stok artı net alışlar eksi dönem sonu stok formülünden alışlar ters çözülür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/2 ders 03 Soru 8","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ters sorularda önce hangi büyüklüğün isteneceğini belirle, sonra formülü o değişken için yeniden düzenle.","konu":"satışların maliyeti tablosu","tablo":{"satirlar":[["VERİLENLER","-"],["Brüt satışlar","685.000 ₺"],["Satıştan iadeler","12.500 ₺"],["Satış iskontoları","8.700 ₺"],["Dönem başı ticari mal stoku","47.350 ₺"],["Dönem sonu ticari mal stoku","39.900 ₺"],["Pazarlama ve genel yönetim gideri","65.200 ₺"],["Finansman gideri","21.400 ₺"],["Brüt satış kârı","210.150 ₺"],["HESAP","-"],["Net Satışlar (685.000-12.500-8.700)","663.800"],["Satılan Ticari Malların Maliyeti (663.800-210.150)","453.650"],["Dönem İçi Net Alışlar (453.650-47.350+39.900)","446.200"]],"basliklar":["Kalem","Tutar (₺)"]},"siklar":{"C":"454.900","E":"467.400","A":"202.700","D":"461.100","B":"446.200"},"kaynak":{"alinti":"","liste":[],"hakem":"Soru Brüt satış kârı formülü (Net satışlar − Satışların maliyeti = Brüt satış kârı) ve satılan ticari malların maliyeti formülünün (Dönem başı stok + Net alışlar − Dönem sonu stok) uygulanmasını ölçmektedir; her iki kural kaynak metinde açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Satış iskontosunu (8.700) düşmeyi unutup brüt satışlardan yalnız iadeleri çıkarırsan net satışları 672.500 ₺ ile yüksek bulursun; bu da satılan malın maliyetini (672.500 − 210.150 = 462.350) ve alışları (462.350 − 47.350 + 39.900 = 454.900) yüksek hesaplamana yol açar. Net satışlar, brüt satışlardan hem iadeler hem iskontolar düşülerek bulunmalıdır.","E":"Satış indirimlerini hiç düşmeyip brüt satışları net satış olarak işleme aldığında, satılan malın maliyetini ve buradan alışları yüksek bulursun. Net satışlar brüt satışlardan satıştan iadeler ve iskontolar düşülerek elde edilir.","D":"Dönem başı stoku (47.350) çıkarıp dönem sonu stoku (39.900) eklersen 453.650 − 39.900 + 47.350 = 461.100 bulursun. Satılan malın maliyeti formülünde dönem başı stok maliyete eklenir, dönem sonu stok çıkarılır çünkü dönem sonu stok satılmamıştır; formül ters çözülürken de bu yönler korunmalıdır.","A":"Brüt satış kârını doğrudan satılan malın maliyeti sandığında, alışları hemen bu kârdan çıkarmış olursun. Yapılması gereken: önce net satışlardan brüt kârı çıkartıp satılan malın maliyetini, ardından stok formülünü uygulamaktır."},"dogru":"Net satışları bulmak için brüt satışlardan iadeler ve iskontolar çıkarılır (663.800 ₺). Sonra bu net satışlardan brüt satış kârı çıkarılarak satılan malın maliyeti bulunur (453.650 ₺). Son olarak satılan malın maliyet formülünden alışlar ters çözülür: dönem başı stok artı alışlar eksi dönem sonu stok eşittir satılan maliyet; buradan alışlar 446.200 ₺ çıkar.","sinav":"Brüt satış kârı net satışlardan hesaplanır ve satılan ticari malların maliyeti dönem başı stok artı dönem içi net alışlar eksi dönem sonu stoktan bulunur.","kavramlar":[{"kaynak":"TEORI","tanim":"Brüt satışlardan satıştan iadeler, satış iskontoları ve diğer indirimler düşülerek bulunan satış geliridir.","ad":"Net satışlar"},{"kaynak":"TEORI","tanim":"Dönem içinde satılan ticari malların maliyetidir; dönem başı stok artı dönem içi net alışlar eksi dönem sonu stok formülü ile hesaplanır.","ad":"Satılan ticari malların maliyeti"},{"kaynak":"TEORI","tanim":"Net satışlardan satışların maliyeti çıkartılarak bulunan kârdır ve faaliyet giderleri hesaplanmadan önceki kârda bulunur.","ad":"Brüt satış kârı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":11,"ornekler":[],"donemler":["2026/2","2019/1","2016/3","2014/3","2014/2","2014/1","2013/3","2012/3","2011/2","2009/1","2008/2","2008/1"]},"oyun":{"bosluk":[[2,1]],"tablo":{"basliklar":["Kalem","Tutar (₺)"],"satirlar":[["Net Satışlar (720.000-15.000-9.400)","695.600"],["Satılan Ticari Malların Maliyeti (695.600-225.300)","470.300"],["Dönem İçi Net Alışlar (470.300-52.400+41.500)","459.400"]]},"tur":"tablo","soru":"İşletme, dönem içinde 720.000 ₺ brüt satış gerçekleştirmiştir; satıştan iadeler 15.000 ₺, satış iskontoları 9.400 ₺\u0027dir. Ticari mal dönem başı stoku 52.400 ₺, dönem sonu stoku 41.500 ₺\u0027dir. Ayrıca dönem içinde 58.700 ₺ pazarlama ve genel yönetim gideri, 19.800 ₺ finansman gideri gerçekleşmiştir. Brüt satış kârı 225.300 ₺ olarak hesaplanmıştır. Bu bilgilere göre dönem içi net alışlar tutarı kaç ₺\u0027dir?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve dönem içi net alışlar tutarının kaç ₺ olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, dönem içinde 685.000 ₺ brüt satış gerçekleştirmiştir; satıştan iadeler 12.500 ₺, satış iskontoları 8.700 ₺\u0027dir. Ticari mal dönem başı stoku 47.350 ₺, dönem sonu stoku 39.900 ₺\u0027dir. Ayrıca dönem içinde 65.200 ₺ pazarlama ve genel yönetim gideri, 21.400 ₺ finansman gideri gerçekleşmiştir. Brüt satış kârı 210.150 ₺ olarak hesaplanmıştır. Bu bilgilere göre dönem içi net alışlar tutarı kaç ₺\u0027dir?","kayitBaslik":"","id":"smmm-4k-a-maliyet-cokzor-r9/kp-01","verilenler":[{"deger":"685.000 ₺","anlam":"Net satışlar hesabının başlangıç tutarı, indirimler bundan düşülür.","ad":"Brüt satışlar"},{"deger":"12.500 ₺","anlam":"Net satışlar hesaplanırken brüt satışlardan düşülen bir satış indirimi kalemi.","ad":"Satıştan iadeler"},{"deger":"8.700 ₺","anlam":"Net satışlar hesaplanırken brüt satışlardan düşülen ikinci satış indirimi kalemi.","ad":"Satış iskontoları"},{"deger":"47.350 ₺","anlam":"Satılan malın maliyeti formülüne eklenen başlangıç stok tutarı.","ad":"Dönem başı ticari mal stoku"},{"deger":"39.900 ₺","anlam":"Satılan malın maliyeti formülünden çıkarılan dönem sonu stok tutarı.","ad":"Dönem sonu ticari mal stoku"},{"deger":"65.200 ₺","anlam":"Faaliyet giderleridir; satışların maliyeti tablosuna ve bu hesaplamaya dahil değildir.","ad":"Pazarlama ve genel yönetim gideri"},{"deger":"21.400 ₺","anlam":"Faaliyet kârından sonra düşülür; satılan malın maliyeti hesaplamasına dahil değildir.","ad":"Finansman gideri"},{"deger":"210.150 ₺","anlam":"Net satışlar ile satılan malın maliyeti arasındaki farktır; sorudaki bilinen sonuç değeridir.","ad":"Brüt satış kârı"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı - Gelir Tablosu Düzeni (600-623 hesap grupları)","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Brüt satış 685.000 (soruda verilen); Satıştan iadeler 12.500 (soruda verilen); Satış iskontoları 8.700 (soruda verilen); Dönem başı stok 47.350 (soruda verilen); Dönem sonu stok 39.900 (soruda verilen); Brüt satış kârı 210.150 (soruda verilen)","anlatim":"Soru bize şunları vermiş: brüt satış 685.000, iadeler 12.500, iskontolar 8.700. Ayrıca dönem başı stok 47.350, dönem sonu stok 39.900 ve brüt satış kârı 210.150 verilmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]]},{"formul":"Net Satışlar = Brüt Satış − İadeler − İskontolar = 685.000 (soruda verilen) − 12.500 (soruda verilen) − 8.700 (soruda verilen) = 663.800 ₺","anlatim":"Net satışlar nedir? Brüt satıştan iade ve iskontoları çıkarınca müşteriye kalan gerçek satış tutarı bulunur.","doldur":[[10,1]]},{"formul":"Satılan Malların Maliyeti = Net Satışlar − Brüt Satış Kârı = 663.800 (2. adımda bulduk) − 210.150 (soruda verilen) = 453.650 ₺","anlatim":"Satılan ticari malların maliyeti nedir? Net satışlardan brüt kârı çıkarırsak satılan malın maliyetine ulaşırız, çünkü brüt kâr bu ikisinin farkıdır.","doldur":[[11,1]]},{"formul":"Net Alışlar = Satılan Malların Maliyeti − Dönem Başı Stok + Dönem Sonu Stok = 453.650 (3. adımda bulduk) − 47.350 (soruda verilen) + 39.900 (soruda verilen) = 446.200 ₺","anlatim":"Şimdi biz hesaplıyoruz: satılan malın maliyeti formülünü tersten çözüp net alışları buluyoruz. Formül dönem başı stok artı net alışlar eksi dönem sonu stok şeklindeydi.","doldur":[[12,1]]},{"formul":"Dönem İçi Net Alışlar = 446.200 ₺ (4. adımda bulduk)","anlatim":"Sonuç: dönem içi net alışlar tutarı 446.200 ₺ çıktı. Bu, işletmenin dönem içinde ticari mal için yaptığı toplam alış tutarıdır.","doldur":[]},{"formul":"Ters durum: net alışlar verilseydi → Satılan Malların Maliyeti = Dönem Başı Stok + Net Alışlar − Dönem Sonu Stok","anlatim":"Ters durumda: soru net alışlar verip brüt kârı sorsaydı, aynı formülü ileri yönde kurup satılan maliyeti önce bulman gerekirdi.","doldur":[]},{"formul":"Yanlış yol: 453.650 − 39.900 + 47.350 = 461.100 (HATALI) → doğrusu 446.200 (4. adımda bulduk)","anlatim":"En sık hata: formülü ters çözerken dönem başı ve dönem sonu stokun yerini karıştırmak. Net alışlar = satılan malın maliyeti − dönem başı stok + dönem sonu stok olur.","doldur":[]}],"anahtar":[{"ornek":"satılan","kok":"satıla"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"alışlar","kok":"alışla"},{"ornek":"formülü","kok":"formül"},{"ornek":"satışlardan","kok":"satışl"},{"ornek":"hesaplanır","kok":"hesapl"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu kalemleri verilip brüt kâr veya net alış gibi bir ara değer istendiğinde test edilir. Nasıl ölçülür: net satışlar, satılan malın maliyeti ve brüt satış kârı arasındaki ters işlem kurulup kurulamadığına bakılır. Nasıl kaydedilir: sonuç yalnız istenen tek tutar olarak, ara işlemler gösterilmeden yazılır.","desen":"Sınav çoğunlukla brüt kârı ya da stok kalemlerinden birini vererek net alışları geriye dönük buldurur; tuzak faaliyet giderlerinin veya finansman giderinin bu hesaba karıştırılmasıdır (p.28). İkinci tuzak, dönem sonu stokun büyüklüğünün maliyeti nasıl etkilediğinin gözden kaçırılmasıdır. Bu soru brüt satış kârından geriye giderek satılan malın maliyeti ve net alışların bulunması noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Brüt satışlardan iade ve iskonto gibi indirimler düşüldükten sonra kalan tutar","ad":"Net satışlar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönem başı stok ile net alışlar toplamından dönem sonu stok çıkarılarak bulunan tutar","ad":"Satılan ticari mal maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönem başı ve dönem sonu stok ile satılan malın maliyeti arasındaki ilişkiden geriye dönük bulunan alış tutarı","ad":"Dönem içi net alışlar","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Net satışlardan satılan malın maliyeti düşüldükten sonra kalan kâr","ad":"Brüt satış kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Brüt satışlar, indirimler, dönem başı-sonu stok ve brüt satış kârı verilir; dönem içi net alışlar tutarı istenir.","panel_ornek":"İkinci el bir telefon satıcısı düşün: elinde 10 adet dönem başı telefon var, dönem içinde 40 adet daha alıyor, dönem sonunda elinde 6 adet kaldı; satılan telefon sayısı 10+40-6=44\u0027tür. Aynı mantıkla stok tutarları üzerinden satılan malın maliyeti bulunur, kargo ya da mağaza kirası gibi giderler bu hesaba girmez.","ornek":"İkinci el bir telefon satıcısı düşün: elinde 10 adet dönem başı telefon var, dönem içinde 40 adet daha alıyor, dönem sonunda elinde 6 adet kaldı; satılan telefon sayısı 10+40-6=44\u0027tür. Aynı mantıkla stok tutarları üzerinden satılan malın maliyeti bulunur, kargo ya da mağaza kirası gibi giderler bu hesaba girmez.","yontemler":"Önce net satışlar bulunur, brüt kârdan satılan malın maliyeti geriye dönük hesaplanır; sonra stok dengesinden net alışlara ulaşılır. Pazarlama, genel yönetim ve finansman giderleri bu hesaplamaya hiç dahil edilmez.","nedir":"Satışların maliyeti tablosu, net satışlardan brüt satış kârına giderken satılan malın maliyetinin nasıl bulunduğunu gösteren gelir tablosu basamağıdır. Sınav bu basamakta hangi kalemin hangi tutara girip girmediğini ölçer."},"olay":"Net satışlar 663.800 eksi Brüt kâr 210.150 eşittir Satılan maliyet 453.650; 453.650 eksi 47.350 artı 39.900 eşittir 446.200.","tuzak":{"C":{"ad":"İskonto Atlama Tuzağı","metin":"Satış iskontosunu net satışlar hesaplamasına dahil etmeyi unuttun. Doğrusu: Net satışlar, brüt satışlardan hem iadeler hem iskontolar düşülerek bulunur."},"E":{"ad":"Net Satış Atlama Tuzağı","metin":"Satış indirimlerini hiç düşmeyip brüt satışları net satış olarak kullandın. Doğrusu: Net satışlar brüt satışlardan satıştan iadeler ve iskontolar düşülerek hesaplanır."},"D":{"ad":"Stok Karıştırma Tuzağı","metin":"Dönem başı ve dönem sonu ticari mal stoklarını birbirinin yerine kullandın. Doğrusu: Dönem sonu stok maliyetten çıkarılır, dönem başı stok maliyete eklenir."},"A":{"ad":"Brüt Kârı Maliyet Sanma Tuzağı","metin":"Brüt satış kârını doğrudan satılan ticari malların maliyeti gibi kullanıp alışları buldun. Doğrusu: Önce net satışlardan brüt kâr çıkarılarak satılan maliyet bulunmalıdır."}},"celdiriciYol":{"C":"685.000 - 12.500 - 210.150 = 462.350; 462.350 - 47.350 + 39.900 = 454.900 (satış iskontosunu net satışlardan düşmeyi unuttun)","E":"685.000 - 210.150 = 474.850; 474.850 - 47.350 + 39.900 = 467.400 (satış indirimlerini net satışlar hesabına dahil etmedin, brüt satışları net satış saydın)","D":"453.650 - 39.900 + 47.350 = 461.100 (dönem başı ve dönem sonu stok tutarlarını birbirine karıştırdın)","A":"210.150 - 47.350 + 39.900 = 202.700 (brüt satış kârını satılan ticari malların maliyeti sandın)"},"hap":"Brüt satış kârı net satışlardan hesaplanır; satılan malın maliyeti formülü ters çözülerek alış tutarına ulaşılabilir.","teshis":{"C":{"gercek":"Net satışlar hesaplanırken 610 Satıştan İadeler ile 611 Satış İskontoları birlikte brüt satışlardan düşülür.","ayirt":"Brüt satışlardan hem iade hem iskonto düştüm mü?","paragraf":"THP 610-611","yanilgi":"Satış iskontosunun net satışları etkilemediğini, sadece iadelerin düşüldüğünü sanıyorsun."},"E":{"gercek":"Net satışlar eşittir brüt satışlar eksi satış indirimleri; bu adım atlanınca sonraki tüm katmanlar hatalı çıkar.","ayirt":"Brüt satışlardan indirimleri düştüm mü?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Brüt satışların doğrudan net satış olduğunu, indirimlerin ihmal edilebileceğini düşünüyorsun."},"A":{"gercek":"Brüt satış kârı net satışlardan satılan malın maliyeti çıkarılarak bulunur; ikisi ayrı katmandır.","ayirt":"Bu tutar net satışlardan mı çıkarıldı, yoksa doğrudan mı kullandım?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Brüt satış kârının satılan malın maliyetiyle aynı şey olduğunu düşünüyorsun."},"D":{"gercek":"Satılan malın maliyeti formülünde dönem başı stok eklenir, dönem sonu stok çıkarılır; sıra değişmez.","ayirt":"Hangi stok eklendi, hangisi çıkarıldı, yönlerini kontrol ettim mi?","paragraf":"MSUGT 153","yanilgi":"Dönem başı ve dönem sonu stokun formülde birbirinin yerine geçebileceğini düşünüyorsun."},"B":{"gercek":"Satılan malın maliyeti formülü (dönem başı stok + net alışlar − dönem sonu stok) tersine çözülerek net alışlar bulunabilir; net satışlardan brüt satış kârı çıkarılınca satılan malın maliyeti elde edilir.","ayirt":"Denklemi ileri değil ters yönde kurdum mu?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Bu şıkkı eleyen öğrenci, brüt satış kârından geriye doğru alış tutarına ulaşmanın mümkün olmadığını düşünür."}},"verilen":[[10,1],[11,1],[12,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]],"donem":11,"hesaplar":{}},{"capa":null,"kural":"Gizlilik ilkesi, açıklamayı gerektiren bir hak veya görev bulunmadıkça bilginin üçüncü kişilere açıklanmasını yasaklar; hak veya görev varsa açıklama serbesttir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SMMM 2026/2 ders 04 Soru 2","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Gizlilikle ilgili şıklarda önce \u0027açıklamayı gerektiren yasal bir hak veya görev var mı\u0027 sorusunu sor; yoksa amaç ne olursa olsun ihlal vardır.","konu":"etik ilkeler","tablo":{"satirlar":[["VERİLENLER","-","-"],["TÜRMOB Etik İlkeler Yönetmeliği EK\u0027inin madde numarası","1","-"],["HESAP","-","-"],["A) Meslek mensubu, bilgiyi açıklamasını gerektiren kanuni b…","EK m.1/1-ç","doğru ifade"],["B) Meslek mensubu, müşterisinin ticari sırlarını yeni bir i…","EK m.1/1-ç","YANLIŞ ifade"],["C) Meslek mensubu, edindiği mali bilgileri kendi kişisel ya…","EK m.1/1-ç","YANLIŞ ifade"],["D) Meslek mensubu, bir müşterisine ait bilgileri başka bir …","EK m.1/1-ç","YANLIŞ ifade"],["E) Meslek mensubu, mesleki ilişkisi sona erdikten sonra da …","EK m.1/1-ç","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Meslek mensubu, edindiği mali bilgileri kendi kişisel yatırım kararlarında kullanarak çıkar sağlamıştır.","E":"Meslek mensubu, mesleki ilişkisi sona erdikten sonra da eski müşterisine ait bilgileri sosyal ortamda anlatmaya devam etmiştir.","A":"Meslek mensubu, bilgiyi açıklamasını gerektiren kanuni bir hak veya görevi bulunduğu için, yetkili bir merciin talebi üzerine paylaşmıştır.","D":"Meslek mensubu, bir müşterisine ait bilgileri başka bir müşterisiyle yaptığı kıyaslama sohbetinde örnek olarak paylaşmıştır.","B":"Meslek mensubu, müşterisinin ticari sırlarını yeni bir iş teklifi alma umuduyla rakip firmaya aktarmıştır."},"kaynak":{"alinti":"teki gizlilik ilkesinin tanımından tamamen desteklenmektedir; ilke açıkça","liste":[],"hakem":"Sorunun doğru sıkkı (A), TÜRMOB Etik İlkeler Yönetmeliği EK m.1/1-ç\u0027teki gizlilik ilkesinin tanımından tamamen desteklenmektedir; ilke açıkça \u0027açıklamasını gerektirecek bir hak veya görevi olmadıkça\u0027 ifadesini içerir ve kanuni yetkili merciin talebi bu hak/göreve karşılık gelir."},"kayitlar":[],"sade":{"siklar":{"C":"Mali bilgilerin kendi yatırım kararlarında kullanılması görülse de, gizlilik ilkesi bilginin üçüncü kişi veya kendi çıkarı için kullanılmasını da yasaklar; bu ihlaldir.","E":"Mesleki ilişki bittiği düşünülse de, gizlilik yükümlülüğü ilişkinin sona ermesinden sonra da devam eder; bu açıklama ihlaldir.","D":"Meslek içi karşılaştırma amacı görülse de, amaç ne olursa olsun açıklamayı gerektiren bir hak veya görev yoksa başka müşteriyle paylaşım ihlaldir.","B":"Rakip firmaya bilgi aktarıldığı düşünülse de, kişisel ticari menfaat gizliliği kaldıran bir hak veya görev değildir; bu açıklama ihlaldir."},"dogru":"Meslek mensubu, kanuni bir hak veya görevi bulunduğu için yetkili merciine bilgi verirse gizlilik ilkesini ihlal etmez. Çünkü gizlilik yükümlülüğü, açıklamayı gerektiren hak veya görev varsa ortadan kalkar. Diğer durumlarda bilgi paylaşılması yasaktır.","sinav":"TÜRMOB Etik İlkeler Yönetmeliği Ek Birinci Maddesindeki gizlilik ilkesi uyarınca, açıklamayı gerektiren kanuni bir hak veya görev bulunması halinde bilginin üçüncü kişiye açıklanması gizlilik ilkesine aykırılık oluşturmaz.","kavramlar":[{"kaynak":"TÜRMOB Etik İlkeler Yön. EK bolum 1","tanim":"Meslek mensubunun mesleki ilişkileri sonucunda elde ettiği bilgileri, açıklamayı gerektiren bir hak veya görevi olmadıkça üçüncü kişilere açıklamaması ve bu bilgilerin hiç kimsenin çıkarları için kullanılmamasıdır.","ad":"Gizlilik"}]},"cikmis":{"pencereDonemler":["2026/2","2026/2","2026/2","2026/2","2026/2","2026/2","2026/2"],"kopru":8,"ornekler":[],"donemler":["2026/1","2025/2","2023/2","2020/1","2019/1","2015/1","2012/2","2008/1"]},"oyun":null,"tip":"teori","soru":"TÜRMOB Etik İlkeler Yönetmeliği EK\u0027inin 1 inci maddesinde düzenlenen gizlilik ilkesi uyarınca, meslek mensubunun mesleki ilişkisi sonucunda öğrendiği bilgiyi üçüncü kişiye açıklaması kural olarak yasaktır. Aşağıdaki durumlardan hangisinde yapılan açıklama gizlilik ilkesine aykırılık oluşturmaz?","kayitBaslik":"","id":"smmm-4k-a-ydenetim-kolay-r10/kp-02","verilenler":[{"deger":"1","anlam":"Gizlilik ilkesinin düzenlendiği yönetmelik ekinin hangi maddesinde yer aldığını gösterir.","ad":"TÜRMOB Etik İlkeler Yönetmeliği EK\u0027inin madde numarası"}],"dayanak":"TÜRMOB Etik İlkeler Yönetmeliği EK, GİRİŞ ve m.1/1-ç (Gizlilik)","dogru":"A","oyunBonus":null,"ders":"Muhasebe Denetimi","adimlar":[{"formul":"Olay: SMMM Kerem, İzmir\u0027de tekstil firmasının 2019 yılı denetiminde çalışırken, firmanın stok maliyetlerine ilişkin bilgileri öğreniyor. Vergi Denetim Kurulu, 3 Mart 2020\u0027de resmi bir yazıyla bu bilgileri talep ediyor.","anlatim":"Kerem\u0027in elinde müşterisine ait mali bilgiler var, üstelik kanunla yetkili bir kurum bu bilgiyi resmi olarak istiyor. Bu olayda beş farklı davranış olasılığını tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Gizlilik ilkesi, açıklamayı gerektiren bir hak veya görev yoksa bilginin üçüncü kişiye açıklanmasını ve kendi çıkarın için kullanılmasını yasaklıyor. Kerem\u0027in Vergi Denetim Kurulu\u0027na bilgi vermesi bu yasağın istisnasına giriyor mu, işte bunu göreceğiz.","anlatim":"Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"EK m.1/1-ç","karar":"doğru","anlatim":"Kerem\u0027in bunu açıklamasını gerektiren kanuni bir görevi var, çünkü yetkili merci resmi olarak istemiş. Madde açıkça bu durumu istisna sayıyor, ihlal yok.","formul":"Şık A: Vergi Denetim Kurulu resmi yazıyla bilgi istiyor, Kerem bu talebi karşılıyor. Bu ihlal midir?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"EK m.1/1-ç","karar":"yanlış","anlatim":"Burada hiçbir kanuni hak veya görev yok, sadece kişisel çıkar var. Bu davranış gizlilik ilkesini doğrudan çiğner.","formul":"Şık B: Kerem müşterisinin ticari sırlarını rakip firmaya, iş teklifi umuduyla aktarsa bu ihlal midir?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"EK m.1/1-ç","karar":"yanlış","anlatim":"Madde metni sadece açıklamayı değil, kendi çıkarın için kullanmayı da yasaklıyor. Yani üçüncü kişiye anlatmasa da bu bir ihlal.","formul":"Şık C: Kerem edindiği mali bilgiyi kendi yatırım kararında kullansa, üçüncü kişiye söylemese bile ihlal olur mu?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"EK m.1/1-ç","karar":"yanlış","anlatim":"Kıyaslama amacı bir hak veya görev doğurmuyor, sadece pratik bir kolaylık. Böyle bir zorunluluk yoksa paylaşım yine ihlaldir.","formul":"Şık D: Kerem başka bir müşterisiyle kıyaslama sohbetinde örnek olarak bu bilgiyi paylaşsa ihlal olur mu?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"EK m.1/1-ç","karar":"yanlış","anlatim":"Gizlilik ilkesi mesleki ilişki bitince ortadan kalkmıyor, süreklidir. İlişki sona ermiş olması açıklamayı meşru kılmıyor, bu da ihlaldir.","formul":"Şık E: Kerem denetim ilişkisi bittikten sonra da eski müşterisinin bilgilerini sosyal ortamda anlatmaya devam etse ihlal olur mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Sadece kanuni bir hak veya görev bilgiyi açıklamayı meşru kılar, gerisi çıkar veya kolaylık ise hep ihlaldir. Kendine hep şunu sor: bu açıklamayı yapmamı zorunlu kılan yasal bir merci veya görev var mı, yoksa ben mi kolaylık arıyorum?","doldur":[]}],"anahtar":[{"ornek":"açıklamayı","kok":"açıkla"},{"ornek":"gizlilik","kok":"gizlil"},{"ornek":"ilkesi","kok":"ilkesi"},{"ornek":"sadece","kok":"sadece"},{"ornek":"üçüncü","kok":"üçüncü"},{"ornek":"kanuni","kok":"kanuni"}],"konuGiris":{"harita":"Ne zaman test edilir: meslek mensubu üçüncü kişiye bilgi açıkladığında hangi gerekçenin geçerli olduğu sorulduğunda. Nasıl ölçülür: açıklamanın hak veya görev doğurup doğurmadığına bakılarak değerlendirilir. Nasıl kaydedilir: yönetmelik metnindeki istisna hali ile örnek olay eşleştirilerek çözülür.","desen":"Sorular genellikle şıklarda birden çok açıklama senaryosu verip yalnız birinin yasal zorunluluk taşıdığını buldurur (EK m.1/ç). Tuzak, \u0027müşteri izni olmadan da rutin bilgi paylaşımı meşrudur\u0027 gibi yanıltıcı seçeneklerdir. Bu soru EK madde 1 gizlilik ilkesi fıkrasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Mesleki ilişkide öğrenilen bilginin üçüncü kişiye açıklanmamasıdır","ad":"Gizlilik ilkesi","kim":"standart (BDS) sabitler"},{"kaynak":"soruda verilir","tanim":"Yasal zorunluluk gibi bilgiyi açıklamayı meşru kılan durumdur","ad":"Açıklamayı gerektiren hak veya görev","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"soruda verilir","tanim":"Mesleki ilişkinin tarafı olmayan, bilgiyi almaması gereken kişidir","ad":"Üçüncü kişi","kim":"standart (BDS) sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bilginin sahibi veya üçüncü kişi yararına kullanılması yasaktır","ad":"Kişisel/mesleki çıkar amaçlı kullanım","kim":"standart (BDS) sabitler"}],"sinavda":"Soru birkaç açıklama senaryosu verir ve gizlilik ilkesine aykırı olmayanı seçmeyi ister.","panel_ornek":"Bir kuaför, müşterisinin randevu bilgisini komşusuna anlatırsa bu bir sır ihlalidir; ama mahkeme onu tanık çağırıp sorarsa doğruyu söylemek zorundadır. Aradaki fark, bilgiyi açıklamanın kişisel merakla mı yoksa yasal bir zorunlulukla mı yapıldığıdır. 3 farklı durumdan sadece biri meşrudur.","ornek":"Bir kuaför, müşterisinin randevu bilgisini komşusuna anlatırsa bu bir sır ihlalidir; ama mahkeme onu tanık çağırıp sorarsa doğruyu söylemek zorundadır. Aradaki fark, bilgiyi açıklamanın kişisel merakla mı yoksa yasal bir zorunlulukla mı yapıldığıdır. 3 farklı durumdan sadece biri meşrudur.","yontemler":"Her seçenekte açıklamanın yasal bir hak/görev doğurup doğurmadığı kontrol edilir; doğuruyorsa ihlal yoktur.","nedir":"Bu konu meslek mensubunun mesleki ilişkide öğrendiği bilgiyi açıklama yasağını ve bu yasağın sınırlarını inceler. Sınav, gizlilik ilkesinin hangi durumda ihlal edilip hangi durumda hukuki/mesleki bir görev nedeniyle ihlal edilmediğini ölçer."},"olay":"yok.","tuzak":{"C":{"ad":"Kişisel Kullanım Tuzağı","metin":"öğrenci \u0027üçüncü kişiye açıklanmadı, kendisi kullandı\u0027 diye ilkeyi ihlal edilmemiş sanır. Doğrusu: madde, bilginin yalnız üçüncü kişiye açıklanmasını değil, üçüncü kişi VEYA kendi çıkarı için kullanılmasını da yasaklar; bu kullanım ihlaldir."},"E":{"ad":"Süre Sınırı Tuzağı","metin":"öğrenci \u0027ilişki bitti, artık gizlilik de biter\u0027 diye düşünür. Doğrusu: gizlilik yükümlülüğü mesleki ilişkinin sona ermesinden sonra da devam eder; ilişki bittikten sonraki açıklama da ihlaldir."},"D":{"ad":"Karşılaştırma Amacı Tuzağı","metin":"öğrenci \u0027meslek içi bir konuşma, kötü niyet yok\u0027 diye bunu istisna sanır. Doğrusu: amaç ne olursa olsun, açıklamayı gerektiren bir hak veya görev yoksa bilginin başka bir müşteriyle paylaşılması ihlaldir."},"B":{"ad":"Rekabet Çıkarı Tuzağı","metin":"öğrenci burada \u0027bilgi paylaşılmış ama iş teklifi almak için\u0027 diye düşünüp bunu meşru bir gerekçe sanır. Doğrusu: kişisel/ticari menfaat, gizliliği kaldıran bir hak veya görev değildir; bu açıklama ihlaldir."}},"celdiriciYol":{"C":"Öğrenci \u0027üçüncü kişiye söylenmedi\u0027 diye maddenin yalnız açıklamayı yasakladığını sanır; oysa madde kullanmayı da kapsar (kapsam eksik okuma).","E":"Öğrenci ilişkinin bitişini gizliliğin bitişiyle eşitler; oysa yükümlülük süreklidir (süre sınırı yanılgısı).","D":"Öğrenci kıyaslama amacını meşru sayar; oysa amaç değil, hak/görev varlığı ölçüttür (ölçüt karışıklığı).","B":"Öğrenci \u0027iş teklifi umudu\u0027 gerekçesini hak/görev sanır; oysa kişisel çıkar hak veya görev yerine geçmez (çıkar-hak karışıklığı)."},"hap":"Gizlilik ilkesi, açıklamayı gerektiren bir hak veya görev bulunmadıkça hem üçüncü kişiye açıklamayı hem de kendi çıkarı için kullanmayı yasaklar ve mesleki ilişki sona erse bile devam eder.","teshis":{"C":{"gercek":"Madde metni açıkça \u0027kendisinin veya üçüncü kişilerin çıkarları için kullanılmaması\u0
