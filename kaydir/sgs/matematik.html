[{"kaynak":"TEORI","tanim":"f(x) = ax² + bx + c biçiminde verilen fonksiyonda, bilinen f(değer) bilgileri yerine yazılarak a, b, c katsayıları ardışık denklemlerle bulunur.","ad":"İkinci dereceden fonksiyon katsayı bulma"},{"kaynak":"TEORI","tanim":"Bilinmeyen sayısı kadar denklem kurulur ve taraf tarafa toplanma ya da yerine koyma yöntemiyle çözülür.","ad":"Denklem sistemi çözümü"},{"kaynak":"TEORI","tanim":"Eksi katsayı yerine yazılırken parantez kullanılmadığında veya iki verili denklem birbirinin yerine konduğunda ortaya çıkan hesap kaybıdır.","ad":"İşaret hatası"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"tablo":{"basliklar":["Kalem","Değer"],"satirlar":[["C (g(0)\u0027dan)","-5"],["A+b (g(1)-c)","-1"],["A-b (g(-1)-c)","5"],["A (toplamdan)","2"],["B (farktan)","-3"],["G(x)=2x²-3x-5","-"],["N²-3n-20=0 kökleri","N=4 veya n=-2,5"],["Sonuç (pozitif n)","4"]]},"tur":"tablo","soru":"g(x) = ax² + bx + c fonksiyonu için g(0) = -5, g(1) = -6 ve g(-1) = 0 olduğu bilinmektedir. g(n) = 15 eşitliğini sağlayan n\u0027nin pozitif değeri kaçtır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve n\u0027nin pozitif değerinin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f(x) = ax² + bx + c fonksiyonu için f(0) = -3, f(1) = -4 ve f(-1) = 0 olduğu bilinmektedir. f(m) = 5 eşitliğini sağlayan m\u0027nin pozitif değeri kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-38","verilenler":[{"deger":"-3","anlam":"x=0 için fonksiyon değeri; sabit terim c\u0027yi doğrudan verir.","ad":"f(0)"},{"deger":"-4","anlam":"x=1 için fonksiyon değeri; a+b+c toplamını verir.","ad":"f(1)"},{"deger":"0","anlam":"x=-1 için fonksiyon değeri; a-b+c toplamını verir.","ad":"f(-1)"},{"deger":"5","anlam":"Fonksiyonun aldığı sonuç değeri; m bilinmeyen girdidir, ters soruyla bulunacaktır.","ad":"f(m)"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Fonksiyon Kavramı, katsayı bulma ve denklem çözümü bölümü","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: f(0)=-3 (soruda verilen); f(1)=-4 (soruda verilen); f(-1)=0 (soruda verilen); f(m)=5 (soruda verilen); istenen: m\u0027nin pozitif değeri","anlatim":"Soru bize üç fonksiyon değerini ve bulmamız gereken eşitliği veriyor. f(0)=-3, f(1)=-4, f(-1)=0 katsayıları verir; f(m)=5 ise sorulan denklemdir.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"C = f(0) = -3 (soruda verilen)","anlatim":"f(0) sadece sabit terimi verir çünkü x=0 iken x\u0027li terimler sıfırlanır. Bu yüzden c değeri direkt f(0)\u0027a eşittir.","doldur":[[6,1]]},{"formul":"A + b = f(1) − c = -4 (soruda verilen) − -3 (2. adımda bulduk) = -1","anlatim":"f(1)\u0027i açarsak a+b+c çıkar, c\u0027yi bildiğimiz için a+b\u0027yi yalnız bırakabiliriz. Bu bize ikinci denklemi verir.","doldur":[[7,1]]},{"formul":"A - b = f(-1) − c = 0 (soruda verilen) − -3 (2. adımda bulduk) = 3","anlatim":"f(-1)\u0027i açarsak a-b+c çıkar, yine c\u0027yi çıkarınca a-b kalır. İkinci denklemle birlikte a ve b\u0027yi çözeceğiz.","doldur":[[8,1]]},{"formul":"A = ( (a+b) + (a-b) ) / 2 = ( -1 (3. adımda bulduk) + 3 (4. adımda bulduk) ) / 2 = 1","anlatim":"İki denklemi taraf tarafa toplarsak b terimleri yok olur, sadece a kalır. Bu klasik denklem çözme yöntemidir.","doldur":[[9,1]]},{"formul":"B = (a+b) − a = -1 (3. adımda bulduk) − 1 (5. adımda bulduk) = -2","anlatim":"a\u0027yı bulduğumuza göre a+b denkleminden b\u0027yi çözebiliriz. Yerine koyup çıkarma yapıyoruz.","doldur":[[10,1]]},{"formul":"Birinci terim = a × m² = 1 (5. adımda bulduk) × m² = m²","anlatim":"f(m) ifadesini üç ayrı çarpım teriminin toplamı olarak kuracağız, her terimi tek tek hesaplayacağız. Önce a×m² terimini yazıyoruz.","doldur":[]},{"formul":"İkinci terim = b × m = -2 (6. adımda bulduk) × m = -2m","anlatim":"İkinci terim b×m çarpımıdır, b\u0027yi 6. adımda bulmuştuk. Bunu da ayrı yazıyoruz ki karışmasın.","doldur":[]},{"formul":"Üçüncü terim = c = -3 (2. adımda bulduk)","anlatim":"Üçüncü terim sabit c\u0027dir, çarpım içermez ama toplamda yerini alır. c\u0027yi 2. adımda bulmuştuk.","doldur":[]},{"formul":"F(x) = birinci terim + ikinci terim + üçüncü terim = m² + -2m (7. adımda bulduk) + -3 (8. adımda bulduk) = x² - 2x - 3","anlatim":"Şimdi üç terimi topluyoruz, f(m)\u0027in açık halini elde ediyoruz. Bu bize x² - 2x - 3 fonksiyonunu verir.","doldur":[[11,1]]},{"formul":"M² - 2m - 8 = f(m) - 5 = ( m² - 2m - 3 ) (9. adımda bulduk) - 5 (soruda verilen) = 0 → (m-4)(m+2) = 0 → m = 4 veya m = -2","anlatim":"f(m)=5 koşulunu bu fonksiyona uyguluyoruz, sağa geçirip ikinci dereceden denklem kuruyoruz. Sonra çarpanlarına ayırarak kökleri buluyoruz.","doldur":[[12,1]]},{"formul":"Sonuç: büyük olan pozitif kök: 4 ile -2 → m = 4 (10. adımda bulduk)","anlatim":"Denklemin iki kökü var ama soru pozitif değeri istiyor. -2 negatif olduğu için elenir, 4 kalır.","doldur":[[13,1]]},{"formul":"Ters durum: soru negatif değeri isteseydi → m = -2 (10. adımda bulduk)","anlatim":"Ters durumda soru negatif değeri isteseydi cevap -2 olurdu. Aynı denklemin iki kökü farklı soru tiplerine cevap verir.","doldur":[]},{"formul":"Yanlış yol: m² - 2m - 8 = 0 → m = -2 (HATALI) → doğrusu m = 4 (11. adımda bulduk)","anlatim":"En sık hata, sadece m²-2m-8=0\u0027ı kurup köklerden birini rastgele seçmektir. Doğrusu her iki kökü bulup pozitif olanı seçmektir.","doldur":[]}],"anahtar":[{"ornek":"denklemler","kok":"denkle"},{"ornek":"terimi","kok":"terimi"},{"ornek":"fonksiyon","kok":"fonksi"},{"ornek":"değerini","kok":"değeri"},{"ornek":"çarpım","kok":"çarpım"},{"ornek":"negatif","kok":"negati"}],"konuGiris":{"harita":"Ne zaman test edilir: f(x)=ax²+bx+c gibi katsayısı bilinmeyen bir fonksiyon için birkaç f değeri verildiğinde. Nasıl ölçülür: verilen değerler yerine yazılarak kurulan denklem sisteminin doğru çözülüp çözülmediğine bakılır. Nasıl kaydedilir: bulunan a, b, c katsayıları fonksiyona yazılıp istenen f(m) hesaplanarak son cevap elde edilir.","desen":"Sınav genelde üç f değeri vererek üç bilinmeyenli sistem kurdurur ve sonra farklı bir noktadaki değeri sorar. Tuzak, işaret hatalarında ve f(-1) gibi negatif değerlerin yanlış yerine yazılmasında ortaya çıkar. Bu soru, verilen değerlerden denklem kurma ve katsayı bulma noktasından geliyor (p.28).","terimler":[{"kaynak":"sen hesaplarsın","tanim":"fonksiyonu tanımlayan sabit sayılar, denklem sisteminden bulunur","ad":"katsayı (a, b, c)","kim":"kuraldan bilinir"},{"kaynak":"soruda verilir","tanim":"fonksiyonun belirli bir x için aldığı değeri gösteren bilgi","ad":"f(x₀)=y₀","kim":"kuraldan bilinir"},{"kaynak":"sen hesaplarsın","tanim":"bilinmeyen katsayı sayısı kadar kurulan eşitlikler bütünü","ad":"denklem sistemi","kim":"kuraldan bilinir"},{"kaynak":"sen hesaplarsın","tanim":"bulunan katsayıların verilen değerlerden biriyle yeniden kontrol edilmesi","ad":"sağlama","kim":"kuraldan bilinir"}],"sinavda":"Üç f değeri verilir, katsayılar bulunup istenen f(m) değerinin sağlandığı m sayısı istenir.","panel_ornek":"Bir minibüsün ilk 2 durakta aldığı yolcu sayısı ile son durakta indirdiği yolcu sayısı arasında sabit bir kural var; sürücü bu kuralı 2-3 örnek yolculuktan çıkarıyor. Sen de fonksiyonun kuralını, verilen birkaç f değerinden aynı mantıkla buluyorsun. Kural bulununca istenen herhangi bir durak için yolcu sayısı hesaplanabiliyor.","ornek":"Bir minibüsün ilk 2 durakta aldığı yolcu sayısı ile son durakta indirdiği yolcu sayısı arasında sabit bir kural var; sürücü bu kuralı 2-3 örnek yolculuktan çıkarıyor. Sen de fonksiyonun kuralını, verilen birkaç f değerinden aynı mantıkla buluyorsun. Kural bulununca istenen herhangi bir durak için yolcu sayısı hesaplanabiliyor.","yontemler":"Her f(x₀)=y₀ bilgisi yerine yazılıp üç denklem kurulur, taraf tarafa çıkarma/toplama ile katsayılar bulunur. Negatif x değerleri parantezle yazılmalı, işaret hatası en sık hata kaynağıdır.","nedir":"Bu konu, katsayıları bilinmeyen bir fonksiyonda verilen değerlerden denklem kurup katsayıları bulmayı sağlar. Sınav, verilen bilgileri doğru yerine koyup denklem çözebilme becerini ölçer."},"olay":"c=-3; a+b=-1; a-b=3; toplayınca 2a=2, a=1, b=-2; f(x)=x²-2x-3; f(m)=5 → m²-2m-8=0 → (m-4)(m+2)=0 → m=4 veya m=-2.","tuzak":{"C":{"ad":"Denklemi Çözmeden Sonuç Sanma Tuzağı","metin":"f(m)=5 ifadesindeki 5 sayısını denklem kurmadan doğrudan m\u0027nin değeri sanırsan m=5 yazarsın. Doğrusu: 5, fonksiyonun çıktısıdır; m için m²-2m-8=0 denklemi çözülmelidir."},"E":{"ad":"Ters Okuma Tuzağı","metin":"f(m)=5 ifadesini f(5)=m gibi ters okuyup 5\u0027i fonksiyona girdi sanarsan f(5)=25-10-3=12 bulursun. Doğrusu: burada m bilinmeyen girdi, 5 ise bilinen sonuçtur; sıra ters çevrilemez."},"D":{"ad":"Kök Formülü Payda Tuzağı","metin":"m²-2m-8=0 denkleminde diskriminant 36 bulunduktan sonra payda olarak 2a yerine yalnız a=1 kullanırsan m=(2+6)/1=8 çıkar. Doğrusu: ikinci dereceden denklemde kök formülünün paydası daima 2a\u0027dır, m=(2+6)/2=4\u0027tür."},"A":{"ad":"Ters Veri Tuzağı","metin":"f(1) ve f(-1) denklemlerini birbirinin yerine kurarsan a=1, b=2, c=-3 çıkar; f(m)=5 denklemi m²+2m-8=0 olur ve pozitif kök 2 bulunur. Doğrusu: f(1)=a+b+c, f(-1)=a-b+c ayrı ayrı ve karıştırılmadan kurulmalıdır."}},"celdiriciYol":{"C":"m²-2m-8=0 denklemini kurmadan f(m)=5\u0027teki 5 sayısını doğrudan m\u0027ye eşitleme = 5 (denklemi çözmeden sonucu girdi sanma hatası)","E":"f(5) = 25 - 10 - 3 = 12 (f(m)=5 ifadesini f(5)=m gibi ters okuma hatası)","D":"m=(2+6)/1 = 8 (ikinci dereceden kök formülünde paydayı 2a yerine a alma hatası)","A":"f(1) ve f(-1) denklemlerini ters kurarsak a=1,b=2,c=-3; m²+2m-8=0 → (m+4)(m-2)=0 → m=2 (f(1)/f(-1) verilerini ters işaretle kurma hatası)"},"hap":"f(x0)=y0 verildiğinde x0 girdi, y0 çıktıdır; ters soruda bu sıra karıştırılmaz ve negatif kök soru pozitif istiyorsa elenir.","teshis":{"C":{"gercek":"f(m)=5, m fonksiyona verildiğinde sonucun 5 olması demektir; m\u0027nin kendisi değildir, m²-2m-8=0 denklemi çözülmelidir.","ayirt":"5 sayısı fonksiyonun girdisi mi, çıktısı mı?","paragraf":"FORMÜL VE ÇÖZÜM ADIMLARI (3)","yanilgi":"f(m)=5 denklemini çözmeden 5 sayısını doğrudan m\u0027nin değeri sanıyorsun."},"E":{"gercek":"f(m)=5\u0027te m bilinmeyen girdi, 5 bilinen çıktıdır; ters soruda önce fonksiyon belirlenir, sonra istenen denklem kurulur, sıra ters çevrilemez.","ayirt":"Hangi taraf bilinmeyen (girdi), hangi taraf sonuç (çıktı)?","paragraf":"SINAV TUZAĞI (1)","yanilgi":"f(m)=5 ifadesini f(5)=m gibi ters okuyup fonksiyonun girdisinin 5 olduğunu sanıyorsun."},"A":{"gercek":"f(x0)=y0 eşitliğinde x0 ve y0 birbirine karıştırılmadan yerine yazılır; f(1)=a+b+c ile f(-1)=a-b+c farklı denklemlerdir.","ayirt":"Her f değerini hangi x\u0027e ait olduğunu tekrar kontrol ettim mi?","paragraf":"TANIM VE KURAL (1)-(2)","yanilgi":"f(1) ve f(-1) verilerini birbirinin yerine kullanıp denklemleri ters kurduğunu fark etmiyorsun."},"D":{"gercek":"Kök formülünde payda daima 2a\u0027dır; a katsayısı tek başına payda olarak kullanılamaz.","ayirt":"Kök formülünün paydasını 2 ile çarpmayı unuttum mu?","paragraf":"FORMÜL VE ÇÖZÜM ADIMLARI (2)","yanilgi":"İkinci dereceden denklemin kökünü bulurken paydaya 2a yerine yalnız a yazıyorsun."},"B":{"gercek":"Üç veriden a, b, c bulunur; f(m)=5 denklemi kurulup iki kök elde edilir, soru pozitif değeri istediği için negatif kök elenir; m=4.","ayirt":"Soru pozitif değeri mi istiyor, yoksa ikisini de mi kabul ediyor?","paragraf":"FORMÜL VE ÇÖZÜM ADIMLARI (1)-(3)","yanilgi":"İkinci dereceden denklemin iki kökünün de her zaman geçerli sonuç olduğunu, negatif kökü de cevap sayabileceğini düşünüyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 10"},"kural":"f(x₀)=y₀ bilgileri denklemde yerine yazılır, iki bilinmeyen için iki denklem çözülür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 10","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Negatif x değerlerini denkleme yazarken mutlaka parantez kullan, işaret hatası en sık puan kaybettiren noktadır.","konu":"fonksiyon katsayı bulma","tablo":{"satirlar":[["VERİLENLER","-","-"],["f(2) değeri","7","-"],["f(-1) değeri","1","-"],["HESAP","-","-"],["1. Denklem","2a+b=7","-"],["2. Denklem","-a+b=1","-"],["Çıkarma","2a+b-(-a+b)=7-1","3a=6"],["A değeri","A=6/3","A=2"],["B değeri","B=1-(-1)(2)","B=3"],["F(4)","2(4)+3","11"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"14","E":"20","A":"5","D":"19","B":"11"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Katsayıları doğru bulsün (a=2, b=3) ama fonksiyona yazarken yerleri değiştirip f(x)=3x+2 sanırsa f(4)=14 çıkar; a ve b\u0027nin hangi role sahip olduğu karıştırılır.","E":"f(1)=5 (katsayılar toplamı) doğru olsa da bunu f(4) bulmak için 4 ile çarpar ve 4·5=20 der; doğrusal fonksiyon oran tutmadığı için bu kısayol yanlış sonuç verir.","D":"f(−1)=1 denklemini yazarken eksi işaretine dikkat etmeyip x=1 alırsa a+b=1 denklemi kurar, böylece a=6 ve b=−5 gibi yanlış katsayılar bulup f(4)=19 hesaplar.","A":"Aynı işlemler yapılıp doğru katsayılar a=2, b=3 bulunur ama f(4) hesaplanmaz; cevap f(2)=7 ya da f(−1)=1 gibi verilen değerlerle karıştırılır."},"dogru":"Verilen iki bilgiye fonksiyonu yazıp iki denklem kurarsın: 2a+b=7 ve −a+b=1. Taraf tarafa çıkarırsan a=2, b=3 bulursun. Sonra f(4)=2·4+3=11 hesaplarsın.","sinav":"Doğrusal fonksiyonda katsayıları bilinmeyen bir denkleme iki farklı nokta bilgisi yazılıp denklem sistemi çözülerek istenen noktadaki değer hesaplanır.","kavramlar":[{"kaynak":"TEORI","tanim":"f(x) = ax + b biçiminde yazılan, a ve b sabit sayılar olmak üzere birinci dereceden polinom fonksiyonudur.","ad":"Doğrusal fonksiyon"},{"kaynak":"TEORI","tanim":"Fonksiyonda bilinmeyen katsayılar, verilen nokta bilgileri (f(x₀) = y₀) fonksiyona yazılarak kurulan denklem sisteminin çözülmesiyle bulunur.","ad":"Fonksiyonda katsayı bulma"},{"kaynak":"TEORI","tanim":"Negatif sayılar denkleme yazılırken parantez kullanılmadan veya eksi işareti atlanarak yapılan hata; örneğin f(−1) yazılırken x=1 yerine yazılması.","ad":"İşaret hatası"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,2],[2,2],[3,2],[4,2],[5,1],[5,2],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["1. Denklem","3c+d=11","-"],["2. Denklem","-2c+d=1","-"],["Çıkarma","3c+d-(-2c+d)=11-1","5c=10"],["C değeri","C=10/5","C=2"],["D değeri","D=1-(-2)(2)","D=5"],["G(5)","2(5)+5","15"]]},"tur":"tablo","soru":"g(x) = cx + d fonksiyonunda g(3) = 11 ve g(-2) = 1 olduğuna göre g(5) kaçtır?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve g(5)\u0027in kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f(x) = ax + b fonksiyonunda f(2) = 7 ve f(−1) = 1 olduğuna göre f(4) kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-38","verilenler":[{"deger":"7","anlam":"x=2 için fonksiyon sonucu, ilk denklemi kurmakta kullanılır: 2a+b=7","ad":"f(2) değeri"},{"deger":"1","anlam":"x=-1 için fonksiyon sonucu, ikinci denklemi kurmakta kullanılır: -a+b=1","ad":"f(-1) değeri"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - fonksiyon katsayı bulma kuralı","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: f(2) = 7 (soruda verilen); f(-1) = 1 (soruda verilen)","anlatim":"Soru bize f(2)=7 ve f(-1)=1 değerlerini veriyor. Bunları a ve b\u0027yi bulmak için kullanacağız.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"1. Denklem = 2a + b → 2a + b = 7 (soruda verilen); 2. Denklem = -a + b → -a + b = 1 (soruda verilen)","anlatim":"f(x)=ax+b içine x=2 ve x=-1 yazıyoruz, iki denklem çıkıyor. İki bilinmeyen için iki denklem gerekir.","doldur":[[4,1],[5,1]]},{"formul":"2a + b - (-a + b) = 7 - 1 (soruda verilen) = 3a = 6","anlatim":"İki denklemi taraf tarafa çıkarınca b yok olur, sadece a kalır. Bu yüzden çıkarma işlemi yapıyoruz.","doldur":[[6,1],[6,2]]},{"formul":"a = 6 (3. adımda bulduk) / 3 = 2","anlatim":"3a=6 denkleminden a\u0027yı buluyoruz. Bölme işlemiyle a değeri çıkar.","doldur":[[7,1],[7,2],[8,1],[8,2]]},{"formul":"b = 1 - (-1) × 2 (4. adımda bulduk) = 3","anlatim":"a=2 değerini 2. denklemde yerine koyup b\u0027yi buluyoruz. Denklem tek bilinmeyene indi.","doldur":[]},{"formul":"f(4) = a × 4 + b = 2 (4. adımda bulduk) × 4 + 3 (5. adımda bulduk) = 11","anlatim":"a ve b bulundu, şimdi f(4)\u0027ü hesaplıyoruz. Fonksiyona x=4 yazıp sonucu buluyoruz.","doldur":[]},{"formul":"Yanlış yol: 2a+b=7 denklemini tek başına çözmek = a veya b belirsiz (HATALI) → doğrusu a=2, b=3 (4. ve 5. adımda bulduk)","anlatim":"Yanlış yol tek denklemle a ve b\u0027yi ayrı ayrı bulmaya çalışmaktır. İki denklem birlikte çözülmeden a veya b bulunamaz.","doldur":[]}],"anahtar":[{"ornek":"denkleme","kok":"denkle"},{"ornek":"bilinmeyen","kok":"bilinm"},{"ornek":"buluyoruz","kok":"buluyo"},{"ornek":"değeri","kok":"değeri"},{"ornek":"çözülür","kok":"çözülü"},{"ornek":"işlemi","kok":"işlemi"}],"konuGiris":{"harita":"Kaç bilinmeyen varsa o kadar f(değer) bilgisi verilerek test edilir. Denklemler yerine koyma veya taraf tarafa işlemle çözülerek katsayılar ölçülür. Sonuç, bulunan katsayılarla istenen f değeri yeniden hesaplanıp sağlama yapılarak kaydedilir.","desen":"Çıkmış arşivde bu konu 1 dönemde soruldu ve doğrudan iki f(değer) bilgisiyle iki bilinmeyen sorulmuştur. Tuzak, eksi değerler yerine yazılırken işaret hatası yapılmasıdır. Bu soru işaret hatası ve yerine koyma tuzağı noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"fonksiyondaki bilinmeyen sabit çarpan","ad":"a (eğim/katsayı)","kim":"soruda tanımlı kalıptan gelir, sen hesaplarsın"},{"kaynak":"sen hesaplarsın","tanim":"x\u0027ten bağımsız, fonksiyonun sabit kısmı","ad":"b (sabit terim)","kim":"kuraldan bilinir, sen hesaplarsın"},{"kaynak":"soruda verilir","tanim":"x yerine x₀ konunca elde edilen fonksiyon değeri","ad":"f(x₀)","kim":"soruda verilir"},{"kaynak":"sen hesaplarsın","tanim":"bilinmeyen sayısı kadar kurulan eşitliklerin bütünü","ad":"denklem sistemi","kim":"kuraldan bilinir"}],"sinavda":"Fonksiyonun kuralı ve iki farklı f(değer) sonucu verilir, istenen üçüncü f(değer) sorulur.","panel_ornek":"Bir kargo firması sabit ücrete kilo başına ek ücret ekliyor: 2 kilo 9 lira, 5 kilo 18 lira tutuyor. Buradan kilo başı ücreti ve sabit ücreti bulup 3 kilonun fiyatını hesaplayabilirsin. İki bilgi, iki bilinmeyeni verir.","ornek":"Bir kargo firması sabit ücrete kilo başına ek ücret ekliyor: 2 kilo 9 lira, 5 kilo 18 lira tutuyor. Buradan kilo başı ücreti ve sabit ücreti bulup 3 kilonun fiyatını hesaplayabilirsin. İki bilgi, iki bilinmeyeni verir.","yontemler":"Yerine koyma yöntemi ya da denklemleri taraf tarafa çıkarma/toplama yöntemi kullanılır; en kritik kural eksi sayıları parantez içinde yerine yazmaktır.","nedir":"Fonksiyon içindeki bilinmeyen katsayıları, verilen f(değer) bilgilerinden denklem kurarak bulma yöntemidir. Sınav, denklem kurma ve doğru yerine koyma becerisini ölçer."},"olay":"2a+b=7 ve −a+b=1 denklemleri çıkarılırsa a=2, b=3 bulunur; f(4)=2(4)+3=11.","tuzak":{"C":{"ad":"Katsayı Yer Değiştirme Tuzağı","metin":"a ve b\u0027yi doğru bulduktan sonra fonksiyona yazarken yerlerini karıştırıp f(x)=3x+2 sanır, f(4)=3(4)+2=14 çıkarırsın. Doğrusu: fonksiyon f(x)=2x+3\u0027tür, a katsayı b sabit terimdir, karıştırılmaz."},"E":{"ad":"Katsayılar Toplamı Kısayolu Tuzağı","metin":"f(1)=a+b katsayılar toplamını verir kısayolunu f(4) sorusuna uygulayıp 4×f(1)=4×5=20 dersin; doğrusal fonksiyon orantılı değildir. Doğrusu: f(4), fonksiyona x=4 yazılarak hesaplanır, f(1) ile çarpım yapılmaz."},"D":{"ad":"İşaret Hatası Tuzağı","metin":"f(−1)=1 bilgisini yerine yazarken x=−1 yerine x=1 kullanıp a+b=1 denklemini kurarsan a=6, b=−5 çıkar ve f(4)=19 bulursun. Doğrusu: x=−1 için −a+b=1 yazılmalıdır, işaret atlanmaz."},"A":{"ad":"Ne soruluyor","metin":"f(2) ve f(−1) bilgilerinden a ile b bulunup f(4) hesaplanması isteniyor. Kural: f(x₀)=y₀ bilgileri denklemde yerine yazılır, iki bilinmeyen için iki denklem çözülür. Hesap: 2a+b=7 ve −a+b=1 denklemleri çıkarılırsa a=2, b=3 bulunur; f(4)=2(4)+3=11. Doğrusu: f(4)=11\u0027dir."}},"celdiriciYol":{"C":"3(4)+2 = 14 (a ile b\u0027yi fonksiyona ters yerleştirme)","E":"4 x 5 = 20 (doğrusal fonksiyonu orantılı sanma)","D":"2(6)+(-5) = 19 (f(-1) kurarken işaret hatası yapma)","A":"a+b = 2+3 = 5 (f(1) kısayol sonucunu f(4) sanma)"},"hap":"f(x)=ax+b tipi sorularda verilen f(x0)=y0 bilgileri denkleme yazılıp iki bilinmeyen iki denklemle çözülür, sonra istenen x değeri fonksiyona ayrıca yazılır.","teshis":{"C":{"gercek":"f(x)=ax+b ifadesinde a x\u0027in katsayısı, b sabit terimdir; bulunan değerler bu sıraya göre yazılır.","ayirt":"a\u0027yı x\u0027in yanına, b\u0027yi sabit terime doğru yerleştirdim mi?","paragraf":"Fonksiyon katsayı bulma - formüle yerleştirme","yanilgi":"a ile b\u0027yi doğru bulduktan sonra fonksiyona yazarken hangisinin katsayı hangisinin sabit terim olduğunu karıştırıyorsun."},"E":{"gercek":"f(x)=ax+b fonksiyonu orantılı değildir, her x değeri fonksiyona ayrı ayrı yazılarak hesaplanır.","ayirt":"f(4) değerini fonksiyona x=4 yazarak mı, yoksa f(1)\u0027i çarparak mı buldum?","paragraf":"Fonksiyon katsayı bulma - doğrusal fonksiyon uyarısı","yanilgi":"Doğrusal fonksiyonu orantılı sanıp f(4)\u0027ü f(1)\u0027in 4 katı olarak hesaplıyorsun."},"A":{"gercek":"f(1) yalnız katsayılar toplamını verir, sorulan başka bir x değeri ise fonksiyona ayrıca yazılmalıdır.","ayirt":"Bulduğum sayı, sorunun istediği x değeri için mi hesaplandı?","paragraf":"Fonksiyon katsayı bulma - kısayol kuralı","yanilgi":"f(1)=a+b kısayolunun sonucunu, sorulan f(4) değeriyle karıştırıp doğrudan cevap sanıyorsun."},"D":{"gercek":"f(−1)=1 bilgisinde x=−1 yazılırken −a+b=1 denklemi kurulmalıdır, işaret parantezle korunur.","ayirt":"Negatif x değerini denkleme parantez içinde mi yazdım?","paragraf":"Fonksiyon katsayı bulma - işaret hatası uyarısı","yanilgi":"Negatif x değerini denkleme yazarken işareti kaybedip pozitif gibi işlem yapıyorsun."},"B":{"gercek":"2a+b=7 ve −a+b=1 denklemleri çıkarılınca a=2, b=3 bulunur; f(4)=11 doğrudur.","ayirt":"Bulduğum a,b değerlerini iki verilen denklemde de sağlama yaptım mı?","paragraf":"Fonksiyon katsayı bulma - çözüm ve sağlama","yanilgi":"Denklemleri kurarken işaret ve sıralamayı doğru uyguladığından şüphe edip bu şıkkı elersin."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 15"},"kural":"log_a x + log_a y = log_a(xy) ile birleştirilip log_a(ifade)=n eşitliği aⁿ=ifade biçimine çevrilir; bulunan kökler tanım şartında (içler pozitif) denenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 15","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Logaritma denkleminde önce tanım şartını yaz, kökleri bulduktan sonra ilk iş bu şartı kontrol etmektir.","konu":"logaritma işlemleri","tablo":{"satirlar":[["VERİLENLER","-","-"],["taban","2","-"],["birinci içler terimi","x-1","-"],["ikinci içler terimi","x+3","-"],["eşitliğin sağı","5","-"],["HESAP","-","-"],["Çarpım kuralı","Log₂[(x-1)(x+3)]=5","Birleşik logaritma"],["Üstel çevirme","(x-1)(x+3)=2^5","32"],["Denklem","X²+2x-3=32","X²+2x-35=0"],["Çarpanlara ayırma","(x+7)(x-5)=0","X=5 veya x=-7"],["Tanım kontrolü","X=-7 için x-1=-8\u003c0, atılır","X=5"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"2","E":"15","A":"-7","D":"5","B":"-2"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Logaritmanın eşittir işaretinin sağındaki 5\u0027i doğrudan içle eşitleyip (x−1)(x+3)=5 sanmak yanlıştır; 5 önce 2⁵=32\u0027ye çevrilmelidir.","E":"log₂(x−1)+log₂(x+3) toplamını içlerin toplamının logaritması sanıp (x−1)+(x+3)=32 çözmek hatalıdır; logaritmaların toplamı içlerin çarpımının logaritmasına eşittir.","A":"Denklem x=5 ve x=−7 kökü verir; ancak x=−7\u0027de x−1=−8 negatif olduğundan logaritmanın içi sağlanmaz ve bu kök geçersizdir.","B":"Her iki kök bulunduktan sonra bunları toplayıp −2 bulmak hatalıdır; denklemin geçerli kökü tek tanedir (x=5), toplama işlemi yapılmaz."},"dogru":"İki logaritmayı çarpım kuralıyla birleştirip log₂[(x−1)(x+3)]=5 elde et. Bunu üstel biçime çevir: (x−1)(x+3)=2⁵=32. Kuadratik denklemi çöz (x=5 veya x=−7), ancak x=−7 logaritmanın içini negatif yaptığı için atılır; cevap x=5.","sinav":"Logaritma teorisi (çarpım kuralı ve tanım): log_a x + log_a y = log_a(xy) ve log_a(ifade) = n ⇔ a^n = ifade; tanım şartı içler pozitif olmalıdır.","kavramlar":[{"kaynak":"TEORI","tanim":"Logaritmada içi pozitif, tabanı pozitif ve 1\u0027den farklı olmalıdır; denklem çözümünden sonra bulunan kökler bu şartlara uyup uymadığı kontrol edilerek geçersiz kökler atılır.","ad":"Tanım şartı"},{"kaynak":"TEORI","tanim":"Aynı tabanlı iki logaritmanın toplamı, içlerinin çarpımının logaritmasına eşittir: log_a x + log_a y = log_a(xy).","ad":"Logaritmaların çarpım kuralı"},{"kaynak":"TEORI","tanim":"Logaritma denklemi log_a(ifade) = n biçimindeyse bunu üstel form ifade = a^n olarak çevirerek cebirsel denklem elde edilir.","ad":"Üstel biçime dönüşüm"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["Çarpım kuralı","Log₃[(x-1)(x+5)]=3","Birleşik logaritma"],["Üstel çevirme","(x-1)(x+5)=3^3","27"],["Denklem","X²+4x-5=27","X²+4x-32=0"],["Çarpanlara ayırma","(x+8)(x-4)=0","X=4 veya x=-8"],["Tanım kontrolü","X=-8 için x-1=-9\u003c0, atılır","X=4"]]},"tur":"tablo","soru":"Gerçel sayılarda tanımlı log₃(x−1) + log₃(x+5) = 3 denkleminin, tanım şartını sağlayan kökü kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve x\u0027in tanım şartını sağlayan kökünün 4 olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Gerçel sayılarda tanımlı log₂(x − 1) + log₂(x + 3) = 5 denkleminin, tanım şartını sağlayan kökü kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-35","verilenler":[{"deger":"2","anlam":"her iki logaritmanın tabanı, üstel çevirmede 2⁵ hesabında kullanılır","ad":"taban"},{"deger":"x-1","anlam":"birinci logaritmanın içi, tanım şartında ve çarpımda kullanılır","ad":"birinci içler terimi"},{"deger":"x+3","anlam":"ikinci logaritmanın içi, tanım şartında ve çarpımda kullanılır","ad":"ikinci içler terimi"},{"deger":"5","anlam":"birleşik logaritmanın değeri, üstel çevirmede tabanın kuvveti olur","ad":"eşitliğin sağı"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Logaritma Denklemi","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: log₂(x − 1) + log₂(x + 3) = 5 (soruda verilen)","anlatim":"Soru bize logaritmalı bir denklem veriyor. log₂(x − 1) + log₂(x + 3) = 5 eşitliğinin tanım şartını sağlayan kökünü istiyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"log_a x + log_a y = log_a(x × y) → log₂[(x − 1)(x + 3)] = 5 (soruda verilen)","anlatim":"Aynı tabanlı iki logaritmanın toplamı, içlerin çarpımının logaritmasına dönüşür. Bu kural sayesinde tek logaritma elde ederiz.","doldur":[[6,1],[6,2]]},{"formul":"log_a(N) = n → a^n = N → 2^5 = (x − 1)(x + 3) → 32 = (x − 1)(x + 3)","anlatim":"log₂(ifade) = 5 demek, 2 üssü 5 o ifadeye eşit demektir. Logaritmadan kurtulmak için bu üstel forma geçiyoruz.","doldur":[[7,1],[7,2]]},{"formul":"(x − 1)(x + 3) = x² + 2x − 3 = 32 → x² + 2x − 35 = 0","anlatim":"Şimdi çarpımı açıp ikinci derece denklem kuruyoruz. Parantezleri çarpınca x² + 2x − 3 çıkar, bunu 32\u0027ye eşitliyoruz.","doldur":[[8,1],[8,2]]},{"formul":"x² + 2x − 35 = (x + 7)(x − 5) = 0 → x = -7 veya x = 5","anlatim":"İkinci derece denklemi çarpanlarına ayırıyoruz, toplamı 2 çarpımı -35 olan iki sayı 7 ve -5. Kökleri buradan buluyoruz.","doldur":[]},{"formul":"Tanım şartı: x − 1 \u003e 0 ve x + 3 \u003e 0 → x = -7 (4. adımda bulduk) için x − 1 = -8 \u003c 0 (HATALI), x = 5 (4. adımda bulduk) için x − 1 = 4 \u003e 0 ✓ → sonuç x = 5","anlatim":"Logaritmanın içi mutlaka pozitif olmalı, bu tanım şartıdır. x = -7 için x − 1 negatif çıkıyor, o yüzden bu kök atılır.","doldur":[[10,1],[10,2]]},{"formul":"Yanlış yol: x = -7 veya x = 5 ikisini de cevap yazmak (HATALI) → doğrusu x = 5 (5. adımda bulduk)","anlatim":"En sık hata: öğrenci tanım şartını kontrol etmeden ikinci derece denklemin iki kökünü de cevap olarak verir. x = -7 matematiksel bir kök ama logaritmanın tanım kümesine girmediği için geçersizdir.","doldur":[]}],"anahtar":[{"ornek":"logaritmanın","kok":"logari"},{"ornek":"şartında","kok":"şartın"},{"ornek":"çarpımının","kok":"çarpım"},{"ornek":"denklem","kok":"denkle"},{"ornek":"pozitif","kok":"poziti"},{"ornek":"derece","kok":"derece"}],"konuGiris":{"harita":"Ne zaman test edilir: çarpım-bölüm-kuvvet kuralları ve tanım kümesi birlikte sorulduğunda test edilir. Nasıl ölçülür: denklemi tek logaritmaya indirip üstel forma çevirerek kökü bulman istenir. Nasıl kaydedilir: bulunan kök, logaritma içindeki ifadelerin pozitif olması şartına göre kontrol edilip kabul veya reddedilir.","desen":"Bu soruda öğrenci çarpım kuralıyla iki logaritmayı birleştirip üstel denkleme geçmeli, sonra ikinci dereceden denklemin iki kökünden tanım şartını sağlamayanı elemelidir. Tuzak, negatif kökü de cevap sanıp tanım kümesini kontrol etmemektir. Bu soru çarpım kuralı ve tanım kümesi kontrolü noktasından geliyor (p.28).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"a üzeri y, x\u0027e eşitse log_a x = y\u0027dir","ad":"logaritma tanımı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"aynı tabanlı iki logaritmanın toplamı, çarpımın logaritmasına eşittir","ad":"çarpım kuralı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"logaritma içindeki ifade her zaman sıfırdan büyük olmalıdır","ad":"tanım kümesi şartı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"denklemi sağlayan ve tanım şartına uyan gerçel değer","ad":"kök","kim":"kanun sabitler"}],"sinavda":"Toplamı verilen iki logaritmalı ifadeden, tanım şartını sağlayan gerçel kök istenir.","panel_ornek":"Bir kumbarada her gün paran katlanarak artıyor ve 4 gün sonra 16 lira oluyor diyelim. Kaç gün önce kumbarada 1 lira vardı sorusunu çözerken üs ile logaritma ters işlem olarak devreye girer. Yani 2 üzeri kaç 16 eder sorusunun cevabını bulmak logaritmadır.","ornek":"Bir kumbarada her gün paran katlanarak artıyor ve 4 gün sonra 16 lira oluyor diyelim. Kaç gün önce kumbarada 1 lira vardı sorusunu çözerken üs ile logaritma ters işlem olarak devreye girer. Yani 2 üzeri kaç 16 eder sorusunun cevabını bulmak logaritmadır.","yontemler":"Çarpım kuralıyla tek logaritmaya indirip üstel forma geçilir, çıkan ikinci dereceden denklemin kökleri tanım şartına göre elenir.","nedir":"Logaritma, üslü denklemleri çözmek için kullanılan işlem kuralıdır. Sınav, çarpım-bölüm-kuvvet kurallarını doğru uygulayıp tanım kümesini kontrol edebilmeni ölçer."},"olay":"log₂[(x−1)(x+3)]=5 → (x−1)(x+3)=2⁵=32 → x²+2x−35=0 → (x+7)(x−5)=0 → x=5 veya x=−7; x=−7 için x−1\u003c0 olduğundan atılır.","tuzak":{"C":{"ad":"Üstel Çevirmeyi Atlama Tuzağı","metin":"log₂[(x−1)(x+3)]=5 ifadesi üstel biçime çevrilmeden (x−1)(x+3)=5 sanılır, bu da x=2 verir. Doğrusu: eşitliğin sağındaki 5, tabanın (2) kuvveti olarak 2⁵=32\u0027ye çevrilmelidir."},"E":{"ad":"Toplamı İçler Toplamı Sanma Tuzağı","metin":"log₂(x−1)+log₂(x+3) ifadesi log₂[(x−1)+(x+3)] sanılıp (x−1)+(x+3)=32 çözülür, bu da x=15 verir. Doğrusu: logaritmaların toplamı içlerin ÇARPIMININ logaritmasına eşittir, toplamına değil."},"A":{"ad":"Kayıp Kök Tuzağı","metin":"(x+7)(x−5)=0 kökleri x=5 ve x=−7 verir; x=−7 için x−1=−8 negatif olduğundan tanım şartını bozar. Doğrusu: tanım şartı x\u003e1 kontrol edilip yalnız x=5 kabul edilir."},"B":{"ad":"Kök Toplama Tuzağı","metin":"iki kökün ikisi de geçerliymiş gibi 5+(−7)=−2 toplanır. Doğrusu: denklemin tek bir geçerli kökü vardır, toplama işlemi yapılmaz."}},"celdiriciYol":{"C":"(x-1)(x+3)=5 → x²+2x-8=0 → (x+4)(x-2)=0 → x=2 (üstel çevirmeyi atlayıp sayıya doğrudan eşitleme)","E":"(x-1)+(x+3)=32 → 2x+2=32 → x=15 (logaritma toplamını içler toplamı sanma)","A":"x²+2x-35=0 → (x+7)(x-5)=0 → x=-7 (tanım şartını kontrol etmeden negatif kökü seçme)","B":"5 + (-7) = -2 (geçersiz kökle geçerli kökü toplama)"},"hap":"İki logaritmanın toplamı, içlerin çarpımının logaritmasına eşittir; bulunan her kök tanım şartında (içler pozitif) mutlaka denenir.","teshis":{"C":{"gercek":"log_a(x)=y ⇔ aʸ=x tanımı gereği eşitliğin sağındaki sayı, tabanın kuvveti olarak yazılmalıdır; 5, 2⁵=32\u0027ye çevrilir.","ayirt":"Eşitliğin sağındaki sayıyı tabanın üssü yaptım mı, yoksa doğrudan ifadeye mi eşitledim?","paragraf":"TESMER SGS Matematik Ders Notu - Logaritma Denklemi","yanilgi":"log_a(ifade)=n eşitliğinde n sayısını doğrudan ifadeye eşit sanıp üstel çevirmeyi atlıyorsun."},"E":{"gercek":"log_a x + log_a y = log_a(xy) kuralı geçerlidir; log_a(x+y) diye bir özdeşlik yoktur.","ayirt":"İki logaritmayı birleştirirken içleri çarptım mı, yoksa yanlışlıkla topladım mı?","paragraf":"TESMER SGS Matematik Ders Notu - Logaritma İşlemleri","yanilgi":"İki logaritmanın toplamının, içlerin toplamının logaritmasına eşit olduğunu sanıyorsun."},"A":{"gercek":"Logaritmanın içi pozitif olmalıdır; x=−7 için x−1=−8\u003c0 olduğundan bu kök tanım kümesi dışındadır ve atılır.","ayirt":"Bulduğum kökü x−1 ve x+3 ifadelerine yerine koyduğumda ikisi de pozitif çıkıyor mu?","paragraf":"TESMER SGS Matematik Ders Notu - Logaritma Denklemi","yanilgi":"İkinci dereceden denklemin verdiği her kökü otomatik olarak geçerli sanıyorsun."},"D":{"gercek":"log_a(xy)=log_a x + log_a y kuralıyla birleştirme ve ardından tanım şartı kontrolü zorunlu iki adımdır; x=5 her iki adımı da geçer.","ayirt":"Bulduğum kökü orijinal denklemde yerine koyup her iki logaritmanın içinin pozitif çıktığını doğruladım mı?","paragraf":"TESMER SGS Matematik Ders Notu - Logaritma Denklemi","yanilgi":"Bu şıkkı eleyen öğrenci, tanım şartı kontrolünün gereksiz bir ek adım olduğunu düşünüp iki kökten rastgele birini seçer."},"B":{"gercek":"Denklemin yalnızca tanım şartını sağlayan tek bir kökü vardır; geçersiz kök toplamaya değil elemeye tabi tutulur.","ayirt":"Soru \u0027kökler toplamı\u0027 mı yoksa \u0027kök\u0027 mü diye soruyor, ikinci kökü tanım şartında denedim mi?","paragraf":"TESMER SGS Matematik Ders Notu - Logaritma Denklemi","yanilgi":"Sınavın \u0027kök\u0027 sorduğu yerde iki kökün ikisini de geçerli sayıp toplaman gerektiğini sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 15"},"kural":"log_a(x)=y ⇔ aʸ=x; toplam log_a(xy)=log_a x+log_a y; tanım şartı x\u003e1 kontrol edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 15","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Denklemi bitirmeden çıkan ara sayıları (üstel eşitliğin sağındaki değer gibi) son ifadeye yerleştirmeden önce, o sayının gerçekten istenen değişken mi yoksa bir ara adım mı olduğunu kontrol et.","konu":"logaritma işlemleri","tablo":{"satirlar":[["VERİLENLER","-","-"],["log 2 değeri","a","-"],["log 3 değeri","b","-"],["denklemin sağ tarafı","3","-"],["ifadedeki katsayı","6","-"],["HESAP","-","-"],["Denklemi birleştirme","Log₂[(x-1)(x+1)]=3","(x-1)(x+1)=8"],["Denklemi çözme","X²-1=8","X²=9"],["Kök eleme","X=3 veya x=-3, tanım şartı x\u003e1","X=3"],["İfadeyi hesaplama","6x²=6·9","54"],["Asal çarpanlara ayırma","54=2·3³","Log54=log2+3log3"],["Sonuç","A+3b","A + 3b"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"a + 3b","E":"a + b³","A":"a + 2b","D":"4a + b","B":"3a + b"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Denklemi tamamlamadan (x-1)(x+1) = 8 ara sonucunu x² yerine yazıp 6·8 = 48 hesaplarsınız; oysa önce x² = 9 bulunmalı, 6·9 = 54 = a + 3b çıkar.","E":"Kuvvet kuralı log xⁿ = n·log x ile (log x)ⁿ karıştırılırsa log 27 yerine (log 3)³ = b³ yazılır; doğru kuralda üs katsayı olarak öne gelir, log 27 = 3b\u0027dir.","A":"x² yerine x yazıp 6x = 18 sandığında log 18 = a + 2b çıkar; oysa x² = 9 olmalıdır, sonuç 6·9 = 54 = a + 3b.","B":"log₂(...) = 3 denkleminde içeriyi doğrudan 3\u0027e eşitleyip x = 2 bulursunuz; hâlbuki üstel biçime çevirerek 2³ = 8 olarak işlemelisiniz, x = 3 gelir ve sonuç a + 3b olur."},"dogru":"Denklemi çözmek için logaritmaları birleştir: log₂[(x-1)(x+1)] = 3, sonra 2³ = 8 olduğundan x² - 1 = 8, buradan x = 3 bulunur (x = -3 tanım şartını bozar). Son adımda 6x² = 6·9 = 54 = 2·3³ olduğundan log 54 = log 2 + 3·log 3 = a + 3b.","sinav":"Logaritma işlemleri ve kuvvet kuralı (taban 10); log₂(x-1) + log₂(x+1) = 3 denkleminde üstel biçime çevirmek, tanım şartlarını kontrol etmek, çarpımı toplama çevirme kuralını ve kuvvet kuralını (log xⁿ = n·log x) uygulanmalıdır.","kavramlar":[{"kaynak":"TEORI","tanim":"Logaritma denkleminde içi pozitif, tabanı pozitif ve 1\u0027den farklı olmalıdır; çözümden sonra elde edilen kökler bu şartlarda kontrol edilir ve şartı bozan kökler atılır.","ad":"Tanım şartları"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2],[5,1],[5,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["Denklemi birleştirme","Log₂[(x-1)(x+2)]=2","(x-1)(x+2)=4"],["Denklemi çözme","x²+x-2=4","x²+x-6=0"],["Kök eleme","x=2 veya x=-3, tanım şartı x\u003e1","x=2"],["İfadeyi hesaplama","20x²=20·4","80"],["Asal çarpanlara ayırma","80=2⁴·5","Log80=4log2+log5"],["Sonuç","4a+b","4a+b"]]},"tur":"tablo","soru":"log 2 = a ve log 5 = b olmak üzere; log₂(x-1) + log₂(x+2) = 2 denkleminin tanım kümesine uyan kökü için, log(20x²) ifadesinin a ve b cinsinden değeri kaçtır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve log(20x²) ifadesinin 4a+b olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"log 2 = a ve log 3 = b olmak üzere; log₂(x-1) + log₂(x+1) = 3 denkleminin tanım kümesine uyan kökü için, log(6x²) ifadesinin a ve b cinsinden değeri kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-35","verilenler":[{"deger":"a","anlam":"10 tabanına göre log2 sabiti, son adımda 2\u0027nin logaritması yerine yazılır.","ad":"log 2 değeri"},{"deger":"b","anlam":"10 tabanına göre log3 sabiti, 3\u0027ün logaritması ve kuvvetleri için kullanılır.","ad":"log 3 değeri"},{"deger":"3","anlam":"log₂[(x-1)(x+1)]=3 eşitliğinin üstel forma çevrilmesinde kullanılır: 2³=8.","ad":"denklemin sağ tarafı"},{"deger":"6","anlam":"İstenen ifade olan 6x²\u0027nin sabit çarpanı, sonuçta asal çarpanlara ayrılırken 2 olarak görünür.","ad":"ifadedeki katsayı"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Logaritma Tanımı, Kuvvet ve Çarpım Özellikleri","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: Log 2 = a (soruda verilen); Log 3 = b (soruda verilen); Log₂(x-1) + Log₂(x+1) = 3 (soruda verilen)","anlatim":"Soru bize şunları vermiş: log 2 = a, log 3 = b ve log₂(x-1) + log₂(x+1) = 3 denklemi. Bunları biz bulmadık, direkt soru verdi.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Log₂(x-1) + Log₂(x+1) = Log₂[(x-1)(x+1)] = 3 (soruda verilen) → (x-1)(x+1) = 2³ = 8","anlatim":"İki logaritmayı toplarken tabanlar aynıysa içleri çarpılır. Sonra logaritmanın tanımını kullanıp üstel forma geçiyoruz.","doldur":[]},{"formul":"X² - 1 = 8 (2. adımda bulduk) → X² = 9","anlatim":"Çarpımı açıp basit bir ikinci derece denklem elde ediyoruz. Bu adımda sadece cebirsel sadeleştirme var.","doldur":[]},{"formul":"X = 3 veya X = -3 (3. adımda bulduk); tanım şartı X \u003e 1 → X = -3 (HATALI) elenir, X = 3 (3. adımda bulduk) kalır","anlatim":"X² = 9 iki kök verir ama logaritmanın içi negatif olamaz, o yüzden tanım kümesini kontrol ediyoruz. Dikkat: X - 1 \u003e 0 şartı X \u003e 1 demek, bu yüzden X = -3 elenir.","doldur":[]},{"formul":"6X² = 6 × 9 (4. adımda bulduk) = 54","anlatim":"Şimdi bulduğumuz kökü istenen ifadeye yerine koyuyoruz. Bu sadece bir çarpma işlemi.","doldur":[]},{"formul":"54 = 2 × 3³ (5. adımda bulduk) → Log54 = Log2 + 3×Log3","anlatim":"54 sayısını asal çarpanlarına ayırıp logaritmayı a ve b cinsinden yazılabilir hale getiriyoruz. Çarpımın logaritması, logaritmaların toplamıdır.","doldur":[[10,1],[10,2]]},{"formul":"Log54 = Log2 + 3×Log3 (6. adımda bulduk) = a + 3×b (soruda verilen a,b) → A + 3B","anlatim":"Log2 yerine a, Log3 yerine b yazınca istenen ifade tamamlanır. Bu sorunun son cevabı.","doldur":[]},{"formul":"Ters durum: tanım şartı kontrol edilmeseydi → X = -3 kabul edilirdi (HATALI, Log(-4) tanımsız)","anlatim":"Ters durumda, yani tanım şartı kontrol edilmeseydi X = -3 de geçerli kök sayılırdı. Bu durumda Log(x-1) negatif sayının logaritması olurdu, bu da tanımsızdır.","doldur":[]},{"formul":"Yanlış yol: X = 3 veya X = -3 ikisi de kabul = iki farklı sonuç (HATALI) → doğrusu yalnız X = 3 (4. adımda bulduk), sonuç a + 3b","anlatim":"En sık hata, X² = 9 çıkınca iki kökü de cevaba dahil etmek. Doğrusu her zaman logaritmanın iç kısmının pozitif olma şartını kontrol etmektir.","doldur":[]}],"anahtar":[{"ornek":"logaritmalı","kok":"logari"},{"ornek":"denklemde","kok":"denkle"},{"ornek":"yerine","kok":"yerine"},{"ornek":"kontrol","kok":"kontro"},{"ornek":"şartında","kok":"şartın"},{"ornek":"negatif","kok":"negati"}],"konuGiris":{"harita":"Ne zaman kullanılır: sayı doğrudan verilmeyip yerine iki logaritma harfi verildiğinde. Nasıl bulunur: istenen sayı asal çarpanlarına ayrılıp verilen harflerin toplamı-farkı biçiminde yeniden yazılır. Nasıl kontrol edilir: bulunan denklem varsa önce çözülüp tanım şartına (için pozitif olması) uyup uymadığına bakılır.","desen":"Sınav önce logaritmalı denklemi çözdürüp bir kök buldurur, sonra o kökü başka bir logaritmik ifadede kullandırır; öğrenci genellikle ikinci adımı unutup sadece kökü yazar. Tuzak, denklemin iki kökünden birinin tanım şartını bozup atılması gerektiğini fark etmemektir; p.28. Bu soru denklem çözme ile a-b cinsinden ifade yazma adımlarının birleştirilmesi noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"log_a x ifadesindeki a sayısı, pozitif ve 1\u0027den farklı olmalıdır","ad":"logaritmanın tabanı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"logaritma içindeki ifadenin sıfırdan büyük olma zorunluluğu","ad":"tanım şartı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"farklı tabandaki logaritmaları ortak tabana çeviren kural","ad":"taban değiştirme","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"soruda log 2 ve log 3 gibi verilen sabit logaritma değerleri","ad":"a ve b harfleri","kim":"piyasa fiyatlar"}],"sinavda":"Bir denklem ve iki logaritma harfi verilir, denklemin uygun kökü kullanılarak istenen ifadenin bu harfler cinsinden değeri sorulur.","panel_ornek":"İkinci el bir bisiklet ilanında fiyat iki farklı kampanya indirimiyle veriliyor ve toplam indirim oranı bu iki oranın toplanmasıyla bulunuyor, çarpılmasıyla değil. Diyelim ilk indirim 10 lira, ikinci indirim 5 lira tutuyor; toplamda 15 lira indirim oluyor. Ha, bu demek: ayrı ayrı verilen küçük parçalar toplanarak büyük sonuca ulaşılıyor.","ornek":"İkinci el bir bisiklet ilanında fiyat iki farklı kampanya indirimiyle veriliyor ve toplam indirim oranı bu iki oranın toplanmasıyla bulunuyor, çarpılmasıyla değil. Diyelim ilk indirim 10 lira, ikinci indirim 5 lira tutuyor; toplamda 15 lira indirim oluyor. Ha, bu demek: ayrı ayrı verilen küçük parçalar toplanarak büyük sonuca ulaşılıyor.","yontemler":"Önce denklem tanım şartlarıyla çözülüp geçerli kök bulunur, sonra bu kök yerine konularak istenen ifade asal çarpanlara ayrılıp verilen harflerle yazılır. Tek kritik kural: atılması gereken kökü hesaba katmamaktır.","nedir":"Logaritma işlemleri, çarpım ve kuvvet gibi işlemleri toplama-çıkarmaya çeviren bir hesaplama yöntemidir. Sınav, verilen birkaç logaritma değerinden yola çıkarak başka bir sayının logaritmasını bulabilme becerisini ölçer."},"olay":"log₂[(x-1)(x+1)]=3 → x²-1=8 → x²=9 → x=3 (x=-3 tanım şartını bozar, atılır); 6x²=54=2·3³; log54=log2+3log3=a+3b.","tuzak":{"D":{"ad":"Ara Değeri Yerine Kullanma Tuzağı","metin":"denklemi bitirmeden (x-1)(x+1)=8 ara sonucunu doğrudan x² yerine kullanıp 6·8=48=4a+b yazdın. Doğrusu: önce x²=9 bulunmalı, ara çarpım 8, x²\u0027nin kendisi değildir."},"E":{"ad":"Kuvvet Kuralı Karıştırma Tuzağı","metin":"log_a(xⁿ)=n·log_a x kuralını (log_a x)ⁿ sanıp log27=3log3 yerine (log3)³=b³ yazdın. Doğrusu: kuvvet kuralında üs, logaritmanın ÖNÜNE katsayı olarak gelir, log27=3b\u0027dir."},"A":{"ad":"Kare Atlama Tuzağı","metin":"(6x-3)² içindeki karesini almayı unutup 6x²=6x sandın, log(6·3)=log18=a+2b çıkardın. Doğrusu: x²=9 hesaplanmalı, 6x²=54=a+3b\u0027dir."},"B":{"ad":"Üstel Dönüşüm Atlama Tuzağı","metin":"log₂(...)=3 ifadesinde 2³=8 çevrimini atlayıp içeriği doğrudan 3\u0027e eşitledin, x=2 buldun. Doğrusu: içerik 2³=8\u0027e eşitlenmeli, x=3 çıkar ve sonuç a+3b\u0027dir."}},"celdiriciYol":{"D":"(x-1)(x+1) = 8 ara sonucunu x² yerine kullandın: 6·8 = 48 = 2⁴·3 → log48 = 4a + b (denklemi bitirmeden ara değeri kullandın)","E":"log54 = log2 + log27, log27 = 3log3 yerine (log3)³ yazdın: a + b³ (kuvvet kuralını karekuvvet gibi uyguladın)","A":"log(6x) = log2 + 2log3 = a + 2b (x²\u0027nin karesini almayı unutup x kullandın)","B":"(x-1)(x+1) = 3 → x² = 4 → x = 2 → 6x² = 24 = 2³·3 → log24 = 3a + b (denklemi üstel forma çevirmeden içeriği 3\u0027e eşitledin)"},"hap":"Logaritmalı denklemde önce tanım şartı (içler pozitif) yazılır, denklem üstel forma çevrilip ÇÖZÜLÜR, sonra bulunan kök tanım şartında sağlanır; ara işlem sonuçları asla nihai değişkenin yerine konmaz.","teshis":{"C":{"gercek":"log₂[(x-1)(x+1)]=3 → (x-1)(x+1)=8 → x²-1=8 → x²=9; ara çarpım 8 ile sonuç x²=9 farklı büyüklüklerdir.","ayirt":"Denklemi son adıma kadar bitirdim mi, yoksa bir ara sonuçla mı durdum?","paragraf":"Logaritma Tanımı ve Kuvvet Özelliği","yanilgi":"Bu şıkkı eleyen öğrenci, ara işlem çarpımı (8) ile denklemin çözümü olan x²\u0027yi (9) aynı zannediyor, ikisini karıştırıyor."},"E":{"gercek":"Kuvvet özelliği log_a(xⁿ)=n·log_a x\u0027tir; üs, logaritmanın içinden çıkıp logaritmanın ÖNÜNE çarpan olarak gelir, logaritma değerinin kendisine üs olmaz.","ayirt":"Üssü logaritmanın içinden mi çıkardım, yoksa logaritma sonucunun üssünü mü aldım?","paragraf":"Logaritma Kuvvet Özelliği","yanilgi":"n·log_a x kuralını (log_a x)ⁿ şeklinde, yani katsayıyı üs gibi uyguluyorsun."},"A":{"gercek":"6x² ifadesinde önce x=3 bulunur, sonra x²=9 hesaplanır, en son 6 ile çarpılır; sıralama atlanamaz.","ayirt":"İfadede gerçekten x² mi yazıyor, yoksa sadece x mi? Üssü unuttum mu?","paragraf":"Logaritma Kuvvet Özelliği","yanilgi":"İfadedeki x² terimini, denklemden çıkan x değerinin kendisiyle karıştırıp kareyi almayı atlıyorsun."},"D":{"gercek":"(x-1)(x+1)=8 ifadesi x²-1=8 anlamına gelir, x²\u0027yi bulmak için 1 eklenmesi gerekir; x²=9\u0027dur, 8 değil.","ayirt":"Bu sayı x²\u0027nin kendisi mi, yoksa x²-1\u0027in eşiti mi?","paragraf":"Cebirsel Denklem Çözümü","yanilgi":"Denklemi tam çözmeden çıkan ara çarpım değerini (8) doğrudan x² olarak kullanılabilir sanıyorsun."},"B":{"gercek":"Tanım gereği log_a(x)=y ⇔ aʸ=x\u0027tir; log₂(M)=3 ise M=2³=8 olur, M=3 değil.","ayirt":"Denklemi üstel forma çevirdim mi, yoksa logaritmanın içini sonuca mı eşitledim?","paragraf":"Logaritma Tanımı","yanilgi":"log_a(M)=k denklemini gördüğünde M\u0027nin doğrudan k\u0027ye eşit olduğunu sanıyor, üstel biçime çevirmeyi atlıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 14"},"kural":"|x-a|=3x+2 iki durumda çözülür, her kökte sağ taraf (3x+2≥0) kontrol edilir, geçerli olanlar sayılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 14","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ters sorularda önce hangi büyüklüğün (tek değer mi toplam mı) istendiğini kök cümlesinden çıkar, sonra her durumu kontrol ederek geçerli olanları topla.","konu":"mutlak değer fonksiyonu","tablo":{"satirlar":[["VERİLENLER","-","-"],["sağ taraf katsayısı","3","-"],["sağ taraf sabiti","2","-"],["verilen kök","x = 2","-"],["HESAP","-","-"],["Durum 1 (x-a=3x+2)","X=2 için: 2-a=3(2)+2=8 -\u003e a=-6","-6"],["Durum 1 kontrolü","Sağ taraf=3(2)+2=8\u003e=0","Geçerli"],["Durum 2 (-(x-a)=3x+2)","X=2 için: a=4(2)+2=10","10"],["Durum 2 kontrolü","Sağ taraf=3(2)+2=8\u003e=0","Geçerli"],["Toplam","-6+10","4"]],"basliklar":["Kalem","Hesap","Sonuç"]},"siklar":{"C":"4","E":"16","A":"-16","D":"10","B":"-6"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Yalnız ikinci durumu (−(x − a) = 3x + 2) çözüp a = 10\u0027u final cevap saymak yanlışdır; birinci durumdan da geçerli a değeri gelip iki değer toplanmalıdır.","E":"a değerlerinin mutlak değerlerini toplayıp |−6| + |10| = 16 bulmak hatalıdır; sayılar işaretleriyle toplanırsa −6 + 10 = 4 elde edilir.","A":"İkinci durumu işaret hatası ile çözerek a = −10 bulup −6 ile toplayıp −16 çıkarmak yanlıştır; doğru sonuç a = 10 vermesi nedeniyle toplam 4 olur.","B":"Sadece birinci durumu (x − a = 3x + 2) çözüp a = −6\u0027yı tek cevap sanmak tuzağıdır; ikinci durum da geçerli a değeri verir, ikisi toplanmalıdır."},"dogru":"Mutlak değer denklemi iki durumda çözülür: |x−a| = x−a veya |x−a| = −(x−a). x=2 köküne ulaşan her a değerini bulup sağ tarafın negatif olmadığını kontrol ederiz. Her geçerli a değerini toplarız.","sinav":"Reel sayılarda |x − a| = 3x + 2 denkleminin tek kökü x = 2 olduğuna göre, bu koşulu sağlayan a değerlerinin toplamı kaçtır?","kavramlar":[{"kaynak":"TEORI","tanim":"|f(x)| = g(x) biçimindeki denklem, f(x) = g(x) veya f(x) = −g(x) olmak üzere iki durumda çözülür ve bulunan her kök sağ tarafın (g(x)) negatif olmadığı kontrol edilerek geçerli sayılır.","ad":"Mutlak değer denklemi"},{"kaynak":"TEORI","tanim":"|f(x)| = g(x) denkleminde g(x) ≥ 0 koşulu sağlanmazsa o kök denklemin çözümü değildir; sonuç negatif olan kökler atılır.","ad":"Sağ taraf kontrolü"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2]],"tablo":{"basliklar":["Kalem","Hesap","Sonuç"],"satirlar":[["Durum 1 (x-b=2x+3)","X=3 için: 3-b=2(3)+3=9 -\u003e b=-6","-6"],["Durum 1 kontrolü","Sağ taraf=2(3)+3=9\u003e=0","Geçerli"],["Durum 2 (-(x-b)=2x+3)","X=3 için: b=3(3)+3=12","12"],["Durum 2 kontrolü","Sağ taraf=2(3)+3=9\u003e=0","Geçerli"],["Toplam","-6+12","6"]]},"tur":"tablo","soru":"Reel sayılarda tanımlı |x − b| = 2x + 3 denkleminin tek kökünün x = 3 olduğu bilinmektedir. Bu koşulu sağlayan b değerlerinin toplamı kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve b değerlerinin toplamının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Reel sayılarda tanımlı |x − a| = 3x + 2 denkleminin tek kökünün x = 2 olduğu bilinmektedir. Bu koşulu sağlayan a değerlerinin toplamı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-36","verilenler":[{"deger":"3","anlam":"3x+2 ifadesindeki x\u0027in katsayısı, sağ tarafın değerini hesaplamada kullanılır","ad":"sağ taraf katsayısı"},{"deger":"2","anlam":"3x+2 ifadesindeki sabit terim, sağ tarafın değerini hesaplamada kullanılır","ad":"sağ taraf sabiti"},{"deger":"x = 2","anlam":"denklemin tek kökü olduğu belirtilen değer, her iki durumda da a\u0027yı bulmak için yerine konur","ad":"verilen kök"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu, Mutlak Değer Denklemleri bölümü","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: Denklem |x - a| = 3x + 2 (soruda verilen); Tek kök x = 2 (soruda verilen)","anlatim":"Mutlak değerli denklemde iki durum var: içi pozitif ya da negatif kabul edilir. Soru bize x=2 kökünü veriyor, biz a\u0027yı buluyoruz.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Durum 1: x - a = 3x + 2 → a = x - (3x + 2) = 2 (soruda verilen) - (3 × 2 (soruda verilen) + 2) = 2 - 8 = -6","anlatim":"Durum 1\u0027de mutlak değerin içi pozitif kabul edilir, yani x-a direkt yazılır. x=2 değerini yerine koyup a\u0027yı çözüyoruz.","doldur":[[5,1],[5,2]]},{"formul":"Sağ taraf kontrolü = 3 × 2 (soruda verilen) + 2 = 8 → 8 ≥ 0 geçerli","anlatim":"Mutlak değer denkleminde bulunan kökü sağ tarafta yerine koyup kontrol etmek zorunludur. Sağ taraf negatifse kök geçersiz sayılır.","doldur":[[6,1],[6,2]]},{"formul":"Durum 2: -(x - a) = 3x + 2 → a = 4x + 2 = 4 × 2 (soruda verilen) + 2 = 8 + 2 = 10","anlatim":"Durum 2\u0027de mutlak değerin içi negatif kabul edilir, yani -(x-a) yazılır. Yine x=2 koyup a\u0027yı çözüyoruz.","doldur":[[7,1],[7,2]]},{"formul":"Sağ taraf kontrolü = 3 × 2 (soruda verilen) + 2 = 8 → 8 ≥ 0 geçerli","anlatim":"Durum 2\u0027nin kökünü de aynı şekilde sağ tarafta kontrol ediyoruz. Kontrolsüz kök kabul edilmez, tuzak burada.","doldur":[[8,1],[8,2]]},{"formul":"Toplam = -6 (2. adımda bulduk) + 10 (4. adımda bulduk) = 4","anlatim":"İki durumdan gelen geçerli a değerlerini topluyoruz, çünkü soru toplamı istiyor. İkisi de geçerli olduğu için ikisini de sayıyoruz.","doldur":[[9,1],[9,2]]},{"formul":"Ters durum: 3x + 2 \u003c 0 olsaydı → o durumdaki a değeri geçersiz, toplamdan çıkar","anlatim":"Ters durum: sağ taraf negatif çıksaydı o a değeri geçersiz olurdu ve toplama girmezdi. Bu yüzden kontrol adımı asla atlanmaz.","doldur":[]},{"formul":"Yanlış yol: kontrolsüz toplam = -6 + 10 = 4 (HATALI yöntem, tesadüfen doğru) → doğrusu her kökü sağ tarafta test ederek 4 (6. adımda bulduk)","anlatim":"En sık hata: sağ taraf kontrolünü hiç yapmadan iki durumdaki a\u0027ları direkt toplamaktır. Bu soruda ikisi de geçerli çıktı ama her zaman böyle olmaz, kontrol şart.","doldur":[]}],"anahtar":[{"ornek":"kontrol","kok":"kontro"},{"ornek":"mutlak","kok":"mutlak"},{"ornek":"değerin","kok":"değeri"},{"ornek":"negatif","kok":"negati"},{"ornek":"geçerli","kok":"geçerl"},{"ornek":"denkleminde","kok":"denkle"}],"konuGiris":{"harita":"Hangi durumda iki ayrı denklem kurulur: mutlak değer içindeki ifade pozitif veya negatif olabileceği için iki durum yazılır. Bulunan kökler nasıl elenir: her kök sağ taraftaki ifadede yerine konur, sağ taraf negatif çıkarsa kök atılır. Sonuç nasıl kaydedilir: geçerli kalan köklerin toplamı ya da istenen ifade tek sayı olarak yazılır.","desen":"Sınav burada, verilen tek kökü denklemde yerine koyarak önce a\u0027yı bulmayı, sonra ikinci durumu da denemeyi ister. Tuzak, ikinci olası a değerinin gözden kaçırılmasıdır çünkü soru \u0027tek kök\u0027 dese de a için birden fazla değer çıkabilir. Bu soru mutlak değerli denklemlerde parametre bulma ve kök kontrolü noktasından geliyor (p.arşiv, 1 dönem).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Bir sayının sıfıra uzaklığı; sonucu asla negatif olmaz","ad":"Mutlak değer","kim":"kuraldan bilinir"},{"kaynak":"sen hesaplarsın","tanim":"Mutlak değer içindeki ifadeyi sıfır yapan x değeri","ad":"Kritik nokta","kim":"soruda verilen ifadeden çıkarılır"},{"kaynak":"sen hesaplarsın","tanim":"Bulunan çözümün denklemi gerçekten sağlayıp sağlamadığının denetimi","ad":"Kök kontrolü","kim":"kuraldan bilinir"},{"kaynak":"soruda verilir","tanim":"Denklemdeki bilinmeyen sabit; verilen kök şartından bulunur","ad":"Parametre a","kim":"soruda verilen kök şartı belirler"}],"sinavda":"Kökü bilinen bir mutlak değerli denklemde, koşulu sağlayan parametre değerlerinin toplamı istenir.","panel_ornek":"Bir markette iki farklı yoldan aynı raf mesafesine varabilirsin: soldan 5 adım, sağdan da 5 adım; ikisi de aynı uzaklık sayılır. İşte mutlak değer de tam olarak bu, yönü değil uzaklığı ölçer. Negatif adım sayısı diye bir şey yoktur.","ornek":"Bir markette iki farklı yoldan aynı raf mesafesine varabilirsin: soldan 5 adım, sağdan da 5 adım; ikisi de aynı uzaklık sayılır. İşte mutlak değer de tam olarak bu, yönü değil uzaklığı ölçer. Negatif adım sayısı diye bir şey yoktur.","yontemler":"Verilen kök denklemde yerine konur, ardından mutlak değer içindeki ifadenin işaretine göre iki ayrı durum ayrı ayrı incelenir. En kritik kural: bulunan her a için denklemin gerçekten tek kök vermesi ayrıca doğrulanmalıdır.","nedir":"Mutlak değer bir sayının sıfıra olan uzaklığıdır ve her zaman negatif olmayan bir değer verir. Sınav, mutlak değerli denklemi doğru kurup bulunan kökleri kontrol edip edemediğini ölçer."},"olay":"Durum 1: x-a=3x+2, x=2 için a=-6, sağ taraf=8≥0 geçerli. Durum 2: -(x-a)=3x+2, x=2 için a=10, sağ taraf=8≥0 geçerli. Toplam: -6+10=4.","tuzak":{"D":{"ad":"Tek Durum Tuzağı","metin":"Yalnız ikinci durumu (-(x-a)=3x+2) çözüp a=10\u0027u tek cevap sanırsın. Doğrusu: Birinci durum da geçerli kök verdiğinden iki a değeri toplanmalıdır."},"E":{"ad":"İşaret Gözardı Tuzağı","metin":"a değerlerini mutlak değerce toplayıp |-6|+10=16 hesaplarsın. Doğrusu: a değerleri işaretleriyle toplanır, -6+10=4 olur."},"A":{"ad":"Toplam Hatası Tuzağı","metin":"İkinci durumu yanlış çözüp a=-10 bulup -6 ile toplayınca -16 çıkar. Doğrusu: İkinci durum a=10 verir, toplam -6+10=4\u0027tür."},"B":{"ad":"Tek Durum Tuzağı","metin":"Yalnız birinci durumu (x-a=3x+2) çözüp a=-6\u0027yı doğrudan cevap sanırsın. Doğrusu: İkinci durum da geçerli kök verdiğinden iki a değeri toplanmalıdır."}},"celdiriciYol":{"D":"a = 10 (yalnız ikinci durumu çözüp toplam yerine tek değeri yazma hatası)","E":"|-6| + 10 = 16 (a değerlerini işaretsiz, mutlak değerce toplama hatası)","A":"-6 + (-10) = -16 (ikinci durumun a formülünü yanlış çözüp a=-10 bulma hatası)","B":"a = -6 (yalnız birinci durumu çözüp toplam yerine tek değeri yazma hatası)"},"hap":"|f(x)|=g(x) denkleminde f(x)=g(x) veya f(x)=-g(x) durumlarının her ikisi de g(x)≥0 koşuluyla ayrı ayrı sınanır.","teshis":{"C":{"gercek":"|f(x)|=g(x) denkleminde f(x)=g(x) veya f(x)=-g(x) durumlarının ikisi de g(x)≥0 koşuluyla sınanır; burada ikisi de geçerli olduğundan a değerleri toplanır.","ayirt":"Her iki durumu da kurup sağ tarafı (3x+2) kontrol ettim mi?","paragraf":"Mutlak değer denklemleri - durum ayrımı ve kök kontrolü","yanilgi":"Bu şıkkı eleyen öğrenci tek durumla yetinip ikinci durumu atladığı için 4\u0027e ulaşamaz."},"E":{"gercek":"a=-6 ve a=10 cebirsel değerlerdir, mutlak değer alınmaz; toplam -6+10=4 olarak hesaplanır.","ayirt":"Bulduğum a değerlerini işaretleriyle mi topladım yoksa mutlak değerce mi?","paragraf":"Mutlak değer denklemleri - işaret kuralı","yanilgi":"a değerlerini toplarken işaretlerini gözardı edip mutlak değerlerini topladığını sanıyorsun."},"A":{"gercek":"Durum 2\u0027de -(x-a)=3x+2 → a=4x+2 formülü doğru kurulursa x=2 için a=10 çıkar, -10 değil.","ayirt":"İkinci durumun işaretini adım adım tekrar kurup a=4x+2 formülünü mü elde ettim diye sor.","paragraf":"Mutlak değer denklemleri - durum ayrımı","yanilgi":"İkinci durumun denklemini kurarken işaret hatası yapıp a=-10 buldun ve bunu -6 ile topladın sanıyorsun."},"D":{"gercek":"Birinci durum (x-a=3x+2) da x=2 için geçerli bir a değeri (a=-6) verdiğinden, iki değer birlikte toplanmalıdır.","ayirt":"Birinci durumu da çözüp sağ tarafın negatif olup olmadığını kontrol ettim mi?","paragraf":"Mutlak değer denklemleri - kök kontrolü","yanilgi":"İkinci durumu çözüp bulduğun a=10\u0027un tek başına yeterli cevap olduğunu sanıyorsun."},"B":{"gercek":"|x-a|=g(x) türü denklemde iki durum da ayrı ayrı çözülür ve sağ taraf kontrolüyle geçerliliği sınanır; soru ikisinin toplamını istiyor.","ayirt":"Soru \u0027toplam\u0027  ise a=ck yerine a=ck\u0027 değil a=birinci terim×k denir; k bulunduktan sonra sorunun istediği terime çarpılır.","teshis":{"C":{"gercek":"3:4 oranı payların eşit olmadığını, 3 birim ile 4 birim halinde bölündüğünü gösterir; eşit bölme bu oranı yok sayar.","ayirt":"Verilen oran 1:1 mi, değilse neden eşit böldüm?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı: Doğru Orantı","yanilgi":"Oranın sadece bir paylaştırma detayı olduğunu, esas işin toplamı ikiye bölmek olduğunu düşünüyorsun."},"E":{"gercek":"a/b=3/4 iki payın birbirine oranıdır; toplama oranı ise a/(a+b)=3/7\u0027dir, bu ikisi farklı kesirlerdir.","ayirt":"Bu kesir iki payın birbirine oranı mı, yoksa birinin toplama oranı mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı: Temel Özellik","yanilgi":"a/b oranını, a\u0027nın toplam içindeki payı (a/(a+b)) ile aynı şey sanıyorsun."},"A":{"gercek":"K yönteminde k yalnız ara değişkendir; sorunun istediği büyüklük k cinsinden (3k, 4k gibi) ayrıca hesaplanır.","ayirt":"K\u0027yı buldum, peki soru bana neyi (a mı, b mi, farkı mı) soruyor?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı: K Yöntemi","yanilgi":"Denklemi doğru kurduğunu, k\u0027yı bulduğunda işin bittiğini düşünüyorsun."},"D":{"gercek":"3:4 oranında ilk yazılan terim A\u0027ya (3k), ikinci terim B\u0027ye (4k) karşılık gelir; soru A\u0027yı istemektedir.","ayirt":"Hesapladığım 3k mi yoksa 4k mi, soru hangisini istiyordu?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı: K Yöntemi","yanilgi":"A ve B\u0027nin oran içindeki yerini karıştırıp B payını A sanıyorsun."},"B":{"gercek":"a/b=3/4 iken a=3k, b=4k tanımı ile a+b=7k eşitliği kurulur; k bulunduktan sonra istenen paya çarpılır.","ayirt":"Oranın hangi terimi hangi harfe karşılık geliyor, ben doğru eşleştirdim mi?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı: K Yöntemi","yanilgi":"Bu şıkkı eleyen öğrenci, orantı sabitini bulmanın yeterli olduğunu ya da arkın sayısal değeri; k sabitini bulmak için kullanılır","ad":"fark"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı ve Denklem Sistemi bölümü","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: x/4 = y/5 = z/7 (soruda verilen); z - y = 18 (soruda verilen)","anlatim":"Soru bize şunları vermiş: x/4 = y/5 = z/7 oran zinciri; z - y = 18 farkı. İstenen: x değeri.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"x/4 = y/5 = z/7 = k → x = 4k, y = 5k, z = 7k","anlatim":"Oran zinciri nedir? Üç kesir birbirine eşitse hepsi aynı k sayısının katıdır. Bu yüzden her terimi k ile yazabiliriz.","doldur":[[4,1],[4,2]]},{"formul":"z - y = 7k - 5k = 2k","anlatim":"Şimdi biz hesaplıyoruz: z ve y\u0027yi k ile ifade edip farkı kuruyoruz. Çünkü verilen fark bilgisini k\u0027ya çevirmeden k\u0027yı bulamayız.","doldur":[]},{"formul":"2k = 18 (soruda verilen) → k = 18 (soruda verilen) / 2 = 9","anlatim":"2k ifadesi soruda verilen 18\u0027e eşit, o yüzden k\u0027yı buradan çözüyoruz. Dikkat: 18 sorunun verisi, 2k bizim kurduğumuz ifade.","doldur":[]},{"formul":"x = 4k = 4 × 9 (4. adımda bulduk) = 36","anlatim":"k bulundu, artık x\u0027i k ile yazdığımız ifadeye koyup çarpıyoruz. x = 4k idi, k = 9 (4. adımda bulduk).","doldur":[]},{"formul":"y = 5 × 9 = 45; z = 7 × 9 = 63; z - y = 63 - 45 = 18 ✓","anlatim":"Sağlama yapalım: y ve z\u0027yi de k ile bulup farkına bakıyoruz, 18 çıkmalı. Çıkarsa çözüm doğrulanır.","doldur":[]},{"formul":"Sonuç: x = 36","anlatim":"Sonuç: x = 36 (5. adımda bulduk). Bu değer oran zincirindeki k üzerinden elde edildi.","doldur":[]},{"formul":"Ters durum: fark x - y verilseydi → -k = verilen fark","anlatim":"Ters durumda: fark x - y verilseydi katsayı farkı 4k - 5k = -k olurdu, negatif çıkar. O zaman farkın hangi terimler arasında olduğuna dikkat etmek gerekir.","doldur":[]},{"formul":"Yanlış yol: 4 × 18 = 72 (HATALI) → doğrusu 4 × 9 = 36 (5. adımda bulduk)","anlatim":"En sık hata: k\u0027yı bulmadan doğrudan 4 × 18 = 72 diye işlem yapmak, bu yanlıştır çünkü 18 sayısı 2k\u0027nın karşılığıdır, k\u0027nın kendisi değildir.","doldur":[]}],"anahtar":[{"ornek":"zincirinde","kok":"zincir"},{"ornek":"arasındaki","kok":"arasın"},{"ornek":"farkına","kok":"farkın"},{"ornek":"bulduk","kok":"bulduk"},{"ornek":"ifadesi","kok":"ifades"},{"ornek":"sayısının","kok":"sayısı"}],"konuGiris":{"harita":"Ne zaman test edilir: birden çok bilinmeyen tek oranla verilip ek bir toplam veya fark koşulu eklendiğinde. Nasıl ölçülür: oranı k ile yazıp koşuldan k\u0027yı bularak istenen değeri hesaplama becerisiyle. Nasıl kaydedilir: bulunan k, orandaki ilgili harfe geri konularak sonuç orana uygunluk açısından kontrol edilir.","desen":"Soru, oranı k ile ifade edip ek bir fark veya toplam koşulundan k\u0027yı bulmayı gerektiren tipte sorulur. Tuzak, üç terimli oranlarda yalnızca iki terimin farkını veya toplamını kullanıp üçüncü terimi hesaba katmamaktır. Bu soru, üç terimli oran zinciri ve ek fark koşulu bölümünden geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"orantıdaki her terimi tek değişkene indiren ortak çarpan","ad":"Oran sabiti (k)","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"iki oranın birbirine eşitliği, a/b = c/d biçiminde ifade","ad":"Orantı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"a·d = b·c eşitliğiyle oranı denkleme çeviren temel kural","ad":"İçler dışlar çarpımı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"payların toplamı bölü paydaların toplamı da aynı orana eşittir","ad":"Toplam-fark özelliği","kim":"kanun sabitler"}],"sinavda":"Üç terimli bir oran ve iki terim arasındaki fark verilir, istenen tek bir terimin değeridir.","panel_ornek":"Bir tarifte un, şeker ve yağ miktarları 3/2/1 oranındadır. Şeker ile yağ arasındaki fark 40 gram ise, un miktarını bulmak için önce oranı k ile ifade edip farktan k\u0027yı çıkarırsın.","ornek":"Bir tarifte un, şeker ve yağ miktarları 3/2/1 oranındadır. Şeker ile yağ arasındaki fark 40 gram ise, un miktarını bulmak için önce oranı k ile ifade edip farktan k\u0027yı çıkarırsın.","yontemler":"Oranın her terimi k ile ifade edilir, verilen fark veya toplam koşuluna k cinsinden yazılır ve k çözülür. Bulunan k, istenen terime geri konularak sonuç elde edilir.","nedir":"Oran orantı denklem sistemi, birden fazla bilinmeyeni tek bir k harfiyle bağlayıp çözmeyi sağlar. Sınav, verilen oranı k cinsinden yazıp ek bir koşulla k\u0027yı bulma becerini ölçer."},"olay":"z - y = 7k - 5k = 2k = 18 → k = 9; x = 4k = 4·9 = 36.","tuzak":{"C":{"ad":"Terim Karıştırma Tuzağı","metin":"k\u0027yı doğru bulup (2k = 18, k = 9) sorulan x yerine y = 5·9 = 45 değerini yazmışsın. Doğrusu: soru x\u0027i sormaktadır, y\u0027yi değil."},"E":{"ad":"Oran Farkı Tuzağı","metin":"z - y farkını terimler yerine oran paydaları farkı üzerinden (5 - 4)k = 18 kurup k = 18, x = 4·18 = 72 bulmuşsun. Doğrusu: fark, k\u0027nın kendi katsayı farkı olan (7-5)k üzerinden kurulmalıdır."},"D":{"ad":"Terim Karıştırma Tuzağı","metin":"k\u0027yı doğru bulup (2k = 18, k = 9) sorulan x yerine z = 7·9 = 63 değerini yazmışsın. Doğrusu: farktan bulunan k, istenen terime yani x\u0027e uygulanmalıdır."},"A":{"ad":"Fark Terimi Tuzağı","metin":"z - y yerine z - x farkını kurup (7k - 4k = 3k = 18, k = 6) x = 4·6 = 24 bulmuşsun. Doğrusu: soru kökündeki fark z ile y arasındadır, x ile değil."}},"celdiriciYol":{"C":"z - y = 2k = 18 → k = 9 → y = 5·9 = 45 (k doğru, istenen terim yerine y yazma)","E":"(5 - 4)k = 18 → k = 18 → x = 4·18 = 72 (fark ifadesini payda katsayı farkıyla kurma)","D":"z - y = 2k = 18 → k = 9 → z = 7·9 = 63 (k doğru, istenen terim yerine z yazma)","A":"z - x = 7k - 4k = 3k = 18 → k = 6 → x = 4·6 = 24 (yanlış terim çiftiyle fark kurma)"},"hap":"Oran zincirinde a/b = c/d = k denildiğinde her terim kendi k katıyla ifade edilir; fark veya toplam ifadesi mutlaka soruda belirtilen doğru terim çifti üzerinden kurulmalıdır.","teshis":{"C":{"gercek":"k = 9 bulunduktan sonra soru x\u0027i sormaktadır; y = 5k terimi farklı bir büyüklüktür, x = 4k ile karıştırılmaz.","ayirt":"k\u0027dan sonra hangi harfi çarpmam gerekiyordu, soru kökünü tekrar okudum mu?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı ve Denklem Sistemi","yanilgi":"Sen k\u0027yı doğru bulduktan sonra son adımda hangi terimin istendiğini kontrol etmeden ilk hesapladığın terimi cevap sanıyorsun."},"E":{"gercek":"Oran zincirinde her terim kendi payda katsayısıyla k\u0027nın katıdır; fark, terimlerin kendi k katları arasında (7k - 5k) kurulur, paydaların ham farkı üzerinden değil.","ayirt":"Fark denklemini terimlerin kendi k ifadeleriyle mi, yoksa çıplak katsayı farkıyla mı kurdum?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı ve Denklem Sistemi","yanilgi":"Sen farkı terimler (7k, 5k) yerine oranın paydaları (5, 4) üzerinden kurulur sanıp katsayı farkını yanlış hesaplıyorsun."},"A":{"gercek":"Oran zincirinde fark ifadesi yalnız soruda açıkça belirtilen iki terim arasında kurulur; burada z - y = 18 verilmiştir, z - x değil.","ayirt":"Soruda \u0027fark\u0027 hangi iki harf arasında yazılmış, ben doğru ikisini mi kullandım?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı ve Denklem Sistemi","yanilgi":"Sen, soru kökündeki farkın hangi iki terim arasında verildiğine bakmadan aklına ilk gelen iki terimi (z ve x) çıkarıp fark kurulur sanıyorsun."},"D":{"gercek":"k = 9 bulunduktan sonra soru x\u0027i sormaktadır; z = 7k terimi farkın bir parçası olsa da istenen büyüklük değildir.","ayirt":"Fark denkleminde kullandığım terimlerle, sorunun istediği terim aynı mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı ve Denklem Sistemi","yanilgi":"Sen k\u0027yı doğru bulduktan sonra son adımda en büyük ya da farkta kullanılan terimi otomatik olarak cevap sanıyorsun."},"B":{"gercek":"x/4 = y/5 = z/7 = k dendiğinde her terim kendi katsayısıyla k\u0027nın katıdır; verilen fark bu katsayılar cinsinden kurulup k bulunur, sonra istenen terime uygulanır.","ayirt":"k\u0027yı bulduktan sonra, soru bana hangi terimi soruyor; onu mu hesapladım?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Oran-Orantı ve Denklem Sistemi","yanilgi":"Bu şıkkı eleyen öğrenci genelde k\u0027yı doğru terimlerle kurmadan ya da bulduğu k\u0027yı istenen terime değil başka bir terime uyguladığı için buraya ulaşamaz."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 9"},"kural":"kalan teoremine göre (x-a) ile bölümden kalan P(a)\u0027dır; önce verilen iki kalan bilgisiyle a ve b bulunur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 9","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce her kalan bilgisini ayrı denklem olarak yaz, sistemi çözmeden hangi harfin sorulduğunu kontrol et.","konu":"polinom sadelestirme","tablo":{"satirlar":[["VERİLENLER","-"],["Birinci kalan","9"],["İkinci kalan","-6"],["Sabit katsayı","2"],["HESAP","-"],["P(1) denklemi: 3+a+b=9","A+b=6"],["P(-2) denklemi: -2a+b=-6","-2a+b=-6"],["Sistemin çözümü","A=4, b=2"],["P(2) kalanı","26"]],"basliklar":["Adım","Sonuç"]},"siklar":{"C":"4","E":"26","A":"-14","D":"10","B":"-6"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Katsayı a=4\u0027ü doğru bulup bitmek, ama soru bu katsayıyı değil P(2) kalan değerini istediğini atlamak.","A":"Denklem kurma hatasından P(-2) yerine P(2) kullanarak a ve b yanlış bulursun; sonra P(2) hesaplarken de ters sonuç alırsın.","D":"a ve b doğru çözülmesine rağmen P(2)=2³+2(2²)+4(2)+2 hesabında +2(2²) yerine -2(2²) yazarak işaret hatasına düşmek.","B":"Sorunun sonunda (x-2) ile bölümün kalanını istediği halde, başta zaten verilen (x+2) kalanını -6 olarak doğrudan yazıp bitmek isteyebilirsin."},"dogru":"Kalan teoremi sayesinde verilen iki kalan bilgisi (9 ve -6) kullanarak gizli katsayıları a=4, b=2 buluyoruz. Sonra P(2) hesaplayıp (x-2) ile bölümün kalanı 26 olarak buluyoruz.","sinav":"Polinom bölmesinde kalan teoremi uygulanır; (x − a) ile bölümün kalanı P(a)\u0027dır.","kavramlar":[{"kaynak":"TEORI","tanim":"Bir polinomu (x − a) ile böldüğümüzde kalanı bulmak için polinomda doğrudan x yerine a yazarız; kalan P(a)\u0027dır.","ad":"Kalan teoremi"},{"kaynak":"TEORI","tanim":"Üsleri doğal sayı olan ve toplama-çıkarmayla bağlanan terimlerden oluşan cebirsel ifadedir; örneğin x³ + 2x² + 4x + 2.","ad":"Polinom"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Adım","Sonuç"],"satirlar":[["Q(1) denklemi: 4+c+d=7","c+d=3"],["Q(-2) denklemi: 4-2c+d=-20","-2c+d=-24"],["Sistemin çözümü","c=9, d=-6"],["Q(2) kalanı","32"]]},"tur":"tablo","soru":"Q(x) = x³ + 3x² + cx + d polinomunun (x - 1) ile bölümünden kalanı 7, (x + 2) ile bölümünden kalanı -20\u0027dir. Buna göre Q(x)\u0027in (x - 2) ile bölümünden kalanı kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve Q(2)\u0027nin bölümünden kalan sonucunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"P(x) = x³ + 2x² + ax + b polinomunun (x - 1) ile bölümünden kalanı 9, (x + 2) ile bölümünden kalanı -6\u0027dır. Buna göre P(x)\u0027in (x - 2) ile bölümünden kalanı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-22","verilenler":[{"deger":"9","anlam":"P(x)\u0027in (x-1) ile bölümünden kalan; P(1)=9 denklemini kurmada kullanılır","ad":"Birinci kalan"},{"deger":"-6","anlam":"P(x)\u0027in (x+2) ile bölümünden kalan; P(-2)=-6 denklemini kurmada kullanılır","ad":"İkinci kalan"},{"deger":"2","anlam":"Polinomdaki x² teriminin katsayısı, denklemleri kurarken sabit olarak kullanılır","ad":"Sabit katsayı"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Polinomlarda Kalan Teoremi","dogru":"E","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: P(x) = x³ + 2x² + ax + b (soruda verilen); P(1) kalanı 9 (soruda verilen); P(-2) kalanı -6 (soruda verilen)","anlatim":"Soru bize şunları vermiş: P(x) = x³ + 2x² + ax + b; (x - 1) ile bölümden kalan 9; (x + 2) ile bölümden kalan -6. İstenen: (x - 2) ile bölümden kalan.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kalan Teoremi = P(x), (x - k) ile bölünürse kalan = P(k)","anlatim":"Kalan teoremi nedir? Bir polinom (x - k) ile bölünürse kalan P(k)\u0027dir. Bölme işlemi yapmadan direkt yerine koyup kalanı buluruz.","doldur":[[8,1]]},{"formul":"x³ terimi = 1³ = 1","anlatim":"P(1) hesabına başlıyoruz, önce x³ terimini yazıyoruz. x yerine 1 koyduk.","doldur":[]},{"formul":"2x² terimi = 2 × 1² = 2","anlatim":"Şimdi 2x² terimini hesaplıyoruz, x yerine yine 1 koyduk. Bu terim de sabit sayı çıkıyor.","doldur":[]},{"formul":"ax terimi = a × 1 = a","anlatim":"ax terimini hesaplıyoruz, a bilinmeyen olduğu için sonuç a olarak kalıyor. Bu terimi sistemde kullanacağız.","doldur":[]},{"formul":"P(1) = 1 (3. adımda bulduk) + 2 (4. adımda bulduk) + a (5. adımda bulduk) + b = 9 → a + b = 9 - 3 = 6","anlatim":"Şimdi bütün terimleri topluyoruz, bu bize P(1) denklemini verir. Kalan 9 olduğu için denklemi buradan kuruyoruz.","doldur":[[5,1],[6,1]]},{"formul":"x³ terimi = (-2)³ = -8","anlatim":"Şimdi P(-2) hesabına geçiyoruz, x³ terimini hesaplıyoruz. Negatif sayının küpü negatif çıkar, dikkat.","doldur":[]},{"formul":"2x² terimi = 2 × (-2)² = 2 × 4 = 8","anlatim":"2x² terimini hesaplıyoruz, (-2)\u0027nin karesi pozitif olduğu için terim pozitif çıkıyor.","doldur":[]},{"formul":"ax terimi = a × (-2) = -2a","anlatim":"ax terimini hesaplıyoruz, bu sefer x yerine -2 koyduk. Sonuç -2a olarak kalıyor.","doldur":[]},{"formul":"P(-2) = -8 (7. adımda bulduk) + 8 (8. adımda bulduk) + (-2a) (9. adımda bulduk) + b = -6 → -2a + b = -6","anlatim":"Bütün terimleri topluyoruz, bu bize ikinci denklemi verir. İki denklem birlikte a ve b\u0027yi bulmamızı sağlayacak.","doldur":[]},{"formul":"a + b = 6 (6. adımda bulduk); -2a + b = -6 (10. adımda bulduk) → b = 6 - a → -2a + (6 - a) = -6 → -3a = -12 → a = 4, b = 2","anlatim":"Şimdi iki denklemi birlikte çözüyoruz, çünkü iki bilinmeyenimiz var. Birinci denklemden b\u0027yi çekip ikinciye yazıyoruz.","doldur":[]},{"formul":"x³ terimi = 2³ = 8","anlatim":"Artık a ve b belli, P(2) hesabına geçebiliriz. Önce x³ terimini yazıyoruz.","doldur":[]},{"formul":"2x² terimi = 2 × 2² = 2 × 4 = 8","anlatim":"2x² terimini hesaplıyoruz, x yerine 2 koyduk. Bu terim de 8 çıkıyor.","doldur":[]},{"formul":"ax terimi = a × 2 = 4 (11. adımda bulduk) × 2 = 8","anlatim":"ax terimini hesaplıyoruz, a\u0027nın değerini az önce bulmuştuk. Bu terim 8 çıkıyor.","doldur":[]},{"formul":"P(2) = 8 (12. adımda bulduk) + 8 (13. adımda bulduk) + 8 (14. adımda bulduk) + 2 (11. adımda bulduk) = 26","anlatim":"Şimdi bütün terimleri ve b\u0027yi topluyoruz, bu bize istenen kalanı verir. Sonuç: (x-2) ile bölümden kalan 26.","doldur":[]},{"formul":"Ters durum: P(2) = 0 olsaydı → (x - 2) tam böler, kalan yok","anlatim":"Ters durumda: kalan 0 çıksaydı, bu (x - 2)\u0027nin P(x)\u0027i tam böldüğü anlamına gelirdi. Yani P(x) = (x - 2) × Q(x) yazılabilirdi.","doldur":[]},{"formul":"Yanlış yol: (-2)³ = 8 (HATALI) → doğrusu (-2)³ = -8 (7. adımda bulduk)","anlatim":"En sık hata: öğrenci P(1) veya P(-2)\u0027yi hesaplarken tüm terimleri tek satırda çarpıp toplarken işaret hatası yapıyor. Negatif sayının küpünü almayı unutup (-2)³\u0027ü 8 yazmak en yaygın tuzak.","doldur":[]}],"anahtar":[{"ornek":"terimini","kok":"terimi"},{"ornek":"hesaplıyoruz","kok":"hesapl"},{"ornek":"denklemini","kok":"denkle"},{"ornek":"bölümde","kok":"bölümd"},{"ornek":"yerine","kok":"yerine"},{"ornek":"koyduk","kok":"koyduk"}],"konuGiris":{"harita":"Ne zaman test edilir: Bir polinomda iki bilinmeyen (a, b gibi) varken iki farklı bölümden kalan bilgisi verildiğinde. Nasıl ölçülür: Kalan teoremiyle kurulan iki denklemin doğru çözülüp istenen noktadaki değerin hesaplanmasıyla. Nasıl kaydedilir: Bulunan a ve b polinoma yerine yazılıp istenen (x-2) gibi noktada P değeri hesaplanarak.","desen":"Bu tip sorularda öğrenci genelde (x+2) ile bölümde P(-2) yerine yanlışlıkla P(2) alır, işaret hatası yapar. İki denklemi kurduktan sonra a ve b\u0027yi çözmeden direkt son işlemi yapmaya çalışmak da yaygın hatadır. Bu soru kalan teoreminin işaret kuralı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"P(x)\u0027in (x-a) ile bölümünden kalan P(a)\u0027ya eşittir","ad":"Kalan teoremi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Polinomda değeri denklemlerle bulunacak sabit sayılar","ad":"Bilinmeyen katsayı (a, b)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Bölme işleminden çıkan, soruda belirtilen sayısal sonuç","ad":"Verilen kalan değeri","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Sorunun sorduğu (x-2) gibi noktadaki polinom değeri","ad":"İstenen nokta değeri","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"P(x) polinomunun iki farklı ifadeyle bölümünden kalanlar verilip üçüncü bir ifadeyle bölümünden kalan sorulur.","panel_ornek":"Bir markette iki farklı kampanyada aldığın ürünün toplam fiyatı ve fark tutarı verilse, iki denklemi birlikte çözerek ürünün tek başına fiyatını bulursun. Mesela 1. kampanyada 40 lira, 2. kampanyada 10 lira fark çıkıyorsa iki bilinmeyeni bu iki bilgiyle çözersin. Burada da aynı mantık: iki kalan bilgisi, iki bilinmeyeni (a ve b) bulmanı sağlar.","ornek":"Bir markette iki farklı kampanyada aldığın ürünün toplam fiyatı ve fark tutarı verilse, iki denklemi birlikte çözerek ürünün tek başına fiyatını bulursun. Mesela 1. kampanyada 40 lira, 2. kampanyada 10 lira fark çıkıyorsa iki bilinmeyeni bu iki bilgiyle çözersin. Burada da aynı mantık: iki kalan bilgisi, iki bilinmeyeni (a ve b) bulmanı sağlar.","yontemler":"Önce (x-1) ve (x+2) kalanlarından iki denklem kurulur, a ve b bulunur; sonra P(2) hesaplanır. Kritik kural:
