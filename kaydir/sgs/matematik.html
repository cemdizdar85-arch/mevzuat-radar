la tam uyarak doğru işlem sonucuna ulaşabilmeni ölçer."},"olay":"","tuzak":{"D":{"ad":"Sıra Tuzağı","metin":"e ⋆ t yerine t ⋆ e hesapladın; ⋆ işlemi 2x+y-4 biçiminde asimetrik olduğundan sol-sağ yer değişince sonuç değişir (2(8)+6-4=18). Doğrusu: soruda e solda t sağda olduğundan e⋆t=2(6)+8-4=16 alınmalıdır."},"E":{"ad":"Kural Karıştırma Tuzağı","metin":"⋆ tanımını 2x+y-4 yerine 2x+2y-4 sanarak uyguladın. Doğrusu: tanımdaki y\u0027nin katsayısı 1\u0027dir, e⋆t=2(6)+8-4=16 hesaplanır."},"A":{"ad":"Ne soruluyor","metin":"e ⋆ t ifadesinin değeri isteniyor. Kural: x ◇ y = x + y − 6 tanımında x ◇ e = x eşitliğinden e + x − 6 = x → e = 6 bulunur; ardından 4 ◇ t = e denkleminden 4 + t − 6 = 6 → t = 8 çıkar. Hesap: e ⋆ t = 2(6) + 8 − 4 = 16. Doğrusu: 16."},"B":{"ad":"Toplamanın Birimi Tuzağı","metin":"Sen ◇ işleminin biriminin de sıradan toplamadaki gibi 0 olacağını düşündün, oysa e her x için x◇e=x sağlayan sayıdır ve burada 6\u0027dır. Doğrusu: e=6 alınıp t=8 bulunarak e⋆t=16 hesaplanır."}},"celdiriciYol":{"D":"e=6, t=8 doğru bulunur ama sıra ters uygulanır → t⋆e=2(8)+6-4=18 (sıra tuzağı)","E":"e=6, t=8 doğru bulunur ama ⋆ tanımı 2x+2y-4 sanılır → 2(6)+2(8)-4=24 (katsayı hatası)","A":"e=0 (toplamanın birimi 0 sanılır) → 4◇t=0 → 4+t-6=0 → t=2 → e⋆t=2(0)+2-4=-2 (birim elemanı toplamanın birimiyle karıştırma)","B":"t=e sanılır (ters eleman=birim eleman) → 4◇t=4 → 4+t-6=4 → t=6 → e⋆t=2(6)+6-4=14 (ters eleman tanımını atlama)"},"hap":"Tanımlı işlemde sembolün solundaki sayı x\u0027in, sağındaki y\u0027nin yerine yazılır; birim eleman her sayı için, ters eleman ise bulunan birim elemana göre hesaplanır.","teshis":{"C":{"gercek":"Birim eleman x◇e=x denkleminden, ters eleman 4◇t=e denkleminden bulunur; sonra e⋆t sıradaki yerlerine konularak hesaplanır.","ayirt":"Her katmanı (e, sonra t, sonra e⋆t) ayrı ayrı denklemle mi kurdum?","paragraf":"Tanımlı İşlem - Birim ve Ters Eleman","yanilgi":"Bu şıkkı eleyen öğrenci genelde birim ve ters elemanı ayrı ayrı bulmadan doğrudan tahmin yürütür."},"E":{"gercek":"Tanım aynen x ⋆ y = 2x + y − 4\u0027tür; katsayılar tanımda yazıldığı gibi birebir kullanılmalıdır.","ayirt":"Hesaba geçmeden önce tanımı soruda yazıldığı haliyle mi kopyaladım?","paragraf":"Tanımlı İşlem - Tanımın Aynen Uygulanması","yanilgi":"⋆ tanımındaki y\u0027nin katsayısını da 2 sanarak işlemi yanlış hatırladın."},"A":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"D":{"gercek":"x ⋆ y = 2x + y − 4 asimetrik bir tanımdır; sıra değişince sonuç değişir, soru e⋆t istemektedir, t⋆e değil.","ayirt":"Soru kökünde hangi harf solda, hangisi sağda yazılmış?","paragraf":"Tanımlı İşlem - Sıra Kuralı","yanilgi":"e ile t\u0027yi doğru buldun ama son işlemde hangisinin solda hangisinin sağda olduğunu karıştırdın."},"B":{"gercek":"Ters eleman tanımı x◇t=e\u0027dir, e (birim eleman) önce ayrı bulunmalı, sonra bu değere göre t çözülmelidir.","ayirt":"Birim elemanı bulmadan ters elemanı arayabilir miyim?","paragraf":"Tanımlı İşlem - Ters Eleman Kuralı","yanilgi":"Ters elemanı, birim elemanla aynı denklemi kurarak (4◇t=4) buldun; ters eleman birim elemana göre değil kendine göre bulunur sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":4,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 12"},"kural":"(f∘g)(x) = f(g(x)) olduğundan önce g(2), sonra bu sonuç f\u0027ye yazılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 12","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Bileşke sorularında hangi fonksiyonun önce yazıldığına bak, önce onu hesapla, sonucu diğer fonksiyonun x\u0027ine yaz.","konu":"bileşke fonksiyon","tablo":{"satirlar":[["VERİLENLER","-","-"],["f fonksiyonu","f(x) = 2x + 3","-"],["g fonksiyonu","g(x) = x - 1","-"],["x değeri","2","-"],["HESAP","-","-"],["1","G(2) = 2 - 1","1"],["2","F(1) = 2(1) + 3","5"],["Sonuç","(f∘g)(2)","5"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"6","E":"9","A":"4","D":"7","B":"5"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Sırayı ters çevirerek (g∘f)(2)\u0027yi hesaplarsın; f∘g yazıldığında g mutlaka önce gelir.","E":"g(x)=x−1\u0027deki eksi işaretini artı gibi okuyup g(2)=3 bulursun; kural harfiyen uygulanmalı, g(2)=1\u0027dir.","D":"Bileşkeyi f(2) ile g(2)\u0027nin çarpımı sanırsın; bileşke bir fonksiyonun çıktısının diğerine girdi olmasıdır, çarpım değildir.","A":"f(x) içindeki 2 katsayısını unutup g(2)+3 hesaplarsın; f(1) = 2·1+3 olarak tam hesaplanması gerekir."},"dogru":"Bileşke fonksiyonda önce g(2)\u0027yi bul: 2−1=1. Sonra bu 1\u0027i f\u0027ye yaz: f(1)=2·1+3=5. Cevap 5\u0027tir.","sinav":"Bileşke fonksiyon (f∘g)(x) = f(g(x)) kuralına göre hesaplanır; önce iç fonksiyon g uygulanır, sonuç dış fonksiyon f\u0027ye yazılır.","kavramlar":[{"kaynak":"TEORI","tanim":"Bir fonksiyonun çıktısının başka bir fonksiyona girdi olması. (f∘g)(x) = f(g(x)) yazılır ve önce g uygulanır, sonra f uygulanır.","ad":"Bileşke fonksiyon"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,1],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["1","F(3) = 3(3) + 2","11"],["2","G(11) = 11 - 4","7"],["Sonuç","(g∘f)(3)","7"]]},"tur":"tablo","soru":"f(x) = 3x + 2 ve g(x) = x - 4 fonksiyonları veriliyor. Buna göre (g∘f)(3) kaçtır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve (g∘f)(3)\u0027ün kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f(x) = 2x + 3 ve g(x) = x - 1 fonksiyonları veriliyor. Buna göre (f∘g)(2) kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-11","verilenler":[{"deger":"f(x) = 2x + 3","anlam":"Bileşkede ikinci sırada uygulanacak fonksiyon kuralı.","ad":"f fonksiyonu"},{"deger":"g(x) = x - 1","anlam":"Bileşkede önce uygulanacak fonksiyon kuralı.","ad":"g fonksiyonu"},{"deger":"2","anlam":"Bileşke fonksiyonun hesaplanacağı nokta, önce g\u0027ye yazılır.","ad":"x değeri"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Bileşke Fonksiyon Tanımı","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: f(x) = 2x + 3 (soruda verilen); g(x) = x - 1 (soruda verilen); istenen (f∘g)(2)","anlatim":"Soru bize f(x) = 2x + 3 ve g(x) = x - 1 fonksiyonlarını vermiş. İstenen (f∘g)(2) değeri.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"(f∘g)(x) = f(g(x))","anlatim":"Bileşke fonksiyon nedir? (f∘g)(x), önce g\u0027yi işletip çıkan sonucu f\u0027ye sokmak demektir. Sıra önemli: önce iç fonksiyon, sonra dış fonksiyon.","doldur":[]},{"formul":"G(2) = 2 - 1 (soruda verilen kural ile hesaplandı) = 1","anlatim":"Önce g(2)\u0027yi hesaplıyoruz, çünkü bileşkede ilk işleyen fonksiyon g\u0027dir. Sayıyı direkt g\u0027nin kuralına yazıyoruz.","doldur":[]},{"formul":"F(1) = 2 × 1 (1. adımda bulduk) + 3 (soruda verilen) = 5","anlatim":"Şimdi bulduğumuz 1 sonucunu f fonksiyonuna yazıyoruz, çünkü bileşkede sıradaki adım bu. Dikkat: 2 değil, g(2)\u0027nin sonucu olan 1 kullanılır.","doldur":[]},{"formul":"(f∘g)(2) = F(G(2)) = 5 (2. adımda bulduk)","anlatim":"İki adımı birleştirince (f∘g)(2) sonucuna ulaşıyoruz. Bu, fonksiyonun son değeridir.","doldur":[]},{"formul":"Yanlış yol: F(2) = 2(2) + 3 = 7 (HATALI) → doğrusu G(2) = 1, sonra F(1) = 5 (3. ve 4. adımda bulduk)","anlatim":"En sık hata: öğrenci sırayı karıştırıp önce f(2)\u0027yi hesaplar. Ama (f∘g)(2) demek önce g işler demektir, f işlemi sonradır.","doldur":[]}],"anahtar":[{"ornek":"fonksiyonlarını","kok":"fonksi"},{"ornek":"sonucu","kok":"sonucu"},{"ornek":"demektir","kok":"demekt"},{"ornek":"bileşke","kok":"bileşk"},{"ornek":"yazıyoruz","kok":"yazıyo"},{"ornek":"değeri","kok":"değeri"}],"konuGiris":{"harita":"Ne zaman test edilir: iki fonksiyon verilip bir noktada ya da genel kuralda bileşke istendiğinde. Nasıl ölçülür: önce iç fonksiyon işletilip çıkan değer dış fonksiyona yazılarak. Nasıl kaydedilir: (f∘g)(x) = f(g(x)) biçiminde, sıra bozulmadan.","desen":"Sınav genelde sırayı ters verip f∘g yerine g∘f karıştırmasını bekler ya da f(2)·g(2) gibi çarpım tuzağı kurar. Bazı sorularda bileşke sonucu verilip iç fonksiyon isteniyorsa değişken değiştirme gerekir. Bu soru doğrudan sayısal noktada bileşke hesaplama noktasından geliyor (p.28, 3 dönemde çıkmış).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Bir fonksiyonun çıktısının diğerine girdi olmasıyla oluşan yeni fonksiyon","ad":"Bileşke fonksiyon","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Bileşkede önce işletilen, girdiyi ilk karşılayan fonksiyon","ad":"İç fonksiyon (g)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Bileşkede son işletilen, iç fonksiyonun çıktısını kullanan fonksiyon","ad":"Dış fonksiyon (f)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Önce g(a) bulunup sonucun f\u0027ye yazılmasıyla elde edilen sayı","ad":"(f∘g)(a) değeri","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"İki fonksiyon kuralı ve bir sayı verilip bu sayıda bileşke fonksiyonun değeri istenir.","panel_ornek":"Önce markete gidip 4 elma alıyorsun (bu bir işlem), sonra o elmaları eve götürüp 2\u0027sini komşuna veriyorsun (bu ikinci işlem). Sonucu bulmak için önce marketteki işlemi, sonra evdeki işlemi sırayla uygularsın; sırayı değiştirirsen sonuç değişir.","ornek":"Önce markete gidip 4 elma alıyorsun (bu bir işlem), sonra o elmaları eve götürüp 2\u0027sini komşuna veriyorsun (bu ikinci işlem). Sonucu bulmak için önce marketteki işlemi, sonra evdeki işlemi sırayla uygularsın; sırayı değiştirirsen sonuç değişir.","yontemler":"Önce iç fonksiyon (g) belirtilen sayıda hesaplanır, çıkan değer dış fonksiyonun (f) kuralında yerine yazılır.","nedir":"Bileşke fonksiyon, bir fonksiyonun çıktısını başka bir fonksiyona girdi yapmaktır. Sınav bu sırayı doğru uygulayıp uygulamadığını ölçer."},"olay":"g(2) = 2-1 = 1; f(1) = 2(1)+3 = 5.","tuzak":{"C":{"ad":"Sıra Tuzağı","metin":"Bileşkeyi ters sırada uygulayıp (g∘f)(2)\u0027yi hesaplarsın, yani önce f(2)\u0027yi bulup sonucu g\u0027ye yazarsın. Doğrusu: f∘g yazıldığında önce g uygulanır, f∘g ile g∘f genelde birbirinden farklıdır."},"E":{"ad":"İşaret Tuzağı","metin":"g(x) = x-1 kuralındaki işareti karıştırıp g(2)\u0027yi x+1 gibi hesaplarsın. Doğrusu: g(x) = x-1 kuralı harfiyen uygulanmalı, g(2) = 2-1 = 1\u0027dir."},"D":{"ad":"Çarpım Tuzağı","metin":"Bileşkeyi f(2) ile g(2) değerlerinin çarpımı sanırsın. Doğrusu: bileşke fonksiyon iki fonksiyonun çarpımı değil, birinin çıktısının diğerine girdi olmasıdır."},"A":{"ad":"Katsayı Atlama Tuzağı","metin":"f fonksiyonundaki 2 çarpanını unutup doğrudan g(2)+3 hesaplarsın. Doğrusu: f(g(x)) yazılırken g(x) değeri f(x)=2x+3 kuralının x\u0027ine tam olarak yazılmalı, adım atlanmaz."}},"celdiriciYol":{"C":"(g∘f)(2) = g(f(2)) = g(7) = 7 - 1 = 6 (bileşke sırasını ters uygulama)","E":"g(2) = 2 + 1 = 3, f(3) = 2(3)+3 = 9 (g kuralında işaret hatası)","D":"f(2) × g(2) = 7 × 1 = 7 (bileşkeyi çarpım sanma)","A":"g(2) + 3 = 1 + 3 = 4 (f\u0027nin 2 katsayısını atlama)"},"hap":"(f∘g)(x) = f(g(x)) demektir: önce g uygulanır, çıkan sonuç f\u0027ye yazılır; sıra ve kural değiştirilmez.","teshis":{"C":{"gercek":"Genel olarak f∘g ≠ g∘f\u0027dir; f∘g yazıldığında mutlaka önce g, sonra f uygulanır.","ayirt":"Soruda f∘g mi g∘f mi yazıyor, hangisini önce uyguladım?","paragraf":"Bileşke Fonksiyon - Sıra Kuralı","yanilgi":"f∘g ile g∘f\u0027nin aynı sonucu vereceğini, sırayı önemsemeden istediğin fonksiyonu önce uygulayabileceğini sanıyorsun."},"E":{"gercek":"Fonksiyon kuralı harfiyen uygulanır; g(x) = x-1 ise g(2) = 2-1 = 1 olmalıdır.","ayirt":"g(x) kuralındaki işareti doğru mu yazdım?","paragraf":"Fonksiyon Kuralının Uygulanması","yanilgi":"g(x) = x-1 kuralını hızlı okurken işareti ters çevirip x+1 gibi uyguluyorsun."},"A":{"gercek":"f(g(x)) ifadesinde g(x) değeri f\u0027nin kuralındaki HER x yerine tam olarak yazılır, hiçbir terim atlanmaz.","ayirt":"g(2) değerini f(x)=2x+3 kuralının x\u0027ine gerçekten yazdım mı?","paragraf":"Bileşke Fonksiyon - Çözüm Adımı 1","yanilgi":"Bileşke alırken f\u0027nin sabit terimini korurum ama çarpanını atlayabilirim sanıyorsun."},"D":{"gercek":"Bileşke fonksiyon bir çıktının başka fonksiyona girdi olmasıdır, iki değerin çarpımı değildir.","ayirt":"f(g(2)) mi yazdım yoksa f(2) ile g(2)\u0027yi mi çarptım?","paragraf":"Bileşke Fonksiyon Tanımı","yanilgi":"Bileşke işaretini (∘) çarpma işlemiyle karıştırıp iki fonksiyon değerini çarpıyorsun."},"B":{"gercek":"(f∘g)(x) = f(g(x)) tanımıyla önce g uygulanır, sonucu f alır; sıra kuralın kendisidir.","ayirt":"Önce hangi fonksiyonu uyguladım, g mi f mi?","paragraf":"Bileşke Fonksiyon Tanımı - (f∘g)(x) = f(g(x))","yanilgi":"Bu şıkkı eleyen öğrenci bileşkede sıranın önemsiz olduğunu, doğrudan işlem yapılabileceğini düşünür."}},"verilen":[[1,1],[2,1],[3,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 12"},"kural":"(f∘g) ve g biliniyorsa g(x)=t denip x, t cinsinden çözülür, bu ifade f(g(x))\u0027teki x\u0027lerin yerine yazılıp sadeleştirilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 12","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"f∘g verilip f sorulan sorularda ilk iş g(x)=t deyip x\u0027i t cinsinden ifade etmektir, aksi halde ters çevirme adımı atlanır.","konu":"bileşke fonksiyon","tablo":{"satirlar":[["VERİLENLER","-"],["g(x)","3x - 2"],["(f∘g)(x)","9x² - 12x + 8"],["HESAP","-"],["X\u0027i t cinsinden yazma","X=(t+2)/3"],["X\u0027i f(g(x)) ifadesinde yerine koyma","(t+2)²-4(t+2)+8"],["Sadeleştirme","T²+4t+4-4t-8+8 = t²+4"],["F fonksiyonunun kuralı","F(x)=x²+4"],["F(2)","8"]],"basliklar":["Adım","İşlem/Sonuç"]},"siklar":{"C":"16","E":"40","A":"0","D":"20","B":"8"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Bileşkeyi çıkarma işlemiyle bölüyorsa 9x²−15x+10 elde edip f(2) = 16 bulur; ama f ancak t dönüşümüyle bulunur.","E":"Bölmeyi yanlış dağıtırsa x = t/3+2 olarak yazıp t²+8t+20 elde edip f(2) = 40 bulur; (t+2) tamamı paydaya bölünmeli.","D":"Dönüşümü atlayıp doğrudan f(t) = 9t²−12t+8 olarak alırsa f(2) = 20 çıkar; ama x = (t+2)/3 yerine yazılmalı.","A":"Kare açılımda çapraz çarpım atlanırsa (t+2)² yerine yanlış t²+4 yazılır ve f(t) = t²−4t+4 bulunur; f(2) = 0 çıkar."},"dogru":"g(x) = 3x − 2\u0027yi t olarak adlandırıp x\u0027i t cinsinden buluruz: x = (t+2)/3. Bileşke fonksiyonda x yerine bu ifadeyi yazıp sadeleştirirsek f(t) = t² + 4 çıkar. Sonra f(2) = 4 + 4 = 8 bulunur.","sinav":"Bileşke fonksiyon tanımında, (f∘g) ve g biliniyorsa g(x) = t dönüşümüyle x\u0027i t cinsinden çözüp (f∘g)(x) ifadesinde yerini yazarak f bulunur.","kavramlar":[{"kaynak":"TEORI","tanim":"Bir fonksiyonun çıktısının başka bir fonksiyona girdi olması; (f∘g)(x) = f(g(x)) biçiminde yazılır ve önce g uygulanır, sonra f uygulanır.","ad":"Bileşke fonksiyon"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Adım","İşlem/Sonuç"],"satirlar":[["X\u0027i t cinsinden yazma","X=(t-1)/2"],["X\u0027i f(g(x)) ifadesinde yerine koyma","(t-1)²+2(t-1)+7"],["Sadeleştirme","T²-2t+1+2t-2+7 = t²+6"],["F fonksiyonunun kuralı","F(x)=x²+6"],["F(3)","15"]]},"tur":"tablo","soru":"g(x) = 2x + 1 ve (f∘g)(x) = 4x² + 4x + 7 olduğuna göre, f(3) kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve f(3)\u0027ün kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"g(x) = 3x - 2 ve (f∘g)(x) = 9x² - 12x + 8 olduğuna göre, f(2) kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-11","verilenler":[{"deger":"3x - 2","anlam":"İç fonksiyon kuralı, x=(t+2)/3 çözümünde kullanılır.","ad":"g(x)"},{"deger":"9x² - 12x + 8","anlam":"Bileşke fonksiyonun kuralı, f(x)\u0027in bulunmasında x yerine (t+2)/3 yazılacak ifadedir.","ad":"(f∘g)(x)"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Bileşke Fonksiyon, Çözüm Adımı (3)","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: g(x) = 3x - 2 (soruda verilen); (f∘g)(x) = 9x² - 12x + 8 (soruda verilen); istenen f(2)","anlatim":"Soru bize şunları vermiş: g(x) = 3x - 2 ve (f∘g)(x) = 9x² - 12x + 8. İstenen: f(2) değeri.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"(f∘g)(x) = f(g(x)) = 9x² - 12x + 8 (soruda verilen)","anlatim":"Bileşke fonksiyon nedir? f(g(x)) demek, önce g işletilir sonra çıkan sonuç f\u0027e sokulur. Burada f\u0027i tek başına bilmiyoruz, bileşkeden çekip çıkaracağız.","doldur":[]},{"formul":"t = g(x) = 3x - 2 (soruda verilen) → x = (t + 2) / 3","anlatim":"g(x) yerine t diyoruz, çünkü f\u0027in kuralını x değil t cinsinden görmek istiyoruz. Şimdi x\u0027i t cinsinden yalnız bırakıyoruz.","doldur":[[4,1]]},{"formul":"9x² - 12x + 8 = 9 × ((t + 2) / 3)² - 12 × (t + 2) / 3 + 8 = (t + 2)² - 4(t + 2) + 8","anlatim":"Bulduğumuz x ifadesini bileşke formülündeki her x yerine yazıyoruz. Amaç, ifadeyi tamamen t cinsinden görmek.","doldur":[]},{"formul":"(t + 2)² - 4(t + 2) + 8 = t² + 4t + 4 - 4t - 8 + 8 = t² + 4","anlatim":"Parantezleri açıp terimleri sadeleştiriyoruz, dikkat: -4t ile +4t birbirini götürüyor. Bu adım sadece cebirsel sadeleştirme.","doldur":[[6,1]]},{"formul":"f fonksiyonunun kuralı: f(x) = x² + 4","anlatim":"Şimdi ifade sadece t içeriyor ve bu aslında f fonksiyonunun kuralı. T yerine x yazarsak f(x) kuralını elde ederiz.","doldur":[[7,1]]},{"formul":"f(2) = 2² + 4 = 4 + 4 = 8","anlatim":"Artık f\u0027in kuralı elimizde, istenen f(2) değerini bulmak için 2\u0027yi x yerine yazıyoruz. Bu adım sonuç adımıdır.","doldur":[]},{"formul":"SONUÇ: f(2) = 8 (5. adımda bulduk)","anlatim":"Sonuç: f(2) = 8 bulunur, tablo tamamlandı.","doldur":[]},{"formul":"Ters durum: (g∘f)(x) verilseydi → g(f(x)) kurulur, x=t dönüşümü f için yapılır","anlatim":"Ters durum: eğer bileşke fonksiyon g∘f olarak verilseydi, bu kez t = f(x) değil t = g(x) değişimi işe yaramazdı. O zaman f(x) doğrudan x yerine yazılıp g uygulanmalıydı.","doldur":[]},{"formul":"Yanlış yol: x = t/3 - 2 (HATALI) → doğrusu x = (t + 2) / 3 (1. adımda bulduk)","anlatim":"En sık hata: öğrenci x = (t+2)/3 yerine yanlışlıkla x = t/3 - 2 yazar, işaret ve sırayı karıştırır. Bu, doğru sonuca değil yanlış bir f kuralına götürür.","doldur":[]}],"anahtar":[{"ornek":"yerine","kok":"yerine"},{"ornek":"cinsinden","kok":"cinsin"},{"ornek":"kuralını","kok":"kuralı"},{"ornek":"bileşke","kok":"bileşk"},{"ornek":"sadeleştirilir","kok":"sadele"},{"ornek":"fonksiyon","kok":"fonksi"}],"konuGiris":{"harita":"Ne zaman test edilir: f∘g ve g verilip f istendiğinde ya da doğrudan (f∘g)(a) hesaplanırken. Nasıl ölçülür: g(x)=t dönüşümüyle x\u0027i t cinsinden bulup f(t)\u0027yi elde etme becerisiyle. Nasıl kaydedilir: bulunan f(t) kuralına istenen sayı yazılıp tek bir sayısal sonuç yazılır.","desen":"Sınav genelde f∘g ve g\u0027yi verip f\u0027yi istettirir; öğrenci sırayı ters kurup f(2)·g(2) gibi çarpım hatasına düşer. Bazı dönemlerde doğrudan sayısal değer sorulur, kural yazmak gerekmez. Bu soru g(x)=t dönüşümüyle f kuralını bulma noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Önce g sonra f uygulanarak elde edilen yeni fonksiyon kuralı","ad":"Bileşke fonksiyon (f∘g)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"x\u0027i t cinsinden çözmek için kullanılan değişken değiştirme yöntemi","ad":"g(x)=t dönüşümü","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"t cinsinden yazılan, f fonksiyonunun asıl ifadesi","ad":"f(t) kuralı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Bulunan f kuralına 2 yazılarak elde edilen sayısal sonuç","ad":"f(2) değeri","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"g(x) ve (f∘g)(x) verilip belirli bir noktadaki f değeri istenir.","panel_ornek":"Bir kargo şirketi önce paketin ağırlığını ölçüyor, sonra bu ağırlığa göre fiyat hesaplıyor: ağırlık 2 kg ise fiyat 2 kg\u0027ın karesi artı 8 lira, yani 12 lira çıkıyor. Burada önce ölçüm sonucu, sonra o sonuç fiyat kuralına giriyor.","ornek":"Bir kargo şirketi önce paketin ağırlığını ölçüyor, sonra bu ağırlığa göre fiyat hesaplıyor: ağırlık 2 kg ise fiyat 2 kg\u0027ın karesi artı 8 lira, yani 12 lira çıkıyor. Burada önce ölçüm sonucu, sonra o sonuç fiyat kuralına giriyor.","yontemler":"g(x)=t denip x, t cinsinden çözülür; bulunan x, (f∘g)(x) ifadesinde yerine yazılarak f(t) kuralı elde edilir, sonra istenen sayı yerine konur.","nedir":"Bileşke fonksiyon, bir fonksiyonun çıktısını başka bir fonksiyona girdi yapma işlemidir. Sınav bu sırayı doğru kurup ters çevirebilme becerini ölçer."},"olay":"t=3x-2 → x=(t+2)/3; 9x²-12x+8 yerine yazılınca (t+2)²-4(t+2)+8 = t²+4t+4-4t-8+8 = t²+4; f(x)=x²+4; f(2)=4+4=8.","tuzak":{"C":{"ad":"Ters İşlem Tuzağı","metin":"f\u0027yi bulmak için (f∘g)(x)\u0027ten g(x)\u0027i çıkarıp f=(f∘g)-g sanırsan 9x²-15x+10 elde edip f(2)=16 bulursun. Doğrusu: f, ancak g(x)=t dönüşümüyle x\u0027i t cinsinden yazıp yerine koyarak bulunur."},"E":{"ad":"Parantez Tuzağı","metin":"x=(t+2)/3 ifadesini x=t/3+2 şeklinde eksik parantezle yazarsan t²+8t+20 elde edip f(2)=40 bulursun. Doğrusu: bölme işlemi paydadaki tüm terime (t+2) uygulanmalıdır."},"D":{"ad":"Dönüşüm Atlama Tuzağı","metin":"g(x)=t denklemini x için çözmeyi atlayıp t=x sanarsan f(t)=9t²-12t+8 direkt f(x) olur, f(2)=20 çıkar. Doğrusu: t=3x-2\u0027den x=(t+2)/3 bulunup bu ifade x yerine yazılmalıdır."},"A":{"ad":"Kare Açılımı Tuzağı","metin":"(t+2)² ifadesini çapraz çarpımı atlayarak t²+4 sanırsan f(t)=t²-4t+4 çıkar, f(2)=4-8+4=0 bulursun. Doğrusu: (t+2)²=t²+4t+4 açılmalı, sonuç f(x)=x²+4, f(2)=8\u0027dir."}},"celdiriciYol":{"C":"f(x)=(9x²-12x+8)-(3x-2)=9x²-15x+10, f(2)=9*4-15*2+10=36-30+10 = 16 (f=(f∘g)-g mantık hatası)","E":"x=(t+2)/3 yerine x=t/3+2 yazılırsa t²+8t+20, f(2)=4+16+20 = 40 (parantez hatası)","D":"f(t)=9t²-12t+8 sanılır (t=x alınır), f(2)=9*4-12*2+8=36-24+8 = 20 (ters çevirme adımı atlandı)","A":"(t+2)²=t²+4 alınırsa t²+4-4t-8+8=t²-4t+4, f(2)=4-8+4 = 0 (kare açılımında orta terim atlandı)"},"hap":"f∘g ve g biliniyorken f istenirse g(x)=t denir, x bu ifadeden t cinsinden çözülüp f(g(x))\u0027teki x\u0027lerin yerine yazılır.","teshis":{"C":{"gercek":"Bileşke fonksiyon toplama/çıkarma değil, iç içe uygulamadır; f ancak g(x)=t dönüşümüyle bulunur.","ayirt":"f∘g bir işlem zinciri mi, yoksa toplanabilir iki fonksiyon mu?","paragraf":"Bileşke fonksiyon tanımı - (f∘g)(x)=f(g(x))","yanilgi":"f fonksiyonunu, bileşkeden g\u0027yi çıkararak bulabileceğini sanıyorsun."},"E":{"gercek":"x=(t+2)/3 ifadesinde bölme hem t\u0027ye hem 2\u0027ye uygulanır, x=t/3+2 yanlıştır.","ayirt":"Bölme işlemini parantezin tamamına mı uyguladım?","paragraf":"Cebirsel işlem kuralları - kesir sadeleştirme","yanilgi":"Kesirli ifadede bölmenin parantezdeki her terime uygulanması gerektiğini atlıyorsun."},"A":{"gercek":"(t+2)² = t²+4t+4\u0027tür, orta terim atlanamaz; bu cebirsel özdeşliktir.","ayirt":"İki terimli bir ifadeyi karesini alırken orta çarpımı yazdım mı?","paragraf":"Cebirsel özdeşlikler - kare açılımı","yanilgi":"Kare açılımında çapraz çarpım terimini yok sayılabilir sanıyorsun."},"D":{"gercek":"f\u0027yi bulmak için mutlaka x=t cinsinden çözülüp f(g(x)) ifadesindeki x yerine bu ifade yazılır.","ayirt":"t=g(x) dedikten sonra x\u0027i t cinsinden yazdım mı?","paragraf":"Bileşke fonksiyondan asıl fonksiyonu bulma yöntemi","yanilgi":"g(x)=t denip x\u0027in t cinsinden yazılması adımını atlayıp t\u0027yi doğrudan x sanıyorsun."},"B":{"gercek":"g(x)=t → x=(t+2)/3 dönüşümüyle f(g(x)) ifadesindeki x\u0027ler yerine yazılıp doğru sadeleştirilirse f(x)=x²+4 bulunur.","ayirt":"Her ara adımı bir öncekinin sonucuyla kontrol ettim mi?","paragraf":"Bileşke fonksiyondan asıl fonksiyonu bulma yöntemi","yanilgi":"Bu şıkkı eleyen öğrenci ara adımlardan birinde (dönüşüm, açılım ya da yerine koyma) hata yaptığı için farklı bir sonuca ulaşmıştır."}},"verilen":[[1,1],[2,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 12"},"kural":"(f∘g)(x)=f(g(x)) olduğundan t=g(x) yazılıp x, t cinsinden çözülür ve f∘g formülüne yerleştirilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 12","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":1},"kayit":[],"teori":true,"taktik":"Ters bileşke sorularında önce t=g(x) yaz, x\u0027i t cinsinden çöz, sonra f(t)\u0027yi bul; soruda geçen ekstra fonksiyona bakma.","konu":"bileşke fonksiyon","tablo":{"satirlar":[["VERİLENLER","-","-"],["f∘g(x) kuralı","4x + 7","-"],["g(x) kuralı","2x + 3","-"],["h(x) kuralı","3x - 2","-"],["istenen girdi","5","-"],["HESAP","-","-"],["T=g(x) dönüşümü","T = 2x + 3 → x = (t-3)/2","X çözümü"],["F∘g formülüne yerleştirme","F(t) = 4*(t-3)/2 + 7","İfade kuruldu"],["Sadeleştirme","F(t) = 2(t-3) + 7 = 2t + 1","F(x) = 2x + 1"],["F(5) hesabı","F(5) = 2*5 + 1","11"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"15","E":"27","A":"11","D":"23","B":"13"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"x = (t−3)/2 dönüşümünde paydadaki 2\u0027ye bölmeyi atladığında 4(t−3) + 7 = 4t − 5 gibi hesaplarsın; doğru sırada bölme yapılmalı, sonuç 2t + 1 olur.","E":"(f∘g)(x) = 4x + 7 kuralını f(x)\u0027in kendisi sanarak doğrudan f(5) = 4·5 + 7 = 27 hesaplarsın; bu kural bileşkedir, f(x) önce g(x) = t yöntemiyle türetilmelidir.","D":"t = 2x + 3 denkleminde 3\u0027ü karşı tarafa geçirirken işaret değiştirmeyip x = (t+3)/2 yazarsın; terim aktarılırken işaret değişmesi zorunludur.","B":"h(x) = 3x − 2 fonksiyonunu f(x) ile karıştırıp h(5) = 13\u0027ü seçmek cazip gelir; ancak h(x) soruda bileşke hesabına hiç girmez, konu dışı verilmiş tuzaklardır."},"dogru":"Bileşke fonksiyonun tanımından hareket et: (f∘g)(x) = f(g(x)). g(x) = 2x + 3\u0027ü t olarak yaz, x\u0027i t cinsinden çöz: x = (t−3)/2. Bunu (f∘g)(x) = 4x + 7\u0027ye yerleştir: f(t) = 4·(t−3)/2 + 7 = 2t + 1. Sonuç: f(5) = 11.","sinav":"Bileşke fonksiyon tanımı (f∘g)(x) = f(g(x)) ve ters dönüşüm yöntemi kullanılarak f(x) kuralı bulunur.","kavramlar":[{"kaynak":"TEORI","tanim":"Bir fonksiyonun çıktısının başka bir fonksiyona girdi olarak kullanılmasıdır. (f∘g)(x) = f(g(x)) biçiminde yazılır; önce g uygulanır, sonra f uygulanır.","ad":"Bileşke fonksiyon"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,2],[2,1],[2,2],[3,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["T=g(x) dönüşümü","T = 3x + 2 → x = (t-2)/3","X çözümü"],["F∘g formülüne yerleştirme","F(t) = 6*(t-2)/3 + 11","İfade kuruldu"],["Sadeleştirme","F(t) = 2(t-2) + 11 = 2t + 7","F(x) = 2x + 7"],["F(4) hesabı","F(4) = 2*4 + 7","15"]]},"tur":"tablo","soru":"f(x) ve g(x) = 3x + 2 fonksiyonları tanımlıdır. Ayrıca h(x) = 4x - 1 fonksiyonu verilmiştir. (f∘g)(x) = 6x + 11 olduğuna göre f(4) kaçtır?","verilen":[[0,1],[1,1],[3,1]],"hedef":"Tabloyu doldur ve f(4)\u0027ün kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f(x) ve g(x) = 2x + 3 fonksiyonları tanımlıdır. Ayrıca h(x) = 3x - 2 fonksiyonu verilmiştir. (f∘g)(x) = 4x + 7 olduğuna göre f(5) kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-11","verilenler":[{"deger":"4x + 7","anlam":"f ile g bileşkesinin x\u0027e bağlı kuralı; f fonksiyonunu bulmak için kullanılır","ad":"f∘g(x) kuralı"},{"deger":"2x + 3","anlam":"bileşkede önce uygulanan iç fonksiyon; t = g(x) dönüşümünde kullanılır","ad":"g(x) kuralı"},{"deger":"3x - 2","anlam":"soruda verilen ama f∘g hesabına hiç girmeyen çeldirici fonksiyon","ad":"h(x) kuralı"},{"deger":"5","anlam":"f fonksiyonunun kuralı bulunduktan sonra bu değer için f(5) hesaplanacaktır","ad":"istenen girdi"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu, Bileşke Fonksiyon Konusu","dogru":"A","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: g(x) = 2x + 3 (soruda verilen); h(x) = 3x - 2 (soruda verilen, kullanılmayacak); (f∘g)(x) = 4x + 7 (soruda verilen); istenen: f(5)","anlatim":"Soru bize şunları vermiş: g(x) = 2x + 3, h(x) = 3x - 2 (bu soruda kullanılmıyor) ve (f∘g)(x) = 4x + 7. İstenen f(5) değeri.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"(f∘g)(x) = f(g(x))","anlatim":"(f∘g)(x) bileşke fonksiyondur, f(g(x)) demektir - önce g işler, çıkan sonucu f işler. f\u0027in kendi kuralını bulmak için g\u0027nin çıktısını x gibi bir değişken yapıp tersine gitmemiz gerekir.","doldur":[]},{"formul":"t = g(x) = 2x + 3 (soruda verilen) → x = (t - 3) / 2","anlatim":"g(x)\u0027in sonucuna t dersek t = 2x + 3 olur, buradan x\u0027i t\u0027ye göre yalnız bırakırız. Böylece f\u0027in içine hangi x\u0027i koyacağımızı t üzerinden yazabiliriz.","doldur":[]},{"formul":"f(t) = 4x + 7 = 4 × (t - 3) / 2 + 7","anlatim":"f(t) aslında f(g(x)) demek, yani 4x + 7 ifadesindeki x\u0027in yerine bulduğumuz (t-3)/2\u0027yi koyarız. Dikkat: t\u0027yi doğrudan 4t + 7\u0027ye koymak yanlış olur, çünkü 4x+7 içindeki x, t değil.","doldur":[]},{"formul":"f(t) = 4 × (t - 3) / 2 + 7 = 2 × (t - 3) + 7 = 2t - 6 + 7 = 2t + 1","anlatim":"Şimdi ifadeyi sadeleştiriyoruz, 4 ile 2 sadeleşir ve parantez açılır. Sonunda f\u0027in genel kuralı t cinsinden ortaya çıkar.","doldur":[]},{"formul":"f(5) = 2 × 5 + 1 = 11","anlatim":"f\u0027in kuralını bulduk, artık t yerine 5 koyup f(5)\u0027i hesaplarız. Değişken ismi t ya da x olması önemli değil, kural aynı kural.","doldur":[]},{"formul":"Ters durum: (g∘f)(x) verilse → t = f(x) yazılır, g formülüne yerleştirilir","anlatim":"Ters durumda soru (f∘g)(x) yerine (g∘f)(x) verseydi, bu kez t=f(x) yazıp g\u0027nin içine x=(t-3)/2 koyacaktık - yön değişince hangi fonksiyonun içine yerleştirdiğimiz de değişir.","doldur":[[7,1],[7,2]]},{"formul":"Yanlış yol: f(5) = 4 × 5 + 7 = 27 (HATALI) → doğrusu f(5) = 11 (6. adımda bulduk)","anlatim":"En sık hata: t=5\u0027i doğrudan 4x+7\u0027nin içine x gibi koyup 4×5+7=27 (HATALI) demek - t, x değildir, önce x=(t-3)/2 bulunmalı.","doldur":[]}],"anahtar":[{"ornek":"yerine","kok":"yerine"},{"ornek":"kuralını","kok":"kuralı"},{"ornek":"cinsinden","kok":"cinsin"},{"ornek":"değişken","kok":"değişk"},{"ornek":"doğrudan","kok":"doğrud"},{"ornek":"değişince","kok":"değişi"}],"konuGiris":{"harita":"Ne zaman kurulur: iki fonksiyonun biri diğerinin çıktısını girdi olarak aldığında bileşke kurulur. Nasıl çözülür: verilen bileşke ifadesi ile bilinen fonksiyon eşitlenip bilinmeyen fonksiyon değişken değiştirerek çözülür. Nasıl kontrol edilir: bulunan fonksiyon, bilinenin içine yazılıp bileşke sonucu sağlanarak doğrulanır.","desen":"Sınav genelde (f∘g)(x) verip f\u0027yi veya g\u0027yi bilinmeyen bırakır, öğrenci sırayı karıştırırsa yanlış kurar. Bazı sorularda h(x) gibi fazladan fonksiyon verilerek dikkat dağıtılır ve kullanılmayabilir. Bu soru, bileşkeden geriye giderek bilinmeyen fonksiyonu bulma noktasından geliyor (p.28).","terimler":[{"kaynak":"soruda verilir","tanim":"önce g sonra f uygulanarak elde edilen bileşke kural","ad":"(f∘g)(x)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"bileşkede önce işleyen iç fonksiyon","ad":"g(x)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"bileşkede sonra işleyen, çoğu zaman bilinmeyen dış fonksiyon","ad":"f(x)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"g(x)=t denip x\u0027in t cinsinden yazılması yöntemi","ad":"t değişimi","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"g(x) ve (f∘g)(x) kuralı verilir, f(x) kuralı bulunup istenen değerde hesaplanması istenir.","panel_ornek":"Bir kargo ücreti önce ağırlığa göre hesaplanır, sonra çıkan tutara sabit 4 lira hizmet bedeli eklenir. Yani sonuç, ağırlık kuralının çıktısının ikinci kurala girdi olmasıyla bulunur. Sıra değişirse sonuç da değişir, önce ağırlık sonra hizmet bedeli işlenir.","ornek":"Bir kargo ücreti önce ağırlığa göre hesaplanır, sonra çıkan tutara sabit 4 lira hizmet bedeli eklenir. Yani sonuç, ağırlık kuralının çıktısının ikinci kurala girdi olmasıyla bulunur. Sıra değişirse sonuç da değişir, önce ağırlık sonra hizmet bedeli işlenir.","yontemler":"g(x)=t denip x, t cinsinden yazılır; bu x, (f∘g)(x) ifadesinde yerine konarak f(t) kuralı elde edilir. h(x) gibi soruda kullanılmayan fonksiyonlara aldanmamak gerekir.","nedir":"Bileşke fonksiyon, bir fonksiyonun çıktısını başka bir fonksiyona girdi yaparak iki işlemi tek kuralda birleştirmektir. Sınav, sırayı doğru uygulayıp bilinmeyen fonksiyonu tersine çözebilme becerini ölçer."},"olay":"t=2x+3 → x=(t-3)/2; f(t)=4*(t-3)/2+7=2(t-3)+7=2t+1; f(5)=2*5+1=11.","tuzak":{"C":{"ad":"Bölme Atlama Tuzağı","metin":"x=(t-3)/2 ifadesini f∘g formülüne yazarken paydadaki 2\u0027ye bölmeyi unutup 4(t-3)+7 ile işlem yaparsın. Doğrusu: 4 ile çarpımdan önce (t-3) ifadesi 2\u0027ye bölünmelidir, sonuç 2t+1\u0027dir."},"E":{"ad":"Bileşkeyi Fonksiyon Sanma Tuzağı","metin":"(f∘g)(x)=4x+7 kuralını f(x)\u0027in kendisi sanıp doğrudan x=5\u0027i bu formüle yazarsın. Doğrusu: bu kural f ile g\u0027nin bileşkesidir, f(x) bulmak için g(x)=t dönüşümü şarttır."},"D":{"ad":"İşaret Hatası Tuzağı","metin":"t=2x+3 denkleminden x\u0027i çözerken 3\u0027ü karşı tarafa geçirirken işaretini değiştirmeyi unutup x=(t+3)/2 yazarsın. Doğrusu: x=(t-3)/2\u0027dir, terim taşınırken işaret değişmelidir."},"B":{"ad":"Çeldirici Verilen Tuzağı","metin":"soruda geçen h(x)=3x-2\u0027yi f(x) ile karıştırıp doğrudan h(5)\u0027i hesaplarsın. Doğrusu: h(x) bu bileşke hesabına hiç girmez, f(x) yalnız f∘g ve g\u0027den türetilir."}},"celdiriciYol":{"C":"f(t) = 4(t-3) + 7 = 4t-5 → f(5) = 4*5-5 = 15 (bölme adımını atlama)","E":"(f∘g)(5) = 4*5+7 = 27 (bileşkeyi doğrudan f sanma)","D":"x=(t+3)/2 ile f(t) = 4*(t+3)/2+7 = 2t+13 → f(5) = 2*5+13 = 23 (işaret hatası)","B":"h(5) = 3*5 - 2 = 13 (çeldirici verilen h(x)\u0027i f(x) sanma)"},"hap":"(f∘g)(x)\u0027ten f(x)\u0027i bulmak için g(x)=t dönüşümü yapılır, x t cinsinden çözülüp yerine yazılır.","teshis":{"C":{"gercek":"f(t)=4*(t-3)/2+7=2t+1\u0027dir; 4 ile çarpımdan önce 2\u0027ye bölme adımı atlanamaz.","ayirt":"kesirli ifadeyi sadeleştirirken bölme işlemini unuttum mu?","paragraf":"Çözüm Adımı 2","yanilgi":"x=(t-3)/2 ifadesini f∘g formülüne yazarken bölmeyi unutup çarpımı direkt (t-3) ile yaparsın"},"E":{"gercek":"(f∘g)(x), f\u0027nin kendisi değil bileşke sonucudur; f(x) bulmak için g(x)=t dönüşümü şarttır.","ayirt":"bu formül f\u0027nin mi yoksa f ile g\u0027nin bileşkesinin mi kuralı?","paragraf":"Sınav Tuzağı 4","yanilgi":"(f∘g)(x) kuralını f(x) kuralıyla aynı sanıp doğrudan x=5 yazarsın"},"A":{"gercek":"f∘g(x)=4x+7 ve g(x)=2x+3 iken t=g(x) dönüşümüyle f(t)=2t+1 bulunur, f(5)=11\u0027dir.","ayirt":"f\u0027yi bulmadan doğrudan f∘g formülüne mi girdim?","paragraf":"Çözüm Adımı 3","yanilgi":"f∘g formülünü doğrudan f fonksiyonu sanıp bileşke bulmadan f(5)\u0027i hesapladığını düşünürsün"},"D":{"gercek":"t=2x+3 → x=(t-3)/2\u0027dir, 3 terimi eşitliğin diğer tarafına geçerken işareti değişir.","ayirt":"terimi karşı tarafa geçirirken işaretini değiştirdim mi?","paragraf":"Çözüm Adımı 1","yanilgi":"t=2x+3\u0027ten x\u0027i çözerken işaret hatası yapıp x=(t+3)/2 yazarsın"},"B":{"gercek":"h(x) soruda f∘g hesabına hiç girmeyen çeldirici bir fonksiyondur, f(x) yalnız f∘g ve g\u0027den türetilir.","ayirt":"bu fonksiyon soruda gerçekten hangi işlemde kullanılıyor?","paragraf":"Çeldirici Verilen","yanilgi":"soruda geçen h(x)\u0027i f(x) sanıp doğrudan h(5)\u0027i hesaplarsın"}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 13"},"kural":"x^3-8=(x-2)(x^2+2x+4) ve x^2-2x=x(x-2) çarpanlarına ayrılır, (x-2) ortak çarpanı sadeleşir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 13","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce pay ve paydayi ayri ayri carpanlarina ayir, sadelestirmeyi en son yap; sayisal değeri sadelesmis ifadede hesapla.","konu":"cebirsel sadelestirme","tablo":{"satirlar":[["VERİLENLER","-"],["küp sabiti","8"],["tanım kısıtı","x ≠ 0 ve x ≠ 2"],["hesaplanacak nokta","x = 4"],["HESAP","-"],["Pay çarpanlara ayrılır","X^3-8=(x-2)(x^2+2x+4)"],["Payda çarpanlara ayrılır","X^2-2x=x(x-2)"],["Sadelestirme","A(x)=(x^2+2x+4)/x"],["X=4 için değer","A(4)=(16+8+4)/4=28/4"],["Sonuç","7"]],"basliklar":["Adım","İslem/Sonuç"]},"siklar":{"C":"7","E":"14","A":"3","D":"9","B":"4"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Küp farkının ikinci çarpanını (x²+2x+4) yanlışlıkla tam kare biçimine çevirirseniz (x²+4x+4) A(4) = (16+16+4)/4 = 9 bulursunuz. İkinci çarpanın orta terimi x katsayısının iki katıdır (2·2 = 4 değil, 2·1 = 2).","E":"Paydayı x(x−2) yerine sadece (x−2) alırsanız sadeleştirme sonrası payda tamamen yok olur ve A(4) = (16+8+4)/1 = 28 yazarsınız. Payda da x çarpanını içerdiğinden sadeleştirmeden sonra x kalır.","A":"Küp farkı özdeşliğinin orta terimini yanlış alırsanız (x²−2x+4 yerine x²+2x+4 yazarsanız) A(4) = 12/4 = 3 çıkar. Özdeşlikte orta terim daima +ab (yani +2x) olmalıdır.","B":"Payı ve paydayı çarpanlarına ayırmadan doğrudan en yüksek dereceli terimleri sadeleştirirseniz (x³\u0027ü x²\u0027ye bölerseniz) x bulup A(4) = 4 yazarsınız. Sadeleştirme yalnız çarpanlar arasında geçerlidir."},"dogru":"Payı küp farkı özdeşliğiyle (x−2)(x²+2x+4), paydayı ortak çarpanla x(x−2) şeklinde yazarsınız. (x−2) çarpanını sadeleştirdikten sonra A(x) = (x²+2x+4)/x kalır. x=4 yerine koyunca (16+8+4)/4 = 7 bulursunuz.","sinav":"Cebirsel ifadelerde küp farkı özdeşliği a³−b³ = (a−b)(a²+ab+b²) ve ortak çarpan parantezine alma yöntemiyle rasyonel ifade sadeleştirmesi ölçülüyor.","kavramlar":[{"kaynak":"CARPANLARA AYIRMA YOLLARI","tanim":"Bir ifadenin her teriminde ortak olan çarpanı parantez dışına alarak çarpanlara ayırma yöntemi.","ad":"Ortak çarpan parantezine alma"},{"kaynak":"RASYONEL IFADE SADELESTIRME","tanim":"Kesirli ifadelerde pay ve payda ayrı ayrı çarpanlarına ayrılıp ortak çarpanlar yok edilir; sadeleştirme yalnız çarpanlar arasında yapılır.","ad":"Rasyonel ifade sadeleştirmesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[4,1]],"tablo":{"basliklar":["Adım","İslem/Sonuç"],"satirlar":[["Pay çarpanlara ayrılır","y^3-27=(y-3)(y^2+3y+9)"],["Payda çarpanlara ayrılır","y^2-3y=y(y-3)"],["Sadelestirme","B(y)=(y^2+3y+9)/y"],["Y=9 için değer","B(9)=(81+27+9)/9=117/9"],["Sonuç","13"]]},"tur":"tablo","soru":"y ≠ 0 ve y ≠ 3 olmak üzere, B(y) = (y³ - 27) / (y² - 3y) ifadesi önce sadeleştirilecek, sonra y = 9 için değeri hesaplanacaktır. Buna göre B(9) kaçtır?","verilen":[[3,1]],"hedef":"Tabloyu doldur ve B(9)\u0027un kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"x ≠ 0 ve x ≠ 2 olmak üzere, A(x) = (x³ - 8) / (x² - 2x) ifadesi önce sadeleştirilecek, sonra x = 4 için değeri hesaplanacaktır. Buna göre A(4) kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-12","verilenler":[{"deger":"8","anlam":"Payın sabit terimi; x^3-8 küp farkı özdeşliğiyle çarpanlara ayrılırken 2^3=8 olarak kullanılır.","ad":"küp sabiti"},{"deger":"x ≠ 0 ve x ≠ 2","anlam":"Paydayı (x^2-2x) sıfır yapan değerlerdir; sadeleştirmeden sonra da bu kısıt geçerliliğini korur.","ad":"tanım kısıtı"},{"deger":"x = 4","anlam":"Sadeleşmiş ifadenin değerinin hesaplanacağı x değeridir.","ad":"hesaplanacak nokta"}],"dayanak":"TESMER SGS Matematik-Istatistik Ders Notu - Cebirsel Ifadelerde Sadelestirme ve Ozdeslikler (kup farki ozdesligi, ortak carpan parantezine alma, tanim kumesi kisiti)","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: A(x) = (x³ - 8) / (x² - 2x) (soruda verilen); x = 4 (soruda verilen); x ≠ 0 ve x ≠ 2 şartı (soruda verilen)","anlatim":"Soru bize A(x) = (x³ - 8) / (x² - 2x) ifadesini vermiş. İstenen: önce sadeleştirme, sonra x = 4 için değer.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"x³ - 8 = x³ - 2³ = (x - 2)(x² + 2x + 4)","anlatim":"Küp farkı özdeşliği nedir? a³ - b³ = (a - b)(a² + ab + b²) kalıbıdır, burada pay bu kalıba uyar. Payı çarpanlarına ayırınca sadeleşme kapısı açılır.","doldur":[]},{"formul":"x² - 2x = x × (x - 2)","anlatim":"Paydada ortak çarpan parantezine alma yapılır. x² - 2x ifadesinde x ortak, dışarı alınır.","doldur":[[6,1]]},{"formul":"A(x) = (x - 2)(x² + 2x + 4) / (x × (x - 2)) = (x² + 2x + 4) / x","anlatim":"Şimdi biz sadeleştiriyoruz - pay ve paydada (x - 2) ortak çarpan olduğu için sadeleşir. Dikkat: x ≠ 2 şartı zaten bu sadeleşmeyi geçerli kılmak için verilmiş.","doldur":[[8,1]]},{"formul":"A(4) = (x² + 2x + 4) / x = (4² + 2×4 + 4) / 4 (4. adımda bulduk) = (16 + 8 + 4) / 4 = 28 / 4","anlatim":"Şimdi biz x yerine 4 koyuyoruz - sadeleşmiş ifade sayı işlemine hazır hale gelmişti. Önce pay hesaplanır, sonra bölme yapılır.","doldur":[]},{"formul":"A(4) = 28 / 4 = 7","anlatim":"Bölme işlemi tamamlanır ve sonuç bulunur. A(4) değeri 7\u0027dir.","doldur":[[9,1]]},{"formul":"Ters durum: x = 2 olsaydı → A(x) tanımsız (payda sıfır)","anlatim":"Ters durumda: eğer soru A(x) yerine doğrudan x = 2 için değeri sorsaydı, ifade tanımsız olurdu. Çünkü x = 2 sadeleşmeden önce paydayı sıfır yapar.","doldur":[]},{"formul":"Yanlış yol: A(4) = (4³ - 8) / (4² - 2×4) = 56 / 8 = 7 (tesadüfen aynı çıkar ama yöntem HATALI, sadeleştirmeden çözüm istenmemiştir) → doğrusu sadeleştirilmiş A(x) = (x² + 2x + 4) / x kullanılarak A(4) = 7 (6. adımda bulduk)","anlatim":"En sık hata: sadeleştirme yapmadan doğrudan x = 4\u0027ü orijinal ifadeye koyup karmaşık işlem yapmaya çalışmaktır. Doğrusu önce sadeleştirip sonra sayıyı yerine koymaktır.","doldur":[]}],"anahtar":[{"ornek":"sadelestirme","kok":"sadele"},{"ornek":"çarpanlarına","kok":"çarpan"},{"ornek":"yerine","kok":"yerine"},{"ornek":"işlemine","kok":"işlemi"},{"ornek":"ifadesini","kok":"ifades"},{"ornek":"doğrudan","kok":"doğrud"}],"konuGiris":{"harita":"Ne zaman sadeleştirme yapılır: pay ve payda çarpanlarına ayrıldıktan sonra ortak çarpan varsa yapılır. Nasıl hesaplanır: özdeşlikler kullanılarak pay ve payda ayrı ayrı çarpanlarına ayrılır, ortak çarpan atılır, kalan ifadeye sayı yerine konur. Nasıl kontrol edilir: paydayı sıfır yapan orijinal değerler sonuçtan hariç tutulur.","desen":"Bu tip sorularda öğrenci küp farkı özdeşliğini kullanmadan doğrudan sadeleştirmeye çalışır ve hata yapar. İkinci tuzak, sadeleşen ifadenin x=2 için tanımlı görünmesine rağmen orijinal ifadede x≠2 kısıtının hâlâ geçerli olmasıdır. Bu soru, rasyonel ifade sadeleştirme ve tanımsızlık kontrolü noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"pay ve paydayı çarpanlarına ayırmak için kullanılan sabit cebirsel eşitlik","ad":"özdeşlik","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"pay ve paydada aynı anda bulunan ve sadeleştirilebilen çarpan","ad":"ortak çarpan","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"paydayı sıfır yapan değerlerin ifadeden hariç tutulması kuralı","ad":"tanım kümesi kısıtı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"sadeleşmiş ifadede verilen sayıyı x yerine yazıp sonucu bulma işlemi","ad":"yerine koyma","kim":"kanun sabitler"}],"sinavda":"Kesirli bir cebirsel ifade ve belirli bir x değeri verilir, sadeleştirme sonrası ifadenin sayısal değeri istenir.","panel_ornek":"Bir markette 6 kg elmanın fiyatı ile 3 kg elmanın fiyatını karşılaştırırken, ortak birim fiyatı bulup oranı sadeleştirirsin. Örneğin 6 kg elma 30 lira, 3 kg elma 15 lira ise oran 30/15 = 2 olur, yani ikisi de kilosu 5 liradan aynı fiyattandır. Buradaki sadeleştirme, ortak çarpanı (kilo başı fiyatı) bulup gereksiz kısmı atmaktır.","ornek":"Bir markette 6 kg elmanın fiyatı ile 3 kg elmanın fiyatını karşılaştırırken, ortak birim fiyatı bulup oranı sadeleştirirsin. Örneğin 6 kg elma 30 lira, 3 kg elma 15 lira ise oran 30/15 = 2 olur, yani ikisi de kilosu 5 liradan aynı fiyattandır. Buradaki sadeleştirme, ortak çarpanı (kilo başı fiyatı) bulup gereksiz kısmı atmaktır.","yontemler":"Küp farkı özdeşliği a³-b³=(a-b)(a²+ab+b²) ve ortak çarpan parantezine alma kullanılır; en kritik kural, sadeleşen ifadeye sayıyı yerine koymadan önce orijinal tanım kısıtının hâlâ geçerli olduğunu unutmamaktır.","nedir":"Cebirsel sadeleştirme, kesirli bir ifadeyi pay ve paydadaki ortak çarpanları bularak sadeleştirmeyi sağlar. Sınav, çarpanlara ayırma bilgisini ve tanımsızlık kısıtını doğru uygulayıp uygulamadığını ölçer."},"olay":"A(x)=(x^2+2x+4)/x, A(4)=(16+8+4)/4=28/4=7.","tuzak":{"D":{"ad":"Özdeşlik Karıştırma Tuzağı","metin":"Öğrenci küp farkı özdeşliğindeki ikinci çarpanı (x^2+2x+4) yerine tam kare açılımına benzeterek (x^2+4x+4) yazar. Doğrusu: b^2 terimi katlanmaz, doğru ikinci çarpan x^2+2x+4\u0027tür."},"E":{"ad":"Eksik Çarpan Tuzağı","metin":"Öğrenci paydayı x(x-2) yerine sadece (x-2) alır, x çarpanını payda dışında bırakır. Doğrusu: x^2-2x=x(x-2)\u0027dir, sadeleşmeden sonra payda yalnızca x kalmalıdır."},"A":{"ad":"Ne soruluyor","metin":"Küp farkı özdeşliğinin doğru uygulanıp uygulanmadığı ölçülüyor. Kural: a^3-b^3=(a-b)(a^2+ab+b^2) özdeşliğinde orta terim +ab\u0027dir. Hesap: (x-2)(x^2-2x+4) yanlış çarpanlamasıyla A(4)=(16-8+4)/4=12/4=3 bulunur. Doğrusu: orta terim +2x olmalı, doğru sonuç 7\u0027dir."},"B":{"ad":"Toplam Terimde Sadelestirme Tuzağı","metin":"Öğrenci payı ve paydayı çarpanlarına ayırmadan doğrudan en yüksek dereceli terimleri (x^3 ile x^2) sadeleştirip x=4 sonucunu bulur. Doğrusu: sadeleştirme yalnız çarpanlar arasında yapılır, önce (x-2)(x^2+2x+4)/x(x-2) bulunup sonra x=4 yazılmalıdır."}},"celdiriciYol":{"D":"(x^2+4x+4)/x=(16+16+4)/4=36/4 = 9 (küp farkı ikinci çarpanını tam kare özdeşliğiyle karıştırma)","E":"(x^2+2x+4)/(x-2)=(16+8+4)/2=28/2 = 14 (payda ortak çarpanını alırken x çarpanini düşürme)","A":"(x-2)(x^2-2x+4)/[x(x-2)]=(16-8+4)/4=12/4 = 3 (küp farkı özdeşliğinde orta terimin işaretini yanlış alma)","B":"x^3/x^2 ve sabitleri görmezden gelerek dereceleri direkt sadelestirme: x = 4 (toplama halindeki terimi sadelestirme)"},"hap":"Rasyonel ifadelerde sadelestirme, pay ve payda AYRI AYRI çarpanlarına ayrıldıktan sonra ORTAK ÇARPANLAR arasında yapılır; toplama halindeki terimler asla sadeleşmez.","teshis":{"C":{"gercek":"Küp farkı ve ortak çarpan parantezine alma sırayla uygulanınca A(x)=(x^2+2x+4)/x elde edilir; x=4 için 28/4=7 bulunur.","ayirt":"Her ara adımı bir öncekinin sonucu üzerine mi kurdum?","paragraf":"CARPANLARA AYIRMA YOLLARI - ozdeslik ve ortak carpan","yanilgi":"Sadeleştirme sonucu doğru olsa da hesabı kısayoldan yapabileceğini, ara adımların önemsiz olduğunu düşünüyorsun."},"E":{"gercek":"Ortak çarpan parantezine alma x^2-2x=x(x-2) sonucunu tam olarak yazmayı gerektirir; x çarpanı payda ifadesinin ayrılmaz parçasıdır.","ayirt":"Ortak çarpanı çıkardıktan sonra payda ifadesinin TAMAMINI mı yazdım?","paragraf":"CARPANLARA AYIRMA YOLLARI - ortak carpan parantezine alma","yanilgi":"Paydayı ortak çarpan parantezine alırken çıkardığın x çarpanını unutup sadece kalan parantezi payda yapıyorsun."},"A":{"gercek":"a^3-b^3=(a-b)(a^2+ab+b^2) özdeşliğinde orta terim daima +ab\u0027dir; işaret çarpanın kendisindedir (a-b), içeride değil.","ayirt":"Açtığım parantezi geri çarpsam pay ifadesini verir mi?","paragraf":"TEMEL OZDESLIKLER - kup farki","yanilgi":"Küp farkı özdeşliğinin orta teriminin işaretini kare farkı gibi eksi sanıyorsun."},"D":{"gercek":"Küp farkı özdeşliğinde katsayı 2 değil 1\u0027dir: a^2+ab+b^2; katlama yalnız tam kare özdeşliğinde vardır.","ayirt":"Bu özdeşlik kare mi küp mü, hangi formülü kullanmalıyım?","paragraf":"TEMEL OZDESLIKLER - tam kare ve kup farki karsilastirmasi","yanilgi":"Küp farkı özdeşliğinin ikinci çarpanını tam kare açılımıyla (a^2+2ab+b^2) karıştırıyorsun."},"B":{"gercek":"Sadeleştirme yalnız çarpanlar arasında yapılır; toplama halindeki terimler (x^3 ile -8, x^2 ile -2x) tek başına sadeleşmez.","ayirt":"Sadeleştirdiğim terim çarpan olarak mı yoksa toplananlardan biri olarak mı duruyor?","paragraf":"SINAV TUZAGI - toplama halindeki terimler sadelesmez","yanilgi":"Pay ve paydayı çarpanlarına ayırmadan doğrudan en büyük kuvvetli terimleri sadeleştirebileceğini sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 13"},"kural":"pay iki kare farkı özdeşliğiyle (x-4)(x+4) şeklinde çarpanlarına ayrılır, ortak çarpan (x-4) sadeleştirilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 13","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce payı ve paydayı ayrı ayrı çarpanlarına ayır, ortak çarpanı sil, sayıyı en son yaz.","konu":"cebirsel sadelestirme","tablo":{"satirlar":[["VERİLENLER","-"],["İfade","A = (x²-16)/(x-4)"],["x değeri","7"],["HESAP","-"],["Pay çarpanlarına ayrılır","(x-4)(x+4)"],["Ortak çarpan sadeleştirilir","X+4"],["X=7 için değer hesaplanır","11"]],"basliklar":["İşlem","Sonuç"]},"siklar":{"C":"7","E":"33","A":"3","D":"11","B":"4"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"x değeri (7) doğrudan cevap sanılmıştır. Önce çarpanlara ayırıp sadeleştirme yapılmadan doğrudan yerine yazma yapılamaz.","E":"Payın sayısal değeri (33) doğru hesaplanmış ama paydaya bölünmesi atlanmıştır. Sadeleştirme sonrası x+4\u0027e x yazılıp sonra bölme yapılmalıdır.","A":"Payı yanlış olarak (x-4)² sanıp sonuç 3 bulunmuştur. Oysa x²-16 iki kare farkıdır; (x-4)² değil (x-4)(x+4) biçiminde ayrılmalıdır.","B":"Paydayı sıfır yapan x=4 değeri yanlışlıkla cevap yazılmıştır. Bu değer sadece tanım kümesine kısıtlama getirir; sorunun cevabı değildir."},"dogru":"Üstteki ifadenin payı iki kare farkı kuralıyla (x-4)(x+4) olarak ayrılır. Ortak çarpan (x-4) sadeleşir ve geriye x+4 kalır. x yerine 7 yazılınca 7+4=11 bulunur.","sinav":"Rasyonel cebirsel ifadelerde iki kare farkı özdeşliği kullanılarak pay çarpanlarına ayrılır, ortak çarpan sadeleştirilir ve sonra yerine yazma işlemi uygulanır.","kavramlar":[{"kaynak":"TEORI","tanim":"Pay ve payda ayrı ayrı çarpanlarına ayrılıp ortak çarpanlar kaldırılarak ifadenin basitleştirilmesidir.","ad":"Rasyonel ifade sadeleştirme"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["İşlem","Sonuç"],"satirlar":[["Pay çarpanlarına ayrılır","(x-5)(x+5)"],["Ortak çarpan sadeleştirilir","X+5"],["X=9 için değer hesaplanır","14"]]},"tur":"tablo","soru":"B = (x² - 25) / (x - 5) ifadesinde x = 9 için B ifadesinin değeri kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve B\u0027nin değerinin kaç olduğunu bul","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"A = (x² - 16) / (x - 4) ifadesinde x = 7 için A ifadesinin değeri kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-12","verilenler":[{"deger":"A = (x²-16)/(x-4)","anlam":"Sadeleştirilmesi ve x=7 için değeri istenen rasyonel cebirsel ifade","ad":"İfade"},{"deger":"7","anlam":"Sadeleştirilmiş ifadeye yerine konulacak sayı","ad":"x değeri"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - İki kare farkı özdeşliği ve rasyonel ifade sadeleştirme kuralı","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: A = (x² - 16) / (x - 4) (soruda verilen); x = 7 (soruda verilen)","anlatim":"Soru bize x = 7 değerini vermiş. İfade A = (x² - 16) / (x - 4) şeklinde tanımlı.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"x² - 16 = x² - 4² = (x - 4) × (x + 4)","anlatim":"İki kare farkı nedir? a² - b² = (a-b)(a+b) özdeşliğidir. Payı bu şekilde çarpanlarına ayırırız çünkü paydadaki (x-4) ile sadeleşecek bir çarpan yakalarız.","doldur":[[4,1]]},{"formul":"A = (x - 4) × (x + 4) / (x - 4) = x + 4","anlatim":"Payda ile paydaki (x-4) çarpanı birbirini götürür. Sadeleştirme sonucu ifade sadece x+4 kalır.","doldur":[[5,1]]},{"formul":"A = x + 4 = 7 (soruda verilen) + 4 = 11","anlatim":"Artık elde x+4 var, x yerine verilen 7 değerini koyup toplarız. Bu bize A\u0027nın sayısal değerini verir. Sağlama için x=7\u0027yi hiç sadeleştirmeden direkt orijinal ifadede deneyelim. Aynı sonucu görmeliyiz.","doldur":[[6,1]]},{"formul":"Yanlış yol: sadeleştirmeden karışık işlem yapmak = belirsiz (HATALI) → doğrusu x + 4 = 11 (4. adımda bulduk)","anlatim":"En sık hata: sadeleştirmeden önce x=7\u0027yi paydaya koyup x-4=3 çıktığı için \u0027sıfır olur, sadeleşmez\u0027 diye kararsız kalmaktır. Doğrusu önce sadeleştirip x+4=11 bulmaktır, çünkü x=4 olmadıkça (x-4) sıfırdan farklıdır ve sadeleşme geçerlidir.","doldur":[]}],"anahtar":[{"ornek":"sadeleştirme","kok":"sadele"},{"ornek":"çarpanlar","kok":"çarpan"},{"ornek":"değerini","kok":"değeri"},{"ornek":"sonucu","kok":"sonucu"},{"ornek":"şeklinde","kok":"şeklin"},{"ornek":"özdeşliğiyle","kok":"özdeşl"}],"konuGiris":{"harita":"Ne zaman test edilir: pay ve paydada ortak çarpan varmış gibi görünen kesirli ifadelerde test edilir. Nasıl ölçülür: doğru özdeşlik seçilip sadeleştirme yapıldıktan sonra sayı değeri yerine konularak ölçülür. Nasıl kaydedilir: sonuç tek bir sayısal değer olarak yazılır.","desen":"Sınav sıklıkla payı iki kare farkı gibi özdeşlikle çarpanlarına ayırtıp paydadaki terimle sadeleştirtir; öğrenci sadeleştirmeden önce paydayı sıfır yapan değeri kontrol etmeyi unutur. Bu konu arşivde 3 dönemde çıkmış, tuzak hep tanımsızlık kontrolü eksikliğidir. Bu soru p.28 sadeleştirme ve özdeşlik kullanımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"a²-b² ifadesinin (a-b)(a+b) çarpanlarına ayrılması","ad":"iki kare farkı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"pay ve paydada aynı anda bulunan ve sadeleşebilen çarpan","ad":"ortak çarpan","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"paydayı sıfır yapan, ifadenin tanımlı olmadığı x değeri","ad":"tanımsızlık noktası","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"sadeleşmiş ifadede x yerine verilen sayısal değerin konulması","ad":"yerine koyma","kim":"kanun sabitler"}],"sinavda":"Kesirli bir cebirsel ifade ve x için sayısal bir değer verilir, ifadenin bu değerdeki sonucu istenir.","panel_ornek":"Bir kırtasiyede 10 tane defter fiyatı, 5 tane defter fiyatının tam iki katıdır; bu yüzden 10 defterin toplam tutarını 5 defter sayısına bölünce sadece \u00272 kat\u0027 bilgisi kalır, defter sayısı sadeleşir. Yani ortak çarpan (5 defter) atılınca geriye sade bir oran kalıyor demektir.","ornek":"Bir kırtasiyede 10 tane defter fiyatı, 5 tane defter fiyatının tam iki katıdır; bu yüzden 10 defterin toplam tutarını 5 defter sayısına bölünce sadece \u00272 kat\u0027 bilgisi kalır, defter sayısı sadeleşir. Yani ortak çarpan (5 defter) atılınca geriye sade bir oran kalıyor demektir.","yontemler":"Önce pay iki kare farkı özdeşliğiyle çarpanlarına ayrılır, ortak çarpan sadeleştirilir; sonra verilen x değeri sadeleşmiş ifadeye yerine konur.","nedir":"Cebirsel sadeleştirme, pay ve paydadaki ortak çarpanları bulup ifadeyi küçültme işlemidir. Sınav burada iki kare farkı gibi özdeşlikleri tanıyıp doğru sadeleştirme yapabildiğini ölçer."},"olay":"(x²-16)/(x-4) = (x-4)(x+4)/(x-4) = x+4; x=7 için 7+4=11.","tuzak":{"C":{"ad":"Sadeleştirmeyi Atlama Tuzağı","metin":"Çarpanlara ayırma ve sadeleştirme hiç yapılmadan doğrudan x değeri (7) cevap sanılmış. Doğrusu: önce pay çarpanlarına ayrılıp ortak çarpan sadeleştirilmelidir."},"E":{"ad":"Bölmeyi Unutma Tuzağı","metin":"Payın sayısal değeri hesaplanmış (7²-16=33) ama paydaya (7-4=3) bölünmesi unutulmuş. Doğrusu: sadeleştirme sonrası bulunan x+4 ifadesine x değeri yazılmalıdır, ham pay değeri cevap değildir."},"A":{"ad":"Tam Kare Sanma Tuzağı","metin":"x²-16 ifadesini (x-4)² sanıp (x-4)²/(x-4) = x-4 = 7-4 = 3 bulunmuş. Doğrusu: x²-16 iki kare farkıdır, (x-4)(x+4) olarak ayrılır."},"B":{"ad":"Tanımsızlık Değerini Cevap Sanma Tuzağı","metin":"Paydayı sıfır yapan x=4 değeri, sadeleştirme sonucu sanılarak doğrudan cevap yazılmış. Doğrusu: x=4 yalnızca tanım kümesi dışı bırakılan değerdir, ifadenin değeri değildir."}},"celdiriciYol":{"C":"Sadeleştirme atlanır, sorudaki x değeri doğrudan yazılır = 7 (sadeleştirmeyi hiç yapmama)","E":"Pay hesaplanır: 7²-16 = 49-16 = 33, paydaya (7-4=3) bölünmeden bırakılır = 33 (bölme adımını atlama)","A":"x²-16=(x-4)² sanılır, (x-4)²/(x-4) = x-4 = 7-4 = 3 (iki kare farkını tam kare ile karıştırma)","B":"Paydayı sıfır yapan değer x=4 doğrudan cevap sanılır = 4 (tanımsızlık değerini sonuç sanma)"},"hap":"Rasyonel ifadelerde sadeleştirme yalnızca çarpanlar arasında yapılır, toplama/çıkarma halindeki terimler asla sadeleşmez.","teshis":{"C":{"gercek":"Rasyonel ifade sadeleştirmesi pay ve paydanın çarpanlarına ayrılıp ortak çarpanın silinmesiyle yapılır; sadeleştirilmiş ifadeye x değeri sonradan yazılır.","ayirt":"Çarpanlara ayırma ve sadeleştirme adımını gerçekten yaptım mı?","paragraf":"Rasyonel ifade sadeleştirme kuralı","yanilgi":"Sadeleştirme adımını atlayıp sorudaki x değerini doğrudan cevap sandım."},"E":{"gercek":"Kesir ifadesinde sonuç, sadeleştirilmiş ifadeye x değeri yazılarak bulunur; payın tek başına sayısal değeri sonuç değildir.","ayirt":"Bulduğum sayı payın mı, yoksa sadeleşmiş kesrin sonucu mu?","paragraf":"Rasyonel ifade sadeleştirme kuralı","yanilgi":"Payın sayısal değerini bulunca işlemin bittiğini sandım, paydaya bölmeyi unuttum."},"A":{"gercek":"a²-b² ifadesi iki kare farkıdır ve (a-b)(a+b) olarak çarpanlarına ayrılır; (a-b)² ile karıştırılmaz çünkü açılımında orta terim -2ab bulunur, burada yoktur.","ayirt":"İfadede orta terim (2ab) var mı, yok mu diye kendime sordum mu?","paragraf":"İki kare farkı özdeşliği","yanilgi":"İki terimli bir ifadeyi görünce hemen tam kare kalıbına benzettim, işaret ve terim sayısını kontrol etmedim."},"D":{"gercek":"Sadeleştirme yalnızca çarpanlar arasında yapılır; pay iki kare farkı ile (x-4)(x+4) şekline getirilip ortak çarpan silinince x+4 elde edilir, x=7 için 11 bulunur.","ayirt":"Payı doğru çarpanlarına ayırıp ortak çarpanı sildim mi?","paragraf":"İki kare farkı ve rasyonel ifade sadeleştirme kuralı","yanilgi":"Bu şıkkı eleyen öğrenci, sadeleştirme yapmadan doğrudan sayısal hesaba (33/3) güvenip ara adımı gereksiz sanmıştır."},"B":{"gercek":"Tanımsızlık kısıtı yalnızca x\u0027in hangi değeri alamayacağını gösterir; ifadenin belirli bir x değerindeki sayısal sonucu değildir.","ayirt":"Bulduğum sayı, ifadenin tanımsız olduğu x mi, yoksa ifadenin değeri mi?","paragraf":"Tanımsızlık kuralı","yanilgi":"Paydayı sıfır yapan değeri, sanki sadeleştirilmiş ifadenin sonucuymuş gibi cevap sandım."}},"verilen":[[4,1],[1,1],[2,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 13"},"kural":"Pay çarpanlarından biri paydayla sadeleşir, kalan çarpanlar sonucu verir; payda = sadeleşen çarpan × kalan çarpan.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 13","sonDonem":2,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Sadeleşmiş ifadeden geriye giderken payda çarpanını (sadeleşen terim × kalan terim) olarak yeniden kur, sonra orta terimi topla.","konu":"cebirsel sadelestirme","tablo":{"satirlar":[["VERİLENLER","-"],["İfade","(x²-9)/(x²+kx-15)"],["Sadeleşmiş sonuç","(x-3)/(x-5)"],["Tanım kısıtı","x≠3 ve x≠-3"],["HESAP","-"],["Pay çarpanlara ayrılır","(x-3)(x+3)"],["Sadeleşen çarpan","(x+3)"],["Payda çarpanları","(x+3)(x-5)"],["Payda açılımı","X²-2x-15"],["K değeri","-2"]],"basliklar":["Adım","Sonuç"]},"siklar":{"C":"-2","E":"8","A":"-15","D":"2","B":"-8"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Paydayı (x+5)(x-3) çarpanlarıyla kurduğunuzde orta terim işareti yanlış hesaplanır. Sadeleşen çarpan (x+3) olmalı, (x+5) olamaz.","E":"Paydayı (x+5)(x+3) ile kurduğunuzde her iki çarpanın işaretini ters almış olursunuz. Doğru paydanın çarpanları (x+3) ve (x-5) olmalıdır.","A":"Paydadaki sabit terim -15\u0027i doğrudan k sandığında bu hata yapılır. Oysa k, paydanın çarpanlarına ayrılmasından çıkan orta terim katsayısıdır.","B":"Sadeleşen çarpanı yanlış belirleyip paydayı (x-5)(x-3) kurduğunda k = -8 çıkar. Doğru olan, payda (x+3)(x-5) olmalıdır."},"dogru":"Payı (x-3)(x+3) olarak çarpanlarına ayırıp, sonucun (x-3)/(x-5) olduğunu bildiğimiz için, sadeleşen çarpan (x+3)\u0027tür. Paydanın (x+3)(x-5) = x²-2x-15 olması gerekir; bu yüzden k = -2.","sinav":"Rasyonel ifadelerde pay ve payda ayrı ayrı çarpanlarına ayrılır, ortak çarpanlar sadeleştirilir; bu yolla paydadaki bilinmeyen katsayı belirlenir.","kavramlar":[{"kaynak":"TEORI","tanim":"a² - b² biçimindeki ifade (a - b)(a + b) şeklinde çarpanlarına ayrılır.","ad":"İki kare farkı"},{"kaynak":"TEORI","tanim":"x² + bx + c biçimindeki ifade için çarpımları c, toplamları b olan iki sayı bulunup (x + m)(x + n) biçiminde yazılır.","ad":"İkinci derece üç terimli çarpanlara ayırma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Adım","Sonuç"],"satirlar":[["Pay çarpanlara ayrılır","(x-4)(x+4)"],["Sadeleşen çarpan","(x-4)"],["Payda çarpanları","(x+4)(x-5)"],["Payda açılımı","x²-x-20"],["K değeri","-1"]]},"tur":"tablo","soru":"B(x) = (x²-16)/(x²+kx-20) ifadesi, x≠4 ve x≠-4 için (x+4)/(x-5) ifadesine sadeleşmektedir. Buna göre k kaçtır?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve k\u0027nın değerini bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"A(x) = (x²-9)/(x²+kx-15) ifadesi, x≠3 ve x≠-3 için (x-3)/(x-5) ifadesine sadeleşmektedir. Buna göre k kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-12","verilenler":[{"deger":"(x²-9)/(x²+kx-15)","anlam":"Sadeleştirilecek rasyonel ifade; pay ve payda çarpanlarına ayrılacak.","ad":"İfade"},{"deger":"(x-3)/(x-5)","anlam":"Sadeleştirme sonrası elde edilen ifade; payda çarpanlarının kurulmasında kullanılır.","ad":"Sadeleşmiş sonuç"},{"deger":"x≠3 ve x≠-3","anlam":"Paydayı ya da ortak çarpanı sıfır yapan değerler; pay çarpanlarının (x-3)(x+3) olduğunu doğrular.","ad":"Tanım kısıtı"}],"dayanak":"TESMER SGS Matematik Ders Notu - Çarpanlara Ayırma ve Rasyonel İfade Sadeleştirme","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: pay x²-9 (soruda verilen); payda x²+kx-15 (soruda verilen); sadeleşmiş hal (x-3)/(x-5) (soruda verilen); istenen k değeri","anlatim":"Soru bize şunu vermiş: A(x) = (x²-9)/(x²+kx-15) ifadesi x≠3 ve x≠-3 için (x-3)/(x-5)\u0027e sadeleşiyor. Bizden k\u0027yı bulmamız isteniyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Pay = x² - 9 = (x-3)(x+3) → (x-3)(x+3)","anlatim":"Önce payı çarpanlarına ayırıyoruz, çünkü sadeleşme ancak çarpanlar hâlinde görülür. x²-9 iki kare farkıdır.","doldur":[]},{"formul":"Sonuç = (x-3)/(x-5) olduğundan sadeleşen çarpan = (x+3)","anlatim":"Sadeleşmiş sonuçta (x-3) hâlâ payda duruyor, demek ki payda ile sadeleşen çarpan (x+3) imiş. Dikkat: sadeleşen çarpan payda görünmeyendir.","doldur":[[6,1],[7,1],[8,1]]},{"formul":"Payda = sadeleşen çarpan × kalan çarpan = (x+3) (2. adımda bulduk) × (x-5) (soruda verilen) = (x+3)(x-5)","anlatim":"Payda, sadeleşen çarpanla sonucun paydasının çarpımından oluşur. Bu yüzden payda (x+3) ile (x-5)\u0027in çarpımıdır.","doldur":[]},{"formul":"Payda açılımı = (x+3)(x-5) (3. adımda bulduk) = x² - 5x + 3x - 15 = x² - 2x - 15","anlatim":"Şimdi bu çarpımı açıyoruz ki soruda verilen x²+kx-15 ile karşılaştırabilelim. Açılım bize ortadaki katsayıyı gösterecek.","doldur":[]},{"formul":"k = katsayı karşılaştırması: x² + kx - 15 (soruda verilen) = x² - 2x - 15 (4. adımda bulduk) → k = -2","anlatim":"Soruda verilen payda x²+kx-15 ile bizim bulduğumuz x²-2x-15\u0027i karşılaştırıyoruz. Ortadaki terimler eşit olmalı.","doldur":[]},{"formul":"Sonuç: k = -2","anlatim":"Sonuç: k değeri -2 çıkıyor. Bu değer paydayı tam olarak istenen sadeleşmeyi verecek hale getiriyor.","doldur":[[9,1]]},{"formul":"Ters durum: sadeleşen çarpan (x-3) olsaydı → payda = (x-3)(x-5) = x²-8x+15 → k=-8","anlatim":"Ters durumda sadeleşen çarpan (x-3) olsaydı, payda (x-3)(x-5) olur ve k farklı çıkardı. Hangi çarpanın sadeleştiğini doğru tespit etmek kritik.","doldur":[]},{"formul":"Yanlış yol: payda = (x-3)(x-5) = x²-8x+15 → k=-8 (HATALI) → doğrusu payda=(x+3)(x-5)=x²-2x-15 → k=-2 (6. adımda bulduk)","anlatim":"En sık hata: öğrenci hangi çarpanın sadeleştiğini karıştırıp (x-3)\u0027ü sadeleşen sanır. Sonuçtaki (x-3)/(x-5) ifadesinde (x-3) hâlâ payda durduğu için asıl sadeleşen (x+3)\u0027tür.","doldur":[]}],"anahtar":[{"ornek":"sadeleştirme","kok":"sadele"},{"ornek":"çarpanlari","kok":"çarpan"},{"ornek":"çarpımından","kok":"çarpım"},{"ornek":"sonucu","kok":"sonucu"},{"ornek":"karşılaştırabilelim","kok":"karşıl"},{"ornek":"katsayı","kok":"katsay"}],"konuGiris":{"harita":"Ne zaman test edilir: pay ve paydası çarpanlara ayrılabilen kesirli ifadelerde. Nasıl ölçülür: verilen sadeleşmiş ifadeden geriye giderek bilinmeyen katsayı bulunur. Nasıl kaydedilir: bulunan katsayı, orijinal paydanın çarpanlarıyla karşılaştırılarak doğrulanır.","desen":"Bu soruda öğrenci x²-9 ifadesini iki kare farkı olarak çarpanlara ayırmayı ve payda çarpanlarını (x-5)(x+3) şeklinde eşleştirmeyi bilmelidir. Tuzak, k\u0027yı bulurken orta terim toplamını yanlış işaretle almaktır. Bu soru p.28\u0027deki iki kare farkı ve orta terim bulma noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"kesrin üst kısmı, çarpanlarına ayrılarak sadeleştirilir","ad":"pay","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"kesrin alt kısmı, sıfır olamayacağı için kısıtlama oluşturur","ad":"payda","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"pay ve paydada aynı bulunan, sadeleşmeyi sağlayan çarpan","ad":"ortak çarpan","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"paydayı sıfır yapan değerlerin tanım kümesinden çıkarılması","ad":"tanımsızlık koşulu","kim":"kanun sabitler"}],"sinavda":"Sadeleşmiş hâli verilen bir kesirli ifadede, orijinal paydadaki bilinmeyen katsayı istenir.","panel_ornek":"İkinci el bir telefonun fiyatı 12 taksitte ödeniyor, ama sen bunu 4 taksite sadeleştirip aylık ödemeyi buluyorsun. Taksit sayısı değişse de toplam tutarın oranı aynı kalır, önemli olan ortak çarpanı doğru bulmak.","ornek":"İkinci el bir telefonun fiyatı 12 taksitte ödeniyor, ama sen bunu 4 taksite sadeleştirip aylık ödemeyi buluyorsun. Taksit sayısı değişse de toplam tutarın oranı aynı kalır, önemli olan ortak çarpanı doğru bulmak.","yontemler":"Pay iki kare farkı olarak, payda ise çarpanları verilen sadeleşmiş ifadeye göre çarpanlarına ayrılır; k, orta terim toplamından bulunur.","nedir":"Cebirsel sadeleştirme, pay ve paydadaki ortak çarpanları bularak ifadeyi basitleştirmeyi sağlar. Sınav, çarpanlara ayırmayı doğru yapıp yapmadığını ve tanımsızlık koşullarını kontrol edip etmediğini ölçer."},"olay":"Pay=(x-3)(x+3); sonuç (x-3)/(x-5) olduğundan payda=(x+3)(x-5)=x²-2x-15.","tuzak":{"D":{"ad":"İşaret Hatası Tuzağı","metin":"Paydayı (x+5)(x-3) kurarak orta terimin işaretini karıştırdın. Doğrusu: Sadeleşen çarpan pay ile aynı işaretli (x+3) olmalıdır, (x+5) ile değiştirilemez."},"E":{"ad":"Çift İşaret Hatası Tuzağı","metin":"Paydayı (x+5)(x+3) kurarak iki çarpanın da işaretini ters aldın. Doğrusu: Kalan çarpan (x-5), sadeleşen çarpan (x+3) olarak sabit kalmalıdır."},"A":{"ad":"Sabit Terim Tuzağı","metin":"x²+kx-15 içindeki -15 sabitini doğrudan k sandın, çarpanlara ayırma hiç yapılmadı. Doğrusu: k, paydanın çarpanlarına ayrılmasıyla bulunan orta terim katsayısıdır."},"B":{"ad":"Yanlış Çarpan Seçimi Tuzağı","metin":"Sadeleşen çarpanın (x-3) olduğunu sanıp paydayı (x-5)(x-3) kurdun. Doğrusu: Pay (x-3)(x+3) olduğundan ve sonuçta (x-3) kaldığından, sadeleşen çarpan (x+3)\u0027tür."}},"celdiriciYol":{"D":"(x+5)(x-3) = x²+2x-15, k=2 (işaret hatası)","E":"(x+5)(x+3) = x²+8x+15, k=8 (çift işaret hatası)","A":"x²+kx-15 içindeki -15 doğrudan k sanılır = -15 (sabit terimi k sanma)","B":"(x-5)(x-3) = x²-8x+15, k=-8 (yanlış çarpan sadeleştirme)"},"hap":"Rasyonel ifadede sadeleştirme yalnız pay ve paydanın ORTAK ÇARPANLARI arasında yapılır, sabit terimler asla doğrudan katsayı sanılmaz.","teshis":{"C":{"gercek":"Sadeleşen çarpan (x+3), kalan çarpan (x-5)\u0027tir; (x+3)(x-5)=x²-2x-15 olduğundan k=-2.","ayirt":"Payda açılımını orta terimiyle birlikte doğru mu kurdum?","paragraf":"İki Kare Farkı ve Orta Terimli Çarpanlara Ayırma","yanilgi":"Payda çarpanlarını farklı bir kombinasyonla da kurabileceğini sanıp işlemi karıştırıyorsun."},"E":{"gercek":"Payda çarpanı, kalan (x-5) ile sadeleşen (x+3)\u0027ün çarpımıdır, ikisinin işareti de değiştirilmez.","ayirt":"İki çarpanı da orijinal işaretiyle mi aldım?","paragraf":"Rasyonel İfade Sadeleştirme","yanilgi":"Her iki çarpanı da ters işaretle kurup (x+5)(x+3) yazıyorsun."},"A":{"gercek":"k, payda çarpanlarının orta terim toplamıdır; sabit terim çarpanların çarpımını verir, k\u0027yı vermez.","ayirt":"Paydayı iki çarpana ayırıp orta terimi topladım mı?","paragraf":"Çarpanlara Ayırma - orta terimli tip","yanilgi":"x²+kx-15 ifadesindeki -15 sabitinin doğrudan k olduğunu sanıyorsun."},"D":{"gercek":"Sadeleşen çarpan pay ile aynı işaretli (x+3) olmalı, (x+5) ile karıştırılmaz.","ayirt":"Sadeleşen çarpanın işareti pay ile aynı mı?","paragraf":"Çarpanlara Ayırma - işaret kontrolü","yanilgi":"Payda çarpanlarını (x+5)(x-3) alarak işaret yönünü karıştırıyorsun."},"B":{"gercek":"Pay (x-3)(x+3) şeklindedir; sonuçta (x-3) kaldığına göre sadeleşen çarpan (x+3) olmalıdır.","ayirt":"Sonuçta hangi çarpan KALDI, hangisi SADELEŞTİ?","paragraf":"Rasyonel İfade Sadeleştirme","yanilgi":"Sadeleşen çarpanın (x+3) değil (x-3) olduğunu sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 10"},"kural":"dik dogrularda m1*m2=-1 ve nokta-doğru uzakligi |Ax0+By0+C|/√(A²+B²)\u0027dir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 10","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Cok katmanli analitik geometri sorularinda her ara sonucu (egim, denklem, nokta) ayri satira yaz ve bir sonraki adimda oldugu gibi kullan.","konu":"analitik geometri","tablo":{"satirlar":[["VERİLENLER","-","-"],["A noktası","(0,0)","-"],["B noktası","(4,2)","-"],["C noktası","(5,5)","-"],["Üçüncü doğru","3x + 4y − 10 = 0","-"],["HESAP","-","-"],["AB doğrusunun eğimi","(2-0)/(4-0)","1/2"],["AB doğrusu denklemi","Y=(1/2)x","X-2y=0"],["Dik doğrunun eğimi","-1/(1/2)","-2"],["C(5,5)\u0027ten dik doğru","Y-5=-2(x-5)","2x+y-15=0"],["Kesişim noktası K","X=2y ve 2x+y=15 → x=6, y=3","K(6,3)"],["K\u0027nin 3x+4y-10=0\u0027a uzakligi","|3(6)+4(3)-10|/√(3²+4²) = 20/5","4"]],"basliklar":["Adım","Hesap","Sonuç"]},"siklar":{"C":"4","E":"20","A":"0,8","D":"5","B":"2"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"C noktasını sanki K imiş gibi davranıp doğrudan uzaklık hesaplamışsın; ama K, dik doğrunun orijinal doğruyu kestiği başka bir nokta.","E":"Paya 20 kadar ulaştın ama payda √(A² + B²) = 5\u0027e bölmeyi unutup sonucu 20 olarak vermişsin.","A":"Paydadaki karekök alma adımını atlamışsın. Mutlak değeri 20 bulup, paydanın √(3² + 4²) = 5 olduğunu unutup direkt bölmeye gitmişsin.","B":"Dik doğruyu yanlış noktadan geçirtmişsin; C(5,5)\u0027ten değil A(0,0)\u0027dan başlatınca kesişim noktası sıfır çıkıyor ve iki buluyorsun."},"dogru":"A ve B noktalarından geçen doğrunun eğimini bulup, C noktasından bu doğruya dik bir doğru çiz. İki doğrunun kesiştikleri K noktasını hesapla. Son olarak K ile verilen üçüncü doğru arasındaki mesafeyi uzaklık formülüyle hesapla.","sinav":"Analitik geometri: iki noktanın eğimi, diklik koşulu (m₁·m₂ = −1), doğruların kesişim noktası ve noktanın doğruya uzaklığı formülü.","kavramlar":[{"kaynak":"TEORI","tanim":"Birbirine dik olan iki doğrunun eğimlerinin çarpımı −1\u0027e eşittir.","ad":"Diklik koşulu"},{"kaynak":"TEORI","tanim":"Düzlemde bir noktadan doğruya en kısa mesafe; mutlak değer ve karekök içeren formülle hesaplanır.","ad":"Noktanın doğruya uzaklığı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2],[5,1],[5,2]],"tablo":{"basliklar":["Adım","Hesap","Sonuç"],"satirlar":[["PQ doğrusunun eğimi","(6-0)/(8-0)","3/4"],["PQ doğrusu denklemi","Y=(3/4)x","3x-4y=0"],["Dik doğrunun eğimi","-1/(3/4)","-4/3"],["R(7,-1)\u0027den dik doğru","Y+1=-4/3(x-7)","4x+3y-25=0"],["Kesişim noktası K","3x=4y ve 4x+3y=25 → x=4, y=3","K(4,3)"],["K\u0027nin 4x+3y=0\u0027a uzakligi","|4(4)+3(3)+0|/√(4²+3²) = 25/5","5"]]},"tur":"tablo","soru":"P(0,0) ve Q(8,6) noktalarından geçen doğruya R(7,-1) noktasından çizilen dikme, bu doğruyu K noktasında kesmektedir. Buna göre K noktasının 4x + 3y = 0 doğrusuna uzaklığı kaç birimdir?","verilen":[],"hedef":"Tabloyu doldur ve K\u0027nin 4x + 3y = 0 doğrusuna uzaklığının kaç birim olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"A(0,0) ve B(4,2) noktalarından geçen doğruya C(5,5) noktasından çizilen dikme, bu doğruyu K noktasında kesmektedir. Buna göre K noktasının 3x + 4y − 10 = 0 doğrusuna uzaklığı kaç birimdir?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-17","verilenler":[{"deger":"(0,0)","anlam":"Doğrunun üzerindeki ilk nokta; AB eğiminin hesabında kullanılır.","ad":"A noktası"},{"deger":"(4,2)","anlam":"Doğrunun üzerindeki ikinci nokta; AB eğiminin ve denkleminin bulunmasında kullanılır.","ad":"B noktası"},{"deger":"(5,5)","anlam":"AB doğrusuna dikme çizilen nokta; dik doğrunun denklemi bu noktadan geçirilerek kurulur.","ad":"C noktası"},{"deger":"3x + 4y − 10 = 0","anlam":"Bulunacak K noktasının uzakligi bu doğruya göre hesaplanır.","ad":"Üçüncü doğru"}],"dayanak":"TESMER SGS Matematik-Istatistik Ders Notu - Analitik Geometri: egim, diklik, doğru denklemi ve noktanin dogruya uzakligi kurallari","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: A(0,0) (soruda verilen); B(4,2) (soruda verilen); C(5,5) (soruda verilen); hedef doğru 3x + 4y − 10 = 0 (soruda verilen)","anlatim":"Soru bize A(0,0), B(4,2) ve C(5,5) noktalarını veriyor. Hedef doğru da 3x + 4y − 10 = 0 (soruda verilen).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"AB eğimi = (2 − 0) / (4 − 0) (soruda verilen noktalardan) = 1/2","anlatim":"Önce AB doğrusunun eğimini buluyoruz - iki nokta arasındaki eğim dikeyin yatay değişime bölünmesiyle çıkar. Bu eğim, C\u0027den çizeceğimiz dikmenin eğimini bulmamız için gerekli.","doldur":[[6,1],[6,2],[7,1],[7,2]]},{"formul":"AB doğrusu = y = (1/2)x (2. adımda bulduk) → x − 2y = 0","anlatim":"Eğimi bulduğumuza göre AB doğrusunun denklemini kurabiliriz. Orijinden geçtiği için denklem sade çıkıyor.","doldur":[]},{"formul":"Dik doğrunun eğimi = −1 / (1/2) (2. adımda bulduk) = −2","anlatim":"C\u0027den çizilen dikme AB\u0027ye dik olacağı için eğimler çarpımı −1 vermeli. Dik eğim, AB eğiminin ters işaretli tersidir.","doldur":[[8,1],[8,2]]},{"formul":"C\u0027den dik doğru = y − 5 = −2(x − 5) (4. adımda bulduk) → 2x + y − 15 = 0","anlatim":"Şimdi C(5,5) noktasından, bulduğumuz −2 eğimiyle dik doğrunun denklemini kuruyoruz. Bu doğru K noktasında AB\u0027yi kesecek.","doldur":[]},{"formul":"Kesişim: x = 2y (3. adımda bulduk) ve 2x + y = 15 (5. adımda bulduk) → 2(2y) + y = 15 → y = 3, x = 6 → K(6; 3)","anlatim":"K noktası, AB doğrusu ile dik doğrunun kesiştiği yerdir. İki denklemi birlikte çözerek x ve y\u0027yi buluyoruz.","doldur":[[10,1],[10,2]]},{"formul":"1. terim = 3 × x = 3 × 6 (6. adımda bulduk) = 18","anlatim":"Uzaklık formülünün ilk çarpım terimini ayrı hesaplıyoruz - üç terimi birden çarpıp toplamak karışıklık yaratır. Önce 3 ile K\u0027nin x\u0027ini çarpıyoruz.","doldur":[[11,1],[11,2]]},{"formul":"2. terim = 4 × y = 4 × 3 (6. adımda bulduk) = 12","anlatim":"İkinci terimde 4 ile K\u0027nin y\u0027sini çarpıyoruz - formülün ikinci parçası bu. Her terimi tek başına görmek hata riskini azaltır.","doldur":[]},{"formul":"Pay = 18 (7. adımda bulduk) + 12 (8. adımda bulduk) − 10 (soruda verilen) = 20","anlatim":"Şimdi üç terimi topluyoruz: iki çarpım ve sabit −10. Bu toplam mutlak değer içindeki payı verir.","doldur":[]},{"formul":"Uzaklık = |Pay| / √(3² + 4²) = 20 (9. adımda bulduk) / 5 = 4","anlatim":"Son olarak payı doğrunun katsayılarından oluşan √(3² + 4²) = 5\u0027e bölüyoruz. Bu bölüm bize K\u0027nin gerçek uzaklığını verir.","doldur":[]},{"formul":"Yanlış yol: 25 / 5 = 5 (HATALI) → doğrusu 20 / 5 = 4 (10. adımda bulduk)","anlatim":"En sık hata: öğrenci payı ve payı yanlış toplayıp 25/5=4 gibi rastgele bir bölme yapar, ama doğru pay 20\u0027dir - 18+12-10 işlemini atlarsan sonuç tesadüfen tutabilir ama yöntem yanlış olur.","doldur":[]}],"anahtar":[{"ornek":"terimini","kok":"terimi"},{"ornek":"noktası","kok":"noktas"},{"ornek":"denklemini","kok":"denkle"},{"ornek":"çarpımı","kok":"çarpım"},{"ornek":"doğrunun","kok":"doğrun"},{"ornek":"formülüne","kok":"formül"}],"konuGiris":{"harita":"Ne zaman test edilir: iki nokta veya doğru verilip aralarındaki ilişki (eğim, diklik, uzaklık) istendiğinde. Nasıl ölçülür: önce eğim ve dik doğru denklemi bulunup kesişim noktası hesaplanır, sonra uzaklık formülü uygulanır. Nasıl kaydedilir: sonuç birim cinsinden tek sayı olarak yazılır.","desen":"Soru genelde önce bir doğrunun eğimini, sonra ona dik doğrunun denklemini, en sonda kesişim noktasının başka bir doğruya uzaklığını ister; adımlardan biri atlanınca sonuç yanlış çıkar. Öğrenciler çoğu zaman eğimi ters kurar veya dik doğru denklemini kesişim noktasını bulmadan uzaklık formülüne sokar. Bu soru \u0027eğim, dik doğru, uzaklık\u0027 zincirinin sırayla uygulanması noktasından geliyor; arşivde 2 dönemde çıkmış.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Doğrunun x eksenine göre yükselme/yatay oran; y farkı bölü x farkı","ad":"Eğim (m)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Birbirine dik iki doğrunun eğimleri çarpımı −1\u0027dir","ad":"Dik doğru koşulu","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"İki doğru denkleminin ortak çözümünden çıkan nokta","ad":"Kesişim noktası (K)","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Noktanın doğru denklemine göre mutlak fark bölü kök(A²+B²) değeri","ad":"Noktanın doğruya uzaklığı","kim":"kanun sabitler"}],"sinavda":"İki nokta, bir dikme ve bir referans doğru verilir; dikmenin kestiği noktanın referans doğruya uzaklığı istenir.","panel_ornek":"Bir haritada evinden okula giden yolu düz bir çizgi gibi düşün; sonra o yola dik bir kestirme yol çizip parkın oraya kadar uzaklığını ölçmek istiyorsun. Ev (0,0), okul (4,2) noktasında olsun, park ise (5,5)\u0027te; kestirme yolun kesiştiği nokta ile başka bir yoldan uzaklığını bulman gerekiyor. Bu tam olarak sınavdaki mantık, sadece rakamlar farklı.","ornek":"Bir haritada evinden okula giden yolu düz bir çizgi gibi düşün; sonra o yola dik bir kestirme yol çizip parkın oraya kadar uzaklığını ölçmek istiyorsun. Ev (0,0), okul (4,2) noktasında olsun, park ise (5,5)\u0027te; kestirme yolun kesiştiği nokta ile başka bir yoldan uzaklığını bulman gerekiyor. Bu tam olarak sınavdaki mantık, sadece rakamlar farklı.","yontemler":"Önce AB doğrusunun eğimi bulunur, C\u0027den geçen dik doğru kurulur; iki doğru ortak çözülüp K bulunur, sonra u
