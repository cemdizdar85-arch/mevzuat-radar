anım koşuluyla kontrol etmektir.","nedir":"Logaritma denklemi, içi ve tabanı belirli koşulları sağlayan ifadelerin eşitliğini çözmeyi öğretir. Sınav, tanım koşullarını kontrol edip doğru kökü seçebilme becerisini ölçer."},"olay":"(x-1)(x+7)=6x+18 → x²+6x-7=6x+18 → x²=25 → x=5 veya x=-5; x\u003e1 şartı nedeniyle x=-5 elenir, x=5 kalır; 3(5)-7=8.","tuzak":{"C":{"ad":"Kök Ortalaması Tuzağı","metin":"x²=25 denkleminin iki kökü (5 ve -5) toplanıp ikiye bölünerek x=0 sanıldı ve 3(0)-7=-7 hesaplandı. Doğrusu: tanım şartı köklerden birini eler, ortalama alınmaz; geçerli kök x=5, sonuç 8\u0027dir."},"E":{"ad":"İfade Karıştırma Tuzağı","metin":"doğru kök x=5 bulunduktan sonra istenen ifade 3x-7 yerine 3x+7 olarak hesaplanıp 3(5)+7=22 sonucuna gidildi. Doğrusu: istenen ifade 3x-7\u0027dir, x=5 için sonuç 8\u0027dir."},"A":{"ad":"Tanım Şartı Atlama Tuzağı","metin":"x²=25 denkleminden çıkan x=-5 kökü, log₂(x-1) ifadesinin x\u003e1 şartına aykırı olduğu kontrol edilmeden kabul edildi ve 3(-5)-7=-22 hesaplandı. Doğrusu: x=-5 elenir, geçerli kök x=5 olup sonuç 8\u0027dir."},"B":{"ad":"Toplam-Çarpım Karıştırma Tuzağı","metin":"log_a A + log_a B ifadesi log_a(AB) yerine log_a(A+B) sanılarak (x-1)+(x+7)=6x+18 çözüldü, x=-3 bulunup 3(-3)-7=-16 hesaplandı. Doğrusu: çarpım kuralı uygulanmalı, geçerli kök x=5\u0027tir."}},"celdiriciYol":{"C":"(5+(-5))/2 = 0; 3(0)-7 = -7 (köklerin ortalaması alındı)","E":"3(5)+7 = 22 (istenen ifade yanlış kuruldu, işaret hatası)","A":"(-5) tanım şartı kontrol edilmeden kabul edilir: 3(-5)-7 = -22 (tanım şartı atlandı)","B":"(x-1)+(x+7)=6x+18 → 2x+6=6x+18 → x=-3; 3(-3)-7 = -16 (toplam-çarpım kuralı karıştırıldı)"},"hap":"Logaritmalı denklemde bulunan her kök, tek tek tanım şartında (logaritmanın içi pozitif) sınanmadan cevap kabul edilmez.","teshis":{"C":{"gercek":"Denklemin kökleri ayrı ayrı tanım şartında sınanır; geçersiz kök atılır, ortalama alınmaz.","ayirt":"Her kökü tek tek tanım şartında denedim mi, yoksa ortalama mı aldım?","paragraf":"Çözüm adımı: köklerin tanım şartında sınanması","yanilgi":"İki kökten birini elemek yerine ikisinin ortalamasını \u0027güvenli\u0027 bir cevap sanıyorsun."},"E":{"gercek":"Soruda istenen ifade 3x-7\u0027dir; x=5 için 3(5)-7=8 hesaplanır, 3x+7 ile karıştırılmaz.","ayirt":"Kökü bulduktan sonra sorunun tam olarak neyi istediğini yeniden okudum mu?","paragraf":"Soru kökü: \u0027bu kök için 3x-7 ifadesinin değeri\u0027","yanilgi":"Doğru kökü bulduktan sonra istenen ifadeyi kopyalarken işlem/işaret hatası yapıyorsun."},"A":{"gercek":"Logaritmanın içi pozitif olmalıdır; x-1\u003e0 şartı x\u003e1 gerektirir, bu yüzden x=-5 kökü atılır.","ayirt":"Bulduğum kök, denklemdeki her logaritmanın içini pozitif yapıyor mu?","paragraf":"Logaritma tanım şartları (a\u003e0, a≠1, x\u003e0)","yanilgi":"İki kökü de geçerli sayıp negatif kökü tanım şartına bakmadan hesaba katıyorsun."},"D":{"gercek":"Çarpım kuralıyla kurulan x²=25 denkleminin kökleri x=5 ve x=-5\u0027tir; x\u003e1 şartı yalnız x=5\u0027i geçerli kılar, 3(5)-7=8 sonucunu verir.","ayirt":"Kökü bulduktan sonra hem denklemi hem de tanım şartını doğru mu uyguladım?","paragraf":"log_a(x)=y ⇔ aʸ=x tanımı ve tanım şartı kontrolü","yanilgi":"Bu şıkkı eleyen öğrenci, tanım şartını kontrol etmeden ya da toplam-çarpım kuralını karıştırarak farklı bir kök buldu."},"B":{"gercek":"log_a(xy) = log_a x + log_a y kuralı toplamı çarpıma dönüştürür; içler toplanmaz, çarpılır.","ayirt":"Logaritmik toplamı birleştirirken içleri çarptım mı, topladım mı?","paragraf":"log_a(xy) = log_a x + log_a y kuralı","yanilgi":"log_a A + log_a B ifadesini log_a(A+B) gibi topluyorsun, oysa bu çarpımdır."}},"verilen":[[1,1],[2,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 14"},"kural":"Aynı tabanlı logaritmalar toplanınca çarpıma dönüşür, log₃(A)=3 ise A=3³ olur; bulunan kökler tanım şartında (içler pozitif) sınanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 14","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Denklemi çözünce bulduğun kökü hemen cevap sanma; önce tanım şartını kontrol et, sonra sorunun tam olarak hangi ifadenin değerini istediğine bak.","konu":"logaritma denklemi","tablo":{"satirlar":[["VERİLENLER","-","-"],["Taban","3","-"],["Eşitliğin sağ tarafı","3","-"],["Tanım şartı","x\u003e4","-"],["İstenen ifade","2x-1","-"],["HESAP","-","-"],["Tanım şartı","X+2\u003e0 ve x-4\u003e0","X\u003e4"],["Birleştirme","Log3[(x+2)(x-4)]=3","-"],["Üstel forma çevirme","(x+2)(x-4)=3³","=27"],["Denklemi açma","X²-2x-8=27","X²-2x-35=0"],["Kökler","(x-7)(x+5)=0","X=7 veya x=-5"],["Şart kontrolü","X=-5 şartı bozar, x=7 kabul","X=7"],["Sağlama","Log3(9)+log3(3)","2+1=3 ✓"],["İstenen ifade (SONUÇ)","2(7)-1","13"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"7","E":"28","A":"-11","D":"13","B":"3"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"x=7 bulunması doğru olsa da sorunun gerçek istemi 2x−1 ifadesinin değeridir; bulunan kök bu ifadeye yerleştirilmezse x değeri verilmiş gibi yanılır.","E":"Logaritma toplamı yanlışlıkla içlerin toplamı sanılıp log₃(2x−2)=3 yazılırsa x=14,5 ve 2x−1=28 çıkar; logaritma toplamı içlerin çarpımına eşittir.","A":"Denklem doğru çözülüp x=−5 ve x=7 bulunsa da x=−5 tanım şartı x\u003e4\u0027ü bozmaktadır; geçersiz kök 2x−1\u0027de kullanılırsa −11 çıkar.","B":"İkinci dereceden denklemin iki kökü (7 ve −5) toplanıp 2 sanıldığında 2(2)−1=3 bulunur; oysa tanım şartını bozan kök baştan elenmeli, yalnız x=7 işleme alınmalıdır."},"dogru":"Aynı tabanlı logaritmalar toplanınca içleri çarpılır; log₃[(x+2)(x−4)]=3 olur. Buradan (x+2)(x−4)=27, yani x²−2x−35=0 çıkar ve x=7 ya da x=−5 bulunur. Ancak x\u003e4 şartı yalnız x=7\u0027yi kabul eder; 2(7)−1=13.","sinav":"Logaritma denklemi çözümü, tanım şartlarının kontrolü ve bulunan kökün istenen cebirsel ifadeye yerleştirilmesidir.","kavramlar":[{"kaynak":"TEORI","tanim":"Logaritma denkleminin çözümünde bulunan her kök, logaritmanın içinin pozitif olması koşulunu sağlamalıdır; şartı sağlamayan kökleri denkleme yerleştirmek yasaktır.","ad":"Logaritmanın tanım şartı"},{"kaynak":"TEORI","tanim":"Aynı tabanlı iki logaritmanın toplamı, içlerin çarpımının logaritmasına eşittir; yani log_a(x) + log_a(y) = log_a(xy) ilişkisi geçerlidir.","ad":"Logaritmaların toplamı kuralı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,1],[1,2],[2,2],[3,1],[3,2],[4,1],[4,2],[5,1],[5,2],[6,1],[6,2],[7,1],[7,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["Tanım şartı","x+5\u003e0 ve x-1\u003e0","x\u003e1"],["Birleştirme","log3[(x+5)(x-1)]=3","-"],["Üstel forma çevirme","(x+5)(x-1)=3³","=27"],["Denklemi açma","x²+4x-5=27","x²+4x-32=0"],["Kökler","(x+8)(x-4)=0","x=4 veya x=-8"],["Şart kontrolü","x=-8 şartı bozar, x=4 kabul","x=4"],["Sağlama","log3(9)+log3(3)","2+1=3 ✓"],["İstenen ifade (SONUÇ)","3(4)+2","14"]]},"tur":"tablo","soru":"x\u003e1 olmak üzere log₃(x+5) + log₃(x−1) = 3 eşitliği sağlanmaktadır. Buna göre bu eşitliği sağlayan x değeri için 3x+2 ifadesinin değeri kaçtır?","verilen":[[0,1],[2,1]],"hedef":"Tabloyu doldur ve 3x+2 ifadesinin değerini bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"x\u003e4 olmak üzere log₃(x+2) + log₃(x−4) = 3 eşitliği sağlanmaktadır. Buna göre bu eşitliği sağlayan x değeri için 2x−1 ifadesinin değeri kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-13","verilenler":[{"deger":"3","anlam":"Logaritmanın tabanı; üstel forma geçişte 3 üssü kullanılır","ad":"Taban"},{"deger":"3","anlam":"Birleştirilmiş logaritmanın değeri; üstel forma çevrilince 3³=27 olur","ad":"Eşitliğin sağ tarafı"},{"deger":"x\u003e4","anlam":"x-4 teriminin logaritma içinde pozitif olması gereken alt sınır","ad":"Tanım şartı"},{"deger":"2x-1","anlam":"Bulunan kök x yerine konarak hesaplanacak son ifade","ad":"İstenen ifade"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Logaritma Denklemi, Tanım ve Çözüm Adımları","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: log₃(x+2) + log₃(x−4) = 3 (soruda verilen); x \u003e 4 şartı (soruda verilen); istenen: 2x−1 (soruda verilen)","anlatim":"Soru bize şunları vermiş: log₃(x+2) + log₃(x−4) = 3 eşitliği ve x\u003e4 şartı. İstenen de belli: 2x−1 ifadesinin değeri.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Tanım şartı = x+2 \u003e 0 ve x-4 \u003e 0 → x \u003e 4","anlatim":"log₃(x+2) nedir? Tabanı 3 olan logaritma, 3 kaç kere çarpılırsa (x+2) verir sorusunun cevabıdır. Burada x\u003e4 olduğu için x+2 zaten pozitif, tanım şartı otomatik sağlanır.","doldur":[[6,1],[6,2],[11,1],[11,2]]},{"formul":"log₃(x+2) + log₃(x−4) = log₃[(x+2)(x−4)] = 3","anlatim":"Aynı tabanlı logaritmaların toplamı çarpıma dönüşür, bu yüzden iki terimi tek logaritmada birleştiriyoruz. Bu adım denklemi sadeleştirmek için şart.","doldur":[[9,1],[9,2]]},{"formul":"log₃[(x+2)(x−4)] = 3 → (x+2)(x−4) = 3³ = 27","anlatim":"log₃(A) = 3 demek, 3 üssü 3 kere çarpılınca A\u0027yı verir demektir. Bu yüzden logaritmayı üstel forma çeviriyoruz.","doldur":[[8,1],[8,2]]},{"formul":"(x+2)(x−4) = 27 (3. adımda bulduk) → x² − 2x − 8 = 27 → x² − 2x − 35 = 0","anlatim":"Şimdi çarpımı açıp ikinci dereceden denklem hâline getiriyoruz. Bunu yapıyoruz çünkü kökleri bulmak için standart formda olması gerekir.","doldur":[[10,1],[10,2]]},{"formul":"x² − 2x − 35 = 0 (4. adımda bulduk) → (x−7)(x+5) = 0 → x = 7 veya x = -5","anlatim":"Denklemi çarpanlarına ayırarak kökleri buluyoruz. İki kök çıkar ama ikisi de geçerli olmayabilir.","doldur":[]},{"formul":"Şart kontrolü: x = -5 (5. adımda bulduk) → x-4 \u003c 0 (HATALI) → reddedilir; x = 7 (5. adımda bulduk) → x \u003e 4 sağlanır → kabul","anlatim":"Şimdi kökleri x\u003e4 tanım şartına göre kontrol ediyoruz. x=-5 şartı bozar, çünkü x-4 negatif olur ve logaritma tanımsız kalır.","doldur":[]},{"formul":"log₃(7+2) + log₃(7-4) = log₃(9) + log₃(3) = 2 + 1 = 3 ✓","anlatim":"Sağlama yaparak x=7\u0027nin denklemi gerçekten sağladığını gösteriyoruz. Bu adım çözümün doğruluğunu kanıtlar.","doldur":[[12,1],[12,2]]},{"formul":"2x − 1 = 2 × 7 (6. adımda bulduk) − 1 = 14 − 1 = 13","anlatim":"Bulduğumuz x=7 değerini istenen ifadede yerine koyup sonucu buluyoruz. Soru bunu istiyordu.","doldur":[[13,1],[13,2]]},{"formul":"Yanlış yol: 2 × (-5) − 1 = -11 (HATALI) → doğrusu 2 × 7 − 1 = 13 (8. adımda bulduk)","anlatim":"En sık hata: öğrenci x=-5\u0027i de kök kabul edip 2(-5)-1=-11 gibi yanlış bir sonuca gider. Tanım şartını kontrol etmeden köklerden birini seçmek büyük hatadır.","doldur":[]}],"anahtar":[{"ornek":"logaritma","kok":"logari"},{"ornek":"kökler","kok":"kökler"},{"ornek":"denkleminde","kok":"denkle"},{"ornek":"şartında","kok":"şartın"},{"ornek":"çarpıma","kok":"çarpım"},{"ornek":"pozitif","kok":"poziti"}],"konuGiris":{"harita":"Ne zaman test edilir: logaritmalı toplam/fark ifadeleri tek logaritmaya indirilip üstel forma çevrilmesi istendiğinde test edilir. Nasıl ölçülür: bulunan köklerden tanım şartını (içler pozitif) sağlayanın seçilip istenen ifadede yerine konmasıyla ölçülür. Nasıl kaydedilir: sonuç, sağlanan kökün istenen cebirsel ifadeye (2x-1 gibi) yerine yazılmasıyla tek sayı olarak kaydedilir.","desen":"Sınav genelde iki logaritmayı toplatıp tek logaritmaya indirtir, sonra üstel forma çevirtir; tuzak, ikinci dereceden çıkan iki kökten tanım şartını bozanı elemeyi unutmaktır (p.28). Bazı sorular kökü değil, kökle kurulan başka bir ifadenin (2x-1 gibi) değerini sorar, bu da dikkatsizlikle bulunan kökün doğrudan cevap sanılmasına yol açar. Bu soru, tanım şartı kontrolü ve bulunan kökün istenen ifadeye yerleştirilmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Logaritma içindeki ifadenin pozitif olması gereken koşul","ad":"Tanım şartı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Logaritmanın hangi sayıya göre alındığını gösteren sabit","ad":"Taban (a)","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"log_a(x)=y ifadesinin a^y=x şeklindeki karşılığı","ad":"Üstel biçim","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Tanım şartını sağlayan, denklemi çözen sayı değeri","ad":"Geçerli kök","kim":"kanun sabitler"}],"sinavda":"Logaritmalı bir denklem verilir, x\u0027in tanım şartını sağlayan değeri bulunup istenen cebirsel ifadenin sonucu istenir.","panel_ornek":"Bir markette iki farklı indirim oranı üst üste uygulanınca son fiyat 27 TL oluyor; \u0027kaç TL indirim yapıldı\u0027 diye sorulduğunda önce hangi indirimin geçerli olduğunu (negatif fiyat çıkmayan) seçmen gerekir. Yanlış senaryoyu seçip toplarsan cevap 27 değil başka bir sayı çıkar. Burada \u0027geçerli olan\u0027 seçeneği bulmak, logaritmada tanım şartını kontrol etmekle aynı mantıktır.","ornek":"Bir markette iki farklı indirim oranı üst üste uygulanınca son fiyat 27 TL oluyor; \u0027kaç TL indirim yapıldı\u0027 diye sorulduğunda önce hangi indirimin geçerli olduğunu (negatif fiyat çıkmayan) seçmen gerekir. Yanlış senaryoyu seçip toplarsan cevap 27 değil başka bir sayı çıkar. Burada \u0027geçerli olan\u0027 seçeneği bulmak, logaritmada tanım şartını kontrol etmekle aynı mantıktır.","yontemler":"Logaritmaları toplama/çıkarma özellikleriyle tek logaritmaya indirip üstel forma çevir. Çıkan kökleri tanım şartında (içler pozitif) test edip geçersiz olanı at, geçerli kökü istenen ifadede kullan.","nedir":"Logaritma denklemi, log_a(x)=y ifadesinin üstel biçime çevrilerek çözüldüğü denklem türüdür. Sınav, tanım şartını (için pozitif olması) kontrol edip doğru kökü seçme becerisini ölçer."},"olay":"log₃[(x+2)(x-4)]=3 → (x+2)(x-4)=27 → x²-2x-35=0 → (x-7)(x+5)=0 → x=7 veya x=-5; x\u003e4 şartı yalnız x=7\u0027yi kabul eder → 2(7)-1=13.","tuzak":{"C":{"ad":"Soru Okuma Tuzağı","metin":"Denklem doğru çözülüp x=7 bulunsa da soru x değerini değil 2x-1 ifadesinin değerini sormaktadır. Doğrusu: bulunan kök istenen ifadeye yerleştirilmelidir."},"E":{"ad":"Toplama-Çarpma Karıştırma Tuzağı","metin":"log₃(x+2)+log₃(x-4) ifadesi yanlışlıkla log₃(2x-2) sanılıp 2x-2=27 çözülürse x=14,5 ve 2x-1=28 bulunur. Doğrusu: logaritma toplamı içlerin çarpımına eşittir, toplamına değil."},"A":{"ad":"Şart İhlali Tuzağı","metin":"İkinci dereceden denklemin kökü olan x=-5 değeri tanım şartı x\u003e4\u0027ü bozduğu için geçersizdir; yine de bu kök 2x-1 ifadesinde kullanılırsa -11 çıkar. Doğrusu: x=-5 atılır, yalnız x=7 kabul edilir."},"B":{"ad":"Kökleri Toplama Tuzağı","metin":"Denklemin iki kökü (7 ve -5) toplanıp x=2 sanılır ve bu değer 2x-1\u0027de kullanılırsa 3 bulunur. Doğrusu: şartı bozan kök baştan elenir, kökler toplanmaz."}},"celdiriciYol":{"C":"denklemi doğru çözüp x=7 buldun ama 2x-1 yerine doğrudan x\u0027i cevap yazdın = 7 (istenen ifadeyi karıştırdın)","E":"log3(x+2)+log3(x-4)=log3(2x-2) yanlış toplama → 2x-2=27 → x=14,5 → 2(14,5)-1 = 28 (logaritma toplamını içlerin toplamı sandın)","A":"2(-5)-1 = -11 (şartı bozan x=-5 kökünü elemeden kullandın)","B":"kökler toplamı 7+(-5)=2, 2(2)-1 = 3 (iki kökü toplayıp tek değer sandın)"},"hap":"Logaritma denkleminde bulunan kökler mutlaka tanım şartında (içler pozitif) sınanır, şartı bozan kök atılır; sonra soru neyi istiyorsa o hesaplanır.","teshis":{"C":{"gercek":"Soru kökü x değil, x yerine konduktan sonra hesaplanan 2x-1 ifadesinin sayısal değerini istemektedir.","ayirt":"Soru kökünde tam olarak hangi ifadenin değeri soruluyor?","paragraf":"Soru kökü okuma kuralı","yanilgi":"Denklemi doğru çözünce işin bittiğini, sorunun x\u0027i istediğini sanıyorsun."},"E":{"gercek":"log_a(xy)=log_a x+log_a y özelliği toplamı ÇARPIMA dönüştürür; log_a x+log_a y asla log_a(x+y) değildir.","ayirt":"İki logaritmayı birleştirirken içleri topluyor muyum, çarpıyor muyum?","paragraf":"Temel özellikler: log_a(xy)=log_a x+log_a y","yanilgi":"log_a x + log_a y toplamının log_a(x+y) olduğunu, yani logaritma içinde toplamın toplama dönüştüğünü sanıyorsun."},"A":{"gercek":"Logaritma denkleminde bulunan kökler mutlaka log içlerinin pozitif olması şartında sınanır; şartı bozan kök çözüm kümesinden atılır.","ayirt":"Bu kökü logaritmanın içine koysam negatif ya da sıfır çıkar mı?","paragraf":"Logaritma tanımı: a\u003e0, a≠1, x\u003e0 şartı","yanilgi":"İkinci dereceden denklemden çıkan her kökü otomatik olarak geçerli sanıyorsun."},"D":{"gercek":"log_a(xy)=log_a x+log_a y özelliği ile birleştirilen denklem üstel forma çevrilir, tanım şartını sağlayan tek kök işleme alınır.","ayirt":"Bulduğum kök hem şartı sağlıyor mu hem de istenen ifadeye doğru yerleştirildi mi?","paragraf":"Logaritma özellikleri ve çözüm adımları","yanilgi":"Bu şıkkı eleyen öğrenci, ya kökü doğru bulup yanlış ifadeye koyuyor ya da hatalı toplama-çarpma özelliği kullanıyor."},"B":{"gercek":"Denklem çözümünde geçersiz kök tamamen elenir, kalan tek kök hesaba sokulur; kökler toplanmaz.","ayirt":"Şartı bozan kökü sildikten sonra elimde kaç kök kaldı?","paragraf":"Çözüm adımları: kök eleme kuralı","yanilgi":"İki kökten birinin geçersiz olduğunu görsen de ikisini toplayıp tek bir \u0027ortalama\u0027 cevap üretebileceğini sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 14"},"kural":"log_a x + log_a y = log_a(xy) özelliğiyle birleştirilir, log_a(ifade)=n ise ifade=a^n olur, sonra tanım şartı x-1\u003e0 ve x+3\u003e0 kontrol edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 14","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Kökleri bulduktan sonra hemen şıklara bakmadan önce her kökü tanım şartına (x-1\u003e0, x+3\u003e0) tek tek yaz, şartı bozanı çiz.","konu":"logaritma denklemi","tablo":{"satirlar":[["VERİLENLER","-","-"],["denklem","log2(x-1) + log2(x+3) = 5","-"],["taban","2","-"],["eşitlik değeri","5","-"],["HESAP","-","-"],["Tanım şartı","X-1\u003e0 ve x+3\u003e0","X\u003e1"],["Logaritmaları birleştir","Log2[(x-1)(x+3)]=5","(x-1)(x+3)=32"],["Denklemi aç","X²+2x-3=32","X²+2x-35=0"],["Kökleri bul","(x+7)(x-5)=0","X=5 veya x=-7"],["Şartı uygula","X\u003e1 şartını sağlayan kök","X=5"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"5","E":"33","A":"-7","D":"15","B":"-2"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Logaritmaların toplama log₂(2x+2) sanılıp (toplama hatalı dönüştürüldü); içlerin çarpılması gerekir: log₂[(x−1)(x+3)].","E":"İkinci logaritmik terim atlanıp sadece log₂(x−1)=5 çözüldü; her iki terim önce birleştirilmeli, tek terimle çözüm eksiktir.","A":"Denklem iki kök verir (5 ve −7) ama tanım şartı x\u003e1\u0027i kontrol etmeden −7 seçildi; bu kök içi negatif yapar, geçersizdir.","B":"İki kök bulunup toplandı; soru \u0027kök\u0027 ister, kökler toplamını değil."},"dogru":"İki logaritmayı önce çarpım kuralıyla birleştir: log₂[(x−1)(x+3)]=5. Sonra üstel biçime çevir: (x−1)(x+3)=32. Denklemi çöz: x²+2x−35=0 → x=5 veya x=−7. Tanım şartı x\u003e1 olduğundan x=−7 atılır, cevap x=5.","sinav":"log_a(xy) = log_a x + log_a y özelliği ve log_a(ifade) = n ⟺ ifade = aⁿ kuralıyla logaritmik denklem çözülür; köklerin tanım şartı (içler pozitif) kontrol edilerek geçersiz kök atılır.","kavramlar":[{"kaynak":"TEORI","tanim":"Logaritmanın içi pozitif, tabanı pozitif ve 1\u0027den farklı olmalıdır; denklem çözümünden sonra kökler bu şartlarla kontrol edilip geçersiz kök atılır.","ad":"Logaritma tanım şartı"},{"kaynak":"TEORI","tanim":"Aynı tabanlı iki logaritmanın toplamı, içlerin çarpımının logaritmasına eşittir: log_a(x) + log_a(y) = log_a(xy).","ad":"Logaritmaların çarpım kuralı"},{"kaynak":"TEORI","tanim":"log_a(ifade) = n şeklindeki denklem, ifade = aⁿ biçimine dönüştürülerek cebirsel denkleme çevrilir.","ad":"Üstel biçime çevirme"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,2],[2,2],[3,1],[3,2],[4,1],[4,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["Tanım şartı","y-2\u003e0 ve y+4\u003e0","y\u003e2"],["Logaritmaları birleştir","Log3[(y-2)(y+4)]=3","(y-2)(y+4)=27"],["Denklemi aç","y²+2y-8=27","y²+2y-35=0"],["Kökleri bul","(y+7)(y-5)=0","y=5 veya y=-7"],["Şartı uygula","y\u003e2 şartını sağlayan kök","y=5"]]},"tur":"tablo","soru":"log₃(y−2) + log₃(y+4) = 3 eşitliğini sağlayan y değeri kaçtır?","verilen":[[1,1],[2,1]],"hedef":"Tabloyu doldur ve y\u0027nin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"log₂(x−1) + log₂(x+3) = 5 eşitliğini sağlayan x değeri kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-13","verilenler":[{"deger":"log2(x-1) + log2(x+3) = 5","anlam":"çözülmesi istenen logaritmik denklemin kendisi","ad":"denklem"},{"deger":"2","anlam":"logaritmanın tabanı; üstel forma çevirirken 2 üzeri değer alınır","ad":"taban"},{"deger":"5","anlam":"birleştirilmiş logaritmanın eşit olduğu sayı; 2 üzeri 5=32 hesabında kullanılır","ad":"eşitlik değeri"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Logaritma Denklemi Çözüm Adımları","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: log₂(x−1) + log₂(x+3) = 5 (soruda verilen)","anlatim":"Soru bize denklemi veriyor: log₂(x−1) + log₂(x+3) = 5. Bunu biz kurmadık, soru verdi.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Tanım şartı: x − 1 \u003e 0 ve x + 3 \u003e 0 → x \u003e 1","anlatim":"Logaritmanın içi negatif ya da sıfır olamaz, önce tanım şartını yazıyoruz. Bu şart olmadan bulacağımız kökü eleyemeyiz.","doldur":[[5,1],[5,2],[9,1],[9,2]]},{"formul":"log₂(x−1) + log₂(x+3) = log₂[(x−1)(x+3)] = 5 (soruda verilen)","anlatim":"log₂a + log₂b = log₂(a×b) kuralıyla iki logaritmayı tek logaritmaya indiriyoruz. Böylece denklem çözülebilir hâle gelir.","doldur":[]},{"formul":"(x−1)(x+3) = 2^5 = 32","anlatim":"log₂A = 5 ise A = 2⁵ demektir, logaritmadan kurtuluyoruz. Bu adım logaritmayı sayıya çeviren temel kuraldır.","doldur":[]},{"formul":"x² + 2x − 3 = 32 → x² + 2x − 35 = 0","anlatim":"Parantezleri açıp ikinci derece denklem haline getiriyoruz. Sağdaki 32\u0027yi sola atıp sıfıra eşitliyoruz.","doldur":[]},{"formul":"x² + 2x − 35 = 0 → (x + 7)(x − 5) = 0 → x = 5 veya x = −7","anlatim":"Denklemi çarpanlarına ayırıp kökleri buluyoruz. İki kök çıkıyor, ikisini de yazıyoruz.","doldur":[[7,1],[7,2],[8,1],[8,2]]},{"formul":"x \u003e 1 (1. adımda bulduk) şartına göre: x = 5 kalır, x = −7 elenir","anlatim":"1. adımda bulduğumuz x \u003e 1 şartını kontrol ediyoruz. x = −7 şartı bozar, elenir; x = 5 şartı sağlar.","doldur":[]},{"formul":"Yanlış yol: x = −7 (HATALI) → doğrusu x = 5 (6. adımda bulduk)","anlatim":"Yanlış yol: tanım şartını hiç kontrol etmeden x = −7\u0027yi de cevap yazmak. Doğrusu sadece x = 5\u0027tir çünkü diğer kök log içini negatif yapar.","doldur":[]}],"anahtar":[{"ornek":"logaritmalar","kok":"logari"},{"ornek":"denklem","kok":"denkle"},{"ornek":"şartında","kok":"şartın"},{"ornek":"kontrol","kok":"kontro"},{"ornek":"yazıyoruz","kok":"yazıyo"},{"ornek":"negatif","kok":"negati"}],"konuGiris":{"harita":"Ne zaman test edilir: iki logaritmalı ifade toplanıp tek denkleme indirgenmesi istendiğinde test edilir. Nasıl ölçülür: tanım şartının (içler pozitif) sağlanıp sağlanmadığına bakılarak ölçülür. Nasıl kaydedilir: bulunan kökler arasından şartı bozanlar elenip yalnız geçerli kök yazılır.","desen":"Sınav genelde iki logaritmayı çarpıma dönüştürüp ikinci derece denklem üretir ve iki kök çıkar; öğrenci tanım şartını unutup negatif kökü de yazınca hataya düşer (p.28). Bazı sorular köklerin toplamını değil sadece geçerli tek kökü sorar, bu ayrım kaçırılır. Bu soru tanım şartıyla kök eleme noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Logaritmanın içinin pozitif, tabanının pozitif ve 1\u0027den farklı olması gereği","ad":"Tanım şartı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Logaritmanın hangi sayıya göre alındığını gösteren sabit değer","ad":"Taban","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"log_a(x)=y ifadesinin a^y=x biçimine çevrilmesi","ad":"Üstel dönüşüm","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Cebirsel çözümden çıkan, tanım şartını bozmayan değer","ad":"Geçerli kök","kim":"kanun sabitler"}],"sinavda":"Soruda iki logaritmalı terimin toplamı ve sonuç sayısı verilir, istenen x değerinin bulunmasıdır.","panel_ornek":"İkinci el bir telefonun fiyatı her ay aynı oranda artıyor ve kaç ay sonra belli bir fiyata ulaşacağını bulman isteniyor. Bu tür \u0027kaç ay sonra\u0027 sorularını çözerken üstel ifadeyi logaritmaya çevirirsin. Örneğin fiyat 2 katına çıkarken geçen ay sayısını log ile bulursun.","ornek":"İkinci el bir telefonun fiyatı her ay aynı oranda artıyor ve kaç ay sonra belli bir fiyata ulaşacağını bulman isteniyor. Bu tür \u0027kaç ay sonra\u0027 sorularını çözerken üstel ifadeyi logaritmaya çevirirsin. Örneğin fiyat 2 katına çıkarken geçen ay sayısını log ile bulursun.","yontemler":"Aynı tabanlı logaritmaları çarpım özelliğiyle birleştirip üstel forma geçirmek tek yöntemdir; en kritik kural bulunan kökü tanım şartında (içler pozitif) denemektir.","nedir":"Logaritma denklemi, log_a(x)=y ⇔ a^y=x tanımına dayanarak bilinmeyeni bulmayı ister. Sınav, öğrencinin logaritma özelliklerini kullanıp geçerli kökü tanım şartıyla süzebilmesini ölçer."},"olay":"log2[(x-1)(x+3)]=5 → (x-1)(x+3)=32 → x²+2x-35=0 → (x+7)(x-5)=0 → x=5 veya x=-7; şart x\u003e1 olduğundan x=-7 atılır.","tuzak":{"D":{"ad":"Toplamı Çarpım Sanma Tuzağı","metin":"log_a x + log_a y ifadesi log_a(xy) yerine log_a(x+y) sanılarak log2(2x+2)=5 → 2x+2=32 → x=15 bulundu. Doğrusu: logaritmaların toplamı içlerin çarpımına eşittir, toplamına değil."},"E":{"ad":"Terim Atlama Tuzağı","metin":"iki logaritmik terimden yalnız biri çözülüp diğeri denklemde yokmuş gibi işlem yapıldı, log2(x-1)=5 → x-1=32 → x=33 bulundu. Doğrusu: her iki terim önce birleştirilmeli, tek terim üzerinden çözüm yapılmaz."},"A":{"ad":"Şart İhlali Tuzağı","metin":"x²+2x-35=0 denkleminin iki kökü olan 5 ve -7\u0027den, tanım şartı x\u003e1 kontrol edilmeden -7 seçildi. Doğrusu: -7 kökü x-1\u003e0 şartını bozduğu için atılır, geçerli kök 5\u0027tir."},"B":{"ad":"Kökler Toplamı Tuzağı","metin":"Soru \u0027kökü\u0027 sorarken denklemin iki kökü (5 ve -7) toplanıp -2 bulundu. Doğrusu: soru tek geçerli kökü ister, kökler toplamı sorulmamıştır."}},"celdiriciYol":{"D":"log2[(x-1)+(x+3)]=5 → 2x+2=32 → x=15 (toplam çarpım yerine toplama alındı)","E":"log2(x-1)=5 → x-1=32 → x=33 (ikinci logaritmik terim ihmal edildi)","A":"x²+2x-35=0 kökleri x=5 ve x=-7; şart kontrolü atlanıp -7 seçildi = -7 (tanım şartı kontrol edilmedi)","B":"5 + (-7) = -2 (geçerli ve atılan kökler toplandı)"},"hap":"Logaritmalar toplanınca içler çarpılır, denklem üstel forma çevrilir ve bulunan kökler tanım şartında (içler pozitif) mutlaka sınanır.","teshis":{"C":{"gercek":"log_a(x)+log_a(y)=log_a(xy) özelliğiyle birleştirilip üstel forma çevrilir, ardından tanım şartı x\u003e1 kontrol edilerek x=5 bulunur.","ayirt":"Bulduğum kökü tanım şartında (içler pozitif mi) denedim mi?","paragraf":"Temel özellikler ve çözüm adımları","yanilgi":"Bu şıkkı eleyen öğrenci genelde şart kontrolünü atlayıp -7\u0027yi de geçerli sanarak tereddüde düşer."},"E":{"gercek":"Denklemdeki tüm logaritmik terimler önce tek bir logaritmada birleştirilmeli, sonra üstel forma geçilmelidir.","ayirt":"Denklemdeki her terimi çözüme kattım mı?","paragraf":"Çözüm adımı 2","yanilgi":"Denklemdeki iki logaritmik terimden birini göz ardı edip tek terimle çözüm yaptığını fark etmiyorsun."},"A":{"gercek":"Logaritmanın içi pozitif olmalıdır; kökler bulunduktan sonra tanım şartına (x\u003e1) uymayan kök atılır.","ayirt":"Bu kökü tanım şartında (x-1\u003e0, x+3\u003e0) denedim mi?","paragraf":"Logaritma tanımı ve çözüm adımı 5","yanilgi":"İkinci dereceden denklemin verdiği her kökün otomatik olarak geçerli olduğunu sanıyorsun."},"D":{"gercek":"log_a(xy) = log_a x + log_a y kuralı geçerlidir; toplam çarpıma dönüşür, log_a(x+y) DEĞİLDİR.","ayirt":"İki logaritmayı birleştirirken içleri çarptım mı, topladım mı?","paragraf":"Temel özellikler","yanilgi":"log_a x + log_a y toplamının, içlerin toplamının logaritması olduğunu sanıyorsun."},"B":{"gercek":"Soru \u0027x değeri\u0027 istemektedir; şartı sağlayan tek kök cevaptır, iki kökün toplamı değildir.","ayirt":"Soru bana kaç kök istiyor, tek kök mü toplam mı?","paragraf":"Çözüm adımları 4-5","yanilgi":"Denklemin verdiği iki kökü, sorunun tek bir kök istediğini unutup birbirine ekliyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 14"},"kural":"Çarpım kuralı f′=u′v+uv′ ile u=(x+2)², v=ax+1 alınır; u′=2(x+2), v′=a.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 14","sonDonem":3,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Çarpım ve zincir kuralını ayrı ayrı yaz, sadeleştirmeden önce noktayı yerine koyma hatasından kaçın.","konu":"türev hesabı","tablo":{"satirlar":[["VERİLENLER","-","-"],["f(x) fonksiyonu","(x+2)²·(ax+1)","-"],["f′(1) değeri","51","-"],["HESAP","-","-"],["U=(x+2)², u\u0027=2(x+2)","X=1 için","U=9, u\u0027=6"],["V=ax+1, v\u0027=a","X=1 için","V=a+1, v\u0027=a"],["F\u0027(x)=u\u0027v+uv\u0027","6(a+1)+9a","15a+6"],["F\u0027(1)=51 denklemi","15a+6=51","A=3"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"6","E":"11,75","A":"3","D":"7,5","B":"4"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["U=(x+3)², u\u0027=2(x+3)","X=1 için","U=16, u\u0027=8"],["V=bx+1, v\u0027=b","X=1 için","V=b+1, v\u0027=b"],["G\u0027(x)=u\u0027v+uv\u0027","8(b+1)+16b","24b+8"],["G\u0027(1)=97 denklemi","24b+8=97","B=3,7083"]]},"tur":"tablo","soru":"g(x) = (x + 3)² · (bx + 1) fonksiyonu için g′(1) = 97 olduğuna göre, b sabiti (b pozitif gerçek sayı) kaçtır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve b\u0027nin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f(x) = (x + 2)² · (ax + 1) fonksiyonu için f′(1) = 51 olduğuna göre, a sabiti (a pozitif gerçek sayı) kaçtır?","kayitBaslik":"","id":"sgs-t3-mat-cokzor/kp-04","verilenler":[{"deger":"(x+2)²·(ax+1)","anlam":"Türevi alınacak fonksiyon; a bilinmeyen sabit katsayıdır.","ad":"f(x) fonksiyonu"},{"deger":"51","anlam":"Fonksiyonun x=1 noktasındaki türev değeri; a\u0027yı bulmak için kurulan denklemin sağ tarafıdır.","ad":"f′(1) değeri"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Türev Hesabı (çarpım kuralı ve zincir kuralı)","dogru":"A","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: f(x) = (x+2)² × (ax+1) (soruda verilen); f′(1) = 51 (soruda verilen); a pozitif gerçek sayı (soruda verilen)","anlatim":"Soru bize şunları vermiş: f(x) = (x+2)² · (ax+1) fonksiyonu ve f′(1) = 51 koşulu. Bizden a sabitini bulmamız isteniyor.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"u = (x+2)² → u′ = 2(x+2)","anlatim":"Çarpım kuralı nedir? İki fonksiyonun çarpımını türetirken f′ = u′v + uv′ formülü kullanılır. Burada u = (x+2)² ve v = ax+1 seçiyoruz çünkü fonksiyon bu iki parçanın çarpımı.","doldur":[]},{"formul":"U = (1+2)² = 9; u′ = 2(1+2) = 6","anlatim":"Şimdi u ve u′ değerlerini x=1 için hesaplıyoruz. Bu adım sonraki çarpım kuralı formülünde direkt kullanılacak.","doldur":[]},{"formul":"V = a(1)+1 = a + 1; v′ = a","anlatim":"v = ax+1 fonksiyonunun türevi sabit çarpandır, çünkü ax+1 doğrusal bir ifade. x=1 için v ve v′ değerlerini yazıyoruz.","doldur":[]},{"formul":"F′(1) = u′v + uv′ = 6 (2. adımda bulduk) × (a + 1) (3. adımda bulduk) + 9 (2. adımda bulduk) × a (3. adımda bulduk) = 6(a+1) + 9a = 15a + 6","anlatim":"Şimdi çarpım kuralını uyguluyoruz: f′(x) = u′v + uv′. Bulduğumuz u, u′, v, v′ değerlerini yerine koyuyoruz.","doldur":[]},{"formul":"15a + 6 = 51 (soruda verilen) → 15a = 45 → a = 45 / 15 = 3","anlatim":"f′(1) = 51 koşulunu kuruyoruz, çünkü soru bu değeri veriyor. Denklemi çözerek a\u0027yı buluyoruz.","doldur":[[7,1],[7,2]]},{"formul":"Sonuç: a = 3","anlatim":"Sonuç: a sabiti 3\u0027tür. Bu değer pozitif gerçek sayı koşulunu da sağlıyor.","doldur":[]},{"formul":"Yanlış yol: 9a + 6 = 51 → a = 5 (HATALI) → doğrusu 15a + 6 = 51 → a = 3 (6. adımda bulduk)","anlatim":"En sık hata: çarpım kuralında u′v ve uv′ terimlerinden birini unutup yalnız uv′ ya da u′v ile işlem yapmak. Bu, denklemi 9a+6=51 ya da 6a+6=51 gibi yanlış kurar ve a=5 veya a=7,5 gibi hatalı sonuç verir.","doldur":[]}],"anahtar":[{"ornek":"çarpım","kok":"çarpım"},{"ornek":"kuralı","kok":"kuralı"},{"ornek":"fonksiyonu","kok":"fonksi"},{"ornek":"değerlerini","kok":"değerl"},{"ornek":"koşulu","kok":"koşulu"},{"ornek":"denklemde","kok":"denkle"}],"konuGiris":null,"olay":"x=1\u0027de u=9, u′=6, v=a+1; f′(1)=6(a+1)+9a=15a+6=51 → 15a=45 → a=3.","tuzak":{"C":{"ad":"Katsayı Unutma Tuzağı","metin":"(ax+1) ifadesinin türevini a yerine 1 alarak 6(a+1)+9=6a+15=51 denklemiyle a=6 bulmuşsun. Doğrusu: (ax+1)\u0027in türevi a\u0027dır, doğru a değeri 3\u0027tür."},"E":{"ad":"Yanlış Nokta Tuzağı","metin":"f′(x) fonksiyonuna x=1 yerine x=0 yazarak 4+4a=51 denklemiyle a=11,75 bulmuşsun. Doğrusu: Soruda istenen nokta x=1\u0027dir, doğru a değeri 3\u0027tür."},"D":{"ad":"Eksik Çarpım Kuralı Tuzağı","metin":"Çarpım kuralının ikinci terimini (u·v\u0027) atlayarak yalnızca 6(a+1)=51 denklemiyle a=7,5 bulmuşsun. Doğrusu: Çarpım kuralında iki terim de toplanır, doğru a değeri 3\u0027tür."},"B":{"ad":"Zincir Kuralı Eksikliği Tuzağı","metin":"(x+2)²\u0027nin türevini iç fonksiyonun türevini çarpmadan (x+2) olarak almışsın, bu da 3(a+1)+9a=12a+3=51 denklemiyle a=4 sonucunu verir. Doğrusu: (x+2)²\u0027nin türevi 2(x+2)\u0027dir, doğru a değeri 3\u0027tür."}},"celdiriciYol":{"C":"6(a+1) + 9(1) = 6a + 15 = 51 → a = 6 (ax+1 ifadesinin türevinde a katsayısını unuttun, v\u0027=1 aldın)","E":"4 + 4a = 51 → a = 11,75 (türevi x=1 yerine x=0 noktasında hesapladın)","D":"6(a+1) = 51 → a = 7,5 (çarpım kuralında u·v\u0027 terimini atladın)","B":"3(a+1) + 9a = 12a + 3 = 51 → a = 4 (zincir kuralında iç türevin 2 çarpanını unuttun)"},"hap":"Türevde \u0027ters soru\u0027 tipinde önce doğru türev kuralları (çarpım/zincir) eksiksiz uygulanır, sonra verilen türev değeri denklemde yerine konularak bilinmeyen bulunur.","teshis":{"C":{"gercek":"(ax+1)\u0027in türevi a\u0027dır; x\u0027in katsayısı türevde sabit çarpan olarak kalır.","ayirt":"x\u0027in önündeki katsayıyı türevde çarpan olarak yazdım mı?","paragraf":"Sabitle çarpım kuralı","yanilgi":"(ax+1) ifadesinin türevinin her zaman 1 olduğunu, x\u0027in önündeki a katsayısının türevi etkilemediğini düşündün."},"E":{"gercek":"Noktadaki türev, türev fonksiyonuna SORUDA VERİLEN x değeri (burada x=1) yazılarak bulunur.","ayirt":"Soruda istenen x değerini mi kullandım?","paragraf":"Noktada türev hesabı","yanilgi":"Türev fonksiyonunu bulduktan sonra soruda istenen noktayı değil, rastgele/kolay bir x değeri kullanabileceğini sandın."},"A":{"gercek":"Çarpım kuralı f′=u′v+uv′ iki terimi de içerir; x=1 için 15a+6=51 çözülünce a=3 çıkar.","ayirt":"İki terimi de yazdım mı?","paragraf":"Türev - çarpım kuralı","yanilgi":"Çarpım kuralının iki teriminin de mutlaka yazılması gerektiğini unutup daha kısa bir yol aramışsın."},"D":{"gercek":"Çarpım kuralı f′=u′v+uv′ şeklindedir, her iki terim de mutlaka toplanır.","ayirt":"Çarpım kuralında iki terimi de yazdım mı?","paragraf":"Çarpım kuralı","yanilgi":"Çarpım kuralında yalnızca birinci terimin (u′v) yeterli olduğunu, ikinci terimi (uv′) hesaba katmanın gereksiz olduğunu düşündün."},"B":{"gercek":"(x+2)²\u0027nin türevi 2(x+2)\u0027dir, iç türev katsayısı zincir kuralında asla atlanamaz.","ayirt":"Üssü indirdikten sonra iç fonksiyonun türevini çarptım mı?","paragraf":"Zincir kuralı","yanilgi":"Zincir kuralında iç fonksiyonun türevini çarpmaya gerek olmadığını, (x+2)²\u0027nin türevinin doğrudan (x+2) olduğunu sandın."}},"verilen":[[1,1],[2,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 8"},"kural":"ardışık yüzde indirimlerinde her indirim bir önceki sonuç üzerinden ayrı çarpan olarak uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 8","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"İndirimleri tek tek, bir önceki adımın sonucunu taban alarak çarpanla uygula; toplama yapma.","konu":"yüzde problemi","tablo":{"satirlar":[["VERİLENLER","-"],["Etiket fiyatı","2.000 TL"],["Birinci indirim oranı","%20"],["İkinci indirim oranı","%10"],["HESAP","-"],["%20 indirim sonrası fiyat (2.000 × 0,80)","1.600"],["%10 indirim sonrası fiyat / SONUÇ (1.600 × 0,90)","1.440"]],"basliklar":["İşlem","Tutar"]},"siklar":{"C":"1.600","E":"2.400","A":"1.400","D":"1.800","B":"1.440"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Sadece ilk %20 indirimi uygulanmış, ikinci %10 indirimi hesaba katılmamış; her indirim bir önceki sonuç üzerinden ayrıca hesaplanmalıdır.","E":"Zam çarpanı %120 kullanılmış, fiyat artırılmış; indirimde çarpan %80 (1 − 0,20) olmalı, zam çarpanı değil.","D":"Sadece ikinci %10 indirimi etiket fiyatı üzerinden uygulanmış, ilk indirim atlanmış; sıra ile birinci, sonra ikinci indirim yapılmalıdır.","A":"%20 ve %10 indirimleri toplayıp %30 tek seferde uygulamış; ardışık indirimler çarpanlar sırayla çarpılarak yapılır."},"dogru":"Malın fiyatı önce %20 indirimle 2.000\u0027den 1.600\u0027e düşer. Sonra bu 1.600 üzerine %10 indirim uygulanır ve 1.440 bulunur. İki indirimi ayrı ayrı, sırayla çarpmak gerekir.","sinav":"Ardışık yüzde indirimlerinde her indirim bir önceki sonuç üzerinden çarpan olarak uygulanır; yüzdeler topla  fiyattan mı başladım?","paragraf":"TESMER SGS Matematik Ders Notu – Ardışık İndirim Kuralı","yanilgi":"İkinci indirimi etiket fiyatı üzerinden uygulayıp ilk indirimi atlanabilir sanıyorsun."},"B":{"gercek":"İki ayrı yüzde indirimi sırayla, her biri bir önceki sonuç üzerinden çarpan olarak uygulanır: 2.000×0,80×0,90 = 1.440.","ayirt":"İki indirimi de, birbiri üzerine sırayla uyguladım mı?","paragraf":"TESMER SGS Matematik Ders Notu – Ardışık İndirim Kuralı","yanilgi":"Bu şıkkı eleyenler genelde tek indirimin yeterli olacağını sanıp ikinci adımı atlamıştır."}},"verilen":[[5,0],[5,1],[1,1],[2,1],[3,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 8"},"kural":"Satış=Maliyet×(1+kâr oranı), KDV dahil fiyat=Satış×(1+KDV oranı), ardışık indirimler tek çarpanda birleşir (1-a)(1-b), Etiket=KDV dahil fiyat/çarpan.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 8","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Çok katmanlı yüzde sorularında işlemleri kâr→KDV→indirim sırasıyla ayrı satırlarda hesapla, her satırın tabanını bir önceki sonuçtan al.","konu":"yüzde problemi","tablo":{"satirlar":[["VERİLENLER","-","-"],["Maliyet","760 TL","-"],["Kâr oranı","%25","-"],["KDV oranı","%20","-"],["İndirim oranları","%20 ve %5","-"],["HESAP","-","-"],["Net satış fiyatı","760 x 1,25","950"],["KDV dahil satış fiyatı","950 x 1,20","1.140"],["Ardışık indirim çarpanı","0,80 x 0,95","0,76"],["Etiket fiyatı (SONUÇ)","1.140 / 0,76","1.500"]],"basliklar":["Adım","Hesap","Tutar (TL)"]},"siklar":{"C":"1425","E":"1520","A":"1200","D":"1500","B":"1250"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Ardışık iki indirimden yalnızca %20\u0027yi dikkate alıp 1.140\u0027ı 0,80\u0027e böldüğü için 1.425 buldu; %5 indirimini unutmuş, her iki çarpan (0,80 × 0,95 = 0,76) birlikte kullanılmalı.","E":"Ardışık %20 ve %5 indirimleri toplayıp tek %25 indirim olarak (1.140 ÷ 0,75) işlem yaptığı için 1.520 buldu; ardışık yüzdeler çarpılır, toplanmaz.","A":"Kârı atlayıp KDV\u0027yi doğrudan maliyet üzerinden (760 × 1,20 = 912) hesapladıktan sonra indirime böldüğü için 1.200 buldu; kâr adımı eksik.","B":"KDV eklemeyi unutup net satış fiyatını (950) indirim çarpanına (0,76) böldüğü için 1.250 buldu; KDV dahil fiyat (1.140) kullanılması gerekir."},"dogru":"Maliyete %25 kâr eklenirse satış fiyatı 950 TL olur. Buna %20 KDV eklenir, KDV dahil fiyat 1.140 TL. Etiket fiyatından %20 ve %5 ardışık indirimler uygulanarak 1.140 TL\u0027ye ulaşıldığından, etiket fiyatı 1.500 TL\u0027dir.","sinav":"Yüzde Problemi (İndirim) teorisinde, ardışık yüzdeler çarpılarak uygulanır ve kâr yüzdesi maliyet üzerinden hesaplanır.","kavramlar":[{"kaynak":"TEORI","tanim":"Satış fiyatından maliyet çıkarılıp maliyet üzerinden hesaplanan oran; satış = maliyet × (1 + kâr oranı) formülüyle bulunur.","ad":"Kâr yüzdesi"},{"kaynak":"TEORI","tanim":"Bir fiyata sırayla uygulanan birden çok indirim; bu indirimler toplanmaz, çarpan olarak birlikte çarpılır (örneğin %20 sonra %10 indirim = 0,8 × 0,9 = 0,72).","ad":"Ardışık indirimler"},{"kaynak":"TEORI","tanim":"İndirim uygulanmadan önce belirlenen ve mal üzerine yazılan fiyat; indirimli satış fiyatına ulaşmak için etiket fiyatı indirim çarpanına bölünür.","ad":"Etiket fiyatı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,2],[2,2],[3,1],[3,2]],"tablo":{"basliklar":["Adım","Hesap","Tutar (TL)"],"satirlar":[["Net satış fiyatı","900 x 1,30","1.170"],["KDV dahil satış fiyatı","1.170 x 1,10","1.287"],["Ardışık indirim çarpanı","0,75 x 0,90","0,675"],["Etiket fiyatı (SONUÇ)","1.287 / 0,675","1.907"]]},"tur":"tablo","soru":"Bir işletme, maliyeti 900 TL olan malı maliyet üzerinden %30 kârla satmakta, satış fiyatına %10 KDV eklemektedir. Bu KDV dahil fiyata, etiket fiyatı üzerinden ardışık uygulanan %25 ve %10 indirimlerle ulaşılmaktadır. Buna göre malın etiket fiyatı kaç TL\u0027dir?","verilen":[[0,1],[1,1],[2,1]],"hedef":"Tabloyu doldur ve malın etiket fiyatının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir işletme, maliyeti 760 TL olan malı maliyet üzerinden %25 kârla satmakta, satış fiyatına %20 KDV eklemektedir. Bu KDV dahil fiyata, etiket fiyatı üzerinden ardışık uygulanan %20 ve %5 indirimlerle ulaşılmaktadır. Buna göre malın etiket fiyatı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-15","verilenler":[{"deger":"760 TL","anlam":"Malın maliyet bedeli; kâr hesaplamasının tabanıdır.","ad":"Maliyet"},{"deger":"%25","anlam":"Maliyet üzerinden uygulanan kâr yüzdesi; net satış fiyatını verir.","ad":"Kâr oranı"},{"deger":"%20","anlam":"Net satış fiyatına eklenen katma değer vergisi oranı.","ad":"KDV oranı"},{"deger":"%20 ve %5","anlam":"Etiket fiyatı üzerinden ardışık uygulanan iki indirim oranı.","ad":"İndirim oranları"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Yüzde Problemi (ardışık indirim, kâr-zarar)","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: Maliyet 760 TL (soruda verilen); Kâr oranı %25 (soruda verilen); KDV oranı %20 (soruda verilen); İndirim 1 %20 (soruda verilen); İndirim 2 %5 (soruda verilen)","anlatim":"Soru bize şunları vermiş: maliyet 760 TL; kâr oranı %25; KDV oranı %20; ardışık indirim oranları %20 ve %5. İstenen: etiket fiyatı.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Net Satış Fiyatı = Maliyet × (1 + Kâr Oranı) = 760 (soruda verilen) × 1,25 (soruda verilen) = 950 TL","anlatim":"Önce maliyete kârı ekleyip net satış fiyatını buluyoruz. Kâr maliyet üzerinden hesaplandığı için 760\u0027ı 1,25 ile çarpıyoruz.","doldur":[[6,1],[6,2],[7,1]]},{"formul":"KDV Dahil Fiyat = Net Satış Fiyatı × (1 + KDV Oranı) = 950 (1. adımda bulduk) × 1,20 (soruda verilen) = 1.140 TL","anlatim":"Satış fiyatına KDV ekleniyor, bu yüzden 950\u0027yi 1,20 ile çarpıyoruz. Sonuç bize KDV dahil satış fiyatını verir.","doldur":[[7,2],[9,1]]},{"formul":"Ardışık İndirim Çarpanı = (1 − İndirim1) × (1 − İndirim2) = 0,80 (soruda verilen) × 0,95 (soruda verilen) = 0,76","anlatim":"Ardışık iki indirim tek bir çarpanda birleşir, ayrı ayrı uygulamak yerine çarpanları çarparız. Bu bize etiket fiyatından ne kadarının kaldığını gösteren tek katsayıyı verir.","doldur":[[8,1],[8,2]]},{"formul":"Etiket Fiyatı = KDV Dahil Fiyat / Ardışık İndirim Çarpanı = 1.140 (2. adımda bulduk) / 0,76 (3. adımda bulduk) = 1.500 TL","anlatim":"Etiket fiyatı, indirimler uygulandıktan sonra KDV dahil fiyata ulaştığımız başlangıç değeridir. Bu yüzden KDV dahil fiyatı çarpana bölüyoruz.","doldur":[[9,2]]},{"formul":"SONUÇ: Etiket Fiyatı = 1.500 TL","anlatim":"Sonuç: malın etiket fiyatı 1.500 TL\u0027dir. Bu değer, indirimlerden önceki ilk fiyattır.","doldur":[]},{"formul":"Yanlış yol: 1.140 × (1 − %25) = 855 (HATALI) → doğrusu 1.140 / 0,76 = 1.500 (5. adımda bulduk)","anlatim":"En sık hata: öğrenci ardışık indirimleri toplayıp %25 tek indirim gibi uygular. Bu yanlıştır, çünkü ikinci indirim birinciden kalan tutara uygulanır, çarpanlar toplanmaz.","doldur":[]}],"anahtar":[{"ornek":"indirim","kok":"indiri"},{"ornek":"fiyatı","kok":"fiyatı"},{"ornek":"çarpan","kok":"çarpan"},{"ornek":"ardışık","kok":"ardışı"},{"ornek":"etiket","kok":"etiket"},{"ornek":"maliyet","kok":"maliye"}],"konuGiris":{"harita":"Ne zaman test edilir: kâr, KDV ve ardışık indirimlerin birlikte geçtiği bir fiyat zincirinde, geriye doğru etiket fiyatı sorulduğunda. Nasıl ölçülür: her adımda doğru tabanı seçip yüzdeleri çarpan olarak zincirleyip zincirin tersine giderek. Nasıl kaydedilir: sonuç tek bir TL tutarı olarak, ara adımlar ayrı yazılmaz.","desen":"Soru, maliyet-kâr-KDV zincirini kurdurup sonra bu tutara ardışık iki indirimle ulaşılan etiket fiyatını geriye doğru buldurur; tuzak, indirimleri toplayıp ilk fiyatı çarpanla değil bölerek bulmayı unutmaktır. Kaynaktaki \u0027ardışık indirimler çarpılır, toplanmaz\u0027 ve \u0027indirimli fiyattan etikete dönerken (1-p) ile bölünür\u0027 kuralları burada birlikte çalışır (bkz. yüzde problemi indirim, p.28). Bu soru ardışık indirim ve maliyet üzerinden kâr kuralının birlikte uygulanması noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Satış fiyatının maliyete oranlanan kâr yüzdesiyle büyütülmüş hâli","ad":"Maliyet üzerinden kâr","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Satış fiyatına eklenen, kanunla sabit yüzde","ad":"KDV oranı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Birbirini izleyen indirim oranlarının çarpım hâline getirilmiş katsayısı","ad":"Ardışık indirim çarpanı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"İndirimlerin uygulandığı, en baştaki ilan edilen taban tutar","ad":"Etiket fiyatı","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Maliyet, kâr oranı, KDV oranı ve iki ardışık indirim oranı verilir; etiket fiyatı istenir.","panel_ornek":"İkinci el bir telefonun etiket fiyatı 300 TL; önce %10 sonra %5 indirim yapılıyor ve son fiyat 256,5 TL oluyor. Buradaki iş, iki indirimi TOPLAMAK değil, 0,90 ile 0,95\u0027i ÇARPMAKtır; aksi hâlde yanlış çıkar.","ornek":"İkinci el bir telefonun etiket fiyatı 300 TL; önce %10 sonra %5 indirim yapılıyor ve son fiyat 256,5 TL oluyor. Buradaki iş, iki indirimi TOPLAMAK değil, 0,90 ile 0,95\u0027i ÇARPMAKtır; aksi hâlde yanlış çıkar.","yontemler":"Önce maliyetten KDV dahil satış fiyatına ileri yönde gidilir, sonra bu tutar ardışık indirim çarpanına bölünerek etikete geriye dönülür; en kritik kural indirimlerin çarpan olarak (1-p1)(1-p2) şeklinde birlikte kullanılmasıdır.","nedir":"Yüzde problemi, bir tutarın ardışık indirim, zam ve kâr oranlarıyla nasıl değiştiğini bulmayı sağlar. Sınav, tabanı doğru seçip yüzdeleri çarpan olarak zincirleme uygulayabildiğini ölçer."},"olay":"760x1,25=950; 950x1,20=1.140; 0,80x0,95=0,76; 1.140/0,76=1.500.","tuzak":{"C":{"ad":"Eksik İndirim Tuzağı","metin":"Ardışık iki indirimden yalnızca %20\u0027lik ilkini dikkate alıp 1.140\u0027ı 0,80\u0027e böldün, %5\u0027lik ikinci indirimi unuttun. Doğrusu: Her iki indirim çarpanı (0,80x0,95=0,76) birlikte kullanılmalıdır."},"E":{"ad":"Yüzde Toplama Tuzağı","metin":"Ardışık %20 ve %5 indirimleri topladın (%25) ve 1.140\u0027ı 0,75\u0027e böldün, oysa ardışık yüzdeler çarpılır. Doğrusu: Doğru çarpan 0,80x0,95=0,76 olup etiket fiyatı bu şekilde bulunmalıdır."},"A":{"ad":"Kâr Atlama Tuzağı","metin":"Kârı hesaba katmadan KDV\u0027yi doğrudan maliyet üzerinden (760x1,20=912) hesaplayıp indirim çarpanına (0,76) böldün. Doğrusu: Önce maliyete kâr eklenip net satış fiyatı bulunmalı, KDV ondan sonra hesaplanmalıdır."},"B":{"ad":"KDV Atlama Tuzağı","metin":"Net satış fiyatını (950) doğrudan indirimli fiyat sayıp 0,76\u0027ya böldün, KDV eklemeyi atladın. Doğrusu: KDV dahil fiyat (1.140 TL) indirim çarpanına bölünerek etiket fiyatı bulunur."}},"celdiriciYol":{"C":"950x1,20=1140; 1140/0,80=1425 (ikinci indirimi unuttun)","E":"950x1,20=1140; 1140/0,75=1520 (ardışık indirimleri topladın)","A":"760x1,20=912; 912/0,76=1200 (kâr katmanını atlayıp KDV\u0027yi maliyete uyguladın)","B":"760x1,25=950; 950/0,76=1250 (KDV eklemeyi atladın)"},"hap":"Ardışık yüzde işlemleri (kâr, KDV, indirim) çarpan olarak zincirlenir; her katman bir öncekinin sonucunu baz alır, hiçbiri atlanamaz ve yüzdeler toplanmaz.","teshis":{"C":{"gercek":"Ardışık indirimler çarpanları çarpılarak (0,80x0,95=0,76) birlikte uygulanır, tek indirimle sonuç bulunamaz.","ayirt":"Sorudaki iki indirim oranının ikisini de çarpana kattım mı?","paragraf":"Ardışık indirim kuralı","yanilgi":"Ardışık indirimlerden yalnızca ilkini uygulamanın yeterli olduğunu, ikincisinin ayrıca hesaba katılmayabileceğini düşünüyorsun."},"E":{"gercek":"Ardışık yüzde değişimlerde oranlar TOPLANMAZ, çarpanlar çarpılır; %20 ve %5 indirim toplamda %25 değil %24\u0027tür.","ayirt":"İki indirimi toplayıp tek yüzde mi yazdım, yoksa çarpanları mı çarptım?","paragraf":"Ardışık indirim kuralı","yanilgi":"Ardışık iki indirimin toplamının tek bir indirim oranına eşit olduğunu düşünüyorsun."},"A":{"gercek":"Yüzde artış işlemlerinde her katman bir öncekinin SONUCUNU baz alır; KDV net satış fiyatına eklenir, maliyete değil.","ayirt":"KDV\u0027yi eklediğim tutar zaten kâr eklenmiş net satış fiyatı mı?","paragraf":"Yüzde artış/azalış zinciri kuralı","yanilgi":"Kâr eklemeyi gereksiz sanıp KDV\u0027yi doğrudan maliyet üzerinden hesaplanabileceğini düşünüyorsun."},"D":{"gercek":"Yüzde artış: Yeni=Eski×(1+p/100); ardışık yüzdeler çarpılır, toplanmaz; taban her katmanda değişir.","ayirt":"Her katmanı sırasıyla, bir öncekinin sonucunu baz alarak mı işledim?","paragraf":"Yüzde problemi - ardışık indirim ve kâr-zarar teorisi","yanilgi":"Bu kadar çok katmanlı bir soruda tek bir adımı atlayınca da doğru sonuca ulaşılabileceğini sanan öğrenci bu şıkkı eler."},"B":{"gercek":"Satış fiyatına ayrıca KDV eklenir; indirim çarpanına bölünecek fiyat KDV DAHİL fiyattır.","ayirt":"İndirim çarpanına böldüğüm tutar KDV\u0027yi içeriyor mu?","paragraf":"Yüzde artış/azalış zinciri kuralı","yanilgi":"Kâr oranıyla bulduğun net satış fiyatının zaten satılan (indirimli) fiyat olduğunu sanıyorsun, KDV\u0027yi unutuyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 13"},"kural":"ardışık çift sayılarda artış 2\u0027dir; en küçük sayı n alınırsa terimler n, n+2, n+4, n+6 olur ve toplamları 4n+12\u0027dir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 13","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Denklemi çözdükten sonra n\u0027yi değil, sorunun tam olarak hangi terimi istediğini tekrar oku ve o terimi yaz.","konu":"ardışık sayı problemi","tablo":{"satirlar":[["VERİLENLER","-"],["Terim sayısı","dört sayı"],["Sayı türü","çift doğal sayı"],["Toplam","148"],["HESAP","-"],["Terimleri yazma","N, n+2, n+4, n+6"],["Denklem kurma","4n + 12 = 148"],["N değeri","N = 34"],["Sayılar","34, 36, 38, 40"],["Sonuç (en büyük sayı)","40"]],"basliklar":["Adım","İşlem / Sonuç"]},"siklar":{"C":"38","E":"42","A":"34","D":"40","B":"36"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Dört sayıda ortanca yoktur; üçüncü sayıyı (n+4=38) orta sanıp en büyük gibi gördün. Gerçek en büyük son yazılan sayıdır, 40.","E":"Terim sayısını beşe çıkarıp beşinci sayıyı (n+8=42) en büyük aldın. Soruda sadece dört sayı vardır; en büyügü dördüncü sayı olan 40\u0027tır.","A":"Denklemi çözerek n=34 bulduğun doğru, ancak n en küçük sayıdır. Soru en büyüğünü istediği için dört adım ileriye gidip n+6\u0027yı bulmalısın.","B":"Dördüncü sayıyı yazarken sayıları sıraladığında ikinci olanı (n+2=36) en büyük sanıp seçtin. Oysa dizide en büyük son elemandır."},"dogru":"En küçük sayıya n dersen, dört çift sayı n, n+2, n+4, n+6 olur. Bunların toplamı 4n+12=148\u0027den n=34 çıkar. Soruda en büyük istendiği için n+6=40\u0027tır.","sinav":"Ardışık dört çift doğal sayının toplamı 148 olduğunda, en küçük sayıya n denirse n+(n+2)+(n+4)+(n+6)=148 denkleminden n=34 bulunur ve en büyük sayı n+6=40\u0027tır.","kavramlar":[{"kaynak":"TEORI","tanim":"Birbirini ikişer artan çift doğal sayılardır. En küçüğüne n denilirse sırasıyla n, n+2, n+4, n+6 şeklinde yazılırlar.","ad":"Ardışık çift sayılar"},{"kaynak":"TEORI","tanim":"Bilinmeyen en küçük sayıya n adı verilerek diğer sayılar n cinsinden yazılır; verilen toplam şartına göre denklem oluşturulur ve n çözülür.","ad":"Denklem kurma yöntemi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Adım","İşlem / Sonuç"],"satirlar":[["Terimleri yazma","M, m+2, m+4, m+6, m+8"],["Denklem kurma","5m + 20 = 175"],["M değeri","M = 31"],["Sayılar","31, 33, 35, 37, 39"],["Sonuç (en küçük sayı)","31"]]},"tur":"tablo","soru":"Ardışık beş tek doğal sayının toplamı 175\u0027tir. Buna göre bu sayılardan en küçük olanı kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve en küçük sayının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Ardışık dört çift doğal sayının toplamı 148\u0027dir. Buna göre bu sayılardan en büyük olanı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-33","verilenler":[{"deger":"dört sayı","anlam":"Diziye kaç terim yazılacağını belirler: n, n+2, n+4, n+6","ad":"Terim sayısı"},{"deger":"çift doğal sayı","anlam":"Ardışık terimler arasındaki artışın 2 olduğunu gösterir","ad":"Sayı türü"},{"deger":"148","anlam":"Dört terimin toplamı; denklemin sağ tarafını oluşturur (4n+12=148)","ad":"Toplam"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Ardışık Sayılar konusu","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: dört ardışık çift sayının toplamı 148 (soruda verilen); terim yapısı n, n+2, n+4, n+6 (soruda verilen)","anlatim":"Soru bize şunu vermiş: ardışık dört çift doğal sayının toplamı 148. Terimleri n, n+2, n+4, n+6 şeklinde kuracağız.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Terimler = n; n + 2; n + 4; n + 6 (soruda verilen kural)","anlatim":"Ardışık çift sayılarda her terim öncekinden 2 fazladır. Bu yüzden en küçüğü n dersek diğerleri n+2, n+4, n+6 olur.","doldur":[[8,1]]},{"formul":"n + (n + 2) + (n + 4) + (n + 6) = 4n + 12 = 148 (soruda verilen)","anlatim":"Şimdi dört terimi topluyoruz çünkü toplamları 148 olarak verilmiş. Bu bize n\u0027li bir denklem verir.","doldur":[[6,1]]},{"formul":"n = (148 − 12) / 4 = 136 / 4 = 34","anlatim":"Denklemi çözüp n\u0027yi buluyoruz. Bunu bulmamızın nedeni en büyük terimi yazabilmek için önce en küçüğü bilmemiz gerekmesi.","doldur":[]},{"formul":"Sayılar = 34 (3. adımda bulduk); 34 + 2 = 36; 36 + 2 = 38; 38 + 2 = 40","anlatim":"n\u0027yi bulduk, şimdi dört sayıyı yazıyoruz. Her terime 2 ekleyerek sırayla ilerliyoruz.","doldur":[]},{"formul":"Sonuç = 40 (4. adımda bulduk)","anlatim":"En büyük sayı zaten dördüncü terim, onu 4. adımda bulmuştuk. Cevap bu.","doldur":[[9,1]]},{"formul":"Yanlış yol: 148 / 4 = 37 (HATALI) → doğrusu 40 (5. adımda bulduk)","anlatim":"Yanlış yol: 148\u0027i doğrudan 4\u0027e bölüp 37\u0027yi cevap sanmak hatalıdır. Çünkü artış farkını (12\u0027yi) çıkarmadan bölmek yanlış terimi verir.","doldur":[]}],"anahtar":[{"ornek":"ardışık","kok":"ardışı"},{"ornek":"terimi","kok":"terimi"},{"ornek":"küçüğü","kok":"küçüğü"},{"ornek":"terimler","kok":"teriml"},{"ornek":"toplamları","kok":"toplam"},{"ornek":"sayılarda","kok":"sayıla"}],"konuGiris":{"harita":"Hangi tür sayı sorulduğu ilk cümleden anlaşılır: tam, çift ya da tek. Terim sayısı ve toplam ilişkisi denklem kurularak çözülür. Bulunan en küçük değerden istenen terime (en büyük, ortanca) artışla ulaşılır.","desen":"Soru genelde toplamı verip en büyük veya ortanca sayıyı sorar; tuzak, artışın 1 değil 2 olduğunu unutturmaktır (p.28). Bazı sorularda terim sayısı çift çıkar ve orta terim yerine iki ortadaki sayının ortalaması kullanılması gerekir. Bu soru artışın çift sayılarda 2 olduğunu ve en küçük terimin n alınarak denklem kurulması gerektiği noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Belli bir sabit farkla art arda gelen sayılar dizisi","ad":"Ardışık sayı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"İki ardışık terim arasındaki sabit fark değeri","ad":"Artış (fark)","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Dizideki toplam eleman adedi","ad":"Terim sayısı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Bilinmeyen ilk terimle kurulan ve toplamı veren eşitlik","ad":"Toplam denklemi","kim":"piyasa fiyatlar"}],"sinavda":"Ardışık dört çift sayının toplamı verilir, en büyük sayı istenir.","panel_ornek":"Bir markette üst üste dizilmiş 4 raf var; her rafın yüksekliği alttakinden 2 cm fazla ve toplam yükseklikleri 40 cm. En alttaki raf 8 cm, en üstteki raf 14 cm gelir. Burada da küçükten büyüğe eşit aralıklı artış vardır, tıpkı ardışık çift sayılarda olduğu gibi.","ornek":"Bir markette üst üste dizilmiş 4 raf var; her rafın yüksekliği alttakinden 2 cm fazla ve toplam yükseklikleri 40 cm. En alttaki raf 8 cm, en üstteki raf 14 cm gelir. Burada da küçükten büyüğe eşit aralıklı artış vardır, tıpkı ardışık çift sayılarda olduğu gibi.","yontemler":"En küçük sayı n, sonraki üç sayı n+2, n+4, n+6 alınarak toplam denklemi kurulur. Bulunan n değerine 6 eklenerek en büyük sayı elde edilir.","nedir":"Ardışık sayı problemi, birbirini sabit bir farkla izleyen sayılar arasındaki ilişkiyi kurup bilinmeyeni bulmayı öğretir. Sınav, denklem kurma ve terim sayısı-toplam ilişkisini doğru uygulayabilme becerisini ölçer."},"olay":"4n+12=148 → 4n=136 → n=34; sayılar 34, 36, 38, 40.","tuzak":{"C":{"ad":"Ortancayı Büyük Sanma Tuzağı","metin":"Terim sayısı çift olduğu için tek bir orta terim yoktur; sen yine de üçüncü sayıyı (n+4=38) \u0027ortanca ve en büyük\u0027 sanarak seçtin. Doğrusu: dört terimli dizide en büyük son terimdir, 40\u0027tır."},"E":{"ad":"Fazladan Terim Ekleme Tuzağı","metin":"Terim sayısını yanlışlıkla 5 sanıp diziyi bir adım daha ileri götürdün, n+8=42\u0027yi en büyük sayı olarak aldın. Doğrusu: soruda dört terim vardır, en büyük terim n+6=40\u0027tır."},"A":{"ad":"En Küçüğü Cevap Sanma Tuzağı","metin":"Denklemi kurup n=34 bulduktan sonra, sorunun \u0027en büyük\u0027 sayıyı istediğini unutup n\u0027yi doğrudan cevap yazdın. Doğrusu: n en küçük sayıdır, en büyük sayı n+6=40\u0027tır."},"B":{"ad":"İkinci Terimi Alma Tuzağı","metin":"Dört sayıyı sırayla yazarken (n, n+2, n+4, n+6) ikinci terimi (n+2=36) en büyük sanıp seçtin. Doğrusu: en büyük terim dizinin son elemanı olan n+6=40\u0027tır."}},"celdiriciYol":{"C":"n=34 iken üçüncü terim n+4 = 38; çift terim sayısında olmayan ortancayı en büyük sanarak seçti = 38 (ortanca yanılgısı)","E":"n=34 iken beşinci (var olmayan) terim n+8 = 42; diziyi bir terim fazla uzattı = 42 (fazladan terim ekleme)","A":"4n+12=148 → n=34; n değerini doğrudan en büyük sayı olarak aldı = 34 (en küçük terimi cevap sanma)","B":"n=34 iken ikinci terim n+2 = 36; bu terimi en büyük sanarak seçti = 36 (yanlış terimi büyük sanma)"},"hap":"Ardışık çift/tek sayı dizilerinde artış 2\u0027dir; en küçük terim n alınıp istenen terim (en büyük, ortanca vb.) diziye göre ayrı ayrı hesaplanır.","teshis":{"C":{"gercek":"Ortanca kuralı yalnız TEK sayıda terim varken geçerlidir; dört terimli (çift sayıda) dizide tek bir orta terim yoktur, en büyük son terimdir.","ayirt":"Terim sayım tek mi çift mi, ortanca kuralını burada kullanabilir miyim?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Ardışık Sayılar","yanilgi":"Ardışık sayı toplamı formülündeki \u0027ortanca\u0027 kavramını her durumda uygulanır sanıp, terim sayısı çift olsa da bir sayıyı ortanca-en büyük gibi görüyorsun."},"E":{"gercek":"Soru açıkça dört ardışık çift sayı ister; dördüncü terim n+6\u0027dır, beşinci terim (n+8) hesaba dahil edilmez.","ayirt":"Soruda kaç terim isteniyor, dizimi tam olarak o kadar terimle mi kurdum?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Ardışık Sayılar","yanilgi":"Sorunun kaç terim istediğini karıştırıp fazladan bir terim daha ekleyerek diziyi beş sayıymış gibi ilerletiyorsun."},"A":{"gercek":"n yalnızca en küçük terimdir; soru en büyük terimi (n+6) istiyor.","ayirt":"Bulduğum n değeri, sorunun sözcük sözcük istediği büyüklüğe mi karşılık geliyor?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Ardışık Sayılar","yanilgi":"Denklemi doğru kurup n\u0027yi bulduktan sonra, sorunun neyi istediğini kontrol etmeden n\u0027yi cevap yazıyorsun."},"D":{"gercek":"Ardışık çift sayılarda artış 2\u0027dir; dört terim n, n+2, n+4, n+6 olur ve toplamları 4n+12=148 denklemi n=34 verir, en büyük terim 40\u0027tır.","ayirt":"Artışı doğru mu aldım (çift sayılarda 2), denklemi doğru terimlerle mi kurdum?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Ardışık Sayılar","yanilgi":"Bu şıkkı eleyen öğrenci, dört terimli diziyi kurarken artışı 1 sanıp ya da terim sayısını yanlış alıp n\u0027yi 34\u0027ten farklı bulmuştur."},"B":{"gercek":"Ardışık çift sayı dizisinde terimler n, n+2, n+4, n+6 şeklinde artan sırada yazılır; en büyük son terimdir.","ayirt":"Dizideki dört sayıyı tek tek yazıp hangisinin en sonda olduğunu gözümle mi kontrol ettim?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Ardışık Sayılar","yanilgi":"Dört terimi sırayla yazarken hangi terimin kaçıncı sırada olduğunu karıştırıp ikinci terimi en büyük sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 13"},"kural":"Ardışık çift sayılarda artış 2\u0027dir; sayılar n, n+2, n+4 olarak yazılıp toplam denklemi kurulur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 13","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Sayıları n ile yazıp denklemi kurduktan sonra sorunun tam olarak hangi terimi istediğini son adımda bir kez daha oku.","konu":"ardışık sayı problemi","tablo":{"satirlar":[["VERİLENLER","-"],["kat","2"],["fark","14"],["HESAP","-"],["En küçük sayı (n)","16"],["Sayılar","16, 18, 20"],["En büyük sayı","20"]],"basliklar":["Adım","Değer"]},"siklar":{"C":"17","E":"20","A":"12","D":"18","B":"16"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Çift sayılar arasındaki artışın 2 değil 1 olduğu zannedilirse n, n+1, n+2 yazılır, n=15 bulunur ve en büyük 17 çıkar. Ardışık çift sayılarda artış kesinlikle 2\u0027dir.","A":"Denklem kurulurken \u0027en büyüğünün 2 katından 14 fazla\u0027 koşulu yanlış terime (en küçüğe) uygulanırsa 3n+6=2n+14 olur, n=8 çıkar ve en büyük 12 yazılır. Koşul mutlaka en büyük terime göre kurulmalıdır.","D":"Denklem çözüldükten sonra en büyük yerine ortanca terim (n+2=18) yazılırsa yanlış cevap çıkar. Üç terimin en büyüğü ortanca değil, son terimi yani n+4\u0027ü almaktır.","B":"Denklem doğru kurulup n=16 bulunsa da sonraki adımda isteneni (en büyüğü) hesaplamak yerine n doğrudan cevap olarak yazılır. Bulduğun n değeri en küçük sayıdır; en büyüğü bulmak için n+4 hesaplamalısın."},"dogru":"Üç çift sayıyı en küçüğünden başlayarak n, n+2, n+4 olarak yaz. Toplamları (3n+6) ile en büyüğünün 2 katı artı 14\u0027ü (2(n+4)+14) eşitle. Denklemi çöz (n=16), sonra en büyük sayıyı bul (n+4=20).","sinav":"Ardışık üç çift doğal sayının toplamı, bu sayılardan en büyüğünün 2 katından 14 fazla olduğunda, en büyük sayı kaçtır?","kavramlar":[{"kaynak":"TEORI","tanim":"Birbirini 2\u0027şer artan doğal sayılardır; örneğin 16, 18, 20 gibi sırayla gelen çift sayılar.","ad":"Ardışık çift sayılar"},{"kaynak":"TEORI","tanim":"Ardışık sayılarda en küçüğü n olarak alıp diğerlerini artışla (n+2, n+4) ifade etmek, ardından sorunun istediği terimi sonuçtan çıkarmaktır.","ad":"Terim seçimi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Adım","Değer"],"satirlar":[["En küçük sayı (n)","23"],["Sayılar","23, 25, 27"],["En büyük sayı","27"]]},"tur":"tablo","soru":"Ardışık üç tek doğal sayının toplamı, bu sayılardan en büyüğünün 2 katından 21 fazladır. Buna göre bu sayılardan en büyük olanı kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve en büyük sayının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Ardışık üç çift doğal sayının toplamı, bu sayılardan en büyüğünün 2 katından 14 fazladır. Buna göre bu sayılardan en büyük olanı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-33","verilenler":[{"deger":"2","anlam":"Toplamın, en büyük sayının kaç katına göre kurulacağını belirtir.","ad":"kat"},{"deger":"14","anlam":"Toplamın bu kattan kaç fazla olduğunu belirtir, denklemin sabit terimidir.","ad":"fark"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Ardışık Sayılar (Toplam ve Terim Formülleri)","dogru":"E","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: ardışık üç çift sayı toplamı (soruda verilen ilişki); en büyüğün 2 katından 14 fazla (soruda verilen ilişki); istenen en büyük sayı","anlatim":"Soruda ne var: ardışık üç çift doğal sayı; toplamları en büyüğün 2 katından 14 fazla; en büyük sayı soruluyor.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Sayılar = n; n + 2; n + 4","anlatim":"Ardışık çift sayılarda artış hep 2\u0027dir. En küçüğü n dersek diğerleri n+2 ve n+4 olur.","doldur":[[5,1]]},{"formul":"Toplam = n + (n + 2) + (n + 4) = 3n + 6","anlatim":"Üç sayının toplamını tek toplama ile yazıyoruz, sonra denklemi kuracağız.","doldur":[]},{"formul":"3n + 6 = 2 × (n + 4) + 14 = 2n + 22","anlatim":"Soru toplamın, en büyüğün 2 katından 14 fazla olduğunu söylüyor. Bunu denklem yapıyoruz.","doldur":[]},{"formul":"3n + 6 = 2n + 22 → n = 22 − 6 = 16","anlatim":"Denklemi sadeleştirip n\u0027i buluyoruz - bilinmeyen tek başına kalınca değeri çıkar.","doldur":[]},{"formul":"Sayılar = 16; 16 + 2; 16 + 4 = 16, 18, 20","anlatim":"n\u0027i bulduk, şimdi diğer iki sayıyı 2\u0027şer artırarak yazıyoruz.","doldur":[]},{"formul":"En büyük sayı = 16 + 4 = 20","anlatim":"En büyük sayı üçüncü terimdir, doğrudan okuyoruz.","doldur":[[6,1]]},{"formul":"Sağlama: 16 + 18 + 20 = 54; 2 × 20 + 14 = 54 ✓","anlatim":"Sağlama yapalım: üç sayıyı toplayıp şartı kontrol ediyoruz.","doldur":[]},{"formul":"Yanlış yol: en büyük = n = 16 (HATALI) → doğrusu en büyük = 20 (7. adımda bulduk)","anlatim":"En sık hata: n\u0027i en büyük sayı sanıp direkt 16 cevabını vermek. Doğrusu n en küçük sayıdır, en büyük n+4\u0027tür.","doldur":[]}],"anahtar":[{"ornek":"denklem","kok":"denkle"},{"ornek":"toplamları","kok":"toplam"},{"ornek":"sayılarda","kok":"sayıla"},{"ornek":"ardışık","kok":"ardışı"},{"ornek":"sayıyı","kok":"sayıyı"},{"ornek":"büyüğün","kok":"büyüğü"}],"konuGiris":{"harita":"Ne zaman kurulur: sayılar arasında sabit fark (1 veya 2) belirtildiğinde denklem kurulur. Nasıl ölçülür: en küçük sayı n alınıp toplam ifadesi cebirsel eşitliğe dönüştürülerek çözülür. Nasıl kaydedilir: bulunan n\u0027den istenen sayı (en büyük/ortanca) hesaplanıp toplamla sağlaması yapılır.","desen":"Soru, üç ardışık çift sayının toplamını en büyüğün 2 katı ve sabit bir fazlalıkla ilişkilendirir; tuzak, artışın 1 değil 2 olduğunu unutmaktır. Öğrenci n yerine doğrudan en büyüğü değişken seçerse denklem daha kısa kurulur ama çoğu kişi en küçükten başlar ve karıştırır. Bu soru \u0027ardışık sayı problemi\u0027 arşivinde 1 dönem çıkmıştır ve tuzak noktası p.28\u0027deki artış kuralına dayanır.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Birbirini 2\u0027şer artışla izleyen sayı dizisi","ad":"Ardışık çift sayı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Denklemi kurmak için seçilen bilinmeyen başlangıç değeri","ad":"En küçük terim (n)","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Sayıların birbirine eklenmesiyle oluşan denklemin sol tarafı","ad":"Toplam ifadesi","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Dizinin son sayısı, n\u0027den artışla hesaplanan değer","ad":"En büyük terim","kim":"kanun sabitler"}],"sinavda":"Ardışık üç çift sayının toplamı ile en büyüğünün 2 katından 14 fazla olduğu bilgisi verilir, en büyük sayı istenir.","panel_ornek":"Bir kafeteryada üç gün üst üste satılan çayların adedi hep 4\u0027er artıyor; üç günün toplamı, son günün 2 katından 6 fazla çıkıyor. Buradan son gün kaç çay satıldığını bulabilirsin.","ornek":"Bir kafeteryada üç gün üst üste satılan çayların adedi hep 4\u0027er artıyor; üç günün toplamı, son günün 2 katından 6 fazla çıkıyor. Buradan son gün kaç çay satıldığını bulabilirsin.","yontemler":"En küçük sayıyı n alıp diğerlerini n+2, n+4 ile ifade ederek toplam denklemini kurmak en güvenli yoldur; sağlamasını üç sayıyı toplayarak yapmayı unutma.","nedir":"Ardışık sayı problemi, birbirini sabit farkla izleyen sayılar arasındaki toplam/oran ilişkisini kurmayı gerektirir. Sınav, bilinmeyeni doğru değişkenle ifade edip denklem kurma becerini ölçer."},"olay":"3n+6 = 2(n+4)+14 → 3n+6 = 2n+22 → n=16; sayılar 16, 18, 20.","tuzak":{"C":{"ad":"Artış Hatası Tuzağı","metin":"Ardışık çift sayılarda artışın 2 olduğu unutulup ardışık tam sayı gibi 1 artışla n, n+1, n+2 alınır; n=15 bulunup en büyük 17 yazılır. Doğrusu: çift sayılarda artış 2\u0027dir."},"A":{"ad":"Terim Karışıklığı Tuzağı","metin":"Toplamın \u00272 katından 14 fazla\u0027 olduğu terimi en büyük yerine en küçük sayı sanarak 3n+6=2n+14 kurulur, n=8 bulunur ve en büyük 12 yazılır. Doğrusu: denklem en büyük terime (n+4) göre kurulmalıdır."},"D":{"ad":"Ortanca Tuzağı","metin":"n=16 bulunduktan sonra en büyük yerine ortanca terim (n+2=18) en büyük sayı zannedilir. Doğrusu: en büyük terim n+4\u0027tür."},"B":{"ad":"İstenen Terim Tuzağı","metin":"Denklem doğru kurulup n=16 bulunduktan sonra soru en büyüğü sorduğu halde en küçük terim n doğrudan cevap olarak yazılır. Doğrusu: sonuç n+4 hesaplanmalıdır."}},"celdiriciYol":{"C":"3n+3 = 2(n+2)+14 → n=15, en büyük = 15+2 = 17 (ardışık çift sayıda artışı 1 alma hatası)","A":"3n+6 = 2n+14 → n=8, en büyük = 8+4 = 12 (toplamı en büyük yerine en küçük terime göre kurma hatası)","D":"n+2 = 16+2 = 18 (ortancayı en büyük terim sanma hatası)","B":"n = 16 (istenen terimi hesaplamadan en küçük terimi cevap yazma hatası)"},"hap":"Ardışık çift/tek sayılarda artış 2\u0027dir; denklem kurulduktan sonra sonucun HANGİ terime (en küçük/ortanca/en büyük) karşılık geldiği tekrar kontrol edilmelidir.","teshis":{"C":{"gercek":"Ardışık çift (ya da tek) sayılarda artış 2\u0027dir; ardışık tam sayılarda artış 1\u0027dir.","ayirt":"Soruda \u0027çift sayı\u0027 geçtiğinde artışı ek yazmaktan çok daha hızlıdır.","konu":"ardışık sayılar","tablo":{"satirlar":[["VERİLENLER","-"],["Terim sayısı","5"],["Toplam","195"],["HESAP","-"],["Ortanca (195/5)","39"],["En küçük sayı (39-4)","35"],["En büyük sayı (39+4)","43"],["Çarpım (35×43)","1505"]],"basliklar":["Adım","Değer"]},"siklar":{"C":"1517","E":"2385","A":"1457","D":"1833","B":"1505"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Tek sayı koşulunu görmezden gelip farkı 1 alırsan (1, 2, 3, 4, 5 gibi), 33 ile 37\u0027yi bulup hatalı çarpım elde edersin.","E":"Beş terimliyken dört terime böl ve yuvarlama yaptığında yanlış bir dizi kurarsın; toplamı kesinlikle 5\u0027e bölmelisin.","D":"195÷5=39\u0027u doğrudan en küçük sayı zannettin; aslında bu ortancadır, en küçük bulmak için 4 adım geri gidip 35 alman lazımdı.","A":"Ardışık tek sayılar arasındaki farkı 4 sandığında uçlar 2 adım kayıyor; ortanca 39 doğru çıksa da 37 ile 41 alıp yanlış sonuca varırsın."},"dogru":"Beş tek sayı sırayla 2\u0027şer fark açarak gidiyor. Toplamı 5\u0027e bölersen ortadaki sayıyı bulursun: 195÷5=39. Ortadaki 39 ise en küçük 35, en büyük 43 olur. Çarp: 35×43=1505.","sinav":"Ardışık tek doğal sayılar aritmetik dizide tekil terim sayısında toplam, terim sayısı çarpı orta terime eşittir.","kavramlar":[{"kaynak":"TEORI","tanim":"Birbirini düzenli 2 farkla izleyen tek sayılardan oluşan dizi; her sayı bir öncekinden 2 büyüktür.","ad":"Ardışık tek doğal sayılar"},{"kaynak":"TEORI","tanim":"Tek sayıda terimli bir ardışık dizide ortadaki terim; aynı zamanda tüm terimlerin aritmetik ortalamasına eşittir.","ad":"Ortanca (medyan)"},{"kaynak":"TEORI","tanim":"Terim sayısı çarpı (ilk terim artı son terim) bölü 2 ile hesaplanır; tek terim sayısıysa toplam, terim sayısı çarpı orta terime eşittir.","ad":"Aritmetik dizi toplamı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Adım","Değer"],"satirlar":[["Ortanca (265/5)","53"],["En küçük sayı (53-4)","49"],["En büyük sayı (53+4)","57"],["Toplam (49+57)","106"]]},"tur":"tablo","soru":"Ardışık beş tek doğal sayının toplamı 265\u0027tir. Buna göre bu sayılardan en büyüğü ile en küçüğünün toplamı kaçtır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve en büyük sayı ile en küçük sayının toplamının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Ardışık beş tek doğal sayının toplamı 195\u0027tir. Buna göre bu sayılardan en büyüğü ile en küçüğünün çarpımı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-34","verilenler":[{"deger":"5","anlam":"Ardışık tek sayı adedi; toplamı bu sayıya bölerek ortanca bulunur","ad":"Terim sayısı"},{"deger":"195","anlam":"Beş ardışık tek sayının toplamı; ortancayı bulmak için terim sayısına bölünür","ad":"Toplam"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Ardışık Sayılar, Aritmetik Dizi Toplamı ve Ortalama Kuralı","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: beş ardışık tek doğal sayının toplamı 195 (soruda verilen); istenen: en büyük × en küçük","anlatim":"Soru bize toplamı vermiş: beş ardışık tek doğal sayının toplamı 195. İstenen: en büyük ile en küçük sayının çarpımı.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Ortanca = Toplam / Terim Sayısı = 195 (soruda verilen) / 5 (soruda verilen) = 39","anlatim":"Ardışık beş sayıda ortalama tam ortadaki terime eşittir. Bu yüzden toplamı 5\u0027e bölünce ortanca çıkar.","doldur":[[4,1]]},{"formul":"En küçük = Ortanca − 4 = 39 (1. adımda bulduk) − 4 = 35","anlatim":"Tek sayılarda ardışık terimler arasında 2\u0027şer fark vardır. En küçük sayı, ortancadan iki adım geri gidilerek bulunur.","doldur":[[5,1]]},{"formul":"En büyük = Ortanca + 4 = 39 (1. adımda bulduk) + 4 = 43","anlatim":"Aynı mantıkla en büyük sayı, ortancadan iki adım ileri gidilerek bulunur. Dikkat: fark 2 değil 4, çünkü iki terim aradadır.","doldur":[[6,1]]},{"formul":"Çarpım = En küçük × En büyük = 35 (2. adımda bulduk) × 43 (3. adımda bulduk) = 1505","anlatim":"Artık en büyük ve en küçük sayı belli, sadece çarpmak kalıyor. Bu işlem soruda istenen sonucu verir.","doldur":[[7,1]]},{"formul":"Sonuç = 1505","anlatim":"Sonuç 1505 çıktı. Bu, beş ardışık tek sayının en büyük ile en küçüğünün çarpımıdır.","doldur":[]},{"formul":"Ters durum: terim sayısı çift olsaydı → ortanca yerine iki orta terimin ortalaması kullanılır","anlatim":"Terim sayısı çift olsaydı ortanca diye tek bir sayı olmazdı, iki orta terimin ortalaması alınırdı. O zaman fark hesapları değişirdi.","doldur":[]},{"formul":"Yanlış yol: 195 / 5 = 39, doğrudan çarpım için kullanmak (HATALI) → doğrusu 35 × 43 = 1505 (5. adımda bulduk)","anlatim":"En sık hata: öğrenci 195\u0027i 5\u0027e bölüp çıkan 39\u0027u direkt en küçük ya da en büyük sanır. Oysa 39 ortanca değeridir, uçtaki sayı değildir.","doldur":[]}],"anahtar":[{"ornek":"ortanca","kok":"ortanc"},{"ornek":"ardışık","kok":"ardışı"},{"ornek":"ortalama","kok":"ortala"},{"ornek":"sayının","kok":"sayını"},{"ornek":"sayısı","kok":"sayısı"},{"ornek":"bulunur","kok":"bulunu"}],"konuGiris":{"harita":"Terim sayısı ve fark nasıl bulunur: sorudaki ifadeden (ardışık, tek, çift) çıkarılır. Toplam nasıl hesaplanır: terim sayısı ile ilk ve son terimin ortalaması çarpılarak bulunur. Sonuç nasıl kaydedilir: istenen iki terimin çarpımı ya da farkı olarak yazılır.","desen":"Sınav genelde toplamı verip uç terimleri veya çarpımlarını sordurur; tuzak terim sayısını yanlış saymaktır (p.28). Öğrenci ortanca terimi bulmadan direkt formüle atlarsa hata yapar. Bu soru ortanca terimden uç terimlere geçiş noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"birbirini sabit bir farkla izleyen sayı dizisi","ad":"ardışık sayı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"tek sayıda terimde ortadaki, toplamın ortalamasına eşit terim","ad":"ortanca terim","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"dizideki eleman adedi, fark ve uç terimlerden bulunur","ad":"terim sayısı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"terim sayısı ile ilk ve son terim ortalamasının çarpımı","ad":"toplam","kim":"kanun sabitler"}],"sinavda":"Beş ardışık tek sayının toplamı verilir, en büyük ile en küçüğün çarpımı istenir.","panel_ornek":"Bir markette art arda 5 gün boyunca her gün 2 lira artan fiyatlarla 5 ürün alsan, ortadaki günün fiyatı toplamın ortalamasına eşit olur. Mesela toplam 50 lira ise ortanca gün 10 liradır. Bu mantık ardışık sayı toplamlarında da aynen çalışır.","ornek":"Bir markette art arda 5 gün boyunca her gün 2 lira artan fiyatlarla 5 ürün alsan, ortadaki günün fiyatı toplamın ortalamasına eşit olur. Mesela toplam 50 lira ise ortanca gün 10 liradır. Bu mantık ardışık sayı toplamlarında da aynen çalışır.","yontemler":"Toplam terim sayısına bölünerek ortanca bulunur, sonra fark kadar ileri geri gidilerek uç terimler elde edilir.","nedir":"Ardışık sayılar konusu, birbirini sabit bir farkla izleyen sayı dizilerini inceler; sınav bu dizilerin toplamını veya belirli terimlerini bulmayı ölçer."},"olay":"ortanca=195/5=39; en küçük=39-4=35; en büyük=39+4=43; çarpım=35×43=1505.","tuzak":{"C":{"ad":"Tam Sayı Farkı Tuzağı","metin":"Ardışık TEK sayı şartını unutup farkı 1 alarak a, a+1, a+2, a+3, a+4 yazdın; bu ardışık tam sayı dizisidir, tek sayı dizisi değildir. Doğrusu: fark 2 olmalıdır."},"E":{"ad":"Terim Sayısı Tuzağı","metin":"Toplamı 5 yerine 4 terime bölüp (195/4=48,75) yuvarlama ile sahte bir dizi kurdun; soruda terim sayısı açıkça 5\u0027tir. Doğrusu: bölme işlemi 5\u0027e göre yapılmalıdır."},"D":{"ad":"Ortanca-Uç Karıştırma Tuzağı","metin":"195/5=39 sonucunu doğrudan en küçük sayı sandın; oysa bu değer ortancadır, en küçük değil. Doğrusu: 39 ortancadır, en küçük 39-4=35\u0027tir."},"A":{"ad":"Fark Karıştır
