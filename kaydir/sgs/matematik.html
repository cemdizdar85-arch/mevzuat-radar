<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".

   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. Koyu tema yalnız düğmeyle (data-theme="dark", tarayıcıda kc_tema) ya da ?tema=koyu ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}

.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}
#akis{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.kart{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;max-width:560px;margin:0 auto}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.78em;color:var(--dim);margin-bottom:8px}
.noktalar{display:flex;gap:5px}.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--cizgi);display:block}.noktalar i.ok{background:var(--yesil)}.noktalar i.yan{background:var(--kirmizi)}.noktalar i.simdi{outline:2px solid var(--mavi);outline-offset:1px}
.noktalar.cok{gap:3px;flex-wrap:wrap;max-width:58%;justify-content:center}.noktalar.cok i{width:5px;height:5px}
.tt.teori td:first-child{white-space:nowrap;font-weight:700;color:var(--dim);width:1%}
.sinavDil{font:inherit;font-size:.78em;color:var(--mavi);background:transparent;border:1px solid var(--cizgi);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer}
.sinavDilM{margin-top:6px;font-size:.86em;color:var(--dim);border-left:2px solid var(--cizgi);padding-left:8px}
.govde{flex:1;overflow-y:auto;padding-bottom:90px}
.rozet{display:inline-block;font-size:.72em;color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 50%,transparent);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}
.ipucu{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:.8em;pointer-events:none;animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.panel.acik{transform:translateY(0)}.tutamac{width:38px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 10px}
/* Cem 03.09 "gorunum boyle geliyor": KAPALI panel kartin altina (105%) kayiyor ve SONRAKI KARTIN ustune biniyordu.

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}

.ozet{font-size:.93em;margin:0 0 8px;line-height:1.45}.ozet b{color:var(--yesil)}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}

.cip2.ek{display:none}.cipler.acikEk .cip2.ek{display:inline-block}.cipler.acikEk .bDaha{color:var(--dim)}
.cipler .bDaha{border-style:dashed;color:var(--dim)}
.sek{display:none;margin-top:8px}.sek.acik{display:block;animation:gir .2s ease}
.panel{overscroll-behavior:contain}
.kavramL{margin:4px 0 8px;padding-left:18px}.kavramL li{margin:3px 0}.kavramL i{color:var(--dim);font-style:normal;font-size:.85em}
.panelBas{position:sticky;bottom:4px;display:block;margin:10px 0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:.84em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent)}

/* yanlis kutusu + hazirlik skoru */
.ustSag{display:flex;align-items:center;gap:6px}
.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}
.kutuEkran{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}.kutuEkran.acik{display:flex}
.kutuIc{background:var(--kart);width:min(100%,640px);max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 22px;border:1px solid var(--cizgi)}
@media(min-width:900px){.kutuEkran{align-items:center}.kutuIc{border-radius:18px}}
.kutuIc .basl{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}

.dersSat{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92em}.dersSat .bar{height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden}.dersSat .bar i{display:block;height:100%;background:var(--yesil)}
.kutuSat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.92em}
/* kaynak metni */
.kaynakAd{color:var(--mavi);font-weight:800;font-size:.85em;margin:8px 0 4px}.kaynakMetin{font-size:.9em;line-height:1.55;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px}.kaynakMetin mark{background:color-mix(in srgb,var(--altin) 35%,transparent);color:var(--yazi);padding:1px 2px;border-radius:3px}
/* sen anlat / t-hesabi / sinavda */
.ipnot{font-size:.84em;color:var(--dim);margin:2px 0 8px}
.anlatK{width:100%;background:var(--bg2);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 11px;font-size:.95em;font-family:inherit;resize:vertical}
.anlatSonuc{font-size:.92em;margin-top:8px;line-height:1.5}.anlatPuan{font-weight:800;font-size:1.05em;margin-bottom:4px}.anlatOrnek{margin-top:8px;border-left:4px solid var(--altin);padding:6px 10px;background:color-mix(in srgb,var(--altin) 8%,transparent);border-radius:0 8px 8px 0}
.tKutular{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:600px){.tKutular{grid-template-columns:1fr 1fr}}

.tGovde{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--yazi);min-height:88px}.tSol{border-right:2px solid var(--yazi);padding:6px 8px}.tSag{padding:6px 8px;text-align:right}

.cikmisK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.88em;color:var(--dim);line-height:1.45}.cikmisK .yil{display:inline-block;background:color-mix(in srgb,var(--mavi) 15%,transparent);color:var(--mavi);font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.85em}

.ogret{margin:4px 0 6px}.thpNot{font-size:.85em;color:var(--dim);margin:2px 0 8px}
.hesapK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.9em;line-height:1.45}.hesapK.yan{border-color:color-mix(in srgb,var(--kirmizi) 60%,transparent)}.hesapK.dog{border-color:color-mix(in srgb,var(--yesil) 60%,transparent)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.btn{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;font-size:.9em;cursor:pointer}.btn.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0}.btn.mavi{border-color:var(--mavi);color:var(--mavi)}
/* surukleme oyunu */

.oyun{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:20;overflow-y:auto}.oyun.acik{display:flex}

#akis,.govde,.tabloSar,.serit,.panel,.oyun{scrollbar-width:none}#akis::-webkit-scrollbar,.govde::-webkit-scrollbar,.tabloSar::-webkit-scrollbar,.serit::-webkit-scrollbar,.panel::-webkit-scrollbar,.oyun::-webkit-scrollbar{display:none}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

const SORULAR=[{"capa":{"kaynak":"SGS 2024/2 Soru 10"},"kural":"paydalar ortak katla (6) eşitlenir, parantezler açılıp benzer terimler toplanır, bilinmeyen yalnız bırakılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 10","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Paydalı denklemlerde kökü bulduktan sonra mutlaka orijinal denkleme yazıp sağlama yap, işlem hatası anında yakalanır.","konu":"denklem cozme","tablo":{"satirlar":[["VERİLENLER","-","-"],["Denklem","(x+1)/2 − (x−3)/3 = 2","-"],["HESAP","-","-"],["Ortak katla çarpma","6*(x+1)/2 - 6*(x-3)/3 = 6*2","3(x+1)-2(x-3)=12"],["Parantez açma","3x+3-2x+6=12","X+9=12"],["Bilinmeyeni yalnız bırakma","X=12-9","X=3"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"3","E":"21","A":"-7","D":"15","B":"-1"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Eksi işareti parantez içine dağıtırken −2(x−3) = −2x + 6 olması gerekirken, −6 yazan hata yapıyor; düzgün yapılsa x = 3 bulunur.","E":"x + 9 = 12 eşitliğinde 9\u0027u karşı tarafa geçirirken işaret değiştirip çıkartmalı, toplamamalısın; x = 12 − 9 = 3 olur.","A":"Paydaları 6 ile eşitledikten sonra denklemin sağ tarafındaki 2\u0027yi de 6 ile çarpmayı unuttun; çarparsan 12 olur ve x = 3 bulunur.","B":"Paydaları çarptığında birinci parantezi 3 ile, ikinci parantezi 2 ile çarpman gerekir; bunları ters yaptığında yanlış sonuç çıkar, doğru cevap x = 3\u0027tür."},"dogru":"Paydaları 6 ile çarpıp eşitle, parantezleri aç, benzer terimleri topla. Böyle 3(x+1) − 2(x−3) = 12 olur, buradan x+9 = 12 çıkıyor. Yani x = 3.","sinav":"Birinci dereceden bir bilinmeyenli denklemde paydalı terimler eşitlenip bilinmeyen yalnız bırakılır.","kavramlar":[{"kaynak":"TEORI","tanim":"Denklemde bir terim eşitliğin öteki tarafına geçirilirken işareti değiştirilir; artı eksi, eksi artı olur.","ad":"Taraf değiştirme"},{"kaynak":"TEORI","tanim":"Paydalı denklemd +9=12 eşitliğinde 9\u0027u karşı tarafa geçirirken işaretini değiştirmeyi unutup toplarsın. Doğrusu: taraf değiştiren terimin işareti değişir, x=12-9=3 olur."},"A":{"ad":"Payda Eşitleme Tuzağı","metin":"Paydaları eşitledikten sonra denklemin sağ tarafını (2) ortak katla çarpmayı unutursun. Doğrusu: 6 ile çarpınca sağ taraf da 12 olur, x=3 bulunur."},"B":{"ad":"Ortak Kat Karıştırma Tuzağı","metin":"Paydaları çarparken 2 ile 3\u0027ün yerini değiştirip yanlış katsayı uygularsın. Doğrusu: birinci terim 3 ile, ikinci terim 2 ile çarpılır, x=3 çıkar."}},"celdiriciYol":{"D":"3(x+1)-2(x-3)=12, -2*(-3) işlemini -6 yaptın → x-3=12 → x=15 (parantez açarken işareti yanlış aldın)","E":"x+9=12 → x=12+9=21 (taraf değiştirirken işareti değiştirmedin)","A":"3(x+1)-2(x-3)=2 → x+9=2 → x=-7 (sağ tarafı ortak katla çarpmadın)","B":"2(x+1)-3(x-3)=12 → -x+11=12 → x=-1 (ortak kat katsayılarını ters uyguladın)"},"hap":"Paydalı denklemde ortak kat, eşitliğin İKİ tarafına da uygulanır; taraf değiştiren terimin işareti değişir.","teshis":{"C":{"gercek":"Adım adım paydaları eşitleyip parantez açarak sağlama yapıldığında x=3 tutarlı çıkar.","ayirt":"Bulduğum kökü orijinal denkleme yazınca eşitlik sağlanıyor mu?","paragraf":"Denklem Çözme - Sağlama Kuralı","yanilgi":"Bu kadar çok işlem adımı olan bir soruda hata yapılacağını düşünüp şıkkı elersin."},"E":{"gercek":"Bir terim eşitliğin diğer tarafına geçerken işareti değişir (toplama çıkarmaya, çıkarma toplamaya döner).","ayirt":"Terimi karşı tarafa geçirirken işaretini ters mi çevirdim?","paragraf":"Denklem Çözme - Taraf Değiştirme Kuralı","yanilgi":"Taraf değiştiren terimin işaretinin aynı kalacağını sanıyorsun."},"A":{"gercek":"Eşitliğin iki tarafı da aynı sayıyla çarpılmalıdır; aksi halde denklem bozulur.","ayirt":"Çarptığım sayı denklemin HER İKİ tarafına da uygulandı mı?","paragraf":"Denklem Çözme - Paydalı Denklem Kuralı","yanilgi":"Ortak katla çarparken sadece sol tarafı çarpmanın yettiğini sanıyorsun."},"D":{"gercek":"−2(x−3) çarpımında h 12 elde edilir; orta terim −k olması gerektiğinden bu çarpanlama yanlıştır.","E":"k = 6, yanlış çarpanlama (k−6)(k+2) = 0\u0027dan elde edilir; bu ifade asıl k²−k−12 denklemini sağlamaz.","A":"k²−k−12 = 0 denkleminin her iki kökü bulunur ama k = −3 için diskriminant 4(−3)+12 = 0 olur, kökler çakışık hale gelir; soru iki farklı kök istediğinden bu değer elenir.","B":"k²−k−12 ifadesi yanlış çarpanlara ayrılırsa (k−6)(k+2) yazılır; ancak bu açıldığında k²−4k−12 verir, orijinal denklemle uyuşmaz."},"dogru":"Vieta kuralından kökler toplamı 2k+2, çarpımı k²+k−2\u0027dir. Çarpım toplamdan 8 fazla olduğu için k²+k−2 = (2k+2)+8 yazılır, bu k²−k−12 = 0 verir. Çarpanlara ayırınca k = 4 ya da k = −3 bulunur; ama k = −3 için diskriminant sıfır olup kökler çakışır, iki farklı kök şartını sağlamaz. Doğru cevap k = 4\u0027tür.","sinav":"İkinci dereceden denklemde Vieta formülleri uygulanarak kökler toplamı −b/a, kökler çarpımı c/a ve diskriminant b² − 4ac kullanılır; iki farklı gerçel kök için diskriminant pozitif olmalıdır.","kavramlar":[{"kaynak":"TEORI","tanim":"İkinci derece denklemde Δ = b² − 4ac değeridir; Δ \u003e 0 ise iki farklı gerçel kök, Δ = 0 ise çakışık kök, Δ \u003c 0 ise gerçel kök yoktur.","ad":"Diskriminant"},{"kaynak":"TEORI","tanim":"ax² + bx + c = 0 denkleminde kökler toplamı x₁ + x₂ = −b/a, kökler çarpımı x₁·x₂ = c/a\u0027dır.","ad":"Vieta formülleri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"tablo":{"basliklar":["Adım","İfade / Sonuç"],"satirlar":[["Kökler toplamı (x1+x2)","2m + 3"],["Kökler çarpımı (x1·x2)","m² − 5"],["Kurulan denklem (çarpım = toplam + 7)","m² − 5 = 2m + 10"],["Sadeleştirilmiş m denklemi","m² − 2m − 15 = 0"],["Çarpanlara ayırma","(m − 5)(m + 3) = 0 → m = 5 veya m = −3"],["Δx = 12m + 29 kontrolü (m=5)","Δx = 89 \u003e 0 → GEÇERLİ"],["Δx = 12m + 29 kontrolü (m=−3)","Δx = −7 \u003c 0 → GEÇERSİZ (reel kök yok)"],["Sonuç","m = 5"]]},"tur":"tablo","soru":"x² − (2m + 3)x + (m² − 5) = 0 denkleminin iki farklı reel kökü x₁, x₂\u0027dir. Köklerin çarpımı, köklerin toplamından 7 fazladır. Buna göre m kaçtır?","verilen":[[0,1],[2,1]],"hedef":"Tabloyu doldur ve m\u0027nin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"x² − (2k + 2)x + (k² + k − 2) = 0 denkleminin iki farklı reel kökü x₁, x₂\u0027dir. Köklerin çarpımı, köklerin toplamından 8 fazladır. Buna göre k kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-01","verilenler":[{"deger":"2","anlam":"Denklemdeki −(2k+2)x teriminin katsayısını oluşturur; kökler toplamı x1+x2=2k+2\u0027dir.","ad":"x katsayısındaki sabit çarpan"},{"deger":"−2","anlam":"Kökler çarpımı ifadesindeki sabit terimdir; x1·x2=k²+k−2 olarak kullanılır.","ad":"sabit terimdeki fark"},{"deger":"8","anlam":"Çarpımın toplamdan ne kadar fazla olduğunu belirtir; k²+k−2=(2k+2)+8 denklemini kurmakta kullanılır.","ad":"fazlalık miktarı"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - İkinci Derece Denklemler: Vieta bağıntıları (x1+x2=−b/a, x1·x2=c/a) ve diskriminant kuralı (Δ=b²−4ac; Δ\u003e0 iki farklı gerçel kök)","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: x² − (2k+2)x + (k²+k−2) = 0 (soruda verilen); çarpım = toplam + 8 şartı (soruda verilen); \u0027iki farklı reel kök\u0027 ayırt edici kelime","anlatim":"Soru bize denklemi ve bir şart veriyor: kökler çarpımı, kökler toplamından 8 fazla. Ayrıca iki farklı reel kök isteniyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kökler toplamı = x1 + x2 = 2k + 2 (soruda verilen katsayıdan)","anlatim":"Vieta formülüyle kökler toplamı katsayıdan direkt okunur. Burada x1+x2, x\u0027in katsayısının eksi işaretlisidir.","doldur":[[5,1],[6,1]]},{"formul":"Kökler çarpımı = x1 × x2 = k² + k − 2 (soruda verilen katsayıdan)","anlatim":"Vieta\u0027nın ikinci kuralı kökler çarpımını sabit terimden verir. Bu da denklemin sabit teriminin kendisidir.","doldur":[]},{"formul":"Kurulan denklem = çarpım = toplam + 8 = k² + k − 2 (2. adımda bulduk) = 2k + 2 (1. adımda bulduk) + 8 = k² + k − 2 = 2k + 10","anlatim":"Şimdi biz soruda verilen şartı kuruyoruz: çarpım, toplamdan 8 fazla. Bu bize k için bir denklem verir.","doldur":[[7,1]]},{"formul":"Sadeleştirilmiş denklem = k² + k − 2 − 2k − 10 = 0 = k² − k − 12 = 0 (3. adımda bulduk)","anlatim":"Şimdi biz denklemi sadeleştiriyoruz, tüm terimleri bir tarafa topluyoruz. Böylece k için çözülebilir ikinci derece denklem çıkar.","doldur":[[8,1]]},{"formul":"Çarpanlara ayırma = k² − k − 12 (4. adımda bulduk) = (k − 4)(k + 3) = 0 → k = 4 veya k = −3","anlatim":"Şimdi biz bu ikinci derece denklemi çarpanlarına ayırıyoruz. Çarpımları −12, toplamları −1 olan iki sayı −4 ve 3\u0027tür.","doldur":[[9,1]]},{"formul":"Δx = 4k + 12 → k = 4 (5. adımda bulduk) için Δx = 4 × 4 + 12 = 28 \u003e 0 → GEÇERLİ","anlatim":"Denklemin iki farklı reel kökü olması için diskriminant sıfırdan büyük olmalı. k=4 değerini bu şarta koyup kontrol ediyoruz.","doldur":[]},{"formul":"Δx = 4k + 12 → k = −3 (5. adımda bulduk) için Δx = 4 × (−3) + 12 = 0 → GEÇERSİZ (çakışık kök)","anlatim":"Aynı diskriminant şartını k=−3 için de deniyoruz. Sıfır çıkarsa kökler çakışık olur, bu da \u0027iki farklı reel kök\u0027 şartını bozar.","doldur":[]},{"formul":"Sonuç = k = 4 (6. adımda bulduk)","anlatim":"Diskriminant testinden geçen tek değer k=4 olduğu için sonuç budur. k=−3 elendiği için tabloya girmez.","doldur":[[12,1]]},{"formul":"Ters durum: çarpım = toplam − 8 → k² − k − 4 = 0","anlatim":"Ters durumda: soru \u0027çarpım, toplamdan 8 az\u0027 deseydi denklem k² + k − 2 = 2k + 2 − 8 olurdu. O zaman katsayılar değişir, kökler farklı çıkar.","doldur":[]},{"formul":"Yanlış yol: k = 4 veya k = −3 (HATALI) → doğrusu k = 4 (8. adımda bulduk)","anlatim":"En sık hata: öğrenci k=−3\u0027ü de geçerli sanıp iki cevap yazar. Oysa diskriminant kontrolü yapılmazsa çakışık kök veren değer elenmez.","doldur":[]}],"anahtar":[{"ornek":"denklemde","kok":"denkle"},{"ornek":"kökler","kok":"kökler"},{"ornek":"farklı","kok":"farklı"},{"ornek":"çarpımı","kok":"çarpım"},{"ornek":"toplamından","kok":"toplam"},{"ornek":"diskriminant","kok":"diskri"}],"konuGiris":{"harita":"Ne zaman test edilir: ikinci derece denklemde köklerin toplamı ve çarpımı arasında bir ilişki verildiğinde. Nasıl ölçülür: Vieta formülleri (x1+x2=-b/a, x1*x2=c/a) doğru katsayılarla kurulup denklem çözülerek. Nasıl kaydedilir: bulunan k değeri, diskriminant pozitiflik şartına da uyup uymadığı kontrol edilerek yazılır.","desen":"Soru, k\u0027yı içeren katsayılarla Vieta ilişkisini kurdurup denklem çözmeyi hedefler; tuzak, toplam ve çarpım formüllerindeki eksi işaretinin unutulmasıdır. Bazı öğrenciler diskriminant şartını (iki farklı reel kök) kontrol etmeyi atlar ve geçersiz k değerini de cevap sanır. Bu soru p.28 Vieta formülleri ve diskriminant şartı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"b²-4ac ifadesi; kökün gerçel ve farklı olup olmadığını belirler.","ad":"Diskriminant (Δ)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"İki kökün birbirine eklenmiş hali, -b/a\u0027ya eşittir.","ad":"Kökler toplamı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"İki kökün çarpımı, c/a\u0027ya eşittir.","ad":"Kökler çarpımı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Denklemdeki x², x ve sabit terimin önündeki sayılar.","ad":"Katsayı (a,b,c)","kim":"kanun sabitler"}],"sinavda":"Verilen ikinci derece denklemde köklerin çarpımı ile toplamı arasındaki ilişkiden k değeri istenir.","panel_ornek":"Bir markette 2 poşet elma ile 3 poşet armut toplam 20 lira, poşet sayıları ve fiyat ilişkisi bilindiğinde tek poşetin fiyatı bulunabilir. Burada da bilinmeyeni izole edip küçük bir eşitlik kurarsın. Sonuçta tek bir sayıya ulaşırsın.","ornek":"Bir markette 2 poşet elma ile 3 poşet armut toplam 20 lira, poşet sayıları ve fiyat ilişkisi bilindiğinde tek poşetin fiyatı bulunabilir. Burada da bilinmeyeni izole edip küçük bir eşitlik kurarsın. Sonuçta tek bir sayıya ulaşırsın.","yontemler":"Vieta formülleri ile toplam ve çarpım k\u0027ya bağlı yazılıp aralarındaki ilişki eşitlenir; bulunan k, diskriminant pozitiflik şartıyla test edilir.","nedir":"Denklem çözme, bilinmeyen sayının değerini bulma işidir. Sınav, kök toplamı-çarpımı (Vieta) ilişkisini doğru kurup denklemi çözebilme becerini ölçer."},"olay":"k²+k−2=(2k+2)+8 → k²−k−12=0 → (k−4)(k+3)=0 → k=4 veya k=−3; k=−3 için Δx=0 (çakışık kök) olduğundan elenir, k=4 için Δx=28\u003e0 geçerlidir.","tuzak":{"C":{"ad":"İşaret Karıştırma Tuzağı","metin":"(k−4)(k+3) çarpanlarının işaretini karıştırıp (k−3)(k+4) yazarsın; bu k²+k−12 verir, orta terim uymaz, k=3 yanlış çıkar. Doğrusu: orta terim −k olduğundan çarpanlar (k−4) ve (k+3)\u0027tür."},"E":{"ad":"Yanlış Çarpanlama Tuzağı","metin":"aynı hatalı (k−6)(k+2)=0 çarpanlamasından bu kez öteki kökü, k=6\u0027yı seçersin; bu çarpanlama zaten orijinal k²−k−12\u0027yi vermez. Doğrusu: gerçek çarpanlar (k−4)(k+3)\u0027tür, k=4 doğru köktür."},"A":{"ad":"Çakışık Kök Tuzağı","metin":"k²−k−12=0 denklemini çözüp k=−3\u0027ü de kabul edersin, ama bu k için Δx=0 olur; kökler çakışıktır, \u0027iki farklı reel kök\u0027 şartını sağlamaz. Doğrusu: Δx\u003e0 kontrolü yapılmadan k=−3 elenmelidir."},"B":{"ad":"Yanlış Çarpanlama Tuzağı","metin":"k²−k−12=0 ifadesini orta terimi denetlemeden (k−6)(k+2) diye çarpanlarına ayırıp k=−2 bulursun; bu çarpım açıldığında k²−4k−12 verir, aslındaki denklemi karşılamaz. Doğrusu: doğru çarpanlama (k−4)(k+3)=0\u0027dır."}},"celdiriciYol":{"C":"k²−k−12=0 çarpanlarının işareti karıştırılıp (k−3)(k+4)=k²+k−12 yazılır → k=3 (işaret karıştırma)","E":"(k−6)(k+2)=k²−4k−12 yanlış çarpanlamasının öteki kökü alınır → k=6 (yanlış çarpanlama)","A":"k²−k−12=0 → (k−4)(k+3)=0 kökleri k=4 ve k=−3; Δx=4k+12 kontrolü atlanıp k=−3 de kabul edilir = -3 (çakışık kök gözden kaçırılır)","B":"k²−k−12=0 yanlış çarpanlanır: (k−6)(k+2)=k²−4k−12 (orta terim denetlenmez) → k=-2 (yanlış çarpanlama)"},"hap":"İkinci derece denklemde parametre bulunurken çıkan her kök için, sorunun istediği \u0027farklı reel kök\u0027 şartını Δ üzerinden mutlaka tekrar sına.","teshis":{"C":{"gercek":"(k−a)(k−b)=k²−(a+b)k+ab formunda, toplam=−(−1)=1 ve çarpım=−12 olacak şekilde a,b seçilmelidir; bu yalnızca 4 ve −3 ile sağlanır.","ayirt":"Seçtiğim çarpanların toplamı, denklemdeki orta terimin işaretiyle uyuşuyor mu?","paragraf":"Vieta bağıntıları (toplam/çarpım)","yanilgi":"Çarpanların işaretlerini toplam ve çarpım kurallarına bakmadan rastgele dağıtabileceğini sanıyorsun."},"E":{"gercek":"(k−6)(k+2) açılımı k²−4k−12 verir, hedef denklem k²−k−12 ile örtüşmez; dolayısıyla bu çarpanlamadan çıkan hiçbir kök geçerli değildir.","ayirt":"Çarpanlarımı açtığımda orta terim gerçekten −1k mi çıkıyor?","paragraf":"Çarpanlara ayırma adımı","yanilgi":"Yanlış kurduğun bir çarpanlamadan çıkan iki kökü de doğru sanıp aralarından rastgele birini cevap yapabileceğini düşünüyorsun."},"A":{"gercek":"Δ=0 durumunda kökler çakışıktır (tek bir reel kök tekrar eder), bu \u0027iki farklı reel kök\u0027 ifadesini sağlamaz; TESMER SGS Matematik-İstatistik Ders Notu diskriminant kuralı Δ\u003e0 iki farklı gerçel kök şartını koyar.","ayirt":"Bulduğum k değeri için Δx=4k+12\u0027yi hesapladım mı, Δx\u003e0 mı çıktı?","paragraf":"Diskriminant kuralı","yanilgi":"k için bulduğun her cebirsel kökü, denklemin \u0027iki farklı reel kök\u0027 şartını kontrol etmeden geçerli sayıyorsun."},"D":{"gercek":"x1+x2=−b/a=2k+2, x1·x2=c/a=k²+k−2 kuralı ile kurulan k²−k−12=0 denkleminin iki kökünden yalnız Δx\u003e0 şartını sağlayanı kabul edilir; bu da k=4\u0027tür.","ayirt":"Vieta\u0027dan bulduğum k adaylarının her birini orijinal denklemin diskriminant şartına geri koydum mu?","paragraf":"Vieta bağıntıları + Diskriminant kuralı","yanilgi":"Bu şıkkı eleyen öğrenci, Vieta bağıntısını kurup denklemi çözdükten sonra iki adaydan hangisinin gerçekten geçerli olduğunu sınamayı gereksiz sanır."},"B":{"gercek":"Çarpanlara ayırma, açılımın orta terimi de tutturması gerekir; (k−6)(k+2)=k²−4k−12 olup hedef k²−k−12 ile aynı değildir.","ayirt":"Bulduğum çarpanları açıp orijinal denklemi verip vermediğini kontrol ettim mi?","paragraf":"Çarpanlara ayırma adımı","yanilgi":"İkinci dereceden denklemi çarpanlarına ayırırken orta terimi (katsayıyı) tekrar kontrol etmeden \u0027göz kararı\u0027 çarpanlama yapabileceğini düşünüyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":7,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 13"},"kural":"eğri ekseni kesiyorsa aralık kesim noktasından bölünür, her parça ayrı integre edilip mutlak değerleri toplanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 13","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce f(x)=0 çöz, işaret değiştiren noktayı bul; sonra parçala, sonra mutlak değer al, en son topla.","konu":"belirli integral","tablo":{"satirlar":[["VERİLENLER","-"],["Fonksiyon","2x - 2"],["Alt sınır","x = 0"],["Üst sınır","x = 2"],["HESAP","-"],["Kesim noktası (2x-2=0)","X=1"],["Ters türev F(x)=x²-2x","-"],["[0,1] parçası F(1)-F(0)","-1"],["[1,2] parçası F(2)-F(1)","1"],["Alan = |-1| + |1|","2"]],"basliklar":["Adım","Değer"]},"siklar":{"C":"1,5","E":"4","A":"0","D":"2","B":"1"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"2x-2=0 denklemi yanlış çözülüp kesim noktası x=1,5 bulunur, bölme yanlış yerden yapılır; oysa doğru kesim noktası x=1\u0027dir.","E":"Ters türev alınırken sabit terim (-2) ihmal edilerek F(x)=x² kullanılırsa yanlış sonuç çıkar; F(x)=x²-2x olmalıdır.","A":"Fonksiyonun ekseni kestiği noktayı bulunmadan doğrudan F(2)-F(0) yapılırsa, pozitif ve negatif kısımlar birbirini götürüp sıfır çıkar; oysa bölge iki parçaya ayrılmalı ve her parçanın mutlak değeri ayrı toplanmalıdır.","B":"Sadece x=0\u0027dan x=1\u0027e kadar olan kısım hesaplanıp x=1\u0027den x=2\u0027ye kadar olan kısım unutulmuş; istenen bölgenin tüm parçaları hesaba katılması gerekir."},"dogru":"Fonksiyon x=1\u0027de ekseni kesiyor. Böylece [0,1] ve [1,2] olmak üzere iki parçaya ayrılıyor. Her parçanın integralinin mutlak değeri alınıp toplanıyor: 1+1=2 birimkare.","sinav":"Belirli integral yardımıyla eğri ile x ekseni arasında kalan alanın hesaplanması.","kavramlar":[{"kaynak":"TEORI","tanim":"Bir fonksiyonun iki sınır arasındaki alanını hesaplamak için kullanılan matematiksel işlem; ters türev F\u0027ye göre F(b)-F(a) formülüyle bulunur.","ad":"Belirli integral"},{"kaynak":"TEORI","tanim":"Fonksiyon ekseni kesiyorsa aralık kesim noktalarından bölünür; her parçanın integralinin mutlak değerleri toplanarak toplam alan bulunur.","ad":"Eğri ile eksen arasındaki alan"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Adım","Değer"],"satirlar":[["Kesim noktası (4x-4=0)","X=1"],["Ters türev F(x)=2x²-4x","-"],["[0,1] parçası F(1)-F(0)","-2"],["[1,2] parçası F(2)-F(1)","2"],["Alan = |-2| + |2|","4"]]},"tur":"tablo","soru":"g(x) = 4x - 4 fonksiyonu ile Ox ekseni arasında, x = 0 ile x = 2 doğruları arasında kalan bölgenin alanı kaç birimkaredir?","verilen":[],"hedef":"Tabloyu doldur ve alanın kaç birimkare olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f(x) = 2x - 2 fonksiyonu ile Ox ekseni arasında, x = 0 ile x = 2 doğruları arasında kalan bölgenin alanı kaç birimkaredir?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-04","verilenler":[{"deger":"2x - 2","anlam":"x ekseniyle arasındaki alan hesaplanacak fonksiyon.","ad":"Fonksiyon"},{"deger":"x = 0","anlam":"Alan hesabının başlangıç noktası.","ad":"Alt sınır"},{"deger":"x = 2","anlam":"Alan hesabının bitiş noktası.","ad":"Üst sınır"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu, Belirli İntegral ve Alan Hesabı bölümü","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: f(x) = 2x - 2 (soruda verilen); sınırlar x = 0 ve x = 2 (soruda verilen); \u0027Ox ekseni ile arasındaki alan\u0027 ifadesi belirleyici","anlatim":"Soru bize f(x) = 2x - 2 fonksiyonunu, sınırları x = 0 ile x = 2 olarak vermiş. İstenen şey Ox ekseniyle bu fonksiyon arasındaki alan.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kesim noktası = 2x - 2 = 0 → x = 1","anlatim":"Alan sorularında eğri ekseni kesiyorsa önce kesim noktasını buluruz. Çünkü eğri eksenin altına geçerse integral eksi çıkar, alan asla eksi olamaz.","doldur":[[5,1],[9,1]]},{"formul":"F(x) = x² - 2x","anlatim":"Şimdi biz ters türevi hesaplıyoruz, çünkü alanı bulmak için önce fonksiyonun ters türevine ihtiyacımız var. 2x\u0027in ters türevi x², -2\u0027nin ters türevi -2x\u0027tir.","doldur":[]},{"formul":"[0;1] parçası = F(1) - F(0) = (1² - 2×1) - (0² - 2×0) = -1 - 0 = -1","anlatim":"Fonksiyon x=1\u0027de eksende kesiştiği için 0 ile 2 arasını ikiye böldük. Şimdi biz ilk parçayı, 0\u0027dan 1\u0027e kadar olan kısmı hesaplıyoruz.","doldur":[]},{"formul":"[1;2] parçası = F(2) - F(1) = (2² - 2×2) - (1² - 2×1) = 0 - (-1) = 1","anlatim":"Şimdi biz ikinci parçayı, 1\u0027den 2\u0027ye kadar olan kısmı hesaplıyoruz. Bu parça eksenin üstünde kaldığı için sonuç pozitif çıkıyor.","doldur":[]},{"formul":"Alan = |-1 (3. adımda bulduk)| + |1 (4. adımda bulduk)| = 1 + 1 = 2 birimkare","anlatim":"Alan hesabında negatif çıkan parçayı mutlak değere çeviririz, çünkü alan eksi olamaz. İki parçanın mutlak değerlerini topluyoruz.","doldur":[]},{"formul":"Yanlış yol: F(2) - F(0) = 0 - 0 = 0 (HATALI) → doğrusu 2 (5. adımda bulduk)","anlatim":"Yanlış yol, kesim noktasını göz ardı edip direkt F(2)-F(0) yapmaktır. Bu durumda eksi ve artı parçalar birbirini götürür, alan yanlış çıkar.","doldur":[]}],"anahtar":[{"ornek":"eksenini","kok":"ekseni"},{"ornek":"fonksiyonunu","kok":"fonksi"},{"ornek":"mutlak","kok":"mutlak"},{"ornek":"türevi","kok":"türevi"},{"ornek":"noktasından","kok":"noktas"},{"ornek":"kesiyorsa","kok":"kesiyo"}],"konuGiris":{"harita":"Ne zaman bölünür: eğri eksende bir noktada işaret değiştiriyorsa aralık o noktadan ikiye ayrılır. Nasıl ölçülür: her parça ayrı integral alınıp mutlak değeri hesaplanır. Nasıl toplanır: parçaların mutlak değerleri toplanarak toplam alan bulunur.","desen":"Sınav genelde doğrunun eksenle kesiştiği noktayı gizler, öğrenci tek integralle işlem yaparsa pozitif ve negatif parçalar birbirini götürüp alan eksik çıkar. Sorunun \u0027alan\u0027 istediği, \u0027integral değeri\u0027 istemediği vurgulanır, işaret farkı gözden kaçırılmamalıdır. Bu soru eğrinin eksen altı-üstü ayrımı noktasından geliyor (p.28).","terimler":[{"kaynak":"sen hesaplarsın","tanim":"fonksiyonun x eksenini kestiği yer, f(x)=0 denkleminden bulunur","ad":"kesişim noktası","kim":"kuraldan bilinir"},{"kaynak":"sen hesaplarsın","tanim":"türevi f(x) olan fonksiyon, integral hesabının temelidir","ad":"ters türev (F(x))","kim":"kuraldan bilinir"},{"kaynak":"sen hesaplarsın","tanim":"F(b)-F(a) işleminden çıkan işaretli sonuç, negatif olabilir","ad":"integral değeri","kim":"kuraldan bilinir"},{"kaynak":"sen hesaplarsın","tanim":"integral sonucunun mutlak değeri alınarak elde edilen daima pozitif büyüklük","ad":"alan","kim":"kuraldan bilinir"}],"sinavda":"Doğrunun denklemi ve iki sınır verilir, bu sınırlar arasında kalan bölgenin alanı istenir.","panel_ornek":"Bir markette kâr-zarar grafiği önce eksinin altında (zarar) sonra üstünde (kâr) seyrediyor. 3 ay zarar, sonraki 2 ay kâr etmiş; toplam durumu anlamak için iki dönemi ayrı hesaplayıp toplaman gerekir, çünkü zarar ile kârı direkt toplarsan gerçek tabloyu göremezsin.","ornek":"Bir markette kâr-zarar grafiği önce eksinin altında (zarar) sonra üstünde (kâr) seyrediyor. 3 ay zarar, sonraki 2 ay kâr etmiş; toplam durumu anlamak için iki dönemi ayrı hesaplayıp toplaman gerekir, çünkü zarar ile kârı direkt toplarsan gerçek tabloyu göremezsin.","yontemler":"Önce f(x)=0\u0027dan kesişim noktası bulunur, sonra aralık bu noktadan ikiye bölünüp her parçanın integrali ayrı alınarak mutlak değerleri toplanır.","nedir":"Belirli integral, bir eğri ile eksen arasındaki bölgenin sınırlı alanını hesaplama yöntemidir. Sınav, eğrinin eksen üstünde ve altında kaldığı parçaları ayırt edip alanı doğru toplayabildiğini ölçer."},"olay":"2x-2=0\u0027dan x=1; F(x)=x²-2x; F(1)-F(0)=-1, F(2)-F(1)=1; Alan=|-1|+|1|=2.","tuzak":{"C":{"ad":"Denklem Çözüm Hatası Tuzağı","metin":"Öğrenci 2x-2=0 denklemini yanlış çözüp kesim noktasını x=1,5 bulur ve bölmeyi buna göre yapar. Doğrusu: 2x-2=0 denklemi doğru çözülürse kesim noktası x=1 çıkar."},"E":{"ad":"Sabit Terimi Atlama Tuzağı","metin":"Öğrenci ters türev alırken sabit terimi (-2) unutup F(x)=x² kullanır, bu da parçaları 1 ve 3 yapar. Doğrusu: ters türev F(x)=x²-2x olmalı, sabit terim de entegre edilmelidir."},"A":{"ad":"Kesim Noktasını Atlama Tuzağı","metin":"Öğrenci fonksiyonun ekseni kestiği noktayı bulmadan doğrudan F(2)-F(0) işlemini yapar ve pozitif-negatif parçalar birbirini götürdüğü için sıfır bulur. Doğrusu: bölge önce kesim noktasından ikiye ayrılmalı, sonra mutlak değerler toplanmalıdır."},"B":{"ad":"Kapsam Eksikliği Tuzağı","metin":"Öğrenci yalnızca [0,1] parçasının alanını hesaplayıp [1,2] parçasını unutur. Doğrusu: eksen ile sınırlı bölgenin TÜM parçaları hesaba katılmalıdır."}},"celdiriciYol":{"C":"Kesim noktası yanlış çözülüp x=1,5 bulunur: |F(1,5)-F(0)| + |F(2)-F(1,5)| = 0,75 + 0,75 = 1,5 (denklem çözüm hatası)","E":"Ters türevde sabit terim atlanır (F(x)=x²): |F(1)-F(0)| + |F(2)-F(1)| = 1 + 3 = 4 (sabit terimi entegre etmeme)","A":"Kesim noktası bulunmadan tek integral: F(2)-F(0) = (4-4) - (0-0) = 0 (integral değerini alan sanma)","B":"Yalnız [0,1] parçasının alanı: |F(1)-F(0)| = |(-1)-0| = 1 (bölgenin bir kısmını hesaba katmama)"},"hap":"Eğri x eksenini kesiyorsa alan, kesim noktasından bölünüp her parçanın mutlak değeri toplanarak bulunur.","teshis":{"C":{"gercek":"f(x)=0 denklemi 2x-2=0 biçimindedir ve doğru çözüm x=1\u0027dir; yanlış çözüm tüm parçaları bozar.","ayirt":"f(x)=0 denklemini elle tekrar çözersem aynı sonucu buluyor muyum?","paragraf":"Belirli İntegral - Alan Hesabı, madde (a)","yanilgi":"Kesim noktasını bulurken yaptığın denklem çözümünün doğruluğunu kontrol etmeden ilerliyorsun."},"E":{"gercek":"2x-2 ifadesinin ters türevi x²-2x\u0027tir; sabit terim de kuvvet kuralıyla entegre edilmelidir.","ayirt":"Ters türevimi türetip orijinal fonksiyonu geri veriyor mu diye kontrol ettim mi?","paragraf":"Belirli İntegral - Temel Teorem","yanilgi":"Ters türev alırken sabit terimin de entegre edilmesi gerektiğini atlıyorsun."},"A":{"gercek":"Eğri eksenin altına indiğinde integral negatif çıkar; alan ise daima pozitiftir, bu yüzden kesim noktasından bölüp mutlak değer almak gerekir.","ayirt":"Fonksiyon aralıkta işaret değiştiriyor mu, f(x)=0 çözümünü kontrol ettim mi?","paragraf":"Belirli İntegral - Alan Hesabı, madde (a)","yanilgi":"İntegralin sayısal değeri ile eğrinin sınırladığı alanın aynı şey olduğunu düşünüyorsun."},"D":{"gercek":"Eğri x eksenini kestiği için aralık x=1 noktasından bölünür, her parça ayrı integre edilip mutlak değerleri toplanır: 2 birimkare.","ayirt":"Fonksiyon aralıkta işaret değiştiriyor mu, değiştiriyorsa parçaladım mı?","paragraf":"Belirli İntegral - Alan Hesabı, madde (a)","yanilgi":"Bu şıkkı eleyen öğrenci, parçalama ve mutlak değer adımının gerekli olmadığını, tek integralin yeterli olduğunu düşünür."},"B":{"gercek":"Aralık kesim noktasından bölündüğünde bölgenin TÜM parçaları ayrı hesaplanıp toplanmalıdır.","ayirt":"Sorulan aralığın tamamını mı kapsadım, yoksa bir parçasında mı kaldım?","paragraf":"Belirli İntegral - Alan Hesabı, madde (a)","yanilgi":"Kesim noktasını bulup bir parçayı hesapladıktan sonra işin bittiğini sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":6,"hesaplar":{}},{ tisman tahakkuku yapılmıştır. İşlemler sonrası aktif toplamı kaç TL\u0027dir?","verilen":[[0,1],[1,1],[4,1]],"hedef":"Tabloyu doldur ve işlemler sonrası aktif toplamının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin aktif toplamı 500.000 TL\u0027dir. Sırasıyla 60.000 TL kredili mal alışı, 40.000 TL satıcı borcu ödemesi, 25.000 TL alacak tahsili, maliyeti 30.000 TL malın 45.000 TL\u0027ye peşin satışı, 5.000 TL amortisman tahakkuku yapılmıştır. İşlemler sonrası aktif toplamı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-03","verilenler":[{"deger":"500.000 TL","anlam":"Hesabın başladığı aktif toplamı","ad":"Başlangıç aktif toplamı"},{"deger":"60.000 TL","anlam":"Stok ve borç hesabını birlikte artırır, aktif toplamını artırır","ad":"Kredili mal alışı"},{"deger":"40.000 TL","anlam":"Nakit çıkışıyla borç kapatılır, aktif toplamını azaltır","ad":"Satıcı borcu ödemesi"},{"deger":"25.000 TL","anlam":"Bir aktif hesaptan diğerine aktarımdır, aktif toplamını değiştirmez","ad":"Alacak tahsili"},{"deger":"30.000 TL","anlam":"Peşin satışta stoktan çıkan tutar, kâr hesabında kullanılır","ad":"Satılan malın maliyeti"},{"deger":"45.000 TL","anlam":"Peşin satışta aktife giren tutar, kâr hesabında kullanılır","ad":"Satış fiyatı"},{"deger":"5.000 TL","anlam":"Tahakkuk eden gider, aktifi (net defter değerini) azaltır","ad":"Amortisman gideri"}],"dayanak":"Tekdüzen Hesap Planı - bilanço eşitliği ilkesi (Varlıklar = Yabancı Kaynaklar + Özkaynaklar)","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: Kredili mal alışı 60.000 TL (soruda verilen); Satıcı borcu ödemesi 40.000 TL (soruda verilen); Alacak tahsili 25.000 TL (soruda verilen); Satış maliyeti 30.000 TL ve satış fiyatı 45.000 TL (soruda verilen); Amortisman tahakkuku 5.000 TL (soruda verilen); Aktif toplamı 500.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: kredili mal alışı 60.000 TL, satıcı borcu ödemesi 40.000 TL, amortisman tahakkuku 5.000 TL. Ayrıca alacak tahsili 25.000 TL ve 30.000 TL maliyetli malın 45.000 TL\u0027ye peşin satışı da soruda anlatılıyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[9,1],[10,1],[13,1]]},{"formul":"Alacak tahsili etkisi = alacak azalışı + kasa artışı = -25.000 (soruda verilen) + 25.000 (soruda verilen) = 0","anlatim":"Alacak tahsili sadece aktif içinde yer değiştirir - alacak azalır, kasa artar. Bu yüzden toplam aktif hiç değişmez.","doldur":[[11,1]]},{"formul":"Peşin satış - kâr etkisi = satış fiyatı - maliyet = 45.000 (soruda verilen) - 30.000 (soruda verilen) = 15.000","anlatim":"Kârlı satışta stok maliyeti düşer ama kasaya giren para daha fazladır - aradaki fark kâr olarak aktifi büyütür. Dikkat: satış fiyatı değil, sadece kâr kısmı aktifi etkiler.","doldur":[[12,1]]},{"formul":"Net değişim toplamı = kredili alış + satıcı ödemesi + alacak tahsili + satış kârı + amortisman = 60.000 (soruda verilen) + (-40.000) (soruda verilen) + 0 (2. adımda bulduk) + 15.000 (3. adımda bulduk) + (-5.000) (soruda verilen) = 30.000","anlatim":"Şimdi beş işlemin aktife etkisini tek tek topluyoruz - alış artırır, ödeme azaltır, tahsil etkilemez, kâr artırır, gider azaltır. Bu bize net değişimi verir.","doldur":[[14,1]]},{"formul":"Yeni aktif toplamı = eski aktif toplamı + net değişim = 500.000 (soruda verilen) + 30.000 (4. adımda bulduk) = 530.000 TL","anlatim":"Başlangıçtaki aktif toplamına net değişimi ekleyerek son durumu buluyoruz. Bu bizim aradığımız sonuç.","doldur":[[15,1]]},{"formul":"Ters durum: satış fiyatı maliyetten düşük olsaydı → aktif toplamına zarar kadar eksi etki","anlatim":"Ters durumda satış zararlı olsaydı, kâr yerine zarar aktifi azaltırdı. Yani işlem her zaman aynı yönde etkilemez, kâr mı zarar mı ona bakılır.","doldur":[]},{"formul":"Yanlış yol: 500.000 + 60.000 - 40.000 + 25.000 + 15.000 - 5.000 = 555.000 (HATALI) → doğrusu 530.000 (5. adımda bulduk)","anlatim":"En sık hata: alacak tahsilini de aktifi artıran bir işlem sanıp 25.000 TL\u0027yi toplama eklemek. Oysa tahsilat aktif içi hareket olduğu için toplamı hiç değiştirmez.","doldur":[]}],"anahtar":[{"ornek":"tahsili","kok":"tahsil"},{"ornek":"alacak","kok":"alacak"},{"ornek":"aktifi","kok":"aktifi"},{"ornek":"toplamına","kok":"toplam"},{"ornek":"azaltır","kok":"azaltı"},{"ornek":"değiştirmez","kok":"değişt"}],"konuGiris":null,"olay":"500.000+60.000-40.000+0+15.000-5.000.","tuzak":{"C":{"ad":"Amortismanı Atlama Tuzağı","metin":"Amortisman gideri tahakkukunun özkaynağı azalttığını ama aktifi etkilemediğini düşündün. Doğrusu: birikmiş amortisman artışı net aktif değerini 5.000 TL azaltır."},"E":{"ad":"Kâr-Bedel Karıştırma Tuzağı","metin":"Peşin satışta stoktan çıkan maliyeti düşmeyi unutup satış bedelinin tamamını aktif artışı saydın. Doğrusu: aktif toplamı yalnız kâr (45.000-30.000=15.000) kadar artar."},"D":{"ad":"Aktif İçi Hareketi Toplama Tuzağı","metin":"Alacak tahsilinin kasayı artırdığını görüp bunu net artış olarak topladın. Doğrusu: 100 hesap artarken 120 hesap aynı tutarda azalır, toplam değişmez."},"A":{"ad":"Taraf Karıştırma Tuzağı","metin":"Kredili mal alışını aktif azaltan, satıcı borcu ödemesini aktif artıran işlem sanıp işaretleri ters uyguladın. Doğrusu: kredili alış aktifi artırır, borç ödemesi aktifi azaltır."}},"celdiriciYol":{"C":"500.000 + 60.000 - 40.000 + 0 + 15.000 = 535.000 (amortisman tahakkukunun aktifi azalttığını atladın)","E":"500.000 + 60.000 - 40.000 + 0 + 45.000 - 5.000 = 560.000 (satışta kâr yerine satış bedelinin tamamını ekledin)","D":"500.000 + 60.000 - 40.000 + 25.000 + 15.000 - 5.000 = 555.000 (alacak tahsilini aktif toplamını artıran işlem saydın)","A":"500.000 - 60.000 + 40.000 + 0 + 15.000 - 5.000 = 490.000 (kredili alış ve borç ödemesinin işaretini ters uyguladın)"},"hap":"Ardışık işlemler zincirinde aktif toplamına toplam etki, her işlemin ayrı ayrı net etkisinin cebirsel toplamıdır.","teshis":{"C":{"gercek":"257 BİRİKMİŞ AMORTİSMANLAR artışı, ilgili duran varlığın net defter değerini yani aktif toplamını azaltır.","ayirt":"Amortisman kaydında hangi hesap aktifin düzenleyicisi olarak azalış yaratıyor?","paragraf":"Tekdüzen Hesap Planı - bilanço eşitliği","yanilgi":"Amortisman tahakkukunun sadece gider/özkaynak tarafını etkilediğini, aktife dokunmadığını sanıyorsun."},"E":{"gercek":"Satışta 120/100 satış bedeli kadar artar, 153 STOKLAR maliyet kadar azalır; net etki yalnızca kâr kadardır.","ayirt":"Aktife giren tutarla aktiften çıkan stok tutarını ayrı ayrı hesapladım mı?","paragraf":"Tekdüzen Hesap Planı - bilanço eşitliği","yanilgi":"Peşin satışta stoktan çıkan malın maliyetini düşmeyi unutup satış bedelinin tamamını kazanç sanıyorsun."},"A":{"gercek":"Kredili mal alışında 153 STOKLAR ve 320 SATICILAR birlikte artar; borç ödemesinde 320 ve 100 birlikte azalır.","ayirt":"Bu işlemde hangi hesap aktif, hangisi pasif ve yönü artış mı azalış mı?","paragraf":"Tekdüzen Hesap Planı - bilanço eşitliği","yanilgi":"Kredili alış ve borç ödemesinin aktif üzerindeki yönünü karıştırıp işaretleri ters uyguluyorsun."},"D":{"gercek":"Alacak tahsilinde 100 KASA artarken 120 ALICILAR aynı tutarda azalır; iki aktif hesap arasında yer değişimi olur.","ayirt":"Bu işlemde karşı taraf da bir aktif hesap mı, öyleyse toplam gerçekten değişiyor mu?","paragraf":"Tekdüzen Hesap Planı - bilanço eşitliği","yanilgi":"Kasaya para girdiğinde aktif toplamının otomatik arttığını sanıyorsun, karşı hesabı unutuyorsun."},"B":{"gercek":"Aktif içi hareketler (alacak tahsili) toplamı değiştirmez, kârlı satış yalnız kâr kadar artırır, gider tahakkuku aktifi azaltır; net etki 30.000 TL\u0027dir.","ayirt":"Her işlemi tek tek yazıp işaretini kontrol ettim mi, sonra topladım mı?","paragraf":"Tekdüzen Hesap Planı - bilanço eşitliği","yanilgi":"Bu şıkkı eleyen öğrenci alacak tahsilini de artış sayarak veya amortismanı gözden kaçırarak farklı bir tutara ulaşır."}},"verilen":[[9,1],[10,1],[13,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"donem":6,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 12"},"kural":"0/0 belirsizliğinde çarpanlara ayrılıp ortak çarpan sadeleştirilir, sonsuzda rasyonel limitte dereceler eşitse baş katsayılar oranlanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 12","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Birleşik limit sorularında her limiti kendi yöntemiyle ayrı çöz, en son topla; ara sonuçları karıştırma.","konu":"limit hesaplama","tablo":{"satirlar":[["VERİLENLER","-","-"],["İfade 1","(x²−1)/(x−1), x→1","-"],["İfade 2","(2x²−3)/(x²+5), x→∞","-"],["HESAP","-","-"],["Lim(x→1) (x²−1)/(x−1)","Çarpanlara ayır: (x−1)(x+1)/(x−1), sadeleştir, x=1 koy","2"],["Lim(x→∞) (2x²−3)/(x²+5)","Dereceler eşit, baş katsayılar oranı 2/1","2"],["Toplam","2 + 2","4"]],"basliklar":["Kalem","İşlem","Sonuç"]},"siklar":{"C":"3","E":"Sonsuzdur","A":"2","D":"4","B":"2,5"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Her 0/0 belirsizliğinin sonucu 1\u0027dir diye varsayarsan ilk limiti yanlış 1 bulursun; çarpanlara ayrıp sadeleştirme gerekli, sonuç 2\u0027dir.","E":"İkinci ifadede payın derecesinin paydadan büyük olduğunu yanılgısıyla limiti sonsuz kabul edersen; oysa her iki terim de ikinci derecedir, baş katsayılar oranı 2 çıkar.","A":"0/0 belirsizliğini çarpanlara ayırmadan doğrudan sıfır kabul edip ilk limiti 0 sayarsan, ikinci limiti (2) topladığında 2 bulursun; oysa ilk limit sadeleştirme sonrası 2 çıkması gerekir.","B":"Sonsuzda derece eşitliğini gördüğünde baş katsayılar oranını ters sırada (payda/pay) yazarsan 1/2 bulursun; doğru sıra pay/payda olup 2/1 = 2\u0027dir."},"dogru":"İlk limit 0/0 belirsizliğini çarpanlara ayırıp sadeleştirerek çöz: (x²−1)/(x−1) = (x−1)(x+1)/(x−1) = x+1, x=1 için 2 bulursun. İkinci limit sonsuzda rasyonel fonksiyon: pay ve payda dereceleri eşit (ikinci derece) olduğu için baş katsayılar oranı 2/1 = 2 sonucunu verir. Toplam: 2 + 2 = 4.","sinav":"Limit hesaplamada 0/0 belirsizliğini çarpanlara ayırıp sadeleştirme yöntemi ile, sonsuzda rasyonel fonksiyon limitini baş katsayılar oranı ile bularak toplanır.","kavramlar":[{"kaynak":"TEORI","tanim":"Pay ve payda yerine konduğunda her ikisi de sıfır sonucu veriyorsa, limit değeri henüz belirlenemez; çarpanlara ayrılıp sıfır yapan ortak çarpan sadeleştirilerek çözülür.","ad":"0/0 belirsizliği"},{"kaynak":"TEORI","tanim":"x sonsuza giderken pay ve paydanın en büyük dereceli terimleri belirleyici rol oynar; dereceler eşitse limit baş katsayılar oranıdır.","ad":"Sonsuzda rasyonel limit"},{"kaynak":"TEORI","tanim":"0/0 belirsizliğini gidermek için polinom pay ve paydanın çarpan biçimine dönüştürülüp x değerini sıfır yapan ortak çarpan giderilir.","ad":"Çarpanlara ayrılıp sadeleştirme"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":5,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Kalem","İşlem","Sonuç"],"satirlar":[["Lim(x→2) (x²−4)/(x−2)","Çarpanlara ayır: (x−2)(x+2)/(x−2), sadeleştir, x=2 koy","4"],["Lim(x→∞) (3x²−7)/(x²+4)","Dereceler eşit, baş katsayılar oranı 3/1","3"],["Toplam","4 + 3","7"]]},"tur":"tablo","soru":"lim (x→2) (x²−4)/(x−2) ile lim (x→∞) (3x²−7)/(x²+4) limitlerinin toplamı kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve Toplam sonucunun kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"lim (x→1) (x²−1)/(x−1) ile lim (x→∞) (2x²−3)/(x²+5) limitlerinin toplamı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-05","verilenler":[{"deger":"(x²−1)/(x−1), x→1","anlam":"0/0 belirsizliği taşır; çarpanlara ayırıp sadeleştirilecek limit ifadesi","ad":"İfade 1"},{"deger":"(2x²−3)/(x²+5), x→∞","anlam":"sonsuzda rasyonel fonksiyon limiti; pay ve payda en yüksek dereceli terimlere göre değerlendirilecek ifade","ad":"İfade 2"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Limit Hesaplama (0/0 belirsizliği ve sonsuzda limit kuralları)","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: Kalem 1 lim(x→1) (x²−1)/(x−1) (soruda verilen); Kalem 2 lim(x→∞) (2x²−3)/(x²+5) (soruda verilen)","anlatim":"Soru bize iki limit ifadesi vermiş. Birini x→1\u0027de, diğerini x→∞\u0027da hesaplayıp toplayacağız.","verilenAdim":true,"doldur":[[1,1],[2,1],[4,0],[5,0]]},{"formul":"(x²−1)/(x−1) = (x−1)(x+1)/(x−1) = (x+1)","anlatim":"x=1 koyunca payda sıfır oluyor, bu 0/0 belirsizliği demek. Payı çarpanlarına ayırıp paydayla sadeleştirmemiz gerekiyor.","doldur":[[4,1]]},{"formul":"Lim1 = x + 1 = 1 (soruda verilen) + 1 = 2","anlatim":"Sadeleşen (x+1) ifadesine artık x=1\u0027i rahatça koyabiliriz, çünkü belirsizlik ortadan kalktı.","doldur":[[4,2]]},{"formul":"Lim2 = büyük dereceli katsayı oranı = 2x²/x² = 2/1 = 2","anlatim":"İkinci limitte x sonsuza gidiyor, pay ve paydanın derecesi ikişer, yani eşit. Dereceler eşitse limit doğrudan en yüksek dereceli terimlerin katsayı oranıdır.","doldur":[[5,1],[5,2]]},{"formul":"Toplam = Lim1 + Lim2 = 2 (2. adımda bulduk) + 2 (4. adımda bulduk) = 4","anlatim":"Şimdi iki limiti topluyoruz, çünkü soru bize ayrı ayrı bulunan sonuçların toplamını soruyor.","doldur":[[6,1],[6,2]]},{"formul":"Ters durum: pay derecesi \u003e payda derecesi → limit sonsuz (∞)","anlatim":"Ters durumda dereceler eşit olmasaydı, yani payın derecesi paydadan büyük olsaydı, limit sonsuz çıkardı.","doldur":[]},{"formul":"Yanlış yol: x=1\u0027i sadeleştirmeden koy = 0/0 (HATALI) → doğrusu çarpanlara ayır, sadeleştir = 2 (2. adımda bulduk)","anlatim":"En sık hata, ilk limitte x=1\u0027i sadeleştirmeden direkt paydaya koyup 0/0 çıktığı için \u0027limit yoktur\u0027 demek. Sadeleştirme yapılmadan sonuca varılamaz.","doldur":[]}],"anahtar":[{"ornek":"dereceler","kok":"derece"},{"ornek":"sadeleştirmeden","kok":"sadele"},{"ornek":"belirsizliği","kok":"belirs"},{"ornek":"çarpanlara","kok":"çarpan"},{"ornek":"limitte","kok":"limitt"},{"ornek":"sonsuzda","kok":"sonsuz"}],"konuGiris":{"harita":"Ne zaman test edilir: pay ve paydayı sıfır yapan bir x değerine yaklaşırken (0/0) ya da x sonsuza giderken sorulur. Nasıl ölçülür: çarpanlara ayırıp sadeleştirme veya en yüksek dereceli terime bölme adımlarının doğru uygulanmasıyla ölçülür. Nasıl kaydedilir: sonuç tek bir sayı (veya sonsuz/yok) olarak yazılır, ara adımlar gösterilir.","desen":"Sınav genellikle iki ayrı limiti aynı soruda birleştirip toplamını sorar; bir tarafta 0/0 belirsizliği, diğer tarafta sonsuzda rasyonel limit çıkar. Tuzak, ilk limitte (x−1) çarpanını sadeleştirmeden \u0027limit yok\u0027 demek ya da ikinci limitte sabit terimleri dereceye katmaktır. Bu soru 0/0 sadeleştirme ile sonsuzda derece karşılaştırması noktasından geliyor (p.28, 5 dönemde çıkmış).","terimler":[{"kaynak":"soruda verilir","tanim":"Yerine koyunca pay ve payda sıfır çıkan durum, çözüm gerektirir","ad":"0/0 belirsizliği","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Payı ve paydayı ortak çarpana ayırıp sadeleştirme yöntemi","ad":"Çarpanlara ayırma","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"x sonsuza giderken en büyük dereceli terimlerin oranına bakılan durum","ad":"Sonsuzda limit","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Dereceler eşitken payın ve paydanın en yüksek terim katsayıları oranı","ad":"Baş katsayı oranı","kim":"kanun sabitler"}],"sinavda":"İki ayrı limit ifadesi verilir ve bunların toplamının sayısal değeri istenir.","panel_ornek":"İkinci el bir bisiklet ilanında fiyat sürekli pazarlıkla değişiyor ama alıcı ile satıcı hep 3 bin liraya doğru yaklaşıyor; ilan \u00273000 civarı\u0027 desin ya da demesin, gerçek anlaşma değeri odur. Limit de fonksiyonun tam o noktada tanımlı olmasına bakmadan yaklaştığı değeri bulmaktır.","ornek":"İkinci el bir bisiklet ilanında fiyat sürekli pazarlıkla değişiyor ama alıcı ile satıcı hep 3 bin liraya doğru yaklaşıyor; ilan \u00273000 civarı\u0027 desin ya da demesin, gerçek anlaşma değeri odur. Limit de fonksiyonun tam o noktada tanımlı olmasına bakmadan yaklaştığı değeri bulmaktır.","yontemler":"0/0 durumunda pay ve payda çarpanlara ayrılıp ortak çarpan sadeleştirilir, sonra tekrar yerine konur. Sonsuzda limitte pay ve payda en yüksek dereceli terime bölünür, dereceler eşitse baş katsayılar oranlanır.","nedir":"Limit hesaplama, bir fonksiyonun bir noktaya veya sonsuza yaklaşırken hangi değere yaklaştığını bulma işidir. Sınav, 0/0 belirsizliğini çözme ve sonsuzda derece karşılaştırması yapabilme becerini ölçer."},"olay":"lim1=(x+1)|x=1=2; lim2=2x²/x²=2; 2+2=4.","tuzak":{"C":{"ad":"Genelleme Tuzağı","metin":"her 0/0 biçiminin sonucu 1\u0027dir sanıp ilk limiti 1 aldın, ikinci limiti doğru bulup topladın. Doğrusu: 0/0 belirsizliği çarpanlara ayırıp sadeleştirilerek çözülür, ilk limit 2\u0027dir, toplam 4\u0027tür."},"E":{"ad":"Derece Karıştırma Tuzağı","metin":"ikinci ifadede payın derecesi paydadan büyükmüş gibi düşünüp limiti sonsuz aldın, ilk limiti hiç hesaba katmadın. Doğrusu: pay ve paydanın dereceleri (ikinci derece) eşittir, limit baş katsayılar oranı olan 2\u0027dir, toplam 4\u0027tür."},"A":{"ad":"Sıfır Sayma Tuzağı","metin":"0/0 belirsizliğini çarpanlara ayırmadan görüp ilk limiti doğrudan 0 kabul edip sadece ikinci limiti (2) topladın. Doğrusu: (x²−1)/(x−1)=(x−1)(x+1)/(x−1) sadeleşir, x=1 için 2 çıkar, toplam 4\u0027tür."},"B":{"ad":"Katsayı Ters Çevirme Tuzağı","metin":"sonsuzda limitte derece eşitliğini görüp baş katsayılar oranını payda/pay sırasıyla (1/2) alıp ikinci limiti 0,5 yazdın. Doğrusu: oran pay katsayısı/payda katsayısıdır, 2/1=2, toplam 4\u0027tür."}},"celdiriciYol":{"C":"1 (0/0 belirsizliğini genelleyip 1 sayma) + 2 (ikinci limit doğru) = 3 (0/0=1 genellemesi)","E":"2 (ilk limit doğru, ama es geçiliyor) ve ikinci limitte pay derecesi payda derecesinden büyük sanılıp sonuç sonsuz alınıyor = Sonsuzdur (derece karşılaştırmasını yanlış yapma)","A":"0 (ilk limiti 0/0 görüp doğrudan sıfır/limit yok sayma) + 2 (ikinci limit doğru) = 2 (0/0 belirsizliğini çözmeden sıfır sayma)","B":"2 (ilk limit doğru) + 1/2 (baş katsayılar oranını ters alma, 1/2 yerine 2 gerekirken payda/pay) = 2,5 (oran ters çevirme)"},"hap":"0/0 belirsizliği bir sonuç değildir; çarpanlara ayırıp sadeleştirmeden asla \u0027limit yok\u0027 veya \u00270\u0027 denmez.","teshis":{"C":{"gercek":"0/0 yalnızca bir belirsizlik türüdür, değeri fonksiyona göre değişir; çarpanlara ayırma ile bulunmalıdır.","ayirt":"Sonucu 1 yazmadan önce ifadeyi çarpanlarına ayırıp sadeleştirdin mi?","paragraf":"0/0 belirsizliği çözümü","yanilgi":"0/0 belirsizliğinin her zaman 1 verdiğini sanıyorsun, çünkü bölüm gibi görünüyor."},"E":{"gercek":"Dereceler eşitse limit sonsuz DEĞİL, baş katsayılar oranıdır; sonsuz sonuç yalnız payın derecesi gerçekten büyükse çıkar.","ayirt":"Payın ve paydanın en yüksek derecesini gerçekten karşılaştırdım mı?","paragraf":"sonsuz/sonsuz belirsizliği - derece karşılaştırması","yanilgi":"Sonsuzda limitte payın derecesini gözle büyük tahmin edip incelemeden \u0027sonuç sonsuzdur\u0027 diyorsun."},"A":{"gercek":"0/0 bir belirsizliktir, sonuç değildir; çarpanlara ayırıp sadeleştirdikten sonra yerine koyma ile gerçek değer bulunur.","ayirt":"0/0 çıktığında \u0027çarpanlara ayırdım mı, sadeleştirdim mi?\u0027 diye kendine sordun mu?","paragraf":"0/0 belirsizliği çözümü","yanilgi":"0/0 gördüğünde ifadeyi işlemeden \u0027bu limit sıfırdır ya da yoktur\u0027 diye bırakıyorsun."},"D":{"gercek":"0/0 belirsizliği çarpanlara ayırma-sadeleştirme ile, sonsuzda rasyonel limit ise dereceye göre kural ile çözülür; sonuçlar toplanır.","ayirt":"Her limiti kendi yöntemiyle ayrı ayrı çözdüm mü, sonra mı topladım?","paragraf":"0/0 ve sonsuz/sonsuz belirsizlikleri çözüm yöntemleri","yanilgi":"Bu şıkkı eleyen öğrenci, iki farklı limit yönteminin AYNI soruda ayrı ayrı ve doğru sırayla uygulanması gerektiğini gözden kaçırır."},"B":{"gercek":"Dereceler eşitse
