nak":"TESMER SGS Matematik-İstatistik Ders Notu - Limit Hesaplama, 0/0 Belirsizliği ve Çarpanlara Ayırma Yöntemi","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: ifade (x² − 9) / (x − 3) (soruda verilen); x → 3 (soruda verilen)","anlatim":"Soru bize şunu vermiş: (x²-9)/(x-3) ifadesinin x, 3\u0027e giderken limiti isteniyor. Bunu biz bulmadık, soru verdi.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"x² − 9 = (x − 3) × (x + 3)","anlatim":"Payda x=3 için sıfır oluyor, doğrudan yerine koyarsak 0/0 çıkar. Bunu aşmak için payı çarpanlarına ayırıyoruz.","doldur":[[6,1]]},{"formul":"(x − 3) × (x + 3) / (x − 3) = x + 3","anlatim":"Payda ile paydadaki (x-3) aynı, ikisini sadeleştiriyoruz. Dikkat: bu sadeleştirme sadece x≠3 için geçerli, ama limitte x hiç 3 olmuyor zaten.","doldur":[[5,1]]},{"formul":"x + 3 → 3 (soruda verilen) + 3 = 6","anlatim":"Sadeleşmiş ifade artık x=3\u0027te sorunsuz hesaplanır. Şimdi x yerine 3 koyuyoruz.","doldur":[]},{"formul":"Sonuç = 6","anlatim":"Limit sonucu 6 çıkıyor. Bu, 0/0 belirsizliğinin çarpanlarına ayırma yöntemiyle çözülmüş hali.","doldur":[[7,1]]},{"formul":"Yanlış yol: (3² − 9) / (3 − 3) = 0/0 (HATALI) → doğrusu x + 3 = 6 (4. adımda bulduk)","anlatim":"En sık hata: öğrenci sadeleştirmeden direkt x=3\u0027ü payda-payına koyup 0/0 der ve işlemi bırakır. Doğrusu önce çarpanlara ayırıp sadeleştirmek, sonra yerine koymaktır.","doldur":[]}],"anahtar":[{"ornek":"çarpanlara","kok":"çarpan"},{"ornek":"sadeleştir","kok":"sadele"},{"ornek":"yerine","kok":"yerine"},{"ornek":"doğrudan","kok":"doğrud"},{"ornek":"belirsizliğinde","kok":"belirs"},{"ornek":"giderken","kok":"giderk"}],"konuGiris":{"harita":"Ne zaman test edilir: Fonksiyon a noktasında tanımsız görünse bile x o noktaya yaklaşırken sınırlayıcı değer sorulduğunda test edilir. Nasıl ölçülür: Önce yerine koyma denenir, 0/0 çıkarsa çarpanlara ayırıp sadeleştirme ile ölçülür. Nasıl kaydedilir: Sadeleştirme sonrası elde edilen ifadeye a değeri tekrar yerine konularak tek bir sayı olarak yazılır.","desen":"Sınav genelde x−a paydası sıfır yapan rasyonel ifadeler verip doğrudan yerine koyma yapılırsa 0/0 çıkacak sorular kurar. Öğrenci burada \u0027limit yoktur\u0027 diyip tuzağa düşer, oysa çarpanlara ayırıp sadeleştirmek gerekir. Bu soru, 0/0 belirsizliğinde çarpanlara ayırma kuralı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"x bir değere yaklaşırken fonksiyonun yaklaştığı sayı","ad":"Limit","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"yerine koyunca hem pay hem payda sıfır olması durumu","ad":"0/0 belirsizliği","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"payı ve paydayı çarpanlarına bölüp ortak (x−a) terimini bulma işlemi","ad":"Çarpanlara ayırma","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"pay ve paydadan ortak çarpanı aynı anda kaldırma işlemi","ad":"Sadeleştirme","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Bir rasyonel ifadenin x belirli bir değere yaklaşırken aldığı limit değeri sorulur.","panel_ornek":"İkinci el bir telefonun fiyatı satıcıyla pazarlık sürecinde sürekli değişir; sen fiyatı sormadan önce \u0027muhtemelen 5 bin liraya yakın kapanır\u0027 diye tahmin edersin. İşte bu, satıcı asıl fiyatı söylemeden önce fiyatın yaklaştığı değeri kestirmeye benzer. Limit de fonksiyonun tam o noktada tanımlı olmasa bile yaklaştığı değeri bulmaktır.","ornek":"İkinci el bir telefonun fiyatı satıcıyla pazarlık sürecinde sürekli değişir; sen fiyatı sormadan önce \u0027muhtemelen 5 bin liraya yakın kapanır\u0027 diye tahmin edersin. İşte bu, satıcı asıl fiyatı söylemeden önce fiyatın yaklaştığı değeri kestirmeye benzer. Limit de fonksiyonun tam o noktada tanımlı olmasa bile yaklaştığı değeri bulmaktır.","yontemler":"Pay ve payda çarpanlarına ayrılır, ortak (x−a) çarpanı sadeleştirilir, sonra a tekrar yerine konur.","nedir":"Limit, x bir değere yaklaşırken fonksiyonun hangi değere yaklaştığını bulma işlemidir. Sınav, 0/0 gibi belirsizlikleri çarpanlara ayırıp sadeleştirerek doğru çözebilme becerisini ölçer."},"olay":"x²-9=(x-3)(x+3); (x-3)(x+3)/(x-3)=x+3; x=3 için x+3=6.","tuzak":{"C":{"ad":"Sadeleştirme Tuzağı","metin":"(x-3)(x+3)/(x-3) sadeleştirilirken +3 terimi düşürülüp yalnızca x bırakılır ve x=3 yazılır. Doğrusu: sadeleştirme sonrası ifade x+3\u0027tür, +3 atılamaz."},"E":{"ad":"Payda İhmali Tuzağı","metin":"yalnızca pay hesaplanıp payda tamamen göz ardı edilir, x=3 için x²=9 sonucuna gidilir. Doğrusu: payda ile birlikte sadeleştirme yapılmadan sonuca ulaşılamaz."},"A":{"ad":"Ne soruluyor","metin":"0/0 belirsizliğinde limitin nasıl bulunacağı soruluyor. Belirsizlik Tuzağı: x=3 yerine konduğunda 0/0 çıktığı için doğrudan \u0027limit yoktur\u0027 denir, oysa belirsizlik çözülmeden bu sonuca varılamaz. Doğrusu: pay çarpanlara ayrılıp sadeleştirilince limit vardır ve 6\u0027dır."},"B":{"ad":"Yerine Koyma Tuzağı","metin":"paydanın x=3\u0027te sıfır olması sonucun sıfır olduğu sanılır, sadeleştirme atlanır. Doğrusu: önce çarpanlara ayırıp (x-3) sadeleştirilmeli, sonra x=3 konmalıdır."}},"celdiriciYol":{"C":"(x-3)(x+3)/(x-3) sadeleştirilirken +3 düşürülüp yalnızca x=3 yazılır = 3 (Sadeleştirme Tuzağı)","E":"Payda dikkate alınmadan yalnız pay hesaplanır, x=3 için x²=9 = 9 (Payda İhmali Tuzağı)","A":"x=3 için (x²-9)/(x-3) = 0/0 çıkar, sadeleştirme yapılmadan doğrudan sonuç yorumlanır (Belirsizlik Tuzağı)","B":"x-3=0 olduğundan sonuç sıfır sanılır = 0 (Yerine Koyma Tuzağı)"},"hap":"0/0 belirsizliğinde önce çarpanlara ayır, ortak çarpanı sadeleştir, sonra yerine koy; asla doğrudan \u0027limit yoktur\u0027 deme.","teshis":{"C":{"gercek":"(x-3) çarpanı payda ve paydan bir bütün olarak gider; kalan (x+3) ifadesinin tamamı x=a\u0027da hesaplanır.","ayirt":"Sadeleştirdikten sonra elimde kalan ifadenin TAMAMINI mı yerine koydum?","paragraf":"Limit Hesaplama - Sadeleştirme Kuralı","yanilgi":"Sadeleştirme sırasında çarpanın tamamını değil bir kısmını sildiğini fark etmiyorsun."},"E":{"gercek":"Limit, pay ve paydanın BİRLİKTE sadeleştirilmiş halinden bulunur; paydanın gözden çıkarılması yanlış sonuç verir.","ayirt":"Paydayı hesaba kattım mı, yoksa sadece payı mı hesapladım?","paragraf":"Limit Hesaplama - 0/0 Belirsizliği","yanilgi":"Paydayı unutup sadece payın sayısal değerini limit sanıyorsun."},"A":{"gercek":"0/0 bir belirsizliktir, yokluk değildir; çarpanlara ayırıp sadeleştirdikten sonra limit gerçek bir sayı olarak bulunur.","ayirt":"0/0 çıktığında hemen \u0027yok\u0027 mu diyorum yoksa çarpanlara mı ayırıyorum?","paragraf":"Limit Hesaplama - 0/0 Belirsizliği","yanilgi":"0/0 gördüğünde limitin hiç var olmadığını sanıyorsun."},"D":{"gercek":"x²-9=(x-3)(x+3) çarpanlarına ayrılır, (x-3) sadeleştirilir, kalan x+3 ifadesinde x=3 konur ve limit 6 bulunur.","ayirt":"Payı çarpanlarına ayırıp ortak çarpanı sadeleştirdim mi?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - 0/0 Belirsizliği","yanilgi":"Bu şıkkı eleyen öğrenci çarpanlara ayırmadan doğrudan yerine koymaya çalışıp 0/0\u0027da takılır."},"B":{"gercek":"Payda sıfır olduğunda sadeleştirme yapılmadan sayısal değer okunmaz; önce ortak çarpan sadeleştirilmelidir.","ayirt":"Sadeleştirmeyi yapmadan payda değerine mi bakıyorum?","paragraf":"Limit Hesaplama - Yerine Koyma Yöntemi","yanilgi":"Paydanın sıfır olmasının otomatik olarak sonucu sıfır yaptığını sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":5,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 12"},"kural":"limit var olması sağdan ve soldan limitlerin birbirine eşit olmasını gerektirir; 0/0 belirsizliği çarpanlara ayrılıp sadeleştirilerek çözülür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 12","sonDonem":6,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"0/0 belirsizliğinde payı çarpanlarına ayırıp ortak çarpanı sadeleştir, sonra yerine koy; doğrudan sıfır sonucuna atlama.","konu":"limit hesaplama","tablo":{"satirlar":[["VERİLENLER","-"],["Sol parça fonksiyonu","(x²-x-2)/(x-2), x\u003c2"],["Sağ parça fonksiyonu","3x+k, x≥2"],["HESAP","-"],["Sol limit ifadesi (çarpanlara ayrılmış)","(x-2)(x+1)/(x-2) = x+1"],["Sol limit (x→2)","2+1 = 3"],["Sağ limit ifadesi","3x+k"],["Sağ limit (x→2)","3(2)+k = 6+k"],["Limit var olma koşulu","Sol limit = Sağ limit"],["Sonuç (k)","3 = 6+k → k = -3"]],"basliklar":["Kalem","Hesap"]},"siklar":{"C":"-2","E":"3","A":"-6","D":"-1","B":"-3"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"x²-x-2\u0027yi yanlış çarpanlarsan (x+2)(x-1) gibi, sol limit 4 gelir ve k = -2 bulursun. Doğru çarpanlama (x-2)(x+1)\u0027dir.","E":"Denklemi 6-k = 3 şeklinde ters işaretle yazarsan k = 3 bulursun. Doğru denklem 3 = 6+k\u0027dir ve k = -3 verir.","D":"Sağ parçayı 2x+k olarak okursan, 3 = 4+k denkleminden k = -1 çıkar. Sağ parça aslında 3x+k, yani 6+k olur.","A":"Solda belirsizliği çözmeden 0/0\u0027ı sıfır sanıp 0 = 6+k denklemi kurarsın. Oysa (x-2) sadeleşir ve sol limit 3 çıkar."},"dogru":"x=2\u0027de limit varsa soldan ve sağdan limitler eşit olmalı. Solda: (x²-x-2)/(x-2) = (x-2)(x+1)/(x-2) = x+1 → 3. Sağda: 3x+k → 6+k. Eşitlikten 3 = 6+k = -3.","sinav":"Parçalı bir fonksiyonda bir noktada limitin var olması için sağdan ve soldan limitler eşit olmalıdır; 0/0 belirsizliği çarpanlara ayrılıp sadeleştirilerek çözülür.","kavramlar":[{"kaynak":"TEORI","tanim":"x değişkeni bir noktaya soldan (küçük değerlerden) yaklaşırken fonksiyonun yaklaştığı değerdir.","ad":"Soldan limit"},{"kaynak":"TEORI","tanim":"x değişkeni bir noktaya sağdan (büyük değerlerden) yaklaşırken fonksiyonun yaklaştığı değerdir.","ad":"Sağdan limit"},{"kaynak":"TEORI","tanim":"Pay ve payda aynı anda sıfıra giden durum; çarpanlara ayırma veya eşlenikle çarpma yöntemiyle çözülür.","ad":"0/0 belirsizliği"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":5,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[3,1],[4,1],[5,1]],"tablo":{"basliklar":["Kalem","Hesap"],"satirlar":[["Sol limit ifadesi (çarpanlara ayrılmış)","(x-3)(x-1)/(x-3) = x-1"],["Sol limit (x→3)","3-1 = 2"],["Sağ limit ifadesi","2x+n"],["Sağ limit (x→3)","2(3)+n = 6+n"],["Limit var olma koşulu","Sol limit = Sağ limit"],["Sonuç (n)","2 = 6+n → n = -4"]]},"tur":"tablo","soru":"f(x) = (x²-4x+3)/(x-3), x\u003c3 için; f(x) = 2x+n, x≥3 için tanımlıdır. lim (x→3) f(x) limitinin var olması için n kaçtır?","verilen":[[0,1],[2,1]],"hedef":"Tabloyu doldur ve n\u0027in kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f(x) = (x²-x-2)/(x-2), x\u003c2 için; f(x) = 3x+k, x≥2 için tanımlıdır. lim (x→2) f(x) limitinin var olması için k kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-05","verilenler":[{"deger":"(x²-x-2)/(x-2), x\u003c2","anlam":"x, 2\u0027den küçükken f(x)\u0027i tanımlayan pay-payda ifadesi; 0/0 belirsizliği çarpanlara ayrılıp sadeleştirilecek","ad":"Sol parça fonksiyonu"},{"deger":"3x+k, x≥2","anlam":"x, 2\u0027den büyük eşitken f(x)\u0027i tanımlayan doğrusal ifade; k bilinmeyen parametredir","ad":"Sağ parça fonksiyonu"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu, Limit Hesaplama - Parçalı Fonksiyonlarda Limitin Varlığı","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: Sağ ifade 3x+k (soruda verilen); Sol ifade (x²-x-2)/(x-2) (soruda verilen); x=2 noktasında limit soruluyor","anlatim":"Soru bize sağ taraftaki ifadeyi vermiş: x≥2 için f(x) = 3x+k. Sol taraf ise (x²-x-2)/(x-2) formülüyle tanımlı.","verilenAdim":true,"doldur":[[1,1],[2,1],[6,1]]},{"formul":"Limit var olması, sağdan ve soldan limitin eşit çıkması demek.","anlatim":"Limit var olması, sağdan ve soldan limitin eşit çıkması demek. x=2\u0027de payda sıfır olduğu için önce sadeleştirme gerekir.","doldur":[]},{"formul":"Sol limit ifadesi = (x-2)(x+1) / (x-2) = x+1","anlatim":"Pay x²-x-2 ifadesini çarpanlarına ayırıp paydadaki (x-2) ile sadeleştiriyoruz. Böylece 0/0 belirsizliği kalkıyor.","doldur":[[4,1]]},{"formul":"Sol limit = x+1 = 2 (soruda verilen) + 1 = 3","anlatim":"Şimdi sadeleşmiş ifadede x yerine 2 yazıp sol limiti buluyoruz. Bu bize x\u0027in 2\u0027ye soldan yaklaşırken f(x)\u0027in gittiği değeri verir.","doldur":[[5,1]]},{"formul":"Sağ limit = 3x + k = 3(2) + k (soruda verilen) = 6 + k","anlatim":"Sağ tarafta x≥2 için fonksiyon zaten 3x+k, bunda sadeleştirme yok. x yerine 2 koyup sağ limiti hesaplıyoruz.","doldur":[[7,1]]},{"formul":"Koşul: Sol limit = Sağ limit","anlatim":"Limitin var olması için sol limit ile sağ limit birbirine eşit olmalı. Bu koşulu şimdi kuruyoruz.","doldur":[[8,1]]},{"formul":"3 (3. adımda bulduk) = 6 + k (5. adımda bulduk) → k = -3","anlatim":"Bulduğumuz sol limiti ve sağ limiti eşitleyip k\u0027yı çözüyoruz. Bu denklem bize k\u0027nın kaç olması gerektiğini verir.","doldur":[[9,1]]},{"formul":"Ters durum: Sol limit ≠ Sağ limit → limit yok","anlatim":"Ters durumda sol ve sağ limit eşit çıkmazsa limit yoktur, k böyle bir değer alamaz. Yani k=-3 dışındaki her değerde limit yok demektir.","doldur":[]},{"formul":"Yanlış yol: (2²-2-2)/(2-2) = 0/0 (HATALI) → doğrusu k=-3 (7. adımda bulduk)","anlatim":"En sık hata, sadeleştirme yapmadan doğrudan x=2\u0027yi sol ifadeye yazıp 0/0 çıkması. Payı çarpanlarına ayırmadan sonuca ulaşılamaz.","doldur":[]}],"anahtar":[{"ornek":"limitin","kok":"limiti"},{"ornek":"sadeleştirilerek","kok":"sadele"},{"ornek":"olması","kok":"olması"},{"ornek":"çarpanlara","kok":"çarpan"},{"ornek":"soldan","kok":"soldan"},{"ornek":"sağdan","kok":"sağdan"}],"konuGiris":{"harita":"Ne zaman test edilir: fonksiyon parçalı tanımlıysa parçaların birleştiği noktada. Nasıl ölçülür: sağdan limit ile soldan limit hesaplanıp birbirine eşitlenerek. Nasıl kaydedilir: eşitlikten çıkan denklem çözülüp bilinmeyenin değeri bulunur.","desen":"Bu tip sorularda öğrenci genellikle x\u003c2 parçasındaki 0/0 belirsizliğini fark etmeyip doğrudan yerine koyar, oysa önce sadeleştirme yapılmalıdır (p.28). Diğer tuzak, sadece bir taraftan limit alıp k\u0027yı bulmaya çalışmaktır; oysa hem sağ hem sol limit hesaplanıp eşitlenmelidir. Bu soru parçalı fonksiyonda sağ-sol limit eşitliği noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"x, noktaya büyük değerlerden yaklaşırken fonksiyonun yaklaştığı değer","ad":"sağdan limit","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"x, noktaya küçük değerlerden yaklaşırken fonksiyonun yaklaştığı değer","ad":"soldan limit","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"sağdan ve soldan limitlerin birbirine eşit olması durumu","ad":"limitin varlığı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"parçalı fonksiyonun ikinci kolunu tanımlayan bilinmeyen sabit","ad":"k parametresi","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"İki parçalı bir fonksiyon ve limitin var olma şartı verilir, bilinmeyen sabitin değeri istenir.","panel_ornek":"İkinci el bir telefonu iki farklı satıcıdan pazarlıksız aldığını düşün: biri 9 bin liradan, biri de senin belirlediğin bir ek ücretle satıyor. İkisinin fiyatı tam eşit çıkarsa \u0027anlaşma tamam\u0027 dersin; eşit değilse pazarlık bozulur. Buradaki \u0027ek ücret\u0027 senin bulman gereken bilinmeyendir.","ornek":"İkinci el bir telefonu iki farklı satıcıdan pazarlıksız aldığını düşün: biri 9 bin liradan, biri de senin belirlediğin bir ek ücretle satıyor. İkisinin fiyatı tam eşit çıkarsa \u0027anlaşma tamam\u0027 dersin; eşit değilse pazarlık bozulur. Buradaki \u0027ek ücret\u0027 senin bulman gereken bilinmeyendir.","yontemler":"Soldaki 0/0 belirsizliği çarpanlara ayrılıp sadeleştirilerek çözülür, sağdaki ifade doğrudan yerine konur; iki sonuç birbirine eşitlenir.","nedir":"Limit, bir noktaya yaklaşırken fonksiyonun yaklaştığı değeri bulma işidir. Sınav parçalı fonksiyonlarda sağ ve sol limitin eşit olma şartını ölçer."},"olay":"sol limit (x-2)(x+1)/(x-2)=x+1, x→2 için 3; sağ limit 3x+k, x→2 için 6+k; 3=6+k → k=-3.","tuzak":{"C":{"ad":"Çarpanlama Tuzağı","metin":"x²-x-2 ifadesini yanlış çarpanlara ayırıp (x+2)(x-1) yazdın, bu da sol limiti 4 verir; 4=6+k\u0027den k=-2 çıkar. Doğrusu: doğru çarpanlama (x-2)(x+1)\u0027dir, sol limit 3\u0027tür."},"E":{"ad":"İşaret Tuzağı","metin":"eşitliği 3=6+k yerine 6-k=3 biçiminde ters işaretle kurup k=3 buldun. Doğrusu: denklem 3=6+k\u0027dir ve buradan k=-3 çıkar."},"D":{"ad":"Fonksiyon Okuma Tuzağı","metin":"sağ parçayı 3x+k yerine 2x+k okuyup 3=4+k denklemini kurdun. Doğrusu: sağ parça fonksiyonu 3x+k\u0027dir, x=2 için 6+k olur."},"A":{"ad":"Sıfır Sanma Tuzağı","metin":"0/0 belirsizliğini çözmeden sol limiti doğrudan 0 kabul edip 0 = 6+k denklemini kurdun. Doğrusu: (x-2) çarpanı sadeleştirilip x+1 bulunur, sol limit 3\u0027tür."}},"celdiriciYol":{"C":"4 = 6+k → k = -2 (çarpanlara ayırma hatası ile sol limiti 4 bulma)","E":"6-k = 3 → k = 3 (denklem kurarken işaret hatası)","D":"3 = 4+k → k = -1 (sağ parça fonksiyonunu yanlış okuma)","A":"0 = 6+k → k = -6 (0/0 belirsizliğini sıfır sanma)"},"hap":"Parçalı fonksiyonda bir noktada limitin var olması için sağdan ve soldan limitler eşitlenir; 0/0 belirsizliği çarpanlara ayırıp sadeleştirilerek çözülür.","teshis":{"C":{"gercek":"x²-x-2 ifadesi (x-2)(x+1) şeklinde çarpanlara ayrılır; kontrol için çarpanlar çarpılıp açılmalıdır.","ayirt":"Bulduğum çarpanları çarpıp orijinal ifadeye geri döndüm mü?","paragraf":"Çarpanlara ayırma ile sadeleştirme","yanilgi":"İkinci dereceden ifadeyi çarpanlarına ayırırken çarpanların toplamı ve çarpımı kuralını yanlış uyguluyorsun."},"E":{"gercek":"Sol limit = sağ limit eşitliği doğrudan 3 = 6+k biçiminde kurulur, taraf değiştirmede işaret sabit kalır.","ayirt":"Denklemi kurduktan sonra iki tarafı da yerine koyup eşitliği sağlıyor mu diye kontrol ettim mi?","paragraf":"Denklem kurma ve çözme","yanilgi":"Denklemi kurarken eşitliğin hangi tarafının hangi işaretle taşınacağını karıştırıyorsun."},"A":{"gercek":"0/0 bir belirsizliktir, sonuç değil; çarpanlara ayırıp ortak çarpanı sadeleştirdikten sonra yerine koyma yapılır.","ayirt":"Payda sıfır yapan çarpanı payda da var mı, sadeleşiyor mu diye kontrol ettim mi?","paragraf":"0/0 belirsizliği çözüm yöntemi","yanilgi":"0/0 belirsizliğinde payın ve paydanın aynı anda sıfır olmasını, sonucun da sıfır olacağı şeklinde yorumluyorsun."},"D":{"gercek":"Sağ parça fonksiyonu soruda verildiği gibi 3x+k\u0027dir, yerine koyarken ifade birebir kullanılmalıdır.","ayirt":"Denkleme geçmeden önce fonksiyonu soru metninden tekrar okudum mu?","paragraf":"Fonksiyon ifadesinin doğru aktarımı","yanilgi":"Soruda verilen ifadeyi hızlı okurken katsayıyı yanlış aktarıyorsun."},"B":{"gercek":"Limitin var olması sağ limit = sol limit koşuluna bağlıdır; her iki parça ayrı hesaplanıp eşitlenir.","ayirt":"Hem sağ hem sol limiti ayrı ayrı hesaplayıp birbirine eşitledim mi?","paragraf":"Parçalı fonksiyonda limit","yanilgi":"Bu şıkkı elemeye çalışan öğrenci, sağ ve sol limitin ayrı ayrı hesaplanıp eşitlenmesi gerektiğini unutup tek bir tarafı esas alır."}},"verilen":[[6,1],[1,1],[2,1]],"donem":5,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 11"},"kural":"a/3=b/5=k ise a=3k, b=5k; 3k+5k=480 → k=60.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 11","sonDonem":3,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":true,"taktik":"Sorunun k\u0027yı mı, bir payı mı, yoksa payların farkını mı istediğini son cümleden işaretleyerek oku, işlemi bitirmeden şık seçme.","konu":"oran orantı","tablo":{"satirlar":[["VERİLENLER","-","-"],["Toplam tutar","480 TL","-"],["Oran terimleri","3 ve 5","-"],["HESAP","-","-"],["K değeri","480/(3+5)","60"],["Küçük pay (a)","3x60","180"],["Büyük pay (b)","5x60","300"],["Fark","300-180","120"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"180","E":"300","A":"60","D":"192","B":"120"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Birinci kişinin payı olan 180\u0027i doğru hesaplanmış fakat bu tutarın kendisidir; sorulan fark olduğundan 300−180=120 bulunmalıdır.","E":"İkinci kişinin payı 300 doğru hesaplanmış fakat bu bizzat alınan tutardır; sorulan iki pay arasındaki fark (300−180=120) olduğundan yanılarak seçilmiştir.","D":"Yalnız büyük oranı (5) toplama katmadan işlem yapılmış (480÷5=96) ve 96×(5−3)=192 yanlış sonucu vermektedir; doğru payda 3+5=8\u0027dir.","A":"k=60 doğru bulunmuş ancak bu sonuç iki payın farkı değil, bir birim tutarıdır; sorulan ise 300−180=120\u0027dir."},"dogru":"Para 3 ve 5 sayılarıyla doğru orantılı paylaştırılıyor: birinci kişi 3 birim, ikinci kişi 5 birim alır. Toplam 3+5=8 birim 480 TL\u0027ye eşit olduğundan bir birim 60 TL\u0027dir. Fazla alan (5×60=300 TL) az alandan (3×60=180 TL) 120 TL fazla alır.","sinav":"Oran orantı ve orantılı paylaştırma kuralı uygulanarak iki payın farkı bulunur.","kavramlar":[{"kaynak":"TEORI","tanim":"Bir bütünün verilen sayılarla paylaştırılması; her kişinin payı o sayıyla orantılı olarak artar. Paylar a·k, b·k şeklinde yazılır; toplam (a+b)·k\u0027ye eşitlenerek k bulunur.","ad":"Doğru orantılı paylaştırma"},{"kaynak":"TEORI","tanim":"İki veya daha çok bilinmeyeni içeren orantı problemlerinde bilinmeyenleri tek bir harfle (k) ifade etme tekniği. a/b = c/d = k denirse a = b·k ve c = d·k yazılır.","ad":"k yöntemi (oran sabiti)"},{"kaynak":"TEORI","tanim":"İki çokluğun bölme yoluyla karşılaştırılmasıdır ve birimsizdir. a/b şeklinde yazılır (b ≠ 0).","ad":"Oran"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[1,2],[2,1],[2,2],[3,1],[3,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["K değeri","660/(4+7)","60"],["Küçük pay (a)","4x60","240"],["Büyük pay (b)","7x60","420"],["Fark","420-240","180"]]},"tur":"tablo","soru":"Bir miktar para iki kişi arasında 4 ve 7 sayılarıyla doğru orantılı olarak paylaştırılıyor. Toplam tutar 660 TL olduğuna göre, fazla pay alan kişi az pay alandan kaç TL fazla alır?","verilen":[[0,1],[0,2]],"hedef":"Tabloyu doldur ve fazla pay alanın az pay alandan kaç TL fazla aldığını bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir miktar para iki kişi arasında 3 ve 5 sayılarıyla doğru orantılı olarak paylaştırılıyor. Toplam tutar 480 TL olduğuna göre, fazla pay alan kişi az pay alandan kaç TL fazla alır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-08","verilenler":[{"deger":"480 TL","anlam":"İki kişiye paylaştırılacak toplam paranın tutarıdır, denklemin sağ tarafını oluşturur.","ad":"Toplam tutar"},{"deger":"3 ve 5","anlam":"Paranın doğru orantılı paylaştırılacağı oran değerleridir; k yöntemine göre a=3k, b=5k kabul edilir.","ad":"Oran terimleri"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Oran Orantı, K Yöntemi ve Oranlı Paylaştırma Kuralı","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[],"anahtar":[{"ornek":"terimlerinin","kok":"teriml"},{"ornek":"büyüklük","kok":"büyükl"},{"ornek":"bulunduktan","kok":"bulund"},{"ornek":"toplamina","kok":"toplam"},{"ornek":"paylaştırmada","kok":"paylaş"},{"ornek":"bölünür","kok":"bölünü"},{"ornek":"120","kok":"120"}],"konuGiris":{"harita":"Ne zaman test edilir: paylaşım, karışım ya da işçi-gün gibi iki büyüklük arasında oran verilip toplam/fark istendiğinde. Nasıl ölçülür: oranı k ile ifade edip toplam koşulunu kullanarak k\u0027yı bularak. Nasıl kaydedilir: bulunan k, orana geri konularak her payın gerçek değeri hesaplanır.","desen":"Sınav genellikle oranı verip toplamı sorar, öğrenci k\u0027yı bulup durur ve istenen farkı hesaplamayı unutur. Bazen sadece k değeri istenmiş gibi görünüp aslında pay farkı sorulur, bu da tuzaktır. Bu soru, k yönteminde k\u0027yı bulup durmamak, farkı hesaplamak noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İki çokluğun bölümü, a/b biçiminde ifade edilir","ad":"Oran","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Verilen oranı tek bilinmeyene indiren çarpan","ad":"Orantı sabiti (k)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Paylaşılacak miktarın tamamı, sorudaki ek bilgi","ad":"Toplam koşulu","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"İki payın birbirinden çıkarılmasıyla elde edilen sonuç","ad":"Fark","kim":"kanun sabitler"}],"sinavda":"Toplam tutar ve iki kişiye ait oran verilip aradaki fark TL cinsinden istenir.","panel_ornek":"İki kardeş bir çiftlik işinde 2 ve 4 birim emekle çalışıyor, kazandıkları 60 TL\u0027yi bu oranla paylaşıyorlar. Yani birim başına 10 TL düşüyor; çok çalışan 40 TL, az çalışan 20 TL alıyor, aradaki fark 20 TL oluyor. Burada önemli olan oranı k ile çarpıp toplamı bulmak.","ornek":"İki kardeş bir çiftlik işinde 2 ve 4 birim emekle çalışıyor, kazandıkları 60 TL\u0027yi bu oranla paylaşıyorlar. Yani birim başına 10 TL düşüyor; çok çalışan 40 TL, az çalışan 20 TL alıyor, aradaki fark 20 TL oluyor. Burada önemli olan oranı k ile çarpıp toplamı bulmak.","yontemler":"Oranı k ile yaz, toplam koşuluyla k\u0027yı bul, sonra payları hesaplayıp farkı al; k\u0027yı bulup durma, sorunun ne istediğine bak.","nedir":"Oran orantı, iki çokluk arasındaki bölüşüm ilişkisini k sabiti ile bulmayı sağlar. Sınav, verilen oranı ve toplam koşulunu kullanarak istenen büyüklüğü hesaplayabilmeni ölçer."},"olay":"k=60, a=180, b=300, fark=300-180=120.","tuzak":{"C":{"ad":"Küçük Payı Fark Sanma Tuzağı","metin":"öğrenci a=480x3/8=180\u0027i bulup soruyu bitmiş sayar, farkı almayı unutur. Doğrusu: 180 az pay alanın kendi tutarıdır, istenen 300-180=120\u0027dir."},"E":{"ad":"Büyük Payı Fark Sanma Tuzağı","metin":"öğrenci b=480x5/8=300\u0027ü bulup bunu doğrudan fark sanır. Doğrusu: 300 fazla pay alanın kendi tutarıdır, istenen 300-180=120\u0027dir."},"D":{"ad":"Payda Karıştırma Tuzağı","metin":"öğrenci 3+5=8 yerine yalnız büyük sayıya (480/5=96) böler, farkı 96x(5-3)=192 bulur. Doğrusu: toplam pay sayısı 3+5=8\u0027dir, 480/8=60 alınmalıdır."},"A":{"ad":"Ne soruluyor","metin":"iki payın farkı isteniyor. Kural: a/3=b/5=k ise a=3k, b=5k; 3k+5k=480 → k=60. Hesap: k=60, a=180, b=300, fark=300-180=120. Doğrusu: fazla pay az paydan 120 TL fazladır."}},"celdiriciYol":{"C":"480x3/8=180 (küçük payı bulup farkı almadan onu cevap sanma)","E":"480x5/8=300 (büyük payı bulup farkı almadan onu cevap sanma)","D":"480/5=96; 96x(5-3)=192 (toplam pay sayısını yanlış payda ile hesaplama)","A":"480/(3+5)=60 (k\u0027yı bulup son adımı atlama, farkı almadan k\u0027yı cevap sanma)"},"hap":"Oranlı paylaştırmada toplam, oran terimlerinin TOPLAMINA bölünür; k bulunduktan sonra son adım olarak istenen büyüklük (fark/pay) hesaplanmalıdır.","teshis":{"C":{"gercek":"180, az pay alanın kendi tutarıdır; istenen büyüklük iki payın farkıdır.","ayirt":"Bulduğum sayı sorunun tam olarak sorduğu şey mi?","paragraf":"Oranlı Paylaştırma Kuralı","yanilgi":"Küçük payı bulunca soruyu bitmiş sayıyorsun, oysa soru fark istiyor."},"E":{"gercek":"300, fazla pay alanın kendi tutarıdır; istenen büyüklük iki payın farkıdır.","ayirt":"Bulduğum sayı sorunun tam olarak sorduğu şey mi?","paragraf":"Oranlı Paylaştırma Kuralı","yanilgi":"Büyük payı bulunca soruyu bitmiş sayıyorsun, oysa soru fark istiyor."},"A":{"gercek":"k yalnız ara değerdir; a=3k=180 ve b=5k=300 bulunup farkları alınmalıdır.","ayirt":"Soru bana k\u0027yı mı yoksa payların farkını mı soruyor?","paragraf":"K Yöntemi - adım 3","yanilgi":"k\u0027yı bulunca işin bittiğini, sorunun k değerini istediğini sanıyorsun."},"D":{"gercek":"Paylaştırmada toplam her zaman oran terimlerinin TOPLAMINA (3+5=8) bölünür.","ayirt":"Paydaya yazdığım sayı gerçekten tüm payların toplamı mı?","paragraf":"Bir Sayıyı a:b Oranında Paylaştırma Kuralı","yanilgi":"Toplam pay sayısını (3+5=8) değil, oranlardan yalnız birini (5) paydaya alıyorsun."},"B":{"gercek":"a/3=b/5=k, 8k=480, k=60; a=180, b=300, fark=120.","ayirt":"Son adımda gerçek 59)","20"],["A değeri (15k)","300"],["B değeri (20k)","400"],["C değeri (24k)","480"],["Fark (c - a)","180"]],"basliklar":["Kalem","Değer"]},"siklar":{"C":"180","E":"480","A":"80","D":"300","B":"100"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"k\u0027yı doğru bulup a = 300 bulduğunu düşünüyorsun; soru farkı sorar, tek bir terimin değerini değil.","E":"En fazla üretim olan c = 480 bulup işlemi orada bırakıyorsun; soru iki uç terim arasındaki farkı ister, tek terimi değil.","A":"c ile b arasındaki farkı (80) alıp en uç değerler arasındaki fark sanıyorsun; oysa en az üretim a\u0027dır, b değil.","B":"b ile a arasındaki farkı (100) alıp uç değerleri bulduğunu sanıyorsun; b orta terimdir, uç noktalardan biri değildir."},"dogru":"İki oran zincirini ortak terim b üzerinden birleştirip a:b:c = 15:20:24 bulursun. Toplam 1.180 olduğundan 59k = 1.180, k = 20 çıkar. Üretim miktarları a = 300, b = 400, c = 480 olur. En fazla (480) ile en az (300) arasındaki fark 180 adettir.","sinav":"İki oranın ortak terimi üzerinden oran zinciri kurulup en büyük ile en küçük terim arasındaki fark k yöntemiyle hesaplanır.","kavramlar":[{"kaynak":"TEORI","tanim":"İkiden fazla oranın ortak terim üzerinden birleştirilmesiyle elde edilen eşit oranlar zinciridir; a/b = c/d = e/f biçiminde yazılır ve her terim k sabitine bağlanır.","ad":"Oran zinciri"},{"kaynak":"TEORI","tanim":"Orantıda a/b = c/d = k denilmek suretiyle a = bk, c = dk gibi terimler tek bir bilinmeyen k cinsinden yazılması ve böylece sistemi basitleştirilen çözüm yöntemidir.","ad":"k yöntemi"},{"kaynak":"TEORI","tanim":"Bir bütünün verilen sayılarla doğru orantılı paylaşılması; paylar a·k, b·k, c·k alınarak toplam (a + b + c)·k = bütün eşitliğinden k bulunur.","ad":"Orantılı paylaştırma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[2,1],[3,1],[4,1],[5,1]],"tablo":{"basliklar":["Kalem","Değer"],"satirlar":[["Ortak oran (p:q:r)","8:12:15"],["Oran sabiti k (1050/35)","30"],["P değeri (8k)","240"],["Q değeri (12k)","360"],["R değeri (15k)","450"],["Fark (r - p)","210"]]},"tur":"tablo","soru":"Bir fabrikada üç makinenin (P, Q, R) günlük üretim miktarları p, q, r olup p:q = 2:3 ve q:r = 4:5 oranındadır. Üç makinenin toplam günlük üretimi 1.050 adettir. Buna göre, en fazla üretim yapan makine ile en az üretim yapan makine arasındaki üretim farkı kaç adettir?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve P ile R makineleri arasındaki üretim farkının kaç adet olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir üretim tesisinde üç makinenin günlük üretim miktarları a, b, c olup a:b = 3:4 ve b:c = 5:6 oranındadır. Üç makinenin toplam günlük üretimi 1.180 adettir. Buna göre, en fazla üretim yapan makine ile en az üretim yapan makine arasındaki üretim farkı kaç adettir?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-08","verilenler":[{"deger":"3:4","anlam":"a ile b makinesinin üretim miktarları arasındaki orandır, ortak paydaya indirmede kullanılır","ad":"a:b oranı"},{"deger":"5:6","anlam":"b ile c makinesinin üretim miktarları arasındaki orandır, ortak paydaya indirmede kullanılır","ad":"b:c oranı"},{"deger":"1.180 adet","anlam":"a+b+c toplamıdır, k değerini bulmak için kullanılır","ad":"toplam üretim"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Oran-Orantı, oran zinciri ve K yöntemi","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: a:b = 3:4 (soruda verilen); b:c = 5:6 (soruda verilen); toplam a+b+c = 1.180 (soruda verilen); istenen \u0027en fazla ile en az arasındaki fark\u0027","anlatim":"Soru bize şunu vermiş: a:b oranı 3:4, b:c oranı 5:6 ve üç makinenin toplam üretimi 1.180 adet. En büyük ile en küçük terim arasındaki farkı istiyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Ortak b = büyük olan: 4 ile 5 → ortak kat 20; a:b = 3:4 = 15:20 (4\u0027ü 20 yapmak için ×5); b:c = 5:6 = 20:24 (5\u0027i 20 yapmak için ×4) → a:b:c = 15:20:24","anlatim":"İki oran zincirini tek orana çevirmek için ortak terim olan b\u0027yi eşitliyoruz. b, ilk oranda 4, ikinci oranda 5 - ikisinin ortak katı 20.","doldur":[[5,1]]},{"formul":"Oran sabiti k = Toplam / (15+20+24) = 1.180 (soruda verilen) / 59 (2. adımda bulduk) = 20","anlatim":"Şimdi biz hesaplıyoruz: oran toplamı 59 birim, bu 1.180 adede karşılık geliyor. Her birimin kaç adet olduğunu bulmak için toplamı 59\u0027a bölüyoruz.","doldur":[[6,1]]},{"formul":"A = 15 × k = 15 (2. adımda bulduk) × 20 (3. adımda bulduk) = 300","anlatim":"A makinesinin üretimi, oran payı 15 ile k\u0027nın çarpımı. Bu bize a\u0027nın gerçek adedini verir.","doldur":[[7,1]]},{"formul":"B = 20 × k = 20 (2. adımda bulduk) × 20 (3. adımda bulduk) = 400","anlatim":"B makinesi için de aynı mantık işler, payı bu sefer 20. Oran sabitini payla çarpınca gerçek üretim çıkar.","doldur":[[8,1]]},{"formul":"C = 24 × k = 24 (2. adımda bulduk) × 20 (3. adımda bulduk) = 480","anlatim":"C makinesinin payı en büyük, 24. Bu yüzden C en fazla üreten makine olacak - fark hesabında bunu kullanacağız.","doldur":[[9,1]]},{"formul":"Fark = C - A = 480 (5. adımda bulduk) - 300 (4. adımda bulduk) = 180","anlatim":"En fazla üreten C, en az üreten A. Farkı bulmak için büyükten küçüğü çıkarıyoruz.","doldur":[[10,1]]},{"formul":"Sonuç = 180 adet","anlatim":"Sonuç: en fazla üretim yapan makine ile en az üretim yapan makine arasındaki fark 180 adet.","doldur":[]},{"formul":"Yanlış yol: 1.180 / 18 = 65,56 (HATALI) → doğrusu 1.180 / 59 = 20 (3. adımda bulduk)","anlatim":"En sık hata: öğrenci 3:4 ile 5:6\u0027yı ortak paydaya indirmeden direkt 3+4+5+6=18\u0027e bölüyor. Bu yanlış çünkü b terimi iki farklı sayıyla temsil ediliyor, önce eşitlenmeli.","doldur":[]}],"anahtar":[{"ornek":"makinenin","kok":"makine"},{"ornek":"üretimi","kok":"üretim"},{"ornek":"terimli","kok":"teriml"},{"ornek":"üreten","kok":"üreten"},{"ornek":"paydaya","kok":"payday"},{"ornek":"bölüyoruz","kok":"bölüyo"},{"ornek":"180","kok":"180"}],"konuGiris":{"harita":"Hangi büyüklükler oranla ilişkilendirilir: soru cümlesindeki iki oran cümlesi. Ortak k sabiti nasıl kurulur: iki oran zincir halinde tek değişkene indirilir. Sonuç nasıl doğrulanır: bulunan değerler toplam ya da fark koşuluna geri konur.","desen":"Soru genelde iki ayrı oranı zincirleyip (a:b, b:c) tek toplam koşuluyla birleştirir; tuzak, k\u0027yı bulup durmak, farkı ya da istenen büyüklüğü hesaplamamaktır. Diğer tuzak, oran zincirini kurarken ortak terimi (burada b) yanlış eşleştirmektir. Bu soru üç terimli oran zincirini toplam koşuluyla çözme noktasından geliyor (p.çıkmış arşiv, 4 dönem).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"iki çokluğun bölüm ilişkisi, a bölü b","ad":"oran","kim":"matematiksel tanım belirler"},{"kaynak":"kuraldan bilinir","tanim":"iki oranın birbirine eşit olması, a/b eşittir c/d","ad":"orantı","kim":"matematiksel tanım belirler"},{"kaynak":"sen hesaplarsın","tanim":"birden çok bilinmeyeni tek değişkene indiren ortak çarpan","ad":"k sabiti","kim":"sorudaki verilen oran zinciri belirler"},{"kaynak":"kuraldan bilinir","tanim":"a çarpı d, b çarpı c\u0027ye eşittir kuralı, oranı doğrular","ad":"içler dışlar çarpımı","kim":"matematiksel tanım belirler"}],"sinavda":"Üç makinenin üretim oranları ve toplam üretim verilir, en büyük ile en küçük değer arasındaki fark istenir.","panel_ornek":"Üç arkadaş bir doğum günü hediyesine parasal katkı yapıyor; katkıları 2:3 oranında ve toplam katkı 50 TL. Kim daha çok, kim daha az ödedi sorusu tam bu mantıkla çözülür.","ornek":"Üç arkadaş bir doğum günü hediyesine parasal katkı yapıyor; katkıları 2:3 oranında ve toplam katkı 50 TL. Kim daha çok, kim daha az ödedi sorusu tam bu mantıkla çözülür.","yontemler":"Önce a:b ve b:c oranları ortak terim üzerinden birleştirilip a:b:c tek zincire dönüştürülür; sonra toplam 1.180\u0027e bölünerek k bulunur ve fark hesaplanır.","nedir":"Oran-orantı, iki ya da daha çok çokluk arasındaki bölüşüm ilişkisini bulmayı sağlar. Sınav, verilen oranları k sabitiyle çözüp istenen büyüklüğü veya farkı hesaplayabilme becerisini ölçer."},"olay":"15k+20k+24k=59k=1180, k=20; a=300, b=400, c=480.","tuzak":{"D":{"ad":"Terimi Farkla Karıştırma Tuzağı","metin":"k\u0027yı doğru bulup a=300 değerini bulduktan sonra bunu doğrudan istenen fark sanırsın; oysa soru farkı sorar, tek bir terimin kendisini değil. Doğrusu: fark c-a=180\u0027dir."},"E":{"ad":"Terimi Farkla Karıştırma Tuzağı","metin":"en fazla üretim yapan c=480 değerini bulup işlemi orada bıkırsın; soru iki uç terim arasındaki farkı ister, tek terimi değil. Doğrusu: fark c-a=180\u0027dir."},"A":{"ad":"Ortadaki Terim Tuzağı","metin":"c ile b arasındaki farkı (480-400) alıp bunu en çok ile en az arasındaki fark sanırsın; oysa en az üretim a\u0027dır, b değil. Doğrusu: fark en büyük (c) ile en küçük (a) terim arasında hesaplanır, 180 çıkar."},"B":{"ad":"Yanlış Çift Seçme Tuzağı","metin":"b-a farkını (400-300) alıp en uç değerler arasındaki farkı bulduğunu sanırsın; b orta terimdir, uç değer değildir. Doğrusu: fark c-a=180\u0027dir."}},"celdiriciYol":{"D":"1180/59=20, a=15x20=300 (farkı hesaplamayı unutup en küçük terimi yazma)","E":"1180/59=20, c=24x20=480 (farkı hesaplamayı unutup en büyük terimi yazma)","A":"480 - 400 = 80 (orta terimi uç terim sanma)","B":"400 - 300 = 100 (yanlış çift seçme)"},"hap":"Üç terimli oranı ortak terim üzerinden ortak paydaya indir, K ile terimleri bul, sonra sorunun tam olarak neyi istediğine (terim mi fark mı) bak.","teshis":{"C":{"gercek":"a:b=3:4 ve b:c=5:6 oranları ortak terim b üzerinden ortak paydaya indirilmeden birleştirilemez; ortak payda 20 alınarak a:b:c=15:20:24 bulunur, k=toplam/59 ile terimler hesaplanır.","ayirt":"İki oranı birleştirmeden önce ortak terimi eşitledim mi?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - K Yöntemi ve oran zinciri özelliği","yanilgi":"K yöntemini uygulamadan sadece verilen oranları toplamanın yeteceğini düşünüyorsun."},"E":{"gercek":"Soru tek bir terimi değil, en büyük ile en küçük terim arasındaki farkı istemektedir; k\u0027dan sonra iki terim bulunup çıkarılmalıdır.","ayirt":"Bulduğum sayı soru cümlesinin tam olarak istediği büyüklük mü?","paragraf":"Oran zinciri - K yöntemi","yanilgi":"k\u0027yı bulduktan sonra en büyük terimi (c) hesaplamayı sorunun cevabı sanıp işlemi bitiriyorsun."},"A":{"gercek":"Üç terimli sıralamada 15k\u003c20k\u003c24k olduğundan en küçük terim a, en büyük terim c\u0027dir; fark bu ikisi arasında alınır.","ayirt":"Sıraladığımda hangi terim gerçekten en küçük, hangisi en büyük?","paragraf":"Oran zinciri - K yöntemi","yanilgi":"En çok ile en az arasındaki farkı bulurken orta terimi uç terim sanıp b\u0027yi kullanıyorsun."},"D":{"gercek":"Soru tek bir terimi değil, en büyük ile en küçük terim arasındaki farkı istemektedir; k\u0027dan sonra iki terim bulunup çıkarılmalıdır.","ayirt":"Bulduğum sayı soru cümlesinin tam olarak istediği büyüklük mü?","paragraf":"Oran zinciri - K yöntemi","yanilgi":"k\u0027yı bulduktan sonra en küçük terimi (a) hesaplamayı sorunun cevabı sanıp işlemi bitiriyorsun."},"B":{"gercek":"a:b:c=15:20:24 sıralamasında uç terimler a (en küçük) ve c (en büyük) olduğundan fark yalnız bunlarla hesaplanır.","ayirt":"Seçtiğim iki terim gerçekten dizinin en küçüğü ile en büyüğü mü?","paragraf":"Oran zinciri - K yöntemi","yanilgi":"Ard arda gelen iki terimi (b ve a) çıkarıp uç değerler arasındaki farkı bulduğunu sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":4,"hesaplar":{"100":{"ad":"Kasa","tanim":"Bu hesap, işletmenin elinde bulunan ulusal ve yabancı paraların TL. karşılığının izlenmesi için kullanılır. İşleyişi : Tahsil olunan para tutarları borç, ödemeler ve bankaya yatırılan para tutarları alacak kaydedilir. Hesap daima borç bakiyesi verir veya sıfır olur. Hiçbir şekilde alacak bakiyesi vermez."},"300":{"ad":"BANKA KREDİLERİ","tanim":"Banka ve diğer finans kuruluşlarından sağlanan kısa vadeli kredilere ilişkin tutarları içeren hesap kalemidir."},"180":{"ad":"Gelecek Aylara Ait Giderler","tanim":"Bu hesap, peşin ödenen ve cari dönem içinde ilgili gider hesaplarına kaydedilmemesi gereken, gelecek döneme ait giderleri izlemek için kullanılır. İşleyişi : Gelecek aylarda ilgili gider ve maliyet hesaplarına borç kaydedilecek peşin olarak ödenen giderler, bu hesabın borcuna kaydedilir."},"480":{"ad":"GELECEK YILLARA AİT GELİRLER","tanim":"Gelecek bilanço dönemlerine ait peşin tahsil olunan gelirlerin bir yıldan uzun süreye ait kısımlarının izlendiği hesaptır. İşleyişi: Peşin tahsil olunan gelirler bu hesabın alacağına kaydedilir. Kısa vadeli nitelik kazanan gelirler bu hesabın borcu mukabili \"380- Gelecek Aylara Ait Gelirler Hesabı\"na aktarılır."}}},{"capa":{"kaynak":"SGS 2026/2 Soru 11"},"kural":"a/2=b/3=c/5=k ise b-a=k; ters orantıda c×d sabittir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 11","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce hangi ilişkinin doğru, hangisinin ters orantı olduğunu ayır; sonra metindeki her sayının hangi bağıntıya ait olduğunu tek tek eşleştir.","konu":"oran orantı","tablo":{"satirlar":[["VERİLENLER","-"],["oran katsayıları","2, 3, 5"],["a+b toplamı","30"],["b-a farkı","6"],["c ile d çarpımı","60"],["HESAP","-"],["K (b-a=k)","6"],["A (=2k)","12"],["B (=3k)","18"],["C (=5k)","30"],["D (=60/c)","2"]],"basliklar":["Kalem","Değer"]},"siklar":{"C":"5","E":"60","A":"1","D":"6","B":"2"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Ters orantıyı c yerine a ile kurulup d=60/12=5 hesaplanır; oysa ters orantı soruda c ile tanımlanmıştır.","E":"Ters orantıyı doğru orantı gibi kurulup d=30×2=60 bulunur; ters orantıda oran değil çarpım sabittir.","D":"c−a farkı kullanılıp yanlış k değeri bulunur ve d=60/10=6 hesaplanır; doğru katsayı farkı 3k−2k=k olmalıdır.","A":"a+b toplamı 30\u0027u ters orantının sabiti sanıp d=30/30=1 bulunur; hâlbuki ters orantının sabiti metinde ayrıca 60 olarak verilmiştir."},"dogru":"Doğru orantıda a, b, c sırasıyla 2, 3, 5 ile orantılı olduğundan a=2k, b=3k, c=5k yazılır. b−a=6 verildiği için 3k−2k=k=6 bulunur, böylece c=30 hesaplanır. Ters orantıda c×d=60 sabit olduğundan d=60/30=2 sonucu çıkar.","sinav":"Doğru orantılı üç sayıdan biriyle ters orantılı dördüncü sayının değeri bulunurken orantı sabiti k yöntemine ek olarak ters orantının tanımı (çarpım sabit) uygulanır.","kavramlar":[{"kaynak":"TEORI","tanim":"Biri artarken diğeri aynı oranda artan iki büyüklük; oranları sabittir ve a/b=k biçiminde yazılır.","ad":"Doğru orantı"},{"kaynak":"TEORI","tanim":"Biri artarken diğeri aynı oranda azalan iki büyüklük; çarpımları sabittir ve a×b=k biçiminde yazılır.","ad":"Ters orantı"},{"kaynak":"TEORI","tanim":"İkiden fazla oranın art arda eşit olması; a/b=c/d=e/f=k denirse her terim sabit k ile ifade edilir.","ad":"Oran zinciri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Değer"],"satirlar":[["K (y-x=k)","8"],["X (=3k)","24"],["Y (=4k)","32"],["Z (=7k)","56"],["W (=84/z)","1.5"]]},"tur":"tablo","soru":"x, y, z sayıları sırasıyla 3, 4, 7 ile doğru orantılıdır. y ile x arasındaki fark 8\u0027dir. w sayısı z ile ters orantılı olup z ile w\u0027nin çarpımı 84\u0027tür. Buna göre w kaçtır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve W\u0027nin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"a, b, c sayıları sırasıyla 2, 3, 5 ile doğru orantılıdır (a+b toplamı 30\u0027dur). b ile a arasındaki fark 6\u0027dır. d sayısı c ile ters orantılı olup c ile d\u0027nin çarpımı 60\u0027tır. Buna göre d kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-08","verilenler":[{"deger":"2, 3, 5","anlam":"a, b, c sayılarının doğru orantı zincirindeki katsayıları","ad":"oran katsayıları"},{"deger":"30","anlam":"Kontrol amaçlı fazladan verilen, çözüme doğrudan girmeyen bilgi","ad":"a+b toplamı"},{"deger":"6","anlam":"Oran sabiti k\u0027yı bulmak için kullanılan denklem","ad":"b-a farkı"},{"deger":"60","anlam":"Ters orantının sabit çarpımı, d\u0027yi bulmak için kullanılır","ad":"c ile d çarpımı"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Oran, Orantı ve Oran Zinciri","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: a/2 = b/3 = c/5 = k oranı (soruda verilen); b - a = 6 (soruda verilen); c × d = 60 (soruda verilen)","anlatim":"Soru bize şunları vermiş: a, b, c sırasıyla 2, 3, 5 ile doğru orantılı; b ile a arasındaki fark 6; c ile d ters orantılı ve çarpımları 60.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"K = b - a = 6 (soruda verilen)","anlatim":"Doğru orantıda ortak katsayıyı bulmak için b ile a arasındaki farkı kullanıyoruz. Çünkü b - a = 3k - 2k = k çıkar, direkt k\u0027yi verir.","doldur":[[6,1]]},{"formul":"A = 2 × K = 2 × 6 (2. adımda bulduk) = 12","anlatim":"a değeri, oran katsayısının 2 katı. K\u0027yi bulduğumuza göre a artık kolay çıkar.","doldur":[[7,1]]},{"formul":"B = 3 × K = 3 × 6 (2. adımda bulduk) = 18","anlatim":"b değeri, oran katsayısının 3 katı. Aynı mantıkla ilerliyoruz.","doldur":[[8,1]]},{"formul":"Sağlama: A + B = 12 (3. adımda bulduk) + 18 (4. adımda bulduk) = 30; soruda verilen 30 ile eşit ✓","anlatim":"Şimdi bir sağlama yapalım: soru a+b toplamının 30 olduğunu söylemişti. Bulduğumuz a ve b bu toplamı tutuyor mu diye kontrol ediyoruz.","doldur":[]},{"formul":"C = 5 × K = 5 × 6 (2. adımda bulduk) = 30","anlatim":"c değeri, oran katsayısının 5 katı. Ters orantı için önce c\u0027ye ihtiyacımız var.","doldur":[[9,1]]},{"formul":"D = 60 / C = 60 (soruda verilen) / 30 (6. adımda bulduk) = 2","anlatim":"Ters orantıda iki sayının çarpımı sabittir. Burada sabit 60, c\u0027yi bulduk, d\u0027yi bölerek çıkarırız.","doldur":[[10,1]]},{"formul":"Sonuç: D = 2","anlatim":"d sayısını bulduk, soru burada bitiyor. Cevap net bir sayı.","doldur":[]},{"formul":"Ters durum: c azalsaydı → d büyürdü (çarpım hep 60 kalır)","anlatim":"Ters durumda: c küçük olsaydı d büyük çıkardı, çünkü ters orantıda biri artınca öbürü azalır.","doldur":[]},{"formul":"Yanlış yol: A + B = 5k = 30 → k = 6 (rastlantısal aynı çıkar ama genel yöntem değil) (HATALI) → doğrusu k = b - a = 6 (2. adımda bulduk)","anlatim":"En sık hata: a+b=30 bilgisini k bulmak için kullanmaya çalışmak. Doğrusu k\u0027yi b-a farkından bulmak, çünkü toplam iki bilinmeyeni birden taşır.","doldur":[]}],"anahtar":[{"ornek":"orantıda","kok":"orantı"},{"ornek":"katsayı","kok":"katsay"},{"ornek":"değeri","kok":"değeri"},{"ornek":"çarpım","kok":"çarpım"},{"ornek":"sabittir","kok":"sabitt"},{"ornek":"bulmak","kok":"bulmak"}],"konuGiris":{"harita":"Ne zaman doğru, ne zaman ters orantı kurulacağı sorudaki ifadeden anlaşılır: biri artarken diğeri de artıyorsa doğru, azalıyorsa ters orantıdır. Bilinmeyenler k cinsinden yazılıp verilen ikinci koşula (toplam, fark ya da çarpım) göre k hesaplanarak ölçülür. Sonuç, bulunan k değeri orana geri konularak istenen büyüklük olarak kaydedilir.","desen":"Bu konu genellikle önce doğru orantılı üç sayıyı toplam veya farkla, sonra bunlardan birini ters orantılı bir başka sayıyla bağlayan iki aşamalı sorular şeklinde gelir. Tuzak, doğru orantıda toplamın kullanılıp ters orantıda çarpımın sabit olduğunu karıştırmaktır; öğrenci genelde ikinci aşamada birinci adımdaki k\u0027yı yanlış taşır. Bu soru arşivde dört dönemde çıkan doğru-ters orantı zinciri noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"iki büyüklüğün aynı yönde ve aynı oranda değişmesi","ad":"Doğru orantı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"iki büyüklüğün çarpımının sabit kalması, biri artarken diğerinin azalması","ad":"Ters orantı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"birden çok bilinmeyeni tek değişkene indiren ortak katsayı","ad":"Orantı sabiti (k)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"a bölü b eşittir c bölü d ise a çarpı d, b çarpı c\u0027ye eşittir kuralı","ad":"İçler dışlar çarpımı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Sırasıyla verilen oran, bir toplam/fark koşulu ve bir çarpım koşulu üzerinden istenen son sayı sorulur.","panel_ornek":"Bir tarifte un ile şeker 4 ile 1 oranında karıştırılıyor ve toplam 20 kase malzeme kullanılıyor. Buna göre kaç kase şeker kullanıldığını bulmak, iki oranı k ile ifade edip toplamdan k\u0027yı çözmekle aynı mantıktır. Sonuç yuvarlak ve küçük çıkar çünkü oranlar sabit kalır.","ornek":"Bir tarifte un ile şeker 4 ile 1 oranında karıştırılıyor ve toplam 20 kase malzeme kullanılıyor. Buna göre kaç kase şeker kullanıldığını bulmak, iki oranı k ile ifade edip toplamdan k\u0027yı çözmekle aynı mantıktır. Sonuç yuvarlak ve küçük çıkar çünkü oranlar sabit kalır.","yontemler":"Önce doğru orantılı sayılar k ile ifade edilip verilen toplam veya farktan k bulunur; sonra bulunan sayı, ters orantılı ikinci ilişkideki çarpım sabitinde kullanılır. En kritik kural, doğru orantıda oranın sabit, ters orantıda çarpımın sabit olduğunu asla karıştırmamaktır.","nedir":"Oran orantı, iki büyüklük arasındaki ilişkiyi bölme yoluyla karşılaştırıp bilinmeyeni bulma yöntemidir. Sınav burada doğru ve ters orantıyı ayırt edip denklem kurma becerini ölçer."},"olay":"b-a=6 → k=6 → a=12,b=18,c=30 → d=60/30=2.","tuzak":{"C":{"ad":"Değişken Karıştırma Tuzağı","metin":"ters orantıyı c yerine a ile kurdun, d=60/a=5 buldun; oysa ters orantı c ile tanımlanmıştır, a ile değil."},"E":{"ad":"Orantı Türü Karıştırma Tuzağı","metin":"ters orantıyı doğru orantı sanıp d=c×2=60 hesapladın; oysa ters orantıda oran değil ÇARPIM sabittir, c ile d ters yönde değişir."},"D":{"ad":"Fark Denklemi Tuzağı","metin":"b-a yerine c-a farkını kullandın (c-a=3k=6→k=2,c=10), d=60/10=6 buldun; oysa katsayı farkı doğru orantıda (3k-2k)=k\u0027dır, (5k-2k)=3k değil."},"A":{"ad":"Sabit Çarpım Karıştırma Tuzağı","metin":"a+b toplamı 30\u0027u ters orantının sabit çarpımı sandın ve d=30/c=1 buldun; oysa 30 sadece kontrol amaçlı verilen fazladan bilgidir. Doğrusu: ters orantının sabiti metinde ayrıca verilen 60\u0027tır."}},"celdiriciYol":{"C":"60 / 12 = 5 (ters orantıyı c yerine a ile kurdun)","E":"30 × 2 = 60 (ters orantıyı doğru orantı gibi oranla kurdun)","D":"3k = 6 → k = 2 → c = 10 → 60 / 10 = 6 (b-a yerine c-a farkını kullandın)","A":"30 / 30 = 1 (a+b toplamını ters orantı sabiti sandın)"},"hap":"Oran zincirinde k\u0027yı doğru katsayı farkından bul, ters orantıda ise bölme değil çarpım sabittir.","teshis":{"C":{"gercek":"Soru metninde ters orantı açıkça \u0027c ile d\u0027 arasında tanımlanmıştır; a, doğru orantı zincirinin bir üyesidir, ters orantıya girmez.","ayirt":"Ters orantı hangi iki harf arasında kurulmuş, onu tekrar okudum mu?","paragraf":"Oran-Orantı Ders Notu - Ters Orantı Tanımı","yanilgi":"Ters orantının hangi iki değişken arasında kurulduğunu karıştırıp a\u0027yı c yerine kullanıyorsun."},"E":{"gercek":"Doğru orantıda oran (bölme) sabittir, ters orantıda ise çarpım sabittir; iki kuralı karıştırmak sonucu tam tersine çevirir.","ayirt":"Bu ikili doğru mu, ters mi orantılı; sabit olan bölme mi çarpma mı?","paragraf":"Oran-Orantı Ders Notu - Doğru Orantı / Ters Orantı Ayrımı","yanilgi":"Ters orantı ile doğru orantıyı aynı kalıpla (oran kurarak) çözülür sanıyorsun."},"A":{"gercek":"Sınav sorularında bazen kontrol amaçlı fazladan (redundan) bilgi verilir; ters orantının sabiti yalnız açıkça \u0027çarpımı X\u0027tir\u0027 denen sayıdır.","ayirt":"Bu sayı hangi bağıntının (oran mı, çarpım mı) parçası olarak verilmiş, tekrar okudum mu?","paragraf":"Oran-Orantı Ders Notu - Ters Orantı Tanımı","yanilgi":"Metinde geçen her sayının hesaba bir yerde gireceğini sanıyorsun, o yüzden a+b=30\u0027u sabit çarpım yerine koydun."},"D":{"gercek":"Soru açıkça b-a=6 demiştir; c-a farkı hiç verilmemiştir, onu kullanmak farklı (ve yanlış) bir k üretir.","ayirt":"Sorudaki \u0027fark\u0027 hangi iki harf arasında tanımlanmış, onu doğru eşleştirdim mi?","paragraf":"Oran-Orantı Ders Notu - K Yöntemi","yanilgi":"Verilen \u0027b ile a arasındaki fark\u0027ı, katsayısı büyük olan c ile a arasındaki fark sanıyorsun."},"B":{"gercek":"a/2=b/3=c/5=k olduğunda b-a=(3-2)k=k\u0027dır; verilen fark doğrudan k\u0027yı verir, sonra c=5k ile ters orantı sabitinden d bulunur.","ayirt":"Katsayı farkını (payda farkını) doğru mu aldım, k\u0027yı doğru denklemden mi çektim?","paragraf":"Oran-Orantı Ders Notu - K Yöntemi ve Ters Orantı","yanilgi":"Bu şıkkı eleyen öğrenci k\u0027yı bulurken hangi katsayı farkının kullanılacağını karıştırıp yanlış bir ara adıma güveniyor."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":4,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 8"},"kural":"ardışık k tane çift sayının toplamı k·n + artışların toplamıdır, en küçük n alınır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 8","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Denklemi çözünce bulduğun n değerinin sorunun cevabı olup olmadığını mutlaka kontrol et, sayıları yazıp toplamla sağla.","konu":"sayı problemi","tablo":{"satirlar":[["VERİLENLER","-"],["Toplam","96"],["HESAP","-"],["Denklem (3n+6=96)","N=30"],["Sayılar","30, 32, 34"],["En büyük sayı","34"]],"basliklar":["Kalem","Değer"]},"siklar":{"C":"33","E":"36","A":"30","D":"34","B":"32"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Çift sayılarda ardışık artışın 1 olduğunu sanıp 3n+3=96 kurarsın; doğrusu çift sayılarda artış 2\u0027dir.","E":"Denklemi kurulurken ardışlardan kaynaklanan 6 sayısını eklemeyi atlarsan 3n=96 denklemi kalır ve n=32 bulursun; n+4 de 36 olur.","A":"Denklemi doğru kurulup n=30 bulunmasına rağmen sorunun \u0027en büyük\u0027ü istediğini gözden kaçırıp en küçük sayıyı cevap olarak yazarsın.","B":"Toplamı terim sayısına bölerek (96÷3=32) ortanca sayıyı bulursun; fakat bu ortanca, en büyük değildir, ortancaya artış miktarı eklenmelidir."},"dogru":"Bilinmeyen en küçük çift sayıya n diyoruz. Ardışık çift sayılar ikişer ikişer arttığından üç sayı n, n+2, n+4 olur. Toplamları 96 ise n+(n+2)+(n+4)=96, buradan 3n+6=96, n=30 bulunur. En büyük sayı n+4=34\u0027tür.","sinav":"Ardışık üç çift sayının toplamı denklemi kurulup en küçüğü n alındığında n=30 bulunur; çift sayılarda ardışık artış 2 olduğundan en büyüğü n+4=34\u0027tür.","kavramlar":[]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Değer"],"satirlar":[["Denklem (3n+6=111)","N=35"],["Sayılar","35, 37, 39"],["En küçük sayı","35"]]},"tur":"tablo","soru":"Ardışık üç tek sayının toplamı 111\u0027dir. Bu sayıların en küçüğü kaçtır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve en küçük sayının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Ardışık üç çift sayının toplamı 96\u0027dır. Bu sayıların en büyüğü kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-07","verilenler":[{"deger":"96","anlam":"Ardışık üç çift sayının toplamı; denklemin sağ tarafını oluşturur","ad":"Toplam"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Ardışık Sayı Problemleri, Formüller ve Çözüm Adımları","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: ardışık üç çift sayının toplamı 96; en büyük sayı isteniyor; \u0027ardışık çift sayı\u0027 demek n, n+2, n+4","anlatim":"Soru bize şunu vermiş: ardışık üç çift sayının toplamı 96. En büyük sayı soruluyor, ara sayılar soruda verilmemiş.","verilenAdim":true,"doldur":[[1,1]]},{"formul":"Denklem = n + (n + 2) + (n + 4) = 3n + 6 = 96","anlatim":"Ardışık çift sayıları n, n+2, n+4 diye yazıyoruz - aralarında hep 2 fark var. Üçünü toplayıp 96\u0027ya eşitliyoruz.","doldur":[[3,0]]},{"formul":"3n = 96 - 6 = 90","anlatim":"Sabit kısmı denklemin diğer tarafına atıyoruz. 6\u0027yı 96\u0027dan çıkarınca 3n\u0027nin değerini buluyoruz.","doldur":[]},{"formul":"n = 90 / 3 = 30","anlatim":"3n\u0027yi 3\u0027e bölünce n\u0027yi buluruz - bu bize en küçük çift sayıyı verir.","doldur":[[3,1]]},{"formul":"Sayılar = n; n + 2; n + 4 = 30 (4. adımda bulduk); 32; 34","anlatim":"n bulununca diğer iki sayı otomatik çıkar, ikişer ikişer artıyoruz.","doldur":[[4,1]]},{"formul":"En büyük sayı = n + 4 = 30 (4. adımda bulduk) + 4 = 34","anlatim":"En büyük sayı zaten n+4 idi, onu az önce bulduk. Cevap 34.","doldur":[[5,1]]},{"formul":"Sağlama = 30 (5. adımda bulduk) + 32 (5. adımda bulduk) + 34 (5. adımda bulduk) = 96","anlatim":"Sağlamasını yapalım: üç sayıyı toplayınca gerçekten 96 çıkıyor mu diye bakıyoruz.","doldur":[]},{"formul":"Yanlış yol: 96 / 3 = 32 (HATALI) → doğrusu 34 (6. adımda bulduk)","anlatim":"En sık hata: 96\u0027yı direkt 3\u0027e bölüp 32\u0027yi cevap sanmak - ama 6\u0027yı önce çıkarmak gerekir.","doldur":[]}],"anahtar":[{"ornek":"ardışık","kok":"ardışı"},{"ornek":"sayıyı","kok":"sayıyı"},{"ornek":"sayının","kok":"sayını"},{"ornek":"toplayıp","kok":"toplay"},{"ornek":"alınır","kok":"alınır"},{"ornek":"ikişer","kok":"ikişer"}],"konuGiris":{"harita":"Sayılar hangi artışla ilerliyor: çift/tek sayılarda artış ikişer, ardışık tam sayılarda birer artar. Denklem nasıl kurulur: en küçük sayı n kabul edilip toplam ifadesi n cinsinden yazılır. Sonuç nasıl kontrol edilir: bulunan n ile tüm sayılar yazılıp toplamları sağlama yapılır.","desen":"Bu soru tipi 4 dönemde çıkmış; tuzak, artışın 1 değil 2 olduğunu unutmaktır. İkinci tuzak, n\u0027yi bulup soruyu bitirmiş sanmak; soru en büyüğü sorduğu için n+4 hesaplanmalıdır. Bu soru p.28\u0027deki ardışık çift sayı toplamı kuralı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"ardışık terimler arasındaki sabit fark; çift/tek sayıda 2\u0027dir","ad":"artış miktarı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"denklemi kurmak için seçilen başlangıç bilinmeyeni","ad":"en küçük terim (n)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"tüm terimlerin n cinsinden yazılıp toplandığı denklem","ad":"toplam ifadesi","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"sorunun asıl cevabı; en büyük, ortanca veya belirli bir terim olabilir","ad":"istenen terim","kim":"kanun sabitler"}],"sinavda":"Ardışık üç çift sayının toplamı verilir, bu sayılardan en büyüğü istenir.","panel_ornek":"Bir apartmanda art arda üç dairenin kapı numaraları toplamı 45 ediyor. Ortadaki dairenin numarasını bulmak için 45\u0027i 3\u0027e bölüyorsun, yani 15; en büyük numara 17 oluyor.","ornek":"Bir apartmanda art arda üç dairenin kapı numaraları toplamı 45 ediyor. Ortadaki dairenin numarasını bulmak için 45\u0027i 3\u0027e bölüyorsun, yani 15; en büyük numara 17 oluyor.","yontemler":"En küçük sayı n, ortadaki n+2, en büyüğü n+4 alınarak toplam denklemi kurulur; kısayol olarak toplam 3\u0027e bölünüp ortanca bulunur, en büyüğüne 2 eklenir.","nedir":"Sayı problemleri, ardışık sayılar arasındaki artış kuralını kullanarak bilinmeyen sayıyı bulmayı öğretir. Sınav burada denklem kurma ve doğru terimi (en büyük mü ortanca mı) seçme becerini ölçer."},"olay":"n+(n+2)+(n+4)=96 → 3n+6=96 → n=30; sayılar 30, 32, 34.","tuzak":{"C":{"ad":"Artış Miktarını Yanlış Alma Tuzağı","metin":"Çift sayılarda ardışık artış 2 iken 1 kabul edip 3n+3=96\u0027dan n=31, en büyük n+2=33 bulursun. Doğrusu: çift sayılarda artış 2\u0027dir, 3n+6=96 kurulmalıdır."},"E":{"ad":"Sabit Terimi Atlama Tuzağı","metin":"Denklemi kurarken artışlardan gelen sabit terimi (0+2+4=6) eklemeyi unutup 3n=96\u0027dan n=32, en büyük n+4=36 bulursun. Doğrusu: sabit terim 6 mutlaka denkleme eklenmelidir, doğru n=30\u0027dur."},"A":{"ad":"En Küçüğü Cevap Sanma Tuzağı","metin":"Denklemi kurup n\u0027yi bulduktan sonra sorunun \u0027en büyük\u0027ü istediğini unutup n\u0027yi cevap yazarsın. Doğrusu: n=30 en küçük sayıdır, en büyük n+4=34\u0027tür."},"B":{"ad":"Ortanca Karıştırma Tuzağı","metin":"Üç terimin toplamının terim sayısına bölümü (96/3=32) ortancayı verir, en büyüğü değil. Doğrusu: ortancaya artış miktarı eklenerek en büyük bulunur, 32+2=34."}},"celdiriciYol":{"C":"3n+3=96 → n=31, en büyük n+2=33 (artışı 2 yerine 1 alma)","E":"3n=96 → n=32, en büyük n+4=36 (sabit terim 6\u0027yı denkleme eklememe)","A":"3n+6=96 → n=30, en büyük hesaplanmadan n cevap yazılır = 30 (en küçüğü cevap sanma)","B":"96/3=32, ortanca cevap olarak yazılır = 32 (ortanca ile en büyüğü karıştırma)"},"hap":"Ardışık çift/tek sayı problemlerinde en küçük sayı n alınır, artış 2\u0027dir ve denkleme mutlaka sabit terim eklenir.","teshis":{"C":{"gercek":"Ardışık çift (ya da tek) sayılarda artış miktarı 2\u0027dir, tam sayılarda 1\u0027dir; tür belirlenmeden denklem kurulmaz.","ayirt":"Sorudaki sayılar çift/tek mi belirtilmiş, artışı doğru mu aldım?","paragraf":"Ardışık Sayı Problemleri - Sınav Tuzağı 1","yanilgi":"Çift sayılarda da ardışıklığın 1\u0027er arttığını sanıyorsun."},"E":{"gercek":"k tane ardışık çift sayının toplamı k·n + (0+2+4+...) biçimindedir; sabit terim atlanırsa n yanlış çıkar.","ayirt":"Denklemimde artışlardan gelen sabit sayı yer alıyor mu?","paragraf":"Ardışık k Tane Tam Sayının Toplamı Formülü","yanilgi":"Denklem kurarken artışlardan gelen sabit terimi (0+2+4) unutup yalnızca n katsayısıyla işlem yapıyorsun."},"A":{"gercek":"n yalnızca en küçük sayıyı temsil eder; soru en büyüğü istiyorsa n\u0027ye artış miktarları eklenmelidir.","ayirt":"Bulduğum değer denklemdeki n mi, yoksa sorunun istediği ifade mi?","paragraf":"Ardışık Sayı Problemleri - Çözüm Adımları","yanilgi":"Denklemi çözüp bulduğun n değerini sorunun cevabı sanıyorsun."},"D":{"gercek":"3n+6=96 denklemi doğru kurulup n=30 bulunduktan sonra sayılar 30,32,34 olur; en büyüğü 34\u0027tür.","ayirt":"Sayıları tek tek yazıp toplamla sağlamasını yaptım mı?","paragraf":"Küçük Örnek - Ardışık Üç Çift Sayı","yanilgi":"Denklemi doğru kurduğunu düşünüp sabit terimi veya son adımı atlayarak yanlış şıkka kayabilirsin."},"B":{"gercek":"Toplam/terim sayısı yalnızca ortanca terimi verir; en büyük veya en küçük için artış miktarı ayrıca eklenip çıkarılmalıdır.","ayirt":"Bulduğum sayı ortanca mı, soru gerçekten ortancayı mı istiyor?","paragraf":"Ardışık Sayıların Toplamı = Terim Sayısı × Orta Terim","yanilgi":"Toplamı terim sayısına bölünce doğrudan istenen sayıyı bulduğunu sanıyorsun."}},"verilen":[[1,1]],"donem":4,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 8"},"kural":"Ardışık çift sayılarda artış 2\u0027dir; en küçük sayı n alınırsa diğerleri n+2, n+4, n+6 olur; toplam denklemi kurulup n bulunduktan sonra istenen terim hesaplanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 8","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Denklemi çözüp n\u0027yi bulduğunda hemen cevap yazma; sorunun en büyük, en küçük ya da hangi terimi istediğini tekrar kontrol et.","konu":"sayı problemi","tablo":{"satirlar":[["VERİLENLER","-","-"],["terim sayısı","4","-"],["katsayı","5","-"],["sabit fark","8","-"],["ikinci terim","6","-"],["HESAP","-","-"],["En küçük sayı (n)","4n+12 = 5n+8","N=4"],["Ardışık dört çift sayı","N, n+2, n+4, n+6","4, 6, 8, 10"],["En büyük sayı","N+6","10"]],"basliklar":["Adım","İfade","Değer"]},"siklar":{"C":"8","E":"12","A":"4","D":"10","B":"6"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Dört terimli dizide üçüncü sayı ortanca gibi görünse de en büyük değer her zaman son terimdir, yani dördüncü sayı n+6\u0027dır.","E":"Dizinin dörtte bire sınırlı olduğunu unutup beşinci bir terim daha varmış gibi n+8 hesapladın. Dizi n, n+2, n+4, n+6 olmak üzere tam dört terimden oluşur.","A":"Denklemi çözerek n=4 bulunduktan sonra durmakla en küçük sayıyı cevap sandın. Soru en büyük sayıyı istemektedir; dördüncü terim olan n+6 hesaplanmalıydı.","B":"Sorudaki \u0027ikincisi 6\u0027dır\u0027 bilgisini dörtlü dizinin son terimi zannettip ikinci sayıyı en büyük sanıp seçtin. En büyük değer dördüncü ve son terimdir, ikinci değil."},"dogru":"Ardışık dört çift sayı 2\u0027şer artar. En küçüğüne n dersen diğerleri n+2, n+4, n+6 olur. Toplam 4n+12 = en küçüğün 5 katı + 8, yani 5n+8\u0027e eşittir. Buradan n=4 bulunur; dördüncü ve en büyük sayı n+6=10\u0027dur.","sinav":"Ardışık çift sayılar ikişer artar, en küçük n ise diğerleri n+2, n+4, n+6 olup toplam denklemi 4n+12=5n+8 kurulan ve n=4 bulunduktan sonra istenen en büyük terim n+6=10 hesaplanır.","kavramlar":[{"kaynak":"TEORI","tanim":"İkişer artan sayı dizisi; en küçüğü n ise diğerleri n+2, n+4, n+6 şeklinde gösterilir.","ad":"Ardışık çift sayılar"},{"kaynak":"TEORI","tanim":"Verilen koşulları matematiksel eşitlikle ifade eden denklem; çözülerek bilinmeyen değer bulunur.","ad":"Toplam denklemi"},{"kaynak":"TEORI","tanim":"Denklem çözüldükten sonra sorunun sorduğu belirli sayı; en küçük değil en büyük gibi belirlenen terimdir.","ad":"İstenen terim"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,1],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Adım","İfade","Değer"],"satirlar":[["En küçük sayı (n)","4n+12 = 5n+5","N=7"],["Ardışık dört tek sayı","N, n+2, n+4, n+6","7, 9, 11, 13"],["En büyük sayı","N+6","13"]]},"tur":"tablo","soru":"Ardışık dört tek sayının toplamı, en küçük sayının 5 katından 5 fazladır. Bu sayılardan ikincisi 9\u0027dur. Buna göre en büyük sayı kaçtır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve en büyük sayının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Ardışık dört çift sayının toplamı, en küçük sayının 5 katından 8 fazladır. Bu sayılardan ikincisi 6\u0027dır. Buna göre en büyük sayı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-07","verilenler":[{"deger":"4","anlam":"Ardışık çift sayı dizisinde kaç terim olduğunu belirtir; n, n+2, n+4, n+6 şeklinde dizi kurulmasını sağlar.","ad":"terim sayısı"},{"deger":"5","anlam":"Toplamın, en küçük sayının kaç katına eşit olduğunu belirten denklem katsayısıdır.","ad":"katsayı"},{"deger":"8","anlam":"Toplamın, en küçük sayının 5 katından ne kadar fazla olduğunu belirtir; denklemin sağ tarafına eklenir.","ad":"sabit fark"},{"deger":"6","anlam":"Doğrulama amaçlı verilmiştir; denklemden bulunan n=4 değeriyle n+2=6 tutarlılığını gösterir, ayrıca hesaba katılmaz.","ad":"ikinci terim"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Ardışık Sayı Problemi bölümü, Tanım ve Kural / Çözüm Adımları","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: ardışık dört çift sayı; toplamları = en küçük sayının 5 katı + 8; ikinci sayı 6 (soruda verilen); istenen: en büyük sayı","anlatim":"Soru bize şunları vermiş: ardışık dört çift sayının toplamı, en küçük sayının 5 katından 8 fazla. Ayrıca bu dört sayıdan ikincisi 6 imiş - bunlar soru verisi, biz bulmadık.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Dört sayı = n, n+2, n+4, n+6","anlatim":"Ardışık çift sayılarda her sayı bir öncekinden 2 fazladır - bu yüzden en küçüğe n dersek diğerleri n+2, n+4, n+6 olur. İkinci sayı n+2 olduğuna göre n+2 = 6, yani n = 4 çıkar ama biz bunu ayrı adımda kanıtlayacağız.","doldur":[[7,1],[7,2]]},{"formul":"Toplam = n + (n+2) + (n+4) + (n+6) = 4n + 12","anlatim":"Şimdi biz toplamı kuruyoruz: dört sayının toplamı n+(n+2)+(n+4)+(n+6) yani 4n+12 olur. Bu toplam soru metnine göre 5n+8\u0027e eşit.","doldur":[]},{"formul":"4n + 12 = 5n + 8 → 12 − 8 = 5n − 4n → n = 4","anlatim":"İki ifadeyi eşitleyip n\u0027yi çözüyoruz - denklem çözmek burada tek yol çünkü iki bilinmeyenli görünen ama aslında tek meçhullü bir eşitlik var. 4n+12 = 5n+8 sadeleşince n=4 çıkar.","doldur":[]},{"formul":"Sayılar = n (4. adımda bulduk), n+2, n+4, n+6 = 4, 6, 8, 10","anlatim":"n=4 bulduğumuza göre dört sayıyı tek tek yazabiliriz. Dikkat: ikinci sayı burada gerçekten 6 çıkıyor, soruyla tutarlı - bu bir doğrulama.","doldur":[]},{"formul":"En büyük sayı = n + 6 = 4 (4. adımda bulduk) + 6 = 10","anlatim":"En büyük sayı zaten n+6 idi, bu genel ifadeyi biz 2. adımda kurmuştuk. Şimdi sadece n\u0027nin bulunan değerini yerine koyuyoruz.","doldur":[[8,1],[8,2]]},{"formul":"Sonuç: en büyük sayı = 10","anlatim":"Sonuç: en büyük sayı 10 çıktı. Dört sayı da 4, 6, 8, 10 olduğu için bu değer listenin son elemanıyla da örtüşüyor.","doldur":[]},{"formul":"Ters durum: üçüncü sayı 6 olsaydı → n+4=6 → n=2 → en büyük = 8","anlatim":"Ters durumda: soru ikinci yerine üçüncü sayının 6 olduğunu söyleseydi, n+4=6 olur n=2 çıkardı. O zaman en büyük sayı n+6=8 olurdu.","doldur":[]},{"formul":"Yanlış yol: n, n+1, n+2, n+3 kullanmak (HATALI) → doğrusu n, n+2, n+4, n+6 (2. adımda bulduk)","anlatim":"En sık hata: öğrenci ardışık çift sayılarda artışı 1 sanıp n, n+1, n+2, n+3 yazar. Bu yanlıştır çünkü çift sayılar arasındaki fark her zaman 2\u0027dir.","doldur":[]}],"anahtar":[{"ornek":"ardışık","kok":"ardışı"},{"ornek":"sayının","kok":"sayını"},{"ornek":"sayılarda","kok":"sayıla"},{"ornek":"denklem","kok":"denkle"},{"ornek":"diğerleri","kok":"diğerl"},{"ornek":"ikincisi","kok":"ikinci"}],"konuGiris":{"harita":"Ne zaman test edilir: sözel ifade cebirsel denkleme çevrilirken test edilir. Nasıl ölçülür: verilen koşuldan kurulan denklemin doğru çözülüp istenen sayının bulunmasıyla ölçülür. Nasıl kaydedilir: bulunan dört sayı yazılıp toplamla sağlaması yapılarak doğrulanır.","desen":"Bu tip soruların tuzağı, \u0027en küçük sayının 5 katından 8 fazla\u0027 ifadesini yanlış sırayla yazmaktır; doğrusu 5n+8\u0027dir, 8+5n değil sırası önemli değildir ama işaret hatası sık yapılır (p.ardışık sayı problemi). İkinci sayının 6 olması, en küçük sayıyı doğrudan 4 verir; bu bilgiyi atlayıp n\u0027yi denklemden çözmeye çalışmak zaman kaybettirir. Bu soru, ardışık çift sayı dizisinde verilen bir terimden diğerlerini çıkarma noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"birbirini ikişer artışla takip eden sayı dizisi","ad":"ardışık çift sayı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"dizideki ilk sayı, denklemin temel bilinmeyeni","ad":"en küçük terim (n)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"toplamın, bir terimin belli katından fazla olması ilişkisi","ad":"katsayılı koşul","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"dizideki belirli bir terimin sabit değeri","ad":"ikinci sayı verisi","kim":"kanun sabitler"}],"sinavda":"Ardışık dört çift sayı ve bunlardan birinin toplamla ilişkisi verilip en büyük sayı istenir.","panel_ornek":"İkinci el bir telefonun fiyatı, en düşük fiyatlı modelin 3 katından 10 fazla; en düşük model 90 TL ise en pahalısı kaçtır demek gibi düşün. Burada da bilinmeyeni bulup diğerlerini ondan türetiyorsun.","ornek":"İkinci el bir telefonun fiyatı, en düşük fiyatlı modelin 3 katından 10 fazla; en düşük model 90 TL ise en pahalısı kaçtır demek gibi düşün. Burada da bilinmeyeni bulup diğerlerini ondan türetiyorsun.","yontemler":"İkinci sayı biliniyorsa en küçüğü doğrudan iki eksiltmek denklem kurmaktan hızlıdır; bulunan tüm sayıları yazıp koşulu sağlama ile kontrol et.","nedir":"Bu konu, ardışık sayı ilişkilerini denkleme dökme becerisini kapsar. Sınav, verilen sözel koşulu doğru cebirsel eşitliğe çevirip çevirmediğini ölçer."},"olay":"4n+12=5n+8 → n=4; sayılar 4,6,8,10.","tuzak":{"C":{"ad":"Ortanca Sanma Tuzağı","metin":"Dört terimli dizide üçüncü terimi (n+4) ortanca/en büyük sanarak yazdın. Doğrusu: çift sayıda terim varsa en büyük değer son terimdir, üçüncü terim değil."},"E":{"ad":"Fazla Terim Tuzağı","metin":"Dizinin dört terimli olduğunu unutup beşinci bir terim daha varmış gibi n+8 hesapladın. Doğrusu: dizi n, n+2, n+4, n+6 olmak üzere tam dört terimden oluşur, beşinci terim yoktur."},"A":{"ad":"En Küçüğü Cevap Sanma Tuzağı","metin":"Denklemi kurup n=4 bulduktan sonra işlemi bitmiş sayıp bu değeri doğrudan cevap yazdın. Doğrusu: n en küçük sayıdır, soru en büyük sayıyı istemektedir; n+6 hesaplanmalıdır."},"B":{"ad":"Terim Karıştırma Tuzağı","metin":"Sorudaki \u0027ikincisi 6\u0027dır\u0027 bilgisini son terimle karıştırıp ikinci terimi en büyük sandın. Doğrusu: dört terimli dizide en büyük terim dördüncü terimdir, n+6\u0027dır."}},"celdiriciYol":{"C":"n+4 = 4+4 = 8 (üçüncü terimi ortanca/en büyük sandın)","E":"n+8 = 4+8 = 12 (dört terimli diziye beşinci bir terim daha ekledin)","A":"4n+12=5n+8 → n=4 (bulunan n değerini sorgusuzca cevap sanarak yazdın)","B":"n+2 = 4+2 = 6 (ikinci terimi en büyük sayı sandın)"},"hap":"Ardışık çift/tek sayı problemlerinde en küçük terim n alınır, diğerleri n+2, n+4... şeklinde yazılıp denklem kurulur; n bulunduktan sonra sorunun istediği terim ayrıca hesaplanır.","teshis":{"C":{"gercek":"Terim sayısı çift olduğunda tek bir ortanca terim yoktur; en büyük değer son terimdir, üçüncü terim değildir.","ayirt":"Terim sayım çift mi tek mi, ortanca mı yoksa son terim mi isteniyor?","paragraf":"TESMER SGS Matematik Ders Notu - Ardışık Sayı Problemleri, Sınav Tuzağı (2)","yanilgi":"Dört terimli dizide tek bir ortanca terim olduğunu ve bunun en büyük değer olduğunu sanıyorsun."},"E":{"gercek":"Soru açıkça \u0027ardışık dört çift sayı\u0027 demektedir; dizi yalnızca n, n+2, n+4, n+6\u0027dan oluşur.","ayirt":"Kaç terimli bir dizi kurduğumu soru köküyle karşılaştırdım mı?","paragraf":"TESMER SGS Matematik Ders Notu - Ardışık Sayı Problemleri, Sınav Tuzağı (1)","yanilgi":"Dizinin dört terimli olduğunu unutup fazladan bir terim daha eklenebileceğini düşünüyorsun."},"A":{"gercek":"n yalnızca en küçük terimi temsil eder; soru kökünde hangi terimin istendiği ayrıca belirtilir.","ayirt" Sembol (⋆, ◇ gibi) ile ifade edilen, kurala göre hesaplanan yeni bir işlemdir; sıra önemlidir ve x∗y ile y∗x farklı olabilir.","ad":"Tanımlanmış işlem"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2]],"tablo":{"basliklar":["Katman","Denklem","Sonuç"],"satirlar":[["Birim eleman (e)","E + x − 7 = x","7"],["5\u0027in tersi (t)","5 + t − 7 = 7","9"],["T ∆ E hesabı","3(9) + 7 − 5","29"],["SONUÇ","-","29"]]},"tur":"tablo","soru":"x ∆ y = 3x + y − 5 ve x ∘ y = x + y − 7 işlemleri tanımlanıyor. ∘ işleminin birim elemanı e, 5 sayısının ∘ işlemine göre tersi t olmak üzere, t ∆ e ifadesinin değeri kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve t ∆ e ifadesinin değerinin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"x ⋆ y = 2x + y − 4 ve x ◇ y = x + y − 6 işlemleri tanımlanıyor. ◇ işleminin birim elemanı e, 4 sayısının ◇ işlemine göre tersi t olmak üzere, e ⋆ t ifadesinin değeri kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-06","verilenler":[{"deger":"x ⋆ y = 2x + y − 4","anlam":"Son adımda e ve t sırasıyla yerine konularak uygulanacak kural","ad":"⋆ tanımı"},{"deger":"x ◇ y = x + y − 6","anlam":"Birim eleman ve ters eleman bu tanıma göre bulunur","ad":"◇ tanımı"},{"deger":"4","anlam":"◇ işlemine göre tersi bulunması istenen sayı","ad":"Tersi aranan sayı"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Tanımlı İşlem (Birim ve Ters Eleman)","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: ⋆ işlemi x ⋆ y = 2x + y − 4 (soruda verilen); ◇ işlemi x ◇ y = x + y − 6 (soruda verilen); 4 sayısının ◇\u0027ye göre tersi isteniyor (soruda verilen)","anlatim":"İki işlem tanımlanmış, birini kullanarak birim eleman ve ters bulunacak. Sonra bu ikisi diğer işlemde birleştirilecek.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Birim eleman = E + x − 6 = x → E = 6","anlatim":"Birim eleman, işlemi hiç değiştirmeyen sayıdır - x ◇ E = x olmalı. Bu denklemi kurup E\u0027yi çözüyoruz.","doldur":[[5,1],[5,2]]},{"formul":"4\u0027ün tersi = 4 + t − 6 = 6 (2. adımda bulduk) → t = 8","anlatim":"Bir sayının tersi, o sayıyla işleme girince birim elemanı vermesi demek. 4 ile t\u0027yi ◇\u0027da birleştirip 6\u0027ya (birim eleman) eşitliyoruz.","doldur":[[6,1],[6,2]]},{"formul":"2 × e = 2 × 6 (2. adımda bulduk) = 12","anlatim":"Şimdi e ⋆ t hesaplayacağız ama önce çarpımı ayrı yapıyoruz, çünkü bir adımda tek işlem olur. ⋆ işleminde x\u0027in 2 katı alınıyor.","doldur":[]},{"formul":"e ⋆ t = 12 (4. adımda bulduk) + 8 (3. adımda bulduk) − 4 (soruda verilen) = 16","anlatim":"Çarpımı bulduktan sonra geri kalan toplama ve çıkarmayı tek adımda yapıyoruz. Böylece e ⋆ t\u0027nin değeri çıkar.","doldur":[[7,1],[7,2]]},{"formul":"Sonuç = 16 (5. adımda bulduk)","anlatim":"Bütün adımlar birleşince sonuç netleşiyor. e ⋆ t ifadesinin değeri budur.","doldur":[[8,1],[8,2]]},{"formul":"Yanlış yol: 6 + 8 − 4 = 10 (HATALI) → doğrusu 16 (5. adımda bulduk)","anlatim":"En sık hata, çarpımı unutup direkt e ile t\u0027yi toplamaktır - bu ⋆ işleminin tanımını yok sayar. 2 katsayısı atlanırsa yanlış sonuca gidilir.","doldur":[]}],"anahtar":[{"ornek":"eleman","kok":"eleman"},{"ornek":"birleştirilecek","kok":"birleş"},{"ornek":"işlemi","kok":"işlemi"},{"ornek":"çarpımı","kok":"çarpım"},{"ornek":"hesaplanır","kok":"hesapl"},{"ornek":"tanımlı","kok":"tanıml"}],"konuGiris":{"harita":"Ne zaman test edilir: sembolle tanımlanan yeni işlemi kurala göre uygulayıp birim ve ters eleman hesaplaması istendiğinde. Nasıl ölçülür: tanımdaki x ve y yerine doğru sırayla sayı koyup denklemi çözme adımlarının doğruluğuna bakılır. Nasıl kaydedilir: sonuç tek bir sayı olarak, ara işlemler adım adım gösterilerek yazılır.","desen":"Tuzak, x ⋆ y ile y ⋆ x\u0027in karıştırılması ve iki farklı işlemin (⋆ ve ◇) birbirine karıştırılmasıdır; her işlemin kendi kuralı ayrı uygulanmalıdır. Diğer tuzak, birim eleman ve ters eleman bulunurken denklemin kurulma sırasının şaşırılmasıdır. Bu soru p.28 sınav tuzağı (1) ve (3) noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"sembolle verilen, x ve y yerine sayı konularak uygulanan yeni kural","ad":"tanımlı işlem","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"her x için x ile işlemi x\u0027i değiştirmeyen sabit sayı e","ad":"birim eleman","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"bir sayı ile işlemi birim elemanı veren diğer sayı t","ad":"ters eleman","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"sembolün solundaki sayı x, sağındaki sayı y yerine gider","ad":"işlem sırası","kim":"kanun sabitler"}],"sinavda":"İki farklı tanımlı işlem verilip birinden birim ve ters eleman bulunduktan sonra bu değerler diğer işlemde yerine konularak sonuç istenir.","panel_ornek":"Bir kafede \u0027çift kahve fiyatı\u0027 kuralı şöyle: iki kahve alırsan toplam fiyat = birinci kahvenin fiyatı x 2 artı ikinci kahvenin fiyatı eksi 3 lira indirim. Yani kuralı sırayla, hangi sayı önce hangi sayı sonra yazılmışsa ona göre uygularsın; sırayı değiştirirsen sonuç değişir, tıpkı bu soruda x ile y\u0027nin yerini değiştirince farklı sonuç çıkması gibi.","ornek":"Bir kafede \u0027çift kahve fiyatı\u0027 kuralı şöyle: iki kahve alırsan toplam fiyat = birinci kahvenin fiyatı x 2 artı ikinci kahvenin fiyatı eksi 3 lira indirim. Yani kuralı sırayla, hangi sayı önce hangi sayı sonra yazılmışsa ona göre uygularsın; sırayı değiştirirsen sonuç değişir, tıpkı bu soruda x ile y\u0027nin yerini değiştirince farklı sonuç çıkması gibi.","yontemler":"Önce ◇ işleminin birim elemanı e denklemden bulunur, sonra 4\u0027ün ◇\u0027ye göre tersi t aynı yöntemle çözülür; son adımda e ve t sırasıyla ⋆ tanımına konur.","nedir":"Tanımlı işlem, sembolle verilen yeni bir kuralı harflerin yerine sayı koyarak uygulama becerisidir. Sınav, sıraya ve kura
