ma Tuzağı","metin":"Ardışık tek sayılarda farkın 2 değil 4 olduğunu sanıp a, a+4, a+8, a+12, a+16 yazdın; ortanca yine 39 çıksa da uçlar kaydı. Doğrusu: fark 2 alınıp uçlar 35 ve 43 bulunur."}},"celdiriciYol":{"C":"5a+10=195 =\u003e a=37 (fark 1 varsayımıyla); en büyük=37+4=41, en küçük=37; 37×41=1517 (tek sayı şartını atlayıp fark 1 alma hatası)","E":"Terim sayısını 4 sanıp 195/4=48,75\u0027i 49\u0027a yuvarladı, fark 2 ile en küçük=45, en büyük=53; 45×53=2385 (terim sayısını yanlış alma hatası)","D":"Ortalama=195/5=39\u0027u en küçük sayı kabul etti; en büyük=39+8=47; 39×47=1833 (ortanca ile en küçüğü karıştırma hatası)","A":"Ortanca=195/5=39 (doğru); fark\u0027ı 4 alıp en küçük=39-8=31, en büyük=31+16=47; 31×47=1457 (fark\u0027ı 2 yerine 4 alma hatası)"},"hap":"Tek sayıda terimli ardışık dizide ortalama = ortanca = toplam/terim sayısı, uçlar buradan farkla bulunur.","teshis":{"C":{"gercek":"Ardışık tam sayılarda fark 1, ardışık tek/çift sayılarda fark 2\u0027dir; soru metni hangisini istediğini belirtir.","ayirt":"Soru \u0027tek doğal sayı\u0027 mı diyor, yoksa sade \u0027doğal sayı\u0027 mı?","paragraf":"Ardışık Sayılar - Tanım ve Kural","yanilgi":"Ardışık sayı ile ardışık tek/çift sayı kavramlarını aynı şey sanıyorsun."},"E":{"gercek":"Terim sayısı toplam formülünde doğrudan verilenden alınır; sorudaki \u0027beş\u0027 ifadesi n=5\u0027tir.","ayirt":"Terim sayısını soru metninden mi aldım, yoksa tahmin mi ettim?","paragraf":"Ardışık Sayılar - Terim Sayısı Kuralı","yanilgi":"Sorudaki terim sayısını dikkatlice okumadan varsayılan bir sayı (4) kullanıyorsun."},"A":{"gercek":"Ardışık tek sayı tanımı gereği fark sabit ve 2\u0027dir; farklı bir fark kullanmak diziyi \u0027ardışık tek sayı\u0027 olmaktan çıkarır.","ayirt":"Kullandığım fark, sorudaki \u0027ardışık tek sayı\u0027 tanımına uygun mu?","paragraf":"Ardışık Sayılar - Tanım ve Kural","yanilgi":"Ardışık tek sayılarda ardışıklığın her zaman fark 2 olduğunu unutup rastgele bir fark (4) kullanılabileceğini sanıyorsun."},"D":{"gercek":"Ortalama, dizinin ORTA noktasıdır; en küçük terim ortalamadan (terim sayısı-1)/2 kadar fark×2 küçüktür.","ayirt":"Bulduğum sayı dizinin ortasında mı, yoksa ucunda mı?","paragraf":"Ardışık Sayılar - Ortalama Kuralı","yanilgi":"Ortalama/ortanca değerinin dizinin en küçük terimi olduğunu sanıyorsun."},"B":{"gercek":"Tek sayıda terimli aritmetik dizide toplam/terim sayısı = ortalama = ortanca; bu doğrudan uç değerleri bulmaya götürür.","ayirt":"Terim sayısı tek mi, öyleyse ortalama=ortanca kısayolunu kullandım mı?","paragraf":"Ardışık Sayılar - Toplam Formülü","yanilgi":"Bu şıkkı eleyen öğrenci, ortanca ile ortalamanın aynı şey olduğunu fark edemeyip gereksiz yere tüm terimleri tek tek yazmaya çalışır ve hata yapar."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 12"},"kural":"a² − b² = (a − b)(a + b) özdeşliğinde bilinen iki değerden üçüncü değer bölme ile bulunur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 12","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İki bilinmeyenli toplam-fark sorularında x ve y\u0027yi tek tek çözmeye kalkma; doğrudan özdeşliği kurup bölme yap.","konu":"çarpanlara ayırma sadelestirme","tablo":{"satirlar":[["VERİLENLER","-","-"],["x² − y² değeri","24","-"],["x − y değeri","4","-"],["HESAP","-","-"],["Özdeşlik Kurma","X² − y² = (x − y)(x + y)","24 = 4 × (x + y)"],["Sonuç","X + y = 24 / 4","6"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"10","E":"96","A":"4","D":"20","B":"6"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Özdeşlikten 6 bulunduktan sonra ek olarak x − y = 4 eklemek yanlış; çarpanlara ayırma özdeşliğinin sonucu nihai cevaptır.","E":"Bölme yerine çarpma yaparak 24 × 4 = 96 elde etmek; x + y, çarpımın çarpanlardan birine bölünmesiyle bulunur.","D":"Çarpım özdeşliğini çıkarma işlemiyle karıştırıp 24 − 4 = 20 yazmak; kural çarpım işlemine dayanır.","A":"Verilen x − y = 4 değerini doğrudan cevap olarak yazmak, x − y ile x + y\u0027nin ayrı büyüklükler olduğu göz ardı etmektir."},"dogru":"İki sayının kareleri farkı, iki sayının farkı ile toplamının çarpımına eşittir. Burada 24 = 4 × (x + y) olur, x + y = 24 ÷ 4 = 6 bulunur.","sinav":"Çarpanlara ayırma özdeşliğinde a² − b² = (a − b)(a + b) kuralı kullanılarak verilen iki değerden üçüncü değer bölme işlemiyle bulunur.","kavramlar":[{"kaynak":"TEORI","tanim":"Toplam veya fark biçimindeki bir ifadeyi çarpım biçimine dönüştürme işlemidir; denklem çözme ve sadeleştirmede kullanılır.","ad":"Çarpanlara ayırma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[1,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["Özdeşlik Kurma","a² − b² = (a − b)(a + b)","45 = 5 × (a + b)"],["Sonuç","a + b = 45 / 5","9"]]},"tur":"tablo","soru":"a, b gerçek sayılar olmak üzere a² − b² = 45 ve a − b = 5 olduğuna göre a + b kaçtır?","verilen":[[0,1],[0,2]],"hedef":"Tabloyu doldur ve a + b\u0027nin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"x, y gerçek sayılar olmak üzere x² − y² = 24 ve x − y = 4 olduğuna göre x + y kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-32","verilenler":[{"deger":"24","anlam":"Özdeşliğin sol tarafı, çarpım biçimine dönüştürülecek toplam durumundaki ifade.","ad":"x² − y² değeri"},{"deger":"4","anlam":"Çarpım özdeşliğindeki bilinen çarpan; x + y\u0027yi bulmak için 24\u0027ün bölüneceği sayı.","ad":"x − y değeri"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Çarpanlara Ayırma, a² − b² Özdeşliği","dogru":"B","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: x² − y² 24 (soruda verilen); x − y 4 (soruda verilen)","anlatim":"Soru bize şunları vermiş: x² − y² = 24 ve x − y = 4. İstenen: x + y\u0027nin değeri.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"a² − b² = (a − b)(a + b) → x² − y² = (x − y)(x + y)","anlatim":"Bu bir çarpanlara ayırma özdeşliğidir - iki kare farkı, iki çarpanın çarpımına dönüşür. Neden işe yarar? Çünkü bilinmeyen x + y\u0027yi tek başına izole eder.","doldur":[]},{"formul":"24 (soruda verilen) = 4 (soruda verilen) × (x + y)","anlatim":"Şimdi biz hesaplıyoruz: bilinen iki değeri özdeşliğe yerleştiriyoruz. Böylece x + y tek bilinmeyen olarak kalıyor.","doldur":[]},{"formul":"x + y = 24 (soruda verilen) / 4 (soruda verilen) = 6","anlatim":"Şimdi biz hesaplıyoruz: eşitliğin iki tarafını 4\u0027e bölerek x + y\u0027yi buluyoruz. Bölme işlemi çarpanı denklemden çekip alır.","doldur":[]},{"formul":"Sağlama: 5² − 1² = 25 − 1 = 24 ✓","anlatim":"Sağlama: x − y = 4 ve x + y = 6 ise x = 5, y = 1 çıkar. Kontrol edelim, gerçekten x² − y² = 24 mü?","doldur":[]},{"formul":"Yanlış yol: x + y = 24 (HATALI) → doğrusu x + y = 24 / 4 = 6 (4. adımda bulduk)","anlatim":"En sık hata: öğrenci 24\u0027ü 4\u0027e bölmeden doğrudan x + y = 24 sanabilir. Doğrusu özdeşliği kurup bölme yapmaktır.","doldur":[]}],"anahtar":[{"ornek":"özdeşliğinde","kok":"özdeşl"},{"ornek":"çarpana","kok":"çarpan"},{"ornek":"bilinen","kok":"biline"},{"ornek":"üçüncüsü","kok":"üçüncü"},{"ornek":"çarpımın","kok":"çarpım"},{"ornek":"hesaplıyoruz","kok":"hesapl"}],"konuGiris":{"harita":"Ne zaman test edilir: iki terimli ifadeler farkı biçiminde verildiğinde. Nasıl ölçülür: a²−b²=(a−b)(a+b) özdeşliğini kurup verilenleri yerine koyarak. Nasıl kaydedilir: x−y ve x+y çarpımından x²−y² değeri elde edilir, sonuç orandan çözülür.","desen":"Bu tür sorularda tuzak, öğrencinin x²−y²=24 ve x−y=4 değerlerini doğrudan toplayıp çıkarmaya çalışmasıdır; oysa özdeşlik kurulmalıdır. Bazı öğrenciler a²−b² ile a²+b²\u0027yi karıştırıp yanlış çarpanlara ayırır. Arşivde bir dönem çıkmıştır; bu soru özdeşlik tanıma ve oran kurma noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"iki kare farkının, farkın ve toplamın çarpımına eşit olduğunu söyler","ad":"a²−b² özdeşliği","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"iki değişken arasındaki farkı gösteren verilen değer","ad":"x−y (fark)","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"iki değişkenin karelerinin farkı, soruda sayısal olarak verilir","ad":"x²−y²","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"özdeşlik kurulduktan sonra bölme ile elde edilen sonuç değeri","ad":"x+y (toplam)","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"x²−y² ve x−y değerleri verilip x+y değeri istenir.","panel_ornek":"İkinci el bir telefonun eski fiyatı ile yeni fiyatı arasındaki farkı biliyorsun ve fiyatların toplamı da elinde: bu iki bilgiden tek tek fiyatları bulabilirsin. Mesela fark 2, toplam 10 ise büyük fiyat 6, küçük fiyat 4 çıkar. İşte a²−b²=(a−b)(a+b) özdeşliği de tam olarak böyle iki bilgiden üçüncüyü bulmanı sağlar.","ornek":"İkinci el bir telefonun eski fiyatı ile yeni fiyatı arasındaki farkı biliyorsun ve fiyatların toplamı da elinde: bu iki bilgiden tek tek fiyatları bulabilirsin. Mesela fark 2, toplam 10 ise büyük fiyat 6, küçük fiyat 4 çıkar. İşte a²−b²=(a−b)(a+b) özdeşliği de tam olarak böyle iki bilgiden üçüncüyü bulmanı sağlar.","yontemler":"x²−y²=(x−y)(x+y) özdeşliği kurulur, bilinen x−y değeri ile x²−y² değeri orantılanarak x+y bulunur; en kritik kural ortadaki toplam ve fark terimlerinin karıştırılmamasıdır.","nedir":"Çarpanlara ayırma, toplam biçimindeki ifadeyi çarpım biçimine dönüştürme işlemidir. Sınav bu konuda özdeşlikleri tanıyıp doğru yönteme karar verme becerini ölçer."},"olay":"24 = 4 × (x + y) → x + y = 24 / 4 = 6.","tuzak":{"C":{"ad":"Fazladan İşlem Tuzağı","metin":"Öğrenci doğru sonuca (6) ulaştıktan sonra elindeki x − y = 4 değerini bir kez daha toplayarak 6 + 4 = 10 yazdı. Doğrusu: Özdeşlikten çıkan sonuç nihai değerdir, ek işlem yapılmaz."},"E":{"ad":"İşlem Ters Çevirme Tuzağı","metin":"Öğrenci bölme yerine çarpma yaparak 24 × 4 = 96 buldu, (x − y) değerini bölen değil çarpan gibi kullandı. Doğrusu: x + y, çarpımın (24) çarpanlardan birine (4) bölünmesiyle bulunur."},"D":{"ad":"İşlem Seçimi Tuzağı","metin":"Öğrenci a² − b² = (a − b)(a + b) çarpım özdeşliğini, çıkarma işlemiyle karıştırıp 24 − 4 = 20 hesapladı. Doğrusu: Özdeşlik çarpımdır, çıkarma ile kurulamaz."},"A":{"ad":"Taraf Karıştırma Tuzağı","metin":"Öğrenci x − y için verilen 4 değerini, hiç işlem yapmadan x + y\u0027nin cevabı sandı. Doğrusu: x − y ile x + y ayrı büyüklüklerdir, özdeşlik kurulmadan biri diğerinin yerine yazılamaz."}},"celdiriciYol":{"C":"24/4 = 6, sonra 6 + 4 = 10 (sonuca farkı tekrar ekleme)","E":"24 × 4 = 96 (bölme yerine çarpma yapma)","D":"24 − 4 = 20 (çarpım özdeşliğini çıkarma işlemiyle kurma)","A":"x − y = 4 değeri doğrudan cevap olarak yazıldı = 4 (taraf karıştırma)"},"hap":"a² − b² = (a − b)(a + b) özdeşliğinde bilinen iki değerden üçüncüsü, çarpımın bilinen çarpana bölünmesiyle bulunur.","teshis":{"C":{"gercek":"Özdeşlikten çıkan x + y = 6 nihai sonuçtur; kullanılan veriler tekrar eklenmez.","ayirt":"Kullandığım her sayıyı yalnızca bir kez mi işleme kattım?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Sadeleştirme Adımları","yanilgi":"Doğru sonucu bulduktan sonra elde kalan bir sayıyı (x − y) tekrar işleme katmazsam sonucun \u0027eksik\u0027 kalacağını düşünüyorsun."},"E":{"gercek":"24, (x − y) ile (x + y)\u0027nin çarpımıdır; x + y\u0027yi bulmak için 24, bilinen çarpan olan 4\u0027e bölünür.","ayirt":"Bilinen değeri çarpan olarak bölmede mi kullandım, yoksa yanlışlıkla tekrar çarptım mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Sadeleştirme ve Bölme","yanilgi":"Bilinen çarpanı (x − y = 4), çarpımı bulmak için değil, çarpımla çarpılacak bir sayı gibi kullanıyorsun."},"A":{"gercek":"x − y ve x + y birbirinden bağımsız iki büyüklüktür; aralarındaki bağ ancak a² − b² = (a − b)(a + b) özdeşliği kurulunca ortaya çıkar.","ayirt":"Sorulan büyüklük ile bana verilen büyüklük aynı sembol mü, farklı mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Özdeşlikler","yanilgi":"x − y ile x + y\u0027nin aynı büyüklük olduğunu, birinin verilmesinin diğerini de verdiğini düşünüyorsun."},"D":{"gercek":"a² − b² = (a − b)(a + b) bir çarpımdır; 24 değeri 4 ile x + y\u0027nin çarpımı olarak kurulur, çıkarma ile değil.","ayirt":"Özdeşliğin sağ tarafı çarpım mı, çıkarma mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Özdeşlikler","yanilgi":"a² − b² özdeşliğinin bir çıkarma işlemi olduğunu, (a − b) ile (a + b)\u0027nin çarpılmadan doğrudan birbirinden çıkarılabileceğini sanıyorsun."},"B":{"gercek":"a² − b² = (a − b)(a + b) özdeşliğinde 24 = 4 × (x + y) kurulur, x + y = 24/4 = 6 bulunur.","ayirt":"Çarpım özdeşliğini doğru kurup bölme işlemiyle mi sonuca gittim?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - a² − b² Özdeşliği","yanilgi":"Bu şıkkı eleyen öğrenci, özdeşliği kurmadan iki veriyi rastgele toplayıp/çıkarıp daha büyük bir sayı bulmayı \u0027daha güvenli\u0027 sanır."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 12"},"kural":"","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 12","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Toplam veya fark kareleri (x±y)² gördüğünde mutlaka ortadaki 2ab terimini yaz, atlama.","konu":"çarpanlara ayırma sadelestirme","tablo":{"satirlar":[["VERİLENLER","-"],["x-y","6"],["x²-y²","60"],["HESAP","-"],["X+y (60/6)","10"],["X (denklem sistemi)","8"],["Y (denklem sistemi)","2"],["X²+y² (64+4)","68"]],"basliklar":["Adım","Değer"]},"siklar":{"C":"64","E":"100","A":"10","D":"68","B":"36"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"x = 8 ve y = 2\u0027yi doğru bulup x² = 64 hesaplar ama y² = 4\u0027ü eklemeyi unutarak yalnız 64 seçer.","E":"(x + y)² = 100 ifadesi x² + y²\u0027ye eşit değildir; +2xy terimini katıp x² + y² = 100 sanır.","A":"x + y = 10 değerini doğru bulur ama bu yalnız ara adımdır; sorunun istediği x² + y² toplamını hesaplamadan durur.","B":"(x − y)² = 36 ifadesi x² + y²\u0027ye eşit değildir; −2xy terimini gözardı ederek x² + y² = 36 sanır."},"dogru":"x² − y² = (x − y)(x + y) özdeşliğiyle x + y = 10 bulunur. Sonra x − y = 6 ve x + y = 10\u0027u çözüp x = 8, y = 2 çıkar. x² + y² = 64 + 4 = 68.","sinav":"Çarpanlara Ayırma ve Özdeşlikler: a² − b² = (a − b)(a + b) özdeşliği kullanılarak verilen denklemler çözülür.","kavramlar":[{"kaynak":"TEORI","tanim":"Toplam veya fark durumundaki cebirsel ifadeyi çarpım biçimine dönüştürme işlemidir; denklem çözme ve sadeleştirmede kullanılır.","ad":"Çarpanlara Ayırma"},{"kaynak":"TEORI","tanim":"İki kare farkı a² − b² = (a − b)(a + b) biçiminde yazılabilir; bu özdeşlik çarpanlara ayırma yöntemlerinin temelini oluşturur.","ad":"Fark Özdeşliği"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Adım","Değer"],"satirlar":[["a+b (45/5)","9"],["a (denklem sistemi)","7"],["b (denklem sistemi)","2"],["a²+b² (49+4)","53"]]},"tur":"tablo","soru":"Gerçel sayılarda a ve b için a − b = 5 ve a² − b² = 45 olduğuna göre, a² + b² toplamı kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve a² + b² toplamının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Gerçel sayılarda x ve y için x − y = 6 ve x² − y² = 60 olduğuna göre, x² + y² toplamı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-32","verilenler":[{"deger":"6","anlam":"İki bilinmeyenin farkı, denklem sisteminde x ve y\u0027yi ayrı ayrı bulmak için kullanılır","ad":"x-y"},{"deger":"60","anlam":"Fark özdeşliği ile çarpanlarına ayrılıp x+y değerini bulmak için kullanılır","ad":"x²-y²"}],"dayanak":"Çarpanlara ayırma - fark özdeşliği ve tam kare özdeşliği (TESMER SGS Matematik-İstatistik Ders Notu)","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: x − y = 6 (soruda verilen); x² − y² = 60 (soruda verilen)","anlatim":"Soru bize şunları vermiş: x eksi y altı, x kare eksi y kare de altmış. İkisini kullanarak x kare artı y kareyi bulacağız.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"x + y = (x² − y²) / (x − y) = 60 (soruda verilen) / 6 (soruda verilen) = 10","anlatim":"x² − y² aslında (x−y) çarpı (x+y) demektir - iki kare farkı böyle çarpanlarına ayrılır. Bunu bilmek x+y\u0027yi bulmamızı sağlar.","doldur":[]},{"formul":"x = (x − y) + (x + y) 2 = 6 (soruda verilen) + 10 (1. adımda bulduk) 2 = 8","anlatim":"Şimdi elimizde x−y=6 ve x+y=10 var, iki denklemi taraf tarafa toplayarak x\u0027i buluyoruz. Toplarken y\u0027ler birbirini götürür, sadece 2x kalır.","doldur":[[5,1],[6,1]]},{"formul":"y = (x + y) − (x − y) 2 = 10 (1. adımda bulduk) − 6 (soruda verilen) 2 = 2","anlatim":"y\u0027yi bulmak için de aynı iki denklemi taraf tarafa çıkarıyoruz, bu sefer x\u0027ler gider. Çıkarınca 2y kalır, ikiye bölünce y çıkar.","doldur":[]},{"formul":"x² + y² = 8² (2. adımda bulduk) + 2² (3. adımda bulduk) = 64 + 4 = 68","anlatim":"x ve y\u0027yi tek tek bulduk, şimdi kareleyip toplayarak istenen sonucu çıkarıyoruz. Dikkat: x²+y², (x+y)²\u0027den farklıdır, karıştırma.","doldur":[[7,1]]},{"formul":"Sonuç: x² + y² = 68","anlatim":"Sonuç: x kare artı y kare altmış sekiz çıkıyor. Bütün işlem iki denklemi toplayıp çıkarma mantığına dayanıyordu.","doldur":[]},{"formul":"Ters durum: y − x = 6 olsaydı → x = 2, y = 8, x² + y² yine 68","anlatim":"Ters durum: x−y yerine y−x altı verilseydi, x+y hesabı yine aynı kalırdı ama x ile y\u0027nin değerleri yer değiştirirdi. Kare toplamı yine 68 çıkar çünkü kare işareti yutar.","doldur":[]},{"formul":"Yanlış yol: (x + y)² = 10² = 100 (HATALI) → doğrusu x² + y² = 68 (5. adımda bulduk)","anlatim":"En sık hata: (x+y)² ile x²+y²\u0027yi karıştırıp 10²=100\u0027ü cevap sanmak. Oysa (x+y)²=x²+2xy+y² olduğundan araya 2xy girer, direkt eşit değildir.","doldur":[]}],"anahtar":[{"ornek":"çıkarıyoruz","kok":"çıkarı"},{"ornek":"denklemi","kok":"denkle"},{"ornek":"toplayarak","kok":"toplay"},{"ornek":"çarpanlara","kok":"çarpan"},{"ornek":"karıştırma","kok":"karışt"},{"ornek":"tarafa","kok":"tarafa"}],"konuGiris":{"harita":"Ne zaman test edilir: iki bilinmeyenli ifadeler karesel farkla verildiğinde test edilir. Nasıl ölçülür: a²−b²=(a−b)(a+b) özdeşliğinin doğru kurulup kurulmadığına bakılarak ölçülür. Nasıl kaydedilir: bulunan x+y ve x−y değerleri üzerinden x²+y² adım adım hesaplanarak sonuca ulaşılır.","desen":"Sınav genelde x−y ve x²−y² verip x²+y² veya x+y istemek şeklinde kurulur. Tuzak, öğrencinin a²+b² ifadesini gerçel sayılarda çarpanlarına ayırmaya çalışmasıdır, oysa yalnız a²−b² ayrılır. Bu soru özdeşlik uygulama ve ara adım hesaplama noktasından geliyor, arşivde bir dönem çıkmıştır.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"iki ifadenin her zaman eşit olduğu cebirsel kural","ad":"özdeşlik","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"bir ifadeyi çarpım biçiminde oluşturan alt ifade","ad":"çarpan","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"karesel fark ile fark ifadesinden elde edilen ara değer","ad":"x+y toplamı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"x+y ve x−y değerlerinden türetilen sonuç ifadesi","ad":"x²+y² toplamı","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"x−y ve x²−y² değerleri verilip x²+y² toplamı istenir.","panel_ornek":"İkinci el bir telefonun fiyat farkı ile toplam fiyatı arasında bağlantı kurman istenebilir: mesela iki telefonun fiyat farkı 3 lira, fiyatlarının karesel farkı 30 birim olsun. Bu iki bilgiden toplamlarını, sonra kareler toplamını bulabilirsin. Aynı mantık burada x ve y için kullanılıyor.","ornek":"İkinci el bir telefonun fiyat farkı ile toplam fiyatı arasında bağlantı kurman istenebilir: mesela iki telefonun fiyat farkı 3 lira, fiyatlarının karesel farkı 30 birim olsun. Bu iki bilgiden toplamlarını, sonra kareler toplamını bulabilirsin. Aynı mantık burada x ve y için kullanılıyor.","yontemler":"Önce x²−y²=(x−y)(x+y) özdeşliği kurulup x+y bulunur, sonra x−y ve x+y\u0027den x ile y ayrı ayrı elde edilip kareleri toplanır.","nedir":"Çarpanlara ayırma, bir ifadeyi toplam yerine çarpım biçiminde yazma yöntemidir. Sınav, öğrencinin özdeşlikleri tanıyıp doğru sadeleştirme yapabildiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Eksik Toplama Tuzağı","metin":"x + y = 10 ve x − y = 6 denklemleri toplanıp çıkarılarak x = 8, y = 2 bulunur; burada x² = 64 hesaplanıp y² = 4\u0027ün eklenmesi unutulmuştur. Doğrusu: her iki karenin toplamı alınmalıdır."},"E":{"ad":"Fazla Kare Açılımı Tuzağı","metin":"(x + y)² = x² + 2xy + y² olduğundan (x + y)² = 100 ifadesi x² + y² değildir, aradaki +2xy terimi fazladan katılmıştır. Doğrusu: x² + y² toplamı x ve y ayrı ayrı bulunarak hesaplanmalıdır."},"A":{"ad":"Ara Sonucu Cevap Sanma Tuzağı","metin":"x² − y² = 60 ifadesini (x − y)(x + y) çarpanına ayırıp x + y = 60/6 = 10 bulmak doğrudur, ama bu yalnız ara adımdır; soru x² + y² toplamını ister, x + y\u0027yi değil. Doğrusu: x + y bulunduktan sonra x ve y ayrı ayrı çözülüp kareleri toplanmalıdır."},"B":{"ad":"Eksik Kare Açılımı Tuzağı","metin":"(x − y)² = x² − 2xy + y² olduğundan (x − y)² = 36 ifadesi x² + y² değildir, aradaki −2xy terimi atlanmıştır. Doğrusu: x² + y² bulmak için önce xy değeri hesaba katılmalıdır."}},"celdiriciYol":{"C":"x+y=10, x-y=6 → x=8 → x²=64 (y²=4\u0027ü eklemeyi unutma)","E":"(x+y)² = 10² = 100 (x²+y²\u0027yi (x+y)² sanma, +2xy terimini fazladan katma)","A":"x² - y² = (x-y)(x+y) → 60 = 6·(x+y) → x+y = 10 (ara sonucu nihai cevap sanma)","B":"(x-y)² = 6² = 36 (x²+y²\u0027yi (x-y)² sanma, -2xy terimini atlama)"},"hap":"x²+y² değerini bulmak için x²-y² ve x-y bilgisinden önce x+y çarpanlara ayırmayla bulunur, sonra x ve y ayrı ayrı çözülüp kareleri toplanır.","teshis":{"C":{"gercek":"Soru x² + y² toplamını istiyor; x=8, y=2 bulunduktan sonra ikisinin karesi ayrı ayrı hesaplanıp toplanmalıdır.","ayirt":"İstenen ifadedeki her terimi hesapladım mı, yoksa yarıda mı bıraktım?","paragraf":"Denklem sistemi çözümü - toplama işlemi","yanilgi":"x\u0027i bulunca ve karesini alınca işin bittiğini, y²\u0027yi eklemeyi unutuyorsun."},"E":{"gercek":"(x+y)² = x² + 2xy + y²\u0027dir; ortadaki +2xy terimi tam kare özdeşliğinin bir parçasıdır ve fazladan sayılamaz.","ayirt":"Tam kare açılımını yazarken ortadaki çift terimi (2ab) gösterdim mi?","paragraf":"Tam kare özdeşliği a² ± 2ab + b²","yanilgi":"(x+y)²\u0027nin doğrudan x²+y²\u0027ye eşit olduğunu sanıyorsun."},"A":{"gercek":"Çarpanlara ayırma yöntemiyle x+y bulmak yalnız bir ara adımdır; sonraki adımda x ve y\u0027nin kendisi bulunmalıdır.","ayirt":"Soru kökünde tam olarak hangi ifade isteniyor, ben onu mu buldum?","paragraf":"Fark özdeşliği - ortak çarpan yöntemi","yanilgi":"x+y\u0027yi bulunca işin bittiğini, sorunun onu istediğini sanıyorsun."},"D":{"gercek":"x²-y²=(x-y)(x+y) özdeşliğiyle x+y=10 bulunur; x-y=6 ile birlikte çözülünce x=8, y=2 çıkar; x²+y²=64+4=68.","ayirt":"Fark özdeşliğinden sonra denklem sistemini çözüp asıl istenen toplamı hesapladım mı?","paragraf":"Fark özdeşliği a²-b²=(a-b)(a+b)","yanilgi":"Bu şıkkı eleyen öğrenci genelde ara adımı (x+y) bulduktan sonra x ve y\u0027yi ayrı ayrı çözmeyi gereksiz sanır."},"B":{"gercek":"(x-y)² = x² - 2xy + y²\u0027dir; ortadaki -2xy terimi tam kare özdeşliğinin bir parçasıdır ve atlanamaz.","ayirt":"Tam kare açılımını yazarken ortadaki çift terimi (2ab) gösterdim mi?","paragraf":"Tam kare özdeşliği a² ∓ 2ab + b²","yanilgi":"(x-y)²\u0027nin doğrudan x²+y²\u0027ye eşit olduğunu sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{"100":{"ad":"Kasa","tanim":"Bu hesap, işletmenin elinde bulunan ulusal ve yabancı paraların TL. karşılığının izlenmesi için kullanılır. İşleyişi : Tahsil olunan para tutarları borç, ödemeler ve bankaya yatırılan para tutarları alacak kaydedilir. Hesap daima borç bakiyesi verir veya sıfır olur. Hiçbir şekilde alacak bakiyesi vermez."}}},{"capa":{"kaynak":"SGS 2025/3 Soru 10"},"kural":"3f(x)+2f(-x)=P(x) türü simetrik denklemde x yerine -x yazılarak ikinci denklem kurulur, iki denklem birlikte çözülerek f(x) bulunur; f(x)=a denkleminin kökler toplamı ise çarpanlara ayırmadan Vieta ile -b/a\u0027dır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 10","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Toplam sorulan sorularda kökleri tek tek bulmaya gerek yok; f(x) bulunduktan sonra doğrudan -b/a hesaplanır.","konu":"fonksiyon denklemi","tablo":{"satirlar":[["VERİLENLER","-"],["f(x) katsayısı","3"],["f(-x) katsayısı","2"],["sağ taraf ifadesi","5x² + 10x + 15"],["hedef değer","3"],["HESAP","-"],["X yerine -x yazılan denklem","3f(-x)+2f(x)=5x²-10x+15"],["3*(1.denklem)-2*(2.denklem)","5f(x)=5x²+50x+15"],["F(x) kuralı","F(x)=x²+10x+3"],["F(x)=3 denklemi","X²+10x=0"],["Köklerin toplamı (Vieta -b/a)","-10"]],"basliklar":["Adım","İşlem"]},"siklar":{"C":"-2","E":"10","A":"-10","D":"0","B":"-3"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"f(−x) = f(x) (çift fonksiyon) varsayılarak ikinci denklem yazılmamış, f(x) = x² + 2x + 3 bulunmuş; oysa x yerine −x yazarak gerçek ikinci denklem kurulmalıdır.","E":"Kökler toplamı formülünde eksi işareti atılarak b/a = −10 yerine b/a = 10 yazılmış; −b/a = −10 doğru cevaptır.","D":"x² + 10x = 0 denkleminin köklerin çarpımı (0/1 = 0) hesaplanmış; soruda toplam istenmektedir.","B":"Vieta formülünde sabit terim kullanılarak −c/a = −3/1 = −3 alınmış; oysa kökler toplamı x\u0027in katsayısından −b/a = −10/1 = −10 olmalıdır."},"dogru":"Verilen denklemde x yerine −x yazarak ikinci bir denklem oluştur. İki denklemi birlikte çözerek f(x) = x² + 10x + 3 bulursun. f(x) = 3 olduğunda x² + 10x = 0 çıkar ve köklerin toplamı Vieta formülüyle −10 olur.","sinav":"Simetrik fonksiyon denklemlerinde x yerine −x yazılarak ikinci denklem kurulur, iki denklem birlikte çözülerek f(x) bulunur; f(x) = a denkleminin kökler toplamı Vieta formülüyle −b/a\u0027dır.","kavramlar":[{"kaynak":"TEORI","tanim":"f(x) ve f(−x) içeren fonksiyonel ilişkide x yerine −x yazılarak ikinci denklem üretilir ve iki denklem birlikte çözülerek f(x) bulunur.","ad":"Simetrik fonksiyon denklemi"},{"kaynak":"TEORI","tanim":"İkinci derece denklemde köklerin toplamı −b/a, çarpımı c/a\u0027dır.","ad":"Vieta formülü"},{"kaynak":"TEORI","tanim":"f(x) = a biçiminde yazılan denklemde x değerleri çözülür; birden çok çözüm (kök) olabilir.","ad":"Fonksiyon denklemi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Adım","İşlem"],"satirlar":[["X yerine -x yazılan denklem","4f(-x)+3f(x)=7x²-14x+21"],["4*(1.denklem)-3*(2.denklem)","7f(x)=7x²+98x+21"],["F(x) kuralı","F(x)=x²+14x+3"],["F(x)=7 denklemi","X²+14x-4=0"],["Köklerin çarpımı (Vieta c/a)","-4"]]},"tur":"tablo","soru":"f fonksiyonu tüm gerçel x değerleri için 4f(x) + 3f(-x) = 7x² + 14x + 21 eşitliğini sağlamaktadır. Buna göre f(x) = 7 denklemini sağlayan x değerlerinin çarpımı kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve f(x)=7 denkleminin köklerinin çarpımını bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f fonksiyonu tüm gerçel x değerleri için 3f(x) + 2f(-x) = 5x² + 10x + 15 eşitliğini sağlamaktadır. Buna göre f(x) = 3 denklemini sağlayan x değerlerinin toplamı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-30","verilenler":[{"deger":"3","anlam":"Verilen denklemde f(x) teriminin katsayısı; ikinci denklemle birlikte f(x)\u0027i elde etmek için kullanılır.","ad":"f(x) katsayısı"},{"deger":"2","anlam":"Verilen denklemde f(-x) teriminin katsayısı; x yerine -x yazılan ikinci denklemle birlikte kullanılır.","ad":"f(-x) katsayısı"},{"deger":"5x² + 10x + 15","anlam":"Denklemin sağ tarafı; x yerine -x yazılınca 5x²-10x+15\u0027e döner, f(x) kuralını bulmak için gerekli.","ad":"sağ taraf ifadesi"},{"deger":"3","anlam":"f(x)=3 denklemindeki değer; bulunan f(x) kuralı bu değere eşitlenerek x\u0027ler bulunur.","ad":"hedef değer"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu, fonksiyon denklemi - simetrik ilişkiler ve Vieta bağıntıları","dogru":"A","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: 3f(x) + 2f(-x) = 5x² + 10x + 15 (soruda verilen); istenen: f(x) = 3 köklerinin toplamı","anlatim":"Soru bize şunları vermiş: 3f(x) + 2f(-x) = 5x² + 10x + 15 eşitliği bütün gerçel x\u0027ler için doğru (soruda verilen). İstenen: f(x) = 3 denklemini sağlayan x değerlerinin toplamı.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"f(x) burada kuralını bilmediğimiz bir fonksiyon, elimizde sadece f(x) ile f(-x)\u0027i birbirine bağlayan bir den…","anlatim":"f(x) burada kuralını bilmediğimiz bir fonksiyon, elimizde sadece f(x) ile f(-x)\u0027i birbirine bağlayan bir denklem var. Böyle sorularda x yerine -x yazıp ikinci bir denklem daha üretiriz, çünkü iki bilinmeyenimiz (f(x), f(-x)) var, iki denklem gerekir.","doldur":[[6,1],[8,1]]},{"formul":"x yerine -x → 3f(-x) + 2f(x) = 5(-x)² + 10(-x) + 15 = 5x² − 10x + 15","anlatim":"Verilen denklemde her x yerine -x yazıyoruz, böylece f(x) ve f(-x) yer değiştiriyor. Dikkat: sağdaki 10x terimi de işaret değiştirip -10x oluyor.","doldur":[]},{"formul":"3×(1.denklem) − 2×(2.denklem) = 5f(x) = 5x² + 50x + 15","anlatim":"Şimdi iki denklemi birleştirip f(-x)\u0027i yok edeceğiz. Birinci denklemi 3 ile, ikinciyi 2 ile çarpıp çıkarırsak f(-x) terimleri birbirini götürür.","doldur":[[7,1],[9,1]]},{"formul":"x² terimi = 5x² / 5 = x²","anlatim":"5f(x)\u0027i f(x)\u0027e çevirmek için her terimi ayrı ayrı 5\u0027e böleriz, tek seferde bölmek yerine terim terim gidiyoruz ki hata olmasın. Önce x² teriminden başlıyoruz.","doldur":[]},{"formul":"x terimi = 50x / 5 = 10x","anlatim":"Şimdi x\u0027li terimi 5\u0027e bölüyoruz. Bu bize f(x) kuralındaki orta terimi verecek.","doldur":[]},{"formul":"sabit terim = 15 / 5 = 3","anlatim":"Son olarak sabit terimi 5\u0027e bölüyoruz. Böylece f(x) kuralının üç parçası da hazır oldu.","doldur":[]},{"formul":"f(x) = x² terimi + x terimi + sabit terim = x² (5. adımda bulduk) + 10x (6. adımda bulduk) + 3 (7. adımda bulduk) = x² + 10x + 3","anlatim":"Üç terimi bir araya toplayınca f(x)\u0027in gerçek kuralını buluyoruz. Artık f(x)\u0027i x cinsinden biliyoruz, dilediğimiz x için değerini hesaplayabiliriz.","doldur":[]},{"formul":"f(x) = 3 → x² + 10x + 3 (8. adımda bulduk) = 3 → x² + 10x = 0","anlatim":"f(x) = 3 denklemini kurmak için bulduğumuz kuralı 3\u0027e eşitliyoruz. Sağdaki 3\u0027ler sadeleşince ikinci dereceden denklem sadeleşiyor.","doldur":[]},{"formul":"Köklerin toplamı = büyük olan: kullanma, direkt −b / a = −10 (3. adımda bulduk katsayı) / 1 = −10","anlatim":"x² + 10x = 0 denkleminin köklerini çarpanlara ayırmadan bulmak için Vieta kullanıyoruz: ax² + bx + c = 0 formunda köklerin toplamı -b/a\u0027dır. Burada c = 0 olsa da formül aynı çalışır.","doldur":[[10,1]]},{"formul":"Ters durum: x² katsayısı a ≠ 1 olsaydı → toplam = −b / a (a\u0027yı unutma)","anlatim":"Eğer x² teriminin katsayısı 1 olmasaydı, yine −b/a formülünü kullanırdık ama a\u0027yı bölüme mutlaka katardık. Bu, katsayı 1 değilken en çok unutulan noktadır.","doldur":[]},{"formul":"Yanlış yol: x² + 10x + 3 = 0 → toplam = −10 (HATALI çünkü denklem kurulurken 3=3 sadeleşmesi atlanmış) → doğrusu x² + 10x = 0 → toplam = −10 (10. adımda bulduk)","anlatim":"En sık hata: öğrenciler f(x)=3 denklemini x² + 10x + 3 = 0 sanıp kökler toplamını -10 yerine yanlış hesaplıyor, çünkü sağdaki 3\u0027ü sıfıra eşitlerken denklemin sağındaki 3\u0027ü unutup soldaki 3\u0027ü sıfıra taşıyorlar.","doldur":[]}],"anahtar":[{"ornek":"denklemlerde","kok":"denkle"},{"ornek":"terimi","kok":"terimi"},{"ornek":"yerine","kok":"yerine"},{"ornek":"ikinci","kok":"ikinci"},{"ornek":"kuralını","kok":"kuralı"},{"ornek":"köklerinin","kok":"kökler"}],"konuGiris":{"harita":"Hangi değer isteniyor: fonksiyonun kuralı mı yoksa belirli bir x mi sorulduğu önce ayırt edilir. Nasıl ölçülür: x yerine 0, 1, −x gibi uygun değerler yazılarak yeni bir denklem üretilip ilk denklemle birleştirilir. Nasıl kaydedilir: bulunan f(x) ifadesi istenen sabite eşitlenip çıkan köklerin tümü toplanarak yazılır.","desen":"Soru genelde f(x) ile f(-x) içeren bir ilişki verip belirli bir sabiti sağlayan x değerlerinin toplamını ister. Tuzak, tek kökle yetinip ikinci dereceden çıkan diğer kökü unutmaktır; x yerine -x yazılırken işaretlerin tamamen çevrilmesi de kritik noktadır. Bu soru fonksiyonel ilişkiden kural çıkarma ve iki kökü toplama noktasından geliyor (p.28, 1 dönem çıkmış).","terimler":[{"kaynak":"soruda verilir","tanim":"f(x) ile f(-x) veya f(1-x) arasında verilen eşitlik","ad":"fonksiyonel ilişki","kim":"soruda ilişki olarak verilir"},{"kaynak":"sen hesaplarsın","tanim":"x yerine -x yazılarak elde edilen yeni eşitlik","ad":"ikinci denklem","kim":"sen üretirsin"},{"kaynak":"sen hesaplarsın","tanim":"iki denklemin birleştirilmesiyle bulunan açık ifade","ad":"f(x) kuralı","kim":"sen hesaplarsın"},{"kaynak":"kuraldan bilinir","tanim":"f(x)=a denklemini sağlayan tüm x değerlerinin toplamı","ad":"köklerin toplamı","kim":"kuraldan bilinir"}],"sinavda":"Soruda f(x) ile f(-x) arasındaki ilişki ve f(x)\u0027in eşit olacağı sabit verilir, istenen bu sabiti sağlayan x değerlerinin toplamıdır.","panel_ornek":"Bir arkadaşın iki taksit planı var: birinde ilk ay 40 lira ikinci ay 60 lira ödeniyor, toplamları biliniyor ama tek taksit bilinmiyor. İki farklı ay bilgisini yan yana koyup ortak payı bulmak gerekir. Bu, iki denklemi birleştirip tek bilinmeyeni çözmekle aynı mantık.","ornek":"Bir arkadaşın iki taksit planı var: birinde ilk ay 40 lira ikinci ay 60 lira ödeniyor, toplamları biliniyor ama tek taksit bilinmiyor. İki farklı ay bilgisini yan yana koyup ortak payı bulmak gerekir. Bu, iki denklemi birleştirip tek bilinmeyeni çözmekle aynı mantık.","yontemler":"x yerine -x yazılarak ikinci denklem elde edilir, iki denklem birlikte çözülerek f(x) kuralı bulunur; bulunan kural verilen sabite eşitlenip kökler toplanır.","nedir":"Fonksiyon denklemi, bir kuralın bilinmeyen değerini bulmayı ya da verilen ilişkiden fonksiyonun kendisini çıkarmayı öğretir. Sınav, x yerine uygun değerler koyarak denklem kurma ve iki denklemi birlikte çözme becerini ölçer."},"olay":"x yerine -x: 3f(-x)+2f(x)=5x²-10x+15. 3*(1.denklem)-2*(2.denklem): 5f(x)=5x²+50x+15, f(x)=x²+10x+3. f(x)=3 → x²+10x=0 → toplam=-10/1.","tuzak":{"C":{"ad":"Çift Fonksiyon Varsayımı Tuzağı","metin":"f(-x)=f(x) sayılıp ikinci denklem hiç kurulmadan 5f(x)=5x²+10x+15\u0027ten f(x)=x²+2x+3 bulunmuş. Doğrusu: x yerine -x yazılarak gerçek ikinci denklem kurulmalı, f(x)=x²+10x+3 çıkar."},"E":{"ad":"Vieta İşaret Tuzağı","metin":"Toplam formülü -b/a yerine işaret unutularak b/a alınmış. Doğrusu: Kökler toplamı formülünde eksi işareti korunur, -10/1=-10 olmalıdır."},"D":{"ad":"Toplam-Çarpım Karıştırma Tuzağı","metin":"x²+10x=0 denkleminin köklerin toplamı yerine çarpımı (c/a=0/1) hesaplanmış. Doğrusu: Soruda toplam istenmektedir, -b/a=-10 alınmalıdır."},"B":{"ad":"Vieta Karıştırma Tuzağı","metin":"Kökler toplamı formülü -b/a yerine sabit terimle kurulan -c/a ifadesi kullanılmış. Doğrusu: Toplam x\u0027in katsayısından gelir, sabit terimden değil; -10/1 = -10 olmalıdır."}},"celdiriciYol":{"C":"3f(x)+2f(x)=5x²+10x+15 → 5f(x)=5x²+10x+15 → f(x)=x²+2x+3; x²+2x=0 → toplam=-2/1 = -2 (fonksiyonu çift fonksiyon sandın, ikinci denklemi kurmadın)","E":"x²+10x=0 için toplam = b/a = 10/1 = 10 (Vieta toplam formülünün işaretini unuttun)","D":"x²+10x=0 kökler çarpımı = c/a = 0/1 = 0 (toplam yerine çarpım hesapladın)","B":"f(x)=x²+10x+3 doğru bulunduktan sonra toplam = -c/a = -3/1 = -3 (toplamı sabit terimle karıştırdın)"},"hap":"f(x) ve f(-x) içeren simetrik denklemlerde x yerine -x yazılarak ikinci denklem kurulur, iki denklem birlikte çözülür; f(x)=a köklerinin toplamı Vieta ile -b/a\u0027dır.","teshis":{"C":{"gercek":"f fonksiyonunun çift olduğu belirtilmedikçe f(-x)≠f(x) varsayılamaz; simetrik ilişkilerde x yerine -x konularak ikinci bağımsız denklem kurulması zorunludur.","ayirt":"Soruda f\u0027nin çift fonksiyon olduğu ayrıca söylendi mi, yoksa ben mi varsaydım?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, fonksiyonel ilişki tipleri","yanilgi":"f(-x)\u0027i f(x) ile aynı sanıp ikinci denklemi hiç kurmadan tek denklemden f(x) çektiğini düşünüyorsun."},"E":{"gercek":"İkinci derece denklem ax²+bx+c=0 için kökler toplamı tam olarak -b/a\u0027dır, işaret formülün parçasıdır.","ayirt":"Formülde eksi işareti var mıydı, ben mi düşürdüm?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Vieta bağıntıları","yanilgi":"Kökler toplamı formülündeki eksi işaretini unutup b/a yazıyorsun."},"A":{"gercek":"İki bilinmeyenli (f(x), f(-x)) simetrik ilişkilerde x yerine -x yazılarak ikinci denklem üretilir; iki denklem birlikte çözülür, kökler toplamı ise Vieta ile -b/a\u0027dır.","ayirt":"Elimde kaç bilinmeyen, kaç denklem var; eksikse x yerine hangi değeri koymalıyım?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, fonksiyon denklemi - simetrik ilişkiler","yanilgi":"Bu şıkkı eleyen öğrenci, ikinci denklemi kurmadan tek denklemle f(x) bulunabileceğini sanır ve işi yarım bırakır."},"D":{"gercek":"Vieta bağıntılarında toplam -b/a, çarpım c/a\u0027dır; soru kökünde hangisinin istendiği (toplam/çarpım) dikkatle okunmalıdır.","ayirt":"Soru kökünde geçen kelime \u0027toplam\u0027 mı \u0027çarpım\u0027 mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Vieta bağıntıları","yanilgi":"Soru köklerin toplamını sorarken sen köklerin çarpımını hesaplıyorsun, iki kavramı karıştırıyorsun."},"B":{"gercek":"İkinci derece denklemde kökler toplamı -b/a, kökler çarpımı c/a\u0027dır; sabit terim toplamı değil çarpımı belirler.","ayirt":"Bu sayı x\u0027in katsayısından mı geliyor yoksa sabit terimden mi?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Vieta bağıntıları","yanilgi":"Kökler toplamı formülünü sabit terimle karıştırıyor, -b/a yerine -c/a yazıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 10"},"kural":"f(x)+f(2-x) tipi ilişkilerde x yerine (2-x) yazılarak ikinci denklem üretilir, iki denklem katsayılarla elenerek f(x) bulunur; ikinci dereceden denklemde kökler toplamı Vieta ile -b/a olarak verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 10","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"f(x)=a denklemi ikinci dereceden çıkarsa tek kök değil, Vieta ile kökler toplamını (-b/a) ver.","konu":"fonksiyon denklemi","tablo":{"satirlar":[["VERİLENLER","-"],["3f(x) katsayısı","3"],["2f(2-x) katsayısı","2"],["2-x ifadesindeki sabit","2"],["Sağ taraf polinomu","5x² - 6x + 31"],["Hedef değer","27"],["HESAP","-"],["X yerine (2-x) yazılır (D2)","3f(2-x)+2f(x) = 5x²-14x+39"],["Eleme: 3×D1 - 2×D2","5f(x) = 5x²+10x+15"],["F(x) kuralı","F(x) = x²+2x+3"],["F(x)=27 denklemi kurulur","X²+2x-24=0"],["Çarpanlara ayırma","(x+6)(x-4)=0 → x=-6, x=4"],["Toplam (SONUÇ)","-2"]],"basliklar":["Adım","İşlem / Sonuç"]},"siklar":{"C":"-2","E":"4","A":"-24","D":"2","B":"-6"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Vieta formülünde −b/a yerine işareti unutup b/a = 2 yazarsın; oysa kökler toplamı formülü negatif alınarak −2 olması gerekir.","E":"İkinci kökü bulup yalnızca x = 4\u0027ü cevap olarak seçersin, x = −6\u0027yı toplamaya dahil etmezsin.","A":"Kökler −6 ve 4\u0027ün çarpımını (−24) sonuç sanırsın; oysa soruda kökler toplamı isteniyor ve Vieta\u0027da toplam −b/a = −2\u0027dir.","B":"İkinci dereceden denklemden yalnızca x = −6 kökünü bulup diğer kökü (x = 4) hesaba katmadığında tam cevap vermemiş olursun."},"dogru":"Verilen ilişkide x yerine (2−x) yazarak ikinci denklem yapılır, iki denklem birlikte çözülerek f(x) = x² + 2x + 3 bulunur. f(x) = 27 denkleminden x² + 2x − 24 = 0 çıkar; iki kökün toplamı Vieta formülüyle −b/a = −2\u0027dir.","sinav":"Simetrik fonksiyon ilişkisinden f(x) kuralı bulunup f(x) = 27 denklemini sağlayan x değerlerinin toplamı Vieta formülüyle −b/a olarak hesaplanır.","kavramlar":[{"kaynak":"TEORI","tanim":"f(x) ve f(2−x) gibi ters değerleri içeren eşitlikte, x yerine (2−x) yazılarak ikinci denklem üretilir ve iki denklem birlikte çözülür.","ad":"Simetrik fonksiyon ilişkisi"},{"kaynak":"TEORI","tanim":"İkinci dereceden ax² + bx + c = 0 denkleminde köklerin toplamı −b/a, çarpımı c/a olarak hesaplanır.","ad":"Vieta formülü"},{"kaynak":"TEORI","tanim":"Bir fonksiyonun kuralı verilen ilişkiden bulunarak, o fonksiyonu sağlayan x değerleri çözülür.","ad":"Fonksiyon denklemi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1]],"tablo":{"basliklar":["Adım","İşlem / Sonuç"],"satirlar":[["X yerine (1-x) yazılır (D2)","3f(1-x)+5f(x) = 8x²-4x+38"],["Eleme: 5×D1 - 3×D2","16f(x) = 16x²-48x+96"],["F(x) kuralı","F(x) = x²-3x+6"],["F(x)=16 denklemi kurulur","x²-3x-10=0"],["Çarpanlara ayırma","(x-5)(x+2)=0 → x=5, x=-2"],["Çarpım (SONUÇ)","-10"]]},"tur":"tablo","soru":"Gerçek sayılarda tanımlı f fonksiyonu için her x değeri için 5f(x) + 3f(1-x) = 8x² - 12x + 42 eşitliği sağlanmaktadır. Buna göre, f(x) = 16 denklemini sağlayan x değerlerinin çarpımı kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve x değerlerinin çarpımının -10 olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Gerçek sayılarda tanımlı f fonksiyonu için her x değeri için 3f(x) + 2f(2-x) = 5x² - 6x + 31 eşitliği sağlanmaktadır. Buna göre, f(x) = 27 denklemini sağlayan x değerlerinin toplamı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-30","verilenler":[{"deger":"3","anlam":"f(x)\u0027in denklemdeki katsayısı; eleme yönteminde D1 ve D2\u0027nin çarpanı olarak kullanılır.","ad":"3f(x) katsayısı"},{"deger":"2","anlam":"f(2-x)\u0027in denklemdeki katsayısı; eleme yönteminde çarpan olarak kullanılır.","ad":"2f(2-x) katsayısı"},{"deger":"2","anlam":"Simetri merkezi; ikinci denklemi üretmek için x yerine (2-x) yazılır.","ad":"2-x ifadesindeki sabit"},{"deger":"5x² - 6x + 31","anlam":"D1 denkleminin sağ tarafı; x yerine (2-x) konularak D2\u0027nin sağ tarafı da bundan türetilir.","ad":"Sağ taraf polinomu"},{"deger":"27","anlam":"Bulunan f(x) kuralına eşitlenip çözülecek denklemin sağ tarafı; kökleri toplanacak x değerlerini verir.","ad":"Hedef değer"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Fonksiyon Denklemi (simetrik ilişkiler ve f(x)=a çözümü)","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: 3f(x) + 2f(2-x) = 5x² - 6x + 31 her x için geçerli (soruda verilen); f(x) = 27 denklemini sağlayan x değerleri toplamı isteniyor (soruda verilen); \u0027her x için\u0027 ifadesi x yerine (2-x) yazma stratejisinin anahtarı","anlatim":"Soru bize şunları vermiş: her x için 3f(x)+2f(2-x)=5x²-6x+31 eşitliği geçerli. Ayrıca f(x)=27 denklemini sağlayan x değerlerinin toplamı isteniyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"D2: x yerine (2-x) yazılır → 3f(2-x) + 2f(x) = 5(2-x)² - 6(2-x) + 31 = 5x² - 14x + 39","anlatim":"Fonksiyon denklemi her x için geçerli olduğundan x yerine (2-x) yazınca ikinci bir denklem çıkar. Bu yeni denklemde f(x) ve f(2-x) yer değiştirir, ikisini birlikte kullanabiliriz.","doldur":[[7,1],[10,1]]},{"formul":"5f(x) = 3×D1 - 2×D2 = 3×(5x² - 6x + 31) (soruda verilen) - 2×(5x² - 14x + 39) (2. adımda bulduk) = 5x² + 10x + 15","anlatim":"D1\u0027i 3, D2\u0027yi 2 ile çarpıp çıkarınca f(2-x) terimleri birbirini götürür. Amaç yalnız f(x) içeren bir denklem elde etmek.","doldur":[]},{"formul":"x² terimi = 5x² / 5 (3. adımda bulduk) = x²","anlatim":"5f(x) eşitliğinin sağındaki x² terimini 5\u0027e bölüyoruz. Her terim ayrı ayrı bölünmeli, aksi halde f(x) yalnız kalmaz.","doldur":[]},{"formul":"x terimi = 10x / 5 (3. adımda bulduk) = 2x","anlatim":"Aynı bölme işlemini orta terime uyguluyoruz. Terimleri tek tek bölmek karışıklığı önler.","doldur":[]},{"formul":"sabit terim = 15 / 5 (3. adımda bulduk) = 3","anlatim":"Son olarak sabit terimi 5\u0027e bölüyoruz. Bu üç bölme birleşince f(x) kuralı ortaya çıkacak.","doldur":[[9,1]]},{"formul":"f(x) = x² (4. adımda bulduk) + 2x (5. adımda bulduk) + 3 (6. adımda bulduk) = x² + 2x + 3","anlatim":"Üç ayrı bölme sonucunu topluyoruz, f(x)\u0027in kuralı böyle ortaya çıkıyor. Artık f(x)=27 denklemini bu ifadeyle kurabiliriz.","doldur":[]},{"formul":"f(x) = 27 → x² + 2x + 3 (7. adımda bulduk) = 27 → x² + 2x - 24 = 0","anlatim":"f(x) kuralını 27\u0027ye eşitleyip ikinci dereceden denklem kuruyoruz. Şimdi bu denklemin köklerini bulmamız gerekiyor.","doldur":[]},{"formul":"x² + 2x - 24 = 0 → (x+6)(x-4) = 0 (8. adımda bulduk) → x = -6, x = 4","anlatim":"Denklemi çarpanlarına ayırınca iki kök çıkıyor. Çarpımlardan biri sıfır olursa denklem sağlanır, kökler bunlar.","doldur":[]},{"formul":"Kökler toplamı = -6 (9. adımda bulduk) + 4 (9. adımda bulduk) = -2","anlatim":"İki kökü toplayınca istenen sonuca ulaşıyoruz. Vieta ile de -b/a = -2/1 aynı sonucu verir, doğrulanmış olur.","doldur":[[12,1]]},{"formul":"Ters durum: kökler çarpımı sorulsaydı → c/a = -24 / 1 = -24","anlatim":"Toplam istenirse -b/a, çarpım istenirse c/a kullanılır. İkisini karıştırmak en büyük tuzaktır.","doldur":[]},{"formul":"Yanlış yol: D2\u0027yi kurmadan direkt 3f(x)+2f(2-x)=27 yazıp x çözmek = çözümsüz (HATALI) → doğrusu önce f(x) kuralını bulup 27\u0027ye eşitlemek (7. adımda bulduk)","anlatim":"Öğrenciler f(2-x) terimini yok sayıp direkt x çözmeye kalkışır, bu yürümez. Önce f(x)\u0027in genel kuralını bulmak şart.","doldur":[]}],"anahtar":[{"ornek":"denklemlerinde","kok":"denkle"},{"ornek":"kuralı","kok":"kuralı"},{"ornek":"ikinci","kok":"ikinci"},{"ornek":"yerine","kok":"yerine"},{"ornek":"isteniyor","kok":"isteni"},{"ornek":"kökler","kok":"kökler"}],"konuGiris":{"harita":"Ne zaman test edilir: fonksiyonun kuralı yerine iki değişken arasında ilişki verildiğinde test edilir. Nasıl ölçülür: x yerine uygun ifadeler (1−x, −x gibi) koyup ikinci bir denklem üretme ve iki denklemi birlikte çözme becerisiyle ölçülür. Nasıl kaydedilir: bulunan f(x) kuralı ya da x kökleri, istenen toplam/çarpım şeklinde tek sayıya indirilerek kaydedilir.","desen":"Soru genelde f(x) ve f(2−x) gibi simetrik iki terimi birlikte verip kuralı gizler; öğrenci x yerine (2−x) yazarak ikinci denklemi üretmeyi atlarsa çözemez. İkinci tuzak, f(x)=a denkleminin iki kök verdiğini fark etmemektir; sadece bir kökü yazmak yanlış sonuca götürür. Bu soru p.28\u0027deki simetrik ilişki ve iki kök tuzağı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"iki farklı girdideki fonksiyon değerlerini birbirine bağlayan eşitlik","ad":"fonksiyonel ilişki","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"x yerine (1−x) veya (−x) koyarak elde edilen yeni eşitlik","ad":"ikinci denklem üretme","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"fonksiyon kuralının belirli bir değere eşitlenmesiyle bulunan x değerleri","ad":"f(x)=a kökleri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"ikinci derece denklemde bulunan tüm x çözümlerinin toplamı","ad":"kökler toplamı","kim":"kanun sabitler"}],"sinavda":"Soruda iki değişkenli bir fonksiyonel eşitlik verilir, istenen ise belirli bir değeri sağlayan x değerlerinin toplamıdır.","panel_ornek":"Bir kargo firması, gönderdiğin paketin fiyatını hem ağırlığına hem de tersten bakılan ağırlığına göre birlikte hesaplıyor. Sana \u0027toplam ücret 40 lira\u0027 deniyor ama ağırlığı direkt söylemiyor, iki farklı denklemi birleştirip bulman gerekiyor. Küçük bir örnekte ağırlık 3 kg çıkabiliyor, bir başka pakette 5 kg.","ornek":"Bir kargo firması, gönderdiğin paketin fiyatını hem ağırlığına hem de tersten bakılan ağırlığına göre birlikte hesaplıyor. Sana \u0027toplam ücret 40 lira\u0027 deniyor ama ağırlığı direkt söylemiyor, iki farklı denklemi birleştirip bulman gerekiyor. Küçük bir örnekte ağırlık 3 kg çıkabiliyor, bir başka pakette 5 kg.","yontemler":"x yerine (2−x) yazılarak elde edilen ikinci denklemle birlikte iki bilinmeyenli sistem çözülür. Bulunan kural a değerine eşitlenip çıkan iki kök toplanır.","nedir":"Fonksiyon denklemi, bir fonksiyonun farklı girdilerdeki değerleri arasındaki bağlantıyı ifade eder. Sınav, bu bağlantıdan yeni denklemler üretip bilinmeyeni bulma becerini ölçer."},"olay":"D1: 3f(x)+2f(2-x)=5x²-6x+31; x yerine (2-x): D2: 3f(2-x)+2f(x)=5(2-x)²-6(2-x)+31=5x²-14x+39; 3×D1-2×D2 → 5f(x)=5x²+10x+15 → f(x)=x²+2x+3; f(x)=27 → x²+2x-24=0 → (x+6)(x-4)=0 → x=-6, x=4; toplam=-6+4=-2.","tuzak":{"D":{"ad":"İşaret Tuzağı","metin":"Vieta formülünde -b/a yerine işareti unutup b/a = 2/1 = 2 yazarsın. Doğrusu: kökler toplamı formülü -b/a\u0027dır, ikinci dereceden terimin katsayısı negatif alınır."},"E":{"ad":"Tek Kök Tuzağı","metin":"x²+2x-24=0 denkleminde yalnızca x=4 kökünü bulup diğer kökü (x=-6) hesaba katmadan cevap verirsin. Doğrusu: iki kök de bulunup toplanmalıdır, sonuç -2\u0027dir."},"A":{"ad":"Çarpım-Toplam Tuzağı","metin":"Kökler -6 ve 4\u0027ün çarpımı olan c/a = -24 değerini, sorunun istediği kökler toplamı sanırsın. Doğrusu: istenen c/a değil -b/a\u0027dır, yani toplam -2\u0027dir."},"B":{"ad":"Tek Kök Tuzağı","metin":"x²+2x-24=0 denklemini çarpanlarına ayırıp yalnızca x=-6 kökünü bulup soruyu bitirirsin. Doğrusu: ikinci dereceden denklemin iki kökü vardır, ikisi de toplama dahil edilir."}},"celdiriciYol":{"D":"-b/a yerine b/a = 2/1 = 2 (Vieta toplam formülünde işaret hatası)","E":"x-4=0 → x=4 (yalnız bir kökü yazma)","A":"(-6) × 4 = -24 (kökler çarpımını toplam sanma)","B":"x+6=0 → x=-6 (yalnız bir kökü yazma)"},"hap":"f(x)+f(sabit-x) tipi simetrik fonksiyon denklemlerinde x yerine (sabit-x) yazılıp ikinci denklem üretilir, iki denklem katsayılarla elenerek f(x) kuralı bulunur.","teshis":{"C":{"gercek":"3f(x)+2f(2-x)=P(x) ilişkisinde x yerine (2-x) yazılıp ikinci denklem elde edilir, iki denklem katsayılarla (3×D1-2×D2) elenerek f(x) izole edilir.","ayirt":"İkinci denklemi (x yerine 2-x yazarak) ürettim mi, katsayılarla eleme yaptım mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Fonksiyon Denklemi, tip (3) simetrik ilişkiler","yanilgi":"Bu şıkkı eleyen öğrenci, iki denklemi katsayılarla elemeden tek denklemden f(x)\u0027i bulmaya çalıştığı için doğru kurala ulaşamaz."},"E":{"gercek":"f(x)=a ikinci dereceden bir denkleme indirgeniyorsa iki kök vardır; soru toplamı istiyorsa ikisi de kullanılır.","ayirt":"Bu denklemin kaç kökü var, ikisini de buldum mu?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Fonksiyon Denklemi, sınav tuzağı (1)","yanilgi":"Diğer kökü bulduktan sonra ilk kökü unutup yalnızca son bulduğun kökü cevap yazıyorsun."},"A":{"gercek":"Vieta bağıntılarında kökler toplamı -b/a, kökler çarpımı c/a\u0027dır; bunlar farklı formüllerdir.","ayirt":"Sorulan şey kökler toplamı mı çarpımı mı, hangi formülü kullandım?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Fonksiyon Denklemi, Vieta bağıntıları","yanilgi":"Kökler çarpımı ile kökler toplamını aynı şey sanıyorsun, ikinci dereceden denklemde c/a\u0027yı toplam formülü zannediyorsun."},"D":{"gercek":"ax²+bx+c=0 denkleminde kökler toplamı -b/a\u0027dır, işaret formülün parçasıdır ve atlanamaz.","ayirt":"Formülde eksi işareti var mıydı, ben onu yazdım mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Fonksiyon Denklemi, sınav tuzağı (2)","yanilgi":"Kökler toplamı formülündeki eksi işaretini unutup b/a\u0027yı doğrudan toplam sanıyorsun."},"B":{"gercek":"f(x)=a ikinci dereceden bir denkleme indirgeniyorsa iki kök vardır; soru toplamı istiyorsa ikisi de kullanılır.","ayirt":"Bu denklemin kaç kökü var, ikisini de buldum mu?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Fonksiyon Denklemi, sınav tuzağı (1)","yanilgi":"Denklemi çarpanlarına ayırıp ilk bulduğun kökü cevap sanıp ikinci kökü aramayı unutuyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 11"},"kural":"f\u0027(1)=0 ve f(1)=-2 denklemlerinden a,b bulunur, kalan kritik nokta ikinci türev testiyle sınıflandırılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 11","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Soru \u0027değer\u0027 mi \u0027apsis\u0027 mi istiyor mutlaka kontrol et; parametreli sorularda önce denklem sistemini kurup katsayıları bul, sonra ikinci kritik noktayı ara.","konu":"fonksiyon ekstremum","tablo":{"satirlar":[["VERİLENLER","-","-"],["Kritik nokta","x = 1","-"],["Minimum değer","-2","-"],["HESAP","-","-"],["Denklem 1 (f\u0027(1)=0)","3+2a+b=0","2a+b=-3"],["Denklem 2 (f(1)=-2)","1+a+b=-2","A+b=-3"],["Katsayılar","2a+b=-3 ve a+b=-3 çözümü","A=0, b=-3"],["Fonksiyon ve türev","F(x)=x³-3x, f\u0027(x)=3x²-3=0","X=-1, x=1"],["İkinci türev testi","F\u0027\u0027(-1)=6(-1)=-6\u003c0","X=-1 yerel maksimum"],["Yerel maksimum değeri","F(-1)=(-1)³-3(-1)=-1+3","2"]],"basliklar":["Adım","Hesap","Sonuç"]},"siklar":{"C":"-1","E":"2","A":"-3","D":"0","B":"-2"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Maksimumun oluştuğu x değerini (-1) fonksiyon değeriyle karıştırıyorsun; istenen f(-1)=2, yani apsis değil fonksiyon çıktısıdır.","A":"a ve b katsayılarını topladığın için (0+(-3)=-3) bunu cevap sandın; oysa soruda istenen fonksiyon değeridir, ara adımdaki katsayılar değil.","D":"Türev denklemini yanlış çarpanlayıp x=0\u0027ı buluyorsun; doğru çarpanlama 3(x-1)(x+1)=0\u0027dan x=1 ve x=-1 çıkar.","B":"Verilen minimum değeri (-2) işlem yapmadan maksimum değerimiş gibi yazıyorsun; minimum ve maksimum farklı noktalarda oluşur."},"dogru":"Önce verilen koşullardan (x=1\u0027de minimum, değer -2) fonksiyonun katsayılarını bulursun. Sonra türevini sıfırlayarak diğer kritik noktayı (x=-1) bulursun. İkinci türev testi ile x=-1\u0027de maksimum olduğunu gösterip, o noktadaki fonksiyon değerini hesaplarsın: f(-1)=2.","sinav":"Türevli fonksiyonun ekstremumu yalnız kritik noktalarda (f\u0027(x)=0) oluşur ve ikinci türev testi ile türü belirlenir.","kavramlar":[{"kaynak":"TEORI","tanim":"Türevin sıfır olduğu nokta; fonksiyonun yerel maksimum veya minimumunun olabileceği yerdir.","ad":"kritik nokta"},{"kaynak":"TEORI","tanim":"Bir noktanın civarında fonksiyonun en büyük değerini aldığı yer; ikinci türev testi ile f\u0027\u0027\u003c0 olduğunda tanımlanır.","ad":"yerel maksimum"},{"kaynak":"TEORI","tanim":"Bir noktanın civarında fonksiyonun en küçük değerini aldığı yer; ikinci türev testi ile f\u0027\u0027\u003e0 olduğunda tanımlanır.","ad":"yerel minimum"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2],[5,1],[5,2]],"tablo":{"basliklar":["Adım","Hesap","Sonuç"],"satirlar":[["Denklem 1 (f\u0027(-2)=0)","12-4a+b=0","-4a+b=-12"],["Denklem 2 (f(-2)=16)","-8+4a-2b=16","2a-b=12"],["Katsayılar","-4a+b=-12 ve 2a-b=12 çözümü","a=0, b=-12"],["Fonksiyon ve türev","f(x)=x³-12x, f\u0027(x)=3x²-12=0","x=-2, x=2"],["İkinci türev testi","f\u0027\u0027(2)=6(2)=12\u003e0","x=2 yerel minimum"],["Yerel minimum değeri","f(2)=(2)³-12(2)=8-24","-16"]]},"tur":"tablo","soru":"f(x) = x³ + ax² + bx fonksiyonu x = -2 için yerel maksimuma sahiptir ve bu maksimum değer 16\u0027dır. Buna göre f fonksiyonunun yerel minimum değeri kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve f fonksiyonunun yerel minimum değerinin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f(x) = x³ + ax² + bx fonksiyonu x = 1 için yerel minimuma sahiptir ve bu minimum değer -2\u0027dir. Buna göre f fonksiyonunun yerel maksimum değeri kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-31","verilenler":[{"deger":"x = 1","anlam":"Fonksiyonun yerel minimuma sahip olduğu nokta; f\u0027(1)=0 denklemini kurmakta kullanılır.","ad":"Kritik nokta"},{"deger":"-2","anlam":"f(1) değeridir; ikinci denklemi (1+a+b=-2) kurmakta kullanılır.","ad":"Minimum değer"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Fonksiyon Ekstremum (Birinci ve İkinci Türev Testi)","dogru":"E","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: f(x) = x³ + ax² + bx (soruda verilen); x = 1 noktasında yerel minimum (soruda verilen); yerel minimum değeri -2 (soruda verilen)","anlatim":"Soru bize fonksiyonun genel halini ve x=1\u0027deki minimum değerini vermiş. Buradan a ile b katsayılarını bulacağız.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Kural: yerel minimum ya da maksimumda f\u0027(x) = 0 olur","anlatim":"Yerel minimum, fonksiyonun o noktada teğetinin yatay olduğu bir çukur noktasıdır - türev orada sıfır olur. Bu yüzden önce f\u0027(x)\u0027i bulup x=1\u0027de sıfıra eşitleyeceğiz.","doldur":[[7,1],[7,2],[9,1],[9,2]]},{"formul":"f\u0027(x) = 3x² + 2ax + b → f\u0027(1) = 3(1)² + 2a(1) + b = 3 + 2a + b = 0 (soruda verilen x = 1 noktası kullanılır)","anlatim":"Yerel minimum x=1\u0027de olduğu için türevi orada sıfır olmalı. Bu bize a ve b arasında ilk denklemi verir.","doldur":[[4,1],[4,2],[5,1],[5,2]]},{"formul":"f(1) = (1)³ + a(1)² + b(1) = 1 + a + b = -2 (soruda verilen minimum değer -2)","anlatim":"Minimum noktadaki fonksiyon değeri -2 olarak verilmiş, bunu x=1\u0027de yerine koyarız. Bu ikinci denklemi oluşturur.","doldur":[[8,1],[8,2]]},{"formul":"2a + b = -3 (3. adımda bulduk) ve a + b = -3 (4. adımda bulduk) → a = 0, b = -3","anlatim":"İki denklemden birini diğerinden çıkarınca a değeri direkt çıkıyor. b de a=0 yerine konunca bulunur.","doldur":[]},{"formul":"f(x) birinci terim = x³ (a ve b\u0027den bağımsız, kendi terimi)","anlatim":"Fonksiyonun x³ terimi katsayısız geliyor, a ve b\u0027den etkilenmiyor. Bu terim olduğu gibi kalır.","doldur":[]},{"formul":"f(x) ikinci terim = a × x² = 0 (5. adımda bulduk) × x² = 0","anlatim":"a değeri sıfır çıktığı için bu terim tamamen yok oluyor. Fonksiyonda x² içeren kısım kalmıyor.","doldur":[]},{"formul":"f(x) üçüncü terim = b × x = -3 (5. adımda bulduk) × x = -3x","anlatim":"b değeri -3 olduğu için bu terim -3x olur. Fonksiyonun geri kalan kısmını bu oluşturur.","doldur":[]},{"formul":"f(x) = x³ (6. adımda bulduk) + 0 (7. adımda bulduk) + -3x (8. adımda bulduk) = x³ - 3x","anlatim":"Üç terimi topladığımızda fonksiyonun sayısal hali ortaya çıkıyor. Artık türev almak için hazır.","doldur":[]},{"formul":"f\u0027(x) birinci terim = türev(x³) = 3x²","anlatim":"x³ ün türevi kuvvet kuralıyla 3x² olur. Bu türevin ilk parçası.","doldur":[]},{"formul":"f\u0027(x) ikinci terim = türev(0) = 0","anlatim":"Sabitin ya da sıfır teriminin türevi sıfırdır. Bu terim türevde hiç görünmez.","doldur":[]},{"formul":"f\u0027(x) üçüncü terim = türev(-3x) = -3","anlatim":"-3x\u0027in türevi katsayısı olan -3\u0027tür. Bu türevin son parçası.","doldur":[]},{"formul":"f\u0027(x) = 3x² (10. adımda bulduk) + 0 (11. adımda bulduk) + -3 (12. adımda bulduk) = 3x² - 3 = 0 → x = -1, x = 1","anlatim":"Türevi sıfıra eşitleyip kritik noktaları buluyoruz. x=1 zaten minimumdu, x=-1 diğer kritik nokta.","doldur":[]},{"formul":"f\u0027\u0027(x) = 6x → f\u0027\u0027(-1) = 6 × (-1) = -6 \u003c 0","anlatim":"İkinci türev negatifse o nokta yerel maksimumdur. -6 negatif olduğu için x=-1 maksimum noktası.","doldur":[]},{"formul":"f(-1) birinci terim = (-1)³ = -1","anlatim":"x yerine -1 koyunca küp alınır, sonuç -1 çıkar. Bu değerin ilk parçası.","doldur":[]},{"formul":"f(-1) ikinci terim = -3 × (-1) = 3","anlatim":"-3x teriminde x yerine -1 koyunca iki eksi birbirini götürür, 3 kalır. Bu değerin ikinci parçası.","doldur":[]},{"formul":"f(-1) = -1 (15. adımda bulduk) + 3 (16. adımda bulduk) = 2","anlatim":"İki terimi toplayınca yerel maksimum değeri çıkıyor. Cevap 2\u0027dir.","doldur":[]},{"formul":"Ters durum: f\u0027\u0027(-1) \u003e 0 olsaydı → x = -1 yerel minimum olurdu","anlatim":"İkinci türev pozitif çıksaydı o nokta minimum sayılırdı, maksimum değil. İşaret her şeyi belirler.","doldur":[]},{"formul":"Yanlış yol: f(1) = -2 değerini cevap sanmak (HATALI) → doğrusu x = -1\u0027deki değer 2 (17. adımda bulduk)","anlatim":"Soru x=1\u0027deki minimum değeri değil, diğer kritik noktadaki maksimum değeri soruyor. Bu karıştırılırsa yanlış -2 cevabı verilir.","doldur":[]}],"anahtar":[{"ornek":"değeri","kok":"değeri"},{"ornek":"fonksiyona","kok":"fonksi"},{"ornek":"minimum","kok":"minimu"},{"ornek":"türevi","kok":"türevi"},{"ornek":"maksimumdur","kok":"maksim"},{"ornek":"terimi","kok":"terimi"}],"konuGiris":{"harita":"Ne zaman test edilir: f′(x)=0 yapan kritik noktalarda test edilir. Nasıl ölçülür: işaret değişimi ya da ikinci türevin işaretiyle maksimum mu minimum mu olduğu belirlenir. Nasıl kaydedilir: bulunan x değeri fonksiyona yazılarak elde edilen f(x) sonucu ekstremum değer olarak kaydedilir.","desen":"Sınav genellikle bir kübik fonksiyon verip belirli bir noktadaki ekstremum türünü ve değerini şart koşarak katsayıları buldurur, sonra diğer ekstremum değeri sorar. Tuzak, \u0027değer\u0027 ile \u0027apsis\u0027 karışıklığıdır; ayrıca f′=0 olması her zaman ekstremum garantilemez. Bu soru p.28 sınav tuzağı 1 ve 2 maddesinden geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"f′(x)=0 eşitliğini sağlayan x değeri","ad":"Kritik nokta","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"f′ artıdan eksiye geçerken oluşan tepe değeri","ad":"Yerel maksimum","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"f′ eksiden artıya geçerken oluşan çukur değeri","ad":"Yerel minimum","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"kritik noktada f″ negatifse maksimum, pozitifse minimum belirler","ad":"İkinci türev işareti","kim":"kanun sabitler"}],"sinavda":"Bir fonksiyon ve bir noktadaki yerel ekstremum bilgisi verilir, diğer yerel ekstremum değeri istenir.","panel_ornek":"Bir bayır yolunda bisikletle çıkarken yol önce yükselir sonra alçalır; en yüksek noktaya vardığında yükseklik ölçer 40 metreyi gösterir. O anda hızın sıfıra düştüğü nokta tepe noktasıdır. İşte fonksiyonlarda da türevin sıfır olduğu nokta böyle bir tepe ya da çukur noktasını verir.","ornek":"Bir bayır yolunda bisikletle çıkarken yol önce yükselir sonra alçalır; en yüksek noktaya vardığında yükseklik ölçer 40 metreyi gösterir. O anda hızın sıfıra düştüğü nokta tepe noktasıdır. İşte fonksiyonlarda da türevin sıfır olduğu nokta böyle bir tepe ya da çukur noktasını verir.","yontemler":"Önce f′(x) alınıp sıfıra eşitlenir, verilen noktadaki koşullardan katsayılar bulunur; sonra diğer kritik noktada f(x) hesaplanarak ikinci türev işaretiyle türü doğrulanır.","nedir":"Bu konu bir fonksiyonun tepe noktalarını yani yerel maksimum ve minimum değerlerini bulmayı öğretir. Sınav, türev alıp kritik noktayı bulma ve bu noktada değeri hesaplama becerini ölçer."},"olay":"3+2a+b=0 ve 1+a+b=-2 → a=0, b=-3; f(x)=x³-3x; f\u0027(x)=3x²-3=0 → x=-1,1; f\u0027\u0027(-1)=-6\u003c0 maksimum; f(-1)=-1+3=2.","tuzak":{"C":{"ad":"Apsis-Değer Karıştırma Tuzağı","metin":"maksimumun oluştuğu noktanın apsisini (x=-1) fonksiyon değeriyle karıştırıyorsun. Doğrusu: istenen f(-1) değeridir, x=-1 değil."},"A":{"ad":"Parametre Karıştırma Tuzağı","metin":"a+b toplamını (0+(-3)=-3) doğrudan cevap sanıyorsun; oysa a ve b ara adımda bulunan katsayılardır, soru fonksiyon değeri istiyor. Doğrusu: a,b bulunduktan sonra ikinci kritik noktada f hesaplanır."},"D":{"ad":"Çarpanlara Ayırma Hatası Tuzağı","metin":"3x²-3=0 denklemini 3x(x-1)=0 şeklinde yanlış çarpanlayıp x=0 kritik noktasını buluyorsun. Doğrusu: 3x²-3=3(x-1)(x+1)=0 → x=1, x=-1."},"B":{"ad":"Değer Tekrarı Tuzağı","metin":"verilen minimum değeri (-2) hiç işlem yapmadan maksimum değeriymiş gibi yazıyorsun. Doğrusu: minimum ve maksimum farklı kritik noktalarda oluşur, ayrı hesaplanır."}},"celdiriciYol":{"C":"x = -1 (maksimum noktasının apsisini değer olarak yazdı)","A":"a+b = 0+(-3) = -3 (parametre toplamını sonuç sandı)","D":"3x(x-1)=0 → x=0, f(0)=0³-3(0)=0 (çarpanlara ayırma hatası)","B":"f(1) = -2 (verilen minimum değerini maksimum değeriyle karıştırdı)"},"hap":"Ekstremum sorusunda önce kritik noktalar bulunur, sonra ikinci türev testiyle türü belirlenir, en son x değeri fonksiyona yazılarak İSTENEN DEĞER hesaplanır.","teshis":{"C":{"gercek":"Ekstremum DEĞERİ isteniyorsa x\u0027i f\u0027ye yazıp f(x) hesaplanır, x\u0027in kendisi cevap değildir.","ayirt":"Soru \u0027apsis\u0027 mi yoksa \u0027değer\u0027 mi istiyor?","paragraf":"Çözüm Adımı 3","yanilgi":"Ekstremum noktasının x değeri ile fonksiyonun o noktadaki değerini aynı şey sanıyorsun."},"E":{"gercek":"Parametreli fonksiyonlarda önce verilen bilgilerle denklem sistemi kurulup a,b bulunur, sonra tüm kritik noktalar tespit edilip ikinci türev testiyle sınıflandırılır.","ayirt":"Tüm ara adımları (denklem kurma, çözme, kritik nokta bulma, işaret testi) sırayla yaptım mı?","paragraf":"İkinci Türev Testi","yanilgi":"Bu şıkkı eleyen öğrenci ara denklem sisteminin gereksiz olduğunu, doğrudan tahminle sonuca ulaşılabileceğini sanır."},"A":{"gercek":"Soru fonksiyonun bir noktadaki DEĞERİNİ istiyor, katsayı toplamını değil; a,b yalnızca fonksiyonu kurmak için araçtır.","ayirt":"Bulduğum sayı bir katsayı mı, yoksa fonksiyonun bir noktadaki değeri mi?","paragraf":"Çözüm Adımı 1-2","yanilgi":"Ara adımda bulduğun katsayıların toplamını sorunun cevabı sanıyorsun."},"D":{"gercek":"3x²-3=0 denklemi 3(x-1)(x+1)=0 şeklinde çarpanlanır, kökler x=1 ve x=-1\u0027dir; x=0 kökü bu denklemi sağlamaz.","ayirt":"Bulduğum kökleri denklemde yerine koyup sıfır çıkıp çıkmadığını kontrol ettim mi?","paragraf":"Kritik Nokta Bulma","yanilgi":"İkinci dereceden denklemi çarpanlarına ayırırken sabit terimi gözden kaçırıyorsun."},"B":{"gercek":"Verilen minimum değeri, maksimumun aranacağı FARKLI bir kritik noktaya aittir; iki değer birbirinden bağımsız hesaplanır.","ayirt":"Bu sayı sorunun bana verdiği bilgi mi, yoksa benim bulmam gereken sonuç mu?","paragraf":"Birinci Türev Testi","yanilgi":"Sorudaki bilgiyi tekrar yazarsan doğru cevabı vermiş olacağını sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 11"},"kural":"kritik noktalar f\u0027(x)=0\u0027dan bulunur, ikinci türev testiyle türü belirlenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 11","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Soru \u0027değer mi apsis mi\u0027 istiyor kontrol et; ikinci türev işaretini mutlaka yaz, aksi halde maksimum-minimum karışır.","konu":"fonksiyon ekstremum","tablo":{"satirlar":[["VERİLENLER","-"],["Fonksiyon","f(x) = x³ − 3x² − 9x + 5"],["HESAP","-"],["F\u0027(x)=3x²-6x-9=0 kökleri","X=-1, x=3"],["F\u0027\u0027(x)=6x-6","F\u0027\u0027(-1)=-12, f\u0027\u0027(3)=12"],["Ekstremum türü","X=-1 maksimum, x=3 minimum"],["F(-1) hesabı","-1-3+9+5"],["Yerel maksimum değeri","10"]],"basliklar":["Kalem","Değer"]},"siklar":{"C":"3","E":"10","A":"-22","D":"5","B":"-1"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"x = 3 kritik noktasını ikinci türev testiyle kontrol etmeden cevap seçtin; bu nokta maksimum değil minimumdur.","A":"x = 3 noktasındaki fonksiyon değerini (−22) hesapladın ancak bu nokta f″(3) = 12 \u003e 0 olduğundan minimum noktasıdır, maksimum değil.","D":"Diğer kritik nokta olan x = 3\u0027ü işaret testi yapmadan maksimum sanıp apsis olarak işaretledin; maksimum x = −1\u0027dedir.","B":"Maksimumun oluştuğu yer olan x = −1 apsisini, soru istediği f(−1) değeri (10) ile karıştırdın; apsis ve fonksiyon değeri farklı şeylerdir."},"dogru":"Fonksiyonun türevini sıfıra eşitleyerek kritik noktaları bulursun: x = −1 ve x = 3. İkinci türev testiyle x = −1\u0027de maksimum, x = 3\u0027te minimum olduğunu anlarız. Maksimumun DEĞERİ: f(−1) = 10.","sinav":"Türevli fonksiyonda ekstremum yalnız kritik noktalarda oluşur; ikinci türev testi ile f″(x) \u003c 0 ise maksimum, f″(x) \u003e 0 ise minimumdur.","kavramlar":[{"kaynak":"TEORI","tanim":"Türevinin sıfır olduğu noktadır; fonksiyonun ekstremum değeri bu noktada oluşabilir.","ad":"Kritik nokta"},{"kaynak":"TEORI","tanim":"Kritik noktada ikinci türev negatifse maksimum, pozitifse minimumdur; ekstremumun türünü belirlemek için kullanılır.","ad":"İkinci türev testi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Değer"],"satirlar":[["G\u0027(x)=3x²-12x+9=0 kökleri","x=1, x=3"],["G\u0027\u0027(x)=6x-12","g\u0027\u0027(1)=-6, g\u0027\u0027(3)=6"],["Ekstremum türü","x=1 maksimum, x=3 minimum"],["G(3) hesabı","27-54+27+2"],["Yerel minimum değeri","2"]]},"tur":"tablo","soru":"g(x) = x³ − 6x² + 9x + 2 fonksiyonu tanımlanmıştır. Buna göre g fonksiyonunun yerel minimum değeri kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve g\u0027nin yerel minimum değerinin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f(x) = x³ − 3x² − 9x + 5 fonksiiyonu tanımlanmıştır. Buna göre f fonksiyonunun yerel maksimum değeri kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-31","verilenler":[{"deger":"f(x) = x³ − 3x² − 9x + 5","anlam":"Ekstremum noktaları ve değerleri bu fonksiyon üzerinden türev alınarak bulunur.","ad":"Fonksiyon"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Fonksiyonlarda Ekstremum (Birinci ve İkinci Türev Testi)","dogru":"E","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: f(x) = x³ − 3x² − 9x + 5 (soruda verilen)","anlatim":"Soru bize f(x) = x³ − 3x² − 9x + 5 fonksiyonunu vermiş. Yerel maksimum değeri isteniyor.","verilenAdim":true,"doldur":[[1,1]]},{"formul":"f\u0027(x) = 3x² − 6x − 9 = 0 → kökler x = -1 (1. adımda bulduk), x = 3 (1. adımda bulduk)","anlatim":"Yerel maksimum ve minimum noktaları f\u0027(x)=0 yapan x değerleridir. Önce birinci türevi alıp sıfıra eşitliyoruz.","doldur":[[3,1]]},{"formul":"f\u0027\u0027(x) = 6x − 6; f\u0027\u0027(-1) = 6×(-1) − 6 = -12 (2. adımda bulduk); f\u0027\u0027(3) = 6×3 − 6 = 12 (2. adımda bulduk)","anlatim":"Bulduğumuz kökler maksimum mu minimum mu, bunu ikinci türevle anlarız. İkinci türev negatifse maksimum, pozitifse minimumdur.","doldur":[[4,1]]},{"formul":"Ekstremum türü: x = -1 (3. adımda bulduk) → maksimum; x = 3 (3. adımda bulduk) → minimum","anlatim":"f\u0027\u0027(-1) negatif çıktığı için x=-1 yerel maksimum noktası. f\u0027\u0027(3) pozitif olduğu için x=3 yerel minimum noktası.","doldur":[[5,1]]},{"formul":"f(-1) = (-1)³ − 3×(-1)² − 9×(-1) + 5 = -1 − 3 + 9 + 5 = 10","anlatim":"Maksimum noktayı bulduk ama soru maksimum değeri istiyor. Bunun için x=-1\u0027i orijinal fonksiyonda yerine yazarız.","doldur":[[6,1]]},{"formul":"Yerel maksimum değeri = f(-1) = 10 (4. adımda bulduk)","anlatim":"Yerine koyma işlemini topladık ve sonucu bulduk. Bu fonksiyonun yerel maksimum değeridir.","doldur":[[7,1]]},{"formul":"Yanlış yol: yerel maksimum değeri = x = -1 (HATALI) → doğrusu f(-1) = 10 (6. adımda bulduk)","anlatim":"Bazı öğrenciler x=-1 noktasını değil, x değerinin kendisini yerel maksimum değeri sanıp -1 cevabını verir. Yerel maksimum değeri f(x)\u0027in o noktadaki değeridir, x değeri değildir.","doldur":[]}],"anahtar":[{"ornek":"maksimum","kok":"maksim"},{"ornek":"değeri","kok":"değeri"},{"ornek":"minimum","kok":"minimu"},{"ornek":"noktası","kok":"noktas"},{"ornek":"fonksiyonunu","kok":"fonksi"},{"ornek":"belirle","kok":"belirl"}],"konuGiris":{"harita":"Ekstremum ne zaman test edilir: fonksiyonun türevi alınıp sıfır yapan noktalar bulunduğunda. Nasıl ölçülür: kritik noktada işaret değişimi veya ikinci türevin işaretiyle maksimum mu minimum mu olduğu belirlenir. Nasıl kaydedilir: bulunan x değeri fonksiyona geri yazılıp o noktadaki f(x) değeri cevap olarak yazılır.","desen":"Sınav genelde \u0027yerel maksimum değer\u0027 ile \u0027maksimumun oluştuğu x değeri\u0027ni karıştıracak şekilde sorar, öğrenci x\u0027i cevap sanabilir. Kritik noktayı bulup türünü belirlemeden direkt f(x) yazmak da tuzaktır. Bu soru, kritik nokta bulma ve ikinci türev testi ile değer hesaplama noktasından geliyor (p.28, 1 dönem çıkmış).","terimler":[{"kaynak":"sen hesaplarsın","tanim":"f′(x)=0 eşitliğini sağlayan x değeri, ekstremum adayı.","ad":"Kritik nokta","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Kritik noktada f′ artıdan eksiye geçiyorsa oluşan tepe değeri.","ad":"Yerel maksimum","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Kritik noktada f″ negatifse maksimum, pozitifse minimum verir.","ad":"İkinci türev testi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Kritik x değerinin fonksiyona yazılmasıyla bulunan f(x) sonucu.","ad":"Ekstremum değeri","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Üçüncü dereceden bir fonksiyon verilir ve yerel maksimum DEĞERİ istenir, x değeri değil f(x) sorulur.","panel_ornek":"Bir tepenin yüksekliği yol boyunca değişir, en yüksek noktaya çıkıp sonra iner; işte o en tepe noktası tam olarak nerede diye düşün. Mesela yürüyüş yolunun yüksekliği 3 km sonra 40 metreye çıkıp tekrar alçalıyor olabilir. Bizi ilgilendiren, o 40 metrelik zirve değeri, yolun kaçıncı kilometresinde olduğu değil.","ornek":"Bir tepenin yüksekliği yol boyunca değişir, en yüksek noktaya çıkıp sonra iner; işte o en tepe noktası tam olarak nerede diye düşün. Mesela yürüyüş yolunun yüksekliği 3 km sonra 40 metreye çıkıp tekrar alçalıyor olabilir. Bizi ilgilendiren, o 40 metrelik zirve değeri, yolun kaçıncı kilometresinde olduğu değil.","yontemler":"f′(x)=0 çözülüp kritik noktalar bulunur, ardından f″ işaretiyle hangisinin maksimum olduğu belirlenir; son adımda o x, orijinal fonksiyona yazılarak değer hesaplanır.","nedir":"Ekstremum konusu, bir fonksiyonun grafiğinde en tepe (yerel maksimum) veya en dip (yerel minimum) noktalarını bulmayı öğretir. Sınav, türev alıp bu noktaları ve o noktadaki fonksiyon değerini doğru hesaplayabildiğini ölçer."},"olay":"f\u0027(x)=3x²-6x-9=0 → x=-1, x=3; f\u0027\u0027(x)=6x-6; f\u0027\u0027(-1)=-12\u003c0 maksimum, f\u0027\u0027(3)=12\u003e0 minimum; f(-1)=-1-3+9+5=10.","tuzak":{"C":{"ad":"Apsis-Değer Karıştırma Tuzağı","metin":"maksimumun oluştuğu noktanın apsisi olan -1\u0027i doğrudan değer sandın. Doğrusu: soru maksimumun apsisini değil f(-1) değerini yani 10\u0027u istiyor."},"A":{"ad":"Ne soruluyor","metin":"fonksiyonun yerel maksimum değeri isteniyor. Kural: kritik noktalar f\u0027(x)=0\u0027dan bulunur, ikinci türev testiyle türü belirlenir. Hesap: f\u0027(x)=3x²-6x-9=0 → x=-1, x=3; f\u0027\u0027(x)=6x-6; f\u0027\u0027(-1)=-12\u003c0 maksimum, f\u0027\u0027(3)=12\u003e0 minimum; f(-1)=-1-3+9+5=10. Doğrusu: yerel maksimum değeri 10\u0027dur."},"D":{"ad":"Kritik Nokta Seçimi Tuzağı","metin":"diğer kritik nokta olan x=3\u0027ü, işaret testi yapmadan apsis olarak yazdın. Doğrusu: ikinci türev testiyle x=-1 maksimum noktasıdır, değeri 10\u0027dur."},"B":{"ad":"Minimum-Maksimum Karıştırma Tuzağı","metin":"x=3 noktasını maksimum sanıp f(3)=27-27-27+5=-22 hesapladın, oysa f\u0027\u0027(3)\u003e0 olduğundan burası minimumdur. Doğrusu: maksimum x=-1 noktasında oluşur, değeri 10\u0027dur."}},"celdiriciYol":{"C":"x = 3 (diğer kritik noktanın apsisini işaret testi yapmadan yazdın)","A":"f(3) = 27 - 27 - 27 + 5 = -22 (minimum değerini maksimum sandın)","D":"f(-1) = -1 - 3 + 9 = 5 (sabit terim +5\u0027i eklemeyi unuttun)","B":"x = -1 (maksimumun apsisini değer sandın)"},"hap":"Ekstremum sorusunda f\u0027(x)=0\u0027dan kritik noktayı bul, f\u0027\u0027 ile türünü belirle, sonra x\u0027i f\u0027ye yazarak DEĞERİ hesapla.","teshis":{"C":{"gercek":"Her kritik noktanın türü ayrı ayrı f\u0027\u0027 ile ya da işaret tablosuyla belirlenmelidir; x=3 burada minimumdur.","ayirt":"Bu kritik noktanın türünü test ettim mi?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Birinci/İkinci Türev Testi","yanilgi":"İkinci kritik noktayı işaret testi yapmadan sonuç sanıyorsun."},"E":{"gercek":"f\u0027(x)=0 kritik noktaları verir; f\u0027\u0027\u003c0 olan noktada maksimum oluşur ve değeri f(-1)=10\u0027dur.","ayirt":"Kritik noktayı bulduktan sonra türünü ve değerini doğru hesapladım mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Ekstremum","yanilgi":"Bu şıkkı eleyen öğrenci, kritik noktayı bulsa da ikinci türev testini uygulamayı atlıyor ya da hesap hatası yapıyor."},"A":{"gercek":"Kritik noktada f\u0027\u0027\u003c0 ise maksimum, f\u0027\u0027\u003e0 ise minimum oluşur; x=3\u0027te f\u0027\u0027(3)=12\u003e0 olduğundan minimumdur.","ayirt":"Bu noktada f\u0027\u0027 işareti gerçekten negatif mi?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - İkinci Türev Testi","yanilgi":"İkinci türev testinin işaretini ters yorumlayıp minimum noktasını maksimum sanıyorsun."},"D":{"gercek":"f(-1) = (-1)³ - 3(-1)² - 9(-1) + 5 işleminde her terim, sabit dahil, toplanmalıdır.","ayirt":"Fonksiyondaki her terimi yerine yazıp topladım mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Ekstremum Değer Hesabı","yanilgi":"f(-1) hesabında sabit terimi eklemeyi unutuyorsun."},"B":{"gercek":"Ekstremum değeri istendiğinde x değeri değil f(x) hesaplanır; x=-1 yalnızca apsistir.","ayirt":"Soru apsisi mi yoksa fonksiyon değerini mi istiyor?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu - Çözüm Adımları","yanilgi":"Maksimumun oluştuğu x değerini, fonksiyonun aldığı maksimum değeriyle aynı sanıyorsun."}},"verilen":[[3,0],[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 10"},"kural":"Üç bilinmeyenli fonksiyon için üç veri yeter, denklemler kurulup çözülür, sonra istenen denklem oluşturulur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 10","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Üç veriden sistem kurup katsayıları bul, bir veriyle sağlama yap, sonra istenen denklemi kurup çöz.","konu":"fonksiyon katsayı bulma","tablo":{"satirlar":[["VERİLENLER","-"],["f(0)","-3"],["f(1)","-4"],["f(-1)","0"],["f(m)","5"],["HESAP","-"],["C (f(0)\u0027dan)","-3"],["A+b (f(1)-c)","-1"],["A-b (f(-1)-c)","3"],["A (toplamdan)","1"],["B (farktan)","-2"],["F(x)=x²-2x-3","-"],["M²-2m-8=0 kökleri","M=4 veya m=-2"],["Sonuç (pozitif m)","4"]],"basliklar":["Kalem","Değer"]},"siklar":{"C":"5","E":"12","A":"2","D":"8","B":"4"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"5 sayısı fonksiyonun sonucudur, m\u0027nin değeri değildir; m²-2m-8=0 denklemi çözülüp kök bulunmalıdır.","E":"f(m)=5 ters okunup f(5)=m sanılırsa f(5)=12 hesaplanır; oysa m girdi, 5 sonuçtur ve sıra ters çevrilemez.","D":"Kök formülünde payda 2a olmalıdır; payda yerine yalnız a=1 kullanılırsa (2+6)/1=8 gibi yanlış sonuç çıkar.","A":"f(1) ile f(-1) denklemleri yer değiştirse b=2 çıkar ve m²+2m-8=0 ile m=2 bulunur; oysa f(1) ve f(-1) ayrı ayrı, karışmadan yazılmalıdır."},"dogru":"Verilen üç bilgiden a, b, c bulunur: f(0)=-3 ise c=-3; f(1)=-4 ise a+b=-1; f(-1)=0 ise a-b=3. İkisini toplayınca a=1, b=-2 çıkar. Fonksiyon f(x)=x²-2x-3 olur; f(m)=5 denklemini çözünce m=4 bulunur.","sinav":"f(x) = ax² + bx + c fonksiyonunun katsayıları verilen değerlerden bulunur ve f(m) = 5 denkleminin pozitif çözümü istenir.","kavramlar":
