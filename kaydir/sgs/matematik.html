zaklık formülü uygulanır. En kritik nokta: dik doğrunun eğimi orijinal eğimin negatif tersidir, karıştırılmamalıdır.","nedir":"Analitik geometri, noktaları ve doğruları koordinat düzleminde sayılarla ifade edip aralarındaki ilişkiyi hesaplamayı öğretir. Sınav; eğim bulma, dik doğru kurma ve noktanın doğruya uzaklığını hesaplama becerini ölçer."},"olay":"AB eğimi=(2-0)/(4-0)=1/2 → AB: x-2y=0; dik eğim=-2, C(5,5)\u0027ten doğru: 2x+y-15=0; kesişim x=2y→2(2y)+y-15=0→y=3,x=6→K(6,3); uzaklik=|3(6)+4(3)-10|/5=20/5=4.","tuzak":{"D":{"ad":"Kesişim Atlama Tuzağı","metin":"Dikmenin ucundaki C noktasını doğrudan K sanıp |3(5)+4(5)-10|/5=25/5=5 buluyorsun. Doğrusu: K, dik doğrunun AB\u0027yi kestiği ayrı bir noktadır, C değildir."},"E":{"ad":"Payda Unutma Tuzağı","metin":"|3(6)+4(3)-10|=20 değerini bulup boleme adımını atlıyorsun. Doğrusu: bu sayı paydaya (√(A²+B²)=5) bölünmeden sonuç tamamlanmaz."},"A":{"ad":"Kök Alma Tuzağı","metin":"Paydayı A²+B² sanıp karekök almadan işlem yapıyorsun. Doğrusu: payda √(3²+4²)=5 alınır, uzaklik 20/5=4\u0027tür."},"B":{"ad":"Yanlış Nokta Tuzağı","metin":"Dik doğruyu C yerine A(0,0) noktasından geçirip K\u0027yi (0,0) sanıp uzakligi 2 buluyorsun. Doğrusu: dik doğru soruda verilen C(5,5) noktasından geçmelidir."}},"celdiriciYol":{"D":"|3(5)+4(5)-10| / 5 = 25/5 = 5 (kesişim noktası K\u0027yi bulmadan C noktasını doğrudan uzaklik formülüne koydu)","E":"|3(6)+4(3)-10| = 20 (paydaya hiç bolmedi)","A":"|3(6)+4(3)-10| / (3²+4²) = 20/25 = 0,8 (karekök almadan payda olarak A²+B² kullandı)","B":"|3(0)+4(0)-10| / 5 = 10/5 = 2 (dik doğruyu C yerine A(0,0) noktasından geçirip K yerine A\u0027yi kullandı)"},"hap":"Dik dogrularda eğimler çarpımı -1\u0027dir; kesişim noktası bulunmadan uzaklik formülüne geçilmez.","teshis":{"C":{"gercek":"Önce AB\u0027nin eğimi ve denklemi, sonra C\u0027den geçen dik doğru, ardından iki doğrunun kesişimi olan K bulunur; uzaklik son adımdır.","ayirt":"Her ara sonucu bir sonraki adımda gerçekten kullandim mi?","paragraf":"Egim, diklik, doğru denklemi, uzaklik formulu zinciri","yanilgi":"K noktasını bulmanın gereksiz olduğunu, verilen noktalardan biriyle doğrudan işlem yapılabileceğini sanıyorsun."},"E":{"gercek":"Uzaklik formülünde pay, paydaya (√(A²+B²)) bölünmeden sonuç tamamlanmaz.","ayirt":"Payı paydaya boldum mu?","paragraf":"Nokta-doğru uzakligi formulu","yanilgi":"Mutlak değer içindeki sayıyı bulunca işlemin bittiğini, paydaya bölmenin gerekmediğini düşünüyorsun."},"A":{"gercek":"Noktanın doğruya uzakligi |Ax0+By0+C|/√(A²+B²) formülüyle bulunur, payda karekoklu bir uzunluktur.","ayirt":"Payda gerçekten bir uzunluk mu, yoksa uzunlugun karesi mi?","paragraf":"Nokta-doğru uzakligi tanimi","yanilgi":"Uzaklik formülünün paydasını A²+B² sanıp karekök almayı atlıyorsun."},"D":{"gercek":"C, dikmenin cizildigi başlangıç noktasıdır; AB\u0027yi kestiği K noktası ayrı bir denklem cozumuyle bulunur.","ayirt":"C noktası AB doğrusunun denklemini sağlar mi?","paragraf":"Dogrularin kesisimi: ortak cozum","yanilgi":"C noktasının zaten kesişim noktası olduğunu varsayıp K\u0027yi ayrıca hesaplamiyorsun."},"B":{"gercek":"Dik doğru, soruda belirtilen C noktasından geçmek zorundadır; başka noktadan çizilen doğru C\u0027den geçen dikme değildir.","ayirt":"Kurdugum doğru gerçekten C noktasından mi geçiyor?","paragraf":"Doğru denklemi y-y0=m(x-x0)","yanilgi":"Dik doğruyu AB üzerindeki herhangi bir noktadan cizebilecegini, C\u0027nin şart olmadığını düşünüyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 10"},"kural":"(x0,y0) noktasının Ax+By+C=0 doğrusuna uzaklığı |Ax0+By0+C|/√(A²+B²) ile bulunur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 10","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce doğrunun A, B, C değerlerini ve noktanın koordinatlarını ayrı ayrı yaz, sonra payı ve paydayı sırayla hesapla.","konu":"analitik geometri","tablo":{"satirlar":[["VERİLENLER","-"],["Doğru denklemi","3x + 4y - 5 = 0"],["Nokta","P(0, 10)"],["HESAP","-"],["Pay: 3(0)+4(10)-5","35"],["Mutlak değer: |35|","35"],["Payda: √(3²+4²)","5"],["Uzaklık: 35/5","7"]],"basliklar":["İşlem","Sonuç"]},"siklar":{"C":"7","E":"35","A":"1","D":"9","B":"5"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1]],"tablo":{"basliklar":["İşlem","Sonuç"],"satirlar":[["Pay: 6(0)+8(6)-18","30"],["Mutlak değer: |30|","30"],["Payda: √(6²+8²)","10"],["Uzaklık: 30/10","3"]]},"tur":"tablo","soru":"M(0, 6) noktasının 6x + 8y − 18 = 0 doğrusuna uzaklığı kaç birimdir?","verilen":[],"hedef":"Tabloyu doldur ve M noktasının doğruya uzaklığının kaç birim olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"P(0, 10) noktasının 3x + 4y − 5 = 0 doğrusuna uzaklığı kaç birimdir?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-17","verilenler":[{"deger":"3x + 4y - 5 = 0","anlam":"A=3, B=4, C=-5 katsayılarını verir, uzaklık formülünün paydasında ve payında kullanılır","ad":"Doğru denklemi"},{"deger":"P(0, 10)","anlam":"x0=0, y0=10 değerleri payda Ax0+By0+C ifadesinde yerine konur","ad":"Nokta"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Analitik Geometri, Noktanın Doğruya Uzaklığı","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: Nokta P (0; 10) (soruda verilen); Doğru 3x + 4y − 5 = 0 (soruda verilen)","anlatim":"Soru bize noktayı ve doğruyu vermiş: P(0,10) noktası, 3x+4y-5=0 doğrusu. Ayrıca tablo formülün ara sonuçlarını da gösteriyor, biz sırayla hesaplayacağız.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Uzaklık = |A×x0 + B×y0 + C| / √(A² + B²)","anlatim":"Nokta-doğru uzaklığı denince akla bu formül gelmeli: |Ax0+By0+C|/√(A²+B²). Doğrunun A,B,C katsayıları ile noktanın x0,y0\u0027ını buraya koyacağız.","doldur":[]},{"formul":"Pay = 3 × x0 + 4 × y0 − 5 = 3 × 0 (soruda verilen) + 4 × 10 (soruda verilen) − 5 (soruda verilen) = 35","anlatim":"Önce payı buluyoruz, yani doğru denklemine noktanın koordinatlarını yerine koyuyoruz. Mutlak değer henüz almadan sadece işlemi yapıyoruz.","doldur":[[4,1]]},{"formul":"|Pay| = |35 (3. adımda bulduk)| = 35","anlatim":"Uzaklık her zaman pozitif çıkmalı, o yüzden bulduğumuz sayının mutlak değerini alıyoruz. 35 zaten pozitif, işaret değişmedi.","doldur":[[5,1]]},{"formul":"Payda = √(3² + 4²) = √(9 + 16) = √25 = 5","anlatim":"Şimdi paydayı hesaplıyoruz, doğrunun x ve y katsayılarının kareleri toplamının karekökünü alıyoruz. Bu sayı doğrunun normal vektörünün uzunluğudur.","doldur":[[6,1]]},{"formul":"Uzaklık = |Pay| / Payda = 35 (4. adımda bulduk) / 5 (5. adımda bulduk) = 7","anlatim":"Son adımda payı paydaya bölüp uzaklığı buluyoruz. Bu bize noktadan doğruya en kısa dik mesafeyi verir.","doldur":[[7,1]]},{"formul":"Sonuç: Uzaklık = 7 birim","anlatim":"Sonuç: nokta ile doğru arasındaki uzaklık 7 birim çıktı. Formülün her parçası doğru yerine oturdu.","doldur":[]},{"formul":"Yanlış yol: Uzaklık = Pay / Payda = 35 / 5 = 7 ama işaret kontrolsüz alınırsa yanlış sonuç çıkabilir (HATALI) → doğrusu |Pay| / Payda = 7 (6. adımda bulduk)","anlatim":"En sık hata: mutlak değeri unutup pay negatif çıksa bile eksi işaretiyle bölme yapmaktır. Uzaklık negatif olamaz, mutlak değer bu yüzden zorunludur.","doldur":[]}],"anahtar":[{"ornek":"uzaklığı","kok":"uzaklı"},{"ornek":"mutlak","kok":"mutlak"},{"ornek":"yerine","kok":"yerine"},{"ornek":"paydaya","kok":"payday"},{"ornek":"noktanın","kok":"noktan"},{"ornek":"doğrunun","kok":"doğrun"}],"konuGiris":{"harita":"Ne zaman test edilir: nokta ve doğru denklemi verildiğinde uzaklık formülü istenir. Nasıl ölçülür: |Ax₀ + By₀ + C| / √(A² + B²) formülüyle sayısal sonuca ulaşılır. Nasıl kaydedilir: sonuç birimsiz pozitif bir sayı olarak yazılır.","desen":"Soru genellikle doğrunun genel biçimde verilmesiyle başlar ve öğrenciden formülü doğru kurması istenir. Tuzak, mutlak değeri ve kareköklü paydayı unutmaktır; işaret hatası sonucu değiştirir. Bu soru \u0027noktanın doğruya uzaklığı\u0027 formülünün doğru uygulanması noktasından geliyor (p.28).","terimler":[{"kaynak":"soruda verilir","tanim":"Ax + By + C = 0 biçiminde yazılan doğru ifadesi","ad":"Doğrunun genel denklemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"(x₀, y₀) biçiminde noktanın düzlemdeki konumu","ad":"Nokta koordinatları","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"noktanın doğruya olan dik uzaklığını veren kural","ad":"Uzaklık formülü","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"payda ve paydaki ifadenin doğru sadeleştirilmesi","ad":"Mutlak değer ve kök işlemi","kim":"kanun sabitler"}],"sinavda":"Bir nokta ve bir doğru denklemi verilir, noktanın doğruya uzaklığı istenir.","panel_ornek":"Kiralık bir evin ilan fiyatı ile senin teklifin arasındaki farkı bulmak gibi, burada da bir noktanın bir çizgiye ne kadar \u0027uzak\u0027 olduğunu ölçüyoruz. Örneğin evin 6. kattaki balkonundan caddeye çizilen hayali çizgiye uzaklığı 2 metre olabilir. Bu 2 metre, senin gerçek durumunla hiç alakalı değil, sadece mantığı gösteriyor.","ornek":"Kiralık bir evin ilan fiyatı ile senin teklifin arasındaki farkı bulmak gibi, burada da bir noktanın bir çizgiye ne kadar \u0027uzak\u0027 olduğunu ölçüyoruz. Örneğin evin 6. kattaki balkonundan caddeye çizilen hayali çizgiye uzaklığı 2 metre olabilir. Bu 2 metre, senin gerçek durumunla hiç alakalı değil, sadece mantığı gösteriyor.","yontemler":"Doğruyu Ax + By + C = 0 biçimine getir, sonra noktanın koordinatlarını formülde yerine koy. En kritik nokta, paydaki mutlak değeri ve paydadaki kökü atlamamaktır.","nedir":"Analitik geometri, noktalar ve doğruların koordinat düzlemindeki ilişkisini formüllerle inceler. Sınav; uzaklık, eğim ve doğru denklemi hesaplarını doğru kurup sonuca ulaşabilmeni ölçer."},"olay":"|3(0)+4(10)-5|/√(3²+4²)=|35|/5=7.","tuzak":{"D":{"ad":"Sabit Terim İşaret Tuzağı","metin":"doğru denklemindeki -5\u0027i +5 gibi alıp payı büyütüyorsun. Doğrusu: C terimi denklemdeki işaretiyle aynen yerine konur, -5 kullanılmalıdır."},"E":{"ad":"Payda Atlama Tuzağı","metin":"mutlak değerle bulduğun payı doğrudan uzaklık sanıp paydaya hiç bölmüyorsun. Doğrusu: pay her zaman √(A²+B²)\u0027ye bölünerek uzaklık elde edilir."},"A":{"ad":"Y Terimi Atlama Tuzağı","metin":"4y0 terimini paya eklemeyi unutup sadece Ax0+C ile işlem yapıyorsun. Doğrusu: pay hesabında A ve B\u0027nin katsayılı terimlerinin ikisi de yazılır, |3(0)+4(10)-5|/5=7."},"B":{"ad":"Karekök Unutma Tuzağı","metin":"Paydaya sqrt(A²+B²) yerine A+B toplamını yazıyorsun. Doğrusu: payda daima karekök içinde A² ve B²\u0027nin toplamıdır, 5 değil 7 ile bölünmez."}},"celdiriciYol":{"D":"|3*0 + 4*10 + 5| / 5 = 45 / 5 = 9 (sabit terim C\u0027nin işaretinin ters alınması hatası)","E":"|3*0 + 4*10 - 5| = 35 (paya hiç bölünmeden payın sonuç sanılması hatası)","A":"|3*0 - 5| / 5 = 5 / 5 = 1 (4y0 teriminin paya eklenmemesi hatası)","B":"|3*0 + 4*10 - 5| / (3+4) = 35 / 7 = 5 (karekök yerine A+B toplamının payda yapılması hatası)"},"hap":"Noktanın Ax+By+C=0 doğrusuna uzaklığı, koordinatları işaretiyle yerine koyup paydaya √(A²+B²) yazarak bulunur.","teshis":{"C":{"gercek":"Formülün tam hali |Ax0+By0+C|/√(A²+B²)\u0027dir; hiçbir terim atlanmadan doğrudan uygulanır.","ayirt":"Denklemdeki her sayıyı işaretiyle birlikte yerine koydum mu?","paragraf":"Noktanın doğruya uzaklığı formülü","yanilgi":"Bu şıkkı elemeyen öğrenci genelde payda ya da sabit terimde bir kısaltma yapmayı doğru zannediyor."},"E":{"gercek":"Pay tek başına uzaklık değildir; sonuç ancak √(A²+B²)\u0027ye bölündükten sonra uzaklığı verir.","ayirt":"Payı paydaya böldüm mü, yoksa payı sonuç mu saydım?","paragraf":"Noktanın doğruya uzaklığı formülü","yanilgi":"Mutlak değerle bulduğun sayının kendisinin uzaklık olduğunu düşünüp paydaya bölmeyi atlıyorsun."},"A":{"gercek":"Uzaklık formülünde pay Ax0+By0+C biçimindedir; her iki koordinat da kendi katsayısıyla mutlaka paya girer.","ayirt":"Paya yazarken hem x0\u0027ı hem y0\u0027ı kendi katsayısıyla mı çarptım?","paragraf":"Noktanın doğruya uzaklığı formülü","yanilgi":"Formülde sadece A ve C\u0027yi kullanıp y koordinatının katsayılı terimini paya eklemeyi gerekmiyor sanıyorsun."},"D":{"gercek":"C, denklemde yazıldığı işaretiyle aynen paya taşınır; işaret değiştirmek payı yanlış büyütür.","ayirt":"C terimini denklemdeki işaretiyle mi yazdım?","paragraf":"Noktanın doğruya uzaklığı formülü","yanilgi":"Doğru denklemindeki sabit terimin işaretini görmeden ya da tersine çevirerek kullanıyorsun."},"B":{"gercek":"Payda daima √(A²+B²) biçimindedir; toplamın kendisi değil karesel toplamın karekökü alınır.","ayirt":"Paydaya yazdığım sayı bir karekök işleminden mi geldi?","paragraf":"Noktanın doğruya uzaklığı formülü","yanilgi":"Paydanın karekök içinde A²+B² olduğunu unutup sadece A+B toplamını yeterli sanıyorsun."}},"verilen":[[4,1],[5,1],[1,1],[2,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 11"},"kural":"a²-b²=(a-b)(a+b) özdeşliğiyle x²-9=(x-3)(x+3) yazılır, payda (x+3) ile sadeleşir; paydayı sıfır yapan x=-3 sadeleştirmeden sonra da tanım kümesi dışında kalır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 11","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Rasyonel ifade sorusunda önce payı çarpanlarına ayır, sonra tanım kümesi kısıtlamasını MUTLAKA orijinal paydadan oku.","konu":"cebirsel ifade sadelestirme","tablo":{"satirlar":[["VERİLENLER","-","-"],["Pay","x²-9","-"],["Payda","x+3","-"],["HESAP","-","-"],["Payı çarpanlara ayır","X²-9 = (x-3)(x+3)","(x-3)(x+3)"],["Sadeleştir","(x-3)(x+3)/(x+3)","X-3"],["Tanım kümesi","X+3 ≠ 0","X ≠ -3"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"x-3 (x ≠ 3)","E":"x+3 (x ≠ 3)","A":"x-3 (x ≠ -3)","D":"x-3","B":"x+3 (x ≠ -3)"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Tanım kümesi kısıtlamasını sadeleşmiş ifadeden (x-3=0) okudun; tanımsızlık orijinal paydadan (x+3=0) gelir, o yüzden x≠3 değil x≠-3 yazılmalıdır.","E":"Hem çarpanı tersleştirdin (x+3 yazdın) hem de tanım kümesi kısıtlamasını sadeleşmiş ifadeden okudu; ikisi de hatalıdır.","D":"Sadeleştirmeyi doğru yaptığın halde orijinal paydayı sıfır yapan x=-3 değerini cevaba kısıtlama olarak eklemeyi unutup yazmazsın.","B":"İki kare farkını yanlış çarpanlara ayırıp (x+3) kısmını pay yerine sadeleşen olarak gördün; oysa sadeleşen çarpan (x+3), kalan çarpan (x-3)\u0027tür."},"dogru":"Payı iki kare farkı özdeşliğiyle (x-3)(x+3) biçiminde yazarsın. Paydadaki (x+3) ile sadeleştirince x-3 kalır. Ama payda sıfır yapan x=-3 değeri orijinal ifadede tanımsız olduğu için cevaba kısıtlama olarak eklenir.","sinav":"Rasyonel ifade sadeleştirmede iki kare farkı özdeşliğiyle pay çarpanlarına ayrılır, paydayla ortak çarpan sadeleştirilir ve paydayı sıfır yapan değer tanım kümesi kısıtlaması olarak korunur.","kavramlar":[{"kaynak":"TANIMSIZLIK","tanim":"Paydayı sıfır yapan değerler orijinal ifadede tanımsız olduğu için sadeleştirmeden sonra bile cevaba not edilmesi gereken dışlanma kuralıdır.","ad":"Tanım kümesi kısıtlaması"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["Payı çarpanlara ayır","x²-16 = (x-4)(x+4)","(x-4)(x+4)"],["Sadeleştir","(x-4)(x+4)/(x+4)","x-4"],["Tanım kümesi","x+4 ≠ 0","x ≠ -4"]]},"tur":"tablo","soru":"(x²-16)/(x+4) biçimindeki rasyonel ifadenin sadeleştirilmiş hali ve tanım kümesi kısıtlaması nedir?","verilen":[[1,1],[2,1]],"hedef":"Tabloyu doldur ve x\u0027in kaç olamayacağını bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"(x²-9)/(x+3) biçimindeki rasyonel ifadenin sadeleştirilmiş hali ve tanım kümesi kısıtlaması aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-18","verilenler":[{"deger":"x²-9","anlam":"iki kare farkı özdeşliğiyle (x-3)(x+3) şeklinde çarpanlarına ayrılacak ifade","ad":"Pay"},{"deger":"x+3","anlam":"payla ortak çarpanı barındıran ve tanımsızlık değerini belirleyen ifade","ad":"Payda"}],"dayanak":"TESMER SGS Matematik-İstatistik ders notu; cebirsel ifadelerde sadeleştirme ve özdeşlikler bölümü","dogru":"A","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen ifade: (x²-9)/(x+3) (soruda verilen)","anlatim":"Soruda ne var: (x²-9)/(x+3) biçiminde bir rasyonel ifade; sadeleştirilmiş hali ve tanım kümesi kısıtlaması isteniyor; \u0027iki kare farkı\u0027 özdeşliği çözümün anahtarı.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"x² - 9 = (x)² - (3)² = (x-3)(x+3)","anlatim":"a²-b² = (a-b)(a+b) nedir? İki terimin karesi farkını çarpanlarına ayıran özdeşliktir. Burada payı bu kalıba sokuyoruz.","doldur":[[4,1],[4,2]]},{"formul":"(x-3)(x+3) / (x+3) = x-3","anlatim":"Payda ile paydaki ortak çarpanı sadeleştiriyoruz. Sadeleştirme, payda sıfır olmadığı sürece geçerli bir işlemdir.","doldur":[[5,1],[5,2]]},{"formul":"x + 3 = 0 (soruda verilen paydadan) → x = -3","anlatim":"Tanım kümesi kısıtlaması nedir? Paydayı sıfır yapan değer, ifade sadeleşse bile hiçbir zaman x yerine konamaz.","doldur":[[6,1],[6,2]]},{"formul":"Sonuç = x - 3 (2. adımda bulduk), x ≠ -3 (3. adımda bulduk)","anlatim":"Sadeleştirme bitti, kısıtlama belli. İkisini birlikte yazınca cevap tamamlanıyor.","doldur":[]},{"formul":"Ters durum: payda (x-3) olsaydı → x ≠ 3","anlatim":"Ters durumda: payda (x-3) olsaydı kısıtlama x ≠ 3 olurdu. Hangi terim sadeleşirse kısıtlama onun kökünden gelir.","doldur":[]},{"formul":"Yanlış yol: sadece x-3 yazıp kısıtlamayı unutmak (HATALI) → doğrusu x-3, x ≠ -3 (4. adımda bulduk)","anlatim":"En sık hata: sadeleştirme yapılınca x=-3 kısıtlamasının kaybolduğu sanılır. Oysa payda o noktada tanımsız kalmaya devam eder, sadeleşme bunu silmez.","doldur":[]}],"anahtar":[{"ornek":"sadeleştirme","kok":"sadele"},{"ornek":"kısıtlaması","kok":"kısıtl"},{"ornek":"kümesi","kok":"kümesi"},{"ornek":"özdeşliğiyle","kok":"özdeşl"},{"ornek":"çarpanlar","kok":"çarpan"},{"ornek":"paydayı","kok":"payday"}],"konuGiris":{"harita":"Ne zaman test edilir: pay ve paydası çarpanlara ayrılabilen rasyonel ifade verildiğinde test edilir. Nasıl ölçülür: doğru özdeşlik/çarpanlara ayırma seçilip ortak çarpanın sadeleştirilmesiyle ölçülür. Nasıl kaydedilir: sadeleşmiş ifade ile birlikte orijinal paydayı sıfır yapan x değeri kısıtlama olarak yazılır.","desen":"Bu konu 2 dönemde soruldu; tuzak, sadeleşen ifadenin tanımlı görünmesine rağmen orijinal paydayı sıfır yapan değerin hâlâ kısıtlama olarak kalması gerektiğini unutturmaktır. İkinci tuzak, toplama halindeki terimlerin sadeleştirilebileceği yanılgısıdır; sadeleştirme yalnızca çarpanlar arasında yapılır. Bu soru p.28\u0027deki \u0027tanımsızlık sadeleştirmeden sonra da geçerliliğini korur\u0027 kuralından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"a²-b² ifadesinin (a-b)(a+b) çarpanlarına ayrılışı","ad":"iki kare farkı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"pay ve paydada aynı anda bulunan çarpan ifadesi","ad":"ortak çarpan","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"paydayı sıfır yapan değerin ifadeden çıkarılması","ad":"tanım kümesi kısıtlaması","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"ortak çarpanlar götürüldükten sonra kalan basit ifade","ad":"sadeleştirilmiş ifade","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Rasyonel bir ifade verilir, sadeleştirilmiş hali ve tanım kümesi kısıtlaması istenir.","panel_ornek":"Bir markette 12 kişilik bir kutu bisküviyi arkadaşlarınla 4\u0027lü paylaşınca kaç kutu düştüğünü hesaplarsın, ama kutu sayısı sıfırsa paylaşım anlamsız kalır. İşte matematikte de bir ifadeyi sadeleştirirken paydayı sıfır yapan değeri hesaba katmazsın. Günlük hayatta da \u0027bölen sıfır olamaz\u0027 kuralı hep geçerlidir.","ornek":"Bir markette 12 kişilik bir kutu bisküviyi arkadaşlarınla 4\u0027lü paylaşınca kaç kutu düştüğünü hesaplarsın, ama kutu sayısı sıfırsa paylaşım anlamsız kalır. İşte matematikte de bir ifadeyi sadeleştirirken paydayı sıfır yapan değeri hesaba katmazsın. Günlük hayatta da \u0027bölen sıfır olamaz\u0027 kuralı hep geçerlidir.","yontemler":"Önce pay iki kare farkı özdeşliğiyle çarpanlarına ayrılır, ortak çarpan payda ile sadeleştirilir; ardından orijinal paydayı sıfır yapan değer kısıtlama olarak yazılır.","nedir":"Cebirsel ifade sadeleştirme, payı ve paydayı çarpanlarına ayırıp ortak çarpanları götürerek ifadeyi basitleştirmektir. Sınav, çarpanlara ayırma becerisini ve tanım kümesi kısıtlamasını unutmama becerisini ölçer."},"olay":"(x-3)(x+3)/(x+3) = x-3, kısıtlama x≠-3.","tuzak":{"C":{"ad":"Tanım Kümesi Kaynağı Tuzağı","metin":"kısıtlamayı sadeleşmiş ifadeden (x-3=0 için x=3) okudun, oysa tanımsızlık ORİJİNAL paydadan gelir. Doğrusu: payda x+3 sıfır olduğunda (x=-3) ifade tanımsızdır, x≠3 değil x≠-3 yazılmalıdır."},"E":{"ad":"Bileşik Hata Tuzağı","metin":"hem çarpanı ters aldın (x+3 yazdın) hem de kısıtlamayı yanlış kaynaktan (sadeleşmiş ifadeden) türettin. Doğrusu: doğru çarpan x-3, doğru kısıtlama x≠-3\u0027tür."},"D":{"ad":"Kısıtlama Atlama Tuzağı","metin":"sadeleştirmeyi doğru yaptın ama paydayı sıfır yapan x=-3 değerini belirtmeyi unuttun. Doğrusu: sadeleşen ifade tanımlı görünse de orijinal ifadedeki tanımsızlık geçerliliğini korur, x-3 (x ≠ -3) yazılmalıdır."},"B":{"ad":"Çarpan Karıştırma Tuzağı","metin":"iki kare farkını (x-3)(x+3) yerine yanlışlıkla payda ile aynı çarpanı payda sanıp x+3 olarak bıraktın. Doğrusu: sadeleşen çarpan x+3 değil x-3\u0027tür, sonuç x-3 (x ≠ -3) olmalıdır."}},"celdiriciYol":{"C":"sadeleşmiş ifade x-3=0 için x=3 dedin ve bunu tanımsızlık sandın = x-3 (x ≠ 3) (kısıtlama kaynağını yanlış aldın)","E":"hem çarpanı ters aldın hem kısıtlamayı yanlış kaynaktan türettin = x+3 (x ≠ 3) (bileşik hata)","D":"sadeleştirmeyi doğru yaptın ama kısıtlamayı hiç yazmadın = x-3 (kısıtlamayı atladın)","B":"x²-9=(x-3)(x+3) çarpanlarını payda ile karıştırıp geriye kalanı x+3 yazdın = x+3 (x ≠ -3) (çarpan karıştırma)"},"hap":"Sadeleştirme yalnız çarpanlar arasında yapılır ve orijinal paydayı sıfır yapan değer, sadeleşmeden sonra da tanım kümesi dışında kalır.","teshis":{"C":{"gercek":"Tanımsızlık, sadeleştirmeden ÖNCEKİ orijinal paydanın sıfır olduğu değerden gelir ve sadeleştirmeden sonra da geçerliliğini korur.","ayirt":"Bu kısıtlamayı orijinal paydadan mı buldum?","paragraf":"Sadeleştirme sonrası kısıtlamanın korunması kuralı","yanilgi":"Tanım kümesi kısıtlamasını sadeleşmiş ifadenin kökünden (x-3=0) türetilebileceğini sanıyorsun."},"E":{"gercek":"Doğru çarpan x-3, doğru kısıtlama kaynağı orijinal payda (x+3=0 → x=-3) olmalıdır.","ayirt":"Hem çarpanı hem kısıtlamayı ayrı ayrı doğru kaynaktan mı kontrol ettim?","paragraf":"İki kare farkı ve tanımsızlık kurallarının birlikte uygulanması","yanilgi":"Hem çarpanı ters aldığını hem kısıtlamayı yanlış kaynaktan türettiğini fark etmiyorsun; iki hatayı üst üste yapıyorsun."},"A":{"gercek":"a²-b²=(a-b)(a+b) özdeşliğiyle sadeleşen ifade x-3\u0027tür; tanımsızlık orijinal paydanın sıfır olduğu x=-3 değerinde kalıcıdır.","ayirt":"Kısıtlamayı sadeleşmiş ifadeden mi yoksa orijinal paydadan mı okudum?","paragraf":"İki kare farkı özdeşliği; tanımsızlık kuralı","yanilgi":"Bu şıkkı eleyen öğrenci iki kare farkını doğru çarpanlara ayırıp kısıtlamayı orijinal paydadan okumayı gereksiz sanır."},"D":{"gercek":"Sadeleştirmeden sonra ifade tanımlı görünse bile orijinal ifadedeki tanımsızlık kaybolmaz, cevaba kısıtlamayla birlikte yazılır.","ayirt":"Sadeleşmiş ifadenin görünümüne değil, orijinal paydaya mı baktım?","paragraf":"Tanımsızlığın kalıcılığı kuralı","yanilgi":"Sadeleşen ifade her x değeri için tanımlı göründüğü için kısıtlama yazmaya gerek olmadığını düşünüyorsun."},"B":{"gercek":"(x-3)(x+3)/(x+3) ifadesinde sadeleşen ve payda ile aynı olan çarpan x+3\u0027tür, geriye kalan x-3\u0027tür.","ayirt":"Sadeleşme sonrası GERİYE KALAN çarpanı mı yazdım, yoksa sadeleşip giden çarpanı mı?","paragraf":"Ortak çarpan sadeleştirme kuralı","yanilgi":"x²-9\u0027u çarpanlarına ayırırken hangi çarpanın paydayla sadeleştiğini karıştırıp payda ile aynı görünen x+3\u0027ü sonuç sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 11"},"kural":"iki nokta A(x1,y1), B(x2,y2) için önce m=(y2−y1)/(x2−x1) bulunur, sonra y−y1=m(x−x1) yazılıp genel biçime çevrilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 11","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Denklemi bulduktan sonra mutlaka iki noktayı da yerine koyup sıfır çıkıp çıkmadığını kontrol et, sağlama en hızlı eleme yoludur.","konu":"doğru denklemi","tablo":{"satirlar":[["VERİLENLER","-","-"],["A noktası","(1, 3)","-"],["B noktası","(4, 9)","-"],["HESAP","-","-"],["Eğim","(9-3)/(4-1)","2"],["Nokta-eğim","Y-3=2(x-1)","Y=2x+1"],["Genel biçim","Y=2x+1 düzenle","2x-y+1=0"],["Sağlama","2(4)-9+1","0"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"x − 2y + 5 = 0","E":"2x − y + 3 = 0","A":"2x − y + 1 = 0","D":"2x − y − 1 = 0","B":"2x + y − 5 = 0"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Eğim formülü ters uygulanmış, x ve y farkları yer değiştirilerek m = 1/2 bulunmuş; doğru sıra y farkı bölü x farkı olup m = 2\u0027dir.","E":"B noktasının koordinatları yanlış okunmuş (4, 9) yerine (3, 9) kullanılmış; doğru nokta B(4, 9) ve sağlama bu koordinatlarla yapılmalıdır.","D":"Nokta-eğim adımında y = 2x + 1 bulunduktan sonra sabit terim işareti yanlış yazılmış (−1 yerine +1); genel biçim 2x − y + 1 = 0\u0027dır.","B":"Eğim hesaplanırken pay ve payda ters sırayla çıkarılmış (3 − 9 değil 9 − 3 alınmalı), işaret ters çıkmış: m = −2 yerine m = 2 olması gerekir."},"dogru":"İki noktadan geçen doğrunun eğimini y farkının x farkına bölerek buluruz: (9−3)/(4−1) = 2. Sonra bu eğimi ve bir noktayı nokta-eğim formülüne yerleştirir genel biçime çeviririz: y − 3 = 2(x − 1) → 2x − y + 1 = 0.","sinav":"İki nokta verilen doğrunun denklemi, eğim formülü m = (y₂ − y₁)/(x₂ − x₁) ve nokta-eğim biçimi y − y₀ = m(x − x₀) kullanılarak bulunur.","kavramlar":[{"kaynak":"TEORI","tanim":"Eğimi m ve geçtiği bir noktası (x₀, y₀) bilinen doğru, y − y₀ = m(x − x₀) şeklinde yazılır.","ad":"Nokta-eğim biçimi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["Eğim","(10-4)/(3-1)","3"],["Nokta-eğim","Y-4=3(x-1)","Y=3x+1"],["Genel biçim","Y=3x+1 düzenle","3x-y+1=0"],["Sağlama","3(3)-10+1","0"]]},"tur":"tablo","soru":"C(1, 4) ve D(3, 10) noktalarından geçen doğrunun genel denklemi aşağıdakilerden hangisidir?","verilen":[],"hedef":"Tabloyu doldur ve doğrunun genel denkleminin 3x-y+1=0 olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"A(1, 3) ve B(4, 9) noktalarından geçen doğrunun genel denklemi aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-19","verilenler":[{"deger":"(1, 3)","anlam":"Doğru üzerindeki birinci nokta, eğim hesabında (x1,y1) olarak kullanılır.","ad":"A noktası"},{"deger":"(4, 9)","anlam":"Doğru üzerindeki ikinci nokta, eğim hesabında (x2,y2) olarak kullanılır.","ad":"B noktası"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Doğrunun Denklemi (İki Nokta Biçimi)","dogru":"A","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: A noktası (1; 3) (soruda verilen); B noktası (4; 9) (soruda verilen)","anlatim":"Soru bize şunları vermiş: A(1; 3) ve B(4; 9) noktaları. İstenen: bu iki noktadan geçen doğrunun genel denklemi.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Eğim = (y2 - y1) / (x2 - x1) = (9 (soruda verilen) - 3 (soruda verilen)) / (4 (soruda verilen) - 1 (soruda verilen)) = 6 / 3 = 2","anlatim":"Eğim iki nokta arasındaki dikey değişimin yatay değişime bölümüdür. Önce eğimi buluyoruz çünkü doğru denklemi eğimsiz yazılamaz.","doldur":[[4,1],[4,2]]},{"formul":"Nokta-eğim = y - y1 = m × (x - x1) = y - 3 (soruda verilen) = 2 (2. adımda bulduk) × (x - 1 (soruda verilen)) = y = 2x + 1","anlatim":"Nokta-eğim formülü bir nokta ile eğim bilindiğinde doğruyu yazdırır. A noktasını kullanıyoruz çünkü elimizdeki noktalardan biri yeter.","doldur":[[5,1],[5,2]]},{"formul":"Genel biçim = y = 2x + 1 (3. adımda bulduk) düzenle = 2x - y + 1 = 0","anlatim":"Genel biçim ax + by + c = 0 şeklidir. Nokta-eğim sonucunu düzenleyip bu kalıba sokuyoruz.","doldur":[[6,1],[6,2]]},{"formul":"Sağlama = 2 × 4 (soruda verilen) - 9 (soruda verilen) + 1 (4. adımda bulduk) = 8 - 9 + 1 = 0","anlatim":"Sağlama için B noktasını denklemde yerine koyuyoruz. Sonuç sıfır çıkarsa denklem doğrudur.","doldur":[[7,1],[7,2]]},{"formul":"Yanlış yol: (4 - 1) / (9 - 3) = 3/6 = 0,5 (HATALI) → doğrusu 2x - y + 1 = 0 (4. adımda bulduk)","anlatim":"En sık hata eğimi ters bölmektir, yani (x2-x1)/(y2-y1) yazmaktır. Bu ters eğim yanlış doğruya götürür.","doldur":[]}],"anahtar":[{"ornek":"denklemi","kok":"denkle"},{"ornek":"doğruda","kok":"doğrud"},{"ornek":"noktadan","kok":"noktad"},{"ornek":"biçime","kok":"biçime"},{"ornek":"çevrilir","kok":"çevril"},{"ornek":"doğruyu","kok":"doğruy"}],"konuGiris":{"harita":"Eğim ne zaman hesaplanır: iki nokta verildiğinde ilk adımda bulunur. Denklem nasıl kurulur: bulunan eğim ve noktalardan biri nokta-eğim biçimine yerleştirilir. Sonuç nasıl yazılır: istenen biçime, genellikle genel biçime (Ax+By+C=0) çevrilerek kaydedilir.","desen":"Soru genellikle iki nokta verip genel denklemi seçenekler arasından bulmayı ister. Tuzak, eğim işaretinin yanlış hesaplanması ya da genel biçime çevirirken işaret hatası yapılmasıdır (p.28 çözüm adımları). Bu soru, iki noktadan doğru denklemi kurma noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"doğrunun x arttıkça y\u0027nin ne kadar değiştiğini gösteren oran","ad":"eğim (m)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"eğim ve bir noktadan denklemi kurma yöntemi","ad":"nokta-eğim biçimi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"doğru denkleminin standart, sabitlerle yazılan hali","ad":"genel biçim (Ax+By+C=0)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"noktanın düzlemdeki yerini gösteren x ve y değerleri","ad":"koordinat","kim":"piyasa fiyatlar"}],"sinavda":"İki nokta verilir, bu noktalardan geçen doğrunun genel denklemi seçenekler arasından istenir.","panel_ornek":"İki arkadaş market kurup kâr hesaplıyor: birinci ay 5 lira, ikinci ay 9 lira kâr etmişler. Aradaki artış her ay sabit kalırsa, üçüncü ayki kârı da bu artış oranıyla tahmin edebilirsin. İşte bu sabit artış oranı, doğrunun eğimidir.","ornek":"İki arkadaş market kurup kâr hesaplıyor: birinci ay 5 lira, ikinci ay 9 lira kâr etmişler. Aradaki artış her ay sabit kalırsa, üçüncü ayki kârı da bu artış oranıyla tahmin edebilirsin. İşte bu sabit artış oranı, doğrunun eğimidir.","yontemler":"Önce eğim m=(y2-y1)/(x2-x1) hesaplanır, sonra nokta-eğim biçimiyle denklem kurulup genel biçime çevrilir; sağlama için ikinci nokta denklemde kontrol edilir.","nedir":"Doğru denklemi, iki noktadan geçen doğrunun eğimini ve denklemini bulmayı sağlar. Sınav, verilen iki noktadan eğimi ve genel denklemi doğru kurup kuramadığını ölçer."},"olay":"m=(9−3)/(4−1)=6/3=2; y−3=2(x−1)=2x−2; y=2x+1; genel biçim 2x−y+1=0.","tuzak":{"C":{"ad":"Oran Ters Çevirme Tuzağı","metin":"eğim formülünde pay ile paydayı yer değiştirip m=(x2−x1)/(y2−y1)=3/6=1/2 aldın. Doğrusu: eğim y farkının x farkına oranıdır, m=6/3=2\u0027dir."},"E":{"ad":"Veri Karıştırma Tuzağı","metin":"B noktasının koordinatlarını (4,9) yerine (3,9) okuyup y−9=2(x−3) ile işlem yaptın. Doğrusu: B noktası (4,9)\u0027dur, sağlama bu noktayla yapılmalıdır."},"D":{"ad":"Sabit Terim İşaret Tuzağı","metin":"y=2x+1 denklemindeki sabiti yanlış işaretle yazıp y=2x−1\u0027i genel biçime taşıdın. Doğrusu: nokta-eğim adımında n=+1 çıkar, 2x−y+1=0 doğrudur."},"B":{"ad":"Ters Fark Tuzağı","metin":"eğimi bulurken payı ve paydayı ters sırayla çıkarıp m=(3−9)/(4−1)=−2 aldın, işaret ters çıktı. Doğrusu: eğim m=(y2−y1)/(x2−x1) sırasıyla hesaplanır, m=2 çıkar."}},"celdiriciYol":{"C":"m=(4-1)/(9-3)=1/2 → y-3=(1/2)(x-1) → x-2y+5=0 (eğim formülünde pay-payda ters çevirme)","E":"B(3,9) sanılarak y-9=2(x-3) → 2x-y+3=0 (nokta koordinatını yanlış okuma)","D":"y=2x+1 sabiti ters işaretle y=2x-1 → 2x-y-1=0 (sabit terim işaret hatası)","B":"m=(3-9)/(4-1)=-2 → y-3=-2(x-1) → 2x+y-5=0 (eğim farkını ters sırayla alma)"},"hap":"İki noktadan geçen doğruda eğim daima m=(y2−y1)/(x2−x1) sırasıyla hesaplanır, sonra nokta-eğim biçimi genel biçime çevrilir.","teshis":{"C":{"gercek":"Eğim m, y değişiminin x değişimine oranıdır: m=(y2−y1)/(x2−x1), tersi değildir.","ayirt":"m\u0027yi yazarken payda hangi eksenin farkı var, y mi x mi?","paragraf":"TESMER SGS Matematik Ders Notu - Eğim Tanımı","yanilgi":"Eğim formülünü x farkı bölü y farkı olarak ezberlemişsin, pay-payda yer değiştirmiş."},"E":{"gercek":"Hesaba başlamadan önce verilen noktalar sorudan tekrar kontrol edilmeli, B noktası (4,9)\u0027dur.","ayirt":"Bulduğum denklemde soruda verilen her iki noktayı da yerine koyup sağlama yaptım mı?","paragraf":"TESMER SGS Matematik Ders Notu - Çözüm Adımları/Sağlama","yanilgi":"Verilen noktaların koordinatlarını hızlı okurken rakamları karıştırıp yanlış noktayla işlem yapıyorsun."},"A":{"gercek":"İki nokta biçiminde önce m=(y2−y1)/(x2−x1) bulunur, sonra nokta-eğim denklemi genel biçime çevrilir.","ayirt":"Eğimi bulduktan sonra iki noktayı da denklemde deneyip sağlama yaptım mı?","paragraf":"TESMER SGS Matematik Ders Notu - Doğru Denklemi, Biçim (2)","yanilgi":"Bu şıkkı eleyen öğrenci eğim formülünü doğru kurduğuna güvenmeyip başka bir sıraya kayabilir."},"D":{"gercek":"y=mx+n bulunduktan sonra genel biçime mx−y+n=0 olarak, n\u0027nin kendi işaretiyle taşınır.","ayirt":"y=2x+1\u0027i genel biçime yazarken n\u0027nin işaretini değiştirmeden mi taşıdım?","paragraf":"TESMER SGS Matematik Ders Notu - Genel Biçim","yanilgi":"Nokta-eğim biçiminden genel biçime geçerken sabit terimin işaretini otomatik ters çeviriyorsun."},"B":{"gercek":"m=(y2−y1)/(x2−x1) formülünde y ve x farkları AYNI sırada (ikinci nokta eksi birinci nokta) alınır.","ayirt":"Payda ve paydadaki noktaların sırası birbiriyle tutarlı mı, ikisi de 2-1 mi yoksa biri 1-2 mi?","paragraf":"TESMER SGS Matematik Ders Notu - Eğim Tanımı","yanilgi":"Eğim formülünde pay ile paydayı hangi noktadan aldığını karıştırıp farkı ters sırayla çıkarıyorsun."}},"verilen":[[1,1],[2,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 11"},"kural":"iki nokta biçiminde önce m=(y2−y1)/(x2−x1) bulunur, sonra y−y0=m(x−x0) yazılıp istenen biçime çevrilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 11","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce iki ara noktayı bul, sonra eğimi işaretiyle yaz, en son denklemi genel biçime çevirip verilen noktalarla sağla.","konu":"doğru denklemi","tablo":{"satirlar":[["VERİLENLER","-"],["d1 doğrusu","2x − y − 1 = 0"],["d2 doğrusu","x + y − 5 = 0"],["d3 doğrusu","2x − 3y + 12 = 0"],["HESAP","-"],["Kesişim noktası (2x−y−1=0, x+y−5=0)","(2,3)"],["2x−3y+12=0 doğrusunun y eksenini kestiği nokta","(0,4)"],["Eğim m=(3−4)/(2−0)","−1/2"],["Doğru denklemi y−3=−1/2(x−2)","X+2y−8=0"]],"basliklar":["Adım","Sonuç"]},"siklar":{"C":"x + 2y − 8 = 0","E":"2x + y − 4 = 0","A":"2x + 3y − 12 = 0","D":"x − 2y + 8 = 0","B":"7x − 2y − 8 = 0"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Eğimi −1/2 yerine +1/2 alırsan bu sonucu elde edersin; işaret kontrolü gerekir.","E":"Eğim formülünü ters yazıp (x₂−x₁)/(y₂−y₁) biçimde −2 bulursan bu çıkar; pay ve paydayı karıştırmamalı.","A":"Kesişim noktasını (3,2) diye bulup hata yaptığında çıkar bu şık; gerçek kesişim (2,3)\u0027tür.","B":"Y eksenini kesen noktayı (0,−4) diye okuduğunda ortaya çıkar; x=0 yazınca (0,4) bulunması gerek."},"dogru":"İlk iki doğrunun kesiştiği noktayı bul (2,3). Üçüncü doğruda x=0 yaz, y eksenini kestiği noktayı bul (0,4). Bu iki noktadan geçen doğrunun eğimini hesapla: m=(3−4)/(2−0)=−1/2. Nokta-eğim formülü kullan: y−3=−1/2(x−2), düzenle: x+2y−8=0.","sinav":"İki doğrunun kesişim noktasını ve üçüncü doğrunun y eksenini kestiği noktayı bulup, bu iki noktadan geçen doğrunun denklemi yazılır.","kavramlar":[{"kaynak":"TEORI","tanim":"Eğimi m olan ve bir noktası (x₀,y₀) bilinen doğrunun denklemi; y−y₀=m(x−x₀) şeklinde yazılır.","ad":"Nokta-eğim biçimi"},{"kaynak":"TEORI","tanim":"Bilinen iki noktasından doğrunun denklemini yazarken önce eğim bulunur, sonra nokta-eğim formülü uygulanır.","ad":"İki nokta biçimi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Adım","Sonuç"],"satirlar":[["Kesişim noktası (3x−y−4=0, x+y−8=0)","(3,5)"],["3x−2y+6=0 doğrusunun y eksenini kestiği nokta","(0,3)"],["Eğim m=(5−3)/(3−0)","2/3"],["Doğru denklemi y−5=2/3(x−3)","2x−3y+9=0"]]},"tur":"tablo","soru":"3x − y − 4 = 0 ve x + y − 8 = 0 doğrularının kesişim noktasından ve 3x − 2y + 6 = 0 doğrusunun y eksenini kestiği noktadan geçen doğrunun denklemi aşağıdakilerden hangisidir?","verilen":[],"hedef":"Tabloyu doldur ve doğrunun denkleminin 2x−3y+9=0 olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"2x − y − 1 = 0 ve x + y − 5 = 0 doğrularının kesişim noktasından ve 2x − 3y + 12 = 0 doğrusunun y eksenini kestiği noktadan geçen doğrunun denklemi aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-19","verilenler":[{"deger":"2x − y − 1 = 0","anlam":"Kesişim noktasını bulmak için ikinci doğruyla birlikte çözülür.","ad":"d1 doğrusu"},{"deger":"x + y − 5 = 0","anlam":"d1 ile birlikte çözülerek kesişim noktası (2,3) bulunur.","ad":"d2 doğrusu"},{"deger":"2x − 3y + 12 = 0","anlam":"x=0 konularak y eksenini kestiği nokta (0,4) bulunur.","ad":"d3 doğrusu"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu – Doğru Denklemi, İki Nokta Biçimi ve Genel Biçim (Ax+By+C=0)","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: 2x − y − 1 = 0 (soruda verilen); x + y − 5 = 0 (soruda verilen); 2x − 3y + 12 = 0 (soruda verilen)","anlatim":"Soru bize şunları vermiş: bu iki doğrunun kesişim noktasını bulacağız ve üçüncü doğrunun y eksenini kestiği noktayı kullanacağız. Bu iki nokta bulunan doğrunun üzerinde olacak.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"2x − y − 1 = 0 ve x + y − 5 = 0 toplanır → 3x − 6 = 0 → x = 2 (hesapladık); y = 5 − 2 (hesapladık) = 3","anlatim":"İki doğrunun kesişim noktasını bulmak için denklemleri ortak çözüyoruz. Ortak çözüm, her iki denklemi de sağlayan tek noktayı verir.","doldur":[[5,1],[8,1]]},{"formul":"x = 0 (y ekseni koşulu) → 2(0) − 3y + 12 = 0 → y = 4 (hesapladık)","anlatim":"Şimdi 2x − 3y + 12 = 0 doğrusunun y eksenini kestiği noktayı buluyoruz. Y eksenini kestiği yerde x her zaman sıfırdır.","doldur":[]},{"formul":"Eğim m = (y2 − y1) / (x2 − x1) = (3 (2. adımda bulduk) − 4 (3. adımda bulduk)) / (2 (2. adımda bulduk) − 0 (3. adımda bulduk)) = −1 / 2 = −1/2","anlatim":"İki noktamız var, şimdi bu iki noktadan geçen doğrunun eğimini buluyoruz. Eğim, doğrunun ne kadar dik olduğunu gösterir.","doldur":[[7,1]]},{"formul":"y − y0 = m(x − x0) → y − 3 (2. adımda bulduk) = −1/2 (4. adımda bulduk) (x − 2 (2. adımda bulduk)) → 2y − 6 = −x + 2 → x + 2y − 8 = 0","anlatim":"Eğimi ve bir noktayı bildiğimize göre nokta-eğim formülüyle doğrunun denklemini yazıyoruz. Sonra denklemi sade hâle çeviriyoruz.","doldur":[]},{"formul":"Sonuç: doğru denklemi = X + 2Y − 8 = 0 (5. adımda bulduk)","anlatim":"Sonuç: aradığımız doğrunun denklemi bulundu. Bu denklem kesişim noktasını da y eksenini kestiği noktayı da sağlıyor.","doldur":[]},{"formul":"Ters durum: (x1,y1) ile (x2,y2) yer değiştirse → m aynı kalır (−1/2)","anlatim":"Ters durumda: eğer noktalar ters seçilse (örneğin (0,4)\u0027ten (2,3)\u0027e gitseydik) eğim değişmezdi, çünkü eğim iki nokta sırasından bağımsızdır.","doldur":[]},{"formul":"Yanlış yol: y = 0 alıp 2x + 12 = 0 → x = −6 (HATALI) → doğrusu x = 0 alınıp y = 4 (3. adımda bulduk)","anlatim":"En sık hata: öğrenci y eksenini kesme noktasında yanlışlıkla y=0 alıp x eksenini bulur. Bu yanlış nokta ile eğim ve denklem tamamen değişir.","doldur":[]}],"anahtar":[{"ornek":"doğrunun","kok":"doğrun"},{"ornek":"denklemleri","kok":"denkle"},{"ornek":"eksenini","kok":"ekseni"},{"ornek":"noktayı","kok":"noktay"},{"ornek":"noktasını","kok":"noktas"},{"ornek":"kestiği","kok":"kestiğ"}],"konuGiris":{"harita":"Ne zaman test edilir: iki nokta, kesişim noktası veya eksen kesimleri verildiğinde doğru denklemi kurulur mu diye sorulur. Nasıl ölçülür: bulunan denklemin şıklardaki genel biçimle eşleşip eşleşmediğine bakılır. Nasıl kaydedilir: sonuç Ax+By+C=0 ya da y=mx+n biçiminde yazılır.","desen":"Soru önce iki doğrunun kesişim noktasını buldurup sonra başka bir doğrunun eksen kesim noktasıyla birleştirerek yeni doğru kurdurur; öğrenci genelde eğim işaretini karıştırır (p.28). İki dönemde bu çift-adımlı kesişim+eksen sorusu çıkmıştır. Bu soru genel biçimden eğim okuma ve y ekseni kesim noktası hesaplama noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Doğrunun x birim artışında y\u0027nin değişim oranı","ad":"Eğim (m)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"İki doğrunun ortak sağladığı (x,y) çözüm noktası","ad":"Kesişim noktası","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Doğrunun x=0 olduğunda aldığı y değeri","ad":"y eksenini kesme noktası (n)","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Doğrunun standart cebirsel gösterim biçimi","ad":"Genel biçim (Ax+By+C=0)","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"İki denklem sistemi ve bir doğrunun eksen kesim bilgisi verilir, bu iki noktadan geçen doğrunun denklemi istenir.","panel_ornek":"İkinci el bir bisiklet ilanında fiyat her ay 10 TL azalıyor; başlangıç fiyatı 300 TL ise 3 ay sonra fiyat 270 TL olur. Burada \u0027her ay 10 TL azalma\u0027 eğim, \u0027300 TL\u0027 başlangıç noktasıdır, tıpkı doğru denkleminde m ve n gibi.","ornek":"İkinci el bir bisiklet ilanında fiyat her ay 10 TL azalıyor; başlangıç fiyatı 300 TL ise 3 ay sonra fiyat 270 TL olur. Burada \u0027her ay 10 TL azalma\u0027 eğim, \u0027300 TL\u0027 başlangıç noktasıdır, tıpkı doğru denkleminde m ve n gibi.","yontemler":"Önce kesişim noktası denklem sisteminden bulunur, sonra iki nokta biçimiyle eğim hesaplanıp genel denkleme dönüştürülür; sağlama için her iki nokta denklemde denenir.","nedir":"Doğru denklemi konusu, düzlemdeki bir doğrunun eğimini ve eksenleri kestiği noktaları formülle ifade etmeyi öğretir. Sınav, verilen noktalardan veya kesişim bilgilerinden doğru denklemini kurma becerisini ölçer."},"olay":"kesişim (2,3); y ekseni noktası (0,4); m=(3−4)/(2−0)=−1/2; y−3=−1/2(x−2) → x+2y−8=0.","tuzak":{"D":{"ad":"Eğim İşareti Tuzağı","metin":"(2,3) ve (0,4) noktalarını doğru bulup eğimi −1/2 yerine +1/2 alarak denklemi kurdun. Doğrusu: eğim m=(3−4)/(2−0)=−1/2\u0027dir, doğru denklem x+2y−8=0\u0027dır."},"E":{"ad":"Eğim Ters Alma Tuzağı","metin":"eğimi (y2−y1)/(x2−x1) yerine (x2−x1)/(y2−y1) şeklinde ters kurup m=−2 aldın. Doğrusu: eğim (y2−y1)/(x2−x1)=−1/2\u0027dir, doğru denklem x+2y−8=0\u0027dır."},"A":{"ad":"Kesişim Noktası Tuzağı","metin":"2x−y−1=0 ve x+y−5=0 denklemlerini çözerken işaret hatasıyla noktayı (3,2) bulup (0,4) ile birleştirdin. Doğrusu: kesişim noktası (2,3)\u0027tür, doğru denklem x+2y−8=0\u0027dır."},"B":{"ad":"Y Ekseni Kesme Tuzağı","metin":"2x−3y+12=0\u0027da x=0 için −3y+12=0\u0027ı y=−4 diye çözdün. Doğrusu: y eksenini kestiği nokta (0,4)\u0027tür, doğru denklem x+2y−8=0\u0027dır."}},"celdiriciYol":{"D":"(2,3) ve (0,4) ile eğim +1/2 alınır, y−4=1/2x → x−2y+8=0 (eğim işareti hatası)","E":"(2,3) ve (0,4) ile eğim ters kurulup (0−2)/(4−3)=−2 alınır, y−4=−2x → 2x+y−4=0 (eğim ters alma hatası)","A":"d1 ve d2 çözümünde işaret hatasıyla nokta (3,2) bulunur; (3,2) ve (0,4) ile eğim (2−4)/(3−0)=−2/3, y−4=−2/3x → 2x+3y−12=0 (kesişim noktası hatası)","B":"2x−3y+12=0\u0027da x=0 için y=−4 bulunur; (2,3) ve (0,−4) ile eğim (3+4)/2=7/2, y+4=7/2x → 7x−2y−8=0 (y ekseni kesme işaret hatası)"},"hap":"İki nokta biçiminde eğim daima m=(y2−y1)/(x2−x1) olarak, işaretiyle birlikte hesaplanır.","teshis":{"C":{"gercek":"İki nokta A(x1,y1), B(x2,y2) için m=(y2−y1)/(x2−x1) formülü sabittir; nokta-eğim biçimi bu m ile kurulur.","ayirt":"Bulduğum eğimi iki noktadan da tekrar hesaplayıp aynı sonucu alıyor muyum?","paragraf":"İki Nokta Biçimi ve Genel Biçime Çevirme","yanilgi":"Doğru şıkkı ELEYEN öğrenci, iki nokta biçiminde eğim formülünün payı ve paydasını karıştırdığını sanmaz."},"E":{"gercek":"Eğim daima (y\u0027deki değişim)/(x\u0027teki değişim) olarak tanımlanır, ters kurulursa dik doğru eğimi elde edilir.","ayirt":"Formülün payına y farkını, paydasına x farkını yazdığımdan eminim değil miyim?","paragraf":"Eğim Tanımı","yanilgi":"Eğim formülünün pay ve paydasını yer değiştirip ters kurduğunun farkında değilsin."},"A":{"gercek":"İki doğrunun kesişim noktası, denklem sisteminin ortak çözümüdür; her işlem satırında işaret açıkça korunmalıdır.","ayirt":"Bulduğum noktayı her iki denklemde de yerine koyup sıfır elde ediyor muyum?","paragraf":"İki Doğrunun Kesişimi","yanilgi":"İki denklemi taraf tarafa toplarken/çıkarırken işaret takibini gözden kaçırıp kesişim noktasını yanlış bulduğunu fark etmiyorsun."},"D":{"gercek":"m=(y2−y1)/(x2−x1) hesaplanırken pay ve paydanın işareti birlikte takip edilir, sonuç negatifse öyle bırakılır.","ayirt":"Eğimi bulduktan sonra iki noktayı da denklemde yerine koyup sıfır elde ediyor muyum?","paragraf":"Eğim Hesabında İşaret Takibi","yanilgi":"Eğim formülündeki eksi işaretinin payda veya paydan geldiğini karıştırıp pozitif aldığını fark etmiyorsun."},"B":{"gercek":"Genel biçimde y ekseni kesişimi y=−C/B\u0027dir; işaret hatası doğrudan yanlış noktaya götürür.","ayirt":"Bulduğum y değerini orijinal denklemde x=0 ile tekrar sağlıyor muyum?","paragraf":"Genel Biçimde Eksen Kesişimleri","yanilgi":"Ax+By+C=0 biçiminde x=0 koyup y\u0027yi çözerken bölme işaretini kontrol etmediğini düşünmüyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 11"},"kural":"Ax+By+C=0 biçiminde eğim −A/B\u0027dir; dik doğrularda eğimler çarpımı −1 olmalıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 11","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce verilen doğrunun eğimini bul, sonra dik/paralel ayrımını netleştir, en son doğru noktayı yerine koy.","konu":"doğru denklemi","tablo":{"satirlar":[["VERİLENLER","-"],["x ekseni kesim noktası","(5, 0)"],["verilen doğru denklemi","2x + 4y − 8 = 0"],["HESAP","-"],["Verilen doğrunun eğimi (2x+4y-8=0)","-1/2"],["Dik doğrunun eğimi (negatif ters)","2"],["Nokta-eğim biçimi ((5,0) noktasından)","Y - 0 = 2(x - 5)"],["Genel biçime dönüştürme","2x - y - 10 = 0"]],"basliklar":["Adım","Sonuç"]},"siklar":{"C":"x + 2y − 5 = 0","E":"x + 2y − 10 = 0","A":"2x − y − 10 = 0","D":"2x − y + 5 = 0","B":"2x + y − 10 = 0"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Dik doğru kurması gerekirken verilen doğrunun eğimini olduğu gibi kullanarak paralel doğru oluşturursan.","E":"Hem eğimi paralel doğrununki gibi (−1/2) alır hem de noktayı (0,5) ile yanlış seçersen çift hata yaparsın.","D":"Eğimi doğru bulursun (m = 2) ama x eksenini kestiği noktayı (5,0) yerine y eksenini kestiği nokta (0,5) olarak karıştırırsın.","B":"Eğimin negatif tersini alırken işaret hatası yaparsın: −2 alırsın oysa −1/2\u0027nin negatif tersi +2 olmalıdır."},"dogru":"Verilen doğrunun eğimini bul (−1/2), diklik kuralıyla ters işaretli ve karşılıklı olan eğimi al (2), sonra (5,0) noktasıyla nokta-eğim biçimini yaz. Sonuç: 2x − y − 10 = 0.","sinav":"Doğru denklemi konusu; Ax + By + C = 0 biçiminde eğim −A/B\u0027dir, dik doğruların eğimleri çarpımı −1 olmalıdır.","kavramlar":[{"kaynak":"TEORI","tanim":"Bilinen bir noktadan (x₀, y₀) geçen ve eğimi m olan doğru y − y₀ = m(x − x₀) ile yazılır.","ad":"Nokta-eğim biçimi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Adım","Sonuç"],"satirlar":[["Verilen doğrunun eğimi (3x+6y-12=0)","-1/2"],["Dik doğrunun eğimi (negatif ters)","2"],["Nokta-eğim biçimi ((3,0) noktasından)","Y - 0 = 2(x - 3)"],["Genel biçime dönüştürme","2x - y - 6 = 0"]]},"tur":"tablo","soru":"k doğrusunun x eksenini kestiği nokta (3, 0) olup, k doğrusu 3x + 6y − 12 = 0 doğrusuna diktir. Buna göre k doğrusunun denklemini bulunuz.","verilen":[],"hedef":"Tabloyu doldur ve k doğrusunun genel denkleminin 2x - y - 6 = 0 olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"d doğrusunun x eksenini kestiği nokta (5, 0) olup, d doğrusu 2x + 4y − 8 = 0 doğrusuna diktir. Buna göre d doğrusunun denklemi aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-19","verilenler":[{"deger":"(5, 0)","anlam":"d doğrusunun x eksenini kestiği nokta; nokta-eğim biçiminde kullanılacak koordinat.","ad":"x ekseni kesim noktası"},{"deger":"2x + 4y − 8 = 0","anlam":"d doğrusunun dik olduğu doğru; buradan eğim hesaplanır.","ad":"verilen doğru denklemi"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu – Doğru Denklemi ve Dik Doğrular Kuralı","dogru":"A","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: d doğrusunun geçtiği nokta (5, 0) (soruda verilen); d doğrusunun dik olduğu doğru 2x + 4y − 8 = 0 (soruda verilen)","anlatim":"Soru bize şunları vermiş: d doğrusu (5,0) noktasından geçiyor, ve 2x+4y-8=0 doğrusuna dik. İstenen: d doğrusunun denklemi.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Eğim = −A / B = −2 / 4 = −1/2","anlatim":"Ax+By+C=0 nedir? Bir doğrunun genel denklem biçimidir, eğimi −A/B formülüyle bulunur. Burada A=2, B=4 diye okuruz.","doldur":[[5,1],[7,1]]},{"formul":"Dik eğim = −1 / (verilen eğim) = −1 / (-1/2) (2. adımda bulduk) = 2","anlatim":"İki doğru birbirine dikse eğimleri çarpımı −1 olur. Bu yüzden dik doğrunun eğimini bulmak için verilen eğimin negatif tersini alırız.","doldur":[[4,1]]},{"formul":"y − y₀ = m × (x − x₀) = y − 0 = 2 (3. adımda bulduk) × (x − 5 (soruda verilen)) = y = 2(x − 5)","anlatim":"Nokta-eğim biçimi nedir? Bir noktadan geçen ve eğimi bilinen doğruyu yazma yoludur. (5,0) noktasını ve bulduğumuz eğimi burada kullanırız.","doldur":[[6,1]]},{"formul":"y = 2(x − 5) (4. adımda bulduk) → 2x − y − 10 = 0","anlatim":"Şimdi bu denklemi genel biçime, yani Ax+By+C=0 haline getiriyoruz. Bunu yapmak şıklardaki forma uymak için gerekli.","doldur":[]},{"formul":"Sonuç: d doğrusu = 2x − y − 10 = 0 (4. adımda bulduk)","anlatim":"Bulduğumuz denklem d doğrusunun denklemidir. (5,0) noktasından geçtiğini ve eğiminin 2 olduğunu doğrular.","doldur":[]},{"formul":"Ters durum: paralellik istenirse → eğim = −1/2 (2. adımda bulduk)","anlatim":"Ters durumda: sorulan doğru dik değil de paralel olsaydı, eğim aynı kalırdı yani −1/2 kullanılırdı.","doldur":[]},{"formul":"Yanlış yol: eğim = −(−1/2) = 1/2 (HATALI) → doğrusu eğim = 2 (3. adımda bulduk)","anlatim":"En sık hata: öğrenci dik doğru eğimini bulurken sadece işareti değiştirip −(-1/2)=1/2 yazar, ama ters çevirmeyi unutur.","doldur":[]}],"anahtar":[{"ornek":"denklemi","kok":"denkle"},{"ornek":"doğrusu","kok":"doğrus"},{"ornek":"eğimini","kok":"eğimin"},{"ornek":"biçiminde","kok":"biçimi"},{"ornek":"doğrunun","kok":"doğrun"},{"ornek":"noktasından","kok":"noktas"}],"konuGiris":{"harita":"Eğim nasıl bulunur: verilen doğrudan ya da dik/paralel şartından hesaplanır. Denklem hangi noktayla kurulur: soruda verilen noktanın koordinatları eğimle birleştirilir. Sonuç hangi biçimde yazılır: soru genel biçim mi yoksa y = mx + n mi istiyor, ona göre düzenlenir.","desen":"Soru genelde bir doğrunun eğimini vermeden, dik ya da paralel olduğu başka bir doğrudan dolaylı verir; öğrenci önce o doğrunun eğimini bulmalıdır. Genel biçimden eğim okurken işaret hatası en sık tuzaktır (−A/B unutulur). Bu soru genel biçimden eğim çıkarma ve dik doğru şartı noktasından geliyor (p.28).","terimler":[{"kaynak":"sen hesaplarsın","tanim":"doğrunun x ekseniyle yaptığı eğikliği gösteren sayı","ad":"eğim (m)","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"iki doğru dikse eğimleri çarpımı −1 olur kuralı","ad":"dik doğru şartı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"doğrunun A, B, C katsayılarıyla yazılan standart hâli","ad":"genel biçim (Ax+By+C=0)","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"doğrunun y=0 iken kestiği (a,0) koordinatı","ad":"x eksenini kestiği nokta","kim":"kanun sabitler"}],"sinavda":"Bir doğrunun x eksenini kestiği nokta ve başka bir doğruya dik olma şartı verilir, istenen doğrunun denklemi sorulur.","panel_ornek":"Bir arkadaşın 3 ay sonra 2 kişilik yürüyüş yolunda buluşacağınız noktayı belirlemek için, evinden çıkış saatiyle hızını bilip yolun üzerindeki bir noktayı hesaplaması gibi düşün. Elindeki iki bilgiden (bir nokta, bir kural) tüm yolu tarif eden tek bir denklem çıkar. Burada da elindeki nokta ve dik olma şartından aynı mantıkla tek denklem çıkacak.","ornek":"Bir arkadaşın 3 ay sonra 2 kişilik yürüyüş yolunda buluşacağınız noktayı belirlemek için, evinden çıkış saatiyle hızını bilip yolun üzerindeki bir noktayı hesaplaması gibi düşün. Elindeki iki bilgiden (bir nokta, bir kural) tüm yolu tarif eden tek bir denklem çıkar. Burada da elindeki nokta ve dik olma şartından aynı mantıkla tek denklem çıkacak.","yontemler":"Önce verilen doğrunun eğimi genel biçimden −A/B ile bulunur, sonra dik şartıyla ters işaretli çarpmaya göre yeni eğim çıkarılır; bulunan eğim ve verilen noktayla nokta-eğim biçimi kurulup istenen forma çevrilir.","nedir":"Bu konu düzlemdeki bir doğrunun denklemini bulmayı öğretir. Sınav, verilen nokta ve şartlardan doğrunun eğimini ve denklemini kurabilme becerini ölçer."},"olay":"2x+4y−8=0 doğrusunun eğimi −2/4=−1/2; dik doğrunun eğimi bunun negatif tersi olan 2\u0027dir; (5,0) noktasından geçen doğru y−0=2(x−5) olur, düzenlenince 2x−y−10=0 elde edilir.","tuzak":{"C":{"ad":"Paralel-Dik Tuzağı","metin":"verilen doğruya dik olması gerekirken eğimi olduğu gibi (−1/2) alıp paralel doğru kurarsın. Doğrusu: soru dikliği şart koştuğu için eğim negatif ters alınıp 2 olmalıydı."},"E":{"ad":"Çift Hata Tuzağı","metin":"hem eğimi paralel doğrununki gibi (−1/2) alır hem de noktayı (0,5) ile karıştırırsın. Doğrusu: eğim dik doğru kuralıyla 2, nokta ise (5,0) alınmalıdır."},"D":{"ad":"Nokta Karıştırma Tuzağı","metin":"eğimi doğru bulursun (m=2) ama x ekseni kesim noktası (5,0) yerine yanlışlıkla (0,5) noktasını kullanırsın. Doğrusu: doğru (5,0) noktasından geçmelidir, bu da 2x−y−10=0 verir."},"B":{"ad":"İşaret Tuzağı","metin":"negatif ters alırken eğimin işaretini yanlış çevirip m=−2 kullanırsın, oysa −1/2\u0027nin negatif tersi +2\u0027dir. Doğrusu: eğim +2 alınmalı, sonuç 2x−y−10=0 olur."}},"celdiriciYol":{"C":"Dik yerine paralel eğim kullanılır: m=-1/2; y-0=-1/2(x-5) =\u003e x+2y-5=0 (paralel-dik kuralı karıştırma)","E":"Paralel eğim m=-1/2 ve nokta (0,5) birlikte kullanılır: y-5=-1/2(x-0) =\u003e x+2y-10=0 (çift hata: eğim ve nokta karıştırma)","D":"Doğru eğim m=2 fakat nokta (0,5) kullanılır: y-5=2(x-0) =\u003e 2x-y+5=0 (x ve y ekseni kesim noktası karıştırma)","B":"m=-(-1/2)ters alınmadan işaret çevrilir: m=-2; y-0=-2(x-5) =\u003e 2x+y-10=0 (negatif ters alma hatası)"},"hap":"Dik iki doğrunun eğimleri çarpımı her zaman −1\u0027dir; eğim Ax+By+C=0\u0027da −A/B olarak okunur.","teshis":{"C":{"gercek":"Dik doğrularda eğimler çarpımı −1\u0027dir; paralel doğrularda eğimler eşittir; ikisi farklı kurallardır.","ayirt":"Soru paralellik mi dikliği mi istiyor, hangi eğim kuralını kullandım?","paragraf":"Paralel ve dik doğrular ayrımı","yanilgi":"Sorunun \u0027dik\u0027 ifadesini görmeyip aynı eğimle paralel doğru kurarsın."},"E":{"gercek":"Doğru denklemi kurarken hem doğru eğim kuralı hem doğru nokta birlikte, ayrı ayrı doğrulanmalıdır.","ayirt":"Eğimi mi karıştırdım, noktayı mı, yoksa her ikisini birden mi?","paragraf":"Doğru denklemi kurma adımları","yanilgi":"Hem dikliği paralellikle karıştırır hem de x ve y eksenindeki noktaları birbirine karıştırırsın."},"A":{"gercek":"Ax+By+C=0 doğrusunun eğimi −A/B\u0027dir; dik iki doğrunun eğimleri çarpımı −1 olur; nokta-eğim biçimi y−y0=m(x−x0)\u0027dır.","ayirt":"Eğimi bulurken işaretimi doğru mu aldım, kullandığım nokta soruda verilen nokta mı?","paragraf":"Doğru denklemi – Genel biçim ve dik doğrular kuralı","yanilgi":"Bu şıkkı eleyen öğrenci, dik doğru kuralında negatif ters almayı ya da doğru noktayı kullanmayı atlamıştır."},"D":{"gercek":"x eksenini kesen nokta (a,0) biçimindedir; y-koordinatı sıfırdır, x-koordinatı sıfır olan y ekseni kesim noktasıyla karıştırılmamalıdır.","ayirt":"Kullandığım nokta x eksenindeki mi yoksa y eksenindeki nokta mı?","paragraf":"Eksenleri kesen nokta tanımı","yanilgi":"x eksenini kestiği nokta (5,0) iken bunu y eksenini kestiği nokta gibi (0,5) okursun."},"B":{"gercek":"−1/2\u0027nin negatif tersi, önce tersini alıp (−2) sonra işaretini çevirerek (+2) bulunur.","ayirt":"Negatif ters alırken hem \u0027ters\u0027 hem \u0027negatif\u0027 işlemini birlikte mi yaptım?","paragraf":"Dik doğrularda eğim çarpımı −1 kuralı","yanilgi":"Negatif ters alırken sadece işareti değiştirip m=−2 yazarsın, oysa hem tersini almalı hem işaretini çevirmelisin."}},"verilen":[[1,1],[2,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 9"},"kural":"En içteki işlemden başlanır, her katmanda pay ve payda tek kesre indirgenir, büyük kesir çizgisi bölme işareti olduğundan üst kesir alt kesrin tersiyle çarpılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 9","sonDonem":6,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Karmaşık kesirde önce en alt (en iç) satırı kağıda tek kesir olarak yaz, sonra bir üst kata geç; katman atlama en çok puan kaybettiren hatadır.","konu":"kesirli işlemler","tablo":{"satirlar":[["VERİLENLER","-","-"],["A ifadesi","3 + 1/(2 + 1/(2 + 1/3))","-"],["HESAP","-","-"],["1. Katman","2 + 1/3","7/3"],["2. Katman (ters-çarpım)","1 / (7/3)","3/7"],["3. Katman","2 + 3/7","17/7"],["4. Katman (ters-çarpım)","1 / (17/7)","7/17"],["5. Katman (sonuç)","3 + 7/17","58/17"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"37/11","E":"22/3","A":"58/17","D":"7/17","B":"42/13"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"2 tam sayısını paydaya çevirirken 2=3/3 alınmış; doğru olan 2=6/3 kullanılırsa işlem baştan sona 58/17\u0027ye ulaşır.","E":"Kesir çizgisini ayrı işlemler için gruplama aracı olarak görmeyip tüm tam sayıları (3+2+2=7) birden toplamış; her katman içten dışa ayrı çözülmelidir.","D":"Sadece en son katmandaki bölme (1/(17/7)=7/17) cevap sanılmış, en dışarıdaki 3 tam sayısı unutulmuş; 3 eklenmeden eksik kalmıştır.","B":"Bölme işleminde kesri ters çevirmek unutulmuş, 2+1/3 adımından sonra 7/3 kesrinin tersi alınmadan işleme devam edilmiştir; doğru ters çevrilirse 58/17 çıkar."},"dogru":"En içteki kesirden başlanır, her katman tek kesre indirgenir. Kesir çizgisi bölme işareti olduğundan üst kesir, alt kesrin ters çevrilmiş şekliyle çarpılır. Sonunda dışarıdaki tam sayı eklenir.","sinav":"Karmaşık (kat merdivenli) kesir ifadesinin sayısal değerinin bulunması işleminde en içten başlanarak her katman tek kesre indirgenip bölme işleminde ters çarpma kuralı uygulanır.","kavramlar":[{"kaynak":"TEORI","tanim":"Pay veya paydasında yine kesir bulunan kesir ifadesidir. Çözümü en içteki işlemden başlanarak her katmanda ayrı ayrı yapılır.","ad":"Karmaşık (kat merdivenli) kesir"},{"kaynak":"TEORI","tanim":"Birinci kesir, ikinci kesrin ters çevrilmiş şekliyle (çarpmaya göre tersi) çarpılır. Kural: a/b ÷ c/d = (a × d) / (b × c)","ad":"Kesir bölme işlemi"},{"kaynak":"TEORI","tanim":"Karmaşık kesirlerde kesir çizgisi bölme işareti olduğundan pay ve paydadaki tüm işlemler ayrı ayrı tamamen tamamlanmadan bölme yapılamaz.","ad":"İşlem sırası (kesir çizgisi gruplama)"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["1. Katman","3 + 1/2","7/2"],["2. Katman (ters-çarpım)","1 / (7/2)","2/7"],["3. Katman","3 + 2/7","23/7"],["4. Katman (ters-çarpım)","1 / (23/7)","7/23"],["5. Katman (sonuç)","4 + 7/23","99/23"]]},"tur":"tablo","soru":"B = 4 + 1/(3 + 1/(3 + 1/2)) işleminin sonucu kaçtır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve B\u0027nin kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"A = 3 + 1/(2 + 1/(2 + 1/3)) işleminin sonucu kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-16","verilenler":[{"deger":"3 + 1/(2 + 1/(2 + 1/3))","anlam":"Çözülmesi istenen kat merdivenli (karmaşık) kesir ifadesinin kendisi; her katman içten dışa tek kesre indirgenerek çözülür.","ad":"A ifadesi"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Kesirler ve Karmaşık (Bileşik) Kesir İşlemleri","dogru":"A","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: İfade 3 + 1/(2 + 1/(2 + 1/3)) (soruda verilen); istenen A değeri; \u0027en içten başla\u0027 kuralı belirleyici","anlatim":"Soru bize kat kat iç içe geçmiş bir kesir ifadesi vermiş. Böyle sorularda en içteki parantezden dışarı doğru çözülür.","verilenAdim":true,"doldur":[[1,1]]},{"formul":"1. Katman = 2 + 1/3 = 6/3 + 1/3 = 7/3 (soruda verilen sayılarla)","anlatim":"Kesirli merdiven sorularında önce en iç katmanı tek kesre indirgeriz. Çünkü dışarıdaki işlemler bu sonuca ihtiyaç duyar.","doldur":[[3,1],[3,2],[4,1],[4,2],[5,1],[5,2],[6,1],[6,2],[7,1],[7,2]]},{"formul":"2. Katman = 1 / (7/3) = 1 × 3/7 = 3/7 (1. adımda bulduk)","anlatim":"Büyük kesir çizgisi aslında bir bölme işaretidir. Payda kesir olduğu için, üstteki 1\u0027i alttaki kesrin tersiyle çarpıyoruz.","doldur":[]},{"formul":"3. Katman = 2 + 3/7 = 14/7 + 3/7 = 17/7 (2. adımda bulduk)","anlatim":"Şimdi bir üst katmana çıkıyoruz ve tam sayıyla kesri topluyoruz. Bunun için tam sayıyı aynı paydaya çeviriyoruz.","doldur":[]},{"formul":"4. Katman = 1 / (17/7) = 1 × 7/17 = 7/17 (3. adımda bulduk)","anlatim":"Yine bir bölme işlemiyle karşılaşıyoruz, kesrin tersini alıp çarpıyoruz. Bu adım en dış katmandan bir önceki basamak.","doldur":[]},{"formul":"5. Katman = 3 + 7/17 = 51/17 + 7/17 = 58/17 (4. adımda bulduk)","anlatim":"En dış katmana geldik, en baştaki 3 ile bu kesri topluyoruz. Ortak payda 17 olduğu için tam sayıyı ona göre yazıyoruz.","doldur":[]},{"formul":"Sonuç: A = 58/17 (5. adımda bulduk)","anlatim":"Sonuç ortaya çıktı: A değeri bu kesire eşit. Bütün katmanları içten dışa doğru topladık.","doldur":[]},{"formul":"Yanlış yol: 3 + 2 + 3/7 = 5 + 3/7 (HATALI) → doğrusu 58/17 (5. adımda bulduk)","anlatim":"En sık hata: öğrenci büyük kesri bölme yerine çarpma sanıp payda ile payı ters çevirmeyi unutur. Bu yüzden 1/(7/3) işlemini 7/3 ile aynı sanıp yanlış sonuca gider.","doldur":[]}],"anahtar":[{"ornek":"katman","kok":"katman"},{"ornek":"kesrin","kok":"kesrin"},{"ornek":"indirgenerek","kok":"indirg"},{"ornek":"işaretidir","kok":"işaret"},{"ornek":"çizgisi","kok":"çizgis"},{"ornek":"tersiyle","kok":"tersiy"}],"konuGiris":{"harita":"Ne zaman test edilir: karmaşık (kat merdivenli) kesir ifadesinin sonucu istendiğinde test edilir. Nasıl ölçülür: en içteki kesirden başlayıp dışa doğru her katmanı tek kesre indirgeme becerisiyle ölçülür. Nasıl kaydedilir: sonuç en sade basit ya da tam sayılı kesir biçiminde yazılır.","desen":"Bu tür sorularda öğrenci genellikle en dıştaki toplamı önce yapmaya kalkar ve en içteki kesri atlar. Ayrıca çarpma-bölmeye özgü çapraz sadeleştirmeyi toplama adımında da uygulayıp hata yapar. Bu soru, karmaşık kesirde işlem sırası ve sadeleştirme kuralı noktasından geliyor (p.28).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Payında veya paydasında yine kesir bulunan ifadedir","ad":"Karmaşık kesir","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Büyük kesir çizgisi bölme işlemi anlamına gelen gruplama işaretidir","ad":"Kesir çizgisi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Bir kesrin payı ile paydasının yer değiştirmiş halidir","ad":"Ters kesir","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"En içten başlanarak her katmanın sadeleştirilmesiyle bulunan son değerdir","ad":"İşlem sonucu","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"İç içe kesirlerden oluşan bir ifade verilir ve bu ifadenin sayısal sonucu istenir.","panel_ornek":"Bir kumbarada önce 2 lira, üstüne 1 liranın yarısı kadar daha para var; toplamı bulmak için önce küçük parçayı, sonra büyük toplamı hesaplarsın. Sırayı karıştırıp önce büyük sayıyla işlem yaparsan kumbaranın tutarını yanlış sayarsın.","ornek":"Bir kumbarada önce 2 lira, üstüne 1 liranın yarısı kadar daha para var; toplamı bulmak için önce küçük parçayı, sonra büyük toplamı hesaplarsın. Sırayı karıştırıp önce büyük sayıyla işlem yaparsan kumbaranın tutarını yanlış sayarsın.","yontemler":"En içteki parantezden başlanır, her katman tek kesre indirilir ve büyük kesir çizgisi bölme gibi işlenir. Toplama adımlarında çapraz sadeleştirme yapılmaz, yalnız çarpma/bölmede uygulanır.","nedir":"Kesirli işlemler, iç içe geçmiş kesirlerin doğru sırayla sadeleştirilip tek sayıya indirgenmesini konu alır. Sınav, en içten dışa doğru işlem sırasını ve payda-payı ayrı ayrı toplama becerisini ölçer."},"olay":"2+1/3=7/3 → 1/(7/3)=3/7 → 2+3/7=17/7 → 1/(17/7)=7/17 → 3+7/17=58/17.","tuzak":{"C":{"ad":"Payda Eşitleme Tuzağı","metin":"2+1/3 adımında tam sayı 2, payda 3\u0027e çevrilirken yanlış pay atanmış (2=3/3 sanılmış), 4/3 üzerinden devam edilmiştir. Doğrusu: 2=6/3 alınıp 7/3 bulunur, zincir 58/17\u0027ye çıkar."},"E":{"ad":"Sıra Tuzağı","metin":"Kesir çizgisinin gruplama işareti olduğu göz ardı edilip önce tüm tam sayılar (3+2+2=7) toplanmış, sadece en sondaki basit kesir (1/3) eklenmiştir (22/3). Doğrusu: her katman içten dışa ayrı ayrı çözülür, sonuç 58/17\u0027dir."},"D":{"ad":"Tuzak","metin":"En içteki katmandan başlanacağı hatırlanmadan yalnız son bölme katmanı (1/(17/7)=7/17) cevap sanılmış, en dıştaki 3 tam sayısı eklenmemiştir. Doğrusu: son adımda dıştaki tam sayı toplanır, sonuç 58/17\u0027dir."},"B":{"ad":"Ters Alma Tuzağı","metin":"1/(7/3) adımında büyük kesir çizgisinin bölme işareti olduğu unutulmuş, kesir ters çevrilmeden aynen kullanılmıştır (2+7/3=13/3, 1/(13/3)=3/13, 3+3/13=42/13). Doğrusu: bölmede kesir tersiyle çarpılır, 58/17 bulunur."}},"celdiriciYol":{"C":"2+1/3 adımında 2=3/3 alınıp 3/3+1/3=4/3, devamında 2+3/4=11/4, 1/(11/4)=4/11, 3+4/11 = 37/11 (payda eşitlemede tam sayıyı yanlış çevirme)","E":"3+2+2=7, ardından yalnız en sondaki 1/3 eklenerek 7+1/3 = 22/3 (kesir çizgisini gruplama işareti saymayıp sıra hatası yapma)","D":"3+1/(2+1/(2+1/3)) içinde son bölme 1/(17/7)=7/17 cevap yazılmış, dıştaki 3 eklenmemiş = 7/17 (dıştaki tam sayıyı atlama)","B":"1/(7/3) adımında ters alınmadan 2+7/3=13/3, 1/(13/3)=3/13, 3+3/13 = 42/13 (bölmede kesri ters çevirmeme)"},"hap":"Kat merdivenli kesirde büyük kesir çizgisi bir bölme işaretidir; her katman içten dışa, tek kesre indirgenerek çözülür.","teshis":{"C":{"gercek":"Tam sayı n, payda b olan kesre n×b/b olarak çevrilir; 2=6/3\u0027tür, 3/3 değildir.","ayirt":"Tam sayıyı payda ile çarparak mı payı buldum?","paragraf":"Paydaları eşitleme kuralı","yanilgi":"Tam sayıyı paydaya çevirirken payı payda ile aynı sanıp kısayoldan gidebileceğini düşünüyorsun."},"E":{"gercek":"Büyük kesir çizgisi bir gruplama işaretidir; ifade tamamen sadeleştirilmeden dıştaki tam sayılarla birleştirilemez.","ayirt":"Tam sayıları, ait oldukları katmanın kesir sonucunu bulmadan mı topladım?","paragraf":"Kesir çizgisinin gruplama işlevi","yanilgi":"Kesir çizgisinin sadece görsel bir ayraç olduğunu, tam sayıları önce toplayıp kesri sona ekleyebileceğini sanıyorsun."},"A":{"gercek":"Kat merdivenli kesirde her katman ayrı ayrı tek kesre indirgenir; katlar atlanırsa hatalı kesir üretilir.","ayirt":"Her katmanı ayrı ayrı, içten dışa mı sadeleştirdim?","paragraf":"Kat merdivenli kesir çözüm yöntemi","yanilgi":"Bu tür işlemi tek seferde paydaları eşitleyip sonuca ulaşabileceğini, ara katmanların gereksiz olduğunu düşünüyorsun."},"D":{"gercek":"Karmaşık kesirde çözüm en içten başlar ama en dıştaki toplama son adımdır, atlanamaz.","ayirt":"En dıştaki tam sayıyı son adımda topladım mı?","paragraf":"Kat merdivenli kesir çözüm sırası","yanilgi":"En son bulduğun bölme sonucunu, dıştaki tam sayıyı eklemeden ifadenin tamamı sanıyorsun."},"B":{"gercek":"Büyük kesir çizgisi bölme işaretidir; üst kesir, alt kesrin çarpmaya göre tersiyle çarpılır (a/b bölü c/d = a×d/b×c).","ayirt":"Bu adımda gerçekten tersini alıp mı çarptım, yoksa kesri aynen mi taşıdım?","paragraf":"Kesirlerde bölme kuralı","yanilgi":"Büyük kesir çizgisini adi bölme değil de sanki hiç bölme yokmuş gibi kesri olduğu gibi kullanabileceğini düşünüyorsun."}},"verilen":[[1,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 14"},"kural":"log_a A + log_a B = log_a(AB) çarpım kuralıyla eşitlik tek logaritmaya indirilir, sonra üstel form yerine iki taraftaki logaritmanın içleri eşitlenir; tanım şartı (x-1\u003e0) çözümden sonra kontrol edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 14","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Denklemi çöz, kökleri bul; ama cevabı işaretlemeden önce her kökü tek tek tanım şartına sok, geçerli kökle sorunun istediği ifadeyi tekrar oku.","konu":"logaritma denklemi","tablo":{"satirlar":[["VERİLENLER","-","-"],["denklem sağ tarafı katsayısı","6x+18","-"],["istenen ifade","3x-7","-"],["HESAP","-","-"],["Çarpım kuralı uygulaması","(x-1)(x+7) = 6x+18","X²+6x-7 = 6x+18"],["Denklemin sadeleştirilmesi","X²+6x-7-6x-18 = 0","X² - 25 = 0"],["Köklerin bulunması","X² = 25","X = 5 veya x = -5"],["Tanım şartı kontrolü","X-1\u003e0 ⇒ x\u003e1","X=-5 elenir, x=5 kalır"],["İstenen ifadenin hesabı","3x-7, x=5","8"]],"basliklar":["Adım","İşlem","Sonuç"]},"siklar":{"C":"-7","E":"22","A":"-22","D":"8","B":"-16"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Denklem iki farklı kök verince bunların ortalaması alınarak x=0 sanılmış; oysa tanım şartı köklerden birini eler, ortanca yapı yoktur.","E":"Kök x=5 doğru bulunmuş fakat sorulan 3x-7 ifadesi yerine 3x+7 hesaplanmıştır.","A":"Denklemden x=-5 kökü çıksa da logaritma x-1\u003e0 yani x\u003e1 şartını sağlamadığı için geçersizdir; bu geçersiz kök seçilerek yanlış sonuç bulunmuştur.","B":"Logaritma toplama kuralı çarpım kuralıyla karıştırılarak (x-1)+(x+7)=6x+18 yazılmış, farklı bir denklem çözülüp yanlış kök x=-3 elde edilmiştir."},"dogru":"Logaritma kuralıyla iki logaritma çarpıma dönüştürülür: (x-1)(x+7) = 6x+18. Denklem çözülünce x=5 veya x=-5 çıkar. Logaritmanın içi pozitif olmalı kuralı (x\u003e1) nedeniyle x=-5 atılır, x=5 geçerlidir. Sonuç: 3(5)-7=8.","sinav":"Logaritma denklemlerinde tanım şartları (içler pozitif) sağlayan kökün bulunması ve cebirsel çözümden sonra kontrol edilmesi gerekir.","kavramlar":[{"kaynak":"TEORI","tanim":"Logaritmanın içi pozitif, tabanı pozitif ve 1\u0027den farklı olmalıdır; denklem çözüldükten sonra bulunan her kök bu şartlara karşı mutlaka kontrol edilmelidir.","ad":"logaritmanın tanım şartları"},{"kaynak":"TEORI","tanim":"Aynı tabanlı iki logaritmanın toplamı, içlerin çarpımının logaritmasına eşittir: log_a(x) + log_a(y) = log_a(xy).","ad":"logaritma çarpım kuralı"},{"kaynak":"TEORI","tanim":"Cebirsel denklemden elde edilen kökler, orijinal denklemin tanım şartlarını sağlayıp sağlamadığı kontrol edilerek geçerli kökler belirlenir.","ad":"denklem çözümü sonrası doğrulama"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2]],"tablo":{"basliklar":["Adım","İşlem","Sonuç"],"satirlar":[["Çarpım kuralı uygulaması","(x-2)(x+8) = 6x+9","X²+6x-16 = 6x+9"],["Denklemin sadeleştirilmesi","X²+6x-16-6x-9 = 0","X² - 25 = 0"],["Köklerin bulunması","X² = 25","X = 5 veya x = -5"],["Tanım şartı kontrolü","X-2\u003e0 ⇒ x\u003e2","X=-5 elenir, x=5 kalır"],["İstenen ifadenin hesabı","5x-3, x=5","22"]]},"tur":"tablo","soru":"x reel sayı olmak üzere log₂(x-2) + log₂(x+8) = log₂(6x+9) eşitliği sağlanmaktadır. Tanım koşullarına uygun kök bulunduktan sonra, bu kök için 5x-3 ifadesinin değeri kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve 5x-3 ifadesinin değerinin 22 olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"x reel sayı olmak üzere log₂(x-1) + log₂(x+7) = log₂(6x+18) eşitliği sağlanmaktadır. Tanım koşullarına uygun kök bulunduktan sonra, bu kök için 3x-7 ifadesinin değeri kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-13","verilenler":[{"deger":"6x+18","anlam":"eşitliğin sağındaki logaritma argümanı; çarpım kuralıyla elde edilen (x-1)(x+7) ile eşitlenecek ifadedir","ad":"denklem sağ tarafı katsayısı"},{"deger":"3x-7","anlam":"denklemin geçerli kökü bulunduktan sonra hesaplanması istenen cebirsel ifadedir","ad":"istenen ifade"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Logaritma denklemi tanım ve çözüm adımları","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Soruda ne var: log₂(x-1) + log₂(x+7) = log₂(6x+18) denklemi (soruda verilen); x-1\u003e0 ve x+7\u003e0 tanım koşulu (soruda verilen); istenen 3x-7 değeri (soruda verilen)","anlatim":"Soru bize denklemi veriyor: log₂(x-1) + log₂(x+7) = log₂(6x+18). İstenen de belli: bu denklemi sağlayan x için 3x-7\u0027nin değeri.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Genel kural: log₂(x-1) + log₂(x+7) = log₂((x-1)(x+7)) → (x-1)(x+7) = 6x+18","anlatim":"Toplam logaritmalar çarpım kuralıyla birleşir, çünkü log_a A + log_a B = log_a(AB). Sonra iki tarafın içini eşitleyip logaritmadan kurtuluyoruz.","doldur":[[4,1],[4,2]]},{"formul":"Terim 1 = x × x = x²","anlatim":"(x-1)(x+7) çarpımını açıyoruz ama her terimi tek tek çarpıyoruz, karışmasın. İlk terim x ile x\u0027in çarpımı.","doldur":[]},{"formul":"Terim 2 = x × 7 = 7x","anlatim":"İkinci terim x ile 7\u0027nin çarpımı, parantezin dışa doğru açılan ilk parçası.","doldur":[]},{"formul":"Terim 3 = -1 × x = -x","anlatim":"Üçüncü terim -1 ile x\u0027in çarpımı, ikinci parantezdeki -1\u0027in x\u0027e etkisi.","doldur":[]},{"formul":"Terim 4 = -1 × 7 = -7","anlatim":"Dördüncü terim -1 ile 7\u0027nin çarpımı, açılımın son parçası.","doldur":[]},{"formul":"(x-1)(x+7) = x² (3. adımda bulduk) + 7x (4. adımda bulduk) − x (5. adımda bulduk) − 7 (6. adımda bulduk) = x² + 6x − 7","anlatim":"Şimdi dört terimi topluyoruz, çünkü açılım ancak toplandığında tam ifadeyi verir. 7x ve -x birleşince 6x çıkıyor.","doldur":[]},{"formul":"x² + 6x − 7 (7. adımda bulduk) − 6x − 18 = 0 → x² − 25 = 0","anlatim":"Şimdi eşitliğin sağındaki 6x+18\u0027i sola atıp denklemi sıfıra eşitliyoruz. Amaç x² tek başına kalsın.","doldur":[]},{"formul":"x² = 25 (8. adımda bulduk) → x = 5 veya x = −5","anlatim":"x² = 25 eşitliğinden x\u0027i buluyoruz, kare kök hem pozitif hem negatif kökü verir. Dikkat: burada iki olası kök çıkıyor.","doldur":[]},{"formul":"Tanım şartı: x − 1 \u003e 0 (soruda verilen) → x \u003e 1; x = −5 (9. adımda bulduk) bu şartı sağlamaz, elenir → x = 5 kalır","anlatim":"Şimdi tanım koşulunu kontrol ediyoruz, çünkü logaritmanın içi pozitif olmak zorunda. x-1\u003e0 şartı x\u003e1 demek, bu yüzden negatif kök elenir.","doldur":[[7,1],[7,2]]},{"formul":"3x − 7 = 3 × 5 (10. adımda bulduk) − 7 = 8","anlatim":"Şimdi geçerli kökü istenen ifadeye yerleştiriyoruz, çünkü soru direkt 3x-7\u0027yi soruyor. Bu adım sonucu verir.","doldur":[[8,1],[8,2]]},{"formul":"Ters durum: tanım şartı x \u003c 1 olsaydı → x = −5 kalır, x = 5 elenirdi","anlatim":"Ters durumda tanım şartı x\u003c-7 gibi ters bir aralık isteseydi, elenen kök değişebilirdi. Burada x=-5 hep x\u003e1 şartını sağlamadığı için elenir.","doldur":[]},{"formul":"Yanlış yol: 3 × (−5) − 7 = −22 (HATALI) → doğrusu 3 × 5 − 7 = 8 (11. adımda bulduk)","anlatim":"En sık hata: tanım şartını unutup x=-5 için de 3x-7 hesaplanır, -22 bulunur ama bu kök logaritmanın tanım alanı dışında kalır.","doldur":[]}],"anahtar":[{"ornek":"logaritmalı","kok":"logari"},{"ornek":"çarpım","kok":"çarpım"},{"ornek":"eşitlik","kok":"eşitli"},{"ornek":"denklemde","kok":"denkle"},{"ornek":"pozitif","kok":"poziti"},{"ornek":"şartında","kok":"şartın"}],"konuGiris":{"harita":"Ne zaman test edilir: Denklem çözüldükten sonra bulunan kökler tanım koşuluna (içler pozitif) uyup uymadığı test edilir. Nasıl ölçülür: Logaritmaları tek çatı altında toplayıp üstel forma çevirerek cebirsel denklem çözümüyle ölçülür. Nasıl kaydedilir: Sadece tanım koşulunu sağlayan kök, istenen ifadede yerine konularak sonuç olarak yazılır.","desen":"Sınav genelde iki kök üretip yalnız tanım koşulunu sağlayanın seçilmesini bekler; atılacak kökü de işleme katmak en sık tuzaktır. Toplamı eşitliğe değil çarpıma dönüştürme hatası da sık görülür. Bu soru \u0027köklerden geçerli olanı seçip istenen ifadeyi hesaplama\u0027 noktasından geliyor (p.28, 2 dönem çıkmış).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Logaritma içindeki her ifadenin sıfırdan büyük olması gereken şart","ad":"Tanım koşulu","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Logaritmanın pozitif ve 1\u0027den farklı olması gereken sayısı","ad":"Taban","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"log eşitliğinin a üzeri sayı biçimine dönüştürülmüş hali","ad":"Üstel form","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Denklemi sağlayan ve tanım koşulunu bozmayan tek çözüm değeri","ad":"Geçerli kök","kim":"kanun sabitler"}],"sinavda":"Soruda logaritmalı bir eşitlik verilir, tanım koşuluna uygun kökün belirlenip istenen cebirsel ifadenin değeri istenir.","panel_ornek":"İkinci el bir bisikleti 3 katlı bir sitede pazarlıyorsun; ilan \u00272 kat fiyatına eşdeğer\u0027 diyor ama fiyat 0 ya da eksi olamaz. Hesapladığın fiyat eksi çıkarsa o teklifi elersin, sadece pozitif olanı kabul edersin. Logaritmada da öyle, içi negatif çıkan kökü atarsın.","ornek":"İkinci el bir bisikleti 3 katlı bir sitede pazarlıyorsun; ilan \u00272 kat fiyatına eşdeğer\u0027 diyor ama fiyat 0 ya da eksi olamaz. Hesapladığın fiyat eksi çıkarsa o teklifi elersin, sadece pozitif olanı kabul edersin. Logaritmada da öyle, içi negatif çıkan kökü atarsın.","yontemler":"Logaritmaları tek logaritmaya toplayıp üstel forma çevirmek tek yöntemdir; kritik nokta bulunan kökü mutlaka t
