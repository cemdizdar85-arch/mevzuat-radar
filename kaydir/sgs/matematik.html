 (x+a) ile bölmede kalan P(-a)\u0027dır, işareti unutmamak gerekir.","nedir":"Polinom sadeleştirme, bölme ve kalan teoremini kullanarak bilinmeyen katsayıları bulup istenen değeri hesaplamayı sağlar. Sınav, kalan teoremini doğru kurup denklem çözebilmeni ölçer."},"olay":"P(1)=3+a+b=9 → a+b=6; P(-2)=-2a+b=-6; sistemden a=4, b=2; P(2)=8+8+4(4)+2=26.","tuzak":{"C":{"ad":"Değişken Karıştırma Tuzağı","metin":"Sistemi doğru çözüp bulduğun a=4 katsayısını, sorunun istediği kalan sanıp yazdın. Doğrusu: soru a\u0027yı değil P(2) kalanını sorar, sonuç 26\u0027dır."},"A":{"ad":"Denklem Kurma Tuzağı","metin":"(x+2) ile bölümün kalanını P(-2)=-2a+b yerine 2a+b sanıp kurdun. Doğrusu: -2a+b=-6 denklemiyle a=4, b=2 bulunur, P(2)=26\u0027dır."},"D":{"ad":"Yerine Koyma Tuzağı","metin":"a=4, b=2 doğru bulunmasına rağmen P(2) hesabında x² teriminin işaretini (+2x² yerine -2x²) ters aldın. Doğrusu: P(2)=8+8+8+2=26\u0027dır."},"B":{"ad":"Bölen Karıştırma Tuzağı","metin":"Sorunun istediği (x-2) yerine (x+2) ile bölümün kalanını (soruda zaten verilen -6\u0027yı) yazdın. Doğrusu: istenen (x-2) bölümünün kalanı P(2)=26\u0027dır."}},"celdiriciYol":{"C":"Sistemden bulunan a=4 değerini doğrudan cevap yazdın (istenen kalan değil katsayı)","A":"a+b=6 ve 2a+b=-6 (işaretle ters kurulan denklem) çözülünce a=-12, b=18; P(2)=8+8+4(-12)+18=-14 (kalan teoremini (x+2) için kurarken işareti ters aldın)","D":"P(2) = 2³-2(2²)+4(2)+2 = 8-8+8+2 = 10 (yerine koyarken x² teriminin işaretini (+2x² yerine -2x²) ters aldın)","B":"P(-2) = -8+8-8+2 = -6 (istenen (x-2) yerine (x+2) bölenini hesapladın)"},"hap":"Kalan teoremi (x-a) ile bölümde P(a)\u0027yı verir; bölen değişince yerine konan sayı da işaretiyle birlikte değişir.","teshis":{"C":{"gercek":"a ve b, polinomun katsayılarıdır; soru bunları değil P(2) kalanını sorar.","ayirt":"Bulduğum bu sayı sorunun sorduğu şey mi, yoksa ona ulaşmak için kullandığım ara değer mi?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Polinom Tanımı","yanilgi":"Sistemi çözüp bulduğun ara değeri, sorunun asıl istediği büyüklükle karıştırıyorsun."},"E":{"gercek":"Kalan teoremine göre iki verilen kalan iki denklem kurar, sistemin çözümü a ve b\u0027yi verir, son adımda istenen bölenin değeri yerine konur.","ayirt":"Dört adımı da (iki denklem, sistem çözümü, yerine koyma) sırayla tamamladım mı?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Kalan Teoremi","yanilgi":"Bu şıkkı eleyen öğrenci, ara adımlardan birini (denklem kurma, sistem çözme ya da yerine koyma) atlayıp ara bir sayıda durmuştur."},"A":{"gercek":"(x-a) ile bölümden kalan P(a)\u0027dır; (x+2)=(x-(-2)) olduğundan kalan P(-2)\u0027dir, işaretler değişkenle birlikte taşınır.","ayirt":"Bölen (x+2) ise yerine koyduğum değer gerçekten -2 mi?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Kalan Teoremi","yanilgi":"Kalan teoremini (x+2) için kurarken katsayının işaretini otomatik pozitif alıyorsun."},"D":{"gercek":"P(2) hesaplanırken polinomdaki her terimin kendi işareti korunarak yerine konur; 2x² teriminin işareti değiştirilmez.","ayirt":"Polinomdaki her terimi, kendi işaretiyle mi yerine koydum?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Polinom Tanımı","yanilgi":"Doğru katsayıları bulduktan sonra yerine koyma adımında işlem hatası yapıyorsun."},"B":{"gercek":"Kalan teoremi her bölen için ayrı hesap gerektirir; (x-2) ile bölümün kalanı P(2)\u0027dir, soruda verilen -6 ise (x+2) bölümüne aittir.","ayirt":"Bu sayı bana zaten soruda mı verildi, yoksa ben mi hesapladım?","paragraf":"TESMER SGS Matematik-İstatistik Ders Notu, Kalan Teoremi","yanilgi":"Soruda geçen bir sayıyı, hesaplamadan doğrudan cevap sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 9"},"kural":"Kalan sıfırsa P(x) = Bölen × Bölüm\u0027dür; (x²-x-2)=(x-2)(x+1) çarpanlarına ayrılır ve (x²-x-2)(x+3) çarpımı açılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 9","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Çarpımı açarken altı çarpımı (x²·x, x²·3, -x·x, -x·3, -2·x, -2·3) tek tek yaz, hiçbirini atlamadan aynı üslü terimleri topla.","konu":"polinom sadelestirme","tablo":{"satirlar":[["VERİLENLER","-"],["P(x)","x³ + ax² + bx - 6"],["Bölen","x² - x - 2"],["Kalan","sıfırdır"],["Bölüm","x + 3"],["HESAP","-"],["Bölen çarpanlarına ayrılır","X² - x - 2 = (x - 2)(x + 1)"],["Eşitlik kurulur","P(x) = (x² - x - 2)(x + 3)"],["Çarpım açılır","X³ + 3x² - x² - 3x - 2x - 6"],["Benzer terimler toplanır","X³ + 2x² - 5x - 6"],["Katsayılar okunur","A = 2, b = -5"],["Sonuç","A + b = -3"]],"basliklar":["Adım","İşlem/Sonuç"]},"siklar":{"C":"0","E":"5","A":"-3","D":"3","B":"-1"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"Dağıtma sırasında -3x terimi unutulup x³+2x²-2x-6 yazılırsa a=2, b=-2 gibi görünür; -3x dahil edilince eksik terimin etkisi ortaya çıkar.","E":"x²-x-2 yanlışlıkla (x+2)(x-1) olarak çarpanlanırsa x³+4x²+x-6 çıkar; orta terim işareti (-x) çarpanlara doğru dağıtılmalıdır.","D":"Benzer terimleri toplarken -3x\u0027in işareti yanlış alınıp +3x yazılırsa x³+2x²+x-6 oluşur; negatif işaretler birlikte işlemeye alınmalıdır.","B":"Çarpımı açarken -2x terimi atlanırsa a=2, b=-3 bulunur ve yanlış sonuç a+b=-1 çıkar; oysa tüm altı çarpım yazılmalıdır."},"dogru":"P(x) = Bölen × Bölüm kuralından (x²-x-2)(x+3) çarpılır. İkinci dereceli ifade önce (x-2)(x+1) olarak ayrılır, sonra tüm terimler dağıtılarak x³+2x²-5x-6 elde edilir. Burada a=2, b=-5 olduğundan a+b=-3 çıkar.","sinav":"Polinom bölmesinde kalan sıfırsa P(x) = Bölen × Bölüm eşitliğinde bölenin çarpanlara ayrılması ve çarpımın doğru açılması gerekir.","kavramlar":[{"kaynak":"TEORI","tanim":"Üsleri doğal sayı olan terimlerin toplamı biçiminde yazılan cebirsel ifadedir; her terimin katsayısı ve üssü bellidir.","ad":"Polinom"},{"kaynak":"TEORI","tanim":"P(x) = B(x)·Q(x) + K(x) eşitliğine dayanan işlemde, kalan kalanın derecesi bölenin derecesinden küçüktür; kalan sıfırsa bölen, P(x)\u0027i tam böler.","ad":"Polinom bölmesi"},{"kaynak":"TEORI","tanim":"Bir polinomu, çarpı işlemiyle bağlı basit çokluklara bölmek; ortak çarpan, özdeşlik ya da ikinci derece yöntemiyle yapılır.","ad":"Çarpanlara ayırma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1]],"tablo":{"basliklar":["Adım","İşlem/Sonuç"],"satirlar":[["Bölen çarpanlarına ayrılır","X² - x - 6 = (x - 3)(x + 2)"],["Eşitlik kurulur","Q(x) = (x² - x - 6)(x + 2)"],["Çarpım açılır","X³ + 2x² - x² - 2x - 6x - 12"],["Benzer terimler toplanır","X³ + x² - 8x - 12"],["Katsayılar okunur","A = 1, b = -8"],["Sonuç","A - b = 9"]]},"tur":"tablo","soru":"Q(x) = x³ + ax² + bx - 12 polinomunun (x² - x - 6) ile bölümünden kalanı sıfırdır. Bu bölme işleminde bölüm polinomu (x + 2) olarak bulunduğuna göre, a - b farkı kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve a - b farkının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"P(x) = x³ + ax² + bx - 6 polinomunun (x² - x - 2) ile bölümünden kalanı sıfırdır. Bu bölme işleminde bölüm polinomu (x + 3) olarak bulunduğuna göre, a + b toplamı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-22","verilenler":[{"deger":"x³ + ax² + bx - 6","anlam":"Katsayıları a ve b bilinmeyen, sabit terimi -6 olan üçüncü derece polinomdur; a ve b bulunacaktır.","ad":"P(x)"},{"deger":"x² - x - 2","anlam":"P(x)\u0027in bölündüğü ikinci derece ifadedir; çözümde (x-2)(x+1) biçiminde çarpanlarına ayrılır.","ad":"Bölen"},{"deger":"sıfırdır","anlam":"Bölme tam bölünmüş demektir; bu sayede P(x) = Bölen × Bölüm eşitliği kurulabilir.","ad":"Kalan"},{"deger":"x + 3","anlam":"Bölme işleminin sonucudur; P(x) = (x² - x - 2)(x + 3) eşitliğinin diğer çarpanıdır.","ad":"Bölüm"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Polinomlarda Bölme İşlemi ve Kalan Teoremi","dogru":"A","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: P(x) = x³ + ax² + bx - 6 (soruda verilen); Bölen = x² - x - 2 (soruda verilen); Kalan = 0 (soruda verilen); Bölüm = x + 3 (soruda verilen)","anlatim":"Soru bize şunları vermiş: P(x) = x³ + ax² + bx - 6 polinomu, bölen (x² - x - 2), kalan sıfır ve bölüm polinomu (x + 3). Biz a ve b\u0027yi bulup toplamını hesaplayacağız.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Bölen = x² - x - 2 = (x - 2)(x + 1)","anlatim":"Bölme işleminde kalan sıfırsa Bölünen = Bölen × Bölüm olur - bu bölmenin temel kuralı. Önce böleni çarpanlarına ayırıyoruz, çarpım açmak kolaylaşsın.","doldur":[[6,1],[8,1]]},{"formul":"P(x) = Bölen × Bölüm = (x² - x - 2) × (x + 3)","anlatim":"Kalan sıfır olduğu için P(x)\u0027i doğrudan Bölen × Bölüm şeklinde yazabiliriz. Bu eşitlik bize a ve b\u0027yi verecek anahtar.","doldur":[[7,1]]},{"formul":"(x² - x - 2)(x + 3) = x³ + 3x² - x² - 3x - 2x - 6","anlatim":"Şimdi bu çarpımı terim terim açıyoruz, her terimi kendi x ile çarpıyoruz. Dikkat: işaretleri karıştırmamak önemli, özellikle -2 ile çarpımlarda.","doldur":[]},{"formul":"x³ + 3x² - x² - 3x - 2x - 6 = x³ + 2x² - 5x - 6","anlatim":"Aynı dereceden terimleri (x² ile x², x ile x) topluyoruz, ifadeyi sadeleştiriyoruz. Bu adımdan sonra a ve b\u0027yi doğrudan okuyabileceğiz.","doldur":[]},{"formul":"a = 2 (4. adımda bulduk); b = -5 (4. adımda bulduk)","anlatim":"P(x) = x³ + ax² + bx - 6 ile bulduğumuz x³ + 2x² - 5x - 6 ifadesini karşılaştırıyoruz. Aynı kuvvetteki terimlerin katsayıları birbirine eşit olmak zorunda.","doldur":[[10,1]]},{"formul":"a + b = 2 (5. adımda bulduk) + (-5) (5. adımda bulduk) = -3","anlatim":"Artık a ve b elimizde, sadece toplamalarını yapıyoruz. Soru bunu istiyordu.","doldur":[]},{"formul":"Ters durum: kalan sıfır değilse → P(x) = Bölen × Bölüm + Kalan","anlatim":"Ters durumda: kalan sıfır değil de belirli bir sayı verilseydi, P(x) = Bölen × Bölüm + Kalan şeklinde yazılırdı. Bu soruda kalan sıfır olduğu için o kalan terimi eşitliğe eklenmedi.","doldur":[]},{"formul":"Yanlış yol: (x²-x-2)(x+3) = x³ + 4x² - x - 6 (HATALI) → doğrusu x³ + 2x² - 5x - 6 (4. adımda bulduk)","anlatim":"En sık hata: çarpımı açarken -2 ile x terimini çarparken işareti unutup -3x yerine +3x yazmak. Bu tek işaret hatası a ve b\u0027yi tamamen değiştirir, sonucu yanlış çıkarır.","doldur":[]}],"anahtar":[{"ornek":"çarpım","kok":"çarpım"},{"ornek":"terimi","kok":"terimi"},{"ornek":"işaretleri","kok":"işaret"},{"ornek":"eşitliği","kok":"eşitli"},{"ornek":"doğrudan","kok":"doğrud"},{"ornek":"şeklinde","kok":"şeklin"}],"konuGiris":{"harita":"Ne zaman test edilir: Bölünen polinomun katsayılarında bilinmeyen harf olduğunda ve kalan verildiğinde test edilir. Nasıl ölçülür: P(x) = B(x)·Q(x) + K(x) eşitliği kurulup katsayılar karşılaştırılarak ölçülür. Nasıl kaydedilir: Bulunan a, b gibi harflerin sayısal değerleri toplanıp istenen ifade (a+b gibi) tek sayı olarak yazılır.","desen":"Bu soruda tuzak, kalanın sıfır olduğunu görüp doğrudan P(x)=B(x)·Q(x) çarpımını açmayı unutmaktır; öğrenci genelde katsayı eşleştirmede işlem hatası yapar. Bölen (x²-x-2) çarpanlarına ayrılırsa (x-2)(x+1) çıkar ama bu soruda direkt çarpım yeterlidir. Bu soru p.28\u0027deki \u0027polinom bölmesi P(x)=B(x)Q(x)+K(x)\u0027 kuralından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İçinde bilinmeyen katsayı (a, b) barındıran, bölme işlemine giren ana ifade","ad":"Bölünen polinom P(x)","kim":"soruda verilir; harfler işletme değil sorunun kendisi tarafından tanımlanır"},{"kaynak":"soruda verilir","tanim":"P(x)\u0027i böldüğümüz, derecesi küçük olan sabit ifade","ad":"Bölen polinom B(x)","kim":"Tekdüzen hesap planı ya da standart tanımlar (matematiksel kural, sabit form)"},{"kaynak":"soruda verilir","tanim":"Bölme sonucunda çıkan, P(x)=B(x)·Q(x)+K(x) eşitliğindeki çarpan","ad":"Bölüm polinomu Q(x)","kim":"kanun sabitler (matematiksel eşitlik kuralı sonucu sabittir)"},{"kaynak":"kuraldan bilinir","tanim":"Bölme sonrası kalan, derecesi bölenden küçük ifade","ad":"Kalan K(x)","kim":"kanun sabitler (kalan teoremi kuralı sabittir)"}],"sinavda":"Bölünen, bölen ve bölüm polinomları verilip kalanın sıfır olduğu belirtilerek bilinmeyen katsayıların toplamı istenir.","panel_ornek":"İkinci el bir telefonu 5 taksitle alıyorsun; toplam tutar, taksit sayısı ve kalan borç birbirine bağlı üç bilgi. Taksit sayısını ve kalan borcu bilince toplam tutarı geriye doğru hesaplayabilirsin, tıpkı bölüm ve kalanı bilip orijinal polinomu bulmak gibi.","ornek":"İkinci el bir telefonu 5 taksitle alıyorsun; toplam tutar, taksit sayısı ve kalan borç birbirine bağlı üç bilgi. Taksit sayısını ve kalan borcu bilince toplam tutarı geriye doğru hesaplayabilirsin, tıpkı bölüm ve kalanı bilip orijinal polinomu bulmak gibi.","yontemler":"B(x)·Q(x) çarpımı açılıp P(x) ile aynı dereceden terimlerin katsayıları karşılaştırılır; kalan sıfır olduğundan sabit terim de bu çarpımdan doğrudan gelir.","nedir":"Polinom sadeleştirme, polinomları çarpanlarına ayırıp bölme-kalan ilişkisini kullanma işlemidir; sınav burada bölüm ve kalan bilgisinden bilinmeyen katsayıları bulabilmeni ölçer."},"olay":"x³+3x²-x²-3x-2x-6 = x³+2x²-5x-6, yani a=2, b=-5.","tuzak":{"C":{"ad":"Atlanan Terim Tuzağı","metin":"Bu kez -x·3 = -3x teriminin dağıtımda unutulmasıyla x³+2x²-2x-6 bulunur, a=2, b=-2 sanılır. Doğrusu: -3x terimi de toplama dahil edilirse a+b=-3 çıkar."},"E":{"ad":"Çarpanlara Ayırma Tuzağı","metin":"x²-x-2 ifadesi (x-2)(x+1) yerine yanlışlıkla (x+2)(x-1)=x²+x-2 sanılıp bu çarpanla işlem yapılırsa x³+4x²+x-6 bulunur, a=4, b=1 sanılır. Doğrusu: orta terimin işareti (-x) çarpanlara doğru yansıtılmalı, sonuç -3\u0027tür."},"D":{"ad":"İşaret Tuzağı","metin":"-3x teriminin işareti yanlış alınıp +3x olarak toplanınca x³+2x²+x-6 bulunur, a=2, b=1 sanılır. Doğrusu: -3x ve -2x terimleri aynı işaretle (eksi) toplanmalı, sonuç -3\u0027tür."},"B":{"ad":"Atlanan Terim Tuzağı","metin":"Çarpımı açarken -2·x = -2x teriminin unutulmasıyla x³+2x²-3x-6 bulunur, buradan a=2, b=-3 sanılır. Doğrusu: altı çarpımın hepsi yazılmalı, doğru toplam a+b=-3\u0027tür."}},"celdiriciYol":{"C":"x³+3x²-x²-2x-6 = x³+2x²-2x-6 → a=2, b=-2 → a+b = 0 (-3x teriminin dağıtımda atlanması)","E":"(x²+x-2)(x+3) = x³+4x²+x-6 → a=4, b=1 → a+b = 5 (x²-x-2\u0027nin (x+2)(x-1) olarak yanlış çarpanlara ayrılması)","D":"x³+3x²-x²+3x-2x-6 = x³+2x²+x-6 → a=2, b=1 → a+b = 3 (-3x teriminin işaretinin yanlış alınması)","B":"x³+3x²-x²-3x-6 = x³+2x²-3x-6 → a=2, b=-3 → a+b = -1 (-2x teriminin dağıtımda atlanması)"},"hap":"Kalan sıfır olduğunda P(x) = Bölen × Bölüm eşitliği kurulur; bu çarpım her terimi tek tek açılıp aynı üslüler toplanmadan katsayı okunamaz.","teshis":{"C":{"gercek":"Aynı üslü terimler toplanmadan önce çarpımın her adımı yazılmalıdır; -x·3=-3x terimi de toplama dahildir.","ayirt":"x katsayısını bulurken -3x ve -2x\u0027in ikisini de topladım mı?","paragraf":"Benzer terimlerin toplanması","yanilgi":"Dağıtımda -3x terimini (farklı bir çarpım adımını) unutup kalan terimlerle sonuca ulaştığını sandın."},"E":{"gercek":"x²-x-2 = (x-2)(x+1)\u0027dir; kökler çarpımı -2 ve toplamı -1 veren sayılarla (-2 ve +1) belirlenir, (x+2)(x-1) farklı bir polinom (x²+x-2) verir.","ayirt":"Bulduğum çarpanları çarpıp gerçekten x²-x-2\u0027yi mi elde ediyorum, yoksa x²+x-2\u0027yi mi?","paragraf":"İkinci derece ifadelerin çarpanlarına ayrılması","yanilgi":"x²-x-2 ifadesini çarpanlarına ayırırken orta terimin işaretini karıştırıp yanlış çift kökü kullandın."},"A":{"gercek":"Polinom bölmesinde P(x)=B(x)·Q(x)+K(x) eşitliğinde K(x)=0 ise P(x)=B(x)·Q(x)\u0027tir; bu çarpım açılıp benzer terimler toplanarak katsayılar okunur.","ayirt":"Kalan sıfır dendiğinde P(x)\u0027i doğrudan Bölen ile Bölüm\u0027ün çarpımı olarak mı kurdum?","paragraf":"Polinom bölmesi ve kalan teoremi","yanilgi":"Bu şıkkı eleyen öğrenci, kalanın sıfır olmasının Bölen×Bölüm eşitliğini doğrudan kurduğunu fark etmemiştir."},"D":{"gercek":"(-x)·(3) = -3x\u0027tir, işaret çarpanların işaretine göre belirlenir; işaret hatası tüm toplamı değiştirir.","ayirt":"Çarpımdaki her terimin işaretini çarpanların kendi işaretlerine göre mi belirledim?","paragraf":"Çarpımda işaret kuralı","yanilgi":"Negatif bir terimin işaretini dağıtım sırasında yanlış aktarıp pozitif yazdığını fark etmedin."},"B":{"gercek":"(x²-x-2)(x+3) çarpımı x²·x, x²·3, -x·x, -x·3, -2·x, -2·3 terimlerinin TAMAMININ toplanmasıyla açılır; hiçbiri atlanamaz.","ayirt":"Çarpımdaki altı terimin hepsini tek tek yazıp işaretledim mi?","paragraf":"Çarpanlara ayırma ve terimlerin toplanması","yanilgi":"Dağıtımlı çarpımda altı çarpımdan birini (-2x terimini) atladığını fark etmeden işleme devam ettin."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 15"},"kural":"","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 15","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Sabitlik sorularında önce oranı doğru sırayla (pay/payda) kur, sonra x=0 gibi bir değerle sağlama yap.","konu":"sabit fonksiyon","tablo":{"satirlar":[["VERİLENLER","-","-"],["pay x katsayısı","4","-"],["payda sabiti","6","-"],["sabit değer","1/2","-"],["HESAP","-","-"],["B hesabı","4 / b = 1/2 → b = 4 ÷ (1/2)","8"],["A hesabı","A / 6 = 1/2 → a = 6 × (1/2)","3"],["A + b","3 + 8","11"]],"basliklar":["Kalem","Hesap","Sonuç"]},"siklar":{"C":"11","E":"20","A":"5","D":"14","B":"8"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Verilen sabit değer 1/2 yerine tersi olan 2 kullanılırsa b = 2, a = 12 bulunup 14 çıkar; verilen değer değiştirilmemelidir.","E":"b hesabında 1/2 kullanılıp b = 8 bulunur ama a hesabında yanlışlıkla 2 kullanılır; her iki orana da aynı değer aynı şekilde uygulanmalıdır.","A":"Oranı ters kurarak b/4 = 1/2 yazılırsa b = 2 çıkar ve hata başlar; doğru oran 4/b\u0027dir.","B":"b = 8 doğru bulunur ama a hesaplanmadan atlanır ve cevap sadece b yazılır; a + b sorulduğu için a da eklenmelidir."},"dogru":"Sabit fonksiyon her x için aynı değeri verir. Rasyonel ifadede payın katsayılarının, paydanın katsayılarına oranı eşit olmalıdır: 4/b = a/6 = 1/2. Buradan b = 8 ve a = 3 bulunur, toplam 11 olur.","sinav":"Rasyonel fonksiyonun sabit olması için pay ve payda orantılı olmalıdır: pay katsayıları / payda katsayıları = sabit değer.","kavramlar":[{"kaynak":"TEORI","tanim":"Tanım kümesindeki her x için aynı değeri alan fonksiyondur. Rasyonel biçimde f(x) = (ax + b)/(cx + d) sabit ise pay ile payda orantılıdır: a/c = b/d ve sabit değer bu orandan hesaplanır.","ad":"Sabit fonksiyon"},{"kaynak":"TEORI","tanim":"Rasyonel fonksiyonun sabit olabilmesi için payın her katsayısının paydanın karşılık gelen katsayısına oranı eşit olmalıdır.","ad":"Katsayı oranı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,1],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Kalem","Hesap","Sonuç"],"satirlar":[["Q hesabı","5 / q = 1/4 → q = 5 ÷ (1/4)","20"],["P hesabı","p / 8 = 1/4 → p = 8 × (1/4)","2"],["P + Q","2 + 20","22"]]},"tur":"tablo","soru":"g(x) = (5x + p) / (qx + 8) fonksiyonu sabit fonksiyondur ve g(x) = 1/4\u0027tür. Buna göre p + q kaçtır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve p+q\u0027nun kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"f(x) = (4x + a) / (bx + 6) fonksiyonu sabit fonksiyondur ve f(x) = 1/2\u0027dir. Buna göre a + b kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-20","verilenler":[{"deger":"4","anlam":"f(x) fonksiyonunun payındaki x\u0027in katsayısı; sabitlik oranında payda katsayısı b\u0027ye bölünecek değer.","ad":"pay x katsayısı"},{"deger":"6","anlam":"f(x) fonksiyonunun paydasındaki sabit terim; a\u0027nın bu terime oranı sabit değere eşitlenecek.","ad":"payda sabiti"},{"deger":"1/2","anlam":"f(x) fonksiyonunun aldığı sabit değer; hem 4/b hem de a/6 oranı bu değere eşitlenir.","ad":"sabit değer"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Sabit Fonksiyon (rasyonel ifadede katsayı oranı kuralı)","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: f(x) = (4x + a) / (bx + 6) (soruda verilen); fonksiyon sabit (soruda verilen); f(x) = 1/2 (soruda verilen)","anlatim":"Soru bize fonksiyonun sabit olduğunu ve değerinin f(x) = 1/2 olduğunu söylüyor. Sabit fonksiyon demek x ne olursa olsun sonuç hep aynı demek.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"B hesabı = 4 / b = 1/2 → b = 4 / (1/2) = 8","anlatim":"Fonksiyon sabit olduğu için pay ve paydadaki x\u0027li terimlerin oranı da bu sabit değere eşit olmak zorunda. Yoksa x değiştikçe sonuç değişirdi.","doldur":[[5,1],[5,2]]},{"formul":"A hesabı = a / 6 = 1/2 → a = 6 × 1/2 = 3","anlatim":"Aynı mantıkla payın ve paydanın sabit terimlerinin oranı da bu sabit değere eşit olmalı. Bu yüzden a/6 de 1/2\u0027ye eşit yazılır.","doldur":[[6,1],[6,2]]},{"formul":"a + b = 3 (3. adımda bulduk) + 8 (2. adımda bulduk) = 11","anlatim":"b\u0027yi 2. adımda, a\u0027yı 3. adımda bulduk, artık toplamayı yapıyoruz. Soru direkt a + b\u0027yi istiyor.","doldur":[[7,1],[7,2]]},{"formul":"Sonuç = a + b = 11","anlatim":"Sonucu bulduk, a + b = 11 çıktı. Şimdi sık yapılan hatayı gösterelim.","doldur":[]},{"formul":"Yanlış yol: sadece a / 6 = 1/2 kullanıp b = 6 sanmak (HATALI) → doğrusu b = 8 (2. adımda bulduk)","anlatim":"Bazı öğrenciler sadece sabit terimleri oranlayıp b\u0027yi 6 sanır, x\u0027li terimleri hesaba katmaz. Sabit fonksiyonda hem x\u0027li hem sabit terimlerin oranı aynı olmalı, ikisi de kontrol edilmeli.","doldur":[]}],"anahtar":[{"ornek":"terimlerin","kok":"teriml"},{"ornek":"fonksiyon","kok":"fonksi"},{"ornek":"değere","kok":"değere"},{"ornek":"katsayılarının","kok":"katsay"},{"ornek":"adımda","kok":"adımda"},{"ornek":"bulduk","kok":"bulduk"}],"konuGiris":{"harita":"Ne zaman test edilir: rasyonel ifadeli fonksiyonun sabit fonksiyon olduğu söylendiğinde. Nasıl ölçülür: pay ve paydadaki karşılık gelen katsayıların oranının eşit olup olmadığına bakılarak. Nasıl kaydedilir: bulunan a ve b değerleri toplanıp tek sayı olarak yazılır.","desen":"Bu tip sorularda öğrenci genelde \u0027pay=payda\u0027 sanıp oranı yanlış kurar, oysa katsayılar arasındaki oran eşitliği aranmalıdır. Sabit değer hem oran hem x=0 yazılarak bulunabilir, ikisi tutmuyorsa hata vardır. Bu soru p.28\u0027deki rasyonel sabit fonksiyon katsayı koşulu noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"her x için aynı değeri veren fonksiyon, f(x)=c","ad":"sabit fonksiyon","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"payın katsayılarının paydanın karşılık katsayılarına eşit oranda olması","ad":"katsayı orantısı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"pay katsayısının payda katsayısına oranından çıkan sonuç","ad":"sabit değer (c)","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"orantı denklemlerinden çözülen katsayı değerleri","ad":"a ve b bilinmeyenleri","kim":"kanun sabitler"}],"sinavda":"Rasyonel ifadeli bir fonksiyonun sabit fonksiyon olduğu ve sabit değerinin verildiği bilgisiyle a+b istenir.","panel_ornek":"Bir markette 3 kg\u0027lık ve 6 kg\u0027lık şeker paketlerinin kilogram fiyatı hep aynı 10 liradır, yani paket büyüklüğü değişse de birim fiyat sabit kalır. Bu orantı mantığı, payla paydanın katsayılarının birbirine oranlı olması durumudur.","ornek":"Bir markette 3 kg\u0027lık ve 6 kg\u0027lık şeker paketlerinin kilogram fiyatı hep aynı 10 liradır, yani paket büyüklüğü değişse de birim fiyat sabit kalır. Bu orantı mantığı, payla paydanın katsayılarının birbirine oranlı olması durumudur.","yontemler":"Payın katsayılarının paydanın katsayılarına oranı sabit değere eşitlenip a ve b bulunur; en kritik kural bu oranların ikisinin de aynı sabit değere eşit olmasıdır.","nedir":"Sabit fonksiyon, tanım kümesindeki her x için hep aynı değeri veren fonksiyondur. Sınav bu tür sorularda payla paydanın katsayılarının orantılı olup olmadığını ölçer."},"olay":"","tuzak":{"D":{"ad":"Değer Tersleme Tuzağı","metin":"Verilen sabit değer 1/2 yerine tersi olan 2 kullanılarak b = 2, a = 12 bulunur, toplam 14 çıkar. Doğrusu: oranlar verilen 1/2 değerine eşitlenmelidir, tersi alınmaz."},"E":{"ad":"Tutarsız Hesap Tuzağı","metin":"b hesabında doğru değer (1/2) kullanılıp b = 8 bulunur, ama a hesabında yanlışlıkla değerin tersi (2) kullanılıp a = 12 bulunur; 8 + 12 = 20 çıkar. Doğrusu: her iki oranda da aynı sabit değer aynı şekilde kullanılmalıdır."},"A":{"ad":"Ters Oran Tuzağı","metin":"Sabitlik oranını b/4 = 1/2 şeklinde ters kurup b = 2 bulunur, a doğru hesaplanır (a = 3), toplam 2 + 3 = 5 çıkar. Doğrusu: oran pay/payda = 4/b sırasıyla kurulmalıdır."},"B":{"ad":"Bilinmeyen Atlama Tuzağı","metin":"b = 8 doğru bulunur ama a hesaplanmadan sonuç doğrudan b olarak yazılır. Doğrusu: soru a + b toplamını sorduğu için a da bulunup eklenmelidir."}},"celdiriciYol":{"D":"4/b = 2 → b = 2; a/6 = 2 → a = 12; 2 + 12 = 14 (sabit değer 1/2 yerine tersi 2 alındı)","E":"4/b = 1/2 → b = 8 (doğru); a/6 = 2 → a = 12 (a hesabında değer tersleniyor); 8 + 12 = 20 (yalnız a hesabında değer ters alındı)","A":"b/4 = 1/2 → b = 2 (oran ters kuruldu); a/6 = 1/2 → a = 3; 2 + 3 = 5 (oran ters kuruldu)","B":"4/b = 1/2 → b = 8; a hesaplanmadan sonuç yalnızca b olarak yazıldı = 8 (a atlandı)"},"hap":"Rasyonel ifadede sabit fonksiyon koşulu, pay katsayılarının payda katsayılarına oranının birbirine ve verilen sabit değere eşit olmasıdır.","teshis":{"C":{"gercek":"Rasyonel ifadede sabit fonksiyon koşulu 4/b = a/6 = sabit değer şeklindedir; verilen değer 1/2 ile b = 8, a = 3 bulunur.","ayirt":"Bulduğum a ve b değerlerini fonksiyona koyup her x için aynı sonucu verdiğini kontrol ettim mi?","paragraf":"Sabit fonksiyon - rasyonel ifade katsayı oranı kuralı","yanilgi":"Sabit fonksiyon koşulunun pay ve payda katsayılarının orantılı olması gerektiğini bilmeyip yalnızca sayıların eşit olması gerektiğini sandım."},"E":{"gercek":"Aynı sabit değer, pay/payda oranının her ikisinde de aynı şekilde kullanılmalıdır.","ayirt":"b ve a hesaplarımda aynı sabit değeri mi kullandım, sonuçlar birbirini destekliyor mu?","paragraf":"Sabit fonksiyon - rasyonel ifade katsayı oranı kuralı","yanilgi":"b\u0027yi doğru bulsam da a hesabında değeri ters kullandım ve iki hesap arasındaki tutarsızlığı fark etmedim."},"A":{"gercek":"Rasyonel sabit fonksiyonda oran pay katsayısı / payda katsayısı = sabit değer sırasıyla kurulur, ters çevrilmez.","ayirt":"Kurduğum oranda x\u0027li terimin katsayısı payda mı, paydada mı?","paragraf":"Sabit fonksiyon - rasyonel ifade katsayı oranı kuralı","yanilgi":"Oranı payda/pay şeklinde kurup hangi tarafın hangi tarafa eşit olduğunu ters aldım."},"D":{"gercek":"Oranlar, soruda verilen sabit değere aynı şekilde (tersiz) eşitlenir.","ayirt":"Kullandığım sabit değer soruda verilenin tıpatıp aynısı mı?","paragraf":"Sabit fonksiyon - rasyonel ifade katsayı oranı kuralı","yanilgi":"Verilen sabit değeri (1/2) kullanırken tersini (2) aldım."},"B":{"gercek":"Soru iki bilinmeyenin toplamını sorar; her iki bilinmeyen bulunup toplanmalıdır.","ayirt":"Sorunun tam olarak toplamı mı yoksa tek bir değeri mi istediğini tekrar okudum mu?","paragraf":"Sabit fonksiyon - rasyonel ifade katsayı oranı kuralı","yanilgi":"a\u0027yı da hesaplamam gerektiğini unutup sadece b\u0027yi cevap olarak yazdım."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 11"},"kural":"9(b-a)=18 → b-a=2 ve a+b=12.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 11","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Rakamlar toplamı ve yer değiştirme farkını iki ayrı denklem olarak yaz, ikisini birlikte çöz; tek koşulla sayıyı sabitlemeye çalışma.","konu":"sayı basamakları","tablo":{"satirlar":[["VERİLENLER","-"],["rakamlar toplamı","12"],["yer değiştirince artış","18"],["HESAP","-"],["Sayı çözümleme","Ab = 10a + b"],["Rakamlar toplamı denklemi","A + b = 12"],["Yer değiştirme fark denklemi","9(b - a) = 18 → b - a = 2"],["Sistemin çözümü","A+b=12 ve b-a=2 → 2b=14 → b=7, a=5"],["Sayı","57"]],"basliklar":["Adım","İşlem/Sonuç"]},"siklar":{"C":"57","E":"75","A":"39","D":"66","B":"48"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Rakamlar toplamı 12\u0027yi ikiye bölerek a = b = 6 alan kişiler fark koşulunu tamamen görmezden gelir; oysa iki rakam birbirinden farklı olmalıdır.","E":"Sayının 18 azaldığını sanıp a − b = 2 kurulursa a = 7, b = 5 çıkıp sayı 75 bulunur; ama soru açıkça 18 ARTTĞını söyler.","A":"Fark koşulunu 9 yerine 3\u0027e bölüp b − a = 6 kuranlar bu cevaba varır; oysa yer değiştirme farkının katsayısı daima 9\u0027dur.","B":"Doğru denklemleri kurulur (a + b = 12 ve b − a = 2) ama taraf tarafa toplarken 2b = 16 yanlış hesaplandığında b = 8 ve a = 4 çıkıp sayı 48 bulunur."},"dogru":"Sayıyı 10a + b olarak yazıp iki şartı denkleme dökelim: rakamlar toplamı a + b = 12, yer değiştirince sayı 18 arttığından 9(b − a) = 18 yani b − a = 2. Bu iki denklemi çözerek b = 7, a = 5 bulunur; sayı 57\u0027dir.","sinav":"İki basamaklı sayının rakamları toplamı 12 ve rakamları yer değiştirince sayı 18 arttığına göre, basamak çözümlemesi ile kurulan a + b = 12 ve 9(b − a) = 18 denklem sistemi çözülür.","kavramlar":[{"kaynak":"TEORI","tanim":"iki basamaklı ab sayısı ile ba sayısının farkı (10a + b) − (10b + a) = 9(a − b) formülüne uyar; bu değer her zaman 9\u0027un katıdır.","ad":"rakamları yer değiştirme farkı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[3,1],[4,1]],"tablo":{"basliklar":["Adım","İşlem/Sonuç"],"satirlar":[["Sayı çözümleme","Ab = 10a + b"],["Rakamlar toplamı denklemi","a + b = 14"],["Yer değiştirme fark denklemi","9(b - a) = 36 → b - a = 4"],["Sistemin çözümü","a+b=14 ve b-a=4 → 2b=18 → b=9, a=5"],["Sayı","59"]]},"tur":"tablo","soru":"İki basamaklı bir sayının rakamları toplamı 14\u0027tür. Bu sayının rakamları yer değiştirdiğinde sayı 36 artmaktadır. Bu sayı kaçtır?","verilen":[[1,1],[2,1]],"hedef":"Tabloyu doldur ve sayının 59 olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İki basamaklı bir sayının rakamları toplamı 12\u0027dir. Bu sayının rakamları yer değiştirdiğinde sayı 18 artmaktadır. Bu sayı kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-21","verilenler":[{"deger":"12","anlam":"İki basamaklı sayının a+b toplamını verir, birinci denklemi kurmada kullanılır.","ad":"rakamlar toplamı"},{"deger":"18","anlam":"Rakamlar yer değiştirince sayının kaç artığını verir, 9(b-a)=18 denklemini kurmada kullanılır.","ad":"yer değiştirince artış"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu, Sayı Basamakları - Temel Sonuçlar (yer değiştirme farkı 9(a-b))","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: rakamlar toplamı a + b = 12 (soruda verilen); yer değiştirince artış 18 (soruda verilen)","anlatim":"Soru bize şunları vermiş: rakamlar toplamı 12, yer değiştirince sayı 18 artıyor. Bu iki bilgiyi denkleme çevireceğiz.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Sayı = 10 × a + b → 10a + b","anlatim":"İki basamaklı sayıyı onlar ve birler basamağıyla yazıyoruz. Böylece rakamları harflerle ifade edebiliyoruz.","doldur":[[4,1],[5,1],[8,1]]},{"formul":"Fark = (10b + a) - (10a + b) = 9(b - a) = 18 (soruda verilen) → b - a = 2","anlatim":"Rakamlar yer değiştirince yeni sayı 10b + a olur. Bu sayı eskisinden 18 fazla olduğu için farkı kuruyoruz.","doldur":[]},{"formul":"a + b = 12 (soruda verilen) ve b - a = 2 (2. adımda bulduk) → taraf tarafa topla: 2b = 14 → b = 7","anlatim":"Şimdi iki denklemi birlikte çözüyoruz. Toplama denklemini kullanarak b\u0027yi bulacağız.","doldur":[]},{"formul":"a = 12 (soruda verilen) - 7 (3. adımda bulduk) = 5","anlatim":"b\u0027yi bulduk, şimdi a\u0027yı toplama denkleminden çıkarıyoruz. Böylece iki rakamı da tespit ediyoruz.","doldur":[]},{"formul":"Sayı = 10 × 5 (4. adımda bulduk) + 7 (3. adımda bulduk) = 57","anlatim":"Rakamları bulduk, şimdi sayıyı yazıyoruz. Onlar basamağı a, birler basamağı b idi.","doldur":[]},{"formul":"Sağlama: 75 - 57 = 18 ✓ (5. adımda bulduğumuz sayı doğrulandı)","anlatim":"Bulduğumuz sayıyı sağlama yapalım. Rakamları yer değiştirip 18 fazla çıkıyor mu bakıyoruz.","doldur":[]},{"formul":"Yanlış yol: a + b = 12 tek başına → a=6,b=6 sayısı 66 (HATALI) → doğrusu 57 (6. adımda bulduk)","anlatim":"Yanlış yol: sadece toplam denklemine bakıp rastgele rakam denemek çoğu zaman yanlış sayıya götürür. Fark denklemini de kurmak zorunludur.","doldur":[]}],"anahtar":[{"ornek":"rakamlar","kok":"rakaml"},{"ornek":"denkleme","kok":"denkle"},{"ornek":"basamaklı","kok":"basama"},{"ornek":"değiştirince","kok":"değişt"},{"ornek":"sayıyı","kok":"sayıyı"},{"ornek":"yazıyoruz","kok":"yazıyo"}],"konuGiris":{"harita":"Ne zaman test edilir: rakamları yer değiştirme veya basamak toplamı verilen sayı sorularında test edilir. Nasıl ölçülür: sayı 10a+b biçiminde çözümlenip iki denklem kurularak ölçülür. Nasıl kaydedilir: bulunan a ve b değerleri sayıya geri konup sağlama yapılarak kaydedilir.","desen":"Sınav genelde rakamlar toplamı ile yer değiştirme farkını birlikte verip iki bilinmeyenli denklem kurdurur. Tuzak, farkın 9\u0027un katı olduğunu unutup a ve b\u0027yi ters kurmaktır (p.28). Bu soru rakamlar toplamı ve yer değiştirme farkının denkleme dökülmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Rakamın çarpıldığı basamağın (birler, onlar) değeri","ad":"Basamak değeri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Rakamın kendi değeri, basamağından bağımsız","ad":"Sayı değeri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Sayıyı oluşturan rakamların birbirine eklenmiş hali","ad":"Rakamlar toplamı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Rakamları ters çevrilmiş sayı ile asıl sayının farkı","ad":"Yer değiştirme farkı","kim":"kanun sabitler"}],"sinavda":"Rakamları toplamı 12 olan iki basamaklı sayı, rakamları yer değiştirince 18 artıyor; sayı sorulur.","panel_ornek":"Bir markette iki ürünün fiyatları toplamı 12 lira. Etiketler karışıp fiyatlar ters yazılınca toplam fark 18 lira çıkıyor. Sen de hangi ürünün kaç lira olduğunu bulman gerekiyor, tıpkı bu sorudaki gibi.","ornek":"Bir markette iki ürünün fiyatları toplamı 12 lira. Etiketler karışıp fiyatlar ters yazılınca toplam fark 18 lira çıkıyor. Sen de hangi ürünün kaç lira olduğunu bulman gerekiyor, tıpkı bu sorudaki gibi.","yontemler":"Sayıyı 10a+b olarak çözümle, toplam ve fark denklemlerini kurup a-b ile a+b\u0027yi birlikte çöz; sonucu sağlama yaparak doğrula.","nedir":"Sayı basamakları konusu, sayıları \u0027onlar ve birler\u0027 gibi parçalara ayırıp aralarındaki ilişkiyi kurmayı öğretir. Sınav, rakamlar toplamı ile yer değiştirme farkını denkleme dökme becerini ölçer."},"olay":"2b=14 → b=7, a=5.","tuzak":{"D":{"ad":"Bölme Tuzağı","metin":"rakamlar toplamı 12\u0027yi ikiye bölüp a=b=6 aldın, fark koşulunu hiç kullanmadın. Doğrusu: fark koşulu rakamların birbirinden farklı olmasını gerektirir."},"E":{"ad":"Yön Tuzağı","metin":"sayının yer değiştirince azaldığını düşünüp a-b=2 kurdun. Doğrusu: soru sayının 18 ARTTIĞINI söyler, yani büyük rakam birler basamağında olmalı, b\u003ea."},"A":{"ad":"Katsayı Tuzağı","metin":"9(b-a)=18 kuralı yerine farkı yanlış bir çarpanla (3 ile) bölüp b-a=6 kurdun; bu geçersiz bir sistemdir. Doğrusu: fark koşulunun katsayısı her zaman 9\u0027dur."},"B":{"ad":"İşlem Tuzağı","metin":"a+b=12 ve b-a=2 denklemlerini taraf tarafa toplarken 2b=14 yerine 2b=16 hesapladın. Doğrusu: iki denklemi toplayınca 2b=14 çıkar, b=7 olur."}},"celdiriciYol":{"D":"Rakamlar toplamı 12\u0027yi ikiye bölüp a=b=6 alma, fark koşulunu hiç kullanmama: sayı=66 (fark bilgisini gözden kaçırma)","E":"Yer değiştirince sayının azaldığını düşünüp a-b=2 kurma: a+b=12, a-b=2 → a=7, b=5 → sayı=75 (artış/azalış yönünü ters alma)","A":"9(b-a)=18 yerine katsayıyı yanlışlıkla 3 alıp b-a=6 kurma: a+b=12, b-a=6 → a=3, b=9 → sayı=39 (fark katsayısını 9 yerine yanlış çarpanla kullanma)","B":"a+b=12 ve b-a=2 denklemlerini toplarken 12+2=16 gibi işlem hatası yapma: 2b=16 → b=8, a=4 → sayı=48 (toplama/çıkarma işlem hatası)"},"hap":"İki basamaklı bir sayıda rakamlar yer değiştirince oluşan fark her zaman 9 ile rakamlar farkının çarpımına eşittir.","teshis":{"C":{"gercek":"b-a=2 ve a+b=12 sisteminin tek çözümü a=5, b=7\u0027dir; sayı 57\u0027dir.","ayirt":"Bulduğum sayıyı soruya geri koyup her iki koşulu (toplam ve fark) birlikte kontrol ettim mi?","paragraf":"Temel Sonuçlar - Sağlama","yanilgi":"Rakamları toplamı 12 olan herhangi bir sayı çiftinin de fark koşulunu otomatik sağlayacağını düşünüp farklı bir çift seçebilirsin."},"E":{"gercek":"Soru sayının 18 ARTTIĞINI belirtir; bu durumda birler basamağındaki rakam onlar basamağındakinden büyük olmalıdır (b\u003ea).","ayirt":"Yer değiştirmiş sayı orijinalinden büyük mü küçük mü, soru hangisini söylüyor?","paragraf":"Sınav Tuzağı - 2","yanilgi":"Yer değiştirince sayının artacağını değil azalacağını varsayıyorsun."},"A":{"gercek":"Onlar-birler basamaklı bir sayıda yer değiştirme farkı her zaman 9(a-b) biçimindedir, başka katsayı geçerli değildir.","ayirt":"Farkı 9\u0027a böldüğümde çıkan sonuç rakam sınırları içinde (0-9) mı?","paragraf":"Temel Sonuçlar","yanilgi":"Yer değiştirme farkının 9 katı yerine farklı bir çarpan kullanılabileceğini düşünüyorsun."},"D":{"gercek":"Toplamın yarısı ancak a=b olduğunda geçerlidir; burada fark koşulu (18 artış) rakamların farklı olmasını gerektirir.","ayirt":"Fark koşulunu (18 artış) kullandım mı, yoksa sadece toplamla mı yetindim?","paragraf":"Temel Sonuçlar","yanilgi":"Rakamlar toplamının yarısının doğrudan her iki rakamı verdiğini, yani rakamların eşit olduğunu düşünüyorsun."},"B":{"gercek":"İki denklem taraf tarafa toplanınca 2b=14 çıkar, 16 değil.","ayirt":"Bulduğum b değerini a+b=12\u0027de yerine koyup sağlama yaptım mı?","paragraf":"Çözüm Adımları - Sağlama","yanilgi":"a+b=12 ve b-a=2 sistemini toplarken elde ettiğin 2b değerini doğru topladığını sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 8"},"kural":"x = a + 1/x eşitliğinden a = (x²-1)/x elde edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 8","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Ters sorularda önce denklemi harfle kur, sonra bilinen değeri yerine koy; örnek sorudaki sabit sayıları asla doğrudan taşıma.","konu":"sürekli kesir","tablo":{"satirlar":[["VERİLENLER","-","-"],["sürekli kesir değeri","x = 1 + √2","-"],["denklem kuralı","x = a + 1/x","-"],["HESAP","-","-"],["X²","(1+√2)²","3+2√2"],["X²-1","(3+2√2)-1","2+2√2"],["A=(x²-1)/x","(2+2√2)/(1+√2)","2"]],"basliklar":["Adım","İfade","Sonuç"]},"siklar":{"C":"2","E":"3","A":"1","D":"1 + √2","B":"√2"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Denklemde sabit terim −1\u0027i unuttun, x² − ax = 0 yazıp a = x sonucuna vardın; ancak x = a olamaz, −1 sabit terimi ihmal edilemez.","E":"Kaynaktaki x = 2 + 1/(2 + …) örneğindeki a = 2 sonucunu ezber gibi aklında tutup, sorudaki x = 1 + √2 için de geçerli saydın; her kesir kendi a\u0027sını talep eder.","A":"Başka bir sonsuz kesir örneğindeki a = 1 değerini, sorudaki x = 1 + √2 durumuna doğrudan uyguladın; her sonsuz kesrin a\u0027sı kendi x değerinden ayrıca hesaplanmalıdır.","B":"Payda adımını hatalı sadeleştirirken x² − 1\u0027i x − 1\u0027e indirdin; (x² − 1)/x ifadesi tam olarak çalışmadığında √2 gibi yanlış ara sonuca ulaşırsın."},"dogru":"Sonsuz kesir x = a + 1/x biçiminde yazılırsa, x² = ax + 1 olur, buradan a = (x² − 1)/x formülü çıkar. x = 1 + √2 değerini yerine koyup hesaplarsak a = 2 bulunur.","sinav":"Sonsuz sürekli kesirde tekrarlanan terim a\u0027nın bulunması için denklem yöntemi kullanılır: x = a + 1/x eşitliğinden a = (x² − 1)/x elde edilir.","kavramlar":[{"kaynak":"TEORI","tanim":"Aynı desen sonsuz kez tekrar eden, paydasında kesir bulunan iç içe kesirdir. Denkleme dönüştürülerek, kesrin değerine eşit x değişkeni bulunur.","ad":"Sonsuz sürekli kesir"},{"kaynak":"TEORI","tanim":"Sonsuz kesirde tekrarlanan bölüm bütüne eşit tutulur (x = a + 1/x gibi), ortaya çıkan denklem çözülür ve pozitif kök seçilir.","ad":"Kesir-denklem dönüşümü"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Adım","İfade","Sonuç"],"satirlar":[["X²","(2+√5)²","9+4√5"],["X²-1","(9+4√5)-1","8+4√5"],["A=(x²-1)/x","(8+4√5)/(2+√5)","4"]]},"tur":"tablo","soru":"Aynı \u0027a\u0027 teriminin sonsuza dek tekrarlandığı bir sürekli kesir, x = a + 1/x eşitliğini sağlar. Bu sonsuz kesrin değeri x = 2 + √5 olduğuna göre a kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve a\u0027nın kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Aynı \u0027a\u0027 teriminin sonsuza dek tekrarlandığı bir sürekli kesir, x = a + 1/x eşitliğini sağlar. Bu sonsuz kesrin değeri x = 1 + √2 olduğuna göre a kaçtır?","kayitBaslik":"","id":"sgs-t1-genel-mat-cokzor/kp-28","verilenler":[{"deger":"x = 1 + √2","anlam":"sonsuz sürekli kesrin sonucu; a\u0027yı bulmak için denklemde yerine konulacak bilinen değer","ad":"sürekli kesir değeri"},{"deger":"x = a + 1/x","anlam":"sonsuz tekrarlı sürekli kesrin sağladığı temel denklem, buradan a çekilecek","ad":"denklem kuralı"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Sürekli Kesirler bölümü","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: x = 1 + √2 (soruda verilen); Denklem x = a + 1/x (soruda verilen)","anlatim":"Soru bize şunları vermiş: sürekli kesrin denklemi x = a + 1/x, bir de kesrin değeri x = 1 + √2. İstenen tek şey: a kaç?","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"a = (x² - 1) / x → x = a + 1/x denkleminden türetildi","anlatim":"Şimdi a\u0027yı yalnız bırakıyoruz, çünkü denklemde a\u0027nın karşımıza çıkması için 1/x\u0027i atıp x ile çarpmamız gerekiyor. Bak: x = a + 1/x\u0027i x ile çarparsak x² = ax + 1 olur, oradan a çekilir.","doldur":[]},{"formul":"X² = (1 + √2)² (soruda verilen) = 3 + 2√2","anlatim":"Önce x\u0027in karesini alıyoruz, çünkü formülümüzde x² var. Dikkat: (1+√2)² açılırken çapraz çarpım terimini unutma.","doldur":[]},{"formul":"X² - 1 = (3 + 2√2) (2. adımda bulduk) - 1 = 2 + 2√2","anlatim":"Şimdi X²\u0027den 1 çıkarıyoruz, çünkü formülün payı bu. Az önce bulduğumuz sonuçtan direkt devam ediyoruz.","doldur":[]},{"formul":"A = (X² - 1) / X = (2 + 2√2) (3. adımda bulduk) / (1 + √2) (soruda verilen) = 2","anlatim":"Son adımda payı payda olan x\u0027e bölüyoruz, çünkü a\u0027nın formülü tam olarak bu bölüm. Payda ile payı ortak çarpanına göre sadeleştirirsen iş kolaylaşır. Sonuç: a = 2 çıktı. Bu, verilen sürekli kesrin terimi.","doldur":[]},{"formul":"Yanlış yol: a = x - 1 = (1 + √2) - 1 = √2 (HATALI) → doğrusu a = 2 (4. adımda bulduk)","anlatim":"En sık hata: öğrenci a\u0027yı bulurken x\u0027i doğrudan a sanıp x-1 işlemine kalkışır. Bu yanlıştır, çünkü formülde bölme işlemi atlanmış olur.","doldur":[]}],"anahtar":[{"ornek":"formülüyle","kok":"formül"},{"ornek":"kesrin","kok":"kesrin"},{"ornek":"denklemi","kok":"denkle"},{"ornek":"sürekli","kok":"sürekl"},{"ornek":"değeri","kok":"değeri"},{"ornek":"işlemine","kok":"işlemi"}],"konuGiris":{"harita":"Ne zaman denklemle çözülür: desen sonsuza dek aynı şekilde tekrar ettiğinde. Nasıl kurulur: bütüne x denir, iç tekrar eden parça da x\u0027e eşitlenip x = a + 1/x yazılır. Nasıl seçilir: ikinci derece denklemin kökleri arasından kesir pozitif olduğu için pozitif kök alınır.","desen":"Soru genelde x = a + 1/x biçiminde kurulan denklemin ikinci derece hale getirilip a ya da x\u0027in bulunmasını ister. Tuzak, negatif kökün de denklemi sağlaması ama kesrin pozitif olması nedeniyle elenmesi gerektiğidir (p.28). Bu soru sonsuz sürekli kesrin denklemle kurulması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"paydasında yeniden kesir bulunan iç içe kesir ifadesi","ad":"sürekli kesir","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"sonsuz kesrin tüm ifadeye eşitlenen sabit değeri","ad":"x (kesrin değeri)","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"her katta tekrar eden, denklemi kuran sabit sayı","ad":"a (sabit terim)","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"ikinci derece denklemin iki kökünden kesrin işaretine uyan tek kök","ad":"pozitif kök","kim":"kanun sabitler"}],"sinavda":"Sonsuz sürekli kesrin x değeri verilir, tekrar eden a sabiti istenir.","panel_ornek":"Bir arkadaşın her ay kazandığının yarısını kumbaraya koyup kalanını harcadığını, bu düzenin hep aynı kaldığını düşün. Aylar sonsuza gitse de kumbaradaki oran hep sabit kalır çünkü desen kendini tekrar eder. Sürekli kesirde de \u0027a\u0027 hep aynı kaldığı için sonsuz kesrin değeri tek bir denklemle bulunur.","ornek":"Bir arkadaşın her ay kazandığının yarısını kumbaraya koyup kalanını harcadığını, bu düzenin hep aynı kaldığını düşün. Aylar sonsuza gitse de kumbaradaki oran hep sabit kalır çünkü desen kendini tekrar eder. Sürekli kesirde de \u0027a\u0027 hep aynı kaldığı için sonsuz kesrin değeri tek bir denklemle bulunur.","yontemler":"x = a + 1/x eşitliğinde verilen x değeri yerine yazılır, elde edilen denklemden a çözülür.","nedir":"Sürekli kesir, paydasında yeniden kesir barındıran iç içe bir ifadedir; sınav bu sonsuz desenin denklemle çözülüp doğru kökün seçilip seçilmediğini ölçer."},"olay":"x²=(1+√2)²=3+2√2; x²-1=2+2√2; a=(2+2√2)/(1+√2)=2(1+√2)/(1+√2)=2.","tuzak":{"D":{"ad":"Sabit Terim Atlama Tuzağı","metin":"x² - ax - 1 = 0 denklemindeki -1 sabit terimini unutup x² - ax = 0 yazdın, bu da a=x sonucunu verir. Doğrusu: sabit terim atlanmadan a=2 bulunur, a hiçbir zaman x\u0027e eşit olamaz."},"E":{"ad":"Ezber Deseni Tuzağı","metin":"kaynaktaki x = 3 + 1/(3 + 1/(3 + ...)) örneğindeki a=3 değerini, sorudaki x=1+√2 için de geçerli sandın. Doğrusu: her sonsuz kesrin a değeri kendi x değerinden ayrıca hesaplanır."},"A":{"ad":"Ne soruluyor","metin":"sonsuz sürekli kesrin değeri verilip a teriminin bulunması isteniyor. Örnek Karıştırma Tuzağı: x = 1 + 1/x örneğindeki a=1 değerini sorudaki x=1+√2\u0027den bağımsız olarak yazdın. Doğrusu: a değeri x=1+√2 değeri denklemde yerine konularak bulunur, örnekten kopyalanmaz."},"B":{"ad":"Payda Atlama Tuzağı","metin":"(x²-1)/x ifadesini sadeleştirirken x²-1\u0027i x-1\u0027e indirip x\u0027e bölmeyi unuttun. Doğrusu: a = (x²-1)/x = 2 çıkar, x-1 = √2 sadece ara adımın hatalı kısaltılmış hâlidir."}},"celdiriciYol":{"D":"x² - a·x = 0 kurup sabit terimi (-1) atladın: a = x = 1+√2 (sabit terim atlama tuzağı)","E":"3 + 1/(3 + 1/(3 + ...)) örnek deseninin a değeri olan 3\u0027ü, bu sorunun x=1+√2 değerine bakmadan doğrudan yazdın = 3 (ezber deseni tuzağı)","A":"Örnekteki x = 1 + 1/x deseninin a değeri olan 1\u0027i, x=1+√2\u0027den bağımsız biçimde doğrudan yazdın = 1 (örnek karıştırma tuzağı)","B":"a = x - 1 = (1+√2) - 1 = √2 (x²-1 ifadesini x-1\u0027e indirip x\u0027e bölmeyi unutma tuzağı)"},"hap":"Sonsuz sürekli kesirde x = a + 1/x denklemi kurulur, a değeri x biliniyorsa a = (x²-1)/x formülüyle hesaplanır.","teshis":{"C":{"gercek":"x = a + 1/x → x² - ax - 1 = 0 denkleminden a = (x²-1)/x çekilir; x=1+√2 için a=2 çıkar.","ayirt":"a\u0027yı x²-1 ifadesini x\u0027e tam bölerek mi buldum?","paragraf":"Sonsuz sürekli kesir denklem kurma kuralı","yanilgi":"Denklemi doğru kurup pozitif kökü seçmenin yeterli olmadığını, ayrıca a için de ayrı işlem gerektiğini gözden kaçırabilirsin."},"E":{"gercek":"a değeri sorudaki x=1+√2 değerinden hesaplanır; örnekteki a=3 farklı bir sonsuz kesre (x=3+1/x) aittir.","ayirt":"Bu sayı bu sorunun x değerinden mi çıktı, yoksa aklımda kalan başka bir örnekten mi geldi?","paragraf":"Sürekli kesir örnek kalıpları","yanilgi":"Ders notundaki örnek soru kalıbındaki sayıyı, önündeki sorunun cevabı zannediyorsun."},"A":{"gercek":"Her sonsuz sürekli kesrin a değeri, kendi x değeri denklemde yerine konularak hesaplanır; örnekler yalnız yöntemi gösterir.","ayirt":"Bu a değerini örnekten mi kopyaladım, yoksa bu sorunun x\u0027inden mi hesapladım?","paragraf":"Sürekli kesir çözüm adımları","yanilgi":"Sonsuz kesrin a değerinin, ders notundaki örnek sorudaki a ile aynı olacağını düşünüyorsun."},"D":{"gercek":"x² - ax - 1 = 0 denkleminde sabit terim mutlaka hesaba katılır; atlanırsa a=x gibi yanlış bir eşitlik çıkar.","ayirt":"Denklemde sabit terimi (-1) gerçekten kullandım mı?","paragraf":"Sonsuz sürekli kesir denklem kurma kuralı","yanilgi":"Denklemdeki sabit terim -1\u0027i önemsiz sayıp atladığın için a\u0027yı x ile aynı sanıyorsun."},"B":{"gercek":"a = (x²-1)/x ifadesi, pay ve paydanın (1+√2) ortak çarpanıyla tam sadeleşmesiyle a=2 verir.","ayirt":"x²-1\u0027i x\u0027e gerçekten böldüm mü, yoksa sadece x²\u0027den x\u0027e mi geçtim?","paragraf":"Kesir-ondalık sadeleştirme kuralı","yanilgi":"x²-1 ifadesini x\u0027e bölerken payı x-1\u0027e indirip payda işlemini atlıyorsun."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 8"},"kural":"çift + tek = tek olduğundan 2a çift olduğu için 3b tek olmalı, tek katsayı (3) tek olduğundan b de tektir; a\u0027nın türü bu bilgiyle belirlenemez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 8","sonDonem":2,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce verilen bilgiden hangi harfin türü (tek/çift) kesin olarak çıkarılabildiğini bul, sonra şıklardaki her ifadeyi bu kesin bilgiyle test et; belirsiz kalan harfi taşıyan ifadeleri hemen ele.","konu":"tamsayi çift sayı","tablo":{"satirlar":[["VERİLENLER","-"],["2a katsayısı","2"],["3b katsayısı","3"],["toplamın türü","tek"],["HESAP","-"],["2a + 3b tek olmalı","2a çift olduğundan 3b tek olmalı"],["3b tek → b\u0027nin türü","B kesinlikle tektir"],["A\u0027nın türü","Denklemden belirlenemez, belirsizdir"],["I. a + 3b","A belirsiz olduğundan sonuç belirsizdir"],["II. 2a + b","Çift + tek = tek, kesinlikle tektir"],["III. 4a + 5b − 1","Çift + (tek−1=çift) = çift, kesinlikle çifttir"]],"basliklar":["Adım","Sonuç"]},"siklar":{"C":"Yalnız III","E":"II ve III","A":"Yalnız I","D":"I ve II","B":"Yalnız II"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Hem I\u0027de a\u0027yı tek hem II\u0027de b\u0027yi çift varsayarak iki ayrı hata yapılır; gerçekte I belirsiz, II kesinlikle tektir.","E":"II\u0027nin tek çıktığı fark edilmeden yalnız III\u0027teki doğru sonuçla aynı gruba konur; II kesinlikle tektir, yalnız III kesinlikle çifttir.","A":"b\u0027nin tek olduğu bulunduktan sonra a\u0027nın da tek olduğu varsayılırsa a + 3b çift görülür; oysa a belirsiz kaldığından (tek veya çift) bu ifade kesinlikle çift değildir.","B":"2a\u0027nın çift olduğu görülerek b\u0027nin çift sanılırsa; fakat b kesinlikle tektir ve çift + tek = tek olduğundan 2a + b tektir."},"dogru":"2a + 3b\u0027nin tek olması için 2a çift olduğundan 3b tek olmalı; bu da b\u0027nin tek olduğunu gösterir. III. ifadede 4a (her zaman çift) + 5b − 1 (tek − 1 = çift) = çift çıkar, ancak a\u0027nın türü bilinmediğinden I ve II a\u0027ya bağlı kalır.","sinav":"Matematik teorisi: çift ve tek tam sayılarla toplama-çarpma kuralları.","kavramlar":[{"kaynak":"TEORI","tanim":"2\u0027ye tam bölünen tam sayı; 2k biçimindedir.","ad":"Çift sayı"},{"kaynak":"TEORI","tanim":"2k + 1 biçiminde yazılan tam sayı.","ad":"Tek sayı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1],[4,1],[5,1]],"tablo":{"basliklar":["Adım","Sonuç"],"satirlar":[["3m + 2n tek olmalı","2n çift olduğundan 3m tek olmalı"],["3m tek → m\u0027nin türü","M kesinlikle tektir"],["N\u0027nin türü","Denklemden belirlenemez, belirsizdir"],["I. m + 2n","M tek olduğundan sonuç kesinlikle tektir"],["II. 3m + n","N belirsiz olduğundan sonuç belirsizdir"],["III. 6m + 7n − 1","Çift + (belirsiz+... ) ... kesinlikle çift"]]},"tur":"tablo","soru":"m ve n pozitif tam sayılar olmak üzere, 3m + 2n sayısının tek sayı olduğu biliniyor. Buna göre; I. m + 2n  II. 3m + n  III. 6m + 7n − 1 ifadelerinden hangisi/hangileri kesinlikle çift sayıdır?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve III. ifadenin kesinlikle çift olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"a ve b pozitif tam sayılar olmak üzere, 2a + 3b sayısının tek sayı olduğu biliniyor. Buna göre; I. a + 3b  II. 2a + b  III. 4a + 5b − 1 ifadelerinden hangisi/hangileri kesinlikle çift sayıdır?","kayitBaslik":"","id":"sgs-t1-genel-mat-kolay/kp-29","verilenler":[{"deger":"2","anlam":"a\u0027nın katsayısı çift olduğundan 2a her zaman çifttir, a\u0027nın türünü etkilemez","ad":"2a katsayısı"},{"deger":"3","anlam":"b\u0027nin katsayısı tek olduğundan 3b\u0027nin türü b ile aynıdır","ad":"3b katsayısı"},{"deger":"tek","anlam":"2a+3b\u0027nin tek olması verilmiş, buradan 3b\u0027nin tek olduğu ve dolayısıyla b\u0027nin tek olduğu çıkarılır","ad":"toplamın türü"}],"dayanak":"Tek-çift sayı kuralları (matematik teorisi; toplama-çıkarma ve çarpma parite kuralları)","dogru":"C","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: 2a + 3b tek (soruda verilen); İfadeler: I) a + 3b, II) 2a + b, III) 4a + 5b − 1 (soruda verilen)","anlatim":"Soru bize şunları vermiş: 2a + 3b sayısı tek (soruda verilen). a ve b pozitif tam sayı; I, II, III ifadelerinden kesinlikle çift olanı arıyoruz.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"2a + 3b = tek → 2a çift (her zaman) + 3b = tek olmalı → 3b tek","anlatim":"2a her zaman çifttir, çünkü 2 ile çarpılan her sayı çift olur. Toplam tek çıkması için 3b\u0027nin tek olması gerekir.","doldur":[[5,1],[6,1]]},{"formul":"3b tek, 3 tek olduğundan → b tek","anlatim":"3b tek ise b de tek olmak zorunda, çünkü tek katsayı (3) çarpımı b\u0027nin türünü değiştirmez. Bu yüzden b\u0027nin türü kesinleşti.","doldur":[]},{"formul":"a\u0027nın türü: denklemden belirlenemez → belirsiz","anlatim":"a hakkında hiçbir denklem yok, sadece 2a çift olduğunu biliyoruz zaten. Dikkat: a çift de olabilir tek de, bu bilgiyle ayırt edilemez.","doldur":[[7,1]]},{"formul":"I: a + 3b = a (belirsiz) + tek (3b) → sonuç belirsiz","anlatim":"I. a + 3b\u0027de a belirsiz olduğu için toplam da belirsiz olur. a çift alırsan sonuç tek, a tek alırsan sonuç çift çıkar.","doldur":[]},{"formul":"II: 2a + b = çift (2a) + tek (b) = tek → kesinlikle tek","anlatim":"II. 2a + b\u0027de 2a hep çift, b tek olduğu için toplam kesinlikle tek çıkar. a\u0027nın türü burada hiç fark etmiyor.","doldur":[]},{"formul":"III: 4a + (5b − 1) = çift (4a) + çift (5b − 1) = çift → kesinlikle çift","anlatim":"III. 4a + 5b − 1\u0027de 4a hep çift, 5b tek olduğundan 5b − 1 çift olur. Çift + çift = çift, bu ifade a\u0027dan bağımsız kesinlikle çift.","doldur":[[10,1]]},{"formul":"Yanlış yol: I veya II\u0027yi de kesin çift/tek sanmak = \u0027I, II, III hepsi kesin\u0027 (HATALI) → doğrusu yalnız III kesinlikle çift (7. adımda bulduk)","anlatim":"Sonuç: sadece III kesinlikle çift, çünkü I ve II a\u0027nın belirsiz türüne bağlı kalıyor. III ise sadece b\u0027nin tek olmasına dayanıyor, o da kesin.","doldur":[]}],"anahtar":[{"ornek":"kesinlikle","kok":"kesinl"},{"ornek":"belirsiz","kok":"belirs"},{"ornek":"olması","kok":"olması"},{"ornek":"sadece","kok":"sadece"},{"ornek":"olduğundan","kok":"olduğu"},{"ornek":"katsayısı","kok":"katsay"}],"konuGiris":{"harita":"Ne zaman test edilir: 2a+3b gibi bir toplamın türü verildiğinde diğer ifadelerin türü sorulduğunda. Nasıl ölçülür: her terimin tek mi çift mi olduğu tek-çift toplama-çarpma kurallarıyla belirlenerek. Nasıl kaydedilir: kesin sonuç veren ifade işaretlenir, belirsiz kalan elenir.","desen":"Sınav genelde bir toplamın türünü verip diğer ifadelerin kesin türünü sorar; tuzak, bilinmeyen terimin türünü tek durumla sabitleyip diğer olasılığı gözden kaçırmaktır. Öğrenci genelde \u0027tek·tek=tek\u0027 ile \u0027çift±tek=tek\u0027 kurallarını karıştırır. Bu soru tek-çift kurallarının zincirleme uygulanması noktasından geliyor (p.28, arşivde 1 dönem).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"2\u0027ye tam bölünen tam sayı, 2k biçiminde yazılır","ad":"çift sayı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"2k+1 biçiminde yazılan tam sayı","ad":"tek sayı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"soruda belirtilen ifadenin tek ya da çift olduğu bilgisi","ad":"verilen eşitliğin türü","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"a veya b\u0027nin tek mi çift mi olduğunun toplama-çarpma kurallarıyla çıkarılması","ad":"terimin türü","kim":"kanun sabitler"}],"sinavda":"a ve b pozitif tam sayı olmak üzere 2a+3b\u0027nin tek olduğu verilip üç ifadeden hangisinin kesinlikle çift olduğu istenir.","panel_ornek":"Bir markette 10 TL\u0027lik ve 20 TL\u0027lik ürünler var; kaç tane 10\u0027luk aldığın toplamın tek mi çift mi olacağını değiştirir. Mesela 3 tane 10\u0027luk (30) alırsan çift, 1 tane alırsan yine değişir; yanına eklenen sabit sayı da sonucu etkiler.","ornek":"Bir markette 10 TL\u0027lik ve 20 TL\u0027lik ürünler var; kaç tane 10\u0027luk aldığın toplamın tek mi çift mi olacağını değiştirir. Mesela 3 tane 10\u0027luk (30) alırsan çift, 1 tane alırsan yine değişir; yanına eklenen sabit sayı da sonucu etkiler.","yontemler":"Önce verilen eşitlikten b\u0027nin tek olduğu, ardından a\u0027nın hem tek hem çift olabileceği bulunur; sonra her şık bu iki duruma ayrı ayrı denenerek kesinlik aranır.","nedir":"Bu konu tam sayıların tek-çift özelliklerini ve bunların toplama-çarpma altında nasıl davrandığını inceler. Sınav, verilen bir eşitlikten yola çıkıp diğer ifadelerin türünü kesin olarak belirleyip belirleyemediğini ölçer."},"olay":"I ve II ifadeleri a\u0027nın türüne bağlı kaldığından belirsizdir; III\u0027te 4a her zaman çift, 5b tek (b tek olduğundan), 5b−1 çift, çift+çift=çift olduğundan III sonucu a\u0027dan bağımsız kesinlikle çifttir.","tuzak":{"D":{"ad":"Çifte Yanılgı Tuzağı","metin":"hem I\u0027de a\u0027yı tek varsayıp hem II\u0027de b\u0027yi çift varsayarak iki ayrı hatayı birleştiriyorsun; ikisi de a veya b\u0027nin gerçek türünü yanlış kabul eder. Doğrusu: I belirsiz, II kesinlikle tektir, ikisi de çift değildir."},"E":{"ad":"Sıra Dışı Eşleştirme Tuzağı","metin":"II\u0027nin tek çıktığını fark etmeden onu III\u0027teki doğru sonuçla aynı gruba koyuyorsun. Doğrusu: II kesinlikle tektir, yalnız III kesinlikle çifttir."},"A":{"ad":"Tek Değişken Tuzağı","metin":"a + 3b ifadesinde b\u0027nin tek olduğunu bulunca a\u0027nın da tek olduğunu varsayıp toplamı çift sanıyorsun; oysa a\u0027nın türü belirsiz kalır, ifade kimi zaman tek kimi zaman çift olur. Doğrusu: a belirsiz olduğundan I kesinlikle çift değildir."},"B":{"ad":"Çift Katsayı Tuzağı","metin":"2a\u0027nın çift olduğunu görünce toplamın otomatik çift çıkacağını düşünüp b\u0027yi de çift sanıyorsun; oysa b kesinlikle tektir, çift+tek toplamı tektir. Doğrusu: 2a + b kesinlikle tek sayıdır, çift değildir."}},"celdiriciYol":{"D":"I\u0027de a\u0027yı tek, II\u0027de b\u0027yi çift varsayıp ikisini de çift bulursun; iki ayrı yanlış varsayımın birleşimidir (çifte varsayım hatası)","E":"II\u0027yi çift sanıp III ile aynı kefeye koyarsın; II\u0027nin gerçek türünü (tek) kontrol etmeden gruplama hatası yapılır (eşleştirme hatası)","A":"a\u0027yı tek varsayıp b\u0027nin tekliğiyle toplarsan tek+tek=çift çıkar; a\u0027nın belirsizliği görmezden gelinir (a\u0027nın türünü varsayma hatası)","B":"2a çift + b\u0027yi çift varsayarsan çift+çift=çift çıkar; oysa b kesinlikle tektir, gerçek sonuç tektir (b\u0027nin türünü ters varsayma hatası)"},"hap":"Bir ifadenin \u0027kesinlikle çift/tek\u0027 olması için tüm belirsiz terimlerin katsayısı çift olmalı, yalnız kesin türü bilinen terimler sonucu belirler.","teshis":{"C":{"gercek":"4a\u0027nın katsayısı çift olduğundan a\u0027nın türü ne olursa olsun 4a çifttir; 5b−1 ise b tek olduğundan çift çıkar, çift+çift=çifttir; sonuç a\u0027dan tamamen bağımsızdır.","ayirt":"Bu ifadedeki her terimin katsayısı, bilinmeyenin türünü sonuçtan silecek kadar çift mi?","paragraf":"Tek-çift kuralı: çift katsayı × herhangi = çift","yanilgi":"Bu şıkkı eleyen öğrenci III\u0027ün de a\u0027ya bağlı kalacağını sanıp hesaplamadan geçiyor."},"E":{"gercek":"II\u0027de 2a çift, b kesinlikle tek olduğundan toplam kesinlikle tektir; III ile aynı gruba konamaz.","ayirt":"II\u0027nin sonucunu b\u0027nin gerçek türüyle (tek) yeniden hesapladım mı?","paragraf":"Tek-çift kuralı: çift+tek=tek","yanilgi":"III\u0027ün doğru olduğunu fark edip II\u0027yi de yanlışlıkla ona ekliyorsun."},"A":{"gercek":"Verilen bilgi yalnız b\u0027nin tek olduğunu belirler; a\u0027nın katsayısı verilen denklemde her zaman çift (2a) olduğundan a\u0027nın türü denklemden çıkarılamaz, iki durum da mümkündür.","ayirt":"Bu ifadenin sonucu a çift olduğunda da a tek olduğunda da aynı mı kalıyor, yoksa değişiyor mu?","paragraf":"Tek-çift kuralı: çift±tek=tek, tek±tek=çift","yanilgi":"a + 3b ifadesinde b\u0027nin tek olduğunu bulunca a\u0027nın türünü de otomatik tek sanıyorsun."},"D":{"gercek":"I, a\u0027nın türü belirsiz olduğundan kesin değildir; II ise b kesinlikle tek olduğundan kesinlikle tektir, ikisi de \u0027kesinlikle çift\u0027 tanımına uymaz.","ayirt":"Bu iki ifadeden herhangi biri, bilinmeyenin türü değişse de aynı sonucu mu veriyor?","paragraf":"Tek-çift kuralı: belirsizlik testi (iki durumu da dene)","yanilgi":"I ve II\u0027nin ikisinin de kesin çift olduğunu düşünerek iki yanlış varsayımı birleştiriyorsun."},"B":{"gercek":"2a + 3b tek olması için 3b\u0027nin tek olması gerekir; 3 tek katsayı olduğundan bu ancak b tek olduğunda mümkündür, yani b kesinlikle tektir.","ayirt":"Verilen ifadedeki b\u0027nin türünü toplamın tekliğinden mi, yoksa varsayımdan mı buldum?","paragraf":"Tek-çift kuralı: tek katsayı × tek sayı = tek","yanilgi":"2a çift olduğu için b\u0027yi de çift sanıp toplamı çift buluyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 8"},"kural":"tek+çift=tek, tek·tek=tek, çift±çift=çift kurallarıyla önce a, sonra c, sonra d\u0027nin türü zincirleme bulunur; b hiçbir koşulda geçmediği için türü belirsiz kalır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 8","sonDonem":2,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce hangi bilinmeyenlerin türü koşullardan zincirleme çıkarılabildiğini işaretle, koşullarda hiç geçmeyen bilinmeyeni belirsiz kabul et.","konu":"tamsayi çift sayı","tablo":{"satirlar":[["VERİLENLER","-","-"],["1. koşul","a + 2b tek sayı","-"],["2. koşul","a·c tek sayı","-"],["3. koşul","3c + d çift sayı","-"],["HESAP","-","-"],["A + 2b tek, 2b çift","A\u0027nın türü","Tek"],["A·c tek, a tek","C\u0027nin türü","Tek"],["3c + d çift, 3c tek","D\u0027nin türü","Tek"],["Hiçbir koşulda geçmiyor","B\u0027nin türü","Belirsiz"],["I. a + c = tek + tek","Kesinlik","Çift (kesin)"],["II. c + d = tek + tek","Kesinlik","Çift (kesin)"],["III. a + b + d = çift + b","Kesinlik","B\u0027ye bağlı, belirsiz"],["Sonuç","Kesinlikle çift olanlar","I ve II"]],"basliklar":["Adım","Çıkarım","Sonuç"]},"siklar":{"C":"I ve III","E":"II ve III","A":"Yalnız I","D":"I ve II","B":"Yalnız II"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"C":"I ve III seçilirse II\u0027yi elersin. Oysa c + d = tek + tek = çift kesinlikle sağlanır; III ise a + b + d = çift + b + tek şeklinde b\u0027nin türü bilinmediğinden kesinlikle çift değildir.","E":"II ve III seçilirse I\u0027i elersin. Oysa a + c = tek + tek = çift kesinlikle sağlanır; III ise a + b + d = çift + b + tek biçiminde b hiçbir koşulda belirlenmediğinden kesinlikle çift değildir.","A":"Yalnız I seçilirse II\u0027yi elersin. Oysa 3c + d çift ifadesinde 3c tek (tek·tek) olduğundan d de tek olmalı; böylece c + d = tek + tek = çift kesinlikle sağlanır.","B":"Yalnız II seçilirse I\u0027i elersin. Oysa a + 2b = tek eşitliğinde 2b daima çift olduğundan a kesinlikle tek olmalı; böylece a + c = tek + tek = çift kesinlikle sağlanır."},"dogru":"a + 2b tek olduğundan a kesinlikle tektir (çünkü 2b her zaman çift). a·c tek olduğundan c de tektir (tek çarpı tek eşittir tek). 3c + d çift olduğundan d tektir (tek çarpı tek artı d çift olması için d tek olmalı). Sonuç: I ve II kesinlikle çift (tek artı tek eşittir çift), ama III\u0027te b\u0027nin türü bilinmediğinden kesin değil.","sinav":"Verilen üç koşuldan önce a\u0027nın türü (a tek), sonra c\u0027nin türü (c tek), sonra d\u0027nin türü (d tek) zincirleme bulunur; b\u0027nin türü hiçbir koşulda belirlenmediğinden I = a + c = çift (kesin), II = c + d = çift (kesin), III = a + b + d = kesin olmayan (b belirsiz) olur.","kavramlar":[{"kaynak":"TEORI","tanim":"2\u0027ye tam bölünen tam sayıdır; 2k biçiminde gösterilir ve 0, 2, 4, −2, −4 gibi sayıları içerir.","ad":"Çift sayı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2],[5,1],[5,2],[6,1],[6,2],[7,1],[7,2]],"tablo":{"basliklar":["Adım","Çıkarım","Sonuç"],"satirlar":[["P + 4q tek, 4q çift","P\u0027nin türü","Tek"],["P·r tek, p tek","R\u0027nin türü","Tek"],["5r + s çift, 5r tek","S\u0027nin türü","Tek"],["Hiçbir koşulda geçmiyor","Q\u0027nün türü","Belirsiz"],["I. p + q = tek + belirsiz","Kesinlik","Belirsiz"],["II. q + r = belirsiz + tek","Kesinlik","Belirsiz"],["III. p + r + s = tek + tek + tek","Kesinlik","Tek (kesin)"],["Sonuç","Kesinlikle tek olanlar","Yalnız III"]]},"tur":"tablo","soru":"p, q, r ve s pozitif tam sayılar olmak üzere; p + 4q tek sayı, p·r tek sayı ve 5r + s çift sayıdır. Buna göre I. p + q  II. q + r  III. p + r + s sayılarından hangisi/hangileri kesinlikle tek sayıdır?","verilen":[],"hedef":"Tabloyu doldur ve kesinlikle tek sayı olan ifadenin yalnız III olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"a, b, c ve d pozitif tam sayılar olmak üzere; a + 2b tek sayı, a·c tek sayı ve 3c + d çift sayıdır. Buna göre I. a + c  II. c + d  III. a + b + d sayılarından hangisi/hangileri kesinlikle çift sayıdır?","kayitBaslik":"","id":"sgs-t1-genel-mat-zor/kp-29","verilenler":[{"deger":"a + 2b tek sayı","anlam":"2b her zaman çift olduğundan bu koşul a\u0027nın kesin tek olduğunu verir","ad":"1. koşul"},{"deger":"a·c tek sayı","anlam":"çarpımın tek olması için a ve c\u0027nin ikisinin de tek olması gerekir, a zaten tek bulunduğundan c\u0027nin de tek olduğunu doğrular","ad":"2. koşul"},{"deger":"3c + d çift sayı","anlam":"c tek olduğundan 3c tektir, toplamın çift çıkması için d\u0027nin de tek olması gerektiğini verir","ad":"3. koşul"}],"dayanak":"TESMER SGS Matematik-İstatistik Ders Notu - Tek/Çift Sayılarda Toplama ve Çarpma Kuralları","dogru":"D","oyunBonus":null,"ders":"Matematik","adimlar":[{"formul":"Verilen: a + 2b tek sayı (soruda verilen); a·c tek sayı (soruda verilen); 3c + d çift sayı (soruda verilen)","anlatim":"Soru bize üç koşul vermiş: a+2b tek, a·c tek, 3c+d çift. Bunlardan a, c, d\u0027nin tek mi çift mi olduğunu çıkaracağız.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"a + 2b = tek → 2b çift (her zaman) → a = tek","anlatim":"2b her zaman çifttir çünkü 2 ile çarpılmış. Tek çıkması için a\u0027nın tek olması gerekir.","doldur":[]},{"formul":"a·c = tek, a = tek (önceki adımda bulduk) → c = tek","anlatim":"a tek olduğuna göre a·c\u0027nin tek çıkması için c de tek olmalı. Tek çarpı tek, tek verir.","doldur":[[5,1],[5,2],[6,1],[6,2]]},{"formul":"3c + d = çift, 3c = tek (c tek olduğundan) → d = tek","anlatim":"3c işlemi tek çarpı tek olduğundan tektir. Toplam çift çıkması için d de tek olmalı.","doldur":[[7,1],[7,2]]},{"formul":"b: hiçbir koşulda yalnız geçmiyor → türü belirsiz","anlatim":"b hiçbir koşulda tek başına geçmiyor, sadece 2b olarak var. Bu yüzden b\u0027nin türünü belirleyemeyiz.","doldur":[[8,1],[8,2]]},{"formul":"I = a + c = tek + tek = çift (kesin)","anlatim":"I. ifade a+c, ikisi de tek olduğu için toplamları kesin çift. Bu yüzden I kesinlikle çifttir.","doldur":[]},{"formul":"II = c + d = tek + tek = çift (kesin)","anlatim":"II. ifade c+d, ikisi de tek olduğu için toplamları kesin çift. Bu yüzden II de kesinlikle çifttir.","doldur":[]},{"formul":"III = a + b + d = çift + b, b belirsiz → sonuç belirsiz","anlatim":"III. ifadede a+d çift çıkar ama b belirsiz olduğu için sonuç belirsiz kalır. b tek gelirse toplam tek, çift gelirse çift olur.","doldur":[[11,1],[11,2],[12,1],[12,2]]},{"formul":"Sonuç: I ve II kesin çift, III belirsiz → kesinlikle çift olanlar = I ve II","anlatim":"I ve II her durumda çift çıkıyor ama III b\u0027ye bağlı olduğu için kesin değil. Doğru cevap kesinlikle çift olanlar I ve II\u0027dir.","doldur":[]},{"formul":"Yanlış yol: I, II ve III hepsi çift (HATALI) → doğrusu yalnız I ve II (8. adımda bulduk)","anlatim":"Yanlış yol III\u0027ü de kesin çift saymaktır çünkü b\u0027nin türü unutulur. Doğrusu b belirsiz olduğundan III kesin değildir.","doldur":[]}],"anahtar":[{"ornek":"belirsiz","kok":"belirs"},{"ornek":"olduğuna","kok":"olduğu"},{"ornek":"çıkması","kok":"çıkmas"},{"ornek":"toplamda","kok":"toplam"},{"ornek":"olmalı","kok":"olmalı"},{"ornek":"çifttir","kok":"çiftti"}],"konuGiris":{"harita":"Hangi terimlerin türü kesin belirlenir: verilen toplam/çarpımların tek-çift olma şartından çıkarılır. Nasıl ölçülür: her bilinmeyenin tek mi çift mi olduğu adım adım kurallarla belirlenir. Nasıl kaydedilir: şıklardaki ifadeler bulunan tek-çift değerlerle yeniden sınıflandırılır.","desen":"Soru, verilen toplam ve çarpım ifadelerinden bilinmeyenlerin tek mi çift mi olduğunu adım adım çıkarmayı gerektirir. Tuzak, bazı bilinmeyenlerin kesin belirlenirken bazılarının belirsiz kalmasıdır; öğrenci hepsini kesin sanabilir. Bu soru tek-çift kurallarının zincirleme uygulanması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"2\u0027ye tam bölünen tam sayı, 2k biçiminde yazılır","ad":"çift sayı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"2k+1 biçiminde yazılan, 2\u0027ye bölünmeyen tam sayı","ad":"tek sayı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"tek+tek çift, çift+çift çift, tek+çift tek verir","ad":"toplama kuralı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"tek·tek tek verir, çift ile çarpım her zaman çift verir","ad":"çarpma kuralı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"a, b, c, d pozitif tam sayılar için üç koşul verilir ve üç ifadeden hangisinin kesinlikle çift olduğu istenir.","panel_ornek":"Bir markette 3 kutu bisküvi ve birkaç tane de tekli çikolata alıyorsun; toplam ürün sayısının tek mi çift mi olduğunu kutudaki sabit sayıdan çıkarabilirsin. Kutu sayısı sabit kalırken çikolata sayısı değiştikçe toplamın türü de değişebilir. Yani bazı parçalar sonucu kesinleştirir, bazıları belirsiz bırakır.","ornek":"Bir markette 3 kutu bisküvi ve birkaç tane de tekli çikolata alıyorsun; toplam ürün sayısının tek mi çift mi olduğunu kutudaki sabit sayıdan çıkarabilirsin. Kutu sayısı sabit kalırken çikolata sayısı değiştikçe toplamın türü de değişebilir. Yani bazı parçalar sonucu kesinleştirir, bazıları belirsiz bırakır.","yontemler":"Her koşuldan bilinmeyenlerin tek mi çift mi olduğu sırayla çıkarılır, belirsiz kalan değişken şıklarda elenir.","nedir":"Tek-çift sayı kuralları, sayıların toplama-çarpma işlemlerinde tek mi çift mi olduğunu bulmayı sağlar. Sınav, verilen ifadelerden yola çıkarak bilinmeyenin türünü çıkarma becerisini ölçer."},"olay":"a+2b tek → 2b çift olduğundan a tek; a·c tek ve a tek olduğundan c de tek; 3c+d çift, 3c(tek·tek) tek olduğundan d tek. I=a+c=tek+tek=çift(kesin), II=c+d=tek+tek=çift(kesin), III=a+b+d=çift+b, b belirsiz olduğundan III belirsiz.","tuzak":{"C":{"ad":"Kapsam Genişletme Tuzağı","metin":"verilen üç koşulun dört bilinmeyenin hepsini belirlediğini sanıp b\u0027ye de tek/çift ataması yaparsın; b hakkında hiçbir koşul yoktur. Doğrusu: III\u0027te b belirsiz kaldığından III kesinlikle çift değildir."},"E":{"ad":"Zincir Atlama Tuzağı","metin":"a\u0027nın türünü ilk koşuldan çıkarmadan doğrudan c ve d ile ilgilenip I\u0027i atlarsın, sonra b\u0027yi de tek/çift sabitmiş gibi kabul edip III\u0027ü kesin çift sayarsın. Doğrusu: I de a tek ve c tek olduğundan kesinlikle çift, III ise b belirsiz olduğundan kesin değildir."},"A":{"ad":"Yanlış Çarpım Tuzağı","metin":"3c\u0027yi (c tek olduğu halde) çift sanıp d\u0027yi çift çıkarırsın, böylece II\u0027yi c+d=tek+çift=tek diye elersin. Doğrusu: 3c tek olduğundan tek+d çift olması için d de tek olmalı, II kesinlikle çift."},"B":{"ad":"Toplam Kuralı Tuzağı","metin":"a + 2b tek ifadesinde 2b\u0027nin daima çift olduğunu atlayıp a\u0027yı çift sanırsın, I\u0027i a+c=çift+tek=tek diye elersin. Doğrusu: tek sonuç almak için a kesinlikle tek olmalı, I de kesinlikle çift."}},"celdiriciYol":{"C":"b\u0027nin türü de koşullardan çıkarılabilir sanılıp b tek atanırsa: III=a+b+d=tek+tek+tek=tek yerine hatalı işlemle çift bulunur, II gözden kaçırılır (C seçilir)","E":"a\u0027nın türü çıkarılmadan atlanırsa I belirsiz sayılır; b sabit çift varsayılırsa III=çift+çift+tek=tek yerine hatalı çift bulunur, II ve III seçilir","A":"3c çift kabul edilirse: c tek, 3c=çift, çift+d=çift → d çift, II=c+d=tek+çift=tek (II elenir, I kesin çift, D yerine A seçilir)","B":"2b\u0027nin çift olduğu atlanırsa: a+2b tek → a çift kabul edilir, I=a+c=çift+tek=tek (I elenir, II kesin çift, D yerine B seçilir)"},"hap":"Toplamda tek sonuç almak için ya iki terimden biri tek biri çift olmalı ya da tek sayıda tek terim bulunmalı; çarpımda tek sonuç yalnız her iki çarpanın da tek olmasıyla mümkündür.","teshis":{"C":{"gercek":"b hiçbir koşulda tek başına ya da başka terimle geçmemektedir; b\u0027nin türü koşullardan çıkarılamaz, dolayısıyla b\u0027ye bağlı ifadeler kesin değildir.","ayirt":"Bu bilinmeyen gerçekten verilen koşullardan biri içinde geçiyor mu?","paragraf":"Belirsizlik ilkesi - veride yer almayan değişken sabitlenemez","yanilgi":"Sorudaki üç koşulun dört bilinmeyenin (a,b,c,d) hepsinin türünü belirlediğini sanıyorsun."},"E":{"gercek":"a+2b tek koşulu tek başına a\u0027nın kesin tek olduğunu verir; b ise hiçbir koşulda geçmediği için türü belirlenemez.","ayirt":"Verilen ilk koşulu, üçüncü koşula geçmeden önce işledim mi?","paragraf":"Toplama kuralı - tek+çift=tek","yanilgi":"a\u0027nın türünü ilk koşuldan çıkarmayı atlayıp doğrudan c ve d\u0027ye odaklanıyor, sonra b\u0027yi de sabit bir türe sahipmiş gibi varsayıyorsun."},"A":{"gercek":"Tek × tek = tek kuralı gereği c tek ise 3c de tektir; 3c+d çift olması için d\u0027nin de tek olması gerekir.","ayirt":"3c\u0027yi hesaplarken c\u0027nin türünü mü, yoksa 3\u0027ün çift olmadığını mı unuttum?","paragraf":"Çarpma kuralı - tek×tek=tek","yanilgi":"3c gibi tek sayının üç katının çift olacağını sanıyorsun."},"D":{"gercek":"Toplama-çıkarma ve çarpma kurallarının sırayla uygulanmasıyla a, c, d\u0027nin türü kesin olarak zincirlenir; b\u0027nin koşullarda hiç geçmemesi yalnız III\u0027ü belirsiz bırakır.","ayirt":"Her adımda bir önceki sonucu doğru kullanarak bir sonraki bilinmeyenin türünü mü çıkardım?","paragraf":"Tek-çift zincir kuralı - toplama/çarpma birlikte uygulama","yanilgi":"Bu şıkkı eleyen öğrenci, zincirin ilk adımında (a+2b tek) 2b\u0027nin çift olduğunu atlayarak a\u0027nın türünü yanlış bulur ve zincir devam ettirilemez sanır."},"B":{"gercek":"2b her zaman çifttir (çift×herhangi=çift); a+2b tek olması için a kesinlikle tek olmalıdır.","ayirt":"2b terimi zaten çift mi, onu neye göre belirledim?","paragraf":"Çarpma kuralı - çift×herhangi=çift","yanilgi":"2b gibi bir çarpımın her zaman sonucu belirlediğini, toplamdaki diğer terimin türünü etkilemeyeceğini sanıyorsun ama tam tersi 2b\u0027nin türünü (çift) unutup a\u0027yı yanlış çıkarıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 8"},"kural":"2b her zaman çifttir; tek+çift=tek olduğundan a+2b tek ise a tek olur. a·c tek ise a ve c\u0027nin ikisi de tek olur. b-c çift ise b ile c aynı türdendir, c tek olduğundan b da tek olur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 8","sonDonem":2,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce her harfin türünü (tek/çift) tek tek koşullardan belirle, sonra roman numaralı ifadeleri o türlerle hesapla.","konu":"tamsayi çift sayı","tablo":{"satirlar":[["VERİLENLER","-","-"],["a+2b\u0027nin türü","tek","-"],["a·c\u0027nin türü","tek","-"],["b-c\u0027nin türü","çift","-"],["HESAP","-","-"],["A + 2b tek → a\u0027nın türü","2b her zaman çift, tek+çift=tek → a tek olmalı","A: tek"],["A·c tek → a ve c\u0027nin türü","Tek·tek=tek, biri çift olsaydı çarpım çift olurdu → c tek olmalı","C: tek"],["B − c çift → b\u0027nin türü","Fark çift ise iki sayı aynı türden, c tek → b tek olmalı","B: tek"],["I. a + b","Tek+tek=çift","Çift"],["II. b + c","Tek+tek=çift","Çift"],["III. a + b + c","Tek+tek+tek=tek","Tek (SONUÇ: kesinlikle çift olanlar I ve II)"]],"basliklar":["Adım","Kural","Sonuç"]},"siklar":{"C":"I ve II","E":"II ve III","A":"Yalnız I","D":"I ve III","B":"Yalnız III"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":{"siklar":{"D":"Üç tek sayının toplamının da çift olacağı sanılır. Oysa tek sayıda tek terimin toplamı tektir; a+b+c=tek+tek+tek=tek olduğundan III kesinlikle çift değildir.","E":"a+2b\u0027de 2b\u0027nin türünden bağımsız sanılıp a çift kabul edilir. Hâlbuki 2b her zaman çift olduğundan a kesinlikle tek olmalıdır.","A":"Yalnız I seçilirse, b − c ilişkisinden b\u0027nin türü göz ardı edilir ve II hesaplanmaz. Oysa c tek olduğundan b de tek, b+c kesinlikle çifttir.","B":"Aynı Tür Kuralını ters uygulayıp b − c çift\u0027ten b\u0027nin çift olduğu sanılır. Doğrusu: b ile c aynı türde olmalı, c tek olduğundan b da tektir."},"dogru":"2b her zaman çifttir, dolayısıyla a + 2b\u0027nin tek olması için a tek olmalıdır. a·c tek ise a ve c ikisi de tek; b − c çift ise b ile c aynı türde, yani b de tektir. Sonuç: a tek, b tek, c tek → a+b çift, b+c çift, a+b+c tek olduğundan I ve II kesinlikle çifttir.","sinav":"Verilen koşullardan a, b, c\u0027nin tek mi çift mi olduğu belirlenerek I, II, III ifadelerinin kesinlikle çift olup olmadığı soruluyor.","kavramlar":[{"kaynak":"TEORI","tanim":"2\u0027ye tam bölünen tam sayıdır; 2k biçiminde yazılır (örneğin −4, 0, 2, 4).","ad":"Çift sayı"},{"kaynak":"TEORI","tanim":"2k + 1 biçiminde yazılan tam sayıdır (örneğin −3, −1, 1, 3).","ad":"Tek sayı"},{"kaynak":"TEORI","tanim":"Çift ± çift = çift; tek ± tek = çift; çift ± tek = tek; bir toplamın tek olması için tek sayıda tek terim gerekir.","ad":"Toplama-çıkarma kuralları"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2],[5,1],[5,2]],"tablo":{"basliklar":["Adım","Kural","Sonuç"],"satirlar":[["P + 4r tek → p\u0027nin türü","4r her zaman çift, tek+çift=tek → p tek olmalı","P: tek"],["P·q tek → p ve q\u0027nün türü","Tek·te
