n ağır sonucu doğurduğunu düşünüp tekerrür ve mahkeme kararı şartlarını atlarsın."},"B":{"gercek":"Aynı maddenin ilk fıkrasına göre bağımsızlık, tarafsızlık ve dürüstlükle görev yapmama hâlinde geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır.","ayirt":"Bu fiil için madde metninde hangi ceza türü ayrıca adıyla sayılmış?","paragraf":"m.48/1","yanilgi":"Genel prensiplere aykırılığı mesleğin en ağır ihlali sayıp doğrudan meslekten çıkarmayla eşleştirirsin."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 105"},"kural":"Madde 2/B\u0027ye göre yeminli mali müşavirlik, (A) fıkrasının (b) ve (c) bentlerindeki işlerle birlikte tasdik işlerini kapsar; Madde 3\u0027e göre yetkisiz unvan kullanımı yasaktır ve odalar bunu öğrendiğinde Cumhuriyet Savcılığına bildirmek zorundadır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 105","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Roman numaralı kombinasyon sorularında önce hangi bendin hangi meslek grubuna ait olduğunu ayır, sonra ters çevrilmiş cümleleri tek tek ele.","konu":"yeminli mali müşavirlik sinavi","tablo":{"satirlar":[["A) I ve II","m.2/B","doğru ifade"],["B) I ve III","m.2/B","YANLIŞ ifade"],["C) II ve IV","m.3","doğru ifade"],["D) III ve V","m.2/A","YANLIŞ ifade"],["E) IV ve V","m.2/B","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"II ve IV","E":"IV ve V","A":"I ve II","D":"III ve V","B":"I ve III"},"kaynak":{"alinti":"de yeminli mali müşavirliğin (A) fıkrasının (b) ve (c) bentleriyle tasdik işlerini kapsaması ve Madde 3","liste":[{"ad":"SMMM K. (3568 s.K.) m.3","metin":"Madde 3 – Kanunen kullanmaya yetkisi olmayanlar tarafından (…)3 , serbest muhasebeci mali müşavir, yeminli mali müşavir unvanlarının veya bu unvan veya kavramlara karışacak veya onlara benzer her türlü unvan, ibare veya remizlerin kullanılması yasaktır. Odalar, yukarıdaki fıkraya aykırı davranışları öğrendiklerinde Cumhuriyet Savcılığına bildirmek mecburiyetindedirler. Cumhuriyet Savcılığınca tahkikatın sonucu, odaya ve ilgililere bildirilir. Genel şartlar"},{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"}],"hakem":"Doğru sık I ve III, Madde 2/B\u0027de yeminli mali müşavirliğin (A) fıkrasının (b) ve (c) bentleriyle tasdik işlerini kapsaması ve Madde 3\u0027de yetkisiz unvan kullanım yasağı ile odaların Cumhuriyet Savcılığına bildirme yükümlülüğü açıkça yer almaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre; I. Yeminli mali müşavirlik mesleğinin konusu, (A) fıkrasının (b) ve (c) bentlerindeki işlerin yanında tasdik işlerini yapmaktır. II. Yeminli mali müşavirler muhasebe ile ilgili defter tutabilir, ancak muhasebe bürosu açamaz. III. Yetkisi olmayanlarca meslek unvanına benzer unvan kullanılması yasaktır; odalar bunu öğrenince Cumhuriyet Savcılığına bildirmek zorundadır. IV. Serbest muhasebeci mali müşavirlik mesleğinin konusu yalnızca defter tutmak ve beyanname düzenlemekten ibarettir, müşavirlik ve inceleme işlerini kapsamaz. V. Yeminli mali müşavirler, (A) fıkrasının (a) bendindeki defter tutma işini de yaparak buna tasdik işlerini ekleyebilir. Yukarıdakilerden hangileri doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-14","verilenler":[],"dayanak":"3568 s. SMMM ve YMM Kanunu m.2/A-B, m.3","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da Merve YMM, 14 Mart günü bir şirketin tam tasdik raporunu hazırlıyor, aynı zamanda köşedeki başka bir işletme için de defter tutmayı teklif ediyor.","anlatim":"Merve tasdik yapabilir ama defter tutamaz, madde bunu açıkça yasaklar. Aynı sokakta Kemal adında biri de \u0027Yeminli Mali Müşavir Kemal\u0027 tabelası asmış ama ruhsatı yok, oda bunu duyunca ne yapmalı sorusu da gündemde.","doldur":[]},{"formul":"Ne yapacağız: (A) fıkrasının b-c bentleri + tasdik = YMM işi, (a) bendi defter tutma YMM\u0027ye yasak; unvan gaspı yasak ve odaya bildirim zorunlu. Beş ifadeyi Merve ile Kemal\u0027in olayında tek tek deneyeceğiz.","anlatim":"Kural tek: YMM\u0027nin konusu b-c bendi ile tasdiktir, defter tutamaz. Unvanı kullanmaya yetkisi olmayan biri kullanırsa oda savcılığa bildirir.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.2/B","karar":"doğru","anlatim":"Evet, madde 2/B tam olarak bunu söylüyor, b ve c bentleri artı tasdik işi. Bu ifade metinle birebir örtüşür.","formul":"Şık A: Merve\u0027nin işinin tanımı \u0027b, c bentleri ve tasdik\u0027 diye mi yazılmalı, doğru mu bu tanım?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.2/B","karar":"yanlış","anlatim":"Hayır, madde üç şeyi birden yasaklar: defter tutma, büro açma, büroya ortak olma. Merve defter tutarsa kanuna aykırı davranır.","formul":"Şık B: Merve muhasebe ile ilgili defter tutabilir mi, sadece büro açması mı yasak?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.3","karar":"doğru","anlatim":"Evet, madde 3 yetkisiz unvan kullanımını yasaklar ve odaya bildirim mecburiyeti getirir. Kemal\u0027in durumu tam bu maddeye girer.","formul":"Şık C: Kemal\u0027in tabelası yasak mı, oda öğrenince savcılığa bildirmek zorunda mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.2/A","karar":"yanlış","anlatim":"Hayır, madde 2/A üç bent sayar: kayıt, müşavirlik, inceleme-tahlil-denetim. Sadece a bendine sıkıştırmak eksik ve yanlış bir tanım.","formul":"Şık D: SMMM\u0027nin işi sadece defter tutmak ve beyanname düzenlemekten ibaret mi, müşavirlik ve inceleme dışarıda mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.2/B","karar":"yanlış","anlatim":"Hayır, (a) bendi açıkça SMMM\u0027ye ait, YMM için defter tutma yasaktır. Bu ifade madde 2/B\u0027nin yasak fıkrasına ters düşer.","formul":"Şık E: Merve tasdik yaptığı gibi (a) bendindeki defter tutma işini de ekleyebilir mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✓ D ✗ E ✗","anlatim":"Merve tasdik yapar ama defter tutamaz, Kemal\u0027in durumu savcılığa gider; ikisi doğru, üçü yanlış. Kendine sor: bu ifade (a) bendini mi (b-c) bendini mi anlatıyor?","doldur":[]}],"anahtar":[{"ornek":"defter","kok":"defter"},{"ornek":"tasdik","kok":"tasdik"},{"ornek":"müşavirlik","kok":"müşavi"},{"ornek":"bendindeki","kok":"bendin"},{"ornek":"kullanımı","kok":"kullan"},{"ornek":"bentleriyle","kok":"bentle"}],"konuGiris":{"harita":"Ne zaman test edilir: iki meslek unvanının yetki alanları karşılaştırılırken test edilir. Nasıl ölçülür: her unvanın hangi bentteki işleri kapsadığı tek tek eşleştirilerek ölçülür. Nasıl kaydedilir: doğru-yanlış önermeler halinde, çoktan seçmeli önermelerin doğruluğu işaretlenerek kaydedilir.","desen":"Sınav, yeminli mali müşavirin defter tutabilir mi tutamaz mı olduğunu karıştırarak tuzak kurar; kaynak metinde açıkça \u0027defter tutamazlar\u0027 denir. Ayrıca serbest muhasebeci mali müşavirin sadece defter tutmakla sınırlı olmadığı, müşavirlik ve inceleme işlerini de kapsadığı unutulur. Bu soru madde 2 ve madde 3 hükümlerinin birlikte değerlendirilmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"defter tutma, mali müşavirlik ve inceleme işlerini yapan meslek mensubu","ad":"Serbest muhasebeci mali müşavir","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"müşavirlik, inceleme ve tasdik işlerini yapan ama defter tutamayan mensup","ad":"Yeminli mali müşavir","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"yeminli mali müşavire özgü, yönetmelikle belirlenen onay işlemi","ad":"Tasdik işi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"yetkisiz unvan kullanımının odalarca savcılığa bildirilme zorunluluğu","ad":"Unvan yasağı bildirimi","kim":"kanun sabitler"}],"sinavda":"Beş önermeden hangilerinin kanuna uygun olduğu sorulur, işlem veya hesaplama istenmez.","panel_ornek":"Bir tamirci sadece motor tamiri yapabilir ama karoseri boyama yetkisi yoktur; ustabaşı hem tamiri hem boyamayı yapıp üstüne kalite raporu da imzalayabilir. Ustabaşı isterse tamirci gibi basit işleri de yapar ama kendi dükkanını \u0027tamirci dükkanı\u0027 diye açamaz. Yetkisiz biri tabelaya \u0027ustabaşı\u0027 yazarsa esnaf odası bunu savcılığa bildirmek zorundadır.","ornek":"Bir tamirci sadece motor tamiri yapabilir ama karoseri boyama yetkisi yoktur; ustabaşı hem tamiri hem boyamayı yapıp üstüne kalite raporu da imzalayabilir. Ustabaşı isterse tamirci gibi basit işleri de yapar ama kendi dükkanını \u0027tamirci dükkanı\u0027 diye açamaz. Yetkisiz biri tabelaya \u0027ustabaşı\u0027 yazarsa esnaf odası bunu savcılığa bildirmek zorundadır.","yontemler":"Her önermeyi ilgili bent ile tek tek eşleştirip \u0027defter tutar mı, tutamaz mı\u0027 ayrımına odaklanmak en kritik kuraldır.","nedir":"Bu konu, meslek mensuplarının hangi işi yapmaya yetkili olduğunu ve unvan kullanımının sınırlarını düzenler. Sınav, yeminli mali müşavir ile serbest muhasebeci mali müşavirin görev alanlarını karıştırıp karıştırmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Kapsam Daraltma Tuzağı","metin":"IV ifadesi serbest muhasebeci mali müşavirliğin konusunu yalnızca defter tutma ve beyannameyle sınırlar; oysa Madde 2/A müşavirlik ile inceleme-tasdik işlerini de kapsar. Doğrusu: II ve IV birlikte yanlıştır."},"E":{"ad":"İki Yanlışı Birleştirme Tuzağı","metin":"Hem kapsam daraltma (IV) hem bent karıştırma (V) hataları bir arada seçilmiştir. Doğrusu: her iki ifade de yanlıştır, doğru kombinasyon I ve III\u0027tür."},"D":{"ad":"Bent Karıştırma Tuzağı","metin":"V ifadesi yeminli mali müşavirlerin (A) fıkrasının (a) bendindeki defter tutma işini de yapabileceğini öne sürer; oysa Madde 2/B bunu açıkça engeller, YMM yalnız (b), (c) bentleri ve tasdik işini yapar. Doğrusu: III doğru olsa da V yanlıştır, bu eşleşme geçersizdir."},"A":{"ad":"Ters Çevirme Tuzağı","metin":"Kanun, yeminli mali müşavirlerin muhasebe ile ilgili defter TUTAMAYACAĞINI söyler; II ifadesi bunu tersine çevirerek defter tutabileceğini iddia eder. Doğrusu: II yanlıştır, doğru eşleşme I ve III\u0027tür."}},"celdiriciYol":{},"hap":"Yeminli mali müşavirlik, (A) fıkrasının yalnız (b) ve (c) bentleriyle tasdik işini kapsar; (a) bendindeki defter tutma YMM\u0027ye yasaktır.","teshis":{"C":{"gercek":"Madde 2/A üç bent halinde defter tutma, müşavirlik ve inceleme-tahlil-denetim işlerinin tümünü SMMM\u0027nin konusu sayar.","ayirt":"Madde 2/A kaç bentten oluşuyor, IV ifadesi bunların hepsini mi kapsıyor?","paragraf":"3568 s.K. m.2/A","yanilgi":"SMMM\u0027nin görev alanını dar yorumlayıp yalnızca kayıt işlerinden ibaret sanıyorsun, müşavirlik ve inceleme-tasdik bentlerini gözden kaçırıyorsun."},"E":{"gercek":"IV, SMMM\u0027nin kapsamını daraltarak yanlış; V ise YMM\u0027ye yasak olan (a) bendini ona tanıyarak yanlıştır; ikisi ayrı maddelerin ayrı ihlalidir.","ayirt":"Bu iki ifadenin hangi maddeye, hangi tarafa (SMMM mi YMM mi) ait olduğunu ayrı ayrı kontrol ettim mi?","paragraf":"3568 s.K. m.2/A, m.2/B","yanilgi":"İki farklı yanlış cümleyi birbirine benzer gördüğün için ikisini de doğru sanıp aynı şıkta birleştiriyorsun."},"A":{"gercek":"Madde 2/B, yeminli mali müşavirlerin muhasebe ile ilgili defter tutamayacağını, muhasebe bürosu açamayacağını ve bu bürolara ortak olamayacağını üç ayrı yasak olarak sayar.","ayirt":"Madde metninde \u0027tutamazlar\u0027 mı \u0027tutabilirler\u0027 mi yazıyor, cümleyi ters mi çevirmişim?","paragraf":"3568 s.K. m.2/B","yanilgi":"Defter tutma yasağının yalnızca büro açmayla ilgili olduğunu, YMM\u0027nin bireysel defter tutabileceğini sanıyorsun."},"D":{"gercek":"Madde 2/B, YMM\u0027nin konusunu (b) ve (c) bentleriyle tasdik işine sınırlar; (a) bendindeki defter tutma açıkça YMM\u0027ye yasaktır.","ayirt":"V ifadesindeki \u0027defter tutma işini de yapabilir\u0027 cümlesi hangi bende dayanıyor, o bent YMM\u0027ye mi ait?","paragraf":"3568 s.K. m.2/B","yanilgi":"Tasdik yetkisi olan YMM\u0027nin defter tutma işini de otomatik olarak yapabileceğini, bentlerin birbirini kapsadığını sanıyorsun."},"B":{"gercek":"Madde 2/B, yeminli mali müşavirliğin konusunu yalnızca (b) ve (c) bentleri ile tasdik işi olarak sınırlar; Madde 3 ise yetkisiz unvan kullanımını yasaklayıp bildirim zorunluluğu getirir.","ayirt":"Hangi bentler sayılmış, (a) bendi bu listede var mı?","paragraf":"3568 s.K. m.2/B, m.3","yanilgi":"Tasdik yetkisinin (A) fıkrasının tüm bentlerini (a,b,c) kapsadığını, dolayısıyla defter tutmayı da içerdiğini düşünüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 85"},"kural":"3568 sayılı Kanunun 4 üncü maddesinin d bendi yalnız KASTEN işlenen suçları engel sayar; taksirle işlenen suçlar cezanın süresi ne olursa olsun kapsam dışıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 85","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"d bendini okurken iki eksende ilerle: önce suç kasten mi taksirle mi işlenmiş, sonra sayılan özel suçlardan mı yoksa genel bir-yıl kuralına mı tabi.","konu":"smmm olma sartlari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Madde numarası","4","-"],["HESAP","-","-"],["A) Trafik kazasında taksirle ölüme sebebiyet suçundan üç yı…","p.4(d)","YANLIŞ ifade"],["B) Kasten yaralama suçundan bir yıl altı ay hapis cezasına …","p.4(d)","YANLIŞ ifade"],["C) Dolandırıcılık suçundan dört ay hapis cezasına mahkum ol…","p.4(d)","YANLIŞ ifade"],["D) Kasten işlenen bir suçtan bir yıl hapis cezası almış, Tü…","p.4(d)","YANLIŞ ifade"],["E) Disiplin soruşturması sonucunda kamu görevinden çıkarılm…","p.4(e)","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Dolandırıcılık suçundan dört ay hapis cezasına mahkum olan ve cezası adli para cezasına çevrilmemiş aday.","E":"Disiplin soruşturması sonucunda kamu görevinden çıkarılmış aday.","A":"Trafik kazasında taksirle ölüme sebebiyet suçundan üç yıl hapis cezasına mahkum olan aday.","D":"Kasten işlenen bir suçtan bir yıl hapis cezası almış, Türk Ceza Kanununun 53 üncü maddesindeki süreleri dolmuş aday.","B":"Kasten yaralama suçundan bir yıl altı ay hapis cezasına mahkum olan ve cezası infaz edilmiş aday."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"},{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"}],"hakem":"3568 sayılı Kanun m.4/d\u0027de kasten işlenen suçlar engel sayılırken, taksirle işlenen suçlar açıkça kapsam dışıdır; trafik kazasında taksirle ölüme sebebiyet suçu genel şartlara engel teşkil etmez."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Aşağıdaki adaylardan hangisi, 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununun 4 üncü maddesindeki genel şartlar bakımından serbest muhasebeci mali müşavir olabilir?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-17","verilenler":[{"deger":"4","anlam":"Serbest muhasebeci mali müşavir olabilme koşullarının yazılı olduğu kanun maddesi.","ad":"Madde numarası"}],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.4/d, m.4/e","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir sanayi sitesinde forklift operatörü Kemal, 2019 yılında dikkatsizlik sonucu bir işçinin ölümüne sebep oluyor; mahkeme taksirle ölüme sebebiyet suçundan üç yıl hapis cezası veriyor. Kemal cezasını çekiyor ve sonra SMMM sınavlarını kazanıp staja başvuruyor.","anlatim":"Oda, Kemal\u0027in dosyasını inceliyor ve üç yıl hapis görmüş olması gözünü korkutuyor. Beş farklı adayın dosyası aynı anda masada; hepsinde ayrı bir suç türü var. Şimdi bu beş dosyayı tek tek açacağız.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun madde 4/d yalnız KASTEN işlenen suçları engel sayıyor; taksirle işlenen suçlar süresi ne olursa olsun bu bendin dışında kalıyor. Kasten işlenen suçlarda ise genel eşik bir yıl veya daha fazla hapis, ayrıca zimmet-rüşvet-dolandırıcılık gibi sayılan suçlarda süre şartı aranmıyor. Şimdi beş adayı bu kuralla tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"p.4(d)","karar":"yanlış","anlatim":"Madde 4/d yalnız kasten işlenen suçları kapsıyor, taksirle işlenen suçlar bu bendin dışında kalıyor. Kemal\u0027in cezası üç yıl olsa da suç taksirle işlendiği için engel doğmuyor, Kemal genel şartları taşıyor.","formul":"Şık A: Kemal\u0027in suçu taksirle işlenmiş, üç yıl hapis almış; oda \u0027engel var\u0027 diyerek dosyayı reddedecek mi?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"p.4(d)","karar":"yanlış","anlatim":"Sayılmayan kasti suçlarda eşik bir yıl veya daha fazla hapistir, bir yıl altı ay bu eşiği aşıyor. Ayşe\u0027nin cezası infaz edilmiş olsa bile TCK 53 süreleri geçse dahi engel devam ediyor, oda dosyayı reddediyor.","formul":"Şık B: Ayşe kasten yaralama suçundan bir yıl altı ay hapis cezası almış ve cezasını çekmiş; bu süre eşiği aşıyor mu, oda onu kabul eder mi?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"p.4(d)","karar":"yanlış","anlatim":"Madde 4/d dolandırıcılığı ayrıca sayılan özel suçlar arasına koyuyor, bu suçlarda süre şartı aranmıyor. Dört ay bile olsa mahkumiyetin varlığı yeterli, Mehmet\u0027in dosyası reddediliyor.","formul":"Şık C: Mehmet dolandırıcılık suçundan dört ay hapis almış, adli para cezasına çevrilmemiş; ceza kısa diye oda göz mü yumar?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"p.4(d)","karar":"yanlış","anlatim":"Madde açıkça \u0027süreler geçmiş olsa bile\u0027 diyor, yani infaz süresinin dolması engeli kaldırmıyor. Zeynep bir yıl eşiğini tam doldurduğu için dosyası reddediliyor.","formul":"Şık D: Zeynep kasten işlenen bir suçtan bir yıl hapis almış, TCK 53\u0027teki süreler dolmuş; süreler geçtiği için oda kabul mü eder?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"p.4(e)","karar":"yanlış","anlatim":"Madde 4/e, ceza değil disiplin soruşturmasıyla memuriyetten çıkarılmayı da ayrı bir engel sayıyor. Hakan\u0027ın dosyası bu yüzden reddediliyor, ceza mahkumiyeti aranmıyor.","formul":"Şık E: Hakan bir disiplin soruşturması sonucu kamu görevinden çıkarılmış; bu ceza mahkumiyeti olmadığı için oda görmezden mi gelir?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Sadece taksirle işlenen suç engel oluşturmuyor, geri kalan dört dosyanın hepsinde bir engel var. Kendine hep şunu sor: bu suç kasten mi işlenmiş, yoksa taksirle mi?","doldur":[]}],"anahtar":[{"ornek":"suçlar","kok":"suçlar"},{"ornek":"işlenen","kok":"işlene"},{"ornek":"taksirle","kok":"taksir"},{"ornek":"dosyasını","kok":"dosyas"},{"ornek":"kasten","kok":"kasten"},{"ornek":"reddediyor","kok":"redded"}],"konuGiris":{"harita":"Ne zaman test edilir: adayın mesleğe kabul aşamasında şartları taşıyıp taşımadığı sorulduğunda. Nasıl ölçülür: verilen aday profilinin m.4\u0027teki altı şarttan hangisine aykırı olduğu tespit edilerek. Nasıl kaydedilir: şartları sağlayan aday \u0027olabilir\u0027, sağlamayan aday \u0027olamaz\u0027 şeklinde sonuçlandırılır.","desen":"Soru genelde adaylar arasından hangisinin altı şartın tümünü sağladığını buldurur; tuzak, adayın sadece bir suçtan değil hafif bir suçtan hüküm giymiş gibi gösterilmesidir. Diğer şıklarda memuriyetten çıkarılma, kamu haklarından mahrumiyet gibi engeller gizlenir. Bu soru m.4 genel şartlar listesinden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Adayın Türk vatandaşı olması zorunluluğu","ad":"T.C. vatandaşlığı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Adayın kamu haklarını kullanma yetkisinin kısıtlanmamış olması","ad":"Kamu haklarından mahrumiyet","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Belirli ağır suçlardan bir yıl ve üzeri hapis cezası almamış olma şartı","ad":"Kasten işlenen suçtan mahkumiyet","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Mesleğin itibarına aykırı davranışının bulunmaması","ad":"Meslek şeref ve haysiyeti","kim":"meslek kuruluşu düzenler"}],"sinavda":"Şıklarda farklı aday profilleri verilir, hangisinin genel şartları tam sağladığı sorulur.","panel_ornek":"Bir arkadaşın kiralık eve başvururken ev sahibi düzenli maaş, temiz sicil ve kefil gibi genel şartlar arar; bunlardan biri eksikse ev tutulmaz. SMMM adayında da kanundaki genel şartlardan biri eksikse meslek mensubu olunamaz.","ornek":"Bir arkadaşın kiralık eve başvururken ev sahibi düzenli maaş, temiz sicil ve kefil gibi genel şartlar arar; bunlardan biri eksikse ev tutulmaz. SMMM adayında da kanundaki genel şartlardan biri eksikse meslek mensubu olunamaz.","yontemler":"Her şık m.4\u0027teki altı bentle tek tek karşılaştırılır; tek bir şarta aykırılık adayı elemek için yeterlidir.","nedir":"SMMM olabilmek için adayın taşıması gereken genel şartlar kanunda sayılır. Sınav bu şartlardan hangisinin adayı diskalifiye ettiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Süre Şartı Yanılgısı","metin":"dolandırıcılık maddede ayrıca sayılan özel suçlardandır, bu grupta \u00271 yıl\u0027 eşiği aranmaz; dört ay gibi kısa bir ceza dahi mahkumiyet varsa engeldir. Doğrusu: dolandırıcılıktan mahkumiyet, ceza süresi ne olursa olsun genel şartı ortadan kaldırır."},"E":{"ad":"Bent Karıştırma Tuzağı","metin":"bu durum ceza mahkumiyetiyle ilgili d bendi değil, ayrı bir engel olan e bendi kapsamındadır; ceza soruşturması aranmaksızın disiplin yoluyla memuriyetten çıkarılma tek başına engeldir. Doğrusu: disiplin soruşturması sonucu memuriyetten çıkarılma, genel şartların taşınmadığı anlamına gelir."},"D":{"ad":"TCK 53 Aklanma Yanılgısı","metin":"madde açıkça \u0027Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile\u0027 demektedir, yani infaz sürelerinin dolması engeli kaldırmaz. Doğrusu: kasten işlenen suçtan bir yıl ve üzeri hapis cezası, süreler geçse dahi genel şart eksikliği doğurur."},"B":{"ad":"Kast-Süre Karıştırma Tuzağı","metin":"bu suç sayılan özel suçlardan olmadığı için sadece \u00271 yıl ve üzeri hapis\u0027 ölçütüne bakılır; adayın cezası tam bu eşiği aştığından engel devam eder, süre kısa sanılıp geçiştirilemez. Doğrusu: bir yıl altı ay kasten işlenmiş suç cezası, d bendindeki genel eşiği aşar ve engel oluşturur."}},"celdiriciYol":{"C":"Ceza süresi bir yıldan kısa olduğu için genel eşik uygulanır sanılır, oysa sayılan özel suçta süre aranmaz (süre şartı yanılgısı).","E":"Durum ceza mahkumiyeti bendine (d) dahil edilmeye çalışılır, oysa bağımsız bir bent olan (e) uygulanmalıdır (bent karıştırma).","D":"TCK 53 sürelerinin dolmasıyla engelin kalktığı varsayılır, oysa madde bu süreleri açıkça devre dışı bırakır (aklanma yanılgısı).","B":"Suç kasten işlenmiş ancak sayılan özel suçlar listesinde aranmadığı için süre sınırı yokmuş gibi değerlendirilir (kast-süre karıştırma)."},"hap":"3568 sayılı Kanun m.4/d\u0027de taksirle işlenen suçlar hiçbir zaman engel değildir; kasten işlenen suçlarda ise ya bir yıl ve üzeri hapis cezası ya da sayılan özel suçlardan (süre aranmaksızın) mahkumiyet, TCK 53 süreleri dolsa bile engel oluşturur.","teshis":{"C":{"gercek":"Madde d bendinde zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık gibi suçları ayrıca sayar; bu suçlarda süre şartı aranmaz, mahkumiyetin varlığı yeter.","ayirt":"Bu suç maddede tek tek sayılan özel suçlardan mı?","paragraf":"3568 s.K. m.4/d","yanilgi":"Ceza kısa olduğu için (dört ay) engel oluşmayacağını sanıyorsun; süre eşiğini her suça uyguluyorsun."},"E":{"gercek":"Madde 4/e, ceza veya disiplin soruşturması sonucu memuriyetten çıkarılmayı ayrı ve bağımsız bir engel olarak düzenler.","ayirt":"Bu durum ceza mahkumiyeti mi yoksa disiplinle memuriyetten çıkarılma mı, hangi bent uygulanır?","paragraf":"3568 s.K. m.4/e","yanilgi":"Genel şartların yalnız ceza mahkumiyetiyle ilgili olduğunu, disiplinin ayrı bir konu olmadığını sanıyorsun."},"A":{"gercek":"3568 sayılı Kanun m.4/d yalnız kasten işlenen suçları düzenler; taksirle işlenen suçlar bu bendin kapsamı dışındadır.","ayirt":"Suç kasten mi yoksa taksirle mi işlenmiş, önce buna bakıyor muyum?","paragraf":"3568 s.K. m.4/d","yanilgi":"Hapis cezası gördüyse süresi ne olursa olsun bu kişinin meslek mensubu olamayacağını sanıyorsun."},"D":{"gercek":"Madde açıkça \u0027süreler geçmiş olsa bile\u0027 ibaresiyle bu sürelerin engeli kaldırmayacağını belirtir.","ayirt":"Madde metninde süreler geçse bile ibaresi var mı, kontrol ettim mi?","paragraf":"3568 s.K. m.4/d","yanilgi":"TCK 53\u0027teki infaz sürelerinin dolmasıyla mahkumiyetin etkisinin sona erdiğini düşünüyorsun."},"B":{"gercek":"Sayılmayan kasti suçlarda genel eşik \u0027bir yıl veya daha fazla hapis\u0027tir; bir yıl altı ay bu eşiği aşar ve engel doğurur.","ayirt":"Bu suç sayılan özel suçlardan mı, değilse süresi bir yılı geçiyor mu?","paragraf":"3568 s.K. m.4/d","yanilgi":"Sayılan özel suçlardan olmayan bir kasti suçta süre sınırının önemsiz olduğunu düşünüyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 102"},"kural":"Metne göre Etik İlkeler kişiliği ve gelişimini hedef alan soyut kavramları, Davranış Kuralları ise mesleğin uygulamasına yönelik somut yönlendirmeleri düzenler.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 102","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Ahlak-etik ve meslek etiği-davranış kuralları çiftlerini birbirine karıştıran şıklara dikkat et; hangi kavramın \u0027soyut/kişilik\u0027, hangisinin \u0027somut/uygulama\u0027 olduğunu tanımdan ayır.","konu":"etik ilkeler kişisel çıkar","tablo":{"satirlar":[["A) Etik, kişinin üzerinde düşünmeden kabul ettiği ve uyduğu…","Genelge 19 eki, bölüm I-II","YANLIŞ ifade"],["B) Zorlama ve tehditle gerçekleştirilen bir eylem, derin dü…","Genelge 19 eki, bölüm I-II","YANLIŞ ifade"],["C) Etik ilkeler, kişiliği ve onun gelişimini hedef alan soy…","Genelge 19 eki, bölüm 5","doğru ifade"],["D) Meslek etiği, basiretli bir kişinin iş ve işlemler yapıl…","Genelge 19 eki, bölüm 5","YANLIŞ ifade"],["E) Meslek etiği ilkeleri yalnızca meslek içi rekabeti düzen…","Genelge 19 eki, bölüm 5","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Etik ilkeler, kişiliği ve onun gelişimini hedef alan soyut kavramları belirtirken; davranış kuralları, belirli bir mesleğin uygulamasına yönelik somut yönlendirmeleri içerir.","E":"Meslek etiği ilkeleri yalnızca meslek içi rekabeti düzenlemeyi amaçlar; yetersiz ve ilkesiz üyelerin meslekten dışlanmasıyla bir ilgisi bulunmamaktadır.","A":"Etik, kişinin üzerinde düşünmeden kabul ettiği ve uyduğu kuralları içerirken; ahlak, kişinin özgür iradesiyle derin düşünme sürecinden geçirdikten sonra karar verdiği kuralları içerir.","D":"Meslek etiği, basiretli bir kişinin iş ve işlemler yapılırken karşılaştığı durumlarda nasıl davranması gerektiğini somut biçimde idealize eden ilkeler bütünüdür.","B":"Zorlama ve tehditle gerçekleştirilen bir eylem, derin düşünmeye dayanmasa da ahlaki bir eylem sayılır çünkü sonuç itibarıyla toplumsal düzeni korur."},"kaynak":{"alinti":"bireyin özgürlüğünün bir sonucu","liste":[{"ad":"TSPB Sermaye Piyasasi Calisanlari Etik Ilkeleri ve Davranis Kurallari (Genelge 191) bolum 1","metin":"TSPB TÜRKİYE SERMAYE PİYASALARI BİRLİĞİ Büyükdere Cad. No: 173 1. Levent Plaza A-Blok Kat: 4 34394 1. Levent - İstanbul Tel : (212) 280 85 67 Faks : (212) 280 85 89 www.tspb.org.tr İstanbul, 21 Ekim 2014 2014/1031 GENELGE No: 19 Konu : Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları hk. SAYIN ÜYEMİZ, Sermaye piyasası, mevzuatı, kurumları ve araçlarıyla hızla değişmekte ve gelişmektedir. Değişen ve gittikçe karmaşık hale gelen faaliyet alanımızda, üyelerimiz ve çalışanlarının karşılaştıkları konularda doğru karar alabilmeleri daha da önemli hale gelmiştir. Birliğimiz, sermaye piyasaları ve mesleğimizin güven ve itibar üzerine kurulu olduğu düşüncesiyle, faaliyetlerimizde rehber olması amacıyla “Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları”nı hazırlamış; bu ilke ve kurallar Birlik Yönetim Kurulumuzun 15.10.2014 tarihli toplantısında kabul edilmiştir. “Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları” etik değerlendirme gerektiren durumlarla karşılaşan sermaye piyasası çalışanının, müşterilerine, yöneticilerine, çalışanlarına ve tüm finans piyasasına karşı sorumluluklarının belirlemesinde rehber olmayı hedeflemektedir. Ekte yer alan “Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kurallarının” çalışanlarınıza duyurulması ve düzenlemeye uyumun gözetilmesini bilgilerinize sunarım. Saygılarımla, İlhami KOÇ Başkan Ek: “Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları” TÜRKİYE SERMAYE PİYASALARI BİRLİĞİ SERMAYE PİYASASI ÇALIŞANLARI ETİK İLKELERİ VE DAVRANIŞ KURALLARI 2 I. GİRİŞ Ahlak genel anlamda, belirli…"},{"ad":"TSPB Sermaye Piyasasi Calisanlari Etik Ilkeleri ve Davranis Kurallari (Genelge 191) bolum 2","metin":"Bu tanımıyla ahlak, insan eylemlerinin doğru ve yanlış gibi değer ölçüleriyle ifade edilmesini mümkün kılan yargı, tutum, davranışlardır. İnsanların birbirleriyle, toplumla ya da devletle olan ilişkilerinden ortaya çıkmış olup, bireylerin “yapmaları veya yapmamaları istenen” davranışları ve eylemleri belirler2. Toplumsal yaşamın tüm alanlarında insanların yaptıklarını düzene koyan ahlak, kendiliğinden biçimlenmiş ve genel kabul görmüş değerlendirmeleri içeren davranış kurallarıdır3. Ahlak, kaynağını insandan alır. Doğanın kendisinde, öldürme, kötü söz söyleme, iyi insan ol vb. gibi ahlaka yönelik kurallar bulunmamaktadır. Ahlakın konusuna giren kavramları, bireyler ya da toplumlar tarihsel süreçte kendileri yaratmıştır. Birey, uyulması gereken kurallar bütünü olan ahlakı, yaşadığı toplumda hazır bulur. Ancak, gerek birey, gerekse toplum belirli bir olgunluk seviyesine eriştikten sonra, öğrenilen ahlaki yargıları kendi içinde sorgular, değerlendirir ve bunun sonucunda başlangıçtan farklı ahlaki yargı kurallarına ulaşabilir. İşte böyle bir sorgulama ve değerlendirme süreci, birey veya toplumun evrensel değer ve yargılara ulaşmak için, etik eylemde bulunması anlamına gelmektedir. Etik, ahlakı konu edinen ve bireyin aktif katılımıyla yapılan bir “derin düşünme”4 ve evrensel anlamda “doğru eylem”in gerçekleştirilmesi sürecidir (tefekkür). Yapmayı tasarladığı eylem öncesinde, eyleminin doğruluğu konusunda derin düşünceye yönelen ve önce “Burada ne yapmalıyım?”, ardından “Neden?” sorularına cevap arayan her birey, böylece etik bir eylem, etik düşünme, gerçekleştirmiş olur."}],"hakem":"Kaynak metinde (Bölüm 3) etik ilkelerin \u0027bireyin özgürlüğünün bir sonucu\u0027 olduğu ve kişiliğin gelişimine yönelik derin düşünme süreci ifade edilirken, davranış kurallarının ise toplumsal yaşamın tüm alanlarında insanların yaptıklarını düzene koyan \u0027kendiliğinden biçimlenmiş ve genel kabul görmüş değerlendirmeleri içeren davranış kuralları\u0027 olarak tanımlandığı (Bölüm 2) açıkça yer almaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"TSPB Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları metnine göre ahlak, etik, meslek etiği ve davranış kuralları kavramları arasındaki ilişkiye ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-20","verilenler":[],"dayanak":"TSPB Genelge 19 (2014/1031) eki Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları, bölüm I-II ve 5","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bir aracı kurumda 3 yıllık müşteri temsilcisi Ayşe, portföy yönetimi bölümüne yeni geçen stajyer Can\u0027a etik ile ahlak farkını, meslek etiği ile davranış kurallarının farkını anlatıyor.","anlatim":"Ayşe elindeki kâğıda dört kavramı yazıyor: ahlak, etik, meslek etiği, davranış kuralları. Can bunları birbirine karıştırıyor ve beş cümleyle test ediliyor.","doldur":[]},{"formul":"Ne yapacağız: Ayşe\u0027nin yazdığı beş cümleyi TSPB\u0027nin Genelge 19 ekindeki tanımlarla tek tek karşılaştıracağız.","anlatim":"Ahlak kaynağını insandan alır, hazır bulunur; etik ise bireyin özgür iradesiyle derin düşünme sürecidir. Beş ifadeyi bu iki tanımla tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Genelge 19 eki, bölüm I-II","karar":"yanlış","anlatim":"Ayşe hemen düzeltiyor, çünkü metin tam tersini söylüyor: ahlak hazır bulunan, etik ise sorgulanıp derin düşünülen süreçtir. Can kavramları ters bağlamış.","formul":"Şık A: Can \u0027etik düşünmeden kabul edilen, ahlak ise derin düşünülüp karar verilen kurallardır\u0027 diyor, doğru mu diyorsun?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Genelge 19 eki, bölüm I-II","karar":"yanlış","anlatim":"Ayşe hayır diyor, çünkü metne göre etik ve ahlaki eylem bireyin özgürlüğüne dayanır. Zorlama ve tehditle yapılan eylem derin düşünmeye dayanmadığı için ahlaki sayılmaz.","formul":"Şük B: Can \u0027yönetici beni tehdit ederek bir işlem yaptırsa da, sonuç toplumsal düzeni koruyorsa bu ahlaki eylemdir\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Genelge 19 eki, bölüm 5","karar":"doğru","anlatim":"Ayşe bunu onaylıyor, çünkü metin tam olarak bu ayrımı yapıyor. Soyut olan etik, somut olan davranış kuralı diye ikiye bölünüyor.","formul":"Şık C: Can \u0027etik ilkeler kişiliği hedef alan soyut kavramlardır, davranış kuralları ise mesleğin somut uygulamasına yöneliktir\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Genelge 19 eki, bölüm 5","karar":"yanlış","anlatim":"Ayşe düzeltiyor, çünkü bu somut idealize etme işlevi metinde davranış kurallarına ait, meslek etiğine değil. Can iki kavramın işlevini karıştırmış.","formul":"Şık D: Can \u0027meslek etiği, basiretli kişinin iş yaparken nasıl davranacağını somut şekilde idealize eden ilkelerdir\u0027 diyor, bu tanım doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Genelge 19 eki, bölüm 5","karar":"yanlış","anlatim":"Ayşe hayır diyor, çünkü metin meslek etiğini hem rekabeti düzenleyen hem de yetersiz ve ilkesiz üyeleri dışlayan bir bütün olarak tanımlıyor. Can tanımı eksik bırakmış.","formul":"Şık E: Can \u0027meslek etiği sadece meslek içi rekabeti düzenler, yetersiz üyeleri meslekten dışlamakla ilgisi yoktur\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Doğru cevap C, çünkü metindeki soyut-somut ayrımı birebir buradadır. Kendine hep şunu sor: bu ifade kişiliği mi, yoksa mesleğin somut uygulamasını mı anlatıyor?","doldur":[]}],"anahtar":[{"ornek":"davranış","kok":"davran"},{"ornek":"kuralları","kok":"kurall"},{"ornek":"kavramları","kok":"kavram"},{"ornek":"ahlaki","kok":"ahlaki"},{"ornek":"mesleğin","kok":"mesleğ"},{"ornek":"kişiliği","kok":"kişili"}],"konuGiris":{"harita":"Ne zaman test edilir: kavramlardan birinin tanımı veya ilişkisi doğru/yanlış seçenek olarak sorulduğunda. Nasıl ölçülür: metindeki tanımların birbirine karıştırılıp karıştırılmadığına bakılarak. Nasıl kaydedilir: doğru seçenek, metindeki hiyerarşiyi (ahlak-etik-meslek etiği-davranış kuralı) bozmayan ifadedir.","desen":"Sınav bu dört kavramı birbirinin yerine kullanan yanlış cümleler kurarak tuzak yapar, örneğin ahlakı etikle veya davranış kurallarını meslek etiğiyle eş sayan seçenekler sorulur. Doğru seçenek metindeki sırayı yani ahlaktan etiğe, etikten meslek etiğine, oradan davranış kuralına geçişi bozmaz. Bu soru bölüm 3\u0027teki ahlak-etik ilişkisi tanımından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Toplumda genel kabul gören, sorgulanmadan uyulan doğru-yanlış kuralları","ad":"Ahlak","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bireyin özgür iradesiyle ahlakı derin düşünerek sorgulaması ve karar vermesi","ad":"Etik","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Etik düşünmenin belirli bir mesleğe özgü doğru eylem kurallarına dönüşmesi","ad":"Meslek etiği","kim":"meslek kuruluşu düzenler"},{"kaynak":"soruda verilir","tanim":"Meslek etiğinin yazılı, somut ve uyulması istenen kurallara dökülmüş hali","ad":"Davranış kuralları","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soru dört kavramdan birinin veya ilişkisinin doğru tanımlandığı seçeneği bulmayı ister.","panel_ornek":"Bir arkadaşın herkesin yaptığı gibi otobüste yaşlıya yer vermesi ahlaki bir davranıştır ama o an durup \u0027burada doğru olan ne\u0027 diye düşünüp kararını kendi vicdanıyla sorgulaması etik düşünmedir. Sonra bu düşünme, mesleğindeki 5 kişilik ekip için yazılı 3 kurala dönüşürse artık meslek etiği ve davranış kuralı olur.","ornek":"Bir arkadaşın herkesin yaptığı gibi otobüste yaşlıya yer vermesi ahlaki bir davranıştır ama o an durup \u0027burada doğru olan ne\u0027 diye düşünüp kararını kendi vicdanıyla sorgulaması etik düşünmedir. Sonra bu düşünme, mesleğindeki 5 kişilik ekip için yazılı 3 kurala dönüşürse artık meslek etiği ve davranış kuralı olur.","yontemler":"Cevabı bulurken hangi kavramın \u0027kaynağını insandan alan, sorgulanmayan\u0027 olduğuna, hangisinin \u0027özgür iradeyle sorgulama\u0027 olduğuna bakılır. Meslek etiği ve davranış kuralları ikisi de bu sorgulamanın somutlaşmış, yazılı haline karşılık geldiği unutulmamalı.","nedir":"Bu konu ahlak, etik, meslek etiği ve davranış kuralları kavramlarının birbirinden farkını ve aralarındaki ilişkiyi anlatır. Sınav bu dört kavramın tanımını ve hangisinin hangisinden doğduğunu ölçer."},"olay":"","tuzak":{"D":{"ad":"Kavram Karıştırma Tuzağı","metin":"Basiretli kişinin somut davranışını idealize eden tanımı Meslek Etiğine mal ettin, oysa bu tanım Davranış Kurallarına aittir. Doğrusu: Somut, uygulamaya yönelik idealize etme işlevi Davranış Kurallarının, soyut kişilik gelişimi işlevi ise Etik İlkelerin konusudur."},"E":{"ad":"Kapsam Eksiltme Tuzağı","metin":"Meslek etiğinin işlevlerinden yalnızca birini (rekabeti düzenleme) alıp diğerini (yetersiz üyeleri dışlama) yok saydın. Doğrusu: Metne göre meslek etiği hem meslek içi rekabeti düzenler hem de yetersiz ve ilkesiz üyeleri meslekten dışlar."},"A":{"ad":"Ters Kayıt Tuzağı","metin":"Ahlak ile Etik kavramlarının tanımlarını yer değiştirip yazdın. Doğrusu: Ahlak üzerinde düşünmeden kabul edilen kuralları, etik ise özgür iradeyle derin düşünme sonucu benimsenen kuralları içerir."},"B":{"ad":"İstisnanın İhmali Tuzağı","metin":"Zorlama ve tehditle yapılan eylemi ahlaki sayarak metindeki açık istisnayı gözden kaçırdın. Doğrusu: Metne göre zorlama ve tehditle gerçekleştirilen eylem derin düşünmeye dayanmadığı için ne ahlaki ne de etiktir."}},"celdiriciYol":{},"hap":"Etik İlkeler kişiliği hedef alan soyut kuralları, Davranış Kuralları ise mesleğin uygulamasına yönelik somut yönlendirmeleri içerir; zorlama ve tehditle yapılan eylem ne ahlaki ne de etiktir.","teshis":{"C":{"gercek":"Metin açıkça Etik İlkeleri soyut/kişilik odaklı, Davranış Kurallarını somut/uygulama odaklı olarak birbirinden ayırır.","ayirt":"Bu ifade kişiliği mi, yoksa mesleğin somut uygulamasını mı hedef alıyor?","paragraf":"Genelge 19 eki, bölüm 5","yanilgi":"Bu şıkkı elemeye çalışan öğrenci, iki kavramın tanımını birbirine çok yakın bulup ayrımı gereksiz sanır."},"E":{"gercek":"Metin meslek etiğini hem meslek içi rekabeti düzenleyen hem de yetersiz ve ilkesiz üyeleri meslekten dışlayan ilkeler bütünü olarak tanımlar.","ayirt":"Bu tanım meslek etiğinin işlevlerinden yalnızca birini mi anlatıyor, tamamını mı?","paragraf":"Genelge 19 eki, bölüm 5","yanilgi":"Meslek etiğinin tanımındaki uzun madde listesinden yalnızca ilk aklına geleni (rekabeti düzenleme) meslek etiğinin tamamı sandın."},"A":{"gercek":"Metin ahlakı kaynağını insandan alan, hazır bulunan kurallar; etiği ise bireyin özgür iradesiyle derin düşünme sonucu ulaştığı yargılar olarak ayırır.","ayirt":"Bu kural birey sorgulamadan mı benimsiyor, yoksa derin düşünme sonucu mu karar veriyor?","paragraf":"Genelge 19 eki, bölüm I-II","yanilgi":"Ahlak ve etik kelimelerini günlük dilde eş anlamlı sandığın için hangisinin \u0027düşünülmeden kabul edilen\u0027, hangisinin \u0027sorgulanarak benimsenen\u0027 olduğunu karıştırdın."},"D":{"gercek":"Metinde \u0027basiretli kişinin nasıl davranması gerektiğini idealize etme\u0027 işlevi açıkça Davranış Kurallarına atfedilir, Meslek Etiğine değil.","ayirt":"Bu tanım soyut kişilik ilkesi mi, yoksa somut davranış rehberi mi?","paragraf":"Genelge 19 eki, bölüm 5","yanilgi":"Meslek etiği ile davranış kurallarının aynı şey olduğunu, ikisinin de somut davranış idealize ettiğini sandın."},"B":{"gercek":"Metne göre birey özgürlüğüne dayanmayan, dışsal zorlama ve tehditle gerçekleştirilen eylem derin düşünmeye dayanmadığından ne ahlaki ne de etiktir.","ayirt":"Bu davranış özgür iradeyle mi, yoksa dışsal bir baskıyla mı gerçekleşti?","paragraf":"Genelge 19 eki, bölüm I-II (özgürlük vurgusu)","yanilgi":"Zorlamayla yapılan bir davranışın da sonuçta bir kurala uyduğu için ahlaki sayılabileceğini düşündün."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"3568 sayılı Kanunun 48 inci maddesine göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında önce fiilin \u0027genel vakar ihlali\u0027 mi yoksa \u0027kanunun ayrıca saydığı özel ağır fiil\u0027 mi olduğunu ayırt et.","konu":"disiplin cezalari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Fiil","Mükellefle birlikte kasten vergi ziyaına sebebiyet verme","-"],["Kesinleşme durumu","Mahkeme kararıyla kesinleşmiş","-"],["HESAP","-","-"],["A) Uyarma","p.48/1","YANLIŞ ifade"],["B) Kınama","p.48/1","YANLIŞ ifade"],["C) Geçici olarak mesleki faaliyetten alıkoyma","p.48/2","YANLIŞ ifade"],["D) Yeminli sıfatını kaldırma","p.48/1","YANLIŞ ifade"],["E) Meslekten çıkarma","p.48/2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Geçici olarak mesleki faaliyetten alıkoyma","E":"Meslekten çıkarma","A":"Uyarma","D":"Yeminli sıfatını kaldırma","B":"Kınama"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"3568 sayılı Kanun m.48\u0027de mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararıyla kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir hükmü açıkça yer almaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[{"yil":"2018/3","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, disiplin cezalarına ilişkin aşağıdakilerden hangisi yanlıştır?"},{"yil":"2018/1","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, serbest muhasebeci mali müşavirlere uygulanabilecek disiplin cezaları ile ilgili aşağıdakilerden hangisi yanlıştır?"},{"yil":"2017/2","alinti":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliğine göre, yukarıdaki disiplin cezalarından hangileri Resmî Gazete’de ilan edilmez?"}],"donemler":["2025/1","2024/2","2021/1","2020/1","2018/3","2018/1","2017/3","2017/2","2017/1","2016/2","2015/2"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavirin, mükellefiyle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşmiştir. 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre bu meslek mensubuna hangi disiplin cezası verilir?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-01","verilenler":[{"deger":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verme","anlam":"Hangi disiplin cezasının uygulanacağını belirleyen fiildir.","ad":"Fiil"},{"deger":"Mahkeme kararıyla kesinleşmiş","anlam":"Cezanın uygulanabilmesi için fiilin mahkeme kararıyla kesinleşmiş olması gerektiğini gösterir.","ad":"Kesinleşme durumu"}],"dayanak":"3568 sayılı SMMM K. m.48","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: bir başka ilde, bir SMMM ile mükellefi 2019 yılında birlikte hareket edip 340.000 TL vergi ziyaına kasten sebep olmuş, olay mahkemeye taşınmış ve 2022\u0027de karar kesinleşmiştir.","anlatim":"Mahkeme kararı kesinleşince artık tartışma bitmiştir. Disiplin kurulu bu meslek mensubuna hangi cezayı vereceğine bakar.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun madde 48\u0027de beş ceza var; uyarma, kınama, geçici alıkoyma, yeminli sıfatını kaldırma, meslekten çıkarma. Bu beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Her ceza farklı bir fiile bağlanmıştır, hepsi aynı kefeye konmaz. Şimdi olayımızdaki fiil hangi bende denk geliyor onu arayacağız.","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"p.48/1","karar":"yanlış","anlatim":"Uyarma yalnız mesleğin vakar ve onuruna aykırı davranışın ilk kez görülmesinde uygulanır. Bizim olayımızda ayrı ve özel bir hüküm var, mükellefle kasten vergi ziyaı. Bu yüzden uyarma burada uygulanmaz.","formul":"Şık A: disiplin kurulu \u0027ilk defa oluyor, sadece uyarma verelim\u0027 diyor, bu doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"p.48/1","karar":"yanlış","anlatim":"Kınama da aynı genel vakar/onur ihlali hükmünün tekrarına özgüdür. Olayımızdaki fiil kanunun ayrıca saydığı özel bir haldir, genel hükme girmez. Kınama burada yanlış olur.","formul":"Şık B: \u0027daha önce böyle bir olay yaşamıştı, tekrar ettiği için kınama verelim\u0027 diyor, katılır mısın?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"p.48/2","karar":"yanlış","anlatim":"Geçici alıkoyma bağımsızlık, tarafsızlık, dürüstlük ihlaline ya da tasdik yetkisinin ilk kez kötüye kullanımına bağlıdır. Bizim olayda mükellefle birlikte kasten vergi ziyaı var, bu ayrı bir bent. Geçici alıkoyma burada uygulanmaz.","formul":"Şık C: \u0027altı ay mesleki faaliyetten alıkoyalım, yeter\u0027 diyor, doğru mu bu karar?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"p.48/1","karar":"yanlış","anlatim":"Bu ceza yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrür edip mahkeme kararıyla kesinleşmesine özgüdür. Olayımızda tasdik yetkisi kötüye kullanımı yok, mükellefle kasten vergi ziyaı var. D burada da yanlış.","formul":"Şık D: \u0027yeminli mali müşavirse yeminli sıfatını kaldıralım\u0027 diyor, sen ne dersin?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.48/2","karar":"doğru","anlatim":"Kanun açıkça der: mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası verilir. Olayımız tam bu tanıma uyuyor. Bu yüzden E doğrudur.","formul":"Şık E: \u0027meslekten çıkarma cezası verelim\u0027 diyor, sence bu doğru mu?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.48/2","karar":"doğru","anlatim":"Bu ceza kademeli bir süreçten geçmez, kanun onu doğrudan ve özel olarak bağlamıştır. Kendine hep şunu sor: bu fiil genel vakar/onur ihlali mi, yoksa kanunun ayrıca saydığı özel bir fiil mi?","formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓"}],"anahtar":[{"ornek":"meslek","kok":"meslek"},{"ornek":"mükellefle","kok":"mükell"},{"ornek":"kesinleşen","kok":"kesinl"},{"ornek":"olayımızdaki","kok":"olayım"},{"ornek":"kasten","kok":"kasten"},{"ornek":"kararıyla","kok":"kararı"}],"konuGiris":{"harita":"Ne zaman verilir: fiilin ağırlığına göre beş dereceli cezalardan biri seçilerek uygulanır. Nasıl belirlenir: kanunda sayılan fiil tipleri ile ceza doğrudan eşleştirilir. Nasıl kesinleşir: savunma alınıp disiplin kurulu kararıyla, bildirimden sonra yürürlüğe girer.","desen":"Soru genelde mahkeme kararıyla kesinleşmiş vergi ziyaı fiilini verip doğrudan ceza türünü sordurur; tuzak, bu fiili geçici alıkoyma ya da kınama gibi hafif cezalarla karıştırmaktır. Çıkmışlarda öğrenciler tekerrür şartlarını (3 yıl, 5 yıl) bu maddeyle karıştırıp yanlış ceza seçebilir. Bu soru m.48 fıkra 2\u0027deki \u0027mükellefle birlikte kasten vergi ziyaı\u0027 ibaresinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Daha dikkatli davranılması gerektiğinin yazıyla bildirilmesi","ad":"Uyarma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"6 ay ila 1 yıl arası mesleki faaliyetten men edilme","ad":"Geçici alıkoyma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ruhsatın geri alınıp mesleğe tekrar izin verilmemesi","ad":"Meslekten çıkarma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mükellefle birlikte kasten vergi kaybına neden olma","ad":"Vergi ziyaı fiili","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Mahkeme kararıyla kesinleşmiş bir fiil verilip buna karşılık gelen disiplin cezası sorulur.","panel_ornek":"Bir spor kulübü üyesi, kulüp kurallarını ilk kez ihlal ederse sözlü uyarı alır; aynı hatayı 3 kez tekrarlarsa üyeliği tamamen iptal edilir. Küçük hata küçük ceza, büyük ve tekrar eden hata ise en ağır cezayı getirir.","ornek":"Bir spor kulübü üyesi, kulüp kurallarını ilk kez ihlal ederse sözlü uyarı alır; aynı hatayı 3 kez tekrarlarsa üyeliği tamamen iptal edilir. Küçük hata küçük ceza, büyük ve tekrar eden hata ise en ağır cezayı getirir.","yontemler":"Fiil cümlesini kanundaki kalıp ifadelerle birebir eşleştirip doğrudan ceza adını seçmek yeterlidir, hesaplama yapılmaz.","nedir":"Meslek mensuplarının mesleki kurallara aykırı davranışlarına karşı uygulanan yaptırım sistemidir. Sınav, hangi fiile hangi ceza derecesinin karşılık geldiğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Bağımsızlık İhlali Tuzağı","metin":"Görevi bağımsızlık, tarafsızlık ve dürüstlükle yapmama halinin cezasıyla bu özel fiili karıştırıyorsun. Doğrusu: Geçici alıkoyma cezası bağımsızlık/tarafsızlık ihlali ile tasdik yetkisinin gerçeğe aykırı ilk kullanımına özgüdür, mükellefle kasten vergi ziyaına sebebiyet fiiline uygulanmaz."},"A":{"ad":"İlk Aşama Tuzağı","metin":"Her disiplin ihlalinin ilk defasında uyarma cezası ile başladığını sanıyorsun. Doğrusu: Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verilip bu husus mahkeme kararıyla kesinleştiğinde ilk aşama uygulamadan doğrudan meslekten çıkarma cezasını öngörür."},"D":{"ad":"Yeminli Sıfatı Tuzağı","metin":"Bu cezanın her ağır fiilde uygulanan genel bir yaptırım olduğunu sanıyorsun. Doğrusu: Yeminli sıfatının kaldırılması yalnız yeminli mali müşavirlerin tasdik yetkisini gerçeğe aykırı kullanmasının tekerrürüne özgü özel bir cezadır."},"B":{"ad":"Tekerrür Tuzağı","metin":"Kınama cezasının basit kusurlu davranışın tekrarında uygulandığını, olayı da böyle bir tekrar sanıyorsun. Doğrusu: Buradaki fiil mükellefle birlikte kasten vergi ziyaına sebep olmaktır, bu fiile kanun doğrudan en ağır cezayı bağlamıştır."}},"celdiriciYol":{},"hap":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu husus mahkeme kararıyla kesinleşen meslek mensubuna kademesiz doğrudan meslekten çıkarma cezası verilir.","teshis":{"C":{"gercek":"Geçici alıkoyma; bağımsızlık, tarafsızlık, dürüstlük ihlali ile tasdik yetkisinin ilk kez gerçeğe aykırı kullanımına özgüdür.","ayirt":"Fiil bağımsızlık/tasdik yetkisi ihlali mi, yoksa mükellefle birlikte vergi ziyaı mı?","paragraf":"3568 s.K. m.48","yanilgi":"Geçici alıkoymayı her ağır sayılan fiilin standart cezası sanıyorsun."},"E":{"gercek":"Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verilip bunun mahkeme kararıyla kesinleşmesi halini doğrudan meslekten çıkarma sebebi \u0027de yayımlanarak yürürlüğe girer. Yeni tarifenin tasdikine kadar mevcut tarife hükmü uygulanır. Görevle ilgili suçlar"}],"hakem":"Doğru sık, 3568 sayılı Kanun m.46\u0027da açıkça yer alan \u0027Yeni tarifenin tasdikine kadar mevcut tarife hükmü uygulanır\u0027 kuralına tamamen uyuyor."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2023/3"]},"oyun":null,"tip":"teori","soru":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre ücret tarifesinin hazırlanma ve yürürlüğe girme sürecine ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-05","verilenler":[],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.46","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bakırköy SMMM Odası, 2015 yılı için hazırladığı ücret tarifesini Kasım ayında Birliğe gönderiyor. Birlik onu gruplarla birleştirip Maliye Bakanlığına iletiyor ama Bakanlık onayı Ocak ayı bitene kadar gelmiyor.","anlatim":"Ocak ayı geldi ama yeni tarife hâlâ tasdik edilmedi. Peki bu odadaki meslek mensupları o ay hangi ücretle iş yapacak?","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun m.46\u0027nın hazırlık-onay-yürürlük zincirini bu Bakırköy örneğinde adım adım kontrol edeceğiz.","anlatim":"Oda hazırlar, Birliğe gönderir, Birlik gruplar, Bakanlık tasdik eder, Resmi Gazete\u0027de yayımlanır. Beş şıkkı bu zincirin üzerinde tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"3568 s.K. m.46","karar":"doğru","anlatim":"Yeni tarife tasdik edilmediği için 2014 tarifesi hâlâ yürürlükte sayılır. Kanun tam olarak bunu söylüyor, boşluk bırakmıyor.","formul":"Şık A: Bakanlık onayı gecikince, Ocak ayında Bakırköy\u0027deki meslek mensupları hangi tarifeyle ücret alır, eski tarife mi geçerli olur?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"3568 s.K. m.46","karar":"yanlış","anlatim":"Hayır, oda tarifeyi mutlaka Birliğe gönderir. Birlik grupları belirleyip Bakanlığa iletmeden Resmi Gazete\u0027ye hiçbir şey gitmez.","formul":"Şık B: Bakırköy Odası hazırladığı tarifeyi doğrudan Resmi Gazete\u0027ye gönderip yayımlatabilir mi, Birliği atlayabilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"3568 s.K. m.46","karar":"yanlış","anlatim":"Hayır, tarifedeki asgari miktarın altında iş kabulü kanunen yasak. Aksine davranış disiplin cezası doğurur, tercih meselesi değil.","formul":"Şık C: bir meslek mensubu \u0027ben asgari ücretin altına iş alırım, bu benim tercihim\u0027 diyor, haklı mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"3568 s.K. m.46","karar":"yanlış","anlatim":"Hayır, kanun her odanın tarifeyi Ocak ayından geçerli olmak üzere hazırlayacağını söylüyor. Aralık değil Ocak esas alınır.","formul":"Şık D: Bakırköy Odası tarifesini Aralık ayından geçerli olacak şekilde mi hazırlamalıydı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"3568 s.K. m.46","karar":"yanlış","anlatim":"Hayır, Bakanlık tarifeyi aynen veya değiştirerek tasdik etmeden yayım olmaz. Onay şartı zincirin bel kemiği.","formul":"Şık E: Birlik yönetim kurulu hazırladığı tarifeyi Maliye Bakanlığının onayını beklemeden Resmi Gazete\u0027ye gönderebilir mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Zincirdeki her halka -oda, Birlik, Bakanlık onayı- eksiksiz tamamlanana kadar eski tarife yürürlükte kalır. Kendine hep şunu sor: yeni tarife tasdik edildi mi, edilmediyse hangi tarife geçerli?","doldur":[]}],"anahtar":[{"ornek":"tarifesi","kok":"tarife"},{"ornek":"tasdik","kok":"tasdik"},{"ornek":"bakanlık","kok":"bakanl"},{"ornek":"birlik","kok":"birlik"},{"ornek":"zincirin","kok":"zincir"},{"ornek":"edilmedi","kok":"edilme"}],"konuGiris":{"harita":"Ne zaman test edilir: tarifenin hangi sırayla hazırlanıp yürürlüğe girdiği sorulduğunda. Nasıl ölçülür: oda-Birlik-Bakanlık zincirindeki doğru sıralamayı bilme ile ölçülür. Nasıl kaydedilir: Resmi Gazete\u0027de yayım tarihi yürürlük başlangıcı olarak kabul edilir.","desen":"Sınav genelde sıralamayı karıştırarak sorar; örneğin Birliğin doğrudan Resmi Gazete\u0027ye gönderdiği gibi yanlış seçenek konur. Bazı seçeneklerde Bakanlık onayı atlanıp doğrudan yürürlük iddia edilir. Bu soru m.46\u0027daki oda-Birlik-Bakanlık-Resmi Gazete sıralaması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Her odanın yönetim kurulunun ocak ayı için hazırlayıp Birliğe gönderdiği taslak","ad":"Oda tarifesi teklifi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Birlik yönetim kurulunun oda tekliflerini birleştirip Bakanlığa gönderdiği grup tarifesi","ad":"Birlik tarifesi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Maliye Bakanlığının tarifeyi aynen veya değiştirerek onaylaması","ad":"Bakanlık tasdiki","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Tarifedeki alt sınırın altında iş kabulünün yasak olduğu kural","ad":"Asgari ücret sınırı","kim":"kanun sabitler"}],"sinavda":"Tarifenin hazırlanma ve yürürlüğe girme sürecine dair doğru sıralamayı seçmesi istenir.","panel_ornek":"Bir apartman yönetimi her yıl ocak ayında aidat listesini hazırlar, sonra bunu bölge yöneticisine onaya gönderir. Yönetici de son halini ilan panosuna aşar ve o tarihten sonra geçerli olur. Yeni liste asılana kadar eski aidat tutarı uygulanmaya devam eder.","ornek":"Bir apartman yönetimi her yıl ocak ayında aidat listesini hazırlar, sonra bunu bölge yöneticisine onaya gönderir. Yönetici de son halini ilan panosuna aşar ve o tarihten sonra geçerli olur. Yeni liste asılana kadar eski aidat tutarı uygulanmaya devam eder.","yontemler":"Sıralamayı oda→Birlik→Bakanlık→Resmi Gazete olarak ezberlemek tek kritik kuraldır.","nedir":"Ücret tarifesi, meslek mensuplarının alacağı asgari ücreti gösteren resmi belgedir. Sınav bu tarifenin hazırlanış ve yürürlüğe giriş sırasını ölçer."},"olay":"","tuzak":{"C":{"ad":"Serbestlik Tuzağı","metin":"asgari ücretin altında iş kabulünün meslek mensubunun kendi tercihi olduğunu sanırsın. Doğrusu: tarifedeki asgari miktarın altında iş kabulü yasaktır ve disiplin cezasını gerektirir."},"E":{"ad":"Onay Mercii Tuzağı","metin":"Birlik tarifesinin Maliye Bakanlığı onayına ihtiyaç duymadan yürürlüğe girdiğini sanırsın. Doğrusu: Birlik yönetim kurulunun hazırladığı tarife Maliye Bakanlığınca aynen veya değiştirilerek tasdik edildikten sonra Resmi Gazete\u0027de yayımlanır."},"D":{"ad":"Zamanlama Tuzağı","metin":"tarife hazırlığının aralık ayından geçerli olduğunu düşünürsün. Doğrusu: her odanın yönetim kurulu tarifeyi her yıl ocak ayından geçerli olmak üzere hazırlar."},"B":{"ad":"Süreç Atlama Tuzağı","metin":"oda tarifesinin doğrudan Resmi Gazete\u0027ye gittiğini, Birlik ve Maliye Bakanlığı aşamalarının atlandığını düşünürsün. Doğrusu: oda tarifeleri önce Birliğe, Birlik de gruplandırdığı tarifeleri Maliye Bakanlığına gönderir; yayım en son adımdır."}},"celdiriciYol":{},"hap":"Yeni ücret tarifesi tasdik edilip Resmi Gazete\u0027de yayımlanana kadar mevcut tarife uygulanmaya devam eder.","teshis":{"C":{"gercek":"Tarifedeki asgari miktar altında iş kabulü yasaktır, aksine hareket disiplin cezasını gerektirir.","ayirt":"Bu davranışın bir disiplin cezası sonucu var mı?","paragraf":"3568 s.K. m.46","yanilgi":"Asgari ücretin altı iş kabulünü sadece etik bir tercih meselesi sanır, yaptırımı görmezsin."},"E":{"gercek":"Maliye Bakanlığı tarifeyi aynen veya gerekli gördüğü değişikliklerle tasdik eder; tasdik olmadan tarife yürürlüğe giremez.","ayirt":"Tarife yürürlüğe girmeden önce hangi makamın onayı gerekir?","paragraf":"3568 s.K. m.46","yanilgi":"Birliğin hazırladığı tarifenin Birlik kararıyla kesinleştiğini, Maliye Bakanlığının sadece şeklen bilgilendirildiğini sanırsın."},"A":{"gercek":"3568 sayılı Kanun m.46 uyarınca yeni tarifenin tasdikine kadar mevcut tarife hükmü uygulanmaya devam eder.","ayirt":"Yeni tarife henüz tasdik edilmemişse hangi tarife uygulanır?","p eketin doğu…","m.14/1-2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İzin alınmaması işlemi geçersiz kıldığından meslek mensubu ne tacir sayılır ne de disiplin sorumluluğu doğar.","E":"Meslek mensubu tacir sayılır ve bu aykırı hareketin doğurduğu hukuki, cezai ve disipline ilişkin sorumluluk saklı kalır.","A":"Meslek mensubu tacir sayılır; ancak izin alınmadığından bu fiilin disipline ilişkin sorumluluğu doğmaz.","D":"Meslek mensubu hakkında yalnızca hukuki ve cezai sorumluluk doğar; disipline ilişkin sorumluluk bu fiilde uygulanmaz.","B":"Meslek mensubu hakkında disiplin kovuşturması yapılır; ancak izinsiz işletme nedeniyle tacir sayılmaz."},"kaynak":{"alinti":"","liste":[{"ad":"TTK (6102 s.K.) m.14","metin":"MADDE 14- (1) Kişisel durumları ya da yaptığı işlerin niteliği nedeniyle yahut meslek ve görevleri dolayısıyla, kanundan veya bir yargı kararından doğan bir yasağa aykırı bir şekilde ya da başka bir kişinin veya resmî bir makamın iznine gerek olmasına rağmen izin veya onay almadan bir ticari işletmeyi işleten kişi de tacir sayılır. (2) Birinci fıkraya aykırı hareketin doğurduğu hukuki, cezai ve disipline ilişkin sorumluluk saklıdır. 4. Esnaf"},{"ad":"TTK (6102 s.K.) m.28","metin":"MADDE 28- (1) Tescil istemi ilgililer, temsilcileri veya hukuki halefleri tarafından yetkili sicil müdürlüğüne yapılır. (2) Bir hususun tescilini istemeye birden çok kimse zorunlu ve yetkili olduğu takdirde, kanunda aksine hüküm bulunmadıkça, bunlardan birinin talebi üzerine yapılan tescil tümü tarafından istenmiş sayılır. 26/6/2012 tarihli ve 6335 sayılı Kanunun 40 ıncı maddesiyle, bu maddenin başlığında yer alan “Tüzük” ibaresi “Yönetmelik”, birinci fıkrasında yer alan “bir tüzükle” ibaresi “Gümrük ve Ticaret Bakanlığınca hazırlanan ve Bakanlar Kurulunca çıkarılacak yönetmelikte” şeklinde değiştirilmiştir. 13 Anayasa Mahkemesinin 3/6/2025 tarihli ve E.: 2024/208, K.: 2025/122 sayılı Kararı ile bu maddede yer alan “…disiplin işleri…” ibaresi iptal edilmiştir. 14 2/7/2018 tarihli ve 700 sayılı Kanun Hükmünde Kararnamenin 192 nci maddesiyle bu fıkrada yer alan “Gümrük ve Ticaret Bakanlığınca hazırlanan ve Bakanlar Kurulunca” ibaresi “Cumhurbaşkanınca” şeklinde değiştirilmiştir. 15 26/6/2012 tarihli ve 6335 sayılı Kanunun 40 ıncı maddesiyle, bu fıkrada yer alan “memurlukları” ibaresi “müdürlükleri”, “evraklarının” ibaresi “evrakının” ve “bir” ibaresi “birer” şeklinde değiştirilmiştir. 12 3. İstemin şekli"}],"hakem":"TTK m.14/1-2 kaynakta açıkça bulunmakta; izinsiz işletme işleten kişinin tacir sayılması ve hukuki-cezai-disipline ilişkin sorumluluğun saklı kalması kuralı doğru sıkta tam olarak yansıtılmıştır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2020/3"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavir, resmî bir makamın iznine tabi olmasına rağmen izin almaksızın bir ticari işletme işletmektedir. Türk Ticaret Kanunu\u0027na göre bu durumda aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-07","verilenler":[],"dayanak":"Türk Ticaret Kanunu (6102 s.K.) m.14/1-2","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Antalya\u0027da bir avukat, avukatlık ruhsatı varken ayrıca izin almadan turizm acentesi işletiyor, üstelik bu iş için resmî makamdan izin almamış.","anlatim":"Bu avukat izinsiz şekilde iki yıl boyunca 40 tür satmış, 600.000 TL ciro yapmış. Şimdi bu olay üzerinden Türk Ticaret Kanunu\u0027nun kuralını göreceğiz.","doldur":[]},{"formul":"Ne yapacağız: m.14/1\u0027e göre izinsiz işleten kişi yine de tacir sayılır, m.14/2\u0027ye göre hukuki, cezai ve disiplin sorumluluğu saklı kalır.","anlatim":"Bu iki kural birlikte çalışır, biri diğerini engellemez. Şimdi beş ifadeyi bu avukat olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.14/2","karar":"yanlış","anlatim":"Avukat izinsiz olduğu için tam tersine disiplin sorumluluğu doğar, izinsizlik cezayı kaldırmaz. m.14/2 açıkça bu sorumluluğu saklı tutar.","formul":"Şık A: birisi sana \u0027izin yok diye disiplin cezası da uygulanmaz\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.14/1","karar":"yanlış","anlatim":"Avukat izinsiz de olsa işletmeyi fiilen işlettiği için m.14/1 gereği tacir sayılır. Tacirlik bir ödül değil, fiilin doğal sonucudur.","formul":"Şık B: birisi sana \u0027disiplin cezası olur ama tacir sayılmaz\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.14/1-2","karar":"yanlış","anlatim":"Kanun izinsizliği geçersizlik sebebi yapmaz, tam tersine hem tacirlik hem sorumluluk ekler. Avukat yine tacir sayılır ve sorumluluğu vardır.","formul":"Şık C: birisi sana \u0027izin olmadığı için işlem geçersiz, ne tacirlik ne sorumluluk doğar\u0027 diyor, katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.14/2","karar":"yanlış","anlatim":"Madde metni üç sorumluluk türünü aynı cümlede birlikte sayar, disiplini dışarıda bırakmaz. Avukat için baro disiplin kovuşturması da açılabilir.","formul":"Şık D: birisi sana \u0027sadece hukuki ve cezai sorumluluk olur, disiplin bu işte uygulanmaz\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.14/1-2","karar":"doğru","anlatim":"Evet, m.14/1 tacirliği kurar, m.14/2 üç sorumluluğu aynı anda saklı tutar. Bu üçü birbirini dışlamaz, hep birlikte var olur.","formul":"Şık E: birisi sana \u0027avukat tacir sayılır ve hukuki, cezai, disiplin sorumluluğu birlikte saklı kalır\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Bu maddede tacirlik bir sonuç, sorumluluklar ise ek bir yaptırım zinciridir, biri diğerini yemez. Kendine hep şunu sor: madde \u0027sorumluluk saklıdır\u0027 derken kaç tür sorumluluğu aynı anda sayıyor?","doldur":[]}],"anahtar":[{"ornek":"sorumluluğu","kok":"soruml"},{"ornek":"izinsiz","kok":"izinsi"},{"ornek":"avukat","kok":"avukat"},{"ornek":"disipline","kok":"disipl"},{"ornek":"sayılır","kok":"sayılı"},{"ornek":"tacirlik","kok":"tacirl"}],"konuGiris":{"harita":"Ne zaman uygulanır: Resmî bir makamın izni gerekirken izin alınmadan ticari işletme işletildiğinde uygulanır. Nasıl değerlendirilir: Kişi izinsiz de olsa fiilen işletmeyi işlettiği için tacir sayılır. Nasıl sonuçlanır: Bu izinsizlik hukuki, cezai ve disipline ilişkin ayrı sorumlulukları saklı tutarak birlikte doğurur.","desen":"Sınav genelde \u0027izinsiz işletme tacir sayılır mı, sorumluluk kalkar mı\u0027 sorusuyla tuzak kurar; öğrenciler izinsizliğin tacirlik sıfatını da kaldırdığını sanır. Bu iki dönemde çıkmıştır ve hep m.14\u0027ün ikinci fıkrasındaki \u0027sorumluluk saklıdır\u0027 ifadesi atlanır. Bu soru Türk Ticaret Kanunu m.14 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"izinsiz de olsa ticari işletmeyi fiilen işleten kişinin tacir kabul edilmesi","ad":"tacir sayılma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"bazı işletmelerin faaliyeti için resmî makamdan alınması gereken onay","ad":"resmî makam izni","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"izinsiz işletmenin meslek kuruluşunca ayrıca cezalandırılabilmesi","ad":"disiplin sorumluluğu","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"tacir sayılmanın diğer hukuki ve cezai yaptırımları ortadan kaldırmaması","ad":"sorumlulukların saklı kalması","kim":"kanun sabitler"}],"sinavda":"Soru, izinsiz işletilen bir işletmenin sahibinin hukuki durumunu ve buna bağlı sorumlulukların devam edip etmediğini sorar.","panel_ornek":"Bir arkadaşın, ehliyeti olmadan minibüs kullanıp yolcu taşımacılığı yapıyor. Ehliyetsiz olması onun trafiğe çıkmasını hukuken meşru yapmaz ama yine de fiilen o işi yaptığı, yani bir \u0027işletmeci\u0027 gibi davrandığı gerçeğini değiştirmez; üstelik hem trafik cezası hem de başka bir yasal sorumluluk aynı anda doğar.","ornek":"Bir arkadaşın, ehliyeti olmadan minibüs kullanıp yolcu taşımacılığı yapıyor. Ehliyetsiz olması onun trafiğe çıkmasını hukuken meşru yapmaz ama yine de fiilen o işi yaptığı, yani bir \u0027işletmeci\u0027 gibi davrandığı gerçeğini değiştirmez; üstelik hem trafik cezası hem de başka bir yasal sorumluluk aynı anda doğar.","yontemler":"Metni okurken \u0027tacir sayılır\u0027 ile \u0027sorumluluk saklıdır\u0027 ifadelerini ayrı ayrı işaretle; ikisinin birbirini geçersiz kılmadığını unutma.","nedir":"Bu konu, izin gerektiren bir işi izinsiz yapan kişinin tacir sayılıp sayılmayacağını ve bunun doğurduğu ayrı sorumlulukları düzenler. Sınav, izinsiz işletmenin tacirlik sıfatına etkisini ve saklı kalan sorumluluk türlerini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Geçersizlik Tuzağı","metin":"İzin eksikliğinin işlemi hükümsüz kılacağını ve hiçbir sonuç doğurmayacağını sanırsın. Doğrusu: Kanun, izinsizliği işlemi geçersiz kılan değil ek sorumluluk doğuran bir hal olarak düzenler."},"A":{"ad":"Ayrık Sonuç Tuzağı","metin":"İzinsiz işletmenin yalnız tacirlik sonucu doğurduğunu, disiplin boyutunun izinsizlikle birlikte düştüğünü sanırsın. Doğrusu: Tacirlik sonucu ile disiplin sorumluluğu birbirini etkilemez, ikisi de birlikte doğar."},"D":{"ad":"Kısmi Sorumluluk Tuzağı","metin":"\u0027Saklıdır\u0027 ibaresini yalnız hukuki ve cezai sorumluluğa özgü sanıp disiplin boyutunu dışarıda bırakırsın. Ne soruluyor: kural, üç sorumluluk türünü birlikte anar. Kural: 213 sayılı gibi tek tip değil, Türk Ticaret Kanunu m.14/2 üç sorumluluğu birlikte saklı tutar. Doğrusu: Disipline ilişkin sorumluluk da hukuki ve cezai sorumlulukla birlikte saklıdır."},"B":{"ad":"Tek Sonuç Tuzağı","metin":"İzinsiz işletmenin yalnız disiplin kovuşturmasına yol açtığını, tacirlik sonucunu ise ortadan kaldırdığını sanırsın. Doğrusu: İzinsiz işleten kişi yine de tacir sayılır, bu husus tartışmasızdır."}},"celdiriciYol":{},"hap":"Türk Ticaret Kanunu m.14\u0027e göre izinsiz ticari işletme işleten kişi yine tacir sayılır ve bu fiilin hukuki, cezai ve disipline ilişkin sorumluluğu birlikte saklı kalır.","teshis":{"C":{"gercek":"Kanun izinsizliği geçersizlik değil, ek sorumluluk sebebi olarak düzenler; tacirlik ve sorumluluklar birlikte doğar.","ayirt":"Madde işlemi \u0027yok sayıyor\u0027 mu, yoksa ona ek sonuç mu bağlıyor?","paragraf":"m.14/1-2","yanilgi":"İznin işlemin geçerlilik şartı olduğunu, eksikliğinde tüm hukuki sonuçların ortadan kalkacağını sanıyorsun."},"E":{"gercek":"Türk Ticaret Kanunu m.14/2 hukuki, cezai ve disipline ilişkin sorumlulukların birlikte ve bağımsız şekilde saklı kaldığını düzenler.","ayirt":"Madde \u0027sorumluluk saklıdır\u0027 derken bunu tekil mi çoğul mu düzenliyor?","paragraf":"m.14/1-2","yanilgi":"Bu şıkkı eleyen öğrenci, üç sorumluluk türünün aynı anda var olamayacağını, birinin diğerini dışlaması gerektiğini düşünür."},"A":{"gercek":"Türk Ticaret Kanunu m.14/2 tam tersine izinsizliğin kendisini disiplin sorumluluğunun kaynağı sayar.","ayirt":"Sorumluluk izin eksikliğine rağmen mi, yoksa izin eksikliği yüzünden mi doğuyor?","paragraf":"m.14/2","yanilgi":"Disiplin sorumluluğunun ancak izin alınmışsa gündeme geleceğini, izinsizlik halinde bu sorumluluğun düşeceğini düşünüyorsun."},"D":{"gercek":"Madde metni üç sorumluluk türünü aynı cümlede ve aynı düzeyde birlikte sayar, aralarında öncelik sırası kurmaz.","ayirt":"Madde cümlesinde kaç tür sorumluluk birlikte sayılıyor?","paragraf":"m.14/2","yanilgi":"\u0027Saklıdır\u0027 ibaresinin yalnız hukuki ve cezai sorumluluğu kapsadığını, disiplin boyutunun ayrı bir rejime tabi olduğunu sanıyorsun."},"B":{"gercek":"Türk Ticaret Kanunu m.14/1 izinsiz işletenin de tacir sayılacağını açıkça düzenler; tacirlik bir yaptırım değil kanuni sonuçtur.","ayirt":"Tacirlik sıfatı bir ödül müdür, yoksa fiilin doğal sonucu müdür?","paragraf":"m.14/1","yanilgi":"Tacirlik sıfatının izinli çalışmaya bağlı bir ödül olduğunu, izinsiz işleten kişinin bu sıfatı kazanamayacağını sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 101"},"kural":"3568 sayılı Kanunun 4/d maddesi zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, aklama ve kaçakçılık suçlarını sınırlı şekilde sayar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 101","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklardaki suçları madde 4/d\u0027nin sayma cümlesiyle tek tek eşleştir; listede ismi geçmeyen tek şık cevaptır.","konu":"meslek mensubu olma engelleri","tablo":{"satirlar":[["A) Hırsızlık","m.4/d","doğru ifade"],["B) Sahtecilik","m.4/d","doğru ifade"],["C) Kasten yaralama","m.4/d","YANLIŞ ifade"],["D) Rüşvet","m.4/d","doğru ifade"],["E) Güveni kötüye kullanma","m.4/d","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kasten yaralama","E":"Güveni kötüye kullanma","A":"Hırsızlık","D":"Rüşvet","B":"Sahtecilik"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıka
