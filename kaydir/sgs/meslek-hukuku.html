ar":"yanlış","anlatim":"Avukat izinsiz de olsa işletmeyi fiilen işlettiği için m.14/1 gereği tacir sayılır. Tacirlik bir ödül değil, fiilin doğal sonucudur.","formul":"Şık B: birisi sana \u0027disiplin cezası olur ama tacir sayılmaz\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.14/1-2","karar":"yanlış","anlatim":"Kanun izinsizliği geçersizlik sebebi yapmaz, tam tersine hem tacirlik hem sorumluluk ekler. Avukat yine tacir sayılır ve sorumluluğu vardır.","formul":"Şık C: birisi sana \u0027izin olmadığı için işlem geçersiz, ne tacirlik ne sorumluluk doğar\u0027 diyor, katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.14/2","karar":"yanlış","anlatim":"Madde metni üç sorumluluk türünü aynı cümlede birlikte sayar, disiplini dışarıda bırakmaz. Avukat için baro disiplin kovuşturması da açılabilir.","formul":"Şık D: birisi sana \u0027sadece hukuki ve cezai sorumluluk olur, disiplin bu işte uygulanmaz\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.14/1-2","karar":"doğru","anlatim":"Evet, m.14/1 tacirliği kurar, m.14/2 üç sorumluluğu aynı anda saklı tutar. Bu üçü birbirini dışlamaz, hep birlikte var olur.","formul":"Şık E: birisi sana \u0027avukat tacir sayılır ve hukuki, cezai, disiplin sorumluluğu birlikte saklı kalır\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Bu maddede tacirlik bir sonuç, sorumluluklar ise ek bir yaptırım zinciridir, biri diğerini yemez. Kendine hep şunu sor: madde \u0027sorumluluk saklıdır\u0027 derken kaç tür sorumluluğu aynı anda sayıyor?","doldur":[]}],"anahtar":[{"ornek":"sorumluluğu","kok":"soruml"},{"ornek":"izinsiz","kok":"izinsi"},{"ornek":"avukat","kok":"avukat"},{"ornek":"disipline","kok":"disipl"},{"ornek":"sayılır","kok":"sayılı"},{"ornek":"tacirlik","kok":"tacirl"}],"konuGiris":{"harita":"Ne zaman uygulanır: Resmî bir makamın izni gerekirken izin alınmadan ticari işletme işletildiğinde uygulanır. Nasıl değerlendirilir: Kişi izinsiz de olsa fiilen işletmeyi işlettiği için tacir sayılır. Nasıl sonuçlanır: Bu izinsizlik hukuki, cezai ve disipline ilişkin ayrı sorumlulukları saklı tutarak birlikte doğurur.","desen":"Sınav genelde \u0027izinsiz işletme tacir sayılır mı, sorumluluk kalkar mı\u0027 sorusuyla tuzak kurar; öğrenciler izinsizliğin tacirlik sıfatını da kaldırdığını sanır. Bu iki dönemde çıkmıştır ve hep m.14\u0027ün ikinci fıkrasındaki \u0027sorumluluk saklıdır\u0027 ifadesi atlanır. Bu soru Türk Ticaret Kanunu m.14 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"izinsiz de olsa ticari işletmeyi fiilen işleten kişinin tacir kabul edilmesi","ad":"tacir sayılma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"bazı işletmelerin faaliyeti için resmî makamdan alınması gereken onay","ad":"resmî makam izni","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"izinsiz işletmenin meslek kuruluşunca ayrıca cezalandırılabilmesi","ad":"disiplin sorumluluğu","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"tacir sayılmanın diğer hukuki ve cezai yaptırımları ortadan kaldırmaması","ad":"sorumlulukların saklı kalması","kim":"kanun sabitler"}],"sinavda":"Soru, izinsiz işletilen bir işletmenin sahibinin hukuki durumunu ve buna bağlı sorumlulukların devam edip etmediğini sorar.","panel_ornek":"Bir arkadaşın, ehliyeti olmadan minibüs kullanıp yolcu taşımacılığı yapıyor. Ehliyetsiz olması onun trafiğe çıkmasını hukuken meşru yapmaz ama yine de fiilen o işi yaptığı, yani bir \u0027işletmeci\u0027 gibi davrandığı gerçeğini değiştirmez; üstelik hem trafik cezası hem de başka bir yasal sorumluluk aynı anda doğar.","ornek":"Bir arkadaşın, ehliyeti olmadan minibüs kullanıp yolcu taşımacılığı yapıyor. Ehliyetsiz olması onun trafiğe çıkmasını hukuken meşru yapmaz ama yine de fiilen o işi yaptığı, yani bir \u0027işletmeci\u0027 gibi davrandığı gerçeğini değiştirmez; üstelik hem trafik cezası hem de başka bir yasal sorumluluk aynı anda doğar.","yontemler":"Metni okurken \u0027tacir sayılır\u0027 ile \u0027sorumluluk saklıdır\u0027 ifadelerini ayrı ayrı işaretle; ikisinin birbirini geçersiz kılmadığını unutma.","nedir":"Bu konu, izin gerektiren bir işi izinsiz yapan kişinin tacir sayılıp sayılmayacağını ve bunun doğurduğu ayrı sorumlulukları düzenler. Sınav, izinsiz işletmenin tacirlik sıfatına etkisini ve saklı kalan sorumluluk türlerini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Geçersizlik Tuzağı","metin":"İzin eksikliğinin işlemi hükümsüz kılacağını ve hiçbir sonuç doğurmayacağını sanırsın. Doğrusu: Kanun, izinsizliği işlemi geçersiz kılan değil ek sorumluluk doğuran bir hal olarak düzenler."},"A":{"ad":"Ayrık Sonuç Tuzağı","metin":"İzinsiz işletmenin yalnız tacirlik sonucu doğurduğunu, disiplin boyutunun izinsizlikle birlikte düştüğünü sanırsın. Doğrusu: Tacirlik sonucu ile disiplin sorumluluğu birbirini etkilemez, ikisi de birlikte doğar."},"D":{"ad":"Kısmi Sorumluluk Tuzağı","metin":"\u0027Saklıdır\u0027 ibaresini yalnız hukuki ve cezai sorumluluğa özgü sanıp disiplin boyutunu dışarıda bırakırsın. Ne soruluyor: kural, üç sorumluluk türünü birlikte anar. Kural: 213 sayılı gibi tek tip değil, Türk Ticaret Kanunu m.14/2 üç sorumluluğu birlikte saklı tutar. Doğrusu: Disipline ilişkin sorumluluk da hukuki ve cezai sorumlulukla birlikte saklıdır."},"B":{"ad":"Tek Sonuç Tuzağı","metin":"İzinsiz işletmenin yalnız disiplin kovuşturmasına yol açtığını, tacirlik sonucunu ise ortadan kaldırdığını sanırsın. Doğrusu: İzinsiz işleten kişi yine de tacir sayılır, bu husus tartışmasızdır."}},"celdiriciYol":{},"hap":"Türk Ticaret Kanunu m.14\u0027e göre izinsiz ticari işletme işleten kişi yine tacir sayılır ve bu fiilin hukuki, cezai ve disipline ilişkin sorumluluğu birlikte saklı kalır.","teshis":{"C":{"gercek":"Kanun izinsizliği geçersizlik değil, ek sorumluluk sebebi olarak düzenler; tacirlik ve sorumluluklar birlikte doğar.","ayirt":"Madde işlemi \u0027yok sayıyor\u0027 mu, yoksa ona ek sonuç mu bağlıyor?","paragraf":"m.14/1-2","yanilgi":"İznin işlemin geçerlilik şartı olduğunu, eksikliğinde tüm hukuki sonuçların ortadan kalkacağını sanıyorsun."},"E":{"gercek":"Türk Ticaret Kanunu m.14/2 hukuki, cezai ve disipline ilişkin sorumlulukların birlikte ve bağımsız şekilde saklı kaldığını düzenler.","ayirt":"Madde \u0027sorumluluk saklıdır\u0027 derken bunu tekil mi çoğul mu düzenliyor?","paragraf":"m.14/1-2","yanilgi":"Bu şıkkı eleyen öğrenci, üç sorumluluk türünün aynı anda var olamayacağını, birinin diğerini dışlaması gerektiğini düşünür."},"A":{"gercek":"Türk Ticaret Kanunu m.14/2 tam tersine izinsizliğin kendisini disiplin sorumluluğunun kaynağı sayar.","ayirt":"Sorumluluk izin eksikliğine rağmen mi, yoksa izin eksikliği yüzünden mi doğuyor?","paragraf":"m.14/2","yanilgi":"Disiplin sorumluluğunun ancak izin alınmışsa gündeme geleceğini, izinsizlik halinde bu sorumluluğun düşeceğini düşünüyorsun."},"D":{"gercek":"Madde metni üç sorumluluk türünü aynı cümlede ve aynı düzeyde birlikte sayar, aralarında öncelik sırası kurmaz.","ayirt":"Madde cümlesinde kaç tür sorumluluk birlikte sayılıyor?","paragraf":"m.14/2","yanilgi":"\u0027Saklıdır\u0027 ibaresinin yalnız hukuki ve cezai sorumluluğu kapsadığını, disiplin boyutunun ayrı bir rejime tabi olduğunu sanıyorsun."},"B":{"gercek":"Türk Ticaret Kanunu m.14/1 izinsiz işletenin de tacir sayılacağını açıkça düzenler; tacirlik bir yaptırım değil kanuni sonuçtur.","ayirt":"Tacirlik sıfatı bir ödül müdür, yoksa fiilin doğal sonucu müdür?","paragraf":"m.14/1","yanilgi":"Tacirlik sıfatının izinli çalışmaya bağlı bir ödül olduğunu, izinsiz işleten kişinin bu sıfatı kazanamayacağını sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 104"},"kural":"3568 sayılı Kanunun 12 nci maddesinin son fıkrası, tasdikten doğan mali sorumluluk ile disiplin sorumluluğunun ayrı ayrı müstakil raporla tespitini ve bu kapsamda yazılı savunma istenmesini emreder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 104","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Aynı fıkrada iki şart geçiyorsa (rapor ayrılığı + savunma) şıkları ikisini de karşılayıp karşılamadığına göre tek tek ele.","konu":"disiplin kovusturmasi","tablo":{"satirlar":[["A) Disiplin kovuşturması yapılması konusunda karar verecek …","m.50/1-k","YANLIŞ ifade"],["B) Haksız Rekabet ve Reklam Yasağı Yönetmeliği hükümlerine …","Haksız Rekabet ve Reklam Yasağı Yön. m.32","YANLIŞ ifade"],["C) Yeminli mali müşavirlerin tasdikten doğan mali sorumlulu…","3568 s.K. m.12/son fıkra","YANLIŞ ifade"],["D) Yeminli mali müşavir hakkında sorumluluk raporu düzenlen…","3568 s.K. m.12/son fıkra","YANLIŞ ifade"],["E) Yeminli mali müşavirlerin tasdikten doğan mali sorumlulu…","3568 s.K. m.12/son fıkra","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları tek bir raporda birlikte tespit edilir ve bu kapsamda yazılı savunma alınmasına gerek yoktur.","E":"Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları ayrı ayrı müstakil bir raporla tespit edilir; bu kapsamda yeminli mali müşavirin yazılı savunması istenir.","A":"Disiplin kovuşturması yapılması konusunda karar verecek merci ile disiplin cezalarını vermeye yetkili merciler, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununda doğrudan sayılmıştır.","D":"Yeminli mali müşavir hakkında sorumluluk raporu düzenlenebilmesi için ilgilinin yazılı savunmasının istenmesi zorunlu değildir, rapor doğrudan yazılabilir.","B":"Haksız Rekabet ve Reklam Yasağı Yönetmeliği hükümlerine aykırılık, odalarca ancak ilgilinin şikayeti üzerine soruşturma konusu yapılabilir; resen soruşturma başlatılamaz."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.12 [1/2]","metin":"Madde 12 – Yeminli mali müşavirler gerçek ve tüzelkişilerin veya bunların teşebbüs ve işletmelerinin mali tablolarının ve beyannamelerinin mevzuat hükümleri, muhasebe prensipleri ile muhasebe standartlarına uygunluğunu ve hesapların denetim standartlarına göre incelediğini tasdik ederler. Yeminli mali müşavirlerin tasdik edecekleri belgeler, tasdik konuları ile tasdike ilişkin usul ve esaslar; gerçek ve tüzelkişilerin mükellefiyet şekilleri, iş kolları ve ciroları, döviz kazandırıcı işlemleri, ithalat ve ihracatları, yatırımın miktarları ve nevileri ile belgelerin ibraz edileceği merciler esas alınmak suretiyle Maliye Bakanlığınca çıkarılacak yönetmeliklerle belirlenir. Kanunları gereğince, kamu kurum ve kuruluşlarına verilen tasdik edilmiş mali tablolar, kamu idaresinin yetkili memurlarınca, tasdikin kapsamı ölçüsünde incelenmiş bir belge olarak kabul edilir. Ancak, çeşitli kanunlarla kamu idaresine tanınan teftiş ve inceleme yetkilerinin kullanılmasına ve gerektiğinde tekrarına ait hususlar saklıdır. Yeminli mali müşavirler yaptıkları tasdikin doğruluğundan sorumludurlar. Yaptıkları tasdikin doğru olmaması halinde, tasdikin kapsamı ile sınırlı olmak üzere, ziyaa uğratılan vergilerden ve kesilecek cezalardan mükellefle birlikte müştereken ve müteselsilen sorumlu olurlar. Yeminli mali müşavirler yaptıkları tasdikin kapsamını düzenleyecekleri raporda açıkca belirtirler. (Ek fıkra: 10/9/2014-6552/107 md.) Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları ayrı ayrı müstakil bir rapor ile tespit edilir. Bu kapsamda yeminli mali müşavir ha…"},{"ad":"SMMM K. (3568 s.K.) m.12 [2/2]","metin":"Savunma isteme yazısının tebliğ tarihinden itibaren otuz gün içinde savunma yapılmaması durumunda ilgili yeminli mali müşavir savunma hakkından vazgeçmiş sayılır. Bu Kanun hükümlerine göre meslek icra edenlerin vergi kanunları ve diğer kanunlardaki sorumlulukları saklıdır. Meslekle ilgili konularda çalıştırılmayacak olanlar"}],"hakem":"3568 s.K. m.12/son fıkrası kaynakta açıkça, tasdikten doğan mali sorumluluk ile disiplin sorumluluğunun ayrı ayrı müstakil rapor ile tespitini ve yazılı savunma istenmesini emretmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Mali sorumluluk ile disiplin sorumluluğu ayrı ayrı iki raporda tespit edilir ve her iki durumda da yazılı savunma istenir.","A":"Disiplin kovuşturmasında karar verecek merci ve ceza yetkisi doğrudan bu kanunda belirtilmemiştir; kanun yalnız yönetmelik çıkarılmasına yetki verir.","D":"Sorumluluk raporu yazılmadan önce yeminli mali müşavire yazılı savunma istenmek kanunun zorunlu kuralıdır; savunmasız rapor yazılamaz.","B":"Haksız reklamlara karşı soruşturma hem şikayet üzerine hem de odaların kendi başlatmasıyla yapılabilir, sadece şikayetle sınırlı değildir."},"dogru":"Yeminli mali müşavirin para cezasıyla ilgili sorumluluğu ve disiplin cezasıyla ilgili sorumluluğu iki ayrı raporda gösterilir. Her iki raporun yapılması için yeminli mali müşavire yazılı savunma hakkı verilmesi şarttır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 12. madde","kavramlar":[{"kaynak":"SMMM K. 12. madde","tanim":"Yeminli mali müşavirin yaptığı tasdikin doğru olmaması nedeniyle mükellefle birlikte vergi zararı ve cezasından sorumlu olması durumudur.","ad":"Mali sorumluluk"},{"kaynak":"SMMM K. 12. madde","tanim":"Sorumluluk raporu yazılmadan önce yeminli mali müşavire kendisine yönelik iddialar hakkında yazılı olarak açıklama yapma hakkı verilmesidir.","ad":"Yazılı savunma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2020/3"]},"oyun":null,"tip":"teori","soru":"Yeminli mali müşavirlerin disiplin kovuşturmasına ilişkin usul ve esaslara göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-07","verilenler":[],"dayanak":"3568 s.K. m.12/son fıkra; m.50/1-k; Haksız Rekabet ve Reklam Yasağı Yön. m.32","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ahmet Bey, yeminli mali müşavir; 2019 yılında bir inşaat şirketinin mali tablolarını tasdik etmiş. Sonradan Maliye Bakanlığı incelemesinde 850.000 TL vergi ziyaına yol açan hatalı tasdik tespit edilmiş, aynı zamanda mesleki dürüstlüğe aykırı davranış iddiası da gündeme gelmiş.","anlatim":"Şimdi Ahmet Bey hakkında iki ayrı iddia var: biri tasdikten doğan mali sorumluluk, öteki disiplin. İkisi tek olayda birleşiyor ama kanun ikisine ayrı davranıyor.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun m.12 son fıkrasına göre Ahmet Bey\u0027in iki sorumluluğu ayrı ayrı müstakil raporla tespit edilecek, ayrıca sorumluluk raporu yazılmadan önce Ahmet Bey\u0027in yazılı savunması istenecek.","anlatim":"Beş ifadeyi bu olayda tek tek deneyeceğiz: hangisi Ahmet Bey\u0027in durumunu doğru anlatıyor?","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.50/1-k","karar":"yanlış","anlatim":"Hayır, Kanun m.50/1-k bu merci ve usul işini yönetmeliğe bırakıyor. Kanun sadece çerçeve çiziyor, ismen saymıyor.","formul":"Şık A: birisi sana \u0027Ahmet Bey hakkında kimin karar vereceği, disiplin cezasını kimin vereceği Kanunun kendi metninde tek tek sayılmış\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Haksız Rekabet ve Reklam Yasağı Yön. m.32","karar":"yanlış","anlatim":"Hayır, Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.32 odaya hem resen hem şikayetle soruşturma açma yetkisi veriyor. Şikayet şart değil.","formul":"Şık B: Ahmet Bey\u0027in haksız rekabet yaptığı iddiası varsa, oda ancak birisi şikayet ederse mi harekete geçebilir?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"3568 s.K. m.12/son fıkra","karar":"yanlış","anlatim":"Hayır, m.12 son fıkra iki sorumluluğu ayrı müstakil raporla ister; savunma da şart, atlanamaz.","formul":"Şık C: müfettiş \u0027ikisini tek raporda toplayalım, savunma almaya gerek yok\u0027 derse, doğru mu olur?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"3568 s.K. m.12/son fıkra","karar":"yanlış","anlatim":"Hayır, Kanun açıkça sorumluluk raporu yazılabilmesini yazılı savunmanın istenmesi şartına bağlıyor. Savunma istenmeden yazılan rapor usulsüz olur.","formul":"Şık D: birisi \u0027savunma istemeden de sorumluluk raporu yazılabilir\u0027 derse, buna katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"3568 s.K. m.12/son fıkra","karar":"doğru","anlatim":"Evet, tam da m.12 son fıkranın emrettiği şey bu: ayrı müstakil rapor artı yazılı savunma şartı. İkisi birlikte gerçekleşmeli.","formul":"Şık E: Ahmet Bey için mali sorumluluk raporu ile disiplin raporu ayrı ayrı yazılıp, rapor yazılmadan önce kendisinden yazılı savunma istenirse usule uygun mu olur?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Tek doğru cümle şu: iki sorumluluk ayrı raporla tespit edilir ve savunma mutlaka istenir. Kendine hep şunu sor: bu şıkta hem \u0027ayrı rapor\u0027 hem \u0027savunma istendi\u0027 ikisi birden var mı?","doldur":[]}],"anahtar":[{"ornek":"sorumluluğu","kok":"soruml"},{"ornek":"savunması","kok":"savunm"},{"ornek":"raporla","kok":"raporl"},{"ornek":"yazılı","kok":"yazılı"},{"ornek":"müstakil","kok":"müstak"},{"ornek":"istenmesini","kok":"istenm"}],"konuGiris":{"harita":"Ne zaman savunma istenir: yeminli mali müşavir hakkında sorumluluk raporu yazılmadan önce yazılı savunması istenir. Nasıl süre işler: tebliğden itibaren otuz gün içinde savunma yapılmazsa savunma hakkından vazgeçilmiş sayılır. Nasıl kovuşturma merci belirlenir: disiplin kovuşturmasına karar verecek merci ve itiraz usulü kanunla değil yönetmelikle düzenlenir.","desen":"Sınav genelde otuz günlük savunma süresini veya bu sürenin geçirilmesinin sonucunu şık olarak sorar. Bir başka tuzak, disiplin kovuşturma merciinin kanunda değil yönetmelikle belirlendiğini karıştırmaktır. Bu soru m.12 ve m.50/k noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"tasdikten doğan mali ve disiplin sorumluluğunu ayrı ayrı tespit eden belge","ad":"sorumluluk raporu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"tebliğden itibaren otuz günlük yazılı savunma verme süresi","ad":"savunma süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"kovuşturmaya karar verecek ve ceza verecek yetkili kurul","ad":"disiplin kovuşturması mercii","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"disiplin cezasına karşı yapılacak itirazın şekil ve şartları","ad":"itiraz usulü","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soruda disiplin kovuşturması usulüne dair bir ifade verilir ve doğru/yanlış seçenek istenir.","panel_ornek":"Bir öğrenci okulda kurallara aykırı davrandığında önce ona 10 gün içinde yazılı savunma istenir, cevap gelmezse hakkından vazgeçmiş sayılır. Sonra okul disiplin kurulu dosyayı inceleyip karar verir. Süreç hep aynı sırayla işler: önce savunma, sonra karar.","ornek":"Bir öğrenci okulda kurallara aykırı davrandığında önce ona 10 gün içinde yazılı savunma istenir, cevap gelmezse hakkından vazgeçmiş sayılır. Sonra okul disiplin kurulu dosyayı inceleyip karar verir. Süreç hep aynı sırayla işler: önce savunma, sonra karar.","yontemler":"Savunma süresinin otuz gün olduğu ve bu sürenin geçmesiyle savunma hakkının düşeceği kuralı ezberlenmelidir.","nedir":"Yeminli mali müşavirlerin tasdik faaliyeti nedeniyle disiplin sorumluluğunun nasıl işletileceğini düzenleyen usuldür. Sınav, savunma süresi ve kararı verecek merciin kanunda mı yönetmelikte mi belirlendiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Çift Katman Atlama Tuzağı","metin":"Öğrenci hem rapor birliğini hem savunma şartının yokluğunu aynı anda kabul ederek iki farklı kuralı birden yanlış kurar. Doğrusu: 3568 sayılı Kanunun 12 nci maddesinin son fıkrasına göre iki sorumluluk ayrı ayrı müstakil raporla tespit edilir ve savunma istenir."},"A":{"ad":"Merci Tuzağı","metin":"Öğrenci disiplin kovuşturmasına ilişkin merci ve usul kurallarının Kanunun kendisinde sayıldığını sanır. Doğrusu: 3568 sayılı Kanunun 50 nci maddesinin birinci fıkrasının (k) bendine göre bu husus çıkarılacak yönetmelikle düzenlenir, Kanun yalnız yetki verir."},"D":{"ad":"Savunma Şartı Tuzağı","metin":"Öğrenci rapor ayrılığını doğru bilse de savunma alınmasının zorunlu olmadığını düşünür. Doğrusu: Sorumluluk raporu yazılabilmesi için yeminli mali müşavirin yazılı savunmasının istenmesi Kanunda açıkça şart koşulmuştur."},"B":{"ad":"Eksik Okuma Tuzağı","metin":"Öğrenci maddedeki iki seçenekten yalnız birini, şikayeti, hatırlar ve resen başlatmayı gözden kaçırır. Doğrusu: Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.32 uyarınca soruşturma odalarca resen veya şikayet üzerine başlatılır."}},"celdiriciYol":{},"hap":"Yeminli mali müşavirin tasdikten doğan mali sorumluluğu ile disiplin sorumluluğu ayrı müstakil raporla tespit edilir ve rapor öncesi yazılı savunması istenir.","teshis":{"C":{"gercek":"3568 s.K. m.12 son fıkra iki sorumluluğu ayrı müstakil raporlarla tespit eder ve sorumluluk raporu için yazılı savunma şartı koşar.","ayirt":"Rapor tek mi ayrı mı, savunma isteniyor mu istenmiyor mu - iki soruyu birden sor kendine.","paragraf":"3568 s.K. m.12/son fıkra","yanilgi":"İki farklı sorumluluk türünün pratiklik gereği tek raporda toplanabileceğini ve savunmanın formalite olduğunu düşünüyorsun."},"E":{"gercek":"3568 s.K. m.12 son fıkra, iki katmanı birlikte kurar: ayrı müstakil rapor + yazılı savunma şartı.","ayirt":"Fıkrayı iki cümleye bölüp her ikisini de karşıladım mı?","paragraf":"3568 s.K. m.12/son fıkra","yanilgi":"Bu şıkkı eleyen öğrenci, rapor ayrılığı ile savunma şartının aynı fıkrada birlikte düzenlendiğini fark edemez, ikisinden birini eksik okur."},"A":{"gercek":"3568 sayılı Kanun m.50/1-k bu hususları düzenlemeyi yönetmeliğe bırakır; Kanun yalnız çerçeve çizer.","ayirt":"Bu kural Kanunun kendisinde mi, yoksa \u0027yönetmelikle düzenlenir\u0027 ibaresiyle mi geçiyor?","paragraf":"3568 s.K. m.50/1-k","yanilgi":"Disiplin kovuşturmasına ilişkin merci ve usul kurallarının Kanun metninde tek tek sayıldığını sanıyorsun."},"D":{"gercek":"Kanun, sorumluluk raporu yazılabilmesini yazılı savunmanın istenmesi şartına açıkça bağlamıştır.","ayirt":"Savunma istenmeden düzenlenen bir sorumluluk raporu usulüne uygun müdür?","paragraf":"3568 s.K. m.12/son fıkra","yanilgi":"Rapor ayrılığını doğru bilsen de savunmanın isteğe bağlı bir nezaket olduğunu sanıyorsun."},"B":{"gercek":"Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.32, odalara hem resen hem şikayet üzerine soruşturma başlatma yetkisi tanır.","ayirt":"Madde metninde \u0027resen veya\u0027 ibaresi var mı, yoksa yalnız \u0027şikayet üzerine\u0027 mi yazıyor?","paragraf":"Haksız Rekabet ve Reklam Yasağı Yön. m.32","yanilgi":"Disiplin soruşturmasının yalnızca şikayet üzerine başlayabileceğini, idarenin kendiliğinden harekete geçemeyeceğini sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 101"},"kural":"3568 sayılı Kanunun 4/d maddesi zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, aklama ve kaçakçılık suçlarını sınırlı şekilde sayar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 101","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklardaki suçları madde 4/d\u0027nin sayma cümlesiyle tek tek eşleştir; listede ismi geçmeyen tek şık cevaptır.","konu":"meslek mensubu olma engelleri","tablo":{"satirlar":[["A) Hırsızlık","m.4/d","doğru ifade"],["B) Sahtecilik","m.4/d","doğru ifade"],["C) Kasten yaralama","m.4/d","YANLIŞ ifade"],["D) Rüşvet","m.4/d","doğru ifade"],["E) Güveni kötüye kullanma","m.4/d","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kasten yaralama","E":"Güveni kötüye kullanma","A":"Hırsızlık","D":"Rüşvet","B":"Sahtecilik"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"}],"hakem":"3568 s.K. m.4/d\u0027de sınırlı sayılan engel suçlar listesinde kasten yaralama yer almamakta; bu suç ancak genel kural olan bir yıl veya daha fazla hapis cezası koşuluyla engel oluşturmaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Rüşvet kamu görevini istismar suçu olarak kanunun sınırlı listesinde sayılmış engel suçlarındandır.","E":"Güveni kötüye kullanma müşteri parasına veya varlıklarına ulaş vermekle ilgili olduğu için listede sayılan engel suçlarındandır.","A":"Hırsızlık kanunun engel suçları arasında açıkça yazılıdır; affa uğrasa dahi meslek mensubu olmaya engel olur.","B":"Sahtecilik, muhasebeci mesleğinin saygınlığını tehdit ettiği için engel suçlar listesinde yer alır."},"dogru":"Kanun muhasebe mesleğine engel suçları sınırlı sayıyla listeler: zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas ve diğerleri. Kasten yaralama bu listeye yazılmamıştır, dolayısıyla engel suç değildir.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 4. madde (d) bendinde sayılan engel suçlar arasında kasten yaralama bulunmamaktadır.","kavramlar":[{"kaynak":"SMMM K. 4. madde","tanim":"Kasten işlenmiş ve bir yıl veya daha fazla hapis cezasına ya da affa uğramış olsa dahi, muhasebe mesleği mensubu olmayı yasaklayan suçlar; kanun bu suçları sınırlı şekilde sayar.","ad":"Engel suç"},{"kaynak":"SMMM K. 4. madde","tanim":"Mahkûmiyeti sonradan kaldırılmış ve ceza soruşturma süresi geçmiş olsa dahi, engel suçlar kategorisine girerse meslek mensubu olmayı engeller.","ad":"Affa uğramış suç"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2017/3"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre, kasten işlenmiş olması koşuluyla affa uğramış olsa dahi meslek mensubu olmaya engel suçlar arasında aşağıdakilerden hangisi sayılmamıştır?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-08","verilenler":[],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.4/d","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bursa\u0027da bir SMMM adayı olan Kerem, 2015 yılında sahtecilik suçundan hüküm giymiş, cezası affa uğramış. 2023\u0027te staj bitirme sınavını kazanmış, ruhsat başvurusu yapıyor.","anlatim":"Oda, Kerem\u0027in geçmişindeki suçu inceliyor. Affa uğramış olması onu kurtarır mı, kurtarmaz mı diye bakılıyor.","doldur":[]},{"formul":"Ne yapacağız: Kanunun m.4/d bendi, affa uğrasa bile mesleğe engel olan suçları tek tek sayıyor: zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat, edimin ifasına fesat, aklama, kaçakçılık. Kerem\u0027in sahteciliği bu listede mi, önce onu göreceğiz. Şimdi beş şıkkı bu olayın yerine koyup tek tek deneyeceğiz.","anlatim":"Her şıkta Kerem\u0027in suçu o suç olsaydı ruhsat engellenir miydi diye soracağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.4/d","karar":"doğru","anlatim":"Hayır, çünkü m.4/d hırsızlığı isim isim sayıyor. Affa uğrasa bile bu suç engel oluşturmaya devam eder.","formul":"Şık A: Kerem\u0027in suçu sahtecilik değil de hırsızlık olsaydı, affa uğramış olması onu kurtarır mıydı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.4/d","karar":"doğru","anlatim":"Evet, engel olur; çünkü sahtecilik maddede açıkça sayılan suçlardan biridir. Kerem\u0027in başvurusu bu yüzden reddedilir.","formul":"Şık B: Kerem\u0027in gerçek suçu olan sahtecilik, affa uğramasına rağmen ruhsatına engel olur mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.4/d","karar":"yanlış","anlatim":"Hayır, çünkü m.4/d bu suçu isim isim saymaz. Ancak ceza bir yıl veya üzeri hapis olsaydı genel şarttan engel doğabilirdi, o başka bir kapı.","formul":"Şık C: Kerem\u0027in suçu sahtecilik değil de kasten yaralama olsaydı, affa uğramış olsa bile tek başına ruhsatına engel olur muydu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.4/d","karar":"doğru","anlatim":"Hayır, kurtarmaz; rüşvet de m.4/d\u0027nin isim verdiği suçlardan biridir. Affa uğrasa dahi başvurusu reddedilir.","formul":"Şık D: Kerem\u0027in suçu rüşvet olsaydı, affa uğramış olması onu kurtarır mıydı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.4/d","karar":"doğru","anlatim":"Hayır, kurtarmaz; bu suç da m.4/d\u0027nin sayma cümlesinde açıkça yazar. Affa uğrasa bile engel devam eder.","formul":"Şık E: Kerem\u0027in suçu güveni kötüye kullanma olsaydı, affa uğramış olması onu kurtarır mıydı?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Doğru cevap C, çünkü kasten yaralama m.4/d\u0027nin isim isim saydığı suçlar arasında değil. Kendine hep şunu sor: bu suç maddenin sayma cümlesinde geçiyor mu, yoksa yalnızca genel bir yıl hapis şartına mı tabi?","doldur":[]}],"anahtar":[{"ornek":"suçları","kok":"suçlar"},{"ornek":"kurtarır","kok":"kurtar"},{"ornek":"uğrasa","kok":"uğrasa"},{"ornek":"biridir","kok":"biridi"},{"ornek":"sayılı","kok":"sayılı"},{"ornek":"reddedilir","kok":"redded"}],"konuGiris":{"harita":"Ne zaman test edilir: Meslek mensubu olma başvurusunda genel şartların taşınıp taşınmadığı incelenirken test edilir. Nasıl ölçülür: Kanunda sayılan suç listesiyle adayın mahkûmiyet geçmişi karşılaştırılarak ölçülür. Nasıl kaydedilir: Şartları taşımayan kişinin başvurusu reddedilerek veya mesleğe kabul edilmeyerek kayda geçer.","desen":"Sınav bu konuyu, kanunda sayılan suç listesine benzer ama listede olmayan bir suçu şıklardan birine gizleyerek sorar. Tuzak, hırsızlık, rüşvet, zimmet gibi gerçek listedeki suçlarla dikkat dağıtıp listede olmayan bir suçu (örneğin basit yaralama) doğru cevap yapmasıdır. Bu soru m.4/d fıkrasındaki sayılı suçlar listesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubu olmak için herkeste aranan temel nitelikler bütünü","ad":"Genel şartlar","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Failin bilerek ve isteyerek gerçekleştirdiği suç türü","ad":"Kasten işlenen suç","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Af çıksa dahi mesleğe girişi kalıcı olarak engelleyen sayılı suç grubu","ad":"Affa uğramış olsa bile engel sayılan suçlar","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin belirli kamusal hak ve yetkileri kullanamama durumu","ad":"Kamu haklarından mahrumiyet","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda meslek mensubu olmaya engel suçlar sayılır ve bunlardan hangisinin listede olmadığı sorulur.","panel_ornek":"Bir spor kulübüne üye olmak istiyorsun ama tüzükte \u0027disiplinden ihraç edilenler üye olamaz\u0027 yazıyor; sicilin temiz olsa bile bazı geçmiş olaylar seni kalıcı olarak dışarıda bırakabilir. Mesela kulüpten 3 yıl önce disiplin kararıyla çıkarılmışsan, aradan 3 yıl geçmiş olması seni kurtarmaz. Kanun bazı durumları \u0027affa rağmen geçerli engel\u0027 sayar, işte bu soru da böyle bir listeyle ilgili.","ornek":"Bir spor kulübüne üye olmak istiyorsun ama tüzükte \u0027disiplinden ihraç edilenler üye olamaz\u0027 yazıyor; sicilin temiz olsa bile bazı geçmiş olaylar seni kalıcı olarak dışarıda bırakabilir. Mesela kulüpten 3 yıl önce disiplin kararıyla çıkarılmışsan, aradan 3 yıl geçmiş olması seni kurtarmaz. Kanun bazı durumları \u0027affa rağmen geçerli engel\u0027 sayar, işte bu soru da böyle bir listeyle ilgili.","yontemler":"Kanundaki sayılı suç listesini ezbere bilmek gerekir; listede olmayan tek şık doğru cevaptır.","nedir":"Bu konu, bir kişinin meslek mensubu (SMMM) olabilmesi için taşıması gereken şartları ve hangi hallerin bu mesleğe girişi engellediğini anlatır. Sınav, hangi suçların affa uğrasa dahi engel sayıldığını ayırt etmeni ölçer."},"olay":"","tuzak":{"D":{"ad":"Rüşvet Tuzağı","metin":"Sayılan suçların çokluğu içinde bu suçun listede olmadığını zannediyorsun. Doğrusu: Rüşvet, madde 4/d\u0027de açıkça sayılan engel suçlardandır."},"E":{"ad":"Güveni Kötüye Kullanma Tuzağı","metin":"Daha az bilinen bir suç olduğu için listede yer almadığını düşünüyorsun. Doğrusu: Güveni kötüye kullanma da madde 4/d\u0027nin sayılı suçları arasındadır."},"A":{"ad":"Hırsızlık Tuzağı","metin":"Kanunda sayılan suçlardan birini gördüğün için bunun listede olmadığını düşünüyorsun. Doğrusu: Hırsızlık, madde 4/d\u0027de affa uğrasa dahi engel sayılan suçlar arasında açıkça yer alır."},"B":{"ad":"Sahtecilik Tuzağı","metin":"Meslekle bağdaşmayan bir eylem olduğu için listede olmadığını sanıyorsun. Doğrusu: Sahtecilik, kanunun saydığı engel suçlar arasındadır."}},"celdiriciYol":{},"hap":"3568 sayılı Kanunun 4/d maddesi affa uğrasa dahi engel sayılan suçları sınırlı biçimde sayar; sayılmayan bir suç ancak bir yıl ve üzeri hapis cezası şartıyla engel oluşturur.","teshis":{"C":{"gercek":"Madde 4/d sınırlı sayıda suç sayar; kasten yaralama bu sayılı suçlar arasında değildir, ancak genel şart olan bir yıl ve üzeri hapis cezası gerçekleşirse ayrı bir yoldan engel oluşturabilir.","ayirt":"Bu suç madde 4/d\u0027nin isim isim saydığı suçlar arasında mı, yoksa yalnızca genel hapis cezası şartına mı tabi?","paragraf":"m.4/d","yanilgi":"Bu şıkkı elerken \u0027ağır bir suç, mutlaka listededir\u0027 diye düşünüyorsun."},"E":{"gercek":"Madde 4/d güveni kötüye kullanmayı açıkça sayılan suçlar arasına koyar.","ayirt":"Bu suç madde 4/d\u0027nin sayma cümlesinde geçiyor mu?","paragraf":"m.4/d","yanilgi":"Güveni kötüye kullanmanın listede yer almadığını düşünüyorsun."},"A":{"gercek":"Madde 4/d hırsızlığı açıkça sayar; affa uğramış olsa dahi engel oluşturur.","ayirt":"Bu suç madde 4/d\u0027nin sayma cümlesinde geçiyor mu?","paragraf":"m.4/d","yanilgi":"Hırsızlığın listede geçmediğini sanıyorsun."},"D":{"gercek":"Madde 4/d rüşveti açıkça sayılan suçlar arasına koyar.","ayirt":"Bu suç madde 4/d\u0027nin sayma cümlesinde geçiyor mu?","paragraf":"m.4/d","yanilgi":"Rüşvetin listede olmadığını sanıyorsun."},"B":{"gercek":"Madde 4/d sahteciliği açıkça sayılan suçlar arasına koyar.","ayirt":"Bu suç madde 4/d\u0027nin sayma cümlesinde geçiyor mu?","paragraf":"m.4/d","yanilgi":"Sahtecilik meslekle ilgisiz gibi göründüğü için listede olmadığını düşünüyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 101"},"kural":"213 sayılı değil, 3568 sayılı Kanunun 4 üncü maddesinin (d) bendi rüşvet dahil sayılan suçlarda ceza süresi veya türüne bakılmaksızın, affa uğramış olsa bile mahkumiyetin geçerliliğini korur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 101","sonDonem":2,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 4/d sorularında önce \u0027suç kasten mi işlenmiş\u0027 sonra \u0027bu suç kanunun tek tek saydığı özel listede mi\u0027 sorusunu sor; ikisine de evet değilse süre ve af durumuna bak.","konu":"meslek mensubu olma engelleri","tablo":{"satirlar":[["VERİLENLER","-","-"],["A şıkkı ceza süresi","2 yıl","-"],["B şıkkı ceza süresi","4 yıl","-"],["HESAP","-","-"],["A) Kasten yaralama suçundan verilen 2 yıllık hapis cezası, …","p.4/d","YANLIŞ ifade"],["B) Taksirle ölüme sebebiyet verme suçundan verilen 4 yıllık…","p.4/d","YANLIŞ ifade"],["C) Rüşvet suçundan verilen adli para cezası, sonradan çıkar…","p.4/d","doğru ifade"],["D) Zimmet suçu nedeniyle açılan davada hükmün açıklanmasını…","p.4/d","YANLIŞ ifade"],["E) Meslek şeref ve haysiyetine uymayan bir eylem nedeniyle …","p.4/f","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Rüşvet suçundan verilen adli para cezası, sonradan çıkarılan genel af kanunuyla ortadan kaldırılmıştır.","E":"Meslek şeref ve haysiyetine uymayan bir eylem nedeniyle yürütülen disiplin soruşturması sonucunda uyarma cezası verilmiştir.","A":"Kasten yaralama suçundan verilen 2 yıllık hapis cezası, sonradan çıkarılan genel af kanunuyla ortadan kaldırılmıştır.","D":"Zimmet suçu nedeniyle açılan davada hükmün açıklanmasının geri bırakılmasına karar verilmiştir.","B":"Taksirle ölüme sebebiyet verme suçundan verilen 4 yıllık hapis cezası, sonradan çıkarılan genel af kanunuyla ortadan kaldırılmıştır."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"}],"hakem":"3568 sayılı Kanun m.4/d\u0027de rüşvet suçundan mahkumiyet, af kanunuyla ortadan kaldırılsa bile meslek mensubu olmaya engel teşkil etmektedir."},"kayitlar":[],"sade":{"siklar":{"D":"Hükmün açıklanmasının geri bırakılması kararı hukuki anlamda mahkûmiyet sayılmadığından, kanunun aradığı \u0027mahkum olmamak\u0027 şartını sağlamaz.","E":"Disiplin soruşturması sonucu verilen uyarma cezası, ceza mahkumiyeti değil meslek içi ceza olup meslekten çıkarma olmadığı sürece mesleğe giriş engeli doğurmaz.","A":"Kasten yaralama suçu kanunun saydığı özel suçlar listesinde değildir; genel af kanunu bu mahkûmiyeti ortadan kaldırdığı için artık engel oluşturmaz.","B":"Taksirle işlenen suçlar (taksirli ölüme sebebiyet) kanunun engel koşulu kapsamı dışındadır; bu nedenle af olup olmaması engeli ortadan kaldırmaz."},"dogru":"Rüşvet suçundan verilen ceza, af kanunuyla silinse bile meslek mensubu olmaya engel kalır. Çünkü kanun bu suçu özellikle sayarak \u0027affa uğramış olsa bile\u0027 engeli kaldırmayacağını hükme bağlamıştır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 4. madde (d) bendine göre rüşvet suçundan mahkûmiyet, affa uğramış olsa bile meslek mensubu olmaya engeldir.","kavramlar":[]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2017/3"]},"oyun":null,"tip":"teori","soru":"Bir kişi hakkında verilen mahkûmiyetlerden hangisi, ceza affa uğramış olsa dahi 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu uyarınca meslek mensubu olmaya engel teşkil eder?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-08","verilenler":[{"deger":"2 yıl","anlam":"Kasten yaralama suçu için verilen hapis cezası süresidir; genel bir yıl eşiğini aşar ama suç özel sayılan suçlar listesinde olmadığından af ile bu engel kalkabilir.","ad":"A şıkkı ceza süresi"},{"deger":"4 yıl","anlam":"Taksirle ölüme sebebiyet verme suçu için verilen hapis cezası süresidir; ancak suç taksirle işlendiği için madde 4/d kapsamı dışındadır, süre önemsizdir.","ad":"B şıkkı ceza süresi"}],"dayanak":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu m.4/d","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir belediye ihalesinde görevli memur Kemal, 2015 yılında 50.000 TL rüşvet aldığı için yargılanmış ve adli para cezasına mahkûm olmuştur. 2018\u0027de çıkan bir genel af kanunuyla bu ceza tamamen ortadan kaldırılmıştır. Kemal şimdi meslek mensubu olmak için başvuruyor.","anlatim":"Kemal\u0027in dosyasında beş ayrı ihtimali sırayla test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun m.4/d, sayılan suçlarda (rüşvet dahil) affa uğramış olsa bile mahkûmiyetin engel sayılacağını söyler; kasıtlı diğer suçlarda ise bir yıl veya daha fazla hapis şartı aranır, taksirli suçlar zaten kapsam dışıdır. Şimdi beş ifadeyi Kemal\u0027in olayına göre değil, olayın kuralına göre tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"p.4/d","karar":"yanlış","anlatim":"Kasten yaralama sayılan özel suçlar listesinde yoktur, sadece süre ölçütüne tabidir. Af, bu genel kasıtlı suçtaki engeli kaldırır. Bu yüzden bu ifade doğru bir engelden söz etmez.","formul":"Şık A: kasten yaralamadan 2 yıl hapis alan biri, af çıkınca temiz sayılır mı der misin?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"p.4/d","karar":"yanlış","anlatim":"Madde açıkça \u0027kasten işlenen suç\u0027 der, taksirli suç bu kapsamın dışındadır. Süre uzun olsa da taksirli olduğu için zaten şart aranmaz, af bunu değiştirmez.","formul":"Şık B: taksirle ölüme sebep olup 4 yıl hapis alan biri, af sonrası mesleğe girebilir mi dersin?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"p.4/d","karar":"doğru","anlatim":"Rüşvet, kanunun tek tek saydığı özel suçlar listesindedir; ceza türü veya süresi aranmaz. Af olsa bile mahkûmiyet geçerliliğini korur, engel kalkmaz.","formul":"Şık C: rüşvetten adli para cezası alan Kemal\u0027in cezası affa uğramış, bu onu temize çıkarır mı?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"p.4/d","karar":"yanlış","anlatim":"HAGB kararında hukuken kesinleşmiş bir mahkûmiyet hükmü kurulmaz. Madde 4/d açıkça \u0027mahkûm olmamak\u0027 şartını arar, mahkûmiyet yoksa engel de yoktur.","formul":"Şık D: zimmet davasında hükmün açıklanması geri bırakılmışsa, bu bir mahkûmiyet sayılır mı?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.4/f","karar":"yanlış","anlatim":"Uyarma, hafif bir disiplin cezasıdır, ceza mahkûmiyeti değildir. Madde 4/d ceza mahkûmiyetini düzenler, bu yüzden uyarma tek başına kalıcı engel oluşturmaz.","formul":"Şık E: meslek haysiyetine aykırı davranıştan uyarma cezası alan biri, bu yüzden mesleğe giremez mi?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Yalnız rüşvet gibi kanunun tek tek saydığı özel suçlarda af, süre ve ceza türü hiçbir şeyi değiştirmez. Kendine sor: bu suç kanunun saydığı özel listede mi, yoksa genel kasıtlı suç ölçütüne mi tabi?","doldur":[]}],"anahtar":[{"ornek":"suçlar","kok":"suçlar"},{"ornek":"kanunun","kok":"kanunu"},{"ornek":"rüşvet","kok":"rüşvet"},{"ornek":"saydığı","kok":"saydığ"},{"ornek":"sayılı","kok":"sayılı"},{"ornek":"sayılan","kok":"sayıla"}],"konuGiris":{"harita":"Ne zaman test edilir: meslek mensubu olma başvurusu ya da ruhsat değerlendirmesi sırasında test edilir. Nasıl ölçülür: kişinin sabıka kaydındaki suç türü ve ceza süresi ile ölçülür. Nasıl kaydedilir: engel teşkil eden mahkumiyet, affa uğrasa dahi kalıcı bir engel olarak kayıtlarda yer alır.","desen":"Sınav genelde \u0027affa uğramış olsa bile\u0027 ifadesini vurgulayarak öğrencinin bu istisnayı unutup unutmadığını test eder. Şıklarda bir yüz kızartıcı suç ile sıradan bir suç (örneğin taksirle yaralama) karıştırılır. Bu soru SMMM K. m.4/d fıkrasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Kasıtla işlenip bir yıl veya fazla hapisle sonuçlanan suç engel sayılır","ad":"Kasten işlenen suç - 1 yıl ve üzeri hapis","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Cezanın affedilmesi bazı suçlarda engeli ortadan kaldırmaz","ad":"Affa uğrama","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Zimmet, rüşvet, dolandırıcılık gibi kanunda sayılan özel suç grubu","ad":"Yüz kızartıcı suçlar listesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ceza infazı sonrası hak yoksunluğunun süresini belirleyen madde","ad":"TCK m.53 süreleri","kim":"kanun sabitler"}],"sinavda":"Soruda birkaç farklı mahkumiyet türü verilir, hangisinin affa rağmen meslek mensubu olmaya engel olduğu sorulur.","panel_ornek":"Bir arkadaşın kirayı 3 ay üst üste ödemeyince ev sahibi onunla yeni sözleşme yapmak istemiyor; geçmişteki \u0027güven kırılması\u0027 hâlâ etkili sayılıyor. Zaman geçmiş olsa da bazı \u0027güvenilirlik lekeleri\u0027 silinmiyor.","ornek":"Bir arkadaşın kirayı 3 ay üst üste ödemeyince ev sahibi onunla yeni sözleşme yapmak istemiyor; geçmişteki \u0027güven kırılması\u0027 hâlâ etkili sayılıyor. Zaman geçmiş olsa da bazı \u0027güvenilirlik lekeleri\u0027 silinmiyor.","yontemler":"Şıklardaki suçu m.4/d\u0027de sayılan yüz kızartıcı suçlar listesiyle karşılaştır; listede olmayan taksirli suçları ve kısa süreli hapisleri ele.","nedir":"Bu konu, hangi mahkumiyetlerin kişiyi meslek mensubu olmaktan alıkoyduğunu düzenler. Sınav, affa uğrasa bile hangi suçların engel saydığını ayırt edip edemediğini ölçer."},"olay":"rüşvet sayılan suçlar listesindedir - af, süre, ceza türü hiçbiri engeli kaldırmaz.","tuzak":{"D":{"ad":"Mahkumiyet-HAGB Karıştırma Tuzağı","metin":"Hükmün açıklanmasının geri bırakılması kararında hukuken bir mahkumiyet hükmü kurulmuş sayılmaz, sanık hakkında ceza infaz edilmez. Doğrusu: madde 4/d \u0027mahkum olmamak\u0027 şartı arar, HAGB kararı bu şartı doğurmadığından engel oluşturmaz."},"E":{"ad":"Disiplin-Ceza Mahkumiyeti Karıştırma Tuzağı","metin":"Madde 4/d ceza mahkumiyetlerini düzenler; uyarma cezası ise meslek mensubunun kendi mesleği içindeki disiplin rejimine ilişkindir ve meslekten çıkarma dahi olmadıkça mesleğe giriş engeli doğurmaz. Doğrusu: hafif bir disiplin cezası bu bentteki mahkumiyet şartını karşılamadığından engel değildir."},"A":{"ad":"Genel-Özel Karışıklığı Tuzağı","metin":"Kasten yaralama, maddenin ayrıca saydığı zimmet, irtikap, rüşvet gibi özel suçlar listesinde yer almaz; bu suç yalnızca genel \u0027bir yıl veya daha fazla hapis\u0027 ölçütüyle engel oluşturur ve kanun bu genel ölçüt için \u0027affa uğrasa bile\u0027 güvencesini tekrarlamaz. Doğrusu: genel af bu suçun mahkumiyetini ortadan kaldırdığından artık engel değildir."},"B":{"ad":"Taksir-Kasıt Ayrımı Tuzağı","metin":"Madde 4/d yalnızca kasten işlenen suçları kapsar; taksirle işlenen bir suç, ceza süresi ne olursa olsun ve af olsun ya da olmasın bu bendin konusu dışındadır. Doğrusu: taksirli suç zaten engel teşkil etmediği için affa uğraması tartışmaya dahi konu olmaz."}},"celdiriciYol":{"D":"Dava açılmış olması ve zimmet fiilinin gerçekleşmesi, HAGB kararının da bir mahkumiyet hükmü olduğu sanılmasına yol açar","E":"Disiplin soruşturması sonucu verilen ceza, madde 4/d\u0027deki ceza mahkumiyetiyle aynı hukuki sonucu doğurduğu sanılarak yanlış eşleştirilir","A":"2 yıllık kasıtlı suç cezasının süre eşiğini aşması, sayılan özel suçlarla aynı güvenceye sahip olduğu izlenimini verir (genel-özel karışıklığı)","B":"4 yıllık uzun hapis cezası, taksir-kasıt ayrımı gözden kaçırılarak otomatik engel sanılır (taksirli suç kasıtlı suçla karıştırılır)"},"hap":"3568 sayılı Kanunun 4 üncü maddesinin (d) bendinde tek tek sayılan suçlar (zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye ve edimin ifasına fesat karıştırma, aklama, kaçakçılık) affa uğramış olsa dahi meslek mensubu olmaya engeldir; bunun dışındaki kasıtlı suçlarda engel yalnızca bir yıl veya daha fazla hapis cezası şartına bağlıdır ve genel af bu engeli kaldırabilir.","teshis":{"C":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"E":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"A":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"D":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"B":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""}},"verilen":[[1,1],[2,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 106"},"kural":"3568 sayılı Kanunun 45 inci maddesinin birinci fıkrasına göre meslek mensupları, gerçek ve tüzel kişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 106","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 45 sorularında önce \u0027genel yasak\u0027 cümlesini (hizmet akdi/ticari faaliyet) bul, sonra üçüncü fıkradaki şartlı istisna listesini ele; istisna listesindeki görev adları çeldiricidir.","konu":"meslekle bağdaşmayan işler","tablo":{"satirlar":[["A) Gerçek kişiye tabi olarak ve onun işyerine bağlı biçimde…","3568 s.K. m.45/1","doğru ifade"],["B) Tasarruf Mevduatı Sigorta Fonunun yönetimindeki bir kuru…","3568 s.K. m.45/3","YANLIŞ ifade"],["C) Kamu iktisadi kuruluşunun bağlı ortaklığında tasfiye mem…","3568 s.K. m.45/3","YANLIŞ ifade"],["D) Diğer meslek mensuplarıyla ortaklık bürosu kurarak mesle…","3568 s.K. m.45/2","YANLIŞ ifade"],["E) İktisadi devlet teşekkülünün yönetim kurulu üyeliğini yü…","3568 s.K. m.45/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kamu iktisadi kuruluşunun bağlı ortaklığında tasfiye memurluğu görevinde bulunmak","E":"İktisadi devlet teşekkülünün yönetim kurulu üyeliğini yürütmek","A":"Gerçek kişiye tabi olarak ve onun işyerine bağlı biçimde hizmet akdiyle çalışmak","D":"Diğer meslek mensuplarıyla ortaklık bürosu kurarak mesleki faaliyeti birleştirmek","B":"Tasarruf Mevduatı Sigorta Fonunun yönetimindeki bir kurumda bilirkişilik yapmak"},"kaynak":{"alinti":"gerçek ve tüzel kişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar","liste":[{"ad":"SMMM K. (3568 s.K.) m.45 [1/2]","metin":"Madde 45 –(…)19 serbest muhasebeci mali müşavirler bu unvanlarla, yeminli mali müşavirler ise bu unvan ve tasdik yetkisiyle; 2 nci maddede yazılı işlerin yürütülmesi amacıyla gerçek ve tüzelkişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar, ticari faaliyette bulunamazlar, meslekle ve meslek onuru ile bağdaşmayan işlerle uğraşamazlar. Yeminli mali müşavirler, eşi (boşanmış dahi olsa) usul ve füruundan biri ve 3 üncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının veya bunların ortak oldukları firmaların işlerine bakamazlar, yukarıda sayılan yakınlıktaki akrabaları olan (…)19 serbest muhasebeci mali müşavirlerin baktığı işleri tasdik edemezler. (Değişik üçüncü fıkra: 23/7/2010-6009/47 md.) Hayri ve ilmi kuruluşlar, 233 sayılı Kamu İktisadi Teşebbüsleri Hakkında Kanun Hükmünde Kararname kapsamındaki iktisadi devlet teşekkülleri, kamu iktisadi kuruluşları ve bunların müesseseleri, bağlı ortaklıkları ve iştirakleri, kamu idarelerinin doğrudan ya da dolaylı hissedarı olduğu kurumlar ile Tasarruf Mevduatı Sigorta Fonunun yönetimindeki kurumların bu Kanun kapsamındaki faaliyetlerini yürütmemeleri şartıyla, bu kurum ve kuruluşların yönetim kurulu başkanlığı, üyeliği, denetçiliği görevleri ile bilirkişilik ve tasfiye memurluğu meslekle bağdaşmayan işler sayılmaz. Bu madde başlığı “Reklam yasağı” iken, 10/7/2008 tarihli ve 5786 sayılı Kanunun 17 nci maddesiyle metne işlendiği şekilde değiştirilmiştir. 19 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"Serbest muhasebeciler,\", \"serbest muhasebecilerin ve\", \"serbe…"},{"ad":"SMMM K. (3568 s.K.) m.45 [2/2]","metin":"18 Birden çok meslek mensubu çalışmalarını; (…)19 serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik ortaklık bürosu veya şirket şeklinde birleştirebilirler. Bu bürolarda yapılan faaliyetler ticari faaliyet sayılmaz. Şirket şeklinde çalışılması halinde, yapılan işlerden doğacak cezai sorumluluk işi yapan meslek mensubuna aittir. (Ek fıkra: 10/7/2008-5786/18 md.) Meslek mensupları, iş elde etmek için reklâm sayılabilecek faaliyetlerde bulunamazlar. Tabela veya basılı kağıtlarında ruhsatname ile belirlenen mesleki unvanları dışında başka sıfat kullanamazlar. (Ek fıkra: 30/4/2013-6460/9 md.) 23/6/1965 tarihli ve 634 sayılı Kat Mülkiyeti Kanununa göre anagayrimenkulün mesken olarak gösterilen bağımsız bölümlerinde kat maliklerinin izni ve benzeri şartlar aranmaksızın serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik faaliyetlerinde bulunulabilir. Bu konuda, yönetim planındaki aksine hükümler uygulanmaz. Ücret20"}],"hakem":"Kaynak metinde 3568 s.K. m.45/1 açıkça \u0027gerçek ve tüzel kişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar\u0027 hükmü bulunmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Kamu iktisadi kuruluşunun bağlı ortaklığında tasfiye memurluğu, ilgili kuruluşun kanun kapsamındaki faaliyeti yürütmemesi şartıyla istisna tutulmuştur ve yasak değildir.","E":"İktisadi devlet teşekkülünün yönetim kurulu üyeliği, teşekkülün kanun kapsamındaki faaliyeti yürütmemesi şartıyla istisna tutulmuştur ve meslekle bağdaşmayan iş sayılmaz.","D":"Diğer meslek mensuplarıyla ortaklık bürosu kurarak yapılan faaliyet ticari faaliyet sayılmadığı için meslekle bağdaşmayan iş değildir.","B":"Tasarruf Mevduatı Sigorta Fonunun yönetimindeki kurumda bilirkişilik, o kurumun kanun kapsamındaki faaliyeti yürütmemesi şartıyla istisna tutulmuştur ve meslekle bağdaşmayan iş sayılmaz."},"dogru":"Meslek mensubu, gerçek veya tüzel kişiye bağlı olarak ve onların işyerine bağlı biçimde hizmet akdiyle çalışamaz. Kanun bunu doğrudan yasaklamıştır. Diğer seçenekler ya istisna tutulmuş ya da ticari faaliyet sayılmamıştır.","sinav":"Serbest Muhasebeci Mali Müşavirlik Kanunu 45. madde","kavramlar":[{"kaynak":"SMMM K. 45. madde","tanim":"Gerçek veya tüzel kişiye bağlı olarak, onların işyerine bağlı biçimde istihdam edilmek üzere iş sözleşmesi yapılması.","ad":"Hizmet akdiyle çalışma"},{"kaynak":"SMMM K. 45. madde","tanim":"Meslek mensubunun unvanı ve mesleki faaliyet alanının dışında kalan, kanun tarafından açıkça yasaklanan veya meslek onurunu zedeleyen işler.","ad":"Meslekle bağdaşmayan işler"},{"kaynak":"SMMM K. 45. madde","tanim":"Birden çok meslek mensubunun mesleki çalışmalarını birleştirerek kurmış olduğu büro veya şirket; burada yapılan faaliyet ticari faaliyet sayılmaz.","ad":"Ortaklık bürosu"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/2","2022/2"]},"oyun":null,"tip":"teori","soru":"Serbest Muhasebeci Mali Müşavirlik Kanunu\u0027na göre aşağıdaki görevlerden hangisi meslek mensubu için meslekle bağdaşmayan işlerdendir?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-06","verilenler":[],"dayanak":"3568 s. SMMM K. m.45","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ahmet Bey, SMMM ruhsatına sahip. Bir tekstil firması ona ayda 15.000 TL maaşla, işyerine bağlı, hizmet akdiyle \u0027muhasebe müdürü\u0027 olarak çalışmasını teklif ediyor.","anlatim":"Ahmet Bey bu teklifi kabul edip işe başlıyor, patronun emrinde, işyerine bağlı çalışıyor. Şimdi bu beş görev türünü tek tek bu tarz olaylarla test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun m.45\u0027e göre bazı görevler meslekle bağdaşmaz, bazıları istisna sayılır.","anlatim":"m.45/1 hizmet akdiyle bağımlı çalışmayı doğrudan yasaklar. m.45/3 ise TMSF, KİT, iktisadi devlet teşekkülü gibi kurumlarda kanun kapsamındaki faaliyeti yürütmeme şartıyla bazı görevleri istisna sayar. Şimdi beş şıkkı Ahmet Bey\u0027in olayı üzerinden tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"3568 s.K. m.45/1","karar":"doğru","anlatim":"Evet, bu tam olarak m.45/1\u0027in yasakladığı durum. Gerçek kişiye tabi ve işyerine bağlı hizmet akdi, hiçbir istisnaya girmiyor.","formul":"Şık A: Ahmet Bey, tekstil firmasının işyerine bağlı olarak hizmet akdiyle maaşlı çalışıyor, bu meslekle bağdaşmayan bir iş midir?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"3568 s.K. m.45/3","karar":"yanlış","anlatim":"Hayır, kurum kanun kapsamındaki faaliyeti bizzat yürütmüyorsa bilirkişilik istisnadır. m.45/3 bunu açıkça sayıyor.","formul":"Şık B: Ahmet Bey, TMSF yönetimindeki bir bankada sadece bilirkişilik görevi alıyor, bu meslekle bağdaşmaz mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"3568 s.K. m.45/3","karar":"yanlış","anlatim":"Hayır, tasfiye memurluğu da m.45/3\u0027te sayılan istisnalardan biri. Şart yine kuruluşun kanun kapsamındaki faaliyeti yürütmemesi.","formul":"Şık C: Ahmet Bey, bir kamu iktisadi kuruluşunun bağlı ortaklığında tasfiye memurluğu yapıyor, bu meslekle bağdaşmaz mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"3568 s.K. m.45/2","karar":"yanlış","anlatim":"Hayır, kanun bu bürolarda yapılan işi açıkça ticari faaliyet saymaz. Birden fazla meslek mensubunun büro veya şirket kurması serbestçe mümkündür.","formul":"Şık D: Ahmet Bey, üç meslektaşıyla birlikte ortaklık bürosu kurup mesleki faaliyetlerini birleştiriyor, bu meslekle bağdaşmaz mı yoksa ticari faaliyet mi sayılır?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"3568 s.K. m.45/3","karar":"yanlış","anlatim":"Hayır, yönetim kurulu üyeliği de kuruluş kanun kapsamındaki faaliyeti yürütmediği sürece istisna sayılır. Yine m.45/3\u0027ün kapsamına giriyor.","formul":"Şık E: Ahmet Bey, bir iktisadi devlet teşekkülünün yönetim kurulu üyeliğini yürütüyor, bu meslekle bağdaşmaz mı?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Hizmet akdiyle bağımlı çalışmak istisnasız yasaktır, diğer dört görev ise şartlı istisna sayılır. Kendine hep şunu sor: bu görev bağımlı hizmet akdi mi, yoksa şart taşıyan bir istisna listesinde mi?","doldur":[]}],"anahtar":[{"ornek":"istisnadır","kok":"istisn"},{"ornek":"hizmet","kok":"hizmet"},{"ornek":"kapsamındaki","kok":"kapsam"},{"ornek":"faaliyeti","kok":"faaliy"},{"ornek":"kuruluşlarındaki","kok":"kurulu"},{"ornek":"yürütmediği","kok":"yürütm"}],"konuGiris":{"harita":"Ne zaman test edilir: meslek mensubunun hangi faaliyeti yapıp yapamayacağı sorulduğunda. Nasıl ölçülür: kanun metnindeki yasak fiiller ile istisna sayılan görevler karşılaştırılarak. Nasıl kaydedilir: madde 45\u0027teki sayım esas alınarak doğru/yanlış şık belirlenir.","desen":"Sınav, hizmet akdiyle çalışma, ticari faaliyet ve reklam yasağını doğru sayan ama istisna görevleri (bilirkişilik, tasfiye memurluğu) yanlış yasak gösteren şıklarla karıştırır. Tuzak, kamu kurumlarındaki yönetim kurulu üyeliği gibi görevlerin istisna olduğunu bilmemekten kaynaklanır. Bu soru madde 45\u0027teki sayım ile istisna fıkrasının karşılaştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"meslek mensubunun gerçek/tüzel kişiye bağlı olarak maaşlı çalışamaması","ad":"Hizmet akdiyle çalışma yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"meslek mensubunun unvanıyla birlikte ticaretle uğraşamaması","ad":"Ticari faaliyet yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"iş elde etmek için reklam sayılan faaliyetlerde bulunamama kuralı","ad":"Reklam yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"kamu kuruluşlarında yönetim kurulu, bilirkişilik gibi bağdaşmayan iş sayılmayan görevler","ad":"İstisna sayılan görevler","kim":"kanun sabitler"}],"sinavda":"Şıklardan biri seçilerek hangisinin meslekle bağdaşmayan iş olduğu belirlenir.","panel_ornek":"Bir arkadaşın hem berberlik yapıp hem de resmi olarak polislik yapamayacağını düşün, çünkü ikisi bir arada yürütülemeyen görevlerdir. Meslek mensubu da unvanını taşırken bazı işleri aynı anda yapamaz. Örneğin biri hem muhasebecilik yapıp hem de bir firmada maaşlı işçi gibi çalışamaz.","ornek":"Bir arkadaşın hem berberlik yapıp hem de resmi olarak polislik yapamayacağını düşün, çünkü ikisi bir arada yürütülemeyen görevlerdir. Meslek mensubu da unvanını taşırken bazı işleri aynı anda yapamaz. Örneğin biri hem muhasebecilik yapıp hem de bir firmada maaşlı işçi gibi çalışamaz.","yontemler":"Madde 45\u0027teki yasaklanan fiiller (hizmet akdi, ticaret, reklam) ile istisna tutulan görevler (bilirkişilik, tasfiye memurluğu, kamu kuruluşu yöneticiliği) ayrı ayrı ezberlenmelidir.","nedir":"Bu konu, SMMM ve YMM\u0027lerin meslek unvanıyla birlikte yapamayacağı işleri düzenler. Sınav, hangi faaliyetin yasak sayılıp hangisinin istisna kabul edildiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Görev Adı Benzeşmesi Tuzağı","metin":"tasfiye memurluğunu her koşulda yasak sanırsın; oysa kanun kamu iktisadi teşebbüsleri ve bağlı ortaklıklarında bu görevi, ilgili kuruluşun kanun kapsamındaki faaliyeti yürütmemesi şartıyla istisna saymıştır. Doğrusu: bu şart altında tasfiye memurluğu bağdaşmayan iş değildir."},"E":{"ad":"Yönetim Kurulu Üyeliğini Genel Yasağa Dahil Etme Tuzağı","metin":"iktisadi devlet teşekkülündeki her görevi yasak sanırsın. Doğrusu: madde 45 üçüncü fıkra, ilgili teşekkülün kanun kapsamındaki faaliyeti yürütmemesi şartıyla yönetim kurulu başkanlığı ve üyeliğini istisna tutmuştur."},"D":{"ad":"Ortaklık Bürosunu Ticari Faaliyet Sanma Tuzağı","metin":"birden çok meslek mensubunun büro/şirket şeklinde birleşmesini ticari faaliyet zannedip bunu yasak işaretlersin. Doğrusu: madde 45 ikinci fıkrasına göre bu bürolarda yapılan faaliyet ticari faaliyet sayılmaz, dolayısıyla bağdaşmayan iş değildir."},"B":{"ad":"İstisna Kapsamını Genişletme Tuzağı","metin":"TMSF yönetimindeki kurumun 3568 sayılı Kanun kapsamındaki faaliyetlerini yürütmemesi şartıyla, bu kurumda bilirkişilik meslekle bağdaşmayan iş sayılmaz sanıp bunu \u0027bağdaşmaz\u0027 işaretlersin. Doğrusu: madde 45 üçüncü fıkra bu görevi açıkça istisna tutmuştur."}},"celdiriciYol":{"C":"Kamu iktisadi kuruluşunda tasfiye memurluğu = yasak (istisna maddesi atlanır) (istisna şartının atlanması)","E":"İktisadi devlet teşekkülünde yönetim kurulu üyeliği = yasak (istisna şartı atlanır) (istisna şartının atlanması)","D":"Ortaklık bürosu kurmak = ticari faaliyet, dolayısıyla yasak (madde 45/2\u0027nin ikinci cümlesi atlanır) (istisna cümlesinin gözardı edilmesi)","B":"TMSF kapsamındaki kurumda görev = yasak (istisna şartı gözardı edilir) (istisna şartının atlanması)"},"hap":"Meslek mensubu gerçek/tüzel kişiye tabi ve işyerine bağlı olarak hizmet akdiyle çalışamaz; kamu kuruluşlarındaki yönetim kurulu üyeliği, bilirkişilik ve tasfiye memurluğu ise ilgili kuruluş kanun kapsamındaki faaliyeti yürütmediği sürece istisnadır.","teshis":{"C":{"gercek":"Madde 45/3, kamu iktisadi teşebbüsleri ve bağlı ortaklıklarında tasfiye memurluğunu, ilgili kuruluş kanun kapsamındaki faaliyeti yürütmediği sürece istisna tutar.","ayirt":"Bu kuruluş kanun kapsamındaki mali müşavirlik faaliyetini kendisi mi yürütüyor?","paragraf":"3568 s.K. m.45/3","yanilgi":"Tasfiye memurluğunu her zaman meslekle bağdaşmaz sanıyorsun, oysa kanun bunu şarta bağlı istisna saymıştır."},"E":{"gercek":"Madde 45/3, bu kuruluşların kanun kapsamındaki faaliyetlerini yürütmemesi şartıyla yönetim kurulu başkanlığı ve üyeliğini istisna sayar.","ayirt":"Bu teşekkül kanun kapsamındaki faaliyeti bizzat mı yürütüyor, yoksa görev sadece yönetim kurulu üyeliği mi?","paragraf":"3568 s.K. m.45/3","yanilgi":"İktisadi devlet teşekkülündeki her üst düzey görevi meslekle bağdaşmaz sanıyorsun."},"A":{"gercek":"3568 sayılı Kanun m.45/1, meslek mensubunun gerçek ve tüzel kişilere tabi ve onların işyerine bağlı olarak hizmet akdiyle çalışmasını doğrudan ve istisnasız yasaklar.","ayirt":"Bu görev, madde 45 üçüncü fıkradaki sayılı istisnalar arasında mı, yoksa birinci fıkranın genel yasağı içinde mi?","paragraf":"3568 s.K. m.45/1","yanilgi":"Bu şıkkı eleyen öğrenci, hizmet akdiyle çalışmanın da bir istisnaya girebileceğini düşünür."},"D":{"gercek":"Madde 45/2, birden çok meslek mensubunun büro veya şirket şeklinde birleşmesini düzenler ve bu bürolarda yapılan faaliyetin ticari faaliyet sayılmayacağını açıkça belirtir.","ayirt":"Kanun bu birleşmeyi \u0027ticari faaliyet\u0027 olarak mı yoksa meslek icrası olarak mı nitelendiriyor?","paragraf":"3568 s.K. m.45/2","yanilgi":"Ortaklık bürosu kurmayı ticari faaliyet zannedip bunu yasak sanıyorsun."},"B":{"gercek":"Madde 45/3, TMSF yönetimindeki kurumların kanun kapsamındaki faaliyetlerini yürütmemesi şartıyla bilirkişilik görevini istisna sayar.","ayirt":"Bu kurum kanun kapsamındaki faaliyeti bizzat yürütüyor mu, yoksa görev sadece bilirkişilik mi?","paragraf":"3568 s.K. m.45/3","yanilgi":"TMSF yönetimindeki kurumda çalışılan her görevi otomatik olarak yasak sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 106"},"kural":"meslek mensupları unvanlarıyla iş yürütmek üzere gerçek ve tüzel kişilere bağlı hizmet akdiyle çalışamaz, ticari faaliyette bulunamaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 106","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklarda kamu kuruluşu/hayrî kuruluş geçiyorsa önce üçüncü fıkradaki istisna listesini düşün, listede varsa bağdaşmaz iş değildir.","konu":"meslekle bağdaşmayan işler","tablo":{"satirlar":[["A) Bir anonim şirkette hizmet akdine bağlı olarak ücretli ç…","m.45 f.1","doğru ifade"],["B) Kamu iktisadi teşebbüsünün yönetim kurulu üyeliğini yürü…","m.45 f.3","YANLIŞ ifade"],["C) Diğer meslek mensuplarıyla ortaklık bürosu kurarak birli…","m.45 f.4","YANLIŞ ifade"],["D) Hayrî bir kuruluşta bilirkişilik görevi yapmak","m.45 f.3","YANLIŞ ifade"],["E) Kamu idaresinin hissedarı olduğu bir kurumda tasfiye mem…","m.45 f.3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Diğer meslek mensuplarıyla ortaklık bürosu kurarak birlikte çalışmak","E":"Kamu idaresinin hissedarı olduğu bir kurumda tasfiye memurluğu yapmak","A":"Bir anonim şirkette hizmet akdine bağlı olarak ücretli çalışmak","D":"Hayrî bir kuruluşta bilirkişilik görevi yapmak","B":"Kamu iktisadi teşebbüsünün yönetim kurulu üyeliğini yürütmek"},"kaynak":{"alinti":"in birinci fıkrasında yer alan","liste":[{"ad":"SMMM K. (3568 s.K.) m.45 [1/2]","metin":"Madde 45 –(…)19 serbest muhasebeci mali müşavirler bu unvanlarla, yeminli mali müşavirler ise bu unvan ve tasdik yetkisiyle; 2 nci maddede yazılı işlerin yürütülmesi amacıyla gerçek ve tüzelkişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar, ticari faaliyette bulunamazlar, meslekle ve meslek onuru ile bağdaşmayan işlerle uğraşamazlar. Yeminli mali müşavirler, eşi (boşanmış dahi olsa) usul ve füruundan biri ve 3 üncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının veya bunların ortak oldukları firmaların işlerine bakamazlar, yukarıda sayılan yakınlıktaki akrabaları olan (…)19 serbest muhasebeci mali müşavirlerin baktığı işleri tasdik edemezler. (Değişik üçüncü fıkra: 23/7/2010-6009/47 md.) Hayri ve ilmi kuruluşlar, 233 sayılı Kamu İktisadi Teşebbüsleri Hakkında Kanun Hükmünde Kararname kapsamındaki iktisadi devlet teşekkülleri, kamu iktisadi kuruluşları ve bunların müesseseleri, bağlı ortaklıkları ve iştirakleri, kamu idarelerinin doğrudan ya da dolaylı hissedarı olduğu kurumlar ile Tasarruf Mevduatı Sigorta Fonunun yönetimindeki kurumların bu Kanun kapsamındaki faaliyetlerini yürütmemeleri şartıyla, bu kurum ve kuruluşların yönetim kurulu başkanlığı, üyeliği, denetçiliği görevleri ile bilirkişilik ve tasfiye memurluğu meslekle bağdaşmayan işler sayılmaz. Bu madde başlığı “Reklam yasağı” iken, 10/7/2008 tarihli ve 5786 sayılı Kanunun 17 nci maddesiyle metne işlendiği şekilde değiştirilmiştir. 19 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"Serbest muhasebeciler,\", \"serbest muhasebecilerin ve\", \"serbe…"},{"ad":"SMMM K. (3568 s.K.) m.45 [2/2]","metin":"18 Birden çok meslek mensubu çalışmalarını; (…)19 serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik ortaklık bürosu veya şirket şeklinde birleştirebilirler. Bu bürolarda yapılan faaliyetler ticari faaliyet sayılmaz. Şirket şeklinde çalışılması halinde, yapılan işlerden doğacak cezai sorumluluk işi yapan meslek mensubuna aittir. (Ek fıkra: 10/7/2008-5786/18 md.) Meslek mensupları, iş elde etmek için reklâm sayılabilecek faaliyetlerde bulunamazlar. Tabela veya basılı kağıtlarında ruhsatname ile belirlenen mesleki unvanları dışında başka sıfat kullanamazlar. (Ek fıkra: 30/4/2013-6460/9 md.) 23/6/1965 tarihli ve 634 sayılı Kat Mülkiyeti Kanununa göre anagayrimenkulün mesken olarak gösterilen bağımsız bölümlerinde kat maliklerinin izni ve benzeri şartlar aranmaksızın serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik faaliyetlerinde bulunulabilir. Bu konuda, yönetim planındaki aksine hükümler uygulanmaz. Ücret20"}],"hakem":"Soru, 3568 sayılı SMMM Kanunu m.45\u0027in birinci fıkrasında yer alan \u0027gerçek ve tüzel kişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar\u0027 yasağını doğru olarak ölçmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Ortaklık bürosu veya şirket şeklinde meslek mensupları birlikte çalışabilir ve bu ticari faaliyet sayılmaz.","E":"Kamu kuruluşlarındaki tasfiye memurluğu kanunda istisna olarak sayılır, meslekle bağdaşmayan iş değildir.","D":"Hayrî ve ilmi kuruluşlarda bilirkişilik görevi kanunda istisna olarak belirtilir, meslekle bağdaşmayan iş kapsamına girmez.","B":"Kamu iktisadi teşebbüslerinin yönetim kurulu üyeliği kanunda açıkça istisna olarak sayılır, meslekle bağdaşmayan iş değildir."},"dogru":"Serbest muhasebeci mali müşavir, muhasebeci unvanıyla bir şirkette işyerine bağlı ücretli çalışamaz. Kanun, meslek mensuplarının başkasına bağlı olarak çalışmasını yasaklar. Diğer seçenekler kamu kurumları veya ortaklık için istisna tanır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 45. madde","kavramlar":[{"kaynak":"SMMM K. 45. madde","tanim":"Meslek mensubunun başka bir gerçek veya tüzel kişiye bağımlı olarak ücretli çalışmasıdır. Kanun bunu yasaklar.","ad":"işyerine bağlı hizmet akdi"},{"kaynak":"SMMM K. 45. madde","tanim":"Serbest muhasebeci mali müşavirin meslek onuru ve bağımsızlığıyla uyumlu olmayan faaliyetlerdir. Kanun bu işleri yasaklar, ancak belirli kamu görevleri için istisna tanır.","ad":"meslekle bağdaşmayan iş"},{"kaynak":"SMMM K. 45. madde","tanim":"Birden çok meslek mensubunun birlikte çalışmak üzere oluşturdukları yapıdır. Bu şekildeki faaliyetler ticari faaliyet sayılmaz.","ad":"ortaklık bürosu veya şirket"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/2","2022/2"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre, bir serbest muhasebeci mali müşavirin aşağıdaki faaliyetlerinden hangisi meslekle bağdaşmayan iş sayılır?","kayitBaslik":"","id":"sgs-p-meslek-zor-r2-a/kp-06","verilenler":[],"dayanak":"3568 sayılı SMMM Kanunu m.45 f.1 ve f.3","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Kayseri\u0027de bir SMMM olan Ahmet Bey, aynı anda beş farklı işle uğraşıyor: bir tekstil A.Ş.\u0027sinde muhasebe müdürü olarak maaşlı çalışıyor, bir KİT\u0027te yönetim kurulu üyesi, iki meslektaşıyla ortak büro açmış, bir vakıfta bilirkişilik yapıyor ve kamunun hissedar olduğu bir şirkette tasfiye memuru.","anlatim":"Ahmet Bey\u0027in bu beş işinden hangisi meslekle bağdaşmayan iş sayılır, buna karar vereceğiz. Kanun madde 45 net bir çizgi çiziyor: unvanla iş yürütürken işyerine bağlı hizmet akdiyle çalışamazsın, ama üçüncü fıkradaki kamu görevleri serbest.","doldur":[]},{"formul":"Ne yapacağız: Ahmet Bey\u0027in beş faaliyetini tek tek madde 45\u0027in birinci fıkrasındaki yasakla üçüncü fıkrasındaki istisna listesine çarpıştıracağız.","anlatim":"Kural şu: hizmet akdiyle bağımlı çalışmak ve ticari faaliyet yasak, ama sayılan kamu görevleri (yönetim kurulu, denetçilik, bilirkişilik, tasfiye memurluğu) istisna. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.45 f.1","karar":"doğru","anlatim":"Burada işverene bağımlı, hizmet akdine dayalı bir ücretli çalışma var. Madde 45/1 bunu doğrudan yasaklıyor, istisna listesinde de yok. Bu yüzden bu iş meslekle bağdaşmayan iştir.","formul":"Şık A: Ahmet Bey tekstil A.Ş.\u0027sinde maaşlı muhasebe müdürü olarak hizmet akdiyle çalışıyor, bu meslekle bağdaşır mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.45 f.3","karar":"yanlış","anlatim":"KİT\u0027ler madde 45/3\u0027te sayılan kuruluşlardandır ve yönetim kurulu üyeliği orada açıkça istisna tutulmuş. Ahmet Bey burada SMMM faaliyetini yürütmediği sürece bu iş serbesttir. Yani bu ifade meslekle bağdaşmayan iş değildir.","formul":"Şık B: Ahmet Bey bir KİT\u0027in yönetim kurulu üyeliğini yürütüyor, bu yasak mıdır?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.45 f.4","karar":"yanlış","anlatim":"Madde 45\u0027in ikinci bölümü, birden çok meslek mensubunun ortaklık bürosu kurmasını açıkça düzenliyor ve bu faaliyeti ticari saymıyor. Demek ki bu iş de meslekle bağdaşmayan iş değildir. Cezai sorumluluk yine işi yapan mensuba ait kalır.","formul":"Şık C: Ahmet Bey iki meslektaşıyla ortaklık bürosu kurup birlikte çalışıyor, bu ticari faaliyet sayılır mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.45 f.3","karar":"yanlış","anlatim":"Hayrî kuruluşlar madde 45/3\u0027te açıkça sayılmış ve bilirkişilik orada istisna görevlerden biri. Vakıf hayrî kuruluş sayıldığı için bu görev serbesttir. Yani bu da meslekle bağdaşmayan iş değildir.","formul":"Şık D: Ahmet Bey bir vakıfta bilirkişilik yapıyor, bu yasak mıdır?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.45 f.3","karar":"yanlış","anlatim":"Madde 45/3, kamu idaresinin doğrudan veya dolaylı hissedarı olduğu kurumlarda tasfiye memurluğunu istisna sayıyor. Ahmet Bey tam bu tanıma giren bir kurumda görev yapıyor. Bu yüzden bu iş de meslekle bağdaşmayan iş değildir.","formul":"Şık E: Ahmet Bey kamunun hissedar olduğu bir şirkette tasfiye memurluğu yapıyor, bu yasak mıdır?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Tek yasak olan şey, unvanınla değil işverene bağımlı hizmet akdiyle ücretli çalışmaktır; geri kalan dört iş kanunun kendi saydığı istisnalar. Kendine hep şunu sor: bu iş hizmet akdiyle bağımlı çalışma mı, yoksa madde 45/3\u0027teki sayılan kamu-hayrî görevlerden biri mi?","doldur":[]}],"anahtar":[{"ornek":"meslek","kok":"meslek"},{"ornek":"istisnadır","kok":"istisn"},{"ornek":"kuruluşlarındaki","kok":"kurulu"},{"ornek":"hizmet","kok":"hizmet"},{"ornek":"bağdaşmayan","kok":"bağdaş"},{"ornek":"faaliyet","kok":"faaliy"}],"konuGiris":{"harita":"Ne zaman yasak devreye girer: SMMM unvanıyla birlikte ticari faaliyet veya bağımlı hizmet akdi yapıldığında. Nasıl ayırt edilir: kanunda sayılan istisnalar (yönetim kurulu üyeliği, bilirkişilik, tasfiye memurluğu gibi) dışında kalan işler yasak sayılır. Nasıl kaydedilir/sonuçlanır: meslek odası disiplin işlemiyle değerlendirilir.","desen":"Soru genelde şıklarda bir işi \u0027meslekle bağdaşmayan\u0027 gösterip, aslında kanunda istisna sayılan bir görevi (bilirkişilik, tasfiye memurluğu gibi) doğru cevap olarak sunar. Tuzak, ticari faaliyet ile istisna görevlerin karıştırılmasıdır. Bu soru m.45\u0027teki istisna fıkrasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"SMMM unvanıyla birlikte yapılamayacak ticari veya bağımlı faaliyet türü","ad":"Meslekle bağdaşmayan iş","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"gerçek/tüzel kişiye bağlı olarak maaşlı çalışmanın yasak olması","ad":"Hizmet akdi yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"yönetim kurulu üyeliği, bilirkişilik, tasfiye memurluğu gibi yasak dışı sayılan görevler","ad":"İstisna görevler","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"iş elde etmek için reklam sayılabilecek faaliyetlerin yasak olması","ad":"Reklam yasağı","kim":"meslek kuruluşu düzenler"}],"sinavda":"Sorulan faaliyetlerden hangisinin kanunen meslekle bağdaşmayan iş sayıldığı sorulur, hesaplama istenmez.","panel_ornek":"Bir arkadaşın market kasasında maaşlı çalışırken aynı zamanda kendi adına 10 kişiye özel ders veriyor. İkisi bir arada olunca patronu \u0027ya burada çalış ya orada\u0027 diyor, çünkü ikisi birbirini bağlamaz sayılıyor.","ornek":"Bir arkadaşın market kasasında maaşlı çalışırken aynı zamanda kendi adına 10 kişiye özel ders veriyor. İkisi bir arada olunca patronu \u0027ya burada çalış ya orada\u0027 diyor, çünkü ikisi birbirini bağlamaz sayılıyor.","yontemler":"Şıklardaki her faaliyeti \u0027ticari faaliyet mi, hizmet akdi mi, yoksa kanunda sayılan istisna mı\u0027 diye tek tek eleyerek çöz.","nedir":"Bu konu, SMMM\u0027nin unvanıyla birlikte hangi işleri yapamayacağını belirler. Sınav, hangi faaliyetin yasak sayılan \u0027ticari iş/hizmet akdi\u0027 kapsamına girdiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Ortaklık Tuzağı","metin":"birlikte çalışmayı ticari faaliyet zannedersin, oysa madde ortaklık bürosu/şirket faaliyetini ticari faaliyet saymadığını belirtir. Doğrusu: bu şekilde çalışma bağdaşmaz iş değildir."},"E":{"ad":"Kapsam Tuzağı","metin":"tasfiye memurluğunu genel bir yasak sanırsın, oysa madde bu görevi kamu kuruluşları için istisna kabul eder. Doğrusu: bu görev meslekle bağdaşmayan iş sayılmaz."},"D":{"ad":"Bilirkişilik Tuzağı","metin":"bilirkişiliği her zaman yasaklı sanırsın, oysa madde hayrî ve ilmi kuruluşlarda bu görevi istisna sayar. Doğrusu: bu görev meslekle bağdaşmayan iş kapsamına girmez."},"B":{"ad":"İstisna Tuzağı","metin":"kamu iktisadi teşebbüsündeki her görevi bağdaşmaz sanırsın, oysa madde bu kurumlardaki yönetim kurulu üyeliğini açıkça istisna tutar. Doğrusu: bu görev meslekle bağdaşmayan iş sayılmaz."}},"celdiriciYol":{},"hap":"Madde 45\u0027e göre bağımlı hizmet akdi ve ticari faaliyet yasaktır; ancak sayılan kamu kuruluşlarındaki yönetim kurulu üyeliği, bilirkişilik ve tasfiye memurluğu istisnadır.","teshis":{"C":{"gercek":"Madde 45, ortaklık bürosu veya şirket şeklindeki çalışmayı ticari faaliyet saymadığını açıkça düzenler.","ayirt":"Bu birliktelik ticari şirket mi yoksa meslek mensuplarının mesleki ortaklığı mı?","paragraf":"m.45 f.4","yanilgi":"Birden çok meslek mensubunun birlikte büro kurmasını ticari faaliyet zannediyorsun."},"E":{"gercek":"Madde 45/3, kamu idaresinin doğrudan/dolaylı hissedarı olduğu kurumlarda tasfiye memurluğunu istisna sayar.","ayirt":"Tasfiye memurluğu üçüncü fıkradaki sayılan kurum bünyesinde mi yapılıyor?","paragraf":"m.45 f.3","yanilgi":"Tasfiye memurluğunu her koşulda yasak sanıyorsun."},"A":{"gercek":"Madde 45/1, unvan sahibi meslek mensubunun işyerine bağlı hizmet akdiyle çalışmasını açıkça yasaklar; istisnalar yalnız üçüncü fıkradaki k
