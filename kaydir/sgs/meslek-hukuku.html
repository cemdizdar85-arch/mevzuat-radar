<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".

   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. Koyu tema yalnız düğmeyle (data-theme="dark", tarayıcıda kc_tema) ya da ?tema=koyu ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}

.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}
#akis{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.kart{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;max-width:560px;margin:0 auto}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.78em;color:var(--dim);margin-bottom:8px}
.noktalar{display:flex;gap:5px}.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--cizgi);display:block}.noktalar i.ok{background:var(--yesil)}.noktalar i.yan{background:var(--kirmizi)}.noktalar i.simdi{outline:2px solid var(--mavi);outline-offset:1px}
.noktalar.cok{gap:3px;flex-wrap:wrap;max-width:58%;justify-content:center}.noktalar.cok i{width:5px;height:5px}
.tt.teori td:first-child{white-space:nowrap;font-weight:700;color:var(--dim);width:1%}
.sinavDil{font:inherit;font-size:.78em;color:var(--mavi);background:transparent;border:1px solid var(--cizgi);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer}
.sinavDilM{margin-top:6px;font-size:.86em;color:var(--dim);border-left:2px solid var(--cizgi);padding-left:8px}
.govde{flex:1;overflow-y:auto;padding-bottom:90px}
.rozet{display:inline-block;font-size:.72em;color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 50%,transparent);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}
.ipucu{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:.8em;pointer-events:none;animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.panel.acik{transform:translateY(0)}.tutamac{width:38px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 10px}
/* Cem 03.09 "gorunum boyle geliyor": KAPALI panel kartin altina (105%) kayiyor ve SONRAKI KARTIN ustune biniyordu.

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}

.ozet{font-size:.93em;margin:0 0 8px;line-height:1.45}.ozet b{color:var(--yesil)}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}

.cip2.ek{display:none}.cipler.acikEk .cip2.ek{display:inline-block}.cipler.acikEk .bDaha{color:var(--dim)}
.cipler .bDaha{border-style:dashed;color:var(--dim)}
.sek{display:none;margin-top:8px}.sek.acik{display:block;animation:gir .2s ease}
.panel{overscroll-behavior:contain}
.kavramL{margin:4px 0 8px;padding-left:18px}.kavramL li{margin:3px 0}.kavramL i{color:var(--dim);font-style:normal;font-size:.85em}
.panelBas{position:sticky;bottom:4px;display:block;margin:10px 0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:.84em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent)}

/* yanlis kutusu + hazirlik skoru */
.ustSag{display:flex;align-items:center;gap:6px}
.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}
.kutuEkran{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}.kutuEkran.acik{display:flex}
.kutuIc{background:var(--kart);width:min(100%,640px);max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 22px;border:1px solid var(--cizgi)}
@media(min-width:900px){.kutuEkran{align-items:center}.kutuIc{border-radius:18px}}
.kutuIc .basl{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}

.dersSat{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92em}.dersSat .bar{height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden}.dersSat .bar i{display:block;height:100%;background:var(--yesil)}
.kutuSat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.92em}
/* kaynak metni */
.kaynakAd{color:var(--mavi);font-weight:800;font-size:.85em;margin:8px 0 4px}.kaynakMetin{font-size:.9em;line-height:1.55;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px}.kaynakMetin mark{background:color-mix(in srgb,var(--altin) 35%,transparent);color:var(--yazi);padding:1px 2px;border-radius:3px}
/* sen anlat / t-hesabi / sinavda */
.ipnot{font-size:.84em;color:var(--dim);margin:2px 0 8px}
.anlatK{width:100%;background:var(--bg2);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 11px;font-size:.95em;font-family:inherit;resize:vertical}
.anlatSonuc{font-size:.92em;margin-top:8px;line-height:1.5}.anlatPuan{font-weight:800;font-size:1.05em;margin-bottom:4px}.anlatOrnek{margin-top:8px;border-left:4px solid var(--altin);padding:6px 10px;background:color-mix(in srgb,var(--altin) 8%,transparent);border-radius:0 8px 8px 0}
.tKutular{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:600px){.tKutular{grid-template-columns:1fr 1fr}}

.tGovde{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--yazi);min-height:88px}.tSol{border-right:2px solid var(--yazi);padding:6px 8px}.tSag{padding:6px 8px;text-align:right}

.cikmisK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.88em;color:var(--dim);line-height:1.45}.cikmisK .yil{display:inline-block;background:color-mix(in srgb,var(--mavi) 15%,transparent);color:var(--mavi);font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.85em}

.ogret{margin:4px 0 6px}.thpNot{font-size:.85em;color:var(--dim);margin:2px 0 8px}
.hesapK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.9em;line-height:1.45}.hesapK.yan{border-color:color-mix(in srgb,var(--kirmizi) 60%,transparent)}.hesapK.dog{border-color:color-mix(in srgb,var(--yesil) 60%,transparent)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.btn{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;font-size:.9em;cursor:pointer}.btn.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0}.btn.mavi{border-color:var(--mavi);color:var(--mavi)}
/* surukleme oyunu */

.oyun{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:20;overflow-y:auto}.oyun.acik{display:flex}

#akis,.govde,.tabloSar,.serit,.panel,.oyun{scrollbar-width:none}#akis::-webkit-scrollbar,.govde::-webkit-scrollbar,.tabloSar::-webkit-scrollbar,.serit::-webkit-scrollbar,.panel::-webkit-scrollbar,.oyun::-webkit-scrollbar{display:none}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

const SORULAR=[{"capa":{"kaynak":"SGS 2025/1 Soru 104"},"kural":"İş kapsamının, daha az ücretle iş yapılsın diye baskıyla daraltılması yıldırma tehdidi sayılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 104","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce şıktaki olayın hangi tehdit türüne ait olduğunu belirle, sonra soru kökündeki ikinci şartı (ücretle ilgili olma) kontrol et.","konu":"ücret tarifesi","tablo":{"satirlar":[["A) Tek bir müşteriden alınacak toplam ücrete aşırı bağlılık…","m.21/b","YANLIŞ ifade"],["B) Daha düşük ücret ödenmesi amacıyla sunulan hizmetin kaps…","m.25/b","doğru ifade"],["C) Müşteri sözleşmesiyle ilgili olarak azledilme veya görev…","m.25/a","YANLIŞ ifade"],["D) Güvence sağlama sözleşmesiyle ilgili olarak şarta bağlı …","m.21/e","YANLIŞ ifade"],["E) Üst düzey personel ile güvence sağlama müşterisi arasınd…","m.24/d","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Müşteri sözleşmesiyle ilgili olarak azledilme veya görevin başkasına verilmesiyle tehdit edilme","E":"Üst düzey personel ile güvence sağlama müşterisi arasında uzun süreli bir arkadaşlık ilişkisinin bulunması","A":"Tek bir müşteriden alınacak toplam ücrete aşırı bağlılık duyulması","D":"Güvence sağlama sözleşmesiyle ilgili olarak şarta bağlı ücretler öngörülmesi","B":"Daha düşük ücret ödenmesi amacıyla sunulan hizmetin kapsamının uygunsuzca azaltılması yönünde baskıya maruz kalınması"},"kaynak":{"alinti":"","liste":[{"ad":"TÜRMOB Etik İlkeler Yön. EK bolum 6","metin":"TÜRMOB - Mesleki Faaliyetlerde Uyulacak Etik İlkeler Hakkında Yönetmelik (RG 19.10.2007, Sayı 26675). EK: Etik İlkeler (m.21-25) [İKİNCİ KISIM: Bağımsız Çalışan Meslek Mensuplarının Uyacakları Etik İlkeler / BİRİNCİ BÖLÜM: Giriş] MADDE 21 – (1) Bağımsız çalışan meslek mensubu için kişisel çıkar tehdidi yaratabilecek durumlara verilebilecek bazı örnekler şunlar olabilir: a) Müşterisinden finansal çıkarı olması veya müşteri ile ortak bir finansal çıkarı paylaşması, b) Tek bir müşteriden alınacak toplam ücrete aşırı bağlılık. c) Müşteri ile yakın iş ilişkisi kurmak. ç) Müşteriyi kaybetme olasılığını dikkate alma. d) Müşteri tarafından istihdam edilme olasılığı. e) Güvence sağlama sözleşmesi ile ilgili şarta bağlı ücretler. f) Güvence sağlama müşterisinden veya yöneticilerden borç alınması ya da güvence sağlama müşterisine/yöneticilerine borç verilmesi. MADDE 22 – (1) Bağımsız çalışan meslek mensubu için tekrar değerlendirme tehdidi yaratabilecek durumlara verilebilecek bazı örnekler şunlar olabilir: a) Bağımsız çalışan meslek mensubunun yaptığı bir işin tekrar değerlendirilmesi sırasında önemli bir hatanın tespit edilmesi. b) Bir finansal sistemin tasarım ve uygulamasına katıldıktan sonra sistemin işleyişi hakkında rapor verilmesi, c) Bir sözleşmenin esas konusu olan kayıtların üretilmesinde kullanılan ilk verilerin bağımsız çalışan meslek mensubu tarafından hazırlamış olması. ç) Güvence sağlama sözleşmesi ekibinin bir üyesinin daha önceden o müşterinin çalışanı olması. d) Güvence sağlama sözleşmesi ekibinin bir üyesinin halen veya yakın geçmişte müşteri tarafından sözleşmenin…"},{"ad":"TÜRMOB Etik İlkeler Yön. EK bolum 8","metin":"TÜRMOB - Mesleki Faaliyetlerde Uyulacak Etik İlkeler Hakkında Yönetmelik (RG 19.10.2007, Sayı 26675). EK: Etik İlkeler (m.29-30) [İKİNCİ KISIM: Bağımsız Çalışan Meslek Mensuplarının Uyacakları Etik İlkeler / BİRİNCİ BÖLÜM: Giriş] MADDE 29 – İş çevresinde firma çapında alınabilecek önlemler şunlar olabilir: a) Firmanın temel etik ilkelere uyumun önemini vurgulamak. b) Güvence sağlama sözleşmesi ekibinin kamu çıkarına uygun hareket edeceği yönünde bir beklentinin oluşmasını sağlamak. c) Sözleşmelerde kalite kontrolü uygulanması ve izlenmesini sağlayacak politika ve süreçler. ç) Tehditlerin belirlenmesi, bu tehditlerin önem derecesinin değerlendirilmesi, önemsiz olanlar dışındaki tehditleri ortadan kaldıracak veya kabul edilebilir düzeye indirecek önlemlerin belirlenmesi ve uygulanmasına ilişkin belgeye dayalı politikalar. d) Güvence sağlama sözleşmelerini kullanan firmalar için bağımsızlığa yönelik tehditlerin ve bu tehditlerin önem derecesinin belirlenmesi, tehditleri (önemsiz olanlar dışındaki) yok edecek veya kabul edilebilir düzeye indirecek önlemlerin değerlendirilmesi ve uygulanmasına yönelik belgeye dayalı bağımsızlık politikaları. e) Temel etik ilkelere uyum gerektiren belgeye dayalı iç politika ve süreçler. f) Firma veya sözleşme ekibi üyeleri ve müşteriler arasındaki çıkar ilişkilerinin belirlenmesini sağlayacak politika ve süreçler. g) Tek bir müşteriden elde edilen gelirin izlenmesi ve gerektiğinde bu gelire olan bağımlılığın yönetilmesini sağlayacak politika ve süreçler. ğ) Sözleşme ekibinin üyesi olmayan kişilerin sözleşmenin sonucunu uygunsuz bir biçimde etkile…"}],"hakem":"Kaynakta TÜRMOB Etik İlkeler Yönetmeliği Madde 25/b\u0027de, daha düşük ücret ödenmesi için sunulan hizmetin kapsamının uygunsuz biçimde azaltılması yönünde baskıya maruz kalınmanın yıldırma tehdidi örneği olduğu açıkça belirtilmiştir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2026/1","2025/1"]},"oyun":null,"tip":"teori","soru":"Etik İlkeler Yönetmeliği\u0027ne göre, meslek mensubunun ücretiyle ilgili olup yıldırma tehdidi örneği sayılan durum aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-04","verilenler":[],"dayanak":"TÜRMOB Etik İlkeler Yönetmeliği Ek m.25/b (ücretle ilgili yıldırma tehdidi), karşılaştırma için m.21/b, m.21/e, m.25/a, m.24/d","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bir bağımsız denetim firmasında müşteri, 2024 yılı denetim ücretini 150.000 TL\u0027den 90.000 TL\u0027ye düşürmek istiyor ve bunun için \u0027stok sayım kontrollerini kapsam dışı bırakın\u0027 diye baskı yapıyor.","anlatim":"Müşteri para kazanmak için işin kapsamını küçültmeye çalışıyor. Denetçi bu baskıyla karşı karşıya kalıyor.","doldur":[]},{"formul":"Ne yapacağız: bu olayda beş farklı tehdit türünü tek tek deneyeceğiz; hangisi \u0027ücretle ilgili yıldırma tehdidi\u0027 tanımına uyuyor bulacağız.","anlatim":"Kişisel çıkar, yakınlık, taraf tutma ve yıldırma tehditleri birbirine benzer ama kaynağı farklı. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.21/b","karar":"yanlış","anlatim":"Burada baskı yok, sadece ekonomik bağımlılık var. Bu kişisel çıkar tehdidi sayılır, yıldırma değil.","formul":"Şık A: denetçi \u0027bu müşteriden gelen ücret toplam gelirimin çoğunu oluşturuyor, ona bağımlı kaldım\u0027 diyor, bu yıldırma tehdidi mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.25/b","karar":"doğru","anlatim":"Tam da olayımızdaki durum bu. Düşük ücret için hizmet kapsamının uygunsuzca kısılması yönetmelikte açıkça yıldırma tehdidi örneğidir.","formul":"Şık B: müşteri \u0027ücreti düşüreyim de stok sayımını kapsam dışı bırak\u0027 diye baskı yapıyor, sen bunu yıldırma tehdidi sayar mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.25/a","karar":"yanlış","anlatim":"Burada tehdit görevden alınma, ücret konusu geçmiyor. Bu ayrı bir yıldırma örneği ama ücret örneği değil.","formul":"Şık C: müşteri \u0027kapsamı azaltmazsan seni azlederim, işi başka firmaya veririm\u0027 diyor, bu da ücretle mi ilgili?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.21/e","karar":"yanlış","anlatim":"Şarta bağlı ücret dışarıdan gelen bir baskı değil, denetçinin kendi çıkarına bağlılık riski taşır. Bu kişisel çıkar tehdididir.","formul":"Şık D: sözleşmede \u0027denetim sonucuna göre ücret ödenecek\u0027 şartı var, bu şarta bağlı ücret yıldırma mı sayılır?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.24/d","karar":"yanlış","anlatim":"Burada ekonomik baskı yok, kişisel yakınlık var. Bu yakınlık tehdidi başlığına girer, ücretle ilgisi yoktur.","formul":"Şık E: üst düzey personel müşteri yöneticisiyle yıllardır arkadaş, bu durum ücretle ilgili yıldırma mı olur?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru cevap, ücret düşürülsün diye iş kapsamının baskıyla daraltılması olayıdır. Kendine hep şunu sor: bu baskı doğrudan ücret ve iş kapsamını mı hedefliyor, yoksa başka bir çıkar veya ilişkiyi mi?","doldur":[]}],"anahtar":[{"ornek":"tehdidi","kok":"tehdid"},{"ornek":"yıldırma","kok":"yıldır"},{"ornek":"kapsamının","kok":"kapsam"},{"ornek":"kişisel","kok":"kişise"},{"ornek":"daraltılması","kok":"daralt"},{"ornek":"yakınlık","kok":"yakınl"}],"konuGiris":{"harita":"Ne zaman test edilir: sınavda beş tehdit türünden (kişisel çıkar, tekrar değerlendirme, taraf tutma, yakınlık, yıldırma) hangisine hangi örneğin girdiği sorulduğunda. Nasıl ölçülür: verilen somut durumun madde 21-25\u0027teki hangi maddenin örneği olduğu eşleştirilerek. Nasıl kaydedilir: doğru tehdit adı (burada \u0027yıldırma tehdidi\u0027) seçilerek işaretlenir.","desen":"Sınav genelde beş tehdit türünü karıştırıp öğrenciye bir örnek verir ve hangi başlığa girdiğini sorar. Tuzak, \u0027ücrete aşırı bağlılık\u0027 (kişisel çıkar) ile \u0027azledilme/kapsam azaltma tehdidi\u0027 (yıldırma) örneklerinin birbirine benzetilmesidir. Bu soru madde 25\u0027teki yıldırma tehdidi örneklerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Ücret veya görev nedeniyle meslek mensubunun baskı ile yönlendirilmesi riski","ad":"Yıldırma tehdidi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Sözleşmenin sona erdirilmesiyle korkutularak baskı yapılması","ad":"Azledilme tehdidi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Daha düşük ücret için hizmet kapsamının uygunsuz azaltılması yönünde baskı","ad":"Ücret kapsamı baskısı","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Ücrete aşırı bağlılık veya finansal çıkar paylaşımı riski","ad":"Kişisel çıkar tehdidi","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soruda meslek mensubunun ücretiyle ilgili bir baskı durumu tanımlanır, öğrenciden bu durumun hangi tehdit türüne girdiği istenir.","panel_ornek":"Bir usta, işi bitirmeden önce müşterisinden \u0027ücretini düşür yoksa başka ustayla anlaşırım\u0027 tehdidini alır. Ya da müşteri, ustanın yapacağı işin kapsamını daraltıp daha az para ödemek için baskı yapar. Bu, işini düzgün yapmak isteyen ustayı korkutup geri adım attırma çabasıdır.","ornek":"Bir usta, işi bitirmeden önce müşterisinden \u0027ücretini düşür yoksa başka ustayla anlaşırım\u0027 tehdidini alır. Ya da müşteri, ustanın yapacağı işin kapsamını daraltıp daha az para ödemek için baskı yapar. Bu, işini düzgün yapmak isteyen ustayı korkutup geri adım attırma çabasıdır.","yontemler":"Beş tehdit başlığını (kişisel çıkar, tekrar değerlendirme, taraf tutma, yakınlık, yıldırma) ezberleyip her birine bir anahtar kelime bağlamak en hızlı yoldur; \u0027azledilme\u0027 ve \u0027ücret kapsamı azaltma\u0027 kelimeleri doğrudan yıldırmayı işaret eder.","nedir":"Bu konu, meslek mensubunun ücret konusunda müşteri baskısı altında kalıp bağımsızlığını kaybetme risklerini tanımlar. Sınav, hangi somut örneğin \u0027yıldırma tehdidi\u0027 başlığına girdiğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Aynı Madde Tuzağı","metin":"Bu da yıldırma tehdidi olduğundan doğru sanılır ama konusu ücret değil, azil ve görevden alma tehdididir. Doğrusu: Ücretle ilgisi olmayan bir yıldırma örneğidir, soru ücretle ilgili olanı ister."},"E":{"ad":"Tehdit Türü Karışıklığı Tuzağı","metin":"Ücretle bağlantılı sanılabilir ama arkadaşlık ilişkisi yakınlık tehdidine örnektir, ücretle hiçbir ilgisi yoktur. Doğrusu: Bu, sorulan ücretle ilgili yıldırma örneği değildir."},"D":{"ad":"Şarta Bağlı Ücret Tuzağı","metin":"Ücretle ilgili olduğu için yıldırma sanılır ama şarta bağlı ücret düzenlemesi kişisel çıkar tehdidi başlığı altında sayılır. Doğrusu: Bu durum yıldırma değil kişisel çıkar tehdidine örnektir."},"A":{"ad":"Kişisel Çıkar Tuzağı","metin":"Ücretle ilgili olduğu için yıldırma sanılır ama bu, tek müşteriden gelen ücrete bağımlılık hâlidir. Doğrusu: Bu durum kişisel çıkar tehdidi örneğidir, yıldırma değildir."}},"celdiriciYol":null,"hap":"Ücretle ilgili tehditlerde, ücrete bağımlılık ve şarta bağlı ücret kişisel çıkar tehdidi; düşük ücret için hizmetin daraltılması yönündeki baskı ise yıldırma tehdididir.","teshis":{"C":{"gercek":"Madde 25/a azledilme veya görevden alınma tehdidini düzenler; ücret konusu geçmez.","ayirt":"Tehdidin doğrudan konusu ücret mi, yoksa görevde kalıp kalmama mı?","paragraf":"m.25/a","yanilgi":"Aynı maddede geçtiği için bunu da ücretle ilgili sanıyorsun."},"E":{"gercek":"Madde 24/d uzun süreli arkadaşlık ilişkisini yakınlık tehdidi başlığında düzenler, ücretle ilgisi yoktur.","ayirt":"Bu durumun kaynağı kişisel yakınlık mı, ekonomik/baskı unsuru mu?","paragraf":"m.24/d","yanilgi":"Kişisel ilişkiyi de ücretle bağlantılı bir tehdit sanıyorsun."},"A":{"gercek":"Madde 21/b\u0027ye göre tek müşteriden gelen ücrete aşırı bağlılık kişisel çıkar tehdididir; yıldırma başka maddededir.","ayirt":"Bu durum meslek mensubunun bağımsızlığını bir müşteriye ekonomik bağımlılıkla mı, yoksa dışarıdan gelen baskıyla mı zedeliyor?","paragraf":"m.21/b","yanilgi":"Ücretle ilgili her örneği otomatik olarak yıldırma tehdidi sayıyorsun."},"D":{"gercek":"Madde 21/e şarta bağlı ücretleri kişisel çıkar tehdidi örnekleri arasında sayar.","ayirt":"Bu durum dışarıdan gelen bir baskı mı, yoksa meslek mensubunun kendi çıkarına bağlılığı mı?","paragraf":"m.21/e","yanilgi":"Şarta bağlı ücreti, baskı unsuru olduğu için yıldırma tehdidi sanıyorsun."},"B":{"gercek":"Madde 25/b, düşük ücret ödensin diye hizmet kapsamının uygunsuzca daraltılmasını doğrudan yıldırma tehdidi olarak sayar.","ayirt":"Baskının konusu doğrudan ücret ve iş kapsamı mı?","paragraf":"m.25/b","yanilgi":"Bu şıkkı es geçip daha tanıdık görünen azil tehdidini seçme eğilimindesin."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 103"},"kural":"3568 sayılı Kanunun 46 ncı maddesi, tarifedeki asgari miktar altında iş kabulünü yasaklar ve aksine hareketin disiplin cezasını gerektireceğini açıkça hükme bağlar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 103","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Süreç sorularında \u0027kim hazırlar, kim tespit eder, kim tasdik eder\u0027 sırasını zihinde üç kutuya ayır; kutuları karıştıran şık çeldiricidir.","konu":"ücret tarifesi esasları","tablo":{"satirlar":[["A) Tarifedeki asgari miktarın altında ücret karşılığında iş…","m.46","doğru ifade"],["B) Oda yönetim kurullarının hazırladığı tarifeler, Birliğin…","m.46","YANLIŞ ifade"],["C) Yeni tarife Resmi Gazete\u0027de yayımlanıncaya kadar geçen s…","m.46","YANLIŞ ifade"],["D) Tarife gruplarını tespit etme yetkisi Maliye Bakanlığına…","m.46","YANLIŞ ifade"],["E) Maliye Bakanlığı, Birlik tarafından gönderilen tarifeyi …","m.46","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yeni tarife Resmi Gazete\u0027de yayımlanıncaya kadar geçen sürede yürürlükte tarife bulunmadığından iş kabulü mümkün değildir.","E":"Maliye Bakanlığı, Birlik tarafından gönderilen tarifeyi yalnızca aynen onaylayabilir, üzerinde değişiklik yapma yetkisine sahip değildir.","A":"Tarifedeki asgari miktarın altında ücret karşılığında iş kabul edilmesi, meslek mensubu hakkında disiplin cezası uygulanmasını gerektirir.","D":"Tarife gruplarını tespit etme yetkisi Maliye Bakanlığına ait olup Birlik yönetim kurulu bu grupları yalnızca onaylar.","B":"Oda yönetim kurullarının hazırladığı tarifeler, Birliğin değerlendirmesine gerek kalmaksızın doğrudan Resmi Gazete\u0027de yayımlanarak yürürlüğe girer."},"kaynak":{"alinti":"tarifedeki asgari miktar altında ücret karşılığında iş kabulü yasak olup, aksine hareket disiplin cezasını gerektirir","liste":[{"ad":"SMMM K. (3568 s.K.) m.46","metin":"Madde 46 – Ücret meslek mensuplarının hizmetlerine karşılık olan meblağı ifade eder. Ücretin asgari miktarı tarife ile belirlenir. Tarifedeki asgari miktar altında ücret karşılığında iş kabulü yasak olup, aksine hareket disiplin cezasını gerektirir. Her odanın yönetim kurulu, her yıl ocak ayından geçerli olmak üzere (…)21 serbest muhasebeci mali müşavirler ve yeminli mali müşavirlerin yapacakları iş ve işlemler karşılığında alacakları ücretleri gösterir birer tarife hazırlayarak Birliğe gönderir. Birlik yönetim kurulu, oda yönetim kurullarının tekliflerini de gözönüne almak suretiyle çeşitli odaları içine alacak grupları tespit ve gruplarda uygulanacak tarifeleri hazırlayarak Maliye Bakanlığına gönderir. Maliye Bakanlığı tarifeyi aynen veya gerekli gördüğü değişikliklerle tasdik eder. Tarifeler Resmi Gazete\u0027de yayımlanarak yürürlüğe girer. Yeni tarifenin tasdikine kadar mevcut tarife hükmü uygulanır. Görevle ilgili suçlar"}],"hakem":"Doğru sık, 3568 sayılı Kanun m.46\u0027da açıkça yer alan \u0027tarifedeki asgari miktar altında ücret karşılığında iş kabulü yasak olup, aksine hareket disiplin cezasını gerektirir\u0027 hükmüne dayanmaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2023/3"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre ücret tarifesinin hazırlanma süreci ile tarife altı ücretle iş kabulünün sonuçlarına ilişkin aşağıdakilerden hangisi her zaman doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-05","verilenler":[],"dayanak":"3568 sayılı Kanun m.46","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir SMMM bürosu, 2024 tarifesine göre bir şirketin defter tutma işini asgari 12.000 TL yerine 7.000 TL\u0027ye kabul ediyor.","anlatim":"Bu meslek mensubu tarifede yazan asgari tutarın altına iniyor. Aynı olayda ücret tarifesinin nasıl hazırlandığını da göreceğiz. Şimdi bu tek olayı beş şıkla test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 7.000 TL\u0027lik iş kabulünün sonucu ile tarifenin hazırlanma-onaylanma zinciri arasındaki ilişkiyi kuracağız.","anlatim":"Kural şu: asgari altı ücret yasak ve disiplin cezası doğurur; tarife, oda-Birlik-Maliye Bakanlığı zincirinden geçerek Resmî Gazete\u0027de yürürlüğe girer. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.46","karar":"doğru","anlatim":"Olayda asgari 12.000 TL\u0027nin altına inilmiş, bu açık bir ihlaldir. Madde 46 istisna tanımadan bu davranışın disiplin cezası gerektirdiğini söylüyor.","formul":"Şık A: bürodaki 7.000 TL\u0027lik iş kabulü nedeniyle meslek mensubuna disiplin cezası uygulanır mı, her zaman mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.46","karar":"yanlış","anlatim":"Olayda oda tarifeyi Birliğe gönderiyor, Birlik grupları tespit edip Maliye Bakanlığına iletiyor. Odanın belgesi tek başına yürürlüğe giremez, iki makamdan daha geçer.","formul":"Şık B: Ankara Odasının hazırladığı tarife, Birliğe uğramadan doğrudan Resmî Gazete\u0027ye gider mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.46","karar":"yanlış","anlatim":"Olayda büro zaten 2024 tarifesiyle çalışıyor, boşluk yok. Kanun yeni tarifenin tasdikine kadar mevcut tarifenin uygulanmaya devam edeceğini söyler.","formul":"Şık C: yeni tarife Resmî Gazete\u0027de yayımlanana kadar büro hiç iş kabul edemez mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.46","karar":"yanlış","anlatim":"Olayda grupları tespit eden Birlik yönetim kuruludur, Bakanlık sadece tasdik makamıdır. Yetki dağılımı tam tersinedir.","formul":"Şık D: grupları tespit etme işini Maliye Bakanlığı yapıp Birlik yalnızca onaylıyor mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.46","karar":"yanlış","anlatim":"Olayda gönderilen tarife Bakanlığa ulaştığında Bakanlık üzerinde değişiklik yapabilir. Madde 46 açıkça \"aynen veya gerekli gördüğü değişikliklerle\" der.","formul":"Şık E: Bakanlık, Birlik\u0027ten gelen tarifeyi olduğu gibi kabul etmek zorunda mı, değiştiremez mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Bu olayda tek istisnasız kural asgari altı ücretin cezası, diğer her şey makamlar arası paylaşımla ilgili ve hepsi çift yönlü işliyor. Kendine sor: bu kural için kanunda bir istisna cümlesi var mı, yoksa iki makam mı işin içinde?","doldur":[]}],"anahtar":[{"ornek":"tarife","kok":"tarife"},{"ornek":"olayda","kok":"olayda"},{"ornek":"bakanlık","kok":"bakanl"},{"ornek":"asgari","kok":"asgari"},{"ornek":"cezası","kok":"cezası"},{"ornek":"istisnasız","kok":"istisn"}],"konuGiris":{"harita":"Ne zaman test edilir: Tarifenin hazırlanma sürecinin sırası ve tarife altı ücretle iş kabulünün sonucu sorulduğunda test edilir. Nasıl ölçülür: Madde 46\u0027daki oda-Birlik-Bakanlık zinciri ile disiplin cezası sonucunun doğru eşleştirilmesiyle ölçülür. Nasıl kaydedilir: Bu bilgi kanun maddesi olarak ezbere bilinmesi gereken bir kural şeklinde kayıtlıdır.","desen":"Sınav genelde tarifeyi kimin onayladığını (Maliye Bakanlığı) ve sürecin sırasını karıştırarak sorar; öğrenciler Birlik ile Bakanlık rollerini karıştırır. Bir diğer tuzak, tarife altı ücretle iş kabulünün \u0027geçersiz sözleşme\u0027 değil \u0027disiplin cezası\u0027 sonucu doğurduğunu unutmaktır. Bu soru m.46 hükmündeki süreç ve yaptırım noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensuplarının alacağı en düşük ücreti gösteren resmi belge","ad":"Asgari ücret tarifesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kendi bölgesindeki tarife taslağını hazırlayıp Birliğe gönderen organ","ad":"Oda yönetim kurulu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Oda tekliflerini birleştirip gruplara göre tarife hazırlayan üst organ","ad":"Birlik yönetim kurulu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Asgari tutarın altında iş kabulünün disiplin cezasını gerektiren yasak durumu","ad":"Tarife altı ücret yasağı","kim":"kanun sabitler"}],"sinavda":"Soruda tarife hazırlama sürecinin aşamaları ve tarife altı ücretle iş kabulünün sonucu anlatılır, hangi ifadenin her zaman doğru olduğu istenir.","panel_ornek":"Bir apartmanda yöneticiler önce kendi aralarında aidat miktarını belirleyip yönetim kuruluna öneriyor, kurul da bunu onaylıyor. Diyelim aidat 50 lira olarak belirlendi ve bu tutarın altında ödeme kabul edilmiyor. Birisi 30 liraya razı olursa, kurallara aykırı davranmış sayılıyor.","ornek":"Bir apartmanda yöneticiler önce kendi aralarında aidat miktarını belirleyip yönetim kuruluna öneriyor, kurul da bunu onaylıyor. Diyelim aidat 50 lira olarak belirlendi ve bu tutarın altında ödeme kabul edilmiyor. Birisi 30 liraya razı olursa, kurallara aykırı davranmış sayılıyor.","yontemler":"Süreci oda→Birlik→Maliye Bakanlığı sırasıyla ezberle; tarife altı ücretle iş kabulünün sonucu her zaman disiplin cezasıdır, başka seçenek doğru olamaz.","nedir":"Ücret tarifesi, meslek mensuplarının alacağı asgari ücreti belirleyen resmi bir belgedir. Sınav bu tarifenin kimler tarafından hazırlanıp onaylandığını ve altında iş kabulünün sonucunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Yürürlük Boşluğu Tuzağı","metin":"yeni tarife yayımlanana kadar hiçbir tarifenin geçerli olmadığını sanırsın. Doğrusu: yeni tarifenin tasdikine kadar mevcut (eski) tarife hükmü uygulanmaya devam eder, boşluk oluşmaz."},"E":{"ad":"Yetki Kapsamı Daraltma Tuzağı","metin":"Bakanlığın yalnızca kabul/ret yapabildiğini, değişiklik yapamayacağını düşünürsün. Doğrusu: Bakanlık tarifeyi aynen veya gerekli gördüğü değişikliklerle tasdik edebilir."},"D":{"ad":"Yetki Ters Çevirme Tuzağı","metin":"grup tespitini Bakanlığa, onayı Birliğe verirsin. Doğrusu: grupları tespit eden Birlik yönetim kuruludur; Maliye Bakanlığı bu tarifeyi tasdik eder."},"B":{"ad":"Aşama Atlama Tuzağı","metin":"oda tarifesinin doğrudan Resmi Gazete\u0027ye gittiğini, Birlik onayının gereksiz olduğunu düşünürsün. Doğrusu: oda tarifeleri önce Birliğe gönderilir, Birlik grupları tespit edip Maliye Bakanlığına iletir; Resmi Gazete\u0027ye giden budur."}},"celdiriciYol":{},"hap":"Asgari ücret altında iş kabulü istisnasız disiplin cezası doğurur; tarife süreci oda-Birlik-Bakanlık sırasıyla işler ve yeni tarife yürürlüğe girene kadar eski tarife geçerliliğini korur.","teshis":{"C":{"gercek":"Kanun, yeni tarifenin tasdikine kadar mevcut tarifenin uygulanmaya devam edeceğini açıkça belirtir; süreklilik esastır.","ayirt":"Kanun metninde \u0027yeni tarifenin tasdikine kadar\u0027 ifadesinden sonra ne söyleniyor?","paragraf":"3568 sayılı Kanun m.46","yanilgi":"Tarife değişiminde eski hükmün otomatik olarak kalkacağını sanıyorsun."},"E":{"gercek":"Madde 46, Bakanlığın tarifeyi \u0027aynen veya gerekli gördüğü değişikliklerle\u0027 tasdik edebileceğini açıkça belirtir.","ayirt":"Kanun metninde tasdik fiilinden önce hangi iki seçenek birlikte sayılıyor?","paragraf":"3568 sayılı Kanun m.46","yanilgi":"Bakanlığın rolünü yalnızca bir onay mekanizması sanıp değişiklik yetkisini gözden kaçırıyorsun."},"A":{"gercek":"Madde 46 açıkça \u0027tarifedeki asgari miktar altında ücret karşılığında iş kabulü yasaktır, aksine hareket disiplin cezasını gerektirir\u0027 der; istisna tanımaz.","ayirt":"Bu kural için kanunda herhangi bir istisna cümlesi var mı?","paragraf":"3568 sayılı Kanun m.46","yanilgi":"Bu kuralın bazı istisnalarının olabileceğini, örneğin küçük işlerde asgari altı ücretin tolere edilebileceğini düşünüyorsun."},"D":{"gercek":"Grupları tespit eden ve tarifeleri hazırlayan Birlik yönetim kuruludur; Bakanlığın rolü tasdiktir.","ayirt":"Grup tespiti ile tasdik, aynı makamın işi mi yoksa iki ayrı makamın işi mi?","paragraf":"3568 sayılı Kanun m.46","yanilgi":"Nihai onay makamı olan Bakanlığın, sürecin her aşamasında da karar verici olduğunu düşünüyorsun."},"B":{"gercek":"Oda tarifeleri Birliğe, Birlik de grupları tespit ederek Maliye Bakanlığına gönderir; yürürlük Bakanlık tasdikinden sonra Resmi Gazete ile olur.","ayirt":"Odanın hazırladığı belge, yürürlüğe girmeden önce kaç makamdan geçiyor?","paragraf":"3568 sayılı Kanun m.46","yanilgi":"Odanın tarife hazırlama yetkisini, tarifenin doğrudan yürürlüğe girme yetkisiyle karıştırıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 104"},"kural":"3568 sayılı Kanunun 12 nci maddesinin son fıkrası, tasdikten doğan mali sorumluluk ile disiplin sorumluluğunun ayrı ayrı müstakil raporla tespitini ve bu kapsamda yazılı savunma istenmesini emreder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 104","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Aynı fıkrada iki şart geçiyorsa (rapor ayrılığı + savunma) şıkları ikisini de karşılayıp karşılamadığına göre tek tek ele.","konu":"disiplin kovusturmasi","tablo":{"satirlar":[["A) Disiplin kovuşturması yapılması konusunda karar verecek …","m.50/1-k","YANLIŞ ifade"],["B) Haksız Rekabet ve Reklam Yasağı Yönetmeliği hükümlerine …","Haksız Rekabet ve Reklam Yasağı Yön. m.32","YANLIŞ ifade"],["C) Yeminli mali müşavirlerin tasdikten doğan mali sorumlulu…","3568 s.K. m.12/son fıkra","YANLIŞ ifade"],["D) Yeminli mali müşavir hakkında sorumluluk raporu düzenlen…","3568 s.K. m.12/son fıkra","YANLIŞ ifade"],["E) Yeminli mali müşavirlerin tasdikten doğan mali sorumlulu…","3568 s.K. m.12/son fıkra","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları tek bir raporda birlikte tespit edilir ve bu kapsamda yazılı savunma alınmasına gerek yoktur.","E":"Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları ayrı ayrı müstakil bir raporla tespit edilir; bu kapsamda yeminli mali müşavirin yazılı savunması istenir.","A":"Disiplin kovuşturması yapılması konusunda karar verecek merci ile disiplin cezalarını vermeye yetkili merciler, Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununda doğrudan sayılmıştır.","D":"Yeminli mali müşavir hakkında sorumluluk raporu düzenlenebilmesi için ilgilinin yazılı savunmasının istenmesi zorunlu değildir, rapor doğrudan yazılabilir.","B":"Haksız Rekabet ve Reklam Yasağı Yönetmeliği hükümlerine aykırılık, odalarca ancak ilgilinin şikayeti üzerine soruşturma konusu yapılabilir; resen soruşturma başlatılamaz."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.12 [1/2]","metin":"Madde 12 – Yeminli mali müşavirler gerçek ve tüzelkişilerin veya bunların teşebbüs ve işletmelerinin mali tablolarının ve beyannamelerinin mevzuat hükümleri, muhasebe prensipleri ile muhasebe standartlarına uygunluğunu ve hesapların denetim standartlarına göre incelediğini tasdik ederler. Yeminli mali müşavirlerin tasdik edecekleri belgeler, tasdik konuları ile tasdike ilişkin usul ve esaslar; gerçek ve tüzelkişilerin mükellefiyet şekilleri, iş kolları ve ciroları, döviz kazandırıcı işlemleri, ithalat ve ihracatları, yatırımın miktarları ve nevileri ile belgelerin ibraz edileceği merciler esas alınmak suretiyle Maliye Bakanlığınca çıkarılacak yönetmeliklerle belirlenir. Kanunları gereğince, kamu kurum ve kuruluşlarına verilen tasdik edilmiş mali tablolar, kamu idaresinin yetkili memurlarınca, tasdikin kapsamı ölçüsünde incelenmiş bir belge olarak kabul edilir. Ancak, çeşitli kanunlarla kamu idaresine tanınan teftiş ve inceleme yetkilerinin kullanılmasına ve gerektiğinde tekrarına ait hususlar saklıdır. Yeminli mali müşavirler yaptıkları tasdikin doğruluğundan sorumludurlar. Yaptıkları tasdikin doğru olmaması halinde, tasdikin kapsamı ile sınırlı olmak üzere, ziyaa uğratılan vergilerden ve kesilecek cezalardan mükellefle birlikte müştereken ve müteselsilen sorumlu olurlar. Yeminli mali müşavirler yaptıkları tasdikin kapsamını düzenleyecekleri raporda açıkca belirtirler. (Ek fıkra: 10/9/2014-6552/107 md.) Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları ayrı ayrı müstakil bir rapor ile tespit edilir. Bu kapsamda yeminli mali müşavir ha…"},{"ad":"SMMM K. (3568 s.K.) m.12 [2/2]","metin":"Savunma isteme yazısının tebliğ tarihinden itibaren otuz gün içinde savunma yapılmaması durumunda ilgili yeminli mali müşavir savunma hakkından vazgeçmiş sayılır. Bu Kanun hükümlerine göre meslek icra edenlerin vergi kanunları ve diğer kanunlardaki sorumlulukları saklıdır. Meslekle ilgili konularda çalıştırılmayacak olanlar"}],"hakem":"3568 s.K. m.12/son fıkrası kaynakta açıkça, tasdikten doğan mali sorumluluk ile disiplin sorumluluğunun ayrı ayrı müstakil rapor ile tespitini ve yazılı savunma istenmesini emretmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2020/3"]},"oyun":null,"tip":"teori","soru":"Yeminli mali müşavirlerin disiplin kovuşturmasına ilişkin usul ve esaslara göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-07","verilenler":[],"dayanak":"3568 s.K. m.12/son fıkra; m.50/1-k; Haksız Rekabet ve Reklam Yasağı Yön. m.32","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ahmet Bey, yeminli mali müşavir; 2019 yılında bir inşaat şirketinin mali tablolarını tasdik etmiş. Sonradan Maliye Bakanlığı incelemesinde 850.000 TL vergi ziyaına yol açan hatalı tasdik tespit edilmiş, aynı zamanda mesleki dürüstlüğe aykırı davranış iddiası da gündeme gelmiş.","anlatim":"Şimdi Ahmet Bey hakkında iki ayrı iddia var: biri tasdikten doğan mali sorumluluk, öteki disiplin. İkisi tek olayda birleşiyor ama kanun ikisine ayrı davranıyor.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun m.12 son fıkrasına göre Ahmet Bey\u0027in iki sorumluluğu ayrı ayrı müstakil raporla tespit edilecek, ayrıca sorumluluk raporu yazılmadan önce Ahmet Bey\u0027in yazılı savunması istenecek.","anlatim":"Beş ifadeyi bu olayda tek tek deneyeceğiz: hangisi Ahmet Bey\u0027in durumunu doğru anlatıyor?","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.50/1-k","karar":"yanlış","anlatim":"Hayır, Kanun m.50/1-k bu merci ve usul işini yönetmeliğe bırakıyor. Kanun sadece çerçeve çiziyor, ismen saymıyor.","formul":"Şık A: birisi sana \u0027Ahmet Bey hakkında kimin karar vereceği, disiplin cezasını kimin vereceği Kanunun kendi metninde tek tek sayılmış\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Haksız Rekabet ve Reklam Yasağı Yön. m.32","karar":"yanlış","anlatim":"Hayır, Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.32 odaya hem resen hem şikayetle soruşturma açma yetkisi veriyor. Şikayet şart değil.","formul":"Şık B: Ahmet Bey\u0027in haksız rekabet yaptığı iddiası varsa, oda ancak birisi şikayet ederse mi harekete geçebilir?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"3568 s.K. m.12/son fıkra","karar":"yanlış","anlatim":"Hayır, m.12 son fıkra iki sorumluluğu ayrı müstakil raporla ister; savunma da şart, atlanamaz.","formul":"Şık C: müfettiş \u0027ikisini tek raporda toplayalım, savunma almaya gerek yok\u0027 derse, doğru mu olur?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"3568 s.K. m.12/son fıkra","karar":"yanlış","anlatim":"Hayır, Kanun açıkça sorumluluk raporu yazılabilmesini yazılı savunmanın istenmesi şartına bağlıyor. Savunma istenmeden yazılan rapor usulsüz olur.","formul":"Şık D: birisi \u0027savunma istemeden de sorumluluk raporu yazılabilir\u0027 derse, buna katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"3568 s.K. m.12/son fıkra","karar":"doğru","anlatim":"Evet, tam da m.12 son fıkranın emrettiği şey bu: ayrı müstakil rapor artı yazılı savunma şartı. İkisi birlikte gerçekleşmeli.","formul":"Şık E: Ahmet Bey için mali sorumluluk raporu ile disiplin raporu ayrı ayrı yazılıp, rapor yazılmadan önce kendisinden yazılı savunma istenirse usule uygun mu olur?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Tek doğru cümle şu: iki sorumluluk ayrı raporla tespit edilir ve savunma mutlaka istenir. Kendine hep şunu sor: bu şıkta hem \u0027ayrı rapor\u0027 hem \u0027savunma istendi\u0027 ikisi birden var mı?","doldur":[]}],"anahtar":[{"ornek":"sorumluluğu","kok":"soruml"},{"ornek":"savunması","kok":"savunm"},{"ornek":"raporla","kok":"raporl"},{"ornek":"yazılı","kok":"yazılı"},{"ornek":"müstakil","kok":"müstak"},{"ornek":"istenmesini","kok":"istenm"}],"konuGiris":{"harita":"Ne zaman savunma istenir: yeminli mali müşavir hakkında sorumluluk raporu yazılmadan önce yazılı savunması istenir. Nasıl süre işler: tebliğden itibaren otuz gün içinde savunma yapılmazsa savunma hakkından vazgeçilmiş sayılır. Nasıl kovuşturma merci belirlenir: disiplin kovuşturmasına karar verecek merci ve itiraz usulü kanunla değil yönetmelikle düzenlenir.","desen":"Sınav genelde otuz günlük savunma süresini veya bu sürenin geçirilmesinin sonucunu şık olarak sorar. Bir başka tuzak, disiplin kovuşturma merciinin kanunda değil yönetmelikle belirlendiğini karıştırmaktır. Bu soru m.12 ve m.50/k noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"tasdikten doğan mali ve disiplin sorumluluğunu ayrı ayrı tespit eden belge","ad":"sorumluluk raporu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"tebliğden itibaren otuz günlük yazılı savunma verme süresi","ad":"savunma süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"kovuşturmaya karar verecek ve ceza verecek yetkili kurul","ad":"disiplin kovuşturması mercii","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"disiplin cezasına karşı yapılacak itirazın şekil ve şartları","ad":"itiraz usulü","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soruda disiplin kovuşturması usulüne dair bir ifade verilir ve doğru/yanlış seçenek istenir.","panel_ornek":"Bir öğrenci okulda kurallara aykırı davrandığında önce ona 10 gün içinde yazılı savunma istenir, cevap gelmezse hakkından vazgeçmiş sayılır. Sonra okul disiplin kurulu dosyayı inceleyip karar verir. Süreç hep aynı sırayla işler: önce savunma, sonra karar.","ornek":"Bir öğrenci okulda kurallara aykırı davrandığında önce ona 10 gün içinde yazılı savunma istenir, cevap gelmezse hakkından vazgeçmiş sayılır. Sonra okul disiplin kurulu dosyayı inceleyip karar verir. Süreç hep aynı sırayla işler: önce savunma, sonra karar.","yontemler":"Savunma süresinin otuz gün olduğu ve bu sürenin geçmesiyle savunma hakkının düşeceği kuralı ezberlenmelidir.","nedir":"Yeminli mali müşavirlerin tasdik faaliyeti nedeniyle disiplin sorumluluğunun nasıl işletileceğini düzenleyen usuldür. Sınav, savunma süresi ve kararı verecek merciin kanunda mı yönetmelikte mi belirlendiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Çift Katman Atlama Tuzağı","metin":"Öğrenci hem rapor birliğini hem savunma şartının yokluğunu aynı anda kabul ederek iki farklı kuralı birden yanlış kurar. Doğrusu: 3568 sayılı Kanunun 12 nci maddesinin son fıkrasına göre iki sorumluluk ayrı ayrı müstakil raporla tespit edilir ve savunma istenir."},"A":{"ad":"Merci Tuzağı","metin":"Öğrenci disiplin kovuşturmasına ilişkin merci ve usul kurallarının Kanunun kendisinde sayıldığını sanır. Doğrusu: 3568 sayılı Kanunun 50 nci maddesinin birinci fıkrasının (k) bendine göre bu husus çıkarılacak yönetmelikle düzenlenir, Kanun yalnız yetki verir."},"D":{"ad":"Savunma Şartı Tuzağı","metin":"Öğrenci rapor ayrılığını doğru bilse de savunma alınmasının zorunlu olmadığını düşünür. Doğrusu: Sorumluluk raporu yazılabilmesi için yeminli mali müşavirin yazılı savunmasının istenmesi Kanunda açıkça şart koşulmuştur."},"B":{"ad":"Eksik Okuma Tuzağı","metin":"Öğrenci maddedeki iki seçenekten yalnız birini, şikayeti, hatırlar ve resen başlatmayı gözden kaçırır. Doğrusu: Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.32 uyarınca soruşturma odalarca resen veya şikayet üzerine başlatılır."}},"celdiriciYol":{},"hap":"Yeminli mali müşavirin tasdikten doğan mali sorumluluğu ile disiplin sorumluluğu ayrı müstakil raporla tespit edilir ve rapor öncesi yazılı savunması istenir.","teshis":{"C":{"gercek":"3568 s.K. m.12 son fıkra iki sorumluluğu ayrı müstakil raporlarla tespit eder ve sorumluluk raporu için yazılı savunma şartı koşar.","ayirt":"Rapor tek mi ayrı mı, savunma isteniyor mu istenmiyor mu - iki soruyu birden sor kendine.","paragraf":"3568 s.K. m.12/son fıkra","yanilgi":"İki farklı sorumluluk türünün pratiklik gereği tek raporda toplanabileceğini ve savunmanın formalite olduğunu düşünüyorsun."},"E":{"gercek":"3568 s.K. m.12 son fıkra, iki katmanı birlikte kurar: ayrı müstakil rapor + yazılı savunma şartı.","ayirt":"Fıkrayı iki cümleye bölüp her ikisini de karşıladım mı?","paragraf":"3568 s.K. m.12/son fıkra","yanilgi":"Bu şıkkı eleyen öğrenci, rapor ayrılığı ile savunma şartının aynı fıkrada birlikte düzenlendiğini fark edemez, ikisinden birini eksik okur."},"A":{"gercek":"3568 sayılı Kanun m.50/1-k bu hususları düzenlemeyi yönetmeliğe bırakır; Kanun yalnız çerçeve çizer.","ayirt":"Bu kural Kanunun kendisinde mi, yoksa \u0027yönetmelikle düzenlenir\u0027 ibaresiyle mi geçiyor?","paragraf":"3568 s.K. m.50/1-k","yanilgi":"Disiplin kovuşturmasına ilişkin merci ve usul kurallarının Kanun metninde tek tek sayıldığını sanıyorsun."},"D":{"gercek":"Kanun, sorumluluk raporu yazılabilmesini yazılı savunmanın istenmesi şartına açıkça bağlamıştır.","ayirt":"Savunma istenmeden düzenlenen bir sorumluluk raporu usulüne uygun müdür?","paragraf":"3568 s.K. m.12/son fıkra","yanilgi":"Rapor ayrılığını doğru bilsen de savunmanın isteğe bağlı bir nezaket olduğunu sanıyorsun."},"B":{"gercek":"Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.32, odalara hem resen hem şikayet üzerine soruşturma başlatma yetkisi tanır.","ayirt":"Madde metninde \u0027resen veya\u0027 ibaresi var mı, yoksa yalnız \u0027şikayet üzerine\u0027 mi yazıyor?","paragraf":"Haksız Rekabet ve Reklam Yasağı Yön. m.32","yanilgi":"Disiplin soruşturmasının yalnızca şikayet üzerine başlayabileceğini, idarenin kendiliğinden harekete geçemeyeceğini sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 101"},"kural":"213 sayılı değil, 3568 sayılı Kanunun 4 üncü maddesinin (d) bendi rüşvet dahil sayılan suçlarda ceza süresi veya türüne bakılmaksızın, affa uğramış olsa bile mahkumiyetin geçerliliğini korur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 101","sonDonem":2,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 4/d sorularında önce \u0027suç kasten mi işlenmiş\u0027 sonra \u0027bu suç kanunun tek tek saydığı özel listede mi\u0027 sorusunu sor; ikisine de evet değilse süre ve af durumuna bak.","konu":"meslek mensubu olma engelleri","tablo":{"satirlar":[["VERİLENLER","-","-"],["A şıkkı ceza süresi","2 yıl","-"],["B şıkkı ceza süresi","4 yıl","-"],["HESAP","-","-"],["A) Kasten yaralama suçundan verilen 2 yıllık hapis cezası, …","p.4/d","YANLIŞ ifade"],["B) Taksirle ölüme sebebiyet verme suçundan verilen 4 yıllık…","p.4/d","YANLIŞ ifade"],["C) Rüşvet suçundan verilen adli para cezası, sonradan çıkar…","p.4/d","doğru ifade"],["D) Zimmet suçu nedeniyle açılan davada hükmün açıklanmasını…","p.4/d","YANLIŞ ifade"],["E) Meslek şeref ve haysiyetine uymayan bir eylem nedeniyle …","p.4/f","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Rüşvet suçundan verilen adli para cezası, sonradan çıkarılan genel af kanunuyla ortadan kaldırılmıştır.","E":"Meslek şeref ve haysiyetine uymayan bir eylem nedeniyle yürütülen disiplin soruşturması sonucunda uyarma cezası verilmiştir.","A":"Kasten yaralama suçundan verilen 2 yıllık hapis cezası, sonradan çıkarılan genel af kanunuyla ortadan kaldırılmıştır.","D":"Zimmet suçu nedeniyle açılan davada hükmün açıklanmasının geri bırakılmasına karar verilmiştir.","B":"Taksirle ölüme sebebiyet verme suçundan verilen 4 yıllık hapis cezası, sonradan çıkarılan genel af kanunuyla ortadan kaldırılmıştır."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"}],"hakem":"3568 sayılı Kanun m.4/d\u0027de rüşvet suçundan mahkumiyet, af kanunuyla ortadan kaldırılsa bile meslek mensubu olmaya engel teşkil etmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2017/3"]},"oyun":null,"tip":"teori","soru":"Bir kişi hakkında verilen mahkûmiyetlerden hangisi, ceza affa uğramış olsa dahi 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu uyarınca meslek mensubu olmaya engel teşkil eder?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-08","verilenler":[{"deger":"2 yıl","anlam":"Kasten yaralama suçu için verilen hapis cezası süresidir; genel bir yıl eşiğini aşar ama suç özel sayılan suçlar listesinde olmadığından af ile bu engel kalkabilir.","ad":"A şıkkı ceza süresi"},{"deger":"4 yıl","anlam":"Taksirle ölüme sebebiyet verme suçu için verilen hapis cezası süresidir; ancak suç taksirle işlendiği için madde 4/d kapsamı dışındadır, süre önemsizdir.","ad":"B şıkkı ceza süresi"}],"dayanak":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu m.4/d","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir belediye ihalesinde görevli memur Kemal, 2015 yılında 50.000 TL rüşvet aldığı için yargılanmış ve adli para cezasına mahkûm olmuştur. 2018\u0027de çıkan bir genel af kanunuyla bu ceza tamamen ortadan kaldırılmıştır. Kemal şimdi meslek mensubu olmak için başvuruyor.","anlatim":"Kemal\u0027in dosyasında beş ayrı ihtimali sırayla test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun m.4/d, sayılan suçlarda (rüşvet dahil) affa uğramış olsa bile mahkûmiyetin engel sayılacağını söyler; kasıtlı diğer suçlarda ise bir yıl veya daha fazla hapis şartı aranır, taksirli suçlar zaten kapsam dışıdır. Şimdi beş ifadeyi Kemal\u0027in olayına göre değil, olayın kuralına göre tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"p.4/d","karar":"yanlış","anlatim":"Kasten yaralama sayılan özel suçlar listesinde yoktur, sadece süre ölçütüne tabidir. Af, bu genel kasıtlı suçtaki engeli kaldırır. Bu yüzden bu ifade doğru bir engelden söz etmez.","formul":"Şık A: kasten yaralamadan 2 yıl hapis alan biri, af çıkınca temiz sayılır mı der misin?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"p.4/d","karar":"yanlış","anlatim":"Madde açıkça \u0027kasten işlenen suç\u0027 der, taksirli suç bu kapsamın dışındadır. Süre uzun olsa da taksirli olduğu için zaten şart aranmaz, af bunu değiştirmez.","formul":"Şık B: taksirle ölüme sebep olup 4 yıl hapis alan biri, af sonrası mesleğe girebilir mi dersin?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"p.4/d","karar":"doğru","anlatim":"Rüşvet, kanunun tek tek saydığı özel suçlar listesindedir; ceza türü veya süresi aranmaz. Af olsa bile mahkûmiyet geçerliliğini korur, engel kalkmaz.","formul":"Şık C: rüşvetten adli para cezası alan Kemal\u0027in cezası affa uğramış, bu onu temize çıkarır mı?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"p.4/d","karar":"yanlış","anlatim":"HAGB kararında hukuken kesinleşmiş bir mahkûmiyet hükmü kurulmaz. Madde 4/d açıkça \u0027mahkûm olmamak\u0027 şartını arar, mahkûmiyet yoksa engel de yoktur.","formul":"Şık D: zimmet davasında hükmün açıklanması geri bırakılmışsa, bu bir mahkûmiyet sayılır mı?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.4/f","karar":"yanlış","anlatim":"Uyarma, hafif bir disiplin cezasıdır, ceza mahkûmiyeti değildir. Madde 4/d ceza mahkûmiyetini düzenler, bu yüzden uyarma tek başına kalıcı engel oluşturmaz.","formul":"Şık E: meslek haysiyetine aykırı davranıştan uyarma cezası alan biri, bu yüzden mesleğe giremez mi?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Yalnız rüşvet gibi kanunun tek tek saydığı özel suçlarda af, süre ve ceza türü hiçbir şeyi değiştirmez. Kendine sor: bu suç kanunun saydığı özel listede mi, yoksa genel kasıtlı suç ölçütüne mi tabi?","doldur":[]}],"anahtar":[{"ornek":"suçlar","kok":"suçlar"},{"ornek":"kanunun","kok":"kanunu"},{"ornek":"rüşvet","kok":"rüşvet"},{"ornek":"saydığı","kok":"saydığ"},{"ornek":"sayılı","kok":"sayılı"},{"ornek":"sayılan","kok":"sayıla"}],"konuGiris":{"harita":"Ne zaman test edilir: meslek mensubu olma başvurusu ya da ruhsat değerlendirmesi sırasında test edilir. Nasıl ölçülür: kişinin sabıka kaydındaki suç türü ve ceza süresi ile ölçülür. Nasıl kaydedilir: engel teşkil eden mahkumiyet, affa uğrasa dahi kalıcı bir engel olarak kayıtlarda yer alır.","desen":"Sınav genelde \u0027affa uğramış olsa bile\u0027 ifadesini vurgulayarak öğrencinin bu istisnayı unutup unutmadığını test eder. Şıklarda bir yüz kızartıcı suç ile sıradan bir suç (örneğin taksirle yaralama) karıştırılır. Bu soru SMMM K. m.4/d fıkrasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Kasıtla işlenip bir yıl veya fazla hapisle sonuçlanan suç engel sayılır","ad":"Kasten işlenen suç - 1 yıl ve üzeri hapis","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Cezanın affedilmesi bazı suçlarda engeli ortadan kaldırmaz","ad":"Affa uğrama","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Zimmet, rüşvet, dolandırıcılık gibi kanunda sayılan özel suç grubu","ad":"Yüz kızartıcı suçlar listesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ceza infazı sonrası hak yoksunluğunun süresini belirleyen madde","ad":"TCK m.53 süreleri","kim":"kanun sabitler"}],"sinavda":"Soruda birkaç farklı mahkumiyet türü verilir, hangisinin affa rağmen meslek mensubu olmaya engel olduğu sorulur.","panel_ornek":"Bir arkadaşın kirayı 3 ay üst üste ödemeyince ev sahibi onunla yeni sözleşme yapmak istemiyor; geçmişteki \u0027güven kırılması\u0027 hâlâ etkili sayılıyor. Zaman geçmiş olsa da bazı \u0027güvenilirlik lekeleri\u0027 silinmiyor.","ornek":"Bir arkadaşın kirayı 3 ay üst üste ödemeyince ev sahibi onunla yeni sözleşme yapmak istemiyor; geçmişteki \u0027güven kırılması\u0027 hâlâ etkili sayılıyor. Zaman geçmiş olsa da bazı \u0027güvenilirlik lekeleri\u0027 silinmiyor.","yontemler":"Şıklardaki suçu m.4/d\u0027de sayılan yüz kızartıcı suçlar listesiyle karşılaştır; listede olmayan taksirli suçları ve kısa süreli hapisleri ele.","nedir":"Bu konu, hangi mahkumiyetlerin kişiyi meslek mensubu olmaktan alıkoyduğunu düzenler. Sınav, affa uğrasa bile hangi suçların engel saydığını ayırt edip edemediğini ölçer."},"olay":"rüşvet sayılan suçlar listesindedir - af, süre, ceza türü hiçbiri engeli kaldırmaz.","tuzak":{"D":{"ad":"Mahkumiyet-HAGB Karıştırma Tuzağı","metin":"Hükmün açıklanmasının geri bırakılması kararında hukuken bir mahkumiyet hükmü kurulmuş sayılmaz, sanık hakkında ceza infaz edilmez. Doğrusu: madde 4/d \u0027mahkum olmamak\u0027 şartı arar, HAGB kararı bu şartı doğurmadığından engel oluşturmaz."},"E":{"ad":"Disiplin-Ceza Mahkumiyeti Karıştırma Tuzağı","metin":"Madde 4/d ceza mahkumiyetlerini düzenler; uyarma cezası ise meslek mensubunun kendi mesleği içindeki disiplin rejimine ilişkindir ve meslekten çıkarma dahi olmadıkça mesleğe giriş engeli doğurmaz. Doğrusu: hafif bir disiplin cezası bu bentteki mahkumiyet şartını karşılamadığından engel değildir."},"A":{"ad":"Genel-Özel Karışıklığı Tuzağı","metin":"Kasten yaralama, maddenin ayrıca saydığı zimmet, irtikap, rüşvet gibi özel suçlar listesinde yer almaz; bu suç yalnızca genel \u0027bir yıl veya daha fazla hapis\u0027 ölçütüyle engel oluşturur ve kanun bu genel ölçüt için \u0027affa uğrasa bile\u0027 güvencesini tekrarlamaz. Doğrusu: genel af bu suçun mahkumiyetini ortadan kaldırdığından artık engel değildir."},"B":{"ad":"Taksir-Kasıt Ayrımı Tuzağı","metin":"Madde 4/d yalnızca kasten işlenen suçları kapsar; taksirle işlenen bir suç, ceza süresi ne olursa olsun ve af olsun ya da olmasın bu bendin konusu dışındadır. Doğrusu: taksirli suç zaten engel teşkil etmediği için affa uğraması tartışmaya dahi konu olmaz."}},"celdiriciYol":{"D":"Dava açılmış olması ve zimmet fiilinin gerçekleşmesi, HAGB kararının da bir mahkumiyet hükmü olduğu sanılmasına yol açar","E":"Disiplin soruşturması sonucu verilen ceza, madde 4/d\u0027deki ceza mahkumiyetiyle aynı hukuki sonucu doğurduğu sanılarak yanlış eşleştirilir","A":"2 yıllık kasıtlı suç cezasının süre eşiğini aşması, sayılan özel suçlarla aynı güvenceye sahip olduğu izlenimini verir (genel-özel karışıklığı)","B":"4 yıllık uzun hapis cezası, taksir-kasıt ayrımı gözden kaçırılarak otomatik engel sanılır (taksirli suç kasıtlı suçla karıştırılır)"},"hap":"3568 sayılı Kanunun 4 üncü maddesinin (d) bendinde tek tek sayılan suçlar (zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye ve edimin ifasına fesat karıştırma, aklama, kaçakçılık) affa uğramış olsa dahi meslek mensubu olmaya engeldir; bunun dışındaki kasıtlı suçlarda engel yalnızca bir yıl veya daha fazla hapis cezası şartına bağlıdır ve genel af bu engeli kaldırabilir.","teshis":{"C":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"E":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"A":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"D":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"B":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""}},"verilen":[[1,1],[2,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 109"},"kural":"3568 sayılı Kanunun 48 inci maddesine göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası verilir; bu hükümde kanun koyucu ceza türünde takdir bırakmamıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Her zaman/kesin uygulanır\u0027 ifadesi geçen kökte, önce maddede o ceza için takdir mi zorunluluk mu öngörüldüğüne bak; \u0027uygulanabilir\u0027 ifadesini gördüğün şıkkı hemen ele.","konu":"mesleki davranış ilkesi","tablo":{"satirlar":[["A) Mükellefle birlikte kasden vergi ziyaına sebebiyet verdi…","m.48/2","doğru ifade"],["B) Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmaya…","m.48/1","YANLIŞ ifade"],["C) Mesleğin vakar ve onuruna aykırı fiilde ilk defa bulundu…","m.48/1","YANLIŞ ifade"],["D) Tasdik yetkisini gerçeğe aykırı kullandığı Maliye Bakanl…","m.48/1","YANLIŞ ifade"],["E) Üç yıllık bir dönem içinde iki veya daha fazla disiplin …","m.48/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Mesleğin vakar ve onuruna aykırı fiilde ilk defa bulunduğu tespit edilen meslek mensubuna.","E":"Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna.","A":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdiği mahkeme kararı ile kesinleşen meslek mensubuna.","D":"Tasdik yetkisini gerçeğe aykırı kullandığı Maliye Bakanlığınca ilk defa tespit edilip rapora bağlanan yeminli mali müşavire.","B":"Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayarak mesleğin genel prensiplerine aykırı hareket eden meslek mensubuna."},"kaynak":{"alinti":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"3568 sayılı Kanunun 48. maddesinin 2. fıkrasında \u0027Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir\u0027 hükmü açıkça yer almakta ve bu durumda cezada takdir yetkisi bulunmamaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununun disiplin cezalarına ilişkin hükümlerine göre, aşağıdaki durumlardan hangisinde meslek mensubuna meslekten çıkarma cezası HER ZAMAN uygulanır?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-11","verilenler":[],"dayanak":"3568 s. SMMM K. m.48","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Adana\u0027da SMMM Kemal, 2019 yılında bir tekstil firmasının sahibiyle anlaşıp faturaları kasden düşük gösteriyor, vergi ziyaına sebep oluyor. 2021\u0027de mahkeme bu suçu kesin hükümle onaylıyor.","anlatim":"Disiplin kurulu şimdi Kemal\u0027e ne ceza vereceğini konuşuyor. Beş ayrı ihtimali bu tek olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: madde 48\u0027e göre ceza, fiilin ağırlığına göre uyarmadan meslekten çıkarmaya kadar sıralanır; bazı fiillerde kurulun takdiri var, bazısında yok.","anlatim":"Kemal\u0027in olayı hangi bende girer, kurulun elini kolunu bağlayan bir hüküm var mı, bunu göreceğiz. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.48/2","karar":"doğru","anlatim":"Madde 48\u0027in ikinci fıkrası bu fiil için tek bir sonuç tanımlar, kurula seçenek bırakmaz. Kemal\u0027in kasden davranışı mahkemeyle kesinleştiği için sonuç doğrudan meslekten çıkarmadır.","formul":"Şık A: Kemal mükellefle birlikte kasden vergi ziyaına sebep olmuş ve bu durum mahkeme kararıyla kesinleşmiş; kurul burada ceza seçme hakkına sahip mi, yoksa doğrudan meslekten mi çıkarır?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.48/1","karar":"yanlış","anlatim":"Böyle bir ihlalde madde 48\u0027in ilk fıkrası geçici olarak mesleki faaliyetten alıkoymayı öngörür. Meslekten çıkarma bu fiil için kesin sonuç değildir.","formul":"Şık B: Kemal yalnızca tarafsızlık ve dürüstlük ilkesine aykırı davranmış olsaydı, bu tek başına meslekten çıkarmayı doğurur muydu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.48/1","karar":"yanlış","anlatim":"İlk defasında uyarma cezası uygulanır, ikinci defasında kınama gelir. Meslekten çıkarma bu fıkrada hiç yer almaz.","formul":"Şık C: Kemal mesleğin vakar ve onuruna aykırı bir fiili ilk kez işlemiş olsaydı, bu ilk seferde meslekten çıkarma gelir miydi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.48/1","karar":"yanlış","anlatim":"İlk tespitte geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Meslekten çıkarma değil, tekerrür edip mahkeme kararıyla kesinleşirse yeminli sıfatının kaldırılması gündeme gelir.","formul":"Şık D: Kemal yeminli mali müşavir olsaydı ve tasdik yetkisini Maliye Bakanlığı ilk kez tespit edip rapora bağlasaydı, bu ilk tespit meslekten çıkarma sonucu doğurur muydu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.48/2","karar":"yanlış","anlatim":"Kanun burada bir derece ağır ceza uygulanabileceğini söyler, ama bu kurulun takdirindedir. Zorunlu bir sonuç değildir, o yüzden \"her zaman\" ifadesine uymaz.","formul":"Şık E: Kemal üç yıl içinde iki ayrı disiplin cezası gerektiren fiil işlemiş olsaydı, bu durumda meslekten çıkarma kesin olarak mı uygulanır?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Kemal\u0027in olayında tek kesin sonuç, mahkeme kararıyla kesinleşmiş kasden vergi ziyaına bağlanan meslekten çıkarma cezasıdır. Kendine hep şunu sor: madde metni bu fiil için \"verilir\" mi diyor yoksa kurula \"takdir\" mi bırakıyor?","doldur":[]}],"anahtar":[{"ornek":"meslekten","kok":"meslek"},{"ornek":"çıkarma","kok":"çıkarm"},{"ornek":"mahkeme","kok":"mahkem"},{"ornek":"kesinleşmiş","kok":"kesinl"},{"ornek":"cezası","kok":"cezası"},{"ornek":"kasden","kok":"kasden"}],"konuGiris":{"harita":"Ne zaman test edilir: fiilin hangi disiplin cezasıyla eşleştiği sorulduğunda. Nasıl ölçülür: kanun metnindeki fiil-ceza eşleşmesinin doğru hatırlanmasıyla. Nasıl kaydedilir: disiplin kurulu kararı ve varsa mahkeme kararının kesinleşmesiyle.","desen":"Soru, hangi fiilin \u0027her zaman\u0027 meslekten çıkarma gerektirdiğini ayırt etmeyi ister; ilk kez yapılan ve tekerrür eden fiiller karıştırılır. Tuzak, kasıt ve mahkeme kararıyla kesinleşme şartının atlanmasıdır. Bu soru m.48 [2/2] fıkrasındaki \u0027mahkeme kararıyla kesinleşen vergi ziyaı\u0027 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Ruhsatın geri alınıp mesleğin bir daha icra edilememesi cezası.","ad":"Meslekten çıkarma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mükellefle birlikte kasıtlı vergi kaybına yol açma fiili, mahkeme kararıyla kesinleşir.","ad":"Vergi ziyaına kasden sebebiyet","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Altı ay ile bir yıl arasında meslek icrasının durdurulması cezası.","ad":"Geçici mesleki faaliyetten alıkoyma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Beş yılda iki kez alıkoyma cezası alanın fiili tekrarında verilen ağır ceza.","ad":"Tekerrür cezası","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soru, kanundaki disiplin cezalarını sıralar ve hangi fiilin kesin olarak meslekten çıkarmayı gerektirdiğini sorar.","panel_ornek":"Bir apartman yöneticisi parayı kötüye kullanırsa yönetim kurulu onu ilk seferde uyarır, tekrarında görevden alır. Ama yöneticinin sahte fatura ile hırsızlık yaptığı mahkeme kararıyla kesinleşirse tartışmasız görevden atılır. Yani bazı hatalar kademeli, bazıları anında en ağır sonucu doğurur.","ornek":"Bir apartman yöneticisi parayı kötüye kullanırsa yönetim kurulu onu ilk seferde uyarır, tekrarında görevden alır. Ama yöneticinin sahte fatura ile hırsızlık yaptığı mahkeme kararıyla kesinleşirse tartışmasız görevden atılır. Yani bazı hatalar kademeli, bazıları anında en ağır sonucu doğurur.","yontemler":"Şıklardaki fiili kanun metnindeki \u0027meslekten çıkarma\u0027 cümlesiyle birebir eşleştirmek gerekir; \u0027ilk defasında\u0027, \u0027tekerrüründe\u0027 gibi kademeli ifadeler içeren şıklar elenir.","nedir":"Mesleki davranış ilkesi, meslek mensubunun hangi fiilinde hangi disiplin cezasının verileceğini düzenler. Sınav, hangi fiilin hangi cezayla otomatik eşleştiğini bilip bilmediğini ölçer."},"olay":"yok, doğrudan madde metninden çıkan bağlayıcı sonuç.","tuzak":{"C":{"ad":"İlk-Tekrar Karıştırma Tuzağı","metin":"vakar ve onura aykırı her fiili aynı ağırlıkta cezalandırır sanırsın. Doğrusu: mesleki kurallara, vakar ve onura aykırı fiilin ilk defasında uyarma, tekrarında kınama cezası uygulanır; meslekten çıkarma bu fıkranın konusu değildir."},"E":{"ad":"İhtiyari Hükmü Zorunlu Sanma Tuzağı","metin":"kanundaki \u0027bir derece ağır ceza uygulanabilir\u0027 ifadesini kesin bir yükümlülük sanırsın. Doğrusu: üç yıllık dönemde tekrarlanan disiplin suçunda disiplin kurulu bir derece ağır ceza uygulayabilir, bu bir takdir yetkisidir, zorunlu meslekten çıkarma sonucu doğurmaz."},"D":{"ad":"Tekerrür Şartını Atlama Tuzağı","metin":"ilk tespiti doğrudan en ağır sonuca bağlarsın. Doğrusu: tasdik yetkisinin gerçeğe aykırı kullanıldığının ilk tespitinde geçici olarak mesleki faaliyetten alıkoyma cezası verilir; meslekten çıkarma bu maddede değil, ayrı bir hükümde düzenlenmiştir."},"B":{"ad":"Kademe Atlama Tuzağı","metin":"genel prensiplere aykırılığı en ağır ceza sanırsın; oysa madde bunu ayrı bir kademeye bağlar. Doğrusu: bağımsızlık, tarafsızlık ve dürüstlükle görev yapmama hâlinde uygulanan ceza geçici olarak mesleki faaliyetten alıkoymadır, meslekten çıkarma değildir."}},"celdiriciYol":{"not":"Teorik soru; celdiricilik hesap zinciriyle değil aynı maddenin (m.48) farklı fıkra ve şartlarının (ilk/tekerrür, ihtiyari/zorunlu, mahkeme kararı şartı) tek tek atlanmasıyla kurulmuştur."},"hap":"Meslekten çıkarma cezası ancak kanunun açıkça saydığı ağır ve kesinleşmiş hâllerde (kasden vergi ziyaı-mahkeme kararı, ruhsat kullandırma, tekerrür eden alıkoyma) zorunlu olarak uygulanır; diğer ihlallerde ceza kademelidir.","teshis":{"C":{"gercek":"Kanun ilk defasında uyarma, tekrarında kınama cezasını öngörür; meslekten çıkarma bu fıkrada hiç geçmez.","ayirt":"Fiil ilk kez mi işlendi, yoksa tekrar mı ediyor; madde bu ikisine farklı ceza mı bağlıyor?","paragraf":"m.48/1","yanilgi":"Vakar ve onura aykırı her davranışı aynı şiddette cezalandırıldığını, ilk defa ile tekrarın aynı sonucu doğurduğunu sanırsın."},"E":{"gercek":"Üç yıllık dönemde tekrarlanan disiplin suçunda bir derece ağır ceza uygulanması kurulun takdirindedir, kanun bunu zorunlu kılmaz.","ayirt":"Madde metni bu sonucu \u0027verilir\u0027 diye mi, \u0027uygulanabilir\u0027 diye mi bağlıyor?","paragraf":"m.48/2","yanilgi":"Kanundaki \u0027uygulanabilir\u0027 ifadesini zorunlu bir sonuç gibi okur, disiplin kurulunun takdir yetkisini gözden kaçırırsın."},"A":{"gercek":"3568 sayılı Kanunun 48 inci maddesinin ikinci fıkrası, mükellefle birlikte kasden vergi ziyaına sebebiyet verilip bunun mahkeme kararıyla kesinleşmesi hâlinde meslekten çıkarma cezasını doğrudan ve bağlayıcı biçimde öngörür.","ayirt":"Madde metninde bu fiil için kurula takdir hakkı tanınmış mı, yoksa doğrudan sonuç mu bağlanmış?","paragraf":"m.48/2","yanilgi":"Bu şıkkı elemeye çalışan öğrenci, mahkeme kararıyla kesinleşme şartını gözden kaçırıp bunun da diğer ihtiyari cezalar gibi takdire bağlı olduğunu düşünür."},"D":{"gercek":"İlk tespitte geçici alıkoyma cezası uygulanır; ancak bu husus tekerrür edip mahkeme kararıyla kesinleşirse yeminli sıfatının kaldırılması cezası uygulanır, meslekten çıkarma değil.","ayirt":"Bu fiil ilk kez mi tespit edildi, yoksa tekerrür edip mahkeme kararıyla mı kesinleşti?","paragraf":"m.48/1","yanilgi":"İlk tespitin de e
