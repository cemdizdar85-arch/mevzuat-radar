edeki asgari miktarın altında ücret karşılığında iş kabul edilmesi, meslek mensubu hakkında disiplin cezası uygulanmasını gerektirir.","D":"Tarife gruplarını tespit etme yetkisi Maliye Bakanlığına ait olup Birlik yönetim kurulu bu grupları yalnızca onaylar.","B":"Oda yönetim kurullarının hazırladığı tarifeler, Birliğin değerlendirmesine gerek kalmaksızın doğrudan Resmi Gazete\u0027de yayımlanarak yürürlüğe girer."},"kaynak":{"alinti":"tarifedeki asgari miktar altında ücret karşılığında iş kabulü yasak olup, aksine hareket disiplin cezasını gerektirir","liste":[{"ad":"SMMM K. (3568 s.K.) m.46","metin":"Madde 46 – Ücret meslek mensuplarının hizmetlerine karşılık olan meblağı ifade eder. Ücretin asgari miktarı tarife ile belirlenir. Tarifedeki asgari miktar altında ücret karşılığında iş kabulü yasak olup, aksine hareket disiplin cezasını gerektirir. Her odanın yönetim kurulu, her yıl ocak ayından geçerli olmak üzere (…)21 serbest muhasebeci mali müşavirler ve yeminli mali müşavirlerin yapacakları iş ve işlemler karşılığında alacakları ücretleri gösterir birer tarife hazırlayarak Birliğe gönderir. Birlik yönetim kurulu, oda yönetim kurullarının tekliflerini de gözönüne almak suretiyle çeşitli odaları içine alacak grupları tespit ve gruplarda uygulanacak tarifeleri hazırlayarak Maliye Bakanlığına gönderir. Maliye Bakanlığı tarifeyi aynen veya gerekli gördüğü değişikliklerle tasdik eder. Tarifeler Resmi Gazete\u0027de yayımlanarak yürürlüğe girer. Yeni tarifenin tasdikine kadar mevcut tarife hükmü uygulanır. Görevle ilgili suçlar"}],"hakem":"Doğru sık, 3568 sayılı Kanun m.46\u0027da açıkça yer alan \u0027tarifedeki asgari miktar altında ücret karşılığında iş kabulü yasak olup, aksine hareket disiplin cezasını gerektirir\u0027 hükmüne dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Yeni tarife yayımlanana kadar eski tarife uygulanmaya devam eder, boş bir dönem yoktur; bu sayede iş kabulü her zaman bir tarife altında gerçekleşir.","E":"Maliye Bakanlığı tarifeyi aynen onaylamakla sınırlı değildir; gerekli gördüğü değişiklikleri yaparak tasdik etme yetkisine sahiptir.","D":"Grup tespiti Birlik yönetim kurulunun görevidir; Maliye Bakanlığı tarifeyi tasdik etmekle yetinir, grupları değiştirmez.","B":"Oda tarifesi doğrudan Resmi Gazete\u0027ye gitmez; önce Birliğe gönderilir, Birlik grupları tespit edip Maliye Bakanlığına iletir, sonra Bakanlık tasdik eder ve o zaman yayımlanır."},"dogru":"Asgari ücretin altında iş kabul etmek açıkça yasaktır ve bunu yapan muhasebeciye mutlaka disiplin cezası verilir. Kanun bunu her durumda böyle hükme bağlamıştır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 46. madde","kavramlar":[{"kaynak":"SMMM K. 46. madde","tanim":"Serbest muhasebeci mali müşavir ve yeminli mali müşavirler tarafından yapılan iş ve işlemlere karşılık olarak alınan meblağdır.","ad":"Ücret"},{"kaynak":"SMMM K. 46. madde","tanim":"Meslek mensuplarının yapacakları çeşitli iş ve işlemler için alabilecekleri ücretlerin asgari ve azami miktarlarını gösteren, yıllık olarak hazırlanan belgelere verilen addır.","ad":"Tarife"},{"kaynak":"SMMM K. 46. madde","tanim":"Tarifedeki asgari miktar altında iş kabulü yapan meslek mensubu hakkında uygulanması gereken ve kanunla önceden belirlenen cezadır.","ad":"Disiplin cezası"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2023/3"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre ücret tarifesinin hazırlanma süreci ile tarife altı ücretle iş kabulünün sonuçlarına ilişkin aşağıdakilerden hangisi her zaman doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-05","verilenler":[],"dayanak":"3568 sayılı Kanun m.46","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir SMMM bürosu, 2024 tarifesine göre bir şirketin defter tutma işini asgari 12.000 TL yerine 7.000 TL\u0027ye kabul ediyor.","anlatim":"Bu meslek mensubu tarifede yazan asgari tutarın altına iniyor. Aynı olayda ücret tarifesinin nasıl hazırlandığını da göreceğiz. Şimdi bu tek olayı beş şıkla test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 7.000 TL\u0027lik iş kabulünün sonucu ile tarifenin hazırlanma-onaylanma zinciri arasındaki ilişkiyi kuracağız.","anlatim":"Kural şu: asgari altı ücret yasak ve disiplin cezası doğurur; tarife, oda-Birlik-Maliye Bakanlığı zincirinden geçerek Resmî Gazete\u0027de yürürlüğe girer. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.46","karar":"doğru","anlatim":"Olayda asgari 12.000 TL\u0027nin altına inilmiş, bu açık bir ihlaldir. Madde 46 istisna tanımadan bu davranışın disiplin cezası gerektirdiğini söylüyor.","formul":"Şık A: bürodaki 7.000 TL\u0027lik iş kabulü nedeniyle meslek mensubuna disiplin cezası uygulanır mı, her zaman mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.46","karar":"yanlış","anlatim":"Olayda oda tarifeyi Birliğe gönderiyor, Birlik grupları tespit edip Maliye Bakanlığına iletiyor. Odanın belgesi tek başına yürürlüğe giremez, iki makamdan daha geçer.","formul":"Şık B: Ankara Odasının hazırladığı tarife, Birliğe uğramadan doğrudan Resmî Gazete\u0027ye gider mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.46","karar":"yanlış","anlatim":"Olayda büro zaten 2024 tarifesiyle çalışıyor, boşluk yok. Kanun yeni tarifenin tasdikine kadar mevcut tarifenin uygulanmaya devam edeceğini söyler.","formul":"Şık C: yeni tarife Resmî Gazete\u0027de yayımlanana kadar büro hiç iş kabul edemez mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.46","karar":"yanlış","anlatim":"Olayda grupları tespit eden Birlik yönetim kuruludur, Bakanlık sadece tasdik makamıdır. Yetki dağılımı tam tersinedir.","formul":"Şık D: grupları tespit etme işini Maliye Bakanlığı yapıp Birlik yalnızca onaylıyor mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.46","karar":"yanlış","anlatim":"Olayda gönderilen tarife Bakanlığa ulaştığında Bakanlık üzerinde değişiklik yapabilir. Madde 46 açıkça \"aynen veya gerekli gördüğü değişikliklerle\" der.","formul":"Şık E: Bakanlık, Birlik\u0027ten gelen tarifeyi olduğu gibi kabul etmek zorunda mı, değiştiremez mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Bu olayda tek istisnasız kural asgari altı ücretin cezası, diğer her şey makamlar arası paylaşımla ilgili ve hepsi çift yönlü işliyor. Kendine sor: bu kural için kanunda bir istisna cümlesi var mı, yoksa iki makam mı işin içinde?","doldur":[]}],"anahtar":[{"ornek":"tarife","kok":"tarife"},{"ornek":"olayda","kok":"olayda"},{"ornek":"bakanlık","kok":"bakanl"},{"ornek":"asgari","kok":"asgari"},{"ornek":"cezası","kok":"cezası"},{"ornek":"istisnasız","kok":"istisn"}],"konuGiris":{"harita":"Ne zaman test edilir: Tarifenin hazırlanma sürecinin sırası ve tarife altı ücretle iş kabulünün sonucu sorulduğunda test edilir. Nasıl ölçülür: Madde 46\u0027daki oda-Birlik-Bakanlık zinciri ile disiplin cezası sonucunun doğru eşleştirilmesiyle ölçülür. Nasıl kaydedilir: Bu bilgi kanun maddesi olarak ezbere bilinmesi gereken bir kural şeklinde kayıtlıdır.","desen":"Sınav genelde tarifeyi kimin onayladığını (Maliye Bakanlığı) ve sürecin sırasını karıştırarak sorar; öğrenciler Birlik ile Bakanlık rollerini karıştırır. Bir diğer tuzak, tarife altı ücretle iş kabulünün \u0027geçersiz sözleşme\u0027 değil \u0027disiplin cezası\u0027 sonucu doğurduğunu unutmaktır. Bu soru m.46 hükmündeki süreç ve yaptırım noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensuplarının alacağı en düşük ücreti gösteren resmi belge","ad":"Asgari ücret tarifesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kendi bölgesindeki tarife taslağını hazırlayıp Birliğe gönderen organ","ad":"Oda yönetim kurulu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Oda tekliflerini birleştirip gruplara göre tarife hazırlayan üst organ","ad":"Birlik yönetim kurulu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Asgari tutarın altında iş kabulünün disiplin cezasını gerektiren yasak durumu","ad":"Tarife altı ücret yasağı","kim":"kanun sabitler"}],"sinavda":"Soruda tarife hazırlama sürecinin aşamaları ve tarife altı ücretle iş kabulünün sonucu anlatılır, hangi ifadenin her zaman doğru olduğu istenir.","panel_ornek":"Bir apartmanda yöneticiler önce kendi aralarında aidat miktarını belirleyip yönetim kuruluna öneriyor, kurul da bunu onaylıyor. Diyelim aidat 50 lira olarak belirlendi ve bu tutarın altında ödeme kabul edilmiyor. Birisi 30 liraya razı olursa, kurallara aykırı davranmış sayılıyor.","ornek":"Bir apartmanda yöneticiler önce kendi aralarında aidat miktarını belirleyip yönetim kuruluna öneriyor, kurul da bunu onaylıyor. Diyelim aidat 50 lira olarak belirlendi ve bu tutarın altında ödeme kabul edilmiyor. Birisi 30 liraya razı olursa, kurallara aykırı davranmış sayılıyor.","yontemler":"Süreci oda→Birlik→Maliye Bakanlığı sırasıyla ezberle; tarife altı ücretle iş kabulünün sonucu her zaman disiplin cezasıdır, başka seçenek doğru olamaz.","nedir":"Ücret tarifesi, meslek mensuplarının alacağı asgari ücreti belirleyen resmi bir belgedir. Sınav bu tarifenin kimler tarafından hazırlanıp onaylandığını ve altında iş kabulünün sonucunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Yürürlük Boşluğu Tuzağı","metin":"yeni tarife yayımlanana kadar hiçbir tarifenin geçerli olmadığını sanırsın. Doğrusu: yeni tarifenin tasdikine kadar mevcut (eski) tarife hükmü uygulanmaya devam eder, boşluk oluşmaz."},"E":{"ad":"Yetki Kapsamı Daraltma Tuzağı","metin":"Bakanlığın yalnızca kabul/ret yapabildiğini, değişiklik yapamayacağını düşünürsün. Doğrusu: Bakanlık tarifeyi aynen veya gerekli gördüğü değişikliklerle tasdik edebilir."},"D":{"ad":"Yetki Ters Çevirme Tuzağı","metin":"grup tespitini Bakanlığa, onayı Birliğe verirsin. Doğrusu: grupları tespit eden Birlik yönetim kuruludur; Maliye Bakanlığı bu tarifeyi tasdik eder."},"B":{"ad":"Aşama Atlama Tuzağı","metin":"oda tarifesinin doğrudan Resmi Gazete\u0027ye gittiğini, Birlik onayının gereksiz olduğunu düşünürsün. Doğrusu: oda tarifeleri önce Birliğe gönderilir, Birlik grupları tespit edip Maliye Bakanlığına iletir; Resmi Gazete\u0027ye giden budur."}},"celdiriciYol":{},"hap":"Asgari ücret altında iş kabulü istisnasız disiplin cezası doğurur; tarife süreci oda-Birlik-Bakanlık sırasıyla işler ve yeni tarife yürürlüğe girene kadar eski tarife geçerliliğini korur.","teshis":{"C":{"gercek":"Kanun, yeni tarifenin tasdikine kadar mevcut tarifenin uygulanmaya devam edeceğini açıkça belirtir; süreklilik esastır.","ayirt":"Kanun metninde \u0027yeni tarifenin tasdikine kadar\u0027 ifadesinden sonra ne söyleniyor?","paragraf":"3568 sayılı Kanun m.46","yanilgi":"Tarife değişiminde eski hükmün otomatik olarak kalkacağını sanıyorsun."},"E":{"gercek":"Madde 46, Bakanlığın tarifeyi \u0027aynen veya gerekli gördüğü değişikliklerle\u0027 tasdik edebileceğini açıkça belirtir.","ayirt":"Kanun metninde tasdik fiilinden önce hangi iki seçenek birlikte sayılıyor?","paragraf":"3568 sayılı Kanun m.46","yanilgi":"Bakanlığın rolünü yalnızca bir onay mekanizması sanıp değişiklik yetkisini gözden kaçırıyorsun."},"A":{"gercek":"Madde 46 açıkça \u0027tarifedeki asgari miktar altında ücret karşılığında iş kabulü yasaktır, aksine hareket disiplin cezasını gerektirir\u0027 der; istisna tanımaz.","ayirt":"Bu kural için kanunda herhangi bir istisna cümlesi var mı?","paragraf":"3568 sayılı Kanun m.46","yanilgi":"Bu kuralın bazı istisnalarının olabileceğini, örneğin küçük işlerde asgari altı ücretin tolere edilebileceğini düşünüyorsun."},"D":{"gercek":"Grupları tespit eden ve tarifeleri hazırlayan Birlik yönetim kuruludur; Bakanlığın rolü tasdiktir.","ayirt":"Grup tespiti ile tasdik, aynı makamın işi mi yoksa iki ayrı makamın işi mi?","paragraf":"3568 sayılı Kanun m.46","yanilgi":"Nihai onay makamı olan Bakanlığın, sürecin her aşamasında da karar verici olduğunu düşünüyorsun."},"B":{"gercek":"Oda tarifeleri Birliğe, Birlik de grupları tespit ederek Maliye Bakanlığına gönderir; yürürlük Bakanlık tasdikinden sonra Resmi Gazete ile olur.","ayirt":"Odanın hazırladığı belge, yürürlüğe girmeden önce kaç makamdan geçiyor?","paragraf":"3568 sayılı Kanun m.46","yanilgi":"Odanın tarife hazırlama yetkisini, tarifenin doğrudan yürürlüğe girme yetkisiyle karıştırıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 102"},"kural":"3568 sayılı Kanunun 48 inci maddesine göre mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlara ilk defasında uyarma, tekrarında ise kınama cezası uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 102","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında önce fiilin hangi fıkraya girdiğini, sonra fiilin ilk mi tekrar mı olduğunu ayırt et.","konu":"disiplin cezası kınama","tablo":{"satirlar":[["A) Mesleki kurallara aykırı fiilin tekrarında kınama cezası…","3568 s.K. m.48","doğru ifade"],["B) Fiil ilk kez işlenmiş gibi değerlendirilerek yine uyarma…","3568 s.K. m.48","YANLIŞ ifade"],["C) Fiilin tekrarı nedeniyle geçici olarak mesleki faaliyett…","3568 s.K. m.48","YANLIŞ ifade"],["D) Üç yıllık dönemde iki suç işlendiği için savunma alınmak…","3568 s.K. m.48","YANLIŞ ifade"],["E) Disiplin kurulu takdir yetkisini kullanarak bir derece h…","3568 s.K. m.48","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Fiilin tekrarı nedeniyle geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır.","E":"Disiplin kurulu takdir yetkisini kullanarak bir derece hafif ceza olan uyarma cezasını uygular.","A":"Mesleki kurallara aykırı fiilin tekrarında kınama cezası uygulanır.","D":"Üç yıllık dönemde iki suç işlendiği için savunma alınmaksızın doğrudan meslekten çıkarma cezası uygulanır.","B":"Fiil ilk kez işlenmiş gibi değerlendirilerek yine uyarma cezası uygulanır."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"Kaynak metinde 3568 sayılı Kanun m.48\u0027de mesleki kurallara aykırı fiil tekrarında kınama cezası uygulanacağı açıkça düzenlenmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Yanlış. Geçici alıkoyma cezası farklı fiil türlerine (bağımsızlık ve dürüstlüğe aykırılık) uygulanır; bu davranış için kanun kınamayı öngörür.","E":"Yanlış. Kanunun asıl kuralı tekrar için kınamadır; kurulun hafif ceza uygulama takdir yetkisi ayrı bir imkandır ve burada uygulanmaz.","A":"Bu doğru cevaptır. Kanun mesleki kurallara aykırı davranışın tekrarında kınama cezasını öngörür.","D":"Yanlış. Üç yıllık dönemde iki davranış aynı nitelikteyse ağırlaştırma kuralı uygulanmaz; savunma alınması zorunludur ve doğrudan meslekten çıkarma bu duruma uygulanan ceza değildir.","B":"Yanlış. Her davranışı izole değerlendirmek değil, tekrarını dikkate almak gerekir; kanun tekrar için bir üst ceza olan kınamayı hükme bağlamıştır."},"dogru":"Meslek mensubu mesleğin vakar ve onuruna aykırı davranışı ilk yaptığında uyarma almıştır. Aynı nitelikteki davranışı tekrar yaptığında, kanun buna kınama cezası uygulanmasını öngörür. Ceza basamakları: ilk kez uyarma, tekrar kınama.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 48. maddeye göre, mesleki kurallara aykırı fiil ve harekette bulunanlara ilk defasında uyarma, tekrarında ise kınama cezası uygulanır.","kavramlar":[{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensuplarının görev ve davranışlarında mesleğin saygınlığını zedeleyici, kusurlu sayılan fiil ve hareketlerdir.","ad":"Mesleğin vakar ve onuruna aykırı fiil"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir.","ad":"Kınama cezası"},{"kaynak":"SMMM K. 48. madde","tanim":"Aynı nitelikteki mesleki kurallara aykırı davranışın daha önce cezalandırıldıktan sonra yeniden işlenmesidir.","ad":"Tekerrür (davranışın tekrarı)"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Bir meslek mensubu, mesleğin vakar ve onuruna aykırı bir fiili nedeniyle daha önce uyarma cezası ile cezalandırılmıştır. Kısa süre sonra aynı nitelikteki fiili tekrar işlemiştir. Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre bu ikinci fiil için uygulanacak disiplin cezası aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-24","verilenler":[],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.48","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir SMMM, 2021 yılında müşterisine hakaret içerikli bir üslupla davrandığı için uyarma cezası almış. 2022 yılında aynı SMMM, başka bir müşterisine benzer şekilde mesleğin vakar ve onuruna aykırı hitapta bulunmuş.","anlatim":"İkinci fiil, birinciyle aynı nitelikte; yani vakar ve onura aykırı davranış tekrar ediyor. Şimdi bu ikinci fiile hangi ceza uygulanacağını bulacağız.","doldur":[]},{"formul":"Ne yapacağız: m.48\u0027e göre vakar ve onura aykırı fiilde ilk defasında uyarma, tekrarında kınama cezası uygulanır; olayımızda ilk fiil zaten cezalandırılmış.","anlatim":"Kural tek: tekrar eden fiil bir üst cezayı, yani kınamayı gerektirir. Şimdi bu beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"3568 s.K. m.48","karar":"doğru","anlatim":"Olayda fiil aynı nitelikte tekrar etmiş, ilk ceza uyarmaydı. Kanun bu durumda kınama cezasını öngörür.","formul":"Şık A: SMMM\u0027ye ikinci fiil için kınama cezası verilse, bu doğru müdür?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"3568 s.K. m.48","karar":"yanlış","anlatim":"Olayda meslek mensubu daha önce aynı fiilden ceza almıştı, bu bir tekrar. Kanun tekrar eden fiile yine uyarma verilmesine izin vermez.","formul":"Şık B: disiplin kurulu \u0027bu fiil sanki ilk kez işlenmiş gibi olsun, yine uyarma verelim\u0027 dese, doğru mu olur?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"3568 s.K. m.48","karar":"yanlış","anlatim":"Geçici alıkoyma, bağımsızlık-tarafsızlık-dürüstlük ihlali gibi başka bir fiil grubu içindir. Olayımızdaki fiil vakar ve onur ihlali, bu grup değil.","formul":"Şık C: \u0027fiil tekrar etti diye doğrudan geçici olarak mesleki faaliyetten alıkoyalım\u0027 dense, bu doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"3568 s.K. m.48","karar":"yanlış","anlatim":"Üç yıllık ağırlaştırma kuralı her yeni suça bir öncekinden ağır ceza öngörür, en ağır cezaya sıçramayı değil. Ayrıca savunma alınmadan hiç ceza verilemez.","formul":"Şık D: \u0027üç yıl içinde iki suç var, savunma bile almadan doğrudan meslekten çıkaralım\u0027 dense, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"3568 s.K. m.48","karar":"yanlış","anlatim":"Kurulun bir derece hafif ceza verme yetkisi istisnai bir takdirdir, asıl kural değildir. Olayda soru asıl kanun hükmünü soruyor, o da kınamadır.","formul":"Şık E: disiplin kurulu \u0027takdir hakkımı kullanıp yine uyarma vereyim\u0027 dese, bu asıl kanun kuralı mıdır?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Vakar ve onura aykırı fiilin tekrarında kanun doğrudan kınamayı öngörür, başka hiçbir ceza devreye girmez. Kendine hep şunu sor: bu fiil ilk mi, yoksa tekrar mı ediyor?","doldur":[]}],"anahtar":[{"ornek":"tekrarında","kok":"tekrar"},{"ornek":"kınama","kok":"kınama"},{"ornek":"uyarma","kok":"uyarma"},{"ornek":"aykırı","kok":"aykırı"},{"ornek":"olayda","kok":"olayda"},{"ornek":"uygulanır","kok":"uygula"}],"konuGiris":{"harita":"Ne zaman test edilir: Aynı nitelikteki fiilin ilk kez mi yoksa tekrar mı işlendiği sorulduğunda test edilir. Nasıl ölçülür: Kanunun 48. maddesindeki ceza kademesi (uyarma-kınama-alıkoyma-meslekten çıkarma) sırasına bakılarak ölçülür. Nasıl kaydedilir: Verilen disiplin cezası meslek mensubunun sicil/disiplin dosyasına yazılı bildirimle kaydedilir.","desen":"Soru genellikle bir fiilin ilk mi ikinci mi işlendiğini vererek doğrudan kanundaki kademeyi sorar. Tuzak, öğrencinin \u0027tekrar\u0027 ifadesini kaçırıp uyarma cezasını tekrar seçmesidir; oysa kanun tekrarında bir üst cezayı öngörür. Bu soru m.48 fıkra 2\u0027deki \u0027ilk defasında uyarma, tekrarında ise kınama cezası uygulanır\u0027 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İlk fiilde verilen, dikkatli davranma uyarısının yazı ile bildirilmesi","ad":"Uyarma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Aynı fiilin tekrarında verilen, kusurlu sayıldığının yazı ile bildirilmesi","ad":"Kınama","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Aynı nitelikteki fiilin daha önce cezalandırıldıktan sonra yeniden işlenmesi","ad":"Tekerrür","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Kurulun bir derece ağır veya hafif ceza uygulayabilme yetkisi","ad":"Disiplin kurulu takdiri","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda bir fiilin ilk kez uyarma cezası aldığı ve aynı fiilin tekrar işlendiği verilir, ikinci fiile uygulanacak ceza istenir.","panel_ornek":"Bir öğrenci okulda ilk kez geç kaldığında sözlü uyarı alır, ama aynı hafta yine geç kalırsa bu sefer yazılı ihtar alır ve durumu dosyasına işlenir. Yani ilk hata hafif geçiştirilir, tekrarında ceza bir kademe ağırlaşır. Burada önemli olan sayı 2\u0027dir: ikinci tekrar farklı işlem görür.","ornek":"Bir öğrenci okulda ilk kez geç kaldığında sözlü uyarı alır, ama aynı hafta yine geç kalırsa bu sefer yazılı ihtar alır ve durumu dosyasına işlenir. Yani ilk hata hafif geçiştirilir, tekrarında ceza bir kademe ağırlaşır. Burada önemli olan sayı 2\u0027dir: ikinci tekrar farklı işlem görür.","yontemler":"Tek yöntem kanun metnindeki sabit kademeyi bilmektir; ilk fiil-uyarma, tekrar fiil-kınama eşleşmesi ezbere bilinmelidir.","nedir":"Bu konu meslek mensuplarına uygulanan disiplin cezalarının basamaklarını anlatır. Sınav, aynı nitelikteki fiilin tekrarında hangi cezanın uygulanacağını ölçer."},"olay":"olayda ilk fiil için uyarma cezası zaten verilmiş, ikinci fiil aynı niteliktedir.","tuzak":{"C":{"ad":"Kademe Atlama Tuzağı","metin":"öğrenci cezalar arasındaki basamağı bir üst dereceye taşıyıp geçici alıkoymaya sıçrar. Doğrusu: madde 48\u0027de tekrar için öngörülen ceza kınamadır, geçici alıkoyma ayrı bir fiil grubuna aittir."},"E":{"ad":"Takdir Yetkisi Karıştırması Tuzağı","metin":"öğrenci kurulun bir derece hafif ceza uygulayabilme yetkisini asıl kanun kuralı sanır. Doğrusu: kanunun asıl hükmü tekrar için kınamadır, hafifletme kurulun ayrı bir takdir yetkisidir."},"D":{"ad":"Üç Yıl Kuralı Yanlış Uygulama Tuzağı","metin":"öğrenci ağırlaştırma hükmünü tek bir davranış tekrarına, en ağır cezaya sıçratarak uygular ve savunma hakkını göz ardı eder. Doğrusu: üç yıllık dönemde birden fazla farklı suç olmadıkça ve savunma alınmadıkça doğrudan meslekten çıkarma uygulanmaz."},"B":{"ad":"Tekrar-İlk Karıştırması Tuzağı","metin":"öğrenci her fiili ayrı ve ilkmiş gibi değerlendirip cezayı sıfırdan başlatır. Doğrusu: kanun aynı nitelikteki fiilin tekrarında bir üst ceza olan kınamayı öngörür."}},"celdiriciYol":{},"hap":"Mesleğin vakar ve onuruna aykırı fiilde ilk defasında uyarma, tekrarında kınama cezası uygulanır.","teshis":{"C":{"gercek":"Geçici alıkoyma, bağımsızlık-tarafsızlık-dürüstlük ilkelerine aykırılık gibi farklı bir fiil grubu için öngörülmüştür.","ayirt":"Bu fiil hangi fiil grubuna giriyor, vakar-onur ihlali mi yoksa görevin bağımsız yürütülmemesi mi?","paragraf":"3568 s.K. m.48","yanilgi":"Ceza basamaklarını sırayla atlayıp tekrarda hemen geçici alıkoymaya geçileceğini sanıyorsun."},"E":{"gercek":"Asıl kural tekrar için kınamadır; hafifletme kurulun ayrı ve istisnai takdir yetkisidir.","ayirt":"Soru bana asıl kanun hükmünü mü soruyor, yoksa kurulun istisnai takdirini mi?","paragraf":"3568 s.K. m.48","yanilgi":"Kurulun bir derece hafif ceza uygulama takdirini kanunun asıl kuralı sanıyorsun."},"A":{"gercek":"Madde 48, mesleğin vakar ve onuruna aykırı fiilin tekrarında kınama cezası öngörür.","ayirt":"Bu fiil ilk kez mi işlendi, yoksa tekrar mı ediyor?","paragraf":"3568 s.K. m.48","yanilgi":"Bu şıkkı eleyen öğrenci, tekrar eden fiilde de yeniden uyarma cezası verileceğini düşünür."},"D":{"gercek":"Ağırlaştırma her yeni suç için bir öncekinden ağır ceza öngörür, doğrudan en ağır cezaya sıçrama ve savunmasız ceza verme kanunla bağdaşmaz.","ayirt":"Kanun burada \u0027bir derece ağır ceza\u0027 mı diyor yoksa \u0027en ağır ceza\u0027 mı diyor?","paragraf":"3568 s.K. m.48","yanilgi":"Üç yıllık ağırlaştırma kuralını tek bir tekrar için en ağır cezaya uyguluyorsun ve savunma şartını atlıyorsun."},"B":{"gercek":"Kanun aynı nitelikli fiilin tekrarında bir üst cezayı zorunlu kılar.","ayirt":"Aynı nitelikte bir fiil daha önce cezalandırılmış mıydı?","paragraf":"3568 s.K. m.48","yanilgi":"Her fiilin bağımsız değerlendirilip cezanın sıfırlanacağını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 120"},"kural":"3568 sayılı Kanunun 19 üncü maddesinin (g) bendine göre Genel Kurul, sorumlu görülenler hakkında yalnız disiplin soruşturması açılmasına karar verebilir; cezayı belirleme ve uygulama yetkisi Disiplin Kuruluna aittir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 120","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Hangisi değildir sorularında dört şıkkın madde metninde birebir geçip geçmediğini kontrol et; beşincisi genellikle iki organın görevini karıştırır.","konu":"genel kurul kararları","tablo":{"satirlar":[["A) Yönetim Kurulunca yapılacak teklifleri incelemek ve kara…","m.19/d","doğru ifade"],["B) Odaya kayıtlı üyelerin yıllık aidatlarını tespit etmek.","m.19/h","doğru ifade"],["C) Sorumlu görülen meslek mensupları hakkında doğrudan disi…","m.19/g","YANLIŞ ifade"],["D) Bütçeyi ve kesinhesapları tasdik etmek.","m.19/f","doğru ifade"],["E) Oda Yönetim Kurulu, Disiplin Kurulu ve Denetleme Kurulu …","m.19/b","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Sorumlu görülen meslek mensupları hakkında doğrudan disiplin cezası vermek.","E":"Oda Yönetim Kurulu, Disiplin Kurulu ve Denetleme Kurulu üyelerini seçmek.","A":"Yönetim Kurulunca yapılacak teklifleri incelemek ve karara bağlamak.","D":"Bütçeyi ve kesinhesapları tasdik etmek.","B":"Odaya kayıtlı üyelerin yıllık aidatlarını tespit etmek."},"kaynak":{"alinti":"sorumlu görülenler hakkında disiplin soruşturmasına karar vermek","liste":[{"ad":"SMMM K. (3568 s.K.) m.19","metin":"Madde 19 – Genel Kurulun görevleri aşağıda gösterilmiştir. a) Odaların amaçlarının gerçekleştirilmesi için gereken karar ve tedbirleri almak. b) Oda Yönetim Kurulu, Disiplin Kurulu ve Denetleme Kurulu üyeleri ile Birlik temsilcilerini seçmek. c) Oda için gerekli taşınmazların satın alınması veya mevcut taşınmazların satılması hususunda Yönetim Kuruluna yetki vermek. d) Yönetim Kurulunca yapılacak teklifleri incelemek ve karara bağlamak. e) Meslek mensuplarınca uyulması zorunlu mesleki kararlar alınması konusunda Birliğe tekliflerde bulunmak. f) (…)9 bütçeyi ve kesinhesapları tasdik etmek. g) Yönetim Kurulunu ibra etmek, gerektiğinde sorumlu görülenler hakkında disiplin soruşturmasına karar vermek. h) Odaya yazılacak adayların giriş ücretlerini ve odaya yazılı üyelerin yıllık aidatlarını tespit etmek ve bunların ödeneceği tarihleri belirlemek. i) Oda Yönetim Kurulunun çalışma raporunu incelemek, kabul etmek. j) Odanın görevlerine giren diğer işleri gündeme dayanılarak veya üyelerin teklifi üzerine inceleyip karara bağlamak. k) Kanunlarla verilmiş diğer görevleri yapmak. Oda Genel Kurul toplantısı"},{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"}],"hakem":"3568 sayılı Kanunun m.19(g) bendinde Genel Kurul\u0027un \u0027sorumlu görülenler hakkında disiplin soruşturmasına karar vermek\u0027 yetkisi bulunurken, cezayı belirleme ve uygulama yetkisi Disiplin Kuruluna ait olduğundan, doğrudan disiplin cezası vermek Genel Kurul\u0027un görevi değildir."},"kayitlar":[],"sade":{"siklar":{"D":"Bütçeyi ve kesinhesapları onaylamak Genel Kurulun en önemli mali kontrol görevleridir; kanunda sayılmıştır.","E":"Yönetim, Disiplin ve Denetleme Kurulu üyelerini seçmek Genel Kurulun temel seçim görevleridir; kanunda açıkça yer almıştır.","A":"Yönetim Kurulu önerilerini inceleyip karara bağlamak Genel Kurul görevlerinin temel işleridir; bu açıkça kanunda sayılmıştır.","B":"Üyelerin yıllık aidatlarını tespit etmek Genel Kurul görevlerindendir; bu kanunda açık bir şekilde belirtilmiştir."},"dogru":"Oda Genel Kurulu sorumlu görülen meslek mensupları hakkında yalnız soruşturma açılmasına karar verebilir. Disiplin cezasını belirleyip uygulamak Disiplin Kurulunun görevidir. Doğrudan ceza vermek Genel Kurulun görevi değildir.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 19. madde","kavramlar":[{"kaynak":"SMMM K. 19. madde","tanim":"Sorumlu görülen meslek mensupları hakkında Oda Genel Kurlunun soruşturma açılmasına karar verebildiği, yalnızca araştırma ve inceleme yapılan işlemdir.","ad":"disiplin soruşturması"},{"kaynak":"SMMM K. 19. madde","tanim":"Meslek mensuplarına disiplin cezası belirleme ve uygulama yetkisine sahip, Oda Genel Kurulu tarafından seçilen kuruluştur.","ad":"Disiplin Kurulu"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2025/2","alinti":"Bağımsız denetime tabi bir anonim şirketin faaliyet döneminin görüşüldüğü olağan genel kurulunda aşağıdaki kararlardan hangisinin her yıl alınmasına gerek yoktur?"}],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi, 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre Oda Genel Kurulunun görevlerinden biri değildir?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-27","verilenler":[],"dayanak":"3568 sayılı SMMM Kanunu m.19 (g) bendi","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: İzmir SMMM Odası\u0027nda 14 Mart günü Genel Kurul toplanıyor, salonda 210 üye var.","anlatim":"Yönetim Kurulu başkanı kürsüye çıkıp beş ayrı gündem maddesini oylamaya sunuyor. Bu beş maddenin her biri, kanunun Genel Kurula verdiği görevlerden biri iddiasıyla geliyor. Sen bu beş iddiayı tek tek denetleyeceksin.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun madde 19, Genel Kurulun görevlerini bentler halinde sayar.","anlatim":"Bu 210 kişilik salonda konuşulan her önerinin madde 19\u0027daki bir bende denk düşüp düşmediğine bakacağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.19/d","karar":"doğru","anlatim":"Salon bu teklifi tartışıp oylar, çünkü bu iş doğrudan Genel Kurula bırakılmış. Yönetim Kurulu kendi başına karar veremez, teklifi Genel Kurula getirir.","formul":"Şık A: başkan \u0027Yönetim Kurulunun getirdiği teklifleri şimdi inceleyip karara bağlayalım\u0027 diyor, bu Genel Kurulun görevi mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.19/h","karar":"doğru","anlatim":"210 üye elini kaldırıp bu tutarı oyluyor, çünkü aidat tespiti kanunla Genel Kurula verilmiş. Yönetim Kurulu bunu kendi kararıyla belirleyemez.","formul":"Şık B: gündemde \u00272025 yılı aidatını 4.500 lira olarak belirleyelim\u0027 maddesi var, bu Genel Kurulun görevi mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.19/g","karar":"yanlış","anlatim":"Salon burada durur, çünkü Genel Kurulun elinde yalnız soruşturma açılmasına karar verme yetkisi vardır. Cezayı belirleyip uygulama işi Disiplin Kuruluna aittir, Genel Kurul cezayı doğrudan veremez.","formul":"Şık C: başkan \u0027Ahmet Bey hakkında sorumluluk var, salon burada oyla ona doğrudan disiplin cezası verelim\u0027 diyor, sen buna izin verir misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.19/f","karar":"doğru","anlatim":"210 üye bütçeyi ve kesinhesabı burada onaylar, çünkü bu tasdik yetkisi kanunla Genel Kurula verilmiş. Yönetim Kurulu bunu kendi kendine yürürlüğe koyamaz.","formul":"Şık D: mali müşavir \u0027geçen yılın kesinhesabını ve bu yılın bütçesini tasdik edelim\u0027 diyor, bu Genel Kurulun görevi mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.19/b","karar":"doğru","anlatim":"210 üye oy pusulalarını kullanıp üç kurulu birden seçer, çünkü bu seçim açıkça Genel Kurula bırakılmış. Bu seçim Birlik düzeyinde değil, Oda Genel Kurulu düzeyinde yapılır.","formul":"Şık E: salon \u0027yeni Yönetim Kurulu, Disiplin Kurulu ve Denetleme Kurulu üyelerini seçelim\u0027 diyor, bu Genel Kurulun görevi mi?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"İzmir salonunda dört madde geçerli oldu, yalnız Ahmet Bey\u0027e doğrudan ceza verme girişimi durduruldu. Kendine hep şunu sor: bu organ kararı, soruşturma açılmasını mı yoksa cezanın kendisini mi belirliyor?","doldur":[]}],"anahtar":[{"ornek":"kuruluna","kok":"kurulu"},{"ornek":"kurula","kok":"kurula"},{"ornek":"disiplin","kok":"disipl"},{"ornek":"belirleyip","kok":"belirl"},{"ornek":"yetkisi","kok":"yetkis"},{"ornek":"soruşturması","kok":"soruşt"}],"konuGiris":{"harita":"Ne zaman test edilir: Oda organlarının görev dağılımı sorulduğunda test edilir. Nasıl ölçülür: Şıklardaki görevlerden hangisinin Genel Kurula ait olmadığı bulunarak ölçülür. Nasıl kaydedilir: Doğru cevap, kanunda sayılan görevler listesiyle karşılaştırılarak belirlenir.","desen":"Soru, Genel Kurulun görevlerini sayan kanun hükmünden gelir ve şıklardan birine Yönetim Kurulunun ya da başka bir organın görevini yerleştirir. Tuzak, benzer görünen ama aslında günlük yönetim işine ait bir ifadeyi Genel Kurul görevi gibi göstermektir. Bu soru, Genel Kurulun görevlerinin tek tek sayıldığı madde noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Odanın en yetkili karar organı, üyelerin tümünden oluşur","ad":"Genel Kurul","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Genel Kurul kararlarını uygulayan, günlük işleri yürüten organ","ad":"Yönetim Kurulu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yönetim Kurulunun hesap ve işlemlerinin usulüne uygun bulunması onayı","ad":"İbra","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Üyelerin ödeyeceği giriş ücreti ve yıllık aidat tutarının belirlenmesi","ad":"Aidat tespiti","kim":"kanun sabitler"}],"sinavda":"Şıklarda sayılan görevlerden hangisinin Genel Kurula ait olmadığı sorulur.","panel_ornek":"Bir apartman yönetimi kat maliklerinin toplandığı bir toplantı düşün: aidatı belirlemek, yöneticiyi ibra etmek, bütçeyi onaylamak o toplantının işidir; ama günlük tadilat işini kapıcıya kim yaptıracak diye karar vermek yöneticinin kendi işidir. İşte odalarda da bazı kararlar üst kurulun, bazıları yönetim kurulunun görevidir.","ornek":"Bir apartman yönetimi kat maliklerinin toplandığı bir toplantı düşün: aidatı belirlemek, yöneticiyi ibra etmek, bütçeyi onaylamak o toplantının işidir; ama günlük tadilat işini kapıcıya kim yaptıracak diye karar vermek yöneticinin kendi işidir. İşte odalarda da bazı kararlar üst kurulun, bazıları yönetim kurulunun görevidir.","yontemler":"Şıklar tek tek kanundaki görev listesiyle karşılaştırılır; listede olmayan ya da başka organa ait olan şık doğru cevaptır.","nedir":"Bu konu, Serbest Muhasebeci Mali Müşavirler Odasının Genel Kurulunun hangi yetkilere sahip olduğunu düzenler. Sınav, Genel Kurula ait olan görevle ait olmayanı ayırt edebilmeyi ölçer."},"olay":"","tuzak":{"D":{"ad":"Yetki Devri Tuzağı","metin":"Bütçe ve kesinhesap onayının Yönetim Kuruluna bırakıldığını sanırsın. Doğrusu: bu, 19 üncü maddenin (f) bendinde açıkça sayılan Genel Kurul görevidir."},"E":{"ad":"Organ Seçimi Tuzağı","metin":"Üye seçiminin Birlik tarafından yapıldığını, Oda Genel Kuruluyla ilgisi olmadığını düşünürsün. Doğrusu: bu, 19 üncü maddenin (b) bendinde sayılan Genel Kurul görevidir."},"A":{"ad":"Görev Karıştırma Tuzağı","metin":"Yönetim Kurulu tekliflerinin incelenip karara bağlanmasını yürütme organının kendi işi sanırsın. Doğrusu: bu, 19 üncü maddenin (d) bendinde açıkça sayılan Genel Kurul görevidir."},"B":{"ad":"Bent Atlama Tuzağı","metin":"Aidat ve giriş ücreti tespitinin idari bir işlem olup Genel Kurulu ilgilendirmediğini düşünürsün. Doğrusu: bu, 19 üncü maddenin (h) bendinde sayılan Genel Kurul görevidir."}},"celdiriciYol":null,"hap":"Genel Kurul yalnızca disiplin soruşturması açılmasına karar verebilir; cezayı belirleyip uygulama yetkisi Disiplin Kuruluna aittir.","teshis":{"C":{"gercek":"Madde 19/g yalnız \u0027disiplin soruşturmasına karar vermek\u0027ten söz eder; cezayı belirleyip uygulama yetkisi Disiplin Kuruluna aittir.","ayirt":"Bu organ kararı, soruşturma açılmasını mı yoksa cezanın kendisini mi belirliyor?","paragraf":"m.19/g","yanilgi":"Genel Kurulun disiplin soruşturması açma yetkisini, doğrudan ceza verme yetkisiyle aynı sanırsın."},"E":{"gercek":"Madde 19/b, Yönetim, Disiplin ve Denetleme Kurulu üyeleri ile Birlik temsilcilerinin seçimini Genel Kurula verir.","ayirt":"Bu seçim, Oda düzeyinde mi yoksa Birlik düzeyinde mi yapılıyor?","paragraf":"m.19/b","yanilgi":"Organ üyelerinin seçiminin Birlik tarafından yapılan merkezi bir işlem olduğunu sanırsın."},"A":{"gercek":"Madde 19/d, Yönetim Kurulunca yapılacak tekliflerin incelenip karara bağlanmasını doğrudan Genel Kurula verir.","ayirt":"Bu işlem, Yönetim Kurulunun kendi kararı mı yoksa Genel Kurula sunduğu bir teklif mi?","paragraf":"m.19/d","yanilgi":"Yönetim Kurulu tekliflerini karara bağlamanın idari bir yürütme işi olduğunu, Genel Kurulu ilgilendirmediğini sanırsın."},"D":{"gercek":"Madde 19/f, bütçe ve kesinhesapları tasdik yetkisini açıkça Genel Kurula verir.","ayirt":"Bu belge nihai olarak kim tarafından onaylanıp yürürlüğe giriyor?","paragraf":"m.19/f","yanilgi":"Bütçe ve kesinhesap onayının mali uzmanlık gerektirdiğini, bu yüzden Yönetim Kuruluna ait olduğunu düşünürsün."},"B":{"gercek":"Madde 19/h, giriş ücreti ve yıllık aidatların tespitini açıkça Genel Kurula bırakır.","ayirt":"Bu tutar üyeler için bağlayıcı bir mali yük mü koyuyor, dolayısıyla Genel Kurul kararı mı gerekir?","paragraf":"m.19/h","yanilgi":"Aidat tespitinin mali/idari bir iş olduğunu, seçim ve karar organı olan Genel Kurulun görevi olmadığını düşünürsün."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 103"},"kural":"Yönetmelik m.14/1 uyarınca meslek mensupları kullanacakları tabelalarda internet adresi ile elektronik posta adresine yer verebilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 103","sonDonem":3,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Yönetmelikte \u0027yer alabilir\u0027 ile \u0027zorunludur\u0027 ve \u0027asılamaz\u0027 ile \u0027yer verilemez\u0027 ifadelerini karıştırma; her fıkrayı ayrı ayrı hangi fiille bittiğine bakarak oku.","konu":"internet reklam yasağı","tablo":{"satirlar":[["A) Tabelada yabancı dillerde yazılmış ifadelere yer verileb…","m.14/1","YANLIŞ ifade"],["B) Kartvizitler, reklam niteliği taşıyacak şekilde düzenlen…","m.15/1","YANLIŞ ifade"],["C) Meslek mensupları kullanacakları tabelalarda internet ad…","m.14/1","doğru ifade"],["D) Bina cephesine ve büro pencerelerine birden fazla tabela…","m.14/3","YANLIŞ ifade"],["E) Ortaklık şeklinde çalışılması halinde, birlikte çalışan …","m.14/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Meslek mensupları kullanacakları tabelalarda internet adresi ile elektronik posta adresine yer verebilir.","E":"Ortaklık şeklinde çalışılması halinde, birlikte çalışan meslek mensuplarının ad ve soyadlarının tabelada yer alması zorunlu değildir.","A":"Tabelada yabancı dillerde yazılmış ifadelere yer verilebilir.","D":"Bina cephesine ve büro pencerelerine birden fazla tabela asılabilir.","B":"Kartvizitler, reklam niteliği taşıyacak şekilde düzenlenebilir."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.20 [1/2]","metin":"Madde 20 – Genel Kurul üç yılda bir Mayıs ayının içinde başkanın daveti üzerine bütçeyi ve gündemdeki diğer maddeleri görüşmek ve gereken seçimleri yapmak üzere toplanır.10 Oda Yönetim Kurulu Başkanı, Yönetim veya Denetleme Kurulu gerekli gördüğü hallerde Genel Kurulu toplantıya çağırabilir. Oda Yönetim Kurulu Başkanı, Odaya kayıtlı üyelerin beşte birinin görüşme konularını belirten yazılı talebi ile en geç 15 gün içinde Genel Kurulu toplantıya çağırmak zorundadır. (Değişik dördüncü fıkra:27/3/2025-7546/2 md.) Oda Genel Kurul toplantısının yeri, günü, saati ve gündemi ile ilk toplantıda yeterli çoğunluk olmadığı takdirde yapılacak ikinci toplantının yeri, günü, saati ve gündemi, ilk toplantı tarihinden en az 10 gün öncesinden Genel Kurul toplantısı tarihine kadar yayımda kalacak şekilde Odanın resmi internet sitesinde ilan edilir. Oda Genel Kurulu üye tam sayısının salt çoğunluğu ile toplanır. İlk toplantıda yeterli çoğunluk sağlanamazsa ikinci toplantıda çoğunluk aranmaz. Ancak, ikinci toplantıya katılan üye sayısı; Yönetim, Disiplin ve Denetleme Kurulları asıl üyelerinin toplamının iki katından 16/6/2009 tarihli ve 5904 sayılı Kanunun 39 uncu maddesiyle; bu bentte yer alan “Yıllık” ibaresi madde metninden çıkarılmıştır. 10 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu fıkrada yer alan \"yılda bir defa\" ibaresi \"üç yılda bir\" şeklinde değiştirilmiştir. 9 aşağı olamaz. Gerek olağan, gerekse olağanüstü Genel Kurul toplantılarında ilk iş olarak toplantıya bir başkan, bir başkanvekili ile iki katip üyeden kurulu bir başkanlık divanı seçilir. Seçim ayrı ayrı ve…"},{"ad":"SMMM K. (3568 s.K.) m.34 [1/2]","metin":"Madde 34 – Genel Kurul üç yılda bir Eylül ayında Birlik Yönetim Kurulu Başkanının daveti üzerine toplanır.15 Birlik Yönetim Kurulu Başkanı, Birlik Yönetim veya Denetleme Kurulunun gerekli gördüğü hallerde Genel Kurulu olağanüstü toplantıya çağırabilir. Ayrıca mevcut temsilcilerin beşte birinin yazılı talebi ile Genel Kurulun olağanüstü toplantıya çağrılması mecburidir. (Değişik üçüncü fıkra:27/3/2025-7546/3 md.) Birlik Genel Kurul toplantısının yeri, günü, saati ve gündemi ile ilk toplantıda yeterli çoğunluk olmadığı takdirde yapılacak ikinci toplantının yeri, günü, saati ve gündemi, ilk toplantı tarihinden en az yirmi gün önce tirajı yüzbinin üzerinde olan bir gazetede ilan edilir ve Genel Kurul toplantısı tarihine kadar yayımda kalacak şekilde Birlik resmi internet sitesinde duyurulur. Genel Kurul, temsilcilerin tamsayısının salt çoğunluğu ile toplanır. İlk toplantıda yeterli çoğunluk sağlanamazsa ikinci toplantıda çoğunluk aranmaz. Ancak ikinci toplantıya katılan temsilci sayısı Birlik Yönetim, Disiplin ve Denetleme kurulları asıl üyeleri toplamının iki katından az olamaz. Genel Kurul toplantıları ilanda belirtilen gün, yer ve saatte yapılır. Temsilciler Birlik Yönetim Kurulunca düzenlenen listedeki adları karşısına imza koyarak toplantı yerine girerler. Toplantı, Birlik Yönetim Kurulu Başkanı veya görevlendireceği bir kurul üyesi tarafından açıldıktan sonra toplantıyı yönetmek üzere bir Divan Başkanı, bir Başkanvekili ve iki katip üye seçilir. Genel Kurul toplantılarında önceden bildirilen gündemdeki konular görüşülür. Ancak Birlik Genel Kurulu temsilcilerinin beşte iki…"}],"hakem":"Soru, Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.14/1\u0027de açıkça düzenlenen tabela kurallarını ölçmekte, doğru seçenek kaynakta mutlak desteklenmiş ve hiçbir kapıda sorun yoktur."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği\u0027ne göre, meslek mensuplarının tabela ve basılı evrakta internet adresi kullanımına ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-25","verilenler":[],"dayanak":"Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.14/1, m.14/2, m.14/3, m.15/1","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir SMMM bürosu, ofis kapısına yeni bir tabela astırıyor; tabelada büronun adı, unvanı, adresi ve www.busmmm.com.tr yazıyor.","anlatim":"Büro sahibi tabelaya neler yazabileceğini merak ediyor, çünkü rakip ofiste renkli bir tabela ve iki ayrı pano görmüş. Bu olayda beş farklı iddiayı tek tek test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Yönetmelik m.14 tabelada nelerin yer alabileceğini, m.14/2 kimlerin adının zorunlu olduğunu, m.14/3 kaç tabela asılabileceğini, m.15 ise basılı evrakın reklam sınırını söyler.","anlatim":"Bu SMMM bürosunun tabelasını ve kartvizitini bu maddelere göre değerlendireceğiz. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.14/1","karar":"yanlış","anlatim":"Yönetmelik m.14/1 tabelada yer alabilecek unsurları sınırlı sayar, yabancı dilde ibare bunlar arasında değildir. Büro sahibi bu ibareyi eklerse kurala aykırı davranmış olur.","formul":"Şık A: Büro sahibi tabelaya İngilizce \u0027Certified Public Accountant\u0027 ibaresini de eklemek istiyor, buna izin var mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.15/1","karar":"yanlış","anlatim":"Yönetmelik m.15/1 basılı evrakın reklam niteliği taşımasını yasaklar, bu ifade açıkça tanıtım amaçlıdır. Onaylarsan kurala aykırı bir belge çıkmış olur.","formul":"Şık B: Sekreter, kartvizitleri \u0027bize gelin, en uygun fiyat bizde\u0027 yazacak şekilde bastırmayı öneriyor, onaylar mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.14/1","karar":"doğru","anlatim":"Yönetmelik m.14/1 açıkça internet adresi ile elektronik posta adresinin tabelada yer alabileceğini söyler. Büro sahibi bunu yazdırabilir, kurala aykırılık yoktur.","formul":"Şık C: Büro sahibi tabelaya www.busmmm.com.tr ve info@busmmm.com.tr yazdırmak istiyor, bu mümkün mü?"},{"doldu ,"metin":"Basılı evrakın tanıtım amaçlı serbestçe tasarlanabileceğini sanırsın. Doğrusu: Başlıklı kağıtlar, kartvizitler ve diğer basılı evrak reklam niteliği taşıyacak şekilde düzenlenemez."}},"celdiriciYol":{},"hap":"Meslek mensubunun tabelasında yer alacak unvan, adres, telefon ve internet/e-posta adresi bilgisi reklam sayılmaz; ancak yabancı ibare, birden fazla tabela ve reklam nitelikli basılı evrak yasaktır.","teshis":{"C":{"gercek":"Yönetmelik m.14/1 açıkça tabelada internet adresi ile elektronik posta adresinin yer alabileceğini belirtir; bu bilgi reklam kapsamı dışındadır.","ayirt":"Madde bu unsuru izin verilenler arasında sayıyor mu?","paragraf":"m.14/1","yanilgi":"İnternet adresi paylaşmanın da bir tür reklam sayılıp yasak olduğunu düşünerek bu şıkkı elersin."},"E":{"gercek":"Yönetmelik m.14/2, birlikte çalışan meslek mensuplarının ad ve soyadlarının tabelada yer almasını zorunlu kılar.","ayirt":"Madde bu unsuru \u0027yer alabilir\u0027 mi yoksa \u0027zorunludur\u0027 mu diyor?","paragraf":"m.14/2","yanilgi":"Ortaklık unvanı yeterliyken ayrıca ortak adlarının yazılmasının isteğe bağlı olduğunu düşünüyorsun."},"A":{"gercek":"Yönetmelik m.14/1, tabelada yer alabilecek unsurları sınırlı sayar; bunun dışında yabancı dilde ifadeye izin vermez.","ayirt":"Bu unsur maddede sayılanlar arasında mı?","paragraf":"m.14/1","yanilgi":"Tabelanın serbest tasarım alanı olduğunu, her dilde ibareye izin verildiğini sanıyorsun."},"D":{"gercek":"Yönetmelik m.14/3, bina cephesi, balkon ve pencerelere birden fazla tabela asılmasını açıkça yasaklar.","ayirt":"Aynı bina üzerinde ikinci bir tabelaya izin var mı?","paragraf":"m.14/3","yanilgi":"Görünürlük için binanın farklı yerlerine birden fazla tabela asılabileceğini sanıyorsun."},"B":{"gercek":"Yönetmelik m.15/1, basılı evrakın reklam niteliği taşıyacak şekilde düzenlenmesini yasaklar.","ayirt":"Bu belge bilgi mi veriyor yoksa tanıtım mı yapıyor?","paragraf":"m.15/1","yanilgi":"Kartvizit ve başlıklı kağıtları tanıtım/pazarlama aracı gibi kullanabileceğini düşünüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 103"},"kural":"madde 1, gerçek durumun ilgililerin ve resmi mercilerin istifadesine tarafsız sunulmasını ve yüksek mesleki standartların gerçekleştirilmesini amaç sayar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 103","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Roma rakamlı önermelerde her maddeyi tek başına madde 1\u0027in amaç cümlesiyle karşılaştır, tarafsızlığı bozan ya da kapsamı daraltan ifadeyi hemen ele.","konu":"meslek mensubu etik sosyal sorumluluk","tablo":{"satirlar":[["A) Yalnız I","3568 s.K. m.1","doğru ifade"],["B) I ve III","3568 s.K. m.1","YANLIŞ ifade"],["C) II ve IV","3568 s.K. m.1","doğru ifade"],["D) I, II ve III","3568 s.K. m.1","YANLIŞ ifade"],["E) I ve IV","3568 s.K. m.1","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"II ve IV","E":"I ve IV","A":"Yalnız I","D":"I, II ve III","B":"I ve III"},"kaynak":{"alinti":"gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak","liste":[{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"},{"ad":"SMMM K. (3568 s.K.) m.2 [2/2]","metin":"Meslek unvanlarının haksız kullanılması"}],"hakem":"Madde 1\u0027de yer alan \u0027gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak\u0027 ve \u0027yüksek mesleki standartları gerçekleştirmek\u0027 hükümleri doğru sıkkı (I ve III) tamamen desteklemektedir."},"kayitlar":[],"sade":{"siklar":{"C":"İkinci önerme müşteri isteğiyle sonuçları değiştirmeyi onaylar ama kanun tarafsız sunmayı emreder. Dördüncü önerme sorumluluk alanını daraltır ama kanun resmi mercileri de içerir.","E":"Sorumluluğu yalnız ücret alınan işletmeyle sınırlı sanırsın ama kanun gerçek durumun resmi mercilerin de istifadesine sunulmasını gerektirir.","D":"Müşteri lehine farklı gösterme davranışını mesleki bağlılık sanıp bu önermeyi doğru sayarsın. Oysa bu davranış tarafsızlık ilkesini ihlal eder.","A":"Sadece birinci önermeyi seçersen, yüksek mesleki standartları gerçekleştirme amacını gözden kaçırırsın. Kanun her iki amacı birlikte sayar."},"dogru":"Kanun, meslek mensubunun gerçek durumu tarafsız sunmasını ve yüksek mesleki standartları gerçekleştirmesini amaçlar. Müşteri isteğiyle sonuçları değiştirmek tarafsızlığı bozar. Resmi mercilere karşı sorumluluk yalnız ücret alınan işletmeyle sınırlı değildir.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 1. madde.","kavramlar":[{"kaynak":"SMMM K. 1. madde","tanim":"Meslek mensubunun faaliyet sonuçlarını gerçek durumlarıyla ilgili mevzuat çerçevesinde ilgililerin ve resmi mercilerin istifadesine sunması.","ad":"Tarafsız sunma"},{"kaynak":"SMMM K. 1. madde","tanim":"Faaliyet sonuçlarını denetlemeye ve değerlendirmeye yetkili kamu kurumları ve yetkilileri.","ad":"Resmi merciler"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Kanunun amacına göre: I. Meslek mensubu, faaliyet sonuçlarını resmi mercilere tarafsız sunar. II. Müşterisinin isteğiyle sonuçları farklı gösterebilir. III. Yüksek mesleki standartları gerçekleştirmeyi amaçlar. IV. Yalnız ücret aldığı işletmeye karşı sorumludur. Hangileri doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-12","verilenler":[],"dayanak":"3568 sayılı SMMM Kanunu m.1","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir SMMM, 2019 yılında müşterisi olan bir tekstil firmasının yıl sonu kâr rakamını hazırlıyor.","anlatim":"Firma sahibi, bankadan kredi alabilmek için kârın gerçekte olduğundan yüksek gösterilmesini istiyor. SMMM bu talebi kabul etmiyor, gerçek rakamı resmi mercilere olduğu gibi bildiriyor.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanunun 1. maddesindeki amaç cümlesini bu olayda tek tek deneyeceğiz: tarafsız sunum, resmi mercilere kapsam, yüksek mesleki standart, müşteri isteğiyle değişiklik, sorumluluk sınırı. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"3568 s.K. m.1","karar":"doğru","anlatim":"Olayda SMMM gerçek kârı olduğu gibi bildiriyor, hiçbir tarafı kayırmıyor. Madde 1 tam olarak bunu ister: gerçek durumun tarafsız sunulması.","formul":"Şık A: SMMM\u0027nin faaliyet sonucunu resmi mercilere tarafsız sunması, kanunun amacına uyar mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"3568 s.K. m.1","karar":"yanlış","anlatim":"Olayda SMMM bunu reddetti çünkü bu davranış tarafsızlığı bozar. Madde 1 gerçek durumun tarafsız sunulmasını emreder, müşteri isteğiyle değiştirme bu amaca aykırıdır.","formul":"Şık B: firma sahibinin isteğiyle SMMM kârı farklı gösterse, bu davranış kanunun amacına uyar mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"3568 s.K. m.1","karar":"doğru","anlatim":"Olayda SMMM özenle, doğru rakamlarla çalışıyor; bu tam olarak standardı yükseltmek demek. Madde 1 bunu açıkça amaç sayar.","formul":"Şık C: SMMM\u0027nin işini yaparken yüksek mesleki standartları gerçekleştirmeyi amaçlaması, kanunun amacına uyar mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"3568 s.K. m.1","karar":"yanlış","anlatim":"Olayda SMMM aslında bankaya, yani resmi mercilere ve ilgililere karşı da sorumlu davranıyor. Madde 1 sorumluluğu yalnız işletmeyle sınırlamaz, ilgililer ve resmi merciler de kapsamdadır.","formul":"Şık D: SMMM yalnız kendisine ücret ödeyen firmaya karşı sorumlu olsaydı, bu kanunun amacına uyar mıydı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"3568 s.K. m.1","karar":"doğru","anlatim":"Olayın kendisi bu doğru davranışı gösteriyor, SMMM tarafsız kaldı. Madde 1 zaten bunu amaç sayar, yani doğru davranış budur.","formul":"Şık E: firma sahibinin isteğini kabul etmek yerine gerçek durumu bildirmek, kanunun amacına uyar mı?"},{"formul":"Kapanış: A ✓ B ✗ C ✓ D ✗ E ✓","anlatim":"Kanunun amacı iki ayakta durur: tarafsız sunum ve yüksek mesleki standart, geri kalan her şey bunlardan birini bozar. Kendine sor: bu davranış gerçek durumu mu yansıtıyor, yoksa bir tarafın çıkarını mı kolluyor?","doldur":[]}],"anahtar":[{"ornek":"gerçek","kok":"gerçek"},{"ornek":"tarafsız","kok":"tarafs"},{"ornek":"durumun","kok":"durumu"},{"ornek":"davranış","kok":"davran"},{"ornek":"mercilerin","kok":"mercil"},{"ornek":"standartların","kok":"standa"}],"konuGiris":{"harita":"Bu ilke ne zaman test edilir: kanunun amaç maddesiyle ilgili doğru-yanlış önermelerinde test edilir. Nasıl ölçülür: önermelerin kanunun amacına uygun olup olmadığına bakılarak ölçülür. Nasıl kaydedilir: doğru önermeler seçilip yanlış olanlar elenerek cevap oluşturulur.","desen":"Sınav genellikle amaç maddesindeki tarafsızlık ve yüksek standart ifadelerini çarpıtan yanlış önermeler ekler. Tuzak, müşteri isteğiyle sonuç değiştirme veya yalnız işverene sorumluluk gibi ifadelerle kurulur. Bu soru kanunun amaç maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"faaliyet sonuçlarının gerçek durumu yansıtacak şekilde sunulması ilkesi","ad":"tarafsızlık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"mesleğin güvenilirliğini artıracak kalite düzeyinin gerçekleştirilmesi hedefi","ad":"yüksek mesleki standart","kim":"meslek kuruluşu düzenler"},{"kaynak":"soruda verilir","tanim":"faaliyet sonuçlarının ilgili devlet kurumlarının istifadesine tarafsız aktarılması","ad":"resmi mercilere sunum","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"meslek mensubunun yalnız müşteriye değil ilgililere ve resmi mercilere karşı görevi","ad":"sorumluluk kapsamı","kim":"kanun sabitler"}],"sinavda":"Kanunun amacına ilişkin dört önerme verilip hangilerinin doğru olduğu istenir.","panel_ornek":"Bir tamirci arabanı tamir ettikten sonra raporu hem sana hem trafik polisine aynı şekilde yazar, müşteri memnun olmasa da gerçeği değiştirmez. Çünkü onun görevi sadece seni değil, ilgili tüm tarafları doğru bilgilendirmektir.","ornek":"Bir tamirci arabanı tamir ettikten sonra raporu hem sana hem trafik polisine aynı şekilde yazar, müşteri memnun olmasa da gerçeği değiştirmez. Çünkü onun görevi sadece seni değil, ilgili tüm tarafları doğru bilgilendirmektir.","yontemler":"Amaç maddesindeki üç unsuru (tarafsızlık, denetim, yüksek standart) tek tek önermelerle eşleştir; müşteri lehine sapma veya dar sorumluluk ifade eden önermeleri hemen ele.","nedir":"Bu kanun, meslek mensuplarının işlerini nasıl ve kime karşı sorumlulukla yapacağını belirler. Sınav, tarafsızlık ve yüksek mesleki standart amacının doğru hatırlanıp hatırlanmadığını ölçer."},"olay":"bu iki unsur I ve III önermelerinde yer alır, II tarafsızlığı, IV ise mercilere karşı sorumluluğu ortadan kaldırır.","tuzak":{"C":{"ad":"Zıt Kutup Tuzağı","metin":"İki yanlış önermeyi (tarafsızlığı bozma ve mercilere sorumsuzluk) doğruymuş gibi seçiyorsun. Doğrusu: madde 1 tam tersini, tarafsız sunumu ve resmi mercilere karşı sorumluluğu emreder."},"E":{"ad":"Kapsam Daraltma Tuzağı","metin":"Sorumluluğu yalnız ücret alınan işletmeyle sınırlı sanıyorsun. Doğrusu: madde 1, gerçek durumun resmi mercilerin de istifadesine sunulmasını öngörür, sorumluluk işletmeyle sınırlı değildir."},"D":{"ad":"Sadakat Tuzağı","metin":"Müşteri lehine farklı gösterme davranışını mesleki bağlılık sanıp III\u0027e ekliyorsun. Doğrusu: bu davranış tarafsızlık ilkesini bozar, madde 1\u0027in amacına aykırıdır ve doğru önermelere dahil edilemez."},"A":{"ad":"Eksik Seçim Tuzağı","metin":"Yalnız tarafsız sunma unsurunu görüp yüksek mesleki standartları gerçekleştirme amacını gözden kaçırıyorsun. Doğrusu: 3568 sayılı Kanunun 1 inci maddesindeki amaç hem tarafsız sunmayı hem yüksek standardı birlikte sayar, bu yüzden I ve III birlikte doğrudur."}},"celdiriciYol":null,"hap":"3568 sayılı Kanunun amacı, gerçek durumun ilgililer ve resmi mercilerin istifadesine tarafsız sunulmasını ve yüksek mesleki standartların gerçekleştirilmesini birlikte kapsar.","teshis":{"C":{"gercek":"Madde 1 hem tarafsızlığı hem resmi mercilere karşı sorumluluğu emreder; ikisi de bu önermelerde ihlal edilmiştir.","ayirt":"Bu önerme kanunun tarafsızlık ve kapsam şartlarından hangisini ihlal ediyor?","paragraf":"3568 s.K. m.1","yanilgi":"Sonuçları farklı göstermeyi mesleki esneklik, sorumluluğu tek tarafla sınırlamayı ise doğal sanıyorsun."},"E":{"gercek":"Madde 1 açıkça gerçek durumun \u0027ilgililerin ve resmi mercilerin istifadesine\u0027 sunulmasını öngörür, kapsam işletmeyle sınırlı değildir.","ayirt":"Amaç maddesinde faaliyet sonuçlarının kime sunulacağı sayılıyor mu?","paragraf":"3568 s.K. m.1","yanilgi":"Sorumluluğun yalnız ücret alınan işletmeye karşı olduğunu, resmi mercilerin kapsam dışı kaldığını düşünüyorsun."},"A":{"gercek":"Madde 1 amacı iki unsuru birlikte sayar: tarafsız sunum ve yüksek mesleki standart.","ayirt":"Metinde amaç cümlesinde birden fazla hedef var mı diye tekrar okudum mu?","paragraf":"3568 s.K. m.1","yanilgi":"Tarafsız sunma unsurunu bulunca soruyu bitmiş sayıyorsun, ikinci doğru önermeyi aramıyorsun."},"D":{"gercek":"Madde 1\u0027in amacı gerçek durumun tarafsız sunulmasıdır; müşteri isteğiyle farklı gösterme bu amacın doğrudan zıddıdır.","ayirt":"Bu önerme gerçek durumu mu yansıtıyor, yoksa bir tarafın çıkarını mı gözetiyor?","paragraf":"3568 s.K. m.1","yanilgi":"Üç önermeyi birden doğru sayarak II\u0027deki tarafsızlık ihlalini fark etmiyorsun."},"B":{"gercek":"Madde 1, gerçek durumun ilgililer ve resmi mercilerin istifadesine TARAFSIZ sunulmasını amaçlar; müşteri talimatıyla değiştirme bu amaca aykırıdır.","ayirt":"Bu davranış gerçek durumu olduğu gibi mi yansıtıyor, yoksa bir tarafı mı kayırıyor?","paragraf":"3568 s.K. m.1","yanilgi":"II\u0027nin müşteri sadakati gibi göründüğü için doğru sanılabileceğini, oysa bunun tarafsızlığı bozduğunu göz ardı edebilirsin."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 95"},"kural":"213 madde 4, (a)\u0027dan (f)\u0027ye altı bent sayar; süre/deneyim şartı bu bentler arasında yoktur, deneyim staj sürecine ilişkin ayrı bir konudur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 95","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 4\u0027ün altı bendini (vatandaşlık, ehliyet, kamu hakları, ceza mahkumiyeti yokluğu, memuriyetten çıkarılmamış olma, şeref-haysiyet) sırayla say; listede olmayan her ifade doğru şıktır.","konu":"meslek mensubu olma engelleri","tablo":{"satirlar":[["A) Türkiye Cumhuriyeti vatandaşı olmak","m.4/a","doğru ifade"],["B) Medeni hakları kullanma ehliyetine sahip bulunmak","m.4/b","doğru ifade"],["C) En az beş yıl mesleki deneyime sahip olmak","m.4","YANLIŞ ifade"],["D) Kamu haklarından mahrum bulunmamak","m.4/c","doğru ifade"],["E) Meslek şeref ve haysiyetine uymayan durumları bulunmamak","m.4/f","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"En az beş yıl mesleki deneyime sahip olmak","E":"Meslek şeref ve haysiyetine uymayan durumları bulunmamak","A":"Türkiye Cumhuriyeti vatandaşı olmak","D":"Kamu haklarından mahrum bulunmamak","B":"Medeni hakları kullanma ehliyetine sahip bulunmak"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"},{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"}],"hakem":"Madde 4\u0027te a-f bentleri arasında mesleki deneyim şartı yer almamaktadır; deneyim staj ve sınav şartlarına ilişkin ayrı hükümlerle düzenlenmiş olup, genel şartlar arasında bulunmamaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Kamu haklarından mahrum bulunmamak madde 4\u0027ün (c) bendinde ayrı bir bent olarak kanunda düzenlenmiştir.","E":"Meslek şeref ve haysiyetine uygunluk madde 4\u0027ün (f) bendinde kanunun kendisinde sayılmış genel şarttır.","A":"Vatandaşlık şartı madde 4\u0027ün (a) bendinde açıkça yazılıdır ve kanunun genel şartlarından biridir.","B":"Medeni hakları kullanma ehliyeti madde 4\u0027ün (b) bendinde kanunun kendisinde sayılmış genel şarttır."},"dogru":"Kanun meslek mensubu olabilmenin genel şartlarını altı bent halinde sayar: vatandaşlık, medeni ehliyet, kamu haklarından mahrumiyet, ceza mahkumiyeti, memuriyetten çıkarılma ve şeref-haysiyet. En az beş yıl deneyim şartı bu genel şartlar arasında yer almaz.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 4. madde","kavramlar":[{"kaynak":"SMMM K. 4. madde","tanim":"Serbest muhasebeci mali müşavir veya yeminli mali müşavir olabilmek için kanunda açıkça sayılan ve herkes tarafından taşınması gereken temel koşullar.","ad":"Meslek mensubu olabilmenin genel şartları"},{"kaynak":"SMMM K. 4. madde","tanim":"Devlet tarafından sağlanan ve kullanılan hakların kaybedilmiş olması halidir.","ad":"Kamu haklarından mahrumiyet"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3","2017/3"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre meslek mensubu olabilmenin genel şartlarından hangisi bu Kanunda yer almaz?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-16","verilenler":[],"dayanak":"3568 sayılı SMMM Kanunu m.4","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir muhasebe ofisinde çalışan Emre, 2019\u0027da stajını bitirip SMMM sınavına girmeye hazırlanıyor; ofis sahibi ona \u0027başvuru öncesi şu beş şartı kontrol et\u0027 diyor.","anlatim":"Emre elindeki listeyi 3568 sayılı Kanun\u0027un madde 4\u0027üyle karşılaştırıyor. Listede beş madde var, kanunda ise altı bent var. Şimdi bu beş ifadeyi tek tek kanunla eşleştireceğiz.","doldur":[]},{"formul":"Ne yapacağız: Madde 4, meslek mensubu olmanın genel şartlarını (a)\u0027dan (f)\u0027ye altı bent halinde sayıyor; Emre\u0027nin listesindeki her ifadenin bu altı bentten birine karşılık gelip gelmediğine bakacağız.","anlatim":"Kural tek: madde 4\u0027te yazan neyse genel şarttır, yazmayan değildir. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.4/a","karar":"doğru","anlatim":"Madde 4/a bunu doğrudan ilk bent olarak sayıyor. Emre\u0027nin listesi burada kanunla birebir örtüşüyor.","formul":"Şık A: Emre listesinde \u0027T.C. vatandaşı olmalıyım\u0027 yazmış, bunu genel şart sayar mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.4/b","karar":"doğru","anlatim":"Madde 4/b bunu ikinci bent olarak açıkça sayıyor. Emre yine doğru yazmış.","formul":"Şık B: Emre \u0027medeni hakları kullanma ehliyetim olmalı\u0027 diye not almış, bu bir genel şart mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.4","karar":"yanlış","anlatim":"Madde 4\u0027ün altı bendinde hiçbir yerde yıl bazlı deneyim süresi geçmiyor, staj ayrı bir konudur. Ofis sahibi burada yanılıyor, Emre\u0027nin listesinde bu madde hiç olmamalı.","formul":"Şık C: Ofis sahibi \u0027en az beş yıl deneyimin olmalı, yoksa genel şartı taşımazsın\u0027 diyor; buna katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.4/c","karar":"doğru","anlatim":"Madde 4/c bunu üçüncü bent olarak sayıyor. Emre\u0027nin listesi yine kanunla uyuşuyor.","formul":"Şık D: Emre \u0027kamu haklarından mahrum olmamalıyım\u0027 yazmış, bu genel şart mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.4/f","karar":"doğru","anlatim":"Madde 4/f bunu son bent olarak açıkça sayıyor. Emre listesinin son maddesi de doğru çıkıyor.","formul":"Şık E: Emre \u0027meslek şeref ve haysiyetime uymayan durumum olmamalı\u0027 diye not düşmüş, genel şart mı bu?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Emre\u0027nin beş maddelik listesinden sadece deneyim süresi kanunda yok, geri kalan dördü madde 4\u0027ün bentleriyle birebir örtüşüyor. Kendine hep şunu sor: bu ifade madde 4\u0027ün altı bendinden hangisine karşılık geliyor, yoksa staj/sınav gibi başka bir maddenin konusu mu?","doldur":[]}],"anahtar":[{"ornek":"deneyim","kok":"deneyi"},{"ornek":"listesi","kok":"listes"},{"ornek":"sayıyor","kok":"sayıyo"},{"ornek":"kanunla","kok":"kanunl"},{"ornek":"süresi","kok":"süresi"},{"ornek":"sayılı","kok":"sayılı"}],"konuGiris":{"harita":"Hangi belgede aranır: kanunun ilgili maddesinde sayılan şartlar listesinde aranır. Nasıl ölçülür: soruda verilen şıklardan kaç tanesinin bu listede gerçekten var olduğu karşılaştırılarak ölçülür. Nasıl kaydedilir: listede yer almayan şık doğru cevap olarak işaretlenir.","desen":"Soru, gerçek şartlar listesine benzeyen ama listede yer almayan bir şıkkı sızdırır; genelde diploma türü, staj süresi gibi özel şartlarla genel şartları karıştırtır. Tuzak, genel şartlar maddesinde sayılmayan bir kavramı sanki oradaymış gibi sunmaktır. Arşivde bir dönem çıkmıştır. Bu soru meslek mensubu olmanın genel şartları maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"meslek mensubu olmak için herkeste aranan ortak koşul","ad":"genel şart","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"T.C. vatandaşı olma koşulu, istisnası saklı tutulur","ad":"vatandaşlık şartı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"belirli ağır suçlardan hüküm giymemiş olma koşulu","ad":"suçtan mahkumiyet yasağı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"mesleğin şeref ve onuruna aykırı halin bulunmaması koşulu","ad":"meslek haysiyeti şartı","kim":"meslek kuruluşu düzenler"}],"sinavda":"Şıklarda birkaç şart verilir ve kanunda sayılmayan tek şık sorulur.","panel_ornek":"Bir spor kulübüne üye olmak için tüzükte üç şart yazar: yaş, aidat ve sağlık raporu. Biri sana dördüncü bir şart daha söylese, \u0027boy sınırı da var\u0027 dese, tüzükte böyle bir madde olmadığını fark edersin. İşte kanundaki şartlar da tüzük gibi sabittir, olmayanı eklemek yanıltmacadır.","ornek":"Bir spor kulübüne üye olmak için tüzükte üç şart yazar: yaş, aidat ve sağlık raporu. Biri sana dördüncü bir şart daha söylese, \u0027boy sınırı da var\u0027 dese, tüzükte böyle bir madde olmadığını fark edersin. İşte kanundaki şartlar da tüzük gibi sabittir, olmayanı eklemek yanıltmacadır.","yontemler":"Her şıkkı tek tek genel şartlar listesiyle eşleştir; listede birebir karşılığı olmayan şık cevaptır.","nedir":"Bu konu, bir meslek mensubu olmak için kanunun aradığı genel şartları anlatır. Sınav, hangi şartın kanunda gerçekten yazdığını, hangisinin sınav kağıdının uydurma bir şart olduğunu ölçer."},"olay":"","tuzak":{"D":{"ad":"Kamu Hakları Tuzağı","metin":"Öğrenci bu bendi ceza mahkumiyeti şartıyla karıştırıp kanunda olmadığını düşünür. Doğrusu: Kamu haklarından mahrum bulunmamak madde 4/c\u0027de ayrı bir bent olarak düzenlenmiştir."},"E":{"ad":"Haysiyet Tuzağı","metin":"Öğrenci bu ifadeyi etik ilkeler yönetmeliğine ait sanıp kanunda yer almadığını düşünür. Doğrusu: Meslek şeref ve haysiyetine uymayan durumların bulunmaması madde 4/f\u0027de kanunun kendisinde sayılmıştır."},"A":{"ad":"Vatandaşlık Tuzağı","metin":"Öğrenci madde 4\u0027teki (a) bendini kanunda yer almayan bir şart sanıp işaretler. Doğrusu: T.C. vatandaşı olmak madde 4/a\u0027da açıkça sayılan genel şartlardan biridir."},"B":{"ad":"Ehliyet Tuzağı","metin":"Öğrenci medeni hakları kullanma ehliyetini staj yönetmeliğine ait sanır. Doğrusu: Bu şart madde 4/b\u0027de kanunun kendisinde yer alır."}},"celdiriciYol":null,"hap":"Meslek mensubu olabilmenin genel şartları 3568 sayılı Kanunun 4 üncü maddesinde (a)\u0027dan (f)\u0027ye altı bent halinde sayılıdır; deneyim/kıdem süresi bu maddede yer almaz.","teshis":{"C":{"gercek":"Madde 4, (a)\u0027dan (f)\u0027ye altı bent sayar; hiçbirinde yıl bazlı deneyim şartı yoktur, staj süresi ayrı maddelerin konusudur.","ayirt":"Madde 4\u0027ün altı bendini tek tek sayıp bu ifadenin hangisine denk geldiğini bulabiliyor muyum?","paragraf":"m.4","yanilgi":"Deneyim/kıdem süresinin de genel şartlar arasında sayıldığını düşünüyorsun; oysa madde 4 böyle bir süre öngörmez."},"E":{"gercek":"Madde 4/f bu şartı doğrudan kanun metninde son bent olarak sayar.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi?","paragraf":"m.4/f","yanilgi":"Meslek şeref ve haysiyeti şartının etik ilkeler yönetmeliğinden geldiğini, kanunda olmadığını sanıyorsun."},"A":{"gercek":"Madde 4/a, T.C. vatandaşı olmayı doğrudan kanun metninde sayar.","ayirt":"Bu ifade madde 4\u0027ün (a)-(f) bentlerinden birine mi karşılık geliyor?","paragraf":"m.4/a","yanilgi":"Vatandaşlık şartının yönetmelikten geldiğini, kanunda geçmediğini sanıyorsun."},"D":{"gercek":"Madde 4/c bunu bağımsız bir bent olarak kanunda sayar.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi?","paragraf":"m.4/c","yanilgi":"Kamu haklarından mahrumiyeti ceza mahkumiyeti bendiyle aynı sanıp ayrı bir bent olmadığını düşünüyorsun."},"B":{"gercek":"Madde 4/b bu şartı kanunun kendisinde açıkça düzenler.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi?","paragraf":"m.4/b","yanilgi":"Medeni hakları kullanma ehliyetini staj başvuru koşulu sanıp kanun dışı görüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 109"},"kural":"3568 sayılı Kanunun 48 inci maddesine göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası verilir; bu hükümde kanun koyucu ceza türünde takdir bırakmamıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Her zaman/kesin uygulanır\u0027 ifadesi geçen kökte, önce maddede o ceza için takdir mi zorunluluk mu öngörüldüğüne bak; \u0027uygulanabilir\u0027 ifadesini gördüğün şıkkı hemen ele.","konu":"mesleki davranış ilkesi","tablo":{"satirlar":[["A) Mükellefle birlikte kasden vergi ziyaına sebebiyet verdi…","m.48/2","doğru ifade"],["B) Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmaya…","m.48/1","YANLIŞ ifade"],["C) Mesleğin vakar ve onuruna aykırı fiilde ilk defa bulundu…","m.48/1","YANLIŞ ifade"],["D) Tasdik yetkisini gerçeğe aykırı kullandığı Maliye Bakanl…","m.48/1","YANLIŞ ifade"],["E) Üç yıllık bir dönem içinde iki veya daha fazla disiplin …","m.48/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Mesleğin vakar ve onuruna aykırı fiilde ilk defa bulunduğu tespit edilen meslek mensubuna.","E":"Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna.","A":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdiği mahkeme kararı ile kesinleşen mesl
