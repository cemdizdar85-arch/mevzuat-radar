<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".

   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. Koyu tema yalnız düğmeyle (data-theme="dark", tarayıcıda kc_tema) ya da ?tema=koyu ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}

.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}
#akis{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.kart{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;max-width:560px;margin:0 auto}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.78em;color:var(--dim);margin-bottom:8px}
.noktalar{display:flex;gap:5px}.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--cizgi);display:block}.noktalar i.ok{background:var(--yesil)}.noktalar i.yan{background:var(--kirmizi)}.noktalar i.simdi{outline:2px solid var(--mavi);outline-offset:1px}
.noktalar.cok{gap:3px;flex-wrap:wrap;max-width:58%;justify-content:center}.noktalar.cok i{width:5px;height:5px}
.tt.teori td:first-child{white-space:nowrap;font-weight:700;color:var(--dim);width:1%}
.sinavDil{font:inherit;font-size:.78em;color:var(--mavi);background:transparent;border:1px solid var(--cizgi);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer}
.sinavDilM{margin-top:6px;font-size:.86em;color:var(--dim);border-left:2px solid var(--cizgi);padding-left:8px}
.govde{flex:1;overflow-y:auto;padding-bottom:90px}
.rozet{display:inline-block;font-size:.72em;color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 50%,transparent);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}
.ipucu{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:.8em;pointer-events:none;animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.panel.acik{transform:translateY(0)}.tutamac{width:38px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 10px}
/* Cem 03.09 "gorunum boyle geliyor": KAPALI panel kartin altina (105%) kayiyor ve SONRAKI KARTIN ustune biniyordu.

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}

.ozet{font-size:.93em;margin:0 0 8px;line-height:1.45}.ozet b{color:var(--yesil)}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}

.cip2.ek{display:none}.cipler.acikEk .cip2.ek{display:inline-block}.cipler.acikEk .bDaha{color:var(--dim)}
.cipler .bDaha{border-style:dashed;color:var(--dim)}
.sek{display:none;margin-top:8px}.sek.acik{display:block;animation:gir .2s ease}
.panel{overscroll-behavior:contain}
.kavramL{margin:4px 0 8px;padding-left:18px}.kavramL li{margin:3px 0}.kavramL i{color:var(--dim);font-style:normal;font-size:.85em}
.panelBas{position:sticky;bottom:4px;display:block;margin:10px 0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:.84em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent)}

/* yanlis kutusu + hazirlik skoru */
.ustSag{display:flex;align-items:center;gap:6px}
.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}
.kutuEkran{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}.kutuEkran.acik{display:flex}
.kutuIc{background:var(--kart);width:min(100%,640px);max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 22px;border:1px solid var(--cizgi)}
@media(min-width:900px){.kutuEkran{align-items:center}.kutuIc{border-radius:18px}}
.kutuIc .basl{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}

.dersSat{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92em}.dersSat .bar{height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden}.dersSat .bar i{display:block;height:100%;background:var(--yesil)}
.kutuSat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.92em}
/* kaynak metni */
.kaynakAd{color:var(--mavi);font-weight:800;font-size:.85em;margin:8px 0 4px}.kaynakMetin{font-size:.9em;line-height:1.55;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px}.kaynakMetin mark{background:color-mix(in srgb,var(--altin) 35%,transparent);color:var(--yazi);padding:1px 2px;border-radius:3px}
/* sen anlat / t-hesabi / sinavda */
.ipnot{font-size:.84em;color:var(--dim);margin:2px 0 8px}
.anlatK{width:100%;background:var(--bg2);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 11px;font-size:.95em;font-family:inherit;resize:vertical}
.anlatSonuc{font-size:.92em;margin-top:8px;line-height:1.5}.anlatPuan{font-weight:800;font-size:1.05em;margin-bottom:4px}.anlatOrnek{margin-top:8px;border-left:4px solid var(--altin);padding:6px 10px;background:color-mix(in srgb,var(--altin) 8%,transparent);border-radius:0 8px 8px 0}
.tKutular{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:600px){.tKutular{grid-template-columns:1fr 1fr}}

.tGovde{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--yazi);min-height:88px}.tSol{border-right:2px solid var(--yazi);padding:6px 8px}.tSag{padding:6px 8px;text-align:right}

.cikmisK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.88em;color:var(--dim);line-height:1.45}.cikmisK .yil{display:inline-block;background:color-mix(in srgb,var(--mavi) 15%,transparent);color:var(--mavi);font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.85em}

.ogret{margin:4px 0 6px}.thpNot{font-size:.85em;color:var(--dim);margin:2px 0 8px}
.hesapK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.9em;line-height:1.45}.hesapK.yan{border-color:color-mix(in srgb,var(--kirmizi) 60%,transparent)}.hesapK.dog{border-color:color-mix(in srgb,var(--yesil) 60%,transparent)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.btn{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;font-size:.9em;cursor:pointer}.btn.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0}.btn.mavi{border-color:var(--mavi);color:var(--mavi)}
/* surukleme oyunu */

.oyun{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:20;overflow-y:auto}.oyun.acik{display:flex}

#akis,.govde,.tabloSar,.serit,.panel,.oyun{scrollbar-width:none}#akis::-webkit-scrollbar,.govde::-webkit-scrollbar,.tabloSar::-webkit-scrollbar,.serit::-webkit-scrollbar,.panel::-webkit-scrollbar,.oyun::-webkit-scrollbar{display:none}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

const SORULAR=[{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"3568 sayılı Kanun m.48/2 uyarınca beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası alan meslek mensubunun bu cezayı gerektiren fiili yeniden işlemesi halinde meslekten çıkarma cezası uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında olayın \u0027ilk kez mi yoksa tekrar mı\u0027 olduğuna ve varsa süre/adet eşiğine (üç yıl-tekerrür, beş yıl-iki alıkoyma) bak; kanunun özel eşik koyduğu durumlarda genel takdir veya kademeli ceza kuralları uygulanmaz.","konu":"disiplin cezalari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Ceza tekrar süresi","beş yıllık bir dönem","-"],["Alınan ceza sayısı","iki defa geçici alıkoyma cezası","-"],["HESAP","-","-"],["A) Geçici olarak mesleki faaliyetten alıkoyma cezası üçüncü…","m.48/2","YANLIŞ ifade"],["B) Disiplin kurulu takdirine göre kınama cezası verilir.","m.48/2","YANLIŞ ifade"],["C) Yeminli sıfatı kaldırılarak meslekten çıkarma cezası bir…","m.48/1","YANLIŞ ifade"],["D) İlk fiil olması nedeniyle uyarma cezası uygulanır.","m.48/1","YANLIŞ ifade"],["E) Meslekten çıkarma cezası uygulanır.","m.48/2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yeminli sıfatı kaldırılarak meslekten çıkarma cezası birlikte uygulanır.","E":"Meslekten çıkarma cezası uygulanır.","A":"Geçici olarak mesleki faaliyetten alıkoyma cezası üçüncü kez uygulanır.","D":"İlk fiil olması nedeniyle uyarma cezası uygulanır.","B":"Disiplin kurulu takdirine göre kınama cezası verilir."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"3568 sayılı SMMM Kanunu m.48/2\u0027de beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırıldıktan sonra aynı fiili yeniden işleyen meslek mensubuna meslekten çıkarma cezası uygulanacağı açıkça düzenlenmiştir ve soru bu kuralı doğru uygulamaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Yeminli sıfatının kaldırılmasını ağır cezalarla otomatik eklenen bir yaptırım sanabilirsin. Doğrusu: Yeminli sıfatının kaldırılması yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrürüne özgüdür.","A":"Üçüncü kez aynı cezanın uygulanacağını düşünebilirsin. Doğrusu: Kanun beş yıl içinde iki alıkoyma cezası sonrası tekrarda üçüncü alıkoyma değil, doğrudan meslekten çıkarma cezasını kesin olarak öngörür.","D":"Her olayı ilk defa işlenen fiil kabul edip uyarmayla başlanacağını düşünebilirsin. Doğrusu: Soruda beş yıl içinde iki alıkoyma cezası sonrası tekrar bahsedildiği için bu çok önceki fiillerdir, uyarma değil meslekten çıkarma cezası uygulanır.","B":"Disiplin kurulunun hafif ceza takdir edebileceği genel yetkisini burada da uygulanabilir sanabilirsin. Doğrusu: Bu durum için kanun sonucu kesin belirlenmiştir, kurula takdir alanı verilmemiştir."},"dogru":"Meslek mensubu beş yıl içinde iki kez alıkoyma cezası aldıktan sonra aynı fiili yeniden işlerse, kanun kesin olarak meslekten çıkarma cezası uygulanmasını öngörür. Takdir alanı yoktur.","sinav":"Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Kanunu 48. madde ikinci fıkra","kavramlar":[{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkonması.","ad":"Geçici olarak mesleki faaliyetten alıkoyma cezası"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesi.","ad":"Meslekten çıkarma cezası"},{"kaynak":"SMMM K. 48. madde","tanim":"Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlar ile görevlerini yapmayan veya kusurlu olarak yapan meslek mensuplarına, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi amacıyla uygulanacak yaptırımlar.","ad":"Disiplin cezası"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[{"yil":"2018/3","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, disiplin cezalarına ilişkin aşağıdakilerden hangisi yanlıştır?"},{"yil":"2018/1","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, serbest muhasebeci mali müşavirlere uygulanabilecek disiplin cezaları ile ilgili aşağıdakilerden hangisi yanlıştır?"},{"yil":"2017/2","alinti":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliğine göre, yukarıdaki disiplin cezalarından hangileri Resmî Gazete’de ilan edilmez?"}],"donemler":["2025/1","2024/2","2021/1","2020/1","2018/3","2018/1","2017/3","2017/2","2017/1","2016/2","2015/2"]},"oyun":null,"tip":"teori","soru":"Bir meslek mensubu, beş yıllık bir dönem içinde iki defa geçici olarak mesleki faaliyetten alıkoyma cezası ile cezalandırılmış, bu cezaları gerektiren fiili yeniden işlemiştir. 3568 sayılı Kanun\u0027a göre bu meslek mensubu hakkında hangi disiplin cezası uygulanır?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-01","verilenler":[{"deger":"beş yıllık bir dönem","anlam":"Kanunun özel ağırlaştırma eşiği için aradığı zaman aralığı; bu süre içindeki tekrar önem taşır.","ad":"Ceza tekrar süresi"},{"deger":"iki defa geçici alıkoyma cezası","anlam":"Kanunun meslekten çıkarma sonucunu bağladığı eşik sayısı; üçüncü fiil bu eşiği tamamlar.","ad":"Alınan ceza sayısı"}],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.48/2 (beş yıllık dönemde iki defa mesleki faaliyetten alıkoyma cezası alan meslek mensubunun fiili yeniden işlemesi halinde meslekten çıkarma cezası uygulanır)","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Serbest muhasebeci mali müşavir Kemal Bey, 2016 yılında görevini bağımsızlık ilkesine aykırı yaptığı için 8 ay geçici olarak mesleki faaliyetten alıkoyma cezası almış. 2019 yılında aynı fiili tekrar işlemiş ve yine geçici alıkoyma cezası almış. 2021 yılında Kemal Bey üçüncü kez aynı fiili işliyor: yine tarafsızlığını bozarak görevini kusurlu yapıyor.","anlatim":"Kemal Bey beş yıl içinde iki kez alıkoyma cezası yemiş, sonra üçüncü kez aynı fiili tekrarlamış. Disiplin kurulu şimdi ne karar vermeli, onu çözeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Kanun m.48/2 diyor ki, beş yıllık dönemde iki defa alıkoyma cezası alan kişi bu fiili yeniden işlerse sonuç meslekten çıkarmadır. Kemal Bey tam bu kalıba giriyor: iki alıkoyma cezası var, üçüncü kez aynı fiil var. Şimdi beş şıkkı bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"m.48/2","karar":"yanlış","anlatim":"Kanun burada üçüncü tekrarda aynı cezayı sürdürmüyor. Beş yıl içinde iki alıkoyma sonrası fiil tekrarında sonuç doğrudan meslekten çıkarmadır. Kurul üçüncü kez alıkoyma cezası veremez.","formul":"Şık A: Disiplin kurulu \u0027üçüncü kez de alıkoyma cezası verelim\u0027 diyor, doğru mu yapıyor?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"m.48/2","karar":"yanlış","anlatim":"Takdir yetkisi bir derece ağır veya hafif ceza için var ama burada kanun sonucu kesin şekilde bağlamış. Kemal Bey\u0027in durumunda kınamaya inmek mümkün değil.","formul":"Şık B: Kurul \u0027takdir hakkımız var, kınama cezası da verebiliriz\u0027 diyor, haklı mı?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"m.48/1","karar":"yanlış","anlatim":"Yeminli sıfatının kaldırılması sadece tasdik yetkisinin gerçeğe aykırı kullanımının tekrarında uygulanır. Kemal Bey\u0027in olayı tasdik yetkisiyle ilgili değil, bu ceza burada söz konusu olamaz.","formul":"Şık C: Kurul \u0027yeminli sıfatını kaldırıp üstüne meslekten çıkarmayı da birlikte uygulayalım\u0027 diyor, doğru mu?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"m.48/1","karar":"yanlış","anlatim":"İlk defa uyarma kuralı mesleğin vakar ve onuruna aykırı genel fiiller içindir. Kemal Bey zaten iki kez cezalandırılmış, bu ilk fiil değil.","formul":"Şık D: Kurul \u0027bu üçüncü fiil ama ilk defa gibi sayalım, uyarma verelim\u0027 diyor, uyar mısın?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"m.48/2","karar":"doğru","anlatim":"Kanun tam bu durumu düzenlemiş: iki alıkoyma cezası sonrası fiilin tekrarı meslekten çıkarma sebebidir. Kemal Bey\u0027in olayı bu kalıba birebir uyuyor, kurul doğru karar veriyor.","formul":"Şık E: Kurul \u0027beş yıl içinde iki alıkoyma cezası var, üçüncü kez fiil tekrarlandı, meslekten çıkaralım\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Beş yıl içinde iki alıkoyma cezası sonrası aynı fiilin tekrarı kanunda özel olarak meslekten çıkarmaya bağlanmış, genel takdir kuralları burada geçersiz. Kendine sor: bu olay kanunun özel düzenlediği \u0027iki alıkoyma + tekrar\u0027 kalıbına mı giriyor, yoksa genel disiplin kademelemesine mi tabi?","doldur":[]}],"anahtar":[{"ornek":"mesleki","kok":"meslek"},{"ornek":"alıkoyma","kok":"alıkoy"},{"ornek":"cezası","kok":"cezası"},{"ornek":"tekrarlamış","kok":"tekrar"},{"ornek":"çıkarma","kok":"çıkarm"},{"ornek":"içinde","kok":"içinde"}],"konuGiris":{"harita":"Ne zaman uygulanır: aynı cezayı gerektiren fiil belirli bir süre içinde tekrarlandığında. Nasıl belirlenir: kanunda sayılan disiplin cezaları arasından fiilin ağırlığına ve tekrar sayısına göre seçilir. Nasıl kesinleşir: savunma alındıktan ve karar kesinleştikten sonra uygulanır.","desen":"Sınav genelde beş yıl içinde iki kez alıkoyma cezası alıp fiili tekrarlayan meslek mensubuna hangi cezanın verileceğini sorar; tuzak, öğrencinin bunu kınama veya yeniden alıkoyma sanmasıdır. Doğru cevap doğrudan meslekten çıkarmadır, ara ceza yoktur. Bu soru m.48 son fıkralar noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Altı aydan az bir yıldan çok olmamak üzere mesleki faaliyeti durdurma cezası","ad":"Geçici alıkoyma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ruhsatın geri alınıp mesleğin bir daha icra edilememesi","ad":"Meslekten çıkarma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Aynı cezanın tekrarının değerlendirildiği beş yıllık zaman aralığı","ad":"Tekerrür süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tekrarlanan fiilde bir önceki cezadan daha ağırının uygulanabilmesi","ad":"Ağırlaştırma kuralı","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Meslek mensubunun geçmiş ceza sayısı ve süresi verilir, uygulanacak disiplin cezası istenir.","panel_ornek":"Bir öğrenci okulda üç ay içinde iki kez sınavda kopya çekmekten uyarı almış, üçüncü kez aynı şeyi yapınca okuldan uzaklaştırılmış. Küçük kurallar tekrar edilince ceza büyür, en ağırına çıkar. Burada sayı üç ve iki, olayın sayılarıyla ilgisi yoktur.","ornek":"Bir öğrenci okulda üç ay içinde iki kez sınavda kopya çekmekten uyarı almış, üçüncü kez aynı şeyi yapınca okuldan uzaklaştırılmış. Küçük kurallar tekrar edilince ceza büyür, en ağırına çıkar. Burada sayı üç ve iki, olayın sayılarıyla ilgisi yoktur.","yontemler":"Süre ve tekrar sayısını kanundaki eşiklerle karşılaştır; beş yılda iki alıkoyma cezası sonrası üçüncü tekrar doğrudan meslekten çıkarmayı gerektirir.","nedir":"Disiplin cezaları, meslek mensuplarının kurallara aykırı davranışlarına karşı uygulanan kanuni yaptırımlardır. Sınav, hangi fiile hangi cezanın verileceğini ve tekrar halinde cezanın nasıl ağırlaştığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Karma Ceza Tuzağı","metin":"Yeminli sıfatının kaldırılmasını her ağır disiplin olayına otomatik eklenen bir ek ceza sanırsın. Doğrusu: Yeminli sıfatının kaldırılması yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrürüne özgüdür, bu olayla ilgisi yoktur."},"A":{"ad":"Üçüncü Kez Uygulama Tuzağı","metin":"Aynı cezanın tekrarlanacağını düşünürsün. Doğrusu: Kanun, beş yıl içinde iki alıkoyma cezası sonrası fiilin tekrarında üçüncü kez alıkoyma değil, doğrudan meslekten çıkarma cezası öngörür."},"D":{"ad":"İlk Fiil Varsayımı Tuzağı","metin":"Her olayı ilk defa işlenen fiil kabul edip mutlaka uyarmayla başlanacağını düşünürsün. Doğrusu: Ne soruluyor: Beş yıl içinde iki kez alıkoyma cezası alan meslek mensubunun fiili yeniden işlemesinin sonucu sorulmaktadır. Kural: 3568 sayılı Kanun m.48/2 uyarınca beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası alan meslek mensubunun bu cezayı gerektiren fiili yeniden işlemesi halinde meslekten çıkarma cezası uygulanır. Doğrusu: Meslek mensubu hakkında meslekten çıkarma cezası verilir."},"B":{"ad":"Genel Takdir Yetkisi Tuzağı","metin":"Disiplin kurulunun bir derece hafif ceza takdir edebileceği genel yetkiyi burada da uygulanabilir sanırsın. Doğrusu: Beş yıl içinde iki alıkoyma cezası sonrası tekrarda kanun sonucu kesin olarak belirlemiştir, takdir alanı yoktur."}},"celdiriciYol":null,"hap":"Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası alan meslek mensubu bu fiili yeniden işlerse, kanun gereği doğrudan meslekten çıkarma cezası uygulanır.","teshis":{"C":{"gercek":"Yeminli sıfatının kaldırılması yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrürüne özgüdür, burada söz konusu değildir.","ayirt":"Olay tasdik yetkisinin kötüye kullanılmasıyla mı ilgili, yoksa alıkoyma cezasının tekrarıyla mı?","paragraf":"m.48/1","yanilgi":"Yeminli sıfatının kaldırılmasını her ağır disiplin olayına eklenen otomatik bir ek ceza sanıyorsun."},"E":{"gercek":"Kanun, beş yıllık dönemde iki alıkoyma cezası sonrası aynı fiilin yeniden işlenmesini açıkça meslekten çıkarma sebebi olarak düzenlemiştir.","ayirt":"Olay, kanunun özel olarak düzenlediği \u0027iki alıkoyma + tekrar\u0027 kalıbına mı uyuyor?","paragraf":"m.48/2","yanilgi":"Beş yıl içindeki tekrarın kanunda özel ve kesin bir sonucu olduğunu fark etmeyip genel ağırlaştırma ya da takdir kurallarına yöneliyorsun."},"A":{"gercek":"Kanun, beş yıl içinde iki alıkoyma cezası sonrası fiilin tekrarında otomatik olarak meslekten çıkarma öngörür; üçüncü kez alıkoyma uygulanmaz.","ayirt":"Kanun üçüncü tekrarda hâlâ aynı cezayı mı öngörüyor, yoksa ağırlaştırma mı getiriyor?","paragraf":"m.48/2","yanilgi":"Aynı cezanın tekrarlanacağını, üçüncü kez de alıkoyma cezası verileceğini düşünüyorsun."},"D":{"gercek":"İlk defasında uyarma kuralı mesleğin vakar ve onuruna aykırı genel fiiller içindir; burada geçmişte iki kez cezalandırılmış bir meslek mensubu söz konusudur.","ayirt":"Meslek mensubu bu fiili ilk kez mi işliyor, yoksa geçmişte cezalandırılmış mı?","paragraf":"m.48/1","yanilgi":"Her disiplin olayını ilk fiil kabul edip mutlaka uyarmayla başlanacağını düşünüyorsun."},"B":{"gercek":"Takdir yetkisi kanunda açıkça öngörülmeyen durumlar içindir; beş yıl içinde iki alıkoyma cezası sonrası tekrar halinde sonuç kanunla kesin olarak meslekten çıkarmadır.","ayirt":"Kanun bu duruma özel kesin bir sonuç mu bağlamış, yoksa genel takdir mi geçerli?","paragraf":"m.48/2","yanilgi":"Disiplin kurulunun bir derece hafif ceza takdir edebileceği genel yetkinin burada da uygulanabileceğini sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":11,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"3568 sayılı Kanunun 48 inci maddesine göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında önce fiilin ağırlığını ve kasıt unsurunu belirle, sonra Kanun m.48\u0027deki özel hükme bak.","konu":"disiplin cezalari","tablo":{"satirlar":[["A) Uyarma","m.48(a)","YANLIŞ ifade"],["B) Kınama","m.48(b)","YANLIŞ ifade"],["C) Geçici olarak mesleki faaliyetten alıkoyma","m.48(c)","YANLIŞ ifade"],["D) Yeminli sıfatını kaldırma","m.48(d)","YANLIŞ ifade"],["E) Meslekten çıkarma","m.48(e)","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Geçici olarak mesleki faaliyetten alıkoyma","E":"Meslekten çıkarma","A":"Uyarma","D":"Yeminli sıfatını kaldırma","B":"Kınama"},"kaynak":{"alinti":"de açıkça yer alan ve kaynak metinde tam olarak desteklenen","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"Soru, 3568 sayılı Kanunun m.48\u0027de açıkça yer alan ve kaynak metinde tam olarak desteklenen \u0027mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir\u0027 hükmünü ölçmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Geçici alıkoyma cezası tasdik yetkisinin gerçeğe aykırı kullanılmasında verilir. Kasten vergi ziyaına sebebiyet vermek bambaşka ve daha ağır bir hukuk ihlalidir.","E":"Mükellefle birlikte kasten vergi ziyaına sebebiyet veren meslek mensubuna mahkeme kararı kesinleştiğinde meslekten çıkarma cezası uygulanır; bu mesleği yapma hakkı tamamen kaldırılır.","A":"Uyarma sadece mesleki kurallara hafif aykırılıklarda ilk defasında verilir. Kasten vergi ziyaına sebebiyet vermek ise çok daha ağır bir fiildir ve bu cezanın uygulanmasını gerektirmez.","D":"Yeminli sıfatını kaldırma cezası, yeminli mali müşavirlerin tasdik yetkisini tekrar gerçeğe aykırı kullanmasına özgüdür. Kasten vergi ziyaı olayına bu ceza uygulanmaz.","B":"Kınama, uyarma cezasını gerektiren hafif davranışın tekrarında uygulanır. Mahkeme kararıyla kesinleşen kasten vergi ziyaı gibi ağır suçlarda bu ceza türü kullanılmaz."},"dogru":"Mükellefle birlikte kasten vergi ziyaına sebebiyet veren meslek mensubunun mahkeme kararı kesinleşmişse, en ağır ceza olan meslekten çıkarma uygulanır. Bu durumda hafif cezalar değil, mesleği yapma hakkının tamamen kaldırılması söz konusudur.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 48. madde","kavramlar":[{"kaynak":"SMMM K. 48. madde","tanim":"Mükellefle birlikte bilinçli olarak vergi ziyaına neden olmak; mahkeme kararı kesinleştiğinde en ağır disiplin cezasını gerektiren hukuk ihlalidir.","ad":"Kasten vergi ziyaına sebebiyet vermek"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir; en ağır disiplin cezasıdır.","ad":"Meslekten çıkarma"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensuplarının mesleğe ilişkin kurallara aykırı davranışları nedeniyle uygulanacak yaptırımlardır; uyarma, kınama, geçici alıkoyma, yeminli sıfatını kaldırma ve meslekten çıkarma olmak üzere beş türü vardır.","ad":"Disiplin cezası"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[{"yil":"2018/3","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, disiplin cezalarına ilişkin aşağıdakilerden hangisi yanlıştır?"},{"yil":"2018/1","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, serbest muhasebeci mali müşavirlere uygulanabilecek disiplin cezaları ile ilgili aşağıdakilerden hangisi yanlıştır?"},{"yil":"2017/2","alinti":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliğine göre, yukarıdaki disiplin cezalarından hangileri Resmî Gazete’de ilan edilmez?"}],"donemler":["2025/1","2024/2","2021/1","2020/1","2018/3","2018/1","2017/3","2017/2","2017/1","2016/2","2015/2"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavirin, mükellefle birlikte kasten vergi ziyaına sebebiyet verdiğine dair mahkeme kararı kesinleşmiştir. 3568 sayılı Kanun\u0027a göre bu meslek mensubuna hangi disiplin cezası uygulanır?","kayitBaslik":"","id":"sgs-p-meslek-kolay-r4-a/kp-01","verilenler":[],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.48","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir SMMM, mükellefiyle anlaşıp 2021 yılına ait 340.000 TL vergiyi ziya uğratmış, bu durum mahkeme kararıyla kesinleşmiş.","anlatim":"Meslek mensubu \u0027yardım ettim\u0027 diye savunma yapmış ama karar kesinleşmiş. Şimdi bu meslek mensubuna hangi disiplin cezası verilecek, onu bulacağız.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun m.48\u0027e göre bu fiil hangi cezaya karşılık geliyor, beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kanun cezaları fiilin ağırlığına göre sıralamış, en hafiften en ağıra. Şimdi A\u0027dan E\u0027ye kadar her ifadeyi bu olaya uygulayıp doğru mu yanlış mı diyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.48(a)","karar":"yanlış","anlatim":"Uyarma sadece dikkatsizlik gerektiren hafif hâllerde verilir, burada kasıt ve mahkeme kararı var. Bu yüzden uyarma bu olaya uymaz.","formul":"Şık A: birisi sana \u0027bu meslek mensubuna sadece uyarı yazısı yazalım, daha dikkatli olsun desin\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.48(b)","karar":"yanlış","anlatim":"Kınama da görece hafif bir kusur bildirimi, kasten vergi ziyaına sebep olmayı karşılamaz. Olayın ağırlığı bu cezayı da geçersiz kılar.","formul":"Şık B: müdür \u0027kınama cezası yeter, yazıyla kusurlu olduğunu bildirelim\u0027 diyor, sen ne dersin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.48(c)","karar":"yanlış","anlatim":"Geçici alıkoyma mesleki sıfatı korurken belirli süre çalıştırmamaktır ama kanun bu fiil için ayrı bir hüküm koymuş. Bu ceza olayın ağırlığını karşılamıyor.","formul":"Şık C: birisi \u0027altı ay mesleki faaliyetten alıkoyalım, sıfatı kalsın\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.48(d)","karar":"yanlış","anlatim":"Yeminli sıfatının kaldırılması ayrı bir ceza türü ve farklı hâllere özgü, burada kanun doğrudan meslekten çıkarmayı öngörüyor. Olayda mükellefle birlikte kasıt var, bu D\u0027yi karşılamıyor.","formul":"Şık D: birisi \u0027bu bir YMM, o zaman yeminli sıfatını kaldıralım\u0027 diyor, uyar mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.48(e)","karar":"doğru","anlatim":"Kanun m.48, mükellefle birlikte kasten vergi ziyaına sebebiyet verip durumu mahkeme kararıyla kesinleşen meslek mensubuna tam bu cezayı öngörür. Olay bu hükme birebir uyuyor.","formul":"Şık E: sana \u0027ruhsatnamesi geri alınsın, bir daha bu mesleği yapamasın\u0027 deseler, bu doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Kasten vergi ziyaı ve mahkeme kararının kesinleşmesi bir araya gelince tek ceza meslekten çıkarmadır. Kendine sor: bu fiil hafif bir dikkatsizlik mi, yoksa kasıtlı ve kesinleşmiş ağır bir eylem mi?","doldur":[]}],"anahtar":[{"ornek":"meslek","kok":"meslek"},{"ornek":"kesinleşen","kok":"kesinl"},{"ornek":"mahkeme","kok":"mahkem"},{"ornek":"kararıyla","kok":"kararı"},{"ornek":"kasten","kok":"kasten"},{"ornek":"mükellefle","kok":"mükell"}],"konuGiris":{"harita":"Hangi fiil işlendiğinde hangi ceza uygulanır: madde metninde fiil-ceza eşleşmesi aranır. Ceza nasıl kesinleşir: mahkeme kararının kesinleşmesiyle uygulama başlar. Ceza nasıl kayıt altına alınır: disiplin kurulu kararı ile meslek mensubuna bildirilerek uygulanır.","desen":"Soru genelde \u0027mükellefle birlikte kasten vergi ziyaına sebep olma + mahkeme kararının kesinleşmesi\u0027 kombinasyonunu verip doğrudan meslekten çıkarma cezasını sordurur. Tuzak, bu fiili \u0027geçici alıkoyma\u0027 ile karıştırmaktır, oysa kanun bu fiil için doğrudan en ağır cezayı öngörür. Bu soru m.48 [2/2] fıkrasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Daha dikkatli davranılması gerektiğinin yazıyla bildirilmesi","ad":"Uyarma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Görev ve davranışta kusurlu sayıldığının yazıyla bildirilmesi","ad":"Kınama","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetin durdurulması","ad":"Geçici alıkoyma","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Ruhsatname geri alınarak mesleğin bir daha icra edilememesi","ad":"Meslekten çıkarma","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Mahkeme kararıyla kesinleşen bir fiil verilir ve bu fiile karşılık gelen disiplin cezası istenir.","panel_ornek":"Bir markette çalışan arkadaşın kasadan 30 lira eksik saydığında önce sözlü uyarı alır, tekrar ederse yazılı ihtar gelir; iş sözleşmesine göre ağırlaştıkça ceza da ağırlaşır. İşte meslek mensuplarında da fiilin ağırlığına göre ceza kademe kademe artar.","ornek":"Bir markette çalışan arkadaşın kasadan 30 lira eksik saydığında önce sözlü uyarı alır, tekrar ederse yazılı ihtar gelir; iş sözleşmesine göre ağırlaştıkça ceza da ağırlaşır. İşte meslek mensuplarında da fiilin ağırlığına göre ceza kademe kademe artar.","yontemler":"Fiilin türünü (kusur mu, kasıt mı, tekrar mı) belirleyip kanundaki ceza kademesiyle eşleştirmek yeterlidir; hesaplama yoktur.","nedir":"Bu konu, SMM mali müşavirlerin mesleki kusur ve suçlarına karşı uygulanan disiplin cezalarını anlatır. Sınav, hangi fiile hangi cezanın (uyarma-kınama-alıkoyma-meslekten çıkarma) verildiğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Geçici Alıkoyma Tuzağı","metin":"Tasdik yetkisinin gerçeğe aykırı kullanılmasında ilk tespitte bu ceza verildiği için, her mahkeme kararlı olayda da aynı cezanın uygulanacağını sanırsın. Doğrusu: Bu ceza tasdik yetkisinin gerçeğe aykırı kullanımına ilişkindir; kasten vergi ziyaına sebebiyet ayrı ve daha ağır bir hükme bağlıdır."},"A":{"ad":"Uyarma Tuzağı","metin":"Kanunda ilk sırada sayılan en hafif ceza olduğu için her ihlalde önce bunun uygulanacağını sanırsın. Doğrusu: Uyarma yalnız mesleki kurallara aykırı hafif davranışlarda, ilk defasında uygulanır; kasten vergi ziyaına sebebiyet bu kapsamda değildir."},"D":{"ad":"Yeminli Sıfatını Kaldırma Tuzağı","metin":"Tasdikte tekerrür halinde bu cezanın geldiğini bilip, olayı yeminli mali müşavir tekerrürü zannedersin. Doğrusu: Bu ceza yalnız yeminli mali müşavirlerin tasdik yetkisini tekrar gerçeğe aykırı kullanmasına özgüdür, kasten vergi ziyaı olayına uygulanmaz."},"B":{"ad":"Kınama Tuzağı","metin":"Uyarmanın tekrarında kınama geldiği kuralını, kasıtla işlenen ağır fiillere de uygulanır sanırsın. Doğrusu: Kınama yalnız uyarma cezasını gerektiren fiilin tekrarında uygulanır, mahkeme kararıyla kesinleşen kasıtlı vergi ziyaında değil."}},"celdiriciYol":{},"hap":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası verilir.","teshis":{"C":{"gercek":"Geçici alıkoyma tasdik yetkisinin ilk kez gerçeğe aykırı kullanılmasına ilişkindir; kasten vergi ziyaı ayrı fıkrada düzenlenmiştir.","ayirt":"Olay tasdik yetkisinin kötüye kullanılması mı, yoksa mükellefle birlikte kasıtlı vergi ziyaı mı?","paragraf":"3568 s. Kanun m.48","yanilgi":"Geçici alıkoymanın tasdik yetkisi ihlallerine özgü olduğunu görmeyip her mahkeme kararlı olayı bununla eşleştiriyorsun."},"E":{"gercek":"3568 sayılı Kanunun 48 inci maddesi, mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu durumu mahkeme kararıyla kesinleşen meslek mensuplarına açıkça meslekten çıkarma cezası öngörür.","ayirt":"Kanun bu fiil için ayrı ve kesin bir ceza öngörmüş mü?","paragraf":"3568 s. Kanun m.48","yanilgi":"Bu kadar ağır bir fiile de daha hafif bir ceza uygulanabileceğini, kanunun kesin hüküm koymadığını sanan öğrenci bu şıkkı eler."},"A":{"gercek":"Kanun m.48, fiilin niteliğine göre farklı ceza türleri öngörür; kasıtlı vergi ziyaı doğrudan meslekten çıkarmaya bağlanmıştır.","ayirt":"Fiil hafif kural ihlali mi, yoksa kasıtlı ve mahkemece kesinleşmiş ağır bir fiil mi?","paragraf":"3568 s. Kanun m.48","yanilgi":"Uyarmanın en hafif ve ilk uygulanan ceza olduğunu, ağırlığına bakılmaksızın her olayda önce bunun verileceğini sanıyorsun."},"D":{"gercek":"Bu ceza yalnız yeminli mali müşavirlerin tasdik yetkisini tekrar gerçeğe aykırı kullanmasına özgüdür.","ayirt":"Olayda tasdik yetkisinin tekrar kötüye kullanılması mı var, yoksa kasten vergi ziyaı mı var?","paragraf":"3568 s. Kanun m.48","yanilgi":"Yeminli sıfatının kaldırılmasının her ağır kasıtlı fiilde uygulanacağını, meslek mensubunun sıfatına bakmaksızın genel bir ceza olduğunu sanıyorsun."},"B":{"gercek":"Kınama yalnız uyarma cezasını gerektiren fiilin tekrarında uygulanır; kasten vergi ziyaı ayrı ve ağır bir hükme tabidir.","ayirt":"Bu olay bir tekrar mı, yoksa tek başına ağır ve kasıtlı bir fiil mi?","paragraf":"3568 s. Kanun m.48","yanilgi":"Kınamanın uyarmanın tekrarına özgü olduğunu unutup her ikinci ihlalde kınama verileceğini sanıyorsun."}},"verilen":[],"donem":11,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"mükellefle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında önce fiilin \u0027kasten\u0027 ve \u0027mahkeme kararıyla kesinleşme\u0027 şartlarını taşıyıp taşımadığına bak; taşıyorsa doğrudan en ağır cezaya gidilir.","konu":"disiplin cezalari","tablo":{"satirlar":[["A) Geçici olarak mesleki faaliyetten alıkoyma","m.48/2","YANLIŞ ifade"],["B) Kınama","m.48/2","YANLIŞ ifade"],["C) Uyarma","m.48/1-2","YANLIŞ ifade"],["D) Yeminli sıfatını kaldırma","m.48/1","YANLIŞ ifade"],["E) Meslekten çıkarma","m.48/2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Uyarma","E":"Meslekten çıkarma","A":"Geçici olarak mesleki faaliyetten alıkoyma","D":"Yeminli sıfatını kaldırma","B":"Kınama"},"kaynak":{"alinti":"de açıkça düzenlenen","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"Soru, 3568 sayılı SMMM K. m.48\u0027de açıkça düzenlenen \u0027mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir\u0027 kuralını doğru şekilde ölçmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Uyarma cezası, mesleğin vakar ve onuruna aykırı hafif ilk davranışlarda verilir; vergi ziyaı bundan çok daha ağır bir fiil olup uyarma ile geçiştirilmez.","A":"Geçici alıkoyma cezası, bağımsızlık ve dürüstlükle görev yapmama halinde kullanılır; kasten vergi ziyaı bundan çok daha ağır bir fiil olup doğrudan meslekten çıkarmayı gerektirir.","D":"Yeminli sıfatı kaldırma cezası, yeminli mali müşavirin tasdik yetkisini gerçeğe aykırı kullanmasının tekerrüründe uygulanır; vergi ziyaı fiili bu cezaya tabi değil, meslekten çıkarma gerektirir.","B":"Kınama cezası, mesleki kurallara aykırı davranışın tekrarında uygulanır; kasten vergi ziyaı gibi ağır fiiller ilk defasında dahi meslekten çıkarma sonucunu doğurur."},"dogru":"Mükellefiyle birlikte kasten vergi ziyaına sebebiyet verip mahkemede hüküm giymiş bir meslek mensubuna kural olarak meslekten çıkarma cezası verilir. Bu, en ağır disiplin cezasıdır. Vergi ziyaı gibi ağır fiiller ilk defasında dahi doğrudan meslekten çıkarmayı gerektirir.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 48. maddeye göre mükellefle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası uygulanır.","kavramlar":[{"kaynak":"SMMM K. 48. madde","tanim":"Mükellefiyle birlikte, bilerek ve isteyerek vergi ödemekten kaçınma fiilidir. Mahkeme kararıyla kesinleştiğinde disiplin cezası olarak meslekten çıkarma uygulanır.","ad":"Kasten vergi ziyaı"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun ruhsatnamesinin geri alınarak bir daha mesleği yürütmesine izin verilmemesidir. En ağır disiplin cezasıdır.","ad":"Meslekten çıkarma cezası"},{"kaynak":"SMMM K. 48. madde","tanim":"Verilen karar hakkında başvuru yapma hakkının sona ermesi ve kararın değiştirilme ihtimalinin ortadan kalkmasıdır. Bu durum kasten vergi ziyaı fiilinde meslekten çıkarma cezasını tetikler.","ad":"Mahkeme kararıyla kesinleşme"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[{"yil":"2018/3","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, disiplin cezalarına ilişkin aşağıdakilerden hangisi yanlıştır?"},{"yil":"2018/1","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, serbest muhasebeci mali müşavirlere uygulanabilecek disiplin cezaları ile ilgili aşağıdakilerden hangisi yanlıştır?"},{"yil":"2017/2","alinti":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliğine göre, yukarıdaki disiplin cezalarından hangileri Resmî Gazete’de ilan edilmez?"}],"donemler":["2025/1","2024/2","2021/1","2020/1","2018/3","2018/1","2017/3","2017/2","2017/1","2016/2","2015/2"]},"oyun":null,"tip":"teori","soru":"Mükellefiyle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşen bir meslek mensubuna, 3568 sayılı Kanun\u0027a göre kural olarak aşağıdaki disiplin cezalarından hangisi uygulanır?","kayitBaslik":"","id":"sgs-p-meslek-kolay-r3-a/kp-01","verilenler":[],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.48 fıkra 2","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Meslek mensubu Kerim Bey, 14 Mart 2021\u0027de mükellefinin talimatıyla 850.000 TL\u0027lik bir satışı kayıtlara hiç almıyor, KDV ve kurumlar vergisi eksik beyan ediliyor.","anlatim":"Vergi dairesi durumu fark ediyor, dava açılıyor. Mahkeme 2023 yılında bu fiilin kasten işlendiğine karar veriyor ve karar kesinleşiyor.","doldur":[]},{"formul":"Ne yapacağız: Kerim Bey\u0027in fiili kasten vergi ziyaına sebep olma, karar da kesinleşmiş durumda; şimdi beş cezayı tek tek bu olaya uygulayıp hangisinin gerçekten devreye girdiğine bakacağız.","anlatim":"3568 sayılı Kanun her fiile aynı cezayı vermez, her cezanın kendi şartı var. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.48/2","karar":"yanlış","anlatim":"Alıkoyma cezası bağımsızlık, tarafsızlık ihlali ya da tasdik yetkisinin ilk yanlış kullanımı için var. Kerim Bey\u0027in fiili bunlardan değil, kanun bu fiile ayrı ve daha ağır bir ceza bağlamış.","formul":"Şık A: Oda başkanı \u0027Kerim Bey\u0027e altı ay mesleki faaliyetten alıkoyma cezası verelim\u0027 diyor, doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.48/2","karar":"yanlış","anlatim":"Kınama, mesleki kurallara aykırı davranışın tekrarında devreye giren bir ceza. Kasten vergi ziyaı bu kademeli sisteme girmiyor, kanun onu doğrudan ayrı hükümle çıkarma cezasına bağlamış.","formul":"Şık B: Disiplin kurulu üyesi \u0027ilk seferinde kınama yeter\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.48/1-2","karar":"yanlış","anlatim":"İlk defasında uyarma kuralı mesleğin vakar ve onuruna aykırı genel davranışlar içindir, burada mahkeme kararıyla kesinleşmiş kasten bir fiil var. Kanun bu fiile \u0027ilk defasında\u0027 istisnası tanımamış.","formul":"Şık C: Genç bir müfettiş \u0027ilk defa işlediği için sadece uyarma cezası verilsin\u0027 diyor, haklı mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.48/1","karar":"yanlış","anlatim":"Yeminli sıfatının kaldırılması sadece tasdik yetkisinin tekerrür eden yanlış kullanımına özgü bir ceza. Kasten vergi ziyaıyla bu cezanın hiçbir bağlantısı yok.","formul":"Şık D: Birlik yetkilisi \u0027Kerim Bey yeminli mali müşavirse yeminli sıfatı kaldırılsın\u0027 diyor, bu doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.48/2","karar":"doğru","anlatim":"Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verip bunun mahkeme kararıyla kesinleşmesi durumunu doğrudan meslekten çıkarmaya bağlar. Kerim Bey\u0027in olayında hem kasıt hem kesinleşmiş mahkeme kararı var.","formul":"Şık E: Disiplin kurulu \u0027ruhsatnamesi geri alınsın, bir daha mesleği yapamasın\u0027 diye karar veriyor, doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Kasten vergi ziyaı mahkeme kararıyla kesinleştiğinde kademeli cezalar devre dışı kalır, direkt meslekten çıkarma gelir. Kendine sor: bu fiil kanunda ayrı ve özel bir hükme mi bağlanmış, yoksa genel kademeli cezalara mı tabi?","doldur":[]}],"anahtar":[{"ornek":"kasten","kok":"kasten"},{"ornek":"kesinleşen","kok":"kesinl"},{"ornek":"meslek","kok":"meslek"},{"ornek":"mahkeme","kok":"mahkem"},{"ornek":"kararıyla","kok":"kararı"},{"ornek":"çıkarma","kok":"çıkarm"}],"konuGiris":{"harita":"Ne zaman uygulanır: fiil, mahkeme kararıyla kesinleştiğinde uygulanır. Nasıl belirlenir: fiilin türüne göre kanunda hangi cezanın öngörüldüğüne bakılarak belirlenir. Nasıl kaydedilir: ceza, meslek mensubuna kesinleşme bildirildikten sonra uygulamaya konur.","desen":"Soru, kanunun \u0027kasten vergi ziyaı + mahkeme kararıyla kesinleşme\u0027 şartını uyarma/kınama gibi hafif cezalarla karıştırmayı hedefler. Öğrenci genellikle \u0027ilk defasında uyarma\u0027 kuralını her fiile uygulama tuzağına düşer, oysa bu özel fiil doğrudan ağır cezaya bağlanmıştır. Bu soru m.48 [2/2] fıkrasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Ruhsatnamenin geri alınıp mesleğin bir daha icra edilememesi.","ad":"Meslekten çıkarma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Sıfat saklı kalmak şartıyla altı ay-bir yıl arası faaliyetten men.","ad":"Geçici alıkoyma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mükellefle birlikte kasıtlı olarak vergi kaybına yol açma fiili.","ad":"Kasten vergi ziyaı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Bir derece ağır veya hafif ceza uygulama yetkisi.","ad":"Disiplin kurulu takdiri","kim":"meslek kuruluşu düzenler"}],"sinavda":"Fiil ve mahkeme kararının kesinleşmesi verilir, kural olarak uygulanacak ceza istenir.","panel_ornek":"Bir spor kulübünde üye, kulüp kurallarını bilerek üç kez ağır şekilde ihlal ederse yönetim kurulu artık uyarı vermez, doğrudan üyelikten çıkarma kararı alır. Çünkü kural, fiilin ağırlığına göre cezayı önceden sabitlemiştir; kurul burada takdir kullanmaz.","ornek":"Bir spor kulübünde üye, kulüp kurallarını bilerek üç kez ağır şekilde ihlal ederse yönetim kurulu artık uyarı vermez, doğrudan üyelikten çıkarma kararı alır. Çünkü kural, fiilin ağırlığına göre cezayı önceden sabitlemiştir; kurul burada takdir kullanmaz.","yontemler":"Fiilin türünü kanundaki özel hükümle eşleştir; genel kural (ilk uyarma-tekrar kınama) yerine özel düzenlenmiş ağır fiillere bak.","nedir":"Disiplin cezaları, meslek mensuplarının Kanuna aykırı davranışlarına karşı uygulanan yaptırımlardır. Sınav, hangi fiile hangi cezanın kural olarak bağlandığını bilip bilmediğini ölçer."},"olay":"fiil (kasten vergi ziyaı) + kesinleşmiş mahkeme kararı şartı birlikte gerçekleşmiştir.","tuzak":{"C":{"ad":"İlk Fiil Tuzağı","metin":"Uyarma cezasının mesleğin vakar ve onuruna aykırı ilk davranışta verildiğini bilip bunu her hafif görünen olaya uyguluyorsun. Doğrusu: vergi ziyaı ağır bir fiil olup ilk defasında dahi meslekten çıkarma sonucunu doğurur."},"A":{"ad":"Alıkoyma Tuzağı","metin":"Bağımsızlık, tarafsızlık ve dürüstlükle görev yapmama halinde uygulanan cezayı, kasten vergi ziyaına sebebiyet verme haliyle karıştırıyorsun. Doğrusu: mahkeme kararıyla kesinleşen kasten vergi ziyaı doğrudan meslekten çıkarmayı gerektirir."},"D":{"ad":"Yetki Karıştırma Tuzağı","metin":"Yeminli sıfatının kaldırılmasının, tasdik yetkisinin gerçeğe aykırı kullanımının tekerrüründe uygulandığını, vergi ziyaı fiiliyle aynı sayıyorsun. Doğrusu: bu ceza yalnız yeminli mali müşavirin tasdik yetkisi ihlaline özgüdür, vergi ziyaında meslekten çıkarma uygulanır."},"B":{"ad":"Tekerrür Tuzağı","metin":"Kınama cezasının, mesleki kurallara aykırı davranışın tekrarında uygulandığını, olaydaki ağır fiille karıştırıyorsun. Doğrusu: kasten vergi ziyaı, tekerrüre bakılmaksızın meslekten çıkarma cezasını gerektirir."}},"celdiriciYol":null,"hap":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası verilir.","teshis":{"C":{"gercek":"İlk defasında uyarma kuralı mesleğin vakar ve onuruna aykırı genel davranışlar içindir; kasten vergi ziyaı mahkeme kararıyla kesinleştiğinde ilk defasında dahi meslekten çıkarma uygulanır.","ayirt":"Kanun bu fiil için \u0027ilk defasında\u0027 ifadesini mi kullanmış, yoksa doğrudan ağır cezayı mı bağlamış?","paragraf":"3568 s.K. m.48/1-2","yanilgi":"İlk defa işlenen her fiile en hafif ceza olan uyarmanın verileceğini düşünüyorsun."},"E":{"gercek":"Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verilip bu husus mahkeme kararıyla kesinleştiğinde meslekten çıkarma cezasını açıkça öngörür.","ayirt":"Fiil kasten mi işlenmiş ve mahkeme kararıyla kesinleşmiş mi?","paragraf":"3568 s.K. m.48/2","yanilgi":"Meslekten çıkarmanın yalnızca ruhsat devri gibi durumlarda uygulanacağını, vergi ziyaının daha hafif kalacağını düşünüyorsun."},"A":{"gercek":"Alıkoyma cezası bağımsızlık/tarafsızlık/dürüstlük ihlali ile tasdik yetkisinin ilk kez gerçeğe aykırı kullanımına özgüdür; kasten vergi ziyaı ayrı ve daha ağır bir hükme bağlanmıştır.","ayirt":"Kanun bu fiil için özel ve ayrı bir ceza öngörmüş mü diye bakıyor muyum?","paragraf":"3568 s.K. m.48/2","yanilgi":"Ağır bir fiil gördüğünde otomatik olarak orta şiddetteki alıkoyma cezasına gidiyorsun."},"D":{"gercek":"Bu ceza yalnız yeminli mali müşavirin tasdik yetkisini gerçeğe aykırı kullanmasının tekerrürüne özgüdür; kasten vergi ziyaı fiiliyle ilgisi yoktur.","ayirt":"Bu ceza türü sadece belirli bir unvan ve belirli bir yetkiye mi bağlı?","paragraf":"3568 s.K. m.48/1","yanilgi":"Yeminli sıfatının kaldırılmasının her ağır fiilde uygulanan genel bir ceza olduğunu sanıyorsun."},"B":{"gercek":"Kınama, mesleki kurallara aykırı davranışın tekrarında uygulanır; kasten vergi ziyaı bu genel kademelendirmenin dışında, doğrudan meslekten çıkarmayı gerektiren özel bir hükümdür.","ayirt":"Bu fiil genel kademeli cezalara mı tabi, yoksa kanunda ayrıca mı düzenlenmiş?","paragraf":"3568 s.K. m.48/2","yanilgi":"Her disiplin olayının önce hafif cezayla başladığını, ancak tekrarında ağırlaştığını sanıyorsun."}},"verilen":[],"donem":11,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"3568 sayılı Kanunun 48 inci maddesine göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında önce fiilin \u0027genel vakar ihlali\u0027 mi yoksa \u0027kanunun ayrıca saydığı özel ağır fiil\u0027 mi olduğunu ayırt et.","konu":"disiplin cezalari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Fiil","Mükellefle birlikte kasten vergi ziyaına sebebiyet verme","-"],["Kesinleşme durumu","Mahkeme kararıyla kesinleşmiş","-"],["HESAP","-","-"],["A) Uyarma","p.48/1","YANLIŞ ifade"],["B) Kınama","p.48/1","YANLIŞ ifade"],["C) Geçici olarak mesleki faaliyetten alıkoyma","p.48/2","YANLIŞ ifade"],["D) Yeminli sıfatını kaldırma","p.48/1","YANLIŞ ifade"],["E) Meslekten çıkarma","p.48/2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Geçici olarak mesleki faaliyetten alıkoyma","E":"Meslekten çıkarma","A":"Uyarma","D":"Yeminli sıfatını kaldırma","B":"Kınama"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"3568 sayılı Kanun m.48\u0027de mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararıyla kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir hükmü açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Geçici mesleki faaliyetten alıkoyma, bağımsızlık ve tarafsızlık ihlalleri ile tasdik yetkisinin gerçeğe aykırı ilk kullanımına özgüdür. Kasten vergi ziyaına sebebiyet vermek için bu ceza değil, meslekten çıkarma uygulanır.","A":"Uyarma cezası hafif kusurlar için ilk defa uygulanır. Ancak kasten vergi ziyaına sebebiyet vermek gibi ağır fiiller için kanun doğrudan en ağır cezayı bağlamış, ilk aşama uygulamasını ortadan kaldırmıştır.","D":"Yeminli sıfatının kaldırılması yalnızca yeminli mali müşavirlerin tasdik yetkisini gerçeğe aykırı kullanmasının tekerrürüne özgü bir cezadır. Kasten vergi ziyaına sebebiyet veren tüm meslek mensuplarına meslekten çıkarma cezası verilir.","B":"Kınama cezası mesleğin vakar ve onuruna aykırı basit davranışların tekrarında kullanılır. Mükellefle kasten vergi ziyaına sebebiyet vermek bundan çok daha ağır bir fiil olup doğrudan meslekten çıkarma cezasını gerektirir."},"dogru":"Serbest muhasebeci mali müşavir, mükellefle birlikte kasten vergi ziyaına sebebiyet verip mahkeme bunu kesinleştirmişse meslekten çıkarılır. Bu, kanunun öngördüğü en ağır cezadır ve doğrudan uygulanır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 48. maddesine göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir.","kavramlar":[{"kaynak":"SMMM K. 48. madde","tanim":"Serbest muhasebeci mali müşavirin mükellefle birlikte bilerek ve isteyerek devletin vergi gelirini azaltıcı davranışta bulunmasıdır.","ad":"Kasten vergi ziyaına sebebiyet verme"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir.","ad":"Meslekten çıkarma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[{"yil":"2018/3","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, disiplin cezalarına ilişkin aşağıdakilerden hangisi yanlıştır?"},{"yil":"2018/1","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, serbest muhasebeci mali müşavirlere uygulanabilecek disiplin cezaları ile ilgili aşağıdakilerden hangisi yanlıştır?"},{"yil":"2017/2","alinti":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliğine göre, yukarıdaki disiplin cezalarından hangileri Resmî Gazete’de ilan edilmez?"}],"donemler":["2025/1","2024/2","2021/1","2020/1","2018/3","2018/1","2017/3","2017/2","2017/1","2016/2","2015/2"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavirin, mükellefiyle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşmiştir. 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre bu meslek mensubuna hangi disiplin cezası verilir?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-01","verilenler":[{"deger":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verme","anlam":"Hangi disiplin cezasının uygulanacağını belirleyen fiildir.","ad":"Fiil"},{"deger":"Mahkeme kararıyla kesinleşmiş","anlam":"Cezanın uygulanabilmesi için fiilin mahkeme kararıyla kesinleşmiş olması gerektiğini gösterir.","ad":"Kesinleşme durumu"}],"dayanak":"3568 sayılı SMMM K. m.48","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: bir başka ilde, bir SMMM ile mükellefi 2019 yılında birlikte hareket edip 340.000 TL vergi ziyaına kasten sebep olmuş, olay mahkemeye taşınmış ve 2022\u0027de karar kesinleşmiştir.","anlatim":"Mahkeme kararı kesinleşince artık tartışma bitmiştir. Disiplin kurulu bu meslek mensubuna hangi cezayı vereceğine bakar.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun madde 48\u0027de beş ceza var; uyarma, kınama, geçici alıkoyma, yeminli sıfatını kaldırma, meslekten çıkarma. Bu beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Her ceza farklı bir fiile bağlanmıştır, hepsi aynı kefeye konmaz. Şimdi olayımızdaki fiil hangi bende denk geliyor onu arayacağız.","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"p.48/1","karar":"yanlış","anlatim":"Uyarma yalnız mesleğin vakar ve onuruna aykırı davranışın ilk kez görülmesinde uygulanır. Bizim olayımızda ayrı ve özel bir hüküm var, mükellefle kasten vergi ziyaı. Bu yüzden uyarma burada uygulanmaz.","formul":"Şık A: disiplin kurulu \u0027ilk defa oluyor, sadece uyarma verelim\u0027 diyor, bu doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"p.48/1","karar":"yanlış","anlatim":"Kınama da aynı genel vakar/onur ihlali hükmünün tekrarına özgüdür. Olayımızdaki fiil kanunun ayrıca saydığı özel bir haldir, genel hükme girmez. Kınama burada yanlış olur.","formul":"Şık B: \u0027daha önce böyle bir olay yaşamıştı, tekrar ettiği için kınama verelim\u0027 diyor, katılır mısın?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"p.48/2","karar":"yanlış","anlatim":"Geçici alıkoyma bağımsızlık, tarafsızlık, dürüstlük ihlaline ya da tasdik yetkisinin ilk kez kötüye kullanımına bağlıdır. Bizim olayda mükellefle birlikte kasten vergi ziyaı var, bu ayrı bir bent. Geçici alıkoyma burada uygulanmaz.","formul":"Şık C: \u0027altı ay mesleki faaliyetten alıkoyalım, yeter\u0027 diyor, doğru mu bu karar?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"p.48/1","karar":"yanlış","anlatim":"Bu ceza yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrür edip mahkeme kararıyla kesinleşmesine özgüdür. Olayımızda tasdik yetkisi kötüye kullanımı yok, mükellefle kasten vergi ziyaı var. D burada da yanlış.","formul":"Şık D: \u0027yeminli mali müşavirse yeminli sıfatını kaldıralım\u0027 diyor, sen ne dersin?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.48/2","karar":"doğru","anlatim":"Kanun açıkça der: mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası verilir. Olayımız tam bu tanıma uyuyor. Bu yüzden E doğrudur.","formul":"Şık E: \u0027meslekten çıkarma cezası verelim\u0027 diyor, sence bu doğru mu?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.48/2","karar":"doğru","anlatim":"Bu ceza kademeli bir süreçten geçmez, kanun onu doğrudan ve özel olarak bağlamıştır. Kendine hep şunu sor: bu fiil genel vakar/onur ihlali mi, yoksa kanunun ayrıca saydığı özel bir fiil mi?","formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓"}],"anahtar":[{"ornek":"meslek","kok":"meslek"},{"ornek":"mükellefle","kok":"mükell"},{"ornek":"kesinleşen","kok":"kesinl"},{"ornek":"olayımızdaki","kok":"olayım"},{"ornek":"kasten","kok":"kasten"},{"ornek":"kararıyla","kok":"kararı"}],"konuGiris":{"harita":"Ne zaman verilir: fiilin ağırlığına göre beş dereceli cezalardan biri seçilerek uygulanır. Nasıl belirlenir: kanunda sayılan fiil tipleri ile ceza doğrudan eşleştirilir. Nasıl kesinleşir: savunma alınıp disiplin kurulu kararıyla, bildirimden sonra yürürlüğe girer.","desen":"Soru genelde mahkeme kararıyla kesinleşmiş vergi ziyaı fiilini verip doğrudan ceza türünü sordurur; tuzak, bu fiili geçici alıkoyma ya da kınama gibi hafif cezalarla karıştırmaktır. Çıkmışlarda öğrenciler tekerrür şartlarını (3 yıl, 5 yıl) bu maddeyle karıştırıp yanlış ceza seçebilir. Bu soru m.48 fıkra 2\u0027deki \u0027mükellefle birlikte kasten vergi ziyaı\u0027 ibaresinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Daha dikkatli davranılması gerektiğinin yazıyla bildirilmesi","ad":"Uyarma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"6 ay ila 1 yıl arası mesleki faaliyetten men edilme","ad":"Geçici alıkoyma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ruhsatın geri alınıp mesleğe tekrar izin verilmemesi","ad":"Meslekten çıkarma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mükellefle birlikte kasten vergi kaybına neden olma","ad":"Vergi ziyaı fiili","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Mahkeme kararıyla kesinleşmiş bir fiil verilip buna karşılık gelen disiplin cezası sorulur.","panel_ornek":"Bir spor kulübü üyesi, kulüp kurallarını ilk kez ihlal ederse sözlü uyarı alır; aynı hatayı 3 kez tekrarlarsa üyeliği tamamen iptal edilir. Küçük hata küçük ceza, büyük ve tekrar eden hata ise en ağır cezayı getirir.","ornek":"Bir spor kulübü üyesi, kulüp kurallarını ilk kez ihlal ederse sözlü uyarı alır; aynı hatayı 3 kez tekrarlarsa üyeliği tamamen iptal edilir. Küçük hata küçük ceza, büyük ve tekrar eden hata ise en ağır cezayı getirir.","yontemler":"Fiil cümlesini kanundaki kalıp ifadelerle birebir eşleştirip doğrudan ceza adını seçmek yeterlidir, hesaplama yapılmaz.","nedir":"Meslek mensuplarının mesleki kurallara aykırı davranışlarına karşı uygulanan yaptırım sistemidir. Sınav, hangi fiile hangi ceza derecesinin karşılık geldiğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Bağımsızlık İhlali Tuzağı","metin":"Görevi bağımsızlık, tarafsızlık ve dürüstlükle yapmama halinin cezasıyla bu özel fiili karıştırıyorsun. Doğrusu: Geçici alıkoyma cezası bağımsızlık/tarafsızlık ihlali ile tasdik yetkisinin gerçeğe aykırı ilk kullanımına özgüdür, mükellefle kasten vergi ziyaına sebebiyet fiiline uygulanmaz."},"A":{"ad":"İlk Aşama Tuzağı","metin":"Her disiplin ihlalinin ilk defasında uyarma cezası ile başladığını sanıyorsun. Doğrusu: Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verilip bu husus mahkeme kararıyla kesinleştiğinde ilk aşama uygulamadan doğrudan meslekten çıkarma cezasını öngörür."},"D":{"ad":"Yeminli Sıfatı Tuzağı","metin":"Bu cezanın her ağır fiilde uygulanan genel bir yaptırım olduğunu sanıyorsun. Doğrusu: Yeminli sıfatının kaldırılması yalnız yeminli mali müşavirlerin tasdik yetkisini gerçeğe aykırı kullanmasının tekerrürüne özgü özel bir cezadır."},"B":{"ad":"Tekerrür Tuzağı","metin":"Kınama cezasının basit kusurlu davranışın tekrarında uygulandığını, olayı da böyle bir tekrar sanıyorsun. Doğrusu: Buradaki fiil mükellefle birlikte kasten vergi ziyaına sebep olmaktır, bu fiile kanun doğrudan en ağır cezayı bağlamıştır."}},"celdiriciYol":{},"hap":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu husus mahkeme kararıyla kesinleşen meslek mensubuna kademesiz doğrudan meslekten çıkarma cezası verilir.","teshis":{"C":{"gercek":"Geçici alıkoyma; bağımsızlık, tarafsızlık, dürüstlük ihlali ile tasdik yetkisinin ilk kez gerçeğe aykırı kullanımına özgüdür.","ayirt":"Fiil bağımsızlık/tasdik yetkisi ihlali mi, yoksa mükellefle birlikte vergi ziyaı mı?","paragraf":"3568 s.K. m.48","yanilgi":"Geçici alıkoymayı her ağır sayılan fiilin standart cezası sanıyorsun."},"E":{"gercek":"Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verilip bunun mahkeme kararıyla kesinleşmesi halini doğrudan meslekten çıkarma sebebi saymıştır.","ayirt":"Fiil kanunda ayrıca sayılan doğrudan ağır ceza gerektiren hallerden biri mi?","paragraf":"3568 s.K. m.48","yanilgi":"Bu kadar ağır bir cezanın kademeli süreç olmadan uygulanamayacağını düşünüp bu şıkkı elersin."},"A":{"gercek":"Madde 48, ağırlığına göre bazı fiillere kademesiz doğrudan ağır ceza bağlar; kasten vergi ziyaı bunlardan biridir.","ayirt":"Bu fiil kademeli mi ağırlaşır yoksa kanunun kendisi mi doğrudan ağır cezayı buyuruyor?","paragraf":"3568 s.K. m.48","yanilgi":"Bütün disiplin süreçlerinin uyarma ile başladığını düşünüyorsun."},"D":{"gercek":"Bu ceza yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrür edip mahkeme kararıyla kesinleşmesine özgüdür.","ayirt":"Olayda tasdik yetkisinin tekerrür eden kötüye kullanımı mı var, yoksa mükellefle kasten vergi ziyaı mı var?","paragraf":"3568 s.K. m.48","yanilgi":"Yeminli sıfatını kaldırmayı her yeminli mali müşavir hatasının cezası sanıyorsun."},"B":{"gercek":"Kınama yalnız mesleğin vakar ve onuruna aykırı hareketin tekrarında uygulanır, kasten vergi ziyaı ayrı ve özel bir hükümle düzenlenmiştir.","ayirt":"Olaydaki fiil genel vakar/onur ihlali mi, yoksa kanunun ayrıca saydığı özel bir fiil mi?","paragraf":"3568 s.K. m.48","yanilgi":"Kınamayı her tekrarlanan hatanın otomatik cezası sanıyorsun."}},"verilen":[[1,1]
