ek mensubuna.","D":"Tasdik yetkisini gerçeğe aykırı kullandığı Maliye Bakanlığınca ilk defa tespit edilip rapora bağlanan yeminli mali müşavire.","B":"Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayarak mesleğin genel prensiplerine aykırı hareket eden meslek mensubuna."},"kaynak":{"alinti":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"3568 sayılı Kanunun 48. maddesinin 2. fıkrasında \u0027Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir\u0027 hükmü açıkça yer almakta ve bu durumda cezada takdir yetkisi bulunmamaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Vakar ve onura aykırı ilk fiilde uyarma, tekrarında kınama verilir; meslekten çıkarma bu hükmün konusu değildir.","E":"Üç yılda iki veya daha fazla ceza durumunda kanun disiplin kuruluna daha ağır ceza uygulayabilme imkanı tanır; bu takdir yetkisidir, zorunlu meslekten çıkarma doğurmaz.","D":"Tasdik yetkisinin gerçeğe aykırı kullanıldığının ilk tespitinde geçici alıkoyma, tekerrürü ve mahkeme kararını izleyen durumlarda yeminli sıfatını kaldırma verilir.","B":"Bağımsızlık ve dürüstlükle görev yapmama durumunda kanun geçici mesleki faaliyetten alıkoymayı öngörür, meslekten çıkarmayı değil."},"dogru":"Muhasebeci mükellefle birlikte kasıtlı olarak vergiyi eksik gösterdiyse ve mahkeme bunu kesinlikle kanıtladıysa, meslek hakkında meslekten çıkarma cezası zorunlu olarak uygulanır. Diğer durumların hepsinde ya uyarma, kınama, geçici alıkoyma gibi daha hafif cezalar veya takdir yetkisi söz konusudur.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 48. madde","kavramlar":[{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir.","ad":"meslekten çıkarma"},{"kaynak":"SMMM K. 48. madde","tanim":"Mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır.","ad":"geçici olarak mesleki faaliyetten alıkoyma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununun disiplin cezalarına ilişkin hükümlerine göre, aşağıdaki durumlardan hangisinde meslek mensubuna meslekten çıkarma cezası HER ZAMAN uygulanır?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-11","verilenler":[],"dayanak":"3568 s. SMMM K. m.48","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Adana\u0027da SMMM Kemal, 2019 yılında bir tekstil firmasının sahibiyle anlaşıp faturaları kasden düşük gösteriyor, vergi ziyaına sebep oluyor. 2021\u0027de mahkeme bu suçu kesin hükümle onaylıyor.","anlatim":"Disiplin kurulu şimdi Kemal\u0027e ne ceza vereceğini konuşuyor. Beş ayrı ihtimali bu tek olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: madde 48\u0027e göre ceza, fiilin ağırlığına göre uyarmadan meslekten çıkarmaya kadar sıralanır; bazı fiillerde kurulun takdiri var, bazısında yok.","anlatim":"Kemal\u0027in olayı hangi bende girer, kurulun elini kolunu bağlayan bir hüküm var mı, bunu göreceğiz. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.48/2","karar":"doğru","anlatim":"Madde 48\u0027in ikinci fıkrası bu fiil için tek bir sonuç tanımlar, kurula seçenek bırakmaz. Kemal\u0027in kasden davranışı mahkemeyle kesinleştiği için sonuç doğrudan meslekten çıkarmadır.","formul":"Şık A: Kemal mükellefle birlikte kasden vergi ziyaına sebep olmuş ve bu durum mahkeme kararıyla kesinleşmiş; kurul burada ceza seçme hakkına sahip mi, yoksa doğrudan meslekten mi çıkarır?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.48/1","karar":"yanlış","anlatim":"Böyle bir ihlalde madde 48\u0027in ilk fıkrası geçici olarak mesleki faaliyetten alıkoymayı öngörür. Meslekten çıkarma bu fiil için kesin sonuç değildir.","formul":"Şık B: Kemal yalnızca tarafsızlık ve dürüstlük ilkesine aykırı davranmış olsaydı, bu tek başına meslekten çıkarmayı doğurur muydu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.48/1","karar":"yanlış","anlatim":"İlk defasında uyarma cezası uygulanır, ikinci defasında kınama gelir. Meslekten çıkarma bu fıkrada hiç yer almaz.","formul":"Şık C: Kemal mesleğin vakar ve onuruna aykırı bir fiili ilk kez işlemiş olsaydı, bu ilk seferde meslekten çıkarma gelir miydi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.48/1","karar":"yanlış","anlatim":"İlk tespitte geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Meslekten çıkarma değil, tekerrür edip mahkeme kararıyla kesinleşirse yeminli sıfatının kaldırılması gündeme gelir.","formul":"Şık D: Kemal yeminli mali müşavir olsaydı ve tasdik yetkisini Maliye Bakanlığı ilk kez tespit edip rapora bağlasaydı, bu ilk tespit meslekten çıkarma sonucu doğurur muydu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.48/2","karar":"yanlış","anlatim":"Kanun burada bir derece ağır ceza uygulanabileceğini söyler, ama bu kurulun takdirindedir. Zorunlu bir sonuç değildir, o yüzden \"her zaman\" ifadesine uymaz.","formul":"Şık E: Kemal üç yıl içinde iki ayrı disiplin cezası gerektiren fiil işlemiş olsaydı, bu durumda meslekten çıkarma kesin olarak mı uygulanır?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Kemal\u0027in olayında tek kesin sonuç, mahkeme kararıyla kesinleşmiş kasden vergi ziyaına bağlanan meslekten çıkarma cezasıdır. Kendine hep şunu sor: madde metni bu fiil için \"verilir\" mi diyor yoksa kurula \"takdir\" mi bırakıyor?","doldur":[]}],"anahtar":[{"ornek":"meslekten","kok":"meslek"},{"ornek":"çıkarma","kok":"çıkarm"},{"ornek":"mahkeme","kok":"mahkem"},{"ornek":"kesinleşmiş","kok":"kesinl"},{"ornek":"cezası","kok":"cezası"},{"ornek":"kasden","kok":"kasden"}],"konuGiris":{"harita":"Ne zaman test edilir: fiilin hangi disiplin cezasıyla eşleştiği sorulduğunda. Nasıl ölçülür: kanun metnindeki fiil-ceza eşleşmesinin doğru hatırlanmasıyla. Nasıl kaydedilir: disiplin kurulu kararı ve varsa mahkeme kararının kesinleşmesiyle.","desen":"Soru, hangi fiilin \u0027her zaman\u0027 meslekten çıkarma gerektirdiğini ayırt etmeyi ister; ilk kez yapılan ve tekerrür eden fiiller karıştırılır. Tuzak, kasıt ve mahkeme kararıyla kesinleşme şartının atlanmasıdır. Bu soru m.48 [2/2] fıkrasındaki \u0027mahkeme kararıyla kesinleşen vergi ziyaı\u0027 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Ruhsatın geri alınıp mesleğin bir daha icra edilememesi cezası.","ad":"Meslekten çıkarma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mükellefle birlikte kasıtlı vergi kaybına yol açma fiili, mahkeme kararıyla kesinleşir.","ad":"Vergi ziyaına kasden sebebiyet","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Altı ay ile bir yıl arasında meslek icrasının durdurulması cezası.","ad":"Geçici mesleki faaliyetten alıkoyma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Beş yılda iki kez alıkoyma cezası alanın fiili tekrarında verilen ağır ceza.","ad":"Tekerrür cezası","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soru, kanundaki disiplin cezalarını sıralar ve hangi fiilin kesin olarak meslekten çıkarmayı gerektirdiğini sorar.","panel_ornek":"Bir apartman yöneticisi parayı kötüye kullanırsa yönetim kurulu onu ilk seferde uyarır, tekrarında görevden alır. Ama yöneticinin sahte fatura ile hırsızlık yaptığı mahkeme kararıyla kesinleşirse tartışmasız görevden atılır. Yani bazı hatalar kademeli, bazıları anında en ağır sonucu doğurur.","ornek":"Bir apartman yöneticisi parayı kötüye kullanırsa yönetim kurulu onu ilk seferde uyarır, tekrarında görevden alır. Ama yöneticinin sahte fatura ile hırsızlık yaptığı mahkeme kararıyla kesinleşirse tartışmasız görevden atılır. Yani bazı hatalar kademeli, bazıları anında en ağır sonucu doğurur.","yontemler":"Şıklardaki fiili kanun metnindeki \u0027meslekten çıkarma\u0027 cümlesiyle birebir eşleştirmek gerekir; \u0027ilk defasında\u0027, \u0027tekerrüründe\u0027 gibi kademeli ifadeler içeren şıklar elenir.","nedir":"Mesleki davranış ilkesi, meslek mensubunun hangi fiilinde hangi disiplin cezasının verileceğini düzenler. Sınav, hangi fiilin hangi cezayla otomatik eşleştiğini bilip bilmediğini ölçer."},"olay":"yok, doğrudan madde metninden çıkan bağlayıcı sonuç.","tuzak":{"C":{"ad":"İlk-Tekrar Karıştırma Tuzağı","metin":"vakar ve onura aykırı her fiili aynı ağırlıkta cezalandırır sanırsın. Doğrusu: mesleki kurallara, vakar ve onura aykırı fiilin ilk defasında uyarma, tekrarında kınama cezası uygulanır; meslekten çıkarma bu fıkranın konusu değildir."},"E":{"ad":"İhtiyari Hükmü Zorunlu Sanma Tuzağı","metin":"kanundaki \u0027bir derece ağır ceza uygulanabilir\u0027 ifadesini kesin bir yükümlülük sanırsın. Doğrusu: üç yıllık dönemde tekrarlanan disiplin suçunda disiplin kurulu bir derece ağır ceza uygulayabilir, bu bir takdir yetkisidir, zorunlu meslekten çıkarma sonucu doğurmaz."},"D":{"ad":"Tekerrür Şartını Atlama Tuzağı","metin":"ilk tespiti doğrudan en ağır sonuca bağlarsın. Doğrusu: tasdik yetkisinin gerçeğe aykırı kullanıldığının ilk tespitinde geçici olarak mesleki faaliyetten alıkoyma cezası verilir; meslekten çıkarma bu maddede değil, ayrı bir hükümde düzenlenmiştir."},"B":{"ad":"Kademe Atlama Tuzağı","metin":"genel prensiplere aykırılığı en ağır ceza sanırsın; oysa madde bunu ayrı bir kademeye bağlar. Doğrusu: bağımsızlık, tarafsızlık ve dürüstlükle görev yapmama hâlinde uygulanan ceza geçici olarak mesleki faaliyetten alıkoymadır, meslekten çıkarma değildir."}},"celdiriciYol":{"not":"Teorik soru; celdiricilik hesap zinciriyle değil aynı maddenin (m.48) farklı fıkra ve şartlarının (ilk/tekerrür, ihtiyari/zorunlu, mahkeme kararı şartı) tek tek atlanmasıyla kurulmuştur."},"hap":"Meslekten çıkarma cezası ancak kanunun açıkça saydığı ağır ve kesinleşmiş hâllerde (kasden vergi ziyaı-mahkeme kararı, ruhsat kullandırma, tekerrür eden alıkoyma) zorunlu olarak uygulanır; diğer ihlallerde ceza kademelidir.","teshis":{"C":{"gercek":"Kanun ilk defasında uyarma, tekrarında kınama cezasını öngörür; meslekten çıkarma bu fıkrada hiç geçmez.","ayirt":"Fiil ilk kez mi işlendi, yoksa tekrar mı ediyor; madde bu ikisine farklı ceza mı bağlıyor?","paragraf":"m.48/1","yanilgi":"Vakar ve onura aykırı her davranışı aynı şiddette cezalandırıldığını, ilk defa ile tekrarın aynı sonucu doğurduğunu sanırsın."},"E":{"gercek":"Üç yıllık dönemde tekrarlanan disiplin suçunda bir derece ağır ceza uygulanması kurulun takdirindedir, kanun bunu zorunlu kılmaz.","ayirt":"Madde metni bu sonucu \u0027verilir\u0027 diye mi, \u0027uygulanabilir\u0027 diye mi bağlıyor?","paragraf":"m.48/2","yanilgi":"Kanundaki \u0027uygulanabilir\u0027 ifadesini zorunlu bir sonuç gibi okur, disiplin kurulunun takdir yetkisini gözden kaçırırsın."},"A":{"gercek":"3568 sayılı Kanunun 48 inci maddesinin ikinci fıkrası, mükellefle birlikte kasden vergi ziyaına sebebiyet verilip bunun mahkeme kararıyla kesinleşmesi hâlinde meslekten çıkarma cezasını doğrudan ve bağlayıcı biçimde öngörür.","ayirt":"Madde metninde bu fiil için kurula takdir hakkı tanınmış mı, yoksa doğrudan sonuç mu bağlanmış?","paragraf":"m.48/2","yanilgi":"Bu şıkkı elemeye çalışan öğrenci, mahkeme kararıyla kesinleşme şartını gözden kaçırıp bunun da diğer ihtiyari cezalar gibi takdire bağlı olduğunu düşünür."},"D":{"gercek":"İlk tespitte geçici alıkoyma cezası uygulanır; ancak bu husus tekerrür edip mahkeme kararıyla kesinleşirse yeminli sıfatının kaldırılması cezası uygulanır, meslekten çıkarma değil.","ayirt":"Bu fiil ilk kez mi tespit edildi, yoksa tekerrür edip mahkeme kararıyla mı kesinleşti?","paragraf":"m.48/1","yanilgi":"İlk tespitin de en ağır sonucu doğurduğunu düşünüp tekerrür ve mahkeme kararı şartlarını atlarsın."},"B":{"gercek":"Aynı maddenin ilk fıkrasına göre bağımsızlık, tarafsızlık ve dürüstlükle görev yapmama hâlinde geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır.","ayirt":"Bu fiil için madde metninde hangi ceza türü ayrıca adıyla sayılmış?","paragraf":"m.48/1","yanilgi":"Genel prensiplere aykırılığı mesleğin en ağır ihlali sayıp doğrudan meslekten çıkarmayla eşleştirirsin."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 102"},"kural":"Metne göre Etik İlkeler kişiliği ve gelişimini hedef alan soyut kavramları, Davranış Kuralları ise mesleğin uygulamasına yönelik somut yönlendirmeleri düzenler.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 102","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Ahlak-etik ve meslek etiği-davranış kuralları çiftlerini birbirine karıştıran şıklara dikkat et; hangi kavramın \u0027soyut/kişilik\u0027, hangisinin \u0027somut/uygulama\u0027 olduğunu tanımdan ayır.","konu":"mesleki davranış ilkesi","tablo":{"satirlar":[["A) Etik, kişinin üzerinde düşünmeden kabul ettiği ve uyduğu…","Genelge 19 eki, bölüm I-II","YANLIŞ ifade"],["B) Zorlama ve tehditle gerçekleştirilen bir eylem, derin dü…","Genelge 19 eki, bölüm I-II","YANLIŞ ifade"],["C) Etik ilkeler, kişiliği ve onun gelişimini hedef alan soy…","Genelge 19 eki, bölüm 5","doğru ifade"],["D) Meslek etiği, basiretli bir kişinin iş ve işlemler yapıl…","Genelge 19 eki, bölüm 5","YANLIŞ ifade"],["E) Meslek etiği ilkeleri yalnızca meslek içi rekabeti düzen…","Genelge 19 eki, bölüm 5","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Etik ilkeler, kişiliği ve onun gelişimini hedef alan soyut kavramları belirtirken; davranış kuralları, belirli bir mesleğin uygulamasına yönelik somut yönlendirmeleri içerir.","E":"Meslek etiği ilkeleri yalnızca meslek içi rekabeti düzenlemeyi amaçlar; yetersiz ve ilkesiz üyelerin meslekten dışlanmasıyla bir ilgisi bulunmamaktadır.","A":"Etik, kişinin üzerinde düşünmeden kabul ettiği ve uyduğu kuralları içerirken; ahlak, kişinin özgür iradesiyle derin düşünme sürecinden geçirdikten sonra karar verdiği kuralları içerir.","D":"Meslek etiği, basiretli bir kişinin iş ve işlemler yapılırken karşılaştığı durumlarda nasıl davranması gerektiğini somut biçimde idealize eden ilkeler bütünüdür.","B":"Zorlama ve tehditle gerçekleştirilen bir eylem, derin düşünmeye dayanmasa da ahlaki bir eylem sayılır çünkü sonuç itibarıyla toplumsal düzeni korur."},"kaynak":{"alinti":"bireyin özgürlüğünün bir sonucu","liste":[{"ad":"TSPB Sermaye Piyasasi Calisanlari Etik Ilkeleri ve Davranis Kurallari (Genelge 191) bolum 1","metin":"TSPB TÜRKİYE SERMAYE PİYASALARI BİRLİĞİ Büyükdere Cad. No: 173 1. Levent Plaza A-Blok Kat: 4 34394 1. Levent - İstanbul Tel : (212) 280 85 67 Faks : (212) 280 85 89 www.tspb.org.tr İstanbul, 21 Ekim 2014 2014/1031 GENELGE No: 19 Konu : Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları hk. SAYIN ÜYEMİZ, Sermaye piyasası, mevzuatı, kurumları ve araçlarıyla hızla değişmekte ve gelişmektedir. Değişen ve gittikçe karmaşık hale gelen faaliyet alanımızda, üyelerimiz ve çalışanlarının karşılaştıkları konularda doğru karar alabilmeleri daha da önemli hale gelmiştir. Birliğimiz, sermaye piyasaları ve mesleğimizin güven ve itibar üzerine kurulu olduğu düşüncesiyle, faaliyetlerimizde rehber olması amacıyla “Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları”nı hazırlamış; bu ilke ve kurallar Birlik Yönetim Kurulumuzun 15.10.2014 tarihli toplantısında kabul edilmiştir. “Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları” etik değerlendirme gerektiren durumlarla karşılaşan sermaye piyasası çalışanının, müşterilerine, yöneticilerine, çalışanlarına ve tüm finans piyasasına karşı sorumluluklarının belirlemesinde rehber olmayı hedeflemektedir. Ekte yer alan “Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kurallarının” çalışanlarınıza duyurulması ve düzenlemeye uyumun gözetilmesini bilgilerinize sunarım. Saygılarımla, İlhami KOÇ Başkan Ek: “Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları” TÜRKİYE SERMAYE PİYASALARI BİRLİĞİ SERMAYE PİYASASI ÇALIŞANLARI ETİK İLKELERİ VE DAVRANIŞ KURALLARI 2 I. GİRİŞ Ahlak genel anlamda, belirli…"},{"ad":"TSPB Sermaye Piyasasi Calisanlari Etik Ilkeleri ve Davranis Kurallari (Genelge 191) bolum 2","metin":"Bu tanımıyla ahlak, insan eylemlerinin doğru ve yanlış gibi değer ölçüleriyle ifade edilmesini mümkün kılan yargı, tutum, davranışlardır. İnsanların birbirleriyle, toplumla ya da devletle olan ilişkilerinden ortaya çıkmış olup, bireylerin “yapmaları veya yapmamaları istenen” davranışları ve eylemleri belirler2. Toplumsal yaşamın tüm alanlarında insanların yaptıklarını düzene koyan ahlak, kendiliğinden biçimlenmiş ve genel kabul görmüş değerlendirmeleri içeren davranış kurallarıdır3. Ahlak, kaynağını insandan alır. Doğanın kendisinde, öldürme, kötü söz söyleme, iyi insan ol vb. gibi ahlaka yönelik kurallar bulunmamaktadır. Ahlakın konusuna giren kavramları, bireyler ya da toplumlar tarihsel süreçte kendileri yaratmıştır. Birey, uyulması gereken kurallar bütünü olan ahlakı, yaşadığı toplumda hazır bulur. Ancak, gerek birey, gerekse toplum belirli bir olgunluk seviyesine eriştikten sonra, öğrenilen ahlaki yargıları kendi içinde sorgular, değerlendirir ve bunun sonucunda başlangıçtan farklı ahlaki yargı kurallarına ulaşabilir. İşte böyle bir sorgulama ve değerlendirme süreci, birey veya toplumun evrensel değer ve yargılara ulaşmak için, etik eylemde bulunması anlamına gelmektedir. Etik, ahlakı konu edinen ve bireyin aktif katılımıyla yapılan bir “derin düşünme”4 ve evrensel anlamda “doğru eylem”in gerçekleştirilmesi sürecidir (tefekkür). Yapmayı tasarladığı eylem öncesinde, eyleminin doğruluğu konusunda derin düşünceye yönelen ve önce “Burada ne yapmalıyım?”, ardından “Neden?” sorularına cevap arayan her birey, böylece etik bir eylem, etik düşünme, gerçekleştirmiş olur."}],"hakem":"Kaynak metinde (Bölüm 3) etik ilkelerin \u0027bireyin özgürlüğünün bir sonucu\u0027 olduğu ve kişiliğin gelişimine yönelik derin düşünme süreci ifade edilirken, davranış kurallarının ise toplumsal yaşamın tüm alanlarında insanların yaptıklarını düzene koyan \u0027kendiliğinden biçimlenmiş ve genel kabul görmüş değerlendirmeleri içeren davranış kuralları\u0027 olarak tanımlandığı (Bölüm 2) açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Basiretli kişinin somut davranışını idealize etme işlevi, Davranış Kurallarına ait olup Meslek Etiğine değildir. Meslek etiği soyut kişilik gelişimini hedefler.","E":"Meslek etiği yalnızca meslek içi rekabeti düzenlemez; aynı zamanda yetersiz ve ilkesiz üyeleri meslekten dışlama işlevini de yerine getirir.","A":"Ahlak ile etik tanımları ters yazılmıştır. Metne göre ahlak, üzerinde düşünmeden kabul edilen kurallar; etik, özgür iradeyle derin düşünme sonucunda benimsenen kurallardır.","B":"Zorlama ve tehditle yapılan eylem, derin düşünmeye dayanmadığı için ne ahlaki ne de etiktir. Metinde bu açıkça istisnaya bağlıdır."},"dogru":"Etik ilkeler soyut kavramlarla kişiliğin gelişimini hedeflerken; davranış kuralları ise mesleğin pratik uygulamasına yönelik somut yönlendirmeler sunar. C şıkkı metindeki bu ayrımı doğru yansıtır.","sinav":"TSPB Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları metnine göre etik ilkeler kişiliğin gelişimini hedef alan soyut kavramları, davranış kuralları ise mesleğin uygulamasına yönelik somut yönlendirmeleri içerir.","kavramlar":[{"kaynak":"TSPB Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları Bölüm 2","tanim":"Ahlakı konu edinen ve bireyin aktif katılımıyla yapılan derin düşünme süreci; bireyin özgür iradesiyle, eylemin doğruluğu konusunda sorgulama yaparak evrensel anlamda doğru eylemi gerçekleştirmesidir.","ad":"Etik"},{"kaynak":"TSPB Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları Bölüm 1-2","tanim":"Belirli bir toplumda veya kültürde doğru ve yanlış davranışa ilişkin genel geçer kabul gören ilke ve kurallar bütünü; bireylerin çoğunlukla üzerinde düşünmeden kabul ettiği ve uyduğu kuralları içerir.","ad":"Ahlak"},{"kaynak":"TSPB Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları Bölüm 4","tanim":"Belirli bir mesleğin uygulamasına yönelik somut yönlendirmeler; meslek çalışanlarını pratik uygulamada nasıl davranması gerektiği konusunda kılavuzlamaktadır.","ad":"Davranış Kuralları"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"TSPB Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları metnine göre ahlak, etik, meslek etiği ve davranış kuralları kavramları arasındaki ilişkiye ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-20","verilenler":[],"dayanak":"TSPB Genelge 19 (2014/1031) eki Sermaye Piyasası Çalışanları Etik İlkeleri ve Davranış Kuralları, bölüm I-II ve 5","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bir aracı kurumda 3 yıllık müşteri temsilcisi Ayşe, portföy yönetimi bölümüne yeni geçen stajyer Can\u0027a etik ile ahlak farkını, meslek etiği ile davranış kurallarının farkını anlatıyor.","anlatim":"Ayşe elindeki kâğıda dört kavramı yazıyor: ahlak, etik, meslek etiği, davranış kuralları. Can bunları birbirine karıştırıyor ve beş cümleyle test ediliyor.","doldur":[]},{"formul":"Ne yapacağız: Ayşe\u0027nin yazdığı beş cümleyi TSPB\u0027nin Genelge 19 ekindeki tanımlarla tek tek karşılaştıracağız.","anlatim":"Ahlak kaynağını insandan alır, hazır bulunur; etik ise bireyin özgür iradesiyle derin düşünme sürecidir. Beş ifadeyi bu iki tanımla tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Genelge 19 eki, bölüm I-II","karar":"yanlış","anlatim":"Ayşe hemen düzeltiyor, çünkü metin tam tersini söylüyor: ahlak hazır bulunan, etik ise sorgulanıp derin düşünülen süreçtir. Can kavramları ters bağlamış.","formul":"Şık A: Can \u0027etik düşünmeden kabul edilen, ahlak ise derin düşünülüp karar verilen kurallardır\u0027 diyor, doğru mu diyorsun?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Genelge 19 eki, bölüm I-II","karar":"yanlış","anlatim":"Ayşe hayır diyor, çünkü metne göre etik ve ahlaki eylem bireyin özgürlüğüne dayanır. Zorlama ve tehditle yapılan eylem derin düşünmeye dayanmadığı için ahlaki sayılmaz.","formul":"Şük B: Can \u0027yönetici beni tehdit ederek bir işlem yaptırsa da, sonuç toplumsal düzeni koruyorsa bu ahlaki eylemdir\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Genelge 19 eki, bölüm 5","karar":"doğru","anlatim":"Ayşe bunu onaylıyor, çünkü metin tam olarak bu ayrımı yapıyor. Soyut olan etik, somut olan davranış kuralı diye ikiye bölünüyor.","formul":"Şık C: Can \u0027etik ilkeler kişiliği hedef alan soyut kavramlardır, davranış kuralları ise mesleğin somut uygulamasına yöneliktir\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Genelge 19 eki, bölüm 5","karar":"yanlış","anlatim":"Ayşe düzeltiyor, çünkü bu somut idealize etme işlevi metinde davranış kurallarına ait, meslek etiğine değil. Can iki kavramın işlevini karıştırmış.","formul":"Şık D: Can \u0027meslek etiği, basiretli kişinin iş yaparken nasıl davranacağını somut şekilde idealize eden ilkelerdir\u0027 diyor, bu tanım doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Genelge 19 eki, bölüm 5","karar":"yanlış","anlatim":"Ayşe hayır diyor, çünkü metin meslek etiğini hem rekabeti düzenleyen hem de yetersiz ve ilkesiz üyeleri dışlayan bir bütün olarak tanımlıyor. Can tanımı eksik bırakmış.","formul":"Şık E: Can \u0027meslek etiği sadece meslek içi rekabeti düzenler, yetersiz üyeleri meslekten dışlamakla ilgisi yoktur\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Doğru cevap C, çünkü metindeki soyut-somut ayrımı birebir buradadır. Kendine hep şunu sor: bu ifade kişiliği mi, yoksa mesleğin somut uygulamasını mı anlatıyor?","doldur":[]}],"anahtar":[{"ornek":"davranış","kok":"davran"},{"ornek":"kuralları","kok":"kurall"},{"ornek":"kavramları","kok":"kavram"},{"ornek":"ahlaki","kok":"ahlaki"},{"ornek":"mesleğin","kok":"mesleğ"},{"ornek":"kişiliği","kok":"kişili"}],"konuGiris":{"harita":"Ne zaman test edilir: kavramlardan birinin tanımı veya ilişkisi doğru/yanlış seçenek olarak sorulduğunda. Nasıl ölçülür: metindeki tanımların birbirine karıştırılıp karıştırılmadığına bakılarak. Nasıl kaydedilir: doğru seçenek, metindeki hiyerarşiyi (ahlak-etik-meslek etiği-davranış kuralı) bozmayan ifadedir.","desen":"Sınav bu dört kavramı birbirinin yerine kullanan yanlış cümleler kurarak tuzak yapar, örneğin ahlakı etikle veya davranış kurallarını meslek etiğiyle eş sayan seçenekler sorulur. Doğru seçenek metindeki sırayı yani ahlaktan etiğe, etikten meslek etiğine, oradan davranış kuralına geçişi bozmaz. Bu soru bölüm 3\u0027teki ahlak-etik ilişkisi tanımından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Toplumda genel kabul gören, sorgulanmadan uyulan doğru-yanlış kuralları","ad":"Ahlak","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bireyin özgür iradesiyle ahlakı derin düşünerek sorgulaması ve karar vermesi","ad":"Etik","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Etik düşünmenin belirli bir mesleğe özgü doğru eylem kurallarına dönüşmesi","ad":"Meslek etiği","kim":"meslek kuruluşu düzenler"},{"kaynak":"soruda verilir","tanim":"Meslek etiğinin yazılı, somut ve uyulması istenen kurallara dökülmüş hali","ad":"Davranış kuralları","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soru dört kavramdan birinin veya ilişkisinin doğru tanımlandığı seçeneği bulmayı ister.","panel_ornek":"Bir arkadaşın herkesin yaptığı gibi otobüste yaşlıya yer vermesi ahlaki bir davranıştır ama o an durup \u0027burada doğru olan ne\u0027 diye düşünüp kararını kendi vicdanıyla sorgulaması etik düşünmedir. Sonra bu düşünme, mesleğindeki 5 kişilik ekip için yazılı 3 kurala dönüşürse artık meslek etiği ve davranış kuralı olur.","ornek":"Bir arkadaşın herkesin yaptığı gibi otobüste yaşlıya yer vermesi ahlaki bir davranıştır ama o an durup \u0027burada doğru olan ne\u0027 diye düşünüp kararını kendi vicdanıyla sorgulaması etik düşünmedir. Sonra bu düşünme, mesleğindeki 5 kişilik ekip için yazılı 3 kurala dönüşürse artık meslek etiği ve davranış kuralı olur.","yontemler":"Cevabı bulurken hangi kavramın \u0027kaynağını insandan alan, sorgulanmayan\u0027 olduğuna, hangisinin \u0027özgür iradeyle sorgulama\u0027 olduğuna bakılır. Meslek etiği ve davranış kuralları ikisi de bu sorgulamanın somutlaşmış, yazılı haline karşılık geldiği unutulmamalı.","nedir":"Bu konu ahlak, etik, meslek etiği ve davranış kuralları kavramlarının birbirinden farkını ve aralarındaki ilişkiyi anlatır. Sınav bu dört kavramın tanımını ve hangisinin hangisinden doğduğunu ölçer."},"olay":"","tuzak":{"D":{"ad":"Kavram Karıştırma Tuzağı","metin":"Basiretli kişinin somut davranışını idealize eden tanımı Meslek Etiğine mal ettin, oysa bu tanım Davranış Kurallarına aittir. Doğrusu: Somut, uygulamaya yönelik idealize etme işlevi Davranış Kurallarının, soyut kişilik gelişimi işlevi ise Etik İlkelerin konusudur."},"E":{"ad":"Kapsam Eksiltme Tuzağı","metin":"Meslek etiğinin işlevlerinden yalnızca birini (rekabeti düzenleme) alıp diğerini (yetersiz üyeleri dışlama) yok saydın. Doğrusu: Metne göre meslek etiği hem meslek içi rekabeti düzenler hem de yetersiz ve ilkesiz üyeleri meslekten dışlar."},"A":{"ad":"Ters Kayıt Tuzağı","metin":"Ahlak ile Etik kavramlarının tanımlarını yer değiştirip yazdın. Doğrusu: Ahlak üzerinde düşünmeden kabul edilen kuralları, etik ise özgür iradeyle derin düşünme sonucu benimsenen kuralları içerir."},"B":{"ad":"İstisnanın İhmali Tuzağı","metin":"Zorlama ve tehditle yapılan eylemi ahlaki sayarak metindeki açık istisnayı gözden kaçırdın. Doğrusu: Metne göre zorlama ve tehditle gerçekleştirilen eylem derin düşünmeye dayanmadığı için ne ahlaki ne de etiktir."}},"celdiriciYol":{},"hap":"Etik İlkeler kişiliği hedef alan soyut kuralları, Davranış Kuralları ise mesleğin uygulamasına yönelik somut yönlendirmeleri içerir; zorlama ve tehditle yapılan eylem ne ahlaki ne de etiktir.","teshis":{"C":{"gercek":"Metin açıkça Etik İlkeleri soyut/kişilik odaklı, Davranış Kurallarını somut/uygulama odaklı olarak birbirinden ayırır.","ayirt":"Bu ifade kişiliği mi, yoksa mesleğin somut uygulamasını mı hedef alıyor?","paragraf":"Genelge 19 eki, bölüm 5","yanilgi":"Bu şıkkı elemeye çalışan öğrenci, iki kavramın tanımını birbirine çok yakın bulup ayrımı gereksiz sanır."},"E":{"gercek":"Metin meslek etiğini hem meslek içi rekabeti düzenleyen hem de yetersiz ve ilkesiz üyeleri meslekten dışlayan ilkeler bütünü olarak tanımlar.","ayirt":"Bu tanım meslek etiğinin işlevlerinden yalnızca birini mi anlatıyor, tamamını mı?","paragraf":"Genelge 19 eki, bölüm 5","yanilgi":"Meslek etiğinin tanımındaki uzun madde listesinden yalnızca ilk aklına geleni (rekabeti düzenleme) meslek etiğinin tamamı sandın."},"A":{"gercek":"Metin ahlakı kaynağını insandan alan, hazır bulunan kurallar; etiği ise bireyin özgür iradesiyle derin düşünme sonucu ulaştığı yargılar olarak ayırır.","ayirt":"Bu kural birey sorgulamadan mı benimsiyor, yoksa derin düşünme sonucu mu karar veriyor?","paragraf":"Genelge 19 eki, bölüm I-II","yanilgi":"Ahlak ve etik kelimelerini günlük dilde eş anlamlı sandığın için hangisinin \u0027düşünülmeden kabul edilen\u0027, hangisinin \u0027sorgulanarak benimsenen\u0027 olduğunu karıştırdın."},"D":{"gercek":"Metinde \u0027basiretli kişinin nasıl davranması gerektiğini idealize etme\u0027 işlevi açıkça Davranış Kurallarına atfedilir, Meslek Etiğine değil.","ayirt":"Bu tanım soyut kişilik ilkesi mi, yoksa somut davranış rehberi mi?","paragraf":"Genelge 19 eki, bölüm 5","yanilgi":"Meslek etiği ile davranış kurallarının aynı şey olduğunu, ikisinin de somut davranış idealize ettiğini sandın."},"B":{"gercek":"Metne göre birey özgürlüğüne dayanmayan, dışsal zorlama ve tehditle gerçekleştirilen eylem derin düşünmeye dayanmadığından ne ahlaki ne de etiktir.","ayirt":"Bu davranış özgür iradeyle mi, yoksa dışsal bir baskıyla mı gerçekleşti?","paragraf":"Genelge 19 eki, bölüm I-II (özgürlük vurgusu)","yanilgi":"Zorlamayla yapılan bir davranışın da sonuçta bir kurala uyduğu için ahlaki sayılabileceğini düşündün."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 109"},"kural":"Kanunun verdiği yetkinin sınırları içinde kalan bir fiil, zarara yol açsa bile hukuka aykırı sayılmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Beş şıktan dördü aynı maddenin farklı bentlerinden gerçek haksız rekabet örneğiyse, kalan tek şıkkı \u0027yetki kapsamında kalma\u0027 ölçütüyle ara.","konu":"mesleki davranış ilkesi","tablo":{"satirlar":[["A) Almadığı bir unvan veya dereceye sahipmiş gibi hareket e…","TTK m.55/1-a-3","doğru ifade"],["B) Meslek örgütünün kendisine tanıdığı denetim yetkisi kaps…","TBK m.63","YANLIŞ ifade"],["C) Rakip bir meslektaşının mali durumu hakkında gerçeğe ayk…","TTK m.55/1-a-2","doğru ifade"],["D) Kendisine emanet edilen bir teklif dosyasından yetkisiz …","TTK m.55/1-c-1","doğru ifade"],["E) Bir meslektaşının çalışanını, işverenin iş sırlarını ifş…","TTK m.55/1-b-3","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Rakip bir meslektaşının mali durumu hakkında gerçeğe aykırı açıklamalarla müşterileri kendine çekmeye çalışması.","E":"Bir meslektaşının çalışanını, işverenin iş sırlarını ifşa etmeye yönlendirerek bilgi elde etmesi.","A":"Almadığı bir unvan veya dereceye sahipmiş gibi hareket ederek müstesna bir yeteneğe sahip olduğu izlenimini uyandırması.","D":"Kendisine emanet edilen bir teklif dosyasından yetkisiz biçimde yararlanarak kendi teklifini hazırlaması.","B":"Meslek örgütünün kendisine tanıdığı denetim yetkisi kapsamında kalarak bir müşterinin mali tablolarını inceleyip rapor düzenlemesi."},"kaynak":{"alinti":"kanunun verdiği yetkiye dayanan ve bu yetkinin sınırları içinde kalan fiil hukuka aykırı sayılmaz","liste":[{"ad":"TTK (6102 s.K.) m.55 [1/4]","metin":"MADDE 55- (1) Aşağıda sayılan hâller haksız rekabet hâllerinin başlıcalarıdır: a) Dürüstlük kuralına aykırı reklamlar ve satış yöntemleri ile diğer hukuka aykırı davranışlar ve özellikle; 1. Başkalarını veya onların mallarını, iş ürünlerini, fiyatlarını, faaliyetlerini veya ticari işlerini yanlış, yanıltıcı veya gereksiz yere incitici açıklamalarla kötülemek, 2. Kendisi, ticari işletmesi, işletme işaretleri, malları, iş ürünleri, faaliyetleri, fiyatları, stokları, satış kampanyalarının biçimi ve iş ilişkileri hakkında gerçek dışı veya yanıltıcı açıklamalarda bulunmak veya aynı yollarla üçüncü kişiyi rekabette öne geçirmek, 3. Paye, diploma veya ödül almadığı hâlde bunlara sahipmişçesine hareket ederek müstesna yeteneğe malik bulunduğu zannını uyandırmaya çalışmak veya buna elverişli doğru olmayan meslek adları ve sembolleri kullanmak, 4. Başkasının malları, iş ürünleri, faaliyetleri veya işleri ile karıştırılmaya yol açan önlemler almak, 5. Kendisini, mallarını, iş ürünlerini, faaliyetlerini, fiyatlarını, gerçeğe aykırı, yanıltıcı, rakibini gereksiz yere kötüleyici veya gereksiz yere onun tanınmışlığından yararlanacak şekilde; başkaları, malları, iş ürünleri veya fiyatlarıyla karşılaştırmak ya da üçüncü kişiyi benzer yollardan öne geçirmek, 6."},{"ad":"TTK (6102 s.K.) m.55 [2/4]","metin":"Seçilmiş bazı malları, iş ürünlerini veya faaliyetleri birden çok kere tedarik fiyatının altında satışa sunmak, bu sunumları reklamlarında özellikle vurgulamak ve bu şekilde müşterilerini, kendisinin veya rakiplerinin yeteneği hakkında yanıltmak; şu kadar ki, satış fiyatının, aynı çeşit malların, iş ürünlerinin veya faaliyetlerinin benzer hacimde alımında uygulanan tedarik fiyatının altında olması hâlinde yanıltmanın varlığı karine olarak kabul olunur; davalı, gerçek tedarik fiyatını ispatladığı takdirde bu fiyat değerlendirmeye esas olur, 7. Müşteriyi ek edimlerle sunumun gerçek değeri hakkında yanıltmak, 8. Müşterinin karar verme özgürlüğünü özellikle saldırgan satış yöntemleri ile sınırlamak, 9. Malların, iş ürünlerinin veya faaliyetlerin özelliklerini, miktarını, kullanım amaçlarını, yararlarını veya tehlikelerini gizlemek ve bu şekilde müşteriyi yanıltmak, 10. Taksitle satım sözleşmelerine veya buna benzer hukuki işlemlere ilişkin kamuya yapılan ilanlarda unvanını açıkça belirtmemek, peşin veya toplam satış fiyatını veya taksitle satımdan kaynaklanan ek maliyeti Türk Lirası ve yıllık oranlar üzerinden belirtmemek, 11. Tüketici kredilerine ilişkin kamuya yapılan ilanlarda unvanını açıkça belirtmemek veya kredilerin net tutarlarına, toplam giderlerine, efektif yıllık faizlerine ilişkin açık beyanlarda bulunmamak, 12. İşletmesine ilişkin faaliyetleri çerçevesinde, taksitle satım veya tüketici kredisi sözleşmeleri sunan veya akdeden ve bu bağlamda sözleşmenin konusu, fiyatı, ödeme şartları, sözleşme süresi, müşterinin cayma veya fesih hakkına veya kalan borcu vadeden önce …"}],"hakem":"Doğru sık, TBK m.63\u0027te yer alan \u0027kanunun verdiği yetkiye dayanan ve bu yetkinin sınırları içinde kalan fiil hukuka aykırı sayılmaz\u0027 kuralını kaynak metinden desteklemektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Rakip hakkında yanlış ve kötüleyici açıklamalar yaparak müşteri çekmek, gerçeğe aykırı ifadelerin haksız rekabet oluşturduğu kuralını ihlal eder.","E":"Başka bir muhasebecinin çalışanını iş sırlarını açığa çıkarmaya teşvik etmek, işçiyi sırları ifşaya yöneltmenin haksız rekabet oluşturduğu kuralını ihlal eder.","D":"Sırrı saklanan bir teklif dosyasından izinsiz yararlanmak, başkasından yetkisiz yoluyla aldığı iş ürünlerinden faydalanmak olarak kanunda özel olarak yasaklanmıştır.","A":"Almadığı paye veya diplomasıymış gibi davranarak yetenekli görünme çabasıdır. Bu davranış, gerçek olmayan unvan taşımak olarak kanunda ayrıca düzenlenmiş bir haksız rekabet halidir."},"dogru":"Meslek örgütünün verdiği yetki içinde yapılan inceleme ve raporlama, hukuka uygun bir faaliyettir. Yetkili kişinin kanunla tanınan görevini yapması haksız rekabet sayılmaz.","sinav":"Türk Ticaret Kanunu 55. madde","kavramlar":[{"kaynak":"Türk Ticaret Kanunu 55. madde","tanim":"Dürüstlük kuralına aykırı olan, kanunda sayılan davranışlarla rakiplerin haklarını veya müşterilerin çıkarlarını ihlal etme halidir.","ad":"Haksız rekabet"},{"kaynak":"Türk Ticaret Kanunu 55. madde","tanim":"Kanun veya meslek örgütü tarafından verilen yetki çerçevesinde yapılan, denetim ve kontrol amaçlı işlemlerdir.","ad":"Yetkili faaliyet"},{"kaynak":"Türk Ticaret Kanunu 55. madde","tanim":"İşletmenin üretim yöntemlerine, tekniklerine ve ticari bilgilerine ilişkin gizli kalması gereken bilgiler olup, yetkisiz yolla elde edilip başkasına bildirilemez.","ad":"İş sırları"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavirin mesleki faaliyeti sırasındaki aşağıdaki davranışlarından hangisi Türk Ticaret Kanunu\u0027na göre haksız rekabet hali oluşturmaz?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-11","verilenler":[],"dayanak":"Türk Ticaret Kanunu (6102 s.K.) m.55/1-a,b,c; Türk Borçlar Kanunu (6098 s.K.) m.63","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bağımsız denetçi Kerim, meslek örgütünün kendisine verdiği yetkiyle bir anonim şirketin 2023 mali tablolarını inceliyor, 45.000 TL ücret karşılığı rapor düzenliyor.","anlatim":"Kerim\u0027in yaptığı iş, bir yetki belgesine dayanıyor. Şimdi bu tek olayı beş farklı iddiaya çeviriyoruz.","doldur":[]},{"formul":"Ne yapacağız: Bir davranış ancak dürüstlük kuralına aykırıysa haksız rekabet sayılır; kanunun veya yetkili makamın verdiği yetki sınırında kalan iş hukuka aykırı olmaz.","anlatim":"Kerim\u0027in denetim raporu bu yüzden haksız rekabet değil. Şimdi beş ifadeyi Kerim\u0027in olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TTK m.55/1-a-3","karar":"doğru","anlatim":"Kerim burada gerçek olmayan bir paye ile müstesna yetenek zannı uyandırıyor. Kanun bunu açıkça reklam yoluyla haksız rekabet sayar.","formul":"Şık A: Kerim, elde etmediği bir \u0027uzman denetçi\u0027 unvanına sahipmiş gibi davranarak müşteriye üstün yetenek izlenimi verse, bu haksız rekabet olur mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.63","karar":"yanlış","anlatim":"Kerim burada yetkili makamın verdiği sınırlar içinde kalıyor, dışına çıkmıyor. Kanunun verdiği yetkinin sınırları içindeki fiil hukuka aykırı sayılmaz.","formul":"Şık B: Kerim, meslek örgütünün tanıdığı denetim yetkisiyle mali tabloları incelemiş; bu haksız rekabet olur mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TTK m.55/1-a-2","karar":"doğru","anlatim":"Kerim burada rakibini yanlış bilgiyle kötülüyor ve müşteri çekiyor. Kanun bu tür kötülemeyi açıkça haksız rekabet sayar.","formul":"Şık C: Kerim, rakip meslektaşı hakkında gerçeğe aykırı sözlerle müşterileri kendine çekmeye çalışsa, bu haksız rekabet olur mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TTK m.55/1-c-1","karar":"doğru","anlatim":"Kerim burada kendisine güvenle bırakılan bir iş ürününü izinsiz kullanıyor. Kanun bunu iş ürününden yetkisiz yararlanma sayar.","formul":"Şık D: Kerim, emanet edilen bir teklif dosyasını yetkisiz kullanıp kendi teklifini hazırlasa, bu haksız rekabet olur mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TTK m.55/1-b-3","karar":"doğru","anlatim":"Kerim burada üçüncü kişiyi sözleşmesine aykırı davranmaya kendisi yöneltiyor. Kanun bu yöneltmeyi ayrı bir haksız rekabet hali sayar.","formul":"Şık E: Kerim, bir meslektaşının çalışanını işverenin sırlarını ifşaya yöneltip bilgi alsa, bu haksız rekabet olur mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✓ D ✓ E ✓","anlatim":"Beş davranıştan sadece yetki sınırları içinde kalan denetim faaliyeti haksız rekabet değildir. Kendine hep şunu sor: bu davranış bana tanınmış bir yetkinin sınırları içinde mi kaldı, yoksa dürüstlük kuralını mı çiğnedi?","doldur":[]}],"anahtar":[{"ornek":"sınırları","kok":"sınırl"},{"ornek":"rekabet","kok":"rekabe"},{"ornek":"haksız","kok":"haksız"},{"ornek":"içinde","kok":"içinde"},{"ornek":"burada","kok":"burada"},{"ornek":"aykırı","kok":"aykırı"}],"konuGiris":{"harita":"Ne zaman test edilir: bir meslek mensubunun somut davranışı örnek olay şeklinde verildiğinde test edilir. Nasıl ölçülür: davranışın Türk Ticaret Kanunu m.55\u0027teki haksız rekabet hâllerinden birine uyup uymadığına bakılarak ölçülür. Nasıl kaydedilir: doğru cevap, kanundaki sayılan hâllere uymayan tek seçenek olarak işaretlenir.","desen":"Soru, m.55\u0027te sayılan haksız rekabet hâllerini örnek davranışlar hâlinde sıralar ve öğrenciden bunlardan HANGİSİNİN haksız rekabet OLMADIĞINI bulmasını ister. Tuzak, doğru ve gerçeğe dayalı, yanıltıcı olmayan bir açıklamayı haksız rekabet zannetmektir. Bu soru m.55/1-a bendinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Dürüstlük kuralına aykırı reklam, kötüleme veya yanıltma davranışı","ad":"Haksız rekabet","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ticari ilişkilerde doğru, gerçek ve yanıltmayan davranış standardı","ad":"Dürüstlük kuralı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Rakibi veya işini yanlış, yanıltıcı biçimde küçük düşürme davranışı","ad":"Kötüleme","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Sahip olunmayan unvan veya ödülü varmış gibi kullanma davranışı","ad":"Meslek adı/sembolü suistimali","kim":"meslek kuruluşu düzenler"}],"sinavda":"Meslek mensubunun çeşitli davranışları verilir ve bunlardan haksız rekabet oluşturmayan seçilmesi istenir.","panel_ornek":"Arkadaşın 20.000 liraya ikinci el bir bisiklet satıyor ve ilanında \u0027piyasadaki tüm bisikletler kötü kalite\u0027 diye yazıyor. Bu, rakibi kötüleyip kendi ürününü öne çıkarmak; gerçek durumu doğru anlatan bir ilan ise haksız rekabet olmaz.","ornek":"Arkadaşın 20.000 liraya ikinci el bir bisiklet satıyor ve ilanında \u0027piyasadaki tüm bisikletler kötü kalite\u0027 diye yazıyor. Bu, rakibi kötüleyip kendi ürününü öne çıkarmak; gerçek durumu doğru anlatan bir ilan ise haksız rekabet olmaz.","yontemler":"Her seçenek \u0027yanıltıcı mı, gerçek dışı mı, kötüleyici mi\u0027 sorusuyla test edilir; doğru ve nesnel bilgi veren davranış haksız rekabet sayılmaz.","nedir":"Bu ilke, meslek mensubunun rekabette dürüstlük kuralına uyup uymadığını belirler. Sınav, hangi davranışın haksız rekabet sayılıp hangisinin sayılmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Kötüleme Tuzağı","metin":"Rakibi kötülemenin yalnız reklamda değil, doğrudan sözle yapılınca haksız rekabet sayılmayacağını düşünürsün. Doğrusu: Gerçeğe aykırı ve kötüleyici açıklamalar Türk Ticaret Kanununun 55 inci maddesi kapsamında haksız rekabettir."},"E":{"ad":"Sır İfşasına Yöneltme Tuzağı","metin":"Bilgiyi doğrudan sen değil, üçüncü kişi işçi ifşa ettiği için sorumluluğun sana geçmeyeceğini sanırsın. Doğrusu: İşçiyi iş sırrını ifşaya yöneltmek, kanunda ayrıca düzenlenmiş bağımsız bir haksız rekabet hâlidir."},"D":{"ad":"İş Ürünü Tuzağı","metin":"Emanet edilen belgeden yararlanmayı meslek serbestisi sanırsın. Doğrusu: Emanet edilmiş bir teklif veya plandan yetkisiz yararlanma, kanunda ayrıca sayılan bir haksız rekabet hâlidir."},"A":{"ad":"Paye/Unvan Taslama Tuzağı","metin":"Almadığı bir derece veya paye sahibiymiş gibi davranmayı meslek içi doğal bir tanıtım sanırsın. Doğrusu: Bu davranış Türk Ticaret Kanununun 55 inci maddesinde açıkça haksız rekabet hali sayılmıştır."}},"celdiriciYol":null,"hap":"Kanunun veya yetkili makamın tanıdığı yetkinin sınırları içinde kalan fiil, zarar doğursa da hukuka aykırı sayılmaz ve haksız rekabet oluşturmaz.","teshis":{"C":{"gercek":"Türk Ticaret Kanununun 55 inci maddesi gerçeğe aykırı, yanıltıcı veya gereksiz kötüleyici her açıklamayı haksız rekabet sayar.","ayirt":"Açıklama gerçeğe uygun ve gerekli mi?","paragraf":"TTK m.55/1-a-2","yanilgi":"Sözlü kötülemenin yazılı reklam kadar ağır sonuç doğurmadığını düşünüyorsun."},"E":{"gercek":"Türk Ticaret Kanununun 55 inci maddesi, işçiyi iş sırrını ifşaya yöneltmeyi bağımsız bir haksız rekabet hali olarak düzenlemiştir.","ayirt":"Üçüncü kişiyi sözleşmesine aykırı davranmaya ben mi yönelttim?","paragraf":"TTK m.55/1-b-3","yanilgi":"Sırrı sen değil işçi ifşa ettiği için sorumluluğun sana geçmeyeceğini sanıyorsun."},"A":{"gercek":"Türk Ticaret Kanununun 55 inci maddesi, sahip olunmayan paye veya diplomaya sahipmiş gibi davranmayı dürüstlük kuralına aykırı reklam sayar.","ayirt":"Bu davranış gerçek bir yeterliliğe mi dayanıyor, yoksa izlenim mi yaratıyor?","paragraf":"TTK m.55/1-a-3","yanilgi":"Unvan taslamayı zararsız bir tanıtım yöntemi sanıyorsun."},"D":{"gercek":"Türk Ticaret Kanununun 55 inci maddesi emanet edilen iş ürününden yetkisiz yararlanmayı ayrıca haksız rekabet hali saymıştır.","ayirt":"Bu bilgiye sahip olma yetkim var mıydı, yoksa emanet mi edilmişti?","paragraf":"TTK m.55/1-c-1","yanilgi":"Elindeki belgeyi değerlendirmeyi mesleki beceri sanıyorsun."},"B":{"gercek":"Türk Borçlar Kanununun 63 üncü maddesine göre kanunun veya yetkili makamın verdiği yetkinin sınırları içindeki fiil hukuka aykırı sayılmaz.","ayirt":"Bu davranış bana tanınmış bir yetkinin sınırları içinde mi kaldı?","paragraf":"TBK m.63","yanilgi":"Yetkili bir denetim faaliyetini bile haksız rekabet zannedip bu şıkkı eleyebilirsin."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"Etik İlkeler Yönetmeliği Eki madde 6\u0027ya göre dürüstlük ilkesi meslek mensubuna mesleki ilişkilerinde doğru ve güvenilir olma yükümlülüğü getirir; adil davranmayı ve açık sözlülüğü ifade eder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Tanım sorularında cümledeki anahtar kelimeyi (doğruluk-güvenilirlik) yakala, ilkeyi ona göre eşleştir; benzer başlıklara aldanma.","konu":"mesleki davranış ilkesi","tablo":{"satirlar":[["A) Dürüstlük","m.6","doğru ifade"],["B) Tarafsızlık","m.8","YANLIŞ ifade"],["C) Meslekî Yeterlilik ve Özen","Yönetmelik Eki DÖRDÜNCÜ BÖLÜM başlığı","YANLIŞ ifade"],["D) Gizlilik","Etik İlkeler genel sınıflandırması","YANLIŞ ifade"],["E) Mesleğe Uygun Davranış Sergileme","Etik İlkeler genel sınıflandırması","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Meslekî Yeterlilik ve Özen","E":"Mesleğe Uygun Davranış Sergileme","A":"Dürüstlük","D":"Gizlilik","B":"Tarafsızlık"},"kaynak":{"alinti":"","liste":[{"ad":"TÜRMOB Etik İlkeler Yön. EK bolum 3","metin":"TÜRMOB - Mesleki Faaliyetlerde Uyulacak Etik İlkeler Hakkında Yönetmelik (RG 19.10.2007, Sayı 26675). EK: Etik İlkeler (m.4-9) [BİRİNCİ KISIM: Tüm Meslek Mensuplarının Uyacakları Temel Etik İlkeleri / BİRİNCİ BÖLÜM: İlkelerin Genel Uygulanış Biçimi Temel] MADDE 4 – (1) Tehditleri ortadan kaldıran veya kabul edilebilir bir düzeye indiren önlemler iki büyük gruba ayrılmaktadır. a) Mevzuat ile oluşturulabilecek önlemler: Bu önlemlere verilebilecek örnekler aşağıda belirtilmiştir: 1) Mesleğe giriş için gerekli eğitim, meslekî eğitim (staj) ve tecrübe gereksinimleri, 2) Sürekli meslekî gelişim gereksinimleri, 3) Kurumsal yönetim gereksinimleri, 4) Meslekî standartlar, 5) Meslekî veya düzenleyici izleme ve disiplin prosedürleri , 6) Meslek mensubu tarafından üretilen rapor, sonuç, iletişim ve bilgilerin yasal yetkili üçüncü bir kurum tarafından dış kontrolden geçirilmesi. b) İş çevresinden sağlanacak önlemler. Etik Çatışmanın Çözümlenmesi MADDE 5 – (1) Meslek mensupları, temel etik ilkelerinin uygulanması sırasında ortaya çıkabilecek uyuşmazlıklardan kaynaklanan çatışmaları bu düzenlemede yer alan temel etik ilkeleri esas alarak çözüme kavuşturmalıdır. Bu etik çatışmaların çözümlenmesi için oluşturulan formel ya da enformel çözüm sürecinde, meslek mensubunun ilgili verileri, çatışma konusu ile ilgili etik sorunları ve etik ilkeleri, yerleşik iç süreçleri ve alternatif hareket biçimlerini dikkate alarak temel etik ilkelerle uygun hareket biçimini belirlemesi gerekecektir. Eğer sorun hala çözümlenemez ise, meslek mensubu firma içindeki veya işveren işletmedeki diğer uygun kişilerde…"},{"ad":"TÜRMOB Etik İlkeler Yön. EK bolum 8","metin":"TÜRMOB - Mesleki Faaliyetlerde Uyulacak Etik İlkeler Hakkında Yönetmelik (RG 19.10.2007, Sayı 26675). EK: Etik İlkeler (m.29-30) [İKİNCİ KISIM: Bağımsız Çalışan Meslek Mensuplarının Uyacakları Etik İlkeler / BİRİNCİ BÖLÜM: Giriş] MADDE 29 – İş çevresinde firma çapında alınabilecek önlemler şunlar olabilir: a) Firmanın temel etik ilkelere uyumun önemini vurgulamak. b) Güvence sağlama sözleşmesi ekibinin kamu çıkarına uygun hareket edeceği yönünde bir beklentinin oluşmasını sağlamak. c) Sözleşmelerde kalite kontrolü uygulanması ve izlenmesini sağlayacak politika ve süreçler. ç) Tehditlerin belirlenmesi, bu tehditlerin önem derecesinin değerlendirilmesi, önemsiz olanlar dışındaki tehditleri ortadan kaldıracak veya kabul edilebilir düzeye indirecek önlemlerin belirlenmesi ve uygulanmasına ilişkin belgeye dayalı politikalar. d) Güvence sağlama sözleşmelerini kullanan firmalar için bağımsızlığa yönelik tehditlerin ve bu tehditlerin önem derecesinin belirlenmesi, tehditleri (önemsiz olanlar dışındaki) yok edecek veya kabul edilebilir düzeye indirecek önlemlerin değerlendirilmesi ve uygulanmasına yönelik belgeye dayalı bağımsızlık politikaları. e) Temel etik ilkelere uyum gerektiren belgeye dayalı iç politika ve süreçler. f) Firma veya sözleşme ekibi üyeleri ve müşteriler arasındaki çıkar ilişkilerinin belirlenmesini sağlayacak politika ve süreçler. g) Tek bir müşteriden elde edilen gelirin izlenmesi ve gerektiğinde bu gelire olan bağımlılığın yönetilmesini sağlayacak politika ve süreçler. ğ) Sözleşme ekibinin üyesi olmayan kişilerin sözleşmenin sonucunu uygunsuz bir biçimde etkile…"}],"hakem":"TÜRMOB Etik İlkeler Yönetmeliği Eki Madde 6(1)\u0027de dürüstlük ilkesi, meslek mensuplarına mesleki ilişkilerinde doğru ve güvenilir olma yükümlülüğü getirdiği ve adil davranma ile açık sözlülüğü ifade ettiği açıkça belirtilmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Meslekî Yeterlilik ve Özen ilkesi bilgi ve beceriyi güncel tutmayı düzenler; doğruluk ve açık sözlülük tanımını taşımaz.","E":"Mesleğe Uygun Davranış Sergileme ilkesi mesleğin itibarını zedeleyecek davranışlardan kaçınmayı düzenler; doğruluk ve güvenilirlik tanımını içermez.","D":"Gizlilik ilkesi edinilen bilgilerin ifşa edilmemesini düzenler; açık sözlülüğün karşısında sır saklamayı esas alır.","B":"Tarafsızlık ilkesi yanlı olmamayı ve üçüncü kişi baskısına ödün vermemeyi düzenler; doğruluk ve açık sözlülük unsurlarını içermez."},"dogru":"Dürüstlük ilkesi, meslek mensuplarına mesleki ilişkilerinde doğru ve güvenilir olmayı yükler. Bu ilke aynı zamanda adil davranmayı ve açık sözlülüğü ifade eder.","sinav":"TÜRMOB Mesleki Faaliyetlerde Uyulacak Etik İlkeler Hakkında Yönetmelik Eki 6. madde","kavramlar":[{"kaynak":"TÜRMOB Etik İlkeler Yön. EK bolum 3","tanim":"Meslek mensuplarına mesleki ilişkilerinde doğru ve güvenilir olma yükümlülüğü getiren; adil davranmayı ve açık sözlülüğü ifade eden temel etik ilke.","ad":"Dürüstlük"},{"kaynak":"TÜRMOB Etik İlkeler Yön. EK bolum 3","tanim":"Meslek mensuplarına yanlı olmama, çıkar çatışmasından uzak durma ve üçüncü kişilerin uygunsuz baskısına ödün vermeme sorumluluğunu getiren etik ilke.","ad":"Tarafsızlık"},{"kaynak":"TÜRMOB Etik İlkeler Yön. EK bolum 3","tanim":"Meslek mensuplarının bilgi ve becerilerini güncel tutmasını gerektiren etik ilke.","ad":"Meslekî Yeterlilik ve Özen"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Mesleki ilişkilerde doğru ve güvenilir olma yükümlülüğü getiren; adil davranmayı ve açık sözlülüğü ifade eden temel etik ilke aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-23","verilenler":[],"dayanak":"Etik İlkeler Hakkında Yönetmelik Eki, madde 6 (Dürüstlük)","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bir bağımsız denetçi, müşteri işletmenin 12.03.2024 tarihli stok sayım raporunda 40.000 TL\u0027lik farkı fark ediyor ve bunu rapora doğru yansıtıyor, tutarı gizlemiyor.","anlatim":"Denetçi burada rakamı olduğu gibi yazıyor, yanıltıcı ifade kullanmıyor. Şimdi bu tek olayı beş ilkeyle tek tek test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Etik İlkeler Yönetmeliği Eki\u0027ndeki beş temel ilkeden hangisi \u0027doğru-güvenilir olma, adil davranma, açık sözlülük\u0027 tanımına uyuyor, bunu bu 40.000 TL\u0027lik olayda test edeceğiz.","anlatim":"Kural tek: madde 6\u0027daki tanım hangi ilkeye aitse cevap odur. Şimdi A\u0027dan E\u0027ye beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.6","karar":"doğru","anlatim":"Evet, denetçi burada doğru ve güvenilir davranıyor, adil ve açık sözlü. Madde 6 tam bunu tanımlıyor.","formul":"Şık A: Denetçi 40.000 TL\u0027lik farkı gizlemeden, adil ve açık biçimde rapora yazıyor; bu davranış \u0027dürüstlük\u0027 ilkesiyle mi açıklanır?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.8","karar":"yanlış","anlatim":"Bu davranış çıkar çatışması ve baskıya direnmekle ilgili, madde 8 tarafsızlığı tanımlıyor. Ama soru bize doğruluk-güvenilirlik tanımını soruyor, o tarafsızlık değil.","formul":"Şık B: Aynı denetçiye müşteri firma sahibi \u0027bu farkı küçük göster, sana ekstra ücret veririm\u0027 diyor ve denetçi reddediyor; bu \u0027tarafsızlık\u0027 mıdır?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Yönetmelik Eki DÖRDÜNCÜ BÖLÜM başlığı","karar":"yanlış","anlatim":"Bu bölüm bilgi-beceri-özenle ilgilidir, doğruluk ve açık sözlülük tanımını içermez. Olayımızdaki 40.000 TL\u0027yi gizlememe davranışı bu başlığa ait değil.","formul":"Şık C: Denetçi stok sayımını yaparken gerekli bilgi ve beceriyi güncel tutuyor; bu \u0027Meslekî Yeterlilik ve Özen\u0027 midir?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Etik İlkeler genel sınıflandırması","karar":"yanlış","anlatim":"Gizlilik, bilginin yetkisiz açıklanmamasıyla ilgilidir, açık sözlülükle değil. Olayımızdaki \u0027farkı gizlememe\u0027 davranışı gizlilik ilkesiyle karışmasın.","formul":"Şık D: Denetçi müşterinin ticari sırlarını üçüncü kişilere açıklamıyor; bu \u0027gizlilik\u0027 midir?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Etik İlkeler genel sınıflandırması","karar":"yanlış","anlatim":"Bu ilke itibar ve saygınlıkla ilgilidir, doğruluk-güvenilirlik tanımını taşımaz. Olayımızdaki temel davranış yine dürüstlüğe aittir.","formul":"Şık E: Denetçi mesleğin itibarını zedeleyecek bir davranıştan kaçınıyor; bu \u0027Mesleğe Uygun Davranış Sergileme\u0027 midir?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Doğru-güvenilir olma, adil davranma ve açık sözlülük üçlüsü sadece dürüstlük ilkesinde birlikte tanımlanır. Kendine sor: bu cümle çıkar çatışmasından mı yoksa doğruluk-güvenilirlikten mi bahsediyor?","doldur":[]}],"anahtar":[{"ornek":"güvenilir","kok":"güveni"},{"ornek":"davranmayı","kok":"davran"},{"ornek":"ilkesi","kok":"ilkesi"},{"ornek":"doğruluk","kok":"doğrul"},{"ornek":"dürüstlük","kok":"dürüst"},{"ornek":"sözlülüğü","kok":"sözlül"}],"konuGiris":{"harita":"Ne zaman test edilir: Sınavda bir ilke tanımı verilip hangi ilkeye ait olduğu sorulduğunda test edilir. Nasıl ölçülür: Tanımdaki anahtar kelimeler (doğruluk, tarafsızlık, yeterlilik gibi) ile ilke adı eşleştirilerek ölçülür. Nasıl kaydedilir: Doğru ilke adının seçilmesiyle kaydedilir.","desen":"Sınav genellikle bir ilkenin madde metnindeki tanımını aynen verip hangi ilke olduğunu sorar; tuzak, benzer kelimelerle (adil-tarafsız gibi) diğer ilkelerle karıştırmaktır. Doğruluk ve açık sözlülük ifadesi sadece Dürüstlük ilkesine (m.6) aittir, Tarafsızlık ilkesiyle (m.8) karıştırılmamalıdır. Bu soru TÜRMOB Etik İlkeler Yönetmeliği EK madde 6\u0027dan geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Mesleki ilişkilerde doğru, güvenilir, adil ve açık sözlü olma yükümlülüğü","ad":"Dürüstlük ilkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Çıkar çatışması veya baskı nedeniyle meslekî kararlardan ödün vermeme sorumluluğu","ad":"Tarafsızlık ilkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Güncel bilgi ve beceriyle standartlara uygun özenli hizmet verme yükümlülüğü","ad":"Meslekî yeterlilik ve özen","kim":"meslek kuruluğu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Uyuşmazlıkları temel etik ilkeleri esas alarak çözme süreci","ad":"Etik çatışmanın çözümü","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soruda bir etik ilkenin tanımı cümle halinde verilir ve bu tanıma karşılık gelen ilkenin adı istenir.","panel_ornek":"İkinci el bir bisiklet satarken alıcıya bisikletin gerçek durumunu, kaç kilometre kullanıldığını dürüstçe söylemen gerekir; bu, satıcı olarak açık sözlü davranman demektir. 3 yıl önce aldığın bisikleti 2 kere tamir ettirdiğini gizlemezsin. İşte bu \u0027doğru ve güvenilir olma\u0027 örneğidir.","ornek":"İkinci el bir bisiklet satarken alıcıya bisikletin gerçek durumunu, kaç kilometre kullanıldığını dürüstçe söylemen gerekir; bu, satıcı olarak açık sözlü davranman demektir. 3 yıl önce aldığın bisikleti 2 kere tamir ettirdiğini gizlemezsin. İşte bu \u0027doğru ve güvenilir olma\u0027 örneğidir.","yontemler":"Tanımdaki anahtar kelimeyi yakala: \u0027doğru-güvenilir-adil-açık sözlü\u0027 geçiyorsa cevap Dürüstlük\u0027tür, başka kelime aramaya gerek yoktur.","nedir":"Bu konu meslek mensuplarının uyması gereken temel etik ilkeleri tanımlar. Sınav, hangi ilkenin hangi davranışı ifade ettiğini eşleştirme becerini ölçer."},"olay":"","tuzak":{"C":{"ad":"Meslekî Yeterlilik Tuzağı","metin":"Öğrenci ilke başlığını mesleki bilgi ve beceri düzeyiyle ilgili sanır. Doğrusu: Meslekî Yeterlilik ve Özen ilkesi bilgi ve beceriyi güncel tutmayı düzenler, doğruluk-açık sözlülük tanımını taşımaz."},"E":{"ad":"Mesleğe Uygun Davranış Tuzağı","metin":"Öğrenci mesleğin itibarını koruma ile dürüstlüğü aynı ilke sanır. Doğrusu: Mesleğe Uygun Davranış Sergileme ilkesi mesleğin itibarını zedeleyecek davranışlardan kaçınmayı düzenler, doğruluk-güvenilirlik tanımını içermez."},"D":{"ad":"Gizlilik Tuzağı","metin":"Öğrenci bilgiyle ilgili her ilkeyi gizlilikle karıştırır. Doğrusu: Gizlilik ilkesi edinilen bilgilerin ifşa edilmemesini düzenler, açık sözlülüğü değil sır saklamayı esas alır."},"B":{"ad":"Tarafsızlık Tuzağı","metin":"Öğrenci \u0027adil davranma\u0027 ifadesini görünce çıkar çatışmasından uzak durmayı düzenleyen tarafsızlık ilkesini seçer. Doğrusu: Tarafsızlık madde 8\u0027de yanlı olmama ve üçüncü kişi baskısına ödün vermemeyi düzenler, doğruluk-güvenilirlik unsurunu içermez."}},"celdiriciYol":{},"hap":"Dürüstlük ilkesi: doğru, güvenilir, adil ve açık sözlü olma yükümlülüğüdür.","teshis":{"C":{"gercek":"Meslekî Yeterlilik ve Özen bilgi, beceri ve özenin sürekli güncel tutulmasıyla ilgilidir, dürüstlüğün konusu değildir.","ayirt":"Tanım bilgi-beceriden mi, doğruluk-güvenilirlikten mi söz ediyor?","paragraf":"Yönetmelik Eki DÖRDÜNCÜ BÖLÜM başlığı","yanilgi":"İlke isminde \u0027yeterlilik\u0027 geçmese de her mesleki nitelik ilkesini bu başlığa yazarsın."},"E":{"gercek":"Mesleğe Uygun Davranış Sergileme mesleğin itibarını zedeleyecek davranışlardan kaçınmayı düzenler, doğruluk tanımını içermez.","ayirt":"Cümle itibarı korumaktan mı, doğru-güvenilir olmaktan mı bahsediyor?","paragraf":"Etik İlkeler genel sınıflandırması","yanilgi":"İtibar ve saygınlık kelimelerini duyunca doğrudan bu başlığı seçersin."},"A":{"gercek":"Madde 6 dürüstlüğü doğruluk, güvenilirlik, adil davranma ve açık sözlülük olarak birlikte tanımlar.","ayirt":"Tanımda geçen üç unsur (doğruluk-adillik-açık sözlülük) birlikte hangi başlığa aitti?","paragraf":"m.6","yanilgi":"Bu şıkkı eleyen öğrenci dürüstlüğü yalnız \u0027yalan söylememe\u0027 sanıp adil davranma ve açık sözlülük unsurlarını gözden kaçırır."},"D":{"gercek":"Gizlilik edinilen bilgilerin yetkisiz açıklanmamasını düzenler; açık sözlülükle ilgili değildir.","ayirt":"Cümle bilgiyi saklamaktan mı, açık ve dürüst davranmaktan mı bahsediyor?","paragraf":"Etik İlkeler genel sınıflandırması","yanilgi":"Bilgiyle ilgili her cümleyi otomatik olarak gizlilik ilkesine bağlarsın."},"B":{"gercek":"Madde 8 tarafsızlığı yanlı olmama, çıkar çatışması ve üçüncü kişi baskısına ödün vermeme olarak tanımlar; doğruluk-güvenilirlik unsuru yoktur.","ayirt":"Bu ilke çıkar çatışmasından mı, yoksa doğru-güvenilir olmaktan mı bahsediyor?","paragraf":"m.8","yanilgi":"Adil davranma kelimesini görünce doğrudan tarafsızlığı işaretlersin, oysa tarafsızlık çıkar çatışması ve baskıyla ilgilidir."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 127"},"kural":"Adam çalıştıran, seçim, talimat ve gözetim-denetimde gerekli özeni gösterdiğini ispat ederse sorumluluktan kurtulur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 127","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İspat yükünün kime ait olduğuna bak: kurtuluş kanıtını adam çalıştıran sunar, zarar gören değil.","konu":"özen sorumluluğu","tablo":{"satirlar":[["A) Çalışan, işin görülmesi sırasında verdiği zarardan bizza…","TBK m.66/1","YANLIŞ ifade"],["B) Adam çalıştıran, çalışanını seçerken, talimat verirken, …","TBK m.66/2","doğru ifade"],["C) Zarar gören, adam çalıştıranın seçim, talimat ve gözetim…","TBK m.66/2","YANLIŞ ifade"],["D) Adam çalıştıranın sorumluluğu yalnızca çalışanın kasıtlı…","TBK m.66/1","YANLIŞ ifade"],["E) Adam çalıştıran, çalışanının işin görülmesiyle hiçbir il…","TBK m.66/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Zarar gören, adam çalıştıranın seçim, talimat ve gözetimde özensiz davrandığını ispat etmedikçe adam çalıştırandan tazminat isteyemez.","E":"Adam çalıştıran, çalışanının işin görülmesiyle hiçbir ilgisi bulunmayan kişisel eylemlerinden doğan zararlardan da sorumludur.","A":"Çalışan, işin görülmesi sırasında verdiği zarardan bizzat ve öncelikli olarak sorumludur; adam çalıştıranın sorumluluğu ancak çalışana rücu edilemediğinde doğar.","D":"Adam çalıştıranın sorumluluğu yalnızca çalışanın kasıtlı davranışıyla verdiği zararları kapsar, ihmalden doğan zararları kapsamaz.","B":"Adam çalıştıran, çalışanını seçerken, talimat verirken, gözetim ve denetimde bulunurken gerekli özeni gösterdiğini ispat ederse sorumluluktan kurtulur."},"kaynak":{"alinti":"","liste":[{"ad":"TBK (6098 s.K.) m.66","metin":"MADDE 66- Adam çalıştıran, çalışanın, kendisine verilen işin yapılması sırasında başkalarına verdiği zararı gidermekle yükümlüdür. Adam çalıştıran, çalışanını seçerken, işiyle ilgili talimat verirken, gözetim ve denetimde bulunurken, zararın doğmasını engellemek için gerekli özeni gösterdiğini ispat ederse, sorumlu olmaz. Bir işletmede adam çalıştıran, işletmenin çalışma düzeninin zararın doğmasını önlemeye elverişli olduğunu ispat etmedikçe, o işletmenin faaliyetleri dolayısıyla sebep olunan zararı gidermekle yükümlüdür. Adam çalıştıran, ödediği tazminat için, zarar veren çalışana, ancak onun bizzat sorumlu olduğu ölçüde rücu hakkına sahiptir. 2. Hayvan bulunduranın sorumluluğu a. Giderim yükümlülüğü"},{"ad":"TTK (6102 s.K.) m.199 [2/2]","metin":"(4) Hâkim şirketin her yönetim kurulu üyesi, yönetim kurulu başkanından; bağlı şirketlerin finansal ve malvarlığıyla ilgili durumları ile üç aylık hesap sonuçları, hâkim şirketin bağlı şirketlerle, bağlı şirketlerin birbirleriyle, hâkim ve bağlı şirketlerin pay sahipleri ve bunların yakınlarıyla ilişkileri; yaptıkları işlemler ve bunların sonuç ve etkileri hakkında, özenli, gerçeği aynen ve dürüstçe yansıtan hesap verme ilkelerine göre düzenlenmiş bir rapor hazırlattırıp yönetim kuruluna sunmasını ve bunun sonuç kısmının yıllık rapor ile denetleme raporuna eklenmesini isteyebilir. Bağlı şirketler, red için yoruma yer bırakmayacak açıklıkta bir haklı sebebin varlığını ispat edemedikleri takdirde, bu raporun hazırlanması için gerekli olan bilgi ve belgeleri hâkim şirketin bu işle görevlendirilen uzmanlarına vermekle yükümlüdürler. İstemde bulunan yönetim kurulu üyesi, bunu bir üçüncü kişinin yararlanması amacıyla yapmışsa bunun sonuçlarından sorumlu olur. VI - Bağlı şirketler hakkında bilgi alma"}],"hakem":"Doğru sık (B), TBK m.66\u0027da açıkça yer alan adam çalıştıranın kurtuluş kanıtı kuralını (seçim, talimat, gözetim-denetimde gerekli özeni göstermek) doğru şekilde ifade etmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Yanlış çünkü ispat yükü zarar görene değil, adam çalıştırana aittir; adam çalıştıran özeni gösterdiğini kanıtlarsa sorumlu olmaz.","E":"Yanlış çünkü sorumluluk işle ilgisi olmayan kişisel eylemleride kapsamaz; yalnızca işin görülmesi sırasında verilen zararla sınırlıdır.","D":"Yanlış çünkü sorumluluk sadece kasıtlı zararla sınırlı değildir; işin yapılması sırasında verilen her türlü zarar kapsamına girer.","A":"Yanlış çünkü sorumluluk sırası yaratır; kanun çalışanın zararından adam çalıştıranı doğrudan sorumlu tutar, rücu sırası yoktur."},"dogru":"Büro elemanı müşteriye zarar verdiğinde, muhasebeci mali müşavir bu zarardan doğrudan sorumludur. Fakat seçim, talimat ve gözetimde gerekli özeni gösterdiğini kanıtlarsa sorumluluktan kurtulur.","sinav":"Türk Borçlar Kanunu 66. madde","kavramlar":[{"kaynak":"Türk Borçlar Kanunu 66. madde","tanim":"çalışanının işin görülmesi sırasında başkalarına verdiği zarardan sorumlu olan ve bu sorumluluğundan seçim, talimat, gözetim ve denetimde gerekli özeni gösterdiğini ispat ederek kurtulabilen kişi veya kuruluş.","ad":"adam çalıştıran"},{"kaynak":"Türk Borçlar Kanunu 66. madde","tanim":"çalışana verilen işin yapılması esnasında; bu süre içinde çalışanın başkalarına verdiği zararlar adam çalıştıranın sorumluluğuna girer.","ad":"işin görülmesi sırasında"},{"kaynak":"Türk Borçlar Kanunu 66. madde","tanim":"adam çalıştıranın çalışanını seçerken, talimat verirken ve gözetim-denetimde bulunurken zararın doğmasını engellemek için alması gereken tedbirler; bu özeni gösterdiğini ispat ederse sorumluluktan kurtulur.","ad":"gerekli özeni göstermek"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavirin yanında çalıştırdığı büro elemanı, işin görülmesi sırasında bir müşteriye zarar vermiştir. 6098 sayılı Türk Borçlar Kanunu\u0027na göre adam çalıştıranın sorumluluğu bakımından aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-09","verilenler":[],"dayanak":"6098 sayılı Türk Borçlar Kanunu m.66","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bir mali müşavirlik bürosunda çalışan stajyer, 15 Mart\u0027ta bir müşterinin beyannamesini yanlış düzenleyip 40.000 TL vergi cezası doğurdu.","anlatim":"Büro sahibi patron, stajyeri işe alırken referans kontrolü yapmış, ona yazılı talimat vermiş ve haftalık denetim yapmıştı. Müşteri zararının tazminini patrondan istiyor, şimdi beş iddiayı bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu madde 66\u0027ya göre patron, çalışanı seçerken, talimat verirken ve denetlerken gerekli özeni gösterdiğini ispat ederse 40.000 TL\u0027den kurtulur.","anlatim":"Kural tek: sorumluluk doğrudan patronundur ama kurtuluş kanıtı vardır. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.66/1","karar":"yanlış","anlatim":"Olayda müşteri doğrudan patrona başvurabilir, stajyere önce gitme zorunluluğu yok. Patronun sorumluluğu ikincil değil, doğrudandır.","formul":"Şık A: müşteri \u0027önce stajyerden isteyeyim, patrona sonra giderim\u0027 diyor, bu doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.66/2","karar":"doğru","anlatim":"Olayda patron tam da bu üç unsuru ispatlarsa 40.000 TL\u0027den kurtulur. Kanun bu kurtuluş kanıtını tanır.","formul":"Şık B: patron \u0027ben referans kontrolü yaptım, talimat verdim, denetledim, bu yüzden ödemem\u0027 diyor, haklı mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.66/2","karar":"yanlış","anlatim":"Olayda müşteri sadece zararı ve nedensellik bağını gösterir, özenin varlığını ispat yükü patrona aittir. Bu ifade ispat yükünü ters çevirir, yanlıştır.","formul":"Şık C: müşteri \u0027patronun özensiz davrandığını ben ispatlamalıyım\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.66/1","karar":"yanlış","anlatim":"Olayda hata bir ihmal, kasıt yok ama madde metni kusur derecesine bakmaz. İhmalden doğan zarar da kapsam içindedir.","formul":"Şık D: patron \u0027stajyer kasıtlı yapmadı, ihmaldi, ben sorumlu değilim\u0027 diyebilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.66/1","karar":"yanlış","anlatim":"Olayda bu zarar işin görülmesiyle ilgili değil, büro dışı kişisel bir eylem. Patron bundan sorumlu tutulamaz.","formul":"Şık E: stajyer aynı akşam kendi arabasıyla kaza yapsa, patron bundan da mı sorumlu olur?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru olan, patronun seçim-talimat-gözetimde özen gösterdiğini ispatlarsa kurtulabileceğidir. Kendine hep şunu sor: burada özeni ispat etme yükü kimde?","doldur":[]}],"anahtar":[{"ornek":"patron","kok":"patron"},{"ornek":"olayda","kok":"olayda"},{"ornek":"kurtulur","kok":"kurtul"},{"ornek":"sorumluluktan","kok":"soruml"},{"ornek":"gösterdiğini","kok":"göster"},{"ornek":"talimat","kok":"talima"}],"konuGiris":{"harita":"Ne zaman sorumluluk doğar: çalışan, kendisine verilen işi görürken üçüncü kişiye zarar verdiğinde. Nasıl kurtulunur: adam çalıştıran seçim, talimat ve gözetimde gerekli özeni gösterdiğini ispatlarsa sorumlu olmaz. Nasıl geri alınır: adam çalıştıran ödediği tazminatı, ancak çalışanın bizzat kusurlu olduğu ölçüde ondan rücuen isteyebilir.","desen":"Soru, adam çalıştıranın kusursuz sorumluluk mu yoksa kusur sorumluluğu mu taşıdığı karıştırılarak kurulur; oysa kanun ispatla kurtulma imkânı tanır, mutlak sorumluluk değildir. Tuzak, \u0027her hâlükârda sorumludur\u0027 ifadesiyle özen ispatının yok sayılmasıdır. Bu soru Türk Borçlar Kanunu m.66 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"başkasını kendi işinde çalıştıran ve onun fiillerinden sorumlu tutulan kişi","ad":"adam çalıştıran","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"seçim, talimat, gözetimde gerekli özenin gösterildiğinin ispatı","ad":"kurtuluş kanıtı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"ödenen tazminatın çalışanın kusuru ölçüsünde geri istenmesi hakkı","ad":"rücu hakkı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işletme düzeninin zararı önlemeye elverişli olduğunun ispatı yükümlülüğü","ad":"işletme sorumluluğu","kim":"kanun sabitler"}],"sinavda":"Somut bir olay verilip adam çalıştıranın hangi şartla sorumluluktan kurtulabileceği sorulur.","panel_ornek":"Bir kuaför dükkânı sahibi yeni çırağını işe alırken referans kontrolü yapmamış ve çırak makası müşteriye batırmış. Sahibi \u0027ben seçerken özen gösterdim\u0027 diyemiyorsa 15.000 TL tazminattan sorumlu olur. Bu, çalışanın hatasının işvereni de bağlaması demektir.","ornek":"Bir kuaför dükkânı sahibi yeni çırağını işe alırken referans kontrolü yapmamış ve çırak makası müşteriye batırmış. Sahibi \u0027ben seçerken özen gösterdim\u0027 diyemiyorsa 15.000 TL tazminattan sorumlu olur. Bu, çalışanın hatasının işvereni de bağlaması demektir.","yontemler":"Metindeki \u0027seçerken, talimat verirken, gözetim ve denetimde özen ispatı\u0027 üçlüsü ezbere bilinmeli; bu ispat yoksa sorumluluk otomatik doğar.","nedir":"Adam çalıştıranın sorumluluğu, bir işverenin çalıştırdığı kişinin işi görürken verdiği zarardan hangi şartlarda sorumlu tutulacağını düzenler. Sınav, seçim-talimat-gözetim özeninin gösterildiğinin ispatı hâlinde sorumluluğun kalkıp kalkmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"İspat Yükü Ters Çevirme Tuzağı","metin":"Öğrenci ispat yükünü zarar görene yükler. Doğrusu: Türk Borçlar Kanununun 66 ncı maddesine göre özenin gösterildiğini ispat yükü adam çalıştırana aittir, zarar görene değil."},"E":{"ad":"Kapsam Genişletme Tuzağı","metin":"Öğrenci işle ilgisi olmayan kişisel eylemleri de kapsama sokar. Doğrusu: Sorumluluk yalnızca işin görülmesi sırasında verilen zararla sınırlıdır, kişisel eylemler kapsam dışıdır."},"D":{"ad":"Kusur Derecesi Tuzağı","metin":"Öğrenci sorumluluğu yalnızca kasıtlı zararla sınırlandırır. Doğrusu: Madde, çalışanın işin yapılması sırasında verdiği her zararı kapsar; kast şartı aranmaz."},"A":{"ad":"Rücu Sırası Tuzağı","metin":"Öğrenci sorumluluğun önce çalışana, ancak tahsil edilemezse adam çalıştırana geçtiğini düşünür. Doğrusu: Türk Borçlar Kanununun 66 nci maddesi adam çalıştıranı doğrudan ve öncelikli sorumlu tutar, rücu sırası şartı yoktur."}},"celdiriciYol":{},"hap":"Adam çalıştıran, çalışanını seçerken, talimat verirken, gözetim ve denetimde gerekli özeni gösterdiğini ispat ederse Türk Borçlar Kanununun 66 ncı maddesi uyarınca sorumluluktan kurtulur.","teshis":{"C":{"gercek":"Türk Borçlar Kanununun 66 ncı maddesine göre kurtuluş kanıtı adam çalıştırana aittir; zarar gören yalnızca zararı ve nedensellik bağını ispatlar.","ayirt":"Özenin gösterildiğini kim ispatlamak zorunda, zarar gören mi adam çalıştıran mı?","paragraf":"TBK m.66/2","yanilgi":"İspat yükünün zarar görende olduğunu, onun adam çalıştıranın kusurunu kanıtlaması gerektiğini sanıyorsun."},"E":{"gercek":"Sorumluluk yalnızca çalışana verilen işin yapılması sırasında doğan zararla sınırlıdır; işle ilgisi olmayan kişisel eylemler kapsam dışıdır.","ayirt":"Zarar, çalışana verilen işin görülmesi sırasında mı yoksa iş dışı bir eylemde mi doğdu?","paragraf":"TBK m.66/1","yanilgi":"Adam çalıştıranın sorumluluğunu çalışanın her davranışına, iş dışı eylemlerine kadar genişletiyorsun."},"A":{"gercek":"Türk Borçlar Kanununun 66 ncı maddesi adam çalıştıranı doğrudan sorumlu tutar; rücu hakkı ayrıca ve sonradan kullanılır, ön şart değildir.","ayirt":"Zarar gören, dava açarken önce çalışana mı gitmek zorunda?","paragraf":"TBK m.66/1","yanilgi":"Adam çalıştıranın sorumluluğunu ikincil sanıp önce çalışana başvurulması gerektiğini düşünüyorsun."},"D":{"gercek":"Madde metninde kast şartı yoktur; çalışanın işin yapılması sırasında verdiği her türlü zarar kapsama girer.","ayirt":"Madde metninde çalışanın kusur derecesine ilişkin bir sınırlama var mı?","paragraf":"TBK m.66/1","yanilgi":"Sorumluluğun ancak kasıtlı zararlarda doğduğunu, ihmalin kapsam dışı kaldığını düşünüyorsun."},"B":{"gercek":"Türk Borçlar Kanununun 66 ncı maddesinin ikinci fıkrası, adam çalıştırana seçim, talimat ve gözetimde özen gösterdiğini ispatlayarak sorumluluktan kurtulma imkânı tanır.","ayirt":"Kanun, adam çalıştırana bir kurtuluş kanıtı imkânı tanıyor mu?","paragraf":"TBK m.66/2","yanilgi":"Bu seçeneği eleyen öğrenci kurtuluş kanıtının varlığını fark etmemiş ya da ispat yükünü karıştırmıştır."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 127"},"kural":"3568 sayılı Kanunun 12 nci maddesine göre yeminli mali müşavirler, tasdikin doğru olmaması halinde tasdikin kapsamı ile SINIRLI olmak üzere ziyaa uğratılan vergi ve cezalardan mükellefle birlikte müşterek ve müteselsil sorumludur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 127","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Sorumluluk cümlelerinde \u0027sınırlı\u0027, \u0027mükellefle birlikte\u0027, \u0027müşterek ve müteselsil\u0027 kelimelerini ara; bunlardan biri ters çevrilmişse (sınırsız, tek başına) o şık yanlıştır.","konu":"özen sorumluluğu","tablo":{"satirlar":[["A) Meslek mensuplarının, muhasebe ve denetim standartlarına…","m.6/a","doğru ifade"],["B) Yeminli mali müşavirler, görevlerine fiilen başlamadan ö…","m.11","doğru ifade"],["C) Yeminli mali müşavirler, tasdikin doğru olmaması halinde…","m.12/2","YANLIŞ ifade"],["D) Yeminli mali müşavirlerin tasdikten doğan mali sorumlulu…","m.12 ek fıkra","doğru ifade"],["E) Yeminli mali müşavirler, yaptıkları tasdikin kapsamını d…","m.12/2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yeminli mali müşavirler, tasdikin doğru olmaması halinde ziyaa uğratılan vergi ve cezalardan, tasdikin kapsamı sınırı olmaksızın tek başına sorumludur.","E":"Yeminli mali mü
