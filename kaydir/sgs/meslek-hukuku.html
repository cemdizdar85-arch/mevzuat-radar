yetleri Düzey 1 Lisansı sınav konuları arasında aşağıdakilerden hangisi yer almaz?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-19","verilenler":[],"dayanak":"SPK Tebliği (VII-128.7) m.9/1-a ve m.9/1-b-7","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bir aracı kurumda işe yeni başlayan 24 yaşındaki Ece, Düzey 1 Lisansı sınavına girecek. SPL\u0027den gelen 2025 kılavuzunda beş konu başlığı listelenmiş: dar kapsamlı mevzuat, sermaye piyasası araçları 1, yatırım kuruluşları, takas-saklama-operasyon, finansal yönetim ve mali analiz. Ece bu beş başlığın hepsinin sınavda çıkacağını sanıyor.","anlatim":"Ece elindeki listeyi tek tek kontrol edecek. Beşinci başlık onu şaşırtacak.","doldur":[]},{"formul":"Ne yapacağız: madde 9/1-a\u0027ya göre Düzey 1 Lisansının sınav konuları sadece dört tanedir; dar kapsamlı mevzuat, araçlar 1, yatırım kuruluşları, takas-saklama-operasyon. Finansal yönetim ve mali analiz ise madde 9/1-b-7 uyarınca Düzey 2 ve Düzey 3\u0027e aittir. Şimdi Ece\u0027nin elindeki beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.9/1-a-1","karar":"doğru","anlatim":"Ece\u0027nin kılavuzunda bu başlık ilk sırada duruyor. Madde 9/1-a-1 bu konuyu Düzey 1\u0027in ilk sınav konusu olarak sayıyor.","formul":"Şık A: Ece \u0027dar kapsamlı sermaye piyasası mevzuatı ve meslek kuralları benim sınavımda var mı?\u0027 diye soruyor, var mı dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.9/1-a-2","karar":"doğru","anlatim":"Hayır, Ece burada karıştırıyor. Sermaye piyasası araçları 1, madde 9/1-a-2 gereği tam olarak Düzey 1\u0027in konusu.","formul":"Şık B: Ece \u0027araçlar 2 varsa araçlar 1 de üst seviyeye ait olmalı\u0027 diyor, sen katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.9/1-a-3","karar":"doğru","anlatim":"Haklı değil. Madde 9/1-a-3, yatırım kuruluşları başlığını açıkça Düzey 1 listesine koymuş.","formul":"Şık C: Ece \u0027yatırım kuruluşları konusu ileri seviye gibi duruyor, benim sınavımda olmaz\u0027 diyor, haklı mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.9/1-a-4","karar":"doğru","anlatim":"Ece yine yanılıyor. Madde 9/1-a-4 bu konuyu Düzey 1\u0027in dördüncü ve son konusu olarak sayıyor.","formul":"Şık D: Ece \u0027takas, saklama ve operasyon işlemleri teknik bir iş, başlangıç seviyesinde olmaz\u0027 diyor, sen ne dersin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.9/1-b-7","karar":"yanlış","anlatim":"Hayır, eklemezsin. Madde 9/1-b-7 bu konuyu Düzey 2 ve Düzey 3\u0027e yazmış, madde 9/1-a\u0027da bu isim hiç geçmiyor.","formul":"Şık E: Ece \u0027finansal yönetim ve mali analiz de listemde olmalı, hepsi sermaye piyasasıyla ilgili\u0027 diyor, ekler misin?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Ece dört konuyu doğru bilmiş ama beşincisini üst lisanslardan Düzey 1\u0027e taşımış. Kendine hep şunu sor: bu konu madde 9/1-a bendinde madde numarasıyla mı sayılmış, yoksa b veya c bendinde mi?","doldur":[]}],"anahtar":[{"ornek":"konusunu","kok":"konusu"},{"ornek":"konuyu","kok":"konuyu"},{"ornek":"araçları","kok":"araçla"},{"ornek":"yatırım","kok":"yatırı"},{"ornek":"lisansı","kok":"lisans"},{"ornek":"kuruluşları","kok":"kurulu"}],"konuGiris":{"harita":"Ne zaman test edilir: Lisans sınavına girecek adaylar için sınav içeriği belirlenirken. Nasıl ölçülür: Tebliğ madde 8\u0027deki konu listesiyle karşılaştırılarak. Nasıl kaydedilir: SPL tarafından sınav müfredatı olarak yayımlanır.","desen":"Soru, madde 8\u0027de sayılan konu listesinden birini çıkarıp listede olmayan başka bir kavramı şık olarak sunar. Tuzak, listede olmayan ama sermaye piyasasıyla ilgili görünen bir terimi doğru sanmaktır. Bu soru Tebliğ m.8 (p.3) noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Lisans sınavında sorulacak konu başlığı","ad":"Sınav konusu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Sınavları yapan ve lisans veren kuruluş","ad":"SPL","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Sınav başarısıyla verilen mesleki yeterlilik belgesi","ad":"Lisans","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Tüm sınav konularının topluca sayıldığı madde","ad":"Tebliğ madde 8","kim":"kanun sabitler"}],"sinavda":"Şıklarda beş konu başlığı verilir, hangisinin madde 8\u0027deki listede yer almadığı istenir.","panel_ornek":"İkinci el bir telefon alırken satıcı sana 5 farklı özelliği listeler: ekran, batarya, kamera, hafıza, garanti. Sen de listede olmayan \u0027kutu rengi\u0027 gibi bir şeyi soruyorlarmış gibi düşün, o listede yer almaz.","ornek":"İkinci el bir telefon alırken satıcı sana 5 farklı özelliği listeler: ekran, batarya, kamera, hafıza, garanti. Sen de listede olmayan \u0027kutu rengi\u0027 gibi bir şeyi soruyorlarmış gibi düşün, o listede yer almaz.","yontemler":"Madde 8\u0027deki konu listesini harfe göre ezbere bilmek tek yöntemdir; listede olmayanı bulmak için elemeye dayalı çalışılır.","nedir":"Bu konu, SPK lisanslama sınavlarında hangi derslerin sorulacağını düzenler. Sınav, adayın hangi sınav konularının mevzuatta sayıldığını bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Düzey Atlama Tuzağı","metin":"Yatırım kuruluşları konusunun yalnızca Düzey 2 ve üstünde geçtiği sanılır. Doğrusu: bu konu madde 9/1-a-3 gereği Düzey 1 listesinde de bulunur."},"A":{"ad":"Dar Kapsamlı Tuzağı","metin":"Konu adındaki \u0027dar kapsamlı\u0027 ifadesinin başlangıç lisansında bulunmayacağını düşündürür. Doğrusu: bu konu madde 9/1-a-1 uyarınca Düzey 1 Lisansının ilk sınav konusudur."},"D":{"ad":"Ne soruluyor","metin":"Düzey 1 Lisansı sınav konularından hangisinin listede bulunmadığı sisteminden çıkan hangi şık dışarıda kalır sorusu incelenir. Kural: madde 9/1-a bendi Düzey 1 Lisansının dört sınav konusunu tek tek sayar. Doğrusu: takas, saklama ve operasyon işlemleri madde 9/1-a-4\u0027te açıkça yer alır, bu şık yanlış cevap adayıdır."},"B":{"ad":"Araç Karışıklığı Tuzağı","metin":"\u0027Sermaye piyasası araçları 2\u0027nin üst düzey lisanslara özgü olması, 1\u0027in de öyle sanılmasına yol açar. Doğrusu: araçlar 1 madde 9/1-a-2\u0027de Düzey 1 konuları arasında sayılmıştır."}},"celdiriciYol":{},"hap":"Düzey 1 Lisansı sınav konuları yalnız dar kapsamlı mevzuat, sermaye piyasası araçları 1, yatırım kuruluşları ve takas-saklama-operasyon işlemleridir; finansal yönetim ve mali analiz Düzey 2 ve 3\u0027e özgüdür.","teshis":{"C":{"gercek":"Yatırım kuruluşları konusu madde 9/1-a-3 gereği Düzey 1 Lisansının konuları arasındadır.","ayirt":"Bu konu birden fazla lisans düzeyinin listesinde tekrar ediyor mu?","paragraf":"m.9/1-a-3","yanilgi":"Yatırım kuruluşları başlığının yalnızca üst düzey lisanslarda geçtiğini düşünüyorsun."},"E":{"gercek":"Madde 9/1-b-7\u0027ye göre finansal yönetim ve mali analiz ancak Düzey 2 ve Düzey 3 Lisanslarının konuları arasındadır; Düzey 1 bendinde (9/1-a) sayılmamıştır.","ayirt":"Bu konu madde 9/1-a bendinde mi, yoksa yalnız b ve c bentlerinde mi geçiyor?","paragraf":"m.9/1-b-7","yanilgi":"Sermaye piyasasıyla ilgili her genel finans konusunun başlangıç lisansında da bulunması gerektiğini düşünüyorsun."},"A":{"gercek":"Madde 9/1-a-1\u0027e göre dar kapsamlı sermaye piyasası mevzuatı ve meslek kuralları Düzey 1 Lisansının ilk sınav konusudur.","ayirt":"Bu konu madde 9\u0027un Düzey 1 bendinde madde numarasıyla sayılıyor mu?","paragraf":"m.9/1-a-1","yanilgi":"Konu adındaki \u0027dar kapsamlı\u0027 ifadesinden dolayı bunun başlangıç lisansında bulunmayacağını sanıyorsun."},"D":{"gercek":"Bu konu madde 9/1-a-4\u0027te Düzey 1 Lisansı sınav konuları arasında açıkça sayılmıştır.","ayirt":"Bu konu madde 9\u0027un hangi lisans bentlerinde tekrar ediyor?","paragraf":"m.9/1-a-4","yanilgi":"Takas, saklama ve operasyon işlemlerini teknik/operasyonel bir konu sayıp giriş seviyesinde bulunmayacağını düşünüyorsun."},"B":{"gercek":"Sermaye piyasası araçları 1, madde 9/1-a-2 uyarınca Düzey 1 Lisansı sınav konuları arasında açıkça sayılmıştır.","ayirt":"Aradığım konunun adında \u00271\u0027 mi \u00272\u0027 mi geçiyor ve bu hangi düzeyde sayılmış?","paragraf":"m.9/1-a-2","yanilgi":"\u0027Araçlar 2\u0027nin üst lisanslara özgü olmasından yola çıkıp \u0027araçlar 1\u0027in de öyle olduğunu sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"Etik İlkeler Yönetmeliği Eki madde 6\u0027ya göre dürüstlük ilkesi meslek mensubuna mesleki ilişkilerinde doğru ve güvenilir olma yükümlülüğü getirir; adil davranmayı ve açık sözlülüğü ifade eder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Tanım sorularında cümledeki anahtar kelimeyi (doğruluk-güvenilirlik) yakala, ilkeyi ona göre eşleştir; benzer başlıklara aldanma.","konu":"disiplin cezalari eşleştirme","tablo":{"satirlar":[["A) Dürüstlük","m.6","doğru ifade"],["B) Tarafsızlık","m.8","YANLIŞ ifade"],["C) Meslekî Yeterlilik ve Özen","Yönetmelik Eki DÖRDÜNCÜ BÖLÜM başlığı","YANLIŞ ifade"],["D) Gizlilik","Etik İlkeler genel sınıflandırması","YANLIŞ ifade"],["E) Mesleğe Uygun Davranış Sergileme","Etik İlkeler genel sınıflandırması","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Meslekî Yeterlilik ve Özen","E":"Mesleğe Uygun Davranış Sergileme","A":"Dürüstlük","D":"Gizlilik","B":"Tarafsızlık"},"kaynak":{"alinti":"","liste":[{"ad":"TÜRMOB Etik İlkeler Yön. EK bolum 3","metin":"TÜRMOB - Mesleki Faaliyetlerde Uyulacak Etik İlkeler Hakkında Yönetmelik (RG 19.10.2007, Sayı 26675). EK: Etik İlkeler (m.4-9) [BİRİNCİ KISIM: Tüm Meslek Mensuplarının Uyacakları Temel Etik İlkeleri / BİRİNCİ BÖLÜM: İlkelerin Genel Uygulanış Biçimi Temel] MADDE 4 – (1) Tehditleri ortadan kaldıran veya kabul edilebilir bir düzeye indiren önlemler iki büyük gruba ayrılmaktadır. a) Mevzuat ile oluşturulabilecek önlemler: Bu önlemlere verilebilecek örnekler aşağıda belirtilmiştir: 1) Mesleğe giriş için gerekli eğitim, meslekî eğitim (staj) ve tecrübe gereksinimleri, 2) Sürekli meslekî gelişim gereksinimleri, 3) Kurumsal yönetim gereksinimleri, 4) Meslekî standartlar, 5) Meslekî veya düzenleyici izleme ve disiplin prosedürleri , 6) Meslek mensubu tarafından üretilen rapor, sonuç, iletişim ve bilgilerin yasal yetkili üçüncü bir kurum tarafından dış kontrolden geçirilmesi. b) İş çevresinden sağlanacak önlemler. Etik Çatışmanın Çözümlenmesi MADDE 5 – (1) Meslek mensupları, temel etik ilkelerinin uygulanması sırasında ortaya çıkabilecek uyuşmazlıklardan kaynaklanan çatışmaları bu düzenlemede yer alan temel etik ilkeleri esas alarak çözüme kavuşturmalıdır. Bu etik çatışmaların çözümlenmesi için oluşturulan formel ya da enformel çözüm sürecinde, meslek mensubunun ilgili verileri, çatışma konusu ile ilgili etik sorunları ve etik ilkeleri, yerleşik iç süreçleri ve alternatif hareket biçimlerini dikkate alarak temel etik ilkelerle uygun hareket biçimini belirlemesi gerekecektir. Eğer sorun hala çözümlenemez ise, meslek mensubu firma içindeki veya işveren işletmedeki diğer uygun kişilerde…"},{"ad":"TÜRMOB Etik İlkeler Yön. EK bolum 8","metin":"TÜRMOB - Mesleki Faaliyetlerde Uyulacak Etik İlkeler Hakkında Yönetmelik (RG 19.10.2007, Sayı 26675). EK: Etik İlkeler (m.29-30) [İKİNCİ KISIM: Bağımsız Çalışan Meslek Mensuplarının Uyacakları Etik İlkeler / BİRİNCİ BÖLÜM: Giriş] MADDE 29 – İş çevresinde firma çapında alınabilecek önlemler şunlar olabilir: a) Firmanın temel etik ilkelere uyumun önemini vurgulamak. b) Güvence sağlama sözleşmesi ekibinin kamu çıkarına uygun hareket edeceği yönünde bir beklentinin oluşmasını sağlamak. c) Sözleşmelerde kalite kontrolü uygulanması ve izlenmesini sağlayacak politika ve süreçler. ç) Tehditlerin belirlenmesi, bu tehditlerin önem derecesinin değerlendirilmesi, önemsiz olanlar dışındaki tehditleri ortadan kaldıracak veya kabul edilebilir düzeye indirecek önlemlerin belirlenmesi ve uygulanmasına ilişkin belgeye dayalı politikalar. d) Güvence sağlama sözleşmelerini kullanan firmalar için bağımsızlığa yönelik tehditlerin ve bu tehditlerin önem derecesinin belirlenmesi, tehditleri (önemsiz olanlar dışındaki) yok edecek veya kabul edilebilir düzeye indirecek önlemlerin değerlendirilmesi ve uygulanmasına yönelik belgeye dayalı bağımsızlık politikaları. e) Temel etik ilkelere uyum gerektiren belgeye dayalı iç politika ve süreçler. f) Firma veya sözleşme ekibi üyeleri ve müşteriler arasındaki çıkar ilişkilerinin belirlenmesini sağlayacak politika ve süreçler. g) Tek bir müşteriden elde edilen gelirin izlenmesi ve gerektiğinde bu gelire olan bağımlılığın yönetilmesini sağlayacak politika ve süreçler. ğ) Sözleşme ekibinin üyesi olmayan kişilerin sözleşmenin sonucunu uygunsuz bir biçimde etkile…"}],"hakem":"TÜRMOB Etik İlkeler Yönetmeliği Eki Madde 6(1)\u0027de dürüstlük ilkesi, meslek mensuplarına mesleki ilişkilerinde doğru ve güvenilir olma yükümlülüğü getirdiği ve adil davranma ile açık sözlülüğü ifade ettiği açıkça belirtilmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Mesleki ilişkilerde doğru ve güvenilir olma yükümlülüğü getiren; adil davranmayı ve açık sözlülüğü ifade eden temel etik ilke aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-23","verilenler":[],"dayanak":"Etik İlkeler Hakkında Yönetmelik Eki, madde 6 (Dürüstlük)","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bir bağımsız denetçi, müşteri işletmenin 12.03.2024 tarihli stok sayım raporunda 40.000 TL\u0027lik farkı fark ediyor ve bunu rapora doğru yansıtıyor, tutarı gizlemiyor.","anlatim":"Denetçi burada rakamı olduğu gibi yazıyor, yanıltıcı ifade kullanmıyor. Şimdi bu tek olayı beş ilkeyle tek tek test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Etik İlkeler Yönetmeliği Eki\u0027ndeki beş temel ilkeden hangisi \u0027doğru-güvenilir olma, adil davranma, açık sözlülük\u0027 tanımına uyuyor, bunu bu 40.000 TL\u0027lik olayda test edeceğiz.","anlatim":"Kural tek: madde 6\u0027daki tanım hangi ilkeye aitse cevap odur. Şimdi A\u0027dan E\u0027ye beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.6","karar":"doğru","anlatim":"Evet, denetçi burada doğru ve güvenilir davranıyor, adil ve açık sözlü. Madde 6 tam bunu tanımlıyor.","formul":"Şık A: Denetçi 40.000 TL\u0027lik farkı gizlemeden, adil ve açık biçimde rapora yazıyor; bu davranış \u0027dürüstlük\u0027 ilkesiyle mi açıklanır?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.8","karar":"yanlış","anlatim":"Bu davranış çıkar çatışması ve baskıya direnmekle ilgili, madde 8 tarafsızlığı tanımlıyor. Ama soru bize doğruluk-güvenilirlik tanımını soruyor, o tarafsızlık değil.","formul":"Şık B: Aynı denetçiye müşteri firma sahibi \u0027bu farkı küçük göster, sana ekstra ücret veririm\u0027 diyor ve denetçi reddediyor; bu \u0027tarafsızlık\u0027 mıdır?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Yönetmelik Eki DÖRDÜNCÜ BÖLÜM başlığı","karar":"yanlış","anlatim":"Bu bölüm bilgi-beceri-özenle ilgilidir, doğruluk ve açık sözlülük tanımını içermez. Olayımızdaki 40.000 TL\u0027yi gizlememe davranışı bu başlığa ait değil.","formul":"Şık C: Denetçi stok sayımını yaparken gerekli bilgi ve beceriyi güncel tutuyor; bu \u0027Meslekî Yeterlilik ve Özen\u0027 midir?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Etik İlkeler genel sınıflandırması","karar":"yanlış","anlatim":"Gizlilik, bilginin yetkisiz açıklanmamasıyla ilgilidir, açık sözlülükle değil. Olayımızdaki \u0027farkı gizlememe\u0027 davranışı gizlilik ilkesiyle karışmasın.","formul":"Şık D: Denetçi müşterinin ticari sırlarını üçüncü kişilere açıklamıyor; bu \u0027gizlilik\u0027 midir?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Etik İlkeler genel sınıflandırması","karar":"yanlış","anlatim":"Bu ilke itibar ve saygınlıkla ilgilidir, doğruluk-güvenilirlik tanımını taşımaz. Olayımızdaki temel davranış yine dürüstlüğe aittir.","formul":"Şık E: Denetçi mesleğin itibarını zedeleyecek bir davranıştan kaçınıyor; bu \u0027Mesleğe Uygun Davranış Sergileme\u0027 midir?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Doğru-güvenilir olma, adil davranma ve açık sözlülük üçlüsü sadece dürüstlük ilkesinde birlikte tanımlanır. Kendine sor: bu cümle çıkar çatışmasından mı yoksa doğruluk-güvenilirlikten mi bahsediyor?","doldur":[]}],"anahtar":[{"ornek":"güvenilir","kok":"güveni"},{"ornek":"davranmayı","kok":"davran"},{"ornek":"ilkesi","kok":"ilkesi"},{"ornek":"doğruluk","kok":"doğrul"},{"ornek":"dürüstlük","kok":"dürüst"},{"ornek":"sözlülüğü","kok":"sözlül"}],"konuGiris":{"harita":"Ne zaman test edilir: Sınavda bir ilke tanımı verilip hangi ilkeye ait olduğu sorulduğunda test edilir. Nasıl ölçülür: Tanımdaki anahtar kelimeler (doğruluk, tarafsızlık, yeterlilik gibi) ile ilke adı eşleştirilerek ölçülür. Nasıl kaydedilir: Doğru ilke adının seçilmesiyle kaydedilir.","desen":"Sınav genellikle bir ilkenin madde metnindeki tanımını aynen verip hangi ilke olduğunu sorar; tuzak, benzer kelimelerle (adil-tarafsız gibi) diğer ilkelerle karıştırmaktır. Doğruluk ve açık sözlülük ifadesi sadece Dürüstlük ilkesine (m.6) aittir, Tarafsızlık ilkesiyle (m.8) karıştırılmamalıdır. Bu soru TÜRMOB Etik İlkeler Yönetmeliği EK madde 6\u0027dan geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Mesleki ilişkilerde doğru, güvenilir, adil ve açık sözlü olma yükümlülüğü","ad":"Dürüstlük ilkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Çıkar çatışması veya baskı nedeniyle meslekî kararlardan ödün vermeme sorumluluğu","ad":"Tarafsızlık ilkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Güncel bilgi ve beceriyle standartlara uygun özenli hizmet verme yükümlülüğü","ad":"Meslekî yeterlilik ve özen","kim":"meslek kuruluğu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Uyuşmazlıkları temel etik ilkeleri esas alarak çözme süreci","ad":"Etik çatışmanın çözümü","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soruda bir etik ilkenin tanımı cümle halinde verilir ve bu tanıma karşılık gelen ilkenin adı istenir.","panel_ornek":"İkinci el bir bisiklet satarken alıcıya bisikletin gerçek durumunu, kaç kilometre kullanıldığını dürüstçe söylemen gerekir; bu, satıcı olarak açık sözlü davranman demektir. 3 yıl önce aldığın bisikleti 2 kere tamir ettirdiğini gizlemezsin. İşte bu \u0027doğru ve güvenilir olma\u0027 örneğidir.","ornek":"İkinci el bir bisiklet satarken alıcıya bisikletin gerçek durumunu, kaç kilometre kullanıldığını dürüstçe söylemen gerekir; bu, satıcı olarak açık sözlü davranman demektir. 3 yıl önce aldığın bisikleti 2 kere tamir ettirdiğini gizlemezsin. İşte bu \u0027doğru ve güvenilir olma\u0027 örneğidir.","yontemler":"Tanımdaki anahtar kelimeyi yakala: \u0027doğru-güvenilir-adil-açık sözlü\u0027 geçiyorsa cevap Dürüstlük\u0027tür, başka kelime aramaya gerek yoktur.","nedir":"Bu konu meslek mensuplarının uyması gereken temel etik ilkeleri tanımlar. Sınav, hangi ilkenin hangi davranışı ifade ettiğini eşleştirme becerini ölçer."},"olay":"","tuzak":{"C":{"ad":"Meslekî Yeterlilik Tuzağı","metin":"Öğrenci ilke başlığını mesleki bilgi ve beceri düzeyiyle ilgili sanır. Doğrusu: Meslekî Yeterlilik ve Özen ilkesi bilgi ve beceriyi güncel tutmayı düzenler, doğruluk-açık sözlülük tanımını taşımaz."},"E":{"ad":"Mesleğe Uygun Davranış Tuzağı","metin":"Öğrenci mesleğin itibarını koruma ile dürüstlüğü aynı ilke sanır. Doğrusu: Mesleğe Uygun Davranış Sergileme ilkesi mesleğin itibarını zedeleyecek davranışlardan kaçınmayı düzenler, doğruluk-güvenilirlik tanımını içermez."},"D":{"ad":"Gizlilik Tuzağı","metin":"Öğrenci bilgiyle ilgili her ilkeyi gizlilikle karıştırır. Doğrusu: Gizlilik ilkesi edinilen bilgilerin ifşa edilmemesini düzenler, açık sözlülüğü değil sır saklamayı esas alır."},"B":{"ad":"Tarafsızlık Tuzağı","metin":"Öğrenci \u0027adil davranma\u0027 ifadesini görünce çıkar çatışmasından uzak durmayı düzenleyen tarafsızlık ilkesini seçer. Doğrusu: Tarafsızlık madde 8\u0027de yanlı olmama ve üçüncü kişi baskısına ödün vermemeyi düzenler, doğruluk-güvenilirlik unsurunu içermez."}},"celdiriciYol":{},"hap":"Dürüstlük ilkesi: doğru, güvenilir, adil ve açık sözlü olma yükümlülüğüdür.","teshis":{"C":{"gercek":"Meslekî Yeterlilik ve Özen bilgi, beceri ve özenin sürekli güncel tutulmasıyla ilgilidir, dürüstlüğün konusu değildir.","ayirt":"Tanım bilgi-beceriden mi, doğruluk-güvenilirlikten mi söz ediyor?","paragraf":"Yönetmelik Eki DÖRDÜNCÜ BÖLÜM başlığı","yanilgi":"İlke isminde \u0027yeterlilik\u0027 geçmese de her mesleki nitelik ilkesini bu başlığa yazarsın."},"E":{"gercek":"Mesleğe Uygun Davranış Sergileme mesleğin itibarını zedeleyecek davranışlardan kaçınmayı düzenler, doğruluk tanımını içermez.","ayirt":"Cümle itibarı korumaktan mı, doğru-güvenilir olmaktan mı bahsediyor?","paragraf":"Etik İlkeler genel sınıflandırması","yanilgi":"İtibar ve saygınlık kelimelerini duyunca doğrudan bu başlığı seçersin."},"A":{"gercek":"Madde 6 dürüstlüğü doğruluk, güvenilirlik, adil davranma ve açık sözlülük olarak birlikte tanımlar.","ayirt":"Tanımda geçen üç unsur (doğruluk-adillik-açık sözlülük) birlikte hangi başlığa aitti?","paragraf":"m.6","yanilgi":"Bu şıkkı eleyen öğrenci dürüstlüğü yalnız \u0027yalan söylememe\u0027 sanıp adil davranma ve açık sözlülük unsurlarını gözden kaçırır."},"D":{"gercek":"Gizlilik edinilen bilgilerin yetkisiz açıklanmamasını düzenler; açık sözlülükle ilgili değildir.","ayirt":"Cümle bilgiyi saklamaktan mı, açık ve dürüst davranmaktan mı bahsediyor?","paragraf":"Etik İlkeler genel sınıflandırması","yanilgi":"Bilgiyle ilgili her cümleyi otomatik olarak gizlilik ilkesine bağlarsın."},"B":{"gercek":"Madde 8 tarafsızlığı yanlı olmama, çıkar çatışması ve üçüncü kişi baskısına ödün vermeme olarak tanımlar; doğruluk-güvenilirlik unsuru yoktur.","ayirt":"Bu ilke çıkar çatışmasından mı, yoksa doğru-güvenilir olmaktan mı bahsediyor?","paragraf":"m.8","yanilgi":"Adil davranma kelimesini görünce doğrudan tarafsızlığı işaretlersin, oysa tarafsızlık çıkar çatışması ve baskıyla ilgilidir."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 120"},"kural":"3568 sayılı Kanunun 19 üncü maddesinin (g) bendine göre Genel Kurul, sorumlu görülenler hakkında yalnız disiplin soruşturması açılmasına karar verebilir; cezayı belirleme ve uygulama yetkisi Disiplin Kuruluna aittir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 120","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Hangisi değildir sorularında dört şıkkın madde metninde birebir geçip geçmediğini kontrol et; beşincisi genellikle iki organın görevini karıştırır.","konu":"genel kurul kararları","tablo":{"satirlar":[["A) Yönetim Kurulunca yapılacak teklifleri incelemek ve kara…","m.19/d","doğru ifade"],["B) Odaya kayıtlı üyelerin yıllık aidatlarını tespit etmek.","m.19/h","doğru ifade"],["C) Sorumlu görülen meslek mensupları hakkında doğrudan disi…","m.19/g","YANLIŞ ifade"],["D) Bütçeyi ve kesinhesapları tasdik etmek.","m.19/f","doğru ifade"],["E) Oda Yönetim Kurulu, Disiplin Kurulu ve Denetleme Kurulu …","m.19/b","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Sorumlu görülen meslek mensupları hakkında doğrudan disiplin cezası vermek.","E":"Oda Yönetim Kurulu, Disiplin Kurulu ve Denetleme Kurulu üyelerini seçmek.","A":"Yönetim Kurulunca yapılacak teklifleri incelemek ve karara bağlamak.","D":"Bütçeyi ve kesinhesapları tasdik etmek.","B":"Odaya kayıtlı üyelerin yıllık aidatlarını tespit etmek."},"kaynak":{"alinti":"sorumlu görülenler hakkında disiplin soruşturmasına karar vermek","liste":[{"ad":"SMMM K. (3568 s.K.) m.19","metin":"Madde 19 – Genel Kurulun görevleri aşağıda gösterilmiştir. a) Odaların amaçlarının gerçekleştirilmesi için gereken karar ve tedbirleri almak. b) Oda Yönetim Kurulu, Disiplin Kurulu ve Denetleme Kurulu üyeleri ile Birlik temsilcilerini seçmek. c) Oda için gerekli taşınmazların satın alınması veya mevcut taşınmazların satılması hususunda Yönetim Kuruluna yetki vermek. d) Yönetim Kurulunca yapılacak teklifleri incelemek ve karara bağlamak. e) Meslek mensuplarınca uyulması zorunlu mesleki kararlar alınması konusunda Birliğe tekliflerde bulunmak. f) (…)9 bütçeyi ve kesinhesapları tasdik etmek. g) Yönetim Kurulunu ibra etmek, gerektiğinde sorumlu görülenler hakkında disiplin soruşturmasına karar vermek. h) Odaya yazılacak adayların giriş ücretlerini ve odaya yazılı üyelerin yıllık aidatlarını tespit etmek ve bunların ödeneceği tarihleri belirlemek. i) Oda Yönetim Kurulunun çalışma raporunu incelemek, kabul etmek. j) Odanın görevlerine giren diğer işleri gündeme dayanılarak veya üyelerin teklifi üzerine inceleyip karara bağlamak. k) Kanunlarla verilmiş diğer görevleri yapmak. Oda Genel Kurul toplantısı"},{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"}],"hakem":"3568 sayılı Kanunun m.19(g) bendinde Genel Kurul\u0027un \u0027sorumlu görülenler hakkında disiplin soruşturmasına karar vermek\u0027 yetkisi bulunurken, cezayı belirleme ve uygulama yetkisi Disiplin Kuruluna ait olduğundan, doğrudan disiplin cezası vermek Genel Kurul\u0027un görevi değildir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2025/2","alinti":"Bağımsız denetime tabi bir anonim şirketin faaliyet döneminin görüşüldüğü olağan genel kurulunda aşağıdaki kararlardan hangisinin her yıl alınmasına gerek yoktur?"}],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi, 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre Oda Genel Kurulunun görevlerinden biri değildir?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-27","verilenler":[],"dayanak":"3568 sayılı SMMM Kanunu m.19 (g) bendi","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: İzmir SMMM Odası\u0027nda 14 Mart günü Genel Kurul toplanıyor, salonda 210 üye var.","anlatim":"Yönetim Kurulu başkanı kürsüye çıkıp beş ayrı gündem maddesini oylamaya sunuyor. Bu beş maddenin her biri, kanunun Genel Kurula verdiği görevlerden biri iddiasıyla geliyor. Sen bu beş iddiayı tek tek denetleyeceksin.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun madde 19, Genel Kurulun görevlerini bentler halinde sayar.","anlatim":"Bu 210 kişilik salonda konuşulan her önerinin madde 19\u0027daki bir bende denk düşüp düşmediğine bakacağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.19/d","karar":"doğru","anlatim":"Salon bu teklifi tartışıp oylar, çünkü bu iş doğrudan Genel Kurula bırakılmış. Yönetim Kurulu kendi başına karar veremez, teklifi Genel Kurula getirir.","formul":"Şık A: başkan \u0027Yönetim Kurulunun getirdiği teklifleri şimdi inceleyip karara bağlayalım\u0027 diyor, bu Genel Kurulun görevi mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.19/h","karar":"doğru","anlatim":"210 üye elini kaldırıp bu tutarı oyluyor, çünkü aidat tespiti kanunla Genel Kurula verilmiş. Yönetim Kurulu bunu kendi kararıyla belirleyemez.","formul":"Şık B: gündemde \u00272025 yılı aidatını 4.500 lira olarak belirleyelim\u0027 maddesi var, bu Genel Kurulun görevi mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.19/g","karar":"yanlış","anlatim":"Salon burada durur, çünkü Genel Kurulun elinde yalnız soruşturma açılmasına karar verme yetkisi vardır. Cezayı belirleyip uygulama işi Disiplin Kuruluna aittir, Genel Kurul cezayı doğrudan veremez.","formul":"Şık C: başkan \u0027Ahmet Bey hakkında sorumluluk var, salon burada oyla ona doğrudan disiplin cezası verelim\u0027 diyor, sen buna izin verir misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.19/f","karar":"doğru","anlatim":"210 üye bütçeyi ve kesinhesabı burada onaylar, çünkü bu tasdik yetkisi kanunla Genel Kurula verilmiş. Yönetim Kurulu bunu kendi kendine yürürlüğe koyamaz.","formul":"Şık D: mali müşavir \u0027geçen yılın kesinhesabını ve bu yılın bütçesini tasdik edelim\u0027 diyor, bu Genel Kurulun görevi mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.19/b","karar":"doğru","anlatim":"210 üye oy pusulalarını kullanıp üç kurulu birden seçer, çünkü bu seçim açıkça Genel Kurula bırakılmış. Bu seçim Birlik düzeyinde değil, Oda Genel Kurulu düzeyinde yapılır.","formul":"Şık E: salon \u0027yeni Yönetim Kurulu, Disiplin Kurulu ve Denetleme Kurulu üyelerini seçelim\u0027 diyor, bu Genel Kurulun görevi mi?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"İzmir salonunda dört madde geçerli oldu, yalnız Ahmet Bey\u0027e doğrudan ceza verme girişimi durduruldu. Kendine hep şunu sor: bu organ kararı, soruşturma açılmasını mı yoksa cezanın kendisini mi belirliyor?","doldur":[]}],"anahtar":[{"ornek":"kuruluna","kok":"kurulu"},{"ornek":"kurula","kok":"kurula"},{"ornek":"disiplin","kok":"disipl"},{"ornek":"belirleyip","kok":"belirl"},{"ornek":"yetkisi","kok":"yetkis"},{"ornek":"soruşturması","kok":"soruşt"}],"konuGiris":{"harita":"Ne zaman test edilir: Oda organlarının görev dağılımı sorulduğunda test edilir. Nasıl ölçülür: Şıklardaki görevlerden hangisinin Genel Kurula ait olmadığı bulunarak ölçülür. Nasıl kaydedilir: Doğru cevap, kanunda sayılan görevler listesiyle karşılaştırılarak belirlenir.","desen":"Soru, Genel Kurulun görevlerini sayan kanun hükmünden gelir ve şıklardan birine Yönetim Kurulunun ya da başka bir organın görevini yerleştirir. Tuzak, benzer görünen ama aslında günlük yönetim işine ait bir ifadeyi Genel Kurul görevi gibi göstermektir. Bu soru, Genel Kurulun görevlerinin tek tek sayıldığı madde noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Odanın en yetkili karar organı, üyelerin tümünden oluşur","ad":"Genel Kurul","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Genel Kurul kararlarını uygulayan, günlük işleri yürüten organ","ad":"Yönetim Kurulu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yönetim Kurulunun hesap ve işlemlerinin usulüne uygun bulunması onayı","ad":"İbra","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Üyelerin ödeyeceği giriş ücreti ve yıllık aidat tutarının belirlenmesi","ad":"Aidat tespiti","kim":"kanun sabitler"}],"sinavda":"Şıklarda sayılan görevlerden hangisinin Genel Kurula ait olmadığı sorulur.","panel_ornek":"Bir apartman yönetimi kat maliklerinin toplandığı bir toplantı düşün: aidatı belirlemek, yöneticiyi ibra etmek, bütçeyi onaylamak o toplantının işidir; ama günlük tadilat işini kapıcıya kim yaptıracak diye karar vermek yöneticinin kendi işidir. İşte odalarda da bazı kararlar üst kurulun, bazıları yönetim kurulunun görevidir.","ornek":"Bir apartman yönetimi kat maliklerinin toplandığı bir toplantı düşün: aidatı belirlemek, yöneticiyi ibra etmek, bütçeyi onaylamak o toplantının işidir; ama günlük tadilat işini kapıcıya kim yaptıracak diye karar vermek yöneticinin kendi işidir. İşte odalarda da bazı kararlar üst kurulun, bazıları yönetim kurulunun görevidir.","yontemler":"Şıklar tek tek kanundaki görev listesiyle karşılaştırılır; listede olmayan ya da başka organa ait olan şık doğru cevaptır.","nedir":"Bu konu, Serbest Muhasebeci Mali Müşavirler Odasının Genel Kurulunun hangi yetkilere sahip olduğunu düzenler. Sınav, Genel Kurula ait olan görevle ait olmayanı ayırt edebilmeyi ölçer."},"olay":"","tuzak":{"D":{"ad":"Yetki Devri Tuzağı","metin":"Bütçe ve kesinhesap onayının Yönetim Kuruluna bırakıldığını sanırsın. Doğrusu: bu, 19 üncü maddenin (f) bendinde açıkça sayılan Genel Kurul görevidir."},"E":{"ad":"Organ Seçimi Tuzağı","metin":"Üye seçiminin Birlik tarafından yapıldığını, Oda Genel Kuruluyla ilgisi olmadığını düşünürsün. Doğrusu: bu, 19 üncü maddenin (b) bendinde sayılan Genel Kurul görevidir."},"A":{"ad":"Görev Karıştırma Tuzağı","metin":"Yönetim Kurulu tekliflerinin incelenip karara bağlanmasını yürütme organının kendi işi sanırsın. Doğrusu: bu, 19 üncü maddenin (d) bendinde açıkça sayılan Genel Kurul görevidir."},"B":{"ad":"Bent Atlama Tuzağı","metin":"Aidat ve giriş ücreti tespitinin idari bir işlem olup Genel Kurulu ilgilendirmediğini düşünürsün. Doğrusu: bu, 19 üncü maddenin (h) bendinde sayılan Genel Kurul görevidir."}},"celdiriciYol":null,"hap":"Genel Kurul yalnızca disiplin soruşturması açılmasına karar verebilir; cezayı belirleyip uygulama yetkisi Disiplin Kuruluna aittir.","teshis":{"C":{"gercek":"Madde 19/g yalnız \u0027disiplin soruşturmasına karar vermek\u0027ten söz eder; cezayı belirleyip uygulama yetkisi Disiplin Kuruluna aittir.","ayirt":"Bu organ kararı, soruşturma açılmasını mı yoksa cezanın kendisini mi belirliyor?","paragraf":"m.19/g","yanilgi":"Genel Kurulun disiplin soruşturması açma yetkisini, doğrudan ceza verme yetkisiyle aynı sanırsın."},"E":{"gercek":"Madde 19/b, Yönetim, Disiplin ve Denetleme Kurulu üyeleri ile Birlik temsilcilerinin seçimini Genel Kurula verir.","ayirt":"Bu seçim, Oda düzeyinde mi yoksa Birlik düzeyinde mi yapılıyor?","paragraf":"m.19/b","yanilgi":"Organ üyelerinin seçiminin Birlik tarafından yapılan merkezi bir işlem olduğunu sanırsın."},"A":{"gercek":"Madde 19/d, Yönetim Kurulunca yapılacak tekliflerin incelenip karara bağlanmasını doğrudan Genel Kurula verir.","ayirt":"Bu işlem, Yönetim Kurulunun kendi kararı mı yoksa Genel Kurula sunduğu bir teklif mi?","paragraf":"m.19/d","yanilgi":"Yönetim Kurulu tekliflerini karara bağlamanın idari bir yürütme işi olduğunu, Genel Kurulu ilgilendirmediğini sanırsın."},"D":{"gercek":"Madde 19/f, bütçe ve kesinhesapları tasdik yetkisini açıkça Genel Kurula verir.","ayirt":"Bu belge nihai olarak kim tarafından onaylanıp yürürlüğe giriyor?","paragraf":"m.19/f","yanilgi":"Bütçe ve kesinhesap onayının mali uzmanlık gerektirdiğini, bu yüzden Yönetim Kuruluna ait olduğunu düşünürsün."},"B":{"gercek":"Madde 19/h, giriş ücreti ve yıllık aidatların tespitini açıkça Genel Kurula bırakır.","ayirt":"Bu tutar üyeler için bağlayıcı bir mali yük mü koyuyor, dolayısıyla Genel Kurul kararı mı gerekir?","paragraf":"m.19/h","yanilgi":"Aidat tespitinin mali/idari bir iş olduğunu, seçim ve karar organı olan Genel Kurulun görevi olmadığını düşünürsün."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"3568 sayılı Kanun m.48/2 uyarınca beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası alan meslek mensubunun bu cezayı gerektiren fiili yeniden işlemesi halinde meslekten çıkarma cezası uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında olayın \u0027ilk kez mi yoksa tekrar mı\u0027 olduğuna ve varsa süre/adet eşiğine (üç yıl-tekerrür, beş yıl-iki alıkoyma) bak; kanunun özel eşik koyduğu durumlarda genel takdir veya kademeli ceza kuralları uygulanmaz.","konu":"disiplin cezalari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Ceza tekrar süresi","beş yıllık bir dönem","-"],["Alınan ceza sayısı","iki defa geçici alıkoyma cezası","-"],["HESAP","-","-"],["A) Geçici olarak mesleki faaliyetten alıkoyma cezası üçüncü…","m.48/2","YANLIŞ ifade"],["B) Disiplin kurulu takdirine göre kınama cezası verilir.","m.48/2","YANLIŞ ifade"],["C) Yeminli sıfatı kaldırılarak meslekten çıkarma cezası bir…","m.48/1","YANLIŞ ifade"],["D) İlk fiil olması nedeniyle uyarma cezası uygulanır.","m.48/1","YANLIŞ ifade"],["E) Meslekten çıkarma cezası uygulanır.","m.48/2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yeminli sıfatı kaldırılarak meslekten çıkarma cezası birlikte uygulanır.","E":"Meslekten çıkarma cezası uygulanır.","A":"Geçici olarak mesleki faaliyetten alıkoyma cezası üçüncü kez uygulanır.","D":"İlk fiil olması nedeniyle uyarma cezası uygulanır.","B":"Disiplin kurulu takdirine göre kınama cezası verilir."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"3568 sayılı SMMM Kanunu m.48/2\u0027de beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırıldıktan sonra aynı fiili yeniden işleyen meslek mensubuna meslekten çıkarma cezası uygulanacağı açıkça düzenlenmiştir ve soru bu kuralı doğru uygulamaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[{"yil":"2018/3","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, disiplin cezalarına ilişkin aşağıdakilerden hangisi yanlıştır?"},{"yil":"2018/1","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, serbest muhasebeci mali müşavirlere uygulanabilecek disiplin cezaları ile ilgili aşağıdakilerden hangisi yanlıştır?"},{"yil":"2017/2","alinti":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliğine göre, yukarıdaki disiplin cezalarından hangileri Resmî Gazete’de ilan edilmez?"}],"donemler":["2025/1","2024/2","2021/1","2020/1","2018/3","2018/1","2017/3","2017/2","2017/1","2016/2","2015/2"]},"oyun":null,"tip":"teori","soru":"Bir meslek mensubu, beş yıllık bir dönem içinde iki defa geçici olarak mesleki faaliyetten alıkoyma cezası ile cezalandırılmış, bu cezaları gerektiren fiili yeniden işlemiştir. 3568 sayılı Kanun\u0027a göre bu meslek mensubu hakkında hangi disiplin cezası uygulanır?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-01","verilenler":[{"deger":"beş yıllık bir dönem","anlam":"Kanunun özel ağırlaştırma eşiği için aradığı zaman aralığı; bu süre içindeki tekrar önem taşır.","ad":"Ceza tekrar süresi"},{"deger":"iki defa geçici alıkoyma cezası","anlam":"Kanunun meslekten çıkarma sonucunu bağladığı eşik sayısı; üçüncü fiil bu eşiği tamamlar.","ad":"Alınan ceza sayısı"}],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.48/2 (beş yıllık dönemde iki defa mesleki faaliyetten alıkoyma cezası alan meslek mensubunun fiili yeniden işlemesi halinde meslekten çıkarma cezası uygulanır)","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Serbest muhasebeci mali müşavir Kemal Bey, 2016 yılında görevini bağımsızlık ilkesine aykırı yaptığı için 8 ay geçici olarak mesleki faaliyetten alıkoyma cezası almış. 2019 yılında aynı fiili tekrar işlemiş ve yine geçici alıkoyma cezası almış. 2021 yılında Kemal Bey üçüncü kez aynı fiili işliyor: yine tarafsızlığını bozarak görevini kusurlu yapıyor.","anlatim":"Kemal Bey beş yıl içinde iki kez alıkoyma cezası yemiş, sonra üçüncü kez aynı fiili tekrarlamış. Disiplin kurulu şimdi ne karar vermeli, onu çözeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Kanun m.48/2 diyor ki, beş yıllık dönemde iki defa alıkoyma cezası alan kişi bu fiili yeniden işlerse sonuç meslekten çıkarmadır. Kemal Bey tam bu kalıba giriyor: iki alıkoyma cezası var, üçüncü kez aynı fiil var. Şimdi beş şıkkı bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"m.48/2","karar":"yanlış","anlatim":"Kanun burada üçüncü tekrarda aynı cezayı sürdürmüyor. Beş yıl içinde iki alıkoyma sonrası fiil tekrarında sonuç doğrudan meslekten çıkarmadır. Kurul üçüncü kez alıkoyma cezası veremez.","formul":"Şık A: Disiplin kurulu \u0027üçüncü kez de alıkoyma cezası verelim\u0027 diyor, doğru mu yapıyor?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"m.48/2","karar":"yanlış","anlatim":"Takdir yetkisi bir derece ağır veya hafif ceza için var ama burada kanun sonucu kesin şekilde bağlamış. Kemal Bey\u0027in durumunda kınamaya inmek mümkün değil.","formul":"Şık B: Kurul \u0027takdir hakkımız var, kınama cezası da verebiliriz\u0027 diyor, haklı mı?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"m.48/1","karar":"yanlış","anlatim":"Yeminli sıfatının kaldırılması sadece tasdik yetkisinin gerçeğe aykırı kullanımının tekrarında uygulanır. Kemal Bey\u0027in olayı tasdik yetkisiyle ilgili değil, bu ceza burada söz konusu olamaz.","formul":"Şık C: Kurul \u0027yeminli sıfatını kaldırıp üstüne meslekten çıkarmayı da birlikte uygulayalım\u0027 diyor, doğru mu?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"m.48/1","karar":"yanlış","anlatim":"İlk defa uyarma kuralı mesleğin vakar ve onuruna aykırı genel fiiller içindir. Kemal Bey zaten iki kez cezalandırılmış, bu ilk fiil değil.","formul":"Şık D: Kurul \u0027bu üçüncü fiil ama ilk defa gibi sayalım, uyarma verelim\u0027 diyor, uyar mısın?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"m.48/2","karar":"doğru","anlatim":"Kanun tam bu durumu düzenlemiş: iki alıkoyma cezası sonrası fiilin tekrarı meslekten çıkarma sebebidir. Kemal Bey\u0027in olayı bu kalıba birebir uyuyor, kurul doğru karar veriyor.","formul":"Şık E: Kurul \u0027beş yıl içinde iki alıkoyma cezası var, üçüncü kez fiil tekrarlandı, meslekten çıkaralım\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Beş yıl içinde iki alıkoyma cezası sonrası aynı fiilin tekrarı kanunda özel olarak meslekten çıkarmaya bağlanmış, genel takdir kuralları burada geçersiz. Kendine sor: bu olay kanunun özel düzenlediği \u0027iki alıkoyma + tekrar\u0027 kalıbına mı giriyor, yoksa genel disiplin kademelemesine mi tabi?","doldur":[]}],"anahtar":[{"ornek":"mesleki","kok":"meslek"},{"ornek":"alıkoyma","kok":"alıkoy"},{"ornek":"cezası","kok":"cezası"},{"ornek":"tekrarlamış","kok":"tekrar"},{"ornek":"çıkarma","kok":"çıkarm"},{"ornek":"içinde","kok":"içinde"}],"konuGiris":{"harita":"Ne zaman uygulanır: aynı cezayı gerektiren fiil belirli bir süre içinde tekrarlandığında. Nasıl belirlenir: kanunda sayılan disiplin cezaları arasından fiilin ağırlığına ve tekrar sayısına göre seçilir. Nasıl kesinleşir: savunma alındıktan ve karar kesinleştikten sonra uygulanır.","desen":"Sınav genelde beş yıl içinde iki kez alıkoyma cezası alıp fiili tekrarlayan meslek mensubuna hangi cezanın verileceğini sorar; tuzak, öğrencinin bunu kınama veya yeniden alıkoyma sanmasıdır. Doğru cevap doğrudan meslekten çıkarmadır, ara ceza yoktur. Bu soru m.48 son fıkralar noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Altı aydan az bir yıldan çok olmamak üzere mesleki faaliyeti durdurma cezası","ad":"Geçici alıkoyma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ruhsatın geri alınıp mesleğin bir daha icra edilememesi","ad":"Meslekten çıkarma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Aynı cezanın tekrarının değerlendirildiği beş yıllık zaman aralığı","ad":"Tekerrür süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tekrarlanan fiilde bir önceki cezadan daha ağırının uygulanabilmesi","ad":"Ağırlaştırma kuralı","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Meslek mensubunun geçmiş ceza sayısı ve süresi verilir, uygulanacak disiplin cezası istenir.","panel_ornek":"Bir öğrenci okulda üç ay içinde iki kez sınavda kopya çekmekten uyarı almış, üçüncü kez aynı şeyi yapınca okuldan uzaklaştırılmış. Küçük kurallar tekrar edilince ceza büyür, en ağırına çıkar. Burada sayı üç ve iki, olayın sayılarıyla ilgisi yoktur.","ornek":"Bir öğrenci okulda üç ay içinde iki kez sınavda kopya çekmekten uyarı almış, üçüncü kez aynı şeyi yapınca okuldan uzaklaştırılmış. Küçük kurallar tekrar edilince ceza büyür, en ağırına çıkar. Burada sayı üç ve iki, olayın sayılarıyla ilgisi yoktur.","yontemler":"Süre ve tekrar sayısını kanundaki eşiklerle karşılaştır; beş yılda iki alıkoyma cezası sonrası üçüncü tekrar doğrudan meslekten çıkarmayı gerektirir.","nedir":"Disiplin cezaları, meslek mensuplarının kurallara aykırı davranışlarına karşı uygulanan kanuni yaptırımlardır. Sınav, hangi fiile hangi cezanın verileceğini ve tekrar halinde cezanın nasıl ağırlaştığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Karma Ceza Tuzağı","metin":"Yeminli sıfatının kaldırılmasını her ağır disiplin olayına otomatik eklenen bir ek ceza sanırsın. Doğrusu: Yeminli sıfatının kaldırılması yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrürüne özgüdür, bu olayla ilgisi yoktur."},"A":{"ad":"Üçüncü Kez Uygulama Tuzağı","metin":"Aynı cezanın tekrarlanacağını düşünürsün. Doğrusu: Kanun, beş yıl içinde iki alıkoyma cezası sonrası fiilin tekrarında üçüncü kez alıkoyma değil, doğrudan meslekten çıkarma cezası öngörür."},"D":{"ad":"İlk Fiil Varsayımı Tuzağı","metin":"Her olayı ilk defa işlenen fiil kabul edip mutlaka uyarmayla başlanacağını düşünürsün. Doğrusu: Ne soruluyor: Beş yıl içinde iki kez alıkoyma cezası alan meslek mensubunun fiili yeniden işlemesinin sonucu sorulmaktadır. Kural: 3568 sayılı Kanun m.48/2 uyarınca beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası alan meslek mensubunun bu cezayı gerektiren fiili yeniden işlemesi halinde meslekten çıkarma cezası uygulanır. Doğrusu: Meslek mensubu hakkında meslekten çıkarma cezası verilir."},"B":{"ad":"Genel Takdir Yetkisi Tuzağı","metin":"Disiplin kurulunun bir derece hafif ceza takdir edebileceği genel yetkiyi burada da uygulanabilir sanırsın. Doğrusu: Beş yıl içinde iki alıkoyma cezası sonrası tekrarda kanun sonucu kesin olarak belirlemiştir, takdir alanı yoktur."}},"celdiriciYol":null,"hap":"Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası alan meslek mensubu bu fiili yeniden işlerse, kanun gereği doğrudan meslekten çıkarma cezası uygulanır.","teshis":{"C":{"gercek":"Yeminli sıfatının kaldırılması yalnız tasdik yetkisinin gerçeğe aykırı kullanımının tekerrürüne özgüdür, burada söz konusu değildir.","ayirt":"Olay tasdik yetkisinin kötüye kullanılmasıyla mı ilgili, yoksa alıkoyma cezasının tekrarıyla mı?","paragraf":"m.48/1","yanilgi":"Yeminli sıfatının kaldırılmasını her ağır disiplin olayına eklenen otomatik bir ek ceza sanıyorsun."},"E":{"gercek":"Kanun, beş yıllık dönemde iki alıkoyma cezası sonrası aynı fiilin yeniden işlenmesini açıkça meslekten çıkarma sebebi olarak düzenlemiştir.","ayirt":"Olay, kanunun özel olarak düzenlediği \u0027iki alıkoyma + tekrar\u0027 kalıbına mı uyuyor?","paragraf":"m.48/2","yanilgi":"Beş yıl içindeki tekrarın kanunda özel ve kesin bir sonucu olduğunu fark etmeyip genel ağırlaştırma ya da takdir kurallarına yöneliyorsun."},"A":{"gercek":"Kanun, beş yıl içinde iki alıkoyma cezası sonrası fiilin tekrarında otomatik olarak meslekten çıkarma öngörür; üçüncü kez alıkoyma uygulanmaz.","ayirt":"Kanun üçüncü tekrarda hâlâ aynı cezayı mı öngörüyor, yoksa ağırlaştırma mı getiriyor?","paragraf":"m.48/2","yanilgi":"Aynı cezanın tekrarlanacağını, üçüncü kez de alıkoyma cezası verileceğini düşünüyorsun."},"D":{"gercek":"İlk defasında uyarma kuralı mesleğin vakar ve onuruna aykırı genel fiiller içindir; burada geçmişte iki kez cezalandırılmış bir meslek mensubu söz konusudur.","ayirt":"Meslek mensubu bu fiili ilk kez mi işliyor, yoksa geçmişte cezalandırılmış mı?","paragraf":"m.48/1","yanilgi":"Her disiplin olayını ilk fiil kabul edip mutlaka uyarmayla başlanacağını düşünüyorsun."},"B":{"gercek":"Takdir yetkisi kanunda açıkça öngörülmeyen durumlar içindir; beş yıl içinde iki alıkoyma cezası sonrası tekrar halinde sonuç kanunla kesin olarak meslekten çıkarmadır.","ayirt":"Kanun bu duruma özel kesin bir sonuç mu bağlamış, yoksa genel takdir mi geçerli?","paragraf":"m.48/2","yanilgi":"Disiplin kurulunun bir derece hafif ceza takdir edebileceği genel yetkinin burada da uygulanabileceğini sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":11,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 102"},"kural":"Doğrusu: 6460 sayılı Kanunla eklenen fıkra uyarınca mesken olarak gösterilen bağımsız bölümlerde büro açılması kat maliklerinin izni ve benzeri şartlar aranmaksızın mümkündür; yönetim planındaki aksine hükümler de uygulanmaz. İfadedeki \u0027oy birliğiyle izne bağlıdır\u0027 koşulu kanunun aradığı kuralın tam tersidir, bu yüzden yanlış olan şık budur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 102","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"\u0027İzin aranmaksızın\u0027 ibaresi geçen istisna fıkralarında şıkkın tam tersi yazılıp yazılmadığını kontrol et, bu sınavın klasik ters çevirme tuzağıdır.","konu":"büro edinme zorunluluğu","tablo":null,"siklar":{"C":"Şirket şeklinde çalışılması halinde yapılan işlerden doğacak cezai sorumluluk, şirket tüzel kişiliğine değil işi fiilen yapan meslek mensubuna aittir.","E":"Kat Mülkiyeti Kanununa göre anagayrimenkulün mesken olarak gösterilen bağımsız bölümlerinde büro açılabilmesi, kat maliklerinin oy birliğiyle vereceği izne bağlıdır.","A":"Yeminli mali müşavirler muhasebe ile ilgili defter tutamaz, muhasebe bürosu açamaz ve muhasebe bürolarına ortak olamazlar.","D":"Meslek mensupları, kişisel veya ortak bürolarında mesleği icra etmeleri yasaklanan kişileri çalıştıramayacakları gibi bunlarla mesleki işbirliği de yapamazlar.","B":"Birden çok meslek mensubu çalışmalarını serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik ortaklık bürosu ya da şirket şeklinde birleştirebilir; bu bürolarda yapılan faaliyetler ticari faaliyet sayılmaz."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.13","metin":"Madde 13 – Meslek mensupları, kişisel veya ortak bürolarında mesleği yapmaları yasaklananları çalıştıramayacakları gibi, bunlarla her ne şekilde olursa olsun meslekleri ile ilgili işbirliği yapamazlar. İKİNCİ BÖLÜM Serbert Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Odalar, nitelikleri ve faaliyet sınırı"},{"ad":"SMMM K. (3568 s.K.) m.45 [1/2]","metin":"Madde 45 –(…)19 serbest muhasebeci mali müşavirler bu unvanlarla, yeminli mali müşavirler ise bu unvan ve tasdik yetkisiyle; 2 nci maddede yazılı işlerin yürütülmesi amacıyla gerçek ve tüzelkişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar, ticari faaliyette bulunamazlar, meslekle ve meslek onuru ile bağdaşmayan işlerle uğraşamazlar. Yeminli mali müşavirler, eşi (boşanmış dahi olsa) usul ve füruundan biri ve 3 üncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının veya bunların ortak oldukları firmaların işlerine bakamazlar, yukarıda sayılan yakınlıktaki akrabaları olan (…)19 serbest muhasebeci mali müşavirlerin baktığı işleri tasdik edemezler. (Değişik üçüncü fıkra: 23/7/2010-6009/47 md.) Hayri ve ilmi kuruluşlar, 233 sayılı Kamu İktisadi Teşebbüsleri Hakkında Kanun Hükmünde Kararname kapsamındaki iktisadi devlet teşekkülleri, kamu iktisadi kuruluşları ve bunların müesseseleri, bağlı ortaklıkları ve iştirakleri, kamu idarelerinin doğrudan ya da dolaylı hissedarı olduğu kurumlar ile Tasarruf Mevduatı Sigorta Fonunun yönetimindeki kurumların bu Kanun kapsamındaki faaliyetlerini yürütmemeleri şartıyla, bu kurum ve kuruluşların yönetim kurulu başkanlığı, üyeliği, denetçiliği görevleri ile bilirkişilik ve tasfiye memurluğu meslekle bağdaşmayan işler sayılmaz. Bu madde başlığı “Reklam yasağı” iken, 10/7/2008 tarihli ve 5786 sayılı Kanunun 17 nci maddesiyle metne işlendiği şekilde değiştirilmiştir. 19 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"Serbest muhasebeciler,\", \"serbest muhasebecilerin ve\", \"serbe…"}],"hakem":"Doğru sık (E), 3568 sayılı SMMM Kanunu m.45\u0027in 6460 sayılı Kanunla eklenen fıkrasında yer alan hüküme dayanmakta ve kaynak metinde açıkça desteklenmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/1","2021/2","2020/3"]},"oyun":null,"tip":"teori","soru":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre büro edinme ve meslek icrasına ilişkin aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-03","verilenler":[],"dayanak":"3568 sayılı SMMM Kanunu m.2/B, m.13, m.45 (6460 s.K. m.9 ile eklenen fıkra)","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[],"anahtar":[{"ornek":"planındaki","kok":"planın"},{"ornek":"mesken","kok":"mesken"},{"ornek":"hükümler","kok":"hüküml"},{"ornek":"yönetim","kok":"yöneti"},{"ornek":"bağımsız","kok":"bağıms"},{"ornek":"maliklerinin","kok":"malikl"}],"konuGiris":{"harita":"Ne zaman test edilir: meslek mensubunun büro, ortaklık veya bağımlı çalışma durumu tarif edildiğinde. Nasıl ölçülür: verilen davranışın kanunda sayılan yasaklardan (ticari faaliyet, hizmet akdiyle çalışma, reklam, akraba işi tasdik etme) hangisine girip girmediği tespit edilerek. Nasıl kaydedilir: doğru-yanlış eşleştirmesi yerine \u0027hangisi yanlıştır\u0027 sorusunda tek aykırı ifade işaretlenerek.","desen":"Sınav genellikle dört-beş ifade sıralar; üçü kanunun izin verdiği (ortak büro, mesken bağımsız bölümde büro açma) durumları, biri yasak olanı (hizmet akdiyle çalışma, reklam) anlatır. Tuzak, \u0027ortak büro ticari faaliyet sayılır\u0027 gibi kanunun tersini söyleyen ifadedir. Bu soru m.45 ve m.13\u0027teki yasak/serbest ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensupları bireysel veya ortak büro kurabilir, bu ticari faaliyet sayılmaz.","ad":"Büro/ortaklık serbestisi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubu unvanıyla işverene bağlı olarak ücretli çalışamaz.","ad":"Hizmet akdiyle çalışma yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İş elde etmek amacıyla reklam sayılan faaliyette bulunulamaz.","ad":"Reklam yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yeminli mali müşavir belirli derecede akrabasının işini tasdik edemez.","ad":"Akraba işi tasdik yasağı","kim":"kanun sabitler"}],"sinavda":"Meslek icrası ve büro edinmeyle ilgili birkaç ifade verilir, kanuna aykırı olan tek ifade istenir.","panel_ornek":"Bir arkadaşın kuaförlük belgesi alıyor ama aynı zamanda başka bir dükkanda tam zamanlı kasiyer olarak da çalışmak istiyor; ustası ona ikisini birlikte yürütemeyeceğini, ya dükkan açacağını ya da bağımlı çalışacağını söylüyor. Meslek belgesi almak başka, o unvanla bağımlı çalışmak başkadır.","ornek":"Bir arkadaşın kuaförlük belgesi alıyor ama aynı zamanda başka bir dükkanda tam zamanlı kasiyer olarak da çalışmak istiyor; ustası ona ikisini birlikte yürütemeyeceğini, ya dükkan açacağını ya da bağımlı çalışacağını söylüyor. Meslek belgesi almak başka, o unvanla bağımlı çalışmak başkadır.","yontemler":"Her ifadeyi \u0027kanun bunu yasaklıyor mu, serbest mi bırakıyor mu\u0027 diye tek tek kontrol et; en kritik kural, hizmet akdiyle çalışma ve ticari faaliyetin kesin yasak olduğudur.","nedir":"Bu konu, meslek mensuplarının büro açma, ortaklık kurma ve meslek icrasındaki yasakları düzenler. Sınav, hangi davranışın kanunen serbest hangi davranışın yasak olduğunu ayırt etmeni ölçer."},"olay":"","tuzak":{"C":{"ad":"Tüzel Kişilik Sorumluluğu Tuzağı","metin":"şirket kurulunca sorumluluğun da şirkete geçtiğini sanırsın. Doğrusu: Kanun, şirket şeklinde çalışmada dahi cezai sorumluluğu işi bizzat yapan meslek mensubunda bırakır; ifade doğrudur."},"A":{"ad":"Ne soruluyor","metin":"beş ifadeden hangisinin Kanun\u0027a aykırı olduğu soruluyor. Kural: yeminli mali müşavirlerin muhasebe defteri tutamayacağı, muhasebe bürosu açamayacağı ve muhasebe bürolarına ortak olamayacağı Kanun\u0027un 2 nci maddesinin B fıkrasında açıkça düzenlenmiştir. Doğrusu: bu ifade Kanun metniyle birebir örtüştüğünden doğrudur, yanlış şık bu değildir."},"D":{"ad":"İşbirliği Kapsamı Tuzağı","metin":"yasağın yalnız çalıştırmayı kapsadığını, işbirliğini kapsamadığını sanırsın. Doğrusu: Kanun\u0027un 13 üncü maddesi hem çalıştırmayı hem her türlü mesleki işbirliğini birlikte yasaklar; ifade doğrudur."},"B":{"ad":"Sınırlı Ortaklık Tuzağı","metin":"bu tür bürolaşmanın ticari faaliyet sayılacağını düşünüp ifadeyi yanlış zannedersin. Doğrusu: Kanun\u0027un 45 inci maddesi bu birleşmeyi açıkça öngörür ve bu bürolarda yapılan faaliyeti ticari faaliyet saymaz; ifade doğrudur."}},"celdiriciYol":{},"hap":"Mesken nitelikli bağımsız bölümlerde meslek icrası için kat maliklerinin izni ve yönetim planındaki aksi hükümler aranmaz.","teshis":{"C":{"gercek":"3568 sayılı Kanun m.45, şirket şeklinde çalışmada dahi cezai sorumluluğu işi yapan meslek mensubuna yükler.","ayirt":"Cezai sorumluluk şirkete mi, yoksa işlemi bizzat yapan kişiye mi aittir?","paragraf":"3568 s.K. m.45","yanilgi":"Şirket kurulunca sorumluluğun şirkete geçtiğini, işi yapan kişinin korunacağını sanıyorsun."},"E":{"gercek":"3568 sayılı Kanun m.45\u0027e eklenen fıkra, mesken nitelikli bağımsız bölümlerde büronun kat maliklerinin izni aranmaksızın açılabileceğini, yönetim planındaki aksi hükümlerin dahi uygulanmayacağını söyler.","ayirt":"Kanun bu izni \u0027arar\u0027 mı yoksa açıkça \u0027aramaz\u0027 mı diyor?","paragraf":"3568 s.K. m.45, ek fıkra (6460 s.K. m.9)","yanilgi":"Meskende büro açmanın da tıpkı diğer taşınmazlarda olduğu gibi kat maliklerinin rızasına bağlı olduğunu sanıyorsun."},"A":{"gercek":"3568 sayılı Kanun m.2/B, yeminli mali müşavirlere defter tutma ve muhasebe bürosu açma/ortak olma yasağını açıkça koyar.","ayirt":"Bu meslek mensubu tasdik mi yapıyor, yoksa muhasebe kaydı mı tutuyor?","paragraf":"3568 s.K. m.2/B","yanilgi":"Yeminli mali müşavirlerin de serbest muhasebecilik yapabileceğini, dolayısıyla muhasebe bürosu açabileceğini düşünüyorsun."},"D":{"gercek":"3568 sayılı Kanun m.13, hem çalıştırmayı hem her ne şekilde olursa olsun mesleki işbirliğini birlikte yasaklar.","ayirt":"Yasaklı kişiyle ilişki çalıştırma biçiminde olmasa bile bir işbirliği midir?","paragraf":"3568 s.K. m.13","yanilgi":"Yasağın yalnız \u0027çalıştırma\u0027yı kapsadığını, işbirliğini kapsamadığını düşünüyorsun."},"B":{"gercek":"3568 sayılı Kanun m.45, ortaklık bürosu ve şirket şeklindeki birleşmeyi meslek icrası sayar, ticari faaliyet saymaz.","ayirt":"Bu birleşme meslek mensuplarının kendi mesleğini mi, yoksa ticari bir işi mi yürütüyor?","paragraf":"3568 s.K. m.45","yanilgi":"Birden fazla meslek mensubunun bir araya gelerek kurduğu ortaklık bürosunu ticari işletme sanıyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 106"},"kural":"3568 sayılı Kanunun 45 inci maddesinin birinci fıkrasına göre meslek mensupları, gerçek ve tüzel kişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 106","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 45 sorularında önce \u0027genel yasak\u0027 cümlesini (hizmet akdi/ticari faaliyet) bul, sonra üçüncü fıkradaki şartlı istisna listesini ele; istisna listesindeki görev adları çeldiricidir.","konu":"meslekle bağdaşmayan işler","tablo":{"satirlar":[["A) Gerçek kişiye tabi olarak ve onun işyerine bağlı biçimde…","3568 s.K. m.45/1","doğru ifade"],["B) Tasarruf Mevduatı Sigorta Fonunun yönetimindeki bir kuru…","3568 s.K. m.45/3","YANLIŞ ifade"],["C) Kamu iktisadi kuruluşunun bağlı ortaklığında tasfiye mem…","3568 s.K. m.45/3","YANLIŞ ifade"],["D) Diğer meslek mensuplarıyla ortaklık bürosu kurarak mesle…","3568 s.K. m.45/2","YANLIŞ ifade"],["E) İktisadi devlet teşekkülünün yönetim kurulu üyeliğini yü…","3568 s.K. m.45/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kamu iktisadi kuruluşunun bağlı ortaklığında tasfiye memurluğu görevinde bulunmak","E":"İktisadi devlet teşekkülünün yönetim kurulu üyeliğini yürütmek","A":"Gerçek kişiye tabi olarak ve onun işyerine bağlı biçimde hizmet akdiyle çalışmak","D":"Diğer meslek mensuplarıyla ortaklık bürosu kurarak mesleki faaliyeti birleştirmek","B":"Tasarruf Mevduatı Sigorta Fonunun yönetimindeki bir kurumda bilirkişilik yapmak"},"kaynak":{"alinti":"gerçek ve tüzel kişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar","liste":[{"ad":"SMMM K. (3568 s.K.) m.45 [1/2]","metin":"Madde 45 –(…)19 serbest muhasebeci mali müşavirler bu unvanlarla, yeminli mali müşavirler ise bu unvan ve tasdik yetkisiyle; 2 nci maddede yazılı işlerin yürütülmesi amacıyla gerçek ve tüzelkişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar, ticari faaliyette bulunamazlar, meslekle ve meslek onuru ile bağdaşmayan işlerle uğraşamazlar. Yeminli mali müşavirler, eşi (boşanmış dahi olsa) usul ve füruundan biri ve 3 üncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının veya bunların ortak oldukları firmaların işlerine bakamazlar, yukarıda sayılan yakınlıktaki akrabaları olan (…)19 serbest muhasebeci mali müşavirlerin baktığı işleri tasdik edemezler. (Değişik üçüncü fıkra: 23/7/2010-6009/47 md.) Hayri ve ilmi kuruluşlar, 233 sayılı Kamu İktisadi Teşebbüsleri Hakkında Kanun Hükmünde Kararname kapsamındaki iktisadi devlet teşekkülleri, kamu iktisadi kuruluşları ve bunların müesseseleri, bağlı ortaklıkları ve iştirakleri, kamu idarelerinin doğrudan ya da dolaylı hissedarı olduğu kurumlar ile Tasarruf Mevduatı Sigorta Fonunun yönetimindeki kurumların bu Kanun kapsamındaki faaliyetlerini yürütmemeleri şartıyla, bu kurum ve kuruluşların yönetim kurulu başkanlığı, üyeliği, denetçiliği görevleri ile bilirkişilik ve tasfiye memurluğu meslekle bağdaşmayan işler sayılmaz. Bu madde başlığı “Reklam yasağı” iken, 10/7/2008 tarihli ve 5786 sayılı Kanunun 17 nci maddesiyle metne işlendiği şekilde değiştirilmiştir. 19 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"Serbest muhasebeciler,\", \"serbest muhasebecilerin ve\", \"serbe…"},{"ad":"SMMM K. (3568 s.K.) m.45 [2/2]","metin":"18 Birden çok meslek mensubu çalışmalarını; (…)19 serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik ortaklık bürosu veya şirket şeklinde birleştirebilirler. Bu bürolarda yapılan faaliyetler ticari faaliyet sayılmaz. Şirket şeklinde çalışılması halinde, yapılan işlerden doğacak cezai sorumluluk işi yapan meslek mensubuna aittir. (Ek fıkra: 10/7/2008-5786/18 md.) Meslek mensupları, iş elde etmek için reklâm sayılabilecek faaliyetlerde bulunamazlar. Tabela veya basılı kağıtlarında ruhsatname ile belirlenen mesleki unvanları dışında başka sıfat kullanamazlar. (Ek fıkra: 30/4/2013-6460/9 md.) 23/6/1965 tarihli ve 634 sayılı Kat Mülkiyeti Kanununa göre anagayrimenkulün mesken olarak gösterilen bağımsız bölümlerinde kat maliklerinin izni ve benzeri şartlar aranmaksızın serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik faaliyetlerinde bulunulabilir. Bu konuda, yönetim planındaki aksine hükümler uygulanmaz. Ücret20"}],"hakem":"Kaynak metinde 3568 s.K. m.45/1 açıkça \u0027gerçek ve tüzel kişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar\u0027 hükmü bulunmaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/2","2022/2"]},"oyun":null,"tip":"teori","soru":"Serbest Muhasebeci Mali Müşavirlik Kanunu\u0027na göre aşağıdaki görevlerden hangisi meslek mensubu için meslekle bağdaşmayan işlerdendir?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-06","verilenler":[],"dayanak":"3568 s. SMMM K. m.45","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ahmet Bey, SMMM ruhsatına sahip. Bir tekstil firması ona ayda 15.000 TL maaşla, işyerine bağlı, hizmet akdiyle \u0027muhasebe müdürü\u0027 olarak çalışmasını teklif ediyor.","anlatim":"Ahmet Bey bu teklifi kabul edip işe başlıyor, patronun emrinde, işyerine bağlı çalışıyor. Şimdi bu beş görev türünü tek tek bu tarz olaylarla test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun m.45\u0027e göre bazı görevler meslekle bağdaşmaz, bazıları istisna sayılır.","anlatim":"m.45/1 hizmet akdiyle bağımlı çalışmayı doğrudan yasaklar. m.45/3 ise TMSF, KİT, iktisadi devlet teşekkülü gibi kurumlarda kanun kapsamındaki faaliyeti yürütmeme şartıyla bazı görevleri istisna sayar. Şimdi beş şıkkı Ahmet Bey\u0027in olayı üzerinden tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"3568 s.K. m.45/1","karar":"doğru","anlatim":"Evet, bu tam olarak m.45/1\u0027in yasakladığı durum. Gerçek kişiye tabi ve işyerine bağlı hizmet akdi, hiçbir istisnaya girmiyor.","formul":"Şık A: Ahmet Bey, tekstil firmasının işyerine bağlı olarak hizmet akdiyle maaşlı çalışıyor, bu meslekle bağdaşmayan bir iş midir?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"3568 s.K. m.45/3","karar":"yanlış","anlatim":"Hayır, kurum kanun kapsamındaki faaliyeti bizzat yürütmüyorsa bilirkişilik istisnadır. m.45/3 bunu açıkça sayıyor.","formul":"Şık B: Ahmet Bey, TMSF yönetimindeki bir bankada sadece bilirkişilik görevi alıyor, bu meslekle bağdaşmaz mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"3568 s.K. m.45/3","karar":"yanlış","anlatim":"Hayır, tasfiye memurluğu da m.45/3\u0027te sayılan istisnalardan biri. Şart yine kuruluşun kanun kapsamındaki faaliyeti yürütmemesi.","formul":"Şık C: Ahmet Bey, bir kamu iktisadi kuruluşunun bağlı ortaklığında tasfiye memurluğu yapıyor, bu meslekle bağdaşmaz mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"3568 s.K. m.45/2","karar":"yanlış","anlatim":"Hayır, kanun bu bürolarda yapılan işi açıkça ticari faaliyet saymaz. Birden fazla meslek mensubunun büro veya şirket kurması serbestçe mümkündür.","formul":"Şık D: Ahmet Bey, üç meslektaşıyla birlikte ortaklık bürosu kurup mesleki faaliyetlerini birleştiriyor, bu meslekle bağdaşmaz mı yoksa ticari faaliyet mi sayılır?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"3568 s.K. m.45/3","karar":"yanlış","anlatim":"Hayır, yönetim kurulu üyeliği de kuruluş kanun kapsamındaki faaliyeti yürütmediği sürece istisna sayılır. Yine m.45/3\u0027ün kapsamına giriyor.","formul":"Şık E: Ahmet Bey, bir iktisadi devlet teşekkülünün yönetim kurulu üyeliğini yürütüyor, bu meslekle bağdaşmaz mı?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Hizmet akdiyle bağımlı çalışmak istisnasız yasaktır, diğer dört görev ise şartlı istisna sayılır. Kendine hep şunu sor: bu görev bağımlı hizmet akdi mi, yoksa şart taşıyan bir istisna listesinde mi?","doldur":[]}],"anahtar":[{"ornek":"istisnadır","kok":"istisn"},{"ornek":"hizmet","kok":"hizmet"},{"ornek":"kapsamındaki","kok":"kapsam"},{"ornek":"faaliyeti","kok":"faaliy"},{"ornek":"kuruluşlarındaki","kok":"kurulu"},{"ornek":"yürütmediği","kok":"yürütm"}],"konuGiris":{"harita":"Ne zaman test edilir: meslek mensubunun hangi faaliyeti yapıp yapamayacağı sorulduğunda. Nasıl ölçülür: kanun metnindeki yasak fiiller ile istisna sayılan görevler karşılaştırılarak. Nasıl kaydedilir: madde 45\u0027teki sayım esas alınarak doğru/yanlış şık belirlenir.","desen":"Sınav, hizmet akdiyle çalışma, ticari faaliyet ve reklam yasağını doğru sayan ama istisna görevleri (bilirkişilik, tasfiye memurluğu) yanlış yasak gösteren şıklarla karıştırır. Tuzak, kamu kurumlarındaki yönetim kurulu üyeliği gibi görevlerin istisna olduğunu bilmemekten kaynaklanır. Bu soru madde 45\u0027teki sayım ile istisna fıkrasının karşılaştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"meslek mensubunun gerçek/tüzel kişiye bağlı olarak maaşlı çalışamaması","ad":"Hizmet akdiyle çalışma yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"meslek mensubunun unvanıyla birlikte ticaretle uğraşamaması","ad":"Ticari faaliyet yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"iş elde etmek için reklam sayılan faaliyetlerde bulunamama kuralı","ad":"Reklam yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"kamu kuruluşlarında yönetim kurulu, bilirkişilik gibi bağdaşmayan iş sayılmayan görevler","ad":"İstisna sayılan görevler","kim":"kanun sabitler"}],"sinavda":"Şıklardan biri seçilerek hangisinin meslekle bağdaşmayan iş olduğu belirlenir.","panel_ornek":"Bir arkadaşın hem berberlik yapıp hem de resmi olarak polislik yapamayacağını düşün, çünkü ikisi bir arada yürütülemeyen görevlerdir. Meslek mensubu da unvanını taşırken bazı işleri aynı anda yapamaz. Örneğin biri hem muhasebecilik yapıp hem de bir firmada maaşlı işçi gibi çalışamaz.","ornek":"Bir arkadaşın hem berberlik yapıp hem de resmi olarak polislik yapamayacağını düşün, çünkü ikisi bir arada yürütülemeyen görevlerdir. Meslek mensubu da unvanını taşırken bazı işleri aynı anda yapamaz. Örneğin biri hem muhasebecilik yapıp hem de bir firmada maaşlı işçi gibi çalışamaz.","yontemler":"Madde 45\u0027teki yasaklanan fiiller (hizmet akdi, ticaret, reklam) ile istisna tutulan görevler (bilirkişilik, tasfiye memurluğu, kamu kuruluşu yöneticiliği) ayrı ayrı ezberlenmelidir.","nedir":"Bu konu, SMMM ve YMM\u0027lerin meslek unvanıyla birlikte yapamayacağı işleri düzenler. Sınav, hangi faaliyetin yasak sayılıp hangisinin istisna kabul edildiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Görev Adı Benzeşmesi Tuzağı","metin":"tasfiye memurluğunu her koşulda yasak sanırsın; oysa kanun kamu iktisadi teşebbüsleri ve bağlı ortaklıklarında bu görevi, ilgili kuruluşun kanun kapsamındaki faaliyeti yürütmemesi şartıyla istisna saymıştır. Doğrusu: bu şart altında tasfiye memurluğu bağdaşmayan iş değildir."},"E":{"ad":"Yönetim Kurulu Üyeliğini Genel Yasağa Dahil Etme Tuzağı","metin":"iktisadi devlet teşekkülündeki her görevi yasak sanırsın. Doğrusu: madde 45 üçüncü fıkra, ilgili teşekkülün kanun kapsamındaki faaliyeti yürütmemesi şartıyla yönetim kurulu başkanlığı ve üyeliğini istisna tutmuştur."},"D":{"ad":"Ortaklık Bürosunu Ticari Faaliyet Sanma Tuzağı","metin":"birden çok meslek mensubunun büro/şirket şeklinde birleşmesini ticari faaliyet zannedip bunu yasak işaretlersin. Doğrusu: madde 45 ikinci fıkrasına göre bu bürolarda yapılan faaliyet ticari faaliyet sayılmaz, dolayısıyla bağdaşmayan iş değildir."},"B":{"ad":"İstisna Kapsamını Genişletme Tuzağı","metin":"TMSF yönetimindeki kurumun 3568 sayılı Kanun kapsamındaki faaliyetlerini yürütmemesi şartıyla, bu kurumda bilirkişilik meslekle bağdaşmayan iş sayılmaz sanıp bunu \u0027bağdaşmaz\u0027 işaretlersin. Doğrusu: madde 45 üçüncü fıkra bu görevi açıkça istisna tutmuştur."}},"celdiriciYol":{"C":"Kamu iktisadi kuruluşunda tasfiye memurluğu = yasak (istisna maddesi atlanır) (istisna şartının atlanması)","E":"İktisadi devlet teşekkülünde yönetim kurulu üyeliği = yasak (istisna şartı atlanır) (istisna şartının atlanması)","D":"Ortaklık bürosu kurmak = ticari faaliyet, dolayısıyla yasak (madde 45/2\u0027nin ikinci cümlesi atlanır) (istisna cümlesinin gözardı edilmesi)","B":"TMSF kapsamındaki kurumda görev = yasak (istisna şartı gözardı edilir) (istisna şartının atlanması)"},"hap":"Meslek mensubu gerçek/tüzel kişiye tabi ve işyerine bağlı olarak hizmet akdiyle çalışamaz; kamu kuruluşlarındaki yönetim kurulu üyeliği, bilirkişilik ve tasfiye memurluğu ise ilgili kuruluş kanun kapsamındaki faaliyeti yürütmediği sürece istisnadır.","teshis":{"C":{"gercek":"Madde 45/3, kamu iktisadi teşebbüsleri ve bağlı ortaklıklarında tasfiye memurluğunu, ilgili kuruluş kanun kapsamındaki faaliyeti yürütmediği sürece istisna tutar.","ayirt":"Bu kuruluş kanun kapsamındaki mali müşavirlik faaliyetini kendisi mi yürütüyor?","paragraf":"3568 s.K. m.45/3","yanilgi":"Tasfiye memurluğunu her zaman meslekle bağdaşmaz sanıyorsun, oysa kanun bunu şarta bağlı istisna saymıştır."},"E":{"gercek":"Madde 45/3, bu kuruluşların kanun kapsamındaki faaliyetlerini yürütmemesi şartıyla yönetim kurulu başkanlığı ve üyeliğini istisna sayar.","ayirt":"Bu teşekkül kanun kapsamındaki faaliyeti bizzat mı yürütüyor, yoksa görev sadece yönetim kurulu üyeliği mi?","paragraf":"3568 s.K. m.45/3","yanilgi":"İktisadi devlet teşekkülündeki her üst düzey görevi meslekle bağdaşmaz sanıyorsun."},"A":{"gercek":"3568 sayılı Kanun m.45/1, meslek mensubunun gerçek ve tüzel kişilere tabi ve onların işyerine bağlı olarak hizmet akdiyle çalışmasını doğrudan ve istisnasız yasaklar.","ayirt":"Bu görev, madde 45 üçüncü fıkradaki sayılı istisnalar arasında mı, yoksa birinci fıkranın genel yasağı içinde mi?","paragraf":"3568 s.K. m.45/1","yanilgi":"Bu şıkkı eleyen öğrenci, hizmet akdiyle çalışmanın da bir istisnaya girebileceğini düşünür."},"D":{"gercek":"Madde 45/2, birden çok meslek mensubunun büro veya şirket şeklinde birleşmesini düzenler ve bu bürolarda yapılan faaliyetin ticari faaliyet sayılmayacağını açıkça belirtir.","ayirt":"Kanun bu birleşmeyi \u0027ticari faaliyet\u0027 olarak mı yoksa meslek icrası olarak mı nitelendiriyor?","paragraf":"3568 s.K. m.45/2","yanilgi":"Ortaklık bürosu kurmayı ticari faaliyet zannedip bunu yasak sanıyorsun."},"B":{"gercek":"Madde 45/3, TMSF yönetimindeki kurumların kanun kapsamındaki faaliyetlerini yürütmemesi şartıyla bilirkişilik görevini istisna sayar.","ayirt":"Bu kurum kanun kapsamındaki faaliyeti bizzat yürütüyor mu, yoksa görev sadece bilirkişilik mi?","paragraf":"3568 s.K. m.45/3","yanilgi":"TMSF yönetimindeki kurumda çalışılan her görevi otomatik olarak yasak sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 127"},"kural":"3568 sayılı Kanunun 12 nci maddesine göre yeminli mali müşavirler, tasdikin doğru olmaması halinde tasdikin kapsamı ile SINIRLI olmak üzere ziyaa uğratılan vergi ve cezalardan mükellefle birlikte müşterek ve müteselsil sorumludur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 127","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Sorumluluk cümlelerinde \u0027sınırlı\u0027, \u0027mükellefle birlikte\u0027, \u0027müşterek ve müteselsil\u0027 kelimelerini ara; bunlardan biri ters çevrilmişse (sınırsız, tek başına) o şık yanlıştır.","konu":"özen sorumluluğu","tablo":{"satirlar":[["A) Meslek mensuplarının, muhasebe ve denetim standartlarına…","m.6/a","doğru ifade"],["B) Yeminli mali müşavirler, görevlerine fiilen başlamadan ö…","m.11","doğru ifade"],["C) Yeminli mali müşavirler, tasdikin doğru olmaması halinde…","m.12/2","YANLIŞ ifade"],["D) Yeminli mali müşavirlerin tasdikten doğan mali sorumlulu…","m.12 ek fıkra","doğru ifade"],["E) Yeminli mali müşavirler, yaptıkları tasdikin kapsamını d…","m.12/2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yeminli mali müşavirler, tasdikin doğru olmaması halinde ziyaa uğratılan vergi ve cezalardan, tasdikin kapsamı sınırı olmaksızın tek başına sorumludur.","E":"Yeminli mali müşavirler, yaptıkları tasdikin kapsamını düzenleyecekleri raporda açıkça belirtmekle yükümlüdür.","A":"Meslek mensuplarının, muhasebe ve denetim standartlarına uymaması ile mesleki faaliyetlerin yürütülmesinde gereken mesleki özeni göstermemesi, haksız rekabet hallerinden biri olarak kabul edilir.","D":"Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları, ayrı ayrı müstakil birer raporla tespit edilir.","B":"Yeminli mali müşavirler, görevlerine fiilen başlamadan önce üzerlerine aldıkları işleri dikkat ve özenle yapacaklarına dair yemin ederler."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.12 [1/2]","metin":"Madde 12 – Yeminli mali müşavirler gerçek ve tüzelkişilerin veya bunların teşebbüs ve işletmelerinin mali tablolarının ve beyannamelerinin mevzuat hükümleri, muhasebe prensipleri ile muhasebe standartlarına uygunluğunu ve hesapların denetim standartlarına göre incelediğini tasdik ederler. Yeminli mali müşavirlerin tasdik edecekleri belgeler, tasdik konuları ile tasdike ilişkin usul ve esaslar; gerçek ve tüzelkişilerin mükellefiyet şekilleri, iş kolları ve ciroları, döviz kazandırıcı işlemleri, ithalat ve ihracatları, yatırımın miktarları ve nevileri ile belgelerin ibraz edileceği merciler esas alınmak suretiyle Maliye Bakanlığınca çıkarılacak yönetmeliklerle belirlenir. Kanunları gereğince, kamu kurum ve kuruluşlarına verilen tasdik edilmiş mali tablolar, kamu idaresinin yetkili memurlarınca, tasdikin kapsamı ölçüsünde incelenmiş bir belge olarak kabul edilir. Ancak, çeşitli kanunlarla kamu idaresine tanınan teftiş ve inceleme yetkilerinin kullanılmasına ve gerektiğinde tekrarına ait hususlar saklıdır. Yeminli mali müşavirler yaptıkları tasdikin doğruluğundan sorumludurlar. Yaptıkları tasdikin doğru olmaması ha
