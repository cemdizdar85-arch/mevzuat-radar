"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre; I. Yeminli mali müşavirlik mesleğinin konusu, (A) fıkrasının (b) ve (c) bentlerindeki işlerin yanında tasdik işlerini yapmaktır. II. Yeminli mali müşavirler muhasebe ile ilgili defter tutabilir, ancak muhasebe bürosu açamaz. III. Yetkisi olmayanlarca meslek unvanına benzer unvan kullanılması yasaktır; odalar bunu öğrenince Cumhuriyet Savcılığına bildirmek zorundadır. IV. Serbest muhasebeci mali müşavirlik mesleğinin konusu yalnızca defter tutmak ve beyanname düzenlemekten ibarettir, müşavirlik ve inceleme işlerini kapsamaz. V. Yeminli mali müşavirler, (A) fıkrasının (a) bendindeki defter tutma işini de yaparak buna tasdik işlerini ekleyebilir. Yukarıdakilerden hangileri doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-14","verilenler":[],"dayanak":"3568 s. SMMM ve YMM Kanunu m.2/A-B, m.3","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da Merve YMM, 14 Mart günü bir şirketin tam tasdik raporunu hazırlıyor, aynı zamanda köşedeki başka bir işletme için de defter tutmayı teklif ediyor.","anlatim":"Merve tasdik yapabilir ama defter tutamaz, madde bunu açıkça yasaklar. Aynı sokakta Kemal adında biri de \u0027Yeminli Mali Müşavir Kemal\u0027 tabelası asmış ama ruhsatı yok, oda bunu duyunca ne yapmalı sorusu da gündemde.","doldur":[]},{"formul":"Ne yapacağız: (A) fıkrasının b-c bentleri + tasdik = YMM işi, (a) bendi defter tutma YMM\u0027ye yasak; unvan gaspı yasak ve odaya bildirim zorunlu. Beş ifadeyi Merve ile Kemal\u0027in olayında tek tek deneyeceğiz.","anlatim":"Kural tek: YMM\u0027nin konusu b-c bendi ile tasdiktir, defter tutamaz. Unvanı kullanmaya yetkisi olmayan biri kullanırsa oda savcılığa bildirir.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.2/B","karar":"doğru","anlatim":"Evet, madde 2/B tam olarak bunu söylüyor, b ve c bentleri artı tasdik işi. Bu ifade metinle birebir örtüşür.","formul":"Şık A: Merve\u0027nin işinin tanımı \u0027b, c bentleri ve tasdik\u0027 diye mi yazılmalı, doğru mu bu tanım?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.2/B","karar":"yanlış","anlatim":"Hayır, madde üç şeyi birden yasaklar: defter tutma, büro açma, büroya ortak olma. Merve defter tutarsa kanuna aykırı davranır.","formul":"Şık B: Merve muhasebe ile ilgili defter tutabilir mi, sadece büro açması mı yasak?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.3","karar":"doğru","anlatim":"Evet, madde 3 yetkisiz unvan kullanımını yasaklar ve odaya bildirim mecburiyeti getirir. Kemal\u0027in durumu tam bu maddeye girer.","formul":"Şık C: Kemal\u0027in tabelası yasak mı, oda öğrenince savcılığa bildirmek zorunda mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.2/A","karar":"yanlış","anlatim":"Hayır, madde 2/A üç bent sayar: kayıt, müşavirlik, inceleme-tahlil-denetim. Sadece a bendine sıkıştırmak eksik ve yanlış bir tanım.","formul":"Şık D: SMMM\u0027nin işi sadece defter tutmak ve beyanname düzenlemekten ibaret mi, müşavirlik ve inceleme dışarıda mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.2/B","karar":"yanlış","anlatim":"Hayır, (a) bendi açıkça SMMM\u0027ye ait, YMM için defter tutma yasaktır. Bu ifade madde 2/B\u0027nin yasak fıkrasına ters düşer.","formul":"Şık E: Merve tasdik yaptığı gibi (a) bendindeki defter tutma işini de ekleyebilir mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✓ D ✗ E ✗","anlatim":"Merve tasdik yapar ama defter tutamaz, Kemal\u0027in durumu savcılığa gider; ikisi doğru, üçü yanlış. Kendine sor: bu ifade (a) bendini mi (b-c) bendini mi anlatıyor?","doldur":[]}],"anahtar":[{"ornek":"defter","kok":"defter"},{"ornek":"tasdik","kok":"tasdik"},{"ornek":"müşavirlik","kok":"müşavi"},{"ornek":"bendindeki","kok":"bendin"},{"ornek":"kullanımı","kok":"kullan"},{"ornek":"bentleriyle","kok":"bentle"}],"konuGiris":{"harita":"Ne zaman test edilir: iki meslek unvanının yetki alanları karşılaştırılırken test edilir. Nasıl ölçülür: her unvanın hangi bentteki işleri kapsadığı tek tek eşleştirilerek ölçülür. Nasıl kaydedilir: doğru-yanlış önermeler halinde, çoktan seçmeli önermelerin doğruluğu işaretlenerek kaydedilir.","desen":"Sınav, yeminli mali müşavirin defter tutabilir mi tutamaz mı olduğunu karıştırarak tuzak kurar; kaynak metinde açıkça \u0027defter tutamazlar\u0027 denir. Ayrıca serbest muhasebeci mali müşavirin sadece defter tutmakla sınırlı olmadığı, müşavirlik ve inceleme işlerini de kapsadığı unutulur. Bu soru madde 2 ve madde 3 hükümlerinin birlikte değerlendirilmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"defter tutma, mali müşavirlik ve inceleme işlerini yapan meslek mensubu","ad":"Serbest muhasebeci mali müşavir","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"müşavirlik, inceleme ve tasdik işlerini yapan ama defter tutamayan mensup","ad":"Yeminli mali müşavir","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"yeminli mali müşavire özgü, yönetmelikle belirlenen onay işlemi","ad":"Tasdik işi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"yetkisiz unvan kullanımının odalarca savcılığa bildirilme zorunluluğu","ad":"Unvan yasağı bildirimi","kim":"kanun sabitler"}],"sinavda":"Beş önermeden hangilerinin kanuna uygun olduğu sorulur, işlem veya hesaplama istenmez.","panel_ornek":"Bir tamirci sadece motor tamiri yapabilir ama karoseri boyama yetkisi yoktur; ustabaşı hem tamiri hem boyamayı yapıp üstüne kalite raporu da imzalayabilir. Ustabaşı isterse tamirci gibi basit işleri de yapar ama kendi dükkanını \u0027tamirci dükkanı\u0027 diye açamaz. Yetkisiz biri tabelaya \u0027ustabaşı\u0027 yazarsa esnaf odası bunu savcılığa bildirmek zorundadır.","ornek":"Bir tamirci sadece motor tamiri yapabilir ama karoseri boyama yetkisi yoktur; ustabaşı hem tamiri hem boyamayı yapıp üstüne kalite raporu da imzalayabilir. Ustabaşı isterse tamirci gibi basit işleri de yapar ama kendi dükkanını \u0027tamirci dükkanı\u0027 diye açamaz. Yetkisiz biri tabelaya \u0027ustabaşı\u0027 yazarsa esnaf odası bunu savcılığa bildirmek zorundadır.","yontemler":"Her önermeyi ilgili bent ile tek tek eşleştirip \u0027defter tutar mı, tutamaz mı\u0027 ayrımına odaklanmak en kritik kuraldır.","nedir":"Bu konu, meslek mensuplarının hangi işi yapmaya yetkili olduğunu ve unvan kullanımının sınırlarını düzenler. Sınav, yeminli mali müşavir ile serbest muhasebeci mali müşavirin görev alanlarını karıştırıp karıştırmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Kapsam Daraltma Tuzağı","metin":"IV ifadesi serbest muhasebeci mali müşavirliğin konusunu yalnızca defter tutma ve beyannameyle sınırlar; oysa Madde 2/A müşavirlik ile inceleme-tasdik işlerini de kapsar. Doğrusu: II ve IV birlikte yanlıştır."},"E":{"ad":"İki Yanlışı Birleştirme Tuzağı","metin":"Hem kapsam daraltma (IV) hem bent karıştırma (V) hataları bir arada seçilmiştir. Doğrusu: her iki ifade de yanlıştır, doğru kombinasyon I ve III\u0027tür."},"D":{"ad":"Bent Karıştırma Tuzağı","metin":"V ifadesi yeminli mali müşavirlerin (A) fıkrasının (a) bendindeki defter tutma işini de yapabileceğini öne sürer; oysa Madde 2/B bunu açıkça engeller, YMM yalnız (b), (c) bentleri ve tasdik işini yapar. Doğrusu: III doğru olsa da V yanlıştır, bu eşleşme geçersizdir."},"A":{"ad":"Ters Çevirme Tuzağı","metin":"Kanun, yeminli mali müşavirlerin muhasebe ile ilgili defter TUTAMAYACAĞINI söyler; II ifadesi bunu tersine çevirerek defter tutabileceğini iddia eder. Doğrusu: II yanlıştır, doğru eşleşme I ve III\u0027tür."}},"celdiriciYol":{},"hap":"Yeminli mali müşavirlik, (A) fıkrasının yalnız (b) ve (c) bentleriyle tasdik işini kapsar; (a) bendindeki defter tutma YMM\u0027ye yasaktır.","teshis":{"C":{"gercek":"Madde 2/A üç bent halinde defter tutma, müşavirlik ve inceleme-tahlil-denetim işlerinin tümünü SMMM\u0027nin konusu sayar.","ayirt":"Madde 2/A kaç bentten oluşuyor, IV ifadesi bunların hepsini mi kapsıyor?","paragraf":"3568 s.K. m.2/A","yanilgi":"SMMM\u0027nin görev alanını dar yorumlayıp yalnızca kayıt işlerinden ibaret sanıyorsun, müşavirlik ve inceleme-tasdik bentlerini gözden kaçırıyorsun."},"E":{"gercek":"IV, SMMM\u0027nin kapsamını daraltarak yanlış; V ise YMM\u0027ye yasak olan (a) bendini ona tanıyarak yanlıştır; ikisi ayrı maddelerin ayrı ihlalidir.","ayirt":"Bu iki ifadenin hangi maddeye, hangi tarafa (SMMM mi YMM mi) ait olduğunu ayrı ayrı kontrol ettim mi?","paragraf":"3568 s.K. m.2/A, m.2/B","yanilgi":"İki farklı yanlış cümleyi birbirine benzer gördüğün için ikisini de doğru sanıp aynı şıkta birleştiriyorsun."},"A":{"gercek":"Madde 2/B, yeminli mali müşavirlerin muhasebe ile ilgili defter tutamayacağını, muhasebe bürosu açamayacağını ve bu bürolara ortak olamayacağını üç ayrı yasak olarak sayar.","ayirt":"Madde metninde \u0027tutamazlar\u0027 mı \u0027tutabilirler\u0027 mi yazıyor, cümleyi ters mi çevirmişim?","paragraf":"3568 s.K. m.2/B","yanilgi":"Defter tutma yasağının yalnızca büro açmayla ilgili olduğunu, YMM\u0027nin bireysel defter tutabileceğini sanıyorsun."},"D":{"gercek":"Madde 2/B, YMM\u0027nin konusunu (b) ve (c) bentleriyle tasdik işine sınırlar; (a) bendindeki defter tutma açıkça YMM\u0027ye yasaktır.","ayirt":"V ifadesindeki \u0027defter tutma işini de yapabilir\u0027 cümlesi hangi bende dayanıyor, o bent YMM\u0027ye mi ait?","paragraf":"3568 s.K. m.2/B","yanilgi":"Tasdik yetkisi olan YMM\u0027nin defter tutma işini de otomatik olarak yapabileceğini, bentlerin birbirini kapsadığını sanıyorsun."},"B":{"gercek":"Madde 2/B, yeminli mali müşavirliğin konusunu yalnızca (b) ve (c) bentleri ile tasdik işi olarak sınırlar; Madde 3 ise yetkisiz unvan kullanımını yasaklayıp bildirim zorunluluğu getirir.","ayirt":"Hangi bentler sayılmış, (a) bendi bu listede var mı?","paragraf":"3568 s.K. m.2/B, m.3","yanilgi":"Tasdik yetkisinin (A) fıkrasının tüm bentlerini (a,b,c) kapsadığını, dolayısıyla defter tutmayı da içerdiğini düşünüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":null,"kural":"Disiplin Yönetmeliği m.6/c uyarınca YMM\u0027nin, boşanmış dahi olsa eşinin üçüncü dereceye kadar (bu derece dahil) sıhri hısımlarının baktığı işlerin tasdiki kınama cezasını gerektirir.","olcum":{"pencere":7,"hesapKod":0,"capa":"","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Akrabalık sorularında önce \u0027boşanma bağı bitirir mi\u0027 sonra \u0027kaçıncı derece\u0027 diye iki soruyu ayrı ayrı sor, madde metnindeki \u0027dahil\u0027 kelimesini asla atlama.","konu":"ymm tasdik yasaklari","tablo":{"satirlar":[["A) Eş ile boşanılmış olduğundan akrabalık ilişkisi ortadan …","m.6/c","YANLIŞ ifade"],["B) Eşin kardeşinin oğlu dördüncü dereceden sıhri hısım sayı…","m.6/c","YANLIŞ ifade"],["C) Eşin kardeşinin oğlu üçüncü dereceye kadar olan sıhri hı…","m.6/c","doğru ifade"],["D) Sınırlama yalnız kan hısımlığı için geçerli olduğundan s…","m.6/c","YANLIŞ ifade"],["E) Eylem ilk kez işlendiğinden Kaan Bey hakkında kınama değ…","m.6/a-c","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Eşin kardeşinin oğlu üçüncü dereceye kadar olan sıhri hısımlar arasında yer aldığından Kaan Bey hakkında kınama cezası uygulanır.","E":"Eylem ilk kez işlendiğinden Kaan Bey hakkında kınama değil uyarma cezası uygulanır.","A":"Eş ile boşanılmış olduğundan akrabalık ilişkisi ortadan kalkmış sayılır ve Kaan Bey\u0027e disiplin cezası uygulanmaz.","D":"Sınırlama yalnız kan hısımlığı için geçerli olduğundan sıhri hısımın baktığı işin tasdiki herhangi bir yaptırıma tabi değildir.","B":"Eşin kardeşinin oğlu dördüncü dereceden sıhri hısım sayıldığından bu tasdik işlemi disiplin cezası kapsamı dışında kalır."},"kaynak":{"alinti":"nin boşanmış eşinin üçüncü derece sıhri hısımının baktığı işlerin tasdikine ilişkin disiplin cezasını soruyor; Disiplin Yönetmeliği m.6/c","liste":[{"ad":"SMMM ve YMM K. Disiplin Yonetmeligi m.6 [1/3]","metin":"Madde 6 — Kınama cezası, aşağıdaki durumlarda uygulanır: a ) (Değişik:RG-27/09/2007-26656) Üç yıllık bir dönem içinde (Ek ibare:RG-7/10/2023-32332) üçüncü kez uyarma cezası gerektiren herhangi bir eylemin yinelenmesi, b) Meslek mensuplarınca, sahip olunmayan ünvanların kullanılması, c) Yeminli mali müşavirlerce, kendisinin, eşinin (boşanmış dahi olsa) usul ve füruundan birinin ve üçüncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının veya bunların ortak veya yönetiminde oldukları firmaların işlerine bakılması veyahut bu yakınlıktaki akrabalarından olan (Mülga ibare:RG-4/8/2015-29435) (…) Serbest Muhasebeci Mali Müşavirlerin baktığı işlerin, tasdik edilmesi, d) Meslek mensuplarınca, (Mülga ibare:RG-4/8/2015-29435) (…) Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelikte öngörülen yazılı hizmet sözleşmesi yapmadan iş kabul edilmesi,(Ek ibare:RG-7/10/2023-32332) mesleki hizmet sözleşmelerinin Birlikçe belirlenen süre içerisinde e-birlik yazılımına girilmemesi, e) Meslek mensuplarınca, sahte veya içeriği itibariyle yanıltıcı belge düzenlediği resmi kurum ve kuruluşlarca saptanan iş sahiplerinin (zorunlu olarak oda tarafından görevlendirmeler hariç), odalar ve Birlik tarafından ilanından sonra defterlerinin tutulması ve işlerinin görülmesi, f) Meslek mensuplarınca, reklam yasağına uyulmaması, g ) (Değişik:RG-27/09/2007-26656) Meslek mensuplarınca, asgari ücret tarifesinde yer alan ücretlerin altında iş kabul edilmesi, ücret yönetmeliğine aykırı olarak, ücretini tahsil etmediği hâlde daha sonraki yıllarda işin sürd…"},{"ad":"SMMM ve YMM K. Disiplin Yonetmeligi m.6 [2/3]","metin":"edilmesi, i) Çalışanlar listesine kaydolmadan ünvan kullanarak, mesleki faaliyette bulunulması, j) Yeminli Mali Müşavirlerce, kendi defterleri hariç, defter tutulması, muhasebe bürosu açılması veya muhasebe bürosuna ortak olunması, k) Başka bir meslek mensubu ile sözleşmesi bulunan müşterilere, (Değişik ibare:RG-7/10/2023-32332) aynı işi yapmak için bilerek iş önerilmesi ve diğer meslek mensubu hakkında olumsuz yorumlarda bulunulması, l) Aynı ünvan sahibi meslek mensubunun sorumluluğundaki işlerle ilgili, görev ve sorumluluk almadan, bir başka meslek mensubunun görüş bildirmesi, uygulamaları hakkında iş sahiplerine karşı olumsuz eleştiriler yapması, m) Mesleğin gereği gibi yürütülmesini sağlayacak şekilde; şubenin bağlı bulunduğu odanın çalışanlar kütüğüne kayıtlı sorumlu ortak görevlendirmeden ve bu ortak sayısından fazla şube açılması, n) Meslek mensuplarınca, kasıt olmaksızın gerekli özen ve titizlik yeterince gösterilmeden; yasal düzenlemelere ve ilan olunmuş norm ve standartlara aykırı olarak beyanname ve bildirimlerin imzalanması, denetlenmesi ve tasdik edilmesi, o) Oda ve birlik kurulları başkan ve üyelerinin; bu görevleri dolayısıyla kanun ve yönetmeliklere aykırı davrandıklarının tespit edilmesi, p ) (Mülga ibare:RG-4/8/2015-29435) (…) Serbest Muhasebeci Mali Müşavirlerce; çalışanlar kütüğüne kayıt olmadan birden fazla beyanname imzalanması, q) (Mülga:RG-4/8/2015-29435) r) (Ek:RG-27/09/2007-26656) Büro Tescil Belgesi alınmaması, süresinde vize ettirilmemesi, s) (Ek:RG-27/09/2007-26656) Birlik Genel Kurulunca belirlenen \"büro standartları\"na uyulmaması, açılan işyer…"}],"hakem":"Soru, YMM\u0027nin boşanmış eşinin üçüncü derece sıhri hısımının baktığı işlerin tasdikine ilişkin disiplin cezasını soruyor; Disiplin Yönetmeliği m.6/c\u0027de bu durum açıkça kınama cezası gerektiriyor."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Yeminli mali müşavir Kaan Bey, boşanmış olduğu eşinin kardeşinin oğlu olan bir serbest muhasebeci mali müşavirin defterlerini tuttuğu bir firmanın mali tablolarını tasdik etmiştir. Bu duruma ilişkin olarak aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-15","verilenler":[],"dayanak":"SMMM ve YMM Kanunu Disiplin Yönetmeliği m.6/c","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: YMM Serpil Hanım, boşandığı eşinin kardeşinin kızının SMMM olarak defterlerini tuttuğu bir tekstil firmasının 2022 yılı bilançosunu 15 Mart 2023\u0027te tasdik ediyor.","anlatim":"Firma 8 milyon lira ciro yapmış, tasdik raporu imzalanmış ve teslim edilmiş bile. Şimdi meslek odası bu tasdiki inceliyor.","doldur":[]},{"formul":"Ne yapacağız: madde 6/c diyor ki, boşanmış dahi olsa eşinin üçüncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının baktığı işlerin tasdiki kınama cezası gerektirir. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Serpil Hanım\u0027ın eşinin kardeşinin kızı, eşin kardeşi 2. derece olduğu için 3. derece sıhri hısım sayılır. Şimdi sırayla bakalım.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.6/c","karar":"yanlış","anlatim":"Hayır, madde açıkça \u0027boşanmış dahi olsa\u0027 diyor. Boşanma bu maddede sınırlamayı kaldırmaz.","formul":"Şık A: biri sana \u0027boşandı zaten, akrabalık bitti, ceza olmaz\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.6/c","karar":"yanlış","anlatim":"Vermem, eşin kardeşi 2. derece, onun çocuğu 3. derecedir. Sayım şaşırılmış burada.","formul":"Şık B: biri \u0027eşin kardeşinin oğlu 4. derece, kapsam dışı\u0027 diyor, ona hak verir misin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.6/c","karar":"doğru","anlatim":"Atarım, madde tam da bu dereceyi \u0027dahil\u0027 sayarak kapsıyor. Olayımızdaki akrabalık tam bu noktaya oturuyor.","formul":"Şık C: \u0027eşin kardeşinin çocuğu 3. derece sıhri hısım, kınama cezası uygulanır\u0027 diyor, buna imza atar mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.6/c","karar":"yanlış","anlatim":"Etmem, madde metni \u0027kan ve sıhri hısımlarının\u0027 diye birlikte söylüyor. İkisi de aynı sınırlamaya tabi.","formul":"Şık D: \u0027sınırlama yalnız kan hısımlığı içindir, sıhri hısım serbest\u0027 diyor, kabul eder misin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.6/a-c","karar":"yanlış","anlatim":"Böyle bir tekrar şartı bu fıkrada yok, m.6/c kendi başına kınama sebebi. Tekrar şartı farklı bir bentte, burayı karıştırma.","formul":"Şık E: \u0027ilk kez oldu, kınama değil uyarma verilir\u0027 diyor, sen ne dersin?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Serpil Hanım\u0027a kınama cezası uygulanır, çünkü derece 3\u0027tür ve boşanma bunu etkilemez. Kendine hep şunu sor: bu akraba kaçıncı derecede ve madde \u0027dahil\u0027 mi diyor?","doldur":[]}],"anahtar":[{"ornek":"dereceye","kok":"derece"},{"ornek":"boşanmış","kok":"boşanm"},{"ornek":"tasdik","kok":"tasdik"},{"ornek":"kınama","kok":"kınama"},{"ornek":"cezası","kok":"cezası"},{"ornek":"eşinin","kok":"eşinin"}],"konuGiris":null,"olay":"","tuzak":{"D":{"ad":"Kan/Sıhri Hısım Ayrımı Tuzağı","metin":"Maddenin yalnız kan hısımlığını kapsadığını düşünüyorsun. Doğrusu: m.6/c hem kan hem sıhri hısımlığı birlikte ve aynı derece sınırıyla düzenler."},"E":{"ad":"Ceza Türü Karıştırma Tuzağı","metin":"Uyarma cezasının \u0027ilk eylem\u0027 hâlinde uygulanacağını sanıyorsun. Doğrusu: m.6/a\u0027daki tekrar şartı farklı bir fiile ilişkindir; akrabanın işinin tasdiki doğrudan kınama cezası gerektiren ayrı bir haldir."},"A":{"ad":"Boşanmış Eş Tuzağı","metin":"Boşanma akrabalık bağını ortadan kaldırır sanıyorsun. Doğrusu: Disiplin Yönetmeliği m.6/c eşi \u0027boşanmış dahi olsa\u0027 kapsama açıkça dahil eder, ceza uygulanır."},"B":{"ad":"Derece Hesabı Tuzağı","metin":"Sıhri hısımlık derecesini yanlış saymışsın. Doğrusu: Eşin kardeşi 2. derece, eşin kardeşinin çocuğu (yeğen) 3. derece sıhri hısımdır ve madde 3. dereceyi dahil sayar."}},"celdiriciYol":{},"hap":"Yeminli mali müşavir; kendisinin, boşanmış dahi olsa eşinin, usul ve füruundan birinin ve üçüncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının baktığı işleri tasdik ederse kınama cezası alır.","teshis":{"C":{"gercek":"Madde 6/c, üçüncü dereceye kadar (bu derece dahil) kan ve sıhri hısımların baktığı işlerin tasdikini açıkça kınama cezasına bağlar.","ayirt":"Derece sınırının \u0027dahil\u0027 olduğunu unuttum mu?","paragraf":"m.6/c","yanilgi":"Bu kadar uzak bir akrabalığın disiplin sonucu doğurmayacağını düşünenler bu şıkkı elerler."},"E":{"gercek":"Madde 6/c kendi başına ayrı bir kınama sebebidir, m.6/a\u0027daki tekrar şartı farklı bir fiile ilişkindir.","ayirt":"Bu fıkra tekrar şartı arıyor mu diye maddeyi tekrar okudum mu?","paragraf":"m.6/a-c","yanilgi":"Kınama cezasının yalnız tekrar eden eylemlerde uygulandığını sanıyorsun."},"A":{"gercek":"Madde 6/c, eşi \u0027boşanmış dahi olsa\u0027 ifadesiyle açıkça kapsama alır; boşanma sınırlamayı kaldırmaz.","ayirt":"Madde metninde \u0027boşanmış dahi olsa\u0027 ibaresi var mı diye kendime sordum mu?","paragraf":"m.6/c","yanilgi":"Boşanınca eşle olan bağın hukuken bittiğini ve maddenin artık uygulanmayacağını sanıyorsun."},"D":{"gercek":"Metinde \u0027kan ve sıhri hısımlarının\u0027 ifadesi birlikte geçer, ikisi de kapsamdadır.","ayirt":"Madde metninde \u0027sıhri\u0027 kelimesi geçiyor mu diye kontrol ettim mi?","paragraf":"m.6/c","yanilgi":"Maddenin yalnız kan hısımlığından bahsettiğini sanıyorsun."},"B":{"gercek":"Sıhri hısımlıkta eşin kardeşi 2., eşin kardeşinin çocuğu 3. derecedir; madde 3. dereceyi dahil sayar.","ayirt":"Dereceyi kendimden mi eşimden mi saydım, doğru sıraladım mı?","paragraf":"m.6/c","yanilgi":"Yeğeni 4. derece sanıp kapsam dışına taşıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":null,"kural":"SMMM ve YMM Kanunu Disiplin Yönetmeliği m.6/c\u0027ye göre eşin (boşanmış dahi olsa) üçüncü dereceye kadar kan ve sıhri hısımlarının işlerinin SMMM tarafından bakılıp YMM tarafından tasdik edilmesi kınama cezasını gerektirir.","olcum":{"pencere":7,"hesapKod":0,"capa":"","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Akrabalık yasağı sorularında önce \u0027kaçıncı derece\u0027 hesapla, sonra \u0027boşanmış eş de dahil mi\u0027 kontrolünü ayrı ayrı yap; ikisi de doğruysa ceza kaçınılmazdır.","konu":"ymm tasdik yasaklari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Boşanma yılı","2023","-"],["Tasdik yılı","2026","-"],["Akrabalık ilişkisi","eski eşin erkek kardeşi","-"],["Defteri tutan","serbest muhasebeci mali müşavir","-"],["HESAP","-","-"],["A) Tasdik geçerlidir; evlilik boşanmayla sona erdiğinden es…","m.6/c","YANLIŞ ifade"],["B) Kaan hakkında kınama cezası uygulanır; madde eşin boşanm…","m.6/c","doğru ifade"],["C) Tasdik geçerlidir; disiplin hükmü yalnızca kan hısımlığı…","m.6/c","YANLIŞ ifade"],["D) Kaan hakkında disiplin cezası uygulanır ancak bu ceza kı…","m.6/c","YANLIŞ ifade"],["E) Tasdik geçerlidir; işletmenin defterlerini serbest muhas…","m.6/c","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Tasdik geçerlidir; disiplin hükmü yalnızca kan hısımlığını kapsadığından sıhri hısımlık bu yasağın dışında kalır.","E":"Tasdik geçerlidir; işletmenin defterlerini serbest muhasebeci mali müşavir tuttuğundan sorumluluk yalnızca ona aittir, YMM\u0027ye ceza uygulanmaz.","A":"Tasdik geçerlidir; evlilik boşanmayla sona erdiğinden eski eşin hısımlarıyla olan sıhri hısımlık ilişkisi de ortadan kalkmıştır.","D":"Kaan hakkında disiplin cezası uygulanır ancak bu ceza kınama değil, uyarma cezasıdır.","B":"Kaan hakkında kınama cezası uygulanır; madde eşin boşanmış olması hâlinde dahi onun hısımlarını kapsam içinde saymaktadır."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM ve YMM K. Disiplin Yonetmeligi m.6 [1/3]","metin":"Madde 6 — Kınama cezası, aşağıdaki durumlarda uygulanır: a ) (Değişik:RG-27/09/2007-26656) Üç yıllık bir dönem içinde (Ek ibare:RG-7/10/2023-32332) üçüncü kez uyarma cezası gerektiren herhangi bir eylemin yinelenmesi, b) Meslek mensuplarınca, sahip olunmayan ünvanların kullanılması, c) Yeminli mali müşavirlerce, kendisinin, eşinin (boşanmış dahi olsa) usul ve füruundan birinin ve üçüncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının veya bunların ortak veya yönetiminde oldukları firmaların işlerine bakılması veyahut bu yakınlıktaki akrabalarından olan (Mülga ibare:RG-4/8/2015-29435) (…) Serbest Muhasebeci Mali Müşavirlerin baktığı işlerin, tasdik edilmesi, d) Meslek mensuplarınca, (Mülga ibare:RG-4/8/2015-29435) (…) Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelikte öngörülen yazılı hizmet sözleşmesi yapmadan iş kabul edilmesi,(Ek ibare:RG-7/10/2023-32332) mesleki hizmet sözleşmelerinin Birlikçe belirlenen süre içerisinde e-birlik yazılımına girilmemesi, e) Meslek mensuplarınca, sahte veya içeriği itibariyle yanıltıcı belge düzenlediği resmi kurum ve kuruluşlarca saptanan iş sahiplerinin (zorunlu olarak oda tarafından görevlendirmeler hariç), odalar ve Birlik tarafından ilanından sonra defterlerinin tutulması ve işlerinin görülmesi, f) Meslek mensuplarınca, reklam yasağına uyulmaması, g ) (Değişik:RG-27/09/2007-26656) Meslek mensuplarınca, asgari ücret tarifesinde yer alan ücretlerin altında iş kabul edilmesi, ücret yönetmeliğine aykırı olarak, ücretini tahsil etmediği hâlde daha sonraki yıllarda işin sürd…"},{"ad":"SMMM ve YMM K. Disiplin Yonetmeligi m.6 [2/3]","metin":"edilmesi, i) Çalışanlar listesine kaydolmadan ünvan kullanarak, mesleki faaliyette bulunulması, j) Yeminli Mali Müşavirlerce, kendi defterleri hariç, defter tutulması, muhasebe bürosu açılması veya muhasebe bürosuna ortak olunması, k) Başka bir meslek mensubu ile sözleşmesi bulunan müşterilere, (Değişik ibare:RG-7/10/2023-32332) aynı işi yapmak için bilerek iş önerilmesi ve diğer meslek mensubu hakkında olumsuz yorumlarda bulunulması, l) Aynı ünvan sahibi meslek mensubunun sorumluluğundaki işlerle ilgili, görev ve sorumluluk almadan, bir başka meslek mensubunun görüş bildirmesi, uygulamaları hakkında iş sahiplerine karşı olumsuz eleştiriler yapması, m) Mesleğin gereği gibi yürütülmesini sağlayacak şekilde; şubenin bağlı bulunduğu odanın çalışanlar kütüğüne kayıtlı sorumlu ortak görevlendirmeden ve bu ortak sayısından fazla şube açılması, n) Meslek mensuplarınca, kasıt olmaksızın gerekli özen ve titizlik yeterince gösterilmeden; yasal düzenlemelere ve ilan olunmuş norm ve standartlara aykırı olarak beyanname ve bildirimlerin imzalanması, denetlenmesi ve tasdik edilmesi, o) Oda ve birlik kurulları başkan ve üyelerinin; bu görevleri dolayısıyla kanun ve yönetmeliklere aykırı davrandıklarının tespit edilmesi, p ) (Mülga ibare:RG-4/8/2015-29435) (…) Serbest Muhasebeci Mali Müşavirlerce; çalışanlar kütüğüne kayıt olmadan birden fazla beyanname imzalanması, q) (Mülga:RG-4/8/2015-29435) r) (Ek:RG-27/09/2007-26656) Büro Tescil Belgesi alınmaması, süresinde vize ettirilmemesi, s) (Ek:RG-27/09/2007-26656) Birlik Genel Kurulunca belirlenen \"büro standartları\"na uyulmaması, açılan işyer…"}],"hakem":"Soru, YMM\u0027nin boşanmış eşinin akrabasının işine ilişkin tasdik yapmasının disiplin sonucunu sormaktadır; Disiplin Yönetmeliği m.6/c, boşanmış dahi olsa eşin üçüncü dereceye kadar kan ve sıhri hısımlarının işlerinin tasdik edilmesini kınama cezası gerektirmektedir; boşanmış eşinin erkek kardeşi (eşe göre ikinci derece sıhri hısım) bu kapsamdadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"YMM Kaan, 2023 yılında boşandığı eski eşinin erkek kardeşinin ortak olduğu bir işletmenin, defterlerini bir serbest muhasebeci mali müşavirin tuttuğu mali tablolarını 2026 yılında tasdik etmiştir. Bu duruma ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-15","verilenler":[{"deger":"2023","anlam":"YMM\u0027nin eşinden boşandığı yıl; ilişkinin geçmişte sona erdiğini gösterir ama madde bunu istisna saymaz.","ad":"Boşanma yılı"},{"deger":"2026","anlam":"Tasdik işleminin yapıldığı yıl; sorunun güncel döneme ait olduğunu gösterir.","ad":"Tasdik yılı"},{"deger":"eski eşin erkek kardeşi","anlam":"Derece hesabına esas kişi; eşe göre 2. derece sıhri hısım olduğunu belirlemek için kulla // 06.09 seviye: ölçümden türer (bkz. kart kurulumu). k = sınıf anahtarı, ad = ekran adı (Nöbet dili: Isınma / Nöbet / Alarm), neden = ipucu.
function seviyeHesapla(s){
  const o=s.olcum||{}; const tip=s.tip||'teori'; const ders=String(s.ders||'');
  if(o.sim&&o.sim.dogru===false) return {k:'alarm',ad:'🔴 Alarm',neden:'Nöbetçi öğrencisi bu anlatımla ikizi çözemedi; dikkat ister'};
  if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

// 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}
function skorCiz(){ const sk=skorHesapla(); const vade=KUTU.kutu.filter(x=>x.due<=simdi()).length; const azVeri=KUTU.kayit.length<5; document.querySelectorAll('.skorCip').forEach(el=>{ el.textContent=azVeri?'🎯 —':('🎯 %'+sk.toplam); el.title=azVeri?'Hazırlık skoru 5 sorudan sonra görünür':'Hazırlık skoru'; }); /* 05.09: ilk yanlıştan sonra "%4" görmek caydırıcı; 5 cevaptan önce yüzde yok */ document.querySelectorAll('.kutuCip').forEach(el=>{ el.textContent='📥 '+KUTU.kutu.length+(vade?' ·'+vade+' hazır':''); el.classList.toggle('hazir',vade>0); }); }

   +sk.ders.map(d=>'<div class="dersSat"><span>'+esc(d.ad)+'</span><div class="bar"><i style="width:'+d.yuzde+'%"></i></div><b>%'+d.yuzde+'</b></div>').join('')
   +'<div class="et" style="margin-top:14px">📥 Yanlış kutusu ('+KUTU.kutu.length+')</div>'
   +(KUTU.kutu.length?KUTU.kutu.map(x=>{ const i=SORULAR.findIndex(s=>s.id===x.id); return '<div class="kutuSat"><div><b>'+esc(x.konu)+'</b> <span class="ipnot" style="display:inline">· '+(x.tur>=2?'2. tur (7 gün)':'1. tur (2 gün)')+' · '+gunStr(x.due)+'</span></div>'+(x.due<=t&&i>=0?'<button class="btn mavi kutuCoz" data-i="'+i+'">Şimdi çöz</button>':'')+'</div>'; }).join(''):'<p class="ipnot">Kutu boş. Yanlış yaptığın her soru buraya düşer ve 2 gün sonra geri gelir.</p>')
   +'<div class="btnrow" style="margin-top:14px"><button class="btn" id="kutuIleri">⏩ Demo: 2 gün ileri sar</button><button class="btn gri" id="kutuSifirla">Verileri sıfırla</button></div>'
   +'<p class="ipnot">Nasıl çalışır: yanlış → kutuya girer, 2 gün sonra geri gelir; o gün doğru bilirsen 7 gün sonra bir kez daha gelir; onu da bilirsen kutudan çıkar ve ustalık tam sayılır.</p></div>';
  e.classList.add('acik');
  e.querySelector('#kutuKapat').addEventListener('click',()=>e.classList.remove('acik'));

  e.querySelectorAll('.kutuCoz').forEach(b=>b.addEventListener('click',()=>{ e.classList.remove('acik'); kartSifirla(parseInt(b.dataset.i)); }));

    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});
// --- son kart
const son=document.createElement('section'); son.className='kart son';
son.innerHTML='<div class="ust"><span>Nöbet bitti</span>'+noktalar(-1)+'<span>&nbsp;</span></div><div class="govde son" style="display:flex;flex-direction:column;justify-content:center"><div id="sonSkor"></div></div>';
akis.appendChild(son);
document.querySelectorAll('.skorCip,.kutuCip').forEach(b=>b.addEventListener('click',kutuEkraniAc)); skorCiz();
if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i').forEach(n=>n.classList.toggle('simdi',n.dataset.j==String(i)||(i>=SORULAR.length&&n.dataset.j==='son')));
  if(i<SORULAR.length&&durum.cevap[i]===undefined&&!durum.t0[i]) durum.t0[i]=Date.now();   // 06.09: karta gelince süre başlar
  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='PageDown'){ akis.scrollBy({top:akis.clientHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='PageUp'){ akis.scrollBy({top:-akis.clientHeight,behavior:'smooth'}); } });
/* 09.09 derin bağlantı (ana sayfa kartı → günün sorusu): #s=<sıra> kartını açar; yoksa baştan. */
window.addEventListener('load',function(){ try{ var m=location.hash.match(/#s=(\d+)/); var a=document.getElementById('akis'); if(m&&a&&a.children[+m[1]]) a.scrollTo({top:a.children[+m[1]].offsetTop,behavior:'instant'}); }catch(e){} });
