,[2,1]],"donem":11,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"Kanun, ruhsatnamesini bir başkasına bedelli veya bedelsiz kullandıran meslek mensubuna meslekten çıkarma cezası öngörür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında önce fiilin ağırlığını, sonra Kanunun o fiile özel bir hüküm koyup koymadığını kontrol et.","konu":"disiplin cezalari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Fiil","Ruhsatnamenin bedel karşılığında başkasına kullandırılması","-"],["HESAP","-","-"],["A) Uyarma","m.4","YANLIŞ ifade"],["B) Kınama","m.4","YANLIŞ ifade"],["C) Geçici olarak mesleki faaliyetten alıkoyma","m.4","YANLIŞ ifade"],["D) Yeminli sıfatını kaldırma","m.4","YANLIŞ ifade"],["E) Meslekten çıkarma","m.4","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Geçici olarak mesleki faaliyetten alıkoyma","E":"Meslekten çıkarma","A":"Uyarma","D":"Yeminli sıfatını kaldırma","B":"Kınama"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"Soru, 3568 sayılı Kanun m.48\u0027de açıkça yer alan, ruhsatı başkasına bedelli veya bedelsiz kullandıran meslek mensubuna meslekten çıkarma cezası verilmesi kuralını test etmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Geçici alıkoyma bağımsızlık ve tarafsızlık ihlallerinde kullanılır. Ruhsat devri tamamen başka bir ağır kuralda ele alınmıştır.","A":"Uyarma hafif ihmal ve dikkatsizlik için verilir. Ruhsatı başkasına kullandırmak ise ruhsatın kötüye kullanılması olup çok daha ağır bir fiildir.","D":"Yeminli sıfatı kaldırma yalnız yeminli mali müşavirlerin tasdik yetkisini kötüye kullanmasında uygulanır, ruhsat devrine değil.","B":"Kınama sıradan mesleki kusurlar için uygulanır. Ruhsatı devretmek kusur değil, meslek mensubunun yetki ve sorumluluğunu başkasına vermek anlamına gelir."},"dogru":"Meslek ruhsatnamesini başkasına kullandırmak kanunca en ağır ceza olan meslekten çıkarmaya bağlıdır. Ruhsat kişiye özel bir belgedir, başkasına verilmesi mesleğin temelini ihlal eder. Bu nedenle bu fiil doğrudan meslekten çıkarma yaptırımını gerektirir.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 48. maddesine göre meslekten çıkarma cezası verilir.","kavramlar":[{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun muhasebe ve müşavirlik hizmetlerini yürütme yetkisini gösteren kişiye özel belgedir.","ad":"Meslek ruhsatı"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun ruhsatnamesinin geri alınarak bir daha mesleği yürütmesine izin verilmemesidir.","ad":"Meslekten çıkarma"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensuplarının mesleki kuralları ihlal etmeleri halinde mesleğin vakar ve onurunu korumak amacıyla verilen cezadır.","ad":"Disiplin cezası"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[{"yil":"2018/3","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, disiplin cezalarına ilişkin aşağıdakilerden hangisi yanlıştır?"},{"yil":"2018/1","alinti":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu’na göre, serbest muhasebeci mali müşavirlere uygulanabilecek disiplin cezaları ile ilgili aşağıdakilerden hangisi yanlıştır?"},{"yil":"2017/2","alinti":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliğine göre, yukarıdaki disiplin cezalarından hangileri Resmî Gazete’de ilan edilmez?"}],"donemler":["2025/1","2024/2","2021/1","2020/1","2018/3","2018/1","2017/3","2017/2","2017/1","2016/2","2015/2"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavir, meslek ruhsatnamesini bedel karşılığında başka bir kişiye kullandırdığı disiplin soruşturması sonucunda tespit edilmiştir. 3568 sayılı Kanun\u0027a göre bu meslek mensubuna hangi disiplin cezası verilir?","kayitBaslik":"","id":"sgs-p-meslek-kolay-r1-a/kp-01","verilenler":[{"deger":"Ruhsatnamenin bedel karşılığında başkasına kullandırılması","anlam":"Hangi disiplin hükmünün uygulanacağını belirleyen olgu","ad":"Fiil"}],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.48 (27/3/2025-7546/4 md. ile eklenen fıkra)","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Kayseri\u0027de bir SMMM, 2019 yılında ruhsatnamesini yılda 40.000 TL bedel karşılığında hiç mesleki faaliyeti olmayan bir kişiye kullandırmış, o kişi bu ruhsatla üç yıl büro işletmiş.","anlatim":"Adam kendi adına değil, başkasının adına para kazanıyor gibi görünsün diye ruhsatını satmış. Disiplin soruşturması bunu ortaya çıkarıyor. Şimdi hangi ceza uygulanacak, onu bulacağız.","doldur":[]},{"formul":"Ne yapacağız: Kanun beş ceza öngörüyor; uyarmadan meslekten çıkarmaya kadar, fiilin ağırlığına göre sıralanmış bir merdiven bu. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Ruhsat devri sıradan bir kusur değil, mesleğin temelini sarsan bir fiil. Kanun bunu ayrıca ve açıkça düzenlemiş. Beşini de sırayla bu olaya uygulayacağız.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.4","karar":"yanlış","anlatim":"Uyarma, sadece dikkatli olması gerektiğinin yazıyla bildirilmesidir. Ruhsatını satan adam dikkatsiz değil, yetkisini bilerek devretmiş biri. Bu ceza onun fiiline karşılık gelmiyor.","formul":"Şık A: müdür \u0027basit bir hata, bir yazıyla uyaralım yeter\u0027 diyor, sen katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.4","karar":"yanlış","anlatim":"Kınama, görevini yaparken kusurlu davranan meslek mensubu içindir. Burada adam görevini kusurlu yapmıyor, görevini bizzat başkasına devrediyor. Fark büyük, ceza da farklı olmalı.","formul":"Şık B: birisi \u0027görevinde kusurlu, kınama cezası yeter\u0027 diyor, sen ne dersin?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.4","karar":"yanlış","anlatim":"Geçici alıkoyma, mesleki sıfat saklı kalarak belirli süre faaliyetten men etmektir. Bu ceza bağımsızlık ya da dürüstlük ihlallerine özgüdür, ruhsat devri gibi ağır bir fiile karşılık gelmez. Kanun bu fiili ayrıca ve daha ağır bir hükümle cezalandırıyor.","formul":"Şık C: \u0027altı ay mesleki faaliyetten alıkoyalım, sonra devam etsin\u0027 diyorlar, doğru mu bu?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.4","karar":"yanlış","anlatim":"Yeminli sıfatının kaldırılması sadece YMM\u0027lerin yeminli tasdik yetkisini kötüye kullanmasında uygulanır. Olayımızda ruhsat devri var, yeminli tasdik konusu hiç geçmiyor. Bu ceza bu olaya uymaz.","formul":"Şık D: \u0027bu adam yeminli mali müşavir mi, yeminli sıfatını kaldıralım\u0027 diyor biri, sen ne dersin?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.4","karar":"doğru","anlatim":"Meslekten çıkarma, ruhsatnamenin geri alınıp bir daha mesleğin yürütülmesine izin verilmemesidir. Kanun ruhsatı bedelli veya bedelsiz başkasına kullandırmayı doğrudan bu cezaya bağlamış. Adamımız tam da bu fiili işlemiş, ceza budur.","formul":"Şık E: \u0027ruhsatını geri alalım, bir daha mesleği yapmasın\u0027 diyorlar, sen katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Ruhsatını satan meslek mensubu, kusur değil ihanet etmiştir; ceza da en ağırı, meslekten çıkarmadır. Kendine hep şunu sor: bu fiil görevde bir kusur mu, yoksa mesleki yetkinin bizzat devri mi?","doldur":[]}],"anahtar":[{"ornek":"ruhsatını","kok":"ruhsat"},{"ornek":"meslek","kok":"meslek"},{"ornek":"başkasına","kok":"başkas"},{"ornek":"çıkarma","kok":"çıkarm"},{"ornek":"mensubuna","kok":"mensub"},{"ornek":"kullandıran","kok":"kullan"}],"konuGiris":{"harita":"Ne zaman uygulanır: Meslek mensubunun disiplin soruşturmasında fiili tespit edildiğinde uygulanır. Nasıl belirlenir: Fiilin türüne göre kanunda sayılan beş cezadan biri seçilir. Nasıl kesinleşir: Savunma alındıktan ve kesinleştiği bildirildikten sonra ceza uygulanır.","desen":"Sınav genelde ruhsatnamenin bedelli/bedelsiz başkasına kullandırılması fiilini verip hangi cezanın uygulanacağını sorar. Tuzak, bu fiilin \u0027geçici alıkoyma\u0027 gibi hafif bir cezayla karıştırılmasıdır; oysa kanun burada doğrudan en ağır cezayı öngörür. Bu soru m.48 [2/2] fıkrasındaki \u0027ruhsatname bedelli/bedelsiz kullandırma\u0027 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubuna daha dikkatli davranması gerektiğinin yazıyla bildirilmesi","ad":"Uyarma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubuna görev ve davranışında kusurlu sayıldığının yazıyla bildirilmesi","ad":"Kınama","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetin durdurulması","ad":"Geçici mesleki faaliyetten alıkoyma","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Ruhsatnamenin geri alınıp mesleğin bir daha icra edilememesi","ad":"Meslekten çıkarma","kim":"kanun sabitler"}],"sinavda":"Soruda somut bir disiplin fiili anlatılır ve hangi disiplin cezasının uygulanacağı istenir.","panel_ornek":"Diyelim bir arkadaşın, okul kimliğini 50 liraya başka birine kullandırdı ve bu okulda duyuldu; bu iş sadece \u0027uyarılmakla\u0027 değil, doğrudan okuldan uzaklaştırmayla sonuçlanır. Çünkü kimliğini başkasına kullandırmak, hafif değil en ağır ihlal sayılır.","ornek":"Diyelim bir arkadaşın, okul kimliğini 50 liraya başka birine kullandırdı ve bu okulda duyuldu; bu iş sadece \u0027uyarılmakla\u0027 değil, doğrudan okuldan uzaklaştırmayla sonuçlanır. Çünkü kimliğini başkasına kullandırmak, hafif değil en ağır ihlal sayılır.","yontemler":"Fiilin ağırlık derecesi kanunda tek tek sayıldığı için ceza doğrudan maddeden okunur; yorum ya da hesaplama gerekmez.","nedir":"Bu konu, meslek mensuplarının mesleki kurallara aykırı davranışlarına uygulanan disiplin cezalarını anlatır. Sınav, hangi fiile hangi cezanın verildiğini kanun maddesinden ayırt edebilmeni ölçer."},"olay":"Fiil doğrudan bu hükme girer, ara işlem gerekmez.","tuzak":{"C":{"ad":"Geçici Alıkoyma Tuzağı","metin":"Öğrenci bunu bağımsızlık ilkesine aykırılık gibi görüp geçici uzaklaştırma seçer. Doğrusu: Geçici alıkoyma bağımsızlık/tarafsızlık ihlallerine özgüdür, ruhsat devrine değil."},"A":{"ad":"Uyarma Tuzağı","metin":"Öğrenci bunu hafif bir ihmal sanıp en düşük cezayı seçer. Doğrusu: Ruhsatı başkasına kullandırma, Kanunda doğrudan meslekten çıkarma yaptırımına bağlanmıştır."},"D":{"ad":"Yeminli Sıfatı Tuzağı","metin":"Öğrenci meslek mensubu ifadesini yeminli mali müşavirle karıştırır. Doğrusu: Yeminli sıfatının kaldırılması yalnız YMM\u0027lerin tasdik yetkisini kötüye kullanmasında uygulanır."},"B":{"ad":"Kınama Tuzağı","metin":"Öğrenci fiili sıradan bir mesleki kusur zannedip orta düzey bir ceza arar. Doğrusu: Bu fiil kusurlu davranış değil, ruhsatın kötüye kullanılmasıdır ve ağır yaptırım gerektirir."}},"celdiriciYol":null,"hap":"Ruhsatını başkasına bedelli veya bedelsiz kullandıran meslek mensubuna 3568 sayılı Kanun uyarınca meslekten çıkarma cezası verilir.","teshis":{"C":{"gercek":"Geçici alıkoyma, bağımsızlık-tarafsızlık-dürüstlük ihlallerine özgüdür; ruhsat devri ayrı ve daha ağır bir hükümle cezalandırılır.","ayirt":"Kural hangi fiili hangi maddede ayrıca saymış?","paragraf":"3568 s.K. m.48","yanilgi":"Bağımsızlık ilkesine aykırılık ile ruhsat devrini aynı kefeye koyuyorsun."},"E":{"gercek":"Kanun, ruhsatı bir başkasına bedelli veya bedelsiz kullandırmayı ayrıca ve açıkça meslekten çıkarma sebebi saymıştır.","ayirt":"Fiil, Kanunun meslekten çıkarmayı öngördüğü hallerden biri mi?","paragraf":"3568 s.K. m.48","yanilgi":"Bu kadar ağır bir sonucun sadece vergi ziyaı gibi büyük fiillerde uygulandığını düşünüp bu şıkkı elersin."},"A":{"gercek":"Ruhsat devri, mesleğin icrasında güveni tamamen ortadan kaldıran ağır bir fiildir ve Kanunda ayrıca düzenlenmiştir.","ayirt":"Bu fiil sıradan bir ihmal mi, yoksa mesleğin özüne yönelik bir kötüye kullanım mı?","paragraf":"3568 s.K. m.48","yanilgi":"Bunun basit bir dikkatsizlik olduğunu, yazılı uyarıyla geçiştirilebileceğini düşünüyorsun."},"D":{"gercek":"Yeminli sıfatının kaldırılması yalnız YMM\u0027lerin tasdik yetkisini gerçeğe aykırı kullanmasında uygulanır, ruhsat devrinde değil.","ayirt":"Olay yeminli tasdik yetkisiyle mi, yoksa ruhsatın devriyle mi ilgili?","paragraf":"3568 s.K. m.48","yanilgi":"Meslek mensubu kavramını sadece yeminli mali müşavirlere özgü sanıyorsun."},"B":{"gercek":"Kınama, görevde ve davranışta kusur bildirimidir; ruhsatın devri kusur değil, yetkinin bizzat başkasına aktarılmasıdır.","ayirt":"Meslek mensubu görevini kusurlu mu yaptı, yoksa yetkisini başkasına mı devretti?","paragraf":"3568 s.K. m.48","yanilgi":"Fiili görev kusuru sanıp orta düzey bir ceza aramaya çalışıyorsun."}},"verilen":[[1,1]],"donem":11,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 104"},"kural":"Ticari Faaliyet Tuzağı: Öğrenci birden çok meslek mensubunun ortak büro kurmasını normal şirketleşme gibi görüp bunu ticari faaliyet sanır. Doğrusu: Kanun, bu bürolarda yapılan faaliyetlerin ticari faaliyet SAYILMAYACAĞINI açıkça belirtir, bu şık kaynağı ters çevirdiği için yanlıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 104","sonDonem":5,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Madde 45\u0027te \u0027sayılmaz/sayılır\u0027 zıtlığı olan iki istisna cümlesi vardır; şıklarda hangisinin ters çevrildiğine dikkat et.","konu":"meslek etik ilkeleri","tablo":null,"siklar":{"C":"Birden çok meslek mensubunun kurduğu ortaklık bürosunda yürütülen faaliyetler ticari faaliyet sayılır.","E":"Şirket şeklinde çalışılması halinde işlerden doğacak cezai sorumluluk, işi yapan meslek mensubuna aittir.","A":"Meslek mensupları iş elde etmek için reklam sayılabilecek faaliyetlerde bulunamazlar.","D":"Kamu iktisadi teşebbüslerinde meslek mensubunun yönetim kurulu üyeliği görevi, meslekle bağdaşmayan iş sayılmaz.","B":"Yeminli mali müşavirler, boşanmış olsalar dahi eşlerinin işlerini tasdik edemezler."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.45 [1/2]","metin":"Madde 45 –(…)19 serbest muhasebeci mali müşavirler bu unvanlarla, yeminli mali müşavirler ise bu unvan ve tasdik yetkisiyle; 2 nci maddede yazılı işlerin yürütülmesi amacıyla gerçek ve tüzelkişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar, ticari faaliyette bulunamazlar, meslekle ve meslek onuru ile bağdaşmayan işlerle uğraşamazlar. Yeminli mali müşavirler, eşi (boşanmış dahi olsa) usul ve füruundan biri ve 3 üncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının veya bunların ortak oldukları firmaların işlerine bakamazlar, yukarıda sayılan yakınlıktaki akrabaları olan (…)19 serbest muhasebeci mali müşavirlerin baktığı işleri tasdik edemezler. (Değişik üçüncü fıkra: 23/7/2010-6009/47 md.) Hayri ve ilmi kuruluşlar, 233 sayılı Kamu İktisadi Teşebbüsleri Hakkında Kanun Hükmünde Kararname kapsamındaki iktisadi devlet teşekkülleri, kamu iktisadi kuruluşları ve bunların müesseseleri, bağlı ortaklıkları ve iştirakleri, kamu idarelerinin doğrudan ya da dolaylı hissedarı olduğu kurumlar ile Tasarruf Mevduatı Sigorta Fonunun yönetimindeki kurumların bu Kanun kapsamındaki faaliyetlerini yürütmemeleri şartıyla, bu kurum ve kuruluşların yönetim kurulu başkanlığı, üyeliği, denetçiliği görevleri ile bilirkişilik ve tasfiye memurluğu meslekle bağdaşmayan işler sayılmaz. Bu madde başlığı “Reklam yasağı” iken, 10/7/2008 tarihli ve 5786 sayılı Kanunun 17 nci maddesiyle metne işlendiği şekilde değiştirilmiştir. 19 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"Serbest muhasebeciler,\", \"serbest muhasebecilerin ve\", \"serbe…"},{"ad":"SMMM K. (3568 s.K.) m.45 [2/2]","metin":"18 Birden çok meslek mensubu çalışmalarını; (…)19 serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik ortaklık bürosu veya şirket şeklinde birleştirebilirler. Bu bürolarda yapılan faaliyetler ticari faaliyet sayılmaz. Şirket şeklinde çalışılması halinde, yapılan işlerden doğacak cezai sorumluluk işi yapan meslek mensubuna aittir. (Ek fıkra: 10/7/2008-5786/18 md.) Meslek mensupları, iş elde etmek için reklâm sayılabilecek faaliyetlerde bulunamazlar. Tabela veya basılı kağıtlarında ruhsatname ile belirlenen mesleki unvanları dışında başka sıfat kullanamazlar. (Ek fıkra: 30/4/2013-6460/9 md.) 23/6/1965 tarihli ve 634 sayılı Kat Mülkiyeti Kanununa göre anagayrimenkulün mesken olarak gösterilen bağımsız bölümlerinde kat maliklerinin izni ve benzeri şartlar aranmaksızın serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik faaliyetlerinde bulunulabilir. Bu konuda, yönetim planındaki aksine hükümler uygulanmaz. Ücret20"}],"hakem":"Soru Meslek Hukuku kapsamında m.45\u0027e dayandırılmış; doğru şık kaynaktaki hükmü doğru tersine çevirmiş (ticari faaliyet SAYILMAZ hükmü ters okunmuş); tüm kapılar geçiş yapmıştır."},"kayitlar":[],"sade":{"siklar":{"D":"Kamu kuruluşlarında yönetim kurulu üyeliği, ilgili faaliyetleri yürütmemek şartıyla istisna tutulur; bu işler meslekle bağdaşmaz sayılmaz.","E":"Şirket şeklinde çalışıldığında cezai sorumluluk işi bizzat yapan meslek mensubuna aittir; ifade yasaya uyumludur.","A":"Kanun açıkça meslek mensuplarının iş elde etmek için reklam sayılabilecek faaliyetlerde bulunamayacağını belirtir; bu ifade yasaya tam uyumludur.","B":"Yeminli mali müşavir, eşin boşanmış olmasına rağmen tasdik yasaklaması devam eder; ifade kurala uygundur."},"dogru":"Kanun, birden çok meslek mensubunun ortaklık bürosu veya şirket kurmasına izin verir; ancak bu bürolarda yapılan faaliyetler ticari faaliyet sayılmaz. C şıkkı bunu ters çevirip ticari faaliyet dediği için yanlıştır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 45. madde","kavramlar":[{"kaynak":"SMMM K. 45. madde","tanim":"Meslek mensuplarının kâr amacıyla işletme yapması; kanun birden çok meslek mensubunun ortaklık bürosu veya şirket kurmasını ticari faaliyet sayılmayan faaliyet olarak düzenler.","ad":"Ticari faaliyet"},{"kaynak":"SMMM K. 45. madde","tanim":"Meslek mensuplarının iş elde etmek amacıyla reklam sayılabilecek faaliyetlerde bulunamaması; tabela ve basılı kağıtlarda sadece ruhsatnamede belirtilen mesleki unvanlar kullanılabilir.","ad":"Reklam yasağı"},{"kaynak":"SMMM K. 45. madde","tanim":"Yeminli mali müşavirin, eşi (boşanmış dahi olsa), usul ve füruundan biri ve üçüncü dereceye kadar kan ve sıhri hısımlarının işlerine bakamayacağı ve bu akrabaların işlerini tasdik edemeyeceği kural.","ad":"Yakın akraba tasdik yasağı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":9,"ornekler":[{"yil":"2020/2","alinti":"Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirlerin Mesleki Faaliyetlerinde Uyacakları Etik İlkeler Hakkında Yönetmeliğe göre, aşağıdakilerden hangisi tüm meslek mensuplarına uygulanacak temel etik ilkelerine yönelik tehditler arasında açıkça belirtilmemiştir?"},{"yil":"2019/2","alinti":"Serbest Muhasebeci, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Ücretlerinin Esasları Hakkında Yönetmelik’e göre, süreli ücret sözleşmelerinin en az ne kadar süre için yapılması gerekir?"},{"yil":"2019/1","alinti":"…A GİRİŞ SINAVI 02 Mart 2019 – (Yabancı Dil: İngilizce) 80. Aşağıdakilerden hangisi finansal tabloların denetimi sırasında denetçinin uyacağı temel meslekî etik ilkelerden biri değildir? A 84. Üçüncü bir tarafın saklama ve kontrolü altında bulunan stokların denetimini yürüten bir denetçinin aşağıdaki denetim prosedürl"}],"donemler":["2020/2","2019/2","2019/1","2018/3","2016/3","2016/2","2016/1","2015/3","2015/1"]},"oyun":null,"tip":"teori","soru":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununun 45 inci maddesine göre meslek mensuplarının çalışma esaslarına ilişkin aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-p-meslek-zor-r2-a/kp-01","verilenler":[],"dayanak":"SMMM K. (3568 s.K.) m.45","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[],"anahtar":[{"ornek":"faaliyetler","kok":"faaliy"},{"ornek":"ticari","kok":"ticari"},{"ornek":"şirkette","kok":"şirket"},{"ornek":"meslek","kok":"meslek"},{"ornek":"birden","kok":"birden"},{"ornek":"mensubunun","kok":"mensub"}],"konuGiris":{"harita":"Ne zaman test edilir: Bir meslek mensubunun hangi işleri yapıp yapamayacağı soruluyorken test edilir. Nasıl ölçülür: Verilen davranışın kanunda sayılan yasaklara uyup uymadığına bakılarak ölçülür. Nasıl kaydedilir: Doğru/yanlış eşleştirmesiyle, hangi ifadenin kanuna aykırı olduğu işaretlenerek kaydedilir.","desen":"Soru genelde m.45\u0027teki dört kuralı (hizmet akdi, ticaret, akrabalık, reklam) karıştırıp birini yanlış cümleyle sunar. Tuzak, istisna fıkrasındaki \u0027yönetim kurulu üyeliği meslekle bağdaşmayan iş sayılmaz\u0027 kısmını yasakmış gibi göstermektir. Bu soru m.45 fıkra 3 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubunun bir işverene bağlı, maaşlı çalışamaması kuralı","ad":"Hizmet akdiyle çalışma yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubunun unvanla birlikte ticaretle uğraşamaması kuralı","ad":"Ticari faaliyet yasağı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"YMM\u0027nin belirli derecedeki akrabasının işini tasdik edememesi durumu","ad":"Akrabalık nedeniyle tasdik yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bazı kurumlardaki yönetim/denetim görevlerinin yasak sayılmaması hâli","ad":"Meslekle bağdaşmayan iş istisnası","kim":"kanun sabitler"}],"sinavda":"Dört ifade verilir, meslek mensubunun çalışma esaslarına aykırı olan yani yanlış ifade seçilir.","panel_ornek":"Bir arkadaşın hem markette kasiyer olarak maaşlı çalışıyor hem de akşamları kendi adına küçük bir esnafa defter tutuyor. İkisini aynı anda yapması, iş sözleşmesiyle bağlı olduğu için sorunlu sayılabilir. Burada \u0027birine bağlı çalışma\u0027 ile \u0027serbest çalışma\u0027 çakışıyor.","ornek":"Bir arkadaşın hem markette kasiyer olarak maaşlı çalışıyor hem de akşamları kendi adına küçük bir esnafa defter tutuyor. İkisini aynı anda yapması, iş sözleşmesiyle bağlı olduğu için sorunlu sayılabilir. Burada \u0027birine bağlı çalışma\u0027 ile \u0027serbest çalışma\u0027 çakışıyor.","yontemler":"Her seçeneği tek tek kanun metnindeki yasak listesiyle karşılaştır; istisna cümlelerini yasak sanma.","nedir":"Meslek etik ilkeleri, SMMM ve YMM\u0027lerin mesleği icra ederken uymak zorunda oldukları çalışma yasaklarını düzenler. Sınav, bu yasakların hangi durumlarda geçerli hangi durumlarda istisna olduğunu ölçer."},"olay":"","tuzak":{"D":{"ad":"İstisna Kapsamı Tuzağı","metin":"Öğrenci kamu kuruluşlarındaki her görevi meslekle bağdaşmaz sanabilir. Doğrusu: Kanun, ilgili faaliyetleri yürütmemek şartıyla yönetim kurulu üyeliğini istisna tutar, ifade doğru yazılmıştır."},"E":{"ad":"Sorumluluk Aktarımı Tuzağı","metin":"Öğrenci şirket ortaklığında cezai sorumluluğun şirkete veya ortaklara yayılacağını düşünebilir. Doğrusu: Kanun, cezai sorumluluğu işi bizzat yapan meslek mensubuna yükler, ifade doğru yazılmıştır."},"A":{"ad":"Ne soruluyor","metin":"Madde 45 kapsamında hangi ifadenin kurala aykırı olduğu soruluyor. Kural: Meslek mensupları iş elde etmek için reklam sayılabilecek faaliyetlerde bulunamaz; bu ifade kaynakla birebir örtüşür, kural doğru yazılmıştır. Doğrusu: A şıkkı kanuna uygun olduğu için yanlış cevap değildir."},"B":{"ad":"Yakın Akraba Tuzağı","metin":"Öğrenci yasağın yalnız kan hısımlığı için geçerli sandığında eşi kapsam dışı bırakır. Doğrusu: Madde 45, eş boşanmış olsa dahi tasdik yasağını sürdürür, ifade doğru yazılmıştır."}},"celdiriciYol":{},"hap":"3568 sayılı Kanunun 45 inci maddesine göre birden çok meslek mensubunun kurduğu ortaklık bürosu veya şirkette yürütülen faaliyetler ticari faaliyet sayılmaz.","teshis":{"C":{"gercek":"Madde 45, meslek mensuplarının ortaklık bürosu veya şirket şeklinde birleşmesini açıkça ticari faaliyet SAYMAZ; sorumluluk yine bireysel kalır.","ayirt":"Bu birleşme meslek hizmetini mi yoksa ticari kazancı mı amaçlıyor?","paragraf":"3568 s.K. m.45 f.2","yanilgi":"Birden fazla meslek mensubunun bir araya gelip ortak büro açmasını, tıpkı bir ticaret şirketi kurmak gibi ticari faaliyet sanıyorsun."},"E":{"gercek":"Madde 45, şirket şeklinde çalışmada cezai sorumluluğu işi fiilen yapan meslek mensubuna bırakır, ortaklığın varlığı bunu değiştirmez.","ayirt":"Bu işi fiilen kim yaptı, sorumluluk onun mu?","paragraf":"3568 s.K. m.45 f.2","yanilgi":"Şirket ortaklığında sorumluluğun tüm ortaklara veya şirkete yayılacağını sanıyorsun."},"A":{"gercek":"Madde 45, iş elde etmek için reklam sayılabilecek her faaliyeti ve tabelada unvan dışı sıfat kullanımını aynı fıkrada birlikte yasaklar.","ayirt":"Bu davranış müşteri kazanmaya yönelik tanıtım mı?","paragraf":"3568 s.K. m.45 f.2","yanilgi":"Reklam yasağının yalnız ilan vermekle sınırlı, tabela ile ilgisiz özel bir hüküm olduğunu sanıyorsun."},"D":{"gercek":"Madde 45, ilgili kurumun bu Kanun kapsamındaki faaliyetlerini bizzat yürütmemek şartıyla yönetim kurulu üyeliği, denetçilik, bilirkişilik ve tasfiye memurluğunu istisna tutar.","ayirt":"Bu görevde meslek faaliyetini bizzat ben mi yürütüyorum, yoksa gözetim/karar organı görevi mi?","paragraf":"3568 s.K. m.45 f.3","yanilgi":"Kamu kuruluşundaki her görevi otomatik olarak meslekle bağdaşmayan iş sanıyorsun."},"B":{"gercek":"Madde 45, eşi boşanmış olsa dahi YMM\u0027nin tasdik yasağını sürdürür; yasak evlilik bağına değil geçmiş yakınlığa dayanır.","ayirt":"Bu kişi kanunda sayılan yakınlar arasında mı, boşanma bunu değiştirir mi?","paragraf":"3568 s.K. m.45 f.1","yanilgi":"Boşanmanın akrabalık bağını hukuken sonlandırdığını, dolayısıyla tasdik yasağının da kalktığını sanıyorsun."}},"verilen":[],"donem":9,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 103"},"kural":"Disiplin Yönetmeliği m.19 uyarınca oda yönetim kurulu, Reklam Yasağı Yönetmeliğine aykırılık şikâyetleri konusunda soruşturma yapma görevini Haksız Rekabetle Mücadele Kuruluna verebilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 103","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Yönetmelik metninde \u0027verilebilir\u0027 ifadesi geçen her cümleyi zorunluluk şıkkıyla karıştırma, ihtiyari yetkiyle emredici hükmü ayırt et.","konu":"haksız rekabet reklam yasağı","tablo":{"satirlar":[["A) Yönetmeliğin amacı yalnızca meslek mensuplarının kendi a…","p.1","YANLIŞ ifade"],["B) Yönetmelik, 3568 sayılı Kanuna göre ruhsat almış yalnızc…","p.2","YANLIŞ ifade"],["C) Yönetmelik, 3568 sayılı Kanunun yalnızca 29 uncu maddesi…","p.3","YANLIŞ ifade"],["D) Yönetmeliğe aykırılıklarla ilgili şikâyetler konusunda i…","SMMM ve YMM K. Disiplin Yönetmeliği m.19","doğru ifade"],["E) Yönetmeliğe aykırılıklarla ilgili şikâyetlerin soruşturu…","SMMM ve YMM K. Disiplin Yönetmeliği m.19","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yönetmelik, 3568 sayılı Kanunun yalnızca 29 uncu maddesine dayanılarak hazırlanmıştır.","E":"Yönetmeliğe aykırılıklarla ilgili şikâyetlerin soruşturulması görevinin Haksız Rekabetle Mücadele Kuruluna verilmesi zorunludur; oda yönetim kurulunun bu konuda takdir yetkisi yoktur.","A":"Yönetmeliğin amacı yalnızca meslek mensuplarının kendi aralarındaki ilişkilerde haksız rekabetin önlenmesidir; müşterileriyle olan ilişkiler bu amacın kapsamı dışındadır.","D":"Yönetmeliğe aykırılıklarla ilgili şikâyetler konusunda ilgili oda yönetim kurulunca Haksız Rekabetle Mücadele Kuruluna soruşturma yapılması görevi verilebilir.","B":"Yönetmelik, 3568 sayılı Kanuna göre ruhsat almış yalnızca serbest muhasebeci mali müşavirleri kapsar; yeminli mali müşavirler ve meslek mensuplarının ortaklıkları kapsam dışındadır."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM ve YMM K. Disiplin Yonetmeligi m.19 [1/2]","metin":"Madde 19- (Başlığı ile Birlikte Değişik:RG-7/10/2023-32332) İhbar, şikâyet veya istem konusu olan hususlar, ilgili oda yönetim kurulunun kendi üyeleri arasından görevlendireceği bir veya birden fazla üye ile gerektiğinde yönetim ve disiplin kurulu dışındaki oda üyeleri arasından görevlendireceği bir veya daha fazla meslek mensubu tarafından soruşturulur. 21/11/2007 tarihli ve 26707 sayılı Resmî Gazete’de yayımlanan Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliğine aykırılıklarla ilgili şikayetler konusunda, Oda Yönetim Kurulunca Haksız Rekabetle Mücadele Kuruluna soruşturma yapılması görevi verilebilir. Soruşturma işlemlerinde gizliliğe özen gösterilir. Soruşturma ile görevlendirilenler kanıtları toplar, hakkında disiplin soruşturması yapılan meslek mensubundan yazılı veya tutanağa geçirilmek suretiyle sözlü olarak bilgi alır, gerektiğinde ihbar veya şikâyette bulunanların da bilgisine başvurur. Hakkında soruşturma yapılan meslek mensubundan bilgi almak için verilen süre dolmasına rağmen meslek mensubunun bilgi vermemesi veya odaya bildirdiği adreslerine tebligat yapılamaması nedeniyle meslek mensubundan bilgi alınamaması durumunda, dosya üzerinden yapılan inceleme ile yetinilir. Bu fıkra uyarınca meslek mensubundan bilgi almak için verilecek süre 15 günden az olamaz. Bilgi istem yazısında soruşturma konusu hususlar açıkça belirtilir. Soruşturma ile görevlendirilenler, disiplin soruşturması sırasında herhangi bir şekilde meslek mensubunun başka suçlarından da haberdar oldukları takdirde, hiçbir i…"},{"ad":"SMMM ve YMM K. Disiplin Yonetmeligi m.19 [2/2]","metin":"Görevli kişi veya kişiler, gerekli göreceği kimselerin ifadelerini alabilir, gerekli gördüğü defter ve belgeleri inceleyebilir, oda yönetimi aracılığı ile soruşturma maksadıyla her türlü adlî ve idarî mercilerden bilgi ve belge isteyebilir veya yetkili makamın izniyle ilgili dosyaları inceleyebilir ve örneklerini isteyebilir. Soruşturma ile görevlendirilenler soruşturma sürecinde topladıkları tüm belgeleri bir soruşturma dosyasında muhafaza eder ve bu dosyayı düzenleyeceği disiplin soruşturması raporu ile birlikte oda yönetim kuruluna teslim eder. Oda yönetim kurulu; soruşturma raporunu eksik görürse, raporu düzenleyeni veya başka kişileri eksikliği tamamlattırmak üzere görevlendirebilir. Tamamlanan soruşturma raporu yönetim kurulunda görüşülerek disiplin kovuşturması açılması veya disiplin kovuşturması açılmasına yer olmadığı kararı verilir. Yönetim kurulu üyeleri, kendileri hakkındaki soruşturmaya ilişkin görüşme ve kararlara katılamaz. Yönetim kurulu bu madde gereğince yapmış olduğu soruşturmayı ihbar, şikâyet veya istek tarihinden itibaren en geç altı ay içinde sonuçlandırır. Disiplin Soruşturması Sonucu Verilecek Karar (Değişik başlık:RG-7/10/2023-32332)"}],"hakem":"Soru, Disiplin Yönetmeliği m.19\u0027da açıkça düzenlenen haksız rekabet şikâyetlerinin Haksız Rekabetle Mücadele Kuruluna verilmesi imkânını doğru bir şekilde ortaya koymaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Adaylar tek bir dayanak maddesini hatırlar ve diğerlerini atlarlar. Yönetmelik aslında dört maddeye (29, 33, 44 ve 50) dayanılarak hazırlanmıştır.","E":"Adaylar \"verilebilir\" sözcüğünü \"verilmesi şarttır\" anlamında okur ve zorunluluk görürler. Aslında bu görevlendirme, oda yönetim kurulunun takdir yetkisine bırakılmıştır ve seçimlik bir imkândır.","A":"Adaylar yönetmelik amacını yalnız meslek mensupları arası ilişkilerle sınırlı sanırlar. Oysa amaç, meslek mensuplarının kendi aralarında ve müşterileriyle olan her iki ilişki türünde haksız rekabetin önlenmesidir.","B":"Adaylar yönetmelik adındaki değişikliği yanlış okur ve yeminli mali müşavirleri kapsam dışı sanırlar. Gerçekte yönetmelik, serbest muhasebeci mali müşavirleri, yeminli mali müşavirleri ve onların tüm ortaklıklarını kapsar."},"dogru":"Oda yönetim kurulu, Reklam Yasağı Yönetmeliğine aykırılık şikâyetlerini soruşturmak üzere Haksız Rekabetle Mücadele Kuruluna görev verebilir. Bu bir seçenek, zorunluluk değildir. Yönetim kurulunun takdir yetkisi vardır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 50. madde; Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği 29, 33, 44 ve 50. madde.","kavramlar":[{"kaynak":"SMMM ve YMM K. Disiplin Yonetmeligi 3. madde","tanim":"İhbar veya şikâyet dilekçesinin yahut istemin odaya intikalinden, dosyanın disiplin kuruluna sevkine kadar olan aşamayı ifade eder.","ad":"disiplin soruşturması"},{"kaynak":"Haksız Rekabet ve Reklam Yasağı Yön. 1. madde","tanim":"Meslek mensuplarının kendi aralarında ve müşterileri ile olan ilişkilerinde dürüst olmayan ve rekabetin bozulmasına yol açan davranışlar.","ad":"haksız rekabet"},{"kaynak":"SMMM ve YMM K. Disiplin Yonetmeligi 19. madde","tanim":"Oda yönetim kurulunun, şikâyet soruşturmasını yapma görevini Haksız Rekabetle Mücadele Kuruluna verip vermeme kararını kendisinin alabilme hakkı.","ad":"takdir yetkisi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":["2026/2","2025/3","2020/3","2020/2","2019/2","2017/1","2015/3"]},"oyun":null,"tip":"teori","soru":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği ile bu Yönetmeliğe aykırılıkların soruşturulmasına ilişkin disiplin düzenlemesi birlikte değerlendirildiğinde aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-p-meslek-cokzor-r1-a/kp-01","verilenler":[],"dayanak":"SMMM ve YMM K. Disiplin Yönetmeliği m.19; Haksız Rekabet ve Reklam Yasağı Yön. m.1, m.2, m.3","dogru":"D","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara SMMM Odası\u0027na, bir mali müşavirin rakip büroyu kötüleyen ilan verdiği yönünde 14 Mart\u0027ta şikâyet gelir.","anlatim":"Oda yönetim kurulu bu şikâyeti elinde tutar, kim soruşturacak diye düşünür.","doldur":[]},{"formul":"Ne yapacağız: oda yönetim kurulunun bu şikâyeti Haksız Rekabetle Mücadele Kuruluna verip veremeyeceğini, zorunlu mu yoksa takdiri mi olduğunu, Yönetmeliğin amacını, kapsamını ve dayanağını beş ifadede tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.1","karar":"yanlış","anlatim":"Yönetmeliğin amacı hem meslek mensuplarının kendi aralarında hem müşterileriyle ilişkisini kapsar. Amaç maddesi \u0027kendi aralarında ve müşterileri ile\u0027 der, ikisini birden sayar.","formul":"Şık A: birisi sana \u0027bu Yönetmelik sadece meslek mensupları birbirine karşı davranırken geçerli, müşteriyle ilişkide geçerli değil\u0027 derse katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.2","karar":"yanlış","anlatim":"Kapsam maddesi hem serbest muhasebeci mali müşavirleri hem yeminli mali müşavirleri hem de ortaklıkları sayar. Kaldırılan ibare sadece \u0027serbest muhasebecilik\u0027 unvanına ilişkindir, yeminli mali müşavir dışarıda bırakılmamıştır.","formul":"Şık B: \u0027yeminli mali müşavirler ve ortaklıklar bu Yönetmeliğin dışında kalır, sadece serbest muhasebeci mali müşavirler kapsanır\u0027 diyen birine hak verir misin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.3","karar":"yanlış","anlatim":"Dayanak maddesi dört madde sayar: 29, 33, 44 ve 50. Tek maddeye indirgemek eksik okumadır.","formul":"Şık C: \u0027bu Yönetmelik sadece 29 üncü maddeye dayanır\u0027 diyen birine katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"SMMM ve YMM K. Disiplin Yönetmeliği m.19","karar":"doğru","anlatim":"Disiplin Yönetmeliği m.19 bu görevlendirmeyi ihtiyari bırakır, \u0027verilebilir\u0027 der. Oda yönetim kurulu isterse kendisi de yürütebilir, isterse Kurula verebilir.","formul":"Şık D: oda yönetim kurulu, elindeki bu şikâyeti Haksız Rekabetle Mücadele Kuruluna soruşturma yapması için verebilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"SMMM ve YMM K. Disiplin Yönetmeliği m.19","karar":"yanlış","anlatim":"Madde metni açıkça bir ihtimal sunar, emredici bir dil kullanmaz. Zorunluluk yok, yetki var.","formul":"Şık E: \u0027bu görevlendirme zorunludur, oda yönetim kurulunun takdir hakkı yoktur\u0027 diyen birine katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Tek doğru cevap D\u0027dir çünkü görevlendirme bir imkândır, zorunluluk değil. Kendime hep şunu sorarım: madde metninde fiil \u0027verilebilir\u0027 mi yoksa \u0027verilir\u0027 mi?","doldur":[]}],"anahtar":[{"ornek":"kurulu","kok":"kurulu"},{"ornek":"yönetmeliğine","kok":"yönetm"},{"ornek":"yönetim","kok":"yöneti"},{"ornek":"zorunluluk","kok":"zorunl"},{"ornek":"soruşturmayı","kok":"soruşt"},{"ornek":"rekabet","kok":"rekabe"}],"konuGiris":{"harita":"Ne zaman devreye girer: haksız rekabet/reklam yasağına aykırılık ihbar, şikâyet ya da istemle odaya bildirildiğinde. Nasıl yürütülür: oda yönetim kurulunun görevlendirdiği kişi(ler) veya Haksız Rekabetle Mücadele Kurulu soruşturma yapar, disiplin kuruluna sevk etmez. Nasıl sonuçlanır: yönetim kurulu raporu görüşüp kovuşturma açılmasına veya açılmamasına karar verir, bu karar disiplin cezası değildir.","desen":"Sorular genelde iki yönetmeliği birleştirip, reklam yasağı ihlalinin doğrudan disiplin cezası değil önce soruşturma sürecine tabi olduğunu sorar. Tuzak, öğrencinin \u0027Haksız Rekabetle Mücadele Kurulu ceza verir\u0027 sanmasıdır; oysa kurul sadece soruşturur, karar yönetim kurulunundur. Bu soru m.19\u0027daki soruşturma-kovuşturma ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İhbar/şikâyetin odaya girişinden dosyanın disiplin kuruluna sevkine kadarki aşama","ad":"Disiplin soruşturması","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Reklam yasağı ihlali şikâyetlerini soruşturmakla oda yönetim kurulunca görevlendirilebilen kurul","ad":"Haksız Rekabetle Mücadele Kurulu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yönetim kurulunun soruşturmayı ihbar tarihinden itibaren tamamlaması gereken azami süre","ad":"Soruşturma süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yönetim kurulunun rapor sonunda verdiği, dosyanın disiplin kuruluna gidip gitmeyeceğine dair karar","ad":"Kovuşturma kararı","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda yönetmeliklerin birlikte uygulanışı verilir, hangi organın ne yaptığı ve sürecin doğru sırası istenir.","panel_ornek":"Bir esnaf, rakip dükkânın önüne \u0027burada daha ucuz\u0027 diye pankart aşamaz; şikâyet olursa esnaf odası önce soruşturma açar, ceza kesmez. Diyelim ki 3 kişilik bir esnaf kurulu dosyayı 6 haftada inceleyip üst kurula gönderir. Bu süreçte kurul kendisi ceza vermez, sadece rapor hazırlar.","ornek":"Bir esnaf, rakip dükkânın önüne \u0027burada daha ucuz\u0027 diye pankart aşamaz; şikâyet olursa esnaf odası önce soruşturma açar, ceza kesmez. Diyelim ki 3 kişilik bir esnaf kurulu dosyayı 6 haftada inceleyip üst kurula gönderir. Bu süreçte kurul kendisi ceza vermez, sadece rapor hazırlar.","yontemler":"Disiplin soruşturması ile kovuşturma aşamalarını ve hangi organın hangi işlemi yaptığını ayırt ederek çözülür.","nedir":"Haksız Rekabet ve Reklam Yasağı Yönetmeliği, meslek mensuplarının iş elde etmek için haksız rekabet ve reklam yapmasını önlemeyi amaçlar. Sınav, bu yönetmeliğe aykırılığın disiplin sürecinde nasıl soruşturulduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Dayanak Maddesi Tuzağı","metin":"Öğrenci dayanak maddesindeki tek bir madde numarasını hatırlar, diğerlerini atlar. Doğrusu: Yönetmelik 3568 sayılı Kanunun 29, 33, 44 ve 50 nci maddelerine dayanılarak hazırlanmıştır."},"E":{"ad":"Zorunluluk Tuzağı","metin":"Öğrenci \u0027verilebilir\u0027 ifadesini \u0027verilmesi şarttır\u0027 şeklinde okur. Doğrusu: Görevlendirme oda yönetim kurulunun takdirine bırakılmıştır, zorunlu değildir."},"A":{"ad":"Amaç Maddesi Tuzağı","metin":"Öğrenci amacı yalnız meslek mensupları arası ilişkiyle sınırlı sanır. Doğrusu: Yönetmeliğin amacı hem meslek mensuplarının kendi aralarında hem de müşterileriyle olan ilişkilerinde haksız rekabetin önlenmesidir."},"B":{"ad":"Kapsam Maddesi Tuzağı","metin":"Adı \u0027...Serbest Muhasebecilik...\u0027 ibaresinin kaldırılmasını, yeminli mali müşavirlerin de kapsam dışı kaldığı şeklinde okur. Doğrusu: Yönetmelik serbest muhasebeci mali müşavirleri, yeminli mali müşavirleri ve meslek mensuplarının her türlü ortaklıklarını kapsar."}},"celdiriciYol":{"C":"Dayanak maddesindeki dört madde numarasından yalnız ilki (29) hatırlanınca bu şık üretilir (dayanak listesinin eksik sayılması).","E":"Disiplin Yönetmeliği m.19\u0027daki \u0027verilebilir\u0027 ifadesi \u0027verilir/zorunludur\u0027 şeklinde yanlış okununca bu şık üretilir (ihtiyari yetkinin zorunluluğa çevrilmesi).","A":"Amaç maddesindeki \u0027kendi aralarında\u0027 ibaresi okunup \u0027müşterileri ile\u0027 ibaresi atlanınca bu şık üretilir (amaç maddesinin eksik okunması).","B":"Kapsam maddesindeki \u0027Serbest Muhasebecilik\u0027 ibaresinin mülga olması, yeminli mali müşavirlerin de kapsam dışı kaldığı şeklinde yanlış genellenince bu şık üretilir (kapsam maddesinin yanlış genellenmesi)."},"hap":"Haksız Rekabet ve Reklam Yasağı Yönetmeliğine aykırılık şikâyetlerinde oda yönetim kurulu, soruşturmayı bizzat yürütebileceği gibi bu görevi Haksız Rekabetle Mücadele Kuruluna da verebilir; bu bir takdir yetkisidir, zorunluluk değildir.","teshis":{"C":{"gercek":"Yönetmelik m.3, 3568 sayılı Kanunun 29, 33, 44 ve 50 nci maddelerine dayanır; tek maddeye indirgemek eksik okumadır.","ayirt":"Dayanak maddesinde birden fazla madde numarası sayılıyor mu diye kontrol ediyorum.","paragraf":"Haksız Rekabet ve Reklam Yasağı Yön. m.3","yanilgi":"Dayanak maddesinde tek madde numarası hatırlıyor, listenin tamamını atlıyorsun."},"E":{"gercek":"Madde metni açıkça ihtiyari bir görevlendirmeyi düzenler; oda yönetim kurulu soruşturmayı bizzat da yürütebilir.","ayirt":"Metinde takdir yetkisini gösteren \u0027verilebilir\u0027 ifadesi mi yoksa emredici bir ifade mi var diye bakıyorum.","paragraf":"SMMM ve YMM K. Disiplin Yönetmeliği m.19","yanilgi":"\u0027Verilebilir\u0027 ifadesini zorunluluk olarak okuyorsun."},"A":{"gercek":"Yönetmelik m.1, amacı hem meslek mensuplarının kendi aralarında hem müşterileriyle olan ilişkilerinde haksız rekabetin önlenmesi olarak tanımlar.","ayirt":"Madde metninde \u0027kendi aralarında VE müşterileri ile\u0027 bağlacı var mı diye kendime soruyorum.","paragraf":"Haksız Rekabet ve Reklam Yasağı Yön. m.1","yanilgi":"Amaç maddesini yalnız meslek mensupları arası ilişkiyle sınırlı sanıyorsun."},"D":{"gercek":"Disiplin Yönetmeliği m.19, oda yönetim kurulunun Haksız Rekabetle Mücadele Kuruluna soruşturma yapılması görevi \u0027verilebileceğini\u0027 düzenler; bu ihtiyari bir yetkidir.","ayirt":"Madde metninde fiil \u0027verilebilir\u0027 mi yoksa \u0027verilir\u0027 mi diye kelimeyi tekrar okuyorum.","paragraf":"SMMM ve YMM K. Disiplin Yönetmeliği m.19","yanilgi":"Bu görevlendirmenin zorunlu olduğunu düşünerek şıkkı elersin."},"B":{"gercek":"Yönetmelik m.2, serbest muhasebeci mali müşavirleri, yeminli mali müşavirleri ve meslek mensuplarının ortaklıklarını kapsar; kaldırılan ibare yalnız \u0027serbest muhasebecilik\u0027 unvanına ilişkindir.","ayirt":"Kaldırılan ibarenin unvan mı yoksa meslek grubunun tamamı mı olduğunu ayırt ediyorum.","paragraf":"Haksız Rekabet ve Reklam Yasağı Yön. m.2","yanilgi":"İbare kaldırımı sonucu yeminli mali müşavirlerin de kapsam dışı kaldığını sanıyorsun."}},"verilen":[],"donem":7,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 102"},"kural":"Doğrusu: 6460 sayılı Kanunla eklenen fıkra uyarınca mesken olarak gösterilen bağımsız bölümlerde büro açılması kat maliklerinin izni ve benzeri şartlar aranmaksızın mümkündür; yönetim planındaki aksine hükümler de uygulanmaz. İfadedeki \u0027oy birliğiyle izne bağlıdır\u0027 koşulu kanunun aradığı kuralın tam tersidir, bu yüzden yanlış olan şık budur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 102","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"\u0027İzin aranmaksızın\u0027 ibaresi geçen istisna fıkralarında şıkkın tam tersi yazılıp yazılmadığını kontrol et, bu sınavın klasik ters çevirme tuzağıdır.","konu":"büro edinme zorunluluğu","tablo":null,"siklar":{"C":"Şirket şeklinde çalışılması halinde yapılan işlerden doğacak cezai sorumluluk, şirket tüzel kişiliğine değil işi fiilen yapan meslek mensubuna aittir.","E":"Kat Mülkiyeti Kanununa göre anagayrimenkulün mesken olarak gösterilen bağımsız bölümlerinde büro açılabilmesi, kat maliklerinin oy birliğiyle vereceği izne bağlıdır.","A":"Yeminli mali müşavirler muhasebe ile ilgili defter tutamaz, muhasebe bürosu açamaz ve muhasebe bürolarına ortak olamazlar.","D":"Meslek mensupları, kişisel veya ortak bürolarında mesleği icra etmeleri yasaklanan kişileri çalıştıramayacakları gibi bunlarla mesleki işbirliği de yapamazlar.","B":"Birden çok meslek mensubu çalışmalarını serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik ortaklık bürosu ya da şirket şeklinde birleştirebilir; bu bürolarda yapılan faaliyetler ticari faaliyet sayılmaz."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.13","metin":"Madde 13 – Meslek mensupları, kişisel veya ortak bürolarında mesleği yapmaları yasaklananları çalıştıramayacakları gibi, bunlarla her ne şekilde olursa olsun meslekleri ile ilgili işbirliği yapamazlar. İKİNCİ BÖLÜM Serbert Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Odalar, nitelikleri ve faaliyet sınırı"},{"ad":"SMMM K. (3568 s.K.) m.45 [1/2]","metin":"Madde 45 –(…)19 serbest muhasebeci mali müşavirler bu unvanlarla, yeminli mali müşavirler ise bu unvan ve tasdik yetkisiyle; 2 nci maddede yazılı işlerin yürütülmesi amacıyla gerçek ve tüzelkişilere tabi ve onların işyerlerine bağlı olarak hizmet akdi ile çalışamazlar, ticari faaliyette bulunamazlar, meslekle ve meslek onuru ile bağdaşmayan işlerle uğraşamazlar. Yeminli mali müşavirler, eşi (boşanmış dahi olsa) usul ve füruundan biri ve 3 üncü dereceye kadar (bu derece dahil) kan ve sıhri hısımlarının veya bunların ortak oldukları firmaların işlerine bakamazlar, yukarıda sayılan yakınlıktaki akrabaları olan (…)19 serbest muhasebeci mali müşavirlerin baktığı işleri tasdik edemezler. (Değişik üçüncü fıkra: 23/7/2010-6009/47 md.) Hayri ve ilmi kuruluşlar, 233 sayılı Kamu İktisadi Teşebbüsleri Hakkında Kanun Hükmünde Kararname kapsamındaki iktisadi devlet teşekkülleri, kamu iktisadi kuruluşları ve bunların müesseseleri, bağlı ortaklıkları ve iştirakleri, kamu idarelerinin doğrudan ya da dolaylı hissedarı olduğu kurumlar ile Tasarruf Mevduatı Sigorta Fonunun yönetimindeki kurumların bu Kanun kapsamındaki faaliyetlerini yürütmemeleri şartıyla, bu kurum ve kuruluşların yönetim kurulu başkanlığı, üyeliği, denetçiliği görevleri ile bilirkişilik ve tasfiye memurluğu meslekle bağdaşmayan işler sayılmaz. Bu madde başlığı “Reklam yasağı” iken, 10/7/2008 tarihli ve 5786 sayılı Kanunun 17 nci maddesiyle metne işlendiği şekilde değiştirilmiştir. 19 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"Serbest muhasebeciler,\", \"serbest muhasebecilerin ve\", \"serbe…"}],"hakem":"Doğru sık (E), 3568 sayılı SMMM Kanunu m.45\u0027in 6460 sayılı Kanunla eklenen fıkrasında yer alan hüküme dayanmakta ve kaynak metinde açıkça desteklenmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Şirket şeklinde çalışmada dahi cezai sorumluluk işi gerçekten yapan kişiye aittir, şirketin tüzel kişiliğine değil; ifade doğrudur.","A":"Yeminli mali müşavirlerin muhasebe defteri tutamayacağı, muhasebe bürosu açamayacağı ve ortak olamayacağı kanunda açıkça yazılı olduğu için bu ifade doğrudur.","D":"Kanun hem çalıştırmayı hem de her türlü mesleki işbirliğini yasakladığı için ifade doğrudur.","B":"Birden çok meslek mensubunun ortaklık bürosu veya şirket kurması kanunda öngörülmüş ve bu faaliyetler ticari sayılmaz; ifade doğrudur."},"dogru":"Kanun, mesken bölümlerde büro açılmasını kat maliklerinin izni olmaksızın mümkün kılmıştır. E şıkkı, izin şartı arandığını söyleyerek kanunun tam tersini ifade eder; bu yüzden yanlıştır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 45. madde","kavramlar":[{"kaynak":"SMMM K. 45. madde","tanim":"Birden çok meslek mensubunun çalışmalarını serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik alanında birleştirerek kurabilecekleri iş yapısı; bu şekilde yapılan faaliyetler ticari faaliyet sayılmaz.","ad":"Ortaklık bürosu veya şirket"},{"kaynak":"SMMM K. 13. madde","tanim":"Meslek mensuplarının mesleği yapmaları yasaklanan kişileri çalıştıramaması ve bunlarla hiçbir şekilde meslekle ilgili işbirliği yapamaması.","ad":"Mesleki işbirliği yasağı"},{"kaynak":"SMMM K. 45. madde","tanim":"Kat Mülkiyeti Kanununa göre mesken olarak gösterilen bağımsız bölümlerde kat maliklerinin izni ve benzeri şartlar aranmaksızın serbest muhasebeci mali müşavirlik veya yeminli mali müşavirlik faaliyeti yürütülüp büro açılabilmesi.","ad":"Mesken bölümde büro açma hakkı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/1","2021/2","2020/3"]},"oyun":null,"tip":"teori","soru":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre büro edinme ve meslek icrasına ilişkin aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-03","verilenler":[],"dayanak":"3568 sayılı SMMM Kanunu m.2/B, m.13, m.45 (6460 s.K. m.9 ile eklenen fıkra)","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[],"anahtar":[{"ornek":"planındaki","kok":"planın"},{"ornek":"mesken","kok":"mesken"},{"ornek":"hükümler","kok":"hüküml"},{"ornek":"yönetim","kok":"yöneti"},{"ornek":"bağımsız","kok":"bağıms"},{"ornek":"maliklerinin","kok":"malikl"}],"konuGiris":{"harita":"Ne zaman test edilir: meslek mensubunun büro, ortaklık veya bağımlı çalışma durumu tarif edildiğinde. Nasıl ölçülür: verilen davranışın kanunda sayılan yasaklardan (ticari faaliyet, hizmet akdiyle çalışma, reklam, akraba işi tasdik etme) hangisine girip girmediği tespit edilerek. Nasıl kaydedilir: doğru-yanlış eşleştirmesi yerine \u0027hangisi yanlıştır\u0027 sorusunda tek aykırı ifade işaretlenerek.","desen":"Sınav genellikle dört-beş ifade sıralar; üçü kanunun izin verdiği (ortak büro, mesken bağımsız bölümde büro açma) durumları, biri yasak olanı (hizmet akdiyle çalışma, reklam) anlatır. Tuzak, \u0027ortak büro ticari faaliyet sayılır\u0027 gibi kanunun tersini söyleyen ifadedir. Bu soru m.45 ve m.13\u0027teki yasak/serbest ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensupları bireysel veya ortak büro kurabilir, bu ticari faaliyet sayılmaz.","ad":"Büro/ortaklık serbestisi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubu unvanıyla işverene bağlı olarak ücretli çalışamaz.","ad":"Hizmet akdiyle çalışma yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İş elde etmek amacıyla reklam sayılan faaliyette bulunulamaz.","ad":"Reklam yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yeminli mali müşavir belirli derecede akrabasının işini tasdik edemez.","ad":"Akraba işi tasdik yasağı","kim":"kanun sabitler"}],"sinavda":"Meslek icrası ve büro edinmeyle ilgili birkaç ifade verilir, kanuna aykırı olan tek ifade istenir.","panel_ornek":"Bir arkadaşın kuaförlük belgesi alıyor ama aynı zamanda başka bir dükkanda tam zamanlı kasiyer olarak da çalışmak istiyor; ustası ona ikisini birlikte yürütemeyeceğini, ya dükkan açacağını ya da bağımlı çalışacağını söylüyor. Meslek belgesi almak başka, o unvanla bağımlı çalışmak başkadır.","ornek":"Bir arkadaşın kuaförlük belgesi alıyor ama aynı zamanda başka bir dükkanda tam zamanlı kasiyer olarak da çalışmak istiyor; ustası ona ikisini birlikte yürütemeyeceğini, ya dükkan açacağını ya da bağımlı çalışacağını söylüyor. Meslek belgesi almak başka, o unvanla bağımlı çalışmak başkadır.","yontemler":"Her ifadeyi \u0027kanun bunu yasaklıyor mu, serbest mi bırakıyor mu\u0027 diye tek tek kontrol et; en kritik kural, hizmet akdiyle çalışma ve ticari faaliyetin kesin yasak olduğudur.","nedir":"Bu konu, meslek mensuplarının büro açma, ortaklık kurma ve meslek icrasındaki yasakları düzenler. Sınav, hangi davranışın kanunen serbest hangi davranışın yasak olduğunu ayırt etmeni ölçer."},"olay":"","tuzak":{"C":{"ad":"Tüzel Kişilik Sorumluluğu Tuzağı","metin":"şirket kurulunca sorumluluğun da şirkete geçtiğini sanırsın. Doğrusu: Kanun, şirket şeklinde çalışmada dahi cezai sorumluluğu işi bizzat yapan meslek mensubunda bırakır; ifade doğrudur."},"A":{"ad":"Ne soruluyor","metin":"beş ifadeden hangisinin Kanun\u0027a aykırı olduğu soruluyor. Kural: yeminli mali müşavirlerin muhasebe defteri tutamayacağı, muhasebe bürosu açamayacağı ve muhasebe bürolarına ortak olamayacağı Kanun\u0027un 2 nci maddesinin B fıkrasında açıkça düzenlenmiştir. Doğrusu: bu ifade Kanun metniyle birebir örtüştüğünden doğrudur, yanlış şık bu değildir."},"D":{"ad":"İşbirliği Kapsamı Tuzağı","metin":"yasağın yalnız çalıştırmayı kapsadığını, işbirliğini kapsamadığını sanırsın. Doğrusu: Kanun\u0027un 13 üncü maddesi hem çalıştırmayı hem her türlü mesleki işbirliğini birlikte yasaklar; ifade doğrudur."},"B":{"ad":"Sınırlı Ortaklık Tuzağı","metin":"bu tür bürolaşmanın ticari faaliyet sayılacağını düşünüp ifadeyi yanlış zannedersin. Doğrusu: Kanun\u0027un 45 inci maddesi bu birleşmeyi açıkça öngörür ve bu bürolarda yapılan faaliyeti ticari faaliyet saymaz; ifade doğrudur."}},"celdiriciYol":{},"hap":"Mesken nitelikli bağımsız bölümlerde meslek icrası için kat maliklerinin izni ve yönetim planındaki aksi hükümler aranmaz.","teshis":{"C":{"gercek":"3568 sayılı Kanun m.45, şirket şeklinde çalışmada dahi cezai sorumluluğu işi yapan meslek mensubuna yükler.","ayirt":"Cezai sorumluluk şirkete mi, yoksa işlemi bizzat yapan kişiye mi aittir?","paragraf":"3568 s.K. m.45","yanilgi":"Şirket kurulunca sorumluluğun şirkete geçtiğini, işi yapan kişinin korunacağını sanıyorsun."},"E":{"gercek":"3568 sayılı Kanun m.45\u0027e eklenen fıkra, mesken nitelikli bağımsız bölümlerde büronun kat maliklerinin izni aranmaksızın açılabileceğini, yönetim planındaki aksi hükümlerin dahi uygulanmayacağını söyler.","ayirt":"Kanun bu izni \u0027arar\u0027 mı yoksa açıkça \u0027aramaz\u0027 mı diyor?","paragraf":"3568 s.K. m.45, ek fıkra (6460 s.K. m.9)","yanilgi":"Meskende büro açmanın da tıpkı diğer taşınmazlarda olduğu gibi kat maliklerinin rızasına bağlı olduğunu sanıyorsun."},"A":{"gercek":"3568 sayılı Kanun m.2/B, yeminli mali müşavirlere defter tutma ve muhasebe bürosu açma/ortak olma yasağını açıkça koyar.","ayirt":"Bu meslek mensubu tasdik mi yapıyor, yoksa muhasebe kaydı mı tutuyor?","paragraf":"3568 s.K. m.2/B","yanilgi":"Yeminli mali müşavirlerin de serbest muhasebecilik yapabileceğini, dolayısıyla muhasebe bürosu açabileceğini düşünüyorsun."},"D":{"gercek":"3568 sayılı Kanun m.13, hem çalıştırmayı hem her ne şekilde olursa olsun mesleki işbirliğini birlikte yasaklar.","ayirt":"Yasaklı kişiyle ilişki çalıştırma biçiminde olmasa bile bir işbirliği midir?","paragraf":"3568 s.K. m.13","yanilgi":"Yasağın yalnız \u0027çalıştırma\u0027yı kapsadığını, işbirliğini kapsamadığını düşünüyorsun."},"B":{"gercek":"3568 sayılı Kanun m.45, ortaklık bürosu ve şirket şeklindeki birleşmeyi meslek icrası sayar, ticari faaliyet saymaz.","ayirt":"Bu birleşme meslek mensuplarının kendi mesleğini mi, yoksa ticari bir işi mi yürütüyor?","paragraf":"3568 s.K. m.45","yanilgi":"Birden fazla meslek mensubunun bir araya gelerek kurduğu ortaklık bürosunu ticari işletme sanıyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 104"},"kural":"Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.32\u0027ye göre yönetmelik hükümlerine aykırılık tespit edilmesi halinde odalar tarafından resen veya şikayet üzerine soruşturma başlatılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 104","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde \u0027veya\u0027 bağlacı geçiyorsa, şıklardan yalnızca biri seçenekleri sınırlayan (şart koşan) tuzağı barındırır - onu ele.","konu":"disiplin yönetmeliği","tablo":{"satirlar":[["A) Odalar, yönetmelik hükümlerine aykırılık tespit edilmesi…","m.32","doğru ifade"],["B) Disiplin soruşturması ancak ilgili kişi veya kuruluşları…","m.32","YANLIŞ ifade"],["C) Disiplin soruşturmasını başlatma yetkisi odalara değil, …","m.32","YANLIŞ ifade"],["D) Disiplin soruşturması, ancak Maliye Bakanlığının resen t…","m.32","YANLIŞ ifade"],["E) Disiplin soruşturması, ancak konu hakkında bir mahkeme k…","m.32","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Disiplin soruşturmasını başlatma yetkisi odalara değil, yalnızca Türkiye Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Birliğine aittir.","E":"Disiplin soruşturması, ancak konu hakkında bir mahkeme kararı bulunması halinde odalar tarafından başlatılabilir.","A":"Odalar, yönetmelik hükümlerine aykırılık tespit edilmesi halinde resen veya şikayet üzerine disiplin soruşturması başlatabilir.","D":"Disiplin soruşturması, ancak Maliye Bakanlığının resen talimat vermesi üzerine odalar tarafından başlatılabilir.","B":"Disiplin soruşturması ancak ilgili kişi veya kuruluşların yazılı şikayeti üzerine başlatılabilir, oda kendiliğinden soruşturma açamaz."},"kaynak":{"alinti":"","liste":[{"ad":"Haksız Rekabet ve Reklam Yasağı Yön. m.32","metin":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği (RG 21.11.2007, Sayı 26707; RG 16.5.2015/29357 ve RG 24.2.2025/32823 değişiklikleri işlenmiş güncel metin; adındaki \"Serbest Muhasebecilik,\" ibaresi yürürlükten kaldırılmıştır) m.32 — Disiplin soruşturması. Disiplin soruşturması MADDE 32 – (1) Bu Yönetmelik hükümlerine aykırılık tespit edilmesi halinde, odalar tarafından resen veya şikayet üzerine disiplin soruşturması başlatılır."},{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"}],"hakem":"Soru, Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.32\u0027ye dayanarak disiplin soruşturmasının resen veya şikayet üzerine başlatılabileceğini soruyor; kaynak metinde bu kural açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Disiplin soruşturması yetkisi odalara tanınmıştır, üst çatı kuruluşa (Birlik) değil; bu şık oda yerine Birlik\u0027i yetkilendirerek yanıltır.","E":"İdari disiplin soruşturması ceza yargılamasından bağımsızdır; bu şık soruşturmaya mahkeme kararını ön şart olarak yanlışlıkla getirir.","D":"Oda kendi tespitiyle harekete geçebilir, Maliye Bakanlığı\u0027ndan talimat almak zorunda değildir; bu şık mesleki disiplini devlet otoritesine yanlışlıkla bağlar.","B":"Şikayet olmasa da yönetmelik açıkça \u0027resen veya şikayet üzerine\u0027 der; bu şık sadece şikayet şartını arayan adaya cazip gelir ama doğru değildir."},"dogru":"Oda, reklam yasağına aykırılığı kendi denetiminde tespit etse bile şikayet gelmesini beklemez. Yönetmeliğe göre odalar resen (kendi tespitleriyle) veya şikayet üzerine soruşturma açabilirler. Bu yüzden oda tespiti yeterlidir, şikayet zorunlu değildir.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği 32. madde.","kavramlar":[{"kaynak":"Haksız Rekabet ve Reklam Yasağı Yön. 32. madde","tanim":"Yönetmelik hükümlerine aykırılık tespit edilmesi halinde meslek mensubu hakkında odalar tarafından başlatılan soruşturmadır.","ad":"disiplin soruşturması"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2020/2","2019/3","2015/1"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavir hakkında, reklam yasağına aykırı davrandığına dair herhangi bir şikayet dilekçesi bulunmamasına rağmen, bağlı olduğu oda bu aykırılığı kendi denetimi sırasında tespit etmiştir. Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği\u0027ne göre, disiplin soruşturmasının başlatılmasına ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-p-meslek-zor-r2-a/kp-03","verilenler":[],"dayanak":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Mesleklerine İlişkin Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.32","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: bir SMMM\u0027nin ofisinde \u0027yılbaşı kampanyası %50 indirim\u0027 yazan tabelayı, oda denetçisi rutin bir teftişte fark ediyor; ortada hiçbir müşteri şikayeti yok.","anlatim":"Oda kendi denetiminde reklam yasağına aykırılığı görmüş, dilekçe falan yok elinde. Şimdi oda ne yapacak, soruşturma açabilecek mi diye bakacağız.","doldur":[]},{"formul":"Ne yapacağız: m.32\u0027ye göre oda, yönetmeliğe aykırılığı tespit ederse resen ya da şikayet üzerine soruşturma açar; burada şikayet yok ama tespit var.","anlatim":"Kural tek: iki yol var, biri şikayet biri resen tespit, ikisi de yeter. Şimdi beş şıkkı bu tabela olayında tek tek deneyelim.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.32","karar":"doğru","anlatim":"Tabelayı denetimde kendisi görmüş, bu resen tespit demek. m.32 tam da bunu söylüyor, ikisinden biri yeter. Oda burada hem resen hem şikayet üzerine yetkili, ifade doğru.","formul":"Şık A: oda başkanı \u0027şikayet yok ama biz gördük, soruşturma açalım\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.32","karar":"yanlış","anlatim":"Elimizde şikayet yok ama oda zaten kendi tespitiyle harekete geçebiliyor. Madde şikayeti zorunlu kılmıyor, resen yolu da açık bırakıyor. Bu ifade yanlış.","formul":"Şık B: bir stajyer \u0027şikayet dilekçesi yoksa oda hiçbir şey yapamaz\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.32","karar":"yanlış","anlatim":"Tabelayı gören oda denetçisiydi, Birlik değil. Yetki maddede açıkça odaya verilmiş. Bu ifade yanlış.","formul":"Şık C: muhasebeci \u0027bu işi ancak Birlik yapar, oda karışamaz\u0027 diyor, geçerli mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.32","karar":"yanlış","anlatim":"Olayda hiçbir bakanlık talimatı yok, oda kendiliğinden harekete geçti. Yönetmelik böyle bir ön şart aramaz. Bu ifade yanlış.","formul":"Şık D: biri \u0027Maliye Bakanlığı talimat vermeden oda kıpırdayamaz\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.32","karar":"yanlış","anlatim":"Bizim olayda mahkeme falan yok, sadece oda denetimi var. Disiplin soruşturması idari bir yol, yargı kararına bağlı değil. Bu ifade yanlış.","formul":"Şık E: \u0027önce mahkeme karar versin sonra oda soruştursun\u0027 diyen arkadaşına ne dersin?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Oda, şikayet olmasa da kendi tespitiyle resen soruşturma açabilir, tek doğru bu. Kendine sor: madde \u0027veya\u0027 diyor mu, yoksa şikayeti şart mı koşuyor?","doldur":[]}],"anahtar":[{"ornek":"şikayet","kok":"şikaye"},{"ornek":"soruşturması","kok":"soruşt"},{"ornek":"tespit","kok":"tespit"},{"ornek":"yönetmeliği","kok":"yönetm"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"reklam","kok":"reklam"}],"konuGiris":{"harita":"Ne zaman soruşturma başlar: yönetmeliğe aykırılık tespit edildiğinde. Nasıl başlatılır: resen (odanın kendi tespitiyle) veya şikayet üzerine, ikisi de yeterlidir. Kim başlatır: bağlı olunan oda.","desen":"Sınav, öğrencinin \u0027soruşturma yalnız şikayetle başlar\u0027 yanılgısına düşüp düşmediğini test eder; oysa m.32 açıkça \u0027resen veya şikayet üzerine\u0027 der. Şikayet dilekçesi yokluğu, soruşturmanın başlamayacağı anlamına gelmez. Bu soru m.32/1 fıkrasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Şikayet olmadan, odanın kendi denetimiyle başlattığı soruşturma","ad":"resen soruşturma","kim":"meslek kuruluşu düzenler"},{"kaynak":"soruda verilir","tanim":"Bir kişinin dilekçesiyle başlayan disiplin süreci","ad":"şikayet üzerine soruşturma","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Yönetmeliğe aykırılık halinde uygulanan inceleme süreci","ad":"disiplin soruşturması","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Meslek mensuplarını denetleyen, kamu kurumu niteliğindeki kuruluş","ad":"oda","kim":"kanun sabitler"}],"sinavda":"Şikayet olmadan oda denetimiyle tespit edilen aykırılıkta soruşturmanın başlatılıp başlatılamayacağı sorulur.","panel_ornek":"Bir apartman yönetimi, hiçbir sakinden şikayet gelmese de düzenli denetiminde bir dairenin ortak alanı izinsiz kullandığını fark eder ve kendiliğinden uyarı yazısı gönderir. Burada 3 sakin değil, yönetimin kendi tespiti harekete geçirmiştir. Yani şikayet şart değildir.","ornek":"Bir apartman yönetimi, hiçbir sakinden şikayet gelmese de düzenli denetiminde bir dairenin ortak alanı izinsiz kullandığını fark eder ve kendiliğinden uyarı yazısı gönderir. Burada 3 sakin değil, yönetimin kendi tespiti harekete geçirmiştir. Yani şikayet şart değildir.","yontemler":"Metindeki \u0027resen veya şikayet üzerine\u0027 ifadesini birebir hatırlamak yeterlidir; ikisi arasında öncelik ya da zorunluluk sırası yoktur.","nedir":"Disiplin yönetmeliği, meslek mensuplarının kurallara aykırı davranışlarında soruşturmanın nasıl başlatıldığını düzenler. Sınav, soruşturmanın şikayete mi yoksa resen mi bağlı olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Merci Karıştırma Tuzağı","metin":"öğrenci disiplin yetkisini oda yerine üst çatı kuruluşuna (Birlik) verir. Doğrusu: yönetmelik soruşturmayı başlatma yetkisini açıkça odalara tanır."},"E":{"ad":"Yargı Ön Şartı Tuzağı","metin":"öğrenci idari disiplin soruşturmasını ceza yargılamasına bağlı hale getirir. Doğrusu: soruşturmanın başlaması herhangi bir mahkeme kararına bağlı değildir."},"D":{"ad":"Otorite Karıştırma Tuzağı","metin":"öğrenci mesleki disiplin sürecini kamu idaresinin talimatına bağlı sanır. Doğrusu: oda, Maliye Bakanlığından talimat beklemeksizin kendi tespitiyle harekete geçebilir."},"B":{"ad":"Şikayet Şartı Tuzağı","metin":"öğrenci soruşturmanın ancak bir şikayet dilekçesiyle başlayabileceğini sanır. Doğrusu: madde metni açıkça \u0027resen veya şikayet üzerine\u0027 der, şikayet zorunlu unsur değildir."}},"celdiriciYol":{},"hap":"Haksız Rekabet ve Reklam Yasağı Yönetmeliği\u0027ne göre disiplin soruşturması, oda tarafından resen ya da şikayet üzerine başlatılır; ikisi de bağımsız yeterli sebeptir.","teshis":{"C":{"gercek":"m.32 yetkiyi açıkça \u0027odalar tarafından\u0027 ifadesiyle odalara verir.","ayirt":"Maddede soruşturmayı kim başlatıyor diye özne kim?","paragraf":"m.32","yanilgi":"Sen disiplin soruşturması yetkisini merkezi kuruluşa (Birlik) ait sanıyorsun."},"E":{"gercek":"Disiplin soruşturması idari bir süreçtir ve mahkeme kararı ön şartı aranmaz.","ayirt":"Maddede yargı kararı şartına dair bir ibare var mı?","paragraf":"m.32","yanilgi":"Sen idari disiplin soruşturmasını ceza muhakemesi sürecine bağlı sanıyorsun."},"A":{"gercek":"Madde metni iki yolu \u0027veya\u0027 bağlacıyla birlikte sayar; her ikisi de bağımsız başlatma sebebidir.","ayirt":"Metinde \u0027veya\u0027 bağlacı iki ayrı yolu mu birleştiriyor?","paragraf":"m.32","yanilgi":"Bu şıkkı eleyen öğrenci, \u0027resen\u0027 ile \u0027şikayet üzerine\u0027 ifadelerinin birlikte değil ayrı ayrı geçerli iki yol olduğunu gözden kaçırır."},"D":{"gercek":"Yönetmelik odanın bağımsız resen yetkisini düzenler, Maliye Bakanlığı onayı veya talimatı aranmaz.","ayirt":"Maddede bir üst makam onayı şartı var mı?","paragraf":"m.32","yanilgi":"Sen disiplin sürecini kamu otoritesinin talimatına bağlı bir işlem sanıyorsun."},"B":{"gercek":"m.32 açıkça \u0027resen veya şikayet üzerine\u0027 der; resen yetki de tanınmıştır.","ayirt":"Madde metninde şikayeti zorunlu kılan bir ibare var mı?","paragraf":"m.32","yanilgi":"Sen soruşturmanın yalnız şikayetle başlayabileceğini, odanın kendiliğinden harekete geçemeyeceğini sanıyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 104"},"kural":"Türk Ticaret Kanunu m.14/1 uyarınca izin veya onay almadan ticari işletme işleten kişi tacir sayılır; m.14/2 uyarınca bu aykırı hareketin doğurduğu hukuki, cezai ve disipline ilişkin sorumluluk saklıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 104","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde \u0027saklıdır\u0027 ile birlikte birden çok sorumluluk türü sayılmışsa, bunlardan hiçbiri diğerini eleyen bir şık üretmez; hepsini birlikte arayan şıkkı seç.","konu":"disiplin kovusturmasi","tablo":{"satirlar":[["A) Meslek mensubu tacir sayılır; ancak izin alınmadığından …","m.14/2","YANLIŞ ifade"],["B) Meslek mensubu hakkında disiplin kovuşturması yapılır; a…","m.14/1","YANLIŞ ifade"],["C) İzin alınmaması işlemi geçersiz kıldığından meslek mensu…","m.14/1-2","YANLIŞ ifade"],["D) Meslek mensubu hakkında yalnızca hukuki ve cezai sorumlu…","m.14/2","YANLIŞ ifade"],["E) Meslek mensubu tacir sayılır ve bu aykırı hareketin doğu…","m.14/1-2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İzin alınmaması işlemi geçersiz kıldığından meslek mensubu ne tacir sayılır ne de disiplin sorumluluğu doğar.","E":"Meslek mensubu tacir sayılır ve bu aykırı hareketin doğurduğu hukuki, cezai ve disipline ilişkin sorumluluk saklı kalır.","A":"Meslek mensubu tacir sayılır; ancak izin alınmadığından bu fiilin disipline ilişkin sorumluluğu doğmaz.","D":"Meslek mensubu hakkında yalnızca hukuki ve cezai sorumluluk doğar; disipline ilişkin sorumluluk bu fiilde uygulanmaz.","B":"Meslek mensubu hakkında disiplin kovuşturması yapılır; ancak izinsiz işletme nedeniyle tacir sayılmaz."},"kaynak":{"alinti":"","liste":[{"ad":"TTK (6102 s.K.) m.14","metin":"MADDE 14- (1) Kişisel durumları ya da yaptığı işlerin niteliği nedeniyle yahut meslek ve görevleri dolayısıyla, kanundan veya bir yargı kararından doğan bir yasağa aykırı bir şekilde ya da başka bir kişinin veya resmî bir makamın iznine gerek olmasına rağmen izin veya onay almadan bir ticari işletmeyi işleten kişi de tacir sayılır. (2) Birinci fıkraya aykırı hareketin doğurduğu hukuki, cezai ve disipline ilişkin sorumluluk saklıdır. 4. Esnaf"},{"ad":"TTK (6102 s.K.) m.28","metin":"MADDE 28- (1) Tescil istemi ilgililer, temsilcileri veya hukuki halefleri tarafından yetkili sicil müdürlüğüne yapılır. (2) Bir hususun tescilini istemeye birden çok kimse zorunlu ve yetkili olduğu takdirde, kanunda aksine hüküm bulunmadıkça, bunlardan birinin talebi üzerine yapılan tescil tümü tarafından istenmiş sayılır. 26/6/2012 tarihli ve 6335 sayılı Kanunun 40 ıncı maddesiyle, bu maddenin başlığında yer alan “Tüzük” ibaresi “Yönetmelik”, birinci fıkrasında yer alan “bir tüzükle” ibaresi “Gümrük ve Ticaret Bakanlığınca hazırlanan ve Bakanlar Kurulunca çıkarılacak yönetmelikte” şeklinde değiştirilmiştir. 13 Anayasa Mahkemesinin 3/6/2025 tarihli ve E.: 2024/208, K.: 2025/122 sayılı Kararı ile bu maddede yer alan “…disiplin işleri…” ibaresi iptal edilmiştir. 14 2/7/2018 tarihli ve 700 sayılı Kanun Hükmünde Kararnamenin 192 nci maddesiyle bu fıkrada yer alan “Gümrük ve Ticaret Bakanlığınca hazırlanan ve Bakanlar Kurulunca” ibaresi “Cumhurbaşkanınca” şeklinde değiştirilmiştir. 15 26/6/2012 tarihli ve 6335 sayılı Kanunun 40 ıncı maddesiyle, bu fıkrada yer alan “memurlukları” ibaresi “müdürlükleri”, “evraklarının” ibaresi “evrakının” ve “bir” ibaresi “birer” şeklinde değiştirilmiştir. 12 3. İstemin şekli"}],"hakem":"TTK m.14/1-2 kaynakta açıkça bulunmakta; izinsiz işletme işleten kişinin tacir sayılması ve hukuki-cezai-disipline ilişkin sorumluluğun saklı kalması kuralı doğru sıkta tam olarak yansıtılmıştır."},"kayitlar":[],"sade":{"siklar":{"C":"İzin eksikliğinin tüm işlemi geçersiz kıldığını ve hiçbir sonuç doğurmayacağını varsayar. Kanun izinsizliği işlemi hükümsüz kılan değil, ek sorumluluk doğuran bir durum olarak düzenler.","A":"İzinsiz işletmenin yalnızca tacirlik sonucunu doğurduğunu, disiplin sorumluluğunun düştüğünü zanneder. Oysa kanun her iki sonucu birlikte öngörür; biri diğerini ortadan kaldırmaz.","D":"\u0027Saklıdır\u0027 ibaresini yalnız hukuki ve cezai sorumluluğa özgü kabul eder, disiplin sorumluluğunu hariç tutar. Oysa kanun ifadesi üç sorumluluk türünü birlikte kapsar ve hepsini saklı tutar.","B":"İzinsizliğin yalnız disiplin kovuşturmasına yol açtığını, tacirlik niteliğini ortadan kaldırdığını düşünür. Hâlbuki kanun izinsiz işleten kişiyi açıkça tacir sayar."},"dogru":"İzinsiz ticari işletme işleten meslek mensubu kanun gereği tacir sayılır. Aynı zamanda izinsizlikten kaynaklanan hukuki, cezai ve disiplin sorumluluğundan da kaçamaz; ikisi birlikte doğar.","sinav":"Türk Ticaret Kanunu 14. madde birinci fıkraya göre izinsiz ticari işletme işleten kişi tacir sayılır; ikinci fıkraya göre bu aykırı hareketin doğurduğu hukuki, cezai ve disipline ilişkin sorumluluk saklıdır.","kavramlar":[{"kaynak":"Türk Ticaret Kanunu 14. madde","tanim":"Kişisel durumları veya meslek ve görevleri nedeniyle, izin alınmaksızın dahi ticari işletme işleten kişi. Kanun bu kişiyi ticari muhasebe ve kayıt yükümlülüğü gibi sorumluluklara tabi kılar.","ad":"tacir"},{"kaynak":"Türk Ticaret Kanunu 14. madde","tanim":"Resmî bir makamın iznine rağmen onay almadan ticari amaçla işletilen işyeri veya faaliyet. İzinsizlik tacirlik niteliğini ortadan kaldırmaz ama ek sorumluluk doğurur.","ad":"izinsiz ticari işletme"},{"kaynak":"Türk Ticaret Kanunu 14. madde","tanim":"Meslek kurallarına veya meslek mensubunun yükümlülüklerine aykırı davranıştan doğan ve disiplin kovuşturması ile takip edilen sorumluluk türü.","ad":"disipline ilişkin sorumluluk"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2020/3"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavir, resmî bir makamın iznine tabi olmasına rağmen izin almaksızın bir ticari işletme işletmektedir. Türk Ticaret Kanunu\u0027na göre bu durumda aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-07","verilenler":[],"dayanak":"Türk Ticaret Kanunu (6102 s.K.) m.14/1-2","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Antalya\u0027da bir avukat, avukatlık ruhsatı varken ayrıca izin almadan turizm acentesi işletiyor, üstelik bu iş için resmî makamdan izin almamış.","anlatim":"Bu avukat izinsiz şekilde iki yıl boyunca 40 tür satmış, 600.000 TL ciro yapmış. Şimdi bu olay üzerinden Türk Ticaret Kanunu\u0027nun kuralını göreceğiz.","doldur":[]},{"formul":"Ne yapacağız: m.14/1\u0027e göre izinsiz işleten kişi yine de tacir sayılır, m.14/2\u0027ye göre hukuki, cezai ve disiplin sorumluluğu saklı kalır.","anlatim":"Bu iki kural birlikte çalışır, biri diğerini engellemez. Şimdi beş ifadeyi bu avukat olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.14/2","karar":"yanlış","anlatim":"Avukat izinsiz olduğu için tam tersine disiplin sorumluluğu doğar, izinsizlik cezayı kaldırmaz. m.14/2 açıkça bu sorumluluğu saklı tutar.","formul":"Şık A: birisi sana \u0027izin yok diye disiplin cezası da uygulanmaz\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.14/1","kar
