rılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"}],"hakem":"3568 s.K. m.4/d\u0027de sınırlı sayılan engel suçlar listesinde kasten yaralama yer almamakta; bu suç ancak genel kural olan bir yıl veya daha fazla hapis cezası koşuluyla engel oluşturmaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2017/3"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre, kasten işlenmiş olması koşuluyla affa uğramış olsa dahi meslek mensubu olmaya engel suçlar arasında aşağıdakilerden hangisi sayılmamıştır?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-08","verilenler":[],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.4/d","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bursa\u0027da bir SMMM adayı olan Kerem, 2015 yılında sahtecilik suçundan hüküm giymiş, cezası affa uğramış. 2023\u0027te staj bitirme sınavını kazanmış, ruhsat başvurusu yapıyor.","anlatim":"Oda, Kerem\u0027in geçmişindeki suçu inceliyor. Affa uğramış olması onu kurtarır mı, kurtarmaz mı diye bakılıyor.","doldur":[]},{"formul":"Ne yapacağız: Kanunun m.4/d bendi, affa uğrasa bile mesleğe engel olan suçları tek tek sayıyor: zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat, edimin ifasına fesat, aklama, kaçakçılık. Kerem\u0027in sahteciliği bu listede mi, önce onu göreceğiz. Şimdi beş şıkkı bu olayın yerine koyup tek tek deneyeceğiz.","anlatim":"Her şıkta Kerem\u0027in suçu o suç olsaydı ruhsat engellenir miydi diye soracağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.4/d","karar":"doğru","anlatim":"Hayır, çünkü m.4/d hırsızlığı isim isim sayıyor. Affa uğrasa bile bu suç engel oluşturmaya devam eder.","formul":"Şık A: Kerem\u0027in suçu sahtecilik değil de hırsızlık olsaydı, affa uğramış olması onu kurtarır mıydı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.4/d","karar":"doğru","anlatim":"Evet, engel olur; çünkü sahtecilik maddede açıkça sayılan suçlardan biridir. Kerem\u0027in başvurusu bu yüzden reddedilir.","formul":"Şık B: Kerem\u0027in gerçek suçu olan sahtecilik, affa uğramasına rağmen ruhsatına engel olur mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.4/d","karar":"yanlış","anlatim":"Hayır, çünkü m.4/d bu suçu isim isim saymaz. Ancak ceza bir yıl veya üzeri hapis olsaydı genel şarttan engel doğabilirdi, o başka bir kapı.","formul":"Şık C: Kerem\u0027in suçu sahtecilik değil de kasten yaralama olsaydı, affa uğramış olsa bile tek başına ruhsatına engel olur muydu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.4/d","karar":"doğru","anlatim":"Hayır, kurtarmaz; rüşvet de m.4/d\u0027nin isim verdiği suçlardan biridir. Affa uğrasa dahi başvurusu reddedilir.","formul":"Şık D: Kerem\u0027in suçu rüşvet olsaydı, affa uğramış olması onu kurtarır mıydı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.4/d","karar":"doğru","anlatim":"Hayır, kurtarmaz; bu suç da m.4/d\u0027nin sayma cümlesinde açıkça yazar. Affa uğrasa bile engel devam eder.","formul":"Şık E: Kerem\u0027in suçu güveni kötüye kullanma olsaydı, affa uğramış olması onu kurtarır mıydı?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Doğru cevap C, çünkü kasten yaralama m.4/d\u0027nin isim isim saydığı suçlar arasında değil. Kendine hep şunu sor: bu suç maddenin sayma cümlesinde geçiyor mu, yoksa yalnızca genel bir yıl hapis şartına mı tabi?","doldur":[]}],"anahtar":[{"ornek":"suçları","kok":"suçlar"},{"ornek":"kurtarır","kok":"kurtar"},{"ornek":"uğrasa","kok":"uğrasa"},{"ornek":"biridir","kok":"biridi"},{"ornek":"sayılı","kok":"sayılı"},{"ornek":"reddedilir","kok":"redded"}],"konuGiris":{"harita":"Ne zaman test edilir: Meslek mensubu olma başvurusunda genel şartların taşınıp taşınmadığı incelenirken test edilir. Nasıl ölçülür: Kanunda sayılan suç listesiyle adayın mahkûmiyet geçmişi karşılaştırılarak ölçülür. Nasıl kaydedilir: Şartları taşımayan kişinin başvurusu reddedilerek veya mesleğe kabul edilmeyerek kayda geçer.","desen":"Sınav bu konuyu, kanunda sayılan suç listesine benzer ama listede olmayan bir suçu şıklardan birine gizleyerek sorar. Tuzak, hırsızlık, rüşvet, zimmet gibi gerçek listedeki suçlarla dikkat dağıtıp listede olmayan bir suçu (örneğin basit yaralama) doğru cevap yapmasıdır. Bu soru m.4/d fıkrasındaki sayılı suçlar listesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubu olmak için herkeste aranan temel nitelikler bütünü","ad":"Genel şartlar","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Failin bilerek ve isteyerek gerçekleştirdiği suç türü","ad":"Kasten işlenen suç","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Af çıksa dahi mesleğe girişi kalıcı olarak engelleyen sayılı suç grubu","ad":"Affa uğramış olsa bile engel sayılan suçlar","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin belirli kamusal hak ve yetkileri kullanamama durumu","ad":"Kamu haklarından mahrumiyet","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda meslek mensubu olmaya engel suçlar sayılır ve bunlardan hangisinin listede olmadığı sorulur.","panel_ornek":"Bir spor kulübüne üye olmak istiyorsun ama tüzükte \u0027disiplinden ihraç edilenler üye olamaz\u0027 yazıyor; sicilin temiz olsa bile bazı geçmiş olaylar seni kalıcı olarak dışarıda bırakabilir. Mesela kulüpten 3 yıl önce disiplin kararıyla çıkarılmışsan, aradan 3 yıl geçmiş olması seni kurtarmaz. Kanun bazı durumları \u0027affa rağmen geçerli engel\u0027 sayar, işte bu soru da böyle bir listeyle ilgili.","ornek":"Bir spor kulübüne üye olmak istiyorsun ama tüzükte \u0027disiplinden ihraç edilenler üye olamaz\u0027 yazıyor; sicilin temiz olsa bile bazı geçmiş olaylar seni kalıcı olarak dışarıda bırakabilir. Mesela kulüpten 3 yıl önce disiplin kararıyla çıkarılmışsan, aradan 3 yıl geçmiş olması seni kurtarmaz. Kanun bazı durumları \u0027affa rağmen geçerli engel\u0027 sayar, işte bu soru da böyle bir listeyle ilgili.","yontemler":"Kanundaki sayılı suç listesini ezbere bilmek gerekir; listede olmayan tek şık doğru cevaptır.","nedir":"Bu konu, bir kişinin meslek mensubu (SMMM) olabilmesi için taşıması gereken şartları ve hangi hallerin bu mesleğe girişi engellediğini anlatır. Sınav, hangi suçların affa uğrasa dahi engel sayıldığını ayırt etmeni ölçer."},"olay":"","tuzak":{"D":{"ad":"Rüşvet Tuzağı","metin":"Sayılan suçların çokluğu içinde bu suçun listede olmadığını zannediyorsun. Doğrusu: Rüşvet, madde 4/d\u0027de açıkça sayılan engel suçlardandır."},"E":{"ad":"Güveni Kötüye Kullanma Tuzağı","metin":"Daha az bilinen bir suç olduğu için listede yer almadığını düşünüyorsun. Doğrusu: Güveni kötüye kullanma da madde 4/d\u0027nin sayılı suçları arasındadır."},"A":{"ad":"Hırsızlık Tuzağı","metin":"Kanunda sayılan suçlardan birini gördüğün için bunun listede olmadığını düşünüyorsun. Doğrusu: Hırsızlık, madde 4/d\u0027de affa uğrasa dahi engel sayılan suçlar arasında açıkça yer alır."},"B":{"ad":"Sahtecilik Tuzağı","metin":"Meslekle bağdaşmayan bir eylem olduğu için listede olmadığını sanıyorsun. Doğrusu: Sahtecilik, kanunun saydığı engel suçlar arasındadır."}},"celdiriciYol":{},"hap":"3568 sayılı Kanunun 4/d maddesi affa uğrasa dahi engel sayılan suçları sınırlı biçimde sayar; sayılmayan bir suç ancak bir yıl ve üzeri hapis cezası şartıyla engel oluşturur.","teshis":{"C":{"gercek":"Madde 4/d sınırlı sayıda suç sayar; kasten yaralama bu sayılı suçlar arasında değildir, ancak genel şart olan bir yıl ve üzeri hapis cezası gerçekleşirse ayrı bir yoldan engel oluşturabilir.","ayirt":"Bu suç madde 4/d\u0027nin isim isim saydığı suçlar arasında mı, yoksa yalnızca genel hapis cezası şartına mı tabi?","paragraf":"m.4/d","yanilgi":"Bu şıkkı elerken \u0027ağır bir suç, mutlaka listededir\u0027 diye düşünüyorsun."},"E":{"gercek":"Madde 4/d güveni kötüye kullanmayı açıkça sayılan suçlar arasına koyar.","ayirt":"Bu suç madde 4/d\u0027nin sayma cümlesinde geçiyor mu?","paragraf":"m.4/d","yanilgi":"Güveni kötüye kullanmanın listede yer almadığını düşünüyorsun."},"A":{"gercek":"Madde 4/d hırsızlığı açıkça sayar; affa uğramış olsa dahi engel oluşturur.","ayirt":"Bu suç madde 4/d\u0027nin sayma cümlesinde geçiyor mu?","paragraf":"m.4/d","yanilgi":"Hırsızlığın listede geçmediğini sanıyorsun."},"D":{"gercek":"Madde 4/d rüşveti açıkça sayılan suçlar arasına koyar.","ayirt":"Bu suç madde 4/d\u0027nin sayma cümlesinde geçiyor mu?","paragraf":"m.4/d","yanilgi":"Rüşvetin listede olmadığını sanıyorsun."},"B":{"gercek":"Madde 4/d sahteciliği açıkça sayılan suçlar arasına koyar.","ayirt":"Bu suç madde 4/d\u0027nin sayma cümlesinde geçiyor mu?","paragraf":"m.4/d","yanilgi":"Sahtecilik meslekle ilgisiz gibi göründüğü için listede olmadığını düşünüyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 127"},"kural":"Adam çalıştıran, seçim, talimat ve gözetim-denetimde gerekli özeni gösterdiğini ispat ederse sorumluluktan kurtulur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 127","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İspat yükünün kime ait olduğuna bak: kurtuluş kanıtını adam çalıştıran sunar, zarar gören değil.","konu":"özen sorumluluğu","tablo":{"satirlar":[["A) Çalışan, işin görülmesi sırasında verdiği zarardan bizza…","TBK m.66/1","YANLIŞ ifade"],["B) Adam çalıştıran, çalışanını seçerken, talimat verirken, …","TBK m.66/2","doğru ifade"],["C) Zarar gören, adam çalıştıranın seçim, talimat ve gözetim…","TBK m.66/2","YANLIŞ ifade"],["D) Adam çalıştıranın sorumluluğu yalnızca çalışanın kasıtlı…","TBK m.66/1","YANLIŞ ifade"],["E) Adam çalıştıran, çalışanının işin görülmesiyle hiçbir il…","TBK m.66/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Zarar gören, adam çalıştıranın seçim, talimat ve gözetimde özensiz davrandığını ispat etmedikçe adam çalıştırandan tazminat isteyemez.","E":"Adam çalıştıran, çalışanının işin görülmesiyle hiçbir ilgisi bulunmayan kişisel eylemlerinden doğan zararlardan da sorumludur.","A":"Çalışan, işin görülmesi sırasında verdiği zarardan bizzat ve öncelikli olarak sorumludur; adam çalıştıranın sorumluluğu ancak çalışana rücu edilemediğinde doğar.","D":"Adam çalıştıranın sorumluluğu yalnızca çalışanın kasıtlı davranışıyla verdiği zararları kapsar, ihmalden doğan zararları kapsamaz.","B":"Adam çalıştıran, çalışanını seçerken, talimat verirken, gözetim ve denetimde bulunurken gerekli özeni gösterdiğini ispat ederse sorumluluktan kurtulur."},"kaynak":{"alinti":"","liste":[{"ad":"TBK (6098 s.K.) m.66","metin":"MADDE 66- Adam çalıştıran, çalışanın, kendisine verilen işin yapılması sırasında başkalarına verdiği zararı gidermekle yükümlüdür. Adam çalıştıran, çalışanını seçerken, işiyle ilgili talimat verirken, gözetim ve denetimde bulunurken, zararın doğmasını engellemek için gerekli özeni gösterdiğini ispat ederse, sorumlu olmaz. Bir işletmede adam çalıştıran, işletmenin çalışma düzeninin zararın doğmasını önlemeye elverişli olduğunu ispat etmedikçe, o işletmenin faaliyetleri dolayısıyla sebep olunan zararı gidermekle yükümlüdür. Adam çalıştıran, ödediği tazminat için, zarar veren çalışana, ancak onun bizzat sorumlu olduğu ölçüde rücu hakkına sahiptir. 2. Hayvan bulunduranın sorumluluğu a. Giderim yükümlülüğü"},{"ad":"TTK (6102 s.K.) m.199 [2/2]","metin":"(4) Hâkim şirketin her yönetim kurulu üyesi, yönetim kurulu başkanından; bağlı şirketlerin finansal ve malvarlığıyla ilgili durumları ile üç aylık hesap sonuçları, hâkim şirketin bağlı şirketlerle, bağlı şirketlerin birbirleriyle, hâkim ve bağlı şirketlerin pay sahipleri ve bunların yakınlarıyla ilişkileri; yaptıkları işlemler ve bunların sonuç ve etkileri hakkında, özenli, gerçeği aynen ve dürüstçe yansıtan hesap verme ilkelerine göre düzenlenmiş bir rapor hazırlattırıp yönetim kuruluna sunmasını ve bunun sonuç kısmının yıllık rapor ile denetleme raporuna eklenmesini isteyebilir. Bağlı şirketler, red için yoruma yer bırakmayacak açıklıkta bir haklı sebebin varlığını ispat edemedikleri takdirde, bu raporun hazırlanması için gerekli olan bilgi ve belgeleri hâkim şirketin bu işle görevlendirilen uzmanlarına vermekle yükümlüdürler. İstemde bulunan yönetim kurulu üyesi, bunu bir üçüncü kişinin yararlanması amacıyla yapmışsa bunun sonuçlarından sorumlu olur. VI - Bağlı şirketler hakkında bilgi alma"}],"hakem":"Doğru sık (B), TBK m.66\u0027da açıkça yer alan adam çalıştıranın kurtuluş kanıtı kuralını (seçim, talimat, gözetim-denetimde gerekli özeni göstermek) doğru şekilde ifade etmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavirin yanında çalıştırdığı büro elemanı, işin görülmesi sırasında bir müşteriye zarar vermiştir. 6098 sayılı Türk Borçlar Kanunu\u0027na göre adam çalıştıranın sorumluluğu bakımından aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-09","verilenler":[],"dayanak":"6098 sayılı Türk Borçlar Kanunu m.66","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bir mali müşavirlik bürosunda çalışan stajyer, 15 Mart\u0027ta bir müşterinin beyannamesini yanlış düzenleyip 40.000 TL vergi cezası doğurdu.","anlatim":"Büro sahibi patron, stajyeri işe alırken referans kontrolü yapmış, ona yazılı talimat vermiş ve haftalık denetim yapmıştı. Müşteri zararının tazminini patrondan istiyor, şimdi beş iddiayı bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu madde 66\u0027ya göre patron, çalışanı seçerken, talimat verirken ve denetlerken gerekli özeni gösterdiğini ispat ederse 40.000 TL\u0027den kurtulur.","anlatim":"Kural tek: sorumluluk doğrudan patronundur ama kurtuluş kanıtı vardır. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.66/1","karar":"yanlış","anlatim":"Olayda müşteri doğrudan patrona başvurabilir, stajyere önce gitme zorunluluğu yok. Patronun sorumluluğu ikincil değil, doğrudandır.","formul":"Şık A: müşteri \u0027önce stajyerden isteyeyim, patrona sonra giderim\u0027 diyor, bu doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.66/2","karar":"doğru","anlatim":"Olayda patron tam da bu üç unsuru ispatlarsa 40.000 TL\u0027den kurtulur. Kanun bu kurtuluş kanıtını tanır.","formul":"Şık B: patron \u0027ben referans kontrolü yaptım, talimat verdim, denetledim, bu yüzden ödemem\u0027 diyor, haklı mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.66/2","karar":"yanlış","anlatim":"Olayda müşteri sadece zararı ve nedensellik bağını gösterir, özenin varlığını ispat yükü patrona aittir. Bu ifade ispat yükünü ters çevirir, yanlıştır.","formul":"Şık C: müşteri \u0027patronun özensiz davrandığını ben ispatlamalıyım\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.66/1","karar":"yanlış","anlatim":"Olayda hata bir ihmal, kasıt yok ama madde metni kusur derecesine bakmaz. İhmalden doğan zarar da kapsam içindedir.","formul":"Şık D: patron \u0027stajyer kasıtlı yapmadı, ihmaldi, ben sorumlu değilim\u0027 diyebilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.66/1","karar":"yanlış","anlatim":"Olayda bu zarar işin görülmesiyle ilgili değil, büro dışı kişisel bir eylem. Patron bundan sorumlu tutulamaz.","formul":"Şık E: stajyer aynı akşam kendi arabasıyla kaza yapsa, patron bundan da mı sorumlu olur?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru olan, patronun seçim-talimat-gözetimde özen gösterdiğini ispatlarsa kurtulabileceğidir. Kendine hep şunu sor: burada özeni ispat etme yükü kimde?","doldur":[]}],"anahtar":[{"ornek":"patron","kok":"patron"},{"ornek":"olayda","kok":"olayda"},{"ornek":"kurtulur","kok":"kurtul"},{"ornek":"sorumluluktan","kok":"soruml"},{"ornek":"gösterdiğini","kok":"göster"},{"ornek":"talimat","kok":"talima"}],"konuGiris":{"harita":"Ne zaman sorumluluk doğar: çalışan, kendisine verilen işi görürken üçüncü kişiye zarar verdiğinde. Nasıl kurtulunur: adam çalıştıran seçim, talimat ve gözetimde gerekli özeni gösterdiğini ispatlarsa sorumlu olmaz. Nasıl geri alınır: adam çalıştıran ödediği tazminatı, ancak çalışanın bizzat kusurlu olduğu ölçüde ondan rücuen isteyebilir.","desen":"Soru, adam çalıştıranın kusursuz sorumluluk mu yoksa kusur sorumluluğu mu taşıdığı karıştırılarak kurulur; oysa kanun ispatla kurtulma imkânı tanır, mutlak sorumluluk değildir. Tuzak, \u0027her hâlükârda sorumludur\u0027 ifadesiyle özen ispatının yok sayılmasıdır. Bu soru Türk Borçlar Kanunu m.66 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"başkasını kendi işinde çalıştıran ve onun fiillerinden sorumlu tutulan kişi","ad":"adam çalıştıran","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"seçim, talimat, gözetimde gerekli özenin gösterildiğinin ispatı","ad":"kurtuluş kanıtı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"ödenen tazminatın çalışanın kusuru ölçüsünde geri istenmesi hakkı","ad":"rücu hakkı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işletme düzeninin zararı önlemeye elverişli olduğunun ispatı yükümlülüğü","ad":"işletme sorumluluğu","kim":"kanun sabitler"}],"sinavda":"Somut bir olay verilip adam çalıştıranın hangi şartla sorumluluktan kurtulabileceği sorulur.","panel_ornek":"Bir kuaför dükkânı sahibi yeni çırağını işe alırken referans kontrolü yapmamış ve çırak makası müşteriye batırmış. Sahibi \u0027ben seçerken özen gösterdim\u0027 diyemiyorsa 15.000 TL tazminattan sorumlu olur. Bu, çalışanın hatasının işvereni de bağlaması demektir.","ornek":"Bir kuaför dükkânı sahibi yeni çırağını işe alırken referans kontrolü yapmamış ve çırak makası müşteriye batırmış. Sahibi \u0027ben seçerken özen gösterdim\u0027 diyemiyorsa 15.000 TL tazminattan sorumlu olur. Bu, çalışanın hatasının işvereni de bağlaması demektir.","yontemler":"Metindeki \u0027seçerken, talimat verirken, gözetim ve denetimde özen ispatı\u0027 üçlüsü ezbere bilinmeli; bu ispat yoksa sorumluluk otomatik doğar.","nedir":"Adam çalıştıranın sorumluluğu, bir işverenin çalıştırdığı kişinin işi görürken verdiği zarardan hangi şartlarda sorumlu tutulacağını düzenler. Sınav, seçim-talimat-gözetim özeninin gösterildiğinin ispatı hâlinde sorumluluğun kalkıp kalkmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"İspat Yükü Ters Çevirme Tuzağı","metin":"Öğrenci ispat yükünü zarar görene yükler. Doğrusu: Türk Borçlar Kanununun 66 ncı maddesine göre özenin gösterildiğini ispat yükü adam çalıştırana aittir, zarar görene değil."},"E":{"ad":"Kapsam Genişletme Tuzağı","metin":"Öğrenci işle ilgisi olmayan kişisel eylemleri de kapsama sokar. Doğrusu: Sorumluluk yalnızca işin görülmesi sırasında verilen zararla sınırlıdır, kişisel eylemler kapsam dışıdır."},"D":{"ad":"Kusur Derecesi Tuzağı","metin":"Öğrenci sorumluluğu yalnızca kasıtlı zararla sınırlandırır. Doğrusu: Madde, çalışanın işin yapılması sırasında verdiği her zararı kapsar; kast şartı aranmaz."},"A":{"ad":"Rücu Sırası Tuzağı","metin":"Öğrenci sorumluluğun önce çalışana, ancak tahsil edilemezse adam çalıştırana geçtiğini düşünür. Doğrusu: Türk Borçlar Kanununun 66 nci maddesi adam çalıştıranı doğrudan ve öncelikli sorumlu tutar, rücu sırası şartı yoktur."}},"celdiriciYol":{},"hap":"Adam çalıştıran, çalışanını seçerken, talimat verirken, gözetim ve denetimde gerekli özeni gösterdiğini ispat ederse Türk Borçlar Kanununun 66 ncı maddesi uyarınca sorumluluktan kurtulur.","teshis":{"C":{"gercek":"Türk Borçlar Kanununun 66 ncı maddesine göre kurtuluş kanıtı adam çalıştırana aittir; zarar gören yalnızca zararı ve nedensellik bağını ispatlar.","ayirt":"Özenin gösterildiğini kim ispatlamak zorunda, zarar gören mi adam çalıştıran mı?","paragraf":"TBK m.66/2","yanilgi":"İspat yükünün zarar görende olduğunu, onun adam çalıştıranın kusurunu kanıtlaması gerektiğini sanıyorsun."},"E":{"gercek":"Sorumluluk yalnızca çalışana verilen işin yapılması sırasında doğan zararla sınırlıdır; işle ilgisi olmayan kişisel eylemler kapsam dışıdır.","ayirt":"Zarar, çalışana verilen işin görülmesi sırasında mı yoksa iş dışı bir eylemde mi doğdu?","paragraf":"TBK m.66/1","yanilgi":"Adam çalıştıranın sorumluluğunu çalışanın her davranışına, iş dışı eylemlerine kadar genişletiyorsun."},"A":{"gercek":"Türk Borçlar Kanununun 66 ncı maddesi adam çalıştıranı doğrudan sorumlu tutar; rücu hakkı ayrıca ve sonradan kullanılır, ön şart değildir.","ayirt":"Zarar gören, dava açarken önce çalışana mı gitmek zorunda?","paragraf":"TBK m.66/1","yanilgi":"Adam çalıştıranın sorumluluğunu ikincil sanıp önce çalışana başvurulması gerektiğini düşünüyorsun."},"D":{"gercek":"Madde metninde kast şartı yoktur; çalışanın işin yapılması sırasında verdiği her türlü zarar kapsama girer.","ayirt":"Madde metninde çalışanın kusur derecesine ilişkin bir sınırlama var mı?","paragraf":"TBK m.66/1","yanilgi":"Sorumluluğun ancak kasıtlı zararlarda doğduğunu, ihmalin kapsam dışı kaldığını düşünüyorsun."},"B":{"gercek":"Türk Borçlar Kanununun 66 ncı maddesinin ikinci fıkrası, adam çalıştırana seçim, talimat ve gözetimde özen gösterdiğini ispatlayarak sorumluluktan kurtulma imkânı tanır.","ayirt":"Kanun, adam çalıştırana bir kurtuluş kanıtı imkânı tanıyor mu?","paragraf":"TBK m.66/2","yanilgi":"Bu seçeneği eleyen öğrenci kurtuluş kanıtının varlığını fark etmemiş ya da ispat yükünü karıştırmıştır."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 101"},"kural":"3568 sayılı Kanunun 15 inci maddesine göre gecikmede sakınca bulunan hallerde vali odayı faaliyetten men edebilir, karar yirmidört saat içinde hakim onayına sunulur ve hakim kırksekiz saat içinde karar açıklamazsa idari karar kendiliğinden yürürlükten kalkar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 101","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İki süre bir arada verildiğinde hangisinin \u0027sunma\u0027, hangisinin \u0027karar\u0027 süresi olduğunu cümlenin akışına göre eşleştir, sayıları tek başına ezberleme.","konu":"ruhsat iptali-meslek hukuku","tablo":{"satirlar":[["A) Karar, yirmidört saat içinde görevli hakimin onayına sun…","m.15/2","doğru ifade"],["B) Karar, kırksekiz saat içinde görevli hakimin onayına sun…","m.15/2","YANLIŞ ifade"],["C) Karar yirmidört saat içinde hakimin onayına sunulur; hak…","m.15/2","YANLIŞ ifade"],["D) Faaliyetten men kararı doğrudan Türkiye Serbest Muhasebe…","m.15/2","YANLIŞ ifade"],["E) Faaliyetten men kararı oda genel kurulu hakkında da uygu…","m.15/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Karar yirmidört saat içinde hakimin onayına sunulur; hakim onay vermese dahi karar kendiliğinden geçerliliğini sürdürür.","E":"Faaliyetten men kararı oda genel kurulu hakkında da uygulanır.","A":"Karar, yirmidört saat içinde görevli hakimin onayına sunulur; hakim kırksekiz saat içinde kararını açıklamazsa bu idari karar kendiliğinden yürürlükten kalkar.","D":"Faaliyetten men kararı doğrudan Türkiye Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliği Yönetim Kurulunca verilir, hakim onayı aranmaz.","B":"Karar, kırksekiz saat içinde görevli hakimin onayına sunulur; hakim yirmidört saat içinde açıklama yapmazsa karar geçerliliğini korur."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.15 [1/2]","metin":"Madde 15 – (Değişik birinci fıkra: 10/7/2008-5786/7 md.) Bölgesi içinde kendi mesleği konusunda en az 250 meslek mensubu bulunan il merkezlerinde ve bölgesi içinde 250 meslek mensubu bulunan ilçelerde (Büyükşehir belediyesi sınırları içindeki ilçeler hariç) bir oda kurulur. Ayrı ayrı kurulan serbest muhasebeci mali müşavirler ve yeminli mali müşavirler odaları, bulundukları ilin veya ilçenin adıyla anılır. Ancak, ilçelerde oda kurulabilmesi için o ilçedeki en az 100 meslek mensubunun yazılı başvurusu aranır. Yeterli sayıda meslek mensubu bulunmayan ve oda kurulamayan yerlerin en yakın odaya bağlanmasına veya bölge odaları kurulmasına Birlikçe karar verilir. Bu karar Maliye Bakanlığına bildirilir. Odalar, kuruluşlarını Birlik Yönetim Kurulu aracılığıyla Maliye Bakanlığına bildirmekle tüzelkişilik kazanırlar. Odalara üye olmayan meslek mensupları mesleki faaliyette bulunamazlar. (Değişik: 18/6/1997 - 4276/23 md.) Amaçları dışında faaliyet gösteren odaların sorumlu organlarının görevlerine son verilmesine ve yerlerine yenilerinin seçilmesine, Maliye Bakanlığının veya bulundukları yer Cumhuriyet Başsavcılığının istemi üzerine, o yerdeki asliye hukuk mahkemesince basit usule göre yargılama yapılarak karar verilir ve dava en geç üç ay içinde sonuçlandırılır. Mahkemece beşinci fıkrada yazılı organların görevlerine son verilmesi halinde kararda ayrıca, görevlerine son verilen organları bu Kanunda yazılı usullere göre seçecek organları toplamak üzere, Oda Yönetim Kurulu için Oda Genel Kurulu üyeleri arasından, Birlik Yönetim Kurulu için Birlik Genel Kurulu üyeleri arasından beş kişi…"},{"ad":"SMMM K. (3568 s.K.) m.15 [2/2]","metin":"Görevlendirilen bu beş kişi bu fıkrada yazılı süre içinde görevlerine son verilen organlar gibi görevli ve yetkili olup aynı şekilde sorumludurlar. Bu fıkra hükmüne göre seçilecek yeni organlar eski organların görev sürelerini tamamlarlar. Maliye Bakanlığının bu Kanun uyarınca Oda organlarının işlemleri hakkında onay mercii olarak verdiği kararları görevli oda organları aynen yerine getirmekle yükümlüdürler. Bakanlık kararını, idari yargı merciinin yürütmenin durdurulmasına veya esasına ait kararı veya kanuni bir sebep olmaksızın yerine getirmeyen veya eski kararda direnme niteliğinde yeni bir karar veren veya kanunun mecburi kıldığı işlemleri Bakanlığın uyarısına rağmen yerine getirmeyen oda organları hakkında da yukarıdaki fıkralar hükümleri uygulanır. Görevlerine son verilen organların yerine en geç bir ay içerisinde yenileri seçilir. Yeni seçilenler eskilerin süresini tamamlarlar. Görevlerine son verilen organ üyelerinin kanunda yazılı cezai sorumlulukları saklıdır. Bu organların yukarıdaki fıkra gereğince görevlerine son verilmesine sebep olan tasarrufları hükümsüzdür. (Değişik: 18/6/1997 - 4276/23 md.) Ancak, milli güvenliğin, kamu düzeninin, suç işlenmesini veya suçun devamını önlemenin yahut yakalamanın gerektirdiği hallerde gecikmede sakınca varsa, odalar, vali tarafından faaliyetten men edilebilir. Faaliyetten men kararı, yirmidört aat içinde görevli hakimin onayına sunulur. Hakim, kararını kırksekiz saat içinde açıklar, aksi halde, bu idari karar kendiliğinden yürürlükten kalkar. Göreve son verme ve görevden uzaklaştırma hükümleri oda genel kurulu hakkında uygula…"}],"hakem":"3568 sayılı Kanun m.15\u0027te valinin faaliyetten men kararı için yirmidört saat içinde hakim onayı ve hakim kırksekiz saat içinde karar açıklaması; aksi halde kendiliğinden yürürlükten kalma kuralı açıkça yer almaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre, vali tarafından verilen oda faaliyetten men kararına ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-10","verilenler":[],"dayanak":"3568 sayılı Kanun m.15/2","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Antalya\u0027da bir SMMM Odası\u0027nda 3 Mart günü kamu düzenini bozan olaylar çıkıyor, gecikmede sakınca var diye vali odayı saat 10:00\u0027da faaliyetten men ediyor.","anlatim":"Bu, valinin başka bir ilde verdiği gerçek bir men kararı. Şimdi bu tek olayda kararın akıbetini beş ayrı iddiayla test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: vali saat 10:00\u0027da men kararını veriyor, bu karar 24 saat içinde yani ertesi gün 10:00\u0027a kadar hakime sunulmalı; hakim de kendi süresi olan 48 saat içinde açıklama yapmazsa karar kendiliğinden düşüyor.","anlatim":"Kural tek: sunma 24 saat, karar 48 saat, hakim susarsa idari tedbir biter. Şimdi beş ifadeyi bu 10:00\u0027lık olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.15/2","karar":"doğru","anlatim":"Olayda vali 10:00\u0027da men ediyor, ertesi gün 10:00\u0027a kadar hakime sunuluyor. Hakim 48 saat içinde konuşmazsa vali kararı düşer, madde tam bunu söylüyor.","formul":"Şık A: sana \u0027karar 24 saatte hakime sunulur, hakim 48 saatte açıklama yapmazsa idari karar kendiliğinden kalkar\u0027 deniyor, bu doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.15/2","karar":"yanlış","anlatim":"Olayda süreler ters çevrilmiş, aslında sunma 24 saat, hakim kararı 48 saattir. Ayrıca hakim susarsa karar kalmaz, düşer.","formul":"Şık B: sana \u0027sunma süresi 48 saat, hakim süresi 24 saattir ve hakim susarsa karar geçerli kalır\u0027 deniyor, bu doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.15/2","karar":"yanlış","anlatim":"Olayda 48 saat dolup hakim hiç açıklama yapmıyorsa, vali kararı kendiliğinden yürürlükten kalkıyor, tersi değil.","formul":"Şık C: sana \u0027hakim onay vermese bile vali kararı kendiliğinden geçerliliğini sürdürür\u0027 deniyor, bu doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.15/2","karar":"yanlış","anlatim":"Olayda kararı 10:00\u0027da veren vali, bu yetki mülki idare amirine ait. Birlik\u0027in böyle bir men yetkisi yok.","formul":"Şık D: sana \u0027bu men kararını aslında vali değil, Birlik Yönetim Kurulu verir, hakim onayı da hiç aranmaz\u0027 deniyor, bu doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.15/2","karar":"yanlış","anlatim":"Olayda men edilen oda organları değil odanın faaliyeti, ama kanundaki istisna genel kurul için sadece göreve son verme ve uzaklaştırmada geçerli. Faaliyetten men ayrı bir tedbir, bu istisna ona uygulanmaz.","formul":"Şık E: sana \u0027aynı faaliyetten men kararı oda genel kurulu için de uygulanır\u0027 deniyor, bu doğru mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Tek doğru cümle valinin men kararının 24 saatte sunulup 48 saatte hakim açıklamazsa kendiliğinden düşmesidir. Kendine hep sor: hakim süresinde konuşmazsa tedbir ayakta mı kalır, yoksa düşer mi?","doldur":[]}],"anahtar":[{"ornek":"kararı","kok":"kararı"},{"ornek":"olayda","kok":"olayda"},{"ornek":"içinde","kok":"içinde"},{"ornek":"kendiliğinden","kok":"kendil"},{"ornek":"sunulur","kok":"sunulu"},{"ornek":"açıklamazsa","kok":"açıkla"}],"konuGiris":{"harita":"Ne zaman test edilir: valinin oda faaliyetten men kararının hangi hallerde verilebileceği sorulduğunda. Nasıl ölçülür: 24 saat ve 48 saatlik sürelerin doğru eşleştirilmesiyle. Nasıl kaydedilir: hakim onayı gelmezse kararın kendiliğinden yürürlükten kalkacağı bilgisiyle.","desen":"Sınav genelde 24 ve 48 saatlik süreleri karıştırtarak sorar, öğrenci hangi sürenin sunmaya hangisinin karara ait olduğunu şaşırır. Ayrıca kararın kalıcı değil geçici ve onaya bağlı olduğu unutulur. Bu soru m.15 son fıkra hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Valinin gecikmede sakınca varsa odayı geçici durdurma kararı","ad":"Faaliyetten men kararı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Men kararının hakim onayına sunulması gereken süre","ad":"24 saat süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Hakimin kararını açıklaması gereken süre","ad":"48 saat süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Hakim süresinde karar vermezse men kararının otomatik geçersiz sayılması","ad":"Kendiliğinden yürürlükten kalkma","kim":"kanun sabitler"}],"sinavda":"Valinin oda faaliyetten men kararına ilişkin doğru bilgiyi soran bir soru verilir.","panel_ornek":"Bir apartman yöneticiliği, bina güvenliği için acil durumda kapıcıyı geçici olarak görevden uzaklaştırabilir ama bu karar 2 gün içinde yönetim kuruluna onaylatılmazsa kendiliğinden geçersiz kalır. İşte oda faaliyetten men kararı da böyle, geçici ve onaya bağlı bir tedbirdir.","ornek":"Bir apartman yöneticiliği, bina güvenliği için acil durumda kapıcıyı geçici olarak görevden uzaklaştırabilir ama bu karar 2 gün içinde yönetim kuruluna onaylatılmazsa kendiliğinden geçersiz kalır. İşte oda faaliyetten men kararı da böyle, geçici ve onaya bağlı bir tedbirdir.","yontemler":"24 saat sunma, 48 saat karar süresi olarak ezberlenmeli; süre geçerse kararın kendiliğinden düşeceği unutulmamalı.","nedir":"Bu konu SMMM/YMM odalarının hangi hallerde ve nasıl faaliyetten men edilebileceğini anlatır. Sınav, valinin verdiği men kararının süre ve onay şartlarını bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Onay Gereksizmiş Tuzağı","metin":"öğrenci hakim onayının sadece şekli bir formalite olduğunu, onay gelmezse de kararın ayakta kaldığını sanıyor. Doğrusu: hakim süresinde karar açıklamazsa idari karar kendiliğinden yürürlükten kalkar."},"E":{"ad":"Kapsam Genişletme Tuzağı","metin":"öğrenci organların görevden alınmasına ilişkin sınırlamayı faaliyetten men için de geçerli sayıyor. Doğrusu: göreve son verme ve görevden uzaklaştırma hükümleri oda genel kurulu hakkında uygulanmaz; bu istisna faaliyetten men kararının genel kurula uygulanacağı anlamına gelmez."},"D":{"ad":"Yetkili Makam Tuzağı","metin":"öğrenci faaliyetten men yetkisini merkezi meslek örgütüne (Birlik) veriyor, oysa bu tedbir mülki idare amirine aittir. Doğrusu: faaliyetten men kararını vali verir, hakim onayı zorunludur."},"B":{"ad":"Süre Ters Çevirme Tuzağı","metin":"öğrenci sunma ve karar sürelerini birbirine karıştırıp yirmidört ile kırksekizi yer değiştiriyor, ayrıca sessiz kalmayı geçerlilik lehine yorumluyor. Doğrusu: sunma süresi yirmidört saat, karar süresi kırksekiz saattir ve süre geçince karar kalkar."}},"celdiriciYol":{},"hap":"Vali\u0027nin oda faaliyetten men kararı yirmidört saat içinde hakim onayına sunulur, hakim kırksekiz saat içinde açıklamazsa karar kendiliğinden kalkar.","teshis":{"C":{"gercek":"Kanun açıkça süresinde karar açıklanmazsa idari kararın kendiliğinden yürürlükten kalkacağını söyler.","ayirt":"Hakim süresinde konuşmazsa idari tedbir ayakta mı kalır, düşer mi?","paragraf":"3568 s.K. m.15/2","yanilgi":"Hakim onayını sonuçsuz bir prosedür sanıp kararın kendiliğinden yürürlükte kalacağını düşünüyorsun."},"E":{"gercek":"Kanunda genel kurul istisnası yalnız göreve son verme ve görevden uzaklaştırma hükümleri için tanınmıştır, faaliyetten men ayrı bir tedbirdir.","ayirt":"Bu istisna hangi tedbirin cümlesinde geçiyordu, faaliyetten men cümlesinde mi?","paragraf":"3568 s.K. m.15/2","yanilgi":"Genel kurulla ilgili istisnayı gördüğün her tedbire otomatik uyguluyorsun."},"A":{"gercek":"Kanun madde 15/2 iki süreyi ve sonucu birlikte düzenler: yirmidört saatte sunma, kırksekiz saatte karar, açıklanmazsa kendiliğinden kalkma.","ayirt":"Süre çiftini tek başına değil, sonucuyla birlikte mi hatırlıyorum?","paragraf":"3568 s.K. m.15/2","yanilgi":"Bu şıkkı çok uzun ve ayrıntılı bulup \u0027sınav bu kadar net yazmaz\u0027 diyerek eleyebilirsin."},"D":{"gercek":"Faaliyetten men, kolluk niteliğinde bir tedbir olduğundan mülki idare amiri sıfatıyla vali tarafından uygulanır.","ayirt":"Bu tedbiri veren makam meslek örgütü mü, idari makam mı?","paragraf":"3568 s.K. m.15/2","yanilgi":"Meslek örgütü hiyerarşisini idari makamların yerine koyup Birliği yetkili sanıyorsun."},"B":{"gercek":"Metinde sıralama nettir: önce yirmidört saat içinde sunma, sonra kırksekiz saat içinde hakim kararı.","ayirt":"Küçük süre hangi işleme ait, önce mi sonra mı geliyor?","paragraf":"3568 s.K. m.15/2","yanilgi":"İki sayıyı gördüğünde hangisinin sunma hangisinin karar süresi olduğunu ezbersiz karıştırıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 109"},"kural":"Kanunun verdiği yetkinin sınırları içinde kalan bir fiil, zarara yol açsa bile hukuka aykırı sayılmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Beş şıktan dördü aynı maddenin farklı bentlerinden gerçek haksız rekabet örneğiyse, kalan tek şıkkı \u0027yetki kapsamında kalma\u0027 ölçütüyle ara.","konu":"mesleki davranış ilkesi","tablo":{"satirlar":[["A) Almadığı bir unvan veya dereceye sahipmiş gibi hareket e…","TTK m.55/1-a-3","doğru ifade"],["B) Meslek örgütünün kendisine tanıdığı denetim yetkisi kaps…","TBK m.63","YANLIŞ ifade"],["C) Rakip bir meslektaşının mali durumu hakkında gerçeğe ayk…","TTK m.55/1-a-2","doğru ifade"],["D) Kendisine emanet edilen bir teklif dosyasından yetkisiz …","TTK m.55/1-c-1","doğru ifade"],["E) Bir meslektaşının çalışanını, işverenin iş sırlarını ifş…","TTK m.55/1-b-3","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Rakip bir meslektaşının mali durumu hakkında gerçeğe aykırı açıklamalarla müşterileri kendine çekmeye çalışması.","E":"Bir meslektaşının çalışanını, işverenin iş sırlarını ifşa etmeye yönlendirerek bilgi elde etmesi.","A":"Almadığı bir unvan veya dereceye sahipmiş gibi hareket ederek müstesna bir yeteneğe sahip olduğu izlenimini uyandırması.","D":"Kendisine emanet edilen bir teklif dosyasından yetkisiz biçimde yararlanarak kendi teklifini hazırlaması.","B":"Meslek örgütünün kendisine tanıdığı denetim yetkisi kapsamında kalarak bir müşterinin mali tablolarını inceleyip rapor düzenlemesi."},"kaynak":{"alinti":"kanunun verdiği yetkiye dayanan ve bu yetkinin sınırları içinde kalan fiil hukuka aykırı sayılmaz","liste":[{"ad":"TTK (6102 s.K.) m.55 [1/4]","metin":"MADDE 55- (1) Aşağıda sayılan hâller haksız rekabet hâllerinin başlıcalarıdır: a) Dürüstlük kuralına aykırı reklamlar ve satış yöntemleri ile diğer hukuka aykırı davranışlar ve özellikle; 1. Başkalarını veya onların mallarını, iş ürünlerini, fiyatlarını, faaliyetlerini veya ticari işlerini yanlış, yanıltıcı veya gereksiz yere incitici açıklamalarla kötülemek, 2. Kendisi, ticari işletmesi, işletme işaretleri, malları, iş ürünleri, faaliyetleri, fiyatları, stokları, satış kampanyalarının biçimi ve iş ilişkileri hakkında gerçek dışı veya yanıltıcı açıklamalarda bulunmak veya aynı yollarla üçüncü kişiyi rekabette öne geçirmek, 3. Paye, diploma veya ödül almadığı hâlde bunlara sahipmişçesine hareket ederek müstesna yeteneğe malik bulunduğu zannını uyandırmaya çalışmak veya buna elverişli doğru olmayan meslek adları ve sembolleri kullanmak, 4. Başkasının malları, iş ürünleri, faaliyetleri veya işleri ile karıştırılmaya yol açan önlemler almak, 5. Kendisini, mallarını, iş ürünlerini, faaliyetlerini, fiyatlarını, gerçeğe aykırı, yanıltıcı, rakibini gereksiz yere kötüleyici veya gereksiz yere onun tanınmışlığından yararlanacak şekilde; başkaları, malları, iş ürünleri veya fiyatlarıyla karşılaştırmak ya da üçüncü kişiyi benzer yollardan öne geçirmek, 6."},{"ad":"TTK (6102 s.K.) m.55 [2/4]","metin":"Seçilmiş bazı malları, iş ürünlerini veya faaliyetleri birden çok kere tedarik fiyatının altında satışa sunmak, bu sunumları reklamlarında özellikle vurgulamak ve bu şekilde müşterilerini, kendisinin veya rakiplerinin yeteneği hakkında yanıltmak; şu kadar ki, satış fiyatının, aynı çeşit malların, iş ürünlerinin veya faaliyetlerinin benzer hacimde alımında uygulanan tedarik fiyatının altında olması hâlinde yanıltmanın varlığı karine olarak kabul olunur; davalı, gerçek tedarik fiyatını ispatladığı takdirde bu fiyat değerlendirmeye esas olur, 7. Müşteriyi ek edimlerle sunumun gerçek değeri hakkında yanıltmak, 8. Müşterinin karar verme özgürlüğünü özellikle saldırgan satış yöntemleri ile sınırlamak, 9. Malların, iş ürünlerinin veya faaliyetlerin özelliklerini, miktarını, kullanım amaçlarını, yararlarını veya tehlikelerini gizlemek ve bu şekilde müşteriyi yanıltmak, 10. Taksitle satım sözleşmelerine veya buna benzer hukuki işlemlere ilişkin kamuya yapılan ilanlarda unvanını açıkça belirtmemek, peşin veya toplam satış fiyatını veya taksitle satımdan kaynaklanan ek maliyeti Türk Lirası ve yıllık oranlar üzerinden belirtmemek, 11. Tüketici kredilerine ilişkin kamuya yapılan ilanlarda unvanını açıkça belirtmemek veya kredilerin net tutarlarına, toplam giderlerine, efektif yıllık faizlerine ilişkin açık beyanlarda bulunmamak, 12. İşletmesine ilişkin faaliyetleri çerçevesinde, taksitle satım veya tüketici kredisi sözleşmeleri sunan veya akdeden ve bu bağlamda sözleşmenin konusu, fiyatı, ödeme şartları, sözleşme süresi, müşterinin cayma veya fesih hakkına veya kalan borcu vadeden önce …"}],"hakem":"Doğru sık, TBK m.63\u0027te yer alan \u0027kanunun verdiği yetkiye dayanan ve bu yetkinin sınırları içinde kalan fiil hukuka aykırı sayılmaz\u0027 kuralını kaynak metinden desteklemektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavirin mesleki faaliyeti sırasındaki aşağıdaki davranışlarından hangisi Türk Ticaret Kanunu\u0027na göre haksız rekabet hali oluşturmaz?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-11","verilenler":[],"dayanak":"Türk Ticaret Kanunu (6102 s.K.) m.55/1-a,b,c; Türk Borçlar Kanunu (6098 s.K.) m.63","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bağımsız denetçi Kerim, meslek örgütünün kendisine verdiği yetkiyle bir anonim şirketin 2023 mali tablolarını inceliyor, 45.000 TL ücret karşılığı rapor düzenliyor.","anlatim":"Kerim\u0027in yaptığı iş, bir yetki belgesine dayanıyor. Şimdi bu tek olayı beş farklı iddiaya çeviriyoruz.","doldur":[]},{"formul":"Ne yapacağız: Bir davranış ancak dürüstlük kuralına aykırıysa haksız rekabet sayılır; kanunun veya yetkili makamın verdiği yetki sınırında kalan iş hukuka aykırı olmaz.","anlatim":"Kerim\u0027in denetim raporu bu yüzden haksız rekabet değil. Şimdi beş ifadeyi Kerim\u0027in olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TTK m.55/1-a-3","karar":"doğru","anlatim":"Kerim burada gerçek olmayan bir paye ile müstesna yetenek zannı uyandırıyor. Kanun bunu açıkça reklam yoluyla haksız rekabet sayar.","formul":"Şık A: Kerim, elde etmediği bir \u0027uzman denetçi\u0027 unvanına sahipmiş gibi davranarak müşteriye üstün yetenek izlenimi verse, bu haksız rekabet olur mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.63","karar":"yanlış","anlatim":"Kerim burada yetkili makamın verdiği sınırlar içinde kalıyor, dışına çıkmıyor. Kanunun verdiği yetkinin sınırları içindeki fiil hukuka aykırı sayılmaz.","formul":"Şık B: Kerim, meslek örgütünün tanıdığı denetim yetkisiyle mali tabloları incelemiş; bu haksız rekabet olur mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TTK m.55/1-a-2","karar":"doğru","anlatim":"Kerim burada rakibini yanlış bilgiyle kötülüyor ve müşteri çekiyor. Kanun bu tür kötülemeyi açıkça haksız rekabet sayar.","formul":"Şık C: Kerim, rakip meslektaşı hakkında gerçeğe aykırı sözlerle müşterileri kendine çekmeye çalışsa, bu haksız rekabet olur mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TTK m.55/1-c-1","karar":"doğru","anlatim":"Kerim burada kendisine güvenle bırakılan bir iş ürününü izinsiz kullanıyor. Kanun bunu iş ürününden yetkisiz yararlanma sayar.","formul":"Şık D: Kerim, emanet edilen bir teklif dosyasını yetkisiz kullanıp kendi teklifini hazırlasa, bu haksız rekabet olur mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TTK m.55/1-b-3","karar":"doğru","anlatim":"Kerim burada üçüncü kişiyi sözleşmesine aykırı davranmaya kendisi yöneltiyor. Kanun bu yöneltmeyi ayrı bir haksız rekabet hali sayar.","formul":"Şık E: Kerim, bir meslektaşının çalışanını işverenin sırlarını ifşaya yöneltip bilgi alsa, bu haksız rekabet olur mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✓ D ✓ E ✓","anlatim":"Beş davranıştan sadece yetki sınırları içinde kalan denetim faaliyeti haksız rekabet değildir. Kendine hep şunu sor: bu davranış bana tanınmış bir yetkinin sınırları içinde mi kaldı, yoksa dürüstlük kuralını mı çiğnedi?","doldur":[]}],"anahtar":[{"ornek":"sınırları","kok":"sınırl"},{"ornek":"rekabet","kok":"rekabe"},{"ornek":"haksız","kok":"haksız"},{"ornek":"içinde","kok":"içinde"},{"ornek":"burada","kok":"burada"},{"ornek":"aykırı","kok":"aykırı"}],"konuGiris":{"harita":"Ne zaman test edilir: bir meslek mensubunun somut davranışı örnek olay şeklinde verildiğinde test edilir. Nasıl ölçülür: davranışın Türk Ticaret Kanunu m.55\u0027teki haksız rekabet hâllerinden birine uyup uymadığına bakılarak ölçülür. Nasıl kaydedilir: doğru cevap, kanundaki sayılan hâllere uymayan tek seçenek olarak işaretlenir.","desen":"Soru, m.55\u0027te sayılan haksız rekabet hâllerini örnek davranışlar hâlinde sıralar ve öğrenciden bunlardan HANGİSİNİN haksız rekabet OLMADIĞINI bulmasını ister. Tuzak, doğru ve gerçeğe dayalı, yanıltıcı olmayan bir açıklamayı haksız rekabet zannetmektir. Bu soru m.55/1-a bendinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Dürüstlük kuralına aykırı reklam, kötüleme veya yanıltma davranışı","ad":"Haksız rekabet","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ticari ilişkilerde doğru, gerçek ve yanıltmayan davranış standardı","ad":"Dürüstlük kuralı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Rakibi veya işini yanlış, yanıltıcı biçimde küçük düşürme davranışı","ad":"Kötüleme","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Sahip olunmayan unvan veya ödülü varmış gibi kullanma davranışı","ad":"Meslek adı/sembolü suistimali","kim":"meslek kuruluşu düzenler"}],"sinavda":"Meslek mensubunun çeşitli davranışları verilir ve bunlardan haksız rekabet oluşturmayan seçilmesi istenir.","panel_ornek":"Arkadaşın 20.000 liraya ikinci el bir bisiklet satıyor ve ilanında \u0027piyasadaki tüm bisikletler kötü kalite\u0027 diye yazıyor. Bu, rakibi kötüleyip kendi ürününü öne çıkarmak; gerçek durumu doğru anlatan bir ilan ise haksız rekabet olmaz.","ornek":"Arkadaşın 20.000 liraya ikinci el bir bisiklet satıyor ve ilanında \u0027piyasadaki tüm bisikletler kötü kalite\u0027 diye yazıyor. Bu, rakibi kötüleyip kendi ürününü öne çıkarmak; gerçek durumu doğru anlatan bir ilan ise haksız rekabet olmaz.","yontemler":"Her seçenek \u0027yanıltıcı mı, gerçek dışı mı, kötüleyici mi\u0027 sorusuyla test edilir; doğru ve nesnel bilgi veren davranış haksız rekabet sayılmaz.","nedir":"Bu ilke, meslek mensubunun rekabette dürüstlük kuralına uyup uymadığını belirler. Sınav, hangi davranışın haksız rekabet sayılıp hangisinin sayılmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Kötüleme Tuzağı","metin":"Rakibi kötülemenin yalnız reklamda değil, doğrudan sözle yapılınca haksız rekabet sayılmayacağını düşünürsün. Doğrusu: Gerçeğe aykırı ve kötüleyici açıklamalar Türk Ticaret Kanununun 55 inci maddesi kapsamında haksız rekabettir."},"E":{"ad":"Sır İfşasına Yöneltme Tuzağı","metin":"Bilgiyi doğrudan sen değil, üçüncü kişi işçi ifşa ettiği için sorumluluğun sana geçmeyeceğini sanırsın. Doğrusu: İşçiyi iş sırrını ifşaya yöneltmek, kanunda ayrıca düzenlenmiş bağımsız bir haksız rekabet hâlidir."},"D":{"ad":"İş Ürünü Tuzağı","metin":"Emanet edilen belgeden yararlanmayı meslek serbestisi sanırsın. Doğrusu: Emanet edilmiş bir teklif veya plandan yetkisiz yararlanma, kanunda ayrıca sayılan bir haksız rekabet hâlidir."},"A":{"ad":"Paye/Unvan Taslama Tuzağı","metin":"Almadığı bir derece veya paye sahibiymiş gibi davranmayı meslek içi doğal bir tanıtım sanırsın. Doğrusu: Bu davranış Türk Ticaret Kanununun 55 inci maddesinde açıkça haksız rekabet hali sayılmıştır."}},"celdiriciYol":null,"hap":"Kanunun veya yetkili makamın tanıdığı yetkinin sınırları içinde kalan fiil, zarar doğursa da hukuka aykırı sayılmaz ve haksız rekabet oluşturmaz.","teshis":{"C":{"gercek":"Türk Ticaret Kanununun 55 inci maddesi gerçeğe aykırı, yanıltıcı veya gereksiz kötüleyici her açıklamayı haksız rekabet sayar.","ayirt":"Açıklama gerçeğe uygun ve gerekli mi?","paragraf":"TTK m.55/1-a-2","yanilgi":"Sözlü kötülemenin yazılı reklam kadar ağır sonuç doğurmadığını düşünüyorsun."},"E":{"gercek":"Türk Ticaret Kanununun 55 inci maddesi, işçiyi iş sırrını ifşaya yöneltmeyi bağımsız bir haksız rekabet hali olarak düzenlemiştir.","ayirt":"Üçüncü kişiyi sözleşmesine aykırı davranmaya ben mi yönelttim?","paragraf":"TTK m.55/1-b-3","yanilgi":"Sırrı sen değil işçi ifşa ettiği için sorumluluğun sana geçmeyeceğini sanıyorsun."},"A":{"gercek":"Türk Ticaret Kanununun 55 inci maddesi, sahip olunmayan paye veya diplomaya sahipmiş gibi davranmayı dürüstlük kuralına aykırı reklam sayar.","ayirt":"Bu davranış gerçek bir yeterliliğe mi dayanıyor, yoksa izlenim mi yaratıyor?","paragraf":"TTK m.55/1-a-3","yanilgi":"Unvan taslamayı zararsız bir tanıtım yöntemi sanıyorsun."},"D":{"gercek":"Türk Ticaret Kanununun 55 inci maddesi emanet edilen iş ürününden yetkisiz yararlanmayı ayrıca haksız rekabet hali saymıştır.","ayirt":"Bu bilgiye sahip olma yetkim var mıydı, yoksa emanet mi edilmişti?","paragraf":"TTK m.55/1-c-1","yanilgi":"Elindeki belgeyi değerlendirmeyi mesleki beceri sanıyorsun."},"B":{"gercek":"Türk Borçlar Kanununun 63 üncü maddesine göre kanunun veya yetkili makamın verdiği yetkinin sınırları içindeki fiil hukuka aykırı sayılmaz.","ayirt":"Bu davranış bana tanınmış bir yetkinin sınırları içinde mi kaldı?","paragraf":"TBK m.63","yanilgi":"Yetkili bir denetim faaliyetini bile haksız rekabet zannedip bu şıkkı eleyebilirsin."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 95"},"kural":"213 madde 4, (a)\u0027dan (f)\u0027ye altı bent sayar; süre/deneyim şartı bu bentler arasında yoktur, deneyim staj sürecine ilişkin ayrı bir konudur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 95","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 4\u0027ün altı bendini (vatandaşlık, ehliyet, kamu hakları, ceza mahkumiyeti yokluğu, memuriyetten çıkarılmamış olma, şeref-haysiyet) sırayla say; listede olmayan her ifade doğru şıktır.","konu":"türmob meslek odasi gelirleri","tablo":{"satirlar":[["A) Türkiye Cumhuriyeti vatandaşı olmak","m.4/a","doğru ifade"],["B) Medeni hakları kullanma ehliyetine sahip bulunmak","m.4/b","doğru ifade"],["C) En az beş yıl mesleki deneyime sahip olmak","m.4","YANLIŞ ifade"],["D) Kamu haklarından mahrum bulunmamak","m.4/c","doğru ifade"],["E) Meslek şeref ve haysiyetine uymayan durumları bulunmamak","m.4/f","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"En az beş yıl mesleki deneyime sahip olmak","E":"Meslek şeref ve haysiyetine uymayan durumları bulunmamak","A":"Türkiye Cumhuriyeti vatandaşı olmak","D":"Kamu haklarından mahrum bulunmamak","B":"Medeni hakları kullanma ehliyetine sahip bulunmak"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"},{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"}],"hakem":"Madde 4\u0027te a-f bentleri arasında mesleki deneyim şartı yer almamaktadır; deneyim staj ve sınav şartlarına ilişkin ayrı hükümlerle düzenlenmiş olup, genel şartlar arasında bulunmamaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre meslek mensubu olabilmenin genel şartlarından hangisi bu Kanunda yer almaz?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-16","verilenler":[],"dayanak":"3568 sayılı SMMM Kanunu m.4","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir muhasebe ofisinde çalışan Emre, 2019\u0027da stajını bitirip SMMM sınavına girmeye hazırlanıyor; ofis sahibi ona \u0027başvuru öncesi şu beş şartı kontrol et\u0027 diyor.","anlatim":"Emre elindeki listeyi 3568 sayılı Kanun\u0027un madde 4\u0027üyle karşılaştırıyor. Listede beş madde var, kanunda ise altı bent var. Şimdi bu beş ifadeyi tek tek kanunla eşleştireceğiz.","doldur":[]},{"formul":"Ne yapacağız: Madde 4, meslek mensubu olmanın genel şartlarını (a)\u0027dan (f)\u0027ye altı bent halinde sayıyor; Emre\u0027nin listesindeki her ifadenin bu altı bentten birine karşılık gelip gelmediğine bakacağız.","anlatim":"Kural tek: madde 4\u0027te yazan neyse genel şarttır, yazmayan değildir. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.4/a","karar":"doğru","anlatim":"Madde 4/a bunu doğrudan ilk bent olarak sayıyor. Emre\u0027nin listesi burada kanunla birebir örtüşüyor.","formul":"Şık A: Emre listesinde \u0027T.C. vatandaşı olmalıyım\u0027 yazmış, bunu genel şart sayar mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.4/b","karar":"doğru","anlatim":"Madde 4/b bunu ikinci bent olarak açıkça sayıyor. Emre yine doğru yazmış.","formul":"Şık B: Emre \u0027medeni hakları kullanma ehliyetim olmalı\u0027 diye not almış, bu bir genel şart mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.4","karar":"yanlış","anlatim":"Madde 4\u0027ün altı bendinde hiçbir yerde yıl bazlı deneyim süresi geçmiyor, staj ayrı bir konudur. Ofis sahibi burada yanılıyor, Emre\u0027nin listesinde bu madde hiç olmamalı.","formul":"Şık C: Ofis sahibi \u0027en az beş yıl deneyimin olmalı, yoksa genel şartı taşımazsın\u0027 diyor; buna katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.4/c","karar":"doğru","anlatim":"Madde 4/c bunu üçüncü bent olarak sayıyor. Emre\u0027nin listesi yine kanunla uyuşuyor.","formul":"Şık D: Emre \u0027kamu haklarından mahrum olmamalıyım\u0027 yazmış, bu genel şart mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.4/f","karar":"doğru","anlatim":"Madde 4/f bunu son bent olarak açıkça sayıyor. Emre listesinin son maddesi de doğru çıkıyor.","formul":"Şık E: Emre \u0027meslek şeref ve haysiyetime uymayan durumum olmamalı\u0027 diye not düşmüş, genel şart mı bu?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Emre\u0027nin beş maddelik listesinden sadece deneyim süresi kanunda yok, geri kalan dördü madde 4\u0027ün bentleriyle birebir örtüşüyor. Kendine hep şunu sor: bu ifade madde 4\u0027ün altı bendinden hangisine karşılık geliyor, yoksa staj/sınav gibi başka bir maddenin konusu mu?","doldur":[]}],"anahtar":[{"ornek":"deneyim","kok":"deneyi"},{"ornek":"listesi","kok":"listes"},{"ornek":"sayıyor","kok":"sayıyo"},{"ornek":"kanunla","kok":"kanunl"},{"ornek":"süresi","kok":"süresi"},{"ornek":"sayılı","kok":"sayılı"}],"konuGiris":{"harita":"Hangi belgede aranır: kanunun ilgili maddesinde sayılan şartlar listesinde aranır. Nasıl ölçülür: soruda verilen şıklardan kaç tanesinin bu listede gerçekten var olduğu karşılaştırılarak ölçülür. Nasıl kaydedilir: listede yer almayan şık doğru cevap olarak işaretlenir.","desen":"Soru, gerçek şartlar listesine benzeyen ama listede yer almayan bir şıkkı sızdırır; genelde diploma türü, staj süresi gibi özel şartlarla genel şartları karıştırtır. Tuzak, genel şartlar maddesinde sayılmayan bir kavramı sanki oradaymış gibi sunmaktır. Arşivde bir dönem çıkmıştır. Bu soru meslek mensubu olmanın genel şartları maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"meslek mensubu olmak için herkeste aranan ortak koşul","ad":"genel şart","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"T.C. vatandaşı olma koşulu, istisnası saklı tutulur","ad":"vatandaşlık şartı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"belirli ağır suçlardan hüküm giymemiş olma koşulu","ad":"suçtan mahkumiyet yasağı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"mesleğin şeref ve onuruna aykırı halin bulunmaması koşulu","ad":"meslek haysiyeti şartı","kim":"meslek kuruluşu düzenler"}],"sinavda":"Şıklarda birkaç şart verilir ve kanunda sayılmayan tek şık sorulur.","panel_ornek":"Bir spor kulübüne üye olmak için tüzükte üç şart yazar: yaş, aidat ve sağlık raporu. Biri sana dördüncü bir şart daha söylese, \u0027boy sınırı da var\u0027 dese, tüzükte böyle bir madde olmadığını fark edersin. İşte kanundaki şartlar da tüzük gibi sabittir, olmayanı eklemek yanıltmacadır.","ornek":"Bir spor kulübüne üye olmak için tüzükte üç şart yazar: yaş, aidat ve sağlık raporu. Biri sana dördüncü bir şart daha söylese, \u0027boy sınırı da var\u0027 dese, tüzükte böyle bir madde olmadığını fark edersin. İşte kanundaki şartlar da tüzük gibi sabittir, olmayanı eklemek yanıltmacadır.","yontemler":"Her şıkkı tek tek genel şartlar listesiyle eşleştir; listede birebir karşılığı olmayan şık cevaptır.","nedir":"Bu konu, bir meslek mensubu olmak için kanunun aradığı genel şartları anlatır. Sınav, hangi şartın kanunda gerçekten yazdığını, hangisinin sınav kağıdının uydurma bir şart olduğunu ölçer."},"olay":"","tuzak":{"D":{"ad":"Kamu Hakları Tuzağı","metin":"Öğrenci bu bendi ceza mahkumiyeti şartıyla karıştırıp kanunda olmadığını düşünür. Doğrusu: Kamu haklarından mahrum bulunmamak madde 4/c\u0027de ayrı bir bent olarak düzenlenmiştir."},"E":{"ad":"Haysiyet Tuzağı","metin":"Öğrenci bu ifadeyi etik ilkeler yönetmeliğine ait sanıp kanunda yer almadığını düşünür. Doğrusu: Meslek şeref ve haysiyetine uymayan durumların bulunmaması madde 4/f\u0027de kanunun kendisinde sayılmıştır."},"A":{"ad":"Vatandaşlık Tuzağı","metin":"Öğrenci madde 4\u0027teki (a) bendini kanunda yer almayan bir şart sanıp işaretler. Doğrusu: T.C. vatandaşı olmak madde 4/a\u0027da açıkça sayılan genel şartlardan biridir."},"B":{"ad":"Ehliyet Tuzağı","metin":"Öğrenci medeni hakları kullanma ehliyetini staj yönetmeliğine ait sanır. Doğrusu: Bu şart madde 4/b\u0027de kanunun kendisinde yer alır."}},"celdiriciYol":null,"hap":"Meslek mensubu olabilmenin genel şartları 3568 sayılı Kanunun 4 üncü maddesinde (a)\u0027dan (f)\u0027ye altı bent halinde sayılıdır; deneyim/kıdem süresi bu maddede yer almaz.","teshis":{"C":{"gercek":"Madde 4, (a)\u0027dan (f)\u0027ye altı bent sayar; hiçbirinde yıl bazlı deneyim şartı yoktur, staj süresi ayrı maddelerin konusudur.","ayirt":"Madde 4\u0027ün altı bendini tek tek sayıp bu ifadenin hangisine denk geldiğini bulabiliyor muyum?","paragraf":"m.4","yanilgi":"Deneyim/kıdem süresinin de genel şartlar arasında sayıldığını düşünüyorsun; oysa madde 4 böyle bir süre öngörmez."},"E":{"gercek":"Madde 4/f bu şartı doğrudan kanun metninde son bent olarak sayar.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi?","paragraf":"m.4/f","yanilgi":"Meslek şeref ve haysiyeti şartının etik ilkeler yönetmeliğinden geldiğini, kanunda olmadığını sanıyorsun."},"A":{"gercek":"Madde 4/a, T.C. vatandaşı olmayı doğrudan kanun metninde sayar.","ayirt":"Bu ifade madde 4\u0027ün (a)-(f) bentlerinden birine mi karşılık geliyor?","paragraf":"m.4/a","yanilgi":"Vatandaşlık şartının yönetmelikten geldiğini, kanunda geçmediğini sanıyorsun."},"D":{"gercek":"Madde 4/c bunu bağımsız bir bent olarak kanunda sayar.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi?","paragraf":"m.4/c","yanilgi":"Kamu haklarından mahrumiyeti ceza mahkumiyeti bendiyle aynı sanıp ayrı bir bent olmadığını düşünüyorsun."},"B":{"gercek":"Madde 4/b bu şartı kanunun kendisinde açıkça düzenler.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi?","paragraf":"m.4/b","yanilgi":"Medeni hakları kullanma ehliyetini staj başvuru koşulu sanıp kanun dışı görüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 85"},"kural":"Madde 4/d fıkrası kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına mahkûmiyeti şart olarak öngörür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 85","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Genel şart sorularında madde 4\u0027teki sayısal eşikleri (bir yıl gibi) mutlaka kontrol et; kanun metninde geçmeyen bir rakam görürsen o şık yanlıştır.","konu":"smmm olma sartlari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Kanunun maddesi","4","-"],["HESAP","-","-"],["A) Türkiye Cumhuriyeti vatandaşı olmak (yabancı serbest muh…","m.4/a","doğru ifade"],["B) Medeni hakları kullanma ehliyetine sahip bulunmak","m.4/b","doğru ifade"],["C) Ceza veya disiplin soruşturması sonucunda memuriyetten ç…","m.4/e","doğru ifade"],["D) Kasten işlenen bir suçtan dolayı beş yıl veya daha fazla…","m.4/d","YANLIŞ ifade"],["E) Meslek şeref ve haysiyetine uymayan durumları bulunmamak","m.4/f","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak","E":"Meslek şeref ve haysiyetine uymayan durumları bulunmamak","A":"Türkiye Cumhuriyeti vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır)","D":"Kasten işlenen bir suçtan dolayı beş yıl veya daha fazla süreyle hapis cezasına mahkûm olmamak","B":"Medeni hakları kullanma ehliyetine sahip bulunmak"},"kaynak":{"alinti":"bir yıl veya daha fazla süreyle hapis cezası","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"},{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"}],"hakem":"Kaynak metinde Madde 4/d fıkrasında açıkça \u0027bir yıl veya daha fazla süreyle hapis cezası\u0027 şartı yazılı olup, şıkta \u0027beş yıl\u0027 olarak değiştirilmesi nedeniyle ifade yanlıştır ve doğru cevaptır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununun 4 üncü maddesinde düzenlenen meslek mensubu olmanın genel şartlarından biri, aşağıdakilerden hangisinde doğru olarak ifade edilmemiştir?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-17","verilenler":[{"deger":"4","anlam":"Meslek mensubu olmanın genel şartlarının yer aldığı kanun maddesinin numarası; sorunun konusu bu maddede düzenlenmektedir.","ad":"Kanunun maddesi"}],"dayanak":"3568 sayılı SMMM Kanunu m.4","dogru":"D","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ahmet, bir denetim şirketinde meslek mensubu olmak için başvuru yapıyor; dosyasında 8 yıl önce kasten işlediği bir dolandırıcılık suçundan 2 yıl hapis cezası kaydı çıkıyor.","anlatim":"Şirketin İK sorumlusu Ahmet\u0027in dosyasını 3568 sayılı Kanunun 4 üncü maddesindeki genel şartlara göre inceliyor. Beş farklı ifadeyi bu dosyaya uygulayacağız.","doldur":[]},{"formul":"","anlatim":"","doldur":[]},{"formul":"Ne yapacağız: Madde 4\u0027teki altı bendi (a-f) Ahmet\u0027in dosyasındaki 2 yıllık mahkumiyetle ve diğer bilgilerle tek tek karşılaştıracağız.","anlatim":"Her şık bu genel şartlardan birini anlatıyor gibi görünüyor ama biri rakamı ya da kapsamı bozmuş olabilir. Beş ifadeyi Ahmet\u0027in dosyasında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.4/a","karar":"doğru","anlatim":"Ahmet\u0027in vatandaşlığı sorgulanmıyor, kanun bunu zaten a bendinde genel şart olarak koymuş. Yabancı SMMM\u0027lere ilişkin saklı hüküm bu genel kuralı bozmaz.","formul":"Şık A: İK sorumlusu \u0027Ahmet T.C. vatandaşı, bu şart tamam\u0027 diyor, vatandaşlık şartını genel şart sayar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.4/b","karar":"doğru","anlatim":"Kanun bu ehliyeti bizzat b bendinde genel şart olarak sayıyor. Ahmet\u0027in dosyasında bu konuda engel yok, şart doğru tanımlanmış.","formul":"Şık B: İK sorumlusu \u0027Ahmet\u0027in medeni hakları kullanma ehliyeti var mı?\u0027 diye soruyor, bunu şart sayar mısın?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.4/e","karar":"doğru","anlatim":"Madde e bendi ceza veya disiplin soruşturması sonucu memuriyetten çıkarılmamış olmayı genel şart sayar. Ahmet\u0027in dosyasında böyle bir kayıt yok, ifade doğru.","formul":"Şık C: İK sorumlusu \u0027Ahmet daha önce memuriyetten çıkarılmış mı?\u0027 diye kontrol ediyor, bu şartı doğru mu ifade etmiş?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.4/d","karar":"yanlış","anlatim":"Madde d bendindeki eşik beş yıl değil, bir yıl veya daha fazla hapis cezasıdır. Ahmet\u0027in 2 yılı bu eşiği aştığı için ifade yanlış kurulmuş, kanun beş yıl demiyor.","formul":"Şık D: İK sorumlusu \u0027Ahmet\u0027in cezası 2 yıl, kanun beş yıl ve üstünü yasaklıyor, o zaman sorun yok\u0027 diyor, buna katılır mısın?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.4/f","karar":"doğru","anlatim":"Madde f bendi bu durumu açıkça genel şart olarak sayıyor. İfade kanundaki haliyle birebir örtüşüyor, doğru.","formul":"Şık E: İK sorumlusu \u0027Ahmet\u0027in meslek şeref ve haysiyetine aykırı bir durumu var mı?\u0027 diye soruyor, bunu genel şart sayar mısın?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"D şıkkı kanundaki bir yıllık eşiği beş yıla çıkararak metni bozmuş, doğru cevap D. Kendine hep şunu sor: şıktaki sayı, kanun metnindeki sayıyla birebir aynı mı?","doldur":[]}],"anahtar":[{"ornek":"dosyasını","kok":"dosyas"},{"ornek":"cezasıdır","kok":"cezası"},{"ornek":"bendinde","kok":"bendin"},{"ornek":"sayılı","kok":"sayılı"},{"ornek":"birebir","kok":"birebi"},{"ornek":"maddesindeki","kok":"maddes"}],"konuGiris":{"harita":"Ne zaman test edilir: meslek mensubu olma başvurusu sırasında genel şartların tam sağlanıp sağlanmadığı incelenir. Nasıl ölçülür: madde metnindeki altı bendin (a-f) her birinin doğru ve eksiksiz sayılıp sayılmadığına bakılır. Nasıl kaydedilir: hatalı/eksik yazılan şart, sınavda \u0027doğru ifade edilmemiştir\u0027 seçeneği olarak sunulur.","desen":"Soru, madde 4\u0027teki altı bendi (a-f) tek tek şıklara dağıtıp birini kasıtlı olarak eksik/yanlış özetler; tuzak genellikle \u0027bir yıldan az\u0027 veya \u0027her suç\u0027 gibi kapsam değiştiren ifadelerdir. Adayın kanun metnindeki tam ifadeyle şık metnini kelime kelime karşılaştırması beklenir. Bu soru m.4 (a-f) bentlerinin doğru aktarılıp aktarılmadığı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubu olmak için Türk vatandaşı olma zorunluluğu, yabancı YMM hükmü saklı","ad":"T.C. vatandaşlığı şartı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin siyasi/medeni kamu haklarını kullanabilir durumda olması şartı","ad":"Kamu haklarından mahrum olmama","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Zimmet, rüşvet, dolandırıcılık gibi suçlardan bir yıl+ hapisle mahkûm olmama şartı","ad":"Belirli suçlardan mahkûmiyet yasağı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin mesleğin onuruna aykırı davranış/durumunun bulunmaması şartı","ad":"Meslek şeref ve haysiyetine uygunluk","kim":"meslek kuruluşu düzenler"}],"sinavda":"Beş şıkta genel şartlardan biri verilir ve hangisinin kanun metnine aykırı yazıldığı sorulur.","panel_ornek":"Bir spor kulübüne üye olmak istediğinde önce yaş, sabıka kaydı ve aidat gibi genel şartları sağlaman istenir; sadece 2 şartı tutturup diğerini atlarsan üyelik kabul edilmez. Mesela 18 yaşında ve temiz sicilli olman gerekir, üçüncü şart olan referans mektubunu unutursan başvurun geçersiz sayılır.","ornek":"Bir spor kulübüne üye olmak istediğinde önce yaş, sabıka kaydı ve aidat gibi genel şartları sağlaman istenir; sadece 2 şartı tutturup diğerini atlarsan üyelik kabul edilmez. Mesela 18 yaşında ve temiz sicilli olman gerekir, üçüncü şart olan referans mektubunu unutursan başvurun geçersiz sayılır.","yontemler":"Her şıkkı madde 4\u0027ün a-f bentleriyle tek tek eşleştirip fark olan kelimeyi bulmak en kritik yöntemdir.","nedir":"Bu konu, SMMM/YMM mesleğine kabul için aranan genel şartları düzenler. Sınav, hangi ifadenin kanun metnine aykırı/eksik yazıldığını ayırt etmenizi ölçer."},"olay":"Şıkta geçen eşik bir yıl yerine beş yıl olarak değiştirilmiştir.","tuzak":{"C":{"ad":"Disiplin Karıştırma Tuzağı","metin":"Memuriyetten çıkarılmama şartını meslek disiplin cezalarına ilişkin ayrı bir düzenleme sanıp genel şartlar arasında görmezsin. Doğrusu: Madde 4/e fıkrası ceza veya disiplin soruşturması sonucu memuriyetten çıkarılmamış olmayı genel şart olarak sayar."},"E":{"ad":"Ölçüt Belirsizliği Tuzağı","metin":"Meslek şeref ve haysiyetine uymayan durum kavramını somut bir hukuki ölçüt olmadığı için kanun metninde yer almadığını düşünürsün. Doğrusu: Madde 4/f fıkrası bu şartı meslek mensubu olmanın genel şartlarından biri olarak açıkça sayar."},"A":{"ad":"Vatandaşlık İstisnası Tuzağı","metin":"Yabancı serbest muhasebeci mali müşavirlere ilişkin hükmün saklı tutulmasını, bu bendin genel şart olmaktan çıktığı şeklinde yorumlarsın. Doğrusu: Madde 4/a fıkrası Türkiye Cumhuriyeti vatandaşı olma şartını aynen bu ifadeyle koyar, istisna hükmü ayrıca saklı tutulur."},"B":{"ad":"Kanun Karıştırma Tuzağı","metin":"Medeni hakları kullanma ehliyetini yalnızca Türk Medeni Kanununun konusu sayıp 3568 sayılı Kanunda düzenlenmediğini sanırsın. Doğrusu: Madde 4/b fıkrası bu şartı meslek mensubu olmanın genel şartlarından biri olarak bizzat sayar."}},"celdiriciYol":null,"hap":"3568 sayılı Kanunun 4 üncü maddesindeki mahkumiyet engeli kasten işlenen suçtan bir yıl veya daha fazla hapis cezasıdır, beş yıl değildir.","teshis":{"C":{"gercek":"Madde 4/e fıkrası ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmamış olmayı genel şart olarak açıkça sayar.","ayirt":"Bu şart meslek mensubu OLMANIN önkoşulu mu, yoksa meslekteyken uygulanan bir ceza mı?","paragraf":"3568 s.K. m.4/e","yanilgi":"Memuriyetten çıkarılmama şartını meslek disiplin cezalarına özgü ayrı bir düzenleme sanıp genel şartlardan saymıyorsun."},"E":{"gercek":"Madde 4/f fıkrası bu durumu meslek mensubu olmanın genel şartlarından biri olarak açıkça sayar.","ayirt":"Kavramın soyut görünmesi, kanunda bir şart olarak sayılmadığı anlamına mı gelir?","paragraf":"3568 s.K. m.4/f","yanilgi":"Meslek şeref ve haysiyeti kavramını somut bir hukuki kriter olmadığı için kanunda ayrıca düzenlenmediğini varsayıyorsun."},"A":{"gercek":"Madde 4/a fıkrası vatandaşlık şartını genel şart olarak koyar; ayrıca yabancılar hakkındaki özel hükmün saklı tutulması bu genel kuralı ortadan kaldırmaz.","ayirt":"İstisna hükmünün varlığı, asıl kuralın genel şart olmaktan çıktığı anlamına mı gelir?","paragraf":"3568 s.K. m.4/a","yanilgi":"Yabancı SMMM\u0027lere ilişkin saklı tutma hükmünü görünce vatandaşlık şartının istisnalı olduğunu, dolayısıyla genel şart sayılamayacağını düşünüyorsun."},"D":{"gercek":"Madde 4/d fıkrası eşiği bir yıl veya daha fazla hapis cezası olarak belirler; beş yıllık bir eşik kanunda yer almaz.","ayirt":"Şıktaki sayı, kanun metnindeki sayıyla birebir aynı mı?","paragraf":"3568 s.K. m.4/d","yanilgi":"Mahkumiyet şartının varlığını doğru bulup eşik süresini kontrol etmeden bu ifadeyi olduğu gibi kabul ediyorsun."},"B":{"gercek":"Madde 4/b fıkrası bu ehliyeti meslek mensubu olmanın genel şartlarından biri olarak bizzat düzenler.","ayirt":"Bir kavramın başka bir kanunda da tanımlanması, bu kanunda şart olarak sayılmadığı anlamına mı gelir?","paragraf":"3568 s.K. m.4/b","yanilgi":"Medeni hakları kullanma ehliyetinin yalnızca Türk Medeni Kanununda düzenlendiğini, 3568 sayılı Kanunda ayrıca sayılmadığını sanıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 106"},"kural":"madde 9/1-a bendi Düzey 1\u0027in dört konusunu (dar kapsamlı mevzuat, araçlar 1, yatırım kuruluşları, takas-saklama-operasyon) sayar; finansal yönetim ve mali analiz ise madde 9/1-b-7 uyarınca Düzey 2 ve Düzey 3 Lisanslarının konusudur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 106","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Lisans düzeyi sorularında konu adının \u0027genel/dar\u0027 görünmesine değil, madde 9\u0027daki bent numarasına bak; hangi konu hangi düzeyde tekrar ediyor onu ayır.","konu":"meslek hukuku ücret sözleşmesi","tablo":{"satirlar":[["A) Dar kapsamlı sermaye piyasası mevzuatı ve meslek kuralları","m.9/1-a-1","doğru ifade"],["B) Sermaye piyasası araçları 1","m.9/1-a-2","doğru ifade"],["C) Yatırım kuruluşları","m.9/1-a-3","doğru ifade"],["D) Takas, saklama ve operasyon işlemleri","m.9/1-a-4","doğru ifade"],["E) Finansal yönetim ve mali analiz","m.9/1-b-7","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yatırım kuruluşları","E":"Finansal yönetim ve mali analiz","A":"Dar kapsamlı sermaye piyasası mevzuatı ve meslek kuralları","D":"Takas, saklama ve operasyon işlemleri","B":"Sermaye piyasası araçları 1"},"kaynak":{"alinti":"da yer alan Düzey 1 Lisansı sınav konuları (dar kapsamlı mevzuat, araçlar 1, yatırım kuruluşları, takas-saklama-operasyon) dışında kalan","liste":[{"ad":"Sermaye Piyasası K. (6362 s.K.) m.9","metin":"MADDE 9 – (1) İhraççı veya halka arz edenin, izahnamenin ilk yayımı tarihinden itibaren on iki ay boyunca gerçekleştireceği ihraçlar için, izahnamedeki ek ve değişikliklerin 6 ncı maddede belirtilen esaslar çerçevesinde onaylanması ve 7 nci maddeye uygun şekilde ilan edilmesi yeterlidir. Bu sürenin geçmesinden sonra yapılacak halka arzlarda izahnamenin tümünün onaylanması gereklidir. İzahnameden sorumlu kişiler"},{"ad":"SPK Tebliğ (VII-128.7) - Sermaye Piyasasında Faaliyette Bulunanlar İçin Lisanslama ve Sicil Tut m.1","metin":"MADDE 1 – (Değişik:RG-8/1/2025-32776) (1) Bu Tebliğin amacı, sermaye piyasası kurumlarında ve halka açık ortaklıklarda çalışanların mesleki yeterliliklerini, bilgi ve becerilerini tespit etmek amacıyla yapılacak sınavlara, bu sınavlar sonucunda verilecek lisanslara, lisanslarla ilgili düzenlenecek eğitim programlarına ve lisans gerektiren ünvan ve görevlere sahip olacak kişiler ile lisansa tabi olmamakla beraber Kurulun düzenlemeleri çerçevesinde haklarında SPL’ye bildirim yapılması gereken kişilerin sicilinin tutulmasına ilişkin usul ve esasları düzenlemektir. Kapsam"}],"hakem":"Soru, SPK Tebliği (VII-128.7) m.9/1-a\u0027da yer alan Düzey 1 Lisansı sınav konuları (dar kapsamlı mevzuat, araçlar 1, yatırım kuruluşları, takas-saklama-operasyon) dışında kalan \u0027finansal yönetim ve mali analiz\u0027in Düzey 2/3 konusu olduğunu kaynakta desteklemektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"SPK Tebliği (VII-128.7)\u0027ye göre Sermaye Piyasası Faali
