şavirler, yaptıkları tasdikin kapsamını düzenleyecekleri raporda açıkça belirtmekle yükümlüdür.","A":"Meslek mensuplarının, muhasebe ve denetim standartlarına uymaması ile mesleki faaliyetlerin yürütülmesinde gereken mesleki özeni göstermemesi, haksız rekabet hallerinden biri olarak kabul edilir.","D":"Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları, ayrı ayrı müstakil birer raporla tespit edilir.","B":"Yeminli mali müşavirler, görevlerine fiilen başlamadan önce üzerlerine aldıkları işleri dikkat ve özenle yapacaklarına dair yemin ederler."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.12 [1/2]","metin":"Madde 12 – Yeminli mali müşavirler gerçek ve tüzelkişilerin veya bunların teşebbüs ve işletmelerinin mali tablolarının ve beyannamelerinin mevzuat hükümleri, muhasebe prensipleri ile muhasebe standartlarına uygunluğunu ve hesapların denetim standartlarına göre incelediğini tasdik ederler. Yeminli mali müşavirlerin tasdik edecekleri belgeler, tasdik konuları ile tasdike ilişkin usul ve esaslar; gerçek ve tüzelkişilerin mükellefiyet şekilleri, iş kolları ve ciroları, döviz kazandırıcı işlemleri, ithalat ve ihracatları, yatırımın miktarları ve nevileri ile belgelerin ibraz edileceği merciler esas alınmak suretiyle Maliye Bakanlığınca çıkarılacak yönetmeliklerle belirlenir. Kanunları gereğince, kamu kurum ve kuruluşlarına verilen tasdik edilmiş mali tablolar, kamu idaresinin yetkili memurlarınca, tasdikin kapsamı ölçüsünde incelenmiş bir belge olarak kabul edilir. Ancak, çeşitli kanunlarla kamu idaresine tanınan teftiş ve inceleme yetkilerinin kullanılmasına ve gerektiğinde tekrarına ait hususlar saklıdır. Yeminli mali müşavirler yaptıkları tasdikin doğruluğundan sorumludurlar. Yaptıkları tasdikin doğru olmaması halinde, tasdikin kapsamı ile sınırlı olmak üzere, ziyaa uğratılan vergilerden ve kesilecek cezalardan mükellefle birlikte müştereken ve müteselsilen sorumlu olurlar. Yeminli mali müşavirler yaptıkları tasdikin kapsamını düzenleyecekleri raporda açıkca belirtirler. (Ek fıkra: 10/9/2014-6552/107 md.) Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları ayrı ayrı müstakil bir rapor ile tespit edilir. Bu kapsamda yeminli mali müşavir ha…"},{"ad":"SMMM K. (3568 s.K.) m.12 [2/2]","metin":"Savunma isteme yazısının tebliğ tarihinden itibaren otuz gün içinde savunma yapılmaması durumunda ilgili yeminli mali müşavir savunma hakkından vazgeçmiş sayılır. Bu Kanun hükümlerine göre meslek icra edenlerin vergi kanunları ve diğer kanunlardaki sorumlulukları saklıdır. Meslekle ilgili konularda çalıştırılmayacak olanlar"}],"hakem":"Doğru sık (C), 3568 sayılı Kanun m.12\u0027de açıkça yer alan tasdik sorumluluğu kuralına aykırıdır: sorumluluk hem kapsam bakımından sınırlı hem de mükellefle birlikte müşterek-müteselsil olup, tek başına değildir."},"kayitlar":[],"sade":{"siklar":{"D":"Mali sorumluluk raporuyla disiplin sorumluluk raporu ayrı ayrı hazırlanır; bu iki tür sorumluluk müstakil belgelerde tespit edilir.","E":"Yeminli mali müşavir tasdik raporunda kapsamını açıkça belirtmek zorundadır; bu bir seçenek değil yasal yükümlülüktür.","A":"Standartlara uymamak ve gerekli özeni göstermemek gerçekten haksız rekabet sayılır; bu ifade kanunun söylediğini doğru aktarır.","B":"Yeminli mali müşavir görevine başlamadan önce dikkat ve özenle çalışacağına yemin eder; bu ifade kanundaki yemin metninde aynen geçer."},"dogru":"Yeminli mali müşavir tasdik yanlış çıkarsa, vergi ve ceza zararlarından mükellefle birlikte sorumlu olur; bu sorumluluk tasdikin kapsamı kadar sınırlıdır. Şık ise sorumluluğun sınırsız ve tek başına olduğunu söylediği için yanlıştır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 12. madde","kavramlar":[{"kaynak":"SMMM K. 12. madde","tanim":"Yeminli mali müşavirin mali tabloların ve beyannamelerin mevzuat, muhasebe prensipleri ve standartlara uygunluğunu onaylayarak belgelemesi.","ad":"Tasdik"},{"kaynak":"SMMM K. 12. madde","tanim":"Yeminli mali müşavirin mükellefle birlikte tasdikin yanlışlığından doğan vergi ve ceza zararlarından ortak olarak ve birbirinin yerine geçecek şekilde sorumlu olması.","ad":"Müşterek ve müteselsil sorumluluk"},{"kaynak":"SMMM K. 12. madde","tanim":"Yeminli mali müşavirin tasdik raporında açıkça belirttiği, hangi belgeler ve konular üzerinde inceleme yaptığını gösteren sınır.","ad":"Tasdikin kapsamı"},{"kaynak":"Haksız Rekabet ve Reklam Yasağı Yön. 6. madde","tanim":"Meslek mensuplarının mesleki faaliyetleri yürütürken muhasebe ve denetim standartlarına uyarak göstermesi gereken dikkat ve titizlik.","ad":"Mesleki özen"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu ile ilgili düzenlemelere göre, meslek mensuplarının özen sorumluluğu hakkında aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-09","verilenler":[],"dayanak":"SMMM K. (3568 s.K.) m.12/2; Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.6/a","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Adana\u0027da yeminli mali müşavir Kemal Bey, 2021 yılı için bir tekstil firmasının kurumlar vergisi beyannamesini tasdik ediyor. Sonradan inceleme sonucu 400.000 TL vergi ziyaı çıkıyor. Firma sahibi \u0027ben ödemem, hepsi Kemal Bey\u0027in sorunu\u0027 diyor.","anlatim":"Vergi dairesi hem firmayı hem Kemal Bey\u0027i takip ediyor. Kemal Bey ise \u0027ben sadece tasdik ettiğim kısımdan sorumluyum, hepsinden değilim\u0027 diyor.","doldur":[]},{"formul":"Ne yapacağız: Kemal Bey\u0027in özen ve tasdik sorumluluğuna dair beş ifadeyi tek tek 3568 sayılı Kanun\u0027a göre doğru mu yanlış mı diye süzeceğiz.","anlatim":"Yemin, haksız rekabet, sorumluluğun kapsamı ve sınırı, raporların ayrılığı ve kapsam belirtme zorunluluğu; hepsini bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.6/a","karar":"doğru","anlatim":"Yönetmelik bunu açıkça haksız rekabet hali sayar, yani bu ifade doğrudur. Kemal Bey\u0027in özensizliği hem disiplin hem haksız rekabet konusu olur.","formul":"Şık A: Kemal Bey mesleki özen göstermeyip standartlara aykırı çalışsa, bu haksız rekabet sayılır mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.11","karar":"doğru","anlatim":"Kanun m.11\u0027deki yemin metni \u0027üzerime aldığım işleri dikkat ve özenle yapacağıma\u0027 cümlesini içerir. Yani bu ifade doğrudur, Kemal Bey böyle yemin etmiştir.","formul":"Şık B: Kemal Bey mesleğe başlamadan önce mahkemede özenli çalışacağına dair yemin etti mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.12/2","karar":"yanlış","anlatim":"Kanun m.12/2 sorumluluğu tasdikin kapsamı ile sınırlı tutar ve firmayla birlikte müşterek-müteselsil sorumluluk kurar. Kemal Bey yanılıyor, ne tek başına ne sınırsız sorumludur; bu ifade yanlıştır.","formul":"Şık C: Kemal Bey \u0027tasdikim yanlış çıktıysa 400.000 TL\u0027nin tamamından tek başıma, sınırsız sorumluyum\u0027 derse haklı mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.12 ek fıkra","karar":"doğru","anlatim":"Kanun m.12 ek fıkra, tasdikten doğan mali sorumluluk ile disiplin sorumluluğunun ayrı ayrı müstakil birer raporla tespit edileceğini söyler. Bu ifade doğrudur.","formul":"Şık D: Kemal Bey hakkında hem mali sorumluluk raporu hem disiplin raporu ayrı ayrı mı düzenlenir?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.12/2","karar":"doğru","anlatim":"Kanun m.12/2 bunu emredici şekilde düzenler; kapsam raporda açıkça belirtilir. Bu ifade doğrudur, Kemal Bey bunu yazmak zorundadır.","formul":"Şık E: Kemal Bey tasdikinin hangi kalemleri kapsadığını raporunda açıkça yazmak zorunda mıdır?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Kemal Bey\u0027in sorumluluğu hem kapsamla sınırlı hem de mükellefle birlikte müşterek-müteselsildir, tek başına ve sınırsız değildir. Kendine hep şunu sor: kanun \u0027sınırlı\u0027 ve \u0027mükellefle birlikte\u0027 kelimelerini birlikte mi kullanmış?","doldur":[]}],"anahtar":[{"ornek":"sorumluluğu","kok":"soruml"},{"ornek":"tasdikten","kok":"tasdik"},{"ornek":"kapsamıyla","kok":"kapsam"},{"ornek":"birlikte","kok":"birlik"},{"ornek":"mükellefle","kok":"mükell"},{"ornek":"müteselsildir","kok":"mütese"}],"konuGiris":{"harita":"Ne zaman test edilir: Yeminli mali müşavirin tasdik ettiği belgenin doğru olmadığı ortaya çıktığında. Nasıl ölçülür: Tasdikin kapsamı ile sınırlı olacak şekilde sorumluluğun derecesi belirlenir. Nasıl kaydedilir: Mali sorumluluk ile disiplin sorumluluğu ayrı ayrı müstakil bir raporla tespit edilir.","desen":"Soru genellikle m.12\u0027deki sorumluluk sınırını (tasdikin kapsamı ile sınırlı) ve savunma süresini (30 gün) karıştıran şıklarla kurulur. Bir şıkta sorumluluğun sınırsız veya tamamen mükellefe ait olduğu yanlış ifadeyle verilir. Bu soru m.12 hükümlerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Mali tablo ve beyannamelerin mevzuata uygunluğunun onaylanması","ad":"tasdik","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ziyaa uğratılan vergi ve cezalardan mükellefle birlikte sorumlu olma","ad":"müşterek ve müteselsil sorumluluk","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Mali sorumluluk ile disiplin sorumluluğunun ayrı tespit edildiği belge","ad":"sorumluluk raporu","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Otuz gün içinde yazılı savunma yapılmazsa bu haktan vazgeçilmiş sayılması","ad":"savunma hakkı","kim":"kanun sabitler"}],"sinavda":"Kanun metnindeki sorumluluk ve tasdik hükümleri verilir, bunlardan hangisinin yanlış olduğu istenir.","panel_ornek":"Bir tamirci arabanı tamir ederken ihmal edip hatalı iş yaparsa, o hatadan sorumlu olur; sadece \u0027elimden geleni yaptım\u0027 demesi yetmez. 15 dakikalık bir kontrolü atlarsa, sonradan çıkan 3 numaralı arıza için de payı vardır. Yani işini üstlenen kişi, o işi gereği gibi yapmakla yükümlüdür.","ornek":"Bir tamirci arabanı tamir ederken ihmal edip hatalı iş yaparsa, o hatadan sorumlu olur; sadece \u0027elimden geleni yaptım\u0027 demesi yetmez. 15 dakikalık bir kontrolü atlarsa, sonradan çıkan 3 numaralı arıza için de payı vardır. Yani işini üstlenen kişi, o işi gereği gibi yapmakla yükümlüdür.","yontemler":"Her şıkkı m.12 metnindeki \u0027tasdikin kapsamı ile sınırlı sorumluluk\u0027 ve \u002730 gün savunma süresi\u0027 ifadeleriyle tek tek karşılaştır.","nedir":"Özen sorumluluğu, meslek mensuplarının işlerini mevzuata ve mesleki standartlara uygun titizlikle yapma yükümlülüğüdür. Sınav bu yükümlülüğün kapsamını, sınırını ve sonucunu bilip bilmediğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Rapor Ayrımı Tuzağı","metin":"Öğrenci mali sorumluluk ile disiplin sorumluluğunun tek raporda birleştirildiğini sanır. Doğrusu: 3568 sayılı Kanunun 12 nci maddesindeki ek fıkraya göre bu iki sorumluluk türü ayrı ayrı müstakil raporlarla tespit edilir, cümle doğrudur."},"E":{"ad":"Beyan Yükümlülüğü Tuzağı","metin":"Öğrenci bu belirtme yükümlülüğünün isteğe bağlı olduğunu düşünür. Doğrusu: Kanun, yeminli mali müşavirin tasdikin kapsamını raporda açıkça belirtmesini zorunlu kılar, cümle doğrudur."},"A":{"ad":"Standart Tuzağı","metin":"Bu cümle aslında kaynaktaki kuralın doğru anlatımıdır, öğrenci \u0027özen göstermeme\u0027 ifadesini görünce hemen yanlış sanır. Doğrusu: Muhasebe ve denetim standartlarına uymama ve özen göstermeme, Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.6/a uyarınca haksız rekabet halidir."},"B":{"ad":"Yemin Metni Tuzağı","metin":"Öğrenci yemin metnindeki \u0027dikkat ve özenle\u0027 ifadesinin kurgu olduğunu düşünür ama bu ifade kanun metninde birebir yer alır. Doğrusu: 213 Kanunun 11 inci maddesindeki yemin metninde bu ibare aynen geçer, cümle doğrudur."}},"celdiriciYol":{},"hap":"Yeminli mali müşavirin tasdikten doğan sorumluluğu, tasdikin kapsamıyla SINIRLI olmak üzere mükellefle birlikte müşterek ve müteselsildir, asla tek başına ve sınırsız değildir.","teshis":{"C":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"E":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"A":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"D":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"B":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 101"},"kural":"3568 sayılı Kanunun 15 inci maddesine göre gecikmede sakınca bulunan hallerde vali odayı faaliyetten men edebilir, karar yirmidört saat içinde hakim onayına sunulur ve hakim kırksekiz saat içinde karar açıklamazsa idari karar kendiliğinden yürürlükten kalkar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 101","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İki süre bir arada verildiğinde hangisinin \u0027sunma\u0027, hangisinin \u0027karar\u0027 süresi olduğunu cümlenin akışına göre eşleştir, sayıları tek başına ezberleme.","konu":"ruhsat iptali-meslek hukuku","tablo":{"satirlar":[["A) Karar, yirmidört saat içinde görevli hakimin onayına sun…","m.15/2","doğru ifade"],["B) Karar, kırksekiz saat içinde görevli hakimin onayına sun…","m.15/2","YANLIŞ ifade"],["C) Karar yirmidört saat içinde hakimin onayına sunulur; hak…","m.15/2","YANLIŞ ifade"],["D) Faaliyetten men kararı doğrudan Türkiye Serbest Muhasebe…","m.15/2","YANLIŞ ifade"],["E) Faaliyetten men kararı oda genel kurulu hakkında da uygu…","m.15/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Karar yirmidört saat içinde hakimin onayına sunulur; hakim onay vermese dahi karar kendiliğinden geçerliliğini sürdürür.","E":"Faaliyetten men kararı oda genel kurulu hakkında da uygulanır.","A":"Karar, yirmidört saat içinde görevli hakimin onayına sunulur; hakim kırksekiz saat içinde kararını açıklamazsa bu idari karar kendiliğinden yürürlükten kalkar.","D":"Faaliyetten men kararı doğrudan Türkiye Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliği Yönetim Kurulunca verilir, hakim onayı aranmaz.","B":"Karar, kırksekiz saat içinde görevli hakimin onayına sunulur; hakim yirmidört saat içinde açıklama yapmazsa karar geçerliliğini korur."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.15 [1/2]","metin":"Madde 15 – (Değişik birinci fıkra: 10/7/2008-5786/7 md.) Bölgesi içinde kendi mesleği konusunda en az 250 meslek mensubu bulunan il merkezlerinde ve bölgesi içinde 250 meslek mensubu bulunan ilçelerde (Büyükşehir belediyesi sınırları içindeki ilçeler hariç) bir oda kurulur. Ayrı ayrı kurulan serbest muhasebeci mali müşavirler ve yeminli mali müşavirler odaları, bulundukları ilin veya ilçenin adıyla anılır. Ancak, ilçelerde oda kurulabilmesi için o ilçedeki en az 100 meslek mensubunun yazılı başvurusu aranır. Yeterli sayıda meslek mensubu bulunmayan ve oda kurulamayan yerlerin en yakın odaya bağlanmasına veya bölge odaları kurulmasına Birlikçe karar verilir. Bu karar Maliye Bakanlığına bildirilir. Odalar, kuruluşlarını Birlik Yönetim Kurulu aracılığıyla Maliye Bakanlığına bildirmekle tüzelkişilik kazanırlar. Odalara üye olmayan meslek mensupları mesleki faaliyette bulunamazlar. (Değişik: 18/6/1997 - 4276/23 md.) Amaçları dışında faaliyet gösteren odaların sorumlu organlarının görevlerine son verilmesine ve yerlerine yenilerinin seçilmesine, Maliye Bakanlığının veya bulundukları yer Cumhuriyet Başsavcılığının istemi üzerine, o yerdeki asliye hukuk mahkemesince basit usule göre yargılama yapılarak karar verilir ve dava en geç üç ay içinde sonuçlandırılır. Mahkemece beşinci fıkrada yazılı organların görevlerine son verilmesi halinde kararda ayrıca, görevlerine son verilen organları bu Kanunda yazılı usullere göre seçecek organları toplamak üzere, Oda Yönetim Kurulu için Oda Genel Kurulu üyeleri arasından, Birlik Yönetim Kurulu için Birlik Genel Kurulu üyeleri arasından beş kişi…"},{"ad":"SMMM K. (3568 s.K.) m.15 [2/2]","metin":"Görevlendirilen bu beş kişi bu fıkrada yazılı süre içinde görevlerine son verilen organlar gibi görevli ve yetkili olup aynı şekilde sorumludurlar. Bu fıkra hükmüne göre seçilecek yeni organlar eski organların görev sürelerini tamamlarlar. Maliye Bakanlığının bu Kanun uyarınca Oda organlarının işlemleri hakkında onay mercii olarak verdiği kararları görevli oda organları aynen yerine getirmekle yükümlüdürler. Bakanlık kararını, idari yargı merciinin yürütmenin durdurulmasına veya esasına ait kararı veya kanuni bir sebep olmaksızın yerine getirmeyen veya eski kararda direnme niteliğinde yeni bir karar veren veya kanunun mecburi kıldığı işlemleri Bakanlığın uyarısına rağmen yerine getirmeyen oda organları hakkında da yukarıdaki fıkralar hükümleri uygulanır. Görevlerine son verilen organların yerine en geç bir ay içerisinde yenileri seçilir. Yeni seçilenler eskilerin süresini tamamlarlar. Görevlerine son verilen organ üyelerinin kanunda yazılı cezai sorumlulukları saklıdır. Bu organların yukarıdaki fıkra gereğince görevlerine son verilmesine sebep olan tasarrufları hükümsüzdür. (Değişik: 18/6/1997 - 4276/23 md.) Ancak, milli güvenliğin, kamu düzeninin, suç işlenmesini veya suçun devamını önlemenin yahut yakalamanın gerektirdiği hallerde gecikmede sakınca varsa, odalar, vali tarafından faaliyetten men edilebilir. Faaliyetten men kararı, yirmidört aat içinde görevli hakimin onayına sunulur. Hakim, kararını kırksekiz saat içinde açıklar, aksi halde, bu idari karar kendiliğinden yürürlükten kalkar. Göreve son verme ve görevden uzaklaştırma hükümleri oda genel kurulu hakkında uygula…"}],"hakem":"3568 sayılı Kanun m.15\u0027te valinin faaliyetten men kararı için yirmidört saat içinde hakim onayı ve hakim kırksekiz saat içinde karar açıklaması; aksi halde kendiliğinden yürürlükten kalma kuralı açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Hakim onayı yalnız formalite değildir; 48 saat içinde karar açıklamazsa valinin kararı kendiliğinden ortadan kalkar.","E":"Kanun açıkça görevden uzaklaştırma ve görevden alma hükümlerinin genel kurula uygulanmadığını söyler; bu faaliyetten men için de geçerli değildir.","D":"Faaliyetten men yetkisi vali tarafındandır, merkezi meslek örgütünden değil; hakim onayı mutlaka gereklidir.","B":"Süreler ters yazılmıştır: sunma 24 saat, hakim kararı 48 saattir. Ayrıca hakim susarsa karar geçerli kalmaz, tersine düşer."},"dogru":"Vali acil durumlarda odayı kapatabilir, ancak karar hakim onayına gitmek zorundadır. Eğer hakim 48 saat içinde karşı çıkmazsa karar kalır; susarsa karar düşer.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 15. madde","kavramlar":[]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre, vali tarafından verilen oda faaliyetten men kararına ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-10","verilenler":[],"dayanak":"3568 sayılı Kanun m.15/2","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Antalya\u0027da bir SMMM Odası\u0027nda 3 Mart günü kamu düzenini bozan olaylar çıkıyor, gecikmede sakınca var diye vali odayı saat 10:00\u0027da faaliyetten men ediyor.","anlatim":"Bu, valinin başka bir ilde verdiği gerçek bir men kararı. Şimdi bu tek olayda kararın akıbetini beş ayrı iddiayla test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: vali saat 10:00\u0027da men kararını veriyor, bu karar 24 saat içinde yani ertesi gün 10:00\u0027a kadar hâkime sunulmalı; hakim de kendi süresi olan 48 saat içinde açıklama yapmazsa karar kendiliğinden düşüyor.","anlatim":"Kural tek: sunma 24 saat, karar 48 saat, hakim susarsa idari tedbir biter. Şimdi beş ifadeyi bu 10:00\u0027lık olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.15/2","karar":"doğru","anlatim":"Olayda vali 10:00\u0027da men ediyor, ertesi gün 10:00\u0027a kadar hâkime sunuluyor. Hakim 48 saat içinde konuşmazsa vali kararı düşer, madde tam bunu söylüyor.","formul":"Şık A: sana \u0027karar 24 saatte hâkime sunulur, hakim 48 saatte açıklama yapmazsa idari karar kendiliğinden kalkar\u0027 deniyor, bu doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.15/2","karar":"yanlış","anlatim":"Olayda süreler ters çevrilmiş, aslında sunma 24 saat, hakim kararı 48 saattir. Ayrıca hakim susarsa karar kalmaz, düşer.","formul":"Şık B: sana \u0027sunma süresi 48 saat, hakim süresi 24 saattir ve hakim susarsa karar geçerli kalır\u0027 deniyor, bu doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.15/2","karar":"yanlış","anlatim":"Olayda 48 saat dolup hakim hiç açıklama yapmıyorsa, vali kararı kendiliğinden yürürlükten kalkıyor, tersi değil.","formul":"Şık C: sana \u0027hakim onay vermese bile vali kararı kendiliğinden geçerliliğini sürdürür\u0027 deniyor, bu doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.15/2","karar":"yanlış","anlatim":"Olayda kararı 10:00\u0027da veren vali, bu yetki mülki idare amirine ait. Birlik\u0027in böyle bir men yetkisi yok.","formul":"Şık D: sana \u0027bu men kararını aslında vali değil, Birlik Yönetim Kurulu verir, hakim onayı da hiç aranmaz\u0027 deniyor, bu doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.15/2","karar":"yanlış","anlatim":"Olayda men edilen oda organları değil odanın faaliyeti, ama kanundaki istisna genel kurul için sadece göreve son verme ve uzaklaştırmada geçerli. Faaliyetten men ayrı bir tedbir, bu istisna ona uygulanmaz.","formul":"Şık E: sana \u0027aynı faaliyetten men kararı oda genel kurulu için de uygulanır\u0027 deniyor, bu doğru mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Tek doğru cümle valinin men kararının 24 saatte sunulup 48 saatte hakim açıklamazsa kendiliğinden düşmesidir. Kendine hep sor: hakim süresinde konuşmazsa tedbir ayakta mı kalır, yoksa düşer mi?","doldur":[]}],"anahtar":[{"ornek":"kararı","kok":"kararı"},{"ornek":"olayda","kok":"olayda"},{"ornek":"içinde","kok":"içinde"},{"ornek":"faaliyetten","kok":"faaliy"},{"ornek":"kendiliğinden","kok":"kendil"},{"ornek":"açıklamazsa","kok":"açıkla"}],"konuGiris":{"harita":"Ne zaman test edilir: valinin oda faaliyetten men kararının hangi hallerde verilebileceği sorulduğunda. Nasıl ölçülür: 24 saat ve 48 saatlik sürelerin doğru eşleştirilmesiyle. Nasıl kaydedilir: hakim onayı gelmezse kararın kendiliğinden yürürlükten kalkacağı bilgisiyle.","desen":"Sınav genelde 24 ve 48 saatlik süreleri karıştırtarak sorar, öğrenci hangi sürenin sunmaya hangisinin karara ait olduğunu şaşırır. Ayrıca kararın kalıcı değil geçici ve onaya bağlı olduğu unutulur. Bu soru m.15 son fıkra hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Valinin gecikmede sakınca varsa odayı geçici durdurma kararı","ad":"Faaliyetten men kararı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Men kararının hakim onayına sunulması gereken süre","ad":"24 saat süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Hâkimin kararını açıklaması gereken süre","ad":"48 saat süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Hakim süresinde karar vermezse men kararının otomatik geçersiz sayılması","ad":"Kendiliğinden yürürlükten kalkma","kim":"kanun sabitler"}],"sinavda":"Valinin oda faaliyetten men kararına ilişkin doğru bilgiyi soran bir soru verilir.","panel_ornek":"Bir apartman yöneticiliği, bina güvenliği için acil durumda kapıcıyı geçici olarak görevden uzaklaştırabilir ama bu karar 2 gün içinde yönetim kuruluna onaylatılmazsa kendiliğinden geçersiz kalır. İşte oda faaliyetten men kararı da böyle, geçici ve onaya bağlı bir tedbirdir.","ornek":"Bir apartman yöneticiliği, bina güvenliği için acil durumda kapıcıyı geçici olarak görevden uzaklaştırabilir ama bu karar 2 gün içinde yönetim kuruluna onaylatılmazsa kendiliğinden geçersiz kalır. İşte oda faaliyetten men kararı da böyle, geçici ve onaya bağlı bir tedbirdir.","yontemler":"24 saat sunma, 48 saat karar süresi olarak ezberlenmeli; süre geçerse kararın kendiliğinden düşeceği unutulmamalı.","nedir":"Bu konu SMMM/YMM odalarının hangi hallerde ve nasıl faaliyetten men edilebileceğini anlatır. Sınav, valinin verdiği men kararının süre ve onay şartlarını bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Onay Gereksizmiş Tuzağı","metin":"öğrenci hakim onayının sadece şekli bir formalite olduğunu, onay gelmezse de kararın ayakta kaldığını sanıyor. Doğrusu: hakim süresinde karar açıklamazsa idari karar kendiliğinden yürürlükten kalkar."},"E":{"ad":"Kapsam Genişletme Tuzağı","metin":"öğrenci organların görevden alınmasına ilişkin sınırlamayı faaliyetten men için de geçerli sayıyor. Doğrusu: göreve son verme ve görevden uzaklaştırma hükümleri oda genel kurulu hakkında uygulanmaz; bu istisna faaliyetten men kararının genel kurula uygulanacağı anlamına gelmez."},"D":{"ad":"Yetkili Makam Tuzağı","metin":"öğrenci faaliyetten men yetkisini merkezi meslek örgütüne (Birlik) veriyor, oysa bu tedbir mülki idare amirine aittir. Doğrusu: faaliyetten men kararını vali verir, hakim onayı zorunludur."},"B":{"ad":"Süre Ters Çevirme Tuzağı","metin":"öğrenci sunma ve karar sürelerini birbirine karıştırıp yirmidört ile kırksekizi yer değiştiriyor, ayrıca sessiz kalmayı geçerlilik lehine yorumluyor. Doğrusu: sunma süresi yirmidört saat, karar süresi kırksekiz saattir ve süre geçince karar kalkar."}},"celdiriciYol":{},"hap":"Vali\u0027nin oda faaliyetten men kararı yirmidört saat içinde hakim onayına sunulur, hakim kırksekiz saat içinde açıklamazsa karar kendiliğinden kalkar.","teshis":{"C":{"gercek":"Kanun açıkça süresinde karar açıklanmazsa idari kararın kendiliğinden yürürlükten kalkacağını söyler.","ayirt":"Hakim süresinde konuşmazsa idari tedbir ayakta mı kalır, düşer mi?","paragraf":"3568 s.K. m.15/2","yanilgi":"Hakim onayını sonuçsuz bir prosedür sanıp kararın kendiliğinden yürürlükte kalacağını düşünüyorsun."},"E":{"gercek":"Kanunda genel kurul istisnası yalnız göreve son verme ve görevden uzaklaştırma hükümleri için tanınmıştır, faaliyetten men ayrı bir tedbirdir.","ayirt":"Bu istisna hangi tedbirin cümlesinde geçiyordu, faaliyetten men cümlesinde mi?","paragraf":"3568 s.K. m.15/2","yanilgi":"Genel kurulla ilgili istisnayı gördüğün her tedbire otomatik uyguluyorsun."},"A":{"gercek":"Kanun madde 15/2 iki süreyi ve sonucu birlikte düzenler: yirmidört saatte sunma, kırksekiz saatte karar, açıklanmazsa kendiliğinden kalkma.","ayirt":"Süre çiftini tek başına değil, sonucuyla birlikte mi hatırlıyorum?","paragraf":"3568 s.K. m.15/2","yanilgi":"Bu şıkkı çok uzun ve ayrıntılı bulup \u0027sınav bu kadar net yazmaz\u0027 diyerek eleyebilirsin."},"D":{"gercek":"Faaliyetten men, kolluk niteliğinde bir tedbir olduğundan mülki idare amiri sıfatıyla vali tarafından uygulanır.","ayirt":"Bu tedbiri veren makam meslek örgütü mü, idari makam mı?","paragraf":"3568 s.K. m.15/2","yanilgi":"Meslek örgütü hiyerarşisini idari makamların yerine koyup Birliği yetkili sanıyorsun."},"B":{"gercek":"Metinde sıralama nettir: önce yirmidört saat içinde sunma, sonra kırksekiz saat içinde hakim kararı.","ayirt":"Küçük süre hangi işleme ait, önce mi sonra mı geliyor?","paragraf":"3568 s.K. m.15/2","yanilgi":"İki sayıyı gördüğünde hangisinin sunma hangisinin karar süresi olduğunu ezbersiz karıştırıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 85"},"kural":"3568 sayılı Kanunun 4 üncü maddesinin d bendi yalnız KASTEN işlenen suçları engel sayar; taksirle işlenen suçlar cezanın süresi ne olursa olsun kapsam dışıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 85","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"d bendini okurken iki eksende ilerle: önce suç kasten mi taksirle mi işlenmiş, sonra sayılan özel suçlardan mı yoksa genel bir-yıl kuralına mı tabi.","konu":"smmm olma şartları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Madde numarası","4","-"],["HESAP","-","-"],["A) Trafik kazasında taksirle ölüme sebebiyet suçundan üç yı…","p.4(d)","YANLIŞ ifade"],["B) Kasten yaralama suçundan bir yıl altı ay hapis cezasına …","p.4(d)","YANLIŞ ifade"],["C) Dolandırıcılık suçundan dört ay hapis cezasına mahkum ol…","p.4(d)","YANLIŞ ifade"],["D) Kasten işlenen bir suçtan bir yıl hapis cezası almış, Tü…","p.4(d)","YANLIŞ ifade"],["E) Disiplin soruşturması sonucunda kamu görevinden çıkarılm…","p.4(e)","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Dolandırıcılık suçundan dört ay hapis cezasına mahkum olan ve cezası adli para cezasına çevrilmemiş aday.","E":"Disiplin soruşturması sonucunda kamu görevinden çıkarılmış aday.","A":"Trafik kazasında taksirle ölüme sebebiyet suçundan üç yıl hapis cezasına mahkum olan aday.","D":"Kasten işlenen bir suçtan bir yıl hapis cezası almış, Türk Ceza Kanununun 53 üncü maddesindeki süreleri dolmuş aday.","B":"Kasten yaralama suçundan bir yıl altı ay hapis cezasına mahkum olan ve cezası infaz edilmiş aday."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"},{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"}],"hakem":"3568 sayılı Kanun m.4/d\u0027de kasten işlenen suçlar engel sayılırken, taksirle işlenen suçlar açıkça kapsam dışıdır; trafik kazasında taksirle ölüme sebebiyet suçu genel şartlara engel teşkil etmez."},"kayitlar":[],"sade":{"siklar":{"C":"Dolandırıcılık özel olarak sayılmış suçlardan biri olduğu için ceza süresi kaç gün olursa olsun mahkumiyet engel sayılır.","E":"Memuriyetten çıkarılma ayrı bir engel olup ceza mahkumiyetiyle ilgili değildir; tek başına genel şartları taşımadığı anlamına gelir.","A":"Doğru cevap. Taksirle işlenen suçlar engel değildir.","D":"Kanun açıkça belirli süreler geçmiş olsa bile kasten işlenen suçtan bir yıl ve üzeri hapis cezasının engel olduğunu söyler; süreler dolması engeli ortadan kaldırmaz.","B":"Kasten yaralama taksirli değil kasten işlenen bir suçtur ve bir yıl altı ayı, bir yıl eşiğini aştığından engel olur; cezanın infaz edilmiş olması engeli kaldırmaz."},"dogru":"Taksirle işlenen suçlar (dikkat eksikliğinden yapılan suçlar) kaç yıl ceza olursa olsun engel değildir. Kanun sadece kasten işlenen suçları engel sayar. Trafik kazasında taksirle ölüme sebebiyet suçu taksirli olduğu için bu aday genel şartları taşır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 4. madde","kavramlar":[{"kaynak":"SMMM K. 4. madde","tanim":"Kanunda ayrıca sıralanan suçlar: zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas ve diğerleri. Bu suçlardan mahkumiyet süresi ne olursa olsun engel sayılır.","ad":"Özel suçlar"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Aşağıdaki adaylardan hangisi, 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununun 4 üncü maddesindeki genel şartlar bakımından serbest muhasebeci mali müşavir olabilir?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-17","verilenler":[{"deger":"4","anlam":"Serbest muhasebeci mali müşavir olabilme koşullarının yazılı olduğu kanun maddesi.","ad":"Madde numarası"}],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.4/d, m.4/e","dogru":"A","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir sanayi sitesinde forklift operatörü Kemal, 2019 yılında dikkatsizlik sonucu bir işçinin ölümüne sebep oluyor; mahkeme taksirle ölüme sebebiyet suçundan üç yıl hapis cezası veriyor. Kemal cezasını çekiyor ve sonra SMMM sınavlarını kazanıp staja başvuruyor.","anlatim":"Oda, Kemal\u0027in dosyasını inceliyor ve üç yıl hapis görmüş olması gözünü korkutuyor. Beş farklı adayın dosyası aynı anda masada; hepsinde ayrı bir suç türü var. Şimdi bu beş dosyayı tek tek açacağız.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanun madde 4/d yalnız KASTEN işlenen suçları engel sayıyor; taksirle işlenen suçlar süresi ne olursa olsun bu bendin dışında kalıyor. Kasten işlenen suçlarda ise genel eşik bir yıl veya daha fazla hapis, ayrıca zimmet-rüşvet-dolandırıcılık gibi sayılan suçlarda süre şartı aranmıyor. Şimdi beş adayı bu kuralla tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"p.4(d)","karar":"yanlış","anlatim":"Madde 4/d yalnız kasten işlenen suçları kapsıyor, taksirle işlenen suçlar bu bendin dışında kalıyor. Kemal\u0027in cezası üç yıl olsa da suç taksirle işlendiği için engel doğmuyor, Kemal genel şartları taşıyor.","formul":"Şık A: Kemal\u0027in suçu taksirle işlenmiş, üç yıl hapis almış; oda \u0027engel var\u0027 diyerek dosyayı reddedecek mi?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"p.4(d)","karar":"yanlış","anlatim":"Sayılmayan kasti suçlarda eşik bir yıl veya daha fazla hapistir, bir yıl altı ay bu eşiği aşıyor. Ayşe\u0027nin cezası infaz edilmiş olsa bile TCK 53 süreleri geçse dahi engel devam ediyor, oda dosyayı reddediyor.","formul":"Şık B: Ayşe kasten yaralama suçundan bir yıl altı ay hapis cezası almış ve cezasını çekmiş; bu süre eşiği aşıyor mu, oda onu kabul eder mi?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"p.4(d)","karar":"yanlış","anlatim":"Madde 4/d dolandırıcılığı ayrıca sayılan özel suçlar arasına koyuyor, bu suçlarda süre şartı aranmıyor. Dört ay bile olsa mahkumiyetin varlığı yeterli, Mehmet\u0027in dosyası reddediliyor.","formul":"Şık C: Mehmet dolandırıcılık suçundan dört ay hapis almış, adli para cezasına çevrilmemiş; ceza kısa diye oda göz mü yumar?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"p.4(d)","karar":"yanlış","anlatim":"Madde açıkça \u0027süreler geçmiş olsa bile\u0027 diyor, yani infaz süresinin dolması engeli kaldırmıyor. Zeynep bir yıl eşiğini tam doldurduğu için dosyası reddediliyor.","formul":"Şık D: Zeynep kasten işlenen bir suçtan bir yıl hapis almış, TCK 53\u0027teki süreler dolmuş; süreler geçtiği için oda kabul mü eder?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"p.4(e)","karar":"yanlış","anlatim":"Madde 4/e, ceza değil disiplin soruşturmasıyla memuriyetten çıkarılmayı da ayrı bir engel sayıyor. Hakan\u0027ın dosyası bu yüzden reddediliyor, ceza mahkumiyeti aranmıyor.","formul":"Şık E: Hakan bir disiplin soruşturması sonucu kamu görevinden çıkarılmış; bu ceza mahkumiyeti olmadığı için oda görmezden mi gelir?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Sadece taksirle işlenen suç engel oluşturmuyor, geri kalan dört dosyanın hepsinde bir engel var. Kendine hep şunu sor: bu suç kasten mi işlenmiş, yoksa taksirle mi?","doldur":[]}],"anahtar":[{"ornek":"suçlar","kok":"suçlar"},{"ornek":"işlenen","kok":"işlene"},{"ornek":"taksirle","kok":"taksir"},{"ornek":"dosyasını","kok":"dosyas"},{"ornek":"kasten","kok":"kasten"},{"ornek":"reddediyor","kok":"redded"}],"konuGiris":{"harita":"Ne zaman test edilir: adayın mesleğe kabul aşamasında şartları taşıyıp taşımadığı sorulduğunda. Nasıl ölçülür: verilen aday profilinin m.4\u0027teki altı şarttan hangisine aykırı olduğu tespit edilerek. Nasıl kaydedilir: şartları sağlayan aday \u0027olabilir\u0027, sağlamayan aday \u0027olamaz\u0027 şeklinde sonuçlandırılır.","desen":"Soru genelde adaylar arasından hangisinin altı şartın tümünü sağladığını buldurur; tuzak, adayın sadece bir suçtan değil hafif bir suçtan hüküm giymiş gibi gösterilmesidir. Diğer şıklarda memuriyetten çıkarılma, kamu haklarından mahrumiyet gibi engeller gizlenir. Bu soru m.4 genel şartlar listesinden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Adayın Türk vatandaşı olması zorunluluğu","ad":"T.C. vatandaşlığı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Adayın kamu haklarını kullanma yetkisinin kısıtlanmamış olması","ad":"Kamu haklarından mahrumiyet","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Belirli ağır suçlardan bir yıl ve üzeri hapis cezası almamış olma şartı","ad":"Kasten işlenen suçtan mahkumiyet","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Mesleğin itibarına aykırı davranışının bulunmaması","ad":"Meslek şeref ve haysiyeti","kim":"meslek kuruluşu düzenler"}],"sinavda":"Şıklarda farklı aday profilleri verilir, hangisinin genel şartları tam sağladığı sorulur.","panel_ornek":"Bir arkadaşın kiralık eve başvururken ev sahibi düzenli maaş, temiz sicil ve kefil gibi genel şartlar arar; bunlardan biri eksikse ev tutulmaz. SMMM adayında da kanundaki genel şartlardan biri eksikse meslek mensubu olunamaz.","ornek":"Bir arkadaşın kiralık eve başvururken ev sahibi düzenli maaş, temiz sicil ve kefil gibi genel şartlar arar; bunlardan biri eksikse ev tutulmaz. SMMM adayında da kanundaki genel şartlardan biri eksikse meslek mensubu olunamaz.","yontemler":"Her şık m.4\u0027teki altı bentle tek tek karşılaştırılır; tek bir şarta aykırılık adayı elemek için yeterlidir.","nedir":"SMMM olabilmek için adayın taşıması gereken genel şartlar kanunda sayılır. Sınav bu şartlardan hangisinin adayı diskalifiye ettiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Süre Şartı Yanılgısı","metin":"dolandırıcılık maddede ayrıca sayılan özel suçlardandır, bu grupta \u00271 yıl\u0027 eşiği aranmaz; dört ay gibi kısa bir ceza dahi mahkumiyet varsa engeldir. Doğrusu: dolandırıcılıktan mahkumiyet, ceza süresi ne olursa olsun genel şartı ortadan kaldırır."},"E":{"ad":"Bent Karıştırma Tuzağı","metin":"bu durum ceza mahkumiyetiyle ilgili d bendi değil, ayrı bir engel olan e bendi kapsamındadır; ceza soruşturması aranmaksızın disiplin yoluyla memuriyetten çıkarılma tek başına engeldir. Doğrusu: disiplin soruşturması sonucu memuriyetten çıkarılma, genel şartların taşınmadığı anlamına gelir."},"D":{"ad":"TCK 53 Aklanma Yanılgısı","metin":"madde açıkça \u0027Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile\u0027 demektedir, yani infaz sürelerinin dolması engeli kaldırmaz. Doğrusu: kasten işlenen suçtan bir yıl ve üzeri hapis cezası, süreler geçse dahi genel şart eksikliği doğurur."},"B":{"ad":"Kast-Süre Karıştırma Tuzağı","metin":"bu suç sayılan özel suçlardan olmadığı için sadece \u00271 yıl ve üzeri hapis\u0027 ölçütüne bakılır; adayın cezası tam bu eşiği aştığından engel devam eder, süre kısa sanılıp geçiştirilemez. Doğrusu: bir yıl altı ay kasten işlenmiş suç cezası, d bendindeki genel eşiği aşar ve engel oluşturur."}},"celdiriciYol":{"C":"Ceza süresi bir yıldan kısa olduğu için genel eşik uygulanır sanılır, oysa sayılan özel suçta süre aranmaz (süre şartı yanılgısı).","E":"Durum ceza mahkumiyeti bendine (d) dahil edilmeye çalışılır, oysa bağımsız bir bent olan (e) uygulanmalıdır (bent karıştırma).","D":"TCK 53 sürelerinin dolmasıyla engelin kalktığı varsayılır, oysa madde bu süreleri açıkça devre dışı bırakır (aklanma yanılgısı).","B":"Suç kasten işlenmiş ancak sayılan özel suçlar listesinde aranmadığı için süre sınırı yokmuş gibi değerlendirilir (kast-süre karıştırma)."},"hap":"3568 sayılı Kanun m.4/d\u0027de taksirle işlenen suçlar hiçbir zaman engel değildir; kasten işlenen suçlarda ise ya bir yıl ve üzeri hapis cezası ya da sayılan özel suçlardan (süre aranmaksızın) mahkumiyet, TCK 53 süreleri dolsa bile engel oluşturur.","teshis":{"C":{"gercek":"Madde d bendinde zimmet, irtikap, rüşvet, hırsızlık, dolandırıcılık gibi suçları ayrıca sayar; bu suçlarda süre şartı aranmaz, mahkumiyetin varlığı yeter.","ayirt":"Bu suç maddede tek tek sayılan özel suçlardan mı?","paragraf":"3568 s.K. m.4/d","yanilgi":"Ceza kısa olduğu için (dört ay) engel oluşmayacağını sanıyorsun; süre eşiğini her suça uyguluyorsun."},"E":{"gercek":"Madde 4/e, ceza veya disiplin soruşturması sonucu memuriyetten çıkarılmayı ayrı ve bağımsız bir engel olarak düzenler.","ayirt":"Bu durum ceza mahkumiyeti mi yoksa disiplinle memuriyetten çıkarılma mı, hangi bent uygulanır?","paragraf":"3568 s.K. m.4/e","yanilgi":"Genel şartların yalnız ceza mahkumiyetiyle ilgili olduğunu, disiplinin ayrı bir konu olmadığını sanıyorsun."},"A":{"gercek":"3568 sayılı Kanun m.4/d yalnız kasten işlenen suçları düzenler; taksirle işlenen suçlar bu bendin kapsamı dışındadır.","ayirt":"Suç kasten mi yoksa taksirle mi işlenmiş, önce buna bakıyor muyum?","paragraf":"3568 s.K. m.4/d","yanilgi":"Hapis cezası gördüyse süresi ne olursa olsun bu kişinin meslek mensubu olamayacağını sanıyorsun."},"D":{"gercek":"Madde açıkça \u0027süreler geçmiş olsa bile\u0027 ibaresiyle bu sürelerin engeli kaldırmayacağını belirtir.","ayirt":"Madde metninde süreler geçse bile ibaresi var mı, kontrol ettim mi?","paragraf":"3568 s.K. m.4/d","yanilgi":"TCK 53\u0027teki infaz sürelerinin dolmasıyla mahkumiyetin etkisinin sona erdiğini düşünüyorsun."},"B":{"gercek":"Sayılmayan kasti suçlarda genel eşik \u0027bir yıl veya daha fazla hapis\u0027tir; bir yıl altı ay bu eşiği aşar ve engel doğurur.","ayirt":"Bu suç sayılan özel suçlardan mı, değilse süresi bir yılı geçiyor mu?","paragraf":"3568 s.K. m.4/d","yanilgi":"Sayılan özel suçlardan olmayan bir kasti suçta süre sınırının önemsiz olduğunu düşünüyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 85"},"kural":"Madde 4 yalnız vatandaşlık, ehliyet, kamu hakları, mahkûmiyet, memuriyetten çıkarılmamış olma ve meslek şeref-haysiyetini sayar; öğrenim durumu kanunda ayrı başlıkla düzenlenmiş \u0027serbest muhasebeci mali müşavir olabilmenin özel şartları\u0027 kapsamındadır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 85","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 4\u0027ü sayarken zihninde altı bent tut; öğrenim/staj gibi mesleğe giriş şartları hep \u0027özel şartlar\u0027 başlığına aittir, genel şartlarla karıştırma.","konu":"smmm olma şartları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Madde numarası","4","-"],["HESAP","-","-"],["A) Kamu haklarından mahrum bulunmamak","3568 s.K. m.4/c","doğru ifade"],["B) Türk Ceza Kanununun 53 üncü maddesinde belirtilen sürele…","3568 s.K. m.4/d","doğru ifade"],["C) İlgili öğrenim dallarından lisans düzeyinde mezun olmuş …","3568 s.K. m.4; m.5 başlığı (özel şartlar)","YANLIŞ ifade"],["D) Ceza veya disiplin soruşturması sonucunda memuriyetten ç…","3568 s.K. m.4/e","doğru ifade"],["E) Meslek şeref ve haysiyetine uymayan durumları bulunmamak","3568 s.K. m.4/f","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İlgili öğrenim dallarından lisans düzeyinde mezun olmuş bulunmak","E":"Meslek şeref ve haysiyetine uymayan durumları bulunmamak","A":"Kamu haklarından mahrum bulunmamak","D":"Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmamış olmak","B":"Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile kasten işlenen belirli suçlardan mahkûm olmamak"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"},{"ad":"SMMM K. (3568 s.K.) m.5","metin":"Madde 5 – A) Serbest muhasebeci mali müşavir olabilmek için aşağıdaki özel şartlar aranır. a) Hukuk, iktisat, maliye, işletme, muhasebe, bankacılık, kamu yönetimi ve siyasal bilimler dallarında eğitim veren fakülte ve yüksekokullardan veya denkliği Yükseköğretim Kurumunca tasdik edilmiş yabancı yükseköğretim kurumlarından en az lisans seviyesinde mezun olmak veya diğer öğretim kurumlarından lisans seviyesinde mezun olmakla beraber bu fıkrada belirtilen bilim dallarından lisanüstü seviyesinde diploma almış olmak. b) (Değişik: 10/7/2008-5786/3 md.) En az üç yıl staj yapmış olmak. c) Serbest muhasebeci mali müşavirlik sınavını kazanmış olmak. (Değişik ikinci paragraf: 10/7/2008-5786/3 md.) Kanunları uyarınca vergi inceleme yetkisini almış ve mesleki yeterlilik sınavında başarılı olduktan sonra yeminli mali müşavirlik sınavını vermiş olanlarda, serbest muhasebeci mali müşavirlik sınavını kazanmış olma şartı aranmaz. d) Serbest muhasebeci mali müşavirlik ruhsatını almış olmak. B) (Mülga: 10/7/2008-5786/3 md.) Staj ve staj süresinden sayılan hizmetler5"}],"hakem":"Kaynak metinde Madde 4 genel şartları (vatandaşlık, ehliyetli olmak, kamu haklarından mahrum olmamak, mahkûmiyet, memuriyetten çıkarılmamış olmak, meslek şeref-haysiyeti) açıkça listeler; Madde 5 başlığında \u0027Özel şartlar\u0027 olarak lisans düzeyinde mezuniyet ayrıca düzenlenmiştir."},"kayitlar":[],"sade":{"siklar":{"D":"Ceza veya disiplin soruşturması sonucu memuriyetten çıkarılmamış olmak kanunun 4. maddesinin (e) bendinde doğrudan genel şart olarak yer almıştır.","E":"Meslek şeref ve haysiyetine uymayan durumların bulunmaması kanunun 4. maddesinin (f) bendinde genel şart olarak belirtilendir.","A":"Kamu haklarından mahrum bulunmamak doğrudan kanunun 4. maddesinin (c) bendinde genel şart olarak sayılmıştır, bu sebeple yanlış cevap değildir.","B":"Türk Ceza Kanununun 53. maddesindeki süreler geçmiş olsa bile belirli suçlardan mahkûm olmamak kanunun 4. maddesinin (d) bendinde açıkça genel şart olarak yazılıdır."},"dogru":"Lisans mezuniyeti genel şart değil, özel şarttır. Kanun genel şartları vatandaşlık, ehliyetlilik, kamu hakları, mahkûmiyet, memuriyetten çıkarılmamış olma ve meslek şeref-haysiyeti ile sınırladığından, eğitim durumu başka bir madde altında düzenlenmiştir.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 4. madde.","kavramlar":[{"kaynak":"SMMM K. 4. madde","tanim":"Serbest muhasebeci mali müşavir veya yeminli mali müşavir olmak isteyen kişilerin mutlaka taşıması gereken temel koşullar; vatandaşlık, ehliyetlilik, kamu hakları, mahkûmiyet, memuriyetten çıkarılmamış olma ve meslek şeref-haysiyeti gibi niteliklerdir.","ad":"Meslek mensubu olabilmenin genel şartları"},{"kaynak":"SMMM K. 5. madde","tanim":"Genel şartları sağlayanların serbest muhasebeci mali müşavir olabilmek için yerine getirmesi gereken ek koşullar; belirli bölümlerde lisans mezuniyeti, en az üç yıl staj, sınav başarısı ve ruhsat almaktır.","ad":"Meslek mensubu olabilmenin özel şartları"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi, 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununun 4 üncü maddesinde sayılan meslek mensubu olabilmenin genel şartlarından biri değildir?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-17","verilenler":[{"deger":"4","anlam":"Meslek mensubu olabilmenin genel şartlarının yer aldığı kanun maddesinin numarası.","ad":"Madde numarası"}],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.4 (genel şartlar); m.5 başlığı (özel şartlar)","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Sivas\u0027ta bir büroda stajyer Elif, 2019\u0027da hukuk fakültesinden mezun olmuş, sonra 3 yıl staj yapmış, dosyasını odaya teslim ediyor.","anlatim":"Oda görevlisi dosyayı m.4\u0027e göre kontrol ediyor: vatandaşlık, ehliyet, kamu hakları, mahkûmiyet, memuriyet, haysiyet var mı diye bakıyor. Elif\u0027in lisans diploması ayrı bir yerde, m.5\u0027te kontrol edilecek.","doldur":[]},{"formul":"Ne yapacağız: Oda görevlisi elindeki beş maddeyi m.4\u0027ün altı bendiyle (a-f) tek tek karşılaştıracak; öğrenim şartı bu bentlerde yok.","anlatim":"Kural şu: m.4 sadece vatandaşlık, ehliyet, kamu hakları, TCK m.53 mahkûmiyeti, memuriyetten çıkarılmama ve haysiyeti sayar. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"3568 s.K. m.4/c","karar":"doğru","anlatim":"Görevlisi dosyaya bakıp bu maddeyi arıyor ve buluyor. m.4/c bunu doğrudan genel şart sayar. Yani bu ifade doğru, madde 4\u0027te var.","formul":"Şık A: Oda görevlisi \u0027Elif\u0027in kamu haklarından mahrum olmaması gerekir\u0027 diyor, bu bir genel şart mı?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"3568 s.K. m.4/d","karar":"doğru","anlatim":"Evet, tam olarak m.4/d bu cümleyi kelimesi kelimesine söyler. Zimmet, rüşvet, dolandırıcılık gibi suçlar sayılır. Bu ifade doğru, madde 4\u0027te var.","formul":"Şık B: Görevli \u0027TCK m.53\u0027teki süreler geçse bile belirli suçlardan mahkûm olmamalı\u0027 diyor, bu m.4\u0027te mi?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"3568 s.K. m.4; m.5 başlığı (özel şartlar)","karar":"yanlış","anlatim":"Görevli dosyayı çevirip bakıyor, m.4\u0027te öğrenimden hiç bahis yok. Diploma şartı m.5\u0027teki özel şartlar başlığındadır, m.4\u0027te değil. Bu ifade yanlış, madde 4\u0027e ait değil.","formul":"Şık C: Görevli \u0027ilgili öğrenim dalından lisans mezunu olmalı\u0027 diyor, bunu m.4\u0027e mi yazacak?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"3568 s.K. m.4/e","karar":"doğru","anlatim":"Evet, m.4/e bunu birebir söyler. Elif memur olmamış ama şart yine de listede duruyor. Bu ifade doğru, madde 4\u0027te var.","formul":"Şık D: Görevli \u0027ceza veya disiplin soruşturmasıyla memuriyetten çıkarılmamış olmalı\u0027 diyor, m.4\u0027te mi?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"3568 s.K. m.4/f","karar":"doğru","anlatim":"Görevli son bendi okuyor, m.4/f tam bunu söylüyor. Ahlaki görünse de kanun metninde açık bir bent. Bu ifade doğru, madde 4\u0027te var.","formul":"Şık E: Görevli \u0027meslek şeref ve haysiyetine uymayan hali olmamalı\u0027 diyor, bu bent var mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Elif\u0027in dosyasında öğrenim şartı m.4\u0027te değil m.5\u0027tedir, bu yüzden C cevap. Kendine hep şunu sor: bu şart \u0027genel şartlar\u0027 maddesinde mi yazıyor yoksa \u0027özel şartlar\u0027 başlığında mı?","doldur":[]}],"anahtar":[{"ornek":"şartlar","kok":"şartla"},{"ornek":"memuriyet","kok":"memuri"},{"ornek":"hakları","kok":"haklar"},{"ornek":"öğrenim","kok":"öğreni"},{"ornek":"ehliyet","kok":"ehliye"},{"ornek":"görevlisi","kok":"görevl"}],"konuGiris":{"harita":"Ne zaman test edilir: mesleğe kabul başvurusu değerlendirilirken. Nasıl ölçülür: adayın taşıdığı nitelikler, kanunda sayılan şartlar listesiyle tek tek karşılaştırılarak. Nasıl kaydedilir: uygun bulunan adaylar meslek siciline ve odaya kaydedilir.","desen":"Soru, genel şartlar listesine özel şartlardan birini (örneğin sınavı kazanmak, staj yapmak veya ruhsat almak) karıştırıp \u0027bu genel şart değildir\u0027 sorusunu ters çevirerek sorar. Doğru cevap her zaman özel şartlar arasından seçilir, çünkü soru genel şart olmayanı ister. Bu soru genel ve özel şartların ayrı maddelerde düzenlenmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"herkesten aranan, mesleğe özgü olmayan temel nitelikler","ad":"genel şart","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"belirli mesleğe girmek için ayrıca aranan ek nitelikler","ad":"özel şart","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"mesleğe kabulden önce uygulamalı olarak geçirilen zorunlu süre","ad":"staj","kim":"meslek kuruluşu düzenler"},{"kaynak":"soruda verilir","tanim":"tüm şartlar tamamlandıktan sonra verilen mesleği yapma izni","ad":"ruhsat","kim":"meslek kuruluşu düzenler"}],"sinavda":"Seçeneklerden biri hariç hepsinin genel şart olduğu, birinin ise özel şart olduğu bir liste verilir ve genel şart olmayan istenir.","panel_ornek":"Bir spor kulübüne üye olmak için önce herkesten istenen şartlar vardır: reşit olmak, sabıka kaydı temiz olmak gibi. Sonra kulübün branşa özel şartları gelir: yüzme bilmek, sağlık raporu almak gibi. Genel şart listesine \u0027yüzme bilmek\u0027 yazarsan bu bir tuzaktır, çünkü o branşa özel bir şarttır.","ornek":"Bir spor kulübüne üye olmak için önce herkesten istenen şartlar vardır: reşit olmak, sabıka kaydı temiz olmak gibi. Sonra kulübün branşa özel şartları gelir: yüzme bilmek, sağlık raporu almak gibi. Genel şart listesine \u0027yüzme bilmek\u0027 yazarsan bu bir tuzaktır, çünkü o branşa özel bir şarttır.","yontemler":"Vatandaşlık, medeni hakları kullanma, kamu haklarından mahrum olmama, belirli suçlardan mahkûm olmama ve meslek onuruna aykırı hal bulunmaması genel şarttır; eğitim, staj, sınav ve ruhsat ise özel şarttır. Seçenekte \u0027sınav\u0027, \u0027staj\u0027 veya \u0027ruhsat\u0027 görürsen bu genel şart değil özel şarttır.","nedir":"Bu konu, bir mesleğe girişte aranan genel şartlarla mesleğe özgü özel şartların birbirinden ayrılmasını anlatır. Sınav, hangi şartın \u0027genel\u0027 hangi şartın \u0027mesleğe özel\u0027 kategoriye girdiğini karıştırıp karıştırmadığını ölçer."},"olay":"","tuzak":{"D":{"ad":"Kural","metin":"Madde 4/(e) bendi ceza veya disiplin soruşturması sonucu memuriyetten çıkarılmamış olmayı genel şart sayar. İfade kaynaktaki bentle aynı olduğundan genel şarttır, aykırılık taşımaz."},"E":{"ad":"Kural","metin":"Madde 4/(f) bendi meslek şeref ve haysiyetine uymayan durumların bulunmamasını genel şart olarak düzenler. Bu ifade de kaynakla örtüştüğünden doğru bir genel şarttır."},"A":{"ad":"Kural","metin":"3568 sayılı Kanunun 4 üncü maddesinin (c) bendi kamu haklarından mahrum bulunmamayı genel şart olarak sayar. Bu bent kaynakta aynen yer aldığından ifade genel şartlardandır, soruda aranan aykırı ifade bu değildir."},"B":{"ad":"Kural","metin":"Aynı maddenin (d) bendi, Türk Ceza Kanununun 53 üncü maddesindeki süreler geçmiş olsa bile sayılan suçlardan mahkûmiyet bulunmamasını genel şart olarak düzenler. İfade kaynakla birebir örtüştüğünden genel şarttır."}},"celdiriciYol":{},"hap":"3568 sayılı Kanunun 4 üncü maddesindeki genel şartlar vatandaşlık, ehliyet, kamu hakları, mahkûmiyet, memuriyet ve haysiyet bentlerinden ibarettir; öğrenim şartı bu maddede değil özel şartlar düzenlemesinde yer alır.","teshis":{"C":{"gercek":"Kanun, öğrenim şartını m.4\u0027te değil ayrı başlıklı \u0027özel şartlar\u0027 düzenlemesinde ele alır; m.4 yalnız vatandaşlık, ehliyet, kamu hakları, mahkûmiyet, memuriyet ve haysiyet bentlerinden oluşur.","ayirt":"Bu şart kanunun \u0027genel şartlar\u0027 başlıklı maddesinde mi yazıyor, yoksa \u0027özel şartlar\u0027 başlığı altında mı?","paragraf":"3568 s.K. m.4; m.5 başlığı (özel şartlar)","yanilgi":"SMMM olmak için lisans mezuniyetinin de m.4\u0027teki genel şartlardan biri olduğunu sanıyorsun çünkü mesleğe girişte öğrenim şartı aklına ilk gelen unsur."},"E":{"gercek":"3568 sayılı Kanun m.4/f bunu doğrudan bir bent olarak genel şartlar arasında sayar.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi, yoksa maddede hiç geçmeyen bir konu mu?","paragraf":"3568 s.K. m.4/f","yanilgi":"Meslek şeref ve haysiyetine ilişkin ifadenin soyut bir ahlak kuralı olup kanun maddesinde yer almadığını sanıyorsun."},"A":{"gercek":"3568 sayılı Kanun m.4/c bunu doğrudan genel şart olarak sayar.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi, yoksa maddede hiç geçmeyen bir konu mu?","paragraf":"3568 s.K. m.4/c","yanilgi":"Kamu haklarından mahrumiyetin ayrı, istisnai bir hal olduğunu ve genel şartlar listesinde geçmediğini sanıyorsun."},"D":{"gercek":"3568 sayılı Kanun m.4/e bunu açıkça genel şart olarak düzenler.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi, yoksa maddede hiç geçmeyen bir konu mu?","paragraf":"3568 s.K. m.4/e","yanilgi":"Memuriyetten çıkarılmamış olma şartının disiplin hukukuna özgü olup genel şartlar arasında sayılmadığını düşünüyorsun."},"B":{"gercek":"3568 sayılı Kanun m.4/d, TCK m.53\u0027teki sürelere ve sayılan suçlara açıkça atıf yapan genel şarttır.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi, yoksa maddede hiç geçmeyen bir konu mu?","paragraf":"3568 s.K. m.4/d","yanilgi":"Türk Ceza Kanununa atfın yalnız disiplin mevzuatına ait olduğunu, genel şart olmadığını düşünüyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 85"},"kural":"Madde 4/d fıkrası kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına mahkûmiyeti şart olarak öngörür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 85","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Genel şart sorularında madde 4\u0027teki sayısal eşikleri (bir yıl gibi) mutlaka kontrol et; kanun metninde geçmeyen bir rakam görürsen o şık yanlıştır.","konu":"smmm olma şartları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Kanunun maddesi","4","-"],["HESAP","-","-"],["A) Türkiye Cumhuriyeti vatandaşı olmak (yabancı serbest muh…","m.4/a","doğru ifade"],["B) Medeni hakları kullanma ehliyetine sahip bulunmak","m.4/b","doğru ifade"],["C) Ceza veya disiplin soruşturması sonucunda memuriyetten ç…","m.4/e","doğru ifade"],["D) Kasten işlenen bir suçtan dolayı beş yıl veya daha fazla…","m.4/d","YANLIŞ ifade"],["E) Meslek şeref ve haysiyetine uymayan durumları bulunmamak","m.4/f","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak","E":"Meslek şeref ve haysiyetine uymayan durumları bulunmamak","A":"Türkiye Cumhuriyeti vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır)","D":"Kasten işlenen bir suçtan dolayı beş yıl veya daha fazla süreyle hapis cezasına mahkûm olmamak","B":"Medeni hakları kullanma ehliyetine sahip bulunmak"},"kaynak":{"alinti":"bir yıl veya daha fazla süreyle hapis cezası","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"},{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"}],"hakem":"Kaynak metinde Madde 4/d fıkrasında açıkça \u0027bir yıl veya daha fazla süreyle hapis cezası\u0027 şartı yazılı olup, şıkta \u0027beş yıl\u0027 olarak değiştirilmesi nedeniyle ifade yanlıştır ve doğru cevaptır."},"kayitlar":[],"sade":{"siklar":{"C":"Ceza veya disiplin soruşturması sonucu memuriyetten çıkarılmamış olmak, meslek mensubu olmanın genel şartlarından biri olarak kanunda sayılmıştır; bu doğru bir ifadedir.","E":"Meslek şeref ve haysiyetine uymayan durumlar bulunmamak, meslek mensubu olmanın genel şartlarından biri olarak kanunda açıkça yer almaktadır; bu doğru bir ifadedir.","A":"Türkiye Cumhuriyeti vatandaşı olmak şartı kanunda bu ifadeyle yer almaktadır ve yabancılara ilişkin istisna ayrıca saklı tutulmuştur; bu doğru bir ifadedir.","D":"Kanun kasten işlenen bir suçtan dolayı bir yıl veya daha fazla hapis cezasını şart koşarken, şık beş yıl diyerek hükümü yanlış aktarmaktadır.","B":"Medeni hakları kullanma ehliyetine sahip olmak meslek mensubu olmanın genel şartlarından biri olarak kanunda açıkça düzenlenmiştir; bu doğru bir ifadedir."},"dogru":"Kanun kasten işlenen suçtan dolayı bir yıl hapis cezasını şart koşar, ancak soru beş yıl demiştir. Bu yüzden D şıkkı kanunu yanlış anlatmaktadır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 4. madde","kavramlar":[]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununun 4 üncü maddesinde düzenlenen meslek mensubu olmanın genel şartlarından biri, aşağıdakilerden hangisinde doğru olarak ifade edilmemiştir?","kayitBaslik":"","id":"sgs-t1-meslek-kolay/kp-17","verilenler":[{"deger":"4","anlam":"Meslek mensubu olmanın genel şartlarının yer aldığı kanun maddesinin numarası; sorunun konusu bu maddede düzenlenmektedir.","ad":"Kanunun maddesi"}],"dayanak":"3568 sayılı SMMM Kanunu m.4","dogru":"D","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ahmet, bir denetim şirketinde meslek mensubu olmak için başvuru yapıyor; dosyasında 8 yıl önce kasten işlediği bir dolandırıcılık suçundan 2 yıl hapis cezası kaydı çıkıyor.","anlatim":"Şirketin İK sorumlusu Ahmet\u0027in dosyasını 3568 sayılı Kanunun 4 üncü maddesindeki genel şartlara göre inceliyor. Beş farklı ifadeyi bu dosyaya uygulayacağız.","doldur":[]},{"formul":"","anlatim":"","doldur":[]},{"formul":"Ne yapacağız: Madde 4\u0027teki altı bendi (a-f) Ahmet\u0027in dosyasındaki 2 yıllık mahkumiyetle ve diğer bilgilerle tek tek karşılaştıracağız.","anlatim":"Her şık bu genel şartlardan birini anlatıyor gibi görünüyor ama biri rakamı ya da kapsamı bozmuş olabilir. Beş ifadeyi Ahmet\u0027in dosyasında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.4/a","karar":"doğru","anlatim":"Ahmet\u0027in vatandaşlığı sorgulanmıyor, kanun bunu zaten a bendinde genel şart olarak koymuş. Yabancı SMMM\u0027lere ilişkin saklı hüküm bu genel kuralı bozmaz.","formul":"Şık A: İK sorumlusu \u0027Ahmet T.C. vatandaşı, bu şart tamam\u0027 diyor, vatandaşlık şartını genel şart sayar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.4/b","karar":"doğru","anlatim":"Kanun bu ehliyeti bizzat b bendinde genel şart olarak sayıyor. Ahmet\u0027in dosyasında bu konuda engel yok, şart doğru tanımlanmış.","formul":"Şık B: İK sorumlusu \u0027Ahmet\u0027in medeni hakları kullanma ehliyeti var mı?\u0027 diye soruyor, bunu şart sayar mısın?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.4/e","karar":"doğru","anlatim":"Madde e bendi ceza veya disiplin soruşturması sonucu memuriyetten çıkarılmamış olmayı genel şart sayar. Ahmet\u0027in dosyasında böyle bir kayıt yok, ifade doğru.","formul":"Şık C: İK sorumlusu \u0027Ahmet daha önce memuriyetten çıkarılmış mı?\u0027 diye kontrol ediyor, bu şartı doğru mu ifade etmiş?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.4/d","karar":"yanlış","anlatim":"Madde d bendindeki eşik beş yıl değil, bir yıl veya daha fazla hapis cezasıdır. Ahmet\u0027in 2 yılı bu eşiği aştığı için ifade yanlış kurulmuş, kanun beş yıl demiyor.","formul":"Şık D: İK sorumlusu \u0027Ahmet\u0027in cezası 2 yıl, kanun beş yıl ve üstünü yasaklıyor, o zaman sorun yok\u0027 diyor, buna katılır mısın?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.4/f","karar":"doğru","anlatim":"Madde f bendi bu durumu açıkça genel şart olarak sayıyor. İfade kanundaki haliyle birebir örtüşüyor, doğru.","formul":"Şık E: İK sorumlusu \u0027Ahmet\u0027in meslek şeref ve haysiyetine aykırı bir durumu var mı?\u0027 diye soruyor, bunu genel şart sayar mısın?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"D şıkkı kanundaki bir yıllık eşiği beş yıla çıkararak metni bozmuş, doğru cevap D. Kendine hep şunu sor: şıktaki sayı, kanun metnindeki sayıyla birebir aynı mı?","doldur":[]}],"anahtar":[{"ornek":"dosyasını","kok":"dosyas"},{"ornek":"cezasıdır","kok":"cezası"},{"ornek":"bendinde","kok":"bendin"},{"ornek":"sayılı","kok":"sayılı"},{"ornek":"birebir","kok":"birebi"},{"ornek":"maddesindeki","kok":"maddes"}],"konuGiris":{"harita":"Ne zaman test edilir: meslek mensubu olma başvurusu sırasında genel şartların tam sağlanıp sağlanmadığı incelenir. Nasıl ölçülür: madde metnindeki altı bendin (a-f) her birinin doğru ve eksiksiz sayılıp sayılmadığına bakılır. Nasıl kaydedilir: hatalı/eksik yazılan şart, sınavda \u0027doğru ifade edilmemiştir\u0027 seçeneği olarak sunulur.","desen":"Soru, madde 4\u0027teki altı bendi (a-f) tek tek şıklara dağıtıp birini kasıtlı olarak eksik/yanlış özetler; tuzak genellikle \u0027bir yıldan az\u0027 veya \u0027her suç\u0027 gibi kapsam değiştiren ifadelerdir. Adayın kanun metnindeki tam ifadeyle şık metnini kelime kelime karşılaştırması beklenir. Bu soru m.4 (a-f) bentlerinin doğru aktarılıp aktarılmadığı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubu olmak için Türk vatandaşı olma zorunluluğu, yabancı YMM hükmü saklı","ad":"T.C. vatandaşlığı şartı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin siyasi/medeni kamu haklarını kullanabilir durumda olması şartı","ad":"Kamu haklarından mahrum olmama","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Zimmet, rüşvet, dolandırıcılık gibi suçlardan bir yıl+ hapisle mahkûm olmama şartı","ad":"Belirli suçlardan mahkûmiyet yasağı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin mesleğin onuruna aykırı davranış/durumunun bulunmaması şartı","ad":"Meslek şeref ve haysiyetine uygunluk","kim":"meslek kuruluşu düzenler"}],"sinavda":"Beş şıkta genel şartlardan biri verilir ve hangisinin kanun metnine aykırı yazıldığı sorulur.","panel_ornek":"Bir spor kulübüne üye olmak istediğinde önce yaş, sabıka kaydı ve aidat gibi genel şartları sağlaman istenir; sadece 2 şartı tutturup diğerini atlarsan üyelik kabul edilmez. Mesela 18 yaşında ve temiz sicilli olman gerekir, üçüncü şart olan referans mektubunu unutursan başvurun geçersiz sayılır.","ornek":"Bir spor kulübüne üye olmak istediğinde önce yaş, sabıka kaydı ve aidat gibi genel şartları sağlaman istenir; sadece 2 şartı tutturup diğerini atlarsan üyelik kabul edilmez. Mesela 18 yaşında ve temiz sicilli olman gerekir, üçüncü şart olan referans mektubunu unutursan başvurun geçersiz sayılır.","yontemler":"Her şıkkı madde 4\u0027ün a-f bentleriyle tek tek eşleştirip fark olan kelimeyi bulmak en kritik yöntemdir.","nedir":"Bu konu, SMMM/YMM mesleğine kabul için aranan genel şartları düzenler. Sınav, hangi ifadenin kanun metnine aykırı/eksik yazıldığını ayırt etmenizi ölçer."},"olay":"Şıkta geçen eşik bir yıl yerine beş yıl olarak değiştirilmiştir.","tuzak":{"C":{"ad":"Disiplin Karıştırma Tuzağı","metin":"Memuriyetten çıkarılmama şartını meslek disiplin cezalarına ilişkin ayrı bir düzenleme sanıp genel şartlar arasında görmezsin. Doğrusu: Madde 4/e fıkrası ceza veya disiplin soruşturması sonucu memuriyetten çıkarılmamış olmayı genel şart olarak sayar."},"E":{"ad":"Ölçüt Belirsizliği Tuzağı","metin":"Meslek şeref ve haysiyetine uymayan durum kavramını somut bir hukuki ölçüt olmadığı için kanun metninde yer almadığını düşünürsün. Doğrusu: Madde 4/f fıkrası bu şartı meslek mensubu olmanın genel şartlarından biri olarak açıkça sayar."},"A":{"ad":"Vatandaşlık İstisnası Tuzağı","metin":"Yabancı serbest muhasebeci mali müşavirlere ilişkin hükmün saklı tutulmasını, bu bendin genel şart olmaktan çıktığı şeklinde yorumlarsın. Doğrusu: Madde 4/a fıkrası Türkiye Cumhuriyeti vatandaşı olma şartını aynen bu ifadeyle koyar, istisna hükmü ayrıca saklı tutulur."},"B":{"ad":"Kanun Karıştırma Tuzağı","metin":"Medeni hakları kullanma ehliyetini yalnızca Türk Medeni Kanununun konusu sayıp 3568 sayılı Kanunda düzenlenmediğini sanırsın. Doğrusu: Madde 4/b fıkrası bu şartı meslek mensubu olmanın genel şartlarından biri olarak bizzat sayar."}},"celdiriciYol":null,"hap":"3568 sayılı Kanunun 4 üncü maddesindeki mahkumiyet engeli kasten işlenen suçtan bir yıl veya daha fazla hapis cezasıdır, beş yıl değildir.","teshis":{"C":{"gercek":"Madde 4/e fıkrası ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmamış olmayı genel şart olarak açıkça sayar.","ayirt":"Bu şart meslek mensubu OLMANIN önkoşulu mu, yoksa meslekteyken uygulanan bir ceza mı?","paragraf":"3568 s.K. m.4/e","yanilgi":"Memuriyetten çıkarılmama şartını meslek disiplin cezalarına özgü ayrı bir düzenleme sanıp genel şartlardan saymıyorsun."},"E":{"gercek":"Madde 4/f fıkrası bu durumu meslek mensubu olmanın genel şartlarından biri olarak açıkça sayar.","ayirt":"Kavramın soyut görünmesi, kanunda bir şart olarak sayılmadığı anlamına mı gelir?","paragraf":"3568 s.K. m.4/f","yanilgi":"Meslek şeref ve haysiyeti kavramını somut bir hukuki kriter olmadığı için kanunda ayrıca düzenlenmediğini varsayıyorsun."},"A":{"gercek":"Madde 4/a fıkrası vatandaşlık şartını genel şart olarak koyar; ayrıca yabancılar hakkındaki özel hükmün saklı tutulması bu genel kuralı ortadan kaldırmaz.","ayirt":"İstisna hükmünün varlığı, asıl kuralın genel şart olmaktan çıktığı anlamına mı gelir?","paragraf":"3568 s.K. m.4/a","yanilgi":"Yabancı SMMM\u0027lere ilişkin saklı tutma hükmünü görünce vatandaşlık şartının istisnalı olduğunu, dolayısıyla genel şart sayılamayacağını düşünüyorsun."},"D":{"gercek":"Madde 4/d fıkrası eşiği bir yıl veya daha fazla hapis cezası olarak belirler; beş yıllık bir eşik kanunda yer almaz.","ayirt":"Şıktaki sayı, kanun metnindeki sayıyla birebir aynı mı?","paragraf":"3568 s.K. m.4/d","yanilgi":"Mahkumiyet şartının varlığını doğru bulup eşik süresini kontrol etmeden bu ifadeyi olduğu gibi kabul ediyorsun."},"B":{"gercek":"Madde 4/b fıkrası bu ehliyeti meslek mensubu olmanın genel şartlarından biri olarak bizzat düzenler.","ayirt":"Bir kavramın başka bir kanunda da tanımlanması, bu kanunda şart olarak sayılmadığı anlamına mı gelir?","paragraf":"3568 s.K. m.4/b","yanilgi":"Medeni hakları kullanma ehliyetinin yalnızca Türk Medeni Kanununda düzenlendiğini, 3568 sayılı Kanunda ayrıca sayılmadığını sanıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 105"},"kural":"Madde 2/B\u0027ye göre yeminli mali müşavirlik, (A) fıkrasının (b) ve (c) bentlerindeki işlerle birlikte tasdik işlerini kapsar; Madde 3\u0027e göre yetkisiz unvan kullanımı yasaktır ve odalar bunu öğrendiğinde Cumhuriyet Savcılığına bildirmek zorundadır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 105","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Roman numaralı kombinasyon sorularında önce hangi bendin hangi meslek grubuna ait olduğunu ayır, sonra ters çevrilmiş cümleleri tek tek ele.","konu":"yeminli mali müşavirlik sinavi","tablo":{"satirlar":[["A) I ve II","m.2/B","doğru ifade"],["B) I ve III","m.2/B","YANLIŞ ifade"],["C) II ve IV","m.3","doğru ifade"],["D) III ve V","m.2/A","YANLIŞ ifade"],["E) IV ve V","m.2/B","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"II ve IV","E":"IV ve V","A":"I ve II","D":"III ve V","B":"I ve III"},"kaynak":{"alinti":"de yeminli mali müşavirliğin (A) fıkrasının (b) ve (c) bentleriyle tasdik işlerini kapsaması ve Madde 3","liste":[{"ad":"SMMM K. (3568 s.K.) m.3","metin":"Madde 3 – Kanunen kullanmaya yetkisi olmayanlar tarafından (…)3 , serbest muhasebeci mali müşavir, yeminli mali müşavir unvanlarının veya bu unvan veya kavramlara karışacak veya onlara benzer her türlü unvan, ibare veya remizlerin kullanılması yasaktır. Odalar, yukarıdaki fıkraya aykırı davranışları öğrendiklerinde Cumhuriyet Savcılığına bildirmek mecburiyetindedirler. Cumhuriyet Savcılığınca tahkikatın sonucu, odaya ve ilgililere bildirilir. Genel şartlar"},{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"}],"hakem":"Doğru sık I ve III, Madde 2/B\u0027de yeminli mali müşavirliğin (A) fıkrasının (b) ve (c) bentleriyle tasdik işlerini kapsaması ve Madde 3\u0027de yetkisiz unvan kullanım yasağı ile odaların Cumhuriyet Savcılığına bildirme yükümlülüğü açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"IV ifadesi serbest muhasebeci mali müşavirliği yalnızca defter tutma ve beyannameyle sınırlar; oysa kanun müşavirlik ve inceleme-tasdik işlerini de kapsamına alır. II de yanlış olduğundan C yanlıştır.","E":"IV serbest muhasebeci mali müşavirliğin kapsamını daraltan yanlış bir iddiaysa, V yeminli mali müşavirlerin yasağı ihlal eden işi yapabileceğini söyler. Her iki ifade de kanuna aykırıdır, E yanlıştır.","D":"V ifadesi yeminli mali müşavirlerin (A) fıkrasının (a) bendindeki defter tutma işini yapabileceğini iddia eder; kanun bunun tam tersini söyler ve yalnızca (b), (c) bentleri ile tasdik işine izin verir. III doğru olsa da V yanlışlığından dolayı D yanlıştır.","A":"II ifadesi yeminli mali müşavirlerin muhasebe defterleri tutabileceğini öne sürer; oysa kanun bunları açıkça yapamazlar diye belirtir. I doğru olsa da II yanlışlığından dolayı A yanlıştır."},"dogru":"Yeminli mali müşavirler (A) fıkrasının (b) ve (c) bentlerindeki işleri tasdik işleriyle birlikte yaparlar; defter tutamazlar. Yetkisi olmayanlarca benzer unvan kullanılması yasaktır ve odalar bunu savcılığa bildirmelidir. I ve III doğrudur.","sinav":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunun 2. madde B fıkrası ve 3. maddesi.","kavramlar":[{"kaynak":"SMMM K. 2. madde","tanim":"(A) fıkrasının (b) ve (c) bentlerinde yazılı işleri yapmakla beraber tasdik işlerini de yapmaktır. Yeminli mali müşavirler muhasebe ile ilgili defter tutamazlar ve muhasebe bürosu açamazlar.","ad":"Yeminli mali müşavirlik mesleğinin konusu"},{"kaynak":"SMMM K. 3. madde","tanim":"Kanunen yetkisi olmayan kişilerce serbest muhasebeci mali müşavir, yeminli mali müşavir unvanlarına benzer unvan, ibare veya remiz kullanılması yasaktır.","ad":"Unvan kullanım yasağı"},{"kaynak":"SMMM K. 3. madde","tanim":"Serbest muhasebeci mali müşavir ve yeminli mali müşavir odaları, unvan kullanım yasağına aykırı davranışları öğrendiklerinde Cumhuriyet Savcılığına bildirmek zorundadırlar.","ad":"Odaların bildirme mecburiyeti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":null,
