linde, tasdikin kapsamı ile sınırlı olmak üzere, ziyaa uğratılan vergilerden ve kesilecek cezalardan mükellefle birlikte müştereken ve müteselsilen sorumlu olurlar. Yeminli mali müşavirler yaptıkları tasdikin kapsamını düzenleyecekleri raporda açıkca belirtirler. (Ek fıkra: 10/9/2014-6552/107 md.) Yeminli mali müşavirlerin tasdikten doğan mali sorumlulukları ile disiplin sorumlulukları ayrı ayrı müstakil bir rapor ile tespit edilir. Bu kapsamda yeminli mali müşavir ha…"},{"ad":"SMMM K. (3568 s.K.) m.12 [2/2]","metin":"Savunma isteme yazısının tebliğ tarihinden itibaren otuz gün içinde savunma yapılmaması durumunda ilgili yeminli mali müşavir savunma hakkından vazgeçmiş sayılır. Bu Kanun hükümlerine göre meslek icra edenlerin vergi kanunları ve diğer kanunlardaki sorumlulukları saklıdır. Meslekle ilgili konularda çalıştırılmayacak olanlar"}],"hakem":"Doğru sık (C), 3568 sayılı Kanun m.12\u0027de açıkça yer alan tasdik sorumluluğu kuralına aykırıdır: sorumluluk hem kapsam bakımından sınırlı hem de mükellefle birlikte müşterek-müteselsil olup, tek başına değildir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu ile ilgili düzenlemelere göre, meslek mensuplarının özen sorumluluğu hakkında aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-09","verilenler":[],"dayanak":"SMMM K. (3568 s.K.) m.12/2; Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.6/a","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Adana\u0027da yeminli mali müşavir Kemal Bey, 2021 yılı için bir tekstil firmasının kurumlar vergisi beyannamesini tasdik ediyor. Sonradan inceleme sonucu 400.000 TL vergi ziyaı çıkıyor. Firma sahibi \u0027ben ödemem, hepsi Kemal Bey\u0027in sorunu\u0027 diyor.","anlatim":"Vergi dairesi hem firmayı hem Kemal Bey\u0027i takip ediyor. Kemal Bey ise \u0027ben sadece tasdik ettiğim kısımdan sorumluyum, hepsinden değilim\u0027 diyor.","doldur":[]},{"formul":"Ne yapacağız: Kemal Bey\u0027in özen ve tasdik sorumluluğuna dair beş ifadeyi tek tek 3568 sayılı Kanun\u0027a göre doğru mu yanlış mı diye süzeceğiz.","anlatim":"Yemin, haksız rekabet, sorumluluğun kapsamı ve sınırı, raporların ayrılığı ve kapsam belirtme zorunluluğu; hepsini bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.6/a","karar":"doğru","anlatim":"Yönetmelik bunu açıkça haksız rekabet hali sayar, yani bu ifade doğrudur. Kemal Bey\u0027in özensizliği hem disiplin hem haksız rekabet konusu olur.","formul":"Şık A: Kemal Bey mesleki özen göstermeyip standartlara aykırı çalışsa, bu haksız rekabet sayılır mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.11","karar":"doğru","anlatim":"Kanun m.11\u0027deki yemin metni \u0027üzerime aldığım işleri dikkat ve özenle yapacağıma\u0027 cümlesini içerir. Yani bu ifade doğrudur, Kemal Bey böyle yemin etmiştir.","formul":"Şık B: Kemal Bey mesleğe başlamadan önce mahkemede özenli çalışacağına dair yemin etti mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.12/2","karar":"yanlış","anlatim":"Kanun m.12/2 sorumluluğu tasdikin kapsamı ile sınırlı tutar ve firmayla birlikte müşterek-müteselsil sorumluluk kurar. Kemal Bey yanılıyor, ne tek başına ne sınırsız sorumludur; bu ifade yanlıştır.","formul":"Şık C: Kemal Bey \u0027tasdikim yanlış çıktıysa 400.000 TL\u0027nin tamamından tek başıma, sınırsız sorumluyum\u0027 derse haklı mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.12 ek fıkra","karar":"doğru","anlatim":"Kanun m.12 ek fıkra, tasdikten doğan mali sorumluluk ile disiplin sorumluluğunun ayrı ayrı müstakil birer raporla tespit edileceğini söyler. Bu ifade doğrudur.","formul":"Şık D: Kemal Bey hakkında hem mali sorumluluk raporu hem disiplin raporu ayrı ayrı mı düzenlenir?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.12/2","karar":"doğru","anlatim":"Kanun m.12/2 bunu emredici şekilde düzenler; kapsam raporda açıkça belirtilir. Bu ifade doğrudur, Kemal Bey bunu yazmak zorundadır.","formul":"Şık E: Kemal Bey tasdikinin hangi kalemleri kapsadığını raporunda açıkça yazmak zorunda mıdır?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Kemal Bey\u0027in sorumluluğu hem kapsamla sınırlı hem de mükellefle birlikte müşterek-müteselsildir, tek başına ve sınırsız değildir. Kendine hep şunu sor: kanun \u0027sınırlı\u0027 ve \u0027mükellefle birlikte\u0027 kelimelerini birlikte mi kullanmış?","doldur":[]}],"anahtar":[{"ornek":"sorumluluğu","kok":"soruml"},{"ornek":"tasdikten","kok":"tasdik"},{"ornek":"kapsamıyla","kok":"kapsam"},{"ornek":"birlikte","kok":"birlik"},{"ornek":"mükellefle","kok":"mükell"},{"ornek":"müteselsildir","kok":"mütese"}],"konuGiris":{"harita":"Ne zaman test edilir: Yeminli mali müşavirin tasdik ettiği belgenin doğru olmadığı ortaya çıktığında. Nasıl ölçülür: Tasdikin kapsamı ile sınırlı olacak şekilde sorumluluğun derecesi belirlenir. Nasıl kaydedilir: Mali sorumluluk ile disiplin sorumluluğu ayrı ayrı müstakil bir raporla tespit edilir.","desen":"Soru genellikle m.12\u0027deki sorumluluk sınırını (tasdikin kapsamı ile sınırlı) ve savunma süresini (30 gün) karıştıran şıklarla kurulur. Bir şıkta sorumluluğun sınırsız veya tamamen mükellefe ait olduğu yanlış ifadeyle verilir. Bu soru m.12 hükümlerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Mali tablo ve beyannamelerin mevzuata uygunluğunun onaylanması","ad":"tasdik","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ziyaa uğratılan vergi ve cezalardan mükellefle birlikte sorumlu olma","ad":"müşterek ve müteselsil sorumluluk","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Mali sorumluluk ile disiplin sorumluluğunun ayrı tespit edildiği belge","ad":"sorumluluk raporu","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Otuz gün içinde yazılı savunma yapılmazsa bu haktan vazgeçilmiş sayılması","ad":"savunma hakkı","kim":"kanun sabitler"}],"sinavda":"Kanun metnindeki sorumluluk ve tasdik hükümleri verilir, bunlardan hangisinin yanlış olduğu istenir.","panel_ornek":"Bir tamirci arabanı tamir ederken ihmal edip hatalı iş yaparsa, o hatadan sorumlu olur; sadece \u0027elimden geleni yaptım\u0027 demesi yetmez. 15 dakikalık bir kontrolü atlarsa, sonradan çıkan 3 numaralı arıza için de payı vardır. Yani işini üstlenen kişi, o işi gereği gibi yapmakla yükümlüdür.","ornek":"Bir tamirci arabanı tamir ederken ihmal edip hatalı iş yaparsa, o hatadan sorumlu olur; sadece \u0027elimden geleni yaptım\u0027 demesi yetmez. 15 dakikalık bir kontrolü atlarsa, sonradan çıkan 3 numaralı arıza için de payı vardır. Yani işini üstlenen kişi, o işi gereği gibi yapmakla yükümlüdür.","yontemler":"Her şıkkı m.12 metnindeki \u0027tasdikin kapsamı ile sınırlı sorumluluk\u0027 ve \u002730 gün savunma süresi\u0027 ifadeleriyle tek tek karşılaştır.","nedir":"Özen sorumluluğu, meslek mensuplarının işlerini mevzuata ve mesleki standartlara uygun titizlikle yapma yükümlülüğüdür. Sınav bu yükümlülüğün kapsamını, sınırını ve sonucunu bilip bilmediğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Rapor Ayrımı Tuzağı","metin":"Öğrenci mali sorumluluk ile disiplin sorumluluğunun tek raporda birleştirildiğini sanır. Doğrusu: 3568 sayılı Kanunun 12 nci maddesindeki ek fıkraya göre bu iki sorumluluk türü ayrı ayrı müstakil raporlarla tespit edilir, cümle doğrudur."},"E":{"ad":"Beyan Yükümlülüğü Tuzağı","metin":"Öğrenci bu belirtme yükümlülüğünün isteğe bağlı olduğunu düşünür. Doğrusu: Kanun, yeminli mali müşavirin tasdikin kapsamını raporda açıkça belirtmesini zorunlu kılar, cümle doğrudur."},"A":{"ad":"Standart Tuzağı","metin":"Bu cümle aslında kaynaktaki kuralın doğru anlatımıdır, öğrenci \u0027özen göstermeme\u0027 ifadesini görünce hemen yanlış sanır. Doğrusu: Muhasebe ve denetim standartlarına uymama ve özen göstermeme, Haksız Rekabet ve Reklam Yasağı Yönetmeliği m.6/a uyarınca haksız rekabet halidir."},"B":{"ad":"Yemin Metni Tuzağı","metin":"Öğrenci yemin metnindeki \u0027dikkat ve özenle\u0027 ifadesinin kurgu olduğunu düşünür ama bu ifade kanun metninde birebir yer alır. Doğrusu: 213 Kanunun 11 inci maddesindeki yemin metninde bu ibare aynen geçer, cümle doğrudur."}},"celdiriciYol":{},"hap":"Yeminli mali müşavirin tasdikten doğan sorumluluğu, tasdikin kapsamıyla SINIRLI olmak üzere mükellefle birlikte müşterek ve müteselsildir, asla tek başına ve sınırsız değildir.","teshis":{"C":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"E":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"A":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"D":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"B":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 103"},"kural":"madde 1, gerçek durumun ilgililerin ve resmi mercilerin istifadesine tarafsız sunulmasını ve yüksek mesleki standartların gerçekleştirilmesini amaç sayar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 103","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Roma rakamlı önermelerde her maddeyi tek başına madde 1\u0027in amaç cümlesiyle karşılaştır, tarafsızlığı bozan ya da kapsamı daraltan ifadeyi hemen ele.","konu":"meslek mensubu etik sosyal sorumluluk","tablo":{"satirlar":[["A) Yalnız I","3568 s.K. m.1","doğru ifade"],["B) I ve III","3568 s.K. m.1","YANLIŞ ifade"],["C) II ve IV","3568 s.K. m.1","doğru ifade"],["D) I, II ve III","3568 s.K. m.1","YANLIŞ ifade"],["E) I ve IV","3568 s.K. m.1","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"II ve IV","E":"I ve IV","A":"Yalnız I","D":"I, II ve III","B":"I ve III"},"kaynak":{"alinti":"gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak","liste":[{"ad":"SMMM K. (3568 s.K.) m.1","metin":"Madde 1 – Bu Kanunun amacı, işletmelerde faaliyetlerin ve işlemlerin sağlıklı ve güvenilir bir şekilde işleyişini sağlamak, faaliyet sonuçlarını ilgili mevzuat çerçevesinde denetlemeye, değerlendirmeye tabi tutarak gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak ve yüksek mesleki standartları gerçekleştirmek üzere, (…)2 \"Serbest Muhasebeci Mali Müşavirlik\" ve \"Yeminli Mali Müşavirlik\" meslekleri ve hizmetleri ile Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları, Serbest Muhasebeci Mali Müşavirler ve Yeminli Mali Müşavirler Odaları Birliğinin kurulmasına, teşkilat, faaliyet ve denetimlerine, organlarının seçimlerine dair esasları düzenlemektir. Bu Kanun hükümlerine göre meslek icrasına hak kazananlara (…)2 \"Serbest Muhasebeci Mali Müşavir\", \"Yeminli Mali Müşavir\" denir. (Ek cümle: 10/7/2008-5786/1 md.) Birliğin kısa adı TÜRMOB’dur. Mesleğin konusu"},{"ad":"SMMM K. (3568 s.K.) m.2 [2/2]","metin":"Meslek unvanlarının haksız kullanılması"}],"hakem":"Madde 1\u0027de yer alan \u0027gerçek durumu ilgililerin ve resmi mercilerin istifadesine tarafsız bir şekilde sunmak\u0027 ve \u0027yüksek mesleki standartları gerçekleştirmek\u0027 hükümleri doğru sıkkı (I ve III) tamamen desteklemektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Kanunun amacına göre: I. Meslek mensubu, faaliyet sonuçlarını resmi mercilere tarafsız sunar. II. Müşterisinin isteğiyle sonuçları farklı gösterebilir. III. Yüksek mesleki standartları gerçekleştirmeyi amaçlar. IV. Yalnız ücret aldığı işletmeye karşı sorumludur. Hangileri doğrudur?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-12","verilenler":[],"dayanak":"3568 sayılı SMMM Kanunu m.1","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir SMMM, 2019 yılında müşterisi olan bir tekstil firmasının yıl sonu kâr rakamını hazırlıyor.","anlatim":"Firma sahibi, bankadan kredi alabilmek için kârın gerçekte olduğundan yüksek gösterilmesini istiyor. SMMM bu talebi kabul etmiyor, gerçek rakamı resmi mercilere olduğu gibi bildiriyor.","doldur":[]},{"formul":"Ne yapacağız: 3568 sayılı Kanunun 1. maddesindeki amaç cümlesini bu olayda tek tek deneyeceğiz: tarafsız sunum, resmi mercilere kapsam, yüksek mesleki standart, müşteri isteğiyle değişiklik, sorumluluk sınırı. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"3568 s.K. m.1","karar":"doğru","anlatim":"Olayda SMMM gerçek kârı olduğu gibi bildiriyor, hiçbir tarafı kayırmıyor. Madde 1 tam olarak bunu ister: gerçek durumun tarafsız sunulması.","formul":"Şık A: SMMM\u0027nin faaliyet sonucunu resmi mercilere tarafsız sunması, kanunun amacına uyar mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"3568 s.K. m.1","karar":"yanlış","anlatim":"Olayda SMMM bunu reddetti çünkü bu davranış tarafsızlığı bozar. Madde 1 gerçek durumun tarafsız sunulmasını emreder, müşteri isteğiyle değiştirme bu amaca aykırıdır.","formul":"Şık B: firma sahibinin isteğiyle SMMM kârı farklı gösterse, bu davranış kanunun amacına uyar mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"3568 s.K. m.1","karar":"doğru","anlatim":"Olayda SMMM özenle, doğru rakamlarla çalışıyor; bu tam olarak standardı yükseltmek demek. Madde 1 bunu açıkça amaç sayar.","formul":"Şık C: SMMM\u0027nin işini yaparken yüksek mesleki standartları gerçekleştirmeyi amaçlaması, kanunun amacına uyar mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"3568 s.K. m.1","karar":"yanlış","anlatim":"Olayda SMMM aslında bankaya, yani resmi mercilere ve ilgililere karşı da sorumlu davranıyor. Madde 1 sorumluluğu yalnız işletmeyle sınırlamaz, ilgililer ve resmi merciler de kapsamdadır.","formul":"Şık D: SMMM yalnız kendisine ücret ödeyen firmaya karşı sorumlu olsaydı, bu kanunun amacına uyar mıydı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"3568 s.K. m.1","karar":"doğru","anlatim":"Olayın kendisi bu doğru davranışı gösteriyor, SMMM tarafsız kaldı. Madde 1 zaten bunu amaç sayar, yani doğru davranış budur.","formul":"Şık E: firma sahibinin isteğini kabul etmek yerine gerçek durumu bildirmek, kanunun amacına uyar mı?"},{"formul":"Kapanış: A ✓ B ✗ C ✓ D ✗ E ✓","anlatim":"Kanunun amacı iki ayakta durur: tarafsız sunum ve yüksek mesleki standart, geri kalan her şey bunlardan birini bozar. Kendine sor: bu davranış gerçek durumu mu yansıtıyor, yoksa bir tarafın çıkarını mı kolluyor?","doldur":[]}],"anahtar":[{"ornek":"gerçek","kok":"gerçek"},{"ornek":"tarafsız","kok":"tarafs"},{"ornek":"durumun","kok":"durumu"},{"ornek":"davranış","kok":"davran"},{"ornek":"mercilerin","kok":"mercil"},{"ornek":"standartların","kok":"standa"}],"konuGiris":{"harita":"Bu ilke ne zaman test edilir: kanunun amaç maddesiyle ilgili doğru-yanlış önermelerinde test edilir. Nasıl ölçülür: önermelerin kanunun amacına uygun olup olmadığına bakılarak ölçülür. Nasıl kaydedilir: doğru önermeler seçilip yanlış olanlar elenerek cevap oluşturulur.","desen":"Sınav genellikle amaç maddesindeki tarafsızlık ve yüksek standart ifadelerini çarpıtan yanlış önermeler ekler. Tuzak, müşteri isteğiyle sonuç değiştirme veya yalnız işverene sorumluluk gibi ifadelerle kurulur. Bu soru kanunun amaç maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"faaliyet sonuçlarının gerçek durumu yansıtacak şekilde sunulması ilkesi","ad":"tarafsızlık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"mesleğin güvenilirliğini artıracak kalite düzeyinin gerçekleştirilmesi hedefi","ad":"yüksek mesleki standart","kim":"meslek kuruluşu düzenler"},{"kaynak":"soruda verilir","tanim":"faaliyet sonuçlarının ilgili devlet kurumlarının istifadesine tarafsız aktarılması","ad":"resmi mercilere sunum","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"meslek mensubunun yalnız müşteriye değil ilgililere ve resmi mercilere karşı görevi","ad":"sorumluluk kapsamı","kim":"kanun sabitler"}],"sinavda":"Kanunun amacına ilişkin dört önerme verilip hangilerinin doğru olduğu istenir.","panel_ornek":"Bir tamirci arabanı tamir ettikten sonra raporu hem sana hem trafik polisine aynı şekilde yazar, müşteri memnun olmasa da gerçeği değiştirmez. Çünkü onun görevi sadece seni değil, ilgili tüm tarafları doğru bilgilendirmektir.","ornek":"Bir tamirci arabanı tamir ettikten sonra raporu hem sana hem trafik polisine aynı şekilde yazar, müşteri memnun olmasa da gerçeği değiştirmez. Çünkü onun görevi sadece seni değil, ilgili tüm tarafları doğru bilgilendirmektir.","yontemler":"Amaç maddesindeki üç unsuru (tarafsızlık, denetim, yüksek standart) tek tek önermelerle eşleştir; müşteri lehine sapma veya dar sorumluluk ifade eden önermeleri hemen ele.","nedir":"Bu kanun, meslek mensuplarının işlerini nasıl ve kime karşı sorumlulukla yapacağını belirler. Sınav, tarafsızlık ve yüksek mesleki standart amacının doğru hatırlanıp hatırlanmadığını ölçer."},"olay":"bu iki unsur I ve III önermelerinde yer alır, II tarafsızlığı, IV ise mercilere karşı sorumluluğu ortadan kaldırır.","tuzak":{"C":{"ad":"Zıt Kutup Tuzağı","metin":"İki yanlış önermeyi (tarafsızlığı bozma ve mercilere sorumsuzluk) doğruymuş gibi seçiyorsun. Doğrusu: madde 1 tam tersini, tarafsız sunumu ve resmi mercilere karşı sorumluluğu emreder."},"E":{"ad":"Kapsam Daraltma Tuzağı","metin":"Sorumluluğu yalnız ücret alınan işletmeyle sınırlı sanıyorsun. Doğrusu: madde 1, gerçek durumun resmi mercilerin de istifadesine sunulmasını öngörür, sorumluluk işletmeyle sınırlı değildir."},"D":{"ad":"Sadakat Tuzağı","metin":"Müşteri lehine farklı gösterme davranışını mesleki bağlılık sanıp III\u0027e ekliyorsun. Doğrusu: bu davranış tarafsızlık ilkesini bozar, madde 1\u0027in amacına aykırıdır ve doğru önermelere dahil edilemez."},"A":{"ad":"Eksik Seçim Tuzağı","metin":"Yalnız tarafsız sunma unsurunu görüp yüksek mesleki standartları gerçekleştirme amacını gözden kaçırıyorsun. Doğrusu: 3568 sayılı Kanunun 1 inci maddesindeki amaç hem tarafsız sunmayı hem yüksek standardı birlikte sayar, bu yüzden I ve III birlikte doğrudur."}},"celdiriciYol":null,"hap":"3568 sayılı Kanunun amacı, gerçek durumun ilgililer ve resmi mercilerin istifadesine tarafsız sunulmasını ve yüksek mesleki standartların gerçekleştirilmesini birlikte kapsar.","teshis":{"C":{"gercek":"Madde 1 hem tarafsızlığı hem resmi mercilere karşı sorumluluğu emreder; ikisi de bu önermelerde ihlal edilmiştir.","ayirt":"Bu önerme kanunun tarafsızlık ve kapsam şartlarından hangisini ihlal ediyor?","paragraf":"3568 s.K. m.1","yanilgi":"Sonuçları farklı göstermeyi mesleki esneklik, sorumluluğu tek tarafla sınırlamayı ise doğal sanıyorsun."},"E":{"gercek":"Madde 1 açıkça gerçek durumun \u0027ilgililerin ve resmi mercilerin istifadesine\u0027 sunulmasını öngörür, kapsam işletmeyle sınırlı değildir.","ayirt":"Amaç maddesinde faaliyet sonuçlarının kime sunulacağı sayılıyor mu?","paragraf":"3568 s.K. m.1","yanilgi":"Sorumluluğun yalnız ücret alınan işletmeye karşı olduğunu, resmi mercilerin kapsam dışı kaldığını düşünüyorsun."},"A":{"gercek":"Madde 1 amacı iki unsuru birlikte sayar: tarafsız sunum ve yüksek mesleki standart.","ayirt":"Metinde amaç cümlesinde birden fazla hedef var mı diye tekrar okudum mu?","paragraf":"3568 s.K. m.1","yanilgi":"Tarafsız sunma unsurunu bulunca soruyu bitmiş sayıyorsun, ikinci doğru önermeyi aramıyorsun."},"D":{"gercek":"Madde 1\u0027in amacı gerçek durumun tarafsız sunulmasıdır; müşteri isteğiyle farklı gösterme bu amacın doğrudan zıddıdır.","ayirt":"Bu önerme gerçek durumu mu yansıtıyor, yoksa bir tarafın çıkarını mı gözetiyor?","paragraf":"3568 s.K. m.1","yanilgi":"Üç önermeyi birden doğru sayarak II\u0027deki tarafsızlık ihlalini fark etmiyorsun."},"B":{"gercek":"Madde 1, gerçek durumun ilgililer ve resmi mercilerin istifadesine TARAFSIZ sunulmasını amaçlar; müşteri talimatıyla değiştirme bu amaca aykırıdır.","ayirt":"Bu davranış gerçek durumu olduğu gibi mi yansıtıyor, yoksa bir tarafı mı kayırıyor?","paragraf":"3568 s.K. m.1","yanilgi":"II\u0027nin müşteri sadakati gibi göründüğü için doğru sanılabileceğini, oysa bunun tarafsızlığı bozduğunu göz ardı edebilirsin."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 85"},"kural":"Madde 4 yalnız vatandaşlık, ehliyet, kamu hakları, mahkûmiyet, memuriyetten çıkarılmamış olma ve meslek şeref-haysiyetini sayar; öğrenim durumu kanunda ayrı başlıkla düzenlenmiş \u0027serbest muhasebeci mali müşavir olabilmenin özel şartları\u0027 kapsamındadır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 85","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 4\u0027ü sayarken zihninde altı bent tut; öğrenim/staj gibi mesleğe giriş şartları hep \u0027özel şartlar\u0027 başlığına aittir, genel şartlarla karıştırma.","konu":"smmm olma sartlari","tablo":{"satirlar":[["VERİLENLER","-","-"],["Madde numarası","4","-"],["HESAP","-","-"],["A) Kamu haklarından mahrum bulunmamak","3568 s.K. m.4/c","doğru ifade"],["B) Türk Ceza Kanununun 53 üncü maddesinde belirtilen sürele…","3568 s.K. m.4/d","doğru ifade"],["C) İlgili öğrenim dallarından lisans düzeyinde mezun olmuş …","3568 s.K. m.4; m.5 başlığı (özel şartlar)","YANLIŞ ifade"],["D) Ceza veya disiplin soruşturması sonucunda memuriyetten ç…","3568 s.K. m.4/e","doğru ifade"],["E) Meslek şeref ve haysiyetine uymayan durumları bulunmamak","3568 s.K. m.4/f","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İlgili öğrenim dallarından lisans düzeyinde mezun olmuş bulunmak","E":"Meslek şeref ve haysiyetine uymayan durumları bulunmamak","A":"Kamu haklarından mahrum bulunmamak","D":"Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmamış olmak","B":"Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile kasten işlenen belirli suçlardan mahkûm olmamak"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.4","metin":"Madde 4 – Meslek mensubu olabilmenin genel şartları şunlardır: a) T.C. vatandaşı olmak (yabancı serbest muhasebeci mali müşavirler hakkındaki hüküm saklıdır). b) Medeni hakları kullanma ehliyetine sahip bulunmak. c) Kamu haklarından mahrum bulunmamak. d) (Değişik: 10/7/2008-5786/2 md.) Türk Ceza Kanununun 53 üncü maddesinde belirtilen süreler geçmiş olsa bile; kasten işlenen bir suçtan dolayı bir yıl veya daha fazla süreyle hapis cezasına ya da affa uğramış olsa bile devletin güvenliğine karşı suçlar, Anayasal düzene ve bu düzenin işleyişine karşı suçlar, (…)4 zimmet, irtikâp, rüşvet, hırsızlık, dolandırıcılık, sahtecilik, güveni kötüye kullanma, hileli iflas, ihaleye fesat karıştırma, edimin ifasına fesat karıştırma, suçtan kaynaklanan malvarlığı değerlerini aklama veya kaçakçılık suçlarından mahkûm olmamak. e) Ceza veya disiplin soruşturması sonucunda memuriyetten çıkarılmış olmamak. f) Meslek şeref ve haysiyetine uymayan durumları bulunmamak. 10/7/2008 tarihli ve 5786 sayılı Kanunun 19 uncu maddesiyle; bu maddede yer alan \"serbest muhasebeci\" ibaresi madde metninden çıkarılmıştır. 4 Anayasa Mahkemesi’nin 18/5/2011 tarihli ve E.: 2008/80, K.: 2011/81 sayılı Kararı ile bu bentte yer alan “… milli savunmaya karşı suçlar, devlet sırlarına karşı suçlar ve casusluk, …” ibaresi iptal edilmiş olup, Kararın Resmi Gazete’de yayım tarihi olan 15/12/2011 tarihinden bir yıl sonra yürürlüğe girmesi hüküm altına alınmıştır. 3 Serbest muhasebeci mali müşavir olabilmenin özel şartları"},{"ad":"SMMM K. (3568 s.K.) m.5","metin":"Madde 5 – A) Serbest muhasebeci mali müşavir olabilmek için aşağıdaki özel şartlar aranır. a) Hukuk, iktisat, maliye, işletme, muhasebe, bankacılık, kamu yönetimi ve siyasal bilimler dallarında eğitim veren fakülte ve yüksekokullardan veya denkliği Yükseköğretim Kurumunca tasdik edilmiş yabancı yükseköğretim kurumlarından en az lisans seviyesinde mezun olmak veya diğer öğretim kurumlarından lisans seviyesinde mezun olmakla beraber bu fıkrada belirtilen bilim dallarından lisanüstü seviyesinde diploma almış olmak. b) (Değişik: 10/7/2008-5786/3 md.) En az üç yıl staj yapmış olmak. c) Serbest muhasebeci mali müşavirlik sınavını kazanmış olmak. (Değişik ikinci paragraf: 10/7/2008-5786/3 md.) Kanunları uyarınca vergi inceleme yetkisini almış ve mesleki yeterlilik sınavında başarılı olduktan sonra yeminli mali müşavirlik sınavını vermiş olanlarda, serbest muhasebeci mali müşavirlik sınavını kazanmış olma şartı aranmaz. d) Serbest muhasebeci mali müşavirlik ruhsatını almış olmak. B) (Mülga: 10/7/2008-5786/3 md.) Staj ve staj süresinden sayılan hizmetler5"}],"hakem":"Kaynak metinde Madde 4 genel şartları (vatandaşlık, ehliyetli olmak, kamu haklarından mahrum olmamak, mahkûmiyet, memuriyetten çıkarılmamış olmak, meslek şeref-haysiyeti) açıkça listeler; Madde 5 başlığında \u0027Özel şartlar\u0027 olarak lisans düzeyinde mezuniyet ayrıca düzenlenmiştir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi, 3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununun 4 üncü maddesinde sayılan meslek mensubu olabilmenin genel şartlarından biri değildir?","kayitBaslik":"","id":"sgs-t1-meslek-zor/kp-17","verilenler":[{"deger":"4","anlam":"Meslek mensubu olabilmenin genel şartlarının yer aldığı kanun maddesinin numarası.","ad":"Madde numarası"}],"dayanak":"3568 sayılı SMMM ve YMM Kanunu m.4 (genel şartlar); m.5 başlığı (özel şartlar)","dogru":"C","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Sivas\u0027ta bir büroda stajyer Elif, 2019\u0027da hukuk fakültesinden mezun olmuş, sonra 3 yıl staj yapmış, dosyasını odaya teslim ediyor.","anlatim":"Oda görevlisi dosyayı m.4\u0027e göre kontrol ediyor: vatandaşlık, ehliyet, kamu hakları, mahkûmiyet, memuriyet, haysiyet var mı diye bakıyor. Elif\u0027in lisans diploması ayrı bir yerde, m.5\u0027te kontrol edilecek.","doldur":[]},{"formul":"Ne yapacağız: Oda görevlisi elindeki beş maddeyi m.4\u0027ün altı bendiyle (a-f) tek tek karşılaştıracak; öğrenim şartı bu bentlerde yok.","anlatim":"Kural şu: m.4 sadece vatandaşlık, ehliyet, kamu hakları, TCK m.53 mahkûmiyeti, memuriyetten çıkarılmama ve haysiyeti sayar. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"3568 s.K. m.4/c","karar":"doğru","anlatim":"Görevlisi dosyaya bakıp bu maddeyi arıyor ve buluyor. m.4/c bunu doğrudan genel şart sayar. Yani bu ifade doğru, madde 4\u0027te var.","formul":"Şık A: Oda görevlisi \u0027Elif\u0027in kamu haklarından mahrum olmaması gerekir\u0027 diyor, bu bir genel şart mı?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"3568 s.K. m.4/d","karar":"doğru","anlatim":"Evet, tam olarak m.4/d bu cümleyi kelimesi kelimesine söyler. Zimmet, rüşvet, dolandırıcılık gibi suçlar sayılır. Bu ifade doğru, madde 4\u0027te var.","formul":"Şık B: Görevli \u0027TCK m.53\u0027teki süreler geçse bile belirli suçlardan mahkûm olmamalı\u0027 diyor, bu m.4\u0027te mi?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"3568 s.K. m.4; m.5 başlığı (özel şartlar)","karar":"yanlış","anlatim":"Görevli dosyayı çevirip bakıyor, m.4\u0027te öğrenimden hiç bahis yok. Diploma şartı m.5\u0027teki özel şartlar başlığındadır, m.4\u0027te değil. Bu ifade yanlış, madde 4\u0027e ait değil.","formul":"Şık C: Görevli \u0027ilgili öğrenim dalından lisans mezunu olmalı\u0027 diyor, bunu m.4\u0027e mi yazacak?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"3568 s.K. m.4/e","karar":"doğru","anlatim":"Evet, m.4/e bunu birebir söyler. Elif memur olmamış ama şart yine de listede duruyor. Bu ifade doğru, madde 4\u0027te var.","formul":"Şık D: Görevli \u0027ceza veya disiplin soruşturmasıyla memuriyetten çıkarılmamış olmalı\u0027 diyor, m.4\u0027te mi?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"3568 s.K. m.4/f","karar":"doğru","anlatim":"Görevli son bendi okuyor, m.4/f tam bunu söylüyor. Ahlaki görünse de kanun metninde açık bir bent. Bu ifade doğru, madde 4\u0027te var.","formul":"Şık E: Görevli \u0027meslek şeref ve haysiyetine uymayan hali olmamalı\u0027 diyor, bu bent var mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Elif\u0027in dosyasında öğrenim şartı m.4\u0027te değil m.5\u0027tedir, bu yüzden C cevap. Kendine hep şunu sor: bu şart \u0027genel şartlar\u0027 maddesinde mi yazıyor yoksa \u0027özel şartlar\u0027 başlığında mı?","doldur":[]}],"anahtar":[{"ornek":"şartlar","kok":"şartla"},{"ornek":"memuriyet","kok":"memuri"},{"ornek":"hakları","kok":"haklar"},{"ornek":"öğrenim","kok":"öğreni"},{"ornek":"ehliyet","kok":"ehliye"},{"ornek":"görevlisi","kok":"görevl"}],"konuGiris":{"harita":"Ne zaman test edilir: mesleğe kabul başvurusu değerlendirilirken. Nasıl ölçülür: adayın taşıdığı nitelikler, kanunda sayılan şartlar listesiyle tek tek karşılaştırılarak. Nasıl kaydedilir: uygun bulunan adaylar meslek siciline ve odaya kaydedilir.","desen":"Soru, genel şartlar listesine özel şartlardan birini (örneğin sınavı kazanmak, staj yapmak veya ruhsat almak) karıştırıp \u0027bu genel şart değildir\u0027 sorusunu ters çevirerek sorar. Doğru cevap her zaman özel şartlar arasından seçilir, çünkü soru genel şart olmayanı ister. Bu soru genel ve özel şartların ayrı maddelerde düzenlenmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"herkesten aranan, mesleğe özgü olmayan temel nitelikler","ad":"genel şart","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"belirli mesleğe girmek için ayrıca aranan ek nitelikler","ad":"özel şart","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"mesleğe kabulden önce uygulamalı olarak geçirilen zorunlu süre","ad":"staj","kim":"meslek kuruluşu düzenler"},{"kaynak":"soruda verilir","tanim":"tüm şartlar tamamlandıktan sonra verilen mesleği yapma izni","ad":"ruhsat","kim":"meslek kuruluşu düzenler"}],"sinavda":"Seçeneklerden biri hariç hepsinin genel şart olduğu, birinin ise özel şart olduğu bir liste verilir ve genel şart olmayan istenir.","panel_ornek":"Bir spor kulübüne üye olmak için önce herkesten istenen şartlar vardır: reşit olmak, sabıka kaydı temiz olmak gibi. Sonra kulübün branşa özel şartları gelir: yüzme bilmek, sağlık raporu almak gibi. Genel şart listesine \u0027yüzme bilmek\u0027 yazarsan bu bir tuzaktır, çünkü o branşa özel bir şarttır.","ornek":"Bir spor kulübüne üye olmak için önce herkesten istenen şartlar vardır: reşit olmak, sabıka kaydı temiz olmak gibi. Sonra kulübün branşa özel şartları gelir: yüzme bilmek, sağlık raporu almak gibi. Genel şart listesine \u0027yüzme bilmek\u0027 yazarsan bu bir tuzaktır, çünkü o branşa özel bir şarttır.","yontemler":"Vatandaşlık, medeni hakları kullanma, kamu haklarından mahrum olmama, belirli suçlardan mahkûm olmama ve meslek onuruna aykırı hal bulunmaması genel şarttır; eğitim, staj, sınav ve ruhsat ise özel şarttır. Seçenekte \u0027sınav\u0027, \u0027staj\u0027 veya \u0027ruhsat\u0027 görürsen bu genel şart değil özel şarttır.","nedir":"Bu konu, bir mesleğe girişte aranan genel şartlarla mesleğe özgü özel şartların birbirinden ayrılmasını anlatır. Sınav, hangi şartın \u0027genel\u0027 hangi şartın \u0027mesleğe özel\u0027 kategoriye girdiğini karıştırıp karıştırmadığını ölçer."},"olay":"","tuzak":{"D":{"ad":"Kural","metin":"Madde 4/(e) bendi ceza veya disiplin soruşturması sonucu memuriyetten çıkarılmamış olmayı genel şart sayar. İfade kaynaktaki bentle aynı olduğundan genel şarttır, aykırılık taşımaz."},"E":{"ad":"Kural","metin":"Madde 4/(f) bendi meslek şeref ve haysiyetine uymayan durumların bulunmamasını genel şart olarak düzenler. Bu ifade de kaynakla örtüştüğünden doğru bir genel şarttır."},"A":{"ad":"Kural","metin":"3568 sayılı Kanunun 4 üncü maddesinin (c) bendi kamu haklarından mahrum bulunmamayı genel şart olarak sayar. Bu bent kaynakta aynen yer aldığından ifade genel şartlardandır, soruda aranan aykırı ifade bu değildir."},"B":{"ad":"Kural","metin":"Aynı maddenin (d) bendi, Türk Ceza Kanununun 53 üncü maddesindeki süreler geçmiş olsa bile sayılan suçlardan mahkûmiyet bulunmamasını genel şart olarak düzenler. İfade kaynakla birebir örtüştüğünden genel şarttır."}},"celdiriciYol":{},"hap":"3568 sayılı Kanunun 4 üncü maddesindeki genel şartlar vatandaşlık, ehliyet, kamu hakları, mahkûmiyet, memuriyet ve haysiyet bentlerinden ibarettir; öğrenim şartı bu maddede değil özel şartlar düzenlemesinde yer alır.","teshis":{"C":{"gercek":"Kanun, öğrenim şartını m.4\u0027te değil ayrı başlıklı \u0027özel şartlar\u0027 düzenlemesinde ele alır; m.4 yalnız vatandaşlık, ehliyet, kamu hakları, mahkûmiyet, memuriyet ve haysiyet bentlerinden oluşur.","ayirt":"Bu şart kanunun \u0027genel şartlar\u0027 başlıklı maddesinde mi yazıyor, yoksa \u0027özel şartlar\u0027 başlığı altında mı?","paragraf":"3568 s.K. m.4; m.5 başlığı (özel şartlar)","yanilgi":"SMMM olmak için lisans mezuniyetinin de m.4\u0027teki genel şartlardan biri olduğunu sanıyorsun çünkü mesleğe girişte öğrenim şartı aklına ilk gelen unsur."},"E":{"gercek":"3568 sayılı Kanun m.4/f bunu doğrudan bir bent olarak genel şartlar arasında sayar.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi, yoksa maddede hiç geçmeyen bir konu mu?","paragraf":"3568 s.K. m.4/f","yanilgi":"Meslek şeref ve haysiyetine ilişkin ifadenin soyut bir ahlak kuralı olup kanun maddesinde yer almadığını sanıyorsun."},"A":{"gercek":"3568 sayılı Kanun m.4/c bunu doğrudan genel şart olarak sayar.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi, yoksa maddede hiç geçmeyen bir konu mu?","paragraf":"3568 s.K. m.4/c","yanilgi":"Kamu haklarından mahrumiyetin ayrı, istisnai bir hal olduğunu ve genel şartlar listesinde geçmediğini sanıyorsun."},"D":{"gercek":"3568 sayılı Kanun m.4/e bunu açıkça genel şart olarak düzenler.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi, yoksa maddede hiç geçmeyen bir konu mu?","paragraf":"3568 s.K. m.4/e","yanilgi":"Memuriyetten çıkarılmamış olma şartının disiplin hukukuna özgü olup genel şartlar arasında sayılmadığını düşünüyorsun."},"B":{"gercek":"3568 sayılı Kanun m.4/d, TCK m.53\u0027teki sürelere ve sayılan suçlara açıkça atıf yapan genel şarttır.","ayirt":"Bu ifade madde 4\u0027ün bentlerinden biri mi, yoksa maddede hiç geçmeyen bir konu mu?","paragraf":"3568 s.K. m.4/d","yanilgi":"Türk Ceza Kanununa atfın yalnız disiplin mevzuatına ait olduğunu, genel şart olmadığını düşünüyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 102"},"kural":"3568 sayılı Kanunun 48 inci maddesine göre mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlara ilk defasında uyarma, tekrarında ise kınama cezası uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 102","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin cezası sorularında önce fiilin hangi fıkraya girdiğini, sonra fiilin ilk mi tekrar mı olduğunu ayırt et.","konu":"disiplin cezası kınama","tablo":{"satirlar":[["A) Mesleki kurallara aykırı fiilin tekrarında kınama cezası…","3568 s.K. m.48","doğru ifade"],["B) Fiil ilk kez işlenmiş gibi değerlendirilerek yine uyarma…","3568 s.K. m.48","YANLIŞ ifade"],["C) Fiilin tekrarı nedeniyle geçici olarak mesleki faaliyett…","3568 s.K. m.48","YANLIŞ ifade"],["D) Üç yıllık dönemde iki suç işlendiği için savunma alınmak…","3568 s.K. m.48","YANLIŞ ifade"],["E) Disiplin kurulu takdir yetkisini kullanarak bir derece h…","3568 s.K. m.48","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Fiilin tekrarı nedeniyle geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır.","E":"Disiplin kurulu takdir yetkisini kullanarak bir derece hafif ceza olan uyarma cezasını uygular.","A":"Mesleki kurallara aykırı fiilin tekrarında kınama cezası uygulanır.","D":"Üç yıllık dönemde iki suç işlendiği için savunma alınmaksızın doğrudan meslekten çıkarma cezası uygulanır.","B":"Fiil ilk kez işlenmiş gibi değerlendirilerek yine uyarma cezası uygulanır."},"kaynak":{"alinti":"","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"Kaynak metinde 3568 sayılı Kanun m.48\u0027de mesleki kurallara aykırı fiil tekrarında kınama cezası uygulanacağı açıkça düzenlenmiştir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Bir meslek mensubu, mesleğin vakar ve onuruna aykırı bir fiili nedeniyle daha önce uyarma cezası ile cezalandırılmıştır. Kısa süre sonra aynı nitelikteki fiili tekrar işlemiştir. Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanununa göre bu ikinci fiil için uygulanacak disiplin // 06.09 seviye: ölçümden türer (bkz. kart kurulumu). k = sınıf anahtarı, ad = ekran adı (Nöbet dili: Isınma / Nöbet / Alarm), neden = ipucu.
function seviyeHesapla(s){
  const o=s.olcum||{}; const tip=s.tip||'teori'; const ders=String(s.ders||'');
  if(o.sim&&o.sim.dogru===false) return {k:'alarm',ad:'🔴 Alarm',neden:'Nöbetçi öğrencisi bu anlatımla ikizi çözemedi; dikkat ister'};
  if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

const GUN=86400000; const KUTU={ kayit:[], kutu:[], oyun:[], ileri:0 };   // ileri: demo icin "zaman ileri sarma" (ms)
try{ KUTU.kayit=JSON.parse(localStorage.getItem('kc_kayit')||'[]'); KUTU.kutu=JSON.parse(localStorage.getItem('kc_kutu')||'[]'); KUTU.oyun=JSON.parse(localStorage.getItem('kc_oyun')||'[]'); KUTU.ileri=parseInt(localStorage.getItem('kc_ileri')||'0')||0; }catch(e){}
const simdi=()=>Date.now()+KUTU.ileri;

// 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}
function skorCiz(){ const sk=skorHesapla(); const vade=KUTU.kutu.filter(x=>x.due<=simdi()).length; const azVeri=KUTU.kayit.length<5; document.querySelectorAll('.skorCip').forEach(el=>{ el.textContent=azVeri?'🎯 —':('🎯 %'+sk.toplam); el.title=azVeri?'Hazırlık skoru 5 sorudan sonra görünür':'Hazırlık skoru'; }); /* 05.09: ilk yanlıştan sonra "%4" görmek caydırıcı; 5 cevaptan önce yüzde yok */ document.querySelectorAll('.kutuCip').forEach(el=>{ el.textContent='📥 '+KUTU.kutu.length+(vade?' ·'+vade+' hazır':''); el.classList.toggle('hazir',vade>0); }); }

            setTimeout(()=>{ u.remove(); td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); },650); }, gecikme); });
        // hedefi olmayan fazladan kutular da sırayla gelsin
        mats.forEach((m,q)=>{ if(q>=hedefler.length&&m.classList.contains('gizliMat')){ setTimeout(()=>{ if(adimNo===adimBu){ m.classList.remove('gizliMat'); m.classList.add('geldi'); } }, q*900); } });
      }
      kaynakH.forEach(k=>{ const [r,c]=k.split(','); const td=tabloSar.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]'); if(td) td.classList.add('kaynakH'); });
      // 06.09: VERİLENLER bloğu Adım 1'den sonra katlanır; bu adımın formülünde kullanılan verilen satırı açık kalır (mavi), başlık tıklanınca hepsi açılır
      tabloSar.querySelectorAll('tr.vblok').forEach(tr=>{ const td=tr.querySelector('td[data-r]'); const key=td?td.dataset.r+','+td.dataset.c:''; tr.classList.toggle('katli', j>0 && !kaynakH.has(key) && !hedef.has(key)); });
      let lej=tabloSar.querySelector('.lejant'); if(!lej){ lej=document.createElement('div'); lej.className='lejant'; tabloSar.appendChild(lej); }
      lej.innerHTML=kaynakH.size?'<i class="m"></i>nereden geldi <i class="a"></i>bu adımda bulundu':(hedef.size?'<i class="a"></i>bu adımda bulundu':''); lej.style.display=lej.innerHTML?'block':'none';
      // kayit satirlari: adimda anilan hesap kodu (uc hane; "100.000" icindeki 100 sayilmaz)
      const kodOf=x=>new Set([...(String(x.formul)+' '+String(x.anlatim)).matchAll(/(?<![\d.,])(\d{3})(?![\d.,]|\s*(?:TL|%|adet|gün|yıl|ay))/g)].map(m=>m[1]));
      const kodlar=kodOf(a);
      // gösterilen kayıt satırları da 0..j'den yeniden kurulur (geri gidince sonraki adımın satırı gizlenir)
      gosterilen.clear(); for(let q=0;q<=j;q++){ kodOf(s.adimlar[q]).forEach(c=>gosterilen.add(c)); }
      tabloSar.querySelectorAll('tr.kayit[data-kod]').forEach(tr=>{ const k2=tr.dataset.kod; const an=k2&&kodlar.has(k2); if(son){ gosterilen.add(k2); } tr.classList.toggle('goster',gosterilen.has(k2)); tr.classList.toggle('vurguS',!!an); });
      tabloSar.querySelectorAll('tr.ara').forEach(ara=>{ const gi=ara.dataset.grp; ara.classList.toggle('goster',[...tabloSar.querySelectorAll('tr.kayit[data-kod][data-grp="'+gi+'"]')].some(tr=>tr.classList.contains('goster'))); });
      adimBar.querySelectorAll('i').forEach(n=>{ const q=parseInt(n.dataset.j); n.classList.toggle('simdi',q===j); n.classList.toggle('gecti',q<j); });
      bOnce.disabled=(j===0); bSonra.disabled=son; bSonra.textContent=son?'Bitti ✓':'İleri ▶';
      const vurgu=tabloSar.querySelector('td.vurgu, tr.vurguS'); if(vurgu) vurgu.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    const adimGit=d=>{ const cur=s.adimlar[adimNo]; if(d>0&&cur&&tahminGerek(cur,adimNo,adimNo===s.adimlar.length-1)&&serit.querySelector('.tahminK')){ tahmin[adimNo]={atla:true}; adimGoster(adimNo,1); return; }   // 06.09: tahmin ekranında ileri = "göster"
      const j=Math.min(s.adimlar.length-1,Math.max(0,adimNo+d)); if(j===adimNo) return; adimGoster(j,d); };
    bOnce.addEventListener('click',()=>adimGit(-1)); bSonra.addEventListener('click',()=>adimGit(1));
    // fare tekerlegi, klavye oklari, parmakla yatay kaydirma (sola = ileri)
    let tekerKilit=0; serit.addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-tekerKilit<350) return; tekerKilit=t; adimGit((e.deltaY||e.deltaX)>0?1:-1); },{passive:false});
    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});

if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar

  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
