amu kuruluşu görevleridir.","ayirt":"Bu iş, bağımsız meslek icrası mı yoksa işverene bağımlı ücretli çalışma mı?","paragraf":"m.45 f.1","yanilgi":"Sen bu şıkkı elerken hizmet akdiyle çalışmanın da istisna kapsamına girdiğini sanıyorsun."},"D":{"gercek":"Madde 45/3, hayrî ve ilmi kuruluşlardaki bilirkişilik görevini istisna tutar.","ayirt":"Görev hayrî/ilmi kuruluş bünyesinde mi, yoksa serbest piyasada mı yapılıyor?","paragraf":"m.45 f.3","yanilgi":"Bilirkişiliği meslekle bağdaşmayan genel bir iş olarak görüyorsun."},"B":{"gercek":"Madde 45/3, kamu iktisadi teşebbüsü ve benzeri kuruluşlardaki yönetim kurulu üyeliğini meslekle bağdaşmayan iş saymaz.","ayirt":"Bu görev üçüncü fıkradaki sayılan istisna görevlerden biri mi?","paragraf":"m.45 f.3","yanilgi":"Kamu kuruluşundaki her görevi otomatik olarak yasak sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 104"},"kural":"Genelleme Tuzağı: öğrenci göreve son verme hükmünün tüm oda organlarını kapsadığını sanıp bu cümleyi doğru zannedebilir. Doğrusu: kanun açıkça göreve son verme ve görevden uzaklaştırma hükümlerinin oda genel kurulu hakkında uygulanmayacağını söyler, bu şık kanuna aykırıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 104","sonDonem":0,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Bu tip sorularda önce metindeki istisna cümlesini ara; kanun \u0027uygulanır\u0027 değil \u0027uygulanmaz\u0027 diyorsa şık ters çevrilmiş olabilir.","konu":"oda organları görevleri","tablo":null,"siklar":{"C":"Görevlendirilen beş kişi, yeni organların seçimini bir ay içinde sonuçlandırmakla yükümlüdür.","E":"Göreve son verme ve görevden uzaklaştırma hükümleri, oda genel kurulu hakkında da uygulanır.","A":"Amaçları dışında faaliyet gösteren odanın sorumlu organlarının görevlerine son verilmesine ilişkin dava, asliye hukuk mahkemesince en geç üç ay içinde sonuçlandırılır.","D":"Bu usule göre seçilen yeni organlar, görevlerine son verilen eski organların görev süresini tamamlar.","B":"Görevlerine son verilen Oda Yönetim Kurulu yerine yeni organları seçecek beş kişi, Oda Genel Kurulu üyeleri arasından görevlendirilir."},"kaynak":{"alinti":"in son paragrafında açıkça yer alan","liste":[{"ad":"SMMM K. (3568 s.K.) m.15 [1/2]","metin":"Madde 15 – (Değişik birinci fıkra: 10/7/2008-5786/7 md.) Bölgesi içinde kendi mesleği konusunda en az 250 meslek mensubu bulunan il merkezlerinde ve bölgesi içinde 250 meslek mensubu bulunan ilçelerde (Büyükşehir belediyesi sınırları içindeki ilçeler hariç) bir oda kurulur. Ayrı ayrı kurulan serbest muhasebeci mali müşavirler ve yeminli mali müşavirler odaları, bulundukları ilin veya ilçenin adıyla anılır. Ancak, ilçelerde oda kurulabilmesi için o ilçedeki en az 100 meslek mensubunun yazılı başvurusu aranır. Yeterli sayıda meslek mensubu bulunmayan ve oda kurulamayan yerlerin en yakın odaya bağlanmasına veya bölge odaları kurulmasına Birlikçe karar verilir. Bu karar Maliye Bakanlığına bildirilir. Odalar, kuruluşlarını Birlik Yönetim Kurulu aracılığıyla Maliye Bakanlığına bildirmekle tüzelkişilik kazanırlar. Odalara üye olmayan meslek mensupları mesleki faaliyette bulunamazlar. (Değişik: 18/6/1997 - 4276/23 md.) Amaçları dışında faaliyet gösteren odaların sorumlu organlarının görevlerine son verilmesine ve yerlerine yenilerinin seçilmesine, Maliye Bakanlığının veya bulundukları yer Cumhuriyet Başsavcılığının istemi üzerine, o yerdeki asliye hukuk mahkemesince basit usule göre yargılama yapılarak karar verilir ve dava en geç üç ay içinde sonuçlandırılır. Mahkemece beşinci fıkrada yazılı organların görevlerine son verilmesi halinde kararda ayrıca, görevlerine son verilen organları bu Kanunda yazılı usullere göre seçecek organları toplamak üzere, Oda Yönetim Kurulu için Oda Genel Kurulu üyeleri arasından, Birlik Yönetim Kurulu için Birlik Genel Kurulu üyeleri arasından beş kişi…"},{"ad":"SMMM K. (3568 s.K.) m.15 [2/2]","metin":"Görevlendirilen bu beş kişi bu fıkrada yazılı süre içinde görevlerine son verilen organlar gibi görevli ve yetkili olup aynı şekilde sorumludurlar. Bu fıkra hükmüne göre seçilecek yeni organlar eski organların görev sürelerini tamamlarlar. Maliye Bakanlığının bu Kanun uyarınca Oda organlarının işlemleri hakkında onay mercii olarak verdiği kararları görevli oda organları aynen yerine getirmekle yükümlüdürler. Bakanlık kararını, idari yargı merciinin yürütmenin durdurulmasına veya esasına ait kararı veya kanuni bir sebep olmaksızın yerine getirmeyen veya eski kararda direnme niteliğinde yeni bir karar veren veya kanunun mecburi kıldığı işlemleri Bakanlığın uyarısına rağmen yerine getirmeyen oda organları hakkında da yukarıdaki fıkralar hükümleri uygulanır. Görevlerine son verilen organların yerine en geç bir ay içerisinde yenileri seçilir. Yeni seçilenler eskilerin süresini tamamlarlar. Görevlerine son verilen organ üyelerinin kanunda yazılı cezai sorumlulukları saklıdır. Bu organların yukarıdaki fıkra gereğince görevlerine son verilmesine sebep olan tasarrufları hükümsüzdür. (Değişik: 18/6/1997 - 4276/23 md.) Ancak, milli güvenliğin, kamu düzeninin, suç işlenmesini veya suçun devamını önlemenin yahut yakalamanın gerektirdiği hallerde gecikmede sakınca varsa, odalar, vali tarafından faaliyetten men edilebilir. Faaliyetten men kararı, yirmidört aat içinde görevli hakimin onayına sunulur. Hakim, kararını kırksekiz saat içinde açıklar, aksi halde, bu idari karar kendiliğinden yürürlükten kalkar. Göreve son verme ve görevden uzaklaştırma hükümleri oda genel kurulu hakkında uygula…"}],"hakem":"Soru, 3568 s.K. m.15\u0027in son paragrafında açıkça yer alan \u0027Göreve son verme ve görevden uzaklaştırma hükümleri oda genel kurulu hakkında uygulanmaz\u0027 kuralına dayanmaktadır; doğru sık bu kurala uygun olarak oda genel kurulu hakkında bu hükümlerin uygulanmayacağını belirtmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Görevlendirilen beş kişinin seçimi bir ay içinde tamamlaması kanunun gerektirdiği şeydir, ifade doğrudur.","A":"Mahkemece dava üç ay içinde sonuçlandırılması kanunla açıkça belirtilmiştir, bu ifade doğrudur.","D":"Yeni seçilen organlar eski organların kalan görev süresini tamamlayacakları kanunda yazılıdır, doğru ifadedir.","B":"Yeni organları seçecek beş kişinin Oda Genel Kurulu üyeleri arasından görevlendirilmesi kanunla düzenlenmiştir, doğru ifadedir."},"dogru":"Kanun açıkça belirtir ki göreve son verme ve görevden uzaklaştırma hükümleri oda genel kurulu hakkında uygulanmaz. E şıkkı bunun tersini söylediği için yanlıştır.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 15. madde","kavramlar":[{"kaynak":"SMMM K. 15. madde","tanim":"Oda organlarının kuruluş ve faaliyet amaçlarına uygun olmayan işler yapması durumudur.","ad":"Amaçları dışında faaliyet"},{"kaynak":"SMMM K. 15. madde","tanim":"Asliye hukuk mahkemesince verilen karar sonucunda oda organlarının görevlerinin sona erdirilmesidir.","ad":"Göreve son verme"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2021/3","2015/3"]},"oyun":null,"tip":"teori","soru":"3568 sayılı Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu\u0027na göre, amaçları dışında faaliyet gösteren oda organlarının görevden alınması sürecine ilişkin aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-p-meslek-zor-r2-a/kp-05","verilenler":[],"dayanak":"3568 sayılı SMMM Kanunu m.15 [1/2] ve [2/2]","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[],"anahtar":[{"ornek":"göreve","kok":"göreve"},{"ornek":"hakkında","kok":"hakkın"},{"ornek":"görevden","kok":"görevd"},{"ornek":"kurulu","kok":"kurulu"},{"ornek":"uzaklaştırma","kok":"uzakla"},{"ornek":"uygulanmaz","kok":"uygula"}],"konuGiris":{"harita":"Ne zaman görevden alma süreci başlar: oda organı amacı dışında faaliyet gösterdiğinde. Nasıl karar verilir: Maliye Bakanlığı veya Cumhuriyet Başsavcılığının istemiyle asliye hukuk mahkemesi basit yargılama yapar. Nasıl kayda geçer: mahkeme kararında görevlendirilecek beş kişi ve seçim süresi belirtilir.","desen":"Sınav genelde istem sahibini (Maliye Bakanlığı/Başsavcılık), yetkili mahkemeyi (asliye hukuk) ve sürelerini (üç ay, bir ay) karıştırarak yanlış seçenek üretir. Bazen \u0027genel kurul da görevden alınabilir\u0027 gibi kanuna aykırı bir ifade sokulur, oysa genel kurul bu hükmün dışındadır. Bu soru m.15 fıkra 5-6 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Görevden alma davasını başlatabilecek makam","ad":"İstem sahibi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Davaya bakacak ve karar verecek mahkeme türü","ad":"Yetkili mahkeme","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Davanın sonuçlandırılması gereken azami süre","ad":"Dava süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Görevden alınan organ yerine seçim yapacak beş kişilik grup","ad":"Geçici kurul","kim":"kanun sabitler"}],"sinavda":"Soru, görevden alma sürecindeki usul, süre ve yetkili makamlardan hangisinin kanuna aykırı yazıldığını sorar.","panel_ornek":"Bir apartman yönetimi, amacı dışında kirasını topladığı parayı başka işe harcarsa, kat malikleri onu görevden almak için mahkemeye başvurabilir. Mahkeme buna 2 hafta içinde bakar, yöneticinin yerine 3 kişilik geçici kurul atanır. İşte oda organlarının görevden alınması da buna benzer ama kanunda süre ve kişi sayısı farklıdır.","ornek":"Bir apartman yönetimi, amacı dışında kirasını topladığı parayı başka işe harcarsa, kat malikleri onu görevden almak için mahkemeye başvurabilir. Mahkeme buna 2 hafta içinde bakar, yöneticinin yerine 3 kişilik geçici kurul atanır. İşte oda organlarının görevden alınması da buna benzer ama kanunda süre ve kişi sayısı farklıdır.","yontemler":"En kritik kural: sadece \u0027sorumlu organlar\u0027 görevden alınabilir, oda genel kurulu bu kapsamın dışındadır.","nedir":"Bu konu, oda organlarının amaç dışı faaliyetinde görevden alınma sürecinin nasıl işlediğini anlatır. Sınav, kimin dava açabileceğini, hangi mahkemenin karar vereceğini ve sürelerin doğru bilinip bilinmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Süre Sayısı Tuzağı","metin":"öğrenci üç aylık dava süresiyle bir aylık seçim süresini karıştırıp bu cümleyi yanlış zannedebilir. Doğrusu: kanun, görevlendirilen beş kişinin seçimi bir ay içinde sonuçlandıracağını düzenler, ifade doğrudur."},"A":{"ad":"Ne soruluyor","metin":"oda organlarının görevden alınması sürecinde hangi ifadenin kanuna aykırı olduğu soruluyor. Kural: 3568 sayılı Kanun m.15\u0027e göre amaçları dışında faaliyet gösteren odaların organlarının görevine son verilmesi kararı asliye hukuk mahkemesince basit usulde verilir ve dava en geç üç ay içinde sonuçlandırılır. Doğrusu: bu ifade kanun metniyle birebir örtüşür, yanlış şık bu değildir."},"D":{"ad":"Süreklilik Tuzağı","metin":"öğrenci yeni seçilen organların yeni bir süreyle göreve başladığını sanıp bu cümleyi yanlış işaretleyebilir. Doğrusu: kanun, yeni seçilen organların eski organların görev süresini tamamlayacağını belirtir, ifade doğrudur."},"B":{"ad":"Süre-Özne Karıştırma Tuzağı","metin":"öğrenci beş kişinin hangi genel kuruldan seçildiğini (Oda mı Birlik mi) karıştırıp bu cümleyi yanlış sanabilir. Doğrusu: kanun, Oda Yönetim Kurulu için bu beş kişinin Oda Genel Kurulu üyeleri arasından görevlendirileceğini açıkça söyler, ifade doğrudur."}},"celdiriciYol":null,"hap":"Göreve son verme ve görevden uzaklaştırma hükümleri oda genel kurulu hakkında uygulanmaz; bu istisna sınavda en çok karıştırılan noktadır.","teshis":{"C":{"gercek":"Kanun, görevlendirilen beş kişinin seçimi bir ay içinde sonuçlandıracağını düzenler; bu üç aylık dava süresinden ayrı bir süredir.","ayirt":"Bu bir ay, dava süresi mi yoksa seçim süresi mi?","paragraf":"m.15 [1/2]","yanilgi":"Bir aylık süreyi dava süresiyle karıştırıp bu ifadeyi hatalı sanıyorsun."},"E":{"gercek":"Kanun m.15/2 fıkrası açıkça bu hükümlerin oda genel kurulu hakkında uygulanmayacağını belirtir; genel kurul bu düzenlemenin kapsamı dışındadır.","ayirt":"Bu hüküm, hangi organ için açıkça istisna getiriliyor?","paragraf":"m.15 [1/2]","yanilgi":"Göreve son verme ve görevden uzaklaştırma hükümlerinin istisnasız her organa uygulandığını sanıyorsun."},"A":{"gercek":"Kanun m.15/5, mahkeme davasının en geç üç ay içinde sonuçlandırılacağını açıkça belirtir.","ayirt":"Bu süreyi başka bir maddedeki süreyle karıştırıyor muyum?","paragraf":"m.15 [1/2]","yanilgi":"Bu maddenin süresinin üç ay değil farklı bir süre olduğunu düşünüyorsun."},"D":{"gercek":"Kanun m.15, seçilecek yeni organların eski organların görev sürelerini tamamlayacağını açıkça belirtir.","ayirt":"Yeni organ, sıfırdan mı yoksa kalan süreyi mi tamamlıyor?","paragraf":"m.15 [1/2]","yanilgi":"Yeni seçilenlerin tam süreyle göreve geldiğini düşünüyorsun, oysa kanun bunu sınırlar."},"B":{"gercek":"Kanun, Oda Yönetim Kurulu için beşi Oda Genel Kurulu üyeleri arasından, Birlik Yönetim Kurulu için beşi Birlik Genel Kurulu üyeleri arasından ayırır.","ayirt":"Hangi organ için hangi genel kuruldan seçim yapıldığını maddeden tekrar okudum mu?","paragraf":"m.15 [1/2]","yanilgi":"Beş kişinin Birlik Genel Kurulu üyeleri arasından seçildiğini sanıyorsun çünkü metinde iki ayrı görevlendirme birlikte geçiyor."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"SMMM ve YMM K. Disiplin Yönetmeliği m.5/e, mevzuata aykırı tabela kullanılmasını uyarma cezası hallerinden sayar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Disiplin sorularında önce fiili karşılayan bent/madde aranır; ceza ağırlığı fiilin \u0027ciddi görünmesine\u0027 göre değil metindeki sayım hükmüne göre belirlenir.","konu":"smmm disiplin cezalari","tablo":{"satirlar":[["A) Kınama","m.5/e","YANLIŞ ifade"],["B) Uyarma","m.5/e","doğru ifade"],["C) Geçici olarak mesleki faaliyetten alıkoyma","m.48/3","YANLIŞ ifade"],["D) Yeminli sıfatını kaldırma","m.48/4","YANLIŞ ifade"],["E) Meslekten çıkarma","m.48/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Geçici olarak mesleki faaliyetten alıkoyma","E":"Meslekten çıkarma","A":"Kınama","D":"Yeminli sıfatını kaldırma","B":"Uyarma"},"kaynak":{"alinti":"","liste":[{"ad":"SMMM ve YMM K. Disiplin Yonetmeligi m.5 [1/2]","metin":"Madde 5 — Uyarma cezası aşağıdaki durumlarda uygulanır : a) (Değişik:RG-27/09/2007-26656) Müşterilerin işlerine karşı, kayıtsız ve ilgisiz kalınması, müşterilerle mesleki konularda yapılacak sözleşme hükümlerine aykırı davranılması, sözleşmenin taraflarca fesh edilmesi hâlinde, iş sahibinin defter ve belgelerinin otuz gün içinde devir ve teslim tutanağı düzenleyerek teslim edilmemesi (Devir ve teslim işleminin gerçekleşemediğinin meslek mensubu tarafından Odaya bildirilmesi durumu hariç.), b) Birlikçe yayımlanan, genelge ve yönerge hükümlerine aykırı olarak, meslek disiplinini bozucu hareketlerde bulunulması, c) Aday meslek mensubunun, mesleğin vakar ve onuru ile bağdaşmayan işler yapmasına neden olunması veya bilerek izin verilmesi veya bu eyleme göz yumulması, d) (Mülga:RG-27/09/2007-26656) e) (Değişik:RG-4/8/2015-29435) Mevzuata aykırı tabela kullanılması f) (Mülga:RG-7/10/2023-32332) g) Kanun ve Yönetmeliklerde öngörülen sosyal sorumluluk hükümlerine uyulmaması, h) En az iki kez yazı ile istenmesine rağmen, oda aidat borçlarının haklı gerekçe olmaksızın ödenmemesi, i) Adres değişikliklerinin, (Mülga ibare:RG-4/8/2015-29435) (…) Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavirlerin Çalışma Usul ve Esasları Hakkında Yönetmelik hükümlerine uygun olarak süresinde bildirilmemesi, j) Mesleğin yürütülmesi esnasında; görevi ile ilgisi olmayan konularda, çıkar çatışmalarına taraf olunması, k) (Değişik:RG-27/09/2007-26656) Meslek mensuplarınca, Oda yönetim, denetim, disiplin kurulu tarafından görevleri ile ilgili olarak istenen her türlü belge ve bilginin verilmemesi, l) (…"},{"ad":"SMMM ve YMM K. Disiplin Yonetmeligi m.5 [2/2]","metin":"(Ek:RG-27/09/2007-26656) Yukarıda sayılanlar dışında, mesleğin vakar ve onuruna aykırı davranışlarla, görevin gerektirdiği güveni sarsıcı hareketlerde bulunulması. Kınama Cezası"}],"hakem":"Soru, SMMM ve YMM K. Disiplin Yönetmeliği m.5/e\u0027de açıkça düzenlenen mevzuata aykırı tabela kullanılmasının uyarma cezası gerektirdiği kuralını doğru şekilde soruyor ve cevaplandırıyor."},"kayitlar":[],"sade":{"siklar":{"C":"Geçici mesleki alıkoyma, bağımsızlık, tarafsızlık, dürüstlük ilkelerine karşı işlenen ağır ihlallere uygulanır. Tabela ihlali bu ağırlıkta bir fiil değildir.","E":"Meslekten çıkarma en ağır disiplin cezası olup, kanunda sayılan ağır fiiller (vergi ziyaına kasden sebep olma, ruhsat başkasına kullandırma) için ayrılmıştır; tabela ihlali bu kapsamda değildir.","D":"Yeminli sıfatının kaldırılması yalnız yeminli mali müşavirlere özgü bir ceza olup, tasdik yetkisini gerçeğe aykırı kullanmanın tekrarına uygulanır; tabela ihlaliyle ilgisi yoktur.","A":"Kınama cezası, mesleğin vakar ve onuruna aykırı genel davranışlara veya güveni sarsıcı hareketlere uygulanır. Tabela ihlali Yönetmelik\u0027te ayrıca sayılmış olup uyarma cezasıdır."},"dogru":"Büro tabelasında yasaya aykırı yazı kullanmak, Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Kanunu Disiplin Yönetmeliği\u0027nde açıkça uyarma cezasını gerektiren bir davranış olarak sayılmıştır. Başka ağırlaştırıcı bir hal olmadığında kural olarak uyarma cezası uygulanır.","sinav":"Serbest Muhasebeci Mali Müşavir ve Yeminli Mali Müşavir Kanunu Disiplin Yönetmeliği 5. madde (e) bendine göre mevzuata aykırı tabela kullanılması uyarma cezasını gerektirmektedir.","kavramlar":[{"kaynak":"SMMM ve YMM K. Disiplin Yonetmeligi 5. madde","tanim":"Meslek mensubunun mevzuata ve disiplin kurallarına aykırı davranışlarından dolayı uygulanacak hafif disiplin cezası. Yönetmelik\u0027te sayılan belirli fiillere özgüdür.","ad":"Uyarma cezası"},{"kaynak":"SMMM ve YMM K. Disiplin Yonetmeligi 5. madde","tanim":"Meslek mensubunun büro tabelasında yasalara uygun olmayan ibareler kullanması.","ad":"Mevzuata aykırı tabela"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2018/2","2015/1"]},"oyun":null,"tip":"teori","soru":"Bir meslek mensubu, büro tabelasında mevzuata aykırı ibareler kullanmıştır. Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu Disiplin Yönetmeliği\u0027ne göre bu fiil için kural olarak hangi disiplin cezası uygulanır?","kayitBaslik":"","id":"sgs-p-meslek-kolay-r4-a/kp-04","verilenler":[],"dayanak":"SMMM ve YMM K. Disiplin Yonetmeligi m.5/e (uyarma cezası halleri)","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir SMMM, ofis kapısına astığı tabelaya \u0027Vergi Garantili Danışmanlık\u0027 yazmış, 14 Mart günü oda denetimi bunu tespit etmiş.","anlatim":"Bu, mevzuata aykırı tabela kullanımı olayı. Şimdi aynı olayı beş ceza ihtimaline karşı tek tek soracağız.","doldur":[]},{"formul":"Ne yapacağız: Yönetmelik m.5/e\u0027ye göre bu fiil uyarma cezası hallerinden biri, biz de A\u0027dan E\u0027ye kadar \u0027bu ceza mı uygulanır\u0027 diye soracağız.","anlatim":"Kural tek: tabela ihlali doğrudan uyarma cezasını gerektirir, başka ceza değil. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.5/e","karar":"yanlış","anlatim":"Kınama, görevde genel kusurlu davranışlar için m.4/b\u0027de ayrı tanımlanmış. Tabela ihlali özel olarak m.5/e\u0027de uyarma hali sayılmış, kınamaya girmez.","formul":"Şık A: müdür \u0027bu ağır bir kusur, kınama cezası verelim\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.5/e","karar":"doğru","anlatim":"Mevzuata aykırı tabela kullanımı Yönetmelik m.5/e\u0027de açıkça uyarma cezası hali olarak sayılmış. Meslek mensubuna sadece yazıyla dikkatli olması bildirilir.","formul":"Şık B: denetçi \u0027bu fiil için kural olarak uyarma cezası uygulanır\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.48/3","karar":"yanlış","anlatim":"Bu ceza m.48/3\u0027e göre bağımsızlık, tarafsızlık gibi ağır ilke ihlallerinde uygulanır. Tabela hatası bu ağırlıkta değil.","formul":"Şık C: oda başkanı \u0027altı ay mesleki faaliyetten alıkoyalım\u0027 diyor, uygular mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.48/4","karar":"yanlış","anlatim":"Yeminli sıfatının kaldırılması m.48/4\u0027e göre tasdik yetkisinin gerçeğe aykırı kullanımının tekerrürüne bağlı. Burada tasdik yetkisi ihlali yok, sadece tabela var.","formul":"Şık D: birileri \u0027yeminli sıfatını kaldıralım\u0027 diyor, bu fiile uyar mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.48/2","karar":"yanlış","anlatim":"Meslekten çıkarma m.48/2\u0027de kasıtlı vergi ziyaına sebep olma gibi ağır sayılı fiillerle sınırlı. Tabela ihlali bu listede yok.","formul":"Şık E: birisi \u0027meslekten çıkarma cezası verelim\u0027 diyor, bu doğru mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tabela ihlali doğrudan m.5/e\u0027de uyarma cezası olarak sayılmış, başka hiçbir cezaya gerek yok. Kendine sor: bu fiil Yönetmeliğin hangi bendinde açıkça sayılmış?","doldur":[]}],"anahtar":[{"ornek":"tabela","kok":"tabela"},{"ornek":"uyarma","kok":"uyarma"},{"ornek":"ihlali","kok":"ihlali"},{"ornek":"cezasını","kok":"cezası"},{"ornek":"aykırı","kok":"aykırı"},{"ornek":"kullanılması","kok":"kullan"}],"konuGiris":{"harita":"Ne zaman test edilir: meslek mensubunun tabela ya da benzeri usul ihlali yaptığı somut olayda. Nasıl ölçülür: fiilin Yönetmelik madde 5\u0027teki hangi bende girdiği tespit edilerek. Nasıl kaydedilir: ilgili disiplin kurulu kararında uygulanan ceza türü ve dayanak madde/bent belirtilerek.","desen":"Sınav genelde madde 5\u0027in bentlerini karıştırıp öğrenciye \u0027kınama mı uyarma mı\u0027 sorusu sorar. Tuzak, tabela ihlalinin madde 5/e bendinde açıkça \u0027Uyarma\u0027 olarak sayılmasını, madde 5 dışı davranışların ise ayrı bentte \u0027Kınama\u0027 olmasını karıştırmaktır. Bu soru m.5/e bendi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Madde 5\u0027te sayılan hafif nitelikli disiplin ihlalleri için verilen en hafif ceza","ad":"Uyarma cezası","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Meslek mensubunun büro tabelasında yönetmeliğe uymayan ibare kullanması","ad":"Mevzuata aykırı tabela","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Madde 5 dışında kalan, vakar ve güveni sarsan davranışlara verilen daha ağır ceza","ad":"Kınama cezası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Somut olayda hangi cezanın uygulanacağını belirleyen organ kararı","ad":"Disiplin kurulu kararı","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Somut bir disiplin ihlali fiili verilir ve bu fiile karşılık gelen ceza türü sorulur.","panel_ornek":"Bir apartman yöneticisi, bina girişine yönetmeliğe aykırı büyüklükte bir tabela astığında önce sözlü uyarı alır; ikinci kez tekrarlarsa yönetim kurulu 3 kişilik toplantıda karar verip yazılı ihtar çıkarır. Kural aynı: küçük usul hatası önce hafif cezayla karşılanır.","ornek":"Bir apartman yöneticisi, bina girişine yönetmeliğe aykırı büyüklükte bir tabela astığında önce sözlü uyarı alır; ikinci kez tekrarlarsa yönetim kurulu 3 kişilik toplantıda karar verip yazılı ihtar çıkarır. Kural aynı: küçük usul hatası önce hafif cezayla karşılanır.","yontemler":"Fiilin madde 5 bentlerinden hangisine birebir uyduğunu bulup doğrudan o bentteki cezayı yaz; yorum yapma, metne sadık kal.","nedir":"Bu konu, meslek mensuplarının kural dışı davranışlarına hangi disiplin cezasının uygulanacağını düzenler. Sınav, hangi fiile hangi ceza maddesinin karşılık geldiğini bilip bilmediğini ölçer."},"olay":"Fiil doğrudan m.5/e bendine girer, ağırlaştırıcı bir hal yoktur.","tuzak":{"C":{"ad":"Alıkoyma Tuzağı","metin":"Her disiplin ihlalinin doğrudan faaliyetten men getireceğini sanırsın. Doğrusu: Bu ceza bağımsızlık, tarafsızlık, dürüstlük ilkelerine aykırılık gibi ağır fiillere özgüdür; tabela ihlali bu kapsamda değildir."},"E":{"ad":"Meslekten Çıkarma Tuzağı","metin":"En ağır cezayı, ciddi görünen her ihlale uygulanır sanırsın. Doğrusu: Meslekten çıkarma; kasden vergi ziyaına sebep olma veya ruhsatı başkasına kullandırma gibi kanunda sayılan ağır fiillere özgüdür."},"D":{"ad":"Yeminli Sıfat Tuzağı","metin":"Bu cezanın her meslek mensubuna uygulanabileceğini sanırsın. Doğrusu: Yeminli sıfatının kaldırılması yalnız yeminli mali müşavirlerin tasdik yetkisini gerçeğe aykırı kullanmasının tekerrürüne özgüdür."},"A":{"ad":"Kınama Tuzağı","metin":"Tabela ihlalini görevde kusur sayılan genel bir davranış sanırsın. Doğrusu: Mevzuata aykırı tabela kullanılması Yönetmelik m.5/e\u0027de ayrıca sayılmış ve uyarma cezasını gerektirir."}},"celdiriciYol":null,"hap":"Mevzuata aykırı tabela kullanılması SMMM ve YMM K. Disiplin Yönetmeliği m.5/e uyarınca uyarma cezasını gerektirir.","teshis":{"C":{"gercek":"Bu ceza m.48 fıkra 3 uyarınca bağımsızlık, tarafsızlık, dürüstlük veya genel prensiplere aykırı ağır fiillere uygulanır.","ayirt":"Fiil mesleğin genel prensiplerine ağır bir aykırılık mı, yoksa şekli bir kusur mu?","paragraf":"m.48/3","yanilgi":"Her disiplin ihlalinin ağırlığını abartıp doğrudan faaliyetten alıkoymaya götürürsün."},"E":{"gercek":"m.48 fıkra 2 meslekten çıkarmayı kasden vergi ziyaına sebep olma veya ruhsatı başkasına kullandırma gibi sayılı ağır fiillerle sınırlar.","ayirt":"Fiil kanunda sayılan meslekten çıkarma sebeplerinden biri mi?","paragraf":"m.48/2","yanilgi":"En ağır cezanın ciddi görünen her ihlale uygulanacağını sanırsın."},"A":{"gercek":"Yönetmelik m.5/e mevzuata aykırı tabela kullanılmasını ayrı ve açıkça uyarma cezası hali olarak düzenler.","ayirt":"Bu fiil Yönetmeliğin hangi bendinde sayılmış, o bent hangi cezayı öngörüyor?","paragraf":"m.5/e","yanilgi":"Tabela ihlalini görevde kusurlu davranış sayılan genel kınama sebebi sanırsın."},"D":{"gercek":"m.48 fıkra 4 bu cezayı yalnız yeminli mali müşavirin tasdik yetkisini gerçeğe aykırı kullanmasının tekerrürüne bağlar.","ayirt":"Fiil tasdik yetkisinin kötüye kullanılması ve tekerrürü mü?","paragraf":"m.48/4","yanilgi":"Bu cezanın her meslek mensubuna uygulanabilecek genel bir ceza olduğunu sanırsın."},"B":{"gercek":"Yönetmelik m.5/e mevzuata aykırı tabela kullanılmasını açıkça uyarma cezası gerektiren haller arasında sayar.","ayirt":"Bu davranış Yönetmelik m.5\u0027te sayılan hallerden biri mi?","paragraf":"m.5/e","yanilgi":"Tabela ihlalini önemsiz bulup hiç ceza gerekmediğini düşünürsün."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 101"},"kural":"3568 sayılı Kanun m.48\u0027e göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşen meslek mensubuna meslekten çıkarma cezası verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 101","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Soruda \u0027kasten\u0027 ve \u0027mahkeme kararıyla kesinleşme\u0027 birlikte geçiyorsa kademeli ceza aranmaz, doğrudan en ağır ceza düşünülür.","konu":"smmm disiplin cezalari","tablo":{"satirlar":[["A) Uyarma","p.28","YANLIŞ ifade"],["B) Kınama","m.48 f.2","YANLIŞ ifade"],["C) Geçici olarak mesleki faaliyetten alıkoyma","m.48","YANLIŞ ifade"],["D) Yeminli sıfatını kaldırma","m.48","YANLIŞ ifade"],["E) Meslekten çıkarma","m.48 f.2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Geçici olarak mesleki faaliyetten alıkoyma","E":"Meslekten çıkarma","A":"Uyarma","D":"Yeminli sıfatını kaldırma","B":"Kınama"},"kaynak":{"alinti":"in ikinci fıkrasında açıkça yer alan","liste":[{"ad":"SMMM K. (3568 s.K.) m.48 [1/2]","metin":"Madde 48 – Mesleğin vakar ve onuruna aykırı fiil ve hareketlerde bulunanlarla, görevlerini yapmayan veya kusurlu olarak yapan yahut da görevinin gerektirdiği güveni sarsıcı hareketlerde bulunan meslek mensupları hakkında, muhasebe ve müşavirlik hizmetlerinin gereği gibi yürütülmesi maksadı ile durumun niteliğine ve ağırlık derecesine göre aşağıdaki disiplin cezaları verilir. Disiplin cezaları şunlardır: a) Uyarma; meslek mensubuna mesleğinin icrasında daha dikkatli davranması gerektiğinin yazı ile bildirilmesidir. b) Kınama; meslek mensubuna görevinde ve davranışında kusurlu sayıldığının yazı ile bildirilmesidir. c) Geçici olarak mesleki faaliyetten alıkoyma; mesleki sıfatı saklı kalmak şartıyla altı aydan az, bir yıldan çok olmamak üzere mesleki faaliyetten alıkoymadır. d) Yeminli sıfatını kaldırma; yeminli mali müşavirin yeminli sıfatının kaldırılmasıdır. e) Meslekten çıkarma; meslek mensubunun ruhsatnamesinin geri alınarak bir daha bu mesleği icra etmesine izin verilmemesidir. Mesleki kurallara, mesleğin vakar ve onuruna aykırı fiil ve harekette bulunanlarla, görevin gerektirdiği güveni sarsıcı harekette bulunan meslek mensupları hakkında, ilk defasında uyarma, tekrarında ise kınama cezası uygulanır. Görevini bağımsızlık, tarafsızlık ve dürüstlükle yapmayan veya kusurlu olarak yapan veyahutta bu Kanunda yer alan mesleğin genel prensiplerine aykırı harekette bulunan meslek mensupları için geçici olarak mesleki faaliyetten alıkoyma cezası uygulanır. Tasdik yetkisini gerçeğe aykırı olarak kullandığı Maliye Bakanlığınca ilk defa tespit edilen ve rapora bağlanan yeminli mali …"},{"ad":"SMMM K. (3568 s.K.) m.48 [2/2]","metin":"Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir. (Ek fıkra:27/3/2025-7546/4 md.) Meslek ruhsatnamesini bir başkasına bedelli veya bedelsiz olarak kullandırdıkları tespit edilen meslek mensupları ile başka meslek mensuplarının ad ve unvanları kullanılarak beyanname düzenleyen, imzalayan ya da gönderen meslek mensuplarına meslekten çıkarma cezası verilir. Üç yıllık bir dönem içinde iki veya daha fazla disiplin cezasını gerektiren davranışta bulunan meslek mensubuna, her yeni suçu için bir öncekinden daha ağır ceza uygulanabilir. Beş yıllık dönem içinde iki defa mesleki faaliyetten alıkoyma cezası ile cezalandırılmasından sonra bu cezayı gerektiren fiili yeniden işleyen meslek mensupları hakkında meslekten çıkarma cezası uygulanır. Disiplin kurulları bir derece ağır veya bir derece hafif disiplin cezasının uygulanmasına karar verebilirler. Takibat ve hüküm tesisi disiplin soruşturması yapılmasına ve disiplin cezası uygulanmasına engel değildir. Meslek mensubu hakkında savunması alınmadan disiplin cezası verilemez. Yetkili disiplin kurulunun 10 günden az olmamak üzere verdiği süre içinde savunma yapmayanlar, savunma hakkından vazgeçmiş sayılırlar. (Değişik fıkra:27/3/2025-7546/4 md.) Disiplin cezaları, cezanın kesinleştiğinin meslek mensubuna bildirilmesinden sonra uygulanır. Ceza hükmü"}],"hakem":"Soru, 3568 sayılı Kanun m.48\u0027in ikinci fıkrasında açıkça yer alan \u0027Mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına, meslekten çıkarma cezası verilir\u0027 hükmünü doğru şekilde ölçmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Geçici alıkoyma, tasdik yetkisinin gerçeğe aykırı kullanılmasında uygulanır. Vergi ziyaı ise tamamen ayrı ve çok daha ciddi bir suçtur, daha ağır ceza gerektirir.","A":"Uyarma hafif bir cezadır ve meslek mensubuna daha dikkatli davranması gerektiğinin bildirilmesiyle sınırlıdır. Kasten vergi ziyaı bu kadar hafif bir müeyyideyle cezalandırılmaz.","D":"Yeminli sıfatını kaldırma sadece yeminli mali müşavirin tasdik yetkisi ihlalinde ve tekerrürde uygulanır. Vergi ziyaı suçu yeminli olup olmadığına bakılmaksızın meslekten çıkarmayı gerektirir.","B":"Kınama ilk defa mesleki kurallara aykırı davranışlarda uygulanır. Ancak kasten vergi ziyaı bu basit cezalama sistemine tabi değil, doğrudan en ağır ceza uygulanır."},"dogru":"Müşterisiyle birlikte kasten vergi ziyaına sebebiyet veren meslek mensubu, mahkeme kararıyla kesinleşirse meslekten çıkarılır. Bu ceza doğrudan kanunda yazılı olduğu için başka bir ceza seçeneği yoktur.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 48. maddesine göre mükellefle birlikte kasden vergi ziyaına sebebiyet verdikleri mahkeme kararı ile kesinleşen meslek mensuplarına meslekten çıkarma cezası verilir.","kavramlar":[{"kaynak":"SMMM K. 48. madde","tanim":"Mükellef ile birlikte bilerek ve isteyerek vergi borcunun ödenemesine sebep olan davranıştır. Mahkeme kararıyla kesinleştiğinde meslek mensubu için en ağır disiplin cezasını gerektirir.","ad":"Kasten vergi ziyaı"},{"kaynak":"SMMM K. 48. madde","tanim":"Meslek mensubunun ruhsatnamesinin geri alınarak bir daha mesleği yürütmesine izin verilmemesidir. En ağır disiplin cezasıdır.","ad":"Meslekten çıkarma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2018/2","2015/1"]},"oyun":null,"tip":"teori","soru":"Bir serbest muhasebeci mali müşavirin, müşterisiyle birlikte kasten vergi ziyaına sebebiyet verdiği mahkeme kararıyla kesinleşmiştir. 3568 sayılı Kanuna göre bu meslek mensubu hakkında aşağıdaki disiplin cezalarından hangisi uygulanır?","kayitBaslik":"","id":"sgs-p-meslek-kolay-r3-a/kp-04","verilenler":[],"dayanak":"3568 sayılı SMMM ve YMM K. m.48, 2. fıkra","dogru":"E","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bursa\u0027da bir SMMM, müşterisiyle anlaşıp 2021 yılı beyannamesinde 850.000 TL matrah gizlemiş; mahkeme bu vergi ziyaını kasıtlı bulup kararı kesinleştirmiş.","anlatim":"Bu artık basit bir ihmal değil, mahkemenin onayladığı kasıtlı bir fiil.","doldur":[]},{"formul":"Ne yapacağız: Kanun m.48 f.2, mükellefle birlikte kasten vergi ziyaına sebep olup bu durum mahkeme kararıyla kesinleşen meslek mensubuna doğrudan meslekten çıkarma cezasını öngörür; şimdi beş cezayı bu olayda tek tek deneyeceğiz.","anlatim":"Kural tek: kasıt + mahkeme kesinleşmesi varsa ceza otomatik olarak en ağırıdır.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.28","karar":"yanlış","anlatim":"Uyarma, mesleğini dikkatli yapması için yazı ile ikaz etmektir, kasıtlı fiile değil ihmale bakar. Burada mahkeme kasıt tespit etmiş, dikkatsizlik değil.","formul":"Şık A: müdürün yanına gidip \u0027bu bir dikkatsizlikti, sadece uyarma yeterli\u0027 desen, haklı mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.48 f.2","karar":"yanlış","anlatim":"Kınama, davranışında kusurlu olduğunu bildirmektir, kademeli bir sistemin ilk basamağıdır. Kasten vergi ziyaı, kademeli sisteme değil doğrudan ağır hükme girer.","formul":"Şık B: \u0027ilk kusuru, kınama ile geçsin\u0027 desen, kanun buna izin verir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.48","karar":"yanlış","anlatim":"Geçici alıkoyma, mesleki sıfat saklı kalarak belirli süre çalıştırmamaktır, daha çok tasdik hatalarında görülür. Burada kasıtlı vergi ziyaı için kanun ayrı ve daha ağır bir hüküm koymuş.","formul":"Şık C: \u0027altı ay mesleğinden uzaklaştıralım, sıfatı kalsın\u0027 desen, bu olaya uyar mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.48","karar":"yanlış","anlatim":"Bu ceza sadece yeminli mali müşavirin tasdik yetkisi ihlalinin tekrarında uygulanır. Olayımızdaki kişi SMMM, tekrarlanan tasdik ihlali de yok.","formul":"Şık D: \u0027yeminli sıfatını kaldıralım, mühür geri alınsın\u0027 desen, doğru mu karar verirsin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.48 f.2","karar":"doğru","anlatim":"Meslekten çıkarma, ruhsatın geri alınıp mesleğin bir daha yapılamamasıdır. Mükellefle birlikte kasten vergi ziyaına sebep olup mahkeme kararı kesinleşince kanun doğrudan bu cezayı öngörür.","formul":"Şık E: \u0027ruhsatnamesini al, bir daha mesleği yapamasın\u0027 desen, kanunun emrettiği tam bu mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Kasıt + mahkeme kesinleşmesi varsa ceza basamak atlamaz, doğrudan en ağırına gider; kendine sor: burada kademeli kusur mu var yoksa kanunun ayrı ve ağır tuttuğu özel bir fiil mi?","doldur":[]}],"anahtar":[{"ornek":"mahkeme","kok":"mahkem"},{"ornek":"meslek","kok":"meslek"},{"ornek":"kesinleşen","kok":"kesinl"},{"ornek":"doğrudan","kok":"doğrud"},{"ornek":"çıkarma","kok":"çıkarm"},{"ornek":"kasıtlı","kok":"kasıtl"}],"konuGiris":{"harita":"Ne zaman test edilir: fiilin ağırlığına göre hangi disiplin cezasının uygulanacağı sorulduğunda. Nasıl ölçülür: kanun metnindeki fiil tanımı ile ceza türü arasındaki doğrudan eşleşme aranarak. Nasıl kaydedilir: disiplin kurulu kararı, kesinleşme sonrası meslek mensubuna bildirilerek uygulamaya geçirilir.","desen":"Sınav genellikle müşteriyle birlikte kasten vergi ziyaına sebep olma fiilini verip doğrudan meslekten çıkarma cezasını sordurur. Tuzak, öğrencinin bu fiili \u0027kusurlu görev yapma\u0027 sanıp geçici alıkoyma cezasını seçmesidir, oysa kanun bu fiil için ayrıca ve doğrudan en ağır cezayı öngörür. Bu soru m.48 [2/2] fıkrasındaki özel düzenleme noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubuna daha dikkatli davranması gerektiğinin yazıyla bildirilmesi","ad":"Uyarma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Meslek mensubuna görev ve davranışında kusurlu sayıldığının yazıyla bildirilmesi","ad":"Kınama","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Sıfat saklı kalarak altı ay ile bir yıl arası faaliyetin durdurulması","ad":"Geçici mesleki faaliyetten alıkoyma","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Ruhsatnamenin geri alınıp mesleğin bir daha icra edilememesi","ad":"Meslekten çıkarma","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Mahkeme kararıyla kesinleşmiş kasıtlı vergi ziyaı fiili verilip buna karşılık gelen disiplin cezası istenir.","panel_ornek":"Bir apartman yöneticisi, sitedeki ortak parayı komşularla anlaşıp kasten eksik göstermiş ve bu durum mahkeme kararıyla kesinleşmiş; artık yöneticilik yapması tamamen yasaklanıyor, sadece uyarılmakla kalmıyor. Yani hafif bir hata değil, güveni tamamen çökerten bir fiil söz konusu.","ornek":"Bir apartman yöneticisi, sitedeki ortak parayı komşularla anlaşıp kasten eksik göstermiş ve bu durum mahkeme kararıyla kesinleşmiş; artık yöneticilik yapması tamamen yasaklanıyor, sadece uyarılmakla kalmıyor. Yani hafif bir hata değil, güveni tamamen çökerten bir fiil söz konusu.","yontemler":"Fiili kanundaki özel hükümle eşleştir; genel kusur hükümleriyle karıştırma çünkü kasten vergi ziyaı ayrı ve daha ağır bir madde ile düzenlenmiştir.","nedir":"Bu konu, meslek mensuplarının kusurlu ya da suç niteliğindeki davranışlarına karşı uygulanan disiplin cezalarını düzenler. Sınav, hangi fiile hangi ağırlıkta cezanın kanunen bağlandığını ayırt edebilmeni ölçer."},"olay":"Fiil doğrudan bu hükme girdiği için ara ceza basamağı aranmaz.","tuzak":{"C":{"ad":"Tasdik Yetkisi Karıştırma Tuzağı","metin":"Öğrenci bunu, tasdik yetkisinin gerçeğe aykırı kullanılmasında uygulanan geçici alıkoyma cezasıyla karıştırır. Doğrusu: O ceza yalnız YMM\u0027lerin tasdik yetkisi ihlali içindir, vergi ziyaı ayrı ve daha ağır bir hükümdür."},"A":{"ad":"Hafif Kural Tuzağı","metin":"Öğrenci vergi ziyaını mesleğin genel bir ihmali gibi görüp en hafif cezayı seçer. Doğrusu: Kanun bu fiil için doğrudan meslekten çıkarma öngörür, kademeli ceza uygulanmaz."},"D":{"ad":"Unvan Karıştırma Tuzağı","metin":"Öğrenci meslek mensubu ifadesini sadece yeminli mali müşavire özgü sanıp bu cezayı seçer. Doğrusu: Yeminli sıfatını kaldırma yalnız YMM\u0027nin tasdik yetkisi ihlalinin tekerrüründe uygulanır, olayda böyle bir unsur yoktur."},"B":{"ad":"Tekerrür Tuzağı","metin":"Öğrenci ilk kez işlenen kusurlu davranışlarda uygulanan kınamayı burada da geçerli sanır. Doğrusu: Kasten vergi ziyaı, tekerrür şartı aranmaksızın en ağır cezayı gerektirir."}},"celdiriciYol":{},"hap":"Mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu durum mahkeme kararıyla kesinleşen meslek mensubuna doğrudan meslekten çıkarma cezası verilir.","teshis":{"C":{"gercek":"Geçici alıkoyma, tasdik yetkisinin gerçeğe aykırı ilk kullanımında uygulanır; kasten vergi ziyaı ayrı ve daha ağır bir düzenlemedir.","ayirt":"Olayda tasdik raporu mu var, yoksa doğrudan kasten vergi ziyaı mı söz konusu?","paragraf":"3568 s.K. m.48","yanilgi":"Bu cezayı, tasdik yetkisinin kötüye kullanılmasıyla aynı kefeye koyup burada da uygulanacağını sanıyorsun."},"E":{"gercek":"Kanun, mükellefle birlikte kasten vergi ziyaına sebebiyet verip bu durumu mahkeme kararıyla kesinleşen meslek mensubuna doğrudan meslekten çıkarma cezası öngörür.","ayirt":"Fiil, kanunda doğrudan en ağır cezaya bağlanmış özel bir hüküm müdür?","paragraf":"3568 s.K. m.48 f.2","yanilgi":"Bu kadar ağır bir cezanın doğrudan, aşamasız uygulanamayacağını düşünüyorsun."},"A":{"gercek":"Kanun, kasten ve mahkeme kararıyla kesinleşen vergi ziyaını ayrıca ve ağır şekilde düzenlemiştir.","ayirt":"Fiil kanunda özel olarak ağır bir ceza ile mi anılmış, yoksa genel kusur maddesine mi giriyor?","paragraf":"3568 s.K. m.48 f.2","yanilgi":"Vergi ziyaını sıradan bir dikkatsizlik sanıp en hafif cezanın uygulanacağını düşünüyorsun."},"D":{"gercek":"Yeminli sıfatını kaldırma yalnız YMM\u0027nin tasdik yetkisi ihlalinin tekerrüründe uygulanır; olayda bu koşul yok.","ayirt":"Olayda tekrarlanan bir tasdik ihlali mi var, yoksa tek seferlik kasten vergi ziyaı mı var?","paragraf":"3568 s.K. m.48","yanilgi":"Meslek mensubu ifadesini sadece yeminli mali müşavire özgü sayıp bu cezayı seçiyorsun."},"B":{"gercek":"Kademeli ceza (ilk uyarma, tekrarında kınama) yalnız mesleki kurallara aykırı genel davranışlar içindir; vergi ziyaı ayrı bir hükümle doğrudan en ağır cezaya bağlanmıştır.","ayirt":"Bu fiil, kademeli ceza uygulanan genel kusur maddesi mi, yoksa doğrudan ağır ceza öngören özel bir fıkra mı?","paragraf":"3568 s.K. m.48 f.2","yanilgi":"Bunun ilk kez işlenen bir kusur olduğu için kınamayla sınırlı kalacağını sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 104"},"kural":"İş kapsamının, daha az ücretle iş yapılsın diye baskıyla daraltılması yıldırma tehdidi sayılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 104","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce şıktaki olayın hangi tehdit türüne ait olduğunu belirle, sonra soru kökündeki ikinci şartı (ücretle ilgili olma) kontrol et.","konu":"ücret tarifesi","tablo":{"satirlar":[["A) Tek bir müşteriden alınacak toplam ücrete aşırı bağlılık…","m.21/b","YANLIŞ ifade"],["B) Daha düşük ücret ödenmesi amacıyla sunulan hizmetin kaps…","m.25/b","doğru ifade"],["C) Müşteri sözleşmesiyle ilgili olarak azledilme veya görev…","m.25/a","YANLIŞ ifade"],["D) Güvence sağlama sözleşmesiyle ilgili olarak şarta bağlı …","m.21/e","YANLIŞ ifade"],["E) Üst düzey personel ile güvence sağlama müşterisi arasınd…","m.24/d","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Müşteri sözleşmesiyle ilgili olarak azledilme veya görevin başkasına verilmesiyle tehdit edilme","E":"Üst düzey personel ile güvence sağlama müşterisi arasında uzun süreli bir arkadaşlık ilişkisinin bulunması","A":"Tek bir müşteriden alınacak toplam ücrete aşırı bağlılık duyulması","D":"Güvence sağlama sözleşmesiyle ilgili olarak şarta bağlı ücretler öngörülmesi","B":"Daha düşük ücret ödenmesi amacıyla sunulan hizmetin kapsamının uygunsuzca azaltılması yönünde baskıya maruz kalınması"},"kaynak":{"alinti":"","liste":[{"ad":"TÜRMOB Etik İlkeler Yön. EK bolum 6","metin":"TÜRMOB - Mesleki Faaliyetlerde Uyulacak Etik İlkeler Hakkında Yönetmelik (RG 19.10.2007, Sayı 26675). EK: Etik İlkeler (m.21-25) [İKİNCİ KISIM: Bağımsız Çalışan Meslek Mensuplarının Uyacakları Etik İlkeler / BİRİNCİ BÖLÜM: Giriş] MADDE 21 – (1) Bağımsız çalışan meslek mensubu için kişisel çıkar tehdidi yaratabilecek durumlara verilebilecek bazı örnekler şunlar olabilir: a) Müşterisinden finansal çıkarı olması veya müşteri ile ortak bir finansal çıkarı paylaşması, b) Tek bir müşteriden alınacak toplam ücrete aşırı bağlılık. c) Müşteri ile yakın iş ilişkisi kurmak. ç) Müşteriyi kaybetme olasılığını dikkate alma. d) Müşteri tarafından istihdam edilme olasılığı. e) Güvence sağlama sözleşmesi ile ilgili şarta bağlı ücretler. f) Güvence sağlama müşterisinden veya yöneticilerden borç alınması ya da güvence sağlama müşterisine/yöneticilerine borç verilmesi. MADDE 22 – (1) Bağımsız çalışan meslek mensubu için tekrar değerlendirme tehdidi yaratabilecek durumlara verilebilecek bazı örnekler şunlar olabilir: a) Bağımsız çalışan meslek mensubunun yaptığı bir işin tekrar değerlendirilmesi sırasında önemli bir hatanın tespit edilmesi. b) Bir finansal sistemin tasarım ve uygulamasına katıldıktan sonra sistemin işleyişi hakkında rapor verilmesi, c) Bir sözleşmenin esas konusu olan kayıtların üretilmesinde kullanılan ilk verilerin bağımsız çalışan meslek mensubu tarafından hazırlamış olması. ç) Güvence sağlama sözleşmesi ekibinin bir üyesinin daha önceden o müşterinin çalışanı olması. d) Güvence sağlama sözleşmesi ekibinin bir üyesinin halen veya yakın geçmişte müşteri tarafından sözleşmenin…"},{"ad":"TÜRMOB Etik İlkeler Yön. EK bolum 8","metin":"TÜRMOB - Mesleki Faaliyetlerde Uyulacak Etik İlkeler Hakkında Yönetmelik (RG 19.10.2007, Sayı 26675). EK: Etik İlkeler (m.29-30) [İKİNCİ KISIM: Bağımsız Çalışan Meslek Mensuplarının Uyacakları Etik İlkeler / BİRİNCİ BÖLÜM: Giriş] MADDE 29 – İş çevresinde firma çapında alınabilecek önlemler şunlar olabilir: a) Firmanın temel etik ilkelere uyumun önemini vurgulamak. b) Güvence sağlama sözleşmesi ekibinin kamu çıkarına uygun hareket edeceği yönünde bir beklentinin oluşmasını sağlamak. c) Sözleşmelerde kalite kontrolü uygulanması ve izlenmesini sağlayacak politika ve süreçler. ç) Tehditlerin belirlenmesi, bu tehditlerin önem derecesinin değerlendirilmesi, önemsiz olanlar dışındaki tehditleri ortadan kaldıracak veya kabul edilebilir düzeye indirecek önlemlerin belirlenmesi ve uygulanmasına ilişkin belgeye dayalı politikalar. d) Güvence sağlama sözleşmelerini kullanan firmalar için bağımsızlığa yönelik tehditlerin ve bu tehditlerin önem derecesinin belirlenmesi, tehditleri (önemsiz olanlar dışındaki) yok edecek veya kabul edilebilir düzeye indirecek önlemlerin değerlendirilmesi ve uygulanmasına yönelik belgeye dayalı bağımsızlık politikaları. e) Temel etik ilkelere uyum gerektiren belgeye dayalı iç politika ve süreçler. f) Firma veya sözleşme ekibi üyeleri ve müşteriler arasındaki çıkar ilişkilerinin belirlenmesini sağlayacak politika ve süreçler. g) Tek bir müşteriden elde edilen gelirin izlenmesi ve gerektiğinde bu gelire olan bağımlılığın yönetilmesini sağlayacak politika ve süreçler. ğ) Sözleşme ekibinin üyesi olmayan kişilerin sözleşmenin sonucunu uygunsuz bir biçimde etkile…"}],"hakem":"Kaynakta TÜRMOB Etik İlkeler Yönetmeliği Madde 25/b\u0027de, daha düşük ücret ödenmesi için sunulan hizmetin kapsamının uygunsuz biçimde azaltılması yönünde baskıya maruz kalınmanın yıldırma tehdidi örneği olduğu açıkça belirtilmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Azledilme veya görevden alma tehdidi gerçekten yıldırma örneğidir ancak konusu ücret değil işten çıkarılmadır; soru ücretle ilgili olanı ister.","E":"Üst düzey kişi ile müşteri arasında uzun süreli arkadaşlık ilişkisi yakınlık tehdidine örnek olup ücretle hiçbir ilgisi yoktur.","D":"Şarta bağlı ücretler ücretle ilgili gibi görünür ama bu da kişisel çıkar tehdidi kapsamında değerlendirilir, yıldırma değildir.","A":"Tek müşteriden gelen ücrete aşırı bağlı olmak ücretle ilgili gibi görünür ama bu kişisel çıkar tehdididir, yıldırma değildir."},"dogru":"Müşteri daha az para ödenmesi için hizmetin kapsamını küçültmesi yönünde baskı yapıyorsa bu yıldırma tehdididir. Meslek mensubu işini yapamayacak duruma getirilmeye zorlanır. B şıkkı tam olarak bunu anlatır.","sinav":"TÜRMOB Mesleki Faaliyetlerde Uyulacak Etik İlkeler Hakkında Yönetmelik Madde 25.","kavramlar":[{"kaynak":"TÜRMOB Etik İlkeler Yön. EK bolum 6","tanim":"Meslek mensubunu uygunsuz davranışa zorlayan veya karşı koyamayacak duruma getiren baskı ve tehditlerdir. Ücretle ilgili olduğunda hizmet kapsamının baskıyla küçültülmesi örnek verilir.","ad":"Yıldırma tehdidi"},{"kaynak":"TÜRMOB Etik İlkeler Yön. EK bolum 6","tanim":"Meslek mensubunun kendi çıkarı veya müşterisi ile ortak çıkarı nedeniyle bağımsızlığını kaybetme riskidir. Tek müşteriye aşırı bağımlılık veya şarta bağlı ücretler örnek verilir.","ad":"Kişisel çıkar tehdidi"},{"kaynak":"TÜRMOB Etik İlkeler Yön. EK bolum 6","tanim":"Meslek mensubu veya ekip üyesinin müşteri işletme yöneticisi, çalışanı veya yönetim kurulu üyesi ile yakın ilişki kurması nedeniyle bağımsızlığını kaybetme riskidir.","ad":"Yakınlık tehdidi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2026/1","2025/1"]},"oyun":null,"tip":"teori","soru":"Etik İlkeler Yönetmeliği\u0027ne göre, meslek mensubunun ücretiyle ilgili olup yıldırma tehdidi örneği sayılan durum aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-meslek-cokzor/kp-04","verilenler":[],"dayanak":"TÜRMOB Etik İlkeler Yönetmeliği Ek m.25/b (ücretle ilgili yıldırma tehdidi), karşılaştırma için m.21/b, m.21/e, m.25/a, m.24/d","dogru":"B","oyunBonus":null,"ders":"Meslek Hukuku","adimlar":[{"formul":"Olay: Bir bağımsız denetim firmasında müşteri, 2024 yılı denetim ücretini 150.000 TL\u0027den 90.000 TL\u0027ye düşürmek istiyor ve bunun için \u0027stok sayım kontrollerini kapsam dışı bırakın\u0027 diye baskı yapıyor.","anlatim":"Müşteri para kazanmak için işin kapsamını küçültmeye çalışıyor. Denetçi bu baskıyla karşı karşıya kalıyor.","doldur":[]},{"formul":"Ne yapacağız: bu olayda beş farklı tehdit türünü tek tek deneyeceğiz; hangisi \u0027ücretle ilgili yıldırma tehdidi\u0027 tanımına uyuyor bulacağız.","anlatim":"Kişisel çıkar, yakınlık, taraf tutma ve yıldırma tehditleri birbirine benzer ama kaynağı farklı. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.21/b","karar":"yanlış","anlatim":"Burada baskı yok, sadece ekonomik bağımlılık var. Bu kişisel çıkar tehdidi sayılır, yıldırma değil.","formul":"Şık A: denetçi \u0027bu müşteriden gelen ücret toplam gelirimin çoğunu oluşturuyor, ona bağımlı kaldım\u0027 diyor, bu yıldırma tehdidi mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.25/b","karar":"doğru","anlatim":"Tam da olayımızdaki durum bu. Düşük ücret için hizmet kapsamının uygunsuzca kısılması yönetmelikte açıkça yıldırma tehdidi örneğidir.","formul":"Şık B: müşteri \u0027ücreti düşüreyim de stok sayımını kapsam dışı bırak\u0027 diye baskı yapıyor, sen bunu yıldırma tehdidi sayar mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.25/a","karar":"yanlış","anlatim":"Burada tehdit görevden alınma, ücret konusu geçmiyor. Bu ayrı bir yıldırma örneği ama ücret örneği değil.","formul":"Şık C: müşteri \u0027kapsamı azaltmazsan seni azlederim, işi başka firmaya veririm\u0027 diyor, bu da ücretle mi ilgili?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.21/e","karar":"yanlış","anlatim":"Şarta bağlı ücret dışarıdan gelen bir baskı değil, denetçinin kendi çıkarına bağlılık riski taşır. Bu kişisel çıkar tehdididir.","formul":"Şık D: sözleşmede \u0027denetim sonucuna göre ücret ödenecek\u0027 şartı var, bu şarta bağlı ücret yıldırma mı sayılır?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.24/d","karar":"yanlış","anlatim":"Burada ekonomik baskı yok, kişisel yakınlık var. Bu yakınlık tehdidi başlığına girer, ücretle ilgisi yoktur.","formul":"Şık E: üst düzey personel müşteri yöneticisiyle yıllardır arkadaş, bu durum ücretle ilgili yıldırma mı olur?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru cevap, ücret düşürülsün diye iş kapsamının baskıyla daraltılması olayıdır. Kendine hep şunu sor: bu baskı doğrudan ücret ve iş kapsamını mı hedefliyor, yoksa başka bir çıkar veya ilişkiyi mi?","doldur":[]}],"anahtar":[{"ornek":"tehdidi","kok":"tehdid"},{"ornek":"yıldırma","kok":"yıldır"},{"ornek":"kapsamının","kok":"kapsam"},{"ornek":"kişisel","kok":"kişise"},{"ornek":"daraltılması","kok":"daralt"},{"ornek":"yakınlık","kok":"yakınl"}],"konuGiris":{"harita":"Ne zaman test edilir: sınavda beş tehdit türünden (kişisel çıkar, tekrar değerlendirme, taraf tutma, yakınlık, yıldırma) hangisine hangi örneğin girdiği sorulduğunda. Nasıl ölçülür: verilen somut durumun madde 21-25\u0027teki hangi maddenin örneği olduğu eşleştirilerek. Nasıl kaydedilir: doğru tehdit adı (burada \u0027yıldırma tehdidi\u0027) seçilerek işaretlenir.","desen":"Sınav genelde beş tehdit türünü karıştırıp öğrenciye bir örnek verir ve hangi başlığa girdiğini sorar. Tuzak, \u0027ücrete aşırı bağlılık\u0027 (kişisel çıkar) ile \u0027azledilme/kapsam azaltma tehdidi\u0027 (yıldırma) örneklerinin birbirine benzetilmesidir. Bu soru madde 25\u0027teki yıldırma tehdidi örneklerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Ücret veya görev nedeniyle meslek mensubunun baskı ile yönlendirilmesi riski","ad":"Yıldırma tehdidi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Sözleşmenin sona erdirilmesiyle korkutularak baskı yapılması","ad":"Azledilme tehdidi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Daha düşük ücret için hizmet kapsamının uygunsuz azaltılması yönünde baskı","ad":"Ücret kapsamı baskısı","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Ücrete aşırı bağlılık veya finansal çıkar paylaşımı riski","ad":"Kişisel çıkar tehdidi","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soruda meslek mensubunun ücretiyle ilgili bir baskı durumu tanımlanır, öğrenciden bu durumun hangi tehdit türüne girdiği istenir.","panel_ornek":"Bir usta, işi bitirmeden önce müşterisinden \u0027ücretini düşür yoksa başka ustayla anlaşırım\u0027 tehdidini alır. Ya da müşteri, ustanın yapacağı işin kapsamını daraltıp daha az para ödemek için baskı yapar. Bu, işini düzgün yapmak isteyen ustayı korkutup geri adım attırma çabasıdır.","ornek":"Bir usta, işi bitirmeden önce müşterisinden \u0027ücretini düşür yoksa başka ustayla anlaşırım\u0027 tehdidini alır. Ya da müşteri, ustanın yapacağı işin kapsamını daraltıp daha az para ödemek için baskı yapar. Bu, işini düzgün yapmak isteyen ustayı korkutup geri adım attırma çabasıdır.","yontemler":"Beş tehdit başlığını (kişisel çıkar, tekrar değerlendirme, taraf tutma, yakınlık, yıldırma) ezberleyip her birine bir anahtar kelime bağlamak en hızlı yoldur; \u0027azledilme\u0027 ve \u0027ücret kapsamı azaltma\u0027 kelimeleri doğrudan yıldırmayı işaret eder.","nedir":"Bu konu, meslek mensubunun ücret konusunda müşteri baskısı altında kalıp bağımsızlığını kaybetme risklerini tanımlar. Sınav, hangi somut örneğin \u0027yıldırma tehdidi\u0027 başlığına girdiğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Aynı Madde Tuzağı","metin":"Bu da yıldırma tehdidi olduğundan doğru sanılır ama konusu ücret değil, azil ve görevden alma tehdididir. Doğrusu: Ücretle ilgisi olmayan bir yıldırma örneğidir, soru ücretle ilgili olanı ister."},"E":{"ad":"Tehdit Türü Karışıklığı Tuzağı","metin":"Ücretle bağlantılı sanılabilir ama arkadaşlık ilişkisi yakınlık tehdidine örnektir, ücretle hiçbir ilgisi yoktur. Doğrusu: Bu, sorulan ücretle ilgili yıldırma örneği değildir."},"D":{"ad":"Şarta Bağlı Ücret Tuzağı","metin":"Ücretle ilgili olduğu için yıldırma sanılır ama şarta bağlı ücret düzenlemesi kişisel çıkar tehdidi başlığı altında sayılır. Doğrusu: Bu durum yıldırma değil kişisel çıkar tehdidine örnektir."},"A":{"ad":"Kişisel Çıkar Tuzağı","metin":"Ücretle ilgili olduğu için yıldırma sanılır ama bu, tek müşteriden gelen ücrete bağımlılık hâlidir. Doğrusu: Bu durum kişisel çıkar tehdidi örneğidir, yıldırma değildir."}},"celdiriciYol":null,"hap":"Ücretle ilgili tehditlerde, ücrete bağımlılık ve şarta bağlı ücret kişisel çıkar tehdidi; düşük ücret için hizmetin daraltılması yönündeki baskı ise yıldırma tehdididir.","teshis":{"C":{"gercek":"Madde 25/a azledilme veya görevden alınma tehdidini düzenler; ücret konusu geçmez.","ayirt":"Tehdidin doğrudan konusu ücret mi, yoksa görevde kalıp kalmama mı?","paragraf":"m.25/a","yanilgi":"Aynı maddede geçtiği için bunu da ücretle ilgili sanıyorsun."},"E":{"gercek":"Madde 24/d uzun süreli arkadaşlık ilişkisini yakınlık tehdidi başlığında düzenler, ücretle ilgisi yoktur.","ayirt":"Bu durumun kaynağı kişisel yakınlık mı, ekonomik/baskı unsuru mu?","paragraf":"m.24/d","yanilgi":"Kişisel ilişkiyi de ücretle bağlantılı bir tehdit sanıyorsun."},"A":{"gercek":"Madde 21/b\u0027ye göre tek müşteriden gelen ücrete aşırı bağlılık kişisel çıkar tehdididir; yıldırma başka maddededir.","ayirt":"Bu durum meslek mensubunun bağımsızlığını bir müşteriye ekonomik bağımlılıkla mı, yoksa dışarıdan gelen baskıyla mı zedeliyor?","paragraf":"m.21/b","yanilgi":"Ücretle ilgili her örneği otomatik olarak yıldırma tehdidi sayıyorsun."},"D":{"gercek":"Madde 21/e şarta bağlı ücretleri kişisel çıkar tehdidi örnekleri arasında sayar.","ayirt":"Bu durum dışarıdan gelen bir baskı mı, yoksa meslek mensubunun kendi çıkarına bağlılığı mı?","paragraf":"m.21/e","yanilgi":"Şarta bağlı ücreti, baskı unsuru olduğu için yıldırma tehdidi sanıyorsun."},"B":{"gercek":"Madde 25/b, düşük ücret ödensin diye hizmet kapsamının uygunsuzca daraltılmasını doğrudan yıldırma tehdidi olarak sayar.","ayirt":"Baskının konusu doğrudan ücret ve iş kapsamı mı?","paragraf":"m.25/b","yanilgi":"Bu şıkkı es geçip daha tanıdık görünen azil tehdidini seçme eğilimindesin."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 103"},"kural":"3568 sayılı Kanunun 46 ncı maddesine göre yeni tarifenin tasdikine kadar mevcut tarife hükmü uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 103","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Tarife sürecinde \u0027kim kime gönderir, kim onaylar\u0027 zincirini (oda→Birlik→Maliye Bakanlığı→Resmi Gazete) sırayla kur, hangi şıkta bir aşama atlanmış onu ara.","konu":"ücret tarifesi esasları","tablo":{"satirlar":[["A) Yeni tarife tasdik edilinceye kadar mevcut tarife hükmün…","3568 s.K. m.46","doğru ifade"],["B) Oda yönetim kurullarınca hazırlanan tarifeler, Birliğe g…","3568 s.K. m.46","YANLIŞ ifade"],["C) Tarifedeki asgari miktarın altında ücret karşılığında iş…","3568 s.K. m.46","YANLIŞ ifade"],["D) Oda yönetim kurulları tarifelerini her yıl aralık ayında…","3568 s.K. m.46","YANLIŞ ifade"],["E) Birlik yönetim kurulunca hazırlanan tarife, Maliye Bakan…","3568 s.K. m.46","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Tarifedeki asgari miktarın altında ücret karşılığında iş kabul edilmesi meslek mensubunun tercihine bırakılmıştır.","E":"Birlik yönetim kurulunca hazırlanan tarife, Maliye Bakanlığının onayı aranmaksızın Resmi Gazete\u0027de yayımlanır.","A":"Yeni tarife tasdik edilinceye kadar mevcut tarife hükmünün uygulanmasına devam olunur.","D":"Oda yönetim kurulları tarifelerini her yıl aralık ayından geçerli olmak üzere hazırlayarak Birliğe gönderir.","B":"Oda yönetim kurullarınca hazırlanan tarifeler, Birliğe gönderilmeksizin doğrudan Resmi Gazete\u0027de yayımlanarak yürürlüğe girer."},"kaynak":{"alinti":"Yeni tarifenin tasdikine kadar mevcut tarife hükmü uygulanır","liste":[{"ad":"SMMM K. (3568 s.K.) m.46","metin":"Madde 46 – Ücret meslek mensuplarının hizmetlerine karşılık olan meblağı ifade eder. Ücretin asgari miktarı tarife ile belirlenir. Tarifedeki asgari miktar altında ücret karşılığında iş kabulü yasak olup, aksine hareket disiplin cezasını gerektirir. Her odanın yönetim kurulu, her yıl ocak ayından geçerli olmak üzere (…)21 serbest muhasebeci mali müşavirler ve yeminli mali müşavirlerin yapacakları iş ve işlemler karşılığında alacakları ücretleri gösterir birer tarife hazırlayarak Birliğe gönderir. Birlik yönetim kurulu, oda yönetim kurullarının tekliflerini de gözönüne almak suretiyle çeşitli odaları içine alacak grupları tespit ve gruplarda uygulanacak tarifeleri hazırlayarak Maliye Bakanlığına gönderir. Maliye Bakanlığı tarifeyi aynen veya gerekli gördüğü değişikliklerle tasdik eder. Tarifeler Resmi Gazete\u0027de yayımlanarak yürürlüğe girer. Yeni tarifenin tasdikine kadar mevcut tarife hükmü uygulanır. Görevle ilgili suçlar"}],"hakem":"Doğru sık, 3568 sayılı Kanun m.46\u0027da açıkça yer alan \u0027Yeni tarifenin tasdikine kadar mevcut tarife hükmü uygulanır\u0027 kuralına tamamen uyuyor."},"kayitlar":[],"sade":{"siklar":{"C":"Tarifedeki asgari miktarın altında iş kabulü yasaktır ve disiplin cezasını gerektirir; meslek mensubunun tercihine bırakılmamıştır.","E":"Birlik yönetim kurulunun hazırladığı tarife Maliye Bakanlığınca tasdik edildikten sonra Resmi Gazete\u0027de yayımlanır; onay olmaksızın yürürlüğe girmez.","D":"Tarife her yıl ocak ayından geçerli olmak üzere hazırlanır; aralık ayından değil.","B":"Oda tarifesi doğrudan Resmi Gazete\u0027ye gitmez; önce Birliğe, sonra Maliye Bakanlığına gönderilir ve orada onaylanıp yayımlanır."},"dogru":"Yeni tarife onaylanıncaya kadar eski tarife geçerli kalır. Böylece meslek mensupları belirsizlik yaşamaz. Kanun, hizmetlerin ücretini kesintisiz biçimde düzenlemek ister.","sinav":"Serbest Muhasebeci Mali Müşavirlik ve Yeminli Mali Müşavirlik Kanunu 46. madde","kavramlar":[{"kaynak":"SMMM K. 46. madde","tanim":"Meslek mensuplarının hizmetlerine karşılık olan meblağdır.","ad":"Ücret"},{"kaynak":"SMMM K. 46. madde","tanim":"Serbest muhasebeci mali müşavirler ve yeminli mali müşavirlerin yapacakları iş ve işlemler karşılığında alacakları ücretleri gösteren belgedir.","ad":"Tarife"},{"kaynak":"SMMM K. 46. madde","tanim":"Tarife ile belirlenen ve altında iş kabulü yasak olan ücretin en düşük miktarıdır.","ad":"Asg lık-Resmi Gazete sıralaması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Her odanın yönetim kurulunun ocak ayı için hazırlayıp Birliğe gönderdiği taslak","ad":"Oda tarifesi teklifi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Birlik yönetim kurulunun oda tekliflerini birleştirip Bakanlığa gönderdiği grup tarifesi","ad":"Birlik tarifesi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Maliye Bakanlığının tarifeyi aynen veya değiştirerek onaylaması","ad":"Bakanlık tasdiki","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Tarifedeki alt sınırın altında iş kabulünün yasak olduğu kural","ad":"Asgari ücret sınırı","kim":"kanun sabitler"}],"sinavda":"Tarifenin hazırlanma ve yürürlüğe girme sürecine dair doğru sıralamayı seçmesi istenir.","panel_ornek":"Bir apartman yönetimi her yıl ocak ayında aidat listesini hazırlar, sonra bunu bölge yöneticisine onaya gönderir. Yönetici de son halini ilan panosuna aşar ve o tarihten sonra geçerli olur. Yeni liste asılana kadar eski aidat tutarı uygulanmaya devam eder.","ornek":"Bir apartman yönetimi her yıl ocak ayında aidat listesini hazırlar, sonra bunu bölge yöneticisine onaya gönderir. Yönetici de son halini ilan panosuna aşar ve o tarihten sonra geçerli olur. Yeni liste asılana kadar eski aidat tutarı uygulanmaya devam eder.","yontemler":"Sıralamayı oda→Birlik→Bakanlık→Resmi Gazete olarak ezberlemek tek kritik kuraldır.","nedir":"Ücret tarifesi, meslek mensuplarının alacağı asgari ücreti gösteren resmi belgedir. Sınav bu tarifenin hazırlanış ve yürürlüğe giriş sırasını ölçer."},"olay":"","tuzak":{"C":{"ad":"Serbestlik Tuzağı","metin":"asgari ücretin altında iş kabulünün meslek mensubunun kendi tercihi olduğunu sanırsın. Doğrusu: tarifedeki asgari miktarın altında iş kabulü yasaktır ve disiplin cezasını gerektirir."},"E":{"ad":"Onay Mercii Tuzağı","metin":"Birlik tarifesinin Maliye Bakanlığı onayına ihtiyaç duymadan yürürlüğe
