ğlanmalıdır. Kongre, Mustafa Kemal başkanlığında DOKUZ KİŞİLİK TEMSİL HEYETİ seçti. ÖNEMİ: Millî sınır, millî egemenlik ve manda reddi ilk kez kongre kararıyla ilan edildi; Sivas Kongresi\u0027nin ve Misak-ı Millî\u0027nin temelini oluşturdu; Mustafa Kemal ilk kez sivil bir önder olarak millî hareketin başına geçti. SINAV TUZAĞI: (1) Erzurum BÖLGESEL toplandı ama ULUSAL karar aldı; Sivas ise ulusal nitelikte toplandı. (2) \u0027Manda ve himaye kabul edilemez\u0027 kararı ilk kez Erzurum\u0027da alındı, Sivas\u0027ta kesin olarak reddedildi. (3) Temsil Heyeti Erzurum\u0027da …"}],"hakem":"Soru Erzurum Kongresi konusunu doğru ölçüyor, kaynak metinde \u0027DOKUZ KİŞİLİK TEMSİL HEYETİ\u0027 açıkça belirtilmiş, Sivas\u0027ta 16\u0027ya çıkarıldığı da kaynakta yer almıştır."},"kayitlar":[],"sade":{"siklar":{"C":"Erzurum\u0027daki heyet sayısını Sivas\u0027taki on altı sayısıyla karıştıran aday bu şıkkı yanlış sanır; doğrusu Erzurum\u0027da dokuz kişi seçilmiştir.","A":"Tarih bilgisini hatırlayamayan aday bu tarihi Sivas Kongresi\u0027nin Eylül ayındaki tarihiyle karıştırır; oysa Erzurum gerçekten Temmuz-Ağustos 1919\u0027da toplanmıştır.","D":"Manda ve himaye reddinin ne zaman ilk yapıldığını unutmuş aday bunu seçer; oysa ilk kez Erzurum Kongresi\u0027nde açıkça reddedilmiştir.","B":"Kongre bölgesel toplandığını okuyup kararlarının da bölgesel olduğunu zanneden aday bunu seçer; gerçekte ulusal nitelikteki (millî sınır, millî irade) kararlar alınmıştır."},"dogru":"Erzurum Kongresi\u0027nde dokuz kişilik Temsil Heyeti seçildi. Bu sayı Sivas Kongresi\u0027nde on altıya çıkarıldı. E şıkkı Erzurum\u0027da üye sayısının on altı olduğunu söylediği için yanlıştır.","sinav":"Erzurum Kongresi\u0027nde seçilen Temsil Heyeti\u0027nin üye sayısı dokuz olup, bu sayı Sivas Kongresi\u0027nde on altıya çıkarılmıştır.","kavramlar":[{"kaynak":"TEORI","tanim":"Millî mücadeleyi yürütmek için seçilen ve Mustafa Kemal başkanlığında çalışan heyet. İstanbul Hükümeti vatanı koruyamazsa millî kongre veya bu heyet geçici bir hükümet kurabilirdi.","ad":"Temsil Heyeti"},{"kaynak":"TEORI","tanim":"Yabancı devletlerin Osmanlı topraklarına müdahale ve işgal etme şekli. Erzurum Kongresi bu uygulamayı ilk kez açıkça reddetti.","ad":"Manda ve himaye"},{"kaynak":"TEORI","tanim":"Halk egemenliğine dayanan, milletin kendi kaderini belirlemesi ilkesi. Erzurum Kongresi\u0027nde bunu hâkim kılmak temel hedef olarak konuldu.","ad":"Millî irade"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2026/1","2017/2"]},"oyun":null,"tip":"teori","soru":"Erzurum Kongresi\u0027nin toplanması, çalışma biçimi ve aldığı kararlarla ilgili aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-05","verilenler":[],"dayanak":"Atatürk İlkeleri ve İnkılap Tarihi - Erzurum Kongresi olay-tarih kaydı (kanun maddesi bulunmaz)","dogru":"E","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Trabzon Muhafaza-i Hukuk Cemiyeti\u0027nin çağrısıyla, 23 Temmuz 1919\u0027da Erzurum\u0027da bir salon dolusu doğu illeri delegesi toplanıyor; askerlikten 8 Temmuz\u0027da istifa eden Mustafa Kemal sivil sıfatla kongre başkanı seçiliyor.","anlatim":"Bu kongre 7 Ağustos 1919\u0027a kadar sürüyor ve sonunda dokuz kişilik bir Temsil Heyeti oluşuyor. Sen bu olayı bir tarih sayfası gibi düşün, her rakam bir iz bırakıyor.","doldur":[]},{"formul":"Ne yapacağız: 23 Temmuz-7 Ağustos tarihi, bölgesel toplanış-ulusal karar ayrımı, dokuz kişilik heyet, manda-himaye reddi ve heyetin sonradan kaç kişiye çıktığı; bu beş bilgiyi olayda tek tek sınayacağız.","anlatim":"Erzurum\u0027un kendine ait rakamları var, Sivas\u0027ın kendine ait. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Olay-tarih kaydı","karar":"doğru","anlatim":"Evet, kongre tam bu tarihler arasında toplandı, kayıt böyle. Bu tarihi Sivas\u0027la karıştırmadığın sürece doğru bilgi bu.","formul":"Şık A: sınav kağıdında 23 Temmuz - 7 Ağustos 1919 tarihi yazıyor, bu tarihi Erzurum Kongresi\u0027ne yapıştırır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Olay-tarih kaydı","karar":"doğru","anlatim":"Katılmazsın, çünkü delegeler doğu illerinden geldi ama millî sınır ve millî irade gibi kararlar tüm ülkeyi bağlıyor. Toplanış bölgesel, kararlar ulusal, ikisi ayrı düzlem.","formul":"Şık B: biri sana \u0027kongre bölgesel toplandı, öyleyse kararları da yerel kalmıştır\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Olay-tarih kaydı","karar":"doğru","anlatim":"Dersin, çünkü Erzurum\u0027da seçilen heyet tam dokuz kişidir. Bu sayı Sivas\u0027ta değişecek ama Erzurum\u0027daki gerçek bu.","formul":"Şık C: Mustafa Kemal başkanlığında seçilen Temsil Heyeti\u0027nin kaç kişi olduğunu soruyorlar, dokuz der misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Olay-tarih kaydı","karar":"doğru","anlatim":"Verirsin, çünkü bu ret ilk kez Erzurum kararlarında açıkça yazıyor. Sivas bunu kesinleştirir ama ilk söz Erzurum\u0027un.","formul":"Şık D: \u0027manda ve himaye ilk kez burada açıkça reddedildi\u0027 diyen bir cümleye onay verir misin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Olay-tarih kaydı","karar":"yanlış","anlatim":"Yapıştırmazsın, çünkü on altıya çıkma olayı Sivas Kongresi\u0027nde gerçekleşti. Erzurum\u0027da heyet dokuz kişide kaldı, on altı başka bir kongrenin rakamı.","formul":"Şık E: \u0027kongre sonunda Temsil Heyeti üye sayısı on altıya çıkarıldı\u0027 cümlesini Erzurum\u0027a yapıştırır mısın?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Yanlış olan tek şık, Sivas\u0027a ait on altı rakamını Erzurum\u0027a yapıştıran E\u0027ydi. Kendine hep şunu sor: bu sayı veya tarih Erzurum\u0027a mı yoksa Sivas\u0027a mı ait?","doldur":[]}],"anahtar":[{"ornek":"erzurum","kok":"erzuru"},{"ornek":"kongresi","kok":"kongre"},{"ornek":"kişilik","kok":"kişili"},{"ornek":"heyeti","kok":"heyeti"},{"ornek":"altıya","kok":"altıya"},{"ornek":"temsil","kok":"temsil"}],"konuGiris":{"harita":"Ne zaman test edilir: Erzurum ile Sivas Kongresi\u0027nin toplanış biçimi ve karar sayısı karşılaştırılırken test edilir. Nasıl ölçülür: kongrenin bölgesel/ulusal niteliği, aldığı kararlar ve Temsil Heyeti üye sayısıyla ölçülür. Nasıl kaydedilir: doğru bilgi \u0027Erzurum Kongresi kararları\u0027 ve \u0027Temsil Heyeti 9 kişi\u0027 şeklinde tarihsel olgu olarak kayda geçer.","desen":"Sınav genelde Erzurum ile Sivas Kongresi\u0027nin toplanış biçimini (bölgesel/ulusal) ve Temsil Heyeti sayısını (9/16) karıştırarak sorar. Bazı sorularda \u0027manda ve himaye ilk kez hangi kongrede reddedildi\u0027 tuzağı kurulur, cevap Erzurum\u0027dur. Bu soru p.28\u0027deki kongre kararları ve özellikleri noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"kongrenin sadece Doğu illerinden delegelerle yapılması","ad":"Bölgesel toplanış","kim":"Doğu Anadolu Müdafaa-i Hukuk Cemiyeti belirler"},{"kaynak":"kuraldan bilinir","tanim":"yabancı devlet koruyuculuğunun kesin olarak kabul edilmemesi kararı","ad":"Manda ve himaye reddi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"kongrenin seçtiği dokuz kişilik geçici yürütme kurulu","ad":"Temsil Heyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Kuva-yı Milliye\u0027yi etken, halkın iradesini hakim kılma ilkesi","ad":"Millî irade","kim":"kanun sabitler"}],"sinavda":"Kongrenin toplanma tarihi, katılımcı yapısı ve aldığı kararlardan biri verilir; bunlardan hangisinin yanlış/doğru olduğu sorulur.","panel_ornek":"Bir arkadaş grubu sadece kendi mahallesindeki 5 kişiyle toplanıp apartman yönetimi için karar alsa ama bu karar tüm şehirdeki benzer apartmanlara örnek olsa, toplanış küçük ama etkisi geneldir. Erzurum Kongresi de böyle işlemiştir; katılım bölgesel, karar ulusaldır.","ornek":"Bir arkadaş grubu sadece kendi mahallesindeki 5 kişiyle toplanıp apartman yönetimi için karar alsa ama bu karar tüm şehirdeki benzer apartmanlara örnek olsa, toplanış küçük ama etkisi geneldir. Erzurum Kongresi de böyle işlemiştir; katılım bölgesel, karar ulusaldır.","yontemler":"Erzurum\u0027u Sivas\u0027tan ayıran temel iki kural: toplanış bölgesel-ulusal karşıtlığı ve Temsil Heyeti sayısı (9 - 16) ezberlenmelidir.","nedir":"Erzurum Kongresi, Millî Mücadele\u0027nin bölgesel toplanıp ulusal karar aldığı ilk büyük kongredir. Sınav burada toplanış biçimini, kararları ve Temsil Heyeti sayısını Sivas Kongresi ile karıştırmadan bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Heyet Sayısı Karıştırma Tuzağı","metin":"Öğrenci Erzurum\u0027daki heyet sayısını Sivas\u0027taki on altı kişilik heyetle karıştırıp bunu yanlış sanır. Doğrusu: Erzurum Kongresi\u0027nde dokuz kişilik Temsil Heyeti seçilmiştir, ifade doğrudur."},"A":{"ad":"Tarih Karıştırma Tuzağı","metin":"Öğrenci bu tarihi Sivas Kongresi\u0027nin 4-11 Eylül 1919 tarihiyle karıştırıp yanlış sanır. Doğrusu: Erzurum Kongresi gerçekten 23 Temmuz - 7 Ağustos 1919 tarihleri arasında toplanmıştır, ifade doğrudur."},"D":{"ad":"İlk Reddediş Şüphesi Tuzağı","metin":"Öğrenci manda-himaye reddinin ilk kez Sivas Kongresi\u0027nde yapıldığını sanır. Doğrusu: Manda ve himaye ilk kez Erzurum Kongresi\u0027nde açıkça reddedilmiştir, ifade doğrudur."},"B":{"ad":"Bölgesel-Ulusal Karıştırma Tuzağı","metin":"Öğrenci \u0027bölgesel toplandı\u0027 sözünü kararların da bölgesel kaldığı anlamına gelir sanır. Doğrusu: Kongre bölgesel toplanmış ama millî sınır ve millî irade gibi ulusal nitelikli kararlar almıştır, ifade doğrudur."}},"celdiriciYol":null,"hap":"Erzurum Kongresi\u0027nde dokuz kişilik Temsil Heyeti seçilmiştir; bu sayı Sivas Kongresi\u0027nde on altıya çıkarılmıştır.","teshis":{"C":{"gercek":"Erzurum Kongresi\u0027nde dokuz kişilik Temsil Heyeti seçilmiş, Sivas Kongresi\u0027nde bu sayı on altıya çıkarılmıştır.","ayirt":"Bu sayı hangi kongreye ait, dokuz mu on altı mı?","paragraf":"Olay-tarih kaydı","yanilgi":"Erzurum\u0027daki heyet sayısını Sivas\u0027taki on altı kişilik heyetle karıştırıp bu sayıyı yanlış sanıyorsun."},"E":{"gercek":"Temsil Heyeti üye sayısı Erzurum Kongresi\u0027nde dokuz, Sivas Kongresi\u0027nde on altıdır; bu şık ikisini karıştırarak yanlış bilgi verir.","ayirt":"Verilen sayı Erzurum\u0027a mı Sivas\u0027a mı ait, dokuz mu on altı mı?","paragraf":"Olay-tarih kaydı","yanilgi":"Bu şıkkı elersen, Temsil Heyeti sayısının kongreler arasında değişmediğini sanıyorsun demektir."},"A":{"gercek":"Erzurum Kongresi 23 Temmuz - 7 Ağustos 1919, Sivas Kongresi ise 4-11 Eylül 1919 tarihleri arasında toplanmıştır.","ayirt":"Bu tarih hangi kongreye ait, ikisini yan yana koyup karşılaştırdım mı?","paragraf":"Olay-tarih kaydı","yanilgi":"Erzurum ile Sivas Kongresi\u0027nin tarihlerini karıştırıp bu tarihi yanlış sanıyorsun."},"D":{"gercek":"Manda ve himaye ilkesi ilk kez açıkça Erzurum Kongresi\u0027nde reddedilmiştir.","ayirt":"\u0027İlk kez\u0027 ifadesi hangi kongreye ait olayı işaret ediyor?","paragraf":"Olay-tarih kaydı","yanilgi":"Manda-himaye reddinin ilk kez Sivas Kongresi\u0027nde yapıldığını sanıyorsun."},"B":{"gercek":"Erzurum Kongresi toplanış bakımından bölgesel, millî sınır ve millî irade gibi kararları bakımından ulusaldır.","ayirt":"Kongrenin toplanış biçimiyle aldığı kararların kapsamını ayrı ayrı mı değerlendirdim?","paragraf":"Olay-tarih kaydı","yanilgi":"\u0027Bölgesel toplandı\u0027 ifadesinden kararların da yerel kaldığını sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 19"},"kural":"Terakkiperver Cumhuriyet Fırkası\u0027nın programındaki \u0027dinî inançlara saygılıyız\u0027 maddesinin isyancılarca istismar edildiği gerekçesiyle bu parti Takrir-i Sükûn Kanunu\u0027na dayanılarak kapatılmıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 19","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Hükümet-kanun ve parti-akıbet eşleşmelerini olay sırasına göre tek tek kontrol et; tarih karşılaştırması yanlış şıkları hemen eler.","konu":"takrir-i sükûn kanunu","tablo":{"satirlar":[["A) Kanun, Fethi (Okyar) Bey hükümeti tarafından çıkarılmışt…","Olay-tarih sırası","YANLIŞ ifade"],["B) Kanuna dayanılarak Serbest Cumhuriyet Fırkası kapatılmış…","Parti-kapanış eşleşmesi","YANLIŞ ifade"],["C) Kanunun yürürlükte kalacağı süreye bir sınır konulmamışt…","Süre bilgisi","YANLIŞ ifade"],["D) Şeyh Sait İsyanı, bu kanun yürürlüğe girdikten sonra baş…","Tarih sırası","YANLIŞ ifade"],["E) Kanuna dayanılarak Terakkiperver Cumhuriyet Fırkası kapa…","Sonuçlar bölümü","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kanunun yürürlükte kalacağı süreye bir sınır konulmamıştır.","E":"Kanuna dayanılarak Terakkiperver Cumhuriyet Fırkası kapatılmıştır.","A":"Kanun, Fethi (Okyar) Bey hükümeti tarafından çıkarılmıştır.","D":"Şeyh Sait İsyanı, bu kanun yürürlüğe girdikten sonra başlamıştır.","B":"Kanuna dayanılarak Serbest Cumhuriyet Fırkası kapatılmıştır."},"kaynak":{"alinti":"nun siyasi sonuçlarını ölçüyor ve doğru sık (E), kaynakta açıkça belirtilen Terakkiperver Cumhuriyet Fırkası","liste":[{"ad":"TEORI - takrir-i sukun kanunu","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: 13 ŞUBAT 1925\u0027te Doğu Anadolu\u0027da ŞEYH SAİT İSYANI çıktı; isyan hem dinî hem bölücü nitelikliydi ve Musul sorununun görüşüldüğü dönemde İngiltere\u0027nin işine geldi. Fethi (Okyar) Bey hükümeti isyana karşı yumuşak bulununca istifa etti, yerine İSMET PAŞA hükümeti kuruldu. Yeni hükümet 4 MART 1925\u0027te TAKRİR-İ SÜKÛN KANUNU\u0027nu (Huzurun Sağlanması Kanunu) çıkardı. İÇERİĞİ: Hükümete, ülkenin toplumsal düzenini, huzurunu ve güvenliğini bozmaya yönelik her türlü örgüt, kışkırtma, girişim ve yayını, cumhurbaşkanının onayıyla idari kararla yasaklama yetkisi verildi; suçlular İSTİKLAL MAHKEMELERİ\u0027ne verilecekti (biri isyan bölgesinde, biri Ankara\u0027da). Kanun iki yıl süreliydi, 1927\u0027de iki yıl daha uzatılıp 1929\u0027da yürürlükten kalktı. UYGULAMA VE SONUÇLAR: İsyan kısa sürede bastırıldı, elebaşları Diyarbakır\u0027da idam edildi. Muhalefetteki TERAKKİPERVER CUMHURİYET FIRKASI, programındaki \u0027dinî inançlara saygılıyız\u0027 maddesinin isyancılarca kullanıldığı gerekçesiyle 3 HAZİRAN 1925\u0027te kapatıldı; ülke tek partili yönetime döndü (1930 Serbest Fırka denemesine kadar). Muhalif basının önemli bölümü kapatıldı. İnkılaplar (şapka, tekke ve zaviyelerin kapatılması, Medeni Kanun) bu kanunun sağladığı ortamda hızla gerçekleştirildi. Musul görüşmelerinde Türkiye\u0027nin eli zayıfladı. SINAV TUZAĞI: (1) Takrir-i Sükûn\u0027u çıkaran İsmet Paşa hükümetidir; Fethi Bey hükümeti isyan yüzünden düşmüştür. (2) Terakkiperver Fırka Takrir-i Sükûn\u0027a dayanılarak KAPATILDI; Serbest Fırka ise 1930\u0027da kendini FESHETTİ. (3) Kanun geçicidir (1925–1929). SINAVDA NASIL SO…"}],"hakem":"Soru Takrir-i Sükûn Kanunu\u0027nun siyasi sonuçlarını ölçüyor ve doğru sık (E), kaynakta açıkça belirtilen Terakkiperver Cumhuriyet Fırkası\u0027nın 3 Haziran 1925\u0027te bu kanuna dayanılarak kapatılması kuralını doğru ve tek anlamlı şekilde ifade ediyor."},"kayitlar":[],"sade":{"siklar":{"C":"Kanun 1925\u0027te iki yıl için çıkarılmış, 1927\u0027de uzatılmış ve 1929\u0027da yürürlükten kalkmıştır; geçici bir düzenlemedir.","A":"Fethi Bey hükümeti isyana karşı yumuşak davrandığı için istifa etti; kanunu onun yerini alan İsmet Paşa hükümeti çıkardı.","D":"Şeyh Sait İsyanı 13 Şubat 1925\u0027te başlamıştır; kanun bu isyan üzerine 4 Mart 1925\u0027te çıkarılmıştır.","B":"Serbest Cumhuriyet Fırkası 1930\u0027da kendi isteğiyle feshedildi; Takrir-i Sükûn ile kapatılan parti Terakkiperver Cumhuriyet Fırkası\u0027dır."},"dogru":"Terakkiperver Cumhuriyet Fırkası, programındaki dinî inançlara saygı maddesinin isyancılarca istismar edildiği gerekçesiyle 3 Haziran 1925\u0027te bu kanuna dayanılarak kapatılmıştır.","sinav":"Takrir-i Sükûn Kanunu\u0027na dayanılarak Terakkiperver Cumhuriyet Fırkası kapatılmıştır.","kavramlar":[{"kaynak":"TEORI","tanim":"Dönemin muhalefet partisi olup, programında dinî inançlara saygı hükmü bulunan ve Takrir-i Sükûn Kanunu\u0027na dayanılarak 1925\u0027te kapatılan siyasi örgüttür.","ad":"Terakkiperver Cumhuriyet Fırkası"},{"kaynak":"TEORI","tanim":"Takrir-i Sükûn Kanunu\u0027na dayanılarak ülkenin düzenini bozmaya yönelik suçluların yargılanması için kurulan, biri isyan bölgesinde biri Ankara\u0027da olmak üzere iki ayrı mahkemedir.","ad":"İstiklal Mahkemeleri"},{"kaynak":"TEORI","tanim":"13 Şubat 1925\u0027te Doğu Anadolu\u0027da çıkan, hem dinî hem bölücü niteliği olan ve Takrir-i Sükûn Kanunu\u0027nun çıkarılmasına neden olan isyandır.","ad":"Şeyh Sait İsyanı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2026/1","2024/1"]},"oyun":null,"tip":"teori","soru":"4 Mart 1925\u0027te çıkarılan Takrir-i Sükûn Kanunu ile ilgili aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-02","verilenler":[],"dayanak":"TESMER Atatürk İlkeleri ve İnkılap Tarihi konu anlatımı - Takrir-i Sükûn Kanunu ve Terakkiperver Cumhuriyet Fırkası\u0027nın kapatılması","dogru":"E","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 13 Şubat 1925\u0027te Şeyh Sait İsyanı çıkıyor, Fethi Bey hükümeti yumuşak bulunup istifa ediyor, yerine İsmet Paşa hükümeti kuruluyor ve 4 Mart 1925\u0027te Takrir-i Sükûn Kanunu çıkıyor.","anlatim":"Bu olay gerçek: isyan, hükümet değişimi, sonra kanun. 3 Haziran 1925\u0027te de bir parti bu kanunla kapatılıyor. Bu tek olayda beş şıkkı test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: kanunu çıkaran hükümet, kapatılan parti, süresi ve isyanla tarih sırası - bu dört noktayı olaydaki rakamlarla kontrol edeceğiz.","anlatim":"Kural şu: kanunu istifa eden değil, yeni kurulan İsmet Paşa hükümeti çıkardı ve kanun 1925-1929 arası geçerliydi. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Olay-tarih sırası","karar":"yanlış","anlatim":"Fethi Bey hükümeti isyana yumuşak kaldığı için istifa etti, kanunu çıkaran o değil. Yerine kurulan İsmet Paşa hükümeti çıkardı. Bu yüzden A yanlış.","formul":"Şık A: \u0027Kanunu Fethi Bey hükümeti çıkardı\u0027 diyorsun, doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Parti-kapanış eşleşmesi","karar":"yanlış","anlatim":"Serbest Fırka 1930\u0027da kendi kendini feshetti, kanunla kapatılmadı. Kapatılan parti başkasıdır. B yanlış.","formul":"Şık B: \u0027Serbest Cumhuriyet Fırkası bu kanunla kapatıldı\u0027 diyorsun, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Süre bilgisi","karar":"yanlış","anlatim":"Kanun iki yıl süreliydi, sonra bir kez uzatıldı ve 1929\u0027da tamamen kalktı. Süresiz değil, tam tersine belirli süreli. C yanlış.","formul":"Şık C: \u0027Kanunun süresine sınır konulmadı\u0027 diyorsun, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Tarih sırası","karar":"yanlış","anlatim":"İsyan 13 Şubat 1925\u0027te, kanun ise 4 Mart 1925\u0027te çıktı. Yani isyan önce, kanun sonra geldi. D yanlış.","formul":"Şık D: \u0027Şeyh Sait İsyanı kanun çıktıktan sonra başladı\u0027 diyorsun, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Sonuçlar bölümü","karar":"doğru","anlatim":"Bu partinin \u0027dinî inançlara saygılıyız\u0027 maddesi isyancılarca kullanıldı diye 3 Haziran 1925\u0027te kanuna dayanılarak kapatıldı. E doğru.","formul":"Şık E: \u0027Terakkiperver Cumhuriyet Fırkası bu kanuna dayanılarak kapatıldı\u0027 diyorsun, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Tek doğru E, çünkü Terakkiperver Fırka gerçekten bu kanunla kapatıldı. Kendine hep şunu sor: kapatılan parti mi, kendi feshedilen parti mi?","doldur":[]}],"anahtar":[{"ornek":"kapatılmış","kok":"kapatı"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"kanunu","kok":"kanunu"},{"ornek":"hükümet","kok":"hüküme"},{"ornek":"cumhuriyet","kok":"cumhur"},{"ornek":"kanunla","kok":"kanunl"}],"konuGiris":{"harita":"Ne zaman çıkarıldı: Şeyh Sait İsyanı üzerine 4 Mart 1925\u0027te İsmet Paşa hükümeti tarafından çıkarılmıştır. Ne öngörür: Cumhurbaşkanı onayıyla düzeni bozan örgüt ve yayınları yasaklama yetkisi ve İstiklal Mahkemeleri\u0027ni içerir. Ne sonuç verdi: Terakkiperver Fırka\u0027nın kapatılması ve inkılapların hızlanması gibi sonuçlar doğurmuştur.","desen":"Sorular çoğunlukla kanunu çıkaran hükümeti (Fethi Bey değil İsmet Paşa) ve Terakkiperver Fırka\u0027nın kapatılma/fesih ayrımını karıştırır. Bazı sorular kanunun geçici (1925-1929) niteliğini kalıcı bir düzenlemeymiş gibi sunar. Bu soru p.28\u0027deki olay-tarih-sonuç sıralaması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Düzeni bozan örgüt, kışkırtma ve yayınları idari kararla yasaklayan geçici kanun","ad":"Takrir-i Sükûn Kanunu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kanuna göre suçluları yargılayan, isyan bölgesi ve Ankara\u0027da kurulan mahkemeler","ad":"İstiklal Mahkemeleri","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Dinî inançlara saygı maddesi isyancılarca kullanılan, kapatılan muhalefet partisi","ad":"Terakkiperver Cumhuriyet Fırkası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1925\u0027te çıkıp 1927\u0027de uzatılan, 1929\u0027da kalkan geçici uygulama süresi","ad":"Kanunun süresi","kim":"kanun sabitler"}],"sinavda":"Soruda kanunun çıkış tarihi ve olayı verilir, doğru sonuç ya da doğru hükümet seçenekler arasından istenir.","panel_ornek":"Bir apartman yönetimi, gece gürültü şikayetleri artınca \u0027saat 22\u0027den sonra ortak alanda toplanma yasak\u0027 diye geçici bir karar alır ve bu kararı 3 ay sürdürür. Karara uymayan 2 daire sakini yönetime hesap vermek zorunda kalır. Sonra dönem bitince karar kalkar ve eski düzene dönülür.","ornek":"Bir apartman yönetimi, gece gürültü şikayetleri artınca \u0027saat 22\u0027den sonra ortak alanda toplanma yasak\u0027 diye geçici bir karar alır ve bu kararı 3 ay sürdürür. Karara uymayan 2 daire sakini yönetime hesap vermek zorunda kalır. Sonra dönem bitince karar kalkar ve eski düzene dönülür.","yontemler":"Fethi Bey-İsmet Paşa geçişini ve Terakkiperver Fırka\u0027nın \u0027kapatıldı\u0027 (Serbest Fırka \u0027feshedildi\u0027) ayrımını ezberle; en kritik kural bu ikisini karıştırmamaktır.","nedir":"Takrir-i Sükûn Kanunu, Şeyh Sait İsyanı sonrası hükümete düzeni bozan örgüt ve yayınları yasaklama yetkisi veren geçici bir kanundur. Sınav bu kanunun çıkış sebebini, kapsamını ve sonuçlarını (özellikle Terakkiperver Fırka\u0027nın kapatılmasını) ayırt edip edemediğini ölçer."},"olay":"-","tuzak":{"C":{"ad":"Süre Tuzağı","metin":"Kanunun kalıcı bir düzenleme olduğunu sanıyorsun. Doğrusu: Kanun 1925\u0027te iki yıl süreyle çıkarılmış, 1927\u0027de uzatılmış ve 1929\u0027da yürürlükten kalkmıştır."},"A":{"ad":"Hükümet Tuzağı","metin":"Fethi Bey hükümetinin isyana yumuşak yaklaştığı gerekçesiyle istifa ettiğini, kanunu ise ardından kurulan İsmet Paşa hükümetinin çıkardığını karıştırıyorsun. Doğrusu: Takrir-i Sükûn Kanunu\u0027nu İsmet Paşa hükümeti çıkarmıştır."},"D":{"ad":"Olay Sırası Tuzağı","metin":"Kanunun isyanı doğurduğunu sanıyorsun, oysa neden-sonuç tersinedir. Doğrusu: Şeyh Sait İsyanı 13 Şubat 1925\u0027te başlamış, kanun bu isyan üzerine 4 Mart 1925\u0027te çıkarılmıştır."},"B":{"ad":"Parti Karıştırma Tuzağı","metin":"Serbest Cumhuriyet Fırkası\u0027nın 1930\u0027da kendi isteğiyle feshedildiğini, Takrir-i Sükûn ile kapatılan partiyle karıştırıyorsun. Doğrusu: Bu kanuna dayanılarak kapatılan parti Terakkiperver Cumhuriyet Fırkası\u0027dır."}},"celdiriciYol":{},"hap":"Takrir-i Sükûn Kanunu\u0027na dayanılarak Terakkiperver Cumhuriyet Fırkası kapatılmış, Serbest Cumhuriyet Fırkası ise kendi isteğiyle feshedilmiştir.","teshis":{"C":{"gercek":"Kanun 1925-1929 arasında geçerli olmuş, sonra yürürlükten kaldırılmıştır.","ayirt":"Bu kanunun bir bitiş tarihi var mıydı?","paragraf":"Süre bilgisi","yanilgi":"Olağanüstü bir kanunun süresiz olabileceğini düşünüyorsun."},"E":{"gercek":"Terakkiperver Cumhuriyet Fırkası, programındaki madde isyancılarca kullanıldığı gerekçesiyle 3 Haziran 1925\u0027te bu kanuna dayanılarak kapatılmıştır.","ayirt":"Kapatılan parti hangisiydi, feshedilen hangisiydi?","paragraf":"Sonuçlar bölümü","yanilgi":"Bu şıkkı eleyen öğrenci, kapatılan partinin Serbest Fırka olduğunu sanır."},"A":{"gercek":"Fethi Bey hükümeti isyan yüzünden istifa etmiş, kanunu yerine kurulan İsmet Paşa hükümeti çıkarmıştır.","ayirt":"İstifa eden hükümetle onun yerine geleni karıştırıyor muyum?","paragraf":"Olay-tarih sırası","yanilgi":"İsyana karşı yumuşak bulunup istifa eden hükümetin aynı zamanda sert kanunu çıkardığını sanıyorsun."},"D":{"gercek":"Şeyh Sait İsyanı 13 Şubat 1925\u0027te başlamış, kanun bu isyan üzerine 4 Mart 1925\u0027te çıkarılmıştır.","ayirt":"Hangisi önce oldu: isyan mı kanun mu?","paragraf":"Tarih sırası","yanilgi":"Kanunun isyanı tetiklediğini, yani sonucu neden sanıyorsun."},"B":{"gercek":"Serbest Cumhuriyet Fırkası 1930\u0027da kendini feshetmiş, Terakkiperver Fırka ise 1925\u0027te Takrir-i Sükûn\u0027a dayanılarak kapatılmıştır.","ayirt":"Bu parti kendi mi kapandı, yoksa kanunla mı kapatıldı?","paragraf":"Parti-kapanış eşleşmesi","yanilgi":"Aynı dönemde adı geçen iki muhalefet partisinin akıbetini birbirine karıştırıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 17"},"kural":"Medeni Kanun kadına özel hukuk alanında (medeni) haklar tanımış, siyasal haklar ayrı kanunlarla 1930 (belediye) ve 1934 (milletvekili) yıllarında verilmiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 17","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Gerçekleşmemiştir\u0027 sorularında dört şık gerçek bilgidir, biri konu dışıdır; medeni hak ile siyasal hak ayrımını arayın.","konu":"türk medeni kanunu","tablo":{"satirlar":[["VERİLENLER","-","-"],["Türk Medeni Kanunu\u0027nun kabul tarihi - Gün","17","-"],["HESAP","-","-"],["A) Evliliklerde resmî nikâhın zorunlu hale getirilmesi","TMK getirileri","doğru ifade"],["B) Mirasta kadın ile erkek arasındaki eşitliğin sağlanması","TMK getirileri","doğru ifade"],["C) Kadınlara milletvekili seçme ve seçilme hakkının tanınması","kadın hakları kronolojisi (1934)","YANLIŞ ifade"],["D) Kadına boşanma davası açma hakkının tanınması","TMK getirileri","doğru ifade"],["E) Mahkemelerde tanıklık bakımından kadın-erkek eşitliğinin…","TMK getirileri","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kadınlara milletvekili seçme ve seçilme hakkının tanınması","E":"Mahkemelerde tanıklık bakımından kadın-erkek eşitliğinin sağlanması","A":"Evliliklerde resmî nikâhın zorunlu hale getirilmesi","D":"Kadına boşanma davası açma hakkının tanınması","B":"Mirasta kadın ile erkek arasındaki eşitliğin sağlanması"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Esya kavrami ve esya turleri (medeni hukuk)","metin":"Hukuki anlamda EŞYA, üzerinde mülkiyet ve sınırlı aynı hak kurulabilen, kişi dışındaki, maddi varlığı olan ve hâkimiyet altına alınabilen (sınırlandırılabilen) cisimdir. Bir varlığın eşya sayılabilmesi için dört nitelik aranır: (1) maddi (cismani) varlığa sahip olmak, (2) üzerinde hâkimiyet kurulabilir olmak, (3) sınırları belirlenebilir/ayrılabilir olmak, (4) kişi dışı olmak (insan bedeni ve organları eşya değildir). Hava, güneş ışığı ve açık deniz gibi hâkimiyet altına alınamayan unsurlar ile fikri haklar, alacak hakları ve elektrik-doğalgaz gibi enerjiler dar anlamda eşya sayılmaz; ancak enerjiler hakkında taşınır hükümleri kıyasen uygulanır. EŞYA TÜRLERİ: TAŞINIR-TAŞINMAZ (taşınmazlar: arazi, tapu kütüğünde ayrı sayfaya kaydedilen bağımsız ve sürekli haklar, kat mülkiyeti kütüğüne kayıtlı bağımsız bölümler; bunun dışındaki nakledilebilir eşya ile edinmeye elverişli doğal güçler taşınırdır); MİSLİ-GAYRİMİSLİ (piyasada sayı, ölçü, tartı ile belirlenip yerine aynı nitelikte başkası konabilen eşya mislidir); TÜKETİLEN-TÜKETİLMEYEN (kullanımıyla tükenen ya da nitelik değiştiren eşya tüketilen eşyadır); BÖLÜNEBİLEN-BÖLÜNEMEYEN (bölündüğünde ekonomik değerini ve niteliğini yitirmeyen eşya bölünebilirdir); BASİT-BİRLEŞİK EŞYA ve EŞYA BİRLİKLERİ; SAHİPLİ-SAHİPSİZ EŞYA. Ayrıca eşyanın hukuki kaderini paylaşan unsurlar bakımından BÜTÜNLEYİCİ PARÇA (asıl şey yok edilmedikçe, zarara uğratılmadıkça ondan ayrılamayan parça; asıl şeye ilişkin tasarruflar bütünleyici parçayı da kapsar) ile EKLENTİ (asıl şeyin işletilmesi/korunması için sürekli olarak özgülenen, bağımsızlığını koruyan ya…"},{"ad":"TEORI - turk medeni kanunu","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Türk Medeni Kanunu 17 ŞUBAT 1926\u0027da TBMM\u0027de kabul edildi, 4 EKİM 1926\u0027da yürürlüğe girdi. İSVİÇRE MEDENİ KANUNU örnek alındı; seçilme nedenleri: en yeni ve en demokratik medeni kanun olması, sorunlara akılcı ve pratik çözümler getirmesi, laik yapısı, kadın-erkek eşitliğine yakınlığı ve Adalet Bakanı Mahmut Esat Bozkurt\u0027un İsviçre\u0027de hukuk eğitimi almış olması. Yerini aldığı düzen: Osmanlı\u0027da din ve mezhebe göre değişen, Ahmet Cevdet Paşa başkanlığında hazırlanmış MECELLE ve şer\u0027î hukuk. GETİRDİKLERİ: Tek eşlilik (çok eşlilik yasaklandı); evlilikte RESMÎ NİKÂH zorunluluğu ve evlenmede kadın-erkek yaş eşitliği; kadına boşanma davası açma hakkı, mirasta kadın-erkek eşitliği, mahkemede tanıklıkta eşitlik; kadına istediği mesleği seçme hakkı; velayet ve mal edinme haklarında eşitlik; patrikhanelerin dünyevî yetkileri kaldırılarak azınlıklar da aynı kanuna tabi tutuldu (azınlıklar Lozan\u0027daki özel hukuk haklarından vazgeçti). SONUÇ: Hukuk birliği sağlandı, toplumsal hayat laikleşti, kadının toplumsal statüsü yükseldi; bu adım kadınlara 1930 belediye, 1934 milletvekili seçme ve seçilme haklarının zeminini hazırladı. 1926 Kanunu 2002\u0027de yürürlüğe giren 4721 sayılı Türk Medeni Kanunu ile yenilendi. SINAV TUZAĞI: (1) Kaynak İsviçre\u0027dir; Ceza Kanunu İtalya\u0027dan, Ticaret Kanunu Almanya\u0027dan alınmıştır, sınav bunları karıştırır. (2) Medeni Kanun kadına SİYASAL hak vermedi; siyasal haklar 1930 ve 1934\u0027te ayrı kanunlarla geldi. (3) Kabul tarihi Şubat, yürürlük Ekim 1926\u0027dır. SINAVDA NASIL SORULUR: \u0027Türk Medeni Kanunu ile aşağıdak…"}],"hakem":"Soru, Türk Medeni Kanunu\u0027nun gerçekleştirdiği ve gerçekleştirmediği değişiklikleri ölçmekte; doğru sık (C), Medeni Kanun ile değil 1934 tarihli ayrı kanunla sağlanan milletvekili seçme-seçilme hakkını işaret ederek sorunun tanımladığı kural ile tam uyumludur."},"kayitlar":[],"sade":{"siklar":{"D":"Kadına boşanma davası açma hakkı 1926 Türk Medeni Kanunu\u0027nun doğrudan sağladığı haklardandır; siyasal haklarla karıştırılmamalıdır.","E":"Mahkemede tanıklıkta kadın-erkek eşitliği 1926 Türk Medeni Kanunu ile sağlanmıştır; Mecelle döneminden kalma bir uygulama değildir.","A":"Resmî nikâhın zorunlu hale getirilmesi doğrudan 1926 Türk Medeni Kanunu\u0027nun hükümleridir; Cumhuriyet\u0027in sonraki yıllarına ait ayrı bir düzenleme değildir.","B":"Mirasta kadın-erkek eşitliği 1926 Türk Medeni Kanunu\u0027nun doğrudan getirdiği haklardandır; örf-adet değişimi değildir."},"dogru":"Kadınlara milletvekili seçme ve seçilme hakkı 1926 Medeni Kanunu ile değil, 1934 yılında kabul edilen ayrı bir kanunla verilmiştir. Medeni Kanun sadece özel hukuk alanında (evlilik, miras, tanıklık gibi) haklar tanımış; siyasal haklar daha sonraki kanunlarla gelmiştir.","sinav":"Kadınlara milletvekili seçme ve seçilme hakkı Türk Medeni Kanunu ile değil 1934 tarihli ayrı bir kanunla tanınmıştır.","kavramlar":[]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2026/2","2015/3"]},"oyun":null,"tip":"teori","soru":"17 Şubat 1926\u0027da kabul edilen Türk Medeni Kanunu, aile ve miras hukukunda kadın-erkek eşitliğini büyük ölçüde sağlamıştır. Aşağıdakilerden hangisi bu Kanun ile GERÇEKLEŞMEMİŞTİR?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-03","verilenler":[{"deger":"17","anlam":"Türk Medeni Kanunu\u0027nun kabul edildiği günü gösteren sayı; kanunun yürürlüğe girme tarihini belirtir.","ad":"Türk Medeni Kanunu\u0027nun kabul tarihi - Gün"}],"dayanak":"İnkılap Tarihi konu özeti - Türk Medeni Kanunu (1926) getirileri ve kadın haklarının kronolojisi (1930/1934 seçme-seçilme kanunları)","dogru":"C","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Ayşe Hanım 1927\u0027de kocasını Mecelle döneminde açamayacağı bir davayla mahkemeye götürüyor, boşanma davası açıyor; 1935\u0027te de sandığa gidip milletvekili seçiyor.","anlatim":"Aynı kadın, aynı ülke, ama iki farklı hak iki farklı kanundan geliyor. Biri 1926\u0027nın Medeni Kanun\u0027undan, öbürü 1934\u0027ün ayrı kanunundan.","doldur":[]},{"formul":"Ne yapacağız: 1926 Türk Medeni Kanunu Ayşe Hanım\u0027a hangi hakları verdi, hangisini vermedi, bunu net çizeceğiz.","anlatim":"Kanun aile ve miras hukukunda (özel hukuk) eşitlik getirdi ama oy hakkı gibi siyasal hakları içermedi. Şimdi beş ifadeyi Ayşe Hanım\u0027ın olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"TMK getirileri","karar":"doğru","anlatim":"Evet, resmî nikâh zorunluluğu 1926 Kanunu\u0027nun doğrudan getirdiği bir düzenleme. Ayşe Hanım\u0027ın evliliği bu yüzden resmî.","formul":"Şık A: Ayşe Hanım imam nikâhıyla değil resmî nikâhla evlendi, bunu Medeni Kanun mu zorunlu kıldı?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"TMK getirileri","karar":"doğru","anlatim":"Evet, Mecelle\u0027deki şer\u0027î mirasa son verilip kadın-erkek mirasta eşitlendi. Ayşe Hanım kardeşiyle aynı payı alıyor.","formul":"Şık B: Ayşe Hanım\u0027ın babasından kalan mirası kardeşiyle eşit paylaşması Medeni Kanun\u0027un eseri mi?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"kadın hakları kronolojisi (1934)","karar":"yanlış","anlatim":"Hayır, bu siyasal bir hak ve Medeni Kanun\u0027la ilgisi yok. Bu hak 1934\u0027te ayrı bir kanunla geldi, Ayşe Hanım\u0027ın oy hakkı Medeni Kanun\u0027un ürünü değil.","formul":"Şık C: Ayşe Hanım\u0027ın 1935\u0027te sandığa girip milletvekili seçmesi, bu hakkı Medeni Kanun mu verdi?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"TMK getirileri","karar":"doğru","anlatim":"Evet, boşanma davası açma hakkı Kanun\u0027un aile hukukundaki eşitlik hükümlerinden biri. Ayşe Hanım bu hakla mahkemeye gidebildi.","formul":"Şık D: Ayşe Hanım kocasına boşanma davası açtı, bu hakkı Medeni Kanun mu tanıdı?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"TMK getirileri","karar":"doğru","anlatim":"Evet, Mecelle döneminde tanıklık dinî-mezhep esasına göre değişirken Kanun bunu eşitledi. Ayşe Hanım\u0027ın tanıklığı artık erkeğinkiyle aynı değerde.","formul":"Şık E: Ayşe Hanım mahkemede tanıklık ederken kocasıyla eşit ağırlıkta sayıldı, bu eşitliği Medeni Kanun mu getirdi?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Medeni Kanun aileyi ve mirası düzenledi ama sandığa hiç dokunmadı. Kendine hep şunu sor: bu hak aile-miras mı, yoksa seçme-seçilme mi?","doldur":[]}],"anahtar":[{"ornek":"medeni","kok":"medeni"},{"ornek":"haklar","kok":"haklar"},{"ornek":"siyasal","kok":"siyasa"},{"ornek":"kanunlarla","kok":"kanunl"},{"ornek":"kanunu","kok":"kanunu"},{"ornek":"düzenleme","kok":"düzenl"}],"konuGiris":{"harita":"Ne zaman test edilir: Medeni Kanun\u0027un tarihi, kaynağı ve getirdiği haklar sayıldığında hangisinin dışarıda kaldığı sorulduğunda test edilir. Nasıl ölçülür: \u0027gerçekleşmemiştir\u0027 ya da \u0027hangi ülkeden alınmıştır\u0027 sorularıyla ölçülür. Nasıl kaydedilir: kadın-erkek eşitliğinin aile-miras alanında mı yoksa siyasal alanda mı olduğu ayrımıyla kaydedilir.","desen":"Sınav en çok \u0027siyasal hak verildi\u0027 yanılgısını tuzak yapar; oysa siyasal haklar 1930 ve 1934\u0027te ayrı kanunlarla gelmiştir. İkinci tuzak kaynak ülke karışıklığıdır: Ceza Kanunu İtalya\u0027dan, Ticaret Kanunu Almanya\u0027dan alınmıştır, Medeni Kanun İsviçre\u0027dendir. Bu soru arşivde 2 dönemde bu tuzaklardan geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kanun 17 Şubat 1926\u0027da kabul edildi, 4 Ekim 1926\u0027da yürürlüğe girdi","ad":"Kabul-yürürlük tarihi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Türk Medeni Kanunu\u0027nun örnek alındığı kaynak kanun","ad":"İsviçre Medeni Kanunu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Boşanma, miras, tanıklık, velayet alanlarında kadın-erkek eşitliği sağlandı","ad":"Aile-miras eşitliği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Seçme-seçilme hakkı Medeni Kanun\u0027la değil 1930-1934 ayrı kanunlarla geldi","ad":"Siyasal haklar","kim":"kanun sabitler"}],"sinavda":"Soruda Medeni Kanun\u0027un getirdiği haklar sayılır ve hangisinin gerçekleşmediği veya kaynağının hangi ülke olduğu sorulur.","panel_ornek":"Bir apartman yönetimi eskiden sadece erkek kat sahiplerine oy hakkı verirken yeni yönetim planıyla kadın-erkek tüm 12 daire sahibi eşit oy hakkı kazanır. Ama bina dışındaki muhtarlık seçimine katılma hakkı ayrı bir yönetmelikle sonradan gelir. Bu, kanunun neyi kapsayıp neyi kapsamadığını anlamana benzer.","ornek":"Bir apartman yönetimi eskiden sadece erkek kat sahiplerine oy hakkı verirken yeni yönetim planıyla kadın-erkek tüm 12 daire sahibi eşit oy hakkı kazanır. Ama bina dışındaki muhtarlık seçimine katılma hakkı ayrı bir yönetmelikle sonradan gelir. Bu, kanunun neyi kapsayıp neyi kapsamadığını anlamana benzer.","yontemler":"Eleme yöntemiyle aile-miras alanındaki eşitlik maddelerini gerçek, siyasal hak maddesini gerçekleşmemiş say.","nedir":"Bu konu Türk Medeni Kanunu\u0027nun getirdiği hak ve eşitlikleri anlatır; sınav kanunun neyi sağlayıp neyi sağlamadığını ölçer."},"olay":"yok.","tuzak":{"D":{"ad":"Hak Karıştırma Tuzağı","metin":"Boşanma davası açma hakkını siyasal haklarla aynı döneme ait sanıp bu şıkkı seçersin. Doğrusu: Kadına boşanma davası açma hakkı Türk Medeni Kanunu\u0027nun doğrudan getirdiği bir haktır."},"E":{"ad":"Kaynak Karıştırma Tuzağı","metin":"Tanıklıkta eşitliği Mecelle döneminden kalma bir uygulama sanırsın. Doğrusu: Mahkemede tanıklıkta kadın-erkek eşitliği Türk Medeni Kanunu ile sağlanmıştır."},"A":{"ad":"Zamanlama Tuzağı","metin":"Resmî nikâhı Cumhuriyet\u0027in ilerleyen yıllarına ait ayrı bir düzenleme sanıp bu şıkkı \u0027gerçekleşmemiş\u0027 seçersin. Doğrusu: Resmî nikâh zorunluluğu doğrudan 1926 Türk Medeni Kanunu ile getirilmiştir."},"B":{"ad":"Kapsam Tuzağı","metin":"Mirasta eşitliği Medeni Kanun\u0027dan bağımsız bir örf-adet değişimi sanırsın. Doğrusu: Mirasta kadın-erkek eşitliği doğrudan Türk Medeni Kanunu\u0027nun getirdiği haklardandır."}},"celdiriciYol":{"D":"Aynı paragraftaki gerçek Medeni Kanun getirisi, öğrenci bunu siyasal haklarla aynı döneme yerleştirir (hak türü karıştırma)","E":"Aynı paragraftaki gerçek Medeni Kanun getirisi, öğrenci bunu Mecelle dönemine ait sanır (dönem karıştırma)","A":"Aynı paragraftaki gerçek Medeni Kanun getirisi, öğrenci tarihini karıştırıp \u0027sonradan gelmiş\u0027 sanır (zamanlama karıştırma)","B":"Aynı paragraftaki gerçek Medeni Kanun getirisi, öğrenci bunu kanundan bağımsız toplumsal değişim sayar (kaynak karıştırma)"},"hap":"Türk Medeni Kanunu kadına özel hukuk (medeni) haklar verdi; siyasal haklar (seçme-seçilme) ayrı kanunlarla 1930 ve 1934\u0027te tanındı.","teshis":{"C":{"gercek":"Türk Medeni Kanunu özel hukuk alanında eşitlik sağlamıştır; siyasal haklar (seçme-seçilme) 1930 ve 1934\u0027te ayrı kanunlarla tanınmıştır.","ayirt":"Bu hak oy verme/seçilme ile mi ilgili, yoksa aile-miras hukuku ile mi ilgili?","paragraf":"İnkılap Tarihi konu özeti - kadın hakları kronolojisi (1926/1930/1934)","yanilgi":"Medeni Kanun\u0027un kadına verdiği tüm eşitliklerin siyasal hakları da kapsadığını sanıyorsun."},"E":{"gercek":"Mecelle döneminde mahkemede tanıklık dinen/mezhep esasına göre farklılaşırken, Türk Medeni Kanunu bu alanda eşitlik getirmiştir.","ayirt":"Bu uygulama Mecelle\u0027de mi vardı, yoksa Medeni Kanun\u0027un yeniliği mi?","paragraf":"İnkılap Tarihi konu özeti - Türk Medeni Kanunu getirileri","yanilgi":"Tanıklıkta eşitliğin Osmanlı döneminden devam eden bir uygulama olduğunu sanıyorsun."},"A":{"gercek":"Resmî nikâh zorunluluğu ve evlenmede yaş eşitliği, 1926 Türk Medeni Kanunu\u0027nun doğrudan getirdiği düzenlemelerdendir.","ayirt":"Bu hak, Medeni Kanun\u0027un kabul yılı olan 1926\u0027da mı yürürlüğe girdi?","paragraf":"İnkılap Tarihi konu özeti - Türk Medeni Kanunu getirileri","yanilgi":"Resmî nikâhın Medeni Kanun\u0027dan sonraki bir dönemde ayrı bir yasayla geldiğini düşünüyorsun."},"D":{"gercek":"Kadına boşanma davası açma hakkı, Medeni Kanun\u0027un kadın-erkek eşitliğine yakın İsviçre modelinden gelen doğrudan bir düzenlemesidir.","ayirt":"Bu hak 1926\u0027daki Medeni Kanun metninde mi yer alır?","paragraf":"İnkılap Tarihi konu özeti - Türk Medeni Kanunu getirileri","yanilgi":"Boşanma davası açma hakkının siyasal haklarla birlikte 1930\u0027larda geldiğini düşünüyorsun."},"B":{"gercek":"Mirasta kadın-erkek eşitliği, Mecelle\u0027deki şer\u0027î mirasa son veren Türk Medeni Kanunu\u0027nun temel hükümlerindendir.","ayirt":"Bu eşitlik Mecelle döneminde mi vardı, yoksa Medeni Kanun ile mi geldi?","paragraf":"İnkılap Tarihi konu özeti - Türk Medeni Kanunu getirileri","yanilgi":"Mirasta eşitliğin toplumsal bir gelenek değişimi olduğunu, kanunla bağlantısını göz ardı ediyorsun."}},"verilen":[[1,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 17"},"kural":"Türk Medeni Kanunu, Osmanlı döneminden kalan Mecelle ve şer\u0027î hukukun yerine geçerek mirasta, boşanmada ve mahkemede tanıklıkta kadın-erkek eşitliğini getirmiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 17","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıkta tarih, kaynak ülke ve hak türünü (siyasal mı medeni mi) ayrı ayrı kontrol et; tek kelimelik hata tüm cümleyi yanlış yapar.","konu":"türk medeni kanunu","tablo":{"satirlar":[["A) 4 Ekim 1926\u0027da TBMM\u0027de kabul edilmiş, 17 Şubat 1926\u0027da y…","p.Kronoloji","YANLIŞ ifade"],["B) İtalyan Ceza Kanunu esas alınarak hazırlanmıştır.","p.Kaynak Ülke","YANLIŞ ifade"],["C) Kabulüyle birlikte kadınlara milletvekili seçme ve seçil…","p.Kadın Hakları Kronolojisi","YANLIŞ ifade"],["D) Mecelle\u0027nin yerini alarak mirasta ve tanıklıkta kadın-er…","p.Mecelle\u0027nin Yerini Alma","doğru ifade"],["E) Alman Medeni Kanunu örnek alınarak hazırlanmış, Mecelle …","p.Kaynak Ülke ve Mecelle\u0027nin Sonu","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kabulüyle birlikte kadınlara milletvekili seçme ve seçilme hakkı da tanınmıştır.","E":"Alman Medeni Kanunu örnek alınarak hazırlanmış, Mecelle yürürlükte bırakılmıştır.","A":"4 Ekim 1926\u0027da TBMM\u0027de kabul edilmiş, 17 Şubat 1926\u0027da yürürlüğe girmiştir.","D":"Mecelle\u0027nin yerini alarak mirasta ve tanıklıkta kadın-erkek eşitliğini getirmiştir.","B":"İtalyan Ceza Kanunu esas alınarak hazırlanmıştır."},"kaynak":{"alinti":"nun kabulü, yürürlüğü ve getirdiği değişiklikleri ölçmektedir; doğru şık (D) kaynak metinde yer alan","liste":[{"ad":"TEORI - turk medeni kanunu","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Türk Medeni Kanunu 17 ŞUBAT 1926\u0027da TBMM\u0027de kabul edildi, 4 EKİM 1926\u0027da yürürlüğe girdi. İSVİÇRE MEDENİ KANUNU örnek alındı; seçilme nedenleri: en yeni ve en demokratik medeni kanun olması, sorunlara akılcı ve pratik çözümler getirmesi, laik yapısı, kadın-erkek eşitliğine yakınlığı ve Adalet Bakanı Mahmut Esat Bozkurt\u0027un İsviçre\u0027de hukuk eğitimi almış olması. Yerini aldığı düzen: Osmanlı\u0027da din ve mezhebe göre değişen, Ahmet Cevdet Paşa başkanlığında hazırlanmış MECELLE ve şer\u0027î hukuk. GETİRDİKLERİ: Tek eşlilik (çok eşlilik yasaklandı); evlilikte RESMÎ NİKÂH zorunluluğu ve evlenmede kadın-erkek yaş eşitliği; kadına boşanma davası açma hakkı, mirasta kadın-erkek eşitliği, mahkemede tanıklıkta eşitlik; kadına istediği mesleği seçme hakkı; velayet ve mal edinme haklarında eşitlik; patrikhanelerin dünyevî yetkileri kaldırılarak azınlıklar da aynı kanuna tabi tutuldu (azınlıklar Lozan\u0027daki özel hukuk haklarından vazgeçti). SONUÇ: Hukuk birliği sağlandı, toplumsal hayat laikleşti, kadının toplumsal statüsü yükseldi; bu adım kadınlara 1930 belediye, 1934 milletvekili seçme ve seçilme haklarının zeminini hazırladı. 1926 Kanunu 2002\u0027de yürürlüğe giren 4721 sayılı Türk Medeni Kanunu ile yenilendi. SINAV TUZAĞI: (1) Kaynak İsviçre\u0027dir; Ceza Kanunu İtalya\u0027dan, Ticaret Kanunu Almanya\u0027dan alınmıştır, sınav bunları karıştırır. (2) Medeni Kanun kadına SİYASAL hak vermedi; siyasal haklar 1930 ve 1934\u0027te ayrı kanunlarla geldi. (3) Kabul tarihi Şubat, yürürlük Ekim 1926\u0027dır. SINAVDA NASIL SORULUR: \u0027Türk Medeni Kanunu ile aşağıdak…"},{"ad":"TEORI - Esya kavrami ve esya turleri (medeni hukuk)","metin":"Hukuki anlamda EŞYA, üzerinde mülkiyet ve sınırlı aynı hak kurulabilen, kişi dışındaki, maddi varlığı olan ve hâkimiyet altına alınabilen (sınırlandırılabilen) cisimdir. Bir varlığın eşya sayılabilmesi için dört nitelik aranır: (1) maddi (cismani) varlığa sahip olmak, (2) üzerinde hâkimiyet kurulabilir olmak, (3) sınırları belirlenebilir/ayrılabilir olmak, (4) kişi dışı olmak (insan bedeni ve organları eşya değildir). Hava, güneş ışığı ve açık deniz gibi hâkimiyet altına alınamayan unsurlar ile fikri haklar, alacak hakları ve elektrik-doğalgaz gibi enerjiler dar anlamda eşya sayılmaz; ancak enerjiler hakkında taşınır hükümleri kıyasen uygulanır. EŞYA TÜRLERİ: TAŞINIR-TAŞINMAZ (taşınmazlar: arazi, tapu kütüğünde ayrı sayfaya kaydedilen bağımsız ve sürekli haklar, kat mülkiyeti kütüğüne kayıtlı bağımsız bölümler; bunun dışındaki nakledilebilir eşya ile edinmeye elverişli doğal güçler taşınırdır); MİSLİ-GAYRİMİSLİ (piyasada sayı, ölçü, tartı ile belirlenip yerine aynı nitelikte başkası konabilen eşya mislidir); TÜKETİLEN-TÜKETİLMEYEN (kullanımıyla tükenen ya da nitelik değiştiren eşya tüketilen eşyadır); BÖLÜNEBİLEN-BÖLÜNEMEYEN (bölündüğünde ekonomik değerini ve niteliğini yitirmeyen eşya bölünebilirdir); BASİT-BİRLEŞİK EŞYA ve EŞYA BİRLİKLERİ; SAHİPLİ-SAHİPSİZ EŞYA. Ayrıca eşyanın hukuki kaderini paylaşan unsurlar bakımından BÜTÜNLEYİCİ PARÇA (asıl şey yok edilmedikçe, zarara uğratılmadıkça ondan ayrılamayan parça; asıl şeye ilişkin tasarruflar bütünleyici parçayı da kapsar) ile EKLENTİ (asıl şeyin işletilmesi/korunması için sürekli olarak özgülenen, bağımsızlığını koruyan ya…"}],"hakem":"Soru Atatürk İlkeleri ve İnkılap Tarihi dersinin resmi kapsamı içerisinde yer alan 1926 Türk Medeni Kanunu\u0027nun kabulü, yürürlüğü ve getirdiği değişiklikleri ölçmektedir; doğru şık (D) kaynak metinde yer alan \u0027Osmanlı\u0027da din ve mezhebe göre değişen Mecelle ve şer\u0027î hukuk\u0027un yerini aldığı ve \u0027mirasta kadın-erkek eşitliği, mahkemede tanıklıkta eşitlik\u0027 getirdiği bilgisiyle tam uyumludur."},"kayitlar":[],"sade":{"siklar":{"C":"Medeni Kanun kadına medeni haklar verdi ama seçme-seçilme hakkı 1930 ve 1934\u0027te ayrı kanunlarla geldi.","E":"İsviçre Medeni Kanunu örnek alınmıştır ve Mecelle, yeni kanunun yürürlüğe girmesiyle kaldırılmıştır.","A":"Tarihler ters yazılmıştır. Kanun Şubat 1926\u0027de kabul edilip Ekim 1926\u0027da yürürlüğe girmiştir.","B":"Medeni Kanun İsviçre\u0027den alınmıştır; İtalyan Ceza Kanunu başka bir mevzuatın kaynağıdır."},"dogru":"Türk Medeni Kanunu, Osmanlı\u0027da din ve mezhebe göre değişen Mecelle\u0027nin yerini aldı. Mirasta, boşanmada ve mahkemede tanıklıkta kadın-erkek eşitliğini getirdi.","sinav":"Türk Medeni Kanunu kabulüyle mirasta ve tanıklıkta kadın-erkek eşitliğini getirmiş, Mecelle\u0027nin yerini almıştır.","kavramlar":[{"kaynak":"TEORI","tanim":"Osmanlı döneminde Ahmet Cevdet Paşa başkanlığında hazırlanmış, din ve mezhebe göre değişen hukuk düzenidir.","ad":"Mecelle"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2026/2","2015/3"]},"oyun":null,"tip":"teori","soru":"Türk Medeni Kanunu\u0027nun kabulü ve getirdiği değişikliklere ilişkin aşağıdaki bilgilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-cokzor/kp-03","verilenler":[],"dayanak":"İnkılap Tarihi konu özeti - 1926 Türk Medeni Kanunu kabul/yürürlük ve içerik bilgisi","dogru":"D","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: İzmir\u0027deki bir lisede tarih öğretmeni tahtaya yazıyor: \u002717 Şubat 1926 kabul, 4 Ekim 1926 yürürlük, İsviçre örnek alındı, Mecelle tarihe karıştı.\u0027","anlatim":"Öğrenciler bu beş bilgiyi tek tek doğru mu yanlış mı diye tartışıyor. Sınıfta beş farklı öğrenci beş farklı iddia ortaya atıyor. Sen de onların yerine geçip her iddiayı tek tek çözeceksin.","doldur":[]},{"formul":"Ne yapacağız: olayda tarihler, kaynak ülke, Mecelle\u0027nin durumu ve kadın haklarının niteliği net biçimde biliniyor.","anlatim":"Kabul 17 Şubat, yürürlük 4 Ekim 1926; kaynak İsviçre\u0027dir, Mecelle tamamen kalkmıştır. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.Kronoloji","karar":"yanlış","anlatim":"Olayda tam tersi yazıyor: kabul Şubat, yürürlük Ekim\u0027dir. Bu öğrenci tarihleri ters çevirmiş, doğru değil.","formul":"Şık A: bir öğrenci \u0027kabul 4 Ekim, yürürlük 17 Şubat\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.Kaynak Ülke","karar":"yanlış","anlatim":"Olayda İsviçre esas alınmıştır; İtalya sadece Ceza Kanunu\u0027na kaynaklık etmiştir. Bu ifade kanun türünü de kaynağı da karıştırıyor.","formul":"Şık B: başka biri \u0027Medeni Kanun İtalyan Ceza Kanunu\u0027ndan alındı\u0027 diyor, sen ne dersin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.Kadın Hakları Kronolojisi","karar":"yanlış","anlatim":"Olayda bu hak Medeni Kanun\u0027la değil, 1930 ve 1934\u0027teki ayrı kanunlarla gelmiştir. Medeni Kanun sosyal-medeni eşitlik verdi, siyasal hak vermedi.","formul":"Şık C: sınıftaki biri \u0027kabulüyle kadına seçme seçilme hakkı da geldi\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.Mecelle\u0027nin Yerini Alma","karar":"doğru","anlatim":"Olayda tam olarak bu yazıyor: Mecelle kalktı, miras ve tanıklıkta eşitlik geldi. Hiçbir çarpıtma yok, bu ifade doğru.","formul":"Şık D: öğretmen \u0027Mecelle\u0027nin yerini aldı, mirasta ve tanıklıkta kadın-erkek eşit oldu\u0027 diyor, bunu onaylar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.Kaynak Ülke ve Mecelle\u0027nin Sonu","karar":"yanlış","anlatim":"Olayda kaynak İsviçre\u0027dir, Almanya sadece Ticaret Kanunu\u0027na kaynaklık etmiştir. Ayrıca Mecelle tamamen yürürlükten kalkmıştır, birlikte durmamıştır.","formul":"Şık E: son öğrenci \u0027Alman kanunu örnek alındı, Mecelle de yürürlükte kaldı\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Tek doğru cümle Mecelle\u0027nin yerini alıp miras ve tanıklıkta eşitlik getiren cümledir. Kendine hep şunu sor: bu cümlede tarih, ülke ya da hak türü çarpıtılmış mı?","doldur":[]}],"anahtar":[{"ornek":"medeni","kok":"medeni"},{"ornek":"mecelle","kok":"mecell"},{"ornek":"olayda","kok":"olayda"},{"ornek":"İsviçre","kok":"İsviçr"},{"ornek":"kaynak","kok":"kaynak"},{"ornek":"yürürlüğe","kok":"yürürl"}],"konuGiris":{"harita":"Ne zaman yürürlüğe girdi: Kabul 17 Şubat 1926, yürürlük 4 Ekim 1926\u0027dır. Hangi ülkeden alındı: İsviçre Medeni Kanunu örnek alınmıştır, Ceza ve Ticaret kanunlarıyla karıştırılmamalıdır. Neyi değiştirmedi: Kanun kadına siyasal hak vermemiştir, bu haklar 1930 ve 1934\u0027te ayrı kanunlarla gelmiştir.","desen":"Sınav genelde kaynak ülkeyi (İsviçre) Ceza Kanunu\u0027nun İtalya, Ticaret Kanunu\u0027nun Almanya kaynağıyla karıştırtmayı dener. Ayrıca kadına verilen hakların siyasal değil medeni-toplumsal haklar olduğunu ayırt ettirmeye çalışır. Bu soru p.28\u0027deki tuzak noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Osmanlı döneminde şer\u0027î hukuka dayalı, din ve mezhebe göre değişen eski hukuk düzeni.","ad":"Mecelle","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Kanunun evlilikte zorunlu kıldığı, devlet önünde yapılan evlenme işlemi.","ad":"Resmi nikâh","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kadın ve erkeğin miras hakkında eşit pay almasını sağlayan düzenleme.","ad":"Mirasta eşitlik","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Seçme ve seçilme hakkı; Medeni Kanun\u0027dan ayrı, sonraki kanunlarla tanınmıştır.","ad":"Siyasal haklar","kim":"kanun sabitler"}],"sinavda":"Soruda Türk Medeni Kanunu\u0027nun kabulüne ve getirdiği değişikliklere dair ifadeler verilir, doğru ya da yanlış olanın seçilmesi istenir.","panel_ornek":"Arkadaşın eski usul sözlü anlaşmayla ikinci el bisiklet satın alsa, ileride kimin ne dediği tartışmalı olur; resmi bir fatura ya da senet bu belirsizliği ortadan kaldırır. Türk Medeni Kanunu da tıpkı bunun gibi, eskiden kişiden kişiye değişen kuralları tek ve yazılı bir düzene bağladı. Yani herkes için aynı kural, aynı belge geçerli hale geldi.","ornek":"Arkadaşın eski usul sözlü anlaşmayla ikinci el bisiklet satın alsa, ileride kimin ne dediği tartışmalı olur; resmi bir fatura ya da senet bu belirsizliği ortadan kaldırır. Türk Medeni Kanunu da tıpkı bunun gibi, eskiden kişiden kişiye değişen kuralları tek ve yazılı bir düzene bağladı. Yani herkes için aynı kural, aynı belge geçerli hale geldi.","yontemler":"Tarihleri (Şubat kabul, Ekim yürürlük) ve kaynak ülkeyi (İsviçre) diğer kanunlarla karıştırmadan ezberlemek en kritik kuraldır.","nedir":"Türk Medeni Kanunu, ekleşmemiştir’ sorularında önce hangi şıkların kanunun DOĞRUDAN sonucu olduğunu ele, kalan tek şık cevaptır.","konu":"türk medeni kanunu","tablo":{"satirlar":[["A) Tek eşliliğin kabul edilmesi","1926 Türk Medeni Kanunu, aile hukuku hükümleri","doğru ifade"],["B) Evliliğin resmî nikâh ile yapılması zorunluluğu","1926 Türk Medeni Kanunu, evlenme hükümleri","doğru ifade"],["C) Kadınlara milletvekili seçme ve seçilme hakkının tanınması","İnkılap tarihi, kadın hakları kronolojisi","YANLIŞ ifade"],["D) Mirasta kadın ile erkeğin eşit hak sahibi kılınması","1926 Türk Medeni Kanunu, miras hükümleri","doğru ifade"],["E) Evlenmede kadın ile erkek arasında yaş eşitliğinin sağla…","1926 Türk Medeni Kanunu, evlenme hükümleri","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kadınlara milletvekili seçme ve seçilme hakkının tanınması","E":"Evlenmede kadın ile erkek arasında yaş eşitliğinin sağlanması","A":"Tek eşliliğin kabul edilmesi","D":"Mirasta kadın ile erkeğin eşit hak sahibi kılınması","B":"Evliliğin resmî nikâh ile yapılması zorunluluğu"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - turk medeni kanunu","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Türk Medeni Kanunu 17 ŞUBAT 1926\u0027da TBMM\u0027de kabul edildi, 4 EKİM 1926\u0027da yürürlüğe girdi. İSVİÇRE MEDENİ KANUNU örnek alındı; seçilme nedenleri: en yeni ve en demokratik medeni kanun olması, sorunlara akılcı ve pratik çözümler getirmesi, laik yapısı, kadın-erkek eşitliğine yakınlığı ve Adalet Bakanı Mahmut Esat Bozkurt\u0027un İsviçre\u0027de hukuk eğitimi almış olması. Yerini aldığı düzen: Osmanlı\u0027da din ve mezhebe göre değişen, Ahmet Cevdet Paşa başkanlığında hazırlanmış MECELLE ve şer\u0027î hukuk. GETİRDİKLERİ: Tek eşlilik (çok eşlilik yasaklandı); evlilikte RESMÎ NİKÂH zorunluluğu ve evlenmede kadın-erkek yaş eşitliği; kadına boşanma davası açma hakkı, mirasta kadın-erkek eşitliği, mahkemede tanıklıkta eşitlik; kadına istediği mesleği seçme hakkı; velayet ve mal edinme haklarında eşitlik; patrikhanelerin dünyevî yetkileri kaldırılarak azınlıklar da aynı kanuna tabi tutuldu (azınlıklar Lozan\u0027daki özel hukuk haklarından vazgeçti). SONUÇ: Hukuk birliği sağlandı, toplumsal hayat laikleşti, kadının toplumsal statüsü yükseldi; bu adım kadınlara 1930 belediye, 1934 milletvekili seçme ve seçilme haklarının zeminini hazırladı. 1926 Kanunu 2002\u0027de yürürlüğe giren 4721 sayılı Türk Medeni Kanunu ile yenilendi. SINAV TUZAĞI: (1) Kaynak İsviçre\u0027dir; Ceza Kanunu İtalya\u0027dan, Ticaret Kanunu Almanya\u0027dan alınmıştır, sınav bunları karıştırır. (2) Medeni Kanun kadına SİYASAL hak vermedi; siyasal haklar 1930 ve 1934\u0027te ayrı kanunlarla geldi. (3) Kabul tarihi Şubat, yürürlük Ekim 1926\u0027dır. SINAVDA NASIL SORULUR: \u0027Türk Medeni Kanunu ile aşağıdak…"},{"ad":"TEORI - Esya kavrami ve esya turleri (medeni hukuk)","metin":"Hukuki anlamda EŞYA, üzerinde mülkiyet ve sınırlı aynı hak kurulabilen, kişi dışındaki, maddi varlığı olan ve hâkimiyet altına alınabilen (sınırlandırılabilen) cisimdir. Bir varlığın eşya sayılabilmesi için dört nitelik aranır: (1) maddi (cismani) varlığa sahip olmak, (2) üzerinde hâkimiyet kurulabilir olmak, (3) sınırları belirlenebilir/ayrılabilir olmak, (4) kişi dışı olmak (insan bedeni ve organları eşya değildir). Hava, güneş ışığı ve açık deniz gibi hâkimiyet altına alınamayan unsurlar ile fikri haklar, alacak hakları ve elektrik-doğalgaz gibi enerjiler dar anlamda eşya sayılmaz; ancak enerjiler hakkında taşınır hükümleri kıyasen uygulanır. EŞYA TÜRLERİ: TAŞINIR-TAŞINMAZ (taşınmazlar: arazi, tapu kütüğünde ayrı sayfaya kaydedilen bağımsız ve sürekli haklar, kat mülkiyeti kütüğüne kayıtlı bağımsız bölümler; bunun dışındaki nakledilebilir eşya ile edinmeye elverişli doğal güçler taşınırdır); MİSLİ-GAYRİMİSLİ (piyasada sayı, ölçü, tartı ile belirlenip yerine aynı nitelikte başkası konabilen eşya mislidir); TÜKETİLEN-TÜKETİLMEYEN (kullanımıyla tükenen ya da nitelik değiştiren eşya tüketilen eşyadır); BÖLÜNEBİLEN-BÖLÜNEMEYEN (bölündüğünde ekonomik değerini ve niteliğini yitirmeyen eşya bölünebilirdir); BASİT-BİRLEŞİK EŞYA ve EŞYA BİRLİKLERİ; SAHİPLİ-SAHİPSİZ EŞYA. Ayrıca eşyanın hukuki kaderini paylaşan unsurlar bakımından BÜTÜNLEYİCİ PARÇA (asıl şey yok edilmedikçe, zarara uğratılmadıkça ondan ayrılamayan parça; asıl şeye ilişkin tasarruflar bütünleyici parçayı da kapsar) ile EKLENTİ (asıl şeyin işletilmesi/korunması için sürekli olarak özgülenen, bağımsızlığını koruyan ya…"}],"hakem":"Soru, Türk Medeni Kanunu\u0027nun 1926\u0027da getirdiği medeni hakları ve getirmediği siyasal hakları ayırt etmeyi ölçmektedir; doğru sık (C) kaynakta açıkça desteklenen kurala dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Mirasta kadın-erkek eşitliği Medeni Kanun\u0027un doğrudan getirdiği düzenlemelerdendir; gerçekleşen bir sonuçtur.","E":"Evlenme yaşında kadın-erkek eşitliği de Medeni Kanun ile sağlanmıştır; bu kanunun kapsama dahil olmuştur.","A":"Çok eşlilik yasaklanması Medeni Kanun\u0027un asıl getirdiği büyük yeniliklerden biridir; bu gerçekleşen bir sonuçtur.","B":"Evliliğin resmî nikâha bağlanması Medeni Kanun ile gerçekleşmiş; şer\u0027î usulle yetinen dönem kapanmıştır."},"dogru":"Türk Medeni Kanunu kadına boşanma, miras ve meslek seçme gibi medeni haklar verdi. Ancak milletvekili seçme ve seçilme hakkı 1934\u0027te ayrı bir kanunla tanındı, Medeni Kanun\u0027un kapsamında değildi.","sinav":"Türk Medeni Kanunu kadına medeni haklar tanımış; siyasal haklar ayrı kanunlarla verilmiştir.","kavramlar":[{"kaynak":"TEORI","tanim":"Türk Medeni Kanunu, 1926\u0027da İsviçre Medeni Kanunu örnek alınarak kabul edilen ve toplumun medeni ilişkilerine (evlilik, miras, mal edinme, boşanma gibi) dair kuralları düzenleyen kanundur.","ad":"Medeni Kanun"},{"kaynak":"TEORI","tanim":"Osmanlı döneminde dinî hukuk kurallarına dayanan ve din ve mezhebe göre değişen hukuk sistemidir.","ad":"Şer\u0027î hukuk"},{"kaynak":"TEORI","tanim":"Kişinin aile, miras, mal ve meslekle ilgili özel hukuk alanındaki hakları (boşanma, miras, velayet, meslek seçme) olup Medeni Kanun\u0027la tanınmıştır.","ad":"Medeni haklar"},{"kaynak":"TEORI","tanim":"Seçme ve seçilme gibi devlet yönetimine katılma haklarıdır; Medeni Kanun\u0027dan ayrı, 1930 ve 1934\u0027teki ayrı kanunlarla kadına tanınmıştır.","ad":"Siyasal haklar"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2026/2","2015/3"]},"oyun":null,"tip":"teori","soru":"Türk Medeni Kanunu, Osmanlı döneminde şer\u0027î hukuka ve Mecelle\u0027ye dayanan aile ve miras düzenini kaldırarak yeni haklar getirmiştir. Buna göre, aşağıdakilerden hangisi Türk Medeni Kanunu ile GERÇEKLEŞMEMİŞTİR?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-03","verilenler":[],"dayanak":"İnkılap tarihi konu özeti, 1926 Türk Medeni Kanunu ve 1930-1934 siyasal haklar kronolojisi","dogru":"C","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1926 yılında bir mahkeme salonunda, önceden dört eşle evli olabilen bir tüccar, artık ikinci kez resmî nikâh kıyamayacağını öğreniyor. Aynı gün kızı mirastan erkek kardeşiyle eşit pay alacağını duyuyor.","anlatim":"Osmanlı\u0027daki Mecelle düzeni yerine yeni bir kanun geldi ve bu tüccarın hayatındaki beş konu birden değişti. Şimdi bu değişikliklerin hangisinin gerçek, hangisinin sahte olduğuna bakacağız.","doldur":[]},{"formul":"Ne yapacağız: Türk Medeni Kanunu 1926\u0027da yürürlüğe girdi ve tüccarın hayatındaki tek eşlilik, resmî nikâh, miras eşitliği, yaş eşitliği gibi konuları düzenledi. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kanun kadına medeni haklar verdi ama siyasal hakları vermedi, bunu unutma. Şimdi A\u0027dan E\u0027ye kadar tüccarın olayında hangisi gerçekleşti bakalım.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"1926 Türk Medeni Kanunu, aile hukuku hükümleri","karar":"doğru","anlatim":"Hayır, kanun çok eşliliği yasakladı ve tek eşliliği getirdi. Tüccar artık tek eşle sınırlı.","formul":"Şık A: tüccar ikinci eşi almak istiyor, kanun buna izin veriyor mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"1926 Türk Medeni Kanunu, evlenme hükümleri","karar":"doğru","anlatim":"Hayır, artık evlilik resmî nikâhla yapılmak zorunda. Dinî nikâh tek başına hukuken yetersiz.","formul":"Şık B: tüccar sadece imamla nikâh kıyıp evlenebilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"İnkılap tarihi, kadın hakları kronolojisi","karar":"yanlış","anlatim":"Hayır, bu hak 1934\u0027te ayrı bir kanunla geldi. Medeni Kanun\u0027un içinde siyasal hak yok.","formul":"Şık C: tüccarın kızı aynı yıl milletvekili seçimlerinde oy kullanabiliyor mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"1926 Türk Medeni Kanunu, miras hükümleri","karar":"doğru","anlatim":"Evet, Mecelle\u0027deki dinî esaslı miras taksimi kaldırıldı. Artık miras hukukunda kadın-erkek eşit.","formul":"Şık D: tüccarın kızı mirastan erkek kardeşiyle eşit pay alıyor mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"1926 Türk Medeni Kanunu, evlenme hükümleri","karar":"doğru","anlatim":"Hayır, kanun kadın ve erkek için eşit yaş şartı getirdi. Önceki dinî uygulamadaki fark kaldırıldı.","formul":"Şık E: tüccarın kızı evlenirken erkeğe göre farklı bir yaş şartına mı tabi?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Medeni Kanun tüccarın ailesindeki her şeyi değiştirdi ama oy hakkını vermedi, çünkü o ayrı bir kanundu. Kendine sor: bu hak 1926\u0027da mı yoksa daha sonraki ayrı bir kanunla mı geldi?","doldur":[]}],"anahtar":[{"ornek":"hakları","kok":"haklar"},{"ornek":"medeni","kok":"medeni"},{"ornek":"siyasal","kok":"siyasa"},{"ornek":"kanunlarla","kok":"kanunl"},{"ornek":"tüccarın","kok":"tüccar"},{"ornek":"hangisinin","kok":"hangis"}],"konuGiris":{"harita":"Ne zaman test edilir: Türk Medeni Kanunu\u0027nun getirdikleri ile getirmedikleri (siyasal haklar) karıştırılarak sorulduğunda test edilir. Nasıl ölçülür: hangi hakkın bu kanunla mı
