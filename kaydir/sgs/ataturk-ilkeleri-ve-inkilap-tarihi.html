raf":"Mondros Ateşkes Antlaşması imzacıları","yanilgi":"Savaşı yöneten hükümetin başındaki ismi ateşkesi de imzalamış sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 20"},"kural":"1918\u0027de İttifak Devletleri sırayla ateşkes istedi ve bu süreç 29 Eylül 1918\u0027de Selanik Ateşkesi ile başladı.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 20","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Ateşkes sorularında tarihleri sırala: Eylül-Bulgaristan, Ekim-Osmanlı, Kasım başı-Avusturya-Macaristan, Kasım ortası-Almanya.","konu":"i. dünya savaşı ateşkes","tablo":{"satirlar":[["A) Osmanlı Devleti","p.29 Eylül-30 Ekim kronolojisi","YANLIŞ ifade"],["B) Avusturya-Macaristan","p.3 Kasım 1918 Villa Giusti","YANLIŞ ifade"],["C) Bulgaristan","p.29 Eylül 1918 Selanik Ateşkesi","doğru ifade"],["D) Almanya","p.11 Kasım 1918 Rethondes","YANLIŞ ifade"],["E) İtalya","p.İtalya İtilaf bloğu","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Bulgaristan","E":"İtalya","A":"Osmanlı Devleti","D":"Almanya","B":"Avusturya-Macaristan"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - i. dunya savasi ateskes","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: 1918 yılında İttifak Devletleri sırayla ateşkes istedi. BULGARİSTAN 29 Eylül 1918\u0027de Selanik Ateşkesi\u0027ni imzalayarak savaştan ilk çekilen devlet oldu; bu, Osmanlı ile Almanya arasındaki kâra bağlantısını kesti ve Osmanlı\u0027nın savaşı sürdürmesini imkânsızlaştırdı. OSMANLI DEVLETİ 30 EKİM 1918\u0027de Limni Adası\u0027nın Mondros Limanı\u0027nda, Agamemnon zırhlısında MONDROS ATEŞKES ANTLAŞMASI\u0027nı imzaladı; Osmanlı heyetine Bahriye Nazırı Rauf (Orbay) Bey, İtilaf tarafına İngiliz Amiral Calthorpe başkanlık etti. Savaşı yürüten İttihat ve Terakki hükümeti (Talat Paşa) istifa etmiş, ateşkesi Ahmet İzzet Paşa hükümeti imzalamıştı. AVUSTURYA-MACARİSTAN 3 Kasım 1918\u0027de Villa Giusti, ALMANYA 11 Kasım 1918\u0027de Rethondes (Compiègne) ateşkesini imzaladı; savaş böylece bitti. Osmanlı yönetimi ateşkesi imzalarken Wilson İlkelerine (galiplerin toprak almayacağı, milletlerin kendi geleceğini belirleyeceği) güveniyordu; ancak Mondros\u0027un ağır hükümleri ve hemen başlayan işgaller bu güveni boşa çıkardı. Ateşkes barış antlaşması değildir; Osmanlı için barış antlaşması ancak 10 Ağustos 1920\u0027de Sevr\u0027de imzalanmış, o da uygulanmamıştır. SINAV TUZAĞI: (1) Savaştan ilk çekilen Bulgaristan\u0027dır (Eylül 1918); Osmanlı ikinci sıradadır. (2) Mondros bir ATEŞKESTİR, barış antlaşması değildir; Sevr ile karıştırılmaz. (3) Mondros\u0027u imzalayan Osmanlı temsilcisi Rauf Orbay\u0027dır, Enver veya Talat Paşa değil. SINAVDA NASIL SORULUR: \u0027I. Dünya Savaşı\u0027ndan ilk çekilen İttifak devleti hangisidir?\u0027 ya da \u0027Mondros Ateşkes Antlaşması\u0027nı Osmanlı Devleti adına kim imzalamışt…"},{"ad":"TEORI - i. dunya savasi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: I. Dünya Savaşı 1914–1918 yılları arasında İtilaf Devletleri (İngiltere, Fransa, Rusya; sonra İtalya, ABD) ile İttifak Devletleri (Almanya, Avusturya-Macaristan; sonra Osmanlı Devleti, Bulgaristan) arasında yapıldı. NEDENLER: Sömürgecilik ve ham madde yarışı, Almanya–İngiltere ekonomik rekabeti, Fransa\u0027nın Alsas-Loren\u0027i geri alma isteği, Balkanlar\u0027da Rusya–Avusturya çekişmesi, silahlanma ve bloklaşma; görünürdeki neden Avusturya veliahdının Saraybosna\u0027da öldürülmesidir. OSMANLI\u0027NİN GİRİŞİ: Osmanlı Devleti 1914 sonbaharında Almanya yanında savaşa girdi; Goeben ve Breslau gemilerinin Karadeniz\u0027de Rus limanlarını vurması fiilî girişi sağladı. Nedenler: kaybedilen toprakları geri alma umudu, Almanya\u0027nın savaşı kazanacağı inancı, İttihat ve Terakki yönetiminin Alman yanlılığı, kapitülasyonlardan kurtulma isteği. CEPHELER: Taarruz cepheleri Kafkas (Sarıkamış felaketi) ve Kanal; savunma cepheleri Çanakkale (1915 zafer, Mustafa Kemal Anafartalar), Irak (Kut\u0027ül Amare zaferi 1916), Suriye-Filistin, Hicaz-Yemen; müttefiklere yardım cepheleri Galiçya, Makedonya, Romanya. SONUÇ: Osmanlı Devleti 30 Ekim 1918 Mondros Ateşkes Antlaşması ile savaştan çekildi; savaş 11 Kasım 1918\u0027de Almanya\u0027nın ateşkesiyle bitti. Wilson İlkeleri (Ocak 1918) barışın çerçevesini çizdi; yenilenlerle Paris Barış Konferansı\u0027nda antlaşmalar yapıldı: Versay (Almanya), Sen Jermen (Avusturya), Nöyyi (Bulgaristan), Triyanon (Macaristan), Sevr (Osmanlı, 10 Ağustos 1920; TBMM tanımadı, uygulanmadı). İmparatorluklar dağıldı, yeni ulus devletler kuruldu, Mille…"}],"hakem":"Soru, kaynak metinde açıkça yer alan tarihi gerçeğe dayanmaktadır: Bulgaristan 29 Eylül 1918\u0027de Selanik Ateşkesi ile savaştan ilk çekilen İttifak devletidir ve Osmanlı-Almanya kara bağlantısını kesmiştir."},"kayitlar":[],"sade":{"siklar":{"D":"Almanya 11 Kasım 1918\u0027de ateşkes imzaladığından, tüm İttifak Devletleri arasında savaştan EN SON çekilen devlettir. Savaşı bitiren en bilinen tarih olmasından dolayı yanlışlıkla seçilebilir.","E":"İtalya İttifak Devletleri safında değil, İtilaf Devletleri safında yer aldığından ateşkes sıralamasına girmez ve bu sorunun cevabı olamaz.","A":"Osmanlı Devleti 30 Ekim 1918\u0027de Mondros Ateşkes Antlaşması\u0027nı imzaladı; ancak Bulgaristan\u0027dan sonra, sıralamada ikinci sırada yer aldı. Mondros en bilinen ateşkes olduğu için ilk çekilen devlet zannedilebilir.","B":"Avusturya-Macaristan 3 Kasım 1918\u0027de ateşkes imzaladı; Bulgaristan ve Osmanlı\u0027dan sonra, sıralamada üçüncü sıradadır. Kronolojide en son çekilen devlettir."},"dogru":"Bulgaristan 29 Eylül 1918\u0027de Selanik Ateşkesi\u0027ni imzalayarak İttifak Devletleri arasında savaştan ilk çekilen devlet oldu. Bu çekilişle Osmanlı ile Almanya arasındaki kâra bağlantısı kesirildi ve Osmanlı\u0027nın savaşı sürdürmesi imkânsızlaştırıldı.","sinav":"I. Dünya Savaşı\u0027nda ateşkes imzalanan ],"anahtar":[{"ornek":"osmanlı","kok":"osmanl"},{"ornek":"ateşkesi","kok":"ateşke"},{"ornek":"devleti","kok":"devlet"},{"ornek":"bulgaristan","kok":"bulgar"},{"ornek":"almanya","kok":"almany"},{"ornek":"İttifak","kok":"İttifa"}],"konuGiris":{"harita":"Ne zaman test edilir: İttifak Devletleri\u0027nin savaştan çekiliş sırası ve tarihleri sorulduğunda. Nasıl ölçülür: hangi devletin hangi ateşkesi hangi tarihte imzaladığı ve bunun sonucu eşleştirilerek. Nasıl kaydedilir: her devletin ateşkes adı, tarihi ve doğurduğu sonuç ayrı ayrı bilgi olarak tutulur.","desen":"Sınav genelde \u0027ilk çekilen devlet\u0027 ile \u0027Mondros\u0027u imzalayan devlet\u0027i karıştırtmaya çalışır. Öğrenciler çoğu zaman Osmanlı\u0027yı ilk çekilen sanır, oysa Bulgaristan ondan önce çekilmiştir. Bu soru p.28\u0027deki \u0027savaştan ilk çekilen İttifak devleti\u0027 tuzağından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Bulgaristan\u0027ın 29 Eylül 1918\u0027de imzaladığı, savaştan ilk çekilişi sağlayan ateşkes","ad":"Selanik Ateşkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Osmanlı\u0027nın 30 Ekim 1918\u0027de imzaladığı, savaştan çekilişini sağlayan ateşkes","ad":"Mondros Ateşkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bulgaristan\u0027ın çekilmesiyle Osmanlı-Almanya kâra yolunun kopması","ad":"Kâra bağlantısının kesilmesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Almanya, Avusturya-Macaristan, Osmanlı ve Bulgaristan\u0027ın oluşturduğu savaş bloğu","ad":"İttifak Devletleri","kim":"kanun sabitler"}],"sinavda":"Soru, İttifak Devletleri arasında savaştan ilk çekilen ve Osmanlı-Almanya kâra bağlantısını kesen devletin adını ister.","panel_ornek":"Arkadaşların beşli bir grup projede çalışırken en önce sen elini çekersen, geri kalan 4 kişinin planı bozulur ve bir bağlantı kopar. Mesela grup 5 kişiyken senin ayrılman diğerlerinin ortak çalışma hattını keser. İşte ilk çekilenin diğerlerini nasıl etkilediği tam da alayarak savaştan ilk çekilen İttifak devletidir.","ayirt":"Kâra bağlantısını kesen ilk ateşkes hangisiydi?","paragraf":"Kaynak: I. Dünya Savaşı ateşkes kronolojisi","yanilgi":"Bu şıkkı eleyen öğrenci, Mondros\u0027un en çok anılan ateşkes olması yüzünden Osmanlı\u0027yı ilk sanır."},"E":{"gercek":"İtalya İtilaf Devletleri tarafında savaşa katılmıştır, İttifak ateşkes sıralamasında yer almaz.","ayirt":"İtalya hangi blokta savaştı?","paragraf":"Kaynak: I. Dünya Savaşı ateşkes kronolojisi","yanilgi":"İtalya\u0027yı İttifak Devletleri saflarında sayıyorsun."},"A":{"gercek":"Bulgaristan 29 Eylül 1918\u0027de Selanik Ateşkesi ile ilk çekilen devlettir; Osmanlı 30 Ekim 1918\u0027de ikinci sıradadır.","ayirt":"Tarih sırasını hatırlıyor muyum: Eylül mü Ekim mi önce geldi?","paragraf":"Kaynak: I. Dünya Savaşı ateşkes kronolojisi","yanilgi":"Mondros\u0027un ünlü olması yüzünden Osmanlı\u0027yı ilk çekilen devlet sanıyorsun."},"D":{"gercek":"Almanya 11 Kasım 1918\u0027de Rethondes\u0027de, sıralamada en son ateşkes imzalayan devlettir.","ayirt":"Savaşın bitiş tarihi ile ilk çekiliş tarihi aynı mı?","paragraf":"Kaynak: I. Dünya Savaşı ateşkes kronolojisi","yanilgi":"Almanya\u0027nın ateşkesi savaşı resmen bitirdiği için ilk çekilen devlet olduğunu sanıyorsun."},"B":{"gercek":"Avusturya-Macaristan 3 Kasım 1918\u0027de, Osmanlı\u0027dan sonra ateşkes imzalamıştır.","ayirt":"Villa Giusti tarihi Mondros\u0027tan önce mi sonra mı?","paragraf":"Kaynak: I. Dünya Savaşı ateşkes kronolojisi","yanilgi":"Avusturya-Macaristan\u0027ın Osmanlı\u0027dan önce yıkıldığını düşünüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 20"},"kural":"Mondros Ateşkes Antlaşması 30 Ekim 1918\u0027de Osmanlı Devleti adına Bahriye Nazırı Rauf (Orbay) Bey, İtilaf Devletleri adına İngiliz Amiral Calthorpe tarafından imzalanmıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 20","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Ateşkes sorularında imzacı kişi, çekilme sırası ve \u0027ateşkes mi barış mı\u0027 ayrımını birlikte kontrol et.","konu":"i. dünya savaşı ateşkes","tablo":{"satirlar":[["A) İttifak Devletleri\u0027nden savaştan ilk çekilen Osmanlı Dev…","p.1 (kronoloji)","YANLIŞ ifade"],["B) Mondros Ateşkes Antlaşması, Osmanlı Devleti adına Rauf O…","p.1 (imzacılar)","doğru ifade"],["C) Mondros Ateşkes Antlaşması, Osmanlı Devleti için Sevr An…","p.1 (ateşkes/barış ayrımı)","YANLIŞ ifade"],["D) Osmanlı Devleti, Mondros\u0027u imzalarken Wilson İlkelerine …","p.1 (Wilson İlkeleri)","YANLIŞ ifade"],["E) Mondros Ateşkes Antlaşması\u0027nı Osmanlı hükümeti adına İtt…","p.1 (hükümet değişikliği)","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Mondros Ateşkes Antlaşması, Osmanlı Devleti için Sevr Antlaşması\u0027nın yerini tutan bir barış antlaşmasıdır.","E":"Mondros Ateşkes Antlaşması\u0027nı Osmanlı hükümeti adına İttihat ve Terakki\u0027nin başındaki Talat Paşa imzalamıştır.","A":"İttifak Devletleri\u0027nden savaştan ilk çekilen Osmanlı Devleti\u0027dir, ardından Bulgaristan ateşkes imzalamıştır.","D":"Osmanlı Devleti, Mondros\u0027u imzalarken Wilson İlkelerine güvenmiş ve bu güven Sevr\u0027in ağır hükümleriyle doğrulanmıştır.","B":"Mondros Ateşkes Antlaşması, Osmanlı Devleti adına Rauf Orbay tarafından, İtilaf Devletleri adına Amiral Calthorpe ile imzalanmıştır."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - i. dunya savasi ateskes","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: 1918 yılında İttifak Devletleri sırayla ateşkes istedi. BULGARİSTAN 29 Eylül 1918\u0027de Selanik Ateşkesi\u0027ni imzalayarak savaştan ilk çekilen devlet oldu; bu, Osmanlı ile Almanya arasındaki kâra bağlantısını kesti ve Osmanlı\u0027nın savaşı sürdürmesini imkânsızlaştırdı. OSMANLI DEVLETİ 30 EKİM 1918\u0027de Limni Adası\u0027nın Mondros Limanı\u0027nda, Agamemnon zırhlısında MONDROS ATEŞKES ANTLAŞMASI\u0027nı imzaladı; Osmanlı heyetine Bahriye Nazırı Rauf (Orbay) Bey, İtilaf tarafına İngiliz Amiral Calthorpe başkanlık etti. Savaşı yürüten İttihat ve Terakki hükümeti (Talat Paşa) istifa etmiş, ateşkesi Ahmet İzzet Paşa hükümeti imzalamıştı. AVUSTURYA-MACARİSTAN 3 Kasım 1918\u0027de Villa Giusti, ALMANYA 11 Kasım 1918\u0027de Rethondes (Compiègne) ateşkesini imzaladı; savaş böylece bitti. Osmanlı yönetimi ateşkesi imzalarken Wilson İlkelerine (galiplerin toprak almayacağı, milletlerin kendi geleceğini belirleyeceği) güveniyordu; ancak Mondros\u0027un ağır hükümleri ve hemen başlayan işgaller bu güveni boşa çıkardı. Ateşkes barış antlaşması değildir; Osmanlı için barış antlaşması ancak 10 Ağustos 1920\u0027de Sevr\u0027de imzalanmış, o da uygulanmamıştır. SINAV TUZAĞI: (1) Savaştan ilk çekilen Bulgaristan\u0027dır (Eylül 1918); Osmanlı ikinci sıradadır. (2) Mondros bir ATEŞKESTİR, barış antlaşması değildir; Sevr ile karıştırılmaz. (3) Mondros\u0027u imzalayan Osmanlı temsilcisi Rauf Orbay\u0027dır, Enver veya Talat Paşa değil. SINAVDA NASIL SORULUR: \u0027I. Dünya Savaşı\u0027ndan ilk çekilen İttifak devleti hangisidir?\u0027 ya da \u0027Mondros Ateşkes Antlaşması\u0027nı Osmanlı Devleti adına kim imzalamışt…"},{"ad":"TEORI - i. dunya savasi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: I. Dünya Savaşı 1914–1918 yılları arasında İtilaf Devletleri (İngiltere, Fransa, Rusya; sonra İtalya, ABD) ile İttifak Devletleri (Almanya, Avusturya-Macaristan; sonra Osmanlı Devleti, Bulgaristan) arasında yapıldı. NEDENLER: Sömürgecilik ve ham madde yarışı, Almanya–İngiltere ekonomik rekabeti, Fransa\u0027nın Alsas-Loren\u0027i geri alma isteği, Balkanlar\u0027da Rusya–Avusturya çekişmesi, silahlanma ve bloklaşma; görünürdeki neden Avusturya veliahdının Saraybosna\u0027da öldürülmesidir. OSMANLI\u0027NİN GİRİŞİ: Osmanlı Devleti 1914 sonbaharında Almanya yanında savaşa girdi; Goeben ve Breslau gemilerinin Karadeniz\u0027de Rus limanlarını vurması fiilî girişi sağladı. Nedenler: kaybedilen toprakları geri alma umudu, Almanya\u0027nın savaşı kazanacağı inancı, İttihat ve Terakki yönetiminin Alman yanlılığı, kapitülasyonlardan kurtulma isteği. CEPHELER: Taarruz cepheleri Kafkas (Sarıkamış felaketi) ve Kanal; savunma cepheleri Çanakkale (1915 zafer, Mustafa Kemal Anafartalar), Irak (Kut\u0027ül Amare zaferi 1916), Suriye-Filistin, Hicaz-Yemen; müttefiklere yardım cepheleri Galiçya, Makedonya, Romanya. SONUÇ: Osmanlı Devleti 30 Ekim 1918 Mondros Ateşkes Antlaşması ile savaştan çekildi; savaş 11 Kasım 1918\u0027de Almanya\u0027nın ateşkesiyle bitti. Wilson İlkeleri (Ocak 1918) barışın çerçevesini çizdi; yenilenlerle Paris Barış Konferansı\u0027nda antlaşmalar yapıldı: Versay (Almanya), Sen Jermen (Avusturya), Nöyyi (Bulgaristan), Triyanon (Macaristan), Sevr (Osmanlı, 10 Ağustos 1920; TBMM tanımadı, uygulanmadı). İmparatorluklar dağıldı, yeni ulus devletler kuruldu, Mille…"}],"hakem":"Soru Ataturk Ilkeleri ve Inkilap Tarihi dersinin resmi kapsaminda yer alan I. Dunya Savasi ve Mondros Ateskes konusunu olcuyor; dayanak kaynak metinde acikca desteklenmis ve guncel tarihi bilgidir."},"kayitlar":[],"sade":{"siklar":{"C":"Mondros bir ateşkestir, barış antlaşması değildir; Osmanlı için asıl barış antlaşması 10 Ağustos 1920\u0027de Sevr\u0027de imzalandı.","E":"Savaşı yürüten Talat Paşa hükümeti istifa etmiş; ateşkesi yerini alan Ahmet İzzet Paşa hükümeti adına Rauf Orbay imzalamıştır.","D":"Osmanlı ateşkesi imzalarken Wilson İlkelerine güvenmiş, ancak Mondros\u0027un ağır hükümleri ve işgaller bu güveni boşa çıkardı; Sevr bu güveni doğrulamadı.","A":"Savaştan ilk çekilen İttifak devleti Bulgaristan\u0027dır; 29 Eylül 1918\u0027de Selanik Ateşkesi\u0027ni imzalayan Bulgaristan, Osmanlı\u0027dan bir ay önce ateşkes yaptı."},"dogru":"30 Ekim 1918\u0027de Osmanlı Devleti Mondros Ateşkes Antlaşması\u0027nı imzaladı. Osmanlı tarafını Bahriye Nazırı Rauf Orbay Bey, İtilaf tarafını İngiliz Amiral Calthorpe temsil etti.","sinav":"Mondros Ateşkes Antlaşması, Osmanlı Devleti adına Rauf Orbay tarafından, İtilaf Devletleri adına Amiral Calthorpe ile 30 Ekim 1918\u0027de imzalanmıştır.","kavramlar":[{"kaynak":"TEORI","tanim":"30 Ekim 1918\u0027de Osmanlı Devleti\u0027nin Birinci Dünya Savaşı\u0027ndan çekilmesini sağlayan ateşkes sözleşmesidir; Osmanlı adına Rauf Orbay, İtilaf adına Amiral Calthorpe tarafından Limni Adası\u0027ndaki Mondros Limanı\u0027nda imzalanmıştır.","ad":"Mondros Ateşkes Antlaşması"},{"kaynak":"TEORI","tanim":"Savaşan tarafların savaşı durdurmasını sağlayan anlaşmadır; barış antlaşması değil, geçici bir duruştur.","ad":"Ateşkes"},{"kaynak":"TEORI","tanim":"Ocak 1918\u0027de ilan edilen ve barışın çerçevesini çizen ilkelerdir; galiplerin toprak almayacağı ve milletlerin kendi geleceğini belirleyeceği prensiplerini içerir.","ad":"Wilson İlkeleri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"I. Dünya Savaşı\u0027nda İttifak Devletleri\u0027nin ateşkes süreci ve Mondros Ateşkes Antlaşması\u0027na ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-cokzor/kp-27","verilenler":[],"dayanak":"İnkılap Tarihi ders notu - Mondros Ateşkes Antlaşması (30 Ekim 1918)","dogru":"B","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1918 yazında Bulgaristan cephesi çöker, Osmanlı Meclisi\u0027ne haber gelir: 29 Eylül\u0027de Bulgaristan Selanik\u0027te ateşkes imzaladı, Almanya ile kâra bağlantısı kesildi. Talat Paşa hükümeti bir hafta içinde istifa eder, yerine Ahmet İzzet Paşa gelir. 30 Ekim 1918\u0027de Limni açıklarında Agamemnon zırhlısında bir imza töreni yapılır.","anlatim":"Bu tören Mondros Ateşkes Antlaşması\u0027dır. Sınıfta hep karışan yer burasıdır: kim, ne zaman, neyi imzaladı. Şimdi bu tek olayı beş ayrı iddia üzerinden test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Olayda üç şey netleşmeli — sıra (kim ilk çekildi), imzacılar (kim kimle imzaladı), belgenin niteliği (ateşkes mi barış mı). Bulgaristan Eylül\u0027de, Osmanlı Ekim\u0027de, Almanya Kasım\u0027da çekildi; Osmanlı adına Rauf Orbay, İtilaf adına Amiral Calthorpe imzaladı; Mondros ateşkestir, barış Sevr\u0027dedir.","anlatim":"Beş şıkkın her biri bu üç noktadan birine dokunuyor. Şimdi A\u0027dan E\u0027ye tek tek bu olayda deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.1 (kronoloji)","karar":"yanlış","anlatim":"Olayda sıra tam tersi: Bulgaristan 29 Eylül\u0027de, Osmanlı 30 Ekim\u0027de imzaladı. Bulgaristan bir ay önce çekilmiş, Osmanlı\u0027nın kâra bağlantısını o kesmiş.","formul":"Şık A: birisi sana \u0027ilk çekilen Osmanlı\u0027dır, sonra Bulgaristan imzaladı\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.1 (imzacılar)","karar":"doğru","anlatim":"Olayda tam da bu isimler var: Bahriye Nazırı Rauf Bey heyeti yönetti, karşısında İngiliz Amiral Calthorpe oturuyordu. İmza 30 Ekim 1918\u0027de Agamemnon zırhlısında atıldı.","formul":"Şık B: birisi sana \u0027Mondros\u0027u Osmanlı adına Rauf Orbay, İtilaf adına Amiral Calthorpe imzaladı\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.1 (ateşkes/barış ayrımı)","karar":"yanlış","anlatim":"Olayda Mondros sadece çatışmayı durduran bir ateşkes, toprak ve egemenlik hükmü koymaz. Osmanlı için gerçek barış antlaşması iki yıl sonra, 10 Ağustos 1920\u0027de imzalanan Sevr\u0027dir.","formul":"Şık C: birisi sana \u0027Mondros, Osmanlı için Sevr\u0027in yerini tutan bir barış antlaşmasıdır\u0027 diyor, katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.1 (Wilson İlkeleri)","karar":"yanlış","anlatim":"Olayda güven gerçekten vardı ama sonuç tam tersi çıktı; ağır hükümler ve hemen başlayan işgaller bu güveni boşa çıkardı, doğrulamadı. Cümlenin ilk yarısı doğru, ikinci yarısı olayı ters çeviriyor.","formul":"Şık D: birisi sana \u0027Osmanlı Mondros\u0027u imzalarken Wilson İlkelerine güvendi, bu güven Sevr\u0027in ağır hükümleriyle doğrulandı\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.1 (hükümet değişikliği)","karar":"yanlış","anlatim":"Olayda Talat Paşa hükümeti ateşkesten önce istifa etmişti. İmzayı atan Ahmet İzzet Paşa hükümetinin temsilcisi Rauf Orbay\u0027dı.","formul":"Şık E: birisi sana \u0027Mondros\u0027u İttihat ve Terakki\u0027nin başındaki Talat Paşa imzaladı\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru satır imzacıları veren B; gerisi sıra, belge türü ya da hükümet karıştırıyor. Kendine hep şunu sor: bu cümle tarih mi, kişi mi, yoksa belgenin niteliğini mi bozuyor?","doldur":[]}],"anahtar":[{"ornek":"olayda","kok":"olayda"},{"ornek":"osmanlı","kok":"osmanl"},{"ornek":"imzalamıştır","kok":"imzala"},{"ornek":"ateşkes","kok":"ateşke"},{"ornek":"mondros","kok":"mondro"},{"ornek":"antlaşması","kok":"antlaş"}],"konuGiris":{"harita":"Ne zaman test edilir: hangi İttifak devletinin savaştan ilk çekildiği ve tarihler karıştırılarak sorulduğunda test edilir. Nasıl ölçülür: Mondros\u0027u Osmanlı adına kimin imzaladığı ve bunun barış mı ateşkes mi olduğu ayrımıyla ölçülür. Nasıl kaydedilir: olay-tarih-imzacı üçlüsü ezbere değil, sıralı mantıkla eşleştirilerek kaydedilir.","desen":"Sınav genellikle \u0027ilk çekilen devlet\u0027 sorusunu Bulgaristan yerine Osmanlı yazdırarak tuzaklar. Mondros\u0027u imzalayan kişi olarak Rauf Orbay yerine Talat veya Enver Paşa seçenekleri konur. Bu soru p.28\u0027deki olay-tarih-imzacı eşleştirmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Bulgaristan\u0027ın 29 Eylül 1918\u0027de imzalayarak savaştan ilk çekildiği ateşkes","ad":"Selanik Ateşkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Osmanlı\u0027nın 30 Ekim 1918\u0027de İtilaf ile imzaladığı, barış olmayan ateşkes belgesi","ad":"Mondros Ateşkes Antlaşması","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mondros\u0027u Osmanlı Bahriye Nazırı sıfatıyla imzalayan heyet başkanı","ad":"Rauf Orbay","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Almanya\u0027nın 11 Kasım 1918\u0027de imzaladığı, savaşı bitiren son ateşkes","ad":"Compiègne Ateşkesi","kim":"kanun sabitler"}],"sinavda":"Soruda İttifak devletlerinin ateşkes tarihleri ve imzacıları verilir, doğru sıralama veya doğru imzacı istenir.","panel_ornek":"Bir arkadaş grubu sırayla borcunu ödeyip ortaklıktan ayrılıyor: önce Ayşe 3 Eylül\u0027de çıkıyor, sonra Mehmet 30 Ekim\u0027de, en son Can 11 Kasım\u0027da anlaşmayı imzalıyor. Kim ilk çıktı, hangi tarihte kim imzaladı, sırası önemli.","ornek":"Bir arkadaş grubu sırayla borcunu ödeyip ortaklıktan ayrılıyor: önce Ayşe 3 Eylül\u0027de çıkıyor, sonra Mehmet 30 Ekim\u0027de, en son Can 11 Kasım\u0027da anlaşmayı imzalıyor. Kim ilk çıktı, hangi tarihte kim imzaladı, sırası önemli.","yontemler":"Tarihleri Eylül-Ekim-Kasım sırasıyla ezberleyip her tarihe tek bir devlet ve imzacı eşleştirmek en kritik kuraldır.","nedir":"Bu konu I. Dünya Savaşı\u0027nda İttifak Devletleri\u0027nin sırayla ateşkes imzalayarak savaştan çekiliş sürecini ve Mondros Ateşkes Antlaşması\u0027nın koşullarını anlatır. Sınav burada hangi devletin önce çekildiğini ve Mondros\u0027u kimin imzaladığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Ateşkes-Barış Karıştırma Tuzağı","metin":"Mondros\u0027u bir barış antlaşması sanıp Sevr\u0027in yerini tuttuğunu düşünüyorsun. Doğrusu: Mondros bir ateşkestir, Osmanlı için barış antlaşması ancak 10 Ağustos 1920\u0027de imzalanan Sevr\u0027dir ve o da uygulanmamıştır."},"E":{"ad":"Hükümet Tuzağı","metin":"Mondros\u0027u savaşı yürüten İttihat ve Terakki hükümetinin başındaki Talat Paşa\u0027nın imzaladığını düşünüyorsun. Doğrusu: Talat Paşa hükümeti istifa etmiş, ateşkesi Ahmet İzzet Paşa hükümeti adına Rauf Orbay imzalamıştır."},"D":{"ad":"Wilson İlkeleri Tuzağı","metin":"Osmanlı\u0027nın Wilson İl ateşkesi imzalarken Wilson İlkelerine güvenmiştir, ancak Mondros\u0027un ağır hükümleri ve hemen başlayan işgaller bu güveni tam tersine boşa çıkarmıştır.","ayirt":"Metinde \u0027güvendi\u0027 ile \u0027bu güven doğrulandı/boşa çıktı\u0027 ayrı iki cümle mi, sonucu doğru okudum mu?","paragraf":"İnkılap Tarihi ders notu - Wilson İlkeleri ve Mondros","yanilgi":"Wilson İlkelerine güvenildiği bilgisini okuyup bu güvenin sonradan haklı çıktığını sanıyorsun."},"B":{"gercek":"Mondros\u0027ta Osmanlı heyetine Bahriye Nazırı Rauf (Orbay) Bey, İtilaf tarafına İngiliz Amiral Calthorpe başkanlık etmiştir.","ayirt":"İmzayı atan kişi, o an göreve gelmiş yeni hükümetin temsilcisi mi?","paragraf":"İnkılap Tarihi ders notu - Mondros Ateşkes Antlaşması","yanilgi":"Bu şıkkı elerken imzacıların Osmanlı\u0027da Enver ya da Talat Paşa gibi tanınmış İttihatçı isimler olması gerektiğini düşünüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 19"},"kural":"Millî iktisat politikası korumacı bir anlayışla gümrük tarifelerini yükseltmiş, yerli üretimi korumuştur; serbest ticaret ve düşük tarife bu dönemde uygulanmamıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 19","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Değildir\u0027 sorularında dört şık kaynaktaki gerçek olaylardır; ters yönlü tek ifadeyi (yükselme yerine düşme, korumacılık yerine serbestlik) ara.","konu":"i. dünya savaşı osmanlı ekonomisi","tablo":{"satirlar":[["A) Devlet, savaş giderlerini karşılıksız kağıt para (evrak-…","p.Savaş Finansmanı","doğru ifade"],["B) İaşe Nezareti kurularak ürünlere el konulmuş, vesika uyg…","p.İaşe Sorunu","doğru ifade"],["C) Yabancılara tanınan kapitülasyonlar tek taraflı olarak k…","p.Sınav Tuzağı(1)","doğru ifade"],["D) Millî iktisat politikası çerçevesinde yerli şirketler ve…","p.Millî İktisat","doğru ifade"],["E) Gümrük tarifeleri düşürülerek serbest ticaret politikası…","p.Savaşa Giriş ve Gümrük Politikası","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yabancılara tanınan kapitülasyonlar tek taraflı olarak kaldırılmıştır.","E":"Gümrük tarifeleri düşürülerek serbest ticaret politikası benimsenmiştir.","A":"Devlet, savaş giderlerini karşılıksız kağıt para (evrak-ı nakdiye) basarak finanse etmiştir.","D":"Millî iktisat politikası çerçevesinde yerli şirketler ve millî bankalar desteklenmiştir.","B":"İaşe Nezareti kurularak ürünlere el konulmuş, vesika uygulamasına geçilmiştir."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - i. dunya savasi osmanli ekonomisi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Savaşa girilen 1914 yılında Osmanlı hükümeti KAPİTÜLASYONLARI TEK TARAFLI KALDIRDIĞINI ilan etti ve yabancılara tanınan ayrıcalıkları sona erdirdi; ardından gümrük tarifesi yükseltilip yerli üretimi koruyan spesifik tarifeye geçildi. İttihat ve Terakki yönetimi MİLLÎ İKTİSAT politikası izledi: Müslüman-Türk girişimci sınıfı yaratmak için yerli şirketler, millî bankalar ve esnaf-tüccar kooperatifleri desteklendi; yabancı şirketlerde Türkçe yazışma zorunluluğu getirildi; Ziya Gökalp ve Tekin Alp bu görüşün fikir öncüleridir. SAVAŞ FİNANSMANI: Devlet giderlerini karşılıksız KÂĞIT PARA (evrak-ı nakdiye) basarak ve Almanya\u0027dan borç alarak karşıladı; para arzı arttı, altın karşılığı düştü, yüksek ENFLASYON ve karaborsa doğdu. Erkeklerin silah altına alınması tarım üretimini düşürdü; ordu ve büyük şehirlerin beslenmesi İAŞE SORUNUnu doğurdu; hükümet İaşe Nezareti kurup ürünlere el koydu, vesika uygulaması yaptı. Savaş yıllarında \u0027harp zenginleri\u0027 denen vurguncu bir kesim ortaya çıktı; hükümet ihtikârla (vurgunculukla) mücadele düzenlemeleri yaptı. Dış ticaret İtilaf ablukası yüzünden neredeyse durdu; ekonomi Almanya\u0027ya bağımlı hâle geldi. SONUÇ: Savaş sonunda Osmanlı ekonomisi çökmüş, dış borç ve Düyun-u Umumiye yükü ağırlaşmış, üretim ve nüfus kaybı büyümüştü; bu tablo Millî Mücadele\u0027nin yoksul iktisadi zeminini oluşturdu. SINAV TUZAĞI: (1) Kapitülasyonlar 1914\u0027te tek taraflı kaldırıldı ama hukuken kesin kaldırılışı 1923 Lozan Barış Antlaşması iledir. (2) Savaş enflasyonunun temel nedeni karşılıksız kâğıt paradır, ver…"},{"ad":"TEORI - i. dunya savasi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: I. Dünya Savaşı 1914–1918 yılları arasında İtilaf Devletleri (İngiltere, Fransa, Rusya; sonra İtalya, ABD) ile İttifak Devletleri (Almanya, Avusturya-Macaristan; sonra Osmanlı Devleti, Bulgaristan) arasında yapıldı. NEDENLER: Sömürgecilik ve ham madde yarışı, Almanya–İngiltere ekonomik rekabeti, Fransa\u0027nın Alsas-Loren\u0027i geri alma isteği, Balkanlar\u0027da Rusya–Avusturya çekişmesi, silahlanma ve bloklaşma; görünürdeki neden Avusturya veliahdının Saraybosna\u0027da öldürülmesidir. OSMANLI\u0027NİN GİRİŞİ: Osmanlı Devleti 1914 sonbaharında Almanya yanında savaşa girdi; Goeben ve Breslau gemilerinin Karadeniz\u0027de Rus limanlarını vurması fiilî girişi sağladı. Nedenler: kaybedilen toprakları geri alma umudu, Almanya\u0027nın savaşı kazanacağı inancı, İttihat ve Terakki yönetiminin Alman yanlılığı, kapitülasyonlardan kurtulma isteği. CEPHELER: Taarruz cepheleri Kafkas (Sarıkamış felaketi) ve Kanal; savunma cepheleri Çanakkale (1915 zafer, Mustafa Kemal Anafartalar), Irak (Kut\u0027ül Amare zaferi 1916), Suriye-Filistin, Hicaz-Yemen; müttefiklere yardım cepheleri Galiçya, Makedonya, Romanya. SONUÇ: Osmanlı Devleti 30 Ekim 1918 Mondros Ateşkes Antlaşması ile savaştan çekildi; savaş 11 Kasım 1918\u0027de Almanya\u0027nın ateşkesiyle bitti. Wilson İlkeleri (Ocak 1918) barışın çerçevesini çizdi; yenilenlerle Paris Barış Konferansı\u0027nda antlaşmalar yapıldı: Versay (Almanya), Sen Jermen (Avusturya), Nöyyi (Bulgaristan), Triyanon (Macaristan), Sevr (Osmanlı, 10 Ağustos 1920; TBMM tanımadı, uygulanmadı). İmparatorluklar dağıldı, yeni ulus devletler kuruldu, Mille…"}],"hakem":"Soru I. Dünya Savaşı Osmanlı ekonomisini ölçüyor; kaynakta gümrük tarifelerinin YÜKSELTİLDİĞİ ve korumacı politika uygulandığı açıkça yazılı olup, düşürülerek serbest ticaret benimsenmediği doğru cevaptır."},"kayitlar":[],"sade":{"siklar":{"C":"1914\u0027te kapitülasyonlar tek taraflı kaldırıldığını ilan edilmiştir; 1923 Lozan\u0027da hukuken kesin oldu.","A":"Savaş giderlerini karşılıksız kâğıt para basarak finanse etmek gerçekten yapılmıştır; bu enflasyonun asıl nedenidir.","D":"Millî iktisat korumacı bir politikadır; yerli şirket ve millî banka desteği gerçekten uygulanmıştır.","B":"İaşe Nezareti kurulmuş ve ürünlere el koyup vesika uygulaması gerçekten yürütülmüştür."},"dogru":"Millî iktisat politikası yerli üretimi korumak için gümrük tarifelerini yükseltmiştir. Serbest ticaret ve düşük tarifeler bu dönemde uygulanmamıştır. Cevap E\u0027dir.","sinav":"I. Dünya Savaşı yıllarında Osmanlı Devleti\u0027nde uygulanan savaş ekonomisi politikalarından hangisi değildir?","kavramlar":[{"kaynak":"TEORI","tanim":"Yerli üretim ve girişimcileri korumak amacıyla gümrük tarifelerini yükseltip devlet desteği sağlayan ekonomik anlayış.","ad":"Millî iktisat politikası"},{"kaynak":"TEORI","tanim":"Osmanlı Devleti tarafından yabancı devletlere tanınan ve onların ticarette ayrıcalık sahibi olmalarını sağlayan anlaşmalar.","ad":"Kapitülasyonlar"},{"kaynak":"TEORI","tanim":"Savaş yıllarında erkeklerin silah altına alınması nedeniyle tarım üretiminin düşmesi sonucu ordu ve şehirlerin gıda ihtiyacının karşılanamaması sorunu.","ad":"İaşe Sorunu"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi I. Dünya Savaşı yıllarında Osmanlı Devleti\u0027nde uygulanan savaş ekonomisi politikalarından biri DEĞİLDİR?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-28","verilenler":[],"dayanak":"Kaynak metin - I. Dünya Savaşı Osmanlı Ekonomisi (Millî İktisat ve Savaş Finansmanı bölümleri)","dogru":"E","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Bursa\u0027da bir tekstil fabrikası 1916\u0027da vergi zammı değil, hükümetin bastığı karşılıksız kâğıt para yüzünden hammadde fiyatlarının bir yılda üç katına çıktığını görüyor; aynı yıl İaşe Nezareti şehre vesika usulü un dağıtımı başlatıyor.","anlatim":"Bu tek fabrika olayında beş ekonomik politika ifadesini tek tek test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 1914-1918 Osmanlı savaş ekonomisinde neler gerçekten uygulandı, neler uygulanmadı, bunu bu fabrika olayının rakamlarıyla beş ifadede sınayacağız.","anlatim":"Kural şu: devlet kâğıt para bastı, iaşe teşkilatı kurdu, kapitülasyonları kaldırdı, millî iktisatla yerli sermayeyi korudu ama gümrükleri asla düşürmedi. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.Savaş Finansmanı","karar":"doğru","anlatim":"Evet, devlet giderlerini evrak-ı nakdiye ile karşıladı, para arzı artınca enflasyon patladı. Fabrikadaki üç katlık artış tam bu mekanizmanın sonucudur.","formul":"Şık A: fabrika sahibi \u0027bu fiyat artışı devletin karşılıksız kâğıt para basmasından\u0027 diyor, doğru mu düşünüyor?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.İaşe Sorunu","karar":"doğru","anlatim":"Evet, tarım üretimi erkeklerin cepheye gitmesiyle düşünce hükümet İaşe Nezareti\u0027ni kurdu, ürünlere el koydu ve vesika uygulamasına geçti. Bu fabrikanın yaşadığı sıkıntı tam bu politikanın izidir.","formul":"Şık B: şehirdeki vesika usulü un dağıtımını görüp \u0027bu İaşe Nezareti\u0027nin işi\u0027 diyorsun, haklı mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.Sınav Tuzağı(1)","karar":"doğru","anlatim":"Evet, hükümet 1914\u0027te kapitülasyonları tek taraflı kaldırdığını ilan etti; hukuken kesin kalkış 1923 Lozan\u0027la olsa da ilan savaş yıllarında yapıldı. Fabrikatörün gözlemi savaş yıllarına aittir.","formul":"Şık C: fabrikatör \u0027artık yabancı ortaklarım eskisi gibi ayrıcalıklı değil, kapitülasyonlar kalktı\u0027 diyor, bu 1914\u0027te mi oldu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.Millî İktisat","karar":"doğru","anlatim":"Evet, İttihat ve Terakki Müslüman-Türk girişimci sınıfı yaratmak için yerli şirket ve millî bankaları destekledi. Bu fabrikanın kredi alması tam bu korumacı politikanın örneğidir.","formul":"Şık D: fabrika \u0027millî banka kredisiyle büyüdük, devlet yerli şirketleri destekliyor\u0027 diyor, bu millî iktisat mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.Savaşa Giriş ve Gümrük Politikası","karar":"yanlış","anlatim":"Hayır, kapitülasyonlar kalkınca gümrük tarifesi yükseltildi, spesifik tarifeye geçilerek yerli üretim korundu. Fabrikanın ithal malla serbestçe rekabet ettiği iddiası gerçeği yansıtmaz.","formul":"Şık E: fabrikatör \u0027gümrük tarifeleri düşürülüp serbest ticarete geçildi, ithal kumaş rahat giriyor\u0027 diyor, bu doğru mu?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Bu dönemde devlet her yerde korumacı ve müdahaleci davrandı, serbest ticaret hiç yaşanmadı. Kendine hep şunu sor: bu politika devleti güçlendiriyor mu, yoksa piyasayı serbest mi bırakıyor?","doldur":[]}],"anahtar":[{"ornek":"fabrika","kok":"fabrik"},{"ornek":"serbest","kok":"serbes"},{"ornek":"devlet","kok":"devlet"},{"ornek":"tarife","kok":"tarife"},{"ornek":"politikası","kok":"politi"},{"ornek":"korumacıdır","kok":"koruma"}],"konuGiris":{"harita":"Ne zaman uygulandı: Bu politikalar 1914-1918 savaş yılları boyunca yürürlükteydi. Nasıl ölçülür: Sorunun \u0027değildir\u0027 ya da \u0027sonucudur\u0027 ifadesiyle hangi uygulamanın gerçek, hangisinin uydurma olduğu ayrılır. Nasıl kaydedilir: Millî iktisat, kâğıt para, iaşe sorunu ve kapitülasyonların kaldırılması ayrı ayrı olaylar olarak hatırlanır.","desen":"Soru \u0027değildir\u0027 kalıbıyla sorulup gerçekte yaşanmamış ya da başka döneme ait bir uygulamayı seçeneklere karıştırır. Tuzak, kapitülasyonların hukuken kesin kaldırılışının 1923 Lozan\u0027la olduğunu, 1914\u0027teki ilanın tek taraflı olduğunu karıştırmaktır; ayrıca enflasyonun nedeni vergi artışı değil kâğıt paradır. Bu soru p.28 sınav tuzağı maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Müslüman-Türk girişimci sınıfı yaratmayı amaçlayan korumacı devlet politikası","ad":"Millî İktisat","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Devletin savaş giderlerini karşılamak için bastığı karşılıksız kâğıt para","ad":"Evrak-ı Nakdiye","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Erkeklerin cepheye gitmesiyle ortaya çıkan beslenme ve gıda kıtlığı sorunu","ad":"İaşe Sorunu","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Yabancılara tanınan ayrıcalıkların 1914\u0027te tek taraflı sona erdirilmesi","ad":"Kapitülasyonların Kaldırılması","kim":"kanun sabitler"}],"sinavda":"Soru, savaş ekonomisi uygulamalarından hangisinin gerçekte yapılmadığını seçenekler arasından bulmanı ister.","panel_ornek":"Bir ailenin evindeki un, şeker gibi temel gıdalar kıtlaşınca market karneyle satış yapmaya başlar; herkes sadece belirlenen miktarı alabilir. Bu, savaş yıllarındaki \u0027vesika\u0027 uygulamasının küçük bir benzeridir.","ornek":"Bir ailenin evindeki un, şeker gibi temel gıdalar kıtlaşınca market karneyle satış yapmaya başlar; herkes sadece belirlenen miktarı alabilir. Bu, savaş yıllarındaki \u0027vesika\u0027 uygulamasının küçük bir benzeridir.","yontemler":"Her seçeneği millî iktisat, kâğıt para, iaşe sorunu ve kapitülasyon kaldırma başlıklarından biriyle eşleştirip eşleşmeyeni bul; tarih ve kişi karıştırmalarına dikkat et.","nedir":"I. Dünya Savaşı yıllarında Osmanlı Devleti\u0027nin uyguladığı savaş ekonomisi politikalarını anlatır. Sınav, hangi uygulamanın gerçekten yapıldığını hangisinin uydurma/yanlış olduğunu ayırt etmeni ölçer."},"olay":"","tuzak":{"C":{"ad":"Zamanlama Tuzağı","metin":"Kapitülasyonların hukuken ancak 1923 Lozan\u0027da kalktığını bilip 1914\u0027teki tek taraflı ilanı yok sayarsan bu şıkkı seçersin. Doğrusu: 1914\u0027te tek taraflı kaldırma ilan edilmiştir, ifade doğrudur."},"A":{"ad":"Karşılıksız Para Tuzağı","metin":"Bu ifadeyi \u0027gerçekleşmemiş\u0027 sayarsan enflasyonun asıl kaynağını gözden kaçırırsın. Doğrusu: Devlet giderlerini karşılıksız kağıt para basarak karşılamış, bu enflasyona yol açmıştır; ifade doğrudur, soru bunu sormuyor."},"D":{"ad":"Politika Türü Tuzağı","metin":"Millî iktisadı liberal bir açılım sanıp bu şıkkı yanlış zannedersin. Doğrusu: Millî iktisat korumacı ve devlet destekli bir politikadır, yerli şirket ve millî banka desteği gerçekten uygulanmıştır."},"B":{"ad":"Kapsam Tuzağı","metin":"İaşe sorununu savaşın sonucu değil de ayrı bir dönem olayı sayıp bu şıkkı işaretlersen yanılırsın. Doğrusu: İaşe Nezareti kurulmuş ve vesika uygulaması gerçekten yapılmıştır, ifade doğrudur."}},"celdiriciYol":{},"hap":"I. Dünya Savaşı\u0027nda millî iktisat korumacıdır: kapitülasyon kalkınca tarife yükselmiş, serbest ticaret değil devlet destekli yerli üretim uygulanmıştır.","teshis":{"C":{"gercek":"Osmanlı hükümeti 1914\u0027te kapitülasyonları tek taraflı olarak kaldırdığını ilan etmiştir; kesin kaldırılış Lozan\u0027ladır ama ilan savaş yıllarında yapılmıştır.","ayirt":"Soru \u0027hukuken kesin kalkış\u0027 mı yoksa \u0027savaş yıllarındaki ilan\u0027 mı soruyor?","paragraf":"Kaynak metin - Sınav Tuzağı (1)","yanilgi":"Kapitülasyonların hukuken 1923\u0027te kalktığını bilip 1914\u0027teki ilanın hiç yapılmadığını düşünüyorsun."},"E":{"gercek":"Kapitülasyonların kaldırılmasının ardından gümrük tarifesi YÜKSELTİLMİŞ, spesifik tarifeye geçilerek yerli üretim korunmuştur; serbest ticaret uygulanmamıştır.","ayirt":"Kapitülasyonlar kalkınca tarifeler yükseldi mi, düştü mü?","paragraf":"Kaynak metin - Savaşa Giriş ve Gümrük Politikası bölümü","yanilgi":"Bu şıkkı elerken de kapitülasyonların kaldırılmasıyla gümrük tarifelerinin düşürüldüğünü karıştırabilirsin."},"A":{"gercek":"Devlet karşılıksız kağıt para basarak para arzını artırmış, bu da yüksek enflasyona neden olmuştur.","ayirt":"Bu ifade savaş yıllarında gerçekten uygulanan bir politika mı, yoksa savaş sonrası bir gelişme mi?","paragraf":"Kaynak metin - Savaş Finansmanı bölümü","yanilgi":"Kağıt para basımını enflasyonla ilişkilendirmeyip bunun savaş döneminde yaşanmadığını düşünüyorsun."},"D":{"gercek":"Millî iktisat, Müslüman-Türk girişimci sınıfı yaratmayı amaçlayan korumacı ve devlet destekli bir politikadır; yerli şirket ve millî banka desteği bu politikanın parçasıdır.","ayirt":"Bu politika devletin müdahalesiyle mi yürütüldü, yoksa serbest piyasaya mı bırakıldı?","paragraf":"Kaynak metin - Millî İktisat bölümü","yanilgi":"Millî iktisadı serbest piyasa anlayışıyla karıştırıp bu şıkkı yanlış sayıyorsun."},"B":{"gercek":"Tarımsal üretim düşünce ordu ve şehirlerin beslenmesi sorun olmuş, hükümet İaşe Nezareti\u0027ni kurarak vesika uygulamasına gitmiştir.","ayirt":"Bu tedbir cephe gerisindeki gıda krizine karşı savaş sırasında mı alındı?","paragraf":"Kaynak metin - İaşe Sorunu bölümü","yanilgi":"İaşe Nezareti ve vesika uygulamasını savaş sonrası bir düzenleme sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 19"},"kural":"Millî iktisat politikası korumacı ve devlet destekli bir anlayıştır; gümrük tarifeleri yükseltilmiş, yerli şirket ve bankalar devlet eliyle desteklenmiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 19","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Değildir\u0027 sorularında dört ifadenin ortak doğru temasını bul, beşincisi o temaya ters düşen ifadedir.","konu":"i. dünya savaşı osmanlı ekonomisi","tablo":{"satirlar":[["A) Hükümet, kapitülasyonları tek taraflı olarak kaldırdığın…","p.1","doğru ifade"],["B) Devlet, savaş giderlerini karşılıksız kağıt para basarak…","p.1","doğru ifade"],["C) Erkeklerin silah altına alınması tarımsal üretimin düşme…","p.1","doğru ifade"],["D) Millî iktisat politikası, yabancı sermayeye karşı libera…","p.1","YANLIŞ ifade"],["E) Savaş yıllarında vurgunculuk yaparak zenginleşen \u0027harp z…","p.1","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Erkeklerin silah altına alınması tarımsal üretimin düşmesine ve iaşe sorununa yol açmıştır.","E":"Savaş yıllarında vurgunculuk yaparak zenginleşen \u0027harp zengini\u0027 denen bir kesim ortaya çıkmıştır.","A":"Hükümet, kapitülasyonları tek taraflı olarak kaldırdığını ilan etmiştir.","D":"Millî iktisat politikası, yabancı sermayeye karşı liberal bir serbest piyasa anlayışıyla uygulanmıştır.","B":"Devlet, savaş giderlerini karşılıksız kağıt para basarak finanse etmiştir."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - i. dunya savasi osmanli ekonomisi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Savaşa girilen 1914 yılında Osmanlı hükümeti KAPİTÜLASYONLARI TEK TARAFLI KALDIRDIĞINI ilan etti ve yabancılara tanınan ayrıcalıkları sona erdirdi; ardından gümrük tarifesi yükseltilip yerli üretimi koruyan spesifik tarifeye geçildi. İttihat ve Terakki yönetimi MİLLÎ İKTİSAT politikası izledi: Müslüman-Türk girişimci sınıfı yaratmak için yerli şirketler, millî bankalar ve esnaf-tüccar kooperatifleri desteklendi; yabancı şirketlerde Türkçe yazışma zorunluluğu getirildi; Ziya Gökalp ve Tekin Alp bu görüşün fikir öncüleridir. SAVAŞ FİNANSMANI: Devlet giderlerini karşılıksız KÂĞIT PARA (evrak-ı nakdiye) basarak ve Almanya\u0027dan borç alarak karşıladı; para arzı arttı, altın karşılığı düştü, yüksek ENFLASYON ve karaborsa doğdu. Erkeklerin silah altına alınması tarım üretimini düşürdü; ordu ve büyük şehirlerin beslenmesi İAŞE SORUNUnu doğurdu; hükümet İaşe Nezareti kurup ürünlere el koydu, vesika uygulaması yaptı. Savaş yıllarında \u0027harp zenginleri\u0027 denen vurguncu bir kesim ortaya çıktı; hükümet ihtikârla (vurgunculukla) mücadele düzenlemeleri yaptı. Dış ticaret İtilaf ablukası yüzünden neredeyse durdu; ekonomi Almanya\u0027ya bağımlı hâle geldi. SONUÇ: Savaş sonunda Osmanlı ekonomisi çökmüş, dış borç ve Düyun-u Umumiye yükü ağırlaşmış, üretim ve nüfus kaybı büyümüştü; bu tablo Millî Mücadele\u0027nin yoksul iktisadi zeminini oluşturdu. SINAV TUZAĞI: (1) Kapitülasyonlar 1914\u0027te tek taraflı kaldırıldı ama hukuken kesin kaldırılışı 1923 Lozan Barış Antlaşması iledir. (2) Savaş enflasyonunun temel nedeni karşılıksız kâğıt paradır, ver…"},{"ad":"TEORI - i. dunya savasi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: I. Dünya Savaşı 1914–1918 yılları arasında İtilaf Devletleri (İngiltere, Fransa, Rusya; sonra İtalya, ABD) ile İttifak Devletleri (Almanya, Avusturya-Macaristan; sonra Osmanlı Devleti, Bulgaristan) arasında yapıldı. NEDENLER: Sömürgecilik ve ham madde yarışı, Almanya–İngiltere ekonomik rekabeti, Fransa\u0027nın Alsas-Loren\u0027i geri alma isteği, Balkanlar\u0027da Rusya–Avusturya çekişmesi, silahlanma ve bloklaşma; görünürdeki neden Avusturya veliahdının Saraybosna\u0027da öldürülmesidir. OSMANLI\u0027NİN GİRİŞİ: Osmanlı Devleti 1914 sonbaharında Almanya yanında savaşa girdi; Goeben ve Breslau gemilerinin Karadeniz\u0027de Rus limanlarını vurması fiilî girişi sağladı. Nedenler: kaybedilen toprakları geri alma umudu, Almanya\u0027nın savaşı kazanacağı inancı, İttihat ve Terakki yönetiminin Alman yanlılığı, kapitülasyonlardan kurtulma isteği. CEPHELER: Taarruz cepheleri Kafkas (Sarıkamış felaketi) ve Kanal; savunma cepheleri Çanakkale (1915 zafer, Mustafa Kemal Anafartalar), Irak (Kut\u0027ül Amare zaferi 1916), Suriye-Filistin, Hicaz-Yemen; müttefiklere yardım cepheleri Galiçya, Makedonya, Romanya. SONUÇ: Osmanlı Devleti 30 Ekim 1918 Mondros Ateşkes Antlaşması ile savaştan çekildi; savaş 11 Kasım 1918\u0027de Almanya\u0027nın ateşkesiyle bitti. Wilson İlkeleri (Ocak 1918) barışın çerçevesini çizdi; yenilenlerle Paris Barış Konferansı\u0027nda antlaşmalar yapıldı: Versay (Almanya), Sen Jermen (Avusturya), Nöyyi (Bulgaristan), Triyanon (Macaristan), Sevr (Osmanlı, 10 Ağustos 1920; TBMM tanımadı, uygulanmadı). İmparatorluklar dağıldı, yeni ulus devletler kuruldu, Mille…"}],"hakem":"Soru I. Dünya Savaşı yıllarında Osmanlı ekonomisini ölçmekte, doğru sık kaynak metinde açıkça tanımlanan millî iktisat politikasının korumacı-müdahaleci (liberal değil) niteliğine dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Erkeklerin silah altına alınması tarım işçiliğini azaltmış, üretimi düşürmüş ve iaşe sorununu doğurmuştur; bu nedensellik tamamen gerçektir.","E":"Savaş yıllarında harp zenginleri denen vurguncu kesim ihtikâr yoluyla zenginleşmiştir; hükümet bu uygulamalarla mücadele etmiştir ve ifade olaylar gerçeğine uyguntur.","A":"Kapitülasyonların 1914\u0027te tek taraflı olarak kaldırılması gerçekten yaşanmış bir olaydır; hükümet bu ilanla yabancılara tanınan ayrıcalıkları sonlandırmıştır.","B":"Savaş giderlerini karşılıksız kâğıt para basarak finanse etmek doğrudur; bu, enflasyonun temel nedenidir ve yaşanan ekonomik gerçekliğin bir parçasıdır."},"dogru":"Millî iktisat politikası korumacı ve devlet destekli bir anlayıştır. Gümrük tarifeleri yükseltilmiş, yerli şirketler ve bankalar devlet eliyle korunmuş ve desteklenmiştir. Liberal serbest piyasa anlayışıyla uygulanması tamamen yanlıştır.","sinav":"I. Dünya Savaşı yıllarında Osmanlı Devleti\u0027nde yaşanan ekonomik gelişmelerden hangisi millî iktisat politikasının temel prensibine aykırıdır?","kavramlar":[{"kaynak":"TEORI","tanim":"Yerli üreticiyi korumak ve yabancı rekabete karşı devlet desteğiyle güçlendirmek amacıyla gümrük tarifeleri yükseltme, yerli şirket ve bankalar kurma, kooperatif destekleme yoluyla izlenen ekonomik anlayıştır.","ad":"Millî iktisat politikası"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi I. Dünya Savaşı yıllarında Osmanlı Devleti\u0027nde yaşanan ekonomik gelişmelerden biri değildir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-28","verilenler":[],"dayanak":"Konu özeti - I. Dünya Savaşı yıllarında Osmanlı ekonomisi (TESMER SGS Atatürk İlkeleri ve İnkılap Tarihi ders içeriği)","dogru":"D","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1917 yılında İstanbul\u0027da bir tüccar, savaş yıllarında elindeki şekeri stoklayıp yüksek fiyattan satarak kısa sürede büyük servet edinir; halk arasında ona \u0027harp zengini\u0027 denir. Aynı dönemde hükümet Alman bankalarından borç alır, kâğıt para basar, gençleri askere çağırır ve tarlalar boş kalır.","anlatim":"Bu olay, savaş ekonomisinin bütün yüzlerini bir arada gösteriyor. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Osmanlı Devleti savaş yıllarında kapitülasyonları kaldırdı, kâğıt para bastı, erkekleri askere aldı, korumacı bir millî iktisat izledi ve harp zengini denen kesim doğdu; beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural burada tek: dönemin ekonomik gerçekliğine bak, ona uymayanı bul. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.1","karar":"doğru","anlatim":"Olayda hükümet gerçekten 1914\u0027te bunu ilan etti, yabancı ayrıcalıklarını sona erdirdi. Hukuken kesinleşme 1923\u0027te olsa da ilan gerçektir, ifade doğru.","formul":"Şık A: hükümet 1914\u0027te \u0027kapitülasyonları tek taraflı kaldırdık\u0027 diyor, bu doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.1","karar":"doğru","anlatim":"Olayda tüccar bunu fırsat bilip stokçuluk yapıyor, çünkü para değersizleşiyor. Devlet gerçekten evrak-ı nakdiye basmış, enflasyon büyümüş, ifade doğru.","formul":"Şık B: devlet \u0027savaş giderlerini karşılıksız kâğıt para basarak karşılayalım\u0027 diyor, bu doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.1","karar":"doğru","anlatim":"Olayda tarlalar boş kalıyor, ordu ve şehirler beslenme sıkıntısı çekiyor. Hükümet İaşe Nezareti kurup vesika uyguluyor, ifade doğru.","formul":"Şık C: \u0027erkekler askere alınınca tarım üretimi düştü ve iaşe sorunu çıktı\u0027 diyor, bu doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.1","karar":"yanlış","anlatim":"Olayda hükümet yabancıya değil yerli girişimciye destek veriyor, gümrük tarifesini yükseltiyor, yerli banka ve kooperatif kuruyor. Bu korumacı bir devlet müdahalesi, liberal serbest piyasa değil, ifade yanlış.","formul":"Şık D: \u0027millî iktisat, yabancı sermayeye açık liberal serbest piyasa anlayışıdır\u0027 diyor, sen buna katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.1","karar":"doğru","anlatim":"Olayın kendisi zaten bu: tüccar vurgunculukla zenginleşiyor, hükümet ihtikârla mücadele ediyor. Bu tam olayda gördüğümüz şey, ifade doğru.","formul":"Şık E: tüccarın stokçulukla zenginleşmesini \u0027harp zengini denen vurguncu kesim ortaya çıktı\u0027 diye adlandırıyorsun, doğru mu?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Dört ifade savaş yıllarının gerçek yüzünü anlatıyor, biri millî iktisadı yanlış tanımlıyor. Kendine sor: devlet piyasaya müdahale mi etti, yoksa onu serbest mi bıraktı?","doldur":[]}],"anahtar":[{"ornek":"olayda","kok":"olayda"},{"ornek":"devlet","kok":"devlet"},{"ornek":"gerçekliğine","kok":"gerçek"},{"ornek":"hükümet","kok":"hüküme"},{"ornek":"destekli","kok":"destek"},{"ornek":"iktisat","kok":"iktisa"}],"konuGiris":{"harita":"Ne zaman test edilir: doğru-yanlış eşleştirmeli veya \u0027değildir\u0027 tipi çoktan seçmeli sorularda test edilir. Nasıl ölçülür: hangi gelişmenin savaş yıllarına ait olduğu, hangisinin sonradan (Lozan gibi) gerçekleştiği ayrımıyla ölçülür. Nasıl kaydedilir: olay-tarih eşleşmesi olarak ezberlenir, kayıt tutulmaz.","desen":"Sınav genelde \u0027hangisi değildir\u0027 formatıyla millî iktisat, enflasyon, iaşe sorunu gibi gerçek gelişmeleri kapitülasyonların 1923\u0027te kesin kalkışı gibi sonraki bir olayla karıştırır. Vergi artışı enflasyon nedeni gibi gösterilerek de tuzak kurulur. Bu soru p.28 sınav tuzağı maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"1914\u0027te tek taraflı ilan edildi, hukuken kesin kaldırılışı 1923 Lozan\u0027dadır","ad":"Kapitülasyonların kaldırılması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"yerli girişimciyi devlet desteğiyle koruyan iktisat politikası","ad":"Millî İktisat","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"karşılıksız basılan kâğıt para, enflasyonun temel nedeni","ad":"Evrak-ı nakdiye","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"tarım üretimi düşünce ortaya çıkan beşin kıtlığı durumu","ad":"İaşe sorunu","kim":"kanun sabitler"}],"sinavda":"Soru, savaş yıllarındaki ekonomik gelişmelerin listesini verir ve bunlardan hangisinin bu döneme ait OLMADIĞINI sorar.","panel_ornek":"Arkadaşının ailesi savaş yılları gibi zor bir dönemde, elindeki 5 bin liralık birikimin değeri her ay eriyip 4 bin, sonra 3 bin liraya düşse; markette fiyatlar sürekli artsa ama market sahibi malı gizleyip yüksek fiyata satsa, bu tam anlamıyla enflasyon ve karaborsa halidir.","ornek":"Arkadaşının ailesi savaş yılları gibi zor bir dönemde, elindeki 5 bin liralık birikimin değeri her ay eriyip 4 bin, sonra 3 bin liraya düşse; markette fiyatlar sürekli artsa ama market sahibi malı gizleyip yüksek fiyata satsa, bu tam anlamıyla enflasyon ve karaborsa halidir.","yontemler":"Her seçeneği ayrı ayrı \u0027bu 1914-1918 arasında mı oldu\u0027 diye sorgula; tarih uyuşmazsa o seçenek cevaptır.","nedir":"I. Dünya Savaşı yıllarında Osmanlı ekonomisinde yaşanan değişimleri (kapitülasyonlar, millî iktisat, enflasyon, iaşe sorunu) konu alır. Sınav bu gelişmelerden hangisinin gerçek hangisinin tuzak olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Zincirleme Sonuç Tuzağı","metin":"Tarım üretimindeki düşüşü savaşla ilişkisiz doğal bir nedene bağlıyorsun. Doğrusu: erkeklerin silah altına alınması üretimi doğrudan düşürmüş, bu da iaşe sorununu doğurmuştur, ifade doğrudur."},"E":{"ad":"Kavram Yanılgısı Tuzağı","metin":"Harp zenginlerinin sıradan ticaretle zenginleştiğini düşünüyorsun. Doğrusu: bu kesim vurgunculuk (ihtikâr) yoluyla zenginleşmiştir, hükümet bunlarla mücadele etmiştir, ifade doğrudur."},"A":{"ad":"Ters Dönem Tuzağı","metin":"Kapitülasyonların kaldırılışını yalnız 1923 Lozan\u0027a bağlayıp 1914\u0027teki tek taraflı ilanı yok sayıyorsun. Doğrusu: hükümet 1914\u0027te kapitülasyonları tek taraflı kaldırdığını ilan etmiştir, bu ifade doğrudur."},"B":{"ad":"Neden Karıştırma Tuzağı","metin":"Savaş enflasyonunu vergi artışına bağlıyorsun. Doğrusu: enflasyonun temel nedeni devletin karşılıksız kağıt para basmasıdır, ifade doğrudur."}},"celdiriciYol":null,"hap":"Millî iktisat politikası korumacı ve devlet destekli bir anlayıştır, liberal serbest piyasacılık değildir.","teshis":{"C":{"gercek":"Erkeklerin silah altına alınması tarım üretimini düşürmüş, ordu ve şehirlerin beslenmesi sorununu (iaşe) doğurmuştur.","ayirt":"Üretimi düşüren asıl neden nüfus mu, iklim mi?","paragraf":"Konu özeti - I. Dünya Savaşı Osmanlı ekonomisi","yanilgi":"Tarımsal üretimdeki düşüşü savaşla bağlantısız doğal bir sebebe bağlıyorsun."},"E":{"gercek":"Savaş yıllarında ortaya çıkan harp zenginleri vurgunculuk (ihtikâr) yoluyla zenginleşmiş, hükümet bunlarla mücadele için düzenleme yapmıştır.","ayirt":"Bu zenginleşme normal ticaretle mi, karaborsayla mı oldu?","paragraf":"Konu özeti - I. Dünya Savaşı Osmanlı ekonomisi","yanilgi":"Harp zenginlerinin sıradan ticaretle zenginleştiğini, vurgunculukla ilgisi olmadığını sanıyorsun."},"A":{"gercek":"1914\u0027te hükümet tek taraflı ilanla kapitülasyonları kaldırdığını duyurmuş, hukuken kesinleşme ise 1923 Lozan\u0027la olmuştur; ikisi ayrı olgudur.","ayirt":"1914\u0027te ne ilan edildi, 1923\u0027te ne kesinleşti?","paragraf":"Konu özeti - I. Dünya Savaşı Osmanlı ekonomisi","yanilgi":"Kapitülasyonların kaldırılışını yalnız 1923 Lozan ile sınırlı sanıp 1914\u0027teki ilanı gerçek dışı sayıyorsun."},"D":{"gercek":"Millî iktisat korumacı ve devlet destekli bir politikadır: gümrük tarifesi yükseltilmiş, yerli şirket-banka-kooperatifler devlet eliyle desteklenmiş, yabancı şirketlere Türkçe yazışma zorunluluğu getirilmiştir.","ayirt":"Devlet piyasaya müdahale mi etti, yoksa onu serbest mi bıraktı?","paragraf":"Konu özeti - I. Dünya Savaşı Osmanlı ekonomisi","yanilgi":"Millî iktisadı \u0027yerli girişimciyi destekleme\u0027 diye duyup bunu serbest piyasacılık sanıyorsun; oysa eleyen öğrenci bu ifadeyi doğru gibi okur."},"B":{"gercek":"Devlet giderlerini karşılıksız kağıt para basarak karşılamış, para arzı artmış, altın karşılığı düşmüş ve yüksek enflasyon doğmuştur.","ayirt":"Enflasyon para arzından mı, vergiden mi kaynaklandı?","paragraf":"Konu özeti - I. Dünya Savaşı Osmanlı ekonomisi","yanilgi":"Savaş enflasyonunun kaynağını vergi artışı sanıp bu doğru ifadeyi şüpheyle karşılıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 19"},"kural":"","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 19","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Roma rakamlı listede her maddenin TARİHİNİ tek tek belirleyip 1876-1909 aralığına uyup uymadığını kontrol et, gruplama yaparken atlanan madde arama.","konu":"ii. abdülhamit dönemi","tablo":null,"siklar":{"C":"I, III ve IV","E":"I ve IV","A":"I ve II","D":"II, III ve IV","B":"II ve III"},"kaynak":{"alinti":"da ilan edildi, Düyun-u Umumiye İdaresi 1881","liste":[{"ad":"TEORI - ii. abdulhamit donemi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: II. ABDÜLHAMİT 1876\u0027da tahta çıktı ve 1909\u0027a kadar 33 yıl hüküm sürdü. I. MEŞRUTİYET: 23 ARALIK 1876\u0027da Mithat Paşa öncülüğündeki Genç Osmanlıların hazırladığı KANUN-İ ESASİ ilan edildi; Osmanlı\u0027nın ilk anayasasıdır; Meclis-i Mebusan 1877\u0027de açıldı. 93 HARBİ (1877–1878 Osmanlı-Rus Savaşı) ağır yenilgiyle bitti; AYASTEFANOS ve ardından BERLİN ANTLAŞMASI (1878) ile Sırbistan, Karadağ, Romanya bağımsız oldu, Kars-Ardahan-Batum Rusya\u0027ya bırakıldı, Kıbrıs\u0027ın yönetimi İngiltere\u0027ye verildi (1878). Padişah savaşı gerekçe gösterip 1878\u0027de meclisi kapattı; 30 yıl süren İSTİBDAT dönemi başladı. EKONOMİ: Dış borçların ödenememesi üzerine 1881 Muharrem Kararnamesi ile DÜYUN-U UMUMİYE İDARESİ kuruldu; alacaklı devletlerin temsilcileri Osmanlı gelirlerine el koydu. Tunus Fransa (1881), Mısır İngiltere (1882) tarafından işgal edildi. EĞİTİM VE ALTYAPI: Mülkiye, Hukuk, Ticaret, Güzel Sanatlar okulları ve Darülfünun geliştirildi; Hicaz Demiryolu, telgraf ağı, Hamidiye Etfal Hastanesi gibi eserler yapıldı; basın ve düşünce özgürlüğü kısıtlandı, hafiye teşkilatı kuruldu. II. MEŞRUTİYET: İttihat ve Terakki\u0027nin baskısıyla 23 TEMMUZ 1908\u0027de Kanun-i Esasi yeniden yürürlüğe kondu; 31 MART OLAYI (13 Nisan 1909) Hareket Ordusu tarafından bastırıldı ve II. Abdülhamit 27 Nisan 1909\u0027da tahttan indirildi, yerine V. Mehmet Reşat geçti. SINAV TUZAĞI: (1) Kanun-i Esasi 1876\u0027dır, Tanzimat Fermanı (1839) Abdülmecit dönemidir. (2) Meclis 93 Harbi gerekçesiyle 1878\u0027de kapatıldı; İstibdat 1878–1908\u0027dir. (3) Düyun-u Umumiye 1881, ilk dış borç ise Kırı…"}],"hakem":"Soru II. Abdülhamit döneminde gerçekleşen olayları sormakta, doğru cevap (C) I, III ve IV kaynakta açıkça desteklenmektedir: Kanun-i Esasi 23 Aralık 1876\u0027da ilan edildi, Düyun-u Umumiye İdaresi 1881\u0027de kuruldu, Tunus 1881\u0027de Fransa tarafından işgal edildi."},"kayitlar":[],"sade":{"siklar":{"D":"Düyun-u Umumiye ve Tunus işgalini doğru saysan da Tanzimat Fermanı\u0027nı (1839) yanlış biçimde II. Abdülhamit dönemine ait saydın; II yerine Kanun-i Esasi I eklenmelidir.","E":"Kanun-i Esasi ve Tunus işgalini doğru seçtin ama dış borç krizinin yapısal sonucu olan Düyun-u Umumiye İdaresi\u0027ni (1881) atladın; bu kurumu listeye eklemedin.","A":"Tanzimat Fermanı\u0027nı II. Abdülhamit dönemine dahil etmişsin; oysa 1839\u0027da Abdülmecit döneminde ilan edilmiştir. Ayrıca Düyun-u Umumiye İdaresi ve Tunus işgalini atlayarak dönemin tam resmini çizememişsin.","B":"Tanzimat Fermanı\u0027nı doğru dönemin (Abdülmecit) fermanını yanlış dönemin (II. Abdülhamit) listesine almışsın. Kanun-i Esasi ve Tunus işgalini unutup kapsam eksikliğine düşmüşsün."},"dogru":"II. Abdülhamit 1876–1909 arasında hüküm sürdü. Bu dönemde Kanun-i Esasi ilan edildi, Düyun-u Umumiye İdaresi kuruldu ve Tunus Fransa tarafından işgal edildi. Tanzimat Fermanı ise 1839\u0027da Abdülmecit döneminde ilan edilmiş olduğu için II. Abdülhamit dönemine ait değildir.","sinav":"II. Abdülhamit döneminde (1876–1909) Kanun-i Esasi, Düyun-u Umumiye İdaresi ve Tunus işgali bu döneme aittir; Tanzimat Fermanı 1839 Abdülmecit dönemine aittir.","kavramlar":[{"kaynak":"TEORI","tanim":"23 Aralık 1876\u0027da Mithat Paşa ve Genç Osmanlılar tarafından hazırlanan Osmanlı İmparatorluğu\u0027nun ilk anayasası; Meclis-i Mebusan\u0027ın açılmasını sağlamıştır.","ad":"Kanun-i Esasi"},{"kaynak":"TEORI","tanim":"1881 Muharrem Kararnamesi ile kurulan ve alacaklı devletlerin temsilcilerinin Osmanlı gelirlerine el koymalarını sağlayan idare; dış borçların ödenmesini yönetmiştir.","ad":"Düyun-u Umumiye İdaresi"},{"kaynak":"TEORI","tanim":"93 Harbi gerekçesiyle 1878\u0027de Meclis-i Mebusan\u0027ın kapatılmasından sonra başlayan ve 1908\u0027e kadar süren 30 yıllık mutlakiyet dönemi.","ad":"İstibdat"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"I. Kanun-i Esasi ilan edilmiştir. II. Tanzimat Fermanı ilan edilmiştir. III. Düyun-u Umumiye İdaresi kurulmuştur. IV. Tunus, Fransa tarafından işgal edilmiştir. Yukarıdakilerden hangileri II. Abdülhamit döneminde gerçekleşmiştir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-29","verilenler":[],"dayanak":"TESMER SGS konu özeti - Atatürk İlkeleri ve İnkılap Tarihi, II. Abdülhamit Dönemi","dogru":"C","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[],"anahtar":[{"ornek":"aittir","kok":"aittir"},{"ornek":"tanzimat","kok":"tanzim"},{"ornek":"abdülhamit","kok":"abdülh"},{"ornek":"fermanı","kok":"ferman"},{"ornek":"işgalleri","kok":"işgall"},{"ornek":"abdülmecit","kok":"abdülm"}],"konuGiris":{"harita":"Ne zaman test edilir: bir olayın hangi padişah dönemine ait olduğu karıştırılarak sorulduğunda test edilir. Nasıl ölçülür: verilen olay listesinden II. Abdülhamit dönemine ait olanları/olmayanları ayırt edebilme ile ölçülür. Nasıl kaydedilir: her olay kendi tarihi ve padişahıyla eşleştirilerek hafızada tutulur.","desen":"Tuzak, Tanzimat Fermanı (1839, Abdülmecit) ile Kanun-i Esasi\u0027nin (1876, Abdülhamit) karıştırılmasıdır. Düyun-u Umumiye ve Tunus işgali doğru şekilde Abdülhamit dönemine ait sayılır. Bu soru Tanzimat-Meşrutiyet dönem ayrımı noktasından geliyor (p.28).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"1876\u0027da ilan edilen, Osmanlı\u0027nın ilk anayasası","ad":"Kanun-i Esasi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1839\u0027da Abdülmecit döneminde ilan edilen ferman","ad":"Tanzimat Fermanı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1881\u0027de dış borçlar için kurulan alacaklı kontrol kurumu","ad":"Düyun-u Umumiye İdaresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1881\u0027de Fransa tarafından gerçekleşen işgal olayı","ad":"Tunus\u0027un işgali","kim":"kanun sabitler"}],"sinavda":"Roma rakamlı dört olay verilir ve hangilerinin II. Abdülhamit döneminde gerçekleştiği sorulur.","panel_ornek":"Bir arkadaşın 10 taksitle telefon aldı ama 3. ayda taksitleri ödeyemedi, bunun üzerine mağaza onun maaşına doğrudan el koyan bir anlaşma yaptı. İşte Osmanlı da borcunu ödeyemeyince alacaklılar devl
