 getirdiği hakları (aile-miras-toplumsal) siyasal haklardan (seçme-seçilme) net ayır; siyasal haklar bu kanunda yoktur.","nedir":"Türk Medeni Kanunu, aile ve miras hukukunu laik ve eşitlikçi esaslara göre yeniden düzenleyen temel kanundur. Sınav bu kanunun neyi getirip neyi getirmediğini, kaynağını ve tarihini ölçer."},"olay":"Milletvekili seçme-seçilme hakkı 1934 yılındaki ayrı bir yasal düzenlemeyle gelmiştir, 1926 Medeni Kanunu\u0027nun kapsamında değildir.","tuzak":{"D":{"ad":"Miras Eşitliği Tuzağı","metin":"Mirasta eşitlik de kanunun doğrudan getirdiği bir sonuçtur, bu nedenle \u0027gerçekleşmemiştir\u0027 ifadesine uymaz. Doğrusu, miras hakkında kadın-erkek eşitliği sağlanmıştır."},"E":{"ad":"Yaş Eşitliği Tuzağı","metin":"Evlenme yaşında kadın-erkek eşitliği de kanunun düzenlediği ve gerçekleşen bir konudur. Doğrusu, evlenmede yaş eşitliği Medeni Kanun ile sağlanmıştır."},"A":{"ad":"Tek Eşlilik Tuzağı","metin":"Bu şık kanunun asıl getirdiği bir yenilik olduğu için \u0027gerçekleşmemiştir\u0027 sorusuna yanıt olamaz. Doğrusu, çok eşlilik Türk Medeni Kanunu ile yasaklanmıştır."},"B":{"ad":"Resmî Nikâh Tuzağı","metin":"Şer\u0027î usulle yetinme dönemi kanunla kapanmıştır, bu da gerçekleşen bir sonuçtur. Doğrusu, evlilik artık resmî nikâha bağlanmıştır."}},"celdiriciYol":{},"hap":"Türk Medeni Kanunu kadına medeni hakları verdi, siyasal hakları değil; siyasal haklar 1930 ve 1934\u0027te ayrı kanunlarla geldi.","teshis":{"C":{"gercek":"Türk Medeni Kanunu kadına medeni haklar (miras, boşanma, velayet, meslek seçme) tanımıştır; siyasal haklar 1930 (belediye) ve 1934 (milletvekili) yıllarında ayrı kanunlarla verilmiştir.","ayirt":"Bu hak 1926\u0027da mı, yoksa daha sonraki ayrı bir kanunla mı tanındı?","paragraf":"İnkılap tarihi, kadın hakları kronolojisi","yanilgi":"Medeni Kanun\u0027un kadına verdiği medeni hakları siyasal haklarla aynı sepete koyup, seçme-seçilme hakkının da bu kanunla geldiğini düşünüyorsun."},"E":{"gercek":"Kanun, evlenmede kadın ve erkek için eşit yaş şartı getirerek önceki dinî uygulamadaki farkı kaldırmıştır.","ayirt":"Bu düzenleme kanunun evlenme şartları arasında mı sayılıyor?","paragraf":"1926 Türk Medeni Kanunu, evlenme hükümleri","yanilgi":"Evlenme yaşındaki eşitliğin kanunla değil sonradan geldiğini sanıyorsun."},"A":{"gercek":"Türk Medeni Kanunu çok eşliliği doğrudan yasaklamış ve tek eşliliği getirmiştir.","ayirt":"Bu değişiklik 1926 kanununun metninde mi düzenlenmiş?","paragraf":"1926 Türk Medeni Kanunu, aile hukuku hükümleri","yanilgi":"Tek eşliliğin kabulünü de sonradan gelen bir hak sanıp bunun gerçekleşmediğini düşünüyorsun."},"D":{"gercek":"Türk Medeni Kanunu, Mecelle\u0027deki dinî esaslı miras taksimini kaldırarak kadın-erkek eşitliğini miras hukukuna da getirmiştir.","ayirt":"Bu eşitlik kanunun miras hükümlerinde açıkça düzenlenmiş mi?","paragraf":"1926 Türk Medeni Kanunu, miras hükümleri","yanilgi":"Mirasta eşitliğin kanunun kapsamı dışında kaldığını sanıyorsun."},"B":{"gercek":"Kanun, evliliğin geçerliliğini resmî nikâha bağlamış, dinî nikâhla yetinmeyi hukuken yetersiz kılmıştır.","ayirt":"Bu kural kanunun evlenmeye ilişkin maddelerinde mi yer alıyor?","paragraf":"1926 Türk Medeni Kanunu, evlenme hükümleri","yanilgi":"Resmî nikâh zorunluluğunun kanunla gelmediğini, hâlâ isteğe bağlı olduğunu sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 16"},"kural":"Devletçilik döneminde kurulan devlet bankaları alan bazında ayrışmıştır; Etibank maden ve enerji alanında kredi ve işletme faaliyeti için kurulmuştur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 16","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Kurum-alan eşleşmesini sor: hangi banka hangi sektörde işletici/kredi veren taraf, önce onu ayır.","konu":"atatürk dönemi ekonomik çalışmalar","tablo":{"satirlar":[["A) 1933 yılında Sümerbank ile birlikte kurulmuş, dokuma san…","Teori Notu, Sümerbank-Etibank ayrımı","YANLIŞ ifade"],["B) 1935 yılında maden ve enerji alanında kredi ve işletme f…","Teori Notu, Etibank (1935)","doğru ifade"],["C) İzmir İktisat Kongresi kararları doğrultusunda özel teşe…","Teori Notu, İzmir İktisat Kongresi 1923","YANLIŞ ifade"],["D) Teşvik-i Sanayi Kanunu kapsamında sanayi kurumlarına ver…","Teori Notu, Teşvik-i Sanayi Kanunu 1927","YANLIŞ ifade"],["E) İkinci Beş Yıllık Sanayi Planı çerçevesinde demir-çelik …","Teori Notu, Birinci/İkinci Beş Yıllık Sanayi Planı","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İzmir İktisat Kongresi kararları doğrultusunda özel teşebbüsü desteklemek amacıyla kurulmuştur","E":"İkinci Beş Yıllık Sanayi Planı çerçevesinde demir-çelik ve kimya yatırımlarını gerçekleştirmek üzere kurulmuştur","A":"1933 yılında Sümerbank ile birlikte kurulmuş, dokuma sanayii işletmeleri kurup işletmek amacını taşımıştır","D":"Teşvik-i Sanayi Kanunu kapsamında sanayi kurumlarına vergi muafiyeti sağlamak üzere kurulmuştur","B":"1935 yılında maden ve enerji alanında kredi ve işletme faaliyeti yürütmek amacıyla kurulmuştur"},"kaynak":{"alinti":"ın kuruluş amacını soruyor; kaynak metinde","liste":[{"ad":"Teori Notu - ataturk donemi ekonomi politikasi","metin":"Tetikte Teori Notu (Atatürk dönemi ekonomi politikası literatürünün yerleşik çerçevesi): Cumhuriyetin ekonomik temeli, Kurtuluş Savaşı hemen sonrasında toplanan İzmir İktisat Kongresi (1923) ile atılır; Misak-ı İktisadi ilkeleri çerçevesinde milli burjuvazi yaratma, kapitülasyonlardan arınma ve özel teşebbüsü destekleme hedeflenir, bu dönem liberal-devletçi karma çizgi olarak anılır, tam devletçilik değildir; sınavda bu ayrım sıklıkla sorulur. Bu yaklaşımın somut aracı Teşvik-i Sanayi Kanunu (1927) olup sanayi kurumlarına vergi muafiyeti, arazi tahsisi ve gümrük kolaylığı gibi teşvikler getirir; ancak sermaye birikimi yetersizliği ve 1929 Dünya Buhranı nedeniyle özel sektör odaklı model başarısız sayılır ve devletçilik politikasına geçiş hızlanır. Devletçilik, özel mülkiyeti reddetmeyen, devletin özellikle ağır sanayi ve alt yapıda doğrudan yatırımcı ve işletici olmasını öngören pragmatik bir modeldir; sosyalizm ile karıştırılmamalıdır, fark mülkiyetin tamamen kamulaştırılmaması ve özel sektörün varlığını sürdürmesidir. Planlı sanayileşmenin kurumsal ayağı olarak Birinci Beş Yıllık Sanayi Planı (1934) hazırlanır; dokuma, kağıt, cam, şeker gibi sektörlerde fabrikalar kurulmasını hedefler ve uygulamada devlet bankaları finansman üreticisi olur. Bu bağlamda Sümerbank (1933) sanayi işletmelerini kurup işletmek üzere, Etibank (1935) ise maden ve enerji alanında kredi ve işletme faaliyeti için kurulur; ikisi sık karıştırılır, fark Sümerbank\u0027ın imalat sanayine, Etibank\u0027ın maden-enerji sektörüne odaklanmasıdır. İkinci Beş Yıllık Sanayi Planı hazırlığı 1930\u0027ların sonuna sarkar, ağır…"}],"hakem":"Soru, Atatürk Dönemi devletçilik politikasının kurumsal aracı Etibank\u0027ın kuruluş amacını soruyor; kaynak metinde \u0027Etibank (1935) ise maden ve enerji alanında kredi ve işletme faaliyeti için kurulur\u0027 açıkça belirtilmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Etibank\u0027ı liberal-devletçi karma dönemin İzmir İktisat Kongresi aracı sanma; bu kongre özel sektör desteklemesi için, Etibank ise devletin doğrudan yatırımcı olduğu devletçilik döneminin kurumudur.","E":"Etibank 1935\u0027te Birinci Beş Yıllık Sanayi Planı döneminde kurulmuştur; İkinci Beş Yıllık Plan savaş nedeniyle tam uygulanamamıştır.","D":"Teşvik-i Sanayi Kanunu özel sektörü vergi muafiyetiyle teşvik eden araçken, Etibank tam devletçilik döneminde devletin doğrudan işletmeci olmasını amaçlayan kurumdur.","A":"Sümerbank ile Etibank\u0027ı karıştırma hatasıdır; Sümerbank 1933\u0027te dokuma ve imalat sanayine, Etibank 1935\u0027te maden-enerjiye odaklanmıştır."},"dogru":"Etibank 1935 yılında devletçilik politikasının kurumsal aracı olarak maden ve enerji sektöründe devletin doğrudan kredi ve işletme faaliyeti yürütmek üzere kurulmuştur. Sümerbank\u0027tan (1933, imalat sanayii) farklı olarak alan bazında ayrışmıştır.","sinav":"Etibank 1935 yılında maden ve enerji alanında kredi ve işletme faaliyeti yürütmek amacıyla kurulmuştur.","kavramlar":[{"kaynak":"Teori Notu","tanim":"Özel mülkiyeti reddetmeyen, devletin özellikle ağır sanayi ve altyapıda doğrudan yatırımcı ve işletici olmasını öngören pragmatik bir ekonomi politikası.","ad":"Devletçilik"},{"kaynak":"Teori Notu","tanim":"Planlı sanayileşmenin kurumsal ayağı olarak devletin sanayi ve enerji sektörlerinde doğrudan kredi ve işletme faaliyeti yürütmesi için kurulan finansal kuruluşlardır.","ad":"Devlet Bankaları"},{"kaynak":"Teori Notu","tanim":"1934 yılında hazırlanan ve dokuma, kağıt, cam, şeker gibi sektörlerde fabrikalar kurulmasını hedefleyen planlı sanayileşme programı.","ad":"Birinci Beş Yıllık Sanayi Planı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"Atatürk Dönemi devletçilik politikasının kurumsal araçlarından Etibank\u0027ın kuruluş amacına ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-24","verilenler":[],"dayanak":"Teori Notu - Atatürk Dönemi Ekonomi Politikası, Etibank (1935) paragrafı","dogru":"B","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Zonguldak\u0027ta 1935 yılında bir kömür işletmesi devlet eliyle kredi ve işletme desteği almak istiyor, kapıyı Etibank\u0027a çalıyor.","anlatim":"O yıl devlet, maden ve enerji alanında ayrı bir banka kurmuştur. Bu banka fabrika değil, maden işletmesi finanse eder.","doldur":[]},{"formul":"Ne yapacağız: Etibank 1935\u0027te maden-enerji alanında kredi ve işletme faaliyeti için kurulmuş, bu tek gerçeği beş ifadede tek tek deneyeceğiz.","anlatim":"Her şık Etibank\u0027a farklı bir kimlik yakıştırıyor. Beş ifadeyi bu Zonguldak olayında tek tek test edeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Teori Notu, Sümerbank-Etibank ayrımı","karar":"yanlış","anlatim":"Zonguldak\u0027taki kömür işletmesi dokuma fabrikası değil, maden işidir. Sümerbank imalat sanayine, Etibank maden-enerjiye bakar, ikisi ayrı kurumdur.","formul":"Şık A: birisi \u0027Etibank, Sümerbank ile birlikte 1933\u0027te dokuma fabrikaları kurmak için kuruldu\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Teori Notu, Etibank (1935)","karar":"doğru","anlatim":"Zonguldak\u0027taki kömür işletmesine tam olarak bu nedenle kredi ve işletme desteği verilir. Tarih ve alan birebir örtüşür.","formul":"Şık B: birisi \u0027Etibank 1935\u0027te maden ve enerji alanında kredi ve işletme yapmak için kuruldu\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Teori Notu, İzmir İktisat Kongresi 1923","karar":"yanlış","anlatim":"Kongre 1923\u0027te toplanır, Zonguldak\u0027taki bu banka ise 1935\u0027te devletin doğrudan işletici olduğu dönemde kurulur. Aradaki on iki yıl ve mantık farklıdır.","formul":"Şık C: birisi \u0027Etibank, İzmir İktisat Kongresi kararlarıyla özel teşebbüsü desteklemek için kuruldu\u0027 diyor, kabul eder misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Teori Notu, Teşvik-i Sanayi Kanunu 1927","karar":"yanlış","anlatim":"O kanun 1927\u0027de özel sektöre teşvik verir, Zonguldak\u0027taki maden işletmesine ise devlet doğrudan kredi ve işletme desteği verir. İki araç farklı mantıkla çalışır.","formul":"Şık D: birisi \u0027Etibank, Teşvik-i Sanayi Kanunu kapsamında vergi muafiyeti sağlamak için kuruldu\u0027 diyor, onaylar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Teori Notu, Birinci/İkinci Beş Yıllık Sanayi Planı","karar":"yanlış","anlatim":"Zonguldak\u0027taki banka 1935\u0027te, yani Birinci Plan döneminde kurulur. İkinci plan zaten savaş yüzünden tam uygulanamaz.","formul":"Şık E: birisi \u0027Etibank, İkinci Beş Yıllık Sanayi Planı\u0027nda demir-çelik yatırımı için kuruldu\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Zonguldak\u0027taki kömür işletmesi sana tek şeyi hatırlatsın: Etibank maden-enerji, Sümerbank imalat. Kendine sor: bu kurum fabrika mı kuruyor, yer altından mı çıkarıyor?","doldur":[]}],"anahtar":[{"ornek":"zonguldak","kok":"zongul"},{"ornek":"devletçilik","kok":"devlet"},{"ornek":"işletmesi","kok":"işletm"},{"ornek":"etibank","kok":"etiban"},{"ornek":"enerjiye","kok":"enerji"},{"ornek":"fabrika","kok":"fabrik"}],"konuGiris":{"harita":"Ne zaman test edilir: Etibank\u0027ın kuruluş amacı ile Sümerbank\u0027ın amacı karşılaştırılırken test edilir. Nasıl ölçülür: kurumun hangi sektöre (maden-enerji mi imalat mı) odaklandığı bilgisiyle ölçülür. Nasıl kaydedilir: soru metninde doğru-yanlış seçenek olarak kurumun amacı eşleştirilir.","desen":"Sınav Sümerbank ile Etibank\u0027ı kasıtlı olarak karıştırır, biri imalat sanayine diğeri maden-enerjiye odaklıdır (p.28). Öğrenci genellikle ikisinin işlevini birbirine geçirir çünkü ikisi de aynı dönemde ve aynı devletçilik politikasının parçasıdır. Bu soru Sümerbank-Etibank ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"1935\u0027te maden ve enerji alanında kredi ve işletme faaliyeti için kurulan devlet bankası","ad":"Etibank","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1933\u0027te sanayi işletmelerini kurup işletmek üzere kurulan devlet bankası","ad":"Sümerbank","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"özel mülkiyeti reddetmeyen, devletin ağır sanayi ve altyapıda yatırımcı olduğu model","ad":"Devletçilik","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"1934\u0027te dokuma, kağıt, cam, şeker sektörlerinde fabrika kurulmasını hedefleyen plan","ad":"Birinci Beş Yıllık Sanayi Planı","kim":"kanun sabitler"}],"sinavda":"Soruda Etibank\u0027ın kuruluş amacına dair seçenekler verilir, doğru tanımı seçmen istenir.","panel_ornek":"Bir arkadaşın hem telefon tamiri yapan hem de tamirci ustalara kredi veren iki ayrı dükkan açtığını düşün: biri üretim yapar, diğeri finansman sağlar. İkisini karıştırmak, kimin ne iş yaptığını bilmemekten kaynaklanır. İşte tarihte de böyle iki kurum var.","ornek":"Bir arkadaşın hem telefon tamiri yapan hem de tamirci ustalara kredi veren iki ayrı dükkan açtığını düşün: biri üretim yapar, diğeri finansman sağlar. İkisini karıştırmak, kimin ne iş yaptığını bilmemekten kaynaklanır. İşte tarihte de böyle iki kurum var.","yontemler":"Sümerbank=imalat, Etibank=maden-enerji eşleşmesini sabit tut, ikisini asla karıştırma.","nedir":"Bu konu Atatürk dönemi devletçilik politikasının kurumsal araçlarını inceler; sınav Sümerbank-Etibank gibi kurumların hangi sektöre odaklandığını ayırt etmeni ölçer."},"olay":"","tuzak":{"C":{"ad":"Dönem Karıştırma Tuzağı","metin":"Etibank\u0027ı liberal-devletçi karma dönemin İzmir İktisat Kongresi aracı sanıyorsun. Doğrusu: Etibank, kongre sonrası liberal modelin başarısızlığı üzerine geçilen devletçilik döneminin kurumudur."},"E":{"ad":"Plan Karıştırma Tuzağı","metin":"Etibank\u0027ın kuruluşunu İkinci Beş Yıllık Sanayi Planı\u0027na bağlıyorsun. Doğrusu: Etibank 1935\u0027te, Birinci Beş Yıllık Sanayi Planı (1934) döneminde kurulmuştur; İkinci plan savaş nedeniyle uygulanamamıştır."},"D":{"ad":"Kanun-Kurum Karıştırma Tuzağı","metin":"Etibank\u0027ı 1927 tarihli Teşvik-i Sanayi Kanunu\u0027nun bir uygulaması sanıyorsun. Doğrusu: O kanun özel sektör teşviki aracıdır, Etibank ise devletin doğrudan yatırımcı olduğu devletçilik döneminin bankasıdır."},"A":{"ad":"Sümerbank/Etibank Karıştırma Tuzağı","metin":"İki bankanın aynı yıl ve aynı sektörde kurulduğunu sanıyorsun. Doğrusu: Sümerbank 1933\u0027te imalat sanayine, Etibank 1935\u0027te maden-enerjiye odaklanmıştır."}},"celdiriciYol":null,"hap":"Sümerbank imalat sanayine, Etibank maden ve enerjiye odaklanan devletçilik dönemi bankalarıdır.","teshis":{"C":{"gercek":"İzmir İktisat Kongresi liberal-devletçi karma dönemin başlangıcıdır, Etibank ise sonraki devletçilik döneminin ürünüdür.","ayirt":"Bu olay 1923\u0027te mi, 1930\u0027ların ortasında mı gerçekleşti?","paragraf":"Teori Notu, İzmir İktisat Kongresi 1923","yanilgi":"Kongre ile sonraki devletçilik kurumlarını aynı dönemin aracı sanıyorsun."},"E":{"gercek":"Etibank 1935\u0027te, Birinci Beş Yıllık Sanayi Planı döneminde kurulmuştur; İkinci plan savaş nedeniyle tam uygulanamamıştır.","ayirt":"Bu kurum hangi plandan önce faaliyete geçti?","paragraf":"Teori Notu, Birinci/İkinci Beş Yıllık Sanayi Planı","yanilgi":"Etibank\u0027ın kuruluşunu ikinci plana bağlıyorsun."},"A":{"gercek":"Sümerbank imalat sanayine, Etibank maden-enerjiye odaklanır; ayrı yıl ve alanlarda kurulmuşlardır.","ayirt":"Bu banka fabrika mı kuruyor, maden mi işletiyor?","paragraf":"Teori Notu, Sümerbank-Etibank ayrımı","yanilgi":"Sümerbank ile Etibank\u0027ı aynı kurum gibi düşünüyorsun."},"D":{"gercek":"Teşvik-i Sanayi Kanunu (1927) özel teşebbüsü destekler; Etibank devletin doğrudan yatırımcı olduğu farklı bir modelin kurumudur.","ayirt":"Bu araç özel sektöre mi teşvik veriyor, devlet mi doğrudan yatırım yapıyor?","paragraf":"Teori Notu, Teşvik-i Sanayi Kanunu 1927","yanilgi":"Teşvik-i Sanayi Kanunu ile devletçilik dönemi kurumlarını aynı araç sanıyorsun."},"B":{"gercek":"Etibank (1935) maden ve enerji alanında kredi ve işletme faaliyeti için kurulmuştur.","ayirt":"Bu kurum hangi sektörde işletici/kredi veren taraf?","paragraf":"Teori Notu, Etibank (1935)","yanilgi":"Bu şıkkı eleyen öğrenci Etibank\u0027ı da imalat sanayii ile karıştırıyor olabilir."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 17"},"kural":"bütün dünya dillerinin Türkçeden türediği savı Güneş Dil Teorisi\u0027ne (1935-1936) aittir, Türk Tarih Tezi ile aynı şey değildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 17","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Hangisi değildir\u0027 sorularında önce şıklardan hangisinin başka bir kavrama (dil, kurum) ait olduğunu ayır, kalanların hepsi doğru savdır.","konu":"atatürk tarih tezi","tablo":{"satirlar":[["A) Türklerin anayurdu Orta Asya\u0027dır.","Türk Tarih Tezi - temel savlar","doğru ifade"],["B) Türkler eski ve yüksek bir uygarlığın kurucusudur.","Türk Tarih Tezi - temel savlar","doğru ifade"],["C) Dünyadaki bütün diller kaynağını Türkçeden almıştır.","Sınav tuzağı (1): Türk Tarih Tezi - Güneş Dil Teorisi ayrımı","YANLIŞ ifade"],["D) Anadolu\u0027nun en eski halkları Türklerle ilişkilendirilmiş…","Türk Tarih Tezi - temel savlar","doğru ifade"],["E) Türkler iklim değişikliği ve kuraklık nedeniyle göç eder…","Türk Tarih Tezi - temel savlar","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Dünyadaki bütün diller kaynağını Türkçeden almıştır.","E":"Türkler iklim değişikliği ve kuraklık nedeniyle göç ederek gittikleri yerlere uygarlık taşımıştır.","A":"Türklerin anayurdu Orta Asya\u0027dır.","D":"Anadolu\u0027nun en eski halkları Türklerle ilişkilendirilmiştir.","B":"Türkler eski ve yüksek bir uygarlığın kurucusudur."},"kaynak":{"alinti":"nin temel savlarından olmayan bir ifadeyi doğru olarak tanımlamıştır; C şıkkı (Güneş Dil Teorisi","liste":[{"ad":"TEORI - ataturk tarih tezi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). TANIM VE KURAL: TÜRK TARİH TEZİ, 1930\u0027larda Atatürk\u0027ün öncülüğünde geliştirilen tarih görüşüdür. Temel savları: Türklerin anayurdu Orta Asya\u0027dır; Türkler eski ve yüksek bir uygarlığın sahibidir; iklim değişikliği ve kuraklık nedeniyle göç etmişler, gittikleri yerlere (Anadolu, Mezopotamya, Mısır, Çin, Hint) uygarlık taşımışlardır; Anadolu\u0027nun en eski halkları (Hititler, Sümerler gibi) Türklerle ilişkilendirilmiştir. AMAÇ: Avrupa\u0027da yaygın olan Türkleri \u0027ikinci sınıf, sarı ırktan, uygarlık kuramamış bir göçebe kavim\u0027 sayan görüşlere ve Türkleri Anadolu\u0027da \u0027işgalci\u0027 gösteren iddialara cevap vermek; Osmanlı ve İslam tarihiyle sınırlanmış tarih anlayışını, Türklerin binlerce yıllık geçmişini kapsayan millî bir tarih bilinciyle değiştirmek; Anadolu\u0027nun Türk yurdu olduğunu tarihsel temele bağlamak. KURUMLAR VE ADIMLAR: TÜRK TARİHİNİN ANA HATLARI kitabı (1930) tezin ilk toplu metnidir. TÜRK TARİHİ TETKİK CEMİYETİ 15 Nisan 1931\u0027de kuruldu (1935\u0027te Türk Tarih Kurumu adını aldı). BİRİNCİ TÜRK TARİH KONGRESİ 1932\u0027de Ankara\u0027da toplandı ve tez öğretmenlere anlatıldı; lise tarih kitapları bu görüşe göre yazıldı. İkinci Türk Tarih Kongresi 1937\u0027de İstanbul\u0027da uluslararası katılımla yapıldı. Aynı dönemde TÜRK DİL KURUMU (12 Temmuz 1932) kurularak dil devrimi kurumsallaştı. Atatürk \u0027Tarih yazmak, tarih yapmak kadar mühimdir\u0027 sözüyle tarih araştırmasına verdiği önemi belirtti. SINAV TUZAĞI: (1) Türk Tarih Tezi ile 1935–1936\u0027da gündeme gelen GÜNEŞ DİL TEORİSİ (bütün dillerin Türkçeden türediği savı) farklı şeylerdir; biri tarih, öteki dil kuramıdır…"}],"hakem":"Soru, Türk Tarih Tezi\u0027nin temel savlarından olmayan bir ifadeyi doğru olarak tanımlamıştır; C şıkkı (Güneş Dil Teorisi\u0027ne ait olan ifade) kaynakta açıkça \u0027Türk Tarih Tezi ile farklı şeylerdir\u0027 denilerek doğru şık olarak desteklenmiştir."},"kayitlar":[],"sade":{"siklar":{"D":"Hitit ve Sümer gibi Anadolu\u0027nun eski halklarını Türklerle bağdaştırmak, tezin Anadolu\u0027yu Türk yurdu gösterebilmek için attığı adımlardan biridir.","E":"İklim değişikliği ve kuraklık nedeniyle göç eden Türklerin gittikleri yerlere uygarlık taşıdığı, tezin temel iddialarındandır ve çeşitli bölgelerde Türk etkisini göstermek için öne sürülmüştür.","A":"Türklerin Orta Asya\u0027yı anayurt kabul etmek, tezin birinci ve en temel savıdır; bu, Avrupa\u0027nın \u0027Türkler göçebe ve uygarlıksız\u0027 iddiasına cevaptır.","B":"Türklerin eski ve yüksek uygarlığa sahip olduğu, tezin merkez savlarından biridir; Anadolu\u0027yu Türk yurdu olarak tarihsel temele bağlamak için kullanılmıştır."},"dogru":"Türk Tarih Tezi Türklerin tarihini anlatırken, bütün dünya dillerinin Türkçeden geldiğini söyleyen Güneş Dil Teorisi ayrı bir kuramıdır. C şıkkı dil teorisine ait olup, tarih tezinin savı değildir.","sinav":"Türk Tarih Tezi\u0027nin temel savları: Türklerin Orta Asya anayurdu, eski yüksek uygarlığın kurucusu olması, iklim değişikliğiyle göç ve uygarlık taşıması, Anadolu\u0027nun eski halklarının Türklerle ilişkilendirilmesidir; bütün dillerin Türkçeden kaynaklandığı savı Güneş Dil Teorisi\u0027ne aittir.","kavramlar":[{"kaynak":"TEORI","tanim":"1930\u0027larda Atatürk öncülüğünde geliştirilen tarih görüşüdür. Türklerin Orta Asya anayurdu, eski uygarlığın kurucusu, iklim değişikliğiyle göç ederek uygarlık taşıyıcısı olduğunu ve Anadolu\u0027nun eski halklarının Türklerle ilişkili olduğunu savunur.","ad":"Türk Tarih Tezi"},{"kaynak":"TEORI","tanim":"1935-1936\u0027da gündeme gelen ve bütün dünya dillerinin Türkçeden türediğini iddia eden dil kuramıdır. Türk Tarih Tezi\u0027nden farklı bir alan ve kuramsal çerçeveyi temsil eder.","ad":"Güneş Dil Teorisi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/1"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi 1930\u0027larda ortaya konan Türk Tarih Tezi\u0027nin temel savlarından biri değildir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-25","verilenler":[],"dayanak":"TESMER Staj ve Sınavlara İlişkin Uygulama Yönergesi m.6.2 kapsamı - Türk Tarih Tezi (1930-1932, Birinci Türk Tarih Kongresi)","dogru":"C","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1932\u0027de Ankara\u0027da toplanan Birinci Türk Tarih Kongresi\u0027nde öğretmenlere bir tarih tezi anlatılıyor.","anlatim":"Kongrede öğretmenlere Türklerin Orta Asya\u0027dan çıktığı, göç ettiği ve uygarlık taşıdığı anlatılıyor. Bu görüşler lise kitaplarına giriyor. Sınıfta birisi kalkıp \u0027diller de Türkçeden türemiş\u0027 diyor.","doldur":[]},{"formul":"Ne yapacağız: Kongrede anlatılan beş cümleyi tek tek \u0027bu, Türk Tarih Tezi\u0027nin savı mı?\u0027 diye süzeceğiz.","anlatim":"Tez 1930\u0027da \u0027Türk Tarihinin Ana Hatları\u0027 kitabıyla ortaya konur, dört ana savı vardır. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Türk Tarih Tezi - temel savlar","karar":"doğru","anlatim":"Bu ifade tezin çıkış noktasıdır, 1930 kitabında ilk söylenen şeydir. Öğretmen bunu anlatmakta haklıdır.","formul":"Şık A: öğretmen \u0027Türklerin anayurdu Orta Asya\u0027dır\u0027 diyor, bu tezin savı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Türk Tarih Tezi - temel savlar","karar":"doğru","anlatim":"Tez, Avrupa\u0027nın Türkleri ilkel gösteren görüşüne bu cümleyle cevap verir. Öğretmen bunu anlatmakta haklıdır.","formul":"Şık B: öğretmen \u0027Türkler eski ve yüksek bir uygarlığın kurucusudur\u0027 diyor, bu tezin savı mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Sınav tuzağı (1): Türk Tarih Tezi - Güneş Dil Teorisi ayrımı","karar":"yanlış","anlatim":"Bu cümle tarih değil, dil konuşuyor; 1935-1936\u0027da ayrıca ortaya konan Güneş Dil Teorisi\u0027ne aittir. Öğrenci burada iki farklı kuramı birbirine karıştırıyor.","formul":"Şık C: sınıftaki öğrenci \u0027bütün dünya dilleri Türkçeden türemiştir\u0027 diyor, bu Türk Tarih Tezi\u0027nin savı mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Türk Tarih Tezi - temel savlar","karar":"doğru","anlatim":"Bu cümle Anadolu\u0027nun Türk yurdu olduğunu tarihe bağlama amacına hizmet eder. Öğretmen bunu anlatmakta haklıdır.","formul":"Şık D: öğretmen \u0027Anadolu\u0027nun en eski halkları, mesela Hititler, Türklerle ilişkilendirilir\u0027 diyor, bu tezin savı mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Türk Tarih Tezi - temel savlar","karar":"doğru","anlatim":"Bu cümle tam da tezin göç ve uygarlık taşıma savıdır. Öğretmen bunu anlatmakta haklıdır.","formul":"Şık E: öğretmen \u0027Türkler kuraklık yüzünden göç etti ve gittikleri yere uygarlık taşıdı\u0027 diyor, bu tezin savı mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Kongredeki dört cümle tarih anlatıyor, sınıftaki öğrencinin cümlesi ise dil anlatıyor. Kendine sor: bu cümle tarih mi konuşuyor, dil mi?","doldur":[]}],"anahtar":[{"ornek":"öğretmenlere","kok":"öğretm"},{"ornek":"anlatmakta","kok":"anlatm"},{"ornek":"haklıdır","kok":"haklıd"},{"ornek":"anlatılıyor","kok":"anlatı"},{"ornek":"teorisi","kok":"teoris"},{"ornek":"konuşuyor","kok":"konuşu"}],"konuGiris":{"harita":"Ne zaman test edilir: Türk Tarih Tezi\u0027nin savları, kurucu kurumları veya kongre tarihleri sorulduğunda test edilir. Nasıl ölçülür: tezin savları ile Güneş Dil Teorisi gibi farklı bir kavramın karıştırılıp karıştırılmadığına bakılarak ölçülür. Nasıl kaydedilir: kurum kuruluş tarihleri (1931, 1932, 1932, 1937) ve kongre yerleri sabit bilgi olarak akılda tutulur.","desen":"Sınav genellikle tezin savlarından biri gibi görünen ama aslında Güneş Dil Teorisi\u0027ne ait bir ifadeyi seçeneklere karıştırır. Kurum kuruluş yılları (1931 Tetkik Cemiyeti, 1932 Türk Dil Kurumu) birbirine karıştırılarak da sorulabilir. Bu soru p.28\u0027deki tuzak noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Türklerin anayurdunun Orta Asya olduğunu ve yüksek uygarlık kurduğunu savunan görüş","ad":"Türk Tarih Tezi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"1931\u0027de kurulan, sonradan Türk Tarih Kurumu adını alan kurum","ad":"Türk Tarihi Tetkik Cemiyeti","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tüm dillerin Türkçeden türediğini savunan, tarih tezinden ayrı dil kuramı","ad":"Güneş Dil Teorisi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1932\u0027de Ankara\u0027da toplanan, tezin öğretmenlere anlatıldığı kongre","ad":"Birinci Türk Tarih Kongresi","kim":"kanun sabitler"}],"s Türklerin anayurdunun Orta Asya olduğudur. Doğrusu: bu ifade teze aittir, aranan sav bu değildir."},"B":{"ad":"Aynı Kaynak Tuzağı","metin":"Türk Tarih Tezi ile ilgili doğru bir savı, sanki tezin dışındaymış gibi ayıklamaya çalışıyorsun. Doğrusu: Türklerin eski ve yüksek bir uygarlığa sahip olduğu iddiası tezin temel savlarındandır."}},"celdiriciYol":{},"hap":"Türk Tarih Tezi tarihle, Güneş Dil Teorisi dille ilgilidir; ikisi ayrı kuram, ayrı yıl (1930\u0027lar / 1935-1936).","teshis":{"C":{"gercek":"Güneş Dil Teorisi 1935-1936\u0027da ortaya konan ayrı bir dil kuramıdır; tüm dillerin Türkçeden türediğini savunur, Türk Tarih Tezi\u0027nin savı değildir.","ayirt":"Bu ifade tarih mi anlatıyor, dil mi? Dil ise Güneş Dil Teorisi\u0027ne aittir.","paragraf":"Sınav tuzağı (1): Türk Tarih Tezi - Güneş Dil Teorisi ayrımı","yanilgi":"Türk Tarih Tezi ile Güneş Dil Teorisi\u0027ni aynı bütünün parçası sayıp bu savı da teze dahil ediyorsun."},"E":{"gercek":"Tez, Türklerin iklim değişikliği ve kuraklık nedeniyle göç ettiğini ve gittikleri her yere (Anadolu, Mezopotamya, Mısır, Çin, Hint) uygarlık taşıdığını savunur.","ayirt":"Bu ifade \u0027göç ederek uygarlık yaydılar\u0027 savının kendisi mi?","paragraf":"Türk Tarih Tezi - temel savlar","yanilgi":"Göç ve uygarlık taşıma savını tezin bir sonucu sanıp, savlar listesinden çıkarıyorsun."},"A":{"gercek":"Türk Tarih Tezi\u0027nin çıkış noktası Türklerin anayurdunun Orta Asya olduğu savıdır; 1930 tarihli \u0027Türk Tarihinin Ana Hatları\u0027 kitabında bu savla başlanır.","ayirt":"Bu ifade tezin ilk kongrede (1932) öğretmenlere anlatılan öz savlarından biri mi?","paragraf":"Türk Tarih Tezi - temel savlar","yanilgi":"Orta Asya anayurdu savını, sonradan eklenmiş ikincil bir ayrıntı gibi görüp doğru şıkla karıştırıyorsun."},"D":{"gercek":"Anadolu\u0027nun en eski halklarının Türklerle ilişkilendirilmesi, Anadolu\u0027nun Türk yurdu olduğunu tarihsel temele bağlama savının bir parçasıdır.","ayirt":"Bu ifade Anadolu\u0027nun Türklüğünü tarihe bağlama amacına mı hizmet ediyor?","paragraf":"Türk Tarih Tezi - temel savlar","yanilgi":"Hititler-Sümerler ilişkisini, Türk Dil Kurumu\u0027nun dil çalışmalarına ait bir konu sanıp Türk Tarih Tezi dışında görüyorsun."},"B":{"gercek":"Tez, Türklerin ikinci sınıf, göçebe bir kavim olmadığını; eski ve yüksek bir uygarlığın sahibi olduğunu savunur.","ayirt":"Bu ifade Avrupa\u0027daki \u0027Türkler ilkeldir\u0027 görüşüne verilen cevabın parçası mı?","paragraf":"Türk Tarih Tezi - temel savlar","yanilgi":"Uygarlık savını, tezin amacıyla (Avrupa\u0027ya cevap) karıştırıp savların dışında sayıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 17"},"kural":"Konu Karıştırma Tuzağı: öğrenci Güneş Dil Teorisi\u0027nin savını Türk Tarih Tezi\u0027ne mal eder. Doğrusu: bütün dillerin Türkçeden türediği savı 1935-1936\u0027da ortaya atılan Güneş Dil Teorisi\u0027ne aittir, Türk Tarih Tezi ile ilgisizdir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 17","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Şıklarda \u0027dil\u0027 geçen ifadeyi Türk Tarih Tezi sorularında hemen ayır.","konu":"atatürk tarih tezi","tablo":null,"siklar":{"C":"Bütün dünya dillerinin kökeninin Türkçe olduğunu kanıtlamak","E":"Türklerin eski ve yüksek bir uygarlığa sahip olduğunu ortaya koymak","A":"Türklerin ikinci sınıf, uygarlık kuramamış bir kavim sayılması görüşüne karşı çıkmak","D":"Tarih anlayışını Osmanlı ve İslam tarihiyle sınırlı olmaktan çıkarmak","B":"Anadolu\u0027nun Türk yurdu olduğunu tarihsel temele bağlamak"},"kaynak":{"alinti":"nin amaçlarini olcuyor; dogru sik (C) kaynak metinde acikca tanimlanmis Güneş Dil Teorisi","liste":[{"ad":"TEORI - ataturk tarih tezi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). TANIM VE KURAL: TÜRK TARİH TEZİ, 1930\u0027larda Atatürk\u0027ün öncülüğünde geliştirilen tarih görüşüdür. Temel savları: Türklerin anayurdu Orta Asya\u0027dır; Türkler eski ve yüksek bir uygarlığın sahibidir; iklim değişikliği ve kuraklık nedeniyle göç etmişler, gittikleri yerlere (Anadolu, Mezopotamya, Mısır, Çin, Hint) uygarlık taşımışlardır; Anadolu\u0027nun en eski halkları (Hititler, Sümerler gibi) Türklerle ilişkilendirilmiştir. AMAÇ: Avrupa\u0027da yaygın olan Türkleri \u0027ikinci sınıf, sarı ırktan, uygarlık kuramamış bir göçebe kavim\u0027 sayan görüşlere ve Türkleri Anadolu\u0027da \u0027işgalci\u0027 gösteren iddialara cevap vermek; Osmanlı ve İslam tarihiyle sınırlanmış tarih anlayışını, Türklerin binlerce yıllık geçmişini kapsayan millî bir tarih bilinciyle değiştirmek; Anadolu\u0027nun Türk yurdu olduğunu tarihsel temele bağlamak. KURUMLAR VE ADIMLAR: TÜRK TARİHİNİN ANA HATLARI kitabı (1930) tezin ilk toplu metnidir. TÜRK TARİHİ TETKİK CEMİYETİ 15 Nisan 1931\u0027de kuruldu (1935\u0027te Türk Tarih Kurumu adını aldı). BİRİNCİ TÜRK TARİH KONGRESİ 1932\u0027de Ankara\u0027da toplandı ve tez öğretmenlere anlatıldı; lise tarih kitapları bu görüşe göre yazıldı. İkinci Türk Tarih Kongresi 1937\u0027de İstanbul\u0027da uluslararası katılımla yapıldı. Aynı dönemde TÜRK DİL KURUMU (12 Temmuz 1932) kurularak dil devrimi kurumsallaştı. Atatürk \u0027Tarih yazmak, tarih yapmak kadar mühimdir\u0027 sözüyle tarih araştırmasına verdiği önemi belirtti. SINAV TUZAĞI: (1) Türk Tarih Tezi ile 1935–1936\u0027da gündeme gelen GÜNEŞ DİL TEORİSİ (bütün dillerin Türkçeden türediği savı) farklı şeylerdir; biri tarih, öteki dil kuramıdır…"}],"hakem":"Soru Ataturk Ilkeleri ve Inkilap Tarihi dersinin resmi kapsamina uygun; Türk Tarih Tezi\u0027nin amaçlarini olcuyor; dogru sik (C) kaynak metinde acikca tanimlanmis Güneş Dil Teorisi\u0027ne ait bir savdir ve Türk Tarih Tezi\u0027nin amaçlari arasinda YER ALMAZ."},"kayitlar":[],"sade":{"siklar":{"D":"Tarih anlayışını Osmanlı-İslam sınırından kurtarmak, tezin kurucu amaçlarındandır.","E":"Türklerin eski ve yüksek uygarlığa sahip olduğu savı, tezin merkezi amaçlarından biridir.","A":"Bu görüşe karşı çıkmak tezin doğrudan kurucu amaçlarındandır; Avrupa merkezli ırkçı görüşlere cevap vermek için tez oluşturulmuştur.","B":"Anadolu\u0027nun Türk yurdu olduğunu tarihsel temele bağlamak, tezin temel savlarından ve amaçlarından biridir."},"dogru":"Türk Tarih Tezi, Türkleri yüksek uygarlığa sahip göstermek ve tarih anlayışını Osmanlı-İslam sınırından çıkarmak amacıyla atılmıştır. Bütün dillerin Türkçeden türediği savı, daha sonra ortaya atılan Güneş Dil Teorisi\u0027ne aittir, tezle ilgisizdir.","sinav":"Soru, Türk Tarih Tezi\u0027nin amaçlarını sorgulayan bir tarih sorusudur.","kavramlar":[{"kaynak":"TEORI","tanim":"1930\u0027larda Atatürk\u0027ün öncülüğünde geliştirilen, Türklerin anayurdunun Orta Asya olduğunu, eski ve yüksek bir uygarlığa sahip olduğunu ve göç yoluyla başka medeniyetleri kurduğunu savunan tarih görüşüdür.","ad":"Türk Tarih Tezi"},{"kaynak":"TEORI","tanim":"1935-1936\u0027da ortaya atılan, bütün dünya dillerinin Türkçeden türediği savını ileri süren dil kuramıdır.","ad":"Güneş Dil Teorisi"},{"kaynak":"TEORI","tanim":"15 Nisan 1931\u0027de kurulan ve 1935\u0027te Türk Tarih Kurumu adını alan, Türk Tarih Tezi\u0027nin araştırılması ve yaygınlaştırılması için kurumsallaştırılan kuruluştur.","ad":"Türk Tarihi Tetkik Cemiyeti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/1"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi Türk Tarih Tezi\u0027nin ortaya atılış amaçları arasında yer almaz?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-25","verilenler":[],"dayanak":"Türk Tarih Tezi ve Güneş Dil Teorisi ayrımı - inkılap tarihi ders notu","dogru":"C","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[],"anahtar":[{"ornek":"teorisi","kok":"teoris"},{"ornek":"aittir","kok":"aittir"},{"ornek":"tuzağı","kok":"tuzağı"},{"ornek":"öğrenci","kok":"öğrenc"},{"ornek":"ortaya","kok":"ortaya"},{"ornek":"savını","kok":"savını"}],"konuGiris":{"harita":"Ne zaman test edilir: Türk Tarih Tezi\u0027nin amaçları ile ilgili kurumların (Cemiyet, Kongre, Kurum) tarihleri karıştırılarak sorulduğunda. Nasıl ölçülür: amaç maddeleri arasından \u0027amaç olmayanı\u0027 bulma sorusuyla ölçülür. Nasıl kaydedilir: amaçlar, kuruluş yılları ve Güneş Dil Teorisi ile karışmaması ayrı ayrı bilinmelidir.","desen":"Sınav, tezin amaçları ile Güneş Dil Teorisi\u0027nin amaçlarını karıştırarak sorar; ayrıca Cemiyet ve Kurum\u0027un kuruluş yıllarını birbirine karıştırtır (p. Kaynak Metin). Öğrenci \u0027Osmanlı tarihini yok sayma\u0027 gibi tezde olmayan bir amacı doğru şık gibi görebilir. Bu soru amaç listesi ile tarih/isim karışıklığı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Türklerin köklü, yüksek uygarlık sahibi olduğunu savunan tarih görüşü","ad":"Türk Tarih Tezi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"1931\u0027de kurulan, tezi araştıran ilk kurum, sonra Kurum adını aldı","ad":"Türk Tarihi Tetkik Cemiyeti","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1932\u0027de tezin öğretmenlere anlatıldığı toplantı","ad":"Birinci Türk Tarih Kongresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1935-36\u0027da ortaya çıkan, dillerin Türkçeden türediğini savunan ayrı kuram","ad":"Güneş Dil Teorisi","kim":"kanun sabitler"}],"sinavda":"Amaç listesinden biri verilir ve hangisinin tezin amacı OLMADIĞI istenir.","panel_ornek":"Bir arkadaşın ikinci el bir eşyayı \u0027bu değersiz, eski model\u0027 diyen birine karşı savunması gibi düşün: 3 yıl önce aldığı 5 kitaplık bir seti gösterip \u0027bak bunlar hâlâ değerli\u0027 der. Türk Tarih Tezi de böyle bir savunma amacı taşır, Türkleri \u0027değersiz görülen\u0027 bir konumdan çıkarmak ister.","ornek":"Bir arkadaşın ikinci el bir eşyayı \u0027bu değersiz, eski model\u0027 diyen birine karşı savunması gibi düşün: 3 yıl önce aldığı 5 kitaplık bir seti gösterip \u0027bak bunlar hâlâ değerli\u0027 d ,"doldur":[]},{"formul":"Ne yapacağız: 1919-1927 arasını belgelerle anlatan, altı günde okunan eseri beş seçenek arasından bulacağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Her eserin hangi döneme ve hangi konuya ait olduğuna bakacağız. Kongrede okunan metinle eşleşen tek eser kalacak.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Ataturk\u0027un Eserleri - Medeni Bilgiler","karar":"yanlış","anlatim":"Vatandaş İçin Medeni Bilgiler 1930\u0027da yayımlanmış bir ders kitabıdır, kongrede okunmamıştır. Bu eser Millî Mücadele\u0027yi belgelerle anlatmaz.","formul":"Şık A: delege \u0027bu kongrede okunan metin, vatandaşlık ve devlet konularını işleyen ders kitabı mı\u0027 diye soruyor, doğru mu dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Ataturk\u0027un Eserleri - Askeri Eserler","karar":"yanlış","anlatim":"Cumalı Ordugâhı 1909\u0027da yazılmış, Makedonya\u0027daki tatbikatı anlatan askerî bir eserdir. Millî Mücadele döneminden çok önce yazılmıştır, kongrede okunan bu değildir.","formul":"Şık B: delege \u0027okunan metin, süvari tatbikatı gözlemlerini içeren genç subaylık eseri mi\u0027 diye soruyor, doğru mu dersin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Ataturk\u0027un Eserleri - Askeri Eserler","karar":"yanlış","anlatim":"Zabit ve Kumandan ile Hasbihal 1918\u0027de yazılmış, subaylık sorumluluğunu tartışan bir eserdir. Bu eser Cumhuriyet\u0027in kuruluşunu anlatmaz, kongrede okunan da bu değildir.","formul":"Şık C: delege \u0027okunan metin, subayın inisiyatifini tartışan 1918 tarihli eser mi\u0027 diye soruyor, doğru mu dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Ataturk\u0027un Eserleri - Geometri","karar":"yanlış","anlatim":"Geometri kitabı 1937\u0027de yayımlanmış, matematik terimlerini Türkçeleştiren bir eserdir. Tarihsel bir anlatım değildir, kongreyle ilgisi yoktur.","formul":"Şık D: delege \u0027okunan metin, üçgen ve açı gibi Türkçe terimleri türeten kitap mı\u0027 diye soruyor, doğru mu dersin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Ataturk\u0027un Eserleri - Nutuk","karar":"doğru","anlatim":"Nutuk tam olarak budur; Samsun\u0027a çıkıştan Cumhuriyet\u0027in kuruluşuna kadarki süreci belgelerle anlatır. Cumhuriyet Halk Fırkası İkinci Büyük Kongresi\u0027nde altı gün süreyle okunmuştur.","formul":"Şık E: delege \u0027okunan metin, 1919\u0027dan 1927\u0027ye kadarki süreci belgelerle anlatan ve altı günde okunan eser mi\u0027 diye soruyor, doğru mu dersin?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Kongrede okunan ve belgelerle Millî Mücadele\u0027yi anlatan eser Nutuk\u0027tür. Kendine sor: bu eser hangi dönemi kapsıyor ve tarih mi anlatıyor yoksa başka bir konuyu mu işliyor?","doldur":[]}],"anahtar":[{"ornek":"kongresi","kok":"kongre"},{"ornek":"okunan","kok":"okunan"},{"ornek":"belgelerle","kok":"belgel"},{"ornek":"cumhuriyet","kok":"cumhur"},{"ornek":"eserdir","kok":"eserdi"},{"ornek":"mücadele","kok":"mücade"}],"konuGiris":{"harita":"Ne zaman test edilir: eser adı ile içeriği/dönemi eşleştirilirken test edilir. Nasıl ölçülür: verilen ipuçlarından (dönem, okunma şekli, konu) doğru eser adının bulunmasıyla ölçülür. Nasıl kaydedilir: sınavda doğrudan eser-özellik eşleşmesi biçiminde sorulur, hesaplama yoktur.","desen":"Sınav sık sık \u0027altı gün okundu\u0027 ya da \u0027belgelerle anlattı\u0027 gibi ipuçlarıyla Nutuk\u0027u sordurur, öğrenciyi Medeni Bilgiler ya da Geometri ile karıştırmaya çalışır. Tuzak, Nutuk\u0027un kapsadığı dönemi Cumhuriyet\u0027in ilanıyla sınırlı göstermektir; oysa 1927\u0027ye kadar sürer. Bu soru p.28\u0027deki Nutuk tanımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Millî Mücadele\u0027den Cumhuriyet kuruluşuna dek belgeli anlatım","ad":"Nutuk","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Afet İnan imzasıyla çıkan, vatandaşlık bilgilerini işleyen kitap","ad":"Vatandaş için Medeni Bilgiler","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Türkçe matematik terimlerini türeten 1937 kitabı","ad":"Geometri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Nutuk\u0027un altı gün boyunca okunduğu 1927 kongresi","ad":"İkinci Büyük Kongre","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda bir eserin özellikleri (dönem, okunma biçimi, kongre) verilir, sizden o eserin adını bulmanız istenir.","panel_ornek":"İkinci el bir telefonu satarken kutusuna \u0027kullanım kılavuzu, fatura, garanti belgesi\u0027 diye üç ayrı belge koyarsın; alıcı hangi belgenin ne işe yaradığını bilmek ister. Burada da her eserin farklı bir \u0027belge\u0027 gibi ayrı işlevi vardır, birini diğeriyle karıştırmak yanlış cevaba götürür.","ornek":"İkinci el bir telefonu satarken kutusuna \u0027kullanım kılavuzu, fatura, garanti belgesi\u0027 diye üç ayrı belge koyarsın; alıcı hangi belgenin ne işe yaradığını bilmek ister. Burada da her eserin farklı bir \u0027belge\u0027 gibi ayrı işlevi vardır, birini diğeriyle karıştırmak yanlış cevaba götürür.","yontemler":"Her eserin tek bir ayırt edici özelliğini (dönem, imza, konu) eşleştirerek çöz; benzer detayları karıştırma.","nedir":"Bu konu Atatürk\u0027ün kaleme aldığı eserleri ve her eserin hangi dönemi/konuyu ele aldığını öğretir. Sınav, eser adını dönemiyle ve içeriğiyle eşleştirebiliyor musun ölçer."},"olay":"","tuzak":{"C":{"ad":"Konu Karışıklığı Tuzağı","metin":"Subaylık dönemi eserlerinden birini seçip dönem sorusuyla eşleştiren öğrenci bu şıkkı seçer. Doğrusu: Zabit ve Kumandan ile Hasbihal 1918\u0027de subayın inisiyatifi üzerine yazılmıştır, Millî Mücadele\u0027yi anlatmaz."},"A":{"ad":"Medeni Bilgiler Tuzağı","metin":"Millet, devlet ve vatandaşlık konularını işleyen ders kitabını, belgesel anlatım sanan öğrenci bu şıkkı seçer. Doğrusu: Bu eser 1930\u0027da Afet İnan adıyla yayımlanmış olup Millî Mücadele sürecini anlatmaz."},"D":{"ad":"Tarih Karışıklığı Tuzağı","metin":"Atatürk\u0027ün son dönem eserlerinden birini, kapsam bakımından Nutuk ile karıştıran öğrenci bu şıkkı seçer. Doğrusu: Geometri 1937\u0027de yayımlanan bir matematik terimleri kitabıdır, tarihsel anlatım içermez."},"B":{"ad":"Askeri Eser Tuzağı","metin":"Cumalı Ordugâhı\u0027nı genel bir Atatürk eseri olarak görüp Millî Mücadele anlatımıyla karıştıran öğrenci bu şıkkı işaretler. Doğrusu: Bu eser 1909\u0027da Makedonya\u0027daki süvari tatbikatı gözlemlerine dairdir."}},"celdiriciYol":null,"hap":"Nutuk, Millî Mücadele ve Cumhuriyet\u0027in kuruluşunu (1919-1927) belgelerle anlatan ve 1927\u0027de altı günde okunan eserdir.","teshis":{"C":{"gercek":"Zabit ve Kumandan ile Hasbihal, subayın inisiyatif ve sorumluluğunu ele alan 1918 tarihli bir eserdir.","ayirt":"Bu eser Millî Mücadele\u0027yi mi anlatıyor, yoksa subaylık meselelerini mi?","paragraf":"Ataturk\u0027un Eserleri - Askeri Eserler","yanilgi":"1918 tarihli bir askerî eseri, dönem ve kapsam kontrolü yapmadan seçiyorsun."},"E":{"gercek":"Nutuk, 1919 Samsun çıkışından 1927\u0027ye kadarki süreci belgelerle anlatır; Cumhuriyet Halk Fırkası İkinci Büyük Kongresi\u0027nde altı günde okunmuştur.","ayirt":"Bu eser hangi dönemi kapsıyor ve ne zaman okundu?","paragraf":"Ataturk\u0027un Eserleri - Nutuk","yanilgi":"Nutuk\u0027un yalnız 1927\u0027de okunduğunu bilip kapsadığı dönemi de 1927\u0027yle sınırlı sanıyorsun."},"A":{"gercek":"Bu eser 1930\u0027da yayımlanmış, millet-devlet-vatandaşlık konularını işleyen bir ders kitabıdır.","ayirt":"Bu eser hangi dönemi, hangi olayı anlatıyor?","paragraf":"Ataturk\u0027un Eserleri - Medeni Bilgiler","yanilgi":"Medeni Bilgiler kitabını da Millî Mücadele\u0027yi anlatan bir eser sanıyorsun."},"D":{"gercek":"Geometri 1937\u0027de yayımlanmış, Türkçe matematik terimlerini içeren bir eserdir.","ayirt":"Bu eser tarih mi anlatıyor, terim mi türetiyor?","paragraf":"Ataturk\u0027un Eserleri - Geometri","yanilgi":"Son dönem eserlerinden birini, tarihsel anlatım kapsamıyla karıştırıyorsun."},"B" cadan çeviri olması onu bu gruptan çıkarmaz.","B":"Cumalı Ordugâhı 1909 tarihli, Makedonya\u0027daki askeri tatbikat gözlemlerinin kaydıdır ve genç subaylık yıllarına aittir."},"dogru":"Vatandaş İçin Medeni Bilgiler 1930\u0027da, Cumhuriyet döneminde yazılmıştır. Diğer dört eser 1908–1918 arasında subaylık yıllarında kaleme alınan askerî eserlerdir. Sorulan askerî eserler grubuna ait olmayan eserdir.","sinav":"Atatürk\u0027ün genç subaylık yıllarında (1908–1918) kaleme aldığı askerî eserler gruplandırıldığında, Vatandaş İçin Medeni Bilgiler bu gruba dahil değildir.","kavramlar":[{"kaynak":"TEORI","tanim":"Atatürk\u0027ün genç subaylık yıllarında (1908–1918) kaleme aldığı, askeri doktrin, tatbikat ve subay sorumlulukları konularını işleyen yazılı eserlerdir.","ad":"Askerî eserler"},{"kaynak":"TEORI","tanim":"1919\u0027dan 1927\u0027ye kadar Millî Mücadele ve Cumhuriyet\u0027in kuruluşunu belgelerle anlatan, 1927\u0027de altı günde okunmuş birinci elden tarih kaynağıdır.","ad":"Nutuk"},{"kaynak":"TEORI","tanim":"1930\u0027da yayımlanan, millet, devlet, cumhuriyet ve vatandaşlık konularını işleyen, okullarda ders kitabı olarak kullanılan eserdir.","ad":"Vatandaş İçin Medeni Bilgiler"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi Atatürk\u0027ün genç subaylık yıllarında kaleme aldığı askerî eserlerinden biri değildir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-20","verilenler":[],"dayanak":"TESMER SGS konu özeti - Atatürk\u0027ün Eserleri (Askerî Eserler / Nutuk / Vatandaş İçin Medeni Bilgiler / Geometri)","dogru":"D","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: bir tarih öğretmeni sınıfa 1909 yılında Makedonya\u0027daki bir tatbikat gözlem defterini gösteriyor, öğrenciler bunun hangi eser olduğunu ve hangi döneme ait olduğunu tartışıyor.","anlatim":"Bu defter Cumalı Ordugâhı adlı eserin taslağı, genç subaylık döneminden kalma bir gözlem notu. Sınıf şimdi beş farklı eseri masaya yatırıp hangisinin bu döneme ait olduğuna bakacak.","doldur":[]},{"formul":"Ne yapacağız: Atatürk\u0027ün eserlerini iki döneme ayıracağız, genç subaylık yılları (1908-1918) ve Cumhuriyet dönemi (1930 sonrası).","anlatim":"Askerî eserler genç subaylık yıllarında yazılmış olanlardır, Vatandaş İçin Medeni Bilgiler ise 1930\u0027da Cumhuriyet döneminde yazılmıştır. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Askerî Eserler bölümü","karar":"doğru","anlatim":"Bu eser 1908 tarihli, Almancadan çevrilmiş ama genç subaylık döneminin askerî eserlerinden. Cumalı Ordugâhı ile aynı gruba girer.","formul":"Şık A: öğretmen \u0027Takımın Muharebe Talimi de aynı gözlem defteri gibi genç subaylık dönemine ait mi?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Askerî Eserler bölümü","karar":"doğru","anlatim":"1909 tarihli bu eser tam da Makedonya\u0027daki süvari tatbikatı gözlemlerini içerir. Genç subaylık döneminin askerî eserlerinden biridir.","formul":"Şık B: öğretmen \u0027işte elimizdeki bu Cumalı Ordugâhı defteri, genç subaylık yıllarının askerî eseri sayılır mı?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Askerî Eserler bölümü","karar":"doğru","anlatim":"1918 tarihli bu eser subayın inisiyatif ve sorumluluğunu ele alır, adı sohbet gibi dursa da askerî bir metindir. Genç subaylık döneminin son askerî eseridir.","formul":"Şık C: bir öğrenci \u0027Zabit ve Kumandan ile Hasbihal adı sohbet gibi duruyor, bu bizim döneme uyar mı?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Vatandaş İçin Medeni Bilgiler bölümü","karar":"yanlış","anlatim":"Bu eser 1930\u0027da yazıldı, Afet İnan imzasıyla yayımlandı ama Cumhuriyet dönemine aittir. Genç subaylık döneminin askerî eserleri arasına giremez.","formul":"Şık D: bir öğrenci \u0027Vatandaş İçin Medeni Bilgiler\u0027i de aynı deftere ekleyelim, o da genç subaylık dönemine mi ait?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Askerî Eserler bölümü","karar":"doğru","anlatim":"1911 tarihli bu eser tatbikat seyahatine dair gözlemleri içerir. Genç subaylık döneminin askerî eserlerinden biridir.","formul":"Şık E: son olarak öğretmen \u0027Tabiye ve Tatbikat Seyahati de bizim 1909 defterimizle aynı raftaki eser mi?\u0027 diye soruyor, sen ne dersin?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Dört eser genç subaylık yıllarının askerî eserleri, Medeni Bilgiler ise Cumhuriyet dönemine ait olduğu için farklıdır. Kendine hep şunu sor: bu eser genç subaylık yıllarında mı yazıldı, yoksa Cumhuriyet döneminde mi?","doldur":[]}],"anahtar":[{"ornek":"döneminde","kok":"dönemi"},{"ornek":"subaylık","kok":"subayl"},{"ornek":"eserleri","kok":"eserle"},{"ornek":"cumhuriyet","kok":"cumhur"},{"ornek":"yazılmıştır","kok":"yazılm"},{"ornek":"yıllarına","kok":"yıllar"}],"konuGiris":{"harita":"Ne zaman test edilir: eserlerin hangi döneme (subaylık, Millî Mücadele, Cumhuriyet sonrası) ait olduğu karıştırılınca test edilir. Nasıl ölçülür: verilen eser adının doğru dönem ve içerikle eşleşip eşleşmediğine bakılarak ölçülür. Nasıl kaydedilir: her eser adı, yazıldığı yıl ve konusuyla birlikte hafızada eşleştirilerek kaydedilir.","desen":"Sınav genelde \u0027hangisi eserlerinden değildir\u0027 şeklinde sorup askerî eserler listesine Nutuk veya Geometri\u0027yi karıştırır. Bazen Nutuk\u0027un kapsadığı tarih aralığı yanlış verilir, bazen Geometri kitabının Harf İnkılabı\u0027yla ilişkilendirilmesi tuzağı kurulur. Bu soru p.28\u0027deki askerî eserler listesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Genç subaylık yıllarında yazılan/çevrilen taktik ve talim kitapları","ad":"Askerî eserler","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"1919-1927 Millî Mücadele ve Cumhuriyet kuruluşunu belgeleyen eser","ad":"Nutuk","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Vatandaşlık, devlet ve cumhuriyet konularını işleyen ders kitabı","ad":"Medeni Bilgiler","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Türkçe matematik terimlerinin türetildiği 1937 eseri","ad":"Geometri kitabı","kim":"kanun sabitler"}],"sinavda":"Soru, Atatürk\u0027ün eserlerinden birkaçını sayıp bunlardan hangisinin genç subaylık dönemine ait olmadığını sorar.","panel_ornek":"Bir arkadaşın 3 farklı spor kulübüne üye: biri koşu, biri yüzme, biri de genel spor kulübü ve her birinin farklı bir amacı var. Birini diğeriyle karıştırırsan yanlış kulübe gidersin. Burada da her eseri doğru \u0027döneme\u0027 ve \u0027amaca\u0027 yerleştirmen gerekiyor.","ornek":"Bir arkadaşın 3 farklı spor kulübüne üye: biri koşu, biri yüzme, biri de genel spor kulübü ve her birinin farklı bir amacı var. Birini diğeriyle karıştırırsan yanlış kulübe gidersin. Burada da her eseri doğru \u0027döneme\u0027 ve \u0027amaca\u0027 yerleştirmen gerekiyor.","yontemler":"Her eseri döneme göre üçe ayır: subaylık, Millî Mücadele/Nutuk, Cumhuriyet sonrası (Medeni Bilgiler, Geometri). Askerî eserler listesindeki isimleri (Takımın Muharebe Talimi, Cumalı Ordugâhı, Tabiye Meselesinin Halli, Bölüğün Muharebe Talimi, Tabiye ve Tatbikat Seyahati, Zabit ve Kumandan ile Hasbihal) ezberle.","nedir":"Bu konu Atatürk\u0027ün genç subaylık yıllarında yazdığı askerî eserlerle Nutuk, Medeni Bilgiler ve Geometri gibi diğer eserlerini birbirinden ayırt etmeyi öğretir. Sınav, hangi eserin hangi döneme ve hangi konuya ait olduğunu karıştırıp karıştırmadığını ölçer."},"olay":"Tarih ve dönem karşılaştırması yapılır, ara sayısal işlem gerekmez.","tuzak":{"C":{"ad":"İçerik Tuzağı","metin":"Bu eserin adındaki \u0027Hasbihal\u0027 kelimesinden hareketle onu edebi/siyasi bir eser sanıp askerî eserler dışında bıraktın. Doğrusu: Zabit ve Kumandan ile Hasbihal 1918 tarihli, subaylığın inisiyatif ve sorumluluğunu işleyen askerî bir eserdir."},"E":{"ad":"Tatbikat Tuzağı","metin":"Bu eserin adındaki \u0027Seyahati\u0027 kelimesinden yola çıkıp onu bir gezi anısı sanıp askerî eserler dışında değerlendirdin. Doğrusu: Tabiye ve Tatbikat Seyahati 1911 tarihli, subaylık yıllarına ait bir askerî eserdir."},"A":{"ad":"Askerî Eser Tuzağı","metin":"Bu eseri, Almancadan çeviri olduğu için Atatürk\u0027ün özgün askeri eserleri arasında saymadın. Doğrusu: Takımın Muharebe Talimi 1908\u0027de çevrilmiş olsa da genç subaylık yıllarına ait askerî eserler grubundandır."},"B":{"ad":"Dönem Karıştırma Tuzağı","metin":"Bu eseri Cumhuriyet dönemi eserleriyle karıştırıp askerî eserler grubunun dışında sandın. Doğrusu: Cumalı Ordugâhı 1909 tarihli, subaylık yıllarına ait bir askerî eserdir."}},"celdiriciYol":null,"hap":"Atatürk\u0027ün askerî eserleri genç subaylık yıllarına aittir; Vatandaş İçin Medeni Bilgiler 1930\u0027da, Cumhuriyet döneminde yazılmıştır.","teshis":{"C":{"gercek":"1918 tarihli bu eser, subayın inisiyatif ve sorumluluğunu ele alan askerî bir metindir.","ayirt":"Bu eser genç subaylık yıllarında mı yazıldı, yoksa Cumhuriyet döneminde mi?","paragraf":"Askerî Eserler bölümü","yanilgi":"Eserin adındaki \u0027Hasbihal\u0027 ifadesinden onu bir sohbet/edebi metin sanıp askerî eserler dışında bıraktın."},"E":{"gercek":"1911 tarihli bu eser, tatbikat seyahatine ilişkin gözlemleri içerir ve askerî eserler grubundandır.","ayirt":"Bu eser genç subaylık yıllarında mı yazıldı, yoksa Cumhuriyet döneminde mi?","paragraf":"Askerî Eserler bölümü","yanilgi":"Eserin adındaki \u0027Seyahati\u0027 kelimesinden onu bir gezi notu sanıp askerî eserler dışında değerlendirdin."},"A":{"gercek":"Eser Almancadan çevrilmiş olsa da Atatürk\u0027ün kaleme aldığı askerî eserler grubunda sayılır; 1908 tarihlidir.","ayirt":"Bu eser genç subaylık yıllarında mı yazıldı, yoksa Cumhuriyet döneminde mi?","paragraf":"Askerî Eserler bölümü","yanilgi":"Takımın Muharebe Talimi\u0027nin bir çeviri olduğunu düşünüp Atatürk\u0027ün özgün eseri sayılamayacağını sanıyorsun."},"D":{"gercek":"1930\u0027da yayımlanan bu eserin önemli bölümlerini bizzat Atatürk yazmıştır, ancak eser Cumhuriyet dönemine aittir; askerî eserler grubunda değildir.","ayirt":"Bu eser genç subaylık yıllarında mı yazıldı, yoksa Cumhuriyet döneminde mi?","paragraf":"Vatandaş İçin Medeni Bilgiler bölümü","yanilgi":"Bu eseri Afet İnan imzasıyla yayımlandığı için Atatürk\u0027ün eseri saymıyor ya da askerî eserlerle aynı döneme ait sanıyorsun."},"B":{"gercek":"1909 tarihli bu eser, tatbikat gözlemlerini içerir ve genç subaylık yıllarının askerî eserlerindendir.","ayirt":"Bu eser genç subaylık yıllarında mı yazıldı, yoksa Cumhuriyet döneminde mi?","paragraf":"Askerî Eserler bölümü","yanilgi":"Cumalı Ordugâhı\u0027nı tanımadığın için bunun askerî eser olmadığını, farklı bir grupta yer aldığını düşünüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 20"},"kural":"Bulgaristan, I. Dünya Savaşı sonrası kaybettiği Batı Trakya, Dobruca ve Makedonya toprakları için revizyonist bir dış politika izlediğinden mevcut sınırları güvence altına alan bu pakta girmemiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 20","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Balkan Antantı sorularında dışarıda kalan iki devleti (Bulgaristan, Arnavutluk) ve nedenlerini ayrı ayrı ezberle; şıklarda hangisi geçiyorsa cevap odur.","konu":"balkan antantı","tablo":{"satirlar":[["A) Türkiye","9 Şubat 1934 Atina Antlaşması","YANLIŞ ifade"],["B) Yunanistan","9 Şubat 1934 Atina Antlaşması","YANLIŞ ifade"],["C) Yugoslavya","9 Şubat 1934 Atina Antlaşması","YANLIŞ ifade"],["D) Romanya","9 Şubat 1934 Atina Antlaşması","YANLIŞ ifade"],["E) Bulgaristan","9 Şubat 1934 Atina Antlaşması","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yugoslavya","E":"Bulgaristan","A "Yugoslavya 1934\u0027te kurucu üye olarak imzayı atmıştır; ancak 1930\u0027ların sonunda Almanya\u0027ya yakınlaşarak antlașmadan zayıflamıştır.","E":"Bulgaristan, kaybettiği toprakları geri almak istediği için mevcut sınırları korumaya yönelik bu antlașmaya girmemiştir.","A":"Türkiye kurucu üyelerden biridir ve sınırı Antant ile güvence altına alınmıştır; batı güvenliği açısından esas taraftır.","D":"Romanya, topraklarını korumak isteyen dört kurucu üyeden biridir; revizyonist olan Bulgaristan ile karıştırılmamalıdır.","B":"Yunanistan Atina\u0027da imzaya katılan kurucu üyedir; 1930\u0027daki dostluk anlaşması ayrı bir hükümettir."},"dogru":"Bulgaristan I. Dünya Savaşı\u0027nda kaybettiği Batı Trakya, Dobruca ve Makedonya\u0027yı geri almak istiyordu. Mevcut sınırları güvence altına alan Balkan Antantı\u0027na girmedi. Türkiye, Yunanistan, Yugoslavya ve Romanya kurucu üyelerdir.","sinav":"Balkan Antantı, 9 Şubat 1934\u0027te Atina\u0027da imzalanarak Türkiye, Yunanistan, Yugoslavya ve Romanya\u0027nın Balkan sınırlarını karşılıklı olarak güvence altına almasını amaçlamıştır.","kavramlar":[{"kaynak":"TEORI","tanim":"9 Şubat 1934\u0027te Türkiye, Yunanistan, Yugoslavya ve Romanya arasında imzalanan, Balkan devletlerinin sınırlarını karşılıklı olarak güvence altına almayı ve bölge barışını korumayı amaçlayan antlaşma.","ad":"Balkan Antantı"},{"kaynak":"TEORI","tanim":"Atatürk dönemi Türkiye\u0027sinin barışçı ve bölgesel güvenliğe dayalı dış politika ilkesidir.","ad":"Yurtta barış, dünyada barış"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Balkan Antantı, 9 Şubat 1934\u0027te Atina\u0027da imzalanarak taraf devletlerin Balkan sınırlarını karşılıklı güvence altına almasını amaçlamıştır. Aşağıdaki devletlerden hangisi bu antlaşmaya katılan devletlerden değildir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-21","verilenler":[],"dayanak":"Balkan Antantı, 9 Şubat 1934 Atina Antlaşması (İnkılap Tarihi ders kaynağı)","dogru":"E","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 9 Şubat 1934\u0027te Atina\u0027da bir masa kuruluyor, Türkiye, Yunanistan, Yugoslavya ve Romanya temsilcileri sırayla imza atıyor.","anlatim":"İtalya\u0027nın Balkanlar\u0027a göz diktiği, Almanya\u0027nın silahlandığı bir dönemdeyiz. Masadaki dört devlet birbirinin sınırını güvenceye alıyor, ama masada Bulgaristan yok.","doldur":[]},{"formul":"Ne yapacağız: bu Atina masasına kimin oturduğunu, kimin oturmadığını beş isimle tek tek kontrol edeceğiz.","anlatim":"Kural basit: kurucu üye dört devlettir, Bulgaristan ve Arnavutluk revizyonist ya da İtalya yanlısı olduğu için dışarıdadır. Şimdi A\u0027dan E\u0027ye beş ifadeyi bu masada deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"9 Şubat 1934 Atina Antlaşması","karar":"yanlış","anlatim":"Evet, Türkiye Atina\u0027daki dört kurucu üyeden biri, batı sınırını bu antlaşmayla güvenceye alıyor. Bu, Atatürk döneminin barışçı dış politikasının somut ürünüdür.","formul":"Şık A: Türkiye masada mı oturuyor, imzayı o da atmış mı diyorsun?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"9 Şubat 1934 Atina Antlaşması","karar":"yanlış","anlatim":"Evet, Yunanistan kurucu üyedir; 1930\u0027daki Türk-Yunan dostluğu zemin hazırlamış, 1934\u0027te asıl antlaşma imzalanmıştır. İkisini aynı olay sanma, tarihleri ayır.","formul":"Şık B: Yunanistan da 1930\u0027daki dostluktan sonra bu masaya oturmuş mu diyorsun?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"9 Şubat 1934 Atina Antlaşması","karar":"yanlış","anlatim":"Evet, Yugoslavya kurucu üyedir; sonradan Almanya\u0027ya yakınlaşıp Antant\u0027ı zayıflatması ayrı bir hikâye, kuruluşta o masadadır. Kuruluş anı ile sonraki yılları karıştırma.","formul":"Şık C: Yugoslavya da o gün Atina\u0027da imza atmış mı diyorsun?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"9 Şubat 1934 Atina Antlaşması","karar":"yanlış","anlatim":"Evet, Romanya kurucu üyedir; mevcut sınırlarını korumak istediği için gelmiştir, toprak talep eden Bulgaristan ile karıştırma. Romanya masadadır.","formul":"Şık D: Romanya da sınırlarını korumak isteyip bu masaya oturmuş mu diyorsun?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"9 Şubat 1934 Atina Antlaşması","karar":"doğru","anlatim":"Hayır, Bulgaristan Batı Trakya, Dobruca, Makedonya için toprak istiyor, sınırları sabitleyen bu pakta girmiyor. Bulgaristan masada değil, Arnavutluk gibi dışarıda kalıyor.","formul":"Şık E: Bulgaristan da bir Balkan devleti olduğu için otomatik masaya oturmuş mu diyorsun?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Masadaki dört devlet sınırını korumak istiyor, Bulgaristan ise değiştirmek istiyor. Kendine sor: bu devlet mevcut sınırı mı korumak istiyor, yoksa geri toprak mı istiyor?","doldur":[]}],"anahtar":[{"ornek":"bulgaristan","kok":"bulgar"},{"ornek":"masadaki","kok":"masada"},{"ornek":"istiyor","kok":"istiyo"},{"ornek":"kurucu","kok":"kurucu"},{"ornek":"sınırını","kok":"sınırı"},{"ornek":"toprakları","kok":"toprak"}],"konuGiris":{"harita":"Ne zaman imzalandığı sorulur: 9 Şubat 1934, Atina. Kimlerin taraf olduğu ve kimlerin dışarıda kaldığı sorulur: Türkiye, Yunanistan, Yugoslavya, Romanya taraf; Bulgaristan ve Arnavutluk dışarıda. Amacının ne olduğu sorulur: sınırların karşılıklı güvence altına alınması, saldırı ittifakı değil savunma anlaşması olması.","desen":"Sınav sıklıkla Bulgaristan\u0027ı katılan devletler arasına sızdırarak öğrenciyi yanıltmaya çalışır; oysa Bulgaristan kayıp topraklar yüzünden dışarıdadır. Ayrıca Balkan Antantı ile Sadabat Paktı ve Montrö Sözleşmesi karıştırılabilir; bunlar farklı tarih ve bölgelere aittir. Bu soru \u0027katılmayan devlet\u0027 tuzağı noktasından geliyor (p.28).","terimler":[{"kaynak":"soruda verilir","tanim":"Dört devletin Balkan sınırlarını karşılıklı güvence altına aldığı 1934 anlaşması","ad":"Balkan Antantı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Antantı imzalayan Türkiye, Yunanistan, Yugoslavya, Romanya","ad":"Taraf devletler","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kaybettiği toprakları geri isteyen, mevcut sınırlara karşı devlet","ad":"Revizyonist devlet","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1937\u0027de doğuda imzalanan benzer amaçlı ayrı güvenlik anlaşması","ad":"Sadabat Paktı","kim":"kanun sabitler"}],"sinavda":"Soru, dört şıkta devlet isimleri vererek bunlardan hangisinin Balkan Antantı\u0027na taraf OLMADIĞINI sorar.","panel_ornek":"Dört arkadaş bir apartmanda oturuyor ve aralarında \u0027komşumuza zarar gelirse birlikte karşı çıkarız\u0027 diye sözleşiyorlar. Ama beşinci komşu, kendi eski hesapları yüzünden bu anlaşmaya katılmak istemiyor. İşte tam bu \u0027kim dahil, kim değil\u0027 meselesi sınavın sorduğu şey.","ornek":"Dört arkadaş bir apartmanda oturuyor ve aralarında \u0027komşumuza zarar gelirse birlikte karşı çıkarız\u0027 diye sözleşiyorlar. Ama beşinci komşu, kendi eski hesapları yüzünden bu anlaşmaya katılmak istemiyor. İşte tam bu \u0027kim dahil, kim değil\u0027 meselesi sınavın sorduğu şey.","yontemler":"Dört taraf devleti (Türkiye, Yunanistan, Yugoslavya, Romanya) ezberle; Bulgaristan ve Arnavutluk\u0027un neden dışarıda kaldığını nedenleriyle hatırla.","nedir":"Balkan Antantı, 1934\u0027te dört Balkan devletinin sınırlarını karşılıklı güvence altına aldığı savunma anlaşmasıdır. Sınav, hangi devletlerin bu antlaşmaya üye olduğunu ve hangilerinin dışarıda kaldığını ölçer."},"olay":"Kurucu dört üye Türkiye, Yunanistan, Yugoslavya ve Romanya\u0027dır; Bulgaristan ve Arnavutluk dışarıda kalmıştır.","tuzak":{"C":{"ad":"Zamanlama Tuzağı","metin":"Yugoslavya\u0027nın 1930\u0027ların sonunda Almanya\u0027ya yakınlaşıp antlaşmayı zayıflatmasını, baştan üye olmadığı şeklinde okursun. Doğrusu: Yugoslavya 1934\u0027te kurucu üye olarak imzayı atmış, ancak sonradan Antant\u0027tan uzaklaşmıştır."},"A":{"ad":"Taraf 2,1],[2,2]],"sik":"C","paragraf":"İnkılap Tarihi - Balkan Antantı","karar":"yanlış","anlatim":"Hayır, Yugoslavya kurucu üyedir, 1934\u0027te imzayı atmıştır. Almanya\u0027ya yakınlaşma 1930\u0027ların sonunda antantı zayıflatan ayrı bir gelişmedir.","formul":"Şık C: \u0027Yugoslavya sonradan Almanya\u0027ya yaklaştı, o yüzden hiç üye olmamıştır\u0027 dersen haklı mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"İnkılap Tarihi - Balkan Antantı","karar":"yanlış","anlatim":"Yanlış olur, Romanya da dört kurucudan biridir ve 1934\u0027te imza atmıştır. İtalya\u0027ya yakınlaşma sonraki zayıflama sürecine ait, kuruluşu değiştirmez.","formul":"Şık D: \u0027Romanya İtalya\u0027ya yakınlaştı, demek ki hiç katılmadı\u0027 desen doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"İnkılap Tarihi - Balkan Antantı","karar":"yanlış","anlatim":"Yanlış olur, Bulgaristan revizyonist politikası yüzünden bu masaya hiç oturmaz. Mevcut sınırları güvenceye alan bir pakta girmek onun çıkarına değildir.","formul":"Şık E: \u0027Bulgaristan Balkan devleti olduğuna göre elbette imza atmıştır\u0027 desen doğru mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Dört kurucu üye Türkiye, Yunanistan, Yugoslavya, Romanya\u0027dır; Bulgaristan hiç girmemiştir. Kendine hep bunu sor: bu devletin sınırları koruma mı yoksa değiştirme mi çıkarına?","doldur":[]}],"anahtar":[{"ornek":"bulgaristan","kok":"bulgar"},{"ornek":"kurucu","kok":"kurucu"},{"ornek":"türkiye","kok":"türkiy"},{"ornek":"yunanistan","kok":"yunani"},{"ornek":"sınırları","kok":"sınırl"},{"ornek":"yugoslavya","kok":"yugosl"}],"konuGiris":{"harita":"Ne zaman test edilir: antantın kurucu üyeleri sorulduğunda ve Bulgaristan-Arnavutluk gibi katılmayan devletler seçeneklere eklendiğinde. Nasıl ölçülür: doğru dört devleti (Türkiye, Yunanistan, Yugoslavya, Romanya) katılmayanlardan ayırt edip edememekle. Nasıl kaydedilir: tarih (9 Şubat 1934, Atina) ve amaç (sınırları güvence altına alma) ile birlikte hatırlanır.","desen":"Sınav en çok Bulgaristan\u0027ı üyeler arasına karıştırarak sorar, oysa Bulgaristan revizyonist olduğu için katılmamıştır. Bazen Arnavutluk da yanlış şekilde üye gösterilir; o da İtalya etkisiyle dışarıda kalmıştır. Bu soru p.28\u0027deki katılmayanlar listesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"1934\u0027te dört devlet arasında imzalanan sınır güvence anlaşması","ad":"Balkan Antantı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Türkiye, Yunanistan, Yugoslavya ve Romanya\u0027nın oluşturduğu dörtlü grup","ad":"Kurucu üyeler","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"kaybettiği toprakları geri almak isteyen, sınırı kabul etmeyen devlet","ad":"Revizyonist devlet","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1937\u0027de doğuda imzalanan benzer amaçlı güvenlik antlaşması","ad":"Sadabat Paktı","kim":"kanun sabitler"}],"sinavda":"Soru dört devletten oluşan bir liste verir ve bu listeye eklenmiş, gerçekte katılmamış bir devleti bulmayı ister.","panel_ornek":"Dört arkadaş bir yazlık evi birlikte kiralamaya karar verdi ve kirayı dörde bölüştüler; ama komşu arkadaşları revizyon istediği için, yani ev sahibiyle anlaşmazlığı olduğu için bu ortaklığa girmedi. Sonunda sadece anlaşan dört kişi kirayı imzaladı, beşinci kişi dışarıda kaldı.","ornek":"Dört arkadaş bir yazlık evi birlikte kiralamaya karar verdi ve kirayı dörde bölüştüler; ama komşu arkadaşları revizyon istediği için, yani ev sahibiyle anlaşmazlığı olduğu için bu ortaklığa girmedi. Sonunda sadece anlaşan dört kişi kirayı imzaladı, beşinci kişi dışarıda kaldı.","yontemler":"Katılan dört devleti (Türkiye, Yunanistan, Yugoslavya, Romanya) ezberle, kalan her isim çeldiricidir; Bulgaristan ve Arnavutluk\u0027un neden katılmadığını (revizyonizm, İtalya etkisi) hatırlamak seçeneği elemede yeterlidir.","nedir":"Balkan Antantı, 1934\u0027te Türkiye, Yunanistan, Yugoslavya ve Romanya\u0027nın imzaladığı bölgesel güvenlik anlaşmasıdır. Sınav, bu antanta hangi devletlerin katıldığını ve hangilerinin dışarıda kaldığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Yugoslavya Tuzağı","metin":"Yugoslavya\u0027nın sonradan Almanya\u0027ya yakınlaşması üyeliğinin baştan olmadığı yönünde yanlış çıkarım yapılır. Doğrusu: Yugoslavya antantın kurucu üyesidir, yakınlaşma antantı sonradan zayıflatmıştır."},"A":{"ad":"Ne soruluyor","metin":"beş devletten hangisinin Balkan Antantı\u0027na katılmadığı soruluyor. Türkiye Tuzağı: Türkiye\u0027nin de bu pakta girmediği düşünülür. Doğrusu: Türkiye, 9 Şubat 1934\u0027te Atina\u0027da imzalanan Balkan Antantı\u0027nın kurucu üyesidir."},"D":{"ad":"Romanya Tuzağı","metin":"Romanya\u0027nın sonradan İtalya\u0027ya yakınlaşması kurucu üyeliğini geçersiz kılıyormuş gibi düşünülür. Doğrusu: Romanya, antantın dört kurucu üyesinden biridir."},"B":{"ad":"Yunanistan Tuzağı","metin":"1930\u0027da Türkiye ile başlayan dostluğun antant dışı tutulduğu sanılır. Doğrusu: Yunanistan, Balkan Antantı\u0027nın dört kurucu üyesinden biridir."}},"celdiriciYol":null,"hap":"Balkan Antantı (9 Şubat 1934, Atina) Türkiye-Yunanistan-Yugoslavya-Romanya arasındadır; Bulgaristan (revizyonist) ve Arnavutluk (İtalya etkisinde) üye değildir.","teshis":{"C":{"gercek":"Yugoslavya kurucu üyedir; 1930\u0027ların sonunda Almanya\u0027ya yakınlaşması antantı zayıflatan bir sonraki gelişmedir, kuruluşu değiştirmez.","ayirt":"Soru kuruluş anını mı, sonraki zayıflama sürecini mi soruyor?","paragraf":"İnkılap Tarihi - Balkan Antantı","yanilgi":"Sonradan Almanya\u0027ya yakınlaşmayı, başlangıçta hiç üye olmadığı şeklinde yorumluyorsun."},"E":{"gercek":"Bulgaristan, kaybettiği topraklar nedeniyle revizyonist politika izlediğinden mevcut sınırları güvenceye alan bu pakta katılmamıştır; tıpkı İtalya etkisindeki Arnavutluk gibi.","ayirt":"Bu devletin mevcut sınırları korumaktan mı yoksa değiştirmekten mi yana bir çıkarı vardı?","paragraf":"İnkılap Tarihi - Balkan Antantı","yanilgi":"Bulgaristan\u0027ı Balkan devleti olduğu için otomatik olarak antant üyesi sayıyorsun."},"A":{"gercek":"Türkiye, Balkan Antantı\u0027nın (1934) dört kurucu üyesinden biridir; Sadabat Paktı (1937) ise doğu sınırında ayrı bir anlaşmadır.","ayirt":"Bu pakt 1934\u0027te batı sınırında mı, 1937\u0027de doğu sınırında mı imzalandı?","paragraf":"İnkılap Tarihi - Balkan Antantı","yanilgi":"Türkiye\u0027nin dönemin bütün Balkan paktlarında değil sadece Sadabat Paktı\u0027nda yer aldığını sanıyorsun."},"D":{"gercek":"Romanya kurucu üyedir; İtalya\u0027ya yakınlaşması antantın sonraki zayıflama sürecine ait bir gelişmedir.","ayirt":"Yakınlaşma kuruluş tarihinden önce mi sonra mı gerçekleşti?","paragraf":"İnkılap Tarihi - Balkan Antantı","yanilgi":"Romanya\u0027nın İtalya\u0027ya yakınlaşmasını üyeliğin hiç gerçekleşmediği şeklinde okuyorsun."},"B":{"gercek":"Yunanistan, Türkiye, Yugoslavya ve Romanya ile birlikte 1934\u0027te Atina\u0027da antantı imzalayan dört kurucu devletten biridir.","ayirt":"Antant hangi şehirde ve kimler arasında imzalandı?","paragraf":"İnkılap Tarihi - Balkan Antantı","yanilgi":"Antant üyeliğini yalnızca büyük devletlerle sınırlı sanıp Yunanistan\u0027ı dışarıda bırakıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 20"},"kural":"Sümerbank 1933\u0027te kurulmuş devlet kuruluşudur ve 1934 planının uygulayıcısı olarak dokuma-kağıt-cam gibi fabrikaları kurup işletmiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 20","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Kuruluş yılı ile plan yılını her zaman ayrı tut; madencilik geçen şık otomatik elenir çünkü o Etibank\u0027ın alanıdır.","konu":"birinci sanayi planı sümerbank","tablo":{"satirlar":[["A) Sümerbank, plana destek vermek amacıyla planla birlikte …","İnkılap Tarihi - Devletçilik ve Birinci Beş Yıllık Sanayi Planı","YANLIŞ ifade"],["B) Sümerbank 1933\u0027te kurulmuş, planın uygulayıcısı olarak d…","İnkılap Tarihi - Sümerbank fabrikaları listesi","doğru ifade"],["C) Sümerbank, madencilik alanında faaliyet göstermek üzere …","İnkılap Tarihi - Etibank ve Maden Tetkik ve Arama Enstitüsü","YANLIŞ ifade"],["D) Sümerbank\u0027ın kuruluşu, devletçilik politikasının özel se…","İnkılap Tarihi - Devletçilik politikasının tanımı","YANLIŞ ifade"],["E) Sümerbank, İkinci Beş Yıllık Sanayi Planı kapsamında kur…","İnkılap Tarihi - İkinci Beş Yıllık Sanayi Planı\u0027nın uygulanamaması","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Sümerbank, madencilik alanında faaliyet göstermek üzere 1935\u0027te kurulan bir devlet kuruluşudur","E":"Sümerbank, İkinci Beş Yıllık Sanayi Planı kapsamında kurulan ilk kamu bankasıdır","A":"Sümerbank, plana destek vermek amacıyla planla birlikte 1934\u0027te kurulmuş bir kamu bankasıdır","D":"Sümerbank\u0027ın kuruluşu, devletçilik politikasının özel sermayeyi tamamen yasaklaması sonucu gerçekleşmiştir","B":"Sümerbank 1933\u0027te kurulmuş, planın uygulayıcısı olarak dokuma, kâğıt ve cam gibi alanlarda fabrikalar kurup işletmiştir"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - birinci sanayi plani sumerbank","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: 1929 Dünya Ekonomik Bunalımı ve özel sermaye birikiminin yetersizliği Türkiye\u0027yi DEVLETÇİLİK politikasına yöneltti: devlet, özel kesimin yapamadığı temel sanayi yatırımlarını kendisi üstlendi. BİRİNCİ BEŞ YILLIK SANAYİ PLANI 1934\u0027te uygulamaya girdi (1934–1938); Türkiye\u0027nin ilk planlı sanayileşme denemesidir ve Sovyetler Birliği\u0027nden alınan kredi ile uzman desteğinden yararlanılmıştır. Planın hedefi, ham maddesi yurt içinde bulunan ve iç tüketime dönük temel tüketim mallarında (dokuma, kâğıt, cam, kimya, demir-çelik, maden) dışa bağımlılığı azaltmaktı. SÜMERBANK 1933\u0027te kuruldu; planın uygulayıcısı olan devlet kuruluşu olarak fabrikaları kurdu ve işletti: Kayseri Bez Fabrikası (1935), Nazilli Basma Fabrikası (1937), Ereğli Bez, Bursa Merinos (1938), Malatya iplik ve bez, Beykoz deri ve kundura, Paşabahçe cam (1935), İzmit Kâğıt Fabrikası (1936), Karabük Demir-Çelik Fabrikası (temeli 1937, üretim 1939). Madencilik için ETİBANK ve MADEN TETKİK VE ARAMA ENSTİTÜSÜ 1935\u0027te kuruldu. SONUÇ: Plan büyük ölçüde başarıyla tamamlandı; sanayi üretimi ve kamu işletmeciliği gelişti; İkinci Beş Yıllık Plan (1938) II. Dünya Savaşı\u0027nın başlaması nedeniyle uygulanamadı. SINAV TUZAĞI: (1) Devletçilik özel girişimi yasaklamaz; özel kesimin gücünün yetmediği alanlarda devletin yatırım yapmasıdır. (2) Sümerbank 1933\u0027te (plan öncesinde) kuruldu; plan 1934\u0027te başladı. (3) Etibank madencilik, Sümerbank sanayi (özellikle dokuma) kuruluşudur; ikisi karıştırılır. SINAVDA NASIL SORULUR: \u0027Birinci Beş Yıllık Sanayi Planı\u0027nın uygulanmasında gör…"}],"hakem":"Soru Ataturk Ilkeleri ve Inkilap Tarihi dersinin resmi kapsamina ait Birinci Sanayi Plani ve Suzerbank konusunu olcuyor; dogru sikta (B) Sumerbank\u0027in 1933\u0027te kurulusu ve planin uygulaicisi rolu kaynak metinde acikca destekleniyor."},"kayitlar":[],"sade":{"siklar":{"C":"Madencilik görevleri Etibank ile Maden Tetkik ve Arama Enstitüsü\u0027ne aitti; Sümerbank dokuma, kâğıt, cam gibi sanayi alanlarında çalıştı.","E":"Sümerbank Birinci Plan\u0027ın uygulayıcısı olarak 1933\u0027te kuruldu; İkinci Plan savaş başlaması nedeniyle uygulanamamıştır.","D":"Devletçilik özel sermayeyi yasaklamaz; özel kesimin yetersiz kaldığı temel sanayi alanlarında devlet yatırım yapmasıdır.","A":"Sümerbank\u0027ın kurulduğu tarih yanlış hesaplanmış: 1933\u0027te kuruldu, plan 1934\u0027te başladı; banka plandan önce vardır."},"dogru":"Sümerbank 1933\u0027te kuruldu, bir yıl sonra başlayan Birinci Beş Yıllık Sanayi Planı\u0027nın uygulayıcısı olarak dokuma, kâğıt, cam gibi alanlarda fabrikalar inşa etti ve işletti.","sinav":"Birinci Beş Yıllık Sanayi Planı\u0027nın (1934–1938) uygulanmasında Sümerbank\u0027ın kuruluş tarihi ve işlevsel rolü.","kavramlar":[{"ka ank\u0027tır. Kendine sor: bu kuruluş fabrika mı kurdu, yoksa sadece maden mi aradı ya da kredi mi verdi?","doldur":[]}],"anahtar":[{"ornek":"fabrikaları","kok":"fabrik"},{"ornek":"sümerbank","kok":"sümerb"},{"ornek":"devlet","kok":"devlet"},{"ornek":"kuruluş","kok":"kurulu"},{"ornek":"karabük","kok":"karabü"},{"ornek":"nazilli","kok":"nazill"}],"konuGiris":{"harita":"Ne zaman uygulandı: Plan 1934-1938 yılları arasında yürütüldü. Kim uyguladı: 1933\u0027te kurulan Sümerbank, dokuma ve temel tüketim malı fabrikalarını kurup işletti. Nasıl ayırt edilir: Madencilik alanı Sümerbank\u0027tan ayrı olarak Etibank\u0027a aittir.","desen":"Sınav bu konuyu genellikle \u0027planın uygulayıcısı hangi kuruluştur\u0027 şeklinde sorar ve Sümerbank ile Etibank\u0027ı karıştırtmaya çalışır. Bazı sorularda Sümerbank\u0027ın kuruluş tarihi (1933) ile planın başlangıç tarihi (1934) birbirine karıştırılır. Bu soru p.28\u0027deki kuruluş-görev eşleştirmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Özel sermayenin yetersiz kaldığı alanlarda devletin yatırım yapması","ad":"Devletçilik","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1934\u0027te başlayan Türkiye\u0027nin ilk planlı sanayileşme programı","ad":"Birinci Beş Yıllık Sanayi Planı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Dokuma ve temel tüketim malları fabrikalarını kuran, işleten devlet kuruluşu","ad":"Sümerbank","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Madencilik alanında kurulan, Sümerbank\u0027tan farklı devlet kuruluşu","ad":"Etibank","kim":"kanun sabitler"}],"sinavda":"Soruda planın uygulayıcısı olan, dokuma ve temel tüketim malları alanında fabrika kuran kuruluşun adı istenir.","panel_ornek":"Bir arkadaşının ailesi kendi imkanıyla küçük bir tekstil tezgahı kuramayınca, belediye devreye girip 3 ortaklı bir dokuma atölyesi açtı ve işletmeye başladı. Burada özel kesim yetersiz kalınca kamu kurum devreye girdi. Bu, devletin boşluğu doldurmas
