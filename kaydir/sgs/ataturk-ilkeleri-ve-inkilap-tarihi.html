kaydedilir: Doğru sıralama kronolojik tarih bilgisiyle (5 Ağustos, 23 Ağustos-13 Eylül, 19 Eylül 1921) eşleştirilerek kaydedilir.","desen":"Soru genellikle \u0027sonuçları arasında yer almaz\u0027 kalıbıyla sorulur ve şıklardan biri Sakarya\u0027ya değil başka bir savaşa (Büyük Taarruz gibi) aittir. Bir diğer tuzak, Başkomutanlık Kanunu\u0027nun savaştan önce, Mareşallik ve Gazilik unvanının savaştan sonra verildiğini karıştırmaktır. Bu soru p.28\u0027deki sonuçlar ve tuzak noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meclis yetkilerini Mustafa Kemal\u0027e üç ay süreyle veren kanun, savaştan önce çıkar","ad":"Başkomutanlık Kanunu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Halkın gıda, giyim, taşıt, silah kaynaklarını orduya seferber eden emirler","ad":"Tekalif-i Milliye Emirleri","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"TBMM\u0027nin savaş sonrasında Mustafa Kemal\u0027e verdiği rütbe ve unvan","ad":"Mareşallik ve Gazilik","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kafkas cumhuriyetleriyle imzalanan, doğu sınırını kesinleştiren antlaşma","ad":"Kars Antlaşması","kim":"kanun sabitler"}],"sinavda":"Sakarya Meydan Muharebesi\u0027nin sonuçları sıralanır ve bunlardan biri gerçek sonuç olmadığı için ayırt edilmesi istenir.","panel_ornek":"Bir arkadaşın kiraladığı evi taksitle öderken önce kirayı ödeyeceğine dair bir sözleşme imzalar, sonra ödemeleri yapar, en son ev sahibi ona \u0027güvenilir kiracı\u0027 belgesi verir. Sırası karışırsa, sanki belge ödemeden önce verilmiş gibi yanlış hatırlar. Sakarya\u0027da da olaylar sırası karıştırılarak sorulur: önce yetki, sonra savaş, sonra unvan.","ornek":"Bir arkadaşın kiraladığı evi taksitle öderken önce kirayı ödeyeceğine dair bir sözleşme imzalar, sonra ödemeleri yapar, en son ev sahibi ona \u0027güvenilir kiracı\u0027 belgesi verir. Sırası karışırsa, sanki belge ödemeden önce verilmiş gibi yanlış hatırlar. Sakarya\u0027da da olaylar sırası karıştırılarak sorulur: önce yetki, sonra savaş, sonra unvan.","yontemler":"Tarihleri ezberlemek yerine sırayı mantıkla kur: önce yetki (Ağustos başı), sonra savaş (Ağustos sonu-Eylül ortası), sonra unvan (Eylül sonu), en son antlaşmalar (Ekim). Büyük Taarruz\u0027u ve savunma-taarruz ayrımını Sakarya sonuçlarına karıştırma.","nedir":"Sakarya Meydan Muharebesi, Kurtuluş Savaşı\u0027nın son savunma savaşıdır ve TBMM\u0027yi Ankara\u0027ya yaklaşan Yunan ordusuna karşı ayakta tutan dönüm noktasıdır. Bu sınav sorusu, savaşın hangi olaylardan önce hangilerinden sonra geldiğini ve hangi antlaşmanın kiminle yapıldığını ölçer."},"olay":"Moskova Antlaşması 16 Mart 1921\u0027de, yani Sakarya Meydan Muharebesi\u0027nden çok önce imzalanmıştır.","tuzak":{"D":{"ad":"Süreç-Sonuç Karıştırma Tuzağı","metin":"taarruz gücünün kırılmasını savaşın kendi içindeki bir an sanıp sonuç kabul etmezsin. Doğrusu: Yunan ordusunun taarruz gücünün kırılıp savunmaya geçmesi savaşın doğrudan sonucudur."},"E":{"ad":"Taraf Tuzağı","metin":"Kars Antlaşması\u0027nı Sakarya ile ilgisiz, ayrı bir süreç sayarsın. Doğrusu: Kars Antlaşması Sakarya sonrası oluşan diplomatik ortamda 13 Ekim 1921\u0027de imzalanmış, doğu sınırını kesinleştiren bir sonuçtur."},"A":{"ad":"Kronoloji Tuzağı","metin":"Mareşal rütbesi ve Gazi unvanının savaş sırasında verildiğini düşünüp bunu sonuç saymazsın. Doğrusu: TBMM bu unvanı savaş bittikten sonra 19 Eylül 1921\u0027de vermiştir, gerçek bir Sakarya sonucudur."},"B":{"ad":"Antlaşma Karıştırma Tuzağı","metin":"Ankara Antlaşması\u0027nı başka bir cephenin sonucu sayıp buraya ait olmadığını düşünürsün. Doğrusu: Fransa ile Ankara Antlaşması 20 Ekim 1921\u0027de Sakarya zaferinin ardından imzalanmıştır."}},"celdiriciYol":{},"hap":"Sakarya\u0027nın sonucu sayılabilmesi için gelişmenin savaştan (23 Ağustos-13 Eylül 1921) SONRA olması gerekir; Moskova Antlaşması (16 Mart 1921) öncesindedir, Kars ve Ankara Antlaşmaları (Ekim 1921) ile Mareşal-Gazi unvanı (19 Eylül 1921) sonrasındadır.","teshis":{"C":{"gercek":"Moskova Antlaşması 16 Mart 1921\u0027de, Sakarya Meydan Muharebesi\u0027nden (23 Ağustos-13 Eylül 1921) önce imzalanmıştır; dolayısıyla savaşın sonucu değildir.","ayirt":"Bu antlaşmanın tarihi, savaşın 23 Ağustos-13 Eylül 1921 aralığından önce mi sonra mı?","paragraf":"Sakarya kronolojisi - 16 Mart 1921 Moskova Antlaşması","yanilgi":"Moskova Antlaşması\u0027nı Kars Antlaşması ile aynı süreçte sayıp Sakarya sonrası imzalandığını düşünüyorsun."},"E":{"gercek":"Kars Antlaşması, Sakarya sonrasında oluşan elverişli ortamda 13 Ekim 1921\u0027de imzalanmış, doğu sınırını kesinleştirmiştir.","ayirt":"Bu antlaşma Sakarya zaferinden sonraki diplomatik kazanımlar arasında mı?","paragraf":"Sakarya kronolojisi - 13 Ekim 1921 Kars Antlaşması","yanilgi":"Kars Antlaşması\u0027nı Sakarya ile bağlantısız, ayrı bir diplomatik süreç sanıyorsun."},"A":{"gercek":"TBMM bu unvanları savaş bittikten sonra, 19 Eylül 1921\u0027de vermiştir; bu bir Sakarya sonucudur.","ayirt":"Bu gelişme savaştan önce mi sonra mı gerçekleşti?","paragraf":"Sakarya kronolojisi - 19 Eylül 1921","yanilgi":"Mareşal ve Gazi unvanının savaştan önce ya da savaş sırasında verildiğini sanıyorsun."},"D":{"gercek":"Yunan ordusunun taarruz gücünün kırılıp savunmaya geçmesi, savaşın doğrudan ve temel sonucudur.","ayirt":"Bu durum savaşın bitiminde ortaya çıkan bir netice mi, yoksa savaşın kendisi mi?","paragraf":"Sakarya kronolojisi - savaş sonu askeri durum","yanilgi":"Taarruz gücünün kırılmasını savaşın kendisiyle aynı şey sayıp bunu bir sonuç olarak görmüyorsun."},"B":{"gercek":"Ankara Antlaşması, Sakarya zaferi sonrasında 20 Ekim 1921\u0027de Fransa ile imzalanmıştır.","ayirt":"Bu antlaşma hangi savaşın ardından, kimlerle imzalandı?","paragraf":"Sakarya kronolojisi - 20 Ekim 1921 Ankara Antlaşması","yanilgi":"Ankara Antlaşması\u0027nı farklı bir cephenin ya da farklı bir savaşın sonucu sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 19"},"kural":"Serbest Cumhuriyet Fırkası kendi kendini feshetmiştir; hükümet kararıyla kapatılan Terakkiperver Cumhuriyet Fırkası\u0027dır (1925).","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 19","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İki parti sorulduğunda önce \u0027kapandı mı feshetti mi\u0027 ve \u0027kurucusu kim\u0027 ikilisini ayrı ayrı eşleştir.","konu":"serbest cumhuriyet fırkası","tablo":{"satirlar":[["A) Ekonomide liberalizmi savunmuş, devletçiliğe karşı özel …","1930 program metni","doğru ifade"],["B) Kurucusu Fethi (Okyar) Bey\u0027dir.","1930 kuruluş bilgisi","doğru ifade"],["C) 1930 yılı belediye seçimlerine katılmıştır.","1930 seçim gelişmesi","doğru ifade"],["D) Hükümet kararıyla kapatılmıştır.","1930 kapanış bilgisi","YANLIŞ ifade"],["E) Kapandıktan kısa süre sonra Menemen Olayı yaşanmıştır.","23 Aralık 1930 olay kronolojisi","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"1930 yılı belediye seçimlerine katılmıştır.","E":"Kapandıktan kısa süre sonra Menemen Olayı yaşanmıştır.","A":"Ekonomide liberalizmi savunmuş, devletçiliğe karşı özel girişimi desteklemiştir.","D":"Hükümet kararıyla kapatılmıştır.","B":"Kurucusu Fethi (Okyar) Bey\u0027dir."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - serbest cumhuriyet firkasi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: SERBEST CUMHURİYET FIRKASI 12 AĞUSTOS 1930\u0027da Fethi (Okyar) Bey tarafından, Atatürk\u0027ün isteği ve teşvikiyle kuruldu. Amaç, 1925\u0027te Terakkiperver Cumhuriyet Fırkası\u0027nın kapatılmasından sonra tek partili kalan meclise denetim işlevi kazandırmak ve 1929 Dünya Ekonomik Bunalımı\u0027nın yarattığı hoşnutsuzluğa demokratik bir kanal açmaktı. Atatürk kız kardeşi Makbule Hanım\u0027ın ve bazı yakınlarının partiye girmesine izin verdi. PROGRAMI: Ekonomide LİBERALİZM (devletçiliğe karşı özel girişimin desteklenmesi, yabancı sermayenin teşviki), TEK DERECELİ SEÇİM, kadınlara siyasal haklar, vergilerin hafifletilmesi; cumhuriyetçilik ve laiklik ilkelerine bağlılık. GELİŞME: Parti kısa sürede beklenmedik bir halk desteği kazandı; Ekim 1930 belediye seçimlerinde bazı belediyeleri aldı. Ancak rejime karşı olanlar ve dinî çevreler partiye sığındı; Fethi Bey partinin Atatürk\u0027e karşı bir hareket gibi görünmesinden çekindi. KAPANIŞ: Parti 17 KASIM 1930\u0027da kendi kendini feshetti (kapatılmadı). Kısa süre sonra 23 ARALIK 1930\u0027da MENEMEN OLAYI yaşandı: Derviş Mehmet ve yandaşlarının şeriat çağrısına karşı koyan yedek subay Kubilay ve iki bekçi öldürüldü; olay rejimin henüz tehlikelerden kurtulmadığını gösterdi ve çok partili hayat 1945\u0027e kadar ertelendi. SINAV TUZAĞI: (1) Serbest Fırka KENDİNİ FESHETTİ; Terakkiperver Fırka ise hükümet kararıyla KAPATILDI (1925). (2) Kurucusu Fethi Okyar\u0027dır; Terakkiperver\u0027in kurucuları Kazım Karabekir, Rauf Orbay, Ali Fuat Cebesoy\u0027dur. (3) Ekonomi programı devletçilik değil liberalizmdir. SINAVDA NASIL SORULUR:…"}],"hakem":"Soru, Serbest Cumhuriyet Fırkası\u0027nın kendini feshettiğini (hükümet kararıyla kapatılmadığını) test ediyor; kaynak metni bu kuralı açıkça içeriyor ve D şıkkı doğru cevaptır."},"kayitlar":[],"sade":{"siklar":{"C":"Parti Ekim 1930 belediye seçimlerine katılmış ve bazı belediyeleri kazanmıştır. Bu şık doğrudur.","E":"Parti 17 Kasım 1930\u0027da kapatılmış, Menemen Olayı 23 Aralık 1930\u0027da gerçekleşmiştir; olayın kapanıştan sonra yaşanması doğrudur.","A":"Parti programında ekonomide liberalizm ve özel girişim desteği açıkça yer alır; devletçiliğe karşı durmaktadır. Bu şık doğrudur.","B":"Fethi (Okyar) Bey, Serbest Cumhuriyet Fırkası\u0027nın 1930\u0027daki kurucusu ve lideridir. Bu şık doğrudur."},"dogru":"Serbest Cumhuriyet Fırkası 17 Kasım 1930\u0027da kendi kendini feshetti; hükümet tarafından kapatılmadı. Terakkiperver Cumhuriyet Fırkası\u0027nı 1925\u0027te hükümet kapattı, iki partinin kapanış biçimi sık karıştırılır."," apanı"},{"ornek":"feshetmiştir","kok":"feshet"},{"ornek":"kararıyla","kok":"kararı"},{"ornek":"serbest","kok":"serbes"}],"konuGiris":{"harita":"Ne zaman test edilir: Serbest Cumhuriyet Fırkası\u0027nın kapanış tarihi ve şekli sorulduğunda test edilir. Nasıl ölçülür: kendini fesih ile kapatılma kavramları birbirine karıştırılarak, doğru seçeneğin ayırt edilmesiyle ölçülür. Nasıl kaydedilir: tarih sırası (kuruluş-kapanış-Menemen) kronolojik bir zincir olarak hatırda tutulur.","desen":"Soru genelde kapanış şeklini kapatılma gibi göstererek tuzak kurar; oysa parti 17 Kasım 1930\u0027da kendi kendini feshetmiştir. Terakkiperver Fırka\u0027nın kapatılmasıyla karıştırılması en sık görülen hatadır. Bu soru p.28\u0027deki kapanış sürecinin kavramsal ayrımından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Fethi Okyar\u0027ın 1930\u0027da kurduğu, denetim işlevi görecek muhalefet partisi.","ad":"Serbest Cumhuriyet Fırkası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Partinin kendi kararıyla varlığına son vermesi, kapatılma değildir.","ad":"Kendini fesih","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1925\u0027te hükümet kararıyla kapatılan önceki muhalefet partisi, kıyas unsuru.","ad":"Terakkiperver Cumhuriyet Fırkası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Fırkanın kapanışından sonra yaşanan, çok partililiği geciktiren isyan olayı.","ad":"Menemen Olayı","kim":"kanun sabitler"}],"sinavda":"Soru, fırkanın kapanış şekline dair bir bilgi cümlesi verir ve doğru seçeneği seçmeni ister.","panel_ornek":"Bir arkadaşın kurduğu küçük bir öğrenci kulübü, üyeler kendi aralarında tartışıp \u0027artık amacımıza ulaştık, kapatalım\u0027 deyip kendi kararıyla dağılabilir; ya da okul yönetimi kuralları ihlal ettiği için kulübü resmen kapatabilir. Bu iki bitiş şekli birbirinden tamamen farklıdır ve hangisinin yaşandığı önemlidir.","ornek":"Bir arkadaşın kurduğu küçük bir öğrenci kulübü, üyeler kendi aralarında tartışıp \u0027artık amacımıza ulaştık, kapatalım\u0027 deyip kendi kararıyla dağılabilir; ya da okul yönetimi kuralları ihlal ettiği için kulübü resmen kapatabilir. Bu iki bitiş şekli birbirinden tamamen farklıdır ve hangisinin yaşandığı önemlidir.","yontemler":"Kritik kural: \u0027kapatıldı\u0027 ifadesi geçen seçenekler bu fırka için yanlıştır, çünkü o kendini feshetmiştir.","nedir":"Bu konu, tek partili dönemde denetim ve demokratik açılım denemesi olarak kurulan Serbest Cumhuriyet Fırkası\u0027nın kuruluş amacını ve kapanış şeklini işler. Sınav burada \u0027kapatıldı mı, kendisi mi feshetti\u0027 ayrımını ölçer."},"olay":"","tuzak":{"C":{"ad":"Zaman Sırası Tuzağı","metin":"Menemen Olayı, partinin kendini feshetmesinden SONRA (23 Aralık 1930) yaşanmıştır; parti o tarihte zaten kapanmıştı. Doğrusu: Kapanma Menemen\u0027den önce, kendi kararıyla olmuştur."},"E":{"ad":"Birleşme Tuzağı","metin":"Böyle bir birleşme yaşanmamıştır, Terakkiperver Fırka zaten 1925\u0027te kapatılmıştı ve 1930\u0027da faal değildi. Doğrusu: Serbest Fırka tek başına kendini feshetmiştir."},"D":{"ad":"Gerekçe Karıştırma Tuzağı","metin":"1929 Bunalımı partinin KURULUŞ nedenlerindendir, kapanış gerekçesi değildir; ayrıca kapatan bir Meclis kararı yoktur. Doğrusu: Kapanış kendi feshi şeklindedir."},"A":{"ad":"Takrir-i Sükûn Tuzağı","metin":"Bu kanunla kapatılan parti Terakkiperver Cumhuriyet Fırkası\u0027dır (1925), Serbest Fırka değildir. Doğrusu: Serbest Fırka hükümet kararıyla değil kendi iradesiyle kapanmıştır."}},"celdiriciYol":null,"hap":"Serbest Cumhuriyet Fırkası kapatılmamış, 17 Kasım 1930\u0027da kendi kararıyla feshedilmiştir; Menemen Olayı bu fesihten sonradır.","teshis":{"C":{"gercek":"Fesih 17 Kasım, Menemen Olayı 23 Aralık 1930\u0027dadır; olay kapanıştan sonradır ve fesih kararına neden olmamıştır.","ayirt":"Hangi olay önce, hangisi sonra gerçekleşti?","paragraf":"TESMER konu özeti - kronoloji","yanilgi":"Menemen Olayı ile parti kapanışını aynı anda, birbirinin sebebi gibi düşünüyorsun."},"E":{"gercek":"Terakkiperver Fırka 1925\u0027te zaten kapatılmıştı, 1930\u0027da faaliyette değildi; birleşme söz konusu olamaz.","ayirt":"1930\u0027da Terakkiperver Fırka hâlâ faal miydi?","paragraf":"TESMER konu özeti - Terakkiperver Fırka\u0027nın kapatılışı","yanilgi":"İki muhalefet partisinin akıbetini birleştirip tek bir son kurguluyorsun."},"A":{"gercek":"Takrir-i Sükûn Kanunu 1925\u0027te Terakkiperver Cumhuriyet Fırkası\u0027nı kapatmak için kullanılmıştır; Serbest Fırka için uygulanmamıştır.","ayirt":"Bu kanun hangi partiye uygulandı, tarihi neydi?","paragraf":"TESMER konu özeti - Terakkiperver/Serbest Fırka ayrımı","yanilgi":"İki muhalefet partisinin kapanış biçimini birbirine karıştırıyorsun."},"D":{"gercek":"1929 Bunalımı, partinin KURULUŞ gerekçelerindendir; kapanışı Meclis kararı değil kendi feshidir.","ayirt":"Bu olay partinin kurulmasına mı, kapanmasına mı sebep oldu?","paragraf":"TESMER konu özeti - kuruluş nedenleri","yanilgi":"Partinin kuruluş nedenini (ekonomik bunalıma kanal açma) kapanış gerekçesi sanıyorsun."},"B":{"gercek":"Fethi Bey, partinin rejime karşı bir odak haline gelmesinden çekinerek 17 Kasım 1930\u0027da fırkayı kendi kararıyla feshetmiştir.","ayirt":"Parti dışarıdan mı kapatıldı, yoksa kendi mi kapandı?","paragraf":"TESMER konu özeti - Serbest Cumhuriyet Fırkası kapanışı","yanilgi":"Fesih ile kapatma arasındaki farkı önemsiz sanıp bu şıkkı da yanlış zannedebilirsin."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 18"},"kural":"Temsil Heyeti\u0027nin İstanbul Hükümeti tarafından resmen tanınması, Amasya Genelgesi (22 Haziran 1919) ile değil, Bahriye Nazırı Salih Paşa\u0027nın katıldığı Amasya Görüşmeleri (20-22 Ekim 1919) ile gerçekleşmiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 18","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Amasya geçen sorularda önce \u0027Genelge mi Görüşme mi\u0027 ayrımını yap, tarihe bakmadan cevap verme.","konu":"temsil heyeti","tablo":{"satirlar":[["A) Erzurum Kongresi\u0027nde dokuz kişilik bir kurul olarak seçi…","Erzurum Kongresi (23 Temmuz-7 Ağustos 1919)","doğru ifade"],["B) Bütün yurdu temsil eder hâle gelmesi Sivas Kongresi\u0027nde …","Sivas Kongresi (4-11 Eylül 1919)","doğru ifade"],["C) İlk yürütme işlemi, Ali Fuat Paşa\u0027nın Batı Anadolu Kuva-…","Temsil Heyeti\u0027nin yürütme işlevi (1919 sonbaharı)","doğru ifade"],["D) İstanbul Hükümeti tarafından resmen tanınması Amasya Gen…","Amasya Görüşmeleri (20-22 Ekim 1919)","YANLIŞ ifade"],["E) Görevini, TBMM\u0027nin açılmasıyla meclise devrederek sona e…","TBMM\u0027nin açılışı (23 Nisan 1920)","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İlk yürütme işlemi, Ali Fuat Paşa\u0027nın Batı Anadolu Kuva-yı Milliye Komutanlığına atanmasıdır.","E":"Görevini, TBMM\u0027nin açılmasıyla meclise devrederek sona erdirmiştir.","A":"Erzurum Kongresi\u0027nde dokuz kişilik bir kurul olarak seçilmiştir.","D":"İstanbul Hükümeti tarafından resmen tanınması Amasya Genelgesi ile gerçekleşmiştir.","B":"Bütün yurdu temsil eder hâle gelmesi Sivas Kongresi\u0027nde olmuştur."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - temsil heyeti","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: TEMSİL HEYETİ, ERZURUM KONGRESİ\u0027nde (23 Temmuz – 7 Ağustos 1919) kongre adına çalışacak dokuz kişilik bir kurul olarak seçildi; başkanı MUSTAFA KEMAL\u0027dir. Bu aşamada yalnız Doğu Anadolu\u0027yu temsil ediyordu. SİVAS KONGRESİ\u0027nde (4–11 Eylül 1919) heyet on altı üyeye çıkarıldı ve BÜTÜN YURDU temsil eder hâle getirildi; dağınık Müdafaa-i Hukuk cemiyetleri Anadolu ve Rumeli Müdafaa-i Hukuk Cemiyeti çatısında birleştirildi, heyet bu cemiyetin yürütme organı oldu. YÜRÜTME İŞLEVİ: Heyet, hükümet gibi davrandı: Ali Fuat Paşa\u0027yı Batı Anadolu Kuva-yı Milliye Komutanlığına atadı (ilk yürütme işlemi); Damat Ferit Paşa hükümetiyle haberleşmeyi kestirip Anadolu\u0027da hükümetin emirlerinin uygulanmasını durdurdu; Damat Ferit düştü, Ali Rıza Paşa hükümeti kuruldu (2 Ekim 1919). AMASYA GÖRÜŞMELERİ (20–22 Ekim 1919): İstanbul Hükümeti temsilcisi Bahriye Nazırı Salih Paşa ile Temsil Heyeti görüştü; İstanbul Hükümeti heyeti resmen tanıdı; Mebusan Meclisi\u0027nin toplanması ve seçimlerin yapılması kararlaştırıldı. Heyet 27 ARALIK 1919\u0027da ANKARA\u0027ya geldi ve burayı merkez yaptı. SONA ERİŞİ: TBMM\u0027nin 23 Nisan 1920\u0027de açılmasıyla Temsil Heyeti görevini meclise devrederek sona erdi. SINAV TUZAĞI: (1) Heyet Erzurum\u0027da 9, Sivas\u0027ta 16 kişidir; bütün yurdu temsil etmesi Sivas\u0027tadır. (2) Amasya GÖRÜŞMELERİ (Ekim 1919, Salih Paşa) ile Amasya GENELGESİ (22 Haziran 1919) farklıdır. (3) Heyetin ilk yürütme işlemi Ali Fuat Paşa\u0027nın atanmasıdır. SINAVDA NASIL SORULUR: \u0027Temsil Heyeti\u0027nin bütün yurdu temsil eder hâle gelmesi hangi kongrede olmuştur?\u0027 ya da \u0027Te…"}],"hakem":"Soru, Temsil Heyeti konusunu doğru ölçüyor; dogru sik (D) yanlış bir ifade sunuyor ve kaynakta net olarak Amasya Görüşmeleri ile Amasya Genelgesi\u0027nin farklı olaylar olduğu belirtiliyor."},"kayitlar":[],"sade":{"siklar":{"C":"Heyetin ilk yürütme işlemi Ali Fuat Paşa\u0027nın Batı Anadolu Kuva-yı Milliye Komutanlığına atanmasıdır; bu doğrudur.","E":"Temsil Heyeti TBMM\u0027nin 23 Nisan 1920\u0027de açılmasıyla görevini meclise devretmiştir; bu doğrudur.","A":"Erzurum Kongresi\u0027nde Temsil Heyeti dokuz kişilik kurul olarak seçilmiş, başkanı Mustafa Kemal olmuştur; bu doğrudur.","B":"Heyet Sivas Kongresi\u0027nde on altı üyeye çıkarılıp bütün yurdu temsil eder hâle getirilmiştir; bu doğrudur."},"dogru":"Amasya Genelgesi (22 Haziran 1919) İstanbul Hükümeti\u0027nin tek taraflı bildirisidir, tanıma içermez. Tanıma, Bahriye Nazırı Salih Paşa\u0027nın katıldığı Amasya Görüşmeleri\u0027nde (20–22 Ekim 1919) gerçekleşmiştir.","sinav":"İstanbul Hükümeti\u0027nin Temsil Heyeti\u0027ni resmen tanıması Amasya Görüşmeleri ile olmuştur, Amasya Genelgesi ile değil.","kavramlar":[{"kaynak":"TEORI","tanim":"Erzurum Kongresi\u0027nde seçilen ve sonra Sivas Kongresi\u0027nde genişletilen, bütün yurdu temsil eden ve hükümet gibi davranan yürütme organıdır.","ad":"Temsil Heyeti"},{"kaynak":"TEORI","tanim":"İstanbul Hükümeti temsilcisi Salih Paşa ile Temsil Heyeti arasında 20–22 Ekim 1919\u0027da yapılan görüşmedir; İstanbul Hükümeti heyeti resmen tanımıştır.","ad":"Amasya Görüşmeleri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"Temsil Heyeti\u0027nin toplanma, çalışma aşamaları ve tarihsel süreci ile ilgili aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-14","verilenler":[],"dayanak":"Atatürk İlkeleri ve İnkılap Tarihi - Temsil Heyeti / Amasya Görüşmeleri (20-22 Ekim 1919) ve Sivas Kongresi kararları","dogru":"D","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Bir başka öğrenci, ders çalışırken Amasya Genelgesi (22 Haziran 1919) ile Amasya Görüşmeleri\u0027ni (20-22 Ekim 1919) aynı olay zannedip not defterine \u0027Amasya\u0027da tanındı\u0027 yazmış.","anlatim":"Bu tek satır not, aslında dört ay arayla olan iki farklı olayı birbirine karıştırıyor. Bugün bu karışıklığın nereden çıktığını, Temsil Heyeti\u0027nin tüm süreciyle birlikte çözeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Heyet Erzurum\u0027da 9 kişi, Sivas\u0027ta 16 kişi olmuş; ilk icraatı Ali Fuat Paşa\u0027yı atamak; İstanbul Hükümeti\u0027nin tanıması Ekim 1919\u0027daki görüşmede olmuş; görevi 23 Nisan 1920\u0027de TBMM\u0027ye devretmiş.","anlatim":"Bu tarihler ve rakamlar sorunun beş ifadesinin de doğruluğunu belirliyor. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Erzurum Kongresi (23 Temmuz-7 Ağustos 1919)","karar":"doğru","anlatim":"Erzurum Kongresi\u0027nde heyet gerçekten dokuz kişi olarak seçilmiş, başkanı Mustafa Kemal\u0027miş. Bu aşamada henüz sadece Doğu Anadolu\u0027yu temsil ediyormuş.","formul":"Şık A: not defterindeki öğrenci \u0027Erzurum\u0027da dokuz kişilik kurul seçildi\u0027 diyor, bu doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Sivas Kongresi (4-11 Eylül 1919)","karar":"doğru","anlatim":"Sivas Kongresi\u0027nde üye sayısı on altıya çıkmış ve dağınık cemiyetler tek çatıda birleşmiş. Bu yüzden bütün yurdu temsil etme Sivas\u0027ta gerçekleşmiş.","formul":"Şık B: \u0027bütün yurdu temsil etmesi Sivas\u0027ta oldu\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Temsil Heyeti\u0027nin yürütme işlevi (1919 sonbaharı)","karar":"doğru","anlatim":"Heyet hükümet gibi davranmaya başladığında ilk iş olarak Ali Fuat Paşa\u0027yı Batı Anadolu Kuva-yı Milliye Komutanlığına atamış. Bu kronolojik olarak ilk icraat kabul edilir.","formul":"Şık C: \u0027ilk yürütme işlemi Ali Fuat Paşa\u0027nın atanması\u0027 diyor, sen ne dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Amasya Görüşmeleri (20-22 Ekim 1919)","karar":"yanlış","anlatim":"Amasya Genelgesi tek taraflı bir bildiridir, karşılıklı görüşme değildir. Tanınma, Salih Paşa\u0027yla yapılan Amasya Görüşmeleri\u0027nde, dört ay sonra gerçekleşmiştir.","formul":"Şık D: not defterindeki öğrenci \u0027resmî tanınma Amasya Genelgesi ile oldu\u0027 diyor, sence bu doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBMM\u0027nin açılışı (23 Nisan 1920)","karar":"doğru","anlatim":"23 Nisan 1920\u0027de meclis açıldığında heyet görevini devretmiş ve kendiliğinden sona ermiş. Bu tarih heyetin bittiği net noktadır.","formul":"Şık E: \u0027görevi TBMM\u0027nin açılmasıyla sona erdi\u0027 diyor, buna katılır mısın?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Tek yanlış olan D, çünkü Genelge tek taraflı bildiridir, tanınma ise karşılıklı görüşmeyle gelir. Kendine hep şunu sor: bu olayda iki taraf karşılıklı mı konuştu, yoksa biri tek başına mı bildiri yayınladı?","doldur":[]}],"anahtar":[{"ornek":"amasya","kok":"amasya"},{"ornek":"temsil","kok":"temsil"},{"ornek":"görüşmeleri","kok":"görüşm"},{"ornek":"gerçekleşmiştir","kok":"gerçek"},{"ornek":"heyeti","kok":"heyeti"},{"ornek":"genelgesi","kok":"genelg"}],"konuGiris":{"harita":"Ne zaman test edilir: Erzurum\u0027dan Sivas\u0027a, Amasya Görüşmelerine ve Ankara\u0027ya gelişe kadar olan aşama sırası sorulduğunda test edilir. Nasıl ölçülür: hangi kongrede kaç kişi olduğu ve neyi temsil ettiği doğru eşleştirilerek ölçülür. Nasıl kaydedilir: tarihler ve kongre-üye sayısı-yetki genişlemesi zincirinin doğru sıralanmasıyla kaydedilir.","desen":"Sınav en çok Erzurum\u0027daki 9 kişi ile Sivas\u0027taki 16 kişiyi ve \u0027bütün yurdu temsil etme\u0027nin hangi kongrede gerçekleştiğini karıştırtır. Ayrıca Amasya Görüşmeleri ile Amasya Genelgesi\u0027ni birbirine karıştıran seçenekler koyulur. Bu soru Erzurum-Sivas üye sayısı ve Amasya Görüşmeleri/Genelgesi ayrımı noktasından geliyor (p.arşiv 1 dönem).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"dokuz kişilik, yalnız Doğu Anadolu\u0027yu temsil eden ilk heyet","ad":"Erzurum Kongresi kurulu","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"on altı kişiye çıkarılan, bütün yurdu temsil eden heyet","ad":"Sivas Kongresi kurulu","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"İstanbul Hükümeti\u0027nin heyeti resmen tanıdığı görüşme, Ekim 1919","ad":"Amasya Görüşmeleri","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"TBMM açılışıyla heyetin yetkisini meclise bırakması","ad":"görev devri","kim":"kanun sabitler"}],"sinavda":"Soru, Temsil Heyeti\u0027nin kuruluşundan TBMM\u0027ye devrine kadar olan aşamaları verir ve bunlardan hangisinin yanlış anlatıldığını sorar.","panel_ornek":"Bir apartman yönetimi önce 9 kişilik geçici bir komisyon kurar, sonra bina sayısı artınca bu komisyon 16 kişiye çıkar ve tüm siteyi temsil eder hale gelir. Sonunda site genel kurulu toplanınca komisyon görevi genel kurula devreder ve dağılır.","ornek":"Bir apartman yönetimi önce 9 kişilik geçici bir komisyon kurar, sonra bina sayısı artınca bu komisyon 16 kişiye çıkar ve tüm siteyi temsil eder hale gelir. Sonunda site genel kurulu toplanınca komisyon görevi genel kurula devreder ve dağılır.","yontemler":"Kritik kural: üye sayısı ve temsil kapsamı Erzurum\u0027dan Sivas\u0027a geçişte değişir, bunu ezberden ayırt et.","nedir":"Temsil Heyeti, Erzurum ve Sivas kongreleriyle kurulup TBMM açılana kadar milli mücadeleyi yöneten geçici yürütme kuruludur. Sınav bu heyetin kuruluş, büyüme ve görev devri aşamalarının sırasını ve tarihlerini doğru bilip bilmediğini ölçer."},"olay":"Amasya Genelgesi tek taraflı bir bildiridir, tanıma unsuru içermez; tanıma ancak karşılıklı görüşme olan Amasya Görüşmeleri\u0027nde yer alır.","tuzak":{"C":{"ad":"Yürütme İşlemi Karıştırma Tuzağı","metin":"heyetin ilk icraatını Damat Ferit hükümetiyle haberleşmeyi kesme sanabilirsin. Doğrusu: heyetin ilk yürütme işlemi, Ali Fuat Paşa\u0027yı Batı Anadolu Kuva-yı Milliye Komutanlığına atamasıdır; bu ifade doğrudur."},"E":{"ad":"Sona Eriş Zamanlaması Tuzağı","metin":"heyetin görevinin Sivas Kongresi\u0027nin bitişiyle ya da Ankara\u0027ya gelişiyle sona erdiğini düşünebilirsin. Doğrusu: Temsil Heyeti görevini TBMM\u0027nin 23 Nisan 1920\u0027de açılmasıyla meclise devretmiştir; bu ifade doğrudur."},"A":{"ad":"Ne soruluyor","metin":"verilen ifadelerden hangisinin yanlış olduğu soruluyor. Kural: Temsil Heyeti, Erzurum Kongresi\u0027nde kongre adına çalışacak dokuz kişilik bir kurul olarak seçilmiş, başkanlığına Mustafa Kemal getirilmiştir. Doğrusu: bu ifade kaynakla birebir örtüştüğü için doğrudur, yanlış şık değildir."},"B":{"ad":"Sayı Karıştırma Tuzağı","metin":"Erzurum\u0027daki dokuz kişilik heyeti bütün yurdu temsil eden heyetle aynı sanabilirsin. Doğrusu: heyet on altı üyeye çıkarılıp bütün yurdu temsil eder hâle gelmesi Sivas Kongresi\u0027nde gerçekleşmiştir; bu ifade doğrudur."}},"celdiriciYol":null,"hap":"Temsil Heyeti Erzurum\u0027da 9 kişiyle bölgesel, Sivas\u0027ta 16 kişiyle ulusal hâle geldi; İstanbul Hükümeti\u0027nin tanıması Amasya Genelgesi\u0027nde değil Amasya Görüşmeleri\u0027ndedir.","teshis":{"C":{"gercek":"Heyetin ilk yürütme işlemi Ali Fuat Paşa\u0027nın Batı Anadolu Kuva-yı Milliye Komutanlığına atanmasıdır.","ayirt":"Heyetin kronolojik olarak yaptığı ilk resmî atama hangisiydi?","paragraf":"Temsil Heyeti\u0027nin yürütme işlevi (1919 sonbaharı)","yanilgi":"Bu şıkkı yanlış sanan öğrenci, hükümetle haberleşmenin kesilmesini ilk icraat sanıyordur."},"E":{"gercek":"Temsil Heyeti, TBMM\u0027nin 23 Nisan 1920\u0027de açılmasıyla görevini meclise devrederek sona ermiştir.","ayirt":"Heyetin görevi hangi kurumun açılışıyla resmen bitmiştir?","paragraf":"TBMM\u0027nin açılışı (23 Nisan 1920)","yanilgi":"Bu şıkkı yanlış sanan öğrenci, heyetin görevinin Ankara\u0027ya gelişle sona erdiğini düşünüyordur."},"A":{"gercek":"Erzurum Kongresi\u0027nde seçilen Temsil Heyeti dokuz üyelidir ve başkanı Mustafa Kemal\u0027dir.","ayirt":"Erzurum\u0027da mı Sivas\u0027ta mı olduğumu, üye sayısına bakarak ayırt ediyor muyum?","paragraf":"Erzurum Kongresi kararları (23 Temmuz - 7 Ağustos 1919)","yanilgi":"Bu şıkkı yanlış sanan öğrenci, dokuz kişilik sayının Sivas\u0027a ait olduğunu düşünüyordur."},"D":{"gercek":"Amasya Genelgesi (22 Haziran 1919) tek taraflı bir bildiridir; İstanbul Hükümeti\u0027nin heyeti resmen tanıması ise Salih Paşa ile yapılan Amasya Görüşmeleri\u0027nde (20-22 Ekim 1919) gerçekleşmiştir.","ayirt":"Bu olayda iki taraf karşılıklı görüşmüş mü, yoksa tek taraflı bir bildiri mi yayınlanmış?","paragraf":"Amasya Görüşmeleri (20-22 Ekim 1919)","yanilgi":"Bu şıkkı seçen öğrenci, Amasya Genelgesi ile Amasya Görüşmeleri\u0027nin aynı olay olduğunu sanıyordur."},"B":{"gercek":"Heyet, Sivas Kongresi\u0027nde on altı üyeye çıkarılarak bütün yurdu temsil eder hâle gelmiştir.","ayirt":"Heyetin bölgesel mi ulusal mı olduğunu hangi kongrede kazandığını biliyor muyum?","paragraf":"Sivas Kongresi kararları (4-11 Eylül 1919)","yanilgi":"Bu şıkkı yanlış sanan öğrenci, bütün yurdu temsil etme yetkisinin Erzurum\u0027da kazanıldığını düşünüyordur."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 16"},"kural":"Mondros Mütarekesi 1918\u0027de Reşat\u0027ın ölümünden sonra tahta geçen VI. Mehmet Vahdettin döneminde imzalanmıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 16","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Padişah dönemi sorularında önce olayın tarihini, sonra o tarihte hangi padişahın tahtta olduğunu tek tek kontrol et.","konu":"v. mehmet reşat dönemi","tablo":{"satirlar":[["A) Bâb-ı Âli Baskını","Balkan Savaşları kronolojisi","doğru ifade"],["B) Uşi Antlaşması\u0027nın imzalanması","Trablusgarp Savaşı sonu","doğru ifade"],["C) Mondros Mütarekesi\u0027nin imzalanması","V. Mehmet Reşat dönemi sonu / VI. Mehmet Vahdettin dönemi başı","YANLIŞ ifade"],["D) Çanakkale Zaferi","I. Dünya Savaşı - Çanakkale Cephesi","doğru ifade"],["E) Londra Antlaşması\u0027nın imzalanması","I. Balkan Savaşı sonu","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Mondros Mütarekesi\u0027nin imzalanması","E":"Londra Antlaşması\u0027nın imzalanması","A":"Bâb-ı Âli Baskını","D":"Çanakkale Zaferi","B":"Uşi Antlaşması\u0027nın imzalanması"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - v. mehmet resat donemi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: V. MEHMET REŞAT, 31 Mart Olayı\u0027nın (13 Nisan 1909) bastırılmasından sonra II. Abdülhamit\u0027in tahttan indirilmesiyle 27 Nisan 1909\u0027da padişah oldu; 3 Temmuz 1918\u0027de ölümüne kadar hüküm sürdü. Dönemi boyunca gerçek iktidar İTTİHAT VE TERAKKİ\u0027nin elindeydi; padişah anayasal ürdüğü dönemde olmuştur.","B":"Uşi Antlaşması 1912\u0027de Trablusgarp Savaşı sonunda imzalanmıştır; Reşat\u0027ın saltanatı döneminde yaşanan bu olayda Trablusgarp İtalya\u0027ya bırakılmıştır."},"dogru":"Mondros Mütarekesi 1918 yılı sonlarında imzalanmıştır, ancak V. Mehmet Reşat 3 Temmuz 1918\u0027de ölmüştür. Mütareke onun ölümünden sonra, yerine geçen VI. Mehmet Vahdettin döneminde gerçekleşmiştir.","sinav":"Mondros Mütarekesi V. Mehmet Reşat\u0027ın ölümünün ardından VI. Mehmet Vahdettin döneminde imzalanmıştır.","kavramlar":[{"kaynak":"TEORI","tanim":"1908\u0027de ilan edilen anayasal düzen; V. Mehmet Reşat bu dönemin padişahı olup anayasal ve sembolik konumda kalmıştır, gerçek iktidar İttihat ve Terakki\u0027nin elinde bulunmuştur.","ad":"II. Meşrutiyet"},{"kaynak":"TEORI","tanim":"1912–1913 yıllarında Osmanlı Devleti\u0027nin Balkan topraklarını kaybettiği çatışmalar; bu dönemde Londra ve İstanbul antlaşmaları imzalanmıştır.","ad":"Balkan Savaşları"},{"kaynak":"TEORI","tanim":"1918 yılı sonlarında Osmanlı Devleti\u0027nin I. Dünya Savaşı\u0027nda ateşkesi kabul etmesidir; V. Mehmet Reşat\u0027ın ölümünden sonra VI. Mehmet Vahdettin tarafından imzalanmıştır.","ad":"Mondros Mütarekesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi V. Mehmet Reşat döneminde yaşanmamıştır?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-15","verilenler":[],"dayanak":"İnkılap Tarihi - V. Mehmet Reşat dönemi kronolojisi (1909-1918)","dogru":"C","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Başka bir şirket düşün, 1912\u0027de İtalya bir işletmenin tesisine el koyuyor, işletme sahibi buna karşı savaşamıyor ve tesisi terk ediyor.","anlatim":"Bu olay Trablusgarp Savaşı, tesis de Trablusgarp toprağı. Aynı yıllarda Balkan\u0027da başka topraklar da elden çıkıyor. Bütün bu kayıpların hangi \u0027yönetici döneminde\u0027 olduğunu bulacağız.","doldur":[]},{"formul":"Ne yapacağız: V. Mehmet Reşat 27 Nisan 1909\u0027da başlayıp 3 Temmuz 1918\u0027de biten dönemde hangi olaylar oldu, bunu beş ifadeyle tek tek deneyeceğiz.","anlatim":"Her ifadenin tarihine bakıp bu aralığa girip girmediğine karar vereceğiz. Girmeyeni bulmak sorunun cevabı olacak.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Balkan Savaşları kronolojisi","karar":"doğru","anlatim":"Baskın 23 Ocak 1913, Reşat\u0027ın padişahlığı sürüyor. İttihatçılar bu tarihte hükümete el koydu.","formul":"Şık A: müdür \u0027Bâb-ı Âli Baskını Reşat zamanında oldu\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Trablusgarp Savaşı sonu","karar":"doğru","anlatim":"1912\u0027de Trablusgarp Savaşı Uşi Antlaşması ile bitti. Bu tarih Reşat\u0027ın dönemi içinde.","formul":"Şık B: müdür \u0027Uşi Antlaşması da Reşat döneminde imzalandı\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"V. Mehmet Reşat dönemi sonu / VI. Mehmet Vahdettin dönemi başı","karar":"yanlış","anlatim":"Reşat 3 Temmuz 1918\u0027de öldü, mütareke ise savaşın sonunda imzalandı. O tarihte tahtta Vahdettin var.","formul":"Şık C: müdür \u0027Mondros Mütarekesi\u0027ni de Reşat imzaladı\u0027 diyor, sen ne dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"I. Dünya Savaşı - Çanakkale Cephesi","karar":"doğru","anlatim":"Zafer 1915\u0027te, savaş sürerken kazanıldı. Reşat o tarihte hâlâ padişah.","formul":"Şık D: müdür \u0027Çanakkale Zaferi de Reşat zamanında\u0027 diyor, kabul eder misin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"I. Balkan Savaşı sonu","karar":"doğru","anlatim":"Antlaşma 1913\u0027te I. Balkan Savaşı sonunda imzalandı. Bu tarih de Reşat\u0027ın dönemi içinde.","formul":"Şık E: müdür \u0027Londra Antlaşması da Reşat döneminde\u0027 diyor, sence doğru mu?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Tek yanlış C, çünkü mütarekeyi Reşat değil Vahdettin imzaladı. Kendine sor: bu olay 1918 yazından önce mi sonra mı?","doldur":[]}],"anahtar":[{"ornek":"savaşı","kok":"savaşı"},{"ornek":"mütarekesi","kok":"mütare"},{"ornek":"vahdettin","kok":"vahdet"},{"ornek":"imzalanmıştır","kok":"imzala"},{"ornek":"dönemine","kok":"dönemi"},{"ornek":"tarihte","kok":"tariht"}],"konuGiris":{"harita":"Ne zaman test edilir: Reşat\u0027ın padişahlık yılları (1909-1918) ile sınırlı olaylar sorulduğunda test edilir. Nasıl ölçülür: Şıklardaki olayların tarihi bu aralığa girip girmediği kontrol edilerek ölçülür. Nasıl kaydedilir: Cevap, bu aralığın dışında kalan tek olayın seçilmesiyle kaydedilir.","desen":"Sınav genellikle Reşat dönemine ait 4 gerçek olayı sıralayıp 5. şıkka başka padişahın dönemine ait bir olayı (Meşrutiyet ilanı veya Mondros gibi) sıkıştırır. Tuzak, tarihleri karıştırıp yakın döneme ait olayı Reşat\u0027a mal etmektir. Bu soru p.28 kaynağındaki \u0027sınav tuzağı\u0027 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Anayasal düzenin ilanı; Reşat döneminden önce, Abdülhamit zamanında ilan edildi.","ad":"II. Meşrutiyet","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İtalya\u0027nın Trablusgarp\u0027ı alması, Uşi Antlaşması\u0027yla sonuçlanan savaş.","ad":"Trablusgarp Savaşı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Osmanlı\u0027nın Balkan topraklarını büyük ölçüde kaybettiği iki savaş dönemi.","ad":"Balkan Savaşları","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"I. Dünya Savaşı sonunda imzalanan ateşkes; Reşat\u0027ın ölümünden sonra, Vahdettin döneminde imzalandı.","ad":"Mondros Ateşkesi","kim":"kanun sabitler"}],"sinavda":"Şıklarda beş olay verilir, öğrenciden bunlardan Reşat döneminde yaşanmayanı bulması istenir.","panel_ornek":"Bir arkadaşın 5 farklı kiralık evi gezip birini seçiyor; ama sonradan \u0027bu evde asansör yoktu\u0027 diye çıkan biri, aslında hiç gezmediği 6. evle ilgiliydi. Yani listedeki 5 şeyi doğrulamak, listede olmayan 6.\u0 "YANLIŞ ifade"],["B) Milliyetçilik ilkesi","Yabancı Okullar Sorunu - genel konu anlatımı","YANLIŞ ifade"],["C) İnkılapçılık ilkesi","3 Mart 1924 Tevhid-i Tedrisat Kanunu","YANLIŞ ifade"],["D) Bağımsızlık ilkesi","Yabancı Okullar Sorunu - Türkiye\u0027nin tutumu (1926-1928)","doğru ifade"],["E) Halkçılık ilkesi","Yabancı Okullar Sorunu - genel konu anlatımı","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İnkılapçılık ilkesi","E":"Halkçılık ilkesi","A":"Laiklik ilkesi","D":"Bağımsızlık ilkesi","B":"Milliyetçilik ilkesi"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - yabanci okullar sorunu","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Osmanlı döneminde kapitülasyonların koruması altında açılan yabancı okullar (Fransız, Amerikan, İtalyan, Alman) kendi ülkelerinin programını uyguluyor ve Osmanlı denetimi dışında kalıyordu. LOZAN BARIŞ ANTLAŞMASI (1923) ile yabancı okulların Türk kanunlarına ve Türk okullarına uygulanan hükümlere tabi olması kabul edildi; yeni yabancı okul açılmayacaktı. 3 MART 1924 TEVHİD-İ TEDRİSAT KANUNU (Öğretimin Birleştirilmesi) ile ülkedeki bütün okullar Maarif Vekâleti\u0027ne (Millî Eğitim Bakanlığı) bağlandı; yabancı okullar da bu kapsamda denetime girdi. SORUNUN DOĞUŞU: Türkiye, yabancı okullarda TÜRKÇE, TARİH ve COĞRAFYA derslerinin TÜRK ÖĞRETMENLER tarafından TÜRKÇE okutulmasını, Türk müfettişlerin denetimini ve sınıflardan dinî sembollerin (haç, tasvir) kaldırılmasını istedi. Fransa ve Papalık bu düzenlemelere itiraz etti, konuyu diplomatik alana taşımak istedi. TÜRKİYE\u0027NİN TUTUMU: Türkiye sorunu İÇ MESELE saydı, hiçbir devletle bu konuda görüşme yapmadı; kurallara uymayan okullar kapatıldı; uyan okullar Türk denetiminde varlığını sürdürdü. Sorun 1926–1928 yılları arasında Türkiye\u0027nin kararlılığıyla çözüldü. ANLAMI: Eğitimde egemenlik ve millîlik ilkesi; kapitülasyon zihniyetinin eğitim alanında da bitirilmesi; laik eğitimin yabancı okullara da uygulanması. SINAV TUZAĞI: (1) Türkiye yabancı okulları tümden kapatmadı; Türk kanunlarına uymayanları kapattı. (2) Sorunu uluslararası görüşmeyle değil İÇ MESELE olarak çözdü; bu, bağımsızlık ilkesinin dış politikadaki yansımasıdır. (3) Hukuki dayanak Lozan ve Tevhid-i Tedrisat\u0027…"}],"hakem":"Soru, Atatürk İlkeleri ve İnkılap Tarihi dersinin resmi kapsamındaki yabancı okullar sorununu, dönem hukuki belgeleri (Lozan 1923, Tevhid-i Tedrisat 1924) temelinde ölçmektedir; Türkiye\u0027nin sorunu iç mesele saydığı ve dış müdahaleye kapalı karar aldığı tutumu bağımsızlık ilkesinin dış politikadaki yansımasıdır."},"kayitlar":[],"sade":{"siklar":{"C":"Tevhid-i Tedrisat Kanunu ile yeni bir eğitim düzenlemesi yapılması inkılapçı karakteri çağrıştırır. Fakat kanun sadece araçtır; sorulan, sorunun dış devletlerle görüşülmeden bağımsız çözülmesidir.","E":"Eğitimin bütün okullar için ortak kurallarla uygulanması halkçılık ilkesini hatırlatabilir. Gerçek ise dış devletlerin müdahalesine izin vermeyip bağımsız hareket etme ilkesidir.","A":"Dinî sembollerin (haç, tasvir) sınıflardan kaldırılması talebi laik eğitim düzenlemesini anımsatır. Ancak soruda sorulan, bu talep değil; Türkiye\u0027nin sorunu dış görüşmesiz iç mesele sayarak bağımsız çözmesi yöntemidir.","B":"Türkçe, tarih ve coğrafya derslerinin Türk öğretmenler tarafından okutulması millî eğitim içeriğini gösterir. Doğru olan ise sorunun çözüm yöntemidir: Türkiye hiçbir devletle görüşmeden bağımsız karar aldı."},"dogru":"Türkiye yabancı okullar sorununu kendi iç mesele olarak kabul etti, başka ülkelerle görüşme yapmadan Türk kanunlarına uymayan okulları kapatarak bağımsız şekilde çözdü. Bu tutum, dış müdahaleye karşı kapalı olup kendi kararlarını bağımsız biçimde uygulama ilkesinin dış politikadaki yansımasıdır.","sinav":"Türkiye\u0027nin yabancı okullar sorununu hiçbir devletle görüşmeden, Lozan Barış Antlaşması (1923) ve 3 Mart 1924 Tevhid-i Tedrisat Kanunu çerçevesinde kurallara aykırı davranan okulları kapatarak çözmesi, bağımsızlık ilkesinin dış politikadaki yansımasıdır.","kavramlar":[{"kaynak":"TEORİ","tanim":"Devletin, uluslararası hukuk ve antlaşmalara uygun olarak kendi ülkesi içindeki konuları başka devletlerle görüşmeden çözmesi hakkıdır.","ad":"iç mesele"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"Türkiye\u0027nin yabancı okullar sorununu hiçbir devletle görüşmeye açmadan, Türk kanunlarına aykırı davranan okulları kapatarak çözmesi, aşağıdaki ilkelerden hangisinin bir yansımasıdır?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-cokzor/kp-16","verilenler":[],"dayanak":"Atatürk İlkeleri ve İnkılap Tarihi müfredatı - Yabancı Okullar Sorunu (Lozan Barış Antlaşması 1923; 3 Mart 1924 Tevhid-i Tedrisat Kanunu)","dogru":"D","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1926 yılında İzmir\u0027de bir Fransız okulu, sınıflardan haç kaldırma emrine uymuyor; Fransa bu konuda görüşme talep ediyor ama Türkiye masaya oturmuyor, okulu doğrudan kapatıyor.","anlatim":"Bu tek olayı zihninde canlandır: emir var, uymayan okul var, kapatma var, görüşme yok. Bütün ders bu sahnede geçecek.","doldur":[]},{"formul":"Ne yapacağız: Türkiye bu sorunu iç mesele sayıp hiçbir devletle görüşmeden, kurallara uymayan okulu kapatarak çözdü; bu tavrın hangi ilkeyi yansıttığını arıyoruz.","anlatim":"Kural tek: dış müdahaleye kapalı, kendi başına karar alma bağımsızlık ilkesidir. Şimdi beş ifadeyi bu İzmir olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Yabancı Okullar Sorunu - genel konu anlatımı","karar":"yanlış","anlatim":"Haç kaldırma emri olayın içeriğidir, soruda sorulan ise Fransa\u0027yla görüşmeden karar alınmasıdır. Laiklik burada yan bir ayrıntı, ana soru değil.","formul":"Şık A: birisi \u0027haç kaldırma emri dinî sembolle ilgili, demek ki laiklik ilkesi bu\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Yabancı Okullar Sorunu - genel konu anlatımı","karar":"yanlış","anlatim":"Türkçe ders talebi de sorunun içeriğine ait bir ayrıntıdır, çözüm yöntemi değildir. Sorulan şey Fransa\u0027yla görüşülmemesi, bunun adı milliyetçilik değil.","formul":"Şık B: birisi \u0027Türkçe ders isteniyor, bu milliyetçilik ilkesi\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"3 Mart 1924 Tevhid-i Tedrisat Kanunu","karar":"yanlış","anlatim":"Tevhid-i Tedrisat kanunu uygulama zeminidir, ama İzmir\u0027deki okulun kapatılma kararının Fransa\u0027ya danışılmadan alınması ayrı bir şeydir. Soru kararın alınış biçimini soruyor.","formul":"Şık C: birisi \u0027Tevhid-i Tedrisat Kanunu yeni bir düzenleme getirdi, demek inkılapçılık ilkesi\u0027 diyor, katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Yabancı Okullar Sorunu - Türkiye\u0027nin tutumu (1926-1928)","karar":"doğru","anlatim":"Evet, tam olarak bu. Türkiye sorunu iç mesele sayıp hiçbir devletle görüşmeden okulu kapattı, dış müdahaleye kapalı bu tutum bağımsızlık ilkesinin dış politikadaki yansımasıdır.","formul":"Şık D: müdür sana \u0027Fransa görüşme istiyor ama biz oturmayalım, kendi kararımızı uygulayalım\u0027 diyor, bu bağımsızlık ilkesi mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Yabancı Okullar Sorunu - genel konu anlatımı","karar":"yanlış","anlatim":"Halkçılık sınıf ayrımı gözetmemekle ilgilidir, İzmir\u0027deki olayda sınıf ayrımı yok. Olayda vurgulanan şey dış devletle görüşülmeden karar alınmasıdır.","formul":"Şık E: birisi \u0027okul herkese eşit uygulandı, demek halkçılık ilkesi\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"İzmir okulunun kapatılması, Fransa\u0027ya danışılmadan alınan bir karardır, bu yüzden bağımsızlık ilkesi doğru cevaptır. Kendine hep sor: bu karar alınırken başka bir devletin onayı mı arandı, yoksa Türkiye kendi başına mı hareket etti?","doldur":[]}],"anahtar":[{"ornek":"görüşmeden","kok":"görüşm"},{"ornek":"devletle","kok":"devlet"},{"ornek":"bağımsızlık","kok":"bağıms"},{"ornek":"ilkesinin","kok":"ilkesi"},{"ornek":"fransa","kok":"fransa"},{"ornek":"sorununu","kok":"sorunu"}],"konuGiris":{"harita":"Ne zaman test edilir: Bir tarihsel tutumun hangi ilkenin yansıması olduğu sorulduğunda test edilir. Nasıl ölçülür: Olayın \u0027iç mesele sayılıp görüşmeye açılmaması\u0027 unsuru ile ilke arasında bağlantı kurdurularak ölçülür. Nasıl kaydedilir: Doğru ilke seçeneği, olayın dış politika değil egemenlik/bağımsızlık ilkesiyle eşleştirilmesiyle kaydedilir.","desen":"Sınav genelde \u0027hiçbir devletle görüşmeden çözme\u0027 ifadesini verip bunu hangi ilkenin yansıması olduğunu sorar; tuzak, öğrencinin bunu \u0027dış politika başarısı\u0027 sanmasıdır, oysa iç mesele sayma bağımsızlık ilkesinin göstergesidir. Bazı seçenekler laiklik veya milliyetçilik gibi yakın ilkelerle karıştırılır. Bu soru p.28\u0027deki Türkiye\u0027nin tutumu bölümünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Bütün okulları Maarif Vekâleti\u0027ne bağlayan 1924 kanunu.","ad":"Tevhid-i Tedrisat Kanunu","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Yabancı okulları Türk kanunlarına tabi kılan 1923 antlaşması.","ad":"Lozan Barış Antlaşması","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Sorunu başka devletlerle görüşmeden kendi kararıyla çözme tutumu.","ad":"İç mesele sayma","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Eğitim alanında dış müdahaleyi kabul etmeme ilkesi.","ad":"Eğitimde egemenlik ilkesi","kim":"kanun sabitler"}],"sinavda":"Soruda Türkiye\u0027nin yabancı okulları tek taraflı kararla düzenlemesi verilir, bunun hangi ilkenin yansıması olduğu istenir.","panel_ornek":"Bir apartman yöneticisi, bina kurallarına uymayan kiracıyı dışarıdan kimseye danışmadan, sadece kendi yönetim kararıyla evden çıkarır. Kimseyle görüşmeye açmaz, kendi kuralını kendi uygular. Bu, o yöneticinin kendi alanında tam yetkili olduğunu gösterir.","ornek":"Bir apartman yöneticisi, bina kurallarına uymayan kiracıyı dışarıdan kimseye danışmadan, sadece kendi yönetim kararıyla evden çıkarır. Kimseyle görüşmeye açmaz, kendi kuralını kendi uygular. Bu, o yöneticinin kendi alanında tam yetkili olduğunu gösterir.","yontemler":"Olayda \u0027görüşmeye açmama, kendi kararıyla kapatma\u0027 ifadesi varsa bu tam bağımsızlık/iç mesele ilkesine işaret eder.","nedir":"Yabancı okullar sorunu, Türkiye\u0027nin eğitimde egemenliğini nasıl kurduğunu anlatan bir inkılap tarihi konusudur. Sınav burada bir olayın hangi ilkenin (tam bağımsızlık/iç mesele sayma) yansıması olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"İnkılapçılık Tuzağı","metin":"Tevhid-i Tedrisat Kanunu ile yeni bir düzenleme yapıldığı için inkılapçılığı seçersin. Doğrusu: kanun uygulama aracıdır; sorunun hiçbir devletle görüşülmeden çözülmesi bağımsızlık ilkesinin yansımasıdır."},"E":{"ad":"Halkçılık Tuzağı","metin":"Eğitimin bütün vatandaşlara eşit uygulanması gibi bir çağrışımla halkçılığı seçersin. Doğrusu: olayda sınıf ayrımı gözetmeme değil, dış devletlerle görüşmeden bağımsız karar alma vurgulanmaktadır."},"A":{"ad":"Laiklik Tuzağı","metin":"Sınıflardan dinî sembollerin kaldırılması istendiği için soruyu laik eğitim düzenlemesi sanırsın. Doğrusu: burada sorulan, sorunun hangi yöntemle (dış görüşmesiz, iç kararla) çözüldüğüdür; bu bağımsızlık ilkesinin göstergesidir."},"B":{"ad":"Milliyetçilik Tuzağı","metin":"Türkçe, tarih ve coğrafya derslerinin Türk öğretmenlerce okutulması istendiği için milliyetçilik ilkesini işaretlersin. Doğrusu: bu talep sorunun içeriğidir, sorulan ise Türkiye\u0027nin çözüm yöntemidir."}},"celdiriciYol":{},"hap":"Türkiye yabancı okullar sorununu hiçbir devletle görüşmeden, iç mesele sayarak kendi kararıyla çözmüştür; bu bağımsızlık ilkesinin dış politikadaki yansımasıdır.","teshis":{"C":{"gercek":"Tevhid-i Tedrisat Kanunu uygulama zeminidir; sorunun hiçbir devletle görüşülmeden, iç kararla kapatılması bağımsızlık ilkesinin yansımasıdır.","ayirt":"Bu bir yeni düzenleme mi yoksa kararı kimin, nasıl aldığı mı sorusu?","paragraf":"3 Mart 1924 Tevhid-i Tedrisat Kanunu","yanilgi":"Yeni kanun çıkarılmasını görünce her yeniliği inkılapçılık sanıyorsun."},"E":{"gercek":"Halkçılık sınıf ayrımı gözetmemeyle ilgilidir; burada vurgulanan dış devletlerle görüşmeden bağımsız karar alınmasıdır.","ayirt":"Olayda toplumsal sınıf ayrımı mı yoksa dış politika kararı mı anlatılıyor?","paragraf":"Yabancı Okullar Sorunu - genel konu anlatımı","yanilgi":"Eğitim herkese uygulandığı için halkçılık ilkesini çağrıştırıyor sanıyorsun."},"A":{"gercek":"Lozan (1923) ve Tevhid-i Tedrisat Kanunu (1924) yabancı okulları Türk denetimine soktu; sorunun çözüm yöntemi ise hiçbir devletle görüşülmemesidir, bu bağımsızlık ilkesidir.","ayirt":"Soru olayın içeriğini mi yoksa çözüm yöntemini mi soruyor?","paragraf":"Yabancı Okullar Sorunu - genel konu anlatımı","yanilgi":"Dinî sembollerin kaldırılmasını sorunun tamamı sanıp cevabı laiklikte arıyorsun."},"D":{"gercek":"Türkiye sorunu iç mesele sayıp hiçbir devletle görüşme yapmadan çözmüştür; bu, dış müdahaleye kapalı karar almanın, yani bağımsızlık ilkesinin dış politikadaki yansımasıdır.","ayirt":"Karar alma sürecinde başka bir devletin onayı ya da görüşmesi arandı mı?","paragraf":"Yabancı Okullar Sorunu - Türkiye\u0027nin tutumu (1926-1928)","yanilgi":"Bu şıkkı eleyenler olayı içerik detaylarına (dil, din) indirger, çözüm yöntemini gözden kaçırır."},"B":{"gercek":"Bu talep sorunun konusudur; sorulan ise Türkiye\u0027nin sorunu dış görüşmeye açmadan çözmesidir, bu bağımsızlığın göstergesidir.","ayirt":"Bu ifade neyi istemekle mi ilgili, yoksa nasıl çözüldüğüyle mi ilgili?","paragraf":"Yabancı Okullar Sorunu - genel konu anlatımı","yanilgi":"Türkçe derslerin Türk öğretmenlerce okutulması istemini görünce milliyetçiliği işaretliyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 17"},"kural":"Bir devletin kendi ülkesindeki eğitim düzenini dış müdahaleye açmadan belirlemesi tam bağımsızlık ilkesinin dış politikaya yansımasıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 17","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İlke şıklarında olayın hangi ilkeye AİT OLDUĞUNU değil, sorunun ÇÖZÜM BİÇİMİNİN (kiminle görüşüldü/görüşülmedi) hangi ilkeyi gösterdiğini ara.","konu":"yabancı okullar sorunu","tablo":{"satirlar":[["A) Devletçilik ilkesinin","Genel ilke sınıflaması","YANLIŞ ifade"],["B) Laiklik ilkesinin","Yabancı okullar sorunu - iç mesele kararı","YANLIŞ ifade"],["C) Bağımsızlık ilkesinin","Yabancı okullar sorunu - iç mesele kararı","doğru ifade"],["D) Halkçılık ilkesinin","Genel ilke sınıflaması","YANLIŞ ifade"],["E) Milliyetçilik ilkesinin","Yabancı okullar sorunu - iç mesele kararı","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Bağımsızlık ilkesinin","E":"Milliyetçilik ilkesinin","A":"Devletçilik ilkesinin","D":"Halkçılık ilkesinin","B":"Laiklik ilkesinin"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - yabanci okullar sorunu","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Osmanlı döneminde kapitülasyonların koruması altında açılan yabancı okullar (Fransız, Amerikan, İtalyan, Alman) kendi ülkelerinin programını uyguluyor ve Osmanlı denetimi dışında kalıyordu. LOZAN BARIŞ ANTLAŞMASI (1923) ile yabancı okulların Türk kanunlarına ve Türk okullarına uygulanan hükümlere tabi olması kabul edildi; yeni yabancı okul açılmayacaktı. 3 MART 1924 TEVHİD-İ TEDRİSAT KANUNU (Öğretimin Birleştirilmesi) ile ülkedeki bütün okullar Maarif Vekâleti\u0027ne (Millî Eğitim Bakanlığı) bağlandı; yabancı okullar da bu kapsamda denetime girdi. SORUNUN DOĞUŞU: Türkiye, yabancı okullarda TÜRKÇE, TARİH ve COĞRAFYA derslerinin TÜRK ÖĞRETMENLER tarafından TÜRKÇE okutulmasını, Türk müfettişlerin denetimini ve sınıflardan dinî sembollerin (haç, tasvir) kaldırılmasını istedi. Fransa ve Papalık bu düzenlemelere itiraz etti, konuyu diplomatik alana taşımak istedi. TÜRKİYE\u0027NİN TUTUMU: Türkiye sorunu İÇ MESELE saydı, hiçbir devletle bu konuda görüşme yapmadı; kurallara uymayan okullar kapatıldı; uyan okullar Türk denetiminde varlığını sürdürdü. Sorun 1926–1928 yılları arasında Türkiye\u0027nin kararlılığıyla çözüldü. ANLAMI: Eğitimde egemenlik ve millîlik ilkesi; kapitülasyon zihniyetinin eğitim alanında da bitirilmesi; laik eğitimin yabancı okullara da uygulanması. SINAV TUZAĞI: (1) Türkiye yabancı okulları tümden kapatmadı; Türk kanunlarına uymayanları kapattı. (2) Sorunu uluslararası görüşmeyle değil İÇ MESELE olarak çözdü; bu, bağımsızlık ilkesinin dış politikadaki yansımasıdır. (3) Hukuki dayanak Lozan ve Tevhid-i Tedrisat\u0027…"}],"hakem":"Soru, Türkiye\u0027nin yabancı okullar sorununu iç düzenlemeyle ve devletlerle görüşmeden çözmesinin bağımsızlık ilkesinin dış politikaya yansıması olduğunu kaynak metinde açıkça belirtilen kurala dayandırıyor."},"kayitlar":[],"sade":{"siklar":{"D":"Eğitimin tüm öğrencilere eşit uygulanması halkçılıkla ilişkili olsa da, kararın tamamen Türkiye tarafından, başka ülkeler söz söylemeden alınması bağımsızlığı gösterir.","E":"Türkçe, tarih ve coğrafya derslerini Türk öğretmenlerin anlatması milliyetçi bir talep olsa da, sorunu başka devletlerin müdahalesine açmadan çözmek bağımsızlık ilkesinin işaretidir.","A":"Devletçilik ilkesi ekonomik alanlarda devlet müdahalesini anlamına gelir; eğitimi devlet denetimi altına almak başka bir konudur. Sorunun dış devletlerle paylaşılmaması, ekonomik karar değil siyasi bağımsızlıkla ilgilidir.","B":"Sınıflardan haç ve tasvir gibi dinî simgelerin kaldırılması laiklik ilkesine uygun görünse de, soru hiçbir dış devletle görüşülmeden çözüldüğünü vurgular. Belirleyici nokta bağımsız hareket etmektir."},"dogru":"Türkiye, yabancı okulların eğitim düzenini kendi yasalarıyla belirledi ve başka ülkelerle anlaşmaya gitmedi. Bu, ülkenin bu konuda kimseye bağlı olmadığını, bağımsız hareket ettiğini gösterir.","sinav":"Türkiye\u0027nin yabancı okullardaki eğitim sorununu hiçbir devletle görüşmeden, iç düzenleme ile çözmesi Bağımsızlık ilkesinin dış politikaya yansıması olarak değerlendirilir.","kavramlar":[{"kaynak":"TEORI","tanim":"Bir ülkenin kendi topraklarındaki konuları uluslararası görüşme konusu yapmadan, kendi kanunlarıyla düzenleme kararı.","ad":"iç mesele"},{"kaynak":"TEORI","tanim":"1924 yılında çıkarılan ve ülkedeki tüm okulları Millî Eğitim Bakanlığı\u0027nın denetimi altına alan kanun.","ad":"Tevhid-i Tedrisat Kanunu"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"Türkiye, yabancı okullardaki uygulamalara ilişkin sorunu hiçbir devletle görüşme konusu yapmadan, kendi iç düzenlemesiyle çözmüştür. Bu durum, aşağıdaki ilkelerden hangisinin dış politikaya yansıması olarak değerlendirilir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-16","verilenler":[],"dayanak":"Lozan Barış Antlaşması (1923); Öğretimin Birleştirilmesi Kanunu (3 Mart 1924)","dogru":"C","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1926 yılında bir İtalyan lisesinde Türk müfettişler denetim yapmak istiyor, okul müdürü Roma\u0027ya haber gönderip İtalyan hükûmetinden destek istiyor; Türkiye buna rağmen konuyu İtalya ile hiç görüşmüyor, kararı kendi mevzuatıyla uyguluyor.","anlatim":"Bu olayda devletin kararı üçüncü bir devlete danışılmadan alınıyor. Aynı mantık yabancı okullar sorununda da işliyor. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türkiye, İtalyan okulunun ve Fransız-Papalık okullarının denetim itirazını hiçbir devletle görüşme konusu yapmıyor, kendi kanunuyla çözüyor.","anlatim":"Kural şu: bir devlet iç düzenlemesini dış devlete danışmadan uyguluyorsa bu bağımsızlık ilkesinin dış politikaya yansımasıdır. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Genel ilke sınıflaması","karar":"yanlış","anlatim":"Devletçilik iktisadi hayatta devlet öncülüğünü anlatır, İtalyan okulunun ders programı ekonomi değil. Burada mesele dış devlete danışılmaması, bu ayrı bir ilkenin konusu. Katılmıyorsun.","formul":"Şık A: müdür \u0027burada devlet söz sahibi, demek devletçilik ilkesi işliyor\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Yabancı okullar sorunu - iç mesele kararı","karar":"yanlış","anlatim":"Sınıftan haç kaldırılması laiklikle ilgili ama olayın can alıcı noktası bu değil. Olayın özü, Türkiye\u0027nin İtalya\u0027yla görüşme yapmadan kararı uygulaması. Bu yüzden yanlış.","formul":"Şık B: birisi \u0027dinî sembol kaldırılıyor, demek laiklik ilkesi bu olayı açıklıyor\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Yabancı okullar sorunu - iç mesele kararı","karar":"doğru","anlatim":"Aynen öyle, Türkiye kararı tek başına alıp uyguluyor, üçüncü devlete hesap vermiyor. Bu tam bağımsızlık ilkesinin dış politikadaki yansımasıdır. Doğru.","formul":"Şık C: müdür Roma\u0027dan destek istiyor ama Türkiye \u0027bu bizim iç işimiz, İtalya\u0027yla görüşmem\u0027 diyor, bu bağımsızlık ilkesi mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Genel ilke sınıflaması","karar":"yanlış","anlatim":"Halkçılık eşitlik ve sınıfsız toplumu anlatır, burada eşitlik değil dışa kapalı karar alma önemli. İtalyan okulu diğer okullarla eşit tutuluyor olsa da olayın özü bu değil. Yanlış.","formul":"Şık D: birisi \u0027herkese aynı kural uygulanıyor, demek halkçılık ilkesi\u0027 diyor, sen ne dersin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Yabancı okullar sorunu - iç mesele kararı","karar":"yanlış","anlatim":"Türkçe ders talebi milliyetçiliğe uygun ama sorulan şey kararın kiminle paylaşıldığı. Türkiye kararı yalnız kendi alıyor, bu bağımsızlık ilkesi. Yanlış.","formul":"Şık E: birisi \u0027Türkçe ders zorunluluğu var, demek milliyetçilik ilkesi bu olayı açıklıyor\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Olayın özü, Türkiye\u0027nin kararı üçüncü devletlere danışmadan kendi başına uygulaması, bu yüzden doğru cevap bağımsızlık ilkesi. Kendine hep şunu sor: burada vurgu içerik mi, yoksa kararın kiminle paylaşıldığı mı?","doldur":[]}],"anahtar":[{"ornek":"devletlerle","kok":"devlet"},{"ornek":"kararı","kok":"kararı"},{"ornek":"ilkesinin","kok":"ilkesi"},{"ornek":"bağımsızlık","kok":"bağıms"},{"ornek":"türkiye","kok":"türkiy"},{"ornek":"üçüncü","kok":"üçüncü"}],"konuGiris":{"harita":"Ne zaman test edilir: Yabancı okullar sorununun çözüm biçimi sorulduğunda test edilir. Nasıl ölçülür: Türkiye\u0027nin sorunu görüşme konusu yapmayıp iç düzenlemeyle çözmesinin hangi ilkeye bağlandığı sorularak ölçülür. Nasıl kaydedilir: Doğru seçenek \u0027bağımsızlık/egemenlik\u0027 ilkesi olarak işaretlenir.","desen":"Tuzak, öğrencinin bu olayı \u0027laiklik\u0027 veya \u0027milliyetçilik\u0027 ilkesiyle karıştırmasıdır; oysa asıl vurgu görüşmeye açılmayıp tek başına çözülmesidir. Bazı seçenekler Türkiye\u0027nin okulları tümden kapattığını ima eder, bu yanlıştır. Bu soru p.28\u0027deki Türkiye\u0027nin tutumu bölümünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Devletin kararlarını başka devletlere danışmadan kendi alması","ad":"Bağımsızlık ilkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bir konunun yalnızca ülkenin kendi yetkisinde çözülmesi","ad":"İç mesele","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Tüm okulları Maarif Vekâleti\u0027ne bağlayan 1924 düzenlemesi","ad":"Tevhid-i Tedrisat Kanunu","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Yabancı okulların Türk kanunlarına tabi olmasını belirleyen antlaşma maddeleri","ad":"Lozan hükümleri","kim":"kanun sabitler"}],"sinavda":"Soru, Türkiye\u0027nin yabancı okullar sorununu hangi devletle görüşmeden çözdüğünü belirtip bu tutumun hangi ilkeye yansıdığını sorar.","panel_ornek":"Bir arkadaşının kirada oturduğu evin sahibi, ev sahibinin izni olmadan evin kapısına kilit taktırıp kuralları kendisi koyunca; arkadaşın \u0027burası benim evim, kurallarımı ben koyarım\u0027 demesi gibidir. Kimseye danışmadan kendi kararını kendi almıştır. Bu, dışarıdan onay almayı reddetme davranışıdır.","ornek":"Bir arkadaşının kirada oturduğu evin sahibi, ev sahibinin izni olmadan evin kapısına kilit taktırıp kuralları kendisi koyunca; arkadaşın \u0027burası benim evim, kurallarımı ben koyarım\u0027 demesi gibidir. Kimseye danışmadan kendi kararını kendi almıştır. Bu, dışarıdan onay almayı reddetme davranışıdır.","yontemler":"Cümledeki \u0027hiçbir devletle görüşme yapmadan\u0027 ifadesi doğrudan bağımsızlık ilkesine işaret eder; bu anahtar ifadeyi yakala.","nedir":"Bu konu, Türkiye\u0027nin yabancı okullar sorununu bağımsızlık ve egemenlik ilkesiyle iç mesele sayarak çözmesini anlatır. Sınav, bu tutumun hangi ilkenin dış politika yansıması olduğunu ölçer."},"olay":"","tuzak":{"D":{"ad":"Halkçılık Tuzağı","metin":"Eğitimin bütün vatandaşlara eşit uygulanması halkçılıkla karıştırılır. Doğrusu: burada belirleyici olan eşitlik değil, kararın hiçbir dış devletle paylaşılmamasıdır."},"E":{"ad":"Milliyetçilik Tuzağı","metin":"Türkçe, tarih ve coğrafya derslerinin Türk öğretmenlerce okutulması istendiği için milliyetçilik sanılır. Doğrusu: bu içerik talebi milliyetçiliğe uygundur ama sorunun görüşmesiz çözülmesi bağımsızlık ilkesini gösterir."},"A":{"ad":"Devletçilik Tuzağı","metin":"Öğrencinin ekonomik alana ait devlet müdahalesini eğitimdeki devlet denetimiyle karıştırmasıdır. Doğrusu: konuyu üçüncü devletlere açmadan iç mesele sayması, ekonomik değil siyasi bağımsızlıkla ilgilidir."},"B":{"ad":"Laiklik Tuzağı","metin":"Sınıflardan dinî simgelerin kaldırılması istendiği için ilkenin laiklik olduğu sanılır. Doğrusu: bu talep laikliğin bir yansımasıdır ama sorunun HİÇBİR DEVLETLE GÖRÜŞÜLMEDEN çözülmesi bağımsızlık ilkesini gösterir."}},"celdiriciYol":{},"hap":"Türkiye\u0027nin bir sorunu üçüncü devletlerle görüşmeden, kendi iç düzenlemesiyle çözmesi bağımsızlık ilkesinin göstergesidir.","teshis":{"C":{"gercek":"Türkiye sorunu hiçbir devletle görüşme konusu yapmadan çözmüştür; bu, iç işlerine karışılmaması yani tam bağımsızlık ilkesinin dış politikadaki yansımasıdır.","ayirt":"Karar sürecine üçüncü bir devlet ortak edildi mi, edilmedi mi?","paragraf":"Yabancı okullar sorunu - iç mesele kararı","yanilgi":"Bu şıkkı eleyen öğrenci, dış devlet ilişkisiz çözümü sıradan bir idari tercih sanır, ilkeyle bağdaştırmaz."},"E":{"gercek":"Türkçe, tarih, coğrafya dersleri talebi milliyetçiliğe uygundur; ama sorunun hiçbir devletle görüşülmeden çözülmesi ayrıca bağımsızlık ilkesini gösterir.","ayirt":"Sorulan şey ders içeriği mi, yoksa kararın kiminle paylaşıldığı mı?","paragraf":"Yabancı okullar sorunu - iç mesele kararı","yanilgi":"Türkçe ders zorunluluğu istendiği için tüm olayı milliyetçilik sanıyorsun."},"A":{"gercek":"Devletçilik iktisadi hayatta devlet öncülüğünü ifade eder; eğitimde dış devletlere danışılmaması ayrı bir ilkenin, bağımsızlığın konusudur.","ayirt":"Burada konu ekonomik üretim mi, yoksa dış devletlere hesap vermeme mi?","paragraf":"Genel ilke sınıflaması","yanilgi":"Devletin her alandaki söz sahipliğini devletçilik ilkesiyle özdeşleştiriyorsun."},"D":{"gercek":"Halkçılık sınıfsız kaynaşmış toplum ve kanun önünde eşitliği anlatır; burada belirleyici olan eşitlik değil dış devlete danışılmamasıdır.","ayirt":"Vurgu eşit uygulama mı, yoksa dışa kapalı karar alma mı?","paragraf":"Genel ilke sınıflaması","yanilgi":"Herkese uygulanan tek bir kuralı otomatik olarak halkçılık sayıyorsun."},"B":{"gercek":"Laiklik yalnız dinî unsurların kaldırılmasını açıklar; sorunun üçüncü devletlerle görüşülmeden çözülmesi ayrı biçimde bağımsızlık ilkesine dayanır.","ayirt":"Öne çıkan olgu din mi, yoksa dış devlete danışmama mı?","paragraf":"Yabancı okullar sorunu - iç mesele kararı","yanilgi":"Dinî simgelerin kaldırılması istendiği için tüm olayı laiklik sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 17"},"kural":"Kapitülasyon zihniyetine karşı tam bağımsızlık ve yabancı müdahalesini reddetme tutumu Milliyetçilik ilkesinin dış politikaya yansımasıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 17","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Soruda \u0027hiçbir devletle görüşmeme\u0027 ve \u0027iç mesele\u0027 ifadeleri geçiyorsa cevap büyük olasılıkla Milliyetçiliktir, uygulama detaylarına (denetim, sembol kaldırma) takılma.","konu":"yabancı okullar sorunu","tablo":{"satirlar":[["A) Milliyetçilik","Yabancı okullar sorunu - 1926-1928 çözüm süreci","doğru ifade"],["B) Halkçılık","Yabancı okullar sorunu - iç mesele kabulü","YANLIŞ ifade"],["C) Devletçilik","Yabancı okullar sorunu - denetim uygulaması","YANLIŞ ifade"],["D) Laiklik","Yabancı okullar sorunu - sembol kaldırma detayı","YANLIŞ ifade"],["E) İnkılapçılık","Yabancı okullar sorunu - Tevhid-i Tedrisat Kanunu","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Devletçilik","E":"İnkılapçılık","A":"Milliyetçilik","D":"Laiklik","B":"Halkçılık"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - yabanci okullar sorunu","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Osmanlı döneminde kapitülasyonların koruması altında açılan yabancı okullar (Fransız, Amerikan, İtalyan, Alman) kendi ülkelerinin programını uyguluyor ve Osmanlı denetimi dışında kalıyordu. LOZAN BARIŞ ANTLAŞMASI (1923) ile yabancı okulların Türk kanunlarına ve Türk okullarına uygulanan hükümlere tabi olması kabul edildi; yeni yabancı okul açılmayacaktı. 3 MART 1924 TEVHİD-İ TEDRİSAT KANUNU (Öğretimin Birleştirilmesi) ile ülkedeki bütün okullar Maarif Vekâleti\u0027ne (Millî Eğitim Bakanlığı) bağlandı; yabancı okullar da bu kapsamda denetime girdi. SORUNUN DOĞUŞU: Türkiye, yabancı okullarda TÜRKÇE, TARİH ve COĞRAFYA derslerinin TÜRK ÖĞRETMENLER tarafından TÜRKÇE okutulmasını, Türk müfettişlerin denetimini ve sınıflardan dinî sembollerin (haç, tasvir) kaldırılmasını istedi. Fransa ve Papalık bu düzenlemelere itiraz etti, konuyu diplomatik alana taşımak istedi. TÜRKİYE\u0027NİN TUTUMU: Türkiye sorunu İÇ MESELE saydı, hiçbir devletle bu konuda görüşme yapmadı; kurallara uymayan okullar kapatıldı; uyan okullar Türk denetiminde varlığını sürdürdü. Sorun 1926–1928 yılları arasında Türkiye\u0027nin kararlılığıyla çözüldü. ANLAMI: Eğitimde egemenlik ve millîlik ilkesi; kapitülasyon zihniyetinin eğitim alanında da bitirilmesi; laik eğitimin yabancı okullara da uygulanması. SINAV TUZAĞI: (1) Türkiye yabancı okulları tümden kapatmadı; Türk kanunlarına uymayanları kapattı. (2) Sorunu uluslararası görüşmeyle değil İÇ MESELE olarak çözdü; bu, bağımsızlık ilkesinin dış politikadaki yansımasıdır. (3) Hukuki dayanak Lozan ve Tevhid-i Tedrisat\u0027…"}],"hakem":"Soru Atatürk İlkeleri ve İnkılap Tarihi dersinin resmi kapsamında olup, yabancı okullar sorununu doğru şekilde ölçmektedir; milliyetçilik ilkesi kaynakta açıkça desteklenmekte ve \u0027iç mesele\u0027 olarak çözümü bağımsızlık ilkesiyle ilişkili gösterilmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Devletçilik, ekonomik alanlarda devletin rol almasını ilke edinendir. Yabancı okulların Maarif Vekâleti\u0027ne bağlanması eğitim egemenliğine ilişkindir, ekonomik devletçilik değildir.","E":"Tevhid-i Tedrisat Kanunu tarihsel bir inkılap olsa da, soru kanunun kendisini değil, sorunu görüşmesiz ve bağımsız şekilde çözme yöntemini soruyor; bu yöntem Milliyetçilik ilkesinin göstergesidir.","D":"Okullardaki dinî sembollerin kaldırılması laiklik ilkesinin bir uygulamasıdır. Fakat sorunun çözülme yöntemi—başka devletle görüşmeden bağımsız tutum sergileme—Milliyetçilikle açıklanır.","B":"Halkçılık, ülkenin kendi içinde sınıf ayrımını kaldırma ve eğitimde eşitlik sağlama ilkesidir. Burada esas mesele yabancı devletlerin müdahalesini reddetmek olup, halk içi eşitlikle ilgisi yoktur."},"dogru":"Türkiye yabancı okullar sorununu kendi iç meselesi saydı ve başka devletlerin söz söylemesini kabul etmedi. Bu tutum, ülkenin bağımsızlığını ve egemenliğini koruma ilkesini gösterir, bu da Milliyetçiliğin dış politikadaki yansımasıdır.","sinav":"Türkiye\u0027nin yabancı okullar sorununu hiçbir devletle görüşmeden çözmesi, kapitülasyon zihniyetine karşı tam bağımsızlık ve yabancı müdahalesini reddetme tutumunun Milliyetçilik ilkesinin dış politikaya yansıması olduğunun göstergesidir.","kavramlar":[{"kaynak":"TEORI","tanim":"Devletin kendi sınırları içindeki her konuda başka hiçbir devletin müdahalesini kabul etmeden karar alma yetkisidir.","ad":"Egemenlik"},{"kaynak":"TEORI","tanim":"Osmanlı döneminde yabancı devletlerin kendi okullarını ve yurttaşlarını Osmanlı kanunlarından muaf tutma anlayışı; bağımsızlıktan yoksun bir tutum.","ad":"Kapitülasyon zihniyeti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"Türkiye\u0027nin yabancı okullar sorununu hiçbir devletle görüşme yapmadan, iç mesele sayarak çözmesi aşağıdaki ilkelerden hangisinin bir göstergesidir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-16","verilenler":[],"dayanak":"Lozan Barış Antlaşması (1923) ve 3 Mart 1924 Tevhid-i Tedrisat Kanunu - yabancı okullar sorununun iç mesele olarak çözümü","dogru":"A","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1926 yılında bir Fransız okulunda haç ve dinî tasvirler sınıflarda hâlâ duruyor, Türk müfettişler denetime giremiyor.","anlatim":"Fransa hükümeti bu duruma itiraz ediyor, meseleyi diplomatik masaya taşımak istiyor. Türkiye ise \u0027bu bizim iç işimiz\u0027 diyip Fransa ile hiç görüşmüyor.","doldur":[]},{"formul":"Ne yapacağız: Türkiye kuralına uymayan okulu kapatıyor, uyanı denetimde bırakıyor, ama hiçbir devletle pazarlık yapmıyor.","anlatim":"Bu tavrın hangi Atatürk ilkesini gösterdiğini bulacağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Yabancı okullar sorunu - 1926-1928 çözüm süreci","karar":"doğru","anlatim":"Fransa\u0027yla masaya oturmamak, kararı kendi egemenlik hakkı sayıp dış müdahaleyi reddetmek demektir. Bu tam bağımsızlık tutumu Milliyetçiliğin dış politikaya yansımasıdır.","formul":"Şık A: Türkiye\u0027nin görüşme yapmadan tek başına karar vermesi Milliyetçilik ilkesinin göstergesi midir?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Yabancı okullar sorunu - iç mesele kabulü","karar":"yanlış","anlatim":"Halkçılık halk kesimleri arasında ayrıcalık tanımamayı anlatır, burada halk grupları arası bir eşitlik yok. Fransa\u0027ya karşı bağımsız duruş halkçılıkla açıklanamaz.","formul":"Şık B: Bu tutum Halkçılık ilkesinin göstergesi midir?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Yabancı okullar sorunu - denetim uygulaması","karar":"yanlış","anlatim":"Devletçilik devletin ekonomik üretime ve yatırıma katılmasıdır. Okulların Türk kanununa bağlanması ekonomik bir devletçilik uygulaması değildir.","formul":"Şık C: Bu tutum Devletçilik ilkesinin göstergesi midir?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Yabancı okullar sorunu - sembol kaldırma detayı","karar":"yanlış","anlatim":"Haç ve tasvir kaldırma bir ayrıntı, ama sorulan asıl şey görüşme yapmadan çözme yöntemi. Çözüm yöntemi Laiklikle değil bağımsız tavırla açıklanır.","formul":"Şık D: Dinî sembollerin kaldırılması istenmesi bu olayı Laiklik ilkesinin göstergesi yapar mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Yabancı okullar sorunu - Tevhid-i Tedrisat Kanunu","karar":"yanlış","anlatim":"İnkılapçılık yapılan yenilikleri korumaktır, kanunun kendisi ayrı bir konu. Sorulan, görüşmesiz çözüm tavrının hangi ilkeyi gösterdiğidir, bu da İnkılapçılık değildir.","formul":"Şık E: Tevhid-i Tedrisat Kanunu\u0027nun varlığı b erilir ve bunun hangi ilkenin göstergesi olduğu istenir.","panel_ornek":"Kiraladığın evin sahibi, \u0027bu evle ilgili kurallara ben karar veririm, kimseye danışmam\u0027 dese, bu senin evinde tam yetkili olduğunun göstergesidir. 15 metrekarelik bir oda için bile bu kural geçerlidir. Türkiye de kendi topraklarındaki okullar için aynı tavrı takınmıştır.","ornek":"Kiraladığın evin sahibi, \u0027bu evle ilgili kurallara ben karar veririm, kimseye danışmam\u0027 dese, bu senin evinde tam yetkili olduğunun göstergesidir. 15 metrekarelik bir oda için bile bu kural geçerlidir. Türkiye de kendi topraklarındaki okullar için aynı tavrı takınmıştır.","yontemler":"Kritik kural: \u0027görüşme yapmama, tek başına karar verme\u0027 ifadesi her zaman tam bağımsızlık/iç mesele sayma ilkesine bağlanır, laiklik ya da eğitim birliğiyle karıştırılmaz.","nedir":"Yabancı okullar sorunu, Türkiye\u0027nin eğitimde egemenliğini kapitülasyon artığı okullara karşı nasıl kurduğunu gösteren konudur. Sınav, bu tutumun hangi ilkenin (tam bağımsızlık/iç mesele sayma) göstergesi olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Devletçilik Tuzağı","metin":"Öğrenci, devletin okulları denetlemesini ekonomik devletçilikle aynı sanır. Doğrusu: Devletçilik ekonomik alana ilişkindir, eğitimde bağımsız duruş Milliyetçilikle açıklanır."},"E":{"ad":"İnkılapçılık Tuzağı","metin":"Öğrenci, Tevhid-i Tedrisat Kanunu\u0027nun bir inkılap olmasından yola çıkıp cevabı İnkılapçılık sanır. Doğrusu: Soru kanunun kendisini değil, görüşmesiz çözüm yöntemini sorduğu için cevap Milliyetçiliktir."},"D":{"ad":"Laiklik Tuzağı","metin":"Öğrenci, okullardaki dinî sembollerin kaldırılması ayrıntısını görüp sorunun özünü laiklik sanır. Doğrusu: Sorunun çözüm yöntemindeki bağımsız tutum Milliyetçiliğe, sembol kaldırma detayı ise ayrı bir uygulamaya aittir."},"B":{"ad":"Halkçılık Tuzağı","metin":"Öğrenci, eğitimde eşitlik vurgusunu görünce sınıf ayrımı gözetmeme ilkesiyle karıştırır. Doğrusu: Burada mesele halk içi eşitlik değil, dı
