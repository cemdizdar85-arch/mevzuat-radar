niyle uygulanamadı. SINAV TUZAĞI: (1) Devletçilik özel girişimi yasaklamaz; özel kesimin gücünün yetmediği alanlarda devletin yatırım yapmasıdır. (2) Sümerbank 1933\u0027te (plan öncesinde) kuruldu; plan 1934\u0027te başladı. (3) Etibank madencilik, Sümerbank sanayi (özellikle dokuma) kuruluşudur; ikisi karıştırılır. SINAVDA NASIL SORULUR: \u0027Birinci Beş Yıllık Sanayi Planı\u0027nın uygulanmasında gör…"}],"hakem":"Soru, Birinci Beş Yıllık Sanayi Planı kapsamında madencilik alanında 1935\u0027te kurulan devlet kuruluşunu sormakta; kaynak metni Etibank\u0027ın madencilik için 1935\u0027te kurulduğunu açıkça belirtmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"İş Bankası Cumhuriyet döneminin ilk büyük bankası olarak görülse de özel sermayeli bir ticaret bankasıdır; devletçilik döneminin sanayi planı uygulayıcısı değildir.","E":"Emlak ve Eytam Bankası Erken Cumhuriyet dönemine ait olup gayrimenkul ve miras işlemleriyle ilgilenir; Birinci Beş Yıllık Sanayi Planı\u0027yla bağlantısı bulunmaz.","D":"Ziraat Bankası devlet bankası olmakla birlikte tarımsal kredi alanında faaliyet gösterir; madencilik ve sanayi planıyla hiçbir ilişkisi yoktur.","A":"Sümerbank de Birinci Beş Yıllık Sanayi Planı kapsamında 1933\u0027te kurulmuş olup planın uygulayıcısıdır, ancak madencilik değil dokuma, kâğıt, cam gibi sanayi kollarında görev yaptığı için yanlıştır."},"dogru":"Devlet, özel sermayenin yetersiz olduğu madencilik alanında üretimi artırmak için Birinci Beş Yıllık Sanayi Planı\u0027nda Etibank\u0027ı 1935\u0027te kurdu. Etibank madencilik arama ve işletmesini, Sümerbank ise dokuma-kâğıt-cam gibi sanayi dallarını üstlendi.","sinav":"Birinci Beş Yıllık Sanayi Planı çerçevesinde madencilik alanında arama ve işletme faaliyetlerini yürütmek üzere 1935 yılında kurulan devlet kuruluşu Etibank\u0027tır.","kavramlar":[{"kaynak":"TEORI","tanim":"Özel kesimin gücünün yetmediği alanlarda devletin temel sanayi yatırımlarını kendisi üstlendiği ekonomik politikadır.","ad":"Devletçilik politik ar her ismi Zonguldak madeni olayına oturtacağız.","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"p.Sümerbank-1933","karar":"yanlış","anlatim":"Hayır, Sümerbank dokuma, kağıt, cam gibi sanayi kollarında fabrika kurup işletmiştir. Madencilik onun alanı değil, bu yüzden Zonguldak\u0027ta görev almaz.","formul":"Şık A: birisi \u0027Zonguldak madenini Sümerbank işletsin\u0027 diyor, katılır mısın?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"p.Etibank-1935","karar":"doğru","anlatim":"Evet, Etibank tam olarak 1935\u0027te madencilik arama ve işletme faaliyetleri için kurulmuş kuruluştur. Zonguldak\u0027taki kömür madeni işi doğrudan onun görev alanına girer.","formul":"Şık B: birisi \u0027Zonguldak madenini Etibank işletsin\u0027 diyor, katılır mısın?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"p.İş Bankası-1924","karar":"yanlış","anlatim":"Hayır, İş Bankası 1924\u0027te özel sermayeyle kurulmuş bir ticaret bankasıdır. Sanayi planının uygulayıcısı değildir, madencilikle görevli de değildir.","formul":"Şık C: birisi \u0027Zonguldak madenini İş Bankası finanse etsin ve işletsin\u0027 diyor, katılır mısın?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"p.Ziraat Bankası","karar":"yanlış","anlatim":"Hayır, Ziraat Bankası tarımsal kredi alanında çalışır. Madencilik veya sanayi planıyla hiçbir ilgisi yoktur.","formul":"Şık D: birisi \u0027Zonguldak madenini Ziraat Bankası üstlensin\u0027 diyor, katılır mısın?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.Emlak ve Eytam Bankası","karar":"yanlış","anlatim":"Hayır, bu banka gayrimenkul ve miras işleriyle ilgilenir. Sanayi planı ya da madencilik onun görev alanına girmez.","formul":"Şık E: birisi \u0027Zonguldak madenini Emlak ve Eytam Bankası devralsın\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Zonguldak\u0027taki maden olayı sana şunu öğretti: madencilik denince Etibank, sanayi/dokuma denince Sümerbank. Kendine hep şunu sor: bu kuruluş toprağın altındaki madenle mi ilgileniyor yoksa fabrikada üretimle mi?","doldur":[]}],"anahtar":[{"ornek":"madencilik","kok":"madenc"},{"ornek":"sanayi","kok":"sanayi"},{"ornek":"kuruluşlarıdır","kok":"kurulu"},{"ornek":"etibank","kok":"etiban"},{"ornek":"dokuma","kok":"dokuma"},{"ornek":"zonguldak","kok":"zongul"}],"konuGiris":{"harita":"Ne zaman test edilir: kuruluşların kuruluş tarihi ile plan tarihinin karıştırıldığı sorularda test edilir. Nasıl ölçülür: hangi kuruluşun hangi alanda (sanayi/madencilik) görev aldığı bilgisiyle ölçülür. Nasıl kaydedilir: tarih ve alan eşleşmesi tablo halinde ezberlenerek kaydedilir.","desen":"Soru sıkça Sümerbank ile Etibank\u0027ın görev alanlarını karıştırtır; Sümerbank dokuma/sanayi, Etibank madencilik yapar. Sümerbank\u0027ın 1933\u0027te, planın ise 1934\u0027te başladığı da tuzak olarak kullanılır. Bu soru p.28\u0027deki kuruluş-alan eşleştirmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"özel sermayenin yetersiz kaldığı alanlarda devletin yatırım yapması ilkesi","ad":"Devletçilik","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1934-1938 arası uygulanan ilk planlı sanayileşme programı","ad":"Birinci Beş Yıllık Sanayi Planı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1933\u0027te kurulan, dokuma ve sanayi fabrikalarını kuran devlet kuruluşu","ad":"Sümerbank","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"1935\u0027te madencilik arama ve işletme için kurulan devlet kuruluşu","ad":"Etibank","kim":"kanun sabitler"}],"sinavda":"Madencilik arama ve işletme için 1935\u0027te kurulan kuruluşun adı sorulur, sadece isim seçimi istenir.","panel_ornek":"Bir arkadaşın hem telefon tamir dükkanı hem de ayrı bir yedek parça deposu açıyor; ikisi de onun işi ama farklı görevler için kurulmuş. Depo 2 ay önce, dükkan 5 ay önce açılmış. Sınav da tam bunu sorar: hangi kuruluş hangi işi yapıyor, hangisi önce kuruldu.","ornek":"Bir arkadaşın hem telefon tamir dükkanı hem de ayrı bir yedek parça deposu açıyor; ikisi de onun işi ama farklı görevler için kurulmuş. Depo 2 ay önce, dükkan 5 ay önce açılmış. Sınav da tam bunu sorar: hangi kuruluş hangi işi yapıyor, hangisi önce kuruldu.","yontemler":"Sümerbank=sanayi/dokuma, Etibank=madencilik ayrımını tarih ile birlikte kısa bir tablo halinde ezberlemek en kritik kuraldır.","nedir":"Birinci Beş Yıllık Sanayi Planı, devletin özel sermayenin yetersiz kaldığı temel sanayi alanlarına yatırım yaptığı ilk planlı sanayileşme denemesidir. Sınav, hangi kuruluşun hangi alanda (sanayi mi madencilik mi) kurulduğunu ve kuruluş tarihlerini ölçer."},"olay":"","tuzak":{"C":{"ad":"Kuruluş Türü Tuzağı","metin":"İş Bankası\u0027nı Cumhuriyet döneminin ilk büyük bankası olarak görüp devletçilik döneminin kuruluşuyla karıştırırsın. Doğrusu: İş Bankası özel sermayeli bir ticaret bankasıdır, plan uygulayıcısı değildir."},"E":{"ad":"Zamanlama Tuzağı","metin":"Erken Cumhuriyet dönemi bankası olduğu için planla aynı döneme ait sanırsın. Doğrusu: Emlak ve Eytam Bankası gayrimenkul ve mirasla ilgilenir, sanayi planıyla bağlantısı yoktur."},"D":{"ad":"Kapsam Tuzağı","metin":"Ziraat Bankası\u0027nı devlet bankası olduğu için sanayi planına dahil sanırsın. Doğrusu: Ziraat Bankası tarımsal kredi alanında faaliyet gösterir, madencilikle ilgisi yoktur."},"A":{"ad":"Alan Karıştırma Tuzağı","metin":"Sümerbank\u0027ın plan uygulayıcısı olduğunu bilip her kuruluşu ona yazarsın. Doğrusu: Sümerbank dokuma-kağıt-cam gibi sanayi kollarında, madencilikte ise Etibank görevlidir."}},"celdiriciYol":null,"hap":"Sümerbank sanayi (dokuma-kağıt-cam), Etibank madencilik alanında görevli devletçilik dönemi kuruluşlarıdır.","teshis":{"C":{"gercek":"İş Bankası 1924\u0027te özel sermayeyle kurulmuş bir ticaret bankasıdır, sanayi planının uygulayıcısı değildir.","ayirt":"Bu kuruluş devlet mi özel sermaye ile mi kuruldu?","paragraf":"İnkılap Tarihi - Devletçilik/Sanayi Planı konu özeti","yanilgi":"İş Bankası\u0027nı devletçilik döneminin kurumu sanıyorsun çünkü Cumhuriyet\u0027in ilk bankası."},"E":{"gercek":"Emlak ve Eytam Bankası gayrimenkul ve miras işleriyle ilgilenir, sanayi planıyla ilgisi yoktur.","ayirt":"Bu kuruluşun görev alanı sanayi/madencilik mi yoksa gayrimenkul mü?","paragraf":"İnkılap Tarihi - Devletçilik/Sanayi Planı konu özeti","yanilgi":"Erken Cumhuriyet dönemi bankası olduğu için sanayi planı kuruluşu sanıyorsun."},"A":{"gercek":"Sümerbank dokuma, kağıt, cam gibi sanayi kollarında fabrika kurup işletmiştir; madencilik ayrı bir kuruluşa bırakılmıştır.","ayirt":"Bu kuruluş sanayi mi madencilik mi alanında çalışıyor?","paragraf":"İnkılap Tarihi - Devletçilik/Sanayi Planı konu özeti","yanilgi":"Sümerbank\u0027ı plan uygulayıcısı diye bildiğin için her alanı ona yazıyorsun."},"D":{"gercek":"Ziraat Bankası tarımsal kredi alanında faaliyet gösterir, sanayi planı veya madencilikle ilgisi yoktur.","ayirt":"Bu kuruluş tarım mı yoksa sanayi/madencilik mi alanında görevli?","paragraf":"İnkılap Tarihi - Devletçilik/Sanayi Planı konu özeti","yanilgi":"Ziraat Bankası devlet bankası olduğu için sanayi planına dahil olduğunu düşünüyorsun."},"B":{"gercek":"Etibank 1935\u0027te madencilik arama ve işletme faaliyetleri için kurulan devlet kuruluşudur.","ayirt":"Soru madencilikten mi sanayiden mi bahsediyor?","paragraf":"İnkılap Tarihi - Devletçilik/Sanayi Planı konu özeti","yanilgi":"Etibank\u0027ı unutup her devlet kuruluşunu Sümerbank sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 16"},"kural":"Terakkiperver Cumhuriyet Fırkası 3 Haziran 1925\u0027te kapatılmış, Demokrat Parti ise ondan yirmi bir yıl sonra, 7 Ocak 1946\u0027da kurulmuştur; ikisi aynı yıl değildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 16","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Tarih sorularında iki olay arasındaki yıl farkını mutlaka hesapla; \u0027hemen ardından/aynı yıl\u0027 ifadesi genelde tuzaktır.","konu":"çok partili hayat","tablo":{"satirlar":[["A) Çok partili hayata geçişte kurulan ilk parti Millî Kalkı…","p.kronoloji özeti","doğru ifade"],["B) Dörtlü Takrir, Celal Bayar, Adnan Menderes, Fuat Köprülü…","p.Dörtlü Takrir","doğru ifade"],["C) 1946 seçimlerini Cumhuriyet Halk Partisi, 1950 seçimleri…","p.1946/1950 seçimleri","doğru ifade"],["D) Demokrat Parti, Terakkiperver Cumhuriyet Fırkası\u0027nın kap…","p.kronoloji özeti","YANLIŞ ifade"],["E) Serbest Cumhuriyet Fırkası, Fethi Okyar tarafından 1930 …","p.Serbest Cumhuriyet Fırkası","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"1946 seçimlerini Cumhuriyet Halk Partisi, 1950 seçimlerini Demokrat Parti kazanmıştır.","E":"Serbest Cumhuriyet Fırkası, Fethi Okyar tarafından 1930 yılında kurulmuş ve kısa süre sonra kendini feshetmiştir.","A":"Çok partili hayata geçişte kurulan ilk parti Millî Kalkınma Partisi\u0027dir.","D":"Demokrat Parti, Terakkiperver Cumhuriyet Fırkası\u0027nın kapatılmasının hemen ardından, aynı yıl içinde kurulmuştur.","B":"Dörtlü Takrir, Celal Bayar, Adnan Menderes, Fuat Köprülü ve Refik Koraltan tarafından verilmiştir."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - cok partili hayat","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Cumhuriyet\u0027in ilk yıllarında iki çok partili deneme yapıldı: TERAKKİPERVER CUMHURİYET FIRKASI (17 Kasım 1924; Kazım Karabekir, Rauf Orbay, Ali Fuat Cebesoy, Refet Bele; Şeyh Sait İsyanı sonrası 3 Haziran 1925\u0027te kapatıldı) ve SERBEST CUMHURİYET FIRKASI (12 Ağustos 1930; Fethi Okyar; 17 Kasım 1930\u0027da kendini feshetti). İkisi de kısa sürdü; 1930\u0027dan 1945\u0027e kadar Cumhuriyet Halk Partisi tek parti olarak yönetti. DÖNÜM NOKTASI 1945: II. Dünya Savaşı\u0027nın demokrasilerin zaferiyle bitmesi, Türkiye\u0027nin Birleşmiş Milletler\u0027e kurucu üye olması ve Batı ile yakınlaşma ihtiyacı, içte de tek parti yönetimine karşı hoşnutsuzluk çok partili hayatı gündeme getirdi. CHP içinde Celal Bayar, Adnan Menderes, Fuat Köprülü ve Refik Koraltan 7 Haziran 1945\u0027te DÖRTLÜ TAKRİR\u0027i vererek parti içi demokrasi ve anayasal özgürlüklerin uygulanmasını istedi; reddedildi. Çok partili dönemin İLK PARTİSİ Nuri Demirağ\u0027ın kurduğu MİLLÎ KALKINMA PARTİSİ\u0027dir (18 Temmuz 1945). DEMOKRAT PARTİ 7 OCAK 1946\u0027da Celal Bayar başkanlığında kuruldu. 1946 genel seçimleri \u0027açık oy, gizli sayım\u0027 usulüyle yapıldı ve CHP kazandı; 1950 seçimlerinde \u0027gizli oy, açık sayım\u0027 ilkesi ve yargı denetimi getirildi; 14 MAYIS 1950 seçimini Demokrat Parti kazandı, iktidar ilk kez seçimle el değiştirdi; Celal Bayar cumhurbaşkanı, Adnan Menderes başbakan oldu. SINAV TUZAĞI: (1) Çok partili hayatın ilk partisi Demokrat Parti değil Millî Kalkınma Partisi\u0027dir. (2) 1946 seçimlerini CHP, 1950 seçimlerini DP kazandı. (3) Dörtlü Takrir\u0027i verenler CHP milletvekilleridir ve sonradan DP\u0027yi …"}],"hakem":"Soru, çok partili hayat sürecindeki tarihsel gelişmeleri doğru-yanlış ayrımıyla ölçüyor; D şıkkı (Demokrat Parti ile Terakkiperver Cumhuriyet Fırkası aynı yıl) kaynakta açıkça yanlış olarak belgelenmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"1946 seçimini CHP, 1950 seçimini Demokrat Parti kazandı; seçim tarihleri ve kazananlar doğru sıralanmıştır.","E":"Serbest Cumhuriyet Fırkası Fethi Okyar\u0027ın 12 Ağustos 1930\u0027da kurduğu ve 17 Kasım 1930\u0027da kendini feshettirdiği parti; bu bilgi doğrudur.","A":"Millî Kalkınma Partisi 18 Temmuz 1945\u0027te Nuri Demirağ tarafından kurulan çok partili dönemi başlatan ilk partidir; bu bilgi doğrudur.","B":"Dörtlü Takrir\u0027i CHP içinde olan Celal Bayar, Adnan Menderes, Fuat Köprülü ve Refik Koraltan 7 Haziran 1945\u0027te verdiler; bu ifade doğrudur."},"dogru":"Terakkiperver Cumhuriyet Fırkası 3 Haziran 1925\u0027te kapandı, Demokrat Parti ise 7 Ocak 1946\u0027da kuruldu. İkisi aynı yıl değil, aralarında yirmi bir yıl fark var. D ifadesi tarihsel olarak yanlıştır.","sinav":"Terakkiperver Cumhuriyet Fırkası 3 Haziran 1925\u0027te kapatılmış, Demokrat Parti 7 Ocak 1946\u0027da kurulmuş; ikisi aynı yıl içinde gerçekleşmemiştir.","kavramlar":[{"kaynak":"TEORI","tanim":"7 Haziran 1945\u0027te CHP içinde Celal Bayar, Adnan Menderes, Fuat Köprülü ve Refik Koraltan tarafından verilen, parti içi demokrasi ve anayasal özgürlüklerin uygulanmasını talep eden yazılı başvuru.","ad":"Dörtlü Takrir"},{"kaynak":"TEORI","tanim":"17 Kasım 1924\u0027te Kazım Karabekir, Rauf Orbay, Ali Fuat Cebesoy ve Refet Bele tarafından kurulan ve Şeyh Sait İsyanı sonrası 3 Haziran 1925\u0027te kapatılan ilk çok partili deneme partisi.","ad":"Terakkiperver Cumhuriyet Fırkası"},{"kaynak":"TEORI","tanim":"7 Ocak 1946\u0027da Celal Bayar başkanlığında kurulan ve 14 Mayıs 1950 seçimlerini kazanarak ikinci partinin iktidar olma hakkını sağlayan siyasi partido.","ad":"Demokrat Parti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"Çok partili hayata geçiş sürecindeki gelişmelerle ilgili aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-26","verilenler":[],"dayanak":"TESMER SGS içerik özeti - Çok Partili Hayata Geçiş (Terakkiperver Cumhuriyet Fırkası, Serbest Cumhuriyet Fırkası, Dörtlü Takrir, Millî Kalkınma Partisi, Demokrat Parti kronolojisi)","dogru":"D","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1925\u0027te Terakkiperver Cumhuriyet Fırkası kapatılıyor, tam yirmi bir yıl sonra 7 Ocak 1946\u0027da Celal Bayar bir parti daha kuruyor.","anlatim":"Aradaki yirmi bir yıl boyunca Türkiye\u0027de tek parti CHP var. Bu boşluğu unutursan tarihleri birbirine yapıştırırsın.","doldur":[]},{"formul":"Ne yapacağız: beş ifadeyi bu 1925-1946 zaman çizgisine tek tek koyup, hangisi tarihe uymuyor bulacağız.","anlatim":"Her şık bir tarih iddiası taşıyor, sen tarihi gerçekle karşılaştıracaksın. Beş ifadeyi b ojik sırayla ve kişi-parti eşleştirmesini birlikte ezberlemek en kritik kuraldır.","nedir":"Çok partili hayat konusu, Türkiye\u0027nin tek parti yönetiminden çoklu parti sistemine geçiş sürecindeki olay-tarih-sonuç zincirini işler. Sınav bu geçişteki kronolojik doğruları ve kişileri hatırlama becerisini ölçer."},"olay":"","tuzak":{"C":{"ad":"Seçim Sırası Tuzağı","metin":"1946 ve 1950 seçim sonuçları karıştırılabilir ama bu ifade doğrudur, 1946\u0027yı CHP, 1950\u0027yi Demokrat Parti kazanmıştır. Doğrusu: C ifadesi doğrudur, yanlış şık değildir."},"E":{"ad":"Fesih Bilgisi Tuzağı","metin":"Serbest Cumhuriyet Fırkası\u0027nın da kapatıldığı sanılır ama bu ifade doğrudur, parti Fethi Okyar tarafından kurulmuş ve 17 Kasım 1930\u0027da kendini feshetmiştir. Doğrusu: E ifadesi doğrudur, yanlış şık değildir."},"A":{"ad":"Millî Kalkınma Partisi Tuzağı","metin":"Öğrenci çok partili dönemin ilk partisini Demokrat Parti sanır ama bu ifade doğrudur, ilk parti 18 Temmuz 1945\u0027te kurulan Millî Kalkınma Partisi\u0027dir. Doğrusu: A ifadesi doğrudur, yanlış şık değildir."},"B":{"ad":"Kişi Karıştırma Tuzağı","metin":"Dörtlü Takrir\u0027in Terakkiperver kurucularınca verildiği sanılır ama bu ifade doğrudur, Takrir\u0027i Bayar, Menderes, Köprülü ve Koraltan CHP içindeyken 7 Haziran 1945\u0027te vermiştir. Doğrusu: B ifadesi doğrudur, yanlış şık değildir."}},"celdiriciYol":null,"hap":"Çok partili hayatın ilk partisi Millî Kalkınma Partisi\u0027dir; Demokrat Parti, Terakkiperver\u0027in kapatılmasından tam 21 yıl sonra 1946\u0027da kurulmuştur.","teshis":{"C":{"gercek":"1946 seçimini CHP (açık oy-gizli sayım), 14 Mayıs 1950 seçimini ise Demokrat Parti (gizli oy-açık sayım) kazanmıştır.","ayirt":"Hangi yılda iktidar el değiştirdi, hangi yılda değişmedi?","paragraf":"Çok Partili Hayat - 1946/1950 seçimleri","yanilgi":"1946 ve 1950 seçim sonuçlarını ters çevirip hatırlıyorsun."},"E":{"gercek":"Serbest Cumhuriyet Fırkası, Fethi Okyar tarafından 12 Ağustos 1930\u0027da kurulmuş, kapatıl res, Fuat Köprülü ve Refik Koraltan 7 Haziran 1945\u0027te DÖRTLÜ TAKRİR\u0027i vererek parti içi demokrasi ve anayasal özgürlüklerin uygulanmasını istedi; reddedildi. Çok partili dönemin İLK PARTİSİ Nuri Demirağ\u0027ın kurduğu MİLLÎ KALKINMA PARTİSİ\u0027dir (18 Temmuz 1945). DEMOKRAT PARTİ 7 OCAK 1946\u0027da Celal Bayar başkanlığında kuruldu. 1946 genel seçimleri \u0027açık oy, gizli sayım\u0027 usulüyle yapıldı ve CHP kazandı; 1950 seçimlerinde \u0027gizli oy, açık sayım\u0027 ilkesi ve yargı denetimi getirildi; 14 MAYIS 1950 seçimini Demokrat Parti kazandı, iktidar ilk kez seçimle el değiştirdi; Celal Bayar cumhurbaşkanı, Adnan Menderes başbakan oldu. SINAV TUZAĞI: (1) Çok partili hayatın ilk partisi Demokrat Parti değil Millî Kalkınma Partisi\u0027dir. (2) 1946 seçimlerini CHP, 1950 seçimlerini DP kazandı. (3) Dörtlü Takrir\u0027i verenler CHP milletvekilleridir ve sonradan DP\u0027yi …"}],"hakem":"Soru çok partili hayata geçiş konusunu ölçüyor, dayanak kaynak metinde açıkça yer alıyor, atıf sorun değil (teori konusu), hesap/kod yoktur, ders kapsamında yer alıyor ve tek anlam taşıyor."},"kayitlar":[],"sade":{"siklar":{"C":"Seçim sonuçları tamamen tersine çevirilerek hatırlanmıştır. Cumhuriyet Halk Partisi 1946\u0027da, Demokrat Parti ise 1950\u0027de seçimi kazanmıştır.","E":"Dörtlü Takrir\u0027i verenler Terakkiperver Cumhuriyet Fırkası\u0027ndan değil, 1945\u0027teki Cumhuriyet Halk Partisi\u0027nden parti içinde çıkıştır. Terakkiperver Cumhuriyet Fırkası zaten 1925\u0027te kapatılmıştı.","D":"Serbest Cumhuriyet Fırkası 1930\u0027da kapandıktan sonra on beş yıl boyunca tek parti dönemi yaşandı. Demokrat Parti bu uzun zaman aralığından sonra 1946\u0027da kurulmuştur.","A":"Dörtlü Takrir\u0027i verenler ile Millî Kalkınma Partisi\u0027nin kurucusu arasında kişi olarak hiçbir ortak yoktur. Millî Kalkınma Partisi Nuri Demirağ tarafından kurulmuş, Dörtlü Takrir verenleri Demokrat Parti\u0027yi kurdu."},"dogru":"Türkiye\u0027de çok partili dönemi başlatan ilk parti Nuri Demirağ tarafından 18 Temmuz 1945\u0027te kurulan Millî Kalkınma Partisi\u0027dir. Dörtlü Takrir\u0027i veren dört kişi (Celal Bayar, Adnan Menderes, Fuat Köprülü, Refik Koraltan) bunu kendi partileri olarak kurmamışlardır. Bunlar altı ay sonra, 7 Ocak 1946\u0027da Demokrat Parti\u0027yi kurmuştur.","sinav":"Türkiye\u0027de çok partili hayata geçiş sürecinde kurulan ilk parti hangisidir?","kavramlar":[{"kaynak":"TEORI","tanim":"7 Haziran 1945\u0027te Celal Bayar, Adnan Menderes, Fuat Köprülü ve Refik Koraltan tarafından Cumhuriyet Halk Partisi\u0027nde verilen ve parti içi demokrasi ile anayasal özgürlüklerin uygulanmasını talep eden belgedir.","ad":"Dörtlü Takrir"},{"kaynak":"TEORI","tanim":"18 Temmuz 1945\u0027te Nuri Demirağ tarafından kurulan ve Türkiye\u0027de çok partili dönemi başlatan ilk siyasi partidir.","ad":"Millî Kalkınma Partisi"},{"kaynak":"TEORI","tanim":"7 Ocak 1946\u0027da Celal Bayar başkanlığında kurulan ve 1950 seçimlerini kazanarak iktidarı ilk kez seçim yoluyla ele alan siyasi partidir.","ad":"Demokrat Parti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"Türkiye\u0027de çok partili hayata geçiş sürecine ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-cokzor/kp-26","verilenler":[],"dayanak":"İnkılap Tarihi ders notu - Çok Partili Hayata Geçiş (1945-1950)","dogru":"B","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Nuri Demirağ, 18 Temmuz 1945\u0027te Millî Kalkınma Partisi\u0027ni kurar; aynı yılın 7 Haziran\u0027ında Celal Bayar, Menderes, Köprülü ve Koraltan CHP içinde Dörtlü Takrir\u0027i vermiştir; Demokrat Parti ise 7 Ocak 1946\u0027da kurulur.","anlatim":"Aynı yıl içinde üç ayrı olay birbirini takip ediyor. Tarihleri karıştırırsan sıralama tamamen değişir.","doldur":[]},{"formul":"Ne yapacağız: Bu olayda beş iddiayı tek tek, tarih ve kişi eşleştirmesiyle sınayacağız.","anlatim":"Kural basit: kim, ne zaman, hangi partiyi kurdu, kim kazandı sorularını rakamlarla cevaplayacağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"İnkılap Tarihi - Çok Partili Hayata Geçiş","karar":"yanlış","anlatim":"Millî Kalkınma Partisi\u0027ni Nuri Demirağ kurmuştur, Dörtlü Takrir imzacıları değil. Bu dört isim doğrudan 7 Ocak 1946\u0027da Demokrat Parti\u0027yi kurmuştur.","formul":"Şık A: Dörtlü Takrir\u0027i veren dört isim, Demokrat Parti\u0027den önce Millî Kalkınma Partisi\u0027ni mi kurmuş, dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"İnkılap Tarihi - Çok Partili Hayata Geçiş","karar":"doğru","anlatim":"Demokrat Parti 7 Ocak 1946\u0027da kuruldu, yani ondan altı ay önce Millî Kalkınma Partisi vardı. Tarih sırası bu olayda net.","formul":"Şık B: 18 Temmuz 1945\u0027te kurulan Millî Kalkınma Partisi, çok partili dönemin ilk partisi mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"İnkılap Tarihi - Çok Partili Hayata Geçiş","karar":"yanlış","anlatim":"Gerçek tam tersi: 1946 seçimini CHP, açık oy gizli sayımla kazandı. 1950\u0027de gizli oy açık sayım ile Demokrat Parti kazandı.","formul":"Şık C: 1946\u0027yı Demokrat Parti, 1950\u0027yi CHP mi kazandı, dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"İnkılap Tarihi - Çok Partili Hayata Geçiş","karar":"yanlış","anlatim":"Serbest Cumhuriyet Fırkası 17 Kasım 1930\u0027da feshedildi, Demokrat Parti ise 1946\u0027da kuruldu. Arada on beş yıl CHP tek başına yönetti.","formul":"Şık D: Demokrat Parti, Serbest Cumhuriyet Fırkası\u0027nın feshinin hemen ardından mı kuruldu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"İnkılap Tarihi - Çok Partili Hayata Geçiş","karar":"yanlış","anlatim":"Terakkiperver Cumhuriyet Fırkası 1925\u0027te kapandı, Dörtlü Takrir ise 7 Haziran 1945\u0027te CHP içinden verildi. İki olay yirmi yıl arayla, farklı partide gerçekleşti.","formul":"Şık E: Dörtlü Takrir, Terakkiperver Cumhuriyet Fırkası içindeki vekiller tarafından mı verildi?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Bu olayda tek doğru, Millî Kalkınma Partisi\u0027nin Demokrat Parti\u0027den önce kurulmasıydı. Kendine hep şunu sor: bu isim, bu tarihte gerçekten var mıydı yoksa aklımda Demokrat Parti ile mi karıştı?","doldur":[]}],"anahtar":[{"ornek":"demokrat","kok":"demokr"},{"ornek":"partisi","kok":"partis"},{"ornek":"kalkınma","kok":"kalkın"},{"ornek":"gerçek","kok":"gerçek"},{"ornek":"olayda","kok":"olayda"},{"ornek":"kazandı","kok":"kazand"}],"konuGiris":{"harita":"Ne zaman test edilir: Tek parti döneminden çok partili döneme geçişin tarihleri ve sırası sorulduğunda. Nasıl ölçülür: Parti kuruluş tarihleri, kurucu isimler ve seçim sonuçlarının doğru eşleştirilmesiyle. Nasıl kaydedilir: Kronolojik sırayla parti adı-tarih-sonuç şeklinde ezberlenir.","desen":"Sınav genellikle \u0027ilk parti hangisidir\u0027 diyerek Demokrat Parti\u0027yi tuzak seçenek yapar, oysa doğru cevap Millî Kalkınma Partisi\u0027dir. Bir diğer tuzak Dörtlü Takrir imzacılarının kim olduğunu karıştırmaktır. Bu soru p.28\u0027deki kronoloji ve isim eşleştirme noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"1924\u0027te kurulan, Şeyh Sait İsyanı sonrası kapatılan ilk muhalefet partisi","ad":"Terakkiperver Cumhuriyet Fırkası","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"1930\u0027da Fethi Okyar\u0027ın kurduğu, kendini fesheden kısa ömürlü muhalefet partisi","ad":"Serbest Cumhuriyet Fırkası","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"1945\u0027te CHP içinden dört kişinin verdiği demokrasi talep önergesi","ad":"Dörtlü Takrir","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Nuri Demirağ\u0027ın kurduğu, çok partili dönemin ilk partisi","ad":"Millî Kalkınma Partisi","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda çok partili hayata geçiş sürecine dair bir ifade verilir ve bunlardan hangisinin doğru olduğu istenir.","panel_ornek":"Bir arkadaşın önce eski bisikletini tamir ettirmeyi denedi, olmadı, sonra ikinci el bir bisiklet aldı ve nihayet yepyeni bir bisiklet aldı. Yani ilk denemesi başarısız oldu ama sonunda kalıcı çözüme ulaştı. Sınavda da hangi denemenin ilk, hangisinin kalıcı olduğu karıştırılır.","ornek":"Bir arkadaşın önce eski bisikletini tamir ettirmeyi denedi, olmadı, sonra ikinci el bir bisiklet aldı ve nihayet yepyeni bir bisiklet aldı. Yani ilk denemesi başarısız oldu ama sonunda kalıcı çözüme ulaştı. Sınavda da hangi denemenin ilk, hangisinin kalıcı olduğu karıştırılır.","yontemler":"Kronolojik sırayı (Terakkiperver-Serbest-Millî Kalkınma-Demokrat Parti) karıştırmadan ezberlemek en kritik kuraldır.","nedir":"Bu konu Türkiye\u0027nin tek parti yönetiminden çok partili siyasi hayata geçiş sürecini anlatır. Sınav bu geçişteki parti kuruluş sırasını, tarihleri ve isimleri karıştırıp doğru bilgiyi ayırt edip edemediğini ölçer."},"olay":"Millî Kalkınma Partisi 18 Temmuz 1945, Demokrat Parti ise 7 Ocak 1946\u0027da kurulmuştur.","tuzak":{"C":{"ad":"Ters Sonuç Tuzağı","metin":"Seçim sonuçları öğrencinin aklında ters yer etmiş olabilir. Doğrusu: 1946 seçimlerini Cumhuriyet Halk Partisi, 1950 seçimlerini Demokrat Parti kazanmıştır."},"E":{"ad":"Parti Karışıklığı Tuzağı","metin":"Terakkiperver Cumhuriyet Fırkası 1925\u0027te kapatılmış, olayla ilgisi yoktur. Doğrusu: Dörtlü Takrir, Cumhuriyet Halk Partisi içindeki milletvekilleri tarafından 7 Haziran 1945\u0027te verilmiştir."},"D":{"ad":"Zamanlama Boşluğu Tuzağı","metin":"Serbest Cumhuriyet Fırkası\u0027nın 17 Kasım 1930\u0027da feshi ile Demokrat Parti\u0027nin 7 Ocak 1946\u0027daki kuruluşu arasında on beş yıllık tek parti dönemi atlanmıştır. Doğrusu: Demokrat Parti, 1930-1945 tek parti döneminin ardından kurulmuştur."},"A":{"ad":"Kurucu Karışıklığı Tuzağı","metin":"Dörtlü Takrir\u0027i veren Celal Bayar, Adnan Menderes, Fuat Köprülü ve Refik Koraltan\u0027ın Millî Kalkınma Partisi ile ilgisi yoktur. Doğrusu: Millî Kalkınma Partisi\u0027ni 18 Temmuz 1945\u0027te Nuri Demirağ kurmuştur."}},"celdiriciYol":{},"hap":"Çok partili hayatın ilk partisi Demokrat Parti değil, 18 Temmuz 1945\u0027te Nuri Demirağ\u0027ın kurduğu Millî Kalkınma Partisi\u0027dir.","teshis":{"C":{"gercek":"1946 seçimini CHP, 1950 seçimini gizli oy açık sayım ilkesiyle Demokrat Parti kazanmıştır.","ayirt":"Hangi yılda hangi oy usulü uygulandı ve kim kazandı?","paragraf":"İnkılap Tarihi - Çok Partili Hayata Geçiş","yanilgi":"1946 ve 1950 seçim sonuçlarını birbirine karıştırıyorsun."},"E":{"gercek":"Dörtlü Takrir, CHP içindeki Celal Bayar, Menderes, Köprülü ve Koraltan tarafından 7 Haziran 1945\u0027te verilmiştir; Terakkiperver Cumhuriyet Fırkası 1925\u0027te kapanmıştır.","ayirt":"Dörtlü Takrir hangi partinin içinden, hangi yılda verildi?","paragraf":"İnkılap Tarihi - Çok Partili Hayata Geçiş","yanilgi":"Terakkiperver Cumhuriyet Fırkası ile Dörtlü Takrir\u0027i aynı çerçeveye koyuyorsun."},"A":{"gercek":"Millî Kalkınma Partisi\u0027ni Nuri Demirağ kurmuştur; Dörtlü Takrir imzacılarının bu partiyle kuruculuk bağı yoktur.","ayirt":"Bu dört isim doğrudan hangi partiyi kurdu, aradan başka parti geçti mi?","paragraf":"İnkılap Tarihi - Çok Partili Hayata Geçiş","yanilgi":"Dörtlü Takrir\u0027i verenlerin önce başka bir parti kurup sonra Demokrat Parti\u0027ye geçtiğini sanıyorsun."},"D":{"gercek":"Serbest Cumhuriyet Fırkası 1930\u0027da feshedilmiş, 1930-1945 arası CHP tek parti olarak yönetmiş, Demokrat Parti ancak 1946\u0027da kurulmuştur.","ayirt":"İki olay arasında kaç yıllık boşluk var, o dönemde kim yönetiyordu?","paragraf":"İnkılap Tarihi - Çok Partili Hayata Geçiş","yanilgi":"1930 ile 1946 arasında tek parti dönemi yaşanmadığını, iki oluşumun art arda geldiğini sanıyorsun."},"B":{"gercek":"18 Temmuz 1945\u0027te kurulan Millî Kalkınma Partisi, Demokrat Parti\u0027den (7 Ocak 1946) önce kurulmuştur.","ayirt":"1945 sonrası kurulan partilerin tarih sırası nedir?","paragraf":"İnkılap Tarihi - Çok Partili Hayata Geçiş","yanilgi":"Demokrat Parti çok konuşulduğu için ilk parti onun olduğunu sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 16"},"kural":"29 Ekim 1923\u0027te yapılan anayasa değişikliğiyle meclis hükümeti sistemi terk edilip cumhurbaşkanının atadığı başbakan ve onun seçtiği bakanlardan oluşan kabine sistemine geçilmiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 16","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıkta \u0027yeni anayasa/yeni kurum kuruldu\u0027 ifadesi geçiyorsa dikkatli ol, sınav genellikle mevcut düzenlemede değişiklik yapıldığını sorar.","konu":"cumhuriyet ilanı","tablo":{"satirlar":[["VERİLENLER","-","-"],["Cumhuriyet\u0027in ilanının yapıldığı gün","29","-"],["HESAP","-","-"],["A) Meclis hükümeti sisteminden kabine sistemine geçilerek h…","Cumhuriyetin İlanı - 29 Ekim 1923 anayasa değişikliği","doğru ifade"],["B) 1921 Anayasası yürürlükten kaldırılarak yerine yeni bir …","1921 Anayasası\u0027nda 29 Ekim 1923 değişikliği","YANLIŞ ifade"],["C) Türkiye Büyük Millet Meclisi\u0027nin ilk başbakanı Fethi Bey…","29 Ekim 1923 hükümet ataması","YANLIŞ ifade"],["D) Halifelik makamı aynı gün alınan kararla birlikte tamame…","Halifeliğin Kaldırılması - 3 Mart 1924","YANLIŞ ifade"],["E) Cumhurbaşkanı halkoyuyla doğrudan seçilerek göreve başla…","29 Ekim 1923 anayasa değişikliği - cumhurbaşkanlığı seçimi","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Türkiye Büyük Millet Meclisi\u0027nin ilk başbakanı Fethi Bey olarak görev yapmıştır.","E":"Cumhurbaşkanı halkoyuyla doğrudan seçilerek göreve başlamıştır.","A":"Meclis hükümeti sisteminden kabine sistemine geçilerek hükümet kurma sorunu çözülmüştür.","D":"Halifelik makamı aynı gün alınan kararla birlikte tamamen kaldırılmıştır.","B":"1921 Anayasası yürürlükten kaldırılarak yerine yeni bir anayasa kabul edilmiştir."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - cumhuriyet ilani","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: HAZIRLAYAN GELİŞMELER: 1 Kasım 1922\u0027de saltanat kaldırılmış, 24 Temmuz 1923 Lozan ile bağımsızlık tanınmış, 13 Ekim 1923\u0027te Ankara başkent olmuştu; ancak devletin adı ve devlet başkanının kim olacağı belirsizdi. Meclis hükümeti sisteminde bakanların meclis tarafından tek tek seçilmesi hükümet kurulmasını zorlaştırıyordu. HÜKÜMET BUNALIMI: Ekim 1923\u0027te Fethi (Okyar) Bey hükümeti istifa etti; meclis yeni hükümeti kuramadı. Mustafa Kemal, çözüm olarak kabine sistemine geçilmesini ve devletin şeklinin açıkça yazılmasını önerdi. ANAYASA DEĞİŞİKLİĞİ: 29 EKİM 1923\u0027te 1921 Anayasası\u0027nda (Teşkilat-ı Esasiye Kanunu) değişiklik yapıldı: \u0027Türkiye Devleti\u0027nin hükümet şekli Cumhuriyettir\u0027 hükmü eklendi; cumhurbaşkanının TBMM tarafından kendi üyeleri arasından seçilmesi, başbakanı cumhurbaşkanının atayıp bakanları başbakanın seçmesi (kabine sistemi) kabul edildi; devletin dinî İslam, resmî dili Türkçe olarak yazıldı (din maddesi 1928\u0027de çıkarıldı). Aynı gün MUSTAFA KEMAL ilk CUMHURBAŞKANI seçildi; İSMET (İNÖNÜ) Paşa ilk başbakan, Fethi Bey meclis başkanı oldu. SONUÇLAR: Devletin adı ve rejimi kesinleşti; devlet başkanlığı sorunu çözüldü; hükümet kurma kolaylaştı (kabine sistemi); millî egemenlik ilkesi kurumsallaştı. Halifelik henüz duruyordu; 3 Mart 1924\u0027te kaldırıldı. SINAV TUZAĞI: (1) Cumhuriyet\u0027in ilanı yeni bir anayasa değil, 1921 Anayasası\u0027nda DEĞİŞİKLİKtir; 1924 Anayasası sonra yapıldı. (2) Meclis hükümeti sisteminden KABİNE sistemine geçiş cumhuriyetle birliktedir. (3) İlk başbakan İsmet İnönü\u0027dür, Fethi Okyar değil. S…"}],"hakem":"Soru Cumhuriyet ilanıyla ilgili doğru kural soruyor; A şıkkı (meclis hükümeti → kabine sistemi geçişi) kaynak metinde açıkça destekleniyor ve tarihsel olarak 29 Ekim 1923\u0027te gerçekleşmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Hükümet bunalımını başlatan Fethi Bey\u0027in ilk başbakan olduğu düşünülebilir. Fakat İsmet Paşa ilk başbakan; Fethi Bey o gün meclis başkanlığına seçildi.","E":"Cumhurbaşkanının halk tarafından doğrudan seçildiği sanılabilir. Gerçekte Mustafa Kemal, 29 Ekim 1923\u0027te Türkiye Büyük Millet Meclisi üyeleri tarafından seçildi.","D":"Halifeliğin de Cumhuriyet\u0027le aynı gün kaldırıldığı akla geliyor. Oysa halifelik Cumhuriyet\u0027in ilanından üç ay sonra, 3 Mart 1924\u0027te ayrı bir kararla kaldırıldı.","B":"Cumhuriyet ilan edilirken tamamen yeni bir anayasa yapıldığı gibi görünüyor. Ancak 1921 Anayasası\u0027na yalnızca \u0027hükümet şekli Cumhuriyettir\u0027 hükmü eklendi; tamamen yeni 1924 Anayasası daha sonra çıkarıldı."},"dogru":"Meclis hükümeti sisteminde bakanları tek tek seçmek hükümet kurmayı zorlaştırıyordu. 29 Ekim 1923\u0027te cumhurbaşkanının başbakan atayıp başbakanın bakanları seçmesi (kabine sistemi) kabul edilerek bu sorun çözüldü.","sinav":"1921 Anayasası\u0027nda yapılan değişiklikle meclis hükümeti sisteminden kabine sistemine geçilerek hükümet kurma sorunu çözülmüştür.","kavramlar":[{"kaynak":"TEORI","tanim":"Bakanların Meclis tarafından tek tek seçildiği ve Meclis\u0027e karşı sorumlu olduğu hükümet sistemi.","ad":"Meclis hükümeti sistemi"},{"kaynak":"TEORI","tanim":"Cumhurbaşkanının başbakan atayıp başbakanın bakanları seçerek kurduğu hükümet sistemi.","ad":"Kabine sistemi"},{"kaynak":"TEORI","tanim":"Devletin hükümet şeklinin Cumhuriyet olarak 29 Ekim 1923\u0027te 1921 Anayasası\u0027na eklenen hüküm ile kesin olarak belirlenmesi.","ad":"Cumhuriyet"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/1"]},"oyun":null,"tip":"teori","soru":"1923 yılı sonunda meclis hükümetinin kurulamaması üzerine 29 Ekim 1923\u0027te 1921 Anayasası\u0027nda değişiklik yapılarak Cumhuriyet ilan edilmiştir. Buna göre, Cumhuriyet\u0027in ilanıyla ilgili aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-30","verilenler":[{"deger":"29","anlam":"Cumhuriyet\u0027in resmi olarak ilan edildiği tarihin günü; Türk tarihinde önemli bir referans noktasıdır.","ad":"Cumhuriyet\u0027in ilanının yapıldığı gün"}],"dayanak":"Atatürk İlkeleri ve İnkılap Tarihi - Cumhuriyetin İlanı, 29 Ekim 1923, 1921 Anayasası (Teşkilat-ı Esasiye Kanunu) değişikliği","dogru":"A","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1923\u0027te bir fabrika kurulacak, ortaklar yönetim kurulunu tek tek toplantıda seçmeye çalışıyor ama anlaşamıyorlar; sonunda \u0027bir genel müdür atayalım, o da ekibini kendi seçsin\u0027 diyorlar.","anlatim":"Aynı sıkıntı 1923\u0027te Türkiye\u0027de yaşandı: bakanlar meclis tarafından tek tek seçiliyordu ve Fethi Bey hükümeti istifa edince yeni hükümet kurulamadı. Çözüm, meclis hükümeti sistemini bırakıp cumhurbaşkanının başbakan atadığı, başbakanın da bakanlarını seçtiği kabine sistemine geçmekti. Bu değişiklik 29 Ekim 1923\u0027te 1921 Anayasası\u0027na eklendi ve aynı gün Cumhuriyet ilan edildi.","doldur":[]},{"formul":"Ne yapacağız: 29 Ekim 1923\u0027teki tek bir anayasa değişikliğiyle gelen sonuçları, bu olaydaki beş iddiayla karşılaştıracağız.","anlatim":"Kural şu: o gün hükümet sistemi değişti, anayasa değişti ama yürürlükten kalkmadı, ilk başbakan İsmet Paşa oldu, halifelik o gün kalkmadı, cumhurbaşkanını meclis seçti. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"Cumhuriyetin İlanı - 29 Ekim 1923 anayasa değişikliği","karar":"doğru","anlatim":"Evet, tam olarak bu oldu: 29 Ekim 1923\u0027te meclis hükümeti sistemi bırakılıp kabine sistemine geçildi. Bu değişiklik hükümet bunalımını çözdü ve Cumhuriyet ilanıyla birlikte gerçekleşti. Kaynaktaki anayasa değişikliği paragrafı bunu açıkça söylüyor.","formul":"Şık A: fabrika örneğindeki gibi, \u0027artık bakanları meclis tek tek seçmiyor, cumhurbaşkanı başbakanı atıyor, o da kendi ekibini kuruyor\u0027 değişikliği gerçekten Cumhuriyet\u0027in ilanıyla mı geldi, sen buna \u0027evet oldu\u0027 der misin?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"1921 Anayasası\u0027nda 29 Ekim 1923 değişikliği","karar":"yanlış","anlatim":"Hayır, 1921 Anayasası yürürlükten kalkmadı, ona sadece bir hüküm eklendi. Yeni anayasa (1924) daha sonra hazırlandı. Bu yüzden \u0027yürürlükten kaldırıldı\u0027 ifadesi yanlış.","formul":"Şık B: müdür \u0027biz eski anayasayı tamamen çöpe attık, sıfırdan yeni bir anayasa yazdık\u0027 diyor, buna katılır mısın?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"29 Ekim 1923 hükümet ataması","karar":"yanlış","anlatim":"Hayır, istifa eden Fethi Bey\u0027di ama ilk başbakan olan İsmet Paşa\u0027ydı; Fethi Bey meclis başkanı oldu. İstifa eden kişiyle ilk atanan kişi karıştırılıyor burada. Bu yüzden ifade yanlış.","formul":"Şık C: biri \u0027genel müdürlüğe ilk atanan kişi, istifa eden eski yöneticiydi\u0027 diyor, doğru mu?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"Halifeliğin Kaldırılması - 3 Mart 1924","karar":"yanlış","anlatim":"Hayır, halifelik o gün kaldırılmadı, dört ay sonra 3 Mart 1924\u0027te ayrı bir kararla kaldırıldı. Aynı gün olan tek şey Cumhuriyet ilanı ve kabine sistemiydi. Bu yüzden ifade yanlış.","formul":"Şık D: \u0027aynı gün, o toplantıda eski danışma kurulu da tamamen kapatıldı\u0027 diyorlar, bu doğru mu?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"29 Ekim 1923 anayasa değişikliği - cumhurbaşkanlığı seçimi","karar":"yanlış","anlatim":"Hayır, cumhurbaşkanını halk seçmedi, meclis kendi üyeleri arasından seçti. Mustafa Kemal böyle, meclis oylamasıyla seçildi. Bu yüzden ifade yanlış.","formul":"Şık E: \u0027genel müdürü tüm çalışanlar oy vererek doğrudan seçti\u0027 diyorlar, bu doğru mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Cumhuriyet\u0027in ilanıyla tek somut değişen şey hükümet kurma usulüdür, gerisi başka tarihlerde ya da başka biçimde oldu. Kendine hep şunu sor: bu olay tam 29 Ekim 1923\u0027te mi gerçekleşti, yoksa ben başka bir tarihi o güne mi yapıştırıyorum?","doldur":[]}],"anahtar":[{"ornek":"cumhuriyet","kok":"cumhur"},{"ornek":"meclis","kok":"meclis"},{"ornek":"sistemi","kok":"sistem"},{"ornek":"hükümeti","kok":"hüküme"},{"ornek":"anayasası","kok":"anayas"},{"ornek":"değişiklikle","kok":"değişi"}],"konuGiris":{"harita":"Ne zaman test edilir: Cumhuriyet\u0027in ilanının hangi tarihte ve hangi anayasal değişiklikle gerçekleştiği sorulduğunda. Nasıl ölçülür: hangi sonucun (isim, tarih, görev) cumhuriyetle birlikte geldiğinin doğru eşleştirilmesiyle ölçülür. Nasıl kaydedilir: bu bilgi ayrı bir kayıt gerektirmez, tarih-olay-sonuç sırasıyla ezberlenir.","desen":"Sınav en çok yeni anayasa yapıldığı yanılgısını kullanır; oysa mevcut 1921 Anayasası\u0027nda değişiklik yapılmıştır (p. Anayasa Değişikliği). İkinci tuzak ilk başbakanı Fethi Bey gibi göstermektir, doğrusu İsmet Paşa\u0027dır (p. Sonuçlar). Bu soru meclis hükümetinden kabine sistemine geçiş noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Bakanların meclisçe tek tek seçildiği, hükümet kurmayı güçleştiren sistem","ad":"Meclis hükümeti sistemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Başbakanın cumhurbaşkanınca atandığı, bakanları başbakanın seçtiği sistem","ad":"Kabine sistemi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yeni anayasa değil, mevcut anayasada yapılan ekleme ve düzenleme","ad":"1921 Anayasası değişikliği","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"29 Ekim 1923\u0027te TBMM üyeleri arasından seçilen devlet başkanı","ad":"İlk cumhurbaşkanı","kim":"kanun sabitler"}],"sinavda":"Soru, cumhuriyetin ilanına dair olayı verip bundan doğan doğru sonucu seçmeyi ister.","panel_ornek":"Arkadaşın eski usul her ay ev arkadaşlarıyla oy birliğiyle kira kararı alıyordu ama herkes ayrı fikirde olunca anlaşamıyorlardı; sonunda tek bir kişiyi \u0027ev sorumlusu\u0027 seçip kararları ona bıraktılar. Artık kararlar 3 gün değil 1 saatte çıkıyor. İşte meclis hükümetinden kabineye geçiş de böyle bir hızlanmaydı.","ornek":"Arkadaşın eski usul her ay ev arkadaşlarıyla oy birliğiyle kira kararı alıyordu ama herkes ayrı fikirde olunca anlaşamıyorlardı; sonunda tek bir kişiyi \u0027ev sorumlusu\u0027 seçip kararları ona bıraktılar. Artık kararlar 3 gün değil 1 saatte çıkıyor. İşte meclis hükümetinden kabineye geçiş de böyle bir hızlanmaydı.","yontemler":"Tarih-olay-sonuç sırasını (hükümet bunalımı → anayasa değişikliği → seçimler) zihinde tek çizgi hâlinde tutmak en kritik yöntemdir.","nedir":"Cumhuriyet\u0027in ilanı, 1923\u0027te yaşanan hükümet bunalımı sonucu devletin adının ve yönetim şeklinin anayasada netleştirilmesidir. Sınav, hangi değişikliğin cumhuriyetle geldiğini ve hangi kişinin hangi görevi aldığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Kişi Karıştırma Tuzağı","metin":"İlk başbakanı Fethi Bey sanırsın çünkü hükümet bunalımını o başlatmıştı. Doğrusu: İlk başbakan İsmet Paşa\u0027dır; Fethi Bey ise aynı gün meclis başkanlığına seçilmiştir."},"E":{"ad":"Usul Tuzağı","metin":"Cumhurbaşkanının halk tarafından seçildiğini düşünürsün. Doğrusu: Mustafa Kemal, 29 Ekim 1923\u0027te Türkiye Büyük Millet Meclisi tarafından kendi üyeleri arasından cumhurbaşkanı seçilmiştir."},"D":{"ad":"Zamanlama Tuzağı","metin":"Halifeliğin de Cumhuriyet\u0027le aynı anda kaldırıldığını sanırsın. Doğrusu: Halifelik, Cumhuriyet\u0027in ilanından sonra 3 Mart 1924\u0027te ayrı bir kararla kaldırılmıştır."},"B":{"ad":"Yeni Anayasa Tuzağı","metin":"Cumhuriyet ilan edilirken tamamen yeni bir anayasa yapıldığını düşünürsün. Doğrusu: 1921 Anayasası yürürlükte kalmış, yalnızca \u0027hükümet şekli Cumhuriyettir\u0027 hükmü eklenerek değişiklik yapılmış, 1924 Anayasası daha sonra çıkarılmıştır."}},"celdiriciYol":{},"hap":"Cumhuriyet, 1921 Anayasası\u0027nda y 27te Ankara başkent olmuştu; ancak devletin adı ve devlet başkanının kim olacağı belirsizdi. Meclis hükümeti sisteminde bakanların meclis tarafından tek tek seçilmesi hükümet kurulmasını zorlaştırıyordu. HÜKÜMET BUNALIMI: Ekim 1923\u0027te Fethi (Okyar) Bey hükümeti istifa etti; meclis yeni hükümeti kuramadı. Mustafa Kemal, çözüm olarak kabine sistemine geçilmesini ve devletin şeklinin açıkça yazılmasını önerdi. ANAYASA DEĞİŞİKLİĞİ: 29 EKİM 1923\u0027te 1921 Anayasası\u0027nda (Teşkilat-ı Esasiye Kanunu) değişiklik yapıldı: \u0027Türkiye Devleti\u0027nin hükümet şekli Cumhuriyettir\u0027 hükmü eklendi; cumhurbaşkanının TBMM tarafından kendi üyeleri arasından seçilmesi, başbakanı cumhurbaşkanının atayıp bakanları başbakanın seçmesi (kabine sistemi) kabul edildi; devletin dinî İslam, resmî dili Türkçe olarak yazıldı (din maddesi 1928\u0027de çıkarıldı). Aynı gün MUSTAFA KEMAL ilk CUMHURBAŞKANI seçildi; İSMET (İNÖNÜ) Paşa ilk başbakan, Fethi Bey meclis başkanı oldu. SONUÇLAR: Devletin adı ve rejimi kesinleşti; devlet başkanlığı sorunu çözüldü; hükümet kurma kolaylaştı (kabine sistemi); millî egemenlik ilkesi kurumsallaştı. Halifelik henüz duruyordu; 3 Mart 1924\u0027te kaldırıldı. SINAV TUZAĞI: (1) Cumhuriyet\u0027in ilanı yeni bir anayasa değil, 1921 Anayasası\u0027nda DEĞİŞİKLİKtir; 1924 Anayasası sonra yapıldı. (2) Meclis hükümeti sisteminden KABİNE sistemine geçiş cumhuriyetle birliktedir. (3) İlk başbakan İsmet İnönü\u0027dür, Fethi Okyar değil. S…"}],"hakem":"Soru, Cumhuriyet\u0027in ilanıyla birlikte hükümet sisteminde yaşanan değişimi sormakta; kaynak metinde açıkça \u0027meclis hükümeti sisteminden...kabine sistemine geçilmesi\u0027 belirtilmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Halifelik Cumhuriyet\u0027ten yaklaşık beş ay sonra, 3 Mart 1924\u0027te kaldırılmıştır. Cumhuriyet\u0027in ilanıyla aynı zamanda değil.","E":"İsmet Paşa ilk başbakan olmuştur. Meclis başkanlığına Fethi Bey seçilmiştir; İsmet Paşa bu göreve gelmemiştir.","D":"Saltanat zaten C 27na \u0027hükümet şekli Cumhuriyettir\u0027 hükmü eklenir, kabine sistemine geçilir; halifelik, saltanat, 1924 Anayasası, meclis başkanlığı ayrı olaylardır.","anlatim":"Bu beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"1921 Anayasası, 29 Ekim 1923 değişikliği","karar":"doğru","anlatim":"Evet, hükümet bunalımını çözen tam da bu değişikliktir. Meclis hükümeti sisteminden kabine sistemine geçilmiştir.","formul":"Şık A: müdür \u0027Cumhuriyet ilanıyla hükümet artık meclisçe tek tek seçilmiyor, başbakan bakanları kendisi seçiyor\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"1921 Anayasası değişikliği","karar":"yanlış","anlatim":"Hayır, 29 Ekim 1923\u0027te yapılan sadece 1921 Anayasası\u0027na madde eklemektir. 1924 Anayasası bundan sonra hazırlanmıştır.","formul":"Şık B: arkadaşın \u0027bu tarihte tamamen yeni bir anayasa yazıldı\u0027 diyor, onaylar mısın?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"3 Mart 1924 halifeliğin kaldırılışı","karar":"yanlış","anlatim":"Hayır, halifelik o gün duruyordu. Kaldırılması 3 Mart 1924\u0027te başka bir kararla olmuştur.","formul":"Şık C: birisi \u0027aynı gün halifelik de kaldırıldı\u0027 diyor, doğru mu?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"1 Kasım 1922 saltanatın kaldırılışı","karar":"yanlış","anlatim":"Hayır, saltanat 1 Kasım 1922\u0027de kaldırılmıştı. Bu olay Cumhuriyet ilanına zaten zemin hazırlayan önceki bir adımdır.","formul":"Şık D: \u0027saltanat da bu tarihte kaldırıldı\u0027 diyorlar, sen ne dersin?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"29 Ekim 1923 hükümet ataması","karar":"yanlış","anlatim":"Hayır, İsmet Paşa o gün başbakan olmuştur. Meclis başkanlığına Fethi Bey seçilmiştir.","formul":"Şık E: \u0027İsmet Paşa o gün meclis başkanlığına seçildi\u0027 iddiasına katılır mısın?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Cumhuriyet\u0027in ilanı asıl olarak hükümet kurma sorununu kabine sistemiyle çözmüştür. Kendine sor: bu değişiklik hükümetin NASIL kurulacağını mı düzenliyor, yoksa başka bir kurumu mu?","doldur":[]}],"anahtar":[{"ornek":"sistemine","kok":"sistem"},{"ornek":"meclis","kok":"meclis"},{"ornek":"hükümetinden","kok":"hüküme"},{"ornek":"cumhuriyet","kok":"cumhur"},{"ornek":"başbakanı","kok":"başbak"},{"ornek":"anayasası","kok":"anayas"}],"konuGiris":{"harita":"Ne zaman test edilir: Cumhuriyet\u0027in ilanının hangi sorunu çözdüğü ve hangi sistemi getirdiği sorulduğunda test edilir. Nasıl ölçülür: 29 Ekim 1923 değişikliğinin içeriği ile önceki/sonraki dönemlerin karıştırılıp karıştırılmadığına bakılarak ölçülür. Nasıl kaydedilir: olay-tarih-sonuç zinciri olarak, hangi değişikliğin hangi tarihte olduğu şeklinde kaydedilir.","desen":"Soru genelde \u0027Cumhuriyet\u0027in ilanıyla aşağıdakilerden hangisi gerçekleşmiştir?\u0027 şeklinde sorulur ve öğrenciyi ilk başbakanın kim olduğu ya da yeni bir anayasa mı yapıldığı konusunda yanıltmayı hedefler. Tuzak, meclis hükümeti sisteminden kabine sistemine geçişin cumhuriyetle birlikte olduğunu unutturmaktır. Bu soru p.28\u0027deki olay-tarih-sonuç zincirinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Bakanların meclis tarafından tek tek seçildiği, hükümet kurmayı güçleştiren sistem.","ad":"Meclis hükümeti sistemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Başbakanın cumhurbaşkanınca atandığı, bakanları başbakanın seçtiği yönetim biçimi.","ad":"Kabine sistemi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Yeni anayasa değil, mevcut anayasaya eklenen hükümlerle rejimin belirlenmesi.","ad":"1921 Anayasası değişikliği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"TBMM\u0027nin kendi üyeleri arasından devlet başkanını seçme yetkisi.","ad":"Cumhurbaşkanlığı seçimi","kim":"kanun sabitler"}],"sinavda":"29 Ekim 1923 gelişmesi verilir, bu gelişmenin sonucunda hangi değişikliğin gerçekleştiği sorulur.","panel_ornek":"Bir arkadaş grubu ev arkadaşlığı kurmak istiyor ama kimin kirayı ödeyeceği, kimin evi yöneteceği belirsiz kalınca ev bir türlü tutulamıyor. Sonunda aralarında yazılı bir anlaşma yapıp bir \u0027sorumlu\u0027 seçiyorlar, böylece ev kiralanabiliyor. 3 kişi anlaşmayı imzalıyor, karar 1 günde çıkıyor.","ornek":"Bir arkadaş grubu ev arkadaşlığı kurmak istiyor ama kimin kirayı ödeyeceği, kimin evi yöneteceği belirsiz kalınca ev bir türlü tutulamıyor. Sonunda aralarında yazılı bir anlaşma yapıp bir \u0027sorumlu\u0027 seçiyorlar, böylece ev kiralanabiliyor. 3 kişi anlaşmayı imzalıyor, karar 1 günde çıkıyor.","yontemler":"Tarihleri ve kişileri (İsmet İnönü ilk başbakan, Fethi Bey meclis başkanı) birbirine karıştırmadan zincir halinde ezberlemek en kritik yöntemdir.","nedir":"Cumhuriyet\u0027in ilanı, 1923\u0027te devletin rejimini ve yönetim biçimini belirleyen anayasa değişikliğidir. Sınav bu değişikliğin hangi sonuçları doğurduğunu ve hangi tuzak bilgilerle karıştırıldığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Zamanlama Tuzağı","metin":"Halifeliğin kaldırılmasını Cumhuriyet\u0027in ilanıyla aynı anda sanıyorsun. Doğrusu: Halifelik 3 Mart 1924\u0027te, Cumhuriyet\u0027ten sonra kaldırılmıştır."},"E":{"ad":"Görev Karışıklığı Tuzağı","metin":"29 Ekim 1923\u0027te İsmet Paşa\u0027nın meclis başkanı olduğunu sanıyorsun. Doğrusu: İsmet Paşa ilk başbakan olmuş, meclis başkanlığına Fethi Bey seçilmiştir."},"D":{"ad":"Zamanlama Tuzağı","metin":"Saltanatın kaldırılmasını Cumhuriyet\u0027in ilanının sonucu sanıyorsun. Doğrusu: Saltanat 1 Kasım 1922\u0027de, Cumhuriyet\u0027ten önce kaldırılmıştır."},"B":{"ad":"Kapsam Tuzağı","metin":"Cumhuriyet\u0027in ilanını yeni bir anayasanın yapılması sanıyorsun. Doğrusu: 29 Ekim 1923\u0027te 1921 Anayasası\u0027nda değişiklik yapılmıştır; 1924 Anayasası daha sonradır."}},"celdiriciYol":{"C":"Cumhuriyet ilanı ile halifeliğin kaldırılması aynı tarihe yerleştirilir (zamanlama hatası, 3 Mart 1924 unutulur)","E":"İsmet Paşa\u0027nın başbakanlığı ile Fethi Bey\u0027in meclis başkanlığı yer değiştirilir (görev-kişi karışıklığı)","D":"Cumhuriyet ilanı ile saltanatın kaldırılması aynı olay sanılır (zamanlama hatası, 1 Kasım 1922 unutulur)","B":"Cumhuriyet ilanı = yeni anayasa sanılır, 1924 Anayasası ile karıştırılır (anayasa yapımı-değişikliği karışıklığı)"},"hap":"Cumhuriyet\u0027in ilanı 1921 Anayasası\u0027nda değişikliktir; getirdiği asıl yenilik meclis hükümetinden kabine sistemine geçiştir.","teshis":{"C":{"gercek":"Halifelik, Cumhuriyet\u0027in ilanından sonra, 3 Mart 1924\u0027te ayrı bir kararla kaldırılmıştır.","ayirt":"Bu olay 29 Ekim 1923\u0027te mi yoksa daha sonra mı gerçekleşti?","paragraf":"3 Mart 1924 halifeliğin kaldırılışı","yanilgi":"Halifeliğin Cumhuriyet ilanıyla birlikte kaldırıldığını sanıyorsun."},"E":{"gercek":"O gün İsmet Paşa ilk başbakan, Mustafa Kemal ilk cumhurbaşkanı olmuş, meclis başkanlığına Fethi Bey seçilmiştir.","ayirt":"Bu kişi hangi görevi, başbakanlığı mı meclis başkanlığını mı üstlendi?","paragraf":"29 Ekim 1923 hükümet ataması","yanilgi":"29 Ekim 1923\u0027te İsmet Paşa\u0027nın meclis başkanlığına seçildiğini sanıyorsun."},"A":{"gercek":"29 Ekim 1923 değişikliğiyle kabine sistemine geçilmiş, başbakan cumhurbaşkanınca atanmış, bakanları başbakan seçmiştir.","ayirt":"Bu değişiklik hükümetin NASIL kurulacağını mı düzenliyor?","paragraf":"1921 Anayasası, 29 Ekim 1923 değişikliği","yanilgi":"Bu şıkkı eleyen öğrenci Cumhuriyet ilanını yalnız isim değişikliği sanır, hükümet sisteminin de değiştiğini gözden kaçırır."},"D":{"gercek":"Saltanat 1 Kasım 1922\u0027de kaldırılmış, Cumhuriyet\u0027in ilanına zaten zemin hazırlayan önceki bir adımdır.","ayirt":"Bu olay Cumhuriyet ilanından önce mi sonra mı yaşandı?","paragraf":"1 Kasım 1922 saltanatın kaldırılışı","yanilgi":"Saltanatın kaldırılmasını Cumhuriyet\u0027in ilanının bir sonucu sanıyorsun."},"B":{"gercek":"29 Ekim 1923\u0027te yapılan, mevcut 1921 Anayasası\u0027na madde eklenmesidir; 1924 Anayasası ayrı ve sonraki bir düzenlemedir.","ayirt":"Bu tarihte anayasa değiştirildi mi yoksa yeniden mi yazıldı?","paragraf":"1921 Anayasası (Teşkilat-ı Esasiye Kanunu) değişikliği","yanilgi":"Cumhuriyet ilanını bütünüyle yeni bir anayasa yapımı sanıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 18"},"kural":"Lozan\u0027ın öngördüğü Türkiye-İngiltere ikili görüşmesi, 19 Mayıs-5 Haziran 1924\u0027te İstanbul\u0027da toplanan Haliç Konferansı\u0027dır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 18","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Tarih ve yer verilen sorularda önce olayın tarafları (kaç devlet, hangi devletler) ayıklanır; ikili görüşme ile çok taraflı konferans birbirine karıştırılmamalıdır.","konu":"haliç konferansı","tablo":{"satirlar":[["VERİLENLER","-","-"],["tarih aralığı","19 Mayıs - 5 Haziran 1924","-"],["HESAP","-","-"],["A) Lozan Konferansı","Lozan Barış Antlaşması, sınır hükümleri","YANLIŞ ifade"],["B) Haliç Konferansı","Haliç Konferansı, 1924","doğru ifade"],["C) Montrö Konferansı","Montrö Boğazlar Sözleşmesi","YANLIŞ ifade"],["D) 1921 Ankara Antlaşması görüşmeleri","1921 Ankara Antlaşması / 1926 Ankara Antlaşması","YANLIŞ ifade"],["E) Milletler Cemiyeti\u0027nin Musul için oluşturduğu komisyon g…","Milletler Cemiyeti süreci, 1925","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Montrö Konferansı","E":"Milletler Cemiyeti\u0027nin Musul için oluşturduğu komisyon görüşmeleri","A":"Lozan Konferansı","D":"1921 Ankara Antlaşması görüşmeleri","B":"Haliç Konferansı"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - halic konferansi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Lozan Barış Antlaşması Irak sınırını, yani MUSUL sorununu, Türkiye ile İngiltere arasında dokuz ay içinde yapılacak ikili görüşmelere bırakmış; anlaşma olmazsa konunun Milletler Cemiyeti\u0027ne götürülmesini öngörmüştü. HALİÇ KONFERANSI bu ikili görüşmedir: 19 MAYIS – 5 HAZİRAN 1924 tarihleri arasında İstanbul\u0027da toplandı. Türk heyetine Fethi (Okyar) Bey, İngiliz heyetine Sır Percy Cox başkanlık etti. Türkiye Musul\u0027un Misak-ı Millî sınırları içinde olduğunu, halkın çoğunluğunun Türk ve Kürt olduğunu, halkoyuna gidilmesini savundu; İngiltere ise Musul\u0027un Irak\u0027a ait olduğunu ileri sürdü, hatta Hakkâri\u0027yi de istedi. Konferans SONUÇSUZ dağıldı. Sorun Milletler Cemiyeti\u0027ne gitti; Cemiyet\u0027in gönderdiği komisyonun raporuna dayanarak 1925\u0027te Musul\u0027un İngiliz mandasındaki Irak\u0027a bırakılması kararlaştırıldı. Aynı dönemde çıkan Şeyh Sait İsyanı (Şubat 1925) Türkiye\u0027nin askerî seçeneğini zayıflattı. Türkiye, 5 HAZİRAN 1926 ANKARA ANTLAŞMASI ile Musul\u0027un Irak\u0027a ait olduğunu kabul etti; buna karşılık Musul petrol gelirlerinin yüzde onunun 25 yıl süreyle Türkiye\u0027ye verilmesi kararlaştırıldı (Türkiye bu payı daha sonra toptan ödemeyle aldı). SONUÇ: Musul, Misak-ı Millî\u0027den verilen önemli bir ödün olarak tarihe geçti; Türkiye-İngiltere ilişkileri normale döndü. SINAV TUZAĞI: (1) Haliç Konferansı Türkiye–İngiltere ikili görüşmesidir, uluslararası konferans değildir. (2) Musul sorununu çözen antlaşma 1926 ANKARA Antlaşması\u0027dır; 1921 Ankara Antlaşması Fransa ile yapılmış ve Suriye sınırını çizmiştir; ikisi karıştırılır. (3) Cemiyet kâr…"}],"hakem":"Soru, Lozan Antlaşması sonrasında Musul sorunu için yapılan Türkiye-İngiltere ikili görüşmesinin adını sormakta; kaynak metni, 19 Mayıs-5 Haziran 1924\u0027te İstanbul\u0027da toplanan görüşmenin Haliç Konferansı olduğunu açıkça belirtmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Montrö Konferansı Boğazlar konusunu düzenleyen başka bir konferanstır. Musul sorunu ile ilgili değildir.","E":"Milletler Cemiyeti\u0027nin Musul için komisyon oluşturması, Haliç Konferansı sonuçsuz kaldıktan sonraki aşamadır. Soruda sorulan 1924 tarihli görüşme Cemiyet süreci değildir.","D":"1921 Ankara Antlaşması Fransa ile yapılmış ve Suriye sınırını belirlemiştir. Musul\u0027u çözen antlaşma 1926 Ankara Antlaşması\u0027dır.","A":"Lozan Konferansı 1923\u0027te gerçekleşmiş ve Musul sorununu çözmemiş, sadece çözüm yolunu belirlemiştir. Soruda sorulan 1924 tarihli görüşme Lozan\u0027ın öngördüğü ikili görüşmedir."},"dogru":"Lozan Antlaşması Musul sorununu doğrudan çözmedi, Türkiye ile İngiltere\u0027yi dokuz ay içinde ikili görüşmeye çağırdı. 19 Mayıs - 5 Haziran 1924\u0027te İstanbul\u0027da Fethi Bey ve Sır Percy Cox başkanlığında toplanan bu görüşme Haliç Konferansı\u0027dır ve sonuçsuz kalmıştır.","sinav":"Lozan Barış Antlaşması Musul sorununu Türkiye ile İngiltere arasında dokuz ay içinde yapılacak ikili görüşmelere bırakmış ve bu görüşme 19 Mayıs - 5 Haziran 1924 tarihleri arasında İstanbul\u0027da toplanan Haliç Konferansı\u0027dır.","kavramlar":[{"kaynak":"TEORI","tanim":"Lozan Antlaşması\u0027nın öngördüğü, Türkiye ile İngiltere arasında Musul sorununu çözmek için 19 Mayıs - 5 Haziran 1924 tarihleri arasında İstanbul\u0027da yapılan ikili görüşmedir.","ad":"Haliç Konferansı"},{"kaynak":"TEORI","tanim":"Lozan Antlaşması\u0027nda Türkiye ile İngiltere arasında çözülemeyen, Irak sınırının ve Musul bölgesinin kime ait olacağı konusudur.","ad":"Musul sorunu"},{"kaynak":"TEORI","tanim":"Türkiye\u0027nin Birinci Dünya Savaşı sonrasında istediği sınırları belirleyen ilkeler; Türk heyeti Musul\u0027un bu sınırlar içinde olması gerektiğini savunmuştur.","ad":"Misak-ı Millî"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"Lozan Barış Antlaşması, Musul sorununun çözümünü Türkiye ile İngiltere arasında dokuz ay içinde yapılacak ikili görüşmelere bırakmıştı. Bu çerçevede 19 Mayıs - 5 Haziran 1924 tarihleri arasında İstanbul\u0027da yapılan görüşme aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-31","verilenler":[{"deger":"19 Mayıs - 5 Haziran 1924","anlam":"sorulan görüşmenin gerçekleştiği süreyi belirtir, hangi olayın sorulduğunu tarihle ayırt eder","ad":"tarih aralığı"}],"dayanak":"İnkılap Tarihi ders içeriği - Lozan sonrası Musul sorunu ve Haliç Konferansı","dogru":"B","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 19 Mayıs - 5 Haziran 1924\u0027te İstanbul\u0027da, Türk heyeti başkanı Fethi Bey ile İngiliz heyeti başkanı Sır Percy Cox, Musul sınırını çizmek için masaya oturuyor.","anlatim":"Türkiye, Musul\u0027un Misak-ı Millî sınırları içinde olduğunu ve halkoyuna gidilmesini söylüyor. İngiltere ise Musul\u0027u Irak\u0027a bağlamak istiyor, hatta Hakkâri\u0027yi de istiyor. Görüşme dokuz gün sonra dağılıyor, hiçbir anlaşma çıkmıyor.","doldur":[]},{"formul":"Ne yapacağız: Lozan, Musul\u0027u dokuz ay içinde ikili görüşmeye havale etmişti; bu görüşme 19 Mayıs-5 Haziran 1924\u0027te İstanbul\u0027da yapıldı ve sonuçsuz kaldı.","anlatim":"Şimdi beş şıktaki adları bu tek olayın tarihine ve tarafına tek tek yakıştırıp bakacağız.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"Lozan Barış Antlaşması, sınır hükümleri","karar":"yanlış","anlatim":"Lozan, Musul\u0027u çözmüyor, dokuz aylık süreye havale ediyor; kendisi ayrı, sonraki görüşme ayrı bir olaydır. İstanbul\u0027daki bu toplantı Lozan\u0027ın kendisi değil, Lozan\u0027ın öngördüğü ikili görüşmedir.","formul":"Şık A: bu İstanbul görüşmesine \u0027Lozan Konferansı\u0027 desem, doğru mu derim?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"Haliç Konferansı, 1924","karar":"doğru","anlatim":"Evet, tarih ve yer birebir örtüşüyor; Türkiye-İngiltere arasındaki bu ikili görüşmenin adı Haliç Konferansı\u0027dır. Sonuç sonuçsuzluktur, ama görüşmenin kendi adı budur.","formul":"Şık B: Fethi Bey ile Percy Cox\u0027un 19 Mayıs-5 Haziran 1924\u0027te İstanbul\u0027da yaptığı bu görüşmenin adı Haliç Konferansı mıdır?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"Montrö Boğazlar Sözleşmesi","karar":"yanlış","anlatim":"Montrö 1936\u0027da Boğazlar için toplanmıştır, Musul ile hiç ilgisi yok. Tarih de konu da örtüşmüyor, bu ikisini birbirine karıştırırsın diye tuzak kuruluyor.","formul":"Şık C: bu İstanbul görüşmesi Montrö Konferansı mıdır dersem, tutar mı?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"1921 Ankara Antlaşması / 1926 Ankara Antlaşması","karar":"yanlış","anlatim":"1921 Ankara Antlaşması Fransa ile yapılmıştır ve Suriye sınırını çizer, İngiltere ile Musul\u0027u konuşmaz. Musul\u0027u çözen antlaşma 1926 Ankara Antlaşması\u0027dır, o da 1924 Haliç görüşmesinden iki yıl sonradır.","formul":"Şık D: 1921 Ankara Antlaşması görüşmeleri desem, bu olayı doğru anlatmış olur muyum?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"Milletler Cemiyeti süreci, 1925","karar":"yanlış","anlatim":"Cemiyet komisyonu, Haliç Konferansı sonuçsuz kalınca devreye girmiştir, yani sonraki aşamadır. İstanbul\u0027daki bu tarih Cemiyet sürecine değil, ikili görüşmeye aittir.","formul":"Şık E: Milletler Cemiyeti\u0027nin Musul komisyonu görüşmeleri desem, bu 19 Mayıs-5 Haziran İstanbul toplantısı olur mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Bu İstanbul toplantısı, Türkiye ile İngiltere arasındaki tek ikili görüşme olan Haliç Konferansı\u0027dır. Kendine hep şunu sor: bu isim, Türkiye ile başka bir tek devlet arasında mı, yoksa çok taraflı ya da sonraki bir aşamada mı geçiyor?","doldur":[]}],"anahtar":[{"ornek":"görüşmesi","kok":"görüşm"},{"ornek":"türkiye","kok":"türkiy"},{"ornek":"İngiltere","kok":"İngilt"},{"ornek":"konferansı","kok":"konfer"},{"ornek":"toplanan","kok":"toplan"},{"ornek":"İstanbul","kok":"İstanb"}],"konuGiris":{"harita":"Ne zaman test edilir: Musul sorununun çözüm sürecindeki görüşme ve antlaşma tarihleri sorulduğunda. Nasıl ölçülür: Haliç Konferansı ile 1926 Ankara Antlaşması\u0027nın birbirine karıştırılmadan doğru eşleştirilmesiyle. Nasıl kaydedilir: Tarih, taraflar ve sonuçsuz/sonuçlu bilgisiyle bir olaylar zinciri olarak.","desen":"Sınav genelde Haliç Konferansı\u0027nı 1921 Ankara Antlaşması ya da Lozan ile karıştırtmaya çalışır (p.28). Bir diğer tuzak, sonuçsuz kalan görüşmeyle sorunu çözen 1926 antlaşmasının birbirine karıştırılmasıdır. Bu soru, tarih ve taraf ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Musul için Türkiye-İngiltere arasında 1924\u0027te yapılan sonuçsuz ikili görüşme","ad":"Haliç Konferansı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Musul\u0027u da içine alan milli sınırları belirleyen ilke kararı","ad":"Misak-ı Millî","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Musul\u0027u Irak\u0027a bırakan 1925 uluslararası hakem kararı","ad":"Milletler Cemiyeti kararı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Musul\u0027un Irak\u0027a ait olduğunu kabul eden nihai antlaşma","ad":"1926 Ankara Antlaşması","kim":"kanun sabitler"}],"sinavda":"Soruda tarih ve şehir verilir, bu görüşmenin adı istenir.","panel_ornek":"Bir arkadaşın kiraladığı evde çıkan anlaşmazlığı önce ev sahibiyle kendisi çözmeye çalışır, olmazsa mahkemeye gider. İki taraf 3 hafta görüşür ama anlaşamaz ve konu üst mercie taşınır. İşte bu \u0027önce ikili görüşme, olmazsa üst mercie gitme\u0027 mantığı Musul sorununda da yaşanmıştır.","ornek":"Bir arkadaşın kiraladığı evde çıkan anlaşmazlığı önce ev sahibiyle kendisi çözmeye çalışır, olmazsa mahkemeye gider. İki taraf 3 hafta görüşür ama anlaşamaz ve konu üst mercie taşınır. İşte bu \u0027önce ikili görüşme, olmazsa üst mercie gitme\u0027 mantığı Musul sorununda da yaşanmıştır.","yontemler":"Tarihleri ezberlemek yerine \u0027önce ikili görüşme (1924, sonuçsuz), sonra üst merci kararı (1925), sonra nihai antlaşma (1926)\u0027 sıralamasını akılda tutmak yeterlidir.","nedir":"Bu konu Lozan\u0027ın çözemediği Musul sorununun Türkiye-İngiltere arasında nasıl ele alındığını anlatır. Sınav, hangi görüşmenin hangi tarihte ve hangi sonuçla bittiğini ayırt etmeyi ölçer."},"olay":"","tuzak":{"C":{"ad":"Karıştırma Tuzağı","metin":"Boğazlar konusuyla ilgili başka bir konferansı Musul görüşmesiyle karıştırırsın. Doğrusu: Montrö, Boğazlar sorununu ele alır; Musul\u0027la ilgisi yoktur."},"E":{"ad":"Zamanlama/Aşama Tuzağı","metin":"Konferans sonrası başlayan Cemiyet sürecini konferansın kendisi sanırsın. Doğrusu: Milletler Cemiyeti süreci, Haliç Konferansı sonuçsuz kalınca BAŞLAYAN sonraki aşamadır, sorudaki tarihli görüşmenin adı değildir."},"D":{"ad":"Taraf Karıştırma Tuzağı","metin":"1921\u0027de Ankara\u0027da yapılan bir antlaşmayı bu görüşmeyle özdeşleştirirsin. Doğrusu: 1921 Ankara Antlaşması Fransa ile yapılmış, Suriye sınırını belirlemiştir; Musul\u0027u çözen 1926 Ankara Antlaşması\u0027yla da farklıdır."},"A":{"ad":"Kapsam Tuzağı","metin":"Lozan\u0027ın Musul sorununu bizzat çözdüğünü sanırsın. Doğrusu: Lozan bu sorunu çözmemiş, ikili görüşmeye havale etmiştir; görüşmenin adı Haliç Konferansı\u0027dır."}},"celdiriciYol":null,"hap":"Musul sorununu çözmek için yapılan Türkiye-İngiltere ikili görüşmesi Haliç Konferansı\u0027dır, sonuçsuz kalmış ve sorun Milletler Cemiyeti\u0027ne gitmiştir.","teshis":{"C":{"gercek":"Montrö Boğazlar Sözleşmesi 1936\u0027da yapılmıştır ve konusu Boğazlar\u0027dır, Musul\u0027la ilgisizdir.","ayirt":"Bu konferansın konusu sınır mı, Boğazlar mı?","paragraf":"Montrö Boğazlar Sözleşmesi","yanilgi":"Boğazlar ile Musul konularını aynı görüşme başlığı altında topladığını düşünüyorsun."},"E":{"gercek":"Haliç Konferansı sonuçsuz kalınca sorun Milletler Cemiyeti\u0027ne götürülmüş, bu ayrı ve sonraki bir aşamadır.","ayirt":"Sorudaki tarih, konferansın kendisine mi yoksa sonraki sürece mi ait?","paragraf":"Milletler Cemiyeti süreci, 1925","yanilgi":"Konferans sonrası sürecin, konferansın kendisi olduğunu sanıyorsun."},"A":{"gercek":"Lozan, Musul sınırını dokuz ay içinde yapılacak ikili görüşmeye bırakmış, çözmemiştir.","ayirt":"Bu antlaşma sorunu kapatıyor mu, yoksa ileri bir tarihe mi havale ediyor?","paragraf":"Lozan Barış Antlaşması, sınır hükümleri","yanilgi":"Lozan\u0027ın her sorunu kesin çözdüğünü, Musul\u0027un da orada bittiğini düşünüyorsun."},"D":{"gercek":"1921 Ankara Antlaşması Fransa ile yapılmış olup Suriye sınırını belirler; Musul sorunu 1926 Ankara Antlaşması ile İngiltere\u0027yle çözülmüştür.","ayirt":"Bu antlaşma hangi ülkeyle yapılmış ve hangi sınırı belirlemiş?","paragraf":"1921 Ankara Antlaşması / 1926 Ankara Antlaşması","yanilgi":"Ankara adını görünce tarihi ve tarafı ayırt etmeden aynı antlaşmayı düşünüyorsun."},"B":{"gercek":"19 Mayıs-5 Haziran 1924 İstanbul görüşmesi, Fethi Bey ve Percy Cox başkanlığındaki Haliç Konferansı\u0027dır ve sonuçsuz dağılmıştır.","ayirt":"Tarih ve yer eşleşmesi hangi olaya birebir uyuyor?","paragraf":"Haliç Konferansı, 1924","yanilgi":"Bu şıkkı elersen, tarih-yer eşleşmesini başka bir olaya bağladığın için doğru adı gözden kaçırırsın."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 20"},"kural":"İttifak Devletleri 1918\u0027de sırayla ateşkes istemiştir; Bulgaristan 29 Eylül 1918\u0027de Selanik Ateşkesi\u0027ni imzalayarak ilk çekilen devlet olmuştur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 20","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Tarih sorularında sıra, imzacı kişi ve belge türünü (ateşkes/barış) birbirinden ayrı kontrol et.","konu":"i. dünya savaşı ateşkes","tablo":{"satirlar":[["A) Osmanlı Devleti, İttifak Devletleri içinde ateşkes istey…","İttifak Devletleri ateşkes kronolojisi","YANLIŞ ifade"],["B) Mondros Ateşkes Antlaşması, Osmanlı Devleti adına Talat …","Mondros Ateşkes Antlaşması imzacıları","YANLIŞ ifade"],["C) Bulgaristan, 29 Eylül 1918\u0027de imzaladığı Selanik Ateşkes…","İttifak Devletleri ateşkes kronolojisi","doğru ifade"],["D) Mondros Ateşkes Antlaşması, Osmanlı Devleti ile İtilaf D…","Mondros Ateşkes Antlaşması / Sevr ayrımı","YANLIŞ ifade"],["E) Avusturya-Macaristan, Almanya ile aynı tarihte ateşkes i…","İttifak Devletleri ateşkes kronolojisi","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Bulgaristan, 29 Eylül 1918\u0027de imzaladığı Selanik Ateşkesi ile savaştan çekilen ilk İttifak devletidir.","E":"Avusturya-Macaristan, Almanya ile aynı tarihte ateşkes imzalayarak savaşı birlikte sonlandırmıştır.","A":"Osmanlı Devleti, İttifak Devletleri içinde ateşkes isteyen ilk devlettir.","D":"Mondros Ateşkes Antlaşması, Osmanlı Devleti ile İtilaf Devletleri arasında imzalanmış bir barış antlaşmasıdır.","B":"Mondros Ateşkes Antlaşması, Osmanlı Devleti adına Talat Paşa tarafından imzalanmıştır."},"kaynak":{"alinti":"Bulgaristan 29 Eylül 1918","liste":[{"ad":"TEORI - i. dunya savasi ateskes","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: 1918 yılında İttifak Devletleri sırayla ateşkes istedi. BULGARİSTAN 29 Eylül 1918\u0027de Selanik Ateşkesi\u0027ni imzalayarak savaştan ilk çekilen devlet oldu; bu, Osmanlı ile Almanya arasındaki kâra bağlantısını kesti ve Osmanlı\u0027nın savaşı sürdürmesini imkânsızlaştırdı. OSMANLI DEVLETİ 30 EKİM 1918\u0027de Limni Adası\u0027nın Mondros Limanı\u0027nda, Agamemnon zırhlısında MONDROS ATEŞKES ANTLAŞMASI\u0027nı imzaladı; Osmanlı heyetine Bahriye Nazırı Rauf (Orbay) Bey, İtilaf tarafına İngiliz Amiral Calthorpe başkanlık etti. Savaşı yürüten İttihat ve Terakki hükümeti (Talat Paşa) istifa etmiş, ateşkesi Ahmet İzzet Paşa hükümeti imzalamıştı. AVUSTURYA-MACARİSTAN 3 Kasım 1918\u0027de Villa Giusti, ALMANYA 11 Kasım 1918\u0027de Rethondes (Compiègne) ateşkesini imzaladı; savaş böylece bitti. Osmanlı yönetimi ateşkesi imzalarken Wilson İlkelerine (galiplerin toprak almayacağı, milletlerin kendi geleceğini belirleyeceği) güveniyordu; ancak Mondros\u0027un ağır hükümleri ve hemen başlayan işgaller bu güveni boşa çıkardı. Ateşkes barış antlaşması değildir; Osmanlı için barış antlaşması ancak 10 Ağustos 1920\u0027de Sevr\u0027de imzalanmış, o da uygulanmamıştır. SINAV TUZAĞI: (1) Savaştan ilk çekilen Bulgaristan\u0027dır (Eylül 1918); Osmanlı ikinci sıradadır. (2) Mondros bir ATEŞKESTİR, barış antlaşması değildir; Sevr ile karıştırılmaz. (3) Mondros\u0027u imzalayan Osmanlı temsilcisi Rauf Orbay\u0027dır, Enver veya Talat Paşa değil. SINAVDA NASIL SORULUR: \u0027I. Dünya Savaşı\u0027ndan ilk çekilen İttifak devleti hangisidir?\u0027 ya da \u0027Mondros Ateşkes Antlaşması\u0027nı Osmanlı Devleti adına kim imzalamışt…"},{"ad":"TEORI - i. dunya savasi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: I. Dünya Savaşı 1914–1918 yılları arasında İtilaf Devletleri (İngiltere, Fransa, Rusya; sonra İtalya, ABD) ile İttifak Devletleri (Almanya, Avusturya-Macaristan; sonra Osmanlı Devleti, Bulgaristan) arasında yapıldı. NEDENLER: Sömürgecilik ve ham madde yarışı, Almanya–İngiltere ekonomik rekabeti, Fransa\u0027nın Alsas-Loren\u0027i geri alma isteği, Balkanlar\u0027da Rusya–Avusturya çekişmesi, silahlanma ve bloklaşma; görünürdeki neden Avusturya veliahdının Saraybosna\u0027da öldürülmesidir. OSMANLI\u0027NİN GİRİŞİ: Osmanlı Devleti 1914 sonbaharında Almanya yanında savaşa girdi; Goeben ve Breslau gemilerinin Karadeniz\u0027de Rus limanlarını vurması fiilî girişi sağladı. Nedenler: kaybedilen toprakları geri alma umudu, Almanya\u0027nın savaşı kazanacağı inancı, İttihat ve Terakki yönetiminin Alman yanlılığı, kapitülasyonlardan kurtulma isteği. CEPHELER: Taarruz cepheleri Kafkas (Sarıkamış felaketi) ve Kanal; savunma cepheleri Çanakkale (1915 zafer, Mustafa Kemal Anafartalar), Irak (Kut\u0027ül Amare zaferi 1916), Suriye-Filistin, Hicaz-Yemen; müttefiklere yardım cepheleri Galiçya, Makedonya, Romanya. SONUÇ: Osmanlı Devleti 30 Ekim 1918 Mondros Ateşkes Antlaşması ile savaştan çekildi; savaş 11 Kasım 1918\u0027de Almanya\u0027nın ateşkesiyle bitti. Wilson İlkeleri (Ocak 1918) barışın çerçevesini çizdi; yenilenlerle Paris Barış Konferansı\u0027nda antlaşmalar yapıldı: Versay (Almanya), Sen Jermen (Avusturya), Nöyyi (Bulgaristan), Triyanon (Macaristan), Sevr (Osmanlı, 10 Ağustos 1920; TBMM tanımadı, uygulanmadı). İmparatorluklar dağıldı, yeni ulus devletler kuruldu, Mille…"}],"hakem":"Soru ve doğru sık, kaynakta açıkça yer alan \u0027Bulgaristan 29 Eylül 1918\u0027de Selanik Ateşkesi\u0027ni imzalayarak savaştan ilk çekilen devlet oldu\u0027 bilgisine dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Mondros bir barış antlaşması olduğu sanılır; fakat Mondros ateşkes antlaşmasıdır ve Osmanlı\u0027nın gerçek barış antlaşması 10 Ağustos 1920\u0027de imzalanan Sevr\u0027dir.","E":"Avusturya-Macaristan ile Almanya\u0027nın aynı tarihte ateşkes imzaladığı düşünülür; gerçekte Avusturya-Macaristan 3 Kasım 1918\u0027de Villa Giusti\u0027yi, Almanya 11 Kasım 1918\u0027de Rethondes Ateşkesi\u0027ni imzalamıştır.","A":"Osmanlı\u0027nın savaştan ilk çekilen devlet olduğu düşünülür; oysa Bulgaristan bir ay öncesinde Selanik Ateşkesi\u0027ni imzalayarak ilk çekilen devlettir.","B":"Mondros\u0027u imzalayan kişi Talat Paşa olduğu sanılır; ancak Talat Paşa\u0027nın hükümeti istifa etmiş, Bahriye Nazırı Rauf Orbay Osmanlı adına antlaşmayı imzalamıştır."},"dogru":"Bulgaristan 29 Eylül 1918\u0027de Selanik Ateşkesi\u0027ni imzalayarak İttifak Devletleri içinde savaştan ilk çekilen devlet oldu. Bu, Osmanlı ile Almanya arasındaki kâra bağlantısını kestiği için Osmanlı\u0027nın savaşı sürdürmesini imkânsızlaştırdı. Osmanlı ancak bir ay sonra 30 Ekim\u0027de Mondros Ateşkesi\u0027ni imzaladı.","sinav":"I. Dünya Savaşı\u0027nın sonunda İttifak Devletleri\u0027nden ateşkes isteyen devletler arasında kronolojik sıraya göre hangisinin ilk olduğu ve hangi antlaşmayla soruluyor.","kavramlar":[{"kaynak":"TEORI","tanim":"I. Dünya Savaşı\u0027nda Almanya, Avusturya-Macaristan, Osmanlı Devleti ve Bulgaristan\u0027dan oluşan savaşan taraftır.","ad":"İttifak Devletleri"},{"kaynak":"TEORI","tanim":"Bulgaristan\u0027ın 29 Eylül 1918\u0027de imzalayarak I. Dünya Savaşı\u0027ndan ilk çekilm
