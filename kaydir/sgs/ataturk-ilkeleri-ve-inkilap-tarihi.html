Hareket Ordusu tarafından bastırılmış ve bu olay üzerine Kanun-i Esasi ilk defa yürürlüğe girmiştir.","B":"Meclis-i Mebusan, 93 Harbi\u0027nde alınan ağır yenilgi gerekçe gösterilerek 1878\u0027de kapatılmış ve otuz yıl sürecek istibdat dönemi başlamıştır."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - ii. abdulhamit donemi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: II. ABDÜLHAMİT 1876\u0027da tahta çıktı ve 1909\u0027a kadar 33 yıl hüküm sürdü. I. MEŞRUTİYET: 23 ARALIK 1876\u0027da Mithat Paşa öncülüğündeki Genç Osmanlıların hazırladığı KANUN-İ ESASİ ilan edildi; Osmanlı\u0027nın ilk anayasasıdır; Meclis-i Mebusan 1877\u0027de açıldı. 93 HARBİ (1877–1878 Osmanlı-Rus Savaşı) ağır yenilgiyle bitti; AYASTEFANOS ve ardından BERLİN ANTLAŞMASI (1878) ile Sırbistan, Karadağ, Romanya bağımsız oldu, Kars-Ardahan-Batum Rusya\u0027ya bırakıldı, Kıbrıs\u0027ın yönetimi İngiltere\u0027ye verildi (1878). Padişah savaşı gerekçe gösterip 1878\u0027de meclisi kapattı; 30 yıl süren İSTİBDAT dönemi başladı. EKONOMİ: Dış borçların ödenememesi üzerine 1881 Muharrem Kararnamesi ile DÜYUN-U UMUMİYE İDARESİ kuruldu; alacaklı devletlerin temsilcileri Osmanlı gelirlerine el koydu. Tunus Fransa (1881), Mısır İngiltere (1882) tarafından işgal edildi. EĞİTİM VE ALTYAPI: Mülkiye, Hukuk, Ticaret, Güzel Sanatlar okulları ve Darülfünun geliştirildi; Hicaz Demiryolu, telgraf ağı, Hamidiye Etfal Hastanesi gibi eserler yapıldı; basın ve düşünce özgürlüğü kısıtlandı, hafiye teşkilatı kuruldu. II. MEŞRUTİYET: İttihat ve Terakki\u0027nin baskısıyla 23 TEMMUZ 1908\u0027de Kanun-i Esasi yeniden yürürlüğe kondu; 31 MART OLAYI (13 Nisan 1909) Hareket Ordusu tarafından bastırıldı ve II. Abdülhamit 27 Nisan 1909\u0027da tahttan indirildi, yerine V. Mehmet Reşat geçti. SINAV TUZAĞI: (1) Kanun-i Esasi 1876\u0027dır, Tanzimat Fermanı (1839) Abdülmecit dönemidir. (2) Meclis 93 Harbi gerekçesiyle 1878\u0027de kapatıldı; İstibdat 1878–1908\u0027dir. (3) Düyun-u Umumiye 1881, ilk dış borç ise Kırı…"}],"hakem":"Soru II. Abdülhamit dönemine ilişkin tarihsel bilgiyi test ediyor; B şıkkı 93 Harbi yenilgisi, 1878\u0027de meclis kapatılması ve 30 yıllık istibdat dönemini doğru ve tam olarak anlatıyor."},"kayitlar":[],"sade":{"siklar":{"C":"Dış borç Kırım Savaşı\u0027nda alınmış olabilir ancak Düyun-u Umumiye İdaresi 1881\u0027de kuruldu. Borcun alındığı tarihle idarenin kuruluş tarihi birbirine karıştırılmıştır.","E":"Tunus 1881\u0027de Fransa, Mısır 1882\u0027de İngiltere tarafından ayrı ayrı işgal edildi. Berlin Antlaşması bu işgallerle ilgili değildir.","D":"31 Mart Olayı sonrasında Kanun-i Esasi yeniden yürürlüğe konuldu. Fakat ilk defa yürürlüğe girmesi 1876\u0027da olmuştur, ilk kez değil.","A":"Kanun-i Esasi 1876\u0027da ilan edildi ama Tanzimat Fermanı 1839\u0027da başka bir padişahın döneminde çıktı. İki farklı olay 37 yıl arayla gerçekleşti."},"dogru":"93 Harbi\u0027nde Osmanlı ağır yenilgi aldı. Padişah bunu gerekçe göstererek 1878\u0027de Meclis-i Mebusan\u0027ı kapattı ve istibdat dönemi başladı. Bu dönem 1908\u0027e kadar 30 yıl sürdü.","sinav":"Meclis-i Mebusan, 93 Harbi\u0027nde alınan ağır yenilgi gerekçe gösterilerek 1878\u0027de kapatılmış ve otuz yıl sürecek istibdat dönemi başlamıştır.","kavramlar":[{"kaynak":"TEORI","tanim":"1877–1878 yıllarında Osmanlı İmparatorluğu\u0027nun Rusya\u0027ya karşı ağır yenilgi aldığı savaş.","ad":"93 Harbi"},{"kaynak":"TEORI","tanim":"Osmanlı İmparatorluğu\u0027nun ilk anayasası olup 1876\u0027da ilan edilmiş ve Meclis-i Mebusan\u0027ın kurulmasına yol açmıştır.","ad":"Kanun-i Esasi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi II. Abdülhamit dönemine ilişkin doğru bilgi verir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-cokzor/kp-29","verilenler":[],"dayanak":"İnkılap Tarihi ders notu - II. Abdülhamit Dönemi (I. Meşrutiyet 1876, 93 Harbi 1877-78, İstibdat 1878-1908, Muharrem Kararnamesi 1881, II. Meşrutiyet 1908, 31 Mart Olayı 1909)","dogru":"B","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Bir başka fabrikada, 1878 yılında müdür yönetim kurulunu \u0027savaş kaybettik\u0027 diyerek dağıtıyor ve otuz yıl kimseye danışmadan tek başına yönetiyor.","anlatim":"Bu olay tıpkı Osmanlı\u0027da yaşanan 93 Harbi sonrası meclis kapatma hikâyesidir. Padişah da aynı mantıkla hareket eder: yenilgiyi bahane eder, meclisi kapatır. Şimdi bu tek olayı beş şıkta tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 1878\u0027de meclis kapandı, 1908\u0027e kadar 30 yıl istibdat sürdü; bu rakamları her şıkla karşılaştıracağız.","anlatim":"Kural nettir: tarih, neden ve süre üçü birlikte doğru olmalı. Şimdi A\u0027dan E\u0027ye bu beş ifadeyi bu olayın rakamlarıyla tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.Tuzak-1","karar":"yanlış","anlatim":"Hayır, Tanzimat Fermanı 1839\u0027da Abdülmecit döneminde ilan edildi. Kanun-i Esasi ise otuz yedi yıl sonra, 1876\u0027da II. Abdülhamit döneminde çıktı.","formul":"Şık A: birisi sana \u0027Kanun-i Esasi, Tanzimat\u0027ın hemen ardından 1839\u0027da çıktı\u0027 diyor, buna güvenir misin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.Tuzak-2","karar":"doğru","anlatim":"Evet, tam olarak böyle oldu. Padişah savaşı bahane etti, meclisi kapattı ve 1878\u0027den 1908\u0027e kadar otuz yıl sürdü.","formul":"Şık B: birisi sana \u002793 Harbi yenilgisi gerekçesiyle meclis 1878\u0027de kapatıldı, otuz yıl istibdat başladı\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.Tuzak-3","karar":"yanlış","anlatim":"Hayır, ilk dış borç 1856\u0027da Kırım Savaşı sırasında alındı ama bu Abdülmecit dönemidir. İdare ise borçlar ödenemeyince 1881\u0027de Muharrem Kararnamesi ile kuruldu.","formul":"Şık C: birisi \u0027Düyun-u Umumiye, Kırım Savaşı borcu yüzünden 1856\u0027da kuruldu\u0027 diyor, kabul eder misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.31-Mart","karar":"yanlış","anlatim":"Hayır, Kanun-i Esasi ilk kez 1876\u0027da yürürlüğe girdi. 1909\u0027daki 31 Mart Olayı ise zaten 1908\u0027de yeniden ilan edilmiş meşrutiyeti tehdit eden bir ayaklanmaydı.","formul":"Şık D: birisi \u002731 Mart Olayı bastırıldı ve bu olayla Kanun-i Esasi ilk defa yürürlüğe girdi\u0027 diyor, sen ne dersin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.Isgal","karar":"yanlış","anlatim":"Hayır, Tunus\u0027u 1881\u0027de Fransa, Mısır\u0027ı 1882\u0027de İngiltere işgal etti. Bu işgallerin Berlin Antlaşması maddeleriyle ilgisi yoktur.","formul":"Şık E: birisi \u0027Tunus ve Mısır\u0027ı Berlin Antlaşması gereği İngiltere işgal etti\u0027 diyor, doğrular mısın?"}],"anahtar":[{"ornek":"meclisin","kok":"meclis"},{"ornek":"döneminde","kok":"dönemi"},{"ornek":"deneyeceğiz","kok":"deneye"},{"ornek":"kapatılma","kok":"kapatı"},{"ornek":"abdülmecit","kok":"abdülm"},{"ornek":"yenilgisi","kok":"yenilg"}],"konuGiris":{"harita":"Hangi olay hangi yılda gerçekleşti: I. ve II. Meşrutiyet, 93 Harbi, Berlin Antlaşması ve Düyun-u Umumiye tarihleriyle sorulur. Nasıl ölçülür: olayların doğru sırası ve doğru padişah dönemiyle eşleştirilmesiyle ölçülür. Nasıl kaydedilir: \u0027gerçekleşmemiştir\u0027 ya da \u0027doğru bilgi hangisidir\u0027 şeklindeki tuzaklı ifadeyle sınava yansır.","desen":"Sınav genellikle \u0027gerçekleşmemiştir\u0027 sorularak öğrencinin yanlış tarihi ya da yanlış padişahı seçmesini bekler; en sık tuzak Kanun-i Esasi\u0027yi Tanzimat Fermanı ile karıştırmaktır. İkinci tuzak, Düyun-u Umumiye\u0027nin nedenini yalnızca II. Abdülhamit dönemine bağlamaktır, oysa ilk borç Abdülmecit döneminde alınmıştır. Bu soru p.28\u0027deki olay-tarih tuzağı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"1876\u0027da ilan edilen Osmanlı\u0027nın ilk anayasası","ad":"Kanun-i Esasi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Meclisin kapatılmasıyla başlayan 30 yıllık baskı dönemi","ad":"İstibdat Dönemi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Dış borçlar için alacaklı devletlerin kurduğu gelir denetim idaresi","ad":"Düyun-u Umumiye","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"93 Harbi sonrası toprak kayıplarını belirleyen 1878 antlaşması","ad":"Berlin Antlaşması","kim":"kanun sabitler"}],"sinavda":"Soruda II. Abdülhamit dönemine ait bir olay listesi verilir ve öğrenciden yanlış ya da doğru bilgiyi seçmesi istenir.","panel_ornek":"Bir arkadaşın önce ailesinden habersiz kendi kararlarını almaya başlıyor, sonra bir olay yüzünden yine eskisi gibi her şeyi babasına danışmak zorunda kalıyor. Yıllar sonra tekrar özgürleşiyor ama bu sefer kalıcı olamıyor. Yani bir özgürlük dönemi, geri çekilme, ve tekrar deneme sırası var.","ornek":"Bir arkadaşın önce ailesinden habersiz kendi kararlarını almaya başlıyor, sonra bir olay yüzünden yine eskisi gibi her şeyi babasına danışmak zorunda kalıyor. Yıllar sonra tekrar özgürleşiyor ama bu sefer kalıcı olamıyor. Yani bir özgürlük dönemi, geri çekilme, ve tekrar deneme sırası var.","yontemler":"Her olayı tarihiyle birlikte ezberlemek yerine \u0027meşrutiyet-istibdat-meşrutiyet\u0027 sırasını zihinde canlandırmak en kritik yöntemdir.","nedir":"II. Abdülhamit dönemi, Osmanlı\u0027nın anayasal düzene geçişi ve ardından istibdat rejimine dönüşünü anlatan bir dönem konusudur. Sınav bu dönemdeki olay-tarih eşleştirmelerini ve sonuçlarını ölçer."},"olay":"1878-1908 arası 30 yıl.","tuzak":{"C":{"ad":"Kuruluş Yılı Tuzağı","metin":"İlk dış borcun Kırım Savaşı\u0027nda alınmış olması, Düyun-u Umumiye\u0027nin de o yıl kurulduğu sanılmasına yol açar. Doğrusu: İdare, 1881 Muharrem Kararnamesi ile kurulmuştur, borcun alınma tarihiyle idarenin kuruluş tarihi farklıdır."},"E":{"ad":"Antlaşma Kaynağı Tuzağı","metin":"Aynı dönemde geçen Berlin Antlaşması ile Tunus-Mısır işgalleri aynı olaya bağlanır. Doğrusu: Tunus 1881\u0027de Fransa, Mısır 1882\u0027de İngiltere tarafından ayrı ve Berlin Antlaşması\u0027ndan bağımsız olarak işgal edilmiştir."},"D":{"ad":"İlk Yürürlük Tuzağı","metin":"31 Mart Olayı sonrası Kanun-i Esasi\u0027nin \u0027yeniden\u0027 yürürlüğe girdiği, ilk defa yürürlüğe girdiğiyle karıştırılır. Doğrusu: Kanun-i Esasi ilk defa 1876\u0027da yürürlüğe girmiş, 1908\u0027de yalnız yeniden ilan edilmiştir."},"A":{"ad":"Tanzimat-Meşrutiyet Karıştırma Tuzağı","metin":"1839 Tanzimat Fermanı Abdülmecit dönemine aittir, Kanun-i Esasi ise 1876\u0027da ilan edilmiştir. Doğrusu: Kanun-i Esasi, Tanzimat\u0027tan 37 yıl sonra ve ayrı bir padişah döneminde kabul edilmiştir."}},"celdiriciYol":{"C":"İlk dış borcun alındığı yıl (1856) idarenin kuruluş yılıyla eşitlenirse 1856 çıkar (kuruluş-borç tarihi karıştırma)","E":"Aynı yıllarda geçen Berlin Antlaşması, Tunus-Mısır işgaline neden gösterilirse ilgisiz olaylar birleştirilir (eş-zamanlılık yanılgısı)","D":"31 Mart Olayı\u0027nın sonucu, Kanun-i Esasi\u0027nin ilk yürürlüğü sanılırsa yanlış nedensellik kurulur (ilk-yeniden yürürlük karıştırma)","A":"Tanzimat (1839) ile Kanun-i Esasi (1876) aynı reform paketi sayılırsa tarih 1839\u0027a kayar (dönem karıştırma)"},"hap":"II. Abdülhamit döneminde her olayın kendi tarihi, kendi nedeni ve kendi süresi vardır; aynı yüzyılda geçmesi olayları birbirine bağlamaz.","teshis":{"C":{"gercek":"1881 Muharrem Kararnamesi ile kurulan Düyun-u Umumiye, borçların ödenememesi üzerine kurulmuştur; ilk borç 1856\u0027da alınmıştır ama idare 1881\u0027de kurulmuştur.","ayirt":"Borcun alınma tarihi mi soruluyor, idarenin kuruluş tarihi mi?","paragraf":"İnkılap Tarihi - Düyun-u Umumiye","yanilgi":"İlk borcun alındığı tarihi, idarenin kurulduğu tarih sanıyorsun."},"E":{"gercek":"Tunus 1881\u0027de Fransa, Mısır 1882\u0027de İngiltere tarafından, Berlin Antlaşması\u0027yla ilgisi olmayan ayrı işgal hareketleriyle alınmıştır.","ayirt":"Bu iki olay aynı antlaşmanın maddesi mi, yoksa bağımsız gelişmeler mi?","paragraf":"İnkılap Tarihi - Ekonomik Bağımlılık","yanilgi":"Aynı dönemde geçen Berlin Antlaşması\u0027nı, ilgisiz olan Tunus-Mısır işgallerinin nedeni sayıyorsun."},"A":{"gercek":"Tanzimat Fermanı 1839\u0027da Abdülmecit, Kanun-i Esasi 1876\u0027da II. Abdülhamit döneminde ilan edilmiştir.","ayirt":"Bu olay hangi padişahın tahtta olduğu yılda gerçekleşti?","paragraf":"İnkılap Tarihi - I. Meşrutiyet","yanilgi":"Tanzimat ile Kanun-i Esasi\u0027yi aynı reform dalgasının parçası sayıp aynı padişaha bağlıyorsun."},"D":{"gercek":"Kanun-i Esasi ilk kez 1876\u0027da yürürlüğe girmiş, 1908\u0027de yeniden ilan edilmiş, 31 Mart Olayı ise 1909\u0027da bu meşrutiyeti tehdit eden bir ayaklanmadır.","ayirt":"Bu olay Kanun-i Esasi\u0027nin ilk ilanı mı yoksa sonraki bir gelişmesi mi?","paragraf":"İnkılap Tarihi - II. Meşrutiyet","yanilgi":"31 Mart Olayı\u0027nın sonucunu Kanun-i Esasi\u0027nin ilk defa yürürlüğe girmesiyle karıştırıyorsun."},"B":{"gercek":"Padişah 93 Harbi yenilgisini gerekçe göstererek 1878\u0027de meclisi kapatmış, 1908\u0027e kadar süren istibdat dönemi bu tarihte başlamıştır.","ayirt":"Bu cümledeki tarih, neden ve süre üçü birlikte kaynakla örtüşüyor mu?","paragraf":"İnkılap Tarihi - İstibdat Dönemi","yanilgi":"Bu şıkkı elerken 93 Harbi\u0027nin meclis kapatmayla bağlantısını ya da istibdatın süresini ayrı ayrı doğrulamadan geçiyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 18"},"kural":"Musul, kapitülasyonlar ve borçlarla birlikte birinci dönemde uyuşmazlık yaratan konulardandır ama tek başına çözümsüz kalıp sonraya ertelenmiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 18","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Sonraya bırakılan/çözülemeyen\u0027 ifadesi geçen sorularda tek doğru cevap hep Musul\u0027dur, diğer tüm konular Lozan\u0027da kesin hükme bağlanmıştır.","konu":"lozan barış görüşmeleri","tablo":{"satirlar":[["A) Kapitülasyonların kaldırılması","Lozan Barış Antlaşması hükümleri","YANLIŞ ifade"],["B) Musul sorununun çözümlenmesi","Lozan sonrası 1926 Ankara Antlaşması","doğru ifade"],["C) Osmanlı borçlarının paylaşılması","Lozan Barış Antlaşması hükümleri","YANLIŞ ifade"],["D) Batı Trakya\u0027nın Yunanistan\u0027da kalması","Lozan Barış Antlaşması hükümleri","YANLIŞ ifade"],["E) Azınlıkların Türk vatandaşı sayılması","Lozan Barış Antlaşması hükümleri","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Osmanlı borçlarının paylaşılması","E":"Azınlıkların Türk vatandaşı sayılması","A":"Kapitülasyonların kaldırılması","D":"Batı Trakya\u0027nın Yunanistan\u0027da kalması","B":"Musul sorununun çözümlenmesi"},"kaynak":{"alinti":"da çözümlenemeyip ileriye bırakılan konuyu soruyor; Musul sorunu kaynakta açıkça","liste":[{"ad":"TEORI - lozan baris gorusmeleri","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Konferans 20 KASIM 1922\u0027de İsviçre\u0027nin Lozan kentinde açıldı; Türk heyetine Dışişleri Bakanı İSMET PAŞA başkanlık etti (delegeler Rıza Nur, Hasan Saka). İtilaf tarafında İngiltere (Lord Curzon), Fransa, İtalya, Japonya; ilgili konularda Yunanistan, Romanya, Yugoslavya, ABD gözlemci. BİRİNCİ DÖNEM: Kapitülasyonlar, Osmanlı borçları, Musul ve İstanbul\u0027un boşaltılması konularında anlaşılamadı; görüşmeler 4 ŞUBAT 1923\u0027te kesildi. Türkiye ödün vermedi; TBMM ordunun hazır tutulmasını istedi. İKİNCİ DÖNEM: 23 NİSAN 1923\u0027te yeniden başladı; LOZAN BARIŞ ANTLAŞMASI 24 TEMMUZ 1923\u0027te imzalandı, TBMM 23 Ağustos 1923\u0027te onayladı. HÜKÜMLER: Sınırlar: Suriye sınırı 1921 Ankara Antlaşması\u0027na göre; Irak sınırı (Musul) sonraya bırakıldı (1926\u0027da Irak\u0027a kaldı); Batı Trakya Yunanistan\u0027da, Doğu Trakya ve Karaağaç (savaş tazminatı yerine) Türkiye\u0027de; Bozcaada, İmroz ve Tavşan Adaları Türkiye\u0027ye, öteki Ege adaları silahsız kalmak şartıyla Yunanistan\u0027a, On İki Ada İtalya\u0027ya. KAPİTÜLASYONLAR bütünüyle kaldırıldı. Osmanlı BORÇLARI Osmanlı\u0027dan ayrılan devletlerle paylaşıldı, Türkiye payını taksitle ödedi (1954\u0027te bitti). AZINLIKLAR Türk vatandaşı sayıldı, ayrıcalık kaldırıldı; Patrikhane İstanbul\u0027da kaldı; Türk-Rum nüfus mübadelesi (İstanbul ve Batı Trakya hariç). BOĞAZLAR: Başkanı Türk olan uluslararası komisyon yönetecek, iki yaka silahsızlandırılacak (bu hüküm 1936 Montrö ile kaldırıldı). Savaş tazminatı Yunanistan\u0027dan Karaağaç ile karşılandı. Yabancı okullar Türk kanunlarına tabi oldu. ÖNEMİ: Yeni Türk devleti uluslararası alanda tanı…"}],"hakem":"Soru Lozan\u0027da çözümlenemeyip ileriye bırakılan konuyu soruyor; Musul sorunu kaynakta açıkça \u0027sonraya bırakıldı (1926\u0027da Irak\u0027a kaldı)\u0027 olarak belirtilmiş ve B şıkkı bu kurala dayanan doğru cevaptır."},"kayitlar":[],"sade":{"siklar":{"C":"Osmanlı borçları Lozan\u0027da paylaşılmış ve Türkiye\u0027nin ödemesi taksitle kararlaştırılarak hükme bağlanmıştır.","E":"Azınlıklar Lozan\u0027da Türk vatandaşı sayılmış ve ayrıcalıkları kaldırılarak statüleri kesinleştirilmiştir.","D":"Batı Trakya\u0027nın Yunanistan\u0027da kalması ve Doğu Trakya\u0027nın Türkiye\u0027de kalması Lozan\u0027da kesin olarak belirlenmiştir.","A":"Kapitülasyonlar da Lozan\u0027ın birinci döneminde sorun oluşturmuş ancak antlaşmada bütünüyle kaldırılarak çözüme bağlanmıştır."},"dogru":"Musul sorunu Lozan\u0027da çözülemedi. Türkiye ve İngiltere bu toprak üzerinde anlaşamadığı için konuyu daha sonraya erteledi. 1926 yılında imzalanan Ankara Antlaşması ile Musul Irak\u0027a bırakıldı.","sinav":"Lozan Barış Antlaşması imzalandığında Musul sorunu çözümlenmemiş, 1926 Ankara Antlaşması ile Irak\u0027a bırakılmıştır.","kavramlar":[{"kaynak":"TEORI","tanim":"24 Temmuz 1923\u0027te İsviçre\u0027nin Lozan kentinde imzalanan ve yeni Türk devletinin uluslararası alanda tanınmasını sağlayan antlaşma.","ad":"Lozan Barış Antlaşması"},{"kaynak":"TEORI","tanim":"Osmanlı Devleti\u0027nin yabancı devletlere tanıdığı ve yabancıları Osmanlı kanunlarına tabi olmaktan muaf tutan ayrıcalıklar.","ad":"Kapitülasyonlar"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"Lozan Barış Görüşmelerinin birinci döneminde taraflar anlaşamamış, ikinci dönemde imzalanan antlaşmayla da çözüme kavuşturulamayıp sonraya bırakılan sorun aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-12","verilenler":[],"dayanak":"Lozan Barış Antlaşması hükümleri, 24 Temmuz 1923; Musul sorunu 1926 Ankara Antlaşması ile çözüldü","dogru":"B","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1923\u0027te Lozan\u0027da masaya oturan heyetler, aynı anda beş ayrı konuyu tek tek çözmeye çalışıyor: kapitülasyonlar, Musul, borçlar, Batı Trakya, azınlıklar.","anlatim":"İsmet Paşa başkanlığındaki heyet 24 Temmuz 1923\u0027te bir antlaşma imzalıyor ama her konu aynı kesinlikte bitmiyor. Bazı maddeler kesin karara bağlanıyor, bir tanesi ise ileriye, 1926\u0027ya kalıyor.","doldur":[]},{"formul":"Ne yapacağız: beş konuyu da \u0027antlaşma metninde kesin çözüldü mü, yoksa sonraya bırakıldı mı\u0027 sorusuyla teker teker tarayacağız.","anlatim":"Kural basit: Lozan\u0027da çözülen konu antlaşmanın maddesinde net yazılıdır, çözülemeyen konu ise ayrı bir belgeye, ayrı bir tarihe havale edilir. Şimdi A\u0027dan E\u0027ye kadar beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Lozan Barış Antlaşması hükümleri","karar":"yanlış","anlatim":"Hayır, kapitülasyonlar Lozan\u0027da bütünüyle kaldırıldı, bu kesin bir hükümdür. Musul\u0027daki gibi bir bekleme yok, madde imzayla kapanmış.","formul":"Şık A: birisi sana \u0027kapitülasyonlar da Musul gibi sonraya bırakıldı\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Lozan sonrası 1926 Ankara Antlaşması","karar":"doğru","anlatim":"Evet, birinci dönemde de anlaşılamadı, ikinci dönemde imzalanan antlaşmada da çözülemedi. Konu 1926\u0027da ayrı bir antlaşmayla Irak\u0027a bırakıldı.","formul":"Şık B: birisi \u0027Musul sorunu Lozan antlaşmasıyla çözülmeden sonraya kaldı\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Lozan Barış Antlaşması hükümleri","karar":"yanlış","anlatim":"Hayır, borçlar Osmanlı\u0027dan ayrılan devletler arasında paylaşıldı ve Türkiye payını taksitle 1954\u0027e kadar ödedi. Bu belirsiz değil, uygulanan bir karardı.","formul":"Şık C: birisi \u0027borç paylaşımı da askıda kaldı, sonraya bırakıldı\u0027 diyor, katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Lozan Barış Antlaşması hükümleri","karar":"yanlış","anlatim":"Hayır, Batı Trakya\u0027nın Yunanistan\u0027da kalacağı antlaşmada kesin çizilmiş bir sınır. Musul gibi bir erteleme yok.","formul":"Şık D: birisi \u0027Batı Trakya\u0027nın kime kalacağı da sonraya bırakıldı\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Lozan Barış Antlaşması hükümleri","karar":"yanlış","anlatim":"Hayır, azınlıklar Lozan\u0027da Türk vatandaşı sayıldı ve ayrıcalıkları kaldırıldı, bu antlaşmanın kesin hükmü. Nüfus mübadelesi de aynı antlaşmada karara bağlandı.","formul":"Şık E: birisi \u0027azınlıkların Türk vatandaşı sayılması sonraya bırakıldı\u0027 diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Beş konudan dördü Lozan metninde kesin çözülmüş, sadece Musul ileriye kalmış. Kendine hep şunu sor: bu madde antlaşma metninde mi bitti, yoksa ayrı bir tarihe mi havale edildi?","doldur":[]}],"anahtar":[{"ornek":"antlaşma","kok":"antlaş"},{"ornek":"kapitülasyonlar","kok":"kapitü"},{"ornek":"çözülen","kok":"çözüle"},{"ornek":"borçlar","kok":"borçla"},{"ornek":"azınlıklar","kok":"azınlı"},{"ornek":"bırakılıp","kok":"bırakı"}],"konuGiris":{"harita":"Ne zaman test edilir: Lozan\u0027ın birinci ve ikinci dönem ayrımı ile hangi sorunun antlaşmaya rağmen çözülmediği sorulduğunda. Nasıl ölçülür: hangi maddenin Lozan\u0027da karara bağlandığı, hangisinin sonraki bir antlaşmaya (1926 Ankara, 1936 Montrö) bırakıldığı bilgisiyle. Nasıl kaydedilir: tarih ve konu eşleştirmesi biçiminde (Musul-1926, Boğazlar-1936) akılda tutulur.","desen":"Soru genelde \u0027Lozan\u0027da çözülemeyip sonraya bırakılan sorun\u0027 diye sorulur ve doğru cevap Musul\u0027dur (p. sınav tuzağı 2). Bazı sorularda Boğazlar sorusu da tuzak olarak eklenir ama o Montrö ile 1936\u0027da çözülmüştür. Bu soru Musul\u0027un 1926\u0027ya bırakılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Yabancılara verilen ekonomik ve hukuki ayrıcalıklar; Lozan\u0027da tamamen kaldırıldı","ad":"Kapitülasyonlar","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Irak sınırı tartışması; Lozan\u0027da çözülmeyip sonraya bırakıldı","ad":"Musul Sorunu","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Boğazların yönetimi ve silahsızlandırılması meselesi; Lozan\u0027da tam çözülmedi","ad":"Boğazlar Sorunu","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Türk-Rum nüfus değişimi; İstanbul ve Batı Trakya hariç uygulandı","ad":"Nüfus Mübadelesi","kim":"kanun sabitler"}],"sinavda":"Lozan\u0027da imzalanan antlaşmaya rağmen çözülmeyip sonraya bırakılan sorunun hangisi olduğu sorulur.","panel_ornek":"Bir arkadaşın kiralık ev sözleşmesinde bazı maddeler hemen imzalanır, bazıları \u0027sonra netleşecek\u0027 diye not düşülür ve 3 ay sonra ek bir kağıtla çözülür. Lozan\u0027da da bazı sorunlar hemen çözülmüş, bazıları yıllar sonra ayrı bir belgeyle bağlanmıştır.","ornek":"Bir arkadaşın kiralık ev sözleşmesinde bazı maddeler hemen imzalanır, bazıları \u0027sonra netleşecek\u0027 diye not düşülür ve 3 ay sonra ek bir kağıtla çözülür. Lozan\u0027da da bazı sorunlar hemen çözülmüş, bazıları yıllar sonra ayrı bir belgeyle bağlanmıştır.","yontemler":"Hangi maddenin Lozan\u0027da karara bağlandığını, hangisinin sonraki antlaşmaya (1926 Ankara-Musul, 1936 Montrö-Boğazlar) bırakıldığını ayırt et.","nedir":"Lozan Barış Görüşmeleri, Kurtuluş Savaşı sonrası yeni Türk devletinin uluslararası tanınmasını sağlayan diplomatik sürecidir. Sınav bu süreçteki hangi konunun çözüldüğünü, hangisinin sonraya bırakıldığını ölçer."},"olay":"(hesaplama gerektirmeyen teori sorusu).","tuzak":{"C":{"ad":"Paylaşım Tuzağı","metin":"Borçlar konusunun da askıda kaldığını düşünürsün. Doğrusu: Osmanlı borçları Lozan\u0027da paylaşılmış, Türkiye\u0027nin payı taksitle ödenmek üzere karara bağlanmıştır."},"E":{"ad":"Statü Tuzağı","metin":"Azınlık statüsünün de sonraya ertelendiğini düşünürsün. Doğrusu: Azınlıklar Lozan\u0027da Türk vatandaşı sayılmış, ayrıcalıkları kaldırılmıştır."},"D":{"ad":"Sınır Tuzağı","metin":"Trakya\u0027daki sınırların da belirsiz bırakıldığını sanırsın. Doğrusu: Batı Trakya\u0027nın Yunanistan\u0027da, Doğu Trakya\u0027nın Türkiye\u0027de kalması Lozan\u0027da kesin olarak hükme bağlanmıştır."},"A":{"ad":"Kapitülasyonlar Tuzağı","metin":"Bu maddenin de sonraya bırakıldığını sanırsın. Doğrusu: Kapitülasyonlar Lozan\u0027da bütünüyle kaldırılmış, çözüme bağlanmış bir konudur."}},"celdiriciYol":null,"hap":"Lozan\u0027da kapitülasyonlar, borçlar, azınlıklar ve sınırlar çözüldü; yalnız Musul sorunu sonraya bırakılıp 1926\u0027da Irak\u0027a kaldı.","teshis":{"C":{"gercek":"Osmanlı borçları Osmanlı\u0027dan ayrılan devletler arasında paylaşılmış, Türkiye payını taksitle 1954\u0027e kadar ödemiştir.","ayirt":"Bu konuda somut bir paylaşım kararı var mı?","paragraf":"Lozan Barış Antlaşması hükümleri","yanilgi":"Borç paylaşımının da belirsiz bırakıldığını düşünüyorsun."},"E":{"gercek":"Azınlıklar Lozan\u0027da Türk vatandaşı kabul edilmiş, ayrıcalıkları kaldırılmış, nüfus mübadelesi kararlaştırılmıştır.","ayirt":"Bu statü antlaşmada tanımlanmış mı, yoksa açık mı bırakılmış?","paragraf":"Lozan Barış Antlaşması hükümleri","yanilgi":"Azınlık statüsünün de sonraki görüşmelere bırakıldığını düşünüyorsun."},"A":{"gercek":"Lozan\u0027ın önemli kazanımlarından biri kapitülasyonların tamamen kaldırılmasıdır.","ayirt":"Bu madde antlaşma metninde kesin hüküm mü, yoksa sonraya mı bırakılmış?","paragraf":"Lozan Barış Antlaşması hükümleri","yanilgi":"Kapitülasyonların da askıda kaldığını düşünüyorsun."},"D":{"gercek":"Batı Trakya Yunanistan\u0027da, Doğu Trakya ve Karaağaç Türkiye\u0027de kalacak şekilde sınır kesin çizilmiştir.","ayirt":"Bu sınır antlaşmada net biçimde belirlenmiş mi?","paragraf":"Lozan Barış Antlaşması hükümleri","yanilgi":"Trakya sınırının da ileriye bırakıldığını sanıyorsun."},"B":{"gercek":"Musul, birinci dönemde uzlaşılamayan konulardandır ve nihai antlaşmada da çözülemeyip 1926\u0027da ayrı bir antlaşmayla Irak\u0027a bırakılmıştır.","ayirt":"Bu sorun Lozan metninde mi çözüldü, yoksa daha sonraki bir antlaşmayla mı?","paragraf":"Lozan sonrası 1926 Ankara Antlaşması","yanilgi":"Musul\u0027un da Lozan\u0027da kesin çözüldüğünü sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 18"},"kural":"Lozan\u0027da Boğazlar için fiilen bir komisyon rejimi kurularak geçici bir düzenleme yapılmıştır; Musul sorununda ise hiçbir düzenleme getirilmeden konu doğrudan sonraki bir tarihe bırakılmıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 18","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Sonraya bırakılan konularda \u0027düzenleme yapıldı mı, yapılmadı mı\u0027 ayrımına bak, ikisini aynı kefeye koyma.","konu":"lozan barış görüşmeleri","tablo":{"satirlar":[["A) Musul sorunu Lozan\u0027da Türkiye lehine kesin olarak çözülm…","Lozan hükümleri - Musul/Irak sınırı","YANLIŞ ifade"],["B) Boğazlar, başkanı Türk olan uluslararası komisyonca yöne…","Lozan-Boğazlar hükmü / 1936 Montrö","YANLIŞ ifade"],["C) Boğazlar\u0027da geçici bir uluslararası düzenleme yapılmış, …","Lozan hükümleri - Boğazlar komisyonu / Musul\u0027un ertelenmesi","doğru ifade"],["D) Hem Musul hem Boğazlar sorunu Lozan\u0027da kesin çözüme kavu…","Lozan sonrası gelişmeler - Musul, Boğazlar","YANLIŞ ifade"],["E) Musul sorunu uluslararası komisyon eliyle geçici olarak …","Lozan hükümleri - Boğazlar/Musul ayrımı","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Boğazlar\u0027da geçici bir uluslararası düzenleme yapılmış, Musul sorunu ise herhangi bir düzenleme yapılmadan sonraya bırakılmıştır.","E":"Musul sorunu uluslararası komisyon eliyle geçici olarak düzenlenmiş, Boğazlar ise doğrudan Irak sınırına bırakılmıştır.","A":"Musul sorunu Lozan\u0027da Türkiye lehine kesin olarak çözülmüş, Irak sınırı antlaşmayla belirlenmiştir.","D":"Hem Musul hem Boğazlar sorunu Lozan\u0027da kesin çözüme kavuşmuş, sonraki antlaşmalar yalnızca teyit niteliğindedir.","B":"Boğazlar, başkanı Türk olan uluslararası komisyonca yönetilmek üzere düzenlenmiş; bu statü sonradan değişmemiştir."},"kaynak":{"alinti":"nın Boğazlar ve Musul konularına yaklaşımındaki farkı ölçüyor; doğru sık (C) kaynakta açıkça desteklenen kurala dayanıyor: Boğazlar uluslararası komisyon rejimi ile düzenlenmişken, Musul herhangi bir düzenleme olmadan 1926","liste":[{"ad":"TEORI - lozan baris gorusmeleri","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Konferans 20 KASIM 1922\u0027de İsviçre\u0027nin Lozan kentinde açıldı; Türk heyetine Dışişleri Bakanı İSMET PAŞA başkanlık etti (delegeler Rıza Nur, Hasan Saka). İtilaf tarafında İngiltere (Lord Curzon), Fransa, İtalya, Japonya; ilgili konularda Yunanistan, Romanya, Yugoslavya, ABD gözlemci. BİRİNCİ DÖNEM: Kapitülasyonlar, Osmanlı borçları, Musul ve İstanbul\u0027un boşaltılması konularında anlaşılamadı; görüşmeler 4 ŞUBAT 1923\u0027te kesildi. Türkiye ödün vermedi; TBMM ordunun hazır tutulmasını istedi. İKİNCİ DÖNEM: 23 NİSAN 1923\u0027te yeniden başladı; LOZAN BARIŞ ANTLAŞMASI 24 TEMMUZ 1923\u0027te imzalandı, TBMM 23 Ağustos 1923\u0027te onayladı. HÜKÜMLER: Sınırlar: Suriye sınırı 1921 Ankara Antlaşması\u0027na göre; Irak sınırı (Musul) sonraya bırakıldı (1926\u0027da Irak\u0027a kaldı); Batı Trakya Yunanistan\u0027da, Doğu Trakya ve Karaağaç (savaş tazminatı yerine) Türkiye\u0027de; Bozcaada, İmroz ve Tavşan Adaları Türkiye\u0027ye, öteki Ege adaları silahsız kalmak şartıyla Yunanistan\u0027a, On İki Ada İtalya\u0027ya. KAPİTÜLASYONLAR bütünüyle kaldırıldı. Osmanlı BORÇLARI Osmanlı\u0027dan ayrılan devletlerle paylaşıldı, Türkiye payını taksitle ödedi (1954\u0027te bitti). AZINLIKLAR Türk vatandaşı sayıldı, ayrıcalık kaldırıldı; Patrikhane İstanbul\u0027da kaldı; Türk-Rum nüfus mübadelesi (İstanbul ve Batı Trakya hariç). BOĞAZLAR: Başkanı Türk olan uluslararası komisyon yönetecek, iki yaka silahsızlandırılacak (bu hüküm 1936 Montrö ile kaldırıldı). Savaş tazminatı Yunanistan\u0027dan Karaağaç ile karşılandı. Yabancı okullar Türk kanunlarına tabi oldu. ÖNEMİ: Yeni Türk devleti uluslararası alanda tanı…"}],"hakem":"Soru Lozan Barış Antlaşması\u0027nın Boğazlar ve Musul konularına yaklaşımındaki farkı ölçüyor; doğru sık (C) kaynakta açıkça desteklenen kurala dayanıyor: Boğazlar uluslararası komisyon rejimi ile düzenlenmişken, Musul herhangi bir düzenleme olmadan 1926\u0027ya bırakılmıştır."},"kayitlar":[],"sade":{"siklar":{"D":"Lozan\u0027ın her sorunu kesin çözdüğü düşüncesi. Hâlbuki Musul 1926\u0027da ve Boğazlar 1936\u0027da ayrı antlaşmalarla yeniden düzenlendi.","E":"Uluslararası komisyon rejimi ile sınır ertelemesinin yer değiştirerek hatırlanması. Doğrusu: Boğazlar\u0027a komisyon, Musul\u0027a ise komisyon değil doğrudan erteleme uygulandı.","A":"Musul\u0027un Lozan\u0027da tamamen çözüldüğü yanlış anlaşılması. Gerçekte Musul sorunu Lozan\u0027da çözülemedi, 1926 Ankara Antlaşması ile Irak\u0027a kaldı.","B":"Boğazlar statüsünün Lozan\u0027daki haliyle sonsuza dek kaldığı yanlış görüşü. Oysa 1936 Montrö Boğazlar Sözleşmesi ile bu hüküm değiştirilip Boğazlar tam Türk egemenliğine bırakıldı."},"dogru":"Lozan\u0027da Boğazlar için uluslararası komisyon kurularak geçici bir düzenleme yapılmıştır. Musul sorunu ise hiçbir çözüm getirilmeden doğrudan 1926\u0027ya ertelenmiştir.","sinav":"Lozan Barış Antlaşması Boğazlar konusunda geçici uluslararası komisyon rejimi getirmiş, Musul sorununu ise herhangi bir düzenleme yapılmadan sonraya bırakmıştır.","kavramlar":[{"kaynak":"TEORI","tanim":"Lozan Antlaşması\u0027na göre başkanı Türk olan uluslararası komisyon tarafından yönetilecek, iki yakası silahsızlandırılacak düzenleme.","ad":"Boğazlar rejimi"},{"kaynak":"TEORI","tanim":"Türkiye ile Irak arasında sınır konusunda yaşanan ve Lozan\u0027da çözülmeyen, 1926 Ankara Antlaşması ile Irak\u0027a kaldığı kesinleştirilen anlaşmazlık.","ad":"Musul sorunu"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"Lozan Barış Antlaşması\u0027nın Boğazlar ve Musul sorununa ilişkin düzenlemeleri karşılaştırıldığında aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-cokzor/kp-12","verilenler":[],"dayanak":"TESMER İnkılap Tarihi ders notu - Lozan Barış Antlaşması, Boğazlar hükmü ve Musul sorununun ertelenmesi","dogru":"C","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1923 Lozan\u0027da imzalanan antlaşmayla Boğazlar için başkanı Türk olan uluslararası bir komisyon kuruluyor, iki yaka silahsızlandırılıyor; ama Musul için hiçbir hüküm yazılmıyor, konu masada bile bitmiyor.","anlatim":"Aynı antlaşma iki farklı sorunu iki farklı şekilde ele alıyor. Biri düzenleniyor, öbürü hiç düzenlenmeden bırakılıyor.","doldur":[]},{"formul":"Ne yapacağız: Boğazlar\u0027da komisyon rejimi var, Musul\u0027da hiçbir düzenleme yok; sonradan Boğazlar 1936 Montrö ile, Musul 1926 Ankara Antlaşması ile çözülüyor. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural Irak sınırına bırakıldı\u0027 desem, bu mantıklı mı?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Boğazlar somut biçimde düzenlendi, Musul hiç düzenlenmeden bırakıldı; tek özet bu. Kendine hep şunu sor: bu konuda Lozan metninde bir hüküm var mı, yoksa sorun sonraya mı bırakılmış?","doldur":[]}],"anahtar":[{"ornek":"düzenleme","kok":"düzenl"},{"ornek":"bırakıldı","kok":"bırakı"},{"ornek":"boğazlar","kok":"boğazl"},{"ornek":"komisyon","kok":"komisy"},{"ornek":"hiçbir","kok":"hiçbir"},{"ornek":"antlaşma","kok":"antlaş"}],"konuGiris":{"harita":"Hangi sorunlar Lozan\u0027da hemen çözüldü: Kapitülasyonlar, azınlıklar, sınırların çoğu. Hangi sorunlar sonraya bırakıldı: Musul sorunu 1926\u0027ya, Boğazlar sorunu 1936 Montrö\u0027ye ertelendi. Nasıl kaydedilir: Antlaşma maddeleri ve sonraki tarihli ek antlaşmalarla karşılaştırılarak.","desen":"Sınav genellikle Musul ile Boğazlar sorununu karıştırtmaya çalışır; öğrenci ikisinin de \u0027hemen çözüldü\u0027 sanma tuzağına düşer. Doğrusu ikisi de Lozan\u0027da tam çözülmedi, ama farklı antlaşmalarla (1926 Ankara, 1936 Montrö) sonradan çözüldü. Bu soru p.28 sınav tuzağı notundan geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Lozan\u0027da çözülmeyip 1926\u0027da Irak\u0027a bırakılan sınır meselesi","ad":"Musul sorunu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Başkanı Türk olan uluslararası komisyonun Boğazları yönetmesi","ad":"Boğazlar Komisyonu","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"1936\u0027da Lozan\u0027daki Boğazlar hükmünü kaldıran yeni düzenleme","ad":"Montrö Boğazlar Sözleşmesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Milli sınırları belirleyen ilke, Lozan\u0027da kısmen gerçekleşti","ad":"Misak-ı Millî","kim":"kanun sabitler"}],"sinavda":"Soru, Boğazlar ve Musul konusundaki Lozan hükümlerini karşılaştırıp hangisinin doğru bilgi olduğunu seçmeni ister.","panel_ornek":"Bir arkadaşın ikinci el bisiklet alırken satıcıyla pazarlık yapar, bazı konularda hemen anlaşır (fiyat 300 lira), lastik değişimi gibi bazı konularda ise \u0027sonra konuşuruz\u0027 der. İşte tam anlaşma ile ertelenen anlaşma farklı şeylerdir.","ornek":"Bir arkadaşın ikinci el bisiklet alırken satıcıyla pazarlık yapar, bazı konularda hemen anlaşır (fiyat 300 lira), lastik değişimi gibi bazı konularda ise \u0027sonra konuşuruz\u0027 der. İşte tam anlaşma ile ertelenen anlaşma farklı şeylerdir.","yontemler":"İki konuyu ayrı ayrı düşün: Musul\u0027un çözüm tarihi ile Boğazlar\u0027ın çözüm tarihi farklıdır, karıştırma.","nedir":"Lozan Barış Antlaşması konusu, Türkiye\u0027nin uluslararası tanınmasını sağlayan barış görüşmelerini anlatır. Sınav, hangi sorunun çözüldüğünü, hangisinin sonraya bırakıldığını ayırt edebilmeni ölçer."},"olay":"","tuzak":{"D":{"ad":"Kapsam Tuzağı","metin":"Lozan\u0027ı hiçbir sorunun açık kalmadığı kesin bir antlaşma sanırsın. Doğrusu: Musul (1926) ve Boğazlar (1936) hükümleri Lozan\u0027dan sonra ayrı antlaşmalarla yeniden düzenlendi."},"E":{"ad":"Kavram Karıştırma Tuzağı","metin":"Komisyon rejimi ile sınır ertelemesini yer değiştirerek hatırlarsın. Doğrusu: uluslararası komisyon rejimi Boğazlar\u0027a aittir, Musul ise komisyon kurulmadan 1926\u0027da Irak\u0027a bağlanmıştır."},"A":{"ad":"Kapsam Tuzağı","metin":"Musul\u0027un Lozan\u0027da tamamen çözüldüğünü sanırsın. Doğrusu: Musul sorunu Lozan\u0027da çözülemedi, sınır 1926 Ankara Antlaşması ile Irak lehine belirlendi."},"B":{"ad":"Zamanlama Tuzağı","metin":"Boğazlar statüsünün Lozan\u0027daki haliyle kalıcı olduğunu sanırsın. Doğrusu: bu hüküm 1936 Montrö Boğazlar Sözleşmesi ile kaldırılıp tam Türk egemenliğine bırakıldı."}},"celdiriciYol":{},"hap":"Lozan\u0027da Boğazlar için geçici bir düzenleme yapıldı, Musul ise hiç düzenlenmeden sonraya bırakıldı.","teshis":{"C":{"gercek":"Boğazlar\u0027da Lozan\u0027da fiilen bir komisyon rejimi kuruldu, Musul\u0027da ise hiçbir düzenleme yapılmadan sorun doğrudan ileriki bir tarihe bırakıldı.","ayirt":"Lozan bu konuda somut bir düzenleme mi getirdi, yoksa sorunu olduğu gibi mi erteledi?","paragraf":"Lozan hükümleri - Boğazlar komisyonu / Musul\u0027un ertelenmesi","yanilgi":"Bu şıkkı eleyen öğrenci, Musul ve Boğazlar\u0027ın ikisinin de aynı şekilde \u0027sonraya bırakıldığını\u0027 sanıp aralarındaki düzenleme farkını gözden kaçırır."},"E":{"gercek":"Uluslararası komisyon rejimi Boğazlar\u0027a aittir; Musul ise herhangi bir komisyon kurulmadan doğrudan sonraya bırakılıp 1926\u0027da Irak\u0027a bağlandı.","ayirt":"Komisyon hangi konuyla ilgiliydi: Boğazlar mı, Musul mu?","paragraf":"Lozan hükümleri - Boğazlar/Musul ayrımı","yanilgi":"Musul ve Boğazlar\u0027a ilişkin hükümleri yer değiştirerek hatırlıyorsun, komisyon rejimini Musul\u0027a, sınır ertelemesini Boğazlar\u0027a bağlıyorsun."},"A":{"gercek":"Musul sorunu Lozan\u0027da çözülemedi; sınır 1926 Ankara Antlaşması ile Irak lehine belirlendi.","ayirt":"Bu sınır Lozan metninde mi çizildi, yoksa sonraki bir antlaşmada mı?","paragraf":"Lozan hükümleri - Musul/Irak sınırı","yanilgi":"Musul\u0027un Lozan\u0027da tamamen çözüldüğünü, Irak sınırının antlaşmada kesinleştiğini sanıyorsun."},"D":{"gercek":"Musul (1926) ve Boğazlar (1936) hükümleri Lozan\u0027dan sonra ayrı antlaşmalarla yeniden düzenlendi, bu da Lozan\u0027da kesin çözülmediklerini gösterir.","ayirt":"Bu konuda sonradan yeni bir antlaşma imzalandı mı?","paragraf":"Lozan sonrası gelişmeler - Musul, Boğazlar","yanilgi":"Lozan\u0027ın \u0027sınırları çizen kesin antlaşma\u0027 olduğunu, hiçbir sorunun açık kalmadığını sanıyorsun."},"B":{"gercek":"Lozan\u0027daki komisyon yönetimi ve silahsızlandırma 1936 Montrö Boğazlar Sözleşmesi ile kaldırılıp tam Türk egemenliğine bırakıldı.","ayirt":"Bu hüküm sonraki bir antlaşmayla değişti mi?","paragraf":"Lozan-Boğazlar hükmü / 1936 Montrö","yanilgi":"Boğazlar statüsünün Lozan\u0027da belirlendiği şekliyle kalıcı olduğunu, hiç değişmediğini sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 18"},"kural":"İtilaf Devletleri\u0027nin hem TBMM hem İstanbul Hükümeti\u0027ni çağırması ikilik yaratma amacı taşıyordu; TBMM bunu 1 Kasım 1922\u0027de saltanatı kaldırarak cevapladı.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 18","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Aynı paragraftaki yakın tarihli olayları (saltanat/halifelik, Mudanya/çifte davet, heyet başkanı/Başbakan) ayırmak için önce tarih sırasını zihninde çiz.","konu":"lozan konferansı öncesi olaylar","tablo":{"satirlar":[["A) Saltanatın kaldırılması","p.Saltanatın kaldırılması-1 Kasım 1922","doğru ifade"],["B) Halifeliğin kaldırılması","p.Halifeliğin kaldırılması-3 Mart 1924","YANLIŞ ifade"],["C) Mudanya Ateşkes Antlaşması\u0027nın imzalanması","p.Mudanya Ateşkes Antlaşması-11 Ekim 1922","YANLIŞ ifade"],["D) İsmet Paşa\u0027nın Dışişleri Bakanlığına getirilmesi","p.Lozan heyeti seçimi","YANLIŞ ifade"],["E) Rauf Bey\u0027in Lozan heyetine başkan seçilmesi","p.Lozan heyeti üyeleri","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Mudanya Ateşkes Antlaşması\u0027nın imzalanması","E":"Rauf Bey\u0027in Lozan heyetine başkan seçilmesi","A":"Saltanatın kaldırılması","D":"İsmet Paşa\u0027nın Dışişleri Bakanlığına getirilmesi","B":"Halifeliğin kaldırılması"},"kaynak":{"alinti":"olayının doğrudan sonucu olarak","liste":[{"ad":"TEORI - lozan konferansi oncesi olaylar","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Büyük Taarruz ve 9 Eylül 1922\u0027de İzmir\u0027in kurtarılışından sonra İtilaf Devletleri barış istedi. MUDANYA ATEŞKES ANTLAŞMASI (11 Ekim 1922): TBMM adına İsmet Paşa (İnönü) imzaladı; Yunanistan görüşmelere katılmadı, adına İngiltere imza attı. Sonuçları: Doğu Trakya, Edirne dahil, savaşsız Türkiye\u0027ye bırakıldı; İstanbul ve Boğazların yönetimi barış antlaşmasına kadar İtilaf denetiminde kaldı; Kurtuluş Savaşı\u0027nın silahlı dönemi kapandı. ÇİFTE DAVET: İtilaf Devletleri barış konferansına hem TBMM Hükümeti\u0027ni hem İstanbul Hükümeti\u0027ni çağırdı; amaç ikilik yaratıp Türk tarafını zayıflatmaktı. TBMM buna 1 KASIM 1922\u0027de SALTANATI KALDIRARAK cevap verdi; halifelik makamı bir süre daha kaldı, Vahdettin 17 Kasım 1922\u0027de ülkeyi terk etti ve Abdülmecit Efendi halife seçildi. HEYETİN SEÇİLMESİ: Mustafa Kemal Paşa, Mudanya\u0027daki başarısı nedeniyle İsmet Paşa\u0027yı heyet başkanı istedi; İsmet Paşa Dışişleri Bakanlığına getirildi (Rauf Bey Başbakan idi). Heyette Rıza Nur ve Hasan Saka delege olarak bulundu. Heyete verilen kesin talimat: Ermeni yurdu ve kapitülasyonlar konusunda hiçbir ödün verilmeyecek, gerekirse görüşmeler kesilecek. Konferans 20 Kasım 1922\u0027de Lozan\u0027da açıldı. SINAV TUZAĞI: (1) Mudanya\u0027yı Yunanistan imzalamadı, İngiltere onun adına imzaladı. (2) Saltanatın kaldırılması Lozan\u0027a çifte davetin doğrudan sonucudur; halifelik o gün değil 3 Mart 1924\u0027te kaldırıldı. (3) Lozan heyetinin başkanı İsmet Paşa\u0027dır, Rauf Bey değil. SINAVDA NASIL SORULUR: \u0027İtilaf Devletleri\u0027nin Lozan Konferansı\u0027na İstanbul Hükümeti\u0027ni de çağırması aşa…"}],"hakem":"Soru, kaynak metinde açıkça belirtilen \u0027çifte davet\u0027 olayının doğrudan sonucu olarak \u0027saltanatın kaldırılması\u0027nı (1 Kasım 1922) ölçmektedir; kural, tarih ve nedensellik kaynaktan desteklenmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Mudanya Ateşkes Antlaşması 11 Ekim 1922\u0027de imzalandı; çifte davetten önce gerçekleşti ve barış isteği doğurdu.","E":"Lozan heyeti başkanı İsmet Paşa\u0027dır; Rauf Bey o dönemde başbakanken heyete başkan olarak katılmamıştır.","D":"İsmet Paşa\u0027nın Dışişleri Bakanlığa getirilmesi Mudanya\u0027daki başarısı nedeniyle oldu, çifte davetle doğrudan ilgili değildir.","B":"Halifelik saltanat kaldırıldığında birlikte değil, 3 Mart 1924\u0027te ayrı bir kanunla kaldırıldı; çifte davetin doğrudan sonucu değildir."},"dogru":"İtilaf Devletleri barış konferansına hem TBMM hem İstanbul Hükümeti\u0027ni çağırarak Türkiye\u0027yi zayıflatmak istedi. TBMM bu ikilik oyununa 1 Kasım 1922\u0027de saltanatı kaldırarak karşılık verdi.","sinav":"İtilaf Devletleri\u0027nin Lozan Barış Konferansı\u0027na çifte davet göndermesi, TBMM Hükümeti tarafından saltanatın kaldırılmasıyla cevaplandırıldı.","kavramlar":[{"kaynak":"TEORI","tanim":"İtilaf Devletleri\u0027nin barış konferansına hem TBMM Hükümeti\u0027ni hem İstanbul Hükümeti\u0027ni çağırması; amaç Türk tarafını zayıflatmak için ikilik yaratmaktı.","ad":"Çifte davet"},{"kaynak":"TEORI","tanim":"11 Ekim 1922\u0027de TBMM adına İsmet Paşa tarafından imzalanan antlaşma; Kurtuluş Savaşı\u0027nın silahlı dönemini kapattı ve Doğu Trakya\u0027yı Türkiye\u0027ye bıraktı.","ad":"Mudanya Ateşkes Antlaşması"},{"kaynak":"TEORI","tanim":"1 Kasım 1922\u0027de TBMM tarafından alınan karar; İtilaf Devletleri\u0027nin çifte daveti oyununa cevap olarak saltanat makamı ortadan kaldırıldı.","ad":"Saltanatın kaldırılması"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"İtilaf Devletleri\u0027nin Lozan Barış Konferansı\u0027na hem TBMM Hükümeti\u0027ni hem İstanbul Hükümeti\u0027ni çağırması, aşağıdaki gelişmelerden hangisine doğrudan yol açmıştır?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-cokzor/kp-07","verilenler":[],"dayanak":"İnkılap tarihi kronolojisi - Mudanya Ateşkes Antlaşması ve Saltanatın Kaldırılması (1 Kasım 1922)","dogru":"A","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Bursa\u0027daki bir tüccar ailesi, 1922 Ekim ayı sonunda gazetede İtilaf Devletleri\u0027nin barış konferansına hem Ankara\u0027yı hem İstanbul\u0027daki padişah hükümetini davet ettiğini okur, \u0027iki hükümet mi var şimdi\u0027 diye şaşırır.","anlatim":"Bu davet gerçekten yaşanmış bir tuzaktı, tesadüf değildi. İtilaf Devletleri Türk tarafını bölmek istiyordu. TBMM buna sert bir cevap verdi.","doldur":[]},{"formul":"Ne yapacağız: 1 Kasım 1922\u0027de TBMM saltanatı kaldırdı, halifelik kalmaya devam etti, İsmet Paşa Mudanya başarısından ötürü heyet başkanı oldu, Rauf Bey ise Başbakan\u0027dı; beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural tek: çifte davetin doğrudan sonucu neydi, onu arayacağız. Beş şıkkı bu tarihsel zincirde tek tek sınayacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.Saltanatın kaldırılması-1 Kasım 1922","karar":"doğru","anlatim":"Evet, TBMM ikilik yaratma girişimine karşılık 1 Kasım 1922\u0027de saltanatı kaldırdı. Bu, çifte davetin doğrudan ve hemen gelen cevabıdır. Tarih ve neden-sonuç burada birebir örtüşüyor.","formul":"Şık A: Bursalı tüccar \u0027bu çifte davet yüzünden TBMM saltanatı mı kaldırdı\u0027 diye soruyor, doğru mu dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.Halifeliğin kaldırılması-3 Mart 1924","karar":"yanlış","anlatim":"Hayır, halifelik o gün kalktı sanma; Vahdettin ülkeyi terk etti ama halifelik makamı Abdülmecit Efendi\u0027yle devam etti. Halifelik ancak 3 Mart 1924\u0027te, ayrı bir kanunla kaldırıldı. Çifte davetle doğrudan bağı yok.","formul":"Şık B: Aynı tüccar \u0027halifelik de o gün mü gitti\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.Mudanya Ateşkes Antlaşması-11 Ekim 1922","karar":"yanlış","anlatim":"Hayır, sıra tersine dönüyor: Mudanya Ateşkes Antlaşması 11 Ekim 1922\u0027de imzalandı ve İtilaf Devletleri\u0027ni zaten barış masasına oturtan olay budur. Çifte davet ondan sonra gelir, önce değil.","formul":"Şık C: Tüccar \u0027Mudanya da bu çifte davetten sonra mı imzalandı\u0027 diye merak ediyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.Lozan heyeti seçimi","karar":"yanlış","anlatim":"Hayır, bu atama Mustafa Kemal Paşa\u0027nın Mudanya\u0027daki başarısından ötürü İsmet Paşa\u0027yı istemesiyle olur. Çifte davetle nedensellik ilişkisi yok. Ayrı bir zincirin sonucu bu.","formul":"Şık D: Tüccar \u0027İsmet Paşa\u0027nın Dışişleri Bakanı olması da bu davetin sonucu mu\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.Lozan heyeti üyeleri","karar":"yanlış","anlatim":"Hayır, Lozan heyetinin başkanı İsmet Paşa\u0027dır, Rauf Bey o dönem Başbakan\u0027dı ve heyete katılmadı. Bu bilgi hem yanlış hem çifte davetle ilgisiz. Karıştırma bunu.","formul":"Şık E: Tüccar \u0027Rauf Bey Lozan heyetine başkan mı seçildi bu davetten sonra\u0027 diye soruyor, doğru mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Çifte davetin doğrudan cevabı sadece saltanatın kaldırılmasıdır, gerisi ya öncesinde ya ayrı bir nedenle olmuştur. Kendine hep şunu sor: bu olay çifte davetten önce mi sonra mı, ve doğrudan onun cevabı mı yoksa başka bir sebebin sonucu mu?","doldur":[]}],"anahtar":[{"ornek":"doğrudan","kok":"doğrud"},{"ornek":"kaldırmaya","kok":"kaldır"},{"ornek":"saltanatı","kok":"saltan"},{"ornek":"davetin","kok":"daveti"},{"ornek":"cevabıdır","kok":"cevabı"},{"ornek":"halifelik","kok":"halife"}],"konuGiris":{"harita":"Ne zaman test edilir: İtilaf Devletleri\u0027nin çifte daveti ile TBMM\u0027nin verdiği cevap arasındaki neden-sonuç sorulduğunda. Nasıl ölçülür: Saltanatın kaldırılma tarihi ile halifeliğin kaldırılma tarihinin karıştırılıp karıştırılmadığına bakılarak. Nasıl kaydedilir: Mudanya, çifte davet ve saltanatın kaldırılışı kronolojik sıra halinde ezberlenir.","desen":"Sınav bu konuyu çifte davetin sonucunu sorarak test eder; tuzak, saltanatın kaldırılmasını halifeliğin kaldırılmasıyla karıştırmaktır. Bir diğer tuzak, Mudanya\u0027yı Yunanistan\u0027ın değil İngiltere\u0027nin imzaladığını unutmaktır. Bu soru p.28\u0027deki çifte davet ve saltanat maddesinden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İtilaf Devletleri\u0027nin hem TBMM hem İstanbul Hükümeti\u0027ni konferansa çağırması","ad":"Çifte davet","kim":"kanun sabitler"},{"kaynak":"kuraldan bilini örüşmelere katılmadı, adına İngiltere imza attı. Sonuçları: Doğu Trakya, Edirne dahil, savaşsız Türkiye\u0027ye bırakıldı; İstanbul ve Boğazların yönetimi barış antlaşmasına kadar İtilaf denetiminde kaldı; Kurtuluş Savaşı\u0027nın silahlı dönemi kapandı. ÇİFTE DAVET: İtilaf Devletleri barış konferansına hem TBMM Hükümeti\u0027ni hem İstanbul Hükümeti\u0027ni çağırdı; amaç ikilik yaratıp Türk tarafını zayıflatmaktı. TBMM buna 1 KASIM 1922\u0027de SALTANATI KALDIRARAK cevap verdi; halifelik makamı bir süre daha kaldı, Vahdettin 17 Kasım 1922\u0027de ülkeyi terk etti ve Abdülmecit Efendi halife seçildi. HEYETİN SEÇİLMESİ: Mustafa Kemal Paşa, Mudanya\u0027daki başarısı nedeniyle İsmet Paşa\u0027yı heyet başkanı istedi; İsmet Paşa Dışişleri Bakanlığına getirildi (Rauf Bey Başbakan idi). Heyette Rıza Nur ve Hasan Saka delege olarak bulundu. Heyete verilen kesin talimat: Ermeni yurdu ve kapitülasyonlar konusunda hiçbir ödün verilmeyecek, gerekirse görüşmeler kesilecek. Konferans 20 Kasım 1922\u0027de Lozan\u0027da açıldı. SINAV TUZAĞI: (1) Mudanya\u0027yı Yunanistan imzalamadı, İngiltere onun adına imzaladı. (2) Saltanatın kaldırılması Lozan\u0027a çifte davetin doğrudan sonucudur; halifelik o gün değil 3 Mart 1924\u0027te kaldırıldı. (3) Lozan heyetinin başkanı İsmet Paşa\u0027dır, Rauf Bey değil. SINAVDA NASIL SORULUR: \u0027İtilaf Devletleri\u0027nin Lozan Konferansı\u0027na İstanbul Hükümeti\u0027ni de çağırması aşa…"}],"hakem":"Soru Lozan öncesi olaylar konusunu ölçüyor, dayanağı kaynak metinde açıkça destekleniyor, ders ve konu kapsamında, tek anlamlı, güncel ve atıf doğru."},"kayitlar":[],"sade":{"siklar":{"C":"Mudanya Ateşkes Antlaşması çifte davetin öncesinde 11 Ekim 1922\u0027de imzalandı; bu çifte davetin doğru sonucu değildir.","E":"Cumhuriyet çok daha sonra, Lozan Konferansı\u0027ndan sonra 29 Ekim 1923\u0027te ilan edildi, çifte daveye karşı alınan acil tedbir değildir.","D":"İsmet Paşa\u0027nın heyet başkanı seçilmesi, Mudanya\u0027daki başarısına dayanan ay unun TBMM\u0027de yol açtığı siyasi kararı sormaktadır.","panel_ornek":"Bir apartman yönetimi hem eski hem yeni yöneticiyi aynı toplantıya davet etse, sakinler bu ikiliğe son vermek için tek bir karar alıp eski yöneticinin görevine son verir. İşte TBMM de böyle bir ikiliğe aynı şekilde son verdi.","ornek":"Bir apartman yönetimi hem eski hem yeni yöneticiyi aynı toplantıya davet etse, sakinler bu ikiliğe son vermek için tek bir karar alıp eski yöneticinin görevine son verir. İşte TBMM de böyle bir ikiliğe aynı şekilde son verdi.","yontemler":"Olay-tarih-sonuç sırasını zihinde kronolojik tutup saltanat ile halifelik kaldırılışını asla aynı tarihe bağlama.","nedir":"Bu konu Lozan Konferansı öncesinde yaşanan siyasi gelişmeleri anlatır. Sınav, çifte davetin hangi köklü siyasi karara yol açtığını ölçer."},"olay":"TBMM 1 Kasım 1922\u0027de saltanatı kaldırarak tek meşru temsilci olduğunu ortaya koymuştur.","tuzak":{"C":{"ad":"Sıralama Tuzağı","metin":"Öğrenci Mudanya\u0027yı çifte davetin sonucu sanır. Doğrusu: Mudanya Ateşkes Antlaşması 11 Ekim 1922\u0027de imzalanmış, çifte davet daha sonraki bir gelişmedir."},"E":{"ad":"Zamanlama Tuzağı","metin":"Öğrenci tüm rejim değişikliklerini aynı süreçte sanır. Doğrusu: Cumhuriyet, Lozan Konferansı\u0027ndan sonra 29 Ekim 1923\u0027te ilan edilmiştir."},"D":{"ad":"Kapsam Tuzağı","metin":"Öğrenci heyet başkanlığı seçimini çifte davete bağlı sanır. Doğrusu: İsmet Paşa\u0027nın heyet başkanı seçilmesi Mudanya\u0027daki başarısına dayanan ayrı bir karardır, çifte davetin sonucu değildir."},"B":{"ad":"Zamanlama Tuzağı","metin":"Öğrenci saltanat ve halifeliği aynı anda kalkmış sanır. Doğrusu: Halifelik saltanatla birlikte kaldırılmamış, 3 Mart 1924\u0027te ayrı bir kararla kaldırılmıştır."}},"celdiriciYol":{},"hap":"İtilaf Devletleri\u0027nin Lozan\u0027a hem TBMM hem İstanbul Hükümeti\u0027ni çağırması, TBMM\u0027nin 1 Kasım 1922\u0027de saltanatı kaldırmasıyla sonuçlanmıştır.","teshis":{"C":{"gercek":"Mudanya 11 Ekim 1922\u0027de imzalanmış, çifte davet ve saltanatın kaldırılması bundan sonraki haftalarda gerçekleşmiştir.","ayirt":"Bu olay çifte davetten önce mi sonra mı yaşandı?","paragraf":"İnkılap Tarihi - Mudanya Ateşkes Antlaşması","yanilgi":"Mudanya Ateşkes Antlaşması\u0027nı çifte davetten sonra gerçekleşmiş bir gelişme sanıyorsun."},"E":{"gercek":"Cumhuriyet, Lozan Konferansı\u0027nın sona ermesinden sonra 29 Ekim 1923\u0027te ilan edilmiştir, çifte davetle doğrudan ilgisi yoktur.","ayirt":"Bu gelişme konferanstan önce mi sonra mı gerçekleşti?","paragraf":"İnkılap Tarihi - Cumhuriyetin ilanı","yanilgi":"Dönemin tüm rejim değişikliklerini aynı zaman diliminde, birbirinin sonucu sanıyorsun."},"A":{"gercek":"İtilaf Devletleri\u0027nin ikilik yaratma amacına karşı TBMM, 1 Kasım 1922\u0027de saltanatı kaldırarak tek meşru hükümet olduğunu göstermiştir.","ayirt":"Bu gelişme çifte davetten hemen sonra mı, tek bir cevap niteliğinde mi gerçekleşti?","paragraf":"İnkılap Tarihi - Lozan öncesi gelişmeler","yanilgi":"Bu şıkkı eleyen öğrenci çifte davetin bir sonuç doğurmadığını, sadece bir davet olayı olduğunu sanır."},"D":{"gercek":"İsmet Paşa, Mudanya\u0027daki başarısı nedeniyle Mustafa Kemal Paşa tarafından istenmiş ve Dışişleri Bakanlığına getirilmiştir; bu, çifte davetten bağımsız bir karardır.","ayirt":"Bu karar davetten mi, yoksa kişisel başarıdan mı kaynaklandı?","paragraf":"İnkılap Tarihi - Lozan heyetinin oluşumu","yanilgi":"Heyet başkanlığı seçimini de çifte davetin bir sonucu sayıyorsun."},"B":{"gercek":"Halifelik, saltanatın kaldırıldığı 1 Kasım 1922\u0027den yaklaşık 16 ay sonra, 3 Mart 1924\u0027te ayrı bir kanunla kaldırılmıştır.","ayirt":"Bu iki kurum aynı tarihte mi kaldırıldı, yoksa aralarında yıllar var mı?","paragraf":"İnkılap Tarihi - Halifeliğin kaldırılması","yanilgi":"Saltanat ile halifeliğin aynı tarihte, tek kararla kaldırıldığını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 18"},"kural":"İtilaf Devletleri\u0027nin hem TBMM hem İ aha kaldı, Vahdettin 17 Kasım 1922\u0027de ülkeyi terk etti ve Abdülmecit Efendi halife seçildi. HEYETİN SEÇİLMESİ: Mustafa Kemal Paşa, Mudanya\u0027daki başarısı nedeniyle İsmet Paşa\u0027yı heyet başkanı istedi; İsmet Paşa Dışişleri Bakanlığına getirildi (Rauf Bey Başbakan idi). Heyette Rıza Nur ve Hasan Saka delege olarak bulundu. Heyete verilen kesin talimat: Ermeni yurdu ve kapitülasyonlar konusunda hiçbir ödün verilmeyecek, gerekirse görüşmeler kesilecek. Konferans 20 Kasım 1922\u0027de Lozan\u0027da açıldı. SINAV TUZAĞI: (1) Mudanya\u0027yı Yunanistan imzalamadı, İngiltere onun adına imzaladı. (2) Saltanatın kaldırılması Lozan\u0027a çifte davetin doğrudan sonucudur; halifelik o gün değil 3 Mart 1924\u0027te kaldırıldı. (3) Lozan heyetinin başkanı İsmet Paşa\u0027dır, Rauf Bey değil. SINAVDA NASIL SORULUR: \u0027İtilaf Devletleri\u0027nin Lozan Konferansı\u0027na İstanbul Hükümeti\u0027ni de çağırması aşa…"}],"hakem":"Soru, Lozan Konferansı öncesi gelişmeler konusu kapsamında çifte davetin TBMM\u0027yi saltanatı kaldırmaya yönelttiği ilişkisini ölçmektedir; kaynak metinde bu kural açıkça belirtilmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Mudanya Ateşkes Antlaşması\u0027nı çifte davetin sonucu sanabilirsin. Ama Mudanya 11 Ekim 1922\u0027de, çifte davetten önce imzalanmıştır.","E":"İkinci TBMM\u0027nin Lozan sonrasında açıldığını biliyor ve bu şıkkı seçebilirsin. Ancak bu gelişme çifte davetin direkt sonucu değil, konferansın tamamlanmasının ardından gerçekleşmiştir.","D":"İstanbul\u0027un işgalden kurtarılması gibi bir askeri olay ile çifte davetin sonucunu karıştırabilirsin. Bu iki olayın doğrudan bağlantısı yoktur.","B":"Halifelik ile saltanatı aynı anda düşündüğünde bu şık cazip gelir. Oysa halifelik 3 Mart 1924\u0027te ayrı bir kararla, saltanatın kaldırıldığından 16 ay sonra kaldırılmıştır."},"dogru":"İtilaf Devletleri barış konferansına hem TBMM\u0027yi hem İstanbul Hükümeti\u0027ni çağırarak Türk tarafını zayıflatmak istedi. TBMM buna karşı tek meşr 2","karar":"doğru","anlatim":"Evet, tam olarak böyle olmuş; TBMM 1 Kasım 1922\u0027de saltanatı kaldırarak tek meşru otorite olduğunu göstermiştir. Bu davet olmasaydı bu adım o gün gelmezdi.","formul":"Şık A: TBMM\u0027de bir vekil kalkıp \u0027bu ikilik bitsin, saltanatı kaldıralım\u0027 diyor, sen bu kararı çifte davetin sonucu sayar mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.halifelik-1924","karar":"yanlış","anlatim":"Hayır, halifelik o gün kalkmamış, Vahdettin ülkeyi terk etmiş ama halifelik makamı Abdülmecit Efendi\u0027yle sürmüş. Halifelik ancak 3 Mart 1924\u0027te kaldırılmış.","formul":"Şık B: aynı müdür \u0027saltanatla birlikte halifelik de o gün kalktı\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.mudanya-11ekim1922","karar":"yanlış","anlatim":"Hayır, sıra ters; Mudanya 11 Ekim 1922\u0027de imzalanmış, çifte davet ondan sonra gelmiş. Yani Mudanya bu davetin sonucu olamaz, ondan öncedir.","formul":"Şık C: \u0027zaten Mudanya da bu davetten sonra imzalandı, o da bu tepkinin sonucudur\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.olaylar-kronolojisi","karar":"yanlış","anlatim":"Hayır, İstanbul\u0027un kurtarılması ayrı bir askeri-siyasi süreçtir, çifte davetle nedensellik ilişkisi kaynakta hiç geçmez. Bu ikisini birbirine bağlamak yanlış olur.","formul":"Şık D: \u0027İstanbul da bu davet üzerine kurtarıldı\u0027 diyor, sen buna katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.ikinciTBMM-1923","karar":"yanlış","anlatim":"Hayır, İkinci TBMM 1923\u0027te açılmış, saltanatın kaldırılmasından ve Lozan sürecinden sonra gelen bir olaydır. Çifte davetin doğrudan sonucu değildir.","formul":"Şık E: \u0027İkinci TBMM de bu davete tepki olarak açıldı\u0027 diyor, sen bunu onaylar mısın?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Çifte davete TBMM\u0027nin verdiği tek doğrudan cevap saltanatın kaldırılmasıdır. Kendine hep şunu sor: bu olay 1 Kasım 1922\u0027den önce mi sonra mı gerçekleşmiş?","doldur":[]}],"anahtar":[{"ornek":"kaldırmasına","kok":"kaldır"},{"ornek":"saltanatı","kok":"saltan"},{"ornek":"halifelik","kok":"halife"},{"ornek":"daveti","kok":"daveti"},{"ornek":"İstanbul","kok":"İstanb"},{"ornek":"mudanya","kok":"mudany"}],"konuGiris":{"harita":"Ne zaman test edilir: çifte davetin hangi kararı doğurduğu sorulduğunda test edilir. Nasıl ölçülür: olay-tarih-sonuç zincirinin doğru eşleştirilmesiyle ölçülür. Nasıl kaydedilir: kronolojik sırada hatırlanacak bir sonuç bilgisi olarak kaydedilir.","desen":"Sınav çifte davetin sonucunu, saltanatın kaldırılmasıyla halifeliğin kaldırılmasını karıştırtarak sorar; bu iki olay farklı tarihlerdedir. Ayrıca Mudanya\u0027yı Yunanistan\u0027ın değil İngiltere\u0027nin imzaladığı ve heyet başkanının Rauf Bey değil İsmet Paşa olduğu noktalarında tuzak kurulur. Bu soru p.28\u0027deki çifte davet-saltanat kaldırma bağlantısı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"TBMM ile İtilaf Devletleri arasında imzalanan silahları bırakma anlaşması","ad":"Mudanya Ateşkesi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"İtilaf Devletleri\u0027nin hem TBMM hem İstanbul Hükümetini konferansa çağırması","ad":"Çifte davet","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"TBMM\u0027nin çifte davete karşı 1 Kasım 1922\u0027de aldığı meşruiyet kararı","ad":"Saltanatın kaldırılması","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Konferansta TBMM\u0027yi temsil eden İsmet Paşa başkanlığındaki delege grubu","ad":"Lozan heyeti","kim":"kanun sabitler"}],"sinavda":"Soru, çifte davet olayını verip TBMM\u0027nin buna karşı aldığı kararı seçenekler arasından bulmayı ister.","panel_ornek":"Bir arkadaşın iki farklı kişiyle aynı iş için sözleşme imzalamaya kalkışsa, sen tek yetkili olduğunu göstermek için resmi bir belge çıkarırsın. TBMM da tam böyle davranmış: tek meşru hükümet kendisi olsun diye kesin bir adım atmış.","ornek":"Bir arkadaşın iki farklı kişiyle aynı iş için sözleşme imzalamaya kalkışsa, sen tek yetkili olduğunu göstermek için resmi bir belge çıkarırsın. TBMM da tam böyle davranmış: tek meşru hükümet kendisi olsun diye kesin bir adım atmış.","yontemler":"Olayları tarih sırasına göre zincirleyerek ezberlemek en kritik yöntemdir; saltanat ile halifelik kaldırılışını asla aynı tarihe bağlama.","nedir":"Bu konu Mudanya\u0027dan Lozan\u0027a giden süreçte ikilik yaratma çabasını ve TBMM\u0027nin cevabını anlatır. Sınav burada hangi olayın hangi tarihte, hangi kurumun kararıyla gerçekleştiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Zamanlama Tuzağı","metin":"Çifte davetin sonucu ile öncesindeki olayı karıştırıyorsun. Doğrusu: Mudanya Ateşkes Antlaşması 11 Ekim 1922\u0027de, çifte davetten önce imzalanmıştır."},"E":{"ad":"Zamanlama Tuzağı","metin":"Sonraki bir gelişmeyi bu olayın sonucu sanıyorsun. Doğrusu: İkinci TBMM, Lozan sonrasında 1923\u0027te açılmıştır, çifte davetin sonucu değildir."},"D":{"ad":"Kapsam Tuzağı","metin":"Listedeki her askeri-siyasi olayı çifte davetin sonucu sanıyorsun. Doğrusu: İstanbul\u0027un kurtarılışı ayrı bir süreçtir ve çifte davetle doğrudan ilgili değildir."},"B":{"ad":"Tarih Karışıklığı Tuzağı","metin":"Saltanatla halifeliği aynı anda kaldırıldı sanıyorsun. Doğrusu: Halifelik saltanatın kaldırıldığı gün değil, 3 Mart 1924\u0027te ayrı bir kararla kaldırılmıştır."}},"celdiriciYol":{},"hap":"İtilaf Devletleri\u0027nin çifte daveti, TBMM\u0027nin 1 Kasım 1922\u0027de saltanatı kaldırmasına yol açmıştır; halifelik ise ayrıca 3 Mart 1924\u0027te kaldırılmıştır.","teshis":{"C":{"gercek":"Mudanya Ateşkes Antlaşması 11 Ekim 1922\u0027de imzalanmış, çifte davet ve saltanatın kaldırılması bundan sonra gerçekleşmiştir.","ayirt":"Mudanya, çifte davetten önce mi sonra mı imzalandı?","paragraf":"İnkılap Tarihi - Mudanya kronolojisi","yanilgi":"Mudanya\u0027yı çifte davetin sonrasına yerleştirip bu şıkkı seçersin."},"E":{"gercek":"İkinci TBMM, Lozan Konferansı ve saltanatın kaldırılmasından sonra 1923\u0027te açılmıştır.","ayirt":"İkinci TBMM ne zaman toplandı, çifte davetten önce mi sonra mı?","paragraf":"İnkılap Tarihi - TBMM dönemleri","yanilgi":"İkinci TBMM\u0027nin açılışını Lozan sürecinin bir parçası, hatta öncesi sanırsın."},"A":{"gercek":"Çifte davet karşısında TBMM 1 Kasım 1922\u0027de saltanatı kaldırarak tek meşru otorite olduğunu ilan etmiştir.","ayirt":"TBMM bu adımı hangi tarihte ve neye karşılık attı?","paragraf":"İnkılap Tarihi - Lozan öncesi kronoloji","yanilgi":"Saltanatın kaldırılmasını halifelikle birlikte tek bir olay sanıp bu şıkkı elersin."},"D":{"gercek":"İstanbul\u0027un kurtarılışı ayrı bir askeri-siyasi süreçtir, çifte davetle nedensellik bağı yoktur.","ayirt":"Bu olay çifte davetten önce mi gerçekleşti, aralarında sebep-sonuç var mı?","paragraf":"İnkılap Tarihi - olaylar kronolojisi","yanilgi":"Kurtuluş Savaşı\u0027ndaki her önemli olayı çifte davetin sonucu sanırsın."},"B":{"gercek":"Halifelik 1 Kasım 1922\u0027de değil, 3 Mart 1924\u0027te ayrı bir yasayla kaldırılmıştır.","ayirt":"Saltanat ile halifeliğin kaldırılış tarihleri aynı mı?","paragraf":"İnkılap Tarihi - saltanat-halifelik ayrımı","yanilgi":"Saltanat ve halifeliğin aynı tarihte, aynı kararla kaldırıldığını düşünüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 16"},"kural":"Kanun-i Esasi 1876\u0027da ilan edilmiş ve I. Meşrutiyet dönemi başlamıştır, bu dönemin padişahı II. Abdülhamit\u0027tir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 16","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Fermanları (Tanzimat, Islahat) Abdülmecit\u0027e, anayasayı (Kanun-i Esasi, her iki Meşrutiyet) II. Abdülhamit\u0027e bağla, karıştırma.","konu":"osmanlı padisahlari","tablo":{"satirlar":[["A) Abdülmecit","TESMER Konu Özeti - Son Dönem Padişahları","YANLIŞ ifade"],["B) Abdülaziz","TESMER Konu Özeti - Son Dönem Padişahları","YANLIŞ ifade"],["C) II. Abdülhamit","TESMER Konu Özeti - Son Dönem Padişahları","doğru ifade"],["D) V. Mehmet Reşat","TESMER Konu Özeti - Son Dönem Padişahları","YANLIŞ ifade"],["E) VI. Mehmet Vahdettin","TESMER Konu Özeti - Son Dönem Padişahları","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"II. Abdülhamit","E":"VI. Mehmet Vahdettin","A":"Abdülmecit","D":"V. Mehmet Reşat","B":"Abdülaziz"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - osmanli padisahlari","metin":"TEORİ (genel kültür – tarih; mevzuat maddesi yok). TANIM VE KURAL: Sınavda çoğunlukla iki kesit sorulur. KURULUŞ VE YÜKSELİŞ SIRASI: Osman Bey (kurucu), Orhan Bey (Bursa\u0027nın alınması, ilk düzenli ordu ve para), I. Murat (Edirne, Kosova), I. Bayezit Yıldırım (Niğbolu, Ankara Savaşı 1402 yenilgisi, Fetret Devri), I. Mehmet Çelebi (birliği yeniden kurdu), II. Murat (Varna, II. Kosova), II. Mehmet Fatih (İstanbul\u0027un fethi 1453), II. Bayezit, I. Selim Yavuz (Çaldıran, Mercidabık, Ridaniye; halifelik Osmanlı\u0027ya), I. Süleyman Kanuni (Mohaç, Viyana kuşatması, Preveze; en uzun saltanat). SON DÖNEM PADİŞAHLARI: Abdülmecit (1839–1861; Tanzimat Fermanı 1839, Islahat Fermanı 1856, Kırım Savaşı), Abdülaziz (1861–1876; ilk dış borçlanmanın ağırlaştığı dönem, tahttan indirildi), V. Murat (1876; birkaç ay), II. ABDÜLHAMİT (1876–1909; Kanun-i Esasi ve I. Meşrutiyet 1876, 93 Harbi, meclisin kapatılması, Düyun-u Umumiye 1881, II. Meşrutiyet 1908), V. MEHMET REŞAT (1909–1918; Trablusgarp, Balkan Savaşları, I. Dünya Savaşı), VI. MEHMET VAHDETTİN (1918–1922; Mondros, Sevr, Millî Mücadele\u0027ye karşı tutum; saltanatın kaldırılmasıyla ülkeyi terk etti, son padişah). Halifelik ise Abdülmecit Efendi ile 3 Mart 1924\u0027e kadar sürdü. KÜÇÜK ÖRNEK: \u0027Tanzimat Fermanı hangi padişah döneminde ilan edildi?\u0027 cevabı Abdülmecit\u0027tir; \u0027I. Meşrutiyet\u0027 II. Abdülhamit; \u0027Mondros\u0027 Vahdettin. SINAV TUZAĞI: (1) I. ve II. Meşrutiyet\u0027in ikisi de II. Abdülhamit dönemindedir; Reşat Meşrutiyet\u0027i ilan etmemiş, Meşrutiyet döneminde tahta çıkmıştır. (2) Son PADİŞAH Vahdettin, son HALİFE Abdülmecit Efendi\u0027dir. (3) Tanzimat ve Islahat…"}],"hakem":"Soru, Osmanlı Padişahları konusunun temel tarihsel olaylarını (Kanun-i Esasi ve I. Meşrutiyet) ölçmektedir; kaynak metinde II. Abdülhamit dönemine (1876–1909) açıkça atfedilmiştir."},"kayitlar":[],"sade":{"siklar":{"D":"V. Mehmet Reşat, 1908\u0027de II. Meşrutiyet ilan edildiğinde tahta çıkmıştır, ancak Kanun-i Esasi\u0027yi kendisi ilan etmemiş, Meşrutiyet döneminde yönetmiştir.","E":"VI. Mehmet Vahdettin saltanatın kaldırıldığı son padişah olup Kanun-i Esasi ile ilgili değildir; bu oluş II. Abdülhamit\u0027in dönemi sırasında meydana gelmiştir.","A":"Abdülmecit döneminde Tanzimat Fermanı (1839) ve Islahat Fermanı (1856) ilan edilmiştir, bunlar Kanun-i Esasi ve Meşrutiyet ile karıştırılmamalıdır.","B":"Abdülaziz tahttan indirilmesinin ardından V. Murat kısa süre tahta çıkmış, sonrasında II. Abdülhamit\u0027in dönemi başlamıştır; Kanun-i Esasi II. Abdülhamit tarafından ilan edilmiştir."},"dogru":"Kanun-i Esasi 1876 yılında ilan edilerek I. Meşrutiyet dönemi başlamıştır. Bu dönemin padişahı II. Abdülhamit\u0027tir. Sorulan olay II. Abdülhamit\u0027in saltanatında gerçekleşmiştir.","sinav":"Kanun-i Esasi 1876 yılında I. Meşrutiyet dönemi başlatılmış ve bu dönemin padişahı II. Abdülhamit\u0027tir.","kavramlar":[{"kaynak":"TEORI","tanim":"Kanun-i Esasi\u0027nin ilanıyla 1876 yılında başlayan ve II. Abdülhamit döneminde yaşanan anayasal yönetim dönemiydi.","ad":"I. Meşrutiyet"},{"kaynak":"TEORI","tanim":"1876 ile 1909 yılları arasında Osmanlı Devleti\u0027ni yönetmiş olan padişahtır; döneminde Kanun-i Esasi ilan edilmiş, I. Meşrutiyet başlamış ve II. Meşrutiyet ilan edilmiştir.","ad":"II. Abdülhamit"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"Osmanlı Devleti\u0027nde Kanun-i Esasi\u0027nin ilan edilerek I. Meşrutiyet\u0027e geçildiği dönemin padişahı aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-13","verilenler":[],"dayanak":"TESMER SGS Konu Anlatımı - Osmanlı Padişahları / Tanzimat-Meşrutiyet Dönemi","dogru":"C","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Bir başka okulun tarih panosunda 1876 tarihli bir belge asılı: \u0027Kanun-i Esasi ilan edildi.\u0027 Altında padişah portresi var ama isim silinmiş.","anlatim":"Öğrenciler bu portrenin hangi padişaha ait olduğunu tartışıyor. Beş isim öne sürülüyor: Abdülmecit, Abdülaziz, II. Abdülhamit, V. Mehmet Reşat, VI. Mehmet Vahdettin.","doldur":[]},{"formul":"Ne yapacağız: 1876\u0027da Kanun-i Esasi ilan edildi ve I. Meşrutiyet başladı; bu tarihte tahtta kim vardı sorusunu çözeceğiz.","anlatim":"Her padişahın dönemini tek tek 1876 yılıyla eşleştireceğiz. Beş ismi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TESMER Konu Özeti - Son Dönem Padişahları","karar":"yanlış","anlatim":"Abdülmecit 1839-1861 arası hüküm sürdü, Tanzimat ve Islahat fermanları ona ait. 1876\u0027da o çoktan ölmüştü, Kanun-i Esasi\u0027yle ilgisi yok.","formul":"Şık A: Pano \u0027Abdülmecit\u0027 mi yazıyor dersin, sen bu portreye onun ismini yapıştırır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TESMER Konu Özeti - Son Dönem Padişahları","karar":"yanlış","anlatim":"Abdülaziz 1876\u0027da tahttan indirildi ama Kanun-i Esasi\u0027yi ilan eden o değil. Yerine kısa süre V. Murat, sonra II. Abdülhamit geçti ve ilan onun döneminde oldu.","formul":"Şık B: Arkadaşın \u0027Abdülaziz tahttan indirilirken bu ilan olmuştur\u0027 diyor, ona hak verir misin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TESMER Konu Özeti - Son Dönem Padişahları","karar":"doğru","anlatim":"1876\u0027da Kanun-i Esasi ilan edildi ve I. Meşrutiyet başladı, tahttaki padişah II. Abdülhamit\u0027ti. Aynı padişah 1878\u0027 uz hazırlığı başladı. SINAV TUZAĞI: (1) Başkomutanlık Kanunu Sakarya\u0027dan ÖNCE (5 Ağustos 1921) çıktı; Mareşal ve Gazi unvanı SONRA (19 Eylül) verildi. (2) Ankara Antlaşması Fransa ile, Kars Antlaşma…"}],"hakem":"Soru Sakarya Meydan Muharebesi\u0027nin (23 Ağustos – 13 Eylül 1921) sonuçlarını ölçmekte, C seçeneği (Moskova Antlaşması 16 Mart 1921) savaştan önce imzalandığı için doğru cevaptır."},"kayitlar":[],"sade":{"siklar":{"D":"Yunan ordusunun taarruz gücünün kırılıp savunmaya geçmesi, savaşın en doğrudan sonucudur ve Kurtuluş Savaşı\u0027nın seyrini değiştirmiştir.","E":"Kars Antlaşması 13 Ekim 1921\u0027de imzalanmış; Sakarya sonrasında oluşan diplomatik ortamda Kafkas cumhuriyetleriyle yapılarak doğu sınırını kesinleştirmiştir.","A":"Mareşal rütbesi ve Gazi unvanının savaş bittikten sonra 19 Eylül 1921\u0027de verilmesi, Sakarya\u0027nın doğru bir sonucudur ve bu şık savaşın gerçek sonuçlarından biridir.","B":"Fransa ile Ankara Antlaşması 20 Ekim 1921\u0027de imzalanmıştır; Sakarya zaferi sonrasında oluşan güçlü konumla Fransa\u0027nın çekilmesini sağlayan sonuçtur."},"dogru":"Moskova Antlaşması 16 Mart 1921\u0027de, yani Sakarya Meydan Muharebesi (23 Ağustos–13 Eylül 1921) başlamadan çok önce imzalanmıştır. Savaşın bir sonucu olması için savaştan sonra gerçekleşmesi gerekir.","sinav":"Bir gelişmenin Sakarya Meydan Muharebesi\u0027nin sonucu sayılabilmesi için 23 Ağustos–13 Eylül 1921 tarihindeki savaştan sonra gerçekleşmiş olması gerekir.","kavramlar":[{"kaynak":"TEORI","tanim":"TBMM tarafından Sakarya Meydan Muharebesi\u0027nden sonra Mustafa Kemal\u0027e verilen askeri rütbe ve onurlandırıcı unvan.","ad":"Mareşal rütbesi ve Gazi unvanı"},{"kaynak":"TEORI","tanim":"Savaştan (23 Ağustos–13 Eylül 1921) sonra gerçekleşen iç ve dış politika gelişmeleri.","ad":"Sakarya Meydan Muharebesi\u0027nin sonuçları"},{"kaynak":"TEORI","tanim":"Sovyet Rusya ile 16 Mart 1921\u0027de imzalanan antlaşma.","ad":"Moskova Antlaşması"}]},"cikmis":{"pencereDonemler":["2026/2","
