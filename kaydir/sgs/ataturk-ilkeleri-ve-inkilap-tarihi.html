<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".

   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. Koyu tema yalnız düğmeyle (data-theme="dark", tarayıcıda kc_tema) ya da ?tema=koyu ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}

.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}
#akis{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.kart{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;max-width:560px;margin:0 auto}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.78em;color:var(--dim);margin-bottom:8px}
.noktalar{display:flex;gap:5px}.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--cizgi);display:block}.noktalar i.ok{background:var(--yesil)}.noktalar i.yan{background:var(--kirmizi)}.noktalar i.simdi{outline:2px solid var(--mavi);outline-offset:1px}
.noktalar.cok{gap:3px;flex-wrap:wrap;max-width:58%;justify-content:center}.noktalar.cok i{width:5px;height:5px}
.tt.teori td:first-child{white-space:nowrap;font-weight:700;color:var(--dim);width:1%}
.sinavDil{font:inherit;font-size:.78em;color:var(--mavi);background:transparent;border:1px solid var(--cizgi);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer}
.sinavDilM{margin-top:6px;font-size:.86em;color:var(--dim);border-left:2px solid var(--cizgi);padding-left:8px}
.govde{flex:1;overflow-y:auto;padding-bottom:90px}
.rozet{display:inline-block;font-size:.72em;color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 50%,transparent);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}
.ipucu{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:.8em;pointer-events:none;animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.panel.acik{transform:translateY(0)}.tutamac{width:38px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 10px}
/* Cem 03.09 "gorunum boyle geliyor": KAPALI panel kartin altina (105%) kayiyor ve SONRAKI KARTIN ustune biniyordu.

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}

.ozet{font-size:.93em;margin:0 0 8px;line-height:1.45}.ozet b{color:var(--yesil)}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}

.cip2.ek{display:none}.cipler.acikEk .cip2.ek{display:inline-block}.cipler.acikEk .bDaha{color:var(--dim)}
.cipler .bDaha{border-style:dashed;color:var(--dim)}
.sek{display:none;margin-top:8px}.sek.acik{display:block;animation:gir .2s ease}
.panel{overscroll-behavior:contain}
.kavramL{margin:4px 0 8px;padding-left:18px}.kavramL li{margin:3px 0}.kavramL i{color:var(--dim);font-style:normal;font-size:.85em}
.panelBas{position:sticky;bottom:4px;display:block;margin:10px 0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:.84em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent)}

/* yanlis kutusu + hazirlik skoru */
.ustSag{display:flex;align-items:center;gap:6px}
.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}
.kutuEkran{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}.kutuEkran.acik{display:flex}
.kutuIc{background:var(--kart);width:min(100%,640px);max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 22px;border:1px solid var(--cizgi)}
@media(min-width:900px){.kutuEkran{align-items:center}.kutuIc{border-radius:18px}}
.kutuIc .basl{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}

.dersSat{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92em}.dersSat .bar{height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden}.dersSat .bar i{display:block;height:100%;background:var(--yesil)}
.kutuSat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.92em}
/* kaynak metni */
.kaynakAd{color:var(--mavi);font-weight:800;font-size:.85em;margin:8px 0 4px}.kaynakMetin{font-size:.9em;line-height:1.55;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px}.kaynakMetin mark{background:color-mix(in srgb,var(--altin) 35%,transparent);color:var(--yazi);padding:1px 2px;border-radius:3px}
/* sen anlat / t-hesabi / sinavda */
.ipnot{font-size:.84em;color:var(--dim);margin:2px 0 8px}
.anlatK{width:100%;background:var(--bg2);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 11px;font-size:.95em;font-family:inherit;resize:vertical}
.anlatSonuc{font-size:.92em;margin-top:8px;line-height:1.5}.anlatPuan{font-weight:800;font-size:1.05em;margin-bottom:4px}.anlatOrnek{margin-top:8px;border-left:4px solid var(--altin);padding:6px 10px;background:color-mix(in srgb,var(--altin) 8%,transparent);border-radius:0 8px 8px 0}
.tKutular{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:600px){.tKutular{grid-template-columns:1fr 1fr}}

.tGovde{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--yazi);min-height:88px}.tSol{border-right:2px solid var(--yazi);padding:6px 8px}.tSag{padding:6px 8px;text-align:right}

.cikmisK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.88em;color:var(--dim);line-height:1.45}.cikmisK .yil{display:inline-block;background:color-mix(in srgb,var(--mavi) 15%,transparent);color:var(--mavi);font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.85em}

.ogret{margin:4px 0 6px}.thpNot{font-size:.85em;color:var(--dim);margin:2px 0 8px}
.hesapK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.9em;line-height:1.45}.hesapK.yan{border-color:color-mix(in srgb,var(--kirmizi) 60%,transparent)}.hesapK.dog{border-color:color-mix(in srgb,var(--yesil) 60%,transparent)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.btn{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;font-size:.9em;cursor:pointer}.btn.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0}.btn.mavi{border-color:var(--mavi);color:var(--mavi)}
/* surukleme oyunu */

.oyun{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:20;overflow-y:auto}.oyun.acik{display:flex}

#akis,.govde,.tabloSar,.serit,.panel,.oyun{scrollbar-width:none}#akis::-webkit-scrollbar,.govde::-webkit-scrollbar,.tabloSar::-webkit-scrollbar,.serit::-webkit-scrollbar,.panel::-webkit-scrollbar,.oyun::-webkit-scrollbar{display:none}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

const SORULAR=[{"capa":{"kaynak":"SGS 2024/3 Soru 20"},"kural":"Savaşı yöneten İttihat ve Terakki hükümeti istifa etmiş, ateşkesi Ahmet İzzet Paşa hükümeti adına Bahriye Nazir Rauf (Orbay) Bey imzalamıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 20","sonDonem":3,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Özel isim-tarih-yer uclusunu (kisi, sira, mekan) birbirinden ayirt et; sikta gecen her ayrinti sınav için ayri bir tuzak noktasidir.","konu":"i. dünya savaşı","tablo":{"satirlar":[["A) Antlaşmayı Osmanlı Devleti adına, savaşı yürüten İttihat…","Mondros Ateşkesi imzacıları","YANLIŞ ifade"],["B) Antlaşma, İtilaf Devletleri ile Osmanlı Devleti arasında…","Mondros/Sevr ayrımı","YANLIŞ ifade"],["C) İttifak Devletleri arasında savaştan ilk çekilen devlet …","İttifak Devletleri ateşkesleri","YANLIŞ ifade"],["D) Antlaşma, Osmanlı Devleti adına Rauf Orbay tarafından im…","Mondros Ateşkesi imzacıları","doğru ifade"],["E) Antlaşma, İstanbul\u0027da Yıldız Sarayı\u0027nda imzalanmıştır.","Mondros Ateşkesi imza yeri","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İttifak Devletleri arasında savaştan ilk çekilen devlet Osmanlı Devleti\u0027dir.","E":"Antlaşma, İstanbul\u0027da Yıldız Sarayı\u0027nda imzalanmıştır.","A":"Antlaşmayı Osmanlı Devleti adına, savaşı yürüten İttihat ve Terakki hükümetinin başındaki Talat Paşa imzalamıştır.","D":"Antlaşma, Osmanlı Devleti adına Rauf Orbay tarafından imzalanmıştır.","B":"Antlaşma, İtilaf Devletleri ile Osmanlı Devleti arasında imzalanmış bir barış antlaşmasıdır."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - i. dunya savasi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: I. Dünya Savaşı 1914–1918 yılları arasında İtilaf Devletleri (İngiltere, Fransa, Rusya; sonra İtalya, ABD) ile İttifak Devletleri (Almanya, Avusturya-Macaristan; sonra Osmanlı Devleti, Bulgaristan) arasında yapıldı. NEDENLER: Sömürgecilik ve ham madde yarışı, Almanya–İngiltere ekonomik rekabeti, Fransa\u0027nın Alsas-Loren\u0027i geri alma isteği, Balkanlar\u0027da Rusya–Avusturya çekişmesi, silahlanma ve bloklaşma; görünürdeki neden Avusturya veliahdının Saraybosna\u0027da öldürülmesidir. OSMANLI\u0027NİN GİRİŞİ: Osmanlı Devleti 1914 sonbaharında Almanya yanında savaşa girdi; Goeben ve Breslau gemilerinin Karadeniz\u0027de Rus limanlarını vurması fiilî girişi sağladı. Nedenler: kaybedilen toprakları geri alma umudu, Almanya\u0027nın savaşı kazanacağı inancı, İttihat ve Terakki yönetiminin Alman yanlılığı, kapitülasyonlardan kurtulma isteği. CEPHELER: Taarruz cepheleri Kafkas (Sarıkamış felaketi) ve Kanal; savunma cepheleri Çanakkale (1915 zafer, Mustafa Kemal Anafartalar), Irak (Kut\u0027ül Amare zaferi 1916), Suriye-Filistin, Hicaz-Yemen; müttefiklere yardım cepheleri Galiçya, Makedonya, Romanya. SONUÇ: Osmanlı Devleti 30 Ekim 1918 Mondros Ateşkes Antlaşması ile savaştan çekildi; savaş 11 Kasım 1918\u0027de Almanya\u0027nın ateşkesiyle bitti. Wilson İlkeleri (Ocak 1918) barışın çerçevesini çizdi; yenilenlerle Paris Barış Konferansı\u0027nda antlaşmalar yapıldı: Versay (Almanya), Sen Jermen (Avusturya), Nöyyi (Bulgaristan), Triyanon (Macaristan), Sevr (Osmanlı, 10 Ağustos 1920; TBMM tanımadı, uygulanmadı). İmparatorluklar dağıldı, yeni ulus devletler kuruldu, Mille…"},{"ad":"TEORI - i. dunya savasi osmanli ekonomisi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: Savaşa girilen 1914 yılında Osmanlı hükümeti KAPİTÜLASYONLARI TEK TARAFLI KALDIRDIĞINI ilan etti ve yabancılara tanınan ayrıcalıkları sona erdirdi; ardından gümrük tarifesi yükseltilip yerli üretimi koruyan spesifik tarifeye geçildi. İttihat ve Terakki yönetimi MİLLÎ İKTİSAT politikası izledi: Müslüman-Türk girişimci sınıfı yaratmak için yerli şirketler, millî bankalar ve esnaf-tüccar kooperatifleri desteklendi; yabancı şirketlerde Türkçe yazışma zorunluluğu getirildi; Ziya Gökalp ve Tekin Alp bu görüşün fikir öncüleridir. SAVAŞ FİNANSMANI: Devlet giderlerini karşılıksız KÂĞIT PARA (evrak-ı nakdiye) basarak ve Almanya\u0027dan borç alarak karşıladı; para arzı arttı, altın karşılığı düştü, yüksek ENFLASYON ve karaborsa doğdu. Erkeklerin silah altına alınması tarım üretimini düşürdü; ordu ve büyük şehirlerin beslenmesi İAŞE SORUNUnu doğurdu; hükümet İaşe Nezareti kurup ürünlere el koydu, vesika uygulaması yaptı. Savaş yıllarında \u0027harp zenginleri\u0027 denen vurguncu bir kesim ortaya çıktı; hükümet ihtikârla (vurgunculukla) mücadele düzenlemeleri yaptı. Dış ticaret İtilaf ablukası yüzünden neredeyse durdu; ekonomi Almanya\u0027ya bağımlı hâle geldi. SONUÇ: Savaş sonunda Osmanlı ekonomisi çökmüş, dış borç ve Düyun-u Umumiye yükü ağırlaşmış, üretim ve nüfus kaybı büyümüştü; bu tablo Millî Mücadele\u0027nin yoksul iktisadi zeminini oluşturdu. SINAV TUZAĞI: (1) Kapitülasyonlar 1914\u0027te tek taraflı kaldırıldı ama hukuken kesin kaldırılışı 1923 Lozan Barış Antlaşması iledir. (2) Savaş enflasyonunun temel nedeni karşılıksız kâğıt paradır, ver…"}],"hakem":"Soru I. Dünya Savaşı ve Mondros Ateşkes Antlaşması konusunu ölçüyor; doğru sık kaynakta desteklenen tarihsel olaya dayanıyor."},"kayitlar":[],"sade":{"siklar":{"C":"İttifaktan ilk çekilen devlet Bulgaristan\u0027dır (29 Eylül 1918). Osmanlı Devleti 30 Ekim 1918\u0027de çekilmiş olup ittifaktan ikinci sıradaki çekiliştir.","E":"Ana kararlar Osmanlı başkenti İstanbul\u0027da alınsa da imza merasimi Limni Adası\u0027nın Mondros Limanı\u0027nda, Agamemnon zırhlısında yapılmıştır.","A":"Talat Paşa savaşı yönetse de antlaşmadan önce istifa etti; istifası nedeniyle imzacı olarak adlandırılmak yanlış. Gerçek imzacı Ahmet İzzet Paşa hükümeti tarafından gönderilen Rauf Orbay\u0027dır.","B":"Mondros bir ateşkestir (savaşın durdurulması), barış antlaşması değildir. Osmanlı için gerçek barış antlaşması ancak 10 Ağustos 1920\u0027de Sevr\u0027de yapılmış olup uygulanmamıştır."},"dogru":"Osmanlı Devleti savaşı yönetecek olan Talat Paşa hükümeti istifa ettiği için, onun yerine kurulan Ahmet İzzet Paşa hükümeti Mondros Ateşkes Antlaşması\u0027nı imzaladı. Bu antlaşmayı Osmanlı adına Bahriye Nazırı Rauf Orbay Bey imzalamıştır.","sinav":"Mondros Ateşkes Antlaşması\u0027nı Osmanlı Devleti adına imzalayan kişi kimdir?","kavramlar":[{"kaynak":"TEORI","tanim":"Osmanlı Devleti\u0027nin 30 Ekim 1918\u0027de İtilaf Devletleri ile imzaladığı, I. Dünya Savaşı\u0027nı sona erdiren antlaşmadır. Limni Adası Mondros Limanı\u0027nda, Agamemnon zırhlısında imzalanmıştır.","ad":"Mondros Ateşkes Antlaşması"},{"kaynak":"TEORI","tanim":"Savaşı yürüten taraflar arasında yapılan, savaşı durdurma ve barış koşullarını görüşmeye başlama anlaşmasıdır. Barış antlaşması değildir.","ad":"Ateşkes"},{"kaynak":"TEORI","tanim":"I. Dünya Savaşı\u0027nı yönetmiş olan Talat Paşa liderliğindeki hükümet olup, savaşın sonunda istifa ederek yerine Ahmet İzzet Paşa hükümeti gelmişdir.","ad":"İttihat ve Terakki hükümeti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/1","2018/3","2015/1"]},"oyun":null,"tip":"teori","soru":"I. Dünya Savaşı sonunda Osmanlı Devleti\u0027nin imzaladığı ateşkes antlaşmasına ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-01","verilenler":[],"dayanak":"Inkilap Tarihi konu anlatimi - Mondros Ateskes Antlasmasi (30 Ekim 1918)","dogru":"D","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 1918 yılının Ekim ayı, Karadeniz\u0027de rüzgâr sert esiyor; Limni Adası açıklarında demirlemiş Agamemnon zırhlısının güvertesinde iki heyet karşı karşıya geliyor.","anlatim":"Bir tarafta İngiliz Amiral Calthorpe var, öbür tarafta Osmanlı\u0027yı temsil eden bir heyet oturuyor. Savaşı yöneten İttihat ve Terakki hükümeti çoktan istifa etmiş, yerine Ahmet İzzet Paşa hükümeti gelmiş. 30 Ekim 1918 günü bu masada bir imza atılacak.","doldur":[]},{"formul":"Ne yapacağız: Bu olayda beş ayrı iddia var; kimin imzaladığı, nerede imzalandığı, neyin imzalandığı, hangi devletin önce çekildiği sorularını tek tek soracağız.","anlatim":"Sen de bu masaya oturmuş gibi düşün, her iddiayı olayın kendi ayrıntılarıyla test et. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Mondros Ateşkesi imzacıları","karar":"yanlış","anlatim":"Hayır, Talat Paşa hükümeti yenilgi belli olunca istifa etmiş, artık koltukta değil. İmzayı atan kişi yeni kurulan Ahmet İzzet Paşa hükümetinin bir bakanı.","formul":"Şık A: Masada imzayı, savaşı başından beri yöneten Talat Paşa mı atıyor, diye sorsalar ne dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Mondros/Sevr ayrımı","karar":"yanlış","anlatim":"Değil, bu sadece silahların susturulduğu bir ateşkes. Osmanlı\u0027nın gerçek barış belgesi iki yıl sonra 10 Ağustos 1920\u0027de imzalanan Sevr olacak.","formul":"Şık B: Bu zırhlıdaki belge, savaşı tamamen bitiren, sınırları kalıcı çizen bir barış antlaşması mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"İttifak Devletleri ateşkesleri","karar":"yanlış","anlatim":"Hayır, bir ay önce 29 Eylül 1918\u0027de Bulgaristan zaten Selanik Ateşkesi\u0027ni imzalamış. Osmanlı, Almanya ile kâra bağlantısı kesilince ikinci sırada çekiliyor.","formul":"Şık C: Peki bu gemide imza atan Osmanlı, İttifak grubundan savaştan çekilen ilk devlet mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Mondros Ateşkesi imzacıları","karar":"doğru","anlatim":"Evet, tam olarak bu; Ahmet İzzet Paşa hükümetinin Bahriye Nazırı Rauf Orbay heyete başkanlık edip imzayı atıyor. Karşısında İngiliz Amiral Calthorpe oturuyor.","formul":"Şık D: O zaman güvertede masaya oturup imzayı atan Osmanlı temsilcisi kim, Rauf Orbay mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Mondros Ateşkesi imza yeri","karar":"yanlış","anlatim":"Hayır, hiç İstanbul\u0027a gerek kalmıyor; imza Limni Adası\u0027nın Mondros Limanı\u0027nda, Agamemnon zırhlısının güvertesinde atılıyor. Yer bir gemi, bir saray değil.","formul":"Şık E: Peki bu imza, İstanbul\u0027da Yıldız Sarayı\u0027nın salonlarında mı atılıyor?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Bu olayda tek doğru nokta, imzayı Bahriye Nazırı sıfatıyla Rauf Orbay\u0027ın atmış olması. Kendine hep şunu sor: bu kararı hükümetin başındaki lider mi, yoksa o an görevdeki bakan mı imzaladı?","doldur":[]}],"anahtar":[{"ornek":"hükümeti","kok":"hüküme"},{"ornek":"osmanlı","kok":"osmanl"},{"ornek":"imzalamıştır","kok":"imzala"},{"ornek":"ateşkes","kok":"ateşke"},{"ornek":"bahriye","kok":"bahriy"},{"ornek":"istifa","kok":"istifa"}],"konuGiris":{"harita":"Ne zaman test edilir: hangi devletin hangi tarihte hangi ateşkesi imzaladığı sorulduğunda. Nasıl ölçülür: imzalayan kişi, tarih ve yer bilgisinin doğru eşleştirilmesiyle. Nasıl kaydedilir: ateşkes ile barış antlaşmasının (Sevr) birbirine karıştırılmamasıyla.","desen":"Sınav çoğunlukla \u0027ilk çekilen devlet Bulgaristan mı Osmanlı mı\u0027 tuzağını kurar; ikinci tuzak Mondros\u0027u imzalayan kişinin Rauf Orbay değil Enver ya da Talat Paşa gösterilmesidir. Üçüncü tuzak Mondros\u0027un ateşkes değil barış antlaşması gibi sunulmasıdır (p. i. dünya savaşı ateşkes). Bu soru ateşkes-barış antlaşması karışıklığı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Osmanlı\u0027nın savaştan çekilmesini sağlayan 30 Ekim 1918 tarihli ateşkes belgesi","ad":"Mondros Ateşkes Antlaşması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Mondros\u0027u Osmanlı Devleti adına imzalayan Bahriye Nazırı","ad":"Rauf Orbay","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bulgaristan\u0027ın 29 Eylül 1918\u0027de imzaladığı, İttifak\u0027tan ilk çekilişi gösteren ateşkes","ad":"Selanik Ateşkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Mondros\u0027tan sonra imzalanan ama TBMM\u0027nin tanımadığı barış antlaşması","ad":"Sevr Antlaşması","kim":"kanun sabitler"}],"sinavda":"Soruda I. Dünya Savaşı sonundaki Osmanlı ateşkesine dair bir ifade verilir ve doğru bilgiyi seçmeniz istenir.","panel_ornek":"Bir arkadaşın kiraladığı evden çıkmadan önce ev sahibiyle \u0027geçici bir anlaşma\u0027 yapıp eşyalarını 3 gün içinde topladığını düşün; bu henüz asıl sözleşmenin bitişi değil, sadece ilişkiyi durduran bir ara adımdır. Sonra 10 gün sonra gerçek fesih kağıdını imzalıyor. İşte ateşkes de tam böyle: savaşı durduran ama son sözü söylemeyen bir ara adımdır.","ornek":"Bir arkadaşın kiraladığı evden çıkmadan önce ev sahibiyle \u0027geçici bir anlaşma\u0027 yapıp eşyalarını 3 gün içinde topladığını düşün; bu henüz asıl sözleşmenin bitişi değil, sadece ilişkiyi durduran bir ara adımdır. Sonra 10 gün sonra gerçek fesih kağıdını imzalıyor. İşte ateşkes de tam böyle: savaşı durduran ama son sözü söylemeyen bir ara adımdır.","yontemler":"Tarihleri sıraya dizerek (Bulgaristan-Osmanlı-Avusturya-Almanya) kronoloji kurmak en kritik kuraldır; Mondros\u0027u Sevr ile asla karıştırma.","nedir":"Bu konu Osmanlı Devleti\u0027nin I. Dünya Savaşı\u0027ndan Mondros Ateşkes Antlaşması ile çekilişini anlatır. Sınav; antlaşmanın tarihini, imzalayan kişiyi ve ateşkes ile barış antlaşması ayrımını ölçer."},"olay":"-","tuzak":{"C":{"ad":"Sıra Tuzağı","metin":"Osmanlı\u0027nin ağır hükümlerle anilmasindan onun ilk çekildiğini sanırsın. Doğrusu: ittifaktan ilk çekilen Bulgaristan\u0027dir (29 Eylül 1918), Osmanlı ikinci sırada 30 Ekim 1918\u0027de cekilmistir."},"E":{"ad":"Yer Tuzağı","metin":"Ana kararların İstanbul\u0027da alındığını düşünüp imza yerini de baskent sanırsın. Doğrusu: imza, Limni Adası\u0027nin Mondros Limaninda, Agamemnon zirhlisinda atılmıştır."},"A":{"ad":"Kişi Tuzağı","metin":"Talat Paşa hükümetinin istifa ettiğini, imzayı Ahmet İzzet Paşa hükümetinin Bahriye Nazirini gonderdigini atlayıp savaşı yöneten ismi imzacı sayarsın. Doğrusu: imzayı Rauf Orbay atmıştır."},"B":{"ad":"Belge Türü Tuzağı","metin":"Mondros\u0027u Sevr ile karıştırıp ateşkesi barisla özdeşleştirirsin. Doğrusu: Mondros bir ATEŞKES\u0027tir, barisi ancak 10 Ağustos 1920\u0027de Sevr sağlamıştır."}},"celdiriciYol":{},"hap":"Mondros Ateşkes Antlaşması\u0027ni Osmanlı adına Rauf Orbay imzalamıştır; ittifaktan ilk çekilen Bulgaristan, ikinci Osmanlı\u0027dir ve bu bir ateşkestir, barisi Sevr getirmiştir.","teshis":{"C":{"gercek":"İttifak\u0027tan ilk çekilen Bulgaristan\u0027dir (29 Eylül 1918 Selanik Ateşkesi); Osmanlı 30 Ekim 1918\u0027de ikinci sırada cekilmistir.","ayirt":"Bu devletin ateşkes tarihi diğer İttifak üyelerinden önce mi sonra mi?","paragraf":"Inkilap Tarihi konu anlatimi - I. Dunya Savasi ateskesleri","yanilgi":"Osmanlı\u0027nin ağır hükümlerle anilmasi seni onun savaştan ilk çıkan devlet olduğu yanılgısına surukler."},"E":{"gercek":"İmza, Limni Adası\u0027nin Mondros Limaninda Agamemnon zirhlisinda 30 Ekim 1918\u0027de atılmıştır.","ayirt":"Bu antlaşmanın imza yeri baskent mi yoksa başka bir liman/gemi mi?","paragraf":"Inkilap Tarihi konu anlatimi - Mondros Ateskesi imza yeri","yanilgi":"Önemli siyasi kararların hep baskentte alındığını genellersin, imza yerini de İstanbul sanırsın."},"A":{"gercek":"Talat Paşa hükümeti savaş sonu yenilgi belirince istifa etmiş, ateşkesi kuran Ahmet İzzet Paşa hükümeti adına Rauf Orbay imzalamıştır.","ayirt":"Bu olay sırasında hükümet değişmiş mi, değişmişse imzayı kim atmış diye sorar misin?","paragraf":"Inkilap Tarihi konu anlatimi - Mondros Ateskesi","yanilgi":"Savaşı yöneten hükümetin lideri kim ise ateşkesi de onun imzaladığını düşünürsün."},"D":{"gercek":"Ateşkes müzakeresini yürüten ve imzalayan kişi, Ahmet İzzet Paşa hükümetinin Bahriye Nazir Rauf (Orbay) Bey\u0027dir; İngiliz taraf Amiral Calthorpe\u0027tür.","ayirt":"Heyete gerçekte kim başkanlık etti, hangi sıfatla?","paragraf":"Inkilap Tarihi konu anlatimi - Mondros Ateskesi imzacilari","yanilgi":"Bu şıkkı eleyen öğrenci, imzayı hükümet başkanının attigini düşünüp Rauf Orbay\u0027in Bahriye Nazir kimliğiyle heyete başkanlık ettiğini gözden kaçırır."},"B":{"gercek":"Mondros bir ateşkestir, savaşı durdurur ama hukuki barisi sağlamaz; Osmanlı için barisi Sevr (10 Ağustos 1920) getirmiş, o da uygulanmamıştır.","ayirt":"Bu belge savaşı bitiriyor mu yoksa sadece silahlari susturuyor mu?","paragraf":"Inkilap Tarihi konu anlatimi - Mondros/Sevr ayrimi","yanilgi":"Ateşkes ile barisi aynı şey sayıp Mondros\u0027u Sevr\u0027in yerine koyarsın."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 20"},"kural":"Savaştan ilk çekilen İttifak devleti Bulgaristan\u0027dır (Selanik Ateşkesi, 29 Eylül 1918); Mondros Ateşkes Antlaşması\u0027nı Osmanlı adına Bahriye Nazırı Rauf (Orbay) Bey imzalamıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 20","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Ateşkes sorularında önce tarihleri sırala: Bulgaristan-Osmanlı-Avusturya-Almanya; sonra kişiyi eşleştir.","konu":"i. dünya savaşı","tablo":{"satirlar":[["A) Osmanlı Devleti - Rauf Orbay","Selanik Ateşkesi 29 Eylül 1918","YANLIŞ ifade"],["B) Bulgaristan - Rauf Orbay","Mondros 30 Ekim 1918 / Rauf Orbay","doğru ifade"],["C) Bulgaristan - Talat Paşa","Ahmet İzzet Paşa hükümeti / Rauf Orbay","YANLIŞ ifade"],["D) Almanya - Rauf Orbay","Rethondes Ateşkesi 11 Kasım 1918","YANLIŞ ifade"],["E) Avusturya-Macaristan - Ahmet İzzet Paşa","Villa Giusti Ateşkesi 3 Kasım 1918","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Bulgaristan - Talat Paşa","E":"Avusturya-Macaristan - Ahmet İzzet Paşa","A":"Osmanlı Devleti - Rauf Orbay","D":"Almanya - Rauf Orbay","B":"Bulgaristan - Rauf Orbay"},"kaynak":{"alinti":"de Selanik Ateşkesi ile ilk çekilen devlet olması, Rauf Orbay","liste":[{"ad":"TEORI - i. dunya savasi ateskes","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: 1918 yılında İttifak Devletleri sırayla ateşkes istedi. BULGARİSTAN 29 Eylül 1918\u0027de Selanik Ateşkesi\u0027ni imzalayarak savaştan ilk çekilen devlet oldu; bu, Osmanlı ile Almanya arasındaki kâra bağlantısını kesti ve Osmanlı\u0027nın savaşı sürdürmesini imkânsızlaştırdı. OSMANLI DEVLETİ 30 EKİM 1918\u0027de Limni Adası\u0027nın Mondros Limanı\u0027nda, Agamemnon zırhlısında MONDROS ATEŞKES ANTLAŞMASI\u0027nı imzaladı; Osmanlı heyetine Bahriye Nazırı Rauf (Orbay) Bey, İtilaf tarafına İngiliz Amiral Calthorpe başkanlık etti. Savaşı yürüten İttihat ve Terakki hükümeti (Talat Paşa) istifa etmiş, ateşkesi Ahmet İzzet Paşa hükümeti imzalamıştı. AVUSTURYA-MACARİSTAN 3 Kasım 1918\u0027de Villa Giusti, ALMANYA 11 Kasım 1918\u0027de Rethondes (Compiègne) ateşkesini imzaladı; savaş böylece bitti. Osmanlı yönetimi ateşkesi imzalarken Wilson İlkelerine (galiplerin toprak almayacağı, milletlerin kendi geleceğini belirleyeceği) güveniyordu; ancak Mondros\u0027un ağır hükümleri ve hemen başlayan işgaller bu güveni boşa çıkardı. Ateşkes barış antlaşması değildir; Osmanlı için barış antlaşması ancak 10 Ağustos 1920\u0027de Sevr\u0027de imzalanmış, o da uygulanmamıştır. SINAV TUZAĞI: (1) Savaştan ilk çekilen Bulgaristan\u0027dır (Eylül 1918); Osmanlı ikinci sıradadır. (2) Mondros bir ATEŞKESTİR, barış antlaşması değildir; Sevr ile karıştırılmaz. (3) Mondros\u0027u imzalayan Osmanlı temsilcisi Rauf Orbay\u0027dır, Enver veya Talat Paşa değil. SINAVDA NASIL SORULUR: \u0027I. Dünya Savaşı\u0027ndan ilk çekilen İttifak devleti hangisidir?\u0027 ya da \u0027Mondros Ateşkes Antlaşması\u0027nı Osmanlı Devleti adına kim imzalamışt…"},{"ad":"TEORI - i. dunya savasi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: I. Dünya Savaşı 1914–1918 yılları arasında İtilaf Devletleri (İngiltere, Fransa, Rusya; sonra İtalya, ABD) ile İttifak Devletleri (Almanya, Avusturya-Macaristan; sonra Osmanlı Devleti, Bulgaristan) arasında yapıldı. NEDENLER: Sömürgecilik ve ham madde yarışı, Almanya–İngiltere ekonomik rekabeti, Fransa\u0027nın Alsas-Loren\u0027i geri alma isteği, Balkanlar\u0027da Rusya–Avusturya çekişmesi, silahlanma ve bloklaşma; görünürdeki neden Avusturya veliahdının Saraybosna\u0027da öldürülmesidir. OSMANLI\u0027NİN GİRİŞİ: Osmanlı Devleti 1914 sonbaharında Almanya yanında savaşa girdi; Goeben ve Breslau gemilerinin Karadeniz\u0027de Rus limanlarını vurması fiilî girişi sağladı. Nedenler: kaybedilen toprakları geri alma umudu, Almanya\u0027nın savaşı kazanacağı inancı, İttihat ve Terakki yönetiminin Alman yanlılığı, kapitülasyonlardan kurtulma isteği. CEPHELER: Taarruz cepheleri Kafkas (Sarıkamış felaketi) ve Kanal; savunma cepheleri Çanakkale (1915 zafer, Mustafa Kemal Anafartalar), Irak (Kut\u0027ül Amare zaferi 1916), Suriye-Filistin, Hicaz-Yemen; müttefiklere yardım cepheleri Galiçya, Makedonya, Romanya. SONUÇ: Osmanlı Devleti 30 Ekim 1918 Mondros Ateşkes Antlaşması ile savaştan çekildi; savaş 11 Kasım 1918\u0027de Almanya\u0027nın ateşkesiyle bitti. Wilson İlkeleri (Ocak 1918) barışın çerçevesini çizdi; yenilenlerle Paris Barış Konferansı\u0027nda antlaşmalar yapıldı: Versay (Almanya), Sen Jermen (Avusturya), Nöyyi (Bulgaristan), Triyanon (Macaristan), Sevr (Osmanlı, 10 Ağustos 1920; TBMM tanımadı, uygulanmadı). İmparatorluklar dağıldı, yeni ulus devletler kuruldu, Mille…"}],"hakem":"Soru, kaynakta açıkça yer alan tarihi olayları (Bulgaristan\u0027ın 29 Eylül 1918\u0027de Selanik Ateşkesi ile ilk çekilen devlet olması, Rauf Orbay\u0027ın Mondros\u0027u imzalaması) doğru bir şekilde ölçüyor."},"kayitlar":[],"sade":{"siklar":{"C":"Talat Paşa hükümeti ateşkesinden önce istifa etmiş; Ahmet İzzet Paşa hükümeti tarafından imzalanmıştır, Talat Paşa değildir.","E":"Avusturya-Macaristan 3 Kasım 1918\u0027de Villa Giusti\u0027de kendi temsilcileriyle ayrı ateşkes imzaladı, Osmanlı temsilcisiyle değil.","D":"Almanya en son çekilen İttifak devletidir; 11 Kasım 1918\u0027de Rethondes Ateşkesi\u0027ni imzaladı, ilk değildir.","A":"Osmanlı Devleti savaştan ilk çekilen değildir; 30 Ekim 1918\u0027de ateşkes imzaladığında Bulgaristan\u0027dan sonra, ikinci sıradadır."},"dogru":"I. Dünya Savaşı\u0027nda İttifak Devletleri arasında Bulgaristan 29 Eylül 1918\u0027de Selanik Ateşkesi\u0027ni imzalayarak savaştan ilk çekilen devlet oldu. Osmanlı Devleti 30 Ekim 1918\u0027de Mondros Ateşkes Antlaşması\u0027nı Bahriye Nazırı Rauf Orbay imzaladı.","sinav":"I. Dünya Savaşı\u0027nda savaştan ilk çekilen İttifak devleti ile Mondros Ateşkes Antlaşması\u0027nı imzalayan Osmanlı temsilcisi soruluyor.","kavramlar":[{"kaynak":"TEORI","tanim":"30 Ekim 1918\u0027de Osmanlı Devleti\u0027nin Limni Adası\u0027ndaki Mondros Limanı\u0027nda İtilaf Devletleri ile imzaladığı ateşkes antlaşması; savaş hükümleri ve şartlarını içerir, barış antlaşması değildir.","ad":"Mondros Ateşkes Antlaşması"},{"kaynak":"TEORI","tanim":"I. Dünya Savaşı\u0027nda Almanya, Avusturya-Macaristan, Osmanlı Devleti ve Bulgaristan\u0027dan oluşan savaşan devletler grubu.","ad":"İttifak Devletleri"},{"kaynak":"TEORI","tanim":"29 Eylül 1918\u0027de Bulgaristan\u0027ın İttifak Devletleri arasından savaştan ilk çekilmesini sağlayan ateşkes antlaşması.","ad":"Selanik Ateşkesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/1","2018/3","2015/1"]},"oyun":null,"tip":"teori","soru":"I. Dünya Savaşı\u0027nda İttifak Devletleri arasında ateşkes imzalayarak savaştan ilk çekilen devlet ile Mondros Ateşkes Antlaşması\u0027nı Osmanlı Devleti adına imzalayan kişi aşağıdakilerin hangisinde birlikte doğru verilmiştir?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-kolay/kp-01","verilenler":[],"dayanak":"1918 İttifak Devletleri ateşkesleri kronolojisi ve Mondros Ateşkes Antlaşması imza heyeti","dogru":"B","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: 29 Eylül 1918\u0027de Bulgaristan, Selanik Ateşkesi\u0027ni imzalayıp savaştan çekildi; bir ay sonra, 30 Ekim 1918\u0027de Osmanlı heyeti Agamemnon zırhlısında Mondros Ateşkesi\u0027ni imzaladı, heyete Bahriye Nazırı Rauf Orbay başkanlık etti.","anlatim":"Aynı hafta içinde iki farklı ateşkes yaşanıyor, sen tarihleri ve isimleri karıştırmadan eşleştireceksin.","doldur":[]},{"formul":"Ne yapacağız: soru \u0027ilk çekilen İttifak devleti\u0027 ile \u0027Mondros\u0027u imzalayan Osmanlı temsilcisi\u0027ni birlikte istiyor; Bulgaristan 29 Eylül\u0027de ilk, Rauf Orbay ise Mondros\u0027u imzalayan kişi. Beş şıkta bu iki bilgiyi tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Selanik Ateşkesi 29 Eylül 1918","karar":"yanlış","anlatim":"Osmanlı 30 Ekim\u0027de, Bulgaristan 29 Eylül\u0027de ateşkes imzaladı; Osmanlı ikinci sıradadır. İlk çekilen devlet olarak Osmanlı\u0027yı yazmak yanlış olur.","formul":"Şık A: \u0027Osmanlı Devleti - Rauf Orbay\u0027 diyor, Osmanlı\u0027yı ilk çekilen devlet kabul eder misin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Mondros 30 Ekim 1918 / Rauf Orbay","karar":"doğru","anlatim":"Bulgaristan gerçekten ilk çekilen İttifak devleti, Rauf Orbay da Mondros\u0027u imzalayan Osmanlı temsilcisi. İki bilgi de kaynakla birebir örtüşüyor.","formul":"Şık B: \u0027Bulgaristan - Rauf Orbay\u0027 diyor, bu eşleşmeyi doğru bulur musun?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Ahmet İzzet Paşa hükümeti / Rauf Orbay","karar":"yanlış","anlatim":"Talat Paşa hükümeti savaş sırasında istifa etti, ateşkesi Ahmet İzzet Paşa hükümeti adına Rauf Orbay imzaladı. Talat Paşa\u0027yı imzacı yapmak yanlış olur.","formul":"Şık C: \u0027Bulgaristan - Talat Paşa\u0027 diyor, imzayı Talat Paşa\u0027ya verir misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Rethondes Ateşkesi 11 Kasım 1918","karar":"yanlış","anlatim":"Almanya 11 Kasım\u0027da, hepsinden en son ateşkes imzaladı. Almanya\u0027yı ilk sıraya koymak tarihi tam ters çevirmek olur.","formul":"Şık D: \u0027Almanya - Rauf Orbay\u0027 diyor, Almanya\u0027yı ilk çekilen devlet sayar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Villa Giusti Ateşkesi 3 Kasım 1918","karar":"yanlış","anlatim":"Avusturya-Macaristan kendi ateşkesini Villa Giusti\u0027de 3 Kasım\u0027da kendi heyetiyle imzaladı, Ahmet İzzet Paşa orada yer almadı. Ayrıca ilk çekilen devlet de bu değil, Bulgaristan\u0027dı.","formul":"Şık E: \u0027Avusturya-Macaristan - Ahmet İzzet Paşa\u0027 diyor, bu ikiliyi kabul eder misin?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Doğru cevap Bulgaristan-Rauf Orbay eşleşmesi, çünkü ilk çekilen devlet ile Mondros\u0027u imzalayan kişi bu ikilide birlikte doğru. Kendine sor: hangi tarih daha önce, 29 Eylül mü 30 Ekim mü?","doldur":[]}],"anahtar":[{"ornek":"imzalamıştır","kok":"imzala"},{"ornek":"ateşkesi","kok":"ateşke"},{"ornek":"bulgaristan","kok":"bulgar"},{"ornek":"devletleri","kok":"devlet"},{"ornek":"çekilen","kok":"çekile"},{"ornek":"osmanlı","kok":"osmanl"}],"konuGiris":{"harita":"Ne zaman test edilir: hangi devletin ateşkesi ilk imzaladığı ve tarihler karıştırılarak sorulduğunda. Nasıl ölçülür: olay-tarih-kişi eşleştirmesinin doğru kurulup kurulmadığına bakılarak. Nasıl kaydedilir: her ateşkesin devleti, tarihi ve varsa imzalayan kişisiyle birlikte ezberlenmesiyle.","desen":"Soru genelde \u0027ilk çekilen devlet\u0027 ile \u0027Mondros\u0027u imzalayan kişi\u0027yi aynı seçenekte eşleştirmeyi ister; şıklarda Bulgaristan yerine Osmanlı, Rauf Orbay yerine Talat veya Enver Paşa konularak tuzak kurulur (p. i. dünya savaşı ateşkes). Bazı şıklarda Mondros ile Sevr karıştırılıp yanıltıcı seçenek eklenir. Bu soru savaştan ilk çekilen devlet ile ateşkesi imzalayan kişinin karıştırılması noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Bulgaristan\u0027ın 29 Eylül 1918\u0027de imzaladığı, savaştan ilk çekilişi belirleyen antlaşma","ad":"Selanik Ateşkesi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Osmanlı\u0027nın 30 Ekim 1918\u0027de savaştan çekilişini sağlayan antlaşma","ad":"Mondros Ateşkes Antlaşması","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Mondros\u0027u Osmanlı adına imzalayan Bahriye Nazırı","ad":"Rauf (Orbay) Bey","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Mondros\u0027ta İtilaf Devletleri adına imza koyan İngiliz amiral","ad":"Amiral Calthorpe","kim":"kanun sabitler"}],"sinavda":"Soruda \u0027ilk çekilen devlet\u0027 ve \u0027Mondros\u0027u imzalayan kişi\u0027 ikilisi verilir, doğru eşleşen şık istenir.","panel_ornek":"Diyelim iki arkadaşın aynı anda kirası bitiyor: biri 3 gün önce evi boşaltıp gitti, öbürü 5 gün sonra taşınıyor. İlk gideni ve o günkü sözleşmeyi kimin imzaladığını karıştırırsan yanlış cevap verirsin. Burada da \u0027ilk çekilen\u0027 ile \u0027imzalayan kişi\u0027 ayrı ayrı sorulur.","ornek":"Diyelim iki arkadaşın aynı anda kirası bitiyor: biri 3 gün önce evi boşaltıp gitti, öbürü 5 gün sonra taşınıyor. İlk gideni ve o günkü sözleşmeyi kimin imzaladığını karıştırırsan yanlış cevap verirsin. Burada da \u0027ilk çekilen\u0027 ile \u0027imzalayan kişi\u0027 ayrı ayrı sorulur.","yontemler":"Tarihleri sırayla ezberle: Bulgaristan (29 Eylül) → Osmanlı (30 Ekim) → Avusturya-Macaristan (3 Kasım) → Almanya (11 Kasım); en kritik kural sıralamayı bozmamaktır.","nedir":"Bu konu I. Dünya Savaşı\u0027nın gidişini ve Osmanlı\u0027nın savaştan çekiliş sürecini anlatır. Sınav; hangi devletin ne zaman ateşkes imzaladığını ve bu antlaşmaları kimin imzaladığını karıştırıp karıştırmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Kişi Tuzağı","metin":"Ateşkesi imzalayan Osmanlı temsilcisini savaşı yürüten hükümetin lideri Talat Paşa sanıyorsun. Doğrusu: Talat Paşa hükümeti ateşkesten önce istifa etmiş, imzayı Rauf Orbay atmıştır."},"E":{"ad":"Kapsam Tuzağı","metin":"Avusturya-Macaristan\u0027ın ateşkesini de Osmanlı temsilcisinin imzaladığını sanıyorsun. Doğrusu: Avusturya-Macaristan 3 Kasım 1918\u0027de Villa Giusti\u0027de kendi temsilcileriyle, Osmanlı\u0027dan bağımsız ayrı bir ateşkes imzalamıştır."},"D":{"ad":"Devlet Tuzağı","metin":"Almanya\u0027yı ilk çekilen sanıyorsun. Doğrusu: Almanya 11 Kasım 1918\u0027de en son ateşkes imzalayan İttifak devletidir, ilk değildir."},"A":{"ad":"Sıralama Tuzağı","metin":"Osmanlı Devleti\u0027ni savaştan ilk çekilen sanıyorsun. Doğrusu: İttifak Devletleri içinde ilk ateşkesi 29 Eylül 1918\u0027de Bulgaristan imzalamıştır, Osmanlı 30 Ekim 1918\u0027de ikinci sıradadır."}},"celdiriciYol":null,"hap":"İttifak Devletleri\u0027nden ilk çekilen Bulgaristan\u0027dır (29 Eylül 1918); Mondros\u0027u Osmanlı adına Rauf Orbay imzalamıştır.","teshis":{"C":{"gercek":"Talat Paşa hükümeti istifa etmiş, ateşkesi Ahmet İzzet Paşa hükümeti adına Rauf Orbay imzalamıştır.","ayirt":"Ateşkesi imzalayan kişi savaşı başlatan hükümetten mi?","paragraf":"Mondros Ateşkes Antlaşması imza heyeti","yanilgi":"Savaşı yürüten hükümetin lideri ile ateşkesi imzalayan hükümeti aynı kişi sanıyorsun."},"E":{"gercek":"Avusturya-Macaristan 3 Kasım 1918\u0027de Villa Giusti\u0027de kendi heyetiyle ayrı ateşkes imzalamıştır.","ayirt":"Bu ateşkesi imzalayan heyet Osmanlı\u0027ya mı ait?","paragraf":"Villa Giusti Ateşkesi 3 Kasım 1918","yanilgi":"Her ateşkesi Osmanlı temsilcisinin imzaladığını sanıyorsun."},"A":{"gercek":"Bulgaristan 29 Eylül, Osmanlı 30 Ekim 1918\u0027de ateşkes imzalamıştır; Bulgaristan öndedir.","ayirt":"Hangi tarih daha erken: 29 Eylül mü 30 Ekim mü?","paragraf":"1918 ateşkesler kronolojisi","yanilgi":"Ateşkes sırasını karıştırıp Osmanlı\u0027yı ilk çekilen sanıyorsun."},"D":{"gercek":"Almanya 11 Kasım 1918 ile en son ateşkes imzalayan devlettir.","ayirt":"Almanya listenin başında mı sonunda mı yer alır?","paragraf":"Rethondes Ateşkesi 11 Kasım 1918","yanilgi":"Ateşkes sırasını tersten kurup Almanya\u0027yı ilk sanıyorsun."},"B":{"gercek":"Selanik Ateşkesi ile Bulgaristan ilk çekilen İttifak devletidir; Mondros\u0027u Rauf Orbay imzalamıştır.","ayirt":"İlk çekilen devlet hangisiydi, Mondros\u0027u kim imzaladı?","paragraf":"Selanik Ateşkesi 29 Eylül 1918 / Mondros 30 Ekim 1918","yanilgi":"Bu şıkkı eleyen öğrenci genelde Osmanlı\u0027yı ilk sanarak Bulgaristan\u0027ı gözden kaçırır."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 18"},"kural":"Kongre kararları arasında manda ve himayenin kesin biçimde reddi ilk kez burada ilan edilmiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 18","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Erzurum-Sivas karşılaştırmalı sorularda önce \u0027sayı\u0027 ve \u0027nitelik\u0027 kelimesini ayır; hangi bilgi hangi kongreye ait diye tek tek eşleştir.","konu":"erzurum kongresi","tablo":{"satirlar":[["A) Sivas Kongresi gibi toplanış amacı bakımından da ulusal …","toplanış niteliği bölgesel/ulusal","YANLIŞ ifade"],["B) Kongrede seçilen Temsil Heyeti on altı kişiden oluşmuştur.","Temsil Heyeti dokuz kişi","YANLIŞ ifade"],["C) Manda ve himaye ilkesi ilk kez bu kongrede açıkça redded…","kararlar-manda himaye reddi","doğru ifade"],["D) Mustafa Kemal, orduya bağlı askerlik kimliğiyle katılıp …","Mustafa Kemal\u0027in sivil katılımı","YANLIŞ ifade"],["E) Kongrede alınan kararlar yalnızca Doğu illerini bağlayan…","kararların ulusal içeriği","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Manda ve himaye ilkesi ilk kez bu kongrede açıkça reddedilmiştir.","E":"Kongrede alınan kararlar yalnızca Doğu illerini bağlayan bölgesel nitelik taşımıştır.","A":"Sivas Kongresi gibi toplanış amacı bakımından da ulusal nitelik taşımaktadır.","D":"Mustafa Kemal, orduya bağlı askerlik kimliğiyle katılıp kongre başkanlığı yapmıştır.","B":"Kongrede seçilen Temsil Heyeti on altı kişiden oluşmuştur."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - erzurum kongresi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: ERZURUM KONGRESİ 23 TEMMUZ – 7 AĞUSTOS 1919 tarihleri arasında toplandı. Doğu Anadolu Müdafaa-i Hukuk Cemiyeti ile Trabzon Muhafaza-i Hukuk Cemiyeti\u0027nin girişimiyle, Doğu illerinden gelen delegelerle yapıldı; bu yönüyle toplanış amacı BÖLGESEL, aldığı kararlar ULUSALdır. Mustafa Kemal askerlikten istifa ederek (8 Temmuz 1919) sivil olarak katıldı ve kongre başkanı seçildi. KARARLAR: (1) Millî sınırlar içinde vatan bir bütündür, parçalanamaz. (2) Her türlü yabancı işgal ve müdahalesine karşı millet birlikte direnecektir. (3) İstanbul Hükümeti vatanı koruyamazsa GEÇİCİ BİR HÜKÜMET kurulacak; bu hükümeti millî kongre seçecek, kongre toplanamazsa Temsil Heyeti seçecektir. (4) KUVA-YI MİLLİYE\u0027yi etken, MİLLÎ İRADE\u0027yi hâkim kılmak esastır. (5) Azınlıklara siyasal egemenliği ve toplumsal dengeyi bozacak ayrıcalıklar verilemez. (6) MANDA VE HİMAYE kabul edilemez (ilk kez açıkça reddedildi). (7) Mebusan Meclisi\u0027nin hemen toplanması ve hükümet çalışmalarının meclis denetimine girmesi sağlanmalıdır. Kongre, Mustafa Kemal başkanlığında DOKUZ KİŞİLİK TEMSİL HEYETİ seçti. ÖNEMİ: Millî sınır, millî egemenlik ve manda reddi ilk kez kongre kararıyla ilan edildi; Sivas Kongresi\u0027nin ve Misak-ı Millî\u0027nin temelini oluşturdu; Mustafa Kemal ilk kez sivil bir önder olarak millî hareketin başına geçti. SINAV TUZAĞI: (1) Erzurum BÖLGESEL toplandı ama ULUSAL karar aldı; Sivas ise ulusal nitelikte toplandı. (2) \u0027Manda ve himaye kabul edilemez\u0027 kararı ilk kez Erzurum\u0027da alındı, Sivas\u0027ta kesin olarak reddedildi. (3) Temsil Heyeti Erzurum\u0027da …"}],"hakem":"Soru, Erzurum Kongresi\u0027nin kararlarını ölçmektedir; doğru sık (C), kaynak metinde açıkça yer alan kararlardan biridir ve tarihsel olarak doğru bir bilgiyi içermektedir."},"kayitlar":[],"sade":{"siklar":{"D":"Mustafa Kemal 8 Temmuz 1919\u0027da askerlikten istifa ederek sivil sıfatla kongre çalışmalarına katılmış ve başkan seçilmiştir.","E":"Erzurum Kongresi bölgesel toplanmış olsa da aldığı kararlar millî egemenlik ve millî sınırlar gibi tüm vatanı kapsayan ulusal niteliktedir.","A":"Erzurum Kongresi toplanış amacı bakımından bölgeseldir; yalnızca Doğu illerinden delegeler katılmıştır. Sivas Kongresi ise toplanış amacından ulusal nitelikteydi.","B":"Temsil Heyeti dokuz kişiden oluşturulmuştur. On altı kişilik heyet daha sonra Sivas Kongresi\u0027nde seçilmiştir."},"dogru":"Erzurum Kongresi\u0027nde manda ve himaye ilkesi ilk kez açıkça reddedilmiştir. Bu karar, yabancı devletlerin Türkiye üzerindeki hukuki denetiminin kabul edilmeyeceğini göstermektedir. Bu red, millî egemenlik ilkesinin temel taşlarından biridir.","sinav":"Erzurum Kongresi\u0027nde manda ve himaye ilkesi ilk kez açıkça reddedilmiştir.","kavramlar":[{"kaynak":"TEORI","tanim":"Erzurum Kongresi\u0027nde seçilen ve millî iradeyi temsil etmekle görevli dokuz kişilik kurul.","ad":"Temsil Heyeti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2026/1","2017/2"]},"oyun":null,"tip":"teori","soru":"Erzurum Kongresi\u0027nin toplanışı, aldığı kararlar ve seçtiği kurul ile ilgili aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-inkilap-zor/kp-05","verilenler":[],"dayanak":"İnkılap Tarihi - Erzurum Kongresi kararları ve Temsil Heyeti oluşumu (mevzuat maddesi yok)","dogru":"C","oyunBonus":null,"ders":"Atatürk İlkeleri ve İnkılap Tarihi","adimlar":[{"formul":"Olay: Erzurum\u0027da 23 Temmuz 1919\u0027da Doğu Anadolu Müdafaa-i Hukuk Cemiyeti\u0027nin çağrısıyla delegeler toplanıyor, Mustafa Kemal 8 Temmuz\u0027da askerlikten istifa edip sivil kimlikle geliyor ve başkan seçiliyor.","anlatim":"Bu kongre Doğu illerinden gelen delegelerle bölgesel toplanıyor ama aldığı kararlar tüm vatanı bağlayan ulusal nitelikte. Dokuz kişilik Temsil Heyeti seçiliyor ve manda-himaye ilk kez reddediliyor.","doldur":[]},{"formul":"Ne yapacağız: bu tek olaydaki beş bilgiyi -toplanış niteliği, heyet sayısı, manda reddi, Mustafa Kemal\u0027in sıfatı, kararların kapsamı- tek tek doğru mu yanlış mı diye test edeceğiz.","anlatim":"Kaynaktaki tarihler ve sayılar sabit, sen sadece her ifadeyi bu olaya uydur. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"toplanış niteliği bölgesel/ulusal","karar":"yanlış","anlatim":"Hayır, Erzurum bölgesel delegelerle toplandı, sadece kararları ulusaldır. Sivas ise toplanışıyla da ulusaldır, ikisini karıştırma.","formul":"Şık A: \u0027Sivas gibi Erzurum da toplanış amacı bakımından ulusaldır\u0027 desem, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Temsil Heyeti dokuz kişi","karar":"yanlış","anlatim":"Hayır, Erzurum\u0027da dokuz kişilik heyet seçildi, on altıya çıkması Sivas Kongresi\u0027nde oluyor. Sayıyı kongreye göre ayır.","formul":"Şık B: \u0027Temsil Heyeti Erzurum\u0027da on altı kişi seçildi\u0027 desem, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"kararlar-manda himaye reddi","karar":"doğru","anlatim":"Evet, kararlar listesinde manda ve himaye ilk kez burada açıkça reddediliyor. Sivas bu kararı sadece kesinleştiriyor, ilk ret Erzurum\u0027a ait.","formul":"Şık C: \u0027Manda ve himaye ilkesi ilk kez bu kongrede açıkça reddedildi\u0027 desem, imzayı atar mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Mustafa Kemal\u0027in sivil katılımı","karar":"yanlış","anlatim":"Hayır, 8 Temmuz\u0027da istifa edip sivil kimlikle katıldı, İstanbul Hükümeti\u0027nin emriyle değil kendi kararıyla geldi. Sıfatı sivil önderdir, asker değil.","formul":"Şık D: \u0027Mustafa Kemal ordu mensubu askerlik kimliğiyle katılıp başkan oldu\u0027 desem, kabul eder misin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"kararların ulusal içeriği","karar":"yanlış","anlatim":"Hayır, millî sınır ve millî irade vurgusu tüm vatanı kapsıyor, karar içeriği ulusaldır. Sadece toplanış bölgesel, karar bölgesel değil.","formul":"Şık E: \u0027Kongre kararları sadece Doğu illerini bağlayan bölgesel nitelik taşır\u0027 desem, doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Tek doğru cevap C, çünkü manda-himaye reddi ilk kez burada ilan ediliyor. Kendine hep şunu sor: bu bilgi toplanışa mı yoksa karara mı ait?","doldur":[]}],"anahtar":[{"ornek":"toplanışıyla","kok":"toplan"},{"ornek":"himaye","kok":"himaye"},{"ornek":"kongresi","kok":"kongre"},{"ornek":"bölgesel","kok":"bölges"},{"ornek":"ulusaldır","kok":"ulusal"},{"ornek":"kararlarıyla","kok":"kararl"}],"konuGiris":{"harita":"Ne zaman test edilir: Erzurum Kongresi\u0027nin tarih, katılım ve kurul bilgileri diğer kongrelerle (özellikle Sivas) karşılaştırılarak sorulur. Nasıl ölçülür: Kararların hangisinin \u0027ilk kez\u0027 Erzurum\u0027da alındığının bilinmesiyle ölçülür. Nasıl kaydedilir: Kongre kararları ve Temsil Heyeti üye sayısı ezbere bilgi olarak hafızada tutulur.","desen":"Sınav sık sık Erzurum ile Sivas Kongresi\u0027nin toplanış şeklini (bölgesel/ulusal) karıştırarak sorar. Temsil Heyeti üye sayısı (9 kişi) Sivas\u0027taki 16 kişiyle karıştırılan bir diğer tuzaktır. Bu soru toplanış-karar-kurul üçlüsünün birbirine karıştırılması noktasından geliyor (p.28).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kongrenin yürütme organı olarak seçtiği kurul","ad":"Temsil Heyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Yabancı devlet koruyuculuğunun kabul edilmemesi kararı","ad":"Manda ve Himaye Reddi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Vatan topraklarının bölünmez bütün olarak kabul edilmesi ilkesi","ad":"Millî Sınır","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Millî iradeyi hâkim kılacak halk direniş gücü","ad":"Kuva-yı Milliye","kim":"kanun sabitler"}],"sinavda":"Soru; Erzurum Kongresi\u0027nin toplanışı, kararları ve seçtiği kurula ait bilgileri verir ve bunlardan doğru olanı seçmeni ister.","panel_ornek":"Bir arkadaşın sadece kendi mahallesindeki 5 komşuyla toplantı yapıp aldığı kararın tüm şehri bağlamasını istemesi gibi: Erzurum\u0027a sadece doğu illerinden delegeler geldi ama alınan kararlar bütün vatanı kapsıyordu. Yani toplanış küçük ölçekli, karar büyük ölçekliydi.","ornek":"Bir arkadaşın sadece kendi mahallesindeki 5 komşuyla toplantı yapıp aldığı kararın tüm şehri bağlamasını istemesi gibi: Erzurum\u0027a sadece doğu illerinden delegeler geldi ama alınan kararlar bütün vatanı kapsıyordu. Yani toplanış küçük ölçekli, karar büyük ölçekliydi.","yontemler":"Erzurum\u0027u \u0027bölgesel toplanış, ulusal karar\u0027 ifadesiyle eşleştir; Temsil Heyeti\u0027nin 9 kişi olduğunu Sivas\u0027taki 16 ile karıştırma.","nedir":"Erzurum Kongresi, Millî Mücadele\u0027nin bölgesel toplanıp ulusal kararlar aldığı ilk büyük kongredir. Sınav; toplanış özelliklerini, alınan kararları ve seçilen kurulun niteliğini birbirine karıştırmadan bilip bilmediğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Sivil-Asker Tuzağı","metin":"Mustafa Kemal\u0027in orduyla bağını sürdürdüğünü sanırsın. Doğrusu: 8 Temmuz 1919\u0027da askerlikten istifa ederek sivil sıfatla katılmış ve başkan seçilmiştir."},"E":{"ad":"Kapsam Tuzağı","metin":"Delegelerin Doğu illerinden gelmesinden kararların da bölgesel kaldığını çıkarırsın. Doğrusu: Toplanışı bölgesel olsa da alınan kararlar tüm vatanı kapsayan ulusal niteliktedir."},"A":{"ad":"Bölge-Ulus Tuzağı","metin":"Sivas\u0027ın ulusal toplandığını bilip Erzurum\u0027u da öyle sanırsın. Doğrusu: Erzurum toplanış amacıyla bölgesel, aldığı kararlarla ulusal nitelikli bir kongredir."},"B":{"ad":"Heyet Sayısı Tuzağı","metin":"Sivas Kongresi\u0027nde heyetin on altıya çıktığını Erzurum\u0027a taşırsın. Doğrusu: Erzurum\u0027da Temsil Heyeti dokuz kişiden seçilmiştir."}},"celdiriciYol":{},"hap":"Erzurum Kongresi toplanışıyla bölgesel, kararlarıyla ulusaldır; manda-himaye reddi ve dokuz kişilik Temsil Heyeti burada, on altıya çıkışı ise Sivas\u0027tadır.","teshis":{"C":{"gercek":"Manda ve himayenin ilk açık reddi Erzurum Kongresi kararları arasındadır; Sivas\u0027ta bu ret kesinleştirilmiştir.","ayirt":"Bu ilke ilk kez mi ilan edildi, yoksa daha önce alınan karar mı pekiştirildi?","paragraf":"İnkılap Tarihi-Erzurum Kongresi kararları","yanilgi"
