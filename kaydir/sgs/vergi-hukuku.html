 davet edilebilir"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"Sahte belge tutarının toplam alışlara oranı yüzde beşi aştığından mükellef izaha davet edilemez.","E":"Mükellef izaha davet edilse dahi bu tespitle sınırlı olarak pişmanlık hükümlerinden yararlanabilir.","A":"Sahte belge tutarı haddi aşsa da toplam alışların yüzde beşini aşmadığından mükellef izaha davet edilebilir.","D":"Vergi Usul Kanununun 359 uncu maddesi kapsamındaki tüm fiillerde had veya oran istisnası bulunmadığından izaha davet edilemez.","B":"Sahte belge tutarı 870.000 TL haddi aştığından mükellef hiçbir şekilde izaha davet edilemez."},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.370 - İzaha davet [1/2]","metin":"İzaha davet: Madde 370 – (Mülga: 30/12/1980-2365/89 md.; Yeniden düzenleme: 15/7/2016-6728/22 md.) (Değişik:5/12/2019-7194/25 md.) a) Vergi incelemesine başlanılmadan veya takdir komisyonuna sevk edilmeden önce verginin ziyaa uğradığına delalet eden emareler bulunduğuna dair yetkili merciler tarafından yapılmış ön tespitler hakkında tespit tarihine kadar ihbarda bulunulmamış olması kaydıyla mükellefler izaha davet edilebilir. Kendisine izaha davet yazısı tebliğ edilen mükellefler, davet konusu tespitle sınırlı olarak, bu Kanunun 371 inci maddesinde yer alan pişmanlık hükümlerinden yararlanamaz. İzaha davet yazısının tebliğ tarihinden itibaren otuz günlük süre içerisinde izahta bulunulması durumunda, yapılan izah değerlendirilerek değerlendirme sonucunu içeren yazı mükellefe tebliğ edilir. 1. Mükelleflerce yapılan izah sonucu vergi ziyaına sebebiyet verilmediğinin idarece anlaşılması hâlinde mükellefler söz konusu tespitle ilgili olarak vergi incelemesine tabi tutulmaz veya takdir komisyonuna sevk edilmez. 2. Mükelleflerce yapılan izahın yeterli bulunmaması hâlinde, değerlendirme sonucunu içeren yazının tebliğ edildiği tarihten itibaren otuz gün içerisinde; hiç verilmemiş olan vergi beyannamelerinin verilmesi, eksik veya yanlış yapılan vergi beyanının tamamlanması veya düzeltilmesi ve ödeme süresi geçmiş bulunan vergilerin, ödemenin geciktiği her ay ve kesri için, 6183 sayılı Kanunun 51 inci maddesinde belirtilen nispette uygulanacak gecikme zammı oranında bir zamla aynı sürede ödenmesi şartıyla vergi ziyaı cezası, ziyaa uğratılan vergi üzerinden %20 oranında kesilir. Bu dur…"},{"ad":"VUK (213 s.K.) m.370 - İzaha davet [2/2]","metin":"b) (a) fıkrası uyarınca yapılmış ön tespitlerin, verginin bu Kanunun 359 uncu maddesinde yer alan fiillerle ziyaa uğratılmış olabileceğine ilişkin olması hâlinde bu kapsamdaki mükellefler izaha davet edilmez. Şu kadar ki, sahte veya muhteviyatı itibarıyla yanıltıcı belge kullanma fiilinin işlenmiş olabileceğine dair yapılan ön tespitlerde, kullanılan sahte veya muhteviyatı itibarıyla yanıltıcı belge tutarı, bir takvim yılında 100 bin Türk lirasını (bu tutar her yıl yeniden değerleme oranında artırılarak uygulanır; 1.1.2025\u0027ten itibaren 700.000 TL - VUK Genel Tebliği Sıra No: 577) geçmeyen veya bu tutarı geçse bile ilgili yıldaki toplam mal ve hizmet alışlarının %5’ini aşmayan mükelleflere ön tespite ilişkin yazı tebliğ edilebilir. Mükelleflerce, haklarında yapılan tespite ilişkin yazının tebliğ edildiği tarihten itibaren otuz gün içerisinde; hiç verilmemiş olan vergi beyannamelerinin verilmesi, eksik veya yanlış yapılan vergi beyanının tamamlanması veya düzeltilmesi ve ödeme süresi geçmiş bulunan vergilerin, ödemenin geciktiği her ay ve kesri için, 6183 sayılı Kanunun 51 inci maddesinde belirtilen nispette uygulanacak gecikme zammı oranında bir zamla aynı sürede ödenmesi şartıyla vergi ziyaı cezası, ziyaa uğratılan vergi üzerinden %20 oranında kesilir. Bu durum vergi incelemesi yapılmasına ve gerekirse tarhiyatın ikmaline engel teşkil etmez. Bu fıkra kapsamında kendisine ön tespite ilişkin yazı tebliğ edilen mükellefler, tespitle sınırlı olarak bu Kanunun 371 inci maddesinde yer alan pişmanlık hükümlerinden yararlanamaz. Bu fıkrada yer alan tutar, her yıl bir önceki yıla il…"}],"hakem":"VUK m.370/b fıkrasında sahte belge kullanma durumunda izaha davet koşulu açıkça tanımlanmış: had aşılsa bile toplam mal ve hizmet alışlarının %5\u0027ini aşmayan mükelleflere ön tespite ilişkin yazı tebliğ edilebilir; soru verilen değerlerle (900.000 TL \u003c 20.000.000 TL × %5 = 1.000.000 TL) bu koşulu tam karşılayıp izaha davetin mümkün olduğunu doğru belirtir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Yüzde beş sınırı (24.000.000 x %5)","1.200.000"],["Sahte belge tutarı ile karşılaştırma","1.100.000 \u003c 1.200.000"],["Sonuç","İzaha davet edilebilir"]]},"tur":"tablo","soru":"İşletme 2026 yılında 1.100.000 TL tutarında sahte belge kullanmış, aynı yıl toplam mal ve hizmet alışları 24.000.000 TL\u0027dir. Vergi Usul Kanunu m.370 uyarınca ilgili haddin 950.000 TL olduğu varsayıldığında mükellefin izaha davet edilip edilemeyeceğini belirleyiniz.","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve mükellefin izaha davet edilip edilemeyeceğini bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme 2026 yılında 900.000 TL tutarında sahte belge kullanmış, aynı yıl toplam mal ve hizmet alışları 20.000.000 TL\u0027dir. Vergi Usul Kanunu m.370 uyarınca ilgili haddin 870.000 TL olduğu varsayıldığında mükellefin izaha davet edilip edilemeyeceği aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-vergi-kolay/kp-13","verilenler":[{"deger":"900.000 TL","anlam":"Mükellefin 2026 yılında kullandığı sahte belgenin toplam tutarı; had ve oran kontrolünün tabanıdır.","ad":"Sahte belge tutarı"},{"deger":"20.000.000 TL","anlam":"Mükellefin ilgili yıldaki toplam mal ve hizmet alışları; yüzde beş sınırının hesaplandığı taban.","ad":"Toplam alışlar"},{"deger":"870.000 TL","anlam":"2026 yılı için geçerli sabit tutar haddi; bu had aşılsa da yüzde beş sınırı ayrıca kontrol edilir.","ad":"Kanuni had"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.370/b","dogru":"A","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Verilen: Sahte belge tutarı 900.000 TL (soruda verilen); Toplam alış 20.000.000 TL (soruda verilen); Kanuni had 870.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: sahte belge tutarı 900.000 TL, toplam mal-hizmet alışı 20.000.000 TL, Vergi Usul Kanunu m.370\u0027teki had 870.000 TL.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kural: had aşımı tek başına izaha daveti engellemez, asıl sınır toplam alışın %5\u0027idir","anlatim":"İzaha davet nedir? Vergi incelemesi başlamadan önce mükellefe açıklama fırsatı veren bir kurumdur. Vergi Usul Kanunu m.370/b\u0027ye göre had aşılsa bile toplam alışların yüzde beşi aşılmadıkça bu yol açıktır.","doldur":[]},{"formul":"Yüzde beş sınırı = Toplam alış × %5 = 20.000.000 (soruda verilen) × %5 = 1.000.000 TL","anlatim":"Şimdi yüzde beş sınırını hesaplıyoruz. Bu sınır, toplam alışların yasada belirlenen oranla çarpılmasıyla bulunur.","doldur":[[5,1]]},{"formul":"Karşılaştırma: Sahte belge tutarı ile Yüzde beş sınırı → büyük olan: 900.000 (soruda verilen) ile 1.000.000 (3. adımda bulduk) → 1.000.000","anlatim":"Şimdi sahte belge tutarını bu sınırla karşılaştırıyoruz. Sınırın altında kalırsa izaha davet kapısı açık kalır.","doldur":[[6,1]]},{"formul":"Sonuç: 900.000 (soruda verilen) \u003c 1.000.000 (3. adımda bulduk) → izaha davet mümkün","anlatim":"900.000 TL, 1.000.000 TL\u0027nin altında kaldığı için mükellef izaha davet edilebilir. Had aşılmış olması burada sonucu değiştirmez.","doldur":[[7,1]]},{"formul":"Ters durum: sahte belge tutarı \u003e yüzde beş sınırı → izaha davet edilemez","anlatim":"Ters durumda: sahte belge tutarı yüzde beş sınırını aşsaydı izaha davet artık mümkün olmazdı. Yani asıl belirleyici had değil, yüzde beş sınırıdır.","doldur":[]},{"formul":"Yanlış yol: 900.000 \u003e 870.000 (had) → izaha davet edilemez (HATALI) → doğrusu 900.000 \u003c 1.000.000 (5. adımda bulduk) → izaha davet edilebilir","anlatim":"En sık hata: öğrenci 900.000 TL\u0027yi doğrudan 870.000 TL\u0027lik hadle karşılaştırıp had aşıldı diye izaha davet edilemez sanır. Asıl karşılaştırma hadle değil, toplam alışın yüzde beşiyle yapılır.","doldur":[]}],"anahtar":[{"ornek":"alışların","kok":"alışla"},{"ornek":"sınırını","kok":"sınırı"},{"ornek":"aşılmasını","kok":"aşılma"},{"ornek":"karşılaştırıyoruz","kok":"karşıl"},{"ornek":"kanunu","kok":"kanunu"},{"ornek":"aşılsa","kok":"aşılsa"}],"konuGiris":{"harita":"Ne zaman test edilir: Mükellef hakkında sahte belge kullanımına ilişkin ön tespit yapıldığında test edilir. Nasıl ölçülür: Kullanılan sahte belge tutarı, hem mutlak had hem de toplam alışların yüzdesiyle karşılaştırılarak ölçülür. Nasıl kaydedilir: Sonuç, izaha davetin mümkün olup olmadığı şeklinde tek bir hukuki değerlendirme olarak kaydedilir.","desen":"Sınav, sahte belge tutarını hem mutlak had hem de toplam alışların yüzdesiyle karşılaştırmayı zorunlu kılan çift koşullu bir hesaplama kurar. Öğrenci genelde sadece hadle veya sadece yüzdeyle karşılaştırıp ikisini birlikte değerlendirmeyi atlar; oysa had aşılsa bile yüzde aşılmıyorsa izaha davet yine mümkündür. Bu soru izaha davetin istisnai koşullarının belirlendiği hükümden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İnceleme başlamadan önce mükellefin açıklama yapmaya çağrılması","ad":"İzaha davet","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Sahte belge tutarının altında kalırsa izaha davetin mümkün olduğu mutlak sınır","ad":"Yıllık had","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Sahte belge tutarının toplam alışlara oranının aşılmaması gereken yüzdesi","ad":"Yüzde beş ölçütü","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mükellefin kullandığı belgelerin toplam parasal değeri","ad":"Sahte belge tutarı","kim":"mükellef / işveren beyan eder"}],"sinavda":"Sahte belge tutarı, ilgili had ve toplam alışların yüzdesiyle karşılaştırılarak izaha davetin mümkün olup olmadığı sorulur.","panel_ornek":"Bir arkadaşının kirada oturduğu evde, kontratta yazan aidat sınırı 300 TL iken kendisinden 250 TL istenmiş; sınırın altında kaldığı için ek ödeme yapmasına gerek yok. Ama komşusundan 320 TL istenmiş, sınırı aştığı için itiraz hakkı doğmuş. Bir sayı, belirlenen sınırın altında mı üstünde mi diye bakmak, hakkın doğup doğmadığını belirler.","ornek":"Bir arkadaşının kirada oturduğu evde, kontratta yazan aidat sınırı 300 TL iken kendisinden 250 TL istenmiş; sınırın altında kaldığı için ek ödeme yapmasına gerek yok. Ama komşusundan 320 TL istenmiş, sınırı aştığı için itiraz hakkı doğmuş. Bir sayı, belirlenen sınırın altında mı üstünde mi diye bakmak, hakkın doğup doğmadığını belirler.","yontemler":"Önce tutar hadle karşılaştırılır, sonra toplam alışların yüzdesiyle karşılaştırılır; ikisinden herhangi biri aşılmıyorsa izaha davet mümkündür.","nedir":"Bu konu, sahte belge kullanımı gibi ağır fiillerde mükellefin izaha davet edilip edilemeyeceğini belirleyen had ve oran kurallarını inceler. Sınav, verilen tutarların yasal sınırları aşıp aşmadığını hesaplayabilmeyi ölçer."},"olay":"yüzde beş sınırı 20.000.000 x %5 = 1.000.000 TL; 900.000 TL bu sınırın altında kalır.","tuzak":{"C":{"ad":"Oran Tuzağı","metin":"öğrenci yüzde beş oranını doğru tabana (toplam alışlara) uygulamadan sonucu yanlış yorumlayıp sınırın aşıldığını düşünür. Doğrusu: 900.000/20.000.000 oranı yüzde beşin altındadır, sınır aşılmamıştır."},"E":{"ad":"Pişmanlık Tuzağı","metin":"öğrenci izaha davet edilen mükellefin aynı tespitle sınırlı olarak pişmanlık hükümlerinden de yararlanabileceğini sanır. Doğrusu: izaha davet yazısı tebliğ edilen mükellef, o tespitle sınırlı olarak pişmanlık hükümlerinden yararlanamaz."},"D":{"ad":"Kapsam Tuzağı","metin":"öğrenci 359 üncü madde kapsamındaki tüm fiillerin istisnasız izaha davet dışı olduğunu sanır, sahte belge kullanımına özgü had/oran istisnasını gözden kaçırır. Doğrusu: kanun sahte belge kullanımı için ayrı bir had ve oran istisnası öngörmüştür."},"B":{"ad":"Had Tuzağı","metin":"öğrenci yalnız sabit haddin (870.000 TL) aşıldığını görüp ikinci eşik olan yüzde beş kontrolünü hiç yapmaz. Doğrusu: had aşımı tek başına izaha daveti engellemez, yüzde beş sınırının da aşılması gerekir."}},"celdiriciYol":{"C":"900.000 tutarı yüzde beş sınırıyla değil doğrudan had ile kıyaslanıp sınırın aşıldığı sonucuna varılır (oran tabanı yanlış kurulur)","E":"izaha davet ile pişmanlık hükümleri birbirinden ayrılmadan aynı anda uygulanabilir sanılır (istisna hükmü gözden kaçırılır)","D":"359 üncü madde kapsamı genelleştirilip özel istisna hükmü yok sayılır (kapsam daraltıcı istisna atlanır)","B":"900.000 \u003e 870.000 karşılaştırması tek başına yeterli sayılır, yüzde beş kontrolü atlanır (had aşımı tek başına engel sanılır)"},"hap":"İzaha davet dışı kalma, sahte belge kullanımında hem sabit tutar haddinin hem toplam alışların yüzde beşinin BİRLİKTE aşılmasını gerektirir; biri aşılsa da diğeri aşılmazsa izaha davet yolu açıktır.","teshis":{"C":{"gercek":"Oran, sahte belge tutarının o yıla ait toplam mal ve hizmet alışlarına bölünmesiyle bulunur; burada 900.000/20.000.000 yüzde beşin altındadır.","ayirt":"Oranı hesapladım mı, yoksa doğrudan aşıldığını mı varsaydım?","paragraf":"213 sayılı VUK m.370/b","yanilgi":"Yüzde beş oranını doğru tabana uygulamadan, sonucu sınırın aşıldığı yönünde yorumluyorsun."},"E":{"gercek":"Madde açıkça, izaha davet yazısı tebliğ edilen mükellefin o tespitle sınırlı olarak pişmanlık hükümlerinden yararlanamayacağını hükme bağlar.","ayirt":"Bu tespitle sınırlı olarak pişmanlık hükmü hâlâ açık mı, yoksa kapatıldı mı?","paragraf":"213 sayılı VUK m.370/a","yanilgi":"İzaha davet edilen mükellefin, aynı tespit için pişmanlık hükümlerinden de yararlanabileceğini sanıyorsun."},"A":{"gercek":"Vergi Usul Kanunu m.370/b, sahte belge kullanımında hem tutar haddini hem toplam alışların yüzde beşini birlikte aşma şartını arar; ikisi birden aşılmadıkça izaha davet kapısı kapanmaz.","ayirt":"Had aşıldı diye hemen mi karar verdim, yoksa yüzde beş kontrolünü de yaptım mı?","paragraf":"213 sayılı VUK m.370/b","yanilgi":"Bu şıkkı eleyen öğrenci, tek bir eşiğin (had ya da oran) yeterli olduğunu düşünüp ikisinin birlikte değerlendirilmesi gerektiğini gözden kaçırır."},"D":{"gercek":"Kanun, sahte veya muhteviyatı itibarıyla yanıltıcı belge kullanma fiiline özgü had ve yüzde beş istisnasını ayrıca düzenlemiştir; bu istisna 359 üncü madde kapsamını daraltır.","ayirt":"359 üncü maddedeki her fiil aynı mı davranıyor, yoksa özel bir istisna var mı?","paragraf":"213 sayılı VUK m.370/b","yanilgi":"359 üncü madde kapsamındaki her fiilin istisnasız izaha davet dışı olduğunu sanıyorsun."},"B":{"gercek":"Kanun, had aşılsa bile alışların yüzde beşini aşmayan mükelleflere ön tespit yazısı tebliğ edilebileceğini düzenler; had tek başına belirleyici değildir.","ayirt":"Had aşıldı diye mi durdum, yüzde beş sınırını hesapladım mı?","paragraf":"213 sayılı VUK m.370/b","yanilgi":"Sabit had aşıldığında işin bittiğini, ikinci bir kontrole gerek kalmadığını düşünüyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":null,"kural":"213 sayılı Vergi Usul Kanununun 323 üncü maddesine göre dava veya icra safhasında bulunan alacaklar tutar sınırı aranmaksızın şüpheli alacak sayılır; teminatlı alacaklarda karşılık teminattan geri kalan miktara inhisar eder.","olcum":{"pencere":7,"hesapKod":0,"capa":"","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Teminat gördüğün an önce onu alacak tutarından düş, karşılığı kalan tutar üzerinden hesapla.","konu":"vuk karşılık","tablo":{"satirlar":[["VERİLENLER","-"],["Alacak tutarı","150.000 TL"],["Teminat tutarı","40.000 TL"],["HESAP","-"],["Teminatsız kalan alacak (150.000-40.000)","110.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"110.000","E":"190.000","A":"40.000","D":"150.000","B":"75.000"},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.323 - Şüpheli alacaklar [1/2]","metin":"Şüpheli alacaklar: Madde 323 – (Değişik: 30/12/1980-2365/55 md.) Ticari ve zirai kazancın elde edilmesi ve idame ettirilmesi ile ilgili olmak şartıyla; 1. (Değişik: 1/5/1981-2455/3 md.) Dava veya icra safhasında bulunan alacaklar; 2. Yapılan protestoya veya yazı ile bir defadan fazla istenilmesine rağmen borçlu tarafından ödenmemiş bulunan ve 3.000 (25.000) Türk lirasını aşmayan alacaklar;108109 Şüpheli alacak sayılır. Yukarıda yazılı şüpheli alacaklar için değerleme gününün tasarruf değerine göre pasifte karşılık ayrılabilir. Bu karşılığın hangi alacaklara ait olduğu karşılık hesabında gösterilir. Teminatlı alacaklarda bu karşılık teminattan geri kalan miktara inhisar eder. 14/10/2021 tarihli ve 7338 sayılı Kanunun 35 inci maddesiyle bu bentte yer alan “dava ve icra takibine değmeyecek derecede küçük” ibaresi “ve 3.000 Türk lirasını aşmayan” şeklinde değiştirilmiştir. 109 Bu maddeye kanunla getirilen miktarlar aynen korunmuş olup, daha sonra 30/12/2025 tarihli ve 33124 (5. Mükerrer) sayılı Resmî Gazete\u0027de yayımlanan Hazine ve Maliye Bakanlığının (Gelir İdaresi Başkanlığı) 588 Sıra No.’lu Tebliği ile 1/1/2026 tarihinden geçerli olmak üzere tespit edilen miktarlar metne parantez içinde siyah punto ile işlenmiştir. Daha önce yapılan değişiklikler için bu Kanunun sonundaki \"ÇEŞİTLİ MEVZUAT İLE YAPILAN DEĞİŞİKLİKLER CETVELİ\" ne bakınız. 108 Şüpheli alacakların sonradan tahsil edilen miktarları tahsil edildikleri dönemde karzarar hesabına intikal ettirilir."},{"ad":"VUK (213 s.K.) m.323 - Şüpheli alacaklar [2/2]","metin":"(Ek beşinci fıkra:14/10/2021-7338/35 md.) İşletme hesabı esasında defter tutan mükellefler, yukarıdaki fıkralar kapsamında tespit edilen şüpheli alacaklarını defterlerinin gider kısmına ve bunlardan sonradan tahsil edilen miktarları ise tahsil edildikleri dönemde defterlerinin gelir kısmına, hangi alacaklara ait olduğunu gösterecek şekilde, kaydederler."}],"hakem":"VUK m.323\u0027te dava safhasındaki alacaklar şüpheli alacak sayılır ve teminatlı alacaklarda karşılık teminattan geri kalan miktara inhisar eder kuralı açıkça yer almakta; 150.000 - 40.000 = 110.000 TL hesaplaması kurala uygun."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/1"]},"oyun":{"bosluk":[[0,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Teminatsız kalan alacak (200.000-60.000)","140.000"]]},"tur":"tablo","soru":"İşletmenin 200.000 TL tutarındaki ticari alacağı dava safhasındadır. Alacağın 60.000 TL\u0027lik kısmı için ipotek şeklinde teminat alınmıştır. 213 sayılı Vergi Usul Kanununa göre bu alacak için ayrılabilecek şüpheli alacak karşılığı kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve şüpheli alacak karşılığının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin 150.000 TL tutarındaki ticari alacağı dava safhasındadır. Alacağın 40.000 TL\u0027lik kısmı için ipotek şeklinde teminat alınmıştır. 213 sayılı Vergi Usul Kanununa göre bu alacak için ayrılabilecek şüpheli alacak karşılığı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-vergi-kolay/kp-15","verilenler":[{"deger":"150.000 TL","anlam":"Dava safhasındaki ticari alacağın toplam tutarı; karşılık hesabının başlangıç değeridir.","ad":"Alacak tutarı"},{"deger":"40.000 TL","anlam":"Alacağın ipotekle güvence altına alınmış kısmı; karşılık matrahından düşülecek tutardır.","ad":"Teminat tutarı"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.323/1 ve 3. fıkra (teminatlı alacaklarda karşılığın teminattan geri kalan miktara inhisar etmesi)","dogru":"C","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Verilen: Toplam ticari alacak 150.000 TL (soruda verilen); Teminatlı kısım 40.000 TL (soruda verilen); alacak dava safhasında","anlatim":"Soru bize şunları vermiş: alacak 150.000 TL, bunun 40.000 TL\u0027lik kısmı için ipotek teminatı var.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Şüpheli alacak karşılığı = dava/icra safhasındaki alacağın teminatsız kısmı","anlatim":"Şüpheli alacak karşılığı nedir? Vergi Usul Kanununun 323 üncü maddesine göre dava veya icra safhasındaki alacaklar için ayrılan, teminatsız kısmı kapsayan karşılıktır.","doldur":[]},{"formul":"Teminatsız kalan alacak = Toplam alacak − Teminatlı kısım = 150.000 (soruda verilen) − 40.000 (soruda verilen) = 110.000 TL","anlatim":"Dava safhasında olan alacaklarda tutar sınırı aranmaz, ama teminatlı kısım karşılık dışında kalır. Burada dikkat: teminat varsa karşılık sadece kalan kısma ayrılır.","doldur":[[4,0],[4,1]]},{"formul":"Şüpheli Alacak Karşılığı = 110.000 TL (3. adımda bulduk)","anlatim":"Sonuç olarak ayrılabilecek şüpheli alacak karşılığı 110.000 TL\u0027dir. Teminat kısmı zaten güvence altında olduğu için karşılığa girmez.","doldur":[]},{"formul":"Ters durum: teminat yok → Karşılık = 150.000 TL (tamamı)","anlatim":"Ters durumda: alacağın hiç teminatı olmasaydı, tamamı için karşılık ayrılırdı.","doldur":[]},{"formul":"Yanlış yol: 150.000 (soruda verilen) tamamı üzerinden karşılık = 150.000 TL (HATALI) → doğrusu 110.000 TL (3. adımda bulduk)","anlatim":"En sık hata: bazı öğrenciler teminatlı kısmı da dahil edip 150.000 TL üzerinden karşılık ayırır, bu yanlıştır.","doldur":[]}],"anahtar":[{"ornek":"teminatlı","kok":"temina"},{"ornek":"alacaklar","kok":"alacak"},{"ornek":"karşılık","kok":"karşıl"},{"ornek":"şüpheli","kok":"şüphel"},{"ornek":"safhasındaki","kok":"safhas"},{"ornek":"ayrılır","kok":"ayrılı"}],"konuGiris":{"harita":"Ne zaman test edilir: alacak dava veya icra safhasına girdiğinde ya da protesto/yazı ile istenip ödenmediğinde. Nasıl ölçülür: alacağın teminatlı kısmı toplam tutardan düşülerek kalan bakiye bulunur. Nasıl kaydedilir: ayrılan tutar karşılık hesabına, hangi alacağa ait olduğu belirtilerek işlenir.","desen":"Soru genelde toplam alacak tutarı ile teminatlı kısmı birlikte verir ve öğrencinin teminatı düşmeyi unutup unutmadığını sınar. Tuzak, teminatlı kısmın karşılık hesaplamasına dahil edilmesidir; oysa karşılık yalnız teminatsız kalan kısım için ayrılır. Bu soru şüpheli alacaklarda teminatlı alacakların karşılık dışı tutulması noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"dava veya icra safhasında olan ya da tahsili şüphe uyandıran ticari alacak","ad":"şüpheli alacak","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"ipotek gibi güvence altına alınmış, karşılık dışı bırakılan alacak bölümü","ad":"teminatlı kısım","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"sen hesaplarsın","tanim":"toplam alacaktan teminatlı kısım düşüldükten sonra kalan, karşılık ayrılabilecek net miktar","ad":"karşılık tutarı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"değerleme gününde alacağın gerçek ekonomik değerinin esas alınması ilkesi","ad":"tasarruf değeri","kim":"kanun sabitler"}],"sinavda":"Toplam alacak tutarı ve teminat altına alınan kısım verilir, ayrılabilecek karşılık tutarı istenir.","panel_ornek":"Bir arkadaşın 10.000 lira borç verdiği kişi ödemeyi geciktiriyor ve dava açıyor. Borcun 3.000 lirası için arkadaşından altın rehin alınmış durumda. Karşılık ayrılırken bu 3.000 lira düşülüp geri kalan tutar üzerinden hesap yapılır.","ornek":"Bir arkadaşın 10.000 lira borç verdiği kişi ödemeyi geciktiriyor ve dava açıyor. Borcun 3.000 lirası için arkadaşından altın rehin alınmış durumda. Karşılık ayrılırken bu 3.000 lira düşülüp geri kalan tutar üzerinden hesap yapılır.","yontemler":"Tek yöntem: toplam alacaktan teminatlı/güvenceli kısım çıkarılır, kalan tutar karşılık olarak ayrılır.","nedir":"Şüpheli alacak karşılığı, tahsili şüpheli hale gelen ticari alacaklar için ayrılan bir vergisel önlemdir. Sınav, teminatlı kısmın karşılık dışı bırakılıp bırakılmadığını ölçer."},"olay":"150.000 - 40.000 = 110.000.","tuzak":{"D":{"ad":"Teminatı Yok Sayma Tuzağı","metin":"Teminatın sadece ipotek/güvence amaçlı olduğunu, karşılık hesabını etkilemediğini düşünüyorsun. Doğrusu: Kanun teminatlı alacaklarda karşılığı teminattan geri kalan kısımla sınırlar, teminat düşülmelidir."},"E":{"ad":"Toplama Tuzağı","metin":"Teminat tutarını alacaktan düşmek yerine alacağa eklemişsin. Doğrusu: Teminat tutarı alacaktan düşülür, eklenmez; sonuç 150.000-40.000=110.000 TL\u0027dir."},"A":{"ad":"Teminat Tuzağı","metin":"Teminat tutarının kendisini karşılık sanıyorsun; oysa teminat, karşılık ayrılacak matrahtan düşülen bir kalemdir, karşılığın kendisi değildir. Doğrusu: Karşılık, alacağın teminatsız kalan kısmı olan 110.000 TL üzerinden ayrılır."},"B":{"ad":"Oran Tuzağı","metin":"Şüpheli alacağın belirli bir yüzdesi kadar karşılık ayrılacağını varsayıyorsun; kanunda böyle sabit bir oran yoktur. Doğrusu: Karşılık, teminattan geri kalan tutarın tamamı üzerinden hesaplanır."}},"celdiriciYol":{"D":"150.000 - 0 = 150.000 (teminat düşülmedi)","E":"150.000 + 40.000 = 190.000 (teminat toplama hatası)","A":"Yalnız teminat tutarı yazıldı = 40.000 (teminat = karşılık sanma)","B":"150.000 x 0,5 = 75.000 (kanunda olmayan sabit oran uygulama)"},"hap":"Dava veya icra safhasındaki alacaklar tutar sınırı aranmaksızın şüpheli alacak sayılır; teminatlı alacaklarda karşılık, teminattan arta kalan kısım üzerinden ayrılır.","teshis":{"C":{"gercek":"Dava safhasındaki alacak tutar sınırı olmaksızın şüpheli sayılır; teminattan geri kalan kısım (150.000-40.000=110.000) üzerinden karşılık ayrılır.","ayirt":"Alacak hangi safhada ve teminatlı kısmı düştüm mü?","paragraf":"m.323/1 ve 3. fıkra","yanilgi":"Bu şıkkı eleyen öğrenci teminatın etkisiz olduğunu ya da farklı işlendiğini sanır."},"E":{"gercek":"Teminat tutarı alacaktan düşülür, toplanmaz; işlem yönü tersine çevrilemez.","ayirt":"Teminatı toplama mı yoksa çıkarma işlemine mi soktum?","paragraf":"m.323, 3. fıkra","yanilgi":"Teminat tutarını alacağa ekleyerek işlemi ters kurmuşsun."},"A":{"gercek":"213 sayılı Vergi Usul Kanunu m.323/1 gereği karşılık, teminattan arta kalan alacak kısmı üzerinden ayrılır; teminatın kendisi karşılık değildir.","ayirt":"Teminat karşılığın kendisi mi, yoksa matrahtan düşülen bir kalem mi?","paragraf":"m.323/1, 3. fıkra","yanilgi":"Teminat tutarının doğrudan karşılık tutarı olduğunu sanıyorsun."},"D":{"gercek":"Kanun açıkça teminatlı alacaklarda karşılığın teminattan geri kalan miktara inhisar edeceğini belirtir.","ayirt":"Alacağın bir kısmı için teminat var mı, varsa düştüm mü?","paragraf":"m.323, 3. fıkra","yanilgi":"Teminatın karşılık hesabına hiç etkisi olmadığını sanıyorsun."},"B":{"gercek":"Kanunda sabit bir yüzde yoktur; karşılık, teminattan arta kalan tutarın tamamı üzerinden ayrılır.","ayirt":"Kanun bana bir oran mı verdi, yoksa teminatı düşme kuralı mı verdi?","paragraf":"m.323, 3. fıkra","yanilgi":"Alacağın belli bir yüzdesinin otomatik olarak karşılık ayrılacağını düşünüyorsun."}},"verilen":[[4,0],[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":null,"kural":"Defterikebir, yevmiye defterine geçirilmiş muameleleri alarak usulüne göre hesaplara dağıtan ve tasnifli olarak bu hesaplarda toplayan defterdir.","olcum":{"pencere":7,"hesapKod":0,"capa":"","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Tanım sorularında fiil sırasına bak: \u0027alan-dağıtan-toplayan\u0027 sırası hangi şıkta bozuluyorsa orası tuzaktır.","konu":"vuk defterikebir","tablo":{"satirlar":[["A) Defterikebirdeki kayıtları usulüne göre tasnif ederek ye…","m.184","YANLIŞ ifade"],["B) Yevmiye defterine geçirilmiş olan muameleleri buradan al…","m.184","doğru ifade"],["C) Sınai müesseselerin iptidai ve mamul maddeleri cins ve n…","m.203","YANLIŞ ifade"],["D) Bilanço esasında tutulması zorunlu defterlerden olup, ye…","m.182","YANLIŞ ifade"],["E) İşletme hesabı esasına göre defter tutan mükelleflerin, …","m.182, m.184","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Sınai müesseselerin iptidai ve mamul maddeleri cins ve nevi itibarıyla ayrı sayfalarda göstermek üzere diledikleri şekilde tuttukları defterdir.","E":"İşletme hesabı esasına göre defter tutan mükelleflerin, muameleleri tarih sırasıyla ve madde halinde ilk kez kaydettikleri defterdir.","A":"Defterikebirdeki kayıtları usulüne göre tasnif ederek yevmiye defterine aktaran ve zaman sırasıyla toplayan defterdir.","D":"Bilanço esasında tutulması zorunlu defterlerden olup, yevmiye defteri ve envanter defteri ile birlikte mevcudat ve muvazeneyi gösteren tek defterdir.","B":"Yevmiye defterine geçirilmiş olan muameleleri buradan alarak usulüne göre hesaplara dağıtan ve tasnifli olarak bu hesaplarda toplayan defterdir."},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.184 - Defterikebir","metin":"Defterikebir: Madde 184 – Defterikebir, yevmiye defterine geçirilmiş olan muameleleri buradan alarak usulüne göre hesaplara dağıtan ve tasnifli olarak bu hesaplarda toplıyan defterdir."},{"ad":"VUK (213 s.K.) m.182 - Bilanço Esasına Göre Defter Tutma Bilanço esasında tutulacak defterler","metin":"Bilanço Esasına Göre Defter Tutma Bilanço esasında tutulacak defterler: Madde 182 – Bilanço esasında aşağıdaki defterler tutulur: 1. Yevmiye defteri; 2. Defterikebir; 3. Envanter defteri (Mevcudat ve muazene defteri); 4. (Ek: 30/12/1980-2365/27 md.; Mülga: 22/7/1998-4369/82 md.)"}],"hakem":"Doğru sıkkın dayandığı defterikebir tanımı (yevmiye defterine geçirilmiş muameleleri alarak hesaplara dağıtan ve tasnifli toplayan defter) VUK m.184\u0027te kelimesi kelimesine yer almaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2025/1","alinti":"213 sayılı Vergi Usul Kanununa göre yevmiye defterine geçirilmiş olan muameleleri buradan alarak usulüne göre hesaplara dağıtan ve tasnifli olarak bu hesaplarda toplayan deftere ne ad verilir?"}],"donemler":["2025/1"]},"oyun":null,"tip":"teori","soru":"Bilanço esasına göre defter tutan mükellefler bakımından, 213 sayılı Vergi Usul Kanununa göre defterikebire ilişkin aşağıdaki ifadelerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-vergi-kolay/kp-17","verilenler":[],"dayanak":"213 sayılı Vergi Usul Kanunu m.184","dogru":"B","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: Aylin, gıda toptancılığı yapan bir şirkette muhasebeci. 3 Mart günü 45.000 lira tutarında bir mal satışını önce yevmiye defterine tarih sırasıyla kaydediyor.","anlatim":"Aylin ertesi gün bu 45.000 liralık kaydı alıp ilgili hesaba, mesela \u0027satışlar\u0027 hesabına dağıtıyor. Bu ikinci defter defterikebir.","doldur":[]},{"formul":"Ne yapacağız: 213 sayılı Vergi Usul Kanunu m.184\u0027e göre defterikebir, yevmiye defterine geçirilmiş muameleleri alıp hesaplara dağıtan ve tasnifli toplayan defterdir.","anlatim":"Aylin\u0027in 45.000 liralık kaydı önce yevmiye defterine, sonra defterikebire geçiyor. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.184","karar":"yanlış","anlatim":"Hayır, Aylin\u0027in olayında akış tam tersi: önce yevmiye defteri, sonra defterikebir. Akış yönü m.184\u0027te net.","formul":"Şık A: birisi sana \u0027Aylin defterikebirdeki kaydı tasnif edip yevmiye defterine aktarıyor\u0027 dese, doğru mu dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.184","karar":"doğru","anlatim":"Evet, tam olarak bu. m.184\u0027ün lafzı Aylin\u0027in yaptığı işlemi birebir anlatıyor.","formul":"Şık B: Aylin\u0027in yaptığı iş -yevmiye defterindeki 45.000 liralık kaydı alıp hesaplara dağıtıp tasnifli toplamak- defterikebirin tanımı mıdır?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.203","karar":"yanlış","anlatim":"Hayır, bu m.203\u0027teki özel bir serbestlik, sınai müesseselere tanınan bir seçenek. Defterikebirin tanımı değil.","formul":"Şık C: Aylin\u0027in şirketi sınai bir işletme olsaydı ve iptidai maddelerini diledikleri şekilde ayrı sayfalarda göstermeyi seçseydi, bu defterikebirin genel tanımı mı olurdu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.182","karar":"yanlış","anlatim":"Hayır, mevcudat ve muvazeneyi gösteren defter envanter defteri. Defterikebir sadece hesaplara dağıtıp tasnif eder.","formul":"Şık D: Aylin\u0027e \u0027defterikebir yevmiye ve envanter defteriyle birlikte mevcudat ve muvazeneyi gösteren tek defterdir\u0027 dense, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.182, m.184","karar":"yanlış","anlatim":"Hayır, defterikebir bilanço esasında tutulan bir defter, işletme hesabı esasıyla ilgisi yok. İlk kayıt zaten yevmiye defterine yapılır.","formul":"Şık E: Aylin\u0027in işletmesi bilanço esasında değil işletme hesabı esasında olsaydı, o 45.000 liralık ilk kayıt defterikebire mi yazılırdı?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Aylin\u0027in olayında tek doğru resim B: yevmiye defterinden alıp hesaplara dağıtan, tasnifli toplayan defter. Kendine sor: bu cümle ilk kaydı mı anlatıyor yoksa sonraki dağıtımı mı?","doldur":[]}],"anahtar":[{"ornek":"defterikebir","kok":"defter"},{"ornek":"yevmiye","kok":"yevmiy"},{"ornek":"tasnifli","kok":"tasnif"},{"ornek":"hesaplara","kok":"hesapl"},{"ornek":"dağıtıyor","kok":"dağıtı"},{"ornek":"dağıtan","kok":"dağıta"}],"konuGiris":{"harita":"Ne zaman test edilir: Bilanço esasına göre defter tutan mükelleflerin tutacağı defterler sorulduğunda test edilir. Nasıl ölçülür: Defterikebirin yevmiye defteriyle ilişkisi ve işlevi doğru tanımlanarak ölçülür. Nasıl kaydedilir: Yevmiye defterindeki kayıtlar buradan alınıp hesaplara dağıtılarak tasnifli biçimde kaydedilir.","desen":"Soru genelde defterikebirin tanımını diğer defterlerle (yevmiye, envanter) karıştırtarak sorar. Tuzak, \u0027kayıtların ilk yapıldığı defter\u0027 ile \u0027hesaplara dağıtılan defter\u0027 ifadelerinin yer değiştirmesidir. Bu soru m.184 tanım maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Yevmiye defterindeki işlemleri hesaplara dağıtıp tasnifli toplayan defterdir.","ad":"Defterikebir","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İşlemlerin tarih sırasına göre ilk kaydedildiği defterdir.","ad":"Yevmiye defteri","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Belirli defterlerin birlikte tutulmasını gerektiren defter tutma usulüdür.","ad":"Bilanço esası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Mevcudat ve muvazeneyi gösteren bilanço esası defteridir.","ad":"Envanter defteri","kim":"kanun sabitler"}],"sinavda":"Soruda bilanço esasına göre defter tutan mükellefler verilir ve defterikebire ilişkin doğru ifade istenir.","panel_ornek":"Bir gencin cebinde küçük bir defteri var, önce oraya günlük harcamalarını sırayla not ediyor. Sonra hafta sonu bu notları alıp \u0027yemek\u0027, \u0027ulaşım\u0027, \u0027eğlence\u0027 gibi ayrı sayfalara dağıtarak topluyor. İşte bu ikinci defter, dağıtıp toplama işini yapan defterdir.","ornek":"Bir gencin cebinde küçük bir defteri var, önce oraya günlük harcamalarını sırayla not ediyor. Sonra hafta sonu bu notları alıp \u0027yemek\u0027, \u0027ulaşım\u0027, \u0027eğlence\u0027 gibi ayrı sayfalara dağıtarak topluyor. İşte bu ikinci defter, dağıtıp toplama işini yapan defterdir.","yontemler":"Tanım sorularında kanun maddesindeki ifadeyi birebir hatırlamak esastır; defterikebirin \u0027dağıtan ve toplayan\u0027 işlevini yevmiye defterinin \u0027ilk kayıt\u0027 işleviyle karıştırmamak gerekir.","nedir":"Defterikebir, yevmiye defterine kaydedilen işlemleri hesap hesap dağıtıp tasnifli biçimde toplayan defterdir. Sınav, bu defterin bilanço esasındaki yerini ve işlevini ne kadar doğru bildiğini ölçer."},"olay":"-","tuzak":{"C":{"ad":"Kapsam Tuzağı","metin":"Madde 203\u0027teki sınai müesseselere tanınan kayıt serbestliğini defterikebirin tanımı sanıyorsun. Doğrusu: bu hüküm hangi defterlerin nasıl özelleştirilebileceğine ilişkindir, defterikebirin işlevini tanımlamaz."},"E":{"ad":"Vergilendirme Rejimi Tuzağı","metin":"Bilanço esası yerine işletme hesabı esasını ve yevmiye defterinin ilk kayıt işlevini defterikebire aktarıyorsun. Doğrusu: defterikebir bilanço esasında tutulur ve ilk kayıt değil, yevmiye defterinden gelen kayıtları tasnif eder."},"D":{"ad":"Liste/İşlev Karıştırma Tuzağı","metin":"Madde 182\u0027deki defter listesini ve envanter defterinin mevcudat-muvazene işlevini defterikebire yüklüyorsun. Doğrusu: mevcudat ve muvazeneyi gösteren ayrı bir defter olan envanter defteridir, defterikebir değil."},"A":{"ad":"Ters Yön Tuzağı","metin":"Kaydın akış yönünü tersine çevirip defterikebirden yevmiye defterine aktarım yapıldığını düşünüyorsun. Doğrusu: aktarım yevmiye defterinden defterikebire doğrudur, defterikebir kayıtları toplayan taraftır."}},"celdiriciYol":{},"hap":"Defterikebir, yevmiye defterine geçmiş muameleleri alıp usulüne göre hesaplara dağıtan ve tasnifli olarak toplayan defterdir; ilk kayıt değil, sonraki tasniftir.","teshis":{"C":{"gercek":"m.203 sınai müesseselere özgü bir serbestlik tanır, defterikebirin ne olduğunu tanımlamaz; tanım m.184\u0027tedir.","ayirt":"Bu ifade defterikebirin GENEL tanımı mı, yoksa belirli bir mükellef grubuna tanınan ÖZEL bir imkân mı?","paragraf":"m.203","yanilgi":"Kayıt serbestliğine ilişkin özel bir hükmü, defterin genel tanımıyla karıştırıyorsun."},"E":{"gercek":"Defterikebir bilanço esasında tutulur (m.182) ve ilk kayıt yevmiye defterinde yapılır; defterikebir bu kayıtları sonradan tasnif eder (m.184).","ayirt":"İlk kayıt hangi defterde, tasnifli toplama hangi defterde diye ayırıyor muyum?","paragraf":"m.182, m.184","yanilgi":"Defterikebiri işletme hesabı esasıyla ilişkilendirip yevmiye defterinin ilk kayıt işlevini ona veriyorsun."},"A":{"gercek":"213 sayılı Vergi Usul Kanunu m.184\u0027e göre akış tek yönlüdür: yevmiye defterinden defterikebire.","ayirt":"Hangi defter önce, hangi defter sonradan tasnifli topluyor diye kendime soruyor muyum?","paragraf":"m.184","yanilgi":"Defterikebiri bir nevi ikinci yevmiye defteri gibi görüp aktarımın ondan yevmiye defterine yapıldığını sanıyorsun."},"D":{"gercek":"m.182 yalnız hangi defterlerin tutulacağını sayar; mevcudat ve muvazene işlevi envanter defterine aittir, defterikebire değil.","ayirt":"Bu cümle defterin sayıldığı yeri mi anlatıyor, yoksa işlevini mi tanımlıyor?","paragraf":"m.182","yanilgi":"m.182\u0027deki defter listesini okuyup her defterin işlevinin aynı olduğunu, hepsinin mevcudat-muvazeneyi gösterdiğini sanıyorsun."},"B":{"gercek":"213 sayılı Vergi Usul Kanunu m.184, defterikebiri tam olarak bu cümleyle tanımlar.","ayirt":"Madde metnindeki fiiller (alan, dağıtan, toplayan) şıkta birebir var mı?","paragraf":"m.184","yanilgi":"Bu tanımı seçmeyip daha karmaşık, çok maddeli bir ifade arayan öğrenci basit lafzı gözden kaçırır."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 108"},"kural":"Ek madde 2 uyarınca elektronik tebligat adresi, Posta ve Telgraf Teşkilatı Anonim Şirketi tarafından gerçek kişi için kimlik numarası, tüzel kişi için tabi olduğu sistem numarası esas alınarak sadece bir tane oluşturulur ve sistemde kaydedilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 108","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde \u0027kim yapar - neyi esas alır - kaç tane\u0027 üçlüsünü ayrı ayrı işaretle, şıklardaki tek kelime değişimini bu üçlü üzerinden yakala.","konu":"elektronik tebligat","tablo":{"satirlar":[["A) Tüzel kişiler için elektronik tebligat adresi, kimlik nu…","ek m.2/1","YANLIŞ ifade"],["B) Elektronik tebligat adresleri, adres sahibine teslim edi…","ek m.2/1-2","YANLIŞ ifade"],["C) Elektronik tebligat adresinin oluşturulması, ilgili kuru…","ek m.2/1","YANLIŞ ifade"],["D) Gerçek kişi için birden fazla elektronik tebligat adresi…","ek m.2/1","YANLIŞ ifade"],["E) Elektronik tebligat adresi, gerçek kişi için kimlik numa…","ek m.2/1","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Elektronik tebligat adresinin oluşturulması, ilgili kurum, kuruluş veya birlik tarafından gerçekleştirilir.","E":"Elektronik tebligat adresi, gerçek kişi için kimlik numarası, tüzel kişi için tabi olduğu sistem numarası esas alınarak sadece bir tane oluşturulur.","A":"Tüzel kişiler için elektronik tebligat adresi, kimlik numarası esas alınarak Posta ve Telgraf Teşkilatı Anonim Şirketi tarafından oluşturulur.","D":"Gerçek kişi için birden fazla elektronik tebligat adresi oluşturulabilmesi, kişinin talebine bağlıdır.","B":"Elektronik tebligat adresleri, adres sahibine teslim edilmeden önce tebligat çıkarmaya yetkili makam ve mercilerin kullanımına sunulur."},"kaynak":{"alinti":"","liste":[{"ad":"Tebligat K. (7201 s.K.) ek m.2 - Elektronik tebligat adresinin oluşturulması","metin":"Elektronik tebligat adresinin oluşturulması: Ek Madde 2- (Ek: 28/2/2018-7101/49 md.) Elektronik tebligat adresi, Posta ve Telgraf Teşkilatı Anonim Şirketi tarafından, 7/a maddesi kapsamında kalan her bir gerçek kişi için kimlik numarası, tüzel kişi için ise tabi oldukları sistem numarası esas alınmak suretiyle sadece bir tane olacak şekilde oluşturulur ve sistemde kaydedilir. Oluşturulan elektronik tebligat adresleri, adres sahiplerine teslim edilmek üzere, ilgili kurum, kuruluş veya birliğe gönderilir; 7/a maddesinin ikinci fıkrası kapsamında kalan kişilere ise doğrudan teslim edilir. Bu adresler, adres sahibine teslim edildikten sonra 1 inci madde uyarınca tebligat çıkarmaya yetkili makam ve mercilerin kullanımına sunulur. Kurum, kuruluş veya birlikler ile gerçek veya tüzel kişilerin 7/a maddesi uyarınca elektronik tebligat zorunluluğuna tabi olmaları veya bunlar hakkında elektronik tebligat zorunluluğunun ortadan kalkması hâllerinde gerekli bildirimler, ilgili kurum, kuruluş veya birlik tarafından bir ay içinde yapılır ve bildirimi takip eden bir ay içinde Posta ve Telgraf Teşkilatı Anonim Şirketi tarafından gerekli işlem yapılır. Posta ve Telgraf Teşkilatı Anonim Şirketi, elektronik tebligat sisteminin yürütülmesi için gerekli bilgi ve belgeleri ilgili kurum, kuruluş veya birliklerden ister. İlgili kurum, kuruluş veya birlikler, talep edilen bilgi ve belgeleri Posta ve Telgraf Teşkilatı Anonim Şirketine göndermek zorundadır."},{"ad":"Tebligat K. (7201 s.K.) gec. m.2 - Elektronik tebligat adreslerinin verilmesi","metin":"Elektronik tebligat adreslerinin verilmesi: Geçici Madde 2- (Ek: 28/2/2018-7101/50 md.) Bu maddenin yürürlüğe girdiği tarihten itibaren bir ay içinde Posta ve Telgraf Teşkilatı Anonim Şirketi, elektronik tebligat adreslerini oluşturmak amacıyla ihtiyaç duyduğu tüm bilgi ve belgeleri; 1. İlgili kamu kurum veya kuruluşundan, 2. Mahallî idareler bakımından Çevre ve Şehircilik Bakanlığından,16 3. İlgili kamu iktisadi teşebbüsünden, 4. İlgili kamuya ait ortaklıktan, 5. Şirketler ve kooperatifler bakımından Gümrük ve Ticaret Bakanlığından, 6. İlgili kamu kurumu niteliğindeki meslek kuruluşu veya üst kuruluşundan, 7. Türkiye Noterler Birliğinden, 29/11/2018 tarihli ve 7153 sayılı Kanunun 28 nci maddesiyle bu bentte yer alan “İçişleri” ibaresi “Çevre ve Şehircilik” şeklinde değiştirilmiştir. 16 8. Türkiye Barolar Birliğinden, ister. İlgili kurum, kuruluş veya birlik, talep edilen bilgileri bir ay içinde Posta ve Telgraf Teşkilatı Anonim Şirketine bildirmek zorundadır. Posta ve Telgraf Teşkilatı Anonim Şirketi, elektronik tebligat adreslerini, bu bilgileri esas almak suretiyle üç ay içinde oluşturur. Posta ve Telgraf Teşkilatı Anonim Şirketi oluşturulan elektronik tebligat adreslerini, adres sahiplerine teslim edilmek üzere, ilgili kurum, kuruluş veya birliğe gönderir ve teslim işlemi gerçekleştikten sonra bu adresleri, 1 inci madde uyarınca tebligat çıkarmaya yetkili makam ve mercilerin kullanımına sunar."}],"hakem":"Doğru sık, Tebligat Kanunu Ek Madde 2\u0027de açıkça belirtilen kurala dayanmakta; elektronik tebligat adresinin gerçek kişi için kimlik numarası, tüzel kişi için sistem numarası esas alınarak sadece bir tane oluşturulması kaynakta net şekilde desteklenmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2024/3","alinti":"213 sayılı Vergi Usul Kanunu’na göre elektronik ortamda tebligat, aşağıdaki hangi tarihte muhatabına yapılmış sayılır?"}],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"Elektronik tebligat adresinin oluşturulmasına ilişkin olarak aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-vergi-kolay/kp-20","verilenler":[],"dayanak":"7201 sayılı Tebligat Kanunu ek madde 2/1","dogru":"E","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: Bir anonim şirket 3 Ocak 2019\u0027da elektronik tebligat sistemine dahil oldu, aynı şirketin ortağı Ahmet Bey de gerçek kişi olarak zaten kayıtlı.","anlatim":"Posta ve Telgraf Teşkilatı Anonim Şirketi şirket için sistem numarasını kullanıyor, Ahmet Bey için kimlik numarasını kullanıyor. İkisi de tek adres alıyor, ikisi de aynı ölçütle oluşturuluyor.","doldur":[]},{"formul":"Ne yapacağız: Ek m.2/1\u0027e göre adresi kim oluşturur, hangi numara esas alınır, kaç tane olur; bu üç unsuru olayda test edeceğiz. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural şu: PTT AŞ, gerçek kişide kimlik numarasını, tüzel kişide sistem numarasını esas alarak sadece bir adres oluşturur ve kaydeder. Şimdi A\u0027dan E\u0027ye kadar bunu sınayacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"ek m.2/1","karar":"yanlış","anlatim":"Hayır, şirket tüzel kişi olduğu için ona kimlik numarası değil, tabi olduğu sistem numarası uygulanır. Kimlik numarası sadece Ahmet Bey gibi gerçek kişiye özgüdür.","formul":"Şık A: Anonim şirket için de kimlik numarası mı esas alınır diyorsun?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"ek m.2/1-2","karar":"yanlış","anlatim":"Hayır, adres önce şirkete teslim edilir, teslimden sonra yetkili makam ve mercilerin kullanımına açılır. Teslim gerçekleşmeden kullanım başlamaz.","formul":"Şık B: Şirketin adresi oluşturulur oluşturulmaz, hemen o gün yetkili makamlar mı kullanmaya başlar?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"ek m.2/1","karar":"yanlış","anlatim":"Hayır, adresi oluşturan ve sisteme kaydeden tek yetkili PTT AŞ\u0027dir. Sicil müdürlüğü sadece adresi teslim eden aracıdır.","formul":"Şık C: Şirketin bağlı olduğu ticaret sicil müdürlüğü mü bu adresi bizzat oluşturur?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"ek m.2/1","karar":"yanlış","anlatim":"Hayır, kimlik numarası esasıyla her gerçek kişiye sadece bir tane adres oluşturulur. Kanun talebe bağlı çoğaltma öngörmez.","formul":"Şık D: Ahmet Bey \"ben bir de ikinci adres istiyorum\" derse, talebiyle ikinci adres açılır mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"ek m.2/1","karar":"doğru","anlatim":"Evet, madde metni tam olarak bunu söyler: PTT AŞ, gerçek kişide kimlik numarası tüzel kişide sistem numarasıyla tek adres oluşturur. Olayımızdaki her iki durum da bu cümleyle birebir örtüşüyor.","formul":"Şık E: Şirket için sistem numarası, Ahmet Bey için kimlik numarası esas alınıp ikisine de sadece bir tane adres açılması doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Bu maddenin tamamı tek cümlede toplanıyor: kim oluşturur, hangi ölçütle, kaç tane. Kendine hep şunu sor: bu cümledeki üç unsur da madde metninde birebir var mı?","doldur":[]}],"anahtar":[{"ornek":"numarası","kok":"numara"},{"ornek":"sistem","kok":"sistem"},{"ornek":"oluşturulur","kok":"oluştu"},{"ornek":"kimlik","kok":"kimlik"},{"ornek":"gerçek","kok":"gerçek"},{"ornek":"kişide","kok":"kişide"}],"konuGiris":{"harita":"Ne zaman oluşturulur: kişi Tebligat Kanunu 7/a kapsamına girdiğinde. Nasıl oluşturulur: gerçek kişide kimlik numarası, tüzel kişide sistem numarası esas alınarak PTT tarafından tek adres kurulur. Nasıl kullanıma açılır: adres sahibine teslim edildikten sonra tebligat çıkarmaya yetkili makamların kullanımına sunulur.","desen":"Sınav, adresin kişi başına birden fazla mı yoksa tek mi olduğunu ve oluşturma esasının kimlik/sistem numarası olduğunu karıştırır. Bazı seçenekler adresin doğrudan yetkili makamca oluşturulduğunu söyleyerek PTT\u0027nin rolünü gizler. Bu soru ek m.2 fıkra 1 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kişiye özgü, tek ve sabit dijital tebligat kutusu","ad":"Elektronik tebligat adresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Adresi oluşturan ve teslim eden kurum","ad":"PTT (Posta ve Telgraf Teşkilatı A.Ş.)","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Adresin oluşturulmasında esas alınan tekil numara","ad":"Kimlik/sistem numarası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Adresin ilgili kurum aracılığıyla sahibine ulaştırılması","ad":"Teslim işlemi","kim":"kanun sabitler"}],"sinavda":"Soru, elektronik tebligat adresinin kim tarafından ve neye göre oluşturulduğunu doğru seçeneği bulmayı ister.","panel_ornek":"Bir genç, bankada tek bir IBAN numarası açtırır ve bu numara ona hayat boyu, tek ve sabit kalır. Elektronik tebligat adresi de tıpkı bu IBAN gibi, kişiye kimlik numarasına göre bir kez oluşturulan tek bir adrestir.","ornek":"Bir genç, bankada tek bir IBAN numarası açtırır ve bu numara ona hayat boyu, tek ve sabit kalır. Elektronik tebligat adresi de tıpkı bu IBAN gibi, kişiye kimlik numarasına göre bir kez oluşturulan tek bir adrestir.","yontemler":"Metni satır satır okuyup \u0027kim oluşturur, neye göre, kaç tane\u0027 sorularına net cevap arayın.","nedir":"Elektronik tebligat, resmi bildirimlerin kağıt yerine PTT üzerinden kurulan sabit bir dijital adrese yapılmasıdır. Sınav, bu adresin kim tarafından ve neye göre oluşturulup teslim edildiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Yetkili Kurum Tuzağı","metin":"Oluşturma işini ilgili kurum, kuruluş veya birliğin yaptığını sanırsın. Doğrusu: Elektronik tebligat adresini oluşturan ve sisteme kaydeden Posta ve Telgraf Teşkilatı Anonim Şirketidir, ilgili kurum yalnız teslim aracısıdır."},"A":{"ad":"Ölçüt Karıştırma Tuzağı","metin":"Tüzel kişi için de kimlik numarası esas alınır sanırsın. Doğrusu: Tüzel kişi için tabi olduğu sistem numarası esas alınır, kimlik numarası yalnız gerçek kişide kullanılır."},"D":{"ad":"Sayı/Kapsam Tuzağı","metin":"Adresin talebe bağlı olarak çoğaltılabileceğini sanırsın. Doğrusu: Her gerçek kişi için kimlik numarası esas alınarak sadece bir tane elektronik tebligat adresi oluşturulur, talebe bağlı ikinci adres öngörülmemiştir."},"B":{"ad":"Zamanlama Tuzağı","metin":"Adresin oluşturulması ile yetkili makamların kullanımına açılmasını aynı an sanırsın. Doğrusu: Adres, sahibine teslim edildikten sonra tebligat çıkarmaya yetkili makam ve mercilerin kullanımına sunulur."}},"celdiriciYol":{},"hap":"Elektronik tebligat adresi, Posta ve Telgraf Teşkilatı Anonim Şirketi tarafından gerçek kişide kimlik numarası, tüzel kişide sistem numarası esas alınarak sadece bir tane oluşturulur.","teshis":{"C":{"gercek":"Adresi oluşturan ve sisteme kaydeden tek yetkili Posta ve Telgraf Teşkilatı Anonim Şirketidir; ilgili kurum yalnız teslim aracısıdır.","ayirt":"Adresi kaydeden mi yoksa yalnız teslim eden mi?","paragraf":"ek m.2/1","yanilgi":"Kurum, kuruluş veya birliklerin adresi bizzat oluşturduğunu sanırsın."},"E":{"gercek":"Madde metni tam olarak bu üç unsuru birlikte söyler: Posta ve Telgraf Teşkilatı Anonim Şirketi, ölçüt (kimlik/sistem numarası), tek adet.","ayirt":"Bu cümledeki üç unsur da madde metninde birebir yer alıyor mu?","paragraf":"ek m.2/1","yanilgi":"Bu ifade ayrıntılı göründüğü için yanlış olduğunu düşünüp elersin."},"A":{"gercek":"Kanun tüzel kişi için tabi olduğu sistem numarasını esas alır, kimlik numarası yalnız gerçek kişiye özgüdür.","ayirt":"Bu kişi gerçek mi tüzel mi, hangi numara sistemine tabi?","paragraf":"ek m.2/1","yanilgi":"Tüzel kişilerin de gerçek kişi gibi kimlik numarasıyla anıldığını sanırsın."},"D":{"gercek":"Her gerçek kişi için kimlik numarası esasıyla sadece bir tane adres oluşturulur, talebe bağlı çoğaltma öngörülmemiştir.","ayirt":"Kanun \u0027bir tane\u0027 sınırına talebe bağlı bir istisna getirmiş mi?","paragraf":"ek m.2/1","yanilgi":"Gerçek kişinin talebiyle ikinci bir adres açılabileceğini sanırsın."},"B":{"gercek":"Oluşturulan adres önce sahibine teslim edilir, teslimden sonra yetkili makam ve mercilerin kullanımına sunulur.","ayirt":"Teslim gerçekleşti mi, yoksa henüz oluşturma aşamasında mı?","paragraf":"ek m.2/1-2","yanilgi":"Adresin oluşturulmasıyla kullanıma açılmasının aynı anda gerçekleştiğini düşünürsün."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 117"},"kural":"3065 sayılı Katma Değer Vergisi Kanunu\u0027nun 24 üncü maddesine göre vade farkı ile sigorta gideri karşılığı matraha dahildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 117","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Sapma sorularında önce kanuna göre olması gereken matrahı bentlere göre kur, sonra işletmenin/muhasebecinin bulduğu tutardan çıkararak yönü belirle.","konu":"kdv matrahına dahil unsurlar","tablo":{"satirlar":[["VERİLENLER","-"],["Satış bedeli","100.000 TL"],["Vade farkı","5.000 TL"],["Sigorta gideri karşılığı","8.000 TL"],["HESAP","-"],["Doğru KDV matrahı (100.000+5.000+8.000)","113.000"],["Muhasebecinin belirlediği matrah","100.000"],["Sapma (Doğru matrah - Muhasebecinin matrahı) - olumsuz","13.000"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"8.000 olumsuz","E":"13.000 olumsuz","A":"5.000 olumlu","D":"13.000 olumlu","B":"5.000 olumsuz"},"kaynak":{"alinti":"","liste":[{"ad":"KDVK (3065 s.K.) m.24 - Matraha dahil olan unsurlar","metin":"Matraha dahil olan unsurlar: Madde 24 – Aşağıda yazılı unsurlar matraha dahildir: a) Teslim alanın gösterdiği yere kadar satıcı tarafından yapılan taşıma, yükleme ve boşaltma giderleri, b) Ambalaj giderleri, sigorta, komisyon ve benzeri gider karşılıkları ile vergi, resim, harç, pay, fon karşılığı gibi unsurlar, c) Vade farkı, fiyat farkı, kur farkı, faiz, prim gibi çeşitli gelirler ile servis ve benzer adlar altında sağlanan her türlü menfaat, hizmet ve değerler.70"}],"hakem":"Soru KDV matrahına dahil edilmesi gereken unsurları (vade farkı ve sigorta gideri) doğru olarak tanımlamış, hesaplama tutarlı ve dayanak kanun metninden net olarak desteklenmiştir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":{"bosluk":[[2,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Doğru KDV matrahı (150.000+6.000+4.000)","160.000"],["Muhasebecinin belirlediği matrah","150.000"],["Sapma (Doğru matrah - Muhasebecinin matrahı) - olumsuz","10.000"]]},"tur":"tablo","soru":"İşletme 150.000 TL bedelle mal satmış, ayrıca alıcıdan 6.000 TL vade farkı ile 4.000 TL ambalaj gideri karşılığı tahsil etmiştir. Muhasebeci Katma Değer Vergisi matrahını hesaplarken yalnız satış bedelini dikkate almıştır. Bu işlemde matrah tutarındaki sapma ne kadar ve hangi yöndedir?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve matrah sapmasının tutarını bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme 100.000 TL bedelle mal satmış, ayrıca alıcıdan 5.000 TL vade farkı ile 8.000 TL sigorta gideri karşılığı tahsil etmiştir. Muhasebeci Katma Değer Vergisi matrahını hesaplarken yalnız satış bedelini dikkate almıştır. Bu işlemde matrah tutarındaki sapma ne kadar ve hangi yöndedir?","kayitBaslik":"","id":"sgs-t1-vergi-kolay/kp-24","verilenler":[{"deger":"100.000 TL","anlam":"Muhasebecinin tek başına dikkate aldığı, tartışmasız matraha dahil ana tutar","ad":"Satış bedeli"},{"deger":"5.000 TL","anlam":"Kanunun m.24/c bendine göre matraha dahil edilmesi gereken, ancak hesaba katılmayan tutar","ad":"Vade farkı"},{"deger":"8.000 TL","anlam":"Kanunun m.24/b bendine göre matraha dahil edilmesi gereken, ancak hesaba katılmayan tutar","ad":"Sigorta gideri karşılığı"}],"dayanak":"3065 sayılı Katma Değer Vergisi Kanunu m.24/b,c","dogru":"E","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Verilen: satış bedeli 100.000 TL (soruda verilen); vade farkı 5.000 TL (soruda verilen); sigorta gideri karşılığı 8.000 TL (soruda verilen); muhasebecinin belirlediği matrah 100.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: satış bedeli 100.000 TL, vade farkı 5.000 TL, sigorta gideri karşılığı 8.000 TL. Muhasebeci matrahı hesaplarken yalnız 100.000 TL\u0027yi almış.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[6,1]]},{"formul":"Matraha dahil unsurlar = satış bedeli + vade farkı + sigorta gideri karşılığı","anlatim":"Katma Değer Vergisi matrahı nedir? Satış bedeline ek olarak alıcıdan tahsil edilen vade farkı, faiz, sigorta gideri gibi her unsur matraha girer. Vergi Usul Kanunu değil, Katma Değer Vergisi Kanunu\u0027nun 24 üncü maddesi bunu söyler.","doldur":[]},{"formul":"Doğru matrah = satış bedeli + vade farkı + sigorta gideri = 100.000 (soruda verilen) + 5.000 (soruda verilen) + 8.000 (soruda verilen) = 113.000 TL","anlatim":"Şimdi doğru matrahı hesaplıyoruz çünkü kanun vade farkını ve sigorta gideri karşılığını da matraha katmamızı istiyor. Muhasebeci bu ikisini unutmuş, biz eksiksiz topluyoruz.","doldur":[[5,1]]},{"formul":"Sapma = doğru matrah - muhasebecinin matrahı = 113.000 (3. adımda bulduk) - 100.000 (soruda verilen) = 13.000 TL","anlatim":"Şimdi sapmayı buluyoruz, yani muhasebecinin eksik bıraktığı tutarı. Doğru matrahtan onun kullandığı matrahı çıkarıyoruz.","doldur":[[7,1]]},{"formul":"Sonuç = 13.000 TL eksik (olumsuz sapma)","anlatim":"Sonuç: matrah 13.000 TL eksik hesaplanmış, yani sapma olumsuz yöndedir. Muhasebeci vade farkı ve sigorta gideri karşılığını matraha katmadığı için devlete eksik vergi beyan edilmiş.","doldur":[]},{"formul":"Ters durum: fazla eklenen unsur → sapma olumlu (matrah fazla hesaplanmış)","anlatim":"Ters durumda: muhasebeci matraha olması gerekenden fazla tutar eklemiş olsaydı sapma olumlu, yani matrah fazla hesaplanmış olurdu.","doldur":[]},{"formul":"Yanlış yol: sapma = 0 TL, matrah doğru hesaplanmış (HATALI) → doğrusu 13.000 TL eksik (4. adımda bulduk)","anlatim":"En sık hata: öğrenciler vade farkı ve sigorta gideri karşılığını \u0027ayrıca tahsil edilen tutar\u0027 diye matrah dışı sanır. Oysa bunlar alıcıdan mal veya hizmet nedeniyle alındığı için matraha dahildir.","doldur":[]}],"anahtar":[{"ornek":"matraha","kok":"matrah"},{"ornek":"sigorta","kok":"sigort"},{"ornek":"gideri","kok":"gideri"},{"ornek":"karşılıklar","kok":"karşıl"},{"ornek":"muhasebeci","kok":"muhase"},{"ornek":"hesaplarken","kok":"hesapl"}],"konuGiris":{"harita":"Ne zaman test edilir: satış bedeline ek olarak vade farkı, sigorta, komisyon gibi unsurlar tahsil edildiğinde. Nasıl ölçülür: mal/hizmet bedeline kanunda sayılan tüm ek unsurlar eklenerek toplam matrah bulunur. Nasıl kaydedilir: KDV, bulunan bu toplam matrah üzerinden hesaplanıp beyan edilir.","desen":"Soru genellikle satış bedeli dışında vade farkı, sigorta veya komisyon gibi bir ek unsur vererek bunun matraha dahil edilip edilmediğini sorar. Tuzak nokta, öğrencinin sadece ana satış bedelini matrah sanıp ek unsurları gözden kaçırmasıdır. Bu soru KDVK m.24 hükmünden geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"KDV\u0027nin üzerinden hesaplandığı, tüm bedel unsurlarını içeren toplam tutar","ad":"KDV matrahı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Vadeli satışta alıcıdan tahsil edilen ek gelir, matraha dahildir","ad":"Vade farkı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Satıcının üstlendiği sigorta bedelinin alıcıdan tahsil edilen kısmı","ad":"Sigorta gideri karşılığı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Muhasebecinin hesapladığı yanlış tutar ile doğru matrah arasındaki eksik kısım","ad":"Matrah farkı","kim":"kanun sabitler"}],"sinavda":"Satış bedeli ile buna ek tahsil edilen vade farkı ve sigorta gideri karşılığı verilerek muhasebecinin eksik hesapladığı matrah farkının yönü ve tutarı istenir.","panel_ornek":"Arkadaşın ikinci el bir bisiklet satıyor: 300 TL bisiklet bedeli, buna ek olarak 20 TL kargo ücreti ve 10 TL sigorta bedeli de alıcıdan tahsil ediliyor. Alıcının ödediği toplam tutar aslında 330 TL\u0027dir, sadece 300 TL değil; çünkü kargo ve sigorta da satışın bir parçasıdır.","ornek":"Arkadaşın ikinci el bir bisiklet satıyor: 300 TL bisiklet bedeli, buna ek olarak 20 TL kargo ücreti ve 10 TL sigorta bedeli de alıcıdan tahsil ediliyor. Alıcının ödediği toplam tutar aslında 330 TL\u0027dir, sadece 300 TL değil; çünkü kargo ve sigorta da satışın bir parçasıdır.","yontemler":"Vade farkı ve sigorta gideri karşılığı kanunen matraha dahil olduğundan, doğru matrah 100.000+5.000+8.000=113.000 TL\u0027dir; muhasebeci 100.000 TL almış, sapma 13.000 TL eksik yöndedir.","nedir":"KDV matrahı, bir teslim veya hizmet karşılığında alıcıdan sağlanan tüm bedel unsurlarının toplamıdır. Sınav, hangi ek gelirlerin matraha eklenip eklenmeyeceğini ayırt etme becerisini ölçer."},"olay":"Doğru matrah 100.000+5.000+8.000=113.000; muhasebecinin matrahı 100.000; sapma 113.000-100.000=13.000.","tuzak":{"C":{"ad":"Sigorta Kalemini Tek Başına Alma Tuzağı","metin":"Yalnız sigorta gideri karşılığının unutulduğunu düşünüp vade farkını hesaba katmamışsın. Doğrusu: Vade farkı da matraha dahildir, toplam sapma 13.000 TL\u0027dir."},"A":{"ad":"Vade Farkını Tek Başına Alma Tuzağı","metin":"Yalnız vade farkının unutulduğunu düşünüp sigorta gideri karşılığının doğru hesaplandığını varsaymışsın, üstelik yönü de ters çevirmişsin. Doğrusu: Her iki kalem birlikte eksik hesaba katılmıştır, sapma olumsuzdur."},"D":{"ad":"Ters Yön Tuzağı","metin":"Doğru tutarı bulmuşsun ama matrahın az değil fazla hesaplandığını sanmışsın. Doğrusu: Muhasebeci iki kalemi de matraha katmadığı için matrah olması gerekenden az (olumsuz) hesaplanmıştır."},"B":{"ad":"Tek Kalem Eksiği Tuzağı","metin":"Yalnız vade farkının matraha dahil edilmediğini düşünüp sigorta gideri karşılığını gözden kaçırmışsın. Doğrusu: Sigorta gideri karşılığı da matraha dahildir, toplam sapma 13.000 TL\u0027dir."}},"celdiriciYol":{"C":"8.000 (yalnız sigorta gideri karşılığı matraha dahil edilmemiş sanılmış, vade farkı görülmemiş)","A":"5.000 (yalnız vade farkı tutarı alınıp yön ters kurulmuş, olumlu işaretlenmiş)","D":"113.000 - 100.000 = 13.000 (tutar doğru bulunmuş ama yön ters yazılmış, olumlu işaretlenmiş)","B":"5.000 (yalnız vade farkı matraha dahil edilmemiş sanılmış, sigorta kalemi görülmemiş)"},"hap":"Katma Değer Vergisi Kanunu\u0027nun 24 üncü maddesine göre vade farkı, kur farkı, faiz, prim, sigorta ve komisyon gibi karşılıklar teslim bedeline bakılmaksızın matraha dahildir.","teshis":{"C":{"gercek":"Vade farkı da m.24/c\u0027de sayılan, matraha dahil bir gelirdir.","ayirt":"Metindeki her ek tutarı tek tek m.24 bentleriyle eşleştirdim mi?","paragraf":"m.24/c","yanilgi":"Sigorta gideri karşılığını matraha dahil unsur olarak fark ettin ama vade farkını atladın."},"E":{"gercek":"Katma Değer Vergisi Kanunu m.24/b,c\u0027ye göre sigorta gideri karşılığı ve vade farkı matraha dahildir; ikisi de dışlanınca matrah 13.000 TL eksik kalır.","ayirt":"Matraha dahil sayılan her kalemi tek tek işaretleyip toplamı ayrı mı hesapladım?","paragraf":"m.24/b,c","yanilgi":"Bu şıkkı eleyen öğrenci genellikle iki kalemden birini matraha dahil saymayı unutur ya da yönü ters kurar."},"A":{"gercek":"Vade farkı m.24/c uyarınca matraha eklenir; eklenmezse matrah azalır, artmaz.","ayirt":"Bu kalem matraha eklenmeseydi matrah artar mıydı, azalır mıydı diye kendine sor.","paragraf":"m.24/c","yanilgi":"Vade farkını hatırladın ama işlemi ters kurup matrahın olduğundan fazla çıktığını sandın."},"D":{"gercek":"Matraha dahil kalemler dikkate alınmadığında matrah düşük çıkar, olumsuz sapma oluşur.","ayirt":"Hesaplanan matrah, olması g efi olsaydı, hacim ne olursa olsun bilanço esasına göre defter tutamaz mıydı?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.177/6","karar":"yanlış","anlatim":"6 ncı bent hiçbir had aramaz, sadece tercih beyanı yeterlidir. Seçim anında birinci sınıf olunur.","formul":"Şık D: Şirket ihtiyari olarak bilanço esasını seçseydi, birinci sınıfa geçmek için hâlâ haddi aşması mı gerekirdi?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.177/3","karar":"yanlış","anlatim":"3 üncü bent birleşik ölçüt kurar, iş hasılatının beş katı ile satış tutarı toplanır. Tek kalem yeterli değildir.","formul":"Şık E: Şirket hem alım-satım hem iş hasılatı getiren iş yapsaydı, sınıf tayini yalnızca satış tutarına mı bakılarak yapılırdı?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Ticaret şirketleri hacimden bağımsız birinci sınıftır, diğer dört ifade kendi bendinin hükmünü yanlış aktarır. Kendine sor: bu mükellef bir şirket mi, yoksa hacim ölçütüne tabi gerçek kişi mi?","doldur":[]}],"anahtar":[{"ornek":"şirketleri","kok":"şirket"},{"ornek":"birinci","kok":"birinc"},{"ornek":"ticaret","kok":"ticare"},{"ornek":"sınıftır","kok":"sınıft"},{"ornek":"yeterlidir","kok":"yeterl"},{"ornek":"kişiler","kok":"kişile"}],"konuGiris":{"harita":"Ne zaman test edilir: Bir tüccarın alım-satım veya hasılat tutarları yıl sonunda kanundaki hadleri aşınca test edilir. Nasıl ölçülür: Yıllık alım, satış veya iş hasılatı tutarları kanunda belirtilen parasal hadlerle karşılaştırılarak ölçülür. Nasıl kaydedilir: Had aşılırsa tacir bilanço esasına göre defter tutmakla yükümlü birinci sınıf tacir olarak kaydedilir.","desen":"Sınav genellikle m.177\u0027deki altı bendi karıştırıp hangisinin doğru/yanlış olduğunu sordurur; şirketler ve kurumlar vergisi mükelleflerinin otomatik birinci sınıf sayılması sıkça tuzak olur. Öğrenci genellikle haddi aşma şartı ile şirket olma şartını birbirine karıştırır. Bu soru m.177 bent 4-5-6 noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Mal alıp satan tü etin":"madde 177/3\u0027teki bileşik ölçütü tek kaleme indirgersin. Doğrusu: iki iş birlikte yapılıyorsa iş hasılatının beş katı ile satış tutarının toplamına bakılır."},"D":{"ad":"Şart Ekleme Tuzağı","metin":"ihtiyari seçime hacim şartı bağlarsın. Doğrusu: madde 177/6 hacim şartı aramaksızın, tercih tek başına birinci sınıfa geçirir."},"B":{"ad":"Adi Şirket Tuzağı","metin":"adi şirketleri ticaret şirketiyle karıştırıp otomatik ikinci sınıf sayarsın. Doğrusu: madde 177/4 parantez hükmünce adi şirketler iştigal ettikleri iş hangi bende giriyorsa o bendin hacim ölçütüne tabidir."}},"celdiriciYol":null,"hap":"Ticaret şirketleri ile kurumlar vergisi mükellefi tüzel kişiler, iş hacmine bakılmaksızın birinci sınıf tacir sayılır.","teshis":{"C":{"gercek":"Madde 177/5 bu tüzel kişileri esasen birinci sınıf sayar; işletme hesabına geçiş yalnız Maliye Bakanlığı izniyle mümkündür.","ayirt":"Kural genel mi, yoksa istisnai bir izin mi tanımlanıyor?","paragraf":"213 sayılı VUK m.177/5","yanilgi":"Kurumlar vergisi mükellefiyetini bilanço esasından muafiyet göstergesi sanırsın."},"E":{"gercek":"Madde 177/3 birleşik ölçüt kurar: iş hasılatının beş katı ile satış tutarının toplamı esas alınır.","ayirt":"Soruda iki farklı faaliyet birlikte mi yapılıyor, tek kalem mi bu durumu ölçer?","paragraf":"213 sayılı VUK m.177/3","yanilgi":"İki farklı iş türü birlikte yapıldığında sadece tek bir kalemin (satış tutarının) yeterli olduğunu sanırsın."},"A":{"gercek":"Madde 177/4, ticaret şirketlerini hacim ölçütünden bağımsız biçimde doğrudan birinci sınıfa sokar.","ayirt":"Bu mükellef bir şirket mi, yoksa gerçek kişi tacir mi?","paragraf":"213 sayılı VUK m.177/4","yanilgi":"Bu şıkkı eleyen öğrenci, ticaret şirketleri için de bir hacim eşiği arandığını sanır."},"D":{"gercek":"Madde 177/6 hiçbir hacim şartı aramadan, sadece tercih beyanıyla birinci sınıfa geçirir.","ayirt":"Bu bentte bir tutar/had ifadesi var mı, yoksa sadece irade beyanı mı yeterli?","paragraf":"213 sayılı VUK m.177/6","yanilgi":"İhtiyari tercihin de hacim şartına bağlı olduğunu düşünürsün."},"B":{"gercek":"Madde 177/4 parantez hükmü adi şirketleri iştigal nevine göre ilgili bende tabi kılar, sabit sınıf yoktur.","ayirt":"Adi şirketin iştigal konusu hangi bende giriyor, hadler oradan mı kontrol edilmeli?","paragraf":"213 sayılı VUK m.177/4","yanilgi":"Adi şirketi tüzel kişiliği olan ticaret şirketiyle aynı kategoride görüp otomatik ikinci sınıf sayarsın."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}}];
// 06.09 seviye: ölçümden türer (bkz. kart kurulumu). k = sınıf anahtarı, ad = ekran adı (Nöbet dili: Isınma / Nöbet / Alarm), neden = ipucu.
function seviyeHesapla(s){
  const o=s.olcum||{}; const tip=s.tip||'teori'; const ders=String(s.ders||'');
  if(o.sim&&o.sim.dogru===false) return {k:'alarm',ad:'🔴 Alarm',neden:'Nöbetçi öğrencisi bu anlatımla ikizi çözemedi; dikkat ister'};
  if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

// 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}

   +(KUTU.kutu.length?KUTU.kutu.map(x=>{ const i=SORULAR.findIndex(s=>s.id===x.id); return '<div class="kutuSat"><div><b>'+esc(x.konu)+'</b> <span class="ipnot" style="display:inline">· '+(x.tur>=2?'2. tur (7 gün)':'1. tur (2 gün)')+' · '+gunStr(x.due)+'</span></div>'+(x.due<=t&&i>=0?'<button class="btn mavi kutuCoz" data-i="'+i+'">Şimdi çöz</button>':'')+'</div>'; }).join(''):'<p class="ipnot">Kutu boş. Yanlış yaptığın her soru buraya düşer ve 2 gün sonra geri gelir.</p>')
   +'<div class="btnrow" style="margin-top:14px"><button class="btn" id="kutuIleri">⏩ Demo: 2 gün ileri sar</button><button class="btn gri" id="kutuSifirla">Verileri sıfırla</button></div>'

  e.classList.add('acik');

  e.querySelector('#kutuSifirla').addEventListener('click',()=>{ if(confirm('Skor, kutu ve seri sıfırlansın mı?')){ KUTU.kayit=[]; KUTU.kutu=[]; KUTU.ileri=0; kutuKaydet(); location.reload(); } });
