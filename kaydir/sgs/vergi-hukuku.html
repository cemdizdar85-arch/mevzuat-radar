 m.2 5. fıkra arsa karşılığı inşaat hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"devamlılık taşıyan, kazanç amaçlı iktisadi faaliyet","ad":"ticari faaliyet","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"arsa payının konut/işyeri karşılığında müteahhide devredilmesi işlemi","ad":"arsa karşılığı inşaat","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"mal üzerindeki tasarruf hakkının alıcıya devredilmesi","ad":"teslim","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"vergiye tabi işlemi yapan, vergi ödemekle yükümlü kişi","ad":"mükellef","kim":"mükellef / işveren beyan eder"}],"sinavda":"Senaryoda kimin, hangi işlemi, ne amaçla yaptığı verilir; işlemin KDV konusuna girip girmediği ve kimin mükellef sayılacağı istenir.","panel_ornek":"Komşun Ayşe, oturduğu tek evi hobi olarak boyayıp 10 liraya sattı; bu ticari faaliyet sayılmaz. Ama aynı evi 5 kez alıp satarsa artık ticari faaliyet olur ve vergiye tabi olur.","ornek":"Komşun Ayşe, oturduğu tek evi hobi olarak boyayıp 10 liraya sattı; bu ticari faaliyet sayılmaz. Ama aynı evi 5 kez alıp satarsa artık ticari faaliyet olur ve vergiye tabi olur.","yontemler":"Önce işlemi yapanın ticari faaliyet yürütüp yürütmediğine bakılır, sonra arsa karşılığı inşaatta iki ayrı teslim (arsa payı ve daire) ayrı değerlendirilir.","nedir":"KDV, ticari/sınai/mesleki faaliyet kapsamında yapılan teslim ve hizmetleri vergiler. Sınav, bir işlemin bu kapsama girip girmediğini ve kimin mükellef olduğunu ölçer."},"olay":"Arsa sahibi bu devri tek seferlik ve ticari faaliyeti bulunmaksızın yaptığından işlem teslim sayılsa da vergiye tabi işlem şartını taşımaz; müteahhidin konut teslimi ise ticari faaliyeti çerçevesinde gerçekleştiğinden konuya girer.","tuzak":{"C":{"ad":"Gerekçe Karıştırma Tuzağı","metin":"Müteahhidin vergiye tabi olma sebebini trampa hükmüne bağlıyorsun, oysa trampa yalnız iki ayrı teslimin varlığını gösterir. Doğrusu: Müteahhidin teslimi ticari faaliyet çerçevesinde yapıldığı için vergiye tabidir, gerekçe trampa değil ticari faaliyettir."},"E":{"ad":"Kişi Statüsü Tuzağı","metin":"Gerçek kişi olmayı tek başına konudan çıkarma nedeni sanıyorsun. Doğrusu: Kanunun 1 inci maddesine göre işlemi yapanın hukuki statüsü vergilendirmeye engel değildir; müteahhidin teslimi yine de konuya girer, yalnız arsa sahibinin teslimi ticari faaliyet yokluğu nedeniyle girmez."},"D":{"ad":"Hüküm İnkarı Tuzağı","metin":"Kanunun 2 nci maddesindeki arsa karşılığı inşaata ilişkin açık ek cümleyi göz ardı ediyorsun. Doğrusu: 3/6/1986 ve 29/3/2018 değişiklikleriyle bu hal açıkça teslim sayılmıştır, teslim niteliği tartışmasızdır."},"A":{"ad":"Kapsam Genişletme Tuzağı","metin":"Kanunun 2 nci maddesinin teslim saymasını, otomatik olarak Kanunun 1 inci maddesindeki vergiye tabi olma şartıyla aynı sanıyorsun. Doğrusu: Teslim sayılma ile vergiye tabi olma ayrı şartlardır; arsa sahibinin işlemi ticari faaliyet çerçevesinde olmadığından konuya girmez."}},"celdiriciYol":{},"hap":"Arsa karşılığı inşaatta arsa sahibinin arsa payı devri Kanunun 2 nci maddesine göre teslim sayılır fakat ticari faaliyet çerçevesinde yapılmadıkça Kanunun 1 inci maddesine göre vergiye tabi olmaz.","teshis":{"C":{"gercek":"Trampa hükmü (m.2/5) yalnızca işlemin kaç ayrı teslim sayılacağını belirler; vergiye tabi olma nedeni Kanunun 1 inci maddesindeki ticari faaliyet şartıdır.","ayirt":"Bu işlemi vergiye tabi kılan şey teslim tanımı mı, yoksa faaliyetin niteliği mi?","paragraf":"3065 s.K. m.1/1","yanilgi":"Trampa hükmünü verginin konusuna girme nedeni sanıyorsun."},"E":{"gercek":"Kanunun 1 inci maddesinin son fıkrasına göre işlemi yapanın hukuki statüsü ve kişiliği vergilendirmeye mani değildir; müteahhidin teslimi ayrıca değerlendirilmelidir.","ayirt":"Konudan çıkan yalnızca arsa sahibinin işlemi mi, yoksa işlemin tamamı mı?","paragraf":"3065 s.K. m.1/son","yanilgi":"Gerçek kişi olmanın tek başına vergi dışı bırakacağını düşünüyorsun."},"A":{"gercek":"Kanunun 2 nci maddesi teslimin ne olduğunu tanımlar; Kanunun 1 inci maddesi ise hangi teslimlerin vergiye tabi olduğunu, yani ticari faaliyet şartını arar. İki madde ayrı işlev görür.","ayirt":"Bu işlem teslim mi, yoksa vergiye tabi teslim mi soruluyor, ikisini ayırdım mı?","paragraf":"3065 s.K. m.1/1, m.2/5","yanilgi":"Teslim sayılan her işlemin otomatik olarak vergiye tabi olduğunu düşünüyorsun."},"D":{"gercek":"7104 sayılı Kanunla eklenen cümle bu işlemi açıkça iki ayrı teslim olarak tanımlamıştır.","ayirt":"Kanun metninde bu duruma özgü açık bir hüküm var mı diye kontrol ettim mi?","paragraf":"3065 s.K. m.2/5 (7104/1 md. ek cümle)","yanilgi":"Arsa karşılığı inşaatın özel olarak düzenlenmediğini, dolayısıyla teslim sayılmayacağını düşünüyorsun."},"B":{"gercek":"Devamlılık ve ticari nitelik Gelir Vergisi Kanunu hükümlerine göre belirlenir; tek seferlik arsa devri arızi işlemdir, ticari faaliyet çerçevesine girmez.","ayirt":"Arsa sahibi bu işlemi mutat/devamlı olarak mı yapıyor, yoksa bir kez mi?","paragraf":"3065 s.K. m.1/son, m.2/5","yanilgi":"Bu şıkkı eleyen öğrenci, arsa sahibinin arızi işleminin de ticari faaliyet sayılabileceğini düşünüyor."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 115"},"kural":"213 sayılı Vergi Usul Kanununun mükerrer 49 üncü maddesine göre takdir komisyonlarının arsa ve araziye ait asgari ölçüde birim değer takdirleri, tarh ve tahakkuk işleminin yapılacağı sürenin başlangıcından en az altı ay önce karara bağlanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 115","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Söylenemez\u0027 sorularında her şıkkı kaynaktaki sayı ve süre ifadeleriyle tek tek karşılaştır; en sıradan görünen şık genelde değiştirilen rakamı taşır.","konu":"emlak vergisi-bina vergisi","tablo":{"satirlar":[["A) Bina metrekare normal inşaat maliyet bedelleri, Maliye B…","mük.m.49/a","doğru ifade"],["B) Bina metrekare normal inşaat maliyet bedellerine karşı T…","mük.m.49/a","doğru ifade"],["C) Arsalara ve araziye ait asgari ölçüde birim değer takdir…","mük.m.49/b","doğru ifade"],["D) Arsalara ait asgari ölçüde birim değer takdirleri, ilgil…","m.74/b","doğru ifade"],["E) Arsalara ve araziye ait asgari ölçüde birim değer takdir…","mük.m.49/b","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Arsalara ve araziye ait asgari ölçüde birim değer takdirleri, ilgili takdir komisyonlarınca dört yılda bir yapılır.","E":"Arsalara ve araziye ait asgari ölçüde birim değer takdirleri, tarh ve tahakkuk işleminin yapılacağı sürenin başlangıcından en az bir yıl önce karara bağlanır.","A":"Bina metrekare normal inşaat maliyet bedelleri, Maliye Bakanlığı ile Bayındırlık ve İskan Bakanlığınca müştereken tespit edilip uygulanacağı yıldan dört ay önce Resmî Gazete ile ilan edilir.","D":"Arsalara ait asgari ölçüde birim değer takdirleri, ilgili il ve ilçe merkezlerindeki ticaret odalarına, mahalle ve köy muhtarlıklarına ve belediyelere imza karşılığında verilir.","B":"Bina metrekare normal inşaat maliyet bedellerine karşı Türkiye Ticaret, Sanayi, Deniz Ticaret Odaları ve Ticaret Borsaları Birliği, ilanı izleyen on beş gün içinde Danıştayda dava açabilir."},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.45 - Emlak Vergisine Ait Bedel ve Değerlerin Tespiti9 Ölçüler ve tarifleri","metin":"Emlak Vergisine Ait Bedel ve Değerlerin Tespiti9 Ölçüler ve tarifleri: Madde 45 – Zirai kazanç ölçüleri, yıllık istihsal değeri, götürü gider emsali, ortalama randıman miktarı, ortalama işçilik tutarı, ortalama maliyet bedeli ile ortalama satış fiyatından terekküp eder. 1. Yıllık istihsal değeri: Ortalama randıman ve ortalama satış fiyatı ölçülerine göre her ziraat biriminden bir yılda elde edileceği hesaplanan mahsul değerinin işletmede veya işletmelerde mevcut ziraat birimi sayıları ile çarpılması suretiyle bulunacak değerlerin toplamıdır. 2. (Değişik: 23/6/1982-2686/10 md.) Götürü gider emsali: Büyük ve küçükbaş hayvanlar (kümes hayvanları dahil) ve bunların mahsulleri ile kara ve su avcılığı için % 80; diğer zirai mahsuller ile ziraat makine ve aletleriyle başka çiftçilerin zirai istihsal işlerinin yapılması karşılığında alınan ücretler için % 70\u0027tir. 3. Ortalama randıman miktarı: Ziraat birimlerinin her bir çeşidinden elde edileceği tahmin olunan ortalama mahsul miktarıdır. 4. Ortalama işçilik tutarı: Ziraat birimlerinin her bir çeşidine isabet eden ortalama işçilik gideri tutarıdır. 5. Ortalama maliyet bedeli: Ziraat birimi başına elde edilecek mahsul için yapılması gereken ortalama giderlerin toplamıdır. 6. Ortalama satış fiyatı: Zirai mahsullerin ticari teamüle göre beher satış biriminin 46 ncı maddenin (d) bendi esasları dairesinde tesbit olunan satış fiyatıdır. Zirai kazanç ölçülerinin tespiti: Bu bölüm başlığı 23/6/1982 tarihli ve 2686 sayılı Kanunun 9 uncu maddesi ile metne işlendiği şekilde değiştirilmiştir. 9"},{"ad":"VUK (213 s.K.) muk. m.49 - Emlak vergisine ait bedel ve değerlerin tespiti, ilanı ve kesinleşmesi [1/2]","metin":"Emlak vergisine ait bedel ve değerlerin tespiti, ilanı ve kesinleşmesi: Mükerrer Madde 49 – (Değişik: 3/4/2002-4751/1 md.) a) Maliye ve Bayındırlık ve İskan bakanlıkları 1319 sayılı Emlâk Vergisi Kanununun 29 uncu maddesi hükmü ile aynı Kanunun 31 inci maddesi uyarınca hazırlanan yönetmelik hükümlerine göre bina metrekare normal inşaat maliyet bedellerini, uygulanacağı yıldan dört ay önce müştereken tespit ve Resmî Gazete ile ilân eder.12 Türkiye Ticaret, Sanayi, Deniz Ticaret Odaları ve Ticaret Borsaları Birliği bu bedellere karşı Resmî Gazete ile ilânını izleyen onbeş gün içinde Danıştayda dava açabilir. b) Takdir komisyonlarının arsalara ve araziye ait asgari ölçüde birim değer tespitine ilişkin dört yılda bir yapacakları takdirler, tarh ve tahakkuk işleminin (Emlâk Vergisi Kanununun 33 üncü maddesinin (8) numaralı fıkrasına göre yapılacak takdirler dahil) yapılacağı sürenin başlangıcından en az altı ay önce karara bağlanarak, arsalara ait olanlar takdirin ilgili bulunduğu il ve ilçe merkezlerindeki ticaret odalarına, ziraat odalarına ve ilgili 2/7/2018 tarihli ve 700 sayılı KHK’nin 46 ncı maddesiyle, bu fıkrada yer alan “Bakanlar Kurulunun onayı” ibaresi “Cumhurbaşkanı kararı” şeklinde değiştirilmiştir. 11 2/1/1997 tarihli ve 97/9218 sayılı Bakanlar Kurulu Kararı ile 1996, 1997 ve 1998 yılları için tespit edilen 79 il\u0027e ait zirai kazanç ölçüleri 12/4/1997 tarihli ve 22962 (Mükerrer) sayılı Resmî Gazete’de yayımlanmıştır. 12 2/7/2018 tarihli ve 700 sayılı KHK’nin 46 ncı maddesiyle, bu fıkrada yer alan “tüzük” ibaresi “yönetmelik” şeklinde değiştirilmiştir. 10 mahalle ve …"}],"hakem":"Doğru sık (E), VUK m.49/b\u0027de yer alan \u0027en az altı ay önce\u0027 kuralına karşı \u0027en az bir yıl önce\u0027 diyerek yanlış bir ifade sunmakta; bu ifadenin söylenemeyeceği kaynaktan açıkça desteklenmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"1319 sayılı Emlak Vergisi Kanunu uyarınca bina metrekare normal inşaat maliyet bedelleri ile arsa ve araziye ait asgari ölçüde birim değer tespiti sürecine ilişkin olarak aşağıdakilerden hangisi söylenemez?","kayitBaslik":"","id":"sgs-t1-vergi-cokzor/kp-27","verilenler":[],"dayanak":"213 sayılı Vergi Usul Kanunu mükerrer m.49/a-b ve m.74/b","dogru":"E","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: Ordu Belediyesi 2023 yılı takdiri için ilgili takdir komisyonu, arsa birim değerlerini 2024 vergilendirme döneminin başlamasından tam 7 ay önce, 2023 Haziran ayında karara bağlıyor.","anlatim":"Komisyon üyeleri bu erken karar tarihini yeterli görüyor. Şimdi bu olaydaki her rakamı ve kararı kanundaki beş ifadeyle tek tek karşılaştıracağız.","doldur":[]},{"formul":"Ne yapacağız: Kanun iki ayrı süreç kuruyor; bina maliyet bedeli bakanlıklarca dört ay önce ilan edilir, arsa-arazi birim değeri ise takdir komisyonunca dört yılda bir ve en az altı ay önce karara bağlanır.","anlatim":"Ordu\u0027daki komisyon yedi ay önce karar almış, bu kuralın neresine düşüyor bakacağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"mük.m.49/a","karar":"doğru","anlatim":"Hayır, o bedeli Maliye ile Bayındırlık ve İskan bakanlıkları müştereken tespit eder, dört ay önce Resmî Gazete ile ilan eder. Komisyonun burada hiç işi yok.","formul":"Şık A: birisi \u0027bina metrekare maliyet bedelini de bu takdir komisyonu belirledi\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"mük.m.49/a","karar":"doğru","anlatim":"Hayır, dava hakkı yalnız Türkiye Ticaret, Sanayi, Deniz Ticaret Odaları ve Ticaret Borsaları Birliğine ait, süre ilanı izleyen on beş gün ve yer Danıştaydır.","formul":"Şık B: Ordu\u0027daki bir esnaf \u0027bu bedele ben de dava açarım\u0027 diyor, mümkün mü?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"mük.m.49/b","karar":"doğru","anlatim":"Evet haklı, arsa ve araziye ait asgari birim değer takdirleri dört yılda bir yapılır. Ordu\u0027daki komisyon da bu döngüye göre çalışıyor.","formul":"Şık C: komisyon üyesi \u0027bu takdiri her yıl yenilememiz gerekmiyor, dört yılda bir yeter\u0027 diyor, haklı mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.74/b","karar":"doğru","anlatim":"Hayır, arsa takdirleri ilgili il-ilçe ticaret odalarına, mahalle-köy muhtarlıklarına ve belediyelere imza karşılığı verilmek zorunda. Ordu komisyonu bu adımı atlarsa hata yapmış olur.","formul":"Şık D: komisyon kararını yalnız belediyeye gönderiyor, ticaret odasına ve muhtarlığa vermiyor, bu yeterli mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"mük.m.49/b","karar":"yanlış","anlatim":"Hayır, kanun bir yıl demiyor, en az altı ay diyor. Yedi ay önceden karar almak zaten altı aylık asgari süreyi karşılıyor, ama gerekçedeki \u0027bir yıl\u0027 ifadesi kanuna aykırı.","formul":"Şık E: Ordu\u0027daki komisyon \u0027biz yedi ay önce karar aldık, kanun bir yıl öncesini istiyor zaten fazlasını yaptık\u0027 diyor, bu yorum doğru mu?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Ordu\u0027daki komisyon aslında sadece altı aylık asgari süreyi sağlamak zorunda, bir yıl diye bir zorunluluk yok. Kendine hep şunu sor: kanun metninde geçen süre tam olarak kaç aydır, altı mı bir yıl mı?","doldur":[]}],"anahtar":[{"ornek":"komisyonlarının","kok":"komisy"},{"ornek":"takdirleri","kok":"takdir"},{"ornek":"asgari","kok":"asgari"},{"ornek":"ticaret","kok":"ticare"},{"ornek":"karşılaştıracağız","kok":"karşıl"},{"ornek":"araziye","kok":"araziy"}],"konuGiris":{"harita":"Bina metrekare maliyet bedeli ne zaman tespit edilir: uygulama yılından dört ay önce Maliye ve Bayındırlık bakanlıklarınca birlikte belirlenir. Arsa/arazi asgari birim değeri nasıl ölçülür: takdir komisyonları tarafından dört yılda bir mahalle, sokak veya bölge bazında takdir edilir. Nasıl kaydedilir: her iki değer de Resmî Gazete ile ilan edilerek kesinleşir.","desen":"Sınav, bina maliyet bedelinin kim tarafından ve ne zaman tespit edildiğini arsa/arazi değerinin tespit süresiyle karıştırtarak sorar; bina bedeli dört ay önce, arsa/arazi değeri dört yılda bir belirlenir. Ayrıca hangi kurumun (bakanlıklar mı, takdir komisyonu mu) yetkili olduğu şıklarda değiştirilerek tuzak kurulur. Bu soru mük. m.49 ve m.74(b-c) noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Binanın metrekaresi için bakanlıkların belirlediği resmi maliyet tutarı","ad":"Bina metrekare normal inşaat maliyet bedeli","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Arsa ve arazinin metrekaresi için takdir komisyonunca belirlenen en düşük değer","ad":"Asgari ölçüde birim değer","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Arsa ve arazi değerlerini mahalle/bölge bazında dört yılda bir belirleyen idari kurul","ad":"Takdir komisyonu","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Belirlenen değerlerin Resmî Gazete ile duyurulup itiraz süresiyle kesinleşmesi süreci","ad":"İlan ve kesinleşme","kim":"kanun sabitler"}],"sinavda":"Soruda bina, arsa ve araziye ait değer tespit sürecine dair birkaç ifade verilir, yanlış/söylenemez olanı seçmen istenir.","panel_ornek":"Bir mahallede belediye, yeni yapılacak kaldırımlar için önce her sokağın metrekare fiyatını resmi olarak belirler, sonra bu fiyat oradaki herkes için 4 yıl geçerli olur. Sen kendi arsan için farklı bir fiyat teklif edemezsin, listeye bakarsın.","ornek":"Bir mahallede belediye, yeni yapılacak kaldırımlar için önce her sokağın metrekare fiyatını resmi olarak belirler, sonra bu fiyat oradaki herkes için 4 yıl geçerli olur. Sen kendi arsan için farklı bir fiyat teklif edemezsin, listeye bakarsın.","yontemler":"Bina maliyet bedeli ile arsa/arazi asgari değerinin tespit süresini (4 ay-4 yıl) ve yetkili kurumu (bakanlıklar-takdir komisyonu) birbirine karıştırmamak temel kuraldır.","nedir":"Emlak vergisi, bina/arsa/arazi gibi gayrimenkullerin vergi değeri üzerinden alınan bir servet vergisidir. Sınav, bu değerlerin kim tarafından ve hangi usulle tespit edildiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Zamanlama Tuzağı","metin":"Arsa-arazi birim değer takdirlerinin her yıl yenilendiğini düşünüp dört yıl ifadesini yanlış sanırsın. Doğrusu: 213 sayılı Vergi Usul Kanununun mükerrer 49 üncü maddesi uyarınca bu takdirler dört yılda bir yapılır, ifade doğrudur."},"A":{"ad":"Görev Karışıklığı Tuzağı","metin":"Bina metrekare maliyet bedeli tespitini takdir komisyonunun görevi sanıp bu cümleyi yanlış işaretlersin. Doğrusu: Bu tespit 213 sayılı Vergi Usul Kanununun mükerrer 49 üncü maddesi uyarınca Maliye ile Bayındırlık ve İskan bakanlıklarınca yapılır ve ifade doğrudur."},"D":{"ad":"Muhatap Karışıklığı Tuzağı","metin":"Arsa takdirlerinin yalnız belediyeye bildirildiğini sanıp muhtarlık ve oda bilgisini yanlış sayarsın. Doğrusu: 213 sayılı Vergi Usul Kanununun 74 üncü maddesi uyarınca bu takdirler ticaret odalarına, muhtarlıklara ve belediyelere imza karşılığı verilir, ifade doğrudur."},"B":{"ad":"Yetki-Süre Tuzağı","metin":"Bina metrekare maliyet bedellerine karşı dava hakkını mükellefin vergi dairesine itirazıyla karıştırıp cümleyi yanlış sanırsın. Doğrusu: Dava hakkı yalnız ilgili odalar-borsalar birliğine aittir ve on beş günlük süreyle Danıştayda kullanılır, ifade doğrudur."}},"celdiriciYol":{"C":"Yakın-şık: dört yıllık takdir süresi ile yıllık ilan süresi (dört ay) karıştırılır (zamanlama karışıklığı).","A":"Yakın-şık: bakanlık görevi ile takdir komisyonu görevi (m.74) aynı paragraf ailesinden karıştırılır (görev karışıklığı).","D":"Yakın-şık: bildirim mercileri eksik sayılarak yalnız belediye anılır (kapsam eksikliği).","B":"Yakın-şık: dava süresi ve mercii, itiraz-şikayet yolu ile karıştırılır (yetki karışıklığı)."},"hap":"Arsa ve araziye ait asgari birim değer takdirleri, tarh-tahakkuk döneminin başlangıcından en az altı ay önce karara bağlanır.","teshis":{"C":{"gercek":"Bu takdirler dört yılda bir yapılır.","ayirt":"Bu takdir kaç yılda bir tekrarlanıyor?","paragraf":"mük.m.49/b","yanilgi":"Arsa-arazi birim değer takdirlerinin yıllık yenilendiğini sanıyorsun."},"E":{"gercek":"Kanun süreyi açıkça en az altı ay olarak belirler; bir yıl ifadesi kanun metnine aykırıdır.","ayirt":"Kanun metninde geçen süre tam olarak kaç aydır?","paragraf":"mük.m.49/b","yanilgi":"Altı ay ile bir yıl arasındaki süre farkını önemsiz sanıp bu ifadeyi de doğru kabul ediyorsun."},"A":{"gercek":"Bu bedelleri Maliye ile Bayındırlık ve İskan bakanlıkları müştereken tespit eder.","ayirt":"Bu değeri belirleyen özne bakanlık mı yoksa komisyon mu?","paragraf":"mük.m.49/a","yanilgi":"Bina metrekare maliyet bedelini de takdir komisyonunun belirlediğini sanıyorsun."},"D":{"gercek":"Arsa takdirleri il-ilçe ticaret/ziraat odalarına, mahalle-köy muhtarlıklarına ve belediyelere imza karşılığı verilir.","ayirt":"Bu bildirim hangi mercilere yapılıyor?","paragraf":"m.74/b","yanilgi":"Arsa takdirinin yalnız belediyeye bildirildiğini, oda ve muhtarlık bilgisinin gerekmediğini sanıyorsun."},"B":{"gercek":"Dava hakkı yalnız ilgili odalar-borsalar birliğine aittir, süre on beş gün, yargı yeri Danıştaydır.","ayirt":"Bu davayı kim, nerede, kaç günde açabilir?","paragraf":"mük.m.49/a","yanilgi":"Dava hakkının bizzat mükellefe ait olduğunu ve davanın vergi mahkemesinde açıldığını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 116"},"kural":"Gelir Vergisi Kanununun 65 inci maddesine göre serbest meslek faaliyeti, sermayeden ziyade şahsi mesaiye, ilmi veya mesleki bilgiye dayanan, ticari mahiyette olmayan ve işverene tabi olmaksızın kendi nam ve hesabına yürütülen faaliyettir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 116","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İşverene tabilik, sermaye unsuru ve ticari mahiyet ifadelerini gördüğünde o kazancı serbest meslek kazancından hemen çıkar.","konu":"serbest meslek kazancı","tablo":{"satirlar":[["A) İşverene tabi olarak bir şirkette hukuk müşavirliği yapa…","m.65","YANLIŞ ifade"],["B) Bir sermaye şirketine ortak olan mühendisin bu ortaklıkt…","m.65","YANLIŞ ifade"],["C) Kendi muayenehanesinde işverene tabi olmaksızın, kendi n…","m.65","doğru ifade"],["D) Kendi nam ve hesabına eşya taşımacılığı yapan bir kişini…","m.65","YANLIŞ ifade"],["E) Adi ortaklık şeklinde serbest meslek faaliyeti yürüten m…","m.65 son fıkra","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kendi muayenehanesinde işverene tabi olmaksızın, kendi nam ve hesabına hastalarını tedavi eden doktorun elde ettiği kazanç","E":"Adi ortaklık şeklinde serbest meslek faaliyeti yürüten mimarların, ortaklığın tüzel kişiliği bulunmaması nedeniyle elde ettiği kazancın ticari kazanç sayılması","A":"İşverene tabi olarak bir şirkette hukuk müşavirliği yapan avukatın elde ettiği ücret geliri","D":"Kendi nam ve hesabına eşya taşımacılığı yapan bir kişinin bu faaliyetten elde ettiği kazanç","B":"Bir sermaye şirketine ortak olan mühendisin bu ortaklıktan elde ettiği kar payı"},"kaynak":{"alinti":"","liste":[{"ad":"GVK (193 s.K.) m.65 - RDÜNCÜ BÖLÜM Serbest Meslek Kazançları Serbest meslek kazancının tarifi","metin":"RDÜNCÜ BÖLÜM Serbest Meslek Kazançları Serbest meslek kazancının tarifi: Madde 65 – (Değişik: 19/2/1963-202/31 md.) Her türlü serbest meslek faaliyetinden doğan kazançlar serbest meslek kazancıdır. Serbest meslek faaliyeti; sermayeden ziyade şahsi mesaiye ilmi veya mesleki bilgiye veya ihtısasa dayanan ve ticari mahiyette olmıyan işlerin iş verene tabi olmaksızın şahsi sorumluluk altında kendi nam ve hesabına yapılmasıdır. Tahkim işleri dolayısiyle hakemlerin aldıkları ücretler ile kollektif, adi komandit ve adi şirketler tarafından yapılan serbest meslek faaliyeti neticesinde doğan kazançlar da, serbest meslek kazancıdır."}],"hakem":"Doktor tarafından kendi muayenehanesinde, işverene tabi olmaksızın, kendi nam ve hesabına yapılan tedavi faaliyeti, GVK m.65\u0027te tanımlanan serbest meslek faaliyetinin tüm unsurlarını (şahsi mesai, mesleki bilgi, işverene tabi olmaksızın, kendi nam ve hesabına) karşılamaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[{"yil":"2025/3","alinti":"193 sayılı Gelir Vergisi Kanunu’na göre yukarıdakilerden hangileri serbest meslek kazancıdır?"},{"yil":"2019/2","alinti":"hangisi serbest meslek kazancı sayılmaz?"},{"yil":"2015/2","alinti":"193 sayılı Gelir Vergisi Kanunu’na göre, serbest meslek kazançlarına ilişkin aşağıdakilerden hangisi yanlıştır?"}],"donemler":["2025/3","2019/2","2015/2"]},"oyun":null,"tip":"teori","soru":"Gelir Vergisi Kanununun serbest meslek kazancına ilişkin tarifine göre aşağıdaki durumlardan hangisinde elde edilen kazanç serbest meslek kazancıdır?","kayitBaslik":"","id":"sgs-t1-vergi-kolay/kp-03","verilenler":[],"dayanak":"193 sayılı Gelir Vergisi Kanunu m.65","dogru":"C","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da diş hekimi Ayşe Hanım, 3 Ocak\u0027ta kendi muayenehanesini açıyor. Kimseye bağlı değil, hastalarından kendi adına ücret alıyor. Ay sonunda 45.000 TL kazanıyor.","anlatim":"Ayşe kimseye bağlı değil, sermayesi değil bilgisi çalışıyor. Bu tablo bize m.65\u0027in tam sınırını gösterecek.","doldur":[]},{"formul":"Ne yapacağız: m.65\u0027e göre kazanç serbest meslek kazancı sayılır, eğer şahsi mesaiye/mesleki bilgiye dayanır, ticari değildir ve işverene tabi olmaksızın kendi nam-hesabına yapılırsa. Şimdi beş ifadeyi Ayşe\u0027nin ve benzer kişilerin olayında tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.65","karar":"yanlış","anlatim":"Bu avukat bir işverene bağlı, emir altında çalışıyor. Madde 65 işverene tabi olmamayı şart koşuyor, o yüzden bu ücret serbest meslek kazancı değildir.","formul":"Şık A: Ayşe yerine bir şirkette maaşlı çalışan hukuk müşaviri avukatı düşün, onun ücreti serbest meslek kazancı mıdır?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.65","karar":"yanlış","anlatim":"Kâr payı sermayenin getirisi, mühendisin şahsi mesaisinin değil. Madde 65 sermayeden ziyade mesaiye dayanmayı arar, bu yüzden kâr payı burada uymaz.","formul":"Şık B: Mühendisin bir şirkete ortak olup aldığı kâr payını düşün, bu serbest meslek kazancı mıdır?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.65","karar":"doğru","anlatim":"Ayşe işverene tabi değil, kendi nam ve hesabına, mesleki bilgisiyle çalışıyor. Madde 65\u0027in tarifi tam bu duruma denk düşüyor, yani evet serbest meslek kazancıdır.","formul":"Şık C: Ayşe\u0027nin muayenehanesindeki kazancı serbest meslek kazancı mıdır?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.65","karar":"yanlış","anlatim":"Taşımacılık ticari bir organizasyon işi, mesleki bilgiye değil araç ve sermayeye dayanıyor. Madde 65 ticari mahiyette olmamayı şart koştuğu için bu kazanç uymaz.","formul":"Şık D: Kendi kamyonuyla eşya taşıyan bir kişinin kazancını düşün, bu serbest meslek kazancı mıdır?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.65 son fıkra","karar":"yanlış","anlatim":"Kanun açıkça adi şirketler eliyle yapılan serbest meslek faaliyetinin de serbest meslek kazancı olduğunu söylüyor. Tüzel kişilik yokluğu bu sonucu değiştirmez, o yüzden bu ifade yanlıştır.","formul":"Şık E: Adi ortaklık kuran mimarların kazancının, tüzel kişilik yok diye ticari kazanç sayılacağını düşün, doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Serbest meslek kazancının anahtarı bağımsızlık, mesleki bilgi ve ticari olmama üçlüsüdür. Kendine hep şunu sor: bu kişi bir işverene bağlı mı, yoksa kendi nam ve hesabına mı çalışıyor?","doldur":[]}],"anahtar":[{"ornek":"meslek","kok":"meslek"},{"ornek":"serbest","kok":"serbes"},{"ornek":"kazancı","kok":"kazanc"},{"ornek":"işverene","kok":"işvere"},{"ornek":"sermayeden","kok":"sermay"},{"ornek":"ticari","kok":"ticari"}],"konuGiris":{"harita":"Ne zaman test edilir: bir kazancın serbest meslek kazancı sayılıp sayılmayacağı belirlenirken test edilir. Nasıl ölçülür: faaliyetin şahsi mesaiye, mesleki bilgiye dayanması ve işverene bağlı olmadan kendi nam ve hesabına yapılması ile ölçülür. Nasıl kaydedilir: kanun maddesindeki tanıma uyup uymadığına göre serbest meslek kazancı olarak nitelendirilir.","desen":"Sorular genelde birden fazla seçenek sunar, öğrenci hangisinin \u0027işverene bağlı olmama\u0027 ve \u0027sermayeden çok emek\u0027 unsurlarını taşıdığını ayırt etmelidir. Tuzak, ticari faaliyet ile serbest meslek faaliyetinin karıştırılmasıdır çünkü ikisi de bağımsız yapılabilir ama biri sermayeye biri emeğe dayanır. Bu soru Gelir Vergisi Kanunu m.65\u0027teki serbest meslek kazancı tarifinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"kişinin kendi emeği ve çalışmasıyla ürettiği faaliyet","ad":"şahsi mesai","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işverene bağlı olmadan bağımsız biçimde iş yapma durumu","ad":"kendi nam ve hesabına çalışma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"faaliyetin sermaye unsuru ağır basan ticari iş olmaması özelliği","ad":"ticari mahiyette olmama","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"faaliyetin sonuçlarından bizzat kişinin kendisinin sorumlu olması","ad":"şahsi sorumluluk","kim":"kanun sabitler"}],"sinavda":"Soruda birkaç farklı kazanç durumu verilir, hangisinin serbest meslek kazancı tanımına uyduğu istenir.","panel_ornek":"Bir arkadaşın kendi adına küçük bir grafik tasarım işi yapıyor, ayda 3 farklı müşteriye hizmet veriyor ve kimseye bağlı çalışmıyor. Aldığı 5 bin liralık ücret tamamen kendi mesleki bilgisine dayanıyor, bir işverene bağlı değil. Bu durum ona \u0027serbest\u0027 çalışma hissi veriyor çünkü kendi nam ve hesabına iş yapıyor.","ornek":"Bir arkadaşın kendi adına küçük bir grafik tasarım işi yapıyor, ayda 3 farklı müşteriye hizmet veriyor ve kimseye bağlı çalışmıyor. Aldığı 5 bin liralık ücret tamamen kendi mesleki bilgisine dayanıyor, bir işverene bağlı değil. Bu durum ona \u0027serbest\u0027 çalışma hissi veriyor çünkü kendi nam ve hesabına iş yapıyor.","yontemler":"Tek yöntem, verilen durumu kanun maddesindeki dört unsurla (şahsi mesai, ticari olmama, bağımsızlık, şahsi sorumluluk) tek tek karşılaştırmaktır; en kritik kural işverene bağlı olmamasıdır.","nedir":"Serbest meslek kazancı, kişinin sermayesinden çok kendi bilgi ve emeğine dayanan faaliyetten elde ettiği kazançtır. Sınav, bu faaliyetin hangi şartları taşıması gerektiğini ölçer."},"olay":"Doktorun bağımsız, kendi nam ve hesabına, mesleki bilgisine dayalı faaliyeti bu tanıma birebir uyar.","tuzak":{"D":{"ad":"Ticari Mahiyet Tuzağı","metin":"Kendi nam ve hesabına yapılan her faaliyetin serbest meslek kazancı sayılacağı düşünülür. Doğrusu: Taşımacılık ticari mahiyette bir iş olduğundan bu kazanç ticari kazançtır, serbest meslek kazancı değildir."},"E":{"ad":"Adi Şirket Tuzağı","metin":"Adi ortaklığın tüzel kişiliği bulunmadığı için kazancın ticari kazanca dönüştüğü düşünülür. Doğrusu: Kanun, adi şirketler tarafından yapılan serbest meslek faaliyeti neticesinde doğan kazancı da açıkça serbest meslek kazancı saymıştır, ticari kazanç sayılmaz."},"A":{"ad":"İşverene Tabilik Tuzağı","metin":"Avukatlık mesleği serbest meslek faaliyeti olsa da işverene tabi çalışıldığında bağımlılık unsuru doğar. Doğrusu: Bu gelir ücret sayılır, serbest meslek kazancı değildir."},"B":{"ad":"Sermaye Unsuru Tuzağı","metin":"Şirket ortaklığından doğan kâr payı, şahsi mesaiye değil sermayeye dayanır. Doğrusu: Bu gelir menkul sermaye iradıdır, serbest meslek kazancı değildir."}},"celdiriciYol":null,"hap":"Serbest meslek kazancı, sermayeden değil şahsi mesai ve mesleki bilgiden doğan, işverene tabi olmaksızın kendi nam ve hesabına yürütülen ticari mahiyette olmayan faaliyetin kazancıdır.","teshis":{"C":{"gercek":"Madde 65, şahsi mesaiye, mesleki bilgiye dayanan ve ticari mahiyette olmayan, işverene tabi olmaksızın kendi nam ve hesabına yürütülen faaliyeti serbest meslek faaliyeti sayar.","ayirt":"Faaliyet sermaye mi emek mi ağırlıklı, bağımsız mı yürütülüyor?","paragraf":"193 sayılı Gelir Vergisi Kanunu m.65","yanilgi":"Bu şıkkı elerken, bağımsız mesleki faaliyetin de ticari bir iş gibi görülebileceğini düşünüyorsun."},"E":{"gercek":"Madde 65, kollektif, adi komandit ve adi şirketler tarafından yapılan serbest meslek faaliyetinden doğan kazancın da serbest meslek kazancı olduğunu açıkça belirtir.","ayirt":"Kanun bu ortaklık türü için özel bir hüküm koymuş mu?","paragraf":"193 sayılı Gelir Vergisi Kanunu m.65","yanilgi":"Tüzel kişiliği olmayan bir ortaklığın işlerinin otomatik olarak ticari kazanç sayılacağını düşünüyorsun."},"A":{"gercek":"Madde 65, faaliyetin işverene tabi olmaksızın kendi nam ve hesabına yapılmasını şart koşar; bağımlı çalışma ücret ilişkisidir.","ayirt":"Bu kişi bir işverene bağlı mı çalışıyor, yoksa kendi hesabına mı çalışıyor?","paragraf":"193 sayılı Gelir Vergisi Kanunu m.65","yanilgi":"Serbest meslek mesleği icra eden herkesin kazancını, çalışma biçimine bakmadan serbest meslek kazancı sayıyorsun."},"D":{"gercek":"Madde 65 açıkça faaliyetin ticari mahiyette olmamasını arar; taşımacılık ticari faaliyettir.","ayirt":"Bu iş şahsi mesleki bilgiye mi, yoksa ticari bir organizasyona mı dayanıyor?","paragraf":"193 sayılı Gelir Vergisi Kanunu m.65","yanilgi":"Bağımsız ve kendi nam-hesabına yapılan her işi serbest meslek faaliyeti sanıyorsun."},"B":{"gercek":"Madde 65 kazancın şahsi mesaiye dayanmasını arar; ortaklıktan doğan kâr payı sermayenin getirisidir.","ayirt":"Bu gelir emeğimden mi, yoksa sermayemden mi doğuyor?","paragraf":"193 sayılı Gelir Vergisi Kanunu m.65","yanilgi":"Meslek sahibinin herhangi bir gelirini otomatik olarak mesleki kazanç sayıyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 116"},"kural":"213 sayılı Vergi Usul Kanununun 128 inci maddesi yoklamaya yetkilileri vergi dairesi müdürleri, yoklama memurları, yetkili makamlarca görevlendirilenler ve vergi incelemesine yetkili olanlar olarak dört bentte sayar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 116","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Hangisi değildir sorularında önce kanunda sayılan bentleri tek tek işaretle, geriye kalan tek şık cevaptır.","konu":"vergi tarhi on işlemleri","tablo":{"satirlar":[["VERİLENLER","-","-"],["Vergi Usul Kanununun madde numarası","128","-"],["HESAP","-","-"],["A) Vergi dairesi müdürleri","m.128/1","doğru ifade"],["B) Yoklama memurları","m.128/2","doğru ifade"],["C) Yetkili makamlarca yoklama işiyle görevlendirilenler","m.128/3","doğru ifade"],["D) Vergi incelemesine yetkili olanlar","m.128/4","doğru ifade"],["E) Tahsil dairesi tahsildarları","m.128","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yetkili makamlarca yoklama işiyle görevlendirilenler","E":"Tahsil dairesi tahsildarları","A":"Vergi dairesi müdürleri","D":"Vergi incelemesine yetkili olanlar","B":"Yoklama memurları"},"kaynak":{"alinti":"Tahsil dairesi tahsildarları","liste":[{"ad":"VUK (213 s.K.) m.128 - Cumhurbaşkanınca belirlenir.32 Yoklamaya yetkililer","metin":"Cumhurbaşkanınca belirlenir.32 Yoklamaya yetkililer: Madde 128 – Yoklama: 1. Vergi dairesi müdürleri; 2. Yoklama memurları; 3. Yetkili makamlar tarafından yoklama işi ile görevlendirilenler; 4. Vergi incelenmesine yetkili olanlar; 5. (Ek: 5/5/2005-5345/34 md.)"}],"hakem":"Doğru sık (E) \u0027Tahsil dairesi tahsildarları\u0027, VUK m.128\u0027de sayılan dört yetkiliye arasında yer almadığı için hukuka uygundur."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"213 sayılı Vergi Usul Kanununun 128 inci maddesine göre, vergi tarhına esas olacak yoklamayı yapmaya aşağıdakilerden hangisi yetkili değildir?","kayitBaslik":"","id":"sgs-t1-vergi-kolay/kp-08","verilenler":[{"deger":"128","anlam":"Vergi tarhına esas yoklamayı yapacak yetkili kişi ve kurumları tanımlayan kanun maddesinin numarası.","ad":"Vergi Usul Kanununun madde numarası"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.128","dogru":"E","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: Bir küçük market işletmecisi olan Kemal Bey\u0027in dükkânına 14 Mart günü dört farklı kamu görevlisi geliyor: biri vergi dairesi müdürü, biri yoklama memuru, biri il defterdarlığınca özel görevlendirilmiş biri, biri de vergi müfettişi.","anlatim":"Bunların hepsi kapıda \u0027ben yoklama yapmaya yetkiliyim\u0027 diyor. Kemal Bey kafası karışık, kimin gerçekten yetkili olduğunu bilmiyor.","doldur":[]},{"formul":"Ne yapacağız: 213 sayılı Vergi Usul Kanununun 128 inci maddesi yoklamaya yetkilileri dört bentte tek tek sayıyor.","anlatim":"Kemal Bey\u0027in kapısına gelen her kişiyi bu dört bentle karşılaştıracağız. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.128/1","karar":"doğru","anlatim":"Evet verirsin, çünkü kanun onu birinci sırada sayıyor. Vergi dairesi müdürü madde 128\u0027in ilk bendinde açıkça yer alıyor.","formul":"Şık A: kapıdaki vergi dairesi müdürü \u0027ben yoklama yapabilirim\u0027 diyor, ona izin verir misin?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.128/2","karar":"doğru","anlatim":"Haklı, çünkü kanun bu unvanı kendi ismiyle sayıyor. Yoklama memurları madde 128\u0027in ikinci bendinde.","formul":"Şık B: kapıdaki yoklama memuru \u0027benim zaten unvanım bu, elbette yetkiliyim\u0027 diyor, haklı mı?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.128/3","karar":"doğru","anlatim":"Girebilir, çünkü yetkili makamca görevlendirilenler de sayılmış. Bu üçüncü bentte açıkça yazıyor.","formul":"Şık C: defterdarlığın özel görevlendirdiği kişi \u0027bana yazıyla görev verildi\u0027 diyor, dükkâna girebilir mi?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.128/4","karar":"doğru","anlatim":"Doğru, çünkü inceleme yetkisi olanlar dördüncü bentte ayrıca sayılmış. İki görev aynı kişide birleşebiliyor.","formul":"Şık D: vergi müfettişi \u0027ben incelemeye yetkiliyim, o zaman yoklama da yapabilirim\u0027 diyor, bu iddia doğru mu?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.128","karar":"yanlış","anlatim":"Vermezsin, çünkü tahsildar madde 128\u0027in dört bendinden hiçbirinde yok. Onun görevi 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanun kapsamında yalnız tahsilattır.","formul":"Şık E: ertesi gün kapıya bir de tahsil dairesi tahsildarı geliyor ve \u0027ben de yoklama yaparım\u0027 diyor, ona izin verir misin?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Kemal Bey\u0027in kapısına gelen dört kişi kanunda yazıyor, tahsildar yazmıyor; kendine hep şunu sor: bu unvan madde 128\u0027in dört bendinden birinde mi, yoksa başka bir kanuna mı ait?","doldur":[]}],"anahtar":[{"ornek":"yetkilileri","kok":"yetkil"},{"ornek":"yoklamaya","kok":"yoklam"},{"ornek":"tahsil","kok":"tahsil"},{"ornek":"dairesi","kok":"daires"},{"ornek":"görevlendirilenler","kok":"görevl"},{"ornek":"bendinde","kok":"bendin"}],"konuGiris":{"harita":"Ne zaman test edilir: vergi tarhına esas bilgi toplanacağı zaman yoklama yapılır. Nasıl ölçülür: yoklamayı yapan kişinin kanunda sayılan yetkili sıfatlardan birine sahip olup olmadığına bakılır. Nasıl kaydedilir: yoklama sonucu tutanakla belgelenir.","desen":"Soru genelde m.128\u0027de sayılan yetkili sıfatlar arasına yetkisiz bir unvan (örneğin muhtar, belediye başkanı) karıştırır. Öğrenci listedeki isimleri değil, listede olmayanı bulmalıdır. Bu soru Vergi Usul Kanunu m.128 sayma hükmü noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Mükellefi ve vergiyi doğuran olayları yerinde tespit işlemi","ad":"Yoklama","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yoklamaya kanunen yetkili sayılan idari görevli","ad":"Vergi dairesi müdürü","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Görevi doğrudan yoklama yapmak olan memur","ad":"Yoklama memuru","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İnceleme yetkisi nedeniyle yoklama da yapabilen görevli","ad":"Vergi incelemesine yetkili olan","kim":"kanun sabitler"}],"sinavda":"Seçeneklerden hangisinin yoklama yapmaya yetkili olmadığı sorulur.","panel_ornek":"Bir apartman yöneticisi, dairelerin boş mu dolu mu olduğunu anlamak için kapı kapı dolaşıp not tutar. Ama bu notu resmi olarak sadece görevlendirilen kişi yapabilir, komşu istese de bu yetkiyi kullanamaz. 5 daireden 3\u0027ü doluymuş diye örnek not tutulur.","ornek":"Bir apartman yöneticisi, dairelerin boş mu dolu mu olduğunu anlamak için kapı kapı dolaşıp not tutar. Ama bu notu resmi olarak sadece görevlendirilen kişi yapabilir, komşu istese de bu yetkiyi kullanamaz. 5 daireden 3\u0027ü doluymuş diye örnek not tutulur.","yontemler":"m.128\u0027de sayılan dört-beş grup ezberlenip listede olmayan seçenek işaretlenir.","nedir":"Vergi tarhı için yoklama, mükellefi ve işini yerinde tespit etme işlemidir. Sınav, bu tespiti kimin yapmaya yetkili olduğunu bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Belirsiz Yetki Tuzağı","metin":"öğrenci \u0027yetkili makamlarca görevlendirilenler\u0027 ifadesinin genel ve uygulama yönetmeliğine ait olduğunu, kanun metninde yer almadığını sanır. Doğrusu: bu ibare madde 128\u0027in üçüncü bendinde kanun metninde açıkça sayılmıştır."},"A":{"ad":"Vergi Dairesi Müdürü Tuzağı","metin":"öğrenci idari makam sıfatının yoklamayı dışladığını sanır. Doğrusu: 213 sayılı Vergi Usul Kanununun 128 inci maddesinde vergi dairesi müdürleri açıkça yoklamaya yetkili sayılmıştır."},"D":{"ad":"Görev Ayrımı Tuzağı","metin":"öğrenci inceleme ve yoklamanın ayrı görevler olduğunu, inceleme yetkilisinin yoklama yapamayacağını sanır. Doğrusu: vergi incelemesine yetkili olanlar madde 128\u0027in dördüncü bendinde yoklama yapmaya da yetkili sayılmıştır."},"B":{"ad":"Unvan Sınırlama Tuzağı","metin":"öğrenci \u0027yoklama memuru\u0027 unvanının ayrı bir mevzuatla sınırlı olduğunu, madde 128 kapsamında sayılmadığını sanır. Doğrusu: yoklama memurları madde 128\u0027in ikinci bendinde açıkça sayılmıştır."}},"celdiriciYol":{"C":"Madde 128/3\u0027ü genel ifade sanıp kanun dışı saymak (bent metnini görmezden gelme)","A":"Madde 128/1 metnini atlayıp vergi dairesi müdürünü yalnız idari sanmak (bent metnini görmezden gelme)","D":"Madde 128/4\u0027ü görmezden gelip incelemeyi yoklamadan ayrı görev sanmak (bent metnini görmezden gelme)","B":"Madde 128/2\u0027yi ayrı mevzuat sanıp yoklama memurunu listeden çıkarmak (bent metnini görmezden gelme)"},"hap":"213 sayılı Vergi Usul Kanununun 128 inci maddesi yoklamaya yetkilileri vergi dairesi müdürleri, yoklama memurları, yetkili makamlarca görevlendirilenler ve vergi incelemesine yetkili olanlar olarak sayar; tahsil dairesi görevlileri bu sayıma dahil değildir.","teshis":{"C":{"gercek":"Madde 128\u0027in 3 üncü bendi \u0027yetkili makamlar tarafından yoklama işi ile görevlendirilenler\u0027i kanunun kendisinde sayar.","ayirt":"Bu unvan madde 128\u0027in bentlerinden birinde geçiyor mu?","paragraf":"m.128/3","yanilgi":"Bu ifadenin somut bir unvan olmadığı için kanun metnine değil yönetmeliğe ait olduğunu sanıyorsun."},"E":{"gercek":"Madde 128 tahsil dairesi görevlilerini saymaz; onların yetkisi 6183 sayılı Amme Alacaklarının Tahsil Usulü Hakkında Kanundan doğar ve tahsilatla sınırlıdır.","ayirt":"Bu unvan madde 128\u0027in dört bendinden birinde açıkça yazıyor mu, yoksa başka bir kanuna mı ait?","paragraf":"m.128","yanilgi":"Tahsilatla uğraşan görevlinin de vergi idaresi adına sahada çalıştığı için yoklama yetkisi olduğunu sanırsın."},"A":{"gercek":"213 sayılı Vergi Usul Kanununun 128 inci maddesinin 1 inci bendi vergi dairesi müdürlerini açıkça yoklamaya yetkili sayar.","ayirt":"Bu unvan madde 128\u0027in bentlerinden birinde geçiyor mu?","paragraf":"m.128/1","yanilgi":"Vergi dairesi müdürünün yalnız idari işlerle uğraştığını, sahada yoklama yapamayacağını düşünüyorsun."},"D":{"gercek":"Madde 128\u0027in 4 üncü bendi vergi incelemesine yetkili olanları da yoklamaya yetkili sayar; iki görev bir kişide birleşebilir.","ayirt":"Bu unvan madde 128\u0027in bentlerinden birinde geçiyor mu?","paragraf":"m.128/4","yanilgi":"İnceleme ve yoklamayı birbirinden tamamen ayrı, birbirini dışlayan görevler sanıyorsun."},"B":{"gercek":"Madde 128\u0027in 2 nci bendi yoklama memurlarını doğrudan sayar; bu unvan kanunun kendi metnindedir.","ayirt":"Bu unvan madde 128\u0027in bentlerinden birinde geçiyor mu?","paragraf":"m.128/2","yanilgi":"Yoklama memurluğunun madde 128 dışında ayrı bir düzenlemeye ait olduğunu sanıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 96"},"kural":"Türk Borçl layan bir yazıyı alan kişi, bunu aldığı tarihten itibaren sekiz gün içinde itirazda bulunmamışsa, söz konusu teyit mektubunun yapılan sözleşmeye veya açıklamalara uygun olduğunu kabul etmiş sayılır. 4. Ücret ve sözleşme cezasının indirilmesi"}],"hakem":"TBK m.302\u0027de kiralananla ilgili zorunlu vergi ve benzeri yükümlülüklere aksi kararlaştırılmamışsa kiraya verenin katlanacağı açıkça düzenlenmiştir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"Bir konut kira sözleşmesinde, kiralanan taşınmaza ilişkin zorunlu vergi ve benzeri yükümlülüklere kimin katlanacağı sözleşmede düzenlenmemiştir. Türk Borçlar Kanunu hükümlerine göre bu yükümlülüğe kim katlanır?","kayitBaslik":"","id":"sgs-t1-vergi-kolay/kp-10","verilenler":[],"dayanak":"Türk Borçlar Kanunu m.302","dogru":"A","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: İzmir\u0027de Ahmet, dairesini Zeynep\u0027e 1 Ocak\u0027ta kiraya veriyor. Sözleşmede kira bedeli 15.000 TL yazıyor ama dairenin çevre temizlik vergisi kime ait, hiç yazılmamış. Yıl sonunda belediye 2.400 TL vergi tahakkuku çıkarıyor.","anlatim":"Sözleşmede boşluk var, ikisi de birbirine bakıyor. Şimdi kanun bu boşluğu nasıl dolduruyor, göreceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.302, sözleşmede aksine bir kayıt yoksa bu 2.400 TL\u0027yi kiraya veren Ahmet\u0027e yükler. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural tek: aksi kararlaştırılmamışsa vergi kiraya verenindir. Şimdi A\u0027dan E\u0027ye kadar bu 2.400 TL\u0027yi kim öder, sınayacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.302","karar":"doğru","anlatim":"Sözleşmede hüküm yok, o yüzden kanunun yedek kuralı devreye girer. Türk Borçlar Kanunu m.302 vergiyi kiraya verene yükler.","formul":"Şık A: Zeynep sana \u0027bu vergiyi Ahmet mi ödeyecek?\u0027 diye soruyor, evet der misin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.302","karar":"yanlış","anlatim":"Kullanma faydası Zeynep\u0027te ama vergi yükü ayrı bir düzenlemeye bağlı. Kanun bunu kiracıya değil kiraya verene bağlar.","formul":"Şık B: Ahmet \u0027bu benim değil, evi kullanan Zeynep ödesin\u0027 diyor, haklı mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.302","karar":"yanlış","anlatim":"Kanun boşluğu paylaştırma değil, doğrudan tek tarafa yükleme ile doldurur. Türk Borçlar Kanunu m.302 açıkça kiraya vereni gösterir.","formul":"Şık C: bir arkadaşın \u0027madem sözleşmede yok, ikisi 1.200\u0027er TL paylaşsın\u0027 diyor, kabul eder misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.302","karar":"yanlış","anlatim":"Madde \u0027aksi kararlaştırılmamışsa\u0027 der, yani taraflar sözleşmeyle bunu değiştirebilir. Sözleşmede aksi yazılsaydı Zeynep öderdi.","formul":"Şık D: biri \u0027sözleşmede Zeynep ödesin yazsalar bile yine Ahmet öder\u0027 diyor, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.302","karar":"yanlış","anlatim":"Burada mesele Ahmet ile Zeynep arasındaki özel hukuk ilişkisi, vergi dairesinin taraflar arası paylaşımı belirleme yetkisi yok. Türk Borçlar Kanunu m.302 zaten cevabı veriyor.","formul":"Şık E: belediye memuru \u0027bu anlaşmazlığı biz resen çözeriz\u0027 diyor, bu doğru mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Sözleşmede boşluk varsa vergi kiraya verene aittir, ama bu kural emredici değil değiştirilebilir. Kendine sor: sözleşmede aksi bir kayıt var mı, yoksa kanunun yedek kuralı mı işliyor?","doldur":[]}],"anahtar":[{"ornek":"kanunu","kok":"kanunu"},{"ornek":"kiraya","kok":"kiraya"},{"ornek":"sözleşmede","kok":"sözleş"},{"ornek":"borçlar","kok":"borçla"},{"ornek":"kararlaştırılmamış","kok":"kararl"},{"ornek":"zeynep","kok":"zeynep"}],"konuGiris":{"harita":"Ne zaman devreye girer: sözleşmede ilgili yükümlülük düzenlenmemişse. Nasıl belirlenir: kanun maddesi doğrudan tarafı gösterir. Nasıl uygulanır: aksi kararlaştırılmadıkça bu kural geçerli sayılır.","desen":"Soru genelde \u0027sözleşmede düzenlenmemişse kim öder\u0027 şeklinde kurulur ve öğrenci kiracıyı sorumlu sanır. Tuzak, sözleşmede aksi bir hüküm olmadığını fark etmemektir. Bu soru Türk Borçlar Kanunu m.302 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"taşınmazı kullanıma sunan taraf, kanunda asıl yükümlü sayılır","ad":"kiraya veren","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"vergi, sigorta gibi taşınmaza bağlı kanuni ödeme","ad":"zorunlu yükümlülük","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"tarafların düzenlemediği, kanunun tamamladığı sözleşme kısmı","ad":"sözleşme boşluğu","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"soruda verilir","tanim":"tarafların kanundaki kuralı değiştiren sözleşme hükmü","ad":"aksi kararlaştırma","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Sözleşmede düzenlenmeyen zorunlu yükümlülüğe kimin katlanacağı sorulur, kanundaki varsayılan kural istenir.","panel_ornek":"Ahmet bir daire kiraladı ama sözleşmede kim çöp vergisini ödeyecek yazılmadı. Ev sahibi \u0027sen öde\u0027 dedi, Ahmet \u0027hayır sen ödemelisin\u0027 dedi; ikisi de sözleşmeye bakıp cevap bulamadı çünkü orada bu konu hiç yazmamış.","ornek":"Ahmet bir daire kiraladı ama sözleşmede kim çöp vergisini ödeyecek yazılmadı. Ev sahibi \u0027sen öde\u0027 dedi, Ahmet \u0027hayır sen ödemelisin\u0027 dedi; ikisi de sözleşmeye bakıp cevap bulamadı çünkü orada bu konu hiç yazmamış.","yontemler":"Önce sözleşmede özel bir hüküm olup olmadığına bakılır, yoksa kanundaki varsayılan kural uygulanır.","nedir":"Bu konu, kira sözleşmesinde taraflarca düzenlenmeyen giderlerin kime ait olacağını belirleyen kanun hükmünü işler. Sınav, boşluk durumunda kanunun kime yük yüklediğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Eşit Paylaşım Tuzağı","metin":"Öğrenci, kanunda boşluk bulunduğunda yükün taraflar arasında adil biçimde paylaştırılacağını varsayar. Doğrusu: Türk Borçlar Kanununun 302 nci maddesi bir paylaşım öngörmez, yükümlülüğü tek taraf olarak kiraya verene yükler."},"E":{"ad":"Kamu Hukuku Karışıklığı Tuzağı","metin":"Öğrenci, özel hukuk ilişkisindeki masraf paylaşımını, vergi idaresinin resen belirlediği bir işlemle karıştırır. Doğrusu: Bu paylaşım taraflar arası sözleşme hükmüne bağlıdır, vergi idaresinin bu konuda resen belirleme yetkisi yoktur."},"D":{"ad":"Emredici Kural Tuzağı","metin":"Öğrenci, vergi yükümlülüğü düzenlemesinin taraflarca değiştirilemeyeceğini düşünür. Doğrusu: Madde metni açıkça \u0027aksi kararlaştırılmamış\u0027 ibaresini taşır, taraflar sözleşmeyle farklı düzenleme yapabilir."},"B":{"ad":"Kiracı Tuzağı","metin":"Öğrenci, kullanım faydasından yararlanan tarafın (kiracının) taşınmazla ilgili her mali yükü de üstleneceğini düşünür. Doğrusu: Kanun, kullanıma elverişli tutma borcunu kiraya verene yüklediği gibi düzenleme yoksa vergi ve benzeri yükümlülüğü de kiraya verene yükler."}},"celdiriciYol":{},"hap":"Kiralananla ilgili zorunlu sigorta, vergi ve benzeri yükümlülüklere, sözleşmede aksi kararlaştırılmamış veya kanunda öngörülmemişse kiraya veren katlanır (Türk Borçlar Kanunu m.302).","teshis":{"C":{"gercek":"Türk Borçlar Kanunu m.302 açık bir yedek kural koyar; paylaşım değil, tek tarafa (kiraya verene) yükleme öngörür.","ayirt":"Kanun boşluğu her zaman ortak paylaşımla mı doldurulur, yoksa kanunda zaten yedek hüküm var mı?","paragraf":"Türk Borçlar Kanunu m.302","yanilgi":"Kanunda boşluk olduğunda hukukun her zaman \u0027adil paylaşım\u0027 ilkesiyle çözüleceğini düşünüyorsun."},"E":{"gercek":"Burada düzenlenen, taraflar arası özel hukuk ilişkisindeki masraf paylaşımıdır; vergi idaresinin bu konuda resen belirleme yetkisi yoktur.","ayirt":"Bu hüküm bir vergi idaresi işlemi mi, yoksa tarafların birbirine karşı borcu mu?","paragraf":"Türk Borçlar Kanunu m.302","yanilgi":"Vergiyle ilgisi olan her uyuşmazlığın vergi idaresinin resen işlemiyle çözüleceğini sanıyorsun."},"A":{"gercek":"Türk Borçlar Kanununun 302 nci maddesi, düzenleme yoksa vergi ve benzeri yükümlülüğü doğrudan kiraya verene yükleyen tamamlayıcı bir kural koyar.","ayirt":"Sözleşmede bu konuda bir hüküm var mı, yoksa kanunun yedek kuralı mı devreye giriyor?","paragraf":"Türk Borçlar Kanunu m.302","yanilgi":"Bu şıkkı eleyen öğrenci, kanunda böyle bir yedek kuralın açıkça yazılı olmadığını, konunun her zaman sözleşmeye bırakıldığını sanır."},"D":{"gercek":"Madde metni \u0027aksi kararlaştırılmamış veya kanunda öngörülmemişse\u0027 ibaresini taşır; bu, tarafların sözleşmeyle farklı düzenleme yapabileceğini gösterir.","ayirt":"Maddenin başında bir \u0027aksi kararlaştırılmamışsa\u0027 kaydı var mı?","paragraf":"Türk Borçlar Kanunu m.302","yanilgi":"Vergiyle ilgili her hükmün emredici olduğunu, sözleşmeyle değiştirilemeyeceğini varsayıyorsun."},"B":{"gercek":"Kanun, kullanıma elverişli tutma borcunu (m.301) ve vergi yükümlülüğünü (m.302) ayrı ayrı düzenler ve ikisini de kiraya verene bağlar.","ayirt":"Kullanım faydası ile mülkiyete bağlı mali yük aynı kişiye mi ait olmak zorunda?","paragraf":"Türk Borçlar Kanunu m.302","yanilgi":"Kiralanandan fiilen yararlanan kiracı olduğu için, ona ait her masrafın vergiyi de kapsayacağını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 113"},"kural":"","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 113","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Madde metninde \u0027mükellef\u0027 ile \u0027sorumludur\u0027 kelimelerini ayır; sorumlu tahsil edip yatırır, mükellef vergiyi asıl üstlenir.","konu":"ötv vergiye tabi işlemler","tablo":null,"siklar":{"C":"Elektrik ve Havagazı Tüketim Vergisinin mükellefi, elektrik ve havagazını tüketenlerdir","E":"Damga Vergisinin mükellefi, üzerinde işlem bulunan kağıdı düzenleyen resmi dairedir","A":"İlan ve Reklam Vergisinin mükellefi, ilanı kendi yayın organında yayınlayan gazete veya radyo-televizyon kuruluşudur","D":"Haberleşme Vergisinin mükellefi, haberleşme hizmetini sunan işletmenin ortaklarıdır","B":"Eğlence Vergisinin mükellefi, eğlence yerine giriş ücreti ödeyen kişilerdir"},"kaynak":{"alinti":"","liste":[{"ad":"Belediye Gelirleri K. (2464 s.K.) m.13 - İlan ve reklam, İlan ve Reklam Vergisine tabidir. Mükellef ve sorumlu","metin":"İlan ve reklam, İlan ve Reklam Vergisine tabidir. Mükellef ve sorumlu: Madde 13 – İlan ve Reklam Vergisinin mükellefi, yurt dışından gönderilen ilan ve reklamlar dahil olmak üzere, ilan ve reklamı kendi adına yapan veya yaptıran gerçek veya tüzel kişilerdir. İlan ve reklam işlerini mutat meslek olarak ifa edenler, başkaları adına yaptıkları ilan ve reklamlara ait vergileri mükellefler adına ilgili belediyeye yatırmaktan sorumludurlar."},{"ad":"Belediye Gelirleri K. (2464 s.K.) m.18 - Eğlence Vergisine tabidir. Mükellef","metin":"Eğlence Vergisine tabidir. Mükellef: Madde 18 – Verginin mükellefi, eğlence yerlerini işleten gerçek veya tüzelkişilerdir."}],"hakem":"Doğru sık, 2464 sayılı Belediye Gelirleri Kanunu m.35\u0027te açıkça düzenlenmiş olan Elektrik ve Havagazı Tüketim Vergisinin mükellefi tanımını kaynak metinden doğru olarak aktarmaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"2464 sayılı Belediye Gelirleri Kanunu ile 488 sayılı Damga Vergisi Kanunu\u0027na göre aşağıdaki vergi-mükellef eşleştirmelerinden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-vergi-kolay/kp-12","verilenler":[],"dayanak":"2464 sayılı Belediye Gelirleri Kanunu m.13, m.18, m.30, m.35; 488 sayılı Damga Vergisi Kanunu m.3","dogru":"C","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[],"anahtar":[{"ornek":"kanunun","kok":"kanunu"},{"ornek":"mükellef","kok":"mükell"},{"ornek":"doğrudan","kok":"doğrud"},{"ornek":"kıldığı","kok":"kıldığ"},{"ornek":"vergide","kok":"vergid"},{"ornek":"saydığı","kok":"saydığ"}],"konuGiris":{"harita":"Ne zaman test edilir: her vergi türü için mükellefin kim olduğu sorulduğunda test edilir. Nasıl ölçülür: doğru vergi-mükellef çiftini kanun maddesinden bilerek ölçülür. Nasıl kaydedilir: ilgili belediyeye vergi mükellef beyanıyla kaydedilir.","desen":"Soru genellikle dört farklı vergi türünü tek tek sayıp, hangi mükellefin hangi vergiye karşılık geldiğini karıştırır. Tuzak, \u0027tahsil eden\u0027 ile \u0027tüketen\u0027i ya da \u0027işleten\u0027 ile \u0027yaptıran\u0027ı birbirine karıştırmaktır (m.13, m.18, m.30, m.35). Bu soru madde bazlı mükellef tanımlarının doğru eşleştirilmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İlanı kendi adına yapan veya yaptıran gerçek/tüzel kişi","ad":"İlan ve Reklam Vergisi mükellefi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Eğlence yerini işleten gerçek veya tüzel kişi","ad":"Eğlence Vergisi mükellefi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Telefon, teleks, faksimili ücretlerini tahsil eden kuruluş","ad":"Haberleşme Vergisi mükellefi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Elektrik veya havagazı tüketen gerçek veya tüzel kişi","ad":"Elektrik ve Havagazı Tüketim Vergisi mükellefi","kim":"kanun sabitler"}],"sinavda":"Soruda dört vergi-mükellef eşleştirmesi seçenek olarak verilir ve tek doğru eşleşme istenir.","panel_ornek":"Arkadaşın 5 kişilik bir apartmanda kapıcı aidatını topluyor, ama parayı asıl ödeyen daire sahipleri. Yani parayı \u0027toplayan\u0027 ile parayı \u0027gerçekten ödemesi gereken\u0027 farklı kişiler olabilir. Belediye vergilerinde de bazen tüketen öder, bazen tahsil eden sorumlu olur, bunları karıştırmamak lazım.","ornek":"Arkadaşın 5 kişilik bir apartmanda kapıcı aidatını topluyor, ama parayı asıl ödeyen daire sahipleri. Yani parayı \u0027toplayan\u0027 ile parayı \u0027gerçekten ödemesi gereken\u0027 farklı kişiler olabilir. Belediye vergilerinde de bazen tüketen öder, bazen tahsil eden sorumlu olur, bunları karıştırmamak lazım.","yontemler":"Her vergi türü için kanunun \u0027mükellef\u0027 tanımını tek tek ezbere bilmek gerekir; sorumluluk (tahsil eden) ile mükellefiyet (esas ödeyen) ayrımına dikkat et.","nedir":"Bu konu, belediye gelirleri kapsamındaki çeşitli vergilerin (ilan-reklam, eğlence, haberleşme, elektrik-havagazı) mükellefinin kim olduğunu düzenler. Sınav, hangi verginin hangi kişi ya da kurum tarafından ödendiğini doğru eşleştirebiliyor musun diye ölçer."},"olay":"","tuzak":{"D":{"ad":"Ortak-İşletme Karıştırma Tuzağı","metin":"Vergi, tüzel kişiliğin ortaklarına değil bizzat tahsilatı yapan işletmeye yüklenir. Doğrusu: Haberleşme Vergisinin mükellefi, telefon, teleks, faksimili ve data ücretlerini tahsil eden kuruluştur."},"E":{"ad":"Resmi Daire Yükümlülüğü Tuzağı","metin":"Resmi daire kağıdı düzenleyen taraf olsa da vergiyi öder taraf değildir. Doğrusu: Damga Vergisinin mükellefi kağıdı imza edenlerdir; resmi daire ile kişi arasındaki kağıtlarda vergiyi kişi öder."},"A":{"ad":"Sorumlu-Mükellef Karışıklığı Tuzağı","metin":"İlan reklam işini mutat meslek olarak yapan yayın organı, başkası adına yaptığı ilanın vergisini belediyeye yatırmaktan yalnızca sorumludur. Doğrusu: mükellef, ilan ve reklamı kendi adına yapan veya yaptıran gerçek veya tüzel kişidir."},"B":{"ad":"Taraf Karıştırma Tuzağı","metin":"Kanun, hizmetten faydalanan tüketiciyi değil hizmeti sunan işletmeyi muhatap alır. Doğrusu: Eğlence Vergisinin mükellefi eğlence yerini işleten gerçek veya tüzel kişilerdir."}},"celdiriciYol":{},"hap":"Her vergide asıl mükellef kanunun ayrıca \u0027sorumlu\u0027 saydığı tahsil aracısıyla karıştırılmaz; mükellef kanunun doğrudan yükümlü kıldığı kişidir.","teshis":{"C":{"gercek":"2464 sayılı Kanun m.35 açıkça elektrik ve havagazı tüketenleri mükellef sayar; dağıtım kuruluşu yalnız tahsilden sorumludur.","ayirt":"Vergiyi nihai olarak kim üstlenir, kim sadece aracılık eder?","paragraf":"2464 s.K. m.35","yanilgi":"Bu eşleştirmeyi \u0027çok açık\u0027
