ilmesi hâlinde katma değer vergisinde vergiyi doğuran olay ne zaman meydana gelir?","kayitBaslik":"","id":"sgs-t1-vergi-cokzor/kp-02","verilenler":[],"dayanak":"3065 sayılı Katma Değer Vergisi Kanunu madde 10/c ve 10/d bentleri","dogru":"B","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: Bir tekstil üreticisi, 40.000 metre kumaşı bir komisyoncuya devrediyor; komisyoncu bu kumaşı 4 ayrı ayda 10.000\u0027er metre olarak nihai alıcıya teslim ediyor.","anlatim":"Kumaş komisyoncuya Ocak ayında geçiyor ama komisyoncu bunu satmadan sadece elinde bulunduruyor. Asıl alıcı, malı Şubat, Mart, Nisan ve Mayıs aylarında parça parça teslim alıyor.","doldur":[]},{"formul":"Ne yapacağız: Madde 10/d komisyoncu satışında olayı alıcıya teslime bağlar, madde 10/c ise kısım kısım teslim mutadsa her kısmın tesliminde olayın doğduğunu söyler; ikisi birlikte çalışır. Şimdi beş ifadeyi bu 40.000 metrelik kumaş olayında tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.10/d","karar":"yanlış","anlatim":"Komisyoncuya devir sadece emanet niteliğinde, satış değil. Madde 10/d açıkça alıcıya teslimi esas alır, komisyoncuya teslimi değil.","formul":"Şık A: Üretici sana \u0027kumaşı Ocak\u0027ta komisyoncuya devrettim, vergi orada doğdu\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.10/c,d","karar":"doğru","anlatim":"Alıcıya kısım kısım teslim mutad, her kısmın tesliminde ayrı vergiyi doğuran olay gerçekleşiyor. Madde 10/c ve madde 10/d birlikte bu sonucu veriyor.","formul":"Şık B: Muhasebeci sana \u0027her ay teslim edilen 10.000 metre için ayrı ayrı vergi doğar\u0027 diyor, onaylar mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.10/b","karar":"yanlış","anlatim":"Olayda teslimden önce düzenlenmiş, alıcıya kesilmiş bir fatura yok; fatura kuralı sadece önden fatura kesilen tutarla sınırlı özel bir durumdur. Burada esas kural, yani alıcıya teslim, geçerliliğini korur.","formul":"Şık C: Üretici Ocak\u0027ta komisyoncuya kumaşı verirken fatura kesiyor, sen bu faturayı vergiyi doğuran an sayar mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.10/e","karar":"yanlış","anlatim":"Bu kural sadece malın doğrudan alıcı adına hareket edene gönderildiği hallere özgü, burada mal önce komisyoncuya gidiyor. Komisyoncu araya girdiği için madde 10/e değil madde 10/d uygulanır.","formul":"Şık D: Nakliyeci Ocak\u0027ta kumaşı kamyona yükleyip yola çıkıyor, bu an vergiyi doğurur mu dersin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.10/c","karar":"yanlış","anlatim":"Kısım kısım teslim mutad olduğu için her ay ayrı ayrı vergiyi doğuran olay gerçekleşmiş, hepsi Mayıs\u0027a birikmiyor. Bütünün tamamlanmasını beklemek madde 10/c\u0027nin mantığına aykırı.","formul":"Şık E: Komisyoncu Mayıs\u0027ta son 10.000 metreyi de teslim edip işi bitiriyor, vergiyi doğuran olay hep birden burada mı doğar dersin?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Komisyoncuya devir sadece bir ara aşama, gerçek vergiyi doğuran an alıcıya yapılan her kısmi teslimdir. Kendine hep şunu sor: bu teslim son alıcıya mı ve parça parça mı yapılıyor?","doldur":[]}],"anahtar":[{"ornek":"tesliminde","kok":"teslim"},{"ornek":"komisyoncu","kok":"komisy"},{"ornek":"alıcıya","kok":"alıcıy"},{"ornek":"sadece","kok":"sadece"},{"ornek":"doğuran","kok":"doğura"},{"ornek":"vergiyi","kok":"vergiy"}],"konuGiris":{"harita":"Ne zaman test edilir: Komisyoncu/konsinye satışlarda malın kısım kısım teslim edilmesi durumunda hangi anın esas alınacağı sorulduğunda. Nasıl ölçülür: Kanun maddesindeki bentler arasından olaya en özel hüküm seçilerek belirlenir. Nasıl kaydedilir: Belirlenen an, o kısmın fiilen alıcıya teslim edildiği tarih olarak kayda geçer.","desen":"Sınav burada öğrenciyi genel kural olan \u0027kısım kısım teslimde her kısmın tesliminde doğar\u0027 hükmüyle özel hüküm olan \u0027komisyoncu satışında malların alıcıya tesliminde doğar\u0027 hükmünü karıştırmaya yöneltir. Tuzak, malın komisyoncuya devrini teslim anı sanmaktır; oysa vergiyi doğuran olay alıcıya fiilen teslimle gerçekleşir. Bu soru m.10/d bendi ile m.10/c bendinin birlikte değerlendirilmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"KDV yükümlülüğünün başladığı hukuki an","ad":"Vergiyi doğuran olay","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"malın önce aracıya sonra alıcıya teslim edildiği satış şekli","ad":"Komisyoncu vasıtasıyla satış","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"soruda verilir","tanim":"malın parçalar halinde ayrı zamanlarda teslim edilmesi hâli","ad":"Kısım kısım teslim","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"komisyoncu satışlarında vergiyi doğuran olayın gerçekleştiği asıl an","ad":"Malların alıcıya teslimi","kim":"kanun sabitler"}],"sinavda":"Soru, komisyoncu aracılığıyla kısım kısım satılan malda vergiyi doğuran olayın hangi anda meydana geldiğini sorar.","panel_ornek":"Bir esnaf, ürettiği ayakkabıları bir aracı dükkâna bırakıyor; aracı bu ayakkabıları müşterilere 5\u0027er 5\u0027er teslim ediyor. Esnafın kazancının ne zaman gerçekleştiği, ayakkabıların aracıya bırakıldığı an değil, müşteriye fiilen ulaştığı andır.","ornek":"Bir esnaf, ürettiği ayakkabıları bir aracı dükkâna bırakıyor; aracı bu ayakkabıları müşterilere 5\u0027er 5\u0027er teslim ediyor. Esnafın kazancının ne zaman gerçekleştiği, ayakkabıların aracıya bırakıldığı an değil, müşteriye fiilen ulaştığı andır.","yontemler":"Önce olayın komisyoncu/konsinye satış olduğu tespit edilir, sonra m.10/d bendi uygulanarak malın alıcıya fiilen teslim edildiği her an ayrı ayrı vergiyi doğuran olay kabul edilir.","nedir":"KDV\u0027de vergiyi doğuran olay, verginin hangi anda hesaplanıp beyan edileceğini gösteren tarihtir. Sınav bu anın somut olayda hangi bende göre belirlendiğini ölçer."},"olay":"İki bent birlikte uygulanır, komisyoncuya devir değil alıcıya devrim esas alınır.","tuzak":{"C":{"ad":"Belge Tuzağı","metin":"Öğrenci, fatura kesilmesini her zaman vergiyi doğuran olay sanır. Doğrusu: Fatura önce düzenlenmiş bir olay yoksa bu bent uygulanmaz, esas olan komisyoncu satışında alıcıya tesliminin gerçekleşmesidir."},"E":{"ad":"Kısım Bütünleştirme Tuzağı","metin":"Öğrenci, kısım kısım teslimi görmezden gelip tüm malın komisyoncuya devrinin tamamlanmasını bekler. Doğrusu: Kısım kısım teslim mutad olduğundan olay bütünün tesliminde değil her bir kısmın alıcıya tesliminde doğar."},"D":{"ad":"Nakliye Tuzağı","metin":"Öğrenci, malın alıcıya gönderilmesi hâlindeki nakliyeye başlama kuralını burada da uygulanır sanır. Doğrusu: Bu kural malın doğrudan alıcı adına hareket edene gönderildiği hallere ilişkindir, komisyoncu araya girdiğinde uygulanmaz."},"A":{"ad":"Komisyoncu Tuzağı","metin":"Öğrenci, malın önce komisyoncuya geçtiğini görünce vergiyi doğuran olayın orada gerçekleştiğini sanır. Doğrusu: Kanun komisyoncu vasıtasıyla satışlarda vergiyi doğuran olayı malın alıcıya tesliminde kabul eder."}},"celdiriciYol":{},"hap":"Komisyoncu/konsinyasyon satışlarında vergiyi doğuran olay malın alıcıya tesliminde doğar; kısım kısım teslim mutadsa bu, her bir kısmın alıcıya tesliminde gerçekleşir.","teshis":{"C":{"gercek":"Fatura önce düzenlenmişse madde 10/b uygulanır; olayda böyle bir önden fatura yoktur, esas kural devam eder.","ayirt":"Soruda teslimden önce fatura düzenlendiği belirtiliyor mu?","paragraf":"m.10/b","yanilgi":"KDV\u0027de her zaman faturanın belirleyici olduğunu düşünüyorsun."},"E":{"gercek":"Kısım kısım teslim mutadsa her kısmın tesliminde ayrı ayrı vergiyi doğuran olay gerçekleşir, bütünün tamamlanması beklenmez.","ayirt":"Sözleşmede/uygulamada kısım kısım teslim mutad mı?","paragraf":"m.10/c","yanilgi":"Kısım kısım teslimin mutad olduğunu göz ardı edip tek bir bütün teslim bekliyorsun."},"A":{"gercek":"Madde 10/d komisyoncu satışlarında vergiyi doğuran olayı açıkça alıcıya teslime bağlar.","ayirt":"Bu teslim son alıcıya mı yapılıyor, yoksa ara bir kişiye mi?","paragraf":"m.10/d","yanilgi":"Komisyoncuya malın fiziken geçmesini satışın gerçekleştiği an sanıyorsun."},"D":{"gercek":"Nakliyeye başlama kuralı yalnız malın doğrudan alıcı adına hareket edene gönderildiği hallere özgüdür.","ayirt":"Malı komisyoncu mu yoksa doğrudan taşıyıcı mı teslim alıyor?","paragraf":"m.10/e","yanilgi":"Malın hareket etmesini vergiyi doğuran olay sanıyorsun."},"B":{"gercek":"Madde 10/d ile madde 10/c birlikte uygulanır: alıcıya yapılan her kısmi teslimde vergiyi doğuran olay ayrı ayrı gerçekleşir.","ayirt":"Teslim alıcıya mı yapılıyor ve parça parça mı gerçekleşiyor?","paragraf":"m.10/c,d","yanilgi":"İki farklı bendi (komisyoncu ve kısım kısım teslim) ayrı ayrı okuyup birleştiremeyen öğrenci bu şıkkı elemeye çalışır."}},"verilen":[],"donem":4,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 116"},"kural":"Madde 65 hem tahkim ücretlerini hem kollektif, adi komandit ve adi şirketler yoluyla elde edilen kazancı serbest meslek kazancı sayar; işverene tabi çalışma ve limited şirket ortaklığı bu kapsamın dışındadır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 116","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Roma rakamlı önermelerde önce \u0027işverene tabi mi\u0027 sonra \u0027hangi şirket türü\u0027 sorusunu ayrı ayrı sor, ikisini karıştırma.","konu":"serbest meslek kazancı","tablo":{"satirlar":[["A) Yalnız IV","p.22(b)","YANLIŞ ifade"],["B) I ve II","p.22(b)","YANLIŞ ifade"],["C) II ve III","p.21","YANLIŞ ifade"],["D) II ve IV","p.21-22(b)","doğru ifade"],["E) I, II ve IV","p.22(b)","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"II ve III","E":"I, II ve IV","A":"Yalnız IV","D":"II ve IV","B":"I ve II"},"kaynak":{"alinti":"","liste":[{"ad":"GVK (193 s.K.) m.65 - RDÜNCÜ BÖLÜM Serbest Meslek Kazançları Serbest meslek kazancının tarifi","metin":"RDÜNCÜ BÖLÜM Serbest Meslek Kazançları Serbest meslek kazancının tarifi: Madde 65 – (Değişik: 19/2/1963-202/31 md.) Her türlü serbest meslek faaliyetinden doğan kazançlar serbest meslek kazancıdır. Serbest meslek faaliyeti; sermayeden ziyade şahsi mesaiye ilmi veya mesleki bilgiye veya ihtısasa dayanan ve ticari mahiyette olmıyan işlerin iş verene tabi olmaksızın şahsi sorumluluk altında kendi nam ve hesabına yapılmasıdır. Tahkim işleri dolayısiyle hakemlerin aldıkları ücretler ile kollektif, adi komandit ve adi şirketler tarafından yapılan serbest meslek faaliyeti neticesinde doğan kazançlar da, serbest meslek kazancıdır."}],"hakem":"Madde 65, adi ortaklık kazançlarını ve hakem ücretlerini açıkça serbest meslek kazancı olarak tanımladığından, doğru cevap (II ve IV) kaynaktan tam desteklenmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[{"yil":"2025/3","alinti":"193 sayılı Gelir Vergisi Kanunu’na göre yukarıdakilerden hangileri serbest meslek kazancıdır?"},{"yil":"2019/2","alinti":"hangisi serbest meslek kazancı sayılmaz?"},{"yil":"2015/2","alinti":"193 sayılı Gelir Vergisi Kanunu’na göre, serbest meslek kazançlarına ilişkin aşağıdakilerden hangisi yanlıştır?"}],"donemler":["2025/3","2019/2","2015/2"]},"oyun":null,"tip":"teori","soru":"I. Limited şirket ortağı olarak yürüttüğü serbest meslek faaliyetinden ortağın elde ettiği kazanç II. Adi ortaklık halinde yürütülen mimarlık faaliyetinden ortağın payına düşen kazanç III. İşverene tabi çalışan bir avukatın hukuk servisinden aldığı ücret IV. Tahkim işleri dolayısıyla hakemin aldığı ücret Gelir Vergisi Kanununa göre yukarıdakilerden hangileri serbest meslek kazancıdır?","kayitBaslik":"","id":"sgs-t1-vergi-cokzor/kp-03","verilenler":[],"dayanak":"193 sayılı Gelir Vergisi Kanunu m.65","dogru":"D","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir mimar, iki arkadaşıyla adi ortaklık kurup bir villa projesi çiziyor; ayrıca aynı yıl bir ticari dava için hakemlik yapıp 40.000 TL ücret alıyor.","anlatim":"Bu mimar hem ortaklık payından hem hakemlikten kazanç elde ediyor. İkisi de aynı maddenin konusu mu, ayrı ayrı bakacağız.","doldur":[]},{"formul":"Ne yapacağız: Gelir Vergisi Kanunu m.65, bağımsız icra edilen mesleki faaliyeti, tahkim ücretini ve kollektif-adi komandit-adi şirket kazancını serbest meslek kazancı sayar; işverene tabi çalışma ile limited şirket ortaklığı bunun dışındadır.","anlatim":"Şimdi beş ifadeyi bu olayın mantığıyla tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.22(b)","karar":"yanlış","anlatim":"Villa projesindeki ortaklık payı da m.65\u0027in ikinci fıkrasında sayılan adi şirket kazancıdır. Sadece hakem ücretini almak eksik olur.","formul":"Şık A: sadece hakem ücretini mi işaretlersin, mimarın ortaklık payını dışarıda bırakır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.22(b)","karar":"yanlış","anlatim":"Kanun yalnız kollektif, adi komandit, adi şirket sayar; limited şirket bu listede yok. Bu ikisini birlikte doğru saymak yanlış olur.","formul":"Şık B: limited şirket ortağının serbest meslek kazancını, mimarın adi ortaklık payıyla aynı kefeye koyar mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.21","karar":"yanlış","anlatim":"Avukat işverene tabi, maaş alıyor; mimar ise bağımsız çalışıyor. Bağımlılık farkı bu ikisini ayırır.","formul":"Şık C: işverene bağlı çalışan avukatın ücretini, mimarın bağımsız ortaklık payıyla aynı sayar mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.21-22(b)","karar":"doğru","anlatim":"Villa projesindeki pay adi şirket kazancı, hakemlik ücreti ise tahkim ücreti; ikisi de aynı fıkrada açıkça sayılmıştır. Bu ikisini birlikte kabul etmek doğrudur.","formul":"Şık D: mimarın adi ortaklık payı ile hakem ücretini birlikte serbest meslek kazancı sayar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.22(b)","karar":"yanlış","anlatim":"İki doğru öğe yanına limited şirket kazancını eklemek listeyi bozar. Kanun bu türü saymadığı için ekleme yapamazsın.","formul":"Şık E: limited şirket kazancını da mimarın iki gelirine ekler misin?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Mimarın ortaklık payı ile hakem ücreti birlikte doğru cevabı verir, gerisi eksik ya da fazla sayım taşır. Kendine sor: bu gelir bağımsız mı elde ediliyor ve kanunun saydığı şirket türlerinden mi geliyor?","doldur":[]}],"anahtar":[{"ornek":"şirket","kok":"şirket"},{"ornek":"kazancı","kok":"kazanc"},{"ornek":"ortaklarının","kok":"ortakl"},{"ornek":"limited","kok":"limite"},{"ornek":"ücretini","kok":"ücreti"},{"ornek":"kollektif","kok":"kollek"}],"konuGiris":{"harita":"Ne zaman serbest meslek kazancı sayılır: faaliyet işverene bağlı olmadan, kendi nam ve hesabına, bilgi/ihtisasa dayalı yapılıyorsa. Nasıl ayırt edilir: kişi bir işverene tabi mi çalışıyor yoksa bağımsız mı çalışıyor sorusuna bakılır. Nasıl kaydedilir: adi şirket veya hakemlik gibi özel haller kanunda ayrıca sayılarak kazanç türü netleştirilir.","desen":"Bu soru tipi genellikle dört-beş şıklı bir liste vererek hangisinin serbest meslek kazancı olduğunu sorar; tuzak, limited şirket ortaklığı ile adi şirket ortaklığının farklı vergilendirilmesidir. Bir diğer tuzak, işverene bağlı çalışan bir meslek mensubunun (avukat, mühendis vb.) aldığı ücretin serbest meslek değil ücret sayılmasıdır. Bu soru Gelir Vergisi Kanunu m.65\u0027teki tanım ve istisnalar noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Şahsi mesaiye, bilgiye dayanan, işverene tabi olmadan yürütülen bağımsız faaliyet.","ad":"Serbest meslek faaliyeti","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Kişinin bir işverenin emir ve denetimi altında çalışması durumu.","ad":"İşverene tabilik","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Adi şirket yoluyla yapılan serbest meslek faaliyetinden doğan kazanç türü.","ad":"Adi şirket ortaklığında kazanç","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tahkim işleri dolayısıyla hakemin aldığı ücret, kanunen sayılan özel kazanç hali.","ad":"Hakem ücreti","kim":"kanun sabitler"}],"sinavda":"Soruda birkaç farklı meslek faaliyeti durumu verilir ve bunlardan hangilerinin serbest meslek kazancı sayıldığı sorulur.","panel_ornek":"Bir arkadaşın hafta sonları kendi evinde özel ders veriyor ve öğrenci başına 300 lira alıyor; kimseye bağlı çalışmadığı, kendi bilgisiyle ders verdiği için bu bir serbest meslek faaliyeti sayılır. Ama aynı arkadaş bir dershanede maaşlı öğretmen olsa aldığı 5000 lira ücret sayılır, serbest meslek kazancı olmaz.","ornek":"Bir arkadaşın hafta sonları kendi evinde özel ders veriyor ve öğrenci başına 300 lira alıyor; kimseye bağlı çalışmadığı, kendi bilgisiyle ders verdiği için bu bir serbest meslek faaliyeti sayılır. Ama aynı arkadaş bir dershanede maaşlı öğretmen olsa aldığı 5000 lira ücret sayılır, serbest meslek kazancı olmaz.","yontemler":"Her durumda önce kişinin bağımsız mı yoksa işverene bağlı mı çalıştığına bakılır, sonra kanunda özel olarak sayılan haller (adi şirket, hakemlik) kontrol edilir.","nedir":"Serbest meslek kazancı, kişinin sermayeden çok kendi bilgi ve emeğine dayanarak bağımsız şekilde yaptığı işten elde ettiği kazançtır. Sınav burada hangi faaliyetin bu tanıma girdiğini, hangisinin girmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Bağımlılık Ölçütü Tuzağı","metin":"İşverene tabi çalışmayı da şahsi sorumlulukla yapılan iş sandın. Doğrusu: Serbest meslek faaliyeti işverene tabi olmaksızın yapılır; III\u0027teki avukat ücret geliri elde eder, serbest meslek kazancı değildir."},"E":{"ad":"Bileşik Tuzak","metin":"Şirket türü hatasıyla doğru seçenekleri aynı şıkta birleştirdin. Doğrusu: I\u0027deki limited şirket ortaklığı kanunda sayılan türler arasında değildir, yalnız II ve IV doğrudur."},"A":{"ad":"Kollektif, Adi Komandit, Adi Şirketler Tuzağı","metin":"Yalnız tahkim ücretini sayıp adi şirket ortağının payını dışarıda bıraktın. Doğrusu: Kanun tahkim ücretleriyle birlikte kollektif, adi komandit ve adi şirketlerin serbest meslek kazancını da açıkça sayar; II de doğrudur."},"B":{"ad":"Şirket Türü Tuzağı","metin":"Kanunun saydığı şirket türlerine limited şirketi de kattın. Doğrusu: Madde 65 yalnız kollektif, adi komandit ve adi şirketleri sayar; limited şirket ortağının payı kurum kazancından kaynaklanır, serbest meslek kazancı değildir."}},"celdiriciYol":null,"hap":"Serbest meslek kazancı yalnız kendi nam ve hesabına, işverene tabi olmaksızın yapılan faaliyetten doğar; kollektif, adi komandit ve adi şirket ortaklarının payı ile tahkim ücretleri de bu kapsamdadır, limited/anonim şirket ortaklığı değildir.","teshis":{"C":{"gercek":"Serbest meslek faaliyeti işverene tabi olmaksızın kendi nam ve hesabına yapılan iştir; III\u0027teki avukat ücretlidir.","ayirt":"Bu kişi işverene tabi mi çalışıyor, kendi hesabına mı?","paragraf":"GVK m.65 f.1","yanilgi":"Mesleki bilgiye dayanan her işi, işverene bağlı olsa da serbest meslek sanıyorsun."},"E":{"gercek":"Kanunda sayılan şirket türleri sınırlıdır, limited şirket bu sayıma dahil değildir.","ayirt":"Eklediğim önerme kanunun lafzında açıkça sayılmış mı?","paragraf":"GVK m.65 f.2","yanilgi":"Doğru seçenekleri bulunca yanına şüpheli olanı da eklemenin güvenli olduğunu düşünüyorsun."},"A":{"gercek":"Madde 65 ikinci fıkrada tahkim ücretleriyle birlikte kollektif, adi komandit, adi şirket kazançlarını AYNI cümlede sayar.","ayirt":"Maddenin ikinci fıkrasında birden fazla durum sayılıyor mu diye kontrol ettim mi?","paragraf":"GVK m.65 f.2","yanilgi":"Sadece hakem ücretini net gördüğün için diğer doğru seçeneği atladığını düşünüyorsun."},"D":{"gercek":"Madde 65 hem bağımsız icra edilen mesleki faaliyeti hem tahkim ücretini hem sayılan ortaklık türlerini serbest meslek kazancı sayar.","ayirt":"Her önermeyi hem bağımlılık hem şirket türü ölçütünden ayrı ayrı geçirdim mi?","paragraf":"GVK m.65 f.1-2","yanilgi":"Bu şıkkı eleyen öğrenci ya şirket türü sınırını ya bağımlılık ölçütünü gözden kaçırmıştır."},"B":{"gercek":"Kanun sınırlı sayma yapar: yalnız kollektif, adi komandit ve adi şirketler; limited/anonim şirket kazancı kurum kazancıdır.","ayirt":"Kanun bu şirket türünü açıkça saymış mı, yoksa ben mi genelledim?","paragraf":"GVK m.65 f.2","yanilgi":"Her ortaklık türünün serbest meslek kazancı ortaklarına yansıdığını sanıyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 116"},"kural":"","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 116","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Madde 128\u0027in bent sayımını ezbere bil; şıklarda geçen unvanın kamu görevlisi mi yoksa serbest meslek mensubu mu olduğuna önce bak.","konu":"vergi tarhi on işlemleri","tablo":null,"siklar":{"C":"Serbest muhasebeci mali müşavirler","E":"Vergi incelemesine yetkili olanlar","A":"Vergi dairesi müdürleri","D":"Yetkili makamlar tarafından yoklama işi ile görevlendirilenler","B":"Yoklama memurları"},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.128 - Cumhurbaşkanınca belirlenir.32 Yoklamaya yetkililer","metin":"Cumhurbaşkanınca belirlenir.32 Yoklamaya yetkililer: Madde 128 – Yoklama: 1. Vergi dairesi müdürleri; 2. Yoklama memurları; 3. Yetkili makamlar tarafından yoklama işi ile görevlendirilenler; 4. Vergi incelenmesine yetkili olanlar; 5. (Ek: 5/5/2005-5345/34 md.)"}],"hakem":"VUK m.128\u0027de yoklamaya yetkili kişi ve kurumlar açıkça listelenmişolup, serbest muhasebeci mali müşavirler bu listede yer almamaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"213 sayılı Vergi Usul Kanunu\u0027nun 128 inci maddesine göre aşağıdakilerden hangisi yoklamaya yetkili kişi ve kurumlar arasında sayılmamıştır?","kayitBaslik":"","id":"sgs-t1-vergi-cokzor/kp-08","verilenler":[],"dayanak":"213 sayılı Vergi Usul Kanunu m.128","dogru":"C","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[],"anahtar":[{"ornek":"yoklama","kok":"yoklam"},{"ornek":"sayıdadır","kok":"sayıda"},{"ornek":"sınırlı","kok":"sınırl"},{"ornek":"olmayan","kok":"olmaya"},{"ornek":"maddesinde","kok":"maddes"},{"ornek":"yapamaz","kok":"yapama"}],"konuGiris":{"harita":"Ne zaman test edilir: kanun maddesinde sayılan yetkili kişiler sorulduğunda. Nasıl ölçülür: sayılanlar dışında bir meslek grubunun listeye eklenip eklenmediğine bakılarak. Nasıl kaydedilir: doğru cevap, madde metninde geçmeyen unvanı işaretlemekle bulunur.","desen":"Soru genelde madde 128\u0027deki dört-beş yetkili grubu sayıp içine yetkisiz bir meslek unvanı sıkıştırır. Tuzak, mali müşavir, muhasebeci ya da denetçi gibi tanıdık ama listede olmayan unvanları doğruymuş gibi göstermektir. Bu soru Vergi Usul Kanunu m.128 yoklamaya yetkililer maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Mükellefi ilgilendiren maddi olayların yerinde tespiti işlemi","ad":"Yoklama","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yoklamaya kanunen yetkili kılınan idari görevli","ad":"Vergi dairesi müdürü","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yalnızca yoklama işiyle görevlendirilen memur","ad":"Yoklama memuru","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İnceleme yetkisi bulunduğu için yoklama da yapabilen görevli","ad":"Vergi incelemesine yetkili olan","kim":"kanun sabitler"}],"sinavda":"Şıklarda yoklamaya yetkili sayılan ve sayılmayan unvanlar karışık verilir, listede yer almayan işaretlenir.","panel_ornek":"Bir apartman yönetimi, ortak alanları kontrol etmesi için sadece belirli kişilere yetki verir; kapıcı, muhasebeci ya da komşu kendi başına giriş kaydı tutamaz. Yetkili olmayan biri deftere bir şey yazsa bile bu kayıt geçerli sayılmaz. Yani yetki listesi kapalı bir liste gibi çalışır.","ornek":"Bir apartman yönetimi, ortak alanları kontrol etmesi için sadece belirli kişilere yetki verir; kapıcı, muhasebeci ya da komşu kendi başına giriş kaydı tutamaz. Yetkili olmayan biri deftere bir şey yazsa bile bu kayıt geçerli sayılmaz. Yani yetki listesi kapalı bir liste gibi çalışır.","yontemler":"En kritik kural, madde 128\u0027de sayılanların kapalı bir liste olduğunu bilmektir; sayılmayan her unvan otomatik olarak doğru cevap adayıdır.","nedir":"Yoklama, mükelleflerin vergiyle ilgili durumlarını yerinde tespit etmeye yarayan bir denetim işlemidir. Sınav, bu tespiti kimlerin yapmaya yetkili olduğunu bilip bilmediğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Görevlendirme Tuzağı","metin":"öğrenci yetkili makamca görevlendirilenlerin resmi kadro dışı olduğunu düşünüp listeden çıkarır. Doğrusu: yetkili makamlarca yoklama işiyle görevlendirilenler madde 128\u0027in üçüncü bendinde ayrıca sayılmıştır."},"E":{"ad":"Vergi İncelemesi Tuzağı","metin":"öğrenci inceleme yetkisinin yoklamadan farklı bir işlem olduğunu düşünüp bu unvanı listeden çıkarır. Doğrusu: vergi incelemesine yetkili olanlar madde 128\u0027in dördüncü bendinde yoklama yetkilisi olarak da sayılmıştır."},"A":{"ad":"Ne soruluyor","metin":"213 sayılı Vergi Usul Kanununun 128 inci maddesinde sayılan yoklamaya yetkililerden hangisinin listede yer almadığı soruluyor. Kural: madde 128, yoklamaya yetkilileri tek tek sayar ve bu sayım sınırlıdır. Doğrusu: vergi dairesi müdürleri madde 128\u0027in birinci bendinde açıkça sayılmıştır, bu şık listenin içindedir."},"B":{"ad":"Yoklama Memuru Tuzağı","metin":"öğrenci \u0027yoklama\u0027 kelimesiyle doğrudan anılan unvanı listeden çıkarabileceğini düşünür. Doğrusu: yoklama memurları madde 128\u0027in ikinci bendinde açıkça sayılmış olup listenin bir parçasıdır."}},"celdiriciYol":{"C":"meslek mensubunun mükellef defterini inceleyebilmesi, ona yoklama yetkisi de varmış izlenimi verir (vergi incelemesi yetkisiyle özel hukuk ilişkisinin karıştırılması)"},"hap":"213 sayılı Vergi Usul Kanununun 128 inci maddesinde sayılan yoklama yetkilileri sınırlı sayıdadır; listede olmayan hiçbir kişi veya kurum yoklama yapamaz.","teshis":{"C":{"gercek":"213 sayılı Vergi Usul Kanununun 128 inci maddesi meslek mensuplarına yoklama yetkisi vermez; madde yalnız kamu görevlisi ve resmi görevlendirilenleri sayar.","ayirt":"Bu unvan kanunda ayrıca \u0027yoklamaya yetkili\u0027 diye sayılmış mı, yoksa mükellefle özel hukuk ilişkisi mi kuruyor?","paragraf":"m.128 (sınırlı sayım)","yanilgi":"Serbest muhasebeci mali müşavirlerin mükellefle sürekli mesleki ilişkisi olduğu için vergi incelemesine yetkili olanlar gibi yoklama da yapabileceğini sanıyorsun."},"E":{"gercek":"213 sayılı Vergi Usul Kanununun 128 inci maddesinin dördüncü bendi vergi incelemesine yetkili olanları da yoklamaya yetkili sayar.","ayirt":"İnceleme yetkisi olan biri, aynı zamanda madde 128\u0027de ayrıca yoklama yetkilisi olarak sayılmış mı?","paragraf":"m.128/4","yanilgi":"Vergi incelemesinin yoklamadan ayrı ve daha üst bir işlem olduğunu, incelemeye yetkili olanın yoklama yapamayacağını sanıyorsun."},"A":{"gercek":"213 sayılı Vergi Usul Kanununun 128 inci maddesinin birinci bendi vergi dairesi müdürlerini doğrudan yoklamaya yetkili sayar.","ayirt":"Bu unvan madde 128\u0027in bentlerinden birinde açıkça geçiyor mu?","paragraf":"m.128/1","yanilgi":"Vergi dairesi müdürünün idari unvan olduğunu, yoklama gibi teknik bir işlemi bizzat yapamayacağını düşünüyorsun."},"D":{"gercek":"213 sayılı Vergi Usul Kanununun 128 inci maddesinin üçüncü bendi bu kişileri de doğrudan yoklamaya yetkili sayar.","ayirt":"Bu unvan madde 128\u0027in bentlerinden birinde açıkça geçiyor mu?","paragraf":"m.128/3","yanilgi":"Yetkili makamca görevlendirilenlerin geçici ve kadro dışı olduğunu, asli yetkiye sahip olmadığını düşünüyorsun."},"B":{"gercek":"213 sayılı Vergi Usul Kanununun 128 inci maddesinin ikinci bendi yoklama memurlarını ayrı ve doğrudan yetkili olarak sayar.","ayirt":"Bu unvan madde 128\u0027in bentlerinden birinde açıkça geçiyor mu?","paragraf":"m.128/2","yanilgi":"Yoklama memurunun sadece kayıt tutan yardımcı personel olduğunu, asıl yetkinin başka mercilerde olduğunu sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 113"},"kural":"2464 sayılı Belediye Gelirleri Kanununun 13 üncü maddesine göre ilan ve reklamı kendi adına yaptıran gerçek veya tüzel kişi mükelleftir; bu işi meslek olarak yapanlar başkaları adına yaptıkları ilan ve reklamlara ait vergiyi ilgili belediyeye yatırmaktan yalnızca sorumludur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 113","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Senaryoda \u0027kim adına yapılmış\u0027 ve \u0027kim fiilen ödemiş/tahsil etmiş\u0027 ifadelerini ayrıştır; ödeyen her zaman mükellef değildir.","konu":"ötv vergiye tabi işlemler","tablo":{"satirlar":[["A) İlan ve Reklam Vergisinin mükellefi Duru Reklam\u0027dır, çün…","m.13","YANLIŞ ifade"],["B) Eğlence Vergisinin mükellefi mobilya üreticisidir, çünkü…","m.18","YANLIŞ ifade"],["C) İlan ve Reklam Vergisinin mükellefi mobilya üreticisidir…","m.13","doğru ifade"],["D) Haberleşme Vergisinin mükellefi Duru Reklam\u0027dır, çünkü p…","m.30","YANLIŞ ifade"],["E) İlan-reklam faaliyeti ile eğlence yeri işletmeciliği ayn…","m.13, m.18","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İlan ve Reklam Vergisinin mükellefi mobilya üreticisidir; Duru Reklam bu vergiyi mükellef adına yatırmaktan sorumludur.","E":"İlan-reklam faaliyeti ile eğlence yeri işletmeciliği aynı vergiye tabi olduğundan tek mükellefiyet doğar.","A":"İlan ve Reklam Vergisinin mükellefi Duru Reklam\u0027dır, çünkü vergiyi belediyeye fiilen yatıran taraf odur.","D":"Haberleşme Vergisinin mükellefi Duru Reklam\u0027dır, çünkü personeline ait telefon ücretlerini kendi adına ödeyen taraftır.","B":"Eğlence Vergisinin mükellefi mobilya üreticisidir, çünkü eğlence hizmetinden nihai olarak yararlanan taraf odur."},"kaynak":{"alinti":"","liste":[{"ad":"TMS 12 p.15 - Vergiye tabi geçici farklar","metin":"Bütün vergiye tabi geçici farklar için ertelenmiş vergi yükümlülüğü muhasebeleştirilir. Ancak; (a) Şerefiyenin ilk muhasebeleştirilmesinden kaynaklanan vergilendirilebilir geçici farklar için veya (b) (i) İşletme birleşmesi niteliğinde olmayan: (ii) Gerçekleştiğinde ne muhasebe kârının ne de vergiye tabi kârın (mali zararı) etkilenmediği ve (iii) Eşit tutarlarda vergiye tabi ve indirilebilir geçici farkların ortaya çıkmadığı işlemlerde oluşan bir varlık veya yükümlülüğün ilk muhasebeleştirilmesinden kaynaklanan vergiye tabi geçici farklar için ertelenmiş vergi yükümlülüğü finansal tablolara yansıtılmaz. Ancak, bağlı ortaklıklar, şubeler, iştirakler ve müşterek anlaşmalardaki yatırımlarla ilgili olarak ortaya çıkan vergiye tabi geçici farklar için, 39’uncu paragraf uyarınca, ertelenmiş vergi yükümlülüğü muhasebeleştirilir."},{"ad":"TMS 12 p.16 - Vergiye tabi geçici farklar","metin":"Bir varlığın muhasebeleştirilmesi işlemi, ilgili varlığın defter değerinin bir ekonomik yarar olarak işletmeye gelecek dönemlerde geri kazanılacağını gösterir. Eğer varlığın defter değeri onun vergiye esas değerini aşarsa, bu varlık nedeniyle ileride muhasebe kârının tespitinde gider yazılabilecek tutar vergi mevzuatına göre gider yazılabilecek tutarı aşıyor demektir. Bu fark, vergiye tabi bir geçici farktır ve sonuçta oluşan gelir vergilerini gelecek dönemlerde ödeme yükümlülüğü ise bir ertelenmiş vergi borcudur. İşletme bu varlığın defter değerini geri kazandıkça vergilendirilebilir geçici fark tersine dönecek ve vergiye tabi kâr ortaya çıkacaktır. Bu durumda, işletmeden vergi ödemeleri şeklinde ekonomik fayda çıkışı olacaktır. Bu nedenle, bu Standart, 15’inci ve 39’uncu paragraflarda tanımlananların dışındaki bütün durumlarda ertelenmiş vergi borcu muhasebeleştirilmesini zorunlu kılar."}],"hakem":"Doğru sık, 2464 sayılı Belediye Gelirleri Kanununun 13. maddesinde açıkça yer alan kural (mükellef=ilan-reklamı kendi adına yaptıran; sorumlu=meslek olarak yapan) tarafından tam olarak desteklenmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Duru Reklam Ajansı, bir mobilya üreticisi adına ilan ve reklam işi yapmış, vergisini üretici adına belediyeye yatırmıştır. Ajans ayrıca kendi işlettiği sinema salonuyla personeline ait telefon faturalarını kendi adına ödemektedir. Buna göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-vergi-cokzor/kp-12","verilenler":[],"dayanak":"2464 sayılı Belediye Gelirleri Kanunu m.13, m.18, m.30","dogru":"C","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: Pınar Ajans, bir mobilya markası adına Ekim ayında 40.000 TL\u0027lik ilan reklam işi yaptı ve verginin tamamını 15 Kasım\u0027da belediyeye markanın adına yatırdı. Ajans ayrıca kendi işlettiği bir sinema salonundan bilet geliri elde ediyor, personelinin telefon faturalarını da kendi adına ödüyor.","anlatim":"Bu olayda üç ayrı vergi var: ilan-reklam, eğlence, haberleşme. Kim mükellef, kim sadece ödemekten sorumlu, onu ayırt edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 2464 sayılı Belediye Gelirleri Kanunu\u0027na göre m.13 ilan-reklamda mükellefi, m.18 eğlencede mükellefi, m.30 haberleşmede mükellefi ayrı ayrı tanımlıyor. Pınar Ajans\u0027ın rakamlarıyla beş ifadeyi tek tek deneyeceğiz.","anlatim":"Her şıkta \u0027kim mükellef, kim sorumlu\u0027 sorusunu bu somut olaya uygulayacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.13","karar":"yanlış","anlatim":"Ajans işi mobilya markası adına yaptı, parayı yatıran olması onu mükellef yapmaz. m.13\u0027e göre işi kendi adına yaptıran mükelleftir, ajans yalnız sorumludur.","formul":"Şık A: vergiyi belediyeye fiilen yatıran Pınar Ajans olduğu için mükellef odur mu dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.18","karar":"yanlış","anlatim":"m.18 açıkça işletmeyi işleten kişiyi mükellef sayar, yararlanan üçüncü kişiyi değil. Burada mükellef Pınar Ajans\u0027ın kendisidir, çünkü sinemayı o işletiyor.","formul":"Şık B: sinema salonundan nihai olarak yararlanan seyirci olduğu için eğlence vergisinin mükellefi seyirci mi olur?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.13","karar":"doğru","anlatim":"İşi kendi adına yaptıran mobilya markasıdır, m.13 mükellefi böyle tanımlar. Ajans işi meslek olarak yaptığı için sadece vergiyi yatırmaktan sorumludur.","formul":"Şık C: ilan-reklam vergisinin mükellefi mobilya markası, ajans ise sadece markanın adına yatırmaktan sorumlu mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.30","karar":"yanlış","anlatim":"m.30 mükellefi, ücretleri tahsil eden telefon işletmecisi olarak tanımlar. Ajans burada ödeme yapan taraf, tahsil eden değil, o yüzden mükellef olamaz.","formul":"Şık D: personel telefon faturasını kendi adına ödeyen Pınar Ajans olduğu için haberleşme vergisinin mükellefi ajans mı olur?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.13, m.18","karar":"yanlış","anlatim":"m.13 ilan-reklamı, m.18 eğlenceyi ayrı ayrı düzenler, iki bağımsız vergi konusudur. Aynı işletmede olması onları tek vergiye dönüştürmez.","formul":"Şık E: ilan-reklam ile sinema işletmeciliği aynı ajanstan geldiği için tek bir vergi mükellefiyeti mi doğar?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Mükellef, işi kendi adına yaptıran ya da hizmeti fiilen işleten kişidir; para akışı bunu belirlemez. Kendine hep şunu sor: parayı kim ödedi değil, işi kimin adına yapıldı ya da hizmeti kim işletiyor?","doldur":[]}],"anahtar":[{"ornek":"mükellef","kok":"mükell"},{"ornek":"sorumludur","kok":"soruml"},{"ornek":"yaptıran","kok":"yaptır"},{"ornek":"reklamı","kok":"reklam"},{"ornek":"meslek","kok":"meslek"},{"ornek":"işleten","kok":"işlete"}],"konuGiris":{"harita":"Ne zaman mükellefiyet doğar: iş kendi adına yapıldığında. Kim sorumlu tutulur: başkası adına iş yapıp vergiyi yatıran meslek sahibi. Nasıl kaydedilir: her işlem kendi mükellefiyet ilişkisine göre ayrı değerlendirilir.","desen":"Sınav, ajansın hem başkası adına yaptığı işi hem kendi adına yürüttüğü işleri karıştırıp karıştırmadığını test eder. Tuzak, üretici adına yatırılan verginin ajansı mükellef yapmadığını fark ettirmemektir. Bu soru Belediye Gelirleri Kanunu m.13 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"ilan reklamı kendi adına yaptıran gerçek veya tüzel kişi","ad":"mükellef","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"başkası adına yapılan işin vergisini yatırmakla yükümlü meslek sahibi","ad":"sorumlu","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"ajansın kendi işlettiği faaliyetten doğan vergi yükümlülüğü","ad":"kendi adına işlem","kim":"mükellef / işveren beyan eder"},{"kaynak":"soruda verilir","tanim":"meslek sahibinin üçüncü kişi adına yürüttüğü ve vergisini yatırdığı iş","ad":"başkası adına işlem","kim":"kanun sabitler"}],"sinavda":"Ajansın farklı faaliyetlerinden hangisinde kendisinin mükellef, hangisinde sorumlu olduğu sorulur.","panel_ornek":"Arkadaşın senin adına kargo takip işini yapıyor ve kargo firmasına ödemeyi senin adına yatırıyor; ama kendi kullandığı 20 liralık kırtasiye faturasını kendi adına ödüyor. Burada iki farklı sorumluluk durumu var.","ornek":"Arkadaşın senin adına kargo takip işini yapıyor ve kargo firmasına ödemeyi senin adına yatırıyor; ama kendi kullandığı 20 liralık kırtasiye faturasını kendi adına ödüyor. Burada iki farklı sorumluluk durumu var.","yontemler":"Her faaliyeti ayrı ayrı, \u0027kendi adına mı yaptı, başkası adına mı yaptı\u0027 sorusuyla değerlendir.","nedir":"Bu konu, bir hizmetin verginin mükellefinin kim olduğunu ve sorumluluğun kimde kaldığını inceler. Sınav, işi kendi adına yapanla başkası adına yapanı ayırt edip edemediğini ölçer."},"olay":"senaryoda ilan-reklam işi mobilya üreticisi adına yaptırılmıştır, Duru Reklam ise mutat meslek olarak bu işi ifa etmektedir.","tuzak":{"D":{"ad":"Tahsilat-Ödeme Karıştırma Tuzağı","metin":"Faturayı ödeyen tarafı vergi mükellefi sanırsın. Doğrusu: 2464 sayılı Kanunun 30 üncü maddesine göre Haberleşme Vergisinin mükellefi telefon, teleks, faksimili ve data ücretlerini tahsil eden işletmecidir; personel adına ödeme yapan işveren mükellef sayılmaz."},"E":{"ad":"Vergi Türü Birleştirme Tuzağı","metin":"Aynı işletmenin farklı faaliyetlerini tek vergiye tabi sanırsın. Doğrusu: ilan-reklam faaliyeti 13 üncü, eğlence yeri işletmeciliği 18 inci madde kapsamında ayrı ayrı düzenlenmiş iki farklı vergi konusudur, tek mükellefiyet doğmaz."},"A":{"ad":"Sorumlu-Mükellef Karıştırma Tuzağı","metin":"Vergiyi fiilen yatıran kişiyi mükellef sanırsın. Doğrusu: 2464 sayılı Belediye Gelirleri Kanununun 13 üncü maddesine göre mükellef, ilan ve reklamı kendi adına yaptıran kişidir; işi meslek olarak ifa eden yalnız vergiyi yatırmaktan sorumludur."},"B":{"ad":"Nihai Yararlanan Tuzağı","metin":"Hizmetten ekonomik olarak kim faydalanıyorsa mükellef odur sanırsın. Doğrusu: 2464 sayılı Kanunun 18 inci maddesine göre Eğlence Vergisinin mükellefi eğlence yerini fiilen işleten kişidir, hizmetten yararlanan üçüncü kişi değil."}},"celdiriciYol":{},"hap":"Belediye Gelirlerine tabi vergilerde mükellef, işi kendi adına yaptıran/işleten/tahsil eden kişidir; işi meslek olarak başkası adına yürüten yalnız ödemekten sorumludur.","teshis":{"C":{"gercek":"2464 sayılı Kanun m.13, mükellefi işi kendi adına yaptıran kişi olarak tanımlar; meslek olarak ifa edenleri ise yalnız sorumlu sayar.","ayirt":"Kimin adına iş yaptırılmış, kim sadece aracılık etmiş diye ayır.","paragraf":"m.13","yanilgi":"Bu şıkkı eleyen öğrenci, mükellef ile vergiyi yatırma sorumlusunu aynı kişi sanır."},"E":{"gercek":"İlan-reklam faaliyeti m.13, eğlence yeri işletmeciliği m.18 kapsamında ayrı düzenlenmiş bağımsız vergi konularıdır.","ayirt":"Her faaliyet için ayrı madde ve ayrı mükellefiyet var mı diye kendine sor.","paragraf":"m.13, m.18","yanilgi":"Aynı işletmenin farklı faaliyetlerinin tek bir vergiye tabi olduğunu düşünüyorsun."},"A":{"gercek":"2464 sayılı Belediye Gelirleri Kanunu m.13\u0027e göre mükellef, ilanı kendi adına yaptıran kişidir; meslek olarak ifa eden yalnız ödemekten sorumludur.","ayirt":"Vergiyi yatıran mı, yoksa işi kendi adına yaptıran mı diye kendine sor.","paragraf":"m.13","yanilgi":"Vergiyi belediyeye fiilen yatıran kişinin mükellef olduğunu düşünüyorsun."},"D":{"gercek":"2464 sayılı Kanun m.30\u0027a göre mükellef, ücretleri tahsil eden işletmecidir; ödemeyi yapan işveren ya da kullanıcı değildir.","ayirt":"Parayı kim tahsil ediyor, kim sadece ödeme yapıyor diye kendine sor.","paragraf":"m.30","yanilgi":"Faturayı fiilen ödeyen tarafın mükellef olduğunu sanıyorsun."},"B":{"gercek":"2464 sayılı Kanun m.18\u0027e göre mükellef, eğlence yerini işleten gerçek veya tüzel kişidir; yararlanan üçüncü kişi değildir.","ayirt":"Eğlence yerini kim fiilen işletiyor diye kendine sor.","paragraf":"m.18","yanilgi":"Eğlenceden ekonomik fayda sağlayan kişiyi mükellef sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 118"},"kural":"Mukavelenamelerin müddetinin uzatılması halinde aynı miktar veya nispette vergi alınır; azami tutardan vergi alınan mukavelenamelerin devri halinde ise aslından alınan verginin dörtte biri alınır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 118","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"488 sayılı Kanun m.14\u0027teki süre uzatımı, devir ve akreditif kurallarını üç ayrı kutuya koy; oranları birbirine karıştırma.","konu":"damga vergisi süre uzatımı","tablo":{"satirlar":[["A) Süre uzatımında aslından alınan verginin dörtte biri, de…","m.14 f.4-5","YANLIŞ ifade"],["B) Süre uzatımında aynı miktar veya nispette, devirde ise a…","m.14 f.4-5","doğru ifade"],["C) Süre uzatımında ve devirde her ikisinde de aslından alın…","m.14 f.4-5","YANLIŞ ifade"],["D) Süre uzatımında aslından alınan verginin yarısı, devirde…","m.14 f.5","YANLIŞ ifade"],["E) Süre uzatımında ve devirde her ikisinde de aynı miktar v…","m.14 f.4-5","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Süre uzatımında ve devirde her ikisinde de aslından alınan verginin dörtte biri vergi alınır","E":"Süre uzatımında ve devirde her ikisinde de aynı miktar veya nispette vergi alınır","A":"Süre uzatımında aslından alınan verginin dörtte biri, devirde ise aynı miktar veya nispette vergi alınır","D":"Süre uzatımında aslından alınan verginin yarısı, devirde ise dörtte biri vergi alınır","B":"Süre uzatımında aynı miktar veya nispette, devirde ise aslından alınan verginin dörtte biri vergi alınır"},"kaynak":{"alinti":"Mukavelenamelerin müddetinin uzatılması halinde aynı miktar veya nispette vergi alınır","liste":[{"ad":"Damga V.K. (488 s.K.) m.1 - BİRİNCİ BÖLÜM Mükellefiyet ve İstisnalar Konu","metin":"BİRİNCİ BÖLÜM Mükellefiyet ve İstisnalar Konu: Madde 1 – Bu Kanuna ekli (1) sayılı tabloda yazılı kağıtlar Damga vergisine tabidir. Bu kanundaki kağıtlar terimi, yazılıp imzalamak veya imza yerine geçen bir işaret konmak suretiyle düzenlenen ve herhangi bir hususu ispat veya belli etmek için ibraz edilebilecek olan belgeler ile elektronik imza kullanılmak suretiyle manyetik ortamda ve elektronik veri şeklinde oluşturulan belgeleri ifade eder.1 Yabancı memleketlerle Türkiye\u0027deki yabancı elçilik ve konsolosluklarda düzenlenen kağıtlar, Türkiye\u0027de resmi dairelere ibraz edildiği, üzerine devir veya ciro işlemleri yürütüldüğü veya herhangi bir suretle hükümlerinden faydalanıldığı takdirde vergiye tabi tutulur."},{"ad":"Damga V.K. (488 s.K.) m.3 - Damga Vergisine tabidir. Mükellef","metin":"Damga Vergisine tabidir. Mükellef: Madde 3 – Damga Vergisinin mükellefi kağıtları imza edenlerdir. Resmi dairelerle kişiler arasındaki işlemlere ait kağıtların Damga Vergisini kişiler öder. Yabancı memleketlerle Türkiye\u0027deki yabancı elçilik ve konsolosluklarda düzenlenen kağıtların vergisini, Türkiye\u0027de bu kağıtları resmi dairelere ibraz eden. üzerlerinde devir veya ciro işlemleri yapanlar veya harhangi bir suretle hükümlerinden faydalananlar öderler. Ancak bunlardan ticari veya mütedavil kağıt mahi yetinde bulunanların vergisini,bunları en evvel satan veya kabul veya başka suretle kullanan kişiler öderler. 16/7/2004 tarihli ve 5228 sayılı Kanunun 59 uncu maddesiyle bu fıkrada yer alan “belgeleri ifade eder.“ ibaresi, “ belgeler ile elektronik imza kullanılmak suretiyle manyetik ortamda ve elektronik veri şeklinde oluşturulan belgeleri ifade eder.“ şeklinde değiştirilmiştir. 1"}],"hakem":"488 s.K. m.14\u0027de \u0027Mukavelenamelerin müddetinin uzatılması halinde aynı miktar veya nispette vergi alınır\u0027 ve \u0027azami tutardan vergi alınan mukavelenamelerin devri halinde aslından alınan verginin dörtte biri alınır\u0027 hükümleri açıkça yer almaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"488 sayılı Damga Vergisi Kanununa göre, azami tutardan vergi alınmış bir sözleşmenin süresinin uzatılması ile aynı sözleşmenin devredilmesi halinde uygulanacak vergiye ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-vergi-cokzor/kp-19","verilenler":[],"dayanak":"488 sayılı Damga Vergisi Kanunu m.14","dogru":"B","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: Bir inşaat firması, 15 Mart 2023\u0027te bir taahhüt sözleşmesi imzalıyor; sözleşme bedeli o kadar yüksek ki hesaplanan damga vergisi 10.732.371,80 TL\u0027lik azami tutarı aşıyor ve firma bu azami tutarı ödüyor.","anlatim":"Firma önce bu sözleşmenin süresini 6 ay uzatıyor, sonra aynı sözleşmeyi başka bir yükleniciye devrediyor. İki farklı işlem, iki farklı vergi sonucu doğuruyor.","doldur":[]},{"formul":"Ne yapacağız: 488 sayılı Kanun m.14\u0027te süre uzatımı ve devir ayrı cümlelerde düzenlenmiş; süre uzatımında aynı miktar/nispet, devirde aslından alınan verginin dörtte biri alınıyor.","anlatim":"Firmanın azami tutardan ödediği vergiyi baz alacağız. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.14 f.4-5","karar":"yanlış","anlatim":"Firmanın süre uzatımında oran dörtte bir değil, aynı miktar/nispettir; devirde ise dörtte bir alınır, yani tam ters. m.14 f.4-5\u0027i ters bağlamışsın.","formul":"Şık A: birisi sana \u0027süre uzatımında dörtte bir, devirde aynı miktar alınır\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.14 f.4-5","karar":"doğru","anlatim":"Firma 6 aylık uzatmada aynı nispette vergi öder, devirde ise ödediği verginin dörtte birini öder. Bu tam kanunun söylediği şey.","formul":"Şık B: \u0027süre uzatımında aynı miktar veya nispette, devirde aslından alınan verginin dörtte biri alınır\u0027 diyorsun, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.14 f.4-5","karar":"yanlış","anlatim":"Dörtte bir oranı sadece devirde geçerli, süre uzatımında geçerli değil; bu oran akreditif mektup ve telgrafın süre uzatımına özgüdür. Firmanın sözleşme uzatımını akreditifle karıştırıyorsun.","formul":"Şık C: \u0027her ikisinde de dörtte bir alınır\u0027 diyorsun, firmanın olayına uyar mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.14 f.5","karar":"yanlış","anlatim":"Yarı nispet kuralı, yabancı memleketlerin birinden diğerine düzenlenip Türkiye\u0027de tedavüle çıkarılan kağıtlara özgü; firmanın yerli sözleşmesiyle ilgisi yok. Süre uzatımı burada aynı miktar/nispet.","formul":"Şık D: \u0027süre uzatımında yarı, devirde dörtte bir\u0027 diyorsun, firmanın işlemine uyar mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.14 f.4-5","karar":"yanlış","anlatim":"Devir ayrı bir işlemdir ve kanun bunu açıkça dörtte bir oranına bağlamıştır, aynı miktar değil. Süre uzatımının mantığını devre taşıyorsun ama devir farklı bir olay.","formul":"Şık E: \u0027her ikisinde de aynı miktar veya nispette alınır\u0027 diyorsun, devir için de geçerli mi bu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Firmanın olayı gösteriyor ki süre uzatımı \u0027aynı\u0027, devir \u0027dörtte bir\u0027 demek; kendine hep şunu sor: bu olay sözleşmenin devamı mı yoksa el değiştirmesi mi?","doldur":[]}],"anahtar":[{"ornek":"dörtte","kok":"dörtte"},{"ornek":"uzatımında","kok":"uzatım"},{"ornek":"sözleşme","kok":"sözleş"},{"ornek":"nispette","kok":"nispet"},{"ornek":"firmanın","kok":"firman"},{"ornek":"miktar","kok":"miktar"}],"konuGiris":{"harita":"Ne zaman test edilir: azami tutardan vergi alınmış bir sözleşmenin süresi uzatıldığında ya da devredildiğinde hangi verginin alınacağı sorulduğunda. Nasıl ölçülür: kanun maddesindeki \u0027aynı miktar\u0027 ve \u0027dörtte biri\u0027 ifadeleriyle iki farklı işlem ayrıştırılarak ölçülür. Nasıl kaydedilir: uzatmada asıl vergi miktarı, devirde ise asıl verginin dörtte biri olarak kaydedilir.","desen":"Sınav genellikle süre uzatımı ile devir işlemini karıştırarak, ikisine de aynı oranın uygulandığını düşündürecek şekilde soru kurar. Tuzak, \u0027aynı miktar veya nispette\u0027 ile \u0027dörtte biri\u0027 ifadelerinin birbirine karıştırılmasıdır (m.14). Bu soru madde 14\u0027teki azami tutar, süre uzatımı ve devir hükümlerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Bir kağıttan alınacak damga vergisinin kanunda belirlenen üst sınırı","ad":"Azami tutar","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mukavelenamenin süresinin sözleşme hükümleriyle uzatılması işlemi","ad":"Süre uzatımı","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"soruda verilir","tanim":"Azami tutardan vergi alınmış sözleşmenin başka bir tarafa devredilmesi işlemi","ad":"Devir","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Devir halinde asıl vergiden alınacak indirimli vergi payı","ad":"Dörtte bir oranı","kim":"kanun sabitler"}],"sinavda":"Soruda azami tutardan vergi alınmış bir sözleşmenin süre uzatımı ve devri birlikte verilir, hangi vergi kuralının uygulanacağı istenir.","panel_ornek":"Bir arkadaşın 2 yıllığına kiraladığı evin kontratını 1 yıl daha uzattı; ev sahibi kontratı başka birine devretmek istese kural değişir. Süre uzatımında eski kira bedeli üzerinden aynı oranda işlem yapılır, devirde ise dörtte bir gibi indirimli bir oran uygulanır. Yani \u0027uzatma\u0027 ile \u0027devir\u0027 aynı işlem gibi görünse de sonuçları farklıdır.","ornek":"Bir arkadaşın 2 yıllığına kiraladığı evin kontratını 1 yıl daha uzattı; ev sahibi kontratı başka birine devretmek istese kural değişir. Süre uzatımında eski kira bedeli üzerinden aynı oranda işlem yapılır, devirde ise dörtte bir gibi indirimli bir oran uygulanır. Yani \u0027uzatma\u0027 ile \u0027devir\u0027 aynı işlem gibi görünse de sonuçları farklıdır.","yontemler":"Süre uzatımında aynı miktar veya nispette vergi alınırken, devirde asıl verginin sadece dörtte biri alınır; bu iki kural birbirine karıştırılmamalıdır.","nedir":"Damga vergisi, sözleşme ve benzeri kağıtların vergiye tabi tutulmasını sağlayan bir vergi türüdür. Sınav, sözleşmede süre uzatımı ile devir işleminin vergilendirmesinin farklı kurallara tabi olduğunu bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Akreditif Kuralıyla Karıştırma Tuzağı","metin":"Akreditif mektup ve telgraflarında süre uzatıldığında dörtte bir alınır kuralını sözleşme süresi uzatımına da uyguladın. Doğrusu: Sözleşme süresi uzatımında oran değil aynı miktar veya nispet uygulanır."},"E":{"ad":"Kapsam Atlama Tuzağı","metin":"Süre uzatımı kuralını devre de genelleyerek devir için ayrı düzenlenen dörtte bir oranını gözden kaçırdın. Doğrusu: Devir halinde aynı miktar değil, aslından alınan verginin dörtte biri vergi alınır."},"D":{"ad":"Oran Karıştırma Tuzağı","metin":"Yabancı memleketlerin birinden diğerine düzenlenip Türkiye\u0027de tedavüle çıkarılan kağıtlara ait yarı nispet kuralını buraya taşıdın. Doğrusu: Süre uzatımında yarı değil aynı miktar veya nispet, devirde ise dörtte bir uygulanır."},"A":{"ad":"Ters Kayıt Tuzağı","metin":"Süre uzatımı ile devir kuralının sonuçlarını yer değiştirerek yazdın. Doğrusu: Süre uzatımında aynı miktar veya nispet, devirde ise dörtte bir oranı uygulanır."}},"celdiriciYol":{},"hap":"Sözleşme süresinin uzatılmasında aynı miktar veya nispette, azami tutardan vergi alınan sözleşmenin devrinde ise aslından alınan verginin dörtte biri vergi alınır.","teshis":{"C":{"gercek":"Akreditif mektup/telgrafta süre uzatımı dörtte bir oranına tabidir; sözleşmenin süre uzatımı ise ayrı bir cümlede aynı miktar/nispet ile düzenlenmiştir.","ayirt":"Kuralın hangi kağıt türüne (sözleşme mi, akreditif mi) ait olduğunu ayırdım mı?","paragraf":"m.14 f.4-5","yanilgi":"Akreditif mektup ve telgraf için öngörülen dörtte bir oranını, benzer \u0027süre uzatımı\u0027 ifadesi geçtiği için sözleşmeye de genellenebilir sanıyorsun."},"E":{"gercek":"Devir, sözleşmenin süresinin uzatılmasından farklı bir işlemdir ve m.14\u0027te ayrıca dörtte bir oranına bağlanmıştır.","ayirt":"Olay süre uzatımı mı yoksa el değiştirme (devir) mi; maddedeki hangi cümleye giriyor?","paragraf":"m.14 f.4-5","yanilgi":"Süre uzatımı kuralının \u0027devam ettirme\u0027 mantığını devre de geçerli sayıp, devrin ayrı bir olay olduğunu gözden kaçırıyorsun."},"A":{"gercek":"488 sayılı Kanun m.14\u0027te süre uzatımı ve devir ayrı cümlelerle düzenlenmiştir; süre uzatımı aynı miktar/nispet, devir dörtte bir oranına tabidir.","ayirt":"Bu sonucu hangi olaya bağladığımı maddedeki cümle sırasıyla tekrar kontrol ettim mi?","paragraf":"m.14 f.4-5","yanilgi":"İki farklı olayın sonucunu ezberlerken hangisinin hangisine ait olduğunu ters bağladığını fark etmiyorsun."},"D":{"gercek":"Yarı nispet kuralı, yabancı memleketlerin birinden diğerine düzenlenip Türkiye\u0027de tedavüle çıkarılan kağıtlara özgüdür; süre uzatımı ile ilgisi yoktur.","ayirt":"Bu oran hangi kağıt grubu için yazılmış, olayım o gruba giriyor mu?","paragraf":"m.14 f.5","yanilgi":"Yarı nispet ifadesini gördüğün her yerde aynı kurala ait sanıp süre uzatımına taşıyorsun."},"B":{"gercek":"488 sayılı Kanun m.14: süre uzatımında aynı miktar veya nispet, azami tutardan vergi alınan sözleşmenin devrinde aslından alınan verginin dörtte biri alınır.","ayirt":"Maddede kaç ayrı olay ve kaç ayrı oran düzenlenmiş, hangisi hangi olaya ait?","paragraf":"m.14 f.4-5","yanilgi":"Bu şıkkı eleyen öğrenci, iki farklı orandaki iki kuralın aynı maddede yan yana durabileceğine ihtimal vermiyor, tek bir oran arıyor."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 108"},"kural":"elektronik tebligat zorunluluğunun ortadan kalkması hâlinde gerekli bildirim ilgili kurum, kuruluş veya birlik tarafından bir ay içinde yapılır ve bu bildirimi takip eden bir ay içinde Posta ve Telgraf Teşkilatı Anonim Şirketi gerekli işlemi yapar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 108","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Süre içeren maddelerde her sayının hangi fıkraya ve hangi tarafa ait olduğunu ayrı ayrı işaretle, ek madde ile geçici maddeyi karıştırma.","konu":"elektronik tebligat","tablo":{"satirlar":[["VERİLENLER","-","-"],["Ek 2 nci madde","ek 2 nci madde","-"],["HESAP","-","-"],["A) Zorunluluğun ortadan kalktığı, Posta ve Telgraf Teşkilat…","7201 s.K. ek m.2, son fıkra","YANLIŞ ifade"],["B) İlgili kurum, kuruluş veya birlik durumu üç ay içinde bi…","7201 s.K. gec. m.2","YANLIŞ ifade"],["C) İlgili kurum, kuruluş veya birlik durumu bir ay içinde b…","7201 s.K. ek m.2, son fıkra","doğru ifade"],["D) İlgili kurum, kuruluş veya birlik durumu tescil tarihind…","5510 s. SGK Kanunu m.8 ile karıştırma","YANLIŞ ifade"],["E) Zorunluluğun ortadan kalkması hâlinde herhangi bir sürey…","7201 s.K. ek m.2, son fıkra","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İlgili kurum, kuruluş veya birlik durumu bir ay içinde bildirir; Posta ve Telgraf Teşkilatı Anonim Şirketi bu bildirimi takip eden bir ay içinde gerekli işlemi yapar.","E":"Zorunluluğun ortadan kalkması hâlinde herhangi bir süreye bağlı olmaksızın, bildirim yapılır yapılmaz Posta ve Telgraf Teşkilatı Anonim Şirketi derhal işlem yapar.","A":"Zorunluluğun ortadan kalktığı, Posta ve Telgraf Teşkilatı Anonim Şirketince bir ay içinde tespit edilir ve ilgili kurum bu tespiti takip eden bir ay içinde işlem yapar.","D":"İlgili kurum, kuruluş veya birlik durumu tescil tarihinden itibaren bir ay içinde sigortalıya bildirir; ayrıca başka bir süre aranmaz.","B":"İlgili kurum, kuruluş veya birlik durumu üç ay içinde bildirir; Posta ve Telgraf Teşkilatı Anonim Şirketi bildirimi takip eden bir ay içinde gerekli işlemi yapar."},"kaynak":{"alinti":"","liste":[{"ad":"Tebligat K. (7201 s.K.) ek m.2 - Elektronik tebligat adresinin oluşturulması","metin":"Elektronik tebligat adresinin oluşturulması: Ek Madde 2- (Ek: 28/2/2018-7101/49 md.) Elektronik tebligat adresi, Posta ve Telgraf Teşkilatı Anonim Şirketi tarafından, 7/a maddesi kapsamında kalan her bir gerçek kişi için kimlik numarası, tüzel kişi için ise tabi oldukları sistem numarası esas alınmak suretiyle sadece bir tane olacak şekilde oluşturulur ve sistemde kaydedilir. Oluşturulan elektronik tebligat adresleri, adres sahiplerine teslim edilmek üzere, ilgili kurum, kuruluş veya birliğe gönderilir; 7/a maddesinin ikinci fıkrası kapsamında kalan kişilere ise doğrudan teslim edilir. Bu adresler, adres sahibine teslim edildikten sonra 1 inci madde uyarınca tebligat çıkarmaya yetkili makam ve mercilerin kullanımına sunulur. Kurum, kuruluş veya birlikler ile gerçek veya tüzel kişilerin 7/a maddesi uyarınca elektronik tebligat zorunluluğuna tabi olmaları veya bunlar hakkında elektronik tebligat zorunluluğunun ortadan kalkması hâllerinde gerekli bildirimler, ilgili kurum, kuruluş veya birlik tarafından bir ay içinde yapılır ve bildirimi takip eden bir ay içinde Posta ve Telgraf Teşkilatı Anonim Şirketi tarafından gerekli işlem yapılır. Posta ve Telgraf Teşkilatı Anonim Şirketi, elektronik tebligat sisteminin yürütülmesi için gerekli bilgi ve belgeleri ilgili kurum, kuruluş veya birliklerden ister. İlgili kurum, kuruluş veya birlikler, talep edilen bilgi ve belgeleri Posta ve Telgraf Teşkilatı Anonim Şirketine göndermek zorundadır."},{"ad":"Tebligat K. (7201 s.K.) gec. m.2 - Elektronik tebligat adreslerinin verilmesi","metin":"Elektronik tebligat adreslerinin verilmesi: Geçici Madde 2- (Ek: 28/2/2018-7101/50 md.) Bu maddenin yürürlüğe girdiği tarihten itibaren bir ay içinde Posta ve Telgraf Teşkilatı Anonim Şirketi, elektronik tebligat adreslerini oluşturmak amacıyla ihtiyaç duyduğu tüm bilgi ve belgeleri; 1. İlgili kamu kurum veya kuruluşundan, 2. Mahallî idareler bakımından Çevre ve Şehircilik Bakanlığından,16 3. İlgili kamu iktisadi teşebbüsünden, 4. İlgili kamuya ait ortaklıktan, 5. Şirketler ve kooperatifler bakımından Gümrük ve Ticaret Bakanlığından, 6. İlgili kamu kurumu niteliğindeki meslek kuruluşu veya üst kuruluşundan, 7. Türkiye Noterler Birliğinden, 29/11/2018 tarihli ve 7153 sayılı Kanunun 28 nci maddesiyle bu bentte yer alan “İçişleri” ibaresi “Çevre ve Şehircilik” şeklinde değiştirilmiştir. 16 8. Türkiye Barolar Birliğinden, ister. İlgili kurum, kuruluş veya birlik, talep edilen bilgileri bir ay içinde Posta ve Telgraf Teşkilatı Anonim Şirketine bildirmek zorundadır. Posta ve Telgraf Teşkilatı Anonim Şirketi, elektronik tebligat adreslerini, bu bilgileri esas almak suretiyle üç ay içinde oluşturur. Posta ve Telgraf Teşkilatı Anonim Şirketi oluşturulan elektronik tebligat adreslerini, adres sahiplerine teslim edilmek üzere, ilgili kurum, kuruluş veya birliğe gönderir ve teslim işlemi gerçekleştikten sonra bu adresleri, 1 inci madde uyarınca tebligat çıkarmaya yetkili makam ve mercilerin kullanımına sunar."}],"hakem":"Kaynak metinde (7201 s.K. ek m.2, son fıkra) elektronik tebligat zorunluluğunun ortadan kalkması hâlinde ilgili kurum/kuruluş/birlik tarafından bir ay içinde bildirim yapılması ve bunu takip eden bir ay içinde PTT A.Ş. tarafından işlem yapılması kuralı açıkça yer almaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2024/3","alinti":"213 sayılı Vergi Usul Kanunu’na göre elektronik ortamda tebligat, aşağıdaki hangi tarihte muhatabına yapılmış sayılır?"}],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"7201 sayılı Tebligat Kanununun ek 2 nci maddesine göre, bir kurum, kuruluş veya birlik hakkında elektronik tebligat zorunluluğunun ortadan kalkması hâlinde izlenecek bildirim ve işlem süreci aşağıdakilerden hangisinde doğru verilmiştir?","kayitBaslik":"","id":"sgs-t1-vergi-cokzor/kp-20","verilenler":[{"deger":"ek 2 nci madde","anlam":"7201 sayılı Tebligat Kanununda elektronik tebligat zorunluluğunun kaldırılması durumunda izlenecek süreci belirleyen hüküm.","ad":"Ek 2 nci madde"}],"dayanak":"7201 sayılı Tebligat Kanunu ek m.2, son fıkra","dogru":"C","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: Bir kooperatif, elektronik tebligat sistemine 2019 yılında dahil olmuş, 2023 yılında ise 7/a maddesindeki şart ortadan kalkmış.","anlatim":"Kooperatif artık zorunlu değil ama bunu kimseye söylemezse sistemde askıda kalır. Kanun bu noktada iki ayrı işlem öngörüyor. Kim, ne zaman, kime bildirecek, onu çözeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Kooperatif durumu bir ay içinde bildirir, Posta ve Telgraf Teşkilatı Anonim Şirketi bildirimi takip eden bir ay içinde işlem yapar.","anlatim":"İki tane bir aylık süre var ve sıra önemli: önce kurum bildirir, sonra PTT işlem yapar. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"7201 s.K. ek m.2, son fıkra","karar":"yanlış","anlatim":"Hayır, kanunda tespiti PTT yapmıyor, bildirimi kooperatif yapıyor. Taraflar ve sıra ters çevrilmiş. Bu yüzden yanlış bir ifade.","formul":"Şık A: birisi sana \u0027PTT önce bir ay içinde kendisi tespit eder, sonra kooperatif bir ay içinde işlem yapar\u0027 diyor, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"7201 s.K. gec. m.2","karar":"yanlış","anlatim":"Üç aylık süre geçici madde 2\u0027deki ilk kurulum sürecine ait, burada geçmiyor. Bildirim süresi bir aydır, üç ay değil. Bu yüzden yanlış.","formul":"Şık B: birisi \u0027kooperatif durumu üç ay içinde bildirir, PTT bir ay içinde işlem yapar\u0027 diyor, doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"7201 s.K. ek m.2, son fıkra","karar":"doğru","anlatim":"Evet, ek madde 2 son fıkra tam bunu söylüyor. İki bir aylık süre peş peşe, bildirim önce PTT işlemi sonra. Bu ifade doğru.","formul":"Şık C: birisi \u0027kooperatif durumu bir ay içinde bildirir, PTT bildirimi takip eden bir ay içinde işlem yapar\u0027 diyor, doğru mu?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"5510 s. SGK Kanunu m.8 ile karıştırma","karar":"yanlış","anlatim":"Bu cümle sigortalılık tescilinden bahsediyor ama burada konu elektronik tebligat adresi. Sigortalıya bildirim başka kanunun konusu, burada geçmiyor. Bu yüzden yanlış.","formul":"Şık D: birisi \u0027kooperatif durumu tescil tarihinden itibaren bir ay içinde sigortalıya bildirir, başka süre aranmaz\u0027 diyor, doğru mu?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"7201 s.K. ek m.2, son fıkra","karar":"yanlış","anlatim":"Kanun açıkça iki ayrı bir aylık süre öngörüyor, derhal işlem diye bir şey yok. Süresizlik iddiası metne aykırı. Bu yüzden yanlış.","formul":"Şık E: birisi \u0027süre aranmaz, bildirim yapılır yapılmaz PTT derhal işlem yapar\u0027 diyor, doğru mu?"}],"anahtar":[{"ornek":"bildirir","kok":"bildir"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"içinde","kok":"içinde"},{"ornek":"burada","kok":"burada"},{"ornek":"kurulum","kok":"kurulu"},{"ornek":"elektronik","kok":"elektr"}],"konuGiris":{"harita":"Ne zaman bildirim yapılır: kurum, elektronik tebligat zorunluluğunun kalktığını öğrendiğinde. Kim ne kadar sürede bildirir: ilgili kurum, kuruluş veya birlik bir ay içinde PTT AŞ\u0027ye bildirir. Sonra ne olur: PTT AŞ bu bildirimi takip eden bir ay içinde gerekli işlemi yapar.","desen":"Sınav genelde iki süreyi (bildirim ve işlem) birbirine karıştırtarak ya da sırasını ters göstererek sorar. Bazı seçenekler süreyi bir ay yerine on beş gün ya da üç ay gösterir, bu bilinçli bir tuzaktır. Bu soru Tebligat K. ek m.2 hükmünden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Kurum/kuruluşun artık elektronik tebligat almak zorunda olmadığı hâl.","ad":"Elektronik tebligat zorunluluğunun kalkması","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Zorunluluğun kalktığını PTT AŞ\u0027ye bildirmekle yükümlü taraf.","ad":"İlgili kurum, kuruluş veya birlik","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kurumun durumu PTT AŞ\u0027ye bildirmesi için tanınan süre.","ad":"Bir aylık bildirim süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bildirimi takip eden bir ay içinde PTT AŞ\u0027nin yapacağı işlem süresi.","ad":"PTT AŞ\u0027nin işlem süresi","kim":"kanun sabitler"}],"sinavda":"Soru, zorunluluğun kalkması hâlinde bildirim ve işlem sürelerinin doğru sırayla verildiği seçeneği ister.","panel_ornek":"Bir spor kulübüne üye olduğunda üyelik sistemi 5 gün içinde seni kayıt listesine ekler, sen ayrıldığında da kulüp yönetimi 5 gün içinde çıkışını sisteme bildirmek zorundadır. Burada iki taraf da kendi süresi içinde harekete geçmelidir, biri geç kalırsa süreç aksar.","ornek":"Bir spor kulübüne üye olduğunda üyelik sistemi 5 gün içinde seni kayıt listesine ekler, sen ayrıldığında da kulüp yönetimi 5 gün içinde çıkışını sisteme bildirmek zorundadır. Burada iki taraf da kendi süresi içinde harekete geçmelidir, biri geç kalırsa süreç aksar.","yontemler":"İki sürenin de bir ay olduğunu ve bildirimin önce kurumdan, işlemin sonra PTT AŞ\u0027den geldiğini sırayla ezberleyin.","nedir":"Elektronik tebligat, kurum ve kuruluşlar için zorunluluk başlayınca ya da sona erince yapılması gereken bildirim ve işlem sürecini düzenler. Sınav, bu sürecin süreleri ve kimin ne yapacağını doğru sırayla bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"D":{"ad":"Kanun Karışıklığı Tuzağı","metin":"Öğrenci elektronik tebligat sürecini 5510 sayılı Kanunun 8 inci maddesindeki sigortalılık tescil bildirimi süresiyle karıştırır, bu madde tebligat adresiyle ilgili değildir. Doğrusu: elektronik tebligat süreci yalnız 7201 sayılı Kanunun ek 2 nci maddesine tabidir."},"E":{"ad":"Süre Yokmuş Gibi Tuzağı","metin":"Öğrenci kanunda açıkça belirtilen bir aylık bildirim ve bir aylık işlem sürelerinin bulunmadığını, sürecin anında işlediğini varsayar. Doğrusu: kanun her iki adım için ayrı ayrı birer aylık süre öngörür."},"A":{"ad":"Taraf Karıştırma Tuzağı","metin":"Öğrenci bildirim yükümlülüğünü Posta ve Telgraf Teşkilatı Anonim Şirketine, işlem yükümlülüğünü ilgili kuruma yükleyerek tarafları ters kurar. Doğrusu: bildirimi ilgili kurum, kuruluş veya birlik yapar; işlemi Posta ve Telgraf Teşkilatı Anonim Şirketi yapar."},"B":{"ad":"Süre Karıştırma Tuzağı","metin":"Öğrenci ek madde 2\u0027deki bir aylık bildirim süresini, geçici madde 2\u0027de adres oluşturma için PTT\u0027ye tanınan üç aylık süreyle karıştırır. Doğrusu: bildirim süresi de bir aydır, üç ay yalnız geçici maddedeki ilk adres oluşturma sürecine özgüdür."}},"celdiriciYol":{},"hap":"Elektronik tebligat zorunluluğunun kalkması hâlinde ilgili kurum bir ay içinde bildirir, PTT bu bildirimi takip eden bir ay içinde işlem yapar; üç aylık süre yalnız geçici maddedeki ilk kurulum sürecine özgüdür.","teshis":{"C":{"gercek":"Ek madde 2 son fıkra açıkça iki ayrı bir aylık süre öngörür: önce kurum bildirir, sonra PTT işlem yapar.","ayirt":"Kanun metninde iki \u0027bir ay\u0027 ifadesi peş peşe mi geçiyor?","paragraf":"7201 s.K. ek m.2, son fıkra","yanilgi":"İki farklı bir aylık sürenin aynı anda geçtiğini fark etmeyip bunlardan birinin farklı olması gerektiğini düşünüyorsun."},"E":{"gercek":"Ek madde 2 son fıkra açıkça iki ayrı bir aylık süre öngörür, süresiz derhal işlem yapılmaz.","ayirt":"Metinde \u0027bir ay içinde\u0027 ifadesi kaç kez ve hangi işlemler için geçiyor?","paragraf":"7201 s.K. ek m.2, son fıkra","yanilgi":"Kanunun süre öngörmediğini, sürecin anında işlediğini düşünüyorsun."},"A":{"gercek":"Ek madde 2 son fıkra: bildirimi ilgili kurum, kuruluş veya birlik yapar; PTT bunu takiben işlem yapar, sıra tersine dönmez.","ayirt":"Metinde hangi kurum ilk hareketi başlatıyor, kim onu takip ediyor?","paragraf":"7201 s.K. ek m.2, son fıkra","yanilgi":"Bildirim ve işlem tarafını birbirine karıştırıp PTT\u0027nin önce tespit yaptığını sanıyorsun."},"D":{"gercek":"Sigortalılık tescil bildirimi 5510 sayılı Kanunun 8 inci maddesine, elektronik tebligat adres süreci ise 7201 sayılı Kanunun ek 2 nci maddesine aittir; ayrı düzenlemelerdir.","ayirt":"Bu hüküm hangi kanunun hangi maddesinde, konu tebligat adresi mi yoksa sigortalılık mı?","paragraf":"5510 s. SGK Kanunu m.8 ile karıştırma","yanilgi":"Elektronik tebligat sürecini sigortalılık tescil bildirimiyle aynı kanuna ait sanıyorsun."},"B":{"gercek":"Üç ay yalnız geçici madde 2\u0027deki ilk kurulum sürecine aittir; ek madde 2\u0027deki bildirim süresi bir aydır.","ayirt":"Bu üç ay hangi maddede, tek seferlik ilk kurulum için mi yoksa sürekli işleyen süreç için mi geçiyor?","paragraf":"7201 s.K. ek m.2 / geçici m.2","yanilgi":"Geçici maddedeki üç aylık adres oluşturma süresini, sürekli işleyen bildirim süreciyle aynı sanıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 113"},"kural":"Kanunun 2 nci maddesinin 5 inci fıkrası uyarınca arsa sahibinin arsa payı teslimi de müteahhidin konut teslimi de teslim sayılır; ancak Kanunun 1 inci maddesine göre vergiye tabi olmak için işlemin ticari, sınai, zirai veya serbest meslek faaliyeti çerçevesinde yapılması gerekir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 113","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Teslim sayılma ile vergiye tabi işlem olma şartını her zaman iki ayrı basamak olarak kontrol et.","konu":"kdv vergiye tabi işlemler","tablo":{"satirlar":[["VERİLENLER","-","-"],["Arsa sayısı","tek arsa","-"],["Alınan daire sayısı","3 daire","-"],["HESAP","-","-"],["A) Arsa sahibinin arsa payı teslimi ile müteahhidin konut t…","p.1/1, p.2/5","YANLIŞ ifade"],["B) Arsa sahibinin arsa payı teslimi Kanunun 2 nci maddesi u…","p.1/son, p.2/5","doğru ifade"],["C) Müteahhidin konut teslimi ticari faaliyet çerçevesinde g…","p.1/1, p.2/5","YANLIŞ ifade"],["D) Arsa sahibinin arsa payı devri trampa hükümleri kapsamın…","p.2/5","YANLIŞ ifade"],["E) İşlemin tamamı, arsa sahibinin gerçek kişi olması nedeni…","p.1/son","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Müteahhidin konut teslimi ticari faaliyet çerçevesinde gerçekleştirildiğinden değil, yalnızca trampa hükmü gereği katma değer vergisinin konusuna girer","E":"İşlemin tamamı, arsa sahibinin gerçek kişi olması nedeniyle katma değer vergisinin konusu dışında kalır","A":"Arsa sahibinin arsa payı teslimi ile müteahhidin konut teslimi, Kanunun 2 nci maddesi uyarınca teslim sayıldığından her ikisi de katma değer vergisinin konusuna girer","D":"Arsa sahibinin arsa payı devri trampa hükümleri kapsamında değerlendirilemeyeceğinden hiçbir şekilde teslim sayılmaz","B":"Arsa sahibinin arsa payı teslimi Kanunun 2 nci maddesi uyarınca teslim sayılır; ancak bu teslim ticari faaliyet çerçevesinde yapılmadığından katma değer vergisinin konusuna girmez"},"kaynak":{"alinti":"","liste":[{"ad":"KDVK (3065 s.K.) m.2 - Teslim","metin":"Teslim: Madde 2 – 1. Teslim, bir mal üzerindeki tasarruf hakkının malik veya onun adına hareket edenlerce, alıcıya veya adına hareket edenlere devredilmesidir. Bir malın alıcı veya onun adına hareket edenlerin gösterdiği yere veya kişilere tevdii teslim hükmündedir. Malın alıcıya veya onun adına hareket edenlere gönderilmesi halinde, malın nakliyesinin başlatılması veya nakliyeci veya sürücüye tevdi edilmesi de mal teslimidir. 2. Bir mal üzerindeki tasarruf hakkının iki veya daha fazla kimse tarafından zincirleme akit yapılmak suretiyle, malın bu arada el değiştirmeden doğrudan sonuncu kişiye devredilmesi halinde, aradaki safhaların her biri ayrı bir teslimdir. 3. Su, elektrik, gaz, ısıtma, soğutma ve benzeri şekillerdeki dağıtımlar da mal teslimidir. 4. (Değişik: 3/6/1986-3297/1 md.) Kap ve ambalajlar ile döküntü ve tali maddelerin geri verilmesinin mutat olduğu hallerde teslim bunlar dışında kalan maddeler itibariyle yapılmış sayılır. Bunların yerine aynı cins ve mahiyette kap ve ambalajlar ile döküntü tali maddelerin geri verilmesinde de aynı hüküm uygulanır. 5. Trampa iki ayrı teslim hükmündedir. (Ek cümle: 29/3/2018-7104/1 md.) Bu Kanunun uygulanmasında arsa karşılığı inşaat işlerinde; arsa sahibi tarafından konut veya işyerine karşılık müteahhide arsa payı teslimi, müteahhit tarafından arsa payına karşılık arsa sahibine konut veya işyeri teslimi yapılmış sayılır.1"},{"ad":"KDVK (3065 s.K.) m.1 - BİRİNCİ BÖLÜM Verginin Konusu Verginin konusunu teşkil eden işlemler [1/2]","metin":"BİRİNCİ BÖLÜM Verginin Konusu Verginin konusunu teşkil eden işlemler: Madde 1 – Türkiye\u0027de yapılan aşağıdaki işlemler katma değer vergisine tabidir: 1. Ticari, sınai, zirai faaliyet ve serbest meslek faaliyeti çerçevesinde yapılan teslim ve hizmetler, 2. Her türlü mal ve hizmet ithalatı, 3. Diğer faaliyetlerden doğan teslim ve hizmetler: a) Posta, telefon, telgraf, teleks ve bunlara benzer hizmetler ile radyo ve televizyon hizmetleri, b) (Değişik: 14/3/2007-5602/10 md.) Her türlü şans ve talih oyunlarının tertiplenmesi ve oynanması, c) Profesyonel sanatçıların yer aldığı gösteriler ve konserler ile profesyonel sporcuların katıldığı sportif faaliyetler, maçlar, yarışlar ve yarışmalar tertiplenmesi, gösterilmesi, d) (Değişik : 16/6/2009-5904/8 md.) Müzayede mahallerinde ve gümrük depolarında yapılan satışlar ile 10/2/2005 tarihli ve 5300 sayılı Tarım Ürünleri Lisanslı Depoculuk Kanununa göre düzenlenen ürün senetlerinin, senedin temsil ettiği ürünü depodan çekecek olanlara teslimi, e) Boru hattı ile hampetrol, gaz ve bunların ürünlerinin taşınmaları, f) Gelir Vergisi Kanununun 70 inci maddesinde belirtilen mal ve hakların kiralanması işlemleri, g) Genel ve katma bütçeli idarelere, il özel idarelerine, belediyeler ve köyler ile bunların teşkil ettikleri birliklere, üniversitelere, dernek ve vakıflara, her türlü mesleki kuruluşlara ait veya tabi olan veyahut bunlar tarafından kurulan veya işletilen müesseseler ile döner sermayeli kuruluşların veya bunlara ait veya tabi diğer müesseselerin ticari, sınai, zirai ve mesleki nitelikteki teslim ve hizmetleri, h) Rekabet eşitsizliğini…"}],"hakem":"Doğru sık, KDV Kanunu m.1/1 (ticari faaliyet şartı) ve m.2/5 (trampa ve arsa karşılığı inşaat işleri tanımı) ile kaynak metinde açıkça desteklenmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"Gerçek kişi Mehmet, ticari faaliyeti bulunmaksızın sahip olduğu tek arsasını kat karşılığı inşaat sözleşmesiyle bir inşaat şirketine devretmiş, karşılığında tamamlanan binadan 3 daire almıştır. Bu işleme ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-vergi-cokzor/kp-25","verilenler":[{"deger":"tek arsa","anlam":"Arsa sahibinin işlemi devamlılık taşımadığını, arızi nitelikte olduğunu gösterir.","ad":"Arsa sayısı"},{"deger":"3 daire","anlam":"Kat karşılığı sözleşmenin karşılığını gösterir, işlemin trampa/arsa karşılığı inşaat niteliğini kanıtlar; hesaba doğrudan girmez.","ad":"Alınan daire sayısı"}],"dayanak":"3065 sayılı KDV Kanunu m.1/1, m.1/son ve m.2/5 (7104 sayılı Kanunla eklenen ek cümle)","dogru":"B","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Olay: İzmir\u0027de emekli öğretmen Ayşe Hanım, miras kalan tek arsasını 2021 Mart\u0027ında bir müteahhide kat karşılığı verdi. Müteahhit karşılığında Ayşe Hanım\u0027a 2 daire teslim etti, kendisi ise geri kalan 8 daireyi piyasada sattı.","anlatim":"Ayşe Hanım hayatında hiç ticaret yapmamış, sadece elindeki tek arsayı devretmiş. Müteahhit ise bu işi meslek olarak yapıyor, sürekli inşaat yapıp satıyor. Aynı olayda iki taraf var ama ikisinin durumu çok farklı.","doldur":[]},{"formul":"Ne yapacağız: Kanunun 2 nci maddesinin 5 inci fıkrasına göre arsa payı ile konut/işyeri teslimi trampa sayılır, yani her ikisi de \u0027teslim\u0027dir. Ama Kanunun 1 inci maddesine göre vergiye tabi olmak için işlemin ticari faaliyet çerçevesinde yapılması şart. Şimdi beş ifadeyi Ayşe Hanım\u0027ın olayında tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"p.1/1, p.2/5","karar":"yanlış","anlatim":"Teslim sayılmak başka, vergiye tabi olmak başka şeydir. Ayşe Hanım\u0027ın tek seferlik devri ticari faaliyet değildir, o yüzden ikisi birden konuya girmez.","formul":"Şık A: biri sana \u0027Ayşe Hanım\u0027ın arsa teslimi de, müteahhidin konut teslimi de ikisi birden vergiye tabidir\u0027 dese, buna katılır mısın?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"p.1/son, p.2/5","karar":"doğru","anlatim":"Ayşe Hanım\u0027ın işlemi Kanunun 2/5 fıkrasına göre teslimdir, bu doğru. Ama tek seferlik ve arızi olduğu için Kanunun 1 inci maddesindeki ticari faaliyet şartını taşımaz, dolayısıyla konuya girmez.","formul":"Şık B: \u0027Ayşe Hanım\u0027ın arsa payı devri teslim sayılır ama ticari faaliyeti olmadığından vergiye tabi değildir\u0027 desen, doğru mu söylemiş olursun?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"p.1/1, p.2/5","karar":"yanlış","anlatim":"Trampa hükmü sadece kaç teslim olduğunu sayar, vergiye tabi olma nedenini göstermez. Müteahhit zaten sürekli inşaat yapıp satan biri, onun teslimi ticari faaliyet yüzünden konuya girer.","formul":"Şık C: \u0027Müteahhidin konut teslimi ticari faaliyetten değil, sadece trampa hükmünden dolayı vergiye tabidir\u0027 dese biri, kabul eder misin?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"p.2/5","karar":"yanlış","anlatim":"Kanun burada açıkça 7104 sayılı değişiklikle arsa karşılığı inşaat işlerini teslim saymış. Yani arsa payı devri kesinlikle teslimdir, sadece vergiye tabi olmayabilir.","formul":"Şık D: \u0027Ayşe Hanım\u0027ın arsa devri trampa sayılmaz, hiç teslim değildir\u0027 desen, doğru olur mu?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"p.1/son","karar":"yanlış","anlatim":"Kanunun 1 inci maddesinin son fıkrasına göre kişinin hukuki statüsü vergilendirmeye engel değildir. Ayşe Hanım\u0027ın işlemi konuya girmese de müteahhidin teslimi ayrı değerlendirilir, tamamı vergi dışı sayılmaz.","formul":"Şık E: \u0027Ayşe Hanım gerçek kişi olduğu için işlemin tamamı vergi dışıdır\u0027 dese biri, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Teslim sayılmakla vergiye tabi olmak farklı iki soru, ikisini karıştırmamak gerekiyor. Kendine hep şunu sor: bu işlem teslim mi, yoksa ticari faaliyet çerçevesinde yapılan bir teslim mi?","doldur":[]}],"anahtar":[{"ornek":"teslim","kok":"teslim"},{"ornek":"kanunun","kok":"kanunu"},{"ornek":"ticari","kok":"ticari"},{"ornek":"maddesine","kok":"maddes"},{"ornek":"vergiye","kok":"vergiy"},{"ornek":"faaliyet","kok":"faaliy"}],"konuGiris":{"harita":"Ne zaman test edilir: işlemi yapan kişinin faaliyeti ticari nitelik taşıyor mu diye bakılır. Nasıl ölçülür: devamlılık, kapsam ve nitelik Gelir Vergisi Kanunu hükümlerine göre belirlenir. Nasıl kaydedilir: arsa karşılığı inşaatta arsa sahibinin payı ile müteahhidin daire teslimi ayrı ayrı değerlendirilir.","desen":"Sınav, tek seferlik ve ticari amaç taşımayan kişisel arsa devrini ticari faaliyetle karıştırıp öğrenciyi \u0027KDV\u0027ye tabidir\u0027 tuzağına düşürür. Asıl ayrım, müteahhidin ticari faaliyeti ile Mehmet\u0027in ticari faaliyet dışı kalan devri arasındadır. Bu soru KDVK m.1 ve
