<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".

   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. Koyu tema yalnız düğmeyle (data-theme="dark", tarayıcıda kc_tema) ya da ?tema=koyu ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}

.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}
#akis{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.kart{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;max-width:560px;margin:0 auto}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.78em;color:var(--dim);margin-bottom:8px}
.noktalar{display:flex;gap:5px}.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--cizgi);display:block}.noktalar i.ok{background:var(--yesil)}.noktalar i.yan{background:var(--kirmizi)}.noktalar i.simdi{outline:2px solid var(--mavi);outline-offset:1px}
.noktalar.cok{gap:3px;flex-wrap:wrap;max-width:58%;justify-content:center}.noktalar.cok i{width:5px;height:5px}
.tt.teori td:first-child{white-space:nowrap;font-weight:700;color:var(--dim);width:1%}
.sinavDil{font:inherit;font-size:.78em;color:var(--mavi);background:transparent;border:1px solid var(--cizgi);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer}
.sinavDilM{margin-top:6px;font-size:.86em;color:var(--dim);border-left:2px solid var(--cizgi);padding-left:8px}
.govde{flex:1;overflow-y:auto;padding-bottom:90px}
.rozet{display:inline-block;font-size:.72em;color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 50%,transparent);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}
.ipucu{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:.8em;pointer-events:none;animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.panel.acik{transform:translateY(0)}.tutamac{width:38px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 10px}
/* Cem 03.09 "gorunum boyle geliyor": KAPALI panel kartin altina (105%) kayiyor ve SONRAKI KARTIN ustune biniyordu.

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}

.ozet{font-size:.93em;margin:0 0 8px;line-height:1.45}.ozet b{color:var(--yesil)}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}

.cip2.ek{display:none}.cipler.acikEk .cip2.ek{display:inline-block}.cipler.acikEk .bDaha{color:var(--dim)}
.cipler .bDaha{border-style:dashed;color:var(--dim)}
.sek{display:none;margin-top:8px}.sek.acik{display:block;animation:gir .2s ease}
.panel{overscroll-behavior:contain}
.kavramL{margin:4px 0 8px;padding-left:18px}.kavramL li{margin:3px 0}.kavramL i{color:var(--dim);font-style:normal;font-size:.85em}
.panelBas{position:sticky;bottom:4px;display:block;margin:10px 0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:.84em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent)}

/* yanlis kutusu + hazirlik skoru */
.ustSag{display:flex;align-items:center;gap:6px}
.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}
.kutuEkran{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}.kutuEkran.acik{display:flex}
.kutuIc{background:var(--kart);width:min(100%,640px);max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 22px;border:1px solid var(--cizgi)}
@media(min-width:900px){.kutuEkran{align-items:center}.kutuIc{border-radius:18px}}
.kutuIc .basl{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}

.dersSat{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92em}.dersSat .bar{height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden}.dersSat .bar i{display:block;height:100%;background:var(--yesil)}
.kutuSat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.92em}
/* kaynak metni */
.kaynakAd{color:var(--mavi);font-weight:800;font-size:.85em;margin:8px 0 4px}.kaynakMetin{font-size:.9em;line-height:1.55;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px}.kaynakMetin mark{background:color-mix(in srgb,var(--altin) 35%,transparent);color:var(--yazi);padding:1px 2px;border-radius:3px}
/* sen anlat / t-hesabi / sinavda */
.ipnot{font-size:.84em;color:var(--dim);margin:2px 0 8px}
.anlatK{width:100%;background:var(--bg2);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 11px;font-size:.95em;font-family:inherit;resize:vertical}
.anlatSonuc{font-size:.92em;margin-top:8px;line-height:1.5}.anlatPuan{font-weight:800;font-size:1.05em;margin-bottom:4px}.anlatOrnek{margin-top:8px;border-left:4px solid var(--altin);padding:6px 10px;background:color-mix(in srgb,var(--altin) 8%,transparent);border-radius:0 8px 8px 0}
.tKutular{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:600px){.tKutular{grid-template-columns:1fr 1fr}}

.tGovde{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--yazi);min-height:88px}.tSol{border-right:2px solid var(--yazi);padding:6px 8px}.tSag{padding:6px 8px;text-align:right}

.cikmisK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.88em;color:var(--dim);line-height:1.45}.cikmisK .yil{display:inline-block;background:color-mix(in srgb,var(--mavi) 15%,transparent);color:var(--mavi);font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.85em}

.ogret{margin:4px 0 6px}.thpNot{font-size:.85em;color:var(--dim);margin:2px 0 8px}
.hesapK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.9em;line-height:1.45}.hesapK.yan{border-color:color-mix(in srgb,var(--kirmizi) 60%,transparent)}.hesapK.dog{border-color:color-mix(in srgb,var(--yesil) 60%,transparent)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.btn{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;font-size:.9em;cursor:pointer}.btn.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0}.btn.mavi{border-color:var(--mavi);color:var(--mavi)}
/* surukleme oyunu */

.oyun{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:20;overflow-y:auto}.oyun.acik{display:flex}

#akis,.govde,.tabloSar,.serit,.panel,.oyun{scrollbar-width:none}#akis::-webkit-scrollbar,.govde::-webkit-scrollbar,.tabloSar::-webkit-scrollbar,.serit::-webkit-scrollbar,.panel::-webkit-scrollbar,.oyun::-webkit-scrollbar{display:none}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

const SORULAR=[{"capa":{"kaynak":"SGS 2026/2 Soru 69"},"kural":"net satış = kalem tutarı / (kalem yüzdesi/100); ardından her kalem kendi yüzdesiyle net satıştan türetilir, faaliyet karı yüzdesi = 100 - SMM yüzdesi - faaliyet gideri yüzdesi.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 69","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce hangi kalemin hem tutarı hem yüzdesi verilmiş bul, tabanı (net satışı) oradan kur; finansman gideri gibi faaliyet dışı kalemleri zincire hiç sokma.","konu":"dikey yüzde analizi","tablo":{"satirlar":[["VERİLENLER","-"],["SMM yüzdesi","%65"],["SMM tutarı","520.000 TL"],["Faaliyet giderleri yüzdesi","%20"],["Finansman gideri","30.000 TL"],["HESAP","-"],["Net Satışlar (520.000 / 0,65)","800.000"],["Satılan Malın Maliyeti","520.000"],["Brüt Satış Karı (800.000 - 520.000)","280.000"],["Faaliyet Giderleri (800.000 x 0,20)","160.000"],["Faaliyet Karı (280.000 - 160.000)","120.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"120.000","E":"640.000","A":"50.700","D":"176.000","B":"90.000"},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.275 - İmal edilen emtia","metin":"İmal edilen emtia: Madde 275 – İmal edilen emtianın (Tam ve yarı mamul mallar) maliyet bedeli aşağıda yazılı unsurları ihtiva eder: 1. Mamulün vücuda getirilmesinde sarf olunan iptidai ve ham maddelerin bedeli; 2. Mamule isabet eden işçilik; 3. Genel imal giderlerinden mamule düşen hisse; 4. Genel idare giderlerinden mamule düşen hisse; (Bu hissenin mamulün maliyetine katılması ihtiyaridir.) 5. Ambalajlı olarak piyasaya arz edilmesi zaruri olan mamullerde ambalaj malzemesinin bedeli. Mükellefler, imal ettikleri emtianın maliyet bedellerini yukarıki unsurları ihtiva etmek şartiyle diledikleri usulde tayin edebilirler. (Üçüncü fıkra mülga: 30/12/1980-2365/51 md.)"},{"ad":"Teori Notu - dikey yuzde analizi","metin":"Tetikte Teori Notu (mali analiz literatürünün yerleşik tanımı): Dikey yüzde yönteminde her tablo kalemi, ait olduğu toplamın yüzdesi olarak ifade edilir. Bilançoda baz AKTİF TOPLAMI (pasif tarafında pasif toplamı) = 100; gelir tablosunda baz NET SATIŞLAR = 100 alınır. Ayrıca kalemin kendi grubu içindeki payı da (grup yüzdesi) hesaplanabilir. Dikey analiz TEK dönemin iç yapısını gösterir; işletmeler arası karşılaştırmaya ve sektör ortalamasıyla kıyasa uygundur. Dönemler arası GELİŞİMİ ölçmek için karşılaştırmalı tablolar (yatay) analizi ve eğilim (trend) yüzdeleri kullanılır: yatay analizde iki dönem arasındaki mutlak ve yüzde değişim; trend analizinde baz yıl 100 kabul edilerek her yılın baz yıla oranı hesaplanır. Yaygın tuzaklar: gelir tablosunda brüt satışları baz almak (doğrusu net satışlar), bilanço ile gelir tablosunun bazlarını karıştırmak, dikey analizle dönemler arası eğilim yorumu yapmak."}],"hakem":"Soru, dikey yüzde analizinde net satışlardan hareketle faaliyet karını hesaplama kuralını ve tekniğini soruyor; kaynak metinlerde (Teori Notu - dikey yuzdelerden net satış ve gelir tablosu hesaplamaları) bu kural açıkça desteklenmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[],"donemler":["2026/2","2025/3","2024/3","2024/2","2020/2","2019/3","2019/1","2018/3","2016/2","2015/2","2015/1"]},"oyun":{"bosluk":[[0,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Net Satışlar (600.000 / 0,60)","1.000.000"],["Satılan Malın Maliyeti","600.000"],["Brüt Satış Karı (1.000.000 - 600.000)","400.000"],["Faaliyet Giderleri (1.000.000 x 0,25)","250.000"],["Faaliyet Karı (400.000 - 250.000)","150.000"]]},"tur":"tablo","soru":"İşletmenin 2026 yılı gelir tablosu dikey yüzde analizinde satılan malın maliyeti net satışların %60\u0027ı, faaliyet giderleri toplamı ise net satışların %25\u0027idir. Aynı döneme ait satılan malın maliyeti 600.000 TL, finansman gideri ise 40.000 TL olarak gerçekleşmiştir. Bu verilere göre işletmenin brüt satış karı kaç TL\u0027dir?","verilen":[[1,1]],"hedef":"Tabloyu doldur ve işletmenin brüt satış karının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin 2026 yılı gelir tablosu dikey yüzde analizinde satılan malın maliyeti net satışların %65\u0027i, faaliyet giderleri toplamı ise net satışların %20\u0027sidir. Aynı döneme ait satılan malın maliyeti 520.000 TL, finansman gideri ise 30.000 TL olarak gerçekleşmiştir. Bu verilere göre işletmenin faaliyet karı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-mta-cokzor/kp-01","verilenler":[{"deger":"%65","anlam":"Satılan malın maliyetinin net satışlar içindeki dikey yüzdesi; net satışı türetmek için bölen olarak kullanılır.","ad":"SMM yüzdesi"},{"deger":"520.000 TL","anlam":"Satılan malın maliyetinin gerçekleşen tutarı; yüzdesiyle birlikte net satışı bulmayı sağlar.","ad":"SMM tutarı"},{"deger":"%20","anlam":"Faaliyet giderlerinin net satışlar içindeki payı; net satışa uygulanarak faaliyet gideri tutarı bulunur.","ad":"Faaliyet giderleri yüzdesi"},{"deger":"30.000 TL","anlam":"Çeldirici veri; faaliyet karından sonra düşülen bir kalemdir, faaliyet karı hesabına dahil edilmez.","ad":"Finansman gideri"}],"dayanak":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","dogru":"C","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Soruda ne var: SMM yüzdesi %65, faaliyet gideri yüzdesi %20 (soruda verilen); SMM tutarı 520.000 (soruda verilen); istenen: faaliyet karı","anlatim":"Soru bize şunları vermiş: satılan malın maliyeti net satışların %65\u0027i, faaliyet giderleri net satışların %20\u0027si; satılan malın maliyeti 520.000 TL (soruda verilen), finansman gideri 30.000 TL (soruda verilen, bu soruda kullanılmayacak).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[7,1]]},{"formul":"Net Satışlar = SMM Tutarı / (SMM Yüzdesi) = 520.000 (soruda verilen) / %65 (soruda verilen) = 800.000 TL","anlatim":"Dikey yüzde analizi nedir? Her kalemi net satışlara bölüp yüzde olarak gösteririz. Burada SMM\u0027nin yüzdesini ve tutarını bilince net satışı geriye doğru bulabiliriz.","doldur":[[6,1]]},{"formul":"Satılan Malın Maliyeti = 520.000 (soruda verilen)","anlatim":"Net satışları bulduk, şimdi satılan malın maliyetini tabloya yerleştiriyoruz. Bu değer zaten soruda verilmişti, tekrar hesaplamıyoruz.","doldur":[[7,1]]},{"formul":"Brüt Satış Karı = Net Satışlar - SMM = 800.000 (2. adımda bulduk) - 520.000 (soruda verilen) = 280.000 TL","anlatim":"Brüt satış karı nedir? Net satıştan malın maliyetini çıkarınca kalan tutardır - satışın ilk kâr katmanıdır.","doldur":[[8,1]]},{"formul":"Faaliyet Giderleri = Net Satışlar × %20 (soruda verilen) = 800.000 (2. adımda bulduk) × %20 = 160.000 TL","anlatim":"Faaliyet giderleri nedir? Pazarlama, genel yönetim gibi giderlerdir; burada net satışın %20\u0027si olarak verilmiş, net satışı bulunca tutarını çıkarabiliriz.","doldur":[[9,1]]},{"formul":"Kapsam: Faaliyet Karı = Brüt Satış Karı - Faaliyet Giderleri; Dahil değil: finansman gideri 30.000 (soruda verilen)","anlatim":"Finansman gideri 30.000 TL soruda verilmiş ama faaliyet karına dahil değil, çünkü faaliyet karı esas faaliyetten doğan giderleri kapsar. Dahil değil: finansman gideri 30.000 (soruda verilen).","doldur":[]},{"formul":"Faaliyet Karı = Brüt Satış Karı - Faaliyet Giderleri = 280.000 (4. adımda bulduk) - 160.000 (5. adımda bulduk) = 120.000 TL","anlatim":"Faaliyet karı nedir? Brüt kârdan faaliyet giderlerini düşünce kalan, işletmenin asıl işinden kazandığı kârdır.","doldur":[[10,1]]},{"formul":"Sonuç: Faaliyet Karı = 120.000 TL","anlatim":"Sonuç olarak işletmenin faaliyet karı 120.000 TL çıktı. Bu tutar sadece esas faaliyetten gelen kârı gösterir.","doldur":[]},{"formul":"Yanlış yol: 280.000 - 160.000 - 30.000 = 90.000 (HATALI) → doğrusu 120.000 (7. adımda bulduk)","anlatim":"En sık hata: finansman giderini de faaliyet giderlerine katıp 280.000-160.000-30.000 yapmak. Finansman gideri esas faaliyet dışıdır, faaliyet karına girmez.","doldur":[]}],"anahtar":[{"ornek":"faaliyet","kok":"faaliy"},{"ornek":"yüzdesi","kok":"yüzdes"},{"ornek":"giderleri","kok":"giderl"},{"ornek":"gideri","kok":"gideri"},{"ornek":"finansman","kok":"finans"},{"ornek":"maliyeti","kok":"maliye"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu veya bilançoda kalemlerin yalnızca yüzdeleri (bazen bir kalemin tutarı) verildiğinde. Nasıl ölçülür: verilen tutar ve yüzdeden önce net satışlar bulunur, sonra diğer kalemler kendi yüzdeleriyle hesaplanır. Nasıl kaydedilir: zincirleme çıkarma ile net satışlardan SMM ve faaliyet giderleri düşülerek faaliyet karına ulaşılır.","desen":"Sınav genelde bir kalemin hem tutarını hem yüzdesini vererek önce net satışları buldurur, sonra zincirleme diğer kalemlere geçer. Tuzak, finansman giderinin faaliyet giderleri arasına katılmasıdır; oysa finansman gideri faaliyet karından sonra düşülür. Bu soru, gelir tablosu dikey yüzdelerinden net satış ve faaliyet karı hesaplama noktasından geliyor (p. Teori-Dikey yüzdelerden net satış).","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Gelir tablosu dikey analizinde baz alınan, %100 kabul edilen tutar","ad":"Net satışlar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"SMM\u0027nin net satışlara oranı, brüt kâr hesabında kullanılır","ad":"Satılan malın maliyeti yüzdesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Pazarlama, genel yönetim gibi giderlerin net satışlara oranı","ad":"Faaliyet giderleri yüzdesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Brüt satış karından faaliyet giderleri düşüldükten sonra kalan tutar","ad":"Faaliyet karı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"SMM tutarı ve yüzdesi, faaliyet giderleri yüzdesi ve finansman gideri tutarı verilip faaliyet karının TL tutarı istenir.","panel_ornek":"Bir gencin aylık 3.000 TL bütçesinde kira 1.800 TL, yani bütçenin %60\u0027ı; yemeğe de 600 TL, yani %20\u0027si ayrılıyor. Kira tutarını bilip yüzdesini bilirsen, önce toplam bütçeyi (3.000 TL) bulup sonra diğer kalemleri de yüzdeleriyle hesaplayabilirsin.","ornek":"Bir gencin aylık 3.000 TL bütçesinde kira 1.800 TL, yani bütçenin %60\u0027ı; yemeğe de 600 TL, yani %20\u0027si ayrılıyor. Kira tutarını bilip yüzdesini bilirsen, önce toplam bütçeyi (3.000 TL) bulup sonra diğer kalemleri de yüzdeleriyle hesaplayabilirsin.","yontemler":"Önce Net Satış = SMM tutarı / (SMM yüzdesi/100) formülüyle bulunur; sonra Faaliyet Karı yüzdesi = %100 - SMM% - Faaliyet Gideri% hesaplanıp bu yüzde net satışla çarpılır. Finansman gideri bu hesaba katılmaz, çünkü faaliyet karından sonraki bir kalemdir.","nedir":"Dikey yüzde analizi, bir mali tablodaki her kalemi aynı tablonun toplamına oranlayarak yüzde şeklinde gösteren yöntemdir. Sınav bu yöntemle, tek dönem içindeki kalemler arasındaki oransal ilişkileri kurup kurmadığını ölçer."},"olay":"Net satış=520.000/0,65=800.000; Brüt satış karı=800.000-520.000=280.000; Faaliyet giderleri=800.000x0,20=160.000; Faaliyet karı=280.000-160.000=120.000.","tuzak":{"D":{"ad":"Taban Karıştırma Tuzağı","metin":"Faaliyet giderleri yüzdesini net satış yerine SMM tutarı üzerinden uygularsın (520.000x0,20=104.000), böylece faaliyet karını olduğundan yüksek (176.000) bulursun. Doğrusu: yüzdeler her zaman net satışlar tabanına uygulanır."},"E":{"ad":"SMM\u0027i Dışlama Tuzağı","metin":"Faaliyet karını hesaplarken brüt satış karı adımını atlayıp doğrudan net satıştan yalnız faaliyet giderini düşersin, SMM\u0027i unutursun. Doğrusu: faaliyet karına ulaşmadan önce SMM mutlaka net satıştan düşülüp brüt satış karı bulunmalıdır."},"A":{"ad":"Ters Oran Tuzağı","metin":"Net satışı bulmak için SMM tutarını yüzdesine bölmen gerekirken yüzdesiyle çarparsın, böylece net satışı olduğundan küçük (338.000) hesaplarsın. Doğrusu: net satış 520.000/0,65=800.000\u0027dir, faaliyet karı da buradan 120.000 çıkar."},"B":{"ad":"Finansman Giderini Faaliyet Karına Dahil Etme Tuzağı","metin":"Finansman giderinin faaliyet karından sonra düşüldüğünü unutup 120.000\u0027den 30.000\u0027i çıkarırsın. Doğrusu: finansman gideri faaliyet karı hesabına hiç girmez, olağan kâra geçişte düşülür."}},"celdiriciYol":{"D":"520.000 x 0,20 = 104.000; 280.000 - 104.000 = 176.000 (faaliyet giderini SMM tabanı üzerinden hesaplama)","E":"800.000 - 160.000 = 640.000 (satılan malın maliyetini faaliyet karı zincirinden dışlama)","A":"520.000 x 0,65 = 338.000; 338.000 x 0,15 = 50.700 (net satışı bölme yerine çarparak bulma)","B":"120.000 - 30.000 = 90.000 (finansman giderini faaliyet karına dahil etme)"},"hap":"Dikey yüzde ve bir kalemin tutarı biliniyorsa net satış = tutar / (yüzde/100) ile bulunur, diğer tüm kalemler bu tabandan kendi yüzdeleriyle türetilir.","teshis":{"C":{"gercek":"Bir kalemin hem tutarı hem yüzdesi verilirse taban (net satış) bulunur, kalan tüm kalemler kendi yüzdeleriyle bu tabandan türetilir.","ayirt":"Verilen tek tutar ve yüzdeden tabanı doğru kurdum mu, sonra istenen kalemi bu tabandan mı hesapladım?","paragraf":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","yanilgi":"Bu şıkkı eleyen öğrenci, dikey yüzdelerden yalnız oran değil tutar da türetilebileceğini fark edemez ve soruyu çözülemez sanır."},"E":{"gercek":"Faaliyet karına ulaşmak için önce net satıştan SMM düşülüp brüt satış karı bulunur, ardından faaliyet giderleri düşülür; adım atlanamaz.","ayirt":"Brüt satış karını hesapladım mı, yoksa doğrudan net satıştan mı gittim?","paragraf":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","yanilgi":"Faaliyet karına giden zincirde satılan malın maliyeti adımını atlanabilir bir ara işlem sanıyorsun."},"A":{"gercek":"Yüzde bir oran olduğundan tabanı (net satışı) bulmak için tutar, yüzdenin ondalık karşılığına bölünür; bu Teori Notu\u0027nun \u0027tersine okuma\u0027 kuralıdır.","ayirt":"Bulduğum taban, verilen tutardan büyük mü olmalıydı küçük mü?","paragraf":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","yanilgi":"Dikey yüzdeden tutar bulurken tutarı yüzdesine bölmek yerine yüzdesiyle çarpılacağını sanıyorsun."},"D":{"gercek":"Gelir tablosu dikey yüzdelerinde tek taban net satışlardır; her kalem yüzdesi yalnız net satışa uygulanır.","ayirt":"Bu yüzdeyi hangi büyüklüğe çarptım, o büyüklük net satış mıydı?","paragraf":"Teori Notu - Dikey yüzde analizi ve bilanco yorumu","yanilgi":"Faaliyet giderleri yüzdesinin hangi tabana uygulandığını karıştırıp SMM tutarını taban sanıyorsun."},"B":{"gercek":"Faaliyet karı, faaliyet giderleri düşüldükten sonra durur; finansman gideri faaliyet karından SONRA, olağan kâra geçişte düşülür.","ayirt":"Bu kalem faaliyet giderleri arasında mı sayılıyor, yoksa faaliyet dışı mı?","paragraf":"Teori Notu - Dikey yuzdelerden net satış ve gelir tablosu hesaplari","yanilgi":"Finansman giderinin faaliyet giderleri gibi faaliyet karından düşüldüğünü sanıyorsun."}},"verilen":[[7,1],[1,1],[2,1],[3,1],[4,1]],"donem":11,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 68"},"kural":"Ortalama Stok = (Stokta Kalma Süresi x Satılan Malın Maliyeti) / 365; Ortalama Stok = (Dönem Başı Stok + Dönem Sonu Stok) / 2 olduğundan Dönem Başı Stok = (2 x Ortalama Stok) - Dönem Sonu Stok.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 68","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Ters sorularda önce hangi tutarın (ortalama mı, dönem başı mı) istendiğini kutu içine yaz, sonra formülü kur; aksi halde ara adımı cevap sanırsın.","konu":"stokta kalma süresi","tablo":{"satirlar":[["VERİLENLER","-"],["Stokta kalma süresi","73 gün"],["Satılan malın maliyeti","730.000 TL"],["Net satışlar","900.000 TL"],["Dönem sonu stok","170.000 TL"],["HESAP","-"],["Ortalama Stok = (73 x 730.000) / 365","146.000"],["Dönem Başı Stok = (2 x 146.000) - 170.000","122.000"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"180.000","E":"316.000","A":"122.000","D":"190.000","B":"146.000"},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.274","metin":"Madde 274 – (Değişik: 17/12/2003-5024/1 md.) Emtia, maliyet bedeliyle değerlenir. Emtianın maliyet bedeline nazaran değerleme günündeki satış bedelleri % 10 ve daha fazla bir düşüklük gösterdiği hallerde mükellef, maliyet bedeli yerine 267 nci maddenin ikinci sırasındaki usul hariç olmak üzere, emsal bedeli ölçüsünü tatbik edebilir. Bu hüküm 275 inci maddede yazılı mamuller için de uygulanabilir. Bu maddenin başlığı “Gayrimenkullerde maliyet bedelinin artması” iken 3/7/2005 tarihli ve 5398 sayılı Kanunun 24 üncü maddesiyle metne işlendiği şekliyle değiştirilmiştir. 88 Bu madde başlığı, 24/6/1994 tarih ve 4008 sayılı"},{"ad":"VUK (213 s.K.) m.274/A - Kanunun 8 inci maddesi ile değiştirilmiştir. 87 Kıymetli madenler","metin":"Kanunun 8 inci maddesi ile değiştirilmiştir. 87 Kıymetli madenler: MADDE 274/A- (Ek:28/7/2024-7524/8 md.) Altın, gümüş, platin ve paladyum gibi kıymetli madenler borsa rayici ile değerlenir. Borsa rayici yoksa veya borsa rayicinin muvazaalı bir şekilde oluştuğu anlaşılırsa değerlemeye esas bedel olarak, bu rayiç yerine maliyet bedeli esas alınır. Bu madde hükmü kıymetli maden ile olan senetli veya senetsiz alacaklar ve borçlar hakkında da caridir. Kıymetli maden ile olan mevduat veya kredi sözleşmelerine müstenit alacaklar ve borçlar değerleme gününe kadar hesaplanacak faizleriyle birlikte dikkate alınır. Alacak ve borçların değerleme günü kıymetine ircasına ilişkin olarak 280 inci, 281 inci ve 285 inci maddelerde yer alan hükümler bu fıkra kapsamındaki alacak ve borçlar bakımından da geçerlidir."}],"hakem":"Sorunun doğru şıkkı (122.000 TL) stokta kalma süresi formülüne dayalı hesaplamaya dayanmakta olup, kullanılan formül (Ortalama Stok = SMM × Gün / 365 ve Dönem Başı Stok = 2 × Ortalama Stok - Dönem Sonu Stok) kaynak metinde yer alan teorik mali analiz çerçevesinde desteklenmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":{"bosluk":[[0,1],[1,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Ortalama Stok = (73 x 550.000) / 365","110.000"],["Dönem Sonu Stok = (2 x 110.000) - 100.000","120.000"]]},"tur":"tablo","soru":"İşletmenin 2026 yılı stokta kalma süresi 73 gün, satılan malın maliyeti 550.000 TL, net satışları 800.000 TL ve dönem başı stok tutarı 100.000 TL olarak gerçekleşmiştir. Buna göre işletmenin dönem sonu stok tutarı kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve dönem sonu stok tutarının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin 2026 yılı stokta kalma süresi 73 gün, satılan malın maliyeti 730.000 TL, net satışları 900.000 TL ve dönem sonu stok tutarı 170.000 TL olarak gerçekleşmiştir. Buna göre işletmenin dönem başı stok tutarı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-mta-cokzor/kp-15","verilenler":[{"deger":"73 gün","anlam":"Ortalama stok tutarını bulmak için formülün pay kısmında satılan malın maliyeti ile çarpılacak süre.","ad":"Stokta kalma süresi"},{"deger":"730.000 TL","anlam":"Stok devir süresi formülünün payında kullanılan doğru kalem; ortalama stoğu hesaplamak için gerekli.","ad":"Satılan malın maliyeti"},{"deger":"900.000 TL","anlam":"Çeldirici veri; stokta kalma süresi formülüne net satışlar girmez, hesaba katılmaz.","ad":"Net satışlar"},{"deger":"170.000 TL","anlam":"Ortalama stok formülünden dönem başı stoğu izole etmek için ikiye katlanan ortalama stoktan çıkarılan tutar.","ad":"Dönem sonu stok"}],"dayanak":"TEORI - Stokta kalma süresi ve stok devir hızı (mali analiz formülü, mevzuat maddesi yok)","dogru":"A","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[],"anahtar":[{"ornek":"ortalama","kok":"ortala"},{"ornek":"süresi","kok":"süresi"},{"ornek":"satılan","kok":"satıla"},{"ornek":"maliyetidir","kok":"maliye"},{"ornek":"olduğundan","kok":"olduğu"},{"ornek":"stoktur","kok":"stoktu"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonu mali analiz sorularında stok yönetimi değerlendirilirken. Nasıl ölçülür: ortalama stok ile satılan malın maliyeti oranlanıp 365 gün ile ilişkilendirilerek. Nasıl kaydedilir: sonuç gün cinsinden tek bir sayı olarak ifade edilir, kayıt yapılmaz.","desen":"Soru genellikle stokta kalma süresi verilip dönem başı ya da dönem sonu stok tutarının tersten bulunmasını ister. Tuzak, payda olarak dönem sonu stoğun değil ortalama stoğun kullanılması gerektiğinin unutulmasıdır. Bu soru payda-pay karışıklığı noktasından geliyor (p. TEORİ-Stok).","terimler":[{"kaynak":"soruda verilir","tanim":"Dönem içinde satılan malların üretim/alış maliyeti toplamı","ad":"Satılan malın maliyeti (SMM)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönem başı ve dönem sonu stok tutarlarının aritmetik ortalaması","ad":"Ortalama stok","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Ortalama stoğun SMM\u0027ye oranının 365 ile çarpılmasıyla bulunan gün sayısı","ad":"Stokta kalma süresi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönemin ilk gününde işletmede bulunan stok tutarı","ad":"Dönem başı stok","kim":"piyasa fiyatlar (satış bedeli, alış bedeli gibi gerçekleşen tutarlar)"}],"sinavda":"Stokta kalma süresi, SMM ve dönem sonu stok verilip dönem başı stok tutarı istenir.","panel_ornek":"Bir market 10 kasa meyve suyu alıyor, her gün 1 kasa satıyor; yaklaşık 10 günde stok tükeniyor. İşte bu 10 gün, o ürünün \u0027stokta kalma süresi\u0027 gibidir. Süre kısaldıkça mal daha hızlı elden çıkıyor demektir.","ornek":"Bir market 10 kasa meyve suyu alıyor, her gün 1 kasa satıyor; yaklaşık 10 günde stok tükeniyor. İşte bu 10 gün, o ürünün \u0027stokta kalma süresi\u0027 gibidir. Süre kısaldıkça mal daha hızlı elden çıkıyor demektir.","yontemler":"Önce ortalama stok, süre formülünden geri çözülerek bulunur; sonra ortalama stoktan dönem sonu stok çıkarılıp 2 ile çarpılarak dönem başı stok elde edilir.","nedir":"Stokta kalma süresi, işletmenin stoklarını satışa/kullanıma dönüştürene kadar geçen ortalama gün sayısını gösterir. Sınav bu sürenin doğru formülle (ortalama stok, SMM) hesaplanıp hesaplanamadığını ölçer."},"olay":"Ortalama Stok = (73 x 730.000) / 365 = 146.000; Dönem Başı Stok = (2 x 146.000) - 170.000 = 122.000.","tuzak":{"C":{"ad":"Payda Karışıklığı Tuzağı","metin":"Stokta kalma süresi formülünün paydasına satılan malın maliyeti yerine net satışları koyup üstüne ortalama stoğu direkt cevap sayıyorsun. Doğrusu: formülün paydası her zaman satılan malın maliyetidir, net satışlar kâr marjı içerdiği için oranı bozar."},"E":{"ad":"Formül Kurma Tuzağı","metin":"Dönem Başı Stok = Ortalama Stok - Dönem Sonu Stok yerine iki tutarı toplayarak 146.000+170.000=316.000 buluyorsun. Doğrusu: ortalama stok formülü (Dönem Başı+Dönem Sonu)/2 olduğundan dönem başı stok, ortalama stoğun iki katından dönem sonu stok çıkarılarak bulunur."},"D":{"ad":"Yanlış Kalem Tuzağı","metin":"paydaya net satışları koyarak (73x900.000)/365=180.000 ortalama stok buluyor, sonra doğru ikiye katlama işlemini uyguluyorsun ama yanlış ortalama stok üzerinden gidiyorsun. Doğrusu: paydada satılan malın maliyeti kullanılmalıydı, net satışlar bu formülde yer almaz."},"B":{"ad":"Ortalama Stok Tuzağı","metin":"(73 x 730.000)/365=146.000\u0027i bulup bu tutarı ikiye katlamadan doğrudan dönem başı stok sanıyorsun. Doğrusu: 146.000 sadece ortalama stoktur, dönem başı stok bulmak için (2 x Ortalama Stok) - Dönem Sonu Stok işlemi yapılmalıydı."}},"celdiriciYol":{"C":"(73 x 900.000) / 365 = 180.000 (paydaya net satışları koydun ve bulduğun tutarı doğrudan dönem başı stok sandın)","E":"146.000 + 170.000 = 316.000 (ortalama stok formülünü çıkarma yerine toplama olarak kurdun)","D":"(73 x 900.000)/365 = 180.000; (2 x 180.000) - 170.000 = 190.000 (paydaya satılan malın maliyeti yerine net satışları koydun)","B":"(73 x 730.000) / 365 = 146.000 (ortalama stoğu ikiye katlamadan doğrudan dönem başı stok sandın)"},"hap":"Stok devir süresi formülünün paydası her zaman satılan malın maliyetidir ve sonuç ortalama stoktur; dönem başı stok bulmak için ortalama stok ikiye katlanıp dönem sonu stok çıkarılır.","teshis":{"C":{"gercek":"Stok devir süresi formülünün paydası daima satılan malın maliyetidir; net satışlar kâr marjı içerdiğinden oranı bozar ve ayrıca ortalama stok dönem başı stokla eşit değildir.","ayirt":"Paydada satılan malın maliyeti mi var, net satışlar mı; bulduğum tutar ortalama mı dönem başı mı?","paragraf":"TEORI - Stokta kalma süresi ve stok devir hızı","yanilgi":"Paydaya net satışları koyup üstüne bulduğun tutarı direkt dönem başı stok sayıyorsun; iki hatayı üst üste yapıyorsun."},"E":{"gercek":"Ortalama Stok = (Dönem Başı + Dönem Sonu)/2 eşitliğinden Dönem Başı = (2 x Ortalama Stok) - Dönem Sonu çıkar; toplama değil çıkarma işlemi gerekir.","ayirt":"Denklemi kurarken dönem sonu stoğu topladım mı, yoksa ikiye katlanan ortalamadan çıkardım mı?","paragraf":"TEORI - Stokta kalma süresi ve stok devir hızı","yanilgi":"Ortalama stok formülünü Dönem Başı = Ortalama Stok - Dönem Sonu yerine toplama işlemiyle kuruyorsun."},"A":{"gercek":"Stok devir süresi formülü ortalama stoğu verir; dönem başı stok, ortalama stoğun iki katından dönem sonu stok çıkarılarak elde edilir (mali analiz teorisi, ortalama stok tanımı).","ayirt":"Bulduğum tutar ortalama mı, yoksa dönem başı mı; ikiye katlayıp dönem sonu stoğunu çıkardım mı?","paragraf":"TEORI - Stokta kalma süresi ve stok devir hızı","yanilgi":"Bu şıkkı eleyen öğrenci, ortalama stok ile dönem başı stoğu aynı şey sanarak ikiye katlama adımını atlar."},"D":{"gercek":"Formülün paydası satılan malın maliyetidir; net satışlar bu orana hiç girmez, girerse tüm zincir yanlış tutar üretir.","ayirt":"Paydaya koyduğum tutar satılan malın maliyeti mi, yoksa net satışlar mı?","paragraf":"TEORI - Stokta kalma süresi ve stok devir hızı","yanilgi":"Paydaya net satışları koyarak yanlış bir ortalama stok buluyor, sonra bu yanlış tutar üzerinden doğru ikiye katlama işlemini yapıyorsun."},"B":{"gercek":"Ortalama Stok = (Dönem Başı Stok + Dönem Sonu Stok)/2 olduğundan dönem başı stok bulmak için ek işlem gerekir; ortalama stok tek başına dönem başı stok değildir.","ayirt":"Bu tutar ortalama stok mu, yoksa dönem başı stok mu; iki değişkenden birini izole ettim mi?","paragraf":"TEORI - Stokta kalma süresi ve stok devir hızı","yanilgi":"Ortalama stok formülünden çıkan 146.000 tutarını hiç dönüştürmeden dönem başı stok sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 71"},"kural":"Yabancı Kaynak / Aktif Toplamı ile Öz Kaynak / Aktif Toplamı oranlarının toplamı %100\u0027dür, bu nedenle Özkaynak = Aktif Toplamı - (Aktif Toplamı × Yabancı Kaynak Oranı).","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 71","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Soruda geçen her sayının hesaba girmesi gerekmez; önce sorulan büyüklüğün formülünü yaz, sonra hangi verinin o formülde yer aldığını işaretle.","konu":"yabancı kaynak oranı analizi","tablo":{"satirlar":[["VERİLENLER","-"],["Aktif toplamı","500.000 TL"],["Yabancı kaynak oranı","%65"],["Duran varlıklar","300.000 TL"],["Kısa vadeli yabancı kaynaklar","120.000 TL"],["HESAP","-"],["YABANCI KAYNAKLAR","-"],["Yabancı Kaynaklar Toplamı (Aktif × Kaldıraç Oranı)","325.000"],["ÖZKAYNAKLAR","-"],["Özkaynaklar (Aktif Toplamı - Yabancı Kaynaklar Toplamı)","175.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"300.000","E":"380.000","A":"120.000","D":"325.000","B":"175.000"},"kaynak":{"alinti":"Özkaynak/Aktif + Yabancı Kaynak/Aktif = %100","liste":[{"ad":"TEORI - Dikey yuzdelerden oz kaynak/aktif yorumu","metin":"TEORİ/FORMÜL (mali analiz, mevzuat maddesi yok). TEMEL ORANLAR: OZ KAYNAK / AKTİF TOPLAMI = varlıkların yüzde kaçı ortaklarca finanse edilmiş. YABANCI KAYNAK / AKTİF TOPLAMI = borçlanma (kaldıraç) oranı. İkisinin toplamı %100\u0027dur. FİNANSAL KALDIRAÇ ORANI olarak da anılan ikinci oran, işletmenin BORÇ YÜKÜNÜ gösterir. YORUM: Oz kaynak oranı YÜKSEK ise mali bağımsızlık ve borç ödeme gücü yüksek, iflas riski düşüktür; ancak OZ KAYNAK KARLILIĞI (Net Kâr / Oz Kaynak) baskı altına girebilir çünkü kaldıraçtan yararlanilmamaktadir. Oz kaynak oranı DÜŞÜK ise borç maliyeti ve finansal risk artar, faiz ödeme gücü (Faiz Karşılama Oranı) kritik hale gelir; ancak işletme kârlılık borç maliyetinin üzerindeyse kaldıraç oz kaynak karlılığını YÜKSELTİR. GENEL KABUL: Türkiye uygulamasında oz kaynak/aktif oranının genel bir \u0027ölçüt değer\u0027i vardır ancak bu SEKTÖRE GÖRE değişir - sabit sermaye yoğun sektorlerde farklı, ticaret isletmelerinde farklıdır; tek bir yüzde ezberlenmez, SEKTÖR ORTALAMASI ile karşılaştırılır. TAMAMLAYICI ORAN: Oz Kaynak / Duran Varlıklar - duran varlıkların ne kadarının oz kaynakla finanse edildiğini gösterir; 1\u0027in altındaysa duran varlığın bir kısmı YABANCI KAYNAKLA finanse edilmiş demektir ki bu vade uyumsuzluğu riski doğurur. SINAV TUZAĞI: düşük borçlanma HER ZAMAN olumlu değildir; kaldıraç etkisi karlılığı artirabilir. Ayrıca dikey yüzde tek dönemin YAPISINI gösterir, eğilim için dönemler karşılaştırılmalıdır."},{"ad":"Teori Notu - gsyh milli gelir hesaplama","metin":"Tetikte Teori Notu (makroekonomi literatürünün yerleşik tanımı): GSYH (Gayri Safi Yurt İçi Hasıla), bir ülke SINIRLARI İÇİNDE belirli bir dönemde üretilen NİHAİ mal ve hizmetlerin piyasa değeri toplamıdır. Üç hesaplama yaklaşımı aynı sonuca ulaşır: (1) ÜRETİM (katma değer) yaklaşımı — her aşamada yaratılan katma değerlerin toplamı; (2) HARCAMA yaklaşımı — GSYH = C (özel tüketim) + I (yatırım) + G (kamu harcaması) + NX (net ihracat = ihracat − ithalat); (3) GELİR yaklaşımı — üretim faktörlerinin gelirlerinin (ücret + faiz + rant + kâr) toplamı. GSYH\u0027ye GİRMEYENLER: ara mallar (çifte sayım olur), ikinci el satışlar (üretim o yıl değil), transfer ödemeleri (emekli aylığı, burs — karşılığında üretim yok), kayıt dışı/piyasa dışı üretim. GSYH yurt İÇİ (coğrafya) ölçüsüdür; GSMH/milli gelir yurttaşlık (mülkiyet) ölçüsüdür — yabancı firmanın Türkiye\u0027deki üretimi GSYH\u0027ye girer. NOMİNAL GSYH cari fiyatlarla, REEL GSYH sabit (baz yıl) fiyatlarıyla hesaplanır; büyüme REEL GSYH ile ölçülür. Tuzaklar: ara malı/ikinci eli/transferi GSYH\u0027ye katmak; nominal artışı büyüme sanmak (enflasyon etkisi)."}],"hakem":"Soru, yabancı kaynak oranı (%65) kullanarak özkaynak toplamını hesaplamayı ve \u0027Özkaynak/Aktif + Yabancı Kaynak/Aktif = %100\u0027 kuralını uygulamayı gerektirmekte; bu kural kaynak metinde açıkça yer almaktadır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":{"bosluk":[[1,1],[3,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["YABANCI KAYNAKLAR","-"],["Yabancı Kaynaklar Toplamı (Aktif × Kaldıraç Oranı)","440.000"],["Kısa Vadeli Yabancı Kaynaklar","150.000"],["Uzun Vadeli Yabancı Kaynaklar (YK Toplamı - KVYK)","290.000"]]},"tur":"tablo","soru":"Marmara Gıda İşletmesinin 2026 yılı aktif (varlık) toplamı 800.000 TL, yabancı kaynak oranı (kaldıraç oranı) %55\u0027tir. Aynı yıl bilançosunda duran varlıklar 450.000 TL, kısa vadeli yabancı kaynaklar 150.000 TL olarak yer almaktadır. Bu verilere göre işletmenin 2026 yılı uzun vadeli yabancı kaynaklar toplamı kaç TL\u0027dir?","verilen":[[2,1]],"hedef":"Tabloyu doldur ve uzun vadeli yabancı kaynaklar toplamının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Anadolu Tekstil İşletmesinin 2026 yılı aktif (varlık) toplamı 500.000 TL, yabancı kaynak oranı (kaldıraç oranı) %65\u0027tir. Aynı yıl bilançosunda duran varlıklar 300.000 TL, kısa vadeli yabancı kaynaklar 120.000 TL olarak yer almaktadır. Bu verilere göre işletmenin 2026 yılı özkaynak toplamı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-mta-cokzor/kp-16","verilenler":[{"deger":"500.000 TL","anlam":"İşletmenin toplam varlık büyüklüğü; yabancı kaynak ve özkaynak hesaplamasında baz alınır.","ad":"Aktif toplamı"},{"deger":"%65","anlam":"Toplam yabancı kaynağın aktife oranı; Aktif × Oran işlemiyle toplam yabancı kaynak tutarı bulunur.","ad":"Yabancı kaynak oranı"},{"deger":"300.000 TL","anlam":"Çeldirici veridir; bu soruda özkaynak/duran varlık oranı sorulmadığı için hesaplamaya dahil değildir.","ad":"Duran varlıklar"},{"deger":"120.000 TL","anlam":"Çeldirici veridir; yabancı kaynak oranı zaten toplam (kısa+uzun vadeli) yabancı kaynağı verdiği için alt kalem ayrıca hesaplamaya dahil değildir.","ad":"Kısa vadeli yabancı kaynaklar"}],"dayanak":"Mali Analiz Teori Notu - Özkaynak/Aktif ve Yabancı Kaynak/Aktif Oranları Toplamının %100 Olması Kuralı","dogru":"B","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Verilen: Aktif Toplamı 500.000 TL (soruda verilen); Yabancı Kaynak Oranı %65 (soruda verilen); Duran Varlıklar 300.000 TL (soruda verilen); Kısa Vadeli Yabancı Kaynaklar 120.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: aktif toplamı 500.000 TL, yabancı kaynak oranı %65, duran varlıklar 300.000 TL, kısa vadeli yabancı kaynaklar 120.000 TL.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Kaldıraç Oranı = Yabancı Kaynaklar / Aktif Toplamı","anlatim":"Yabancı Kaynaklar nedir? İşletmenin başkalarına olan borçlarıdır, bilançoda kaynaklar tarafında yer alır. Kaldıraç oranı bu borçların aktife oranını gösterir.","doldur":[[6,1]]},{"formul":"Özkaynaklar = Aktif Toplamı - Yabancı Kaynaklar","anlatim":"Özkaynaklar nedir? Sahiplerin işletmeye koyduğu ve kârdan biriken kaynaktır, aktiften yabancı kaynak çıkınca kalan kısımdır. Bilanço eşitliğinin diğer yarısıdır.","doldur":[[8,1]]},{"formul":"Yabancı Kaynaklar Toplamı = Aktif Toplamı × Kaldıraç Oranı = 500.000 (soruda verilen) × %65 (soruda verilen) = 325.000 TL","anlatim":"Önce toplam yabancı kaynağı buluyoruz, çünkü oran zaten bize doğrudan bu kalemi veriyor. Duran varlık ve kısa vadeli borç bilgileri burada tuzak, bu formülde kullanılmıyor.","doldur":[[7,1]]},{"formul":"Dahil değil: Duran Varlıklar 300.000 TL (soruda verilen); Kısa Vadeli Yabancı Kaynaklar 120.000 TL (soruda verilen)","anlatim":"Dahil değil: duran varlıklar 300.000 TL bu formülde kullanılmıyor, kısa vadeli yabancı kaynaklar 120.000 TL de kullanılmıyor. Bu iki rakam sadece dikkat dağıtmak için verilmiş.","doldur":[]},{"formul":"Özkaynaklar = Aktif Toplamı - Yabancı Kaynaklar Toplamı = 500.000 (soruda verilen) - 325.000 (4. adımda bulduk) = 175.000 TL","anlatim":"Şimdi bilanço eşitliğini kuruyoruz: aktif toplamı, yabancı kaynak ile özkaynağın toplamına eşittir. O yüzden özkaynağı bulmak için aktiften yabancı kaynağı çıkarırız.","doldur":[[9,1]]},{"formul":"Sonuç: Özkaynaklar = 175.000 TL (6. adımda bulduk)","anlatim":"Sonuç: işletmenin 2026 yılı özkaynak toplamı 175.000 TL\u0027dir. Bu tutar bilançonun kaynaklar tarafındaki özkaynaklar grubunda yer alır.","doldur":[]},{"formul":"Ters durum: özkaynak oranı verilseydi → Özkaynak = Aktif × Özkaynak Oranı","anlatim":"Ters durumda: soru sana yabancı kaynak oranı yerine özkaynak oranını verseydi, doğrudan aktif ile çarpıp özkaynağı bulurdun. O zaman yabancı kaynağı bulmak için çıkarma yapardın.","doldur":[]},{"formul":"Sağlama: 325.000 (4. adımda bulduk) + 175.000 (6. adımda bulduk) = 500.000 (soruda verilen) ✓","anlatim":"Sağlama yapalım: bulduğumuz özkaynak ile yabancı kaynağı toplarsak aktif toplamına eşit çıkmalı. Bu kontrol çözümün doğruluğunu gösterir.","doldur":[]},{"formul":"Yanlış yol: 500.000 - 300.000 - 120.000 = 80.000 (HATALI) → doğrusu 175.000 (6. adımda bulduk)","anlatim":"En sık hata: öğrenci duran varlık ve kısa vadeli yabancı kaynak rakamlarını formüle sokup yanlış işlem yapıyor. Bu iki değer soruda sadece çeldirici olarak verilmiş, kullanılmaz.","doldur":[]}],"anahtar":[{"ornek":"kaynak","kok":"kaynak"},{"ornek":"yabancı","kok":"yabanc"},{"ornek":"özkaynak","kok":"özkayn"},{"ornek":"vadeli","kok":"vadeli"},{"ornek":"kaynağı","kok":"kaynağ"},{"ornek":"bilançoda","kok":"bilanç"}],"konuGiris":{"harita":"Ne zaman test edilir: bilanço kalemleri ve bir oran birlikte verildiğinde eksik kalemi bulma sorusunda. Nasıl ölçülür: aktif toplamından yabancı kaynak oranı kullanılarak yabancı kaynak tutarı hesaplanır, kalan kısım özkaynaktır. Nasıl kaydedilir: sonuç TL cinsinden tek bir tutar olarak yazılır, ayrı hesap kaydı yapılmaz.","desen":"Soru genellikle duran varlık ve kısa vadeli yabancı kaynak gibi gereksiz görünen ek veriler koyarak öğrenciyi yanlış kaleme yönlendirir; asıl gereken sadece aktif toplamı ve oran bilgisidir. Öğrenci genellikle kısa vadeli yabancı kaynağı doğrudan özkaynaktan çıkarmaya çalışarak hataya düşer. Bu soru dikey yüzdelerden özkaynak/aktif yorumu konusundan geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşletmenin tüm varlıklarının bilançodaki toplam tutarı","ad":"Aktif toplamı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Yabancı kaynağın aktif toplamına bölünmesiyle bulunan borçlanma yüzdesi","ad":"Yabancı kaynak oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Aktif toplamının yabancı kaynak oranıyla çarpılmasından bulunan borç tutarı","ad":"Yabancı kaynak tutarı","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Aktif toplamından yabancı kaynak tutarı düşüldükten sonra kalan tutar","ad":"Özkaynak toplamı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Aktif toplamı ve yabancı kaynak oranı verilerek işletmenin özkaynak tutarının bulunması istenir.","panel_ornek":"Arkadaşının 40.000 TL değerindeki ikinci el arabasının yüzde 70\u0027i banka kredisiyle alınmış olsun. Bu durumda kredi tutarı 28.000 TL, arkadaşının kendi cebinden koyduğu pay ise 12.000 TL\u0027dir. Yani toplam değerin borç dışında kalan kısmı, oran üzerinden geriye doğru hesaplanabilir.","ornek":"Arkadaşının 40.000 TL değerindeki ikinci el arabasının yüzde 70\u0027i banka kredisiyle alınmış olsun. Bu durumda kredi tutarı 28.000 TL, arkadaşının kendi cebinden koyduğu pay ise 12.000 TL\u0027dir. Yani toplam değerin borç dışında kalan kısmı, oran üzerinden geriye doğru hesaplanabilir.","yontemler":"Önce aktif toplamı ile oran çarpılarak yabancı kaynak tutarı bulunur, ardından aktif toplamından bu tutar çıkarılarak özkaynak elde edilir; duran varlık ve kısa vadeli yabancı kaynak gibi ek veriler bu işlemde kullanılmaz.","nedir":"Yabancı kaynak oranı, bir işletmenin varlıklarının yüzde kaçının borçla finanse edildiğini gösteren dikey yüzde oranıdır. Sınav, aktif toplamı ve oran verildiğinde özkaynak veya yabancı kaynak tutarını geriye doğru bulabilmeni ölçer."},"olay":"500.000 × 0,65 = 325.000 (yabancı kaynak toplamı); 500.000 - 325.000 = 175.000.","tuzak":{"C":{"ad":"Çeldirici Veriyi Cevap Sanma Tuzağı","metin":"Soruda verilen duran varlık tutarını, özkaynak toplamıyla karıştırıp doğrudan yazdın. Doğrusu: duran varlık tutarı bu soruda özkaynak/duran varlık oranı sorulmadığı için hesaplamaya dahil değildir."},"E":{"ad":"Eksik Kalem Tuzağı","metin":"Toplam yabancı kaynağı bulmak yerine aktif toplamından yalnızca kısa vadeli yabancı kaynağı düşüp uzun vadeli yabancı kaynağı hesaba katmadın. Doğrusu: özkaynak, aktif toplamından TOPLAM yabancı kaynağın (kısa+uzun vadeli) düşülmesiyle bulunur."},"D":{"ad":"Oranı Ters Yorumlama Tuzağı","metin":"%65\u0027lik oranı özkaynak oranı sanıp, aktif toplamına uyguladığın tutarı doğrudan özkaynak sandın. Doğrusu: %65 yabancı kaynak oranıdır, bu oranla bulunan 325.000 TL özkaynak değil yabancı kaynak toplamıdır."},"A":{"ad":"Kısa Vadeli Veriyi Doğrudan Cevap Sayma Tuzağı","metin":"Soruda geçen kısa vadeli yabancı kaynak tutarını, sanki özkaynak toplamıymış gibi doğrudan cevap yazdın. Doğrusu: kısa vadeli yabancı kaynak tutarı bu soruda hesaplamaya hiç girmez, çünkü yabancı kaynak oranı zaten TOPLAM yabancı kaynağı verir."}},"celdiriciYol":{"C":"300.000 = 300.000 (soruda verilen çeldirici duran varlık tutarını doğrudan özkaynak sandın)","E":"500.000 - 120.000 = 380.000 (toplam yabancı kaynağı bulurken yalnız kısa vadeli yabancı kaynağı düştün, uzun vadeliyi atladın)","D":"500.000 × 0,65 = 325.000 (yabancı kaynak oranını özkaynak oranı sanıp bulduğun yabancı kaynak tutarını özkaynak sandın)","A":"120.000 = 120.000 (soruda verilen çeldirici kısa vadeli yabancı kaynak tutarını doğrudan özkaynak sandın)"},"hap":"Özkaynak/Aktif ile Yabancı Kaynak/Aktif oranlarının toplamı her zaman %100\u0027dür; biri bilinince diğeri ve tutarlar aktif toplamından türetilir.","teshis":{"C":{"gercek":"Duran varlık tutarı yalnızca Öz Kaynak/Duran Varlık gibi tamamlayıcı oranlarda kullanılır; bu soruda o oran sorulmadığı için işleme girmez.","ayirt":"Bu veri, sorulan oranın FORMÜLÜNDE gerçekten yer alıyor mu?","paragraf":"Mali Analiz Teori Notu","yanilgi":"Bilançoda geçen ilk büyük tutarı, sorulan kalemle otomatik eşleştiriyorsun."},"E":{"gercek":"Yabancı kaynak oranı kısa VE uzun vadeli yabancı kaynakların TOPLAMını aktife oranlar; alt kalemlerden yalnızca birini kullanmak eksik hesaplamaya yol açar.","ayirt":"Aktiften çıkardığım tutar, yabancı kaynağın TÜMÜNÜ mü yoksa sadece bir alt kalemini mi temsil ediyor?","paragraf":"Mali Analiz Teori Notu","yanilgi":"Yabancı kaynağı tek kalemden (kısa vadeli) ibaret sanıp uzun vadeli yabancı kaynağı hesaba katmıyorsun."},"A":{"gercek":"Yabancı kaynak oranı zaten toplam (kısa+uzun vadeli) yabancı kaynağı verir; alt kalemlerden biri tek başına özkaynağı ifade etmez.","ayirt":"Bu tutar, sorunun cevabı olan büyüklüğün TANIMINA mı uyuyor, yoksa sadece metinde geçtiği için mi seçiyorum?","paragraf":"Mali Analiz Teori Notu","yanilgi":"Soruda geçen her tutarı doğrudan istenen büyüklük sanıyorsun, kısa vadeli yabancı kaynağı özkaynakla karıştırıyorsun."},"D":{"gercek":"Aktif × Yabancı Kaynak Oranı işlemi YABANCI KAYNAK toplamını verir, özkaynağı değil; özkaynak için bu tutarın aktiften çıkarılması gerekir.","ayirt":"Bulduğum ara sonuç, hangi büyüklüğün (yabancı kaynak mı, özkaynak mı) karşılığı?","paragraf":"Mali Analiz Teori Notu - Kaldıraç Oranı Tanımı","yanilgi":"Aktif × oran işleminin sonucunu, hangi kalemi verdiğini kontrol etmeden doğrudan cevap sanıyorsun."},"B":{"gercek":"Öz Kaynak/Aktif + Yabancı Kaynak/Aktif = %100 kuralı gereği, Yabancı Kaynak = Aktif × Kaldıraç Oranı bulunup Aktiften çıkarılınca Özkaynak elde edilir.","ayirt":"Aktif toplamından toplam yabancı kaynağı mı çıkardım, yoksa alt kalemlerden birini mi kullandım?","paragraf":"Mali Analiz Teori Notu - Öz Kaynak/Aktif ve Yabancı Kaynak/Aktif İlişkisi","yanilgi":"Oranların toplamının %100 olduğunu ve özkaynağın aktiften yabancı kaynağın çıkarılmasıyla bulunacağını atlayıp işlemi eksik kuruyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 71"},"kural":"Kaldıraç oranı = Yabancı Kaynak / Aktif Toplamı olduğundan Öz Kaynak Oranı = 1 - Kaldıraç Oranı; Aktif Toplamı = Öz Kaynak / Öz Kaynak Oranı; Aktif Devir Hızı = Net Satışlar / Aktif Toplamı olduğundan Net Satışlar = Aktif Toplamı x Aktif Devir Hızı.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 71","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ters sorularda önce hangi büyüklüğün pay, hangisinin payda olduğunu formülden tekrar yaz; sonra soruda geçen her sayının gerçekten o zincirde yer alıp almadığını tek tek kontrol et.","konu":"cari oran-asit test yorumlama","tablo":{"satirlar":[["VERİLENLER","-"],["Öz Kaynak","600.000 TL"],["Kaldıraç Oranı","%40"],["Aktif Devir Hızı","2,5"],["Stok Devir Hızı","8"],["HESAP","-"],["Öz Kaynak Oranı (1-0,40)","%60"],["Aktif Toplamı (600.000/0,60)","1.000.000"],["Net Satışlar (1.000.000x2,5)","2.500.000"]],"basliklar":["Kalem","Tutar/Oran"]},"siklar":{"C":"2.500.000","E":"8.000.000","A":"400.000","D":"3.750.000","B":"900.000"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Devir hizlari ve kaldiractan oz kaynagin bulunmasi","metin":"TEORİ/FORMÜL (mali analiz, mevzuat maddesi yok). SORU TİPİ: verilen oranlardan bilanço buyukluklerine GERİYE giderek ulaşmak. TEMEL DENKLIKLER: AKTİF DEVİR HIZI = Net Satışlar / Aktif Toplamı -\u003e Aktif Toplamı = Net Satışlar / Aktif Devir Hızı. KALDIRAÇ ORANI = Yabancı Kaynak / Aktif Toplamı -\u003e Yabancı Kaynak = Kaldıraç Oranı x Aktif Toplamı. OZ KAYNAK = Aktif Toplamı - Yabancı Kaynak = Aktif Toplamı x (1 - Kaldıraç Oranı). BORÇ / OZ KAYNAK ORANINDAN: Oz Kaynak = Aktif / (1 + Borç/Oz Kaynak). ÇÖZÜM SIRASI: (1) satışlar ve aktif devir hızından AKTİF TOPLAMI bulunur, (2) kaldıraç oranından YABANCI KAYNAK, (3) fark alınarak OZ KAYNAK, (4) istenirse net kâr ile ROE/ROA hesaplanır. DİĞER DEVİR HIZLARI: Stok Devir Hızı = SMM / Ortalama Stok. Alacak Devir Hızı = Kredili Net Satışlar / Ortalama Ticari Alacak. Ticari Borç Devir Hızı = Kredili Alışlar / Ortalama Ticari Borç. Duran Varlık Devir Hızı = Net Satışlar / Duran Varlıklar. Oz Kaynak Devir Hızı = Net Satışlar / Oz Kaynaklar. SÜRE KARŞILIKLARI: 365 / ilgili devir hızı. SINAV TUZAĞI: aktif devir hizinda paydada AKTİF TOPLAMI (veya ortalama aktif) vardır; oz kaynak devir hizinda OZ KAYNAK. Ayrıca devir hizlarinda pay her zaman \u0027satış\u0027 değildir - STOK devir hizinda pay SATILAN MALIN MALİYETİDİR, ticari borç devir hizinda ALISLARDIR. Payı satış almak klasik hatadır."},{"ad":"TEORI - i. dunya savasi","metin":"TEORİ (inkılap tarihi; mevzuat maddesi yok). OLAY–TARİH–SONUÇ: I. Dünya Savaşı 1914–1918 yılları arasında İtilaf Devletleri (İngiltere, Fransa, Rusya; sonra İtalya, ABD) ile İttifak Devletleri (Almanya, Avusturya-Macaristan; sonra Osmanlı Devleti, Bulgaristan) arasında yapıldı. NEDENLER: Sömürgecilik ve ham madde yarışı, Almanya–İngiltere ekonomik rekabeti, Fransa\u0027nın Alsas-Loren\u0027i geri alma isteği, Balkanlar\u0027da Rusya–Avusturya çekişmesi, silahlanma ve bloklaşma; görünürdeki neden Avusturya veliahdının Saraybosna\u0027da öldürülmesidir. OSMANLI\u0027NİN GİRİŞİ: Osmanlı Devleti 1914 sonbaharında Almanya yanında savaşa girdi; Goeben ve Breslau gemilerinin Karadeniz\u0027de Rus limanlarını vurması fiilî girişi sağladı. Nedenler: kaybedilen toprakları geri alma umudu, Almanya\u0027nın savaşı kazanacağı inancı, İttihat ve Terakki yönetiminin Alman yanlılığı, kapitülasyonlardan kurtulma isteği. CEPHELER: Taarruz cepheleri Kafkas (Sarıkamış felaketi) ve Kanal; savunma cepheleri Çanakkale (1915 zafer, Mustafa Kemal Anafartalar), Irak (Kut\u0027ül Amare zaferi 1916), Suriye-Filistin, Hicaz-Yemen; müttefiklere yardım cepheleri Galiçya, Makedonya, Romanya. SONUÇ: Osmanlı Devleti 30 Ekim 1918 Mondros Ateşkes Antlaşması ile savaştan çekildi; savaş 11 Kasım 1918\u0027de Almanya\u0027nın ateşkesiyle bitti. Wilson İlkeleri (Ocak 1918) barışın çerçevesini çizdi; yenilenlerle Paris Barış Konferansı\u0027nda antlaşmalar yapıldı: Versay (Almanya), Sen Jermen (Avusturya), Nöyyi (Bulgaristan), Triyanon (Macaristan), Sevr (Osmanlı, 10 Ağustos 1920; TBMM tanımadı, uygulanmadı). İmparatorluklar dağıldı, yeni ulus devletler kuruldu, Mille…"}],"hakem":"Soru, kaynak metinde açıkça yer alan Aktif Devir Hızı, Kaldıraç Oranı ve Öz Kaynak formüllerinden hareketle Net Satışları hesaplamayı ölçüyor; tüm temel denklikler kaynakta mevcuttur."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":{"bosluk":[[1,1]],"tablo":{"basliklar":["Kalem","Tutar/Oran"],"satirlar":[["Öz Kaynak Oranı (1-0,25)","%75"],["Aktif Toplamı (900.000/0,75)","1.200.000"],["Net Satışlar (1.200.000x3)","3.600.000"]]},"tur":"tablo","soru":"Bir işletmenin öz kaynak tutarı 900.000 TL, kaldıraç oranı (yabancı kaynak / aktif toplamı) %25 ve aktif devir hızı 3\u0027tür. Stok devir hızının 6 olduğu bilinmektedir. Buna göre işletmenin net satışları kaç TL\u0027dir?","verilen":[[0,1],[2,1]],"hedef":"Tabloyu doldur ve net satışların kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir işletmenin öz kaynak tutarı 600.000 TL, kaldıraç oranı (yabancı kaynak / aktif toplamı) %40 ve aktif devir hızı 2,5\u0027tir. Stok devir hızının 8 olduğu bilinmektedir. Buna göre işletmenin net satışları kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-mta-cokzor/kp-22","verilenler":[{"deger":"600.000 TL","anlam":"İşletmenin öz kaynak tutarıdır; kaldıraç oranının tümleyeni ile bölünerek aktif toplamına ulaşmakta kullanılır.","ad":"Öz Kaynak"},{"deger":"%40","anlam":"Yabancı kaynağın aktif toplamı içindeki payıdır; tümleyeni (1-0,40=0,60) öz kaynak oranını verir.","ad":"Kaldıraç Oranı"},{"deger":"2,5","anlam":"Net satışlar/aktif toplamı oranıdır; aktif toplamı bulunduktan sonra net satışlara ulaşmak için aktif toplamıyla çarpılır.","ad":"Aktif Devir Hızı"},{"deger":"8","anlam":"Satılan malın maliyeti/ortalama stok oranıdır; bu sorunun net satış zincirine dahil değildir, çeldiricidir.","ad":"Stok Devir Hızı"}],"dayanak":"Teori Notu - Devir hızları ve kaldıraçtan öz kaynağın bulunması (mali analiz formülleri, mevzuat maddesi yok)","dogru":"C","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Verilen: Öz kaynak 600.000 TL (soruda verilen); Kaldıraç oranı %40 (soruda verilen); Aktif devir hızı 2,5 (soruda verilen); Stok devir hızı 8 (soruda verilen, bu soruda kullanılmıyor)","anlatim":"Soru bize şunları vermiş: özkaynak, kaldıraç oranı ve aktif devir hızı - net satışları bunlardan bulacağız.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Kaldıraç Oranı = Yabancı Kaynak / Aktif Toplamı","anlatim":"Kaldıraç oranı nedir? Yabancı kaynağın aktif toplamına oranıdır - aktifin ne kadarının borçla finanse edildiğini gösterir.","doldur":[]},{"formul":"Öz Kaynak Oranı = 1 − Kaldıraç Oranı = 1 − %40 (soruda verilen) = 0,60","anlatim":"Aktif toplamı özkaynak artı yabancı kaynaktan oluşur, yani oranlar toplamı %100\u0027dür. Bu yüzden özkaynak oranını bulmak için kaldıraç oranını 1\u0027den çıkarıyoruz.","doldur":[[6,1]]},{"formul":"Aktif Toplamı = Öz Kaynak / Öz Kaynak Oranı = 600.000 (soruda verilen) / 0,60 (2. adımda bulduk) = 1.000.000 TL","anlatim":"Özkaynak oranı, özkaynağın aktif toplamına bölümüdür. Buradan aktif toplamını çekip çıkarıyoruz.","doldur":[[7,1]]},{"formul":"Dahil değil: Stok Devir Hızı 8 (soruda verilen)","anlatim":"Stok devir hızı 8 burada dahil değil - net satış hesabına hiç girmiyor, sadece dikkat dağıtmak için verilmiş.","doldur":[]},{"formul":"Aktif Devir Hızı = Net Satışlar / Aktif Toplamı → Net Satışlar = Aktif Toplamı × Aktif Devir Hızı = 1.000.000 (3. adımda bulduk) × 2,5 (soruda verilen) = 2.500.000 TL","anlatim":"Aktif devir hızı nedir? Net satışların aktif toplamına oranıdır, işletmenin varlıklarını satışa çevirme hızını gösterir. Buradan net satışları çekiyoruz.","doldur":[[8,1]]},{"formul":"SONUÇ: Net Satışlar = 2.500.000 TL","anlatim":"Net satışlar 2.500.000 TL çıktı. İşletmenin bir yıllık ciro büyüklüğü budur.","doldur":[]},{"formul":"Ters durum: Öz Kaynak Oranı doğrudan verilseydi → 1 − Kaldıraç Oranı adımı atlanır","anlatim":"Ters durumda kaldıraç oranı yerine özkaynak oranı verilseydi, direkt onu kullanır, 1\u0027den çıkarma adımını atlardık.","doldur":[]},{"formul":"Yanlış yol: 600.000 / 0,60 × 8 = 8.000.000 (HATALI) → doğrusu 1.000.000 × 2,5 = 2.500.000 (6. adımda bulduk)","anlatim":"En sık hata: stok devir hızı 8\u0027i formüle sokup yanlış bir aktif toplamı hesaplamaktır, oysa bu veri soruda hiç kullanılmaz.","doldur":[]}],"anahtar":[{"ornek":"kaldıraç","kok":"kaldır"},{"ornek":"özkaynak","kok":"özkayn"},{"ornek":"satışlar","kok":"satışl"},{"ornek":"toplamına","kok":"toplam"},{"ornek":"kaynak","kok":"kaynak"},{"ornek":"yabancı","kok":"yabanc"}],"konuGiris":{"harita":"Ne zaman test edilir: öz kaynak, kaldıraç oranı ve devir hızları verildiğinde net satışlar geriye doğru hesaplanır. Nasıl ölçülür: önce aktif toplamı, sonra yabancı kaynak ve öz kaynak ilişkisi kurularak formüller zincirlenir. Nasıl kaydedilir: bulunan net satış tutarı TL cinsinden tek bir sonuç olarak yazılır.","desen":"Soru öz kaynaktan geriye giderek aktif toplamını, oradan net satışları buldurur; tuzak, stok devir hızı gibi gereksiz verinin dikkat dağıtmasıdır. Adaylar kaldıraç oranını doğrudan öz kaynağa uygulamaya çalışıp yanlış zincir kurar. Bu soru geriye giderek bilanço büyüklüğü bulma noktasından geliyor (p.TEORİ).","terimler":[{"kaynak":"soruda verilir","tanim":"Net satışların aktif toplamına bölünmesiyle bulunan oran","ad":"Aktif devir hızı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Yabancı kaynağın aktif toplamına oranı, borçluluk düzeyini gösterir","ad":"Kaldıraç oranı","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Net satışların aktif devir hızına bölünmesiyle bulunan büyüklük","ad":"Aktif toplamı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Aktif toplamından yabancı kaynak düşüldükten sonra kalan tutar","ad":"Öz kaynak","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Öz kaynak, kaldıraç oranı ve aktif devir hızı verilip net satışlar istenir.","panel_ornek":"Arkadaşının kumbarasında 300 lirası var, borcu 120 lira; kumbara/borç oranına bakarak rahat ödeyip ödeyemeyeceğini anlarsın. Aynı mantıkla işletme de aktiflerini borcuna bölerek kendi \u0027kumbara oranını\u0027 hesaplar.","ornek":"Arkadaşının kumbarasında 300 lirası var, borcu 120 lira; kumbara/borç oranına bakarak rahat ödeyip ödeyemeyeceğini anlarsın. Aynı mantıkla işletme de aktiflerini borcuna bölerek kendi \u0027kumbara oranını\u0027 hesaplar.","yontemler":"Önce öz kaynak ve kaldıraç oranından aktif toplamı bulunur, sonra aktif devir hızıyla net satışlar hesaplanır; stok devir hızı bu zincire girmez.","nedir":"Cari oran ve asit test, işletmenin kısa vadeli borçlarını ödeyebilme gücünü ölçer. Sınav bu oranlardan geriye giderek bilanço kalemlerini (aktif, öz kaynak, net satışlar) hesaplatır."},"olay":"Öz Kaynak Oranı=1-0,40=0,60; Aktif Toplamı=600.000/0,60=1.000.000; Net Satışlar=1.000.000x2,5=2.500.000.","tuzak":{"D":{"ad":"Oran Karıştırma Tuzağı","metin":"Kaldıraç oranını (%40) yanlışlıkla öz kaynağın aktif içindeki payı sanıp öz kaynağı doğrudan bu orana böldün (600.000/0,40). Doğrusu: %40 yabancı kaynağın payıdır, öz kaynak payı (1-0,40=0,60) ile bölünmelidir."},"E":{"ad":"Çeldirici Veriyi Kullanma Tuzağı","metin":"Soruda geçen ama hesaba girmeyen stok devir hızını (8) aktif devir hızı (2,5) yerine kullanarak aktif toplamını bununla çarptın (1.000.000 x 8). Doğrusu: stok devir hızı, satılan malın maliyetinin ortalama stoka oranıdır; bu soruda net satış zincirine dahil değildir."},"A":{"ad":"Devir Hızına Bölme Tuzağı","metin":"Aktif toplamını doğru bulup net satışlara giderken \u0027devir hızı = satış/aktif\u0027 ilişkisini ters çevirip aktifi devir hızına böldün (1.000.000 / 2,5). Doğrusu: aktif devir hızı payda değil çarpandır; net satışlar aktif toplamı ile devir hızının çarpımıdır."},"B":{"ad":"Doğrudan Oran Uygulama Tuzağı","metin":"Aktif toplamını hiç bulmadan kaldıraç oranının tersini (1-0,40=0,60) doğrudan öz kaynak tutarına çarptın (600.000 x 0,60). Doğrusu: 0,60 öz kaynağın aktif içindeki PAYIDIR, öz kaynağı bu paya BÖLEREK aktif toplamına ulaşılır, çarpılarak değil."}},"celdiriciYol":{"D":"600.000 / 0,40 = 1.500.000; 1.500.000 x 2,5 = 3.750.000 (kaldıraç oranını öz kaynak oranı sanma)","E":"1.000.000 x 8 = 8.000.000 (stok devir hızını aktif devir hızı yerine kullanma - çeldirici verilen)","A":"1.000.000 / 2,5 = 400.000 (aktif devir hızını bölme katsayısı gibi kullanma)","B":"600.000 x (1-0,40=0,60) = 360.000; 360.000 x 2,5 = 900.000 (aktif toplamını bulmadan oranı doğrudan öz kaynağa uygulama)"},"hap":"Kaldıraç oranı yabancı kaynağın payıdır; öz kaynağın payı daima (1-Kaldıraç Oranı)\u0027dır ve aktif toplamına bu tümleyen oranla ulaşılır.","teshis":{"C":{"gercek":"Kaldıraç Oranı = Yabancı Kaynak/Aktif Toplamı; 1-Kaldıraç Oranı = Öz Kaynak Oranı; Aktif Toplamı = Öz Kaynak/Öz Kaynak Oranı; Net Satışlar = Aktif Toplamı x Aktif Devir Hızı.","ayirt":"Kaldıraç oranını tersine çevirip öz kaynak oranına dönüştürdüm mü?","paragraf":"Teori Notu - devir hızları ve kaldıraçtan öz kaynağın bulunması","yanilgi":"Bu şıkkı eleyen öğrenci, kaldıraç oranını doğrudan öz kaynak oranı sanıp ters işlem yapmıştır."},"E":{"gercek":"Stok Devir Hızı = Satılan Malın Maliyeti / Ortalama Stok\u0027tür; net satışlar-aktif toplamı zincirinde payda AKTİF DEVİR HIZI kullanılır, stok devir hızının bu hesapla ilgisi yoktur.","ayirt":"Bu sayı, sorduğum büyüklüğün formülünde gerçekten yer alıyor mu?","paragraf":"Teori Notu - devir hızları ve kaldıraçtan öz kaynağın bulunması","yanilgi":"Soruda geçen her sayının hesaba dahil olduğunu düşünüp stok devir hızını da net satış zincirine katıyorsun."},"A":{"gercek":"Aktif Devir Hızı = Net Satışlar / Aktif Toplamı tanımına göre net satışlara ulaşmak için aktif toplamı devir hızıyla ÇARPILIR, bölünmez.","ayirt":"Bu oranın formülünde net satışlar payda mı pay mı?","paragraf":"Teori Notu - devir hızları formülleri","yanilgi":"Aktif devir hızını payda gibi kullanılan bir bölme katsayısı sanıyorsun."},"D":{"gercek":"Kaldıraç oranı YABANCI kaynağın payını gösterir; öz kaynağın payı bunun tümleyeni olan (1-Kaldıraç Oranı)\u0027dır.","ayirt":"Verilen yüzde, borcun mu yoksa öz kaynağın mı payı?","paragraf":"Teori Notu - kaldıraç oranı tanımı","yanilgi":"Kaldıraç oranının (%40) doğrudan öz kaynağın aktif içindeki payı olduğunu düşünüyorsun."},"B":{"gercek":"Öz Kaynak Oranı = Öz Kaynak / Aktif Toplamı olduğundan Aktif Toplamı, öz kaynağın bu orana BÖLÜNMESİYLE bulunur.","ayirt":"Elimdeki oran bir PAY mı yoksa aradığım büyüklüğe giden bir BÖLEN mi?","paragraf":"Teori Notu - kaldıraç oranından öz kaynağın bulunması","yanilgi":"Öz kaynak oranını, aktif toplamını bulmadan doğrudan öz kaynak tutarına uygulanacak bir çarpan sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 78"},"kural":"BDS 330 paragraf 17 uyarınca denetçi, güvenmeyi düşündüğü kontrollerde sapma tespit ederse özel sorgulamalar yapar ve uygulanan kontrol testlerinin uygun bir dayanak teşkil edip etmediğine, ilave kontrol testlerinin mi yoksa maddi doğrulama prosedürlerinin mi gerektiğine karar verir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 78","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"BDS 330\u0027da \u0027sapma\u0027 kelimesi görünce paragraf 17\u0027nin üç seçenekli karar yapısını ara, \u0027üç denetimde bir test\u0027 kuralını (p.14) sadece değişiklik OLMAYAN duruma uygula.","konu":"bds 330 risk karşılığı","tablo":{"satirlar":[["A) Sapmaların ve olası sonuçlarının anlaşılması için özel s…","p.17","doğru ifade"],["B) En az her üç denetimin birinde test etme kuralına dayana…","p.14","YANLIŞ ifade"],["C) Maddi doğrulama prosedürlerinde yanlışlık tespit edilmed…","p.16","YANLIŞ ifade"],["D) Tespit ettiği sapmayı doğrudan ciddi risk olarak sınıfla…","p.15, p.17","YANLIŞ ifade"],["E) Özel sorgulama yapmaksızın doğrudan ilave kontrol testle…","p.17","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Maddi doğrulama prosedürlerinde yanlışlık tespit edilmediği için kontrollerin etkin işlediğine dair kanıt elde etmiş sayar.","E":"Özel sorgulama yapmaksızın doğrudan ilave kontrol testleri uygulayarak sapmanın kontrol etkinliğine olan etkisini değerlendirir.","A":"Sapmaların ve olası sonuçlarının anlaşılması için özel sorgulamalar yapar; ilave kontrol testi mi yoksa maddi doğrulama prosedürü mü gerektiğine karar verir.","D":"Tespit ettiği sapmayı doğrudan ciddi risk olarak sınıflandırır ve kontrolleri cari dönemde test eder, maddi doğrulama prosedürü uygulamaz.","B":"En az her üç denetimin birinde test etme kuralına dayanarak, kontrolü bir sonraki denetim dönemine kadar yeniden test etmeyebilir."},"kaynak":{"alinti":"","liste":[{"ad":"BDS 330 p.16-17 - Kontrollerin isleyis etkinliginin degerlendirilmesi","metin":"BDS 330 paragraf 16 (KRITIK NUANS): Denetci, ilgili kontrollerin isleyis etkinligini degerlendirirken, maddi dogrulama prosedurleri araciligiyla tespit edilen yanlisliklarin, kontrollerin etkin sekilde islemedigine isaret edip etmedigi konusunda degerlendirme yapar. ANCAK maddi dogrulama prosedurleri sonucunda YANLISLIK TESPIT EDILMEMIS OLMASI, test edilen yonetim beyanlarina iliskin kontrollerin ETKIN OLDUGUNA DAIR DENETIM KANITI SAGLAMAZ. Paragraf 17: Guvenmeyi dusundugu kontrollerde SAPMALAR tespit etmesi halinde denetci, bu hususlari ve muhtemel sonuclarini anlamak uzere OZEL SORGULAMALAR yapar ve: (a) Uygulanan kontrol testlerinin kontrollere guven duyulmasi icin uygun bir dayanak teskil edip etmedigine, (b) ILAVE KONTROL TESTLERININ gerekip gerekmedigine veya (c) MADDI DOGRULAMA PROSEDURLERINI kullanmak suretiyle muhtemel yanlislik risklerine karsilik vermenin gerekip gerekmedigine karar verir."},{"ad":"BDS 330 p.11-15 - Zamanlama: ara donem, onceki denetimler ve UC DENETIM kurali","metin":"BDS 330 paragraf 11: Denetci, kontrollerden elde etmeyi bekledigi guvenceye uygun bir dayanak saglamak amaciyla, guvenmek istedigi kontrolleri guvenmeyi planladigi BELIRLI BIR ZAMAN ICIN VEYA DONEM BOYUNCA test eder. Paragraf 12 (ARA DONEM): Kontrollerin isleyis etkinligine iliskin ARA DONEMDE denetim kaniti elde etmesi halinde denetci: (a) Ara donemden sonra bu kontrollerde meydana gelen ONEMLI DEGISIKLIKLER hakkinda denetim kaniti toplar ve (b) Ara donemden sonra kalan donem icin toplanmasi gereken ILAVE denetim kanitlarini belirler. Paragraf 13: Denetci, kontrollerin isleyis etkinligi hakkinda ONCEKI DENETIMLERDEN elde edilen denetim kanitlarini kullanmanin uygun olup olmadigina ve bir kontrolu yeniden test etmesi icin ne kadar sure gecmesi gerektigine karar verirken sunlari mutalaa eder: kontrol cevresi ve ic kontrolun diger unsurlarinin etkinligi; kontrolun ozelliklerinden kaynaklanan riskler (manuel/otomatik); genel BT kontrollerinin etkinligi; kontrolun uygulanmasinin etkinligi ve personel degisiklikleri; degisiklik yapilmamasinin risk teskil edip etmedigi; \u0027onemli yanlislik\u0027 riskleri ve kontrole duyulacak guvenin kapsami. Paragraf 14 (UC DENETIM KURALI - KRITIK): Denetci, belirli kontrollerin isleyis etkinligine iliskin onceki denetimlerden elde edilen kanitlari kullanmayi planlarsa, bir onceki denetimden itibaren bu kontrollerde onemli degisiklikler meydana gelip gelmedigi hakkinda denetim kaniti elde ederek karar verir: (a) Degisiklik meydana gelmesi durumunda CARI DENETIMDE kontrolleri test eder. (b) Bu tur degisikliklerin soz konusu olmamasi durumunda denetci, E…"}],"hakem":"BDS 330 paragraf 17, sapma tespit edildiğinde denetçinin özel sorgulamalar yapması ve ardından ilave kontrol testi veya maddi doğrulama prosedürü arasında karar vermesini açıkça düzenlemektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"Bağımsız denetçi, önceki denetimlerden elde ettiği kontrol testi kanıtlarını cari dönemde kullanmayı planladığı bir kontrolde, yaptığı sorgulama sırasında kontrolün işleyişinde SAPMA tespit etmiştir. BDS 330\u0027a göre denetçinin bu durumda yapması gereken işlem aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-mta-cokzor/kp-24","verilenler":[],"dayanak":"BDS 330 p.17 (p.14(a) ile birlikte)","dogru":"A","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Olay: Bir denetim şirketinde, ABC Tekstil\u0027in satın alma sürecindeki \u0027fatura onay kontrolü\u0027 geçen yıl test edilmiş ve sorunsuz çıkmıştı. Bu yıl denetçi Ayşe, aynı kontrole güvenmeyi planlıyor ve 40 fatura üzerinde sorgulama yapıyor. Sorgulamada 3 faturada onay imzasının atlandığını, yani kontrolün işleyişinde sapma olduğunu fark ediyor.","anlatim":"Ayşe artık elinde \u0027sapma tespit edildi\u0027 gerçeğiyle oturuyor.","doldur":[]},{"formul":"Ne yapacağız: BDS 330 p.17\u0027ye göre Ayşe önce özel sorgulamalar yapıp sapmanın sebebini ve olası sonuçlarını anlayacak, sonra ilave kontrol testi mi maddi doğrulama mı gerektiğine karar verecek. Şimdi bu 40 faturalık olayda beş ifadeyi tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.17","karar":"doğru","anlatim":"Bu tam BDS 330 p.17\u0027nin söylediği yol. Önce sorgulama, sonra üç seçenekten birine karar verme aşaması var. Ayşe kuralın kendisini uyguluyor.","formul":"Şık A: Ayşe, 3 sapmanın sebebini anlamak için ek sorular soruyor ve sonra ilave test mi maddi doğrulama mı yapacağına karar veriyor, doğru mu yapıyor?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.14","karar":"yanlış","anlatim":"Ama kontrolde sapma yani değişiklik/sorun tespit edilmiş durumda, p.14(a) böyle bir halde kontrolün cari denetimde test edilmesini şart koşuyor. Üç denetim kuralı yalnız değişiklik olmayan sakin durumlar için geçerli.","formul":"Şık B: Ayşe \u0027zaten üç denetimden birinde test etme kuralı var, bu kontrolü gelecek yıla kadar hiç test etmeyebilirim\u0027 diyor, haklı mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.16","karar":"yanlış","anlatim":"p.16 açıkça söylüyor: maddi doğrulamada yanlışlık bulunmaması, kontrolün etkin olduğuna dair kanıt sağlamaz. Ayşe burada yanlış bir çıkarım yapıyor.","formul":"Şık C: Ayşe \u0027madem maddi doğrulama testlerinde hata bulamadım, kontrol iyi çalışıyor demektir\u0027 diye düşünüyor, bu mantık doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.15, p.17","karar":"yanlış","anlatim":"Ciddi risk ayrı bir değerlendirme konusudur, p.15 buna değinir; sapma tek başına otomatik ciddi risk sayılmaz. p.17\u0027deki üç seçenekten biri zaten maddi doğrulama olabilir.","formul":"Şık D: Ayşe \u00273 sapma var, bu direkt ciddi risk demektir, sadece kontrolleri cari dönemde test ederim, maddi doğrulamaya hiç gerek yok\u0027 diyor, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.17","karar":"yanlış","anlatim":"p.17\u0027nin ilk adımı özel sorgulamadır, Ayşe bu adımı atlıyor. Karar sorgulamadan sonra verilir, önce değil.","formul":"Şık E: Ayşe hiç sorgulama yapmadan direkt ilave kontrol testlerine geçip sapmanın etkisini böyle değerlendirmeye çalışıyor, doğru mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Sapma görünce Ayşe\u0027nin ilk işi sorgulama yapmak, sonra üç seçenekten birine karar vermektir; kendine hep şunu sor: \u0027Sorgulama adımını atlayıp direkt bir karara mı atladım?\u0027","doldur":[]}],"anahtar":[{"ornek":"kontrol","kok":"kontro"},{"ornek":"sorgulama","kok":"sorgul"},{"ornek":"doğrulama","kok":"doğrul"},{"ornek":"tespit","kok":"tespit"},{"ornek":"seçenekten","kok":"seçene"},{"ornek":"değişiklik","kok":"değişi"}],"konuGiris":{"harita":"Ne zaman test edilir: Denetçi önceki dönem kanıtına güvenirken cari dönemde sapma fark ettiği anda ek işlem yapar. Nasıl ölçülür: Sapmanın kontrol güvenilirliğini ne kadar sarstığı özel sorgulamalarla değerlendirilir. Nasıl kaydedilir: Karar, ilave kontrol testi mi yoksa maddi doğrulama prosedürü mü uygulanacağı şeklinde belgelenir.","desen":"Soru genellikle \u0027sapma varsa hemen maddi doğrulamaya geçilir mi\u0027 tuzağıyla kurulur; doğrusu önce özel sorgulama yapılmasıdır. Bazı seçenekler sapmayı görmezden gelip önceki kanıta güvenmeye devam etmeyi önerir, bu yanlıştır. Bu soru BDS 330 paragraf 17 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kontrolün işleyiş etkinliğini değerlendirmek için tasarlanan denetim prosedürü","ad":"Kontrol testi","kim":"Tekdüzen hesap planı ya da standar
