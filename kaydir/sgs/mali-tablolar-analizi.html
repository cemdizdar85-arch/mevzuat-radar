t tanımlar"},{"kaynak":"soruda verilir","tanim":"Güvenilen kontrolün beklendiği gibi işlemediğinin sorgulamada ortaya çıkması","ad":"Sapma","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Sapmanın nedenini ve olası sonucunu anlamak için yapılan ek inceleme","ad":"Özel sorgulama","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Önemli yanlışlığı doğrudan tespit etmeye yönelik denetim işlemi","ad":"Maddi doğrulama prosedürü","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda önceki kanıta güvenilen kontrolde sapma tespit edildiği verilir ve denetçinin izleyeceği adım istenir.","panel_ornek":"Bir arkadaşın her ay düzenli fatura ödediğini varsayıp ona güveniyorsun, ama bu ay ödemenin 3 gün geciktiğini fark ediyorsun. Tek gecikmeyi görünce hemen \u0027güvenilmez\u0027 demezsin, önce nedenini sorar, gerekirse başka ayları da kontrol edersin. İşte denetçi de kontrolde sapma görünce böyle ek sorgulama yapar.","ornek":"Bir arkadaşın her ay düzenli fatura ödediğini varsayıp ona güveniyorsun, ama bu ay ödemenin 3 gün geciktiğini fark ediyorsun. Tek gecikmeyi görünce hemen \u0027güvenilmez\u0027 demezsin, önce nedenini sorar, gerekirse başka ayları da kontrol edersin. İşte denetçi de kontrolde sapma görünce böyle ek sorgulama yapar.","yontemler":"Denetçi önce sapmanın nedenini ve sonucunu anlamak için özel sorgulama yapar, sonra ilave kontrol testi mi yoksa maddi doğrulama mı gerektiğine karar verir.","nedir":"BDS 330, denetçinin daha önce güvendiği bir kontrolde sapma bulunca ne yapacağını belirleyen kuraldır. Sınav, denetçinin sapma sonrası kanıt yeterliliğine nasıl karar verdiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Yanlışlık Yok Sayma Tuzağı","metin":"Maddi doğrulama prosedürlerinde yanlışlık bulunmamasını, kontrolün etkin işlediğine dair kanıt sanırsın. Doğrusu: Paragraf 16 açıkça bunun kontrollerin etkin olduğuna dair denetim kanıtı sağlamayacağını belirtir, denetçi ayrıca değerlendirme yapmalıdır."},"E":{"ad":"Adım Atlama Tuzağı","metin":"Sorgulama basamağını atlayıp doğrudan ilave kontrol testine geçersin. Doğrusu: Paragraf 17 önce özel sorgulamaların yapılmasını, ardından üç seçenekten birine karar verilmesini öngörür."},"D":{"ad":"Ciddi Risk Karıştırma Tuzağı","metin":"Her sapmayı otomatik olarak ciddi risk sayıp paragraf 15\u0027in kuralını buraya taşırsın; ayrıca maddi doğrulamayı tamamen reddedersin. Doğrusu: Sapma kendiliğinden ciddi risk oluşturmaz, paragraf 17\u0027deki üç seçenek arasında karar verilir ve maddi doğrulama bu seçeneklerden biridir."},"B":{"ad":"Üç Denetim Kuralı Tuzağı","metin":"Paragraf 14\u0027teki \u0027en az her üç denetimin birinde test\u0027 kuralının, kontrollerde önemli değişiklik OLMADIĞI hale ait olduğunu unutup sapma tespit edilen duruma da uygulanabileceğini düşünürsün. Doğrusu: Sapma tespit edilince paragraf 14(a) gereği kontrol cari denetimde test edilir, erteleme yapılamaz."}},"celdiriciYol":{},"hap":"Kontrol testinde sapma tespit edilince denetçi önce özel sorgulama yapar, sonra ilave kontrol testi mi maddi doğrulama mı gerektiğine karar verir; üç denetim kuralı sadece değişiklik olmayan hale özgüdür.","teshis":{"C":{"gercek":"p.16 yanlışlık tespit edilmemesinin kontrol etkinliğine dair denetim kanıtı sağlamayacağını açıkça belirtir.","ayirt":"Bu durum \u0027kanıt yok\u0027 mu, \u0027kanıt var\u0027 mı?","paragraf":"p.16","yanilgi":"Maddi doğrulamada hata bulunmamasının, kontrolün iyi çalıştığının kanıtı olduğunu düşünürsün."},"E":{"gercek":"p.17 giriş cümlesi özel sorgulamaları ilk adım olarak sayar, karar bundan sonra verilir.","ayirt":"Sorgulama adımını atladım mı?","paragraf":"p.17","yanilgi":"Sorgulama basamağının ihmal edilebilir bir ayrıntı olduğunu, direkt teste geçilebileceğini düşünürsün."},"A":{"gercek":"BDS 330 p.17, sapma tespitinde özel sorgulama ve ardından (a)(b)(c) seçeneklerinden birine karar verilmesini şart koyar.","ayirt":"Sorgulama yapmadan direkt karara mı geçtim?","paragraf":"p.17","yanilgi":"Sapma bulununca doğrudan otomatik olarak ilave test yapılır sanıp, önce sorgulama ve üçlü karar aşamasının atlanabileceğini düşünürsün."},"D":{"gercek":"Ciddi risk ayrı bir değerlendirmedir (p.15); sapma tek başına ciddi risk oluşturmaz, p.17 üç seçenek sunar.","ayirt":"Bu risk ayrıca ciddi risk olarak değerlendirildi mi, yoksa sapmadan otomatik mi çıkardım?","paragraf":"p.15, p.17","yanilgi":"Her sapmanın otomatik olarak ciddi risk yarattığını ve maddi doğrulamanın devre dışı kalacağını düşünürsün."},"B":{"gercek":"p.14(a) sapma/değişiklik halinde kontrolün cari denetimde test edilmesini zorunlu kılar; üç denetim kuralı yalnız değişiklik olmayan hale özgüdür.","ayirt":"Kontrolde değişiklik/sapma var mı, varsa erteleme mümkün mü?","paragraf":"p.14","yanilgi":"Üç denetimde bir test kuralının sapma durumunda da geçerli olduğunu, kontrolü ertelemenin serbest olduğunu düşünürsün."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 71"},"kural":"Faaliyet kârı, brüt satış kârından faaliyet giderlerinin düşülmesiyle bulunur; banka faiz geliri ve kambiyo zararı faaliyet kârından sonra gelen diğer faaliyet kalemleridir, hesaba girmez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 71","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Marj sorularında önce hangi marjın hangi kademeye kadar hesaplandığını belirle, sonra faaliyet dışı kalemleri (faiz, kambiyo, finansman) hesaba katma.","konu":"kâr marjı analizi","tablo":{"satirlar":[["VERİLENLER","-"],["Net satışlar","1.000.000 TL"],["Brüt kâr marjı","%30"],["Faaliyet kâr marjı","%18"],["Banka faiz geliri","40.000 TL"],["Kambiyo zararı","25.000 TL"],["HESAP","-"],["Brüt Kâr (1.000.000 × %30)","300.000"],["Faaliyet Kârı (1.000.000 × %18)","180.000"],["Faaliyet Giderleri Toplamı (300.000-180.000)","120.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"120.000","E":"160.000","A":"80.000","D":"145.000","B":"95.000"},"kaynak":{"alinti":"Faaliyet Kârı = Brüt Satış Kârı − Faaliyet Giderleri","liste":[{"ad":"VUK (213 s.K.) m.275 - İmal edilen emtia","metin":"İmal edilen emtia: Madde 275 – İmal edilen emtianın (Tam ve yarı mamul mallar) maliyet bedeli aşağıda yazılı unsurları ihtiva eder: 1. Mamulün vücuda getirilmesinde sarf olunan iptidai ve ham maddelerin bedeli; 2. Mamule isabet eden işçilik; 3. Genel imal giderlerinden mamule düşen hisse; 4. Genel idare giderlerinden mamule düşen hisse; (Bu hissenin mamulün maliyetine katılması ihtiyaridir.) 5. Ambalajlı olarak piyasaya arz edilmesi zaruri olan mamullerde ambalaj malzemesinin bedeli. Mükellefler, imal ettikleri emtianın maliyet bedellerini yukarıki unsurları ihtiva etmek şartiyle diledikleri usulde tayin edebilirler. (Üçüncü fıkra mülga: 30/12/1980-2365/51 md.)"},{"ad":"TEORI - Keynesyen carpan, marjinal tuketim egilimi ve harcama carpani","metin":"TEORİ (makroekonomi; mevzuat maddesi yok). MARJİNAL TÜKETİM EĞİLİMİ (MPC, c): gelirdeki bir birimlik artışın tüketime giden payı (ΔC/ΔY), 0 ile 1 arasında; marjinal tasarruf eğilimi MPS = 1 − c. ORTALAMA tüketim eğilimi C/Y\u0027dir, gelir arttıkça düşer (Keynes\u0027in mutlak gelir hipotezi). HARCAMA ÇARPANI: otonom harcamadaki (yatırım, kamu harcaması, ihracat) bir birimlik artış geliri k = 1/(1−c) kat artırır; c=0,8 → çarpan 5; c=0,75 → 4. Mantık: harcama gelir olur, gelirin c kadarı yeniden harcanır, sonsuz geometrik seri 1 + c + c² + … = 1/(1−c). VERGİ ÇARPANI = −c/(1−c): götürü vergi artışı geliri harcama çarpanından KÜÇÜK (c katı) düşürür, çünkü verginin yalnız c kadarı harcamadan kesilir. DENGELİ BÜTÇE ÇARPANI = 1: harcama ve vergi aynı miktar artınca gelir o miktar kadar artar. ÇARPANI KÜÇÜLTENLER: oransal gelir vergisi t → k = 1/(1 − c(1−t)); marjinal ithalat eğilimi m → k = 1/(1 − c + m); faiz artışı (IS-LM), fiyat artışı (AD-AS). Tasarruf paradoksu: herkes daha çok tasarruf etmek isteyince gelir düşer, toplam tasarruf artmayabilir. SINAV TUZAĞI: (1) Çarpanın paydası 1 − MPC = MPS\u0027dir; \u0027MPC\u0027 ile bölmek tuzak. (2) Vergi çarpanı negatif ve mutlak değerce harcama çarpanından küçüktür. (3) Dışa açık ekonomide ithalat eğilimi çarpanı küçültür, büyütmez."}],"hakem":"Soru faaliyet kâr marjı ve faaliyet kârı hesaplamasını ölçüyor; doğru sıkka ulaşmak için VUK ve muhasebe teorisindeki faaliyet kârı tanımı (brüt kâr − faaliyet giderleri) ve finansal kalemlerin faaliyet kârından sonra geldiği kuralı uygulamak gerekiyor; kaynak metinde \u0027Faaliyet Kârı = Brüt Satış Kârı − Faaliyet Giderleri\u0027 tanımı ve \u0027banka faiz geliri...faaliyet kârından SONRA gelir\u0027 kuralı açıkça destekliyor."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":{"bosluk":[[2,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Brüt Kâr (2.000.000 × %40)","800.000"],["Faaliyet Kârı (2.000.000 × %25)","500.000"],["Faaliyet Giderleri Toplamı (800.000-500.000)","300.000"]]},"tur":"tablo","soru":"Bir mobilya işletmesinin 2026 yılı net satışları 2.000.000 TL, brüt kâr marjı %40, faaliyet kâr marjı %25\u0027tir. Aynı dönemde işletme 60.000 TL banka faiz geliri elde etmiş, 15.000 TL kambiyo zararına uğramıştır. Bu bilgilere göre işletmenin 2026 yılı faaliyet giderleri toplamı kaç TL\u0027dir?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve faaliyet giderleri toplamının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir hazır giyim işletmesinin 2026 yılı net satışları 1.000.000 TL, brüt kâr marjı %30, faaliyet kâr marjı %18\u0027dir. Aynı dönemde işletme 40.000 TL banka faiz geliri elde etmiş, 25.000 TL kambiyo zararına uğramıştır. Bu bilgilere göre işletmenin 2026 yılı faaliyet giderleri toplamı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-mta-cokzor/kp-27","verilenler":[{"deger":"1.000.000 TL","anlam":"Her üç kâr marjının paydası; brüt ve faaliyet kârı bu tutar üzerinden marjla çarpılarak bulunur.","ad":"Net satışlar"},{"deger":"%30","anlam":"Net satışlarla çarpılarak brüt satış kârı tutarı bulunur.","ad":"Brüt kâr marjı"},{"deger":"%18","anlam":"Net satışlarla çarpılarak faaliyet kârı tutarı bulunur.","ad":"Faaliyet kâr marjı"},{"deger":"40.000 TL","anlam":"Çeldirici verilen; diğer faaliyetlerden olağan gelirdir, faaliyet giderleri hesabına girmez.","ad":"Banka faiz geliri"},{"deger":"25.000 TL","anlam":"Çeldirici verilen; diğer faaliyetlerden olağan giderdir, faaliyet giderleri hesabına girmez.","ad":"Kambiyo zararı"}],"dayanak":"TEORİ - Kâr marji analizi (mali analiz teori notu)","dogru":"C","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Verilen: Net satışlar 1.000.000 TL (soruda verilen); Brüt kâr marjı %30 (soruda verilen); Faaliyet kâr marjı %18 (soruda verilen); Banka faiz geliri 40.000 TL (soruda verilen); Kambiyo zararı 25.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: net satışlar, brüt kâr marjı, faaliyet kâr marjı, banka faiz geliri ve kambiyo zararı. Bu beş rakamla faaliyet giderleri toplamını arıyoruz.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"Brüt Kâr = Net Satışlar × Brüt Kâr Marjı = 1.000.000 (soruda verilen) × %30 (soruda verilen) = 300.000 TL","anlatim":"Brüt kâr, net satışların brüt kâr marjı kadarlık kısmıdır - satışlardan satılan malın maliyeti düşülünce kalan tutardır. Şimdi bunu hesaplıyoruz.","doldur":[[7,1]]},{"formul":"Faaliyet Kârı = Net Satışlar × Faaliyet Kâr Marjı = 1.000.000 (soruda verilen) × %18 (soruda verilen) = 180.000 TL","anlatim":"Faaliyet kârı, brüt kârdan faaliyet giderleri düşülünce kalan tutardır. Aynı mantıkla önce faaliyet kârını buluyoruz, sonra geriye gidip gideri çıkaracağız.","doldur":[[8,1]]},{"formul":"Dahil değil: Banka faiz geliri 40.000 TL (soruda verilen)","anlatim":"Banka faiz geliri nedir? İşletmenin ana faaliyeti dışında bankadan kazandığı gelirdir, faaliyet kârından sonra gelen diğer faaliyet gelirleri grubuna girer. Faaliyet giderleri hesabına hiç girmez.","doldur":[]},{"formul":"Dahil değil: Kambiyo zararı 25.000 TL (soruda verilen)","anlatim":"Kambiyo zararı nedir? Döviz kurundaki değişimden doğan zarardır, bu da esas faaliyet dışı bir kalemdir. Dikkat: bu iki kalem çeldirici, hesaba hiç dahil olmaz.","doldur":[]},{"formul":"Faaliyet Giderleri Toplamı = Brüt Kâr − Faaliyet Kârı = 300.000 (2. adımda bulduk) − 180.000 (3. adımda bulduk) = 120.000 TL","anlatim":"Faaliyet giderleri toplamı, brüt kâr ile faaliyet kârı arasındaki farktır - çünkü faaliyet kârına brüt kârdan bu giderler düşülerek ulaşılır. Şimdi bu farkı hesaplıyoruz.","doldur":[[9,1]]},{"formul":"Sonuç: Faaliyet Giderleri Toplamı = 120.000 TL","anlatim":"Sonuç: işletmenin 2026 yılı faaliyet giderleri toplamı 120.000 TL\u0027dir. Bu tutar brüt kâr ile faaliyet kârı arasındaki farktan çıktı.","doldur":[]},{"formul":"Ters durum: faaliyet kârı sorulsaydı → Brüt Kâr − Faaliyet Giderleri = Faaliyet Kârı","anlatim":"Ters durumda: soru faaliyet giderleri yerine faaliyet kârını isteseydi, brüt kârdan faaliyet giderlerini çıkarman gerekirdi. Yön değişse de mantık aynı kalır.","doldur":[]},{"formul":"Yanlış yol: 300.000 − 180.000 + 40.000 − 25.000 = 135.000 (HATALI) → doğrusu 120.000 (6. adımda bulduk)","anlatim":"En sık hata: banka faiz geliri ve kambiyo zararını brüt kârdan çıkarıp faaliyet giderlerine dahil etmek. Bu iki kalem faaliyet kârından sonraki diğer faaliyet grubuna aittir, hesaba hiç girmez.","doldur":[]}],"anahtar":[{"ornek":"faaliyet","kok":"faaliy"},{"ornek":"giderleri","kok":"giderl"},{"ornek":"geliri","kok":"geliri"},{"ornek":"rından","kok":"rından"},{"ornek":"zararı","kok":"zararı"},{"ornek":"kambiyo","kok":"kambiy"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu kademeleri (brüt-faaliyet-olağan-dönem kârı) birbirine karıştırılmak istendiğinde. Nasıl ölçülür: her kâr türü kendi kalemleriyle net satışlara bölünerek marj bulunur. Nasıl kaydedilir: faaliyet dışı gelir-giderler (faiz, kambiyo) ayrı hesap gruplarında (64x, 65x, 66x) tutulur, faaliyet kârına karışmaz.","desen":"Soru banka faiz geliri ve kambiyo zararını faaliyet kârına dahil ettirmeye çalışan klasik bir tuzak kurar; bu kalemler olağan kâr aşamasına ait olup faaliyet kâr marjını etkilemez. Öğrenci bu iki rakamı hesaba katarsa faaliyet giderlerini yanlış bulur. Bu soru faaliyet kârı ile olağan kâr arasındaki ayrım noktasından geliyor (p. teori - faaliyet kâr marjı).","terimler":[{"kaynak":"soruda verilir","tanim":"brüt satışlardan iade ve iskontolar düşülünce kalan tutar","ad":"Net satışlar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"net satışlardan satılan malın maliyeti düşülünce kalan tutar","ad":"Brüt satış kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"esas faaliyeti sürdürmek için yapılan pazarlama, ARGE ve yönetim giderleri toplamı","ad":"Faaliyet giderleri","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"faaliyet kârının net satışlara bölünmesiyle bulunan oran","ad":"Faaliyet kâr marjı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Net satışlar ve iki farklı kâr marjı verilir, faaliyet giderleri toplamı istenir; faiz geliri ve kambiyo zararı çeldiricidir.","panel_ornek":"Diyelim ki 200 TL\u0027lik bir kırtasiye alışverişi yaptın, market bunun 60 TL\u0027sini kâr olarak koydu; sonra kargon geç geldi diye sana 5 TL indirim yaptılar. O 5 TL indirim, marketin asıl satış kârını değiştirmez, ayrı bir kalemdir. İşte faaliyet dışı gelir-gider de tam böyle, esas kârın dışında kalır.","ornek":"Diyelim ki 200 TL\u0027lik bir kırtasiye alışverişi yaptın, market bunun 60 TL\u0027sini kâr olarak koydu; sonra kargon geç geldi diye sana 5 TL indirim yaptılar. O 5 TL indirim, marketin asıl satış kârını değiştirmez, ayrı bir kalemdir. İşte faaliyet dışı gelir-gider de tam böyle, esas kârın dışında kalır.","yontemler":"Önce brüt kâr marjından brüt satış kârı, sonra faaliyet kâr marjından faaliyet kârı hesaplanır; ikisinin farkı faaliyet giderlerini verir. Faiz geliri ve kambiyo zararı bu hesaba hiç girmez.","nedir":"Kâr marjı analizi, bir işletmenin satışlarından ne kadar verimli kâr elde ettiğini gösterir. Sınav, brüt-faaliyet-olağan kâr basamaklarını birbirine karıştırmadan ayırt edebilmeni ölçer."},"olay":"Brüt kâr = 1.000.000×%30=300.000; Faaliyet kârı = 1.000.000×%18=180.000; Faaliyet giderleri = 300.000-180.000=120.000.","tuzak":{"D":{"ad":"Ters İşaretli Düzeltme Tuzağı","metin":"Kambiyo zararını faaliyet kârından çıkarılması gereken bir tutar sanıp faaliyet kârını küçültürsün. Doğrusu: Kambiyo zararı faaliyet kârı marjını hiç etkilemez, olağan kâr kademesinde yer alır."},"E":{"ad":"Faaliyet Dışı Geliri Brüt Kâra Katma Tuzağı","metin":"Banka faiz gelirini brüt kâra ekleyip faaliyet giderini bu şişirilmiş tutardan hesaplarsın. Doğrusu: Faiz geliri brüt kâr kademesine değil, olağan kâr kademesine aittir."},"A":{"ad":"Ters Katman Kaydırma Tuzağı","metin":"Banka faiz gelirini yanlışlıkla brüt kârdan düşerek faaliyet giderini bulursun. Doğrusu: Faiz geliri diğer faaliyet gelirlerindendir, brüt kâr hesabına hiç girmez."},"B":{"ad":"Diğer Faaliyet Zararını Geri Ekleme Tuzağı","metin":"Kambiyo zararının faaliyet kârından düşülmüş olduğunu düşünüp bu tutarı faaliyet kârına geri eklersin. Doğrusu: Kambiyo zararı faaliyet kârı hesabına hiç girmemiştir, geri eklenecek bir şey yoktur."}},"celdiriciYol":{"D":"1.000.000×0,30 − (1.000.000×0,18−25.000) = 300.000-155.000 = 145.000 (kambiyo zararını faaliyet kârından ters yönde çıkarma)","E":"(1.000.000×0,30+40.000) − 1.000.000×0,18 = 340.000-180.000 = 160.000 (faiz gelirini brüt kâra dahil etme)","A":"(1.000.000×0,30 − 40.000) − 1.000.000×0,18 = 260.000-180.000 = 80.000 (faiz gelirini brüt kârdan yanlışlıkla düşme)","B":"1.000.000×0,30 − (1.000.000×0,18+25.000) = 300.000-205.000 = 95.000 (kambiyo zararını faaliyet kârına geri ekleme)"},"hap":"Faaliyet kâr marjı yalnız esas faaliyet kalemlerinden (satılan malın maliyeti ve faaliyet giderleri) etkilenir; finansman gideri ile diğer faaliyet gelir-giderleri bu marjın tamamen dışındadır.","teshis":{"C":{"gercek":"Faaliyet kârı = Brüt Satış Kârı − Faaliyet Giderleri\u0027dir; finansman, diğer faaliyet gelir-gider ve olağandışı kalemler bu kademeye hiç dahil olmaz.","ayirt":"Bu kalem faaliyet kârından önce mi, sonra mı gelir?","paragraf":"TEORİ - Kar marji analizi","yanilgi":"Bu şıkkı eleyen öğrenci, faiz geliri veya kambiyo zararının faaliyet giderleri hesabına bir şekilde girmesi gerektiğini düşünüyor."},"E":{"gercek":"Faiz geliri diğer faaliyetlerden olağan gelirdir; brüt satış kârı sadece net satışlar ile satılan malın maliyeti farkından oluşur.","ayirt":"Bu gelir satıştan mı, yoksa finansal bir işlemden mi kaynaklanıyor?","paragraf":"TEORİ - Faaliyet kâr marji ve faaliyet kari hesabı","yanilgi":"Faiz gelirinin brüt kârı artıran bir kalem olduğunu, bu yüzden brüt kâra eklenmesi gerektiğini düşünüyorsun."},"A":{"gercek":"Faiz geliri diğer faaliyetlerden olağan gelirdir, brüt satış kârı yalnız net satışlar ile satılan malın maliyetinden oluşur.","ayirt":"Bu kalem satış-maliyet ilişkisinden mi doğuyor, yoksa faaliyet dışı bir gelir mi?","paragraf":"TEORİ - Faaliyet kâr marjı ve faaliyet kârı hesabı","yanilgi":"Faiz gelirinin brüt kârı azaltan bir kalem olduğunu, dolayısıyla brüt kârdan düşülmesi gerektiğini düşünüyorsun."},"D":{"gercek":"Kambiyo zararı olağan kâr kademesinde yer alır; faaliyet kârı marjını etkilemez, işaret yönünde bir düzeltme gerekmez.","ayirt":"Bu kalemin faaliyet kârı marjını değiştirdiğine dair kaynakta bir kural var mı?","paragraf":"TEORİ - Kar marji analizi","yanilgi":"Kambiyo zararının faaliyet kârından çıkarılması gerektiğini, yani faaliyet kârının bu zararla küçültülmesi gerektiğini düşünüyorsun."},"B":{"gercek":"Kambiyo zararı 65x grubunda diğer faaliyetlerden olağan giderdir t maddesi yok). DİKEY (ORTAK BOYUTLU) ANALİZ: her kalemin, ait olduğu grup toplamına veya genel toplama ORANI hesaplanır. BİLANÇODA taban AKTİF (PASİF) TOPLAMIDIR ve %100 kabul edilir. GELİR TABLOSUNDA taban NET SATIŞLARDIR ve %100 kabul edilir. AMACI: tek bir dönemin YAPISINI görmek ve farklı buyukluklerdeki işletmeleri KARŞILAŞTIRILABİLİR kilmak. Yatay analizden farkı: yatay analiz DÖNEMLER ARASI DEĞİŞİMİ, dikey analiz TEK DÖNEMİN IC YAPISINI gösterir. OZ KAYNAK / AKTİF TOPLAMI YORUMU: bu oran işletmenin varlıklarının yüzde kaçının ORTAKLARCA finanse edildiğini gösterir (finansman yapısı). Oranın YÜKSEK olması mali bağımsızlığı ve borç ödeme gücünü artırır, riski azaltır; ancak aşırı yüksek olması KALDIRAÇTAN YARARLANILMADIGI (oz kaynak karlılığının düşük kalabilecegi) anlamına gelebilir. Tamamlayıcı oran: Yabancı Kaynak / Aktif Toplamı; ikisinin toplamı %100\u0027dur. BİLANÇO OKUMASI: dönen varlık oranı yüksekse likidite güçlü ama atıl fon riski; duran varlık oranı yüksekse sabit maliyet yükü ve esneklik kaybı. Kısa vadeli yabancı kaynak oranı yüksekse likidite baskisi vardır. SINAV TUZAĞI: dikey analizde bir kalemin YÜZDESİ artmış olabilir ama TUTARI azalmış olabilir - yüzde değişimi tek başına tutar artışı anlamına GELMEZ; taban da değişmiştir."}],"hakem":"Soru dikey yüzde analizi yöntemiyle grup içi yüzde hesaplaması kuralını doğru uygulamaktadır; hesap (Dönen Varlıklar = 600.000 × %50 = 300.000; Stoklar = 300.000 × %40 = 120.000) ve sonuç (120.000 TL) kurallarla örtüşmektedir."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":11,"ornekler":[],"donemler":["2026/2","2025/3","2024/3","2024/2","2020/2","2019/3","2019/1","2018/3","2016/2","2015/2","2015/1"]},"oyun":{"bosluk":[[1,1]],"tablo":{"basliklar":["Kalem (Hesap)","Tutar (TL)"],"satirlar":[["Duran Varlıklar (800.000 x %60)","480.000"],["Maddi Duran Varlıklar (480.000 x %25)","120.000"]]},"tur":"tablo","soru":"İşletmenin 31.12.2026 üzde önce o grubun kendi tutarına uygulanır, aktife değil. Önce dönen varlıklar toplamını buluyoruz.","doldur":[[5,1]]},{"formul":"Stoklar = Dönen Varlıklar × %40 = 300.000 (1. adımda bulduk) × %40 = 120.000","anlatim":"Stoklar nedir? Satış için elde tutulan mal ve maddeler; dönen varlıklar içinde yer alır. Şimdi bu grubun içindeki payını hesaplıyoruz.","doldur":[[6,1]]},{"formul":"Sonuç = 120.000 TL","anlatim":"Sonuç: stokların tutarı 120.000 TL çıktı. Bu iki aşamalı yüzde hesabının doğal sonucu.","doldur":[]},{"formul":"Yanlış yol: 600.000 × %40 = 240.000 (HATALI) → doğrusu 120.000 (4. adımda bulduk)","anlatim":"En sık hata: yüzdeyi doğrudan aktif toplamına uygulamak. Dikkat: %40, aktifin değil dönen varlıkların yüzdesidir.","doldur":[]}],"anahtar":[{"ornek":"varlıklar","kok":"varlık"},{"ornek":"uygulanır","kok":"uygula"},{"ornek":"grubunun","kok":"grubun"},{"ornek":"stoklar","kok":"stokla"},{"ornek":"tutarına","kok":"tutarı"},{"ornek":"içinde","kok":"içinde"}],"konuGiris":{"harita":"Ne zaman test edilir: bilanço veya gelir tablosunun tek bir dönemine ait kalemler verildiğinde. Nasıl ölçülür: her kalem kendi ait olduğu toplamın (aktif toplamı, grup toplamı veya net satışlar) yüzdesi olarak ifade edilir. Nasıl kaydedilir: zincirleme yüzdelerden geriye doğru çarpılarak istenen kalemin TL tutarı hesaplanır.","desen":"Soru genelde aktif toplamını verip iki kademeli yüzde (önce gruba, sonra grup içi kaleme) sorarak zincirleme çarpım gerektirir; tuzak taban karışıklığıdır, ikinci yüzde aktif toplamına değil dönen varlıklar toplamına uygulanır. Bazı sorularda öğrenci yanlışlıkla iki yüzdeyi toplayıp doğrudan aktif toplamına uygular, bu hatalıdır. Bu soru dikey analizde grup içi (bileşik) yüzde hesaplama noktasından geliyor (p.28, 11 dönemde soruldu).","terimler":[{"kaynak":"soruda verilir","tanim":"Bilançoda %100 kabul edilen taban değer","ad":"Aktif toplamı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Dönen varlıkların aktif a etkilediğini belirle.","konu":"cari oran hesaplama","tablo":{"satirlar":[["VERİLENLER","-","-"],["Dönen Varlıklar","180.000 TL","-"],["Kısa Vadeli Yabancı Kaynaklar","120.000 TL","-"],["Nakit Ödeme Tutarı","30.000 TL","-"],["HESAP","-","-"],["Dönen Varlıklar","180.000","150.000"],["Kısa Vadeli Yabancı Kaynaklar","120.000","90.000"],["Cari Oran","1,50","1,67"]],"basliklar":["Kalem","Ödeme Öncesi","Ödeme Sonrası"]},"siklar":{"C":"1,67","E":"2,00","A":"1,25","D":"1,75","B":"1,50"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Cari orani artiran/azaltan islemler","metin":"TEORİ/TEKNİK (mali analiz, mevzuat maddesi yok). CARİ ORAN = Dönen Varlıklar / Kısa Vadeli Yabancı Kaynaklar. BİR İŞLEMİN ORANA ETKİSİ, oranın BAŞLANGIÇTA 1\u0027DEN BÜYÜK MU KÜÇÜK MU olduğunu bilmeyi gerektirir. UC DURUM: (1) ORANI DEĞİŞTİRMEYEN İŞLEMLER - hem payı hem paydayı ETKİLEMEYEN veya sadece DÖNEN VARLIK KALEMLERİ ARASINDA yer değiştiren işlemler: peşin mal alımı (kasa azalır, stok artar), alacağın tahsili (alacak azalır, kasa artar), stoğun MALİYET BEDELİYLE peşin satışı. Toplam dönen varlık değişmez, oran AYNI KALIR. (2) ORANI ARTIRAN İŞLEMLER (oran 1\u0027den BÜYÜKSE): kısa vadeli borcun nakit ödenmesi (pay ve payda EŞİT tutarda azalır; oran 1\u0027den büyükse ARTAR), duran varlığın peşin satılması (dönen varlık artar, KVYK değişmez), sermaye artirimi/nakit girişi, uzun vadeli borçlanıp nakit girmesi (dönen varlık artar, KVYK değişmez), kârla satış (stok çıkar, daha büyük tutarda alacak/kasa girer). (3) ORANI AZALTAN İŞLEMLER: duran varlığın kısa vadeli borçla alınması (KVYK artar, dönen varlık değişmez), uzun vadeli borcun kısa vadeye dönüşmesi, nakitle temettü ödenmesi, zararla satış. KRİTİK KURAL: pay ve paydadan EŞİT TUTAR düşüldüğünde oran 1\u0027den BÜYÜKSE ARTAR, 1\u0027den KÜÇÜKSE AZALIR, 1\u0027e EŞİTSE DEĞİŞMEZ. SINAV TUZAĞI: \u0027kısa vadeli borç ödemek cari oranı her zaman artırır\u0027 önermesi YANLIŞTIR - oran 1\u0027in altındaysa ödeme oranı DAHA DA DÜŞÜRÜR. Soruda başlangıç oranı mutlaka kontrol edilmelidir."}],"hakem":"Cari oran formülü (Dönen Varlıklar / Kısa Vadeli Yabancı Kaynaklar) ve nakit borç ödemesinin oran üzerindeki etkisi (1\u0027den büyük oran ise eşit tutar düşülmesiyle oran artar) kaynak metinde açıkça tanımlanmış ve kurala uygun şekilde uygulanmıştır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[{"yil":"2024/3","alinti":"…) oranı 0,5 olarak gerçekleşmiştir. Dönen Varlıklar Duran Varlıklar Kısa Vadeli Yabancı Kaynaklar Uzun Vadeli Yabancı Kaynaklar Özkaynaklar 2022 ? ₺ ? ₺ 10.000 ₺ ? ₺ ? ₺ 2023 20.000 ₺ ? ₺ ? ₺ 20.000 ₺ 30.000 ₺ Buna göre işletmenin 2022 yılı dönen varlıklar ve 2023 yılı kısa vadeli yabancı kaynaklar toplamı kaç ₺’dir?"}],"donemler":["2025/1","2024/3","2016/3","2015/1"]},"oyun":{"bosluk":[[0,2],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Kalem","Ödeme Öncesi","Ödeme Sonrası"],"satirlar":[["Dönen Varlıklar","250.000","200.000"],["Kısa Vadeli Yabancı Kaynaklar","200.000","150.000"],["Cari Oran","1,25","1,33"]]},"tur":"tablo","soru":"İşletmenin ödeme öncesi dönen varlıkları 250.000 TL, kısa vadeli yabancı kaynakları 200.000 TL\u0027dir. İşletme, 50.000 TL tutarındaki kısa vadeli banka kredisini nakit olarak ödemiştir. Bu işlemden sonra işletmenin cari oranı kaçtır?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve işletmenin ödeme sonrası cari oranının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmenin ödeme öncesi dönen varlıkları 180.000 TL, kısa vadeli yabancı kaynakları 120.000 TL\u0027dir. İşletme, 30.000 TL tutarındaki kısa vadeli banka kredisini nakit olarak ödemiştir. Bu işlemden sonra işletmenin cari oranı kaçtır?","kayitBaslik":"","id":"sgs-t1-mta-kolay/kp-04","verilenler":[{"deger":"180.000 TL","anlam":"Ödeme öncesi cari oranın payını oluşturan toplam dönen varlık tutarı.","ad":"Dönen Varlıklar"},{"deger":"120.000 TL","anlam":"Ödeme öncesi cari oranın paydasını oluşturan toplam kısa vadeli borç tutarı.","ad":"Kısa Vadeli Yabancı Kaynaklar"},{"deger":"30.000 TL","anlam":"Kısa vadeli banka kredisinin nakit ödenen kısmı; hem kasa (dönen varlık) hem borç (kısa vadeli yabancı kaynak) bu tutar kadar azalır.","ad":"Nakit Ödeme Tutarı"}],"dayanak":"Mali analiz teorisi - cari oran formülü ve eşit tutar düşümü kuralı","dogru":"C","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Verilen: Dönen Varlıklar 180.000 TL (soruda verilen); Kısa Vadeli Yabancı Kaynaklar 120.000 TL (soruda verilen); Ödenen kredi 30.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: ödeme öncesi dönen varlıklar 180.000 TL, kısa vadeli yabancı kaynaklar 120.000 TL. Ayrıca 30.000 TL\u0027lik banka kredisi nakit ödenmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[5,1],[6,1]]},{"formul":"Cari Oran = Dönen Varlıklar / Kısa Vadeli Yabancı Kaynaklar = 180.000 (soruda verilen) / 120.000 (soruda verilen) = 1,50","anlatim":"Ödeme öncesi cari oranı bulalım - bu bize başlangıç durumunu gösterir. Cari oran, dönen varlığın kısa vadeli borcu kaç kat karşıladığını gösterir.","doldur":[[7,1]]},{"formul":"Dönen Varlıklar (yeni) = 180.000 (soruda verilen) − 30.000 (soruda verilen) = 150.000","anlatim":"Banka kredisi nakitle ödenince hem kasa (dönen varlık) hem de borç 30.000 TL azalır. Dikkat: pay ve paydadan eşit tutar düşülüyor, oran sabit kalmaz çünkü paydalar farklı büyüklükte.","doldur":[[5,2]]},{"formul":"Kısa Vadeli Yabancı Kaynaklar (yeni) = 120.000 (soruda verilen) − 30.000 (soruda verilen) = 90.000","anlatim":"Aynı 30.000 TL kısa vadeli yabancı kaynaktan da düşülür, çünkü kredi kısa vadeli borçtu. Böylece paydamız küçülüyor.","doldur":[[6,2]]},{"formul":"Cari Oran (yeni) = Dönen Varlıklar / Kısa Vadeli Yabancı Kaynaklar = 150.000 (3. adımda bulduk) / 90.000 (4. adımda bulduk) = 1,67","anlatim":"Şimdi yeni değerlerle cari oranı hesaplıyoruz. Cari oran 1\u0027den büyükken paydan-paydan eşit tutar çıkınca oran büyür, çünkü payda oransal olarak daha çok küçülür.","doldur":[[7,2]]},{"formul":"Ters durum: cari oran \u003c 1 → eşit tutar çıkarınca oran KÜÇÜLÜR","anlatim":"Ters durumda: eğer cari oran 1\u0027den küçük olsaydı, eşit tutar düşülmesi oranı düşürürdü. Bu yüzden başlangıç oranının 1\u0027in üstünde olup olmadığına dikkat etmek gerekir.","doldur":[]},{"formul":"Yanlış yol: Cari Oran = 1,50 (HATALI, değişmez sanılır) → doğrusu 1,67 (5. adımda bulduk)","anlatim":"En sık hata: öğrenci oranın değişmeyeceğini düşünüp 1,50\u0027yi cevap sanır. Oysa pay ile payda aynı tutarda azalsa da oranları farklı değiştiği için oran mutlaka değişir.","doldur":[]}],"anahtar":[{"ornek":"düşülürse","kok":"düşülü"},{"ornek":"vadeli","kok":"vadeli"},{"ornek":"paydadan","kok":"paydad"},{"ornek":"büyükken","kok":"büyükk"},{"ornek":"farklı","kok":"farklı"},{"ornek":"öncesi","kok":"öncesi"}],"konuGiris":{"harita":"Ne zaman test edilir: bir nakit ödeme ya da varlık hareketinden sonra oranın nasıl değiştiği sorulduğunda. Nasıl ölçülür: dönen varlıklar kısa vadeli yabancı kaynaklara bölünerek. Nasıl kaydedilir: işlem öncesi ve sonrası tutarlar ayrı ayrı hesaplanıp yeni oran tek sayı olarak yazılır.","desen":"Soru, başlangıç oranının 1\u0027den büyük mü küçük mü olduğunu kontrol etmeden \u0027borç ödemek her zaman oranı artırır\u0027 tuzağına düşürmeyi hedefler. Çıkmış arşivde bu tip işlem sonrası oran hesaplaması 4 dönemde sorulmuştur. Bu soru p.28 kısa vadeli borç ödemesinin cari orana etkisi noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Bir yıl içinde paraya çevrilebilecek varlıklar toplamı","ad":"Dönen varlık","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Bir yıl içinde ödenmesi gereken borçlar toplamı","ad":"Kısa vadeli yabancı kaynak","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönen varlığın kısa vadeli yabancı kaynağa bölünmesiyle bulunan katsayı","ad":"Cari ora (payda) kalemleri ve kurallar","metin":"TEORİ/TEKNİK (mali analiz, mevzuat maddesi yok). PAYDA (TABAN) SEÇİMİ - EN ÇOK SORULAN NOKTA: BİLANÇODA taban AKTİF TOPLAMI (= PASİF TOPLAMI) olup %100 kabul edilir. GELİR TABLOSUNDA taban NET SATIŞLAR olup %100 kabul edilir - BRÜT SATIŞLAR DEĞİL. GRUP İÇİ DİKEY ANALİZ: bir kalemin ait olduğu GRUP TOPLAMINA oranı da hesaplanabilir (or. stokların dönen varlıklara oranı); bu \u0027grup içi yüzde\u0027dir ve genel yuzdeden farklıdır. Soru hangisini istiyorsa taban ona göre seçilir. KURALLAR: (1) Her kalem KENDİ TABANINA bölünür ve 100 ile çarpılır. (2) Bir gruptaki yuzdelerin toplamı o grubun genel yüzdesine eşit olmalıdır - kontrol noktasıdır. (3) Negatif (aktifi düzenleyici, \u0027-\u0027 işaretli) kalemler ait oldukları grupta EKSİ olarak gösterilir; birikmiş amortisman, şüpheli alacak karşılığı, satış iskontoları boyledir. (4) Farklı büyüklükteki işletmeler ancak dikey yüzdelerle karşılaştırılabilir - yöntemin asıl amacı budur. AVANTAJ: olcekten arindirir, yapıyı gösterir. SINIRLAMA: TEK DÖNEM bilgisi verir, eğilimi göstermez; bu yüzden yatay/trend analiziyle birlikte kullanılır. SINAV TUZAĞI: gelir tablosunda taban NET SATIŞLARDIR; brüt satışları taban almak tüm yüzdeleri kaydırır. Ayrıca bir kalemin yüzdesinin artması TUTARININ arttığı anlamına gelmez - taban da değişmiş olabilir; yüzde ve tutar birlikte okunur."}],"hakem":"Soru dikey analiz metodolojisini (taban net satışlar, oranlar aracılığıyla brüt kâr hesabı) doğru ölçüyor ve kaynak metinlerde açıkça desteklenen kurallardan yapılmıştır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/1"]},"oyun":{"bosluk":[[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Net Satışlar (800.000-150.000)","650.000"],["Satılan Malın Maliyeti (650.000x0,60)","390.000"],["Brüt Satış Kârı (650.000-390.000)","260.000"]]},"tur":"tablo","soru":"İşletmenin 2026 yılı ,1]]},{"formul":"Satılan Malın Maliyeti = Net Satışlar × %70 = 500.000 (1. adımda bulduk) × %70 = 350.000 TL","anlatim":"Satılan malın maliyeti nedir? Verilen oran net satışlara uygulanır, çünkü dikey analizde taban net satıştır.","doldur":[[6,1]]},{"formul":"Brüt Satış Kârı = Net Satışlar − Satılan Malın Maliyeti = 500.000 (1. adımda bulduk) − 350.000 (2. adımda bulduk) = 150.000 TL","anlatim":"Brüt satış kârı nedir? Net satıştan satılan malın maliyeti çıkarılır, kalan kâr geliri gösterir.","doldur":[[7,1]]},{"formul":"Sonuç: Brüt Satış Kârı = 150.000 TL (3. adımda bulduk)","anlatim":"Sonuç: brüt satış kârı 150.000 TL çıktı. Bu tutar gelir tablosunda net satış ile maliyet arasındaki farkı gösterir.","doldur":[]},{"formul":"Yanlış yol: 600.000 × %70 = 420.000 (HATALI) → doğrusu 350.000 (2. adımda bulduk)","anlatim":"En sık hata: oranı brüt satışa uygulamak yanlış, çünkü dikey yüzdenin tabanı net satıştır.","doldur":[]}],"anahtar":[{"ornek":"satışlardır","kok":"satışl"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"satıştan","kok":"satışt"},{"ornek":"satılan","kok":"satıla"},{"ornek":"çıkarılarak","kok":"çıkarı"},{"ornek":"tablosunda","kok":"tablos"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu veya bilançoda tek dönem verilip yapı sorulduğunda. Nasıl ölçülür: her kalem kendi tabanına (net satışlar veya aktif toplamı) bölünüp 100 ile çarpılır. Nasıl kaydedilir: sonuç yüzde olarak ya da tersine çevrilip TL tutar olarak ifade edilir.","desen":"Bu soruda dikkat edilecek nokta, yüzdenin brüt satışlara değil net satışlara göre hesaplanmasıdır; brüt satış üzerinden işlem yapmak tuzaktır. Öğrenci önce net satışı bulmalı, sonra SMM oranını bu tabana uygulamalıdır. Bu soru gelir tablosunda taban seçimi noktasından geliyor (p.arşiv, 1 dönem).","terimler":[{"kaynak":"soruda verilir","tanim":"Brüt satışlardan iade ve iskontolar düşüldükten sonra kalan tutar, gelir tablosunun tabanıdır.","ad":"Net satışlar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"ka lan malın maliyetinin net satışlara oranıdır; brüt kâr bu maliyet düşüldükten sonra kalan tutardır."},"D":{"ad":"İşlem Yönü Tuzağı","metin":"Satış indirimlerini net satıştan düşmek yerine brüt satışa eklersin, tabanı büyütürsün. Doğrusu: satış indirimleri brüt satıştan düşülerek net satışa ulaşılır."},"A":{"ad":"Taban Karışıklığı Tuzağı","metin":"Satılan malın maliyetini brüt satışlar üzerinden bulup net satıştan düşersin, iki farklı tabanı karıştırırsın. Doğrusu: hem oran hem fark işlemi aynı tabana, net satışlara dayanmalıdır."}},"celdiriciYol":{"C":"600.000 - (600.000x0,70) = 600.000 - 420.000 = 180.000 (tabanı brüt satışlar aldın)","E":"500.000x0,70 = 350.000 (oranı brüt satış kârı oranı sandın)","D":"(600.000+100.000) - ((600.000+100.000)x0,70) = 700.000 - 490.000 = 210.000 (satış indirimini net satışa ekledin)","A":"500.000 - (600.000x0,70) = 500.000 - 420.000 = 80.000 (satılan malın maliyetini yanlış tabandan hesapladın)"},"hap":"Gelir tablosunda dikey yüzdenin tabanı her zaman net satışlardır, brüt satışlar değil.","teshis":{"C":{"gercek":"Sınav tuzağı olarak vurgulanan kural: gelir tablosunda taban net satışlardır, brüt satışlar değildir.","ayirt":"Oranı brüt mü yoksa net satışa mı uyguladım?","paragraf":"Teori - Dikey analiz: taban (payda) seçimi","yanilgi":"Gelir tablosunda tabanın brüt satışlar olduğunu, indirimlerin sonradan düşülebileceğini sanıyorsun."},"E":{"gercek":"Soruda verilen %70, satılan malın maliyetinin net satışlara oranıdır; brüt kâr bu maliyet düşüldükten sonra kalan tutardır.","ayirt":"Verilen yüzde hangi kaleme ait, ona mı uyguluyorum?","paragraf":"Teori Notu - dikey yüzde analizi","yanilgi":"Verilen dikey yüzdenin brüt kârın kendisini gösterdiğini, satılan malın maliyetiyle ilgisi olmadığını sanıyorsun."},"A":{"gercek":"Dikey analizde oran ve fark işlemi aynı tabana dayanmalıdır; taban net satışlardır, bu karışık kullanım yanlış sonuç verir.","ayirt":"Oranı uyguladığım tutar ile farkı aldığım tutar aynı taban mı?","paragraf":"Teori Notu - dikey yüzde analizi","yanilgi":"Satılan malın maliyetini brüt satışlar üzerinden hesaplayıp sonucu net satıştan çıkarınca doğru sonucu bulacağını sanıyorsun."},"D":{"gercek":"Satış indirim ve iskontoları brüt satıştan düşülerek net satışa ulaşılır, eklenmez.","ayirt":"İndirim kalemini brüt satıştan çıkardım mı, yoksa yanlışlıkla ekledim mi?","paragraf":"Teori Notu - dikey yüzde analizi","yanilgi":"Satış indirimlerinin net satışı büyüttüğünü, brüt satışa eklenmesi gerektiğini düşünüyorsun."},"B":{"gercek":"Gelir tablosunda dikey yüzdenin tabanı net satışlardır; önce net satış bulunur, sonra oran uygulanır.","ayirt":"Oranı uyguladığım rakam gerçekten net satış mı?","paragraf":"Teori Notu - dikey yüzde analizi","yanilgi":"Bu şıkkı eleyen öğrenci, net satışa ulaşmadan doğrudan brüt satışlarla işlem yapılabileceğini sanıyor olabilir."}},"verilen":[[5,1],[6,1],[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 71"},"kural":"Faaliyet Kârı = (Net Satışlar - Satılan Malın Maliyeti) - Faaliyet Giderleri; Faaliyet Kâr Marjı = Faaliyet Kârı / Net Satışlar; banka faiz geliri diğer faaliyetlerden olağan gelirdir ve faaliyet kârını etkilemez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 71","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Soruda \u0027kâr marjı\u0027 sorulduğunda önce hangi kâr kademesi istendiğine bak, sonra o kademeden sonra gelen kalemleri (faiz, finansman, vergi) hesaba katma.","konu":"kâr marjı analizi","tablo":{"satirlar":[["VERİLENLER","-"],["Net satışlar","428.000 TL"],["Satılan malın maliyeti","276.350 TL"],["Faaliyet giderleri","84.900 TL"],["Banka faiz geliri","12.750 TL"],["HESAP","-"],["Brüt Satış Kârı (428.000-276.350)","151.650"],["Faaliyet Kârı (151.650-84.900)","66.750"],["Faaliyet Kâr Marjı (66.750/428.000)","%15,60"]],"basliklar":["Kalem","Tutar/Oran"]},"siklar":{"C":"18,57","E":"35,43","A":"12,62","D":"24,16","B":"15,60"},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.275 - İmal edilen emtia","metin":"İmal edilen emtia: Madde 275 – İmal edilen emtianın (Tam ve yarı mamul mallar) maliyet bedeli aşağıda yazılı unsurları ihtiva eder: 1. Mamulün vücuda getirilmesinde sarf olunan iptidai ve ham maddelerin bedeli; 2. Mamule isabet eden işçilik; 3. Genel imal giderlerinden mamule düşen hisse; 4. Genel idare giderlerinden mamule düşen hisse; (Bu hissenin mamulün maliyetine katılması ihtiyaridir.) 5. Ambalajlı olarak piyasaya arz edilmesi zaruri olan mamullerde ambalaj malzemesinin bedeli. Mükellefler, imal ettikleri emtianın maliyet bedellerini yukarıki unsurları ihtiva etmek şartiyle diledikleri usulde tayin edebilirler. (Üçüncü fıkra mülga: 30/12/1980-2365/51 md.)"},{"ad":"TEORI - Keynesyen carpan, marjinal tuketim egilimi ve harcama carpani","metin":"TEORİ (makroekonomi; mevzuat maddesi yok). MARJİNAL TÜKETİM EĞİLİMİ (MPC, c): gelirdeki bir birimlik artışın tüketime giden payı (ΔC/ΔY), 0 ile 1 arasında; marjinal tasarruf eğilimi MPS = 1 − c. ORTALAMA tüketim eğilimi C/Y\u0027dir, gelir arttıkça düşer (Keynes\u0027in mutlak gelir hipotezi). HARCAMA ÇARPANI: otonom harcamadaki (yatırım, kamu harcaması, ihracat) bir birimlik artış geliri k = 1/(1−c) kat artırır; c=0,8 → çarpan 5; c=0,75 → 4. Mantık: harcama gelir olur, gelirin c kadarı yeniden harcanır, sonsuz geometrik seri 1 + c + c² + … = 1/(1−c). VERGİ ÇARPANI = −c/(1−c): götürü vergi artışı geliri harcama çarpanından KÜÇÜK (c katı) düşürür, çünkü verginin yalnız c kadarı harcamadan kesilir. DENGELİ BÜTÇE ÇARPANI = 1: harcama ve vergi aynı miktar artınca gelir o miktar kadar artar. ÇARPANI KÜÇÜLTENLER: oransal gelir vergisi t → k = 1/(1 − c(1−t)); marjinal ithalat eğilimi m → k = 1/(1 − c + m); faiz artışı (IS-LM), fiyat artışı (AD-AS). Tasarruf paradoksu: herkes daha çok tasarruf etmek isteyince gelir düşer, toplam tasarruf artmayabilir. SINAV TUZAĞI: (1) Çarpanın paydası 1 − MPC = MPS\u0027dir; \u0027MPC\u0027 ile bölmek tuzak. (2) Vergi çarpanı negatif ve mutlak değerce harcama çarpanından küçüktür. (3) Dışa açık ekonomide ithalat eğilimi çarpanı küçültür, büyütmez."}],"hakem":"Faaliyet kâr marjı hesaplaması (Faaliyet Kârı / Net Satışlar) kaynak metindeki teori ile tam uyumludur; banka faiz geliri faaliyet kârını etkilemediği doğru şekilde uygulanmıştır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar/Oran"],"satirlar":[["Brüt Satış Kârı (512.000-318.400)","193.600"],["Faaliyet Kârı (193.600-96.600)","97.000"],["Brüt Kâr Marjı (193.600/512.000)","%37,81"]]},"tur":"tablo","soru":"Bir mobilya işletmesinin 2026 yılına ait net satışları 512.000 TL, satılan malın maliyeti 318.400 TL ve faaliyet giderleri (pazarlama-satış-dağıtım ile genel yönetim giderleri toplamı) 96.600 TL\u0027dir. Ayrıca işletme aynı dönemde 15.300 TL banka faiz geliri elde etmiştir. Buna göre işletmenin brüt kâr marjı (%) kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve işletmenin brüt kâr marjının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir tekstil işletmesinin 2026 yılına ait net satışları 428.000 TL, satılan malın maliyeti 276.350 TL ve faaliyet giderleri (pazarlama-satış-dağıtım ile genel yönetim giderleri toplamı) 84.900 TL\u0027dir. Ayrıca işletme aynı dönemde 12.750 TL banka faiz geliri elde etmiştir. Buna göre işletmenin faaliyet kâr marjı (%) kaçtır?","kayitBaslik":"","id":"sgs-t1-mta-kolay/kp-27","verilenler":[{"deger":"428.000 TL","anlam":"Faaliyet kâr marjı oranının paydasında kullanılan tutardır.","ad":"Net satışlar"},{"deger":"276.350 TL","anlam":"Net satışlardan düşülerek brüt satış kârı bulunur.","ad":"Satılan malın maliyeti"},{"deger":"84.900 TL","anlam":"Brüt satış kârından düşülerek faaliyet kârı bulunur.","ad":"Faaliyet giderleri"},{"deger":"12.750 TL","anlam":"Diğer faaliyetlerden olağan gelirdir; faaliyet kârı hesabına dahil edilmez, çeldiricidir.","ad":"Banka faiz geliri"}],"dayanak":"TEORİ - Faaliyet kar marji ve faaliyet kari hesabı (mali analiz doktrini)","dogru":"B","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Verilen: Net satışlar 428.000 TL (soruda verilen); Satılan malın maliyeti 276.350 TL (soruda verilen); Faaliyet giderleri 84.900 TL (soruda verilen); Banka faiz geliri 12.750 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: net satışlar, satılan malın maliyeti, faaliyet giderleri ve banka faiz geliri. Bunları kendimiz bulmadık, doğrudan soru metninden alıyoruz.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Brüt Satış Kârı = Net Satışlar − Satılan Malın Maliyeti = 428.000 (soruda verilen) − 276.350 (soruda verilen) = 151.650 TL","anlatim":"Önce brüt satış kârını buluyoruz - satışlardan malın maliyetini çıkarıyoruz. Bu, faaliyet kârına giden ilk basamak.","doldur":[[6,1]]},{"formul":"Faaliyet Kârı = Brüt Satış Kârı − Faaliyet Giderleri = 151.650 (1. adımda bulduk) − 84.900 (soruda verilen) = 66.750 TL","anlatim":"Şimdi brüt kârdan faaliyet giderlerini düşüp faaliyet kârını buluyoruz. Pazarlama ve genel yönetim giderleri işin asıl faaliyetinden doğduğu için burada çıkarılır.","doldur":[[7,1]]},{"formul":"Kapsam: Faaliyet Kârı hesabına dahil değil: Banka faiz geliri 12.750 TL (soruda verilen)","anlatim":"Banka faiz geliri nedir? Bu, esas faaliyet dışında elde edilen bir gelirdir - diğer faaliyetlerden olağan gelir sayılır. Dikkat: bu yüzden faaliyet kârı hesabına hiç girmez.","doldur":[]},{"formul":"Faaliyet Kâr Marjı = Faaliyet Kârı / Net Satışlar = 66.750 (2. adımda bulduk) / 428.000 (soruda verilen) = %15,60","anlatim":"Faaliyet kâr marjı, faaliyet kârının net satışlara oranıdır. İşletmenin satışlarının yüzde kaçının esas faaliyetten kâr olarak kaldığını gösterir.","doldur":[[8,1]]},{"formul":"Yanlış yol: (66.750 + 12.750) / 428.000 = %18,58 (HATALI) → doğrusu 66.750 / 428.000 = %15,60 (5. adımda bulduk)","anlatim":"En sık hata: banka faiz gelirini faaliyet kârına ekleyip marjı olduğundan yüksek bulmak. Faiz geliri esas faaliyetten gelmediği için bu işlem yanlıştır.","doldur":[]}],"anahtar":[{"ornek":"faaliyet","kok":"faaliy"},{"ornek":"satışlardır","kok":"satışl"},{"ornek":"geliri","kok":"geliri"},{"ornek":"giderleri","kok":"giderl"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"çıkarıyoruz","kok":"çıkarı"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu kalemlerinden faaliyet kârı hesaplanırken. Nasıl ölçülür: faaliyet kârının net satışlara bölünmesiyle. Nasıl kaydedilir: sonuç yüzde olarak ifade edilir, ondalık yuvarlanır.","desen":"Sorular sıkça faiz geliri, kambiyo kârı gibi olağan kalemleri faaliyet kârına ekletmeye çalışır; bu bir tuzaktır çünkü bu kalemler faaliyet kârından sonra gelir. Öğrenci genel yönetim giderini unutup sadece satış maliyetini düşerse yanlış marj bulur. Bu soru faaliyet kârı ile olağan kâr ayrımı noktasından geliyor (p.—, TEORİ - Faaliyet kâr marjı).","terimler":[{"kaynak":"soruda verilir","tanim":"Brüt satışlardan iade ve iskontolar düşülünce kalan tutar","ad":"Net satışlar","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Net satışlardan satılan malın maliyeti düşüldükten sonra kalan tutar","ad":"Brüt satış kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Pazarlama-satış-dağıtım ve genel yönetim giderleri toplamı","ad":"Faaliyet giderleri","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Faaliyet kârının net satışlara oranı, yüzde olarak","ad":"Faaliyet kâr marjı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Net satışlar, satılan malın maliyeti ve faaliyet giderleri verilir; faaliyet kâr marjının yüzde kaç olduğu istenir.","panel_ornek":"Bir arkadaşın küçük bir kırtasiye dükkanı açtı: 10.000 TL satış yaptı, mala 6.000 TL verdi, kira ve personele 2.000 TL harcadı. Ayrıca bankadan 300 TL faiz kazandı ama bu esas iş değil, dükkanın kâr marjına katılmaz. Esas faaliyet kârı 2.000 TL, yani satışın %20\u0027si.","ornek":"Bir arkadaşın küçük bir kırtasiye dükkanı açtı: 10.000 TL satış yaptı, mala 6.000 TL verdi, kira ve personele 2.000 TL harcadı. Ayrıca bankadan 300 TL faiz kazandı ama bu esas iş değil, dükkanın kâr marjına katılmaz. Esas faaliyet kârı 2.000 TL, yani satışın %20\u0027si.","yontemler":"Önce brüt satış kârı bulunur, sonra faaliyet giderleri düşülüp faaliyet kârına ulaşılır; faiz geliri gibi kalemler asla bu hesaba katılmaz.","nedir":"Kâr marjı analizi, bir işletmenin esas faaliyetinden ne kadar verimli kâr ürettiğini yüzde olarak gösterir. Sınav, hangi gelir-gider kaleminin faaliyet kârına dahil olup olmadığını ölçer."},"olay":"428.000-276.350=151.650; 151.650-84.900=66.750; 66.750/428.000=%15,60.","tuzak":{"C":{"ad":"Kapsam Tuzağı","metin":"Banka faiz gelirini faaliyet kârına dahil ederek hesapladın; oysa faiz geliri diğer faaliyetlerden olağan gelirdir ve gelir tablosunda faaliyet kârından sonra yer alır. Doğrusu: Faaliyet kârı hesabına faiz geliri girmez."},"E":{"ad":"Kavram Karışıklığı Tuzağı","metin":"Faaliyet giderlerini düşmeden brüt satış kârı marjını faaliyet kâr marjı sandın. Doğrusu: Faaliyet kâr marjı, brüt kârdan faaliyet giderleri düşüldükten sonra bulunur."},"D":{"ad":"Oran Tuzağı","metin":"Faaliyet kâr marjının paydasına net satışlar yerine satılan malın maliyetini aldın. Doğrusu: Üç kâr marjının da (brüt, faaliyet, net) paydası daima net satışlardır."},"A":{"ad":"Hesap Seçimi Tuzağı","metin":"Banka faiz gelirini maliyet unsuru sanıp satılan malın maliyetine ekledin, böylece brüt ve faaliyet kârını olduğundan düşük hesapladın. Doğrusu: Faiz geliri diğer faaliyetlerden olağan gelir kalemidir, satılan malın maliyetine dahil edilmez."}},"celdiriciYol":{"C":"(66.750+12.750)/428.000=79.500/428.000=%18,57 (faiz gelirini faaliyet kârına ekledi)","E":"151.650/428.000=%35,43 (faaliyet giderlerini düşmeden brüt kâr marjını faaliyet kâr marjı sandı)","D":"66.750/276.350=%24,16 (paydaya net satışlar yerine satılan malın maliyetini aldı)","A":"428.000-(276.350+12.750)=138.900; 138.900-84.900=54.000; 54.000/428.000=%12,62 (faiz gelirini satılan malın maliyetine ekledi)"},"hap":"Brüt, faaliyet ve net kâr marjının üçünde de payda net satışlardır; faaliyet kârına finansman ve diğer faaliyet gelir-gideri girmez.","teshis":{"C":{"gercek":"Faiz geliri, kambiyo kârı gibi kalemler diğer faaliyetlerden olağan gelirdir; gelir tablosunda faaliyet kârından SONRA yer alır.","ayirt":"Bu gelir esas iş kolundan mı geldi, yoksa finansal bir işlemden mi?","paragraf":"TEORİ - Faaliyet kar marji ve faaliyet kari hesabı","yanilgi":"Kâr marjını yükseltmek için elde edilen her geliri faaliyet kârına eklemen gerektiğini sanıyorsun."},"E":{"gercek":"Brüt Satış Kârı marjı ile Faaliyet Kârı marjı farklı kademelerdir; ikincisi faaliyet giderleri düşüldükten sonra hesaplanır.","ayirt":"Faaliyet giderlerini (pazarlama, genel yönetim, ar-ge) bu hesaptan düşürdüm mü?","paragraf":"TEORİ - Kar marji analizi","yanilgi":"Brüt kâr ile faaliyet kârını aynı şey sanıp faaliyet giderlerini düşmeyi atlıyorsun."},"A":{"gercek":"Faiz geliri 64x grubu diğer faaliyetlerden olağan gelirdir; satılan malın maliyeti ile hiçbir ilişkisi yoktur.","ayirt":"Bu kalem üretim/satış sürecinden mi, yoksa finansal işlemden mi doğdu?","paragraf":"TEORİ - Faaliyet kâr marjı ve kar marji analizi","yanilgi":"Faiz gelirini gördüğünde onu maliyeti azaltan bir kalem gibi düşünüp satılan malın maliyetine ekliyorsun."},"D":{"gercek":"Brüt, faaliyet ve net kâr marjının üçünün de paydası daima net satışlardır, maliyet veya gider tutarı değildir.","ayirt":"Bu oranın paydasında hep aynı büyüklük mü var, yoksa değişti mi?","paragraf":"TEORİ - Kar marji analizi","yanilgi":"Oranın paydasına hangi tutarın gireceğini karıştırıp elindeki başka bir büyük sayıyı (maliyeti) kullanıyorsun."},"B":{"gercek":"Faaliyet Kârı = Brüt Satış Kârı - Faaliyet Giderleri\u0027dir; diğer faaliyet gelir/giderleri, finansman giderleri sonraki kademelerdedir.","ayirt":"Bu kalem esas faaliyetten mi (üretim-satış-yönetim), yoksa esas faaliyet dışından mı geldi?","paragraf":"TEORİ - Faaliyet kar marji ve faaliyet kari hesabı","yanilgi":"Bu şıkkı eleyen öğrenci, faiz gelirinin bir şekilde faaliyet kârına dahil edilmesi gerektiğini düşünür."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 65"},"kural":"Gelir tablosu tahakkuk esasına dayalı dönem kârını gösterir, nakit yaratma gücünü göstermez; bu nedenle ödeme gücü hakkında tek başına hüküm verilemez ve nakit akış tablosuyla birlikte okunmalıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 65","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Sınırlama sorularında önce şıkkın hangi kaynak maddesine karşılık geldiğini bul, sonra ifadenin kaynaktaki yönle aynı mı yoksa tersine mi çevrildiğini kontrol et.","konu":"gelir tablosu analiz sinirlamalari","tablo":{"satirlar":[["A) Gelir tablosu işletmenin belirli bir dönemde elde ettiği…","p.Sınırlamalar-nakit","doğru ifade"],["B) Amortisman yöntemi ve stok değerleme yönteminin farklı s…","p.Sınırlamalar-politika","YANLIŞ ifade"],["C) Olağandışı gelir ve kâr kalemleri faaliyet kârının dışın…","p.Sınırlamalar-tek dönem","YANLIŞ ifade"],["D) Marka değeri, müşteri sadakati ve yönetim kalitesi gibi …","p.Sınırlamalar-parasal olmayan","YANLIŞ ifade"],["E) Dikey yüzde analizinden elde edilen oranlar yalnızca işl…","p.Sınırlamalar-sektör","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Olağandışı gelir ve kâr kalemleri faaliyet kârının dışında tutulduğundan, tek bir döneme ait gelir tablosu hiçbir şekilde yanıltıcı bir performans görüntüsü oluşturamaz.","E":"Dikey yüzde analizinden elde edilen oranlar yalnızca işletmenin kendi geçmiş dönemleriyle karşılaştırılabilir nitelikte olduğundan, sektör ortalamasıyla kıyaslanması analiz açısından anlamlı bir sonuç vermez.","A":"Gelir tablosu işletmenin belirli bir dönemde elde ettiği kârı gösterir; ancak bu kâr tutarı işletmenin nakit yaratma gücünü göstermediğinden, ödeme gücü hakkında tek başına hüküm verilemez ve nakit akış tablosuyla birlikte değerlendirilmelidir.","D":"Marka değeri, müşteri sadakati ve yönetim kalitesi gibi parasal olmayan unsurlar, önemli birer değer yaratma kaynağı olduklarından gelir tablosunda ayrı bir kalem olarak raporlanır.","B":"Amortisman yöntemi ve stok değerleme yönteminin farklı seçilmesi, işletmelerin aynı faaliyet sonucunu göstermesini sağladığından gelir tablosu karşılaştırmalarında bu farkların ayrıca dikkate alınmasına gerek yoktur."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Gelir tablosu kalem etkilesimi ve faaliyet kari","metin":"TEORİ/TEKNİK (muhasebe, Tekdüzen gelir tablosu yapısı). KADEMELER: BRÜT SATIŞLAR - Satış İndirimleri (iade, iskonto, diğer) = NET SATIŞLAR. Net Satışlar - SATIŞLARIN MALİYETİ = BRÜT SATIŞ KÂRI/ZARARI. Brüt Satış Kârı - FAALİYET GİDERLERİ (Araştırma-Geliştirme + Pazarlama-Satış-Dağıtım + Genel Yönetim) = FAALİYET KÂRI/ZARARI. Faaliyet Kârı + Diğer Faaliyetlerden Olağan Gelir ve Karlar - Diğer Faaliyetlerden Olağan Gider ve Zararlar - FİNANSMAN GİDERLERİ = OLAĞAN KÂR/ZARAR. Olağan Kâr + Olağandışı Gelir ve Karlar - Olağandışı Gider ve Zararlar = DÖNEM KÂRI/ZARARI. Dönem Kârı - Vergi ve Diğer Yasal Yükümlülük Karşılıkları = DÖNEM NET KÂRI/ZARARI. ETKİLEŞİM MANTIĞI (soru tipi): bir kalemin hangi kademeden itibaren etkili olduğu sorulur. Örnek: FİNANSMAN GİDERİ faaliyet kârını ETKİLEMEZ, olağan kârdan itibaren etkiler. Örnek: SATIŞ İSKONTOSU net satışları düşürdüğü için BRÜT KÂRDAN İTİBAREN HER KADEMEYİ etkiler. Örnek: GENEL YÖNETİM GİDERİ brüt kârı etkilemez, FAALİYET KÂRINDAN İTİBAREN etkiler. Örnek: BAĞIŞ VE YARDIM olağandışı gider olarak DÖNEM KÂRINDAN itibaren etkiler. SINAV TUZAĞI: \u0027faaliyet kârı\u0027 hesaplanırken FİNANSMAN GİDERİ DÜŞÜLMEZ ve DİĞER FAALİYET GELİRLERİ EKLENMEZ - ikisi de faaliyet kârından SONRA gelir. En sık yapılan hata finansman giderini faaliyet giderleri arasında saymaktır."},{"ad":"TFRS 18 p.86-95 - Kapsamli gelirin sunuldugu tablo","metin":"p.86: Kapsamli gelirin sunuldugu tabloda su toplamlar sunulur: (a) kar veya zarar, (b) diger kapsamli gelir ve (c) ikisinin toplami olan kapsamli gelir. p.87: Donem kapsamli gelirinin \u0027kontrol gucu olmayan paylar\u0027 ve \u0027ana ortaklik sahipleri\u0027 dagilimi sunulur. p.88: DKG kalemleri IKI bolumden birinde siniflandirilir: (a) belirli kosullar saglandiginda kar veya zararda YENIDEN SINIFLANDIRILACAK olanlar ve (b) yeniden siniflandirilMAYACAK olanlar. p.90-91: Yeniden siniflandirma duzeltmeleri tabloda sunulur veya dipnotta aciklanir; duzeltme, onceki donemlerde DKG\u0027ye yansitilmis tutarlarin kar/zarara aktarildigi donemde DKG\u0027den indirilmesidir (cifte sayim onlenir). p.93-95: Her DKG kalemine iliskin vergi, ya vergi etkileri dusulmus net tutarla ya da vergi oncesi tutar + tek kalemde toplam vergi olarak sunulur; ikinci secenekte vergi iki DKG bolumu arasinda dagitilir."}],"hakem":"Doğru sık, gelir tablosu analizinin temel sınırlamasını (tahakkuk esası vs. nakit yaratma gücü) kaynak metinde açıkça desteklenen kurala dayandırıyor."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"Aşağıdaki ifadelerden hangisi gelir tablosu analizinin sınırlamalarından birini doğru şekilde ifade etmektedir?","kayitBaslik":"","id":"sgs-t1-mta-kolay/kp-32","verilenler":[],"dayanak":"TEORI - Gelir tablosu analizinin sınırlamaları (mali analiz teorisi, mevzuat maddesi yok)","dogru":"A","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Olay: Yıldız Tekstil A.Ş. 2023 yılında 4.000.000 TL kâr açıkladı, kasasında ise sadece 150.000 TL nakit vardı çünkü satışların büyük kısmı vadeli, tahsilat 2024\u0027e kalmıştı.","anlatim":"Bu şirket kâğıt üstünde çok kârlı görünüyor ama bankaya gidip borç ödeyecek parası yok. Muhasebeci \u0027kârımız yüksek, ödeme sıkıntısı olmaz\u0027 derse yanılır.","doldur":[]},{"formul":"Ne yapacağız: Bu olayda gelir tablosunun 4.000.000 TL kârı, şirketin nakit yaratma gücünü göstermiyor; kural şu: tahakkuk esasıyla hazırlanan tablo kârı gösterir, nakdi göstermez. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.Sınırlamalar-nakit","karar":"doğru","anlatim":"Şirketin kasasında sadece 150.000 TL var, kâr ise 4.000.000 TL; bu ikisi apayrı şeyler. Gelir tablosu tek başına ödeme gücü hakkında hüküm vermeye yetmez, nakit akış tablosuyla birlikte okunmalı.","formul":"Şık A: birisi \u0027Yıldız Tekstil\u0027in kârı yüksek diye ödeme gücü de yüksektir\u0027 derse, sen \u0027hayır, nakit akış tablosuna bakmadan bunu söyleyemezsin\u0027 der misin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.Sınırlamalar-politika","karar":"yanlış","anlatim":"Aynı makineyi farklı yöntemle amortize eden iki firma farklı kâr açıklar, bu yüzden yöntem farkı gizlenemez. Politika değişikliği tutarlılık ilkesi gereği mutlaka açıklanmalıdır.","formul":"Şık B: Yıldız Tekstil azalan bakiyeli amortisman, rakip firma normal amortisman kullanıyor; muhasebeci \u0027bu fark önemsiz, ikisi de aynı sonucu gösterir\u0027 derse katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.Sınırlamalar-tek dönem","karar":"yanlış","anlatim":"Arsa satışı bir kereliktir ama tek dönem tablosuna bakan biri bunu sürekli kazanç sanabilir. Tek dönemin gelir tablosu olağandışı kalemlerle yine de yanıltıcı bir performans görüntüsü verebilir.","formul":"Şık C: Yıldız Tekstil o yıl bir arsa satışından 1.000.000 TL olağandışı kâr yazdı; muhasebeci \u0027olağandışı kalem ayrı gösterildi, tablo hiç yanıltıcı olamaz\u0027 derse doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.Sınırlamalar-parasal olmayan","karar":"yanlış","anlatim":"Marka değeri parayla ölçülüp kaydedilen bir işlem değil, tabloya giremez. Gelir tablosu sadece parasal işlemleri kaydeder, parasal olmayan unsurları dışlar.","formul":"Şık D: Yıldız Tekstil\u0027in marka bilinirliği çok yüksek; muhasebeci \u0027bu değeri gelir tablosunda ayrı bir kalem olarak gösterelim\u0027 derse yapar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.Sınırlamalar-sektör","karar":"yanlış","anlatim":"Dikey yüzdeler tam olarak farklı büyüklükteki firmaları karşılaştırmak için var, sektör ortalamasıyla kıyaslanınca anlam kazanır. Bu yüzden sektörle kıyaslamayı reddetmek yanlış olur.","formul":"Şık E: Yıldız Tekstil\u0027in dikey analizde SMM oranı %60 çıktı; muhasebeci \u0027bu oranı sadece kendi geçmiş yıllarımızla karşılaştırabiliriz, sektörle kıyaslamak anlamsız\u0027 derse doğru mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Yıldız Tekstil\u0027in yüksek kârı kasasındaki parayla örtüşmedi, gelir tablosunun asıl sınırlaması budur. Kendine hep şunu sor: bu kâr rakamı bugün cebe giren para mı, yoksa henüz tahsil edilmemiş bir hak mı?","doldur":[]}],"anahtar":[{"ornek":"tablosu","kok":"tablos"},{"ornek":"gösterir","kok":"göster"},{"ornek":"farklı","kok":"farklı"},{"ornek":"yöntemle","kok":"yöntem"},{"ornek":"kasasında","kok":"kasası"},{"ornek":"kaydedilen","kok":"kayded"}],"konuGiris":{"harita":"Hangi durumlarda gelir tablosunun tek başına yeterli olmadığı sorulur: Ne zaman devreye girer: kâr rakamı yüksek görünse de nakit veya karşılaştırma sorunları varsa. Nasıl ölçülür: doğru/yanlış cümle biçiminde, hangi sınırlamanın doğru tanımlandığı seçtirilerek. Nasıl kaydedilir: sınırlamalar tek tek maddeler halinde ezbere değil, mantığıyla ayırt edilerek işaretlenir.","desen":"Soru genellikle beş şıkta sınırlamalardan sadece birinin doğru tanımlanmasını, diğerlerinin ise çarpıtılmış ifadeler olmasını ister. Tuzak, \u0027gelir tablosu nakit durumunu da gösterir\u0027 gibi ters bir cümleyi doğruymuş gibi sunmaktır. Bu soru gelir tablosu analizinin sınırlamaları konusundan geliyor (TEORİ, çıkmış arşivde 1 dönem).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Tablonun geçmiş işlem tutarlarını gösterip cari değeri yansıtmaması ilkesi.","ad":"Tarihi maliyet esası","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Amortisman veya stok değerleme yönteminin işletmeden işletmeye değişebilmesi durumu.","ad":"Muhasebe politikası farkı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Amortisman, karşılık gibi kalemlerin gerçek değil tahmini rakam olması.","ad":"Dönemsellik tahmini","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Yüksek kârın nakit girişiyle aynı anlama gelmemesi durumu.","ad":"Nakit-kâr farkı","kim":"piyasa fiyatlar"}],"sinavda":"Şıklarda gelir tablosu analiziyle ilgili çeşitli ifadeler verilir ve bunlardan hangisinin sınırlamayı doğru anlattığı istenir.","panel_ornek":"Arkadaşının bu ay 3 bin lira kazandığını söylemesi, onun cebinde o an nakit olduğu anlamına gelmez; parası alacaklarda kalmış olabilir. Ayrıca geçen yılki 3 bin lirayla bu yılki 3 bin lira aynı satın alma gücünde değildir. Sadece o ayın kazancına bakıp genel durumu yargılamak yanıltıcı olur.","ornek":"Arkadaşının bu ay 3 bin lira kazandığını söylemesi, onun cebinde o an nakit olduğu anlamına gelmez; parası alacaklarda kalmış olabilir. Ayrıca geçen yılki 3 bin lirayla bu yılki 3 bin lira aynı satın alma gücünde değildir. Sadece o ayın kazancına bakıp genel durumu yargılamak yanıltıcı olur.","yontemler":"Her şıkkı \u0027bu gerçekten bir sınırlama mı yoksa gelir tablosunun avantajı mı\u0027 diye sorgulayarak eleyin; en kritik kural nakit ile kârın ayrı şeyler olduğunu unutmamaktır.","nedir":"Gelir tablosu analizi, işletmenin bir dönemde kâr yaratma performansını sayısal olarak yorumlamaya yarar. Sınav bu analizin gerçekten neyi gösterip neyi gösteremeyeceğini, yani sınırlarını bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Ters Yönlü Yorum Tuzağı","metin":"Olağandışı kalemlerin faaliyet kârı dışında tutulduğu için hiçbir çarpıtma yaratmayacağını sanıyorsun. Doğrusu: Tek yılın gelir tablosu, mevsimsellik ve olağandışı bir gelir kalemiyle şişebilir; dönem kârı bu yüzden yanıltıcı olabilir."},"E":{"ad":"Karşılaştırma Ölçütü Tuzağı","metin":"Dikey yüzdelerin yalnızca işletmenin kendi geçmişiyle anlamlı olduğunu, sektörle kıyaslanamayacağını sanıyorsun. Doğrusu: Dikey yüzdeler ölçekten arındırıldığı için tam olarak sektör ortalamasıyla karşılaştırıldığında anlam kazanır."},"D":{"ad":"Kapsam Genişletme Tuzağı","metin":"Marka değeri ve yönetim kalitesinin gelir tablosunda ayrı kalem olarak raporlandığını sanıyorsun. Doğrusu: Parasal olmayan unsurlar gelir tablosunda yer almaz; bu, tabloların yapısal bir sınırlamasıdır."},"B":{"ad":"Muhasebe Politikası Tuzağı","metin":"Amortisman yöntemi ve stok değerleme yönteminin kâr üzerinde etkisi olmadığını düşünüyorsun. Doğrusu: Farklı politikalar aynı faaliyeti farklı kâr rakamlarıyla gösterebilir, bu yüzden karşılaştırmada politika farkının açıklanması ve tutarlılığın aranması şarttır."}},"celdiriciYol":{"C":"Olağandışı kalemin ayrı satırda gösterilmesini, çarpıtmanın imkansız olduğu sonucuna çevirme (ters yönlü yorum tuzağı)","E":"Dikey analizin ölçekten arındırma amacını, sektörle kıyaslanamaz sonucuna çevirme (karşılaştırma ölçütü tuzağı)","D":"Parasal olmayan unsurun önemini, tabloda raporlandığı sonucuna çevirme (kapsam genişletme tuzağı)","B":"Politika farkının kâr üzerinde etkisiz olduğunu varsayma (muhasebe politikası tuzağı)"},"hap":"Gelir tablosu dönem kârını gösterir, nakdi göstermez; ödeme gücü değerlendirmesi nakit akış tablosuyla tamamlanır.","teshis":{"C":{"gercek":"Tek dönemin gelir tablosu, olağandışı bir gelir veya mevsimsel etkiyle dönem kârını gerçek performanstan farklı gösterebilir; bu \u0027tek döne // 06.09 seviye: ölçümden türer (bkz. kart kurulumu). k = sınıf anahtarı, ad = ekran adı (Nöbet dili: Isınma / Nöbet / Alarm), neden = ipucu.
function seviyeHesapla(s){
  const o=s.olcum||{}; const tip=s.tip||'teori'; const ders=String(s.ders||'');
  if(o.sim&&o.sim.dogru===false) return {k:'alarm',ad:'🔴 Alarm',neden:'Nöbetçi öğrencisi bu anlatımla ikizi çözemedi; dikkat ister'};
  if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

// 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}
function skorCiz(){ const sk=skorHesapla(); const vade=KUTU.kutu.filter(x=>x.due<=simdi()).length; const azVeri=KUTU.kayit.length<5; document.querySelectorAll('.skorCip').forEach(el=>{ el.textContent=azVeri?'🎯 —':('🎯 %'+sk.toplam); el.title=azVeri?'Hazırlık skoru 5 sorudan sonra görünür':'Hazırlık skoru'; }); /* 05.09: ilk yanlıştan sonra "%4" görmek caydırıcı; 5 cevaptan önce yüzde yok */ document.querySelectorAll('.kutuCip').forEach(el=>{ el.textContent='📥 '+KUTU.kutu.length+(vade?' ·'+vade+' hazır':''); el.classList.toggle('hazir',vade>0); }); }

  e.classList.add('acik');

      // 07.09 Cem "birebir aynısını vermeye gerek yok": çıkmış soru metni ekranda YOK (çapa üreticide kalır). Yerine ölçülü SINAV KÜNYESİ (son N dönemde kaç kez,
      // hangi dönemler, biçim) + ANAHTAR KAVRAMLAR (FAZ S, ambar tanımı, kaynaklı). Uydurma "somut örnek" yalnız kavram yoksa.
      if(a.giris&&s.konuGiris){
        const kn=s.cikmis||{}; const dl=(kn.donemler||[]).map(String); const sd=(s.olcum&&s.olcum.sonDonem!=null)?s.olcum.sonDonem:null; const pen=s.olcum&&s.olcum.pencere;   // sıra PS'den gelir (yeniden eskiye; KGK'da tarih etiketi) const sd=(s.olcum&&s.olcum.sonDonem!=null)?s.olcum.sonDonem:null; const pen=s.olcum&&s.olcum.pencere;
        const tipAd=({hesap:'hesaplama',kayit:'kayıt',teori:'teori'})[s.tip]||'';
        // dönem listesi yalnız sayıyla tutarlıysa yazılır (pencere sayısı kök eşleşmesiyle, liste birebir etiketle ölçülüyor; "7 kez · 2025/3" yanıltır)
        // 07.09 Ö55(1): liste pencereyle ayrılır — "Son 7 dönemde 4 kez · son: 2026/2 · daha eski: 2020/1, 2019/3…"; pencere içi liste sayıdan
        // kısa olabilir (sayı kök eşleşmesi, liste birebir etiket), o yüzden yalnız EN YENİ pencere içi dönem yazılır, çelişki kalmaz
        const penD=new Set((kn.pencereDonemler||[]).map(String)); const ici=dl.filter(x=>penD.has(x)); const disi=dl.filter(x=>!penD.has(x));
        // 07.09 Cem: "4 kere sormuş diyor ama sayınca 6" — iki sayı iki ölçümdür: liste = etiketi birebir tutan bütün dönemler, pencere sayısı = son N dönemde yakın başlıklar. İkisi açıkça ayrı yazılır
        const listeH=dl.length?('<b>'+dl.length+'</b> dönemde soruldu ('+esc(dl.join(', '))+')'):'';   // 07.09 Cem: "7 dönem diyor ama 6 gösterip nokta nokta" — liste kesilmez, sayı kadar dönem yazılır
        const penH=(sd!=null&&pen)?('son '+pen+' dönemde yakın başlıklarla <b>'+sd+'</b> kez'):'';
