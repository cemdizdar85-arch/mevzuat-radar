ndaki özel maliyet bedelini, kira süresine göre eşit yüzdelerle itfa etmektedir. Kira süresi 5 yıl olup işletme bu tutarın 2 yıllık kısmını itfa etmiştir. Üçüncü yılda işyeri boşaltılmış ve kira sözleşmesi bu tarihte sona ermiştir. Buna göre, boşaltma yılında gider yazılacak özel maliyet bedeli tutarı kaç TL\u0027dir?","kayitBaslik":"1) İşyerinin boşaltılması","id":"sgs-t1-maliyet-kolay/kp-18","verilenler":[{"deger":"300.000 TL","anlam":"İtfaya konu olan toplam özel maliyet tutarı, kira süresine göre eşit yüzdelerle itfa edilecek anapara.","ad":"Özel maliyet bedeli"},{"deger":"5 yıl","anlam":"Özel maliyet bedelinin bölüneceği toplam süre, yıllık itfa payını belirler.","ad":"Kira süresi"},{"deger":"2 yıl","anlam":"Boşaltmadan önce ayrılmış olan itfa yıl sayısı, şimdiye kadar gider yazılmış kısmı gösterir.","ad":"İtfa edilen süre"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.327/2","dogru":"C","oyunBonus":{"soru":"İşletme, kiraladığı bir işyerinde yaptığı 600.000 TL tutarındaki özel maliyet bedelini, kira süresine göre eşit yüzdelerle itfa etmektedir. Kira süresi 5 yıl olup işletme bu tutarın 2 yıllık kısmını itfa etmiştir. Üçüncü yılda işyeri boşaltılmış ve kira sözleşmesi bu tarihte sona ermiştir. Buna göre, boşaltma yılında gider yazılacak özel maliyet bedeli tutarı kaç TL\u0027dir?","tur":"olcek","kayit":[{"tutar":"360.000","taraf":"B","hesap":"770 GENEL YÖNETİM GİDERLERİ"},{"tutar":"240.000","taraf":"B","hesap":"268 BİRİKMİŞ AMORTİSMANLAR"},{"tutar":"600.000","taraf":"A","hesap":"264 ÖZEL MALİYETLER"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen tutar = 180.000 / 120.000 / 300.000 (soruda verilen)","anlatim":"Soru bize şunları vermiş: 180.000 TL, 120.000 TL, 300.000 TL. Bunları biz bulmadık, soru verdi. Önce hangi işlem olduğunu anlayalım: ozel maliyet itfasi.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kural: özel maliyet itfasi","anlatim":"213 sayılı Vergi Usul Kanununun 327 nci maddesine göre kira süresi sona ermeden kiralanan yerin boşaltılması halinde henüz itfa edilmemiş özel maliyet bedeli boşaltma yılında gider yazılır.","doldur":[]},{"formul":"770 GENEL YÖNETİM GİDERLERİ (BORÇ) 180.000 (soruda verilen)","anlatim":"Önce borç tarafı. 770 GENEL YÖNETİM GİDERLERİ hesabı artıyor, o yüzden borç yazıyoruz. Dikkat: tarafı yanlış seçersen kayıt denk görünse de yanlıştır.","doldur":[[7,1]]},{"formul":"268 BİRİKMİŞ AMORTİSMANLAR (BORÇ) 120.000 (soruda verilen)","anlatim":"Önce borç tarafı. 268 BİRİKMİŞ AMORTİSMANLAR hesabı artıyor, o yüzden borç yazıyoruz. Dikkat: tarafı yanlış seçersen kayıt denk görünse de yanlıştır.","doldur":[[6,1]]},{"formul":"264 ÖZEL MALİYETLER (ALACAK) 300.000 (soruda verilen)","anlatim":"Şimdi alacak tarafı. 264 ÖZEL MALİYETLER hesabına alacak yazıyoruz; borcun karşılığı budur.","doldur":[]},{"formul":"Borç toplamı 300.000 = Alacak toplamı 300.000 → denk","anlatim":"Son kontrol: borç toplamı alacak toplamına eşit, kayıt denk. Şimdi aynı kaydı sen sürükleyerek yap.","doldur":[]}],"anahtar":[{"ornek":"boşaltılırsa","kok":"boşalt"},{"ornek":"maliyet","kok":"maliye"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"kiralanan","kok":"kirala"},{"ornek":"yazıyoruz","kok":"yazıyo"},{"ornek":"alacak","kok":"alacak"}],"konuGiris":{"harita":"Ne zaman test edilir: Kira süresi dolmadan taşınmaz boşaltıldığında ya da sözleşme sona erdiğinde test edilir. Nasıl ölçülür: Toplam özel maliyet bedelinden o ana kadar ayrılan itfa payları düşülerek kalan tutar bulunur. Nasıl kaydedilir: Kalan tutarın tamamı, boşaltma veya sona erme yılında tek seferde gider yazılır.","desen":"Soru genelde toplam tutarı, kira süresini ve kaç yıl itfa edildiğini verip erken bitişte kalan tutarın gider yazılmasını sorar; tuzak, kalan tutarı kalan yıllara yeniden bölme hatasıdır. Çıkmış arşivde bu konu 1 dönemde soruldu. Bu soru Vergi Usul Kanunu m.327\u0027deki \u0027henüz itfa edilmemiş giderlerin bir defada gider yazılması\u0027 hükmünden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Kiralanan gayrimenkulde yapılan, iktisadi kıymeti artıran harcama tutarı","ad":"Özel maliyet bedeli","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Özel maliyetin eşit yüzdelerle itfa edileceği toplam süreyi belirleyen sözleşme dönemi","ad":"Kira süresi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Geçmiş yıllarda kira süresine göre eşit yüzdeyle daha önce gider yazılmış tutar","ad":"Ayrılmış itfa payı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Toplam özel maliyet bedelinden bugüne kadarki itfa paylarının düşülmesiyle kalan kısım","ad":"Kalan (itfa edilmemiş) tutar","kim":"kanun sabitler"}],"sinavda":"Toplam özel maliyet bedeli, kira süresi ve kaç yıl itfa edildiği verilir; boşaltma yılında gider yazılacak tutar istenir.","panel_ornek":"Bir genç, 40.000 TL\u0027ye taktığı ikinci el arabaya 10.000 TL\u0027lik ses sistemi taktırıyor ve bu masrafı 5 yıl kullanacağını düşünüp her yıl eşit pay gider yazıyor. Ama 2. yılın sonunda arabayı satıyor; henüz gider yazmadığı kalan payı, sattığı yılda tek seferde gider yazar.","ornek":"Bir genç, 40.000 TL\u0027ye taktığı ikinci el arabaya 10.000 TL\u0027lik ses sistemi taktırıyor ve bu masrafı 5 yıl kullanacağını düşünüp her yıl eşit pay gider yazıyor. Ama 2. yılın sonunda arabayı satıyor; henüz gider yazmadığı kalan payı, sattığı yılda tek seferde gider yazar.","yontemler":"Yıllık itfa payı, toplam tutarın kira süresine bölünmesiyle bulunur; kalan tutar hesaplanıp kalan yıllara bölünmeden tek seferde gider yazılır.","nedir":"Özel maliyet itfası, kiralanan yerde yapılan iktisadi kıymeti artırıcı harcamaların kira süresine yayılarak gider yazılmasıdır. Sınav, sözleşme erken bitince kalan tutarın ne zaman ve nasıl gider yazılacağını ölçer."},"olay":"Yıllık itfa payı 300.000/5=60.000 TL; 2 yılda ayrılan 60.000x2=120.000 TL; kalan 300.000-120.000=180.000 TL.","tuzak":{"D":{"ad":"Tek Yıl Düşme Tuzağı","metin":"Şimdiye kadar itfa edilen 2 yılın tamamı yerine yalnızca bir yıllık payı düşerek kalan tutarı yanlış büyük hesapladın. Doğrusu: Kalan tutar, ayrılmış olan tüm itfa yıllarının toplamı düşülerek bulunur."},"E":{"ad":"Tüm Bedeli Gider Yazma Tuzağı","metin":"Şimdiye kadar ayrılan itfa payını hiç dikkate almadan özel maliyet bedelinin tamamını gider yazdın. Doğrusu: Daha önce itfa edilmiş kısım düşüldükten sonra kalan tutar gider yazılır."},"A":{"ad":"Normal İtfaya Devam Tuzağı","metin":"Sadece boşaltma yılına ait olağan itfa payını gider yazdın, sözleşmenin süresinden önce sona ermesinin sonucunu hesaba katmadın. Doğrusu: Kalan itfa edilmemiş tutarın tamamı boşaltma yılında gider yazılır."},"B":{"ad":"Ayrılan İtfa Tutarı Tuzağı","metin":"Şimdiye kadar ayrılmış olan itfa payını (2 yıllık kısmı) gider sanarak ters yönde işlem yaptın. Doğrusu: Boşaltma yılında yazılacak olan, ayrılmış kısım değil kalan (itfa edilmemiş) kısımdır."}},"celdiriciYol":{"D":"300.000 - 60.000 = 240.000 (yalnızca bir yıllık payı düştün, iki yılı düşmedin)","E":"300.000 = itfa edilen kısmı hiç düşmeden tüm bedeli gider yazdın","A":"300.000 / 5 = 60.000 (sadece cari yılın olağan itfa payını yazdın, erken sona erme sonucunu uygulamadın)","B":"60.000 x 2 = 120.000 (şimdiye kadar ayrılan itfa toplamını gider sandın)"},"hap":"Kira veya işletme hakkı süresi sona ermeden kiralanan yer boşaltılırsa, özel maliyet bedelinin henüz itfa edilmemiş kalan tutarı boşaltma yılında gider yazılır.","teshis":{"C":{"gercek":"213 sayılı Vergi Usul Kanunu madde 327 açıkça henüz itfa edilmemiş tutarın tamamının boşaltma yılında gider yazılacağını belirtir.","ayirt":"İtfa edilmemiş tutarın tamamı mı, yoksa bir kısmı mı gider yazılıyor?","paragraf":"m.327/2","yanilgi":"Bu şıkkı eleyen öğrenci, kuralın kalan tutarın TAMAMINI değil bir kısmını gider yazdıracağını sanıyor."},"E":{"gercek":"Daha önce itfa edilmiş kısım zaten önceki dönemlerde gider yazılmıştır; boşaltma yılında yalnız kalan (itfa edilmemiş) kısım gider yazılır.","ayirt":"Bu tutarın bir kısmı önceki yıllarda gider yazılmış mıydı?","paragraf":"m.327/2","yanilgi":"Boşaltma yılında özel maliyet bedelinin baştan itibaren tamamının gider yazılacağını sanıyorsun."},"A":{"gercek":"213 sayılı Vergi Usul Kanunu madde 327 uyarınca, kira süresi sona ermeden boşaltma halinde henüz itfa edilmemiş TÜM tutar o yıl gider yazılır, sadece cari yılın payı değil.","ayirt":"Kira süresi tamamlandı mı, yoksa erken mi sona erdi?","paragraf":"m.327/2","yanilgi":"Boşaltma yılında da diğer yıllar gibi sadece o yılın normal itfa payının gider yazılacağını sanıyorsun."},"D":{"gercek":"Kalan tutar hesaplanırken, o güne kadar ayrılmış OLAN TÜM itfa yıllarının toplamı özel maliyet bedelinden düşülür.","ayirt":"Kaç yıl itfa edilmiş, hepsini mi düştüm yoksa sadece bir yılı mı?","paragraf":"m.327/1","yanilgi":"İtfa edilen 2 yılın tamamı yerine yalnızca 1 yıllık payı düşmenin doğru olduğunu sanıyorsun."},"B":{"gercek":"İtfa edilmiş kısım zaten önceki yıllarda gider yazılmıştır; boşaltma yılında yazılacak olan HENÜZ itfa edilmemiş kalan kısımdır.","ayirt":"Bu tutar daha önce mi gider yazıldı, yoksa hâlâ bilançoda mı duruyor?","paragraf":"m.327/2","yanilgi":"Kural gereği gider yazılacak tutarın, geçmişte itfa edilmiş kısım olduğunu sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{"770":{"ad":"Genel Yönetim Giderleri","tanim":"Bir işletmenin yönetim fonksiyonları, işletme politikasının tayini, organizasyon ve kadro kuruluşu, büro hizmetleri, kamu ilişkileri, güvenlik, hukuk işleri, personel işleri, kredi ve tahsilatı da kapsayan muhasebe ve mali işler servislerinin giderleri bu hesaba borç kaydedilir."},"264":{"ad":"ÖZEL MALİYETLER","tanim":"Kiralanan gayri menkullerin geliştirilmesi veya ekonomik değerinin sürekli olarak artırılması amacıyla yapılan giderler ile (normal bakım, onarım ve temizleme giderleri hariç) bu gayrimenkulun kullanılması için yapılıp kira süresinin sonunda mal sahibine bırakılacak olan, varlıkların bedellerini kapsar."},"268":{"ad":"BİRİKMİŞ AMORTİSMANLAR (-)","tanim":"Maddi olmayan duran varlık bedellerinin, kullanılabilecekleri süre içerisinde yokedilebilmesini sağlamak amacıyla kullanılan hesaptır."}}},{"capa":{"kaynak":"SGS 2026/1 Soru 63"},"kural":"Normal maliyet yönteminde değişken genel üretim giderinin tamamı, sabit genel üretim giderinin ise yalnız kapasite kullanım oranına isabet eden kısmı mamul maliyetine yüklenir; boş kapasiteye düşen sabit gider dönem gideri sayılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 63","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Normal maliyet sorularında ilk iş kapasite kullanım oranını bulup bunu YALNIZ sabit genel üretim gideri\u0027e uygulamaktır; değişken genel üretim gideri\u0027e dokunulmaz.","konu":"normal maliyet yöntemi gug hesaplama","tablo":{"satirlar":[["VERİLENLER","-"],["Normal kapasite","10.000 adet"],["Gerçekleşen üretim","8.000 adet"],["Değişken genel üretim gideri","400.000 TL"],["Sabit genel üretim gideri","200.000 TL"],["HESAP","-"],["Kapasite kullanım oranı (8.000/10.000)","%80"],["Yüklenen sabit genel üretim gideri (200.000 x 0,80)","160.000"],["Yüklenen genel üretim gideri toplamı (400.000 + 160.000)","560.000"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"480.000","E":"600.000","A":"160.000","D":"560.000","B":"320.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Kapasite kullanım oranı (9.000/12.000)","%75"],["Yüklenen sabit genel üretim gideri (240.000 x 0,75)","180.000"],["Yüklenen genel üretim gideri toplamı (450.000 + 180.000)","630.000"]]},"tur":"tablo","soru":"Bir üretim işletmesinde 2026 yılı şubat ayına ait aylık normal kapasite 12.000 adet mamul olup, bu dönemde 9.000 adet mamul üretilmiştir. Döneme ait değişken genel üretim gideri 450.000 TL, normal kapasiteye göre hesaplanan sabit genel üretim gideri ise 240.000 TL\u0027dir. İşletme normal maliyet yöntemi uyguladığına göre, döneme ait mamul maliyetine yüklenecek genel üretim gideri toplamı kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve döneme ait mamul maliyetine yüklenecek genel üretim gideri toplamının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir üretim işletmesinde 2026 yılı ocak ayına ait aylık normal kapasite 10.000 adet mamul olup, bu dönemde 8.000 adet mamul üretilmiştir. Döneme ait değişken genel üretim gideri 400.000 TL, normal kapasiteye göre hesaplanan sabit genel üretim gideri ise 200.000 TL\u0027dir. İşletme normal maliyet yöntemi uyguladığına göre, döneme ait mamul maliyetine yüklenecek genel üretim gideri toplamı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-21","verilenler":[{"deger":"10.000 adet","anlam":"Kapasite kullanım oranının paydasını oluşturur; sabit genel üretim gideri\u0027ün ne kadarının yükleneceğini belirlemekte kullanılır.","ad":"Normal kapasite"},{"deger":"8.000 adet","anlam":"Kapasite kullanım oranının payını oluşturur, gerçek üretim miktarıdır.","ad":"Gerçekleşen üretim"},{"deger":"400.000 TL","anlam":"Normal maliyet yönteminde hiçbir orana tabi tutulmadan tamamı mamul maliyetine yüklenir.","ad":"Değişken genel üretim gideri"},{"deger":"200.000 TL","anlam":"Normal kapasiteye göre hesaplanan sabit gider; yalnız kapasite kullanım oranına isabet eden kısmı yüklenir.","ad":"Sabit genel üretim gideri"}],"dayanak":"Maliyet Muhasebesi teorisi - Normal Maliyet Yöntemi (Tetikte Teori Notu); 213 sayılı Vergi Usul Kanunu m.275","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Normal kapasite 10.000 adet (soruda verilen); Fiili üretim 8.000 adet (soruda verilen); Değişken genel üretim gideri 400.000 TL (soruda verilen); Sabit genel üretim gideri 200.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: normal kapasite 10.000 adet, fiili üretim 8.000 adet. Değişken genel üretim gideri 400.000 TL, sabit genel üretim gideri 200.000 TL (soruda verilen).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Kapasite kullanım oranı = Fiili üretim / Normal kapasite = 8.000 (soruda verilen) / 10.000 (soruda verilen) = %80","anlatim":"Kapasite kullanım oranı, fiilen ne kadar üretim yaptığını normal kapasiteye oranlar. Bu oran sabit giderin ne kadarının mamule yükleneceğini belirler.","doldur":[[6,1]]},{"formul":"Yüklenen sabit genel üretim gideri = Sabit genel üretim gideri × Kapasite kullanım oranı = 200.000 (soruda verilen) × %80 (2. adımda bulduk) = 160.000 TL","anlatim":"Normal maliyet yönteminde sabit genel üretim giderinin sadece kapasite kullanım oranına düşen kısmı mamule yüklenir. Kalan kısım boş kapasite gideri sayılır ve dönem gideri olur.","doldur":[[7,1]]},{"formul":"Yüklenen genel üretim gideri toplamı = Değişken genel üretim gideri + Yüklenen sabit genel üretim gideri = 400.000 (soruda verilen) + 160.000 (3. adımda bulduk) = 560.000 TL","anlatim":"Değişken genel üretim gideri kapasiteden etkilenmez, tamamı mamule yüklenir. Bunu yüklenen sabit tutarla topluyoruz ki toplam yükleme çıksın.","doldur":[[8,1]]},{"formul":"Ters durum: Fiili üretim \u003e Normal kapasite → Kapasite kullanım oranı %100 kabul edilir, sabit genel üretim gideri\u0027nin tamamı yüklenir","anlatim":"Ters durumda: fiili üretim normal kapasiteyi aşsaydı oran %100\u0027ü geçemez, sabit giderin tamamı yüklenir ve fazla üretim ekstra kâr getirmez.","doldur":[]},{"formul":"Yanlış yol: 400.000 + 200.000 = 600.000 (HATALI) → doğrusu 400.000 + 160.000 = 560.000 TL (4. adımda bulduk)","anlatim":"En sık hata: öğrenci sabit genel üretim giderinin tamamını (200.000) doğrudan değişkenle toplar, boş kapasite payını düşmeyi unutur. Oysa boş kapasiteye düşen 40.000 TL dönem gideridir, mamul maliyetine girmez.","doldur":[]}],"anahtar":[{"ornek":"giderinin","kok":"gideri"},{"ornek":"üretim","kok":"üretim"},{"ornek":"kapasite","kok":"kapasi"},{"ornek":"yüklenir","kok":"yüklen"},{"ornek":"normal","kok":"normal"},{"ornek":"maliyet","kok":"maliye"}],"konuGiris":{"harita":"Ne zaman test edilir: Fiili üretim, normal kapasitenin altında kaldığında sabit giderin paylaştırılması gerektiğinde. Nasıl ölçülür: Kapasite kullanım oranı (fiili üretim / normal kapasite) sabit genel üretim gideri\u0027e uygulanarak bulunur. Nasıl kaydedilir: Değişken genel üretim gideri\u0027ün tamamı + sabit genel üretim gideri\u0027ün orana isabet eden kısmı mamul maliyetine, kalan kısmı ise dönem gideri (680) olarak kaydedilir.","desen":"Soru genellikle normal kapasite ile fiili üretimi farklı vererek kapasite kullanım oranını hesaplattırır. Tuzak, değişken genel üretim gideri\u0027ü de orana tabi tutmak ya da sabit genel üretim gideri\u0027ün tamamını maliyete yazmaktır (tam maliyetle karıştırma). Bu soru normal maliyet yönteminin sabit genel üretim gideri paylaştırma kuralı noktasından geliyor (p. Teori Notu).","terimler":[{"kaynak":"soruda verilir","tanim":"İşletmenin normal koşullarda ulaşabileceği üretim düzeyi","ad":"Normal kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Fiili üretimin normal kapasiteye bölünmesiyle bulunan oran","ad":"Kapasite kullanım oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Üretim miktarıyla orantılı değişen genel üretim gideri, tamamı maliyete girer","ad":"Değişken genel üretim gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Kullanılmayan kapasiteye düşen sabit genel üretim gideri payı, dönem gideri sayılır","ad":"Atıl (boş) kapasite gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Normal kapasite, fiili üretim, değişken genel üretim gideri ve sabit genel üretim gideri verilerek mamul maliyetine yüklenecek toplam genel üretim gideri istenir.","panel_ornek":"Bir kargo firmasının aylık normal taşıma kapasitesi 100 paket olsun ama ay içinde sadece 60 paket taşınmış. Sabit araç gideri 500 TL ise, sadece kapasite kullanım oranına düşen kısım (60/100=%60 → 300 TL) o ayın maliyetine yazılır, kalan 200 TL boşta kalan kapasitenin gideri sayılır.","ornek":"Bir kargo firmasının aylık normal taşıma kapasitesi 100 paket olsun ama ay içinde sadece 60 paket taşınmış. Sabit araç gideri 500 TL ise, sadece kapasite kullanım oranına düşen kısım (60/100=%60 → 300 TL) o ayın maliyetine yazılır, kalan 200 TL boşta kalan kapasitenin gideri sayılır.","yontemler":"Tek yöntem: değişken genel üretim gideri\u0027ün tamamı + sabit genel üretim gideri\u0027ün kapasite kullanım oranına isabet eden kısmı toplanır; kalan sabit genel üretim gideri payı maliyete girmez.","nedir":"Normal maliyet yöntemi, sabit genel üretim giderinin yalnız kullanılan kapasiteye düşen kısmının mamul maliyetine yüklenmesini sağlar. Sınav, atıl kapasiteye düşen giderin maliyete gömülüp gömülmediğini ölçer."},"olay":"Kapasite kullanım oranı = 8.000/10.000 = 0,80; yüklenen sabit genel üretim gideri = 200.000 x 0,80 = 160.000; toplam yüklenen genel üretim gideri = 400.000 + 160.000 = 560.000.","tuzak":{"C":{"ad":"Oran Kapsamı Tuzağı","metin":"Kapasite kullanım oranını hem değişken hem sabit genel üretim giderine uyguladın. Doğrusu: kapasite kullanım oranı yalnızca sabit genel üretim giderine uygulanır, değişken genel üretim gideri\u0027ün tamamı yüklenir."},"E":{"ad":"Yöntem Karıştırma Tuzağı","metin":"Sabit genel üretim giderinin tamamını, kapasite oranı uygulamadan yükleyerek tam maliyet yöntemi mantığıyla işlem yaptın. Doğrusu: normal maliyette sabit genel üretim gideri\u0027ün yalnız kapasiteye isabet eden kısmı yüklenir, boş kapasite payı dönem gideridir."},"A":{"ad":"Kapsam Tuzağı","metin":"Yalnız sabit genel üretim giderinin kapasite kullanım oranına göre yüklenen kısmını hesaplayıp değişken genel üretim giderini toplama hiç dahil etmedin. Doğrusu: değişken genel üretim gideri\u0027ün tamamı da yüklenen tutara eklenmelidir."},"B":{"ad":"Yöntem Karıştırma Tuzağı","metin":"Kapasite oranını sabit yerine değişken genel üretim giderine uyguladın; sabit genel üretim gideri kısmını ise hiç eklemedin. Doğrusu: normal maliyette yalnız sabit genel üretim gideri kapasite oranına tabidir, değişken genel üretim gideri\u0027ün tamamı yüklenir."}},"celdiriciYol":{"C":"(400.000 x 0,80) + (200.000 x 0,80) = 320.000 + 160.000 = 480.000 (değişken genel üretim gideri\u0027ü de kapasite oranına tabi tuttun, oysa yalnız sabit genel üretim gideri orana tabidir)","E":"400.000 + 200.000 = 600.000 (sabit genel üretim gideri\u0027ün tamamını yükledin, boş kapasiteye düşen payı ayırmadan tam maliyet mantığıyla işlem yaptın)","A":"200.000 x (8.000/10.000) = 160.000 (yalnız sabit genel üretim gideri\u0027ün yüklenen kısmını yazıp değişken genel üretim gideri\u0027ü toplama hiç katmadın)","B":"400.000 x (8.000/10.000) = 320.000 (kapasite oranını sabit yerine değişken genel üretim gideri\u0027e uyguladın, sabit genel üretim gideri\u0027ü hiç eklemedin)"},"hap":"Normal maliyet yönteminde değişken genel üretim giderinin tamamı, sabit genel üretim giderinin ise yalnız kapasite kullanım oranına isabet eden kısmı mamul maliyetine yüklenir.","teshis":{"C":{"gercek":"Normal maliyet yönteminde yalnız sabit genel üretim gideri kapasite oranına tabi tutulur; değişken genel üretim gideri oranlanmadan tam olarak yüklenir.","ayirt":"Değişken genel üretim gideri\u0027ü orana tabi tuttum mu, tutmamalı mıydım?","paragraf":"Tetikte Teori Notu - Normal Maliyet Yöntemi","yanilgi":"Kapasite kullanım oranının hem sabit hem değişken genel üretim giderine uygulanması gerektiğini sanıyorsun."},"E":{"gercek":"Tam maliyette sabit genel üretim gideri\u0027ün tamamı yüklenir; normal maliyette ise yalnız kapasiteye isabet eden kısmı yüklenir, boş kapasite payı 680 Çalışmayan Kısım Gider ve Zararları hesabına gider olarak yazılır.","ayirt":"Bu soru tam maliyet mi normal maliyet mi soruyor?","paragraf":"Tetikte Teori Notu - Normal Maliyet Yöntemi","yanilgi":"Normal maliyet yöntemiyle tam maliyet yöntemini karıştırıp sabit genel üretim gideri\u0027ün tamamının her durumda yükleneceğini sanıyorsun."},"A":{"gercek":"Normal maliyet yönteminde değişken genel üretim gideri\u0027ün tamamı ile sabit genel üretim gideri\u0027ün kapasiteye isabet eden kısmı birlikte toplanarak yüklenen genel üretim gideri bulunur.","ayirt":"Hesabımda değişken genel üretim gideri tutarını toplama dahil ettim mi?","paragraf":"Tetikte Teori Notu - Normal Maliyet Yöntemi","yanilgi":"Toplam yüklenen genel üretim giderinin yalnızca sabit kısımdan oluştuğunu, değişken genel üretim gideri\u0027ün ayrıca eklenmesi gerekmediğini sanıyorsun."},"D":{"gercek":"Normal maliyet yönteminde değişken genel üretim gideri\u0027ün tamamı ile sabit genel üretim gideri\u0027ün kapasiteye isabet eden kısmı toplanarak yüklenen genel üretim gideri bulunur; boş kapasite payı dönem gideridir.","ayirt":"Değişken genel üretim gideri\u0027ü tam, sabit genel üretim gideri\u0027ü orana göre mi yükledim?","paragraf":"Tetikte Teori Notu - Normal Maliyet Yöntemi","yanilgi":"Bu şıkkı eleyen öğrenci, kapasite oranının yalnız sabit genel üretim gideri\u0027e uygulanacağını değil, tüm giderlere ya da hiçbirine uygulanacağını sanır."},"B":{"gercek":"Kapasite kullanım oranı yalnız SABİT genel üretim gideri\u0027e uygulanır; değişken genel üretim gideri\u0027ün tamamı hiçbir orana tabi tutulmadan yüklenir.","ayirt":"Oranı uyguladığım gider, sabit mi değişken mi?","paragraf":"Tetikte Teori Notu - Normal Maliyet Yöntemi","yanilgi":"Kapasite kullanım oranının hangi gider türüne uygulandığını karıştırıp, oranı değişken genel üretim gideri\u0027e uyguladın ve sabit genel üretim gideri\u0027ü unuttun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":null,"kural":"Tekdüzen Hesap Planına göre 157 Diğer Stoklar hesabı kapsamına giren ürün, artık ve hurda kalemleri elde edildiklerinde maliyet bedeliyle hesaba borç kaydedilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Tekdüzen Hesap Planı hesap açıklaması sorularında önce \u0027hangi taraf (borç/alacak)\u0027 sonra \u0027hangi ölçü (maliyet mi piyasa mı)\u0027 diye iki soruyla şıkkı ele.","konu":"maliyet esası kavramı","tablo":{"satirlar":[["A) 150 İlk Madde ve Malzeme hesabı yalnız satın alınan hamm…","MSUGT Sıra No:1, THP 150","YANLIŞ ifade"],["B) 151 Yarı Mamuller-Üretim hesabı, mamul tamamlandığında o…","MSUGT Sıra No:1, THP 151","YANLIŞ ifade"],["C) 157 Diğer Stoklar hesabında izlenen ürün, artık ve hurda…","MSUGT Sıra No:1, THP 157","YANLIŞ ifade"],["D) 151 Yarı Mamuller-Üretim hesabı yalnızca direkt ilk madd…","MSUGT Sıra No:1, THP 151","YANLIŞ ifade"],["E) Üretim sırasında elde edilen ve tam mamul niteliği taşım…","MSUGT Sıra No:1, THP 157","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"157 Diğer Stoklar hesabında izlenen ürün, artık ve hurda niteliğindeki kalemler, elde edildikleri tarihte tespit edilen güncel piyasa satış değeriyle hesaba borç kaydedilir.","E":"Üretim sırasında elde edilen ve tam mamul niteliği taşımayan ürün, artık ve hurda kalemleri, maliyet bedeliyle 157 Diğer Stoklar hesabının borcuna kaydedilir.","A":"150 İlk Madde ve Malzeme hesabı yalnız satın alınan hammaddeleri kapsar; işletme bünyesinde üretilen yardımcı maddeler bu hesaba maliyet bedeliyle kaydedilemez.","D":"151 Yarı Mamuller-Üretim hesabı yalnızca direkt ilk madde ve malzeme tutarları kadar borçlandırılır; direkt işçilik ve genel üretim giderleri bu hesaba dahil edilmez.","B":"151 Yarı Mamuller-Üretim hesabı, mamul tamamlandığında oluşan maliyet tutarı ile borçlandırılır; tamamlanmamış üretim ise dönem sonunda bu hesaba alacak k lir: stok işletmeye girerken kayda alınma anında. Nasıl ölçülür: fiili elde etme veya üretim maliyeti tutarıyla. Nasıl kaydedilir: ilgili stok hesabına borç, ödenen/doğan bedel karşı hesaba alacak yazılır.","desen":"Sınav genellikle Tebliğ\u0027in hesap işleyiş maddelerinden birini seçenek olarak verip, gerçek bedel yerine güncel piyasa değerini doğru gösteren yanlış şık kurar. Tuzak, maliyet esasını yeniden değerleme ya da rayiç bedelle karıştırmaktır (p.1-2). Bu soru, Tebliğ\u0027deki hesap işleyiş açıklamaları noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Varlığın elde etme anındaki gerçek bedelle kayda alınması ilkesi","ad":"Maliyet esası","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Stokun satın alma veya üretim sırasında oluşan fiili toplam bedeli","ad":"Elde etme maliyeti","kim":"piyasa fiyatlar (satış bedeli, alış bedeli gibi gerçekleşen tutarlar)"},{"kaynak":"kuraldan bilinir","tanim":"Hangi hesaba borç, hangi hesaba alacak kaydedileceğini gösteren kural","ad":"Hesap planı işleyişi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Maliyet unsurlarının ilgili gider hesaplarından maliyet hesaplarına aktarımını sağlayan hesap","ad":"Yansıtma hesabı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda stokların kaydına ilişkin ifadeler verilir ve Tekdüzen hesap planına göre doğru ifade istenir.","panel_ornek":"İkinci el bir bisiklet 3.000 liraya alınıp deftere 3.000 lira olarak yazılır, sonradan piyasada 3.500 liraya satılsa bile kayıt değişmez. Alış anındaki gerçek bedel esas alınır, tahmini değer değil.","ornek":"İkinci el bir bisiklet 3.000 liraya alınıp deftere 3.000 lira olarak yazılır, sonradan piyasada 3.500 liraya satılsa bile kayıt değişmez. Alış anındaki gerçek bedel esas alınır, tahmini değer değil.","yontemler":"Doğru şıkkı bulmak için \u0027gerçek/fiili bedel\u0027 ifadesi arayın; \u0027güncel değer\u0027, \u0027rayiç bedel\u0027 gibi ifadeler geçen şıklar genelde yanlıştır.","nedir":"Maliyet esası, stokların defterlere ilk elde etme veya üretim maliyeti üzerinden kaydedilmesi kuralıdır. Sınav, öğrencinin stokların hangi tutarla kayda alınacağını hesap planı mantığıyla bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Ölçü Esası Tuzağı","metin":"Diğer Stoklar hesabında piyasa değerinin esas alındığını sanıyorsun. Doğrusu: 157 hesap kapsamındaki artık ve hurdalar da tüm stoklar gibi MALİYET BEDELİYLE hesaba borç kaydedilir, piyasa değeri esas alınmaz."},"A":{"ad":"Kapsam Tuzağı","metin":"150 hesabın yalnız satın alınanları kapsadığını sanıyorsun. Doğrusu: Tekdüzen Hesap Planına göre 150 hesap, hem satın alınan hem de işletmede üretilen ilk madde ve malzemeyi maliyet bedeliyle borçlandırır."},"D":{"ad":"Unsur Eksikliği Tuzağı","metin":"Yarı mamul maliyetini yalnız ilk madde ve malzemeden ibaret sanıyorsun. Doğrusu: 151 hesap, direkt ilk madde ve malzeme ile birlikte direkt işçilik ve genel üretim giderlerinden aldığı payları da içerecek şekilde borçlandırılır."},"B":{"ad":"Taraf Tuzağı","metin":"Yarı mamul hesabının işleyişini ters kurmuşsun. Doğrusu: Dönem içinde giderler bu hesaba borç yazılır, tamamlanan mamulün maliyeti ise hesabın ALACAĞINA kaydedilerek ilgili stok hesabına aktarılır."}},"celdiriciYol":{"C":"Maliyet bedeli yerine güncel piyasa/satış değerini esas alma (ölçü esasını değiştirme hatası)","A":"150 hesabın \u0027satın alınan\u0027 ibaresine takılıp \u0027üretilen\u0027 ibaresini gözden kaçırma (kapsamı daraltma hatası)","D":"Maliyetin üç unsurundan ikisini (işçilik, genel üretim gideri) hesap dışında bırakma (eksik unsur hatası)","B":"Hesabın borç ve alacak yönünü zihinde ters kurma (taraf/yön karıştırma hatası)"},"hap":"Tekdüzen Hesap Planında tüm stok hesapları -ana ürün, yarı mamul ya da artık/hurda ayrımı yapılmaksızın- maliyet bedeli üzerinden kaydedilir; piyasa değeri kayıt esası değildir.","teshis":{"C":{"gercek":"THP 157 açıklaması net biçimde \u0027maliyet bedeli ile hesaba borç\u0027 der; piyasa/satış değeri bu hesabın kayıt esası değildir.","ayirt":"Bu kalem işletmeye kaça mal oldu, yoksa piyasada kaça satılır diye mi düşünüyorum?","paragraf":"MSUGT Sıra No:1, THP 157 Diğer Stoklar","yanilgi":"Artık ve hurda gibi kalemlerin, satılabilecekleri güncel piyasa değeriyle kayda alındığını düşünüyorsun."},"E":{"gercek":"THP 157 açıklaması, \u0027yukarıdaki stok kalemlerinin hiçbirinin kapsamına alınmayan ürün, artık ve hurda gibi kalemler\u0027in de maliyet bedeliyle borç kaydedileceğini belirtir; maliyet esası tüm stok gruplarında geçerlidir.","ayirt":"Bu kalem de sonuçta bir stok mu, öyleyse maliyet esasından ayrı tutulmasına gerek var mı?","paragraf":"MSUGT Sıra No:1, THP 157 Diğer Stoklar","yanilgi":"Bu şıkkı elemeye çalışan öğrenci, artık/hurda gibi ikincil kalemlerin maliyet esasından muaf, ayrı bir değerleme kuralına tabi olduğunu sanır."},"A":{"gercek":"Tekdüzen Hesap Planı 150 açıklamasına göre hesap, \u0027satın alındıkları ya da üretildikleri maliyet bedeli ile\u0027 borçlandırılır; kaynak üretilenleri de kapsar.","ayirt":"Bu malzeme parayla mı alınmış yoksa işletmede mi üretilmiş, ikisi de aynı hesaba mı giriyor?","paragraf":"MSUGT Sıra No:1, THP 150 İlk Madde ve Malzeme","yanilgi":"150 hesabın sadece dışarıdan alınan malzemeleri izlediğini, işletme içinde üretilen yardımcı maddelerin bu hesaba girmediğini düşünüyorsun."},"D":{"gercek":"THP 151 işleyişine göre hesap, direkt ilk madde ve malzeme, direkt işçilik VE genel üretim giderleri tutarları kadar borçlandırılır; üçü birlikte hesaba girer.","ayirt":"Maliyetin üç unsurunun hepsi bu hesaba yansıyor mu, yoksa bir tanesini mi unuttum?","paragraf":"MSUGT Sıra No:1, THP 151 Yarı Mamuller-Üretim","yanilgi":"Yarı mamul maliyetinin yalnızca direkt ilk madde ve malzemeden oluştuğunu, işçilik ve genel üretim giderinin bu hesaba girmediğini sanıyorsun."},"B":{"gercek":"THP 151 işleyişine göre dönem içi giderler hesaba borç kaydedilir; üretimi TAMAMLANANLARIN maliyeti ise hesabın alacağı karşılığında ilgili stok hesabına aktarılır.","ayirt":"Bu tutar hesaba mı giriyor yoksa hesaptan mı çıkıp başka bir stok hesabına mı gidiyor?","paragraf":"MSUGT Sıra No:1, THP 151 Yarı Mamuller-Üretim","yanilgi":"Yarı mamul hesabının borç-alacak yönünü tersine kurup, tamamlanan mamulün maliyetinin hesaba borç yazıldığını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{"151":{"ad":"YARI MAMULLER-ÜRETİM","tanim":"Henüz tam mamul haline gelmemiş ancak direkt ilk madde ve malzeme ile direkt işçilik ve genel üretim giderlerinden belli oranlarda pay almış üretim aşamasındaki mamullerin izlendiği hesaptır. İşleyişi: Maliyet dönemi sonunda direkt ilk madde ve malzeme, direkt işçilik ve genel üretim giderleri tutarları kadar bu hesap borçlandırılır."},"150":{"ad":"İLK MADDE VE MALZEME","tanim":"Üretimde veya diğer faaliyetlerde kullanılmak üzere işletmede bulundurulan hammadde, yardımcı madde, işletme malzemesi, ambalaj malzemesi ve diğer malzemelerin izlendiği hesaptır."},"157":{"ad":"DİĞER STOKLAR","tanim":"Yukarıdaki stok kalemlerinin hiç birinin kapsamına alınmayan ürün, artık ve hurda gibi kalemler bu hesap grubunda yer alır. İşleyişi: Elde edilen bu stoklar maliyet bedeli ile hesaba borç, satıldığında, devredildiğinde veya kullanıldığında alacak kaydedilir."}}},{"capa":{"kaynak":"SGS 2024/2 Soru 59"},"kural":"Muhasebe Sistemi Uygulama Genel Tebliği Sıra No: 2\u0027ye göre, aylık maliyetlere pay verilmesinde tamir-bakım gibi giderlere ilişkin tahmini gider karşılıkları 373 MALİYET GİDERLERİ KARŞILIĞI hesabında izlenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 59","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"10.000","taraf":"B","hesap":"730 GENEL ÜRETİM GİDERLERİ"},{"tutar":"10.000","taraf":"A","hesap":"373 MALİYET GİDERLERİ KARŞILIĞI"}],"teori":false,"taktik":"Kayıt sorularında önce hangi hesabın borç hangisinin alacak olduğuna değil, işlemin g hesaplanır. Nasıl kaydedilir: hesaplanan pay ilgili gider hesabına borç, 373- Maliyet Giderleri Karşılığı hesabına alacak yazılır.","desen":"Sınav, öğrencinin tahmini payı doğrudan kasa veya banka gibi nakit hesaplarına kaydetmesini bekleyen tuzak seçenekler sunar; oysa henüz gerçek ödeme yapılmamıştır. Doğru kayıt, ilgili gider/maliyet hesabına borç, 373 hesaba alacak şeklindedir. Bu soru 373- Maliyet Giderleri Karşılığı hesabının işleyişi maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Maliyetlere gerçek yerine tahmini paylarla dağıtım yapılan yöntem","ad":"Normal maliyet yöntemi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Yıllık tutarın aylara eşit bölünmesiyle bulunan aylık kısım","ad":"Tahmini gider payı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Aylık tahmini gider paylarının alacak kaydedildiği karşılık hesabı","ad":"373- Maliyet Giderleri Karşılığı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Tahmini payın ilgili maliyet hesabına borç yazılması işlemi","ad":"Yükleme kaydı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Yıllık toplam gider tutarı ve aylık pay hesabı verilir, Ocak ayı sonundaki muhasebe kaydının hangi hesaplarla yapılacağı istenir.","panel_ornek":"Bir apartman yönetimi, yılda bir kez ödenen 60.000 TL asansör bakım parasını, her ay eşit şekilde aidatlara yansıtıyor. Ocak ayı geldiğinde daireler ödemenin tamamını değil, o aya düşen 5.000 TL\u0027lik payı öder. Yıl sonunda gerçek fatura geldiğinde fark varsa düzeltme yapılır.","ornek":"Bir apartman yönetimi, yılda bir kez ödenen 60.000 TL asansör bakım parasını, her ay eşit şekilde aidatlara yansıtıyor. Ocak ayı geldiğinde daireler ödemenin tamamını değil, o aya düşen 5.000 TL\u0027lik payı öder. Yıl sonunda gerçek fatura geldiğinde fark varsa düzeltme yapılır.","yontemler":"Tek yöntem: tahmini pay ilgili gider hesabına borç, 373- Maliyet Giderleri Karşılığı hesabına alacak kaydedilir; gerçek ödeme yapıldığında bu karşılık hesabı kapatılır.","nedir":"Normal maliyet yöntemi, üretim maliyetlerinin gerçekleşen tutarlar yerine önceden belirlenmiş tahmini paylarla aylara dağıtılmasını sağlar. Sınav bu tahmini payların hangi hesaba nasıl kaydedildiğini ölçer."},"olay":"120.000 TL / 12 ay = 10.000 TL.","tuzak":{"C":{"ad":"Belge/Hesap Karıştırma Tuzağı","metin":"Öğrenci henüz ödeme yapılmadığı halde işlemi peşin ödenmiş bir gider gibi görüp 180 ve banka hesabını kullanır. Doğrusu: Bu aşamada nakit çıkışı yoktur, yalnız tahmini bir karşılık ayrılır; 180 hesabı gerçek bir ödemeye dayanan giderler için kullanılır."},"E":{"ad":"Zamanlama Tuzağı","metin":"Öğrenci yıllık toplam tutarı dağıtmadan tek bir ayda gider olarak yükler, aylara yayma amacını gözden kaçırır. Doğrusu: Yıllık 120.000 TL, on iki aya bölünerek her ay yalnız 10.000 TL\u0027lik pay maliyete yüklenir."},"D":{"ad":"Nakit Varsayımı Tuzağı","metin":"Öğrenci gider tahakkukunu gerçek bir banka ödemesiyle karıştırıp henüz gerçekleşmemiş nakit çıkışını kaydeder. Doğrusu: Aralık ayına kadar fiilen ödeme yapılmadığından karşı hesap banka değil, 373 MALİYET GİDERLERİ KARŞILIĞI hesabıdır."},"B":{"ad":"Taraf Tuzağı","metin":"Öğrenci 373 hesabın karşılık hesabı olduğunu bilse de hangi tarafta çalıştığını karıştırıp gider hesabını alacaklandırır, karşılık hesabını borçlandırır. Doğrusu: Tahmini karşılık ayrılırken gider hesabı borçlanır, 373 hesap alacaklanır; ters kayıt yıl içinde giderin eksik gösterilmesine yol açar."}},"celdiriciYol":{"C":"120.000/12=10.000 tutarı Borç 180 Gelecek Aylara Ait Giderler / Alacak 102 Bankalar şeklinde kaydedilir = 10.000 (henüz ödeme yapılmadığı halde peşin ödenmiş gider ve banka çıkışı varsayıldı)","E":"120.000 TL yıllık tutarın tamamı aylara bölünmeden tek seferde kaydedilir = 120.000 (dağıtım yapılmadan yıllık tutar bir ayda gider yazıldı)","D":"120.000/12=10.000 tutarı Borç 730 Genel Üretim Giderler ; makine henüz teslim alınmadı (soruda verilen)","anlatim":"Soru bize şunu vermiş: 150.000 TL\u0027lik avans bankadan ödenmiş, makine (maddi duran varlık) henüz teslim alınmamış. Hangi hesaplara kayıt yapılacağı soruluyor.","verilenAdim":true,"doldur":[[0,1],[1,1]]},{"formul":"259 VERİLEN AVANSLAR: sipariş edilen maddi duran varlık için ödenen avans, borç kaydı","anlatim":"259 Verilen Avanslar nedir? Sipariş edilen maddi duran varlık için önceden yapılan avans ödemesi buraya yazılır. Mal teslim alınana kadar borç bakiyesi taşır.","doldur":[]},{"formul":"102 BANKALAR: banka hesabından çıkan tutar, alacak kaydı","anlatim":"102 Bankalar nedir? İşletmenin banka hesabındaki para hareketlerini gösterir. Para çıkışı bu hesaba alacak yazılır.","doldur":[]},{"formul":"259 VERİLEN AVANSLAR (BORÇ) 150.000 = 150.000 avans (soruda verilen)","anlatim":"Makine henüz elimize geçmedi, sadece avans verdik - varlık artışı 259\u0027a yazılır. Varlık artınca borç çalışır, o yüzden 259 borçlanır.","doldur":[[0,0]]},{"formul":"102 BANKALAR (ALACAK) 150.000 = 150.000 avans (soruda verilen)","anlatim":"Banka hesabından para çıktı, bu yüzden 102 azalıyor. Varlık azalınca alacak çalışır, o yüzden 102 alacaklanır.","doldur":[[1,0]]},{"formul":"Yanlış yol: 159 VERİLEN SİPARİŞ AVANSLARI (BORÇ) 150.000 (HATALI) → doğrusu 259 VERİLEN AVANSLAR (BORÇ) 150.000 (4. adımda bulduk)","anlatim":"En sık hata: öğrenciler 259\u0027u 159 Verilen Sipariş Avansları ile karıştırır. 159 stok siparişi içindir, burada sipariş edilen bir makine yani maddi duran varlık var - doğrusu 259.","doldur":[]}],"anahtar":[{"ornek":"varlık","kok":"varlık"},{"ornek":"siparişi","kok":"sipari"},{"ornek":"avanslar","kok":"avansl"},{"ornek":"alacak","kok":"alacak"},{"ornek":"edilen","kok":"edilen"},{"ornek":"makine","kok":"makine"},{"ornek":"259","kok":"259"},{"ornek":"102","kok":"102"}],"konuGiris":{"harita":"Ne zaman kaydedilir: maddi duran varlık için avans ödendiği anda kaydedilir. Nasıl izlenir: varlık teslim alınana kadar ayrı bir aktif hesapta bekletilir. Nasıl kapatılır: varlık teslim alındığında ilgili duran varlık hesabına devredilerek kapatılır.","desen":"Sınav genellikle \u0027maddi duran varlık\u0027 ile \u0027stok\u0027 sipariş avansını karıştırtmak için soruyu kurar; öğrenci 159 ile 259\u0027u ayırt edemeyip yanlış hesabı seçebilir. Ayrıca varlık henüz teslim alınmadığı için doğrudan duran varlık hesabına değil, ara hesaba kayıt yapılması gerektiği unutulabilir. Bu soru, Tekdüzen Hesap Planı 259 Verilen Avanslar maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Sipariş edilen maddi duran varlık için yapılan avans ödemesinin izlendiği hesap","ad":"Verilen Avanslar (259)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Stok alımı için yapılan avansın izlendiği hesap, duran varlıkla karıştırılmamalı","ad":"Verilen Sipariş Avansları (159)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"İşletmenin banka hesabından çekilen veya yatırılan paraların izlendiği hesap","ad":"Bankalar (102)","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Satıcıya banka aracılığıyla ödenen avans bedeli","ad":"Ödenen tutar","kim":"piyasa fiyatlar (satış bedeli, alış bedeli gibi gerçekleşen tutarlar)"}],"sinavda":"Soru, maddi duran varlık için ödenen avans tutarını verir ve doğru muhasebe kaydını (hangi hesaba borç, hangi hesaba alacak) seçmeyi ister.","panel_ornek":"Ali, internetten sipariş ettiği bir bilgisayar masası için satıcıya 40 TL kapora yatırdı ama masa henüz kargoya verilmedi. Masa eline geçmeden önce bu 40 TL, Ali\u0027nin cebinden çıkmış ama henüz \u0027masa\u0027 olmamış bir alacak gibidir. Masa teslim edilince bu tutar masanın fiyatına sayılır.","ornek":"Ali, internetten sipariş ettiği bir bilgisayar masası için satıcıya 40 TL kapora yatırdı ama masa henüz kargoya verilmedi. Masa eline geçmeden önce bu 40 TL, Ali\u0027nin cebinden çıkmış ama henüz \u0027masa\u0027 olmamış bir alacak gibidir. Masa teslim edilince bu tutar masanın fiyatına sayılır.","yontemler":"Tek kritik kural: konu \u0027maddi duran varlık\u0027 ise 259 Verilen Avanslar, konu \u0027stok\u0027 ise 159 Verilen Sipariş Avansları kullanılır; ödeme banka ile yapıldığından karşı hesap 102 Bankalar olur.","nedir":"Bu konu, stok değil de maddi duran varlık (makine, bina gibi) için önceden ödenen sipariş avansının hangi hesapta izleneceğini öğretir. Sınav, öğrencinin \u0027avansın konusu ne\u0027 ayrımını yapıp yapamadığını ölçer."},"olay":"150.000 TL avans ödemesi doğrudan 259 hesabına borç yazılır.","tuzak":{"C":{"ad":"Yapılmakta Olan Yatırım Tuzağı","metin":"Öğrenci avans ödemesini yatırım maliyetine doğrudan gider gibi ekler. Doğrusu: 258 hesabına ancak fiilen gerçekleşmiş direkt/endirekt harcamalar girer; makine teslim alınmadan avans tutarı 258\u0027e değil 259\u0027a kaydedilir."},"E":{"ad":"KDV Hesabı Karıştırma Tuzağı","metin":"Öğrenci avans ödemesini teşvikli yatırım KDV ertelemesiyle karıştırıp 392 DİĞER KDV hesabına yazar. Doğrusu: 392 hesabı yalnız gümrükte ertelenen veya ihraç kaydıyla terkin edilecek katma değer vergisini izler; sıradan avans ödemesinde bu hesaba işlem yapılmaz."},"D":{"ad":"Taraf Karışıklığı Tuzağı","metin":"Öğrenci verilen avansı alınan avans gibi ters taraflarla ve yanlış hesapla kaydeder. Doğrusu: İşletme avansı ödediği için alacaklı değil borçlu konumdadır; kayıt 259 VERİLEN AVANSLAR borcu, 102 BANKALAR alacağıyla yapılır, 349 alınan avanslar hesabı ise avansı alan tarafın hesabıdır."},"A":{"ad":"Sipariş Avansı Hesabı Tuzağı","metin":"Öğrenci 159 hesabın her türlü sipariş avansını kapsadığını sanır. Doğrusu: 159 yalnız stok (madde/malzeme) siparişleri için ödenen avansları izler; maddi duran varlık siparişinde 259 VERİLEN AVANSLAR kullanılır."}},"celdiriciYol":null,"hap":"Maddi duran varlık siparişi için ödenen avanslar 259 VERİLEN AVANSLAR hesabına, stok siparişi için ödenenler ise 159 VERİLEN SİPARİŞ AVANSLARI hesabına kaydedilir.","teshis":{"C":{"gercek":"258 YAPILMAKTA OLAN YATIRIMLAR hesabına yalnız fiilen gerçekleşen madde, işçilik ve genel gider harcamaları girer; avans teslimden önce 259\u0027da bekler.","ayirt":"Mal/hizmet fiilen teslim alındı mı, yoksa yalnızca ödeme mi yapıldı?","paragraf":"THP 258 YAPILMAKTA OLAN YATIRIMLAR","yanilgi":"Avans ödemesinin, henüz teslim alınmamış olsa da doğrudan yatırım harcaması sayılacağını sanıyorsun."},"E":{"gercek":"392 DİĞER KDV yalnız teşvikli yatırım malı ithalinde ertelenen veya ihraç kaydıyla terkin edilecek katma değer vergisini izler; sıradan avans ödemesi bu kapsama girmez.","ayirt":"Ödemede gümrükte ertelenmiş veya ihracata bağlı özel bir katma değer vergisi durumu var mı?","paragraf":"THP 392 DİĞER KDV","yanilgi":"Her avans-KDV ilişkili işlemin 392 DİĞER KDV hesabına gireceğini sanıyorsun."},"A":{"gercek":"159 VERİLEN SİPARİŞ AVANSLARI yalnız yurt içi/yurt dışından satın alınacak stoklarla ilgili avansları izler; maddi duran varlık için 259 kullanılır.","ayirt":"Sipariş edilen şey stok mu, yoksa maddi duran varlık mı?","paragraf":"THP 159 / THP 259","yanilgi":"159 hesabın stok değil her türlü sipariş avansını kapsadığını sanıyorsun."},"D":{"gercek":"İşletme avansı ödediği için borçlu taraftır; 349 ALINAN DİĞER AVANSLAR ise avansı alan işletmenin pasif hesabıdır, burada uygulanmaz.","ayirt":"Avansı ben mi ödüyorum, yoksa ben mi alıyorum?","paragraf":"THP 259 / THP 349","yanilgi":"Avans ödeyen taraf olduğun halde, kaydı alınan avans gibi ters taraflarla kurman gerektiğini sanıyorsun."},"B":{"gercek":"Maddi duran varlık siparişi için yapılan avans ödemeleri 259 VERİLEN AVANSLAR hesabına borç, banka/kasa çıkışı ilgili hesaba alacak kaydedilir.","ayirt":"Sipariş edilen kalem maddi duran varlık mı, ödeme henüz teslim öncesi mi?","paragraf":"THP 259 VERİLEN AVANSLAR","yanilgi":"Bu şıkkı eleyen öğrenci, avans ödemesinin doğrudan yatırım maliyeti ya da stok avansı sayılması gerektiğini düşünüyor."}},"verilen":[[0,1],[1,1]],"donem":1,"hesaplar":{"349":{"ad":"ALINAN DİĞER AVANSLAR","tanim":"Özel bölümünde tanımlanan avanslar dışında, işletmenin aldığı her türlü kısa vadeli avansların izlendiği hesaptır. İşleyişi : \"Diğer Avanslar\" \"340- Alınan Sipariş Avansları Hesabında\" açıklanmıştır."},"392":{"ad":"DİĞER KDV","tanim":"Bu hesap; teşvikli yatırım mallarının ithalinden doğan ve ertelenen Katma Değer Vergisi ve ihraç kaydiyle satış nedeniyle ertelenen ve terkin edilecek Katma Değer Vergisi gibi ihtiyaca göre bölümlenir."},"259":{"ad":"VERİLEN AVANSLAR","tanim":"Yurt içinden veya yurt dışından satınalınmak üzere sipariş edilen maddi duran varlıklarla ilgili olarak yapılan avans ödemelerinin izlendiği hesaptır. Sipariş avansıyla ilgili giderleri de kapsar."},"102":{"ad":"Bankalar","tanim":"Bu hesap, işletmece yurt içi ve yurt dışı banka ve benzeri finans kurumlarına yatırılan ve çekilen paraların izlenmesini kapsar. İşleyişi : Bankalara para olarak veya hesaben yatırılan değerler borç, çekilen tutarlar ile üçüncü kişilerce tahsil edildiği anlaşılan çek ve ödeme emirleri alacak kaydedilir."},"159":{"ad":"VERİLEN SİPARİŞ AVANSLARI","tanim":"Yurt içinden ya da yurt dışından satın alınmak üzere siparişe bağlanan stoklarla ilgili olarak yapılan avans ödemelerinin izlendiği hesaptır. İşleyişi: Yapılan ödemeler bu hesaba borç, malın teslimi üzerine alacak kaydedilir."},"258":{"ad":"YAPILMAKTA OLAN YATIRIMLAR","tanim":"İşletmede, yapımı süren ve tamamlandığında ilgili maddi duran varlık hesabına aktarılacak olan, her türlü madde ve malzeme ile işçilik ve genel giderlerle ilgili harcamaların izlendiği hesaptır."}}},{"capa":{"kaynak":"SGS 2025/2 Soru 61"},"kural":"\u0027maliyetine %X kâr eklenerek satılmıştır\u0027 ifadesinde taban maliyettir, SMM = Net Satışlar / (1 + Kâr Oranı).","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 61","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"İfadede kâr oranının \u0027satış üzerinden\u0027 mi yoksa \u0027maliyete eklenerek\u0027 mi verildiğini önce belirle, tabanı ona göre seç.","konu":"üretim satış maliyeti hesaplama","tablo":{"satirlar":[["VERİLENLER","-"],["Net Satışlar","150.000 TL"],["Kâr Oranı","%25"],["HESAP","-"],["Kâr Oranı Katsayısı (1 + 0,25)","1,25"],["Satılan Malın Maliyeti (150.000 / 1,25)","120.000"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"150.000","E":"200.000","A":"112.500","D":"187.500","B":"120.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Kâr Oranı Katsayısı (1 + 0,20)","1,20"],["Satılan Malın Maliyeti (180.000 / 1,20)","150.000"]]},"tur":"tablo","soru":"Bir işletme ürettiği mamulü, maliyetine %20 kâr ekleyerek satmaktadır. Dönem içinde net satışları 180.000 TL olarak gerçekleşmiştir. Buna göre satılan malın maliyeti kaç TL\u0027dir?","verilen":[[1,1]],"hedef":"Tabloyu doldur ve satılan malın maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir işletme ürettiği mamulü, maliyetine %25 kâr ekleyerek satmaktadır. Dönem içinde net satışları 150.000 TL olarak gerçekleşmiştir. Buna göre satılan malın maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-26","verilenler":[{"deger":"150.000 TL","anlam":"Dönem içinde gerçekleşen, kâr oranı zaten eklenmiş nihai satış tutarı; maliyete ulaşmak için bu tutar (1+kâr oranı) ile bölünür.","ad":"Net Satışlar"},{"deger":"%25","anlam":"Maliyete eklenen kâr oranıdır (markup); satış üzerinden değil maliyet üzerinden hesaplanan orandır.","ad":"Kâr Oranı"}],"dayanak":"Maliyet muhasebesi teorisi - marj oranlarından satış maliyetinin bulunması, markup formülü (mevzuat maddesi yok)","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Net Satışlar 150.000 TL (soruda verilen); Kâr Oranı %25 (soruda verilen)","anlatim":"Soru bize şunları vermiş: net satışlar 150.000 TL ve kâr oranı %25, maliyet üzerinden hesaplanıyor. Dikkat: bu oran satış fiyatı üzerinden değil, maliyet üzerinden bir ekleme.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Kâr Oranı Katsayısı = 1 + Kâr Oranı = 1 + %25 (soruda verilen) = 1,25","anlatim":"Maliyete %25 kâr eklenince satış fiyatı, maliyetin 1,25 katı olur. Bu katsayı satışı maliyete çeviren bölme işleminin paydası olacak.","doldur":[[4,1]]},{"formul":"Satılan Malın Maliyeti = Net Satışlar / Kâr Oranı Katsayısı = 150.000 (soruda verilen) / 1,25 (2. adımda bulduk) = 120.000 TL","anlatim":"Satılan malın maliyeti, net satışların bu katsayıya bölünmesiyle bulunur. Neden bölüyoruz? Çünkü satış fiyatı zaten maliyetin 1,25 katıydı, tersine gidip maliyeti çözüyoruz.","doldur":[[5,1]]},{"formul":"Ters durum: kâr satış fiyatı üzerinden verilseydi → Satılan Malın Maliyeti = Net Satışlar × (1 − Kâr Oranı)","anlatim":"Ters durumda kâr oranı satış fiyatı üzerinden verilseydi, formül değişirdi. O zaman maliyet, net satışların (1 - kâr oranı) ile çarpımı olurdu, bölme değil çarpma yapardık.","doldur":[]},{"formul":"Yanlış yol: 150.000 × 1,25 = 187.500 (HATALI) → doğrusu 150.000 / 1,25 = 120.000 (3. adımda bulduk)","anlatim":"En sık hata, kâr oranını maliyeti bulmak için çarpma sanmaktır. Bu soruda çarparsak satış fiyatını büyütürüz, oysa zaten büyümüş olan satıştan maliyete inmemiz gerekiyor.","doldur":[]}],"anahtar":[{"ornek":"maliyete","kok":"maliye"},{"ornek":"fiyatı","kok":"fiyatı"},{"ornek":"satışlar","kok":"satışl"},{"ornek":"üzerinden","kok":"üzerin"},{"ornek":"satılmıştır","kok":"satılm"},{"ornek":"eklenerek","kok":"eklene"}],"konuGiris":{"harita":"Ne zaman test edilir: soru \u0027maliyetine %X kârla satılmıştır\u0027 dediğinde taban maliyet olur. Nasıl ölçülür: net satış tutarı (1 + kâr oranı) sayısına bölünerek satılan malın maliyeti bulunur. Nasıl kaydedilir: sonuç doğrudan satılan malın maliyeti (SMM) tutarı olarak ifade edilir, ayrı bir kayıt işlemi yoktur.","desen":"Soru \u0027maliyetine %X kârla satış\u0027 ifadesini kullanarak tabanın maliyet (markup) olduğunu gizler; öğrenci yanlışlıkla satış üzerinden marj varsayıp net satışı (1-%X) ile çarpabilir. Bu tuzak, marj ile markup formüllerinin karıştırılmasından kaynaklanır. Bu soru maliyet üzerinden kâr oranı ile satış üzerinden kâr marjının farklı formüllere bağlı olması noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Dönem içinde gerçekleşen toplam satış tutarı","ad":"Net satışlar","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Kârın satılan malın maliyetine göre oranı","ad":"Markup (maliyet üzerinden kâr oranı)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Kârın net satışlara göre oranı, markuptan farklı taban","ad":"Brüt kâr marjı (satış üzerinden)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Net satışın (1+markup) değerine bölünmesiyle kalan tutar","ad":"Satılan malın maliyeti (SMM)","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Net satış tutarı ve maliyete eklenen kâr oranı verilir, satılan malın maliyeti istenir.","panel_ornek":"Bir tişört üreticisi, maliyetine %20 kâr koyarak satış yapıyor; tişörtü 60 TL\u0027ye satıyorsa maliyeti 50 TL\u0027dir çünkü 50 x 1,20 = 60 eder. Yani kârı satışın değil, maliyetin üzerine eklemiş. Bu mantığı görünce hangi tabanın kullanıldığını fark edersin.","ornek":"Bir tişört üreticisi, maliyetine %20 kâr koyarak satış yapıyor; tişörtü 60 TL\u0027ye satıyorsa maliyeti 50 TL\u0027dir çünkü 50 x 1,20 = 60 eder. Yani kârı satışın değil, maliyetin üzerine eklemiş. Bu mantığı görünce hangi tabanın kullanıldığını fark edersin.","yontemler":"Tek yöntem: \u0027maliyete %X kâr\u0027 ifadesinde taban maliyettir, bu yüzden SMM = Net Satış / (1 + %X) şeklinde bulunur; bu soruda 150.000 / 1,25 = 120.000 TL\u0027dir.","nedir":"Bu konu, satış fiyatı maliyete belli bir kâr oranı eklenerek belirlendiğinde satılan malın maliyetinin geriye doğru bulunmasını öğretir. Sınav, marjın satış mı yoksa maliyet mi üzerinden olduğunu ayırt edebilme becerini ölçer."},"olay":"150.000 / (1 + 0,25) = 150.000 / 1,25 = 120.000.","tuzak":{"C":{"ad":"İşlem Atlama Tuzağı","metin":"kâr oranını hiç uygulamadan net satış tutarını doğrudan maliyet sanmışsın. Doğrusu: satış tutarı ile maliyet, aradaki kâr oranı nedeniyle birbirinden farklıdır, oran mutlaka uygulanmalıdır."},"E":{"ad":"Çifte Ters Uygulama Tuzağı","metin":"hem tabanı satış sanmış hem de işlemi ters yönde (bölme yerine ters bölme) uygulamışsın. Doğrusu: taban maliyettir ve satıştan maliyete geçişte (1+oran) ile bölünür, (1-oran) ile bölünmez."},"D":{"ad":"Ters Yön Tuzağı","metin":"kâr oranını maliyetten satışa giderken kullanılan katsayıyı, satıştan maliyete dönerken de çarpma yönünde uygulamışsın. Doğrusu: satıştan maliyete dönerken bölme işlemi yapılır, çarpma değil."},"A":{"ad":"Taban Karışıklığı Tuzağı","metin":"%25\u0027i satış üzerinden brüt kâr marjı sanıp net satıştan doğrudan düştün. Doğrusu: ifade \u0027maliyete %25 kâr eklenerek satılmıştır\u0027 dediği için taban maliyettir, satış değil."}},"celdiriciYol":{"C":"150.000 = 150.000 (kâr oranı hiç uygulanmadan işlem atlandı)","E":"150.000 / (1 - 0,25) = 200.000 (taban ve yön birlikte ters uygulandı)","D":"150.000 x (1 + 0,25) = 187.500 (yön hatası: bölme yerine çarpma uygulandı)","A":"150.000 x (1 - 0,25) = 112.500 (taban karışıklığı: %25\u0027i satış üzerinden marj sandı)"},"hap":"\u0027Maliyete %X kâr eklenerek satılmıştır\u0027 ifadesinde taban maliyettir ve satılan malın maliyeti, net satışın (1+kâr oranı) ile bölünmesiyle bulunur.","teshis":{"C":{"gercek":"Net satış tutarı zaten kâr oranı eklenmiş nihai tutardır, maliyetle eşit olamaz.","ayirt":"Bu tutara kâr oranı hiç uygulanmadı mı?","paragraf":"Marj/Markup teorisi - işlem sırası","yanilgi":"Net satış tutarının kendisinin, üzerine kâr eklenmeden önceki maliyet olduğunu sanıyorsun."},"E":{"gercek":"Doğru çözüm tek bir tabana (maliyet) ve tek bir yöne (bölme) dayanır; iki hatanın toplanması sonucu daha da uzaklaştırır.","ayirt":"Aynı anda hem tabanı hem yönü mü değiştirdim?","paragraf":"Marj/Markup teorisi - taban ve yön birlikte","yanilgi":"Hem tabanı satış sanıp hem de bölme yerine çarpma yaparak iki hatayı üst üste bindiriyorsun."},"A":{"gercek":"Marj oranlarından satış maliyetinin bulunması teorisi iki farklı tabanı ayırır: satış üzerinden marj ile maliyet üzerinden markup farklı formüllere götürür.","ayirt":"İfade \u0027satış üzerinden\u0027 mi diyor yoksa \u0027maliyete eklenerek\u0027 mi diyor?","paragraf":"Marj/Markup teorisi - taban ayrımı","yanilgi":"Satış üzerinden kâr marjı ile maliyet üzerinden kâr oranını aynı şey sanıyorsun."},"D":{"gercek":"Maliyetten satışa geçişte çarpma, satıştan maliyete geçişte ise bölme uygulanır; yön tersine döndüğünde işlem de tersine döner.","ayirt":"Ben maliyetten satışa mı, satıştan maliyete mi gidiyorum?","paragraf":"Marj/Markup teorisi - dönüşüm yönü","yanilgi":"Satıştan maliyete dönerken de aynı katsayıyla çarpma yapılacağını sanıyorsun."},"B":{"gercek":"Marj oranlarından satış maliyetinin bulunması teorisine göre \u0027maliyete %X kâr eklenmiştir\u0027 ifadesinde SMM = Net Satışlar / (1+Kâr Oranı) formülü uygulanır.","ayirt":"Kâr oranı hangi tutarın üzerine eklendi: satışın mı, maliyetin mi?","paragraf":"Marj/Markup teorisi - markup formülü","yanilgi":"Bu şıkkı eleyen öğrenci, kâr oranının maliyete mi satışa mı ait olduğunu ayırt edemediği için başka bir tutara kaymıştır."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 58"},"kural":"Dönem başı yarı mamul stoku ile üretime alınan miktarın toplamı, üretimden çıkan miktar ile dönem sonu yarı mamul stoku toplamına eşittir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 58","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Miktar sağlama sorularında önce denklemin sol ve sağ tarafını dört kalemle yaz, sonra bilinmeyeni izole et.","konu":"safha maliyet miktar sağlama","tablo":{"satirlar":[["VERİLENLER","-"],["Dönem başı yarı mamul stoku","8.000 kg"],["Dönem sonu yarı mamul stoku","12.000 kg"],["Üretimden çıkan miktar","90.000 kg"],["HESAP","-"],["Üretimden Çıkan + Dönem Sonu yarı mamul (90.000+12.000)","102.000"],["Üretime Alınan Miktar (102.000-8.000)","94.000"]],"basliklar":["Kalem","Miktar (kg)"]},"siklar":{"C":"86.000","E":"102.000","A":"78.000","D":"94.000","B":"82.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"hesap","soru":"Tek evrede üretim yapan bir kimya işletmesinde dönem başı yarı mamul stoku 8.000 kg, dönem sonu yarı mamul stoku 12.000 kg\u0027dır. Miktar sağlama tablosuna göre dönemde üretimden çıkan (tamamlanıp bir sonraki sürece aktarılan) miktar 90.000 kg olarak belirlenmiştir. Buna göre dönem içinde üretime alınan miktar kaç kg\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-28","verilenler":[{"deger":"8.000 kg","anlam":"Miktar sağlama eşitliğinin sol tarafında üretime alınan miktarla toplanır.","ad":"Dönem başı yarı mamul stoku"},{"deger":"12.000 kg","anlam":"Miktar sağlama eşitliğinin sağ tarafında üretimden çıkan miktarla toplanır.","ad":"Dönem sonu yarı mamul stoku"},{"deger":"90.000 kg","anlam":"Dönem içinde tamamlanıp bir sonraki sürece aktarılan miktardır, eşitliğin sağ tarafında yer alır.","ad":"Üretimden çıkan miktar"}],"dayanak":"Maliyet Muhasebesi Teorisi - Safha Maliyet Sistemi Miktar Sağlama Tablosu (mevzuat maddesi yok)","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Dönem başı yarı mamul stoku 8.000 kg (soruda verilen); Dönem sonu yarı mamul stoku 12.000 kg (soruda verilen); Üretimden çıkan miktar 90.000 kg (soruda verilen)","anlatim":"Soru bize şunları vermiş: dönem başı yarı mamul stoku 8.000 kg, dönem sonu yarı mamul stoku 12.000 kg, üretimden çıkan (tamamlanan) miktar 90.000 kg.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Dönem Başı Stok + Üretime Alınan = Üretimden Çıkan + Dönem Sonu Stok","anlatim":"Miktar sağlama tablosu şunu söyler: başta olan artı sürece giren, sonda çıkan artı elde kalanla eşit olmalı. Burada mantık şu: dönem başı stok + üretime alınan = üretimden çıkan + dönem sonu stok.","doldur":[]},{"formul":"Üretimden Çıkan + Dönem Sonu yarı mamul = 90.000 (soruda verilen) + 12.000 (soruda verilen) = 102.000","anlatim":"Önce eşitliğin sağ tarafını, yani \"nereye gitmiş\" toplamını buluyoruz. Bu toplam bize üretime alınanı bulmak için gereken hedef sayıyı verir.","doldur":[[5,1]]},{"formul":"Üretime Alınan Miktar = Üretimden Çıkan + Dönem Sonu yarı mamul − Dönem Başı yarı mamul = 102.000 (2. adımda bulduk) − 8.000 (soruda verilen) = 94.000","anlatim":"Şimdi bu toplamdan dönem başı stoğu çıkarıyoruz, çünkü o zaten baştan vardı, dönem içinde ayrıca üretime almamıza gerek yoktu. Kalan fark dönem içinde üretime alınan miktarı verir.","doldur":[[6,1]]},{"formul":"Sağlama: 8.000 (soruda verilen) + 94.000 (4. adımda bulduk) = 102.000 (2. adımda bulduk) ✓","anlatim":"Sağlamasını yapalım: bulduğumuz üretime alınan miktarı dönem başı stoğa eklersek, üretimden çıkan ile dönem sonu stok toplamını vermeli. 8.000 + 94.000 = 102.000, doğru.","doldur":[]},{"formul":"Yanlış yol: 90.000 + 12.000 = 102.000 (HATALI, cevap sanılır) → doğrusu 102.000 − 8.000 = 94.000 (4. adımda bulduk)","anlatim":"En sık hata: dönem sonu stoğu toplamdan çıkarmak yerine dönem başı stoğu unutup direkt 90.000 + 12.000 sonucunu cevap sanmak. Ama bu 102.000 sadece ara toplam, üretime alınan için dönem başı stoğu düşmek şart.","doldur":[]}],"anahtar":[{"ornek":"üretime","kok":"üretim"},{"ornek":"miktar","kok":"miktar"},{"ornek":"alınan","kok":"alınan"},{"ornek":"toplamına","kok":"toplam"},{"ornek":"sağlama","kok":"sağlam"},{"ornek":"içinde","kok":"içinde"}],"konuGiris":{"harita":"Ne zaman test edilir: safha maliyet sisteminde birim akışının fiziksel olarak doğrulanması gerektiğinde. Nasıl ölçülür: dönem başı stok + üretime giren = üretimden çıkan + dönem sonu stok eşitliği ile hesaplanır. Nasıl kaydedilir: miktar sağlama tablosunda giren ve çıkan miktarlar iki ayrı sütunda toplamları eşit olacak şekilde gösterilir.","desen":"Bu konu tek evreli işletmelerde giren-çıkan denkliği kurdurarak sorulur; tuzak, dönem başı ve dönem sonu stokların hangi tarafa yazılacağının karıştırılmasıdır. Öğrenci genelde eşitliği ters kurup üretime alınanı çıkan miktardan büyük ya da küçük hesaplayabilir. Bu soru miktar sağlama tablosunun temel denklik mantığı noktasından geliyor (p.28, çıkmış arşivde 1 dönem).","terimler":[{"kaynak":"soruda verilir","tanim":"Önceki dönemden devreden, dönem başında henüz tamamlanmamış üretim miktarı","ad":"Dönem başı yarı mamul stoku","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Dönem sonunda henüz tamamlanmamış, bir sonraki döneme devreden üretim miktarı","ad":"Dönem sonu yarı mamul stoku","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Tamamlanıp bir sonraki sürece veya sonraki hesaba aktarılan birim miktarı","ad":"Üretimden çıkan miktar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönem içinde üretim sürecine yeni başlanan birimlerin toplam sayısı","ad":"Üretime alınan miktar","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Dönem başı ve dönem sonu yarı mamul stokları ile üretimden çıkan miktar verilip dönem içinde üretime alınan miktar istenir.","panel_ornek":"Diyelim bir çamaşırhanede sabah 3 kirli çamaşır torbası vardı, akşama kalan 5 torba oldu, gün içinde yıkanıp teslim edilen torba sayısı 20 ise, gün içinde kaç torba geldiğini bulmak için 20 + 5 - 3 = 22 torba geldi dersin; miktar sağlama tam olarak bu mantıktır.","ornek":"Diyelim bir çamaşırhanede sabah 3 kirli çamaşır torbası vardı, akşama kalan 5 torba oldu, gün içinde yıkanıp teslim edilen torba sayısı 20 ise, gün içinde kaç torba geldiğini bulmak için 20 + 5 - 3 = 22 torba geldi dersin; miktar sağlama tam olarak bu mantıktır.","yontemler":"Tek yöntem vardır: dönem başı stok + üretime alınan = üretimden çıkan + dönem sonu stok denkliği kurulur; kritik nokta üretime alınanın bu denklemden çekilerek bulunmasıdır.","nedir":"Safha (evre) maliyet sisteminde miktar sağlama, bir dönemde işletmeye giren ve çıkan birimlerin fiziksel olarak eşitlendiği kontrol tablosudur. Sınav bu tabloda dönem başı/sonu stok ile üretime giren-çıkan miktarların tutarlı hesaplandığını ölçer."},"olay":"8.000 + X = 90.000 + 12.000 → X = 102.000 - 8.000 = 94.000","tuzak":{"C":{"ad":"Taraf Değiştirme Tuzağı","metin":"Dönem başı ve dönem sonu yarı mamul stoklarının denklemdeki taraflarını birbiriyle değiştirdin. Doğrusu: dönem başı üretime alınanla, dönem sonu ise üretimden çıkanla aynı tarafta toplanır."},"E":{"ad":"Stok Yok Sayma Tuzağı","metin":"Dönem başı yarı mamul stokunu denkleme hiç dahil etmeden üretimden çıkan ile dönem sonu stokunu doğrudan topladın. Doğrusu: dönem başı yarı mamul stoku eşitliğin üretime alınan tarafında mutlaka yer almalıdır."},"A":{"ad":"Ters Denklem Tuzağı","metin":"Dönem sonu yarı mamulü üretimden çıkan miktardan düşüp dönem başı yarı mamulü denkleme hiç katmadın. Doğrusu: dönem başı yarı mamul de eşitliğin sol tarafında yer alır ve üretime alınana eklenir."},"B":{"ad":"Stok Atlama Tuzağı","metin":"Dönem sonu yarı mamul stokunu unutup yalnızca dönem başı yarı mamulü üretimden çıkandan düştün. Doğrusu: eşitlik hem dönem başı hem dönem sonu yarı mamulü birlikte kapsar."}},"celdiriciYol":{"C":"90.000 + 8.000 - 12.000 = 86.000 (dönem başı ve dönem sonu stoklarının taraflarını yer değiştirme)","E":"90.000 + 12.000 = 102.000 (dönem başı yarı mamul stokunu hiç dikkate almama)","A":"90.000 - 12.000 = 78.000 (dönem başı yarı mamulü denkleme hiç katmadan ters işlem yapma)","B":"90.000 - 8.000 = 82.000 (dönem sonu yarı mamul stokunu unutma)"},"hap":"Miktar sağlama tablosunda dönem başı yarı mamul + üretime alınan miktar = üretimden çıkan miktar + dönem sonu yarı mamul eşitliği hiçbir zaman bozulmaz.","teshis":{"C":{"gercek":"Dönem başı yarı mamul üretime alınanla, dönem sonu yarı mamul ise üretimden çıkanla aynı taraftadır; yer değiştirmez.","ayirt":"Hangi stok üretime alınan tarafında, hangisi üretimden çıkan tarafında, bunu tek tek kontrol ettim mi?","paragraf":"Safha Maliyet Teorisi - Miktar Sağlama","yanilgi":"Dönem başı ve dönem sonu stoklarının denklemdeki yerini birbirine karıştırıyorsun."},"E":{"gercek":"Dönem başı yarı mamul stoku, denklemin üretime alınan tarafında bulunur ve toplamdan düşülerek üretime alınan bulunur.","ayirt":"Dönem başı stok tutarını sonuçtan düştüm mü, yoksa hiç dikkate almadan mı bıraktım?","paragraf":"Safha Maliyet Teorisi - Miktar Sağlama","yanilgi":"Dönem başında zaten var olan yarı mamulün üretime alınan miktara katkısı olmadığını düşünüyorsun."},"A":{"gercek":"Miktar sağlama eşitliği dört kalemi de barındırır: dönem başı yarı mamul + üretime alınan = üretimden çıkan + dönem sonu yarı mamul.","ayirt":"Denklemin sol ve sağ tarafında hangi dört kalem var, hepsini yazdım mı?","paragraf":"Safha Maliyet Teorisi - Miktar Sağlama","yanilgi":"Dönem başı yarı mamulün de denklemin bir parçası olduğunu unutup sadece dönem sonu ile çıkan miktarı ilişkilendiriyorsun."},"D":{"gercek":"Dönem başı yarı mamul + üretime alınan = üretimden çıkan + dönem sonu yarı mamul eşitliği bozulmadan çözülünce üretime alınan miktar 94.000 kg çıkar.","ayirt":"Denklemin dört kalemini de doğru tarafa yerleştirip işlemi tekrar kontrol ettim mi?","paragraf":"Safha Maliyet Teorisi - Miktar Sağlama","yanilgi":"Bu şıkkı eleyen öğrenci genellikle dönem başı ve dönem sonu stoklarından birini denkleme hiç almadığı için fa k madde ve malzeme giderinin %30\u0027u oranında tahmini olarak yüklemektedir. Buna göre Y siparişinin toplam üretim maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve Y siparişinin toplam üretim maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Sipariş maliyet sistemi uygulayan bir işletmede, X siparişine ait direkt ilk madde ve malzeme gideri 200.000 TL, direkt işçilik gideri 150.000 TL olarak gerçekleşmiştir. İşletme, genel üretim giderlerini direkt ilk madde ve malzeme giderinin %40\u0027ı oranında tahmini olarak yüklemektedir. Buna göre X siparişinin toplam üretim maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-30","verilenler":[{"deger":"200.000 TL","anlam":"X siparişinin ilk madde ve malzeme maliyeti, aynı zamanda genel üretim gideri oranının uygulanacağı taban","ad":"Direkt İlk Madde ve Malzeme Gideri"},{"deger":"150.000 TL","anlam":"X siparişinin işçilik maliyeti, toplam üretim maliyetine doğrudan eklenir","ad":"Direkt İşçilik Gideri"},{"deger":"%40","anlam":"Direkt ilk madde ve malzeme giderinin %40\u0027ı tahmini genel üretim gideri olarak yüklenir","ad":"Genel Üretim Gideri Oranı"}],"dayanak":"Muhasebe Sistemi Uygulama Genel Tebliği (Sıra No:2), Satışların Maliyeti Tablosu - Mamul Stoklarında Değişim paragrafı","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Direkt İlk Madde ve Malzeme Gideri 200.000 TL (soruda verilen); Direkt İşçilik Gideri 150.000 TL (soruda verilen); Genel Üretim Gideri oranı %40 (soruda verilen)","anlatim":"Soru bize şunları vermiş: direkt ilk madde malzeme gideri, direkt işçilik gideri ve genel üretim gideri oranı. Bunları biz bulmadık, soru direkt söyledi.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Genel Üretim Gideri = Direkt İlk Madde ve Malzeme Gideri × %40 = 200.000 (soruda verilen) × %40 = 80.000 TL","anlatim":"Genel Üretim Gideri nedir? Direkt olma  Çıkmış arşivde bu konu 1 dönemde soruldu, yani nadir ama net bir hesaplama sorusudur. Bu soru p.6-10 arası tebliğ maddelerindeki \u0027üretim maliyeti = direkt malzeme + direkt işçilik + genel üretim gideri\u0027 tanımından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Siparişe doğrudan yüklenen hammadde ve malzeme tutarı","ad":"Direkt ilk madde ve malzeme gideri","kim":"piyasa fiyatlar belirler"},{"kaynak":"soruda verilir","tanim":"Siparişe doğrudan yüklenen işçilik ücreti tutarı","ad":"Direkt işçilik gideri","kim":"işletme yönetimi belirler"},{"kaynak":"soruda verilir","tanim":"genel üretim gideri\u0027ün hangi orana göre tahmini yükleneceğini gösteren yüzde","ad":"Genel üretim gideri yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Direkt malzeme, direkt işçilik ve yüklenen genel üretim gideri toplamından oluşan tutar","ad":"Toplam üretim maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Direkt malzeme, direkt işçilik tutarları ve genel üretim gideri\u0027ün hangi kaleme göre yükleneceği oran olarak verilir; istenen, siparişin toplam üretim maliyetidir.","panel_ornek":"Bir arkadaşın tadilat işi alıyor: malzemeye 3.000 TL, ustaya 2.000 TL ödüyor. Ayrıca malzeme giderinin %10\u0027u kadar da elektrik-su gibi ek gideri tahmini olarak işe yüklüyor, yani 300 TL daha ekliyor. Toplamda işin maliyeti 5.300 TL oluyor.","ornek":"Bir arkadaşın tadilat işi alıyor: malzemeye 3.000 TL, ustaya 2.000 TL ödüyor. Ayrıca malzeme giderinin %10\u0027u kadar da elektrik-su gibi ek gideri tahmini olarak işe yüklüyor, yani 300 TL daha ekliyor. Toplamda işin maliyeti 5.300 TL oluyor.","yontemler":"Tek yöntem geçerlidir: genel üretim gideri, belirtilen oran hangi gidere bağlıysa yalnız ona uygulanır, sonra üç kalem toplanır.","nedir":"Sipariş maliyet sistemi, her siparişin maliyetini ayrı ayrı izleyen bir üretim maliyeti yöntemidir. Sınav, direkt malzeme, direkt işçilik ve tahmini genel üretim g
