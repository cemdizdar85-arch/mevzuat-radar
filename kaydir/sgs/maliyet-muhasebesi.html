ilmiştir. Buna göre, Kesim\u0027e yüklenecek genel üretim giderinin birim başına tutarı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-04","verilenler":[{"deger":"38.000 TL","anlam":"Bakım-Onarım yardımcı gider yerinin dağıtıma esas kendi tahakkuk eden gideri; denklemin sabit terimidir.","ad":"Bakım-Onarım kendi gideri"},{"deger":"55.000 TL","anlam":"Enerji yardımcı gider yerinin dağıtıma esas kendi tahakkuk eden gideri; denklemin sabit terimidir.","ad":"Enerji kendi gideri"},{"deger":"%10 Enerji, %60 Kesim, %30 Montaj","anlam":"Bakım-Onarım\u0027ın düzeltilmiş toplamının hangi oranda diğer yerlere aktarılacağını gösterir.","ad":"Bakım-Onarım dağıtım oranları"},{"deger":"%20 Bakım-Onarım, %55 Kesim, %25 Montaj","anlam":"Enerji\u0027nin düzeltilmiş toplamının hangi oranda diğer yerlere aktarılacağını gösterir.","ad":"Enerji dağıtım oranları"},{"deger":"300 birim","anlam":"Kesim\u0027e yüklenen toplam genel üretim giderinin bölüneceği üretim adedi; birim maliyeti verir.","ad":"Kesim üretim miktarı"}],"dayanak":"Tekdüzen Hesap Planı 730 Genel Üretim Giderleri hesabı; karşılıklı (matematiksel) dağıtım tekniği (maliyet muhasebesi tekniği, mevzuat maddesi yok)","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Bakım-Onarım kendi gideri 38.000 TL (soruda verilen); Enerji kendi gideri 55.000 TL (soruda verilen); Bakım oranları %10 Enerji, %60 Kesim, %30 Montaj (soruda verilen); Enerji oranları %20 Bakım, %55 Kesim, %25 Montaj (soruda verilen); Kesim üretim miktarı 300 birim (soruda verilen)","anlatim":"Soru bize şunları vermiş: Bakım-Onarım\u0027ın kendi gideri 38.000 TL, dağıtım oranları %10 Enerji, %60 Kesim, %30 Montaj. Enerji\u0027nin kendi gideri 55.000 TL, dağıtım oranları %20 Bakım-Onarım, %55 Kesim, %25 Montaj; Kesim\u0027de 300 birim üretilmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"İlişki: Bakım →%20→ Enerji; Enerji →%10→ Bakım. Denklem: Bakım toplamı = kendi gideri + Enerji toplamının %20\u0027si; Enerji toplamı = kendi gideri + Bakım toplamının %10\u0027u","anlatim":"Bakım-Onarım ile Enerji birbirine hizmet veriyor, bu yüzden ikisinin toplamını aynı anda çözmemiz gerekiyor. Bu tür karşılıklı dağıtımda denklem kurup çözeriz.","doldur":[]},{"formul":"Sabit kısım = 38.000 (soruda verilen) + 55.000 (soruda verilen) × %20 = 38.000 + 11.000 = 49.000","anlatim":"Önce Bakım denklemindeki sabit kısmı hesaplıyoruz, yani Enerji\u0027nin henüz bilinmeyen toplamı yerine onun kendi giderini koyuyoruz. Bu bize denklemin başlangıç değerini verir.","doldur":[]},{"formul":"Döngü oranı = %20 × %10 = %2, yani Bakım toplamının %2\u0027si kendine dönüyor","anlatim":"Şimdi döngü payını buluyoruz - Bakım\u0027ın kendi toplamının bir kısmı Enerji üzerinden yine kendisine dönüyor. Bu yüzden toplamın tamamını değil, kalan kısmını çözeceğiz.","doldur":[]},{"formul":"Bakım-Onarım toplamı = 49.000 (3. adımda bulduk) / %98 = 50.000","anlatim":"Kalan %98\u0027lik kısım 49.000 TL\u0027ye eşit olduğuna göre, toplamı bulmak için bunu %98\u0027e böleriz. Bu bize Bakım-Onarım\u0027ın düzeltilmiş toplam maliyetini verir.","doldur":[[7,1]]},{"formul":"Enerji toplamı = 55.000 (soruda verilen) + 50.000 (5. adımda bulduk) × %10 = 55.000 + 5.000 = 60.000","anlatim":"Bakım-Onarım\u0027ın toplamını bulduğumuza göre artık Enerji\u0027nin toplamını da doğrudan hesaplayabiliriz. Enerji denklemine bu sayıyı yerine koyuyoruz.","doldur":[[8,1]]},{"formul":"Bakım-Onarım\u0027dan Kesim\u0027e pay = 50.000 (5. adımda bulduk) × %60 = 30.000","anlatim":"Bakım-Onarım\u0027ın toplam maliyetinin bir kısmı Kesim\u0027e aktarılıyor, çünkü Kesim de bu yardımcı gider yerinden hizmet alıyor. Payı oranla çarparak buluyoruz.","doldur":[[9,1]]},{"formul":"Enerji\u0027den Kesim\u0027e pay = 60.000 (6. adımda bulduk) × %55 = 33.000","anlatim":"Aynı mantıkla Enerji\u0027nin toplamının Kesim\u0027e düşen kısmını hesaplıyoruz. Bu da Enerji toplamının Kesim oranıyla çarpılmasıyla bulunur.","doldur":[[10,1]]},{"formul":"Kesim\u0027e yüklenen toplam gider = 30.000 (7. adımda bulduk) + 33.000 (8. adımda bulduk) = 63.000","anlatim":"Kesim\u0027e gelen iki payı topluyoruz, çünkü Kesim hem Bakım-Onarım\u0027dan hem Enerji\u0027den gider alıyor. Bu bize Kesim\u0027in toplam yüklenen genel üretim giderini verir.","doldur":[[11,1]]},{"formul":"Birim başına genel üretim gideri = 63.000 (9. adımda bulduk) / 300 (soruda verilen) = 210 TL","anlatim":"Toplam gideri üretilen birim sayısına bölerek birim başına düşen tutarı buluyoruz. Bu, sorunun asıl istediği sonuçtur.","doldur":[[12,1]]},{"formul":"Sağlama: Bakım-Onarım toplamı = 38.000 (soruda verilen) + 60.000 (6. adımda bulduk) × %20 = 38.000 + 12.000 = 50.000 ✓","anlatim":"Sonucu kontrol etmek için ters yönden gidip Bakım-Onarım toplamını Enerji üzerinden yeniden hesaplıyoruz. İki yönden de aynı sayıya ulaşırsak çözüm doğrudur.","doldur":[]},{"formul":"Yanlış yol: 38.000 × %60 = 22.800 (HATALI) → doğrusu 30.000 (7. adımda bulduk)","anlatim":"En sık hata: öğrenciler Bakım ve Enerji\u0027nin kendi giderlerini toplam sanıp direkt oranla çarpıyor, karşılıklı etkiyi hesaba katmıyor. Bu yüzden denklemi çözmeden 38.000×%60 gibi işlem yapmak yanlış sonuç verir.","doldur":[]}],"anahtar":[{"ornek":"toplamlarından","kok":"toplam"},{"ornek":"enerji","kok":"enerji"},{"ornek":"onarım","kok":"onarım"},{"ornek":"gideri","kok":"gideri"},{"ornek":"denklem","kok":"denkle"},{"ornek":"oranla","kok":"oranla"},{"ornek":"210","kok":"210"}],"konuGiris":{"harita":"Ne zaman test edilir: yardımcı gider yerleri birbirine karşılıklı hizmet verdiğinde. Nasıl ölçülür: her yardımcı yer için denklem kurulup toplam düzeltilmiş maliyet bulunarak. Nasıl kaydedilir: bulunan toplam tutar, hizmet oranlarına göre esas üretim yerlerine dağıtılıp birim sayısına bölünerek.","desen":"Sorular genelde iki yardımcı gider yerinin birbirine karşılıklı hizmet verdiği ve denklem kurulması gereken kurgudadır (p.çıkmış arşiv). Tuzak, tek yönlü kademeli dağıtım gibi düşünüp denklemi kurmadan doğrudan yüzde uygulamaktır. Bu soru matematiksel dağıtımın denklem çözümü noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Gider yerinin dağıtımdan önceki asıl tutarı","ad":"Kendi gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Bir gider yerinin diğerine verdiği hizmet yüzdesi","ad":"Hizmet oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Karşılıklı denklem çözümüyle bulunan gerçek toplam gider tutarı","ad":"Düzeltilmiş (toplam) maliyet","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Esas yere yüklenen toplam giderin üretilen birime bölünmüş hali","ad":"Birim başına genel üretim gideri","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Yardımcı gider yerlerinin kendi giderleri ve birbirine dağıtım oranları verilir, esas yere yüklenecek birim başına tutar istenir.","panel_ornek":"İki arkadaş birbirine borç veriyor: sen bana 200 TL borçlusun, ben sana 100 TL. Gerçek bakiyeyi bulmak için ikisini birlikte hesaba katman gerekir, tek yönlü düşünürsen yanlış çıkar.","ornek":"İki arkadaş birbirine borç veriyor: sen bana 200 TL borçlusun, ben sana 100 TL. Gerçek bakiyeyi bulmak için ikisini birlikte hesaba katman gerekir, tek yönlü düşünürsen yanlış çıkar.","yontemler":"İki bilinmeyenli denklem kurulup Bakım-Onarım ve Enerji\u0027nin düzeltilmiş toplam maliyetleri bulunur; en kritik kural her denklemin diğerinin düzeltilmiş tutarını içermesidir.","nedir":"Genel üretim gideri dağıtımı, yardımcı gider yerlerindeki giderlerin esas üretim yerlerine paylaştırılmasıdır. Sınav, karşılıklı hizmet veren yerlerin denklemle çözülen doğru maliyetini ölçer."},"olay":"B=38.000+0,20E, E=55.000+0,10B çözülür → B=50.000, E=60.000; Kesim payı: 50.000×0,60=30.000, 60.000×0,55=33.000; toplam=63.000; 63.000/300=210.","tuzak":{"C":{"ad":"Gider Yeri Karıştırma Tuzağı","metin":"Bakım-Onarım\u0027ın Kesim için ayrılan %60 oranı yerine Montaj için ayrılan %30 oranını kullandın. Doğrusu: her yardımcı yerin oranı, ilgili esas üretim yerine göre ayrı ayrı uygulanır."},"E":{"ad":"Kapsam Genişletme Tuzağı","metin":"Montaj\u0027a ayrılan payları (50.000×0,30 ve 60.000×0,25) da yanlışlıkla Kesim\u0027in toplamına dahil ettin. Doğrusu: Kesim\u0027e yalnızca Kesim için ayrılan oranlarla hesaplanan paylar yüklenir."},"A":{"ad":"Bakım-Onarım Tuzağı","metin":"yalnızca Bakım-Onarım\u0027ın Kesim\u0027e ayırdığı payı (30.000/300) dikkate alıp Enerji\u0027nin payını hiç hesaba katmadın. Doğrusu: Kesim\u0027e yüklenen gider, iki yardımcı yerden gelen paylerin toplamıdır."},"B":{"ad":"Enerji Tuzağı","metin":"yalnızca Enerji\u0027nin Kesim\u0027e ayırdığı payı (33.000/300) dikkate alıp Bakım-Onarım\u0027ın payını atladın. Doğrusu: her iki yardımcı gider yerinin Kesim\u0027e verdiği pay toplanmalıdır."}},"celdiriciYol":{"C":"50.000×0,30=15.000 (Montaj oranını kullandın); 15.000+33.000=48.000; 48.000/300=160 (Bakım-Onarım\u0027ın Kesim yerine Montaj oranını kullandın)","E":"63.000+(50.000×0,30+60.000×0,25)=63.000+15.000+15.000=93.000; 93.000/300=310 (Montaj\u0027a giden payı da Kesim\u0027e dahil ettin)","A":"50.000×0,60=30.000; 30.000/300=100 (yalnızca Bakım-Onarım payını dikkate aldın, Enerji payını unuttun)","B":"60.000×0,55=33.000; 33.000/300=110 (yalnızca Enerji payını dikkate aldın, Bakım-Onarım payını unuttun)"},"hap":"Matematiksel (karşılıklı) dağıtımda esas üretim yerine yüklenecek genel üretim gideri, o yeri besleyen TÜM yardımcı gider yerlerinin düzeltilmiş toplamlarından gelen payların toplamıdır.","teshis":{"C":{"gercek":"Her yardımcı gider yerinin dağıtım oranı, ilgili esas üretim yerine özgüdür; Kesim için Bakım-Onarım\u0027ın %60 oranı kullanılmalıdır, Montaj\u0027ınki değil.","ayirt":"Kullandığım yüzde gerçekten KESİM için mi tanımlanmış?","paragraf":"Karşılıklı dağıtım tekniği - dağıtım oranı tanımı","yanilgi":"Bir yardımcı yerin oranlarını hangi esas yere ait olduğunu karıştırıp yanlış yüzdeyi uyguluyorsun."},"E":{"gercek":"Her esas üretim yerine yalnızca kendisine ayrılan oranla hesaplanan pay yüklenir; Montaj\u0027a giden pay Kesim\u0027in maliyetine girmez.","ayirt":"Bu pay gerçekten Kesim\u0027e mi ayrılmış, yoksa başka esas yere mi?","paragraf":"Karşılıklı dağıtım tekniği - esas yere pay ayırma kuralı","yanilgi":"Kesim\u0027e ayrılmayan payları da onun maliyetine dahil edilebileceğini düşünüyorsun."},"A":{"gercek":"Matematiksel dağıtımda esas üretim yerine, kendisine hizmet veren TÜM yardımcı gider yerlerinden pay gelir; tek birinin payı yeterli değildir.","ayirt":"Kesim\u0027e katkısı olan yardımcı gider yerlerinin HEPSİNİ topladım mı?","paragraf":"Karşılıklı dağıtım tekniği - THP 730","yanilgi":"Kesim\u0027e giden yükün yalnızca bir yardımcı gider yerinden geldiğini sanıyorsun."},"D":{"gercek":"Matematiksel (karşılıklı) dağıtımda önce iki bilinmeyenli denklem sistemi çözülüp yardımcı yerlerin DÜZELTİLMİŞ toplam maliyetleri bulunur, ancak bu toplamlar esas yerlere dağıtılır.","ayirt":"Denklem sistemini çözüp düzeltilmiş toplamları buldum mu?","paragraf":"Matematiksel (karşılıklı) dağıtım tekniği","yanilgi":"Denklem sistemini çözmeden, yardımcı yerlerin kendi giderlerini doğrudan oranlarla çarpmanın yeterli olacağını sanıyorsun."},"B":{"gercek":"İki yardımcı yerin de Kesim\u0027e verdiği pay ayrı ayrı hesaplanıp toplanmalıdır.","ayirt":"İki yardımcı gider yerinin payını da topladım mı?","paragraf":"Karşılıklı dağıtım tekniği - THP 730","yanilgi":"Enerji\u0027nin payını yeterli görüp Bakım-Onarım\u0027ın katkısını unutuyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":7,"hesaplar":{"100":{"ad":"Kasa","tanim":"Bu hesap, işletmenin elinde bulunan ulusal ve yabancı paraların TL. karşılığının izlenmesi için kullanılır. İşleyişi : Tahsil olunan para tutarları borç, ödemeler ve bankaya yatırılan para tutarları alacak kaydedilir. Hesap daima borç bakiyesi verir veya sıfır olur. Hiçbir şekilde alacak bakiyesi vermez."},"110":{"ad":"HİSSE SENETLERİ","tanim":"Geçici olarak, elde tutulan hisse senetleri bu hesapta izlenir. Menkul Kıymetler Hesaplarının İşleyişi: Menkul kıymetler edinildiğinde alış bedeli üzerinden yukarıdaki hesaplara borç, elden çıkartıldığında ise, aynı bedel ile alacak kaydedilir."}}},{"capa":{"kaynak":"SGS 2025/2 Soru 62"},"kural":"yan mamulün net gerçekleşebilir değeri ortak maliyetten düşülür, kalan esas maliyet ayrılma noktası satış değerlerine göre dağıtılır, ayrılma sonrası ek işleme maliyeti eklenir ve nihai satış fiyatından birim maliyet düşülerek brüt kâr bulunur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 62","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ortak maliyet sorularında dört katmanı (yan mamul düşümü, dağıtım oranı, ek işleme eklemesi, birim/kâr hesabı) sırayla tek tek işaretleyerek ilerle, hiçbirini atlama.","konu":"ortak ürün maliyet dağıtımı","tablo":{"satirlar":[["VERİLENLER","-"],["Ortak maliyet toplamı","600.000 TL"],["A Mamulü üretim miktarı","5.000 birim"],["A Mamulü ayrılma noktası birim satış değeri","80 TL"],["B Mamulü üretim miktarı","5.000 birim"],["B Mamulü ayrılma noktası birim satış değeri","40 TL"],["B Mamulü ek işleme maliyeti","50.000 TL"],["B Mamulü nihai birim satış fiyatı","54 TL"],["C Yan Mamulü üretim miktarı","2.000 birim"],["C Yan Mamulü birim satış değeri","30 TL"],["C Yan Mamulü satılabilir hale getirme ek maliyeti","30.000 TL"],["HESAP","-"],["C Yan Mamulü satış değeri (2.000×30)","60.000"],["C Yan Mamulü net gerçekleşebilir değeri (60.000-30.000)","30.000"],["Dağıtıma esas ortak maliyet (600.000-30.000)","570.000"],["A Mamulü satış değeri (5.000×80)","400.000"],["B Mamulü satış değeri (5.000×40)","200.000"],["Toplam satış değeri (A+B)","600.000"],["B Mamulü ortak maliyet payı (570.000×200.000/600.000)","190.000"],["B Mamulü toplam maliyeti (190.000+50.000)","240.000"],["B Mamulü birim maliyeti (240.000/5.000)","48"],["B Mamulü birim brüt kârı (54-48)","6"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"6","E":"16","A":"2","D":"8","B":"4"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["S Yan Mamulü satış değeri (1.000×50)","50.000"],["S Yan Mamulü net gerçekleşebilir değeri (50.000-30.000)","20.000"],["Dağıtıma esas ortak maliyet (500.000-20.000)","480.000"],["P Mamulü satış değeri (5.000×90)","450.000"],["R Mamulü satış değeri (5.000×30)","150.000"],["Toplam satış değeri (P+R)","600.000"],["P Mamulü ortak maliyet payı (480.000×450.000/600.000)","360.000"],["P Mamulü birim maliyeti (360.000/5.000)","72"],["P Mamulü birim brüt kârı (90-72)","18"]]},"tur":"tablo","soru":"Bir gıda işletmesinde ortak üretim sürecinden P, R mamulleri ile S yan mamulü elde edilmektedir. İşletme ortak maliyeti, mamullerin ayrılma noktasındaki satış değerine göre dağıtmakta, yan mamulün net gerçekleşebilir değerini ortak maliyetten düşmektedir. Ortak maliyet toplamı 500.000 TL\u0027dir. P Mamulü: 5.000 birim, ayrılma noktası birim satış değeri 90 TL. R Mamulü: 5.000 birim, ayrılma noktası birim satış değeri 30 TL; ayrılma sonrası 40.000 TL ek işleme maliyetine katlanılıp birim 46 TL\u0027den satılmaktadır. S Yan Mamulü: 1.000 birim, birim satış değeri 50 TL, satılabilir hale getirme ek maliyeti toplam 30.000 TL\u0027dir. Buna göre, P Mamulünün birim brüt kârı kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve P Mamulünün birim brüt kârının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir gıda işletmesinde ortak üretim sürecinden A, B mamulleri ile C yan mamulü elde edilmektedir. İşletme ortak maliyeti, mamullerin ayrılma noktasındaki satış değerine göre dağıtmakta, yan mamulün net gerçekleşebilir değerini ortak maliyetten düşmektedir. Ortak maliyet toplamı 600.000 TL\u0027dir. A Mamulü: 5.000 birim, ayrılma noktası birim satış değeri 80 TL. B Mamulü: 5.000 birim, ayrılma noktası birim satış değeri 40 TL; ayrılma sonrası 50.000 TL ek işleme maliyetine katlanılıp birim 54 TL\u0027den satılmaktadır. C Yan Mamulü: 2.000 birim, birim satış değeri 30 TL; satılabilir hale getirme ek maliyeti toplam 30.000 TL\u0027dir. Buna göre, B Mamulünün birim brüt kârı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-06","verilenler":[{"deger":"600.000 TL","anlam":"A, B ve C mamullerine ayrılma noktasına kadar oluşan, dağıtılacak toplam birleşik maliyettir.","ad":"Ortak maliyet toplamı"},{"deger":"5.000 birim","anlam":"A\u0027nın satış değerini hesaplamak için kullanılan miktardır.","ad":"A Mamulü üretim miktarı"},{"deger":"80 TL","anlam":"A\u0027nın toplam satış değerini bulmakta kullanılır, dağıtım oranının paydasına girer.","ad":"A Mamulü ayrılma noktası birim satış değeri"},{"deger":"5.000 birim","anlam":"B\u0027nin satış değeri ve birim maliyetinin bulunmasında kullanılır.","ad":"B Mamulü üretim miktarı"},{"deger":"40 TL","anlam":"B\u0027nin toplam satış değerini bulmakta kullanılır, dağıtım oranında yer alır.","ad":"B Mamulü ayrılma noktası birim satış değeri"},{"deger":"50.000 TL","anlam":"Ayrılma sonrası B\u0027ye doğrudan yüklenen, dağıtıma esas maliyete eklenen ek işleme tutarıdır.","ad":"B Mamulü ek işleme maliyeti"},{"deger":"54 TL","anlam":"Brüt kârın hesaplanmasında birim maliyetten çıkarılacak nihai satış fiyatıdır.","ad":"B Mamulü nihai birim satış fiyatı"},{"deger":"2.000 birim","anlam":"C\u0027nin satış değerinin hesaplanmasında kullanılır.","ad":"C Yan Mamulü üretim miktarı"},{"deger":"30 TL","anlam":"C\u0027nin toplam satış değerini bulmakta kullanılır.","ad":"C Yan Mamulü birim satış değeri"},{"deger":"30.000 TL","anlam":"Net gerçekleşebilir değeri bulmak için C\u0027nin satış değerinden düşülen tutardır.","ad":"C Yan Mamulü satılabilir hale getirme ek maliyeti"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.275; ortak (birleşik) maliyet dağıtımı ve net gerçekleşebilir değer yöntemi - maliyet muhasebesi teorisi","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Ortak maliyet 600.000 TL (soruda verilen); A 5.000 birim, 80 TL/birim (soruda verilen); B 5.000 birim, 40 TL/birim, ek işleme 50.000 TL, satış 54 TL (soruda verilen); C 2.000 birim, 30 TL/birim, ek maliyet 30.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: ortak maliyet 600.000 TL, A 5.000 birim×80 TL, B 5.000 birim×40 TL (ek işleme 50.000, satış 54 TL), C 2.000 birim×30 TL (ek maliyet 30.000). Yan mamulün net gerçekleşebilir değeri ortak maliyetten düşülüyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1]]},{"formul":"C satış değeri = birim × miktar = 30 (soruda verilen) × 2.000 (soruda verilen) = 60.000 TL","anlatim":"C yan mamulünün ayrılma noktasındaki satış değerini buluyoruz. Bunu birim fiyatla birim sayısını çarparak buluruz.","doldur":[[12,1]]},{"formul":"C net gerçekleşebilir değer = satış değeri - ek maliyet = 60.000 (2. adımda bulduk) - 30.000 (soruda verilen) = 30.000 TL","anlatim":"Yan mamulün net gerçekleşebilir değeri, satış değerinden ek maliyetin düşülmesiyle bulunur. Bu değer ortak maliyetten çıkarılacak.","doldur":[[13,1]]},{"formul":"Dağıtıma esas ortak maliyet = ortak maliyet - C net gerçekleşebilir değer = 600.000 (soruda verilen) - 30.000 (3. adımda bulduk) = 570.000 TL","anlatim":"Yan mamulün net gerçekleşebilir değeri ortak maliyetten düşülür, kalan tutar A ve B\u0027ye dağıtılır. Yan mamul üretim maliyetine dahil değil, düşülen bir kalemdir.","doldur":[[14,1]]},{"formul":"A satış değeri = birim × miktar = 80 (soruda verilen) × 5.000 (soruda verilen) = 400.000 TL","anlatim":"A Mamulünün ayrılma noktasındaki satış değerini buluyoruz. Dağıtım oranı bu değere göre hesaplanacak.","doldur":[[15,1]]},{"formul":"B satış değeri = birim × miktar = 40 (soruda verilen) × 5.000 (soruda verilen) = 200.000 TL","anlatim":"B Mamulünün ayrılma noktasındaki satış değerini buluyoruz. Ek işleme maliyeti henüz bu değere dahil değil.","doldur":[[16,1]]},{"formul":"Toplam satış değeri = A satış değeri + B satış değeri = 400.000 (5. adımda bulduk) + 200.000 (6. adımda bulduk) = 600.000 TL","anlatim":"A ve B\u0027nin satış değerlerini topluyoruz, dağıtım oranını bu toplama göre kuracağız. C zaten hesaptan çıkmıştı.","doldur":[[17,1]]},{"formul":"B ortak maliyet payı = dağıtıma esas maliyet × (B satış değeri / toplam satış değeri) = 570.000 (4. adımda bulduk) × (200.000 (6. adımda bulduk) / 600.000 (7. adımda bulduk)) = 190.000 TL","anlatim":"B\u0027nin payını, toplam satış değeri içindeki oranına göre dağıtıma esas maliyetten alıyoruz. Bu yöntem satış değeri yöntemidir.","doldur":[[18,1]]},{"formul":"B toplam maliyeti = ortak maliyet payı + ek işleme maliyeti = 190.000 (8. adımda bulduk) + 50.000 (soruda verilen) = 240.000 TL","anlatim":"B ayrıldıktan sonra ek işleme görüyor, bu maliyeti kendi payına ekliyoruz. Ek işleme maliyeti sadece B\u0027ye aittir.","doldur":[[19,1]]},{"formul":"B birim maliyeti = toplam maliyet / miktar = 240.000 (9. adımda bulduk) / 5.000 (soruda verilen) = 48 TL","anlatim":"Toplam maliyeti birim sayısına bölerek B\u0027nin birim maliyetini buluyoruz. Brüt kâr için birim maliyet gerekiyor.","doldur":[[20,1]]},{"formul":"B birim brüt kârı = satış fiyatı - birim maliyet = 54 (soruda verilen) - 48 (10. adımda bulduk) = 6 TL","anlatim":"Birim satış fiyatından birim maliyeti düşerek birim brüt kârı buluyoruz. Sonuç 6 TL çıkıyor.","doldur":[[21,1]]},{"formul":"Ters durum: satış fiyatı \u003c birim maliyet → brüt zarar (negatif sonuç)","anlatim":"Ters durumda B\u0027nin satış fiyatı birim maliyetin altında kalsaydı, brüt kâr negatif çıkar, yani brüt zarar oluşurdu.","doldur":[]},{"formul":"Yanlış yol: B payı = 600.000 × (200.000/600.000) = 200.000 (HATALI) → doğrusu 190.000 (8. adımda bulduk)","anlatim":"En sık hata, C\u0027nin net gerçekleşebilir değerini düşmeden dağıtıma esas maliyeti 600.000 TL almaktır. Bu, B\u0027nin payını ve dolayısıyla birim maliyetini yanlış büyütür.","doldur":[]}],"anahtar":[{"ornek":"maliyet","kok":"maliye"},{"ornek":"değeri","kok":"değeri"},{"ornek":"mamulün","kok":"mamulü"},{"ornek":"dağıtımında","kok":"dağıtı"},{"ornek":"işleme","kok":"işleme"},{"ornek":"ayrılma","kok":"ayrılm"}],"konuGiris":{"harita":"Ne zaman test edilir: ayrılma noktasından önceki ortak maliyet mamullere paylaştırılırken test edilir. Nasıl ölçülür: seçilen dağıtım anahtarına (satış değeri, fiziki miktar, NGD) göre oranlanarak ölçülür. Nasıl kaydedilir: her mamulün payına düşen ortak maliyet, o mamulün birim maliyetine eklenip ek işleme maliyeti varsa üzerine eklenerek kaydedilir.","desen":"Bu tip sorularda öğrenciler önce yan mamulün NGD\u0027sini ortak maliyetten düşmeyi unutur, doğrudan tüm 600.000\u0027i A ve B\u0027ye dağıtır. İkinci tuzak, B\u0027nin ek işleme maliyetinin ortak maliyet dağıtımına değil doğrudan B\u0027nin kendi maliyetine eklenmesi gerektiğinin atlanmasıdır. Bu soru ortak maliyet dağıtımı ve yan mamul düşümü noktasından geliyor (p.28, 3 dönemde çıkmış).","terimler":[{"kaynak":"soruda verilir","tanim":"Ortak üretimin bittiği, mamullerin birbirinden ayrıldığı nokta","ad":"Ayrılma noktası","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Ortak maliyetin ayrılma noktasındaki satış değerleri oranında dağıtılması","ad":"Satış değeri yöntemi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Yan mamulün nihai satış değerinden ek işleme maliyetinin düşülmesiyle bulunan değer","ad":"Net gerçekleşebilir değer","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Birim satış fiyatından birim toplam maliyetin düşülmesiyle kalan tutar","ad":"Birim brüt kâr","kim":"piyasa fiyatlar"}],"sinavda":"Ortak maliyet, mamul miktarları, ayrılma noktası satış değerleri ve ek işleme maliyetleri verilip belirli bir mamulün birim brüt kârı istenir.","panel_ornek":"Annen pazardan 90 TL\u0027ye aldığı büyük bir karpuzu kesip komşularla paylaşıyor; herkes aldığı dilimin büyüklüğüne göre para veriyor. Küçük bir dilimi de bedava veriyor çünkü değeri çok az. İşte \u0027ortak maliyeti değere göre paylaştırma, değersiz parçayı hariç tutma\u0027 mantığı budur.","ornek":"Annen pazardan 90 TL\u0027ye aldığı büyük bir karpuzu kesip komşularla paylaşıyor; herkes aldığı dilimin büyüklüğüne göre para veriyor. Küçük bir dilimi de bedava veriyor çünkü değeri çok az. İşte \u0027ortak maliyeti değere göre paylaştırma, değersiz parçayı hariç tutma\u0027 mantığı budur.","yontemler":"Önce yan mamulün NGD\u0027si (satış değeri − ek maliyet) ortak maliyetten düşülür, kalan tutar A ve B\u0027ye ayrılma noktası satış değerleri oranında dağıtılır; B\u0027nin toplam maliyetine kendi ek işleme maliyeti eklenip birim maliyet bulunur, satış fiyatından çıkarılarak birim brüt kâr hesaplanır.","nedir":"Ortak üretim sürecinde tek bir maliyetten birden çok mamul çıktığında, bu ortak maliyetin mamuller arasında paylaştırılması yöntemidir. Sınav, hangi tutarın dağıtıma girdiğini ve hangi tutarın ürüne doğrudan yüklendiğini ayırt edebilmeni ölçer."},"olay":"C\u0027nin net gerçekleşebilir değeri 60.000-30.000=30.000 TL, dağıtıma esas maliyet 600.000-30.000=570.000 TL, toplam satış değeri 400.000+200.000=600.000 TL, B payı 570.000×200.000/600.000=190.000 TL, B toplam maliyeti 190.000+50.000=240.000 TL, birim maliyeti 240.000/5.000=48 TL.","tuzak":{"D":{"ad":"Ölçüm Hatası Tuzağı","metin":"Öğrenci yan mamulün ek maliyetini düşmeden satış değerinin tamamını (60.000 TL) ortak maliyetten çıkarmış; esas maliyet 540.000 TL, B payı 540.000×200.000/600.000=180.000, ek maliyetle 230.000 TL toplam, birim 46 TL bulmuş. Doğrusu: net gerçekleşebilir değer, satış değerinden satılabilir hale getirme maliyeti düşülerek bulunur."},"E":{"ad":"Katman Atlama Tuzağı","metin":"Öğrenci ayrılma noktası payını (190.000 TL) doğrudan birim maliyet gibi kullanmış, 50.000 TL\u0027lik ek işleme maliyetini eklemeyi unutmuş; birim maliyeti 38 TL, kârı 16 TL bulmuş. Doğrusu: ayrılma sonrası ek işleme maliyeti mamul maliyetine mutlaka eklenir."},"A":{"ad":"Yön Hatası Tuzağı","metin":"Öğrenci yan mamulün net gerçekleşebilir değerini ortak maliyetten düşmek yerine ortak maliyete eklemiş, esas maliyeti 630.000 TL almış; 630.000×200.000/600.000=210.000 payı bulup 50.000 TL ek maliyetle 260.000 TL toplam, birim maliyeti 52 TL çıkarmış. Doğrusu: net gerçekleşebilir değer ortak maliyetten düşülür, eklenmez."},"B":{"ad":"Kapsam Atlama Tuzağı","metin":"Öğrenci yan mamulün net gerçekleşebilir değerini hiç dikkate almadan 600.000 TL\u0027nin tamamını A ve B\u0027ye dağıtmış; B payı 600.000×200.000/600.000=200.000, ek maliyetle 250.000 TL toplam, birim 50 TL bulmuş. Doğrusu: yan mamulün net gerçekleşebilir değeri dağıtımdan önce mutlaka düşülür."}},"celdiriciYol":{"D":"540.000 × 200.000/600.000 = 180.000; 180.000+50.000=230.000; 230.000/5.000=46; 54-46 = 8 (net gerçekleşebilir değer yerine satış değerinin tamamını kullanma hatası)","E":"190.000/5.000 = 38; 54-38 = 16 (ek işleme maliyetini toplam maliyete eklememe hatası)","A":"630.000 × 200.000/600.000 = 210.000; 210.000+50.000=260.000; 260.000/5.000=52; 54-52 = 2 (net gerçekleşebilir değeri ortak maliyete ekleme hatası)","B":"600.000 × 200.000/600.000 = 200.000; 200.000+50.000=250.000; 250.000/5.000=50; 54-50 = 4 (yan mamulün net gerçekleşebilir değerini hiç düşmeme hatası)"},"hap":"Ortak maliyet dağıtımında önce yan mamulün net gerçekleşebilir değeri ortak maliyetten düşülür, kalan tutar satış değerine göre dağıtılır ve ayrılma sonrası ek işleme maliyeti mutlaka eklenir.","teshis":{"C":{"gercek":"Doğru sonuç, hem net gerçekleşebilir değer düşümünü hem ek işleme maliyetinin eklenmesini birlikte uygular.","ayirt":"Tüm katmanları (NGD düşümü, dağıtım, ek maliyet) sırayla uyguladım mı?","paragraf":"Ortak maliyet dağıtımı ve ayrılma sonrası maliyetler","yanilgi":"Dağıtım oranını doğru bulsan da ek işleme maliyetini eklemeyi gereksiz sanıp bu şıkkı elersin."},"E":{"gercek":"Ayrılma noktasından sonraki ek işleme maliyeti doğrudan ilgili mamule yüklenir ve toplam maliyete eklenir.","ayirt":"Ayrılma noktasından sonra ek bir işlem/maliyet var mı?","paragraf":"Ayrılma noktası sonrası maliyetler","yanilgi":"Ortak maliyetten alınan payı doğrudan nihai birim maliyet sanıyor, ayrılma sonrası maliyeti unutuyorsun."},"A":{"gercek":"Yan mamulün net gerçekleşebilir değeri ortak maliyetten düşülür; yan ürün ana mamullerin taşıdığı yükü hafifletir.","ayirt":"Yan mamul değeri ana mamullerin maliyetini artırır mı, azaltır mı?","paragraf":"Ortak maliyet dağıtımı teorisi","yanilgi":"Yan mamulün değerini ortak maliyeti artıran bir kalem gibi görüp ortak maliyete ekliyorsun."},"D":{"gercek":"Net gerçekleşebilir değer = satış değeri - satılabilir hale getirme (ek) maliyeti.","ayirt":"Satış değerinden ek maliyeti düştüm mü?","paragraf":"Net gerçekleşebilir değer yöntemi","yanilgi":"Net gerçekleşebilir değer ile satış değerini aynı şey sanıyor, ek maliyeti düşmeyi unutuyorsun."},"B":{"gercek":"Yan mamulün net gerçekleşebilir değeri dağıtımdan önce ortak maliyetten düşülmelidir.","ayirt":"Yan mamul için ayrı bir değer hesapladım mı?","paragraf":"Ortak maliyet dağıtımı teorisi","yanilgi":"Yan mamulün ortak maliyet üzerindeki etkisini tamamen göz ardı edip tüm tutarı ana mamullere dağıtıyorsun."}},"verilen":[[12,1],[13,1],[14,1],[15,1],[16,1],[17,1],[18,1],[19,1],[20,1],[21,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 61"},"kural":"Hacim sapması yalnız sabit giderden doğar ve (Normal Kapasite - Standart Saat Kazanılan) x Standart Sabit Oran ile bulunur; fiili faaliyet normal kapasitenin altında kalırsa sapma olumsuzdir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 61","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Sapma sorularında önce sapmanın hangi gidere (sabit/değişken) ve hangi ölçüye (fiili saat/standart saat kazanılan) dayandığını ayır, sonra formüle gir.","konu":"genel üretim gideri yükleme","tablo":{"satirlar":[["VERİLENLER","-"],["Normal kapasite","12.000 makine saati"],["Normal kapasitede sabit GUG bütçesi","48.000 TL"],["Standart değişken GUG oranı","3 TL"],["Üretilen mamul miktarı","10.500 birim"],["Birim başına standart makine saati","1 saat"],["Fiili çalışılan makine saati","11.000 saat"],["Fiili sabit GUG","50.000 TL"],["HESAP","-"],["Standart sabit genel üretim gideri oranı (48.000 / 12.000)","4 TL/saat"],["Standart saat kazanılan (10.500 birim x 1 saat)","10.500 saat"],["Kapasite farkı (12.000 - 10.500)","1.500 saat"],["Hacim (kapasite) sapması (1.500 x 4)","6.000 TL (olumsuz)"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"6.000 TL olumludur","E":"8.000 TL olumsuzdur","A":"4.000 TL olumludur","D":"6.000 TL olumsuzdur","B":"4.000 TL olumsuzdur"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Standart sabit genel üretim gideri oranı (60.000 / 15.000)","4 TL/saat"],["Standart saat kazanılan (13.000 birim x 1 saat)","13.000 saat"],["Kapasite farkı (15.000 - 13.000)","2.000 saat"],["Hacim (kapasite) sapması (2.000 x 4)","8.000 TL (olumsuz)"]]},"tur":"tablo","soru":"Marmara Metal İşletmesi, genel üretim giderlerini standart maliyet yöntemiyle izlemektedir. İşletmenin normal kapasitesi 15.000 makine saati olup bu kapasitede sabit genel üretim gideri bütçesi 60.000 TL, standart değişken genel üretim gideri oranı ise makine saati başına 2,5 TL\u0027dir. 2026 yılında üretilen 13.000 birim mamul için birim başına standart makine saati 1 saat olarak belirlenmiştir. Dönemde fiilen 13.500 makine saati çalışılmış, fiili sabit genel üretim gideri 62.000 TL olarak gerçekleşmiştir.","verilen":[],"hedef":"Tabloyu doldur ve sabit genel üretim giderlerine ilişkin hacim (kapasite) sapmasının tutarını ve yönünü bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Anadolu Döküm İşletmesi, genel üretim giderlerini standart maliyet yöntemiyle izlemektedir. İşletmenin normal kapasitesi 12.000 makine saati olup bu kapasitede sabit genel üretim gideri bütçesi 48.000 TL, standart değişken genel üretim gideri oranı ise makine saati başına 3 TL\u0027dir. 2026 yılında üretilen 10.500 birim mamul için birim başına standart makine saati 1 saat olarak belirlenmiştir. Dönemde fiilen 11.000 makine saati çalışılmış, fiili sabit genel üretim gideri 50.000 TL olarak gerçekleşmiştir. Buna göre, sabit genel üretim giderlerine ilişkin hacim (kapasite) sapmasının tutarı ve yönü aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-07","verilenler":[{"deger":"12.000 makine saati","anlam":"Sabit genel üretim giderinin dağıtıldığı planlanan tam kapasite ölçüsü; hacim sapması formülünün ilk terimidir.","ad":"Normal kapasite"},{"deger":"48.000 TL","anlam":"Standart sabit genel üretim gideri oranının bulunmasında kullanılır (48.000/12.000).","ad":"Normal kapasitede sabit GUG bütçesi"},{"deger":"3 TL","anlam":"Değişken giderle ilgilidir; hacim sapması yalnız sabit gideri ilgilendirdiği için bu soruda kullanılmaz, çeldirici verisidir.","ad":"Standart değişken GUG oranı"},{"deger":"10.500 birim","anlam":"Standart saat kazanılanın hesaplanmasında kullanılır.","ad":"Üretilen mamul miktarı"},{"deger":"1 saat","anlam":"Üretim miktarı ile çarpılarak standart saat kazanılan bulunur.","ad":"Birim başına standart makine saati"},{"deger":"11.000 saat","anlam":"Gerçekte çalışılan süredir; hacim sapmasında değil, verimlilik sapmasında kullanılır - çeldiricidir.","ad":"Fiili çalışılan makine saati"},{"deger":"50.000 TL","anlam":"Gerçekleşen sabit gider tutarıdır; harcama sapmasında kullanılır, hacim sapmasında kullanılmaz - çeldiricidir.","ad":"Fiili sabit GUG"}],"dayanak":"Tekdüzen Hesap Planı 730 Genel Üretim Giderleri Hesabı; standart maliyet genel üretim gideri sapma analizi (dört yönlü yöntem)","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Normal kapasite 12.000 saat (soruda verilen); Sabit genel üretim gideri bütçesi 48.000 TL (soruda verilen); Üretim 10.500 birim (soruda verilen); Birim standart saat 1 saat (soruda verilen); Fiili saat 11.000 (soruda verilen); Fiili sabit genel üretim gideri 50.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: normal kapasite 12.000 makine saati, bu kapasitede sabit genel üretim gideri bütçesi 48.000 TL. Ayrıca 10.500 birim üretim, birim başına 1 standart saat, fiili 11.000 saat ve fiili sabit genel üretim gideri 50.000 TL verilmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]]},{"formul":"Standart Sabit Oran = Sabit genel üretim gideri Bütçesi / Normal Kapasite = 48.000 (soruda verilen) / 12.000 (soruda verilen) = 4 TL/saat","anlatim":"Standart sabit oran, bütçedeki sabit gideri normal kapasiteye bölerek bulunur. Bu oran saat başına ne kadar sabit gider yüklendiğini gösterir.","doldur":[[9,1]]},{"formul":"Standart Saat Kazanılan = Üretim × Birim Standart Saat = 10.500 (soruda verilen) × 1 (soruda verilen) = 10.500 saat","anlatim":"Standart saat kazanılan, fiilen üretilen birimin olması gereken standart saatidir. Hacim sapması burada fiili saatle değil, bu kazanılan saatle karşılaştırma yapar.","doldur":[[10,1]]},{"formul":"Kapasite Farkı = Normal Kapasite - Standart Saat Kazanılan = 12.000 (soruda verilen) - 10.500 (2. adımda bulduk) = 1.500 saat","anlatim":"Kapasite farkı, normal kapasiteyle kazanılan standart saat arasındaki boşluktur. Fabrika olması gerekenden az çalıştığı için bu fark pozitif çıkıyor.","doldur":[[11,1]]},{"formul":"Hacim Sapması = Kapasite Farkı × Standart Sabit Oran = 1.500 (3. adımda bulduk) × 4 (1. adımda bulduk) = 6.000 TL","anlatim":"Hacim sapması, kullanılmayan kapasiteyi standart sabit oranla parasal olarak ölçer. Dikkat: bu sapma yalnız sabit gidere aittir, değişken giderle ilgisi yoktur.","doldur":[[12,1]]},{"formul":"Sonuç: Hacim (kapasite) sapması = 6.000 TL (olumsuz)","anlatim":"Fiili faaliyet normal kapasitenin altında kaldığı için sapma olumsuzdur. Kapasite boşa harcanmış demektir, işletme zarar etmiş sayılır.","doldur":[[12,1]]},{"formul":"Ters durum: Standart Saat Kazanılan \u003e Normal Kapasite olsaydı → hacim sapması olumlu olurdu","anlatim":"Ters durumda fiili saat normal kapasiteyi geçseydi durum tersine dönerdi. O zaman kapasite fazla kullanılmış olur ve sapma olumlu çıkar.","doldur":[]},{"formul":"Yanlış yol: (12.000 - 11.000) × 4 = 4.000 TL (HATALI) → doğrusu (12.000 - 10.500) × 4 = 6.000 TL (5. adımda bulduk)","anlatim":"En sık hata, hacim sapmasını fiili 11.000 saatle hesaplamaktır; ama fiili saat bu sapmada hiç kullanılmaz. Fiili saat sadece harcama (bütçe) sapmasında işe yarar.","doldur":[]}],"anahtar":[{"ornek":"kapasite","kok":"kapasi"},{"ornek":"standart","kok":"standa"},{"ornek":"normal","kok":"normal"},{"ornek":"sapması","kok":"sapmas"},{"ornek":"kazanılan","kok":"kazanı"},{"ornek":"üretim","kok":"üretim"}],"konuGiris":{"harita":"Ne zaman test edilir: fiili faaliyet normal kapasiteden farklı gerçekleştiğinde hacim sapması ortaya çıkar. Nasıl ölçülür: bütçelenen sabit gider ile standart saate göre yüklenen sabit gider karşılaştırılır. Nasıl kaydedilir: aradaki fark olumlu ya da olumsuz sapma olarak tutar ve yön belirtilerek raporlanır.","desen":"Sınav genellikle fiili saat ile standart saati karıştırıp hacim sapmasını yanlış hesaplattırır; oysa hacim sapması bütçelenen sabit gider ile yüklenen arasındaki farktır, fiili sabit gider tutarı bu hesaba girmez. Öğrenciler sıklıkla fiili genel üretim gideri tutarını kullanarak bütçe sapmasıyla hacim sapmasını karıştırır. Bu soru TEORİ - genel üretim gideri sapmaları, hacim sapması tanımı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşletmenin standart olarak öngördüğü faaliyet hacmi, makine saati cinsinden","ad":"Normal kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Sabit genel üretim gideri bütçesinin normal kapasiteye bölünmesiyle bulunan birim yükleme değeri","ad":"Standart yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Standart faaliyet hacmiyle standart yükleme oranının çarpımından bulunan tutar","ad":"Yüklenen sabit genel üretim gideri","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Bütçelenen sabit giderle yüklenen sabit gider arasındaki, kapasite kullanımından doğan fark","ad":"Hacim (kapasite) sapması","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Normal kapasite, sabit bütçe, değişken oran, standart ve fiili saatler verilip hacim sapmasının tutarı ve yönü istenir.","panel_ornek":"Bir kargo şirketi, aylık 200 paket taşıma kapasitesine göre sabit depo kirasını pakete böyle yükler. Ay içinde sadece 150 paket taşınırsa, depo kirasının bir kısmı boşa gitmiş, yani atıl kapasite oluşmuş sayılır. Kapasite tam kullanılmayınca yüklenen tutar bütçelenenden az kalır.","ornek":"Bir kargo şirketi, aylık 200 paket taşıma kapasitesine göre sabit depo kirasını pakete böyle yükler. Ay içinde sadece 150 paket taşınırsa, depo kirasının bir kısmı boşa gitmiş, yani atıl kapasite oluşmuş sayılır. Kapasite tam kullanılmayınca yüklenen tutar bütçelenenden az kalır.","yontemler":"Önce standart saatle yüklenen sabit gider bulunur, sonra bütçelenen sabit giderden çıkarılır; fark pozitifse olumsuz (atıl kapasite), negatifse olumlu sapma olur.","nedir":"Genel üretim gideri yükleme, fabrikada doğrudan hammadde ve işçilik dışındaki ortak giderlerin (elektrik, amortisman, ustabaşı maaşı gibi) ürünlere standart oranla dağıtılmasıdır. Sınav, bu yüklemenin fiili giderlerden ne kadar farklı çıktığını, yani sapmayı doğru hesaplayıp yönünü belirleyebiliyor musun ölçer."},"olay":"Standart sabit oran=48.000/12.000=4 TL/saat; Standart saat kazanılan=10.500 birim x 1 saat=10.500 saat; (12.000-10.500)x4=6.000 TL.","tuzak":{"C":{"ad":"Kapasite Yorumu Tuzağı","metin":"Doğru tutarı (6.000) bulmana rağmen fiili faaliyetin normal kapasitenin altında kalmasını olumlu sandın. Doğrusu: fiili faaliyet normal kapasitenin altında kaldığında sapma olumsuzdir (atıl kapasite)."},"E":{"ad":"Sapma Türü Karıştırma Tuzağı","metin":"Fiili sabit genel üretim giderinden bütçelenen sabit tutarı düşerek harcama ile hacim sapmasını birbirine karıştırdın. Doğrusu: hacim sapması yalnız normal kapasite ile standart saat kazanılan farkına dayanır, fiili sabit gider bu hesaba girmez."},"A":{"ad":"Fiili Saat Tuzağı","metin":"Fiili çalışılan saati (11.000) standart saat kazanılan yerine kullanıp üstüne bir de kapasite altında kalmayı yanlışlıkla olumlu sandın. Doğrusu: hacim sapmasında esas alınacak ölçü standart saat kazanılandır ve kapasite altında kalmak olumsuz sonuç verir."},"B":{"ad":"Faaliyet Ölçüsü Tuzağı","metin":"Standart saat kazanılan (10.500) yerine fiili çalışılan saati (11.000) kullandığın için doğru yönü bulsan da tutar yanlış çıkar. Doğrusu: hacim sapması standart saat kazanılan üzerinden hesaplanır."}},"celdiriciYol":{"C":"(12.000 - 10.500) x 4 = 6.000 (doğru tutarı buldun fakat kapasite altında kalmayı olumlu sapma saydın - Kapasite Yorumu Tuzağı)","E":"50.000 - (10.500 x 4) = 8.000 (fiili sabit genel üretim giderinden bütçelenen sabit tutarı düşerek harcama sapmasını hacim sapması sandın - Sapma Türü Karıştırma Tuzağı)","A":"(12.000 - 11.000) x 4 = 4.000 (fiili çalışılan saati standart saat kazanılan yerine kullandın ve kapasite altında kalmayı yanlışlıkla olumlu sapma saydın)","B":"(12.000 - 11.000) x 4 = 4.000 (fiili çalışılan saati standart saat kazanılan yerine kullandın - Fiili Saat Tuzağı)"},"hap":"Hacim (kapasite) sapması yalnız sabit genel üretim giderinden doğar ve (Normal Kapasite - Standart Saat Kazanılan) x Standart Sabit Oran ile bulunur; fiili çalışılan saat bu hesaba girmez.","teshis":{"C":{"gercek":"Fiili faaliyet normal kapasitenin altında kaldığında sabit giderler yeterince yüklenemez ve bu aleyhte (olumsuz) bir sapmadır.","ayirt":"Fiili faaliyet normal kapasitenin altında mı üstünde mi kaldı?","paragraf":"GUG sapma teorisi - kapasite kullanım yorumu","yanilgi":"Tutarı doğru bulduğun için yönü de otomatik doğru çıkarmış olacağını sanırsın."},"E":{"gercek":"Fiili sabit gider ile bütçelenen sabit gider farkı harcama sapmasıdır; hacim sapması yalnız normal kapasite ile standart saat kazanılan farkına dayanır.","ayirt":"Bu farkın içinde fiili gerçekleşen tutar mı var, yoksa yalnız kapasite ölçüleri mi var?","paragraf":"GUG sapma teorisi - harcama ve hacim sapmasının ayrımı","yanilgi":"Fiili sabit giderle bütçelenen sabit gider arasındaki farkın da hacim sapması olduğunu sanırsın."},"A":{"gercek":"Hacim sapması standart saat kazanılan ile normal kapasite arasındaki farka dayanır; fiili çalışılan saat bu hesapta yer almaz.","ayirt":"Kullandığım saat, üretimin HAK ETTİĞİ standart saat mi, yoksa fiilen çalışılan saat mi?","paragraf":"GUG sapma teorisi - dört yönlü analiz","yanilgi":"Fiili çalışılan saatin hacim sapmasında esas alınacağını ve saatin arttığı her durumu lehte sapma sandığını düşünürsün."},"D":{"gercek":"Hacim sapması yalnız sabit giderden doğar; (Normal Kapasite - Standart Saat Kazanılan) x Standart Sabit Oran formülü kullanılır ve kapasite altında kalmak aleyhte sonuç verir.","ayirt":"Bu sapma sabit gideri mi ilgilendiriyor, ölçü olarak standart saat kazanılan mı kullanılıyor?","paragraf":"THP 730 / GUG sapma teorisi - dört yönlü analiz","yanilgi":"Bu şıkkı eleyen öğrenci fiili çalışılan saatin ya da fiili sabit giderin hesaba girmesi gerektiğini düşünür."},"B":{"gercek":"Hacim sapması formülünde standart saat kazanılan yerine fiili çalışılan saat kullanılırsa tutar yanlış çıkar; ölçü seçimi tutarın doğruluğunu belirler.","ayirt":"Formüle koyduğum saat, standart mı fiili mi?","paragraf":"GUG sapma teorisi - hacim sapması formülü","yanilgi":"Doğru ölçüyü bulamasan da yönü tutturursam sorunu çözerim sanırsın."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 62"},"kural":"Fiyat sapması fiili miktarla, miktar sapması standart fiyatla hesaplanır; toplam sapmadan fiyat sapması çıkarılınca miktar sapması bulunur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 62","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Toplam sapmayı doğrudan miktar sapması sanmadan önce mutlaka fiyat sapmasını ayrı hesapla.","konu":"standart maliyet miktar sapması","tablo":{"satirlar":[["VERİLENLER","-"],["Fiili tüketim miktarı","20.500 kg"],["Fiili fiyat","53 TL/kg"],["Standart fiyat","50 TL/kg"],["Standart miktar","10 kg/mamul"],["Toplam sapma","111.500 TL olumsuz"],["HESAP","-"],["Fiyat Sapması (53-50)x20.500","61.500"],["Miktar Sapması (111.500-61.500)","50.000"],["Standart Miktar Toplamı (20.500-50.000/50)","19.500"],["Üretilen Mamul Miktarı (19.500/10)","1.950"]],"basliklar":["Kalem","Tutar/Miktar"]},"siklar":{"C":"1.950","E":"2.150","A":"1.704","D":"2.050","B":"1.827"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[2,1]],"tablo":{"basliklar":["Kalem","Tutar/Miktar"],"satirlar":[["Fiyat Sapması (33-30)x10.500","31.500"],["Miktar Sapması (61.500-31.500)","30.000"],["Standart Miktar Toplamı (10.500-30.000/30)","9.500"],["Üretilen Mamul Miktarı (9.500/5)","1.900"]]},"tur":"tablo","soru":"Standart maliyet yöntemini uygulayan bir işletmeye ait direkt ilk madde ve malzemeye ilişkin bilgiler şöyledir: Fiili tüketim miktarı 10.500 kg, fiili fiyat kilogram başına 33 TL, standart fiyat kilogram başına 30 TL, standart miktar mamul başına 5 kg\u0027dır. Döneme ait toplam sapma 61.500 TL olumsuzdur. Buna göre dönemde üretilen mamul miktarı kaç adettir?","verilen":[[0,1],[1,1],[3,1]],"hedef":"Tabloyu doldur ve dönemde üretilen mamul miktarının kaç adet olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Standart maliyet yöntemini uygulayan bir işletmeye ait direkt ilk madde ve malzemeye ilişkin bilgiler şöyledir: Fiili tüketim miktarı 20.500 kg, fiili fiyat kilogram başına 53 TL, standart fiyat kilogram başına 50 TL, standart miktar mamul başına 10 kg\u0027dır. Döneme ait toplam sapma 111.500 TL olumsuzdur. Buna göre dönemde üretilen mamul miktarı kaç adettir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-08","verilenler":[{"deger":"20.500 kg","anlam":"Dönemde gerçekten kullanılan toplam malzeme miktarı, fiyat ve miktar sapması hesabında kullanılır.","ad":"Fiili tüketim miktarı"},{"deger":"53 TL/kg","anlam":"Malzemenin gerçekleşen birim alış fiyatı, fiyat sapması hesabında kullanılır.","ad":"Fiili fiyat"},{"deger":"50 TL/kg","anlam":"Önceden belirlenen birim fiyat, miktar sapmasının değerlemesinde kullanılır.","ad":"Standart fiyat"},{"deger":"10 kg/mamul","anlam":"Bir mamul için öngörülen malzeme miktarı, standart miktar toplamından üretim miktarına geçişte kullanılır.","ad":"Standart miktar"},{"deger":"111.500 TL olumsuz","anlam":"Fiili maliyet ile standart maliyet arasındaki toplam fark, fiyat ve miktar sapmasının toplamıdır.","ad":"Toplam sapma"}],"dayanak":"Standart maliyet sapma analizi - miktar ve fiyat sapması formülü (maliyet muhasebesi genel teorisi)","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Fiili tüketim miktarı 20.500 kg (soruda verilen); Fiili fiyat 53 TL/kg (soruda verilen); Standart fiyat 50 TL/kg (soruda verilen); Standart miktar 10 kg/mamul (soruda verilen); Toplam sapma 111.500 TL olumsuz (soruda verilen)","anlatim":"Soru bize şunları vermiş: fiili tüketim, fiili fiyat, standart fiyat, standart miktar ve toplam sapma. Bunları biz bulmadık, soru direkt verdi.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"Fiyat Sapması = (Fiili Fiyat − Standart Fiyat) × Fiili Miktar = (53 (soruda verilen) − 50 (soruda verilen)) × 20.500 (soruda verilen) = 61.500 TL","anlatim":"Fiyat sapması nedir? Fiili fiyatla standart fiyat arasındaki farkın, fiili miktarla çarpılmasıdır. Fiyat farkı hep fiili miktarla hesaplanır, çünkü o kadar mal o fiyattan alınmış.","doldur":[[7,1]]},{"formul":"Miktar Sapması = Toplam Sapma − Fiyat Sapması = 111.500 (soruda verilen) − 61.500 (2. adımda bulduk) = 50.000 TL","anlatim":"Miktar sapması nedir? Toplam sapmadan fiyat sapması çıkınca geriye kalan kısımdır. Toplam sapma zaten fiyat ve miktar etkisinin toplamı, biri bulununca öteki farktan çıkar.","doldur":[[8,1]]},{"formul":"Standart Miktar Toplamı = Fiili Miktar − Miktar Sapması / Standart Fiyat = 20.500 (soruda verilen) − 50.000 (3. adımda bulduk) / 50 (soruda verilen) = 19.500 kg","anlatim":"Şimdi miktar sapmasını standart fiyata bölüp fiili miktardan çıkarıyoruz. Bu bize standart miktar toplamını, yani üretimin olması gereken kg cinsinden büyüklüğünü verir.","doldur":[[9,1]]},{"formul":"Üretilen Mamul Miktarı = Standart Miktar Toplamı / Standart Miktar = 19.500 (4. adımda bulduk) / 10 (soruda verilen) = 1.950 adet","anlatim":"Standart miktar toplamını mamul başına standart miktara bölünce üretilen mamul sayısı çıkar. Her mamul 10 kg istiyor, toplam kg\u0027ı buna bölünce adet buluruz.","doldur":[[10,1]]},{"formul":"Ters durum: sapma olumlu olsaydı → Miktar Sapması = Fiyat Sapması − Toplam Sapma","anlatim":"Sapma olumsuzdu, o yüzden fiyat sapmasını toplam sapmadan çıkardık. Sapma olumlu olsaydı işaretler ters döner, çıkarma yerine işlem yön değiştirir.","doldur":[]},{"formul":"Yanlış yol: Toplam Sapma / Standart Fiyat = 111.500 / 50 = 2.230 (HATALI) → doğrusu 1.950 (5. adımda bulduk)","anlatim":"En sık hata: toplam sapmayı direkt standart fiyata bölüp mamul sayısı sanmak. Bu yanlış çünkü toplam sapma hem fiyat hem miktar etkisini içeriyor, önce ayrıştırmak gerekir.","doldur":[]}],"anahtar":[{"ornek":"miktar","kok":"miktar"},{"ornek":"sapması","kok":"sapmas"},{"ornek":"standart","kok":"standa"},{"ornek":"sapmadan","kok":"sapmad"},{"ornek":"çıkarılınca","kok":"çıkarı"},{"ornek":"bulunur","kok":"bulunu"}],"konuGiris":{"harita":"Ne zaman test edilir: fiili tüketim, standart miktar ve fiyatlar verildiğinde sapma ayrıştırması istendiğinde. Nasıl ölçülür: (fiili miktar - standart miktar) çarpı standart fiyat ile hesaplanır. Nasıl kaydedilir: pozitif sonuç olumsuz, negatif sonuç olumlu sapma olarak yorumlanır.","desen":"Sınav önce fiyat sapmasını (fiili fiyat-standart fiyat)xfiili miktar ile buldurup toplam sapmadan çıkartarak miktar sapmasını buldurur. Asıl tuzak miktar sapmasında hangi fiyatın kullanılacağıdır; standart fiyat kullanılmalı, fiili fiyat kullanılırsa sonuç yanlış çıkar. Bu soru standart maliyet sapma ayrıştırması noktasından geliyor (çıkmış arşiv 2 dönem).","terimler":[{"kaynak":"soruda verilir","tanim":"Bir mamul için önceden belirlenen malzeme kullanım miktarı","ad":"Standart miktar","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Dönemde gerçekte tüketilen toplam malzeme miktarı","ad":"Fiili miktar","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Fiili ile standart miktar farkının standart fiyatla çarpımı","ad":"Miktar sapması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Miktar sapması ile fiyat sapmasının toplamı, fiili-standart maliyet farkı","ad":"Toplam sapma","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Fiili tüketim, fiili fiyat, standart fiyat, standart miktar ve toplam sapma verilip üretilen mamul miktarı istenir.","panel_ornek":"Bir kafede standart tarife göre bir kahvede 18 gram çekirdek kullanılması gerekirken barista günde 20 gram kullanıyor. Fazladan harcanan 2 gram, çekirdek fiyatı sabit tutulduğunda işletmeye ekstra maliyet olarak yansıyor, bu fark \u0027miktar sapması\u0027 olarak kaydedilir.","ornek":"Bir kafede standart tarife göre bir kahvede 18 gram çekirdek kullanılması gerekirken barista günde 20 gram kullanıyor. Fazladan harcanan 2 gram, çekirdek fiyatı sabit tutulduğunda işletmeye ekstra maliyet olarak yansıyor, bu fark \u0027miktar sapması\u0027 olarak kaydedilir.","yontemler":"Önce fiyat sapması fiili miktar üzerinden hesaplanır, toplam sapmadan çıkarılınca miktar sapması bulunur; miktar sapması standart fiyata bölünüp fiili-standart miktar farkı çıkarılır, sonra standart mamul başı miktara bölünerek mamul sayısına ulaşılır.","nedir":"Standart maliyet miktar sapması, fiili kullanılan malzeme miktarı ile standart miktar arasındaki farkın maliyete etkisini gösterir. Sınav bu sapmanın standart fiyatla çarpılarak doğru hesaplanıp hesaplanmadığını ölçer."},"olay":"Fiyat Sapması=(53-50)x20.500=61.500; Miktar Sapması=111.500-61.500=50.000; Standart Miktar Toplamı=20.500-(50.000/50)=19.500; Üretilen Mamul=19.500/10=1.950.","tuzak":{"D":{"ad":"Kapsam Tuzağı","metin":"Miktar sapması hiç hesaba katılmadan fiili tüketim miktarı doğrudan standart miktar toplamı sanılmış ve doğrudan standart miktara bölünmüştür. Doğrusu: Önce miktar sapması etkisiyle standart miktar toplamı (19.500) bulunmalı, sonra bölünmelidir."},"E":{"ad":"Yön Tuzağı","metin":"Sapma olumsuz olduğu halde miktar sapması standart miktar toplamından çıkarılacakken tersine eklenmiştir. Doğrusu: Olumsuz sapmada fiili miktar standart miktar toplamından büyüktür, bu yüzden fark standart miktar toplamından çıkarılarak değil fiili miktardan çıkarılarak bulunur."},"A":{"ad":"İşaret Tuzağı","metin":"Fiyat sapması toplam sapmadan çıkarılacakken öğrenci onu toplam sapmaya eklemiş, böylece miktar sapması olduğundan büyük çıkmıştır. Doğrusu: Miktar sapması, toplam sapmadan fiyat sapmasının çıkarılmasıyla (111.500-61.500=50.000) bulunur."},"B":{"ad":"Katman Atlama Tuzağı","metin":"Fiyat sapması hiç hesaplanmadan toplam sapmanın tamamı doğrudan miktar sapması sayılmıştır. Doğrusu: Önce fiyat sapması (53-50)x20.500=61.500 bulunur, sonra toplam sapmadan düşülür."}},"celdiriciYol":{"D":"20.500/10=2.050 (miktar sapması hiç hesaba katılmadan fiili miktar doğrudan standart miktar toplamı sayıldı)","E":"20.500+((111.500-61.500)/50)=21.500; 21.500/10=2.150 (olumsuz sapma yönü ters uygulanıp standart miktar toplamına eklendi)","A":"(111.500+61.500)/50=3.460; 20.500-3.460=17.040; 17.040/10=1.704 (fiyat sapması toplam sapmadan çıkarılacakken eklendi)","B":"111.500/50=2.230; 20.500-2.230=18.270; 18.270/10=1.827 (fiyat sapması hesaplanmadan toplam sapma doğrudan miktar sapması sayıldı)"},"hap":"Miktar sapması standart fiyatla, fiyat sapması fiili miktarla hesaplanır; toplam sapmadan fiyat sapması çıkarılınca miktar sapması bulunur.","teshis":{"C":{"gercek":"Miktar sapması standart fiyatla, fiyat sapması fiili miktarla hesaplanır; sonra standart miktar toplamı ve nihayet üretim miktarı sırayla bulunur.","ayirt":"Dört hesap katmanının hepsini sırayla uyguladım mı?","paragraf":"Standart maliyet sapma analizi","yanilgi":"Bu şıkkı eleyen öğrenci dört katmanlı zinciri (fiyat sapması-miktar sapması-standart miktar toplamı-üretim miktarı) tek adımda çözülebilir sanıp bir katmanı atlamıştır."},"E":{"gercek":"Olumsuz sapmada fiili miktar standart miktardan büyüktür; standart miktar toplamı fiili miktardan sapma etkisinin çıkarılmasıyla bulunur, eklenmez.","ayirt":"Olumsuz sapma fiili miktarı mı yoksa standart miktarı mı büyütür?","paragraf":"Standart maliyet sapma analizi","yanilgi":"Olumsuz sapmanın standart miktar toplamını fiili miktardan büyük yapacağını, bu yüzden eklenmesi gerektiğini düşünüyorsun."},"A":{"gercek":"Toplam sapma = Fiyat Sapması + Miktar Sapması olduğundan miktar sapması, toplam sapmadan fiyat sapmasının çıkarılmasıyla bulunur.","ayirt":"Fiyat ve miktar sapmasının toplamı gerçekten toplam sapmayı veriyor mu diye kontrol ettin mi?","paragraf":"Standart maliyet sapma analizi","yanilgi":"Toplam sapmayı bulurken fiyat sapmasını çıkarmak yerine eklenmesi gerektiğini düşünüyorsun."},"D":{"gercek":"Standart miktar toplamı, fiili miktardan miktar sapmasının standart fiyata bölünmüş halinin çıkarılmasıyla bulunur; fiili miktarla aynı değildir.","ayirt":"Miktar sapması sıfır değilse fiili miktar ile standart miktar toplamı birbirine eşit olabilir mi?","paragraf":"Standart maliyet sapma analizi","yanilgi":"Miktar sapmasının üretim miktarı hesabına hiç etkisi olmadığını, fiili tüketimin doğrudan standart miktar toplamına eşit olduğunu sanıyorsun."},"B":{"gercek":"Toplam sapma fiyat ve miktar sapmasının bileşkesidir; fiyat sapması ayrıca (Fiili Fiyat-Standart Fiyat)xFiili Miktar ile hesaplanmalıdır.","ayirt":"Toplam sapmanın içinde fiyat etkisi ayrıştırıldı mı?","paragraf":"Standart maliyet sapma analizi","yanilgi":"Toplam sapmanın tamamının miktar kaynaklı olduğunu, fiyat etkisinin ayrıca hesaplanmasına gerek olmadığını sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 62"},"kural":"Kapasite sapması, standart faaliyet hacmi için esnek bütçelenen genel üretim gideri ile yüklenen genel üretim gideri arasındaki farktır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 62","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce yükleme oranını normal kapasiteden, sonra standart saati fiili üretimden bul; kapasite sapmasını bütçe sapmasıyla karıştırma.","konu":"standart maliyet sistemi","tablo":{"satirlar":[["VERİLENLER","-","-"],["Normal kapasite","8.000 makine saati","-"],["Bütçelenen sabit genel üretim gideri","40.000 TL","-"],["Değişken genel üretim gideri oranı","saat başına 4 TL","-"],["Üretim miktarı","1.000 birim","-"],["Birim standart makine saati","7,5 saat","-"],["Fiili genel üretim gideri","74.000 TL","-"],["HESAP","-","-"],["Yükleme oranı","72.000 TL / 8.000 saat","9"],["Standart faaliyet hacmi","1.000 birim x 7,5 saat","7.500"],["Yüklenen genel üretim gideri","7.500 saat x 9 TL","67.500"],["Esnek bütçelenen genel üretim gideri (standart saat için)","40.000 + (4 x 7.500)","70.000"],["Kapasite sapması","70.000 - 67.500","2.500 (olumsuz)"]],"basliklar":["Adım","Hesap","Tutar"]},"siklar":{"C":"4.000 (olumlu)","E":"6.500 (olumsuz)","A":"2.500 (olumlu)","D":"4.000 (olumsuz)","B":"2.500 (olumsuz)"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2]],"tablo":{"basliklar":["Adım","Hesap","Tutar"],"satirlar":[["Yükleme oranı","100.000 TL / 10.000 saat","10"],["Standart faaliyet hacmi","1.200 birim x 6 saat","7.200"],["Yüklenen genel üretim gideri","7.200 saat x 10 TL","72.000"],["Esnek bütçelenen genel üretim gideri (standart saat için)","50.000 + (5 x 7.200)","86.000"],["Bütçe (harcama) sapması","90.000 - 86.000","4.000 (olumsuz)"]]},"tur":"tablo","soru":"Tek çeşit mamul üreten bir işletme, standart maliyet sistemi uygulamakta ve genel üretim giderini sabit ve değişken kısmı birlikte içeren tek bir yükleme oranıyla mamule yüklemektedir. Normal kapasite 10.000 makine saati olup bu kapasitede bütçelenen sabit genel üretim gideri 50.000 TL, değişken genel üretim gideri ise saat başına 5 TL olarak öngörülmüştür. Dönemde 1.200 birim mamul üretilmiş, birim başına standart makine saati 6 saat olarak belirlenmiştir. Dönem sonunda fiili genel üretim gideri 90.000 TL olarak gerçekleşmiştir. Buna göre, bütçe (harcama) sapması kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve bütçe (harcama) sapmasının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Tek çeşit mamul üreten bir işletme, standart maliyet sistemi uygulamakta ve genel üretim giderini sabit ve değişken kısmı birlikte içeren tek bir yükleme oranıyla mamule yüklemektedir. Normal kapasite 8.000 makine saati olup bu kapasitede bütçelenen sabit genel üretim gideri 40.000 TL, değişken genel üretim gideri ise saat başına 4 TL olarak öngörülmüştür. Dönemde 1.000 birim mamul üretilmiş, birim başına standart makine saati 7,5 saat olarak belirlenmiştir. Dönem sonunda fiili genel üretim gideri 74.000 TL olarak gerçekleşmiştir. Buna göre, kapasite (hacim) sapması kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-09","verilenler":[{"deger":"8.000 makine saati","anlam":"Bütçelenen faaliyet hacmi; yükleme oranı bu hacme göre bulunur.","ad":"Normal kapasite"},{"deger":"40.000 TL","anlam":"Esnek bütçenin sabit kısmı, faaliyet hacminden bağımsızdır.","ad":"Bütçelenen sabit genel üretim gideri"},{"deger":"saat başına 4 TL","anlam":"Esnek bütçenin değişken kısmını hesaplamada kullanılır.","ad":"Değişken genel üretim gideri oranı"},{"deger":"1.000 birim","anlam":"Standart faaliyet hacmini bulmak için birim standart saatle çarpılır.","ad":"Üretim miktarı"},{"deger":"7,5 saat","anlam":"Fiili üretim için standart faaliyet hacmini verir (1.000x7,5=7.500).","ad":"Birim standart makine saati"},{"deger":"74.000 TL","anlam":"Bütçe sapmasının hesabında kullanılır, kapasite sapmasında doğrudan kullanılmaz.","ad":"Fiili genel üretim gideri"}],"dayanak":"Maliyet muhasebesi - standart maliyet sistemi, genel üretim gideri bütçe/kapasite sapması tekniği (Tekdüzen Hesap Planı 730 Genel Üretim Giderleri)","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Normal kapasite 8.000 saat (soruda verilen); Sabit genel üretim gideri 40.000 TL (soruda verilen); Değişken genel üretim gideri 4 TL/saat (soruda verilen); Üretim 1.000 birim (soruda verilen); Birim standart saat 7,5 (soruda verilen); Fiili genel üretim gideri 74.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: normal kapasite, sabit ve değişken genel üretim gideri oranları, üretim miktarı ve standart saat, fiili genel üretim gideri.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]]},{"formul":"Toplam Bütçelenen genel üretim gideri = Sabit genel üretim gideri + (Değişken Oran × Normal Kapasite) = 40.000 (soruda verilen) + (4 (soruda verilen) × 8.000 (soruda verilen)) = 72.000 TL","anlatim":"Yükleme oranını bulmadan önce normal kapasitede toplam bütçelenen genel üretim gideri\u0027ü topluyoruz. Sabit tutara, değişken kısmın normal kapasitedeki karşılığını ekliyoruz.","doldur":[[8,1],[8,2]]},{"formul":"Yükleme Oranı = Toplam Bütçelenen genel üretim gideri / Normal Kapasite = 72.000 (2. adımda bulduk) / 8.000 (soruda verilen) = 9 TL/saat","anlatim":"Yükleme oranı, toplam bütçelenen genel üretim gideri\u0027ün normal kapasiteye bölünmesiyle bulunur. Bu oran her saate ne kadar genel üretim gideri yükleneceğini gösterir.","doldur":[]},{"formul":"Standart Faaliyet Hacmi = Üretim Miktarı × Birim Standart Saat = 1.000 (soruda verilen) × 7,5 (soruda verilen) = 7.500 saat","anlatim":"Standart faaliyet hacmi, fiilen üretilen birimin standart saatle çarpılmasıyla bulunur. Bu, üretimin ne kadar süre alması gerektiğini gösterir.","doldur":[[9,1],[9,2],[10,1],[11,1]]},{"formul":"Yüklenen genel üretim gideri = Standart Faaliyet Hacmi × Yükleme Oranı = 7.500 (4. adımda bulduk) × 9 (3. adımda bulduk) = 67.500 TL","anlatim":"Yüklenen genel üretim gideri, standart faaliyet hacminin yükleme oranıyla çarpılmasıyla bulunur. Mamule bu kadar genel üretim gideri yüklenmiş demektir.","doldur":[[10,2]]},{"formul":"Esnek Bütçelenen genel üretim gideri = Sabit genel üretim gideri + (Değişken Oran × Standart Faaliyet Hacmi) = 40.000 (soruda verilen) + (4 (soruda verilen) × 7.500 (4. adımda bulduk)) = 70.000 TL","anlatim":"Esnek bütçelenen genel üretim gideri, standart saat için sabit tutara değişken payın eklenmesiyle bulunur. Kapasite sapması bu tutarla kıyaslanacak.","doldur":[[11,2],[12,1]]},{"formul":"Kapasite Sapması = Esnek Bütçelenen genel üretim gideri - Yüklenen genel üretim gideri = 70.000 (6. adımda bulduk) - 67.500 (5. adımda bulduk) = 2.500 TL (olumsuz)","anlatim":"Kapasite sapması, esnek bütçelenen genel üretim gideri ile yüklenen genel üretim gideri arasındaki farktır. Standart saat normal kapasitenin altında kaldığı için sonuç olumsuz çıkar.","doldur":[[12,2]]},{"formul":"Ters durum: Standart Faaliyet Hacmi \u003e Normal Kapasite → Kapasite Sapması olumlu","anlatim":"Ters durumda standart saat normal kapasiteden büyük olsaydı, kapasite sapması olumlu çıkardı. Sapmanın yönü standart saat ile normal kapasitenin karşılaştırılmasına bağlıdır.","doldur":[]},{"formul":"Yanlış yol: 74.000 (soruda verilen) - 67.500 (5. adımda bulduk) = 6.500 (HATALI) → doğrusu 2.500 (7. adımda bulduk)","anlatim":"Bu soruda en sık yapılan hata, fiili genel üretim gideri\u0027ü kapasite sapmasında kullanmaktır. Fiili genel üretim gideri bütçe sapmasına aittir, kapasite sapmasına değil.","doldur":[]}],"anahtar":[{"ornek":"üretim","kok":"üretim"},{"ornek":"gideri","kok":"gideri"},{"ornek":"kapasite","kok":"kapasi"},{"ornek":"standart","kok":"standa"},{"ornek":"sapması","kok":"sapmas"},{"ornek":"normal","kok":"normal"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda fiili sonuçlar standart/bütçelenen tutarlarla karşılaştırıldığında test edilir. Nasıl ölçülür: bütçelenen sabit genel üretim gideri ile normal kapasitedeki fiili faaliyet hacmine göre yüklenen sabit genel üretim gideri arasındaki fark ölçülür. Nasıl kaydedilir: sapma tutarı önemliyse ilgili hesaplara oranlı, önemsizse doğrudan satılan mamul maliyetine kaydedilir.","desen":"Bu tür sorularda öğrenciler bütçe sapmasıyla kapasite sapmasını karıştırır, oysa kapasite sapması yalnız sabit genel üretim gideri\u0027den doğar ve fiili faaliyet hacminin normal kapasiteden sapmasını yansıtır. Değişken genel üretim gideri kısmında kapasite sapması hiç oluşmaz, bu noktayı gözden kaçırmak yaygın hatadır. Bu soru p.28 kademeli/standart maliyet sapma hesaplarından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşletmenin uzun dönemde ulaşabileceği ortalama faaliyet hacmi","ad":"Normal kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Bir birim mamul için önceden belirlenmiş gerekli makine saati","ad":"Standart makine saati","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Bütçelenen genel üretim gideri\u0027nin normal kapasiteye bölünmesiyle bulunan birim yükleme değeri","ad":"Yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Bütçelenen sabit genel üretim gideri ile yüklenen sabit genel üretim gideri arasındaki fark","ad":"Kapasite (hacim) sapması","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Normal kapasite, bütçelenen sabit ve değişken genel üretim gideri, üretim miktarı, birim standart saat ve fiili genel üretim gideri verilerek kapasite sapması istenir.","panel_ornek":"Bir gencin ayda 20 saat ders çalışmayı planlayıp bunun için 100 TL bütçe ayırdığını düşün, ama ay sonunda sadece 15 saat çalışabilmiş. Planlanan 20 saatlik bütçe ile fiilen kullanılan 15 saat arasındaki fark, tam da \u0027kapasite kullanılamaması\u0027ndan doğan bir sapmadır. Kullanmadığı 5 saatlik pay boşa gitmiş sayılır.","ornek":"Bir gencin ayda 20 saat ders çalışmayı planlayıp bunun için 100 TL bütçe ayırdığını düşün, ama ay sonunda sadece 15 saat çalışabilmiş. Planlanan 20 saatlik bütçe ile fiilen kullanılan 15 saat arasındaki fark, tam da \u0027kapasite kullanılamaması\u0027ndan doğan bir sapmadır. Kullanmadığı 5 saatlik pay boşa gitmiş sayılır.","yontemler":"Kapasite sapması = Bütçelenen sabit genel üretim gideri - (standart saat x sabit genel üretim gideri saat oranı x fiili üretim); tek yükleme oranı kullanıldığında sabit kısım ayrıştırılmadan hesaplanırsa hata oluşur.","nedir":"Standart maliyet sistemi, üretim maliyetlerinin gerçekleşmeden önce belirlenen standart tutarlarla izlenmesidir. Sınav, fiili ile standart/bütçelenen tutarlar arasındaki sapmaların doğru hesaplanıp yorumlanmasını ölçer."},"olay":"Yükleme oranı 72.000/8.000=9 TL/saat; standart saat 1.000x7,5=7.500 saat; yüklenen 7.500x9=67.500 TL; esnek bütçelenen 40.000+4x7.500=70.000 TL; sapma 70.000-67.500=2.500.","tuzak":{"C":{"ad":"Kavram Karışıklığı Tuzağı","metin":"Bütçe (harcama) sapmasını hesaplayıp kapasite sapması sandın, üstelik işaretini de ters çevirdin: 70.000-74.000=-4.000, düz okuyup olumlu dedin. Doğrusu: Bu tutar bütçe sapmasıdır ve gerçek işareti olumsuzdur."},"E":{"ad":"Ara Adım Atlama Tuzağı","metin":"Esnek bütçelenen tutarı hiç hesaplamadan fiili ile yükleneni doğrudan karşılaştırdın (74.000-67.500=6.500). Doğrusu: Bu, toplam genel üretim gideri sapmasıdır; kapasite sapması için önce esnek bütçe bulunmalıdır."},"D":{"ad":"Sapma Türü Karıştırma Tuzağı","metin":"Fiili genel üretim gideri ile esnek bütçelenen tutarı karşılaştırıp (74.000-70.000=4.000) bunu kapasite sapması sandın. Doğrusu: Bu, bütçe (harcama) sapmasıdır; kapasite sapması esnek bütçelenen ile yüklenen tutar arasındadır."},"A":{"ad":"Ters İşaret Tuzağı","metin":"Kapasite sapmasını Yüklenen genel üretim gideri - Esnek bütçelenen genel üretim gideri olarak (67.500-70.000=-2.500) kurup işareti düz okumuşsun. Doğrusu: Sapma Esnek bütçelenen - Yüklenen sırasıyla hesaplanır ve sonuç olumsuzdur."}},"celdiriciYol":{"C":"70.000 - 74.000 = -4.000, işaret düz okunup 4.000 (olumlu) yazılmıştır (bütçe sapması kapasite sapması sanılıp yönü ters çevrildi)","E":"74.000 - 67.500 = 6.500 (olumsuz) (toplam genel üretim gideri sapması, esnek bütçe ara adımı atlanarak kapasite sapması sanıldı)","D":"74.000 - 70.000 = 4.000 (olumsuz) (bütçe/harcama sapması kapasite sapması yerine hesaplandı)","A":"67.500 - 70.000 = -2.500, işaret düz okunup 2.500 (olumlu) yazılmıştır (kapasite sapmasında yön ters çevrildi)"},"hap":"Kapasite sapması = Esnek bütçelenen genel üretim gideri (standart saat için) - Yüklenen genel üretim gideri; standart saat normal kapasitenin altında kalırsa sonuç olumsuzdur.","teshis":{"C":{"gercek":"Bütçe (harcama) sapması Fiili genel üretim gideri - Esnek bütçelenen genel üretim gideridir; 74.000-70.000=4.000 olumsuzdur, kapasite sapması değildir.","ayirt":"Bu fark harcama kalemlerinden mi, kapasite kullanımından mı kaynaklanıyor?","paragraf":"GÜG bütçe sapması tekniği (teori notu)","yanilgi":"Bütçe sapmasını kapasite sapmasıyla karıştırıp üstüne işaretini de ters almışsın."},"E":{"gercek":"74.000-67.500=6.500 toplam genel üretim gideri sapmasıdır; bu, bütçe sapması (4.000) ile kapasite sapmasının (2.500) toplamıdır.","ayirt":"Esnek bütçelenen tutarı ayrıca hesapladım mı, yoksa fiili ile yükleneni doğrudan mı çıkardım?","paragraf":"GÜG bütçe sapması tekniği (teori notu)","yanilgi":"Fiili ile yüklenen genel üretim giderini doğrudan karşılaştırıp esnek bütçe ara adımını atlamışsın."},"A":{"gercek":"Kapasite sapması Esnek bütçelenen genel üretim gideri - Yüklenen genel üretim gideri şeklinde hesaplanır; bütçelenen tutar yüklenenden büyükse sonuç olumsuzdur.","ayirt":"Hangi tutardan hangisini çıkardım, sıralamayı doğru mu kurdum?","paragraf":"Standart maliyet - kapasite sapması formülü (teori notu)","yanilgi":"Kapasite sapmasını Yüklenen - Esnek bütçelenen şeklinde çıkarıp işareti düz okuyorsun, yön ters dönüyor."},"D":{"gercek":"Bu tutar bütçe (harcama) sapmasıdır; kapasite sapması esnek bütçelenen tutar ile yüklenen tutar arasındaki farktır.","ayirt":"Hangi iki tutarı karşılaştırdım: fiili-esnek mi, esnek-yüklenen mi?","paragraf":"GÜG bütçe sapması tekniği (teori notu)","yanilgi":"Bütçe sapmasını doğru işaretle bulup soruda istenen kapasite sapması sanmışsın."},"B":{"gercek":"Fiili üretim standart saati (7.500) normal kapasiteden (8.000) az olduğundan sabit giderler yeterince yüklenememiş, sonuç olumsuzdur.","ayirt":"Standart saat normal kapasitenin altında mı kaldı, üstünde mi?","paragraf":"Standart maliyet - kapasite sapması formülü (teori notu)","yanilgi":"Standart saatin normal kapasiteden düşük çıkmasının sapmayı otomatik olumlu yapacağını sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 60"},"kural":"Ücret farkı = (Standart ücret - Fiili ücret) x Fiili süre; sonuç negatifse olumsuz (borç), pozitifse olumlu (alacak) kaydedilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 60","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"İşçilik sapması sorularında önce standart süreyi (üretim x birim standart süre) bulup, ücret ve süre farkı formüllerini birbirine karıştırmadan ayrı ayrı uygula.","konu":"standart maliyet işçilik farkları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Standart süre","2 saat/birim","-"],["Standart saat ücreti","50 TL","-"],["Üretim miktarı","5.000 birim","-"],["Fiili süre","11.000 saat","-"],["Fiili saat ücreti","52 TL","-"],["HESAP","-","-"],["Standart süre","5.000 birim x 2 saat","10.000 saat"],["Standart maliyet","10.000 saat x 50 TL","500.000"],["Fiili maliyet","11.000 saat x 52 TL","572.000"],["Süre (verimlilik) farkı","(10.000-11.000) x 50","-50.000 (olumsuz)"],["Direkt işçilik ücret farkı","(50-52) x 11.000","-22.000 (olumsuz)"]],"basliklar":["Kalem","Hesaplama","Tutar (TL)"]},"siklar":{"C":"22.000 olumsuz","E":"72.000 olumsuz","A":"22.000 olumlu","D":"50.000 olumsuz","B":"50.000 olumlu"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2]],"tablo":{"basliklar":["Kalem","Hesaplama","Tutar (TL)"],"satirlar":[["Standart süre","4.000 birim x 3 saat","12.000 saat"],["Standart maliyet","12.000 saat x 40 TL","480.000"],["Fiili maliyet","13.000 saat x 42 TL","546.000"],["Süre (verimlilik) farkı","(12.000-13.000) x 40","-40.000 (olumsuz)"],["Direkt işçilik ücret farkı","(40-42) x 13.000","-26.000 (olumsuz)"]]},"tur":"tablo","soru":"Standart maliyet yöntemi uygulayan bir işletmede bir birim mamulün üretimi için standart süre 3 saat, standart saat ücreti 40 TL olarak belirlenmiştir. 2026 yılı Nisan ayında 4.000 birim mamul üretilmiş, bu üretim için fiilen 13.000 saat çalışılmış ve fiili saat ücreti 42 TL olarak gerçekleşmiştir. Buna göre, dönem sonunda 723 Direkt İşçilik Süre (Verimlilik) Farkları hesabına kaydedilecek tutar kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve 723 Direkt İşçilik Süre (Verimlilik) Farkları hesabına kaydedilecek tutarın -40.000 TL (olumsuz) olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Standart maliyet yöntemi uygulayan bir üretim işletmesinde bir birim mamulün üretimi için standart süre 2 saat, standart saat ücreti 50 TL olarak belirlenmiştir. 2026 yılı Mart ayında 5.000 birim mamul üretilmiş, bu üretim için fiilen 11.000 saat çalışılmış ve fiili saat ücreti 52 TL olarak gerçekleşmiştir. Buna göre, dönem sonunda 722 Direkt İşçilik Ücret Farkları hesabına kaydedilecek tutar kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-11","verilenler":[{"deger":"2 saat/birim","anlam":"Bir birim mamul için önceden belirlenmiş çalışma süresi; toplam standart süreyi bulmak için üretimle çarpılır.","ad":"Standart süre"},{"deger":"50 TL","anlam":"Önceden belirlenmiş saat ücreti; ücret ve süre farkı formüllerinde kullanılır.","ad":"Standart saat ücreti"},{"deger":"5.000 birim","anlam":"Standart süre toplamını bulmak için standart süreyle çarpılır.","ad":"Üretim miktarı"},{"deger":"11.000 saat","anlam":"Gerçekte çalışılan süre; ücret farkı formülünde fiili süreyle çarpım yapılır.","ad":"Fiili süre"},{"deger":"52 TL","anlam":"Gerçekte ödenen saat ücreti; standart ücretle karşılaştırılarak ücret farkı bulunur.","ad":"Fiili saat ücreti"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı, 722 Direkt İşçilik Ücret Farkları hesap tanımı","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: standart süre 2 saat/birim (soruda verilen); standart ücret 50 TL (soruda verilen); üretim 5.000 birim (soruda verilen); fiili süre 11.000 saat (soruda verilen); fiili ücret 52 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: birim başına standart süre 2 saat, standart saat ücreti 50 TL, Mart ayında 5.000 birim üretim, fiili çalışma 11.000 saat ve fiili saat ücreti 52 TL. Bunların hiçbiri bizim bulduğumuz sayı değil, hepsi soruda hazır.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"Kapsam: Ücret Farkı = (Standart Ücret − Fiili Ücret) × Fiili Süre","anlatim":"722 Direkt İşçilik Ücret Farkları nedir? Fiili saat ücreti ile standart saat ücreti arasındaki farkın, fiili çalışılan süreyle çarpılmasından doğan tutarı taşır. Fark olumsuzsa (fiili ücret standarttan yüksekse) borca, olumluysa alacağa yazılır.","doldur":[]},{"formul":"Standart Süre = Üretim × Birim Standart Süre = 5.000 (soruda verilen) × 2 (soruda verilen) = 10.000 saat","anlatim":"Önce standart süreyi buluyoruz, çünkü standart maliyeti hesaplamak için gereken temel taban bu. Üretilen birim sayısı ile birim başına standart süre çarpılır.","doldur":[[7,1],[7,2]]},{"formul":"Standart Maliyet = Standart Süre × Standart Ücret = 10.000 (2. adımda bulduk) × 50 (soruda verilen) = 500.000 TL","anlatim":"Şimdi standart maliyeti hesaplıyoruz, yani üretim standart koşullarda yapılsaydı ne kadar tutacaktı. Bunun için standart süreyi standart ücretle çarpıyoruz.","doldur":[[8,1],[8,2]]},{"formul":"Fiili Maliyet = Fiili Süre × Fiili Ücret = 11.000 (soruda verilen) × 52 (soruda verilen) = 572.000 TL","anlatim":"Fiili maliyeti buluyoruz, yani işletmenin gerçekte harcadığı tutarı. Fiili süreyi fiili ücretle çarparız.","doldur":[[9,1],[9,2]]},{"formul":"Süre Farkı = (Standart Süre − Fiili Süre) × Standart Ücret = (10.000 (2. adımda bulduk) − 11.000 (soruda verilen)) × 50 (soruda verilen) = -50.000 TL (olumsuz)","anlatim":"Süre farkını ayırıyoruz çünkü toplam farkın bir kısmı süreden bir kısmı ücretten kaynaklanır, ikisini karıştırmamak gerekir. Standart süreden fiili süre çıkarılır, standart ücretle çarpılır.","doldur":[[10,1],[10,2]]},{"formul":"Ücret Farkı = (Standart Ücret − Fiili Ücret) × Fiili Süre = (50 (soruda verilen) − 52 (soruda verilen)) × 11.000 (soruda verilen) = -22.000 TL (olumsuz)","anlatim":"Şimdi asıl istenen ücret farkını hesaplıyoruz: standart ücretle fiili ücret arasındaki fark, fiili süreyle çarpılır. Dikkat, burada fiili süre kullanılır, standart süre değil.","doldur":[[11,1],[11,2]]},{"formul":"722 DİREKT İŞÇİLİK ÜCRET FARKLARI (BORÇ) 22.000 = 22.000 olumsuz fark (6. adımda bulduk)","anlatim":"Sonuç negatif çıktığı için fark olumsuz, yani işletme standarttan fazla ödemiş demektir. Bu yüzden tutar 722 hesabına borç olarak kaydedilir.","doldur":[]},{"formul":"Ters durum: Standart Ücret \u003e Fiili Ücret → 722 hesabı ALACAK","anlatim":"Ters durumda: fiili ücret standarttan düşük çıksaydı fark pozitif olurdu, bu kez 722 hesabı alacaklandırılırdı. Yani olumlu fark her zaman alacak tarafına yazılır.","doldur":[]},{"formul":"Yanlış yol: (50 − 52) × 10.000 (standart süre kullanılarak) = -20.000 TL (HATALI) → doğrusu -22.000 TL (7. adımda bulduk)","anlatim":"En sık hata: ücret farkı hesaplanırken yanlışlıkla standart süre kullanılır, oysa ücret farkında fiili süre esas alınır. Standart süre kullanımı süre farkı formülüne aittir, ücret farkına değil.","doldur":[]}],"anahtar":[{"ornek":"standart","kok":"standa"},{"ornek":"farkın","kok":"farkın"},{"ornek":"hesaplarda","kok":"hesapl"},{"ornek":"ücreti","kok":"ücreti"},{"ornek":"çarpılmasından
