ir. İşletme sabit genel üretim giderini normal kapasiteye göre yüklemektedir.","verilen":[],"hedef":"Tabloyu doldur ve normal maliyet yöntemine göre birim mamul maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"ABC A.Ş. işletmesinde normal kapasite 1.000 birim olup dönemlik toplam sabit genel üretim gideri 40.000 TL\u0027dir. Dönemde fiilen 800 birim mamul üretilmiş; birim direkt ilk madde ve malzeme gideri 100 TL, birim direkt işçilik gideri 50 TL, birim değişken genel üretim gideri 30 TL olarak gerçekleşmiştir. İşletme sabit genel üretim giderini normal kapasiteye göre yüklemektedir. Buna göre normal maliyet yöntemine göre birim mamul maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-maliyet-p30/kp-01","verilenler":[{"deger":"1.000 birim","anlam":"Sabit genel üretim gideri oranının bölüneceği normal kapasite miktarıdır.","ad":"Normal kapasite"},{"deger":"40.000 TL","anlam":"Normal kapasiteye bölünerek birim sabit genel üretim gideri bulunur.","ad":"Toplam sabit genel üretim gideri"},{"deger":"800 birim","anlam":"Dönemde gerçekleşen üretim miktarıdır; normal maliyet yönteminde sabit genel üretim gideri oranının paydası bu değil, normal kapasitedir.","ad":"Fiili üretim"},{"deger":"100 TL","anlam":"Birim maliyetin ilk unsuru.","ad":"Birim direkt ilk madde ve malzeme gideri"},{"deger":"50 TL","anlam":"Birim maliyetin ikinci unsuru.","ad":"Birim direkt işçilik gideri"},{"deger":"30 TL","anlam":"Birim maliyetin üçüncü unsuru.","ad":"Birim değişken genel üretim gideri"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.275; Maliyet Muhasebesi - Değişken/Normal Maliyet Yöntemi Teori Notu","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Normal kapasite 1.000 birim (soruda verilen); Fiili üretim 800 birim (soruda verilen); Toplam sabit genel üretim gideri 40.000 TL (soruda verilen); Birim direkt ilk madde ve malzeme gideri 100 TL (soruda verilen); Birim direkt işçilik gideri 50 TL (soruda verilen); Birim değişken genel üretim gideri 30 TL (soruda verilen)","anlatim":"Soru bize üretim ve maliyet rakamlarını vermiş. Normal kapasite ile fiili üretim farklı, bu fark normal maliyet yönteminin can damarı.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]]},{"formul":"Birim Sabit Genel Üretim Gideri = Toplam Sabit genel üretim gideri / Normal Kapasite = 40.000 (soruda verilen) / 1.000 (soruda verilen) = 40 TL","anlatim":"Normal maliyet yönteminde sabit genel üretim gideri fiili üretime değil normal kapasiteye bölünür. Böylece kapasitesizlik zararı stoklara değil döneme yansır.","doldur":[[8,1]]},{"formul":"Birim Değişken Maliyet Toplamı = direkt ilk madde ve malzeme + direkt işçilik gideri + Değişken genel üretim gideri = 100 (soruda verilen) + 50 (soruda verilen) + 30 (soruda verilen) = 180 TL","anlatim":"Direkt ilk madde, direkt işçilik ve değişken genel üretim gideri zaten fiili tutarlarıyla girer. Normal maliyet yöntemi sadece sabit genel üretim gideri\u0027e dokunur.","doldur":[[9,1]]},{"formul":"Birim Mamul Maliyeti (Normal Maliyet Yöntemi) = Birim Değişken Maliyet Toplamı + Birim Sabit genel üretim gideri = 180 (3. adımda bulduk) + 40 (2. adımda bulduk) = 220 TL","anlatim":"Şimdi iki parçayı birleştirip normal maliyeti buluyoruz. 220 TL, normal maliyet yönteminin cevabı.","doldur":[[10,1]]},{"formul":"Ters durum: fiili maliyet yöntemi kullanılsaydı → Sabit genel üretim gideri = 40.000 (soruda verilen) / 800 (soruda verilen) = 50 TL","anlatim":"Fiili maliyet yönteminde sabit genel üretim gideri normal kapasiteye değil fiili üretime bölünür. O zaman birim maliyet 230 TL olurdu, 220 değil.","doldur":[]},{"formul":"Yanlış yol: 40.000 (soruda verilen) / 800 (soruda verilen) = 50 (HATALI) → doğrusu 40.000 (soruda verilen) / 1.000 (soruda verilen) = 40 (2. adımda bulduk)","anlatim":"Öğrenciler sabit genel üretim gideri\u0027ü fiili üretime böler ama soru açıkça normal kapasiteye göre yükleme diyor. Normal maliyet yönteminin tanımı budur, fiili değil normal kapasite kullanılır.","doldur":[]}],"anahtar":[{"ornek":"normal","kok":"normal"},{"ornek":"üretim","kok":"üretim"},{"ornek":"maliyet","kok":"maliye"},{"ornek":"kapasiteye","kok":"kapasi"},{"ornek":"yönteminde","kok":"yöntem"},{"ornek":"gideri","kok":"gideri"},{"ornek":"220","kok":"220"}],"konuGiris":{"harita":"Ne zaman test edilir: fiili üretim normal kapasiteden düşükken sabit genel üretim gideri\u0027nin nasıl yükleneceği sorulduğunda. Nasıl ölçülür: sabit genel üretim gideri normal kapasiteye bölünüp birim maliyete eklenerek. Nasıl kaydedilir: birim maliyet toplamı tek tutar olarak mamul maliyetine yansıtılır.","desen":"Sınav genelde fiili üretimin normal kapasiteden düşük olduğu durumda öğrenciyi sabit genel üretim gideri\u0027yi fiili birime bölmeye yönlendirir; bu tuzaktır çünkü normal maliyette bölen hep normal kapasitedir. İki dönemde bu ayrım sorulmuştur (p.çıkmış). Bu soru sabit genel üretim gideri yükleme esası noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"işletmenin ideal koşullarda ulaşabileceği üretim miktarı","ad":"Normal kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"toplam sabit genel üretim gideri\u0027nin normal kapasiteye bölünmesiyle bulunan tutar","ad":"Birim sabit genel üretim gideri yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"dönemde gerçekten üretilen birim sayısı","ad":"Fiili üretim miktarı","kim":"piyasa fiyatlar (gerçekleşen tutarlar)"},{"kaynak":"kuraldan bilinir","tanim":"sabit genel üretim gideri\u0027nin normal kapasiteye göre yüklendiği maliyet yöntemi","ad":"Normal maliyet yöntemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Normal kapasite, toplam sabit genel üretim gideri ve fiili giderler verilip normal maliyet yöntemine göre birim maliyet istenir.","panel_ornek":"Bir kırtasiyeci ayda 200 defter satabilecek kapasiteyle dükkan kirası öder ama o ay yalnız 150 defter satar. Kira gideri yine 200 defter üzerinden defter başına paylaştırılır, satılmayan 50 defterin payı boşa gitmiş sayılır.","ornek":"Bir kırtasiyeci ayda 200 defter satabilecek kapasiteyle dükkan kirası öder ama o ay yalnız 150 defter satar. Kira gideri yine 200 defter üzerinden defter başına paylaştırılır, satılmayan 50 defterin payı boşa gitmiş sayılır.","yontemler":"Sabit genel üretim gideri toplam sabit genel üretim gideri/normal kapasite ile bölünür, bulunan tutar diğer birim maliyet unsurlarına eklenir; fiili üretim sadece değişken maliyetlerde kullanılır.","nedir":"Normal maliyet yöntemi, sabit genel üretim giderinin normal kapasiteye göre yüklenmesiyle birim maliyetin bulunmasıdır. Sınav, fiili üretimle normal kapasite farkının maliyete etkisini ölçer."},"olay":"Birim sabit genel üretim gideri = 40.000/1.000 = 40; birim değişken maliyet toplamı = 100+50+30 = 180; birim normal maliyet = 180+40 = 220.","tuzak":{"C":{"ad":"Çifte Hata Tuzağı","metin":"Öğrenci hem değişken genel üretim giderini atlar hem de sabit genel üretim giderini normal kapasite yerine fiili üretime böler. Doğrusu: Sabit genel üretim gideri normal kapasiteye bölünmeli ve değişken genel üretim gideri de toplama dahil edilmelidir."},"E":{"ad":"Kapasite Karıştırma Tuzağı","metin":"Öğrenci tüm maliyet unsurlarını doğru toplar ancak sabit genel üretim giderini normal kapasite yerine fiili üretim miktarına böler. Doğrusu: Normal maliyet yönteminde payda daima normal kapasitedir, fiili üretim miktarı değildir."},"A":{"ad":"Değişken Maliyet Yöntemiyle Karıştırma Tuzağı","metin":"Öğrenci normal maliyet yöntemini değişken maliyet yöntemiyle aynı sanıp sabit genel üretim giderini hiç hesaba katmaz. Doğrusu: Normal maliyet yönteminde sabit genel üretim gideri normal kapasiteye göre birim maliyete eklenir."},"B":{"ad":"Unsur Atlama Tuzağı","metin":"Öğrenci sabit genel üretim giderini normal kapasiteye göre doğru bölse de birim değişken genel üretim giderini toplama dahil etmeyi unutur. Doğrusu: Birim maliyet direkt ilk madde ve malzeme, direkt işçilik, değişken ve sabit genel üretim giderlerinin tamamından oluşur."}},"celdiriciYol":{"C":"100+50+(40.000/800=50) = 200 (hem değişken genel üretim giderini atladın hem sabit genel üretim giderini fiili üretime böldün)","E":"100+50+30+(40.000/800=50) = 230 (sabit genel üretim gideri oranını normal kapasite yerine fiili üretime böldün)","A":"100+50+30 = 180 (sabit genel üretim giderini normal maliyet yönteminde hiç hesaba katmadın, değişken maliyet yöntemiyle karıştırdın)","B":"100+50+(40.000/1.000=40) = 190 (birim değişken genel üretim giderini toplama dahil etmeyi unuttun)"},"hap":"Normal maliyet yönteminde sabit genel üretim gideri normal kapasiteye, değişken maliyet yönteminde ise hiçbir kapasiteye bölünmeden doğrudan döneme gider yazılır.","teshis":{"C":{"gercek":"Normal maliyet yönteminde payda normal kapasitedir ve birim maliyet dört unsurun tamamından oluşur; hiçbir unsur atlanamaz.","ayirt":"Payda olarak normal kapasiteyi mi kullandım, toplamda dört unsurun hepsi var mı?","paragraf":"Maliyet Muhasebesi - Normal Maliyet Yöntemi Notu","yanilgi":"Sabit genel üretim giderini fiili üretime bölmenin doğru olduğunu ve bir yandan da değişken genel üretim giderini atlayabileceğini sanıyorsun; iki hatayı birden yapıyorsun."},"E":{"gercek":"Normal maliyet yönteminde sabit genel üretim gideri normal kapasiteye bölünür; fiili üretime bölme fiili (gerçek) maliyet yöntemine ait bir yaklaşımdır.","ayirt":"Sabit genel üretim gideri oranının paydasında normal kapasite mi var, fiili üretim mi?","paragraf":"Maliyet Muhasebesi - Normal Maliyet Yöntemi Notu","yanilgi":"Tüm maliyet unsurlarını topladığın için doğru yaptığını sanıyorsun ama sabit genel üretim gideri oranını fiili üretime bölerek kapasiteyi karıştırıyorsun."},"A":{"gercek":"Değişken maliyet yönteminde sabit genel üretim gideri döneme gider yazılırken, normal maliyet yönteminde sabit genel üretim gideri normal kapasiteye göre mamule yüklenir.","ayirt":"Bu soruda hangi yöntem sabit genel üretim giderini birim maliyete katar, hangisi katmaz?","paragraf":"Maliyet Muhasebesi - Değişken/Normal Maliyet Yöntemi Notu","yanilgi":"Normal maliyet yöntemi ile değişken maliyet yönteminin aynı şey olduğunu, sabit genel üretim giderinin hiçbir zaman birim maliyete girmeyeceğini sanıyorsun."},"D":{"gercek":"Normal maliyet yönteminin tanımı gereği sabit genel üretim gideri normal kapasiteye bölünerek yüklenir; bu, kapasite dalgalanmalarının birim maliyeti bozmasını önler.","ayirt":"Sabit genel üretim gideri oranını hesaplarken paydaya normal kapasiteyi mi yazdım?","paragraf":"Maliyet Muhasebesi - Normal Maliyet Yöntemi Notu","yanilgi":"Bu şıkkı eleyen öğrenci sabit genel üretim gideri payını fiili üretime bölmenin daha \u0027gerçekçi\u0027 olduğunu düşünerek normal kapasiteyi göz ardı eder."},"B":{"gercek":"Birim mamul maliyeti dört unsurun toplamıdır: direkt ilk madde ve malzeme, direkt işçilik, değişken genel üretim gideri ve normal kapasiteye göre bulunan sabit genel üretim gideri.","ayirt":"Toplama kalemlerimin hepsini tek tek saydım mı, bir unsuru atladım mı?","paragraf":"213 sayılı Vergi Usul Kanunu m.275; Maliyet Muhasebesi Formül Notu","yanilgi":"Sabit genel üretim gideri payını doğru bulduğun için işin bittiğini, değişken genel üretim giderini toplamaya eklemeyi unutabileceğini düşünüyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"donem":2,"hesaplar":{"220":{"ad":"ALICILAR","tanim":"İşletmenin faaliyet konusunu oluşturan mal ve hizmet satışlarından kaynaklanan senetsiz alacakları ifade eder. (Ticari Alacaklar ile Diğer Alacaklar Hesap Gruplarının İşleyişleri: Yukarıdaki alacak hesaplarının herbirinin tanımı, bölümlenmesi, işleyişi, değerlemesi dönen varlıklar içerisinde yer alan ilgili alacak hesaplarında olduğu gibi…"},"190":{"ad":"DEVREDEN KATMA DEĞER VERGİSİ","tanim":"Bir dönemde indirilemeyen ve izleyen dönemlere devreden katma değer vergisinin kaydedildiği ve izlendiği hesaptır."},"180":{"ad":"Gelecek Aylara Ait Giderler","tanim":"Bu hesap, peşin ödenen ve cari dönem içinde ilgili gider hesaplarına kaydedilmemesi gereken, gelecek döneme ait giderleri izlemek için kullanılır. İşleyişi : Gelecek aylarda ilgili gider ve maliyet hesaplarına borç kaydedilecek peşin olarak ödenen giderler, bu hesabın borcuna kaydedilir."}}},{"capa":{"kaynak":"SGS 2024/3 Soru 62"},"kural":"ilk giren ilk çıkar yönteminde ilk madde ve dönüştürme maliyeti için eşdeğer birim ayrı hesaplanır, dönem sonu yarı mamul her unsurun kendi tamamlanma yüzdesiyle değerlenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 62","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Safha maliyet sorularında önce ilk madde, sonra dönüştürme için ayrı eşdeğer birim ve birim maliyet tablosu çiz; tek tabloda karıştırma.","konu":"fıfo eşdeğer birim maliyet (safha)","tablo":{"satirlar":[["VERİLENLER","-"],["Dönem başı yarı mamul miktarı","200 birim"],["Dönem başı ilk madde tamamlanma","%100"],["Dönem başı dönüştürme tamamlanma","%40"],["Dönem içi başlanan","1.000 birim"],["Tamamlanan birim","900 birim"],["Dönem sonu yarı mamul miktarı","300 birim"],["Dönem sonu ilk madde tamamlanma","%100"],["Dönem sonu dönüştürme tamamlanma","%50"],["İlk madde ve malzeme gideri","130.000 TL"],["Dönüştürme maliyeti","145.500 TL"],["HESAP","-"],["İlk madde eşdeğer birimi","1.000"],["Dönüştürme eşdeğer birimi","970"],["İlk madde birim maliyeti","130"],["Dönüştürme birim maliyeti","150"],["Dönem sonu yarı mamul ilk madde payı","39.000"],["Dönem sonu yarı mamul dönüştürme payı","22.500"],["Dönem sonu yarı mamul maliyeti (SONUÇ)","61.500"]],"basliklar":["Kalem","Tutar/Adet"]},"siklar":{"C":"61.500","E":"84.000","A":"22.500","D":"64.500","B":"39.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"tablo":{"basliklar":["Kalem","Tutar/Adet"],"satirlar":[["İlk madde eşdeğer birimi","1.350"],["Dönüştürme eşdeğer birimi","1.415"],["İlk madde birim maliyeti","140"],["Dönüştürme birim maliyeti","110"],["Dönem sonu yarı mamul ilk madde payı","39.200"],["Dönem sonu yarı mamul dönüştürme payı","23.100"],["Dönem sonu yarı mamul maliyeti (SONUÇ)","62.300"]]},"tur":"tablo","soru":"Tek safhada üretim yapan işletmede yarı mamul maliyeti İlk Giren İlk Çıkar yöntemiyle hesaplanmaktadır. Dönem başı yarı mamul 180 birim olup ilk madde açısından %100, dönüştürme açısından %25 tamamlanmıştır. Dönem içinde 1.350 birime başlanmış, 1.250 birim tamamlanmış, 280 birim dönem sonu yarı mamul olarak kalmıştır; dönem sonu yarı mamul ilk madde açısından %100, dönüştürme açısından %75 tamamlanmıştır. Dönemin ilk madde ve malzeme gideri 189.000 TL, dönüştürme maliyeti 155.650 TL\u0027dir. Buna göre dönem sonu yarı mamul maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve dönem sonu yarı mamul maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Tek safhada üretim yapan işletmede yarı mamul maliyeti İlk Giren İlk Çıkar yöntemiyle hesaplanmaktadır. Dönem başı yarı mamul 200 birim olup ilk madde açısından %100, dönüştürme açısından %40 tamamlanmıştır. Dönem içinde 1.000 birime başlanmış, 900 birim tamamlanmış, 300 birim dönem sonu yarı mamul olarak kalmıştır; dönem sonu yarı mamul ilk madde açısından %100, dönüştürme açısından %50 tamamlanmıştır. Dönemin ilk madde ve malzeme gideri 130.000 TL, dönüştürme maliyeti 145.500 TL\u0027dir. Buna göre dönem sonu yarı mamul maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-maliyet-p30/kp-02","verilenler":[{"deger":"200 birim","anlam":"ilk giren ilk çıkar yönteminde dönem başı yarı mamulün ek eşdeğer birim hesabında kullanılır.","ad":"Dönem başı yarı mamul miktarı"},{"deger":"%100","anlam":"İlk maddenin dönem başı yarı mamul için zaten tam verildiğini gösterir, ek eşdeğer birim hesabında kullanılır.","ad":"Dönem başı ilk madde tamamlanma"},{"deger":"%40","anlam":"Dönem başı yarı mamul\u0027nin dönüştürme açısından tamamlanmayan kısmı bu dönemde tamamlanır, ek eşdeğer birim hesabında kullanılır.","ad":"Dönem başı dönüştürme tamamlanma"},{"deger":"1.000 birim","anlam":"Dönem içinde üretime başlanan birim sayısıdır, dönem içi başlayıp biten miktarın hesabında kullanılır.","ad":"Dönem içi başlanan"},{"deger":"900 birim","anlam":"Dönemde tamamlanan toplam birim sayısıdır, dönem içi başlayıp biten miktarın bulunmasında kullanılır.","ad":"Tamamlanan birim"},{"deger":"300 birim","anlam":"Dönem sonunda yarı mamul kalan birim sayısıdır, eşdeğer birim ve dönem sonu yarı mamul payı hesabında kullanılır.","ad":"Dönem sonu yarı mamul miktarı"},{"deger":"%100","anlam":"Dönem sonu yarı mamul\u0027nin ilk madde eşdeğer birimini ve payını hesaplamak için kullanılır.","ad":"Dönem sonu ilk madde tamamlanma"},{"deger":"%50","anlam":"Dönem sonu yarı mamul\u0027nin dönüştürme eşdeğer birimini ve payını hesaplamak için kullanılır.","ad":"Dönem sonu dönüştürme tamamlanma"},{"deger":"130.000 TL","anlam":"İlk madde birim maliyetinin hesaplanmasında paydaki toplam maliyettir.","ad":"İlk madde ve malzeme gideri"},{"deger":"145.500 TL","anlam":"Dönüştürme birim maliyetinin hesaplanmasında paydaki toplam maliyettir.","ad":"Dönüştürme maliyeti"}],"dayanak":"Maliyet Muhasebesi - Safha (Evre) Maliyet Sistemi, FIFO Eşdeğer Ürün Birimi Yöntemi","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Dönem başı yarı mamul 200 birim (soruda verilen); dönem başı ilk madde tamamlanma %100 (soruda verilen); dönem başı dönüştürme tamamlanma %40 (soruda verilen); dönem içi başlanan 1.000 birim (soruda verilen); tamamlanan 900 birim (soruda verilen); dönem sonu yarı mamul 300 birim (soruda verilen); dönem sonu ilk madde tamamlanma %100 (soruda verilen); dönem sonu dönüştürme tamamlanma %50 (soruda verilen); ilk madde ve malzeme gideri 130.000 TL (soruda verilen); dönüştürme maliyeti 145.500 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: dönem başı ve dönem sonu yarı mamul miktarları, bunların ilk madde ve dönüştürme açısından tamamlanma yüzdeleri, dönem içi başlanan/tamamlanan birimler ve toplam giderler. Bunlarla eşdeğer birim hesaplayıp dönem sonu yarı mamulün maliyetini bulacağız.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1]]},{"formul":"Eşdeğer Birim = Fiziksel Miktar × Tamamlanma Yüzdesi","anlatim":"Eşdeğer birim, yarım kalan işin tam birim cinsinden karşılığıdır. Bir birim %50 bitmişse yarım eşdeğer birim sayılır, tam maliyeti almaz.","doldur":[]},{"formul":"Dönem başı stokun bu dönem aldığı ilk madde payı = 200 (soruda verilen) × (1 − %100 = %0) = 0","anlatim":"ilk giren ilk çıkar yönteminde dönem başı stok geçen dönemden geliyor, bu dönem sadece kalan kısmı için iş görülür. İlk madde zaten %100 bitmişti, bu dönem hiç ek pay eklenmez.","doldur":[]},{"formul":"Başlanıp bitirilen = Tamamlanan − Dönem başı stok = 900 (soruda verilen) − 200 (soruda verilen) = 700","anlatim":"Başlanıp aynı dönemde bitirilen birimler hem başlangıcı hem bitişi bu dönemde olduğu için tam birim sayılır. Bu miktar ilk madde ve dönüştürmede aynı ağırlıkla girer.","doldur":[]},{"formul":"Dönem sonu stokun ilk madde payı = 300 (soruda verilen) × %100 (soruda verilen) = 300","anlatim":"Dönem sonu stok ilk madde açısından tamamen bitmiş, o yüzden tam payı eşdeğer birime eklenir. Bu, henüz üretimden çıkmamış ama maddesi tam giren stoktur.","doldur":[]},{"formul":"İlk madde eşdeğer birimi = 0 (3. adımda bulduk) + 700 (4. adımda bulduk) + 300 (5. adımda bulduk) = 1.000","anlatim":"Şimdi üç parçayı topluyoruz: dönem başı payı, başlanıp bitirilen, dönem sonu payı. Bu toplam ilk madde için bu dönemin eşdeğer birimidir.","doldur":[[12,1]]},{"formul":"İlk madde birim maliyeti = İlk madde gideri / İlk madde eşdeğer birimi = 130.000 (soruda verilen) / 1.000 (6. adımda bulduk) = 130","anlatim":"Toplam ilk madde giderini eşdeğer birime bölünce her eşdeğer birimin ilk madde maliyeti çıkar. Bu birim maliyet sonraki adımlarda paylara çarpılacak.","doldur":[[14,1]]},{"formul":"Dönem başı stokun bu dönem aldığı dönüştürme payı = 200 (soruda verilen) × (1 − %40 = %60) = 120","anlatim":"Dönüştürme açısından dönem başı stok %40 bitmişti, bu dönem geri kalan %60\u0027lık kısmı işleniyor. Bu payı hesaba katmamız gerekiyor.","doldur":[]},{"formul":"Dönem sonu stokun dönüştürme payı = 300 (soruda verilen) × %50 (soruda verilen) = 150","anlatim":"Dönem sonu stok dönüştürme açısından sadece yarı bitmiş, o yüzden sadece %50\u0027lik payı bu dönemin eşdeğer birimine girer.","doldur":[]},{"formul":"Dönüştürme eşdeğer birimi = 120 (8. adımda bulduk) + 700 (4. adımda bulduk) + 150 (9. adımda bulduk) = 970","anlatim":"Başlanıp bitirilen miktar dönüştürme için de aynı 700 çünkü o birimler tamamen bu dönemde işlendi. Üç payı toplayınca dönüştürme eşdeğer birimi çıkar.","doldur":[[13,1]]},{"formul":"Dönüştürme birim maliyeti = Dönüştürme maliyeti / Dönüştürme eşdeğer birimi = 145.500 (soruda verilen) / 970 (10. adımda bulduk) = 150","anlatim":"Dönüştürme maliyetini eşdeğer birime bölüyoruz, böylece her eşdeğer birimin dönüştürme maliyetini buluyoruz. Bu birim maliyet de paylara çarpılacak.","doldur":[[15,1]]},{"formul":"Dönem sonu yarı mamul ilk madde payı = 300 (5. adımda bulduk) × 130 (7. adımda bulduk) = 39.000","anlatim":"Dönem sonu yarı mamulün ilk madde payını parasal olarak buluyoruz: eşdeğer birim miktarı ile birim maliyeti çarpıyoruz. Bu, stoktaki ilk madde kısmının değeridir.","doldur":[[16,1]]},{"formul":"Dönem sonu yarı mamul dönüştürme payı = 150 (9. adımda bulduk) × 150 (11. adımda bulduk) = 22.500","anlatim":"Aynı mantıkla dönüştürme payını da parasal olarak buluyoruz. Bu iki pay birleşince dönem sonu stokun tam maliyeti çıkacak.","doldur":[[17,1]]},{"formul":"Dönem sonu yarı mamul maliyeti = 39.000 (12. adımda bulduk) + 22.500 (13. adımda bulduk) = 61.500 TL","anlatim":"Dönem sonu yarı mamulün toplam maliyeti ilk madde ve dönüştürme paylarının toplamıdır. Bu tutar bilançoda yarı mamul stoku olarak görünür.","doldur":[[18,1]]},{"formul":"Ters durum: yöntem ilk giren ilk çıkar (FIFO) değil Ağırlıklı Ortalama olsaydı → dönem başı stok payı hesaplanmaz, eşdeğer birim = tamamlanan + dönem sonu stok payı","anlatim":"Ters durumda: yöntem Ağırlıklı Ortalama olsaydı dönem başı stokun tamamlanma yüzdesi hiç dikkate alınmazdı. O zaman eşdeğer birim direkt fiziksel miktarlar üzerinden hesaplanır.","doldur":[]},{"formul":"Yanlış yol: İlk madde eşdeğer birimi = 200 + 700 + 300 = 1.200 (HATALI) → doğrusu 1.000 (6. adımda bulduk)","anlatim":"En sık hata, dönem başı stokun tamamlanma yüzdesini çıkarmayı unutup 200 birimi tam olarak yeniden eklemektir. Bu ilk giren ilk çıkar (FIFO)\u0027nun \u0027sadece bu dönem yapılan işi say\u0027 mantığını bozar.","doldur":[]}],"anahtar":[{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"dönüştürme","kok":"dönüşt"},{"ornek":"maliyetinin","kok":"maliye"},{"ornek":"tamamlanma","kok":"tamaml"},{"ornek":"birimidir","kok":"birimi"},{"ornek":"başlanan","kok":"başlan"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda tamamlanmamış yarı mamul kaldığında hesaplanır. Nasıl ölçülür: ilk madde ve dönüştürme maliyeti için ayrı eşdeğer birim bulunup ayrı birim maliyetle çarpılır. Nasıl kaydedilir: dönem sonu yarı mamul maliyeti, iki unsurun kendi payı toplanarak tek tutar olarak raporlanır.","desen":"Sınav genelde dönem başı ve dönem sonu yarı mamulü aynı anda vererek ilk giren ilk çıkar yönteminde dönem başının tam sayılmaması kuralını test eder (Teori Notu). Tuzak, ilk madde ve dönüştürme için tek eşdeğer birim hesaplayıp ikisine aynı sayıyı uygulamaktır. Bu soru safha maliyetinde eşdeğer birim ayrımı noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Yarı mamulün tamamlanma oranına göre tam mamul cinsinden ifadesi","ad":"Eşdeğer birim","kim":"standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Dönem içi maliyet sadece dönem içi eşdeğer birime bölünür, dönem başı ayrı tutulur","ad":"ilk giren ilk çıkar (FIFO) esas kuralı","kim":"standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Direkt işçilik ile genel üretim giderinin toplamı, ilk madde hariç","ad":"Dönüştürme maliyeti","kim":"işletme yönetimi tahmin eder"},{"kaynak":"soruda verilir","tanim":"Yarı mamulün ilk madde veya dönüştürme açısından ne kadar bittiğini gösteren oran","ad":"Tamamlanma yüzdesi","kim":"işletme yönetimi tahmin eder"}],"sinavda":"Dönem başı ve dönem sonu yarı mamul miktarları, tamamlanma yüzdeleri ile dönem ilk madde ve dönüştürme maliyeti verilip dönem sonu yarı mamul maliyeti istenir.","panel_ornek":"Bir pastane siparişi düşün: 10 pasta yapılmaya başlanmış, dönem sonunda 4 tanesi sadece hamur aşamasında kalmış, malzemesi tam konmuş ama pişirme süreci yarım. Malzeme %100 harcanmış ama emek/fırın süresi %50 tamamlanmış sayılır, bu yüzden iki maliyet ayrı hesaplanır.","ornek":"Bir pastane siparişi düşün: 10 pasta yapılmaya başlanmış, dönem sonunda 4 tanesi sadece hamur aşamasında kalmış, malzemesi tam konmuş ama pişirme süreci yarım. Malzeme %100 harcanmış ama emek/fırın süresi %50 tamamlanmış sayılır, bu yüzden iki maliyet ayrı hesaplanır.","yontemler":"ilk giren ilk çıkar yönteminde dönem içi maliyet, dönem içi eşdeğer birime bölünür; dönem başı yarı mamulün eski maliyeti bu hesaba karıştırılmaz.","nedir":"ilk giren ilk çıkar (FIFO) eşdeğer birim maliyeti, safha üretiminde dönem sonunda elde kalan yarı mamulün ne kadar maliyet taşıdığını bulmak için kullanılır. Sınav, ilk madde ile dönüştürme maliyetinin ayrı ayrı eşdeğer birime bölünüp doğru orana uygulanıp uygulanmadığını ölçer."},"olay":"İlk madde eşdeğer birim=0+700+300=1.000, birim maliyet=130.000/1.000=130; dönüştürme eşdeğer birim=120+700+150=970, birim maliyet=145.500/970=150; ilk madde payı=300x1,00x130=39.000, dönüştürme payı=300x0,50x150=22.500.","tuzak":{"D":{"ad":"Tamamlanma Derecesi Karıştırma Tuzağı","metin":"İlk madde ve dönüştürme maliyetinin tamamlanma yüzdelerini birbirine ters uygularsın. Doğrusu: İlk madde %100, dönüştürme %50 ile değerlenmelidir; ters uygulama 300x0,50x130+300x1,00x150=64.500 verir ama yanlıştır."},"E":{"ad":"Tamamlanma Yüzdesini Atlama Tuzağı","metin":"Dönem sonu yarı mamulü tamamlanma derecesini hiç dikkate almadan tam mamul gibi değerlersin. Doğrusu: 300x280=84.000 tam mamul maliyetidir, yarı mamul kısmi tamamlandığı için bu tutar fazla hesaplanmıştır."},"A":{"ad":"Eksik Katman Tuzağı","metin":"Yalnız dönüştürme payını hesaplayıp ilk madde payını dönem sonu yarı mamul maliyetine eklemeyi unutursun. Doğrusu: 300x0,50x150=22.500 yalnızca dönüştürme payıdır, buna ilk madde payı olan 39.000 TL de eklenmelidir."},"B":{"ad":"Tek Unsur Tuzağı","metin":"Yalnız ilk madde payını hesaplayıp dönüştürme payını dönem sonu yarı mamul maliyetine katmayı atlarsın. Doğrusu: 300x1,00x130=39.000 yalnız ilk madde payıdır, dönüştürme payı olan 22.500 TL de eklenmelidir."}},"celdiriciYol":{"D":"300x0,50x130 + 300x1,00x150 = 19.500+45.000=64.500 (ilk madde ve dönüştürme tamamlanma yüzdeleri ters uygulandı)","E":"300x130 + 300x150 = 300x280=84.000 (tamamlanma yüzdesi hiç uygulanmadan tam mamul gibi değerlendi)","A":"300x0,50x150=22.500 (ilk madde payı hesaba katılmadan yalnız dönüştürme payı alındı)","B":"300x1,00x130=39.000 (dönüştürme payı hesaba katılmadan yalnız ilk madde payı alındı)"},"hap":"ilk giren ilk çıkar yönteminde dönem sonu yarı mamul, ilk madde ve dönüştürme maliyetinin kendi tamamlanma yüzdeleriyle ayrı ayrı hesaplanıp toplanmasıyla değerlenir.","teshis":{"C":{"gercek":"ilk giren ilk çıkar yönteminde dönem sonu yarı mamul, ilk madde ve dönüştürme paylarının ayrı ayrı hesaplanıp toplanmasıyla bulunur.","ayirt":"İki unsuru da ayrı eşdeğer birimle hesaplayıp topladım mı?","paragraf":"FIFO Eşdeğer Birim Yöntemi","yanilgi":"Bu şıkkı doğru bulmak için ilk giren ilk çıkar yönteminde ilk madde ve dönüştürmenin ayrı eşdeğer birimle hesaplanması gerektiğini fark etmen gerekir; aksi halde tek unsur ya da tam mamul mantığına kayarsın."},"E":{"gercek":"Dönem sonu yarı mamul her unsurun kendi tamamlanma yüzdesiyle eşdeğer birime çevrilerek değerlenir, tam mamul gibi hesaplanmaz.","ayirt":"Tamamlanma yüzdesini uyguladım mı?","paragraf":"Eşdeğer Ürün Birimi Formülü","yanilgi":"Yarı mamulü, tamamlanma derecesini dikkate almadan tam mamulmüş gibi değerlemek gerektiğini sanıyorsun."},"A":{"gercek":"Yarı mamul maliyeti ilk madde ve dönüştürme paylarının toplamıdır; her unsur ayrı eşdeğer birimle hesaplanır.","ayirt":"Bu tutara ilk madde payını eklemeyi unuttum mu?","paragraf":"Safha Maliyet - Eşdeğer Ürün Birimi","yanilgi":"Dönem sonu yarı mamul maliyetini yalnızca dönüştürme maliyeti üzerinden tam sanıyorsun, ilk madde payını unutuyorsun."},"D":{"gercek":"İlk madde genellikle başta topluca verildiği için %100, dönüştürme ise sürece yayıldığı için kısmi tamamlanma oranıyla hesaplanır; bu ikisi yer değiştirmez.","ayirt":"Hangi tamamlanma yüzdesi ilk maddeye, hangisi dönüştürmeye ait, karıştırdım mı?","paragraf":"İlk Madde-Dönüştürme Ayrımı","yanilgi":"İlk madde ile dönüştürmenin tamamlanma derecelerinin yer değiştirebileceğini sanıyorsun."},"B":{"gercek":"Dönüştürme maliyeti (direkt işçilik+genel üretim gideri) ilk maddeden bağımsız ayrı eşdeğer birimle hesaplanır ve toplam maliyete eklenir.","ayirt":"Dönüştürme payını da eklediğimden emin miyim?","paragraf":"Dönüştürme Maliyeti Kavramı","yanilgi":"Sadece ilk madde payını yeterli sanıyorsun, dönüştürme maliyetinin de ayrı bir payı olduğunu atlıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 62"},"kural":"Ortalama yöntemde eşdeğer birim = tamamlanan mamul + dönem sonu yarı mamul × tamamlanma yüzdesi; birim maliyet = (dönem başı yarı mamul maliyeti + dönem içi maliyet) / eşde maliyeti (900+39.100)","40.000"],["Birim malzeme maliyeti (60.000/10.000)","6,00"],["Birim şekillendirme maliyeti (40.000/8.000)","5,00"],["Dönem sonu yarı mamul malzeme payı (4.000×6,00)","24.000"],["Dönem sonu yarı mamul şekillendirme payı (4.000×0,50×5,00)","10.000"],["Dönem sonu yarı mamul stokunun maliyeti (SONUÇ)","34.000"]]},"tur":"tablo","soru":"Bir işletme evre maliyet sisteminde ortalama maliyet yöntemi kullanmaktadır. Direkt ilk madde ve malzeme sürecin başında tam eklenmekte, şekillendirme maliyeti sürece yayılı olarak gerçekleşmektedir. Dönem başı yarı mamul maliyeti malzemede 2.000 TL, şekillendirmede 900 TL\u0027dir. Dönem içi malzeme maliyeti 58.000 TL, şekillendirme maliyeti 39.100 TL\u0027dir. Tamamlanan mamul 6.000 birim, dönem sonu yarı mamul 4.000 birim olup malzemede %100, şekillendirmede %50 tamamlanmıştır. Dönem sonu yarı mamul stokunun maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve dönem sonu yarı mamul stokunun maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir işletme evre maliyet sisteminde ortalama maliyet yöntemi kullanmaktadır. Direkt ilk madde ve malzeme sürecin başında tam eklenmekte, şekillendirme maliyeti sürece yayılı olarak gerçekleşmektedir. Dönem başı yarı mamul maliyeti malzemede 4.000 TL, şekillendirmede 1.200 TL\u0027dir. Dönem içi malzeme maliyeti 46.000 TL, şekillendirme maliyeti 34.800 TL\u0027dir. Tamamlanan mamul 8.000 birim, dönem sonu yarı mamul 2.000 birim olup malzemede %100, şekillendirmede %50 tamamlanmıştır. Dönem sonu yarı mamul stokunun maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-maliyet-p30/kp-03","verilenler":[{"deger":"4.000 TL","anlam":"Malzeme birim maliyeti hesaplanırken payda toplanacak dönem başı tutarı.","ad":"Dönem başı yarı mamul malzeme maliyeti"},{"deger":"1.200 TL","anlam":"Şekillendirme birim maliyeti hesaplanırken payda toplanacak dönem başı tutarı.","ad":"Dönem başı yarı mamul şekillendirme maliyeti"},{"deger":"46.000 TL","anlam":"Dönem içinde katlanılan malzeme maliyeti, dönem başı tutarına eklenir.","ad":"Dönem içi malzeme maliyeti"},{"deger":"34.800 TL","anlam":"Dönem içinde katlanılan şekillendirme maliyeti, dönem başı tutarına eklenir.","ad":"Dönem içi şekillendirme maliyeti"},{"deger":"8.000 birim","anlam":"Eşdeğer birim hesabında hem malzeme hem şekillendirme için tam birim olarak sayılır.","ad":"Tamamlanan mamul miktarı"},{"deger":"2.000 birim","anlam":"Tamamlanma yüzdesiyle çarpılarak eşdeğer birime ve dönem sonu maliyetine dahil edilir.","ad":"Dönem sonu yarı mamul miktarı"},{"deger":"%100","anlam":"Dönem sonu yarı mamulün malzeme açısından eşdeğer birim çarpanı.","ad":"Malzeme tamamlanma derecesi"},{"deger":"%50","anlam":"Dönem sonu yarı mamulün şekillendirme açısından eşdeğer birim çarpanı.","ad":"Şekillendirme tamamlanma derecesi"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.275; evre maliyet sistemi - eşdeğer birim teorisi","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Dönem başı yarı mamul malzeme maliyeti 4.000 TL (soruda verilen); Dönem başı yarı mamul şekillendirme maliyeti 1.200 TL (soruda verilen); Dönem içi malzeme maliyeti 46.000 TL (soruda verilen); Dönem içi şekillendirme maliyeti 34.800 TL (soruda verilen); Tamamlanan mamul 8.000 birim (soruda verilen); Dönem sonu yarı mamul 2.000 birim (soruda verilen); Malzeme tamamlanma oranı %100 (soruda verilen); Şekillendirme tamamlanma oranı %50 (soruda verilen)","anlatim":"Soru bize dönem başı ve dönem içi maliyetleri, tamamlanan ve dönem sonu yarı mamul miktarlarını, tamamlanma oranlarını veriyor. Bu sayılarla eşdeğer birim ve birim maliyet hesaplayacağız.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]]},{"formul":"Malzeme Eşdeğer Birimi = Tamamlanan + Dönem Sonu yarı mamul × Tamamlanma Oranı = 8.000 (soruda verilen) + 2.000 (soruda verilen) × %100 (soruda verilen) = 10.000","anlatim":"Eşdeğer birim, bir maliyet unsurunun o dönemde kaç birimlik iş yaptığını gösterir. Malzeme sürecin başında tam eklendiği için dönem sonu yarı mamul de %100 tamamlanmış sayılır.","doldur":[[10,1]]},{"formul":"Şekillendirme Eşdeğer Birimi = Tamamlanan + Dönem Sonu yarı mamul × Tamamlanma Oranı = 8.000 (soruda verilen) + 2.000 (soruda verilen) × %50 (soruda verilen) = 9.000","anlatim":"Şekillendirme sürece yayılı gerçekleştiği için dönem sonu yarı mamul yalnızca %50 tamamlanmış kabul edilir. Bu yüzden eşdeğer birim malzemeden daha düşük çıkar.","doldur":[[11,1]]},{"formul":"Toplam Malzeme Maliyeti = Dönem Başı yarı mamul Maliyeti + Dönem İçi Maliyet = 4.000 (soruda verilen) + 46.000 (soruda verilen) = 50.000; Toplam Şekillendirme Maliyeti = Dönem Başı yarı mamul Maliyeti + Dönem İçi Maliyet = 1.200 (soruda verilen) + 34.800 (soruda verilen) = 36.000","anlatim":"Ortalama yöntemde dönem başı stok maliyeti ile dönem içi maliyet ayrım yapılmadan toplanır. Her unsur için toplam maliyeti ayrı ayrı buluyoruz.","doldur":[[12,1],[13,1]]},{"formul":"Birim Malzeme Maliyeti = Toplam Malzeme Maliyeti / Malzeme Eşdeğer Birimi = 50.000 (4. adımda bulduk) / 10.000 (2. adımda bulduk) = 5,00 TL; Birim Şekillendirme Maliyeti = Toplam Şekillendirme Maliyeti / Şekillendirme Eşdeğer Birimi = 36.000 (4. adımda bulduk) / 9.000 (3. adımda bulduk) = 4,00 TL","anlatim":"Birim maliyet, toplam maliyetin eşdeğer birime bölünmesiyle bulunur. Malzeme ve şekillendirme için ayrı birim maliyet hesaplanır çünkü tamamlanma oranları farklı.","doldur":[[14,1],[15,1]]},{"formul":"Dönem Sonu yarı mamul Malzeme Payı = Dönem Sonu yarı mamul Miktarı × Birim Malzeme Maliyeti = 2.000 (soruda verilen) × 5,00 (5. adımda bulduk) = 10.000; Dönem Sonu yarı mamul Şekillendirme Payı = Dönem Sonu yarı mamul Miktarı × Tamamlanma Oranı × Birim Şekillendirme Maliyeti = 2.000 (soruda verilen) × %50 (soruda verilen) × 4,00 (5. adımda bulduk) = 4.000","anlatim":"Dönem sonu yarı mamulün maliyeti, kendi eşdeğer birimi kadar birim maliyetle çarpılarak bulunur. Şekillendirmede tamamlanma oranı da çarpıma dahil edilir çünkü yarı mamul o unsurda tam bitmemiştir.","doldur":[[16,1],[17,1]]},{"formul":"Dönem Sonu Yarı Mamul Stokunun Maliyeti = Malzeme Payı + Şekillendirme Payı = 10.000 (6. adımda bulduk) + 4.000 (6. adımda bulduk) = 14.000 TL","anlatim":"İki unsurun payını topladığımızda dönem sonu yarı mamulün toplam maliyetine ulaşırız. Bu 14.000 TL, sorunun cevabıdır.","doldur":[[18,1]]},{"formul":"Yanlış yol: Şekillendirme payını tamamlanma oranı çarpmadan hesaplamak = 2.000 × 4,00 = 8.000 (HATALI) → doğrusu 4.000 (6. adımda bulduk)","anlatim":"Şekillendirme sürece yayılı olduğu için dönem sonu yarı mamul o unsurda tam bitmemiştir. Tamamlanma oranını çarpmayı unutmak sonucu yanlış büyütür.","doldur":[]}],"anahtar":[{"ornek":"maliyet","kok":"maliye"},{"ornek":"tamamlanan","kok":"tamaml"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"şekillendirme","kok":"şekill"},{"ornek":"hesaplanır","kok":"hesapl"},{"ornek":"malzeme","kok":"malzem"}],"konuGiris":{"harita":"Eşdeğer birim ne zaman hesaplanır: dönem sonunda hem tamamlanan hem yarı kalan birimler varken hesaplanır. Nasıl ölçülür: malzeme ve dönüşüm maliyeti için tamamlanma yüzdesi ayrı ayrı uygulanarak ölçülür. Nasıl kaydedilir: bulunan birim maliyet, tamamlanan ve yarı mamul birimlere ayrı ayrı çarpılarak kaydedilir.","desen":"Bu tip sorularda tuzak, malzeme ile şekillendirme tamamlanma yüzdesinin karıştırılıp tek oranla hesap yapılmasıdır; arşivde bir dönem çıkmıştır. İkinci tuzak, dönem başı yarı mamul maliyetinin dönem içi maliyetle ayrı tutulup ortalama yöntemde birleştirilmemesidir. Bu soru p.28 eşdeğer birim ve ortalama yöntem ayrımı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"tamamlanan birim ile dönem sonu yarı mamulün tamamlanma oranına göre çarpımının toplamı","ad":"Eşdeğer birim","kim":"işletme yönetimi üretim akışına göre belirler"},{"kaynak":"kuraldan bilinir","tanim":"Dönem başı yarı mamul maliyeti ile dönem içi maliyetin birlikte harmanlanarak tek birim maliyet üretmesi","ad":"Ortalama yöntem","kim":"standart tanımlar belirler"},{"kaynak":"sen hesaplarsın","tanim":"dönem başı ve dönem içi maliyet toplamının toplam eşdeğer birime bölünmesiyle bulunan tutar","ad":"Birim eşdeğer maliyet","kim":"işletme yönetimi hesaplar"},{"kaynak":"soruda verilir","tanim":"bir sürecin ne kadarının bittiğini gösteren, malzeme ve dönüşüm için ayrı belirlenen oran","ad":"Tamamlanma yüzdesi","kim":"işletme yönetimi süreç gözlemine göre belirler"}],"sinavda":"Dönem başı ve dönem içi maliyetler, tamamlanan birim sayısı ve dönem sonu yarı mamulün tamamlanma yüzdeleri verilir; dönem sonu yarı mamul stokunun tutarı istenir.","panel_ornek":"Bir pastane haftada 300 adet pasta hazırlıyor, hafta sonunda 60 pasta krema aşamasında yarım kalmış ve yüzde elli tamamlanmış sayılıyor. Malzeme baştan tam konduğu için bu altmış pasta malzemede tam, kremada yarım sayılır. Böylece toplam üretim miktarı basit toplamdan değil, tamamlanma oranına göre hesaplanır.","ornek":"Bir pastane haftada 300 adet pasta hazırlıyor, hafta sonunda 60 pasta krema aşamasında yarım kalmış ve yüzde elli tamamlanmış sayılıyor. Malzeme baştan tam konduğu için bu altmış pasta malzemede tam, kremada yarım sayılır. Böylece toplam üretim miktarı basit toplamdan değil, tamamlanma oranına göre hesaplanır.","yontemler":"Malzeme ve şekillendirme için eşdeğer birim ayrı hesaplanır, her biri için ayrı birim maliyet bulunur; en kritik kural, dönem sonu yarı mamul tutarının bu iki ayrı birim maliyetin ilgili eşdeğer miktarla çarpılıp toplanmasıyla bulunmasıdır.","nedir":"Evre maliyet sisteminde eşdeğer birim, sürekli akan üretimde tamamlanan ve yarı mamul kalan birimleri ortak bir ölçüde birleştirir. Sınav bu ölçünün doğru kurulup kurulmadığını ve birim maliyetin doğru bölündüğünü ölçer."},"olay":"Malzeme eşdeğer birim=8.000+2.000×1,00=10.000; birim malzeme maliyeti=(4.000+46.000)/10.000=5,00. Şekillendirme eşdeğer birim=8.000+2.000×0,50=9.000; birim şekillendirme maliyeti=(1.200+34.800)/9.000=4,00. Dönem sonu yarı mamul maliyeti=2.000×5,00 + 2.000×0,50×4,00 = 10.000+4.000=14.000.","tuzak":{"D":{"ad":"Fiili Miktar Tuzağı","metin":"Tamamlanma yüzdesini hiç uygulamadan dönem sonu yarı mamulü sanki tam mamulmüş gibi fiili miktarıyla maliyetlendirdin. Doğrusu: yarı mamul fiili miktarı değil, tamamlanma yüzdesiyle çarpılmış eşdeğer miktarı esas alınmalıdır."},"E":{"ad":"Çift Sayım Tuzağı","metin":"Dönem başı yarı mamul birimlerini dönem sonu stokuna da ekleyip aynı birimleri iki kez saydın. Doğrusu: dönem başı yarı mamul zaten tamamlanan mamul miktarının içindedir, dönem sonu yarı mamul ayrı ve sabit verilen bir sayıdır."},"A":{"ad":"Eksik Unsur Tuzağı","metin":"Şekillendirme maliyetinin de dönem sonu yarı mamule pay verilmesi gerektiğini atlayıp yalnızca malzeme payını hesapladın. Doğrusu: her iki maliyet unsuru da eşdeğer birim üzerinden ayrı ayrı paylaştırılmalıdır."},"B":{"ad":"Yüzde Karışıklığı Tuzağı","metin":"Malzeme ve şekillendirme tamamlanma yüzdelerini birbirine karıştırıp malzemeye %50, şekillendirmeye %100 uyguladın. Doğrusu: malzeme %100, şekillendirme %50 ile ayrı hesaplanmalıdır."}},"celdiriciYol":{"D":"2.000×5,00 + 2.000×4,00 = 10.000+8.000=18.000 (tamamlanma yüzdesi uygulanmadan fiili miktarın esas alınması)","E":"(2.000+1.000)×5,00 + (2.000+1.000)×0,50×4,00 = 15.000+6.000=21.000 (dönem başı yarı mamul biriminin dönem sonu stokuna yanlışlıkla dahil edilmesi)","A":"2.000×5,00=10.000 (şekillendirme maliyetinin atlanması)","B":"2.000×0,50×5,00 + 2.000×1,00×4,00 = 5.000+8.000=13.000 (malzeme ve şekillendirme tamamlanma yüzdelerinin ters kullanılması)"},"hap":"Evre maliyet sisteminde ortalama yöntemde eşdeğer birim, tamamlanan mamul miktarına dönem sonu yarı mamulün tamamlanma yüzdesiyle çarpılmış payının eklenmesiyle bulunur ve her maliyet unsuru için ayrı hesaplanır.","teshis":{"C":{"gercek":"Ortalama yöntemde eşdeğer birim = tamamlanan birim + dönem sonu yarı mamul × tamamlanma yüzdesi formülü her maliyet unsuru için ayrı uygulanır ve birim maliyetler bu eşdeğer birimlere bölünür.","ayirt":"Malzeme ve şekillendirme için eşdeğer birimleri ayrı ayrı hesapladım mı?","paragraf":"Evre maliyet sistemi - eşdeğer birim teorisi","yanilgi":"Eşdeğer birim hesaplamanın gereksiz bir ayrıntı olduğunu, doğrudan fiili miktarların yeterli olduğunu düşündün."},"E":{"gercek":"Dönem başı yarı mamul birimleri dönem içinde tamamlanan mamul miktarına dahildir; dönem sonu yarı mamul stoku bunlardan bağımsız, ayrı verilen sabit bir birim sayısıdır.","ayirt":"Dönem sonu yarı mamul miktarına başka bir döneme ait birimleri eklemiş miyim?","paragraf":"Evre maliyet sistemi - eşdeğer birim teorisi","yanilgi":"Dönem başı yarı mamul birimlerini dönem sonu stokuna da dahil ederek aynı birimleri iki kez saydın."},"A":{"gercek":"Şekillendirme sürece yayılı eklendiği için tamamlanmamış birimlere de kısmi pay verilir; 213 sayılı Vergi Usul Kanununun 275 inci maddesi maliyet unsurlarının mamule isabet eden hisseleriyle dikkate alınmasını öngörür.","ayirt":"Yarı mamul için sadece bir maliyet unsurunu mu hesapladım?","paragraf":"Vergi Usul Kanunu m.275","yanilgi":"Şekillendirme maliyetinin de dönem sonu yarı mamule pay verilmesi gerektiğini atladın, sadece malzeme maliyetini yeterli sandın."},"D":{"gercek":"Dönem sonu yarı mamul henüz tamamlanmadığı için fiili miktar değil, tamamlanma yüzdesiyle çarpılmış eşdeğer miktar esas alınır.","ayirt":"Yarı mamul birimlerini eşdeğer miktara mı yoksa fiili miktara mı çevirdim?","paragraf":"Evre maliyet sistemi - eşdeğer birim teorisi","yanilgi":"Tamamlanma yüzdesini hiç uygulamadan, dönem sonu yarı mamulün fiili miktarını doğrudan tam birim gibi maliyetlendirdin."},"B":{"gercek":"Malzeme sürecin başında tam verildiği için %100, şekillendirme ise fiilen tamamlanan kısım kadar (%50) dikkate alınır; unsurlar birbirine karıştırılamaz.","ayirt":"Hangi yüzdeyi hangi maliyet unsuruna uyguladığımı tekrar kontrol ettim mi?","paragraf":"Evre maliyet sistemi - eşdeğer birim teorisi","yan // 06.09 seviye: ölçümden türer (bkz. kart kurulumu). k = sınıf anahtarı, ad = ekran adı (Nöbet dili: Isınma / Nöbet / Alarm), neden = ipucu.
function seviyeHesapla(s){
  const o=s.olcum||{}; const tip=s.tip||'teori'; const ders=String(s.ders||'');
  if(o.sim&&o.sim.dogru===false) return {k:'alarm',ad:'🔴 Alarm',neden:'Nöbetçi öğrencisi bu anlatımla ikizi çözemedi; dikkat ister'};
  if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

try{ KUTU.kayit=JSON.parse(localStorage.getItem('kc_kayit')||'[]'); KUTU.kutu=JSON.parse(localStorage.getItem('kc_kutu')||'[]'); KUTU.oyun=JSON.parse(localStorage.getItem('kc_oyun')||'[]'); KUTU.ileri=parseInt(localStorage.getItem('kc_ileri')||'0')||0; }catch(e){}

// 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}
function skorCiz(){ const sk=skorHesapla(); const vade=KUTU.kutu.filter(x=>x.due<=simdi()).length; const azVeri=KUTU.kayit.length<5; document.querySelectorAll('.skorCip').forEach(el=>{ el.textContent=azVeri?'🎯 —':('🎯 %'+sk.toplam); el.title=azVeri?'Hazırlık skoru 5 sorudan sonra görünür':'Hazırlık skoru'; }); /* 05.09: ilk yanlıştan sonra "%4" görmek caydırıcı; 5 cevaptan önce yüzde yok */ document.querySelectorAll('.kutuCip').forEach(el=>{ el.textContent='📥 '+KUTU.kutu.length+(vade?' ·'+vade+' hazır':''); el.classList.toggle('hazir',vade>0); }); }
function kartSifirla(i){ const k=akis.children[i]; if(!k) return; delete durum.cevap[i]; k.querySelectorAll('.sik').forEach(x=>{ x.disabled=false; x.classList.remove('dogru','yanlis'); }); const p=k.querySelector('.panel'); p.classList.remove('acik'); k.querySelectorAll('.sek').forEach(x=>x.classList.remove('acik')); k.querySelectorAll('.cip2').forEach(x=>x.classList.remove('acik')); k.querySelector('.ipucu').style.display=''; document.querySelectorAll('.noktalar i[data-j="'+i+'"]').forEach(n=>{ n.classList.remove('ok','yan'); }); k.scrollIntoView({behavior:'smooth'}); }

   +'<div class="skorBuyuk">%'+sk.toplam+'</div><div class="ipnot">Sınav DNA’sı ağırlıklı: çok çıkan konudaki yanlış daha çok düşürür. Çözülen '+sk.cozulen+' / '+sk.n+' konu · Sen çöz: '+sk.oyunTam+' ipuçsuz (tam puan) · '+sk.oyunIpuclu+' ipuçlu (yarım puan).</div>'
   +sk.ders.map(d=>'<div class="dersSat"><span>'+esc(d.ad)+'</span><div class="bar"><i style="width:'+d.yuzde+'%"></i></div><b>%'+d.yuzde+'</b></div>').join('')
   +'<div class="et" style="margin-top:14px">📥 Yanlış kutusu ('+KUTU.kutu.length+')</div>'
   +(KUTU.kutu.length?KUTU.kutu.map(x=>{ const i=SORULAR.findIndex(s=>s.id===x.id); return '<div class="kutuSat"><div><b>'+esc(x.konu)+'</b> <span class="ipnot" style="display:inline">· '+(x.tur>=2?'2. tur (7 gün)':'1. tur (2 gün)')+' · '+gunStr(x.due)+'</span></div>'+(x.due<=t&&i>=0?'<button class="btn mavi kutuCoz" data-i="'+i+'">Şimdi çöz</button>':'')+'</div>'; }).join(''):'<p class="ipnot">Kutu boş. Yanlış yaptığın her soru buraya düşer ve 2 gün sonra geri gelir.</p>')
   +'<div class="btnrow" style="margin-top:14px"><button class="btn" id="kutuIleri">⏩ Demo: 2 gün ileri sar</button><button class="btn gri" id="kutuSifirla">Verileri sıfırla</button></div>'
   +'<p class="ipnot">Nasıl çalışır: yanlış → kutuya girer, 2 gün sonra geri gelir; o gün doğru bilirsen 7 gün sonra bir kez daha gelir; onu da bilirsen kutudan çıkar ve ustalık tam sayılır.</p></div>';
  e.classList.add('acik');
  e.querySelector('#kutuKapat').addEventListener('click',()=>e.classList.remove('acik'));
  e.querySelector('#kutuIleri').addEventListener('click',()=>{ KUTU.ileri+=2*GUN; kutuKaydet(); kutuEkraniAc(); skorCiz(); });
  e.querySelector('#kutuSifirla').addEventListener('click',()=>{ if(confirm('Skor, kutu ve seri sıfırlansın mı?')){ KUTU.kayit=[]; KUTU.kutu=[]; KUTU.ileri=0; kutuKaydet(); location.reload(); } });
  e.querySelectorAll('.kutuCoz').forEach(b=>b.addEventListener('click',()=>{ e.classList.remove('acik'); kartSifirla(parseInt(b.dataset.i)); }));
}

    // fare tekerlegi, klavye oklari, parmakla yatay kaydirma (sola = ileri)
    let tekerKilit=0; serit.addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-tekerKilit<350) return; tekerKilit=t; adimGit((e.deltaY||e.deltaX)>0?1:-1); },{passive:false});
    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});
// --- son kart
const son=document.createElement('section'); son.className='kart son';
son.innerHTML='<div class="ust"><span>Nöbet bitti</span>'+noktalar(-1)+'<span>&nbsp;</span></div><div class="govde son" style="display:flex;flex-direction:column;justify-content:center"><div id="sonSkor"></div></div>';
akis.appendChild(son);
document.querySelectorAll('.skorCip,.kutuCip').forEach(b=>b.addEventListener('click',kutuEkraniAc)); skorCiz();
if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i').forEach(n=>n.classList.toggle('simdi',n.dataset.j==String(i)||(i>=SORULAR.length&&n.dataset.j==='son')));
  if(i<SORULAR.length&&durum.cevap[i]===undefined&&!durum.t0[i]) durum.t0[i]=Date.now();   // 06.09: karta gelince süre başlar
  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='PageDown'){ akis.scrollBy({top:akis.clientHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='PageUp'){ akis.scrollBy({top:-akis.clientHeight,behavior:'smooth'}); } });
</script></body></html>
