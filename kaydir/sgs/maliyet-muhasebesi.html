n.","konu":"standart maliyet sapma kapanisi","tablo":{"basliklar":["Kalem","Hesaplama","Tutar"],"satirlar":[["VERİLENLER","-","-"],["Standart miktar","25.000 kg","-"],["Standart fiyat","12 TL/kg","-"],["Fiili miktar","27.000 kg","-"],["Fiili fiyat","11 TL/kg","-"],["151 YARI MAMULLER-ÜRETİM hesabı bakiyesi","60.000 TL","-"],["152 MAMULLER hesabı bakiyesi","90.000 TL","-"],["620 SATILAN MAMULLER MALİYETİ (-) hesabı bakiyesi","150.000 TL","-"],["HESAP","-","-"],["Miktar sapması","(27.000-25.000) x 12","24.000 (olumsuz)"],["Fiyat sapması","(11-12) x 27.000","-27.000 (olumlu)"],["Toplam (net) sapma","24.000 + (-27.000)","-3.000 (net olumlu)"],["Dağıtım esası toplamı","60.000+90.000+150.000","300.000"],["620 SATILAN MAMULLER MALİYETİ (-) hesabı isabet eden pay","3.000 x 150.000/300.000","1.500 (alacaklı)"]]},"siklar":{"C":"620 Satılan Mamul Maliyeti hesabı 3.000 TL borçlu","E":"152 Mamuller hesabı 900 TL alacaklı","A":"620 Satılan Mamul Maliyeti hesabı 1.500 TL alacaklı","D":"620 Satılan Mamul Maliyeti hesabı 3.000 TL alacaklı","B":"620 Satılan Mamul Maliyeti hesabı 1.500 TL borçlu"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2]],"tablo":{"basliklar":["Kalem","Hesaplama","Tutar"],"satirlar":[["Miktar sapması","(22.000-20.000) x 15","30.000 (olumsuz)"],["Fiyat sapması","(14-15) x 22.000","-22.000 (olumlu)"],["Toplam (net) sapma","30.000 + (-22.000)","8.000 (net olumsuz)"],["Dağıtım esası toplamı","40.000+60.000+100.000","200.000"],["151 YARI MAMULLER-ÜRETİM hesabı isabet eden pay","8.000 x 40.000/200.000","1.600 (borçlu)"]]},"tur":"tablo","soru":"Standart maliyet sistemi uygulayan bir tekstil işletmesinde, dönem içinde üretilen bir mamulün direkt ilk madde ve malzemesine ilişkin standart miktar 20.000 kg, standart fiyat 15 TL/kg; fiili miktar 22.000 kg, fiili fiyat ise 14 TL/kg olarak gerçekleşmiştir. Dönem sonunda 151 Yarı Mamuller – Üretim hesabının borç bakiyesi 40.000 TL, 152 Mamuller hesabının borç bakiyesi 60.000 TL ve 620 Satılan Mamul Maliyeti hesabının borç bakiyesi 100.000 TL\u0027dir. İşletme, sapma tutarını bu üç hesabın dönem sonu bakiyeleri oranında dağıtarak kapatmaktadır. Buna göre, sapmanın kapanış kaydında 151 Yarı Mamuller – Üretim hesabının kullanımına ilişkin olarak aşağıdakilerden hangisi doğrudur?","verilen":[],"hedef":"Tabloyu doldur ve 151 Yarı Mamuller – Üretim hesabına isabet eden sapma payının tutarını ve yönünü bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Standart maliyet sistemi uygulayan bir mobilya üretim işletmesinde, dönem içinde üretilen bir mamulün direkt ilk madde ve malzemesine ilişkin standart miktar 25.000 kg, standart fiyat 12 TL/kg; fiili miktar 27.000 kg, fiili fiyat ise 11 TL/kg olarak gerçekleşmiştir. Dönem sonunda 151 Yarı Mamuller – Üretim hesabının borç bakiyesi 60.000 TL, 152 Mamuller hesabının borç bakiyesi 90.000 TL ve 620 Satılan Mamul Maliyeti hesabının borç bakiyesi 150.000 TL\u0027dir. İşletme, sapma tutarını bu üç hesabın dönem sonu bakiyeleri oranında dağıtarak kapatmaktadır. Buna göre, sapmanın kapanış kaydında 620 Satılan Mamul Maliyeti hesabının kullanımına ilişkin olarak aşağıdakilerden hangisi doğrudur?","kayitBaslik":"1) Sapma hesaplarının kapatılması","id":"sgs-t1-maliyet-zor/kp-24","verilenler":[{"deger":"25.000 kg","anlam":"Bir birim üretim için önceden belirlenmiş normal madde miktarı; miktar sapmasında fiili miktardan çıkarılır.","ad":"Standart miktar"},{"deger":"12 TL/kg","anlam":"Önceden belirlenmiş birim madde fiyatı; miktar sapmasının çarpanıdır.","ad":"Standart fiyat"},{"deger":"27.000 kg","anlam":"Gerçekleşen madde kullanımı; miktar sapmasında standarttan çıkarılır, fiyat sapmasının çarpanıdır.","ad":"Fiili miktar"},{"deger":"11 TL/kg","anlam":"Gerçekleşen birim madde fiyatı; fiyat sapmasında standart fiyattan çıkarılır.","ad":"Fiili fiyat"},{"deger":"60.000 TL","anlam":"Dağıtım esasına giren yarı mamul stoku borç bakiyesi.","ad":"151 hesap bakiyesi"},{"deger":"90.000 TL","anlam":"Dağıtım esasına giren mamul stoku borç bakiyesi.","ad":"152 hesap bakiyesi"},{"deger":"150.000 TL","anlam":"Dağıtım esasına giren satılan mamul maliyeti borç bakiyesi; istenen payın ait olduğu hesap.","ad":"620 hesap bakiyesi"}],"dayanak":"Maliyet muhasebesi - standart maliyet miktar/fiyat sapması formülleri ve sapma kapanış tekniği; Tekdüzen Hesap Planı 151/152/620, 713","dogru":"A","oyunBonus":{"soru":"Standart maliyet sistemi uygulayan bir mobilya üretim işletmesinde, dönem içinde üretilen bir mamulün direkt ilk madde ve malzemesine ilişkin standart miktar 50.000 kg, standart fiyat 12 TL/kg; fiili miktar 54.000 kg, fiili fiyat ise 11 TL/kg olarak gerçekleşmiştir. Dönem sonunda 151 Yarı Mamuller – Üretim hesabının borç bakiyesi 120.000 TL, 152 Mamuller hesabının borç bakiyesi 180.000 TL ve 620 Satılan Mamul Maliyeti hesabının borç bakiyesi 300.000 TL\u0027dir. İşletme, sapma tutarını bu üç hesabın dönem sonu bakiyeleri oranında dağıtarak kapatmaktadır. Buna göre, sapmanın kapanış kaydında 620 Satılan Mamul Maliyeti hesabının kullanımına ilişkin olarak aşağıdakilerden hangisi doğrudur?","tur":"olcek","kayit":[{"tutar":"54.000","taraf":"B","hesap":"731 DİREKT İLK MADDE VE MALZEME FİYAT FARKI HESABI"},{"tutar":"48.000","taraf":"A","hesap":"732 DİREKT İLK MADDE VE MALZEME MİKTAR FARKI HESABI"},{"tutar":"600","taraf":"A","hesap":"151 YARI MAMULLER - ÜRETİM"},{"tutar":"900","taraf":"A","hesap":"152 MAMULLER"},{"tutar":"3.000","taraf":"A","hesap":"620 SATILAN MAMULLER MALİYETİ"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Standart miktar 25.000 kg (soruda verilen); Standart fiyat 12 TL/kg (soruda verilen); Fiili miktar 27.000 kg (soruda verilen); Fiili fiyat 11 TL/kg (soruda verilen); 151 bakiyesi 60.000 TL (soruda verilen); 152 bakiyesi 90.000 TL (soruda verilen); 620 bakiyesi 150.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: standart miktar 25.000 kg, standart fiyat 12 TL/kg, fiili miktar 27.000 kg, fiili fiyat 11 TL/kg. Ayrıca 151, 152, 620 hesaplarının borç bakiyeleri 60.000, 90.000, 150.000 TL olarak verilmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]]},{"formul":"Kapsam: 620 = satılan mamullerin maliyeti; 152 alacak verince 620 borç yazılır (normal işleyiş)","anlatim":"620 Satılan Mamul Maliyeti, satılan mamulün maliyetini taşıyan gider hesabıdır - normalde borç çalışır. Sapma kapanışında bu hesap 152\u0027den gelen tutarla ilişkilendirilir, taraf sapmanın yönüne göre değişir.","doldur":[]},{"formul":"Miktar Sapması = (Fiili Miktar − Standart Miktar) × Standart Fiyat = (27.000 (soruda verilen) − 25.000 (soruda verilen)) × 12 (soruda verilen) = 24.000 TL (olumsuz)","anlatim":"Miktar sapması, fiili miktarın standarttan ne kadar fazla kullanıldığını standart fiyatla ölçer. Fazla kullanım olumsuz sapma demektir, çünkü işletme daha çok malzeme harcamış.","doldur":[[9,1],[9,2]]},{"formul":"Fiyat Sapması = (Fiili Fiyat − Standart Fiyat) × Fiili Miktar = (11 (soruda verilen) − 12 (soruda verilen)) × 27.000 (soruda verilen) = -27.000 TL (olumlu)","anlatim":"Fiyat sapması, fiili fiyatın standarttan farkını fiili miktarla çarpar. Standarttan ucuza alınmış, bu yüzden olumlu sapma çıkıyor.","doldur":[[10,1],[10,2]]},{"formul":"Net Sapma = Miktar Sapması + Fiyat Sapması = 24.000 (3. adımda bulduk) + (-27.000) (4. adımda bulduk) = -3.000 TL (net olumlu)","anlatim":"İki sapmayı toplayıp net sapmayı buluyoruz, çünkü kapanışta tek bir tutar dağıtılacak. Olumsuz ve olumlu birbirini büyük ölçüde götürüyor, net sonuç olumlu çıkıyor.","doldur":[[11,1],[11,2]]},{"formul":"Dağıtım Esası Toplamı = 151 bakiyesi + 152 bakiyesi + 620 bakiyesi = 60.000 (soruda verilen) + 90.000 (soruda verilen) + 150.000 (soruda verilen) = 300.000 TL","anlatim":"Dağıtım esası, sapmanın hangi oranla paylaştırılacağını belirler. Üç hesabın dönem sonu bakiyeleri toplanarak ortak payda bulunur.","doldur":[[12,1],[12,2]]},{"formul":"620 Payı = Net Sapma × (620 Bakiyesi / Dağıtım Esası Toplamı) = 3.000 (5. adımda bulduk, mutlak değer) × (150.000 (soruda verilen) / 300.000 (6. adımda bulduk)) = 1.500 TL","anlatim":"620 hesabının payı, net sapmanın 620 bakiyesinin toplam içindeki oranı kadarını alır. Bu, dağıtım esasına göre adil paylaşımı sağlar.","doldur":[[13,1],[13,2]]},{"formul":"620 SATILAN MAMUL MALİYETİ (ALACAK) 1.500 = 3.000 (5. adımda bulduk) × 150.000 (soruda verilen) / 300.000 (6. adımda bulduk)","anlatim":"Net sapma olumlu olduğu için ilgili hesaplar alacaklı kapatılır, çünkü gerçek maliyet standarttan düşük çıkmıştır. Varlık artar borç, kaynak artar alacak mantığı yerine burada gider hesabı azaltıldığı için alacak yazılır.","doldur":[]},{"formul":"Ters durum: net sapma olumsuz olsaydı → 620 hesabı BORÇ çalışırdı","anlatim":"Ters durumda net sapma olumsuz çıksaydı, hesaplar borçlu kapatılırdı. Çünkü o zaman gerçek maliyet standardın üzerinde kalmış olurdu.","doldur":[]},{"formul":"Yanlış yol: 24.000 (miktar sapması) × 150.000 / 300.000 = 12.000 (HATALI) → doğrusu 1.500 (7. adımda bulduk)","anlatim":"En sık hata: öğrenciler net sapmayı bulmadan sadece miktar sapmasını (24.000) dağıtım hesabına sokar. Ama kapanışta dağıtılan tutar net sapmadır, tek başına miktar ya da fiyat sapması değildir.","doldur":[]}],"anahtar":[{"ornek":"standart","kok":"standa"},{"ornek":"miktar","kok":"miktar"},{"ornek":"dağıtılır","kok":"dağıtı"},{"ornek":"sapması","kok":"sapmas"},{"ornek":"maliyet","kok":"maliye"},{"ornek":"olumlu","kok":"olumlu"},{"ornek":"620","kok":"620"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda sapma tutarı üç hesaba dağıtılıp kapatılırken. Nasıl ölçülür: toplam sapma tutarının, 151-152-620 hesaplarının borç bakiyeleri toplam içindeki oranıyla çarpılmasıyla. Nasıl kaydedilir: sapma olumlu ise ilgili hesaplar borçlu, olumsuz ise alacaklı olacak şekilde kapanış kaydı yapılır.","desen":"Soru önce miktar ve fiyat sapmalarının ayrı ayrı doğru formülle hesaplanmasını, sonra toplam sapmanın üç hesap bakiyesi oranında bölünmesini ister. Tuzak, miktar sapmasında standart fiyat yerine fiili fiyatın kullanılması veya dağıtım oranının bakiye yerine üretim miktarına göre yanlış kurulmasıdır. Bu soru standart maliyet sapmaları ve kademeli dağıtım mantığının birleşimi noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Fiili miktar ile standart miktar farkının standart fiyatla çarpımı","ad":"Miktar (kullanım) sapması","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Fiili fiyat ile standart fiyat farkının fiili miktarla çarpımı","ad":"Fiyat sapması","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Her hesabın dönem sonu bakiyesinin üç hesap toplamına oranı","ad":"Dağıtım oranı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Sapma olumlu ise hesaplar borçlanır, olumsuz ise alacaklanır","ad":"Kapanış kaydı yönü","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda standart ve fiili miktar-fiyat verileri ile üç hesabın bakiyeleri verilir, 620 hesabına düşen kapanış payının doğru ifadesi istenir.","panel_ornek":"Bir arkadaş grubu 400 TL\u0027lik ortak yemek faturasını, o anki cepteki para oranına göre üç kişi arasında paylaşıyor: biri 100, biri 150, biri 150 TL öder. Herkes toplam bakiyesiyle orantılı pay alır, eşit bölünmez. Sapma kapanışında da tutar, hesapların bakiye oranına göre bölüşülür.","ornek":"Bir arkadaş grubu 400 TL\u0027lik ortak yemek faturasını, o anki cepteki para oranına göre üç kişi arasında paylaşıyor: biri 100, biri 150, biri 150 TL öder. Herkes toplam bakiyesiyle orantılı pay alır, eşit bölünmez. Sapma kapanışında da tutar, hesapların bakiye oranına göre bölüşülür.","yontemler":"Tek yöntem: toplam sapma önce miktar ve fiyat sapması olarak ayrı hesaplanır, sonra bulunan tutar üç hesabın bakiye oranına göre bölünüp kapanış kaydına yansıtılır; en kritik nokta sapmanın olumlu mi olumsuz mi olduğunu doğru yorumlamaktır.","nedir":"Standart maliyet sapma kapanışı, dönem sonunda hesaplanan sapma tutarının ilgili stok ve gider hesaplarına dağıtılıp kapatılmasıdır. Sınav bu dağıtımda hangi hesaba ne kadar pay düştüğünü ve kaydın yönünü ölçer."},"olay":"Miktar sapması (27.000-25.000)x12=24.000 (olumsuz); Fiyat sapması (11-12)x27.000=-27.000 (olumlu); Toplam sapma=24.000-27.000=-3.000 (net olumlu); dağıtım esası 60.000+90.000+150.000=300.000; 620 payı=3.000x150.000/300.000=1.500.","tuzak":{"C":{"ad":"Dağıtım Atlama Tuzağı","metin":"Toplam sapma tutarını (3.000 TL) hesaplar arasında bakiye oranında paylaştırmadan doğrudan 620 hesabına yazıyor, üstüne tarafı da ters çeviriyorsun. Doğrusu: sapma önce 151/152/620 arasında oranlı dağıtılır, sonra taraf belirlenir."},"E":{"ad":"Hesap Seçimi Tuzağı","metin":"Doğru payı ve doğru tarafı bulduğun halde 620 yerine 152 Mamuller hesabının payını (900 TL) soruyla karıştırıp işaretliyorsun. Doğrusu: 900 TL, 152 hesabına ait paydır; 620 hesabının payı 1.500 TL\u0027dir."},"D":{"ad":"Oranlı Dağıtımı Atlama Tuzağı","metin":"Net sapmanın olumlu olduğunu doğru görmüş ama toplam tutarı (3.000 TL) hiç dağıtmadan tek başına 620 hesabına yüklüyorsun. Doğrusu: 620 hesabı toplam sapmanın yalnızca kendi payı olan 1.500 TL\u0027sini alır."},"B":{"ad":"Ters Taraf Tuzağı","metin":"Doğru payı (1.500 TL) bulduğu halde net sapmanın olumlu olduğunu, yani ilgili hesapların ALACAKLI çalışması gerektiğini gözden kaçırıp tutarı borç tarafına yazıyorsun. Doğrusu: olumlu sapma hesabı azaltıcı yönde, yani alacaklı kapatılır."}},"celdiriciYol":{"C":"24.000 - 27.000 = -3.000, tutar dağıtılmadan doğrudan 620 hesabına 3.000 borçlu yazıldı (dağıtım atlandı ve taraf ters çevrildi)","E":"3.000 x 90.000/300.000 = 900 (152 hesabının payı hesaplanıp 620 yerine işaretlendi)","D":"24.000 - 27.000 = -3.000, dağıtım yapılmadan doğrudan 620 hesabına 3.000 alacaklı yazıldı (oranlı dağıtım atlandı)","B":"3.000 x 150.000/300.000 = 1.500 (doğru pay bulundu ama taraf ters çevrilip borçlu yazıldı)"},"hap":"Standart maliyet sapmalarının kapanışında olumlu sapma ilgili stok ve maliyet hesaplarını alacaklı, olumsuz sapma borçlu çalıştırır ve tutar hesapların dönem sonu bakiyeleri oranında dağıtılır.","teshis":{"C":{"gercek":"Kapanışta sapma tutarı, ilgili hesapların dönem sonu bakiyeleri oranında dağıtılır; işletme burada bu yöntemi açıkça uygulamaktadır.","ayirt":"Sapmayı dağıtmadan tek hesaba mı yazdım, yoksa bakiye oranını mı kullandım?","paragraf":"Standart maliyet sapma kapanışı - oranlı dağıtım uygulaması","yanilgi":"Sapma tutarının hesaplar arasında bakiye oranında dağıtılması gerektiğini atlayıp tüm tutarı tek hesaba, üstelik ters tarafa yazılabileceğini sanıyorsun."},"E":{"gercek":"620 Satılan Mamul Maliyeti hesabının payı bakiye oranına göre 1.500 TL\u0027dir; 900 TL 152 Mamuller hesabına ait paydır.","ayirt":"Soru kökünde hangi hesap adı geçiyor, ben o hesabın payını mı işaretledim?","paragraf":"Standart maliyet sapma kapanışı - hesap seçimi","yanilgi":"Doğru hesaplama adımlarını yapıp doğru tarafı bulduğun halde, soru kökünün hangi hesabı sorduğunu (620) gözden kaçırıp başka bir hesabın payını işaretliyorsun."},"D":{"gercek":"Toplam sapma önce dağıtım esasına göre (151+152+620 bakiyeleri) oranlanır, her hesap yalnızca kendi payını alır.","ayirt":"620 hesabına yazdığım tutar, toplam sapma mı yoksa oranlı payı mı?","paragraf":"Standart maliyet sapma kapanışı - dağıtım esası","yanilgi":"Taraf yönünü (alacaklı) doğru bulduğun halde, dağıtımın zorunlu olduğunu unutup toplam tutarı olduğu gibi tek hesaba aktarılabileceğini sanıyorsun."},"B":{"gercek":"Standart maliyet sapma analizinde net sapma pozitifse (fiili\u003estandart) aleyhte/borçlu, negatifse lehte/alacaklı kapatılır; burada net sapma -3.000 TL yani lehtedir.","ayirt":"Toplam sapmanın işareti pozitif mi negatif mi, yani fiili maliyet standardın üstünde mi altında mı kaldı?","paragraf":"Standart maliyet sapma analizi - toplam sapma işareti kuralı","yanilgi":"Sapmanın olumlu (lehte) olmasının kapanışta hesabı azaltacağını, yani alacaklı çalışması gerektiğini unutup her sapmayı otomatik borçlu yazılır sanıyorsun."},"A":{"gercek":"Miktar sapması=(Fiili miktar-Standart miktar)xStandart fiyat, Fiyat sapması=(Fiili fiyat-Standart fiyat)xFiili miktar; toplamları net sapmayı, işareti ise yönü verir.","ayirt":"Miktar sapmasını standart fiyatla mı, fiyat sapmasını fiili miktarla mı çarptım?","paragraf":"Standart maliyet - miktar/fiyat sapması formülleri","yanilgi":"Bu şıkkı eleyen öğrenci, miktar sapmasının standart fiyatla, fiyat sapmasının fiili miktarla çarpılması gerektiğini karıştırıp yanlış bir toplam sapma buluyor."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"donem":1,"hesaplar":{"732":{"ad":"GENEL ÜRETİM GİDERLERİ BÜTÇE FARKLARI","tanim":"Fiili üretim genel giderleri ile maliyetlere yüklenen önceden saptanmış giderler arasındaki olumlu ya da olumsuz bütçe farklarının izlendiği hesaptır. Olumsuz farklar hesabın borcuna olumlu farklar ise alacağına kaydedilir. Dönem sonlarında bu hesap ilgili stok ve satış maliyeti hesaplarına aktarılarak kapatılır."},"152":{"ad":"MAMULLER","tanim":"Üretim çalışmaları sonunda elde edilen ve satışa hazır hale gelmiş bulunan mamullerin izlendiği hesaptır. İşleyişi: Bu hesap, üretimi tamamlanan mamullerin ambarlara alınmasıyla borçlandırılır. Satılması veya herhangi bir nedenle ambardan çekilmesi ile alacaklandırılır."},"151":{"ad":"YARI MAMULLER-ÜRETİM","tanim":"Henüz tam mamul haline gelmemiş ancak direkt ilk madde ve malzeme ile direkt işçilik ve genel üretim giderlerinden belli oranlarda pay almış üretim aşamasındaki mamullerin izlendiği hesaptır. İşleyişi: Maliyet dönemi sonunda direkt ilk madde ve malzeme, direkt işçilik ve genel üretim giderleri tutarları kadar bu hesap borçlandırılır."},"731":{"ad":"Genel Üretim Giderleri Yansıtma Hesabı","tanim":"Önceden saptanmış maliyet yöntemlerinin uygulandığı durumlarda, önceden saptanmış genel üretim giderleri, Fiili maliyet yönteminin uygulandığı durumlarda, \"730- Genel Üretim Giderleri Hesabı\"nın borcuna kaydedilen giderleri, bu hesabın alacağı karşılığı \"151- Yarı Mamuller Üretim Hesabı\" ile diğer aktif, gider ve zarar hesaplarına borç ka…"},"620":{"ad":"SATILAN MAMULLER MALİYETİ (-)","tanim":"İşleyişi: Satılan mamullerin maliyet tutarı 152 nolu hesaba (Mamuller Hs.) alacak, bu hesaba ise borç kaydedilir."}}},{"capa":{"kaynak":"SGS 2025/2 Soru 58"},"kural":"ortalama maliyet yönteminde dönüştürme eşdeğer birimi, tamamlanan mamul miktarı ile dönem sonu yarı mamulün tamamlanma derecesiyle ağırlıklandırılmış payının toplamıdır; birim maliyet bulunduktan sonra dönem sonu yarı mamulün payına uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 58","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce miktar sağlama tablosunu kur (kaynak=kullanım), sonra tamamlanma yüzdesini yalnız dönem sonu yarı mamule uygula, birim maliyeti bulmadan paya geçme.","konu":"safha maliyet miktar sağlama","tablo":{"satirlar":[["VERİLENLER","-"],["Dönem başı yarı mamul","4.000 birim"],["Üretime başlanan miktar","20.000 birim"],["Dönem sonu yarı mamul","6.000 birim"],["Tamamlanma derecesi","%40"],["Toplam dönüştürme maliyeti","204.000 TL"],["HESAP","-"],["Tamamlanan mamul miktarı (4.000+20.000-6.000)","18.000 birim"],["Dönüştürme eşdeğer birimi (18.000+6.000×%40)","20.400 birim"],["Birim dönüştürme maliyeti (204.000/20.400)","10 TL"],["Dönem sonu yarı mamul dönüştürme maliyeti (2.400×10)","24.000 TL"]],"basliklar":["Kalem","Tutar/Miktar"]},"siklar":{"C":"40.800","E":"60.000","A":"12.000","D":"51.000","B":"24.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[2,1],[3,1]],"tablo":{"basliklar":["Kalem","Tutar/Miktar"],"satirlar":[["Tamamlanan mamul miktarı (3.000+22.000-5.000)","20.000 birim"],["Dönüştürme eşdeğer birimi (20.000+5.000×%30)","21.500 birim"],["Birim dönüştürme maliyeti (215.000/21.500)","10 TL"],["Dönem sonu yarı mamul dönüştürme maliyeti (1.500×10)","15.000 TL"]]},"tur":"tablo","soru":"Tek safhada üretim yapan bir işletme, maliyetleme için ortalama maliyet yöntemini kullanmaktadır. Direkt ilk madde ve malzeme safhanın başında tamamı verilirken, dönüştürme maliyeti safha boyunca düzenli olarak eklenmektedir. Döneme ait bilgiler şöyledir: dönem başı yarı mamul stoku 3.000 birim, dönem içinde üretime başlanan miktar 22.000 birim, dönem sonu yarı mamul stoku 5.000 birim olup dönüştürme açısından tamamlanma derecesi %30\u0027dur. Dönemin toplam dönüştürme maliyeti 215.000 TL\u0027dir. Buna göre, dönem sonu yarı mamul stokuna ait dönüştürme maliyeti kaç TL\u0027dir?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve dönem sonu yarı mamul stokuna ait dönüştürme maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Tek safhada (evrede) üretim yapan bir işletme, maliyetleme için ortalama maliyet yöntemini kullanmaktadır. Direkt ilk madde ve malzeme safhanın başında tamamı verilirken, dönüştürme maliyeti (direkt işçilik ve genel üretim gideri) safha boyunca düzenli olarak eklenmektedir. Döneme ait bilgiler şöyledir: dönem başı yarı mamul stoku 4.000 birim, dönem içinde üretime başlanan miktar 20.000 birim, dönem sonu yarı mamul stoku 6.000 birim olup dönüştürme açısından tamamlanma derecesi %40\u0027tır. Dönemin toplam dönüştürme maliyeti 204.000 TL\u0027dir. Buna göre, dönem sonu yarı mamul stokuna ait dönüştürme maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-28","verilenler":[{"deger":"4.000 birim","anlam":"Miktar sağlama tablosunun kaynak tarafında kullanılır, tamamlanan mamul miktarının bulunmasına katkı sağlar.","ad":"Dönem başı yarı mamul"},{"deger":"20.000 birim","anlam":"Dönem içinde safhaya giren yeni miktardır, miktar sağlamanın kaynak tarafına eklenir.","ad":"Üretime başlanan miktar"},{"deger":"6.000 birim","anlam":"Miktar sağlamanın kullanım tarafında yer alır ve dönüştürme eşdeğer biriminin hesaplanmasında tamamlanma derecesiyle çarpılır.","ad":"Dönem sonu yarı mamul"},{"deger":"%40","anlam":"Dönem sonu yarı mamulün dönüştürme maliyeti açısından ne kadarının eşdeğer birim sayılacağını belirler.","ad":"Tamamlanma derecesi"},{"deger":"204.000 TL","anlam":"Eşdeğer birime bölünerek birim dönüştürme maliyetinin bulunmasında kullanılır.","ad":"Toplam dönüştürme maliyeti"}],"dayanak":"Maliyet Muhasebesi - Safha (Evre) Maliyet Sistemi, eşdeğer ürün birimi ve ortalama maliyet yöntemi çerçevesi (mevzuat maddesi yok, yerleşik maliyet muhasebesi tekniği)","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: dönem başı stok 4.000 birim (soruda verilen); başlanan miktar 20.000 birim (soruda verilen); dönem sonu stok 6.000 birim (soruda verilen); tamamlanma derecesi %40 (soruda verilen); toplam dönüştürme maliyeti 204.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: dönem başı yarı mamul 4.000 birim, döneme başlanan 20.000 birim, dönem sonu yarı mamul 6.000 birim, tamamlanma derecesi %40, toplam dönüştürme maliyeti 204.000 TL.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"Tamamlanan mamul = Dönem başı stok + Başlanan miktar − Dönem sonu stok = 4.000 (soruda verilen) + 20.000 (soruda verilen) − 6.000 (soruda verilen) = 18.000 birim","anlatim":"Önce kaç birim mamul tamamen bitmiş onu buluyoruz. Ortalama maliyette dönem başı stok da bu dönem tamamlanmış sayılır, o yüzden hepsi toplama girer.","doldur":[[7,1]]},{"formul":"Dönem sonu stokun dönüştürme payı = Dönem sonu stok × Tamamlanma derecesi = 6.000 (soruda verilen) × %40 (soruda verilen) = 2.400 birim","anlatim":"Dönem sonunda elde kalan yarı mamul tam bitmemiş, sadece %40\u0027ı kadar dönüştürme işi yapılmış. Bu yüzden onu tam birim gibi değil, oranıyla sayıyoruz.","doldur":[]},{"formul":"Dönüştürme eşdeğer birimi = Tamamlanan mamul + Dönem sonu stokun payı = 18.000 (2. adımda bulduk) + 2.400 (3. adımda bulduk) = 20.400 birim","anlatim":"Şimdi eşdeğer birimi tamamlıyoruz: tam biten mamuller artı yarı biten stokun payı. Bu toplam bize maliyeti bölebileceğimiz gerçek birim sayısını verir.","doldur":[[8,1]]},{"formul":"Birim dönüştürme maliyeti = Toplam dönüştürme maliyeti / Dönüştürme eşdeğer birimi = 204.000 (soruda verilen) / 20.400 (4. adımda bulduk) = 10 TL","anlatim":"Toplam dönüştürme maliyetini eşdeğer birime bölünce bir birime düşen maliyeti buluruz. Bu birim maliyet hem tamamlanan hem yarı mamul için aynıdır.","doldur":[[9,1]]},{"formul":"Dönem sonu yarı mamul dönüştürme maliyeti = Dönem sonu stokun payı × Birim dönüştürme maliyeti = 2.400 (3. adımda bulduk) × 10 (5. adımda bulduk) = 24.000 TL","anlatim":"Şimdi bu birim maliyeti dönem sonu stokun eşdeğer birim payına uyguluyoruz. Çünkü soru tam olarak bu stokun maliyetini soruyor, tamamlanan mamulünkini değil. Sonuç: dönem sonu yarı mamul stokunun dönüştürme maliyeti 24.000 TL\u0027dir. Bu sayı doğrudan tabloda son satırda görünüyor.","doldur":[[10,1]]},{"formul":"Ters durum: soru direkt ilk madde ve malzeme isteseydi → tamamlanma derecesi %100 kullanılır","anlatim":"Ters durum: soru ilk madde ve malzeme maliyetini sorsaydı tamamlanma derecesi %100 olurdu. Çünkü ilk madde safhanın başında tam veriliyor, dönüştürme gibi kademeli eklenmiyor.","doldur":[]},{"formul":"Yanlış yol: 6.000 (soruda verilen) × 10 (5. adımda bulduk) = 60.000 (HATALI) → doğrusu 2.400 × 10 = 24.000 (6. adımda bulduk)","anlatim":"En sık hata: öğrenci dönem başı stoku eşdeğer birime tekrar eklemeye çalışır, ama ortalama maliyette dönem başı stok zaten tamamlanan mamul içinde sayılır. Ayrıca dönem sonu stokun tamamını (6.000) çarpıp %40 payını unutmak da sık yapılan hatadır.","doldur":[]}],"anahtar":[{"ornek":"maliyetinde","kok":"maliye"},{"ornek":"tamamlanan","kok":"tamaml"},{"ornek":"dönüştürme","kok":"dönüşt"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"stokun","kok":"stokun"},{"ornek":"mamulün","kok":"mamulü"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda yarı mamul stoku kaldığında ve dönüştürme tamamlanma derecesi verildiğinde. Nasıl ölçülür: eşdeğer ürün miktarı (dönem sonu stok × tamamlanma derecesi) ile birim dönüştürme maliyeti çarpılarak. Nasıl kaydedilir: dönem sonu yarı mamul stokuna ait dönüştürme maliyeti ayrı bir tutar olarak raporlanır.","desen":"Bu konuda tuzak, ilk madde ile dönüştürme eşdeğer biriminin farklı tamamlanma derecelerinden dolayı ayrı hesaplanması gerekirken tek eşdeğer miktar kullanılmasıdır. Ayrıca ortalama maliyet yönteminde dönem başı stokun eşdeğer birime tam dahil edilmesi unutulabilir; öğrenci ilk giren ilk çıkar (FIFO) mantığıyla karıştırabilir. Bu soru safha maliyet ve eşdeğer ürün miktarı hesaplama noktasından geliyor (çıkmış arşivde 1 dönem).","terimler":[{"kaynak":"sen hesaplarsın","tanim":"yarı mamulün tamamlanma derecesine göre tam mamul cinsinden ifadesi","ad":"Eşdeğer ürün miktarı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"dönem sonu yarı mamulün dönüştürme açısından ne kadar bittiğini gösteren yüzde","ad":"Tamamlanma derecesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"direkt işçilik ile genel üretim giderinin toplamı, ilk madde hariç","ad":"Dönüştürme maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"toplam dönüştürme maliyetinin dönüştürme eşdeğer birimine bölünmesiyle bulunan tutar","ad":"Birim dönüştürme maliyeti","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Dönem başı-sonu yarı mamul miktarları, tamamlanma derecesi ve toplam dönüştürme maliyeti verilip dönem sonu stokun dönüştürme maliyeti istenir.","panel_ornek":"Bir kiralık evde depozito taşınırken tek seferde tam ödenir ama aidat her ay parça parça birikir; ay sonunda oturduğun süreye göre aidat borcun hesaplanır, depozitoya göre değil. İşte tam bu yüzden iki gideri ayrı takip edersin: 12 aylık aidat 2.400 TL ise, 3 ay oturduysan payına 600 TL düşer.","ornek":"Bir kiralık evde depozito taşınırken tek seferde tam ödenir ama aidat her ay parça parça birikir; ay sonunda oturduğun süreye göre aidat borcun hesaplanır, depozitoya göre değil. İşte tam bu yüzden iki gideri ayrı takip edersin: 12 aylık aidat 2.400 TL ise, 3 ay oturduysan payına 600 TL düşer.","yontemler":"Ortalama maliyet yönteminde toplam üretilen birimden hareketle eşdeğer birim bulunur, dönem başı stok ayrıştırılmaz. Dönem sonu yarı mamulün eşdeğer miktarı, stok adedi ile tamamlanma derecesinin çarpımıdır.","nedir":"Safha maliyet sistemi, tek evrede sürekli üretim yapan işletmelerde dönem sonu yarı mamullerin maliyetini eşdeğer ürün miktarı üzerinden bulmayı sağlar. Sınav, ilk madde ve dönüştürme maliyetinin ayrı tamamlanma dereceleriyle doğru dağıtılıp dağıtılamadığını ölçer."},"olay":"tamamlanan mamul=4.000+20.000-6.000=18.000; eşdeğer birim=18.000+6.000×%40=20.400; birim dönüştürme maliyeti=204.000/20.400=10; dönem sonu yarı mamul dönüştürme maliyeti=2.400×10=24.000.","tuzak":{"C":{"ad":"Sağlama Toplamı Tuzağı","metin":"miktar sağlamanın kaynak tarafını (24.000) değil, dönem sonu stoğunu ikinci kez eklediğin 30.000\u0027lik toplamı payda aldın. Doğrusu: sağlamanın iki tarafı da 24.000\u0027de eşitlenir, dönem sonu stok ayrıca toplanmaz."},"E":{"ad":"Tamamlanma Derecesi İhmali Tuzağı","metin":"dönem sonu yarı mamulü dönüştürme açısından tam mamul gibi (%100 tamamlanmış) kabul ettin. Doğrusu: dönüştürme maliyeti safha boyunca düzenli eklendiği için yarı mamulün yalnız %40\u0027ı eşdeğer birim sayılır."},"D":{"ad":"Oran Karıştırma Tuzağı","metin":"tamamlanma derecesini hiç uygulamadan dönem sonu yarı mamul miktarını doğrudan miktar sağlamadaki toplam üretim miktarına (24.000) oranladın. Doğrusu: pay, eşdeğer birim (20.400) üzerinden hesaplanan birim maliyetle çarpılarak bulunur."},"A":{"ad":"Yüzde Yorumlama Tuzağı","metin":"%40 tamamlanma derecesini yanlış okuyup yarısını (%20) kullandın. Doğrusu: tamamlanma derecesi verildiği gibi %40 uygulanır ve dönem sonu yarı mamulün eşdeğer birimi 6.000×%40=2.400\u0027dür."}},"celdiriciYol":{"C":"204.000 × (6.000/30.000) = 40.800 (miktar sağlama toplamına dönem sonu stok ikinci kez eklenerek payda büyütüldü)","E":"6.000 × 10 = 60.000 (dönem sonu yarı mamul tam tamamlanmış kabul edildi)","D":"204.000 × (6.000/24.000) = 51.000 (tamamlanma derecesi uygulanmadan doğrudan miktar oranı kullanıldı)","A":"6.000 × %20 × 10 = 12.000 (tamamlanma yüzdesi yanlış okunup yarıya indirildi)"},"hap":"Safha maliyetinde dönüştürme maliyeti eşdeğer birimi, tamamlanan mamul miktarına dönem sonu yarı mamulün tamamlanma derecesiyle çarpılan payının eklenmesiyle bulunur.","teshis":{"C":{"gercek":"Miktar sağlama tablosunda kaynak tarafı (DB+üretime başlanan) ile kullanım tarafı (tamamlanan+DS) birbirine eşittir, toplam tek bir rakamdır (24.000).","ayirt":"Sağlamanın iki tarafı birbirine eşit çıktı mı, yoksa bir kalemi iki kez mi saydım?","paragraf":"Safha Maliyet Sistemi - miktar sağlama ilkesi","yanilgi":"Miktar sağlamanın iki tarafının da aynı toplama (kaynak=kullanım) eşit olması gerektiğini unutup dönem sonu stoğu payda toplamına ayrıca eklemen gerektiğini sanıyorsun."},"E":{"gercek":"Dönüştürme maliyeti safha boyunca kademeli eklendiğinden yarı mamul yalnızca gerçekleşen tamamlanma oranı kadar eşdeğer birim sayılır.","ayirt":"Yarı mamulü tam mamul gibi mi saydım, yoksa tamamlanma yüzdesini mi uyguladım?","paragraf":"Safha Maliyet Sistemi - dönüştürme maliyeti tanımı","yanilgi":"Dönem sonu yarı mamulün de tıpkı tamamlanan mamul gibi dönüştürme açısından tam pay alması gerektiğini sanıyorsun."},"A":{"gercek":"Tamamlanma derecesi soruda verildiği gibi doğrudan çarpanda kullanılır, ayrıca yarıya bölünmez.","ayirt":"Verilen yüzdeyi olduğu gibi mi kullandım, yoksa kendiliğinden değiştirdim mi?","paragraf":"Safha Maliyet Sistemi - eşdeğer ürün birimi tanımı","yanilgi":"Tamamlanma yüzdesini gördüğünde otomatik olarak yarısını alman gerektiğini sanıyorsun."},"D":{"gercek":"Pay hesaplaması, önce eşdeğer birim üzerinden bulunan birim maliyetin, dönem sonu yarı mamulün eşdeğer birimiyle (miktar×tamamlanma derecesi) çarpılmasıyla yapılır.","ayirt":"Payı bulurken tamamlanma derecesini bir yerde bile atladım mı?","paragraf":"Safha Maliyet Sistemi - birim maliyet formülü","yanilgi":"Dönem sonu yarı mamulün payını doğrudan miktar oranıyla bulabileceğini, tamamlanma derecesinin sadece eşdeğer birim aşamasında değil her yerde göz ardı edilebileceğini sanıyorsun."},"B":{"gercek":"Önce miktar sağlama ile tamamlanan mamul bulunur, sonra bu miktara dönem sonu yarı mamulün ağırlıklı payı eklenerek eşdeğer birim elde edilir; birim maliyet bu esasa göre hesaplanır.","ayirt":"Eşdeğer birimi bulmadan doğrudan orana mı geçtim, yoksa önce miktar sağlamayı mı tamamladım?","paragraf":"Safha Maliyet Sistemi - ortalama maliyet yöntemi formülü","yanilgi":"Bu şıkkı eleyen öğrenci, miktar sağlama ile eşdeğer birim hesabını iki ayrı ve gereksiz adım sanıp birini atlar."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 63"},"kural":"genel üretim gideri direkt ilk madde ve malzeme giderinin %35\u0027i oranında tahmini yüklenir, dönem sonunda fiili tutarla karşılaştırılan fark maliyete düzeltme olarak yansıtılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 63","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce yüklenen tahmini genel üretim giderini bul, sonra fiili tutarla farkını al, farkı mutlaka doğru yönde toplam maliyete ekle - ara adımda durma.","konu":"sipariş maliyet-gug hesaplama","tablo":{"satirlar":[["VERİLENLER","-"],["Direkt ilk madde ve malzeme gideri","145.000 TL"],["Direkt işçilik gideri","62.500 TL"],["Yükleme oranı","%35"],["Fiili genel üretim gideri","58.300 TL"],["HESAP","-"],["Yüklenen (tahmini) genel üretim gideri (145.000 × %35)","50.750"],["Tahmini toplam üretim maliyeti (145.000+62.500+50.750)","258.250"],["Yükleme farkı (58.300-50.750, eksik yükleme)","7.550"],["Düzeltilmiş (fiili) toplam üretim maliyeti (258.250+7.550)","265.800"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"265.800","E":"316.550","A":"250.700","D":"280.125","B":"258.250"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Yüklenen (tahmini) genel üretim gideri (120.000 × %40)","48.000"],["Tahmini toplam üretim maliyeti (120.000+48.000+48.000)","216.000"],["Yükleme farkı (51.200-48.000, eksik yükleme)","3.200"],["Düzeltilmiş (fiili) toplam üretim maliyeti (216.000+3.200)","219.200"]]},"tur":"tablo","soru":"İşletme sipariş maliyet sistemi uygulamaktadır. Direkt ilk madde ve malzeme gideri ile direkt işçilik gideri fiili tutarıyla, genel üretim gideri ise direkt ilk madde ve malzeme giderinin %40\u0027ı oranında tahmini olarak siparişe yüklenmektedir; yüklenen tutar ile fiili genel üretim gideri arasındaki fark dönem sonunda düzeltilerek gerçek üretim maliyetine yansıtılmaktadır. 2026 yılı Mart ayında üretimine başlanıp tamamlanan Y siparişine ait direkt ilk madde ve malzeme gideri 120.000 TL, direkt işçilik gideri 48.000 TL, fiili genel üretim gideri ise 51.200 TL olarak gerçekleşmiştir.","verilen":[],"hedef":"Tabloyu doldur ve Y siparişinin düzeltilmiş (fiili) toplam üretim maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, sipariş maliyet sistemi uygulamaktadır. Direkt ilk madde ve malzeme gideri ile direkt işçilik gideri fiili tutarıyla, genel üretim gideri ise direkt ilk madde ve malzeme giderinin %35\u0027i oranında tahmini olarak siparişe yüklenmekte; yüklenen tutar ile fiili genel üretim gideri arasındaki fark dönem sonunda düzeltilerek gerçek üretim maliyetine yansıtılmaktadır. 2026 yılı Ocak ayında üretimine başlanıp tamamlanan X siparişine ait direkt ilk madde ve malzeme gideri 145.000 TL, direkt işçilik gideri 62.500 TL, fiili genel üretim gideri ise 58.300 TL olarak gerçekleşmiştir. Buna göre, X siparişinin fiili (düzeltilmiş) toplam üretim maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-30","verilenler":[{"deger":"145.000 TL","anlam":"X siparişinin fiili direkt ilk madde ve malzeme gideri; aynı zamanda tahmini genel üretim gideri yüklemesinin tabanıdır.","ad":"Direkt ilk madde ve malzeme gideri"},{"deger":"62.500 TL","anlam":"X siparişinin fiili direkt işçilik gideri, üretim maliyetine doğrudan eklenir.","ad":"Direkt işçilik gideri"},{"deger":"%35","anlam":"Genel üretim giderinin direkt ilk madde ve malzeme gideri üzerinden tahmini yüklenme oranı.","ad":"Yükleme oranı"},{"deger":"58.300 TL","anlam":"Dönem sonunda belirlenen gerçek genel üretim gideri; yüklenen tutarla karşılaştırılıp fark bulunur.","ad":"Fiili genel üretim gideri"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı, 373 Maliyet Giderleri Karşılığı hesabı işleyişi","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Direkt ilk madde ve malzeme gideri 145.000 TL (soruda verilen); Direkt işçilik gideri 62.500 TL (soruda verilen); Fiili genel üretim gideri 58.300 TL (soruda verilen); Yükleme oranı %35 (soruda verilen)","anlatim":"Soru bize şunları vermiş: direkt ilk madde malzeme gideri 145.000 TL, direkt işçilik gideri 62.500 TL, fiili genel üretim gideri 58.300 TL. Genel üretim gideri, direkt ilk madde malzeme giderinin %35\u0027i oranında tahmini yüklenecek.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Yüklenen (tahmini) genel üretim gideri = Direkt ilk madde ve malzeme gideri × %35 = 145.000 (soruda verilen) × %35 = 50.750 TL","anlatim":"Sipariş maliyet sisteminde genel üretim gideri fiili değil, tahmini bir oranla siparişe yüklenir. Burada bu oran direkt ilk madde ve malzeme giderinin %35\u0027i, o yüzden önce bu tahmini payı buluyoruz.","doldur":[[6,1]]},{"formul":"Tahmini toplam üretim maliyeti = Direkt ilk madde ve malzeme gideri + Direkt işçilik gideri + Yüklenen genel üretim gideri = 145.000 (soruda verilen) + 62.500 (soruda verilen) + 50.750 (1. adımda bulduk) = 258.250 TL","anlatim":"Şimdi siparişin tahmini toplam maliyetini kuruyoruz: direkt giderler fiili tutarıyla, genel üretim gideri ise az önce bulduğumuz tahmini payla toplanır. Bu ara toplam henüz düzeltilmemiş hâldir.","doldur":[[7,1]]},{"formul":"Yükleme farkı = Fiili genel üretim gideri - Yüklenen genel üretim gideri = 58.300 (soruda verilen) - 50.750 (1. adımda bulduk) = 7.550 TL (eksik yükleme)","anlatim":"Dönem sonunda yüklenen tahmini tutar ile gerçekleşen fiili tutar karşılaştırılır, aradaki fark düzeltme olarak maliyete eklenir ya da çıkarılır. Fiili tutar yüklenenden büyükse eksik yüklenmiş demektir, fark maliyete eklenir.","doldur":[[8,1]]},{"formul":"Düzeltilmiş (fiili) toplam üretim maliyeti = Tahmini toplam üretim maliyeti + Yükleme farkı = 258.250 (2. adımda bulduk) + 7.550 (3. adımda bulduk) = 265.800 TL","anlatim":"Eksik yükleme olduğu için bu fark, tahmini toplam maliyetin üzerine eklenir. Böylece siparişin gerçek maliyetine ulaşırız.","doldur":[[9,1]]},{"formul":"SONUÇ: X siparişinin fiili (düzeltilmiş) toplam üretim maliyeti = 265.800 TL","anlatim":"X siparişinin fiili düzeltilmiş toplam üretim maliyeti bulundu. Sonuç direkt giderler artı fiili genel üretim gideriyle uyumludur çünkü 145.000+62.500+58.300 de aynı sonucu verir.","doldur":[]},{"formul":"Ters durum: fiili genel üretim gideri \u003c yüklenen genel üretim gideri → fazla yükleme, fark tahmini maliyetten çıkarılır","anlatim":"Ters durumda: eğer fiili genel üretim gideri yüklenenden küçük olsaydı, fazla yükleme olurdu ve fark tahmini maliyetten çıkarılırdı. Yani her zaman fiili ile yüklenen karşılaştırılır, işaret ona göre değişir.","doldur":[]},{"formul":"Yanlış yol: 145.000 + 62.500 + 50.750 = 258.250 TL olarak bırakmak (HATALI, düzeltme farkı unutulur) → doğrusu 258.250 + 7.550 = 265.800 TL (5. adımda bulduk)","anlatim":"En sık hata: yükleme farkını dikkate almadan sadece 145.000+62.500+58.300 toplayıp 265.800 bulmak; sonuç aynı çıksa da yöntem yanlıştır çünkü sipariş sistemi fiili genel üretim gideri değil, tahmini yüklenen genel üretim gideri kullanır. Doğru yöntem önce tahmini yüklemeyi yapıp sonra düzeltme farkını eklemektir.","doldur":[]}],"anahtar":[{"ornek":"gideri","kok":"gideri"},{"ornek":"üretim","kok":"üretim"},{"ornek":"tahmini","kok":"tahmin"},{"ornek":"maliyet","kok":"maliye"},{"ornek":"yüklenen","kok":"yüklen"},{"ornek":"sipariş","kok":"sipari"}],"konuGiris":{"harita":"Ne zaman test edilir: sipariş tamamlanıp fiili genel üretim gideri kesinleştiğinde. Nasıl ölçülür: tahmini yüklenen genel üretim gideri ile fiili genel üretim gideri arasındaki fark bulunarak. Nasıl kaydedilir: direkt madde, direkt işçilik ve fiili genel üretim gideri toplanarak fiili üretim maliyeti oluşturulur.","desen":"Soru, tahmini yüklenen genel üretim gideri ile fiili genel üretim gideri arasındaki farkı gözden kaçırıp yalnız tahmini tutarla toplam yapma tuzağı kurar. Öğrenci genelde fiili genel üretim gideri yerine tahmini oranla hesaplanan tutarı toplama dahil eder. Bu soru sipariş maliyet sisteminde genel üretim gideri düzeltmesi noktasından geliyor (p. Tekdüzen Hesap Planı 159-259 civarı, 1 dönem çıkmış).","terimler":[{"kaynak":"soruda verilir","tanim":"Siparişe doğrudan yüklenen fiili malzeme tutarı.","ad":"Direkt ilk madde ve malzeme gideri","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Siparişe doğrudan yüklenen fiili işçilik tutarı.","ad":"Direkt işçilik gideri","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Direkt malzeme giderinin belirli yüzdesiyle siparişe yüklenen tahmini genel üretim gideri oranı.","ad":"Tahmini genel üretim gideri yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Direkt malzeme, direkt işçilik ve fiili genel üretim giderlerinin toplamından oluşan gerçek maliyet.","ad":"Fiili üretim maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Direkt malzeme, direkt işçilik ve fiili genel üretim gideri tutarları verilip siparişin fiili (düzeltilmiş) toplam üretim maliyeti istenir.","panel_ornek":"Bir arkadaşın düğün organizasyonu için önce tahmini 3.000 TL süsleme gideri bütçelemiş ama gerçekte 3.400 TL harcamış. Bütçeyle gerçek arasındaki 400 TL\u0027lik farkı toplam masrafına eklemesi gerekir, yoksa toplam eksik görünür.","ornek":"Bir arkadaşın düğün organizasyonu için önce tahmini 3.000 TL süsleme gideri bütçelemiş ama gerçekte 3.400 TL harcamış. Bütçeyle gerçek arasındaki 400 TL\u0027lik farkı toplam masrafına eklemesi gerekir, yoksa toplam eksik görünür.","yontemler":"Tahmini genel üretim gideri hesaplanır ama nihai maliyette kullanılmaz; toplam maliyet direkt malzeme + direkt işçilik + fiili genel üretim gideri olarak bulunur.","nedir":"Sipariş maliyet sistemi, her siparişin maliyetini ayrı izleyip genel üretim giderini tahmini oranla yükler ve dönem sonunda fiiliye düzeltir. Sınav, tahmini yüklenen tutar ile fiili tutar arasındaki farkın maliyete doğru yansıtılıp yansıtılmadığını ölçer."},"olay":"yüklenen genel üretim gideri=145.000×%35=50.750; tahmini toplam maliyet=145.000+62.500+50.750=258.250; yükleme farkı=58.300-50.750=7.550 (eksik yükleme); düzeltilmiş maliyet=258.250+7.550=265.800.","tuzak":{"D":{"ad":"Yanlış Taban Tuzağı","metin":"Yükleme oranını yalnız direkt ilk madde ve malzeme gideri yerine direkt işçilik giderini de katarak (145.000+62.500)×%35=72.625 üzerinden hesapladın. Doğrusu: yükleme oranının tabanı yalnızca direkt ilk madde ve malzeme gideridir."},"E":{"ad":"Çift Sayım Tuzağı","metin":"Fiili genel üretim giderini, zaten maliyete dahil ettiğin tahmini yüklenen genel üretim giderinin üzerine bir kez daha ekledin. Doğrusu: maliyete ya yüklenen tahmini genel üretim gideri ya da düzeltme sonrası fiili genel üretim gideri bir defa eklenir."},"A":{"ad":"Ters Fark Tuzağı","metin":"Fiili genel üretim gideri yüklenenden büyük olduğu halde farkın maliyeti azalttığını düşünüp 258.250 tutarından 7.550 çıkardın. Doğrusu: fiili genel üretim gideri yüklenenden büyükse fark eksik yüklemedir ve maliyete eklenir."},"B":{"ad":"Ara Adımda Durma Tuzağı","metin":"Tahmini yüklemeyle bulduğun 258.250 TL\u0027yi sorunun istediği fiili tutar sandın. Doğrusu: soru \u0027fiili (düzeltilmiş)\u0027 maliyeti istediği için yükleme farkının da eklenmesi gerekir."}},"celdiriciYol":{"D":"(145.000+62.500)×0,35=72.625; 145.000+62.500+72.625 = 280.125 (yükleme tabanına direkt işçiliği de kattı)","E":"145.000+62.500+50.750+58.300 = 316.550 (fiili genel üretim gideri\u0027ü yüklenen tahmini genel üretim gideri\u0027e ayrıca ekleyip çift saydı)","A":"258.250 - 7.550 = 250.700 (yükleme farkını ters yönde uyguladı)","B":"145.000 + 62.500 + 50.750 = 258.250 (yükleme farkını hesaba katmadan tahmini maliyeti sonuç saydı)"},"hap":"Sipariş maliyet sisteminde tahmini yüklenen genel üretim gideri ile fiili genel üretim gideri arasındaki fark, dönem sonunda 373 Maliyet Giderleri Karşılığı hesabı aracılığıyla düzeltilerek gerçek üretim maliyetine yansıtılır.","teshis":{"C":{"gercek":"Genel üretim gideri tahmini yüklenir, dönem sonunda fiili tutarla karşılaştırılıp fark 373 Maliyet Giderleri Karşılığı hesabı aracılığıyla düzeltilerek gerçek üretim maliyeti bulunur.","ayirt":"Yükleme oranını doğru tabana mı uyguladım, farkı doğru yönde mi ekledim?","paragraf":"THP 373; MSUGT Sıra No:2 böl.6","yanilgi":"Bu şıkkı eleyen öğrenci, yükleme farkının hesaba katılmasının gerekmediğini, tahmini tutarın yeterli olduğunu düşünür."},"E":{"gercek":"Maliyete ya yüklenen tahmini genel üretim gideri ya da düzeltme sonrası fiili genel üretim gideri bir kez eklenir, ikisi birlikte eklenmez.","ayirt":"Genel üretim giderini toplam maliyete kaç kez eklemiş oldum?","paragraf":"THP 373 işleyişi","yanilgi":"Fiili genel üretim giderini, zaten maliyete dahil ettiğin yüklenen tahmini genel üretim gideri\u0027ün üzerine ikinci kez eklediğini fark etmedin."},"A":{"gercek":"Fiili genel üretim gideri (58.300) yüklenen tahmini genel üretim gideri\u0027ten (50.750) büyük olduğunda fark eksik yüklemedir, maliyete eklenir.","ayirt":"Fiili tutar yüklenenden büyük mü küçük mü, farkı hangi yöne uyguluyorum?","paragraf":"THP 373 işleyişi","yanilgi":"Fiili genel üretim giderinin yüklenenden büyük olduğunu görmeden farkı maliyetten düşülecek bir eksilme sandın."},"D":{"gercek":"Sorudaki politika, genel üretim giderinin yalnız direkt ilk madde ve malzeme giderinin %35\u0027i olarak yüklenmesini öngörür.","ayirt":"Yükleme oranının tabanı hangi kalem, yalnız direkt ilk madde ve malzeme gideri mi?","paragraf":"soru verisi (yükleme politikası)","yanilgi":"Yükleme oranının tabanına direkt işçilik giderini de kattın."},"B":{"gercek":"Soru fiili düzeltilmiş maliyeti istiyor; tahmini yükleme ile fiili genel üretim gideri arasındaki fark mutlaka sonuca yansıtılmalıdır.","ayirt":"Bulduğum tutar ara adım mı, yoksa dönem sonu düzeltilmiş tutar mı?","paragraf":"THP 373 işleyişi","yanilgi":"Tahmini yükleme ile bulduğun ara toplamı sorunun istediği nihai (fiili) tutar sandın."}},"verilen":[[6,1],[7,1],[8,1],[9,1],[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 57"},"kural":"yükleme oranı = (bütçelenen sabit genel üretim gideri + bütçelenen değişken genel üretim gideri) / normal kapasite; yüklenen genel üretim gideri = fiili faaliyet x yükleme oranı; fiili faaliyet için bütçelenen genel üretim gideri = bütçelenen sabit genel üretim gideri + değişken oran x fiili faaliyet; kapasite sapması = fiili faaliyet için bütçelenen genel üretim gideri - yüklenen genel üretim gideri.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 57","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce yükleme oranını normal kapasiteye göre bul, sonra fiili faaliyet için bütçeyi hesapla, en son yüklenen genel üretim gideri ile karşılaştırıp kapasite sapmasını bütçe sapmasından ayrı tut.","konu":"gug yükleme oranı","tablo":{"satirlar":[["VERİLENLER","-","-"],["Normal kapasite","8.000 makine saati","-"],["Bütçelenen sabit genel üretim gideri","240.000 TL","-"],["Bütçelenen değişken genel üretim gideri oranı","15 TL/makine saati","-"],["Fiili makine saati","7.500 makine saati","-"],["Fiili genel üretim gideri","370.000 TL","-"],["HESAP","-","-"],["Yükleme oranı","(240.000+15x8.000)/8.000","45 TL/makine saati"],["Yüklenen genel üretim gideri","7.500 x 45","337.500"],["Fiili faaliyet için bütçelenen genel üretim gideri","240.000+15x7.500","352.500"],["Kapasite (hacim) sapması","352.500-337.500","15.000 (olumsuz)"]],"basliklar":["Kalem","Hesaplama","Tutar"]},"siklar":{"C":"17.500 olumlu","E":"32.500 olumsuz","A":"15.000 olumlu","D":"17.500 olumsuz","B":"15.000 olumsuz"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2]],"tablo":{"basliklar":["Kalem","Hesaplama","Tutar"],"satirlar":[["Yükleme oranı","(300.000+20x10.000)/10.000","50 TL/makine saati"],["Yüklenen genel üretim gideri","9.000 x 50","450.000"],["Fiili faaliyet için bütçelenen genel üretim gideri","300.000+20x9.000","480.000"],["Kapasite (hacim) sapması","480.000-450.000","30.000 (olumsuz)"]]},"tur":"tablo","soru":"Bir işletme, sipariş maliyet sistemi kullanmakta ve genel üretim giderlerini önceden belirlenmiş yükleme oranıyla mamullere yüklemektedir. İşletmenin normal kapasitesi 10.000 makine saati olup bu kapasitede bütçelenen sabit genel üretim gideri 300.000 TL, makine saati başına bütçelenen değişken genel üretim gideri ise 20 TL\u0027dir. Dönem sonunda fiili faaliyet hacminin 9.000 makine saati, fiili genel üretim giderinin ise 400.000 TL gerçekleştiği tespit edilmiştir. Buna göre, tabloyu doldur ve dönem sonunda hesaplanan kapasite (hacim) sapmasının tutarını ve yönünü bul.","verilen":[],"hedef":"Tabloyu doldur ve kapasite (hacim) sapmasının tutarını ve yönünü bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir işletme, sipariş maliyet sistemi kullanmakta ve genel üretim giderlerini önceden belirlenmiş yükleme oranıyla mamullere yüklemektedir. İşletmenin normal kapasitesi 8.000 makine saati olup bu kapasitede bütçelenen sabit genel üretim gideri 240.000 TL, makine saati başına bütçelenen değişken genel üretim gideri ise 15 TL\u0027dir. Dönem sonunda fiili faaliyet hacminin 7.500 makine saati, fiili genel üretim giderinin ise 370.000 TL gerçekleştiği tespit edilmiştir. Buna göre, dönem sonunda hesaplanan kapasite (hacim) sapmasının tutarı ve yönü aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-31","verilenler":[{"deger":"8.000 makine saati","anlam":"Yükleme oranının hesaplanmasında payda olarak kullanılan bütçelenen faaliyet hacmidir.","ad":"Normal kapasite"},{"deger":"240.000 TL","anlam":"Normal kapasitede bütçelenen sabit genel üretim gideri tutarı, yükleme oranı ve bütçelenen(fiili) genel üretim gideri hesabında kullanılır.","ad":"Bütçelenen sabit genel üretim gideri"},{"deger":"15 TL/makine saati","anlam":"Makine saati başına bütçelenen değişken genel üretim gideri, hem yükleme oranında hem fiili faaliyet bütçesinde kullanılır.","ad":"Bütçelenen değişken genel üretim gideri oranı"},{"deger":"7.500 makine saati","anlam":"Dönem sonunda gerçekleşen fiili faaliyet hacmi, yüklenen genel üretim gideri ve bütçelenen(fiili) genel üretim gideri hesabında kullanılır.","ad":"Fiili makine saati"},{"deger":"370.000 TL","anlam":"Dönem sonunda gerçekleşen fiili genel üretim gideri tutarı, bütçe sapması hesabında kullanılır (kapasite sapmasında doğrudan kullanılmaz).","ad":"Fiili genel üretim gideri"}],"dayanak":"Maliyet Muhasebesi - Genel Üretim Gideri Sapmaları Teori Notu (sipariş maliyet sistemi / bütçe-kapasite sapması çerçevesi)","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Soruda ne var: normal kapasite 8.000 msaat (soruda verilen); bütçelenen sabit genel üretim gideri 240.000 TL (soruda verilen); değişken genel üretim gideri oranı 15 TL/msaat (soruda verilen); fiili faaliyet 7.500 msaat (soruda verilen); fiili genel üretim gideri 370.000 TL (soruda verilen); istenen kapasite (hacim) sapması tutarı ve yönü","anlatim":"Soru bize şunları vermiş: normal kapasite 8.000 makine saati, bu kapasitede bütçelenen sabit genel üretim gideri 240.000 TL. Ayrıca makine saati başına değişken genel üretim gideri 15 TL, fiili faaliyet 7.500 makine saati ve fiili genel üretim gideri 370.000 TL.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"Yükleme oranı = (bütçelenen sabit genel üretim gideri + değişken oran × normal kapasite) / normal kapasite = (240.000 (soruda verilen) + 15 (soruda verilen) × 8.000 (soruda verilen)) / 8.000 (soruda verilen) = 45 TL/makine saati","anlatim":"Yükleme oranı nedir? Bir mamule genel üretim giderini yüklerken kullandığımız sabit orandır, dönem başında normal kapasiteye göre belirlenir. Bu oranı bulmadan hiçbir yükleme yapılamaz.","doldur":[[7,0],[7,1],[7,2]]},{"formul":"Yüklenen genel üretim gideri = fiili faaliyet × yükleme oranı = 7.500 (soruda verilen) × 45 (2. adımda bulduk) = 337.500 TL","anlatim":"Yüklenen genel üretim gideri, fiilen çalışılan saate göre mamule verilen tutardır. Fiili faaliyeti yükleme oranıyla çarparız, çünkü mamul kaç saat çalıştıysa o kadar pay alır.","doldur":[[8,0],[8,1],[8,2]]},{"formul":"Fiili faaliyet için bütçelenen genel üretim gideri = bütçelenen sabit genel üretim gideri + değişken oran × fiili faaliyet = 240.000 (soruda verilen) + 15 (soruda verilen) × 7.500 (soruda verilen) = 352.500 TL","anlatim":"Fiili faaliyet için bütçelenen genel üretim gideri, gerçek çalışılan saatte olması gereken gideri gösterir. Sabit kısım değişmez ama değişken kısmı fiili saate göre yeniden hesaplarız.","doldur":[[9,0],[9,1],[9,2]]},{"formul":"Kapasite (hacim) sapması = fiili faaliyet için bütçelenen genel üretim gideri − yüklenen genel üretim gideri = 352.500 (4. adımda bulduk) − 337.500 (3. adımda bulduk) = 15.000 TL","anlatim":"Kapasite sapması, fiili saatte olması gereken gider ile mamule yüklenen gider arasındaki farktır. Bu fark tamamen sabit giderin az kapasite kullanımından kaynaklanır, dikkat: fiili genel üretim gideri 370.000 burada hiç kullanılmaz.","doldur":[[10,0],[10,1],[10,2]]},{"formul":"Sonuç: 15.000 TL kapasite (hacim) sapması, olumsuz (atıl kapasite)","anlatim":"Sonuç: kapasite sapması 15.000 TL ve olumsuzdur. Fiili faaliyet 7.500 saat, normal kapasite olan 8.000 saatin altında kaldığı için işletme atıl kapasiteyle çalışmıştır.","doldur":[]},{"formul":"Ters durum: fiili faaliyet \u003e normal kapasite (8.000) → kapasite sapması olumlu (yüklenen genel üretim gideri \u003e bütçelenen)","anlatim":"Ters durumda: fiili faaliyet normal kapasitenin üstünde olsaydı sapma olumlu çıkardı. Yani fazla çalışıldıysa mamule fazladan gider yüklenmiş demektir, işletme lehine bir durum oluşur.","doldur":[]},{"formul":"Yanlış yol: 370.000 (soruda verilen) − 337.500 (3. adımda bulduk) = 32.500 (HATALI) → doğrusu 15.000 (5. adımda bulduk)","anlatim":"En sık hata: öğrenciler 370.000 TL fiili genel üretim giderini bu hesaba karıştırır, oysa o rakam bütçe sapması hesabında kullanılır. Kapasite sapması yalnız fiili faaliyet ile normal kapasite arasındaki farktan doğar.","doldur":[]}],"anahtar":[{"ornek":"gideri","kok":"gideri"},{"ornek":"üretim","kok":"üretim"},{"ornek":"kapasite","kok":"kapasi"},{"ornek":"faaliyet","kok":"faaliy"},{"ornek":"bütçelenen","kok":"bütçel"},{"ornek":"sapması","kok":"sapmas"}],"konuGiris":{"harita":"Ne zaman test edilir: Dönem sonunda fiili faaliyet hacmi ile normal kapasite karşılaştırılırken test edilir. Nasıl ölçülür: Fiili hacim için bütçelenen sabit genel üretim gideri ile yüklenen sabit genel üretim gideri arasındaki fark alınarak ölçülür. Nasıl kaydedilir: Fiili hacim normal kapasitenin altında kalırsa olumsuz, üstünde kalırsa olumlu sapma olarak kaydedilir.","desen":"Bu soruda öğrenciler değişken genel üretim gideri\u0027ü de kapasite sapması hesabına dahil etme veya fiili genel üretim gideri\u0027ü doğrudan bütçelenen genel üretim gideri ile karşılaştırma hatasına düşer; oysa kapasite sapması yalnızca sabit genel üretim gideri\u0027den doğar. Fiili hacim normal kapasitenin altında kaldığında sapmanın olumsuz (atıl kapasite) olduğu unutulmamalıdır. Bu soru sabit genel üretim gideri\u0027ün kapasite sapmasına özgü olduğu noktasından geliyor (p. genel üretim gideri sapmaları).","terimler":[{"kaynak":"soruda verilir","tanim":"İşletmenin sabit gider bütçelemesinde esas aldığı standart faaliyet hacmi","ad":"Normal kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Bütçelenen genel üretim gideri\u0027ün bütçelenen faaliyet hacmine bölünmesiyle bulunan önceden belirlenmiş oran","ad":"Yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Fiili faaliyet hacminin sabit yükleme oranıyla çarpılmasıyla bulunan tutar","ad":"Yüklenen sabit genel üretim gideri","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Bütçelenen sabit genel üretim gideri ile yüklenen sabit genel üretim gideri arasındaki fark, kapasite kullanımını gösterir","ad":"Kapasite sapması","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Normal kapasite, bütçelenen sabit genel üretim gideri, birim değişken genel üretim gideri, fiili hacim ve fiili genel üretim gideri verilerek kapasite sapmasının tutarı ve yönü istenir.","panel_ornek":"Bir kargo şirketi ayda 300 paket taşımayı hedefleyerek sabit araç giderini buna göre bütçeler; ay sonunda sadece 250 paket taşınırsa araçların sabit gideri yeterince paketlere dağıtılamamış olur. Yani araç zaten hazır bekliyordu ama kapasitenin altında kullanıldı, bu fark bir israf değil sadece kullanılmayan kapasiteyi gösterir.","ornek":"Bir kargo şirketi ayda 300 paket taşımayı hedefleyerek sabit araç giderini buna göre bütçeler; ay sonunda sadece 250 paket taşınırsa araçların sabit gideri yeterince paketlere dağıtılamamış olur. Yani araç zaten hazır bekliyordu ama kapasitenin altında kullanıldı, bu fark bir israf değil sadece kullanılmayan kapasiteyi gösterir.","yontemler":"Önce sabit yükleme oranı bulunur, sonra fiili hacim ile çarpılarak yüklenen sabit genel üretim gideri hesaplanır; bu tutar normal kapasitede bütçelenen sabit genel üretim gideri ile karşılaştırılır. Fiili hacim normal kapasitenin altındaysa sonuç olumsuz (atıl kapasite) sapmadır.","nedir":"Kapasite (hacim) sapması, önceden belirlenen yükleme oranıyla mamule yüklenen sabit genel üretim giderinin, fiili kapasite kullanımına göre yetersiz ya da fazla yüklenip yüklenmediğini gösterir. Sınav, bütçelenen genel üretim gideri ile yüklenen genel üretim gideri arasındaki farkı doğru yönüyle hesaplayabilmeni ölçer."},"olay":"oran=(240.000+15x8.000)/8.000=45; yüklenen=7.500x45=337.500; bütçelenen(fiili)=240.000+15x7.500=352.500; kapasite sapması=352.500-337.500=15.000.","tuzak":{"C":{"ad":"Bütçe-Kapasite Karıştırma Tuzağı","metin":"Fiili genel üretim gideri (370.000) ile fiili faaliyet için bütçelenen genel üretim gideri (352.500) arasındaki bütçe sapması tutarı kapasite sapması sanılmış, üstelik yön de olumlu yazılmıştır. Doğrusu: bu tutar bütçe sapmasıdır ve kapasite sapmasıyla karıştırılmamalıdır."},"E":{"ad":"Toplam Sapma Tuzağı","metin":"Fiili genel üretim gideri ile yüklenen genel üretim gideri arasındaki toplam sapma (370.000-337.500=32.500) hesaplanmış, bütçe sapması katmanı atlanarak doğrudan kapasite sapması sanılmıştır. Doğrusu: kapasite sapması, toplam sapmanın yalnızca bir bileşenidir ve 15.000 TL\u0027dir."},"D":{"ad":"Katman Atlama Tuzağı","metin":"Bütçe sapması (fiili genel üretim gideri - fiili faaliyet için bütçelenen genel üretim gideri = 370.000-352.500=17.500) doğru yönle bulunmuş ama kapasite sapması yerine sunulmuştur; iki farklı sapma türü karıştırılmıştır. Doğrusu: istenen kapasite sapması 15.000 TL\u0027dir."},"A":{"ad":"Yön Tuzağı","metin":"Fiili faaliyet hacmi (7.500 saat) normal kapasitenin (8.000 saat) altında kaldığı için kapasite yeterince kullanılmamıştır ve sapma olumsuz olmalıdır; tutarı doğru bulup yönü olumlu yazmak bu tuzağa düşürür. Doğrusu: sapma 15.000 TL olumsuzdur."}},"celdiriciYol":{"C":"370.000 - 352.500 = 17.500 (bütçe sapmasını kapasite sapması sandın ve yönünü de ters çevirdin)","E":"370.000 - 337.500 = 32.500 (fiili genel üretim gideri ile yüklenen genel üretim gideri farkı olan toplam sapmayı, bütçe sapması katmanını atlayarak kapasite sapması sandın)","D":"370.000 - 352.500 = 17.500 (bütçe sapmasını doğru hesapladın ama kapasite sapması yerine sundun)","A":"352.500 - 337.500 = 15.000 (yönü ters aldın: fiili faaliyet normal kapasitenin altında kaldığı için sapma olumsuz olmalıyken olumlu yazdın)"},"hap":"Kapasite (hacim) sapması, fiili faaliyet için bütçelenen genel üretim gideri ile yüklenen genel üretim gideri arasındaki farktır ve yalnızca sabit genel üretim gideri\u0027ün kapasite kullanımından doğar.","teshis":{"C":{"gercek":"Bütçe sapması fiili genel üretim gideri ile fiili faaliyet için bütçelenen genel üretim gideri arasındaki farktır, kapasite sapmasından farklı bir katmandır.","ayirt":"Bu fark fiyat/tüketimden mi (bütçe), yoksa kapasite kullanımından mı (hacim) kaynaklanıyor?","paragraf":"GUG sapmaları teori notu - butce ve hacim sapmasi ayrimi","yanilgi":"Bütçe sapması tutarını görüp bunu doğrudan kapasite sapması sanıyorsun, üstelik yönünü de ters çeviriyorsun."},"E":{"gercek":"Toplam sapma = fiili genel üretim gideri - yüklenen genel üretim gideri; bu, bütçe sapması ile kapasite sapmasının toplamıdır, kapasite sapmasının kendisi değildir.","ayirt":"Bu tutar iki alt sapmanın toplamı mı, yoksa tek bir alt sapma mı?","paragraf":"GUG sapmaları teori notu - toplam GUG sapmasi tanimi","yanilgi":"Fiili genel üretim gideri ile yüklenen genel üretim gideri arasındaki toplam farkı tek seferde kapasite sapması olarak sunuyorsun, ara katmanı atlıyorsun."},"A":{"gercek":"Fiili faaliyet normal kapasitenin altında kaldığında sabit giderler yeterince yüklenemez, bu atıl kapasite göstergesidir ve sapma aleyhte/olumsuzdur.","ayirt":"Fiili faaliyet normal kapasiteden düşük mü yüksek mi, kapasite yeterince kullanılmış mı?","paragraf":"GUG sapmaları teori notu - kapasite sapması yorumu","yanilgi":"Fiili faaliyet kapasitenin altında kalınca da bu durumu işletme lehine bir sapma sanıyorsun."},"D":{"gercek":"Bütçe sapması kontrol edilebilir sapmadır, kapasite sapması ise sabit giderin kapasite kullanımından doğar; ikisi ayrı hesaplanır.","ayirt":"Sorulan büyüklük hangi ikili karşılaştırmadan doğuyor: fiili-bütçe mi, bütçe-yüklenen mi?","paragraf":"GUG sapmaları teori notu - uc yonlu analiz","yanilgi":"Doğru formülle bütçe sapmasını buldun ama bunu kapasite sapmasıyla aynı şey sanıyorsun."},"B":{"gercek":"Kapasite sapması = fiili faaliyet için bütçelenen genel üretim gideri - yüklenen genel üretim gideri\u0027dür; yalnız sabit genel üretim gideri\u0027ün yüklenip yüklenmediğini gösterir.","ayirt":"Bu sapma sabit giderin kapasiteye göre yüklenmesinden mi, yoksa fiyat/tüketimden mi doğuyor?","paragraf":"GUG sapmaları teori notu - iki yönlü analiz","yanilgi":"Bu şıkkı eleyen öğrenci genelde bütçe sapması ile kapasite sapmasını aynı formülle karıştırdığı için tutar/yönü tutturamaz."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 60"},"kural":"süre sapması, (Fiili Saat - Standart Saat) x Standart Saat Ücreti ile bulunur; sonuç negatifse işletme lehine yani olumludur ve 723 hesabın alacağına kaydedilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 60","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Sapma sorularında önce hangi formülün hangi çarpanı kullandığını (ücret sapmasında fiili saat, süre sapmasında standart ücret) belirle, sonra işareti yorumla.","konu":"direkt işçilik süre farkı","tablo":{"satirlar":[["VERİLENLER","-","-"],["Standart süre","10.000 saat","-"],["Standart saat ücreti","40 TL","-"],["Fiili süre","9.200 saat","-"],["Fiili saat ücreti","45 TL","-"],["HESAP","-","-"],["Fiili İşçilik Maliyeti","9.200 x 45","414.000"],["Standart İşçilik Maliyeti","10.000 x 40","400.000"],["Ücret (Fiyat) Sapması","(45-40) x 9.200","46.000 olumsuz"],["Süre (Zaman) Sapması","(9.200-10.000) x 40","32.000 olumlu"],["Sağlama - Toplam Sapma","414.000 - 400.000","14.000 olumsuz"],["723 Hesaba Kaydedilecek Tutar (Süre Farkı)","-","32.000 olumlu"]],"basliklar":["Kalem","Hesaplama","Tutar (TL)"]},"siklar":{"C":"32.000 olumsuz","E":"46.000 olumsuz","A":"14.000 (tek)","D":"46.000 olumlu","B":"32.000 olumlu"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,2],[2,1],[2,2],[3,1],[3,2],[4,1],[4,2],[5,1],[5,2]],"tablo":{"basliklar":["Kalem","Hesaplama","Tutar (TL)"],"satirlar":[["Fiili İşçilik Maliyeti","8.500 x 47","399.500"],["Standart İşçilik Maliyeti","8.000 x 50","400.000"],["Ücret (Fiyat) Sapması","(47-50) x 8.500","25.500 olumlu"],["Süre (Zaman) Sapması","(8.500-8.000) x 50","25.000 olumsuz"],["Sağlama - Toplam Sapma","399.500 - 400.000","500 olumlu"],["724 Hesaba Kaydedilecek Tutar (Ücret Farkı)","-","25.500 olumlu"]]},"tur":"tablo","soru":"Standart maliyet yöntemi uygulayan bir mobilya işletmesinde, 2026 yılı Kasım ayında üretilen bir mamul partisi için standart üretim süresi 8.000 direkt işçilik saati, standart saat ücreti 50 TL olarak belirlenmiştir. Aynı parti fiilen 8.500 saatte tamamlanmış, fiili saat ücreti ise 47 TL olarak gerçekleşmiştir. Buna göre dönem sonunda yapılacak kapanış kaydında 724 Direkt İşçilik Ücret (Fiyat) Farkları hesabına kaydedilecek tutar ve yönü nedir?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve 724 Direkt İşçilik Ücret (Fiyat) Farkları hesabına kaydedilecek tutarı bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Standart maliyet yöntemi uygulayan bir tekstil işletmesinde, 2026 yılı Ekim ayında üretilen bir mamul partisi için standart üretim süresi 10.000 direkt işçilik saati, standart saat ücreti 40 TL olarak belirlenmiştir. Aynı parti fiilen 9.200 saatte tamamlanmış, fiili saat ücreti ise 45 TL olarak gerçekleşmiştir. Buna göre dönem sonunda yapılacak kapanış kaydında 723 Direkt İşçilik Süre (Zaman) Farkları hesabına kaydedilecek tutar ve yönü aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-34","verilenler":[{"deger":"10.000 saat","anlam":"Üretimin standart olarak tamamlanması gereken direkt işçilik saatidir, süre sapması formülünde çıkarılandır.","ad":"Standart süre"},{"deger":"40 TL","anlam":"Bir işçilik saatinin standart maliyetidir, süre sapmasında çarpan olarak kullanılır.","ad":"Standart saat ücreti"},{"deger":"9.200 saat","anlam":"Üretimin fiilen tamamlandığı direkt işçilik saatidir, standart süreden çıkarılan tutardır.","ad":"Fiili süre"},{"deger":"45 TL","anlam":"Fiilen ödenen saat başı ücrettir, ücret sapması hesabında kullanılır ama süre sapması hesabında kullanılmaz.","ad":"Fiili saat ücreti"}],"dayanak":"Tekdüzen Hesap Planı 723 Direkt İşçilik Süre (Zaman) Farkları hesabı açıklaması","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Standart süre 10.000 saat (soruda verilen); Standart ücret 40 TL (soruda verilen); Fiili süre 9.200 saat (soruda verilen); Fiili ücret 45 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: standart süre 10.000 saat, standart ücret 40 TL, fiili süre 9.200 saat, fiili ücret 45 TL. Bunlar tabloda yok ama hesapların içine bu sayılarla gireceğiz.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Kapsam: fiili saat - standart saat farkının standart ücretle çarpımı bu hesaba gider","anlatim":"723 Direkt İşçilik Süre (Zaman) Farkları nedir? Fiili süre ile standart sürenin farkından doğan sapmayı tutan hesaptır. Olumsuz fark borca, olumlu fark alacağa yazılır.","doldur":[]},{"formul":"Fiili İşçilik Maliyeti = Fiili Süre × Fiili Ücret = 9.200 (soruda verilen) × 45 (soruda verilen) = 414.000 TL","anlatim":"Önce fiili işçilik maliyetini buluyoruz, çünkü sapmaları görmek için fiili ile standardı karşılaştırmamız gerekiyor. Fiili saat ile fiili ücreti çarpıyoruz.","doldur":[[6,1],[6,2]]},{"formul":"Standart İşçilik Maliyeti = Standart Süre × Standart Ücret = 10.000 (soruda verilen) × 40 (soruda verilen) = 400.000 TL","anlatim":"Şimdi standart işçilik maliyetini hesaplıyoruz - bu, işletmenin başta öngördüğü maliyet. Standart saat ile standart ücreti çarpıyoruz.","doldur":[[7,1],[7,2]]},{"formul":"Ücret Sapması = (Fiili Ücret − Standart Ücret) × Fiili Süre = (45 (soruda verilen) − 40 (soruda verilen)) × 9.200 (soruda verilen) = 46.000 TL olumsuz","anlatim":"Ücret sapması, saat ücretindeki farktan doğar - fiili saat ile çarpılır. Fiili ücret standarttan yüksek çıktığı için bu sapma işletme aleyhine, yani olumsuz.","doldur":[[8,1],[8,2]]},{"formul":"Süre Sapması = (Fiili Süre − Standart Süre) × Standart Ücret = (9.200 (soruda verilen) − 10.000 (soruda verilen)) × 40 (soruda verilen) = −32.000, yani 32.000 TL olumlu","anlatim":"Süre sapması, saat sayısındaki farktan doğar - standart ücretle çarpılır. Fiili süre standarttan az olduğu için işçi daha hızlı çalışmış, bu işletme lehine yani olumlu.","doldur":[[9,1],[9,2]]},{"formul":"Toplam Sapma = Fiili Maliyet − Standart Maliyet = 414.000 (2. adımda bulduk) − 400.000 (3. adımda bulduk) = 14.000 TL olumsuz; Kontrol: 46.000 olumsuz (4. adımda bulduk) − 32.000 olumlu (5. adımda bulduk) = 14.000 TL olumsuz ✓","anlatim":"Sağlama yapıyoruz - iki sapmanın toplamı, fiili ile standart maliyet farkına eşit olmalı. Bu bize hesapladığımız sapmaların doğru olduğunu kanıtlar.","doldur":[[10,1],[10,2]]},{"formul":"723 DİREKT İŞÇİLİK SÜRE (ZAMAN) FARKLARI (ALACAK) 32.000 = 5. adımda bulduğumuz olumlu süre sapması","anlatim":"Süre sapması olumlu çıktığı için 723 hesabın alacağına yazılır - hesap tanımı bunu söylüyor. Kapanışta bu hesap ilgili stok hesaplarına aktarılarak kapanır.","doldur":[[11,2]]},{"formul":"Ters durum: fiili süre standarttan fazla olsaydı → 723 hesabın borcuna kaydedilirdi","anlatim":"Ters durumda süre sapması olumsuz çıksaydı, yani fiili süre standarttan fazla olsaydı, tutar 723 hesabın borcuna yazılırdı. Yön hep sapmanın işaretine bağlı.","doldur":[]},{"formul":"Yanlış yol: 723 hesabına 46.000 olumsuz yazmak (HATALI) → doğrusu 32.000 olumlu, alacak (6. adımda bulduk)","anlatim":"En sık hata: öğrenciler ücret sapmasıyla süre sapmasını karıştırıp 46.000 olumsuzu 723 hesaba yazıyor. Oysa 723 hesap sadece süre farkını tutar, ücret farkını değil.","doldur":[]}],"anahtar":[{"ornek":"standart","kok":"standa"},{"ornek":"sapması","kok":"sapmas"},{"ornek":"ücreti","kok":"ücreti"},{"ornek":"olumludur","kok":"olumlu"},{"ornek":"maliyetini","kok":"maliye"},{"ornek":"hesabın","kok":"hesabı"}],"konuGiris":{"harita":"Ne zaman test edilir: standart maliyet sistemi uygulanan işletmelerde dönem sonu kapanış kaydı yapılırken test edilir. Nasıl ölçülür: fiili saat ile standart saat arasındaki fark, standart saat ücretiyle çarpılarak ölçülür. Nasıl kaydedilir: sonuç olumsuzsa (fiili\u003estandart) 723 hesabın borcuna, olumluysa alacağına kaydedilir.","desen":"Sınav bu konuda çoğunlukla ücret sapması ile süre sapmasının çarpanlarını karıştırtmaya çalışır; süre farkında fiili saat değil standart ücret kullanılmalıdır. Tuzak, öğrencinin fiili saat ücretini süre farkı hesabına dahil etmesini sağlamaktır. Bu soru Tekdüzen Hesap Planı 723 hesap tanımı ve standart maliyet sapma formülü noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Bir işin normalde alması gereken işçilik süresi","ad":"Standart saat","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"İşin gerçekte tamamlandığı işçilik süresi","ad":"Fiili saat","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Bir saatlik işçiliğe önceden belirlenen ücret tutarı","ad":"Standart saat ücreti","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Fiili ile standart saat farkının standart ücretle çarpımı sonucu tutar","ad":"Süre (zaman) farkı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Standart ve fiili saat ile standart saat ücreti verilerek 723 hesaba kaydedilecek tutar ve yönü sorulur.","panel_ornek":"Bir spor salonu üyeliğinde ayda 8 saat antrenman hakkın var ama sen fiilen sadece 6 saat gidiyorsun; standart 8 saat üzerinden ücret ödemene rağmen az kullandığın için salon senin lehine bir fark oluşur diyelim. İşte standart ile fiili kullanım arasındaki bu fark, işçilik süre farkının mantığıyla aynı: beklenenden az/çok zaman harcanması bir fark yaratır. Burada rakamlar sadece örnek, gerçek soruyla ilgisi yok.","ornek":"Bir spor salonu üyeliğinde ayda 8 saat antrenman hakkın var ama sen fiilen sadece 6 saat gidiyorsun; standart 8 saat üzerinden ücret ödemene rağmen az kullandığın için salon senin lehine bir fark oluşur diyelim. İşte standart ile fiili kullanım arasındaki bu fark, işçilik süre farkının mantığıyla aynı: beklenenden az/çok zaman harcanması bir fark yaratır. Burada rakamlar sadece örnek, gerçek soruyla ilgisi yok.","yontemler":"Süre farkı = (Fiili saat - Standart saat) x Standart saat ücreti formülüyle hesaplanır; sonuç negatifse olumlu (alacak), pozitifse olumsuz (borç) kaydedilir.","nedir":"Direkt işçilik süre farkı, standart maliyet sisteminde fiili çalışma saati ile standart saatin farkının parasal karşılığını gösterir. Sınav bu farkın tutarını ve olumlu/olumsuz yönünü doğru hesaplayıp doğru hesaba (borç/alacak) yazabilmeni ölçer."},"olay":"(9.200-10.000) x 40 = -32.000, yani 32.000 olumlu.","tuzak":{"C":{"ad":"Yön Ters Çevirme Tuzağı","metin":"Fiili saatin standarttan az olması nedeniyle sapmayı doğru tutarla bulursun ama işletme lehine olan bu durumu olumsuz sanırsın. Doğrusu: süre kısalmışsa bu işletme lehinedir, yani olumludur."},"E":{"ad":"Formül-Yön Karıştırma Tuzağı","metin":"Ücret sapması formülünü doğru uygularsın ama yönünü ters okuyup olumsuz dersin; oysa ücret sapması zaten olumsuzdur, süre sapması değildir. Doğrusu: sorulan süre sapmasıdır, bu tutar ücret sapmasına aittir."},"D":{"ad":"Yanlış Hesap Formülü Tuzağı","metin":"Süre sapması sorulduğu halde ücret sapması formülünü ((Fiili Ücret - Standart Ücret) x Fiili Saat) uygularsın. Doğrusu: süre sapmasında çarpan standart saat ücretidir, fiili saat değil."},"A":{"ad":"Toplam Sapmayı Süre Sapması Sanma Tuzağı","metin":"Fiili maliyet (414.000) ile standart maliyet (400.000) arasındaki 14.000\u0027lik toplam farkı, ücret ve süre sapmasına ayrıştırmadan doğrudan süre farkı sanırsın. Doğrusu: 14.000 toplam sapmadır, süre sapması bunun yalnız bir bileşenidir."}},"celdiriciYol":{"C":"(45-40) x 9.200 = 46.000, yönü ters okunarak olumlu yazılmış (ücret sapmasını süre sapması sanıp yönünü karıştırma)","E":"(9.200-10.000) x 40 = -32.000, mutlak değer alınıp yönü olumsuz yazılmış (lehte sonucu aleyhte sanma)","D":"(45-40) x 9.200 = 46.000 (süre sapması yerine ücret sapması formülünün kullanılması - çarpan hatası)","A":"(9.200 x 45) - (10.000 x 40) = 414.000 - 400.000 = 14.000 (toplam sapmayı ayrıştırmadan süre farkı sanma)"},"hap":"Direkt işçilik süre (zaman) sapması, (Fiili Saat - Standart Saat) x Standart Saat Ücreti ile bulunur; fiili saat standarttan azsa sapma olumludur ve 723 hesabın alacağına kaydedilir.","teshis":{"C":{"gercek":"723 hesabın borç-alacak yönü sapmanın işaretine bağlıdır; olumsuz süre farkı borca, olumlu süre farkı alacağa kaydedilir.","ayirt":"Fiili saat standarttan kısaldıysa bu işletme lehine mi aleyhine mi?","paragraf":"Tekdüzen Hesap Planı 723 hesap açıklaması","yanilgi":"Doğru tutarı bulduğun için yönü önemsemeyip rastgele olumsuz yazılabileceğini sanıyorsun."},"E":{"gercek":"Ücret sapması (Fiili Ücret - Standart Ücret) x Fiili Saat ile bulunur ve 722 hesaba, süre sapması ise ayrı formülle 723 hesaba kaydedilir.","ayirt":"Bu tutarı hesaplarken saat mi ücret mi farkını kullandım?","paragraf":"Tekdüzen Hesap Planı 722-723 hesap ayrımı","yanilgi":"Bulduğun 46.000 TL\u0027nin süre sapmasına ait olduğunu sanıyorsun; oysa bu ücret sapmasının tutarıdır."},"A":{"gercek":"Toplam direkt işçilik sapması ücret ve süre sapmalarının toplamıdır; her biri ayrı hesapta izlenir (723 yalnız süre sapmasını taşır).","ayirt":"Bu tutar fiili ile standart ücretin farkından mı, yoksa saatlerin farkından mı doğdu?","paragraf":"Tekdüzen Hesap Planı 723 hesap açıklaması","yanilgi":"Toplam sapma ile süre sapmasının aynı şey olduğunu, ayrıştırma yapmadan tek bir farkın yeterli olduğunu düşünüyorsun."},"D":{"gercek":"Süre sapması standart saat ücretiyle, ücret sapması ise fiili saatle çarpılarak bulunur; çarpanlar ters kullanılırsa yanlış hesap ortaya çıkar.","ayirt":"Bu formülde çarpan fiili saat mi, standart saat ücreti mi?","paragraf":"Maliyet muhasebesi - direkt işçilik sapma formülleri","yanilgi":"Süre sapması ile ücret sapmasının aynı çarpanla hesaplandığını sanıyorsun."},"B":{"gercek":"Fiili saat standart saatten azsa işçilik daha verimli kullanılmıştır, bu işletme lehine (olumlu) bir sapmadır ve 723 hesabın alacağına kaydedilir.","ayirt":"Fiili saat standarttan az mı çok mu, azsa bu işletme için iyi mi kötü mü?","paragraf":"Tekdüzen Hesap Planı 723 hesap açıklaması","yanilgi":"Fiili sürenin standarttan kısa olmasının olumsuz bir durum olduğunu, dolayısıyla bu şıkkın yanlış olması gerektiğini düşünüyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 62"},"kural":"yan ürünün net gerçekleşebilir değeri ortak maliyetten düşülür, kalan tutar ayrılma noktası satış değerlerine orantılı dağıtılır, A\u0027ya düşen pay ek işleme maliyetiyle toplanıp birim maliyet bulunur, nihai satış fiyatından bu birim maliyet düşülerek kâr hesaplanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 62","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Çok katmanlı ortak maliyet sorularında her katmanı ayrı bir satıra yaz; bir katmanı atlayınca çıkan sayı mutlaka şıklardan biri olur, bu yüzden ara sonuçları kontrol ederek ilerle.","konu":"7-a seçeneği üretim maliyeti kaydı","tablo":{"satirlar":[["VERİLENLER","-"],["Dönem ortak maliyeti","500.000 TL"],["C Yan Ürünü satış değeri","100.000 TL"],["C Yan Ürünü ek maliyeti","20.000 TL"],["A Mamulü miktarı ve fiyatı","4.000 kg, 90 TL/kg"],["B Mamulü miktarı ve fiyatı","4.000 kg, 60 TL/kg"],["A Mamulü ek işleme maliyeti","48.000 TL"],["A Mamulü nihai satış fiyatı","95 TL/kg"],["HESAP","-"],["Yan Ürün C Net Gerçekleşebilir Değeri (100.000-20.000)","80.000"],["Dağıtıma Esas Ortak Maliyet (500.000-80.000)","420.000"],["A+B Ayrılma Noktası Satış Değeri Toplamı (360.000+240.000)","600.000"],["A Mamulü Ortak Maliyet Payı (420.000×360.000/600.000)","252.000"],["A Mamulü Toplam Maliyeti (252.000+48.000)","300.000"],["A Mamulü Birim Maliyeti (300.000/4.000)","75"],["A Mamulü Birim Brüt Kâr
