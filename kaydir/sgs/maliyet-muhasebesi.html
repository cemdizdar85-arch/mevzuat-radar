ı (95-75)","20"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"20","E":"32","A":"8","D":"23","B":"15"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Yan Ürün R Net Gerçekleşebilir Değeri (150.000-30.000)","120.000"],["Dağıtıma Esas Ortak Maliyet (600.000-120.000)","480.000"],["P+Q Ayrılma Noktası Satış Değeri Toplamı (360.000+240.000)","600.000"],["Q Mamulü Ortak Maliyet Payı (480.000×240.000/600.000)","192.000"],["Q Mamulü Toplam Maliyeti (192.000+48.000)","240.000"],["Q Mamulü Birim Maliyeti (240.000/5.000)","48"],["Q Mamulü Birim Brüt Kârı (64-48)","16"]]},"tur":"tablo","soru":"Bir süt ürünleri işletmesinde tek üretim sürecinden P Mamulü, Q Mamulü ve R Yan Ürünü elde edilmektedir. Dönem ortak maliyeti 600.000 TL\u0027dir. R Yan Ürününün satış değeri 150.000 TL, satılabilir hale getirme ek maliyeti 30.000 TL\u0027dir ve net gerçekleşebilir değeri ortak maliyetten düşülmektedir. Ayrılma noktasında P Mamulü 5.000 kg, 72 TL/kg; Q Mamulü 5.000 kg, 48 TL/kg piyasa değerine sahiptir; ortak maliyet bu değerlere orantılı dağıtılmaktadır. Q Mamulü ayrılma sonrası 48.000 TL ek işleme maliyetine tabi tutulduktan sonra 64 TL/kg fiyatla satılmaktadır. Buna göre, Q Mamulünün birim brüt kârı kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve Q Mamulünün birim brüt kârının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir süt ürünleri işletmesinde tek üretim sürecinden A Mamulü, B Mamulü ve C Yan Ürünü elde edilmektedir. Dönem ortak maliyeti 500.000 TL\u0027dir. C Yan Ürününün satış değeri 100.000 TL, satılabilir hale getirme ek maliyeti 20.000 TL\u0027dir ve net gerçekleşebilir değeri ortak maliyetten düşülmektedir. Ayrılma noktasında A Mamulü 4.000 kg, 90 TL/kg; B Mamulü 4.000 kg, 60 TL/kg piyasa değerine sahiptir; ortak maliyet bu değerlere orantılı dağıtılmaktadır. A Mamulü ayrılma sonrası 48.000 TL ek işleme maliyetine tabi tutulduktan sonra 95 TL/kg fiyatla satılmaktadır. Buna göre, A Mamulünün birim brüt kârı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-36","verilenler":[{"deger":"500.000 TL","anlam":"A, B ve C için ayrılma noktasına kadar oluşan toplam ortak maliyettir; yan ürün payı düşüldükten sonra A ve B\u0027ye dağıtılacaktır.","ad":"Dönem ortak maliyeti"},{"deger":"100.000 TL","anlam":"Yan ürünün net gerçekleşebilir değerinin hesaplanmasında kullanılan nihai/satış değeridir.","ad":"C Yan Ürünü satış değeri"},{"deger":"20.000 TL","anlam":"Yan ürünü satılabilir hale getirmek için katlanılan maliyettir; net gerçekleşebilir değer bulunurken satış değerinden düşülür.","ad":"C Yan Ürünü ek maliyeti"},{"deger":"4.000 kg, 90 TL/kg","anlam":"A\u0027nın ayrılma noktasındaki satış değerini (360.000 TL) ve dağıtım oranını belirler.","ad":"A Mamulü miktarı ve fiyatı"},{"deger":"4.000 kg, 60 TL/kg","anlam":"B\u0027nin ayrılma noktasındaki satış değerini (240.000 TL) ve dağıtım oranını belirler.","ad":"B Mamulü miktarı ve fiyatı"},{"deger":"48.000 TL","anlam":"Ayrılma noktası sonrası A\u0027ya özgü, dağıtıma girmeyen ve doğrudan A\u0027nın toplam maliyetine eklenen tutardır.","ad":"A Mamulü ek işleme maliyeti"},{"deger":"95 TL/kg","anlam":"Birim kârın hesaplanmasında birim maliyetten düşülecek gerçek satış fiyatıdır.","ad":"A Mamulü nihai satış fiyatı"}],"dayanak":"Maliyet Muhasebesi - Ortak (Birleşik) Maliyet Dağıtımı: Satış Değeri ve Net Gerçekleşebilir Değer Yöntemleri, Yan Ürün ve Ek İşleme Maliyeti (teorik çerçeve, mevzuat maddesi yok)","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Dönem ortak maliyeti 500.000 TL (soruda verilen); C satış değeri 100.000 TL (soruda verilen); C ek maliyeti 20.000 TL (soruda verilen); A Mamulü 4.000 kg, 90 TL/kg (soruda verilen); B Mamulü 4.000 kg, 60 TL/kg (soruda verilen); A ek işleme maliyeti 48.000 TL (soruda verilen); A satış fiyatı 95 TL/kg (soruda verilen)","anlatim":"Soru bize şunları vermiş: dönem ortak maliyeti, C yan ürününün satış değeri ve ek maliyeti, A ile B mamullerinin ayrılma noktası kg ve fiyatları, A\u0027nın ek işleme maliyeti ve satış fiyatı.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]]},{"formul":"C Net Gerçekleşebilir Değeri = Satış Değeri − Ek Maliyet = 100.000 (soruda verilen) − 20.000 (soruda verilen) = 80.000","anlatim":"Yan ürün nedir? Ana mamullerle beraber çıkan, değeri düşük ikincil üründür. Net gerçekleşebilir değeri ortak maliyetten düşülür, çünkü yan ürün ayrı maliyet taşımaz.","doldur":[[9,1]]},{"formul":"Dağıtıma Esas Ortak Maliyet = Dönem Ortak Maliyeti − C NGD = 500.000 (soruda verilen) − 80.000 (1. adımda bulduk) = 420.000","anlatim":"Şimdi dağıtıma esas ortak maliyeti buluyoruz. Yan ürünün değeri toplam maliyetten çıkarılınca geriye A ve B\u0027ye dağıtılacak tutar kalır.","doldur":[[10,1]]},{"formul":"A Mamulü Satış Değeri = 4.000 (soruda verilen) × 90 (soruda verilen) = 360.000","anlatim":"A Mamulünün ayrılma noktası satış değerini hesaplıyoruz. Bu değer, ortak maliyetin dağıtımında pay oranını belirleyecek.","doldur":[]},{"formul":"B Mamulü Satış Değeri = 4.000 (soruda verilen) × 60 (soruda verilen) = 240.000","anlatim":"B Mamulünün ayrılma noktası satış değerini de aynı mantıkla buluyoruz. İkisini toplayınca dağıtım oranının payda tutarı çıkar.","doldur":[]},{"formul":"A+B Ayrılma Noktası Satış Değeri Toplamı = 360.000 (4. adımda bulduk) + 240.000 (5. adımda bulduk) = 600.000","anlatim":"A ve B\u0027nin satış değerlerini topluyoruz. Bu toplam, orantılı dağıtımda payda olarak kullanılacak.","doldur":[[11,1]]},{"formul":"A Mamulü Ortak Maliyet Payı = Dağıtıma Esas Ortak Maliyet × A Satış Değeri / Toplam Satış Değeri = 420.000 (2. adımda bulduk) × 360.000 (4. adımda bulduk) / 600.000 (6. adımda bulduk) = 252.000","anlatim":"Ortak maliyeti satış değeri oranında dağıtıyoruz. A\u0027nın payı, kendi satış değerinin toplam içindeki oranına göre hesaplanır.","doldur":[[12,1]]},{"formul":"A Mamulü Toplam Maliyeti = Ortak Maliyet Payı + Ek İşleme Maliyeti = 252.000 (7. adımda bulduk) + 48.000 (soruda verilen) = 300.000","anlatim":"A\u0027nın ek işleme maliyeti nedir? Ayrılma noktasından sonra mamulü satılabilir hale getirmek için yapılan ilave harcamadır. Ortak maliyet payına eklenir, çünkü toplam maliyeti tamamlar.","doldur":[[13,1]]},{"formul":"A Mamulü Birim Maliyeti = Toplam Maliyet / Kg = 300.000 (8. adımda bulduk) / 4.000 (soruda verilen) = 75","anlatim":"Toplam maliyeti kg sayısına bölerek birim maliyeti buluyoruz. Kâr hesaplamak için birim bazda karşılaştırma gerekir.","doldur":[[14,1]]},{"formul":"A Mamulü Birim Brüt Kârı = Satış Fiyatı − Birim Maliyet = 95 (soruda verilen) − 75 (9. adımda bulduk) = 20","anlatim":"Birim satış fiyatından birim maliyeti çıkararak birim brüt kârı buluyoruz. Bu son adım sorunun cevabını verir.","doldur":[[15,1]]},{"formul":"Yanlış yol: A Payı = 500.000 × 360.000 / 600.000 = 300.000 (HATALI) → doğrusu 252.000 (7. adımda bulduk)","anlatim":"En sık hata: yan ürünün net gerçekleşebilir değerini düşmeden dağıtım yapmaktır. Öyle yapılırsa dağıtıma esas tutar yanlış çıkar ve tüm sonuç bozulur.","doldur":[]}],"anahtar":[{"ornek":"maliyet","kok":"maliye"},{"ornek":"değeri","kok":"değeri"},{"ornek":"dağıtımında","kok":"dağıtı"},{"ornek":"noktası","kok":"noktas"},{"ornek":"ayrılma","kok":"ayrılm"},{"ornek":"ürünün","kok":"ürünün"}],"konuGiris":{"harita":"Ne zaman test edilir: tek süreçten çok ürün çıkan üretimlerde ortak maliyet dağıtım sorularında test edilir. Nasıl ölçülür: yan ürünün net geliri düşülüp kalan tutar ana ürünlerin ayrılma noktası değerlerine oranlanarak ölçülür. Nasıl kaydedilir: her ürüne düşen pay, o ürünün ek işleme maliyetiyle toplanıp birim maliyet bulunarak kaydedilir.","desen":"Sınav önce yan ürünün net gerçekleşebilir değerini ortak maliyetten düşürtüp kalan tutarı ana ürünlerin ayrılma noktası değerlerine oranlatır. Tuzak, ek işleme maliyetinin dağıtıma değil doğrudan ilgili ürüne eklenmesidir; bunu unutup toplam maliyeti yanlış oranlamak hataya yol açar. Bu soru ortak maliyet dağıtımı ve yan ürün düşme kuralı noktasından geliyor (p. TEORİ-Ortak maliyet).","terimler":[{"kaynak":"soruda verilir","tanim":"Ayrılma noktasına kadar birlikte oluşan, ürünlere dağıtılan maliyet.","ad":"Ortak maliyet","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Yan ürünün satış değerinden satılabilir hale getirme maliyeti düşülmüş tutarı.","ad":"Net gerçekleşebilir değer","kim":"piyasa fiyatlar (satış bedeli, alış bedeli gibi gerçekleşen tutarlar)"},{"kaynak":"sen hesaplarsın","tanim":"Ürünün ek işlem görmeden önceki miktar ile piyasa fiyatının çarpımı.","ad":"Ayrılma noktası değeri","kim":"piyasa fiyatlar (satış bedeli, alış bedeli gibi gerçekleşen tutarlar)"},{"kaynak":"sen hesaplarsın","tanim":"Satış fiyatından toplam birim maliyetin çıkarılmasıyla bulunan tutar.","ad":"Birim brüt kâr","kim":"işletme yönetimi tahmin eder ya da belirler (faydalı ömür, tamamlanma yüzdesi, normal kapasite)"}],"sinavda":"Ortak maliyet, yan ürün bilgileri ve ana ürünlerin ayrılma noktası fiyatları verilip, ek işlem gören ürünün birim brüt kârı istenir.","panel_ornek":"İki kardeş anneannelerinden kalan 12.000 TL\u0027lik altını, biri 3 gram diğeri 2 gram olacak şekilde paylaşacak; önce eskimiş bir yüzüğü 1.000 TL\u0027ye satıp bu tutarı toplam paradan düşüyorlar, kalanı gram oranına göre bölüyorlar. Bu, bir tutarı önce ayırıp sonra oranla paylaştırma mantığıdır.","ornek":"İki kardeş anneannelerinden kalan 12.000 TL\u0027lik altını, biri 3 gram diğeri 2 gram olacak şekilde paylaşacak; önce eskimiş bir yüzüğü 1.000 TL\u0027ye satıp bu tutarı toplam paradan düşüyorlar, kalanı gram oranına göre bölüyorlar. Bu, bir tutarı önce ayırıp sonra oranla paylaştırma mantığıdır.","yontemler":"Satış değeri (piyasa değeri) yöntemi kullanılır; ortak maliyetten yan ürünün net gerçekleşebilir değeri düşülüp kalan tutar ana ürünlerin ayrılma noktası değerine oranlanır, sonra ek işleme maliyeti doğrudan ilgili ürüne eklenir.","nedir":"Bu konu, tek süreçten birden fazla ürün çıktığında ortak maliyetin ürünlere nasıl paylaştırılacağını öğretir. Sınav, yan ürün düşme ve satış değerine göre dağıtım işleminin doğru sırayla yapılıp yapılmadığını ölçer."},"olay":"NGD=100.000-20.000=80.000; dağıtıma esas=500.000-80.000=420.000; toplam satış değeri=360.000+240.000=600.000; A payı=420.000×360.000/600.000=252.000; A toplam maliyet=252.000+48.000=300.000; birim maliyet=300.000/4.000=75; birim kâr=95-75=20.","tuzak":{"D":{"ad":"Net Gerçekleşebilir Değer Tuzağı","metin":"C Yan Ürününün satılabilir hale getirme ek maliyeti düşülmeden brüt satış değeri (100.000 TL) doğrudan ortak maliyetten indirilir. Doğrusu: net gerçekleşebilir değer, satış değerinden ek maliyet düşülerek bulunur ve dağıtımdan önce bu tutar indirilir."},"E":{"ad":"Ek İşleme Atlama Tuzağı","metin":"A Mamulünün ayrılma sonrası katlandığı 48.000 TL ek işleme maliyeti birim maliyete hiç eklenmeden yalnızca ortak maliyetten alınan pay üzerinden birim maliyet hesaplanır. Doğrusu: ayrılma sonrası ek işleme maliyeti, ortak maliyetten alınan paya eklenerek toplam maliyet bulunur."},"A":{"ad":"Yan Ürün Tuzağı","metin":"C Yan Ürününün net gerçekleşebilir değeri ortak maliyetten hiç düşülmeden tüm 500.000 TL, A ve B\u0027nin satış değeri oranında dağıtılmış gibi hesaplanır. Doğrusu: dağıtıma esas ortak maliyet önce yan ürünün net gerçekleşebilir değeri düşülerek bulunur."},"B":{"ad":"Fiyat Katmanı Tuzağı","metin":"A Mamulünün birim maliyeti doğru bulunur ama karşılaştırmada ayrılma noktasındaki 90 TL/kg piyasa değeri, nihai 95 TL/kg satış fiyatı yerine kullanılır. Doğrusu: birim kâr, ek işleme sonrası gerçekleşen nihai satış fiyatına göre hesaplanır."}},"celdiriciYol":{"D":"(500.000-100.000)×360.000/600.000=240.000; 240.000+48.000=288.000; 288.000/4.000=72; 95-72=23 (yan ürün satış değerinden satılabilir kılma ek maliyeti düşülmeden NGD hesaplandı)","E":"252.000/4.000=63; 95-63=32 (A mamulünün ayrılma sonrası ek işleme maliyeti birim maliyete eklenmedi)","A":"(500.000×360.000/600.000)+48.000=348.000; 348.000/4.000=87; 95-87=8 (yan ürünün net gerçekleşebilir değeri ortak maliyetten düşülmeden dağıtım yapıldı)","B":"252.000+48.000=300.000; 300.000/4.000=75; 90-75=15 (nihai satış fiyatı yerine ayrılma noktasındaki piyasa fiyatı kullanıldı)"},"hap":"Ortak maliyet dağıtımında önce yan ürünün net gerçekleşebilir değeri düşülür, kalan tutar ayrılma noktası değerine göre paylaştırılır, sonra her ürünün kendi ek işleme maliyeti eklenerek birim maliyet ve kâr bulunur.","teshis":{"C":{"gercek":"Net gerçekleşebilir değer, satış değeri oranında dağıtım ve ek işleme maliyeti art arda uygulanınca birim kâr 20 TL çıkar.","ayirt":"Dört katmanın (NGD, dağıtım, ek işleme, kâr) hepsini sırayla uyguladım mı?","paragraf":"Ortak (birleşik) maliyet dağıtımı - satış değeri ve NGD yöntemleri","yanilgi":"Bu kadar çok katmanlı bir soruda tek bir adımı atlayabileceğini düşünüp şıkkı elersin."},"E":{"gercek":"Ayrılma noktasından sonraki ek işleme maliyeti dağıtıma girmez ama ilgili ürünün toplam maliyetine doğrudan eklenir.","ayirt":"Ürünün ayrılma sonrası kendine özgü maliyetini toplam maliyete kattım mı?","paragraf":"Ayrılma noktası sonrası ek (ayrı) işleme maliyeti kuralı","yanilgi":"Ayrılma noktasından sonraki maliyetin ürüne doğrudan yükleneceğini unutup yalnız ortak maliyet payını yeterli sayıyorsun."},"A":{"gercek":"Yan ürünün net gerçekleşebilir değeri, dağıtıma esas ortak maliyetten önce düşülür; kalan tutar ana ürünlere dağıtılır.","ayirt":"Dağıtıma başlamadan önce yan ürünün payını ortak maliyetten çıkardım mı?","paragraf":"Ortak maliyet dağıtımı - yan ürün NGD teorisi","yanilgi":"Ortak maliyeti dağıtırken yan ürünün varlığını hiç dikkate almadan tüm tutarı A ve B\u0027ye paylaştırıyorsun."},"D":{"gercek":"Net gerçekleşebilir değer = nihai/satış değeri − satılabilir hale getirme (ek işleme) maliyetidir.","ayirt":"Yan ürünün satış değerinden ek maliyeti düştüm mü?","paragraf":"Net gerçekleşebilir değer yöntemi tanımı","yanilgi":"Net gerçekleşebilir değeri hesaplarken satılabilir hale getirme maliyetini unutup doğrudan satış değerini kullanıyorsun."},"B":{"gercek":"Kâr, ürünün fiilen satıldığı nihai satış fiyatı ile ek işleme dahil birim maliyet karşılaştırılarak bulunur.","ayirt":"Kullandığım satış fiyatı, ürünün gerçekten satıldığı son fiyat mı yoksa ayrılma noktası değeri mi?","paragraf":"Ek işleme sonrası nihai değer teorisi","yanilgi":"Birim maliyeti doğru bulduğun için kârı da aynı fiyat düzeyinde, ayrılma noktası fiyatıyla karşılaştırıyorsun."}},"verilen":[[9,1],[10,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 62"},"kural":"Birleşik giderin belirlenen oranı önce mamullere eşit dağıtılır, kalan tutar eşdeğer birim (miktar x katsayı) oranına göre paylaştırılır ve iki pay toplanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 62","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"İşlemi iki ayrı katmana böl: önce eşit dağıtım tutarını bul, sonra kalanı eşdeğer birimlere göre paylaştır; ikisini karıştırıp tek adımda çözme.","konu":"birleşik ürün katsayı yöntemi","tablo":{"satirlar":[["VERİLENLER","-"],["Toplam birleşik gider","480.000 TL"],["Eşit dağıtım oranı","%25"],["A mamulü katsayısı ve üretimi","katsayı 1, 6.000 birim"],["B mamulü katsayısı ve üretimi","katsayı 2, 4.000 birim"],["C mamulü katsayısı ve üretimi","katsayı 3, 2.000 birim"],["HESAP","-"],["Eşit dağıtılacak tutar (480.000 x %25)","120.000"],["Kalan (katsayılı dağıtıma esas) tutar (480.000-120.000)","360.000"],["Eşdeğer birimler (A:6.000x1=6.000, B:4.000x2=8.000, C:2.000x3=6.000)","Toplam 20.000"],["Eşdeğer birim maliyeti (360.000/20.000)","18"],["C mamulünün katsayılı payı (6.000x18)","108.000"],["C mamulünün eşit payı (120.000/3)","40.000"],["C mamulünün toplam birleşik gider payı (108.000+40.000)","148.000"]],"basliklar":["Kalem","Tutar/Değer"]},"siklar":{"C":"144.000","E":"220.000","A":"100.000","D":"148.000","B":"128.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"tablo":{"basliklar":["Kalem","Tutar/Değer"],"satirlar":[["Eşit dağıtılacak tutar (600.000 x %20)","120.000"],["Kalan (katsayılı dağıtıma esas) tutar (600.000-120.000)","480.000"],["Eşdeğer birimler (P:8.000x1=8.000, Q:4.000x2=8.000, R:2.000x4=8.000)","Toplam 24.000"],["Eşdeğer birim maliyeti (480.000/24.000)","20"],["Q mamulünün katsayılı payı (8.000x20)","160.000"],["Q mamulünün eşit payı (120.000/3)","40.000"],["Q mamulünün toplam birleşik gider payı (160.000+40.000)","200.000"]]},"tur":"tablo","soru":"Bir kimya işletmesinde tek bir esas üretim gider yerinde P, Q ve R mamulleri birlikte üretilmektedir. Dönemde oluşan birleşik (ortak) giderler toplamı 600.000 TL\u0027dir. İşletme, birleşik giderlerin %20\u0027sini mamullere eşit olarak dağıttıktan sonra kalan tutarı, her mamul için belirlenen katsayı ile eşdeğer birim (üretim miktarı x katsayı) yöntemine göre dağıtmaktadır. Mamullere ait katsayılar ve dönem üretim miktarları şöyledir: P mamulü katsayı 1, üretim 8.000 birim; Q mamulü katsayı 2, üretim 4.000 birim; R mamulü katsayı 4, üretim 2.000 birim. Buna göre, Q mamulünün birleşik giderlerden alacağı toplam pay kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve Q mamulünün birleşik giderlerden alacağı toplam payın 200.000 TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir kimya işletmesinde tek bir esas üretim gider yerinde A, B ve C mamulleri birlikte üretilmektedir. Dönemde oluşan birleşik (ortak) giderler toplamı 480.000 TL\u0027dir. İşletme, birleşik giderlerin %25\u0027ini mamullere eşit olarak dağıttıktan sonra kalan tutarı, her mamul için belirlenen katsayı ile eşdeğer birim (üretim miktarı x katsayı) yöntemine göre dağıtmaktadır. Mamullere ait katsayılar ve dönem üretim miktarları şöyledir: A mamulü katsayı 1, üretim 6.000 birim; B mamulü katsayı 2, üretim 4.000 birim; C mamulü katsayı 3, üretim 2.000 birim. Buna göre, C mamulünün birleşik giderlerden alacağı toplam pay kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-38","verilenler":[{"deger":"480.000 TL","anlam":"Ortak üretim gider yerinde biriken, mamuller arasında dağıtılacak toplam tutar.","ad":"Toplam birleşik gider"},{"deger":"%25","anlam":"Birleşik giderin bu oranı mamullere önce eşit olarak paylaştırılır.","ad":"Eşit dağıtım oranı"},{"deger":"katsayı 1, 6.000 birim","anlam":"A\u0027nın eşdeğer biriminin (miktar x katsayı) hesabında kullanılır.","ad":"A mamulü katsayısı ve üretimi"},{"deger":"katsayı 2, 4.000 birim","anlam":"B\u0027nin eşdeğer biriminin hesabında kullanılır, toplam eşdeğer birimi etkiler.","ad":"B mamulü katsayısı ve üretimi"},{"deger":"katsayı 3, 2.000 birim","anlam":"İstenen ürün olan C\u0027nin eşdeğer biriminin ve nihai payının hesabında kullanılır.","ad":"C mamulü katsayısı ve üretimi"}],"dayanak":"Teori Notu - birleşik maliyette katsayılı bölme yöntemi","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Birleşik gider toplamı 480.000 TL (soruda verilen); eşit dağıtım oranı %25 (soruda verilen); A katsayı 1, üretim 6.000 (soruda verilen); B katsayı 2, üretim 4.000 (soruda verilen); C katsayı 3, üretim 2.000 (soruda verilen)","anlatim":"Soru bize şunları vermiş: birleşik gider toplamı, eşit dağıtım oranı, mamul katsayıları ve üretim miktarları.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"Eşit dağıtılacak tutar = Birleşik gider × %25 = 480.000 (soruda verilen) × %25 = 120.000","anlatim":"Birleşik giderin bir kısmı önce mamullere eşit bölünüyor. Bu kısım eşdeğer birime bakmadan direkt orandan çıkar.","doldur":[[7,1]]},{"formul":"Kalan tutar = Birleşik gider − Eşit dağıtılacak tutar = 480.000 (soruda verilen) − 120.000 (2. adımda bulduk) = 360.000","anlatim":"Geri kalan tutar katsayılı dağıtıma esas olacak. Toplamdan eşit payı çıkarıyoruz.","doldur":[[8,1]]},{"formul":"A eşdeğer birimi = Üretim × Katsayı = 6.000 (soruda verilen) × 1 (soruda verilen) = 6.000","anlatim":"Eşdeğer birim, miktar ile katsayının çarpımı. A mamulünün payını bu yolla buluyoruz.","doldur":[]},{"formul":"B eşdeğer birimi = Üretim × Katsayı = 4.000 (soruda verilen) × 2 (soruda verilen) = 8.000","anlatim":"Aynı işlemi B mamulü için yapıyoruz, katsayı farklı olduğu için sonuç farklı çıkar.","doldur":[]},{"formul":"C eşdeğer birimi = Üretim × Katsayı = 2.000 (soruda verilen) × 3 (soruda verilen) = 6.000","anlatim":"C mamulü için de aynı mantık işler. Bu değer sonraki payı belirleyecek.","doldur":[]},{"formul":"Toplam eşdeğer birim = A + B + C = 6.000 (4. adımda bulduk) + 8.000 (5. adımda bulduk) + 6.000 (6. adımda bulduk) = 20.000","anlatim":"Üç mamulün eşdeğer birimlerini toplayıp genel paydayı buluyoruz. Birim maliyet bu toplama bölünecek.","doldur":[[9,1]]},{"formul":"Eşdeğer birim maliyeti = Kalan tutar / Toplam eşdeğer birim = 360.000 (3. adımda bulduk) / 20.000 (7. adımda bulduk) = 18","anlatim":"Kalan tutarı toplam eşdeğer birime bölünce bir birimin maliyetini buluruz. Bu değer her mamule ayrı ayrı çarpılacak.","doldur":[[10,1]]},{"formul":"C katsayılı pay = C eşdeğer birimi × Eşdeğer birim maliyeti = 6.000 (6. adımda bulduk) × 18 (8. adımda bulduk) = 108.000","anlatim":"C mamulünün katsayılı dağıtımdan alacağı payı buluyoruz. Kendi eşdeğer birimi ile birim maliyeti çarpıyoruz.","doldur":[[11,1]]},{"formul":"C eşit pay = Eşit dağıtılacak tutar / Mamul sayısı = 120.000 (2. adımda bulduk) / 3 (soruda verilen) = 40.000","anlatim":"Eşit dağıtılan kısımdan C\u0027ye düşen payı da hesaplıyoruz. Üç mamul var, eşit bölüşülüyor.","doldur":[[12,1]]},{"formul":"C toplam pay = C katsayılı pay + C eşit pay = 108.000 (9. adımda bulduk) + 40.000 (10. adımda bulduk) = 148.000","anlatim":"C\u0027nin toplam payı, iki dağıtımdan gelen paylarının toplamı. Sonuç budur.","doldur":[[13,1]]},{"formul":"Yanlış yol: C katsayılı pay tek başına = 108.000 (HATALI) → doğrusu 148.000 (11. adımda bulduk)","anlatim":"Yanlış yol sadece katsayılı dağıtımı hesaplayıp eşit payı unutmak olur. Bu eksik cevap verir.","doldur":[]}],"anahtar":[{"ornek":"katsayılı","kok":"katsay"},{"ornek":"dağıtım","kok":"dağıtı"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"mamulünün","kok":"mamulü"},{"ornek":"birleşik","kok":"birleş"},{"ornek":"miktar","kok":"miktar"}],"konuGiris":{"harita":"Ne zaman test edilir: birleşik maliyetin bir kısmı eşit, kalanı katsayıyla dağıtıldığında. Nasıl ölçülür: her mamulün eşdeğer birimi (miktar x katsayı) bulunup toplam kalan tutara oranlanarak. Nasıl kaydedilir: her mamulün eşit pay ile katsayılı payı toplanarak nihai tutar bulunur.","desen":"Soru genelde önce sabit bir yüzdenin eşit paylaştırılmasını, sonra kalanın katsayılı dağıtımını iki aşamalı ister; öğrenciler tek aşamayı unutur ya da yüzdeyi toplam yerine kalan üzerinden ikinci kez uygular. Katsayı ile miktarı çarpmadan direkt miktar oranlaması da sık tuzaktır. Bu soru katsayılı bölme yöntemi p.1 (Teori Notu) noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"her ürüne verilen teknik/fiziksel ağırlık ölçüsü","ad":"katsayı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"üretim miktarı ile katsayının çarpımı","ad":"eşdeğer birim","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"birleşik giderin belirlenen yüzdesinin mamul sayısına bölünmüş kısmı","ad":"eşit dağıtım payı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"kalan birleşik giderin toplam eşdeğer birime bölünmesiyle bulunan tutar","ad":"birim eşdeğer maliyet","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Toplam birleşik gider, dağıtım yüzdesi, mamul katsayıları ve üretim miktarları verilir; istenen tek mamulün toplam (eşit+katsayılı) payıdır.","panel_ornek":"Bir pastanede aynı hamurdan küçük, orta ve büyük boy poğaça çıkıyor; büyük boy 3 kat, orta 2 kat, küçük 1 kat hamur/malzeme kullanıyor sayılıyor. 90 TL\u0027lik ortak malzeme maliyeti bu katsayılara göre üç boy arasında paylaştırılıyor, büyük boy daha fazla pay alıyor.","ornek":"Bir pastanede aynı hamurdan küçük, orta ve büyük boy poğaça çıkıyor; büyük boy 3 kat, orta 2 kat, küçük 1 kat hamur/malzeme kullanıyor sayılıyor. 90 TL\u0027lik ortak malzeme maliyeti bu katsayılara göre üç boy arasında paylaştırılıyor, büyük boy daha fazla pay alıyor.","yontemler":"Önce toplam giderin belirlenen yüzdesi mamul sayısına eşit bölünür, kalan tutar eşdeğer birim (miktar x katsayı) oranına göre dağıtılır; iki payın toplamı istenen mamulün nihai tutarını verir.","nedir":"Birleşik ürün katsayı yöntemi, ortak üretimden çıkan mamullere maliyeti teknik bir ağırlık ölçüsüyle paylaştırır. Sınav, eşdeğer birim hesaplayıp payı doğru dağıtabilmeni ölçer."},"olay":"Eşit pay 480.000x%25=120.000, kalan 360.000; eşdeğer birimler A=6.000, B=8.000, C=6.000, toplam=20.000; birim maliyet 360.000/20.000=18; C\u0027nin katsayılı payı 6.000x18=108.000; C\u0027nin eşit payı 120.000/3=40.000; toplam pay 108.000+40.000=148.000.","tuzak":{"C":{"ad":"Eşit Dağıtım Atlama Tuzağı","metin":"%25\u0027lik eşit dağıtım katmanını hiç uygulamadan 480.000 TL\u0027nin tamamını doğrudan eşdeğer birim oranına göre dağıtmışsındır (480.000/20.000=24, 6.000x24=144.000). Doğrusu önce eşit pay ayrılır, kalan katsayıyla dağıtılır."},"E":{"ad":"Payda Karıştırma Tuzağı","metin":"Eşdeğer birim maliyetini bulurken paydaya toplam eşdeğer birim (20.000) yerine toplam üretim miktarını (12.000) koyup 360.000/12.000=30 bulmuş, sonra bu değeri C\u0027nin eşdeğer birimiyle (6.000) çarparak 180.000+40.000=220.000 hesaplamışsındır. Doğrusu bölme ve çarpma aynı ölçüde (eşdeğer birim) yapılmalıdır."},"A":{"ad":"Fiziksel Ölçü Karıştırması Tuzağı","metin":"Kalan tutarı katsayı ile ağırlıklandırmadan doğrudan üretim miktarı oranıyla dağıtıp üstüne eşit payı eklemiş, kalanı 360.000 x (2.000/12.000)=60.000 + 40.000=100.000 bulmuşsundur. Doğrusu kalan tutar eşdeğer birim (miktar x katsayı) oranına göre dağıtılır."},"B":{"ad":"Eşit Payı Orantılama Tuzağı","metin":"Eşit dağıtılacak 120.000 TL\u0027yi ürün sayısına değil üretim miktarına oranlayarak C için 120.000 x (2.000/12.000)=20.000 bulup katsayılı payla (108.000) toplamışsındır. Doğrusu eşit dağıtımda pay ürün sayısına bölünür, miktara oranlanmaz."}},"celdiriciYol":{"C":"480.000 / 20.000 = 24; 6.000 x 24 = 144.000 (eşit dağıtım katmanını atlayıp tüm tutarı tek seferde katsayıyla dağıtma)","E":"360.000 / 12.000 = 30; 30 x 6.000 + 40.000 = 220.000 (eşdeğer birim maliyetini bulurken paydaya toplam miktarı koyma)","A":"360.000 x (2.000/12.000) + 40.000 = 100.000 (kalan tutarı katsayı yerine üretim miktarı oranıyla dağıtma)","B":"120.000 x (2.000/12.000) + 108.000 = 128.000 (eşit payı ürün sayısı yerine üretim miktarına orantılama)"},"hap":"Katsayılı bölme yönteminde birleşik giderin ürünlere payı, önce varsa eşit dağıtım katmanıyla, sonra kalan tutarın eşdeğer birim (miktar x katsayı) oranına göre dağıtımıyla iki aşamada bulunur ve toplanır.","teshis":{"C":{"gercek":"Soru metninde tanımlanan iki aşamalı politika (önce eşit, sonra katsayılı) her iki katmanın da ayrı ayrı uygulanmasını gerektirir.","ayirt":"Soruda tanımlanan iki dağıtım aşamasının ikisini de uyguladım mı?","paragraf":"Teori Notu - katsayılı bölme yöntemi","yanilgi":"İşletmenin politikasında belirtilen ilk katmanı (eşit dağıtım) gözden kaçırıp tüm tutarı tek katmanda dağıtabileceğini sanıyorsun."},"E":{"gercek":"Eşdeğer birim maliyeti = kalan tutar / toplam eşdeğer birim\u0027dir; bulunan birim değer yine eşdeğer birimle çarpılmalıdır, üretim miktarıyla karıştırılmaz.","ayirt":"Bölme ve çarpma işleminde aynı ölçüyü mü kullandım?","paragraf":"Teori Notu - katsayılı bölme yöntemi","yanilgi":"Birim maliyeti bulurken kullanılan payda ile payı çarparken kullanılan değişkenin aynı ölçü birimi (eşdeğer birim) olması gerektiğini fark etmiyorsun."},"A":{"gercek":"Katsayılı bölme yönteminde dağıtım anahtarı eşdeğer birimdir (miktar x katsayı); ham miktar tek başına kullanılmaz, bu fiziksel ölçü yöntemidir.","ayirt":"Katsayıyı çarpmadan sadece miktarla mı böldüm?","paragraf":"Teori Notu - katsayılı bölme yöntemi","yanilgi":"Katsayının yalnızca isim olduğunu, asıl dağıtımın ham üretim miktarına göre yapıldığını sanıyorsun."},"D":{"gercek":"Katsayılı bölme yönteminde eşdeğer birim = miktar x katsayı esastır; işletme politikası önce eşit dağıtımı, sonra kalanın katsayılı dağıtımını öngörüyorsa iki pay toplanarak nihai pay bulunur.","ayirt":"Eşit pay ile katsayılı payı ayrı hesaplayıp topladım mı?","paragraf":"Teori Notu - katsayılı bölme yöntemi","yanilgi":"Bu şıkkı eleyen öğrenci, iki katmanlı dağıtımın (eşit + katsayılı) ayrı ayrı hesaplanıp toplanması gerektiğini gözden kaçırıp tek katmanlı bir sonucun doğru olacağını sanır."},"B":{"gercek":"Tanım gereği eşit dağıtım katmanı ürün adedine bölünür; miktar veya katsayı bu katmanda hiç devreye girmez.","ayirt":"Eşit payı ürün sayısına mı, yoksa miktara mı böldüm?","paragraf":"Teori Notu - katsayılı bölme yöntemi","yanilgi":"Eşit dağıtımın da ürün sayısına değil üretim hacmine göre orantılı yapıldığını sanıyorsun."}},"verilen":[[7,1],[8,1],[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 63"},"kural":"karşılıklı hizmet veren yardımcı gider yerlerinin düzeltilmiş toplamları iki bilinmeyenli denklem sistemiyle bulunur, sonra bu toplamlar esas üretim yerlerine hizmet oranları üzerinden dağıtılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 63","sonDonem":5,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"İki bilinmeyenli denklem sisteminde bir yardımcı yerin formülünü diğerinin içine yerleştirip tek bilinmeyene indirge; düzeltilmiş toplamları bulmadan esas üretim yerine pay dağıtma.","konu":"genel üretim giderleri","tablo":{"satirlar":[["VERİLENLER","-"],["Bakım-Onarım kendi gideri","150.000 TL"],["Bakım-Onarım hizmet dağılımı","Yemekhane %50, A %30, B %20"],["Yemekhane kendi gideri","60.000 TL"],["Yemekhane hizmet dağılımı","Bakım-Onarım %20, A %50, B %30"],["HESAP","-"],["Bakım-Onarım düzeltilmiş toplam (B=150.000+0,20Y)","180.000"],["Yemekhane düzeltilmiş toplam (Y=60.000+0,50B)","150.000"],["Bakım-Onarım\u0027dan A payına aktarılan (180.000×0,30)","54.000"],["Yemekhane\u0027den A payına aktarılan (150.000×0,50)","75.000"],["Sağlama: A+B paylarının toplamı (129.000+81.000)","210.000"],["A esas üretim gider yerine yüklenen genel üretim gideri","129.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"127.500","E":"129.375","A":"81.000","D":"129.000","B":"127.200"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"hesap","soru":"İşletme, genel üretim giderlerinin Bakım-Onarım ve Yemekhane gider yerlerinden A ve B esas üretim gider yerlerine dağıtımında matematiksel (karşılıklı) dağıtım yöntemini kullanmaktadır. Aralık 2026 dönemine ait bilgiler şöyledir: Bakım-Onarım gider yerinin kendi gideri 150.000 TL olup bu giderin %50\u0027si Yemekhane\u0027ye, %30\u0027u A\u0027ya, %20\u0027si B\u0027ye dağıtılmaktadır. Yemekhane gider yerinin kendi gideri 60.000 TL olup bu giderin %20\u0027si Bakım-Onarım\u0027a, %50\u0027si A\u0027ya, %30\u0027u B\u0027ye dağıtılmaktadır. Buna göre, A esas üretim gider yerine yüklenen genel üretim gideri tutarı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-41","verilenler":[{"deger":"150.000 TL","anlam":"Bakım-Onarım gider yerinin dağıtımdan önceki birincil (kendi) gider tutarıdır, denklemin sabit teriminde kullanılır.","ad":"Bakım-Onarım kendi gideri"},{"deger":"Yemekhane %50, A %30, B %20","anlam":"Bakım-Onarım\u0027ın düzeltilmiş toplamının hangi oranlarla diğer gider yerlerine aktarılacağını gösterir.","ad":"Bakım-Onarım hizmet dağılımı"},{"deger":"60.000 TL","anlam":"Yemekhane gider yerinin dağıtımdan önceki birincil (kendi) gider tutarıdır, denklemin sabit teriminde kullanılır.","ad":"Yemekhane kendi gideri"},{"deger":"Bakım-Onarım %20, A %50, B %30","anlam":"Yemekhane\u0027nin düzeltilmiş toplamının hangi oranlarla diğer gider yerlerine aktarılacağını gösterir.","ad":"Yemekhane hizmet dağılımı"}],"dayanak":"Tekdüzen Hesap Planı 730 Genel Üretim Giderleri hesabı; matematiksel (karşılıklı) dağıtım yöntemi maliyet muhasebesi tekniği","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Bakım-Onarım kendi gideri 150.000 TL (soruda verilen); Yemekhane kendi gideri 60.000 TL (soruda verilen); Bakım-Onarım dağıtım oranları %50 Yemekhane, %30 A, %20 B (soruda verilen); Yemekhane dağıtım oranları %20 Bakım-Onarım, %50 A, %30 B (soruda verilen)","anlatim":"Soru bize gider yerlerinin kendi giderlerini ve dağıtım yüzdelerini vermiş. Bakım-Onarım 150.000 TL, Yemekhane 60.000 TL; her ikisi birbirine de pay veriyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"İlişki: Bakım-Onarım →%20→ Yemekhane; Yemekhane →%20→ Bakım-Onarım (karşılıklı hizmet); Denklem: Bakım-Onarım toplamı = kendi 150.000 (soruda verilen) + Yemekhane toplamının %20\u0027si","anlatim":"Bakım-Onarım ile Yemekhane birbirine hizmet veriyor, bu yüzden düzeltilmiş toplamları denklemle bulunur. Biri diğerinin gideriyle şişer, o yüzden ikisini birlikte çözmek gerekir.","doldur":[]},{"formul":"Bakım-Onarım toplamı = 150.000 (soruda verilen) + %20 × 60.000 (soruda verilen) = 150.000 + 12.000 = 162.000","anlatim":"Yemekhane\u0027nin sabit kısmını Bakım-Onarım denklemine yerine koyuyoruz, önce sabit sayıyı buluyoruz. Böylece denklemde tek bilinmeyen kalıyor.","doldur":[]},{"formul":"Toplamın %10\u0027u kendine dönüyor (%20 × %50); kalan %90\u0027ı 162.000 (3. adımda bulduk) ise tamamı 162.000 / %90 = 180.000","anlatim":"Toplamın bir kısmı döngü yüzünden kendine geri dönüyor, kalan yüzdeyle asıl toplamı buluyoruz. %20×%50 kadarı kendine döndüğü için geriye %90 kalıyor.","doldur":[[6,1]]},{"formul":"Yemekhane toplamı = 60.000 (soruda verilen) + %50 × 180.000 (4. adımda bulduk) = 60.000 + 90.000 = 150.000","anlatim":"Bakım-Onarım toplamı bulununca Yemekhane toplamını da denklemine koyup hesaplıyoruz. Bu sayede iki gider yerinin de son toplamı belli olur.","doldur":[[7,1]]},{"formul":"Bakım-Onarım\u0027dan A payı = 180.000 (4. adımda bulduk) × %30 (soruda verilen) = 54.000","anlatim":"Şimdi düzeltilmiş toplamları esas üretim yerlerine dağıtıyoruz. Bakım-Onarım\u0027ın A\u0027ya verdiği pay %30\u0027u kadardır.","doldur":[[8,1]]},{"formul":"Yemekhane\u0027den A payı = 150.000 (5. adımda bulduk) × %50 (soruda verilen) = 75.000","anlatim":"Aynı şekilde Yemekhane\u0027nin A\u0027ya verdiği payı buluyoruz, oranı %50\u0027dir. Bu iki pay toplanınca A\u0027nın alacağı tüm gider ortaya çıkacak.","doldur":[[9,1]]},{"formul":"A esas üretim gider yerine yüklenen genel üretim gideri = 54.000 (6. adımda bulduk) + 75.000 (7. adımda bulduk) = 129.000","anlatim":"A esas üretim gider yerine yüklenen tutar, iki yardımcı gider yerinden gelen payların toplamıdır. Bu bizim sonuç değerimiz.","doldur":[[11,1]]},{"formul":"Sağlama: Bakım-Onarım\u0027dan B payı = 180.000 (4. adımda bulduk) × %20 (soruda verilen) = 36.000; Yemekhane\u0027den B payı = 150.000 (5. adımda bulduk) × %30 (soruda verilen) = 45.000; B toplamı = 36.000 + 45.000 = 81.000; A + B = 129.000 (8. adımda bulduk) + 81.000 = 210.000 ✓","anlatim":"Sağlama için B\u0027ye giden payları da bulup A ile B toplamının, iki toplamın toplamına eşit olduğunu kontrol ediyoruz. Böylece hesabın doğruluğunu görürüz.","doldur":[[10,1]]},{"formul":"Yanlış yol: 150.000 × %30 + 60.000 × %50 = 45.000 + 30.000 = 75.000 (HATALI) → doğrusu 129.000 (8. adımda bulduk)","anlatim":"En sık hata, karşılıklı dağıtımı görmezden gelip A payını doğrudan 150.000×%30 ve 60.000×%50 ile hesaplamaktır. Bu yanlıştır çünkü düzeltilmiş toplamlar yerine kendi giderleri kullanılmış olur.","doldur":[]}],"anahtar":[{"ornek":"toplamları","kok":"toplam"},{"ornek":"dağıtımı","kok":"dağıtı"},{"ornek":"yerleri","kok":"yerler"},{"ornek":"denklemle","kok":"denkle"},{"ornek":"yemekhane","kok":"yemekh"},{"ornek":"üretim","kok":"üretim"}],"konuGiris":{"harita":"Ne zaman test edilir: yardımcı gider yerleri birbirine karşılıklı hizmet verdiğinde. Nasıl ölçülür: her yardımcı yer için kendi gideri + diğerinden aldığı pay şeklinde denklem kurulup sistem çözülerek düzeltilmiş toplam maliyet bulunur. Nasıl kaydedilir: bulunan düzeltilmiş toplamlar, hizmet oranlarına göre esas üretim gider yerlerine dağıtılır.","desen":"Soru genellikle iki yardımcı gider yerinin karşılıklı hizmet oranlarını verip esas gider yerine yüklenen tutarı sorar. Tuzak, denklemi tek yönlü kademeli mantıkla kurup yanlış sonuca gitmektir; iki bilinmeyenli sistemi birlikte çözmek gerekir. Bu soru matematiksel (karşılıklı) dağıtımın çift yönlü denklem kurulumu noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Gider yerinin başkasından pay almadan önceki asıl maliyeti.","ad":"Kendi gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Bir gider yerinin diğerine verdiği hizmetin yüzde payı.","ad":"Hizmet oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Karşılıklı denklem çözümüyle bulunan gerçek toplam yardımcı yer maliyeti.","ad":"Düzeltilmiş (dağıtılacak) maliyet","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Düzeltilmiş maliyetin hizmet oranına göre esas yere aktarılan kısmı.","ad":"Esas gider yerine yüklenen pay","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Yardımcı gider yerlerinin kendi giderleri ve karşılıklı hizmet oranları verilir, esas üretim gider yerine yüklenen tutar istenir.","panel_ornek":"Bir apartmanda kapıcı hem A blok hem B blok sakinlerine hizmet veriyor, aynı zamanda yönetici de kapıcıya küçük bir yardım yapıyor diyelim. Kapıcının 10 TL\u0027lik gideri var, yöneticinin 4 TL\u0027lik gideri var; kapıcı yöneticiye %10 hizmet veriyor, yönetici kapıcıya %20 hizmet veriyor. Bu karşılıklı ilişkiyi çözmeden kim ne kadar ödeyecek doğru bulunamaz, denklem kurman gerekir.","ornek":"Bir apartmanda kapıcı hem A blok hem B blok sakinlerine hizmet veriyor, aynı zamanda yönetici de kapıcıya küçük bir yardım yapıyor diyelim. Kapıcının 10 TL\u0027lik gideri var, yöneticinin 4 TL\u0027lik gideri var; kapıcı yöneticiye %10 hizmet veriyor, yönetici kapıcıya %20 hizmet veriyor. Bu karşılıklı ilişkiyi çözmeden kim ne kadar ödeyecek doğru bulunamaz, denklem kurman gerekir.","yontemler":"İki yardımcı gider yeri için önce birbirine bağlı iki denklem kurulur ve düzeltilmiş toplam maliyetler bulunur; en kritik kural bu tutarların sıralamadan bağımsız tek bir sonuç vermesidir.","nedir":"Genel üretim giderleri, yardımcı gider yerlerinin maliyetlerinin esas üretim gider yerlerine nasıl dağıtılacağını gösteren bir tekniktir. Sınav, karşılıklı hizmet ilişkisini denklemle çözüp doğru payı bulabiliyor musun diye ölçer."},"olay":"B=150.000+0,20Y ve Y=60.000+0,50B denklemlerinden B=180.000, Y=150.000; A payı=180.000×0,30+150.000×0,50=54.000+75.000=129.000.","tuzak":{"C":{"ad":"Doğrudan Dağıtım Tuzağı","metin":"Bakım-Onarım ile Yemekhane arasındaki karşılıklı hizmeti yok sayıp oranları yalnız esas üretim yerleri üzerinden yeniden ölçekleyerek dağıttın. Doğrusu: karşılıklı hizmet dikkate alınmadan bulunan bu tutar gerçek yükü yansıtmaz."},"E":{"ad":"Ters Kademe Sıra Tuzağı","metin":"Bu kez önce Bakım-Onarım\u0027ı dağıtıp Yemekhane\u0027ye geri dönmeden A payını hesapladın. Doğrusu: kademeli yöntemde sıra değiştikçe sonuç da değişir; karşılıklı yöntemde ise sıra sonucu etkilemez."},"A":{"ad":"Ürün Karıştırma Tuzağı","metin":"A yerine B esas üretim gider yerinin payını hesaplayıp yazdın. Doğrusu: B payı (180.000×0,20+150.000×0,30=81.000) ayrı bir büyüklüktür, soruda A payı istenmektedir."},"B":{"ad":"Kademeli Dağıtım Sırası Tuzağı","metin":"Yardımcı gider yerlerinden önce Yemekhane\u0027yi dağıtıp Bakım-Onarım\u0027a geri dönmeden A payını hesapladın. Doğrusu: karşılıklı ilişkide sıraya bağlı kademeli sonuç değil, denklemle bulunan tek matematiksel sonuç geçerlidir."}},"celdiriciYol":{"C":"150.000×(30/50)+60.000×(50/80)=90.000+37.500=127.500 (karşılıklı hizmeti yok sayıp doğrudan dağıtım yaptın)","E":"150.000×0,30=45.000; (60.000+150.000×0,50)=135.000; 135.000×(50/80)=84.375; 45.000+84.375=129.375 (kademeli dağıtımda önce Bakım-Onarım\u0027ı dağıttın)","A":"180.000×0,20+150.000×0,30=36.000+45.000=81.000 (B esas üretim gider yerine ait payı A için yazdın)","B":"60.000×0,50=30.000; (150.000+60.000×0,20)=162.000; 162.000×(30/50)=97.200; 30.000+97.200=127.200 (kademeli dağıtımda önce Yemekhane\u0027yi dağıttın)"},"hap":"Yardımcı gider yerleri birbirine hizmet veriyorsa genel üretim gideri\u0027ün esas üretim yerlerine en doğru dağıtımı, karşılıklı ilişkiyi denklemle çözen matematiksel (cebirsel) dağıtım yöntemiyle yapılır ve bu sonuç sıraya bağlı değildir.","teshis":{"C":{"gercek":"Doğrudan dağıtım karşılıklı hizmeti yok sayar; oysa soru işletmenin matematiksel (karşılıklı) yöntemi kullandığını açıkça belirtir.","ayirt":"Yardımcı gider yerleri birbirine hizmet veriyor mu, veriyorsa denklem kurdum mu?","paragraf":"Teori/Teknik - Doğrudan/Kademeli/Matematiksel dağıtım karşılaştırması","yanilgi":"Bakım-Onarım ile Yemekhane\u0027nin birbirine verdiği hizmeti önemsiz sayıp doğrudan esas üretim yerlerine dağıttın."},"E":{"gercek":"Kademeli yöntemde hangi yardımcı yerin önce dağıtıldığı sonucu değiştirir; bu, karşılıklı yöntemin tam olarak çözdüğü sorundur.","ayirt":"Kullandığım yöntem sıraya duyarlı mı, soru sıraya duyarsız matematiksel yöntemi mi istiyor?","paragraf":"Teori/Teknik - Doğrudan/Kademeli/Matematiksel dağıtım karşılaştırması","yanilgi":"Kademeli dağıtımda sırayı değiştirince farklı sonuç çıkacağını fark etmeden önce Bakım-Onarım\u0027ı dağıttın."},"A":{"gercek":"Matematiksel dağıtımda her esas üretim yerinin payı, kendi hizmet oranı üzerinden ayrı ayrı hesaplanır; A ve B payları farklı büyüklüklerdir.","ayirt":"Hesapladığım tutar hangi esas üretim yerinin oranıyla çarpıldı?","paragraf":"Tekdüzen Hesap Planı 730 Genel Üretim Giderleri","yanilgi":"İki esas üretim yeri arasındaki payları karıştırıp B mamulüne ait tutarı A için yazdın."},"D":{"gercek":"Karşılıklı hizmet ilişkisinde düzeltilmiş toplamlar ancak iki bilinmeyenli denklem sisteminin çözümüyle bulunur; bu yöntem sıraya bağlı değildir ve tek sonuç verir.","ayirt":"B ve Y\u0027nin düzeltilmiş toplamlarını denklemle mi buldum, yoksa kısayol mu kullandım?","paragraf":"Teori/Teknik - Matematiksel (karşılıklı) dağıtım yöntemi","yanilgi":"Bu şıkkı eleyen öğrenci, denklem sistemini kurmadan doğrudan oranlarla işlem yapılabileceğini sanır."},"B":{"gercek":"Karşılıklı (matematiksel) dağıtımda iki yönlü ilişki denklem sistemiyle aynı anda çözülür, sıraya bağlı kademeli işlem yapılmaz.","ayirt":"Yardımcı gider yerlerinin düzeltilmiş toplamlarını bulmak için iki bilinmeyenli denklem mi kurdum, yoksa tek yönlü mü ilerledim?","paragraf":"Teori/Teknik - Matematiksel (karşılıklı) dağıtım yöntemi","yanilgi":"Karşılıklı dağıtımı, önce bir yardımcı yeri dağıtıp diğerine geri dönmeyen kademeli mantıkla çözülür sandın."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 57"},"kural":"Matematiksel dağıtımda her yardımcı gider yeri = kendi I. dağıtım gideri + karşı yardımcı gider yerinin kendisine ayırdığı oran x karşı yerin toplam maliyeti.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 57","sonDonem":2,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":true,"taktik":"Önce her yardımcı gider yerinin dağıtım tabanındaki KARŞI TARAFA giden oranı ayrı ayrı hesapla, sonra hangi denklemin sabit terimine hangi gider yerinin kendi tutarının geldiğini kontrol et.","konu":"gug matematiksel dağıtım","tablo":{"satirlar":[["VERİLENLER","-","-"],["Dokuma genel üretim gideri","250.000 TL","-"],["Boyama genel üretim gideri","300.000 TL","-"],["Enerji genel üretim gideri","90.000 TL","-"],["Bakım-Onarım genel üretim gideri","60.000 TL","-"],["Enerji dağıtım kWh","Dokuma 350, Boyama 550, Bakım-Onarım 100 (toplam 1.000)","-"],["Bakım-Onarım dağıtım saati","Dokuma 150, Boyama 200, Enerji 50 (toplam 400)","-"],["HESAP","-","-"],["Enerji\u0027nin Bakım-Onarım\u0027a verdiği oran","100/1.000","0,10"],["Bakım-Onarım\u0027ın Enerji\u0027ye verdiği oran","50/400","0,125"],["Bakım-Onarım denklemi","60.000 + 0,10*Enerji","60.000 + 0,10*Enerji"],["Enerji denklemi (istenen)","90.000 + 0,125*Bakım-Onarım","Enerji = 90.000 + 0,125*Bakım-Onarım"]],"basliklar":["Adım","Hesaplama","Sonuç"]},"siklar":{"C":"Enerji = 90.000 + 0,10*Bakım-Onarım","E":"Enerji = 60.000 + 0,125*Bakım-Onarım","A":"Bakım-Onarım = 60.000 + 0,125*Enerji","D":"Bakım-Onarım = 150.000 + 0,10*Enerji","B":"Enerji = 90.000 + 0,125*Bakım-Onarım"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[0,2],[1,1],[1,2],[2,1],[2,2],[3,1],[3,2]],"tablo":{"basliklar":["Adım","Hesaplama","Sonuç"],"satirlar":[["Buhar\u0027ın Tamir-Bakım\u0027a verdiği oran","100/1.000","0,10"],["Tamir-Bakım\u0027ın Buhar\u0027a verdiği oran","70/420","0,17"],["Buhar denklemi","120.000 + 0,17*Tamir-Bakım","Buhar = 120.000 + 0,17*Tamir-Bakım"],["Tamir-Bakım denklemi (istenen)","80.000 + 0,10*Buhar","Tamir-Bakım = 80.000 + 0,10*Buhar"]]},"tur":"tablo","soru":"Bir mobilya işletmesinde \"örme\" ve \"apre\" esas üretim, \"buhar\" ve \"tamir-bakım\" yardımcı gider yerleridir. I. dağıtım sonrası genel üretim giderleri: Örme 200.000 TL, Apre 280.000 TL, Buhar 120.000 TL, Tamir-Bakım 80.000 TL. Buhar dağıtımında kullanılan kWh tüketimi: Örme 300, Apre 600, Tamir-Bakım 100 (toplam 1.000). Tamir-Bakım dağıtımında kullanılan bakım saati: Örme 140, Apre 210, Buhar 70 (toplam 420). Matematiksel dağıtım yöntemine göre genel üretim giderlerini dağıtan işletmede, yardımcı gider yerlerinin birbirinden alacağı paylara ilişkin Tamir-Bakım denklemi nasıl kurulur? Tabloyu doldur ve Tamir-Bakım\u0027ın hangi denklemle ifade edildiğini bul.","verilen":[],"hedef":"Tabloyu doldur ve Tamir-Bakım denkleminin 80.000 + 0,10*Buhar olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir tekstil işletmesinde \"dokuma\" ve \"boyama\" esas üretim, \"enerji\" ve \"bakım-onarım\" yardımcı gider yerleridir. I. dağıtım sonrası genel üretim giderleri: Dokuma 250.000 TL, Boyama 300.000 TL, Enerji 90.000 TL, Bakım-Onarım 60.000 TL. Enerji dağıtımında kullanılan kWh tüketimi: Dokuma 350, Boyama 550, Bakım-Onarım 100 (toplam 1.000). Bakım-Onarım dağıtımında kullanılan bakım saati: Dokuma 150, Boyama 200, Enerji 50 (toplam 400). Matematiksel dağıtım yöntemine göre genel üretim giderlerini dağıtan işletmede, yardımcı gider yerlerinin birbirinden alacağı payların belirlenmesine ilişkin denklemler için aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-42","verilenler":[{"deger":"250.000 TL","anlam":"Esas üretim yeri gideri; yardımcı yerler arası denklemde kullanılmaz, çeldirici veridir.","ad":"Dokuma genel üretim gideri"},{"deger":"300.000 TL","anlam":"Esas üretim yeri gideri; yardımcı yerler arası denklemde kullanılmaz, çeldirici veridir.","ad":"Boyama genel üretim gideri"},{"deger":"90.000 TL", i","ad":"Düzeltilmiş (dağıtılacak) maliyet","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Bir yardımcı yerin verdiği hizmetin diğer yerlere yüzdesel payı","ad":"Hizmet dağıtım oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"İki yardımcı yerin birbirine aynı anda hizmet vermesi durumu","ad":"Karşılıklı hizmet","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Yardımcı yerin kendi kendine verdiği hizmet, dağıtım dışı bırakılan pay","ad":"Self-servis payı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"I. dağıtım sonrası tutarlar ve karşılıklı hizmet oranları (kWh, bakım saati) verilir, yardımcı yerlerin denklemlerinin doğru kurulumu istenir.","panel_ornek":"Kardeşin market işi yapıyor, sen de ona haftada bir gün yardım ediyorsun, o da sana ders çalışırken kahve getiriyor. İkinizin gerçek \u0027emeği\u0027 birbirine karışmış durumda; kim kime ne kadar borçlu, ancak iki denklem kurup çözünce netleşir. Matematiksel dağıtım da tam olarak bunu yapar.","ornek":"Kardeşin market işi yapıyor, sen de ona haftada bir gün yardım ediyorsun, o da sana ders çalışırken kahve getiriyor. İkinizin gerçek \u0027emeği\u0027 birbirine karışmış durumda; kim kime ne kadar borçlu, ancak iki denklem kurup çözünce netleşir. Matematiksel dağıtım da tam olarak bunu yapar.","yontemler":"Tek yöntem matematiksel dağıtımdır; kritik kural, her yardımcı gider yerinin denkleminin kendi gideri artı diğer yardımcı yerden aldığı hizmet oranı çarpı o yerin toplam maliyeti şeklinde kurulmasıdır.","nedir":"Matematiksel dağıtım, yardımcı gider yerlerinin birbirine karşılıklı verdiği hizmeti eşitliklerle çözen yöntemdir. Sınav, denklemlerin doğru kurulup kurulamadığını ölçer."},"olay":"Bakım-Onarım\u0027ın Enerji\u0027ye verdiği oran = 50/400 = 0,125; Enerji = 90.000 + 0,125*Bakım-Onarım.","tuzak":{"C":{"ad":"Yön Karıştırma Tuzağı","metin":"Enerji\u0027nin Bakım-Onarım\u0027a verdiği oranı (100/1.000=0,10) tersine, Bakım-Onarım\u0027ın Enerji\u0027ye verdiği oran (0,125) yerine kullanmışsın. Doğrusu: Enerji denkleminde 0,125 oranı geçerlidir, 0,10 Bakım-Onarım denklemine aittir."},"E":{"ad":"Taraf Değiştirme Tuzağı","metin":"Denklemin sol tarafı Enerji olduğu halde sabit terime Bakım-Onarım\u0027ın kendi giderini (60.000) yazmışsın. Doğrusu: Enerji denkleminde sabit terim Enerji\u0027nin kendi gideri olan 90.000 TL\u0027dir."},"D":{"ad":"Sabit Terim Şişirme Tuzağı","metin":"Sabit terime yalnız kendi gideri yerine iki yardımcı gider yerinin toplamını (90.000+60.000=150.000) yazmışsın. Doğrusu: Sabit terim yalnız o gider yerinin kendi I. dağıtım tutarıdır, 60.000 TL."},"A":{"ad":"Oran Karıştırma Tuzağı","metin":"Bakım-Onarım\u0027ın kendi denklemine, Enerji\u0027nin kendisine verdiği oranı (0,125) yazmışsın; oysa bu oran Bakım-Onarım\u0027ın Enerji\u0027ye verdiği paydır, Enerji\u0027nin Bakım-Onarım\u0027a verdiği pay 50/400 değil 100/1.000=0,10\u0027dur. Doğrusu: Bakım-Onarım = 60.000 + 0,10*Enerji."}},"celdiriciYol":{"C":"90.000 + 0,10*Bakım-Onarım (Enerji denklemine ait 0,125 oranı yerine Bakım-Onarım\u0027ın oranı olan 0,10\u0027u yazma)","E":"60.000 + 0,125*Bakım-Onarım (Enerji denkleminin sabit terimine Bakım-Onarım\u0027ın kendi giderini yazma)","D":"(90.000+60.000) + 0,10*Enerji = 150.000 + 0,10*Enerji (sabit terime iki yardımcı yerin toplam giderini yazma)","A":"60.000 + 0,125*Enerji (Bakım-Onarım denklemine Enerji\u0027nin kendisine ait 0,125 oranını yanlış taşıma)"},"hap":"Matematiksel dağıtımda her yardımcı gider yerinin denklemi, kendi I. dağıtım gideri ile karşı yardımcı yerin KENDİSİNE ayırdığı oranın çarpımının toplamıdır; oranlar yöne göre farklıdır ve birbirinin yerine konmaz.","teshis":{"C":{"gercek":"0,10 Enerji\u0027nin Bakım-Onarım\u0027a verdiği pay, 0,125 ise Bakım-Onarım\u0027ın Enerji\u0027ye verdiği paydır; birbirinin yerine konamaz.","ayirt":"Bu oranı hangi gider yerinin toplam tabanından hesap Dönem başı yarı mamul 1.000 birim olup ilk madde açısından %100, dönüştürme açısından %60 tamamlanmıştır; maliyeti 9.000 TL ilk madde, 3.600 TL dönüştürmedir. Dönem içinde 9.000 birim üretime başlanmış, 8.000 birim tamamlanıp devredilmiş, kalan 2.000 birim dönem sonu yarı mamul ilk madde açısından %100, dönüştürme açısından %50 tamamlanmıştır. Dönem içi ilk madde gideri 81.000 TL, dönüştürme maliyeti 77.400 TL\u0027dir. Tamamlanan 8.000 birimin toplam maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-44","verilenler":[{"deger":"1.000 birim","anlam":"Dönem başında üretimde bulunan, tamamlanmamış yarı mamul sayısıdır.","ad":"Dönem başı yarı mamul miktarı"},{"deger":"%100","anlam":"Dönem başı yarı mamulün direkt ilk madde açısından ne kadar tamamlandığını gösterir; ağırlıklı ortalama yönteminde eşdeğer birim hesabına doğrudan girmez, bilgi amaçlıdır.","ad":"Dönem başı yarı mamul ilk madde tamamlanma derecesi"},{"deger":"%60","anlam":"Dönem başı yarı mamulün dönüştürme maliyeti açısından tamamlanma oranıdır; ağırlıklı ortalama yönteminde eşdeğer birim hesabına girmez, bilgi amaçlıdır.","ad":"Dönem başı yarı mamul dönüştürme tamamlanma derecesi"},{"deger":"9.000 TL","anlam":"Dönem başı yarı mamulün taşıdığı direkt ilk madde ve malzeme maliyetidir, dönem içi maliyetle toplanır.","ad":"Dönem başı yarı mamul ilk madde maliyeti"},{"deger":"3.600 TL","anlam":"Dönem başı yarı mamulün taşıdığı dönüştürme maliyetidir, dönem içi maliyetle toplanır.","ad":"Dönem başı yarı mamul dönüştürme maliyeti"},{"deger":"9.000 birim","anlam":"Bu dönem içinde üretime yeni başlanan birim sayısıdır, toplam üretilebilir miktarı belirler.","ad":"Dönem içi üretime başlanan miktar"},{"deger":"8.000 birim","anlam":"Bu dönemde tamamlanarak bir sonraki safhaya aktarılan birim sayısıdır, eşdeğer birim ve istenen maliyetin tabanıdır.","ad":"Tamamlanıp devredilen miktar"},{"deger":"2.000 birim","anlam":"Dönem sonunda hâlâ tamamlanmamış birim sayısıdır, eşdeğer birime tamamlanma yüzdesiyle ağırlıklandırılarak eklenir.","ad":"Dönem sonu yarı mamul miktarı"},{"deger":"%100","anlam":"Dönem sonu yarı mamulün direkt ilk madde açısından tamamlanma oranı, ilk madde eşdeğer birimi hesabında kullanılır.","ad":"Dönem sonu yarı mamul ilk madde tamamlanma derecesi"},{"deger":"%50","anlam":"Dönem sonu yarı mamulün dönüştürme maliyeti açısından tamamlanma oranı, dönüştürme eşdeğer birimi hesabında kullanılır.","ad":"Dönem sonu yarı mamul dönüştürme tamamlanma derecesi"},{"deger":"81.000 TL","anlam":"Bu dönemde gerçekleşen direkt ilk madde ve malzeme giderinin toplamıdır, dönem başı maliyetiyle toplanır.","ad":"Dönem içi ilk madde gideri"},{"deger":"77.400 TL","anlam":"Bu dönemde gerçekleşen işçilik ve genel üretim gideri toplamıdır, dönem başı maliyetiyle toplanır.","ad":"Dönem içi dönüştürme maliyeti"}],"dayanak":"Maliyet Muhasebesi Teori Notu - Safha Maliyet Sisteminde Eşdeğer Ürün Birimleri (ağırlıklı ortalama yöntemi)","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Dönem başı yarı mamul 1.000 birim, ilk madde %100 dönüştürme %60 tamamlanmış (soruda verilen); dönem başı maliyeti 9.000 TL ilk madde ve 3.600 TL dönüştürme (soruda verilen); üretime başlanan 9.000 birim (soruda verilen); tamamlanıp devredilen 8.000 birim (soruda verilen); dönem sonu yarı mamul 2.000 birim, ilk madde %100 dönüştürme %50 (soruda verilen); dönem içi ilk madde gideri 81.000 TL, dönüştürme maliyeti 77.400 TL (soruda verilen)","anlatim":"Soru bize dönem başı ve dönem sonu yarı mamul miktarlarını, tamamlanma yüzdelerini ve maliyetleri vermiş. Ağırlıklı ortalama yöntemiyle çözeceğiz, bu yüzden dönem başı maliyeti dönem içi maliyetle birleştireceğiz.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[11,1],[12,1]]},{"formul":"Eşdeğer birim = Tamamlanan birim + Dönem sonu yarı mamul × tamamlanma yüzdesi","anlatim":"Eşdeğer birim nedir? Yarım kalan üretimi tam birim cinsinden ifade etmemizi sağlar, çünkü 2.000 birimin yarısı bitmişse bu 1.000 tam birim gibi sayılır.","doldur":[]},{"formul":"Direkt ilk madde ve malzeme eşdeğer birimi = Tamamlanan + Dönem sonu yarı mamul × tamamlanma% = 8.000 (soruda verilen) + 2.000 (soruda verilen) × %100 (soruda verilen) = 10.000","anlatim":"Direkt ilk madde sürecin başında tam verildiği için dönem sonu stok da bu kalemde zaten %100 tamamlanmış sayılır. Bu yüzden ilk madde eşdeğer birimi tamamlanan ile dönem sonu stokun toplamı olur.","doldur":[[14,2],[14,1],[15,1],[20,1],[21,1]]},{"formul":"Dönüştürme maliyeti eşdeğer birimi = Tamamlanan + Dönem sonu yarı mamul × tamamlanma% = 8.000 (soruda verilen) + 2.000 (soruda verilen) × %50 (soruda verilen) = 9.000","anlatim":"Dönüştürme maliyeti süreç boyunca eşit hızda oluştuğu için dönem sonu stok sadece %50 tamamlanmış sayılır. Bu yüzden bu kalemde eşdeğer birim ilk maddeden daha düşük çıkar.","doldur":[[15,2]]},{"formul":"Direkt ilk madde ve malzeme toplam maliyeti = Dönem başı maliyeti + Dönem içi gider = 9.000 (soruda verilen) + 81.000 (soruda verilen) = 90.000","anlatim":"Ağırlıklı ortalama yöntemde dönem başı stokun maliyeti dönem içi maliyetle birleştirilir, ikisi ayrılmaz. Bu yüzden ilk madde toplam maliyetini bulmak için ikisini topluyoruz.","doldur":[[16,2],[16,1],[18,1],[19,1]]},{"formul":"Dönüştürme toplam maliyeti = Dönem başı maliyeti + Dönem içi maliyet = 3.600 (soruda verilen) + 77.400 (soruda verilen) = 81.000","anlatim":"Aynı mantığı dönüştürme maliyeti için de uyguluyoruz, dönem başı ve dönem içi tutarları topluyoruz.","doldur":[[17,2],[17,1]]},{"formul":"Direkt ilk madde ve malzeme birim maliyeti = Toplam maliyet / Eşdeğer birim = 90.000 (5. adımda bulduk) / 10.000 (3. adımda bulduk) = 9 TL/birim","anlatim":"Şimdi ilk madde birim maliyetini buluyoruz, toplam maliyeti eşdeğer birime bölüyoruz. Bu bize her bir eşdeğer birimin ilk madde açısından ne kadara mal olduğunu gösterir.","doldur":[[18,2]]},{"formul":"Dönüştürme birim maliyeti = Toplam maliyet / Eşdeğer birim = 81.000 (6. adımda bulduk) / 9.000 (4. adımda bulduk) = 9 TL/birim","anlatim":"Dönüştürme birim maliyetini de aynı yöntemle buluyoruz. Eşdeğer birim daha düşük olduğu için toplam maliyet küçük olsa da birim maliyet ilk maddeyle aynı çıkabilir.","doldur":[[19,2]]},{"formul":"Toplam eşdeğer birim maliyeti = İlk madde birim maliyet + Dönüştürme birim maliyet = 9 (7. adımda bulduk) + 9 (8. adımda bulduk) = 18 TL/birim","anlatim":"Bir birimin toplam maliyetini bulmak için ilk madde ve dönüştürme birim maliyetlerini topluyoruz. Bu, tamamlanan bir birimin üzerindeki toplam yükü verir.","doldur":[[20,2]]},{"formul":"Tamamlanan 8.000 birimin toplam maliyeti = Tamamlanan birim × Toplam eşdeğer birim maliyeti = 8.000 (soruda verilen) × 18 (9. adımda bulduk) = 144.000 TL","anlatim":"Artık 8.000 birimin toplam maliyetini bulabiliriz, tamamlanan birimi toplam birim maliyetle çarpıyoruz. Bu bize devredilen mamulün defterlere geçecek tutarını verir.","doldur":[[21,2]]},{"formul":"Ters durum: yöntem ilk giren ilk çıkar (FIFO) olsaydı → dönem başı stok maliyeti eşdeğer birime karışmaz, ayrı hesaplanır","anlatim":"Ters durum: yöntem ilk giren ilk çıkar (FIFO) olsaydı dönem başı stok ayrı işlem görürdü. Dönem başı yarı mamulün tamamlanmamış kısmı ayrı eşdeğer birime eklenir, ağırlıklı ortalamadaki gibi baştan sayılmazdı.","doldur":[]},{"formul":"Yanlış yol: 81.000 / 10.000 + 77.400 / 9.000 = 8,1 + 8,6 = 16,7 TL/birim (HATALI) → doğrusu 90.000 / 10.000 + 81.000 / 9.000 = 18 TL/birim (7,8. adımda bulduk)","anlatim":"En sık hata: dönem başı yarı mamul maliyetini (9.000+3.600) toplam maliyete katmayı unutup sadece dönem içi giderleri bölmek. Ağırlıklı ortalamada dönem başı stok maliyeti mutlaka toplam maliyete dahil edilir.","doldur":[]}],"anahtar":[{"ornek":"maliyeti","kok":"maliye"},{"ornek":"tamamlanan","kok":"tamaml"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"birimin","kok":"birimi"},{"ornek":"dönüştürme","kok":"dönüşt"},{"ornek":"ortalama","kok":"ortala"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda hem tamamlanan hem yarı mamul birimler varken. Nasıl ölçülür: tamamlanan birim artı dönem sonu yarı mamulün tamamlanma yüzdesiyle çarpımı toplanarak. Nasıl kaydedilir: bulunan eşdeğer birime göre toplam maliyet bölünüp birim maliyet üretim maliyeti tablosuna işlenir.","desen":"Sınav genelde ilk madde ile dönüştürme maliyetinin tamamlanma yüzdelerini karıştırmayı hedefler, öğrenci tek yüzde kullanarak yanlış eşdeğer birim bulur. İkinci tuzak dönem başı yarı mamul maliyetini ağırlıklı ortalamada ayrı tutmaya çalışmaktır, oysa toplanır. Bu soru p.Teori Notu safha maliyet eşdeğer birim formülü noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"tamamlanan birim ile yarı mamulün tamamlanma oranına göre ağırlıklandırılmış toplam birim","ad":"eşdeğer birim","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"yarı mamulün ilgili maliyet unsuru açısından ne kadar işlem gördüğünü gösteren oran","ad":"tamamlanma yüzdesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Dönem başı yarı mamul maliyetiyle dönem içi maliyetin birlikte harmanlandığı hesaplama şekli","ad":"ağırlıklı ortalama yöntemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"toplam maliyetin (dönem başı+dönem içi) eşdeğer birime bölünmesiyle bulunan tutar","ad":"birim maliyet","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Dönem başı ve dönem içi veriler verilir, tamamlanan birimlerin toplam maliyeti istenir.","panel_ornek":"Bir pastane haftalık 40 kg un siparişi veriyor, hafta başında 5 kg\u0027lık açık koli kalmıştı. Yeni gelen unla eskisi karışıp toplam maliyet toplam kiloya bölünüyor. Böylece her kilogram unun ortalama maliyeti çıkıyor.","ornek":"Bir pastane haftalık 40 kg un siparişi veriyor, hafta başında 5 kg\u0027lık açık koli kalmıştı. Yeni gelen unla eskisi karışıp toplam maliyet toplam kiloya bölünüyor. Böylece her kilogram unun ortalama maliyeti çıkıyor.","yontemler":"Ağırlıklı ortalama yönteminde dönem başı yarı mamul maliyeti dönem içi maliyetle toplanıp tek eşdeğer birime bölünür; ilk giren ilk çıkar (FIFO) ile karıştırılmamalıdır.","nedir":"Eşdeğer birim maliyeti, safha üretiminde tamamlanan ve yarı mamul kalan birimleri ortak ölçüde birleştirip birim maliyet bulmayı sağlar. Sınav bu ortak ölçünün doğru kurulup kurulmadığını ölçer."},"olay":"İlk madde eşdeğer birimi=8.000+2.000x%100=10.000, dönüştürme eşdeğer birimi=8.000+2.000x%50=9.000; ilk madde toplam maliyet=9.000+81.000=90.000, dönüştürme toplam maliyet=3.600+77.400=81.000; ilk madde birim maliyet=90.000/10.000=9, dönüştürme birim maliyet=81.000/9.000=9; toplam birim maliyet=18; 8.000x18=144.000.","tuzak":{"D":{"ad":"Tamamlanma Derecesi Ters Kullanma Tuzağı","metin":"Dönem sonu yarı mamulün ilk madde ve dönüştürme tamamlanma yüzdelerini birbirine karıştırıp ters uygularsın. Doğrusu: ilk madde açısından %100, dönüştürme açısından %50 tamamlanma derecesi doğru unsura uygulanmalıdır."},"E":{"ad":"Dönem Sonu Yarı Mamulü Yok Sayma Tuzağı","metin":"Dönem sonunda hâlâ tamamlanmamış 2.000 birimi eşdeğer birim hesabına hiç katmayıp tüm maliyeti yalnız tamamlanan birimlere yüklersin. Doğrusu: dönem sonu yarı mamul, tamamlanma derecesiyle ağırlıklandırılarak eşdeğer birime dahil edilir."},"A":{"ad":"Dönem Başı Maliyeti İhmali Tuzağı","metin":"Dönem başı yarı mamulün maliyetini toplam maliyete katmadan yalnız dönem içi giderleri eşdeğer birime bölersin. Doğrusu: birim maliyet, dönem başı ve dönem içi maliyetlerin toplamının eşdeğer birime bölünmesiyle bulunur."},"B":{"ad":"Tek Eşdeğer Birim Tuzağı","metin":"Direkt ilk madde ve malzeme ile dönüştürme maliyetinin süreçte aynı hızda tamamlandığını varsayıp ikisi için de aynı (ilk madde) eşdeğer birimi kullanırsın. Doğrusu: her maliyet unsurunun kendi tamamlanma derecesine göre ayrı eşdeğer birimi vardır."}},"celdiriciYol":{"D":"(90.000/9.000 + 81.000/10.000) x 8.000 = (10+8,1) x 8.000 = 144.800 (tamamlanma derecelerini ilk madde ve dönüştürme arasında ters uyguladın)","E":"(90.000/8.000 + 81.000/8.000) x 8.000 = (11,25+10,125) x 8.000 = 171.000 (dönem sonu yarı mamulü eşdeğer birime dahil etmedin)","A":"(81.000/10.000 + 77.400/9.000) x 8.000 = (8,1+8,6) x 8.000 = 133.600 (dönem başı yarı mamul maliyetini toplama dahil etmedin)","B":"(90.000/10.000 + 81.000/10.000) x 8.000 = (9+8,1) x 8.000 = 136.800 (dönüştürme maliyeti için de ilk madde eşdeğer birimini kullandın)"},"hap":"Ağırlıklı ortalama yöntemde eşdeğer birim, tamamlanan birim artı dönem sonu yarı mamul x tamamlanma yüzdesi ile bulunur ve direkt ilk madde ile dönüştürme maliyeti için ayrı ayrı hesaplanır.","teshis":{"C":{"gercek":"Ağırlıklı ortalama yöntemde dönem başı ve dönem içi maliyetler unsur bazında toplanır, her unsurun eşdeğer birimine ayrı ayrı bölünüp elde edilen birim maliyetler toplanır.","ayirt":"İlk madde ile dönüştürme maliyetinin tamamlanma yüzdesini ayrı ayrı mı hesapladım?","paragraf":"Teori Notu - Safha Maliyet Sisteminde Eşdeğer Ürün Birimleri","yanilgi":"Direkt ilk madde ile dönüştürme maliyetinin tamamlanma derecesinin aynı olması gerektiğini düşünüp tek bir eşdeğer birim ile daha hızlı sonuca ulaşabileceğini sanırsın."},"E":{"gercek":"Dönem sonu yarı mamul, o dönemde katlanılan kaynağın bir kısmını taşıdığı için tamamlanma derecesiyle ağırlıklandırılarak eşdeğer birime dahil edilmelidir.","ayirt":"Eşdeğer birim hesabına dönem sonu yarı mamulü kattım mı?","paragraf":"Teori Notu - Safha Maliyet Sisteminde Eşdeğer Ürün Birimleri","yanilgi":"Dönem sonunda hâlâ tamamlanmamış birimlerin bu dönemin maliyetine hiç katkısı olmadığını düşünüyorsun."},"A":{"gercek":"Ağırlıklı ortalama yöntemde dönem başı yarı mamulün maliyeti, dönem içi maliyetle harmanlanarak tek bir birim maliyet oluşturur; ayrı tutulmaz.","ayirt":"Toplam maliyete dönem başı yarı mamulün maliyetini eklediler mi?","paragraf":"Teori Notu - Safha Maliyet Sisteminde Eşdeğer Ürün Birimleri","yanilgi":"Dönem başı yarı mamulün maliyetinin zaten geçmiş döneme ait olduğunu, bu yüzden bu dönemin hesabına girmeyeceğini düşünüyorsun."},"D":{"gercek":"İlk madde sürecin başında tam verildiği için tamamlanma derecesi genelde %100\u0027dür; dönüştürme maliyeti ise kısmi tamamlanmayı yansıtır.","ayirt":"Hangi yüzde ilk maddeye, hangisi dönüştürmeye ait, tabloya ayrı yazdım mı?","paragraf":"Teori Notu - Şekillendirme (Dönüştürme) Maliyeti ve Birim Maliyet","yanilgi":"Verilen yüzdelerin hangi maliyet unsuruna ait olduğunu karıştırıp %50\u0027yi ilk maddeye, %100\u0027ü dönüştürmeye uyguluyorsun."},"B":{"gercek":"Direkt ilk madde sürecin başında tam verilirken dönüştürme maliyeti süreç boyunca yayılır; bu nedenle iki unsurun eşdeğer birimi genelde farklıdır.","ayirt":"İlk madde ve dönüştürme için ayrı eşdeğer birim mi hesapladım?","paragraf":"Teori Notu - Şekillendirme (Dönüştürme) Maliyeti ve Birim Maliyet","yanilgi":"İki maliyet unsurunun tamamlanma hızının aynı olduğunu varsayıp işlemi kısaltmaya çalışıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[11,1],[12,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 64"},"kural":"TMS 2 p.27 uyarınca ilk giren stok kalemleri önce tükenir, dönem sonunda son alınan kalemler stokta kalır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 64","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Miktar dengesini (giren=çıkan+kalan) her zaman önce kur, sonra aynı sırayla tutar dengesini kur; iki denge birbirini doğrular.","konu":"fıfo yöntemi maliyet","tablo":{"satirlar":[["VERİLENLER","-","-"],["Dönem başı stok miktarı","2.000 birim","-"],["Dönem başı stok tutarı","240.000 TL","-"],["1. alım miktarı","5.000 birim","-"],["1. alım birim fiyatı","150 TL","-"],["2. alım miktarı","4.000 birim","-"],["Toplam tüketim miktarı","8.000 birim","-"],["Toplam tüketim tutarı","1.200.000 TL","-"],["HESAP","-","-"],[ m":"ilk giren ilk çıkar yönteminde önce giren önce çıkar - yani dönem başı stok ve 1. alım önce tükenir. Bu ikisinin toplam miktarını buluyoruz.","doldur":[[9,1]]},{"formul":"Dönem başı + 1. alım tutarı = 240.000 (soruda verilen) + 750.000 (5.000 × 150, soruda verilen) = 990.000 TL","anlatim":"Aynı mantıkla bu 7.000 birimin toplam tutarını da toplayarak buluyoruz. ilk giren ilk çıkar (FIFO) sırasında bu tutar önce tükenmiş sayılır.","doldur":[[9,2]]},{"formul":"2. alımdan tüketilen miktar = 8.000 (soruda verilen) − 7.000 (2. adımda bulduk) = 1.000 birim","anlatim":"Toplam sevk 8.000 birim ama 7.000\u0027i ilk iki kalemden karşılandı. Geriye kalan miktar 2. alımdan çıkmış demektir.","doldur":[[10,1]]},{"formul":"2. alımdan tüketilen tutar = 1.200.000 (soruda verilen) − 990.000 (3. adımda bulduk) = 210.000 TL","anlatim":"Toplam sevk maliyeti belli, ilk 7.000 birimin maliyeti de belli. Aradaki fark 2. alımdan çıkan 1.000 birimin tutarıdır.","doldur":[[11,2]]},{"formul":"2. alımın birim maliyeti = Tutar / Miktar = 210.000 (4. adımda bulduk) / 1.000 (3. adımda bulduk) = 210 TL","anlatim":"Şimdi 2. alımın birim maliyetini buluyoruz, tutarı miktara bölerek. Bu bize 2. alımın gerçek birim fiyatını verir.","doldur":[[12,2]]},{"formul":"Yanlış yol: 1.200.000 / 4.000 = 300 (HATALI) → doğrusu 210 (6. adımda bulduk)","anlatim":"En sık hata: öğrenci 1.200.000\u0027i direkt 4.000\u0027e bölüp 300 TL bulur. Bu yanlış çünkü ilk giren ilk çıkar yönteminde önce eski stoklar tükenir, 2. alımdan sadece 1.000 birim çıkmıştır.","doldur":[]}],"anahtar":[{"ornek":"tükenir","kok":"tükeni"},{"ornek":"miktarını","kok":"miktar"},{"ornek":"birimin","kok":"birimi"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"alımdan","kok":"alımda"},{"ornek":"alımın","kok":"alımın"},{"ornek":"210","kok":"210"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem içi alım-satım hareketleri sırasıyla verildiğinde. Nasıl ölçülür: sevk edilen miktar, en eski stoktan başlanarak sırayla maliyetlendirilir. Nasıl kaydedilir: bilinmeyen bir alışın birim fiyatı, toplam sevkiyat maliyetinden geri hesaplanarak bulunur.","desen":"Soru genelde bilinmeyen bir alışın birim fiyatını, toplam sevkiyat maliyetinden ters hesaplatarak sorar. Tuzak, ilk giren ilk çıkar (FIFO) sırasını karıştırıp yanlış kalemleri toplamaktır; sıra dönem başı, sonra alımlar şeklinde ilerlemelidir. Bu soru TMS 2 p.27\u0027deki ilk giren ilk çıkar (FIFO) tanımından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İlk giren stok kaleminin ilk çıktığını varsayan maliyet yöntemi","ad":"ilk giren ilk çıkar yöntemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Dönem başında elde bulunan stok miktarı ve maliyeti","ad":"Dönem başı stok","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Bir alım kaleminin birim başına satın alma tutarı","ad":"Birim alış maliyeti","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Üretime gönderilen stok miktarının toplam maliyet tutarı","ad":"Sevkiyat maliyeti","kim":"piyasa fiyatlar"}],"sinavda":"Dönem başı stok, alımlar ve toplam sevkiyat maliyeti verilir; bilinmeyen alım biriminin birim fiyatı istenir.","panel_ornek":"Bir öğrenci market rafındaki süt kutularını düşünsün: önce gelen sütler önce satılır, en yeni sütler rafta kalır. Diyelim ki 3 kutu eski süt 10\u0027ar TL, sonra gelen 5 kutu süt 12\u0027şer TL; 6 kutu satıldıysa önce 3 eski, sonra 3 yeni kutu satılmış sayılır.","ornek":"Bir öğrenci market rafındaki süt kutularını düşünsün: önce gelen sütler önce satılır, en yeni sütler rafta kalır. Diyelim ki 3 kutu eski süt 10\u0027ar TL, sonra gelen 5 kutu süt 12\u0027şer TL; 6 kutu satıldıysa önce 3 eski, sonra 3 yeni kutu satılmış sayılır.","yontemler":"ilk giren ilk çıkar yönteminde sevk edilen miktar en eski kalemden başlanarak sırayla karşılanır; bilinmeyen kalan tutar, toplam maliyetten bilinen kalemler çıkarılarak bulunur.","nedir":"ilk giren ilk çıkar (FIFO), stok maliyetinin ilk giren ilk çıkar mantığı a katmama)"},"hap":"ilk giren ilk çıkar yönteminde tüketim sırası girişe göredir; önce giren partiler önce tükenir, dönem sonu stok en son alınan partiden oluşur.","teshis":{"C":{"gercek":"ilk giren ilk çıkar yönteminde tükenen partiler sırayla toplanır, kalan tüketim tutarı farkla, birim maliyet bölmeyle bulunur. TMS 2 p.27.","ayirt":"Miktar zinciri ile tutar zincirini birlikte mi kurdum?","paragraf":"TMS 2 p.27","yanilgi":"Bu şıkkı eleyen öğrenci ara katmanlardan birini (miktar dengesi ya da tutar dengesi) atlamıştır."},"E":{"gercek":"Toplam tüketim tutarından ilk giren ilk çıkar (FIFO) sırasına göre tükenen TÜM partilerin tutarı düşülmelidir. TMS 2 p.27.","ayirt":"Tüketimden düştüğüm tutar, tükenen partilerin TAMAMINI kapsıyor mu?","paragraf":"TMS 2 p.27","yanilgi":"Sadece son alımı düşünüp önceki partileri tüketimden düşmeyi unutuyorum."},"A":{"gercek":"Birim maliyet, o partiden fiilen tüketilen miktara bölünür; dönem sonu stok miktarı ayrı bir büyüklüktür. TMS 2 p.27.","ayirt":"Böldüğüm miktar tüketilen mi yoksa elde kalan mı?","paragraf":"TMS 2 p.27","yanilgi":"Kalan tutarı doğru buldum, hangi miktara böleceğimi karıştırdım."},"D":{"gercek":"Her alım partisinin kendi birim fiyatı vardır, partiler karıştırılmaz. TMS 2 p.27.","ayirt":"Bu tutarı hesaplarken hangi partinin fiyatını kullandım?","paragraf":"TMS 2 p.27","yanilgi":"Bütün partilerin aynı birim fiyattan girdiğini düşünüyorum."},"B":{"gercek":"ilk giren ilk çıkar yönteminde tüketim sırası girişe göredir, dönem başı stok her zaman önce tükenir. TMS 2 p.27.","ayirt":"ilk giren ilk çıkar yönteminde hangi parti önce, hangi parti sonra tükenir?","paragraf":"TMS 2 p.27","yanilgi":"Dönem başı stoğun tüketime hiç girmediğini, direkt elde kaldığını sanıyorum."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"donem":1,"hesaplar":{"150":{"ad":"İLK MADDE VE MALZEME","tanim":"Üretimde veya diğer faaliyetlerde kullanılmak üzere işletmede bulundurulan hammadde, yardımcı madde, işletme malzemesi, ambalaj malzeme // 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}

   +(KUTU.kutu.length?KUTU.kutu.map(x=>{ const i=SORULAR.findIndex(s=>s.id===x.id); return '<div class="kutuSat"><div><b>'+esc(x.konu)+'</b> <span class="ipnot" style="display:inline">· '+(x.tur>=2?'2. tur (7 gün)':'1. tur (2 gün)')+' · '+gunStr(x.due)+'</span></div>'+(x.due<=t&&i>=0?'<button class="btn mavi kutuCoz" data-i="'+i+'">Şimdi çöz</button>':'')+'</div>'; }).join(''):'<p class="ipnot">Kutu boş. Yanlış yaptığın her soru buraya düşer ve 2 gün sonra geri gelir.</p>')
   +'<div class="btnrow" style="margin-top:14px"><button class="btn" id="kutuIleri">⏩ Demo: 2 gün ileri sar</button><button class="btn gri" id="kutuSifirla">Verileri sıfırla</button></div>'

  e.classList.add('acik');

  e.querySelector('#kutuSifirla').addEventListener('click',()=>{ if(confirm('Skor, kutu ve seri sıfırlansın mı?')){ KUTU.kayit=[]; KUTU.kutu=[]; KUTU.ileri=0; kutuKaydet(); location.reload(); } });
