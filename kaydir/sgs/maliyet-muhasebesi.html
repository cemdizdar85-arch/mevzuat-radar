<div id="akis"></div><button id="temaB" class="temaB" type="button" aria-label="Koyu temaya geç">☾</button>
<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

const SORULAR=[{"capa":{"kaynak":"SGS 2025/1 Soru 59"},"kural":"Yükleme oranı = Bütçelenen genel üretim gideri / Bütçelenen faaliyet hacmi; Yüklenen genel üretim gideri = Fiili hacim x Yükleme oranı.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 59","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce yükleme oranını (bütçelenen genel üretim gideri / bütçelenen hacim) bul, sonra yalnız SORULAN siparişin fiili hacmiyle çarp; standart veya planlanan rakamları hesaba katma.","konu":"sipariş maliyet sistemi","tablo":{"satirlar":[["VERİLENLER","-"],["Bütçelenen genel üretim gideri","300.000 TL"],["Bütçelenen normal kapasite","25.000 makine saati"],["K-108 fiili makine saati","600 saat"],["K-108 standart makine saati","750 saat"],["HESAP","-"],["Yükleme Oranı (300.000 / 25.000)","12 TL/mks"],["K-108 Fiili Makine Saati","600 mks"],["Yüklenen Genel Üretim Gideri (600 x 12)","7.200"]],"basliklar":["Kalem","Tutar/Değer"]},"siklar":{"C":"7.200","E":"9.000","A":"500","D":"8.100","B":"3.600"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar/Değer"],"satirlar":[["Yükleme Oranı (400.000 / 20.000)","20 TL/mks"],["P-205 Fiili Makine Saati","550 mks"],["Yüklenen Genel Üretim Gideri (550 x 20)","11.000"]]},"tur":"tablo","soru":"Sipariş maliyet sistemi kullanan işletme, genel üretim giderlerini önceden belirlenmiş yükleme oranıyla siparişlere yüklemektedir. Dönem başında bütçelenen genel üretim gideri 400.000 TL, bütçelenen normal kapasite 20.000 makine saati olarak belirlenmiştir. P-205 siparişinin fiili makine saati 550, üretim planlamasında öngörülen standart makine saati ise 700\u0027dür. Buna göre P-205 siparişine yüklenen genel üretim gideri kaç TL\u0027dir?","verilen":[[1,1]],"hedef":"Tabloyu doldur ve P-205 siparişine yüklenen genel üretim giderinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Sipariş maliyet sistemi kullanan işletme, genel üretim giderlerini önceden belirlenmiş yükleme oranıyla siparişlere yüklemektedir. Dönem başında bütçelenen genel üretim gideri 300.000 TL, bütçelenen normal kapasite 25.000 makine saati olarak belirlenmiştir. K-108 siparişinin fiili makine saati 600, üretim planlamasında öngörülen standart makine saati ise 750\u0027dir. Buna göre K-108 siparişine yüklenen genel üretim gideri kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-02","verilenler":[{"deger":"300.000 TL","anlam":"Yükleme oranının payını oluşturur; oran bulunurken bu tutar bölünür.","ad":"Bütçelenen genel üretim gideri"},{"deger":"25.000 makine saati","anlam":"Yükleme oranının paydasidir; GUG buna bölünerek birim oran bulunur.","ad":"Bütçelenen normal kapasite"},{"deger":"600 saat","anlam":"Siparişe yüklenecek GUG\u0027yi bulmak için yükleme oranıyla çarpılacak fiili hacimdir.","ad":"K-108 fiili makine saati"},{"deger":"750 saat","anlam":"Cedirici bilgidir; yalnız sapma analizinde kullanılır, yükleme hesabında kullanılmaz.","ad":"K-108 standart makine saati"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.275 (imal edilen emtianın maliyet unsurları) ve sipariş maliyet sisteminde önceden belirlenmiş genel üretim gideri yükleme oranı teorisi","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Bütçelenen genel üretim gideri 300.000 TL (soruda verilen); Bütçelenen normal kapasite 25.000 makine saati (soruda verilen); K-108 fiili makine saati 600 (soruda verilen); K-108 standart makine saati 750 (soruda verilen, kullanılmayacak)","anlatim":"Soru bize şunları vermiş: bütçelenen genel üretim gideri 300.000 TL, bütçelenen normal kapasite 25.000 makine saati. K-108\u0027in fiili makine saati 600, standart saat 750 ama bu bilgi çeldirici.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[7,1]]},{"formul":"Yükleme Oranı = Bütçelenen Genel Üretim Gideri / Bütçelenen Normal Kapasite = 300.000 (soruda verilen) / 25.000 (soruda verilen) = 12 TL/mks","anlatim":"Yükleme Oranı nedir? Genel üretim giderini önceden tahmin edip fiili hacme dağıtmak için kullanılan katsayıdır. Bütçelenen gider, bütçelenen kapasiteye bölünerek bulunur.","doldur":[[6,1]]},{"formul":"Yüklenen Genel Üretim Gideri = Fiili Makine Saati × Yükleme Oranı = 600 (soruda verilen) × 12 (2. adımda bulduk) = 7.200 TL","anlatim":"Şimdi bu oranı siparişe uyguluyoruz, çünkü sisteme yüklenecek gider fiili çalışmayla çarpılır. Dikkat: standart saat değil, fiili saat kullanılır.","doldur":[[8,1]]},{"formul":"Sonuç = 7.200 TL","anlatim":"Sonuç: K-108 siparişine 7.200 TL genel üretim gideri yüklenir. Bu tutar siparişin maliyet kartına genel üretim gideri olarak eklenir.","doldur":[]},{"formul":"Ters durum: standart maliyet sistemi kullanılıyor olsaydı → 750 (soruda verilen) × 12 (2. adımda bulduk) = 9.000 TL","anlatim":"Ters durumda: soru fiili yerine standart saat kullanmanı isteseydi, 750 mks ile çarpardık. O zaman standart maliyet sistemi mantığı devreye girerdi.","doldur":[]},{"formul":"Yanlış yol: 750 × 12 = 9.000 (HATALI) → doğrusu 600 × 12 = 7.200 (3. adımda bulduk)","anlatim":"En sık hata: öğrenci 750 standart saati kullanıp 9.000 TL bulur, ama sipariz sistemi fiili hacme göre yükler. Standart saat burada sadece çeldiricidir.","doldur":[]}],"anahtar":[{"ornek":"üretim","kok":"üretim"},{"ornek":"gideri","kok":"gideri"},{"ornek":"bütçelenen","kok":"bütçel"},{"ornek":"sipariş","kok":"sipari"},{"ornek":"standart","kok":"standa"},{"ornek":"yüklenir","kok":"yüklen"}],"konuGiris":{"harita":"Ne zaman test edilir: Sipariş tamamlanmadan önce, genel üretim gideri\u0027nin önceden belirlenmiş oranla yüklenmesi gerektiğinde test edilir. Nasıl ölçülür: Yükleme oranı, bütçelenen genel üretim gideri\u0027nin bütçelenen faaliyet hacmine bölünmesiyle, yüklenen genel üretim gideri ise fiili faaliyet hacminin bu oranla çarpılmasıyla ölçülür. Nasıl kaydedilir: Dönem sonunda fiili genel üretim gideri ile yüklenen genel üretim gideri karşılaştırılıp fark satılan mamul maliyetine ya da ilgili hesaplara aktarılır.","desen":"Soru, öğrencinin standart makine saati ile fiili makine saatini karıştırmasını hedefler; yükleme fiili faaliyet hacmine göre yapılır. Bazı öğrenciler standart saati kullanarak yanlış hesap yapar, oysa standart saat sadece planlama amaçlıdır. Bu soru, sipariş maliyet sisteminde genel üretim gideri yükleme oranı hesaplaması noktasından geliyor (p. Teori-genel üretim gideri sapması).","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Bütçelenen genel üretim gideri\u0027nin bütçelenen faaliyet hacmine bölünmesiyle bulunan sabit oran.","ad":"Yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Siparişte gerçekte kullanılan makine saati veya işçilik saati miktarı.","ad":"Fiili faaliyet hacmi","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Fiili faaliyet hacminin önceden belirlenmiş yükleme oranıyla çarpılmasından bulunan tutar.","ad":"Yüklenen genel üretim gideri","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Üretim planlamasında öngörülen, yükleme hesabında kullanılmayan referans saat.","ad":"Standart makine saati","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Bütçelenen genel üretim gideri, bütçelenen kapasite ve siparişin fiili makine saati verilerek siparişe yüklenen genel üretim gideri tutarı istenir.","panel_ornek":"Bir dershane, yıllık bütçelediği 40 saatlik kurs desteğini öğrenci başına 2 saat olarak dağıtıyor. Bir öğrenci fiilen 5 saat ders aldıysa, ona yüklenen destek fiili saatine göre hesaplanır, planlanan saatine göre değil. Yani \u0027planlanan\u0027 değil \u0027gerçekleşen\u0027 esas alınır.","ornek":"Bir dershane, yıllık bütçelediği 40 saatlik kurs desteğini öğrenci başına 2 saat olarak dağıtıyor. Bir öğrenci fiilen 5 saat ders aldıysa, ona yüklenen destek fiili saatine göre hesaplanır, planlanan saatine göre değil. Yani \u0027planlanan\u0027 değil \u0027gerçekleşen\u0027 esas alınır.","yontemler":"Yükleme oranı bütçelenen genel üretim gideri\u0027nin bütçelenen kapasiteye bölünmesiyle bulunur; yüklenen genel üretim gideri ise bu oranın fiili (standart değil) faaliyet hacmiyle çarpılmasıyla hesaplanır.","nedir":"Sipariş maliyet sistemi, her siparişin ayrı maliyet nesnesi olarak izlendiği bir yöntemdir. Sınav, genel üretim giderinin önceden belirlenmiş oranla nasıl yüklendiğini ölçer."},"olay":"300.000/25.000=12 TL/mks; 600x12=7.200.","tuzak":{"D":{"ad":"Ortalama Saat Tuzağı","metin":"Fiili saat ile standart (öngörülen) saatin ortalamasını alarak hesapladın. Doğrusu: yükleme yalnız SİPARİŞİN FİİLİ makine saatine göre yapılır, standart saatin bununla ilgisi yoktur."},"E":{"ad":"Standart Saat Karıştırma Tuzağı","metin":"Fiili saat yerine üretim planlamasında öngörülen standart saati kullandın. Doğrusu: yükleme oranı fiili faaliyet hacmiyle çarpılır, standart/planlanan saat yükleme hesabına girmez."},"A":{"ad":"Oran Atlama Tuzağı","metin":"Bütçelenen genel üretim giderini yükleme oranı kurmadan doğrudan fiili makine saatine böldün. Doğrusu: önce oran bulunur (300.000/25.000=12), sonra fiili saatle çarpılır."},"B":{"ad":"Kısmi Maliyet Tuzağı","metin":"Genel üretim giderinin bir kısmını genel idare payı sayıp oranı yarıya indirdin. Doğrusu: 300.000 TL\u0027nin tamamı genel üretim gideri bütçesidir, oran 300.000/25.000=12\u0027dir."}},"celdiriciYol":{"D":"(600 + 750) / 2 = 675; 675 x 12 = 8.100 (fiili saat ile standart saatin ortalamasını aldın)","E":"750 x 12 = 9.000 (standart/öngörülen makine saatini fiili saat yerine kullandın)","A":"300.000 / 600 = 500 (yükleme oranını hesaplamadan bütçelenen GUG\u0027yi doğrudan fiili saate böldün)","B":"(300.000/2) / 25.000 = 6; 6 x 600 = 3.600 (genel üretim giderinin yarısını genel idare payı sayıp oranı düşürdün)"},"hap":"Sipariş maliyet sisteminde genel üretim gideri, dönem sonunu beklemeden önceden belirlenmiş yükleme oranı ile siparişin fiili faaliyet hacmine göre yüklenir.","teshis":{"C":{"gercek":"Sipariş maliyet sisteminde GUG önceden belirlenmiş oranla ve SİPARİŞİN FİİLİ faaliyet hacmiyle yüklenir; 300.000/25.000=12, 600x12=7.200.","ayirt":"Çarptığım saat, bu siparişin gerçekleşen (fiili) saati mi?","paragraf":"Teori - Sipariş maliyet sisteminde GUG yükleme oranı","yanilgi":"Bu şıkkı eleyen öğrenci, oranı doğru bulsa bile hangi saatle çarpacağını (fiili mi standart mı) karıştırıyordur."},"E":{"gercek":"Sistemin amacı, sipariş tamamlandığında ANINDA maliyet vermektir; bu yüzden önceden belirlenmiş oran, siparişin fiili gerçekleşen hacmiyle çarpılır, standart saatle değil.","ayirt":"Bu saat gerçekten gerçekleşmiş mi (fiili) yoksa planlanmış mı (standart)?","paragraf":"Teori - Sipariş maliyet sisteminde fiili hacim kullanımı","yanilgi":"Standart (öngörülen) saati, siparişin gerçek maliyetini yansıtan saat sanıyorsun."},"A":{"gercek":"Yükleme oranı ayrı bir adımdır: önce GUG bütçelenen hacme bölünür, sonra bu ORAN siparişin fiili hacmiyle çarpılır.","ayirt":"Ben oranı önce buldum mu, yoksa toplamı doğrudan sipariş saatine mi böldüm?","paragraf":"Teori - GUG yükleme oranı formülü","yanilgi":"Bütçelenen GUG\u0027nin tamamını doğrudan siparişin saatine bölünce doğru payı bulacağını sanıyorsun."},"D":{"gercek":"Yüklenen GUG yalnız siparişin fiili hacmine bağlıdır; standart saat sadece kapasite/sapma analizlerinde kullanılan ayrı bir kavramdır, yükleme hesabına girmez.","ayirt":"Standart saat bu soruda yükleme hesabının bir parçası mı, yoksa çeldirici bir bilgi mi?","paragraf":"Teori - Sapma analizinde kullanılan kavramların ayrımı","yanilgi":"İki farklı saat verilince, güvenli olsun diye ikisinin ortalamasını almanın doğru olacağını düşünüyorsun."},"B":{"gercek":"213 sayılı Vergi Usul Kanunu m.275/4 genel idare gideri payının maliyete katılmasını ihtiyari sayar, ama bu ayrı bir gider kalemidir; verilen 300.000 TL zaten sadece genel üretim gideridir, bölünmez.","ayirt":"Soru bana genel idare gideri diye ayrı bir tutar verdi mi, yoksa ben mi bölüştürdüm?","paragraf":"213 sayılı Vergi Usul Kanunu m.275/4","yanilgi":"Genel üretim gideri içinde ayrıca bir \u0027genel idare payı\u0027 olduğunu düşünüp toplamı ikiye bölüyorsun."}},"verilen":[[7,1],[1,1],[2,1],[3,1],[4,1]],"donem":7,"hesaplar":{"500":{"ad":"SERMAYE","tanim":"İşletmeye tahsis edilen veya işletmelerin ana sözleşmelerinde yer alan ve Ticaret Sicili\u0027ne tescil edilmiş bulunan sermaye tutarı bu hesapta yer alır. Kayıtlı sermaye sistemine alınan ortaklıklarda çıkarılmış sermaye gösterilir. Kayıtlı sermaye tavanı ayrıca dipnotlarda belirtilir."}}},{"capa":{"kaynak":"SGS 2026/1 Soru 63"},"kural":"","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 63","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Normal maliyet sorularında önce kapasite kullanım oranını (üretim/normal kapasite) kur, sonra bu oranı yalnız SABİT genel üretim giderine uygula; değişken genel üretim gideri ve direkt giderlere oran uygulanmaz.","konu":"normal maliyet yöntemi","tablo":{"satirlar":[["VERİLENLER","-"],["Normal kapasite","5.000 adet"],["Gerçekleşen üretim","4.000 adet"],["Sabit genel üretim gideri","100.000 TL"],["Direkt işçilik gideri","60.000 TL"],["HESAP","-"],["Kapasite kullanım oranı (4.000/5.000)","%80"],["Yüklenecek sabit genel üretim gideri (100.000 x %80)","80.000"]],"basliklar":["Kalem","Tutar/Oran"]},"siklar":{"C":"80.000","E":"125.000","A":"20.000","D":"100.000","B":"60.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1]],"tablo":{"basliklar":["Kalem","Tutar/Oran"],"satirlar":[["Kapasite kullanım oranı (4.500/6.000)","%75"],["Yüklenecek sabit genel üretim gideri (120.000 x %75)","90.000"]]},"tur":"tablo","soru":"Bir tekstil üretim işletmesinde şubat ayına ilişkin normal (pratik) kapasite 6.000 adet mamul olup, ilgili dönemde 4.500 adet mamul üretilmiştir. Aynı döneme ait sabit genel üretim gideri 120.000 TL, direkt işçilik gideri ise 70.000 TL\u0027dir. Normal maliyet yöntemi uygulandığında mamul maliyetine yüklenecek sabit genel üretim gideri kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve mamul maliyetine yüklenecek sabit genel üretim giderinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir mobilya üretim işletmesinde ocak ayına ilişkin normal (pratik) kapasite 5.000 adet mamul olup, ilgili dönemde 4.000 adet mamul üretilmiştir. Aynı döneme ait sabit genel üretim gideri 100.000 TL, direkt işçilik gideri ise 60.000 TL\u0027dir. Normal maliyet yöntemi uygulandığında mamul maliyetine yüklenecek sabit genel üretim gideri kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-03","verilenler":[{"deger":"5.000 adet","anlam":"İşletmenin aylık tam/pratik üretim kapasitesi; kapasite kullanım oranının paydasıdır.","ad":"Normal kapasite"},{"deger":"4.000 adet","anlam":"Dönemde fiilen üretilen mamul miktarı; kapasite kullanım oranının payıdır.","ad":"Gerçekleşen üretim"},{"deger":"100.000 TL","anlam":"Kapasite kullanım oranıyla çarpılarak mamule yüklenecek/dönem gideri olacak kısma ayrılan tutar.","ad":"Sabit genel üretim gideri"},{"deger":"60.000 TL","anlam":"Bu hesaplamaya girmeyen, dikkat dağıtmak için verilen çeldirici tutar.","ad":"Direkt işçilik gideri"}],"dayanak":"Maliyet Muhasebesi Teori Notu - Normal Maliyet Yöntemi; Tekdüzen Hesap Planı 680 Çalışmayan Kısım Gider ve Zararları","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Normal kapasite 5.000 adet (soruda verilen); Fiili üretim 4.000 adet (soruda verilen); Sabit genel üretim gideri 100.000 TL (soruda verilen); Direkt işçilik gideri 60.000 TL (soruda verilen, bu soruda kullanılmaz)","anlatim":"Soru bize şunları vermiş: normal kapasite, fiili üretim, sabit genel üretim gideri ve direkt işçilik gideri. Direkt işçilik bu soruda kullanılmayacak, çeldirici.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Kapasite Kullanım Oranı = Fiili Üretim / Normal Kapasite = 4.000 (soruda verilen) / 5.000 (soruda verilen) = %80","anlatim":"Normal maliyet yöntemi nedir? Sabit giderler fiili üretime değil, normal kapasiteye göre yüklenir. Az üretince birim maliyet şişmesin diye kapasite kullanım oranı bulunur.","doldur":[[6,1]]},{"formul":"Yüklenecek Sabit genel üretim gideri = Sabit genel üretim gideri × Kapasite Kullanım Oranı = 100.000 (soruda verilen) × %80 (1. adımda bulduk) = 80.000 TL","anlatim":"Şimdi bu oranı sabit gidere uyguluyoruz. Kapasitenin altında kalınan kısmın gideri mamule değil, döneme (zarar) yazılır.","doldur":[[7,1]]},{"formul":"Kullanılmayan Kapasite Payı = 100.000 (soruda verilen) − 80.000 (2. adımda bulduk) = 20.000 TL","anlatim":"Sağlama yapalım: kullanılmayan kapasite payı ayrı görünmeli. Bu pay üretim maliyetine girmez, doğrudan gider/zarar olur.","doldur":[]},{"formul":"Sonuç: Yüklenecek Sabit genel üretim gideri = 80.000 TL (2. adımda bulduk)","anlatim":"Sonuç: mamul maliyetine yüklenecek sabit genel üretim gideri 80.000 TL\u0027dir. Bu değer normal maliyet yönteminin doğrudan sonucudur.","doldur":[]},{"formul":"Ters durum: Fiili Üretim \u003e Normal Kapasite → Kapasite Kullanım Oranı %100 kabul edilir","anlatim":"Ters durumda: fiili üretim normal kapasiteyi aşsaydı oran %100\u0027de sabitlenir. Sabit gider tamamı yüklenir, fazlası ek kâr sayılmaz.","doldur":[]},{"formul":"Yanlış yol: Sabit genel üretim gideri\u0027ün tamamı yüklenir = 100.000 TL (HATALI) → doğrusu 80.000 TL (2. adımda bulduk)","anlatim":"En sık hata: sabit gideri fiili işçilik veya doğrudan 100.000 TL olarak yüklemek. Fiili kapasite oranı hesaba katılmazsa maliyet yanlış çıkar.","doldur":[]}],"anahtar":[{"ornek":"kapasite","kok":"kapasi"},{"ornek":"maliyet","kok":"maliye"},{"ornek":"üretim","kok":"üretim"},{"ornek":"giderinin","kok":"gideri"},{"ornek":"normal","kok":"normal"},{"ornek":"yüklenir","kok":"yüklen"}],"konuGiris":{"harita":"Ne zaman test edilir: kapasite ile gerçekleşen üretim farklı verildiğinde. Nasıl ölçülür: kapasite kullanım oranı (gerçekleşen üretim / normal kapasite) hesaplanıp sabit genel üretim gideri\u0027e uygulanır. Nasıl kaydedilir: yüklenen kısım mamul maliyetine, kalan kısım 680 Çalışmayan Kısım Gider ve Zararları hesabına yazılır.","desen":"Sınav genelde normal kapasite ile gerçekleşen üretimi ayrı ayrı verir ve öğrencinin oranı doğru kurmasını bekler. Tuzak, değişken genel üretim gideri\u0027ü de orana tabi tutmak ya da direkt işçilik gibi ilgisiz rakamı işleme sokmaktır. Bu soru normal maliyet yöntemindeki kapasite kullanım oranı kuralından geliyor (Teori Notu).","terimler":[{"kaynak":"soruda verilir","tanim":"İşletmenin normal koşullarda ulaşabileceği üretim miktarı","ad":"Normal (pratik) kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Gerçekleşen üretimin normal kapasiteye bölünmesiyle bulunan oran","ad":"Kapasite kullanım oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Sabit giderin kapasite kullanım oranı kadarlık kısmının mamule verilen payı","ad":"Yüklenecek sabit genel üretim gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Kullanılmayan kapasiteye düşen sabit gider, dönem gideri sayılır","ad":"Atıl (boş) kapasite gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Normal kapasite, gerçekleşen üretim ve sabit genel üretim gideri tutarı verilip mamul maliyetine yüklenecek sabit genel üretim gideri tutarı istenir.","panel_ornek":"Bir kırtasiye dükkânının ayda 10 masa üretme kapasitesi var ama sadece 6 masa üretmiş; yani kapasitesinin sadece bir kısmını kullanmış. Kirasının tamamını 6 masaya değil, kullandığı orana göre paylaştırması gerekir, kalan kısmı boşa çıkan gider sayılır.","ornek":"Bir kırtasiye dükkânının ayda 10 masa üretme kapasitesi var ama sadece 6 masa üretmiş; yani kapasitesinin sadece bir kısmını kullanmış. Kirasının tamamını 6 masaya değil, kullandığı orana göre paylaştırması gerekir, kalan kısmı boşa çıkan gider sayılır.","yontemler":"Tek yöntem: sabit genel üretim gideri, kapasite kullanım oranıyla çarpılır; kalan kısım maliyete girmez.","nedir":"Normal maliyet yöntemi, sabit genel üretim giderlerinin ne kadarının mamul maliyetine gireceğini kapasite kullanımına göre belirleyen bir maliyetleme biçimidir. Sınav, boş kapasiteye düşen payı ayırıp doğru tutarı bulabilmeni ölçer."},"olay":"","tuzak":{"D":{"ad":"Yanlış Kalem Tuzağı","metin":"Öğrenci sorudaki direkt işçilik giderini (60.000 TL) sabit genel üretim giderinin yüklenecek kısmıyla karıştırıp doğrudan cevap olarak yazar. Doğrusu: Direkt işçilik bu hesaplamaya hiç girmez, çeldirici veridir."},"E":{"ad":"Tam Maliyet Karıştırması","metin":"Öğrenci normal maliyeti tam maliyetle karıştırıp sabit genel üretim giderinin tamamını (100.000 TL) mamule yükler, kapasite kullanım oranını hiç uygulamaz. Doğrusu: Tam maliyette tüm sabit genel üretim gideri yüklenir ama soru normal maliyeti sormaktadır, oranlama zorunludur."},"A":{"ad":"Ne soruluyor","metin":"Normal maliyet yönteminde mamule yüklenecek sabit genel üretim gideri tutarı isteniyor. Kural: Normal maliyet yönteminde sabit genel üretim giderinin yalnız kapasite kullanım oranına isabet eden kısmı mamul maliyetine girer, kalan kısım (boş kapasite payı) dönem gideri sayılır. Hesap: Kapasite kullanım oranı = 4.000/5.000 = %80; yüklenecek pay = 100.000 x %80 = 80.000. Doğrusu: Mamul maliyetine yüklenecek sabit genel üretim gideri 80.000 TL\u0027dir."},"B":{"ad":"Boş Kapasite Tuzağı","metin":"Öğrenci 100.000 TL\u0027den mamule yüklenen 80.000 TL\u0027yi çıkararak bulduğu atıl kapasiteye ait 20.000 TL\u0027yi soruya cevap sanır. Doğrusu: 20.000 TL dönem gideridir (680 hesap), mamul maliyetine girecek tutar değildir."}},"celdiriciYol":{"D":"100.000 = 100.000 (tam maliyet mantığıyla tüm sabit genel üretim gideri\u0027ü yükleme)","E":"100.000 x (5.000/4.000) = 125.000 (kapasite kullanım oranını ters kurma)","A":"100.000 - (100.000 x 4.000/5.000) = 100.000 - 80.000 = 20.000 (boş kapasite payını cevap sanma)","B":"60.000 = 60.000 (direkt işçiliği sabit genel üretim gideri payı sanma)"},"hap":"Normal maliyet yönteminde sabit genel üretim giderinin yalnız kapasite kullanım oranına (gerçekleşen üretim/normal kapasite) isabet eden kısmı mamul maliyetine yüklenir, kalanı dönem gideridir.","teshis":{"C":{"gercek":"Normal maliyet yönteminde sabit genel üretim gideri, kapasite kullanım oranıyla (üretim/normal kapasite) çarpılarak yüklenir; kalan kısım dönem gideridir.","ayirt":"Sabit gideri oranla mı çarptım yoksa olduğu gibi mi aldım?","paragraf":"Teori Notu - Normal Maliyet Yöntemi","yanilgi":"Normal maliyette sabit genel üretim gideri\u0027ün tamamının yükleneceğini düşünüp oranlamayı atlıyorsun."},"E":{"gercek":"Kapasite kullanım oranı gerçekleşen üretimin normal kapasiteye bölünmesiyle bulunur (4.000/5.000), tersi değil.","ayirt":"Oranı kurarken küçük sayıyı mı büyük sayıya, yoksa büyüğü küçüğe mi böldüm?","paragraf":"Teori Notu - Normal Maliyet Yöntemi","yanilgi":"Kapasite kullanım oranını kurarken payda ile payı ters çeviriyorsun."},"A":{"gercek":"Boş kapasiteye isabet eden sabit genel üretim gideri (20.000 TL) mamul maliyetine değil, dönem gideri olarak 680 hesabına gider.","ayirt":"Bu tutar üretilen mamule mi, yoksa çalışılmayan kısma mı ait?","paragraf":"Teori Notu - Normal Maliyet Yöntemi","yanilgi":"Atıl kapasiteye düşen sabit gideri, mamule yüklenen tutarmış gibi düşünüyorsun."},"D":{"gercek":"Tam maliyette sabit genel üretim gideri\u0027ün tamamı yüklenir, normal maliyette ise yalnız kapasite kullanım oranına düşen kısım yüklenir.","ayirt":"Soru hangi yöntemi soruyor: tam mı, normal mi?","paragraf":"Teori Notu - Normal Maliyet Yöntemi","yanilgi":"Normal maliyet ile tam maliyet yöntemini aynı şey sanıp oranlama yapmadan tüm sabit gideri yüklüyorsun."},"B":{"gercek":"Sabit genel üretim gideri payı yalnız sabit genel üretim gideri tutarı ve kapasite kullanım oranından hesaplanır; direkt işçilik ayrı bir maliyet unsurudur.","ayirt":"Bu sayı hangi maliyet unsuruna ait, soruda hangi unsur isteniyor?","paragraf":"Vergi Usul Kanunu m.275/2-3","yanilgi":"Sorudaki her sayının hesaplamaya girdiğini sanıp direkt işçiliği sabit genel üretim gideri payıyla karıştırıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":7,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 57"},"kural":"Genel üretim gideri, ilan edilen dağıtım anahtarı (burada makine saati) üzerinden toplam anahtar miktarına oranlanarak paylaştırılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 57","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Soruda birden fazla ölçüt (saat türü) verilmişse önce hangisinin dağıtım anahtarı olarak açıkça belirtildiğine bak, diğerini hesaba katma.","konu":"genel üretim gideri dağıtımı","tablo":{"satirlar":[["VERİLENLER","-"],["Toplam genel üretim gideri","60.000 TL"],["A mamulü makine saati","200"],["B mamulü makine saati","400"],["A mamulü direkt işçilik saati","150"],["B mamulü direkt işçilik saati","450"],["HESAP","-"],["Toplam Makine Saati (200+400)","600"],["Birim Dağıtım Oranı (60.000/600)","100"],["B Mamulüne Yüklenecek Genel Üretim Gideri (400x100)","40.000"]],"basliklar":["Adım","Tutar"]},"siklar":{"C":"40.000","E":"60.000","A":"20.000","D":"45.000","B":"30.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Adım","Tutar"],"satirlar":[["Toplam İşçilik Saati (300+600)","900"],["Birim Dağıtım Oranı (90.000/900)","100"],["P Mamulüne Yüklenecek Genel Üretim Gideri (300x100)","30.000"]]},"tur":"tablo","soru":"İşletmede bir üretim döneminde toplam 90.000 TL genel üretim gideri gerçekleşmiştir. Bu gider, gider yerinde kullanılan direkt işçilik saati esasına göre P ve R mamullerine dağıtılacaktır. Döneme ait veriler: P mamulü 300 işçilik saati, 250 makine saati; R mamulü 600 işçilik saati, 550 makine saati çalışmıştır. Buna göre, P mamulüne yüklenecek genel üretim gideri kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve P mamulüne yüklenecek genel üretim giderinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmede bir üretim döneminde toplam 60.000 TL genel üretim gideri gerçekleşmiştir. Bu gider, gider yerinde kullanılan makine saati esasına göre A ve B mamullerine dağıtılacaktır. Döneme ait veriler: A mamulü 200 makine saati, 150 direkt işçilik saati; B mamulü 400 makine saati, 450 direkt işçilik saati çalışmıştır. Buna göre, B mamulüne yüklenecek genel üretim gideri kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-04","verilenler":[{"deger":"60.000 TL","anlam":"Dönemde gerçekleşen ve mamuller arasında dağıtılacak toplam giderdir.","ad":"Toplam genel üretim gideri"},{"deger":"200","anlam":"A mamulüne dağıtım anahtarı olarak kullanılan makine saati miktarıdır.","ad":"A mamulü makine saati"},{"deger":"400","anlam":"B mamulüne dağıtım anahtarı olarak kullanılan makine saati miktarıdır, hesabın esasıdır.","ad":"B mamulü makine saati"},{"deger":"150","anlam":"Dağıtım anahtarı olarak belirtilmemiştir, hesaba girmeyen çeldirici veridir.","ad":"A mamulü direkt işçilik saati"},{"deger":"450","anlam":"Dağıtım anahtarı olarak belirtilmemiştir, hesaba girmeyen çeldirici veridir.","ad":"B mamulü direkt işçilik saati"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı – 730 Genel Üretim Giderleri hesabı açıklaması (giderlerin dağıtım yoluyla üretim maliyetine yansıtılması ilkesi)","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Toplam genel üretim gideri 60.000 TL (soruda verilen); A makine saati 200 (soruda verilen); B makine saati 400 (soruda verilen); A işçilik saati 150 (soruda verilen); B işçilik saati 450 (soruda verilen)","anlatim":"Soru bize şunları vermiş: toplam genel üretim gideri 60.000 TL, dağıtım anahtarı makine saati. A mamulü 200 makine saati, 150 işçilik saati; B mamulü 400 makine saati, 450 işçilik saati çalışmış.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"Toplam Makine Saati = A + B = 200 (soruda verilen) + 400 (soruda verilen) = 600","anlatim":"Dağıtım anahtarı makine saati olduğu için önce toplam makine saatini buluyoruz. İşçilik saatleri bu dağıtımda hiç kullanılmaz, dikkat.","doldur":[[7,1]]},{"formul":"Birim Dağıtım Oranı = Toplam Gider / Toplam Makine Saati = 60.000 (soruda verilen) / 600 (2. adımda bulduk) = 100 TL","anlatim":"Şimdi birim dağıtım oranını buluyoruz - toplam gideri toplam saate bölüyoruz. Bu oran her mamule saati başına düşen gider payını verir.","doldur":[[8,1]]},{"formul":"B Payı = B Makine Saati × Birim Oran = 400 (soruda verilen) × 100 (3. adımda bulduk) = 40.000 TL","anlatim":"B mamulüne düşen payı, B\u0027nin makine saatini birim oranla çarparak buluyoruz. Sadece B\u0027nin kendi saati kullanılır, A\u0027nınki karışmaz.","doldur":[[9,1]]},{"formul":"Sonuç = 40.000 TL (4. adımda bulduk)","anlatim":"Sonuç: B mamulüne 40.000 TL genel üretim gideri yüklenir. Bu, tabloda son satırdaki değer.","doldur":[]},{"formul":"Yanlış yol: 450 (soruda verilen) / (150+450) (soruda verilen) × 60.000 = 45.000 (HATALI) → doğrusu 40.000 (4. adımda bulduk)","anlatim":"En sık hata: dağıtımı işçilik saatiyle yapmak. Anahtar makine saati dendiği için işçilik saatleri hiç hesaba girmez.","doldur":[]}],"anahtar":[{"ornek":"anahtarının","kok":"anahta"},{"ornek":"makine","kok":"makine"},{"ornek":"dağıtım","kok":"dağıtı"},{"ornek":"gideri","kok":"gideri"},{"ornek":"işçilik","kok":"işçili"},{"ornek":"mamulün","kok":"mamulü"}],"konuGiris":{"harita":"Ne zaman test edilir: birden fazla mamul ortak bir gideri paylaşacağında test edilir. Nasıl ölçülür: seçilen dağıtım anahtarındaki (örn. makine saati) mamul payı, toplam anahtar miktarına oranlanarak ölçülür. Nasıl kaydedilir: bulunan pay, ilgili mamulün maliyetine yükleme tutarı olarak kaydedilir.","desen":"Soru, direkt işçilik saati gibi ilgisiz bir veriyi araya karıştırarak yanlış anahtarın kullanılmasını hedefler; öğrenci sorudaki anahtarı (makine saati) fark etmeden diğer sayıyla işlem yapabilir. Tuzak, hangi ölçünün gider dağıtımı için belirtildiğini net okumaktan kaçmaktır. Bu soru dağıtım anahtarının doğru seçilmesi noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Giderin mamullere paylaştırılmasında kullanılan ortak ölçü birimi","ad":"Dağıtım anahtarı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Dönemde gerçekleşen, dağıtılacak toplam genel üretim gideri tutarı","ad":"Toplam genel üretim gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Toplam giderin toplam anahtar miktarına bölünmesiyle bulunan birim pay","ad":"Yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Yükleme oranının ilgili mamulün anahtar miktarıyla çarpılmasından bulunan pay","ad":"Mamule yüklenen tutar","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Toplam gider tutarı ve iki mamulün anahtar (makine saati) verileri verilir, istenen mamule düşen pay istenir.","panel_ornek":"Bir apartmanda toplam 9.000 TL su gideri, dairelerin kullandığı musluk sayısına göre paylaştırılıyor: 1. daire 2 musluk, 2. daire 4 musluk kullanıyor. Toplam 6 musluk üzerinden pay hesaplanır, musluk sayısı fazla olan daire daha çok öder. Burada \u0027musluk sayısı\u0027 tıpkı makine saati gibi bir dağıtım anahtarıdır.","ornek":"Bir apartmanda toplam 9.000 TL su gideri, dairelerin kullandığı musluk sayısına göre paylaştırılıyor: 1. daire 2 musluk, 2. daire 4 musluk kullanıyor. Toplam 6 musluk üzerinden pay hesaplanır, musluk sayısı fazla olan daire daha çok öder. Burada \u0027musluk sayısı\u0027 tıpkı makine saati gibi bir dağıtım anahtarıdır.","yontemler":"Basit oran yöntemi: toplam gider, toplam anahtar miktarına bölünüp birim yükleme oranı bulunur, sonra ilgili mamulün anahtar miktarıyla çarpılır.","nedir":"Genel üretim gideri dağıtımı, ortak fabrika giderlerinin uygun bir ölçüye göre mamullere paylaştırılması işlemidir. Sınav, doğru dağıtım anahtarını seçip payı hesaplayabilme becerisini ölçer."},"olay":"Toplam makine saati = 200+400 = 600; birim dağıtım oranı = 60.000/600 = 100; B payı = 400x100 = 40.000.","tuzak":{"D":{"ad":"Anahtar Karıştırma Tuzağı","metin":"Soruda dağıtım ölçütü olarak makine saati belirtilmişken, tabloda yer alan direkt işçilik saatini anahtar sanıp onunla dağıtım yaparsın. Doğrusu: dağıtım yalnızca soruda belirtilen makine saati üzerinden yapılır, direkt işçilik saati bu dağıtımda kullanılmaz."},"E":{"ad":"Dağıtım Yapmama Tuzağı","metin":"Toplam genel üretim giderinin tamamını, sanki tek mamul varmış gibi doğrudan B\u0027ye yüklersin. Doğrusu: gider iki mamul arasında anahtar oranına göre paylaştırılmadan tek mamule yazılamaz."},"A":{"ad":"Mamul Karıştırma Tuzağı","metin":"A mamulünün payını hesaplayıp B mamulüne aitmiş gibi yazarsın. Doğrusu: B mamulünün payı kendi makine saatiyle (400) çarpılarak bulunur."},"B":{"ad":"Ortalama Alma Tuzağı","metin":"İki mamulün saatlerini toplayıp ikiye bölerek \u0027ortalama anahtar\u0027 üretirsin, oysa dağıtım anahtarı ortalanmaz. Doğrusu: her mamule kendi gerçekleşen makine saati üzerinden pay verilir."}},"celdiriciYol":{"D":"150+450=600; 60.000/600=100; 100x450=45.000 (dağıtım anahtarı olarak makine saati yerine direkt işçilik saatini kullanma)","E":"60.000x1=60.000 (toplam genel üretim giderinin tamamını dağıtım yapmadan tek mamule yükleme)","A":"60.000/600=100; 100x200=20.000 (A mamulünün payını B mamulüne yazma)","B":"(200+400)/2=300; 300x100=30.000 (saatleri ortalayarak dağıtım anahtarını yanlış hesaplama)"},"hap":"Genel üretim gideri, soruda belirtilen dağıtım anahtarının payına göre paylaştırılır: birim oran = toplam gider / toplam anahtar miktarı, mamul payı = birim oran x mamulün kendi anahtar miktarı.","teshis":{"C":{"gercek":"Soru dağıtım ölçütünü açıkça \u0027makine saati\u0027 olarak belirtmiştir; diğer veri çeldiricidir ve hesaba girmez.","ayirt":"Soru hangi anahtarı esas aldığını söylüyor mu?","paragraf":"THP 730 – dağıtım yoluyla yükleme ilkesi","yanilgi":"Bu şıkkı eleyen öğrenci, sorudaki ikinci veriyi (direkt işçilik saati) de hesaba katması gerektiğini düşünür."},"E":{"gercek":"Genel üretim gideri iki mamul arasında ortak katlanılan bir maliyettir; anahtar oranına göre bölünmeden tek mamule yüklenemez.","ayirt":"Bu gider birden fazla mamul için mi katlanıldı, öyleyse paylaştırdım mı?","paragraf":"THP 730 – dağıtım yoluyla yükleme ilkesi","yanilgi":"Tek bir mamule odaklanınca dağıtım yapmayı unutup toplam gideri direkt oraya yazıyorsun."},"A":{"gercek":"Dağıtım oranı sabittir (100 TL/saat) ama her mamulün payı kendi saatiyle çarpılır; A\u0027nın payı A\u0027ya, B\u0027nin payı B\u0027ye aittir.","ayirt":"Bu tutarı hangi mamulün saatiyle çarparak buldum?","paragraf":"THP 730 – dağıtım yoluyla yükleme ilkesi","yanilgi":"İki mamulün paylarını hesapladıktan sonra hangisinin hangisine ait olduğunu karıştırıyorsun."},"D":{"gercek":"Dağıtım anahtarı soru metninde açıkça belirtilir; burada makine saatidir, direkt işçilik saati sadece çeldirici veridir.","ayirt":"Soru metninde dağıtım ölçütü olarak hangi saat türü adı geçiyor?","paragraf":"THP 730 – dağıtım yoluyla yükleme ilkesi","yanilgi":"Tabloda birden fazla saat verisi görünce, en son verilen ya da en büyük saati anahtar sanıyorsun."},"B":{"gercek":"Dağıtım anahtarı her mamulün KENDİ gerçekleşen miktarı üzerinden uygulanır, mamuller arası ortalama alınmaz.","ayirt":"Ortalama mı aldım, yoksa mamulün kendi saatini mi kullandım?","paragraf":"THP 730 – dağıtım yoluyla yükleme ilkesi","yanilgi":"Dağıtım anahtarının \u0027ortalaması\u0027 alınırsa adil bir pay çıkar sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":7,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 57"},"kural":"","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 57","sonDonem":2,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Üç kademeli formülde hangi stoğun hangi kademede ve hangi yönde (artı/eksi) kullanıldığını satır satır yaz, zihinden işlem yapma.","konu":"satılan mamul maliyeti","tablo":{"satirlar":[["VERİLENLER","-"],["Üretilen mamul maliyeti","500.000 TL"],["Dönem başı mamul stoğu","80.000 TL"],["Dönem sonu mamul stoğu","60.000 TL"],["HESAP","-"],["Üretilen Mamul Maliyeti + Dönem Başı Mamul Stoğu","500.000 + 80.000 = 580.000"],["Satılan Mamul Maliyeti (- Dönem Sonu Mamul Stoğu)","580.000 - 60.000 = 520.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"480.000","E":"580.000","A":"360.000","D":"520.000","B":"440.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":5,"ornekler":[],"donemler":[]},"oyun":null,"tip":"hesap","soru":"Bir işletmenin 2026 yılı verilerine göre üretilen mamul maliyeti 500.000 TL, dönem başı mamul stoğu 80.000 TL ve dönem sonu mamul stoğu 60.000 TL\u0027dir. Buna göre işletmenin satılan mamul maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-05","verilenler":[{"deger":"500.000 TL","anlam":"Üç kademeli formülün ikinci kademesinden gelen, üretimi tamamlanmış mamullerin toplam maliyetidir; satılan mamul maliyeti hesabının başlangıç noktasıdır.","ad":"Üretilen mamul maliyeti"},{"deger":"80.000 TL","anlam":"Dönem başında depoda hazır bulunan mamul stoğudur; satılan mamul maliyeti formülüne artı yönde eklenir.","ad":"Dönem başı mamul stoğu"},{"deger":"60.000 TL","anlam":"Dönem sonunda henüz satılmamış mamul stoğudur; satılan mamul maliyeti formülünden eksi yönde düşülür.","ad":"Dönem sonu mamul stoğu"}],"dayanak":"Maliyet muhasebesi - ardışık dönem satılan mamul maliyeti teorisi (üç kademeli formül)","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Üretilen Mamul Maliyeti 500.000 TL (soruda verilen); Dönem Başı Mamul Stoğu 80.000 TL (soruda verilen); Dönem Sonu Mamul Stoğu 60.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: üretilen mamul maliyeti, dönem başı mamul stoğu ve dönem sonu mamul stoğu. Satılan mamul maliyetini bunlarla bulacağız.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Satışa Hazır Mamul = Üretilen Mamul Maliyeti + Dönem Başı Mamul Stoğu = 500.000 (soruda verilen) + 80.000 (soruda verilen) = 580.000 TL","anlatim":"Satışa hazır mamul tutarını buluyoruz. Dönem başındaki stok bu dönem üretilene eklenir, çünkü ikisi de satılabilir mamul havuzuna girer.","doldur":[[5,1]]},{"formul":"Satılan Mamul Maliyeti = Satışa Hazır Mamul − Dönem Sonu Mamul Stoğu = 580.000 (1. adımda bulduk) − 60.000 (soruda verilen) = 520.000 TL","anlatim":"Dönem sonunda elde kalan mamul satılmamış demektir, bu yüzden havuzdan çıkarılır. Kalan kısım satılan mamulün maliyetidir.","doldur":[[6,1]]},{"formul":"Sağlama: 520.000 (2. adımda bulduk) + 60.000 (soruda verilen) − 80.000 (soruda verilen) = 500.000 (soruda verilen) ✓","anlatim":"Sağlamasını yapalım: dönem sonu stoğunu geri eklersek üretilen mamul maliyeti çıkmalı. Bu ters işlem hesabımızın doğruluğunu kanıtlar.","doldur":[]},{"formul":"Satılan Mamul Maliyeti = 520.000 TL","anlatim":"Sonuç: satılan mamul maliyeti bulundu. Bu tutar gelir tablosunda satışların maliyeti kalemine yazılır.","doldur":[]},{"formul":"Yanlış yol: 500.000 (soruda verilen) + 60.000 (soruda verilen) − 80.000 (soruda verilen) = 480.000 (HATALI) → doğrusu 520.000 (2. adımda bulduk)","anlatim":"En sık hata: dönem sonu stoğu eklenip dönem başı çıkarılır, bu tam ters işlemdir. Kural hep aynı - başa eklenir, sona çıkarılır.","doldur":[]}],"anahtar":[{"ornek":"maliyeti","kok":"maliye"},{"ornek":"satılan","kok":"satıla"},{"ornek":"eklenip","kok":"ekleni"},{"ornek":"üretilen","kok":"üretil"},{"ornek":"çıkarılır","kok":"çıkarı"},{"ornek":"hesabımızın","kok":"hesabı"}],"konuGiris":{"harita":"Ne zaman test edilir: üretilen mamul maliyeti bulunduktan sonra son kademede, mamulün satışa çıkışı hesaplanırken test edilir. Nasıl ölçülür: üretilen mamul maliyetine dönem başı mamul stoğu eklenir, dönem sonu mamul stoğu çıkarılır. Nasıl kaydedilir: sonuç 620 Satılan Mamul Maliyeti hesabına borç kaydıyla gelir tablosuna aktarılır.","desen":"Sorular genellikle üretilen mamul maliyetini doğrudan vererek son kademe olan mamul stok düzeltmesine odaklanır. Tuzak, yarı mamul stok verisi de sorulmuşsa adayın onu yanlışlıkla bu kademede kullanmasıdır; oysa yarı mamul düzeltmesi bir önceki kademeye aittir. Bu soru üç kademeli geçişin son basamağı olan mamul stok düzeltmesi noktasından geliyor (p.üç kademeli geçiş).","terimler":[{"kaynak":"soruda verilir","tanim":"Toplam üretim maliyetine yarı mamul stok düzeltmesi yapılarak bulunan tutar","ad":"Üretilen mamul maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Dönem başında elde mevcut bitmiş ama satılmamış mamul tutarı","ad":"Dönem başı mamul stoğu","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Dönem sonunda elde kalan, henüz satılmamış mamul tutarı","ad":"Dönem sonu mamul stoğu","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Üretilen mamul maliyetinden mamul stok farkı düzeltilerek elde edilen nihai maliyet","ad":"Satılan mamul maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda üretilen mamul maliyeti ile dönem başı ve dönem sonu mamul stok tutarları verilir, satılan mamul maliyeti istenir.","panel_ornek":"Bir manav o gün 40 kilo domates hazırlamış, sabahtan devreden 5 kilosu vardı, akşam 3 kilosu satılmadan kaldı. O gün satılan domates miktarı 40+5-3=42 kilodur. Mamul stoğu da tıpkı bu domates gibi devreden ve kalan miktar mantığıyla düzeltilir.","ornek":"Bir manav o gün 40 kilo domates hazırlamış, sabahtan devreden 5 kilosu vardı, akşam 3 kilosu satılmadan kaldı. O gün satılan domates miktarı 40+5-3=42 kilodur. Mamul stoğu da tıpkı bu domates gibi devreden ve kalan miktar mantığıyla düzeltilir.","yontemler":"Tek yöntem vardır: üretilen mamul maliyetine dönem başı stok eklenir, dönem sonu stok çıkarılır; işaretleri karıştırmamak kritiktir.","nedir":"Satılan mamul maliyeti, üretilen mamullerin stok hareketleri sonucunda dönem içinde fiilen satılan kısmının maliyetini gösterir. Sınav, üretilen mamul maliyetine dönem başı ve dönem sonu mamul stoklarının doğru eklenip çıkarılıp çıkarılamadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Eksik Kalem Tuzağı","metin":"öğrenci dönem başı mamul stoğunu hesaba hiç katmadan yalnızca dönem sonu stoğunu düşmüştür. Doğrusu: dönem başı stoğu mutlaka üretilen mamul maliyetine eklenir."},"E":{"ad":"Yön Karıştırma Tuzağı","metin":"öğrenci dönem başı ve dönem sonu stok işaretlerini birbirine karıştırıp dönem başını çıkarıp dönem sonunu eklemiştir. Doğrusu: dönem başı stoğu artı, dönem sonu stoğu eksi yönde işlem görür."},"A":{"ad":"Ne soruluyor","metin":"işletmenin satılan mamul maliyetinin tutarı soruluyor. Kural: satılan mamul maliyeti, üretilen mamul maliyetine dönem başı mamul stoğu eklenip dönem sonu mamul stoğu düşülerek bulunur. Hesap: 500.000 + 80.000 - 60.000 = 520.000. Doğrusu: satılan mamul maliyeti 520.000 TL\u0027dir."},"B":{"ad":"İşaret Tersine Çevirme Tuzağı","metin":"öğrenci her iki stok kalemini de üretilen mamul maliyetinden düşülecek kalem sanıp ikisini de çıkarmıştır. Doğrusu: dönem başı stoğu eklenir, yalnız dönem sonu stoğu düşülür."}},"celdiriciYol":{"C":"500.000 - 80.000 + 60.000 = 480.000 (dönem başı ve dönem sonu stok işaretlerini ters uyguladı)","E":"500.000 + 80.000 = 580.000 (dönem sonu mamul stoğunu düşmeyi unuttu)","A":"500.000 - 80.000 - 60.000 = 360.000 (her iki stok kalemini de eksi yönde uyguladı)","B":"500.000 - 60.000 = 440.000 (dönem başı mamul stoğunu hesaba katmadı)"},"hap":"Satılan mamul maliyeti, üretilen mamul maliyetine dönem başı mamul stoğu eklenip dönem sonu mamul stoğu düşülerek bulunur.","teshis":{"C":{"gercek":"Formülde dönem başı stoğu artı, dönem sonu stoğu eksi yönde kullanılır; yönler birbirinin yerine geçmez.","ayirt":"Hangi stok dönemin başında, hangisi sonunda kaldı; işaretini ona göre mi verdim?","paragraf":"Maliyet muhasebesi - ardışık dönem SMM teorisi","yanilgi":"Sen dönem başı ve dönem sonu stoklarının yönünü karıştırıyor, ikisini yer değiştiriyorsun."},"E":{"gercek":"Formülde üç kademe de eksiksiz uygulanır; dönem sonu stoğu mutlaka eksi yönde düşülür.","ayirt":"Dönem sonu stoğunu formülden çıkardım mı, eksik bıraktım mı?","paragraf":"Maliyet muhasebesi - ardışık dönem SMM teorisi","yanilgi":"Sen dönem sonu stoğunu hesaba hiç katmıyor, yalnızca dönem başı stoğunu eklemekle yetiniyorsun."},"A":{"gercek":"Satılan mamul maliyeti formülünde yalnız dönem sonu stoğu eksi yönde, dönem başı stoğu ise artı yönde işlem görür.","ayirt":"Bu stok dönem başında mı dönem sonunda mı, hangi yönde eklendi?","paragraf":"Maliyet muhasebesi - ardışık dönem SMM teorisi","yanilgi":"Sen her iki stok kalemini de maliyetten düşülecek kalem sanıyorsun."},"D":{"gercek":"Satılan mamul maliyeti = Üretilen mamul maliyeti + Dönem başı mamul stoğu - Dönem sonu mamul stoğu kuralı doğrudan uygulanır.","ayirt":"Üç kademeli formülü sırasıyla uyguladım mı, dönem sonu stoğunu eksi yönde mi yazdım?","paragraf":"Maliyet muhasebesi - ardışık dönem SMM teorisi","yanilgi":"Bu şıkkı eleyen öğrenci, dönem sonu stoğunun mutlaka eklenmesi gerektiğini düşünür ve doğru işareti gözden kaçırır."},"B":{"gercek":"Üç kademeli formülde her stok kalemi kendi kademesinde ve doğru yönde mutlaka hesaba katılır; dönem başı stoğu üretilen mamul maliyetine eklenir.","ayirt":"Üç kademedeki her stoğu formülüme yazdım mı?","paragraf":"Maliyet muhasebesi - ardışık dönem SMM teorisi","yanilgi":"Sen dönem başı stoğunun hesaba katılması gerektiğini unutuyorsun."}},"verilen":[[5,0],[6,0],[1,1],[2,1],[3,1]],"donem":5,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 61"},"kural":"Toplam genel üretim gideri sapması, fiili genel üretim gideri ile yüklenen genel üretim gideri arasındaki farktır; yüklenen genel üretim gideri, fiili faaliyet hacminin standart yükleme oranıyla çarpılmasıyla bulunur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 61","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Sapma sorularında önce \u0027hangi hacim çarpılacak\u0027 sorusunu sor: fiili mi normal kapasite mi - kapasite yalnız hacim sapmasında kullanılır.","konu":"genel üretim gideri yükleme","tablo":{"satirlar":[["VERİLENLER","-","-"],["Standart yükleme oranı","40 TL (makine saati başına)","-"],["Fiili makine saati","1.000 makine saati","-"],["Fiili genel üretim gideri","42.000 TL","-"],["Normal kapasite","900 makine saat","-"],["HESAP","-","-"],["Yüklenen Genel Üretim Gideri","1.000 makine saati x 40 TL","40.000"],["Toplam Genel Üretim Gideri Sapması","42.000 - 40.000 (Eksik Yükleme)","2.000"]],"basliklar":["Kalem","Hesaplama","Tutar"]},"siklar":{"C":"6.000 eksik yükleme","E":"Sapma yoktur","A":"2.000 eksik yükleme","D":"6.000 fazla yükleme","B":"2.000 fazla yükleme"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[1,2]],"tablo":{"basliklar":["Kalem","Hesaplama","Tutar"],"satirlar":[["Yüklenen Genel Üretim Gideri","1.200 makine saati x 50 TL","60.000"],["Toplam Genel Üretim Gideri Sapması","65.000 - 60.000 (Eksik Yükleme)","5.000"]]},"tur":"tablo","soru":"İşletme, genel üretim giderlerini standart maliyet yöntemiyle makine saati esasına göre yüklemektedir. 2026 yılı standart genel üretim gideri yükleme oranı makine saati başına 50 TL\u0027dir. Kasım ayında fiilen 1.200 makine saati çalışılmış ve fiili genel üretim gideri 65.000 TL olarak gerçekleşmiştir. İşletmenin normal kapasitesi 1.100 makine saattir. Buna göre, dönem sonunda oluşan toplam genel üretim gideri sapması ve yönü aşağıdakilerden hangisidir?","verilen":[[0,1],[0,2]],"hedef":"Tabloyu doldur ve toplam genel üretim gideri sapmasının tutarını ve yönünü bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, genel üretim giderlerini standart maliyet yöntemiyle makine saati esasına göre yüklemektedir. 2026 yılı standart genel üretim gideri yükleme oranı makine saati başına 40 TL\u0027dir. Ekim ayında fiilen 1.000 makine saati çalışılmış ve fiili genel üretim gideri 42.000 TL olarak gerçekleşmiştir. İşletmenin normal kapasitesi 900 makine saattir. Buna göre, dönem sonunda oluşan toplam genel üretim gideri sapması ve yönü aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-07","verilenler":[{"deger":"40 TL (makine saati başına)","anlam":"Yüklenen GUG hesabında fiili hacimle çarpılacak birim orandır.","ad":"Standart yükleme oranı"},{"deger":"1.000 makine saati","anlam":"Dönemde gerçekleşen faaliyet hacmidir, yüklenen GUG hesabında kullanılır.","ad":"Fiili makine saati"},{"deger":"42.000 TL","anlam":"Dönemde fiilen gerçekleşen GUG tutarıdır, sapma hesabının bir tarafını oluşturur.","ad":"Fiili genel üretim gideri"},{"deger":"900 makine saat","anlam":"Çeldirici veridir; toplam GUG sapması hesabına girmez, yalnızca hacim sapması analizinde kullanılır.","ad":"Normal kapasite"}],"dayanak":"Teori/Formül - Genel Üretim Gideri (genel üretim gideri) Sapma Analizi; Tekdüzen Hesap Planı 730 - Genel Üretim Giderleri","dogru":"A","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Standart yükleme oranı 40 TL/makine saati (soruda verilen); Fiili makine saati 1.000 (soruda verilen); Fiili genel üretim gideri 42.000 TL (soruda verilen); Normal kapasite 900 makine saat (soruda verilen)","anlatim":"Soru bize şunları vermiş: standart yükleme oranı 40 TL/makine saati (soruda verilen); fiili çalışma 1.000 makine saati (soruda verilen); fiili genel üretim gideri 42.000 TL (soruda verilen); normal kapasite 900 makine saat (soruda verilen).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Dahil değil: Normal kapasite 900 makine saat (soruda verilen) - bu hesapta kullanılmaz","anlatim":"Yüklenen genel üretim gideri nedir? Fiili çalışılan süreyi standart oranla çarpıp siparişe/döneme yüklenen tutarı buluruz. Dikkat: normal kapasite burada kullanılmaz, o sadece oranın belirlenmesinde kullanılmıştı.","doldur":[]},{"formul":"Yüklenen Genel Üretim Gideri = Fiili Makine Saati × Standart Oran = 1.000 (soruda verilen) × 40 (soruda verilen) = 40.000 TL","anlatim":"Şimdi yüklenen genel üretim gideri\u0027ü hesaplıyoruz. Fiili çalışılan saat ile standart oranı çarpıyoruz.","doldur":[[6,1],[6,2]]},{"formul":"Toplam Sapma = Fiili genel üretim gideri − Yüklenen genel üretim gideri = 42.000 (soruda verilen) − 40.000 (3. adımda bulduk) = 2.000 TL","anlatim":"Toplam sapma nedir? Fiili giderle yüklenen gideri karşılaştırıp aradaki farkı buluruz. Fiili yüklenenden büyükse eksik yükleme vardır.","doldur":[[7,1],[7,2]]},{"formul":"Sonuç: Toplam Genel Üretim Gideri Sapması = 2.000 TL (eksik yükleme)","anlatim":"Sonuç: 2.000 TL eksik yükleme sapması var. Fiili gider yüklenenden fazla çıktığı için işletme az yüklemiş demektir.","doldur":[]},{"formul":"Ters durum: Fiili genel üretim gideri \u003c Yüklenen genel üretim gideri → fazla yükleme sapması","anlatim":"Ters durumda fiili gider yüklenenden az olsaydı ne olurdu? O zaman fazla yükleme sapması çıkardı.","doldur":[]},{"formul":"Yanlış yol: 900 (normal kapasite) × 40 = 36.000 (HATALI) → doğrusu 1.000 × 40 = 40.000 (3. adımda bulduk)","anlatim":"En sık hata: 900 makine saatlik normal kapasiteyi fiili saat yerine kullanıp yanlış yüklenen tutar bulmak. Bu soruda kapasite sadece oranın kaynağıdır, hesaba fiili saat girer.","doldur":[]}],"anahtar":[{"ornek":"yüklenen","kok":"yüklen"},{"ornek":"gideri","kok":"gideri"},{"ornek":"yükleme","kok":"yüklem"},{"ornek":"üretim","kok":"üretim"},{"ornek":"standart","kok":"standa"},{"ornek":"kapasite","kok":"kapasi"}],"konuGiris":{"harita":"Ne zaman test edilir: standart maliyet sistemi kullanan işletmelerde dönem sonu sapma analizinde. Nasıl ölçülür: fiili genel üretim gideri ile standart faaliyet hacmine göre yüklenen genel üretim gideri karşılaştırılarak. Nasıl kaydedilir: 730 hesabın borcundaki fiili tutar ile 731 yansıtma hesabındaki yüklenen tutar karşılaştırılıp fark sapma hesaplarına aktarılır.","desen":"Soru genellikle standart oran, fiili saat, fiili gider ve normal kapasiteyi birlikte verir ve öğrenciyi normal kapasiteyi fiili saat yerine kullanmaya ya da yalnız hacim sapmasını hesaplamaya sürükler. Tuzak, toplam sapmanın fiili genel üretim gideri ile yüklenen genel üretim gideri (standart saat üzerinden hesaplanan) farkı olduğunu unutturmaktır. Bu soru TEORİ/FORMÜL - genel üretim gideri sapmaları noktasından geliyor (p.arşiv, 3 dönem çıkmış).","terimler":[{"kaynak":"soruda verilir","tanim":"Makine saati başına önceden belirlenen sabit genel üretim gideri payı","ad":"Standart yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"İşletmenin ortalama olarak kullanabileceği faaliyet hacmi ölçüsü","ad":"Normal kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Standart faaliyet hacmi ile standart yükleme oranının çarpımından bulunan tutar","ad":"Yüklenen genel üretim gideri","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Fiili genel üretim gideri ile yüklenen genel üretim gideri arasındaki fark, yönü olumlu veya olumsuz olabilir","ad":"Toplam genel üretim gideri sapması","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Standart oran, fiili saat, fiili gider ve normal kapasite verilir; toplam genel üretim gideri sapmasının tutarı ve olumlu/olumsuz yönü istenir.","panel_ornek":"Bir kargo firması, kurye başına aylık sabit 5 paket teslimat bütçeler. Ay sonunda kurye gerçekte 6 paket teslim etmişse, bu fazla teslimat olumlu bir kapasite kullanımı gibi düşünülebilir; eksik kalsaydı atıl kapasite olurdu.","ornek":"Bir kargo firması, kurye başına aylık sabit 5 paket teslimat bütçeler. Ay sonunda kurye gerçekte 6 paket teslim etmişse, bu fazla teslimat olumlu bir kapasite kullanımı gibi düşünülebilir; eksik kalsaydı atıl kapasite olurdu.","yontemler":"Yüklenen genel üretim gideri, fiili faaliyet hacmi ile standart oranın çarpımıyla bulunur, normal kapasite bu hesaba karışmaz. Toplam sapma fiili genel üretim gideri\u0027den yüklenen genel üretim gideri çıkarılarak bulunur; fiili genel üretim gideri büyükse olumsuz, küçükse olumludir.","nedir":"Genel üretim gideri yükleme, üretime doğrudan yansıtılamayan giderlerin standart bir oranla ürünlere dağıtılmasıdır. Sınav, fiili giderle yüklenen giderin farkını yani sapmayı ve yönünü ölçer."},"olay":"Yüklenen genel üretim gideri = 1.000 makine saati x 40 TL = 40.000 TL; Toplam Sapma = 42.000 - 40.000 = 2.000 TL.","tuzak":{"C":{"ad":"Yanlış Hacim Tuzağı","metin":"Yüklenen genel üretim gideri hesaplanırken fiili faaliyet hacmi yerine normal kapasite (900 m/s) kullanıldı (900 x 40 = 36.000), sonra 42.000 - 36.000 = 6.000 bulundu. Doğrusu: Yüklenen genel üretim gideri, fiili (gerçekleşen) faaliyet hacmi üzerinden hesaplanır, normal kapasite bu hesaba girmez."},"E":{"ad":"Kapasite Karıştırma Tuzağı","metin":"Normal kapasite ile fiili faaliyet hacminin birbirine yakın olması sapma olmadığı izlenimi vermiştir; oysa sapma faaliyet hacmi farkından değil, fiili giderin standart tutardan sapmasından doğar. Doğrusu: Fiili genel üretim gideri (42.000 TL) yüklenen genel üretim gideri\u0027den (40.000 TL) farklı olduğu için sapma mevcuttur."},"D":{"ad":"Bileşik Hata Tuzağı","metin":"Hem yanlış hacim (900 m/s) kullanılmış hem de fark ters çıkarılmıştır (36.000 - 42.000 = -6.000, mutlak alınmıştır). Doğrusu: Doğru hacim fiili çalışma saatidir ve doğru fark yönü fiili genel üretim gideri\u0027den yüklenen genel üretim gideri\u0027nin çıkarılmasıyla belirlenir."},"B":{"ad":"Ters Yön Tuzağı","metin":"Fiili genel üretim gideri\u0027den yüklenen genel üretim gideri\u0027yi çıkarıp negatif çıkan sonucu mutlak değerle yazıp yönü ters yorumladın (Yüklenen - Fiili = 40.000 - 42.000 = -2.000, mutlak alıp \u0027fazla yükleme\u0027 dedin). Doğrusu: Fiili genel üretim gideri yüklenenden büyük olduğunda sapma eksik yüklemedir, fazla yükleme değildir."}},"celdiriciYol":{"C":"900 x 40 = 36.000; 42.000 - 36.000 = 6.000 (yanlış hacim kullanma - normal kapasite ile karıştırma)","D":"900 x 40 = 36.000; 36.000 - 42.000 = -6.000, mutlak değer alınıp yön ters yazıldı = 6.000 (bileşik hata: yanlış hacim + ters yön)","B":"40.000 - 42.000 = -2.000, mutlak değer alınıp yön ters yazıldı = 2.000 (ters yön tuzağı)"},"hap":"Yüklenen genel üretim gideri, standart yükleme oranının fiili (gerçekleşen) faaliyet hacmiyle çarpılmasıyla bulunur; toplam sapma fiili giderden yüklenen giderin çıkarılmasıyla belirlenir ve fiili büyükse eksik yüklemedir.","teshis":{"C":{"gercek":"Yüklenen GUG = standart yükleme oranı x fiili (gerçekleşen) faaliyet hacmidir; normal kapasite yalnızca hacim sapmasının bölünmesinde kullanılır.","ayirt":"Bu çarpımda kullandığım saat sayısı, dönemde fiilen çalışılan saat mi yoksa kapasitedeki saat mi?","paragraf":"Teori/Formül - GUG sapma analizi","yanilgi":"Yüklenen GUG\u0027yi hesaplarken hangi hacmin kullanılacağını karıştırıp normal kapasiteyi kullanırsın."},"E":{"gercek":"Sapma, fiili faaliyet hacmi ile normal kapasite farkından değil, fiili giderin yüklenen giderden farklı olmasından doğar.","ayirt":"Sapmayı hacim farkından mı, yoksa gider tutarından mı hesaplıyorum?","paragraf":"Teori/Formül - GUG sapma analizi","yanilgi":"Fiili faaliyet hacminin normal kapasiteye yakın olmasını sapma olmaması olarak yorumlarsın."},"A":{"gercek":"Yüklenen GUG, standart yükleme oranının FİİLİ faaliyet hacmiyle çarpılmasıyla bulunur; normal kapasite yalnızca hacim sapması analizinde referans noktasıdır.","ayirt":"Yükleme hesabında çarptığım saat, gerçekten o dönem çalışılan saat mi?","paragraf":"Teori/Formül - GUG sapma analizi","yanilgi":"Bu şıkkı eleyen öğrenci, yüklenen GUG\u0027yi normal kapasiteyle hesaplaması gerektiğini sanır."},"D":{"gercek":"Doğru hesap fiili hacim ile yapılır ve sapma yönü fiili giderin yüklenenden büyük mü küçük mü olduğuna göre belirlenir.","ayirt":"İki hatayı aynı anda mı yapıyorum: yanlış hacim ve ters yön?","paragraf":"Teori/Formül - GUG sapma analizi","yanilgi":"Hem yanlış hacmi kullanıp hem de farkın yönünü ters çevirerek çifte hata yaparsın."},"B":{"gercek":"Fiili gider yüklenenden fazlaysa üretime yeterince gider yüklenmemiş demektir, bu eksik yüklemedir; fazla yükleme tam tersi durumdur.","ayirt":"Fiili gider mi büyük, yüklenen mi? Büyük olan taraf hangi yönü gösterir?","paragraf":"Teori/Formül - GUG sapma analizi","yanilgi":"Fiili GUG\u0027nin yüklenenden fazla olmasını \u0027işletme lehine, yani fazla yükledi\u0027 diye yorumlarsın."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 61"},"kural":"Brüt satışlardan satış indirimleri (satıştan iadeler) düşülerek net satışlar bulunur; net satışlardan satışların maliyeti düşülünce brüt satış kârı elde edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 61","sonDo rdan düşülerek net satışlar bulunur.","ad":"Satıştan iadeler"},{"deger":"260.000 TL","anlam":"620 hesabında izlenen, net satışlardan düşülerek brüt satış kârını veren maliyet kalemidir.","ad":"Satılan mamuller maliyeti"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı, 6. sınıf hesaplar ve gelir tablosu düzeni","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Brüt satışlar 500.000 TL (soruda verilen); Satıştan iadeler 40.000 TL (soruda verilen); Satılan mamuller maliyeti 260.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: brüt satışlar 500.000 TL, satıştan iadeler 40.000 TL, satılan mamuller maliyeti 260.000 TL. Bunları biz bulmadık, soru verdi.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[6,1]]},{"formul":"Net Satışlar = Brüt Satışlar − Satıştan İadeler = 500.000 (soruda verilen) − 40.000 (soruda verilen) = 460.000","anlatim":"Net satışlar, brüt satıştan satış indirimlerinin çıkarılmasıyla bulunur. İade edilen mal satış sayılmaz, o yüzden düşüyoruz.","doldur":[[5,1]]},{"formul":"Brüt Satış Kârı = Net Satışlar − Satılan Mamuller Maliyeti = 460.000 (2. adımda bulduk) − 260.000 (soruda verilen) = 200.000","anlatim":"Brüt satış kârı, net satıştan malın maliyetinin çıkarılmasıyla bulunur. Bu, gelir tablosunun ilk kâr basamağıdır.","doldur":[[7,1]]},{"formul":"Ters durum: Net Satışlar \u003c Satılan Mamuller Maliyeti → Brüt Satış Zararı","anlatim":"Ters durumda: net satışlar satılan mamuller maliyetinden küçük olsaydı, sonuç brüt satış zararı olurdu.","doldur":[]},{"formul":"Yanlış yol: 500.000 (soruda verilen) − 260.000 (soruda verilen) = 240.000 (HATALI) → doğrusu 200.000 (3. adımda bulduk)","anlatim":"En sık hata: iadeleri düşmeden direkt 500.000\u0027den 260.000\u0027i çıkarmak. Bu yanlış, çünkü brüt satışlar henüz net satış değildir.","doldur":[]}],"anahtar":[{"ornek":"satışlardan","kok":"satışl"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"bulunur","kok":"bulunu"},{"ornek":"satıştan","kok":"satışt"},{"ornek":"iadeler","kok":"iadele"},{"ornek":"düşülerek","kok":"düşüle"}],"konuGiris":{"harita":"Ne zaman test edilir: Gelir tablosu sorularında brüt satış kârı istendiğinde. Nasıl ölçülür: Brüt satışlardan indirimler düşülüp net satış bulunur, sonra satışların maliyeti çıkarılır. Nasıl kaydedilir: Sonuç gelir tablosunda \u0027brüt satış kârı veya zararı\u0027 satırına yazılır.","desen":"Sınav genelde brüt satış kârını doğrudan brüt satışlardan hesaplatma tuzağı kurar, oysa önce net satış bulunmalıdır. İkinci tuzak, faaliyet giderlerinin yanlışlıkla satışların maliyetine eklenmesidir. Bu soru brüt satış kârı hesaplama sırası noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Dönem içinde gerçekleşen toplam satış tutarı, indirim öncesi.","ad":"Brüt satışlar","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Müşterinin geri gönderdiği mallar nedeniyle satıştan düşülen tutar.","ad":"Satıştan iadeler","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Brüt satışlardan iade ve indirimler düşüldükten sonra kalan tutar.","ad":"Net satışlar","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Net satışlardan satışların maliyeti düşüldükten sonra kalan kâr.","ad":"Brüt satış kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Brüt satışlar, satıştan iadeler ve satılan mamuller maliyeti verilip brüt satış kârı istenir.","panel_ornek":"Diyelim ki 90 TL\u0027ye aldığın bir kitabı arkadaşına 150 TL\u0027ye sattın ama o kitapta küçük bir yırtık olduğu için 10 TL indirim yaptın. Yani eline gerçekte geçen para 140 TL, kitaba verdiğin 90 TL\u0027yi düşünce kârın 50 TL olur. Önce indirimi düş, sonra maliyeti çıkar; sırayı karıştırırsan kâr yanlış çıkar.","ornek":"Diyelim ki 90 TL\u0027ye aldığın bir kitabı arkadaşına 150 TL\u0027ye sattın ama o kitapta küçük bir yırtık olduğu için 10 TL indirim yaptın. Yani eline gerçekte geçen para 140 TL, kitaba verdiğin 90 TL\u0027yi düşünce kârın 50 TL olur. Önce indirimi düş, sonra maliyeti çıkar; sırayı karıştırırsan kâr yanlış çıkar.","yontemler":"Önce brüt satışlardan iadeleri düşerek net satışı bul, sonra net satıştan satışların maliyetini çıkar.","nedir":"Satışların maliyeti tablosu, bir işletmenin dönem içinde sattığı ürün ya da hizmetlerin maliyetini gösterir. Sınav bu tablodan net satışların ve brüt satış kârının doğru sırayla hesaplanıp hesaplanamadığını ölçer."},"olay":"Net satışlar = 500.000 - 40.000 = 460.000; Brüt satış kârı = 460.000 - 260.000 = 200.000.","tuzak":{"C":{"ad":"Basamak Atlama Tuzağı","metin":"Brüt satışlardan doğrudan satılan mamuller maliyetini düşüp net satışlar aşamasını hiç kurmadın. Doğrusu: Önce satıştan iadeler düşülerek net satışlar bulunmalı, brüt satış kârı 200.000 TL\u0027dir."},"E":{"ad":"Ters İşlem Tuzağı","metin":"Satışların maliyetini net satışlardan çıkarmak yerine üzerine eklendin. Doğrusu: Satışların maliyeti net satışlardan düşülür, brüt satış kârı 200.000 TL\u0027dir."},"D":{"ad":"Kavram Karıştırma Tuzağı","metin":"Net satışlar tutarını brüt satış kârı sandın, satışların maliyetini hiç düşmedin. Doğrusu: Net satışlardan satılan mamuller maliyeti de düşülmeli, sonuç 200.000 TL\u0027dir."},"A":{"ad":"Çifte İndirim Tuzağı","metin":"Satıştan iadeleri hem net satış hesabında hem de maliyetten düşerek iki kez indirdin. Doğrusu: İadeler yalnız net satışlar bulunurken bir kez düşülür, brüt satış kârı 200.000 TL\u0027dir."}},"celdiriciYol":{"C":"500.000 - 260.000 = 240.000 (net satışlar aşamasını atlayıp doğrudan brüt satışlardan maliyeti düştün)","E":"460.000 + 260.000 = 720.000 (satışların maliyetini çıkarmak yerine topladın)","D":"500.000 - 40.000 = 460.000 (net satışları brüt satış kârı sandın, maliyeti hiç düşmedin)","A":"460.000 - 260.000 - 40.000 = 160.000 (iadeyi ikinci kez maliyetten düştün)"},"hap":"Brüt satış kârı, BRÜT satışlardan değil NET satışlardan satışların maliyeti düşülerek bulunur.","teshis":{"C":{"gercek":"Brüt satış kârı yalnızca net satışlar üzerinden h
