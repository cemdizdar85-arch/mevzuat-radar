i süre − Standart süre = 32.000 (soruda verilen) − 30.000 (2. adımda bulduk) = 2.000 saat","anlatim":"Süre farkı, fiili sürenin standart süreden ne kadar fazla olduğunu gösterir. Fiili saat standardı geçince bu fark işletme için olumsuz sayılır.","doldur":[[9,1]]},{"formul":"Direkt İşçilik Süre Farkı = Süre farkı × Standart saat ücreti = 2.000 (3. adımda bulduk) × 20 (soruda verilen) = 40.000 TL","anlatim":"Şimdi bu saat farkını paraya çeviriyoruz, çünkü fark sadece saat cinsinden bir anlam ifade etmiyor. Standart saat ücretiyle çarparak tutarı buluyoruz.","doldur":[[11,1]]},{"formul":"Sonuç: Direkt İşçilik Süre Farkı = 40.000 TL (olumsuz)","anlatim":"Sonuç: direkt işçilik süre farkı 40.000 TL ve olumsuzdur. Olumsuz çünkü fiili süre standardı aşmış, işçilik daha fazla harcanmış.","doldur":[]},{"formul":"Ters durum: Fiili süre \u003c Standart süre → fark olumlu","anlatim":"Ters durumda: fiili süre standardın altında kalsaydı fark olumlu olurdu. Yani işçilik zamanında tasarruf edilmiş sayılırdı.","doldur":[]},{"formul":"Yanlış yol: 672.000 − (30.000 × 20) = 72.000 (HATALI) → doğrusu 2.000 × 20 = 40.000 (4. adımda bulduk)","anlatim":"En sık hata: 672.000 TL gerçekleşen gideri kullanıp fiili ücretle standart ücreti karşılaştırmaya çalışmaktır. Süre farkında sadece saat farkı ve standart ücret kullanılır, fiili ücretin hiç önemi yoktur.","doldur":[]}],"anahtar":[{"ornek":"standart","kok":"standa"},{"ornek":"ücreti","kok":"ücreti"},{"ornek":"olumsuzdur","kok":"olumsu"},{"ornek":"gerçekleşen","kok":"gerçek"},{"ornek":"farkın","kok":"farkın"},{"ornek":"işçilik","kok":"işçili"}],"konuGiris":{"harita":"Ne zaman test edilir: standart maliyet sistemi uygulanan işletmelerde fiili üretim gerçekleştiğinde. Nasıl ölçülür: fiili saat ile standart saat arasındaki fark standart saat ücretiyle çarpılarak bulunur. Nasıl kaydedilir: olumsuz fark 723 hesabın borcuna, olumlu fark alacağına yazılır.","desen":"Sınav genellikle standart saat, fiili saat ve standart ücreti verip süre farkını sordurur; tuzak, öğrencinin standart ücret yerine fiili ücreti kullanmasıdır. Bazı sorularda toplam üretim miktarı verilip standart toplam saat önce hesaplattırılır. Bu soru Tekdüzen Hesap Planı 723 hesap tanımı ve süre sapması formülü noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Bir birim ürün için önceden öngörülen işçilik süresi","ad":"Standart saat","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Üretimde gerçekte harcanan toplam direkt işçilik süresi","ad":"Fiili saat","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Bir işçilik saati için önceden belirlenmiş birim ücret","ad":"Standart saat ücreti","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Fiili ve standart saat farkının standart ücretle çarpımı sonucu tutar","ad":"Süre (zaman) farkı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Standart saat, standart ücret, fiili saat ve toplam üretim miktarı verilerek direkt işçilik süre farkının TL tutarı istenir.","panel_ornek":"Bir terzi bir gömlek için 2 saat öngörür ama fiilen 3 saat harcar; saat ücreti 50 TL\u0027dir. Fazladan harcanan 1 saat x 50 TL = 50 TL\u0027lik olumsuz fark oluşur, bu tamamen işçinin yavaşlığından kaynaklanır.","ornek":"Bir terzi bir gömlek için 2 saat öngörür ama fiilen 3 saat harcar; saat ücreti 50 TL\u0027dir. Fazladan harcanan 1 saat x 50 TL = 50 TL\u0027lik olumsuz fark oluşur, bu tamamen işçinin yavaşlığından kaynaklanır.","yontemler":"Önce standart toplam saat (üretim adedi x birim standart saat) hesaplanır, sonra fark standart ücretle çarpılır; fiili ücret bu hesaba karışmaz.","nedir":"Direkt işçilik süre farkı, işçilerin standartta öngörülen süreden ne kadar sapmayla çalıştığını parasal olarak gösterir. Sınav, fiili ve standart saat arasındaki farkın standart ücretle çarpılmasını ölçer."},"olay":"standart süre 5.000x6=30.000 saat, fark 32.000-30.000=2.000 saat, 2.000x20=40.000 TL.","tuzak":{"D":{"ad":"Toplam Sapmayı Süre Farkı Sanma ve Yön Ters Çevirme Tuzağı","metin":"Fiili işçilik gideri ile standart maliyeti (672.000-600.000=72.000) çıkarıp bunu süre farkı sayar, üstüne yönü de olumlu yazarsın. Doğrusu: bu tutar toplam sapmadır, süre farkı değildir ve zaten fiili\u003estandart olduğundan olumsuzdur."},"E":{"ad":"Toplam Sapmayı Süre Farkı Sanma Tuzağı","metin":"Fiili işçilik giderinden standart maliyeti çıkararak bulduğun 72.000, ücret sapması ile süre farkının toplamıdır; tek başına süre farkı değildir. Doğrusu: süre farkını izole etmek için yalnız saat farkı standart ücretle çarpılır."},"A":{"ad":"Ücret Sapmasını Süre Farkı Sanma Tuzağı","metin":"Fiili saat ücretini (21 TL) standart saat ücretinden çıkarıp fiili saatle çarparak bulduğun 32.000\u0027i süre farkı sanır, üstüne yönü de ters çevirirsin. Doğrusu: süre farkı standart ücretle hesaplanır ve fiili süre standarttan büyük olduğu için sonuç olumsuzdur."},"B":{"ad":"Kapsam Karıştırma Tuzağı","metin":"(Fiili ücret - standart ücret) x fiili saat işlemiyle aslında ücret sapmasını bulmuşsun, bunu süre farkı sanmışsın. Doğrusu: istenen büyüklük süre farkıdır, ücret sapması değildir."}},"celdiriciYol":{"D":"672.000-600.000 = 72.000 (toplam sapmayı süre farkı sanıp yönünü tersine çevirdin)","E":"672.000-600.000 = 72.000 (istenen süre farkı yerine toplam sapmayı hesapladın)","A":"(21-20) x 32.000 = 32.000 (ücret sapmasını süre farkı sanıp yönünü tersine çevirdin)","B":"(21-20) x 32.000 = 32.000 (istenen süre farkı yerine ücret sapmasını hesapladın)"},"hap":"Süre (zaman) sapması = (fiili saat - standart saat) x standart saat ücreti; fiili saat standardı aşarsa sonuç olumsuzdur.","teshis":{"C":{"gercek":"Süre sapması = (fiili saat-standart saat) x standart saat ücreti; fiili\u003estandart olduğunda sonuç olumsuzdur (THP 723).","ayirt":"Çarpanım standart ücret mi, fiili saatle standart saat farkını mı aldım?","paragraf":"THP 723","yanilgi":"Süre farkının fiili saat üzerinden değil standart saat ücreti üzerinden hesaplanabileceğini gözden kaçırıyorsun."},"E":{"gercek":"Süre farkını izole etmek için yalnız saat farkı standart ücretle çarpılır; toplam sapma ücret ve süre bileşenlerinin toplamıdır.","ayirt":"İstenen tek bileşen mi yoksa toplam sapma mı?","paragraf":"THP 723","yanilgi":"Toplam sapmayı doğru yönle bulup bunu doğrudan süre farkı sanıyorsun."},"A":{"gercek":"Süre sapması = (fiili saat - standart saat) x standart saat ücreti; çarpan fiili saat değil standart ücrettir.","ayirt":"Bu işlemde çarpan olarak hangi ücreti kullandım, standardı mı fiiliyi mi?","paragraf":"THP 723","yanilgi":"Ücret sapmasının formülünü süre farkı zannediyorsun ve yönü de rastgele belirliyorsun."},"D":{"gercek":"Toplam sapma = fiili işçilik maliyeti - standart işçilik maliyeti; bu, ücret ve süre sapmalarının toplamıdır, tek başına süre farkı değildir.","ayirt":"Bu tutar iki sapmanın toplamı mı, yoksa sadece birinin sonucu mu?","paragraf":"THP 723","yanilgi":"Toplam sapmayı hesaplayıp bunu süre farkı sanıyor, yönünü de gelişigüzel belirliyorsun."},"B":{"gercek":"Ücret sapması = (fiili ücret - standart ücret) x fiili saat; süre sapması ayrı bir formüldür ve standart ücretle çarpılır.","ayirt":"Bulduğum sapma hangi değişkenin farkını ölçüyor, saat mi ücret mi?","paragraf":"THP 723","yanilgi":"Ücret sapmasını doğru hesaplayıp bunu süre farkıyla karıştırıyorsun."}},"verilen":[[8,1],[10,1],[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 61"},"kural":"hacim sapması, fiili faaliyet için bütçelenen (normal kapasite x oran) sabit genel üretim gideri ile yüklenen (fiili faaliyet x oran) sabit genel üretim gideri arasındaki farktır; fiili faaliyet normal kapasitenin altındaysa sapma olumsuzdur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 61","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce bütçelenen sabit genel üretim gideri\u0027u (normal kapasite x oran), sonra yükleneni (fiili faaliyet x oran) hesapla; farkın yönünü fiili faaliyetin normal kapasiteye göre konumuna bakarak belirle.","konu":"7-a seçeneği genel üretim gideri","tablo":{"satirlar":[["VERİLENLER","-","-"],["Normal kapasite","10.000 makine saati","-"],["Standart sabit GUG yükleme oranı","5 TL","-"],["Fiili faaliyet hacmi","8.000 makine saati","-"],["HESAP","-","-"],["Bütçelenen Sabit Genel Üretim Gideri","10.000 x 5","50.000"],["Yüklenen Genel Üretim Gideri","8.000 x 5","40.000"],["Hacim (Kapasite) Sapması","50.000 - 40.000 (olumsuz)","10.000"]],"basliklar":["Kalem","Hesaplama","Tutar (TL)"]},"siklar":{"C":"40.000 olumlu","E":"50.000 olumsuz","A":"10.000 olumlu","D":"40.000 olumsuz","B":"10.000 olumsuz"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,2],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Kalem","Hesaplama","Tutar (TL)"],"satirlar":[["Bütçelenen Sabit Genel Üretim Gideri","12.000 x 6","72.000"],["Yüklenen Genel Üretim Gideri","15.000 x 6","90.000"],["Hacim (Kapasite) Sapması","72.000 - 90.000 (olumlu)","18.000"]]},"tur":"tablo","soru":"Bir işletmede normal kapasite 12.000 makine saati olup standart sabit genel üretim gideri yükleme oranı makine saati başına 6 TL\u0027dir. 2026 yılında fiili faaliyet hacmi 15.000 makine saat olarak gerçekleşmiştir. Buna göre hacim (kapasite) sapması kaç TL\u0027dir ve yönü nedir?","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve Hacim (Kapasite) Sapması\u0027nın tutarının ve yönünün ne olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir işletmede normal kapasite 10.000 makine saati olup standart sabit genel üretim gideri yükleme oranı makine saati başına 5 TL\u0027dir. 2026 yılında fiili faaliyet hacmi 8.000 makine saat olarak gerçekleşmiştir. Buna göre hacim (kapasite) sapması kaç TL\u0027dir ve yönü nedir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-37","verilenler":[{"deger":"10.000 makine saati","anlam":"Bütçelenen sabit genel üretim giderini bulmak için standart oranla çarpılan taban büyüklüktür.","ad":"Normal kapasite"},{"deger":"5 TL","anlam":"Hem bütçelenen hem yüklenen tutarı hesaplamak için kullanılan birim orandır.","ad":"Standart sabit GUG yükleme oranı"},{"deger":"8.000 makine saati","anlam":"Yüklenen genel üretim giderini bulmak için standart oranla çarpılan gerçekleşen faaliyet ölçüsüdür.","ad":"Fiili faaliyet hacmi"}],"dayanak":"Tekdüzen Hesap Planı 730 Genel Üretim Giderleri; Maliyet muhasebesi teorisi - hacim (kapasite) sapması formülü","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Normal kapasite 10.000 makine saati (soruda verilen); Standart sabit genel üretim gideri yükleme oranı 5 TL/makine saati (soruda verilen); Fiili faaliyet hacmi 8.000 makine saat (soruda verilen)","anlatim":"Soru bize şunları vermiş: normal kapasite, standart yükleme oranı ve fiili faaliyet hacmi. Bunlarla hacim sapmasını biz hesaplayacağız.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Bütçelenen Sabit Genel Üretim Gideri = Normal Kapasite × Yükleme Oranı = 10.000 (soruda verilen) × 5 (soruda verilen) = 50.000 TL","anlatim":"Bütçelenen sabit genel üretim gideri, normal kapasitenin parasal karşılığıdır. Fabrika hiç durmasa ne kadar gider planlanırdı, onu gösterir.","doldur":[[5,1],[5,2]]},{"formul":"Yüklenen Genel Üretim Gideri = Fiili Faaliyet Hacmi × Yükleme Oranı = 8.000 (soruda verilen) × 5 (soruda verilen) = 40.000 TL","anlatim":"Yüklenen sabit genel üretim gideri, gerçekte üretilen miktara göre yansıtılan tutardır. Fiili çalışma normalin altında kaldığı için bu tutar düşük çıkar.","doldur":[[6,1],[6,2]]},{"formul":"Hacim (Kapasite) Sapması = Bütçelenen Sabit Genel Üretim Gideri - Yüklenen Genel Üretim Gideri = 50.000 (2. adımda bulduk) - 40.000 (3. adımda bulduk) = 10.000 TL","anlatim":"Hacim sapması, bütçelenenle yüklenen arasındaki farktır. Fiili hacim normal kapasitenin altında kaldığı için sapma olumsuzdur.","doldur":[[7,1],[7,2]]},{"formul":"Ters durum: fiili faaliyet hacmi normal kapasiteyi aşsaydı → hacim sapması olumlu","anlatim":"Ters durumda mantık tersine döner. Fiili hacim normali aşsaydı, fazladan kapasite kullanılmış sayılır ve sapma olumlu çıkar.","doldur":[]},{"formul":"Yanlış yol: 50.000 + 40.000 = 90.000 (HATALI) → doğrusu 50.000 - 40.000 = 10.000 (4. adımda bulduk)","anlatim":"En sık hata iki tutarı toplamaktır. Sapma bir fark işlemidir, toplama değil - bütçelenenden yüklenen çıkarılır.","doldur":[]}],"anahtar":[{"ornek":"normal","kok":"normal"},{"ornek":"kapasitenin","kok":"kapasi"},{"ornek":"gideri","kok":"gideri"},{"ornek":"üretim","kok":"üretim"},{"ornek":"yüklenen","kok":"yüklen"},{"ornek":"bütçelenen","kok":"bütçel"}],"konuGiris":{"harita":"Ne zaman test edilir: fiili faaliyet hacmi normal kapasiteden farklı gerçekleştiğinde test edilir. Nasıl ölçülür: (normal kapasite - fiili faaliyet hacmi) x standart sabit yükleme oranı ile ölçülür. Nasıl kaydedilir: sonuç TL tutarı ve olumsuz/olumlu yön olarak belirtilir, ayrı bir hesaba kaydedilmez.","desen":"Sınav genellikle normal kapasite ile fiili hacmi verip sapmayı ve yönünü sorar; tuzak, sapmanın israf değil kapasite kullanım göstergesi olduğunu unutup harcama sapmasıyla karıştırmaktır. Bazı öğrenciler fiili hacmin altında kalınca yanlışlıkla olumlu yön yazar, oysa altında kalmak olumsuz sapma demektir. Bu soru TEORİ/genel üretim gideri sapmaları - hacim sapması yorumu noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşletmenin planlanan ortalama üretim düzeyi, standart faaliyet ölçüsü","ad":"Normal kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Makine saati başına düşen sabit genel üretim gideri tutarı","ad":"Standart yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Dönemde gerçekten kullanılan makine saati miktarı","ad":"Fiili faaliyet hacmi","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Normal kapasite ile fiili hacim farkının standart oranla çarpımı","ad":"Hacim (kapasite) sapması","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Normal kapasite, standart yükleme oranı ve fiili faaliyet hacmi verilir; hacim sapmasının tutarı ve yönü istenir.","panel_ornek":"Bir yurt mutfağı günde 200 kişilik yemek çıkarmaya göre kurulmuş ama o gün sadece 150 kişi yemek yemiş. Sabit giderler (kira, personel) yine de 200 kişilik plana göre hesaplanmıştı, yani 50 kişilik kapasite boşta kalmış. Ha, bu demek: kapasitenin altında kalınca sabit gider yeterince \u0027kullanılmamış\u0027 sayılıyor.","ornek":"Bir yurt mutfağı günde 200 kişilik yemek çıkarmaya göre kurulmuş ama o gün sadece 150 kişi yemek yemiş. Sabit giderler (kira, personel) yine de 200 kişilik plana göre hesaplanmıştı, yani 50 kişilik kapasite boşta kalmış. Ha, bu demek: kapasitenin altında kalınca sabit gider yeterince \u0027kullanılmamış\u0027 sayılıyor.","yontemler":"Tek yöntem: (Normal kapasite - Fiili hacim) x Standart oran hesaplanır; fiili hacim kapasitenin altındaysa sonuç olumsuz, üstündeyse olumlu yorumlanır.","nedir":"Hacim (kapasite) sapması, sabit genel üretim giderlerinin normal kapasiteye göre yeterince yüklenip yüklenmediğini gösterir. Sınav, fiili faaliyetin normal kapasitenin altında mı üstünde mi kaldığını ve bunun TL tutarını ölçer."},"olay":"Bütçelenen = 10.000 x 5 = 50.000; Yüklenen = 8.000 x 5 = 40.000; Sapma = 50.000 - 40.000 = 10.000.","tuzak":{"C":{"ad":"Yüklenen Tutarı Sapma Sanma Tuzağı","metin":"Yüklenen genel üretim giderinin kendisini (8.000 saat x 5 TL) sapma tutarı sanır ve yönünü olumlu okursun. Doğrusu: sapma bütçelenenle yüklenen arasındaki farktır, yüklenenin kendisi değildir."},"E":{"ad":"Bütçelenen Tutarı Sapma Sanma Tuzağı","metin":"Bütçelenen sabit genel üretim giderinin tamamını (10.000 saat x 5 TL) sapma tutarı sanırsın. Doğrusu: bu tutar sapma değil, yüklenenle karşılaştırılacak bütçelenen tutardır."},"D":{"ad":"Yüklenen Tutarı Sapma Sanma Tuzağı","metin":"Aynı şekilde yüklenen tutarı (40.000) sapma sanıp bu kez yönünü olumsuz okursun. Doğrusu: sapma 50.000 ile 40.000\u0027in farkı olan 10.000 TL\u0027dir."},"A":{"ad":"Yön Tersine Çevirme Tuzağı","metin":"Sapma tutarını doğru bulup fiili faaliyet normal kapasitenin altında kaldığı halde yönü olumlu sanırsın. Doğrusu: fiili faaliyet normal kapasitenin altında kaldığı için sapma olumsuzdur."}},"celdiriciYol":{"C":"Yüklenen GUG = 8.000 x 5 = 40.000 (yüklenen tutar sapma sanılmış, yön olumlu)","E":"Bütçelenen sabit GUG = 10.000 x 5 = 50.000 (bütçelenen tutarın tamamı sapma sanılmış)","D":"Yüklenen GUG = 8.000 x 5 = 40.000 (yüklenen tutar sapma sanılmış, yön olumsuz)","A":"Bütçelenen sabit GUG (10.000 x 5) - Yüklenen GUG (8.000 x 5) = 50.000 - 40.000 = 10.000 (yön ters yorumlanmış, olumlu sanılmış)"},"hap":"Hacim sapması, bütçelenen sabit genel üretim gideri ile yüklenen sabit genel üretim gideri arasındaki farktır; fiili faaliyet normal kapasitenin altında kalırsa sapma olumsuzdur.","teshis":{"C":{"gercek":"Yüklenen tutar sadece sapma hesabının bir bileşenidir; sapma bütçelenenden yüklenenin çıkarılmasıyla bulunur.","ayirt":"Bulduğum tutar bir fark mı yoksa tek bir çarpımın sonucu mu?","paragraf":"Teori-GUG sapmaları","yanilgi":"Yüklenen genel üretim giderinin (fiili faaliyet x oran) doğrudan sapma tutarı olduğunu sanıyorsun."},"E":{"gercek":"Bütçelenen tutar sapmanın yalnızca bir tarafıdır; sapma bütçelenenden yüklenenin çıkarılmasıyla bulunur.","ayirt":"Bu tutar tek bir kapasite x oran çarpımı mı, yoksa iki çarpımın farkı mı?","paragraf":"Teori-GUG sapmaları","yanilgi":"Bütçelenen sabit genel üretim giderinin tamamını sapma tutarı sanıyorsun."},"A":{"gercek":"Hacim sapması sabit giderlerden doğar; fiili faaliyet normal kapasitenin altında kalırsa atıl kapasite oluşur ve bu olumsuz (aleyhte) bir sapmadır.","ayirt":"Fiili faaliyet normal kapasitenin üstünde mi altında mı kaldı, hangi yönde sapma bu duruma karşılık gelir?","paragraf":"Teori-GUG sapmaları","yanilgi":"Sapma tutarını doğru bulduğunu ama fiili faaliyet düşük olduğu için bunun işletme lehine (olumlu) olduğunu düşünüyorsun."},"D":{"gercek":"40.000 TL yüklenen tutardır, sapma değildir; sapma bütçelenen 50.000 ile yüklenen 40.000 arasındaki 10.000 TL\u0027lik farktır.","ayirt":"Bu sayı bir çarpım mı yoksa iki çarpımın farkı mı?","paragraf":"Teori-GUG sapmaları","yanilgi":"Yüklenen tutarı sapma sanıp bu kez yönünü de ters (olumsuz) okuyorsun."},"B":{"gercek":"Hacim sapması yalnız sabit giderlerden doğar ve bütçelenen sabit GUG ile yüklenen sabit GUG arasındaki farktır; kapasite kullanımını ölçer, israfı değil.","ayirt":"Fark hangi iki tutar arasında alınıyor: bütçelenen mi yüklenen mi, yoksa fiili mi?","paragraf":"Teori-GUG sapmaları","yanilgi":"Bu şıkkı elemeye çalışan öğrenci, hacim sapmasının \u0027kapasite kullanımı\u0027 değil bir israf göstergesi olduğunu sanıp farklı bir formül arar."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 62"},"kural":"Eşdeğer birim, ürün miktarı ile teknik katsayının çarpımıdır; toplam birleşik gider toplam eşdeğer birime bölünerek birim maliyet bulunur, sonra her ürünün eşdeğer birimiyle çarpılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 62","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Katsayı verilen sorularda önce her ürünün eşdeğer birimini (miktar x katsayı) yaz, toplamı böl, sonra çarp - katsayıyı atlarsan fiziksel ölçü yöntemine düşersin.","konu":"birleşik ürün katsayı yöntemi","tablo":{"satirlar":[["VERİLENLER","-"],["Birleşik gider toplamı","160.000 TL"],["K ürünü miktar ve katsayısı","700 adet, katsayı 1"],["L ürünü miktar ve katsayısı","300 adet, katsayı 3"],["HESAP","-"],["K ürünü eşdeğer birimi (700 x 1)","700"],["L ürünü eşdeğer birimi (300 x 3)","900"],["Toplam eşdeğer birim (700+900)","1.600"],["Eşdeğer birim maliyeti (160.000/1.600)","100"],["L ürünü birleşik gider payı (900 x 100)","90.000"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"90.000","E":"144.000","A":"48.000","D":"120.000","B":"70.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["M ürünü eşdeğer birimi (500 x 2)","1.000"],["N ürünü eşdeğer birimi (800 x 1)","800"],["Toplam eşdeğer birim (1.000+800)","1.800"],["Eşdeğer birim maliyeti (225.000/1.800)","125"],["M ürünü birleşik gider payı (1.000 x 125)","125.000"]]},"tur":"tablo","soru":"Bir işletmede aynı üretim sürecinden M ve N adlı iki ortak ürün elde edilmektedir. Ayrışma noktasına kadar oluşan birleşik gider toplamı 225.000 TL\u0027dir. M ürününden 500 adet (katsayı 2), N ürününden 800 adet (katsayı 1) üretilmiştir. İşletme birleşik gideri katsayılı bölme yöntemiyle dağıttığına göre M ürününün birleşik gider payı kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve M ürününün birleşik gider payının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir işletmede aynı üretim sürecinden K ve L adlı iki ortak ürün elde edilmektedir. Ayrışma noktasına kadar oluşan birleşik gider toplamı 160.000 TL\u0027dir. K ürününden 700 adet (katsayı 1), L ürününden 300 adet (katsayı 3) üretilmiştir. İşletme birleşik gideri katsayılı bölme yöntemiyle dağıttığına göre L ürününün birleşik gider payı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-38","verilenler":[{"deger":"160.000 TL","anlam":"Ayrışma noktasına kadar oluşan ve K ile L ürünlerine dağıtılacak toplam ortak maliyettir.","ad":"Birleşik gider toplamı"},{"deger":"700 adet, katsayı 1","anlam":"K ürününün eşdeğer birimini bulmak için miktarla çarpılacak teknik katsayıdır.","ad":"K ürünü miktar ve katsayısı"},{"deger":"300 adet, katsayı 3","anlam":"L ürününün eşdeğer birimini bulmak için miktarla çarpılacak teknik katsayıdır.","ad":"L ürünü miktar ve katsayısı"}],"dayanak":"Teori Notu - birleşik maliyette katsayılı bölme yöntemi (birleşik maliyet muhasebesi literatürünün yerleşik çerçevesi)","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Birleşik gider toplamı 160.000 TL (soruda verilen); K miktarı 700 adet, katsayısı 1 (soruda verilen); L miktarı 300 adet, katsayısı 3 (soruda verilen)","anlatim":"Soru bize şunları vermiş: birleşik gider toplamı 160.000 TL, K ürünü 700 adet ve katsayısı 1, L ürünü 300 adet ve katsayısı 3. Bu sayıları biz bulmadık, soru verdi.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"K eşdeğer birimi = miktar × katsayı = 700 (soruda verilen) × 1 (soruda verilen) = 700","anlatim":"Eşdeğer birim nedir? Katsayılı bölme yönteminde ürünü direkt adetle değil, adet çarpı katsayıyla ölçeriz. Katsayı ürünün maliyeti ne kadar çektiğini gösterir.","doldur":[[5,1]]},{"formul":"L eşdeğer birimi = miktar × katsayı = 300 (soruda verilen) × 3 (soruda verilen) = 900","anlatim":"Şimdi L için aynı işlemi yapıyoruz. L\u0027nin katsayısı 3 olduğu için birim başına daha çok maliyet payı alacak.","doldur":[[6,1]]},{"formul":"Toplam eşdeğer birim = K eşdeğer birimi + L eşdeğer birimi = 700 (2. adımda bulduk) + 900 (3. adımda bulduk) = 1.600","anlatim":"İki ürünün eşdeğer birimlerini topluyoruz, çünkü ortak maliyeti bu toplam üzerinden dağıtacağız. Toplam olmadan birim maliyet bulunmaz.","doldur":[[7,1]]},{"formul":"Eşdeğer birim maliyeti = Birleşik gider toplamı / Toplam eşdeğer birim = 160.000 (soruda verilen) / 1.600 (4. adımda bulduk) = 100","anlatim":"Eşdeğer birim maliyeti, bir eşdeğer birime düşen ortak gider payıdır. Bunu bulmadan hiçbir ürüne pay veremeyiz.","doldur":[[8,1]]},{"formul":"L ürünü birleşik gider payı = L eşdeğer birimi × Eşdeğer birim maliyeti = 900 (3. adımda bulduk) × 100 (5. adımda bulduk) = 90.000 TL","anlatim":"L\u0027nin payını bulmak için kendi eşdeğer birimini birim maliyetle çarpıyoruz. Böylece L\u0027nin gerçekten hak ettiği maliyet ortaya çıkar.","doldur":[[9,1]]},{"formul":"Yanlış yol: 300 (soruda verilen) / 1.000 × 160.000 (soruda verilen) = 48.000 (HATALI) → doğrusu 90.000 (6. adımda bulduk)","anlatim":"En sık hata: L\u0027nin adedini katsayısız kullanıp 300/1.000 × 160.000 = 48.000 sanmak. Katsayı unutulunca eşdeğer birim yanlış çıkar, sonuç da yanlış olur.","doldur":[]}],"anahtar":[{"ornek":"katsayılı","kok":"katsay"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"maliyet","kok":"maliye"},{"ornek":"ürünün","kok":"ürünün"},{"ornek":"miktar","kok":"miktar"},{"ornek":"birleşik","kok":"birleş"}],"konuGiris":{"harita":"Ne zaman test edilir: birden fazla ortak ürün aynı süreçten çıkıp maliyet paylaşımı istendiğinde. Nasıl ölçülür: her ürünün miktarı katsayıyla çarpılıp eşdeğer birim bulunur, toplam gider toplam eşdeğer birime bölünüp birim maliyet çıkarılır. Nasıl kaydedilir: her ürünün eşdeğer birimi bu birim maliyetle çarpılarak o ürünün payı belirlenir.","desen":"Sınav genellikle katsayılı yöntemi fiziksel ölçü veya satış değeri yöntemiyle karıştırtacak şekilde sorar, öğrenci katsayıyı miktarla çarpmayı unutabilir. Tuzak, doğrudan miktar oranı kullanarak katsayıyı görmezden gelmektir. Bu soru eşdeğer birim hesaplama noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Ayrışma noktasına kadar oluşan, ürünlere doğrudan izlenemeyen ortak gider tutarı","ad":"Birleşik maliyet","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Ürüne teknik/fiziksel ölçüte göre verilen ağırlıklandırma sayısı","ad":"Katsayı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Ürün miktarı ile katsayının çarpımından oluşan düzeltilmiş miktar","ad":"Eşdeğer birim","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Toplam birleşik maliyetin toplam eşdeğer birime bölünmesiyle bulunan tutar","ad":"Birim maliyet","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Toplam birleşik gider ile ürünlerin miktar ve katsayıları verilir, bir ürünün gider payı istenir.","panel_ornek":"Bir pastanede aynı hamurdan küçük ve büyük poğaça yapılıyor; büyük poğaça küçüğün 2 katı hamur kullanıyor. 10 küçük (katsayı 1) ve 5 büyük (katsayı 2) poğaça için toplam 200 TL hamur gideri, eşdeğer birime göre paylaştırılır: küçük 10x1=10, büyük 5x2=10, toplam 20 birim, birim başı 10 TL; her iki gruba da 100\u0027er TL düşer.","ornek":"Bir pastanede aynı hamurdan küçük ve büyük poğaça yapılıyor; büyük poğaça küçüğün 2 katı hamur kullanıyor. 10 küçük (katsayı 1) ve 5 büyük (katsayı 2) poğaça için toplam 200 TL hamur gideri, eşdeğer birime göre paylaştırılır: küçük 10x1=10, büyük 5x2=10, toplam 20 birim, birim başı 10 TL; her iki gruba da 100\u0027er TL düşer.","yontemler":"Tek yöntem: her ürünün miktarı katsayıyla çarpılıp eşdeğer birim bulunur, toplam gider bu eşdeğer birimler toplamına bölünüp birim maliyet çıkarılır, sonra ilgili ürünün eşdeğer birimiyle çarpılır.","nedir":"Birleşik ürün katsayı yöntemi, ayrışma noktasına kadar oluşan ortak maliyeti ürünlere teknik bir katsayıya göre paylaştırır. Sınav bu paylaşımın doğru hesaplanıp hesaplanamadığını ölçer."},"olay":"K eşdeğer birimi=700x1=700, L eşdeğer birimi=300x3=900, toplam=1.600; birim maliyet=160.000/1.600=100; L payı=900x100=90.000.","tuzak":{"D":{"ad":"Miktar İhmali Tuzağı","metin":"Eşdeğer birim hesaplamadan doğrudan katsayı toplamına (1+3=4) göre oranladın, ürün miktarlarını hiç dikkate almadın. Doğrusu: Pay hesaplanırken katsayı tek başına değil, miktarla çarpılmış eşdeğer birim kullanılır."},"E":{"ad":"Toplam Eşdeğer Birim Hatası Tuzağı","metin":"Toplam eşdeğer birimi katsayısız miktar toplamı (700+300=1.000) üzerinden hesapladın. Doğrusu: Toplam eşdeğer birim, her ürünün kendi miktar x katsayı değerlerinin toplamı olan 1.600\u0027dür."},"A":{"ad":"Fiziksel Ölçü Tuzağı","metin":"Katsayıyı hiç hesaba katmadan yalnızca miktar oranıyla dağıtım yaptın, bu katsayılı yöntem değil fiziksel ölçü yöntemidir. Doğrusu: Katsayılı yöntemde pay, miktar değil eşdeğer birim (miktar x katsayı) esas alınarak bulunur."},"B":{"ad":"Yer Değiştirme Tuzağı","metin":"L ürününün payını hesaplarken aslında K ürününün payını (700 eşdeğer birim x 100) yazdın. Doğrusu: L ürününün eşdeğer birimi 900 olduğundan payı 90.000 TL\u0027dir."}},"celdiriciYol":{"D":"160.000 x (3/4) = 120.000 (miktarı hesaba katmadan yalnız katsayı oranı kullanma)","E":"900/1.000 x 160.000 = 144.000 (toplam eşdeğer birimi katsayısız miktar toplamı ile hesaplama)","A":"300/(700+300) x 160.000 = 48.000 (katsayısız fiziksel ölçü oranı kullanma)","B":"700 x 100 = 70.000 (K ürününün payını L payı sanma)"},"hap":"Katsayılı bölme yönteminde dağıtım anahtarı miktar değil, miktar ile teknik katsayının çarpımından oluşan eşdeğer birimdir.","teshis":{"C":{"gercek":"Eşdeğer birim = miktar x katsayı; toplam gider toplam eşdeğer birime bölünüp her ürünün eşdeğer birimiyle çarpılarak pay bulunur.","ayirt":"Miktar ile katsayıyı çarpıp eşdeğer birimi buldum mu?","paragraf":"Teori Notu - katsayılı bölme yöntemi","yanilgi":"Bu şıkkı eleyen öğrenci genelde eşdeğer birim adımını atlayıp doğrudan miktar veya katsayı oranını kullanmıştır."},"E":{"gercek":"Toplam eşdeğer birim, her ürünün kendi miktar x katsayı değerlerinin toplamıdır, katsayısız miktar toplamı değildir.","ayirt":"Toplamı alırken her ürünün miktarını kendi katsayısıyla çarptım mı?","paragraf":"Teori Notu - katsayılı bölme yöntemi","yanilgi":"Toplam eşdeğer birimi bulurken katsayıyı unutup yalnızca miktarları topladığını fark etmiyorsun."},"A":{"gercek":"Katsayılı bölme yönteminde dağıtım anahtarı miktar değil, miktar ile teknik katsayının çarpımı olan eşdeğer birimdir.","ayirt":"Katsayıyı hesaplamama dahil ettim mi?","paragraf":"Teori Notu - katsayılı bölme yöntemi","yanilgi":"Katsayı verilse de dağıtımın gerçekte miktar oranına göre yapıldığını sanıyorsun."},"D":{"gercek":"Katsayı yalnız ağırlıklandırma faktörüdür; gerçek dağıtım anahtarı miktarla çarpılmış eşdeğer birimdir.","ayirt":"Miktarı hiç kullanmadan mı katsayı oranı kurdum?","paragraf":"Teori Notu - katsayılı bölme yöntemi","yanilgi":"Katsayının tek başına dağıtım oranı olduğunu, miktarın önemsiz olduğunu düşünüyorsun."},"B":{"gercek":"Her ürünün payı kendi eşdeğer birimiyle (miktar x katsayı) çarpılan birim maliyetten bulunur; L ürününün eşdeğer birimi 900\u0027dür.","ayirt":"Bu tutarı hangi ürünün eşdeğer birimiyle hesapladım?","paragraf":"Teori Notu - katsayılı bölme yöntemi","yanilgi":"İki ürünün eşdeğer birim ve pay tutarlarını karıştırıp yanlış ürüne yazdığını fark etmiyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 62"},"kural":"Ağırlıklı ortalama yöntemde eşdeğer birim, tamamlanan birimlerle dönem sonu yarı mamulün tamamlanma derecesiyle çarpılmış tutarının toplanmasıyla bulunur ve toplam dönüşüm maliyeti bu eşdeğer birime bölünür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 62","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce eşdeğer birimi bul, sonra maliyeti buna böl; tamamlanma yüzdesini atlarsan sonuç yanlış büyür.","konu":"eşdeğer birim maliyeti","tablo":{"satirlar":[["VERİLENLER","-"],["Tamamlanan mamul miktarı","1.000 birim"],["Dönem sonu yarı mamul miktarı","500 birim"],["Tamamlanma derecesi","%40"],["Toplam dönüşüm maliyeti","48.000 TL"],["HESAP","-"],["Dönem sonu yarı mamul eşdeğer birimi (500x0,40)","200"],["Toplam eşdeğer birim (1.000+200)","1.200"],["Dönüşüm maliyeti eşdeğer birim maliyeti (48.000/1.200)","40"]],"basliklar":["Kalem","Tutar/Miktar"]},"siklar":{"C":"48","E":"96","A":"32","D":"60","B":"40"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar/Miktar"],"satirlar":[["Dönem sonu yarı mamul eşdeğer birimi (400x0,50)","200"],["Toplam eşdeğer birim (800+200)","1.000"],["Dönüşüm maliyeti eşdeğer birim maliyeti (60.000/1.000)","60"]]},"tur":"tablo","soru":"Tek safhada üretim yapan ve ağırlıklı ortalama maliyet yöntemini kullanan bir işletmede dönem içinde 800 birim mamulün üretimi tamamlanmıştır. Dönem sonunda kalan 400 birim yarı mamulün dönüşüm maliyeti açısından tamamlanma derecesi %50\u0027dir. Döneme ait toplam dönüşüm maliyeti 60.000 TL olduğuna göre, dönüşüm maliyeti eşdeğer birim maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve dönüşüm maliyeti eşdeğer birim maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Tek safhada üretim yapan ve ağırlıklı ortalama maliyet yöntemini kullanan bir işletmede dönem içinde 1.000 birim mamulün üretimi tamamlanmıştır. Dönem sonunda kalan 500 birim yarı mamulün dönüşüm maliyeti (direkt işçilik ve genel üretim gideri) açısından tamamlanma derecesi %40\u0027tır. Döneme ait toplam dönüşüm maliyeti 48.000 TL olduğuna göre, dönüşüm maliyeti eşdeğer birim maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-44","verilenler":[{"deger":"1.000 birim","anlam":"Dönem içinde üretimi bitip bir sonraki sürece aktarılan mamul miktarıdır; eşdeğer birime tam (%100) olarak dahil edilir.","ad":"Tamamlanan mamul miktarı"},{"deger":"500 birim","anlam":"Dönem sonunda henüz tamamlanmamış birimlerdir; eşdeğer birime tamamlanma derecesiyle çarpılarak dahil edilir.","ad":"Dönem sonu yarı mamul miktarı"},{"deger":"%40","anlam":"Dönem sonu yarı mamulün dönüşüm maliyeti açısından ne kadarının tamamlandığını gösterir; eşdeğer birim hesabında çarpan olarak kullanılır.","ad":"Tamamlanma derecesi"},{"deger":"48.000 TL","anlam":"Direkt işçilik ve genel üretim giderleri toplamıdır; eşdeğer birim maliyetini bulmak için toplam eşdeğer birime bölünür.","ad":"Toplam dönüşüm maliyeti"}],"dayanak":"Teori Notu - safha maliyetinde eşdeğer ürün birimleri","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Tamamlanan mamul 1.000 birim (soruda verilen); Dönem sonu yarı mamul 500 birim (soruda verilen); Tamamlanma derecesi %40 (soruda verilen); Toplam dönüşüm maliyeti 48.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: tamamlanan mamul 1.000 birim, dönem sonu yarı mamul 500 birim, tamamlanma derecesi %40, toplam dönüşüm maliyeti 48.000 TL.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Dönem sonu yarı mamul eşdeğer birimi = Miktar × Tamamlanma derecesi = 500 (soruda verilen) × %40 (soruda verilen) = 200","anlatim":"Ağırlıklı ortalama yöntemde yarı mamul tam sayılmaz, sadece tamamlanma derecesi kadarı eşdeğer birime girer. Burada dönüşüm maliyeti açısından yarı mamulün sadece %40\u0027ı bitmiş sayılıyor.","doldur":[[6,1]]},{"formul":"Toplam eşdeğer birim = Tamamlanan mamul + Yarı mamul eşdeğeri = 1.000 (soruda verilen) + 200 (1. adımda bulduk) = 1.200","anlatim":"Şimdi toplam eşdeğer birimi buluyoruz - tamamlanan mamul zaten tam eşdeğer, yarı mamulün payını da ekliyoruz. Bu toplam, maliyeti bölmemiz gereken paydayı verir.","doldur":[[7,1]]},{"formul":"Dönüşüm maliyeti eşdeğer birim maliyeti = Toplam dönüşüm maliyeti / Toplam eşdeğer birim = 48.000 (soruda verilen) / 1.200 (2. adımda bulduk) = 40 TL","anlatim":"Birim maliyeti bulmak için toplam dönüşüm maliyetini toplam eşdeğer birime bölüyoruz. Bu bölüm bize bir birime düşen dönüşüm maliyetini verir.","doldur":[[8,1]]},{"formul":"Sağlama = Birim maliyet × Toplam eşdeğer birim = 40 (3. adımda bulduk) × 1.200 (2. adımda bulduk) = 48.000 TL ✓","anlatim":"Sağlama olarak birim maliyeti eşdeğer birimle çarpıyoruz, toplam dönüşüm maliyetine geri dönmeli. Bu bize hesabın doğru olduğunu gösterir.","doldur":[]},{"formul":"Yanlış yol: Toplam eşdeğer birim = 1.000 + 500 = 1.500; 48.000 / 1.500 = 32 TL (HATALI) → doğrusu 40 TL (3. adımda bulduk)","anlatim":"En sık hata: yarı mamulü tamamlanma derecesiyle çarpmadan direkt 500 birim olarak toplama eklemek. Bu yanlış çünkü yarı mamul henüz tam bitmemiş, sadece %40\u0027ı sayılır.","doldur":[]}],"anahtar":[{"ornek":"maliyet","kok":"maliye"},{"ornek":"tamamlanan","kok":"tamaml"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"dönüşüm","kok":"dönüşü"},{"ornek":"derecesi","kok":"derece"},{"ornek":"birime","kok":"birime"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda tamamlanan ve yarı mamul birimler birlikte değerlenirken test edilir. Nasıl ölçülür: tamamlanan birim + dönem sonu yarı mamul x tamamlanma yüzdesi formülüyle ölçülür. Nasıl kaydedilir: toplam dönüşüm maliyeti bulunan eşdeğer birime bölünerek birim maliyet olarak kaydedilir.","desen":"Sınav genelde tamamlanan birime yarı mamulü tamamlanma yüzdesiyle çarpıp eklemeyi, sonra toplam maliyeti bu toplama bölmeyi ister. Tuzak nokta, öğrencinin yarı mamul birimini tamamlanma yüzdesiyle çarpmadan direkt toplam birime eklemesidir. Bu soru safha maliyetinde eşdeğer ürün birimleri notundaki temel formül noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Tamamlanan ve yarı mamul birimlerin ortak ölçüde birleştirilmiş toplam sayısı","ad":"Eşdeğer birim","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Yarı mamulün dönüşüm maliyeti açısından ne kadar tamamlandığını gösteren yüzde","ad":"Tamamlanma derecesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Direkt işçilik ile genel üretim giderlerinin toplamından oluşan maliyet","ad":"Dönüşüm maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Dönem başı ve dönem içi maliyetleri harmanlayarak tek birim maliyet hesaplayan yöntem","ad":"Ağırlıklı ortalama yöntemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Toplam dönüşüm maliyeti ve yarı mamulün tamamlanma derecesi verilir, eşdeğer birim maliyeti istenir.","panel_ornek":"Bir spor salonuna üye oldun, dönem sonunda 10 aylık üyeliğin var ama antrenman programının sadece %30\u0027unu tamamladın; kalan kısım hâlâ yarı bitmiş sayılır. İşte üretimdeki yarı mamul de tam bitmemiş bu üyelik gibi, tamamlanma yüzdesiyle ölçülür.","ornek":"Bir spor salonuna üye oldun, dönem sonunda 10 aylık üyeliğin var ama antrenman programının sadece %30\u0027unu tamamladın; kalan kısım hâlâ yarı bitmiş sayılır. İşte üretimdeki yarı mamul de tam bitmemiş bu üyelik gibi, tamamlanma yüzdesiyle ölçülür.","yontemler":"Ağırlıklı ortalama yöntemde eşdeğer birim tek seferde tamamlanan + dönem sonu yarı mamul x tamamlanma yüzdesi olarak hesaplanır; ilk giren ilk çıkar (FIFO)\u0027dan farklı olarak dönem başı maliyet ayrılmaz.","nedir":"Eşdeğer birim maliyeti, safha maliyet sisteminde tamamlanan ve yarı mamul birimlerin ortak bir ölçüde birleştirilip birim maliyete ulaşılmasını sağlar. Sınav, tamamlanma derecesine göre eşdeğer birim sayısını doğru bulup bulmadığını ölçer."},"olay":"Dönem sonu yarı mamul eşdeğeri 500x0,40=200; toplam eşdeğer birim 1.000+200=1.200; birim maliyet 48.000/1.200=40.","tuzak":{"C":{"ad":"Dışlama Tuzağı","metin":"Dönem sonu yarı mamulü eşdeğer birime hiç dahil etmeyip toplam maliyeti yalnızca 1.000 tamamlanan birime böler. Doğrusu: yarı mamul de %40 oranında eşdeğer birime katılmalı, sonuç 40 TL\u0027dir."},"E":{"ad":"Unutma Tuzağı","metin":"Tamamlanan mamulü eşdeğer birime hiç katmayıp yalnızca dönem sonu yarı mamul miktarını (500) esas alarak böler. Doğrusu: tamamlanan birimler tam eşdeğer sayılıp toplama eklenir, sonuç 40 TL\u0027dir."},"D":{"ad":"İşaret Tuzağı","metin":"Dönem sonu yarı mamul eşdeğerini toplama eklemek yerine tamamlanan birimden çıkarıp 1.000-200=800 eşdeğer birim kullanır. Doğrusu: yarı mamul eşdeğeri toplama eklenir, çıkarılmaz; sonuç 40 TL\u0027dir."},"A":{"ad":"Tam Sayma Tuzağı","metin":"Dönem sonu yarı mamulü tamamlanma derecesini uygulamadan tam birim gibi sayıp 1.000+500=1.500 eşdeğer birime böler. Doğrusu: yarı mamul yalnızca %40\u0027ı kadar eşdeğer birim olarak sayılır, sonuç 40 TL\u0027dir."}},"celdiriciYol":{"C":"48.000 / 1.000 = 48 (dönem sonu yarı mamulü eşdeğer birime hiç dahil etmedi)","E":"48.000 / 500 = 96 (tamamlanan mamulü eşdeğer birime hiç katmadı)","D":"1.000 - (500x0,40) = 800; 48.000 / 800 = 60 (dönem sonu yarı mamul eşdeğerini toplamdan çıkardı, işaret hatası)","A":"1.000 + 500 = 1.500; 48.000 / 1.500 = 32 (tamamlanma derecesini uygulamadan dönem sonu yarı mamulü tam birim saydı)"},"hap":"Eşdeğer birim = tamamlanan birim + dönem sonu yarı mamul x tamamlanma derecesi; birim maliyet bu toplama bölünür.","teshis":{"C":{"gercek":"Yarı mamul, tamamlanma oranınca dönüşüm maliyetine ortaktır; tamamen dışlanamaz.","ayirt":"Yarı mamul hiç mi maliyet payı almadı?","paragraf":"Teori Notu - safha maliyetinde eşdeğer ürün birimleri","yanilgi":"Yarı mamulün henüz tamamlanmadığı için hiç maliyete ortak olmaması gerektiğini düşünürsün."},"E":{"gercek":"Tamamlanan birimler her zaman %100 eşdeğer sayılır ve toplam eşdeğer birime mutlaka eklenir.","ayirt":"Tamamlanan mamulü eşdeğer birime kattım mı?","paragraf":"Teori Notu - safha maliyetinde eşdeğer ürün birimleri","yanilgi":"Sadece dönem sonu yarı mamule bakıp tamamlanan mamulün de eşdeğer birime dahil edilmesi gerektiğini unutursun."},"A":{"gercek":"Safha maliyet sisteminde tamamlanmamış birimler yalnızca tamamlanma derecesi oranında eşdeğer birime dahil edilir.","ayirt":"Bu birimler gerçekten tam mı bitti, yoksa kısmi mi tamamlandı?","paragraf":"Teori Notu - safha maliyetinde eşdeğer ürün birimleri","yanilgi":"Dönem sonu yarı mamulün de tamamlanan birim gibi tam sayılması gerektiğini düşünürsün."},"D":{"gercek":"Eşdeğer b /2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Kullanılan hammaddenin kaynağı","Dönem başı stok (2.000 kg) + alışın 3.000 kg\u0027lık kısmı (ilk giren ilk çıkar (ilk giren ilk çıkar (FIFO)))"],["Kullanılan hammadde maliyeti (2.000x50 + 3.000x70)","310.000"]]},"tur":"tablo","soru":"Bir tekstil üretim işletmesi, K hammaddesi stoklarını ilk giren ilk çıkar (ilk giren ilk çıkar (FIFO)) yöntemiyle değerlemektedir. Dönem başında stokta 2.000 kg hammadde bulunmakta olup birim maliyeti 50 TL\u0027dir. Dönem içinde 8.000 kg hammadde birim 70 TL\u0027den satın alınmıştır. Dönem sonunda stokta 5.000 kg hammadde kaldığına göre, dönem içinde kullanılan hammaddenin maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve dönem içinde kullanılan hammaddenin maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir mobilya üretim işletmesi, M hammaddesi stoklarını ilk giren ilk çıkar (FIFO) yöntemiyle değerlemektedir. Dönem başında stokta 3.000 kg hammadde bulunmakta olup birim maliyeti 40 TL\u0027dir. Dönem içinde 7.000 kg hammadde birim 60 TL\u0027den satın alınmıştır. Dönem sonunda stokta 4.000 kg hammadde kaldığına göre, dönem sonu stok maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-46","verilenler":[{"deger":"3.000 kg, birim maliyet 40 TL","anlam":"İlk alınan (en eski) partinin miktarı ve birim fiyatı; ilk giren ilk çıkar yönteminde bu parti önce tüketilir.","ad":"Dönem başı stok"},{"deger":"7.000 kg, birim maliyet 60 TL","anlam":"Son satın alınan parti; dönem sonu stok bu partiden karşılanır.","ad":"Dönem içi alış"},{"deger":"4.000 kg","anlam":"Kaç kg stoğun kaldığı; son alış miktarından küçük olduğundan tamamı son partiden hesaplanır.","ad":"Dönem sonu stok miktarı"}],"dayanak":"TMS 2 (Stoklar) p.27","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Dönem başı stok 3.000 kg × 40 TL/kg (soruda verilen); Dönem içi alış 7.000 kg × 60 TL/kg (soruda verilen); Dönem sonu stok miktarı 4.000 kg (soruda verilen)","anlatim":"Soru bize şunları vermiş: dönem başı stok 3.000 kg, birim maliyeti 40 TL; dönem içi alış 7.000 kg, birim 60 TL; dönem sonu stok 4.000 kg.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"TMS 2 p.27: ilk giren ilk çıkar yönteminde dönem sonu stok = en son alınan partiler","anlatim":"ilk giren ilk çıkar (FIFO) nedir? İlk giren ilk çıkar demek - önce eski mal satılır, depoda hep en yeni mal kalır. Dikkat: dönem sonu stok bu yüzden son alınan partiden oluşur.","doldur":[]},{"formul":"Dönem sonu stokun kaynağı = son alış partisi, çünkü 4.000 kg (soruda verilen) \u003c 7.000 kg (soruda verilen)","anlatim":"Dönem sonu stok 4.000 kg, son alış partisi 7.000 kg - stok miktarı bu partiden küçük. O yüzden dönem sonu stokun tamamı bu son partiden karşılanır.","doldur":[[5,1]]},{"formul":"Dönem sonu stok maliyeti = Miktar × Birim Fiyat = 4.000 kg (soruda verilen) × 60 TL (soruda verilen) = 240.000 TL","anlatim":"Şimdi biz hesaplıyoruz: dönem sonu stok miktarını son alış birim fiyatıyla çarpıyoruz. Çünkü ilk giren ilk çıkar yönteminde kalan mal hep son alınandır.","doldur":[[6,1]]},{"formul":"Sağlama: 3.000 kg (soruda verilen) + 7.000 kg (soruda verilen) − 4.000 kg (soruda verilen) = 6.000 kg satılan","anlatim":"Sağlama: toplam 10.000 kg\u0027ın 6.000 kg\u0027ı satılmış sayılır (3.000 dönem başı + 3.000 alıştan). Kalan 4.000 kg tamamı son alıştan geldiği için tutarlı.","doldur":[]},{"formul":"Yanlış yol: 4.000 kg × 40 TL = 160.000 TL (HATALI) → doğrusu 240.000 TL (4. adımda bulduk)","anlatim":"En sık hata: dönem başı stoğun 40 TL\u0027lik birim fiyatını dönem sonu stoğa karıştırmak. ilk giren ilk çıkar yönteminde dönem sonunda kalan mal en eski değil en yeni partidir.","doldur":[]}],"anahtar":[{"ornek":"partiden","kok":"partid"},{"ornek":"alınan","kok":"alınan"},{"ornek":"yönteminde","kok":"yöntem"},{"ornek":"sonunda","kok":"sonund"},{"ornek":"oluşur","kok":"oluşur"},{"ornek":"fiyatıyla","kok":"fiyatı"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem başı stok ile dönem içi alışlar farklı fiyatlarla verildiğinde. Nasıl ölçülür: dönem sonu stok miktarı en son yapılan alışlardan geriye doğru fiyatlandırılarak. Nasıl kaydedilir: kalan miktar en yeni birim fiyatlarla çarpılıp toplam stok maliyeti bulunur.","desen":"Soru genelde dönem başı stok ile bir veya iki alım fiyatını verip dönem sonu kalan miktarı sorar; tuzak, öğrencinin kalanı en eski (ucuz) fiyattan hesaplamasıdır. ilk giren ilk çıkar yönteminde kalan stok her zaman en son alımlardan başlanarak fiyatlandırılır, en eski parti önce tükenir. Bu soru TMS 2 p.27 maliyet hesaplama yöntemleri noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"ilk alınan mal ilk satılır, kalan stok en son alımlardan oluşur","ad":"ilk giren ilk çıkar (FIFO) varsayımı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"her alım grubunun kendi satın alma fiyatı","ad":"Birim maliyet","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"dönem sonunda elde kalan toplam kg veya adet","ad":"Dönem sonu stok miktarı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"kalan miktarın en son alım fiyatlarından hesaplanan toplam tutarı","ad":"Dönem sonu stok maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Dönem başı stok ve dönem içi alışların miktar/birim fiyatları ile dönem sonu kalan miktar verilir, dönem sonu stok maliyeti istenir.","panel_ornek":"Kırtasiyeci önce 10 tane defteri 5 TL\u0027den, sonra 20 tane defteri 8 TL\u0027den almış. ilk giren ilk çıkar yönteminde göre önce ucuz olanlar satılmış sayılır, rafta kalanlar hep pahalı olan son alım fiyatından değerlenir. Yani elde kalan defterler 8 TL\u0027den hesaplanır.","ornek":"Kırtasiyeci önce 10 tane defteri 5 TL\u0027den, sonra 20 tane defteri 8 TL\u0027den almış. ilk giren ilk çıkar yönteminde göre önce ucuz olanlar satılmış sayılır, rafta kalanlar hep pahalı olan son alım fiyatından değerlenir. Yani elde kalan defterler 8 TL\u0027den hesaplanır.","yontemler":"Kalan miktar en son alım grubundan geriye doğru fiyatlandırılır; eğer kalan miktar son alımdan fazlaysa bir önceki alım grubuna geçilerek tamamlanır.","nedir":"ilk giren ilk çıkar (FIFO), stoktaki malların maliyetini ilk giren ilk çıkar mantığıyla hesaplama yöntemidir. Sınav, dönem sonunda stokta kalanların hangi alışa ait fiyatla değerleneceğini ölçer."},"olay":"Dönem sonu stok miktarı (4.000 kg), son alış partisinin miktarından (7.000 kg) küçük olduğundan tamamı bu partiden karşılanır: 4.000 x 60 = 240.000.","tuzak":{"C":{"ad":"Yöntem Karıştırma Tuzağı","metin":"ilk giren ilk çıkar (FIFO) yerine ağırlıklı ortalama maliyet yöntemini uygulayıp tüm stok tutarını toplam miktara bölüyorsun. Doğrusu: Soru ilk giren ilk çıkar (FIFO) istemektedir, ortalama maliyet bu yöntemde kullanılmaz."},"E":{"ad":"Kapsam Karıştırma Tuzağı","metin":"Dönem sonu stok maliyeti yerine dönem içinde tüketilen/satılan malın maliyetini hesaplıyorsun. Doğrusu: Soru kalan stoku sormaktadır, tüketilen miktarın maliyeti farklı bir hesaptır."},"A":{"ad":"Ters Sıra Tuzağı","metin":"ilk giren ilk çıkar yönteminde kalan stokun ilk alınan partiden oluştuğunu sanıp 4.000 kg\u0027ı dönem başı birim fiyatıyla (40 TL) çarpıyorsun. Doğrusu: ilk giren ilk çıkar yönteminde dönem sonunda kalan stok en son alınan partiden oluşur."},"B":{"ad":"Karma Bölüştürme Tuzağı","metin":"Dönem sonu stok miktarını önce dönem başı partisinden, artanı son alıştan tamamlayarak paylaştırıyorsun. Doğrusu: Dönem sonu miktarı son alış miktarından küçükse, kalan stokun tamamı son partiden karşılanır."}},"celdiriciYol":{"C":"(3.000 x 40 + 7.000 x 60) / 10.000 = 54; 4.000 x 54 = 216.000 (ağırlıklı ortalama yöntemini ilk giren ilk çıkar (FIFO) ile karıştırma)","E":"3.000 x 40 + 3.000 x 60  çıkar (ilk giren ilk çıkar (FIFO)) Eşdeğer Ürün Birimi (Toplam)","150+950+240","1.340"]]},"tur":"tablo","soru":"Tek tip mamul üreten bir işletmede safha (evre) maliyet sisteminde İlk Giren İlk Çıkar yöntemi uygulanmaktadır. Dönem başı yarı mamul 250 birim olup dönüşüm maliyetleri (direkt işçilik ve genel üretim gideri) açısından tamamlanma derecesi %40\u0027tır. Dönem içinde tamamlanarak sonraki safhaya aktarılan birim sayısı 1.200 birimdir. Dönem sonu yarı mamul 400 birim olup dönüşüm maliyetleri açısından tamamlanma derecesi %60\u0027tır. Buna göre İlk Giren İlk Çıkar yöntemine göre dönüşüm maliyetleri açısından eşdeğer ürün birimi kaç birimdir?","verilen":[],"hedef":"Tabloyu doldur ve ilk giren ilk çıkar (FIFO) yöntemine göre dönüşüm maliyetleri açısından toplam eşdeğer ürün biriminin kaç olduğunu bul","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Tek tip mamul üreten bir işletmede safha (evre) maliyet sisteminde İlk Giren İlk Çıkar yöntemi uygulanmaktadır. Dönem başı yarı mamul 200 birim olup dönüşüm maliyetleri (direkt işçilik ve genel üretim gideri) açısından tamamlanma derecesi %30\u0027dur. Dönem içinde tamamlanarak sonraki safhaya aktarılan birim sayısı 1.000 birimdir. Dönem sonu yarı mamul 300 birim olup dönüşüm maliyetleri açısından tamamlanma derecesi %50\u0027dir. Buna göre İlk Giren İlk Çıkar yöntemine göre dönüşüm maliyetleri açısından eşdeğer ürün birimi kaç birimdir?","kayitBaslik":"","id":"sgs-t1-maliyet-kolay/kp-47","verilenler":[{"deger":"200 birim, %30 tamamlanma","anlam":"Önceki dönemden devreden, bu dönem tamamlanacak yarı mamul miktarı ve önceki tamamlanma derecesi; ilk giren ilk çıkar yönteminde yalnız kalan pay (1-0,30) sayılır.","ad":"Dönem başı yarı mamul"},{"deger":"1.000 birim","anlam":"Bu dönem tamamlanıp sonraki safhaya aktarılan toplam birim; dönem başı yarı mamul çıkarılarak dönem içi başlayıp bitirilen bulunur.","ad":"Tamamlanan birim"},{"deger":"300 birim, %50 tamamlanma","anlam":"Dönem sonunda tamamlanmamış kalan birim ve tamamlanma derecesi; eşdeğer birime yalnız tamamlanma payı kadar girer.","ad":"Dönem sonu yarı mamul"}],"dayanak":"Teori Notu - safha maliyet sisteminde eşdeğer ürün birimi, FIFO tanımı (213 sayılı Vergi Usul Kanununun 275 inci maddesi kapsamında imalat maliyeti unsurlarının dağıtımı)","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Dönem başı yarı mamul 200 birim (soruda verilen); tamamlanma derecesi %30 (soruda verilen); tamamlanıp aktarılan 1.000 birim (soruda verilen); dönem sonu yarı mamul 300 birim (soruda verilen); tamamlanma derecesi %50 (soruda verilen)","anlatim":"Soru bize şunları vermiş: dönem başı 200 birim, tamamlanma %30; aktarılan 1.000 birim; dönem sonu 300 birim, tamamlanma %50. Bunları biz bulmadık, soru verdi.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"ilk giren ilk çıkar (FIFO) Eşdeğer Birim = bu dönem tamamlanan pay + başlanıp bitirilen + dönem sonu stok payı","anlatim":"ilk giren ilk çıkar yönteminde eşdeğer birim, bu dönem harcanan çabayı gösterir. Dönem başı stokun geçen dönemden gelen kısmı bu döneme sayılmaz, sadece tamamlama payı sayılır.","doldur":[]},{"formul":"Dönem başı yarı mamul ek çalışma payı = 200 (soruda verilen) × (1 − %30 (soruda verilen)) = 140","anlatim":"Dönem başı stok zaten %30 tamamlanmıştı, geri kalan kısmı bu dönem tamamladık. Sadece kalan kısmı sayıyoruz, tamamını değil.","doldur":[[5,1],[5,2]]},{"formul":"Başlanıp bitirilen = 1.000 (soruda verilen) − 200 (soruda verilen) = 800","anlatim":"Bu dönem hem başlanıp hem bitirilen birimler tam olarak bu dönemin işi. Toplam aktarılandan dönem başı stoku çıkarınca bunu buluyoruz.","doldur":[[6,1],[6,2]]},{"formul":"Dönem sonu yarı mamul payı = 300 (soruda verilen) × %50 (soruda verilen) = 150","anlatim":"Dönem sonu stok henüz bitmedi, sadece %50\u0027si tamamlanmış. O yüzden tamamını değil, tamamlanma oranı kadarını sayıyoruz.","doldur":[[7,1],[7,2]]},{"formul":"ilk giren ilk çıkar (FIFO) Eşdeğer Ürün Birimi = 140 (3. adımda bulduk) + 800 (4. adımda bulduk) + 150 (5. adımda bulduk) = 1.090","anlatim":"Şimdi üç parçayı topluyoruz, çünkü ilk giren ilk çıkar (FIFO) eşdeğer birim bu üç payın toplamıdır. Bu dönem harcanan toplam dönüşüm çabasını gösterir.","doldur":[[8,1],[8,2]]},{"formul":"Yanlış yol: 200 + 800 + 300 = 1.300 (HATALI) → doğrusu 1.090 (6. adımda bulduk)","anlatim":"En sık hata: dönem başı ve dönem sonu stokları tamamlanma oranıyla çarpmadan direkt toplamaktır. ilk giren ilk çıkar yönteminde eksik tamamlanan stoklar tam sayılmaz, oranla çarpılır.","doldur":[]}],"anahtar":[{"ornek":"tamamlanması","kok":"tamaml"},{"ornek":"yönteminde","kok":"yöntem"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"sadece","kok":"sadece"},{"ornek":"sayıyoruz","kok":"sayıyo"},{"ornek":"bitirilen","kok":"bitiri"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem başı ve dönem sonu yarı mamul kaldığında dönüşüm maliyeti payı hesaplanırken test edilir. Nasıl ölçülür: ilk giren ilk çıkar yönteminde dönem başı yarı mamul\u0027yi tamamlamak için gereken ek pay ile dönem sonu yarı mamul\u0027nin tamamlanma payı ayrı ayrı toplanarak ölçülür. Nasıl kaydedilir: hesaplanan eşdeğer birim sayısı, birim maliyetin bulunmasında paydada kullanılır.","desen":"Bu soruda tuzak, dönem başı yarı mamul\u0027nin tamamlanma derecesini ilk giren ilk çıkar (FIFO) formülünde yanlışlıkla doğrudan çarpmaktır; oysa ilk giren ilk çıkar (FIFO) sadece tamamlamak için gereken ek payı (1-yüzde) sayar. Diğer tuzak, tamamlanan birimden dönem başı yarı mamul\u0027yi düşmeden dönem içi başlayıp bitenleri bulmayı atlamaktır. Bu soru ilk giren ilk çıkar (FIFO) esdeğer birim formülünün doğru kurulması noktasından geliyor (Teori Notu p.1).","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Tamamlanan ve yarı mamul birimlerin ortak ölçüde birleştirilmiş toplam çalışma karşılığı","ad":"Eşdeğer ürün birimi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Bir birimin dönüşüm maliyeti açısından ne kadarının bittiğini gösteren yüzde","ad":"Tamamlanma derecesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Yalnız dönem içi harcanan eforu sayan, dönem başı yarı mamul\u0027yi ayrı tutan hesaplama biçimi","ad":"ilk giren ilk çıkar (FIFO) esdeğer birim","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Dönem bitiminde henüz tamamlanmamış, kısmen işlenmiş birim miktarı","ad":"Dönem sonu yarı mamul","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Dönem başı/sonu yarı mamul miktarları ve tamamlanma dereceleri verilip ilk giren ilk çıkar (FIFO) yöntemine göre dönüşüm maliyeti eşdeğer birimi istenir.","panel_ornek":"Bir bisiklet parkurunu koşarken bugüne kadar 40 türün 25\u0027ini tamamladın, yani ilerlemen yüzde 60\u0027lık bir orana denk geliyor. Kalan 15 tür için harcayacağın efor da aynı mantıkla hesaba katılır, tam tür sayılmaz.","ornek":"Bir bisiklet parkurunu koşarken bugüne kadar 40 türün 25\u0027ini tamamladın, yani ilerlemen yüzde 60\u0027lık bir orana denk geliyor. Kalan 15 tür için harcayacağın efor da aynı mantıkla hesaba katılır, tam tür sayılmaz.","yontemler":"ilk giren ilk çıkar yönteminde eşdeğer birim = dönem başı yarı mamul\u0027yi tamamlamak için gereken ek pay + dönem içi başlayıp biten birimler + dönem sonu yarı mamul\u0027nin tamamlanma payı şeklinde üç parça ayrı toplanır; dönem başı yarı mamul\u0027nin önceki maliyeti bu hesaba karıştırılmaz.","nedir":"Eşdeğer birim tamamlanma derecesi, safha maliyet sisteminde yarı mamullerin ne kadarının tamamlandığını gösteren yüzdedir. Sınav bu yüzdenin dönüşüm maliyeti hesabına nasıl yansıdığını ölçer."},"olay":"","tuzak":{"D":{"ad":"Yöntem Karıştırma Tuzağı","metin":"Ortalama (weighted average) yöntemin formülünü uyguladın; dönem başı yarı mamulü tamamlanan birimlerin içinde tam saydın, ayrı bir ek çalışma hesaplamadın. Doğrusu: İlk Giren İlk Çıkar yönteminde dönem başı yarı mamul ayrı işlem görür, ortalama yöntemle karıştırılmaz."},"E":{"ad":"Tamamlanma Yüzdesi Unutma Tuzağı","metin":"Dönem sonu yarı mamulü %50 tamamlanma derecesiyle değil tam birim (300) olarak eşdeğer birime kattın. Doğrusu: Dönem sonu yarı mamul yalnız tamamlanma derecesine karşılık gelen payı kadar eşdeğer birime girer."},"A":{"ad":"Ne soruluyor","metin":"İlk Giren İlk Çıkar yönteminde dönüşüm maliyetleri açısından eşdeğer ürün birimi soruluyor. Eksik Kapsam Tuzağı: Dönem başı yarı mamulü tamamlamak için harcanan emeği hiç hesaba katmadın, sadece dönem içi başlayıp bitirilenle dönem sonu yarı mamul payını topladın. Doğrusu: Dönem başı yarı mamulün tamamlanması için gereken ek çalışma da eşdeğer birime dahil edilmelidir."},"B":{"ad":"Ters Tamamlanma Tuzağı","metin":"Dönem başı yarı mamul için 200 birimin tamamlanma derecesi olan %30\u0027u doğrudan çarptın, oysa İlk Giren İlk Çıkar\u0027da bu birimler için yalnız KALAN (1-tamamlanma) payı eşdeğer birime eklenir. Doğrusu: Ek çalışma payı 200x(1-0,30)=140 birim olarak hesaplanmalıdır."}},"celdiriciYol":{"D":"1.000 + 300x0,50 = 1.150 (ortalama yöntem formülünü kullandın)","E":"200x(1-0,30) + 800 + 300 = 1.240 (dönem sonu yarı mamulü tamamlanma derecesine göre değil tam saydın)","A":"800 + 300x0,50 = 950 (dönem başı yarı mamulü hiç saymadın)","B":"200x0,30 + 800 + 300x0,50 = 1.010 (tamamlanma derecesini ters uyguladın)"},"hap":"İlk Giren İlk Çıkar yönteminde eşdeğer birim, dönem başı yarı mamulün tamamlanması için gereken EK çalışma + dönem içi başlayıp bitirilen birim + dönem sonu yarı mamulün tamamlanma payından oluşur.","teshis":{"C":{"gercek":"ilk giren ilk çıkar (FIFO) yalnız dönem içi eforu ölçer; dönem başı yarı mamul ek çalışma + dönem içi başlayıp bitirilen + dönem sonu yarı mamul payı toplanarak 1.090 birim bulunur.","ayirt":"Bu dönemde harcanan gerçek emek miktarını mı ölçüyorum diye kendine sor.","paragraf":"Teori Notu - safha maliyeti eşdeğer birim, FIFO tanımı","yanilgi":"ilk giren ilk çıkar (FIFO) ile ortalama yöntemin aynı sonucu vereceğini, dönem başı yarı mamulün ayrı ele alınmasının gereksiz olduğunu düşünüyorsun."},"E":{"gercek":"Dönem sonu yarı mamul yalnızca tamamlanma derecesine karşılık gelen pay kadar eşdeğer birime katılır; tam birim sayılmaz.","ayirt":"Bu birimlerin ne kadarı gerçekten tamamlandı diye kendine sor, tamamlanma yüzdesini unutma.","paragraf":"Teori Notu - eşdeğer birim temel formülü","yanilgi":"Dönem sonu yarı mamulün de tıpkı tamamlanan birimler gibi tam birim olarak sayılması gerektiğini sanıyorsun."},"A":{"gercek":"İlk Giren İlk Çıkar yönteminde dönem başı yarı mamul bu dönemde tamamlanmak için ek emek görür; bu ek pay eşdeğer birime eklenir.","ayirt":"Dönem başı yarı mamulü tamamlamak için bu dönem hiç çalışma yapılmadı mı diye kendine sor.","paragraf":"Teori Notu - safha maliyeti eşdeğer birim, FIFO tanımı","yanilgi":"Dönem başı yarı mamulün önceki dönemden gelen kısmının bu dönem hiç emek görmediğini, dolayısıyla bu döneme hiç maliyet yüklemeyeceğini sanıyorsun."},"D":{"gercek":"Ortalama yöntem dönem başı ve dönem içi maliyeti harmanlar, ilk giren ilk çıkar (FIFO) ise dönem başı yarı mamulü ayrı tutup yalnız kalan payı sayar; iki yöntem farklı eşdeğer birim verir.","ayirt":"Hangi yöntemi uyguladığımı, dönem başı yarı mamulü ayrı mı yoksa tam mı saydığımı kontrol et.","paragraf":"Teori Notu - ortalama ve FIFO karşılaştırması","yanilgi":"Dönem başı yarı mamulü tamamlanan birimlerin içine tam olarak dahil edip ortalama yöntem formülünü kullanmanın ilk giren ilk çıkar (FIFO) ile aynı olduğunu sanıyorsun."},"B":{"gercek":"İlk Giren İlk Çıkar yönteminde dönem başı yarı mamul için yalnız KALAN pay, yani (1-tamamlanma derecesi) eşdeğer birime girer; tamamlanma derecesinin kendisi ortalama yöntemde kullanılır.","ayirt":"Bu birimler için bu dönem ne kadarlık iş KALDI, ne kadarı zaten yapılmıştı diye ayır.","paragraf":"Teori Notu - FIFO ek çalışma formülü","yanilgi":"Dönem başı yarı mamul için tamamlanma derecesinin kendisini (%30) eşdeğer birime katmanın doğru olduğunu sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 59"},"kural":"Kapasite sapması, fiili faaliyet hacmi için bütçelenen (esnek bütçe) genel üretim gideri ile yüklenen genel üretim gideri arasındaki farktır; esnek bütçe yüklenenden büyükse kapasite yeterince kullanılmamış demektir ve sapma olumsuzdur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 59","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce yükleme oranını normal kapasiteden, esnek bütçeyi ise fiili hacimden hesapla; iki farklı hacim rakamını birbirine karıştırma.","konu":"sipariş maliyet sistemi","tablo":{"satirlar":[["VERİLENLER","-"],["Normal kapasite","10.000 mks"],["Bütçelenen sabit genel üretim gideri","200.000 TL"],["Bütçelenen değişken genel üretim gideri oranı","15 TL/mks"],["Fiili faaliyet hacmi","9.200 mks"],["Fiili genel üretim gideri","330.000 TL"],["HESAP","-"],["Yükleme Oranı (35 TL/mks)","-"],["Yüklenen Genel Üretim Gideri (35×9.200)","322.000"],["Esnek Bütçe (200.000+15×9.200)","338.000"],["Kapasite (Hacim) Sapması (338.000-322.000)","16.000 (olumsuz)"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"16.000 olumlu","E":"24.000","A":"8.000 olumlu","D":"16.000 olumsuz","B":"8.000 olumsuz"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Yükleme Oranı (30+12=42 TL/mks)","-"],["Yüklenen Genel Üretim Gideri (42×7.500)","315.000"],["Esnek Bütçe (240.000+12×7.500)","330.000"],["Kapasite (Hacim) Sapması (330.000-315.000)","15.000 (olumsuz)"]]},"tur":"tablo","soru":"Sipariş maliyet sistemi kullanan bir işletme, genel üretim giderlerini önceden belirlenmiş yükleme oranıyla siparişlere yüklemektedir. Normal kapasite 8.000 makine saati olup bu düzeyde bütçelenen sabit genel üretim gideri 240.000 TL, bütçelenen değişken genel üretim gideri oranı ise makine saati başına 12 TL\u0027dir. 2026 döneminde fiilen 7.500 makine saati çalışılmış, fiili genel üretim gideri 336.000 TL olarak gerçekleşmiştir. Buna göre işletmenin esnek (harcama) bütçe tutarı kaç TL\u0027dir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve esnek bütçe tutarının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Sipariş maliyet sistemi kullanan işletme, genel üretim giderlerini önceden belirlenmiş yükleme oranıyla siparişlere yüklemektedir. Normal kapasite 10.000 makine saati olup bu düzeyde bütçelenen sabit genel üretim gideri 200.000 TL, bütçelenen değişken genel üretim gideri oranı ise makine saati başına 15 TL\u0027dir. 2026 döneminde fiilen 9.200 makine saati çalışılmış, fiili genel üretim gideri 330.000 TL olarak gerçekleşmiştir. Buna göre işletmenin kapasite (hacim) sapması kaç TL\u0027dir ve yönü nedir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-02","verilenler":[{"deger":"10.000 mks","anlam":"Yükleme oranının hesaplandığı bütçelenen faaliyet hacmi","ad":"Normal kapasite"},{"deger":"200.000 TL","anlam":"Normal kapasitede sabit kalan genel üretim gideri tutarı","ad":"Bütçelenen sabit genel üretim gideri"},{"deger":"15 TL/mks","anlam":"Makine saati başına bütçelenen değişken genel üretim gideri","ad":"Bütçelenen değişken genel üretim gideri oranı"},{"deger":"9.200 mks","anlam":"Dönemde fiilen çalışılan makine saati; yüklenen genel üretim gideri ve esnek bütçenin hesabında kullanılır","ad":"Fiili faaliyet hacmi"},{"deger":"330.000 TL","anlam":"Dönemde gerçekleşen fiili genel üretim gideri (bütçe sapması hesabında kullanılır, kapasite sapmasında kullanılmaz)","ad":"Fiili genel üretim gideri"}],"dayanak":"Maliyet muhasebesi - genel üretim gideri bütçe/kapasite sapması teorisi (esnek bütçe yaklaşımı)","dogru":"D","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Soruda ne var: normal kapasite 10.000 mks (soruda verilen); bütçelenen sabit genel üretim gideri 200.000 TL (soruda verilen); değişken genel üretim gideri oranı 15 TL/mks (soruda verilen); fiili çalışma 9.200 mks (soruda verilen); fiili genel üretim gideri 330.000 TL (soruda verilen); kapasite sapması ve yönü isteniyor","anlatim":"Soru bize şunları vermiş: normal kapasite, bütçelenen sabit ve değişken genel üretim gideri, fiili saat ve fiili genel üretim gideri.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1]]},{"formul":"Yükleme Oranı = (Bütçelenen Sabit genel üretim gideri + Değişken genel üretim gideri Oranı × Normal Kapasite) / Normal Kapasite = (200.000 (soruda verilen) + 15 (soruda verilen) × 10.000 (soruda verilen)) / 10.000 (soruda verilen) = 35 TL/mks","anlatim":"Yükleme oranı nedir? Normal kapasitede toplam bütçelenen genel üretim gideri\u0027ün, normal kapasiteye bölünmesiyle bulunan sabit bir orandır - siparişlere gider bununla yüklenir.","doldur":[[7,1]]},{"formul":"Yüklenen Genel Üretim Gideri = Yükleme Oranı × Fiili Saat = 35 (2. adımda bulduk) × 9.200 (soruda verilen) = 322.000 TL","anlatim":"Yüklenen genel üretim gideri nedir? Fiili çalışılan saate yükleme oranı çarpılarak siparişlere yüklenen gider tutarıdır, bu fiili genel üretim gideri değildir.","doldur":[[8,1]]},{"formul":"Esnek Bütçe = Bütçelenen Sabit genel üretim gideri + Değişken genel üretim gideri Oranı × Fiili Saat = 200.000 (soruda verilen) + 15 (soruda verilen) × 9.200 (soruda verilen) = 338.000 TL","anlatim":"Esnek bütçe nedir? Fiili faaliyet hacmi için olması gereken genel üretim gideri tutarıdır, sabit kısım hep sabit kalır sadece değişken kısım fiili saatle çarpılır.","doldur":[[9,1]]},{"formul":"Kapsam: Kapasite Sapması = Esnek Bütçe − Yüklenen genel üretim gideri; Dahil değil: fiili genel üretim gideri 330.000 (soruda verilen)","anlatim":"Fiili genel üretim gideri 330.000 TL burada hiç kullanılmaz - o harcama sapmasının konusudur, kapasite sapması esnek bütçe ile yüklenen arasındaki farktır.","doldur":[]},{"formul":"Kapasite (Hacim) Sapması = Esnek Bütçe − Yüklenen genel üretim gideri = 338.000 (4. adımda bulduk) − 322.000 (3. adımda bulduk) = 16.000 TL (olumsuz)","anlatim":"Kapasite sapması, fiili hacim için bütçelenenle yüklenen arasındaki farktır. Esnek bütçe yüklenenden büyükse kapasite az kullanılmış demektir, sapma olumsuzdur.","doldur":[[10,1]]},{"formul":"Ters durum: Fiili Saat \u003e Normal Kapasite → Yüklenen genel üretim gideri \u003e Esnek Bütçe → Kapasite Sapması olumlu","anlatim":"Ters durumda: fiili saat normal kapasiteyi aşsaydı yüklenen esnek bütçeden büyük çıkardı. O zaman sapma olumlu olurdu.","doldur":[]},{"formul":"Yanlış yol: 330.000 − 322.000 = 8.000 (HATALI) → doğrusu 338.000 − 322.000 = 16.000 (6. adımda bulduk)","anlatim":"En sık hata, fiili genel üretim gideri 330.000\u0027i hesaba katıp yanlış bir fark almaktır. Kapasite sapması sadece hacimle ilgilidir, fiili giderle ilgisi yoktur.","doldur":[]}],"anahtar":[{"ornek":"üretim","kok":"üretim"},{"ornek":"gideri","kok":"gideri"},{"ornek":"kapasite","kok":"kapasi"},{"ornek":"yüklenen","kok":"yüklen"},{"ornek":"sapması","kok":"sapmas"},{"ornek":"bütçelenen","kok":"bütçel"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda fiili faaliyet hacmi normal kapasiteden düşük ya da yüksek çıktığında. Nasıl ölçülür: bütçelenen genel üretim gideri ile yüklenen genel üretim gideri (fiili hacim x yükleme oranı) karşılaştırılarak. Nasıl kaydedilir: sabit genel üretim gideri\u0027den doğan bu fark, önemliyse stok ve SMM hesapları arasında oranlı dağıtılır, önemsizse doğrudan SMM\u0027ye atılır.","desen":"Sınav genelde fiili hacim normal kapasiteden düşük çıkarken bütçelenen sabit genel üretim gideri\u0027ü sabit tutup öğrenciyi değişken genel üretim gideri ile karıştırmaya zorlar. Kapasite sapması yalnızca sabit genel üretim gideri\u0027den doğar, değişken genel üretim gideri\u0027de böyle bir sapma yoktur; adaylar bu ayrımı atlayıp değişken kısmı da hesaba katar. Bu soru kapasite (hacim) sapmasının sadece sabit gider üzerinden hesaplanması noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşletmenin bütçe yaparken esas aldığı beklenen faaliyet hacmi düzeyi","ad":"Normal kapasite","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Bütçelenen toplam genel üretim gideri\u0027ün bütçelenen faaliyet hacmine bölünmesiyle bulunan sabit oran","ad":"Yükleme oranı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Fiili faaliyet hacminin yükleme oranıyla çarpılmasıyla bulunan tutar","ad":"Yüklenen genel üretim gideri","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Bütçelenen sabit genel üretim gideri ile yüklenen sabit genel üretim gideri arasındaki fark, yalnız sabitten doğar","ad":"Kapasite sapması","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Normal kapasite, bütçelenen sabit/değişken genel üretim gideri tutarları ve fiili hacim verilerek kapasite sapmasının tutarı ve yönü istenir.","panel_ornek":"Bir dershane, yıl başında 100 öğrenci kapasitesine göre yıllık sabit kirasını öğrenci başına paylaştırır ama yıl içinde sadece 90 öğrenci kaydolur. O 10 öğrencilik boşluk yüzünden bütçelenen sabit gider tam karşılanamaz, işte bu fark \u0027kapasite sapması\u0027dır.","ornek":"Bir dershane, yıl başında 100 öğrenci kapasitesine göre yıllık sabit kirasını öğrenci başına paylaştırır ama yıl içinde sadece 90 öğrenci kaydolur. O 10 öğrencilik boşluk yüzünden bütçelenen sabit gider tam karşılanamaz, işte bu fark \u0027kapasite sapması\u0027dır.","yontemler":"Tek yöntem: kapasite sapması = bütçelenen sabit genel üretim gideri - (fiili hacim x sabit yükleme oranı); fiili hacim normal kapasitenin altındaysa sapma olumsuz (eksik yükleme), üstündeyse olumlu çıkar.","nedir":"Sipariş maliyet sistemi, her siparişi ayrı bir maliyet nesnesi sayıp genel üretim giderini önceden belirlenmiş yükleme oranıyla siparişe dağıtan yöntemdir. Sınav bu konuda bütçelenen ile gerçekleşen gider/kapasite arasındaki sapmanın tutarını ve yönünü ölçer."},"olay":"Yükleme oranı=(200.000+15×10.000)/10.000=35 TL/mks; Yüklenen genel üretim gideri=35×9.200=322.000; Esnek bütçe=200.000+15×9.200=338.000; Kapasite sapması=338.000-322.000=16.000.","tuzak":{"C":{"ad":"Yön Ters Çevirme Tuzağı","metin":"Kapasite sapmasının tutarını (16.000) doğru hesaplamış ama esnek bütçenin yüklenenden fazla olmasının kapasitenin tam kullanılmadığını, yani olumsuz sonucu gösterdiğini atlayıp olumlu yazmışsın. Doğrusu: 16.000 olumsuzdur."},"E":{"ad":"Toplam Sapmayı Yanlış Toplama Tuzağı","metin":"Bütçe sapması (8.000) ile kapasite sapmasının (16.000) mutlak değerlerini toplayıp 8.000+16.000=24.000 bulmuş, bunu tek bir sapma tutarı sanmışsın. Doğrusu: sapmalar cebirsel olarak toplanır ve ayrı ayrı yorumlanır, kapasite sapması yalnız 16.000\u0027dir."},"A":{"ad":"Bütçe-Kapasite Karışıklığı Tuzağı","metin":"Fiili genel üretim gideri ile fiili hacim için bütçelenen giderin (esnek bütçe) farkını (330.000-338.000=-8.000) kapasite sapması sanıp mutlak değerini olumlu yazmışsın. Doğrusu: bu tutar bütçe sapmasıdır, kapasite sapması değildir."},"B":{"ad":"Yön Ters Çevirme Tuzağı","metin":"Bütçe sapmasını (8.000) doğru bulmuş ama yönünü tersine çevirip olumsuz yazmışsın; fiili gider bütçelenenden düşük olduğundan yön olumludur, ayrıca sorulan kapasite sapması değil bütçe sapmasıdır. Doğrusu: 16.000 olumsuz kapasite sapmasıdır."}},"celdiriciYol":{"C":"338.000 - 322.000 = 16.000, yön ters çevrilerek olumlu yazılmıştır (kapasite sapması yön hatası)","E":"|330.000-338.000| + |338.000-322.000| = 8.000 + 16.000 = 24.000 (sapmaları işaretsiz toplama hatası)","A":"330.000 - 338.000 = -8.000, mutlak değeri alınıp olumlu yazılmıştır (bütçe sapmasını kapasite sapması sanma)","B":"330.000 - 338.000 = -8.000, mutlak değeri alınıp yönü ters çevrilerek olumsuz yazılmıştır (bütçe sapmasını kapasite sapması sanma ve yön hatası)"},"hap":"Kapasite sapması, fiili hacim için bütçelenen (esnek bütçe) genel üretim gideri ile yüklenen genel üretim gideri arasındaki farktır; esnek bütçe fazlaysa sapma olumsuzdur.","teshis":{"C":{"gercek":"Esnek bütçe yüklenen genel üretim gideri\u0027den büyükse kapasite yeterince kullanılmamıştır, bu olumsuz bir sapmadır.","ayirt":"Bütçelenen mi yüklenenden büyük, yoksa yüklenen mi bütçelenenden büyük?","paragraf":"Maliyet muhasebesi - GÜG sapma analizi","yanilgi":"Kapasite sapmasının tutarını doğru bulduğun için yönünü de otomatik doğru sandın."},"E":{"gercek":"Sapmalar cebirsel işaretleriyle toplanır (toplam sapma=fiili genel üretim gideri-yüklenen genel üretim gideri=8.000) ve kapasite sapması bundan ayrı raporlanır.","ayirt":"İşaretleri (+/-) koruyarak mı topladım, yoksa mutlak değerleri mi topladım?","paragraf":"Maliyet muhasebesi - GÜG sapma analizi","yanilgi":"Bütçe sapması ile kapasite sapmasının mutlak değerlerini toplayarak tek bir \u0027toplam sapma\u0027 tutarı elde edilebileceğini sanıyorsun."},"A":{"gercek":"Bu fark bütçe (harcama) sapmasıdır; kapasite sapması esnek bütçe ile yüklenen genel üretim gideri arasındaki farktır.","ayirt":"Karşılaştırdığım iki tutardan biri \u0027yüklenen genel üretim gideri\u0027 mü, yoksa \u0027fiili genel üretim gideri\u0027 mü?","paragraf":"Maliyet muhasebesi - GÜG sapma analizi","yanilgi":"Fiili gider ile esnek bütçe arasındaki farkın doğrudan kapasite sapması olduğunu sanıyorsun."},"D":{"gercek":"Kapasite sapması, esnek bütçe (fiili hacim için bütçelenen genel üretim gideri) ile yüklenen genel üretim gideri arasındaki farktır ve esnek bütçe fazlaysa olumsuzdur.","ayirt":"Esnek bütçe tutarını yüklenen genel üretim gideri ile mi, yoksa fiili genel üretim gideri ile mi karşılaştırdım?","paragraf":"Maliyet muhasebesi - GÜG sapma analizi","yanilgi":"Kapasite sapmasının fiili gider ile yüklenen genel üretim gideri arasındaki toplam farktan ibaret olduğunu düşünenler bu şıkkı gözden kaçırır."},"B":{"gercek":"Fiili gider bütçelenenden düşükse sapma olumludur; ayrıca soru kapasite sapmasını istemektedir.","ayirt":"Fiili tutar mı büyük yoksa karşılaştırılan bütçelenen/yüklenen tutar mı büyük?","paragraf":"Maliyet muhasebesi - GÜG sapma analizi","yanilgi":"Bütçe sapmasının tutarını doğru bulup yönünü rastgele atadığını düşünüyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":7,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 57"},"kural":"matematiksel dağıtımda önce yardımcı yerlerin denklem sistemi çözülüp düzeltilmiş toplamları bulunur, sonra bu toplamlar ilgili esas yere ayrılan oranla çarpılıp toplanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 57","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce yardımcı gider yerlerinin denklem sistemini çöz ve düzeltilmiş toplamları bul; sonra hangi yüzdenin hangi esas üretim yerine ait olduğunu tek tek kontrol et.","konu":"genel üretim gideri dağıtımı","tablo":{"satirlar":[["VERİLENLER","-"],["Bakım-Onarım kendi gideri","38.000 TL"],["Enerji kendi gideri","55.000 TL"],["Bakım-Onarım dağıtım oranları","%10 Enerji, %60 Kesim, %30 Montaj"],["Enerji dağıtım oranları","%20 Bakım-Onarım, %55 Kesim, %25 Montaj"],["Kesim üretim miktarı","300 birim"],["HESAP","-"],["Bakım-Onarım toplam maliyeti (B = 38.000 + 0,20×E)","50.000"],["Enerji toplam maliyeti (E = 55.000 + 0,10×B)","60.000"],["Bakım-Onarım\u0027dan Kesim\u0027e aktarılan pay (50.000×%60)","30.000"],["Enerji\u0027den Kesim\u0027e aktarılan pay (60.000×%55)","33.000"],["Kesim\u0027e yüklenen toplam genel üretim gideri","63.000"],["Birim başına genel üretim gideri (63.000 / 300 birim)","210"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"160","E":"310","A":"100","D":"210","B":"110"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":7,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Kalıphane toplam maliyeti (K = 38.000 + 0,20×B)","50.000"],["Buhar toplam maliyeti (B = 55.000 + 0,10×K)","60.000"],["Kalıphane\u0027den Boyama\u0027ya aktarılan pay (50.000×%45)","22.500"],["Buhar\u0027dan Boyama\u0027ya aktarılan pay (60.000×%60)","36.000"],["Boyama\u0027ya yüklenen toplam genel üretim gideri","58.500"],["Birim başına genel üretim gideri (58.500 / 300 birim)","195"]]},"tur":"tablo","soru":"İşletmede, karşılıklı hizmet veren Kalıphane ve Buhar gider yerlerinin giderleri matematiksel (karşılıklı) dağıtım yöntemiyle esas üretim yerlerine aktarılmaktadır. Kalıphane\u0027nin kendi gideri 38.000 TL\u0027dir; toplamının %20\u0027si Buhar\u0027a, %55\u0027i Dokuma\u0027ya, %45\u0027i Boyama\u0027ya dağıtılır. Buhar\u0027ın kendi gideri 55.000 TL\u0027dir; toplamının %10\u0027u Kalıphane\u0027ye, %40\u0027ı Dokuma\u0027ya, %60\u0027ı Boyama\u0027ya dağıtılır. Boyama\u0027da dönemde 300 birim ürün üretilmiştir. Buna göre, Boyama\u0027ya yüklenecek genel üretim giderinin birim başına tutarı kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve Boyama\u0027ya yüklenecek genel üretim giderinin birim başına tutarının 195 TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletmede, karşılıklı hizmet veren Bakım-Onarım ve Enerji gider yerlerinin giderleri matematiksel (karşılıklı) dağıtım yöntemiyle esas üretim yerlerine aktarılmaktadır. Bakım-Onarım\u0027ın kendi gideri 38.000 TL\u0027dir; toplamının %10\u0027u Enerji\u0027ye, %60\u0027ı Kesim\u0027e, %30\u0027u Montaj\u0027a dağıtılır. Enerji\u0027nin kendi gideri 55.000 TL\u0027dir; toplamının %20\u0027si Bakım-Onarım\u0027a, %55\u0027i Kesim\u0027e, %25\u0027i Montaj\u0027a dağıtılır. Kesim\u0027de dönemde 300 birim ürün üret
