","kok":"çarpıl"},{"ornek":"ücretle","kok":"ücretl"}],"konuGiris":{"harita":"Ne zaman test edilir: standart ve fiili saat ücreti ile fiili çalışılan saat verildiğinde test edilir. Nasıl ölçülür: (fiili saat ücreti - standart saat ücreti) x fiili çalışılan saat işlemiyle ölçülür. Nasıl kaydedilir: fark olumsuzsa 722 hesabın borcuna, olumluysa alacağına kaydedilir.","desen":"Sınav standart süre ve standart üretim miktarını vererek dikkat dağıtır; ücret farkı hesabında bu bilgiler kullanılmaz, sadece fiili saat esas alınır. Öğrenciler standart üretimden hesaplanan standart saati fiili saat yerine kullanma tuzağına düşer. Bu soru Tekdüzen Hesap Planı 722 hesap tanımındaki fiili-standart ücret karşılaştırması noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"önceden belirlenmiş, bir saatlik işçiliğe planlanan ücret","ad":"standart saat ücreti","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"dönemde gerçekte ödenen bir saatlik işçilik ücreti","ad":"fiili saat ücreti","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"üretim için gerçekte harcanan toplam işçilik süresi","ad":"fiili çalışılan saat","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"fiili ile standart saat ücreti arasındaki farkın fiili saate uygulanmış tutarı","ad":"ücret farkı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Standart ve fiili saat ücreti ile fiili çalışılan saat verilir, 722 hesabına kaydedilecek tutar ve yönü istenir.","panel_ornek":"Bir kurye şirketi, kuryelere saatlik 30 TL yerine fiilen 33 TL ödemiş ve o hafta 200 saat çalışılmış. Aradaki 3 TL fark, 200 saatle çarpılınca 600 TL fazladan işçilik ücreti ödendiği ortaya çıkar. Bu fark, planlanandan sapmayı gösterir.","ornek":"Bir kurye şirketi, kuryelere saatlik 30 TL yerine fiilen 33 TL ödemiş ve o hafta 200 saat çalışılmış. Aradaki 3 TL fark, 200 saatle çarpılınca 600 TL fazladan işçilik ücreti ödendiği ortaya çıkar. Bu fark, planlanandan sapmayı gösterir.","yontemler":"Tek yöntem: fark, sadece saat ücreti farkının fiili saate uygulanmasıyla bulunur; standart süre ve üretim miktarı bu hesaba karışmaz.","nedir":"Standart maliyet yönteminde işçilik ücret farkı, fiili saat ücreti ile standart saat ücreti arasındaki farkın fiili çalışılan saate uygulanmasıyla bulunur. Sınav bu farkın olumlu mu olumsuz mu olduğunu ve tutarını ölçer."},"olay":"(50-52) x 11.000 = -22.000.","tuzak":{"D":{"ad":"Katman Karıştırma Tuzağı","metin":"Doğru yönde hesapladığın 50.000 TL aslında süre (verimlilik) farkıdır, ücret farkı değildir. Doğrusu: (Standart süre-Fiili süre) x Standart ücret = -50.000, bu 723 Direkt İşçilik Süre Farkları hesabına gider."},"E":{"ad":"Toplam Farkı Ayrıştırmama Tuzağı","metin":"Fiili maliyet ile standart maliyet arasındaki 72.000 TL\u0027lik toplam farkın tamamını ücret farkı sandın. Doğrusu: Toplam fark, ücret farkı (22.000) ile süre farkı (50.000) toplamıdır; iki farkın ayrı hesaplarda izlenmesi gerekir."},"A":{"ad":"Ters Yön Tuzağı","metin":"Fiili ücret standarttan yüksek çıkınca farkı \u0027olumlu\u0027 sandın, çünkü (Fiili-Standart) sırasıyla işlem yaptın. Doğrusu: Formül (Standart ücret-Fiili ücret) x Fiili süre\u0027dir, sonuç negatif çıktığında fark olumsuzdur."},"B":{"ad":"Hesap Karıştırma Tuzağı","metin":"Süre farkı formülünü ücret farkı sanıp uyguladın ve yönü de ters aldın. Doğrusu: (Fiili süre-Standart süre) x Standart ücret süre farkını verir, ücret farkını değil; süre farkı da olumsuzdur çünkü fiili süre standardı aşmıştır."}},"celdiriciYol":{"D":"(10.000-11.000) x 50 = -50.000 → 50.000 (süre farkını ücret farkı hesabına yazdın, hesap karıştırması)","E":"(572.000-500.000) = 72.000 (toplam sapmayı ücret ve süre farkına ayırmadan tek kalemde ücret farkı sandın)","B":"(11.000-10.000) x 50 = 50.000 (süre farkını ücret farkı sandın ve yönü ters okudun)","A":"(52-50) x 11.000 = 22.000 (yön işaretini ters aldın, fiili ücretin yüksek çıkmasını olumlu fark sandın)"},"hap":"Direkt işçilik ücret farkı = (Standart ücret - Fiili ücret) x Fiili süre; süre farkı = (Standart süre - Fiili süre) x Standart ücret, ikisi ayrı hesaplarda izlenir.","teshis":{"D":{"gercek":"50.000 TL\u0027lik olumsuz fark süre (verimlilik) kaynaklıdır ve 723 Direkt İşçilik Süre Farkları hesabına aittir; 722 yalnız ücret kaynaklı farkı taşır.","ayirt":"Bu tutar saat ücretindeki mi yoksa çalışılan süredeki farktan mı doğdu?","paragraf":"THP 722 / 723 hesap ayrımı","yanilgi":"Yönü doğru bulsan da hangi hesabın hangi farkı izlediğini karıştırıp süre farkını ücret farkı sanıyorsun."},"E":{"gercek":"72.000 TL\u0027lik toplam fark, 22.000 TL ücret farkı ile 50.000 TL süre farkının toplamıdır; iki farkın ayrı hesaplarda izlenmesi gerekir.","ayirt":"Bu tutarı bulurken ücret ve süre etkisini ayrı ayrı hesapladım mı?","paragraf":"THP 722 / 723 hesap ayrımı","yanilgi":"Fiili toplam maliyetle standart toplam maliyet arasındaki farkın tamamının ücret farkına ait olduğunu sanıyorsun."},"B":{"gercek":"Süre farkı = (Standart süre-Fiili süre) x Standart ücret\u0027tir; fiili süre standardı aştığında bu fark olumsuzdur, üstelik bu tutar ücret farkı değil süre farkıdır.","ayirt":"Bu 50.000 TL hangi değişkenin (süre mi, ücret mi) farkı ve doğru hesaba mı gidiyor?","paragraf":"THP 722 / 723 hesap ayrımı","yanilgi":"Süre farkı formülünü ücret farkıyla karıştırıp fiili süre fazlalığını \u0027olumlu\u0027 bir durum gibi yorumluyorsun."},"C":{"gercek":"Ücret farkı yalnız (Standart ücret-Fiili ücret) x Fiili süre ile bulunur; süre farkı ayrı ve bağımsız bir hesaba (723) aittir.","ayirt":"Bu formülde sadece ücret mi değişti, süre mi sabit tutuldu?","paragraf":"THP 722 hesap tanımı","yanilgi":"Süre farkını da hesaba katıp toplam sapmayı ücret farkı olarak vermek gerektiğini düşünerek bu şıkkı elersin."},"A":{"gercek":"THP 722 tanımına göre fiili gider standardı aştığında ortaya çıkan fark olumsuzdur ve hesabın borcuna kaydedilir; formülde sıra (Standart-Fiili) olmalıdır.","ayirt":"Fiili gider standarttan fazla mı, azdır mı; fazlaysa bu benim için hep olumsuz müdür?","paragraf":"THP 722 hesap tanımı","yanilgi":"Fiili ücret standart ücretten büyük olduğunda farkı hesaplarken (Fiili-Standart) sırasını kullanıp çıkan pozitif sayıyı olumlu fark sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 64"},"kural":"eşdeğer ürün birimi, ilk madde ve malzeme ile işçilik-genel üretim gideri için tamamlanma derecelerine göre ayrı ayrı hesaplanır, her unsurun birim maliyeti bulunup toplanır ve tamamlanan miktarla çarpılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 64","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"800.000","taraf":"B","hesap":"152 MAMULLER"},{"tutar":"800.000","taraf":"A","hesap":"151 YARI MAMULLER-ÜRETİM"}],"teori":false,"taktik":"İki maliyet unsurunun eşdeğer birimini tek tabloda yan yana yaz, tek eşdeğer birimi ikisine de uygulama hatasına düşme.","konu":"safha maliyet sistemi","tablo":{"satirlar":[["VERİLENLER","-"],["Üretime başlanan miktar","10.000 birim"],["Tamamlanan miktar","8.000 birim"],["Dönem sonu yarı mamul","2.000 birim"],["İlk madde tamamlanma derecesi","%100"],["İşçilik-genel üretim gideri tamamlanma derecesi","%60"],["İlk madde ve malzeme maliyeti","600.000 TL"],["İşçilik ve genel üretim gideri toplamı","368.000 TL"],["HESAP","-"],["İlk madde eşdeğer birimi (8.000 + 2.000×%100)","10.000"],["İşçilik ve genel üretim gideri eşdeğer birimi (8.000 + 2.000×%60)","9.200"],["İlk madde birim maliyeti (600.000/10.000)","60"],["İşçilik ve genel üretim gideri birim maliyeti (368.000/9.200)","40"],["Toplam birim maliyet (60+40)","100"],["Tamamlanan mamul maliyeti (8.000×100)","800.000"]],"basliklar":["Kalem","Tutar/Miktar"]},"siklar":{"C":"800.000","E":"1.000.000","A":"320.000","D":"968.000","B":"480.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1]],"tablo":{"basliklar":["Kalem","Tutar/Miktar"],"satirlar":[["İlk madde eşdeğer birimi (8.500 + 2.500×%100)","11.000"],["İşçilik ve genel üretim gideri eşdeğer birimi (8.500 + 2.500×%60)","10.000"],["İlk madde birim maliyeti (880.000/11.000)","80"],["İşçilik ve genel üretim gideri birim maliyeti (470.000/10.000)","47"],["Toplam birim maliyet (80+47)","127"],["Yarı mamul maliyeti (2.500×80 + 1.500×47)","270.500"]]},"tur":"tablo","soru":"Safha maliyet sistemi uygulayan bir mobilya işletmesinde döneme 11.000 birim mamul için üretime başlanmış, bunların 8.500 birimi tamamlanarak mamul ambarına aktarılmıştır. Dönem sonunda kalan 2.500 birim yarı mamulün direkt ilk madde ve malzeme açısından tamamlanma derecesi %100, işçilik ve genel üretim gideri açısından tamamlanma derecesi %60\u0027tır. Dönemde katlanılan direkt ilk madde ve malzeme maliyeti 880.000 TL, işçilik ve genel üretim gideri toplamı 470.000 TL olduğuna göre, dönem sonunda kalan yarı mamulün toplam maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve dönem sonu yarı mamulün toplam maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Safha maliyet sistemi uygulayan bir tekstil işletmesinde döneme 10.000 birim mamul için üretime başlanmış, bunların 8.000 birimi tamamlanarak mamul ambarına aktarılmıştır. Dönem sonunda kalan 2.000 birim yarı mamulün direkt ilk madde ve malzeme açısından tamamlanma derecesi %100, işçilik ve genel üretim gideri açısından tamamlanma derecesi %60\u0027tır. Dönemde katlanılan direkt ilk madde ve malzeme maliyeti 600.000 TL, işçilik ve genel üretim gideri toplamı 368.000 TL olduğuna göre, tamamlanıp mamul ambarına aktarılan mamullerin toplam maliyeti kaç TL\u0027dir?","kayitBaslik":"1) Mamullerin ambara girişi","id":"sgs-t1-maliyet-zor/kp-13","verilenler":[{"deger":"10.000 birim","anlam":"Dönemde işleme sokulan toplam mamul sayısı, eşdeğer birim hesabında dönem sonu yarı mamulü bulmak için tamamlanan miktardan çıkarılır.","ad":"Üretime başlanan miktar"},{"deger":"8.000 birim","anlam":"Mamul ambarına aktarılan, tam bitmiş birim sayısı; toplam birim maliyetle çarpılacak asıl miktardır.","ad":"Tamamlanan miktar"},{"deger":"2.000 birim","anlam":"Henüz bitmemiş birimler; tamamlanma derecesiyle ağırlıklandırılıp eşdeğer birime eklenir.","ad":"Dönem sonu yarı mamul"},{"deger":"%100","anlam":"Yarı mamulün ilk madde ve malzeme açısından ne kadarının tamamlandığını gösterir, ilk madde eşdeğer birimini belirler.","ad":"İlk madde tamamlanma derecesi"},{"deger":"%60","anlam":"Yarı mamulün işçilik ve genel üretim gideri açısından tamamlanma oranı, bu unsurun eşdeğer birimini belirler.","ad":"İşçilik-genel üretim gideri tamamlanma derecesi"},{"deger":"600.000 TL","anlam":"Dönemde katlanılan toplam direkt ilk madde ve malzeme tutarı, ilk madde eşdeğer birimine bölünerek birim maliyet bulunur.","ad":"İlk madde ve malzeme maliyeti"},{"deger":"368.000 TL","anlam":"Dönemde katlanılan toplam işçilik ve genel üretim gideri tutarı, kendi eşdeğer birimine bölünerek birim maliyet bulunur.","ad":"İşçilik ve genel üretim gideri toplamı"}],"dayanak":"Maliyet Muhasebesi - Safha Maliyet Sistemi, Eşdeğer Ürün Birimi Yöntemi (mevzuat maddesi yok)","dogru":"C","oyunBonus":{"soru":"Safha maliyet sistemi uygulayan bir tekstil işletmesinde döneme 20.000 birim mamul için üretime başlanmış, bunların 16.000 birimi tamamlanarak mamul ambarına aktarılmıştır. Dönem sonunda kalan 4.000 birim yarı mamulün direkt ilk madde ve malzeme açısından tamamlanma derecesi %100, işçilik ve genel üretim gideri açısından tamamlanma derecesi %60\u0027tır. Dönemde katlanılan direkt ilk madde ve malzeme maliyeti 1.200.000 TL, işçilik ve genel üretim gideri toplamı 736.000 TL olduğuna göre, tamamlanıp mamul ambarına aktarılan mamullerin toplam maliyeti kaç TL\u0027dir?","tur":"olcek","kayit":[{"tutar":"1.600.000","taraf":"B","hesap":"152 MAMULLER"},{"tutar":"1.600.000","taraf":"A","hesap":"151 YARI MAMULLER-ÜRETİM"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Üretime başlanan 10.000 birim (soruda verilen); Tamamlanan 8.000 birim (soruda verilen); Yarı mamul 2.000 birim (soruda verilen); İlk madde tamamlanma derecesi %100 (soruda verilen); İşçilik-genel üretim gideri tamamlanma derecesi %60 (soruda verilen); İlk madde maliyeti 600.000 TL (soruda verilen); İşçilik-genel üretim gideri maliyeti 368.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: 10.000 birime üretime başlanmış, bunun 8.000 birimi tamamlanmış, 2.000 birim yarı mamul kalmış. İlk madde tamamlanma derecesi %100, işçilik-genel üretim gideri tamamlanma derecesi %60; ilk madde maliyeti 600.000 TL, işçilik-genel üretim gideri toplamı 368.000 TL (soruda verilen).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]]},{"formul":"İlk madde eşdeğer birimi = Tamamlanan + Yarı mamul × tamamlanma derecesi = 8.000 (soruda verilen) + 2.000 (soruda verilen) × %100 (soruda verilen) = 10.000 birim","anlatim":"Eşdeğer ürün birimi, yarı biten malı da tam bitmişe çevirip saymaktır. İlk madde zaten üretimin başında tam konduğu için yarı mamul de %100 tamamlanmış sayılır.","doldur":[[9,1]]},{"formul":"İşçilik-genel üretim gideri eşdeğer birimi = Tamamlanan + Yarı mamul × tamamlanma derecesi = 8.000 (soruda verilen) + 2.000 (soruda verilen) × %60 (soruda verilen) = 9.200 birim","anlatim":"İşçilik ve genel üretim gideri üretim boyunca yavaş yavaş eklenir, o yüzden yarı mamulün tamamlanma derecesi burada düşük çıkar. Bu yüzden %60 kullanıyoruz, %100 değil.","doldur":[[10,1]]},{"formul":"İlk madde birim maliyeti = İlk madde maliyeti / İlk madde eşdeğer birimi = 600.000 (soruda verilen) / 10.000 (2. adımda bulduk) = 60 TL/birim","anlatim":"Birim maliyet, o unsurun toplam giderini eşdeğer birime bölerek bulunur. Neden eşdeğer birime böleriz? Çünkü yarı biten mal da bu maliyetten pay almış sayılır.","doldur":[[11,1]]},{"formul":"İşçilik-genel üretim gideri birim maliyeti = İşçilik-genel üretim gideri maliyeti / İşçilik-genel üretim gideri eşdeğer birimi = 368.000 (soruda verilen) / 9.200 (3. adımda bulduk) = 40 TL/birim","anlatim":"Aynı mantığı işçilik-genel üretim gideri için de uyguluyoruz, ama bu sefer payda 9.200. Dikkat: iki unsurun eşdeğer birimi farklı olduğu için payda da farklı.","doldur":[[12,1]]},{"formul":"Toplam birim maliyet = İlk madde birim maliyeti + İşçilik-genel üretim gideri birim maliyeti = 60 (4. adımda bulduk) + 40 (5. adımda bulduk) = 100 TL/birim","anlatim":"Bir birim mamulün toplam maliyeti, tüm unsurların birim maliyetleri toplanarak bulunur. Burada sadece iki unsur var: ilk madde ve işçilik-genel üretim gideri.","doldur":[[13,1]]},{"formul":"Tamamlanan mamul maliyeti = Tamamlanan miktar × Toplam birim maliyet = 8.000 (soruda verilen) × 100 (6. adımda bulduk) = 800.000 TL","anlatim":"Tamamlanıp ambara aktarılan mamullerin maliyetini bulmak için toplam birim maliyeti sadece tamamlanan miktarla çarparız. Yarı mamul burada hiç yok, çünkü o hâlâ üretimde.","doldur":[[14,1]]},{"formul":"Ters durum: ilk madde tamamlanma derecesi %60 olsaydı → İlk madde eşdeğer birimi = 8.000 + 2.000 × %60 = 9.200 birim","anlatim":"Ters durumda: ilk madde de %60 tamamlanmış olsaydı, ilk madde eşdeğer birimi 8.000+2.000×%60=9.200 olurdu, yani ikisi de aynı eşdeğer birimi kullanırdı.","doldur":[]},{"formul":"Yanlış yol: 600.000/8.000 + 368.000/8.000 = 75 + 46 = 121 TL/birim, 8.000×121=968.000 TL (HATALI) → doğrusu 800.000 TL (7. adımda bulduk)","anlatim":"En sık hata: yarı mamulün 2.000 birimini hiç yokmuş gibi görüp direkt 8.000×(600.000/8.000+368.000/8.000) hesaplamaktır. Bu yanlıştır, çünkü yarı mamul de kaynaklardan pay almıştır ve paydayı küçültüp birim maliyeti yapay şekilde şişirir.","doldur":[]}],"anahtar":[{"ornek":"üretim","kok":"üretim"},{"ornek":"tamamlanma","kok":"tamaml"},{"ornek":"maliyet","kok":"maliye"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"birimi","kok":"birimi"},{"ornek":"gideri","kok":"gideri"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda tamamlanan ve yarı mamul kalan birimler belli olduğunda. Nasıl ölçülür: her maliyet unsuru için eşdeğer ürün miktarı ayrı ayrı bulunup birim maliyete bölünerek. Nasıl kaydedilir: tamamlanan birimlerin toplam maliyeti mamul ambarına aktarılan tutar olarak defterlere geçirilir.","desen":"Sınav genellikle direkt ilk madde ile işçilik/genel üretim gideri\u0027ün farklı tamamlanma derecelerine sahip olmasını tuzak yapar, tek eşdeğer miktar hesaplayan yanlış sonuca ulaşır. Soru arşivde 2 dönemde çıkmıştır ve hep iki maliyet unsurunun ayrı ayrı eşdeğer birim bulunmasını gerektirir. Bu soru dönüştürme maliyeti ile ilk madde maliyetinin ayrı hesaplanması noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Yarı mamulün tamamlanma derecesine göre tam mamul cinsinden ifadesi","ad":"Eşdeğer ürün miktarı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Yarı mamulün ilgili maliyet unsuru açısından ne kadarının tamamlandığını gösteren yüzde","ad":"Tamamlanma derecesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Direkt işçilik ile genel üretim giderinin toplamı, ilk maddeyi mamule dönüştürme bedeli","ad":"Dönüştürme maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"İlgili maliyet unsuru toplamının o unsurun eşdeğer ürün miktarına bölünmesiyle bulunan tutar","ad":"Birim maliyet","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Üretime başlanan, tamamlanan ve yarı mamul kalan birim sayıları ile dönem maliyetleri verilir; tamamlanıp aktarılan mamullerin toplam maliyeti istenir.","panel_ornek":"Bir öğrenci ayda 30 sayfalık ödev yazıyor, ay sonunda 24 sayfayı tamamen bitirmiş, 6 sayfayı ise sadece taslak (yazı %100 ama düzenleme %50) halinde bırakmış. Kalan 6 sayfa tam sayılmaz, düzenleme açısından yarım sayfa gibi hesaba katılır. Böylece bitmiş 24 sayfaya, yarım kalan kısmın karşılığı da eklenerek toplam emek hesaplanır.","ornek":"Bir öğrenci ayda 30 sayfalık ödev yazıyor, ay sonunda 24 sayfayı tamamen bitirmiş, 6 sayfayı ise sadece taslak (yazı %100 ama düzenleme %50) halinde bırakmış. Kalan 6 sayfa tam sayılmaz, düzenleme açısından yarım sayfa gibi hesaba katılır. Böylece bitmiş 24 sayfaya, yarım kalan kısmın karşılığı da eklenerek toplam emek hesaplanır.","yontemler":"İlk madde ve dönüştürme maliyeti için eşdeğer ürün miktarları ayrı hesaplanır, sonra her biri kendi birim maliyetiyle çarpılıp toplanır; ortalama maliyet yönteminde dönem başı yarı mamul de eşdeğer miktara dahil edilir.","nedir":"Safha maliyet sistemi, sürekli ve seri üretim yapan işletmelerde (tekstil, çimento gibi) süreç boyunca oluşan maliyeti birimlere paylaştırma yöntemidir. Sınav, eşdeğer ürün miktarının doğru hesaplanıp birim maliyete ulaşılmasını ölçer."},"olay":"ilk madde eşdeğer birimi 8.000+2.000×1,00=10.000, birim maliyet 600.000/10.000=60; işçilik-genel üretim gideri eşdeğer birimi 8.000+2.000×0,60=9.200, birim maliyet 368.000/9.200=40; toplam birim maliyet 60+40=100; 8.000×100=800.000.","tuzak":{"D":{"ad":"Yarı Mamulü Yok Sayma Tuzağı","metin":"Dönem sonu yarı mamulü eşdeğer birime hiç katmadın, sanki tüm maliyet yalnız tamamlanan 8.000 birime dağılmış gibi işlem yaptın. Doğrusu: eşdeğer birim tamamlanan birim ile yarı mamulün tamamlanma derecesine göre ağırlıklandırılmış kısmının toplamıdır, sonuç 800.000 TL\u0027dir."},"E":{"ad":"Başlanan Miktarı Tamamlanan Sanma Tuzağı","metin":"Üretime başlanan 10.000 birimin tamamının bittiğini varsayıp dönem sonu yarı mamulün varlığını göz ardı ettin. Doğrusu: toplam birim maliyet yalnızca fiilen tamamlanan 8.000 birimle çarpılır, sonuç 800.000 TL\u0027dir."},"A":{"ad":"İlk Maddeyi Atlama Tuzağı","metin":"İşçilik ve genel üretim gideri payını hesaplayıp bunu tek başına toplam maliyet sandın, ilk madde ve malzeme birim maliyetini eklemeyi unuttun. Doğrusu: iki maliyet unsurunun birim maliyeti toplanıp 8.000 ile çarpılır, sonuç 800.000 TL\u0027dir."},"B":{"ad":"İkinci Unsuru Atlama Tuzağı","metin":"İlk madde ve malzeme birim maliyetini toplam maliyet sanıp işçilik ve genel üretim gideri payını hiç hesaba katmadın. Doğrusu: iki birim maliyet toplanmadan tamamlanan mamul maliyeti bulunamaz, sonuç 800.000 TL\u0027dir."}},"celdiriciYol":{"D":"(600.000/8.000 + 368.000/8.000) × 8.000 = 968.000 (dönem sonu yarı mamulü eşdeğer birime hiç katmadın)","E":"(60 + 40) × 10.000 = 1.000.000 (tamamlanan birim yerine üretime başlanan toplam miktarı kullandın)","A":"8.000 × 40 = 320.000 (yalnız işçilik ve genel üretim gideri birim maliyetini kullandın, ilk madde payını atladın)","B":"8.000 × 60 = 480.000 (yalnız direkt ilk madde ve malzeme birim maliyetini kullandın, işçilik-genel üretim gideri payını atladın)"},"hap":"Safha maliyet sisteminde eşdeğer ürün birimi, ilk madde ve malzeme ile işçilik-genel üretim gideri için tamamlanma derecelerine göre AYRI AYRI hesaplanır.","teshis":{"C":{"gercek":"İlk madde genellikle sürecin başında topluca verilirken işçilik ve genel üretim gideri süreç boyunca düzenli eklenir, bu yüzden eşdeğer birimler iki unsur için farklı çıkar.","ayirt":"İki maliyet unsuru için ayrı eşdeğer birim hesapladım mı?","paragraf":"Safha maliyet - eşdeğer ürün birimi yöntemi","yanilgi":"Bu şıkkı eleyen öğrenci, tek bir eşdeğer birim rakamının her iki maliyet unsuruna da uygulanabileceğini sanır."},"E":{"gercek":"Sadece fiilen tamamlanıp mamul ambarına aktarılan birim sayısı toplam birim maliyetle çarpılır, üretime başlanan miktar değil.","ayirt":"Kullandığım miktar gerçekten tamamlanan birim mi, yoksa üretime başlanan mı?","paragraf":"Safha maliyet - eşdeğer ürün birimi yöntemi","yanilgi":"Üretime başlanan tüm birimlerin dönem içinde tamamlandığını varsayıp dönem sonu yarı mamul kalmadığını düşündün."},"A":{"gercek":"Tamamlanan mamulün maliyeti, ilk madde birim maliyeti ile işçilik-genel üretim gideri birim maliyetinin toplamının tamamlanan birim sayısıyla çarpılmasıyla bulunur.","ayirt":"Her iki maliyet unsurunun birim maliyetini de topladım mı?","paragraf":"Safha maliyet - eşdeğer ürün birimi yöntemi","yanilgi":"İlk madde ve malzeme maliyetini hesaba hiç katmadan sadece işçilik ve genel üretim gideri payını mamul maliyeti sandın."},"D":{"gercek":"Eşdeğer birim, tamamlanan birim ile dönem sonu yarı mamulün tamamlanma derecesiyle ağırlıklandırılmış kısmının toplamı olarak hesaplanır.","ayirt":"Dönem sonu yarı mamulü eşdeğer birime kattım mı?","paragraf":"Safha maliyet - eşdeğer ürün birimi yöntemi","yanilgi":"Dönem sonu yarı mamulü tamamlanma derecesiyle çarpıp eşdeğer birime eklemeyi unuttun, sanki hiç yarı mamul yokmuş gibi yalnız tamamlanan birim sayısını eşdeğer birim kabul ettin."},"B":{"gercek":"Toplam birim maliyet, iki maliyet unsurunun ayrı ayrı hesaplanan birim maliyetlerinin toplamıdır; biri eksik kalırsa sonuç eksik çıkar.","ayirt":"Hesaba kattığım birim maliyet iki unsuru da içeriyor mu?","paragraf":"Safha maliyet - eşdeğer ürün birimi yöntemi","yanilgi":"İşçilik ve genel üretim gideri payını unutup yalnız ilk madde ve malzeme birim maliyetini mamul maliyeti sandın."}},"verilen":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]],"donem":2,"hesaplar":{"152":{"ad":"MAMULLER","tanim":"Üretim çalışmaları sonunda elde edilen ve satışa hazır hale gelmiş bulunan mamullerin izlendiği hesaptır. İşleyişi: Bu hesap, üretimi tamamlanan mamullerin ambarlara alınmasıyla borçlandırılır. Satılması veya herhangi bir nedenle ambardan çekilmesi ile alacaklandırılır."},"151":{"ad":"YARI MAMULLER-ÜRETİM","tanim":"Henüz tam mamul haline gelmemiş ancak direkt ilk madde ve malzeme ile direkt işçilik ve genel üretim giderlerinden belli oranlarda pay almış üretim aşamasındaki mamullerin izlendiği hesaptır. İşleyişi: Maliyet dönemi sonunda direkt ilk madde ve malzeme, direkt işçilik ve genel üretim giderleri tutarları kadar bu hesap borçlandırılır."}}},{"capa":{"kaynak":"SGS 2025/3 Soru 61"},"kural":"Gelir tablosu kademeli kurulur; Net Satışlar = Brüt Satışlar - Satış İskontoları, Satılan Mamul Maliyeti = Dönem Başı Mamul + Üretim Maliyeti - Dönem Sonu Mamul, Brüt Satış Kârı = Net Satışlar - Satılan Mamul Maliyeti, Faaliyet Kârı = Brüt Satış Kârı - Faaliyet Giderleri.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 61","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Gelir tablosunu her zaman indirimlerden sonraki net satışlardan başlatıp kademe kademe aşağı in, brüt satışları hiç kullanma.","konu":"satışların maliyeti tablosu","tablo":{"satirlar":[["VERİLENLER","-"],["Brüt satışlar","685.000 TL"],["Satış iskontoları","27.350 TL"],["Dönem başı mamul stoğu","42.500 TL"],["Döneme ait üretim maliyeti","310.000 TL"],["Dönem sonu mamul stoğu","58.750 TL"],["Faaliyet giderleri","96.400 TL"],["HESAP","-"],["Net Satışlar (685.000-27.350)","657.650"],["Satılan Mamul Maliyeti (42.500+310.000-58.750)","293.750"],["Brüt Satış Kârı (657.650-293.750)","363.900"],["Faaliyet Kârı (363.900-96.400)","267.500"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"294.850","E":"561.250","A":"234.750","D":"363.900","B":"267.500"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Net Satışlar (542.000-18.200)","523.800"],["Satılan Ticari Mal Maliyeti (35.600+245.000-41.900)","238.700"],["Brüt Satış Kârı (523.800-238.700)","285.100"],["Faaliyet Kârı (285.100-78.300)","206.800"]]},"tur":"tablo","soru":"İşletme, ticari faaliyetinden elde ettiği gelirlere ilişkin gelir tablosu kalemlerini Tekdüzen düzenine göre kademeli olarak hesaplamaktadır. Döneme ait bilgiler şöyledir: Brüt satışlar 542.000 TL, satış iadeleri 18.200 TL, dönem başı ticari mal stoğu 35.600 TL, dönem içi mal alışları 245.000 TL, dönem sonu ticari mal stoğu 41.900 TL ve faaliyet giderleri 78.300 TL\u0027dir. Buna göre işletmenin faaliyet kârı kaç TL\u0027dir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve işletmenin faaliyet kârının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, üretim faaliyetinden elde ettiği gelirlere ilişkin gelir tablosu kalemlerini Tekdüzen düzenine göre kademeli olarak hesaplamaktadır. Döneme ait bilgiler şöyledir: Brüt satışlar 685.000 TL, satış iskontoları 27.350 TL, dönem başı mamul stoğu 42.500 TL, döneme ait üretim maliyeti 310.000 TL, dönem sonu mamul stoğu 58.750 TL ve faaliyet giderleri 96.400 TL\u0027dir. Buna göre işletmenin faaliyet kârı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-14","verilenler":[{"deger":"685.000 TL","anlam":"Net satışa ulaşmak için indirimlerin düşüleceği başlangıç tutarıdır.","ad":"Brüt satışlar"},{"deger":"27.350 TL","anlam":"Brüt satışlardan düşülerek net satışların bulunmasını sağlar.","ad":"Satış iskontoları"},{"deger":"42.500 TL","anlam":"Satılan mamul maliyeti hesabında üretim maliyetine eklenir.","ad":"Dönem başı mamul stoğu"},{"deger":"310.000 TL","anlam":"Dönem içinde tamamlanan mamullerin maliyetidir, satılan mamul maliyeti hesabına dahildir.","ad":"Döneme ait üretim maliyeti"},{"deger":"58.750 TL","anlam":"Satılan mamul maliyeti hesabında toplamdan çıkarılır.","ad":"Dönem sonu mamul stoğu"},{"deger":"96.400 TL","anlam":"Brüt satış kârından düşülerek faaliyet kârına ulaşılır.","ad":"Faaliyet giderleri"}],"dayanak":"MSUGT Sıra No:1 Tekdüzen Hesap Planı - 60,61,62,63 hesap grupları gelir tablosu akışı","dogru":"B","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Brüt satışlar 685.000 (soruda verilen); Satış iskontoları 27.350 (soruda verilen); Dönem başı mamul stoğu 42.500 (soruda verilen); Üretim maliyeti 310.000 (soruda verilen); Dönem sonu mamul stoğu 58.750 (soruda verilen); Faaliyet giderleri 96.400 (soruda verilen)","anlatim":"Soru bize şunları vermiş: brüt satışlar 685.000, satış iskontoları 27.350, dönem başı mamul stoğu 42.500, üretim maliyeti 310.000, dönem sonu mamul stoğu 58.750, faaliyet giderleri 96.400. Gelir tablosu kademeli hesaplanacak.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]]},{"formul":"Net Satışlar = Brüt Satışlar - Satış İskontoları = 685.000 (soruda verilen) - 27.350 (soruda verilen) = 657.650","anlatim":"Net satış, brüt satıştan iskontoları düşünce çıkar. İskonto müşteriye yapılan indirimdir, satışı azaltır.","doldur":[[8,0],[8,1]]},{"formul":"Satılan Mamul Maliyeti = Dönem Başı Mamul + Üretim Maliyeti - Dönem Sonu Mamul = 42.500 (soruda verilen) + 310.000 (soruda verilen) - 58.750 (soruda verilen) = 293.750","anlatim":"Satılan mamul maliyeti, satılan ürünün gerçek maliyetidir. Dönem başı stok ve üretimi toplayıp elde kalan dönem sonu stoğu çıkarırız.","doldur":[[9,0],[9,1]]},{"formul":"Brüt Satış Kârı = Net Satışlar - Satılan Mamul Maliyeti = 657.650 (2. adımda bulduk) - 293.750 (3. adımda bulduk) = 363.900","anlatim":"Brüt satış kârı, net satıştan malın maliyetini çıkarınca bulunur. Bu kâr henüz faaliyet giderlerini içermez.","doldur":[[10,0],[10,1]]},{"formul":"Faaliyet Kârı = Brüt Satış Kârı - Faaliyet Giderleri = 363.900 (4. adımda bulduk) - 96.400 (soruda verilen) = 267.500","anlatim":"Faaliyet kârı, brüt kârdan pazarlama ve yönetim gibi giderleri düşünce çıkar. Sonuç işletmenin asıl işinden kazandığı kârdır.","doldur":[[11,0],[11,1]]},{"formul":"Sonuç: Faaliyet Kârı = 267.500 TL","anlatim":"İşletmenin faaliyet kârı 267.500 TL\u0027dir. Kademeli hesaplama sonunda bu sonuca ulaştık.","doldur":[]},{"formul":"Yanlış yol: Brüt Satış Kârı = 363.900 (HATALI) → doğrusu 267.500 (5. adımda bulduk)","anlatim":"Faaliyet giderleri çıkarılmazsa sonuç yanlış olur çünkü brüt kâr ile faaliyet kârı farklı kavramlardır. Bu soruda en sık hata brüt kârı faaliyet kârı sanmaktır.","doldur":[]}],"anahtar":[{"ornek":"faaliyet","kok":"faaliy"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"satışlardan","kok":"satışl"},{"ornek":"giderleri","kok":"giderl"},{"ornek":"İskontoları","kok":"İskont"},{"ornek":"satılan","kok":"satıla"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu kalemleri kademeli hesaplatılırken sorulur. Nasıl ölçülür: brüt satışlardan indirimler, sonra satışların maliyeti, sonra faaliyet giderleri sırasıyla düşülerek. Nasıl kaydedilir: her ara sonuç (net satışlar, brüt satış kârı, faaliyet kârı) ayrı satır olarak gelir tablosunda gösterilir.","desen":"Öğrenciler genellikle brüt satışları net satış sanıp iskontoyu unutur ya da satılan mamul maliyetini üretim maliyetiyle karıştırır. Dönem başı ve dönem sonu stok yönü ters kullanılabilir, bu da sonucu tersine çevirir. Bu soru brüt satış kârı ve faaliyet kârı zincirinin kademeli hesaplanması noktasından geliyor (p.28, 2 dönemde çıkmış).","terimler":[{"kaynak":"soruda verilir","tanim":"Brüt satışlardan satış iskontosu gibi indirimler düşüldükten sonra kalan tutar","ad":"Net satışlar","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Dönem başı mamul stoğuna üretim maliyeti eklenip dönem sonu stok düşülerek bulunan tutar","ad":"Satılan mamul maliyeti","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Net satışlardan satılan mamul maliyeti düşüldükten sonra kalan kâr tutarı","ad":"Brüt satış kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Brüt satış kârından faaliyet giderleri düşüldükten sonra kalan kâr tutarı","ad":"Faaliyet kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Brüt satışlar, iskonto, stok ve üretim maliyeti, faaliyet gideri verilip faaliyet kârı istenir.","panel_ornek":"Bir tişört üreticisisin: ayda 40 tişört üretiyorsun, dönem başında elinde 5 tişört, dönem sonunda 8 tişört kaldı. O ay sattığın tişört sayısı 40+5-8=37\u0027dir; işte satışların maliyeti de tam böyle, üretilenden stok farkı düşülerek bulunur.","ornek":"Bir tişört üreticisisin: ayda 40 tişört üretiyorsun, dönem başında elinde 5 tişört, dönem sonunda 8 tişört kaldı. O ay sattığın tişört sayısı 40+5-8=37\u0027dir; işte satışların maliyeti de tam böyle, üretilenden stok farkı düşülerek bulunur.","yontemler":"Sıra: brüt satışlar-iskonto=net satışlar; dönem başı stok+üretim maliyeti-dönem sonu stok=satılan mamul maliyeti; net satışlar-satılan mamul maliyeti=brüt satış kârı; brüt satış kârı-faaliyet gideri=faaliyet kârı. Sıra bozulursa sonuç yanlış çıkar.","nedir":"Satışların maliyeti tablosu, üretim işletmesinde satılan mamullerin maliyetini kademeli biçimde hesaplayan Tekdüzen tablosudur. Sınav bu kademeli hesaplamayı doğru sırayla yapıp yapamadığını ölçer."},"olay":"685.000-27.350=657.650; 42.500+310.000-58.750=293.750; 657.650-293.750=363.900; 363.900-96.400=267.500.","tuzak":{"C":{"ad":"İndirim Atlama Tuzağı","metin":"Satış iskontosunu düşmeden brüt satışlardan doğrudan satılan mamul maliyetini çıkararak 685.000-293.750=391.250 değil, iskonto sonradan yanlış eklenirse 685.000-293.750-96.400=294.850 bulunur. Doğrusu: brüt satış kârı net satışlar üzerinden hesaplanır, brüt satışlar üzerinden değil."},"E":{"ad":"Ara Katman Atlama Tuzağı","metin":"Satılan mamul maliyeti aşamasını tamamen atlayıp net satışlardan doğrudan faaliyet giderlerini düşersin: 657.650-96.400=561.250. Doğrusu: satılan mamul maliyeti düşülmeden brüt satış kârına, dolayısıyla faaliyet kârına ulaşılamaz."},"D":{"ad":"Katman Atlama Tuzağı","metin":"Faaliyet giderlerini düşmeyi unutup brüt satış kârını (657.650-293.750=363.900) faaliyet kârıyla karıştırırsın. Doğrusu: brüt satış kârından faaliyet giderleri düşülmeden faaliyet kârına ulaşılamaz."},"A":{"ad":"Stok Yönü Tuzağı","metin":"Dönem başı ile dönem sonu mamul stoğunu yer değiştirerek satılan mamul maliyetini 58.750 + 310.000 - 42.500 = 326.500 TL bulup 657.650 - 326.500 - 96.400 = 234.750 sonucuna ulaşırsın. Doğrusu: dönem başı stok toplama, dönem sonu stok çıkarmaya dahil edilir."}},"celdiriciYol":{"C":"685.000 - 293.750 - 96.400 = 294.850 (net satış yerine brüt satış kullanılıp iskonto atlandı)","E":"657.650 - 96.400 = 561.250 (satılan mamul maliyeti kademesi tamamen atlandı)","D":"657.650 - 293.750 = 363.900 (faaliyet giderleri düşülmeden brüt kâr faaliyet kârı sanıldı)","A":"657.650 - (58.750+310.000-42.500) - 96.400 = 234.750 (dönem başı/sonu mamul stoğu yönü ters kullanıldı)"},"hap":"Faaliyet kârı, net satışlardan satışların maliyeti ve faaliyet giderleri sırayla düşülerek bulunur; hiçbir kademe atlanamaz.","teshis":{"C":{"gercek":"Brüt satış kârı yalnızca net satışlardan (indirimler düşüldükten sonra) hesaplanır.","ayirt":"İskontoyu düştüm mü, net satışa ulaştım mı?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Brüt satış kârının brüt satışlar üzerinden hesaplanabileceğini sanıyorsun."},"E":{"gercek":"Net satışlardan doğrudan faaliyet giderine geçilemez; satılan mamul maliyeti mutlaka ara kademedir.","ayirt":"Satılan mamul maliyetini hesapladım mı, hangi kademeyi atladım?","paragraf":"THP 620-623","yanilgi":"Satışların maliyeti kademesinin gelir tablosunda zorunlu olmadığını, atlanabileceğini düşünüyorsun."},"A":{"gercek":"Satılan mamul maliyeti dönem başı stok eklenerek, dönem sonu stok çıkarılarak bulunur; Tekdüzen 620 hesabın işleyişi bu yöndedir.","ayirt":"Elimde kalan mi yoksa satılan mi hesaplıyorum, hangi stok başta hangi stok sonda?","paragraf":"THP 620","yanilgi":"Dönem başı ve dönem sonu mamul stoğunun satılan mamul maliyeti formülündeki yerini karıştırıyorsun."},"D":{"gercek":"Faaliyet kârı, brüt satış kârından faaliyet giderleri (630-632) düşülerek bulunur.","ayirt":"Faaliyet giderlerini düştüm mü?","paragraf":"THP 63 Grubu","yanilgi":"Brüt satış kârının doğrudan faaliyet kârına eşit olduğunu düşünüyorsun."},"B":{"gercek":"Gelir tablosu net satışlar - satışların maliyeti - faaliyet giderleri sırasıyla kademeli kurulur.","ayirt":"Her kademeyi sırayla geçtim mi, bir aşamayı atladım mı?","paragraf":"MSUGT Gelir Tablosu Düzeni","yanilgi":"Faaliyet kârına ulaşmak için tüm kademeleri sırayla geçmen gerektiğini, herhangi bir aşamayı atlayamayacağını gözden kaçırıyorsun."}},"verilen":[[8,0],[8,1],[9,0],[9,1],[10,0],[10,1],[11,0],[11,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 63"},"kural":"önce D yan mamulünün net gerçekleşebilir değeri ortak maliyetten düşülür, kalan tutar katsayılı yönteme göre (miktar x katsayı) A ve B\u0027ye dağıtılır, A\u0027ya ayrılma sonrası ek işleme maliyeti eklenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 63","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Dört katmanı sırayla yaz: önce yan ürün NGD\u0027sini düş, sonra eşdeğer birimlerle dağıt, sonra ek işleme maliyetini ekle, en son ton sayısına böl.","konu":"ortak maliyet-katsayılı yöntem","tablo":{"satirlar":[["VERİLENLER","-"],["Toplam ortak maliyet","180.000 TL"],["D üretim miktarı","4 ton"],["D satış fiyatı","3.000 TL/ton"],["D ek işleme maliyeti","2.000 TL"],["A üretim miktarı ve katsayısı","10 ton, katsayı 2"],["B üretim miktarı ve katsayısı","15 ton, katsayı 4"],["A ek işleme maliyeti","7.500 TL"],["HESAP","-"],["D yan mamulü net gerçekleşebilir değeri (4x3.000-2.000)","10.000"],["Dağıtıma esas kalan ortak maliyet (180.000-10.000)","170.000"],["Eşdeğer birim A (10x2)","20"],["Eşdeğer birim B (15x4)","60"],["Toplam eşdeğer birim (20+60)","80"],["Birim eşdeğer maliyet (170.000/80)","2.125"],["A mamulü ortak maliyet payı (20x2.125)","42.500"],["A mamulü toplam maliyet (42.500+7.500)","50.000"],["A mamulü ton başına maliyet (50.000/10)","5.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"5.000","E":"7.550","A":"4.250","D":"5.250","B":"4.950"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["R yan mamulü net gerçekleşebilir değeri (5x2.500-2.500)","10.000"],["Dağıtıma esas kalan ortak maliyet (250.000-10.000)","240.000"],["Eşdeğer birim P (15x2)","30"],["Eşdeğer birim Q (18x5)","90"],["Toplam eşdeğer birim (30+90)","120"],["Birim eşdeğer maliyet (240.000/120)","2.000"],["Q mamulü ortak maliyet payı (90x2.000)","180.000"],["Q mamulü toplam maliyet (180.000+9.000)","189.000"],["Q mamulü ton başına maliyet (189.000/18)","10.500"]]},"tur":"tablo","soru":"İşletme, tek bir hammaddeden P ve Q ana mamulleri ile R yan mamulünü üretmekte, ortak maliyetlerin dağıtımında katsayılı yöntemi kullanmakta ve R yan mamulünün net gerçekleşebilir değerini ortak maliyetten düşerek hesaplama yapmaktadır. Dönemde toplam ortak maliyet 250.000 TL\u0027dir. R yan mamulü 5 ton üretilmiş, ton başına 2.500 TL\u0027den satılmakta, satılabilir hale getirilmesi için toplam 2.500 TL ek işleme maliyeti yapılmaktadır. P mamulü 15 ton (katsayı 2), Q mamulü 18 ton (katsayı 5) üretilmiş olup Q mamulüne ayrılma noktası sonrasında toplam 9.000 TL ek işleme maliyeti yüklenmiştir. Buna göre, Q mamulünün ton başına maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve Q mamulünün ton başına maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, tek bir hammaddeden A ve B ana mamulleri ile D yan mamulünü üretmekte, ortak maliyetlerin dağıtımında katsayılı yöntemi kullanmakta ve D yan mamulünün net gerçekleşebilir değerini ortak maliyetten düşerek hesaplama yapmaktadır. Dönemde toplam ortak maliyet 180.000 TL\u0027dir. D yan mamulü 4 ton üretilmiş, ton başına 3.000 TL\u0027den satılmakta, satılabilir hale getirilmesi için toplam 2.000 TL ek işleme maliyeti yapılmaktadır. A mamulü 10 ton (katsayı 2), B mamulü 15 ton (katsayı 4) üretilmiş olup A mamulüne ayrılma noktası sonrasında toplam 7.500 TL ek işleme maliyeti yüklenmiştir. Buna göre, A mamulünün ton başına maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-maliyet-zor/kp-15","verilenler":[{"deger":"180.000 TL","anlam":"Ayrılma noktasına kadar oluşan ve tüm mamullere paylaştırılacak toplam maliyet.","ad":"Toplam ortak maliyet"},{"deger":"4 ton","anlam":"Yan mamulün net gerçekleşebilir değerini hesaplamak için gereken miktar.","ad":"D üretim miktarı"},{"deger":"3.000 TL/ton","anlam":"Yan mamulün tahmini satış değerini bulmak için kullanılır.","ad":"D satış fiyatı"},{"deger":"2.000 TL","anlam":"Yan mamulün satılabilir hale getirilmesi için katlanılan, satış değerinden düşülecek maliyet.","ad":"D ek işleme maliyeti"},{"deger":"10 ton, katsayı 2","anlam":"A mamulünün eşdeğer birimini bulmak için kullanılır.","ad":"A üretim miktarı ve katsayısı"},{"deger":"15 ton, katsayı 4","anlam":"B mamulünün eşdeğer birimini bulmak için kullanılır, toplam eşdeğer birime dahil edilir.","ad":"B üretim miktarı ve katsayısı"},{"deger":"7.500 TL","anlam":"A mamulüne ayrılma noktası sonrasında doğrudan yüklenen ve ortak maliyet payına eklenen maliyet.","ad":"A ek işleme maliyeti"}],"dayanak":"Teori Notu - birleşik maliyette katsayılı bölme yöntemi; Teori Notu - yan ürün maliyetinde ters hesaplama","dogru":"C","oyunBonus":null,"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Toplam ortak maliyet 180.000 TL (soruda verilen); D üretimi 4 ton (soruda verilen); D satış fiyatı 3.000 TL/ton (soruda verilen); D ek işleme maliyeti 2.000 TL (soruda verilen); A miktarı 10 ton, katsayı 2 (soruda verilen); B miktarı 15 ton, katsayı 4 (soruda verilen); A ek işleme maliyeti 7.500 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: toplam ortak maliyet, D yan mamulünün miktarı ve satış fiyatı, ek işleme maliyetleri, A ve B\u0027nin miktar ve katsayıları.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1]]},{"formul":"D net gerçekleşebilir değeri = (miktar × satış fiyatı) − ek işleme maliyeti = (4 (soruda verilen) × 3.000 (soruda verilen)) − 2.000 (soruda verilen) = 10.000","anlatim":"Yan mamul, ana mamullerin yanında istemeden çıkan ve değeri düşük olan üründür. D\u0027nin satışından beklenen net kazanç, ortak maliyetten düşülür - çünkü D kendi parasını kendi öder.","doldur":[[9,1]]},{"formul":"Dağıtıma esas ortak maliyet = Toplam ortak maliyet − D net gerçekleşebilir değeri = 180.000 (soruda verilen) − 10.000 (2. adımda bulduk) = 170.000","anlatim":"D\u0027nin değeri toplam ortak maliyetten düşülüyor ki geriye yalnız A ve B\u0027ye dağıtılacak tutar kalsın. Bu adım katsayılı yönteme giriş kapısıdır.","doldur":[[10,1]]},{"formul":"Eşdeğer birim A = miktar × katsayı = 10 (soruda verilen) × 2 (soruda verilen) = 20","anlatim":"Katsayılı yöntemde her mamulün gerçek miktarı katsayıyla çarpılıp eşdeğer birime çevrilir. A\u0027nın katsayısı 2, yani her tonu iki birim ağırlık taşır.","doldur":[[11,1]]},{"formul":"Eşdeğer birim B = miktar × katsayı = 15 (soruda verilen) × 4 (soruda verilen) = 60","anlatim":"Aynı işlemi B için de yapıyoruz - B\u0027nin katsayısı 4 olduğu için birim değeri daha yüksek sayılır.","doldur":[[12,1]]},{"formul":"Toplam eşdeğer birim = Eşdeğer birim A + Eşdeğer birim B = 20 (4. adımda bulduk) + 60 (5. adımda bulduk) = 80","anlatim":"Ortak maliyeti paylaştırmadan önce toplam eşdeğer birimi buluyoruz - pay bu toplama göre bölünecek.","doldur":[[13,1]]},{"formul":"Birim eşdeğer maliyet = Dağıtıma esas ortak maliyet / Toplam eşdeğer birim = 170.000 (3. adımda bulduk) / 80 (6. adımda bulduk) = 2.125","anlatim":"Şimdi bir eşdeğer birime düşen ortak maliyeti buluyoruz - bu, dağıtımın anahtar rakamıdır.","doldur":[[14,1]]},{"formul":"A mamulü ortak maliyet payı = Eşdeğer birim A × Birim eşdeğer maliyet = 20 (4. adımda bulduk) × 2.125 (7. adımda bulduk) = 42.500","anlatim":"A\u0027nın eşdeğer birimini bu birim maliyetle çarpınca A\u0027ya düşen ortak maliyet payını buluruz.","doldur":[[15,1]]},{"formul":"A mamulü toplam maliyet = A ortak maliyet payı + A ek işleme maliyeti = 42.500 (8. adımda bulduk) + 7.500 (soruda verilen) = 50.000","anlatim":"A, ayrılma noktasından sonra ek işlemden geçiyor - bu maliyet A\u0027nın toplam maliyetine ayrıca eklenir.","doldur":[[16,1]]},{"formul":"A mamulü ton başına maliyet = A toplam maliyet / miktar = 50.000 (9. adımda bulduk) / 10 (soruda verilen) = 5.000 TL","anlatim":"Toplam maliyeti üretilen ton sayısına bölünce A\u0027nın ton başına maliyetine ulaşırız - soru bunu istiyor.","doldur":[[17,1]]},{"formul":"Ters durum: B mamulünün ton başına maliyeti sorulsaydı → B ortak maliyet payı = 60 × 2.125 = 127.500, sonra 15 tona bölünürdü","anlatim":"Aynı yöntem B için de işler ama B\u0027de A ek işleme maliyeti eklenmez, B kendi ek işleme maliyetiyle (varsa) hesaplanır.","doldur":[]},{"formul":"Yanlış yol: 180.000 / 80 = 2.250; 2.250 × 20 = 45.000; (45.000+7.500)/10 = 5.250 (HATALI) → doğrusu 5.000 TL (10. adımda bulduk)","anlatim":"En sık hata: öğrenciler D\u0027nin net gerçekleşebilir değerini düşmeyi unutup 180.000\u0027i doğrudan 80 eşdeğer birime bölerler.","doldur":[]}],"anahtar":[{"ornek":"maliyetten","kok":"maliye"},{"ornek":"katsayılı","kok":"katsay"},{"ornek":"değeri","kok":"değeri"},{"ornek":"eşdeğer","kok":"eşdeğe"},{"ornek":"miktar","kok":"miktar"},{"ornek":"yöntemde","kok":"yöntem"}],"konuGiris":{"harita":"Ne zaman test edilir: yan ürün net gerçekleşebilir değeri ortak maliyetten düşüldükten sonra kalan tutar katsayılı yönteme göre ana ürünlere dağıtılırken. Nasıl ölçülür: her ana ürünün miktarı katsayısıyla çarpılıp eşdeğer birim bulunur, kalan ortak maliyet toplam eşdeğer birime bölünüp birim maliyet elde edilir. Nasıl kaydedilir: bulunan pay, ürüne ait ayrılma sonrası ek işleme maliyetiyle toplanıp toplam ton sayısına bölünerek birim maliyet raporlanır.","desen":"Sınav önce yan ürünün net gerçekleşebilir değerini ortak maliyetten düşürtür, sonra kalan tutarı katsayılı yöntemle ana ürünlere dağıttırır. Tuzak, ayrılma sonrası ek işleme maliyetinin dağıtıma girmeyip doğrudan ilgili ürüne eklenmesidir. Bu soru p.28 katsayılı bölme yöntemi noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Satış tutarından ek işleme maliyeti düşülünce kalan tutar","ad":"Net gerçekleşebilir değer (yan ürün)","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Ürün miktarı ile teknik katsayının çarpımından oluşan ağırlıklı miktar","ad":"Eşdeğer birim","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Ürünler arası kalite/değer farkını yansıtan teknik ağırlık faktörü","ad":"Katsayı","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Ayrılma noktası sonrası doğrudan ürüne yüklenen maliyet","ad":"Ek işleme maliyeti","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Toplam ortak maliyet, yan ürün bilgileri ve ana ürünlerin miktar-katsayı-ek maliyet bilgileri verilir, ana ürünün ton başına maliyeti istenir.","panel_ornek":"Bir fırın aynı hamurdan büyük ve küçük ekmek yapıyor; büyük ekmeğe katsayı 2, küçüğe katsayı 1 veriliyor. Toplam un maliyeti 200 TL, büyük ekmek 30 adet küçük ekmek 40 adet ise, maliyet adet değil bu ağırlıklı sayıya göre bölünüyor.","ornek":"Bir fırın aynı hamurdan büyük ve küçük ekmek yapıyor; büyük ekmeğe katsayı 2, küçüğe katsayı 1 veriliyor. Toplam un maliyeti 200 TL, büyük ekmek 30 adet küçük ekmek 40 adet ise, maliyet adet değil bu ağırlıklı sayıya göre bölünüyor.","yontemler":"Önce yan ürünün net gerçekleşebilir değeri bulunup ortak maliyetten düşülür; sonra kalan tutar eşdeğer birim oranında paylaştırılıp ürüne özel ek maliyet eklenerek birim maliyet bulunur.","nedir":"Ortak maliyet-katsayılı yöntem, tek üretim sürecinden çıkan farklı ürünlere ortak maliyeti teknik bir ağırlık ölçüsüyle paylaştırır. Sınav bu paylaşımın doğru hesaplanıp hesaplanmadığını ölçer."},"olay":"D NGD=4x3.000-2.000=10.000; kalan ortak maliyet=180.000-10.000=170.000; eşdeğer birim A=10x2=20, B=15x4=60, toplam=80; birim eşdeğer maliyet=170.000/80=2.125; A payı=20x2.125=42.500; A toplam maliyet=42.500+7.500=50.000; ton başına=50.000/10=5.000.","tuzak":{"D":{"ad":"Yan Ürünü Yok Sayma Tuzağı","metin":"D yan mamulünün net gerçekleşebilir değerini ortak maliyetten hiç düşmeden, 180.000 TL\u0027nin tamamını A ve B\u0027ye katsayılı yöntemle dağıtıyorsun. Doğrusu: dağıtıma esas tutar, yan ürün değeri düşüldükten sonraki 170.000 TL olmalıdır."},"E":{"ad":"Yöntem Karıştırma Tuzağı","metin":"Katsayılı yöntem yerine fiziksel ölçü (miktar) yöntemini uygulayıp ortak maliyeti yalnızca ton oranına göre paylaştırıyorsun. Doğrusu: katsayılı yöntemde dağıtım anahtarı miktar değil, miktar ile katsayının çarpımından oluşan eşdeğer birimdir."},"A":{"ad":"Ek İşleme Maliyetini Atlama Tuzağı","metin":"A mamulüne isabet eden ortak maliyet payını doğrudan ton sayısına bölüp ayrılma sonrası 7.500 TL\u0027lik ek işleme maliyetini eklemeyi unutuyorsun. Doğrusu: ek işleme maliyeti toplam maliyete eklendikten sonra ton sayısına bölünür."},"B":{"ad":"Yan Ürün Değerini Yanlış Ölçme Tuzağı","metin":"D yan mamulünün satılabilir hale getirilmesi için katlanılan 2.000 TL\u0027lik ek işleme maliyetini düşmeden, D\u0027nin tüm satış değerini (12.000 TL) ortak maliyetten düşüyorsun. Doğrusu: ortak maliyetten yalnız net gerçekleşebilir değer (satış değeri eksi ek işleme maliyeti) düşülür."}},"celdiriciYol":{"D":"180.000/80=2.250; 20x2.250=45.000; 45.000+7.500=52.500; 52.500/10=5.250 (yan ürünün net gerçekleşebilir değeri ortak maliyetten hiç düşülmedi)","E":"170.000x(10/25)=68.000; 68.000+7.500=75.500; 75.500/10=7.550 (katsayı yerine fiziksel miktar oranı kullanıldı)","A":"170.000/80=2.125; 20x2.125=42.500; 42.500/10=4.250 (ek işleme maliyeti eklenmeden bölündü)","B":"180.000-12.000=168.000; 168.000/80=2.100; 20x2.100=42.000; 42.000+7.500=49.500; 49.500/10=4.950 (yan ürünün ek işleme maliyeti düşülmeden tam satış değeri düşüldü)"},"hap":"Katsayılı yöntemde dağıtım anahtarı eşdeğer birimdir (miktar x katsayı); yan ürünün net gerçekleşebilir değeri önce ortak maliyetten düşülür, ayrılma sonrası ek işleme maliyeti ise dağıtım payına ayrıca eklenir.","teshis":{"C":{"gercek":"Katsayılı yöntemde eşdeğer birim = miktar x katsayı; dağıtıma esas tutar yan ürün net gerçekleşebilir değeri düşüldükten sonraki kalan ortak maliyettir; sonuca ek işleme maliyeti eklenir.","ayirt":"Dört katmanı da sırasıyla uyguladım mı: yan ürün düşme, katsayılı dağıtım, ek işleme ekleme, ton başına bölme?","paragraf":"Teori Notu - birleşik maliyette katsayılı bölme yöntemi","yanilgi":"Bu şıkkı eleyen öğrenci, dört katmanı (yan ürün NGD düşme, katsayılı dağıtım, ek işleme ekleme, ton başına bölme) tek adımda birleştirilebileceğini düşünüp kısayol arar ve hata yapar."},"E":{"gercek":"Katsayılı yöntemde dağıtım anahtarı miktar değil, miktar ile teknik/fiziksel katsayının çarpımı olan eşdeğer birimdir; bu, fiziksel ölçü yönteminin geliştirilmiş halidir.","ayirt":"Dağıtımı yaparken katsayıyı miktarla çarptım mı, yoksa yalnız miktar oranını mı kullandım?","paragraf":"Teori Notu - birleşik maliyette katsayılı bölme yöntemi","yanilgi":"Katsayılı yöntem ile fiziksel ölçü (miktar) yönteminin aynı şey olduğunu sanıyorsun."},"A":{"gercek":"Ayrılma noktasından sonraki maliyetler her ürüne doğrudan yüklenir; katsayılı dağıtım payına eklenerek toplam maliyet bulunur.","ayirt":"Bu maliyet ayrılma noktasından önce mi sonra mı oluştu, ve toplam maliyete eklendi mi?","paragraf":"Teori Notu - birleşik (ortak) maliyet, ayrılma noktası sonrası maliyetler","yanilgi":"Ayrılma noktasından sonraki ek işleme maliyetinin de A\u0027nın maliyetine dahil edilmesi gerektiğini atlıyorsun."},"D":{"gercek":"Yan ürünün net gerçekleşebilir değeri, dağıtıma esas ortak maliyeti bulmak için önce ortak maliyetten düşülmelidir ,"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Yıllık itfa payı (400.000/4)","100.000"],["İtfa edilen yıl sayısı (2024-2025)","2 yıl"],["Birikmiş itfa tutarı (100.000×2)","200.000"],["2026 yılında gider yazılacak kalan tutar (400.000-200.000)","200.000"]]},"tur":"tablo","soru":"İşletme, 2024 yılı başında kiraladığı işyerinde 213 sayılı Vergi Usul Kanununun 272 nci maddesi kapsamında iktisadi değeri sürekli olarak yükselten bir harcama yapmış ve tutarı özel maliyet olarak değerlemiştir. Özel maliyet tutarı 400.000 TL olup kira süresi 4 yıldır; işletme özel maliyeti kira süresine göre eşit yüzdelerle itfa etmektedir. Kira sözleşmesi süresi dolmadan 2026 yılında sona ermiş ve işyeri boşaltılmıştır. Buna göre 2026 yılında gider yazılacak özel maliyet tutarı kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve 2026 yılında gider yazılacak özel maliyet tutarının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, 2023 yılı başında kiraladığı işyerinde 213 sayılı Vergi Usul Kanununun 272 nci maddesi kapsamında iktisadi değeri sürekli olarak yükselten bir harcama yapmış ve tutarı özel maliyet olarak değerlemiştir. Özel maliyet tutarı 300.000 TL olup kira süresi 5 yıldır; işletme özel maliyeti kira süresine göre eşit yüzdelerle itfa etmektedir. Kira sözleşmesi süresi dolmadan 2026 yılında sona ermiş ve işyeri boşaltılmıştır. Buna göre 2026 yılında gider yazılacak özel maliyet tutarı kaç TL\u0027dir?","kayitBaslik":"1) 2026 - Kalan özel maliyetin gider yazılması","id":"sgs-t1-maliyet-zor/kp-17","verilenler":[{"deger":"300.000 TL","anlam":"Kiracının işyerinde yaptığı, değeri sürekli yükselten harcamanın toplam tutarı; itfaya esas ana büyüklüktür.","ad":"Özel maliyet tutarı"},{"deger":"5 yıl","anlam":"Özel maliyetin eşit yüzdelerle itfa edileceği toplam süre; yıllık payı bulmak için tutar buna bölünür.","ad":"Kira süresi"},{"deger":"2023","anlam":"İtfaya başlanan ilk yıl; kaç yıl itfa edildiğinin sayılmasında başlangıç noktasıdır.","ad":"Kiralama başlangıç yılı"},{"deger":"2026","anlam":"Sözleşmenin süresi dolmadan sona erdiği ve kalan tutarın tek seferde gider yazılacağı yıl.","ad":"Sona erme yılı"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.327","dogru":"C","oyunBonus":{"soru":"İşletme, 2023 yılı başında kiraladığı işyerinde 213 sayılı Vergi Usul Kanununun 272 nci maddesi kapsamında iktisadi değeri sürekli olarak yükselten bir harcama yapmış ve tutarı özel maliyet olarak değerlemiştir. Özel maliyet tutarı 600.000 TL olup kira süresi 5 yıldır; işletme özel maliyeti kira süresine göre eşit yüzdelerle itfa etmektedir. Kira sözleşmesi süresi dolmadan 2026 yılında sona ermiş ve işyeri boşaltılmıştır. Buna göre 2026 yılında gider yazılacak özel maliyet tutarı kaç TL\u0027dir?","tur":"olcek","kayit":[{"tutar":"240.000","taraf":"B","hesap":"770 GENEL YÖNETİM GİDERLERİ"},{"tutar":"240.000","taraf":"A","hesap":"264 ÖZEL MALİYETLER"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Özel maliyet tutarı 300.000 TL (soruda verilen); Kira süresi 5 yıl (soruda verilen); İtfa edilen yıl sayısı 3 yıl (soruda verilen)","anlatim":"Soru bize şunları vermiş: özel maliyet tutarı 300.000 TL, kira süresi 5 yıl, itfa 2023-2024-2025 olmak üzere 3 yıl yapılmış. Sözleşme 2026\u0027da bitmiş ve işyeri boşaltılmış.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[6,1],[7,0],[8,0]]},{"formul":"Kapsam: özel maliyet, kiracının yaptığı ve kira süresine bölünerek itfa edilen değer artırıcı harcamadır","anlatim":"Özel maliyet nedir? İşyerini kiracının değerini artırmak için yaptığı, kira süresine göre eşit yüzdelerle itfa edilen harcamadır. Vergi Usul Kanunu md.272 bu harcamayı gider değil aktif kalem sayar.","doldur":[[7,1]]},{"formul":"Yıllık İtfa Payı = Özel Maliyet Tutarı / Kira Süresi = 300.000 (soruda verilen) / 5 (soruda verilen) = 60.000 TL","anlatim":"Şimdi yıllık itfa payını hesaplıyoruz. Toplam tutarı kira süresine bölüyoruz çünkü itfa eşit yüzdelerle yapılıyor.","doldur":[[6,1]]},{"formul":"Birikmiş İtfa Tutarı = Yıllık İtfa Payı × İtfa Edilen Yıl Sayısı = 60.000 (3. adımda bulduk) × 3 (soruda verilen) = 180.000 TL","anlatim":"2023, 2024 ve 2025 yılları normal itfa yıllarıdır, üç kez pay ayrılmış. Bu üç yılın toplam itfasını buluyoruz.","doldur":[[8,0],[8,1]]},{"formul":"2026 Gider Tutarı = Özel Maliyet Tutarı − Birikmiş İtfa Tutarı = 300.000 (soruda verilen) − 180.000 (4. adımda bulduk) = 120.000 TL","anlatim":"2026\u0027da sözleşme erken bitip işyeri boşaltılınca kalan itfa edilmemiş kısım tek seferde gider yazılır. Bu yüzden toplam tutardan birikmiş itfayı çıkarıyoruz.","doldur":[[9,0],[9,1]]},{"formul":"SONUÇ: 2026 Yılı Gideri = 120.000 TL","anlatim":"Sonuç: 2026 yılında gider yazılacak özel maliyet tutarı 120.000 TL\u0027dir. Bu tutar kira süresi dolmadan boşaltma yüzünden bir kerede giderleşir.","doldur":[]},{"formul":"Ters durum: kira süresi normal dolarak bitseydi → 5. yıl gideri 60.000 TL olurdu, kalan tutar diye ayrıca gider doğmazdı","anlatim":"Ters durumda kira süresi dolduktan sonra normal şekilde bitseydi, son yıl da normal 60.000 TL\u0027lik pay itfa edilirdi. Erken bitiş özel maliyeti tek seferde gider yazdırır, bu farkı yaratır.","doldur":[]},{"formul":"Yanlış yol: 300.000 (soruda verilen) tamamı gider = 300.000 TL (HATALI) → doğrusu 120.000 TL (5. adımda bulduk)","anlatim":"En sık hata: öğrenciler 300.000 TL\u0027nin tamamının 2026\u0027da gider yazılacağını sanır. Oysa 2023-2024-2025 yıllarında zaten 180.000 TL itfa edilmiş, sadece kalan kısım boşaltma yılında giderleşir.","doldur":[]}],"anahtar":[{"ornek":"boşaltmada","kok":"boşalt"},{"ornek":"süresi","kok":"süresi"},{"ornek":"maliyet","kok":"maliye"},{"ornek":"yılında","kok":"yılınd"},{"ornek":"edilmemiş","kok":"edilme"},{"ornek":"yılları","kok":"yıllar"}],"konuGiris":{"harita":"Ne zaman test edilir: Kira veya işletme hakkı süresi dolmadan gayrimenkul boşaltıldığında ya da hak sona erdiğinde. Nasıl ölçülür: Toplam özel maliyet tutarından o ana kadar itfa edilmiş kısım düşülerek kalan bulunur. Nasıl kaydedilir: Kalan tutarın tamamı, boşaltma veya sona erme yılında tek seferde gider yazılır.","desen":"Soru genelde toplam tutarı ve süreyi verip, sözleşmenin erken bitmesiyle kalan tutarın kaderini sorar; tuzak, kalan tutarı hâlâ yıllara bölmeye çalışmaktır. Öğrenciler sıklıkla geçmiş yıl itfa paylarını çıkarmayı unutur ve tüm tutarı gider yazar. Bu soru Vergi Usul Kanunu m.327\u0027nin erken bitiş hükmü noktasından geliyor (arşivde 1 dönem çıkmış).","terimler":[{"kaynak":"soruda verilir","tanim":"Kiracının kiralanan yerin değerini kalıcı artıran harcamasının değerlenmiş tutarı","ad":"Özel maliyet bedeli","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Özel maliyetin eşit yüzdelerle giderleştirileceği, kira sözleşmesine bağlı süre","ad":"İtfa süresi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Özel maliyet tutarının kira süresine bölünmesiyle bulunan eşit yıllık pay","ad":"Yıllık itfa payı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Toplam özel maliyetten geçmiş yıllarda ayrılan payların düşülmesinden kalan kısım","ad":"Kalan (itfa edilmemiş) tutar","kim":"kanun sabitler"}],"sinavda":"Toplam özel maliyet tutarı, kira süresi ve sözleşmenin erken bittiği yıl verilir; o yıl gider yazılacak tutar istenir.","panel_ornek":"Ali\u0027nin kiraladığı dükkanın vitrinine 10.000 TL harcayıp 5 yılda eşit olarak gider yazması planlanmıştı; ama 3. yılda dükkanı boşalttı. Kalan 2 yıllık pay olan 4.000 TL, o yıl tek seferde gider yazılır, sonraki yıllara bölünmez.","ornek":"Ali\u0027nin kiraladığı dükkanın vitrinine 10.000 TL harcayıp 5 yılda eşit olarak gider yazması planlanmıştı; ama 3. yılda dükkanı boşalttı. Kalan 2 yıllık pay olan 4.000 TL, o yıl tek seferde gider yazılır, sonraki yıllara bölünmez.","yontemler":"Önce yıllık eşit pay bulunur, geçmiş yıllara ait paylar toplamdan düşülür; kalan tutarın tamamı erken bitiş yılında tek seferde gider yazılır.","nedir":"Özel maliyet, kiracının kiralanan yeri iyileştirmek için yaptığı ve kira süresine yayılarak itfa edilen harcamadır. Sınav, kira sözleşmesi süre dolmadan bitince kalan tutarın nasıl gider yazılacağını ölçer."},"olay":"Yıllık pay 300.000/5=60.000; 2023-2024-2025 üç yıl itfa edilmiş=180.000; kalan=300.000-180.000=120.000.","tuzak":{"D":{"ad":"Ters Yön Tuzağı","metin":"Öğrenci birikmiş itfa tutarını (60.000×3=180.000) sona erme yılında yazılacak gider sanır, hesabın kalan kısmı istediğini unutur. Doğrusu: 180.000 TL zaten itfa edilmiştir, gider yazılacak olan bunun tersi olan kalan 120.000 TL\u0027dir."},"E":{"ad":"Fazla Yıl Sayma Tuzağı","metin":"Öğrenci boşaltmanın gerçekleştiği 2026 yılını da tam itfa yılı sayıp 60.000×4=240.000 tutarını itfa edilmiş kabul eder ve yanlışlıkla bu tutarı yanıt yazar. Doğrusu: Boşaltma yılı ayrı bir itfa yılı değildir, o yıl kalan tüm tutar tek seferde gider yazılır."},"A":{"ad":"Yıllık İtfa Payı Tuzağı","metin":"Öğrenci yalnızca bir yıllık itfa payını (300.000/5=60.000) sona erme yılında yazılacak tutar sanır. Doğrusu: Sona erme yılında yıllık pay değil, henüz itfa edilmemiş TÜM kalan tutar gider yazılır."},"B":{"ad":"Süre Karıştırma Tuzağı","metin":"Öğrenci kira süresini 5 yıl yerine 4 yıl alıp yıllık payı 300.000/4=75.000 hesaplar, kalanı da buna göre bulur. Doğrusu: Kira süresi soruda 5 yıl olarak verilmiştir, yıllık pay 60.000 TL\u0027dir."}},"celdiriciYol":{"D":"60.000 × 3 = 180.000 (birikmiş itfa tutarını gider yazılacak tutar sandı - ters yön)","E":"60.000 × 4 = 240.000 (boşaltma yılını da itfa edilmiş yıl sayarak fazla yıl hesapladı)","A":"300.000 / 5 = 60.000 (yalnızca bir yıllık itfa payını sona erme yılı gideri sandı)","B":"300.000 / 4 = 75.000; 300.000 - (75.000×3) = 75.000 (kira süresini yanlış aldı)"},"hap":"Kira süresi dolmadan boşaltmada, henüz itfa edilmemiş özel maliyet tutarının tamamı boşaltma yılında tek seferde gider yazılır.","teshis":{"C":{"gercek":"Toplam özel maliyetten birikmiş itfa düşülerek kalan (henüz itfa edilmemiş) tutar bulunur ve bu tutar boşaltma yılında gider yazılır.","ayirt":"Sorulan, itfa edilmiş kısım mı, yoksa henüz edilmemiş kısım mı?","paragraf":"m.327","yanilgi":"Bu şıkkı eleyen öğrenci, birikmiş itfa ile kalan tutarı karıştırıp yanlış yöne gider."},"E":{"gercek":"Süre dolmadan sona erme durumunda, sona erme yılı ayrı bir itfa dönemi değildir; o yıl kalan tutar toplu olarak gider yazılır.","ayirt":"Boşaltma yılını normal bir itfa yılı gibi mi saydım?","paragraf":"m.327","yanilgi":"Sözleşmenin fiilen sona erdiği yılı da tam bir itfa yılı sayarak yıl sayısını bir fazla alıyorsun."},"A":{"gercek":"Vergi Usul Kanunu m.327 uyarınca süre dolmadan boşaltmada normal itfa akışı kesilir, kalan tutarın TAMAMI o yıl gider yazılır.","ayirt":"Bu yıl normal itfa mı devam ediyor, yoksa sözleşme mi sona erdi?","paragraf":"m.327","yanilgi":"Sona erme yılında da sanki normal itfa devam ediyormuş gibi yalnızca bir yıllık payın gider yazılacağını düşünüyorsun."},"D":{"gercek":"Birikmiş itfa tutarı zaten önceki yıllarda gider yazılmıştır; bu yıl yazılacak olan geriye kalan kısımdır.","ayirt":"Bu tutar geçmişte mi yazıldı, bu yıl mı yazılacak?","paragraf":"m.327","yanilgi":"Hesapladığın ara sonucu (birikmiş itfa) doğrudan cevap sanıyorsun, son adımı atlıyorsun."},"B":{"gercek":"İtfa süresi olarak yalnızca soruda verilen kira süresi (5 yıl) esas alınır.","ayirt":"Soruda verilen süreyi mi kullandım, yoksa aklımdaki bir sayıyı mı?","paragraf":"m.327","yanilgi":"Soruda açıkça verilen kira süresini dikkatsizce farklı bir sayıyla karıştırıyorsun."}},"verilen":[[6,1],[7,0],[8,0],[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{"264":{"ad":"ÖZEL MALİYETLER","tanim":"Kiralanan gayri menkullerin geliştirilmesi veya ekonomik değerinin sürekli olarak artırılması amacıyla yapılan giderler ile (normal bakım, onarım ve temizleme giderleri hariç) bu gayrimenkulun kullanılması için yapılıp kira süresinin sonunda mal sahibine bırakılacak olan, varlıkların bedellerini kapsar."},"770":{"ad":"Genel Yönetim Giderleri","tanim":"Bir işletmenin yönetim fonksiyonları, işletme politikasının tayini, organizasyon ve kadro kuruluşu, büro hizmetleri, kamu ilişkileri, güvenlik, hukuk işleri, personel işleri, kredi ve tahsilatı da kapsayan muhasebe ve mali işler servislerinin giderleri bu hesaba borç kaydedilir."}}},{"capa":null,"kural":"213 sayılı Vergi Usul Kanununun 327 nci maddesine göre kira süresi tamamlanmadan boşaltılan gayrimenkulde henüz itfa edilmemiş özel maliyet tutarı, boşaltmanın gerçekleştiği dönemde tamamen gider yazılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"180.000","taraf":"B","hesap":"268 BİRİKMİŞ AMORTİSMANLAR (-)"},{"tutar":"120.000","taraf":"B","hesap":"689 DİĞER OLAĞANDIŞI GİDER VE ZARARLAR"},{"tutar":"300.000","taraf":"A","hesap":"264 ÖZEL MALİYETLER"}],"teori":false,"taktik":"Önce yıllık itfa payını bul, sonra geçen yıl sayısıyla çarpıp birikmiş itfayı çıkar; kalanı tek kalemde gider yaz.","konu":"özel maliyet itfasi","tablo":{"satirlar":[["VERİLENLER","-"],["Özel maliyet tutarı","300.000 TL"],["Kira süresi","5 yıl"],["İtfa edilen yıl sayısı","3 yıl (2023, 2024, 2025)"],["HESAP","-"],["Yıllık itfa payı (300.000/5)","60.000"],["Birikmiş itfa (60.000×3)","180.000"],["Boşaltma döneminde gider yazılacak tutar (300.000-180.000)","120.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"120.000","E":"240.000","A":"60.000","D":"180.000","B":"100.000"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Yıllık itfa payı (400.000/4)","100.000"],["Birikmiş itfa (100.000×3)","300.000"],["Boşaltma döneminde gider yazılacak tutar (400.000-300.000)","100.000"]]},"tur":"tablo","soru":"İşletme, bir gerçek kişiden kira ile kullandığı fabrika binasında iktisadi kıymeti artıran tadilat yaptırmış ve bu harcamayı özel maliyet olarak aktifleştirmiştir. Kira süresi 4 yıl olup özel maliyet tutarı kira süresine göre eşit yüzdelerle itfa edilmektedir. Özel maliyet tutarı 400.000 TL\u0027dir. Kiralamanın başladığı 2023 yılından itibaren 2023, 2024 ve 2025 hesap dönemlerinde itfa payları düzenli olarak ayrılmış, ancak kira sözleşmesi sona ermeden fabrika 2026 yılı içerisinde boşaltılmıştır. Buna göre, işletmenin boşaltmanın gerçekleştiği dönemde tek seferde gider yazacağı özel maliyet tutarı kaç TL\u0027dir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve boşaltma döneminde tek seferde gider yazılacak özel maliyet tutarının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme, bir gerçek kişiden kira ile kullandığı depo binasında iktisadi kıymeti artıran tadilat yaptırmış ve bu harcamayı özel maliyet olarak aktifleştirmiştir. Kira süresi 5 yıl olup özel maliyet tutarı kira süresine göre eşit yüzdelerle itfa edilmektedir. Özel maliyet tutarı 300.000 TL\u0027dir. Kiralamanın başladığı 2023 yılından itibaren 2023, 2024 ve 2025 hesap dönemlerinde itfa payları düzenli olarak ayrılmış, ancak kira sözleşmesi sona ermeden depo 2026 yılı içerisinde boşaltılmıştır. Buna göre, işletmenin boşaltmanın gerçekleştiği dönemde tek seferde gider yazacağı özel maliyet tutarı kaç TL\u0027dir?","kayitBaslik":"1) Özel maliyetin boşaltma nedeniyle silinmesi","id":"sgs-t1-maliyet-zor/kp-18","verilenler":[{"deger":"300.000 TL","anlam":"Gayrimenkulün iktisadi kıymetini artıran, aktifleştirilen ve itfaya esas alınan toplam tutardır.","ad":"Özel maliyet tutarı"},{"deger":"5 yıl","anlam":"Yıllık itfa payının hesaplanmasında paydayı oluşturur; tutar bu süreye bölünerek eşit yüzdelerle itfa edilir.","ad":"Kira süresi"},{"deger":"3 yıl (2023, 2024, 2025)","anlam":"Boşaltmadan önce düzenli olarak itfa payı ayrılan dönem sayısıdır; birikmiş itfanın hesabında kullanılır.","ad":"İtfa edilen yıl sayısı"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.327","dogru":"C","oyunBonus":{"soru":"İşletme, bir gerçek kişiden kira ile kullandığı depo binasında iktisadi kıymeti artıran tadilat yaptırmış ve bu harcamayı özel maliyet olarak aktifleştirmiştir. Kira süresi 5 yıl olup özel maliyet tutarı kira süresine göre eşit yüzdelerle itfa edilmektedir. Özel maliyet tutarı 600.000 TL\u0027dir. Kiralamanın başladığı 2023 yılından itibaren 2023, 2024 ve 2025 hesap dönemlerinde itfa payları düzenli olarak ayrılmış, ancak kira sözleşmesi sona ermeden depo 2026 yılı içerisinde boşaltılmıştır. Buna göre, işletmenin boşaltmanın gerçekleştiği dönemde tek seferde gider yazacağı özel maliyet tutarı kaç TL\u0027dir?","tur":"olcek","kayit":[{"tutar":"360.000","taraf":"B","hesap":"268 BİRİKMİŞ AMORTİSMANLAR (-)"},{"tutar":"240.000","taraf":"B","hesap":"689 DİĞER OLAĞANDIŞI GİDER VE ZARARLAR"},{"tutar":"600.000","taraf":"A","hesap":"264 ÖZEL MALİYETLER"}],"not":"Bonus: aynı olay, tutarlar değişti; kâr tutarını buldun, şimdi kaydını da yap."},"ders":"Maliyet Muhasebesi","adimlar":[{"formul":"Verilen: Özel maliyet tutarı 300.000 TL (soruda verilen); Kira süresi 5 yıl (soruda verilen); İtfa ayrılan dönem sayısı 3 yıl - 2023, 2024, 2025 (soruda verilen)","anlatim":"Soru bize şunları vermiş: özel maliyet tutarı 300.000 TL, kira süresi 5 yıl, 2023-2024-2025 yıllarında itfa payı düzenli ayrılmış, depo 2026\u0027da boşaltılmış.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kapsam: Özel maliyet bedeli = kiracının kiralanan gayrimenkulde yaptığı değer artırıcı harcama, kira süresi boyunca eşit yüzdelerle itfa edilir","anlatim":"Özel maliyet bedeli nedir? Kiracının başkasının binasında yaptığı, değeri artıran harcamadır - kira süresine bölünüp her yıl eşit payla gider yazılır. Vergi Usul Kanunu 327. madde bu itfayı düzenler.","doldur":[]},{"formul":"Yıllık itfa payı = Özel maliyet tutarı / Kira süresi = 300.000 (soruda verilen) / 5 (soruda verilen) = 60.000 TL","anlatim":"Şimdi biz hesaplıyoruz: yıllık itfa payını bulmak için toplam tutarı kira süresine bölüyoruz. Her yıl aynı miktar gider yazılıyor çünkü itfa eşit yüzdelerle yapılıyor.","doldur":[[5,1]]},{"formul":"Birikmiş itfa = Yıllık itfa payı × İtfa ayrılan yıl sayısı = 60.000 (3. adımda bulduk) × 3 (soruda verilen) = 180.000 TL","anlatim":"Şimdi üç yılda ayrılan itfa payını topluyoruz çünkü 2023, 2024 ve 2025\u0027te düzenli itfa yapılmış. Bu, boşaltma anına kadar giderleşmiş kısmı gösterir.","doldur":[[6,1]]},{"formul":"Boşaltma döneminde gider yazılacak tutar = Özel maliyet tutarı - Birikmiş itfa = 300.000 (soruda verilen) - 180.000 (4. adımda bulduk) = 120.000 TL","anlatim":"Vergi Usul Kanunu 327. maddeye göre süre bitmeden boşaltılan gayrimenkulde henüz itfa edilmemiş kısım, boşaltma döneminde tek seferde gider yazılır. Bu yüzden kalan tutarı buluyoruz.","doldur":[[7,1]]},{"formul":"Sonuç = 120.000 TL","anlatim":"Sonuç: işletme 120.000 TL\u0027yi 2026 yılında tek seferde gider yazar. Kalan iki yıllık pay artık ayrı ayrı değil, tamamen bu dönemde giderleşir.","doldur":[]},{"formul":"Ters durum: kira süresi tamamlanıp normal kullanım devam etseydi → yıllık itfa 60.000 TL olarak sürer, tek seferde gider yazılmaz","anlatim":"Ters durumda: eğer kira süresi tamamlanana kadar depo kullanılmaya devam etseydi, itfa her yıl normal 60.000 TL olarak sürerdi. Tek seferde gider yazma durumu ancak erken boşaltmada ortaya çıkar.","doldur":[]},{"formul":"Yanlış yol: Özel maliyet tutarının tamamı = 300.000 (HATALI) → doğrusu kalan itfa edilmemiş kısım 120.000 (5. adımda bulduk)","anlatim":"En sık hata: öğrenciler burada 300.000 TL\u0027nin tamamını ya da yalnızca bir yıllık 60.000 TL\u0027yi cevap sanıyor. Doğrusu, henüz itfa edilmemiş kalan kısmı bulmaktır.","doldur":[]}],"anahtar":[{"ornek":"boşaltılan","kok":"boşalt"},{"ornek":"süresi","kok":"süresi"},{"ornek":"edilmemiş","kok":"edilme"},{"ornek":"seferde","kok":"seferd"},{"ornek":"maliyet","kok":"maliye"},{"ornek":"düzenli","kok":"düzenl"}],"konuGiris":{"harita":"Ne zaman tek seferde gider yazılır: kira süresi dolmadan mekan boşaltıldığında ya da hak sona erdiğinde. Nasıl ölçülür: toplam özel maliyetten o ana kadar ayrılmış itfa payları düşülerek kalan bulunur. Nasıl kaydedilir: boşaltmanın gerçekleştiği yılın defterine bir defada gider olarak kaydedilir.","desen":"Sınav genelde tam yıl itfa edilmiş kısmı verip, süre bitmeden boşaltma olayını ekleyerek kalan tutarı sordurur. Tuzak, öğrencinin kalan tutarı tekrar yıllara bölmeye çalışmasıdır; oysa kanun tek seferde gider yazılmasını emreder. Bu soru Vergi Usul Kanunu m.327\u0027nin ikinci cümlesindeki \u0027bir defada gider yazılır\u0027 hükmünden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"kiralanan yerde iktisadi kıymeti artıran, aktifleştirilen tadilat harcaması","ad":"özel maliyet bedeli","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"özel maliyetin eşit yüzdelerle itfa edileceği toplam süre","ad":"kira süresi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"özel maliyet bedelinin kira süresine bölünmesiyle bulunan eşit yıllık tutar","ad":"yıllık itfa payı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"özel maliyetten şimdiye dek ayrılan payların düşülmesinden sonra kalan kısım","ad":"kalan (itfa edilmemiş) tutar","kim":"kanun sabitler"}],"sinavda":"Toplam özel maliyet tutarı, kira süresi ve kaç yıl itfa ayrıldığı verilir; boşaltma yılında tek seferde yazılacak gider tutarı istenir.","panel_ornek":"Kiraladığın bir depoyu 10 ay kullanacağın için 100 TL\u0027lik boya-badana yaptırdın ve her ay 10 TL gider yazmayı planladın. Ama 4. ayda depo sahibiyle anlaşman bozulup çıkmak zorunda kaldın. İşte tam bu anda, henüz gider yazmadığın kalan 60 TL\u0027yi bekletmeden tek seferde gider yazarsın.","ornek":"Kiraladığın bir depoyu 10 ay kullanacağın için 100 TL\u0027lik boya-badana yaptırdın ve her ay 10 TL gider yazmayı planladın. Ama 4. ayda depo sahibiyle anlaşman bozulup çıkmak zorunda kaldın. İşte tam bu anda, henüz gider yazmadığın kalan 60 TL\u0027yi bekletmeden tek seferde gider yazarsın.","yontemler":"Tek yöntem vardır: yıllık pay = toplam tutar ÷ kira süresi, kalan = toplam tutar − (yıllık pay × ayrılan yıl sayısı). Kalan, boşaltma yılında bir defada gider yazılır.","nedir":"Özel maliyet itfası, kiralanan bir yerde yapılan ve mülk sahibine ait olan tadilat harcamasının kira süresine yayılarak gider yazılmasıdır. Sınav, kira bitmeden çıkılırsa kalan tutarın ne zaman ve nasıl gider yazılacağını ölçer."},"olay":"Yıllık itfa payı 300.000/5=60.000; üç yıllık birikmiş itfa 60.000×3=180.000; kalan tutar 300.000-180.000=120.000.","tuzak":{"D":{"ad":"Yıl Sayısı Tuzağı","metin":"Öğrenci itfa edilen yıl sayısını 3 yerine 2 alarak 300.000-120.000=180.000 hesaplar. Doğrusu: 2023, 2024 ve 2025 dönemlerinde toplam 3 yıl itfa yapıldığından kalan tutar 120.000 TL\u0027dir."},"E":{"ad":"Eksik İtfa Tuzağı","metin":"Öğrenci yalnızca 1 yıl itfa edilmiş kabul edip 300.000-60.000=240.000 hesaplar. Doğrusu: Üç yıllık itfa düşüldüğünde kalan tutar 120.000 TL\u0027dir."},"A":{"ad":"Yıllık Pay Tuzağı","metin":"Öğrenci yalnız 300.000/5=60.000 yıllık itfa payını hesaplayıp birikmiş itfayı düşmeden bunu cevap sanır. Doğrusu: Kalan tutar üç yıllık birikmiş itfa düşülerek bulunan 120.000 TL\u0027dir."},"B":{"ad":"Süre Karıştırma Tuzağı","metin":"Öğrenci kira süresini geçen yıl sayısıyla karıştırıp 300.000/3=100.000 işlemini yapar. Doğrusu: Yıllık pay kira süresi olan 5 yıla bölünerek 60.000 bulunur ve kalan tutar 120.000 TL\u0027dir."}},"celdiriciYol":{"D":"300.000 - (60.000×2) = 180.000 (geçen yıl sayısını 3 yerine 2 aldı)","E":"300.000 - (60.000×1) = 240.000 (yalnızca 1 yıl itfa edilmiş kabul etti)","A":"300.000 / 5 = 60.000 (yalnız yıllık itfa payını yazdı, birikmiş itfayı düşmeyi atladı)","B":"300.000 / 3 = 100.000 (kira süresini geçen yıl sayısıyla karıştırdı)"},"hap":"Kira süresi tamamlanmadan boşaltılan gayrimenkulde henüz itfa edilmemiş özel maliyet tutarının tamamı, boşaltmanın gerçekleştiği dönemde tek seferde gider yazılır.","teshis":{"C":{"gercek":"213 sayılı Vergi Usul Kanunu m.327 uyarınca kira süresi tamamlanmadan boşaltmada, henüz itfa edilmemiş kalan tutar boşaltma döneminde tamamen gider yazılır.","ayirt":"Toplam tutardan kaç yıllık itfa düştüm, kalan doğru mu?","paragraf":"m.327","yanilgi":"Bu şıkkı eleyen öğrenci, birikmiş itfa düşülmeden toplam tutarın ya da yalnız bir yıllık payın cevap olduğunu düşünmüştür."},"E":{"gercek":"Soruda 2023, 2024 ve 2025 olmak üzere üç tam dönem için itfa payı ayrıldığı açıkça belirtilmiştir.","ayirt":"Kaç dönem boyunca itfa payı düzenli olarak ayrıldı?","paragraf":"m.327","yanilgi":"Yalnız bir yıl itfa yapıldığını sanıp iki yılın itfa payını hesaba katmıyorsun."},"A":{"gercek":"Yıllık pay yalnız bir ara adımdır; boşaltma döneminde gider yazılacak tutar toplam özel maliyetten birikmiş itfa düşülerek bulunur (213 sayılı Vergi Usul Kanunu m.327).","ayirt":"Bu tutar tek bir yılın payı mı, yoksa kalan kısmın tamamı mı?","paragraf":"m.327","yanilgi":"Yıllık itfa payını bulunca işin bittiğini, birikmiş itfayı toplamdan düşmenin gerekmediğini düşünüyorsun."},"D":{"gercek":"2023, 2024 ve 2025 dönemlerinin her biri için itfa payı ayrıldığından geçen yıl sayısı 3\u0027tür, 2 değildir.","ayirt":"Kiralamanın başladığı ilk yıl için itfa payı ayrıldı mı?","paragraf":"m.327","yanilgi":"İlk yılı (2023) itfa dışı sayıp geçen yıl sayısını bir eksik hesaplıyorsun."},"B":{"gercek":"Yıllık itfa payı yalnızca sözleşmedeki toplam kira süresine bölünerek bulunur; geçen yıl sayısı sadece birikmiş itfayı hesaplamak için çarpanda kullanılır.","ayirt":"Bölen sayı sözleşme süresi mi, geçen yıl sayısı mı?","paragraf":"m.327","yanilgi":"Kira süresi ile geçen yıl sayısını aynı şey sanıp yıllık payı geçen yıl sayısına bölüyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{"689":{"ad":"Diğer Olağandışı Gider ve Zararlar","tanim":"Yukarıda tanımlanan hesaplar kapsamı dışında kalan diğer olağan dışı gider ve zararlardan oluşur."},"264":{"ad":"ÖZEL MALİYETLER","tanim":"Kiralanan gayri menkullerin geliştirilmesi veya ekonomik değerinin sürekli olarak artırılması amacıyla yapılan giderler ile (normal bakım, onarım ve temizleme giderleri hariç) bu gayrimenkulun kullanılması için yapılıp kira süresinin sonunda mal sahibine bırakılacak olan, varlıkların bedellerini kapsar."},"268":{"ad":"BİRİKMİŞ AMORTİSMANLAR (-)","tanim":"Maddi olmayan duran varlık bedellerinin, kullanılabilecekleri süre içerisinde yokedilebilmesini sağlamak amacıyla kullanılan hesaptır."}}},{"capa":{"kaynak":"SGS 2026/2 Soru 60"},"kural":"Miktar sapması standart fiyatla, fiyat sapması fiili miktarla hesaplanır; net sapma olumlu ise ilgili hesaplar bakiye oranında ALACAKLI kapatılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 60","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"27.000","taraf":"B","hesap":"731 DİREKT İLK MADDE VE MALZEME FİYAT FARKI HESABI"},{"tutar":"24.000","taraf":"A","hesap":"732 DİREKT İLK MADDE VE MALZEME MİKTAR FARKI HESABI"},{"tutar":"600","taraf":"A","hesap":"151 YARI MAMULLER - ÜRETİM"},{"tutar":"900","taraf":"A","hesap":"152 MAMULLER"},{"tutar":"1.500","taraf":"A","hesap":"620 SATILAN MAMULLER MALİYETİ"}],"teori":false,"taktik":"Önce miktar sapmasını standart fiyatla, fiyat sapmasını fiili miktarla ayrı ayrı hesaplayıp net sapmanın işaretini belirleyin; tutarı hesaplar arasında oranlamadan tek hesaba yazmayı
