 bu tek olayda geçecek.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu\u0027nun 63\u0027üncü maddesi, bir fiili hukuka aykırı saymayan beş hâli sayıyor: rıza, üstün yarar, haklı savunma, hakkın kendi gücüyle korunması, zorunluluk.","anlatim":"Hasan\u0027ın olayında bu beş ifadeyi tek tek deneyeceğiz, hangisi maddenin içinde hangisi değil bakacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.63","karar":"doğru","anlatim":"Evet, zarar görenin rızası madde metninde açıkça sayılan bir haldir. Depo sahibinin rızası olsaydı fiil yine hukuka aykırı sayılmazdı.","formul":"Şık A: depo sahibi \u0027ben Hasan\u0027a kapıyı zorlarsa sorumlu tutmayacağıma razıyım\u0027 dese, bu rıza hukuka aykırılığı kaldırır mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.63","karar":"doğru","anlatim":"Evet, madde özel yararla birlikte kamusal yararı da açıkça sayıyor. Hasan\u0027ın davranışı toplum güvenliğine hizmet ettiği için bu hal kapsamına girer.","formul":"Şık B: Hasan\u0027ın müdahalesi, sadece kendi deposunu değil çevredeki bütün işyerlerinin güvenliğini korumaya yarasa, bu \u0027üstün kamusal yarar\u0027 sayılır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.63","karar":"doğru","anlatim":"Evet, haklı savunma niteliği taşıyan davranış maddenin ortasında açıkça sayılıyor. Hasan\u0027ın orantılı tepkisi tam bu hale girer.","formul":"Şık C: Hasan\u0027ın sopayla vurması, hırsızın saldırısına karşı orantılı bir tepkiyse, bu \u0027haklı savunma\u0027 sayılır mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.63","karar":"yanlış","anlatim":"Hayır, madde metni kusuru değil fiilin niteliğini sayıyor; kusursuzluk ayrı bir sorumluluk şartı. Hasan kusursuz olsa bile bu, maddede sayılan altı halden biri değil.","formul":"Şık D: Hasan hiç kusurlu değilse, yani elinde olmayan bir şekilde kapıya zarar verdiyse, \u0027kusurun bulunmaması\u0027 tek başına hukuka aykırılığı kaldırır mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.63","karar":"doğru","anlatim":"Evet, kanunun verdiği yetkinin sınırları içinde kalan fiil zarara yol açsa bile hukuka aykırı sayılmıyor. Bu, maddenin ilk cümlesinde açıkça yazılı.","formul":"Şık E: Hasan bekçi olarak kanunun tanıdığı yetki sınırları içinde, yani meşru müdafaa yetkisiyle hareket ettiyse, bu hal hukuka aykırılığı kaldırır mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Hasan\u0027ın olayında beş halin hepsi hukuka aykırılığı kaldırırken, kusurun bulunmaması bunlardan biri değil çünkü kusur ayrı bir kurum. Kendine sor: bu ifade fiilin niteliğini mi anlatıyor, yoksa failin iç durumunu mu?","doldur":[]}],"anahtar":[{"ornek":"hukuka","kok":"hukuka"},{"ornek":"aykırılığı","kok":"aykırı"},{"ornek":"savunma","kok":"savunm"},{"ornek":"açıkça","kok":"açıkça"},{"ornek":"kanununun","kok":"kanunu"},{"ornek":"niteliği","kok":"niteli"}],"konuGiris":{"harita":"Ne zaman test edilir: bir fiilin hukuka aykırılığını ortadan kaldıran haller sayılırken. Nasıl ölçülür: kanunda sayılan sınırlı sebeplerden birine uyup uymadigina bakılarak. Nasıl kaydedilir: soru kökünde \u0027hukuka aykırılığı engellemeyen hal hangisidir\u0027 şeklinde sorulur.","desen":"Sınav, kanunun saydığı beş hukuka uygunluk sebebini karıştırıp aralarina yabancı bir kavram (örn. vekaletsiz is görme, ortaklık hükümleri) ekleyerek doğru olmayanı buldurur. Öğrenci, listedeki beş sebebi ezberlemeyip mantık yürütmeye calisirsa yanlış seçeneği ayırt edemez. Bu soru madde 63\u0027un sınırlı sayılı haller listesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"zarar görenin fiile önceden veya sırasında onay vermesi","ad":"zarar görenin rızası","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"kişisel ya da toplumsal cikarin zarardan daha ağır basmasi hali","ad":"üstün nitelikte yarar","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"saldiriya karşı orantılı biçimde kendini koruma davranışı","ad":"haklı savunma","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"başka carenin olmadığı acil tehlikede zarar verici davranış","ad":"zorunluluk hali","kim":"kanun sabitler"}],"sinavda":"Secenekler arasında hukuka aykırılığı engelleyen dört hal ile bunlara benzemeyen bir kavram verilir, yabancı olan istenir.","panel_ornek":"Bir arkadasin senden izin alıp bahcendeki agacindan 3 elma toplasa, rizan olduğu için bu hukuka aykırı sayılmaz. Ama izinsiz komşunun 5 tavugunu alsa, bu haksız fiil olur. Rizanin olup olmaması burada her şeyi değiştirir.","ornek":"Bir arkadasin senden izin alıp bahcendeki agacindan 3 elma toplasa, rizan olduğu için bu hukuka aykırı sayılmaz. Ama izinsiz komşunun 5 tavugunu alsa, bu haksız fiil olur. Rizanin olup olmaması burada her şeyi değiştirir.","yontemler":"Tek yöntem, kanunda sayılan beş hali (yetki, rıza, üstün yarar, savunma, zorunluluk) tek tek hatırlayıp listede olmayanı elemektir.","nedir":"Haksız fiil, bir kimsenin kusurlu davranışıyla başkasına verdiği zarardan sorumlu tutulmasidir. Sınav, bir fiilin hangi hallerde hukuka aykırı sayılmayacağını bilip bilmediginizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Ne soruluyor","metin":"Kural: Türk Borçlar Kanununun 63 üncü maddesi, hukuka aykırılığı ortadan kaldıran halleri tek tek sayar. Hesap: madde metni \u0027zarar verenin davranışının haklı savunma niteliği taşıması\u0027 ifadesini içerir. Doğrusu: bu hal kaynakta düzenlenmiştir, cevap bu şık değildir."},"E":{"ad":"Yetkiyi Farklı Şart Sanma Tuzağı","metin":"madde metni açıkça \u0027kanunun verdiği yetkiye dayanan ve bu yetkinin sınırları içinde kalan fiil hukuka aykırı sayılmaz\u0027 der. Doğrusu: bu hal kanunda düzenlenmiştir, cevap bu şık değildir."},"A":{"ad":"Rızayı Hukuka Aykırılığı Kaldıran Hal Sanma Tuzağı","metin":"madde metninde \u0027zarar görenin rızası\u0027 açıkça sayılmıştır, bu şık kaynakta yer alan gerçek bir haldir. Doğrusu: rıza, hukuka aykırılığı ortadan kaldıran hallerden biridir, bu şık sorunun cevabı değildir."},"B":{"ad":"Üstün Yararı Ayrı Kavram Sanma Tuzağı","metin":"\u0027daha üstün nitelikte özel veya kamusal yarar\u0027 madde metninde hukuka aykırılığı kaldıran sebepler arasında sayılmıştır. Doğrusu: bu hal de kanunda açıkça yer alır, cevap bu şık değildir."}},"celdiriciYol":{},"hap":"Türk Borçlar Kanununun 63 üncü maddesindeki hukuka aykırılığı kaldıran haller (rıza, üstün yarar, haklı savunma, hakkın kendi gücüyle korunması, zorunluluk) kusur şartından bağımsızdır.","teshis":{"C":{"gercek":"Türk Borçlar Kanunu haklı savunma niteliği taşıyan davranışı da hukuka aykırılığı kaldıran hal olarak kabul eder.","ayirt":"Davranış saldırıya karşı orantılı bir tepki mi?","paragraf":"m.63","yanilgi":"Haklı savunmayı ceza hukukuna özgü bir kavram sanıp borçlar hukukunda geçmediğini düşünüyorsun."},"E":{"gercek":"Madde, kanunun verdiği yetkinin sınırları içinde kalan fiili açıkça hukuka aykırı saymaz.","ayirt":"Fiil, kanunun tanıdığı bir yetkinin sınırları içinde mi kalmış?","paragraf":"m.63","yanilgi":"Kanuni yetki sınırları içinde kalmayı ayrı bir hukuki kurum sanıp hukuka aykırılıkla ilişkisini göremiyorsun."},"A":{"gercek":"Türk Borçlar Kanununun 63 üncü maddesi zarar görenin rızasını, hukuka aykırılığı doğrudan kaldıran bir hal olarak sayar.","ayirt":"Bu hal madde metninde tek tek sayılan altı halden biri mi?","paragraf":"m.63","yanilgi":"Rızanın hukuka aykırılığı kaldırmadığını, sadece kusuru azalttığını düşünüyorsun."},"D":{"gercek":"Türk Borçlar Kanununun 63 üncü maddesi kusuru değil, fiilin niteliğini (rıza, üstün yarar, haklı savunma, hakkın kendi gücüyle korunması, zorunluluk) esas alır; kusursuzluk madde kapsamında sayılmamıştır.","ayirt":"Bu ifade fiilin kendisini mi, yoksa failin iç durumunu mu anlatıyor?","paragraf":"m.63","yanilgi":"Kusurun bulunmamasını da hukuka aykırılığı kaldıran bir hal sanıyorsun; oysa kusur, hukuka aykırılıktan bağımsız ayrı bir sorumluluk şartıdır."},"B":{"gercek":"Madde hem özel hem kamusal üstün yararı hukuka aykırılığı kaldıran hal olarak birlikte düzenler.","ayirt":"Madde metninde \u0027özel veya kamusal\u0027 ibaresi geçiyor mu?","paragraf":"m.63","yanilgi":"Üstün yararın yalnız kamu hukukuna ait bir kavram olduğunu, özel hukukta geçmediğini sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 128"},"kural":"Hafif kusurla zarara sebep olan yükümlü, ödemesi halinde yoksulluğa düşecekse ve hakkaniyet gerektiriyorsa hâkim tazminatı indirebilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 128","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde içinde birden fazla hal varsa her halin kendi fiilini (indirir mi, kaldırır mı) ayrı ayrı kontrol et, şıklar halleri birbirine karıştırır.","konu":"haksız fiil sorumluluğu","tablo":{"satirlar":[["A) Zarar gören, zararı doğuran fiile razı olmuşsa hâkim taz…","p.28(TBK m.52/1)","YANLIŞ ifade"],["B) Zarara hafif kusuruyla sebep olan tazminat yükümlüsü, ta…","p.28(TBK m.52/2)","doğru ifade"],["C) Zarara hafif kusuruyla sebep olan tazminat yükümlüsü yok…","p.28(TBK m.52/2)","YANLIŞ ifade"],["D) Zarar görenin zararın doğmasında etkili olması, tek başı…","p.28(TBK m.52/1)","YANLIŞ ifade"],["E) Tazminat yükümlüsünün durumunun zarar gören tarafından a…","p.28(TBK m.52/1)","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Zarara hafif kusuruyla sebep olan tazminat yükümlüsü yoksulluğa düşecekse hâkim tazminatı tamamen kaldırabilir.","E":"Tazminat yükümlüsünün durumunun zarar gören tarafından ağırlaştırılmış olması, hâkimin tazminatı indirmesi için değil, yalnızca tamamen kaldırması için sebep olabilir.","A":"Zarar gören, zararı doğuran fiile razı olmuşsa hâkim tazminatı yalnızca indirebilir, tamamen kaldıramaz.","D":"Zarar görenin zararın doğmasında etkili olması, tek başına indirim sebebi sayılmaz; ayrıca zarar görenin ağır kusurlu olması şartı aranır.","B":"Zarara hafif kusuruyla sebep olan tazminat yükümlüsü, tazminatı ödediğinde yoksul }

// 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}
function skorCiz(){ const sk=skorHesapla(); const vade=KUTU.kutu.filter(x=>x.due<=simdi()).length; const azVeri=KUTU.kayit.length<5; document.querySelectorAll('.skorCip').forEach(el=>{ el.textContent=azVeri?'🎯 —':('🎯 %'+sk.toplam); el.title=azVeri?'Hazırlık skoru 5 sorudan sonra görünür':'Hazırlık skoru'; }); /* 05.09: ilk yanlıştan sonra "%4" görmek caydırıcı; 5 cevaptan önce yüzde yok */ document.querySelectorAll('.kutuCip').forEach(el=>{ el.textContent='📥 '+KUTU.kutu.length+(vade?' ·'+vade+' hazır':''); el.classList.toggle('hazir',vade>0); }); }

   +'<div class="et" style="margin-top:14px">📥 Yanlış kutusu ('+KUTU.kutu.length+')</div>'
   +(KUTU.kutu.length?KUTU.kutu.map(x=>{ const i=SORULAR.findIndex(s=>s.id===x.id); return '<div class="kutuSat"><div><b>'+esc(x.konu)+'</b> <span class="ipnot" style="display:inline">· '+(x.tur>=2?'2. tur (7 gün)':'1. tur (2 gün)')+' · '+gunStr(x.due)+'</span></div>'+(x.due<=t&&i>=0?'<button class="btn mavi kutuCoz" data-i="'+i+'">Şimdi çöz</button>':'')+'</div>'; }).join(''):'<p class="ipnot">Kutu boş. Yanlış yaptığın her soru buraya düşer ve 2 gün sonra geri gelir.</p>')
   +'<div class="btnrow" style="margin-top:14px"><button class="btn" id="kutuIleri">⏩ Demo: 2 gün ileri sar</button><button class="btn gri" id="kutuSifirla">Verileri sıfırla</button></div>'
   +'<p class="ipnot">Nasıl çalışır: yanlış → kutuya girer, 2 gün sonra geri gelir; o gün doğru bilirsen 7 gün sonra bir kez daha gelir; onu da bilirsen kutudan çıkar ve ustalık tam sayılır.</p></div>';
  e.classList.add('acik');

    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});
// --- son kart
const son=document.createElement('section'); son.className='kart son';
son.innerHTML='<div class="ust"><span>Nöbet bitti</span>'+noktalar(-1)+'<span>&nbsp;</span></div><div class="govde son" style="display:flex;flex-direction:column;justify-content:center"><div id="sonSkor"></div></div>';
akis.appendChild(son);
document.querySelectorAll('.skorCip,.kutuCip').forEach(b=>b.addEventListener('click',kutuEkraniAc)); skorCiz();
if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i').forEach(n=>n.classList.toggle('simdi',n.dataset.j==String(i)||(i>=SORULAR.length&&n.dataset.j==='son')));
  if(i<SORULAR.length&&durum.cevap[i]===undefined&&!durum.t0[i]) durum.t0[i]=Date.now();   // 06.09: karta gelince süre başlar
  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='PageDown'){ akis.scrollBy({top:akis.clientHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='PageUp'){ akis.scrollBy({top:-akis.clientHeight,behavior:'smooth'}); } });
/* 09.09 derin bağlantı (ana sayfa kartı → günün sorusu): #s=<sıra> kartını açar; yoksa baştan. */
window.addEventListener('load',function(){ try{ var m=location.hash.match(/#s=(\d+)/); var a=document.getElementById('akis'); if(m&&a&&a.children[+m[1]]) a.scrollTo({top:a.children[+m[1]].offsetTop,behavior:'instant'}); }catch(e){} });
