"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"İşletmede çalışan bir işçinin ücret alacağına ilişkin olarak, Türk Borçlar Kanunu hükümleri çerçevesinde takas ve zamanaşımı bakımından aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-06","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.144/3 ve m.147/1","dogru":"C","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: bir tekstil atölyesinde çalışan Mehmet\u0027in Mart ayı 6.000 TL ücreti ödenmemiş, işveren de Mehmet\u0027in kendisine borçlu olduğu 6.000 TL\u0027lik bir avansı bu ücretten düşmek istiyor.","anlatim":"Mehmet buna itiraz ediyor. İşveren \u0027ben zaten alacaklıyım, mahsup ederim\u0027 diyor. Bu olay bitene kadar hem \u0027rıza\u0027 hem \u0027süre\u0027 meselesini çözeceğiz.","doldur":[]},{"formul":"Ne yapacağız: bu ücret alacağında iki soru var; takas için Mehmet\u0027in izni gerekir mi, ve bu alacak kaç yıl sonra zamanaşımına uğrar.","anlatim":"Beş şıkkı bu iki soruya göre tek tek test edeceğiz: rıza var mı yok mu, süre beş mi on mu.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.147/1","karar":"yanlış","anlatim":"Rıza kısmı doğru ama süre yanlış; ücret dönemsel bir edim olduğu için genel on yıllık süre değil beş yıllık süre uygulanır.","formul":"Şık A: işveren \u0027Mehmet\u0027in rızasına gerek yok, o zaten borçluydu\u0027 diyor, sen \u0027rıza gerekir, süre on yıl\u0027 desen doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.144/3","karar":"yanlış","anlatim":"Süre doğru ama rıza kısmı yanlış; kanun ücreti nafaka gibi zorunlu alacaklar arasında sayıp alacaklının rızasını şart koşar.","formul":"Şık B: \u0027Mehmet\u0027in onayı aranmaz, mahsup direkt yapılır, beş yıl geçince zamanaşımına uğrar\u0027 desen doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.144/3, m.147/1","karar":"doğru","anlatim":"Evet, ikisi de doğru; işveren rızasız mahsup edemez ve Mehmet beş yıl içinde alacağını istemeli, çünkü iki madde bu alacakta çelişmeden birlikte uygulanır.","formul":"Şık C: Mehmet \u0027benim rızam olmadan mahsup yapamazsın, ayrıca beş yıl içinde dava açmam gerekiyor\u0027 dese haklı mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.144/3, m.147/1","karar":"yanlış","anlatim":"Hayır, hem rıza hem süre kısmı yanlış; kanun ikisini de ücret lehine, koruyucu yönde düzenlemiştir, bu şık ikisini de ters çevirmiş.","formul":"Şık D: \u0027rızaya gerek yok ama süre on yıl\u0027 dese, sen buna katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.144/3","karar":"yanlış","anlatim":"Hayır, madde metni ücreti nafaka ile birlikte açıkça sayar; kapsam dışı bırakmak yanlış olur.","formul":"Şık E: işveren \u0027ücret zorunlu bakım alacağı sayılmaz, takas yasağı yok, genel on yıllık süre uygulanır\u0027 dese buna inanır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Mehmet\u0027in ücreti hem rıza şartına hem beş yıllık süreye birlikte tabidir, bunu unutma. Kendine sor: bu alacak dönemsel bir edim mi ve rızası aranan alacaklardan mı?","doldur":[]}],"anahtar":[{"ornek":"alacaklının","kok":"alacak"},{"ornek":"yıllık","kok":"yıllık"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"ücreti","kok":"ücreti"},{"ornek":"maddesinin","kok":"maddes"},{"ornek":"rızasıyla","kok":"rızası"}],"konuGiris":{"harita":"Ne zaman test edilir: işçi ücretinin takas edilip edilemeyeceği ve zamanaşımı süresinin ne kadar olduğu sorulduğunda. Nasıl ölçülür: kanun maddesindeki istisna ve süre kuralının doğru hatırlanmasıyla. Nasıl kaydedilir: doğru şık, işçi rızası olmadan takas yapılamayacağını ve beş yıllık sürenin uygulanacağını belirten seçenektir.","desen":"Sınav genelde işçi ücretinin diğer alacaklar gibi serbestçe takas edilebileceğini iddia eden yanlış şıkla tuzak kurar, oysa rıza şartı aranır. Bir diğer tuzak, ücret alacağına genel on yıllık zamanaşımı uygulanacağını yazan şıktır, doğrusu beş yıldır. Bu soru işçi ücretinin özel korunmasına ilişkin takas ve süre hükümlerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"işçi ücretinin alacaklı rızası olmadan karşı alacakla mahsup edilememesi kuralı","ad":"takas yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"borçlunun ve ailesinin bakımı için gerekli, doğrudan alacaklıya verilmesi gereken alacak türü","ad":"zorunlu nitelikli alacak","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"kira, faiz, ücret gibi belirli aralıklarla tekrar eden ödeme yükümlülüğü","ad":"dönemsel edim","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"ücret gibi dönemsel alacakların talep edilebileceği kanuni azami süre","ad":"beş yıllık zamanaşımı","kim":"kanun sabitler"}],"sinavda":"Soruda işçi ücreti alacağının takas ve zamanaşımı bakımından durumu verilir, doğru hukuki sonucu belirlemeniz istenir.","panel_ornek":"Bir markette kasada çalışan arkadaşının ayda 7 kez fazla mesai yaptığını düşün, işveren ona borçlu olduğu 3 haftalık maaşı, kendi elindeki eski bir alacağıyla mahsup edemez çünkü bu para arkadaşının ve ailesinin geçimi için ayrılmıştır. Aynı şekilde bu maaş alacağını 5 yıl içinde istemezse hakkı zamanla düşer.","ornek":"Bir markette kasada çalışan arkadaşının ayda 7 kez fazla mesai yaptığını düşün, işveren ona borçlu olduğu 3 haftalık maaşı, kendi elindeki eski bir alacağıyla mahsup edemez çünkü bu para arkadaşının ve ailesinin geçimi için ayrılmıştır. Aynı şekilde bu maaş alacağını 5 yıl içinde istemezse hakkı zamanla düşer.","yontemler":"Tek kritik kural: işçi ücreti hem rızasız takas edilemez hem de beş yıllık zamanaşımına tabidir, bu iki bilgiyi ayrı ayrı hatırla.","nedir":"Ücret sözleşmesi, işçinin emeği karşılığında alacağı ücretin işveren tarafından ödenmesini düzenleyen kurallar bütünüdür. Sınav, işçi ücretinin takas ve zamanaşımı bakımından nasıl korunduğunu ölçer."},"olay":"","tuzak":{"D":{"ad":"Çifte Tuzak","metin":"Hem takas rızasını hem süreyi aynı anda yanlış hatırlarsın, iki kuralı da tersine çevirirsin. Doğrusu: Rıza şartı vardır ve süre beş yıldır; ikisi de tek yönde doğrudur, ikisini de tersine çevirmek hatalıdır."},"E":{"ad":"Kapsam Tuzağı","metin":"Ücretin özel korumalı alacak sayılmasını, sadece nafaka gibi dar bir gruba özgü sanırsın. Doğrusu: Kanunun 144 üncü maddesinin üçüncü bendi ücreti nafaka ile birlikte açıkça sayar, kapsam dışında bırakmaz."},"A":{"ad":"Süre Tuzağı","metin":"Genel zamanaşımı süresini (on yıl) her alacağa uygulanan tek kural sanırsın. Doğrusu: Ücret gibi dönemsel edimler Kanunun 147 nci maddesinin birinci fıkrası gereği beş yıllık zamanaşımına tabidir."},"B":{"ad":"Rıza Tuzağı","metin":"Takas hakkının doğması ile serbestçe kullanılabileceğini karıştırırsın. Doğrusu: Ücret alacağı Kanunun 144 üncü maddesinin üçüncü bendi gereği ancak alacaklının rızasıyla takas edilebilir."}},"celdiriciYol":{},"hap":"Ücret alacağı, Kanunun 144 üncü maddesinin üçüncü bendi gereği ancak alacaklının rızasıyla takas edilebilir ve 147 nci maddesinin birinci fıkrası gereği beş yıllık zamanaşımına tabidir.","teshis":{"C":{"gercek":"Kanunun 144 üncü maddesinin üçüncü bendi ile 147 nci maddesinin birinci fıkrası aynı ücret alacağında birlikte, çelişmeden uygulanır.","ayirt":"İki farklı maddenin aynı alacağa aynı anda uygulanıp uygulanamayacağını kontrol ettim mi?","paragraf":"TBK m.144/3, m.147/1","yanilgi":"Bu şıkkı eleyen öğrenci iki kuralın aynı alacakta birlikte uygulanamayacağını sanır."},"E":{"gercek":"Madde metni ücreti nafaka ile birlikte, aynı bentte açıkça sayar; kapsam dışı bırakmaz.","ayirt":"Madde metninde bu alacak türü açıkça isimlendirilmiş mi?","paragraf":"TBK m.144/3","yanilgi":"Kanunun 144 üncü maddesindeki sayımı sadece nafakaya özgü sanıp ücreti kapsam dışı bırakıyorsun."},"A":{"gercek":"Kanunun 147 nci maddesinin birinci fıkrası ücret gibi dönemsel edimleri özel olarak beş yıllık süreye bağlar.","ayirt":"Bu alacak dönemsel bir edim mi, yoksa tek seferlik bir edim mi?","paragraf":"TBK m.147/1","yanilgi":"Bütün alacaklarda tek bir genel zamanaşımı süresi olduğunu, dönemsel edimlerin ayrı düzenlendiğini bilmediğini sanıyorsun."},"D":{"gercek":"Her iki kural da kaynakta ücret lehine, koruyucu yönde düzenlenmiştir; ikisi de aynı yönde doğrudur.","ayirt":"Kuralın öngördüğü yön alacaklıyı mı koruyor, borçluyu mu?","paragraf":"TBK m.144/3, m.147/1","yanilgi":"Rıza şartını ve süreyi hatırlarken ikisini de ters yönde ezberlediğini fark etmiyorsun."},"B":{"gercek":"Kanunun 144 üncü maddesi üçüncü bendinde ücret alacağı, rıza aranan istisnai alacaklar arasında sayılmıştır.","ayirt":"Bu alacak, borçlunun bakımı için zorunlu, alacaklıya doğrudan verilmesi gereken bir alacak mı?","paragraf":"TBK m.144/3","yanilgi":"Takas hakkının varlığını, onu kullanmak için gereken rızayla aynı şey sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 126"},"kural":"Türk Borçlar Kanununun 87 nci maddesi seçimi aksi kararlaştırılmadıkça borçluya bırakır, 405 inci maddesi ise erken fesihte çalışılan süreye yansıyan kısmın ödenmesini emreder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 126","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İki maddeyi barındıran olaylarda önermeyi ikiye böl: önce \u0027kim seçer\u0027, sonra \u0027ne kadar ödenir\u0027 diye ayrı ayrı doğrula.","konu":"seçimlik borç","tablo":{"satirlar":[["A) Seçimlik borçlarda edimin seçimi kural olarak alacaklıya…","TBK m.87","YANLIŞ ifade"],["B) Seçim hakkı işverene aittir; ancak hizmet sözleşmesi sür…","TBK m.405","YANLIŞ ifade"],["C) Seçim hakkı işverene aittir; hizmet sözleşmesi ikramiye …","TBK m.87; TBK m.405","doğru ifade"],["D) Aksine bir anlaşma bulunmadığından seçim hakkı işveren i…","TBK m.87","YANLIŞ ifade"],["E) Seçim hakkı işçiye aittir; hizmet sözleşmesi erken sona …","TBK m.87; TBK m.405","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Seçim hakkı işverene aittir; hizmet sözleşmesi ikramiye döneminden önce sona erdiğinden ikramiyenin çalışılan süreye yansıyan bölümü ödenir.","E":"Seçim hakkı işçiye aittir; hizmet sözleşmesi erken sona erdiğinden ikramiyenin çalışılan süreye yansıyan bölümü işçiye ödenir.","A":"Seçimlik borçlarda edimin seçimi kural olarak alacaklıya ait olduğundan, ikramiyenin türünü işçi seçer.","D":"Aksine bir anlaşma bulunmadığından seçim hakkı işveren ile işçi tarafından birlikte, oybirliğiyle kullanılır.","B":"Seçim hakkı işverene aittir; ancak hizmet sözleşmesi süre dolmadan sona erdiğinden işçiye ikramiyeden hiçbir pay ödenmez."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"İşveren ile işçi, yılbaşı ikramiyesinin nakit ya da hediye çeki olarak ödeneceğini kararlaştırmış, ancak hangisinin seçileceğini belirlememiştir. Hizmet sözleşmesi, ikramiyenin verildiği dönemden önce sona ermiştir. Buna göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-07","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.87; Türk Borçlar Kanunu (6098 s.K.) m.405","dogru":"C","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Bir fabrikada işveren ile vardiya ustası Kemal, 2023 yılbaşı ikramiyesinin 5.000 TL nakit ya da eşdeğer hediye çeki olarak verileceğini sözleşmeye yazmış, ama hangisi olacağını belirtmemişler. Kemal, ikramiyenin ödendiği Aralık ayından önce, Ekim ayında işten ayrılmış.","anlatim":"İşveren de Kemal de kararlaştırma sırasında seçimi kime bıraktıklarını hiç konuşmamış. Sözleşme Aralık\u0027tan önce bitince ortada iki soru var: kim seçecek, ne kadar ödenecek?","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanununun 87 nci maddesi seçimi aksi kararlaştırılmadıkça borçluya, yani işverene bırakır; 405 inci maddesi erken fesihte çalışılan süreye yansıyan bölümün ödenmesini emreder. Bu iki kuralı Kemal\u0027in olayında beş ifade üzerinden tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.87","karar":"yanlış","anlatim":"Türk Borçlar Kanununun 87 nci maddesi seçimi alacaklıya değil borçluya bırakır; burada borçlu işverendir. Kemal\u0027in alacaklı olması ona seçim hakkı vermez.","formul":"Şık A: Kemal\u0027e \u0027ikramiyenin türünü sen seçersin, çünkü alacaklısın\u0027 desen doğru mu olur?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.405","karar":"yanlış","anlatim":"Türk Borçlar Kanununun 405 inci maddesi erken fesihte ikramiyeyi sıfırlamaz, çalışılan süreye yansıyan bölümün ödenmesini söyler. Kemal Ekim\u0027e kadar çalıştıysa o kısmı hak eder.","formul":"Şık B: İşveren \u0027Kemal erken ayrıldı, hiç ikramiye almaz\u0027 dese haklı mı olur?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.87; TBK m.405","karar":"doğru","anlatim":"Türk Borçlar Kanununun 87 nci maddesi seçimi işverene verir, 405 inci maddesi de oranlı ödemeyi emreder; iki kural burada birlikte çalışır. Kemal\u0027in olayı tam bu iki maddenin kesiştiği yerdir.","formul":"Şık C: Seçimi işverenin yapıp, Kemal\u0027e sadece çalıştığı aylara denk gelen tutarı ödemesi doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.87","karar":"yanlış","anlatim":"Türk Borçlar Kanununun 87 nci maddesinde böyle bir ortak karar usulü yazmıyor, seçim tek başına borçluya ait. Kemal ile işverenin anlaşarak seçmesi kanunun aradığı şey değil.","formul":"Şık D: İşveren ile Kemal seçimi birlikte, oybirliğiyle mi yapmalı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.87; TBK m.405","karar":"yanlış","anlatim":"Kısmi ödeme kısmı doğru ama seçim hakkını Kemal\u0027e vermek yanlış; Türk Borçlar Kanununun 87 nci maddesi bu hakkı işverene tanır. Cümlenin yarısı doğru diye tamamı doğru sayılmaz.","formul":"Şık E: Seçim hakkı Kemal\u0027de olup, erken ayrıldığı için ona sadece kısmi ödeme yapılsa doğru mu olur?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Kemal\u0027in olayında seçim işverenin, ödeme ise çalışılan süreyle orantılı; kendine hep şunu sor: bu cümlede iki ayrı kural mı var, ikisi de doğru mu?","doldur":[]}],"anahtar":[{"ornek":"maddesi","kok":"maddes"},{"ornek":"kanununun","kok":"kanunu"},{"ornek":"borçlarda","kok":"borçla"},{"ornek":"İşveren","kok":"İşvere"},{"ornek":"borçluya","kok":"borçlu"},{"ornek":"çalışılan","kok":"çalışı"}],"konuGiris":{"harita":"Ne zaman test edilir: Sözleşmede birden fazla edim kararlaştırılıp seçim hakkı belirtilmediğinde test edilir. Nasıl ölçülür: Seçim hakkının kural olarak kime ait olduğu bilgisiyle ölçülür. Nasıl kaydedilir: Doğru seçenek, seçim hakkının borçluya (işverene) ait olduğunu belirten ifadedir.","desen":"Sınav, taraflar seçim hakkını belirlemediğinde bu hakkın kime ait olduğunu bilip bilmediğinizi sorar. Tuzak, ikramiye türü (nakit/hediye çeki) ile ilgili detaya odaklanıp seçim hakkının borçluya ait olduğu kuralını atlamaktır. Bu soru Türk Borçlar Kanunu m.87 ve m.405\u0027in birlikte uygulanması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Birden fazla edimden birinin seçilip ifa edildiği borç türü.","ad":"Seçimlik borç","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Edimlerden hangisinin ifa edileceğini belirleme yetkisi.","ad":"Seçim hakkı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Seçim hakkı aksi kararlaştırılmadıkça kendisine ait olan taraf.","ad":"Borçlu","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Sözleşme dönem bitmeden sona ererse çalışılan süreye yansıyan bölümün ödenmesi.","ad":"İkramiyenin kısmi ödenmesi","kim":"kanun sabitler"}],"sinavda":"Taraflar seçimlik ikramiye türünü belirtip seçim hakkını düzenlememişken sözleşme erken sona ermiştir; doğru sonucu seçmeniz istenir.","panel_ornek":"Arkadaşın sana doğum günü hediyesi olarak kulaklık ya da 3 kitap seti sözü verdi ama hangisi olacağını söylemedi. İkisinden birini seçme hakkının kime ait olduğu belli değilse, kanun bu boşluğu dolduruyor. Sonunda arkadaşın hangisini vereceğine kendisi karar verir.","ornek":"Arkadaşın sana doğum günü hediyesi olarak kulaklık ya da 3 kitap seti sözü verdi ama hangisi olacağını söylemedi. İkisinden birini seçme hakkının kime ait olduğu belli değilse, kanun bu boşluğu dolduruyor. Sonunda arkadaşın hangisini vereceğine kendisi karar verir.","yontemler":"Önce seçim hakkının kural olarak borçluya (işverene) ait olduğunu tespit edin, sonra sözleşmenin erken sona ermesi nedeniyle kısmi ödeme kuralını uygulayın.","nedir":"Seçimlik borç, aynı borçta birden fazla edimden birinin ifa edilmesini konu alan borç türüdür. Sınav, seçim hakkının kime ait olduğunu ve bu hakkın nasıl kullanılacağını ölçer."},"olay":"İki kural birlikte uygulanır.","tuzak":{"D":{"ad":"Uydurma Kural Tuzağı","metin":"Kanunda yer almayan bir \u0027birlikte seçim\u0027 kuralı türetiyorsun. Doğrusu: Türk Borçlar Kanununun 87 nci maddesinde seçim tek tarafa, aksi kararlaştırılmadıkça borçluya aittir; ortak seçim kuralı yoktur."},"E":{"ad":"Çifte Tuzak","metin":"Hem seçim tarafını hem de bunun sonucunu birlikte yanlış kurup \u0027işçi lehine tutarlı\u0027 bir sonuç üretiyorsun. Doğrusu: İkramiyenin çalışılan süreye yansıyan bölümünün ödenmesi kuralı doğru olsa da, seçim hakkı işçiye değil işverene aittir."},"A":{"ad":"Alacaklı Tuzağı","metin":"Seçimlik borçlarda kuralın alacaklı lehine işlediğini sanıyorsun. Doğrusu: Türk Borçlar Kanununun 87 nci maddesine göre aksi kararlaştırılmadıkça seçim hakkı borçluya, yani işverene aittir."},"B":{"ad":"Kapsam Atlama Tuzağı","metin":"Seçim hakkını doğru bilip erken fesih hâlinde ikramiyenin tamamen düşeceğini sanıyorsun. Doğrusu: Türk Borçlar Kanununun 405 inci maddesine göre sözleşme ikramiye döneminden önce sona erse de çalışılan süreye yansıyan bölüm ödenir."}},"celdiriciYol":{},"hap":"Seçimlik borçlarda edimin seçimi, aksi kararlaştırılmadıkça borçluya aittir; hizmet sözleşmesi ikramiye döneminden önce sona erdiğinde ise ikramiyenin çalışılan süreye yansıyan bölümü ödenir.","teshis":{"C":{"gercek":"Türk Borçlar Kanununun 87 nci ve 405 inci maddeleri farklı sorulara cevap verir: biri seçim yetkisini, diğeri erken fesihte ödemeyi düzenler; olayda ikisi de devrededir.","ayirt":"Soruda iki ayrı hukuki sorun mu var, kural her birine ayrı ayrı mı uygulanmalı?","paragraf":"TBK m.87; TBK m.405","yanilgi":"Bu şıkkı eleyen öğrenci, iki farklı maddenin aynı olayda birlikte uygulanabileceğini fark edemiyor."},"E":{"gercek":"Kısmi ödeme kuralı doğru olsa da seçim hakkı Türk Borçlar Kanununun 87 nci maddesi gereği işverene, yani borçluya aittir.","ayirt":"Her önermeyi ayrı ayrı doğrula; bir cümledeki tek doğru diğerini otomatik doğru yapmaz.","paragraf":"TBK m.87; TBK m.405","yanilgi":"İkinci kuralı (erken fesihte kısmi ödeme) doğru bildiğin için ilk kuraldaki taraf hatasını fark edemiyorsun."},"A":{"gercek":"Türk Borçlar Kanununun 87 nci maddesi seçimi, hukuki ilişkiden ve işin özelliğinden aksi anlaşılmadıkça borçluya bırakır.","ayirt":"Kim ifa eden taraf, kim alan taraf; kanun kime öncelik veriyor?","paragraf":"TBK m.87","yanilgi":"Seçimlik borçlarda edimi seçme hakkının doğal olarak alacaklıya ait olduğunu düşünüyorsun."},"D":{"gercek":"Türk Borçlar Kanununun 87 nci maddesinde ortak seçim usulüne yer verilmemiştir; seçim tek tarafa, aksi anlaşılmadıkça borçluya aittir.","ayirt":"Kanun metninde \u0027birlikte\u0027 ya da \u0027oybirliğiyle\u0027 ifadesi geçiyor mu?","paragraf":"TBK m.87","yanilgi":"Belirsizlik olduğunda kanunun tarafları birlikte karar vermeye zorlayacağını varsayıyorsun."},"B":{"gercek":"Türk Borçlar Kanununun 405 inci maddesi, hizmet sözleşmesi ikramiye döneminden önce sona erse dahi çalışılan süreye yansıyan kısmın ödenmesini öngörür.","ayirt":"Erken fesih ikramiyeyi tamamen mi siler, yoksa oranlar mı?","paragraf":"TBK m.405","yanilgi":"Seçim hakkını doğru çözdükten sonra sözleşme erken bitince ikramiyenin tamamen düşeceğini sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 129"},"kural":"Türk Borçlar Kanunu m.82 f.2\u0027ye göre zenginleşme zenginleşenin bir alacak hakkı kazanması suretiyle gerçekleşmişse, diğer taraf istem hakkı zamanaşımına uğramış olsa bile her zaman bu borcunu ifadan kaçınabilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 129","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Soruda \u0027alacak hakkı kazanma\u0027 ifadesini görünce zamanaşımı sorusunun m.82 f.2\u0027ye kaydığını anla; süreyle sınırlı def\u0027i şıklarını hemen ele.","konu":"sebepsiz zenginlesme zamanaşımı","tablo":{"satirlar":[["A) Zamanaşımı süresinin dolmasıyla borç tamamen sona erer, …","TBK m.82 f.1","YANLIŞ ifade"],["B) Borçlu def\u0027i ileri sürmese dahi hâkim bu zamanaşımını da…","TBK genel zamanaşımı ilkesi","YANLIŞ ifade"],["C) Zamanaşımı süresi dolmadan önce borcunu ifa eden borçlu,…","TBK m.82","YANLIŞ ifade"],["D) Borçlu bu def\u0027i yalnızca iki yıllık öğrenme süresi içind…","TBK m.82 f.2","YANLIŞ ifade"],["E) Borçlu, istem hakkı zamanaşımına uğramış olsa bile bu bo…","TBK m.82 f.2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Zamanaşımı süresi dolmadan önce borcunu ifa eden borçlu, sonradan ifa ettiğini geri isteyebilir.","E":"Borçlu, istem hakkı zamanaşımına uğramış olsa bile bu borcunu ifadan her zaman kaçınabilir.","A":"Zamanaşımı süresinin dolmasıyla borç tamamen sona erer, borçlu artık hiçbir şekilde ifada bulunamaz.","D":"Borçlu bu def\u0027i yalnızca iki yıllık öğrenme süresi içinde ileri sürebilir, süre geçince kaçınma hakkı ortadan kalkar.","B":"Borçlu def\u0027i ileri sürmese dahi hâkim bu zamanaşımını davada resen göz önüne alır."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Zenginleşen kişinin zenginleşmesi, bir alacak hakkı kazanması suretiyle gerçekleşmiş ve karşı tarafın bu alacağı isteme hakkı zamanaşımına uğramıştır. 6098 sayılı Türk Borçlar Kanunu\u0027na göre bu durumda borçlunun hukuki durumuna ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-08","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.82 f.2","dogru":"E","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Ayşe, komşusu Mehmet\u0027e 2015 yılında bir bilgisayar satmış ama parayı hiç almamıştı. Mehmet bu borcu ödemesi gerektiğini biliyordu ama 2017\u0027de \u0027iki yıllık öğrenme süresi\u0027 dolunca ödemekten vazgeçti. 2023\u0027te Ayşe dava açtı, Mehmet mahkemede sesini çıkarmadı ama parayı da vermek istemiyor.","anlatim":"Burada zenginleşme, Mehmet\u0027in bir alacak hakkı kazanmasıyla oldu; yani Mehmet borçlu değil, Ayşe\u0027ye karşı hâlâ \u0027ifa etmeme\u0027 hakkı taşıyor. Şimdi bu beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu madde 82 fıkra 2\u0027ye göre, zenginleşme zenginleşenin bir alacak hakkı kazanmasıyla gerçekleşmişse, diğer taraf istem hakkı zamanaşımına uğramış olsa bile her zaman bu borcunu ifadan kaçınabilir. Mehmet\u0027in durumu tam bu fıkraya giriyor. Şimdi bu beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.82 f.1","karar":"yanlış","anlatim":"Süre dolunca borç bitmiyor, yalnızca dava hakkı zayıflıyor; borç eksik borç olarak yaşamaya devam ediyor. Mehmet isterse hâlâ ödeyebilir, borç yok olmadı.","formul":"Şık A: Mehmet \u0027zamanaşımı süresi dolduğu için borcum tamamen yok oldu, artık hiç ödeyemem\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK genel zamanaşımı ilkesi","karar":"yanlış","anlatim":"Zamanaşımı bir def\u0027idir, taraf ileri sürmezse hâkim bunu kendiliğinden dikkate almaz. Mehmet susarsa, mahkeme onu koruyucu olarak devreye girmez.","formul":"Şık B: Mahkemedeki hâkim, Mehmet hiçbir şey söylemese bile zamanaşımını kendiliğinden mi uygulayacak?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.82","karar":"yanlış","anlatim":"Süre dolmadan yapılan ödeme geçerli bir borcun ifasıdır, sebepsiz zenginleşme doğurmaz. Geri isteme hakkı burada hiç doğmaz.","formul":"Şık C: diyelim Mehmet süre dolmadan, 2016\u0027da parayı ödemiş olsaydı, sonradan \u0027zaten zamanaşımına uğrayacaktı, param geri gelsin\u0027 diyebilir miydi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.82 f.2","karar":"yanlış","anlatim":"Madde 82 fıkra 2\u0027deki kaçınma hakkı süreyle sınırlı değil, \u0027her zaman\u0027 kullanılabiliyor. Mehmet on yıl sonra da, yirmi yıl sonra da bu hakkı kullanabilir.","formul":"Şık D: Mehmet\u0027in bu kaçınma hakkı da iki yıllık öğrenme süresiyle mi sınırlı, süre geçince bu hakkı da mı kaybolur?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.82 f.2","karar":"doğru","anlatim":"Evet, kanun tam olarak bunu söylüyor; zenginleşen alacak hakkı kazanmışsa kaçınma hakkı süresiz. Mehmet\u0027in mahkemedeki sessizliği zaten bu hakkı fiilen kullanmasıdır.","formul":"Şık E: Ayşe\u0027nin dava hakkı zamanaşımına uğramış olsa bile, Mehmet bu borcu ödemekten her zaman kaçınabilir mi?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Bu olayda tek doğru nokta, alacak hakkı kazanılan zenginleşmede kaçınma hakkının süresiz olması. Kendine hep şunu sor: bu hüküm süreli bir def\u0027i mi, yoksa \u0027her zaman\u0027 kullanılan süresiz bir hak mı?","doldur":[]}],"anahtar":[{"ornek":"zenginleşme","kok":"zengin"},{"ornek":"mehmet","kok":"mehmet"},{"ornek":"alacak","kok":"alacak"},{"ornek":"kazanması","kok":"kazanm"},{"ornek":"kullanılabiliyor","kok":"kullan"},{"ornek":"zamanaşımına","kok":"zamana"}],"konuGiris":{"harita":"Ne zaman test edilir: İki yıllık öğrenme süresi ile on yıllık genel süre birlikte sorulduğunda test edilir. Nasıl ölçülür: Zamanaşımı dolduktan sonra borçlunun ifadan kaçınıp kaçınamayacağı ile ölçülür. Nasıl kaydedilir: Kanun metnindeki \u0027her zaman ifadan kaçınabilir\u0027 ibaresiyle kayıt altına alınır.","desen":"Soru genelde \u0027zamanaşımı doldu, borç sona erdi mi\u0027 tuzağıyla kurulur; öğrenci borcun tamamen ortadan kalktığını sanır. Oysa madde 82\u0027ye göre borç varlığını korur, sadece dava edilemez hale gelir. Bu soru Türk Borçlar Kanunu m.82\u0027nin ikinci cümlesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Zenginleşenden geri isteme yetkisi veren hak","ad":"İstem hakkı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Öğrenme tarihinden başlayan kısa zamanaşımı süresi","ad":"İki yıllık süre","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Zenginleşme tarihinden başlayan azami süre","ad":"On yıllık süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Zamanaşımı dolsa da borcu ödememe yetkisi","ad":"İfadan kaçınma hakkı","kim":"kanun sabitler"}],"sinavda":"Zenginleşmenin alacak hakkı yoluyla oluştuğu ve istem hakkının zamanaşımına uğradığı belirtilerek borçlunun durumu sorulur.","panel_ornek":"Arkadaşın sana 50 lira borç vermiş ama 2 yıl boyunca istememiş, artık mahkemede isteyemez. Ama sen o parayı kendi isteğinle geri vermek istersen, arkadaşın bunu almaktan kaçınamaz; çünkü borç hâlâ vardır, sadece dava yolu kapanmıştır.","ornek":"Arkadaşın sana 50 lira borç vermiş ama 2 yıl boyunca istememiş, artık mahkemede isteyemez. Ama sen o parayı kendi isteğinle geri vermek istersen, arkadaşın bunu almaktan kaçınamaz; çünkü borç hâlâ vardır, sadece dava yolu kapanmıştır.","yontemler":"Metindeki \u0027her zaman ifadan kaçınabilir\u0027 ifadesi kelimesi kelimesine hatırlanmalı, çünkü doğru şık bu cümlenin birebir karşılığıdır.","nedir":"Sebepsiz zenginleşme zamanaşımı, haksız yere mal varlığı artan kişiye karşı geri isteme hakkının ne kadar sürede düşeceğini belirler. Sınav, süre dolduktan sonra tarafların hukuki durumunun ne olacağını ölçer."},"olay":"gerekmez, doğrudan madde hükmü uygulanır.","tuzak":{"C":{"ad":"Geri İsteme Tuzağı","metin":"Süresinde yapılan ifayı sonradan geri alınabilir sanırsın. Doğrusu: Zamanaşımı dolmadan yapılan ifa geçerli bir borcun ödenmesidir, geri istenemez; sebepsiz zenginleşme burada söz konusu değildir."},"A":{"ad":"Sona Erme Tuzağı","metin":"Zamanaşımını borcu ortadan kaldıran bir kurum sanırsın. Doğrusu: Zamanaşımı yalnız dava edilebilirliği kaldırır, borç doğal borç olarak varlığını sürdürür; ödenirse geri istenemez."},"D":{"ad":"Süre Karıştırma Tuzağı","metin":"İki yıllık öğrenme süresini bu özel def\u0027e de uygularsın. Doğrusu: 82. madde f.2\u0027deki kaçınma hakkı süreye bağlı değildir, istem hakkı zamanaşımına uğramış olsa bile her zaman kullanılabilir."},"B":{"ad":"Resen Dikkat Tuzağı","metin":"Zamanaşımının mahkemece kendiliğinden uygulandığını sanırsın. Doğrusu: Zamanaşımı bir def\u0027idir, ileri sürülmezse hâkim tarafından dikkate alınmaz; burada da kural def\u0027i niteliğindedir."}},"celdiriciYol":{},"hap":"Türk Borçlar Kanunu m.82 f.2: zenginleşme, zenginleşenin bir alacak hakkı kazanması suretiyle gerçekleşmişse, diğer taraf istem hakkı zamanaşımına uğramış olsa bile bu borcunu ifadan her zaman kaçınabilir.","teshis":{"C":{"gercek":"Zamanaşımı dolmadan yapılan ifa geçerli bir borcun ödenmesidir, sebepsiz zenginleşme oluşturmaz.","ayirt":"Ödeme zamanaşımı dolmadan mı yapıldı, borç o anda geçerli miydi?","paragraf":"TBK m.82","yanilgi":"Süresinde yapılan her ödemenin sonradan geri istenebileceğini sanıyorsun."},"E":{"gercek":"Kanun koyucu, zenginleşenin bir alacak hakkı kazanması durumunda diğer tarafa süresiz bir kaçınma hakkı tanımıştır.","ayirt":"Madde metninde \u0027her zaman\u0027 ifadesi hangi hakka bağlanmış?","paragraf":"TBK m.82 f.2","yanilgi":"Bu hükmün de diğer zamanaşımı def\u0027ileri gibi süreye tabi olduğunu sanarak bu şıkkı elersin."},"A":{"gercek":"TBK m.82, süre dolunca yalnız dava/istem hakkını zamanaşımına uğratır; borç eksik borç olarak devam eder.","ayirt":"Süre dolunca borç mu bitiyor yoksa yalnız dava hakkı mı sınırlanıyor?","paragraf":"TBK m.82 f.1","yanilgi":"Zamanaşımı süresi dolunca borcun hukuken yok olduğunu sanıyorsun."},"D":{"gercek":"m.82 f.2\u0027deki kaçınma hakkı süreyle sınırlı değildir, istem hakkı zamanaşımına uğramış olsa bile her zaman kullanılır.","ayirt":"Bu hüküm süreli bir def\u0027i mi, yoksa süresiz bir kaçınma hakkı mı tanıyor?","paragraf":"TBK m.82 f.2","yanilgi":"İki yıllık öğrenme süresinin bu özel kaçınma hakkına da uygulandığını sanıyorsun."},"B":{"gercek":"Zamanaşımı bir def\u0027idir, tarafça ileri sürülmedikçe hâkim tarafından dikkate alınmaz.","ayirt":"Bu savunmayı biri ileri sürmek zorunda mı, yoksa mahkeme kendisi mi uygular?","paragraf":"TBK genel zamanaşımı ilkesi","yanilgi":"Zamanaşımının hâkim tarafından kendiliğinden gözetildiğini sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 129"},"kural":"Kanunun 79 üncü maddesine göre zenginleşen elinden çıkmış kısmı ispat ederse yalnız kalanı iade eder, ancak elden çıkarma iyiniyetli değilse veya ileride geri verme ihtimalini hesaba katması gerekiyorsa tamamını iade eder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 129","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"m.79\u0027daki iyiniyet/kötüniyet ayrımı ile m.77\u0027deki \u0027malvarlığı veya emek\u0027 ve \u0027geçersiz/gerçekleşmemiş/sona ermiş sebep\u0027 üçlüsünü madde madde karşılaştırarak oku.","konu":"sebepsiz zenginlesme genel esaslar","tablo":{"satirlar":[["A) Sebepsiz zenginleşen, zenginleşmeyi iyiniyetli olmaksızı…","TBK m.79","doğru ifade"],["B) İyiniyetli sebepsiz zenginleşen, geri istenmesi sırasınd…","TBK m.79","YANLIŞ ifade"],["C) Yetkisiz temsilcinin işlemini temsil olunan onamazsa, ka…","TBK m.47","YANLIŞ ifade"],["D) Sebepsiz zenginleşme yalnızca bir başkasının malvarlığın…","TBK m.77","YANLIŞ ifade"],["E) Zenginleşmenin geri istenebilmesi için dayandığı sebebin…","TBK m.77","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yetkisiz temsilcinin işlemini temsil olunan onamazsa, karşı tarafın elde ettiği zenginleşmeye ilişkin sebepsiz zenginleşme hakları düşer; yalnızca yetkisiz temsilciden zararın giderilmesi istenebilir.","E":"Zenginleşmenin geri istenebilmesi için dayandığı sebebin baştan itibaren hiç doğmamış olması gerekir; sonradan geçersiz hale gelen veya sona eren bir sebebe dayanan zenginleşme bu kapsamda değerlendirilmez.","A":"Sebepsiz zenginleşen, zenginleşmeyi iyiniyetli olmaksızın elden çıkarmışsa veya elden çıkarırken ileride geri vermek zorunda kalabileceğini hesaba katması gerekiyorsa, zenginleşmenin tamamını geri vermekle yükümlüdür.","D":"Sebepsiz zenginleşme yalnızca bir başkasının malvarlığından sağlanan haksız kazanımlar için söz konusu olur; emek karşılığı elde edilen zenginleşmeler bu kapsamda değerlendirilmez.","B":"İyiniyetli sebepsiz zenginleşen, geri istenmesi sırasında elinden çıkmış olduğunu ispat ettiği kısmı da dahil olmak üzere zenginleşmenin tamamını geri vermekle yükümlüdür."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027na göre sebepsiz zenginleşmenin genel esasları ile ilgili aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-09","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.77, m.79","dogru":"A","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Kayseri\u0027de bir tekstil atölyesi sahibi Kemal, komşu işletmenin kumaş stoğunu yanlışlıkla kendi deposuna aldırıyor, sonra 8.000 TL değerindeki kumaşı fark etmeden üretimde kullanıp bitiriyor.","anlatim":"Kemal bu kumaşı geri veremez çünkü artık elinde yok. Soru şu: Kemal bu 8.000 TL\u0027nin tamamını mı, yoksa bir kısmını mı öder?","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.79\u0027a göre Kemal elinden çıkanı ispat ederse yalnız kalanı öder, ama iyiniyetsiz elden çıkarmışsa veya ileride geri vereceğini bilebilecek durumdaysa tamamını öder. Şimdi bu beş ifadeyi Kemal\u0027in olayında tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.79","karar":"doğru","anlatim":"Evet öder, çünkü m.79 ikinci cümle tam da bunu söylüyor. Kötüniyetli veya öngörülü elden çıkarmada iade kapsamı tama çıkar.","formul":"Şık A: Kemal kumaşın komşusuna ait olduğunu bilerek, iade edeceğini düşünmeden kullanmış olsa, tamamını öder mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.79","karar":"yanlış","anlatim":"Hayır, iyiniyetli Kemal\u0027in elinden çıkanı ispat etmesi onu o kısımdan kurtarır. Kanun burada iyiniyeti ödüllendiriyor, cezalandırmıyor.","formul":"Şık B: Kemal iyiniyetliyse ve kumaşın elinden çıktığını ispat ediyorsa, yine de tamamını mı ödemek zorunda?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.47","karar":"yanlış","anlatim":"Hayır, m.47 sebepsiz zenginleşme haklarını saklı tutuyor. Yetkisiz temsilciden zarar giderimi istenmesi bu hakkı ortadan kaldırmaz.","formul":"Şık C: Kemal\u0027in ortağı Ahmet, yetkisiz temsilci olarak bir sözleşme yapsa ve Kemal onamasa, Kemal\u0027in sebepsiz zenginleşme hakları düşer mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.77","karar":"yanlış","anlatim":"Evet sayılır, çünkü m.77 malvarlığı ile emeği birlikte, ayrı ayrı sayıyor. Emek de kapsam dışı bırakılmamış.","formul":"Şık D: Kemal komşusunun kumaşını değil de bedava işçiliğini haksız kullanmış olsa, bu sebepsiz zenginleşme sayılır mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.77","karar":"yanlış","anlatim":"Evet istenebilir, çünkü m.77 sonradan sona eren sebebi de kapsama alıyor. Yalnız baştan hiç doğmamış sebep aranmıyor.","formul":"Şık E: Kemal\u0027le komşusu arasındaki teslim sözleşmesi başta geçerliyken sonradan feshedilmiş olsa, Kemal\u0027in aldığı kumaş yine geri istenebilir mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Kemal\u0027in kaderi tek şeye bağlı, elden çıkarırken iyiniyetli miydi yoksa geri vereceğini öngörebilir miydi? Kendine hep şunu sor: zenginleşen elden çıkarırken bunu geri vereceğini bilebilecek durumda mıydı?","doldur":[]}],"anahtar":[{"ornek":"zenginleşen","kok":"zengin"},{"ornek":"iyiniyetli","kok":"iyiniy"},{"ornek":"elinden","kok":"elinde"},{"ornek":"tamamını","kok":"tamamı"},{"ornek":"kapsamı","kok":"kapsam"},{"ornek":"çıkarırken","kok":"çıkarı"}],"konuGiris":{"harita":"Ne zaman doğar: haklı sebep olmaksızın başkasının malvarlığı veya emeğinden zenginleşme gerçekleştiğinde doğar. Nasıl ölçülür: geri verme yükümlülüğünün kapsamı, zenginleşenin iyiniyetli olup olmadığına göre belirlenir. Nasıl uygulanır: zenginleşenin elinden çıkanı ispatlaması hâlinde kalan kısım, ispat edemezse veya kötüniyetliyse tamamı iade edilir.","desen":"Soru genellikle m.77 ve m.79\u0027daki iyiniyet-kötüniyet ayrımını karıştırmaya çalışır; öğrenci iade kapsamının koşulsuz tam iade olduğunu sanabilir. Bir diğer tuzak, sebepsiz zenginleşmenin yalnızca para ile sınırlı olduğu yanılgısıdır; emekten zenginleşme de kapsam içindedir. Bu soru m.77 ve m.79 hükümlerinin genel esaslar başlığı altında birleştirilmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Haklı bir sebep olmaksızın başkasının malvarlığı veya emeğinden yararlanarak zenginleşme.","ad":"Sebepsiz zenginleşme","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Zenginleşmenin dayandığı hukuki sebebin geçerli olmaması veya hiç gerçekleşmemiş olması durumu.","ad":"Geçersiz sebep","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Elden çıkarma sırasında geri verme yükümlülüğünü öngörmesi gerekmeyen kişi.","ad":"İyiniyetli zenginleşen","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Elden çıkmış kısım ispatlanırsa kalan, ispatlanamaz veya kötüniyetliyse zenginleşmenin tamamı.","ad":"İade kapsamı","kim":"kanun sabitler"}],"sinavda":"Soru kökünde sebepsiz zenginleşmenin tanımı, koşulları veya iade kapsamıyla ilgili doğru ifade seçilmesi istenir.","panel_ornek":"Arkadaşın sana 50 lira gönderecekken yanlışlıkla 500 lira gönderdi ve sen bunu fark etmene rağmen harcadın. Burada haklı bir sebep olmadan mal varlığın arttığı için fazla 450 lirayı iade etmen gerekir.","ornek":"Arkadaşın sana 50 lira gönderecekken yanlışlıkla 500 lira gönderdi ve sen bunu fark etmene rağmen harcadın. Burada haklı bir sebep olmadan mal varlığın arttığı için fazla 450 lirayı iade etmen gerekir.","yontemler":"Metni madde madde ayır: önce zenginleşmenin doğuş şartı (m.77), sonra iade kapsamı ve iyiniyet ayrımı (m.79) olarak oku.","nedir":"Sebepsiz zenginleşme, haklı bir sebep olmadan başkasının malvarlığı veya emeği pahasına zenginleşenin bunu geri vermekle yükümlü olmasıdır. Sınav, zenginleşmenin şartlarını ve iade sınırlarını bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Saklı Hüküm Tersine Çevirme Tuzağı","metin":"öğrenci m.47\u0027deki \u0027sebepsiz zenginleşmeden doğan haklar saklıdır\u0027 hükmünü tersine okuyup bu hakların düştüğünü sanır. Doğrusu: yetkisiz temsilde zarar giderimi istenebilse de sebepsiz zenginleşme hakları ayrıca saklıdır, düşmez."},"E":{"ad":"Sebep Zamanlaması Tuzağı","metin":"öğrenci yalnız hiç doğmamış sebebi yeterli sanıp sonradan sona eren veya geçersizleşen sebebi kapsam dışı bırakır. Doğrusu: m.77 geçerli olmayan, gerçekleşmemiş ya da sona ermiş sebebi de kapsar."},"D":{"ad":"Kapsam Daraltma Tuzağı","metin":"öğrenci sebepsiz zenginleşmeyi yalnız malvarlığı hareketiyle sınırlar, emek unsurunu gözden kaçırır. Doğrusu: m.77 açıkça \u0027malvarlığından veya emeğinden\u0027 zenginleşmeyi birlikte sayar."},"B":{"ad":"İyiniyet-Kötüniyet Karıştırma Tuzağı","metin":"öğrenci m.79\u0027daki iyiniyet ayrımını atlayıp herkesin elden çıkardığını da iade edeceğini sanır. Doğrusu: iyiniyetli zenginleşen elinden çıkmış olduğunu ispat ettiği kısmın dışında kalanı iade eder, elden çıkanı iade etmez."}},"celdiriciYol":{},"hap":"Kötüniyetli veya ileride geri verme ihtimalini öngörmesi gereken sebepsiz zenginleşen, elden çıkardığı değeri de dahil olmak üzere zenginleşmenin tamamını iade eder.","teshis":{"C":{"gercek":"m.47 son fıkrası sebepsiz zenginleşmeden doğan hakları ayrıca saklı tutar, biri diğerini ortadan kaldırmaz.","ayirt":"Saklı tutulan hüküm hangi hakkı koruyor, düşürüyor mu yoksa saklı mı tutuyor?","paragraf":"TBK m.47","yanilgi":"Yetkisiz temsilden zarar giderimi istenince sebepsiz zenginleşme davasının artık açılamayacağını sanıyorsun."},"E":{"gercek":"m.77 geçerli olmayan, gerçekleşmemiş ya da sona ermiş sebebi birlikte sayar; üçü de kapsama girer.","ayirt":"Madde üç ihtimali de mi sayıyor, yoksa sadece birini mi?","paragraf":"TBK m.77","yanilgi":"Sebebin yalnız hiç doğmamış olması gerektiğini, sonradan düşen sebebin kapsam dışı kaldığını sanıyorsun."},"A":{"gercek":"m.79 uyarınca kötüniyetli elden çıkarma veya geri verme ihtimalinin öngörülmesi gereken durumda iade kapsamı tama çıkar.","ayirt":"Zenginleşen elden çıkarırken bunu geri vereceğini bilebilecek durumda mıydı?","paragraf":"TBK m.79","yanilgi":"Bu şıkkı elersen, iyiniyet unsurunun iade kapsamını değiştirmediğini sanıyorsundur."},"D":{"gercek":"m.77 metninde \u0027malvarlığından veya emeğinden\u0027 ibaresi birlikte, ayrık iki unsur olarak sayılır.","ayirt":"Madde metninde \u0027ve\u0027 mi \u0027veya\u0027 mı geçiyor, iki unsur birlikte mi sayılmış?","paragraf":"TBK m.77","yanilgi":"Sebepsiz zenginleşmeyi yalnız mal varlığı transferi sanıyorsun, emek unsurunu hesaba katmıyorsun."},"B":{"gercek":"m.79, iyiniyetli zenginleşene elinden çıkmış kısmı ispat etme imkânı tanır, o kısmı iadeden muaf tutar.","ayirt":"Zenginleşen elinden çıkanı ispat edebiliyor mu, iyiniyetli mi?","paragraf":"TBK m.79","yanilgi":"İyiniyetli zenginleşenin de her koşulda tamamını iade edeceğini sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 128"},"kural":"6098 sayılı Türk Borçlar Kanununun 67 nci maddesine göre hayvan bulunduran, zararın doğmasını engellemek için gerekli özeni gösterdiğini ispat ederse sorumlu olmaz; aynı Kanunun 69 üncü maddesinde yapı maliki için böyle bir özen ispatı imkânı düzenlenmemiştir, malik bakımından yapımdaki bozukluk veya bakımdaki eksiklik yeterlidir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 128","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Kusursuz sorumluluk sorularında önce \u0027bu hâlde kurtuluş kanıtı var mı yok mu\u0027 sorusunu sor, sonra rücu ile dış sorumluluğu ayrı değerlendir.","konu":"kusursuz sorumluluk kurtuluş kanıtı","tablo":{"satirlar":[["A) Hayvan bulunduran, zararın doğmasını engellemek için ger…","TBK m.67; TBK m.69","doğru ifade"],["B) İntifa hakkı sahibi, binanın bakımındaki eksikliklerden …","TBK m.69","YANLIŞ ifade"],["C) Hayvanın bir başkasına ait hayvan tarafından ürkütülmüş …","TBK m.67","YANLIŞ ifade"],["D) Yapı maliki, yapının yapımındaki bozukluğun kendisine de…","TBK m.69","YANLIŞ ifade"],["E) Hayvan bulunduran ile yapı maliki, kusursuz sorumlulukta…","TBK m.67","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Hayvanın bir başkasına ait hayvan tarafından ürkütülmüş olması hâlinde, hayvanı bulunduran zarar görene karşı sorumluluktan tamamen kurtulur ve yalnızca rücu hakkını kullanır.","E":"Hayvan bulunduran ile yapı maliki, kusursuz sorumluluktan yalnızca zarar görenin ağır kusurunu ispatla kurtulabilir; her ikisinin de özen ispatı yoluyla kurtulma imkânı yoktur.","A":"Hayvan bulunduran, zararın doğmasını engellemek için gerekli özeni gösterdiğini ispat ederek sorumluluktan kurtulabilirken, yapı maliki aynı nitelikte bir özen ispatıyla sorumluluktan kurtulamaz.","D":"Yapı maliki, yapının yapımındaki bozukluğun kendisine değil müteahhide ait olduğunu ispat ederek zarar görene karşı sorumluluktan kurtulabilir.","B":"İntifa hakkı sahibi, binanın bakımındaki eksikliklerden malikle birlikte müteselsilen sorumlu olduğundan, malikin kurtuluş kanıtı getirmesi hâlinde intifa hakkı sahibi de kendiliğinden sorumluluktan kurtulur."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Kusursuz sorumluluk hâllerinden hayvan bulunduranın sorumluluğu ile yapı malikinin sorumluluğuna ilişkin aşağıdakilerden hangisi her zaman doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-13","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.67 ve m.69","dogru":"A","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Ayşe\u0027nin bahçesinde beslediği köpek, komşu bahçedeki başka bir köpeğin havlamasıyla ürkerek kaçtı ve yoldan geçen Mehmet\u0027i ısırdı. Aynı sokakta 15 yıllık bina maliki Kemal\u0027in balkonu da o gün çöktü ve alttan geçen Zeynep yaralandı.","anlatim":"Aynı gün iki kusursuz sorumluluk olayı yaşanıyor. Ayşe hayvan bulunduran, Kemal yapı maliki. Şimdi bu iki olayda kurtuluş imkânlarını beş ifadeyle tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Ayşe\u0027nin ve Kemal\u0027in mahkemede hangi savunmayla sorumluluktan kurtulabileceğini Türk Borçlar Kanunu madde 67 ve madde 69 üzerinden karşılaştıracağız.","anlatim":"Kural şu: hayvan bulunduran gerekli özeni gösterdiğini ispat ederse kurtulur, yapı maliki için böyle bir özen ispatı imkânı yok. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.67; TBK m.69","karar":"doğru","anlatim":"Ayşe bu savunmayla gerçekten kurtulur çünkü madde 67 özen ispatını tanır. Kemal için kanun böyle bir kapı açmaz, o yüzden ikisi farklı konumdadır.","formul":"Şık A: Ayşe mahkemede \u0027köpeğimi hep bağlı tutuyordum, gerekli özeni gösterdim\u0027 diyerek kurtulabilir mi, Kemal de aynı şekilde \u0027binaya gerekli özeni gösterdim\u0027 diyerek kurtulabilir mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.69","karar":"yanlış","anlatim":"Kemal zaten kurtuluş kanıtı getiremez çünkü madde 69 malike bu imkânı vermez. Öncül gerçekleşmediği için sonuç da kurulamaz.","formul":"Şık B: Kemal\u0027in balkonunda oturma hakkı olan yaşlı teyzesi de var; Kemal kurtuluş kanıtı getirse teyze de kendiliğinden kurtulur mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.67","karar":"yanlış","anlatim":"Ayşe yine de Mehmet\u0027e karşı sorumludur, sadece o başka köpeğin sahibine rücu edebilir. Kurtuluş burada söz konusu değil, sadece iç ilişkide paylaşım var.","formul":"Şık C: Ayşe\u0027nin köpeği başka bir köpek tarafından ürkütüldüğü için Ayşe, Mehmet\u0027e karşı sorumluluktan tamamen kurtulur mu, sadece rücu hakkı mı kalır?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.69","karar":"yanlış","anlatim":"Kemal bu ispatla Zeynep\u0027e karşı kurtulamaz, sadece müteahhide rücu edebilir. Zarar gören karşısında malik yine sorumludur.","formul":"Şık D: Kemal \u0027balkonu inşa eden müteahhit hatalı yaptı, ben değil\u0027 diyerek Zeynep\u0027e karşı sorumluluktan kurtulabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.67","karar":"yanlış","anlatim":"Bu yanlış çünkü Ayşe zaten özen ispatıyla kurtulabiliyor, madde 67 bunu açıkça tanır. Sadece Kemal için özen ispatı kapalı, ikisini aynı kefeye koyamazsın.","formul":"Şık E: Ayşe ile Kemal, sadece Mehmet\u0027in ya da Zeynep\u0027in ağır kusurunu ispat ederek mi kurtulabilir, özen ispatı hiç işe yaramaz mı?"}],"anahtar":[{"ornek":"kurtuluş","kok":"kurtul"},{"ornek":"sorumluluktan","kok":"soruml"},{"ornek":"ispatıyla","kok":"ispatı"},{"ornek":"maliki","kok":"maliki"},{"ornek":"sadece","kok":"sadece"},{"ornek":"bulunduran","kok":"bulund"}],"konuGiris":{"harita":"Hangi sorumlu hangi savunmayla kurtulur: hayvan bulunduran gerekli özeni gösterdiğini ispatlayarak kurtulabilir mi diye sorulur. Yapı maliki aynı şekilde özen savunmasıyla kurtulabilir mi diye sorulur. İkisi arasındaki kurtuluş kanıtı farkı nasıl kaydedilir diye sorulur.","desen":"Sınav bu konuyu iki sorumluluk türünü karıştırıp \u0027ikisi de aynı şekilde kurtulur\u0027 diyerek tuzak kurar. Oysa m.67 hayvan bulunduran için açık kurtuluş kanıtı tanırken, m.69 yapı maliki için böyle bir ispatla kurtulma imkânı düzenlemez. Bu soru m.67 ile m.69 arasındaki kurtuluş kanıtı farkı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"hayvanın verdiği zarardan bakımını üstlenen kişinin sorumlu olması","ad":"hayvan bulunduranın sorumluluğu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"yapının bozukluğundan veya bakım eksikliğinden doğan zarardan malikin sorumlu olması","ad":"yapı malikinin sorumluluğu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"sorumlunun gerekli özeni gösterdiğini ispatlayarak sorumluluktan kurtulması imkânı","ad":"kurtuluş kanıtı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"ödeyen sorumlunun asıl kusurluya geri dönüp talep edebilmesi","ad":"rücu hakkı","kim":"kanun sabitler"}],"sinavda":"Soru iki madde metnini verir ve hangi ifadenin her iki sorumluluk hâli için de her zaman doğru olduğunu ister.","panel_ornek":"Bir arkadaşının köpeğini iki günlüğüne sen bakıyorsun ve köpek komşunun 3 saksısını kırıyor. Sen gerekli tüm önlemleri aldığını ispatlarsan, 3 saksının parasını ödemek zorunda kalmayabilirsin. Ama bina sahibi olsan, çatı çürük diye biri yaralansa, aynı \u0027özen gösterdim\u0027 savunması seni kurtarmaz.","ornek":"Bir arkadaşının köpeğini iki günlüğüne sen bakıyorsun ve köpek komşunun 3 saksısını kırıyor. Sen gerekli tüm önlemleri aldığını ispatlarsan, 3 saksının parasını ödemek zorunda kalmayabilirsin. Ama bina sahibi olsan, çatı çürük diye biri yaralansa, aynı \u0027özen gösterdim\u0027 savunması seni kurtarmaz.","yontemler":"Her iki maddeyi tek tek okuyup \u0027kurtuluş kanıtı var mı\u0027 sorusunu ayrı ayrı sor; sadece ortak kalan unsuru işaretle.","nedir":"Bu konu, kanunun bazı kişileri kusuru olmasa bile sorumlu tuttuğu halleri anlatır. Sınav, bu sorumluluktan hangi hâlde kurtulunabildiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Dış İlişki-İç İlişki Tuzağı","metin":"rücu hakkının saklı tutulmasını, zarar görene karşı sorumluluğun da sona erdiği şeklinde yorumlarsın. Doğrusu: madde 67 üçüncü fıkrasında hayvan bulunduranın zarar görene karşı sorumluluğu devam eder, yalnızca ürküten üçüncü kişiye rücu hakkı saklı tutulur."},"E":{"ad":"Kural Kapsamını Genelleştirme Tuzağı","metin":"iki farklı kusursuz sorumluluk hâlini tek bir kurtuluş rejimine indirgersin. Doğrusu: hayvan bulunduran için özen ispatı (kurtuluş kanıtı) açıkça mümkündür; bu imkânın her iki hâlde de bulunmadığını söylemek madde 67\u0027ye aykırıdır."},"D":{"ad":"Kurtuluş Kanıtı Yasağı Tuzağı","metin":"iç ilişkideki rücu imkânını, dış ilişkide sorumluluktan kurtulma sebebi sanırsın. Doğrusu: madde 69 malike, bozukluğun başkasına ait olduğunu ispat ederek zarar görene karşı sorumluluktan kurtulma hakkı tanımaz; malik ancak sorumlu üçüncü kişiye rücu edebilir."},"B":{"ad":"Rücu-Sorumluluk Karıştırma Tuzağı","metin":"müteselsil sorumluluğu, malikin kurtuluş kanıtının otomatik olarak diğerini de kurtaracağı biçiminde okursun; oysa malik zaten özen ispatıyla kurtulamaz, dolayısıyla intifa hakkı sahibinin kurtulması bu yoldan gerçekleşmez. Doğrusu: madde 69, malik dâhil hiçbir sorumlu için özen ispatını kurtuluş sebebi saymaz."}},"celdiriciYol":null,"hap":"Hayvan bulunduran özen ispatıyla (kurtuluş kanıtı) sorumluluktan kurtulabilir, yapı maliki bu yolla kurtulamaz; malikin ve sorumluların elindeki tek imkân sorumlu üçüncü kişiye rücudur.","teshis":{"C":{"gercek":"TBK m.67/3 yalnız iç ilişkide rücu hakkını korur; dış ilişkide hayvan bulunduranın zarar görene karşı sorumluluğu devam eder.","ayirt":"Bu hüküm zarar göreni mi, yoksa sorumlular arası ilişkiyi mi düzenliyor?","paragraf":"TBK m.67","yanilgi":"Rücu hakkının saklı tutulmasını, zarar görene karşı sorumluluğun sona ermesiyle karıştırırsın."},"E":{"gercek":"TBK m.67 hayvan bulunduran için açıkça özen ispatı imkânı tanır; bu imkânın hiçbir hâlde bulunmadığını söylemek maddeye aykırıdır.","ayirt":"Kural, ilgili sorumlu için özen ispatını gerçekten dışlıyor mu, yoksa yalnızca bir taraf için mi?","paragraf":"TBK m.67","yanilgi":"İki farklı kusursuz sorumluluk hâlini tek tip kurtuluş rejimine indirgeyip hayvan bulunduranın özen ispatı hakkını gözden kaçırırsın."},"A":{"gercek":"Madde 67 hayvan bulunduran için özen ispatını kurtuluş sebebi sayarken, madde 69 yapı maliki için böyle bir imkân tanımaz; ikisi farklı ağırlıkta kusursuz sorumluluk türüdür.","ayirt":"Bu madde, sorumluya özen ispatıyla kurtulma kapısı açık mı bırakılmış?","paragraf":"TBK m.67; TBK m.69","yanilgi":"Bu şıkkı elersen, her iki kusursuz sorumluluk hâlinin aynı kurtuluş rejimine tabi olduğunu düşünmüşsündür."},"D":{"gercek":"TBK m.69 malike, bozukluğun müteahhide ait olduğunu ispatla zarar görene karşı sorumluluktan kurtulma hakkı vermez; malik yalnız sorumlu üçüncü kişiye rücu edebilir.","ayirt":"Bu ispat zarar göreni mi bağlar, yoksa yalnızca sorumlular arası paylaşımı mı?","paragraf":"TBK m.69","yanilgi":"İç ilişkideki rücu imkânını dış ilişkide kurtuluş kanıtına dönüştürürsün."},"B":{"gercek":"TBK m.69, malik için kurtuluş kanıtı öngörmediğinden bu öncül zaten gerçekleşmez; müteselsillik yalnız sorumlu bulunanlar arasında işler.","ayirt":"Öncülde varsayılan kurtuluş imkânı, kanunda gerçekten var mı?","paragraf":"TBK m.69","yanilgi":"Müteselsil sorumluluğu görünce, bir sorumlunun kurtulmasının diğerini de otomatik kurtaracağını sanırsın."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 127"},"kural":"Türk Borçlar Kanununun 79 üncü maddesine göre zenginleşen, elden çıkarırken ileride geri vermek zorunda kalabileceğini hesaba katması gerekiyorsa zenginleşmenin tamamını geri vermekle yükümlüdür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 127","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Senaryoda \u0027dava/talep bilgisinden sonra\u0027 ifadesi geçiyorsa o andan itibaren elden çıkarma her zaman tam iade doğurur; iyiniyet anını buna göre tespit et.","konu":"sebepsiz zenginlesme iadesi","tablo":{"satirlar":[["VERİLENLER","-","-"],["Konu tutar","50.000 TL","-"],["HESAP","-","-"],["A) A\u0027nın, kendisine karşı iade davası açıldığını öğrendikte…","TBK m.79 f.2","doğru ifade"],["B) A\u0027nın, parayı iyiniyetle günlük ihtiyaçlarını karşılamak…","TBK m.79 f.1","YANLIŞ ifade"],["C) A\u0027nın, B\u0027nin durumu fark etmesinden önce parayı iyiniyet…","TBK m.79 f.1","YANLIŞ ifade"],["D) A\u0027nın, parayı hiç harcamayıp aynen kasasında saklamış ol…","TBK m.79 f.1","YANLIŞ ifade"],["E) A\u0027nın, ileride geri verme yükümlülüğünü hiç öngörmeden i…","TBK m.79 f.2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"A\u0027nın, B\u0027nin durumu fark etmesinden önce parayı iyiniyetle bir hayır kurumuna bağışlamasında","E":"A\u0027nın, ileride geri verme yükümlülüğünü hiç öngörmeden iyiniyetle yatırım yapıp parayı kaybetmesinde","A":"A\u0027nın, kendisine karşı iade davası açıldığını öğrendikten sonra parayı tatil harcamalarında kullanmasında","D":"A\u0027nın, parayı hiç harcamayıp aynen kasasında saklamış olmasında","B":"A\u0027nın, parayı iyiniyetle günlük ihtiyaçlarını karşılamak için harcaması ve elinden çıktığını ispat etmesinde"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Yalancı bir sebeple B\u0027den aldığı 50.000 TL\u0027yi elinde bulunduran A\u0027nın, bu tutarı çeşitli şekillerde elden çıkardığı durumlar arasında, Türk Borçlar Kanunu uyarınca A\u0027nın elden çıkardığı tutarı da B\u0027ye geri vermekle yükümlü olduğu durum aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-14","verilenler":[{"deger":"50.000 TL","anlam":"A\u0027nın B\u0027den sebepsiz olarak edindiği ve iade tartışmasına konu olan tutardır; olayın çözümünü değiştirmez, yalnız somutlaştırma sağlar.","ad":"Konu tutar"}],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.79","dogru":"A","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: C mobilyacısı, D\u0027den yalancı bir sebeple 50.000 TL alıyor; 3 hafta sonra D iade davası açtığını C\u0027ye tebliğ ettiriyor, C bunu öğreniyor.","anlatim":"C parayı elinde tutarken habersizdi, öğrendiği an durum değişiyor. Bu tek olayda beş ihtimali birer birer deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.79\u0027a göre zenginleşen kural olarak elinden çıkanı geri vermez, ama iyiniyetsizse ya da iade riskini hesaba katması gerekiyorsa tamamını öder.","anlatim":"Bu tek cümlelik kural şıkların hepsine tek tek uygulanacak. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"TBK m.79 f.2","karar":"doğru","anlatim":"C artık iade riskini biliyor, bu andan sonraki her harcama tam sorumluluk doğurur. Kural gereği C tamamını öder.","formul":"Şık A: C, davadan haberdar olduktan sonra parayı tatilde harcıyor; D\u0027ye tam iade eder mi?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"TBK m.79 f.1","karar":"yanlış","anlatim":"İyiniyetli harcamada m.79 f.1 devreye girer, sadece kalan kısım geri verilir. Tam iade yükümlülüğü burada doğmaz.","formul":"Şık B: C, parayı iyiniyetle günlük giderlerinde harcayıp elinden çıktığını ispat ediyor; tam iade söz konusu mu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"TBK m.79 f.1","karar":"yanlış","anlatim":"C bağış anında hiçbir risk öngörmüyor, iyiniyeti sürüyor. Sadece elinde kalan varsa onu öder, tamamını değil.","formul":"Şık C: D henüz durumu fark etmeden C parayı iyiniyetle bir hayır kurumuna bağışlıyor; tam iade gerekir mi?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"TBK m.79 f.1","karar":"yanlış","anlatim":"Para hâlâ C\u0027nin elinde, elden çıkarma hiç gerçekleşmemiş. Olağan iade uygulanır, m.79\u0027un istisnası konusuz kalır.","formul":"Şık D: C parayı hiç harcamamış, kasasında duruyor; burada elden çıkarma sorusu geçerli mi?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"TBK m.79 f.2","karar":"yanlış","anlatim":"C burada ne kötüniyetli ne de riski hesaba katması gereken biri. Bu yüzden tam iade yükümlülüğü doğmaz.","formul":"Şık E: C, iade riskini hiç öngörmeden iyiniyetle yatırım yapıp parayı kaybediyor; tam sorumluluk doğar mı?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Tek ayrım şu: elden çıkarma iade talebinden önce mi sonra mı olmuş, öncesi iyiniyeti korur sonrası tam sorumluluk getirir. Kendine hep şunu sor: bu harcama, iade riskini öğrendikten önce mi sonra mı yapılmış?","doldur":[]}],"anahtar":[{"ornek":"tamamını","kok":"tamamı"},{"ornek":"yükümlüdür","kok":"yüküml"},{"ornek":"elinden","kok":"elinde"},{"ornek":"vermek","kok":"vermek"},{"ornek":"iyiniyetsizse","kok":"iyiniy"},{"ornek":"harcama","kok":"harcam"}],"konuGiris":{"harita":"Ne zaman test edilir: Zenginleşen elde ettiği şeyi elden çıkardığında iade borcunun kapsamı belirlenirken test edilir. Nasıl ölçülür: Zenginleşenin elden çıkarırken iyiniyetli olup olmadığına ve geri verme ihtimalini öngörüp öngöremeyeceğine bakılarak ölçülür. Nasıl kaydedilir: İyiniyetliyse kalan kısım, kötüniyetliyse veya öngörülebilirse zenginleşmenin tamamı iade borcu olarak kaydedilir.","desen":"Sınav genelde aynı olayı farklı iyiniyet senaryolarıyla verip hangi durumda tam, hangisinde kısmi iade olduğunu ayırt etmeyi ister. Tuzak, \u0027elinden çıkmış olma\u0027 ile \u0027iyiniyetle çıkarma\u0027yı karıştırmaktır; sadece elden çıkarmış olmak tek başına kısmi iadeyi getirmez. Bu soru Türk Borçlar Kanunu m.79 fıkra 2\u0027deki iyiniyet/öngörülebilirlik ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Haklı bir sebep olmaksızın başkasının malvarlığından sağlanan kazanım.","ad":"sebepsiz zenginleşme","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Zenginleşenin elden çıkarırken geri verme yükümlülüğünü bilmemesi durumu.","ad":"iyiniyet","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Zenginleşilen değerin harcanması, tüketilmesi veya devredilmesi.","ad":"elden çıkarma","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Kötüniyetli veya öngörülebilir elden çıkarmada zenginleşmenin tamamının geri verilmesi zorunluluğu.","ad":"tam iade yükümlülüğü","kim":"kanun sabitler"}],"sinavda":"Olayda zenginleşenin parayı ne şekilde elden çıkardığı anlatılır ve hangi durumda tam iade borcu doğduğu sorulur.","panel_ornek":"Arkadaşın sana yanlışlıkla 300 TL göndermiş; sen bunun yanlış olduğunu bile bile 200 TL\u0027sini harcamışsın. Arkadaşın parayı geri istediğinde, bildiğin hâlde harcadığın için tamamını, yani 300 TL\u0027yi ödemen gerekir. Yani \u0027bilerek elden çıkarma\u0027 iyi niyeti ortadan kaldırır ve tam iade doğurur.","ornek":"Arkadaşın sana yanlışlıkla 300 TL göndermiş; sen bunun yanlış olduğunu bile bile 200 TL\u0027sini harcamışsın. Arkadaşın parayı geri istediğinde, bildiğin hâlde harcadığın için tamamını, yani 300 TL\u0027yi ödemen gerekir. Yani \u0027bilerek elden çıkarma\u0027 iyi niyeti ortadan kaldırır ve tam iade doğurur.","yontemler":"Öncelikle elden çıkarmanın iyiniyetli olup olmadığına bakılır; kötüniyetliyse veya geri verme ihtimali öngörülebiliyorsa tam iade uygulanır.","nedir":"Sebepsiz zenginleşme iadesi, haklı sebep olmadan başkasının malvarlığından kazanılan değerin geri verilmesini düzenler. Sınav, zenginleşenin elden çıkardığı tutarı ne zaman tam, ne zaman kısmi geri vereceğini ölçer."},"olay":"Dava açıldığını öğrenen A artık iade yükümlülüğünü hesaba katmak zorundadır, bu andan sonraki harcama iyiniyeti ortadan kaldırır.","tuzak":{"C":{"ad":"Zamanlama Tuzağı","metin":"Öğrenci bağışın \u0027elden çıkarma\u0027 olmasını yeterli görüp iyiniyet anını gözden kaçırır. Doğrusu: Fark edilmeden önce ve iyiniyetle yapılan bağışta A yalnız elinde kalanı geri verir, tamamından sorumlu tutulamaz."},"E":{"ad":"Öngörü Tuzağı","metin":"Öğrenci \u0027zarara uğrama\u0027 ile \u0027iyiniyetsizlik\u0027i karıştırıp her kayıp riskini tam iade sebebi sayar. Doğrusu: A, iade yükümlülüğünü hesaba katmadan iyiniyetle hareket ettiği için yalnız elinde kalanı geri vermekle yükümlüdür."},"D":{"ad":"Kapsam Tuzağı","metin":"Öğrenci madde 79\u0027un istisnai \u0027tam iade\u0027 kuralının her zenginleşen için geçerli olduğunu sanır. Doğrusu: Para hâlâ elindeyse zaten olağan iade söz konusudur, madde 79\u0027un iyiniyet istisnası burada uygulanmaz."},"B":{"ad":"İyiniyet Tuzağı","metin":"Öğrenci \u0027elinden çıkmış olma\u0027 ifadesini her durumda kısmi iadeye yeter sanır. Doğrusu: Madde 79 kısmi iade muafiyetini yalnız iyiniyetli elden çıkarmaya tanır; burada A hâlâ iyiniyetlidir, tam iade sorumluluğu doğmaz."}},"celdiriciYol":{},"hap":"Sebepsiz zenginleşen, elinden çıkardığı kısmı; ancak iyiniyetsizse ya da elden çıkarırken ileride geri vermek zorunda kalabileceğini hesaba katması gerekiyorsa tamamını geri vermekle yükümlüdür.","teshis":{"C":{"gercek":"Fark edilmeden önce yapılan iyiniyetli bağışta zenginleşen yalnız elinde kalanı geri verir, madde 79\u0027un istisnası devreye girmez.","ayirt":"Elden çıkarma anında zenginleşenin iade riskini bilmesi gerekiyor muydu?","paragraf":"TBK m.79 f.1","yanilgi":"Bağışı da \u0027riskli elden çıkarma\u0027 "tuzak":{"D":{"ad":"Kambiyo Kavramı Tuzağı","metin":"Ciro işlemi sıradan bir tahsilat işi sanılıp genel yetkiye dahil edilir. Doğrusu: Madde 504/2 kambiyo taahhüdünü açıkça özel yetki şartına bağlamıştır."},"E":{"ad":"Üçüncü Kişi Lehine Tuzağı","metin":"Kefalet, borçlunun kendi borcuna ilişkin olduğu için vekilin genel yetkisiyle karıştırılır. Doğrusu: Madde 504/2 vekilin özel yetki olmadan kefil olamayacağını açıkça düzenler."},"A":{"ad":"Taşınmaz Devri Tuzağı","metin":"İşin taşınmazla ilgili olması, taşınmazı doğrudan devretme yetkisini kapsadığını düşündürür. Doğrusu: Madde 504/2 taşınmaz devrini açıkça özel yetkiye bağlar, genel iş görme yetkisi bunu kapsamaz."},"B":{"ad":"Uyuşmazlık Çözümü Tuzağı","metin":"Sulh, işin doğal bir parçası gibi görünüp genel yetkiye dahil sanılır. Doğrusu: Madde 504/2 sulh olmayı özel yetki şartına bağlamıştır, vekil bunu kendiliğinden yapamaz."}},"celdiriciYol":{"D":"Kambiyo taahhüdü sıradan tahsilat işlemi sanılır, oysa m.504/2 bunu bağışlama ve kefaletle birlikte istisna listesine alır.","E":"Kefalet, vekâlet edenin borcuna ilişkin olduğu için genel yetkiye dahil sanılır, oysa m.504/2 kefaleti ayrıca sayar.","A":"Taşınmaz işiyle uğraşma genel yetkiye taşınmaz devrini de kattırır sanılır, oysa m.504/2 bunu ayrıca sayar (istisna atlanır).","B":"Sulh, dava dışı uzlaşma olduğu için \u0027basit iş\u0027 sayılır, oysa m.504/2 sulhu dava açma ile eşdeğer özel yetki konusu yapar."},"hap":"Vekil, işin görülmesi için gerekli hukuki işlemleri genel yetkiyle yapabilir; dava, sulh, hakeme başvurma, iflas/konkordato talebi, kambiyo taahhüdü, bağışlama, kefalet, taşınmaz devri ve sınırlaması için özel yetki şarttır.","teshis":{"C":{"gercek":"Madde 504/1, işin görülmesi için gerekli hukuki işlemleri genel vekâlet yetkisinin kendisine dahil eder; istisnalar yalnızca ikinci fıkrada sayılanlardır.","ayirt":"Bu işlem, işin görülmesi için gerekli olağan bir işlem mi, yoksa ikinci fıkrada sayılan istisnalardan biri mi?","paragraf":"TBK m.504/1","yanilgi":"Vekilin hiçbir sözleşme imzalayamayacağını, her hukuki işlemin özel yetki gerektirdiğini sanıyorsun."},"E":{"gercek":"Madde 504/2 kefil olmayı, bağışlama ve taşınmaz devri ile birlikte özel yetki gerektiren işlemler arasında sayar.","ayirt":"Bu işlem, maddenin ikinci fıkrasında tek tek sayılan istisnalardan biri mi?","paragraf":"TBK m.504/2","yanilgi":"Kefaletin vekâlet edenin lehine olduğunu, bu yüzden genel yetkiyle yapılabileceğini sanıyorsun."},"A":{"gercek":"Madde 504/2 taşınmaz devrini ve taşınmazı bir hakla sınırlamayı açıkça özel yetki şartına bağlar.","ayirt":"Bu işlem, maddenin ikinci fıkrasında tek tek sayılan istisnalardan biri mi?","paragraf":"TBK m.504/2","yanilgi":"Taşınmaz işiyle uğraşan vekilin taşınmazı devretme yetkisinin de kendiliğinden geldiğini sanıyorsun."},"D":{"gercek":"Madde 504/2 kambiyo taahhüdünde bulunmayı açıkça özel yetki gerektiren işlemler arasında sayar.","ayirt":"Bu işlem, maddenin ikinci fıkrasında tek tek sayılan istisnalardan biri mi?","paragraf":"TBK m.504/2","yanilgi":"Ciro/kambiyo işlemini tahsilat işinin doğal uzantısı, dolayısıyla genel yetki kapsamında sanıyorsun."},"B":{"gercek":"Madde 504/2 sulh olmayı, dava açma ve hakeme başvurma ile birlikte özel yetki gerektiren işlemler arasında sayar.","ayirt":"Bu işlem, maddenin ikinci fıkrasında tek tek sayılan istisnalardan biri mi?","paragraf":"TBK m.504/2","yanilgi":"Sulh olmayı, işin görülmesi için gerekli sıradan bir hukuki işlem sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 127"},"kural":"madde, malikin sorumluluğunu yapım bozukluğu ve bakım eksikliğinin ikisinden de kurarken, intifa/oturma hakkı sahibinin sorumluluğunu yalnız bakım eksikliğiyle sınırlar ve bunu malikle müteselsil kılar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 127","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde \u0027ve/veya\u0027 ile ayrılan iki sorumluluk sebebinin hangi özneye (malik mi, hak sahibi mi) bağlandığını ayrı ayrı işaretle.","konu":"yapı maliki sorumluluğu","tablo":{"satirlar":[["VERİLENLER","-","-"],["Türk Borçlar Kanunu madde numarası","69","-"],["HESAP","-","-"],["A) İntifa hakkı sahibi, binanın hem yapımındaki bozukluktan…","m.69/2","YANLIŞ ifade"],["B) İntifa ve oturma hakkı sahipleri, binanın yalnızca bakım…","m.69/2","doğru ifade"],["C) Yapı maliki, yalnızca binanın yapımındaki bozukluklardan…","m.69/1","YANLIŞ ifade"],["D) İntifa ve oturma hakkı sahiplerinin binanın bakımındaki …","m.69/2","YANLIŞ ifade"],["E) Sorumluların, zararın giderilmesinden sonra bu sebeplerl…","m.69/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yapı maliki, yalnızca binanın yapımındaki bozukluklardan doğan zararı gidermekle yükümlüdür; bakımındaki eksikliklerden sorumlu tutulamaz.","E":"Sorumluların, zararın giderilmesinden sonra bu sebeplerle kendilerine karşı sorumlu olan diğer kişilere rücu hakkı bulunmamaktadır.","A":"İntifa hakkı sahibi, binanın hem yapımındaki bozukluktan hem de bakımındaki eksiklikten doğan zarardan malikle birlikte müteselsilen sorumludur.","D":"İntifa ve oturma hakkı sahiplerinin binanın bakımındaki eksikliklerden doğan zarardan malikle sorumluluğu müşterek sorumluluk niteliğindedir.","B":"İntifa ve oturma hakkı sahipleri, binanın yalnızca bakımındaki eksikliklerden doğan zararlardan malikle birlikte müteselsilen sorumludurlar."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027nun 69 uncu maddesi uyarınca yapı maliki ile intifa ve oturma hakkı sahibinin sorumluluğuna ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-16","verilenler":[{"deger":"69","anlam":"Yapı maliki ile intifa ve oturma hakkı sahibinin sorumluluğunu düzenleyen kanun maddesinin sıra numarası.","ad":"Türk Borçlar Kanunu madde numarası"}],"dayanak":"6098 sayılı Türk Borçlar Kanunu m.69","dogru":"B","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Bursa\u0027da bir apartmanın malikinden intifa hakkını devralan Ahmet, 2019\u0027da bakım için bütçe ayırmıyor; 2022\u0027de merdiven boşluğundaki korkuluk çürüyüp yoldan geçen komşuya düşüyor ve 8000 TL zarar veriyor.","anlatim":"Bu tek olayda hem malikin hem Ahmet\u0027in sorumluluğunu tartışacağız.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.69\u0027a göre malik hem yapım bozukluğundan hem bakım eksikliğinden sorumlu, intifa/oturma hakkı sahibi ise yalnızca bakım eksikliğinden malikle müteselsilen sorumlu, ayrıca rücu hakkı saklı; şimdi beş ifadeyi bu 8000 TL\u0027lik korkuluk olayında tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.69/2","karar":"yanlış","anlatim":"Korkuluk çürümüş, yani bakım eksikliği var, yapım bozukluğu yok. Kanun intifa sahibinin sorumluluğunu sadece bakım eksikliğiyle sınırlar. Ahmet yapım kusurundan sorumlu tutulamaz.","formul":"Şık A: Ahmet\u0027in avukatı \u0027sen intifa hakkı sahibisin, binanın yapımındaki eski bir bozukluktan da malikle birlikte sorumlusun\u0027 derse, buna katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.69/2","karar":"doğru","anlatim":"Korkuluğun çürümesi tam bir bakım eksikliği örneği. Kanun bunu tam böyle söylüyor: intifa ve oturma hakkı sahibi bakım eksikliğinden malikle müteselsil sorumlu. Bu şık kanunun ikinci cümlesinin aynısı.","formul":"Şık B: mahkeme \u0027Ahmet, bakımı ihmal ettiği için malikle birlikte müteselsilen sorumludur\u0027 derse, bu doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.69/1","karar":"yanlış","anlatim":"Malik hem yapımdan hem bakımdan sorumlu, kanun ikisini de birinci cümlede sayar. Malik burada bakım eksikliğinden kaçamaz. Bu iddia kanuna aykırı.","formul":"Şık C: malik \u0027ben yapım kusurundan sorumluyum ama bu korkuluk eskiyip çürüdüğü için bakım eksikliğinden bana sorumluluk yüklenemez\u0027 derse, haklı mı?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.69/2","karar":"yanlış","anlatim":"Kanun metni açıkça \u0027müteselsilen\u0027 der, müşterek demez. Müteselsil sorumlulukta alacaklı istediği sorumludan tamamını isteyebilir, müşterekte durum farklıdır. Terim yanlış kullanılmış.","formul":"Şık D: komşunun avukatı \u0027Ahmet ile malik arasındaki bu birliktelik müşterek sorumluluktur\u0027 derse, terim doğru mu?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.69/3","karar":"yanlış","anlatim":"Kanunun son cümlesi rücu hakkını açıkça saklı tutar. Ahmet ödediği payı aşan kısmı için malike veya asıl kusurluya dönebilir. Bu iddia kanuna aykırı.","formul":"Şık E: Ahmet zararın tamamını komşuya ödedikten sonra \u0027artık kimseye rücu edemem\u0027 derse, haklı mı?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru cümle B: intifa/oturma hakkı sahibi yalnızca bakım eksikliğinden malikle müteselsil sorumludur. Kendine hep şunu sor: bu zarar yapımdan mı, bakımdan mı doğdu ve sorumluluk sıfatı gerçekten \u0027müteselsil\u0027 mi yazıyor?","doldur":[]}],"anahtar":[{"ornek":"sorumludur","kok":"soruml"},{"ornek":"eksikliğinden","kok":"eksikl"},{"ornek":"müteselsilen","kok":"mütese"},{"ornek":"intifa","kok":"intifa"},{"ornek":"sahibi","kok":"sahibi"},{"ornek":"malikle","kok":"malikl"}],"konuGiris":{"harita":"Ne zaman sorumluluk doğar: Yapının yapımındaki bozukluk veya bakımındaki eksiklik nedeniyle zarar meydana geldiğinde. Kim sorumlu tutulur: Yapım kusurunda yalnız malik, bakım eksikliğinde malik ile intifa/oturma hakkı sahibi birlikte. Nasıl paylaşılır: Sorumlular arasında müteselsil sorumluluk uygulanır ve rücu hakkı saklı tutulur.","desen":"Sınav, yapım bozukluğu ile bakım eksikliği ayrımını karıştırarak malik dışındaki hak sahiplerinin ne zaman sorumlu olduğunu sorar. Tuzak, intifa ve oturma hakkı sahiplerinin yalnız bakım eksikliğinden sorumlu tutulmasını yapım kusuruna da genişletmektir. Bu soru Türk Borçlar Kanunu m.69 metninden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Yapının inşası sırasında ortaya çıkan hatalı yapım eksikliği","ad":"yapım bozukluğu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yapının kullanım sürecinde gerekli onarımın yapılmamasından doğan kusur","ad":"bakım eksikliği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Birden fazla kişinin zararın tamamından birlikte ve ayrı ayrı sorumlu olması","ad":"müteselsil sorumluluk","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Ödeyen sorumlunun kusurlu diğer kişiden payını geri isteme hakkı","ad":"rücu hakkı","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda bir yapıdan doğan zarar durumu verilir ve kimin hangi sebeple sorumlu tutulacağı sorulur.","panel_ornek":"Bir apartmanın çatısından düşen bir kiremit, önündeki 3 bisikletten birine zarar verse, bundan bina sahibi sorumlu tutulur. Eğer dairede oturma hakkı olan bir kiracı da bakımı ihmal etmişse, ikisi birlikte sorumlu olabilir. Burada kim ne kadar öder sorusu, kusurdan çok yapıyla ilgili eksiklikten doğar.","ornek":"Bir apartmanın çatısından düşen bir kiremit, önündeki 3 bisikletten birine zarar verse, bundan bina sahibi sorumlu tutulur. Eğer dairede oturma hakkı olan bir kiracı da bakımı ihmal etmişse, ikisi birlikte sorumlu olabilir. Burada kim ne kadar öder sorusu, kusurdan çok yapıyla ilgili eksiklikten doğar.","yontemler":"Önce zararın yapım mı yoksa bakım kusurundan mı doğduğunu ayırt et; bakım eksikliğiyse malik ve hak sahibi birlikte, yapım kusuruysa yalnız malik sorumludur.","nedir":"Yapı maliki sorumluluğu, bina veya yapı eserlerinden doğan zararlarda kimin sorumlu tutulacağını düzenler. Sınav, kusursuz sorumluluk hallerinde malik ile sınırlı aynı hak sahiplerinin sorumluluk kapsamını ayırt etmeyi ölçer."},"olay":"","tuzak":{"C":{"ad":"Sorumluluk Daraltma Tuzağı","metin":"malikin sorumluluğunu yalnız yapım aşamasıyla sınırlı sanırsın. Doğrusu: malik hem yapımdaki bozukluktan hem bakımdaki eksiklikten sorumludur, madde ikisini de sayar."},"E":{"ad":"Rücu İnkarı Tuzağı","metin":"zararı gideren sorumlunun başka bir sorumluya başvuramayacağını düşünürsün. Doğrusu: madde, sorumluların kendilerine karşı sorumlu olan diğer kişilere rücu hakkını açıkça saklı tutar."},"D":{"ad":"Sorumluluk Türü Karıştırma Tuzağı","metin":"\u0027birlikte sorumluluk\u0027 ifadesini otomatik müşterek sorumluluk sanırsın. Doğrusu: kanun metni açıkça müteselsil sorumluluk öngörür, müşterek değil."},"A":{"ad":"Kapsam Genişletme Tuzağı","metin":"intifa/oturma hakkı sahibinin sorumluluğunu malikinkiyle aynı genişlikte (yapım+bakım) sanırsın. Doğrusu: bu kişiler yalnızca bakımdaki eksiklikten sorumludur, yapım bozukluğundan değil."}},"celdiriciYol":null,"hap":"Türk Borçlar Kanunu m.69\u0027da malik yapım bozukluğu VE bakım eksikliğinden, intifa/oturma hakkı sahibi ise YALNIZ bakım eksikliğinden malikle müteselsilen sorumludur; rücu hakkı saklıdır.","teshis":{"C":{"gercek":"Madde 69/1, malikin sorumluluğunu hem yapım bozukluğu hem bakım eksikliği için birlikte düzenler.","ayirt":"Madde metninde \u0027veya\u0027 bağlacıyla iki ayrı sebep birlikte mi sayılmış?","paragraf":"TBK m.69/1","yanilgi":"Malikin sorumluluğunu yalnız inşaat/yapım kusuruyla sınırlı sanıyorsun."},"E":{"gercek":"Madde son cümlesinde rücu hakkının saklı tutulduğu açıkça belirtilir.","ayirt":"Madde metninde rücu hakkına ilişkin ayrı bir cümle var mı, yok mu?","paragraf":"TBK m.69/3","yanilgi":"Zararı gideren sorumlunun bu ödemeyle işin bittiğini, başkasına dönemeyeceğini düşünüyorsun."},"A":{"gercek":"Madde 69/2, intifa ve oturma hakkı sahibinin sorumluluğunu yalnızca bakım eksikliğiyle sınırlı tutar.","ayirt":"Bu zarar yapım aşamasından mı, bakım aşamasından mı doğdu?","paragraf":"TBK m.69/2","yanilgi":"İntifa hakkı sahibinin de malik gibi hem yapım hem bakımdan sorumlu olduğunu sanıyorsun."},"D":{"gercek":"Kanun metni açıkça \u0027müteselsilen sorumludurlar\u0027 der, müşterek sorumluluk değildir.","ayirt":"Metinde geçen sorumluluk sıfatı harfiyen \u0027müteselsil\u0027 mi yoksa \u0027müşterek\u0027 mi?","paragraf":"TBK m.69/2","yanilgi":"\u0027Birlikte sorumlu olmak\u0027 ifadesini günlük dildeki \u0027müşterek\u0027 kavramıyla eşitliyorsun."},"B":{"gercek":"Madde, malik ile intifa/oturma hakkı sahibinin sorumluluk kapsamını bilerek farklı çizmiştir; ikinci fıkra yalnız bakım eksikliğini anar.","ayirt":"Sorumluluk kapsamı malik için mi yoksa hak sahibi için mi tarif ediliyor?","paragraf":"TBK m.69/1-2","yanilgi":"Bu ayrımı gereksiz ince bir detay sanıp maddeyi tek cümleye indirgeyerek atlıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 125"},"kural":"Madde, belirli bir tehlike hâli için öngörülen özel sorumluluk hükümlerinin saklı olduğunu belirtir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 125","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Kusursuz sorumluluk hallerinde önce \u0027özen ispatıyla kurtulma var mı yok mu\u0027 sorusunu sor; tehlike ve hakkaniyet sorumluluğunda bu kurtuluş kanıtı yoktur.","konu":"tehlike sorumluluğu","tablo":{"satirlar":[["VERİLENLER","-","-"],["Türk Borçlar Kanunu madde numarası","71","-"],["HESAP","-","-"],["A) İşletme sahibi, işlerinde uzman bir kişiden beklenen öze…","m.71/2","YANLIŞ ifade"],["B) Faaliyete hukuk düzenince izin verilmiş olması, zarar gö…","m.71/son","YANLIŞ ifade"],["C) Belirli bir tehlike hâli için özel kanunda öngörülen öze…","m.71/3","doğru ifade"],["D) İşletme sahibi tek başına sorumludur; işleten varsa ayrı…","m.71/1","YANLIŞ ifade"],["E) Tehlike sorumluluğunun doğması için zarar görenin işletm…","m.71/1-2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Belirli bir tehlike hâli için öz
