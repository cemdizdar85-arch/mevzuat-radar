<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".

   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. Koyu tema yalnız düğmeyle (data-theme="dark", tarayıcıda kc_tema) ya da ?tema=koyu ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}

.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}
#akis{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.kart{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;max-width:560px;margin:0 auto}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.78em;color:var(--dim);margin-bottom:8px}
.noktalar{display:flex;gap:5px}.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--cizgi);display:block}.noktalar i.ok{background:var(--yesil)}.noktalar i.yan{background:var(--kirmizi)}.noktalar i.simdi{outline:2px solid var(--mavi);outline-offset:1px}
.noktalar.cok{gap:3px;flex-wrap:wrap;max-width:58%;justify-content:center}.noktalar.cok i{width:5px;height:5px}
.tt.teori td:first-child{white-space:nowrap;font-weight:700;color:var(--dim);width:1%}
.sinavDil{font:inherit;font-size:.78em;color:var(--mavi);background:transparent;border:1px solid var(--cizgi);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer}
.sinavDilM{margin-top:6px;font-size:.86em;color:var(--dim);border-left:2px solid var(--cizgi);padding-left:8px}
.govde{flex:1;overflow-y:auto;padding-bottom:90px}
.rozet{display:inline-block;font-size:.72em;color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 50%,transparent);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}
.ipucu{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:.8em;pointer-events:none;animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.panel.acik{transform:translateY(0)}.tutamac{width:38px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 10px}
/* Cem 03.09 "gorunum boyle geliyor": KAPALI panel kartin altina (105%) kayiyor ve SONRAKI KARTIN ustune biniyordu.

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}

.ozet{font-size:.93em;margin:0 0 8px;line-height:1.45}.ozet b{color:var(--yesil)}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}

.cip2.ek{display:none}.cipler.acikEk .cip2.ek{display:inline-block}.cipler.acikEk .bDaha{color:var(--dim)}
.cipler .bDaha{border-style:dashed;color:var(--dim)}
.sek{display:none;margin-top:8px}.sek.acik{display:block;animation:gir .2s ease}
.panel{overscroll-behavior:contain}
.kavramL{margin:4px 0 8px;padding-left:18px}.kavramL li{margin:3px 0}.kavramL i{color:var(--dim);font-style:normal;font-size:.85em}
.panelBas{position:sticky;bottom:4px;display:block;margin:10px 0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:.84em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent)}

/* yanlis kutusu + hazirlik skoru */
.ustSag{display:flex;align-items:center;gap:6px}
.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}
.kutuEkran{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}.kutuEkran.acik{display:flex}
.kutuIc{background:var(--kart);width:min(100%,640px);max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 22px;border:1px solid var(--cizgi)}
@media(min-width:900px){.kutuEkran{align-items:center}.kutuIc{border-radius:18px}}
.kutuIc .basl{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}

.dersSat{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92em}.dersSat .bar{height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden}.dersSat .bar i{display:block;height:100%;background:var(--yesil)}
.kutuSat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.92em}
/* kaynak metni */
.kaynakAd{color:var(--mavi);font-weight:800;font-size:.85em;margin:8px 0 4px}.kaynakMetin{font-size:.9em;line-height:1.55;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px}.kaynakMetin mark{background:color-mix(in srgb,var(--altin) 35%,transparent);color:var(--yazi);padding:1px 2px;border-radius:3px}
/* sen anlat / t-hesabi / sinavda */
.ipnot{font-size:.84em;color:var(--dim);margin:2px 0 8px}
.anlatK{width:100%;background:var(--bg2);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 11px;font-size:.95em;font-family:inherit;resize:vertical}
.anlatSonuc{font-size:.92em;margin-top:8px;line-height:1.5}.anlatPuan{font-weight:800;font-size:1.05em;margin-bottom:4px}.anlatOrnek{margin-top:8px;border-left:4px solid var(--altin);padding:6px 10px;background:color-mix(in srgb,var(--altin) 8%,transparent);border-radius:0 8px 8px 0}
.tKutular{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:600px){.tKutular{grid-template-columns:1fr 1fr}}

.tGovde{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--yazi);min-height:88px}.tSol{border-right:2px solid var(--yazi);padding:6px 8px}.tSag{padding:6px 8px;text-align:right}

.cikmisK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.88em;color:var(--dim);line-height:1.45}.cikmisK .yil{display:inline-block;background:color-mix(in srgb,var(--mavi) 15%,transparent);color:var(--mavi);font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.85em}

.ogret{margin:4px 0 6px}.thpNot{font-size:.85em;color:var(--dim);margin:2px 0 8px}
.hesapK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.9em;line-height:1.45}.hesapK.yan{border-color:color-mix(in srgb,var(--kirmizi) 60%,transparent)}.hesapK.dog{border-color:color-mix(in srgb,var(--yesil) 60%,transparent)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.btn{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;font-size:.9em;cursor:pointer}.btn.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0}.btn.mavi{border-color:var(--mavi);color:var(--mavi)}
/* surukleme oyunu */

.oyun{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:20;overflow-y:auto}.oyun.acik{display:flex}

#akis,.govde,.tabloSar,.serit,.panel,.oyun{scrollbar-width:none}#akis::-webkit-scrollbar,.govde::-webkit-scrollbar,.tabloSar::-webkit-scrollbar,.serit::-webkit-scrollbar,.panel::-webkit-scrollbar,.oyun::-webkit-scrollbar{display:none}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

amını genişletir; ayrıca tazminattan söz edilmez."},"E":{"ad":"Kapsam Karıştırma Tuzağı","metin":"Giderleri isteme hakkı ile iade yükümlülüğü birbirine karıştırılır. Doğrusu: Giderleri isteme ayrı bir haktır, zenginleşenin asıl iade borcunu ortadan kaldırmaz."},"D":{"ad":"Muafiyet Tuzağı","metin":"İyiniyetin her zaman sorumluluğu tamamen kaldırdığı sanılır. Doğrusu: İyiniyet yalnızca ilk koşulu (kötüniyetsiz elden çıkarma) karşılar, ikinci koşul ayrıca aranır ve burada gerçekleşmiştir."},"A":{"ad":"İyiniyet Tuzağı","metin":"İyiniyetli olmak tek başına kısmi iade sağlar sanılır. Doğrusu: Kanun ikinci bir koşul daha koyar - hesaba katması gerekiyorsa iyiniyet tam iadeyi önlemez."}},"celdiriciYol":null,"hap":"İyiniyetli sebepsiz zenginleşen dahi, elden çıkarırken ileride geri vermek zorunda kalabileceğini hesaba katması gerekiyorsa zenginleşmenin tamamını iade eder.","teshis":{"C":{"gercek":"Kanun bu hâlde kişiyi kötüniyetli saymaz, yalnız iade kapsamını tam iadeye çıkarır.","ayirt":"Metinde kötüniyet mi hesaba katma mı anlatılıyor?","paragraf":"m.79/2","yanilgi":"Tam iade sonucunu görünce otomatik olarak kötüniyet ve tazminat eklediğini sanıyorsun."},"E":{"gercek":"Giderleri isteme ayrı bir haktır (m.79 devamı, II. Giderleri isteme hakkı); asıl iade borcunu ortadan kaldırmaz.","ayirt":"Soru iade borcunu mu yoksa gider talebini mi soruyor?","paragraf":"m.79 devamı","yanilgi":"Giderleri isteme hakkını, iade yükümlülüğünün yerine geçen bir hak sanıyorsun."},"A":{"gercek":"TBK m.79 iyiniyeti tek koşul saymaz; hesaba katma yükümlülüğü ayrı bir tam iade nedenidir.","ayirt":"İyiniyetliyim ama geri vermek zorunda kalabileceğimi biliyor muydum?","paragraf":"m.79/2","yanilgi":"İyiniyetli olmanın tek başına seni kısmi iadeye taşıdığını sanıyorsun."},"D":{"gercek":"İyiniyet yalnızca birinci koşulu karşılar; ikinci koşul (hesaba katma) ayrıca gerçekleşince tam iade doğar.","ayirt":"Sorumluluğun \u0027kalkması\u0027 mı yoksa \u0027genişlemesi\u0027 mi anlatılıyor?","paragraf":"m.79 eceği tarih","ad":"Dava tarihi"}],"dayanak":"Türk Borçlar Kanunu m.72/1","dogru":"E","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Verilen: Fiil tarihi 05.01.2016 (soruda verilen); Öğrenme tarihi 10.03.2019 (soruda verilen); Ceza zamanaşımı süresi 15 yıl (soruda verilen); Dava tarihi 20.02.2026 (soruda verilen)","anlatim":"Soru bize şunları vermiş: haksız fiil 05.01.2016\u0027da işlenmiş, zarar gören zararı ve failini 10.03.2019\u0027da öğrenmiş. Fiil ayrıca ceza kanununda 15 yıllık dava zamanaşımı öngörülen bir suç ve dava 20.02.2026\u0027da açılmış.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[6,1],[7,1],[8,1],[8,0]]},{"formul":"Genel kural: 2 yıllık öğrenme süresi + 10 yıllık fiil süresi; fiil daha uzun ceza zamanaşımlı bir suçsa o süre uygulanır","anlatim":"Türk Borçlar Kanunu nedir? Haksız fiil sorumluluğunu ve zamanaşımı sürelerini düzenleyen kanun. 72. madde tam burada devreye giriyor.","doldur":[]},{"formul":"2 yıllık süre bitişi = Öğrenme tarihi + 2 yıl = 10.03.2019 (soruda verilen) + 2 yıl = 10.03.2021","anlatim":"2 yıllık süre öğrenme tarihinden başlar, biz bunu hesaplıyoruz. Bu süre zarar görenin dava açması için normal süre.","doldur":[[6,0],[6,2]]},{"formul":"Karşılaştırma: 20.02.2026 (soruda verilen) ile 10.03.2021 (3. adımda bulduk) → dava tarihi sonra → dolmuş","anlatim":"Dava tarihini bu bitişle karşılaştırıyoruz. Dava 2026\u0027da açılmış, 2021\u0027i çoktan geçmiş yani bu süre dolmuş.","doldur":[[6,3]]},{"formul":"10 yıllık süre bitişi = Fiil tarihi + 10 yıl = 05.01.2016 (soruda verilen) + 10 yıl = 05.01.2026","anlatim":"10 yıllık süre fiil tarihinden başlar, öğrenmeye bakmaz. Bu süre azami sınır olarak konur.","doldur":[[7,0],[7,2]]},{"formul":"Karşılaştırma: 20.02.2026 (soruda verilen) ile 05.01.2026 (5. adımda bulduk) → dava tarihi sonra → dolmuş","anlatim":"Yine dava tarihiyle kıyaslıyoruz. Dava 20.02.2026, bitiş 05.01.2026\u0027dan sonra geldiği için bu süre de dolmuş.","doldur":[[7,3]]},{"formul":"Dahil değil: 2 yıllık süre 10.03.2021 (3. adımda bulduk), 10 yıllık süre 05.01.2026 (5. adımda bulduk); Türk Borçlar Kanunu m.72 gereği daha uzun ceza zamanaşımı uygulanır","anlatim":"Dahil değil: normalde iki ve on yıllık süreler dolunca dava hakkı biter, ama burada özel bir kural araya giriyor. Fiil aynı zamanda 15 yıllık ceza zamanaşımlı bir suç olduğu için bu iki süre uygulanmaz.","doldur":[]},{"formul":"15 yıllık süre bitişi = Fiil tarihi + 15 yıl = 05.01.2016 (soruda verilen) + 15 yıl = 05.01.2031","anlatim":"15 yıllık ceza zamanaşımı fiil tarihinden başlar, çünkü ceza kanunu suçu fiil anına bağlar. Bu süre şimdi devreye giren gerçek süre.","doldur":[[8,0],[8,2]]},{"formul":"Karşılaştırma: 20.02.2026 (soruda verilen) ile 05.01.2031 (8. adımda bulduk) → dava tarihi önce → henüz dolmamış","anlatim":"Dava tarihini bu son bitişle kıyaslıyoruz. 20.02.2026, 05.01.2031\u0027den önce olduğu için süre henüz dolmamış, dava zamanında açılmış.","doldur":[[8,3]]},{"formul":"Ters durum: ceza zamanaşımı süresi 10 yıldan kısa olsaydı → genel 10 yıllık süre (1. ve 5. adımdaki gibi) uygulanır","anlatim":"Ters durumda: fiil 15 yıllık değil de sıradan bir ceza zamanaşımına tabi olsaydı, yani ceza süresi 10 yıldan kısa olsaydı, genel 10 yıllık süre uygulanır ve dava 05.01.2026\u0027da zamanaşımına uğrardı.","doldur":[]},{"formul":"Yanlış yol: sadece 10 yıllık süreye bakıp 20.02.2026 \u003e 05.01.2026 (5. adımda bulduk) → zamanaşımına uğramış (HATALI) → doğrusu 15 yıllık ceza zamanaşımı 05.01.2031 (8. adımda bulduk) henüz dolmadı → zamanaşımına uğramamıştır","anlatim":"En sık hata: öğrenciler sadece 2 ve 10 yıllık süreye bakıp \u0027zamanaşımına uğramış\u0027 der, ama fiil aynı zamanda daha uzun ceza zamanaşımlı bir suç olduğunu gözden kaçırır. Doğrusu, 15 yıllık ceza zamanaşımı henüz dolmadığı için tazminat istemi zamanaşımına uğramamıştır.","doldur":[]}],"anahtar":[{"ornek":"yıllık","kok":"yıllık"},{"ornek":"zamanaşımı","kok":"zamana"},{"ornek":"tarihinden","kok":"tarihi"},{"ornek":"kanununda","kok":"kanunu"},{"ornek":"süreler","kok":"sürele"},{"ornek":"uygulanır","kok":"uygula"}],"konuGiris":{"harita":"Ne zaman test edilir: öğrenme tarihinden itibaren iki yıllık ve fiil tarihinden itibaren on yıllık sürelerin ikisi de dolmuş mu diye bakılır. Nasıl ölçülür: fiil ceza kanununda daha uzun zamanaşımı gerektiren bir suç oluşturuyorsa, o uzun ceza zamanaşımı süresi uygulanır. Nasıl kaydedilir: dava tarihi ile bu sürelerin bitiş tarihleri karşılaştırılarak zamanaşımının dolup dolmadığı sonucu yazılır.","desen":"Sınav genelde öğrenme tarihinden iki yıl geçmiş gibi görünse de fiilin ceza kanununda uzun zamanaşımlı bir suç oluşturduğu bilgisini vererek asıl uygulanacak sürenin uzun süre olduğunu test eder. Tuzak, öğrenciyi sadece iki veya on yıllık genel kurala bakıp ceza zamanaşımı istisnasını gözden kaçırmaya iter (Türk Borçlar Kanunu m.72). Bu soru m.72\u0027deki ceza zamanaşımı istisnası noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"zarar ve failin öğrenildiği tarihten başlayan iki yıllık kısa süre","ad":"öğrenme süresi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"haksız fiilin işlendiği tarihten başlayan on yıllık genel üst sınır","ad":"fiil süresi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"fiil daha uzun ceza zamanaşımlı suç oluşturuyorsa uygulanan uzatılmış süre","ad":"ceza zamanaşımı istisnası","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"her sürenin hangi olaydan itibaren işlemeye başladığını gösteren tarih","ad":"sürelerin başlangıç tarihi","kim":"kanun sabitler"}],"sinavda":"Fiil, öğrenme ve dava tarihleri verilip zamanaşımının dolup dolmadığının hangi kurala göre belirleneceği sorulur.","panel_ornek":"Bir arkadaşın komşusunun camını kırdı, komşu bunu 3 ay sonra öğrendi. Ama caddeye kamera koyduran belediye, kamera görüntülerinin saklama süresini 10 yıl olarak belirlemiş. Kısa fark eden süre mi işler yoksa uzun olan mı, kafanı karıştırabilir; işte zamanaşımı hesabı tam da bunu netleştirir.","ornek":"Bir arkadaşın komşusunun camını kırdı, komşu bunu 3 ay sonra öğrendi. Ama caddeye kamera koyduran belediye, kamera görüntülerinin saklama süresini 10 yıl olarak belirlemiş. Kısa fark eden süre mi işler yoksa uzun olan mı, kafanı karıştırabilir; işte zamanaşımı hesabı tam da bunu netleştirir.","yontemler":"Önce iki yıllık ve on yıllık süreleri hesapla, sonra fiilin ceza kanununda daha uzun süreli bir suç oluşturup oluşturmadığını kontrol et; oluşturuyorsa o süreyi esas al.","nedir":"Haksız fiilden doğan tazminat davasının hangi sürede açılması gerektiğini gösteren kurumdur. Sınav, öğrenme tarihinden başlayan kısa süre ile fiilin işlenmesinden başlayan uzun süreyi ve ceza zamanaşımı istisnasını doğru uygulayıp uygulayamadığını ölçer."},"olay":"Fiil tarihi 05.01.2016 + 15 yıl = 05.01.2031; dava tarihi 20.02.2026 bu tarihten öncedir.","tuzak":{"C":{"ad":"Yanlış Hesap Tuzağı","metin":"On yıllık sürenin 05.01.2026\u0027da dolduğunu gözden kaçırıp henüz dolmadığını düşünüyorsun; sonucu doğru bulsan da gerekçen yanlıştır. Doğrusu: On yıllık süre fiilen dolmuştur, zamanaşımına uğramama sebebi on beş yıllık ceza zamanaşımının uygulanmasıdır."},"A":{"ad":"İki Yıl Yeter Tuzağı","metin":"Öğrenmeden başlayan iki yıllık sürenin dolmuş olmasını tek başına yeterli sanıyorsun. Doğrusu: Fiil ceza kanununda daha uzun zamanaşımı öngörülen bir suçu oluşturduğundan iki yıllık ve on yıllık süreler yerine on beş yıllık süre uygulanır."},"D":{"ad":"Süre Hesabı Tuzağı","metin":"On beş yıllık sürenin 2026\u0027da dolduğunu sanıyorsun; oysa süre fiil tarihinden başlar ve 2031\u0027de dolar. Doğrusu: On beş yıllık ceza zamanaşımı süresi 2026 yılında henüz dolmamıştır."},"B":{"ad":"Genel Süre Tuzağı","metin":"On yıllık sürenin dolmuş olmasından hareketle zamanaşımına uğradığı sonucuna varıyorsun ve ceza kanunundaki daha uzun süreyi gözden kaçırıyorsun. Doğrusu: Ceza kanunu daha uzun zamanaşımı öngördüğünden bu süre uygulanır, on yıllık süre artık esas alınmaz."}},"celdiriciYol":{"C":"05.01.2016 + 10 yıl = 05.01.2026 tarihini dava tarihinden (20.02.2026) sonraymış gibi okuma (süre hesabı hatası)","A":"10.03.2019 + 2 yıl = 10.03.2021 (dolmuş) → doğrudan zamanaşımına uğradı sonucu (ceza zamanaşımı istisnasını atlama)","D":"05.01.2016 + 15 yıl hesabını 2026 sayarak yapma, yani süreyi dava yılıyla karıştırma (süre başlangıcı hatası)","B":"05.01.2016 + 10 yıl = 05.01.2026 (dava 20.02.2026\u0027dan önce dolmuş) → doğrudan zamanaşımına uğradı sonucu (ceza zamanaşımı istisnasını atlama)"},"hap":"Haksız fiil ceza gerektiren ve ceza kanununda daha uzun zamanaşımı öngörülen bir suçu oluşturuyorsa, iki yıllık ve on yıllık süreler yerine bu daha uzun ceza zamanaşımı süresi uygulanır.","teshis":{"C":{"gercek":"On yıllık süre 05.01.2026\u0027da fiilen dolmuştur; zamanaşımına uğramama nedeni bu değil, on beş yıllık ceza zamanaşımının uygulanmasıdır.","ayirt":"Zamanaşımına uğramama gerekçem hangi süreye dayanıyor, doğru süre bu mu?","paragraf":"TBK m.72/1","yanilgi":"Doğru sonuca ulaşsan da on yıllık sürenin dolduğunu fark etmeyip yanlış gerekçeyle savunuyorsun."},"E":{"gercek":"Türk Borçlar Kanunu m.72/1 cümle 2, ceza kanununun daha uzun zamanaşımı öngördüğü fiillerde bu sürenin uygulanacağını emreder; süre fiil tarihinden başlar ve dava tarihinde henüz dolmamıştır.","ayirt":"Fiil bir suç oluşturuyor mu ve o suç için öngörülen ceza zamanaşımı, genel sürelerden uzun mu?","paragraf":"TBK m.72/1","yanilgi":"Bu şıkkı eleyen öğrenci genellikle on yıllık sürenin dolmuş olmasına bakıp zamanaşımının gerçekleştiğini sanır, ceza zamanaşımının önceliğini gözden kaçırır."},"A":{"gercek":"Türk Borçlar Kanunu m.72/1 cümle 2 uyarınca fiil daha uzun ceza zamanaşımı öngörülen bir suçu oluşturuyorsa iki ve on yıllık süreler devre dışı kalır.","ayirt":"Fiil aynı zamanda bir suç mu, ceza kanunu daha uzun süre mi öngörüyor?","paragraf":"TBK m.72/1","yanilgi":"İki yıllık öğrenme süresinin dolmasını tek başına yeterli sayıp ceza zamanaşımı istisnasını hiç ara ak":"Türk Borçlar Kanunu (6098 s.K.) m.154/1 (zamanaşımının kesilmesi sebepleri); genel zamanaşımı süresi soruda parametre olarak verilmiştir.","dogru":"B","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Verilen: Genel zamanaşımı süresi 10 yıl (soruda verilen); doğumdan 7 yıl sonra kısmi ifa (soruda verilen); kısmi ifadan 8 yıl sonra icra takibi (soruda verilen)","anlatim":"Soru bize üç bilgi vermiş: genel zamanaşımı süresi, kısmi ifa zamanı ve icra takibi zamanı. Bunları biz bulmadık, soru direkt söylüyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kesilme sebebi = B\u0027nin borcu kısmen ifa etmesi (Türk Borçlar Kanunu m.154/1)","anlatim":"Zamanaşımının kesilmesi nedir? Borçlu borcu kabul eder ya da kısmen öderse süre sıfırlanır, o andan yeniden işlemeye başlar. Burada B\u0027nin kısmen ödemesi bu etkiyi yaratır.","doldur":[[5,1],[5,2],[6,1],[6,2]]},{"formul":"Kesilme sonucu = süre bu andan itibaren yeniden işler","anlatim":"Kesilme olunca eski geçen 7 yıl silinir, sayaç sıfırdan başlar. Neden sıfırlanır? Çünkü kanun kesilmeyi tam bir yeniden başlangıç sayıyor.","doldur":[]},{"formul":"Yeniden işleyen süre = kısmi ifadan icra takibine kadar geçen süre = 8 yıl (soruda verilen)","anlatim":"Şimdi biz kesilmeden sonra ne kadar süre geçtiğine bakıyoruz. Bu süre soruda zaten net verilmiş, ayrıca hesap yapmıyoruz.","doldur":[]},{"formul":"Karşılaştırma = yeniden işleyen süre ile genel süre → 8 (4. adımda bulduk) ile 10 (soruda verilen) → küçük olan: 8 ile 10 → 8","anlatim":"Şimdi biz bu 8 yılı, borcun tabi olduğu genel 10 yıllık süreyle karşılaştırıyoruz. Süre dolmuş mu diye bakmamızın tek yolu bu kıyas.","doldur":[[7,1],[7,2]]},{"formul":"Sonuç = 8 (4. adımda bulduk) \u003c 10 (soruda verilen) → süre dolmamıştır","anlatim":"8 yıl, 10 yıllık genel süreyi doldurmuyor. O yüzden icra takibi anında zamanaşımı henüz gerçekleşmemiş.","doldur":[]},{"formul":"Ters durum: yeniden işleyen süre ≥ 10 yıl olsaydı → zamanaşımı dolmuş olurdu","anlatim":"Ters durumda: kısmi ifadan icra takibine kadar 10 yıl ya da daha fazla geçseydi, zamanaşımı dolmuş sayılırdı. Yani sınır tam 10 yıl.","doldur":[]},{"formul":"Yanlış yol: 7 + 8 = 15 (HATALI) → doğrusu 8 (4. adımda bulduk) ile 10 (soruda verilen) kıyaslanır, süre dolmamıştır","anlatim":"En sık hata: öğrenci 7 yılla 8 yılı toplayıp 15 yılı genel 10 yılla kıyaslar, bu yanlıştır. Çünkü kesilmeden önceki 7 yıl kesilmeyle birlikte tamamen silinir, toplanmaz.","doldur":[]}],"anahtar":[{"ornek":"kesilme","kok":"kesilm"},{"ornek":"zamanaşımını","kok":"zamana"},{"ornek":"silinir","kok":"silini"},{"ornek":"başlar","kok":"başlar"},{"ornek":"takibi","kok":"takibi"},{"ornek":"kısmen","kok":"kısmen"}],"konuGiris":{"harita":"Ne zaman test edilir: kısmi ifa gibi bir kesilme sebebi süre dolmadan gerçekleştiğinde. Nasıl ölçülür: kesilme anından itibaren aynı sürenin tamamı yeniden işletilerek. Nasıl kaydedilir: kesilme tarihi yeni başlangıç noktası kabul edilip üzerine ilgili yıl eklenir.","desen":"Sınav genellikle olayın ortasına bir kısmi ifa veya ikrar yerleştirip sürenin kesildiğini fark edip etmediğinizi test eder. Tuzak, toplam süreyi baştan sona düz toplamaktır; oysa kesilmeden sonra süre sıfırdan başlar. Bu soru Türk Borçlar Kanunu m.154 kesilme sebepleri noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Alacağın istenebilirliğinin ortadan kalkması için gereken kanuni süre","ad":"Zamanaşımı süresi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Borçlunun ikrarı veya kısmi ifası gibi süreyi sıfırlayan olay","ad":"Kesilme sebebi","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Kesilme anından itibaren sürenin yeniden işlemeye başladığı tarih","ad":"Yeni başlangıç tarihi","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Yeni başlangıçtan itibaren geçen zamanın tam süreyi aşıp aşmadığının tespiti","ad":"Dolmuş süre kontrolü","kim":"kanun sabitler"}],"sinavda":"Borç doğum tarihi, kısmi ifa tarihi ve takip tarihi verilir, takip anında sürenin dolup dolmadığı istenir.","panel_ornek":"Bir arkadaşın sana borcunu tamamen değil de 50 lirasını verdiğini düşün, bu da borcu kabul ettiğinin göstergesi olur. Bu andan itibaren borcu isteme hakkın için süre sanki sıfırdan başlar. Yani eski geçen zaman silinmiş sayılır.","ornek":"Bir arkadaşın sana borcunu tamamen değil de 50 lirasını verdiğini düşün, bu da borcu kabul ettiğinin göstergesi olur. Bu andan itibaren borcu isteme hakkın için süre sanki sıfırdan başlar. Yani eski geçen zaman silinmiş sayılır.","yontemler":"Önce kesilme sebebinin gerçekleştiği tarihi bul, sonra o tarihten itibaren tam süreyi yeniden say.","nedir":"Zamanaşımı, alacağın belirli sürede istenmezse dava edilebilirliğinin ortadan kalkmasıdır. Sınav, kesilme halinin sürenin baştan işlemesine yol açtığını bilip bilmediğinizi ölçer."},"olay":"15-7=8 yıl; 8\u003c10.","tuzak":{"C":{"ad":"Kesilme Sebebini Görmezden Gelme Tuzağı","metin":"kısmen ifayı sıradan bir ödeme sayıp hukuki sonucunu yok sayıyorsun. Doğrusu: kısmen ifa, Türk Borçlar Kanunu m.154/1\u0027e göre açık bir kesilme sebebidir."},"E":{"ad":"Kesilmeyi Yok Sayma Tuzağı","metin":"kesilmenin süreyi sıfırladığını unutup doğumdan bugüne toplam 15 yılı esas alıyorsun. Doğrusu: kesilme anından itibaren yeniden başlayan 8 yıllık süre henüz 10 yılı doldurmamıştır."},"D":{"ad":"Toplam Süre Tuzağı","metin":"kesilme öncesi geçen 7 yılı da hesaba katıp 15 yıl buluyorsun, üstelik yönü de yanlış veriyorsun. Doğrusu: kesilme öncesi süre silinir, yalnız kesilme sonrası 8 yıl dikkate alınır."},"A":{"ad":"Eşik Karıştırma Tuzağı","metin":"kesilme sonrası geçen süreyi (8 yıl) doğru hesaplayıp yanlış yönle sonuçlandırıyorsun. Doğrusu: 8 yıl, 10 yıllık yeni süreyi doldurmadığından zamanaşımı dolmamıştır."}},"celdiriciYol":{"D":"7+8=15 (kesilme öncesi süreyi de sayma hatası) yapılmış, ancak 15\u003e10 iken \u0027dolmamış\u0027 denilmiştir = 15 (toplam süre ve yön karıştırma)","E":"7+8=15 (kesilmeyi hiç dikkate almama hatası) = 15 (kesilmeyi yok sayma)","A":"15-7=8, ancak 8\u003c10 iken \u0027dolmuştur\u0027 denilerek eşik yanlış uygulanmıştır = 8 (eşik karıştırma)"},"hap":"Zamanaşımını kesen bir olaydan sonra, o ana kadar işlemiş süre silinir ve aynı uzunlukta yeni bir süre baştan işlemeye başlar.","teshis":{"C":{"gercek":"TBK m.154/1 kısmen ifayı açıkça zamanaşımını kesen bir borç ikrarı hali sayar.","ayirt":"Borçlunun bu davranışı, borcu üstlendiğini gösteren bir kabul mü?","paragraf":"TBK m.154/1","yanilgi":"Kısmi ifanın yalnızca bir ödeme olduğunu, hukuki bir kesilme sebebi sayılmadığını düşünüyorsun."},"E":{"gercek":"Kesilme, o ana kadar işleyen süreyi ortadan kaldırır ve yeniden 10 yıllık süre başlatır; toplam süre değil, kesilme sonrası süre esas alınır.","ayirt":"Hesapladığım süre kesilmeden önceki günleri de içeriyor mu?","paragraf":"TBK m.154","yanilgi":"Kesilmenin etkisini hiç dikkate almadan, alacağın doğumundan bugüne geçen toplam süreyi (15 yıl) esas aldın."},"A":{"gercek":"TBK m.154 uyarınca kesilme yeni bir süre başlatır; bu süre yine 10 yıldır, 8 yıl bu eşiği doldurmaz.","ayirt":"Kesilmeden sonra geçen süre, o borç türü için öngörülen tam süreye ulaştı mı?","paragraf":"TBK m.154","yanilgi":"10 yıllık süreyi değil, kısmi ifadan sonra geçen 8 yılı yeterli sayıp süresinin dolduğunu düşünüyorsun."},"D":{"gercek":"Kesilme anından itibaren süre sıfırlanır; kesilme öncesi süreyi hesaba katmak yanlıştır, doğru süre yalnız kesilme sonrası 8 yıldır.","ayirt":"Süreyi hesaplarken başlangıç noktası olarak kesilme anını mı, alacağın doğum anını mı aldım?","paragraf":"TBK m.154","yanilgi":"Kesilmeyi hesaba katmadan alacağın doğumundan icra takibine kadar geçen toplam 15 yılı hesaplayıp yönü de karıştırdın."},"B":{"gercek":"TBK m.154/1\u0027e göre kısmen ifa kesilme sebebidir; kesilme anından itibaren yeniden 10 yıllık süre işler, 8 yıl bu süreyi doldurmamıştır.","ayirt":"Kesilme anından bugüne kaç yıl geçti, bu tam süreye ulaştı mı?","paragraf":"TBK m.154/1","yanilgi":"Kısmi ifanın k
