tı sıfıra bile indirebilir. Bu yüzden A ifadesi doğru.","formul":"Şık A: Yolcu kemerini takmayarak zararın artmasında etkili oldu; hâkim burada Kemal\u0027in tazminatını sadece indirebilir mi, yoksa tamamen kaldırabilir mi de?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"p.52/2","karar":"yanlış","anlatim":"Madde burada sadece \u0027indirebilir\u0027 der, kaldırma yetkisinden hiç söz etmez. Kemal yoksulluğa düşse bile hâkim en fazla indirim yapar, sıfırlamaz. Bu yüzden B ifadesi yanlış.","formul":"Şık B: Kemal hafif kusurluysa ve tazminatı ödediğinde yoksulluğa düşecekse, hâkim tazminatı tamamen kaldırabilir mi?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"p.52/2","karar":"yanlış","anlatim":"Madde bu korumayı açıkça \u0027hafif kusuruyla sebep olan\u0027 yükümlüyle sınırlamış. Kemal ağır kusurluysa bu kapıyı kullanamaz. Bu yüzden C ifadesi yanlış.","formul":"Şık C: Kemal ağır kusurluysa ve yoksulluğa düşecekse, yine de bu yoksulluk savunmasından yararlanıp indirim isteyebilir mi?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"p.52/1","karar":"yanlış","anlatim":"Madde tam tersini söyler: zarar görenin yükümlünün durumunu ağırlaştırması da üç indirim/kaldırma sebebinden biridir. Kemal\u0027in olayında bu gerçekleşse hâkim yine indirim ya da kaldırma yapabilir. Bu yüzden D ifadesi yanlış.","formul":"Şık D: Diyelim karşı taraftaki yolcu, kazadan sonra Kemal\u0027i darp ederek onun maddi durumunu bilerek kötüleştirdi; bu, hâkimin indirim yapmasına hiç imkân vermez mi?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"p.52/1","karar":"yanlış","anlatim":"Madde rızayı, diğer iki hâlle birlikte, hâkimin indirim/kaldırma yetkisini doğuran bağımsız bir sebep olarak sayar. Kemal\u0027in olayında bu rıza varsa hâkim kesinlikle değerlendirir. Bu yüzden E ifadesi yanlış.","formul":"Şık E: Yolcu kazadan önce \u0027hızlı sür, önemli değil\u0027 diyerek fiile rıza gösterseydi, hâkim bunu tazminat indiriminde hiç değerlendiremez mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Kemal\u0027in olayında tek doğru nokta, birinci fıkradaki üç hâlin hem indirim hem tam kaldırma yetkisi vermesidir. Kendine hep şunu sor: bu olgu birinci fıkrada mı, ikinci fıkrada mı, ve sonuç \u0027indirim\u0027 mi yoksa \u0027indirim veya kaldırma\u0027 mı?","doldur":[]}],"anahtar":[{"ornek":"indirim","kok":"indiri"},{"ornek":"kaldırma","kok":"kaldır"},{"ornek":"yükümlünün","kok":"yüküml"},{"ornek":"ifadesi","kok":"ifades"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"görenin","kok":"göreni"}],"konuGiris":{"harita":"Ne zaman uygulanır: Zarar gören fiile razı olmuş, zararın doğmasına etkili olmuş ya da yükümlünün durumunu ağırlaştırmışsa. Kim karar verir: Đndirim veya kaldırma kararını hâkim takdir eder. Ek şart nedir: Hafif kusurlu yükümlü için ayrıca yoksulluğa düşme ve hakkaniyet şartı aranır.","desen":"Sınav genellikle \u0027hâkim indirebilir mi, zorunlu müdür\u0027 ayrımını sorar; madde metninde \u0027indirebilir\u0027 ifadesi takdiri gösterir, \u0027indirmelidir\u0027 değildir. Diğer tuzak, hafif kusur hâlinde hem yoksulluk hem hakkaniyet şartının birlikte aranmasıdır. Bu soru Türk Borçlar Kanunu m.52\u0027nin indirim sebepleri ve hâkimin takdir yetkisi noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Zarar görenin zararı doğuran fiile önceden razı olması durumu.","ad":"Zarar görenin rızası","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Zararın doğmasında veya artmasında zarar görenin de etkili olması.","ad":"Ortak kusur","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Yükümlünün hafif kusuru ve ödeme hâlinde yoksullaşma riski varsa uygulanan indirim.","ad":"Hafif kusur indirimi","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Hafif kusur indiriminin uygulanabilmesi için ayrıca aranan adalet ölçütü.","ad":"Hakkaniyet şartı","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soru, tazminattan indirim hâllerinden hangisinin doğru tanımlandığını sorar ve madde metnindeki koşulların doğru eşleştirilmesini ister.","panel_ornek":"Bir arkadaşın senden borç aldığı 5 lirayı geç ödediğinde, sen de biraz gecikmesine göz yummuşsan hâkim bu durumu dikkate alıp cezayı azaltabilir. Yani zarar görenin kendi davranışı da sonucu etkiler. Bu, günlük hayatta \u0027sen de kusurluydun\u0027 mantığının hukuktaki karşılığıdır.","ornek":"Bir arkadaşın senden borç aldığı 5 lirayı geç ödediğinde, sen de biraz gecikmesine göz yummuşsan hâkim bu durumu dikkate alıp cezayı azaltabilir. Yani zarar görenin kendi davranışı da sonucu etkiler. Bu, günlük hayatta \u0027sen de kusurluydun\u0027 mantığının hukuktaki karşılığıdır.","yontemler":"Metindeki \u0027razı olma, zararın doğmasına etkili olma, durumu ağırlaştırma\u0027 üç hâlini ayrı ayrı ezberle; hafif kusur indirimini bunlardan ayrı, ek şartlı bir durum olarak gör.","nedir":"Haksız fiil tazminatının indirilmesi ya da tamamen kaldırılması, zarar görenin kusuru veya durumu ağırlaştırması hâllerinde hâkimin takdir yetkisini kullanmasıdır. Sınav bu maddedeki indirim sebeplerinin hangi kişiye ve hangi şarta bağlı olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Ağırlık Karıştırma Tuzağı","metin":"yoksulluk savunmasının her kusur derecesinde geçerli olduğu sanılır. Doğrusu: yoksulluğa dayalı indirim yalnız HAFİF kusurla sebep olan yükümlü için öngörülmüştür, ağır kusurlu bundan yararlanamaz."},"E":{"ad":"Unsur Eksik Sayma Tuzağı","metin":"rızanın yalnız kusur oranını etkileyen bir olgu olduğu, indirim sebebi sayılmadığı düşünülür. Doğrusu: zarar görenin zararı doğuran fiile rıza göstermesi de maddede açıkça sayılan bağımsız bir indirim sebebidir."},"D":{"ad":"Kapsam Daraltma Tuzağı","metin":"madde metnindeki üç ayrı indirim sebebinden yalnız zarar görenin kusuruna odaklanılıp diğer hâl gözden kaçırılır. Doğrusu: yükümlünün durumunun ağırlaştırılmış olması da maddede sayılan bağımsız bir indirim sebebidir."},"B":{"ad":"Kesişim Tuzağı","metin":"öğrenci maddedeki iki ayrı indirim grubunu (zarar görenin kusuru/rızası - yükümlünün hafif kusuru) tek kural sanıp her ikisinde de kaldırma yetkisi olduğunu düşünür. Doğrusu: hafif kusurlu yükümlünün yoksulluk hâlinde hâkim SADECE indirim yapabilir, tamamen kaldıramaz."}},"celdiriciYol":null,"hap":"Türk Borçlar Kanunu m.52\u0027de zarar görenin kusuru/rızası veya yükümlünün durumunu ağırlaştırması indirim VE tam kaldırma sebebidir; hafif kusurlu yükümlünün yoksulluğa düşme hâli ise yalnız indirim sebebidir.","teshis":{"C":{"gercek":"Madde metni \u0027zarara hafif kusuruyla sebep olan\u0027 ibaresiyle bu indirim imkânını açıkça hafif kusurla sınırlamıştır; ağır kusurlu yükümlü bu korumadan yararlanamaz.","ayirt":"Yükümlünün kusuru ağır mı hafif mi, madde bu ayrımı yapıyor mu?","paragraf":"TBK m.52/2","yanilgi":"Sen, yoksulluk savunmasının kusur derecesine bakılmaksızın her yükümlü için geçerli olduğunu sanıyorsun."},"E":{"gercek":"Madde metni zarar görenin fiile rıza göstermiş olmasını, diğer iki hâlle birlikte, hâkimin indirim/kaldırma yetkisini doğuran bağımsız bir sebep olarak sayar.","ayirt":"Rıza, maddede ayrı bir bent/ibare olarak mı sayılmış?","paragraf":"TBK m.52/1","yanilgi":"Sen, rızanın yalnızca kusur oranını etkileyen dolaylı bir unsur olduğunu, bağımsız bir indirim sebebi sayılmadığını düşünüyorsun."},"A":{"gercek":"Türk Borçlar Kanunu m.52/1\u0027de sayılan üç hâl (rıza, zararda etkili olma, durumu ağırlaştırma) hâkime indirim VEYA TAM KALDIRMA yetkisi verir; m.52/2\u0027deki yoksulluk hâli ise yalnız indirim yetkisi verir.","ayirt":"Bu olgu hangi fıkrada, hangi sonuç (indirim mi kaldırma mı) bağlanmış?","paragraf":"TBK m.52/1","yanilgi":"Bu şıkkı elediysen, maddedeki üç indirim sebebinin hepsinin aynı sonucu (yalnız indirim) doğurduğunu sanıyorsundur."},"D":{"gercek":"Madde, zarar görenin tazminat yükümlüsünün durumunu ağırlaştırmış olmasını da üç indirim/kaldırma sebebinden biri olarak açıkça sayar.","ayirt":"Madde metninde kaç ayrı indirim sebebi sayılıyor, ben hepsini mi düşündüm?","paragraf":"TBK m.52/1","yanilgi":"Sen, indirim sebeplerinin yalnız zarar görenin davranışlarıyla sınırlı olduğunu, yükümlünün kendi davranışının bu kapsamda sayılmadığını düşünüyorsun."},"B":{"gercek":"Madde metni açıkça \u0027hâkim, tazminatı indirebilir\u0027 der, kaldırma yetkisinden söz etmez; bu yetki yalnız birinci fıkradaki üç hâl için tanınmıştır.","ayirt":"Bu cümlede \u0027kaldırabilir\u0027 mi yoksa yalnız \u0027indirebilir\u0027 mi geçiyor?","paragraf":"TBK m.52/2","yanilgi":"Sen, hafif kusurlu yükümlünün yoksulluk hâlinde de tazminatın tamamen kaldırılabileceğini düşünüyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 129"},"kural":"6098 sayılı Türk Borçlar Kanununun 79 üncü maddesine göre iyiniyetli zenginleşen, geri istenmesi sırasında elinden çıkmış olduğunu ispat ettiği kısmın dışında kalanı geri vermekle yükümlüdür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 129","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde \u0027veya\u0027 bağlacıyla bağlanan iki koşulu (kötüniyet / öngörme yükümlülüğü) ayrı ayrı ara, tek koşula indirgeyen şıkka güvenme.","konu":"sebepsiz zenginlesme","tablo":{"satirlar":[["A) İyiniyetli sebepsiz zenginleşen, geri istenmesi sırasınd…","TBK m.79/f.1","doğru ifade"],["B) Zenginleşmeyi iyiniyetli olmaksızın elden çıkaran zengin…","TBK m.79/f.2","YANLIŞ ifade"],["C) İyiniyetli sebepsiz zenginleşen dahi, zenginleşmenin tam…","TBK m.79/f.1","YANLIŞ ifade"],["D) İyiniyet değerlendirmesinde esas alınacak an, zenginleşm…","TBK m.79/f.2","YANLIŞ ifade"],["E) Zenginleşen, elden çıkarırken ileride geri vermek zorund…","TBK m.79/f.2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İyiniyetli sebepsiz zenginleşen dahi, zenginleşmenin tamamını her durumda geri vermekle yükümlüdür.","E":"Zenginleşen, elden çıkarırken ileride geri vermek zorunda kalabileceğini hesaba katması gerekse dahi, iyiniyetli sayılarak yalnızca elinde kalanı geri vermekle yükümlüdür.","A":"İyiniyetli sebepsiz zenginleşen, geri istenmesi sırasında elinden çıkmış olduğunu ispat ettiği kısmın dışında kalanını geri vermekle yükümlüdür.","D":"İyiniyet değerlendirmesinde esas alınacak an, zenginleşmenin gerçekleştiği an değil, davanın açıldığı tarihtir.","B":"Zenginleşmeyi iyiniyetli olmaksızın elden çıkaran zenginleşen, yalnızca elinde kalan kısmı geri vermekle yükümlüdür."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":8,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027na göre sebepsiz zenginleşenin geri verme borcunun kapsamına ilişkin aşağıdaki ifadelerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-01","verilenler":[],"dayanak":"6098 sayılı Türk Borçlar Kanunu m.79","dogru":"A","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Kumaşçı Nadir, komşusunun deposuna yanlışlıkla bırakılan 200 top kumaşı 40.000 TL\u0027ye satıp parayı harcamış.","anlatim":"Nadir bu kumaşın kendisine ait olmadığını hiç bilmiyormuş, satış tarihinde tamamen iyiniyetliymiş. Şimdi gerçek sahip kumaşları geri istiyor ama Nadir\u0027in elinde artık ne kumaş var ne de bütün para.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.79\u0027a göre, Nadir\u0027in iade borcu iyiniyetliyse elinde kalanla sınırlı, iyiniyetli değilse ya da öngörmesi gerekiyorsa tam.","anlatim":"Kural tek: elinden çıkmışsa ve elinden çıkarırken iyiniyetliyse yalnız kalanı öder, değilse tamamını öder. Şimdi beş ifadeyi bu Nadir olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.79/f.1","karar":"doğru","anlatim":"Nadir iyiniyetli olduğunu ve kumaşın elinden çıktığını ispatlarsa yalnız elinde kalanı iade eder. Bu tam olarak Türk Borçlar Kanunu\u0027nun 79 üncü maddesinin birinci fıkrasında yazan kural.","formul":"Şık A: Nadir kumaşın elinden çıktığını ispat ederse, geri kalanı mı öder yoksa hâlâ tamamını mı ödemek zorunda kalır?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.79/f.2","karar":"yanlış","anlatim":"Hayır, kötüniyetli elden çıkarma varsa Nadir zenginleşmenin tamamını, yani 40.000 TL\u0027nin hepsini öder. Sınırlı sorumluluk yalnız iyiniyetliye tanınır.","formul":"Şık B: Nadir kötüniyetli olsaydı, yani kumaşın kendine ait olmadığını bilerek sattıysa, yalnız elinde kalanı mı öder?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.79/f.1","karar":"yanlış","anlatim":"Hayır, iyiniyetli Nadir için kural tam tersi: elinden çıkmışsa yalnız kalanı öder, tamamını ödemesi gerekmez. \u0027Her durumda\u0027 ifadesi maddeyle çelişir.","formul":"Şık C: Nadir iyiniyetli olsa bile, her durumda kumaşın tamamının bedelini mi ödemek zorunda?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.79/f.2","karar":"yanlış","anlatim":"Hayır, madde metninde böyle bir dava tarihi ölçütü yok. İyiniyet, kumaşı elden çıkardığı andaki tutumuna göre değerlendirilir.","formul":"Şık D: İyiniyet değerlendirmesi, Nadir\u0027in davanın açıldığı tarihteki durumuna mı bakılarak yapılır?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.79/f.2","karar":"yanlış","anlatim":"Hayır, bunu öngörmesi gerekiyorsa da tam iade borcu doğar. Madde bu ihtimali de tam sorumluluğa bağlar.","formul":"Şık E: Nadir, parayı harcarken \u0027belki geri vermem gerekir\u0027 diye düşünmesi gerekiyor olsa bile, yine de yalnız elinde kalanı mı öder?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Tek doğru A, çünkü iyiniyetli zenginleşenin sorumluluğu elinde kalanla sınırlı. Kendine hep şunu sor: elden çıkarma anında Nadir iyiniyetli miydi, yoksa bunu öngörmesi mi gerekiyordu?","doldur":[]}],"anahtar":[{"ornek":"İyiniyetli","kok":"İyiniy"},{"ornek":"elinde","kok":"elinde"},{"ornek":"zenginleşen","kok":"zengin"},{"ornek":"kalanı","kok":"kalanı"},{"ornek":"yalnız","kok":"yalnız"},{"ornek":"tamamını","kok":"tamamı"}],"konuGiris":{"harita":"Ne zaman test edilir: zenginleşen elindeki değeri elden çıkarmışsa geri verme borcunun kapsamı sorulduğunda. Nasıl ölçülür: zenginleşenin elden çıkarma sırasında iyiniyetli olup olmadığına ve geri vermeyi hesaba katıp katmadığına bakılarak. Nasıl kaydedilir: iyiniyetliyse elinden çıkmayan kısım, iyiniyetsizse veya öngörmesi gerekiyorsa zenginleşmenin tamamı borç olarak belirlenir.","desen":"Sınav genellikle iyiniyetli zenginleşenin sadece elinde kalanı, iyiniyetsiz olanın ise tamamını geri vereceği ayrımını karıştırır. Tuzak, \u0027ispat ettiği kısmın dışında kalanı\u0027 ifadesinin sadece iyiniyetliler için geçerli olmasıdır. Bu soru Türk Borçlar Kanunu m.79 hükmü noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"haklı bir sebep olmadan başkasının malvarlığından yarar sağlanması","ad":"sebepsiz zenginleşme","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"zenginleşenin elde ettiği değeri iade etmekle yükümlü olması","ad":"geri verme borcu","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"zenginleşenin elden çıkarma sırasında geri verme ihtimalini bilmemesi durumu","ad":"iyiniyet","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"zenginleşenin artık elinde bulunmayan, ispat ettiği zenginleşme parçası","ad":"elden çıkarılan kısım","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda zenginleşenin durumu (iyiniyetli/iyiniyetsiz) verilir, geri verme borcunun kapsamı hangi ifadenin doğru olduğu istenir.","panel_ornek":"Arkadaşın sana yanlışlıkla 50 lira fazla göndersin; sen bunu bilmeden harcarsan durumun farklı, bilerek harcarsan durumun farklıdır. İşte kanun da zenginleşenin iyiniyetli olup olmadığına göre geri ödemeyi ayırır.","ornek":"Arkadaşın sana yanlışlıkla 50 lira fazla göndersin; sen bunu bilmeden harcarsan durumun farklı, bilerek harcarsan durumun farklıdır. İşte kanun da ablo":{"satirlar":[["A) Zarar görenin, zararı ve tazminat yükümlüsünü öğrendiği …","TBK m.72/1","doğru ifade"],["B) Fiilin işlendiği tarihten başlayarak on yıllık zamanaşım…","TBK m.72/1","doğru ifade"],["C) Tazminat, ceza kanunlarının daha uzun bir zamanaşımı öng…","TBK m.72/1 c.2","doğru ifade"],["D) Zarar gören, haksız fiil dolayısıyla kendisine bir borç …","TBK m.72/2","doğru ifade"],["E) İki yıllık zamanaşımı süresi fiilin işlendiği tarihten, …","TBK m.72/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Tazminat, ceza kanunlarının daha uzun bir zamanaşımı öngördüğü cezayı gerektiren bir fiilden doğmuşsa, bu uzun süre uygulanır.","E":"İki yıllık zamanaşımı süresi fiilin işlendiği tarihten, on yıllık zamanaşımı süresi ise zarar görenin zararı öğrendiği tarihten başlayarak işler.","A":"Zarar görenin, zararı ve tazminat yükümlüsünü öğrendiği tarihten başlayarak iki yıllık zamanaşımı süresi işlemeye başlar.","D":"Zarar gören, haksız fiil dolayısıyla kendisine bir borç doğmuşsa, tazminat istemi zamanaşımına uğramış olsa bile bu borcu ifadan kaçınabilir.","B":"Fiilin işlendiği tarihten başlayarak on yıllık zamanaşımı süresi, zarar görenin bilgisinden bağımsız olarak her hâlde uygulanır."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Haksız fiilden doğan tazminat isteminin zamanaşımına uğramasına ilişkin aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-02","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.72","dogru":"E","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Kırşehir\u0027de bir kamyon sürücüsü 3 Mart 2015\u0027te yayaya çarpar, yaya 12 Mart 2015\u0027te bunu ve sürücünün kim olduğunu öğrenir.","anlatim":"Yaya iki farklı süreyle karşı karşıyadır: biri öğrendiği günden, biri kazanın olduğu günden işler. Bu beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu madde 72\u0027ye göre iki yıllık süre 12 Mart 2015\u0027ten, on yıllık süre 3 Mart 2015\u0027ten başlar; ceza kanunu daha uzun süre öngörüyorsa o uygulanır, doğmuş borç varsa ifadan kaçınma hakkı vardır.","anlatim":"Bu tek kuralı beş ifadede tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.72/1","karar":"doğru","anlatim":"Öğrenme tarihi 12 Mart\u0027tır, iki yıllık süre bu tarihten işler. Kural buna tam uyar.","formul":"Şık A: yaya \u002712 Mart 2015\u0027ten itibaren iki yılım var\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.72/1","karar":"doğru","anlatim":"On yıllık süre fiilin işlendiği tarihten başlar ve öğrenmeden bağımsızdır. Kural buna uyar.","formul":"Şık B: sürücü \u00273 Mart 2015\u0027ten sonra on yıl geçince, yaya öğrense de öğrenmese de dava hakkı biter\u0027 diyor, haklı mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.72/1 c.2","karar":"doğru","anlatim":"Kanun, ceza kanunundaki daha uzun süre varsa onun uygulanacağını açıkça söyler. Bu doğru bir ifadedir.","formul":"Şık C: sürücünün fiili aynı zamanda ceza kanununda 15 yıllık zamanaşımına tabi bir suçsa, o 15 yıl mı uygulanır?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.72/2","karar":"doğru","anlatim":"Kanun tam olarak bu hakkı tanır, zamanaşımı dolmuş olsa da fark etmez. Bu ifade doğrudur.","formul":"Şık D: yayanın kazadan dolayı sürücüye karşı doğmuş bir borcu varsa, zamanaşımı dolsa bile bu borcu ifadan kaçınabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.72/1","karar":"yanlış","anlatim":"Bu tam tersidir; iki yıl öğrenme tarihinden, on yıl fiil tarihinden işler. Süreler ve başlangıçlar burada yer değiştirmiştir.","formul":"Şık E: biri sana \u0027iki yıl fiil tarihinden, on yıl öğrenme tarihinden işler\u0027 derse, katılır mısın?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Dört ifade kanunun aynısı, sadece E ifadesi süreleri ters eşleştirmiş. Kendine sor: kısa süre mi öğrenmeye bağlı, uzun süre mi fiile bağlı?","doldur":[]}],"anahtar":[{"ornek":"öğrenmeden","kok":"öğrenm"},{"ornek":"yıllık","kok":"yıllık"},{"ornek":"tarihinden","kok":"tarihi"},{"ornek":"tarihten","kok":"tariht"},{"ornek":"süreler","kok":"sürele"},{"ornek":"kanunu","kok":"kanunu"}],"konuGiris":{"harita":"Ne zaman test edilir: öğrenme tarihinden başlayan kısa süre ile fiil tarihinden başlayan uzun sürenin birlikte sorulduğu sorularda test edilir. Nasıl ölçülür: hangi sürenin hangi başlangıç tarihine bağlı olduğunun doğru eşleştirilmesiyle ölçülür. Nasıl kaydedilir: doğru/yanlış seçimi, madde metnindeki istisnalarla (ceza zamanaşımı, ifadan kaçınma hakkı) birlikte değerlendirilerek kaydedilir.","desen":"Soru genellikle iki veya on yıllık sürelerden birinin başlangıç tarihini yanlış göstererek şıklardan birini yanlış yapar; sınav bu karışıklığı ölçer. Bazen ceza zamanaşımı istisnası veya ifadan kaçınma hakkı şıklara yanlış eklenerek tuzak kurulur. Bu soru Türk Borçlar Kanunu m.72 metnindeki süre ve istisna cümlelerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Zarar görenin zararı ve tazminat yükümlüsünü öğrendiği andan başlayan iki yıllık süre.","ad":"öğrenme tarihli süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Haksız fiilin işlendiği tarihten başlayan, öğrenmeden bağımsız on yıllık üst sınır.","ad":"fiil tarihli süre","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Fiil, ceza kanununda daha uzun süre öngörülen bir suçsa o uzun süre uygulanır.","ad":"ceza zamanaşımı istisnası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Zarar görenden doğan borç varsa, zamanaşımına rağmen bu borcu ifadan her zaman kaçınabilme hakkı.","ad":"ifadan kaçınma hakkı","kim":"kanun sabitler"}],"sinavda":"Soruda haksız fiil zamanaşımına ilişkin birden çok ifade verilir ve bunlardan hangisinin yanlış olduğu istenir.","panel_ornek":"Bir arkadaşın sana borç verdi ve \u0027istediğin zaman işte\u0027 dedi ama sen 12 yıl hiç sormadın; bir gün onu aramaya karar verdiğinde artık \u0027zamanaşımı\u0027 denen bir sınır olduğunu öğrendin. İşte hukukta da bir zararın tazminini isteme hakkının süresiz olmadığı, belli bir süre geçince istenemez hale geldiği düşünülür.","ornek":"Bir arkadaşın sana borç verdi ve \u0027istediğin zaman işte\u0027 dedi ama sen 12 yıl hiç sormadın; bir gün onu aramaya karar verdiğinde artık \u0027zamanaşımı\u0027 denen bir sınır olduğunu öğrendin. İşte hukukta da bir zararın tazminini isteme hakkının süresiz olmadığı, belli bir süre geçince istenemez hale geldiği düşünülür.","yontemler":"İki yıl ile on yıl arasındaki başlangıç tarihi farkını net ayırt et; ceza zamanaşımı istisnası ile ifadan kaçınma hakkının ayrı kurallar olduğunu unutma.","nedir":"Haksız fiilden doğan tazminat isteminin hangi sürede ve hangi tarihten itibaren zamanaşımına uğradığını düzenleyen kuraldır. Sınav, öğrenme tarihi ile fiil tarihinin doğurduğu farklı sürelerin karıştırılıp karıştırılmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Ceza Zamanaşımını Yok Sayma Tuzağı","metin":"öğrenci istisnayı atlayıp her zaman iki-on yıl kuralının uygulanacağını düşünebilir. Doğrusu: fiil, ceza kanunlarında daha uzun zamanaşımı öngörülen cezayı gerektiren bir suç oluşturuyorsa bu uzun süre uygulanır."},"A":{"ad":"Ne soruluyor","metin":"beş ifadeden hangisinin Türk Borçlar Kanununun 72 nci maddesine aykırı olduğu soruluyor. Kural: sübjektif zamanaşımı süresi, zarar görenin zararı ve tazminat yükümlüsünü öğrendiği tarihten başlayarak iki yıldır. Doğrusu: bu ifade maddenin birinci cümlesiyle birebir örtüştüğünden doğrudur."},"D":{"ad":"Def\u0027i Hakkını Zamanaşımına Bağlama Tuzağı","metin":"öğrenci istemin zamanaşımına uğramasıyla ifadan kaçınma hakkının da düşeceğini sanabilir. Doğrusu: zarar gören bakımından doğmuş bir borç varsa, tazminat istemi zamanaşımına uğramış olsa bile zarar gören bu borcu ifadan her zaman kaçınabilir."},"B":{"ad":"Ters Başlangıç Tuzağı","metin":"öğrenci on yıllık sürenin de öğrenme tarihine bağlı olduğunu sanabilir. Doğrusu: on yıllık objektif süre, zarar görenin bilgisinden bağımsız olarak fiilin işlendiği tarihten başlar ve her hâlde işler."}},"celdiriciYol":{},"hap":"Haksız fiilde zamanaşımı: öğrenmeden başlayarak 2 yıl, fiilden başlayarak 10 yıl; ceza kanunu daha uzun süre öngörüyorsa o uygulanır.","teshis":{"C":{"gercek":"m.72/1 son cümle, ceza kanununda daha uzun süre öngörülen suçlarda o sürenin uygulanacağını söyler.","ayirt":"Bu fiil aynı zamanda daha uzun ceza zamanaşımına tabi bir suç mu?","paragraf":"TBK m.72/1 c.2","yanilgi":"İstisnayı unutup her olayda iki-on yıl kuralının geçerli olduğunu sanıyorsun."},"E":{"gercek":"m.72/1 iki yılı öğrenme tarihine, on yılı fiil tarihine bağlar; bu şıkta bu eşleşme tersine çevrilmiştir.","ayirt":"Hangi süre hangi başlangıç tarihine bağlı, eşleştirmeyi tekrar kur muyum?","paragraf":"TBK m.72/1","yanilgi":"İki süreyi ve başlangıç tarihlerini karıştırıp yer değiştirerek doğru sandın."},"A":{"gercek":"Türk Borçlar Kanunu m.72/1 sübjektif süreyi zararın ve failin öğrenilmesine bağlar.","ayirt":"Süre, olayın olduğu günden mi yoksa benim öğrendiğim günden mi başlıyor?","paragraf":"TBK m.72/1","yanilgi":"Bu ifadeyi eleyen öğrenci, iki yıllık sürenin başlangıcını fiil tarihi sanır."},"D":{"gercek":"m.72/2, doğmuş bir borç varsa zarar görene istemi zamanaşımına uğramış olsa da ifadan kaçınma hakkı tanır.","ayirt":"Burada bir def\u0027i mi yoksa bağımsız bir istem mi söz konusu?","paragraf":"TBK m.72/2","yanilgi":"Zamanaşımı dolunca zarar görenin elindeki her hakkın düştüğünü sanıyorsun."},"B":{"gercek":"m.72/1\u0027deki on yıllık süre objektif niteliktedir, fiilin işlendiği tarihten başlar ve öğrenmeden bağımsızdır.","ayirt":"Bu süre benim bilgime mi, yoksa olayın tarihine mi bağlı?","paragraf":"TBK m.72/1","yanilgi":"On yıllık sürenin de öğrenme tarihine göre işlediğini sanıyorsun."}},"verilen":[],"donem":4,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 126"},"kural":"Para ve parça borçları dışındaki borçlar, doğumları sırasında BORÇLUNUN yerleşim yerinde ifa edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 126","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İfa yeri sorularında her fıkranın hangi \u0027anı\u0027 ve hangi \u0027tarafı\u0027 esas aldığını ayrı ayrı eşleştir, tek karışıklık tüm şıkkı çözer.","konu":"borcun ifa yeri","tablo":{"satirlar":[["A) Para borçları, alacaklının ödeme zamanındaki yerleşim ye…","p.89/1","doğru ifade"],["B) Parça borçları, sözleşmenin kurulduğu sırada borç konusu…","p.89/2","doğru ifade"],["C) Para ve parça borçları dışındaki bütün borçlar, doğumlar…","p.89/3","doğru ifade"],["D) Alacaklının yerleşim yerinde ifası gereken bir borcun do…","p.89/son","doğru ifade"],["E) Para ve parça borçları dışındaki bütün borçlar, doğumlar…","p.89/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Para ve parça borçları dışındaki bütün borçlar, doğumları sırasında borçlunun yerleşim yerinde ifa edilir.","E":"Para ve parça borçları dışındaki bütün borçlar, doğumları sırasında alacaklının yerleşim yerinde ifa edilir.","A":"Para borçları, alacaklının ödeme zamanındaki yerleşim yerinde ifa edilir.","D":"Alacaklının yerleşim yerinde ifası gereken bir borcun doğumundan sonra alacaklı yerleşim yerini değiştirip ifa önemli ölçüde güçleşmişse, borç alacaklının önceki yerleşim yerinde ifa edilebilir.","B":"Parça borçları, sözleşmenin kurulduğu sırada borç konusunun bulunduğu yerde ifa edilir."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanununa göre, aksine bir anlaşma bulunmadığı hallerde borcun ifa yerine ilişkin aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-03","verilenler":[],"dayanak":"6098 sayılı Türk Borçlar Kanunu m.89","dogru":"E","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Ahmet, İzmir\u0027deki atölyesinde 5 Ocak\u0027ta özel yapım bir masayı Kemal\u0027e teslim etme borcu altına giriyor, sözleşmede teslim yeri yazmıyor.","anlatim":"Masa parça borcu değil, eşyanın üretilip verilmesi türünde bir borç. Kemal, teslimin kendi evinde yani Ankara\u0027da olması gerektiğini söylüyor. Ahmet ise atölyesinin bulunduğu İzmir\u0027de teslim edeceğini iddia ediyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.89\u0027a göre para borcu ödeme zamanındaki alacaklı yerinde, parça borcu sözleşme anındaki eşyanın bulunduğu yerde, diğer borçlar doğum anındaki borçlunun yerinde ifa edilir; alacaklı taşınırsa istisna devreye girer. Şimdi beş ifadeyi Ahmet ile Kemal\u0027in olayında tek tek deneyeceğiz.","anlatim":"Her şıkkı bu masa olayına uyarlayıp doğru mu yanlış mı diye bakacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.89/1","karar":"doğru","anlatim":"Kanun ödeme zamanındaki yerleşim yerini esas alıyor, sözleşme anını değil. Kemal taşınmışsa yeni evi geçerli olur. Bu ifade doğru.","formul":"Şık A: Ahmet\u0027in Kemal\u0027e borçlu olduğu bir para tutarı olsaydı, ödemeyi Kemal\u0027in sözleşme kurulduğu andaki evinde mi yoksa ödeme günündeki evinde mi yapması gerekirdi, sence hangisi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.89/2","karar":"doğru","anlatim":"Parça borcunda esas olan, sözleşme kurulurken eşyanın nerede olduğu. Masa o gün atölyedeyse ifa yeri atölye olur. Bu ifade doğru.","formul":"Şık B: Ahmet elinde hazır duran belirli bir masayı satsaydı, teslim yerini sözleşmenin kurulduğu andaki masanın bulunduğu yer mi belirler?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.89/3","karar":"doğru","anlatim":"Kanun bu tür borçlarda borçlunun doğum anındaki yerini esas alıyor. Ahmet\u0027in yerleşim yeri İzmir olduğu için teslim İzmir\u0027de olur. Bu ifade doğru.","formul":"Şık C: Masa üretme borcu para ve parça borcu dışında kaldığına göre, teslim yeri doğum anındaki Ahmet\u0027in yerleşim yeri mi olur?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.89/son","karar":"doğru","anlatim":"Alacaklı taşınıp ifa güçleşirse kanun eski yerleşim yerinde ifaya izin veriyor. Yani Kemal\u0027in eski evi Ankara geçerli sayılabilir. Bu ifade doğru.","formul":"Şık D: Kemal önce Ankara\u0027daydı, borç doğduktan sonra Rize\u0027ye taşındı ve ifa çok zorlaştı; bu durumda borç eski yer olan Ankara\u0027da mı ifa edilebilir?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.89/3","karar":"yanlış","anlatim":"Hayır, kanun burada borçlu Ahmet\u0027in yerini esas alıyor, Kemal\u0027in değil. Bu ifade tarafı ters kurduğu için yanlış.","formul":"Şık E: Masa borcu gibi diğer borçlarda kanun, doğum anındaki alacaklının yani Kemal\u0027in yerleşim yerini mi esas alır, sence?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Dört fıkra da doğru işliyor ama E, üçüncü fıkradaki borçlu ile alacaklıyı karıştırıyor. Kendine hep şunu sor: bu fıkra borçlunun mu alacaklının mı yerini esas alıyor?","doldur":[]}],"anahtar":[{"ornek":"borçlunun","kok":"borçlu"},{"ornek":"yerleşim","kok":"yerleş"},{"ornek":"borçlar","kok":"borçla"},{"ornek":"alıyor","kok":"alıyor"},{"ornek":"yerini","kok":"yerini"},{"ornek":"atölyesinin","kok":"atölye"}],"konuGiris":{"harita":"Ne zaman uygulanır: taraflar ifa yeri konusunda anlaşmamışsa devreye girer. Nasıl ölçülür: borcun türüne göre (para, parça, diğer) farklı yerleşim yeri kıstası uygulanır. Nasıl kaydedilir: alacaklının sonradan yerleşim yerini değiştirmesi ifayı güçleştirirse borç önceki yerde ifa edilebilir.","desen":"Sınav genellikle üç borç türünün ifa yerini birbirine karıştırtarak yanlış ifadeyi buldurur; özellikle para borcunun borçlunun değil alacaklının yerinde ifa edileceği noktası tuzaktır. Alacaklının yerleşim yerini değiştirmesi halindeki istisna da sıkça karıştırılır. Bu soru m.89\u0027daki üç bent ve istisna fıkrası noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Alacaklının ödeme zamanındaki yerleşim yerinde ifa edilen borç türü","ad":"para borcu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Sözleşme kurulurken borç konusunun bulunduğu yerde ifa edilen borç","ad":"parça borcu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Doğdukları sırada borçlunun yerleşim yerinde ifa edilen borç türü","ad":"diğer borçlar","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Tarafların açık veya örtülü iradeyle ifa yerini belirleyebilmesi","ad":"anlaşma serbestisi","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Şıklarda ifa yerine ilişkin dört ifade verilir ve kanuna aykırı olan tek yanlış ifade seçilmesi istenir.","panel_ornek":"Arkadaşın sana 50 lira borç verdi ve geri ödeme yerini hiç konuşmadınız; kanunen bu parayı senin değil, alacaklı arkadaşının o günkü oturduğu yerde ödemen gerekir. Eşyanı ise, anlaşma yoksa, sözleşme yapıldığı andaki bulunduğu yerde teslim edersin.","ornek":"Arkadaşın sana 50 lira borç verdi ve geri ödeme yerini hiç konuşmadınız; kanunen bu parayı senin değil, alacaklı arkadaşının o günkü oturduğu yerde ödemen gerekir. Eşyanı ise, anlaşma yoksa, sözleşme yapıldığı andaki bulunduğu yerde teslim edersin.","yontemler":"Her şıkkı borç türüne göre ayırıp m.89\u0027daki üç bende tek tek eşleştirin; en kritik kural, para borcunda yerin borçlu değil alacaklı esaslı belirlenmesidir.","nedir":"Borcun ifa yeri, bir edimin nerede yerine getirileceğini belirleyen kuraldır. Sınav, taraflar anlaşmamışsa hangi borç türünün nerede ifa edileceğini bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Kalıntı Kural Şüphesi Tuzağı","metin":"Öğrenci üçüncü grup borçlarda da alacaklının yerinin esas alındığını düşünüp bu doğru ifadeyi yanlış zannedebilir. Doğrusu: Diğer borçlarda doğrulukları sırasında borçlunun yerleşim yeri esastır, ifade doğrudur."},"A":{"ad":"Ödeme Zamanı Tuzağı","metin":"Öğrenci para borcunun ifa yerini sözleşmenin kurulduğu anla karıştırıp bu ifadeyi hatalı sanabilir. Doğrusu: Kanun para borcunda alacaklının ödeme zamanındaki yerleşim yerini esas alır, ifade doğrudur."},"D":{"ad":"İstisna Kuralını Reddetme Tuzağı","metin":"Öğrenci alacaklının yerleşim yeri değişince ifa yerinin de otomatik değiştiğini sanıp bu istisna hükmünü yanlış zannedebilir. Doğrusu: Güçleşme hâlinde borç önceki yerleşim yerinde ifa edilebilir, ifade doğrudur."},"B":{"ad":"Sözleşme Anı Karıştırma Tuzağı","metin":"Öğrenci parça borcunda da para borcundaki gibi ödeme anının esas alındığını sanabilir. Doğrusu: Parça borcunda esas alınan an sözleşmenin kurulduğu andır, ifade doğrudur."}},"celdiriciYol":{},"hap":"Türk Borçlar Kanunu m.89\u0027da para borcu ödeme zamanındaki, parça borcu sözleşme anındaki, diğer borçlar ise doğum anındaki BORÇLUNUN yerleşim yerinde ifa edilir.","teshis":{"C":{"gercek":"Madde 89/3 bu tür borçlarda doğum anındaki borçlunun yerleşim yerini esas alır.","ayirt":"Bu fıkra hangi tarafın yerleşim yerini esas alıyor: borçlu mu, alacaklı mı?","paragraf":"TBK m.89/3","yanilgi":"Para ve parça borçları dışındaki borçlarda da alacaklının yerinin esas alındığını sanıyorsun."},"E":{"gercek":"Madde 89/3 açıkça borçlunun doğum anındaki yerleşim yerini esas alır; alacaklının yeri bu fıkrada değil, ancak istisna fıkrasında (m.89/son) geçer.","ayirt":"Bu fıkrada taraf borçlu mu alacaklı mı, doğru hatırlıyor muyum?","paragraf":"TBK m.89/3","yanilgi":"Bu şıkkı doğru sanan öğrenci, üçüncü fıkradaki \u0027borçlunun yerleşim yeri\u0027 ifadesini \u0027alacaklının yerleşim yeri\u0027 ile karıştırmıştır."},"A":{"gercek":"Madde 89/1\u0027e göre para borçlarında esas an ödeme zamanıdır, sözleşme anı değildir.","ayirt":"Bu kural hangi ana göre yerleşim yerini sabitliyor: sözleşme anına mı, ödeme anına mı?","paragraf":"TBK m.89/1","yanilgi":"Para borcunda ifa yerinin sözleşmenin kurulduğu andaki yerleşim yeri olduğunu sanıyorsun."},"D":{"gercek":"Madde 89/son, güçleşme hâlinde borcun alacaklının ÖNCEKİ yerleşim yerinde ifasına imkân tanır.","ayirt":"Bu istisna ifa yerini değiştirir mi yoksa eski yeri mi korur?","paragraf":"TBK m.89/son","yanilgi":"Alacaklının yerleşim yeri değişince ifa yerinin de otomatik olarak yeni yere kaydığını sanıyorsun."},"B":{"gercek":"Madde 89/2 parça borçlarında sözleşmenin kurulduğu sırada malın bulunduğu yeri esas alır.","ayirt":"Parça borcu ile para borcunun zaman ölçütü aynı mı, farklı mı?","paragraf":"TBK m.89/2","yanilgi":"Parça borcunda da tıpkı para borcunda olduğu gibi ödeme zamanının esas alındığını sanıyorsun."}},"verilen":[],"donem":4,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 106"},"kural":"Türk Borçlar Kanununun 147 nci maddesinin birinci fıkrasına göre kira bedelleri, anapara faizleri ve ücret gibi dönemsel edimlere ilişkin alacaklar beş yıllık zamanaşımına tabidir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 106","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Zamanaşımı sorularında önce alacağın \u0027dönemsel edim\u0027 olup olmadığına bak, sonra genel süreye değil kanunun saydığı özel süreye göre işaretle.","konu":"ücret sözleşmesi esasları","tablo":{"satirlar":[["A) Ücret alacakları, kira bedelleri ve anapara faizleri gib…","m.147/1","doğru ifade"],["B) Ücret alacağı için özel bir düzenleme bulunmadığından on…","m.147/1","YANLIŞ ifade"],["C) Ücret alacağı, borçlunun ve ailesinin bakımı için zorunl…","m.144/3","YANLIŞ ifade"],["D) Ücret alacaklarında iki yıllık kısa zamanaşımı süresi uy…","m.147/1","YANLIŞ ifade"],["E) Ücret alacağı dönemsel edim sayılmadığından genel zamana…","m.147/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Ücret alacağı, borçlunun ve ailesinin bakımı için zorunlu olduğundan zamanaşımına tabi değildir.","E":"Ücret alacağı dönemsel edim sayılmadığından genel zamanaşımı hükümlerine tabidir.","A":"Ücret alacakları, kira bedelleri ve anapara faizleri gibi dönemsel edimlerle birlikte beş yıllık zamanaşımına tabidir.","D":"Ücret alacaklarında iki yıllık kısa zamanaşımı süresi uygulanır.","B":"Ücret alacağı için özel bir düzenleme bulunmadığından on yıllık genel zamanaşımı süresi uygulanır."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"İşçinin işverenden olan ücret alacağına ilişkin zamanaşımı konusunda aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-06","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.147/1","dogru":"A","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Ahmet, bir tekstil fabrikasında çalışıyor. Şubat 2018 ile Ekim 2018 arası 9 aylık ücreti hiç ödenmemiş, toplam 45.000 TL alacağı var. İşten ayrıldıktan 6 yıl sonra, 2024\u0027te bu ücreti dava ediyor.","anlatim":"Fabrika sahibi \u0027zaten süresi geçmiş, ödemem\u0027 diyor. Ahmet\u0027in avukatı hangi süreye dayanacağını bulmalı. Şimdi bu tek olayda beş ifadeyi tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.147/1\u0027e göre ücret, kira bedeli ve anapara faizi gibi dönemsel edimler beş yıllık zamanaşımına tabi. Ahmet\u0027in 6 yıl sonra açtığı dava, beş yıllık süreyle karşılaştırılacak. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural tek: dönemsel edim beş yıl. Şimdi A\u0027dan E\u0027ye kadar her şıkkı Ahmet\u0027in olayına uygulayacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.147/1","karar":"doğru","anlatim":"Ahmet\u0027in ücreti her ay tekrarlanan bir ödeme, yani dönemsel edim. Türk Borçlar Kanunu m.147/1 tam da bunu söylüyor, ücreti kira bedeli ve faizle birlikte sayıyor.","formul":"Şık A: avukat mahkemeye \u0027ücret alacağı kira bedeli ve faiz gibi dönemsel edimdir, beş yıllık zamanaşımı uygulanır\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.147/1","karar":"yanlış","anlatim":"Katılmazsın çünkü Türk Borçlar Kanunu m.147/1 ücreti özel olarak beş yıllık süreye bağlamış. Özel hüküm varken genel süreye gidilmez.","formul":"Şık B: karşı taraf avukatı \u0027kanunda özel bir düzenleme yok, o yüzden on yıllık genel süre uygulanır\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.144/3","karar":"yanlış","anlatim":"Yanlış, çünkü Türk Borçlar Kanunu m.144/3\u0027teki bu ifade takas hakkının sınırlanmasıyla ilgili, zamanaşımıyla ilgili değil. Ücret alacağı yine beş yılda zamanaşımına uğrar.","formul":"Şık C: Ahmet\u0027in kardeşi \u0027ücret zaten bakım için zorunlu, hiç zamanaşımına uğramaz\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.147/1","karar":"yanlış","anlatim":"Haklı değil, kanunda ücret için iki yıllık bir süre yok. Türk Borçlar Kanunu m.147/1 açıkça beş yıl diyor.","formul":"Şık D: fabrikanın muhasebecisi \u0027ücret alacaklarında iki yıllık kısa süre var, dava zaten düşer\u0027 diyor, haklı mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.147/1","karar":"yanlış","anlatim":"Katılmazsın çünkü Ahmet\u0027in ücreti her ay düzenli tekrarlanıyor, tam da dönemsel edim. Türk Borçlar Kanunu m.147/1 bunu kira bedeli ve faizle birlikte açıkça sayıyor.","formul":"Şık E: hâkim yardımcısı \u0027ücret dönemsel edim sayılmaz, genel hükümlere göre on yıl uygulanır\u0027 diyor, sen ne dersin?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Ahmet\u0027in 6 yıl sonra açtığı dava, beş yıllık süreyi aştığı için zamanaşımına uğramış olur. Kendine hep şunu sor: bu ödeme düzenli aralıklarla mı tekrarlanıyor, kanun onu ayrıca mı saymış?","doldur":[]}],"anahtar":[{"ornek":"kanununun","kok":"kanunu"},{"ornek":"borçlar","kok":"borçla"},{"ornek":"yıllık","kok":"yıllık"},{"ornek":"ücreti","kok":"ücreti"},{"ornek":"dönemsel","kok":"dönems"},{"ornek":"zamanaşımına","kok":"zamana"}],"konuGiris":{"harita":"Ne zaman test edilir: işçinin ücret alacağının hangi süre içinde talep edilebileceği sorulduğunda. Nasıl ölçülür: ücretin dönemsel bir edim olup olmadığına bakılarak kanunda öngörülen sürenin doğru eşleştirilmesiyle ölçülür. Nasıl kaydedilir: doğru zamanaşımı süresi ile ücret alacağının niteliği arasındaki bağ kurularak kaydedilir.","desen":"Sınav genellikle ücret alacağını genel on yıllık zamanaşımına tabi gösterip öğrenciyi yanıltmaya çalışır; oysa ücret dönemsel edim sayıldığından özel kısa süre uygulanır. Bazı sorularda takas veya ayıp hükümleriyle karıştırılarak dikkat dağıtılır. Bu soru madde 147\u0027deki dönemsel edimler listesinin ücret alacağını kapsaması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İşçinin yaptığı iş karşılığında işverenden talep ettiği para alacağı","ad":"ücret alacağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Belirli aralıklarla tekrar eden, kira veya ücret gibi düzenli ödeme yükümlülüğü","ad":"dönemsel edim","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Alacağın dava yoluyla istenebileceği kanunda belirlenen zaman sınırı","ad":"zamanaşımı süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Dönemsel edimler için kanunun öngördüğü özel zamanaşımı süresi","ad":"beş yıllık süre","kim":"kanun sabitler"}],"sinavda":"Soruda işçinin ücret alacağına ilişkin bir olay verilir ve hangi zamanaşımı süresinin uygulanacağı istenir.","panel_ornek":"Arkadaşın bir kafede garson olarak çalışıyor ve patronu üç aydır maaşını ödemiyor. Arkadaşın bu alacağını istemek için mahkemeye gitmek isterse, kanunun belirlediği süre içinde hareket etmesi gerekir; yoksa hakkını kaybedebilir.","ornek":"Arkadaşın bir kafede garson olarak çalışıyor ve patronu üç aydır maaşını ödemiyor. Arkadaşın bu alacağını istemek için mahkemeye gitmek isterse, kanunun belirlediği süre içinde hareket etmesi gerekir; yoksa hakkını kaybedebilir.","yontemler":"Ücretin dönemsel edim niteliğinde olduğu tespit edilip doğrudan kanunun öngördüğü beş yıllık süre uygulanır.","nedir":"Ücret sözleşmesi, işçinin işverenden aldığı ücret alacağının hukuki niteliğini ve bu alacağa uygulanacak zamanaşımı süresini düzenler. Sınav, dönemsel edimlerin hangi zamanaşımı süresine tabi olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Kapsam Karıştırma Tuzağı","metin":"öğrenci, nafaka ve işçi ücreti gibi alacakların takas hakkının doğumundan sonra ancak alacaklının rızasıyla takas edilebileceği kuralını zamanaşımı bağışıklığı sanır. Doğrusu: bu düzenleme takasa ilişkindir, zamanaşımını ortadan kaldırmaz; ücret alacağı yine beş yıllık süreye tabidir."},"E":{"ad":"Nitelik Yanlışı Tuzağı","metin":"öğrenci ücreti tek seferlik bir edim gibi görüp dönemsel edim sayılmayacağını düşünür. Doğrusu: kanun ücreti açıkça kira bedeli ve anapara faizi ile birlikte dönemsel edim örneği olarak sayar, bu nedenle beş yıllık süre uygulanır."},"D":{"ad":"Yanlış Süre Aktarma Tuzağı","metin":"öğrenci başka bir ilişkiye özgü kısa süreyi ücret alacağına uygular. Doğrusu: ücret alacağı için kanunda öngörülen süre iki yıl değil beş yıldır."},"B":{"ad":"Genel Süre Tuzağı","metin":"öğrenci özel bir hüküm aramadan doğrudan genel zamanaşımı süresini uygular. Doğrusu: kanun ücreti ayrıca saymış olup özel beş yıllık süre öncelikle uygulanır, genel süreye başvurulmaz."}},"celdiriciYol":null,"hap":"İşçi ücreti alacağı, kira bedeli ve anapara faizi gibi dönemsel edim sayıldığından beş yıllık zamanaşımına tabidir.","teshis":{"C":{"gercek":"Türk Borçlar Kanunu m.144/3 yalnız takas hakkının kullanımını sınırlar, zamanaşımı süresini etkilemez.","ayirt":"Bu madde takas mı düzenliyor yoksa zamanaşımı mı?","paragraf":"m.144/3, m.147/1","yanilgi":"Takas kısıtlamasını zamanaşımı bağışıklığı sanırsın."},"E":{"gercek":"Kanun ücreti kira bedeli ve faizle birlikte dönemsel edim örneği sayar, bu nedenle beş yıllık kısa zamanaşımına tabidir.","ayirt":"Bu ödeme belirli aralıklarla tekrarlanan bir edim mi?","paragraf":"m.147/1","yanilgi":"Ücretin tek seferlik bir edim olduğunu, dönemsel sayılmayacağını düşünürsün."},"A":{"gercek":"Türk Borçlar Kanunu m.147/1, kira bedeli ve anapara faizi ile birlikte ücreti açıkça beş yıllık zamanaşımına tabi dönemsel edim örneği olarak sayar.","ayirt":"Bu alacak düzenli aralıklarla mı tekrarlanıyor, kanun onu ayrıca mı saymış?","paragraf":"m.147/1","yanilgi":"Bu şıkkı eleyen öğrenci ücretin dönemsel edim sayılmadığını düşünür."},"D":{"gercek":"Türk Borçlar Kanunu m.147/1 ücret alacağı için açıkça beş yıllık süre öngörür.","ayirt":"Bu süre hangi maddede, hangi alacak için sayılmış?","paragraf":"m.147/1","yanilgi":"Başka bir kısa süreyi ücret alacağına da uygulanır sanırsın."},"B":{"gercek":"Türk Borçlar Kanunu m.147/1 ücreti özel olarak saydığından beş yıllık süre uygulanır, on yıllık genel süreye gidilmez.","ayirt":"Kanun bu alacağı ayrıca bir maddede saymış mı?","paragraf":"m.147/1","yanilgi":"Özel hüküm bulunmadığını sanıp doğrudan genel süreye geçersin."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 129"},"kural":"madde 82 fıkra 1, iki yıllık süreyi öğrenme tarihine, on yıllık süreyi zenginleşme tarihine bağlar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 129","sonDonem":7,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Zamanaşımı sürelerinin hangi olguya (öğrenme mi, olay mı) bağlandığını şık şık kontrol et; süreler yer değiştirmiş şıklar en sık kullanılan tuzaktır.","konu":"sebepsiz zenginlesme zamanaşımı","tablo":{"satirlar":[["A) İstem hakkı, hak sahibinin geri isteme hakkı olduğunu öğ…","m.82/1","doğru ifade"],["B) İstem hakkı, her hâlde zenginleşmenin gerçekleştiği tari…","m.82/1","doğru ifade"],["C) Zenginleşme, zenginleşenin bir alacak hakkı kazanması su…","m.82/2","doğru ifade"],["D) İki yıllık zamanaşımı süresi zenginleşmenin gerçekleştiğ…","m.82/1","YANLIŞ ifade"],["E) İki yıllık ve on yıllık sürelerden hangisi önce dolarsa …","m.82/1","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Zenginleşme, zenginleşenin bir alacak hakkı kazanması suretiyle gerçekleşmişse diğer taraf, istem hakkı zamanaşımına uğramış olsa bile her zaman bu borcunu ifadan kaçınabilir.","E":"İki yıllık ve on yıllık sürelerden hangisi önce dolarsa istem hakkı o tarihte zamanaşımına uğrar.","A":"İstem hakkı, hak sahibinin geri isteme hakkı olduğunu öğrendiği tarihten başlayarak iki yıllık zamanaşımına tabidir.","D":"İki yıllık zamanaşımı süresi zenginleşmenin gerçekleştiği tarihten, on yıllık zamanaşımı süresi ise hak sahibinin geri isteme hakkını öğrendiği tarihten başlar.","B":"İstem hakkı, her hâlde zenginleşmenin gerçekleştiği tarihten başlayarak on yıllık zamanaşımına tabidir."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027na göre sebepsiz zenginleşmeden doğan istem hakkının zamanaşımına uğraması ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-08","verilenler":[],"dayanak":"Türk Borçlar Kanunu m.82","dogru":"D","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Bir tekstil firması, 14 Mart 2015\u0027te yanlışlıkla tedarikçisine 40.000 TL fazladan ödeme yapıyor. Firma bu fazla ödemeyi 3 Haziran 2022\u0027de fark ediyor. Tedarikçi parayı hâlâ elinde tutuyor.","anlatim":"Firma parayı geri istemek istiyor ama aradan yıllar geçmiş. Şimdi zamanaşımı sürelerine bakacağız.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.82/1\u0027e göre iki yıllık süre öğrenme tarihinden, on yıllık süre zenginleşme tarihinden işler; hangisi önce dolarsa istem hakkı biter, alacak hakkı doğmuşsa istisna var. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Firma 2015\u0027te para kaybediyor, 2022\u0027de öğreniyor; bu tarihleri kurala oturtacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.82/1","karar":"doğru","anlatim":"Evet, kanun iki yıllık süreyi öğrenme tarihine bağlıyor. Firma 2022\u0027de öğrendiği için 2024\u0027e kadar dava açabilir. Bu ifade doğru.","formul":"Şık A: firma \u0027öğrendiğim 2022\u0027den itibaren iki yılım var\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.82/1","karar":"doğru","anlatim":"Evet, on yıllık süre öğrenmeden bağımsız, zenginleşme tarihi olan 2015\u0027ten işler. 2025\u0027te dolar. Bu ifade doğru.","formul":"Şık B: tedarikçi \u0027her hâlde 2015\u0027ten on yıl geçince biterdi\u0027 diyor, haklı mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.82/2","karar":"doğru","anlatim":"Evet diyebilir; kanun bu özel durumda süre geçmiş olsa da ifadan kaçınma hakkı tanıyor. Bu ifade doğru.","formul":"Şık C: tedarikçi bu 40.000 TL\u0027yi bir alacak hakkı kazanarak elde etmişse, zamanaşımı dolsa bile firmaya \u0027ödemem\u0027 diyebilir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.82/1","karar":"yanlış","anlatim":"Hayır, olayda tam tersi geçerli: iki yıl öğrenme tarihinden (2022), on yıl zenginleşme tarihinden (2015) işler. Bu ifade süreleri yer değiştiriyor, yanlış.","formul":"Şık D: biri sana \u0027iki yıllık süre zenginleşme tarihinden, on yıllık süre öğrenme tarihinden başlar\u0027 derse, buna inanır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.82/1","karar":"doğru","anlatim":"Evet, iki süre paralel işler ve hangisi önce dolarsa zamanaşımı o anda gerçekleşir. Olayımızda 2022\u0027den iki yıl (2024), 2015\u0027ten on yıl (2025); önce dolan 2024. Bu ifade doğru.","formul":"Şık E: firma \u0027iki yıl mı on yıl mı önce dolarsa hakkım o zaman biter\u0027 diyor, doğru mu düşünüyor?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Tek yanlış olan D, çünkü iki tarihi birbirine karıştırıp sürelerin başlangıcını ters bağlamış. Kendine sor: bu şıkta \u0027öğrenme\u0027 hangi süreye, \u0027zenginleşme\u0027 hangi süreye bağlanmış?","doldur":[]}],"anahtar":[{"ornek":"tarihinden","kok":"tarihi"},{"ornek":"yıllık","kok":"yıllık"},{"ornek":"öğrenme","kok":"öğrenm"},{"ornek":"zenginleşmede","kok":"zengin"},{"ornek":"sürelerine","kok":"sürele"},{"ornek":"süreyi","kok":"süreyi"}],"konuGiris":{"harita":"Süre ne zaman işlemeye başlar: öğrenme tarihinden ve zenginleşmenin gerçekleştiği tarihten olmak üzere iki ayrı başlangıç vardır. Sürenin uzunluğu nasıl belirlenir: öğrenmeden itibaren iki yıl, her hâlde on yıl olarak kanunla sabittir. İstisna nasıl uygulanır: zenginleşen bir alacak hakkı kazanmışsa zamanaşımı dolsa bile borcunu ifadan kaçınabilir.","desen":"Sorular genellikle iki sürenin başlangıç tarihlerini karıştırtarak yanlış şık üretir; öğrenme tarihi ile zenginleşme tarihi birbirine karıştırılır. Bazı seçenekler on yıllık sürenin de öğrenmeden başladığını iddia eder, bu yanlıştır. Bu soru m.82\u0027deki iki farklı başlangıç anı ve istisna hükmü noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"hak sahibinin geri isteme hakkını öğrendiği an","ad":"öğrenme tarihi","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"öğrenmeden başlayan kısa zamanaşımı süresi","ad":"iki yıllık süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"zenginleşmenin gerçekleştiği tarihten başlayan azami süre","ad":"on yıllık süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"alacak hakkı kazanılmışsa zamanaşımı dolsa da borcu ödememe imkânı","ad":"ifadan kaçınma def\u0027i","kim":"kanun sabitler"}],"sinavda":"Soru, sebepsiz zenginleşmeden doğan istem hakkının zamanaşımı sürelerine ilişkin ifadelerden yanlış olanı sorar.","panel_ornek":"Arkadaşına yanlışlıkla 50 lira fazla göndersen, bunu geri isteme hakkın vardır. Ama bu hakkı öğrendiğin andan itibaren belli bir süre içinde istemezsen, hakkın zamanla ortadan kalkar.","ornek":"Arkadaşına yanlışlıkla 50 lira fazla göndersen, bunu geri isteme hakkın vardır. Ama bu hakkı öğrendiğin andan itibaren belli bir süre içinde istemezsen, hakkın zamanla ortadan kalkar.","yontemler":"İki süre birbirinden bağımsız başlar ve hangisi önce dolarsa zamanaşımı gerçekleşir; öğrenme anı ile zenginleşme anı ayrı ayrı değerlendirilir.","nedir":"Sebepsiz zenginleşme, birinin haklı bir sebep olmadan başkasının malvarlığından yararlanmasıdır. Sınav, bu istem hakkının hangi sürelerde ve hangi başlangıç anından itibaren zamanaşımına uğradığını ölçer."},"olay":"kaynak metinle şık karşılaştırıldığında süreler yer değiştirmiş görünür.","tuzak":{"C":{"ad":"Alacak Hakkı İstisnasını Atlama Tuzağı","metin":"öğrenci istisna hükmünü göz ardı edip her istem hakkının kesin olarak zamanaşımına uğradığını düşünebilir. Doğrusu: alacak hakkı kazanılan durumda borçlu her zaman ifadan kaçınabilir, bu doğru bir ifadedir."},"E":{"ad":"Sürelerin Bağımsızlığını Yanlış Yorumlama Tuzağı","metin":"öğrenci iki ayrı sürenin aynı anda işlediğini ve önce dolanın esas alınacağını fark etmeyip bunu hatalı sanabilir. Doğrusu: madde 82\u0027deki iki ve on yıllık süreler birlikte işler, hangisi önce dolarsa zamanaşımı o anda gerçekleşir; bu ifade doğrudur."},"A":{"ad":"Ne soruluyor","metin":"sebepsiz zenginleşmede zamanaşımı kuralına aykırı ifade soruluyor. Kural: madde 82 fıkra 1\u0027e göre iki yıllık süre öğrenme tarihinden başlar. Doğrusu: A ifadesi madde metniyle birebir örtüşür, doğrudur."},"B":{"ad":"Süre Karıştırma Tuzağı","metin":"öğrenci on yıllık sürenin de öğrenme tarihinden başladığını sanabilir. Doğrusu: on yıllık süre öğrenmeden bağımsız olarak zenginleşmenin gerçekleştiği tarihten işler."}},"celdiriciYol":{},"hap":"Sebepsiz zenginleşmede iki yıllık süre öğrenme tarihinden, on yıllık süre zenginleşmenin gerçekleştiği tarihten başlar; alacak hakkı kazanılmışsa borçlu her zaman ifadan kaçınabilir.","teshis":{"C":{"gercek":"Alacak hakkı kazanılarak gerçekleşen zenginleşmede borçlu, zamanaşımı sonrasında da ifadan kaçınabilir.","ayirt":"Zenginleşme bir alacak hakkı kazanılması yoluyla mı gerçekleşti?","paragraf":"TBK m.82/2","yanilgi":"İstisna hükmünü atlayıp her istem hakkının süre dolunca kesin olarak sona erdiğini düşünüyorsun."},"E":{"gercek":"İki ve on yıllık süreler birlikte işler, ilk dolan süre zamanaşımını gerçekleştirir; bu genel zamanaşımı mantığının doğal sonucudur.","ayirt":"İki süreden hangisi daha önce dolar?","paragraf":"TBK m.82/1","yanilgi":"Bu şıkkı eleyen öğrenci, iki sürenin ayrı ayrı hesaplandığını ama en kısa olanın uygulanacağını fark etmiyor."},"A":{"gercek":"Madde 82 fıkra 1\u0027e göre iki yıllık süre hak sahibinin öğrenme tarihinden başlar.","ayirt":"Süre hangi bilgiye (öğrenme mi, olay mı) bağlanmış?","paragraf":"TBK m.82/1","yanilgi":"Bu şıkkı eleyen öğrenci, iki yıllık sürenin başlangıcını zenginleşme tarihiyle karıştırıyor."},"D":{"gercek":"Madde 82/1 açıkça iki yılı öğrenmeye, on yılı zenginleşme anına bağlar; bu şıkta eşleştirme tersine çevrilmiştir.","ayirt":"Metindeki iki süre ile bu şıktaki eşleştirme birebir örtüşüyor mu?","paragraf":"TBK m.82/1","yanilgi":"İki sürenin hangi olguya bağlandığını karıştırıp yer değiştirmiş halini doğru sanıyorsun."},"B":{"gercek":"On yıllık süre öğrenmeden bağımsız, mutlak olarak zenginleşmenin gerçekleştiği tarihten işler.","ayirt":"Bu süre bir bilgiye mi yoksa objektif bir olaya mı bağlı?","paragraf":"TBK m.82/1","yanilgi":"On yıllık sürenin de öğrenme şartına bağlı olduğunu sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":null,"kural":"6098 sayılı Türk Borçlar Kanunu\u0027nun 8 inci maddesine göre fiyatını göstererek mal sergilenmesi veya tarife, fiyat listesi ya da benzerlerinin gönderilmesi, aksi açıkça ve kolaylıkla anlaşılmadıkça öneri sayılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"t iyor. Müşteri Ayşe vitrinden geçerken bu etiketi görüyor ve \u0027bu fiyata alırım\u0027 diyerek içeri giriyor.","anlatim":"Bu senin sorunun olayı değil, aynı kuralın vitrindeki hâli. Etiketli mont, kanunun \u0027fiyat gösterilerek sergileme\u0027 cümlesini canlandırıyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.7 ve m.8, öneri sayılan ve sayılmayan durumları tek tek çiziyor; montun etiketi, gönderilen bir katalog, fiyatsız bir vitrin hep bu kuralın farklı örnekleri.","anlatim":"Kural şu: ısmarlanmamış şey öneri değildir, ama fiyat gösterilerek sergileme aksi anlaşılmadıkça önerinin ta kendisidir. Şimdi beş ifadeyi bu mont olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.7","karar":"yanlış","anlatim":"Hayır, m.7 açıkça ısmarlanmamış şeyin gönderilmesini öneri saymıyor. Ayşe\u0027nin montu istemesi ile bu durum karışmasın, ikisi ayrı senaryo.","formul":"Şık A: mağaza sana istemediğin bir kazak kargoyla gönderse, sen bu kazağı geri göndermek ya da saklamakla yükümlü müsün?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.8/1","karar":"yanlış","anlatim":"Hayır, m.8 fıkra 1 tam bu çekinceyi tanıyor; öneren bağlı olmadığını açıkça belirtirse önerisi kendini bağlamaz. Mağaza sahibi bunu yazmışsa artık serbest.","formul":"Şık B: mağaza sahibi vitrine küçük bir kâğıtla \u0027fiyatlar bağlayıcı değildir, stokla sınırlıdır\u0027 yazsa, montun etiketi hâlâ mağazayı bağlar mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.8/2","karar":"yanlış","anlatim":"Hayır, m.8 fıkra 2 fiyat listesi göndermeyi kural olarak öneri sayıyor; istisna sadece aksinin açıkça anlaşıldığı hâl. \u0027Hiçbir koşulda\u0027 demek kanunun istisna cümlesini yutmak olur.","formul":"Şık C: mağaza sana kışlık ürünlerin fiyat listesini postayla gönderse, bu liste hiçbir zaman öneri sayılmaz mı, sadece davet mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.8/2","karar":"doğru","anlatim":"Evet, m.8 fıkra 2 fiyat gösterilerek sergilemeyi tam olarak bu şekilde öneri sayıyor. Etiket üstünde fiyat var ve mağaza aksini söylememiş, öneri tamamlanmış.","formul":"Şık D: Ayşe\u0027nin gördüğü 450 TL etiketli mont, mağaza aksini açıkça belirtmediyse, hukuken bir öneri sayılır mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.8/2","karar":"yanlış","anlatim":"Hayır, m.8 fıkra 2 açıkça \u0027fiyatını göstererek\u0027 şartını arıyor. Fiyat yoksa bu şart eksik, öneri doğmaz.","formul":"Şık E: aynı montta hiç fiyat etiketi olmasaydı, sadece vitrinde asılı dursaydı, mağaza yine de bununla bağlı olur muydu?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Montun etiketinde fiyat varsa ve mağaza aksini söylememişse, o vitrin artık bir öneridir. Kendine hep şunu sor: fiyat gösterilmiş mi ve aksini gösteren açık bir işaret var mı?","doldur":[]}],"anahtar":[{"ornek":"göstererek","kok":"göster"},{"ornek":"açıkça","kok":"açıkça"},{"ornek":"gönderilmesi","kok":"gönder"},{"ornek":"sergileme","kok":"sergil"},{"ornek":"anlaşılmadıkça","kok":"anlaşı"},{"ornek":"aksinin","kok":"aksini"}],"konuGiris":{"harita":"Hangi durumlar öneri sayılır: istenmeden gönderilen şey öneri değildir, fiyat gösterilerek sergilenen mal ise kural olarak öneridir. Öneren ne zaman bağlı sayılmaz: bağlı olmama hakkını açıkça belirtmişse veya işin özelliğinden bağlanma niyeti olmadığı anlaşılıyorsa. Bu ayrım nasıl kaydedilir: kanun maddesindeki istisna cümleleriyle, aksi açıkça anlaşılmadıkça kuralı üzerinden değerlendirilir.","desen":"Sınav genellikle m.7 ve m.8\u0027deki istisnaları karıştırarak, ısmarlanmamış şeyin öneri sayılmasını doğru gösteren yanıltıcı seçenek sunar. Bir başka tuzak, fiyat gösterilerek sergilenen malın öneri sayılmayacağını iddia eden seçenektir; oysa kural tam tersidir. Bu soru Türk Borçlar Kanunu m.7 ve m.8 hükümlerinin istisna cümleleri noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Sözleşme kurmak için yöneltilen bağlayıcı irade açıklaması","ad":"öneri (icap)","kim":"kanun sabitler"},{"kaynak":" değildir."},"A":{"ad":"Ismarlanmamış Mal Tuzağı","metin":"Gönderilen her şeyin öneri niteliği taşıdığı düşünülür. Doğrusu: 6098 sayılı Türk Borçlar Kanunu\u0027nun 7 nci maddesine göre ısmarlanmamış bir şeyin gönderilmesi öneri sayılmaz ve alıcı onu geri göndermek veya saklamakla yükümlü değildir."},"B":{"ad":"Bağlılık Tuzağı","metin":"Önerenin saklı tuttuğu çekincenin sonuç doğurmadığı sanılır. Doğrusu: 8 inci maddeye göre öneren, bağlı olmama hakkını açıkça saklı tutarsa önerisi kendisini bağlamaz."}},"celdiriciYol":{},"hap":"Fiyat göstererek mal sergileme ile tarife, fiyat listesi ya da benzerlerinin gönderilmesi, aksi açıkça ve kolaylıkla anlaşılmadıkça öneri sayılır; ısmarlanmamış bir şeyin gönderilmesi ise hiçbir zaman öneri sayılmaz.","teshis":{"C":{"gercek":"m.8 fıkra 2, fiyat listesi göndermeyi kural olarak öneri sayar; istisna yalnız aksinin açıkça ve kolaylıkla anlaşıldığı hâldir.","ayirt":"Metinde aksini gösteren açık bir ibare var mı?","paragraf":"m.8/2","yanilgi":"Sen, kanunun istisna cümlesini görmezden gelip kuralı mutlak bir yasakmış gibi okuyorsun."},"E":{"gercek":"m.8 fıkra 2 açıkça fiyat gösterilmesini şart koşar; bu şart karşılanmadan sergileme öneri sayılmaz.","ayirt":"Sergilenen malın üzerinde fiyat gösterilmiş mi?","paragraf":"m.8/2","yanilgi":"Sen, maddedeki \u0027fiyatını göstererek\u0027 şartını gereksiz bir ayrıntı sayıp fiyatsız sergilemeyi de öneri kabul ediyorsun."},"A":{"gercek":"Türk Borçlar Kanunu m.7\u0027ye göre ısmarlanmamış şeyin gönderilmesi öneri sayılmaz, alıcı geri gönderme ya da saklama yükümü altında değildir.","ayirt":"Bu ürünü ben mi istedim, yoksa karşı taraf mı kendiliğinden gönderdi?","paragraf":"m.7","yanilgi":"Sen, karşı tarafa ulaşan her ürünün otomatik olarak öneri sayıldığını ve alıcının onu korumakla yükümlü olduğunu sanıyorsun."},"D":{"gercek":"m.8 fıkra 2\u0027ye göre fiyat gösterilerek sergileme, aksi açıkça ve kolaylıkla anlaşılmadıkça tek başına öneri sayılmaya yeterlidir.","ayirt":"Fiyat gösterilmiş mi ve aksini gösteren açık bir işaret var mı?","paragraf":"m.8/2","yanilgi":"Bu şıkkı eleyen öğrenci, fiyat göstermenin öneri sayılması için yeterli olmadığını, ayrıca yazılı bir taahhüt gerektiğini sanır."},"B":{"gercek":"m.8 fıkra 1\u0027e göre öneren bağlı olmama hakkını açıkça belirtirse önerisi kendisini bağlamaz.","ayirt":"Öneren, bağlı kalmayacağını açıkça söylemiş mi?","paragraf":"m.8/1","yanilgi":"Sen, önerenin çekince koymasının hukuken bir şey değiştirmediğini, sözün her hâlükârda bağlayıcı olduğunu sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 125"},"kural":"Türk Borçlar Kanununun 66 ncı maddesine göre çalıştıran, seçim, talimat, gözetim ve denetimde gerekli özeni gösterdiğini ispat ederse sorumluluktan kurtulur; bu kurtulma imkânı tehlike sorumluluğundan farklı olarak açıkça tanınmıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 125","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklarda \u0027kurtulur/kurtulamaz\u0027 zıtlığını madde fıkralarıyla tek tek eşleştir, tersine çevrilmiş fıkrayı yakala.","konu":"kusursuz sorumluluk","tablo":{"satirlar":[["A) Adam çalıştıran, çalışanının işin görülmesi sırasında ba…","m.66/1","doğru ifade"],["B) Adam çalıştıran, çalışanı seçerken, talimat verirken, gö…","m.66/2","doğru ifade"],["C) Bir işletmede adam çalıştıran, işletmenin çalışma düzeni…","m.66/3","doğru ifade"],["D) Adam çalıştıran, ödediği tazminat için zarar veren çalış…","m.66/4","doğru ifade"],["E) Adam çalıştıran, gerekli özeni gösterdiğini ispat etmiş …","m.66/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Bir işletmede adam çalıştıran, işletmenin çalışma düzeninin zararın doğmasını önlemeye elverişli olduğunu ispat etmedikçe sorumluluktan kurtulamaz.","E":"Adam çalıştıran, gerekli özeni gösterdiğini ispat etmiş olsa dahi meydana gelen zarardan sorumluluktan kurtulamaz.","A":"Adam çalıştıran, çalışanının işin görülmesi sırasında başkasına verdiği zararı gidermekle yükümlüdür.","D":"Adam çalıştıran, ödediği tazminat için zarar veren çalışana ancak onun bizzat sorumlu olduğu ölçüde rücu edebilir.","B":"Adam çalıştıran, çalışanı seçerken, talimat verirken, gözetim ve denetimde gerekli özeni gösterdiğini ispat ederse sorumluluktan kurtulur."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Türk Borçlar Kanununa göre adam çalıştıranın sorumluluğuna ilişkin aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-12","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.66","dogru":"E","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Ahmet\u0027in nakliye şirketinde şoför Kemal, 14 Mart günü kırmızı ışıkta geçip bir yayaya çarpıyor, yaya 40.000 TL zarar görüyor.","anlatim":"Yaya, hem Kemal\u0027e hem işveren Ahmet\u0027e dava açıyor. Ahmet mahkemede \u0027ben şoförü çok iyi seçtim, düzenli eğitim verdim\u0027 diyor. Şimdi bu savunmanın işe yarayıp yaramadığını göreceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu madde 66\u0027daki dört fıkrayı bu olayla tek tek deneyeceğiz.","anlatim":"Kural şu: çalışan iş sırasında zarar verirse çalıştıran öder, ama seçim-talimat-gözetimde özen ispatı kurtarır; işletme düzeninde ise daha ağır bir ispat gerekir; rücu da sınırlıdır. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.66/1","karar":"doğru","anlatim":"Kemal görevi sırasında zarar verdi, bu yüzden Ahmet sorumludur. Bu, madde 66\u0027nın birinci fıkrasının aynen söylediği kuraldır.","formul":"Şık A: Kemal, işi yaparken yayaya zarar verdi; Ahmet bu zararı gidermekle yükümlü mü?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.66/2","karar":"doğru","anlatim":"Evet, kurtulur; kanun bu ispatı açıkça kurtuluş kanıtı sayar. Bu, madde 66\u0027nın ikinci fıkrasının hükmüdür.","formul":"Şık B: Ahmet \u0027Kemal\u0027i özenle seçtim, talimat verdim, denetledim\u0027 diyerek bunu ispat ederse sorumluluktan kurtulur mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.66/3","karar":"doğru","anlatim":"Hayır, kurtulamaz; işletme faaliyetinde bireysel özen yetmez, düzenin elverişliliği ispatlanmalıdır. Bu, madde 66\u0027nın üçüncü fıkrasının kuralıdır.","formul":"Şık C: Ahmet\u0027in şirketi bir işletme ise, işletme düzeninin zararı önlemeye elverişli olduğunu ispat etmedikçe sorumluluktan kurtulabilir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.66/4","karar":"doğru","anlatim":"Ahmet, ancak Kemal\u0027in bizzat sorumlu olduğu ölçüde rücu edebilir, tamamını isteyemez. Bu sınır madde 66\u0027nın dördüncü fıkrasında yazar.","formul":"Şık D: Ahmet tazminatı ödedikten sonra Kemal\u0027e tamamını mı yoksa Kemal\u0027in kusuru ölçüsünde mi rücu edebilir?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.66/2","karar":"yanlış","anlatim":"Hayır, kurtulabilir; madde 66\u0027nın ikinci fıkrası özen ispatını açıkça kurtuluş sebebi yapar. Bu yüzden \u0027kurtulamaz\u0027 demek kanuna aykırıdır.","formul":"Şık E: Ahmet özen gösterdiğini ispat etmiş olsa dahi, yine de sorumluluktan kurtulamaz mı diyorsun?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Tek yanlış E, çünkü özen ispatı gerçekten kurtuluş sağlar; kendine hep şunu sor: bu kusursuz sorumlulukta kurtuluş kanıtı var mı yok mu?","doldur":[]}],"anahtar":[{"ornek":"kurtuluş","kok":"kurtul"},{"ornek":"sorumluluğu","kok":"soruml"},{"ornek":"fıkrasının","kok":"fıkras"},{"ornek":"ispatıyla","kok":"ispatı"},{"ornek":"kanıtına","kok":"kanıtı"},{"ornek":"gözetim","kok":"gözeti"}],"konuGiris":{"harita":"Ne zaman uygulanır: çalışanın iş görürken üçüncü kişiye zarar vermesi durumunda uygulanır. Nasıl kurtulunur: adam çalıştıran seçme, talimat, gözetim özenini gösterdiğini ispatlarsa sorumluluktan kurtulur. Nasıl geri alınır: ödenen tazminat için çalışana ancak onun kusuru ölçüsünde rücu edilir.","desen":"Soru genellikle kurtuluş kanıtının kapsamını ve rücu sınırını karıştırtarak yanlış ifadeyi buldurur. Tuzak, kusursuz sorumluluğun mutlak sorumluluk gibi gösterilmesidir; oysa m.66 kurtuluş kanıtına izin verir. Bu soru m.66\u0027daki kurtuluş kanıtı ve rücu sınırı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"çalışanın iş görürken verdiği zarardan işverenin sorumlu tutulmasıdır","ad":"adam çalıştıran sorumluluğu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"özenin gösterildiğini ispatlayarak sorumluluktan kurtulma imkanıdır","ad":"kurtuluş kanıtı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"çalışma düzeninin zararı önlemeye elverişli olduğunun ispatlanamaması hâlidir","ad":"işletme sorumluluğu","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"ödenen tazminatın çalışanın kusuru ölçüsünde geri istenmesidir","ad":"rücu hakkı","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Adam çalıştıranın sorumluluğuna ilişkin ifadeler verilir ve hangisinin kanuna aykırı olduğu istenir.","panel_ornek":"Bir kargo şirketinin kuryesi teslimat sırasında bir vitrini kırar. Şirket, kuryeyi işe alırken referans kontrolü yaptığını ve düzenli araç bakımı yaptırdığını belgeleyebilirse tazminattan kurtulabilir; belgeleyemezse zararı öder.","ornek":"Bir kargo şirketinin kuryesi teslimat sırasında bir vitrini kırar. Şirket, kuryeyi işe alırken referans kontrolü yaptığını ve düzenli araç bakımı yaptırdığını belgeleyebilirse tazminattan kurtulabilir; belgeleyemezse zararı öder.","yontemler":"Her ifadeyi m.66\u0027nın cümleleriyle tek tek karşılaştırıp kurtuluş kanıtı ve rücu sınırını doğru yansıtıp yansıtmadığına bakılır.","nedir":"Kusursuz sorumluluk, kişinin kendi kusuru olmasa bile kanunun aradığı özel bir sebeple zarardan sorumlu tutulmasıdır. Sınav burada adam çalıştıranın kurtuluş kanıtı getirme koşullarını ölçer."},"olay":"","tuzak":{"C":{"ad":"İstisnayı Genelleme Tuzağı","metin":"Öğrenci işletme faaliyetinden doğan zararda da bireysel özen ispatının yeterli olduğunu sanır. Doğrusu: İşletme faaliyetinde ancak işletme düzeninin zararı önlemeye elverişli olduğu ispatlanırsa sorumluluktan kurtulunur."},"A":{"ad":"Ne soruluyor","metin":"Adam çalıştıranın sorumluluğuna ilişkin ifadelerden hangisinin yanlış olduğu soruluyor. Kural: Türk Borçlar Kanununun 66 ncı maddesinin birinci fıkrasına göre adam çalıştıran, çalışanının işin yapılması sırasında verdiği zararı gidermekle yükümlüdür. Doğrusu: Bu ifade madde metnine uygun olup doğrudur."},"D":{"ad":"Rücu Kapsamını Genişletme Tuzağı","metin":"Öğrenci ödenen tazminatın tamamı için rücu hakkı doğduğunu sanır. Doğrusu: Rücu hakkı, ancak çalışanın bizzat sorumlu olduğu ölçüyle sınırlıdır."},"B":{"ad":"Ters Kayıt Tuzağı","metin":"Öğrenci özen ispatının kurtuluş sağlamadığını düşünür, oysa madde bunun tam tersini söyler. Doğrusu: Seçim, talimat, gözetim ve denetimde gerekli özen ispatlanırsa çalıştıran sorumluluktan kurtulur."}},"celdiriciYol":{},"hap":"Adam çalıştıranın sorumluluğu, seçim-talimat-gözetim özeninin ispatıyla kurtuluş kanıtına açık bir kusursuz sorumluluk halidir.","teshis":{"C":{"gercek":"Madde 66/3 işletme düzeninin elverişliliğini ayrı ve daha ağır bir ispat yükü olarak öngörür.","ayirt":"Zarar bireysel hatadan mı işletme düzeninden mi doğdu?","paragraf":"m.66/3","yanilgi":"İşletme faaliyetinden doğan zararda da bireysel özen ispatının yeterli olacağını sanıyorsun."},"E":{"gercek":"Madde 66/2 açıkça özen ispatıyla kurtulma imkânı tanır; bu nedenle \u0027kurtulamaz\u0027 ifadesi kanuna aykırıdır.","ayirt":"Bu kusursuz sorumluluk türünde özen ispatı kurtuluş sağlar mı, sağlamaz mı?","paragraf":"m.66/2","yanilgi":"Bu şıkkı doğru sanıp eleyen öğrenci, adam çalıştıranın sorumluluğunu tehlike sorumluluğu gibi mutlak (kurtuluş kanıtı kabul etmeyen) bir sorumluluk sanır."},"A":{"gercek":"Madde 66/1 çalışanın iş görürken verdiği zararı çalıştırana yükler; bu genel kuraldır.","ayirt":"Bu ifade madde metninin birebir tekrarı mı?","paragraf":"m.66/1","yanilgi":"Bu şıkkı yanlış sanıp elersen, temel sorumluluk kuralını tehlike sorumluluğuyla karıştırıyorsundur."},"D":{"gercek":"Madde 66/4 rücuyu çalışanın bizzat sorumlu olduğu ölçüyle sınırlar.","ayirt":"Rücu miktarı kim için, hangi ölçüde sınırlandı?","paragraf":"m.66/4","yanilgi":"Çalıştıranın ödediği tazminatın tamamını çalışana rücu edebileceğini düşünüyorsun."},"B":{"gercek":"Madde 66/2 seçim, talimat, gözetim ve denetimde özen ispatını kurtuluş kanıtı olarak tanır.","ayirt":"Bu istisna hangi fıkrada düzenlenmiş?","paragraf":"m.66/2","yanilgi":"Özen ispatının hiçbir sonuç doğurmadığını, kusursuz sorumluluğun her hâlükârda devam ettiğini sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 128"},"kural":"Türk Borçlar Kanununun 67 nci maddesine göre hayvan bulunduran, zararın doğmasını engellemek için gerekli özeni gösterdiğini ispat ederse sorumlu olmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 128","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Hayvan bulunduran (m.67) ile yapı eseri maliki (m.69) sorumluluğunu ayır: birinde kurtuluş kanıtı vardır, diğerinde yoktur.","konu":"kusursuz sorumluluk kurtuluş kanıtı","tablo":{"satirlar":[["A) Hayvan bulunduran, zararın doğmasını engellemek için ger…","m.67","YANLIŞ ifade"],["B) Hayvanın bir başkasına ait hayvan tarafından ürkütülmüş …","m.67","YANLIŞ ifade"],["C) Hayvan bulunduran, zararın doğmasını engellemek için ger…","m.67","doğru ifade"],["D) Hayvan bulunduranın sorumluluğu kusura dayalı bir soruml…","m.67","YANLIŞ ifade"],["E) Zarardan, hayvanın bakım ve yönetimini üstlenen kişi değ…","m.67","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Hayvan bulunduran, zararın doğmasını
