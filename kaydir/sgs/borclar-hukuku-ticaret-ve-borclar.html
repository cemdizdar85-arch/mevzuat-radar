ağlamdı\u0027 demesi hiçbir işe yaramaz mı, sorumluluktan hiç kurtulamaz mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.67","karar":"yanlış","anlatim":"Madde 67 son cümle, hayvan başka hayvan tarafından ürkütülürse bulunduranın rücu hakkını saklı tutar. Bu ifade rücu hakkı yok diyor, dolayısıyla yanlış.","formul":"Şık B: Boğayı ürküten köpeğin sahibine Osman rücu edebilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.67","karar":"doğru","anlatim":"Madde 67 tam olarak bunu söylüyor: gerekli özen ispatlanırsa sorumlu olunmaz. Osman bağı sağlam tuttuğunu kanıtlarsa tazminat ödemez.","formul":"Şık C: Osman gerekli özeni gösterdiğini ispat ederse gerçekten sorumluluktan kurtulur mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.67","karar":"yanlış","anlatim":"Bu sorumluluk kusursuz sorumluluktur, kusur aranmaz. İspat yükü Osman\u0027a aittir, komşuya değil; bu yüzden ifade yanlış.","formul":"Şık D: Komşu, Osman\u0027ın kusurunu ispatlamak zorunda mı, yoksa Osman mı özenini ispatlıyor?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.67","karar":"yanlış","anlatim":"Madde 67, bakım ve yönetimi üstlenen kişiyi sorumlu tutar, malik şartı aramaz. Ahmet bakımı üstlenmişse o da sorumlu olabilir, bu yüzden ifade yanlış.","formul":"Şık E: Boğayı çobanlık yapan işçi Ahmet bakıyorsa, sadece malik Osman mı sorumlu tutulur?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Hayvan bulunduranın sorumluluğu kurtuluş kanıtlı kusursuz sorumluluktur, sadece C doğrudur. Kendine hep şunu sor: bu maddede ispatla kurtuluş var mı?","doldur":[]}],"anahtar":[{"ornek":"sorumluluktan","kok":"soruml"},{"ornek":"kurtulur","kok":"kurtul"},{"ornek":"hayvan","kok":"hayvan"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"bulunduran","kok":"bulund"},{"ornek":"gerekli","kok":"gerekl"}],"konuGiris":{"harita":"Kurtuluş kanıtı ne zaman ileri sürülür: hayvan bulunduran zarardan sorumlu tutulduğunda, sorumluluktan kurtulmak için ispat yükünü üstlenince öne sürülür. Nasıl ölçülür: zararın doğmasını engellemek için gerekli özenin gösterildiğinin somut biçimde ispatlanmasıyla ölçülür. Nasıl kaydedilir: ispat başarılı olursa sorumluluk tamamen kalkar, yoksa hayvan bulunduran zarardan sorumlu sayılır.","desen":"Sınav genellikle kurtuluş kanıtını kusursuz sorumluluğun bir istisnası gibi göstererek şıklarda karıştırır. Tuzak, \u0027hiçbir şekilde sorumluluktan kurtulamaz\u0027 ifadesiyle m.67\u0027deki istisnayı gizlemektir. Bu soru m.67 fıkra 2 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"hayvanın bakım ve yönetimini sürekli veya geçici üstlenen kişi","ad":"Hayvan bulunduran","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"gerekli özenin gösterildiğinin ispatı, sorumluluğu kaldıran savunma","ad":"Kurtuluş kanıtı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"zararı ödeyenin zarara asıl sebep olana geri dönme hakkı","ad":"Rücu hakkı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"hayvanın başka biri veya hayvan tarafından korkutulup zarar vermesi durumu","ad":"Ürkütme hali","kim":"kanun sabitler"}],"sinavda":"Soru, hayvan bulunduranın sorumluluktan hangi şartla kurtulabileceğini doğru şıkta seçmeyi ister.","panel_ornek":"Komşunun köpeği bahçeden kaçıp bir bisikleti devirdi; köpek sahibi zincir taktığını ve kapıyı hep kapalı tuttuğunu kanıtlayabilirse tazminat ödemeyebilir. Burada aranan şey sadece \u00273 kere uyardım\u0027 demek değil, gerçekten önlem aldığını göstermektir.","ornek":"Komşunun köpeği bahçeden kaçıp bir bisikleti devirdi; köpek sahibi zincir taktığını ve kapıyı hep kapalı tuttuğunu kanıtlayabilirse tazminat ödemeyebilir. Burada aranan şey sadece \u00273 kere uyardım\u0027 demek değil, gerçekten önlem aldığını göstermektir.","yontemler":"Metni satır satır okuyup \u0027gerekli özeni gösterdiğini ispat ederse sorumlu olmaz\u0027 cümlesindeki şartı doğrudan şıkla eşleştirmek yeterlidir.","nedir":"Bu konu hayvan bulunduranın hayvanın verdiği zarardan ne zaman sorumlu tutulamayacağını anlatır. Sınav, kurtuluş kanıtının şartını bilip bilmediğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Sorumluluk Türü Karıştırma Tuzağı","metin":"Öğrenci kusursuz sorumluluğu kusur sorumluluğu sanıp ispat yükünü zarar görene yükler. Doğrusu: bu bir kusursuz sorumluluktur, ispat yükü hayvan bulundurana aittir."},"E":{"ad":"Sorumlu Kişi Tuzağı","metin":"Öğrenci sorumluluğu mülkiyete bağlar, oysa madde malik değil bakım ve yönetimi üstleneni esas alır. Doğrusu: hayvanın bakımını ve yönetimini sürekli veya geçici üstlenen kişi sorumludur."},"A":{"ad":"Ağırlaştırılmış Sorumluluk Tuzağı","metin":"Öğrenci hayvan bulunduranın sorumluluğunu, kurtuluş kanıtı tanınmayan yapı eseri maliki sorumluluğuyla (madde 69) karıştırıp kurtuluşun mümkün olmadığını düşünür. Doğrusu: madde 67 gereği gerekli özenin ispatı sorumluluğu kaldırır."},"B":{"ad":"Rücu Hakkını Yok Sayma Tuzağı","metin":"Öğrenci maddenin yalnız ispatla ilgili olduğunu düşünüp rücu fıkrasını atlar. Doğrusu: hayvan başka bir hayvan tarafından ürkütülmüşse hayvan bulunduranın o hayvanın sahibine rücu hakkı saklıdır."}},"celdiriciYol":{},"hap":"Hayvan bulunduran, gerekli özeni gösterdiğini ispat ederse sorumluluktan kurtulur; bu kurtuluş kanıtlı bir kusursuz sorumluluktur.","teshis":{"C":{"gercek":"Türk Borçlar Kanunu madde 67, kusursuz sorumluluk türlerinden kurtuluş kanıtlı sorumluluğu düzenler; gerekli özenin ispatı sorumluluğu kaldırır.","ayirt":"Bu sorumluluk türünde ispatla kurtuluş mümkün mü, yoksa mutlak mı?","paragraf":"m.67","yanilgi":"Kusursuz sorumlulukta hiçbir kurtuluş imkanı olmadığını düşünüp bu doğru şıkkı elersin."},"E":{"gercek":"Madde, hayvanın bakımını ve yönetimini sürekli veya geçici üstlenen kişiyi esas alır; bu kişi malik olmak zorunda değildir.","ayirt":"Madde malikten mi, yoksa bakım ve yönetimi üstlenenden mi bahsediyor?","paragraf":"m.67","yanilgi":"Sorumluluğu mülkiyete bağlayıp yalnız malikin sorumlu olacağını sanıyorsun."},"A":{"gercek":"Türk Borçlar Kanunu madde 67, hayvan bulundurana gerekli özeni ispat ederek sorumluluktan kurtulma imkanı tanır; bu madde 69\u0027daki yapı eseri sorumluluğundan farklıdır.","ayirt":"Bu maddede kurtuluş kanıtına yer verilmiş mi diye maddeyi tekrar okudum mu?","paragraf":"m.67","yanilgi":"Yapı eseri maliki gibi hayvan bulunduranın da kurtuluş kanıtından yararlanamayacağını sanıyorsun."},"D":{"gercek":"Bu bir kusursuz sorumluluktur; kusur aranmaz, ispat yükü hayvan bulundurana aittir.","ayirt":"Zarar gören mi kusuru ispatlıyor, yoksa bulunduran mı özenini ispatlıyor?","paragraf":"m.67","yanilgi":"Sorumluluk ağır olduğu için bunun kusura dayandığını, ispat yükünün zarar görende olduğunu sanıyorsun."},"B":{"gercek":"Türk Borçlar Kanunu madde 67 son fıkra, hayvanın başka bir hayvan tarafından ürkütülmesi halinde bulunduranın rücu hakkını saklı tutar.","ayirt":"Madde yalnız sorumluluğu mu, yoksa sorumlunun üçüncü kişiye rücu hakkını da mı düzenliyor?","paragraf":"m.67","yanilgi":"Maddenin yalnız birinci cümlesini hatırlayıp rücu fıkrasının hiç düzenlenmediğini sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 127"},"kural":"Türk Borçlar Kanununun 504 üncü maddesi yalnız dava açma, sulh olma, hakeme başvurma, iflas/konkordato talebi, kambiyo taahhüdü, bağışlama, kefalet, taşınmaz devri ve hak ile sınırlandırma işlemlerini özel yetkiye bağlamıştır; kira sözleşmesi yapmak bu sayımda yer almayan, işin görülmesi için gerekli olağan bir hukuki işlemdir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 127","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 504\u0027teki dokuz istisnayı ezberle; şıklardan bu listede olmayan tek işlemi ara, o doğru şıktır.","konu":"vekalet sözleşmesi","tablo":{"satirlar":[["A) Müvekkili adına taşınmaz devri yapmak","m.504/2","YANLIŞ ifade"],["B) Müvekkili adına kambiyo taahhüdünde bulunmak","m.504/2","YANLIŞ ifade"],["C) Müvekkili adına dava açmak","m.504/2","YANLIŞ ifade"],["D) Müvekkili adına kira sözleşmesi yapmak","m.504","doğru ifade"],["E) Müvekkili adına bağışlama yapmak","m.504/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Müvekkili adına dava açmak","E":"Müvekkili adına bağışlama yapmak","A":"Müvekkili adına taşınmaz devri yapmak","D":"Müvekkili adına kira sözleşmesi yapmak","B":"Müvekkili adına kambiyo taahhüdünde bulunmak"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Avukat (A), müvekkili (B) ile yaptığı vekalet sözleşmesinde özel bir yetki kaydına yer vermemiştir. 6098 sayılı Türk Borçlar Kanununa göre (A)\u0027nın özel olarak yetkilendirilmeksizin yapabileceği işlem aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-15","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.504","dogru":"D","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Bir gemi acentesi olan avukat (C), müşterisi (D) fabrikası ile \u0027işlerimi görürsün\u0027 diyerek genel bir vekalet sözleşmesi yapmış, kağıda tek satır özel yetki yazmamışlar.","anlatim":"D\u0027nin depoya ihtiyacı olunca C, D adına 3 yıllık bir kira sözleşmesi imzalamış. D sonra \u0027sen bunu yapamazdın\u0027 diye itiraz ediyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanununun 504 üncü maddesi dokuz işlemi tek tek sayıp bunları özel yetkiye bağlıyor, geri kalan her şey olağan işin görülmesi sayılıyor.","anlatim":"Bu olayda beş işlem türünü tek tek deneyeceğiz: dava, kambiyo, bağışlama, taşınmaz devri, kira. Hangisi dokuz sayılan işlemin içinde, hangisi dışında bakacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.504/2","karar":"yanlış","anlatim":"Hayır, yapamaz; taşınmazı devretmek maddede açıkça sayılan dokuz işlemden biridir. Sözleşmede özel yetki kaydı yoksa bu işlem geçersiz kalır.","formul":"Şık A: C, D adına fabrikanın arsasını üçüncü kişiye satıp devretse, bunu özel yetkisiz yapabilir mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.504/2","karar":"yanlış","anlatim":"Hayır, olmaz; kambiyo taahhüdü de madde metninde ayrıca sayılan bir istisnadır. Vekil bunu ancak açık yetkiyle yapabilir.","formul":"Şık B: C, D adına bir bonoya kefil imza atıp kambiyo taahhüdünde bulunsa, özel yetkisiz geçerli olur mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.504/2","karar":"yanlış","anlatim":"Yetmez; dava açmak maddede sulh olma ve hakeme başvurmayla birlikte özel yetki isteyen işlemler arasında sayılmıştır. C, önce D\u0027den yazılı özel yetki almalı.","formul":"Şık C: D\u0027nin bir alacaklısına karşı C, D adına dava açsa, buna genel yetki yeter mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.504","karar":"doğru","anlatim":"Evet, sayılır; kira sözleşmesi maddedeki dokuz istisna arasında yer almaz, işin görülmesi için gerekli olağan bir hukuki işlemdir. D\u0027nin itirazı haksızdır.","formul":"Şık D: C\u0027nin depo için imzaladığı o kira sözleşmesi, özel yetki olmadan geçerli sayılır mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.504/2","karar":"yanlış","anlatim":"Hayır, olmaz; bağışlama maddede açıkça özel yetkiye bağlanan işlemlerdendir. C bunu tek başına yapamaz.","formul":"Şık E: C, D\u0027nin bir malını üçüncü kişiye karşılıksız bağışlasa, bu işlem genel yetkiyle geçerli olur mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"D, dokuz sayılan istisnanın dışında kaldığı için özel yetkisiz yapılabilen tek işlem oluyor. Kendine hep şunu sor: bu işlem madde metninde tek tek sayılan dokuz işlemden biri mi, değilse özel yetki aranmaz.","doldur":[]}],"anahtar":[{"ornek":"sözleşmede","kok":"sözleş"},{"ornek":"sayılan","kok":"sayıla"},{"ornek":"taşınmaz","kok":"taşınm"},{"ornek":"işlemleri","kok":"işleml"},{"ornek":"bağışlama","kok":"bağışl"},{"ornek":"kambiyo","kok":"kambiy"}],"konuGiris":{"harita":"Ne zaman özel yetki aranır: sözleşmede açıkça belirtilmemişse kanunda sayılan işlemler için. Nasıl belirlenir: vekaletin kapsamı işin niteliğine göre yorumlanır. Nasıl ayrılır: kanunda sayılan işlemler istisna, geri kalan olağan işlemler kapsam içidir.","desen":"Soru, kanunda sayılan istisnai işlemlerden birini seçenekler arasına gizleyip diğerlerini olağan işlem gibi sunar. Tuzak, sayılan işlemler listesini ezbere bilmemekten kaynaklanır. Bu soru Türk Borçlar Kanunu m.504 fıkra 2\u0027deki sayma hükmünden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Sözleşmede açık değilse işin niteliğine göre belirlenen yetki sınırı","ad":"Vekaletin kapsamı","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Dava açma, sulh, kefil olma gibi kanunda sayılan istisnai işlemler","ad":"Özel yetki gerektiren işlemler","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İşin görülmesi için gerekli, özel yetki istemeyen hukuki işlem","ad":"Olağan işlem","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Vekilin üstlendiği işin görülmesi için gereken temel işlem yapma gücü","ad":"Hukuki işlem yapma yetkisi","kim":"kanun sabitler"}],"sinavda":"Vekalette özel yetki kaydı olmadığı belirtilir ve hangi işlemin özel yetki gerektirmediği sorulur.","panel_ornek":"Annen sana markette ekmek almanı söyler, bu senin doğal yetkindir. Ama evi satmanı isterse bunu ayrıca ve açıkça söylemesi gerekir; yoksa evi satamazsın.","ornek":"Annen sana markette ekmek almanı söyler, bu senin doğal yetkindir. Ama evi satmanı isterse bunu ayrıca ve açıkça söylemesi gerekir; yoksa evi satamazsın.","yontemler":"Türk Borçlar Kanunu m.504\u0027teki sayılan işlemleri (dava açma, sulh, hakeme başvurma, iflas/konkordato talebi, kambiyo taahhüdü, bağışlama, kefalet, taşınmaz devri, hak sınırlandırma) ezbere bilmek gerekir. Bu listede olmayan her işlem olağan kapsamda kabul edilir.","nedir":"Vekalet sözleşmesi, bir kişinin başka birine iş görme yetkisi vermesidir. Sınav, özel yetki gerektiren işlemlerle olağan yetki kapsamındaki işlemlerin ayrımını ölçer."},"olay":"yok, teorik değerlendirme.","tuzak":{"C":{"ad":"Dava Açma Tuzağı","metin":"öğrenci vekaletin hukuki işlem yapma yetkisini dava takibini de kapsar sanır. Doğrusu: vekil özel olarak yetkili kılınmadıkça dava açamaz, sulh olamaz, hakeme başvuramaz."},"E":{"ad":"Bağışlama Tuzağı","metin":"öğrenci bağışlamayı da vekilin serbestçe yapabileceği bir tasarruf sanır. Doğrusu: madde bağışlama yapmayı da özel yetkiye bağlı işlemler arasında açıkça saymıştır."},"A":{"ad":"Taşınmaz Devri Tuzağı","metin":"öğrenci taşınmazla ilgili her işlemi vekilin olağan yetkisi kapsamında sanır. Doğrusu: Türk Borçlar Kanununun 504 üncü maddesine göre vekil özel yetki olmadıkça taşınmazı devredemez ve bir hak ile sınırlandıramaz."},"B":{"ad":"Kambiyo Taahhüdü Tuzağı","metin":"öğrenci bu işlemi sıradan bir hukuki işlem sanıp genel yetki kapsamında görür. Doğrusu: madde, kambiyo taahhüdünde bulunmayı açıkça özel yetkiye bağlamıştır."}},"celdiriciYol":{},"hap":"Vekil, sözleşmede veya işin niteliğinde aksi yoksa işin görülmesi için gerekli hukuki işlemleri yapabilir; ancak dava açma, sulh, hakeme başvurma, iflas/konkordato talebi, kambiyo taahhüdü, bağışlama, kefalet, taşınmaz devri ve hak ile sınırlandırma için özel yetki şarttır.","teshis":{"C":{"gercek":"Madde dava açmayı, sulh olmayı ve hakeme başvurmayı özel yetki gerektiren işlemler arasında saymıştır.","ayirt":"Bu işlem madde metninde sayılan dokuz istisnadan biri mi?","paragraf":"m.504/2","yanilgi":"Vekaletin hukuki işlem yapma yetkisinin dava takibini de otomatik kapsadığını düşünüyorsun."},"E":{"gercek":"Madde bağışlama yapmayı özel yetkiye bağlı işlemler arasında açıkça saymıştır.","ayirt":"Bu işlem madde metninde sayılan dokuz istisnadan biri mi?","paragraf":"m.504/2","yanilgi":"Bağışlamayı vekilin müvekkil yararına yapabileceği serbest bir tasarruf sanıyorsun."},"A":{"gercek":"Türk Borçlar Kanununun 504 üncü maddesi taşınmaz devrini ve taşınmaz üzerinde hak ile sınırlandırmayı özel yetkiye bağlar.","ayirt":"Bu işlem madde metninde sayılan dokuz istisnadan biri mi?","paragraf":"m.504/2","yanilgi":"Taşınmazla ilgili her işlemi vekilin genel yetkisi içinde sanıyorsun."},"D":{"gercek":"Madde 504, vekaletin işin görülmesi için gerekli hukuki işlemleri kapsadığını, yalnız sayılan dokuz işlemin özel yetki gerektirdiğini belirtir; kira sözleşmesi bu sayımın dışındadır.","ayirt":"Bu işlem madde metninde tek tek sayılan dokuz istisnadan biri mi, yoksa olağan bir hukuki işlem mi?","paragraf":"m.504","yanilgi":"Sayılan dokuz istisna dışındaki her işlemin de özel yetki gerektirdiğini sanıp bu şıkkı elersin."},"B":{"gercek":"Madde, kambiyo taahhüdünde bulunmayı açıkça özel yetki şartına bağlamıştır.","ayirt":"Bu işlem madde metninde sayılan dokuz istisnadan biri mi?","paragraf":"m.504/2","yanilgi":"Kambiyo taahhüdünü basit bir ödeme işlemi gibi görüp genel yetki kapsamında sayıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 128"},"kural":"madde, zarar görene ya sözleşmeyle bağlı olmadığını bildirip edimin geri verilmesini ya da sözleşmeye bağlı kalıp oransızlığın giderilmesini isteme seçimlik hakkını tanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 128","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Süreli hak sorularında \u0027öğrenme anı\u0027 ile \u0027sözleşme/olay anı\u0027 başlangıçlarını ayrı ayrı işaretle, karıştırma.","konu":"sözleşme iptal sebepleri","tablo":{"satirlar":[["A) Sözleşmedeki edimler arasında açık bir oransızlığın bulu…","TBK m.28, f.1","doğru ifade"],["B) Zarar görenin zor durumda kalmasından, düşüncesizliğinde…","TBK m.28, f.1","doğru ifade"],["C) Hak, düşüncesizlik veya deneyimsizliğin öğrenildiği tari…","TBK m.28, f.2","doğru ifade"],["D) Hak, her hâlde sözleşmenin kurulduğu tarihten başlayarak…","TBK m.28, f.2","doğru ifade"],["E) Zarar gören yalnızca ediminin geri verilmesini isteyebil…","TBK m.28, f.1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Hak, düşüncesizlik veya deneyimsizliğin öğrenildiği tarihten başlayarak bir yıl içinde kullanılmalıdır","E":"Zarar gören yalnızca ediminin geri verilmesini isteyebilir, edimler arasındaki oransızlığın giderilmesini isteyemez","A":"Sözleşmedeki edimler arasında açık bir oransızlığın bulunması gerekir","D":"Hak, her hâlde sözleşmenin kurulduğu tarihten başlayarak beş yıl içinde kullanılmalıdır","B":"Zarar görenin zor durumda kalmasından, düşüncesizliğinden ya da deneyimsizliğinden yararlanılmış olması aranır"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027na göre aşırı yararlanma (gabin) sebebiyle sözleşmeyle bağlı olunmadığının bildirilmesine ilişkin aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-18","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.28","dogru":"E","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Ahmet, İzmir\u0027de babadan kalan bir arsayı 2019\u0027da acil borç yüzünden gerçek değerinin çok altında, 50.000 TL\u0027ye komşusuna satıyor.","anlatim":"Arsanın gerçek değeri o tarihte 300.000 TL. Ahmet o an çok zor durumda, düşünecek hâli yok.","doldur":[]},{"formul":"Ne yapacağız: Ahmet 2023\u0027te öğreniyor ki arsanın gerçek değerini biliyormuş komşusu, durumundan yararlanmış.","anlatim":"Türk Borçlar Kanunu m.28\u0027e göre oransızlık + zor durumdan yararlanma varsa Ahmet sözleşmeyle bağlı olmadığını bildirip ediminin iadesini isteyebilir, ya da sözleşmeyi ayakta tutup fark ödemesini isteyebilir. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.28, f.1","karar":"doğru","anlatim":"Evet, bu kadar büyük bir fark maddenin aradığı açık oransızlıktır. Kanun bunu ilk şart olarak arıyor.","formul":"Şık A: 50.000 TL ile 300.000 TL arasındaki fark, gabin için \u0027açık oransızlık\u0027 şartını karşılar mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.28, f.1","karar":"doğru","anlatim":"Sadece oransızlık yetmez, zor durum/deneyimsizlik/düşüncesizlik hallerinden biri ve bundan yararlanılma da aranır. Ahmet\u0027in olayında zor durumdan yararlanma var.","formul":"Şık B: Ahmet\u0027in sadece \u0027ucuza sattım\u0027 demesi yeter mi, yoksa zor durumda kaldığının ve bundan yararlanıldığının da gösterilmesi mi gerekir?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.28, f.2","karar":"doğru","anlatim":"Evet, öğrenme ya da zor durumun ortadan kalkması tarihinden başlayarak bir yıl içinde hakkını kullanmalı. Bu süre kaçırılırsa hak düşer.","formul":"Şık C: Ahmet zor durumunun 2023\u0027te ortadan kalktığını öğrendi, bir yıl içinde mi dava açmalı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.28, f.2","karar":"doğru","anlatim":"Hayır, beş yıllık süre her hâlde işler ve sözleşmenin kurulduğu tarihten başlar. Bu süre dolunca öğrenme tarihi ne olursa olsun hak biter.","formul":"Şık D: Ahmet öğrenmeyi çok geç fark etse bile, sözleşme tarihinden itibaren beş yıl geçtiyse hâlâ hakkını kullanabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.28, f.1","karar":"yanlış","anlatim":"Hayır, Ahmet\u0027in iki seçeneği var: ya sözleşmeden dönüp iadeyi ister ya da sözleşmeyi ayakta tutup oransızlığın giderilmesini ister. Yalnızca geri verme isteyebileceğini söylemek yanlıştır.","formul":"Şık E: Ahmet mahkemeye \u0027ben sadece arsayı geri isterim, başka seçeneğim yok\u0027 diyebilir mi?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Ahmet\u0027in tek seçeneği yok, iki seçimlik hakkı var; kendine hep sor: madde \u0027ya... ya da...\u0027 mu diyor?","doldur":[]}],"anahtar":[{"ornek":"sözleşmeyle","kok":"sözleş"},{"ornek":"oransızlığın","kok":"oransı"},{"ornek":"yararlanma","kok":"yararl"},{"ornek":"giderilmesini","kok":"gideri"},{"ornek":"seçimlik","kok":"seçiml"},{"ornek":"isteyebilir","kok":"isteye"}],"konuGiris":{"harita":"Ne zaman test edilir: zor durum, düşüncesizlik veya deneyimsizlikten yararlanılarak edimler arasında açık oransızlık yaratıldığında test edilir. Nasıl ölçülür: zarar görenin öğrenme anından itibaren 1 yıllık ve sözleşme kuruluşundan itibaren 5 yıllık sürelerin geçip geçmediğine bakılarak ölçülür. Nasıl kaydedilir: zarar görenin diğer tarafa bildirim yapması ve ediminin geri verilmesini ya da oransızlığın giderilmesini istemesi şeklinde kaydedilir.","desen":"Sınav genellikle sürelerin başlangıç anını karıştırır: düşüncesizlik/deneyimsizlikte öğrenme tarihi, zor durumda ise durumun ortadan kalktığı tarih esas alınır. Beş yıllık sürenin sözleşme tarihinden başladığı, öğrenmeden bağımsız olduğu unutulur. Bu soru m.28 hükmünün süre başlangıçları noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Edimler arası açık oransızlığın zarar görenin durumundan yararlanılarak yaratılması","ad":"Gabin","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Zarar görenin sözleşmeyle bağlı olmadığını diğer tarafa bildirme yetkisi","ad":"Bildirim hakkı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Öğrenme veya zor durumun ortadan kalkmasından başlayan hak düşürücü süre","ad":"Bir yıllık süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Sözleşme kuruluşundan başlayan azami hak düşürücü süre","ad":"Beş yıllık süre","kim":"kanun sabitler"}],"sinavda":"Soruda gabin sebebiyle bağlı olmadığını bildirme koşulları ve süreleri hakkındaki ifadelerden yanlış olanı seçmeniz istenir.","panel_ornek":"Arkadaşın, ikinci el bir bisikleti gerçek değerinin çok altına, parasal sıkıntısını fırsat bilen satıcıya kaptırmış. 3 ay sonra durumu fark edince satıcıya \u0027bu sözleşmeyle bağlı değilim\u0027 diyebiliyor; ama bunu en geç 1 yıl içinde, her halükarda sözleşme tarihinden 5 yıl içinde yapmalı.","ornek":"Arkadaşın, ikinci el bir bisikleti gerçek değerinin çok altına, parasal sıkıntısını fırsat bilen satıcıya kaptırmış. 3 ay sonra durumu fark edince satıcıya \u0027bu sözleşmeyle bağlı değilim\u0027 diyebiliyor; ama bunu en geç 1 yıl içinde, her halükarda sözleşme tarihinden 5 yıl içinde yapmalı.","yontemler":"Öğrenme tarihinden 1 yıl ile sözleşme tarihinden 5 yıl kuralını birbirine karıştırmamak en kritik noktadır.","nedir":"Gabin, karşılıklı edimler arasında açık oransızlık olan sözleşmelerde zarar görenin korunmasıdır. Sınav, bu hakkın hangi sürede ve kime karşı nasıl kullanılacağını ölçer."},"olay":"","tuzak":{"C":{"ad":"Süre Karıştırma Tuzağı","metin":"Bir yıllık süreyi zor durumun ortadan kalktığı tarihe göre kurmadığın için burada hatalı sanırsın. Doğrusu: madde bir yıllık süreyi düşüncesizlik veya deneyimsizliğin öğrenilmesine bağlar, ifade doğrudur."},"A":{"ad":"Oransızlık Tuzağı","metin":"Şartlardan birini eksik sayarak bu ifadeyi yanlış zannedersin. Doğrusu: madde metni edimler arası açık oransızlığı gabinin ilk unsuru olarak sayar, ifade doğrudur."},"D":{"ad":"Azami Süre Tuzağı","metin":"Bir yıllık süreyle beş yıllık süreyi aynı başlangıca bağlı sanıp ifadeyi yanlış işaretlersin. Doğrusu: beş yıllık süre her hâlde sözleşmenin kurulduğu tarihten işler, ifade doğrudur."},"B":{"ad":"Sebep Tuzağı","metin":"Bu üç halin (zor durum, düşüncesizlik, deneyimsizlik) sadece bir örnek olduğunu, gabin için şart olmadığını düşünürsün. Doğrusu: madde bu üç halden birinin varlığını ve bundan yararlanılmasını arar, ifade doğrudur."}},"celdiriciYol":{},"hap":"Gabinde zarar gören, sözleşmeyle bağlı olmadığını bildirip geri verme ile sözleşmeye bağlı kalıp oransızlığın giderilmesini isteme arasında seçimlik haktır.","teshis":{"C":{"gercek":"Bir yıllık süre düşüncesizlik veya deneyimsizliğin öğrenildiği tarihten işlemeye başlar.","ayirt":"Bu süre \u0027öğrenme\u0027 anına mı yoksa \u0027sözleşme\u0027 anına mı bağlanmış?","paragraf":"TBK m.28, f.2","yanilgi":"Bir yıllık sürenin başlangıcını sözleşme tarihiyle karıştırırsın."},"E":{"gercek":"TBK m.28, zarar görene durumun özelliğine göre iki seçenekten birini seçme (geri verme ya da oransızlığın giderilmesi) hakkını tanır.","ayirt":"Madde metninde \u0027ya... ya da...\u0027 bağlacı bir seçimlik hak mı kuruyor?","paragraf":"TBK m.28, f.1","yanilgi":"Kanunun zarar görene tek bir hak tanıdığını, seçimlik hak vermediğini sanırsın."},"A":{"gercek":"TBK m.28 açık oransızlığı gabinin ilk kurucu şartı olarak sayar.","ayirt":"Madde metninde \u0027açık bir oransızlık varsa\u0027 ifadesi bir koşul cümlesi mi?","paragraf":"TBK m.28, f.1","yanilgi":"Oransızlık şartını gabinin zorunlu unsuru değil, ihtimal olarak görürsün."},"D":{"gercek":"Beş yıllık süre bağımsız bir azami sınırdır ve her hâlde sözleşmenin kurulduğu tarihten başlar.","ayirt":"Beş yıllık süre öğrenmeye mi yoksa sözleşme tarihine mi bağlı?","paragraf":"TBK m.28, f.2","yanilgi":"Beş yıllık süreyi bir yıllık sürenin uzatılmış hali sanırsın, aynı olaya bağlarsın."},"B":{"gercek":"Madde bu hallerden birinin bulunmasını ve bundan yararlanılmasını gabin için şart koşar.","ayirt":"Bu üç halden biri olmadan salt oransızlık gabin sayılır mı?","paragraf":"TBK m.28, f.1","yanilgi":"Zor durum, düşüncesizlik, deneyimsizlik hallerinin örnek olduğunu, hepsinin aranmadığını düşünürsün."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 130"},"kural":"Doğrusu: Alacaklının temerrüdü hükümleri arasında borçluya sözleşmeden dönme ve zarar tazmini isteme hakkı düzenlenmemiştir; bu imkân borçlu temerrüdüne ait bir kurumdur ve alacaklı temerrüdü metninde yer almaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 130","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Madde başlığına bak: \u0027alacaklının temerrüdü\u0027 başlıklı hükümlerde dönme ve tazminat gibi borçlu temerrüdü kavramları aranmaz.","konu":"borçlu temerrüdü imkanlari","tablo":null,"siklar":{"C":"Tevdi yerinin ifa yerindeki hâkim tarafından belirlenmesini isteme","E":"Sözleşmeden dönerek uğradığı zararın tazminini isteme","A":"Teslim edeceği şeyi tevdi ederek borcundan kurtulma","D":"Tevdi sonucunda hasar ve giderlerin alacaklıya ait olmasından yararlanma","B":"Ticari malları hâkim kararı olmaksızın bir ardiyeye tevdi edebilme"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027na göre alacaklının temerrüde düşmesi durumunda borçluya tanınan imkânlardan biri aşağıdakilerden hangisi değildir?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-20","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.106, m.107","dogru":"E","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[],"anahtar":[{"ornek":"temerrüde","kok":"temerr"},{"ornek":"borçlu","kok":"borçlu"},{"ornek":"alacaklı","kok":"alacak"},{"ornek":"tazminat","kok":"tazmin"},{"ornek":"sözleşmeden","kok":"sözleş"},{"ornek":"isteme","kok":"isteme"}],"konuGiris":{"harita":"Ne zaman test edilir: alacaklı, borcun ifasını haklı sebep olmaksızın kabul etmediğinde. Nasıl ölçülür: borçluya tanınan hakların (tevdi, satma vb.) doğru sayılıp sayılmadığına bakılarak. Nasıl kaydedilir: madde numarası ve hak türü eşleştirilerek çözülür.","desen":"Soru genelde m.106-107\u0027deki gerçek imkânlar arasına, konuyla ilgisiz bir kavramı (örneğin muvazaa savunması, m.19) sıkıştırır. Tuzak, alacaklı temerrüdüyle ilgisiz genel borçlar hükümlerinin doğru şıkmış gibi sunulmasıdır. Bu soru p.106-107 metninden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Alacaklının haklı sebep olmadan edimi kabulden kaçınması hâli","ad":"Alacaklı temerrüdü","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Borçlunun şeyi hâkim belirlediği yere bırakarak borçtan kurtulması hakkı","ad":"Tevdi hakkı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Borçlunun malı satarak bedelini tevdi edebilmesi imkânı","ad":"Satma hakkı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Teslim edilecek şeyin bırakılacağı yer","ad":"Tevdi yeri","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Alacaklının temerrüde düşmesi hâlinde borçluya tanınmayan imkân sorulur.","panel_ornek":"Arkadaşın sana kiraladığın 3 kutu eşyayı teslim almak istemiyor, kapıda seni bekletiyor. Sen de eşyaları bir depoya bırakıp anahtarı ona teslim edebiliyorsun, böylece sorumluluktan kurtuluyorsun. İşte tevdi hakkı tam olarak bu durumu çözer.","ornek":"Arkadaşın sana kiraladığın 3 kutu eşyayı teslim almak istemiyor, kapıda seni bekletiyor. Sen de eşyaları bir depoya bırakıp anahtarı ona teslim edebiliyorsun, böylece sorumluluktan kurtuluyorsun. İşte tevdi hakkı tam olarak bu durumu çözer.","yontemler":"m.106-107\u0027deki gerçek hakları (tevdi, satma) ezberle, listede olmayan her kavramı yanlış şık olarak değerlendir.","nedir":"Bu konu, alacaklının borcu kabulden kaçınması hâlinde borçluya tanınan hukuki imkânları anlatır. Sınav, hangi seçeneğin gerçek bir borçlu imkânı olmadığını ayırt etmeni ölçer."},"olay":"","tuzak":{"C":{"ad":"Madde Karıştırma Tuzağı","metin":"öğrenci tevdi yerinin belirlenmesini borçlunun kendi takdirine bıraktığını düşünebilir. Doğrusu: madde 107 fıkra 1 uyarınca tevdi yerini ifa yerindeki hâkim belirler, bu da tanınan gerçek bir imkândır."},"A":{"ad":"Ne soruluyor","metin":"beş ifadeden hangisinin alacaklının temerrüdü hükümleri arasında yer almadığı soruluyor. Kural: Türk Borçlar Kanunu madde 107 uyarınca borçlu, teslim edeceği şeyi tevdi ederek borcundan kurtulabilir. Doğrusu: Bu bir gerçek imkândır, soru cevabı değildir."},"D":{"ad":"Sonuç Atlama Tuzağı","metin":"öğrenci hasar ve giderlerin yine borçluya ait kalacağını sanabilir. Doğrusu: madde 107 açıkça hasar ve giderlerin alacaklıya ait olacağını düzenler, bu borçluya tanınan gerçek bir yarardır."},"B":{"ad":"Kaynak Karıştırma Tuzağı","metin":"öğrenci tevdi hakkının yalnız hâkim kararıyla kullanılabileceğini sanıp bu şıkkı istisna zannedebilir. Doğrusu: madde 107 fıkra 2 uyarınca ticari mallar hâkim kararı olmadan da ardiyeye tevdi edilebilir, bu gerçek bir imkândır."}},"celdiriciYol":null,"hap":"Alacaklı temerrüde düşerse borçlu tevdi ile borcundan kurtulur; sözleşmeden dönüp tazminat isteme hakkı borçlu temerrüdüne özgüdür.","teshis":{"C":{"gercek":"Madde 107 fıkra 1\u0027e göre tevdi yerini ifa yerindeki hâkim belirler, bu borçluya değil hâkime tanınan bir yetkidir ama sonucu borçluyu koruyan bir imkândır.","ayirt":"Tevdi yerini kim belirliyor, borçlu mu hâkim mi?","paragraf":"m.107/1","yanilgi":"Sen tevdi yerinin borçlunun kendi seçimine bırakıldığını düşünüyorsun."},"E":{"gercek":"Sözleşmeden dönme ve olumsuz zarar talebi, borçlu temerrüdüne ilişkin bir kurumdur; alacaklının temerrüdü hükümleri arasında böyle bir hak düzenlenmemiştir.","ayirt":"Bu imkân hangi tarafın temerrüdüne bağlı olarak doğar, alacaklının mı borçlunun mu?","paragraf":"m.106-107 (karşılaştırma)","yanilgi":"Sen alacaklının temerrüdü ile borçlunun temerrüdü hükümlerinin aynı imkânları içerdiğini sanıyorsun."},"A":{"gercek":"Türk Borçlar Kanunu madde 107 fıkra 1, alacaklının temerrüdü halinde borçlunun tevdi ederek borcundan kurtulabileceğini açıkça düzenler.","ayirt":"Bu hüküm hangi maddenin başlığı altında yer alıyor, alacaklının mı borçlunun mu temerrüdü?","paragraf":"m.107/1","yanilgi":"Sen bu şıkkı seçtiysen tevdi hakkının alacaklı temerrüdüne özgü bir imkân olmadığını düşünüyorsun."},"D":{"gercek":"Madde 107, hasar ve giderlerin alacaklıya ait olacağını açıkça belirterek temerrüde düşen tarafa yükler.","ayirt":"Temerrüde giren kim ve hasar-gider yükü kime geçiyor?","paragraf":"m.107/1","yanilgi":"Sen alacaklı temerrüde düşse de hasar ve masrafların borçluda kalacağını sanıyorsun."},"B":{"gercek":"Madde 107 fıkra 2, ticari malların hâkim kararı olmadan da ardiyeye tevdi edilebileceğini istisna olarak düzenler.","ayirt":"Madde metninde \u0027bununla birlikte\u0027 ile başlayan istisna cümlesi hangi mal türüne özgü?","paragraf":"m.107/2","yanilgi":"Sen ticari malların ardiyeye tevdisinin hâkim kararına bağlı olduğunu sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 130"},"kural":"Madde 72\u0027nin ikinci fıkrası, tazminatın cezayı gerektiren bir fiilden doğması ve ceza kanununun daha uzun zamanaşımı öngörmesi hâlinde bu uzun sürenin uygulanacağını belirtir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 130","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 72\u0027de geçen \u0027iki yıl-on yıl\u0027 ile \u0027ceza zamanaşımı daha uzunsa uygulanır\u0027 kurallarını birbirine karıştırmamak için önce hangi sürenin sorulduğunu belirle.","konu":"haksız fiil ceza hukuku ilişkisi","tablo":{"satirlar":[["A) İki yıllık zamanaşımı süresi fiilin işlendiği, on yıllık…","m.72/1","YANLIŞ ifade"],["B) Tazminat, ceza kanunlarının daha uzun bir zamanaşımı öng…","m.72/2","doğru ifade"],["C) Haksız fiilden doğan tazminat istemi zamanaşımına uğramı…","m.72/3","YANLIŞ ifade"],["D) Ceza kanunundaki zamanaşımı süresi tazminat zamanaşımınd…","m.72/2","YANLIŞ ifade"],["E) Ceza kanunlarının öngördüğü uzun zamanaşımı, yalnızca fi…","m.72/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Haksız fiilden doğan tazminat istemi zamanaşımına uğramışsa zarar gören doğmuş olan borcu ifadan kaçınamaz.","E":"Ceza kanunlarının öngördüğü uzun zamanaşımı, yalnızca fiil için kamu davası açılmış olması koşuluyla tazminat istemine uygulanır.","A":"İki yıllık zamanaşımı süresi fiilin işlendiği, on yıllık süre ise zararın öğrenildiği tarihten başlar.","D":"Ceza kanunundaki zamanaşımı süresi tazminat zamanaşımından her hâlde kısa olacağından hiçbir durumda uygulama alanı bulmaz.","B":"Tazminat, ceza kanunlarının daha uzun bir zamanaşımı öngördüğü cezayı gerektiren bir fiilden doğmuşsa, bu uzun zamanaşımı uygulanır."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027na göre haksız fiilden doğan tazminat isteminin zamanaşımı ile ceza hukuku arasındaki ilişkiye dair aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-21","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.72","dogru":"B","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Kayseri\u0027de bir tekstil fabrikasının bakım işçisi Hasan, 3 Mart 2019\u0027da bakımını yapmadığı basınçlı kazanı patlatıyor; yan fabrikada çalışan Ayşe ağır yaralanıyor ve 40.000 TL tazminat hakkı doğuyor.","anlatim":"Ayşe zararı ve failini 3 Mart 2019\u0027da öğreniyor, fiil de aynı gün işleniyor. Hasan ayrıca \u0027taksirle yaralama\u0027 suçundan yargılanıyor ve ceza kanunu bu suç için 8 yıllık zamanaşımı öngörüyor. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu madde 72\u0027ye göre kısa süre öğrenmeden iki yıl, uzun süre fiilden on yıl işler; fiil cezayı gerektiriyorsa ve ceza zamanaşımı daha uzunsa o uygulanır. Ayşe\u0027nin 40.000 TL\u0027lik talebini bu üç kural ışığında beş ifadeyle test edeceğiz.","anlatim":"Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.72/1","karar":"yanlış","anlatim":"Ayşe zararı fiil gününde öğrendiği için burada fark görünmüyor ama kural tersten işler: iki yıl öğrenmeden, on yıl fiilden başlar. Bu ifade başlangıç noktalarını ters kurduğu için yanlış.","formul":"Şık A: biri sana \u0027iki yıl fiil tarihinden, on yıl öğrenme tarihinden başlar\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.72/2","karar":"doğru","anlatim":"Hasan\u0027ın fiili cezayı gerektiriyor ve ceza zamanaşımı (8 yıl) tazminatın iki yıllık süresinden uzun. Bu yüzden 8 yıllık süre tazminat istemine de uygulanır, ifade doğru.","formul":"Şık B: avukat \u0027Hasan\u0027ın cezası 8 yıl zamanaşımına tabi, o hâlde tazminat talebi de 8 yıl içinde açılabilir\u0027 diyor, haklı mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.72/3","karar":"yanlış","anlatim":"Zamanaşımı dolsa bile Ayşe\u0027nin kendisine düşen bir borcu varsa onu ifadan kaçınma hakkı saklı, bu Hasan\u0027ı değil Ayşe\u0027yi korur. İfade zarar göreni değil borçluyu koruyormuş gibi okunursa yanlış anlaşılır ama metindeki hâliyle zarar göreni bağladığını söylediği için yanlış.","formul":"Şık C: iki yıl geçmiş, Ayşe dava açmamış; Hasan \u0027artık bana borcun yok\u0027 diyor, Ayşe ödemeyi reddedebilir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.72/2","karar":"yanlış","anlatim":"Hasan\u0027ın olayında ceza süresi 8 yıl, tazminat süresinin iki yılından uzun çıktı; yani ceza süresi bazen daha uzun olabiliyor. \u0027Hiçbir durumda uygulanmaz\u0027 demek bu olayla çelişir, ifade yanlış.","formul":"Şık D: patron \u0027ceza süresi hukuk süresinden hep kısadır, hiç uygulanmaz\u0027 diyor, buna güvenir misin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.72/2","karar":"yanlış","anlatim":"Maddede kamu davası açılması gibi bir şart yok, sadece fiilin cezayı gerektirmesi ve sürenin uzun olması yeter. Ayşe dava açılmasa bile 8 yıllık süreden yararlanır, ifade yanlış.","formul":"Şık E: savcı \u0027Hasan hakkında kamu davası açılmadıkça 8 yıllık süre tazminata uygulanmaz\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Ayşe\u0027nin olayında tek doğru nokta, ceza zamanaşımının daha uzun olduğu fiillerde bu sürenin doğrudan tazminata da uygulanmasıdır. Kendine sor: fiil cezayı gerektiriyor mu ve ceza süresi tazminat süresinden uzun mu?","doldur":[]}],"anahtar":[{"ornek":"tazminat","kok":"tazmin"},{"ornek":"zamanaşımı","kok":"zamana"},{"ornek":"süresinden","kok":"süresi"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"uygulanır","kok":"uygula"},{"ornek":"gerektiriyorsa","kok":"gerekt"}],"konuGiris":{"harita":"Ne zaman test edilir: fiil hem haksız fiil hem de suç oluşturduğunda hangi zamanaşımının uygulanacağı sorulur. Nasıl ölçülür: Türk Borçlar Kanunu m.72\u0027deki genel süreler ile ceza kanunundaki süre karşılaştırılarak uzun olan seçilir. Nasıl kaydedilir: cevap seçeneğinde \u0027ceza kanunu daha uzun süre öngörüyorsa o süre uygulanır\u0027 ifadesi doğru kabul edilir.","desen":"Sınav genelde iki yıllık ve on yıllık sürelerin karıştırılmasını, ceza kanunundaki daha uzun sürenin göz ardı edilmesini hedefler. Tuzak, \u0027ceza davası açılmışsa borçlar hukuku süresi hep uzar\u0027 gibi genellemedir; oysa şart ceza kanunundaki sürenin daha uzun OLMASIDIR. Bu soru Türk Borçlar Kanunu m.72/2 fıkrası noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Zarar görenin zararı ve failini öğrendiği tarihten başlayan iki yıllık süre","ad":"Öğrenme zamanaşımı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Fiilin işlendiği tarihten başlayan on yıllık azami süre","ad":"Olay zamanaşımı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Fiil aynı zamanda suçsa ve cezası daha uzun süreye tabiyse o süre uygulanır","ad":"Ceza zamanaşımı istisnası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Zarar görenin, borç doğmuşsa zamanaşımına rağmen ifadan kaçınabilmesi","ad":"İfadan kaçınma hakkı","kim":"kanun sabitler"}],"sinavda":"Soruda haksız fiil-ceza ilişkisi verilir, zamanaşımı süresine dair doğru önermenin seçilmesi istenir.","panel_ornek":"Bir arkadaşın sana 3 yıl önce ödünç verdiği 50 lirayı istemesi normalde 2 yıl içinde zamanaşımına uğrar. Ama bu borç aynı zamanda bir suçtan doğmuşsa ve o suçun cezası daha uzun bir zamanaşımına tabiyse, uzun süre geçerli olur. Yani olayın arkasında ceza varsa, süre kısa kesilmez.","ornek":"Bir arkadaşın sana 3 yıl önce ödünç verdiği 50 lirayı istemesi normalde 2 yıl içinde zamanaşımına uğrar. Ama bu borç aynı zamanda bir suçtan doğmuşsa ve o suçun cezası daha uzun bir zamanaşımına tabiyse, uzun süre geçerli olur. Yani olayın arkasında ceza varsa, süre kısa kesilmez.","yontemler":"Önce olayın suç oluşturup oluşturmadığına bakılır, sonra ceza kanunundaki süre Türk Borçlar Kanunu m.72 süreleriyle karşılaştırılıp uzun olan uygulanır.","nedir":"Bu konu, haksız fiilden doğan tazminat isteminin ne zaman zamanaşımına uğrayacağını düzenler. Sınav, ceza kanunundaki daha uzun zamanaşımı süresinin borçlar hukukunu nasıl etkilediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Taraf Tuzağı","metin":"Zamanaşımının sonucunu zarar görenin aleyhine çevirmişsin. Doğrusu: tazminat istemi zamanaşımına uğramış olsa bile zarar gören, kendisi bakımından doğmuş olan borcu ifadan her zaman kaçınabilir."},"E":{"ad":"Kapsam Tuzağı","metin":"Maddede yer almayan bir koşulu (kamu davası açılmış olması) kurala eklemişsin. Doğrusu: uygulama, ceza kanununun o fiil için öngördüğü zamanaşımı süresinin daha uzun olmasına bağlıdır, davanın açılıp açılmamasına bağlı değildir."},"D":{"ad":"Kuralı Tersten Uygulama Tuzağı","metin":"İstisnayı yok sayıp genel kuralı mutlak sanmışsın. Doğrusu: ceza zamanaşımı daha uzunsa ve fiil cezayı gerektiriyorsa bu süre uygulanır, mutlak olarak dışlanmaz."},"A":{"ad":"Süre-Yön Tuzağı","metin":"İki yıllık ve on yıllık sürelerin başlangıç tarihlerini karşılıklı çevirip aklında tutmuşsun. Doğrusu: iki yıllık süre zararın ve yükümlünün öğrenildiği tarihten, on yıllık süre fiilin işlendiği tarihten başlar."}},"celdiriciYol":null,"hap":"Tazminat isteminde ceza kanununun öngördüğü zamanaşımı, tazminattan uzunsa ve fiil cezayı gerektiriyorsa uygulanır; zarar gören ise zamanaşımına uğrasa bile doğmuş borcunu ifadan her zaman kaçınabilir.","teshis":{"C":{"gercek":"Madde 72/3, zamanaşımı dolsa bile zarar görenin kendisi bakımından doğan borcu ifadan kaçınabileceğini özel olarak korur.","ayirt":"Bu hak kimin lehine, borçlunun mu zarar görenin mi?","paragraf":"TBK m.72/3","yanilgi":"Zamanaşımının her zaman borçluyu koruyan bir müessese olduğunu düşünüp zarar göreni de bağladığını sanıyorsun."},"E":{"gercek":"Madde metninde kamu davası açılması gibi bir şart yoktur, ölçüt yalnızca fiilin cezayı gerektirmesi ve öngörülen sürenin uzunluğudur.","ayirt":"Maddede \u0027kamu davası\u0027 veya \u0027kovuşturma\u0027 kelimesi geçiyor mu?","paragraf":"TBK m.72/2","yanilgi":"Kuralın uygulanmasını dava açılmış olmasına bağlı bir usul şartına bağladığını düşünüyorsun."},"A":{"gercek":"Madde 72/1\u0027e göre kısa (iki yıllık) süre öğrenme tarihinden, uzun (on yıllık) süre fiil tarihinden başlar.","ayirt":"Öğrenme her zaman fiilden sonra veya eş zamanlı olur mu, hangi süre bu gecikmeyi tolere eder?","paragraf":"TBK m.72/1","yanilgi":"İki sürenin başlangıç noktalarını ters ezberlediğin için kısa süreyi fiil tarihine, uzun süreyi öğrenme tarihine bağlıyorsun."},"D":{"gercek":"Madde 72/2 açıkça ceza zamanaşımının daha uzun olabileceği ve bu durumda uygulanacağı hâli düzenler.","ayirt":"\u0027Her hâlde\u0027 ifadesi maddede mi geçiyor yoksa şart cümlesi mi var?","paragraf":"TBK m.72/2","yanilgi":"Ceza sürelerinin hukuk sürelerinden hep kısa olacağını varsayıp istisnayı gözden çıkarıyorsun."},"B":{"gercek":"Madde 72/2, fiilin cezayı gerektirmesi ve ceza zamanaşımının daha uzun olması hâlinde bu sürenin doğrudan uygulanacağını düzenler.","ayirt":"Fiil cezayı gerektiriyor mu ve ceza zamanaşımı tazminat zamanaşımından uzun mu?","paragraf":"TBK m.72/2","yanilgi":"Bu kuralın istisna niteliğinde olduğunu, sadece ceza davası varsa uygulanacağını düşünerek şıkkı elersin."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 125"},"kural":"madde açıkça \u0027Bu hüküm, bir tüzel kişiliğin sona ermesi durumunda da uygulanır Borçlar Kanunu (6098 s.K.) m.43","dogru":"D","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Nesrin Hanım, bir teknoloji firmasının 15 yıllık genel müdürüdür ve şirket, 2023 yılında ana ortaklık bünyesine katılarak tüzel kişilik olarak infisah eder.","anlatim":"Nesrin Hanım, şirket kapandığına göre kendi temsil yetkisinin de kendiliğinden bittiğini düşünür. Şirketin muhasebecisi ise \u0027hayır, bu konuda ayrı bir kural yok, senin yetkinin bitip bitmediğine bakmalıyız\u0027 der.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.43\u0027e göre temsil yetkisi ölüm, gaiplik, fiil ehliyetinin kaybı, iflas ve tüzel kişiliğin sona ermesi hâllerinde biter; kişisel haklar saklıdır. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.43","karar":"doğru","anlatim":"Madde, temsilcinin iflasını da açıkça sayar; taraflar aksini kararlaştırmadıkça yetki biter. Bu ifade maddeyle birebir uyuşur, doğrudur.","formul":"Şık A: Nesrin Hanım\u0027ın yerine geçen temsilci iflas etse, bu onun temsil yetkisini bitirir mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.43","karar":"doğru","anlatim":"Madde, gaiplik kararını ölümle eşit ağırlıkta bir sona erme sebebi sayar. Bu ifade de maddeyle örtüşür, doğrudur.","formul":"Şık B: Şirketin temsil ettiği kişi hakkında mahkeme gaiplik kararı verse, temsil yetkisi bundan etkilenir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.43","karar":"doğru","anlatim":"Madde, fiil ehliyetinin kaybını ölüm ve iflasla birlikte sayar. Bu ifade doğru bir tespittir.","formul":"Şık C: Nesrin Hanım aniden fiil ehliyetini kaybetse, temsil yetkisi kendiliğinden sona erer mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.43","karar":"yanlış","anlatim":"Madde ikinci cümlesinde tam tersini söyler, tüzel kişiliğin sona ermesinde de aynı hüküm uygulanır. O yüzden \u0027uygulanmaz\u0027 diyen bu ifade yanlıştır.","formul":"Şık D: Muhasebeci, \u0027şirket tüzel kişilik olarak sona erdi ama madde buna uygulanmaz, Nesrin\u0027in yetkisi devam eder\u0027 diyor; buna katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.43","karar":"doğru","anlatim":"Madde son cümlesinde tarafların karşılıklı kişisel haklarının saklı olduğunu söyler. Yani bu ifade doğrudur, haklar düşmez.","formul":"Şık E: Yetki sona erdikten sonra Nesrin Hanım\u0027ın şirketten alacağı varsa bu hak da mı düşer?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Yanlış olan tek şık D\u0027dir çünkü madde tüzel kişiliğin sona ermesinde hükmün uygulanacağını açıkça söyler. Kendine hep şunu sor: madde tüzel kişilik cümlesinde \u0027uygulanır\u0027 mı diyor yoksa \u0027uygulanmaz\u0027 mı?","doldur":[]}],"anahtar":[{"ornek":"uygulanır","kok":"uygula"},{"ornek":"temsil","kok":"temsil"},{"ornek":"kişiliğin","kok":"kişili"},{"ornek":"ermesiyle","kok":"ermesi"},{"ornek":"cümlesinde","kok":"cümles"},{"ornek":"doğrudur","kok":"doğrud"}],"konuGiris":{"harita":"Ne zaman sona erer: taraflardan birinin ölümü, gaipliği, fiil ehliyetini kaybetmesi veya iflası anında. Nasıl ölçülür: kanunda sayılan sona erme sebeplerinin sınırlı listesiyle karşılaştırılarak. Nasıl kaydedilir: yetki belgesinin geri verilmesi sona erme sebebi değil, sona ermenin sonucu/kanıtı olarak ayrılır.","desen":"Soru, m.43\u0027te sayılan sınırlı sona erme sebeplerinden birini \u0027yanlış\u0027 şık olarak listeye ekletmeye çalışır. Tuzak, \u0027yetki belgesinin geri verilmesi\u0027nin kanundaki asıl sebep değil, ayrı bir husus olarak maddede yer almasıdır. Bu soru m.43\u0027ün sınırlı sayım yapısından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Bir kişinin başkası adına hukuki işlem yapabilme yetkisi","ad":"Temsil yetkisi","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin hukuki işlem yapma gücünü mahkeme kararıyla yitirmesi","ad":"Fiil ehliyetini kaybetme","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin uzun süre haber alınamaması sonucu ölmüş sayılması kararı","ad":"Gaiplik kararı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Sona ermiş yetkinin dış dünyaya kanıtlanmasına yarayan işlem, sona erme sebebi değildir","ad":"Yetki belgesinin geri verilmesi","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Soru, hukuki işlemden doğan temsil yetkisinin sona erme sebeplerini sıralar ve bunlardan hangisinin kanuna göre yanlış/olmayan bir sebep olduğunu sorar.","panel_ornek":"Arkadaşın senden 2 günlüğüne banka kartını verip \u0027benim yerime şu faturayı öde\u0027 diyor; ama o gece kaza geçirip ehliyetini kaybederse (temyiz kudretini yitirirse) bu yetkin de otomatik biter, kağıt üzerinde yazsa bile.","ornek":"Arkadaşın senden 2 günlüğüne banka kartını verip \u0027benim yerime şu faturayı öde\u0027 diyor; ama o gece kaza geçirip ehliyetini kaybederse (temyiz kudretini yitirirse) bu yetkin de otomatik biter, kağıt üzerinde yazsa bile.","yontemler":"Kanunun saydığı dört sebebi (ölüm, gaiplik, ehliyet kaybı, iflas) ezberleyip şıklarda bunların dışında kalanı ara. Tüzel kişiliğin sona ermesi de bu sebeplere eklenir, unutma.","nedir":"Temsil, bir kişinin başkası adına hukuki işlem yapma yetkisidir. Sınav bu yetkinin hangi hâllerde kendiliğinden sona erdiğini bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Ne soruluyor","metin":"hangi ifadenin Türk Borçlar Kanunu m.43\u0027e aykırı olduğu soruluyor. Kural: hukuki işlemden doğan temsil yetkisi, aksi kararlaştırılmadıkça, temsil olunanın veya temsilcinin ölümü, gaipliği, fiil ehliyetini kaybetmesi veya iflası hâlinde sona erer; bu hüküm tüzel kişiliğin sona ermesinde de uygulanır. Doğrusu: fiil ehliyetini kaybetme de bu sebepler arasındadır, dolayısıyla bu ifade doğrudur."},"E":{"ad":"Kişisel Hak Sıfırlama Tuzağı","metin":"Öğrenci temsil yetkisinin sona ermesinin tarafların birbirinden olan kişisel alacaklarını da ortadan kaldırdığını sanır. Doğrusu: madde \u0027tarafların karşılıklı kişisel hakları saklıdır\u0027 diyerek bu hakların etkilenmediğini belirtir."},"A":{"ad":"İflas Sebebini Sınırlama Tuzağı","metin":"Öğrenci iflasın yalnızca temsil olunan için sayıldığını, temsilcinin iflasının maddede geçmediğini sanır. Doğrusu: Türk Borçlar Kanunu m.43, temsilcinin de iflas etmesini sona erme sebebi sayar."},"B":{"ad":"Sayma Eksikliği Tuzağı","metin":"Öğrenci gaiplik kararının maddede geçen sınırlı sebepler arasında yer almadığını, yalnızca kıyasla uygulandığını sanır. Doğrusu: gaiplik kararı madde metninde açıkça sayılan bir sona erme sebebidir."}},"celdiriciYol":{},"hap":"Türk Borçlar Kanunu m.43\u0027e göre temsil yetkisi; ölüm, gaiplik, fiil ehliyetinin kaybı veya iflasla (temsil olunan ya da temsilci fark etmeksizin) ve tüzel kişiliğin sona ermesiyle de sona erer, ancak tarafların karşılıklı kişisel hakları saklıdır.","teshis":{"C":{"gercek":"Madde, fiil ehliyetini kaybetmeyi ölüm ve iflasla birlikte açıkça sayar.","ayirt":"Bu ifadeyi eleyecek olsam, elimde maddenin hangi cümlesi kalır?","paragraf":"TBK m.43","yanilgi":"Yalnızca ölümün temsil yetkisini sona erdirdiğini, fiil ehliyetinin kaybının bu sonucu doğurmadığını düşünüyorsun."},"E":{"gercek":"Madde son cümlesinde \u0027tarafların karşılıklı kişisel hakları saklıdır\u0027 diyerek bu hakların etkilenmediğini ayrıca vurgular.","ayirt":"Maddenin son cümlesi hangi hakların korunduğunu söylüyor?","paragraf":"TBK m.43","yanilgi":"Temsil yetkisinin sona ermesiyle tarafların birbirinden olan tüm kişisel haklarının da düştüğünü sanıyorsun."},"A":{"gercek":"Türk Borçlar Kanunu m.43, temsil olunan ile temsilciyi ayırmadan her ikisinin de iflasını sona erme sebebi sayar.","ayirt":"Madde metninde sebep, iki taraftan biri için mi yoksa yalnızca biri için mi yazılmış?","paragraf":"TBK m.43","yanilgi":"İflasın yalnızca temsil olunan açısından temsil yetkisini sona erdirdiğini, temsilcinin iflasının önemsiz olduğunu düşünüyorsun."},"D":{"gercek":"Madde açıkça \u0027Bu hüküm, bir tüzel kişiliğin sona ermesi durumunda da uygulanır\u0027 diyerek aynı sonucu tüzel kişilik için de öngörür; dolayısıyla \u0027uygulanmaz\u0027 diyen bu ifade yanlıştır.","ayirt":"Madde tüzel kişilik cümlesinde \u0027uygulanır\u0027 mı yoksa \u0027uygulanmaz\u0027 mı diyor?","paragraf":"TBK m.43","yanilgi":"Tüzel kişiliğin sona ermesini gerçek kişideki ölümden tamamen ayrı, kendine özgü bir rejime tabi sanıyorsun ve maddenin buraya uygulanmadığını düşünüyorsun."},"B":{"gercek":"Madde, ölüm ile gaiplik kararını yan yana ve eşit sonuçlu sebepler olarak sayar.","ayirt":"Madde metninde \u0027gaipliğine karar verilmesi\u0027 ayrı bir sebep olarak sayılmış mı?","paragraf":"TBK m.43","yanilgi":"Gaiplik kararının ölüm kadar ağır bir sonuç doğurmadığını, bu yüzden temsil yetkisini kendiliğinden sona erdirmediğini sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 128"},"kural":"Adam çalıştıran ödediği tazminat için çalışana ancak onun bizzat sorumlu olduğu ölçüde rücu edebilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 128","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Kanun metnindeki \u0027ancak … ölçüde\u0027 gibi sınırlayıcı ifadeleri şıklarda ara; sınırlama kaldırılmışsa o şık yanlıştır.","konu":"adam çalıştıranın sorumluluğu","tablo":{"satirlar":[["A) Adam çalıştıranın sorumluluğu, kusursuz sorumluluk halle…","m.66/1-2","doğru ifade"],["B) Adam çalıştıran, çalışanını seçerken, işiyle ilgili tali…","m.66/2","doğru ifade"],["C) Bir işletmede adam çalıştıran, işletmenin çalışma düzeni…","m.66/3","doğru ifade"],["D) Adam çalıştıran, ödediği tazminat için zarar veren çalış…","m.66/4","YANLIŞ ifade"],["E) Adam çalıştıranın sorumluluğunun doğabilmesi için, çalış…","m.66/1","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Bir işletmede adam çalıştıran, işletmenin çalışma düzeninin zararın doğmasını önlemeye elverişli olduğunu ispat etmedikçe, o işletmenin faaliyetleri dolayısıyla doğan zararı gidermekle yükümlüdür.","E":"Adam çalıştıranın sorumluluğunun doğabilmesi için, çalıştırılan kişi ile çalıştıran arasında bir bağımlılık ilişkisinin bulunması gerekir.","A":"Adam çalıştıranın sorumluluğu, kusursuz sorumluluk hallerinden biri olarak kabul edilir.","D":"Adam çalıştıran, ödediği tazminat için zarar veren çalışana, çalışanın kusuru bulunup bulunmadığına bakılmaksızın ödediği tutarın tamamı için rücu edebilir.","B":"Adam çalıştıran, çalışanını seçerken, işiyle ilgili talimat verirken, gözetim ve denetimde bulunurken zararın doğmasını engellemek için gerekli özeni gösterdiğini ispat ederse sorumluluktan kurtulur."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Adam çalıştıranın sorumluluğuna ilişkin aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-23","verilenler":[],"dayanak":"Türk Borçlar Kanunu m.66","dogru":"D","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Hızlı Kargo şirketinin sürücüsü Mehmet, dağıtım sırasında bir araca çarpıyor, mahkeme şirketi 60.000 TL tazminata mahkûm ediyor.","anlatim":"Şirket bu tazminatı ödüyor, sonra Mehmet\u0027e rücu etmek istiyor. Mahkeme Mehmet\u0027in kusurunun sadece %30 olduğunu tespit ediyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.66\u0027daki beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Şirketin sorumluluğu, kurtuluş kanıtı, işletme faaliyeti, rücu miktarı ve bağımlılık ilişkisi burada test edilecek. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.66/1-2","karar":"doğru","anlatim":"Şirket kendi kusurundan değil, Mehmet\u0027in fiilinden sorumlu tutuluyor; bu kusursuz sorumluluktur. Kurtuluş kanıtıyla sorumluluktan kurtulabilir.","formul":"Şık A: şirket \u0027biz Mehmet\u0027in kusuru yüzünden değil, kendi kusurumuz yüzünden mi sorumluyuz\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.66/2","karar":"doğru","anlatim":"Seçim, talimat ve gözetimdeki özenin ispatı kurtuluş kanıtıdır. Şirket bunu ispat ederse sorumlu olmaz.","formul":"Şık B: şirket \u0027biz Mehmet\u0027i işe alırken özenle seçtik, talimat verdik, denetledik\u0027 diyerek kurtulmaya çalışıyor, bu geçerli mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.66/3","karar":"doğru","anlatim":"İşletme faaliyetinden doğan zararda bireysel özen yetmez, çalışma düzeninin elverişliliği ispatlanmalı. Şirket bunu ispat etmedikçe sorumludur.","formul":"Şık C: Hızlı Kargo bir işletme olarak \u0027çalışma düzenimiz zararı önlemeye elverişliydi\u0027 demek zorunda mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.66/4","karar":"yanlış","anlatim":"Rücu hakkı çalışanın bizzat sorumlu olduğu ölçüyle sınırlıdır, yani %30 ile. Tamamı için rücu etmek kanuna aykırıdır.","formul":"Şık D: şirket \u0027Mehmet\u0027in kusuru %30 ama ödediğim 60.000 TL\u0027nin tamamı için rücu ederim\u0027 diyor, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.66/1","karar":"doğru","anlatim":"Sorumluluğun doğması için çalıştıran ile çalışan arasında bağımlılık ilişkisi şarttır. Mehmet şirketin talimatı altında çalıştığı için bu koşul var.","formul":"Şık E: Mehmet\u0027in şirketle bir bağımlılık ilişkisi olmasa da şirket sorumlu tutulabilir mi?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Yanlış olan tek ifade D, çünkü rücu kusur ölçüsüyle sınırlıdır, tamamı alınamaz. Kendine sor: rücu ettiğim tutar çalışanın kusur oranını aşıyor mu?","doldur":[]}],"anahtar":[{"ornek":"sorumlu","kok":"soruml"},{"ornek":"şirket","kok":"şirket"},{"ornek":"çalışana","kok":"çalışa"},{"ornek":"kurtuluş","kok":"kurtul"},{"ornek":"mehmet","kok":"mehmet"},{"ornek":"çalıştıran","kok":"çalışt"}],"konuGiris":{"harita":"Ne zaman uygulanır: çalışan, kendisine verilen işi yaparken başkasına zarar verdiğinde. Nasıl kurtulunur: adam çalıştıran seçim, talimat ve gözetimde gerekli özeni gösterdiğini ispat ederse sorumlu olmaz. Nasıl geri alınır: adam çalıştıran ödediği tazminatı ancak çalışanın bizzat kusurlu olduğu ölçüde ondan rücu ile geri alabilir.","desen":"Soru genelde \u0027kurtuluş kanıtı yoktur, adam çalıştıran her halükarda sorumludur\u0027 gibi yanlış ifadeyi doğru gösterir. Bir diğer tuzak, rücu hakkının sınırsız değil çalışanın bizzat sorumlu olduğu ölçüyle sınırlı olmasıdır. Bu soru m.66 fıkralarının karıştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Başkasını kendi işinde çalıştıran ve onun fiillerinden sorumlu olan kişi","ad":"Adam çalıştıran","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Seçim, talimat ve gözetimde özen gösterildiğinin ispatı; sorumluluğu kaldırır","ad":"Kurtuluş kanıtı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Çalışma düzeninin zararı önlemeye elverişli olduğu ispatlanmazsa doğan sorumluluk","ad":"İşletme sorumluluğu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ödenen tazminatın, çalışanın kusuru ölçüsünde ondan geri istenmesi hakkı","ad":"Rücu hakkı","kim":"kanun sabitler"}],"sinavda":"Adam çalıştıranın sorumluluğuna dair önermeler verilip yanlış olanın işaretlenmesi istenir.","panel_ornek":"Bir kuaförün çırağı, müşterinin saçını yanlış boyayıp elbisesini de lekelese, zarar gören hem çırağa hem dükkan sahibine gidebilir. Dükkan sahibi \u0027çırağı iyi eğittim, denetledim\u0027 diyip belgeleriyle kanıtlarsa sorumluluktan kurtulabilir.","ornek":"Bir kuaförün çırağı, müşterinin saçını yanlış boyayıp elbisesini de lekelese, zarar gören hem çırağa hem dükkan sahibine gidebilir. Dükkan sahibi \u0027çırağı iyi eğittim, denetledim\u0027 diyip belgeleriyle kanıtlarsa sorumluluktan kurtulabilir.","yontemler":"Her önermeyi m.66\u0027nın dört fıkrasıyla (giderim, kurtuluş kanıtı, işletme sorumluluğu, rücu) tek tek eşleştirip uymayanı bulun.","nedir":"Adam çalıştıranın sorumluluğu, çalışanın iş sırasında başkasına verdiği zarardan işverenin de sorumlu tutulmasını düzenler. Sınav, kurtuluş kanıtı ve rücu hakkının şartlarını bilip bilmediğinizi ölçer."},"olay":"Gerekmez, kural ihlali tespiti yeterlidir.","tuzak":{"C":{"ad":"İşletme Riski Tuzağı","metin":"Bu ifade işletme faaliyeti bakımından ayrı ve ağırlaştırılmış bir ispat yükü öngören fıkrayı doğru yansıtır, öğrenci bunu genel kurtuluş kanıtıyla karıştırabilir. Doğrusu: Bu ifade doğrudur."},"E":{"ad":"Bağımlılık İlişkisi Tuzağı","metin":"Öğrenci bağımlılık ilişkisinin şart olmadığını düşünebilir, oysa sorumluluğun doğması için çalıştıran ile çalışan arasında bir bağımlılık ilişkisi aranması doktrinde ve maddenin yorumunda kabul edilir. Doğrusu: Bu ifade doğrudur."},"A":{"ad":"Doğru İfade Tuzağı","metin":"Bu ifade Türk Borçlar Kanununun 66 ncı maddesinde düzenlenen adam çalıştıranın sorumluluğunun kurtuluş kanıtına bağlı bir kusursuz sorumluluk hali olduğu doktrinine uygundur. Doğrusu: Bu ifade doğrudur, sorunun yanıtı bu şık değildir."},"B":{"ad":"Kurtuluş Kanıtı Tuzağı","metin":"Öğrenci bu koşulun kanunda yer almadığını düşünüp yanlış işaretleyebilir; oysa madde metni seçme, talimat, gözetim-denetimde özen ispatını açıkça kurtuluş kanıtı sayar. Doğrusu: Bu ifade doğrudur."}},"celdiriciYol":null,"hap":"Adam çalıştıran, çalışana ancak onun bizzat sorumlu olduğu ölçüde rücu edebilir; kusursuz çalışana tam rücu yoktur.","teshis":{"C":{"gercek":"İşletme adam çalıştıranı için ayrı ve daha ağır bir ispat yükü vardır: çalışma düzeninin zararı önlemeye elverişli olduğunun ispatı gerekir.","ayirt":"Burada bireysel özeni mi yoksa işletmenin çalışma düzenini mi ispatlamam gerekiyor?","paragraf":"TBK m.66/3","yanilgi":"İşletme faaliyetlerinden doğan zararda da bireysel kurtuluş kanıtının yeterli olduğunu sanıyorsun."},"E":{"gercek":"Sorumluluğun doğabilmesi için çalıştıran ile çalışan arasında bir bağımlılık ilişkisinin bulunması aranır.","ayirt":"Zarar veren kişi gerçekten benim talimatım ve denetimim altında mıydı?","paragraf":"TBK m.66/1","yanilgi":"Sorumluluğun doğması için çalıştıran ile çalışan arasında hiçbir bağın aranmadığını, herkesin fiilinden sorumlu tutulacağını sanıyorsun."},"A":{"gercek":"Adam çalıştıranın sorumluluğu kurtuluş kanıtına bağlı bir kusursuz sorumluluk halidir; sorumluluk kendi kusurundan değil çalışanın fiilinden doğar.","ayirt":"Sorumluluktan kurtulmak için kendi kusursuzluğumu mu yoksa gerekli özeni gösterdiğimi mi ispatlıyorum?","paragraf":"TBK m.66/1-2","yanilgi":"Bu sorumluluğun kusur sorumluluğu olduğunu, adam çalıştıranın kendi kusuru nedeniyle sorumlu tutulduğunu sanıyorsun."},"D":{"gercek":"Kanun rücu hakkını çalışanın bizzat sorumlu olduğu ölçüyle sınırlar; kusursuz çalışana tam rücu mümkün değildir.","ayirt":"Çalışanın kendi kusurunun ölçüsü neydi, rücu bu ölçüyü aşıyor mu?","paragraf":"TBK m.66/4","yanilgi":"Adam çalıştıranın ödediği tazminatın tamamını, çalışanın kusuru olmasa bile geri alabileceğini sanıyorsun."},"B":{"gercek":"Madde, seçme, talimat verme ve gözetim-denetimdeki özenin birlikte ispatını kurtuluş kanıtı olarak sayar.","ayirt":"Üç unsurun (seçim, talimat, gözetim) hepsini birden mi ispatlamam gerekiyor?","paragraf":"TBK m.66/2","yanilgi":"Kurtuluş kanıtının yalnızca çalışan seçiminde geçerli olduğunu, talimat ve gözetimin ayrı bir koşul olmadığını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 129"},"kural":"Türk Borçlar Kanununun 50 inci maddesine göre zarar gören, hem zararını hem de zarar verenin kusurunu ispatla yükümlüdür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 129","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İspat yükü sorularında önce \u0027kim ispat eder\u0027 sorusuna, sonra \u0027miktar ispa Borçlar Kanununun 50 inci maddesine göre kim neyi ispat edecek, Ahmet\u0027in davasında beş ifadeyi tek tek deneyeceğiz.","anlatim":"Kural şu: zarar gören hem zararını hem karşı tarafın kusurunu kanıtlamak zorunda. Miktar tam belli olmazsa hâkim hakkaniyetle karar verir.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.50/1","karar":"doğru","anlatim":"Evet, kanun bu ikili yükü doğrudan zarar görene, yani Ahmet\u0027e verir. Başka türlü dava kazanılamaz.","formul":"Şık A: Ahmet hem 3.000 TL\u0027lik zararını hem de Kemal\u0027in rafı kötü bağladığını mahkemede kanıtlamak zorunda mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.50/1","karar":"yanlış","anlatim":"Hayır, bu ters ispat yükü adam çalıştıran gibi kusursuz sorumluluk hallerine özgü. Ahmet\u0027in davası genel haksız fiil, orada ispat yükü Kemal\u0027de değil Ahmet\u0027te.","formul":"Şık B: Kemal \u0027ben kusursuzluğumu ispat edemedim\u0027 derse otomatik sorumlu sayılır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.50/2","karar":"yanlış","anlatim":"Hayır, hâkim olayların olağan akışına ve Ahmet\u0027in aldığı önlemlere bakarak miktarı hakkaniyetle belirler. Dava bu yüzden reddedilmez.","formul":"Şık C: Ahmet zararının tam olarak 3.000 TL mi 2.800 TL mi olduğunu net kanıtlayamazsa davası reddedilir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.50/2","karar":"yanlış","anlatim":"Hayır, madde 50 miktar belirlemede olayların olağan akışını ve Ahmet\u0027in aldığı önlemleri esas alır. Kusurun ağırlığı tazminatın indirilmesinde ayrı bir konudur.","formul":"Şık D: Hâkim zarar miktarını belirlerken sadece Kemal\u0027in kusurunun ağırlığına mı bakar?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.50/1","karar":"yanlış","anlatim":"Hayır, kanun ikisini birlikte ister. Zararı ispatlaması tek başına yetmez, Kemal\u0027in kusurunu da göstermeli.","formul":"Şık E: Ahmet yalnızca 3.000 TL\u0027lik zararını ispat etse, Kemal\u0027in kusurunu göstermek zorunda değil mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Ahmet\u0027in davasında ispat yükü hem zarar hem kusur olarak tamamen ona ait, kanun bunu ikiye bölmez. Kendine sor: burada zarar gören mi yükümlü, yoksa zarar veren mi kendini temize çıkarmalı?","doldur":[]}],"anahtar":[{"ornek":"kusurunu","kok":"kusuru"},{"ornek":"miktar","kok":"miktar"},{"ornek":"ispatla","kok":"ispatl"},{"ornek":"zararını","kok":"zararı"},{"ornek":"belirler","kok":"belirl"},{"ornek":"yükümlüdür","kok":"yüküml"}],"konuGiris":{"harita":"Ne zaman test edilir: zarar gören tazminat isterken kimin neyi ispatlayacağı sorulduğunda. Nasıl ölçülür: kanun metnindeki ispat yükü dağılımı ve hakimin takdir yetkisi bilgisiyle. Nasıl kaydedilir: hükme esas alınan tutar, hakimin hakkaniyete uygun belirlemesiyle kayda geçer.","desen":"Sınav genelde \u0027kusuru kim ispatlar\u0027 sorusunu zarar veren lehine çevirerek tuzak kurar; doğrusu zarar görenin hem zararı hem kusuru ispatlamasıdır. Bir diğer tuzak, miktar ispatlanamazsa davanın reddedileceği yönündeki yanlış seçenektir; oysa hakim hakkaniyete göre belirler. Bu soru m.50\u0027nin ispat yükü ve hakimin takdir yetkisi hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"iddia edilen olguyu mahkemede kanıtlama yükümlülüğü","ad":"ispat yükü","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"zarar görenin hem zararı hem karşı tarafın kusurunu kanıtlaması gerekliliği","ad":"zarar görenin kusuru ispat yükü","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"miktar tam ispatlanamazsa hakimin makul biçimde zarar tutarını tayin etmesi","ad":"hakkaniyete uygun belirleme","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"hakimin tutar belirlerken dikkate aldığı hayatın normal seyri ölçütü","ad":"olayların olağan akışı","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda haksız fiil zararının ispatına ilişkin bir kural sorulur ve doğru kanun hükmünün seçilmesi istenir.","panel_ornek":"Arkadaşın sana borç verdiğini iddia ediyor ama elinde imza yok; bu durumda \u0027verdim\u0027 diyen arkadaşın bunu kanıtlaması gerekir, sen \u0027almadım\u0027 demek zorunda değilsin. Aynı mantıkla bir zarar iddiasında da iddia eden taraf ispatla yükümlüdür. Tutarı tam gösteremezse hakim, mantıklı bir tahminle 3 lira yerine 2 lira gibi makul bir miktara hükmedebilir.","ornek":"Arkadaşın sana borç verdiğini iddia ediyor ama elinde imza yok; bu durumda \u0027verdim\u0027 diyen arkadaşın bunu kanıtlaması gerekir, sen \u0027almadım\u0027 demek zorunda değilsin. Aynı mantıkla bir zarar iddiasında da iddia eden taraf ispatla yükümlüdür. Tutarı tam gösteremezse hakim, mantıklı bir tahminle 3 lira yerine 2 lira gibi makul bir miktara hükmedebilir.","yontemler":"Metni ezberlemek yerine \u0027kim iddia ediyorsa o ispatlar\u0027 ilkesini ve miktar belirsizse hakimin devreye girdiğini kavramak yeterlidir.","nedir":"Haksız fiil ispat yükü, zarar ve kusurun mahkemede kim tarafından kanıtlanacağını belirleyen kuraldır. Sınav, zarar görenin mi yoksa zarar verenin mi ispat yükümlüsü olduğunu ve miktar belirsizse hâkimin ne yapacağını ölçer."},"olay":"","tuzak":{"C":{"ad":"Dava Reddi Tuzağı","metin":"öğrenci miktarın tam ispat edilememesini davanın reddi sonucuna bağlıyor. Doğrusu: kanun bu durumda davayı reddetmez, hâkimin olayların olağan akışı ve zarar görenin aldığı önlemlere göre miktarı hakkaniyete uygun belirlemesini öngörür."},"E":{"ad":"Eksik İspat Tuzağı","metin":"öğrenci ispat yükünü yalnızca zarar miktarıyla sınırlı sanıyor, kusur ispatını dışarıda bırakıyor. Doğrusu: kanun ikisini birlikte, zarar görenin ispat yükü olarak sayar."},"D":{"ad":"Ölçüt Karıştırma Tuzağı","metin":"öğrenci hâkimin taktirini yalnızca kusurun ağırlığına dayandırdığını sanıyor, bu ölçüt tazminatın indirilmesine ilişkin ayrı bir hükme aittir. Doğrusu: miktar belirlemesinde ölçüt, olayların olağan akışı ve zarar görenin aldığı önlemlerdir."},"B":{"ad":"Ters Sorumluluk Tuzağı","metin":"öğrenci bunu kusursuz sorumluluk haller r","adimlar":[{"formul":"Olay: Ahmet, arkadaşı Mehmet\u0027e 15 Mart 2023\u0027te noterde resmi senetle 200.000 TL borç verdi, tapuda ipotek de kurdular.","anlatim":"Aradan bir yıl geçti, Mehmet parayı ödedi ödemedi derken Ahmet ona \u0027senin bu borcunu bağışlıyorum, sildim\u0027 dedi, hem de sözlü olarak kahvede.","doldur":[]},{"formul":"Ne yapacağız: borç doğarken resmi şekil şartı vardı ama Türk Borçlar Kanunu m.132 ibra sözleşmesini şekle bağlı olmaksızın yapabilirsin der, şimdi beş ifadeyi bu olayda tek tek deneyelim.","anlatim":"Kural tek: borcu doğuran işlem hangi şekle bağlı olursa olsun, ibra şekilsizdir.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.132","karar":"doğru","anlatim":"Olayda borç resmi senetle doğmuştu ama ibra hiçbir şekle bağlı değil. m.132 açıkça \u0027kanunen şekle bağlı olsa bile şekilsiz ibra olur\u0027 diyor.","formul":"Şık A: Ahmet\u0027in kahvede sözlü söylediği \u0027seni ibra ediyorum\u0027 sözü, resmi senet olmadan geçerli mi, sen ne dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.132","karar":"yanlış","anlatim":"Bu mantık şekil paralelliği kuralını ibraya da uygulamak ister ama kanun burada istisna getirmiş. Ahmet\u0027in sözlü ibrası, resmi senede rağmen geçerli kalır.","formul":"Şık B: Mehmet\u0027in avukatı \u0027borç noterde kurulmuştu, ibra da noterde yapılmalı\u0027 diyor, buna katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.132","karar":"yanlış","anlatim":"Hayır, kanun yazılı şekil de aramaz. Kahvedeki sözlü ibra tek başına yeterlidir.","formul":"Şık C: Ahmet\u0027e \u0027bari bir kağıda yaz imzala\u0027 desek, yazılı olmazsa ibra geçersiz mi olur?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.132","karar":"yanlış","anlatim":"Hayır, ipotek borcun teminatıdır ama ibra ayrı bir kurumdur ve resmi şekil aranmaz. Ahmet\u0027in kahvedeki sözü ipoteğe rağmen borcu bitirir.","formul":"Şık D: Belki resmi şekil şart, tıpkı ipoteğin tapuda kurulması gibi ibra da tapuda mı yapılmalı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.132","karar":"yanlış","anlatim":"Hayır, ibra yenileme değildir; yeni sözleşme gerekmez, tek taraflı feragat yeter. Ahmet\u0027in sözü borcu anında sona erdirir.","formul":"Şık E: Mehmet \u0027ama biz yeni bir sözleşme yapmadık, borç hâlâ duruyor\u0027 diyebilir mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Borç ne kadar ağır şekle bağlı olursa olsun ibra hep şekilsizdir; kendine hep şunu sor: burada borç mu doğuyor, yoksa borç mu sona eriyor?","doldur":[]}],"anahtar":[{"ornek":"doğuran","kok":"doğura"},{"ornek":"olursa","kok":"olursa"},{"ornek":"şekilsizdir","kok":"şekils"},{"ornek":"kahvede","kok":"kahved"},{"ornek":"sözleşmesi","kok":"sözleş"},{"ornek":"burada","kok":"burada"}],"konuGiris":{"harita":"Ne zaman test edilir: borcu doğuran işlemin şekle bağlı olduğu durumlarda ibra sözleşmesinin şekli sorulduğunda. Nasıl ölçülür: Türk Borçlar Kanunu m.132\u0027nin şekil serbestisi kuralının bilinmesiyle. Nasıl kaydedilir: ayrıca bir kayıt aranmaz, kural doğrudan uygulanır.","desen":"Sınav burada öğrenciyi \u0027asıl işlem şekle bağlıysa ibra da aynı şekle bağlıdır\u0027 yanılgısına düşürmeye çalışır. Doğru cevap tam tersini söyler: ibra şekilden bağımsızdır. Bu soru Türk Borçlar Kanunu m.132 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"alacaklının borçluyu borçtan kısmen veya tamamen kurtardığı anlaşma","ad":"ibra sözleşmesi","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"soruda verilir","tanim":"borcu doğuran işlemin kanunen veya iradeyle belirli bir biçimde yapılma zorunluluğu","ad":"şekle bağlılık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"ibra sözleşmesinin herhangi bir şekle bağlı olmaksızın geçerli olması kuralı","ad":"şekil serbestisi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"ibra ile borcun tamamen veya kısmen ortadan kalkması sonucu","ad":"borcun sona ermesi","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Soru, borcu doğuran işlemin şekle bağlı olduğu bir durumda ibra sözleşmesinin hangi şekilde yapılacağını sorar.","panel_ornek":"Arkadaşın sana borçlu olduğu 50 lirayı sözlü olarak \u0027artık ödeme, sildim\u0027 dediğinde borç biter; kağıda yazıp imzalatmana gerek yoktur. Borcu doğuran senet noterden yapılmış olsa bile, borcu affetmek için aynı şekle uymak zorunda değilsin.","ornek":"Arkadaşın sana borçlu olduğu 50 lirayı sözlü olarak \u0027artık ödeme, sildim\u0027 dediğinde borç biter; kağıda yazıp imzalatmana gerek yoktur. Borcu doğuran senet noterden yapılmış olsa bile, borcu affetmek için aynı şekle uymak zorunda değilsin.","yontemler":"Kanun metnini birebir hatırlamak yeterlidir; şekle bağlı işlem-ibra ayrımını karıştırmamak kritik noktadır.","nedir":"İbra, alacaklının borçluyu borçtan tamamen veya kısmen kurtardığı bir sözleşmedir. Sınav bu işlemin hangi şekle tabi olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Belge Zorunluluğu Tuzağı","metin":"Öğrenci, borcun sona erdirilmesinin ispat kolaylığı için yazılı olması gerektiğini borç haline getirir. Doğrusu: Kanun yazılı şekil aramaz, ispat meselesi şekil şartından ayrıdır."},"E":{"ad":"Yenileme ile Karıştırma Tuzağı","metin":"Öğrenci ibra kurumunu, borcun yeni bir sözleşmeyle değiştirilmesini gerektiren yenileme kurumuyla karıştırır. Doğrusu: İbra tek taraflı feragate dayanan ayrı bir sözleşme türüdür, yenileme değildir."},"D":{"ad":"Kapsam Genişletme Tuzağı","metin":"Öğrenci, taşınmaz gibi resmi şekle tabi işlemlerdeki genel ilkeyi ibraya da taşır. Doğrusu: Madde 132 açıkça şekilden bağımsızlığı düzenlediği için resmi şekil aranmaz."},"B":{"ad":"Şekil Paralelliği Tuzağı","metin":"Öğrenci, borcu doğuran işlem hangi şekle bağlıysa onu ortadan kaldıran işlemin de aynı şekle tabi olması gerektiğini düşünür. Doğrusu: Kanun burada şekil paralelliği ilkesine açık istisna getirmiştir, ibra şekilsizdir."}},"celdiriciYol":{},"hap":"Borcu doğuran işlem hangi şekle bağlı olursa olsun, ibra sözleşmesi şekle bağlı olmaksızın yapılabilir.","teshis":{"C":{"gercek":"Kanun ibra için herhangi bir yazılı şekil şartı öngörmemiştir, sözlü ibra da geçerlidir.","ayirt":"Madde metninde yazılı şekil şartına dair bir ibare var mı?","paragraf":"m.132","yanilgi":"İspat kolaylığı ile geçerlilik şartını birbirine karıştırıp yazılılığı zorunlu sayıyorsun."},"E":{"gercek":"İbra, alacaklının tek taraflı feragat iradesiyle borcu sona erdirdiği ayrı bir kurumdur; yenileme farklı maddede düzenlenir.","ayirt":"Bu işlemde yeni bir borç doğuyor mu, yoksa mevcut borç mu sona eriyor?","paragraf":"m.132","yanilgi":"İbrayı, borcun yeni bir sözleşmeyle değiştirilmesi gereken yenileme kurumuyla aynı sanıyorsun."},"A":{"gercek":"Türk Borçlar Kanununun 132 nci maddesi, borcu doğuran işlem şekle bağlı olsa bile ibranın şekle bağlı olmaksızın yapılabileceğini açıkça düzenler.","ayirt":"Kanun burada şekil paralelliğine istisna mı getirmiş?","paragraf":"m.132","yanilgi":"Bu şıkkı eleyen öğrenci, şekle bağlı borçların ancak aynı şekilde sona erdirilebileceğini sanır."},"D":{"gercek":"Madde 132, borcu doğuran işlem resmi şekle bağlı olsa dahi ibranın şekilsiz yapılabileceğini söyler.","ayirt":"Resmi şekil şartı hangi işlemler için, ibra bu kapsamda mı?","paragraf":"m.132","yanilgi":"Taşınmaz işlemlerindeki resmi şekil zorunluluğunu genel bir kural sanıp ibraya uyguluyorsun."},"B":{"gercek":"Madde 132 şekil paralelliği ilkesinden ayrılarak ibrayı şekilsiz bırakmıştır.","ayirt":"Kanun metninde \u0027şekle bağlı olmaksızın\u0027 ifadesi hangi işlem için kullanılıyor?","paragraf":"m.132","yanilgi":"İbrayı, borcu doğuran işlemin aynısını tersten yapmak sanıyorsun, bu yüzden aynı şekli arıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 128"},"kural":"Türk Borçlar Kanununun 63 üncü maddesi rıza, üstün yarar, haklı savunma, hakkın kendi gücüyle korunması ve zorunluluk hallerini sayar; kusurun bulunmaması bu sayımda yer almaz, kusur ayrı ve bağımsız bir sorumluluk unsurudur.","olcum":{"pencere":7,"hesapKod":0,"capa":
