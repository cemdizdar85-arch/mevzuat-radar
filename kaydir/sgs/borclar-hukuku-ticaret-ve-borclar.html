el kanunda öngörülen özel sorumluluk hükümleri saklıdır ve öncelikle uygulanır.","E":"Tehlike sorumluluğunun doğması için zarar görenin işletmenin kusurunu ispat etmesi gerekir.","A":"İşletme sahibi, işlerinde uzman bir kişiden beklenen özeni gösterdiğini ispat ederek sorumluluktan kurtulabilir.","D":"İşletme sahibi tek başına sorumludur; işleten varsa ayrıca sorumlu tutulamaz.","B":"Faaliyete hukuk düzenince izin verilmiş olması, zarar görenin uygun bir bedelle denkleştirme istemesini engeller."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanununun 71 inci maddesinde düzenlenen tehlike sorumluluğuna ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-17","verilenler":[{"deger":"71","anlam":"Tehlike sorumluluğu hükümlerinin yer aldığı kanun maddesinin sıra numarası; sorulan hukuki konunun kaynağını gösterir.","ad":"Türk Borçlar Kanunu madde numarası"}],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.71","dogru":"C","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Bir kimya fabrikası, 2019 yılında ürettiği gübrede kullanılan amonyak deposundan sızıntı yaşar; komşu 40 dönümlük tarlanın ürünü zarar görür, tazminat davası açılır.","anlatim":"Bu fabrika \"önemli ölçüde tehlike arz eden işletme\" sayılır, çünkü uzman özeni gösterse bile sıkça ağır zarar verme ihtimali vardır. Dava sırasında beş farklı iddia ortaya atılır.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.71\u0027e göre işletme sahibi ve varsa işleten müteselsilen sorumludur, kurtuluş kanıtı yoktur, özel kanun hükümleri saklıdır ve hukuka uygun faaliyette bile denkleştirme istenebilir.","anlatim":"Bu kuralı fabrika olayındaki beş iddiaya tek tek uygulayacağız. A\u0027dan E\u0027ye sırayla bakalım.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.71/2","karar":"yanlış","anlatim":"Hayır, madde metni açıkça \"uzman özeni gösterilse bile\" zarar doğması hâlini tehlike sorumluluğunun tanımı sayar. Yani özen ispatı burada kurtuluş kanıtı değildir, tam tersine sorumluluğun varlığını gösterir.","formul":"Şık A: Fabrika avukatı \"biz uzman mühendislerle azami özeni gösterdik, bu yüzden sorumlu değiliz\" diyor, bu savunma seni kurtarır mı?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.71/son","karar":"yanlış","anlatim":"Hayır, madde son fıkrada hukuka uygun izinli faaliyetten doğan zararda bile zarar görenin uygun bedelle denkleştirme isteyebileceğini söyler. İzin sorumluluğu kaldırmaz, sadece denkleştirmeye çevirir.","formul":"Şık B: Fabrikanın valilikten usulüne uygun faaliyet izni olduğu ispatlanıyor, bu izin komşu çiftçinin denkleştirme istemesini engeller mi?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.71/3","karar":"doğru","anlatim":"Evet, madde açıkça belirli bir tehlike hâli için öngörülen özel sorumluluk hükümlerinin saklı olduğunu belirtir. Özel kanun varsa genel hükme göre öncelenir.","formul":"Şık C: Çiftçinin avukatı, tarım zararları için ayrı bir özel kanunda tehlike sorumluluğu hükmü bulunduğunu, bunun m.71\u0027e göre öncelikle uygulanması gerektiğini savunuyor, haklı mı?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.71/1","karar":"yanlış","anlatim":"Hayır, madde işletme sahibi ve varsa işleteni birlikte, müteselsilen sorumlu tutar. İkisi de aynı anda dava edilebilir.","formul":"Şık D: Fabrikayı kiralayıp işleten ayrı bir şirket varsa, sadece bina sahibi mi sorumlu tutulur, işleten şirket sorumluluktan muaf mı kalır?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.71/1-2","karar":"yanlış","anlatim":"Hayır, tehlike sorumluluğu kusursuz sorumluluktur; ispatlanması gereken işletmenin tehlikeli niteliği ile zarar arasındaki bağdır, kusur değil.","formul":"Şık E: Çiftçinin, davayı kazanmak için fabrikanın kusurlu davrandığını ayrıca kanıtlaması mı gerekir?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Fabrika olayı gösteriyor ki tehlike sorumluluğunda kurtuluş kanıtı yok, izin denkleştirmeyi engellemiyor, sahip-işleten birlikte sorumlu ve kusur ispatı aranmıyor; tek istisna özel kanun önceliği. Kendine sor: bu olayda özel bir kanunun ayrı tehlike sorumluluğu hükmü var mı, varsa hangisi öncelenir?","doldur":[]}],"anahtar":[{"ornek":"sorumluluğunda","kok":"soruml"},{"ornek":"tehlike","kok":"tehlik"},{"ornek":"gösterdiğini","kok":"göster"},{"ornek":"denkleştirme","kok":"denkle"},{"ornek":"kurtulamaz","kok":"kurtul"},{"ornek":"hükümleri","kok":"hüküml"}],"konuGiris":{"harita":"Ne zaman uygulanır: işletmenin mahiyeti ya da kullanılan araç/malzeme nedeniyle tam özen gösterilse bile sık veya ağır zarar doğurmaya elverişli olduğu anlaşıldığında. Kim sorumludur: işletme sahibi ve varsa işleten müteselsilen sorumlu tutulur. İzin verilmiş faaliyette ne olur: hukuka uygun izinli faaliyet olsa bile zarar görenler uygun bedelle denkleştirme isteyebilir.","desen":"Sınav genelde \u0027kusur aranır mı\u0027, \u0027sadece işletme sahibi mi sorumlu\u0027 gibi yanlış öncülleri doğru gibi sunar. Tuzak, hukuka uygun izinli faaliyette bile tazminat istenebileceğinin unutulmasıdır, m.71/son fıkra. Bu soru madde metninin tüm fıkralarının tek tek taranması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"tam özen gösterilse bile sık ya da ağır zarara elverişli işletme","ad":"önemli ölçüde tehlike arz eden işletme","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işletme sahibi ve işletenin zarardan birlikte ve ayrı ayrı tamamından sorumlu olması","ad":"müteselsil sorumluluk","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"başka kanunlarda öngörülen özel sorumluluk kurallarının saklı tutulması","ad":"özel tehlike sorumluluğu hükümleri","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"izinli tehlikeli faaliyetin zararı için istenebilecek uygun tazminat","ad":"denkleştirme bedeli","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Madde 71\u0027in içeriğine göre doğru/yanlış öncülleri ayırt etmeniz istenir.","panel_ornek":"Bir havai fişek fabrikası düşün; en dikkatli işçi bile çalışsa ayda 2 kez patlama riski var. Fabrika sahibi ve varsa işleten, komşu eve zarar verirse ikisi birlikte 10.000 lira tazminattan sorumlu olur. Yani özenli olmak seni kurtarmaz, işin doğası tehlikeliyse sorumluluk yine sende.","ornek":"Bir havai fişek fabrikası düşün; en dikkatli işçi bile çalışsa ayda 2 kez patlama riski var. Fabrika sahibi ve varsa işleten, komşu eve zarar verirse ikisi birlikte 10.000 lira tazminattan sorumlu olur. Yani özenli olmak seni kurtarmaz, işin doğası tehlikeliyse sorumluluk yine sende.","yontemler":"Madde metnini fıkra fıkra okuyup her fıkranın ayrı bir doğru/yanlış önermeye dönüştüğünü bilin; \u0027izin verilmiş olsa bile\u0027 ifadesini özellikle işaretleyin.","nedir":"Tehlike sorumluluğu, önemli ölçüde tehlike arz eden işletmelerin kusur aranmadan zarardan sorumlu tutulmasıdır. Sınav bu sorumluluğun kimlere ait olduğunu ve şartlarını ölçer."},"olay":"","tuzak":{"D":{"ad":"Taraf Tuzağı","metin":"Sorumluluğun yalnız işletme sahibine ait, işletenin ayrı bir sıfat olmadığını düşünürsün. Doğrusu: Madde, işletme sahibi ile varsa işleteni müteselsilen sorumlu tutar."},"E":{"ad":"İspat Yükü Tuzağı","metin":"Tehlike sorumluluğunu kusur sorumluluğuyla karıştırıp davacının kusur ispatlaması gerektiğini sanırsın. Doğrusu: Bu sorumluluk kusursuzdur, ispat konusu işletmenin niteliği ve zarar-nedensellik bağıdır."},"A":{"ad":"Kurtuluş Kanıtı Tuzağı","metin":"Adam çalıştıran ya da ana-baba sorumluluğundaki gibi özen ispatıyla kurtulunabileceğini düşünürsün. Doğrusu: Tehlike sorumluluğu sebep sorumluluğudur, madde metninde kurtuluş kanıtı öngörülmemiştir."},"B":{"ad":"Hukuka Uygunluk Tuzağı","metin":"İzinli faaliyette hiçbir talep ileri sürülemeyeceğini sanırsın. Doğrusu: Madde, izin verilmiş faaliyette dahi zarar görenin denkleştirme isteyebileceğini açıkça düzenler."}},"celdiriciYol":{},"hap":"Tehlike sorumluluğunda işletme sahibi özen gösterdiğini ispatlayarak sorumluluktan kurtulamaz; yalnız özel kanun hükümleri ve nedensellik bağının kesilmesi savunma sağlar.","teshis":{"C":{"gercek":"Madde, belirli bir tehlike hâli için öngörülen özel sorumluluk hükümlerinin saklı olduğunu, yani özel düzenlemenin öncelikle uygulanacağını belirtir.","ayirt":"Olayda özel bir kanunun tehlike sorumluluğu hükmü var mı, varsa hangisi öncelenir?","paragraf":"m.71/3","yanilgi":"Genel hüküm varken özel kanun hükmünün öncelikli uygulanamayacağını, m.71\u0027in her durumda tek başına uygulanacağını sanıyorsun."},"E":{"gercek":"Tehlike sorumluluğu kusursuz sorumluluktur; ispat konusu işletmenin niteliği ile zarar-nedensellik bağıdır, kusur değildir.","ayirt":"Bu sorumluluk türünde davacı kusuru mu, yoksa tehlikeli faaliyet-zarar ilişkisini mi ispatlıyor?","paragraf":"m.71/1-2","yanilgi":"Tehlike sorumluluğunu kusur sorumluluğuyla karıştırıp zarar görenin kusur ispatlaması gerektiğini sanıyorsun."},"A":{"gercek":"TBK m.71 tehlike sorumluluğu sebep sorumluluğudur, kurtuluş kanıtı öngörülmemiştir; özen ispatı yalnız kusura dayanan sorumluluk türlerinde kurtuluş sağlar.","ayirt":"Bu sorumluluk türünde kanun \u0027özen gösterse bile sorumludur\u0027 hükmünü mü taşıyor?","paragraf":"m.71/2","yanilgi":"Adam çalıştıranın sorumluluğundaki gibi işletme sahibinin de özen ispatıyla kurtulabileceğini sanıyorsun."},"D":{"gercek":"Madde işletme sahibi ve varsa işleteni müteselsilen sorumlu tutar.","ayirt":"Metinde geçen \u0027ve varsa işleten\u0027 ibaresi kimi de sorumlu kılıyor?","paragraf":"m.71/1","yanilgi":"Sorumluluğun yalnız işletme sahibine ait olduğunu, işletenin ayrı bir sıfat olarak sorumlu tutulamayacağını sanıyorsun."},"B":{"gercek":"Madde açıkça, hukuk düzenince izin verilen faaliyetten doğan zararda bile zarar görenin uygun bedelle denkleştirme isteyebileceğini düzenler.","ayirt":"Hukuka uygunluk sorumluluğu kaldırır mı, yoksa denkleştirmeye mi dönüştürür?","paragraf":"m.71/son","yanilgi":"Faaliyet hukuka uygunsa hiçbir talep ileri sürülemeyeceğini düşünüyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 130"},"kural":"107 nci maddeye göre alacaklının temerrüdü halinde borçlu, hasar ve giderler alacaklıya ait olmak üzere teslim edeceği şeyi tevdi ederek borcundan kurtulabilir; ticari mallar hakim kararı olmadan da ardiyeye tevdi edilebilir; 106 ncı maddeye göre alacaklı müteselsil borçlulardan birine karşı temerrüde düşerse diğerlerine karşı da temerrüde düşmüş sayılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 130","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Alacaklının temerrüdü sorularında hem sirayet kuralını (106) hem tevdi/ticari mal istisnasını (107) birlikte kontrol et, tek maddeye bakıp şık eleme.","konu":"borçlu temerrüdü imkanlari","tablo":{"satirlar":[["A) İşletme, diğer tedarikçilere karşı da temerrüde düşmüş s…","TBK m.106/2, m.107","doğru ifade"],["B) İşletmenin temerrüdü yalnızca ilgili tedarikçiyle sınırl…","TBK m.106/2","YANLIŞ ifade"],["C) Borçlu tedarikçi, malı bir ardiyeye tevdi edebilmek için…","TBK m.107","YANLIŞ ifade"],["D) Borçlu tedarikçi, alacaklının temerrüde düşmesi halinde …","TBK m.107","YANLIŞ ifade"],["E) Alacaklının temerrüde düşmesi, ancak borçlunun usulüne u…","TBK m.106","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Borçlu tedarikçi, malı bir ardiyeye tevdi edebilmek için mal ticari nitelikte olsa dahi mutlaka hakim kararı almak zorundadır.","E":"Alacaklının temerrüde düşmesi, ancak borçlunun usulüne uygun ihtarda bulunmasından sonra gerçekleşebilen bir sonuçtur.","A":"İşletme, diğer tedarikçilere karşı da temerrüde düşmüş sayılır; borçlu ise ticari mal olduğundan hakim kararı aranmaksızın malı ardiyeye tevdi edebilir.","D":"Borçlu tedarikçi, alacaklının temerrüde düşmesi halinde yalnızca satma hakkını kullanabilir, tevdi hakkından hiçbir şekilde yararlanamaz.","B":"İşletmenin temerrüdü yalnızca ilgili tedarikçiyle sınırlı kalır, diğer tedarikçilerle olan borç ilişkisini hiçbir şekilde etkilemez."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Bir tekstil imalatçısı işletmesi, aralarında müteselsil borç ilişkisi bulunan üç tedarikçiden ticari mal alacaklısıdır. İşletme, tedarikçilerden birinin gönderdiği malı haklı bir sebep olmaksızın teslim almaktan kaçınmıştır. 6098 sayılı Türk Borçlar Kanununa göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-20","verilenler":[],"dayanak":"Türk Borçlar Kanunu m.106, Türk Borçlar Kanunu m.107","dogru":"A","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Bir mobilya fabrikası, aralarında müteselsil borç ilişkisi bulunan iki tedarikçiden kereste alacaklısıdır. Tedarikçilerden biri 500 metreküp kereste gönderir, fabrika haklı sebep olmaksızın malı teslim almaktan kaçınır. 12 Mart tarihinde bu olay gerçekleşir.","anlatim":"Fabrikanın bu davranışı sadece o tedarikçiyle mi ilgili kalır, yoksa diğer tedarikçiyi de mi etkiler? Bu tek olayda beş ifadeyi tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 106 ncı madde, alacaklının müteselsil borçlulardan birine temerrüdünün diğerlerine sirayet ettiğini söyler; 107 nci madde ticari malda hakim kararı aranmaksızın tevdi edilebileceğini söyler. Beş ifadeyi bu 500 metreküp kereste olayında tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.106/2, m.107","karar":"doğru","anlatim":"106 ncı madde ikinci cümlesi müteselsil borçlularda temerrüdün sirayet edeceğini söyler. 107 nci madde ticari malda hakim kararı aramaz, kereste ticari mal olduğundan borçlu doğrudan ardiyeye tevdi edebilir.","formul":"Şık A: Fabrika teslimi reddedince diğer tedarikçiye karşı da temerrüde düşmüş sayılır mı, ve borçlu tedarikçi hakim kararı almadan kereste ardiyeye tevdi edebilir mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.106/2","karar":"yanlış","anlatim":"106 ncı madde açıkça müteselsil borçlulardan birine karşı temerrüdün diğerlerine de sirayet edeceğini söyler. Fabrikanın temerrüdü diğer tedarikçiyi de kapsar, sınırlı kalmaz.","formul":"Şık B: Fabrikanın temerrüdü yalnızca malı gönderen tedarikçiyle mi sınırlı kalır, diğer tedarikçiyle ilişkiyi hiç etkilemez mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.107","karar":"yanlış","anlatim":"107 nci madde genel kuralda tevdi yerini hakimin belirleyeceğini söyler ama ticari mallar için ayrıca istisna getirir. Kereste ticari mal olduğundan hakim kararı aranmaz.","formul":"Şık C: Kereste ticari mal olduğu halde borçlu tedarikçi yine de mutlaka hakim kararı almak zorunda mıdır?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.107","karar":"yanlış","anlatim":"107 nci madde borçluya önce tevdi imkânı tanır, ardından ayrı başlık altında satma hakkını düzenler. Tevdi hakkı satma hakkını dışlamaz, ikisi de kullanılabilir.","formul":"Şık D: Borçlu tedarikçi fabrika temerrüde düşünce yalnızca satma hakkını mı kullanabilir, tevdi hakkından hiç yararlanamaz mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.106","karar":"yanlış","anlatim":"106 ncı madde alacaklının haklı sebep olmaksızın edimi kabulden kaçınmasını yeterli görür, ihtar şartı aramaz. Fabrika malı reddettiği anda temerrüt gerçekleşmiştir.","formul":"Şık E: Fabrikanın temerrüde düşmesi için tedarikçinin önce usulüne uygun ihtarda bulunması mı gerekir?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Bu olayda iki kural birlikte çalışır: müteselsillikte temerrüt sirayeti ve ticari malda hakim kararı aranmaması. Kendine sor: bu olayda tek madde mi yeterli, yoksa iki maddenin birleşimi mi gerekiyor?","doldur":[]}],"anahtar":[{"ornek":"temerrüde","kok":"temerr"},{"ornek":"borçlulardan","kok":"borçlu"},{"ornek":"ticari","kok":"ticari"},{"ornek":"müteselsil","kok":"mütese"},{"ornek":"kararı","kok":"kararı"},{"ornek":"alacaklı","kok":"alacak"}],"konuGiris":{"harita":"Ne zaman test edilir: Alacaklı, kendisine usulüne uygun sunulan edimi haklı sebep olmaksızın kabul etmediğinde. Nasıl ölçülür: Alacaklının müteselsil borçlulardan birine karşı temerrüdünün diğerlerine de etki edip etmediği ve borçlunun tevdi hakkını kullanıp kullanamayacağı değerlendirilir. Nasıl kaydedilir: Borçlunun tevdi ile borçtan kurtulma beyanı ve tevdi yerinin belirlenme usulü esas alınır.","desen":"Sınav genelde müteselsil borçlulardan birine karşı temerrüdün diğerlerine de sirayet edip etmediğini sorar, tuzak burada tek borçluya özgü sanılmasıdır. Diğer tuzak, ticari malların hâkim kararı olmadan da ardiyeye tevdi edilebileceğinin unutulmasıdır. Bu soru Türk Borçlar Kanunu m.106-107 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Alacaklının haklı sebep olmaksızın edimi kabulden kaçınması hâli","ad":"Alacaklı temerrüdü","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Birden çok borçlunun aynı borçtan birlikte sorumlu olması ilişkisi","ad":"Müteselsil borç","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Borçlunun teslim edeceği şeyi üçüncü bir yere bırakarak borçtan kurtulması","ad":"Tevdi hakkı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Teslim edilecek malın bırakılacağı yerin belirlenmesi kuralı","ad":"Tevdi yeri","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda müteselsil alacaklılık ilişkisi ve alacaklının haksız kaçınması verilir, bunun sonucu ve borçlunun hakkı sorulur.","panel_ornek":"Üç arkadaş birlikte bir ev kiraladı ve kirayı ortaklaşa ödüyor; ev sahibi haklı sebep olmadan parayı almaktan kaçınırsa, arkadaşlardan biri parayı bankaya yatırıp borcundan kurtulabilir. Böylece diğer iki arkadaş da ev sahibine karşı aynı haktan yararlanır.","ornek":"Üç arkadaş birlikte bir ev kiraladı ve kirayı ortaklaşa ödüyor; ev sahibi haklı sebep olmadan parayı almaktan kaçınırsa, arkadaşlardan biri parayı bankaya yatırıp borcundan kurtulabilir. Böylece diğer iki arkadaş da ev sahibine karşı aynı haktan yararlanır.","yontemler":"Önce alacaklı temerrüdünün diğer borçlulara etkisi, sonra tevdi hakkının ticari mallarda hâkim kararı gerektirmediği kuralı kontrol edilir.","nedir":"Bu konu, alacaklının borcu almaktan kaçınması durumunda borçlunun ne yapabileceğini anlatır. Sınav, müteselsil alacaklı/borçlu ilişkisinde temerrüdün diğerlerine etkisini ve tevdi hakkının şartlarını ölçer."},"olay":"İki kuralın birleşimi - müteselsillik sirayeti ve ticari mal istisnası.","tuzak":{"C":{"ad":"Genel Kural-İstisna Karıştırma Tuzağı","metin":"Öğrenci tevdi için her zaman hakim kararı arandığını sanıp ticari mal istisnasını gözden kaçırır. Doğrusu: 107 nci maddenin ikinci cümlesi, ticari malların hakim kararı olmadan da ardiyeye tevdi edilebileceğini belirtir."},"E":{"ad":"Borçlu Temerrüdüyle Karıştırma Tuzağı","metin":"Öğrenci alacaklının temerrüdünü borçlu temerrüdündeki ihtar şartına kıyaslayarak aynı koşulun burada da arandığını sanır. Doğrusu: 106 ncı maddeye göre alacaklının haklı bir sebep olmaksızın edimi kabulden veya hazırlık fiillerini yapmaktan kaçınması yeterlidir, ayrıca ihtar aranmaz."},"D":{"ad":"Seçenek Daraltma Tuzağı","metin":"Öğrenci başlıkta görülen satma hakkının, tevdi hakkının yerini aldığını ve ikisinin birlikte var olamayacağını düşünür. Doğrusu: 107 nci madde borçluya önce tevdi imkânı tanır, bu imkân satma hakkını dışlamaz."},"B":{"ad":"Sirayet Yokmuş Gibi Değerlendirme Tuzağı","metin":"Öğrenci temerrüdün yalnız somut ilişkiyi bağladığını, müteselsil ilişkideki diğer borçluları etkilemeyeceğini düşünür. Doğrusu: 106 ncı madde, alacaklının bir müteselsil borçluya karşı temerrüdünün diğerlerine karşı da temerrüt sayılacağını açıkça öngörür."}},"celdiriciYol":{},"hap":"Alacaklı, müteselsil borçlulardan birine karşı temerrüde düşerse diğerlerine karşı da temerrüde düşmüş sayılır; borçlu ise ticari malı hakim kararı aramaksızın ardiyeye tevdi edebilir.","teshis":{"C":{"gercek":"107 nci madde, tevdi yerinin kural olarak hakim tarafından belirleneceğini ama ticari malların hakim kararı olmadan ardiyeye tevdi edilebileceğini ayrıca düzenler.","ayirt":"Tevdi edilecek şey ticari mal mı, yoksa genel kural mı uygulanıyor?","paragraf":"TBK m.107","yanilgi":"Tevdi hakkının her koşulda hakim kararına bağlı olduğunu, ticari mal istisnasının var olmadığını sanıyorsun."},"E":{"gercek":"106 ncı madde, alacaklının haklı sebep olmaksızın edimi kabulden veya gerekli hazırlık fiillerini yapmaktan kaçınmasını yeterli görür, ihtar şartı aramaz.","ayirt":"Bu kural borçlunun mu, alacaklının mı temerrüdüne ilişkin ve hangi koşulu arıyor?","paragraf":"TBK m.106","yanilgi":"Borçlu temerrüdündeki ihtar şartını alacaklının temerrüdüne de uyguluyorsun."},"A":{"gercek":"106 ncı madde müteselsil borçlulardan birine karşı temerrüdün diğerlerine sirayet edeceğini, 107 nci madde ise ticari malda hakim kararı aranmayacağını düzenler; olay her iki maddeyi birlikte gerektirir.","ayirt":"Olayda birden fazla madde/kural aynı anda mı uygulanıyor, tek kural mı yeterli?","paragraf":"TBK m.106, m.107","yanilgi":"Bu şıkkı eleyen öğrenci, iki ayrı maddedeki kuralın aynı olayda birlikte uygulanabileceğini fark edemez."},"D":{"gercek":"107 nci madde borçluya önce tevdi imkânı tanır; satma hakkı bundan sonraki ayrı bir imkândır, tevdi hakkını dışlamaz.","ayirt":"Bir imkânın varlığı, diğerini otomatik olarak ortadan kaldırır mı?","paragraf":"TBK m.107","yanilgi":"Satma hakkı başlığının varlığını, tevdi hakkının ortadan kalktığı anlamına geldiğini düşünüyorsun."},"B":{"gercek":"106 ncı madde ikinci cümle, alacaklının bir borçluya karşı temerrüdünün diğer müteselsil borçlulara karşı da temerrüt sayılacağını açıkça hükme bağlar.","ayirt":"Borç ilişkisinde müteselsillik varsa, temerrüt tek bir tarafla mı sınırlı kalır?","paragraf":"TBK m.106/2","yanilgi":"Temerrüdün yalnızca ikili ilişkide kaldığını, müteselsil yapının bunu genişletmeyeceğini düşünüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 125"},"kural":"Türk Borçlar Kanunu m.43, aksi kararlaştırılmadıkça veya işin özelliğinden anlaşılmadıkça temsil olunanın iflasını sona erme sebebi sayar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 125","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde \u0027aksi kararlaştırılmadıkça\u0027 gibi ihtiyat kayıtlarını gören şık, mutlaklık iddiası taşıyan şıklardan her zaman önde tutulur.","konu":"borçlar kanunu\u0027nda temsil","tablo":{"satirlar":[["VERİLENLER","-","-"],["Türk Borçlar Kanunu madde numarası","43","-"],["HESAP","-","-"],["A) Temsilcinin fiil ehliyetini kaybetmesi, taraflarca aksi …","TBK m.43","YANLIŞ ifade"],["B) Taraflarca aksi kararlaştırılmadıkça veya işin özelliğin…","TBK m.43","doğru ifade"],["C) Temsil olunanın tüzel kişiliğinin sona ermesi hâli, bu h…","TBK m.43","YANLIŞ ifade"],["D) Temsilcinin ölümüyle temsil yetkisi sona erince, tarafla…","TBK m.43","YANLIŞ ifade"],["E) Hükümde sayılan sona erme sebepleri yalnızca temsilci ba…","TBK m.43","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Temsil olunanın tüzel kişiliğinin sona ermesi hâli, bu hükmün kapsamı dışında bırakılmış olup temsil yetkisini etkilemez.","E":"Hükümde sayılan sona erme sebepleri yalnızca temsilci bakımından geçerlidir; temsil olunanın gaipliğine karar verilmesi temsil yetkisini etkilemez.","A":"Temsilcinin fiil ehliyetini kaybetmesi, taraflarca aksi kararlaştırılmış olsa dahi, temsil yetkisini mutlak biçimde sona erdirir.","D":"Temsilcinin ölümüyle temsil yetkisi sona erince, tarafların bu ölümden önce doğmuş kişisel hak talepleri de birlikte ortadan kalkar.","B":"Taraflarca aksi kararlaştırılmadıkça veya işin özelliğinden anlaşılmadıkça, temsil olunanın iflasına karar verilmesi hâlinde temsil yetkisi sona erer."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027nun 43 üncü maddesi uyarınca temsil yetkisinin sona ermesine ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-22","verilenler":[{"deger":"43","anlam":"Temsil yetkisinin sona ermesi konusunu düzenleyen kanun maddesinin numarası; sorunun hukuki dayanak noktası.","ad":"Türk Borçlar Kanunu madde numarası"}],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.43","dogru":"B","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Bir tekstil şirketi olan Nova Tekstil A.Ş., satın alma işlemleri için Ahmet Bey\u0027i vekil tayin etmişti; 14 Mart 2024\u0027te mahkeme Nova Tekstil A.Ş. hakkında iflas kararı verdi.","anlatim":"Ahmet Bey elinde hâlâ eski yetki belgesiyle tedarikçiyle 200.000 TL\u0027lik sipariş görüşmesi yapıyor. Şirket ortakları toplanıp \"bu yetki hâlâ geçerli mi\" diye tartışıyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.43\u0027e göre temsil olunanın iflası, aksi kararlaştırılmadıkça veya işin özelliğinden anlaşılmadıkça, temsil yetkisini sona erdirir; şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Ahmet Bey\u0027in yetkisinin akıbetini beş farklı iddiayla test edeceğiz. Her iddiayı madde metniyle karşılaştıracağız.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"TBK m.43","karar":"yanlış","anlatim":"Madde metni açıkça \"aksi taraflarca kararlaştırılmadıkça\" der, yani ihtiyat kaydı var. Bu ifade o kaydı yok sayıyor, o yüzden yanlış.","formul":"Şık A: biri sana \"Ahmet Bey ehliyetini kaybederse, taraflar aksini kararlaştırmış olsa bile yetki kesin biter\" diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"TBK m.43","karar":"doğru","anlatim":"Madde metni tam olarak bunu söylüyor: iflas hem sebep hem ihtiyat kaydıyla birlikte anılıyor. Ahmet Bey\u0027in 200.000 TL\u0027lik sözleşmesi bu yüzden riskli, yetkisi kural olarak bitmiştir.","formul":"Şık B: Nova Tekstil A.Ş.\u0027nin iflasına karar verilince, taraflarca aksi kararlaştırılmadıkça veya işin özelliğinden anlaşılmadıkça Ahmet Bey\u0027in yetkisi sona erer diyorsun, doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"TBK m.43","karar":"yanlış","anlatim":"Madde ikinci cümlesinde tüzel kişiliğin sona ermesinin de aynı hükme tabi olduğunu söyler. Bu ifade tam tersini iddia ediyor, o yüzden yanlış.","formul":"Şık C: birileri \"Nova Tekstil A.Ş. tüzel kişiliği tamamen sona erse bile Ahmet Bey\u0027in yetkisi etkilenmez\" diyor, sen ne dersin?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"TBK m.43","karar":"yanlış","anlatim":"Madde son cümlesinde tarafların karşılıklı kişisel haklarının saklı olduğunu söyler. Yetkinin bitmesi geçmiş alacağı silmez, bu ifade yanlış.","formul":"Şık D: Ahmet Bey öldüğünde yetkisi biter, peki ölümden önce doğmuş 50.000 TL\u0027lik komisyon alacağı da beraber mi silinir?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"TBK m.43","karar":"yanlış","anlatim":"Madde metni ölüm, gaiplik, ehliyet kaybı, iflası hem temsil olunan hem temsilci için ortak sayar. Bu ifade sebepleri tek tarafa hapsediyor, o yüzden yanlış.","formul":"Şık E: biri \"madde sadece Ahmet Bey için geçerli, Nova Tekstil A.Ş.\u0027nin gaipliğine karar verilse yetki etkilenmez\" diyor, katılır mısın?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Doğru şık, maddenin hem sebebi hem ihtiyat kaydını eksiksiz aktaran tek ifadeydi. Kendine sor: bu şık maddenin \"aksi kararlaştırılmadıkça\" kaydını görmezden mi geliyor, yoksa onu da içeriyor mu?","doldur":[]}],"anahtar":[{"ornek":"temsil","kok":"temsil"},{"ornek":"kararlaştırılmadıkça","kok":"kararl"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"ihtiyat","kok":"ihtiya"},{"ornek":"tarafların","kok":"tarafl"},{"ornek":"iflasıyla","kok":"iflası"}],"konuGiris":{"harita":"Ne zaman sona erer: temsil olunanın veya temsilcinin ölümü, gaipliği, ehliyet kaybı ya da iflasıyla. Nasıl ölçülür: madde metninde sayılan hallerin aksi kararlaştırılıp kararlaştırılmadığına bakılarak. Nasıl kaydedilir: tüzel kişinin sona ermesi de aynı hükme tabi tutularak.","desen":"Sınav genellikle \u0027yetki belgesinin geri verilmesi\u0027 gibi maddede yer almayan bir seçeneği doğruymuş gibi sunarak tuzak kurar. Adayın madde metninde sayılan dört hali (ölüm, gaiplik, ehliyet kaybı, iflas) ezbere ayırt etmesi beklenir. Bu soru Türk Borçlar Kanunu m.43 metninden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Birinin başkası adına hukuki işlem yapma yetkisi","ad":"Temsil yetkisi","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Kişiliğin hukuken sona ermesi veya kaybolduğuna karar verilmesi","ad":"Ölüm/gaiplik","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin haklarını kullanma yeteneğini yitirmesi","ad":"Fiil ehliyetinin kaybı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Kurumun hukuki varlığının bitmesiyle temsilin de bitmesi","ad":"Tüzel kişinin sona ermesi","kim":"kanun sabitler"}],"sinavda":"Madde 43\u0027teki sayılan sona erme hallerinden hangisinin doğru/yanlış olduğu seçeneklerle sorulur.","panel_ornek":"Arkadaşın sana verdiği 2 günlük \u0027kargomu al\u0027 yetkisi, o vefat ederse ya da sen aniden akıl sağlığını kaybedersen kendiliğinden biter; kağıt üzerinde durmasının önemi yoktur. Yetki belgesini yırtıp atmak da bu haller arasında sayılmaz, ayrı bir şeydir.","ornek":"Arkadaşın sana verdiği 2 günlük \u0027kargomu al\u0027 yetkisi, o vefat ederse ya da sen aniden akıl sağlığını kaybedersen kendiliğinden biter; kağıt üzerinde durmasının önemi yoktur. Yetki belgesini yırtıp atmak da bu haller arasında sayılmaz, ayrı bir şeydir.","yontemler":"Madde metnindeki dört hali ezberle ve maddede geçmeyen \u0027yetki belgesinin geri verilmesi\u0027 gibi ifadelerin tuzak olduğunu bil.","nedir":"Temsil, bir kişinin başkası adına hukuki işlem yapma yetkisidir; sınav bu yetkinin hangi hallerde kendiliğinden sona erdiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Kapsam Tuzağı","metin":"Sona erme sebeplerini yalnızca gerçek kişiye özgü sanıp tüzel kişiliğin sona ermesini hükmün dışında bırakıyorsun. Doğrusu: Madde açıkça \u0027Bu hüküm, bir tüzel kişiliğin sona ermesi durumunda da uygulanır\u0027 der."},"E":{"ad":"Taraf Tuzağı","metin":"Sayılan sebepleri yalnızca temsilciye özgü sanıp temsil olunan bakımından uygulanmayacağını düşünüyorsun. Doğrusu: Madde hem temsil olunanın hem temsilcinin ölümü, gaipliği, ehliyet kaybı ve iflasını birlikte sayar."},"D":{"ad":"Taraf/Kapsam Karışıklığı Tuzağı","metin":"Yetkinin sona ermesini, tarafların kişisel haklarının da sona ermesiyle karıştırıyorsun. Doğrusu: Madde \u0027Tarafların karşılıklı kişisel hakları saklıdır\u0027 diyerek bu hakları korur."},"A":{"ad":"Mutlaklık Tuzağı","metin":"Maddenin baş kısmındaki \u0027aksi taraflarca kararlaştırılmadıkça veya işin özelliğinden anlaşılmadıkça\u0027 kaydını atlayıp sebebi kesin/mutlak sanıyorsun. Doğrusu: Bu sebepler kural olarak sona erdirir ama sözleşmeyle aksi kararlaştırılabilir."}},"celdiriciYol":{},"hap":"Hukuki işlemden doğan temsil yetkisi, aksi kararlaştırılmadıkça veya işin özelliğinden anlaşılmadıkça, temsil olunanın veya temsilcinin ölümü, gaipliği, ehliyet kaybı veya iflasıyla; tüzel kişilikte ise tüzel kişiliğin sona ermesiyle son bulur, ama tarafların kişisel hakları saklıdır.","teshis":{"C":{"gercek":"Madde son fıkrasında tüzel kişiliğin sona ermesinin de aynı hükme tabi olduğunu açıkça belirtir.","ayirt":"Maddenin ikinci cümlesini atladım mı?","paragraf":"TBK m.43","yanilgi":"Hükmün yalnız gerçek kişilere uygulandığını, tüzel kişilik ayrı bir rejime tabi olduğunu sanıyorsun."},"E":{"gercek":"Madde, ölüm, gaiplik, ehliyet kaybı ve iflası hem temsil olunan hem temsilci için ortak sebep sayar.","ayirt":"Madde metninde sebepler yalnız bir tarafa mı, her iki tarafa mı bağlanmış?","paragraf":"TBK m.43","yanilgi":"Sayılan sebeplerin yalnızca temsilciye özgü olduğunu, temsil olunan için geçerli olmadığını sanıyorsun."},"A":{"gercek":"TBK m.43 sona erme sebeplerini \u0027aksi kararlaştırılmadıkça veya işin özelliğinden anlaşılmadıkça\u0027 şartına bağlar; taraf iradesiyle esneyebilir.","ayirt":"Madde metninde bir ihtiyat/istisna kaydı var mı, onu okudum mu?","paragraf":"TBK m.43","yanilgi":"Kanun maddesindeki istisna cümlesini görmeyip sebebi her koşulda kesin sona erdirici sanıyorsun."},"D":{"gercek":"Madde açıkça \u0027tarafların karşılıklı kişisel hakları saklıdır\u0027 der; yetkinin sona ermesi geçmiş hakları etkilemez.","ayirt":"Yetkinin sona ermesi ile kişisel hak talebinin sona ermesini birbirine karıştırdım mı?","paragraf":"TBK m.43","yanilgi":"Temsil yetkisinin sona ermesiyle, o yetkiden önce doğmuş kişisel alacak-borçların da düşeceğini sanıyorsun."},"B":{"gercek":"TBK m.43 hem sebebi hem ihtiyat kaydını birlikte düzenler; iki unsur da doğru şıkkın parçasıdır.","ayirt":"Şık, maddenin hem sebebini hem şartını eksiksiz mi veriyor?","paragraf":"TBK m.43","yanilgi":"Bu şıkkı elerken, maddedeki ihtiyat kaydının fazladan bir ayrıntı olduğunu, iflasın tek başına yeterli olduğunu düşünüyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 128"},"kural":"Türk Borçlar Kanununun 66 ncı maddesinin üçüncü fıkrasına göre işletme başlığında adam çalıştıran, çalışma düzeninin zararı önlemeye elverişli olduğunu ispat etmedikçe sorumluluktan kurtulamaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 128","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Kökte \u0027işletme faaliyeti\u0027 geçiyorsa m.66/3\u0027ü, bireysel çalışan hatası geçiyorsa m.66/2\u0027yi ara; ikisini karıştırma.","konu":"adam çalıştıranın sorumluluğu","tablo":{"satirlar":[["A) Adam çalıştıran, çalışanını seçerken gerekli özeni göste…","m.66/3","YANLIŞ ifade"],["B) Adam çalıştıran, yalnızca çalışanını seçerken özen göste…","m.66/2-3","YANLIŞ ifade"],["C) Adam çalıştıranın ödediği tazminat için çalışana rücu ha…","m.66/4","YANLIŞ ifade"],["D) Adam çalıştıran ile çalışan arasında bağımlılık ilişkisi…","m.66/1","YANLIŞ ifade"],["E) Adam çalıştıran, işletmenin çalışma düzeninin zararın do…","m.66/3","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Adam çalıştıranın ödediği tazminat için çalışana rücu hakkı, ödenen tazminatın tamamını kapsar.","E":"Adam çalıştıran, işletmenin çalışma düzeninin zararın doğmasını önlemeye elverişli olduğunu ispat etmedikçe sorumluluktan kurtulamaz.","A":"Adam çalıştıran, çalışanını seçerken gerekli özeni gösterdiğini ispat etse dahi sorumluluktan kurtulamaz.","D":"Adam çalıştıran ile çalışan arasında bağımlılık ilişkisinin bulunması, sorumluluğun doğması için zorunlu değildir.","B":"Adam çalıştıran, yalnızca çalışanını seçerken özen gösterdiğini ispatlayarak sorumluluktan kurtulabilir."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Bir nakliyat işletmesinde çalışan sürücünün, iş sırasında üçüncü kişiye verdiği zarardan doğan adam çalıştıran sorumluluğu bakımından, işletme faaliyeti dolayısıyla meydana gelen zararlarda aşağıdakilerden hangisi HER ZAMAN doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-23","verilenler":[],"dayanak":"Türk Borçlar Kanunu m.66","dogru":"E","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Ankara\u0027da bir kargo şirketinde çalışan sürücü Mehmet, 14 Mart günü teslimat yaparken bir yayaya çarpıyor, yaya 40.000 TL zarar görüyor.","anlatim":"Şirket sahibi \u0027ben Mehmet\u0027i işe alırken ehliyetini kontrol ettim, özenliydim\u0027 diyor. Ama zarar tek bir çalışan hatasından değil, şirketin işletme faaliyetinden doğuyor. Bu ayrım her şeyi değiştiriyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.66/3\u0027e göre işletme faaliyetinde adam çalıştıran, çalışma düzeninin zararı önlemeye elverişli olduğunu ispat etmedikçe sorumludur.","anlatim":"40.000 TL\u0027lik bu zararda beş ifadeyi tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.66/3","karar":"yanlış","anlatim":"İşletme faaliyetinde seçim özeni ispatı yetmez, düzenin elverişliliği gerekir. Bu yüzden kurtuluş imkanı yok değil, ölçütü farklı.","formul":"Şık A: şirket avukatı \u0027seçim özenini ispat ettik, kurtulduk\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.66/2-3","karar":"yanlış","anlatim":"İşletme faaliyetinde m.66/2 değil m.66/3 uygulanır. Seçim özeni tek başına yetmez.","formul":"Şık B: şirket \u0027sadece seçim özenini kanıtlarsak kurtuluruz\u0027 diyor, bu yeterli mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.66/4","karar":"yanlış","anlatim":"Rücu, Mehmet\u0027in bizzat sorumlu olduğu ölçüyle sınırlıdır, tamamı değil. Mehmet\u0027in kusur payı ne kadarsa rücu o kadardır.","formul":"Şık C: şirket ödediği 40.000 TL\u0027nin tamamını Mehmet\u0027e rücu ediyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.66/1","karar":"yanlış","anlatim":"Sorumluluğun temeli tam olarak bu bağımlılık ilişkisidir. Bağımlılık yoksa m.66 hiç uygulanmaz.","formul":"Şık D: Mehmet ile şirket arasında bağımlılık ilişkisi yoksa da sorumluluk doğar mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.66/3","karar":"doğru","anlatim":"Evet, işletme faaliyetinde her zaman geçerli ölçüt tam olarak budur. Mehmet\u0027in seçimi değil, işletmenin genel düzeni ispat konusu olur.","formul":"Şık E: şirket, çalışma düzeninin zararı önlemeye elverişli olduğunu ispat etmedikçe sorumlu mu kalır?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"İşletme faaliyetinde tek her zaman geçerli kural, çalışma düzeninin elverişlilik ispatıdır. Kendine sor: zarar bireysel çalışan hatasından mı, yoksa işletmenin genel işleyişinden mi doğdu?","doldur":[]}],"anahtar":[{"ornek":"faaliyetinden","kok":"faaliy"},{"ornek":"düzeninin","kok":"düzeni"},{"ornek":"sorumluluğunda","kok":"soruml"},{"ornek":"mehmet","kok":"mehmet"},{"ornek":"elverişliliğidir","kok":"elveri"},{"ornek":"kurtuluş","kok":"kurtul"}],"konuGiris":{"harita":"Ne zaman test edilir: çalışanın işiyle ilgili verdiği zarar bir işletme faaliyeti sırasında gerçekleştiğinde test edilir. Nasıl ölçülür: işletmenin çalışma düzeninin zararı önlemeye elverişli olup olmadığına bakılarak ölçülür. Nasıl kaydedilir: ispat yükü adam çalıştıranda olacak şekilde kurallaştırılır.","desen":"Sınav genelde kişisel kurtuluş kanıtı ile işletme faaliyeti kaynaklı zarar ayrımını karıştırtır. Öğrenci işletme faaliyetinde de basit kurtuluş kanıtının yeterli olduğunu sanıp yanılır, oysa burada daha ağır bir ispat şartı vardır. Bu soru m.66/3 fıkrası noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"başkasını kendi işinde çalıştıran ve ondan sorumlu tutulan kişi","ad":"adam çalıştıran","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"işletmenin sürekli, düzenli yürüttüğü iş kolu faaliyeti","ad":"işletme faaliyeti","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"seçme, talimat, gözetimde gerekli özenin gösterildiğinin ispatı","ad":"kurtuluş kanıtı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"çalışma düzeninin zararı önlemeye elverişli olduğunun kanıtlanması","ad":"işletme düzeni ispatı","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda işletme faaliyeti sırasında çalışanın verdiği zarar anlatılır ve adam çalıştıranın hangi durumda HER ZAMAN sorumlu kalacağı sorulur.","panel_ornek":"Bir kargo şirketinde çalışan kurye, dağıtım sırasında bir yayaya çarpıp yaralıyor. Şirket, kuryeyi işe alırken referans kontrolü yaptığını söylese bile işletme düzeni zararı önlemeye elverişli değilse yine sorumlu olur; burada 1 kuryeden söz ediliyor ama sonuç şirketi bağlar.","ornek":"Bir kargo şirketinde çalışan kurye, dağıtım sırasında bir yayaya çarpıp yaralıyor. Şirket, kuryeyi işe alırken referans kontrolü yaptığını söylese bile işletme düzeni zararı önlemeye elverişli değilse yine sorumlu olur; burada 1 kuryeden söz ediliyor ama sonuç şirketi bağlar.","yontemler":"Tek kritik kural: işletme faaliyetinden doğan zararlarda adam çalıştıran, çalışma düzeninin zararı önlemeye elverişli olduğunu ispat edemedikçe sorumluluktan kurtulamaz.","nedir":"Adam çalıştıran sorumluluğu, bir işletmenin çalıştırdığı kişinin işiyle ilgili verdiği zararlardan işletme sahibinin sorumlu tutulmasıdır. Sınav bu sorumluluktan kurtulmanın hangi şartlarda mümkün olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Taraf/Tutar Tuzağı","metin":"Rücu, tazminatın tamamını değil çalışanın bizzat sorumlu olduğu ölçüyü kapsar. Doğrusu: Rücu, çalışanın kusur oranıyla sınırlıdır."},"A":{"ad":"Ters Kayıt Tuzağı","metin":"Kanun kurtuluş kanıtını tamamen kaldırmaz, yalnız işletme başlığında ispat konusunu değiştirir. Doğrusu: Kurtuluş imkanı vardır, fakat ispat konusu farklıdır."},"D":{"ad":"Kapsam Tuzağı","metin":"Bağımlılık ilişkisi adam çalıştıran sorumluluğunun kurucu unsurudur, yokluğunda sorumluluk doğmaz. Doğrusu: Bağımlılık ilişkisi şarttır."},"B":{"ad":"Kapsam Tuzağı","metin":"Bu ispat konusu genel adam çalıştıran sorumluluğuna aittir; işletme faaliyeti söz konusu olunca ispat çalışma düzeninin elverişliliğine kayar. Doğrusu: İşletme başlığında çalışan seçimi özeni yeterli değildir."}},"celdiriciYol":{},"hap":"Adam çalıştıranın işletme faaliyetinden doğan sorumluluğunda kurtuluş kanıtı, çalışan seçimi değil çalışma düzeninin elverişliliğidir.","teshis":{"C":{"gercek":"m.66/4 rücuyu çalışanın bizzat sorumlu olduğu ölçüyle sınırlar.","ayirt":"Rücu ederken çalışanın kusur oranını mı, ödenen tutarın tamamını mı esas alıyorum?","paragraf":"m.66/4","yanilgi":"Rücu hakkının ödenen tazminatın tamamını kapsadığını sanıyorsun."},"E":{"gercek":"m.66/3, işletme faaliyeti söz konusu olduğunda ispat yükünü çalışma düzeninin elverişliliğine taşır, bu ölçü m.66/2\u0027den daha ağırdır.","ayirt":"Sorumluluk kaynağı bireysel çalışan mı, yoksa işletmenin genel çalışma düzeni mi?","paragraf":"m.66/3","yanilgi":"Bu şıkkı eleyen öğrenci, işletme başlığı sorumluluğunu genel adam çalıştıran sorumluluğuyla aynı zannediyordur."},"A":{"gercek":"Türk Borçlar Kanunu m.66/3 kurtuluş imkanını kaldırmaz, ispat konusunu değiştirir.","ayirt":"Kurtuluş kanıtı yok mu, yoksa konusu mu değişti?","paragraf":"m.66/3","yanilgi":"Kurtuluş kanıtının işletme başlığında tamamen ortadan kalktığını sanıyorsun."},"D":{"gercek":"m.66/1 çalıştıran-çalışan bağımlılık ilişkisini sorumluluğun temel unsuru sayar.","ayirt":"Zarar veren, çalıştıranın talimatına bağlı bir çalışan mı?","paragraf":"m.66/1","yanilgi":"Bağımlılık ilişkisinin sorumluluk için gerekli olmadığını sanıyorsun."},"B":{"gercek":"m.66/2 çalışan seçimini, m.66/3 işletme düzenini ispat konusu yapar; işletme faaliyetinde ikincisi geçerlidir.","ayirt":"Zarar işletme faaliyetinden mi, yoksa münferit çalışan hatasından mı doğdu?","paragraf":"m.66/2-3","yanilgi":"İkinci ve üçüncü fıkradaki iki farklı ispat ölçüsünü aynı sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 126"},"kural":"Türk Borçlar Kanunu m.139 uyarınca zamanaşımına uğramış bir alacağın takası, takas edilebileceği anda henüz zamanaşımına uğramamış olması koşuluyla ileri sürülebilir; burada koşul gerçekleştiğinden 60.000 TL mahsup edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 126","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Takas sorularında önce \u0027takas anında zamanaşımı gerçekleşmiş miydi\u0027 sorusunu çöz, sonra mahsup işlemini yap.","konu":"borç ilişkisi sona erme","tablo":{"satirlar":[["VERİLENLER","-"],["A\u0027nın B\u0027ye borcu","90.000 TL"],["B\u0027nin A\u0027ya alacağı","60.000 TL"],["HESAP","-"],["Takas edilecek tutar (B\u0027nin A\u0027ya alacağı)","60.000"],["Kalan borç (A\u0027nın B\u0027ye borcu)","30.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"60.000, A\u0027nın B\u0027ye borcu olarak kalır","E":"90.000, takas ileri sürülemeyeceğinden borç aynen devam eder","A":"30.000, A\u0027nın B\u0027ye borcu olarak kalır","D":"60.000, A\u0027nın B\u0027den alacağı olarak kalır","B":"30.000, A\u0027nın B\u0027den alacağı olarak kalır"},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":{"bosluk":[[1,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Takas edilecek tutar (D\u0027nin C\u0027ye alacağı)","45.000"],["Kalan borç (C\u0027nin D\u0027ye borcu)","75.000"]]},"tur":"tablo","soru":"C\u0027nin D\u0027ye 120.000 TL kira bedeli borcu muaccel ve çekişmesizdir. D\u0027nin C\u0027den 45.000 TL alacağı zamanaşımına uğramış, ancak takas edilebileceği anda zamanaşımına uğramamıştır. C takas def\u0027ini ileri sürmüştür. 6098 sayılı Türk Borçlar Kanunu\u0027na göre takas sonrasında C\u0027nin durumunu bulmak için tabloyu doldur.","verilen":[[0,1]],"hedef":"Tabloyu doldur ve C\u0027nin kalan borcunun 75.000 TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"A\u0027nın B\u0027ye 90.000 TL ekipman bedeli borcu muaccel ve çekişmesizdir. B\u0027nin A\u0027dan 60.000 TL alacağı zamanaşımına uğramış, ancak takas edilebileceği anda zamanaşımına uğramamıştır. A takas def\u0027ini ileri sürmüştür. 6098 sayılı Türk Borçlar Kanunu\u0027na göre takas sonrasında A\u0027nın durumu nedir?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-24","verilenler":[{"deger":"90.000 TL","anlam":"Muaccel ve çekişmesiz asıl borç tutarı; mahsubun çıkış noktasıdır.","ad":"A\u0027nın B\u0027ye borcu"},{"deger":"60.000 TL","anlam":"Zamanaşımına uğramış ancak takas anında henüz uğramamış alacak; m.139 istisnası gereği mahsuba girer.","ad":"B\u0027nin A\u0027ya alacağı"}],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.139","dogru":"A","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Verilen: A\u0027nın B\u0027ye borcu 90.000 TL (soruda verilen); B\u0027nin A\u0027dan alacağı 60.000 TL, zamanaşımına uğramış (soruda verilen); takas anında zamanaşımı yok (soruda verilen)","anlatim":"Soru bize şunları vermiş: A\u0027nın B\u0027ye 90.000 TL muaccel borcu var, B\u0027nin A\u0027dan 60.000 TL zamanaşımına uğramış alacağı var. Takas edilebileceği anda bu alacak zamanaşımına uğramamıştı.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Takas nedir?","anlatim":"Takas nedir? İki taraf birbirine borçluysa, karşılıklı alacaklar mahsup edilip tek taraf kalan farkı öder.","doldur":[]},{"formul":"Türk Borçlar Kanunu m.139\u0027a göre zamanaşımına uğramış alacak, takas edilebileceği anda zamanaşımına uğramamı…","anlatim":"Türk Borçlar Kanunu m.139\u0027a göre zamanaşımına uğramış alacak, takas edilebileceği anda zamanaşımına uğramamışsa yine takas edilebilir. Burada bu koşul gerçekleşmiş, B\u0027nin 60.000 TL\u0027lik alacağı takasa girer.","doldur":[]},{"formul":"Takas edilecek tutar = B\u0027nin A\u0027dan alacağı = 60.000 (soruda verilen)","anlatim":"Şimdi biz hesaplıyoruz: A\u0027nın borcundan B\u0027nin alacağı mahsup ediliyor. Takas edilen kısım tam olarak B\u0027nin alacak tutarı kadardır.","doldur":[[4,1]]},{"formul":"Kalan borç = A\u0027nın B\u0027ye borcu − Takas edilen tutar = 90.000 (soruda verilen) − 60.000 (4. adımda bulduk) = 30.000","anlatim":"A\u0027nın borcundan bu tutarı düşüyoruz, çünkü takas borcu bu miktarda söndürür. Geriye kalan kısım hâlâ ödenmesi gereken borçtur.","doldur":[[5,1]]},{"formul":"Sonuç = 30.000 TL (5. adımda bulduk)","anlatim":"Sonuç: A\u0027nın B\u0027ye 30.000 TL borcu kalmıştır. Takas 60.000 TL\u0027lik kısmı sönderiyor, gerisi ayakta kalıyor.","doldur":[]},{"formul":"Ters durum: zamanaşımı takas anında zaten gerçekleşmişse → takas geçersiz, borç 90.000 TL","anlatim":"Ters durumda: eğer zamanaşımı, takas edilebileceği anda zaten gerçekleşmişse takas ileri sürülemezdi. O zaman A\u0027nın borcu tam 90.000 TL kalırdı.","doldur":[]},{"formul":"Yanlış yol: takas yok = 90.000 TL borç (HATALI) → doğrusu 30.000 TL (5. adımda bulduk)","anlatim":"En sık hata: öğrenci zamanaşımına uğramış alacak takas edilemez sanıp 90.000 TL\u0027yi cevap yazar. Oysa m.139 istisnası burada geçerli, 60.000 TL mahsup edilir.","doldur":[]}],"anahtar":[{"ornek":"zamanaşımına","kok":"zamana"},{"ornek":"edilebileceği","kok":"edileb"},{"ornek":"alacak","kok":"alacak"},{"ornek":"uğramış","kok":"uğramı"},{"ornek":"uğramamışsa","kok":"uğrama"},{"ornek":"alacağın","kok":"alacağ"}],"konuGiris":{"harita":"Ne zaman ileri sürülür: karşılıklı iki borç muaccel hale geldiğinde taraflardan biri takas def\u0027ini ileri sürer. Nasıl ölçülür: küçük alacak büyük borçtan düşülür ve aradaki fark kalan borç olur. Nasıl kaydedilir: zamanaşımı def\u0027i varsa, alacağın \u0027takas edilebileceği andaki\u0027 durumu esas alınır, sonraki zamanaşımı önemsizdir.","desen":"Sınav burada öğrenciyi \u0027zamanaşımına uğramış alacak hiç takas edilemez\u0027 yanılgısına düşürmeye çalışır; oysa kritik an takas anıdır, sonraki zamanaşımı önemsizdir. Ayrıca \u0027çekişmesiz\u0027 ile \u0027çekişmeli\u0027 alacak ayrımı karıştırılır, çekişmeli olsa da takas mümkündür (m.139). Bu soru m.139\u0027daki zamanaşımı istisnası noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Borcun ifa zamanının gelmiş, talep edilebilir hale gelmiş olması","ad":"Muacceliyet","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"soruda verilir","tanim":"Varlığı ve miktarı tartışmasız, kesin kabul edilen alacak","ad":"Çekişmesiz alacak","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Takas anında henüz zamanaşımına uğramamışsa yine de takas yapılabilmesi kuralı","ad":"Zamanaşımına uğramış alacakla takas","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Büyük borçtan küçük alacak düşüldükten sonra kalan net borç tutarı","ad":"Takas sonrası bakiye","kim":"kanun sabitler"}],"sinavda":"Karşılıklı iki borcun tutarları ve zamanaşımı durumu verilir, takas sonrası kalan borç tutarı sorulur.","panel_ornek":"Arkadaşına 500 TL borcun var, o da sana kırtasiyeden aldığı 300 TL\u0027yi borçlu; karşılaştığınızda \u0027300\u0027ü sil, sana sadece 200 borcum kalsın\u0027 dersin. İkiniz de birbirine borçlu olduğu için ödeşme otomatik olur, ayrıca elden para taşımaya gerek kalmaz. İşte buna takas denir.","ornek":"Arkadaşına 500 TL borcun var, o da sana kırtasiyeden aldığı 300 TL\u0027yi borçlu; karşılaştığınızda \u0027300\u0027ü sil, sana sadece 200 borcum kalsın\u0027 dersin. İkiniz de birbirine borçlu olduğu için ödeşme otomatik olur, ayrıca elden para taşımaya gerek kalmaz. İşte buna takas denir.","yontemler":"Önce zamanaşımı def\u0027inin takas anındaki geçerliliği kontrol edilir, sonra büyük tutardan küçük tutar düşülerek kalan bulunur.","nedir":"Bu konu borç ilişkisinin takas yoluyla nasıl sona erdiğini anlatır. Sınav, hangi şartlarda karşılıklı borçların birbirini sildiğini ve geriye ne kaldığını ölçer."},"olay":"90.000-60.000=30.000.","tuzak":{"C":{"ad":"Mahsup Yapmama Tuzağı","metin":"öğrenci zamanaşımına uğramış alacağın hiç indirilemeyeceğini düşünüp B\u0027nin 60.000 TL\u0027lik alacağını doğrudan A\u0027nın kalan borcu sanır. Doğrusu: koşul gerçekleştiği için 60.000 TL mahsuba girer, kalan 30.000\u0027dir."},"E":{"ad":"Zamanaşımı Genellemesi Tuzağı","metin":"öğrenci zamanaşımına uğramış her alacağın takasa hiç konu olamayacağını düşünerek borcun aynen 90.000 TL kaldığını sanır. Doğrusu: m.139\u0027daki istisna koşulu (takas anında zamanaşımı henüz dolmamış olma) burada gerçekleştiği için takas geçerlidir."},"D":{"ad":"Çifte Hata Tuzağı","metin":"hem mahsup yapılmaz hem de yön ters çevrilerek 60.000 TL A\u0027nın alacağı sayılır. Doğrusu: mahsup yapılmalı ve A borçlu tarafta kalmalıdır."},"B":{"ad":"Taraf Karıştırma Tuzağı","metin":"doğru mahsup işlemini yapıp 30.000 tutarına ulaşan öğrenci, kalan bakiyeyi A\u0027nın alacağı sanarak yönü ters çevirir. Doğrusu: mahsuptan sonra hâlâ borçlu olan taraf A\u0027dır, alacaklı değildir."}},"celdiriciYol":{"C":"60.000 = B\u0027nin alacağı doğrudan A\u0027nın kalan borcu sayıldı (mahsup hiç yapılmadı)","E":"90.000 = zamanaşımına uğramış alacağın hiç takas edilemeyeceği varsayılarak borç aynen bırakıldı (istisna koşulu atlandı)","D":"60.000 = mahsup yapılmadan B\u0027nin alacağı A\u0027nın alacağı sayıldı (mahsup atlandı + taraf ters)","B":"90.000 - 60.000 = 30.000 (taraf ters: A alacaklı sayıldı, oysa A borçlu kalır)"},"hap":"Zamanaşımına uğramış alacak, takas edilebileceği anda henüz zamanaşımına uğramamışsa takas edilebilir.","teshis":{"C":{"gercek":"Koşul gerçekleştiğinde zamanaşımına uğramış alacak da tam tutarıyla takasa girer ve borçtan düşülür.","ayirt":"Bu alacak takas koşulunu taşıyor mu, taşıyorsa mahsup edilir mi?","paragraf":"m.139","yanilgi":"Zamanaşımına uğramış alacağın mahsuba hiç girmeyeceğini düşünüp toplam tutarı kalan borç sanıyorsun."},"E":{"gercek":"m.139 istisnası, takas edilebilirlik anında zamanaşımı dolmamışsa alacağın yine de takas edilebileceğini söyler.","ayirt":"Zamanaşımı, takas edilebilirlik anından ÖNCE mi sonra mı gerçekleşmiş?","paragraf":"m.139","yanilgi":"Zamanaşımına uğramış her alacağın takasa engel olduğunu genelliyorsun."},"A":{"gercek":"m.139\u0027a göre zamanaşımına uğramış alacak, takas edilebileceği anda henüz zamanaşımına uğramamışsa takas edilebilir; burada koşul sağlanır.","ayirt":"Takas anında bu alacak zamanaşımına uğramış mıydı, uğramamış mıydı?","paragraf":"m.139","yanilgi":"Bu şıkkı eleyen öğrenci, zamanaşımına uğramış alacağın hiçbir koşulda takas edilemeyeceğini sanır."},"D":{"gercek":"Doğru işlemde önce mahsup yapılır (90.000-60.000), sonra kalan bakiyenin asıl borçlusu belirlenir.","ayirt":"Mahsubu yaptım mı, yaptıysam bakiye kimde kaldı?","paragraf":"m.139","yanilgi":"Hem mahsubu atlıyor hem de kalan tutarın yönünü ters kuruyorsun."},"B":{"gercek":"Mahsuptan sonra büyük borç (90.000) küçük alacaktan (60.000) düşülür, fark asıl borçlu olan A\u0027da kalır.","ayirt":"Hangi taraf başlangıçta daha yüksek tutarla borçluydu?","paragraf":"m.139","yanilgi":"Doğru tutarı bulduktan sonra kalan bakiyenin kime ait olduğunu karıştırıyorsun."}},"verilen":[[4,1],[5,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 129"},"kural":"Türk Borçlar Kanunu m.50/1 uyarınca zarar gören, zararını ve zarar verenin kusurunu ispatla yükümlüdür; bu genel kuralın istisnası yoktur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 129","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Her zaman doğrudur\u0027 kökünde istisnası olan hükümleri ele; m.50/2 ve m.65 birer istisna/takdir hükmüdür, m.50/1 ise koşulsuz genel kuraldır.","konu":"haksız fiil ispat yükü","tablo":{"satirlar":[["A) Zarar gören, zararını ve zarar verenin kusurunu ispat yü…","TBK m.50/1","doğru ifade"],["B) Zarar miktarı tam olarak ispat edilemiyorsa hâkim, davay…","TBK m.50/2","YANLIŞ ifade"],["C) Ayırt etme gücü bulunmayan kişinin verdiği zarar, hakkan…","TBK m.65","YANLIŞ ifade"],["D) İspat yükü, zarar görenin değil zarar verenin kusursuzlu…","TBK m.50/1","YANLIŞ ifade"],["E) Zarar gören kusuru ispat edemezse hâkim, hem zarar mikta…","TBK m.50/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Ayırt etme gücü bulunmayan kişinin verdiği zarar, hakkaniyet gerektirse dahi hiçbir şekilde giderilemez.","E":"Zarar gören kusuru ispat edemezse hâkim, hem zarar miktarını hem de kusurun varlığını hakkaniyete göre belirleyebilir.","A":"Zarar gören, zararını ve zarar verenin kusurunu ispat yükü altındadır.","D":"İspat yükü, zarar görenin değil zarar verenin kusursuzluğunu ispatlamasını gerektirecek biçimde ona aittir.","B":"Zarar miktarı tam olarak ispat edilemiyorsa hâkim, davayı ispat yetersizliği nedeniyle reddetmek zorundadır."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027na göre haksız fiilde ispat yükü ve hâkimin takdir yetkisi ile ilgili aşağıdakilerden hangisi HER ZAMAN doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-25","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.50, m.65","dogru":"A","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Ahmet, komşusunun bahçe duvarını arabasıyla yıkıyor, duvar sahibi 8.000 lira zarar olduğunu söylüyor ama faturaların bir kısmı kaybolmuş.","anlatim":"Duvar sahibi mahkemeye gidiyor, elinde tam faturası olmayan bir zarar var. Ahmet ise \u0027kusurum yok, ispat sen bende değil\u0027 diyor. Bu tartışma haksız fiil ispat kurallarının tam ortasında geçiyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.50 zarar göreni ispat yükü altında bırakır, miktar belirsizse hâkime hakkaniyet yetkisi verir; m.65 ayırt etme gücü olmayanı hakkaniyetle sorumlu tutabilir.","anlatim":"Bu üç kural sabit: ispat zarar görende, miktar takdiri hâkimde, ayırt etme gücü yoksa hakkaniyet kapısı açık. Şimdi beş ifadeyi bu duvar olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.50/1","karar":"doğru","anlatim":"Duvar sahibi kanıt getirmezse davayı kaybeder, çünkü ispat yükü ona ait. Bu kural haksız fiilde her olayda aynen geçerlidir, istisnası yoktur.","formul":"Şık A: duvar sahibi hem zararı hem Ahmet\u0027in kusurunu ispat etmek zorunda mı, yoksa mahkeme bunu kendisi mi araştırır?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.50/2","karar":"yanlış","anlatim":"Hâkim, duvarın olağan tamirat masraflarını ve komşunun aldığı önlemleri düşünerek 8.000 lirayı hakkaniyete göre belirleyebilir. Ret zorunluluğu yok, takdir yetkisi var.","formul":"Şık B: faturalar eksik olduğu için hâkim davayı otomatik reddetmek zorunda mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.65","karar":"yanlış","anlatim":"Hâkim, hakkaniyet gerektiriyorsa bu çocuğun verdiği zararı tamamen ya da kısmen giderilmesine karar verebilir. Yani \u0027hiçbir şekilde\u0027 sözü kanunla çelişir.","formul":"Şık C: arabayı süren kişi 14 yaşında ayırt etme gücü olmayan biri olsaydı, zarar hiçbir şekilde giderilemez miydi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.50/1","karar":"yanlış","anlatim":"Kanun açıkça zarar göreni yükümlü kılar, Ahmet\u0027i değil. Kusursuzluk karinesi bu genel kuralda yoktur.","formul":"Şık D: ispat yükü aslında Ahmet\u0027e mi ait, yani Ahmet kendi kusursuzluğunu mu kanıtlamalı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.50/2","karar":"yanlış","anlatim":"m.50/2 sadece zararın miktarına hakkaniyet yetkisi tanır, kusurun varlığına değil. Kusuru ispatlamak yine duvar sahibinin işidir.","formul":"Şık E: duvar sahibi kusuru ispat edemezse hâkim hem miktarı hem kusurun varlığını mı hakkaniyetle belirler?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"İspat yükü hep zarar görende, hâkimin hakkaniyet yetkisi sadece miktarda geçerli. Kendine sor: bu hakkaniyet yetkisi kusuru mu belirliyor, yoksa yalnız zararın rakamını mı?","doldur":[]}],"anahtar":[{"ornek":"kusuru","kok":"kusuru"},{"ornek":"hakkaniyet","kok":"hakkan"},{"ornek":"yetkisi","kok":"yetkis"},{"ornek":"zararını","kok":"zararı"},{"ornek":"miktarında","kok":"miktar"},{"ornek":"yoktur","kok":"yoktur"}],"konuGiris":{"harita":"Ne zaman devreye girer: zarar görenin zararını tam olarak ispatlayamadığı durumlarda devreye girer. Nasıl ölçülür: hâkim olayların olağan akışı ve zarar görenin aldığı önlemler dikkate alınarak hakkaniyete uygun biçimde belirler. Nasıl kaydedilir: mahkeme kararında gerekçeli bir miktar olarak yer alır.","desen":"Soru genellikle \u0027ispat yükü kime aittir\u0027 ile \u0027hâkim ne zaman takdir yetkisi kullanır\u0027 ayrımını karıştırır. Tuzak, hâkimin her zaman takdir yetkisi olduğunu düşündürmektir; oysa yalnız miktar tam ispatlanamazsa devreye girer. Bu soru m.50 hükmündeki iki cümlenin birbirine karıştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"zararını ve kusuru kanıtlama sorumluluğu","ad":"ispat yükü","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"zarar görenin uğradığı kaybın parasal karşılığı","ad":"zarar miktarı","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"kesin ispat olmayınca hâkimin adil ölçüyle karar vermesi","ad":"hakkaniyet","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"olayların normal şartlarda nasıl gelişeceğinin değerlendirilmesi","ad":"olağan akış","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda bir olay anlatılır ve ispat yükünün kime ait olduğu ile hâkimin ne zaman takdir kullanabileceği sorulur.","panel_ornek":"Bir arkadaşın bisikletine çarpıp kırdığını iddia ediyorsun ama tamir faturasını tam çıkaramıyorsun; 40 lira mı 60 lira mı emin değilsin. İşte böyle durumlarda hâkim, olayın akışına bakarak makul bir tutara karar verir. Yani belirsizlik seni tamamen çaresiz bırakmaz.","ornek":"Bir arkadaşın bisikletine çarpıp kırdığını iddia ediyorsun ama tamir faturasını tam çıkaramıyorsun; 40 lira mı 60 lira mı emin değilsin. İşte böyle durumlarda hâkim, olayın akışına bakarak makul bir tutara karar verir. Yani belirsizlik seni tamamen çaresiz bırakmaz.","yontemler":"Önce kimin ispat yükü altında olduğunu belirle, sonra miktar ispatlanamıyorsa hâkimin devreye girdiğini hatırla; bu iki durumu asla birleştirme.","nedir":"Haksız fiilde zarar gören, hem zararını hem karşı tarafın kusurunu kanıtlamakla yükümlüdür. Sınav, bu yükün kime ait olduğunu ve miktar belirsizse hâkimin ne yapacağını ölçer."},"olay":"","tuzak":{"C":{"ad":"Mutlaklaştırma Tuzağı","metin":"öğrenci, ayırt etme gücü olmayanın verdiği zararın kesinlikle tazmin edilemeyeceğini düşünür. Doğrusu: Türk Borçlar Kanunu m.65 hakkaniyet gerektiriyorsa hâkimin bu zararın tamamen veya kısmen giderilmesine karar verebileceğini düzenler."},"E":{"ad":"Kapsam Genişletme Tuzağı","metin":"öğrenci hâkimin hakkaniyet yetkisini kusura da uygulandığını sanır. Doğrusu: Türk Borçlar Kanunu m.50/2 yalnız zarar miktarının hakkaniyete göre belirlenmesini düzenler, kusurun varlığı yine ispat edilmelidir."},"D":{"ad":"İspat Yükü Ters Çevirme Tuzağı","metin":"öğrenci ispat külfetinin zarar verende olduğunu sanır. Doğrusu: Türk Borçlar Kanunu m.50/1 ispat yükünü açıkça zarar görene yükler, zarar veren kusursuzluğunu ispatla yükümlü tutulmamıştır."},"B":{"ad":"Zarar Miktarı Tuzağı","metin":"öğrenci, miktar tam ispatlanamayınca davanın reddedileceğini sanır. Doğrusu: Türk Borçlar Kanunu m.50/2 hâkime, olayların olağan akışını ve zarar görenin aldığı önlemleri gözeterek zararı hakkaniyete uygun belirleme yetkisi verir, ret zorunlu değildir."}},"celdiriciYol":{},"hap":"Haksız fiilde zarar gören zararını ve kusuru ispatla yükümlüdür; hâkimin hakkaniyet yetkisi yalnız zarar miktarında ve ayırt etme gücü olmayanın sorumluluğunda devreye girer, kusurun ispatını kaldırmaz.","teshis":{"C":{"gercek":"Türk Borçlar Kanunu m.65 hakkaniyet gerektiriyorsa hâkimin bu kişinin verdiği zararın tamamen veya kısmen giderilmesine karar verebileceğini öngörür.","ayirt":"Kanun burada \u0027asla\u0027 mı diyor yoksa hâkime \u0027hakkaniyet gerektirirse\u0027 şeklinde bir kapı mı açıyor?","paragraf":"TBK m.65","yanilgi":"Ayırt etme gücü olmayanın hiçbir şekilde sorumlu tutulamayacağını mutlak bir kural sanıyorsun."},"E":{"gercek":"Türk Borçlar Kanunu m.50/2 metni yalnızca \u0027zararın miktarı\u0027ndan söz eder; kusurun ispatı m.50/1\u0027in konusu olarak zarar görende kalır.","ayirt":"m.50/2 hükmü hangi unsuru düzenliyor: kusuru mu, yoksa zarar miktarını mı?","paragraf":"TBK m.50/2","yanilgi":"Hâkimin hakkaniyet yetkisinin miktar dışında kusurun varlığını da kapsadığını sanıyorsun."},"A":{"gercek":"Türk Borçlar Kanunu m.50/1 ispat yükünü koşulsuz zarar görene verir; miktar konusundaki esneklik (m.50/2) bu kuralı kaldırmaz, sadece miktarın belirlenme biçimini etkiler.","ayirt":"Bu istisna ispat yükünü mü değiştiriyor, yoksa yalnız miktarın belirlenme yöntemini mi?","paragraf":"TBK m.50/1","yanilgi":"Bu ilkenin bir istisnası olduğunu, dolayısıyla \u0027her zaman\u0027 ifadesinin yanlış olacağını düşünüyorsun."},"D":{"gercek":"Türk Borçlar Kanunu m.50/1 açıkça zarar göreni ispat yükü altında bırakır; kusursuzluk karinesi haksız fiilin genel kuralında yer almaz.","ayirt":"Madde metninde ispat yükünü taşıyan taraf olarak kim açıkça isimlendiriliyor?","paragraf":"TBK m.50/1","yanilgi":"İspat yükünün, zayıf tarafı korumak adına zarar verene geçtiğini sanıyorsun."},"B":{"gercek":"Türk Borçlar Kanunu m.50/2 hâkime hakkaniyete uygun miktar belirleme yetkisi tanır, ret zorunluluğu yoktur.","ayirt":"Kanun hâkime burada bir takdir yetkisi mi veriyor yoksa bir ispat şartı mı koyuyor?","paragraf":"TBK m.50/2","yanilgi":"Miktar tam ispatlanamayınca hâkimin elini kolunu bağlı sanıp davanın otomatik reddedileceğini düşünüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 129"},"kural":"Hayvan bulunduran, özen ispatı yoksa zararı gidermekle yükümlüdür; zarar başka hayvan/kişinin tedirginliğinden doğmuşsa bulunduranın o kişiye rücu hakkı saklıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 129","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Sorumluluk ile rücu hakkını iki ayrı kural gibi oku; biri diğerini otomatik olarak ortadan kaldırmaz.","konu":"hayvan bulunduran sorumluluğu","tablo":{"satirlar":[["A) Hayvanı bulunduran zarardan sorumlu değildir; sorumluluk…","m.67 f.1","YANLIŞ ifade"],["B) Hayvanı bulunduran zararı gidermekle yükümlüdür, ancak h…","m.67 f.3","YANLIŞ ifade"],["C) Hayvanı bulunduran zararı gidermekle yükümlüdür ve hayva…","m.67","doğru ifade"],["D) Hayvanı bulunduran zararı gidermekle yükümlü olmakla bir…","m.67 f.3","YANLIŞ ifade"],["E) Hayvanı bulunduran, gerekli özeni gösterdiğini ispatlaya…","m.67 f.2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Hayvanı bulunduran zararı gidermekle yükümlüdür ve hayvanı tedirgin eden kişiye karşı rücu hakkına sahiptir.","E":"Hayvanı bulunduran, gerekli özeni gösterdiğini ispatlayamadığından zararın iki katını tazminle yükümlü olur ve rücu hakkını kaybeder.","A":"Hayvanı bulunduran zarardan sorumlu değildir; sorumluluk doğrudan hayvanı tedirgin eden üçüncü kişiye aittir.","D":"Hayvanı bulunduran zararı gidermekle yükümlü olmakla birlikte, rücu hakkını ancak tedirgin eden kişi hakkında ceza davası açılması şartıyla kullanabilir.","B":"Hayvanı bulunduran zararı gidermekle yükümlüdür, ancak hayvanı tedirgin eden kişiye karşı herhangi bir rücu hakkı bulunmamaktadır."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"Bir kişinin hayvanı, başkasına ait bir hayvan tarafından tedirgin edilerek üçüncü kişiye zarar vermiş, hayvanı bulunduran gerekli özeni gösterdiğini ispatlayamamıştır. Bu durumda hayvan bulunduranın sorumluluğuna ilişkin olarak aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-26","verilenler":[],"dayanak":"6098 sayılı Türk Borçlar Kanunu m.67","dogru":"C","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Necati\u0027nin bahçesinde bağlı köpeği, komşunun kedisi tarafından ürkütülüp ipini koparıyor ve sokakta 4.000 TL değerinde bir bisikleti parçalıyor.","anlatim":"Necati köpeğe gerekli özeni gösterdiğini ispatlayamıyor. Zarar aslında kedinin ürkütmesinden doğmuş.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.67\u0027ye göre Necati bisiklet sahibine 4.000 TL öder, sonra kediyi bulundurana rücu edebilir mi diye bakacağız.","anlatim":"Kural tek: bulunduran öder, özen ispatı yoksa sorumluluk devam eder, tetikleyene rücu hakkı saklıdır. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.67 f.1","karar":"yanlış","anlatim":"Hayır, ürüten üçüncü kişi olsa da köpeğin bakımını üstlenen Necati\u0027dir. m.67 f.1 bulunduranı doğrudan sorumlu tutar.","formul":"Şık A: Necati sana \u0027köpeği ben büyütmedim ki, kedi ürküttü, ben sorumlu değilim\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.67 f.3","karar":"yanlış","anlatim":"Hayır, kanun tam tersini söyler: tetikleyen hayvana rücu hakkı saklıdır. Ödeme yükümü rücu hakkını silmez.","formul":"Şık B: Necati bisikletçiye ödeme yapıyor ama \u0027kediye rücu edemem\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.67","karar":"doğru","anlatim":"Evet, tam kanunun dediği bu: önce zarar giderilir, sonra tetikleyene dönülür. İki hak aynı anda var olur.","formul":"Şık C: Necati \u0027bisikletçiye öderim, sonra kediyi bulundurana rücu ederim\u0027 diyor, bu doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.67 f.3","karar":"yanlış","anlatim":"Hayır, madde metninde böyle bir şart yok. Rücu hakkı doğrudan doğar, dava şartına bağlı değildir.","formul":"Şık D: Necati \u0027rücu edebilmem için önce kedinin sahibi hakkında ceza davası açılmalı\u0027 diyor, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.67 f.2","karar":"yanlış","anlatim":"Hayır, kanunda iki kat tazminat ya da rücu hakkının kaybı diye bir düzenleme yok. Özen ispatı başarısızsa sadece sorumluluk devam eder.","formul":"Şık E: Necati özen ispatı yapamadığı için \u0027iki katını öderim ve rücu hakkımı kaybederim\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Bulunduran her zaman öder ama rücu hakkı ayrı bir hak olarak yaşamaya devam eder. Kendine sor: metinde ödeme yükümü ile rücu hakkı aynı cümlede mi geçiyor?","doldur":[]}],"anahtar":[{"ornek":"bulunduran","kok":"bulund"},{"ornek":"hayvan","kok":"hayvan"},{"ornek":"saklıdır","kok":"saklıd"},{"ornek":"ispatıyla","kok":"ispatı"},{"ornek":"tetikleyene","kok":"tetikl"},{"ornek":"sorumluluk","kok":"soruml"}],"konuGiris":{"harita":"Ne zaman uygulanır: hayvanın verdiği zarar üçüncü kişiye ulaştığında uygulanır. Nasıl değerlendirilir: hayvan bulunduranın gerekli özeni gösterip göstermediği ispat yoluyla belirlenir. Nasıl sonuçlanır: özen ispatlanamazsa sorumluluk doğar ve zararı başlatan üçüncü kişiye rücu hakkı saklı kalır.","desen":"Soru, hayvan bulunduranın özen ispatını başaramaması ile sorumluluğun doğması bağlantısını sorar. Tuzak, ürküten hayvanın sahibine rücu hakkının sorumluluğu ortadan kaldırmadığını, sadece iç ilişkide geri alma imkânı verdiğini karıştırtmaktır. Bu soru Türk Borçlar Kanunu m.67 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"hayvanın bakım ve yönetimini sürekli veya geçici üstlenen kişi","ad":"hayvan bulunduran","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"kusur aranmaksızın zarardan sorumlu tutulma hâli","ad":"kusursuz sorumluluk","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"zararı engellemek için gerekli dikkatin gösterildiğinin kanıtlanması","ad":"özen ispatı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"ödenen zararın gerçek sebep olana geri istenmesi hakkı","ad":"rücu hakkı","kim":"kanun sabitler"}],"sinavda":"Olayda hayvan bulunduranın özen ispatı başarısız olduğu belirtilerek sorumluluğunun ve rücu hakkının niteliği sorulur.","panel_ornek":"Ali\u0027nin köpeği, komşusunun tavuğundan ürken bir kediyle karşılaşınca kaçıp bir yayaya çarpıp düşürdü. Ali, köpeğini bahçede iyi bağladığını ispat edemedi ve yayanın 3 lira değerindeki gözlüğünün kırılmasından sorumlu tutuldu; ama isterse köpeği ürküten kedinin sahibine de rücu edebilir.","ornek":"Ali\u0027nin köpeği, komşusunun tavuğundan ürken bir kediyle karşılaşınca kaçıp bir yayaya çarpıp düşürdü. Ali, köpeğini bahçede iyi bağladığını ispat edemedi ve yayanın 3 lira değerindeki gözlüğünün kırılmasından sorumlu tutuldu; ama isterse köpeği ürküten kedinin sahibine de rücu edebilir.","yontemler":"Önce hayvan bulunduranın özeni ispatlayıp ispatlayamadığına bakılır; ispatlanamazsa sorumluluk doğar ve üçüncü kişiye rücu hakkı ayrıca değerlendirilir.","nedir":"Hayvan bulunduranın sorumluluğu, hayvanın verdiği zararlardan hayvan sahibinin ya da bakıcının kusursuz olarak sorumlu tutulmasını düzenler. Sınav, bu sorumluluktan kurtulma şartlarını ve üçüncü kişilere rücu hakkını ölçer."},"olay":"","tuzak":{"D":{"ad":"Şart Uydurma Tuzağı","metin":"Öğrenci rücu hakkını kanunda bulunmayan bir ön koşula (ceza davası) bağlıyor. Doğrusu: Rücu hakkı, ayrı bir ceza yargılaması şartına bağlanmaksızın kanundan doğar."},"E":{"ad":"Yaptırım Uydurma Tuzağı","metin":"Öğrenci ispat edememeyi ağırlaştırılmış bir yaptırıma (iki kat tazmin) ve hak kaybına dönüştürüyor. Doğrusu: İspat edememe yalnız sorumluluğun devamı sonucunu doğurur, tazminat katlanmaz ve rücu hakkı düşmez."},"A":{"ad":"İlliyet Tuzağı","metin":"Zararı bizzat veren hayvanın bulunduranı, olayın tetikleyicisi başka bir hayvan/kişi olsa da kanundaki kusursuz sorumluluktan kurtulmaz. Doğrusu: Bulunduran yine de zararı gidermekle yükümlüdür."},"B":{"ad":"Rücu Yokmuş Tuzağı","metin":"Öğrenci sorumluluğu kabul edip rücu hakkını ayrı bir hak olarak görmüyor. Doğrusu: Kanun, tedirgin eden kişiye karşı bulunduranın rücu hakkını açıkça saklı tutar."}},"celdiriciYol":{},"hap":"Hayvan bulunduran, özen ispatıyla kurtulmadıkça zararı gidermekle yükümlüdür; zarar başka hayvan/kişinin tedirginliğinden doğmuşsa bulunduranın o kişiye karşı rücu hakkı saklıdır.","teshis":{"C":{"gercek":"Kanun iki sonucu birlikte düzenler: bulunduran zararı öder, ayrı olarak tedirgin edene rücu edebilir; biri diğerini engellemez.","ayirt":"Ödeme yükümü ile rücu hakkı aynı anda var olabilir mi?","paragraf":"TBK m.67","yanilgi":"Rücu hakkının bağımsız bir hak değil, sorumluluğu ortadan kaldıran bir savunma olduğunu sanıyorsun."},"E":{"gercek":"Özen ispatının başarısız olması yalnız sorumluluğun devamı anlamına gelir; kanun iki kat tazminat ya da rücu hakkının kaybını düzenlemez.","ayirt":"Metinde \u0027iki kat\u0027 ya da \u0027hak kaybı\u0027 ifadesi geçiyor mu?","paragraf":"TBK m.67 f.2","yanilgi":"İspat edilemeyen özeni, tazminatı katlayan ayrı bir yaptırım sanıyorsun."},"A":{"gercek":"6098 sayılı Türk Borçlar Kanunu m.67 hayvan bulunduranın sorumluluğunu kusursuz esasa bağlar; tetikleyici bir üçüncü kişi olsa da bulunduranın yükümlülüğü devam eder.","ayirt":"Zararı veren hayvanın bakımını kim üstlenmişti, sorumluluk ondan mı kalkıyor?","paragraf":"TBK m.67 f.1","yanilgi":"Zararı asıl doğuran hayvanın davranışını tetikleyen üçüncü kişi olunca bulunduranın sorumluluğunun kalktığını düşünüyorsun."},"D":{"gercek":"Madde metninde rücu hakkı herhangi bir dava şartına bağlanmamıştır, doğrudan doğar.","ayirt":"Metinde \u0027ceza davası açılırsa\u0027 ifadesi var mı?","paragraf":"TBK m.67 f.3","yanilgi":"Rücu hakkının kullanılmasını kanunda olmayan bir usul şartına (ceza davası) bağlıyorsun."},"B":{"gercek":"Aynı madde, hayvanın başka bir kişi veya hayvan tarafından tedirgin edilmesi halinde bulunduranın o kişiye rücu hakkını saklı tutar.","ayirt":"Sorumluluk ile rücu hakkı aynı cümlede mi, yoksa biri diğerini mi siler?","paragraf":"TBK m.67 f.3","yanilgi":"Sorumluluğu kabul edince rücu hakkının ayrı ve bağımsız bir hak olduğunu unutuyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 129"},"kural":"madde, zarar görenin fiile rıza göstermesi, zararın doğmasında ya da artmasında etkili olması veya yükümlünün durumunu ağırlaştırması hâllerinde hâkime tazminatı indirme VEYA TAMAMEN KALDIRMA yetkisi tanır; bu üç hâl aynı fıkrada birlikte düzenlenmiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 129","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde iki ayrı fıkra ve iki ayrı hukuki sonuç (indirim/kaldırma - yalnız indirim) içerir; şıkta hangi hâlin hangi sonuca bağlandığına dikkat et.","konu":"haksız fiil tazminat indirimi","tablo":{"satirlar":[["VERİLENLER","-","-"],["Türk Borçlar Kanunu madde numarası","52","-"],["HESAP","-","-"],["A) Zarar görenin, zararın doğmasında ya da artmasında etkil…","p.p.52/1","doğru ifade"],["B) Zarara hafif kusuruyla sebep olan yükümlünün, tazminatı …","p.52/2","YANLIŞ ifade"],["C) Zarara ağır kusuruyla sebep olan tazminat yükümlüsü de y…","p.52/2","YANLIŞ ifade"],["D) Tazminat yükümlüsünün durumunun zarar gören tarafından a…","p.52/1","YANLIŞ ifade"],["E) Zarar görenin, zararı doğuran fiile rıza göstermiş olmas…","p.52/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Zarara ağır kusuruyla sebep olan tazminat yükümlüsü de yoksulluğa düşecek olması hâlinde tazminattan indirim talep edebilir.","E":"Zarar görenin, zararı doğuran fiile rıza göstermiş olması, hâkimin tazminattan indirim yapmasında dikkate alınamaz.","A":"Zarar görenin, zararın doğmasında ya da artmasında etkili olması hâlinde hâkim, tazminatı indirebileceği gibi tamamen de kaldırabilir.","D":"Tazminat yükümlüsünün durumunun zarar gören tarafından ağırlaştırılmış olması, hâkimin tazminattan indirim yapmasına imkân vermez.","B":"Zarara hafif kusuruyla sebep olan yükümlünün, tazminatı ödediğinde yoksulluğa düşecek olması ve hakkaniyetin gerektirmesi hâlinde hâkim, tazminatı tamamen kaldırabilir."},"kaynak":{"alinti":"","liste":[],"hakem":""},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":[]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027nun 52 nci maddesinde düzenlenen tazminattan indirim hâllerine ilişkin olarak aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-borclar-cokzor/kp-28","verilenler":[{"deger":"52","anlam":"Tazminattan indirim hallerinin düzenlendiği kanun maddesinin sıra numarası; soruda hangi hukuki düzenlemenin uygulanacağını belirler.","ad":"Türk Borçlar Kanunu madde numarası"}],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.52","dogru":"A","oyunBonus":null,"ders":"Borclar Hukuku|Ticaret ve Borclar","adimlar":[{"formul":"Olay: Bir kamyon şoförü olan Kemal, gece yorgun olmasına rağmen yola devam ediyor ve karşıdan gelen bir araçla çarpışıyor. Karşı araçtaki yolcu, kemerini takmadığı için yaralanması ağırlaşıyor ve 80.000 TL zarara uğruyor. Mahkeme, Kemal\u0027in ödeyeceği tazminatı belirlerken bu olayı değerlendiriyor.","anlatim":"Bu olay basit: hem Kemal kusurlu, hem zarar gören kendi davranışıyla zararını büyütmüş. Ne yapacağız: kaçırma.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu madde 52, zarar görenin rızası, zararın doğmasında/artmasında etkisi ya da yükümlünün durumunu ağırlaştırması hâllerinde hâkime indirim VEYA tam kaldırma yetkisi verir; ayrıca hafif kusurlu yükümlünün yoksulluğa düşmesi hâlinde ayrı bir indirim imkânı vardır. Kemal\u0027in olayında beş ifadeyi tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"p.p.52/1","karar":"doğru","anlatim":"Madde açıkça \u0027indirebilir veya tamamen kaldırabilir\u0027 der, bu üç hâl için ikisi de mümkün. Kemal\u0027in olayında zarar görenin katkısı ağırsa hâkim tazmina
