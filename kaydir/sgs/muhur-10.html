const SORULAR=[{"capa":{"kaynak":"SGS 2025/1 Soru 123"},"kural":"m.618/3-c uyarınca sözleşmenin sayıya göre oy hakkı belirlemesine ilişkin hüküm sorumluluk davası açılması kararında UYGULANMAZ, yani oy yine itibari değere göre kullanılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 123","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"m.618/3\u0027teki üç istisnayı (denetçi seçimi, özel denetçi seçimi, sorumluluk davası) tek grupta ezberle; bu üçünde her zaman itibari değere dönülür.","konu":"limited şirket ozellikleri","tablo":{"satirlar":[["A) Bir ortağın şirket sözleşmesinde öngörülen bir sebepten …","m.616/2-f","doğru ifade"],["B) Bir ortağın şirketten çıkarılması için mahkemeden istemd…","m.616/1-h","doğru ifade"],["C) Denetçilerin seçiminde oy hakkı, şirket sözleşmesinde es…","m.618/3-a","doğru ifade"],["D) Şirket sözleşmesi, itibari değerden bağımsız olarak her …","m.618/2","doğru ifade"],["E) Sorumluluk davası açılması hakkında karar alınırken de o…","m.618/3-c","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Denetçilerin seçiminde oy hakkı, şirket sözleşmesinde esas sermaye paylarının sayısına göre belirlenmiş olsa dahi itibari değere göre kullanılır.","E":"Sorumluluk davası açılması hakkında karar alınırken de oy hakkı, sözleşmede öngörülmüş olsa bile esas sermaye paylarının sayısına göre kullanılır.","A":"Bir ortağın şirket sözleşmesinde öngörülen bir sebepten dolayı şirketten çıkarılmasına karar verilmesi, ancak bu husus şirket sözleşmesinde öngörülmüşse genel kurulun devredilemez yetkisidir.","D":"Şirket sözleşmesi, itibari değerden bağımsız olarak her esas sermaye payına bir oy hakkı tanıyabilir; ancak bu halde en küçük payın itibari değeri diğer payların toplamının onda birinden az olamaz.","B":"Bir ortağın şirketten çıkarılması için mahkemeden istemde bulunulmasına karar verilmesi, şirket sözleşmesinde ayrıca öngörülmese dahi genel kurulun devredilemez yetkisidir."},"kaynak":{"alinti":"sorumluluk davası açılması hakkında karar verilmesi","liste":[{"ad":"TTK (6102 s.K.) m.616 [1/2]","metin":"MADDE 616- (1) Genel kurulun devredilemez yetkileri şunlardır: a) Şirket sözleşmesinin değiştirilmesi. b) Müdürlerin atanmaları ve görevden alınmaları. c) Topluluk denetçisi ile (…)91 denetçilerin atanmaları ve görevden alınmaları. 26/6/2012 tarihli ve 6335 sayılı Kanunun 41 inci maddesiyle, bu bentte yer alan “işlem denetçileri de dâhil olmak üzere,” ibaresi madde metninden çıkarılmıştır. 91 d) Topluluk yılsonu finansal tabloları ile yıllık faaliyet raporunun onaylanması. e) Yılsonu finansal tablolarının ve yıllık faaliyet raporunun onaylanması, kâr payı hakkında karar verilmesi, kazanç paylarının belirlenmesi. f) Müdürlerin ücretlerinin belirlenmesi ve ibraları. g) Esas sermaye paylarının devirlerinin onaylanması. h) Bir ortağın şirketten çıkarılması için mahkemeden istemde bulunulması.92 ı) Müdürün, şirketin kendi paylarını iktisabı konusunda yetkilendirilmesi veya böyle bir iktisabın onaylanması. i) Şirketin feshi. j) Genel kurulun kanun veya şirket sözleşmesi ile yetkilendirildiği ya da müdürlerin genel kurula sunduğu konularda karar verilmesi. (2) Aşağıda sayılanlar, şirket sözleşmesinde öngörüldükleri takdirde genel kurulun devredilemez yetkileridir: a) Şirket sözleşmesi uyarınca genel kurulun onayının arandığı hâller ile müdürlerin faaliyetlerinin onaylanması. b) Önerilmeye muhatap olma, önalım, geri alım ve alım haklarının kullanılması hakkında karar verilmesi. c) Esas sermaye payları üzerinde rehin hakkı kurulmasına ilişkin onayın verilmesi. d) Yan edim yükümlülükleri hakkında iç yönerge çıkarılması."},{"ad":"TTK (6102 s.K.) m.616 [2/2]","metin":"e) Şirket sözleşmesinin 613 üncü maddenin dördüncü fıkrası uyarınca ortakların onayını yeterli görmemesi hâlinde, müdürlerin ve ortakların şirkete karşı bağlılık yükümü veya rekabet yasağı ile bağdaşmayan faaliyetlerde bulunabilmelerinin onayı için gereken iznin verilmesi. f) Bir ortağın şirket sözleşmesinde öngörülen sebeplerden dolayı şirketten çıkarılması. (3) Tek ortaklı limited şirketlerde, bu ortak genel kurulun tüm yetkilerine sahiptir. Tek ortağın genel kurul sıfatıyla alacağı kararların geçerlilik kazanabilmeleri için yazılı olmaları şarttır. II - Genel kurulun toplanması 1. Çağrı"}],"hakem":"TTK m.618/3-c açıkça \u0027sorumluluk davası açılması hakkında karar verilmesi\u0027nde sayıya göre oy belirleme hükmünün uygulanmayacağını düzenler; doğru sık (E) bu kuralı ters çevirerek sayıya göre oy kullanılacağını iddia ettiğinden yanlıştır."},"kayitlar":[],"sade":{"siklar":{"C":"C doğrudur. Kanun denetçi seçiminde oy hakkının pay sayısına göre belirlenmesine ilişkin sözleşme hükmünü uygulamaz; itibarî değere dönülür.","E":"E yanlıştır. Sorumluluk davası kararında oy hakkı itibarî değere göre kullanılır; pay sayısına göre değil. Kanun bunu açıkça istisnai hallerde uygulanmayacak kurallar arasında saymıştır.","A":"A doğrudur. Kanun, şirketten çıkarma yetkisini sözleşmede öngörülen sebeplerle sınırlandırmış ve bunu genel kurulun devredilemez yetkisi saymıştır.","D":"D doğrudur. Şirket sözleşmesi her pay başına bir oy hakkı belirleyebilir; ancak en küçük payın itibarî değeri diğerlerinin toplamının onda birinden az olamaz.","B":"B doğrudur. Mahkemeden istemde bulunulması yetkisi sözleşme şartı aranmaksızın mutlak olarak genel kurulun devredilemez yetkileri arasında yer almıştır."},"dogru":"E seçeneği yanlıştır çünkü kanun sorumluluk davası açılması kararında oy hakkının pay sayısına göre değil, itibarî değere göre kullanılacağını belirtmiştir. E seçeneği bunun tersini söylüyor.","sinav":"Türk Ticaret Kanunu 618. madde üçüncü fıkrası uyarınca oy hakkının esas sermaye paylarının sayısına göre belirlenmesine ilişkin şirket sözleşmesi hükmü sorumluluk davası açılması kararında uygulanmaz.","kavramlar":[{"kaynak":"Türk Ticaret Kanunu 616. madde","tanim":"Limited şirkette genel kurula ait olup hiçbir koşulda başka organa devredilemeyecek kararlar. Bunların bir kısmı kanunla belirlenmiş, bir kısmı da şirket sözleşmesinde öngörülmüş olmalıdır.","ad":"Genel kurulun devredilemez yetkileri"},{"kaynak":"Türk Ticaret Kanunu 618. madde","tanim":"Ortakların genel kurul toplantılarında oy kullanarak kararlara katılma hakkı. Temel kural olarak esas sermaye paylarının itibarî değerine göre hesaplanır.","ad":"Oy hakkı"},{"kaynak":"Türk Ticaret Kanunu 618. madde","tanim":"Esas sermaye paylarının kanun veya sözleşmede belirtilen nominal değeri. Oy hakkı hesaplamasında esas alınan değerdir.","ad":"İtibarî değer"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/1","2020/2"]},"oyun":null,"tip":"teori","soru":"Bir limited şirkette genel kurulun devredilemez yetkileri ile ortakların oy hakkının kullanımına ilişkin aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-ticaret-zor/kp-11","verilenler":[],"dayanak":"Türk Ticaret Kanunu m.616 ve m.618","dogru":"E","oyunBonus":null,"ders":"Ticaret Hukuku","adimlar":[{"formul":"Olay: Bir limited şirkette ortak Zeynep, kurucu müdür Ahmet aleyhine 2.400.000 TL zarar iddiasıyla sorumluluk davası açılması için genel kurulu topluyor.","anlatim":"Şirket sözleşmesinde her esas sermaye payına bir oy hakkı tanınmış ve en küçük pay diğerlerinin toplamının onda birinden az değil. Genel kurulda hem çıkarma kararları hem oy hesabı tartışılıyor.","doldur":[]},{"formul":"Ne yapacağız: m.616 ve m.618\u0027e göre hangi kararlar genel kurulun devredilemez yetkisi, oy hakkı ne zaman itibari değere döner bunu bu olayda göreceğiz.","anlatim":"Bazı yetkiler sözleşme şartı arar, bazıları mutlaktır; oy hakkı kuralı da üç istisnada sayıya göre işlemez. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.616/2-f","karar":"doğru","anlatim":"Hayır, bu yetki ancak sözleşmede öngörülmüşse genel kurula aittir. Şart yoksa devredilemez yetki de yoktur.","formul":"Şık A: Zeynep\u0027i sözleşmede yazılı bir sebepten çıkarma kararı sözleşmede öngörülmemişse genel kurulun devredilemez yetkisi olur mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.616/1-h","karar":"doğru","anlatim":"Evet, bu karar sözleşme şartı aranmaksızın doğrudan mutlak devredilemez yetkidir. Sözleşmede yazılı olması gerekmez.","formul":"Şık B: Ahmet\u0027i mahkemeden istemle çıkarma kararı, sözleşmede yazmasa bile genel kurulun devredilemez yetkisi midir?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.618/3-a","karar":"doğru","anlatim":"Evet, denetçi seçimi üç istisnadan biridir ve sayıya göre oy hükmü burada uygulanmaz. Oy yine itibari değere döner.","formul":"Şık C: Denetçi seçiminde oy, sözleşme sayıya göre belirlemişse yine itibari değere göre mi kullanılır?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.618/2","karar":"doğru","anlatim":"Evet, sözleşme böyle bir sistem kurabilir ama en küçük payın itibari değeri diğerlerinin toplamının onda birinden az olamaz. Olayımızdaki sözleşme tam bu sınırı korumuş.","formul":"Şık D: Sözleşme, itibari değerden bağımsız her paya bir oy tanıyabilir mi, en küçük payın sınırı var mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.618/3-c","karar":"yanlış","anlatim":"Hayır, sorumluluk davası da üç istisnadan biridir ve sayıya göre oy hükmü burada da uygulanmaz. Oy yine itibari değere göre kullanılır.","formul":"Şık E: Zeynep\u0027in açtığı sorumluluk davası kararında oy, sözleşmede öngörülmüşse sayıya göre mi kullanılır?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Sorumluluk davası, denetçi seçimi ve özel denetçi seçimi kararlarında sözleşmenin sayı esaslı oy sistemi devre dışı kalır, itibari değer geri gelir. Kendine sor: bu karar m.618/3\u0027teki üç istisna listesinde mi?","doldur":[]}],"anahtar":[{"ornek":"sözleşme","kok":"sözleş"},{"ornek":"itibari","kok":"itibar"},{"ornek":"denetçi","kok":"denetç"},{"ornek":"sayıya","kok":"sayıya"},{"ornek":"seçimi","kok":"seçimi"},{"ornek":"istisnada","kok":"istisn"}],"konuGiris":{"harita":"Ne zaman test edilir: genel kurulun hangi kararları devredemeyeceği sorulduğunda. Nasıl ölçülür: madde metnindeki yetki listesiyle şıklardaki ifade karşılaştırılarak. Nasıl kaydedilir: oy hakkı esas sermaye payının itibari değerine göre hesaplanıp kayda geçirilir.","desen":"Sınav genellikle m.616\u0027daki devredilemez yetki listesinden birini şirket sözleşmesiyle devredilebilirmiş gibi göstererek yanıltır. Diğer tuzak, m.618\u0027deki 25 TL\u0027lik oy birimini veya denetçi seçiminde pay sayısına göre oy kuralının uygulanmayacağını karıştırmaktır. Bu soru m.616 ve m.618 maddelerinin birleştirilmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Genel kurulun başka organa bırakamayacağı karar konusu","ad":"Devredilemez yetki","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Ortağın şirkete koyduğu sermayeyi temsil eden pay tutarı","ad":"Esas sermaye payı","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Her yirmi beş liralık payın verdiği tek oy hakkı","ad":"Oy hakkı birimi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tek ortağın genel kurulun tüm yetkilerine sahip olması durumu","ad":"Tek ortak yetkisi","kim":"kanun sabitler"}],"sinavda":"Soru; genel kurulun devredilemez yetkileri ile oy hakkı kurallarını verir ve bunlardan hangisinin yanlış ifade edildiğini ister.","panel_ornek":"Bir apartman yönetiminde bazı kararları sadece kat malikleri kurulu alabilir, yöneticiye devredemez; mesela 5 daireli binada her daire 1 oy kullanır. Bir dairenin iki kişiye ait olması oy sayısını değiştirmez, yine 1 oy sayılır. Yani karar hakkı kişiye değil daireye bağlıdır.","ornek":"Bir apartman yönetiminde bazı kararları sadece kat malikleri kurulu alabilir, yöneticiye devredemez; mesela 5 daireli binada her daire 1 oy kullanır. Bir dairenin iki kişiye ait olması oy sayısını değiştirmez, yine 1 oy sayılır. Yani karar hakkı kişiye değil daireye bağlıdır.","yontemler":"Şıkları m.616\u0027daki (a)-(j) listesiyle tek tek eşleştir, sonra oy hakkı ile ilgili şıkkı m.618\u0027deki 25 TL kuralı ve istisnalarıyla kontrol et.","nedir":"Limited şirket, ortakların sermaye payı kadar sorumlu olduğu bir şirket türüdür. Sınav burada genel kurulun devredilemez yetkilerini ve oy hakkının nasıl hesaplandığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Ne soruluyor","metin":"Beş ifadeden hangisinin genel kurul yetkileri ve oy hakkı kurallarına aykırı olduğu soruluyor. Kural: m.618/3-a uyarınca sözleşmenin oy hakkını pay sayısına bağlaması kuralı denetçi seçiminde uygulanmaz, itibari değere dönülür. Doğrusu: C ifadesi kanunun bu istisnasını doğru yansıtır, dolayısıyla doğrudur."},"A":{"ad":"Şirketten Çıkarma Karışıklığı Tuzağı","metin":"Öğrenci, çıkarma yetkisinin tek türden olduğunu sanır. Doğrusu: Sözleşmede öngörülen sebeple çıkarma, m.616/2-f uyarınca yalnız sözleşmede öngörülmüşse devredilemez yetkidir; ifade doğrudur."},"D":{"ad":"Oy Hakkı Formülü Tuzağı","metin":"Öğrenci, sözleşmenin pay başına bir oy öngöremeyeceğini sanır. Doğrusu: m.618/2 bu düzenlemeye izin verir, tek şart en küçük payın diğerlerinin onda birinden az olmamasıdır; ifade doğrudur."},"B":{"ad":"Mutlak-Şarta Bağlı Ayrımı Tuzağı","metin":"Öğrenci, mahkemeden istem yetkisinin de sözleşme şartına bağlı olduğunu düşünür. Doğrusu: m.616/1-h bu yetkiyi sözleşme şartı aranmaksızın mutlak devredilemez yetki sayar; ifade doğrudur."}},"celdiriciYol":{},"hap":"Denetçi seçimi, özel denetçi seçimi ve sorumluluk davası açılması kararında oy hakkı, sözleşme sayıya göre oy öngörmüş olsa dahi her zaman esas sermaye payının itibari değerine göre kullanılır.","teshis":{"C":{"gercek":"Türk Ticaret Kanunu m.618/3-a, denetçi seçiminde sayıya göre oy hükmünün uygulanmayacağını, itibari değere dönüleceğini söyler.","ayirt":"Bu karar m.618/3\u0027te sayılan üç istisnadan biri mi diye kontrol et.","paragraf":"m.618/3-a","yanilgi":"Denetçi seçiminde de sözleşmenin belirlediği pay-sayısı esaslı oy sisteminin geçerli olduğunu sanıyorsun."},"E":{"gercek":"Türk Ticaret Kanunu m.618/3-c, sorumluluk davası açılması kararında sayıya göre oy hükmünün uygulanmayacağını, itibari değere dönüleceğini emreder.","ayirt":"Bu karar denetçi seçimi, özel denetçi seçimi veya sorumluluk davası listesinde mi diye kendine sor.","paragraf":"m.618/3-c","yanilgi":"Sorumluluk davası kararının da sözleşmedeki sayı esaslı oy sistemine tabi kaldığını sanıyorsun; oysa bu üç istisnadan biridir."},"A":{"gercek":"Türk Ticaret Kanunu m.616/2-f, sözleşmede öngörülen sebeple çıkarmayı yalnız sözleşmede öngörüldüğü takdirde devredilemez yetki sayar.","ayirt":"Bu yetki mutlak mı, yoksa sözleşme şartına mı bağlı diye kendine sor.","paragraf":"m.616/2-f","yanilgi":"Şirketten çıkarma yetkisinin tek bir türde düzenlendiğini, sözleşme şartından bağımsız olduğunu sanıyorsun."},"D":{"gercek":"Türk Ticaret Kanunu m.618/2, pay başına bir oy sistemine izin verir, yalnız en küçük payın itibari değerine oransal bir alt sınır koyar.","ayirt":"Sözleşme oy sistemini değiştirebilir mi, hangi sınırla diye sor.","paragraf":"m.618/2","yanilgi":"Sözleşmenin itibari değerden bağımsız oy sistemi kuramayacağını düşünüyorsun."},"B":{"gercek":"Türk Ticaret Kanunu m.616/1-h, mahkemeden istemde bulunma kararını sözleşme şartı aramaksızın mutlak devredilemez yetki sayar.","ayirt":"Karar mahkemeye mi, doğrudan genel kurula mı hitap ediyor diye ayır.","paragraf":"m.616/1-h","yanilgi":"Mahkemeden istem yoluyla çıkarmanın da sözleşmede yer alması gerektiğini düşünüyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 71"},"kural":"Faaliyet Kârı = (Net Satışlar - Satılan Malın Maliyeti) - Faaliyet Giderleri; Faaliyet Kâr Marjı = Faaliyet Kârı / Net Satışlar; banka faiz geliri diğer faaliyetlerden olağan gelirdir ve faaliyet kârını etkilemez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 71","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Soruda \u0027kâr marjı\u0027 sorulduğunda önce hangi kâr kademesi istendiğine bak, sonra o kademeden sonra gelen kalemleri (faiz, finansman, vergi) hesaba katma.","konu":"kâr marjı analizi","tablo":{"satirlar":[["VERİLENLER","-"],["Net satışlar","428.000 TL"],["Satılan malın maliyeti","276.350 TL"],["Faaliyet giderleri","84.900 TL"],["Banka faiz geliri","12.750 TL"],["HESAP","-"],["Brüt Satış Kârı (428.000-276.350)","151.650"],["Faaliyet Kârı (151.650-84.900)","66.750"],["Faaliyet Kâr Marjı (66.750/428.000)","%15,60"]],"basliklar":["Kalem","Tutar/Oran"]},"siklar":{"C":"18,57","E":"35,43","A":"12,62","D":"24,16","B":"15,60"},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.275 - İmal edilen emtia","metin":"İmal edilen emtia: Madde 275 – İmal edilen emtianın (Tam ve yarı mamul mallar) maliyet bedeli aşağıda yazılı unsurları ihtiva eder: 1. Mamulün vücuda getirilmesinde sarf olunan iptidai ve ham maddelerin bedeli; 2. Mamule isabet eden işçilik; 3. Genel imal giderlerinden mamule düşen hisse; 4. Genel idare giderlerinden mamule düşen hisse; (Bu hissenin mamulün maliyetine katılması ihtiyaridir.) 5. Ambalajlı olarak piyasaya arz edilmesi zaruri olan mamullerde ambalaj malzemesinin bedeli. Mükellefler, imal ettikleri emtianın maliyet bedellerini yukarıki unsurları ihtiva etmek şartiyle diledikleri usulde tayin edebilirler. (Üçüncü fıkra mülga: 30/12/1980-2365/51 md.)"},{"ad":"TEORI - Keynesyen carpan, marjinal tuketim egilimi ve harcama carpani","metin":"TEORİ (makroekonomi; mevzuat maddesi yok). MARJİNAL TÜKETİM EĞİLİMİ (MPC, c): gelirdeki bir birimlik artışın tüketime giden payı (ΔC/ΔY), 0 ile 1 arasında; marjinal tasarruf eğilimi MPS = 1 − c. ORTALAMA tüketim eğilimi C/Y\u0027dir, gelir arttıkça düşer (Keynes\u0027in mutlak gelir hipotezi). HARCAMA ÇARPANI: otonom harcamadaki (yatırım, kamu harcaması, ihracat) bir birimlik artış geliri k = 1/(1−c) kat artırır; c=0,8 → çarpan 5; c=0,75 → 4. Mantık: harcama gelir olur, gelirin c kadarı yeniden harcanır, sonsuz geometrik seri 1 + c + c² + … = 1/(1−c). VERGİ ÇARPANI = −c/(1−c): götürü vergi artışı geliri harcama çarpanından KÜÇÜK (c katı) düşürür, çünkü verginin yalnız c kadarı harcamadan kesilir. DENGELİ BÜTÇE ÇARPANI = 1: harcama ve vergi aynı miktar artınca gelir o miktar kadar artar. ÇARPANI KÜÇÜLTENLER: oransal gelir vergisi t → k = 1/(1 − c(1−t)); marjinal ithalat eğilimi m → k = 1/(1 − c + m); faiz artışı (IS-LM), fiyat artışı (AD-AS). Tasarruf paradoksu: herkes daha çok tasarruf etmek isteyince gelir düşer, toplam tasarruf artmayabilir. SINAV TUZAĞI: (1) Çarpanın paydası 1 − MPC = MPS\u0027dir; \u0027MPC\u0027 ile bölmek tuzak. (2) Vergi çarpanı negatif ve mutlak değerce harcama çarpanından küçüktür. (3) Dışa açık ekonomide ithalat eğilimi çarpanı küçültür, büyütmez."}],"hakem":"Faaliyet kâr marjı hesaplaması (Faaliyet Kârı / Net Satışlar) kaynak metindeki teori ile tam uyumludur; banka faiz geliri faaliyet kârını etkilemediği doğru şekilde uygulanmıştır."},"kayitlar":[],"sade":{"siklar":{"C":"Faiz gelirini faaliyet kârına eklemeyin. Faiz, gelir tablosunda faaliyet kârından sonra gelir; olağan kârı etkiler ama faaliyet kâr marjını değiştirmez.","E":"Faaliyet giderlerini çıkarmadan brüt kâr marjını hesaplamayın. Faaliyet kâr marjı, brüt kârdan işletme giderleri düşüldükten sonra bulunur.","D":"Faaliyet kâr marjı hesabında paydaya satılan malın maliyetini koymayın. Her kâr marjının paydası daima net satışlardır.","A":"Banka faiz gelirini satılan malın maliyetine eklemeyin. Faiz geliri satış dışı olağan bir gelir olduğu için, maliyeti artırarak faaliyet kârını gereksiz azaltırsınız."},"dogru":"Faaliyet kârı, satışlardan maliyeti ve işletme giderlerini çıkararak bulunur. Banka faiz geliri bu hesaba girmez, çünkü satış dışı bir gelirdir. Faaliyet kâr marjı, bulduğumuz faaliyet kârını net satışlara bölerek yüzde olarak hesaplanır.","sinav":"Faaliyet kâr marjı, faaliyet kârının net satışlara bölünmesiyle hesaplanır; diğer faaliyetlerden olağan gelirler (banka faiz geliri gibi) faaliyet kârını etkilemez.","kavramlar":[{"kaynak":"TEORI","tanim":"İşletmenin satış, üretim ve dağıtım gibi esas faaliyetinden elde ettiği kâr. Net satışlardan satılan malın maliyeti ve faaliyet giderleri düşülerek hesaplanır.","ad":"Faaliyet kârı"},{"kaynak":"TEORI","tanim":"Faaliyet kârının net satışlara bölünmesiyle elde edilen ve yüzde cinsinden ifade edilen oran. İşletmenin satış faaliyetinden ne kadar verimli kâr elde ettiğini gösterir.","ad":"Faaliyet kâr marjı"},{"kaynak":"TEORI","tanim":"Banka faiz geliri, temettü, kambiyo kârı gibi işletmenin esas faaliyeti dışında elde ettiği gelirler. Faaliyet kâr marjını etkilemez, gelir tablosunda faaliyet kârından sonra yer alır.","ad":"Diğer faaliyetlerden olağan gelir"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar/Oran"],"satirlar":[["Brüt Satış Kârı (512.000-318.400)","193.600"],["Faaliyet Kârı (193.600-96.600)","97.000"],["Brüt Kâr Marjı (193.600/512.000)","%37,81"]]},"tur":"tablo","soru":"Bir mobilya işletmesinin 2026 yılına ait net satışları 512.000 TL, satılan malın maliyeti 318.400 TL ve faaliyet giderleri (pazarlama-satış-dağıtım ile genel yönetim giderleri toplamı) 96.600 TL\u0027dir. Ayrıca işletme aynı dönemde 15.300 TL banka faiz geliri elde etmiştir. Buna göre işletmenin brüt kâr marjı (%) kaçtır?","verilen":[],"hedef":"Tabloyu doldur ve işletmenin brüt kâr marjının kaç olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir tekstil işletmesinin 2026 yılına ait net satışları 428.000 TL, satılan malın maliyeti 276.350 TL ve faaliyet giderleri (pazarlama-satış-dağıtım ile genel yönetim giderleri toplamı) 84.900 TL\u0027dir. Ayrıca işletme aynı dönemde 12.750 TL banka faiz geliri elde etmiştir. Buna göre işletmenin faaliyet kâr marjı (%) kaçtır?","kayitBaslik":"","id":"sgs-t1-mta-kolay/kp-27","verilenler":[{"deger":"428.000 TL","anlam":"Faaliyet kâr marjı oranının paydasında kullanılan tutardır.","ad":"Net satışlar"},{"deger":"276.350 TL","anlam":"Net satışlardan düşülerek brüt satış kârı bulunur.","ad":"Satılan malın maliyeti"},{"deger":"84.900 TL","anlam":"Brüt satış kârından düşülerek faaliyet kârı bulunur.","ad":"Faaliyet giderleri"},{"deger":"12.750 TL","anlam":"Diğer faaliyetlerden olağan gelirdir; faaliyet kârı hesabına dahil edilmez, çeldiricidir.","ad":"Banka faiz geliri"}],"dayanak":"TEORİ - Faaliyet kar marji ve faaliyet kari hesabı (mali analiz doktrini)","dogru":"B","oyunBonus":null,"ders":"Mali Tablolar Analizi","adimlar":[{"formul":"Verilen: Net satışlar 428.000 TL (soruda verilen); Satılan malın maliyeti 276.350 TL (soruda verilen); Faaliyet giderleri 84.900 TL (soruda verilen); Banka faiz geliri 12.750 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: net satışlar, satılan malın maliyeti, faaliyet giderleri ve banka faiz geliri. Bunları kendimiz bulmadık, doğrudan soru metninden alıyoruz.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Brüt Satış Kârı = Net Satışlar − Satılan Malın Maliyeti = 428.000 (soruda verilen) − 276.350 (soruda verilen) = 151.650 TL","anlatim":"Önce brüt satış kârını buluyoruz - satışlardan malın maliyetini çıkarıyoruz. Bu, faaliyet kârına giden ilk basamak.","doldur":[[6,1]]},{"formul":"Faaliyet Kârı = Brüt Satış Kârı − Faaliyet Giderleri = 151.650 (1. adımda bulduk) − 84.900 (soruda verilen) = 66.750 TL","anlatim":"Şimdi brüt kârdan faaliyet giderlerini düşüp faaliyet kârını buluyoruz. Pazarlama ve genel yönetim giderleri işin asıl faaliyetinden doğduğu için burada çıkarılır.","doldur":[[7,1]]},{"formul":"Kapsam: Faaliyet Kârı hesabına dahil değil: Banka faiz geliri 12.750 TL (soruda verilen)","anlatim":"Banka faiz geliri nedir? Bu, esas faaliyet dışında elde edilen bir gelirdir - diğer faaliyetlerden olağan gelir sayılır. Dikkat: bu yüzden faaliyet kârı hesabına hiç girmez.","doldur":[]},{"formul":"Faaliyet Kâr Marjı = Faaliyet Kârı / Net Satışlar = 66.750 (2. adımda bulduk) / 428.000 (soruda verilen) = %15,60","anlatim":"Faaliyet kâr marjı, faaliyet kârının net satışlara oranıdır. İşletmenin satışlarının yüzde kaçının esas faaliyetten kâr olarak kaldığını gösterir.","doldur":[[8,1]]},{"formul":"Yanlış yol: (66.750 + 12.750) / 428.000 = %18,58 (HATALI) → doğrusu 66.750 / 428.000 = %15,60 (5. adımda bulduk)","anlatim":"En sık hata: banka faiz gelirini faaliyet kârına ekleyip marjı olduğundan yüksek bulmak. Faiz geliri esas faaliyetten gelmediği için bu işlem yanlıştır.","doldur":[]}],"anahtar":[{"ornek":"faaliyet","kok":"faaliy"},{"ornek":"satışlardır","kok":"satışl"},{"ornek":"geliri","kok":"geliri"},{"ornek":"giderleri","kok":"giderl"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"çıkarıyoruz","kok":"çıkarı"}],"konuGiris":{"harita":"Ne zaman test edilir: gelir tablosu kalemlerinden faaliyet kârı hesaplanırken. Nasıl ölçülür: faaliyet kârının net satışlara bölünmesiyle. Nasıl kaydedilir: sonuç yüzde olarak ifade edilir, ondalık yuvarlanır.","desen":"Sorular sıkça faiz geliri, kambiyo kârı gibi olağan kalemleri faaliyet kârına ekletmeye çalışır; bu bir tuzaktır çünkü bu kalemler faaliyet kârından sonra gelir. Öğrenci genel yönetim giderini unutup sadece satış maliyetini düşerse yanlış marj bulur. Bu soru faaliyet kârı ile olağan kâr ayrımı noktasından geliyor (p.—, TEORİ - Faaliyet kâr marjı).","terimler":[{"kaynak":"soruda verilir","tanim":"Brüt satışlardan iade ve iskontolar düşülünce kalan tutar","ad":"Net satışlar","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Net satışlardan satılan malın maliyeti düşüldükten sonra kalan tutar","ad":"Brüt satış kârı","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Pazarlama-satış-dağıtım ve genel yönetim giderleri toplamı","ad":"Faaliyet giderleri","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Faaliyet kârının net satışlara oranı, yüzde olarak","ad":"Faaliyet kâr marjı","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Net satışlar, satılan malın maliyeti ve faaliyet giderleri verilir; faaliyet kâr marjının yüzde kaç olduğu istenir.","panel_ornek":"Bir arkadaşın küçük bir kırtasiye dükkanı açtı: 10.000 TL satış yaptı, mala 6.000 TL verdi, kira ve personele 2.000 TL harcadı. Ayrıca bankadan 300 TL faiz kazandı ama bu esas iş değil, dükkanın kâr marjına katılmaz. Esas faaliyet kârı 2.000 TL, yani satışın %20\u0027si.","ornek":"Bir arkadaşın küçük bir kırtasiye dükkanı açtı: 10.000 TL satış yaptı, mala 6.000 TL verdi, kira ve personele 2.000 TL harcadı. Ayrıca bankadan 300 TL faiz kazandı ama bu esas iş değil, dükkanın kâr marjına katılmaz. Esas faaliyet kârı 2.000 TL, yani satışın %20\u0027si.","yontemler":"Önce brüt satış kârı bulunur, sonra faaliyet giderleri düşülüp faaliyet kârına ulaşılır; faiz geliri gibi kalemler asla bu hesaba katılmaz.","nedir":"Kâr marjı analizi, bir işletmenin esas faaliyetinden ne kadar verimli kâr ürettiğini yüzde olarak gösterir. Sınav, hangi gelir-gider kaleminin faaliyet kârına dahil olup olmadığını ölçer."},"olay":"428.000-276.350=151.650; 151.650-84.900=66.750; 66.750/428.000=%15,60.","tuzak":{"C":{"ad":"Kapsam Tuzağı","metin":"Banka faiz gelirini faaliyet kârına dahil ederek hesapladın; oysa faiz geliri diğer faaliyetlerden olağan gelirdir ve gelir tablosunda faaliyet kârından sonra yer alır. Doğrusu: Faaliyet kârı hesabına faiz geliri girmez."},"E":{"ad":"Kavram Karışıklığı Tuzağı","metin":"Faaliyet giderlerini düşmeden brüt satış kârı marjını faaliyet kâr marjı sandın. Doğrusu: Faaliyet kâr marjı, brüt kârdan faaliyet giderleri düşüldükten sonra bulunur."},"D":{"ad":"Oran Tuzağı","metin":"Faaliyet kâr marjının paydasına net satışlar yerine satılan malın maliyetini aldın. Doğrusu: Üç kâr marjının da (brüt, faaliyet, net) paydası daima net satışlardır."},"A":{"ad":"Hesap Seçimi Tuzağı","metin":"Banka faiz gelirini maliyet unsuru sanıp satılan malın maliyetine ekledin, böylece brüt ve faaliyet kârını olduğundan düşük hesapladın. Doğrusu: Faiz geliri diğer faaliyetlerden olağan gelir kalemidir, satılan malın maliyetine dahil edilmez."}},"celdiriciYol":{"C":"(66.750+12.750)/428.000=79.500/428.000=%18,57 (faiz gelirini faaliyet kârına ekledi)","E":"151.650/428.000=%35,43 (faaliyet giderlerini düşmeden brüt kâr marjını faaliyet kâr marjı sandı)","D":"66.750/276.350=%24,16 (paydaya net satışlar yerine satılan malın maliyetini aldı)","A":"428.000-(276.350+12.750)=138.900; 138.900-84.900=54.000; 54.000/428.000=%12,62 (faiz gelirini satılan malın maliyetine ekledi)"},"hap":"Brüt, faaliyet ve net kâr marjının üçünde de payda net satışlardır; faaliyet kârına finansman ve diğer faaliyet gelir-gideri girmez.","teshis":{"C":{"gercek":"Faiz geliri, kambiyo kârı gibi kalemler diğer faaliyetlerden olağan gelirdir; gelir tablosunda faaliyet kârından SONRA yer alır.","ayirt":"Bu gelir esas iş kolundan mı geldi, yoksa finansal bir işlemden mi?","paragraf":"TEORİ - Faaliyet kar marji ve faaliyet kari hesabı","yanilgi":"Kâr marjını yükseltmek için elde edilen her geliri faaliyet kârına eklemen gerektiğini sanıyorsun."},"E":{"gercek":"Brüt Satış Kârı marjı ile Faaliyet Kârı marjı farklı kademelerdir; ikincisi faaliyet giderleri düşüldükten sonra hesaplanır.","ayirt":"Faaliyet giderlerini (pazarlama, genel yönetim, ar-ge) bu hesaptan düşürdüm mü?","paragraf":"TEORİ - Kar marji analizi","yanilgi":"Brüt kâr ile faaliyet kârını aynı şey sanıp faaliyet giderlerini düşmeyi atlıyorsun."},"A":{"gercek":"Faiz geliri 64x grubu diğer faaliyetlerden olağan gelirdir; satılan malın maliyeti ile hiçbir ilişkisi yoktur.","ayirt":"Bu kalem üretim/satış sürecinden mi, yoksa finansal işlemden mi doğdu?","paragraf":"TEORİ - Faaliyet kâr marjı ve kar marji analizi","yanilgi":"Faiz gelirini gördüğünde onu maliyeti azaltan bir kalem gibi düşünüp satılan malın maliyetine ekliyorsun."},"D":{"gercek":"Brüt, faaliyet ve net kâr marjının üçünün de paydası daima net satışlardır, maliyet veya gider tutarı değildir.","ayirt":"Bu oranın paydasında hep aynı büyüklük mü var, yoksa değişti mi?","paragraf":"TEORİ - Kar marji analizi","yanilgi":"Oranın paydasına hangi tutarın gireceğini karıştırıp elindeki başka bir büyük sayıyı (maliyeti) kullanıyorsun."},"B":{"gercek":"Faaliyet Kârı = Brüt Satış Kârı - Faaliyet Giderleri\u0027dir; diğer faaliyet gelir/giderleri, finansman giderleri sonraki kademelerdedir.","ayirt":"Bu kalem esas faaliyetten mi (üretim-satış-yönetim), yoksa esas faaliyet dışından mı geldi?","paragraf":"TEORİ - Faaliyet kar marji ve faaliyet kari hesabı","yanilgi":"Bu şıkkı eleyen öğrenci, faiz gelirinin bir şekilde faaliyet kârına dahil edilmesi gerektiğini düşünür."}},"verilen":[[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 84"},"kural":"madde metni \u0027kanun gereği veya böyle bir gereklilik bulunmaksızın\u0027 der; yani denetimin zorunlu olup olmaması muafiyeti etkilemez, tek belirleyici şirketin Bölüm hükümlerine (ya da eş değerine) uygun denetlenmiş olmasıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 84","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Aranmaz\u0027 sorularında madde metnindeki her cümleyi tek tek şart listesine çevir, sonra hangisinin metinde açıkça devre dışı bırakıldığını ara.","konu":"genel kabul görmüş denetim standartları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Kanun madde numarası","398","-"],["HESAP","-","-"],["A) Konsolidasyona alınan şirketin ayrıca denetlenmesinin, o…","m.398/3, 1. cümle","YANLIŞ ifade"],["B) Konsolidasyona alınan şirketin, bu Bölüm hükümlerine uyg…","m.398/3, 1. cümle","doğru ifade"],["C) Merkezi yurt dışında bulunan şirket için, Kanunun öngörd…","m.398/3, 2. cümle","doğru ifade"],["D) İncelemenin, özellikle konsolidasyona bağlı uyarlamaları…","m.398/3, 1. cümle","doğru ifade"],["E) Denetimin, envanterin ve muhasebenin, Türkiye Denetim St…","m.398/1","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Merkezi yurt dışında bulunan şirket için, Kanunun öngördüğü denetimle eş değer bir denetime tabi tutulmuş olması","E":"Denetimin, envanterin ve muhasebenin, Türkiye Denetim Standartlarının öngördüğü ölçüde iç denetimin de denetimini kapsaması","A":"Konsolidasyona alınan şirketin ayrıca denetlenmesinin, o şirket için kanunen zorunlu tutulmuş olması","D":"İncelemenin, özellikle konsolidasyona bağlı uyarlamaları ve mahsupları kapsaması","B":"Konsolidasyona alınan şirketin, bu Bölüm hükümlerine uygun olarak denetlenmiş olması"},"kaynak":{"alinti":"kanun gereği veya böyle bir gereklilik bulunmaksızın","liste":[{"ad":"TTK (6102 s.K.) m.398 [1/2]","metin":"MADDE 398- (1) Şirketin ve topluluğun finansal tabloları ile yönetim kurulunun yıllık faaliyet raporunun denetimi; envanterin, muhasebenin ve Türkiye Denetim Standartlarının öngördüğü ölçüde iç denetimin, bu Bölüm hükümleri anlamında 378 inci madde uyarınca verilen raporların ve 397 nci maddenin birinci fıkrası çerçevesinde yönetim kurulunun yıllık faaliyet raporunun denetimidir. Bu denetim, Türkiye Muhasebe Standartlarına, kanuna ve esas sözleşmenin finansal tablolara ilişkin hükümlerine uyulup uyulmadığının incelenmesini de kapsar. Denetleme, Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumunun belirlediği esaslar bağlamında, denetçilik mesleğinin gerekleriyle etiğine uygun bir şekilde ve özenle gerçekleştirilir. Denetleme, şirketin ve topluluğun, malvarlıksal ve finansal durumunun 515 inci madde anlamında dürüst resim ilkesine uygun olarak yansıtılıp yansıtılmadığını, yansıtılmamışsa sebeplerini, dürüstçe belirtecek şekilde yapılır.54 (2) Denetim; a) Şirketin finansal tablolarının ve 397 nci maddenin birinci fıkrası ve 402 nci maddenin ikinci fıkrası çerçevesinde yönetim kurulunun yıllık faaliyet raporunun, b) Topluluğun konsolide finansal tablolarının ve 397 nci maddenin birinci fıkrası ve 402 nci maddenin ikinci fıkrası çerçevesinde yönetim kurulunun yıllık faaliyet raporunun, denetçinin denetleme sırasında elde ettiği bilgilerle uyum içinde olup olmadığını belirtip açıklayacak şekilde yapılır."},{"ad":"TTK (6102 s.K.) m.398 [2/2]","metin":"(3) Topluluğun finansal tablolarının denetiminden sorumlu olan denetçi, topluluğun konsolide tablolarına alınan şirketlerin finansal tablolarını, özellikle konsolidasyona bağlı uyarlamaları ve mahsupları, birinci fıkra anlamında inceler; meğerki, konsolidasyona alınan şirket, kanun gereği veya böyle bir gereklilik bulunmaksızın, bu Bölüm hükümlerine uygun olarak denetlenmiş olsun. Bu istisna, merkezi yurt dışında bulunan bir şirketin bu Kanunun öngördüğü denetimle eş değer bir denetime tâbî tutulmuş olması hâlinde de geçerlidir. (4) Denetçi, yönetim kurulunun şirketi tehdit eden veya edebilecek nitelikteki riskleri zamanında teşhis edebilmek ve risk yönetimini gerçekleştirebilmek için 378 inci maddede öngörülen sistemi ve yetkili komiteyi kurup kurmadığını, böyle bir sistem varsa bunun yapısı ile komitenin uygulamalarını açıklayan, ayrı bir rapor düzenleyerek, denetim raporuyla birlikte, yönetim kuruluna sunar. Bu raporun esasları Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumunca belirlenir.55 26/6/2012 tarihli ve 6335 sayılı Kanunun 40 ıncı maddesiyle, bu maddenin birinci fıkrasının birinci cümlesinde yer alan “Türkiye Muhasebe” ibaresi “Türkiye Denetim” ve aynı fıkrada yer alan “geçici 2 nci ve geçici 3 üncü maddelerde öngörülen kurul ve kurumun belirlendiği” ibaresi “Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumunun belirlediği” şeklinde değiştirilmiştir. 55 26/6/2012 tarihli ve 6335 sayılı Kanunun 40 ıncı maddesiyle, bu fıkrada yer alan “geçici 2 nci ve geçici 3 üncü maddelerde öngörülen kurul ve kurum tarafından” ibaresi “Kamu Gözetimi, Muhasebe ve Dene…"}],"hakem":"TTK m.398/3 açıkça \u0027kanun gereği veya böyle bir gereklilik bulunmaksızın\u0027 ifadesiyle denetimin kanuni zorunluluğunun muafiyet şartı olmadığını belirtmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Yurt dışında merkezi olan şirketler için bu istisna ayrıca hükümde yer alır ve muafiyetin geçerli olması için eş değer denetime tâbî tutulması gerekir.","E":"Bu ifade birinci fıkraya ait genel denetim tanımının parçasıdır, üçüncü fıkradaki muafiyetle ilgisi yoktur, iki fıkra ayrı konuları düzenler.","A":"Kanuni zorunluluk şartı muafiyetin koşulu değildir; muafiyet şirketin bu Bölüm hükümlerine uygun denetlenmiş olmasına bağlıdır, zorunlu olup olmamasına değil.","D":"Bu, muafiyetin koşulu değil inceleme yapılması gereken durumlarda yapılacak incelemenin kapsamını tanımlar; muafiyet yokken nelerin incelenecektir.","B":"Bu ifade muafiyetin temel koşuludur; maddede \"bu Bölüm hükümlerine uygun olarak denetlenmiş olsun\" açıkça yazılı, bu şart aranır."},"dogru":"Denetçi, konsolidasyona alınan şirketi ayrıca incelemekten muaf tutulabilir; ancak bu muafiyet şirketin usulüne uygun denetlenmiş olmasına bağlıdır. Şirketin denetiminin kanun gereği zorunlu olup olmaması muafiyeti etkilemez, tek ölçü denetimin usulüne uygunluğudur.","sinav":"Türk Ticaret Kanunu 398. maddenin üçüncü fıkrası","kavramlar":[{"kaynak":"Türk Ticaret Kanunu 398. madde","tanim":"Topluluğun konsolide finansal tablolarına dahil edilen, şirkete bağlı olan işletme.","ad":"konsolidasyona alınan şirket"},{"kaynak":"Türk Ticaret Kanunu 398. madde","tanim":"Finansal tabloların denetimi, denetçi seçimi ve yetkileri ile ilgili Türk Ticaret Kanununda yer alan ilgili bölümün kuralları.","ad":"Bölüm hükümleri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/2","2024/3"]},"oyun":null,"tip":"teori","soru":"6102 sayılı Türk Ticaret Kanununun 398 inci maddesinin üçüncü fıkrasına göre, topluluk denetçisinin konsolidasyona alınan bir şirketin finansal tablolarını ayrıca incelemekten muaf tutulabilmesi için aşağıdakilerden hangisi aranmaz?","kayitBaslik":"","id":"sgs-t1-denetim-cokzor/kp-12","verilenler":[{"deger":"398","anlam":"Türk Ticaret Kanununda topluluk denetçisinin konsolidasyona alınan şirketleri inceleme muafiyetini düzenleyen madde.","ad":"Kanun madde numarası"}],"dayanak":"6102 sayılı Türk Ticaret Kanunu m.398/3","dogru":"A","oyunBonus":null,"ders":"Denetim","adimlar":[{"formul":"Olay: Deniz Holding\u0027in bağlı ortaklığı Marmara Kimya A.Ş., 2023 yılında Bölüm hükümlerine uygun şekilde bağımsız denetimden geçmiş; ama Marmara Kimya için kanunen bağımsız denetim zorunluluğu zaten yoktu, sırf grup politikası yüzünden denetlenmiş.","anlatim":"Topluluk denetçisi Ayşe, konsolide tabloları hazırlarken Marmara Kimya\u0027yı ayrıca inceleyip incelemeyeceğine bakıyor. Kanun \u0027zorunlu olsun ya da olmasın, Bölüm hükümlerine uygun denetlenmişse muafiyet var\u0027 diyor.","doldur":[]},{"formul":"Ne yapacağız: Ayşe\u0027nin elinde beş ifade var, her biri muafiyet için \u0027şart mı, değil mi\u0027 sorusu soruyor; Marmara Kimya olayında beşini tek tek test edeceğiz.","anlatim":"Kural şu: madde 398/3 diyor ki inceleme yapılır, meğer şirket kanun gereği veya gereklilik olmaksızın Bölüm hükümlerine uygun denetlenmiş olsun. Şimdi bu beş cümleyi Marmara Kimya\u0027ya uyduracağız.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.398/3, 1. cümle","karar":"yanlış","anlatim":"Hayır, kanun tam tersini söylüyor; zorunlu olsun ya da olmasın önemi yok. Marmara Kimya\u0027da zaten zorunluluk yoktu ama muafiyet yine de geçerli oldu.","formul":"Şık A: Ayşe \u0027Marmara Kimya\u0027nın denetimi kanunen zorunlu muydu, önce onu tespit edeyim, zorunlu değilse muafiyeti reddedeyim\u0027 diyor, doğru mu düşünüyor?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.398/3, 1. cümle","karar":"doğru","anlatim":"Evet, tam olarak bu soru muafiyetin temel şartı. Marmara Kimya bu şartı sağladığı için Ayşe ayrıca inceleme yapmıyor.","formul":"Şık B: Ayşe \u0027Marmara Kimya bu Bölüm hükümlerine uygun denetlendi mi, buna bakmam gerekir\u0027 diyor, doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.398/3, 2. cümle","karar":"doğru","anlatim":"Evet, ama bu sadece merkezi yurt dışında olan şirketler için ayrı bir yol. Marmara Kimya Türkiye\u0027de olduğu için bu şık onun olayında devreye girmiyor, kural olarak doğru.","formul":"Şık C: Diyelim Marmara Kimya\u0027nın merkezi Almanya\u0027da olsaydı, Ayşe \u0027Türk Ticaret Kanunu denetimine eş değer bir denetim mi görmüş, buna bakarım\u0027 diyor, doğru mu?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.398/3, 1. cümle","karar":"doğru","anlatim":"Evet, bu incelemenin kendi içeriğini tanımlar, muafiyet varsa bu adım hiç gündeme gelmez. Marmara Kimya\u0027da muafiyet olduğu için Ayşe bu incelemeyi hiç yapmadı.","formul":"Şık D: Ayşe muafiyet yoksa \u0027inceleme özellikle konsolidasyona bağlı uyarlama ve mahsupları kapsar mı\u0027 diye sorar, doğru mu?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.398/1","karar":"doğru","anlatim":"Bu tanım fıkra birde, genel denetim tanımıdır, fıkra üçteki topluluk muafiyetiyle doğrudan bağlı değil. Ayşe bunu Marmara Kimya\u0027nın muafiyet kararında ölçüt yapmaz.","formul":"Şık E: Ayşe \u0027denetim, envanter, muhasebe ve iç denetimi Türkiye Denetim Standartları ölçüsünde kapsıyor mu\u0027 diye Marmara Kimya\u0027nın muafiyetini bu genel tanıma göre mi ölçüyor?"},{"formul":"Kapanış: A ✗ B ✓ C ✓ D ✓ E ✓","anlatim":"Marmara Kimya olayında tek çürük taş A, çünkü kanun zorunluluk şartını açıkça devre dışı bırakıyor. Kendine hep şunu sor: bu cümle \u0027zorunlu olsun ya da olmasın\u0027 diyen fıkra üçe mi ait, yoksa genel tanım fıkrası bire mi?","doldur":[]}],"anahtar":[{"ornek":"marmara","kok":"marmar"},{"ornek":"muafiyeti","kok":"muafiy"},{"ornek":"incelenmemesi","kok":"incele"},{"ornek":"zorunlu","kok":"zorunl"},{"ornek":"olmasıdır","kok":"olması"},{"ornek":"şirketin","kok":"şirket"}],"konuGiris":{"harita":"Bu istisna ne zaman uygulanır: konsolidasyona alınan şirketin finansal tabloları zaten kanun gereği veya gerekmese de denetlenmişse. Muafiyet nasıl belirlenir: şirketin daha önce eşdeğer bir denetimden geçmiş olması şartına bakılarak. Nasıl kayıt altına alınır: topluluk denetçisinin inceleme kapsamı ve istisna gerekçesi denetim raporunda belirtilir.","desen":"Sorular genelde muafiyet şartlarını sayarken \u0027işletme yönetiminin onayı\u0027 gibi metinde olmayan bir şıkkı araya sokar. Öğrenciler kanun gereği veya gereksiz de olsa denetlenmiş olma şartını, yurt dışı eşdeğerlik şartıyla karıştırır. Bu soru Türk Ticaret Kanunu m.398 üçüncü fıkra noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Topluluğun konsolide finansal tablolarını denetleyen kişi","ad":"Topluluk denetçisi","kim":"standart (BDS) sabitler"},{"kaynak":"soruda verilir","tanim":"Konsolide tabloya dahil edilen bağlı şirket","ad":"Konsolidasyona alınan şirket","kim":"işletme yönetimi yalnız finansal tabloyu ve beyanı hazırlar (belirleyici değildir)"},{"kaynak":"kuraldan bilinir","tanim":"Önceden denetlenmiş şirketin tekrar incelenmemesi kuralı","ad":"Muafiyet istisnası","kim":"standart (BDS) sabitler"},{"kaynak":"soruda verilir","tanim":"Yurt dışı merkezli şirketin kanuna denk bir denetime tabi tutulması","ad":"Eşdeğer denetim","kim":"denetçi mesleki yargıyla belirler"}],"sinavda":"Soruda muafiyet şartlarına dair seçenekler verilir ve hangisinin aranmadığı istenir.","panel_ornek":"Bir arkadaşın ikinci el laptop alırken satıcıya güvenmeyip bağımsız bir teknik servise kontrol ettirsin; ama o laptop zaten yetkili bayiden 2 ay önce garantili bakımdan geçmişse tekrar servise götürmesine gerek kalmaz. Denetim de böyle işler: aynı işi iki kez tekrar denetletmezler.","ornek":"Bir arkadaşın ikinci el laptop alırken satıcıya güvenmeyip bağımsız bir teknik servise kontrol ettirsin; ama o laptop zaten yetkili bayiden 2 ay önce garantili bakımdan geçmişse tekrar servise götürmesine gerek kalmaz. Denetim de böyle işler: aynı işi iki kez tekrar denetletmezler.","yontemler":"Metinde sayılmayan, dışarıdan eklenmiş görünen şık aranmaz kabul edilir; işletme yönetiminin beyanı denetim şartı olamaz.","nedir":"Genel kabul görmüş denetim standartları, denetçinin nasıl özenli ve tarafsız çalışacağını belirleyen kurallardır. Sınav, bir denetim işleminin bu kurallara göre yapılıp yapılmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Yurt Dışı İstisnası Tuzağı","metin":"Bu cümleyi genel şartlarla karıştırıp \u0027her şirkette aranır\u0027 ya da \u0027hiç aranmaz\u0027 sanırsın; oysa madde bunu yalnız merkezi yurt dışında olan şirketler için ayrıca ve açıkça arar. Doğrusu: bu, fıkranın ikinci cümlesinde düzenlenmiş gerçek bir muafiyet koşuludur."},"E":{"ad":"Fıkra Karıştırma Tuzağı","metin":"Bu ifadeyi üçüncü fıkranın bir parçası sanırsın ama bu birinci fıkranın genel denetim tanımına aittir, üçüncü fıkradaki muafiyetle ilgisizdir. Doğrusu: iki fıkra birbirine karıştırılmamalı, bu cümle m.398/1\u0027in konusudur."},"D":{"ad":"Kapsam Karıştırma Tuzağı","metin":"Bunu muafiyet şartı sanmazsın ama aslında bu cümle muafiyet yokken yapılacak incelemenin kapsamını, yani asıl kuralı tanımlar; soruyla \u0027aranmaz mı\u0027 diye karıştırılabilir. Doğrusu: bu ifade madde metninde birebir yer alır, muafiyetin değil incelemenin içeriğinin tarifidir."},"B":{"ad":"Bölüm Hükmü Tuzağı","metin":"Bu ifadeyi \u0027gerçek şart değil, sadece detay\u0027 sanıp elersin ama madde bunu doğrudan muafiyetin temel koşulu yapar. Doğrusu: şirketin bu Bölüm hükümlerine uygun denetlenmiş olması aranan asıl şarttır, aranmayan A seçeneğidir."}},"celdiriciYol":null,"hap":"Türk Ticaret Kanunu m.398/3\u0027e göre konsolidasyona alınan şirketin ayrıca incelenmemesi için tek şart Bölüm hükümlerine (ya da yurt dışı şirkette eş değerine) uygun denetlenmiş olmasıdır; bunun kanunen zorunlu olup olmaması önemsizdir.","teshis":{"C":{"gercek":"Madde, merkezi yurt dışında olan şirketler için TTK denetimiyle eş değer denetimi ayrı bir istisna hâli olarak tanır.","ayirt":"Bu koşul yalnız belirli bir şirket grubu için mi yazılmış, yoksa genel mi diye ayır.","paragraf":"TTK m.398/3, 2. cümle","yanilgi":"Bu şıkkı seçtiysen, yurt dışı şirketler için ek şartın metinde ayrıca düzenlendiğini fark etmemişsindir."},"E":{"gercek":"Envanter, muhasebe ve iç denetim ifadeleri denetimin genel tanımına (fıkra 1) aittir, konsolidasyon muafiyetiyle (fıkra 3) doğrudan ilgili değildir.","ayirt":"Bu ifade hangi fıkrada geçiyor, konusu topluluk şirketi muafiyeti mi yoksa genel denetim tanımı mı?","paragraf":"TTK m.398/1","yanilgi":"Bu şıkkı seçtiysen, birinci fıkradaki genel denetim tanımını üçüncü fıkradaki özel muafiyet kuralıyla karıştırmışsındır."},"A":{"gercek":"Madde 398/3 \u0027kanun gereği veya böyle bir gereklilik bulunmaksızın\u0027 ibaresiyle zorunluluk şartını açıkça devre dışı bırakır; tek şart Bölüm hükümlerine uygunluktur.","ayirt":"Metinde \u0027ya da/veya\u0027 bağlacıyla iki ihtimal birlikte mi sayılmış, kontrol ettin mi?","paragraf":"TTK m.398/3, 1. cümle","yanilgi":"Bu şıkkı elersen, muafiyetin ancak denetim kanunen zorunluysa geçerli olacağını düşünmüşsündür."},"D":{"gercek":"Bu cümle, istisna uygulanmadığı hallerde denetçinin neyi inceleyeceğini, yani asıl kuralı anlatır.","ayirt":"Cümle \u0027şu şartla muaf olunur\u0027 mu diyor, yoksa \u0027şunu inceler\u0027 mi diyor?","paragraf":"TTK m.398/3, 1. cümle","yanilgi":"Bu şıkkı seçtiysen, muafiyet koşuluyla muafiyet olmadığında yapılacak incelemenin içeriğini birbirine karıştırmışsındır."},"B":{"gercek":"Bölüm hükümlerine uygunluk, muafiyetin kurucu unsurudur; olmadan istisna hiç uygulanamaz.","ayirt":"Bu cümle çıkarılsa istisna hâlâ ayakta kalır mı diye kendine sor.","paragraf":"TTK m.398/3, 1. cümle","yanilgi":"Bu ifadeyi seçtiysen, madde metninde geçen her cümleyi otomatik olarak \u0027aranmaz\u0027 sandın demektir."}},"verilen":[[1,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 37"},"kural":"Satılan malın maliyeti, dönem başı stok ile dönem içi alışların toplamından dönem sonu sayım stokunun çıkarılmasıyla bulunur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 37","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce satışa hazır toplam malı (dönem başı stok + alışlar) bul, sonra elde kalan (dönem sonu sayım) stoku çıkar; sıra karışmasın.","konu":"aralıklı envanter yöntemi","tablo":{"satirlar":[["VERİLENLER","-"],["Dönem başı stok","40.000 TL"],["Dönem içi alışlar","150.000 TL"],["Dönem sonu sayım stoku","30.000 TL"],["HESAP","-"],["Dönem Başı Stok + Dönem İçi Alışlar","190.000"],["Dönem Sonu Sayım Stoku (-)","30.000"],["Satılan Malın Maliyeti","160.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"160.000","E":"220.000","A":"80.000","D":"190.000","B":"140.000"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Aralikli envanter yontemi","metin":"TEORİ/TEKNİK (muhasebe, mevzuat maddesi yok). ARALIKLI (DÖNEMSEL) ENVANTER: dönem içinde alışlar doğrudan stok hesabına (veya alış hesabına) yazılır, HER SATIŞTA SATILAN MALIN MALİYETİ KAYDI YAPILMAZ. Satılan malın maliyeti DÖNEM SONUNDA FİİLİ SAYIM ile bulunur. FORMÜL: SMM = Dönem Başı Stok + Dönem İci Alışlar (+ alış giderleri - alış iskonto ve iadeleri) - Dönem Sonu Stok. DEVAMLI (SÜREKLİ) ENVANTER: her satışta iki kayıt yapılır - (1) satış hasılatı kaydı, (2) stok çıkışı/SMM kaydı. Stok hesabı HER AN GÜNCEL bakiye verir. AYIRT EDİCİ SORULAR: \u0027Satılan malın maliyeti ne zaman bulunur?\u0027 -\u003e aralıklı: dönem sonunda sayımla; devamlı: her satışta. \u0027Stok hesabı cari bakiye verir mi?\u0027 -\u003e aralıklı: HAYIR; devamlı: EVET. \u0027Kayıp-calinti-fire tespit edilebilir mi?\u0027 -\u003e aralıklı: HAYIR (sayım farkı otomatik SMM\u0027ye karışır); devamlı: EVET (kayıt ile sayım karşılaştırılarak bulunur). SINAV TUZAĞI: aralıklı yöntemde dönem sonu stok DÜŞÜK çıkarsa SMM YÜKSEK, dolayısıyla brüt kâr DÜŞÜK görünür; kayıp ve calintiler maliyetin içinde GİZLENİR - yöntemin en çok sorulan zayıflığı budur."}],"hakem":"Satılan malın maliyeti formülü (SMM = Dönem Başı Stok + Alışlar - Dönem Sonu Stok) kaynakta açıkça yer almakta ve hesaplama (40.000+150.000-30.000=160.000) bu kurala tam olarak uygundir."},"kayitlar":[],"sade":{"siklar":{"D":"Dönem başı ve alışları toplamak doğru ama dönem sonu sayım stokunu formülden çıkarmayı unutmek eksik kalır; satılan maliyeti bulmak için elde kalan stok daima toplam maldan düşülmelidir.","E":"Dönem sonu stoku çıkarmak yerine toplama katmak (40.000 + 150.000 + 30.000) yanlıştır; dönem sonu stok elde kalan maldır ve satılan maliyetten düşülmesi gerekir.","A":"Dönem başı stoktan başlayıp alışları ve dönem sonu stokunu da çıkarmak (150.000 - 40.000 - 30.000) yanlıştır; dönem başı stok ve alışlar toplanmalı, toplam stoktan sonuç çıkarılmalıdır.","B":"Dönem başı stok ile dönem sonu stokunun yerini değiştirerek (30.000 + 150.000 - 40.000) hesaplamak yanlıştır; formülde dönem başı toplama, dönem sonu çıkarmaya mutlaka girer."},"dogru":"Aralıklı yöntemde satılan malın maliyeti dönem sonunda hesaplanır. Dönem başındaki stok ve alışlar toplanır, dönem sonunda fiziksel sayımla bulunan stok bu toplamdan çıkarılır. 40.000 + 150.000 - 30.000 = 160.000 TL.","sinav":"Aralıklı envanter yönteminde satılan malın maliyeti dönem sonunda fiziki sayım ile bulunur ve dönem başı stok artı dönem içi alışlardan dönem sonu stok çıkarılarak hesaplanır.","kavramlar":[{"kaynak":"TEORI","tanim":"Dönem içinde satışlar kaydedilir ama satılan malın maliyeti kaydı yapılmaz; satılan malın maliyeti dönem sonunda fiziki sayım ile bulunur.","ad":"Aralıklı envanter yöntemi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2015/3"]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Dönem Başı Stok + Dönem İçi Alışlar","170.000"],["Dönem Sonu Sayım Stoku (-)","25.000"],["Satılan Malın Maliyeti","145.000"]]},"tur":"tablo","soru":"Aralıklı envanter yöntemini kullanan bir işletmenin dönem başı stok tutarı 50.000 TL, dönem içi mal alışları 120.000 TL, dönem sonunda yapılan fiziki sayım sonucu bulunan stok tutarı 25.000 TL\u0027dir. Buna göre işletmenin dönem sonunda hesaplayacağı satılan malın maliyeti kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve satılan malın maliyetinin kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Aralıklı envanter yöntemini kullanan bir işletmenin dönem başı stok tutarı 40.000 TL, dönem içi mal alışları 150.000 TL, dönem sonunda yapılan fiziki sayım sonucu bulunan stok tutarı 30.000 TL\u0027dir. Buna göre işletmenin dönem sonunda hesaplayacağı satılan malın maliyeti kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-fmuh-kolay/kp-51","verilenler":[{"deger":"40.000 TL","anlam":"Dönemin başında elde bulunan, satışa hazır mal tutarı; formülde toplama girer.","ad":"Dönem başı stok"},{"deger":"150.000 TL","anlam":"Dönem içinde satın alınan malların tutarı; formülde toplama girer.","ad":"Dönem içi alışlar"},{"deger":"30.000 TL","anlam":"Fiziki sayımla belirlenen, elde kalan mal tutarı; formülden çıkarılır.","ad":"Dönem sonu sayım stoku"}],"dayanak":"Tekdüzen Hesap Planı - Aralıklı (dönemsel) envanter yöntemi, SMM = Dönem Başı Stok + Alışlar - Dönem Sonu Stok formülü","dogru":"C","oyunBonus":null,"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Dönem başı stok 40.000 TL (soruda verilen); Dönem içi alışlar 150.000 TL (soruda verilen); Dönem sonu sayım stoku 30.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: dönem başı stok 40.000 TL, dönem içi alışlar 150.000 TL, dönem sonu sayım stoku 30.000 TL.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[5,1],[6,1]]},{"formul":"Mal Miktarı = Dönem Başı Stok + Dönem İçi Alışlar = 40.000 (soruda verilen) + 150.000 (soruda verilen) = 190.000 TL","anlatim":"Aralıklı envanter yönteminde stok hareketleri günlük takip edilmez, dönem sonunda fiziki sayımla belirlenir. Bu yüzden önce elde bulunması gereken toplam mal tutarını buluruz.","doldur":[[5,1]]},{"formul":"Satılan Malın Maliyeti = Mal Miktarı - Dönem Sonu Sayım Stoku = 190.000 (önceki adımda bulduk) - 30.000 (soruda verilen) = 160.000 TL","anlatim":"Satılan malın maliyeti nedir? Elde olması gereken toplam maldan, sayımda gerçekten bulunan stok çıkarılınca satılan kısım kalır. Dikkat: burada kayıttaki değil, sayımdaki gerçek stok kullanılır.","doldur":[[7,1]]},{"formul":"Sağlama: 40.000 (soruda verilen) + 150.000 (soruda verilen) - 30.000 (soruda verilen) = 160.000 TL","anlatim":"Sağlama yapalım: 40.000 ile 150.000\u0027i toplayıp 30.000\u0027i çıkarınca aynı sonuca ulaşmalıyız. Rakamlar tabloyla birebir uyuşuyor, hesap doğru.","doldur":[]},{"formul":"Yanlış yol: 40.000 + 150.000 + 30.000 = 220.000 (HATALI) → doğrusu 190.000 - 30.000 = 160.000 (3. adımda bulduk)","anlatim":"En sık hata: öğrenci dönem sonu stokunu toplama işlemine dahil edip 220.000 bulur. Bu yanlış, çünkü dönem sonu stok elde kalan maldır, satılan değildir - çıkarılması gerekir.","doldur":[]}],"anahtar":[{"ornek":"satılan","kok":"satıla"},{"ornek":"çıkarılmasıyla","kok":"çıkarı"},{"ornek":"maliyeti","kok":"maliye"},{"ornek":"alışlar","kok":"alışla"},{"ornek":"stokunun","kok":"stokun"},{"ornek":"aralıklı","kok":"aralık"}],"konuGiris":{"harita":"Satılan malın maliyeti ne zaman hesaplanır: dönem sonunda fiziki sayımla. Stok hesabı anlık bakiye verir mi: hayır, sadece dönem sonunda güncellenir. Kayıp veya çalıntı ayrı tespit edilir mi: hayır, sayım farkına karışarak maliyete gizlenir.","desen":"Sınav genellikle dönem başı stok, alışlar ve dönem sonu sayım tutarını verip SMM\u0027yi hesaplatır; tuzak, dönem sonu stok düşük çıktığında SMM\u0027nin yüksek görünmesi ve kayıp-çalıntının maliyete gizlice karışmasıdır. Arşivde 2 dönemde bu tuzakla soruldu. Bu soru p.28\u0027deki aralıklı-devamlı ayrımı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Dönemin başında elde bulunan mal tutarı","ad":"Dönem başı stok","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Dönem boyunca satın alınan malların toplam tutarı","ad":"Dönem içi alışlar","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Fiziki sayımla belirlenen dönem sonundaki mal tutarı","ad":"Dönem sonu stok","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"sen hesaplarsın","tanim":"Dönem başı stok ile alışlar toplamından dönem sonu stok düşülünce kalan tutar","ad":"Satılan malın maliyeti","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Dönem başı stok, dönem içi alışlar ve dönem sonu fiziki sayım tutarı verilir, satılan malın maliyeti istenir.","panel_ornek":"Bir kırtasiyeci ay başında rafta 20 kutu kalem bulur, ay içinde 60 kutu daha alır ama satışta hiç sayım yapmaz. Ay sonunda rafı sayar, 15 kutu kaldığını görür; aradaki fark satılmış sayılır. Kaybolan ya da çalınan kutular da bu farkın içine karışır, fark edilmez.","ornek":"Bir kırtasiyeci ay başında rafta 20 kutu kalem bulur, ay içinde 60 kutu daha alır ama satışta hiç sayım yapmaz. Ay sonunda rafı sayar, 15 kutu kaldığını görür; aradaki fark satılmış sayılır. Kaybolan ya da çalınan kutular da bu farkın içine karışır, fark edilmez.","yontemler":"Tek yöntem: dönem başı stok ile alışlar toplanır, dönem sonu stok tutarı bu toplamdan düşülür; sayım tutarı asla atlanmamalıdır.","nedir":"Aralıklı envanter yöntemi, stok hareketlerinin her satışta değil dönem sonunda sayımla izlendiği bir stok takip sistemidir. Sınav bu yöntemde satılan malın maliyetinin nasıl hesaplandığını ölçer."},"olay":"40.000+150.000=190.000; 190.000-30.000=160.000.","tuzak":{"D":{"ad":"Eksik Adım Tuzağı","metin":"Dönem başı stok ile alışları toplayıp dönem sonu sayım stokunu formülden düşürmeyi unuttun. Doğrusu: Toplam mal tutarından dönem sonu sayım stoku mutlaka çıkarılmalıdır."},"E":{"ad":"İşaret Tuzağı","metin":"Dönem sonu sayım stokunu formülden çıkarmak yerine toplama ekledin. Doğrusu: Dönem sonu stok elde kalan maldır ve satılan malın maliyetinden düşülmesi gerekir."},"A":{"ad":"Ters Formül Tuzağı","metin":"Dönem başı stoku alışlardan düşüp sonra sayım stokunu da düşerek 150.000-40.000-30.000 işlemini yaptın. Doğrusu: Dönem başı stok ve alışlar toplanır, sayım stoku bu toplamdan düşülür."},"B":{"ad":"Kalem Karıştırma Tuzağı","metin":"Dönem başı stok ile dönem sonu sayım stokunun yerini değiştirip 30.000+150.000-40.000 işlemini yaptın. Doğrusu: Formülde dönem başı stok toplama, dönem sonu stok çıkarmaya girer, sırası değişmez."}},"celdiriciYol":{"D":"40.000 + 150.000 = 190.000 (dönem sonu sayım stokunu düşmeyi unuttu)","E":"40.000 + 150.000 + 30.000 = 220.000 (dönem sonu stoku çıkarmak yerine ekledi)","A":"150.000 - 40.000 - 30.000 = 80.000 (dönem başı stoku da çıkardı)","B":"30.000 + 150.000 - 40.000 = 140.000 (dönem başı ve dönem sonu stoku yer değiştirdi)"},"hap":"Aralıklı envanterde satılan malın maliyeti = dönem başı stok + dönem içi alışlar - dönem sonu sayım stoku.","teshis":{"C":{"gercek":"Satılan malın maliyeti, satışa hazır toplam maldan (dönem başı stok + alışlar) elde kalan mal (dönem sonu sayım stoku) düşülerek bulunur.","ayirt":"Elimde kalan malı formülden düştüm mü?","paragraf":"Aralıklı envanter - SMM formülü","yanilgi":"Bu şıkkı eleyen öğrenci, dönem sonu stokun ayrıca düşülmesi gerektiğini unutup toplamı yeterli sanmıştır."},"E":{"gercek":"Dönem sonu stok elde kalan, henüz satılmamış maldır; maliyeti artırmaz, satılan malın maliyetinden çıkarılır.","ayirt":"Bu kalem satılan mı yoksa elimde kalan mı?","paragraf":"Aralıklı envanter - SMM formülü","yanilgi":"Dönem sonu stokun maliyeti artıran bir gider kalemi gibi toplama eklendiğini sanıyorsun."},"A":{"gercek":"Dönem başı stok satışa hazır malın parçasıdır, alışlara EKLENİR; formülden çıkarılan tek kalem dönem sonu sayım stokudur.","ayirt":"Bu kalem elimdeki malı mı artırıyor, azaltıyor mu diye kendime soruyor muyum?","paragraf":"Aralıklı envanter - SMM formülü","yanilgi":"Dönem başı stokun da bir çıkış kalemi olduğunu, satışa hazır malı azalttığını sanıyorsun."},"D":{"gercek":"Aralıklı envanterde stok hesabı cari bakiye vermez; dönem sonu stok tutarı ancak fiziki sayımla bulunup formülden ayrıca çıkarılır.","ayirt":"Dönem sonu sayım stokunu formülden düştüm mü?","paragraf":"Aralıklı envanter - SMM formülü","yanilgi":"Aralıklı envanterde stok hesabının otomatik güncellendiğini, ayrıca sayım stoku düşmeye gerek olmadığını sanıyorsun."},"B":{"gercek":"Dönem başı stok toplama, dönem sonu stok çıkarmaya girer; bu iki kalem yer değiştirilemez, sayım tarihleri farklıdır.","ayirt":"Bu tutar dönemin başındaki mi yoksa sonundaki mal mı diye ayırıyor muyum?","paragraf":"Aralıklı envanter - SMM formülü","yanilgi":"Dönem başı ve dönem sonu stok tutarlarının formülde birbirinin yerine kullanılabileceğini sanıyorsun."}},"verilen":[[5,1],[6,1],[1,1],[2,1],[3,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 48"},"kural":"Tekdüzen Hesap Planı 656 açıklamasına göre borçlanmayla ilgili kur farkları kambiyo hesaplarına değil finansman gideri hesaplarına kaydedilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 48","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[{"tutar":"12.000","taraf":"B","hesap":"780 FİNANSMAN GİDERLERİ"},{"tutar":"12.000","taraf":"A","hesap":"300 BANKA KREDİLERİ"}],"teori":false,"taktik":"Kur farkı sorularında önce farkın hangi işlemden (ticari mi finansman mı) doğduğuna bak, sonra taraf kontrolü yap.","konu":"finansman gideri işlemleri","tablo":null,"siklar":{"C":"300 BANKA KREDİLERİ hesabı 12.000 TL borçlandırılır.","E":"780 FİNANSMAN GİDERLERİ hesabı 12.000 TL alacaklandırılır.","A":"656 KAMBİYO ZARARLARI hesabı 12.000 TL borçlandırılır.","D":"646 KAMBİYO KARLARI hesabı 12.000 TL alacaklandırılır.","B":"780 FİNANSMAN GİDERLERİ hesabı 12.000 TL borçlandırılır."},"kaynak":{"alinti":"","liste":[{"ad":"THP 373 - MALİYET GİDERLERİ KARŞILIĞI","metin":"373 MALİYET GİDERLERİ KARŞILIĞI: Aylık maliyetlerin saptanmasında, gelecek aylarda veya yıl sonunda kesin tahakkuku yapılacak giderlerle aylık maliyetlere pay verilmesinde, amortismanlar, tamir-bakım, ikramiyeler, finansman giderleri .... ve benzeri giderlere ilişkin tahmini gider karşılıklarının izlendiği hesaptır. Bu hesap, bilanço dönemi sonunda kapatılır. İşleyişi : Aylık maliyetlere yüklenen tahmini gider karşılıkları bu hesaba alacak bu giderlerin kesin tutarları belli olduğunda ise bu hesaba borç kaydedilir."},{"ad":"THP 781 - FİNANSMAN GİDERLERİ YANSITMA HESABI","metin":"781 FİNANSMAN GİDERLERİ YANSITMA HESABI: Önceden saptanmış maliyet yöntemlerinin uygulandığı durumlarda, önceden saptanmış finansman giderleri ile fiili maliyet yöntemlerinin uygulandığı durumlarda \"780- Finansman Giderleri Hesabı\"nın borcuna kaydedilen giderler bu hesabın alacağı karşılığında sonuç hesaplarındaki \"66- Finansman Giderleri\" grubunun ilgili hesabına borç kaydedilir."}],"hakem":"Kaynak metinde THP 656 açıklaması, borçlanma ile ilgili kur farkların finansman gideri olarak muhasebeleştirilmesi gerektiğini açıkça belirtmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Kredi borcundaki artış bir pasif hesap artışıdır; aktif taraf (gider) olarak borçlandırılmaz, pasif taraf (kredi) alacaklandırılır.","E":"Doğru hesabı bulup tarafını tersleriz; gider hesabı borç tarafında kaydedilir, alacak tarafında değil.","D":"Kredi borcunu artıran olumsuz kur farkı bir gelir değil giderdir; kambiyo karları hesabı gelir niteliği taşıdığı için seçilmez.","A":"Her kur farkını kambiyo zararı sanırız ama borçlanmayla ilgili kur farkları kambiyo hesabına yazılmaz, doğrudan finansman gideri olur."},"dogru":"Bankadan kullandığı krediye ait olumsuz kur farkı, kredi borcunu artırdığı için finansman gideridir. Kur farkları her zaman kambiyo hesabına yazılmaz; borçlanmayla ilgili olanlar doğrudan finansman gideri hesabına kaydedilir.","sinav":"Tekdüzen Hesap Planı 656. hesap açıklamasında borçlanma ile ilgili kur farkları kambiyo zararları hesabına alınmaz, finansman gideri olarak muhasebeleştirilir.","kavramlar":[{"kaynak":"Tekdüzen Hesap Planı 656","tanim":"İşletmenin yabancı para cinsinden aldığı kredilerdeki kur değişiminden ortaya çıkan ve kredi tutarını etkileyen farklar; kambiyo hesaplarına değil finansman gideri hesaplarına kaydedilir.","ad":"Borçlanmayla ilgili kur farkları"},{"kaynak":"Tekdüzen Hesap Planı 780","tanim":"Borçlanılan tutarlarla ilgili faiz, kur farkları, komisyon ve benzeri giderler; işletme faaliyetlerinin aksamadan yürütülmesi amacıyla kullanılan borçlara bağlı masraflar.","ad":"Finansman giderleri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":{"soru":"İşletmenin bankadan kullandığı kredi borcuna ilişkin dönem sonu değerlemesinde, kredinin Türk Lirası karşılığında 24.000 TL tutarında olumsuz kur farkı hesaplanmıştır. Bu işlemin muhasebeleştirilmesi aşağıdakilerden hangisidir?","tur":"olcek","kayit":[{"tutar":"24.000","taraf":"B","hesap":"780 FİNANSMAN GİDERLERİ"},{"tutar":"24.000","taraf":"A","hesap":"300 BANKA KREDİLERİ"}],"not":"Aynı olay, tutarlar değişti: kaydı yeni rakamlarla sen yap."},"tip":"kayit","soru":"İşletmenin bankadan kullandığı kredi borcuna ilişkin dönem sonu değerlemesinde, kredinin Türk Lirası karşılığında 12.000 TL tutarında olumsuz kur farkı hesaplanmıştır. Bu işlemin muhasebeleştirilmesi aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-fmuh-kolay-b/kp-177","verilenler":[],"dayanak":"Tekdüzen Hesap Planı 656 KAMBİYO ZARARLARI hesabı açıklaması","dogru":"B","oyunBonus":null,"ders":"Finansal Muhasebe","adimlar":[{"formul":"Verilen: Olumsuz kur farkı 12.000 TL (soruda verilen); Kredi türü: banka kredisi (soruda verilen)","anlatim":"Soru bize şunları vermiş: banka kredisinin dönem sonu değerlemesinde 12.000 TL olumsuz kur farkı oluşmuş. İstenen: bu farkın hangi hesaplara nasıl kaydedileceği.","verilenAdim":true,"doldur":[[0,1],[1,1]]},{"formul":"780 FİNANSMAN GİDERLERİ: kapsam = faiz + komisyon + kur farkı giderleri (borçlanmaya bağlı)","anlatim":"780 Finansman Giderleri nedir? Borçlanmayla ilgili faiz, komisyon ve kur farkı giderlerini toplayan hesaptır. Gider arttığı için borç tarafına yazılır.","doldur":[]},{"formul":"300 BANKA KREDİLERİ: kapsam = kısa vadeli banka ve finans kuruluşu kredileri","anlatim":"300 Banka Kredileri nedir? İşletmenin bankadan aldığı kısa vadeli kredi borcunu gösterir. Kredi borcu büyüdüğü için alacak tarafına yazılır.","doldur":[]},{"formul":"780 FİNANSMAN GİDERLERİ (BORÇ) 12.000 = 12.000 olumsuz kur farkı (soruda verilen); 300 BANKA KREDİLERİ (ALACAK) 12.000 = 12.000 olumsuz kur farkı (soruda verilen)","anlatim":"Kur farkı borcu artırdığı için krediyi büyütüyoruz, karşılığında gider yazıyoruz. Dikkat: bu fark kambiyo hesabına değil finansman gideri hesabına girer, çünkü borçlanmayla ilgili.","doldur":[[0,0],[0,1],[1,0],[1,1]]},{"formul":"780 FİNANSMAN GİDERLERİ (BORÇ) 12.000 = 300 BANKA KREDİLERİ (ALACAK) 12.000","anlatim":"Sonuç: kayıt 780 FİNANSMAN GİDERLERİ borç, 300 BANKA KREDİLERİ alacak 12.000 TL şeklindedir. Bu kayıt kredi borcunun kur farkı kadar büyüdüğünü ve giderin oluştuğunu gösterir.","doldur":[]},{"formul":"Ters durum: olumlu kur farkı → 300 BANKA KREDİLERİ (BORÇ), 660 KISA VADELİ BORÇLANMA GİDERLERİ (-) hesabına ters kayıt","anlatim":"Ters durumda: kur farkı olumlu olsaydı, yani kredi TL karşılığı azalsaydı, 300 BANKA KREDİLERİ borçlandırılır ve karşılığında 646 KAMBİYO KÂRLARI değil yine finansman geliri hesabı kullanılır.","doldur":[]},{"formul":"Yanlış yol: 656 KAMBİYO ZARARLARI (BORÇ) 12.000 (HATALI) → doğrusu 780 FİNANSMAN GİDERLERİ (BORÇ) 12.000 (4. adımda bulduk)","anlatim":"En sık hata: öğrenci bu farkı 656 KAMBİYO ZARARLARI hesabına yazar. Yanlış, çünkü borçlanmayla ilgili kur farkları Tekdüzen Hesap Planı 656 açıklamasına göre kambiyo hesabına değil finansman gideri hesabına girer.","doldur":[]}],"anahtar":[{"ornek":"finansman","kok":"finans"},{"ornek":"borçlanmayla","kok":"borçla"},{"ornek":"kambiyo","kok":"kambiy"},{"ornek":"ilgili","kok":"ilgili"},{"ornek":"gideri","kok":"gideri"},{"ornek":"hesaplarına","kok":"hesapl"},{"ornek":"780","kok":"780"}],"konuGiris":{"harita":"Ne zaman test edilir: dönem sonunda kredi borcu Türk Lirası karşılığına göre yeniden değerlenirken. Nasıl ölçülür: kredinin dönem sonu kur değeriyle kayıtlı değeri arasındaki fark tutarınca. Nasıl kaydedilir: borçlanmadan doğan olumsuz fark 780 Finansman Giderleri hesabının borcuna, karşılığında kredi hesabının alacağına yazılır.","desen":"Sınav genelde öğrenciyi kur farkını 656 Kambiyo Zararları hesabına yazdırmaya yönlendirir; oysa borçlanmayla ilgili kur farkı finansman gideridir. Doğru kayıt 780 borç, 300 Banka Kredileri alacak şeklindedir. Bu soru Tekdüzen Hesap Planı 656 ve 780 hesap tanımlarındaki \u0027borçlanma ile ilgili kur farkları finansman gideridir\u0027 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Borçlanmayla ilgili faiz, kur farkı, komisyon giderlerinin borç kaydedildiği hesap","ad":"780 Finansman Giderleri Hesabı","kim":"Tekdüzen hesap planı"},{"kaynak":"kuraldan bilinir","tanim":"Borçlanma dışı kambiyo işlemlerinden doğan zararların izlendiği hesap, borç kur farkı burada değil","ad":"656 Kambiyo Zararları","kim":"Tekdüzen hesap planı"},{"kaynak":"soruda verilir","tanim":"Kısa vadeli banka kredisi borcunun izlendiği pasif hesap, kur artışı bu hesabı artırır","ad":"300 Banka Kredileri","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Kredinin TL karşılığının artması sonucu oluşan ek borç tutarı","ad":"Olumsuz kur farkı","kim":"piyasa fiyatlar"}],"sinavda":"Kredi borcuna ait olumsuz kur farkı tutarı verilir, bunun hangi hesaplara hangi yönde kaydedileceği istenir.","panel_ornek":"Arkadaşın taksitle aldığı 2. el bisiklet için dövizli kredi kullansa ve kur yükselince borcu 50 TL artsa, bu artış onun için ekstra bir masraftır. Bisiklet parası artmıyor, sadece borcu ödemek daha pahalı hale
