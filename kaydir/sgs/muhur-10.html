ilyacıya özel dolap siparişi için 3 yıl sonra teslim şartıyla 10.000 TL avans verdin. Teslim tarihine 1 yıldan az kalınca bu tutar defterde ayrı bir hesaba aktarılır. Rakam küçük ama mantık aynı: vade kısalınca hesap değişir.","ornek":"Bir mobilyacıya özel dolap siparişi için 3 yıl sonra teslim şartıyla 10.000 TL avans verdin. Teslim tarihine 1 yıldan az kalınca bu tutar defterde ayrı bir hesaba aktarılır. Rakam küçük ama mantık aynı: vade kısalınca hesap değişir.","yontemler":"Teslim tarihinden bilanço tarihine kalan süre bir yılın altına düştüyse 440 hesap borçlandırılıp 340 hesaba alacak kaydı yapılır; KDV hesabı bu aktarımda kullanılmaz.","nedir":"Bu konu, uzun vadeli alınan sipariş avanslarının vade kısalınca 440\u0027tan 340\u0027a nasıl aktarılacağını inceler. Sınav, hesap kodunun vadeye göre doğru seçilip seçilemediğini ölçer."},"olay":"1.200.000 x %25 = 300.000 TL avans; 01.02.2027 ile 31.12.2026 arası 1 ay kalmıştır, kalan vade bir yılın altındadır.","tuzak":{"C":{"ad":"Karşı Hesap Tuzağı","metin":"Aktarımın karşı ayağı olan 340 hesabının da borçlu çalıştığını düşünürsün. Doğrusu: 340 ALINAN SİPARİŞ AVANSLARI hesabına giren tutar alacak kaydıyla açılır, borçlu değildir."},"E":{"ad":"Tutar Tuzağı","metin":"Sözleşmenin henüz tahsil edilmeyen 900.000 TL\u0027lik kalan kısmını da avans tutarına dahil edersin. Doğrusu: 440 hesabında yalnız gerçekten tahsil edilen 300.000 TL izlenir, 900.000 TL değildir."},"D":{"ad":"KDV Katmanı Tuzağı","metin":"Vade sınıflandırma aktarımında da KDV hesaplanacağını düşünürsün. Doğrusu: KDV ancak fiili teslim veya fatura düzenlendiğinde doğar, bu kayıtta 391 hesabı hiç kullanılmaz."},"B":{"ad":"Taraf Tuzağı","metin":"Vade aktarımında 440 hesabının borç yerine alacak tarafına yazılacağını düşünürsün. Doğrusu: Vadesi kısalan tutar hesaptan çıkarıldığı için 440 hesabı borçlandırılır, alacaklandırılmaz."}},"celdiriciYol":{"C":"1.200.000 x %25 = 300.000 TL, karşı hesabın tarafı ters yazıldı = 300.000 (karşı hesap taraf hatası)","E":"1.200.000 - 300.000 = 900.000 (tahsil edilmeyen kalan bedeli avans tutarına dahil etme hatası)","D":"300.000 x %20 = 60.000 (teslim/fatura yokken KDV\u0027yi hesaba katma hatası)","B":"1.200.000 x %25 = 300.000 TL, borç/alacak tarafı ters yazıldı = 300.000 (taraf ters çevirme)"},"hap":"Alınan sipariş avansında vadesi bir yılın altına düşen tutar, teslim veya fatura gerçekleşmeden önce 440 hesaptan borçlandırılıp 340 hesaba alacak kaydıyla aktarılır; KDV bu aktarımda hesaplanmaz.","teshis":{"C":{"gercek":"340 hesabına aktarılan tutar, kısa vadeli avans olarak bu hesabın alacağına kaydedilir.","ayirt":"340 hesabına tutar giriyor mu çıkıyor mu, giriş hangi tarafa yazılır?","paragraf":"MSUGT Sıra No:1 - 340/440 Alınan Sipariş Avansları işleyişi","yanilgi":"340 hesabının açılışını da borç kaydı sanıyorsun."},"E":{"gercek":"440 hesabında yalnız gerçekten nakden tahsil edilen avans tutarı izlenir; tahsil edilmeyen kısım bu hesaba girmez.","ayirt":"Bu tutar gerçekten nakden tahsil edildi mi?","paragraf":"MSUGT Sıra No:1 - 440 Alınan Sipariş Avansları işleyişi","yanilgi":"Sözleşmenin toplam bedelini veya tahsil edilmeyen kalan kısmını da avans hesabına yazılması gerektiğini düşünüyorsun."},"A":{"gercek":"MSUGT Tekdüzen Hesap Planı\u0027na göre 440 hesaptaki vadesi bir yılın altına düşen avans, 440 hesaba borç 340 hesaba alacak kaydıyla aktarılır.","ayirt":"Vadesi kısalan tutar hangi hesaptan çıkıyor, hangi hesaba giriyor?","paragraf":"MSUGT Sıra No:1 - 440 Alınan Sipariş Avansları işleyişi","yanilgi":"Bu şıkkı elerken vade aktarımının borç/alacak yönünü ters düşünüyorsun."},"D":{"gercek":"KDV, mal/hizmetin fiilen teslimi veya faturanın düzenlenmesiyle doğar; salt vade sınıflandırma aktarımında KDV hesaplanmaz.","ayirt":"Bu kayıtta gerçek bir teslim veya fatura var mı?","paragraf":"MSUGT Sıra No:1 - 440 Alınan Sipariş Avansları işleyişi","yanilgi":"Sorudaki KDV oranını her kayda otomatik uygulanması gereken bir bilgi sanıyorsun."},"B":{"gercek":"Hesaptan çıkan/aktarılan tutar borç tarafına kaydedilir; 440 hesabı bu işlemde borçlanır.","ayirt":"Bu tutar 440 hesabından mı çıkıyor, çıkıyorsa hangi tarafa yazılır?","paragraf":"MSUGT Sıra No:1 - 440 Alınan Sipariş Avansları işleyişi","yanilgi":"440 hesabının azalışını alacak kaydı sanıyorsun."}},"verilen":[[8,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]],"donem":2,"hesaplar":{"340":{"ad":"ALINAN SİPARİŞ AVANSLARI","tanim":"İşletmenin satış sözleşmesine dayanarak mal ve hizmet teslim etmeden önce tahsil ettiği tutarların izlendiği hesaptır."},"440":{"ad":"ALINAN SİPARİŞ AVANSLARI","tanim":"İşletmenin satış sözleşmesine dayanarak mal ve hizmetin tesliminden önce tahsil ettiği bir yılı aşan avansların izlendiği hesaptır. İşleyişi: Alıcılardan alınan avanslar bu hesaba alacak, vadesi bir yılın altına düşenler \"340- Alınan Sipariş Avansları Hesabı\"na aktarılmak suretiyle bu hesaba borç kaydedilir."},"391":{"ad":"HESAPLANAN KDV","tanim":"Bu hesap; teslim edilen mal veya ifa edilen hizmetler üzerinden hesaplanan Katma Değer Vergisi ile işlemi gerçekleşmeyen ya da işlemden vazgeçilen mal ve hizmetlere ilişkin katma değer vergisinin izlendiği hesaptır. İşleyişi: Hesaplanan Katma Değer Vergisi bu hesaba alacak kaydedilir. Düzeltmeler bu hesaba borç kaydedilir."}}},{"capa":null,"kural":"213 sayılı Vergi Usul Kanunu m.370/b uyarınca had aşılsa bile toplam alışların yüzde beşi aşılmadıkça izaha davet mümkündür.","olcum":{"pencere":7,"hesapKod":0,"capa":"","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"İki eşikli sorularda önce sabit haddi, sonra oranı ayrı ayrı hesapla; sadece birine bakıp karar verme.","konu":"vuk uygulama alanı","tablo":{"satirlar":[["VERİLENLER","-"],["Sahte belge tutarı","900.000 TL"],["Toplam alışlar","20.000.000 TL"],["Kanuni had","870.000 TL"],["HESAP","-"],["Yüzde beş sınırı (20.000.000 x %5)","1.000.000"],["Sahte belge tutarı ile karşılaştırma","900.000 \u003c 1.000.000"],["Sonuç","İzaha davet edilebilir"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"Sahte belge tutarının toplam alışlara oranı yüzde beşi aştığından mükellef izaha davet edilemez.","E":"Mükellef izaha davet edilse dahi bu tespitle sınırlı olarak pişmanlık hükümlerinden yararlanabilir.","A":"Vergi Usul Kanununun 359 uncu maddesi kapsamındaki tüm fiillerde had veya oran istisnası bulunmadığından izaha davet edilemez.","D":"Sahte belge tutarı haddi aşsa da toplam alışların yüzde beşini aşmadığından mükellef izaha davet edilebilir.","B":"Sahte belge tutarı 870.000 TL haddi aştığından mükellef hiçbir şekilde izaha davet edilemez."},"kaynak":{"alinti":"","liste":[{"ad":"VUK (213 s.K.) m.370 - İzaha davet [1/2]","metin":"İzaha davet: Madde 370 – (Mülga: 30/12/1980-2365/89 md.; Yeniden düzenleme: 15/7/2016-6728/22 md.) (Değişik:5/12/2019-7194/25 md.) a) Vergi incelemesine başlanılmadan veya takdir komisyonuna sevk edilmeden önce verginin ziyaa uğradığına delalet eden emareler bulunduğuna dair yetkili merciler tarafından yapılmış ön tespitler hakkında tespit tarihine kadar ihbarda bulunulmamış olması kaydıyla mükellefler izaha davet edilebilir. Kendisine izaha davet yazısı tebliğ edilen mükellefler, davet konusu tespitle sınırlı olarak, bu Kanunun 371 inci maddesinde yer alan pişmanlık hükümlerinden yararlanamaz. İzaha davet yazısının tebliğ tarihinden itibaren otuz günlük süre içerisinde izahta bulunulması durumunda, yapılan izah değerlendirilerek değerlendirme sonucunu içeren yazı mükellefe tebliğ edilir. 1. Mükelleflerce yapılan izah sonucu vergi ziyaına sebebiyet verilmediğinin idarece anlaşılması hâlinde mükellefler söz konusu tespitle ilgili olarak vergi incelemesine tabi tutulmaz veya takdir komisyonuna sevk edilmez. 2. Mükelleflerce yapılan izahın yeterli bulunmaması hâlinde, değerlendirme sonucunu içeren yazının tebliğ edildiği tarihten itibaren otuz gün içerisinde; hiç verilmemiş olan vergi beyannamelerinin verilmesi, eksik veya yanlış yapılan vergi beyanının tamamlanması veya düzeltilmesi ve ödeme süresi geçmiş bulunan vergilerin, ödemenin geciktiği her ay ve kesri için, 6183 sayılı Kanunun 51 inci maddesinde belirtilen nispette uygulanacak gecikme zammı oranında bir zamla aynı sürede ödenmesi şartıyla vergi ziyaı cezası, ziyaa uğratılan vergi üzerinden %20 oranında kesilir. Bu dur…"},{"ad":"VUK (213 s.K.) m.370 - İzaha davet [2/2]","metin":"b) (a) fıkrası uyarınca yapılmış ön tespitlerin, verginin bu Kanunun 359 uncu maddesinde yer alan fiillerle ziyaa uğratılmış olabileceğine ilişkin olması hâlinde bu kapsamdaki mükellefler izaha davet edilmez. Şu kadar ki, sahte veya muhteviyatı itibarıyla yanıltıcı belge kullanma fiilinin işlenmiş olabileceğine dair yapılan ön tespitlerde, kullanılan sahte veya muhteviyatı itibarıyla yanıltıcı belge tutarı, bir takvim yılında 100 bin Türk lirasını (bu tutar her yıl yeniden değerleme oranında artırılarak uygulanır; 1.1.2025\u0027ten itibaren 700.000 TL - VUK Genel Tebliği Sıra No: 577) geçmeyen veya bu tutarı geçse bile ilgili yıldaki toplam mal ve hizmet alışlarının %5’ini aşmayan mükelleflere ön tespite ilişkin yazı tebliğ edilebilir. Mükelleflerce, haklarında yapılan tespite ilişkin yazının tebliğ edildiği tarihten itibaren otuz gün içerisinde; hiç verilmemiş olan vergi beyannamelerinin verilmesi, eksik veya yanlış yapılan vergi beyanının tamamlanması veya düzeltilmesi ve ödeme süresi geçmiş bulunan vergilerin, ödemenin geciktiği her ay ve kesri için, 6183 sayılı Kanunun 51 inci maddesinde belirtilen nispette uygulanacak gecikme zammı oranında bir zamla aynı sürede ödenmesi şartıyla vergi ziyaı cezası, ziyaa uğratılan vergi üzerinden %20 oranında kesilir. Bu durum vergi incelemesi yapılmasına ve gerekirse tarhiyatın ikmaline engel teşkil etmez. Bu fıkra kapsamında kendisine ön tespite ilişkin yazı tebliğ edilen mükellefler, tespitle sınırlı olarak bu Kanunun 371 inci maddesinde yer alan pişmanlık hükümlerinden yararlanamaz. Bu fıkrada yer alan tutar, her yıl bir önceki yıla il…"}],"hakem":"VUK m.370/b fıkrasında sahte belge kullanma durumunda izaha davet koşulu açıkça tanımlanmış: had aşılsa bile toplam mal ve hizmet alışlarının %5\u0027ini aşmayan mükelleflere ön tespite ilişkin yazı tebliğ edilebilir; soru verilen değerlerle (900.000 TL \u003c 20.000.000 TL × %5 = 1.000.000 TL) bu koşulu tam karşılayıp izaha davetin mümkün olduğunu doğru belirtir."},"kayitlar":[],"sade":{"siklar":{"C":"Yüzde beş sınırı doğru hesaplandığında 900 bin lira, 1 milyon liranın altında kalır; oran aşılmamıştır.","E":"İzaha davet mükellef pişmanlık kullanmasını engeller; bu durum davete tabi olan mükellefte de geçerlidir.","A":"Cevaptan had ve oran istisnasının bulunduğu görülmüyor; kanun sahte belgeler için genel kuraldan ayrı bir muamele öngörmüştür.","B":"Sabit haddin aşılması tek başına daveti engellemiyor; yüzde beş oranı da kontrol edilmelidir."},"dogru":"Sahte belge tutarı 870 bin lirayı aştığı için genel kural izaha daveti yasaklasa da, sahte belge için ayrı istisna vardır: toplam alışların yüzde beşini aşmadığı sürece mükellefi çağırmak mümkündür. Burada 900 bin lira, 20 milyon liranın yüzde beşi olan 1 milyon liranın altında kaldığından izaha davet yapılabilir.","sinav":"Vergi Usul Kanunu 370. madde uyarınca sahte belge kullanmada, tutar haddi aşsa da toplam alışların yüzde beşini aşmadıkça izaha davet mümkündür.","kavramlar":[]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":{"bosluk":[[0,1],[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Yüzde beş sınırı (24.000.000 x %5)","1.200.000"],["Sahte belge tutarı ile karşılaştırma","1.100.000 \u003c 1.200.000"],["Sonuç","İzaha davet edilebilir"]]},"tur":"tablo","soru":"İşletme 2026 yılında 1.100.000 TL tutarında sahte belge kullanmış, aynı yıl toplam mal ve hizmet alışları 24.000.000 TL\u0027dir. Vergi Usul Kanunu m.370 uyarınca ilgili haddin 950.000 TL olduğu varsayıldığında mükellefin izaha davet edilip edilemeyeceğini belirleyiniz.","verilen":[[0,1],[1,1]],"hedef":"Tabloyu doldur ve mükellefin izaha davet edilip edilemeyeceğini bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşletme 2026 yılında 900.000 TL tutarında sahte belge kullanmış, aynı yıl toplam mal ve hizmet alışları 20.000.000 TL\u0027dir. Vergi Usul Kanunu m.370 uyarınca ilgili haddin 870.000 TL olduğu varsayıldığında mükellefin izaha davet edilip edilemeyeceği aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-vergi-kolay/kp-13","verilenler":[{"deger":"900.000 TL","anlam":"Mükellefin 2026 yılında kullandığı sahte belgenin toplam tutarı; had ve oran kontrolünün tabanıdır.","ad":"Sahte belge tutarı"},{"deger":"20.000.000 TL","anlam":"Mükellefin ilgili yıldaki toplam mal ve hizmet alışları; yüzde beş sınırının hesaplandığı taban.","ad":"Toplam alışlar"},{"deger":"870.000 TL","anlam":"2026 yılı için geçerli sabit tutar haddi; bu had aşılsa da yüzde beş sınırı ayrıca kontrol edilir.","ad":"Kanuni had"}],"dayanak":"213 sayılı Vergi Usul Kanunu m.370/b","dogru":"D","oyunBonus":null,"ders":"Vergi Hukuku","adimlar":[{"formul":"Verilen: Sahte belge tutarı 900.000 TL (soruda verilen); Toplam alış 20.000.000 TL (soruda verilen); Kanuni had 870.000 TL (soruda verilen)","anlatim":"Soru bize şunları vermiş: sahte belge tutarı 900.000 TL, toplam mal-hizmet alışı 20.000.000 TL, Vergi Usul Kanunu m.370\u0027teki had 870.000 TL.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kural: had aşımı tek başına izaha daveti engellemez, asıl sınır toplam alışın %5\u0027idir","anlatim":"İzaha davet nedir? Vergi incelemesi başlamadan önce mükellefe açıklama fırsatı veren bir kurumdur. Vergi Usul Kanunu m.370/b\u0027ye göre had aşılsa bile toplam alışların yüzde beşi aşılmadıkça bu yol açıktır.","doldur":[]},{"formul":"Yüzde beş sınırı = Toplam alış × %5 = 20.000.000 (soruda verilen) × %5 = 1.000.000 TL","anlatim":"Şimdi yüzde beş sınırını hesaplıyoruz. Bu sınır, toplam alışların yasada belirlenen oranla çarpılmasıyla bulunur.","doldur":[[5,1]]},{"formul":"Karşılaştırma: Sahte belge tutarı ile Yüzde beş sınırı → büyük olan: 900.000 (soruda verilen) ile 1.000.000 (3. adımda bulduk) → 1.000.000","anlatim":"Şimdi sahte belge tutarını bu sınırla karşılaştırıyoruz. Sınırın altında kalırsa izaha davet kapısı açık kalır.","doldur":[[6,1]]},{"formul":"Sonuç: 900.000 (soruda verilen) \u003c 1.000.000 (3. adımda bulduk) → izaha davet mümkün","anlatim":"900.000 TL, 1.000.000 TL\u0027nin altında kaldığı için mükellef izaha davet edilebilir. Had aşılmış olması burada sonucu değiştirmez.","doldur":[[7,1]]},{"formul":"Ters durum: sahte belge tutarı \u003e yüzde beş sınırı → izaha davet edilemez","anlatim":"Ters durumda: sahte belge tutarı yüzde beş sınırını aşsaydı izaha davet artık mümkün olmazdı. Yani asıl belirleyici had değil, yüzde beş sınırıdır.","doldur":[]},{"formul":"Yanlış yol: 900.000 \u003e 870.000 (had) → izaha davet edilemez (HATALI) → doğrusu 900.000 \u003c 1.000.000 (5. adımda bulduk) → izaha davet edilebilir","anlatim":"En sık hata: öğrenci 900.000 TL\u0027yi doğrudan 870.000 TL\u0027lik hadle karşılaştırıp had aşıldı diye izaha davet edilemez sanır. Asıl karşılaştırma hadle değil, toplam alışın yüzde beşiyle yapılır.","doldur":[]}],"anahtar":[{"ornek":"alışların","kok":"alışla"},{"ornek":"sınırını","kok":"sınırı"},{"ornek":"aşılmasını","kok":"aşılma"},{"ornek":"karşılaştırıyoruz","kok":"karşıl"},{"ornek":"kanunu","kok":"kanunu"},{"ornek":"aşılsa","kok":"aşılsa"}],"konuGiris":{"harita":"Ne zaman test edilir: Mükellef hakkında sahte belge kullanımına ilişkin ön tespit yapıldığında test edilir. Nasıl ölçülür: Kullanılan sahte belge tutarı, hem mutlak had hem de toplam alışların yüzdesiyle karşılaştırılarak ölçülür. Nasıl kaydedilir: Sonuç, izaha davetin mümkün olup olmadığı şeklinde tek bir hukuki değerlendirme olarak kaydedilir.","desen":"Sınav, sahte belge tutarını hem mutlak had hem de toplam alışların yüzdesiyle karşılaştırmayı zorunlu kılan çift koşullu bir hesaplama kurar. Öğrenci genelde sadece hadle veya sadece yüzdeyle karşılaştırıp ikisini birlikte değerlendirmeyi atlar; oysa had aşılsa bile yüzde aşılmıyorsa izaha davet yine mümkündür. Bu soru izaha davetin istisnai koşullarının belirlendiği hükümden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İnceleme başlamadan önce mükellefin açıklama yapmaya çağrılması","ad":"İzaha davet","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Sahte belge tutarının altında kalırsa izaha davetin mümkün olduğu mutlak sınır","ad":"Yıllık had","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Sahte belge tutarının toplam alışlara oranının aşılmaması gereken yüzdesi","ad":"Yüzde beş ölçütü","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mükellefin kullandığı belgelerin toplam parasal değeri","ad":"Sahte belge tutarı","kim":"mükellef / işveren beyan eder"}],"sinavda":"Sahte belge tutarı, ilgili had ve toplam alışların yüzdesiyle karşılaştırılarak izaha davetin mümkün olup olmadığı sorulur.","panel_ornek":"Bir arkadaşının kirada oturduğu evde, kontratta yazan aidat sınırı 300 TL iken kendisinden 250 TL istenmiş; sınırın altında kaldığı için ek ödeme yapmasına gerek yok. Ama komşusundan 320 TL istenmiş, sınırı aştığı için itiraz hakkı doğmuş. Bir sayı, belirlenen sınırın altında mı üstünde mi diye bakmak, hakkın doğup doğmadığını belirler.","ornek":"Bir arkadaşının kirada oturduğu evde, kontratta yazan aidat sınırı 300 TL iken kendisinden 250 TL istenmiş; sınırın altında kaldığı için ek ödeme yapmasına gerek yok. Ama komşusundan 320 TL istenmiş, sınırı aştığı için itiraz hakkı doğmuş. Bir sayı, belirlenen sınırın altında mı üstünde mi diye bakmak, hakkın doğup doğmadığını belirler.","yontemler":"Önce tutar hadle karşılaştırılır, sonra toplam alışların yüzdesiyle karşılaştırılır; ikisinden herhangi biri aşılmıyorsa izaha davet mümkündür.","nedir":"Bu konu, sahte belge kullanımı gibi ağır fiillerde mükellefin izaha davet edilip edilemeyeceğini belirleyen had ve oran kurallarını inceler. Sınav, verilen tutarların yasal sınırları aşıp aşmadığını hesaplayabilmeyi ölçer."},"olay":"yüzde beş sınırı 20.000.000 x %5 = 1.000.000 TL; 900.000 TL bu sınırın altında kalır.","tuzak":{"C":{"ad":"Oran Tuzağı","metin":"öğrenci yüzde beş oranını doğru tabana (toplam alışlara) uygulamadan sonucu yanlış yorumlayıp sınırın aşıldığını düşünür. Doğrusu: 900.000/20.000.000 oranı yüzde beşin altındadır, sınır aşılmamıştır."},"E":{"ad":"Pişmanlık Tuzağı","metin":"öğrenci izaha davet edilen mükellefin aynı tespitle sınırlı olarak pişmanlık hükümlerinden de yararlanabileceğini sanır. Doğrusu: izaha davet yazısı tebliğ edilen mükellef, o tespitle sınırlı olarak pişmanlık hükümlerinden yararlanamaz."},"A":{"ad":"Kapsam Tuzağı","metin":"öğrenci 359 üncü madde kapsamındaki tüm fiillerin istisnasız izaha davet dışı olduğunu sanır, sahte belge kullanımına özgü had/oran istisnasını gözden kaçırır. Doğrusu: kanun sahte belge kullanımı için ayrı bir had ve oran istisnası öngörmüştür."},"B":{"ad":"Had Tuzağı","metin":"öğrenci yalnız sabit haddin (870.000 TL) aşıldığını görüp ikinci eşik olan yüzde beş kontrolünü hiç yapmaz. Doğrusu: had aşımı tek başına izaha daveti engellemez, yüzde beş sınırının da aşılması gerekir."}},"celdiriciYol":{"C":"900.000 tutarı yüzde beş sınırıyla değil doğrudan had ile kıyaslanıp sınırın aşıldığı sonucuna varılır (oran tabanı yanlış kurulur)","E":"izaha davet ile pişmanlık hükümleri birbirinden ayrılmadan aynı anda uygulanabilir sanılır (istisna hükmü gözden kaçırılır)","A":"359 üncü madde kapsamı genelleştirilip özel istisna hükmü yok sayılır (kapsam daraltıcı istisna atlanır)","B":"900.000 \u003e 870.000 karşılaştırması tek başına yeterli sayılır, yüzde beş kontrolü atlanır (had aşımı tek başına engel sanılır)"},"hap":"İzaha davet dışı kalma, sahte belge kullanımında hem sabit tutar haddinin hem toplam alışların yüzde beşinin BİRLİKTE aşılmasını gerektirir; biri aşılsa da diğeri aşılmazsa izaha davet yolu açıktır.","teshis":{"C":{"gercek":"Oran, sahte belge tutarının o yıla ait toplam mal ve hizmet alışlarına bölünmesiyle bulunur; burada 900.000/20.000.000 yüzde beşin altındadır.","ayirt":"Oranı hesapladım mı, yoksa doğrudan aşıldığını mı varsaydım?","paragraf":"213 sayılı VUK m.370/b","yanilgi":"Yüzde beş oranını doğru tabana uygulamadan, sonucu sınırın aşıldığı yönünde yorumluyorsun."},"E":{"gercek":"Madde açıkça, izaha davet yazısı tebliğ edilen mükellefin o tespitle sınırlı olarak pişmanlık hükümlerinden yararlanamayacağını hükme bağlar.","ayirt":"Bu tespitle sınırlı olarak pişmanlık hükmü hâlâ açık mı, yoksa kapatıldı mı?","paragraf":"213 sayılı VUK m.370/a","yanilgi":"İzaha davet edilen mükellefin, aynı tespit için pişmanlık hükümlerinden de yararlanabileceğini sanıyorsun."},"D":{"gercek":"Vergi Usul Kanunu m.370/b, sahte belge kullanımında hem tutar haddini hem toplam alışların yüzde beşini birlikte aşma şartını arar; ikisi birden aşılmadıkça izaha davet kapısı kapanmaz.","ayirt":"Had aşıldı diye hemen mi karar verdim, yoksa yüzde beş kontrolünü de yaptım mı?","paragraf":"213 sayılı VUK m.370/b","yanilgi":"Bu şıkkı eleyen öğrenci, tek bir eşiğin (had ya da oran) yeterli olduğunu düşünüp ikisinin birlikte değerlendirilmesi gerektiğini gözden kaçırır."},"B":{"gercek":"Kanun, had aşılsa bile alışların yüzde beşini aşmayan mükelleflere ön tespit yazısı tebliğ edilebileceğini düzenler; had tek başına belirleyici değildir.","ayirt":"Had aşıldı diye mi durdum, yüzde beş sınırını hesapladım mı?","paragraf":"213 sayılı VUK m.370/b","yanilgi":"Sabit had aşıldığında işin bittiğini, ikinci bir kontrole gerek kalmadığını düşünüyorsun."},"A":{"gercek":"Kanun, sahte veya muhteviyatı itibarıyla yanıltıcı belge kullanma fiiline özgü had ve yüzde beş istisnasını ayrıca düzenlemiştir; bu istisna 359 üncü madde kapsamını daraltır.","ayirt":"359 üncü maddedeki her fiil aynı mı davranıyor, yoksa özel bir istisna var mı?","paragraf":"213 sayılı VUK m.370/b","yanilgi":"359 üncü madde kapsamındaki her fiilin istisnasız izaha davet dışı olduğunu sanıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 88"},"kural":"BDS 705 p.2 uyarınca yanlışlığın etkisi önemli olmakla birlikte yaygın olmadığı durumda sınırlı olumlu görüş verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 88","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklarda önemli/yaygın ikilisini ayrı ayrı işaretle, yalnız \u0027önemli+yaygın değil\u0027 kutusu sınırlı olumlu görüştür.","konu":"sınırlı olumlu görüş nedenleri","tablo":{"satirlar":[["A) Denetçinin, finansal tablolardaki yanlışlıkların hem öne…","p.2","YANLIŞ ifade"],["B) Tespit edilen yanlışlıkların finansal tablolar üzerindek…","p.2","doğru ifade"],["C) Yeterli ve uygun denetim kanıtı elde edilememesinin muht…","p.2","YANLIŞ ifade"],["D) Elde edilen denetim kanıtlarının, finansal tabloların ön…","p.4","YANLIŞ ifade"],["E) Tespit edilen yanlışlıkların finansal tablolar üzerinde …","p.2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yeterli ve uygun denetim kanıtı elde edilememesinin muhtemel etkisinin hem önemli hem de yaygın olabileceği sonucuna varılması","E":"Tespit edilen yanlışlıkların finansal tablolar üzerinde önemli bir etkisinin bulunmadığı sonucuna varılması","A":"Denetçinin, finansal tablolardaki yanlışlıkların hem önemli hem de yaygın olduğu sonucuna varması","D":"Elde edilen denetim kanıtlarının, finansal tabloların önemli yanlışlık içermediğini göstermesi","B":"Tespit edilen yanlışlıkların finansal tablolar üzerindeki etkisinin önemli olabileceği ancak yaygın olmayabileceği sonucuna varılması"},"kaynak":{"alinti":"","liste":[{"ad":"BDS 705 p.1 - Giriş - Kapsam","metin":"BDS 705 (Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi) paragraf 1: Bu Bağımsız Denetim Standardı (BDS), denetçinin BDS 700 uyarınca bir görüş oluştururken, finansal tablolara ilişkin olumlu görüş dışında bir görüş vermesi gerektiği sonucuna varması durumunda, içinde bulunulan şartlara uygun bir rapor düzenleme sorumluluğunu ele alır. Ayrıca bu BDS\u0027de denetçinin, raporunda olumlu görüş dışında bir görüş vermesi durumunda raporun şeklinin ve içeriğinin nasıl etkilendiği de ele alınır. BDS 700\u0027de yer alan raporlama yükümlülükleri tüm denetimler için geçerlidir. Dolayısıyla, BDS 705 tarafından açıkça ele alınmadıkça veya değiştirilmedikçe söz konusu raporlama yükümlülükleri bu BDS\u0027de tekrar edilmez. Bu BDS\u0027de, aynı numaralı paragraflarda, T kodlu paragraflar (örneğin 29 ve 29T) ülkemizde geçerli olan uygulamayı (Türkiye uygulamasını) göstermekte olup Kurum tarafından getirilen ilâve yükümlülükleri belirtmektedir. Söz konusu ilâve yükümlülükler, aynı numaralı paragrafta belirtilen alternatifleri azaltabilir, uygulama kapsamını genişletebilir veya denetçinin ilâve çalışma ile raporlama yapmasını gerektirebilir. T kodlu olmayan aynı numaralı paragraflar, Uluslararası Denetim Standartlarının çevirisi olup denetçilerin uluslararası uygulamaya ilişkin farkındalıklarını korumak amacıyla aynen bırakılmıştır."},{"ad":"BDS 705 p.2 - Giriş - Olumlu Görüş Dışındaki Görüş Türleri","metin":"BDS 705 (Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi) paragraf 2: Bu BDS\u0027de -olumlu görüş dışında bir görüş verileceği zaman kullanılacak- üç farklı görüş türü belirlenmektedir: sınırlı olumlu görüş (şartlı görüş), olumsuz görüş ve görüş vermekten kaçınma. Olumlu görüş dışındaki görüş türlerinden hangisinin uygun olduğuna ilişkin karar, aşağıdaki hususlara bağlıdır: (a) Olumlu görüş dışında bir görüş verilmesine sebep olan hususun niteliği; başka bir ifadeyle finansal tabloların önemli yanlışlık içerip içermediği veya yeterli ve uygun denetim kanıtının elde edilemediği durumlarda, finansal tabloların önemli yanlışlık içerebilip içermeyebileceği ve (b) İlgili hususun finansal tablolar üzerindeki etkilerinin veya muhtemel etkilerinin yaygınlığına ilişkin denetçinin muhakemesi (Bkz.: A1 paragrafı)."}],"hakem":"BDS 705 p.2 açıkça tanımlamıştır: olumlu görüş dışında bir görüş verilmesine ilişkin karar, yanlışlığın niteliği (önemli olup olmadığı) ve finansal tablolar üzerindeki etkilerinin yaygınlığına bağlıdır; sınırlı olumlu görüş, yanlışlık önemli olmakla birlikte yaygın olmadığı durumda verilir."},"kayitlar":[],"sade":{"siklar":{"C":"Kanıt yetersizliğinin etkisi hem önemli hem yaygınsa görüş vermekten kaçınılır, sınırlı olumlu görüş değil. Belirsizlik çok büyükse denetçi kesin bir sonuca varamazken, sınırlı görüş kesin sorun tespit etmektir.","E":"Önemli olmayan yanlışlık raporu hiç etkilemez ve olumlu görüş verilir. Sınırlı görüş ancak etkisi önemli ama yaygın olmayan yanlışlıkta gereklidir.","D":"Kanıtlar yanlışlık olmadığını gösteriyorsa olumlu görüş tamamen geçerlidir, herhangi bir sınırlama söz konusu değil. Şekince denetçiye çekince kalmaz.","A":"Her iki nitelik bir arada ise olumsuz görüş gerekir, sınırlı değil. Hem önemli hem yaygın yanlışlık, tablonun tamamını güvenilmez hale getirdiğinden şartlı değil kesin reddedilir."},"dogru":"Denetçi, hesaplarda bulduğu yanlışlığın şirketi önemli ölçüde etkilediğini ama tüm tablolara yaygın olmadığını görürse, sınırlı olumlu görüş verir. Yani sorun var ama yerelleşmiş; tüm finansal tabloyu geçmiyor.","sinav":"Bağımsız Denetçi Raporunda Olumlu Görüş Dışında Bir Görüş Verilmesi Standardı 2. paragraf uyarınca denetçinin sınırlı olumlu görüş vermesi gereken durum, tespit edilen yanlışlıkların finansal tablolar üzerindeki etkisinin önemli olmakla birlikte yaygın olmayabileceği sonucuna varılmasıdır.","kavramlar":[{"kaynak":"BDS 705 paragraf 2","tanim":"Denetçinin, finansal tabloları önemli bir yanlışlık açısından sorguladığı ancak bu sorunun belirli alanlarda kalıp tablonun bütünü için yaygın olmadığı durumlarda verdiği görüştür.","ad":"Sınırlı olumlu görüş"},{"kaynak":"BDS 705 paragraf 5","tanim":"Yanlışlıkların finansal tablolar üzerindeki etkisinin tablonun belirli hesapları veya kalemleriyle sınırlı olmayıp, finansal tabloların önemli bir bölümünü etkilemesi veya kullanıcıların anlamasında temel rol oynamasıdır.","ad":"Yaygınlık"},{"kaynak":"BDS 705 paragraf 2","tanim":"Finansal tabloların güvenilirliğini ve kullanıcı kararlarını etkileyecek kadar büyük ve ciddi olan, tek başına veya birikimli olarak hesapları yanlış gösteren hatadır.","ad":"Önemli yanlışlık"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"BDS 705 uyarınca denetçinin sınırlı olumlu görüş vermesi gereken durum aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-denetim-kolay/kp-42","verilenler":[],"dayanak":"BDS 705 p.2","dogru":"B","oyunBonus":null,"ders":"Denetim","adimlar":[{"formul":"Olay: bir tekstil şirketinin stok kalemi 2 milyon TL değerinde ve şirket bu stoğu maliyet bedeliyle göstermiş, ama denetçi net gerçekleşebilir değerin 1,5 milyon TL olduğunu tespit etmiş, aradaki 500 bin TL fark finansal tablolarda düzeltilmemiş.","anlatim":"Denetçi bu 500 bin TL\u0027lik farkın şirketin kâr rakamını etkilediğini görüyor. Ama bu fark, tüm finansal tabloyu baştan aşağı bozacak kadar büyük değil, sadece stok kalemiyle sınırlı. Şimdi bu olayda denetçinin vereceği görüş türünü konuşacağız.","doldur":[]},{"formul":"Ne yapacağız: BDS 705 p.2 uyarınca denetçi önce yanlışlığın veya kanıt yetersizliğinin etkisini iki eksende tartar, önemli mi ve yaygın mı. Bu 2x2 tabloyu bizim 500 bin TL\u0027lik stok farkına uygulayacağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.2","karar":"yanlış","anlatim":"Hayır, olayımızda fark sadece stok kalemiyle sınırlı, tüm tabloyu sarmıyor. Hem önemli hem yaygın olsaydı denetçi olumsuz görüş verirdi, sınırlı olumlu değil. BDS 705 p.2 bu ayrımı net çizer.","formul":"Şık A: denetçi \u0027bu fark hem kârı önemli ölçüde etkiliyor hem de tüm tabloyu güvenilmez kılıyor\u0027 dese, sınırlı olumlu görüş verir mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.2","karar":"doğru","anlatim":"Evet, tam olayımızın kendisi bu. Etki önemli ama sınırlı bir kaleme hapis, tablonun bütününü bozmuyor. BDS 705 p.2 böyle durumda sınırlı olumlu görüşü öngörür.","formul":"Şık B: denetçi \u0027500 bin TL\u0027lik fark önemli ama sadece stok kalemini ilgilendiriyor, tablonun geneline yayılmıyor\u0027 dese, sınırlı olumlu görüş verir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.2","karar":"yanlış","anlatim":"Hayır, bu bizim olayımız değil, çünkü olayımızda kanıt eksikliği yok, net bir değerleme farkı var. Ayrıca kanıt eksikliğinin etkisi hem önemli hem yaygınsa denetçi görüş bildirmekten kaçınır. BDS 705 p.2 bu durumu ayrı ele alır.","formul":"Şık C: denetçi \u0027stok sayımına katılamadım, bu yüzden kanıt toplayamadım ve bu eksikliğin etkisi hem önemli hem yaygın olabilir\u0027 dese, sınırlı olumlu görüş verir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.4","karar":"yanlış","anlatim":"Hayır, bizim olayımızda tam tersi, denetçi 500 bin TL\u0027lik bir yanlışlık buldu. Yanlışlık bulunmazsa zaten olumlu görüş verilir, sınırlı değil. BDS 705 p.4 bu temiz durumu tanımlar.","formul":"Şık D: denetçi \u0027stok değerlemesini kontrol ettim, önemli bir yanlışlık bulamadım\u0027 dese, sınırlı olumlu görüş verir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.2","karar":"yanlış","anlatim":"Hayır, olayımızda fark önemlilik eşiğini aşıyor, kâr rakamını gerçekten etkiliyor. Etkisi önemsizse zaten olumlu görüş verilir, sınırlı olumluya gerek kalmaz. BDS 705 p.2 önemlilik eşiğini arar.","formul":"Şık E: denetçi \u0027500 bin TL\u0027lik fark var ama bu kadar küçük bir tutar kararları etkilemez\u0027 dese, sınırlı olumlu görüş verir mi?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Sınırlı olumlu görüş, etkinin önemli ama sınırlı bir kalemle hapis kaldığı, tablonun genelini sarmadığı tek durumda çıkar. Kendine hep şunu sor: bu fark tabloların bütününü mü bozuyor, yoksa tek bir köşeyi mi?","doldur":[]}],"anahtar":[{"ornek":"sınırlı","kok":"sınırl"},{"ornek":"önemli","kok":"önemli"},{"ornek":"olumlu","kok":"olumlu"},{"ornek":"olayımızda","kok":"olayım"},{"ornek":"denetçi","kok":"denetç"},{"ornek":"yaygın","kok":"yaygın"}],"konuGiris":{"harita":"Ne zaman test edilir: Denetçi önemli yanlışlık veya kanıt yetersizliği tespit ettiğinde. Nasıl ölçülür: Etkinin finansal tablolara yaygın olup olmadığına göre. Nasıl kaydedilir: Raporda \u0027sınırlı olumlu görüş\u0027 ibaresiyle ve gerekçe paragrafıyla belirtilir.","desen":"Sınav genelde dört görüş türünü (sınırlı olumlu, olumsuz, kaçınma, olumlu) karıştırıp \u0027yaygın mı değil mi\u0027 ayrımını sorar. Öğrenciler çoğu zaman \u0027önemli ama yaygın değil\u0027 ile \u0027önemli ve yaygın\u0027 durumlarını birbirine karıştırır. Bu soru BDS 705 p.6 ve p.5(b) noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Önemli ama yaygın olmayan yanlışlık/kanıt yetersizliği durumunda verilen görüş türü","ad":"Sınırlı olumlu görüş","kim":"standart (BDS) sabitler"},{"kaynak":"soruda verilir","tanim":"Finansal tabloların doğruluğunu etkileyen, kullanıcı kararını değiştirebilecek hata","ad":"Önemli yanlışlık","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"soruda verilir","tanim":"Etkinin tablonun belirli kalemiyle sınırlı mı yoksa geneline mi yayıldığı","ad":"Yaygınlık","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"soruda verilir","tanim":"Denetçinin yeterli ve uygun denetim kanıtını elde edememesi durumu","ad":"Kanıt yetersizliği","kim":"denetçi mesleki yargıyla belirler"}],"sinavda":"Soru, belirli bir denetim bulgusunun niteliği ve yaygınlığı tarif edilip hangi görüş türünün verileceği sorulur.","panel_ornek":"İkinci el bir telefon alıyorsun, ekranı kırık ama her şeyi çalışıyor, sadece o küçük kusuru göz ardı edip \u0027iyi telefon\u0027 diyorsun. Bütün telefon değil, sadece bir kısmı sorunlu. İşte denetçi de tabloların tamamı değil, sadece belirli bir kalemi sorunluysa \u0027şartlı\u0027 onay verir.","ornek":"İkinci el bir telefon alıyorsun, ekranı kırık ama her şeyi çalışıyor, sadece o küçük kusuru göz ardı edip \u0027iyi telefon\u0027 diyorsun. Bütün telefon değil, sadece bir kısmı sorunlu. İşte denetçi de tabloların tamamı değil, sadece belirli bir kalemi sorunluysa \u0027şartlı\u0027 onay verir.","yontemler":"Önce hatanın önemli olup olmadığına, sonra yaygın olup olmadığına bak; ikisi de \u0027evet\u0027 değilse sınırlı olumlu görüş verilir.","nedir":"Bu konu, denetçinin ne zaman sınırlı olumlu (şartlı) görüş vereceğini anlatır. Sınav, önemli yanlışlığın veya kanıt yetersizliğinin yaygın olup olmadığını ayırt edebilme becerini ölçer."},"olay":"","tuzak":{"C":{"ad":"Kanıt-Yaygınlık Tuzağı","metin":"Öğrenci kanıt yetersizliğini otomatik olarak sınırlı olumlu görüşe bağlar, yaygınlık boyutunu gözden kaçırır. Doğrusu: Kanıt yetersizliğinin etkisi hem önemli hem yaygınsa BDS 705 p.2 uyarınca görüş vermekten kaçınılır."},"E":{"ad":"Önemlilik Eşiği Tuzağı","metin":"Öğrenci her tespit edilen yanlışlığın rapora bir çekince getireceğini düşünür. Doğrusu: Etkisi önemli olmayan yanlışlık raporu etkilemez, olumlu görüş verilir."},"D":{"ad":"Kanıt Yeterliliği Tuzağı","metin":"Öğrenci kanıtın yeterli olmasını sınırlı bir çekince nedeni sanır. Doğrusu: Kanıtlar önemli yanlışlık olmadığını gösteriyorsa olumlu görüş verilir, sınırlama söz konusu değildir."},"A":{"ad":"Yaygınlık Tuzağı","metin":"Öğrenci önemlilik ile yaygınlığı ayırt etmeden ikisi bir aradaysa da sınırlı olumlu görüş verilir sanır. Doğrusu: Etki hem önemli hem yaygınsa BDS 705 p.2 uyarınca olumsuz görüş verilir."}},"celdiriciYol":null,"hap":"Yanlışlığın veya kanıt yetersizliğinin etkisi önemli ama yaygın değilse denetçi sınırlı olumlu görüş verir.","teshis":{"C":{"gercek":"BDS 705 p.2 kanıt yetersizliğinde de yaygınlık sorgulanır; hem önemli hem yaygınsa görüş vermekten kaçınma gerekir.","ayirt":"Kanıt eksikliğinin etkisi tablo genelini mi sarıyor?","paragraf":"BDS 705 p.2","yanilgi":"Kanıt elde edememenin tek başına, yaygınlığa bakılmaksızın sınırlı olumlu görüş doğuracağını düşünüyorsun."},"E":{"gercek":"BDS 705 p.2 önemlilik eşiğini arar; etkisi önemsiz olan yanlışlık olumlu görüşü etkilemez.","ayirt":"Bu yanlışlığın etkisi finansal tablo kararlarını değiştirir mi?","paragraf":"BDS 705 p.2","yanilgi":"Her tespit edilen yanlışlığın raporu otomatik etkileyeceğini sanıyorsun."},"A":{"gercek":"BDS 705 p.2(b) yaygınlığı ayrı bir muhakeme ekseni olarak sayar; önemli ve yaygın etki olumsuz görüşü gerektirir.","ayirt":"Etki finansal tabloların geneline mi yayılıyor, yoksa sınırlı bir kaleme mi hapis?","paragraf":"BDS 705 p.2","yanilgi":"Önemli olan her yanlışlığın aynı zamanda yaygın sayılacağını, dolayısıyla sınırlı olumlu görüşün burada da geçerli olduğunu düşünüyorsun."},"D":{"gercek":"BDS 705 p.4 yeterli ve uygun kanıtla önemli yanlışlık bulunmadığı sonucuna varılırsa olumlu görüş verilir.","ayirt":"Kanıt yeterli mi ve yanlışlık var mı?","paragraf":"BDS 705 p.4","yanilgi":"Denetçinin yeterli kanıt toplamasının bile bir çekinceye yol açabileceğini sanıyorsun."},"B":{"gercek":"BDS 705 p.2(a)-(b) hem yanlışlık hem kanıt yetersizliği için, etki önemli-yaygın olmayan ise sınırlı olumlu görüşü öngörür.","ayirt":"Etki önemli mi ama sınırlı bir alanla mı sınırlı?","paragraf":"BDS 705 p.2","yanilgi":"Sınırlı olumlu görüşün yalnız kanıt yetersizliğinden doğduğunu, yanlışlıktan doğamayacağını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 128"},"kural":"Türk Borçlar Kanununun 63 üncü maddesi rıza, üstün yarar, haklı savunma, hakkın kendi gücüyle korunması ve zorunluluk hallerini sayar; kusurun bulunmaması bu sayımda yer almaz, kusur ayrı ve bağımsız bir sorumluluk unsurudur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 128","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde sayılan hallerin dışına çıkan her ifade, o maddeyle ilgisiz görünse bile doğru şık adayıdır.","konu":"haksız fiil sartlari","tablo":{"satirlar":[["A) Zarar görenin rızasının bulunması","m.63","doğru ifade"],["B) Daha üstün nitelikte özel veya kamusal yararın varlığı","m.63","doğru ifade"],["C) Zarar verenin davranışının haklı savunma niteliği taşıması","m.63","doğru ifade"],["D) Zarar verenin ağır kusurlu olmaması","m.63","YANLIŞ ifade"],["E) Kanunun verdiği yetkinin sınırları içinde kalınması","m.63","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Zarar verenin davranışının haklı savunma niteliği taşıması","E":"Kanunun verdiği yetkinin sınırları içinde kalınması","A":"Zarar görenin rızasının bulunması","D":"Zarar verenin ağır kusurlu olmaması","B":"Daha üstün nitelikte özel veya kamusal yararın varlığı"},"kaynak":{"alinti":"","liste":[{"ad":"TBK (6098 s.K.) m.63","metin":"MADDE 63- Kanunun verdiği yetkiye dayanan ve bu yetkinin sınırları içinde kalan bir fiil, zarara yol açsa bile, hukuka aykırı sayılmaz. Zarar görenin rızası, daha üstün nitelikte özel veya kamusal yarar, zarar verenin davranışının haklı savunma niteliği taşıması, yetkili kamu makamlarının müdahalesinin zamanında sağlanamayacak olması durumunda kişinin hakkını kendi gücüyle koruması veya zorunluluk hâllerinde de fiil, hukuka aykırı sayılmaz. 2. Sorumluluk"},{"ad":"TBK (6098 s.K.) m.630","metin":"MADDE 630- Kanunun bu bölümünde veya ortaklık sözleşmesinde aksine hüküm bulunmadıkça, yönetici ortaklar ile diğer ortaklar arasındaki ilişkiler, vekâlet sözleşmesine ilişkin hükümlere tabidir. Ortaklığı yönetme yetkisi bulunmayan bir ortağın, ortaklığın işlerini görmesi veya bu yetkiye sahip ortağın yetkisini aşması hâllerinde, vekâletsiz işgörmeye ilişkin hükümler uygulanır. Yönetici ortaklar, yılda en az bir defa hesap vermek ve kazanç paylarını ortaklara ödemekle yükümlüdürler. Hesap döneminin uzatılmasına ilişkin anlaşma kesin olarak hükümsüzdür. Ortaklığı yönetenin ortaklardan birisi olmaması durumunda da aynı kural uygulanır. 2. Ortaklık işlerini inceleme"}],"hakem":"Kaynak metindeki TBK m.63, hukuka aykırılığı kaldıran halleri (rıza, üstün yarar, haklı savunma, hakkın kendi gücüyle korunması, zorunluluk) sınırlı sayımla belirtmiş; kusur/kusurluluk bu listede yer almadığından doğru cevap desteklenmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Haklı savunma niteliğindeki davranış, kanun tarafından hukuka aykırılığı ortadan kaldıran nedenler arasında gösterilmiştir.","E":"Kanun, yetkiye dayanan ve yetkinin sınırları içindeki fiili açıkça hukuka aykırı saymaz; bu madde metninde yer alan bir hal.","A":"Kanun açıkça zarar görenin rızasını hukuka aykırılığı ortadan kaldıran hal olarak sayar; bu gerçek bir koruma nedenidir.","B":"Daha üstün nitelikte özel veya kamusal yarar, kanunda hukuka aykırılığı kaldıran sebeplerden biri olarak düzenlenmiştir."},"dogru":"Kusur, hukuka aykırılığı ortadan kaldıran hal değildir. Kanun rıza, üstün yarar, haklı savunma, hakkın kendi gücüyle korunması ve zorunluluk hallerini sayar; kusur ise sorumluluk için ayrı bir şarttır.","sinav":"Türk Borçlar Kanunu 63. madde","kavramlar":[{"kaynak":"Türk Borçlar Kanunu 63. madde","tanim":"Sorumluluk için gerekli olan, zarar verenin davranışının kınayabilir nitelikte olmasını ifade eden unsur.","ad":"Kusur"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/1"]},"oyun":null,"tip":"teori","soru":"Türk Borçlar Kanunu\u0027na göre, aşağıdakilerden hangisi bir fiilin hukuka aykırı sayılmasını engelleyen hallerden biri değildir?","kayitBaslik":"","id":"sgs-t1-borclar-kolay/kp-29","verilenler":[],"dayanak":"Türk Borçlar Kanunu (6098 s.K.) m.63","dogru":"D","oyunBonus":null,"ders":"Borçlar Hukuku","adimlar":[{"formul":"Olay: Kayseri\u0027de bir depo bekçisi olan Hasan, 12 Mart gecesi deponun demir kapısını kıran hırsızı fark eder ve elindeki sopayla sadece kapıya doğru vurup hırsızı içeri sokmaz, kapı zarar görür.","anlatim":"Hasan\u0027ın kapıyı savunma amaçlı zorlaması ona zarar verse de bu bir hukuka aykırılık değil, çünkü saldırıya karşı orantılı tepki gösteriyor. Olayı bu şekilde kafanda canlandır, çünkü bütün ders bu tek olayda geçecek.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu\u0027nun 63\u0027üncü maddesi, bir fiili hukuka aykırı saymayan beş hâli sayıyor: rıza, üstün yarar, haklı savunma, hakkın kendi gücüyle korunması, zorunluluk.","anlatim":"Hasan\u0027ın olayında bu beş ifadeyi tek tek deneyeceğiz, hangisi maddenin içinde hangisi değil bakacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.63","karar":"doğru","anlatim":"Evet, zarar görenin rızası madde metninde açıkça sayılan bir haldir. Depo sahibinin rızası olsaydı fiil yine hukuka aykırı sayılmazdı.","formul":"Şık A: depo sahibi \u0027ben Hasan\u0027a kapıyı zorlarsa sorumlu tutmayacağıma razıyım\u0027 dese, bu rıza hukuka aykırılığı kaldırır mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.63","karar":"doğru","anlatim":"Evet, madde özel yararla birlikte kamusal yararı da açıkça sayıyor. Hasan\u0027ın davranışı toplum güvenliğine hizmet ettiği için bu hal kapsamına girer.","formul":"Şık B: Hasan\u0027ın müdahalesi, sadece kendi deposunu değil çevredeki bütün işyerlerinin güvenliğini korumaya yarasa, bu \u0027üstün kamusal yarar\u0027 sayılır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.63","karar":"doğru","anlatim":"Evet, haklı savunma niteliği taşıyan davranış maddenin ortasında açıkça sayılıyor. Hasan\u0027ın orantılı tepkisi tam bu hale girer.","formul":"Şık C: Hasan\u0027ın sopayla vurması, hırsızın saldırısına karşı orantılı bir tepkiyse, bu \u0027haklı savunma\u0027 sayılır mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.63","karar":"yanlış","anlatim":"Hayır, madde metni kusuru değil fiilin niteliğini sayıyor; kusursuzluk ayrı bir sorumluluk şartı. Hasan kusursuz olsa bile bu, maddede sayılan altı halden biri değil.","formul":"Şık D: Hasan hiç kusurlu değilse, yani elinde olmayan bir şekilde kapıya zarar verdiyse, \u0027kusurun bulunmaması\u0027 tek başına hukuka aykırılığı kaldırır mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.63","karar":"doğru","anlatim":"Evet, kanunun verdiği yetkinin sınırları içinde kalan fiil zarara yol açsa bile hukuka aykırı sayılmıyor. Bu, maddenin ilk cümlesinde açıkça yazılı.","formul":"Şık E: Hasan bekçi olarak kanunun tanıdığı yetki sınırları içinde, yani meşru müdafaa yetkisiyle hareket ettiyse, bu hal hukuka aykırılığı kaldırır mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Hasan\u0027ın olayında beş halin hepsi hukuka aykırılığı kaldırırken, kusurun bulunmaması bunlardan biri değil çünkü kusur ayrı bir kurum. Kendine sor: bu ifade fiilin niteliğini mi anlatıyor, yoksa failin iç durumunu mu?","doldur":[]}],"anahtar":[{"ornek":"hukuka","kok":"hukuka"},{"ornek":"aykırılığı","kok":"aykırı"},{"ornek":"savunma","kok":"savunm"},{"ornek":"açıkça","kok":"açıkça"},{"ornek":"kanununun","kok":"kanunu"},{"ornek":"niteliği","kok":"niteli"}],"konuGiris":{"harita":"Ne zaman test edilir: bir fiilin hukuka aykırılığını ortadan kaldıran haller sayılırken. Nasıl ölçülür: kanunda sayılan sınırlı sebeplerden birine uyup uymadığına bakılarak. Nasıl kaydedilir: soru kökünde \u0027hukuka aykırılığı engellemeyen hal hangisidir\u0027 şeklinde sorulur.","desen":"Sınav, kanunun saydığı beş hukuka uygunluk sebebini karıştırıp aralarina yabancı bir kavram (örn. vekaletsiz is görme, ortaklık hükümleri) ekleyerek doğru olmayanı buldurur. Öğrenci, listedeki beş sebebi ezberlemeyip mantık yürütmeye calisirsa yanlış seçeneği ayırt edemez. Bu soru madde 63\u0027un sınırlı sayılı haller listesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"zarar görenin fiile önceden veya sırasında onay vermesi","ad":"zarar görenin rızası","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"kişisel ya da toplumsal çıkarın zarardan daha ağır basmasi hali","ad":"üstün nitelikte yarar","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"saldırıya karşı orantılı biçimde kendini koruma davranışı","ad":"haklı savunma","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"başka carenin olmadığı acil tehlikede zarar verici davranış","ad":"zorunluluk hali","kim":"kanun sabitler"}],"sinavda":"Seçenekler arasında hukuka aykırılığı engelleyen dört hal ile bunlara benzemeyen bir kavram verilir, yabancı olan istenir.","panel_ornek":"Bir arkadasin senden izin alıp bahcendeki agacindan 3 elma toplasa, rizan olduğu için bu hukuka aykırı sayılmaz. Ama izinsiz komşunun 5 tavugunu alsa, bu haksız fiil olur. Rizanin olup olmaması burada her şeyi değiştirir.","ornek":"Bir arkadasin senden izin alıp bahcendeki agacindan 3 elma toplasa, rizan olduğu için bu hukuka aykırı sayılmaz. Ama izinsiz komşunun 5 tavugunu alsa, bu haksız fiil olur. Rizanin olup olmaması burada her şeyi değiştirir.","yontemler":"Tek yöntem, kanunda sayılan beş hali (yetki, rıza, üstün yarar, savunma, zorunluluk) tek tek hatırlayıp listede olmayanı elemektir.","nedir":"Haksız fiil, bir kimsenin kusurlu davranışıyla başkasına verdiği zarardan sorumlu tutulmasıdır. Sınav, bir fiilin hangi hallerde hukuka aykırı sayılmayacağını bilip bilmediginizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Ne soruluyor","metin":"Kural: Türk Borçlar Kanununun 63 üncü maddesi, hukuka aykırılığı ortadan kaldıran halleri tek tek sayar. Hesap: madde metni \u0027zarar verenin davranışının haklı savunma niteliği taşıması\u0027 ifadesini içerir. Doğrusu: bu hal kaynakta düzenlenmiştir, cevap bu şık değildir."},"E":{"ad":"Yetkiyi Farklı Şart Sanma Tuzağı","metin":"madde metni açıkça \u0027kanunun verdiği yetkiye dayanan ve bu yetkinin sınırları içinde kalan fiil hukuka aykırı sayılmaz\u0027 der. Doğrusu: bu hal kanunda düzenlenmiştir, cevap bu şık değildir."},"A":{"ad":"Rızayı Hukuka Aykırılığı Kaldıran Hal Sanma Tuzağı","metin":"madde metninde \u0027zarar görenin rızası\u0027 açıkça sayılmıştır, bu şık kaynakta yer alan gerçek bir haldir. Doğrusu: rıza, hukuka aykırılığı ortadan kaldıran hallerden biridir, bu şık sorunun cevabı değildir."},"B":{"ad":"Üstün Yararı Ayrı Kavram Sanma Tuzağı","metin":"\u0027daha üstün nitelikte özel veya kamusal yarar\u0027 madde metninde hukuka aykırılığı kaldıran sebepler arasında sayılmıştır. Doğrusu: bu hal de kanunda açıkça yer alır, cevap bu şık değildir."}},"celdiriciYol":{},"hap":"Türk Borçlar Kanununun 63 üncü maddesindeki hukuka aykırılığı kaldıran haller (rıza, üstün yarar, haklı savunma, hakkın kendi gücüyle korunması, zorunluluk) kusur şartından bağımsızdır.","teshis":{"C":{"gercek":"Türk Borçlar Kanunu haklı savunma niteliği taşıyan davranışı da hukuka aykırılığı kaldıran hal olarak kabul eder.","ayirt":"Davranış saldırıya karşı orantılı bir tepki mi?","paragraf":"m.63","yanilgi":"Haklı savunmayı ceza hukukuna özgü bir kavram sanıp borçlar hukukunda geçmediğini düşünüyorsun."},"E":{"gercek":"Madde, kanunun verdiği yetkinin sınırları içinde kalan fiili açıkça hukuka aykırı saymaz.","ayirt":"Fiil, kanunun tanıdığı bir yetkinin sınırları içinde mi kalmış?","paragraf":"m.63","yanilgi":"Kanuni yetki sınırları içinde kalmayı ayrı bir hukuki kurum sanıp hukuka aykırılıkla ilişkisini göremiyorsun."},"A":{"gercek":"Türk Borçlar Kanununun 63 üncü maddesi zarar görenin rızasını, hukuka aykırılığı doğrudan kaldıran bir hal olarak sayar.","ayirt":"Bu hal madde metninde tek tek sayılan altı halden biri mi?","paragraf":"m.63","yanilgi":"Rızanın hukuka aykırılığı kaldırmadığını, sadece kusuru azalttığını düşünüyorsun."},"D":{"gercek":"Türk Borçlar Kanununun 63 üncü maddesi kusuru değil, fiilin niteliğini (rıza, üstün yarar, haklı savunma, hakkın kendi gücüyle korunması, zorunluluk) esas alır; kusursuzluk madde kapsamında sayılmamıştır.","ayirt":"Bu ifade fiilin kendisini mi, yoksa failin iç durumunu mu anlatıyor?","paragraf":"m.63","yanilgi":"Kusurun bulunmamasını da hukuka aykırılığı kaldıran bir hal sanıyorsun; oysa kusur, hukuka aykırılıktan bağımsız ayrı bir sorumluluk şartıdır."},"B":{"gercek":"Madde hem özel hem kamusal üstün yararı hukuka aykırılığı kaldıran hal olarak birlikte düzenler.","ayirt":"Madde metninde \u0027özel veya kamusal\u0027 ibaresi geçiyor mu?","paragraf":"m.63","yanilgi":"Üstün yararın yalnız kamu hukukuna ait bir kavram olduğunu, özel hukukta geçmediğini sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 86"},"kural":"Tebliğ madde 9/3, bu üç görüş türünde görüş ve tespitlerin bağımsız denetçiye yazılı iletilmesini öngörür ve bu husustaki sorumluluğu Kurum, Kuruluş ve Ortaklıkların yönetim kuruluna verir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 86","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Sorumluluk sorularında önce \u0027kim yaptı\u0027 değil \u0027madde kime yüklüyor\u0027 diye metne bak.","konu":"denetim görüşü beyanı","tablo":{"satirlar":[["A) Bilgi sistemleri denetçisi, görüşe esas tespitleri sözlü…","m.9/3","YANLIŞ ifade"],["B) Görüş ve görüşe esas tespitler bağımsız denetçiye yazılı…","m.9/3","YANLIŞ ifade"],["C) Söz konusu yazılı iletim yükümlülüğü yalnızca görüşün ol…","m.9/3","YANLIŞ ifade"],["D) Görüş ve görüşe esas tespitler bağımsız denetçiye yazılı…","m.9/3","doğru ifade"],["E) Görüş ve tespitlerin bağımsız denetçiye iletilmesi, anca…","m.9/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Söz konusu yazılı iletim yükümlülüğü yalnızca görüşün olumsuz olması durumunda uygulanır, şartlı görüş ve görüş bildirmekten kaçınmada bu yükümlülük bulunmaz.","E":"Görüş ve tespitlerin bağımsız denetçiye iletilmesi, ancak sorumlu bilgi sistemleri başdenetçisinin onayı alınması şartıyla gerçekleştirilebilir.","A":"Bilgi sistemleri denetçisi, görüşe esas tespitleri sözlü olarak Kurum, Kuruluş ve Ortaklıkların yönetimine bildirmekle yükümlüdür.","D":"Görüş ve görüşe esas tespitler bağımsız denetçiye yazılı olarak iletilir; bu husustaki sorumluluk Kurum, Kuruluş ve Ortaklıkların yönetim kuruluna aittir.","B":"Görüş ve görüşe esas tespitler bağımsız denetçiye yazılı olarak iletilir; bu husustaki sorumluluk bilgi sistemleri denetçisine aittir."},"kaynak":{"alinti":"","liste":[{"ad":"Sermaye Piyasası K. (6362 s.K.) m.9","metin":"MADDE 9 – (1) İhraççı veya halka arz edenin, izahnamenin ilk yayımı tarihinden itibaren on iki ay boyunca gerçekleştireceği ihraçlar için, izahnamedeki ek ve değişikliklerin 6 ncı maddede belirtilen esaslar çerçevesinde onaylanması ve 7 nci maddeye uygun şekilde ilan edilmesi yeterlidir. Bu sürenin geçmesinden sonra yapılacak halka arzlarda izahnamenin tümünün onaylanması gereklidir. İzahnameden sorumlu kişiler"},{"ad":"SPK Tebliğ (III-62.2) - Bilgi Sistemleri Bağımsız Denetim Tebliği (III-62.2) [giris]","metin":"BİLGİ SİSTEMLERİ BAĞIMSIZ DENETİM TEBLİĞİ (III-62.2) (5/1/2018 tarihli ve 30292 sayılı Resmi Gazete’de yayımlanmıştır.) Tebliğ Değişikliklerine İlişkin Liste: 1) (9/1/2020 tarihli ve 31003 sayılı Resmi Gazete’de Bilgi Sistemleri Bağımsız Denetim Tebliği (III-62.2.)’nde Değişiklik Yapılmasına Dair Tebliğ (III-62.2.a) yayımlanmıştır. BİRİNCİ BÖLÜM Amaç, Kapsam, Dayanak ve Tanımlar Amaç"}],"hakem":"SPK Tebliğ (III-62.2) m.9/3, şartlı/olumsuz/görüş bildirmekten kaçınma durumunda görüş ve tespitlerin yazılı iletilmesini ve sorumluluğun yönetim kuruluna ait olduğunu açıkça öngörmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Hükmü dar yorumlamak yanılgı: Madde şartlı, olumsuz ve görüş bildirmekten kaçınma olmak üzere üç durumda da yazılı iletim kuralını getirir.","E":"Metinde olmayan şart eklemek: Tebliğ\u0027in hiçbir yerinde başdenetçi onayı gibi ilave bir prosedür bulunmaz; böyle bir engel yoktur.","A":"Sözlü iletişim düşünmek hata: Tebliğ yazılı iletimi açıkça şart koşar, sözlü bildirim yeterli değildir.","B":"Sorumluluğu yanlış kişiye yüklemek tuzak: Yazılı iletim yükümlülüğünün sorumluluğu bilgi sistemleri denetçisine değil, yönetim kuruluna aittir."},"dogru":"Bilgi Sistemleri Bağımsız Denetim Tebliği\u0027ne göre denetçinin görüşü şartlı, olumsuz ya da bildirmekten kaçınma şeklinde olduğunda, görüş ve tespitler bağımsız denetçiye yazılı olarak iletilir. Bu iletim işleminin sorumluluğu Kurum, Kuruluş ve Ortaklıkların yönetim kurulunun omuzundadır.","sinav":"Bilgi Sistemleri Bağımsız Denetim Tebliği madde 9/3 uyarınca görüşün şartlı, olumsuz ya da görüş bildirmekten kaçınma şeklinde olması durumunda görüş ve tespitlerin bağımsız denetçiye yazılı iletilmesi gerekmektedir.","kavramlar":[]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"Bilgi Sistemleri Bağımsız Denetim Tebliği\u0027ne göre, bilgi sistemleri bağımsız denetimine ilişkin görüşün şartlı, olumsuz ya da görüş bildirmekten kaçınma şeklinde olması durumunda aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-denetim-kolay/kp-32","verilenler":[],"dayanak":"SPK Tebliğ III-62.2 m.9/3","dogru":"D","oyunBonus":null,"ders":"Denetim","adimlar":[{"formul":"Olay: Bir aracı kurumun bilgi sistemleri denetçisi, 2022 raporunda \u0027olumsuz görüş\u0027 veriyor; sebep, kurumun 3 yıldır felaket kurtarma testini hiç yapmamış olması.","anlatim":"Denetçi bu tespiti bir kâğıda yazıp masasına koymuyor, birine ulaştırması gerekiyor. Soru burada başlıyor: kime, nasıl, kim sorumlu?","doldur":[]},{"formul":"Ne yapacağız: Tebliğ m.9/3, görüş şartlı/olumsuz/kaçınma olduğunda görüş ve tespitlerin bağımsız denetçiye yazılı iletilmesini ve bu iletimin sorumluluğunu Kurum, Kuruluş ve Ortaklıkların yönetim kuruluna yükler.","anlatim":"Bu olayda kural: yazılı iletim şart, sorumlu yönetim kurulu. Şimdi beş şıkkı bu olayda tek tek deneyelim.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.9/3","karar":"yanlış","anlatim":"Hayır, madde açıkça yazılı iletim ister, sözlü anlatım hükmü karşılamaz. Bu yüzden A yanlış bir iddia.","formul":"Şık A: denetçi bu tespiti telefonla arayıp sözlü anlatsa yeterli olur mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.9/3","karar":"yanlış","anlatim":"Denetçi bilgiyi üretip gönderen taraf ama sorumluluk ona değil, alıcı tarafa yani yönetim kuruluna aittir. B bu noktada yanılıyor.","formul":"Şık B: iletim yazılı olacak, peki bu işten sorumlu bilgi sistemleri denetçisinin kendisi mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.9/3","karar":"yanlış","anlatim":"Evet gerekirdi, madde üç görüş türünü de birlikte sayıyor. C bunu tek türe indirgediği için yanlış.","formul":"Şık C: rapor olumsuz olduğu için bu olayda yazılı iletim şart, ama diyelim rapor şartlı olsaydı, yine de yazılı iletim gerekir miydi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.9/3","karar":"doğru","anlatim":"Evet, madde tam bunu söylüyor: yazılı iletim ve sorumluluk yönetim kurulunda. Olaydaki felaket kurtarma tespiti böyle iletilir.","formul":"Şık D: aracı kurumun yönetim kurulu, bu olumsuz görüşü ve tespitleri yazılı olarak alacak ve bu husustaki sorumluluk ona ait olacak; doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.9/3","karar":"yanlış","anlatim":"Madde metninde böyle bir onay şartı yok, bu başka bir maddeden karıştırılmış bir ayrıntı. E bu yüzden yanlış.","formul":"Şık E: bu iletim, ancak sorumlu bilgi sistemleri başdenetçisi onaylarsa mı yapılabilir?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Olayın özeti: yazılı iletim şart, sorumlu yönetim kuruludur. Kendine hep şunu sor: hem şekil hem sorumlu taraf birlikte doğru mu eşleşiyor?","doldur":[]}],"anahtar":[{"ornek":"sorumluluk","kok":"soruml"},{"ornek":"kuruluna","kok":"kurulu"},{"ornek":"yönetim","kok":"yöneti"},{"ornek":"yazılı","kok":"yazılı"},{"ornek":"iletim","kok":"iletim"},{"ornek":"tespitler","kok":"tespit"}],"konuGiris":{"harita":"Ne zaman test edilir: bilgi sistemleri denetim görüşü şartlı, olumsuz ya da kaçınma şeklinde çıktığında test edilir. Nasıl ölçülür: Tebliğ\u0027in ilgili maddesindeki bildirim/yaptırım hükmüyle ölçülür. Nasıl kaydedilir: durum denetim raporunda belirtilir ve ilgili kurumlara/Kurul\u0027a bildirilir.","desen":"Sınav bu konuda genellikle görüşün olumlu dışındaki hallerinde denetçinin bildirim yükümlülüğünü sorar; tuzak, öğrencinin bu durumu \u0027denetim sona erer\u0027 gibi yanlış bir sonuçla karıştırmasıdır. Doğru cevap, ilgili maddede belirtilen bildirim ve raporlama zorunluluğuna dayanır. Bu soru Bilgi Sistemleri Bağımsız Denetim Tebliği madde hükmü noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Bazı kontrol eksikliklerine rağmen genel olarak sistemin çalıştığını belirten görüş","ad":"Şartlı görüş","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"soruda verilir","tanim":"Bilgi sistemi kontrollerinin ilkelere uygun olmadığını belirten görüş","ad":"Olumsuz görüş","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"soruda verilir","tanim":"Yeterli kanıt toplanamadığı için görüş verilememesi durumu","ad":"Görüş bildirmekten kaçınma","kim":"denetçi mesleki yargıyla belirler"},{"kaynak":"kuraldan bilinir","tanim":"Olumsuz sonuçların ilgili taraflara veya Kurul\u0027a iletilmesi kuralı","ad":"Bildirim yükümlülüğü","kim":"standart (BDS) sabitler"}],"sinavda":"Soruda görüşün şartlı/olumsuz/kaçınma olduğu belirtilir ve bu durumda hangi yükümlülüğün doğduğu istenir.","panel_ornek":"Bir arkadaşın aldığı ikinci el bilgisayarı ustaya götürüyor; usta \u0027bu bilgisayarda 3 tane sorun var, kullanılabilir ama garanti veremem\u0027 diyor. İşte bu \u0027şartlı\u0027 rapora benziyor; usta olumlu ya da olumsuz demek yerine sınırlı bir uyarı yapıyor.","ornek":"Bir arkadaşın aldığı ikinci el bilgisayarı ustaya götürüyor; usta \u0027bu bilgisayarda 3 tane sorun var, kullanılabilir ama garanti veremem\u0027 diyor. İşte bu \u0027şartlı\u0027 rapora benziyor; usta olumlu ya da olumsuz demek yerine sınırlı bir uyarı yapıyor.","yontemler":"Tebliğ metnindeki ilgili maddeyi doğrudan hatırlamak tek yöntemdir; en kritik kural, olumlu dışındaki her görüşün bildirim zorunluluğu doğurduğudur.","nedir":"Bilgi sistemleri bağımsız denetim görüşü, kurumun bilgi sistemi kontrollerinin yeterliliği hakkında denetçinin vardığı sonucu bildirir. Sınav, görüşün olumlu dışında çıkması halinde denetçinin ne yapması gerektiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Kapsam Tuzağı","metin":"Hükmün yalnız olumsuz görüşte geçtiğini sanırsın. Doğrusu: Madde şartlı, olumsuz ve görüş bildirmekten kaçınma hallerinin ÜÇÜNÜ birlikte kapsar."},"E":{"ad":"Prosedür Tuzağı","metin":"Metinde bulunmayan bir onay şartı (başdenetçi onayı) icat edip kuralı ağırlaştırırsın. Doğrusu: Madde metninde iletim için ayrıca bir onay şartı yer almaz."},"A":{"ad":"Şekil (Sözlü/Yazılı) Tuzağı","metin":"İletişimin sözlü de yapılabileceğini düşünürsün. Doğrusu: Tebliğ, görüş ve tespitlerin bağımsız denetçiye YAZILI olarak iletilmesini şart koşar."},"B":{"ad":"Taraf Tuzağı","metin":"Sorumluluğu işlemi fiilen yapan bilgi sistemleri denetçisine yüklersin. Doğrusu: Bu husustaki sorumluluk Kurum, Kuruluş ve Ortaklıkların yönetim kuruluna aittir."}},"celdiriciYol":{},"hap":"Bilgi sistemleri bağımsız denetiminde görüşün şartlı, olumsuz ya da görüş bildirmekten kaçınma olması durumunda görüş ve tespitler bağımsız denetçiye yazılı iletilir; sorumluluk yönetim kuruluna aittir.","teshis":{"C":{"gercek":"Madde üç görüş türünü birlikte sayar: şartlı, olumsuz, görüş bildirmekten kaçınma.","ayirt":"Maddede sayılan görüş türlerinin tamamını okudum mu, yoksa ilk aklıma geleni mi seçtim?","paragraf":"SPK Tebliğ III-62.2 m.9/3","yanilgi":"Hükmü tek bir görüş türüyle (olumsuz) sınırlı sanıyorsun."},"E":{"gercek":"Madde 9/3\u0027te iletim için ayrı bir onay prosedürü yoktur; bu, madde 16\u0027daki ekip görev tanımıyla karıştırılmıştır.","ayirt":"Bu şart, okuduğum maddenin kendisinde mi yazıyor yoksa başka bir maddeden mi taşıdım?","paragraf":"SPK Tebliğ III-62.2 m.9/3","yanilgi":"Denetim ekibindeki hiyerarşik unvanların (başdenetçi) her işlemde onay mercii olduğunu sanıyorsun."},"A":{"gercek":"Madde 9/3 açıkça \u0027yazılı olarak iletilir\u0027 der; sözlü bildirim hükme aykırıdır.","ayirt":"Metinde geçen fiil \u0027yazılı iletilir\u0027 mi, \u0027bildirilir\u0027 mi diye kontrol ettim mi?","paragraf":"SPK Tebliğ III-62.2 m.9/3","yanilgi":"İletişimin biçim şartına (yazılı olma) bağlı olmadığını, sözlü bildirimin yeterli olduğunu düşünüyorsun."},"D":{"gercek":"Madde 9/3 hem yazılı iletim şeklini hem de sorumlu tarafı (yönetim kurulu) birlikte düzenler.","ayirt":"Hem şekil (yazılı) hem sorumlu taraf (yönetim kurulu) doğru mu eşleşiyor?","paragraf":"SPK Tebliğ III-62.2 m.9/3","yanilgi":"Bu şıkkı eleyen öğrenci, sorumluluğun denetçide olduğunu düşünerek doğru şıkkı gözden kaçırır."},"B":{"gercek":"Madde, sorumluluğu açıkça Kurum, Kuruluş ve Ortaklıkların yönetim kuruluna verir; denetçi burada yalnız bilgi ileten taraftır.","ayirt":"Madde metninde \u0027sorumluluk ... aittir\u0027 ifadesinin öznesi kim?","paragraf":"SPK Tebliğ III-62.2 m.9/3","yanilgi":"İşi fiilen yapanın (bilgi sistemleri denetçisi) otomatik olarak sorumlu olduğunu sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}}];

      // yalnız bulunduğun adımın adı yazılı; başlıklar üstüne gelince görünür. Kartın altına yaslanır.
      const yolH='<div class="yol"><div class="yolCip">'+s.adimlar.map((x,q)=>'<span class="yc '+(q<j?'gecti':(q===j?'simdi':(q===hedefIdx?'hedef':'')))+'" title="'+esc(adimBaslik(x))+'">'+(q===hedefIdx&&q!==j?'🏁':(q+1))+'</span>').join('<span class="ycb"></span>')+'<span class="yolAd">'+esc(adimBaslik(a))+'</span></div>'
        +(a.giris?('<div class="neden">'+(((s.teori||(s.tablo&&s.tablo.basliklar&&s.tablo.basliklar[0]==='Adım')))
            ?'Önce konunun haritası: nedir, sınav nasıl sorar. Sonra kural, sonra şıklar kuralla tek tek sınanır; en sonda senin seçimin.'   // 07.09 Ö55(2): teori cümlesi (hesap kalıbı "verilenler, hesap, ters durum" teori soruda anlamsızdı)
            :'Önce konunun haritası: nedir, sınav ne sorar, hangi yöntem ne zaman. Sonra sorunun verilenleri, sonra hesap; hedef <b>'+esc(sonBas)+'</b>.')+'</div>')
          :(verilenAdimMi&&s.verilenler&&s.verilenler.length)?'<div class="neden">Önce elimizdekileri tanıyoruz: <b>'+s.verilenler.length+' verilen</b>. Hesap bloğundaki her satır bunlardan kurulacak; hedef <b>'+esc(sonBas)+'</b>.</div>'
          :son?'<div class="neden">Hedefe ulaştık: <b>'+esc(sonBas)+'</b>. Şimdi aynı yolu sen yürü.</div>'
          :(j>=hedefIdx?'<div class="neden">Hedef bulundu (<b>'+esc(sonBas)+'</b>). '+(a.kisi?'Bu adım <b>senin seçtiğin şıkkın</b> neden yanlış olduğunu gösterir.':'Bu adım, adayların en sık düştüğü yanlış yolu gösterir.')+'</div>'
          :(j+1===hedefIdx?'<div class="neden">Bu adım niye var? Burada bulduğumuz değer doğrudan hedefe götürür: sıradaki adım <b>'+esc(sonBas)+'</b>.</div>'
          :'<div class="neden">Bu adım niye var? Burada bulduğumuz değer sıradaki adımda (<b>'+esc(sonrakiBas)+'</b>) kullanılacak; hedef <b>'+esc(sonBas)+'</b>.</div>')))+'</div>';
      serit.innerHTML='<div class="adimK'+(son?' sonAdim':'')+(yon<0?' geri':'')+'"><div class="say"><span>ADIM '+(j+1)+' / '+s.adimlar.length+'</span><span class="baslik">'+esc(adimBaslik(a))+'</span></div><code class="mat0">'+fH+'</code><p>'+anlatimH+'</p>'+yolH+sonBtn+'</div>';
      // Cem 04.09 "numaralara basarak sayfa değiştirsek": yol haritası yuvarlakları tıklanınca o adıma gider
      serit.querySelectorAll('.yc').forEach((el,q)=>el.addEventListener('click',()=>adimGit(q-adimNo)));
      const bo=serit.querySelector('.bDersOyun'); if(bo){ bo.addEventListener('click',()=>{ ders.classList.remove('acik'); oyunKur(); oyun.classList.add('acik'); }); }
      const bb=serit.querySelector('.bDersBitti'); if(bb){ bb.addEventListener('click',()=>{ ders.classList.remove('acik'); const cA=k.querySelector('.cAnlat'); if(cA){ if(cA.offsetParent===null){ const bd=k.querySelector('.bDaha'); if(bd) bd.click(); } cA.click(); const ta=k.querySelector('.anlatK'); if(ta) setTimeout(()=>ta.focus(),200); } }); }
      // tablo: bu adimin hucreleri acilir ve yanar; onceki adimlarda acilanlar acik kalir
      tabloSar.querySelectorAll('td.vurgu,td.kaynakH').forEach(td=>{ td.classList.remove('vurgu'); td.classList.remove('kaynakH'); }); tabloSar.querySelectorAll('tr.kayit.vurguS').forEach(tr=>tr.classList.remove('vurguS'));
      // 06.09 Cem "5'ten 3'e dönünce 5'in cevabı kalıyor": açık hücre kümesi her adımda 0..j'den YENİDEN kurulur; geri gidince sonraki adımların hücresi tekrar kapanır
      acilan.clear(); for(let q=0;q<=j;q++){ (s.adimlar[q].doldur||[]).forEach(p=>acilan.add(p[0]+','+p[1])); }
      kaynakH.forEach(k=>acilan.add(k));   // formülde kullanılan hücre görünür olmalı
      if(son&&s.tablo){ s.tablo.satirlar.forEach((st,r)=>st.forEach((c,ci)=>{ if(ci>0) acilan.add(r+','+ci); })); }
      tabloSar.querySelectorAll('td[data-r]').forEach(td=>{ const key=td.dataset.r+','+td.dataset.c; if(acilan.has(key)){ if(td.classList.contains('gizliH')){ td.classList.remove('gizliH'); td.classList.add('acildi'); } } else if(td.classList.contains('acildi')){ td.classList.add('gizliH'); td.classList.remove('acildi'); } });
      (a.doldur||[]).forEach(p=>{ const td=tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]'); if(td) td.classList.add('vurgu'); });
      // 05.09 Cem "%80 çıktığını o rakamı tabloya doldurduğumuzu göstersek": sonuç formülden tablodaki hücreye UÇAR
      // 05.09 Cem "bir anda çözümler geliyor, sırayla çözüyor gibi yapsa": adımda birden çok hesap varsa formül kutuları
      // SIRAYLA belirir (900 ms arayla), her kutunun sonucu belirince kendi hücresine uçar; hücre uçuş bitene dek boş kalır.
      if(yon>=0&&j>0&&!verilenAdimMi&&!a.giris){
        const mats=[...serit.querySelectorAll('.mat')]; const hedefler=(a.doldur||[]).map(p=>tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]')).filter(Boolean);
        const cokKutu=mats.length>1; const adimBu=j;
        hedefler.forEach(td=>td.classList.add('bekliyor'));
        mats.forEach((m,q)=>{ if(q>0&&cokKutu){ m.classList.add('gizliMat'); } });
        hedefler.forEach((td,pi)=>{ const kaynakM=mats[Math.min(pi,Math.max(0,mats.length-1))]; const gecikme=cokKutu?pi*900:pi*120;
          setTimeout(()=>{ if(adimNo!==adimBu||!document.body.contains(td)){ td.classList.remove('bekliyor'); return; }
            if(kaynakM){ kaynakM.classList.remove('gizliMat'); kaynakM.classList.add('geldi'); }
            const kaynakEl=kaynakM?kaynakM.querySelector('.matSonuc'):null; const from=kaynakEl?kaynakEl.getBoundingClientRect():null, to=td.getBoundingClientRect();
            if(!from||!from.width||!to.width){ td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); return; }
            const u=document.createElement('div'); u.className='ucan'; u.textContent=td.textContent.trim()||kaynakEl.textContent.trim(); document.body.appendChild(u); u.style.left=from.left+'px'; u.style.top=from.top+'px';
            requestAnimationFrame(()=>{ u.style.transform='translate('+(to.left-from.left)+'px,'+(to.top-from.top)+'px) scale(.85)'; u.style.opacity='0.15'; });
            setTimeout(()=>{ u.remove(); td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); },650); }, gecikme); });
        // hedefi olmayan fazladan kutular da sırayla gelsin
        mats.forEach((m,q)=>{ if(q>=hedefler.length&&m.classList.contains('gizliMat')){ setTimeout(()=>{ if(adimNo===adimBu){ m.classList.remove('gizliMat'); m.classList.add('geldi'); } }, q*900); } });
      }
      kaynakH.forEach(k=>{ const [r,c]=k.split(','); const td=tabloSar.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]'); if(td) td.classList.add('kaynakH'); });
      // 06.09: VERİLENLER bloğu Adım 1'den sonra katlanır; bu adımın formülünde kullanılan verilen satırı açık kalır (mavi), başlık tıklanınca hepsi açılır
      tabloSar.querySelectorAll('tr.vblok').forEach(tr=>{ const td=tr.querySelector('td[data-r]'); const key=td?td.dataset.r+','+td.dataset.c:''; tr.classList.toggle('katli', j>0 && !kaynakH.has(key) && !hedef.has(key)); });
      let lej=tabloSar.querySelector('.lejant'); if(!lej){ lej=document.createElement('div'); lej.className='lejant'; tabloSar.appendChild(lej); }
      lej.innerHTML=kaynakH.size?'<i class="m"></i>nereden geldi <i class="a"></i>bu adımda bulundu':(hedef.size?'<i class="a"></i>bu adımda bulundu':''); lej.style.display=lej.innerHTML?'block':'none';
      // kayit satirlari: adimda anilan hesap kodu (uc hane; "100.000" icindeki 100 sayilmaz)
      const kodOf=x=>new Set([...(String(x.formul)+' '+String(x.anlatim)).matchAll(/(?<![\d.,])(\d{3})(?![\d.,]|\s*(?:TL|%|adet|gün|yıl|ay))/g)].map(m=>m[1]));
      const kodlar=kodOf(a);
      // gösterilen kayıt satırları da 0..j'den yeniden kurulur (geri gidince sonraki adımın satırı gizlenir)
      gosterilen.clear(); for(let q=0;q<=j;q++){ kodOf(s.adimlar[q]).forEach(c=>gosterilen.add(c)); }
      tabloSar.querySelectorAll('tr.kayit[data-kod]').forEach(tr=>{ const k2=tr.dataset.kod; const an=k2&&kodlar.has(k2); if(son){ gosterilen.add(k2); } tr.classList.toggle('goster',gosterilen.has(k2)); tr.classList.toggle('vurguS',!!an); });
      tabloSar.querySelectorAll('tr.ara').forEach(ara=>{ const gi=ara.dataset.grp; ara.classList.toggle('goster',[...tabloSar.querySelectorAll('tr.kayit[data-kod][data-grp="'+gi+'"]')].some(tr=>tr.classList.contains('goster'))); });
      adimBar.querySelectorAll('i').forEach(n=>{ const q=parseInt(n.dataset.j); n.classList.toggle('simdi',q===j); n.classList.toggle('gecti',q<j); });
      bOnce.disabled=(j===0); bSonra.disabled=son; bSonra.textContent=son?'Bitti ✓':'İleri ▶';
      const vurgu=tabloSar.querySelector('td.vurgu, tr.vurguS'); if(vurgu) vurgu.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    const adimGit=d=>{ const cur=s.adimlar[adimNo]; if(d>0&&cur&&tahminGerek(cur,adimNo,adimNo===s.adimlar.length-1)&&serit.querySelector('.tahminK')){ tahmin[adimNo]={atla:true}; adimGoster(adimNo,1); return; }   // 06.09: tahmin ekranında ileri = "göster"
      const j=Math.min(s.adimlar.length-1,Math.max(0,adimNo+d)); if(j===adimNo) return; adimGoster(j,d); };
    bOnce.addEventListener('click',()=>adimGit(-1)); bSonra.addEventListener('click',()=>adimGit(1));
    // fare tekerlegi, klavye oklari, parmakla yatay kaydirma (sola = ileri)
    let tekerKilit=0; serit.addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-tekerKilit<350) return; tekerKilit=t; adimGit((e.deltaY||e.deltaX)>0?1:-1); },{passive:false});
    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});

const son=document.createElement('section'); son.className='kart son';
son.innerHTML='<div class="ust"><span>Nöbet bitti</span>'+noktalar(-1)+'<span>&nbsp;</span></div><div class="govde son" style="display:flex;flex-direction:column;justify-content:center"><div id="sonSkor"></div></div>';
akis.appendChild(son);
document.querySelectorAll('.skorCip,.kutuCip').forEach(b=>b.addEventListener('click',kutuEkraniAc)); skorCiz();
if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i').forEach(n=>n.classList.toggle('simdi',n.dataset.j==String(i)||(i>=SORULAR.length&&n.dataset.j==='son')));
  if(i<SORULAR.length&&durum.cevap[i]===undefined&&!durum.t0[i]) durum.t0[i]=Date.now();   // 06.09: karta gelince süre başlar
  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='PageDown'){ akis.scrollBy({top:akis.clientHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='PageUp'){ akis.scrollBy({top:-akis.clientHeight,behavior:'smooth'}); } });
/* 09.09 derin bağlantı (ana sayfa kartı → günün sorusu): #s=<sıra> kartını açar; yoksa baştan. */
window.addEventListener('load',function(){ try{ var m=location.hash.match(/#s=(\d+)/); var a=document.getElementById('akis'); if(m&&a&&a.children[+m[1]]) a.scrollTo({top:a.children[+m[1]].offsetTop,behavior:'instant'}); }catch(e){} });
