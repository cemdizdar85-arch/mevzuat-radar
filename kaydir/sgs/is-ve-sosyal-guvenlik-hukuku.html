sa bir süre tanınır. Süre geçerse karar kesinleşir ve uygulanmaya devam eder.","ornek":"Bir apartman yönetimi, toplantıda karar alabilmek için kat maliklerinin yarısından fazlasının imzasını arar; imza yetmezse alınan karar geçersiz sayılır ve itiraz edilebilir. Bu itiraz için on beş gün gibi kısa bir süre tanınır. Süre geçerse karar kesinleşir ve uygulanmaya devam eder.","yontemler":"Metni madde madde karşılaştırıp hangi ifadenin kanun metnine ters düştüğünü bulmak gerekir; süre ve yetki mercii ayrımına dikkat edilmelidir.","nedir":"Sendika yetkisi, bir işçi sendikasının toplu iş sözleşmesi yapabilmesi için gereken üye çoğunluğu şartını taşıyıp taşımadığının belirlenmesidir. Sınav, bu yetkinin nasıl tespit edildiğini ve yetkisiz yapılan sözleşmenin sonucunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Kural","metin":"m.45/2\u0027ye göre mahkeme, talep hâlinde sözleşmenin uygulanmasını dava sonuna kadar durdurabilir. Zorunluluk Tuzağı: durdurmanın otomatik gerçekleştiği sanılır. Doğrusu: durdurma talebe bağlı ve mahkemenin takdirindedir, ifade doğrudur."},"A":{"ad":"Kural","metin":"6356 sayılı Kanun m.42/4\u0027e göre süresi içinde Sosyal Güvenlik Kurumuna bildirilmeyen sigortalılık kayıtları yetki tespitinde dikkate alınmaz. Bildirim Eksikliği Tuzağı: bu eksikliğin idari para cezasıyla sınırlı kalacağı düşünülür. Doğrusu: madde bu kaydı doğrudan yetki hesabından çıkarır, ifade doğrudur."},"D":{"ad":"Ne soruluyor","metin":"beş ifadeden hangisinin kanuna aykırı olduğu soruluyor. Kural: m.42/2\u0027ye göre olumlu yetki tespiti, o işkolundaki işçi sendikaları ile taraf işverene altı iş günü içinde bildirilir. Hesap: madde metninde bildirimin muhatapları ve süresi açıkça sayılmıştır. Doğrusu: bu bildirim yükümlülüğü altı iş günlük süreyle ve belirtilen muhataplarla sınırlı olarak doğru şekilde ifade edilmiştir."},"B":{"ad":"Kural","metin":"m.45/1\u0027e göre yetkisiz yapılan toplu iş sözleşmesinin hükümsüzlüğü, Bakanlıkça tespitten itibaren kırk beş gün içinde dava yoluyla ileri sürülür. Süre Karıştırma Tuzağı: bu süre yetki itirazı süresiyle karıştırılır. Doğrusu: kırk beş gün hükümsüzlük davasına özgü süredir, ifade doğrudur."}},"celdiriciYol":{},"hap":"Yetki tespitinde olumlu sonuç geniş çevreye (ilgili sendikalar ve işveren), olumsuz sonuç yalnız başvuru sahibine bildirilir.","teshis":{"C":{"gercek":"m.45/2 durdurmayı talep şartına bağlar, mahkemenin takdir yetkisi vardır.","ayirt":"Bu sonuç talep olmadan da gerçekleşir mi?","paragraf":"m.45/2","yanilgi":"Mahkemenin uygulamayı durdurmasının kendiliğinden ve zorunlu olduğunu düşünüyorsun."},"E":{"gercek":"m.42/3 olumsuz tespitin yalnız başvuruyu yapan tarafa bildirileceğini özel olarak düzenler; m.42/2\u0027deki geniş bildirim yalnız olumlu tespite özgüdür.","ayirt":"Bu bildirim olumlu tespit mi, olumsuz tespit mi?","paragraf":"m.42/2-3","yanilgi":"Yetki yokluğunun tespitinin de, yetki varlığının tespiti gibi geniş çevreye duyurulacağını sanıyorsun."},"A":{"gercek":"6356 sayılı Kanun m.42/4 açıkça bu bildirimlerin yetki tespitinde dikkate alınmayacağını söyler.","ayirt":"Bu eksik bildirim sayı hesabına mı, cezaya mı bağlanıyor?","paragraf":"m.42/4","yanilgi":"SGK\u0027ya geç bildirimin yalnız idari yaptırım doğuracağını, yetki hesabını etkilemeyeceğini sanıyorsun."},"D":{"gercek":"m.42/2 olumlu tespitte bildirimin işkolundaki işçi sendikalarına ve taraf işverene de yapılacağını düzenler.","ayirt":"Bu bildirim yalnız başvurana mı yoksa geniş bir çevreye mi gidiyor?","paragraf":"m.42/2","yanilgi":"Altı iş günlük bildirimin yalnız başvuru sahibine yapıldığını sanıyorsun."},"B":{"gercek":"m.45/1 bu süreyi açıkça hükümsüzlük iddiasının dava yoluyla ileri sürülmesine tahsis eder.","ayirt":"Bu süre hangi davaya, itiraza mı hükümsüzlüğe mi ait?","paragraf":"m.45/1","yanilgi":"Kırk beş günlük süreyi yetki itirazı süresiyle aynı zannediyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 109"},"kural":"5510 sayılı Kanun m.5/g\u0027ye göre bu işçiler istedikleri takdirde Türkiye\u0027de ikamet şartı ile 50 nci maddenin ikinci fıkrasının (a) bendindeki şartlar ARANMAKSIZIN isteğe bağlı sigorta hükümlerine tabi olur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 109","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İstisna cümlelerinde \u0027aranmaksızın\u0027 ile \u0027aranarak\u0027 ifadesinin yerini şıkta değiştirip değiştirmediğini tek tek kontrol et.","konu":"sigortalı sayilmayanlar","tablo":{"satirlar":[["A) Bu işçiler 4 üncü maddenin birinci fıkrasının (a) bendi …","5510 s.K. m.5/g, 1. cümle","doğru ifade"],["B) Bu işçilerin uzun vadeli sigorta kollarına tabi olmak is…","5510 s.K. m.5/g, 2. cümle","doğru ifade"],["C) Uzun vadeli sigorta kollarına isteğe bağlı tabi olan bu …","5510 s.K. m.5/g, 3. cümle","doğru ifade"],["D) Bu işçilerin uzun vadeli sigorta kollarına tabi olmak is…","5510 s.K. m.5/g, 2. cümle","YANLIŞ ifade"],["E) Bu kapsamda yurt dışındaki işyerlerinde çalışan sigortal…","5510 s.K. m.5/g, son cümle (6111 s.K. m.24 ek)","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Uzun vadeli sigorta kollarına isteğe bağlı tabi olan bu işçilerden, isteğe bağlı sigorta primi dışında ayrıca genel sağlık sigortası primi alınmaz.","E":"Bu kapsamda yurt dışındaki işyerlerinde çalışan sigortalıların ödedikleri isteğe bağlı sigorta primleri, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalılık sayılır.","A":"Bu işçiler 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılır ve haklarında kısa vadeli sigorta kolları ile genel sağlık sigortası hükümleri uygulanır.","D":"Bu işçilerin uzun vadeli sigorta kollarına tabi olmak istemeleri hâlinde, Türkiye\u0027de yasal ikamet şartı ile 50 nci maddenin ikinci fıkrasının (a) bendindeki şartların birlikte arandığı isteğe bağlı sigorta hükümleri uygulanır.","B":"Bu işçilerin uzun vadeli sigorta kollarına tabi olmak istemeleri hâlinde, Türkiye\u0027de yasal olarak ikamet etme şartı aranmaksızın haklarında isteğe bağlı sigorta hükümleri uygulanır."},"kaynak":{"alinti":"de yer alan kuralı yanlış sunarak yanlış ifadeyi doğru tanımlamaktadır; kaynakta açıkça","liste":[{"ad":"5510 s. SGK Kanunu m.5 [1/4]","metin":"MADDE 5- Kısa ve uzun vadeli sigorta kolları bakımından aşağıda sayılan kişiler hakkında uygulanacak sigorta kolları şunlardır: 2/7/2018 tarihli ve 703 sayılı Kanun Hükmünde Kararnamenin 203 üncü maddesiyle bu bentte yer alan “Başbakan,” ibaresinden sonra gelmek üzere “Cumhurbaşkanı yardımcıları,” ibaresi eklenmiştir. 6 2/1/2017 tarihli ve 680 sayılı KHK’nin 73 üncü maddesiyle bu bentte yer alan “Türk Silâhlı Kuvvetleri” ibaresi “Milli Savunma Bakanlığı” şeklinde değiştirilmiş, daha sonra bu hüküm 1/2/2018 tarihli ve 7072 sayılı Kanunun 71 inci maddesiyle aynen kabul edilerek kanunlaşmıştır. 7 12/7/2013 tarihli ve 6495 sayılı Kanunun 39 uncu maddesiyle, bu bendin sonuna “ile polis nasbedilmek üzere Polis Meslek Eğitim Merkezlerinde polislik eğitimine tabi tutulan adaylar” ibaresi eklenmiştir. 8 2/1/2017 tarihli ve 680 sayılı KHK’nin 73 üncü maddesiyle bu fıkrada yer alan “(d) ve (e)” ibaresi “(d), (e) ve (f)” şeklinde değiştirilmiş, daha sonra bu hüküm 1/2/2018 tarihli ve 7072 sayılı Kanunun 71 inci maddesiyle aynen kabul edilerek kanunlaşmıştır. 5 a) Hizmet akdi ile çalışmamakla birlikte, ceza infaz kurumları ile tutukevleri bünyesinde oluşturulan tesis, atölye ve benzeri ünitelerde çalıştırılan hükümlü ve tutuklular hakkında, iş kazası ve meslek hastalığı ile analık sigortası uygulanır ve bunlar, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılırlar."},{"ad":"5510 s. SGK Kanunu m.5 [2/4]","metin":"b) (Değişik: 13/2/2011-6111/24 md.) 5/6/1986 tarihli ve 3308 sayılı Meslekî Eğitim Kanununda belirtilen aday çırak, çırak ve işletmelerde meslekî eğitim gören öğrenciler hakkında iş kazası ve meslek hastalığı ile hastalık sigortası; meslekî ve teknik ortaöğretim ile yükseköğrenimleri sırasında staja tabi tutulan öğrenciler, mesleki ve teknik ortaöğretim sırasında tamamlayıcı eğitim ya da alan eğitimi gören öğrenciler, kamu kurum ve kuruluşları tarafından desteklenen projelerde görevli bursiyerler ile 2547 sayılı Yükseköğretim Kanununun 46 ncı maddesine tabi olarak kısmi zamanlı çalıştırılan öğrencilerden aylık prime esas kazanç tutarı, 82 nci maddeye göre belirlenen günlük prime esas kazanç alt sınırının otuz katından fazla olmayanlar hakkında ise iş kazası ve meslek hastalığı sigortası uygulanır. Bu bentte sayılanlar, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılırlar ve bunlardan bakmakla yükümlü olunan kişi durumunda olmayanlar hakkında ayrıca genel sağlık sigortası hükümleri uygulanır.910 c) (Değişik: 17/4/2008-5754/3 md.) (Değişik birinci ve ikinci cümle: 12/7/20136495/96 md.) Harp malulleri ile 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanuna veya 2330 sayılı Kanun hükümleri veya 8/6/1949 tarihli ve 5434 sayılı Kanunun 56 ncı maddesi uygulanarak aylık bağlanmasını gerektiren kanunlara göre vazife malullüğü aylığı bağlanmış malullerden, 4 üncü maddenin birinci fıkrasının (a), (b) ve (c) bentleri kapsamında sigortalı olarak çalışmaya başlayanların aylıkları kesilmez."}],"hakem":"Sorunun doğru şıkkı (D), 5510 s. SGK Kanunu m.5/g\u0027de yer alan kuralı yanlış sunarak yanlış ifadeyi doğru tanımlamaktadır; kaynakta açıkça \u0027Türkiye\u0027de yasal olarak ikamet etme şartı ile aynı fıkranın (a) bendinde belirtilen şartlar aranmaksızın\u0027 denilmekte, bu da şartların birlikte DEĞİL ayrı ayrı uygulanacağını göstermektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Uzun vadeli sigorta seçenlere ekstra sağlık sigortası primi yüklenmez; kanun bu gruptan sadece bir tür prim alınacağını düzenler.","E":"Yurt dışında ödenen isteğe bağlı sigorta primleri özel olarak ana sigortalı kapsamında sayılır; ayrı bir grup oluşturmaz.","A":"Yurt dışında çalıştırılan işçiler temel kısa vadeli sigorta ve sağlık hizmetlerine tabi tutulur. Bu ayırım kanunla belirlenen doğru bir uygulamadır.","D":"Kanun bu işçilere ikamet şartını arayan kolaylaştırılmış sistem sunar, ama D başka şartlar daha ekleneceğini söylüyor. Bu istisnayı yanlış tersine çevirmiştir.","B":"Uzun vadeli sigorta isteyenler için kanun açıkça ikamet şartını araştırmıyor, tam tersine bu şartı gözardı ediyor. İfade doğrudur."},"dogru":"Yurt dışında çalıştırılan Türk işçileri uzun vadeli sigorta isterse, sadece Türkiye\u0027de ikamet şartı aranan kolaylaştırılmış sisteme girebilirler. D şıkkı ikamet şartına ek olarak başka şartlar da getiriyor, bu yüzden yanlıştır.","sinav":"Sosyal Güvenlik Kanunu 5. madde (g) bendi","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 5. madde","tanim":"Sigortalı olmak isteyen kişilerin gönüllü olarak seçebildiği, uzun vadeli sigorta kollarından yararlanmalarını sağlayan sigorta türü.","ad":"İsteğe bağlı sigorta"},{"kaynak":"5510 s. SGK Kanunu 5. madde","tanim":"İş kazası, meslek hastalığı ve analık haline karşı sağlanan sigorta kollarıdır.","ad":"Kısa vadeli sigorta kolları"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Kanunun 5 inci maddesinin (g) bendine göre, sosyal güvenlik sözleşmesi olmayan ülkelerde iş üstlenen işverenlerce yurt dışındaki işyerlerinde çalıştırılmak üzere götürülen Türk işçilerinin sigortalılık statüsüne ilişkin aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-20","verilenler":[],"dayanak":"5510 sayılı Kanun m.5/g","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da merkezi olan ABC İnşaat, sosyal güvenlik sözleşmesi bulunmayan Katar\u0027daki bir şantiyeye 40 Türk işçi götürüyor. İşçilerden Mehmet, Türkiye\u0027de ikametini sürdürüyor, sözleşmeyi imzalıyor ve 2024 yılında yurt dışında çalışmaya başlıyor.","anlatim":"Mehmet\u0027in hem kısa vadeli hem uzun vadeli sigorta hakları, m.5/g\u0027nin farklı cümlelerinde ayrı ayrı düzenleniyor. Şimdi bu tek olayda beş cümleyi tek tek göreceğiz.","doldur":[]},{"formul":"Ne yapacağız: Mehmet 4/1-a kapsamında sigortalı sayılıyor, kısa vadeli sigorta ve genel sağlık sigortası doğrudan uygulanıyor; uzun vadeli için isteğe bağlı sigortaya girmek isterse ikamet şartı ile m.50/2-a şartı ARANMAKSIZIN tabi oluyor, ayrıca genel sağlık sigortası primi de alınmıyor.","anlatim":"Bu tek kural iskeletini Mehmet\u0027in dosyasında beş ifadeyle tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"5510 s.K. m.5/g, 1. cümle","karar":"doğru","anlatim":"Mehmet Katar\u0027a götürülür götürülmez birinci cümle onu 4/1-a kapsamında sigortalı sayar. Kısa vadeli sigorta kolları ve genel sağlık sigortası ayrıca şart aranmadan işler.","formul":"Şık A: Mehmet için \u0027kısa vadeli sigorta kolları ile genel sağlık sigortası zaten doğrudan uygulanır\u0027 desen doğru mu dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"5510 s.K. m.5/g, 2. cümle","karar":"doğru","anlatim":"İkinci cümle bu grup için ikamet şartını açıkça aramaz, isteğe bağlı sigorta hükümleri şartsız uygulanır. Mehmet Türkiye\u0027de otursa da oturmasa da fark etmez.","formul":"Şık B: Mehmet uzun vadeli sigorta kollarına girmek istese, \u0027Türkiye\u0027de ikamet şartı aranmaz\u0027 desen doğru mu olur?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"5510 s.K. m.5/g, 3. cümle","karar":"doğru","anlatim":"Üçüncü cümle bu grup için özel bir istisna getirir, ayrıca genel sağlık sigortası primi alınmayacağını söyler. Mehmet sadece isteğe bağlı sigorta primini öder.","formul":"Şık C: Mehmet isteğe bağlı sigorta primi öderken \u0027ayrıca genel sağlık sigortası primi de alınır mı\u0027 diye sorsa, hayır dersen doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"5510 s.K. m.5/g, 2. cümle","karar":"yanlış","anlatim":"İkinci cümle tam tersini söyler, bu iki şart Mehmet için birlikte değil hiç aranmaz. Muhasebeci istisnayı genel kurala çevirip yanılır.","formul":"Şık D: Muhasebeci \u0027Mehmet\u0027in isteğe bağlı sigortaya girmesi için hem ikamet şartı hem m.50/2-a şartı birlikte aranır\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"5510 s.K. m.5/g, son cümle (6111 s.K. m.24 ek)","karar":"doğru","anlatim":"Son cümle ek hüküm ile bu primleri açıkça 4/1-a bendi kapsamında sigortalılık sayar. Mehmet\u0027in dosyası bu bende göre işlenir.","formul":"Şık E: Mehmet\u0027in ödediği isteğe bağlı sigorta primleri, 4/1-a kapsamında sigortalılık sayılır mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Mehmet\u0027in dosyasında istisna hep \u0027şart aranmaksızın\u0027 yönünde çalışır, D bunu tersine çevirdiği için yanlıştır. Kendine hep şunu sor: metin \u0027aranmaksızın\u0027 mı diyor \u0027aranarak\u0027 mı?","doldur":[]}],"anahtar":[{"ornek":"sigorta","kok":"sigort"},{"ornek":"mehmet","kok":"mehmet"},{"ornek":"aranmaksizin","kok":"aranma"},{"ornek":"vadeli","kok":"vadeli"},{"ornek":"isteğe","kok":"isteğe"},{"ornek":"sağlık","kok":"sağlık"}],"konuGiris":{"harita":"Ne zaman uygulanır: kişi, sözleşmesi olmayan bir ülkeye işveren tarafından çalıştırılmak üzere götürüldüğünde. Nasıl belirlenir: kanun bu kişileri hangi sigortalı statüsüne alacağını doğrudan söyler. Nasıl kaydedilir: işveren bu durumu Kuruma bildirmekle yükümlüdür.","desen":"Sınav genelde bu istisna maddesinin kapsamını diğer sigortalı sayılan gruplarla karıştırtır. Tuzak, kişinin hangi sigorta koluna değil hangi statüye tabi olduğunu sormaktır. Bu soru madde 5 bent (g) düzenlemesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Türkiye ile sosyal güvenlik anlaşması bulunmayan devlet","ad":"Sözleşmesiz ülke","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Yurt dışında iş alıp işçi götüren taraf","ad":"İş üstlenen işveren","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin hangi sigorta koluna tabi kabul edildiği durumu","ad":"Sigortalı sayılma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Yurt dışına çalıştırılmak üzere götürülen Türk vatandaşı","ad":"Türk işçi","kim":"mükellef / işveren beyan eder"}],"sinavda":"Soruda bir istisna grubu tanımı verilir ve bu gruba ait yanlış bilgiyi bulmanız istenir.","panel_ornek":"Bir arkadaşın sözleşmesiz bir ülkeye iş için gönderiliyor ve orada üç yıl çalışacak. Türkiye\u0027deki eski işvereni onun sigortasıyla artık ilgilenmiyor çünkü orada kendi ülkesinin kurallarına tabi olabiliyor. Bu durumda kimin sigortalı sayılıp sayılmayacağı ayrı bir kural ile belirleniyor.","ornek":"Bir arkadaşın sözleşmesiz bir ülkeye iş için gönderiliyor ve orada üç yıl çalışacak. Türkiye\u0027deki eski işvereni onun sigortasıyla artık ilgilenmiyor çünkü orada kendi ülkesinin kurallarına tabi olabiliyor. Bu durumda kimin sigortalı sayılıp sayılmayacağı ayrı bir kural ile belirleniyor.","yontemler":"Metindeki \u0027sözleşme olmayan ülke\u0027 ifadesini gördüğünüzde doğrudan bu istisna maddesini düşünün.","nedir":"Bu konu, hangi kişilerin sosyal sigorta kapsamı dışında sayıldığını belirler. Sınav, istisna gruplarını ve bunların statüsünü karıştırmadan bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Prim Katmanı Tuzağı","metin":"İsteğe bağlı sigortaya girenlerden her hâlükârda ayrıca genel sağlık sigortası primi alınacağını sanırsın. Doğrusu: madde bu kapsamda isteğe bağlı sigortadan yararlananlardan ayrıca genel sağlık sigortası primi alınmayacağını özel olarak düzenler; ifade doğrudur."},"E":{"ad":"Bent Sanma Tuzağı","metin":"İsteğe bağlı sigorta primi ödeyenlerin her zaman genel isteğe bağlı sigortalılar gibi ayrı bir bentte sayılacağını düşünüp bu cümleyi yanlış sanırsın. Doğrusu: madde bu primleri özel olarak 4/1-a bendi kapsamında sigortalılık sayar; ifade doğrudur."},"A":{"ad":"Kapsam Tuzağı","metin":"Bu bendin sözleşmesiz ülke istisnası olduğunu düşünüp kısa vadeli sigorta kolları ile genel sağlık sigortası uygulaması sigortalı sayar ve kısa vadeli sigorta kolları ile genel sağlık sigortasını uygulanır kılar.","ayirt":"Madde birinci cümlede hangi sigorta kollarını \u0027doğrudan\u0027 uyguluyor?","paragraf":"5510 s.K. m.5/g, 1. cümle","yanilgi":"Bu bendin istisnai niteliğinin, kısa vadeli sigorta kolları ve genel sağlık sigortası uygulamasını da istisnaya çevirdiğini sanıyorsun."},"D":{"gercek":"m.5/g ikinci cümle açıkça \u0027Türkiye\u0027de yasal olarak ikamet etme şartı ile aynı fıkranın (a) bendinde belirtilen şartlar aranmaksızın\u0027 der; şartlar birlikte aranmaz, tam tersine ikisi de aranmaz.","ayirt":"Metinde \u0027aranmaksızın\u0027 kelimesi hangi şartları kapsıyor, hepsini mi yoksa bir kısmını mı?","paragraf":"5510 s.K. m.5/g, 2. cümle","yanilgi":"İsteğe bağlı sigortanın genel şartlarının (ikamet + m.50/2-a) bu istisnai grup için de geçerli olduğunu, istisnanın yalnız kapsam yönünden olduğunu sanıyorsun."},"B":{"gercek":"m.5/g ikinci cümle, bu grup için Türkiye\u0027de ikamet şartını açıkça aramaz; şart aranmaksızın isteğe bağlı sigorta hükümleri uygulanır.","ayirt":"Bu cümlede \u0027şart aranmaksızın\u0027 mı yoksa \u0027şart aranarak\u0027 mı deniyor?","paragraf":"5510 s.K. m.5/g, 2. cümle","yanilgi":"İsteğe bağlı sigortanın genel kuralındaki ikamet şartının, bu özel gruba da aynen uygulandığını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 111"},"kural":"Madde 6/c\u0027ye göre ev hizmetlerinde çalışanlar, ücretle aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışanlar hariç olmak üzere sigortalı sayılmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 111","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 6 sorularında \u0027hariç\u0027, \u0027az\u0027, \u0027muaf\u0027 gibi şart kelimelerinin yönünü ters çeviren şıkka dikkat et; şart sağlanıyor mu diye tek tek kontrol et.","konu":"sosyal sigortalı sayilma"," hükümleri saklı kalmak kaydıyla; yabancı bir ülkede kurulu herhangi bir kuruluş tarafından ve o kuruluş adına ve hesabına Türkiye’ye üç ayı geçmemek üzere bir iş için gönderilen ve yabancı ülkede sosyal sigortaya tabi olduğunu belgeleyen kişiler ile Türkiye’de kendi adına ve hesabına bağımsız çalışanlardan, yurt dışında ikamet eden ve o ülke sosyal güvenlik 4/4/2015 tarihli ve 6645 sayılı Kanunun 44 üncü maddesiyle, bu bentte yer alan “bunlardan bakmakla yükümlü olunan kişi durumunda olmayanlar hakkında ayrıca” ibaresi madde metninden çıkarılmıştır. 12 10/9/2014 tarihli ve 6552 sayılı Kanunun 40 ıncı maddesiyle, bu bentte yer alan “(ücretle ve sürekli olarak çalışanlar hariç)” ibaresi 1/4/2015 tarihinde yürürlüğe girmek üzere “(Kanunun ek 9 uncu maddesinin ikinci fıkrası kapsamında sigortalı olanlar ile ücretle aynı kişi yanında ay içinde 10 g…"},{"ad":"5510 s. SGK Kanunu m.6 [2/4]","metin":"13 25/6/2019 tarihli ve 7179 sayılı Kanunun 62 nci maddesiyle bu bende “yedek subay” ibaresinden sonra gelmek üzere “ve yedek astsubay” ibaresi eklenmiştir. 11 mevzuatına tabi olanlar, f) (…)14 yüksek okullarda fiilen normal eğitim süreleri içinde yapılan, tatbikî mahiyetteki yapım ve üretim işlerinde çalışan öğrenciler, g) Sağlık hizmet sunucuları tarafından işe alıştırılmakta olan veya rehabilite edilen, hasta veya malûller, h) (Değişik: 17/4/2008-5754/4 md.) 4 üncü maddenin birinci fıkrasının (b) ve (c) bentleri gereği sigortalı sayılması gerekenlerden 18 yaşını doldurmamış olanlar, ı) Kamu idarelerinde ve Kanunun ek 5 inci maddesi kapsamında sayılanlar hariç olmak üzere, tarım işlerinde veya orman işlerinde hizmet akdiyle süreksiz işlerde çalışanlar ile tarımda kendi adına ve hesabına bağımsız çalışanlardan; tarımsal faaliyette bulunan ve yıllık tarımsal faaliyet gelirlerinden, bu faaliyete ilişkin masraflar düşüldükten sonra kalan tutarın aylık ortalamasının, bu Kanunda tanımlanan prime esas günlük kazanç alt sınırının otuz katından az olduğunu belgeleyenler ile 65 yaşını d "2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027nun 6 ncı maddesine göre, 4 üncü ve 5 inci maddelere göre sigortalı sayılması gereken kişilerden hangisi kısa ve uzun vadeli sigorta kolları bakımından sigortalı sayılmaz?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-24","verilenler":[{"deger":"6","anlam":"Kanunun hangi bölümünde sigortalı olmama hallerinin tanımlandığını gösteren madde; sorunun cevabı bu maddede yer alır.","ad":"Madde numarası (Kanun maddesi)"},{"deger":"4","anlam":"Kanunun sigortalı sayılması gereken kişileri tanımlayan ilk madde; 6. maddede istisnalar bu maddeden hareketle belirlenir.","ad":"Referans madde numarası (ilk)"},{"deger":"5","anlam":"Kanunun sigortalı sayılması gereken kişileri tanımlayan ikinci madde; 6. maddede istisnalar bu maddeden hareketle belirlenir.","ad":"Referans madde numarası (ikinci)"}],"dayanak":"5510 sayılı Kanun m.6/1 (a), (c), (ı), (k) bentleri","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da yaşayan Ayşe Hanım, mahalledeki bir ailenin evinde ayda 8 gün temizliğe gidiyor ve karşılığında 2.400 TL alıyor.","anlatim":"Ayşe her ay aynı sayıda gün, aynı evde çalışıyor ama 10 günü hiç bulmuyor. SGK bu durumu madde 6 açısından değerlendirecek. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanun m.6, kimi kişileri kısa ve uzun vadeli sigorta kollarından sigortalı saymaz; ama her istisnanın kendi şartı var.","anlatim":"Ayşe\u0027nin 8 günü, m.6/1-c\u0027deki 10 gün eşiğinin altında kalıyor. Şimdi A\u0027dan E\u0027ye kadar bu beş ifadeyi Ayşe\u0027nin ve benzer olayların üzerinden tek tek deneyeceğiz.","doldur":[]},{"doldur":[[5,1],[5,2]],"sik":"A","paragraf":"m.6/1-a","karar":"yanlış","anlatim":"Madde 6/1-a yalnız ücretsiz çalışan eşi kapsar, burada eşe ücret ödeniyor. Ayşe\u0027nin olayına benzese de bu kişi normal işçi sigortalısıdır, işveren yanılıyor.","formul":"Şık A: işveren, ücret ödediği eşini \u0027zaten eşim, sigortasız olur\u0027 diyerek bildirmiyor, haklı mı?"},{"doldur":[[6,1],[6,2]],"sik":"B","paragraf":"m.6/1-c","karar":"doğru","anlatim":"Madde 6/1-c ev hizmetinde çalışanları sigortasız sayar, istisnası yalnız 10 gün ve üzeri çalışanlardır. Ayşe 8 günle bu istisnanın dışında kaldığı için genel kural işler ve işveren haklıdır.","formul":"Şık B: Ayşe gibi biri ayda 8 gün ev hizmetinde çalışıyor, işveren \u0027seni sigortalı yapmama gerek yok\u0027 diyor, haklı mı?"},{"doldur":[[7,1],[7,2]],"sik":"C","paragraf":"m.6/1-c","karar":"yanlış","anlatim":"Madde 6/1-c\u0027de 10 gün ve daha fazla çalışanlar hariç tutulmuş, yani bu kişi istisnanın istisnasına girer. Bu kişi aslında 4/a kapsamında sigortalıdır, işveren yanılıyor.","formul":"Şık C: aynı evde ayda 12 gün çalışan başka bir kadın için işveren \u0027o da sigortasız\u0027 diyor, doğru mu?"},{"doldur":[[8,1],[8,2]],"sik":"D","paragraf":"m.6/1-ı","karar":"doğru","anlatim":"Madde 6/1-ı tam bu şartı arıyor, gelirini belgeleyen süreksiz tarım işçisi sigortalı sayılmaz. Bu kişi doğru söylüyor.","formul":"Şık D: tarımsal geliri otuz kat alt sınırın altında kalan süreksiz bir tarım işçisi \u0027ben sigortasızım\u0027 diyor, doğru mu?"},{"doldur":[[9,1],[9,2]],"sik":"E","paragraf":"m.6/1-k","karar":"yanlış","anlatim":"Madde 6/1-k istisnası yalnız gelir vergisinden muaf olan esnafı kapsar. Bu kişi muaf olmadığı için 4/b kapsamında sigortalıdır, yanılıyor.","formul":"Şık E: esnaf siciline kayıtlı ama gelir vergisinden muaf olmayan biri \u0027ben de sigortasızım\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✓ E ✗","anlatim":"Soru \u0027sigortalı sayılmaz\u0027 diyeni sorduğu için tek doğru cevap B, ev hizmetinde 10 günden az çalışan. Kendine hep şunu sor: bu kişi istisnanın şartını gerçekten dolduruyor mu, yoksa istisnanın istisnasına mı giriyor?","doldur":[]}],"anahtar":[{"ornek":"sigortalı","kok":"sigort"},{"ornek":"istisna","kok":"istisn"},{"ornek":"çalışanlar","kok":"çalışa"},{"ornek":"sayılmama","kok":"sayılm"},{"ornek":"hizmetlerinde","kok":"hizmet"},{"ornek":"işveren","kok":"işvere"}],"konuGiris":{"harita":"Ne zaman istisna uygulanır: kişi kanunda sayılan özel bir gruba girdiğinde uygulanır. Nasıl belirlenir: kişinin durumu istisna listesindeki tanıma uyup uymadığına bakılarak belirlenir. Nasıl kaydedilir: bu kişiler sigortalı sayılmadığından kısa ve uzun vadeli sigorta kollarına kayıt yapılmaz.","desen":"Sınav, istisna listesindeki bentlerden birini örnek kişi olarak verip bunun sigortalı sayılıp sayılmadığını sordurur. Tuzak, listedeki benzer görünen ama farklı koşullu maddeleri karıştırmaktır. Bu soru m.6 istisna fıkrası noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"belirli çalışma biçimlerinin genel sigortalılık kapsamı dışında tutulması","ad":"istisna hali","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"iş kazası, hastalık, malullük ve yaşlılık gibi riskleri kapsayan sigorta grupları","ad":"kısa ve uzun vadeli sigorta kolları","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işverenin eşi gibi yakınının karşılıksız işyerinde çalışması durumu","ad":"ücretsiz aile çalışması","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"düzenli olmayan, belirli koşullu tarım veya orman işinde çalışma biçimi","ad":"süreksiz tarım işi","kim":"mükellef / işveren beyan eder"}],"sinavda":"Soru bir kişinin çalışma durumunu tarif eder ve bu kişinin sigortalı sayılıp sayılmadığının seçilmesini ister.","panel_ornek":"Bir apartmanda oturan üç kardeş, evlerinin içindeki temizlik işini kendi aralarında yapıyor, dışarıdan kimse çağırmıyorlar. Bu durum günlük hayatta \u0027aile içi iş\u0027 sayılır ve resmi bir çalışma ilişkisi gibi değerlendirilmez. Aynı mantıkla bazı çalışma biçimleri kanunda özel olarak korumanın dışında bırakılmıştır.","ornek":"Bir apartmanda oturan üç kardeş, evlerinin içindeki temizlik işini kendi aralarında yapıyor, dışarıdan kimse çağırmıyorlar. Bu durum günlük hayatta \u0027aile içi iş\u0027 sayılır ve resmi bir çalışma ilişkisi gibi değerlendirilmez. Aynı mantıkla bazı çalışma biçimleri kanunda özel olarak korumanın dışında bırakılmıştır.","yontemler":"Her seçenek istisna listesindeki bentlerle tek tek karşılaştırılmalı, tanıma tam uyan seçenek işaretlenmelidir.","nedir":"Bu konu, hangi çalışanların kanunun kısa ve uzun vadeli sigorta koruması dışında tutulduğunu belirler. Sınav, istisna listesindeki kişileri genel sigortalılık kuralından ayırt edebilmeyi ölçer."},"olay":"Ayda 10 günden az çalışma bu istisnanın istisnası kapsamına girmediğinden genel kural uygulanır.","tuzak":{"C":{"ad":"10 Gün Eşiği Tuzağı","metin":"Ev hizmetinde çalışmayı tek başına sigortasızlık nedeni sanırsın. Doğrusu: Madde 6/c\u0027de sayılan 10 gün ve üzeri çalışma istisnanın istisnasıdır; bu kişiler 4 üncü maddenin (a) bendi kapsamında sigortalı sayılır."},"E":{"ad":"Muafiyet Şartı Tuzağı","metin":"Esnaf siciline kayıtlı olmayı tek başına yeterli sanırsın. Doğrusu: Madde 6/k yalnız gelir vergisinden MUAF olan esnafı kapsar; muaf olmayan kişi 4 üncü maddenin (b) bendi kapsamında sigortalı sayılır."},"D":{"ad":"Gelir Sınırı Tuzağı","metin":"Süreksiz tarım işini tek başına sigortasızlık nedeni sanırsın. Doğrusu: Madde 6/ı yalnız tarımsal faaliyet gelirinin otuz kat alt sınırdan AZ olduğunu belgeleyenleri kapsar; geliri fazla olan kişi sigortalı sayılır."},"A":{"ad":"Eş İstisnası Tuzağı","metin":"İşverenin eşi olmayı tek başına sigortasızlık nedeni sanırsın. Doğrusu: Madde 6/a yalnız işyerinde ÜCRETSİZ çalışan eşi kapsar; ücretli çalıştırılan eş 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında normal sigortalıdır."}},"celdiriciYol":{},"hap":"5510 sayılı Kanun m.6\u0027daki sigortalı sayılmama halleri çoğu bentte bir istisna şartına (gün, tutar, muafiyet) bağlıdır; şart sağlanmazsa kişi yine 4 üncü veya 5 inci madde kapsamında sigortalı sayılır.","teshis":{"C":{"gercek":"Madde 6/c\u0027de 10 gün ve daha fazla çalışanlar istisnanın istisnası olarak hariç tutulmuş ve 4/a kapsamında sigortalı sayılmıştır.","ayirt":"Çalışma süresi ayda 10 günü buluyor mu, aşıyor mu?","paragraf":"5510 s.K. m.6/1-c","yanilgi":"Ev hizmetinde çalışmanın süresine bakmaksızın hep sigortasızlık sonucu doğurduğunu sanıyorsun."},"E":{"gercek":"Madde 6/k yalnız gelir vergisinden muaf olan ve belirli gelir sınırının altında kalan esnafı kapsar; muaf olmayan kişi 4/b kapsamında sigortalıdır.","ayirt":"Kişi gelir vergisinden muaf mı, değil mi?","paragraf":"5510 s.K. m.6/1-k","yanilgi":"Esnaf siciline kayıtlı olmayı, gelir vergisi durumuna bakmaksızın sigortasızlık için yeterli sanıyorsun."},"A":{"gercek":"Madde 6/a yalnız ücretsiz çalışan eşi kapsar; ücret ödeniyorsa istisna uygulanmaz ve kişi normal işçi sigortalısıdır.","ayirt":"Eş, işyerinde ücret alıyor mu, almıyor mu?","paragraf":"5510 s.K. m.6/1-a","yanilgi":"Eşin işyerinde çalışmasının kendiliğinden sigortasızlık sebebi olduğunu düşünüyorsun."},"D":{"gercek":"Madde 6/ı yalnız tarımsal faaliyet gelirinin otuz kat alt sınırdan az olduğunu belgeleyenleri kapsar; bu sınırı aşanlar istisna dışında kalır.","ayirt":"Belgelenen tarımsal gelir otuz kat sınırın altında mı, üstünde mi?","paragraf":"5510 s.K. m.6/1-ı","yanilgi":"Tarımda süreksiz çalışmanın tek başına, gelir düzeyine bakılmaksızın sigortasızlık getirdiğini düşünüyorsun."},"B":{"gercek":"Madde 6/c\u0027ye göre 10 gün ve üzeri çalışanlar hariç tutulduğundan, 10 günden az çalışanlar için genel kural (sigortalı sayılmama) geçerlidir.","ayirt":"Bu kişi ayda 10 gün eşiğinin altında mı çalışıyor?","paragraf":"5510 s.K. m.6/1-c","yanilgi":"Ev hizmetinde çalışan herkesin, kaç gün çalıştığına bakılmaksızın sigortasız sayıldığını düşünenler bu şıkkı gözden kaçırır."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 108"},"kural":"5510 sayılı Kanun m.18/3\u0027e göre yatarak tedavide ödenek günlük kazancın yarısı, ayaktan tedavide üçte ikisidir; aynı dönemde birden çok hal (iş kazası, hastalık, analık) birleşirse en yüksek ödenek verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 108","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"İki tedavi türünün oranını (yarısı/üçte ikisi) ayrı ayrı hesapla, sonra \u0027en yükseği verilir\u0027 kuralını en son uygula.","konu":"geçici is göremezlik sigorta kolları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Günlük kazanç","2.400 TL","-"],["İş kazası - yatarak tedavi","yatarak tedavi","-"],["Hastalık - ayaktan tedavi, 90 gün prim şartı","90 gün prim şartı sağlanmış","-"],["HESAP","-","-"],["İş kazası ödeneği (yatarak, kazancın yarısı)","2.400 / 2","1.200"],["Hastalık ödeneği (ayaktan, kazancın üçte ikisi)","2.400 x 2/3","1.600"],["Haller birleşince en yüksek ödeneğin seçilmesi","Max(1.200 ; 1.600)","1.600"]],"basliklar":["Kalem","Hesap","Tutar"]},"siklar":{"C":"1.600","E":"2.800","A":"800","D":"2.400","B":"1.200"},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.18 [1/3]","metin":"MADDE 18- Kurumca yetkilendirilen hekim veya sağlık kurullarından istirahat raporu alınmış olması şartıyla; a) İş kazası veya meslek hastalığı nedeniyle iş göremezliğe uğrayan sigortalıya her gün için, b) (Değişik: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (a) bendi ile 5 inci madde kapsamındaki sigortalılardan hastalık sigortasına tabi olanların hastalık sebebiyle iş göremezliğe uğraması halinde, iş göremezliğin başladığı tarihten önceki bir yıl içinde en az doksan gün kısa vadeli sigorta primi bildirilmiş olması şartıyla geçici iş göremezliğin üçüncü gününden başlamak üzere her gün için, c) (Değişik: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (a) bendi ile (b) bendinde belirtilen muhtarlar ile aynı bendin (1), (2) ve (4) numaralı alt bentleri kapsamındaki sigortalı kadının analığı halinde, doğumdan önceki bir yıl içinde en az doksan gün kısa vadeli sigorta primi bildirilmiş olması şartıyla, doğumdan önceki sekiz ve sonraki onaltı haftalık sürede, çoğul gebelik halinde ise doğumdan önceki sekiz haftalık süreye iki haftalık süre ilâve edilerek çalışmadığı her gün için,33 d) (Değişik: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (a) bendi ile (b) bendinde belirtilen muhtarlar ile aynı bendin (1), (2) ve (4) numaralı alt bentleri kapsamındaki sigortalı kadının, erken doğum yapması halinde doğumdan önce kullanamadığı çalıştırılamayacak süreler ile isteği ve hekimin onayıyla doğuma iki hafta kalıncaya kadar çalışması halinde, doğum sonrası istirahat süresine eklenen süreler için,3435 geçici iş göremezlik ödeneği verilir."},{"ad":"5510 s. SGK Kanunu m.18 [2/3]","metin":"(Değişik ikinci fıkra: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (b) 15/4/2021 tarihli ve 7316 sayılı Kanunun 9 uncu maddesiyle, bu bentte yer alan “üç aylık” ibaresi madde metninden çıkarılmıştır. 33 22/4/2026 tarihli ve 7578 sayılı Kanunun 19 uncu maddesiyle bu bentte yer alan “doğumdan önceki ve sonraki sekizer haftalık sürede” ibaresi “doğumdan önceki sekiz ve sonraki onaltı haftalık sürede” şeklinde değiştirilmiştir. 34 13/2/2011 tarihli ve 6111 sayılı Kanunun 29 uncu maddesiyle, bu bentte yer alan “sigortalı kadının isteği ve hekimin onayı ile doğuma üç hafta kalıncaya kadar çalışması halinde,” ibaresi “sigortalı kadının, erken doğum yapması halinde doğumdan önce kullanamadığı çalıştırılamayacak süreler ile isteği ve hekimin onayıyla doğuma üç hafta kalıncaya kadar çalışması halinde,” şeklinde değiştirilmiştir. 35 22/4/2026 tarihli ve 7578 sayılı Kanunun 19 uncu maddesiyle bu bentte yer alan “üç” ibaresi “iki” şeklinde değiştirilmiştir. 32 bendine göre sigortalı sayılanlara iş kazası veya meslek hastalığı ya da analık halinde geçici iş göremezlik ödeneği, genel sağlık sigortası dahil prim ve prime ilişkin her türlü borçlarının ödenmiş olması şartıyla yatarak tedavi süresince veya yatarak tedavi sonrası bu tedavinin gereği olarak istirahat raporu aldıkları sürede ödenir. Ancak bu maddenin birinci fıkrasının (c) bendine göre doğum öncesi ve doğum sonrası çalışmadığı sürelerde geçici iş göremezlik ödeneğinin ödenebilmesi için yatarak tedavi şartı aranmaz. (Değişik üçüncü fıkra: 17/4/2008-5754/11 md.) İş kazası, meslek hastalığı, hastalık ve sigortalı kadı…"}],"hakem":"Doğru sık (1.600 TL), 5510 s. Kanun m.18/3\u0027teki yatarak tedavide yarısı, ayaktan tedavide üçte ikisi kuralı ve birleşme halinde en yüksek ödenek verilmesi kuralı kaynak metinde açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Ödenek hesaplanırken günlük kazancın tamamı değil, yatarak tedavide yarısı, ayaktan tedavide üçte ikisi esas alınır.","E":"İş kazası ve hastalık ödeneklerini toplayıp 2.800 TL hesapladınız; oysa birleşme durumunda ödenekler toplanmaz, en yüksek olan seçilir.","A":"Ayaktan tedavide ödenek oranını üçte bir olarak ters uygulamışsınız; doğru oran günlük kazancın üçte ikisidir.","B":"Yalnız iş kazası halini dikkate alıp aynı dönemde hastalık halinin de bulunduğunu ve bu durumlarda en yüksek ödeneğin seçileceğini göz ardı ettiniz."},"dogru":"Sigortalı aynı anda iş kazası (yatarak tedavi, günlük kazancın yarısı = 1.200 TL) ve hastalık (ayaktan tedavi, günlük kazancın üçte ikisi = 1.600 TL) nedeniyle işe yaramadığında, birden fazla hal birleştiğinde en yüksek ödenek ödenir; bu nedenle 1.600 TL verilir.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 18. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 18. madde","tanim":"İş kazası, meslek hastalığı, hastalık veya analık nedeniyle sigortalı çalışamadığı günler için yapılan ödemedir; tutarı tedavi şekline (yatarak veya ayaktan) göre günlük kazancının belli bir oranı olarak hesaplanır.","ad":"Geçici iş göremezlik ödeneği"},{"kaynak":"5510 s. SGK Kanunu 18. madde","tanim":"Sigortalıda aynı dönemde iş kazası, meslek hastalığı, hastalık ve analık hallerinden birkaçının aynı anda ortaya çıkması halinde en yüksek ödenek verilir; ödenekler toplanmaz.","ad":"Halların birleşmesi"},{"kaynak":"5510 s. SGK Kanunu 18. madde","tanim":"Hastalık sigortasına tabi sigortalının hastalık nedeniyle iş göremez hale gelmesinden önce bir yıl içinde en az doksan gün bildirilmesi gereken primdir.","ad":"Kısa vadeli sigorta primi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":{"bosluk":[[1,1],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Kalem","Hesap","Tutar"],"satirlar":[["İş kazası ödeneği (yatarak, kazancın yarısı)","3.000 / 2","1.500"],["Hastalık ödeneği (ayaktan, kazancın üçte ikisi)","3.000 x 2/3","2.000"],["Haller birleşince en yüksek ödeneğin seçilmesi","Max(1.500 ; 2.000)","2.000"]]},"tur":"tablo","soru":"Sigortalı B, aynı dönemde hem iş kazası geçirip yatarak tedavi görmüş hem de kısa vadeli sigorta primine tabi hastalığı nedeniyle ayaktan tedavi görmüştür (90 günlük prim şartı sağlanmıştır). Günlük kazancı 3.000 TL olan sigortalıya 5510 sayılı Kanun\u0027un 18 inci maddesine göre ödenecek geçici iş göremezlik ödeneğinin günlük tutarı kaç TL\u0027dir?","verilen":[[0,1],[0,2]],"hedef":"Tabloyu doldur ve B\u0027nin günlük geçici iş göremezlik ödeneği tutarının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Sigortalı A, aynı dönemde hem iş kazası geçirip yatarak tedavi görmüş hem de kısa vadeli sigorta primine tabi hastalığı nedeniyle ayaktan tedavi görmüştür (90 günlük prim şartı sağlanmıştır). Günlük kazancı 2.400 TL olan sigortalıya 5510 sayılı Kanun\u0027un 18 inci maddesine göre ödenecek geçici iş göremezlik ödeneğinin günlük tutarı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-28","verilenler":[{"deger":"2.400 TL","anlam":"Her iki ödenek hesabının tabanını oluşturan günlük kazançtır.","ad":"Günlük kazanç"},{"deger":"yatarak tedavi","anlam":"m.18/3 gereği yatarak tedavide ödenek günlük kazancın yarısıdır.","ad":"İş kazası - yatarak tedavi"},{"deger":"90 gün prim şartı sağlanmış","anlam":"Şartın sağlandığı zaten belirtilmiştir, hesaba ayrıca girmez; yalnız ayaktan tedavi oranı (üçte iki) uygulanır.","ad":"Hastalık - ayaktan tedavi, 90 gün prim şartı"}],"dayanak":"5510 sayılı Kanun m.18/3 (yatarak tedavide yarısı, ayaktan tedavide üçte ikisi ve hallerin birleşmesinde en yüksek ödenek kuralı)","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Verilen: Günlük kazanç 2.400 TL (soruda verilen); yatarak tedavi (iş kazası) hali (soruda verilen); ayaktan tedavi (hastalık) hali (soruda verilen); 90 gün prim şartı sağlanmış (soruda verilen)","anlatim":"Soru bize şunları vermiş: günlük kazanç 2.400 TL, sigortalı hem iş kazası geçirip yatarak tedavi görmüş hem de hastalık nedeniyle ayaktan tedavi görmüş, 90 günlük prim şartı sağlanmış.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kural: 5510 sayılı Kanun madde 18/3 → yatarak tedavide oran %50, ayaktan tedavide oran %66,67","anlatim":"Geçici iş göremezlik ödeneği nedir? Sigortalının çalışamadığı günler için Sosyal Güvenlik Kurumu\u0027nun ödediği günlük paradır. Hangi hastalık ya da kaza olduğuna göre oranı değişir.","doldur":[]},{"formul":"İş kazası ödeneği = Günlük kazanç / 2 = 2.400 (soruda verilen) / 2 = 1.200 TL","anlatim":"İş kazası yatarak tedavi görüyor, bu durumda ödenek kazancın yarısı. Bunu hesaplıyoruz çünkü kanun yatan hasta için yarı oran belirlemiş.","doldur":[[5,1],[5,2]]},{"formul":"Hastalık ödeneği = Günlük kazanç × 2/3 = 2.400 (soruda verilen) × 2/3 = 1.600 TL","anlatim":"Hastalık ayaktan tedavi görüyor, bu durumda ödenek kazancın üçte ikisi. Ayaktan tedavide oran daha yüksek çünkü sigortalı işe devam edemese de evde tedavi görüyor.","doldur":[[6,1],[6,2]]},{"formul":"Birleşme kuralı: aynı dönemde birden çok hal varsa büyük olan ödenek seçilir","anlatim":"Aynı dönemde iki hal birleşince ne olur? Kanun burada sigortalıyı korur, düşük olanı değil yüksek olanı öder.","doldur":[]},{"formul":"Ödenecek tutar = büyük olan: 1.200 (2. adımda bulduk) ile 1.600 (3. adımda bulduk) → 1.600 TL","anlatim":"Şimdi iki tutarı karşılaştırıyoruz, çünkü kanun birleşme halinde en yüksek ödeneğin verilmesini emrediyor. Hastalık ödeneği iş kazası ödeneğinden büyük çıktı.","doldur":[[7,1],[7,2]]},{"formul":"Sonuç = 1.600 TL (5. adımda bulduk)","anlatim":"Sonuç olarak sigortalıya günlük 1.600 TL geçici iş göremezlik ödeneği ödenir. Bu tutar hastalık halinden gelen daha yüksek ödenektir.","doldur":[]},{"formul":"Ters durum: iş kazası ödeneği hastalık ödeneğinden büyük olsaydı → iş kazası tutarı seçilir","anlatim":"Ters durumda iş kazası ödeneği daha yüksek çıksaydı ne olurdu? O zaman kanun iş kazası tutarını seçtirirdi, hastalık tutarı değil.","doldur":[]},{"formul":"Yanlış yol: 1.200 + 1.600 = 2.800 TL (HATALI) → doğrusu büyük olan: 1.200 ile 1.600 → 1.600 TL (5. adımda bulduk)","anlatim":"En sık hata: öğrenci iki ödeneği toplayıp 2.800 TL bulur, bu yanlıştır. Kanun toplama değil en yüksek olanı seçmeyi emreder.","doldur":[]}],"anahtar":[{"ornek":"hastalık","kok":"hastal"},{"ornek":"tedavide","kok":"tedavi"},{"ornek":"ödeneği","kok":"ödeneğ"},{"ornek":"kazası","kok":"kazası"},{"ornek":"yüksek","kok":"yüksek"},{"ornek":"ödeneklerinin","kok":"ödenek"}],"konuGiris":{"harita":"Ne zaman test edilir: yatarak ve ayaktan tedavi bir arada olduğunda hangi oranın uygulanacağı sorulduğunda. Nasıl ölçülür: günlük kazanç, tedavi türüne göre 1/2 veya 2/3 oranıyla çarpılarak. Nasıl kaydedilir: birden çok hal birleşirse en yüksek ödenek esas alınarak kaydedilir.","desen":"Soru, aynı kişide iş kazası (yatarak) ve hastalık (ayaktan) hallerinin birleşmesini kurgulayarak öğrencinin iki oranı da hesaplayıp en yükseğini seçip seçmediğini test eder. Tuzak, ayaktan tedavi oranının (2/3) yatarak tedaviden (1/2) yüksek çıkacağını fark etmemektir. Bu soru m.18 üçüncü fıkra ve hallerin birleşmesi kuralından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Ödeneğin hesabına esas alınan günlük kazanç tutarı","ad":"Günlük kazanç","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Günlük kazancın yarısının ödenmesi kuralı","ad":"Yatarak tedavi oranı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Günlük kazancın üçte ikisinin ödenmesi kuralı","ad":"Ayaktan tedavi oranı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Birden çok hal birleşirse en yüksek ödeneğin verilmesi ilkesi","ad":"Hallerin birleşmesi kuralı","kim":"kanun sabitler"}],"sinavda":"Günlük kazanç ve iki farklı tedavi hali verilir, ödenecek günlük ödenek tutarı istenir.","panel_ornek":"Arkadaşın hem elektrik faturasından hem su faturasından indirim kazandı ama tek indirim uygulanabiliyor, o da bakıyor hangisi daha yüksekse onu kullanıyor, 30 TL yerine 50 TL indirimi seçiyor. Aynı mantık iki hak birleşince en yükseği alma kuralı.","ornek":"Arkadaşın hem elektrik faturasından hem su faturasından indirim kazandı ama tek indirim uygulanabiliyor, o da bakıyor hangisi daha yüksekse onu kullanıyor, 30 TL yerine 50 TL indirimi seçiyor. Aynı mantık iki hak birleşince en yükseği alma kuralı.","yontemler":"Her hal için ilgili oran ayrı hesaplanır, sonra en yüksek olan tutar cevap olarak seçilir.","nedir":"Geçici iş göremezlik ödeneği, sigortalının çalışamadığı günler için Kurumca ödenen tazminattır. Sınav, hangi tedavi türünde günlük kazancın hangi oranla çarpılacağını ve hak birleşmesinde hangi ödeneğin verileceğini ölçer."},"olay":"iş kazası (yatarak) 2.400/2=1.200; hastalık (ayaktan) 2.400x2/3=1.600; ikisinden yüksek olan 1.600 seçilir.","tuzak":{"D":{"ad":"Kazancın Tamamı Tuzağı","metin":"Günlük kazancın tamamının ödenek olarak ödendiğini sandın. Doğrusu: ödenek oranı yatarak tedavide yarısı, ayaktan tedavide üçte ikisidir; kazancın tamamı ödenmez."},"E":{"ad":"Toplama Tuzağı","metin":"İş kazası ve hastalık ödeneklerini birbirine ekledin. Doğrusu: haller birleştiğinde ödenekler toplanmaz, yalnızca en yükseği ödenir."},"A":{"ad":"Oran Karıştırma Tuzağı","metin":"Ayaktan tedavideki üçte iki oranını üçte bir gibi uyguladın. Doğrusu: ayaktan tedavide günlük kazancın üçte ikisi esas alınır, oran ters uygulanmaz."},"B":{"ad":"Tekil Hal Tuzağı","metin":"Yalnız iş kazası nedeniyle yatarak tedavi ödeneğini esas alıp hastalık halini ve birleşme kuralını hesaba katmadın. Doğrusu: aynı dönemde birden çok hal birleşirse en yüksek ödenek dikkate alınır."}},"celdiriciYol":{"D":"2.400 x 1 = 2.400 (günlük kazancın tamamının ödendiğini sandın)","E":"1.200 + 1.600 = 2.800 (iki ödeneği toplanacak sandın)","A":"2.400 / 3 = 800 (üçte iki oranını üçte bir gibi ters uyguladın)","B":"2.400 / 2 = 1.200 (yalnız iş kazası halini esas alıp birleşme kuralını atladın)"},"hap":"Aynı dönemde birden çok hal (iş kazası, hastalık, analık) birleşirse geçici iş göremezlik ödeneklerinin en yükseği ödenir.","teshis":{"C":{"gercek":"m.18/3\u0027e göre haller birleşince en yüksek ödenek seçilir; burada 1.600 TL, 1.200 TL\u0027den yüksektir.","ayirt":"İki tutardan hangisi büyük ve kural hangisini seçmemi söylüyor?","paragraf":"m.18/3","yanilgi":"Birleşme kuralını atlayıp iki tutarı ayrı ayrı doğru şık sanabilir, hangisinin esas alınacağını karıştırırsın."},"E":{"gercek":"m.18/3 son cümle haller birleştiğinde toplama değil, en yüksek ödeneğin seçileceğini öngörür.","ayirt":"Kural toplama mı diyor, seçme mi diyor?","paragraf":"m.18/3 son cümle","yanilgi":"İki ayrı halin ödeneğinin toplanacağını sanıyorsun."},"A":{"gercek":"5510 s. Kanun m.18/3 ayaktan tedavide günlük kazancın üçte ikisini öngörür.","ayirt":"Ayaktan tedavide pay/payda hangi yönde, kazancı mı çarpıyorum yoksa bölüyor muyum?","paragraf":"m.18/3","yanilgi":"Ayaktan tedavi oranını üçte bir sanıyorsun."},"D":{"gercek":"Ödenek her koşulda kazancın bir kesridir (yarısı ya da üçte ikisi), tamamı değildir.","ayirt":"Ödenek oranı 1 mi yoksa 1/2 veya 2/3 mü?","paragraf":"m.18/3","yanilgi":"Ödeneğin günlük kazancın tamamı olduğunu sanıyorsun."},"B":{"gercek":"m.18/3 son cümle: haller birleşirse en yüksek ödenek verilir, tekil hal esas alınmaz.","ayirt":"Olayda birden fazla iş göremezlik hali var mı, varsa hangisi daha yüksek?","paragraf":"m.18/3 son cümle","yanilgi":"Yalnız ilk halin ödeneğini yeterli sanıyorsun, ikinci halin varlığını gözden kaçırıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 110"},"kural":"4857 sayılı İş Kanunu m.41 uyarınca her bir saat fazla çalışma için normal ücretin saat başına düşen tutarı %50 zamlı ödenir; sabit yardımlar bu hesaba girmez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 110","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ters sorularda önce doğru formülü kur, sonra verilen sonuçtan geriye giderek bilinmeyeni izole et; ek yardım gibi çeldirici kalemleri formüle hiç sokma.","konu":"fazla çalışma hükümleri","tablo":{"satirlar":[["VERİLENLER","-"],["Normal saat ücreti","120 TL"],["Yakacak yardımı","900 TL"],["Toplam fazla çalışma ücreti","5.400 TL"],["HESAP","-"],["Zamlı saat ücreti (120x1,5)","180"],["Fazla çalışma süresi (5.400/180)","30 saat"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"30","E":"45","A":"18","D":"36","B":"24"},"kaynak":{"alinti":"de açıkça desteklenmektedir; sabit yardımların hesaba girmemesi de kaynakta belirtilen","liste":[{"ad":"İş K. (4857 s.K.) m.41 [1/2]","metin":"Madde 41 - Ülkenin genel yararları yahut işin niteliği veya üretimin artırılması gibi nedenlerle fazla çalışma yapılabilir. Fazla çalışma, Kanunda yazılı koşullar çerçevesinde, haftalık kırkbeş saati aşan çalışmalardır. 63 üncü madde hükmüne göre denkleştirme esasının uygulandığı hallerde, işçinin haftalık ortalama çalışma süresi, normal haftalık iş süresini aşmamak koşulu ile, bazı haftalarda toplam kırkbeş saati aşsa dahi bu çalışmalar fazla çalışma sayılmaz. Her bir saat fazla çalışma için verilecek ücret normal çalışma ücretinin saat başına düşen miktarının yüzde elli yükseltilmesi suretiyle ödenir. Haftalık çalışma süresinin sözleşmelerle kırkbeş saatin altında belirlendiği durumlarda yukarıda belirtilen esaslar dahilinde uygulanan ortalama haftalık çalışma süresini aşan ve kırkbeş saate kadar yapılan çalışmalar fazla sürelerle çalışmalardır. Fazla sürelerle çalışmalarda, her bir saat fazla çalışma için verilecek ücret normal çalışma ücretinin saat başına düşen miktarının yüzde yirmibeş yükseltilmesiyle ödenir. Fazla çalışma veya fazla sürelerle çalışma yapan işçi isterse, bu çalışmalar karşılığı zamlı ücret yerine, fazla çalıştığı her saat karşılığında bir saat otuz dakikayı, fazla sürelerle çalıştığı her saat karşılığında bir saat onbeş dakikayı serbest zaman olarak kullanabilir. İşçi hak ettiği serbest zamanı altı ay zarfında, çalışma süreleri içinde ve ücretinde bir kesinti olmadan kullanır. 63 üncü maddenin son fıkrasında yazılı sağlık nedenlerine dayanan kısa veya sınırlı süreli işlerde ve 69 uncu maddede belirtilen gece çalışmasında fazla çalışma yapılamaz. Fazl…"},{"ad":"İş K. (4857 s.K.) m.41 [2/2]","metin":"(Ek fıkra: 10/9/2014-6552/4 md.) Bu Kanunun 42 nci ve 43 üncü maddelerinde sayılan hâller dışında yer altında maden işlerinde çalışan işçilere fazla çalışma yaptırılamaz. (Ek fıkra: 10/9/2014-6552/4 md.) Yer altında maden işlerinde çalışan işçilere, bu Kanunun 42 nci ve 43 üncü maddelerinde sayılan hâllerde haftalık otuz yedi buçuk saati aşan her bir saat fazla çalışma için verilecek ücret, normal çalışma ücretinin saat başına düşen miktarının yüzde yüzden az olmamak üzere arttırılması suretiyle ödenir.15 4/4/2015 tarihli ve 6645 sayılı Kanunun 34 üncü maddesiyle, bu fıkrada yer alan “haftalık otuz altı saati aşan” ibaresi “haftalık otuz yedi buçuk saati aşan” şeklinde değiştirilmiştir. 15 Fazla çalışma ve fazla sürelerle çalışmaların ne şekilde uygulanacağı çıkarılacak yönetmelikte gösterilir. Zorunlu nedenlerle fazla çalışma"}],"hakem":"Soru fazla çalışma ücretinin %50 zamla hesaplanması kuralına dayanmakta ve bu kural İş K. m.41\u0027de açıkça desteklenmektedir; sabit yardımların hesaba girmemesi de kaynakta belirtilen \u0027normal çalışma ücretinin saat başına düşen miktarı\u0027 tanımıyla tutarlıdır."},"kayitlar":[],"sade":{"siklar":{"D":"%25 zam uygulandığında bu sonuç çıkar; kanun %50 zam gerekli kılıyor.","E":"Zam uygulaması atlanıp doğrudan bölme yapıldığında bu rakam ortaya çıkıyor; %50 zamlı ücret kullanmak zorunludur.","A":"Yakacak yardımını saatlik ücrete dahil edip %100 zam uyguladığında çıkıyor; oysa yardım saate bağlı değildir ve zam oranı %50\u0027dir.","B":"Yakacak yardımını günlük tarife edip normal ücrete kattığında hesap bozuluyor; sabit yardımlar fazla çalışma ücretine esas değildir."},"dogru":"Normal saatlik ücreti 120 TL olan işçinin fazla çalışması için kanun %50 zam öngörüyor. Zamlı saat ücreti 120 × 1,5 = 180 TL olur. Tahakkuk eden 5.400 TL\u0027yi bu zamlı ücrete bölünce 30 saat çıkıyor. Yakacak yardımı saatlik ücrete eklenmez.","sinav":"İş Kanunu 41. madde uyarınca fazla çalışma ücretinde normal çalışma ücretinin saat başına düşen miktarının yüzde elli yükseltilmesi gerekir.","kavramlar":[{"kaynak":"İş Kanunu 41. madde","tanim":"Haftalık kırkbeş saati aşan çalışmalar olup, kanunda yazılı koşullar çerçevesinde yapılabilir.","ad":"Fazla çalışma"},{"kaynak":"İş Kanunu 41. madde","tanim":"Her bir saat fazla çalışma için verilecek ücret, normal ücretin saatlik tutarı üzerine %50 zam yapılmak suretiyle hesaplanır.","ad":"Normal çalışma ücretinin saat başına düşen miktarının yüzde elli yükseltilmesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":{"bosluk":[[1,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Zamlı saat ücreti (150x1,5)","225"],["Fazla çalışma süresi (6.750/225)","30 saat"]]},"tur":"tablo","soru":"İşçinin saat başına normal ücreti 150 TL, aylık sabit 700 TL yol yardımı vardır. İşveren zamlı ücret ödemeyi tercih etmiş, bu ay için 6.750 TL fazla çalışma ücreti tahakkuk ettirmiştir. İşçinin bu ay yaptığı fazla çalışma süresi kaç saattir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve fazla çalışma süresinin kaç saat olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşçinin saat başına normal ücreti 120 TL, aylık sabit 900 TL yakacak yardımı vardır. İşveren zamlı ücret ödemeyi tercih etmiş, bu ay için 5.400 TL fazla çalışma ücreti tahakkuk ettirmiştir. İşçinin bu ay yaptığı fazla çalışma süresi kaç saattir?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-29","verilenler":[{"deger":"120 TL","anlam":"Fazla çalışma zammının uygulanacağı taban saat ücretidir.","ad":"Normal saat ücreti"},{"deger":"900 TL","anlam":"Aylık sabit bir yardımdır, çalışılan saate bağlı olmadığı için fazla çalışma hesabına dahil edilmez, çeldiricidir.","ad":"Yakacak yardımı"},{"deger":"5.400 TL","anlam":"Sonuç olarak verilen tutardır; buradan geriye giderek fazla çalışma süresi bulunur.","ad":"Toplam fazla çalışma ücreti"}],"dayanak":"4857 sayılı İş Kanunu m.41/1","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Verilen: Normal saat ücreti 120 TL (soruda verilen); Sabit yakacak yardımı 900 TL (soruda verilen); Fazla çalışma ücreti tahakkuku 5.400 TL (soruda verilen); Zam oranı %50 (İş Kanunu m.41)","anlatim":"Soru bize şunları vermiş: saat başına normal ücret 120 TL (soruda verilen), aylık sabit yakacak yardımı 900 TL (soruda verilen), bu ay tahakkuk eden fazla çalışma ücreti 5.400 TL (soruda verilen).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kapsam: Fazla çalışma ücreti = zamlı saat ücreti × çalışılan saat; Dahil değil: sabit yakacak yardımı 900 TL (soruda verilen)","anlatim":"Fazla çalışma ücreti nedir? İşçinin normal mesai dışında çalıştığı saatler için ödenen ek ücrettir. İş Kanunu m.41\u0027e göre her saat için normal ücretin %50 fazlası ödenir.","doldur":[]},{"formul":"Zamlı saat ücreti = Normal saat ücreti × %150 = 120 (soruda verilen) × %150 = 180 TL","anlatim":"Önce zamlı saat ücretini buluyoruz, çünkü fazla çalışma bu tutar üzerinden ödenir. Normal ücretin %50 fazlası eklenir.","doldur":[[5,1]]},{"formul":"Fazla çalışma süresi = Toplam fazla çalışma ücreti / Zamlı saat ücreti = 5.400 (soruda verilen) / 180 (3. adımda bulduk) = 30 saat","anlatim":"Şimdi toplam fazla çalışma ücretini zamlı saat ücretine bölüyoruz, çünkü kaç saat çalışıldığını böyle buluruz. Sabit yardım bu bölüme hiç girmez.","doldur":[[6,1]]},{"formul":"Sonuç: Fazla çalışma süresi = 30 saat (4. adımda bulduk)","anlatim":"İşçi bu ay 30 saat fazla çalışma yapmış. Sonucu 5.400 TL\u0027lik tahakkukun 180 TL\u0027ye bölünmesiyle bulduk.","doldur":[]},{"formul":"Ters durum: süre verilmiş olsaydı → Fazla çalışma ücreti = Zamlı saat ücreti × saat sayısı","anlatim":"Ters durumda soru süreyi verip ücreti sorsaydı çarpma yapardık. Zamlı saat ücretiyle saat sayısını çarparsın.","doldur":[]},{"formul":"Yanlış yol: (5.400 + 900) / 180 = 35 saat (HATALI) → doğrusu 30 saat (4. adımda bulduk)","anlatim":"En sık hata, 900 TL\u0027lik sabit yakacak yardımını hesaba katıp 5.400 TL\u0027yi buna göre bölmek. Sabit yardım fazla çalışmayla ilgisiz, sadece normal saat ücreti zamlanır.","doldur":[]}],"anahtar":[{"ornek":"ücreti","kok":"ücreti"},{"ornek":"çalışma","kok":"çalışm"},{"ornek":"normal","kok":"normal"},{"ornek":"yardımlar","kok":"yardım"},{"ornek":"ödenir","kok":"ödenir"},{"ornek":"hesaba","kok":"hesaba"}],"konuGiris":{"harita":"Ne zaman test edilir: saat başına ücret ve toplam fazla çalışma tutarı verildiğinde çalışılan saat sorulduğunda. Nasıl ölçülür: zamlı saatlik ücret bulunup toplam tutar buna bölünerek. Nasıl kaydedilir: bulunan saat sayısı doğrudan cevap olarak yazılır.","desen":"Soru genelde saatlik ücret ve toplam tahakkuk tutarını verip fazla çalışma saatini sordurur; tuzak, yakacak yardımı gibi ücrete dahil olmayan sabit ödemelerin hesaba karıştırılmasıdır. Öğrenci yanlışlıkla yardım tutarını da işleme katabilir, oysa hesap yalnız saatlik ücret üzerinden yapılır. Bu soru m.41\u0027deki yüzde elli zamlı ücret kuralı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşçinin saat başına aldığı temel çalışma ücreti","ad":"Normal ücret","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"sen hesaplarsın","tanim":"Normal saatlik ücretin yüzde elli artırılmış hâli","ad":"Zamlı ücret","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Zamlı saatlik ücretin çalışılan fazla saatle çarpımı sonucu ödenen toplam para","ad":"Fazla çalışma tutarı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Toplam fazla çalışma tutarının zamlı saatlik ücrete bölünmesiyle bulunan saat sayısı","ad":"Fazla çalışma süresi","kim":"kanun sabitler"}],"sinavda":"Saatlik normal ücret ve toplam fazla çalışma ücreti verilir, çalışılan fazla saat sayısı istenir.","panel_ornek":"Bir kurye normalde saatte 40 TL kazanıyor, hafta sonu ekstra teslimat yaptığında saatine yüzde elli zamlı yani 60 TL alıyor. Ay sonunda toplam 240 TL ekstra ödeme aldıysa, 240\u0027ı 60\u0027a bölerek 4 saat ekstra çalıştığını bulabilirsin.","ornek":"Bir kurye normalde saatte 40 TL kazanıyor, hafta sonu ekstra teslimat yaptığında saatine yüzde elli zamlı yani 60 TL alıyor. Ay sonunda toplam 240 TL ekstra ödeme aldıysa, 240\u0027ı 60\u0027a bölerek 4 saat ekstra çalıştığını bulabilirsin.","yontemler":"Önce normal saatlik ücret yüzde elli artırılarak zamlı saatlik ücret bulunur, sonra toplam tutar bu zamlı ücrete bölünür. Yakacak yardımı gibi sabit ek ödemeler bu hesaba katılmaz.","nedir":"Fazla çalışma hükümleri, haftalık 45 saati aşan çalışmaların ücretinin nasıl hesaplanacağını düzenler. Sınav, saatlik ücret üzerinden zamlı ücret hesabını yapabilmeni ölçer."},"olay":"Zamlı saat ücreti 120x1,5=180 TL; fazla çalışma süresi 5.400/180=30 saat.","tuzak":{"D":{"ad":"Oran Karıştırma Tuzağı","metin":"%50 zam yerine %25 zam uyguladın. Doğrusu: kanunda öngörülen zam oranı %50\u0027dir, başka bir oran uygulanamaz."},"E":{"ad":"Katman Atlama Tuzağı","metin":"Zam uygulamayı tamamen unutup tutarı doğrudan normal saat ücretine böldün. Doğrusu: fazla çalışma ücretinde %50 zam uygulaması zorunludur, atlanamaz."},"A":{"ad":"Çifte Katman Tuzağı","metin":"Hem yakacak yardımını saatlik ücrete ekleyip hem zam oranını %100 aldın; sonuçta hem tabanı hem oranı yanlış büyüttün. Doğrusu: yalnız normal saat ücretine kanunun öngördüğü %50 zam uygulanır, sabit yardımlar dahil edilmez."},"B":{"ad":"Ücrete Dahil Etme Tuzağı","metin":"Yakacak yardımını günlük tutara çevirip saatlik ücrete kattın, oysa bu kalem çalışılan saate bağlı değildir. Doğrusu: fazla çalışma ücretine esas saat ücreti yalnız çıplak normal ücrettir."}},"celdiriciYol":{"D":"120×1,25=150; 5.400/150=36 (zam oranını %25 aldı)","E":"5.400/120=45 (zam uygulamayı atladı)","A":"(120+900/30)×2=300; 5.400/300=18 (hem yakacak yardımını ücrete kattı hem zammı %100 aldı)","B":"(120+900/30)×1,5=225; 5.400/225=24 (yakacak yardımını ücrete kattı)"},"hap":"Fazla çalışma ücreti, yalnız normal saat ücretine %50 zam uygulanarak hesaplanır; sabit yardımlar bu hesaba dahil edilmez.","teshis":{"C":{"gercek":"m.41/1 fazla çalışma ücretinin normal ücretin saat başına düşen tutarının %50 fazlasıyla ödeneceğini belirtir; ücrete dahil olmayan yardımlar hesaba katılmaz.","ayirt":"Zam oranını ve hesaba giren tutarı doğru ayırdım mı?","paragraf":"m.41/1","yanilgi":"Zam oranını veya yakacak yardımının hesaba girmeyeceğini gözden kaçırıp başka şıkkı seçtin."},"E":{"gercek":"Fazla çalışma ücretinde %50 zam uygulaması zorunludur, atlanamaz.","ayirt":"Saatlik ücrete zam uyguladım mı?","paragraf":"m.41/1","yanilgi":"Zam uygulamanın isteğe bağlı olduğunu, atlanabileceğini düşündün."},"A":{"gercek":"m.41/1 yalnız çıplak saat ücretine %50 zam öngörür; sabit yardımlar hesaba girmez.","ayirt":"Bu ödeme çalışılan saate bağlı normal ücretin parçası mı yoksa sabit bir yardım mı?","paragraf":"m.41/1","yanilgi":"Yakacak yardımını da saatlik ücretin parçası sayıp üstüne zammı da abarttın."},"D":{"gercek":"Kanunda öngörülen zam oranı %50\u0027dir, başka bir oran uygulanamaz.","ayirt":"Zam oranı olarak kullandığım yüzde kanunda yazan mı?","paragraf":"m.41/1","yanilgi":"Zam oranını %50 yerine %25 olarak hatırladın."},"B":{"gercek":"Fazla çalışma ücretine esas saat ücreti yalnız normal çıplak ücrettir, ek yardımlar dahil edilmez.","ayirt":"Bu kalem işçinin her çalıştığı saat karşılığı mı ödeniyor?","paragraf":"m.41/1","yanilgi":"Yakacak yardımını günlüğe bölüp saatlik ücrete eklenebileceğini düşündün."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 109"},"kural":"5510 sayılı Kanun m.40\u0027a eklenen cümleye göre tablonun (10) numaralı sırasındaki (yer altı işleri) sigortalıların, zamdan yararlandırılacağı dönem içindeki yıllık ücretli izin, sıhhi izin, hafta tatili, ulusal bayram-genel tatil ile eğitim-kurs ve iş öncesi-sonrası hazırlık sürelerinde fiilen çalışma ve risklere maruz kalma şartı aranmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Fiili hizmet süresi zammı sorularında önce sigortalının hangi sıra numarasında olduğunu, sonra o sıraya özgü istisnanın var olup olmadığını ayır; istisnayı başka sıraya taşıma.","konu":"fiili hizmet süresi zammı","tablo":{"satirlar":[["A) Türk Silahlı Kuvvetlerinde subay olarak görev yapan sigo…","m.40/1","YANLIŞ ifade"],["B) Çimento fabrikasının otomatik fırınlarında çalışan sigor…","m.40, ek cümle (6552/42 md.)","YANLIŞ ifade"],["C) Yer altında maden ocağı işinde çalışan sigortalının, fii…","m.40, ek cümle (6552/42 md.)","YANLIŞ ifade"],["D) Birden fazla fiili hizmet süresi zammı bendine dahil ola…","m.40/1, son fıkra","YANLIŞ ifade"],["E) Yer altında maden ocağı işinde çalışan sigortalının, fii…","m.40, ek cümle (6552/42 md.)","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yer altında maden ocağı işinde çalışan sigortalının, fiili hizmet süresi zammından yararlandırılacağı dönem içinde kullandığı eğitim ve kurs süresi, fiilen çalışma şartı arandığından zam kapsamı dışında kalır.","E":"Yer altında maden ocağı işinde çalışan sigortalının, fiili hizmet süresi zammından yararlandırılacağı dönem içinde kullandığı yıllık ücretli izin süresi için, fiilen çalışma ve risklere maruz kalma şartı aranmaksızın fiili hizmet süresi zammı uygulanır.","A":"Türk Silahlı Kuvvetlerinde subay olarak görev yapan sigortalıya fiili hizmet süresi zammı uygulanabilmesi için, ilgili işin risklerine fiilen maruz kalması şartı aranır.","D":"Birden fazla fiili hizmet süresi zammı bendine dahil olan sigortalıya, ilgili bentlerde öngörülen gün sayılarının toplamı uygulanır.","B":"Çimento fabrikasının otomatik fırınlarında çalışan sigortalının hafta tatili süresi, fiilen çalışma ve risklere maruz kalma şartı aranmaksızın fiili hizmet süresi zammı kapsamında değerlendirilir."},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.40 [1/8]","metin":"MADDE 40- (Değişik: 17/4/2008-5754/25 md.) Aşağıda belirtilen işyerlerinde ve işlerde 4 üncü maddenin birinci fıkrasının (a) ve (c) bentleri kapsamında çalışan sigortalıların prim ödeme gün sayılarına, bu işyerlerinde ve işlerde geçen çalışma sürelerinin her 360 günü için karşılarında gösterilen gün sayıları, fiilî hizmet süresi zammı olarak eklenir. 360 günden eksik sürelere ait fiilî hizmet süresi zammı, 360 gün için eklenen fiilî hizmet süresi ile orantılı olarak belirlenir. Çalışmanın fiili hizmet süresi zammı kapsamında değerlendirilebilmesi için, tablonun (13) ve (14) numaralı sıralarında belirtilen sigortalılar hariç sigortalının kapsamdaki işyerleri ile birlikte belirtilen işlerde fiilen çalışması ve söz konusu işlerin risklerine maruz kalması şarttır. (Ek cümle: 10/9/2014-6552/42 md.) Tablonun (10) numaralı sırasında belirtilen sigortalıların, fiili hizmet süresi zammından yararlandırılacakları dönem içinde kalan; yıllık ücretli izin, sıhhi izin, hafta tatili, ulusal bayram ve genel tatil günleri ile eğitim, kurs, iş öncesi ve sonrası hazırlık 17/4/2008 tarihli ve 5754 sayılı Kanunun 65 inci maddesiyle birinci fıkrada yer alan “malûl kalan” ibaresi “malûl veya vazife malûlü olan” şeklinde değiştirilmiş; aynı Kanunun 66 ncı maddesiyle ikinci fıkrada yer alan “Malûllük” ibaresinden sonra gelmek üzere “, vazife malûllüğü” ibaresi eklenmiştir. 55 sürelerinde fiilen çalışma ve söz konusu işlerin risklerine maruz kalma şartı aranmaz. Aşağıdaki bentlerden birden fazlasına dahil olanlar için, en yüksek olan bentten fiilî hizmet süresi zammı uygulanır. Kapsamdaki İşler/İşye…"},{"ad":"5510 s. SGK Kanunu m.40 [2/8]","metin":"2) Kurşunlu madenlerden yahut içinde kurşun bulunan kül, maden köpüğü, kurşun fırın kurumu, üstübeç artığı ve benzeri maddelerden kurşun üretimi için yapılan izabe işlerinde çalışanlar. 3) Antimuan, kalay, bronz ve benzeri maddelerle yapılan kurşun alaşımı işlerinde çalışanlar. 4) Kurşun izabe fırınlarının teksif odalarında biriken kuru tozları kaldırma işlerinde çalışanlar. 2) Cam fabrika ve atölyeleri 1) Cam yapımında kullanılan ilkel maddeleri toz haline getirme, eleme, karıştırma ve kurutma işlerinde (bu işleri yapmak üzere tam kapalı odalar içinde otomatik makineli tesisat veya çalışma ortamındaki tozları sağlık için tehlike oluşturmayacak düzeye indiren havalandırma tesisatı bulunmadığı takdirde) çalışanlar. 2) Eritme işlerinde (otomatik besleme fırınlarıyla çalışılmadığı takdirde) çalışanlar. 3) Ateşçilik işlerinde çalışanlar. 4) Üfleme işlerinde (tamamen otomatik makinelerle yapılmadığı takdirde) çalışanlar. 5) Basınçla yapılan cam işlerinde (cam tazyiki işleri) çalışanlar. 6) Ayna camı sanatında potalı cam dökümü işlerinde (potalar kalıp masasına mekanik araçlarla taşınmadığı takdirde) çalışanlar. 7) Camı fırın başından alma işlerinde çalışanlar. 8) Yayma fırınlarında düzeltme işlerinde çalışanlar. 9) Traş işlerinde çalışanlar. 10) Asitle hak ve cilâlama işlerinde çalışanlar. 11) Basınçlı havayla kum püskürten cihazlarla yapılan işlerde (çalışma ortamındaki tozları Eklenecek Gün Sayısı 60 90 60 Kapsamdaki İşler/İşyerleri Kapsamdaki Sigortalılar Eklenecek Gün Sayısı sağlık için tehlike oluşturmayacak düzeye indiren havalandırma tesisatı bulunmadığı takdirde) çalışan…"}],"hakem":"Doğru sık, 5510 s. Kanun m.40\u0027ın ek cümlesi (10/9/2014-6552/42 md.) tarafından açıkça desteklenmektedir; tablonun (10) numaralı sırasındaki (yer altı işleri) sigortalıların yıllık ücretli izin süresinde fiilen çalışma ve risklere maruz kalma şartı aranmaksızın fiili hizmet süresi zammı uygulanır."},"kayitlar":[],"sade":{"siklar":{"C":"Yer altı maden işçisinin eğitim ve kurs süresi, fiilen çalışma şartı aranmaksızın fiili hizmet süresi zammına dahil edilir; kanun bu süreleri açıkça kapsamına almıştır.","E":"Doğru seçenek, diğer şıklar gerekçeleri yukarıda verilmiştir.","A":"Türk Silahlı Kuvvetleri personeli fiili hizmet süresi zammında risklere maruz kalma şartından muaftır; kanun onları açıkça istisna tutmuştur.","D":"Birden fazla zammı bendin kapsamına giren işçiye, gün sayıları toplanmaz; yalnız en yüksek gün sayısını öngören bend uygulanır.","B":"Çimento fabrikasının otomatik fırınlarında çalışanlar, yıllık izin gibi süreler için şart aranmayan istisnadan yararlanmaz; bu istisna yalnız yer altı maden işçilerine tanınmıştır."},"dogru":"Yer altı maden işçisinin yıllık ücretli izin süresi fiili hizmet süresi zammına dahil edilir; bu süre için fiilen çalışma ve risk şartı aranmaz. Kanun bu işçilere özel istisna tanımıştır.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 40. madde ek cümle","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 40. madde","tanim":"Belirtilen tehlikeli işyerleri ve işlerde çalışan sigortalıların prim ödeme gün sayısına her 360 günü için eklenen ek gün sayısı.","ad":"fiili hizmet süresi zammı"},{"kaynak":"5510 s. SGK Kanunu 40. madde","tanim":"Sosyal Sigortalar Kanunu 40. maddenin tablosunun 10. sırasında belirtilen, fiili hizmet süresi zammı kapsamındaki işler.","ad":"yer altı maden işleri"},{"kaynak":"5510 s. SGK Kanunu 40. madde ek cümle","tanim":"Yer altı maden işçilerinin fiili hizmet süresi zammından yararlandırılacağı dönem içinde kullanmış olduğu ve fiilen çalışma ile risk şartı aranmaksızın zamma dahil edilen süre.","ad":"yıllık ücretli izin"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027na göre fiili hizmet süresi zammı uygulamasına ilişkin aşağıdaki ifadelerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-30","verilenler":[],"dayanak":"5510 sayılı Kanun m.40, fıkra 1 ve ek cümle (10/9/2014-6552/42 md.)","dogru":"E","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Zonguldak\u0027ta bir taşkömürü işletmesinde, yer altı maden ocağında 6 yıldır kazma işinde çalışan Bilal, 2023 yılında 21 gün yıllık ücretli izne çıkıyor.","anlatim":"İşveren, Bilal\u0027in bu 21 günlük izin süresini fiili hizmet süresi zammı hesabına katıp katmayacağını sana soruyor. Sen de kanunun ne dediğine bakacaksın.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanun m.40\u0027a göre kural iki katmanlı; genel kural fiilen çalışma ve risk şartı arar, ama (10) numaralı sıradaki yer altı işçileri için ek cümle bazı sürelerde bu şartı kaldırır. Bu tek olayda beş ifadeyi tek tek deneyeceğiz.","anlatim":"Beş şıkkı da Bilal\u0027in olayına ya da benzer bir olaya uygulayıp doğru mu yanlış mı karar vereceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.40/1","karar":"yanlış","anlatim":"Hayır, madde tablonun (13) ve (14) numaralı sıralarındaki sigortalıları bu şarttan hariç tutar. Subay bu istisna kapsamına girebilir, şart aranmayabilir.","formul":"Şık A: Bir subay için \u0027fiilen çalışma ve risk şartı her sigortalıya aranır\u0027 desen, doğru mu dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.40, ek cümle (6552/42 md.)","karar":"yanlış","anlatim":"Hayır, şartsız istisna sadece (10) numaralı sıradaki yer altı işçilerine tanınmıştır. Çimento işçisi bu istisnaya dahil değildir.","formul":"Şık B: Çimento fabrikasında hafta tatili süresinin şartsız zam kapsamına girdiğini söylesen, doğru mu olur?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.40, ek cümle (6552/42 md.)","karar":"yanlış","anlatim":"Hayır, ek cümle tam tersini söyler; eğitim, kurs ve hazırlık süreleri de şartsız zam kapsamına girer. Bilal bu süre için de zam alır.","formul":"Şık C: Bilal\u0027in eğitim-kurs süresinin, fiilen çalışma şartı arandığı için zam kapsamı dışında kaldığını söylesen, doğru mu olur?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.40/1, son fıkra","karar":"yanlış","anlatim":"Hayır, kanun toplama değil seçim yapar; en yüksek gün sayısı olan bent uygulanır. Toplama yapılsaydı Bilal haksız yere fazla gün alırdı.","formul":"Şık D: Bilal birden fazla bende girseydi, gün sayılarının toplanacağını söylesen, doğru mu olur?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.40, ek cümle (6552/42 md.)","karar":"doğru","anlatim":"Evet, ek cümle açıkça (10) numaralı sıradaki yer altı işçisinin yıllık ücretli izin süresini bu istisnaya dahil eder. Bilal maden ocağında çalıştığı için bu istisnadan yararlanır.","formul":"Şık E: Bilal\u0027in 21 günlük yıllık izninin, şart aranmaksızın fiili hizmet süresi zammına dahil edildiğini söylesen, doğru mu olur?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Genel kural şart arar ama (10) numaralı sıradaki yer altı işçisi için izin, tatil, eğitim gibi süreler istisnadır; kendine hep şunu sor: bu sigortalı (10) numaralı sırada mı ve bu süre ek cümlede sayılan sürelerden biri mi?","doldur":[]}],"anahtar":[{"ornek":"istisnadır","kok":"istisn"},{"ornek":"numaralı","kok":"numara"},{"ornek":"sürelerinde","kok":"sürele"},{"ornek":"süresi","kok":"süresi"},{"ornek":"sıradaki","kok":"sırada"},{"ornek":"işçisi","kok":"işçisi"}],"konuGiris":{"harita":"Ne zaman test edilir: sigortalının kapsamdaki işte fiilen çalışıp riske maruz kaldığı süre boyunca. Nasıl ölçülür: her 360 günlük fiili çalışma karşılığında kanunda belirlenen gün sayısı, eksik sürelerde orantılı olarak hesaplanır. Nasıl kaydedilir: hesaplanan ek gün sayısı sigortalının prim ödeme gün sayısına eklenerek kayıt altına alınır.","desen":"Sınav genelde fiili çalışma şartının hangi sigortalılarda aranmadığını (tablonun 10 ve 13-14 numaralı sıraları) karıştırarak sorar. Diğer bir tuzak, 360 günden eksik sürede zammın orantılı değil tam hesaplanacağı yanılgısıdır. Bu soru m.40 fıkra 1 ve ek cümle noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Sigortalının kapsamdaki işte gerçekten çalışması ve riske maruz kalması zorunluluğu","ad":"Fiili çalışma şartı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tam yıl çalışma karşılığı belirlenen ek gün sayısının hesaplanma temeli","ad":"360 gün oranı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"360 günlük çalışmadan sonra prim gün sayısına katılacak, toplam süreyi artıran ilave gün miktarı","ad":"Eklenecek gün sayısı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Birden fazla kapsama girenlerde yalnız en fazla gün sağlayan bendin uygulanması kuralı","ad":"En yüksek bent uygulaması","kim":"kanun sabitler"}],"sinavda":"Sigortalının çalıştığı işyeri ve süre verilir, hangi ifadenin doğru olduğu istenir.","panel_ornek":"Bir markette çalışan arkadaşın her 12 ayda bir 1 gün ekstra izin kazandığını düşün, yani çalıştığı süreye orantılı bonus birikiyor. 6 ay çalışırsa yarım gün, tam yıl çalışırsa tam gün kazanır. Fiili hizmet süresi zammı da böyle çalışılan süreyle orantılı ekleme yapar.","ornek":"Bir markette çalışan arkadaşın her 12 ayda bir 1 gün ekstra izin kazandığını düşün, yani çalıştığı süreye orantılı bonus birikiyor. 6 ay çalışırsa yarım gün, tam yıl çalışırsa tam gün kazanır. Fiili hizmet süresi zammı da böyle çalışılan süreyle orantılı ekleme yapar.","yontemler":"Kritik kural, fiilen çalışma ve riske maruz kalma şartının sadece tablonun 10, 13 ve 14 numaralı sıralarında aranmamasıdır.","nedir":"Fiili hizmet süresi zammı, riskli işlerde çalışanların prim gün sayısına ek gün eklenmesini sağlayan bir uygulamadır. Sınav bu ek günlerin hangi şarta bağlı olduğunu ve nasıl hesaplandığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Ters Okuma Tuzağı","metin":"Öğrenci ek cümledeki istisnayı tersine okuyup eğitim-kurs süresinde şart arandığını sanır. Doğrusu: Ek cümle (10) numaralı sıradaki sigortalılar için eğitim, kurs süresinde de fiilen çalışma ve risk şartı aranmayacağını düzenler."},"A":{"ad":"Fiilen Çalışma Şartı Tuzağı","metin":"Öğrenci genel kuralı (fiilen çalışma ve risklere maruz kalma şartı) tüm sigortalılara uygulanır sanır. Doğrusu: Kanun tablonun (13) numaralı sırasında yer alan Türk Silahlı Kuvvetleri personelini bu şarttan açıkça istisna tutmuştur, onlar için ayrıca fiilen risklere maruz kalma aranmaz."},"D":{"ad":"Toplama Tuzağı","metin":"Öğrenci birden fazla bende girmeyi, gün sayılarının toplanacağı şeklinde yorumlar. Doğrusu: Kanun birden fazla bende dahil olanlar için yalnızca en yüksek gün sayısını öngören bendin uygulanacağını belirtir, toplama yapılmaz."},"B":{"ad":"İstisnanın Kapsamını Genişletme Tuzağı","metin":"Öğrenci, hafta tatili gibi sürelerde şart aranmaması istisnasının tüm işkolları için geçerli olduğunu sanır. Doğrusu: Bu istisna yalnız tablonun (10) numaralı sırasındaki yer altı işlerinde çalışanlar için tanınmıştır, çimento fabrikası (4. sıra) bu istisnanın dışındadır."}},"celdiriciYol":{},"hap":"Fiili hizmet süresi zammında genel şart fiilen çalışma ve risklere maruz kalmadır; (13)-(14) sıraları bu şarttan tamamen, (10) sırası ise sayılan izin/tatil sürelerinde bu şarttan istisnadır ve birden fazla bende girenlere en yüksek bent uygulanır.","teshis":{"C":{"gercek":"Ek cümle açıkça eğitim, kurs, iş öncesi-sonrası hazırlık sürelerinde de fiilen çalışma ve risk şartı aranmayacağını söyler.","ayirt":"Madde metni bu süreyi \u0027şart aranır\u0027 mı yoksa \u0027şart aranmaz\u0027 listesine mi koymuş?","paragraf":"5510 s.K. m.40, ek cümle (6552/42 md.)","yanilgi":"Ek cümleyi tersine yorumlayıp eğitim-kurs süresinde şart arandığını sanıyorsun."},"E":{"gercek":"Ek cümle (10) numaralı sıradaki sigortalının yıllık ücretli izin süresini açıkça şartsız istisna kapsamına alır.","ayirt":"Sigortalı tablonun 10. sırasında mı ve süre ek cümlede sayılan sürelerden biri mi?","paragraf":"5510 s.K. m.40, ek cümle (6552/42 md.)","yanilgi":"Bu istisnanın da genel şarta tabi olduğunu düşünüp bu şıkkı elersin."},"A":{"gercek":"Madde 40, tablonun (13) ve (14) numaralı sıralarındaki sigortalıları bu şarttan açıkça hariç tutar.","ayirt":"Bu sigortalı tablonun 13 veya 14 numaralı sırasında mı, yoksa genel kural mı geçerli?","paragraf":"5510 s.K. m.40/1","yanilgi":"Fiilen çalışma ve risklere maruz kalma şartının istisnasız her sigortalıya uygulandığını sanıyorsun."},"D":{"gercek":"Kanun \u0027en yüksek olan bentten fiilî hizmet süresi zammı uygulanır\u0027 der, toplama değil seçim esastır.","ayirt":"Madde \u0027toplanır\u0027 mı diyor yoksa \u0027en yüksek olan\u0027 mı diyor?","paragraf":"5510 s.K. m.40/1, son fıkra","yanilgi":"Birden fazla bende girmenin gün sayılarını toplayarak zam getireceğini sanıyorsun."},"B":{"gercek":"Bu istisna yalnızca 6552/42 md. ile eklenen cümle uyarınca tablonun (10) numaralı sırası (yer altı işleri) için tanınmıştır.","ayirt":"Bu istisna hangi sıra numarasına özgü, sigortalı o sırada mı yer alıyor?","paragraf":"5510 s.K. m.40, ek cümle (6552/42 md.)","yanilgi":"İzin/tatil sürelerinde şart aranmaması istisnasının tüm işkollarına uygulandığını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 107"},"kural":"4857 sayılı İş Kanunu m.6 uyarınca devirden önce doğmuş ve devir
