azıyor, yoksa \u0027tamamından sorumludur\u0027 mu?","paragraf":"İş K. m.36/1","yanilgi":"İdarenin işçi alacaklarından sınırsız sorumlu olduğunu, üç aylık sınırın idarenin lehine değil işçinin lehine mutlak koruma sağladığını sanıyorsun."},"E":{"gercek":"İş Kanunu m.36/1 son cümlesi, müteahhidin teminat ve hakedişleri üzerindeki haciz ve devir işlemlerinin işçi ücret alacaklarını karşılayacak kısım ayrıldıktan sonra kalan kısım üzerinde hüküm ifade edeceğini belirtir.","ayirt":"Hüküm \u0027ayrıldıktan sonra kalan kısım üzerinde\u0027 mi diyor, yoksa \u0027derhal\u0027 mi diyor?","paragraf":"İş K. m.36/1","yanilgi":"Haciz ve icra takibinin işçi alacağı ayrılmaksızın derhal uygulanabileceğini düşünüyorsun."},"A":{"gercek":"4447 sayılı Kanunun 50 nci maddesi işsizlik ödeneğini haciz ve temlikten korur ancak nafaka borçlarını açıkça istisna tutar.","ayirt":"Kanun \u0027dışında\u0027 kelimesini kullanmış mı, yoksa mutlak bir yasak mı koymuş?","paragraf":"4447 s.K. m.50/2","yanilgi":"İşsizlik ödeneğinin haciz karşısında mutlak dokunulmaz olduğunu, nafaka borcunun da bu korumaya dahil olduğunu sanıyorsun."},"D":{"gercek":"İş Kanunu m.36/2 üç aylık dönemin icra kararının alındığı tarihten ÖNCEKİ döneme göre belirleneceğini düzenler.","ayirt":"Üç aylık süre icra kararından önceye mi, sonraya mı bakıyor?","paragraf":"İş K. m.36/2","yanilgi":"Üç aylık dönemin haczin uygulandığı andan ileriye doğru hesaplandığını sanıyorsun."},"B":{"gercek":"4447 sayılı Kanunun ek 6 ncı maddesi, Esnaf Ahilik Sandığı ödeneğinin nafaka borçları dışında haciz veya devir-temlike konu edilemeyeceğini düzenler.","ayirt":"Hüküm, işsizlik ödeneğine ilişkin m.50/2 ile aynı istisna yapısını mı taşıyor?","paragraf":"4447 s.K. ek m.6/5","yanilgi":"Bu hükmü ezbere bilmediğin için başka bir maddedeki benzer ifadeyle karıştırıp elemiş olabilirsin."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":null,"kural":"4447 sayılı Kanunun 50 nci maddesine göre işsizlik ödeneği nafaka borçları dışında haciz veya başkasına devir ve temlik edilemez.","olcum":{"pencere":7,"hesapKod":0,"capa":"","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Hiçbir şekilde\u0027, \u0027her türlü vergi\u0027 gibi mutlaklık bildiren ifadeler gördüğünde kanunda mutlaka bir istisna cümlesi olup olmadığını ara.","konu":"haciz sınırı","tablo":{"satirlar":[["A) İşsizlik ödeneği, nafaka borçları dışında haciz veya baş…","4447 s.K. m.50 fıkra 2","doğru ifade"],["B) İşsizlik ödeneği, nafaka borçları da dahil olmak üzere h…","4447 s.K. m.50 fıkra 2","YANLIŞ ifade"],["C) İşsizlik ödeneği damga vergisi dahil olmak üzere hiçbir …","4447 s.K. m.50 fıkra 2","YANLIŞ ifade"],["D) İşsizlik ödeneği, nafaka borçları dışında haczedilemez; …","4447 s.K. m.50 fıkra 2","YANLIŞ ifade"],["E) Esnaf Ahilik Sandığı ödeneği, nafaka borçları da dahil o…","4447 s.K. ek m.6 fıkra 5","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşsizlik ödeneği damga vergisi dahil olmak üzere hiçbir vergi ve kesintiye tabi tutulmaz.","E":"Esnaf Ahilik Sandığı ödeneği, nafaka borçları da dahil olmak üzere haciz veya devir ve temlik edilemez.","A":"İşsizlik ödeneği, nafaka borçları dışında haciz veya başkasına devir ve temlik edilemez.","D":"İşsizlik ödeneği, nafaka borçları dışında haczedilemez; ancak başkasına devir ve temlik edilebilir.","B":"İşsizlik ödeneği, nafaka borçları da dahil olmak üzere hiçbir şekilde haczedilemez."},"kaynak":{"alinti":"","liste":[{"ad":"4447 s. İşsizlik Sig. K. m.50 [2/4]","metin":"(Ek cümle: 28/11/2017-7061/55 md.) Ödeme tarihini öne çekmeye Çalışma ve Sosyal Güvenlik Bakanı yetkilidir. İşsizlik ödeneği damga vergisi hariç herhangi bir vergi ve kesintiye tabi tutulmaz. İşsizlik ödeneği, nafaka borçları dışında haciz veya başkasına devir ve temlik edilemez. Sigortalının kusurundan kaynaklandığı belirlenen fazla ödemeler yasal faizi ile birlikte geri alınır.(Ek cümle: 15/5/2008-5763/15 md.) Ölen sigortalı işsizlere ait fazla ödemeler geri tahsil edilmez. (Ek cümle: 10/9/2014-6552/25 md.) 22/5/2003 tarihli ve 4857 sayılı İş Kanununun 21 inci maddesi gereği işe iade davası nedeniyle yatırılan primlerin son günü esas alınarak işsizlik ödeneği hak sahipliği belirlenir ve işsiz geçen dönem için ödeme yapılır.15 Sigortalı, işsizlik ödeneğinden yararlanma süresini doldurmadan tekrar işe girer ve işsizlik sigortası ödeneğinden yararlanmak için bu Kanunun öngördüğü şartları yerine getiremeden yeniden işsiz kalırsa, daha önce hakettiği işsizlik ödeneği süresini dolduruncaya kadar bu haktan yararlanmaya devam eder. Bu Kanunun öngördüğü şartları yerine getirmek suretiyle yeniden işsiz kalınması halinde ise sadece bu yeni hak sahipliğinden doğan süre kadar işsizlik ödeneği ödenir."},{"ad":"4447 s. İşsizlik Sig. K. ek m.6 [5/6]","metin":"Esnaf Ahilik Sandığı ödeneği, nafaka borçları dışında haciz veya başkasına devir ve temlik edilemez. Sigortalı, Esnaf Ahilik Sandığı ödeneğinden yararlanma süresini doldurmadan tekrar faaliyetine başlar ve Esnaf Ahilik Sandığı ödeneğinden yararlanmak için bu maddenin öngördüğü şartları yerine getiremeden yeniden faaliyetine son verirse, daha önce hakettiği Esnaf Ahilik Sandığı ödeneği süresini dolduruncaya kadar bu haktan yararlanmaya devam eder. Bu maddenin öngördüğü şartları yerine getirmek suretiyle yeniden faaliyetin son bulması hâlinde ise sadece bu yeni hak sahipliğinden doğan süre kadar Esnaf Ahilik Sandığı ödeneği ödenir. Esnaf Ahilik Sandığı sigortalılarından iflas istemiyle mahkemeye başvurulmuş olmak suretiyle veya iflasa tabi olmamakla birlikte işyerini kapatmak suretiyle sigortalılığı sona erenler, sigortalılığının sona erdiği tarihi izleyen günden itibaren otuz gün içinde Kuruma doğrudan veya elektronik ortamda başvurarak yeni bir iş almaya hazır olduklarını kaydettirmeleri, bu maddede yer alan prim ödeme koşullarını sağlamış olmaları ve Esnaf Ahilik Sandığı primi ve bu prime ilişkin herhangi bir borcunun olmaması kaydıyla Esnaf Ahilik Sandığı ödeneği almaya hak kazanırlar. Ancak sigortalılığının sona ermesinden önceki en fazla 90 günlük süreye ilişkin Esnaf Ahilik Sandığı prim borcu olan sigortalılar, bu maddede sayılan diğer şartları sağlamaları ve bu döneme ilişkin Esnaf Ahilik Sandığı prim borçlarının alacakları ödenekten tahsil edilmesi kaydıyla Esnaf Ahilik Sandığı ödeneğinden faydalandırılır."}],"hakem":"Soru, 4447 sayılı İşsizlik Sigortası Kanunu m.50/2\u0027de açıkça yer alan işsizlik ödeneğinin haczi ve devrinin yasağını ve nafaka borçları istisnasını ölçmektedir; tüm denetim kapıları geçmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Damga vergisini diğer vergilerle karıştırırsın; oysa kanun işsizlik ödeneğini damga vergisinden muaf tutmamış, sadece diğer vergi ve kesintilerden muaftır.","E":"Esnaf Ahilik Sandığı ödeneğinin farklı kural altında olduğunu düşünüp nafaka istisnasını unutursun; oysa her iki ödenek için de nafaka istisnası aynı şekilde geçerlidir.","D":"Haciz yasağı ile devir yasağını ayrı kurallar sanırsın; oysa kanun bunları aynı cümlede aynı istisnayla (nafaka) birlikte düzenler, ikisi de nafaka dışında yasaktır.","B":"Nafaka borçlarını da yasağa dahil edersin oysa kanun açıkça nafakayı istisna tutmuş, nafaka alacaklıları işsizlik ödeneğini haczettirebilir."},"dogru":"İşsizlik ödeneği, nafaka borçlarına karşı hacziyle tahsil edilebilir ama başkasına devrilemez. Nafaka dışında herkes için haciz ve devir tamamen yasaktır.","sinav":"4447 sayılı İşsizlik Sigortası Kanunu 50. madde.","kavramlar":[]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"4447 sayılı İşsizlik Sigortası Kanunu uyarınca işsizlik ödeneğinin haczi ve devri konusunda aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-26","verilenler":[],"dayanak":"4447 sayılı İşsizlik Sigortası Kanunu m.50/2","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Merve İşsizlik Sigortası Fonundan 4.200 lira işsizlik ödeneği alıyor. Eski işvereni 2.500 liralık bir alacak için icra dairesine başvuruyor, ayrıca Merve bu parayı kardeşine devretmek istiyor. Aynı ay nafaka alacaklısı eski eşi de icra dairesine dilekçe veriyor.","anlatim":"Üç kişi aynı parayı istiyor: işveren, kardeş, nafaka alacaklısı eski eş. Kanun bu üçüne aynı cevabı vermiyor.","doldur":[]},{"formul":"Ne yapacağız: 4447 sayılı Kanun madde 50 fıkra 2\u0027ye göre işsizlik ödeneği nafaka borçları dışında haciz veya devir ve temlik edilemez, damga vergisi hariç vergiye tabi tutulmaz. Şimdi beş ifadeyi Merve\u0027nin olayında tek tek deneyeceğiz.","anlatim":"Kural tek cümlede iki yasağı (haciz ve devir-temlik) birlikte söylüyor, istisna sadece nafaka. Beş şıkkı bu tek kuralla test edeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"4447 s.K. m.50 fıkra 2","karar":"doğru","anlatim":"İşveren için haciz yasak, eski eş için nafaka istisnası devreye girer ve haciz mümkün olur. Kardeşe devir de yasaktır çünkü istisna sadece nafaka için tanınmış.","formul":"Şık A: eski işveren icra yoluyla parayı haczetmek istiyor ama nafaka alacaklısı eski eş de aynı yolu kullanıyor, kural ikisine de aynı mı cevap veriyor?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"4447 s.K. m.50 fıkra 2","karar":"yanlış","anlatim":"Kanun nafaka borçlarını yasağın dışında tutuyor, yani nafaka için haciz mümkün. Eski eş yanılıyor, mutlak yasak yok.","formul":"Şık B: Merve\u0027nin eski eşi \u0027nafaka borcu var diye hiç haciz koyduramam\u0027 diye düşünüyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"4447 s.K. m.50 fıkra 2","karar":"yanlış","anlatim":"Kanun damga vergisini hariç tutmuş, sadece diğer vergi ve kesintilerden muafiyet var. Muhasebeci yanlış söylüyor, damga vergisi kesilir.","formul":"Şık C: Merve\u0027nin muhasebecisi \u0027ödenekten damga vergisi de kesilmez\u0027 diyor, katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"4447 s.K. m.50 fıkra 2","karar":"yanlış","anlatim":"Kanun haciz ile devir ve temliki aynı cümlede, aynı istisnayla birlikte yasaklıyor. Kardeşin parayı alması mümkün değil, arkadaşı yanılıyor.","formul":"Şık D: kardeşe devir konusunda \u0027haciz olmaz ama devir serbesttir\u0027 diyen bir arkadaşı var, buna göre kardeş parayı alabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"4447 s.K. ek m.6 fıkra 5","karar":"yanlış","anlatim":"Ek madde 6 fıkra 5, işsizlik ödeneğiyle aynı formülü kullanıyor: nafaka dışında haciz ve devir yasak. Komşunun koruması Merve\u0027den farklı ve daha geniş değil, aynı.","formul":"Şık E: Merve\u0027nin esnaf olan komşusu Esnaf Ahilik Sandığı ödeneği alıyor, onun ödeneği için kural daha mı geniş bir koruma sağlıyor?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Merve\u0027nin parası tek bir kapıdan çıkar: nafaka. Kendine sor, cümledeki istisna hem haciz hem devir-temlik için mi geçerli?","doldur":[]}],"anahtar":[{"ornek":"nafaka","kok":"nafaka"},{"ornek":"istisna","kok":"istisn"},{"ornek":"temlik","kok":"temlik"},{"ornek":"dışında","kok":"dışınd"},{"ornek":"ödeneği","kok":"ödeneğ"},{"ornek":"borçları","kok":"borçla"}],"konuGiris":{"harita":"Ne zaman haciz uygulanır: sadece nafaka borcu söz konusu olduğunda. Nasıl ölçülür: ödeneğin haczedilebilir olup olmadığı kanun maddesindeki istisna listesiyle belirlenir. Nasıl kaydedilir: kural \u0027haciz ve devir edilemez, nafaka hariç\u0027 cümlesiyle sabittir.","desen":"Soru genelde \u0027haciz edilemez\u0027 ifadesini mutlaklaştırıp nafaka istisnasını unutturmaya çalışır. Şıklarda \u0027hiçbir şekilde haczedilemez\u0027 ile \u0027nafaka hariç haczedilemez\u0027 karıştırılır. Bu soru m.50/2 fıkrasındaki nafaka istisnası noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"işini kaybedene belirli süre ödenen nakdi destek","ad":"işsizlik ödeneği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"alacaklının ödeneğe el koyamamasının tek istisnası: nafaka borcu","ad":"haciz istisnası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"ödeneğin başkasına hak olarak devredilememesi kuralı","ad":"devir ve temlik yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"kusurlu sigortalıya yapılan fazla ödemenin yasal faiziyle geri alınması","ad":"fazla ödeme geri alımı","kim":"kanun sabitler"}],"sinavda":"Soruda işsizlik ödeneğinin haciz ve devrine ilişkin kural verilir, doğru istisnayı içeren şık istenir.","panel_ornek":"Bir arkadaşının burs parası var, kredi kartı borcundan dolayı bankalar bu paraya el koyamaz; ama çocuğuna nafaka ödemesi gerekiyorsa oradan kesinti yapılabilir. Yani koruma mutlak değil, tek bir kapı açık bırakılmış.","ornek":"Bir arkadaşının burs parası var, kredi kartı borcundan dolayı bankalar bu paraya el koyamaz; ama çocuğuna nafaka ödemesi gerekiyorsa oradan kesinti yapılabilir. Yani koruma mutlak değil, tek bir kapı açık bırakılmış.","yontemler":"Metni ezbere değil \u0027nafaka hariç\u0027 ifadesiyle birlikte hatırla; tek istisna dışında hiçbir hal haciz veya devre izin vermez.","nedir":"Haciz sınırı, işsizlik ödeneği gibi devlet desteklerinin alacaklılardan korunma derecesini gösterir. Sınav bu korumanın istisnasız mı yoksa sınırlı mı olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Vergi İstisnası Karıştırma Tuzağı","metin":"\u0027herhangi bir vergiye tabi değildir\u0027 ifadesini damga vergisini de kapsayacak şekilde genişletirsin. Doğrusu: kanun damga vergisini istisna dışında bırakmış, işsizlik ödeneği yalnız damga vergisi hariç diğer vergi ve kesintilerden muaftır."},"E":{"ad":"Madde Karıştırma Tuzağı","metin":"Esnaf Ahilik Sandığı ödeneği için de aynı istisnanın geçerli olduğunu bilip bu kez nafaka istisnasını yanlışlıkla kaldırırsın. Doğrusu: ek 6 ncı maddeye göre Esnaf Ahilik Sandığı ödeneği de nafaka borçları DIŞINDA haciz veya devir ve temlik edilemez, nafaka her iki ödenek için de istisnadır."},"D":{"ad":"Parçalama Tuzağı","metin":"haciz yasağı ile devir-temlik yasağını birbirinden bağımsız kurallarmış gibi ayırırsın. Doğrusu: kanun metninde haciz ile devir ve temlik yasağı aynı cümlede birlikte, aynı istisnayla (nafaka borçları) düzenlenmiştir."},"B":{"ad":"Kapsam Genişletme Tuzağı","metin":"nafaka borçları istisnasını yok sayıp yasağı mutlak sanırsın. Doğrusu: kanun nafaka borçlarını açıkça istisna tutmuştur, bu borçlar için haciz mümkündür."}},"celdiriciYol":null,"hap":"İşsizlik ödeneği ve Esnaf Ahilik Sandığı ödeneği, nafaka borçları dışında haciz veya başkasına devir ve temlik edilemez.","teshis":{"C":{"gercek":"Kanun \u0027damga vergisi hariç herhangi bir vergi ve kesintiye tabi tutulmaz\u0027 der; damga vergisi ayrık tutulmuştur.","ayirt":"Cümlede \u0027hariç\u0027 kelimesi hangi vergiyi dışarıda bırakıyor?","paragraf":"4447 s.K. m.50 fıkra 2","yanilgi":"Vergi istisnasını haciz istisnasıyla aynı kapsamda düşünüp damga vergisini de muafiyete dahil edersin."},"E":{"gercek":"Ek 6 ncı madde işsizlik ödeneğiyle aynı formülü kullanır: nafaka borçları dışında haciz veya devir ve temlik edilemez.","ayirt":"İki ödenek türü için de kanun aynı istisna ibaresini mi kullanıyor?","paragraf":"4447 s.K. ek m.6 fıkra 5","yanilgi":"Esnaf Ahilik Sandığı ödeneğinin işsizlik ödeneğinden farklı, daha geniş bir haciz yasağına tabi olduğunu sanırsın."},"A":{"gercek":"4447 s.K. m.50/2 tek cümlede hem haczi hem devir ve temliki nafaka borçları dışında yasaklar.","ayirt":"İstisna, cümledeki her iki yasak türü için de mi geçerli?","paragraf":"4447 s.K. m.50 fıkra 2","yanilgi":"Bu şıkkı elerken nafaka istisnasının parçalarından birine (haciz veya devir-temlik) uygulanmayacağını düşünürsün."},"D":{"gercek":"Kanun metninde haciz ile devir ve temlik aynı istisnayla (nafaka borçları) birlikte yasaklanmıştır, biri diğerinden bağımsız değildir.","ayirt":"Kanun cümlesinde \u0027veya\u0027 bağlacı iki yasağı mı ayırıyor yoksa ikisini de mi kapsıyor?","paragraf":"4447 s.K. m.50 fıkra 2","yanilgi":"Haciz yasağının devir-temlik yasağından ayrı, daha dar bir kural olduğunu sanırsın."},"B":{"gercek":"Kanun açıkça \u0027nafaka borçları dışında\u0027 ibaresiyle bir istisna tanımlar; nafaka alacaklıları için haciz mümkündür.","ayirt":"Metinde bir istisna ibaresi var mı, onu yok mu saydım?","paragraf":"4447 s.K. m.50 fıkra 2","yanilgi":"Nafaka borçlarının kanunda ayrıca istisna sayıldığını gözden kaçırıp yasağı mutlak sanırsın."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 110"},"kural":"4857 sayılı İş Kanunu m.36/2 gereği bu haciz, icra kararının alındığı tarihten önceki üç aylık dönemdeki işçi ücret alacaklarını karşılayacak kısım ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 110","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İş Kanunu m.36\u0027da art arda gelen iki fıkrayı (hakediş haczi / işyeri malı haczi) karıştırma; her fıkranın kendi ölçüt tarihini ayrı tut.","konu":"haciz sınırı","tablo":{"satirlar":[["A) Haciz, icra kararının alındığı tarihten önceki altı aylı…","m.36/2","YANLIŞ ifade"],["B) Haciz, ilgili hakediş döneminin başlangıcından itibaren …","m.36/1-2","YANLIŞ ifade"],["C) İşyerinde bulunan tesisat, malzeme ve diğer kıymetler üz…","m.36/2","YANLIŞ ifade"],["D) Haciz ve icra takibinde öncelik üçüncü kişinin alacağına…","m.36/2","YANLIŞ ifade"],["E) Haciz, icra kararının alındığı tarihten önceki üç aylık …","m.36/2","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşyerinde bulunan tesisat, malzeme ve diğer kıymetler üzerinde bu nedenle haciz ve icra takibi hiçbir şekilde uygulanamaz.","E":"Haciz, icra kararının alındığı tarihten önceki üç aylık dönemdeki işçi ücret alacaklarını karşılayacak kısım ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder.","A":"Haciz, icra kararının alındığı tarihten önceki altı aylık dönemdeki işçi ücret alacaklarını karşılayacak kısım ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder.","D":"Haciz ve icra takibinde öncelik üçüncü kişinin alacağına tanınır; işçi ücret alacakları ancak bu tutar karşılandıktan sonra kalan kısımdan ödenir.","B":"Haciz, ilgili hakediş döneminin başlangıcından itibaren geçen üç aylık ücret alacaklarını karşılayacak kısım ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.36 [1/2]","metin":"Madde 36 - Genel ve katma bütçeli dairelerle mahalli idareler veya kamu iktisadi teşebbüsleri yahut özel kanuna veya Cumhurbaşkanlığı kararnamesine dayanılarak kurulan banka ve kuruluşlar; asıl işverenler müteahhide verdikleri her türlü bina, köprü, hat ve yol inşası gibi yapım ve onarım işlerinde çalışan işçilerden müteahhit veya taşeronlarca ücretleri ödenmeyenlerin bulunup bulunmadığının kontrolü, ya da ücreti ödenmeyen işçinin başvurusu üzerine, ücretleri ödenmeyen varsa müteahhitten veya taşeronlardan istenecek bordrolara göre bu ücretleri bunların hakedişlerinden öderler.14 Bunun için hakediş ödeneceği ilgili idare tarafından işyerinde şantiye şefliği işyeri ilân tahtası veya işçilerin toplu bulunduğu yerler gibi işçilerin görebileceği yerlere yazılı ilân asılmak suretiyle duyurulur. Ücret alacağı olan işçilerin her hakediş dönemi için olan ücret alacaklarının üç aylık tutarından fazlası hakkında adı geçen idarelere herhangi bir sorumluluk düşmez. Anılan müteahhitlerin bu işverenlerdeki her çeşit teminat ve hakedişleri üzerinde yapılacak her türlü devir ve el değiştirme işlemleri veya haciz ve icra takibi bu işte çalışan işçilerin ücret alacaklarını karşılayacak kısım ayrıldıktan sonra, kalan kısım üzerinde hüküm ifade eder. Bir işverenin üçüncü kişiye karşı olan borçlarından dolayı işyerinde bulunan tesisat, malzeme, ham, yarı işlenmiş ve tam işlenmiş mallar ve başka kıymetler üzerinde yapılacak haciz ve icra takibi, bu işyerinde çalışan işçilerin icra kararının alındığı tarihten önceki üç aylık dönem içindeki ücret alacaklarını karşılayacak kısım ayrıldıktan sonra, …"},{"ad":"İş K. (4857 s.K.) m.36 [2/2]","metin":"(Değişik beşinci fıkra: 10/9/2014-6552/3 md.) İşverenler, alt işverene iş vermeleri 2/7/2018 tarihli ve 700 sayılı KHK’nin 145 inci maddesiyle, bu fıkrada yer alan “özel kanunla verilmiş yetkiye” ibaresi “Cumhurbaşkanlığı kararnamesine” şeklinde değiştirilmiştir. 14 hâlinde, bunların işçilerinin ücretlerinin ödenip ödenmediğini işçinin başvurusu üzerine veya aylık olarak resen kontrol etmekle ve varsa ödenmeyen ücretleri hak edişlerinden keserek işçilerin banka hesabına yatırmakla yükümlüdür. Ücret hesap pusulası"}],"hakem":"Soru 4857 sayılı İş Kanunu m.36/2\u0027de yer alan haciz sınırı kuralını doğru olarak sordukları için ve E seçeneği kaynaktaki hükümle birebir uyumludur."},"kayitlar":[],"sade":{"siklar":{"C":"Haciz tamamen yasak değildir; işçi ücretleri karşılandıktan sonraki kısmı haczedilebilir.","A":"Altı aylık süresi kanunda yazılı değildir; kanun açıkça üç aylık dönemi esas alır.","D":"Öncelik işçi ücret alacağında olmalıdır; üçüncü kişinin alacağı ancak kalan kısımdan karşılanır.","B":"Hacediş dönemi ölçütü müteahhit-taşeron hakeditşine özgüdür; üçüncü kişi borcu haczinde ölçüt icra kararı tarihi olmalıdır."},"dogru":"İşverenin başka birine olan borcu nedeniyle işyeri malları üzerinde haciz yapılabilir, ancak önce işçilerin haciz tarihinden önceki üç aylık ücret alacakları ayrılmalı, geriye kalan kısmı ödeyebilir.","sinav":"İş Kanunu 36. madde gereği, işverenin üçüncü kişiye olan borçlarından dolayı işyeri malları üzerinde yapılan haciz, işçilerin icra kararının alındığı tarihten önceki üç aylık dönemdeki ücret alacaklarını karşılayacak kısım ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder.","kavramlar":[{"kaynak":"İş Kanunu 36. madde","tanim":"İşçinin işveren tarafından ödenmesi gereken ve kanunla korunan para alacağıdır.","ad":"işçi ücret alacağı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"4857 sayılı İş Kanununa göre, işverenin üçüncü kişiye olan borcundan dolayı işyerinde bulunan tesisat, malzeme ve diğer kıymetler üzerinde yapılacak haciz ve icra takibine ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t2-issgk-cokzor/kp-15","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.36 fıkra 2","dogru":"E","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir dokuma atölyesinin sahibi, kumaş tedarikçisine olan 80.000 TL borcunu ödeyemeyince, tedarikçi 15 Mart 2024\u0027te icra kararı çıkarttırıp atölyedeki dokuma tezgâhlarına haciz koyduruyor.","anlatim":"Atölyede çalışan 4 işçinin ücret alacağı var, tedarikçi ise tezgâhları satıp parasını almak istiyor.","doldur":[]},{"formul":"Ne yapacağız: İş Kanunu m.36/2, icra kararı tarihi olan 15 Mart 2024\u0027ten önceki üç aylık işçi ücret alacağı ayrılmadan tezgâhlar üzerindeki haczin hüküm ifade etmeyeceğini söylüyor; beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.36/2","karar":"yanlış","anlatim":"Atölyede süre altı ay değil üç aydır, sen bunu altı ayla karıştırırsan işçiye gereğinden fazla, tedarikçiye gereğinden az pay ayırırsın. Kanun metni net biçimde üç aylık dönemden söz eder.","formul":"Şık A: birisi sana \u0027icra kararından önceki altı aylık işçi ücreti ayrılsın, gerisi haczedilsin\u0027 diyor, bu doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.36/1-2","karar":"yanlış","anlatim":"Burada ölçüt hakediş dönemi değil, icra kararının alındığı tarihtir; tezgâhlar hakediş değil işyeri malıdır. Bu şık, m.36\u0027nın başka bir fıkrasındaki hakediş haczi kuralını buraya taşır.","formul":"Şık B: birisi \u0027hakediş döneminin başından itibaren üç aylık ücret ayrılsın\u0027 diyor, kabul eder misin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.36/2","karar":"yanlış","anlatim":"Haciz tamamen yasak değildir, sadece işçi payı ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder. Tedarikçi tezgâhlara haciz koydurabilir, yeter ki üç aylık ücret payı ayrılmış olsun.","formul":"Şık C: müdür \u0027tezgâhlara hiç haciz konamaz, işçi tam korunur\u0027 diyor, sen ne dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.36/2","karar":"yanlış","anlatim":"Kanun tam tersini söyler; önce işçinin üç aylık ücret alacağı ayrılır, tedarikçi ancak kalan kısımdan alacağını alır. Öncelik işçidedir, tedarikçide değil.","formul":"Şık D: tedarikçi \u0027önce ben alırım, işçiye kalan varsa o alsın\u0027 diyor, haklı mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.36/2","karar":"doğru","anlatim":"Evet, kanun tam olarak bunu söyler; ölçüt icra kararı tarihi, süre üç aydır. Tezgâhların satılabilecek kısmı bu ayırmadan sonra kalan kısımdır.","formul":"Şık E: avukat \u0027icra kararı tarihinden önceki üç aylık ücret ayrılsın, kalan kısım haczedilsin\u0027 diyor, bu doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Doğru cevap E\u0027dir çünkü ölçüt icra kararı tarihi ve süre üç aydır. Kendine hep şunu sor: bu fıkra hakediş mi, yoksa işyerindeki mal varlığı mı üzerindeki haczi düzenliyor?","doldur":[]}],"anahtar":[{"ornek":"tedarikçi","kok":"tedari"},{"ornek":"kararı","kok":"kararı"},{"ornek":"üzerindeki","kok":"üzerin"},{"ornek":"alacağı","kok":"alacağ"},{"ornek":"hakediş","kok":"hakedi"},{"ornek":"gereği","kok":"gereği"}],"konuGiris":{"harita":"Ne zaman test edilir: işveren üçüncü kişiye borçlu olup işyerindeki eşyası haczedilince. Nasıl ölçülür: icra kararından önceki üç aylık işçi ücret alacağı ayrılıp ayrılmadığına bakılır. Nasıl kaydedilir: haciz, ücret alacağı düşüldükten sonra kalan kısım üzerinde hüküm ifade eder.","desen":"Sınav genellikle haczin tamamının mı yoksa kalan kısmının mı geçerli olduğunu karıştırtmak için seçenek üretir. Tuzak, üç aylık sürenin icra kararı öncesine mi sonrasına mı ait olduğunu değiştirmektir; bu nokta m.36 fıkra 4\u0027ten gelir. Bu soru işçi alacağının haciz karşısındaki önceliği noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İşçi ücretinin korunduğu, haczin ancak kalanı kapsadığı sınır","ad":"Haciz sınırı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"İcra kararından önceki üç aya ait ödenmemiş işçi ücreti","ad":"Üç aylık ücret alacağı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Tesisat, malzeme, ham ve işlenmiş mallar gibi haczedilebilir varlıklar","ad":"İşyerindeki kıymetler","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"sen hesaplarsın","tanim":"Ücret alacağı ayrıldıktan sonra haczin geçerli olduğu bölüm","ad":"Kalan kısım","kim":"kanun sabitler"}],"sinavda":"Soru, işverenin borcu nedeniyle haczedilen işyeri kıymetleri karşısında işçi ücret alacağının durumunun ne olduğunu sorar.","panel_ornek":"Bir arkadaşının kirada oturduğu evi ev sahibi bankaya borçlu olduğu için icra gelip eşyalarına haciz koyuyor. Ama arkadaşının depozito alacağı önce ayrılıyor, haciz ancak kalan kısım üzerinden geçerli oluyor. Yani önce onun hakkı, sonra icra.","ornek":"Bir arkadaşının kirada oturduğu evi ev sahibi bankaya borçlu olduğu için icra gelip eşyalarına haciz koyuyor. Ama arkadaşının depozito alacağı önce ayrılıyor, haciz ancak kalan kısım üzerinden geçerli oluyor. Yani önce onun hakkı, sonra icra.","yontemler":"Kritik kural, haczin ücret alacağı ayrıldıktan sonraki kalan kısım üzerinde hüküm ifade ettiğini bilmektir; sürenin icra kararından önceki üç ay olduğu unutulmamalıdır.","nedir":"Bu konu, işverenin üçüncü kişiye borcu yüzünden işyerindeki eşyaya konan haczin işçi alacağıyla çakışmasını düzenler. Sınav, haczin hangi kısımdan sonra hüküm ifade edeceğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Kapsam Tuzağı","metin":"Öğrenci maddeyi mutlak bir haciz yasağı sanır. Doğrusu: Haciz tamamen yasak değildir; yalnız işçi ücret alacağını karşılayacak kısım ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder."},"A":{"ad":"Süre Tuzağı","metin":"Öğrenci kanundaki üç aylık sınırı, hakediş kesintilerindeki başka sürelerle karıştırıp altı ay sanır. Doğrusu: Kanun açıkça icra kararının alındığı tarihten önceki ÜÇ aylık dönemi esas alır."},"D":{"ad":"Öncelik Ters Çevirme Tuzağı","metin":"Öğrenci alacaklılar arasındaki önceliği tersine kurar. Doğrusu: Öncelik işçi ücret alacağındadır, üçüncü kişinin alacağı ancak kalan kısımdan karşılanır."},"B":{"ad":"Referans Noktası Tuzağı","metin":"Öğrenci, müteahhit-taşeron hakedişi hükmündeki \u0027hakediş dönemi\u0027 ölçütünü üçüncü kişi borcu haczine taşır. Doğrusu: Bu haciz türünde ölçüt hakediş dönemi değil icra kararının alındığı tarihtir."}},"celdiriciYol":{"C":"Madde \u0027kalan kısım üzerinde hüküm ifade eder\u0027 ibaresi atlanarak mutlak yasak sanılmıştır (kapsam hatası).","A":"Aynı fıkranın süresi \u0027üç ay\u0027 yerine \u0027altı ay\u0027 okunarak kurulmuştur (süre tuzağı).","D":"İşçi ve üçüncü kişi alacaklarının önceliği ters çevrilerek kurulmuştur (taraf ters çevirme).","B":"Bir üstteki fıkradaki hakediş dönemi ölçütü bu fıkraya taşınarak kurulmuştur (referans noktası karışıklığı)."},"hap":"İşverenin üçüncü kişiye borcu nedeniyle işyeri malları üzerindeki haciz, icra kararı tarihinden önceki üç aylık işçi ücret alacağı ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder.","teshis":{"C":{"gercek":"Madde haczi yasaklamaz, yalnız işçi ücret alacağını karşılayacak kısmın ayrılmasını şart koşar; kalan kısım üzerinde haciz hüküm ifade eder.","ayirt":"Madde \u0027haciz yapılamaz\u0027 mı diyor, yoksa \u0027kalan kısım üzerinde hüküm ifade eder\u0027 mi diyor?","paragraf":"İş K. m.36/2","yanilgi":"Kanunun işçiyi koruma amacını, haczin tamamen yasaklanması şeklinde okuyorsun."},"E":{"gercek":"Madde 36/2, işveren-üçüncü kişi ilişkisinde işyerindeki mallar üzerindeki haczi, icra kararı tarihinden önceki üç aylık ücret alacağı ayrıldıktan sonraki kalan kısımla sınırlar.","ayirt":"Fıkra hangi haciz türünü (hakediş mi, işyeri malı mı) ve hangi tarihi (hakediş dönemi mi, icra kararı tarihi mi) esas alıyor?","paragraf":"İş K. m.36/2","yanilgi":"Bu şıkkı eleyen öğrenci, hükmü 36/1\u0027deki hakediş hacziyle aynı zannedip farklı bir süre/ölçüt arar."},"A":{"gercek":"Madde 36/2 açıkça \u0027icra kararının alındığı tarihten önceki üç aylık dönem\u0027 der, altı ay geçmez.","ayirt":"Kanun metninde geçen sayı gerçekten üç mü, yoksa başka bir maddeden mi aklımda kaldı?","paragraf":"İş K. m.36/2","yanilgi":"Üç aylık sınırı başka bir işçi alacağı kurumundaki altı aylık süreyle karıştırıyorsun."},"D":{"gercek":"Koruma işçi ücret alacağına tanınmıştır; üçüncü kişinin haciz hakkı ancak işçi payı ayrıldıktan sonraki kalan kısımla sınırlıdır.","ayirt":"Madde kimin alacağını önceliklendiriyor: işçinin mi, üçüncü kişinin mi?","paragraf":"İş K. m.36/2","yanilgi":"Alacaklılar arasındaki korumanın kime yönelik olduğunu ters kuruyorsun."},"B":{"gercek":"Hakediş üzerindeki haciz (m.36/1) ile üçüncü kişi borcu nedeniyle işyeri malları üzerindeki haciz (m.36/2) farklı referans noktaları taşır; ikincisinde ölçüt icra kararı tarihidir.","ayirt":"Bu fıkra hakediş mi, yoksa işyerindeki fiziki mal varlığı mı üzerindeki haczi düzenliyor?","paragraf":"İş K. m.36/1-2","yanilgi":"Aynı maddenin bir üstteki fıkrasındaki \u0027hakediş dönemi\u0027 ölçütünü, üçüncü kişi borcu haczine de uygulanır sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 87"},"kural":"4857 sayılı İş Kanunu madde 18 uyarınca otuz veya daha fazla işçi çalıştıran işyerinde en az altı aylık kıdemi olan ve belirsiz süreli iş sözleşmesiyle çalışan işçi iş güvencesinden yararlanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 87","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İş güvencesi sorularında üç şartı (işçi sayısı, sözleşme türü, kıdem) birlikte kontrol et; şıklardan biri eksik veya değiştirilmiş olacaktır.","konu":"is güvencesi kapsamı","tablo":{"satirlar":[["A) İşyerinde en az on işçi çalıştıran işverenin işçisi, alt…","m.18/1","YANLIŞ ifade"],["B) İşletmenin bütününü sevk ve idare eden ve işçiyi işe alm…","m.18/1","YANLIŞ ifade"],["C) Otuz veya daha fazla işçi çalıştırılan işyerinde belirsi…","m.18/1","doğru ifade"],["D) Belirli süreli iş sözleşmesiyle çalışan işçi, altı aylık…","m.18/1","YANLIŞ ifade"],["E) Otuz veya daha fazla işçi çalıştırılan işyerinde işe yen…","m.18/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Otuz veya daha fazla işçi çalıştırılan işyerinde belirsiz süreli iş sözleşmesiyle çalışan ve en az altı aylık kıdemi bulunan işçi iş güvencesi hükümlerinden yararlanır","E":"Otuz veya daha fazla işçi çalıştırılan işyerinde işe yeni başlayan ve deneme süresi içinde olan işçi, kıdem şartı aranmaksızın iş güvencesinden yararlanır","A":"İşyerinde en az on işçi çalıştıran işverenin işçisi, altı aylık kıdemi doldurmuşsa iş güvencesi hükümlerinden yararlanır","D":"Belirli süreli iş sözleşmesiyle çalışan işçi, altı aylık kıdem şartını taşıması halinde iş güvencesi hükümlerinden yararlanır","B":"İşletmenin bütününü sevk ve idare eden ve işçiyi işe alma yetkisi bulunan işveren vekili de iş güvencesi hükümlerinden yararlanır"},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.18 [1/2]","metin":"Madde 18 - Otuz veya daha fazla işçi çalıştıran işyerlerinde en az altı aylık kıdemi olan işçinin belirsiz süreli iş sözleşmesini fesheden işveren, işçinin yeterliliğinden veya davranışlarından ya da işletmenin, işyerinin veya işin gereklerinden kaynaklanan geçerli bir sebebe dayanmak zorundadır. (Ek cümle: 10/9/2014-6552/2 md.) Yer altı işlerinde çalışan işçilerde kıdem şartı aranmaz. Altı aylık kıdem hesabında bu Kanunun 66 ncı maddesindeki süreler dikkate alınır. Özellikle aşağıdaki hususlar fesih için geçerli bir sebep oluşturmaz: a) Sendika üyeliği veya çalışma saatleri dışında veya işverenin rızası ile çalışma saatleri içinde sendikal faaliyetlere katılmak. b) İşyeri sendika temsilciliği yapmak. c) Mevzuattan veya sözleşmeden doğan haklarını takip veya yükümlülüklerini yerine getirmek için işveren aleyhine idari veya adli makamlara başvurmak veya bu hususta başlatılmış sürece katılmak.6 d) Irk, renk, cinsiyet, medeni hal, aile yükümlülükleri, hamilelik, doğum, din, siyasi görüş ve benzeri nedenler. e) 74 üncü maddede öngörülen ve kadın işçilerin çalıştırılmasının yasak olduğu sürelerde işe gelmemek. f) Hastalık veya kaza nedeniyle 25 inci maddenin (I) numaralı bendinin (b) alt bendinde öngörülen bekleme süresinde işe geçici devamsızlık. İşçinin altı aylık kıdemi, aynı işverenin bir veya değişik işyerlerinde geçen süreler birleştirilerek hesap edilir. İşverenin aynı işkolunda birden fazla işyerinin bulunması halinde, işyerinde çalışan işçi sayısı, bu işyerlerinde çalışan toplam işçi sayısına göre belirlenir."},{"ad":"İş K. (4857 s.K.) m.18 [2/2]","metin":"İşletmenin bütününü sevk ve idare eden işveren vekili ve yardımcıları ile işyerinin bütününü sevk ve idare eden ve işçiyi işe alma ve işten çıkarma yetkisi bulunan işveren vekilleri hakkında bu madde, 19 ve 21 inci maddeler ile 25 inci maddenin son fıkrası uygulanmaz. Sözleşmenin feshinde usul"}],"hakem":"Soru, İş K. m.18\u0027de açıkça tanımlanan iş güvencesi koşullarını (otuz veya daha fazla işçi, belirsiz süreli sözleşme, altı aylık kıdem) doğru ve eksiksiz biçimde test etmektedir."},"kayitlar":[],"sade":{"siklar":{"D":"Belirli süreli sözleşme ile çalışan işçi, altı aylık kıdem sağlasa da iş güvencesinden yararlanamaz; yalnız belirsiz süreli sözleşme koruma sağlar.","E":"Deneme süresindeki işçi henüz altı aylık kıdemi tamamlamadığından, işyerinde kaç işçi olursa olsun iş güvencesi hükümlerinden yararlanamaz.","A":"On işçi sayısı çok azdır; kanun en az 30 işçi olması şartını koşmaktadır.","B":"İşletmeyi yönetme ve işçi işe alma yetkisi olan işveren vekilleri iş güvencesi kapsamı dışında tutulmuştur."},"dogru":"İş güvencesinden yararlanmak için üç şart birden gerekir: işyerinde en az 30 işçi çalışmalı, işçi en az 6 ay çalışmış olmalı ve belirsiz süreli sözleşmesi olmalıdır. C şıkkı bu üç koşulu doğru bir şekilde birleştiriyor.","sinav":"İş Kanunu 18. madde uyarınca otuz veya daha fazla işçi çalıştıran işyerinde en az altı aylık kıdemi bulunan ve belirsiz süreli iş sözleşmesiyle çalışan işçi iş güvencesi hükümlerinden yararlanır.","kavramlar":[{"kaynak":"İş Kanunu 18. madde","tanim":"İşçinin aynı işveren yanında, bir veya birden fazla işyerinde geçirmiş olduğu çalışma süresi.","ad":"kıdem"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"4857 sayılı İş Kanunu\u0027na göre iş güvencesi hükümlerinden yararlanabilmenin koşullarına ilişkin olarak aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-27","verilenler":[],"dayanak":"4857 sayılı İş Kanunu madde 18","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Bursa\u0027da tekstil atölyesi sahibi Kemal Bey, 2023 yılında işyerinde 34 işçi çalıştırıyor. İşçilerden Ayşe 5 ay önce belirsiz süreli sözleşmeyle işe girmiş, işçi Mehmet ise 8 ay önce belirli süreli sözleşmeyle girmiş.","anlatim":"Kemal Bey ikisinden birini işten çıkarmak istiyor ama hangisinin iş güvencesinden yararlanacağını bilmiyor.","doldur":[]},{"formul":"Ne yapacağız: 4857 sayılı İş Kanunu madde 18\u0027e göre otuz veya daha fazla işçi, belirsiz süreli sözleşme ve altı ay kıdem şartlarının üçü birlikte aranır. Kemal Bey\u0027in atölyesindeki her işçiyi bu üç şarta tek tek vuracağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural tek: sayı, sözleşme türü, kıdem birlikte olmalı.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.18/1","karar":"yanlış","anlatim":"Kanun on değil otuz işçi eşiği arar, atölyede 34 işçi olsa da eşik yanlış yazılmış. Bu ifade yanlış.","formul":"Şık A: biri sana \u0027on işçi ve altı ay yeter\u0027 derse, Kemal Bey\u0027in atölyesi için doğru mu dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.18/1","karar":"yanlış","anlatim":"Madde 18 böyle bir vekili kapsam dışı bırakır. Bu ifade yanlış.","formul":"Şık B: Kemal Bey\u0027in işletmeyi bütünüyle yöneten ve işe alma yetkisi olan vekili de iş güvencesinden yararlanır mı dersin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.18/1","karar":"doğru","anlatim":"Otuz işçi, belirsiz süreli sözleşme, altı ay kıdem üçü de tam. Bu ifade doğru.","formul":"Şık C: 34 işçili atölyede belirsiz süreli sözleşmeyle çalışan ve 6 ayı dolduran Ayşe iş güvencesinden yararlanır mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.18/1","karar":"yanlış","anlatim":"Kıdem yeterli olsa da sözleşme türü belirli süreli, kapsam dışı kalır. Bu ifade yanlış.","formul":"Şık D: Mehmet belirli süreli sözleşmeyle çalışıyor ve 8 aylık kıdemi var, iş güvencesinden yararlanır mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.18/1","karar":"yanlış","anlatim":"Altı ay kıdem ayrı ve zorunlu şart, deneme süresi bu süreyi doldurmaz. Bu ifade yanlış.","formul":"Şık E: atölyeye yeni giren ve deneme süresindeki işçi, kıdem aranmaksızın iş güvencesinden yararlanır mı?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Ayşe\u0027nin durumu üç şartı da taşıdığı için doğru cevap C. Kendine sor: bu işçide otuz işçi, belirsiz süreli sözleşme, altı ay kıdem üçü birden var mı?","doldur":[]}],"anahtar":[{"ornek":"sözleşmesiyle","kok":"sözleş"},{"ornek":"süreli","kok":"süreli"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"belirsiz","kok":"belirs"},{"ornek":"yararlanmak","kok":"yararl"},{"ornek":"güvencesinden","kok":"güvenc"}],"konuGiris":{"harita":"Hangi işçi kapsamdadır: işyerinde en az 30 işçi çalışması ve işçinin en az 6 aylık kıdemi şartı birlikte aranır. Nasıl ölçülür: işçi sayısı aynı işkolundaki işverenin tüm işyerlerindeki toplam işçi sayısına göre, kıdem ise aynı işverenin farklı işyerlerindeki süreler birleştirilerek hesaplanır. Nasıl kaydedilir: işveren vekili konumundaki (işe alma-çıkarma yetkisi olan) üst düzey yöneticiler bu kapsamın dışında tutulur.","desen":"Sınav genellikle 30 işçi ve 6 ay kıdem şartının birlikte arandığını, tek başına yetmediğini sorar; şıklarda bu ikisinden biri eksik verilerek tuzak kurulur. Bazı sorularda işveren vekili istisnası veya yer altı işçisi için kıdem şartının aranmaması gibi özel durumlar karıştırılır. Bu soru m.18/1-2 metninden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"iş güvencesi için gereken en az 30 işçi şartı","ad":"işyeri işçi sayısı eşiği","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"işçinin aynı işverende en az 6 ay çalışmış olması gereği","ad":"kıdem şartı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işçinin yeterliliği, davranışı veya işletme gereklerinden kaynaklanan fesih nedeni","ad":"geçerli sebep","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işe alma-çıkarma yetkisi olan üst yönetici için kapsam dışı tutulma","ad":"işveren vekili istisnası","kim":"kanun sabitler"}],"sinavda":"Soru, iş güvencesi hükümlerinden yararlanma koşullarının hangisinin doğru tanımlandığını, şık üzerinden sorar.","panel_ornek":"Bir markette 3 yıldır çalışan komşun işten çıkarılınca \u0027haksız yere kovuldum\u0027 diyor ama markette sadece 12 kişi çalışıyor. Bu yüzden bazı korumalardan yararlanamıyor çünkü işyeri belli bir büyüklükte olmalı. Bu kural, kimin bu korumadan yararlanabileceğini belirleyen sınırdır.","ornek":"Bir markette 3 yıldır çalışan komşun işten çıkarılınca \u0027haksız yere kovuldum\u0027 diyor ama markette sadece 12 kişi çalışıyor. Bu yüzden bazı korumalardan yararlanamıyor çünkü işyeri belli bir büyüklükte olmalı. Bu kural, kimin bu korumadan yararlanabileceğini belirleyen sınırdır.","yontemler":"30 işçi ve 6 ay kıdem şartının ikisinin de AYNI ANDA gerekli olduğunu, birinin tek başına yetmediğini unutma. İstisnaları (yer altı işçisi, işveren vekili) ayrı hatırla.","nedir":"İş güvencesi, belirli koşulları taşıyan işçinin işveren tarafından geçerli sebep olmadan işten çıkarılamamasını sağlayan bir korumadır. Sınav bu korumadan kimin, hangi koşullarla yararlanabildiğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Sözleşme Türü Tuzağı","metin":"Kıdem şartı sağlandıysa sözleşme türünün önemsiz olduğunu sanıyorsun. Doğrusu: İş güvencesi hükümleri yalnız belirsiz süreli iş sözleşmesiyle çalışan işçiler için uygulanır, belirli süreli sözleşmeyle çalışanlar kapsam dışıdır."},"E":{"ad":"Kıdem Süresi Tuzağı","metin":"İşyeri işçi sayısı yeterliyse kıdem şartının aranmayacağını düşünüyorsun. Doğrusu: Deneme süresindeki işçi, altı aylık kıdemi doldurmadığı için iş güvencesi hükümlerinden yararlanamaz."},"A":{"ad":"İşçi Sayısı Eşiği Tuzağı","metin":"İşyerindeki işçi sayısının on olmasını yeterli sanıyorsun. Doğrusu: 4857 sayılı İş Kanunu madde 18 uyarınca işyerinde en az otuz işçi çalıştırılması şarttır, on işçi eşiği bu kurala ait değildir."},"B":{"ad":"İşveren Vekili Tuzağı","metin":"İşletmenin bütününü yöneten işveren vekilinin de işçi gibi güvenceden yararlanacağını düşünüyorsun. Doğrusu: İşletmenin bütününü sevk ve idare eden ve işçiyi işe alma yetkisi bulunan işveren vekili iş güvencesi kapsamı dışındadır."}},"celdiriciYol":{},"hap":"İş güvencesinden yararlanmak için otuz veya daha fazla işçi çalıştırılan işyerinde, belirsiz süreli iş sözleşmesiyle çalışan ve en az altı aylık kıdemi bulunan işçi olmak gerekir; işveren vekili bu kapsamın dışındadır.","teshis":{"C":{"gercek":"Madde 18, işyeri işçi sayısı, sözleşme türü ve kıdem şartının BİRLİKTE gerçekleşmesini arar.","ayirt":"Üç şartın hepsi bir arada var mı: otuz işçi, belirsiz süreli sözleşme, altı ay kıdem?","paragraf":"4857 sayılı İş Kanunu m.18/1","yanilgi":"Bu şıkkı elerken tek bir şartın (yalnız işçi sayısının ya da yalnız kıdemin) yeterli olduğunu düşünüyorsun."},"E":{"gercek":"Altı aylık kıdem, iş güvencesinin ayrı ve bağımsız bir şartıdır; deneme süresindeki işçi bu süreyi doldurmamıştır.","ayirt":"İşçi işyerinde fiilen altı ayı doldurmuş mu?","paragraf":"4857 sayılı İş Kanunu m.18/1","yanilgi":"İşyeri işçi sayısı şartı sağlandığında kıdem şartının aranmayacağını sanıyorsun."},"A":{"gercek":"4857 sayılı İş Kanunu madde 18 açıkça otuz veya daha fazla işçi çalıştırılan işyerini şart koşar; on işçi eşiği bu maddeye ait değildir.","ayirt":"Bu eşiği başka bir kurumla (örneğin kıdem tazminatı ya da toplu işçi çıkarma) mı karıştırıyorum?","paragraf":"4857 sayılı İş Kanunu m.18/1","yanilgi":"İşçi sayısı eşiğini on olarak ezberlemişsin, otuz eşiğiyle karıştırıyorsun."},"D":{"gercek":"İş güvencesi yalnız belirsiz süreli iş sözleşmesiyle çalışan işçileri kapsar; belirli süreli sözleşmeyle çalışanlar bu korumadan yararlanamaz.","ayirt":"İşçinin sözleşmesi belirsiz süreli mi, belirli süreli mi?","paragraf":"4857 sayılı İş Kanunu m.18/1","yanilgi":"Kıdem şartı sağlandıktan sonra sözleşme türünün önemini kaybettiğini sanıyorsun."},"B":{"gercek":"4857 sayılı İş Kanunu madde 18, işletmenin bütününü sevk ve idare eden ve işçiyi işe alma yetkisi bulunan işveren vekilini iş güvencesi kapsamı dışında tutar.","ayirt":"Bu kişi işletmenin bütününü yönetme ve işe alma yetkisine sahip mi?","paragraf":"4857 sayılı İş Kanunu m.18/1","yanilgi":"İşveren vekilinin de bir çalışan olduğu için işçiyle aynı korumadan yararlanacağını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 109"},"kural":"4857 sayılı İş Kanunu m.18/4\u0027e göre işverenin aynı işkolunda birden fazla işyeri bulunması halinde işçi sayısı bu işyerlerinde çalışan toplam işçi sayısına göre belirlenir; farklı işkolundaki işyeri bu hesaba dahil edilmez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 109","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"İşçi sayısı sorularında önce işkolu aynı mı diye ayır, sonra topla, en son 30 eşiğiyle karşılaştır.","konu":"is güvencesi kapsamı","tablo":{"satirlar":[["VERİLENLER","-"],["A işyeri işçi sayısı","14 işçi"],["B işyeri işçi sayısı","11 işçi"],["C işyeri işçi sayısı","20 işçi"],["Y\u0027nin kıdemi","8 ay"],["HESAP","-"],["A işyeri (tekstil)","14"],["B işyeri (tekstil)","11"],["Aynı işkolu toplamı (A+B)","25"],["C işyeri (gıda, farklı işkolu)","Dahil değil"],["30 işçi eşiği ile karşılaştırma","25 \u003c 30"],["Sonuç","Kapsam dışı"]],"basliklar":["Kalem","Tutar/Durum"]},"siklar":{"C":"25 işçi ile kapsamdadır","E":"45 işçi ile kapsam dışında kalır","A":"14 işçi ile kapsam dışında kalır","D":"45 işçi ile kapsamdadır","B":"25 işçi ile kapsam dışında kalır"},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.18 [1/2]","metin":"Madde 18 - Otuz veya daha fazla işçi çalıştıran işyerlerinde en az altı aylık kıdemi olan işçinin belirsiz süreli iş sözleşmesini fesheden işveren, işçinin yeterliliğinden veya davranışlarından ya da işletmenin, işyerinin veya işin gereklerinden kaynaklanan geçerli bir sebebe dayanmak zorundadır. (Ek cümle: 10/9/2014-6552/2 md.) Yer altı işlerinde çalışan işçilerde kıdem şartı aranmaz. Altı aylık kıdem hesabında bu Kanunun 66 ncı maddesindeki süreler dikkate alınır. Özellikle aşağıdaki hususlar fesih için geçerli bir sebep oluşturmaz: a) Sendika üyeliği veya çalışma saatleri dışında veya işverenin rızası ile çalışma saatleri içinde sendikal faaliyetlere katılmak. b) İşyeri sendika temsilciliği yapmak. c) Mevzuattan veya sözleşmeden doğan haklarını takip veya yükümlülüklerini yerine getirmek için işveren aleyhine idari veya adli makamlara başvurmak veya bu hususta başlatılmış sürece katılmak.6 d) Irk, renk, cinsiyet, medeni hal, aile yükümlülükleri, hamilelik, doğum, din, siyasi görüş ve benzeri nedenler. e) 74 üncü maddede öngörülen ve kadın işçilerin çalıştırılmasının yasak olduğu sürelerde işe gelmemek. f) Hastalık veya kaza nedeniyle 25 inci maddenin (I) numaralı bendinin (b) alt bendinde öngörülen bekleme süresinde işe geçici devamsızlık. İşçinin altı aylık kıdemi, aynı işverenin bir veya değişik işyerlerinde geçen süreler birleştirilerek hesap edilir. İşverenin aynı işkolunda birden fazla işyerinin bulunması halinde, işyerinde çalışan işçi sayısı, bu işyerlerinde çalışan toplam işçi sayısına göre belirlenir."},{"ad":"İş K. (4857 s.K.) m.18 [2/2]","metin":"İşletmenin bütününü sevk ve idare eden işveren vekili ve yardımcıları ile işyerinin bütününü sevk ve idare eden ve işçiyi işe alma ve işten çıkarma yetkisi bulunan işveren vekilleri hakkında bu madde, 19 ve 21 inci maddeler ile 25 inci maddenin son fıkrası uygulanmaz. Sözleşmenin feshinde usul"}],"hakem":"Soru, İş Kanunu m.18/4\u0027teki işçi sayısı hesaplaması kuralını doğru uygulamakta, kaynak metinde açıkça desteklenmekte, iş güvencesi kapsamına ilişkindir."},"kayitlar":[],"sade":{"siklar":{"C":"A ve B\u0027yi doğru topladınız (25), ancak 25 sayısının 30 eşiğinin altında kaldığını fark etmediniz. 30 işçiden az olduğu için kapsam dışıdır.","E":"Hem C işyerini hatalı dahil etip 45 buldunuz, hem de bu sayıyı yanlış değerlendirdiniz. Doğru toplam 25 olup zaten kapsam dışıdır.","D":"Gıda işkolundaki C işyerini yanlışlıkla eklediniz. Kanun yalnız aynı işkolundaki işyerlerini toplama dahil eder; farklı işkolunculuk yok sayılır.","A":"Sadece A işyerini sayarak B işyerini göz ardı ettiniz. Aynı işkolundaki tüm işyerlerin işçileri toplanmalıdır: 14 + 11 = 25."},"dogru":"Aynı işkolda (tekstil) birden fazla işyeri varsa, işçi sayısı tüm işyerlerinin toplamına göre hesaplanır. A ve B işyerlerindeki 14 + 11 = 25 işçi 30\u0027dan az olduğu için, Y iş güvencesi kapsamı dışındadır. C işyeri farklı işkol (gıda) olup hesaba katılmaz.","sinav":"İş Kanunu 18. madde dördüncü fıkrasına göre, işverenin aynı işkolunda birden fazla işyerinin bulunması halinde işçi sayısı bu işyerlerinde çalışan toplam işçi sayısına göre belirlenir.","kavramlar":[{"kaynak":"İş Kanunu 18. madde","tanim":"En az altı aylık kıdemi olan işçinin belirsiz süreli iş sözleşmesinin geçerli bir sebep olmaksızın feshinden korunmasıdır.","ad":"iş güvencesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":{"bosluk":[[2,1],[4,1],[5,1]],"tablo":{"basliklar":["Kalem","Tutar/Durum"],"satirlar":[["M işyeri (metal)","17"],["N işyeri (metal)","9"],["Aynı işkolu toplamı (M+N)","26"],["P işyeri (inşaat, farklı işkolu)","Dahil değil"],["30 işçi eşiği ile karşılaştırma","26 \u003c 30"],["Sonuç","Kapsam dışı"]]},"tur":"tablo","soru":"Metal işkolunda faaliyet gösteren işveren, M işyerinde 17, N işyerinde 9 işçi çalıştırmaktadır; ayrıca inşaat işkolunda P işyerinde 25 işçi vardır. M işyerinde 10 aydır belirsiz süreli sözleşmeyle çalışan işçi Z için iş güvencesi hükümleri, işyerindeki işçi sayısı esas alınarak nasıl uygulanır?","verilen":[[0,1],[1,1],[3,1]],"hedef":"Tabloyu doldur ve Z işçisinin iş güvencesi kapsamında olup olmadığını bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Tekstil işkolunda faaliyet gösteren işveren, A işyerinde 14, B işyerinde 11 işçi çalıştırmaktadır; ayrıca gıda işkolunda C işyerinde 20 işçi vardır. A işyerinde 8 aydır belirsiz süreli sözleşmeyle çalışan işçi Y için iş güvencesi hükümleri, işyerindeki işçi sayısı esas alınarak nasıl uygulanır?","kayitBaslik":"","id":"sgs-t2-issgk-cokzor/kp-14","verilenler":[{"deger":"14 işçi","anlam":"Tekstil işkolundaki bir işyerinin işçi sayısı, aynı işkolu toplamına dahil edilir","ad":"A işyeri işçi sayısı"},{"deger":"11 işçi","anlam":"Aynı işkolundaki diğer işyerinin işçi sayısı, A ile toplanır","ad":"B işyeri işçi sayısı"},{"deger":"20 işçi","anlam":"Farklı işkolundaki (gıda) işyeri; çeldirici veri, toplama dahil edilmez","ad":"C işyeri işçi sayısı"},{"deger":"8 ay","anlam":"6 aylık kıdem şartını sağlar, ancak işçi sayısı eşiği ayrıca aranır","ad":"Y\u0027nin kıdemi"}],"dayanak":"4857 sayılı İş Kanunu m.18/1 ve m.18/4","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Verilen: A işyeri (tekstil) 14 işçi (soruda verilen); B işyeri (tekstil) 11 işçi (soruda verilen); C işyeri (gıda) 20 işçi (soruda verilen); işçi Y, A işyerinde 8 aydır belirsiz süreli sözleşmeyle çalışıyor (soruda verilen)","anlatim":"Soru bize şunları vermiş: A işyerinde 14, B işyerinde 11 işçi var, ikisi de tekstil işkolunda. C işyerinde 20 işçi var ama işkolu gıda, yani farklı.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1],[6,1],[7,1],[9,1]]},{"formul":"İş güvencesi nedir?","anlatim":"İş güvencesi nedir? İşçinin haksız yere işten çıkarılmasına karşı fesih için geçerli sebep arayan koruma sistemidir; İş Kanunu madde 18\u0027de düzenlenir.","doldur":[]},{"formul":"İş güvencesi hangi işçiyi kapsar?","anlatim":"İş güvencesi hangi işçiyi kapsar? En az 6 aylık kıdemi olan, belirsiz süreli sözleşmeyle çalışan işçiyi; işyerinde en az 30 işçi çalışması şart.","doldur":[]},{"formul":"30 işçi şartı tek işyeri için mi bakılır?","anlatim":"30 işçi şartı tek işyeri için mi bakılır? Hayır, işveren aynı işkolunda birden fazla işyeri açmışsa işçi sayısı bu işyerlerinin toplamına göre bulunur. Bu Cem kuralı: soru bunu bize doğrudan söylemiş, biz sadece uyguluyoruz.","doldur":[]},{"formul":"Dahil değil: C işyeri (gıda) 20 işçi (soruda verilen)","anlatim":"Dikkat, C işyeri gıda işkolunda, A ve B ise tekstil. Farklı işkolundaki işyeri toplam işçi sayısı hesabına hiç girmez.","doldur":[[9,1]]},{"formul":"Aynı işkolu toplamı = A işyeri + B işyeri = 14 (soruda verilen) + 11 (soruda verilen) = 25","anlatim":"Şimdi biz hesaplıyoruz: aynı işkolundaki A ve B işyerlerinin işçi sayılarını topluyoruz. Çünkü kanun bu iki işyerini bir bütün sayıyor.","doldur":[[8,1]]},{"formul":"büyük olan: 25 (6. adımda bulduk) ile 30 (kanun eşiği) → 30, yani 25 \u003c 30","anlatim":"Bulduğumuz toplamı 30 işçi eşiğiyle karşılaştırıyoruz. Eşik sağlanmazsa iş güvencesi hiç devreye girmez.","doldur":[[10,1]]},{"formul":"Sonuç = işçi sayısı şartı sağlanmadı → iş güvencesi uygulanmaz","anlatim":"Sonuç: 25 işçi 30\u0027un altında kaldığı için Y işçi iş güvencesi kapsamı dışında. Y\u0027nin 8 aylık kıdemi yeterli olsa da işçi sayısı şartı sağlanmadı.","doldur":[[11,1]]},{"formul":"Ters durum: toplam ≥ 30 → iş güvencesi kapsamına girer","anlatim":"Ters durumda: A ve B toplamı 30 veya üzeri olsaydı, Y\u0027nin 6 ayı da doluysa iş güvencesi hükümleri tam uygulanırdı.","doldur":[]},{"formul":"Yanlış yol: 14 + 11 + 20 = 45 (HATALI) → doğrusu 14 + 11 = 25 (6. adımda bulduk)","anlatim":"En sık hata: öğrenciler C işyerindeki 20 işçiyi de toplama katıp 45 ile 30\u0027u karşılaştırıyor. Bu yanlış çünkü C farklı işkolunda, hesaba hiç girmemesi gerekir.","doldur":[]}],"anahtar":[{"ornek":"işyerinde","kok":"işyeri"},{"ornek":"işkolundaki","kok":"işkolu"},{"ornek":"sayısı","kok":"sayısı"},{"ornek":"güvencesi","kok":"güvenc"},{"ornek":"farklı","kok":"farklı"},{"ornek":"işyerleri","kok":"işyerl"}],"konuGiris":{"harita":"Ne zaman test edilir: işveren belirsiz süreli sözleşmeyi feshettiğinde işçinin iş güvencesinden yararlanıp yararlanmayacağı belirlenirken. Nasıl ölçülür: aynı işverenin aynı işkolundaki tüm işyerlerindeki işçi sayıları toplanarak 30 eşiği kontrol edilir. Nasıl kaydedilir: işçinin altı aylık kıdemi de aynı işverenin farklı işyerlerindeki süreler birleştirilerek hesaplanır.","desen":"Sınav genellikle farklı işkollarındaki işyerlerini karıştırarak toplam işçi sayısını yanlış hesaplattırmayı hedefler. Tuzak, gıda işkolundaki işyerinin tekstil işkolundaki toplama dahil edilip edilmeyeceğidir; adayın sadece aynı işkolundaki işyerlerini toplaması gerekir. Bu soru İş Kanunu m.18/1 son fıkra noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"iş güvencesi için aranan otuz veya daha fazla işçi sayısı sınırı","ad":"işyeri işçi sayısı eşiği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"aynı işverenin aynı işkolundaki işyerlerinin işçi sayılarının toplanması kuralı","ad":"aynı işkolu birleştirmesi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"işçinin aynı işverenin bir veya birden çok işyerinde geçirdiği birleştirilmiş çalışma süresi","ad":"altı aylık kıdem","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işçinin yeterliliği, davranışı veya işletme gereklerinden kaynaklanan fesih nedeni","ad":"geçerli sebep","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Farklı işyeri ve işkollarındaki işçi sayıları verilir, iş güvencesinin uygulanıp uygulanmayacağı ve hangi işyerlerinin hesaba katılacağı sorulur.","panel_ornek":"Bir market zincirinin aynı ilde 2 şubesi var: birinde 6, diğerinde 5 kasiyer çalışıyor, ayrıca farklı bir sektördeki bakkal şubesinde 9 kişi var. Kasiyerlerden birinin iş güvencesinden yararlanıp yararlanamayacağı, sadece aynı iş kolundaki şubelerin toplam işçi sayısına bakılarak belirlenir; bakkal şubesi bu hesaba katılmaz.","ornek":"Bir market zincirinin aynı ilde 2 şubesi var: birinde 6, diğerinde 5 kasiyer çalışıyor, ayrıca farklı bir sektördeki bakkal şubesinde 9 kişi var. Kasiyerlerden birinin iş güvencesinden yararlanıp yararlanamayacağı, sadece aynı iş kolundaki şubelerin toplam işçi sayısına bakılarak belirlenir; bakkal şubesi bu hesaba katılmaz.","yontemler":"Sadece aynı işverenin aynı işkolundaki işyerlerindeki işçi sayıları toplanır; farklı işkolundaki işyeri toplama dahil edilmez.","nedir":"İş güvencesi, 30 veya daha fazla işçi çalıştıran işyerlerinde belirli koşullardaki işçinin geçerli sebep olmadan işten çıkarılamamasını sağlar. Sınav bu işçi sayısı eşiğinin ve işkolu bazında birleştirme kuralının doğru uygulanıp uygulanmadığını ölçer."},"olay":"A(14)+B(11)=25; 25\u003c30.","tuzak":{"C":{"ad":"Eşik Ters Okuma Tuzağı","metin":"A ve B işyerlerini doğru topladın ama 25 rakamının 30 eşiğinin altında kaldığını gözden kaçırıp kapsamda sonucuna vardın. Doğrusu: 25\u003c30 olduğundan işyeri işçi sayısı yetersizdir, kapsam dışıdır."},"E":{"ad":"Çifte Hata Tuzağı","metin":"Hem farklı işkoldaki C işyerini yanlışlıkla topladın hem de 45\u0027in 30\u0027u aştığını fark etmeyip kapsam dışı sonucuna vardın. Doğrusu: C işyeri hesaba girmez, doğru toplam 25 olup zaten kapsam dışıdır."},"D":{"ad":"Farklı İşkolu Yükleme Tuzağı","metin":"Gıda işkolundaki C işyerini de toplama dahil ettin. Doğrusu: İş Kanunu m.18/4 yalnız AYNI işkolundaki işyerlerinin toplanmasını öngörür, C işyeri (gıda) hesaba katılmaz; gerçek toplam 25\u0027tir."},"A":{"ad":"Tek İşyeri Tuzağı","metin":"A işyerini tek başına saydın, aynı işkolundaki B işyerini toplama katmadın. Doğrusu: 4857 sayılı İş Kanunu m.18/4 uyarınca aynı işkolundaki işyerlerinin işçi sayıları toplanır; A+B=25 esas alınır."}},"celdiriciYol":{"C":"14+11 = 25, 25\u003c30 iken kapsamda dendi (eşik karşılaştırmasını ters yorumladın)","E":"14+11+20 = 45 iken kapsam dışı dendi (yanlış toplam + ters karşılaştırma)","D":"14+11+20 = 45 ≥ 30 = kapsamda (farklı işkolundaki C işyerini toplamaya kattın)","A":"14 (yalnız A işyeri) \u003c 30 = kapsam dışı (B işyerini toplama katmadın)"},"hap":"İşverenin aynı işkolundaki birden fazla işyerinde çalışan işçi sayısı iş güvencesi kapsamı için toplu hesaplanır, farklı işkolundaki işyerleri bu hesaba dahil edilmez.","teshis":{"C":{"gercek":"30 işçi eşiği bir alt sınırdır; toplam bu sınırın altında kalırsa iş güvencesi uygulanmaz.","ayirt":"Bulduğum sayı eşiğin üstünde mi altında mı, sonucu buna göre mi yazdım?","paragraf":"İş K. m.18/1","yanilgi":"Toplamı doğru bulup 25\u0027in 30\u0027dan küçük olduğunu görmezden gelerek kapsamda sanıyorsun."},"E":{"gercek":"Doğru toplam farklı işkolu hariç tutularak 25 bulunur ve bu sayı zaten eşiğin altındadır.","ayirt":"Hem hangi işyerlerini topladım hem de eşikle doğru kıyasladım mı diye iki kez kontrol ettim mi?","paragraf":"İş K. m.18/4","yanilgi":"Yanlış işyerini toplama katıp üstüne bir de eşik karşılaştırmasını ters yaptığını fark etmiyorsun."},"A":{"gercek":"4857 sayılı İş Kanunu m.18/4 aynı işkolundaki tüm işyerlerinin işçi sayısının toplanmasını emreder.","ayirt":"İşverenin aynı işkolunda başka işyeri var mı, sayıları toplandı mı?","paragraf":"İş K. m.18/4","yanilgi":"İşçi sayısını yalnız işçinin çalıştığı tek işyerinden sayılır sanıyorsun."},"D":{"gercek":"Kanun yalnız AYNI işkolundaki işyerlerinin toplanmasını öngörür; farklı işkoldaki işyeri ayrı değerlendirilir.","ayirt":"Topladığım işyerleri gerçekten aynı işkolunda mı?","paragraf":"İş K. m.18/4","yanilgi":"Farklı işkolundaki işyerini de aynı işverene ait diye toplama katılması gerektiğini sanıyorsun."},"B":{"gercek":"İş güvencesi için hem 30 işçi eşiği hem 6 aylık kıdem birlikte aranır; 25\u003c30 olduğundan eşik sağlanmaz.","ayirt":"Aynı işkolundaki işyerlerinin toplam işçi sayısı 30\u0027u geçiyor mu?","paragraf":"İş K. m.18/1 ve m.18/4","yanilgi":"Bu şıkkı eleyen öğrenci, kıdem şartı sağlandığı için otomatik kapsam olduğunu sanıp işçi sayısı eşiğini atlar."}},"verilen":[[6,1],[7,1],[8,1],[9,1],[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 112"},"kural":"iki taraftan birinin bu davranışları öğrenmesinden itibaren altı iş günü ve fiilin gerçekleşmesinden itibaren bir yıl geçtikten sonra fesih yetkisi kullanılamaz; ancak işçinin maddi çıkar sağlaması halinde bir yıllık süre uygulanmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 112","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İki sürenin başlangıç noktasını ve istisnanın hangi süreye ait olduğunu ayrı ayrı kontrol et, tek şıkta ikisini birbirine karıştırma.","konu":"is kanunu fesih","tablo":{"satirlar":[["VERİLENLER","-","-"],["İş Kanunu madde numarası","26","-"],["HESAP","-","-"],["A) Altı iş günlük ve bir yıllık süreler, her ikisi de fiili…","İş K. m.26/1","YANLIŞ ifade"],["B) İşçinin olayda maddi çıkar sağlaması halinde, altı iş gü…","İş K. m.26/1 c.2","YANLIŞ ifade"],["C) Fesih süresi geçtikten sonra yapılan fesihte, diğer tara…","İş K. m.26/2","YANLIŞ ifade"],["D) İşçinin olayda maddi çıkar sağlaması halinde, fiilin ger…","İş K. m.26/1 c.2","doğru ifade"],["E) Altı iş günlük ve bir yıllık süreler geçtikten sonra da …","İş K. m.26/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Fesih süresi geçtikten sonra yapılan fesihte, diğer tarafın tazminat hakkı ortadan kalkar.","E":"Altı iş günlük ve bir yıllık süreler geçtikten sonra da taraflar fesih yetkisini kullanabilir.","A":"Altı iş günlük ve bir yıllık süreler, her ikisi de fiilin öğrenildiği günden itibaren işlemeye başlar.","D":"İşçinin olayda maddi çıkar sağlaması halinde, fiilin gerçekleşmesinden itibaren işleyen bir yıllık süre uygulanmaz.","B":"İşçinin olayda maddi çıkar sağlaması halinde, altı iş günlük hak düşürücü süre de uygulanmaz."},"kaynak":{"alinti":"daki fesih süresinin istisnasını doğru sormakta, D seçeneği kaynak metindeki","liste":[{"ad":"İş K. (4857 s.K.) m.26","metin":"Madde 26 - 24 ve 25 inci maddelerde gösterilen ahlak ve iyiniyet kurallarına uymayan hallere dayanarak işçi veya işveren için tanınmış olan sözleşmeyi fesih yetkisi, iki taraftan birinin bu çeşit davranışlarda bulunduğunu diğer tarafın öğrendiği günden başlayarak altı iş günü geçtikten ve her halde fiilin gerçekleşmesinden itibaren bir yıl sonra kullanılamaz. Ancak işçinin olayda maddi çıkar sağlaması halinde bir yıllık süre uygulanmaz. Bu haller sebebiyle işçi yahut işverenden iş sözleşmesini yukarıdaki fıkrada öngörülen süre içinde feshedenlerin diğer taraftan tazminat hakları saklıdır. Yeni iş arama izni"}],"hakem":"Soru İş Kanunu m.26\u0027daki fesih süresinin istisnasını doğru sormakta, D seçeneği kaynak metindeki \u0027Ancak işçinin olayda maddi çıkar sağlaması halinde bir yıllık süre uygulanmaz\u0027 hükmünü doğru aktarmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Süre geçtikten sonra fesih hakkı düşse de, diğer tarafın tazminat hakkı korunur; tazminat hakkı süre geçişiyle ortadan kalkmaz.","E":"Her iki süre geçtikten sonra fesih hakkı artık kullanılamaz; bu süreler hak düşürücü niteliğindedir ve geçtikten sonra fesih yetkisi sona erer.","A":"Her iki sürenin başlangıç anı yanlış anlaşılmış; altı iş günlük süre öğrenme gününden başlarken, bir yıllık süre fiilin gerçekleşmesinden itibaren işler.","B":"Maddi çıkar istisnası yalnız bir yıllık süreyi etkisiz kılar; altı iş günlük hak düşürücü süre işçinin çıkar sağlaması halinde de uygulanmaya devam eder."},"dogru":"İşçi maddi çıkar sağladığında, fiilin gerçekleşmesinden sonraki bir yıllık süre uygulanmaz ve fesih hakkı bu zaman sınırına takılmaz. Ancak davranışın öğrenilmesinden sonraki altı iş günlük süre yine geçerlidir.","sinav":"İş Kanunu 26. madde - ahlak ve iyiniyet kurallarına aykırılık nedeniyle fesih yetkisinin süreye bağlanmasında işçinin maddi çıkar sağlaması halinde bir yıllık sürenin uygulanmaması.","kavramlar":[{"kaynak":"İş Kanunu 26. madde","tanim":"Belirli bir süre geçtikten sonra bir hakkın kullanılamaz hale gelmesini sağlayan süredir; bu durumda fesih yetkisi süreler içinde kullanılmadıysa kaybolur.","ad":"Hak düşürücü süre"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2025/1","alinti":"…n bir araya gelerek bir işkolunda faaliyette bulunmak üzere oluşturdukları tüzel kişiliğe sahip kuruluşları ifade eder. 109. 4857 sayılı İş Kanununa göre aşağıdakilerden hangisi işverene haklı nedenle derhal fesih hakkı veren hâllerden biri değildir? A) İş sözleşmesinin konusu olan işin yapılmasının işin niteliğinden"}],"donemler":["2025/1"]},"oyun":null,"tip":"teori","soru":"İş Kanunu\u0027nun 26 ncı maddesinde düzenlenen ahlak ve iyiniyet kurallarına aykırılık nedeniyle fesih yetkisinin süreye bağlanmasına ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-35","verilenler":[{"deger":"26","anlam":"Ahlak ve iyiniyet kurallarına aykırılık halinde işçi feshinin düzenlendiği kanun maddesi.","ad":"İş Kanunu madde numarası"}],"dayanak":"İş Kanunu (4857 s.K.) m.26","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Bir mağazada kasiyer Ayşe, 3 Mart\u0027ta kasadan para çaldığını itiraf ediyor ama işveren bunu 20 Ekim\u0027de öğreniyor.","anlatim":"İşveren 20 Ekim\u0027den itibaren süre saymaya başlıyor. Ama fiil 3 Mart\u0027ta gerçekleşmiş; bu iki tarih birbirinden farklı.","doldur":[]},{"formul":"Ne yapacağız: İş Kanunu m.26\u0027daki altı iş günü ve bir yıl kuralını Ayşe\u0027nin olayına uygulayacağız.","anlatim":"Altı iş günlük süre öğrenme gününden, bir yıllık süre fiil gününden işler; Ayşe maddi çıkar sağladığı için bir istisna devreye girer. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"İş K. m.26/1","karar":"yanlış","anlatim":"Hayır, altı iş günü 20 Ekim\u0027den başlar ama bir yıl 3 Mart\u0027tan başlar. İki süre farklı başlangıç noktasına bağlıdır.","formul":"Şık A: biri sana \u0027Ayşe\u0027nin olayında hem altı iş günü hem bir yıl, 20 Ekim\u0027den başlar\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"İş K. m.26/1 c.2","karar":"yanlış","anlatim":"Hayır, madde sadece bir yıllık süreyi kaldırıyor. Altı iş günlük süre Ayşe\u0027nin olayında da geçerliliğini korur.","formul":"Şık B: müdür \u0027Ayşe para çaldığı için altı iş günlük süre de uygulanmaz\u0027 diyor, doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"İş K. m.26/2","karar":"yanlış","anlatim":"Hayır, tazminat hakkı süreden ayrı bir haktır ve süre içinde fesheden tarafın tazminat hakkı saklıdır. Süre geçmesi tazminatı silmiyor, sadece fesih yetkisini durduruyor.","formul":"Şık C: işveren süreyi kaçırıp Kasım ayında fesheder, sonra \u0027zaten tazminat hakkım da bitti\u0027 der, haklı mı?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"İş K. m.26/1 c.2","karar":"doğru","anlatim":"Evet, madde açıkça maddi çıkar halinde bir yıllık süreyi uygulamıyor. Altı iş günlük süre yine de öğrenme gününden işlemeye devam eder.","formul":"Şık D: Ayşe maddi çıkar sağladığı için işveren \u0027bir yıllık süre beni bağlamaz, 5 yıl sonra da fesh ederim\u0027 diyor, haklı mı?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"İş K. m.26/1","karar":"yanlış","anlatim":"Hayır, madde süreler geçtikten sonra fesih yetkisinin kullanılamayacağını açıkça söylüyor. Süreler hak düşürücüdür, geçtikten sonra yetki biter.","formul":"Şık E: işveren \u0027süreler geçti ama ben yine de fesih hakkımı kullanırım\u0027 diyor, mümkün mü?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Tek doğru cevap, maddi çıkar istisnasının yalnız bir yıllık süreyi kaldırdığını bilmekten geçiyor. Kendine sor: istisna metninde \u0027altı iş günü\u0027 mü yoksa \u0027bir yıl\u0027 mı yazıyor?","doldur":[]}],"anahtar":[{"ornek":"yıllık","kok":"yıllık"},{"ornek":"öğrenmeden","kok":"öğrenm"},{"ornek":"günlük","kok":"günlük"},{"ornek":"başlar","kok":"başlar"},{"ornek":"uygulanır","kok":"uygula"},{"ornek":"itibaren","kok":"itibar"}],"konuGiris":{"harita":"Ne zaman test edilir: öğrenme anından itibaren işleyen kısa süre ile olay tarihinden itibaren işleyen uzun sürenin birlikte mi yoksa ayrı mı işlediği sorulduğunda. Nasıl ölçülür: iki sürenin de dolup dolmadığı ayrı ayrı kontrol edilerek ölçülür. Nasıl kaydedilir: fesih bildirimi hangi tarihte yapıldıysa o tarih esas alınarak kayda geçirilir.","desen":"Sınav genellikle iki sürenin birbirinin alternatifi değil, birlikte ve ayrı ayrı işleyen sınırlar olduğunu karıştırtmaya çalışır. Bir diğer tuzak, maddi çıkar sağlanan hallerde uzun sürenin de geçerli olduğunu düşündürmektir; oysa bu halde uzun süre uygulanmaz. Bu soru fesih yetkisinin süreye bağlanmasını düzenleyen hükümden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"karşı tarafın davranışının öğrenildiği günden başlayan kısa süre","ad":"öğrenme süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"davranışın gerçekleştiği tarihten başlayan uzun süre sınırı","ad":"olay süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işçinin çıkar sağlaması halinde uzun sürenin uygulanmaması durumu","ad":"maddi çıkar istisnası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"süresinde fesheden tarafın diğer taraftan tazminat isteme hakkının korunması","ad":"tazminat hakkı saklılığı","kim":"kanun sabitler"}],"sinavda":"Soruda bir olay ve öğrenme tarihi verilerek fesih yetkisinin hâlâ kullanılıp kullanılamayacağı sorulur.","panel_ornek":"Arkadaşın sana borcunu ödemediğini öğrendiğin gün itibaren, ona dava açmak için kısa bir süren var; ama olayın üzerinden çok uzun zaman geçtiyse de artık hakkını arayamazsın. Diyelim öğrendiğin günden 6 gün, olaydan da 1 yıl geçince hakkın düşer. Ama karşı taraf senden para da kazanmışsa bu uzun süre sınırı uygulanmaz.","ornek":"Arkadaşın sana borcunu ödemediğini öğrendiğin gün itibaren, ona dava açmak için kısa bir süren var; ama olayın üzerinden çok uzun zaman geçtiyse de artık hakkını arayamazsın. Diyelim öğrendiğin günden 6 gün, olaydan da 1 yıl geçince hakkın düşer. Ama karşı taraf senden para da kazanmışsa bu uzun süre sınırı uygulanmaz.","yontemler":"Önce öğrenme tarihinden itibaren kısa süre, sonra olay tarihinden itibaren uzun süre ayrı ayrı kontrol edilir; maddi çıkar varsa uzun süre sınırı devre dışı bırakılır.","nedir":"Bu konu, ahlak ve iyiniyet kurallarına aykırılık nedeniyle işçi ya da işverenin fesih hakkını ne kadar süre kullanabileceğini düzenler. Sınav, öğrenme anından itibaren işleyen kısa süre ile olay tarihinden itibaren işleyen uzun sürenin birlikte uygulanıp uygulanmadığını ölçer."},"olay":"madde metninin doğrudan uygulanmasıdır, sayısal işlem yoktur.","tuzak":{"C":{"ad":"Sonuç Tuzağı","metin":"hak düşürücü süre geçtikten sonra tazminat hakkının da düştüğünü düşünürsün. Doğrusu: süre içinde fesih hakkını kullanmayan tarafın diğer taraftan tazminat hakkı saklıdır."},"E":{"ad":"Sonuç Tersi Tuzağı","metin":"sürelerin geçmesinin fesih hakkını etkilemediğini düşünürsün. Doğrusu: her iki süre de geçtikten sonra fesih yetkisi artık kullanılamaz, hak düşürücü niteliktedir."},"A":{"ad":"Zamanlama Tuzağı","metin":"iki sürenin de öğrenme gününden başladığını düşünürsün. Doğrusu: altı iş günlük süre öğrenme gününden, bir yıllık süre ise fiilin gerçekleşmesinden itibaren işler."},"B":{"ad":"Kapsam Tuzağı","metin":"maddi çıkar istisnasının her iki süreyi de kaldırdığını sanırsın. Doğrusu: maddi çıkar sağlanması yalnız bir yıllık süreyi etkisiz kılar, altı iş günlük süre aynen uygulanır."}},"celdiriciYol":{},"hap":"İş Kanunu m.26\u0027da altı iş günlük süre öğrenmeden başlar ve her durumda uygulanır; bir yıllık süre fiilin gerçekleşmesinden başlar ve işçinin maddi çıkar sağlaması halinde uygulanmaz.","teshis":{"C":{"gercek":"Madde 26/2, süre içinde fesheden tarafın diğer taraftan tazminat hakkının saklı olduğunu ayrıca düzenler; bu hak süreden bağımsızdır.","ayirt":"Fesih yetkisiyle tazminat hakkı aynı hükümde mi düzenleniyor, biri diğerini otomatik etkiler mi?","paragraf":"İş K. m.26/2","yanilgi":"Hak düşürücü sürenin geçmesinin tazminat hakkını da yok ettiğini sanıyorsun."},"E":{"gercek":"Madde 26/1, süreler geçtikten sonra fesih yetkisinin kullanılamayacağını açıkça belirtir; süreler hak düşürücüdür.","ayirt":"Madde metninde \u0027kullanılamaz\u0027 ifadesi süre geçtikten sonra ne anlama geliyor?","paragraf":"İş K. m.26/1","yanilgi":"Sürelerin sadece ihtar niteliğinde olduğunu, geçmesinin sonuç doğurmadığını sanıyorsun."},"A":{"gercek":"Madde 26\u0027da altı iş günlük süre öğrenme gününden, bir yıllık süre ise fiilin gerçekleştiği günden başlar; iki ayrı başlangıç vardır.","ayirt":"Bu süre öğrenmeye mi yoksa fiile mi bağlı, ikisi aynı gün mü başlıyor?","paragraf":"İş K. m.26/1","yanilgi":"İki sürenin de aynı başlangıç noktasından, öğrenme gününden işlediğini sanıyorsun."},"D":{"gercek":"Madde 26/1 c.2 açıkça yalnız bir yıllık süreyi maddi çıkar halinde uygulanmaz kılar.","ayirt":"İstisna metninde hangi süre adı geçiyor, \u0027altı iş günü\u0027 mü \u0027bir yıl\u0027 mı?","paragraf":"İş K. m.26/1 c.2","yanilgi":"Bu şıkkı eleyen öğrenci istisnanın altı iş günlük süreyi de kapsadığını düşünür."},"B":{"gercek":"Madde 26/1 cümle 2, istisnayı yalnız bir yıllık süre için tanır; altı iş günlük süre her durumda uygulanır.","ayirt":"İstisna hangi süreyi kaldırıyor, ikisini birden mi yoksa sadece birini mi?","paragraf":"İş K. m.26/1 c.2","yanilgi":"Maddi çıkar istisnasının süre sınırlamasının tamamını kaldırdığını sanıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 112"},"kural":"4857 sayılı İş Kanunu m.26 uyarınca fesih yetkisi, öğrenmeden itibaren 6 iş günü geçtikten sonra kullanılamaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 112","sonDonem":2,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Süre sorularında önce öğrenme tarihinden itibaren 6 iş günü kontrol edilir, sonra fiil tarihinden itibaren 1 yıl kontrol edilir; hangisi önce dolarsa sonuç odur.","konu":"is kanunu fesih","tablo":{"satirlar":[["VERİLENLER","-"],["geçen süre","8 iş günü"],["maddi çıkar","yok"],["HESAP","-"],["Öğrenmeden itibaren geçen süre","8 iş günü"],["Kanuni sınır (öğrenme)","6 iş günü"],["Süre aşımı","8 - 6 = 2 iş günü aşılmıştır"],["Sonuç","Fesih hakkı süresinde kullanılmamıştır"]],"basliklar":["Kalem","Değer"]},"siklar":{"C":"İşveren, öğrenme gününden itibaren 8 iş günü geçmiş olsa da bu süre kanunda öngörülen sınırı aşmadığından fesih hakkını kullanabilir.","E":"İşçinin fiilinin gerçekleşmesinden itibaren bir yıllık süre henüz dolmadığından işveren feshi geçerli şekilde yapabilir.","A":"İşveren, öğrenme gününden itibaren 6 iş günü içinde fesih bildirimini yaptığı kabul edileceğinden fesih hakkını süresinde kullanmıştır.","D":"İşveren, öğrenme gününden itibaren 8 iş günü geçtiğinden altı iş günlük süre dolmuş olup fesih hakkını kaybetmiştir.","B":"İşveren, öğrenme gününden itibaren 6 iş günlük süreyi geçirmiş sayıldığından fesih hakkını kaybetmiştir."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.26","metin":"Madde 26 - 24 ve 25 inci maddelerde gösterilen ahlak ve iyiniyet kurallarına uymayan hallere dayanarak işçi veya işveren için tanınmış olan sözleşmeyi fesih yetkisi, iki taraftan birinin bu çeşit davranışlarda bulunduğunu diğer tarafın öğrendiği günden başlayarak altı iş günü geçtikten ve her halde fiilin gerçekleşmesinden itibaren bir yıl sonra kullanılamaz. Ancak işçinin olayda maddi çıkar sağlaması halinde bir yıllık süre uygulanmaz. Bu haller sebebiyle işçi yahut işverenden iş sözleşmesini yukarıdaki fıkrada öngörülen süre içinde feshedenlerin diğer taraftan tazminat hakları saklıdır. Yeni iş arama izni"}],"hakem":"Soru, İş Kanunu m.26\u0027da düzenlenen ahlak ve iyiniyet kurallarına aykırı fiiller nedeniyle fesih hakkının kullanım süresini ölçmektedir; doğru sikk (D), 8 iş günü geçtiğinden 6 iş günlük sürenin dolduğunu ve fesih hakkının kaybedildiğini doğru olarak ifade etmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"8 iş günü 6 iş günlük sınırı aşmıştır; sınırın aşılması gözden kaçırılmamalıdır.","E":"Kanun iki süreyi birlikte arar; 6 iş günlük öğrenme süresi dolmuş olsa, 1 yıllık fiil süresi dolmamış olsa bile fesih hakkı kaybedilir.","A":"Olayda 8 iş günü geçmiş olduğu halde bu sayıyı kanundaki 6 iş günü sınırıyla karıştırarak sürenin dolmadığını düşünmek yanlıştır.","B":"Sorunun çözümü doğru sonuca ulaşsa da ifadesi hatalıdır; sürenin \"geçirilmiş sayıldığı\" değil, \"geçtiği\" söylenmelidir."},"dogru":"İşveren fiili öğrendiği günden itibaren 8 iş günü sonra fesih bildirimini yaptığı için 6 iş günlük süreyi aşmıştır. Bu nedenle fesih hakkını kaybetmiştir.","sinav":"İş Kanunu 26. madde uyarınca fesih yetkisi, davranışın öğrenilmesinden itibaren altı iş günü geçtikten sonra kullanılamaz.","kavramlar":[{"kaynak":"İş Kanunu 26. madde","tanim":"Fesih hakkı, davranışın öğrenilmesinden itibaren altı iş günü geçtikten sonra ve her halde fiilden itibaren bir yıl geçtikten sonra kullanılamaz.","ad":"Fesih yetkisinin süresi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2025/1","alinti":"…n bir araya gelerek bir işkolunda faaliyette bulunmak üzere oluşturdukları tüzel kişiliğe sahip kuruluşları ifade eder. 109. 4857 sayılı İş Kanununa göre aşağıdakilerden hangisi işverene haklı nedenle derhal fesih hakkı veren hâllerden biri değildir? A) İş sözleşmesinin konusu olan işin yapılmasının işin niteliğinden"}],"donemler":["2025/1"]},"oyun":{"bosluk":[[1,1],[2,1],[3,1]],"tablo":{"basliklar":["Kalem","Değer"],"satirlar":[["Öğrenmeden itibaren geçen süre","5 iş günü"],["Kanuni sınır (öğrenme)","6 iş günü"],["Süre aşımı","Aşılmamıştır"],["Sonuç","Fesih hakkı süresinde kullanılmıştır"]]},"tur":"tablo","soru":"İşverenin, işçinin ahlak ve iyiniyet kurallarına aykırı bir fiilini öğrenmesinden 5 iş günü sonra iş sözleşmesini feshetmek istemesi durumunda aşağıdakilerden hangisi doğrudur?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve fesih hakkının süresinde kullanılıp kullanılmadığını bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşçinin ahlak ve iyiniyet kurallarına aykırı bir fiili işveren tarafından öğrenilmiştir. İşçi bu fiilde herhangi bir maddi çıkar sağlamamıştır. İşveren, fiili öğrendiği günden itibaren 8 iş günü sonra iş sözleşmesini feshetmek istemektedir. Buna göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-zor/kp-35","verilenler":[{"deger":"8 iş günü","anlam":"işverenin fiili öğrendiği günden fesih bildirimine kadar geçen süre, 6 iş günlük yasal sınırla karşılaştırılır","ad":"geçen süre"},{"deger":"yok","anlam":"maddi çıkar sağlanmadığından 1 yıllık sürenin istisnası uygulanmaz, iki süre de normal şekilde işler","ad":"maddi çıkar"}],"dayanak":"4857 sayılı İş Kanunu m.26/1","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Soruda ne var: ahlak ve iyiniyet kurallarına aykırı fiil, öğrenmeden 8 iş günü sonra fesih isteği (soruda verilen); işçi ma
