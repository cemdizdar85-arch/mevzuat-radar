ddi çıkar sağlamamış (soruda verilen); fesih hakkının süresinde olup olmadığı soruluyor; \u0027öğrenme tarihinden itibaren süre\u0027 ayırt edici kelime","anlatim":"Soru bize şunu vermiş: işveren, ahlak ve iyiniyet kurallarına aykırı fiili öğrendikten 8 iş günü sonra fesih yapmak istiyor. İşçinin bu fiilden maddi çıkar sağlamadığı da belirtilmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[4,1]]},{"formul":"4857 sayılı İş Kanunu nedir?","anlatim":"4857 sayılı İş Kanunu nedir? Türkiye\u0027de iş sözleşmelerini ve işçi-işveren ilişkilerini düzenleyen temel kanundur. Fesih süreleri de bu kanunda belirlenir.","doldur":[]},{"formul":"Kanuni sınır (öğrenme) = 6 iş günü (soruda verilen değil, kanunda sabit)","anlatim":"m.26\u0027daki 6 iş günlük süre nedir? İşverenin haklı nedenle derhal fesih yetkisini kullanabileceği azami süredir. Bu süre öğrenme anından başlar, kanunda sabit yazan bir sayıdır.","doldur":[[5,1]]},{"formul":"Süre aşımı = geçen süre - kanuni sınır = 8 (soruda verilen) - 6 (kanunda sabit) = 2 iş günü","anlatim":"Şimdi biz hesaplıyoruz: olayda geçen süreyle kanuni sınırı karşılaştırıyoruz. Amaç, sürenin aşılıp aşılmadığını görmek.","doldur":[[6,1]]},{"formul":"büyük olan: 8 (soruda verilen) ile 6 (kanunda sabit) → 8, demek ki süre aşılmış","anlatim":"Büyük olan: geçen süre ile kanuni sınır → geçen süre büyük çıktı. Bu da sürenin dolduğu, hakkın kaybedildiği anlamına gelir.","doldur":[]},{"formul":"Sonuç: 8 iş günü \u003e 6 iş günü (4. adımda bulduk) → fesih hakkı süresinde kullanılmamıştır","anlatim":"Süre aşıldığı için fesih hakkı artık kullanılamaz. İşçinin maddi çıkar sağlamamış olması bu süreyi değiştirmez, o ayrı bir konudur.","doldur":[[7,1]]},{"formul":"Ters durum: geçen süre ≤ 6 iş günü → fesih hakkı süresinde kullanılabilir","anlatim":"Ters durumda: öğrenmeden itibaren 6 iş günü ya da daha az geçmiş olsaydı, fesih hakkı hâlâ kullanılabilirdi. Süre sınırı geçilmediği sürece işveren fesih yapabilir.","doldur":[]},{"formul":"Yanlış yol: maddi çıkar yok, öyleyse süre önemsiz = fesih geçerlidir (HATALI) → doğrusu 8 \u003e 6 (5. adımda bulduk) olduğundan fesih hakkı kaybedilmiştir","anlatim":"En sık hata: öğrenciler \u0027işçi maddi çıkar sağlamadı, o zaman fesih daha kolay olmalı\u0027 diye düşünüyor ama bu durum süreyi etkilemez. Süre kuralı bağımsız işler.","doldur":[]}],"anahtar":[{"ornek":"kullanılamaz","kok":"kullan"},{"ornek":"işveren","kok":"işvere"},{"ornek":"öğrenmeden","kok":"öğrenm"},{"ornek":"itibaren","kok":"itibar"},{"ornek":"kanundur","kok":"kanund"},{"ornek":"sağlamadığı","kok":"sağlam"}],"konuGiris":{"harita":"Ne zaman test edilir: öğrenme tarihinden itibaren geçen gün sayısının yasal süreyi aşıp aşmadığı sorulduğunda. Nasıl ölçülür: öğrenme günü ile fesih günü arasındaki iş günü sayısı hesaplanarak. Nasıl kaydedilir: sürenin dolup dolmadığı sonucu \u0027fesih hakkı var/yok\u0027 şeklinde belirtilir.","desen":"Soru genelde öğrenme tarihinden itibaren geçen gün sayısını verip sürenin dolup dolmadığını sorar, tuzak altı iş günü ile bir yıl sürelerinin karıştırılmasıdır. Maddi çıkar olup olmadığı da ayrı bir tuzak noktasıdır çünkü bu durum bir yıllık süreyi etkiler. Bu soru m.26\u0027daki altı iş günü ve bir yıl sürelerinin ayrımı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"diğer tarafın aykırı fiili öğrendiği tarih, sürenin başlangıcı","ad":"öğrenme günü","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"öğrenmeden itibaren fesih hakkının kullanılabileceği azami süre","ad":"altı iş günü süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"fiilin gerçekleşmesinden itibaren geçerli olan mutlak fesih süresi sınırı","ad":"bir yıllık süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işçi çıkar sağlamışsa bir yıllık sürenin uygulanmaması durumu","ad":"maddi çıkar istisnası","kim":"kanun sabitler"}],"sinavda":"Öğrenme tarihi ile fesih tarihi arasındaki gün sayısı ve maddi çıkar durumu verilir, fesih hakkının geçerli olup olmadığı istenir.","panel_ornek":"Arkadaşın, ikinci el bir bisiklet satıcısının kendisini kandırdığını öğreniyor ve 10 gün sonra şikayet etmek istiyor. Ama böyle şikayetlerin 6 gün içinde yapılması gerektiğini öğreniyor, yani hakkı düşmüş oluyor. Sayılar küçük ama mantık aynı: öğrenme anından itibaren süre işler.","ornek":"Arkadaşın, ikinci el bir bisiklet satıcısının kendisini kandırdığını öğreniyor ve 10 gün sonra şikayet etmek istiyor. Ama böyle şikayetlerin 6 gün içinde yapılması gerektiğini öğreniyor, yani hakkı düşmüş oluyor. Sayılar küçük ama mantık aynı: öğrenme anından itibaren süre işler.","yontemler":"Öğrenme gününden itibaren geçen iş günü sayısı altıyı aşmışsa ve maddi çıkar yoksa fesih hakkı düşmüştür; bu en kritik kuraldır.","nedir":"İş kanunu fesih, işçi veya işverenin ahlaka aykırı davranış nedeniyle sözleşmeyi haklı sebeple sona erdirme hakkının süreye bağlı kullanımını düzenler. Sınav bu sürenin geçip geçmediğini ve fesih hakkının düşüp düşmediğini ölçer."},"olay":"olayda öğrenmeden itibaren 8 iş günü geçmiştir, 8\u003e6.","tuzak":{"C":{"ad":"Sınır Aşımı Görmezden Gelme Tuzağı","metin":"8 iş gününün 6 iş günlük sınırı aştığını gözden kaçıran öğrenci, sürenin hâlâ içeride olduğunu düşünür. Doğrusu: 8, 6\u0027yı aştığından süre dolmuştur."},"E":{"ad":"Bir Yıllık Süreyi Esas Alma Tuzağı","metin":"Öğrenci sadece 1 yıllık fiil süresine bakıp 6 iş günlük öğrenme süresini gözden kaçırır. Doğrusu: iki süre BİRLİKTE aranır, 6 iş günü dolmuşsa 1 yıl dolmamış olsa da fesih hakkı kaybedilir."},"A":{"ad":"Altı İş Günü Tuzağı","metin":"Öğrenciyi burada süre içi sayan öğrenci, olayda geçen 8 iş gününü 6 iş günü ile karıştırır. Doğrusu: 8 iş günü, kanundaki 6 iş günlük süreyi aşmıştır, fesih süresizdir."},"B":{"ad":"Ne soruluyor","metin":"fesih hakkının süresinde kullanılıp kullanılamadığı sorulur. Kural: 4857 sayılı İş Kanunu m.26 uyarınca fesih yetkisi, öğrenmeden itibaren 6 iş günü ve fiilden itibaren 1 yıl geçtikten sonra kullanılamaz. Hesap: olayda öğrenmeden itibaren 8 iş günü geçmiştir, 8\u003e6. Doğrusu: 6 iş günlük süre dolmuş, fesih hakkı kaybedilmiştir."}},"celdiriciYol":{"C":"8 iş günü, 6 iş günlük sınırı aşmadığı varsayılırsa fesih hakkı kullanılabilir sonucuna ulaşılır (sınır aşımı görmezden gelinir)","E":"Yalnız 1 yıllık süre kontrol edilip 6 iş günlük süre hiç incelenmezse fesih geçerli sanılır (öğrenme süresi atlanır)","A":"8 iş günü 6 iş günü sınırı içinde sayılırsa süre içi kabul edilir (6 iş günlük sınır atlanır)","B":"6 iş günü esas alınıp olaydaki gerçek süre olan 8 yerine 6 yazılırsa süre dolmuş sonucu doğru ama gerekçe yanlış kurulur (tutar karıştırma)"},"hap":"Ahlak ve iyiniyet kurallarına aykırılıkta fesih hakkı, öğrenmeden itibaren 6 iş günü ve fiilden itibaren 1 yıl geçtikten sonra kullanılamaz; maddi çıkar sağlanmışsa 1 yıllık sınır uygulanmaz.","teshis":{"C":{"gercek":"Kanun 6 iş günü ile sınırlıdır, 8 iş günü bu sınırı aşan bir süredir.","ayirt":"6 iş günü ile karşılaştırdığında olaydaki süre fazla mı?","paragraf":"m.26/1","yanilgi":"8 iş gününün hâlâ süre içinde sayılacağını düşünüyorsun."},"E":{"gercek":"1 yıllık süre yalnız fiil tarihinden itibaren işler; öğrenmeden itibaren 6 iş günlük süre ayrıca ve önce dolabilir.","ayirt":"Öğrenme tarihinden itibaren 6 iş günü geçti mi?","paragraf":"m.26/1","yanilgi":"Sadece fiilin üzerinden 1 yıl geçmediğine bakıp süreyi yeterli buluyorsun."},"A":{"gercek":"İş Kanunu m.26, öğrenmeden itibaren 6 iş günlük süreyi öngörür; 8 iş günü bu sınırı aşar.","ayirt":"Geçen iş günü sayısı 6\u0027dan büyük mü?","paragraf":"m.26/1","yanilgi":"8 iş gününü kanundaki süreye uyumlu sanıyorsun."},"D":{"gercek":"İş Kanunu m.26, iki süreyi BİRLİKTE arar: 6 iş günü ve 1 yıl; ilk dolan süre fesih hakkını sona erdirir.","ayirt":"6 iş günü dolmuş mu, dolmuşsa 1 yıl dolmasa da sonuç ne olur?","paragraf":"m.26/1","yanilgi":"Bu şıkkı elemeye çalışan öğrenci 1 yıllık süreyi tek ölçüt sanıp 6 günlük süreyi göz ardı eder."},"B":{"gercek":"6 iş günü geçtiğinde fesih hakkı, maddi çıkar yoksa kesin olarak kaybedilir.","ayirt":"Süre dolduğunda hangi hak sona erer?","paragraf":"m.26/1","yanilgi":"6 iş günlük sürenin dolduğunu doğru görsen de bunu sonuca bağlamadın."}},"verilen":[[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 109"},"kural":"Sorumluluk Türü Tuzağı: öğrenci işçinin ölümü ya da bedensel zararını hep haksız fiil sorumluluğuna bağlar çünkü kaza fiilen bir haksız fiil gibi görünür. Doğrusu: madde 417 üçüncü fıkrasına göre işverenin kanuna ve sözleşmeye aykırı davranışından doğan bu zararların tazmini, sözleşmeye aykırılıktan doğan sorumluluk hükümlerine tabidir; haksız fiil değildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 109","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Aynı maddenin farklı fıkralarını karıştıran şıklarda önce hangi fıkranın hangi sorumluluk rejimini seçtiğini ayır.","konu":"is kazası işveren sorumluluğu","tablo":null,"siklar":{"C":"İşverenin kanuna ve sözleşmeye aykırı davranışı nedeniyle işçinin ölümüne veya vücut bütünlüğünün zedelenmesine bağlı zararların tazmini, haksız fiil sorumluluğu hükümlerine tabidir.","E":"Adam çalıştıran, ödediği tazminat için, zarar veren çalışana ancak onun bizzat sorumlu olduğu ölçüde rücu hakkına sahiptir.","A":"İşveren, işyerinde iş sağlığı ve güvenliğinin sağlanması için gerekli her türlü önlemi almak, araç ve gereçleri noksansız bulundurmakla yükümlüdür.","D":"Adam çalıştıran, çalışanını seçerken, işiyle ilgili talimat verirken, gözetim ve denetimde bulunurken zararın doğmasını engellemek için gerekli özeni gösterdiğini ispat ederse sorumlu olmaz.","B":"İşçiler de iş sağlığı ve güvenliği konusunda alınan her türlü önleme uymakla yükümlüdür."},"kaynak":{"alinti":"","liste":[{"ad":"TBK (6098 s.K.) m.417","metin":"MADDE 417- İşveren, hizmet ilişkisinde işçinin kişiliğini korumak ve saygı göstermek ve işyerinde dürüstlük ilkelerine uygun bir düzeni sağlamakla, özellikle işçilerin psikolojik ve cinsel tacize uğramamaları ve bu tür tacizlere uğramış olanların daha fazla zarar görmemeleri için gerekli önlemleri almakla yükümlüdür. İşveren, işyerinde iş sağlığı ve güvenliğinin sağlanması için gerekli her türlü önlemi almak, araç ve gereçleri noksansız bulundurmak; işçiler de iş sağlığı ve güvenliği konusunda alınan her türlü önleme uymakla yükümlüdür. İşverenin yukarıdaki hükümler dâhil, kanuna ve sözleşmeye aykırı davranışı nedeniyle işçinin ölümü, vücut bütünlüğünün zedelenmesi veya kişilik haklarının ihlaline bağlı zararların tazmini, sözleşmeye aykırılıktan doğan sorumluluk hükümlerine tabidir. 2. Ev düzeni içinde çalışmada"},{"ad":"TBK (6098 s.K.) m.66","metin":"MADDE 66- Adam çalıştıran, çalışanın, kendisine verilen işin yapılması sırasında başkalarına verdiği zararı gidermekle yükümlüdür. Adam çalıştıran, çalışanını seçerken, işiyle ilgili talimat verirken, gözetim ve denetimde bulunurken, zararın doğmasını engellemek için gerekli özeni gösterdiğini ispat ederse, sorumlu olmaz. Bir işletmede adam çalıştıran, işletmenin çalışma düzeninin zararın doğmasını önlemeye elverişli olduğunu ispat etmedikçe, o işletmenin faaliyetleri dolayısıyla sebep olunan zararı gidermekle yükümlüdür. Adam çalıştıran, ödediği tazminat için, zarar veren çalışana, ancak onun bizzat sorumlu olduğu ölçüde rücu hakkına sahiptir. 2. Hayvan bulunduranın sorumluluğu a. Giderim yükümlülüğü"}],"hakem":"Soru, TBK m.417/3 ve m.66\u0027da yer alan işverenin iş sağlığı ve güvenliğine ilişkin sorumluluk hükümlerine dayanmaktadır; C sikkı, işçinin ölümü/bedensel zararının haksız fiil değil sözleşmeye aykırılıktan doğan sorumluluk hükümlerine tabi olduğunu yanlış bildirerek (doğru: sözleşmeye aykırılıktan doğan sorumluluk) soruyu ölçmektedir."},"kayitlar":[],"sade":{"siklar":{"D":"Adam çalıştıran, çalışanı seçerken, talimat verirken ve gözetim sırasında gerekli özeni gösterdiğini ispat etmişse sorumluluktan kurtulur; bu ifade doğrudur.","E":"Rücu hakkı, çalışanın bizzat sorumlu olduğu ölçüyle sınırlıdır; bu ifade kanun metniyle birebir örtüşür ve doğrudur.","A":"İşverenin iş sağlığı ve güvenliği için gerekli önlemleri almak ve araç gereçleri noksansız bulundurmak yükümlülüğü kanunun açık hükmüdür; bu ifade doğrudur.","B":"İşçilerin alınan iş sağlığı ve güvenliği önlemlerine uyması kanunda açıkça düzenlenmiştir; bu ifade doğrudur."},"dogru":"İşçinin ölümü veya bedensel zarara işveren neden olursa, bu durum haksız fiil değil sözleşmeye aykırılıktan doğan sorumluluğa tabidir. C şıkkı haksız fiil sorumluluğundan bahsettiği için yanlıştır.","sinav":"Türk Borçlar Kanunu 417. madde","kavramlar":[{"kaynak":"Türk Borçlar Kanunu 417. madde","tanim":"İşverenin işyerinde çalışanları korumak için gerekli tüm önlemleri almak, araç ve gereçleri noksansız bulundurmak zorunda olduğu yükümlülük.","ad":"İş sağlığı ve güvenliğini sağlama yükümlülüğü"},{"kaynak":"Türk Borçlar Kanunu 417. madde","tanim":"İşverenin kanuna ve sözleşmeye aykırı davranışı nedeniyle işçiye verdiği zararların tazminine ilişkin sorumluluk türü; haksız fiilden farklıdır.","ad":"Sözleşmeye aykırılıktan doğan sorumluluk"},{"kaynak":"Türk Borçlar Kanunu 66. madde","tanim":"Çalışanın işini yapması sırasında başkalarına verdiği zarardan adam çalıştıranın sorumlu olması; ancak gerekli özeni ispat etmişse veya çalışanın bizzat sorumluluğu ölçüsünce sınırlı olur.","ad":"Adam çalıştıranın sorumluluğu"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027nun işverenin iş sağlığı ve güvenliğini sağlama yükümlülüğü ile adam çalıştıranın sorumluluğuna ilişkin hükümlerine göre aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-36","verilenler":[],"dayanak":"6098 sayılı Türk Borçlar Kanunu m.417/2-3 ve m.66/2-son","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[],"anahtar":[{"ornek":"sorumluluk","kok":"soruml"},{"ornek":"haksız","kok":"haksız"},{"ornek":"sözleşmeye","kok":"sözleş"},{"ornek":"aykırı","kok":"aykırı"},{"ornek":"davranışından","kok":"davran"},{"ornek":"hükümlerine","kok":"hüküml"}],"konuGiris":{"harita":"Ne zaman test edilir: İşçinin ölümü, bedensel zarar veya kişilik hakkı ihlali işveren kusuruna bağlanabildiğinde. Nasıl ölçülür: İşverenin gerekli özeni gösterip göstermediği ispat yüküyle değerlendirilir. Nasıl kaydedilir: Sorumluluk, sözleşmeye aykırılıktan doğan sorumluluk hükümlerine göre belirlenir.","desen":"Soru genellikle m.417 ve m.66 hükümlerini karıştırarak, işverenin her durumda kusursuz sorumlu olduğu gibi yanlış bir seçenek sunar. Tuzak, \u0027gerekli özeni gösterdiğini ispat ederse sorumlu olmaz\u0027 cümlesinin çarpıtılmasıdır. Bu soru m.417 ve m.66 hükümlerinin birlikte değerlendirilmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İşyerinde iş sağlığı ve güvenliği için gerekli önlemleri alma zorunluluğu","ad":"İşverenin koruma yükümlülüğü","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Çalışanın iş sırasında verdiği zararı giderme yükümlülüğü","ad":"Adam çalıştıranın sorumluluğu","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Adam çalıştıranın gerekli özeni gösterdiğini ispatlayarak sorumluluktan kurtulması","ad":"Kurtuluş kanıtı (ispat)","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Ödenen tazminatın, kusurlu çalışana geri istenmesi hakkı","ad":"Rücu hakkı","kim":"kanun sabitler"}],"sinavda":"İşverenin iş sağlığı ve güvenliği yükümlülüğüne ilişkin hükümler verilir ve yanlış ifade edilen seçenek sorulur.","panel_ornek":"Bir markette çalışan Elif, rafları düzenlerken merdivenden düşüp ayağını burkuyor; market sahibi merdivenin bakımını hiç yaptırmamış. Elif\u0027in tedavi masrafı 3.000 lira tutuyor ve market sahibi bunu ödemek zorunda kalıyor çünkü gerekli önlemi almamış. Eğer market sahibi merdiveni düzenli kontrol ettirdiğini kanıtlasaydı, sorumluluktan kurtulabilirdi.","ornek":"Bir markette çalışan Elif, rafları düzenlerken merdivenden düşüp ayağını burkuyor; market sahibi merdivenin bakımını hiç yaptırmamış. Elif\u0027in tedavi masrafı 3.000 lira tutuyor ve market sahibi bunu ödemek zorunda kalıyor çünkü gerekli önlemi almamış. Eğer market sahibi merdiveni düzenli kontrol ettirdiğini kanıtlasaydı, sorumluluktan kurtulabilirdi.","yontemler":"Her seçenek m.417 ve m.66 metniyle birebir karşılaştırılır; kanun metninden sapan ifade yanlış kabul edilir.","nedir":"Bu konu işverenin işçinin sağlığını ve güvenliğini koruma yükümlülüğünü ve iş kazasından doğan sorumluluğu anlatır. Sınav, işverenin hangi durumda sorumluluktan kurtulabildiğini ve sorumluluğun hangi hükümlere tabi olduğunu ölçer."},"olay":"","tuzak":{"D":{"ad":"Kurtuluş Kanıtı Tuzağı","metin":"öğrenci adam çalıştıranın sorumluluğunun mutlak ve kurtuluş kanıtsız olduğunu düşünüp bu şıkkı yanlış sayabilir. Doğrusu: kanun, gerekli özenin ispatı hâlinde adam çalıştıranın sorumluluktan kurtulacağını açıkça düzenlemiştir."},"E":{"ad":"Rücu Kapsamı Tuzağı","metin":"öğrenci adam çalıştıranın ödediği tazminatın tamamını her durumda çalışana rücu edebileceğini sanabilir. Doğrusu: rücu hakkı, çalışanın bizzat sorumlu olduğu ölçüyle sınırlıdır, ifade bu haliyle doğrudur."},"A":{"ad":"Ne soruluyor","metin":"beş ifadeden hangisinin kanun hükmüne aykırı olduğu soruluyor. Kural: Türk Borçlar Kanununun 417 nci maddesinin ikinci fıkrasına göre işveren iş sağlığı ve güvenliği için gerekli her türlü önlemi almak ve araç gereci noksansız bulundurmakla yükümlüdür. Doğrusu: bu ifade kanun metniyle birebir örtüştüğü için doğrudur, yanlış şık bu değildir."},"B":{"ad":"Aynı Fıkra Tuzağı","metin":"öğrenci işçinin yükümlülüğünü ayrı bir kural sanıp bu şıkkı yanlış işaretleyebilir. Doğrusu: madde metninde işçilerin de alınan önlemlere uyacağı açıkça yazılıdır, ifade doğrudur."}},"celdiriciYol":{},"hap":"İşverenin kanuna ve sözleşmeye aykırı davranışından doğan işçinin ölüm veya bedensel zararının tazmini, haksız fiil değil sözleşmeye aykırılıktan doğan sorumluluk hükümlerine tabidir.","teshis":{"C":{"gercek":"TBK m.417/3 bu zararların tazminini açıkça sözleşmeye aykırılıktan doğan sorumluluk hükümlerine tabi kılar; kanun koyucu bilinçli olarak akdi sorumluluk rejimini seçmiştir.","ayirt":"Madde bu zararı hangi sorumluluk rejimine bağladığını açıkça söylüyor mu?","paragraf":"TBK m.417/3","yanilgi":"İşçinin ölümü ya da bedensel zararı fiilen bir kaza olduğu için bunun mutlaka haksız fiil sorumluluğu doğuracağını sanıyorsun."},"E":{"gercek":"TBK m.66 son fıkra rücu hakkını çalışanın bizzat sorumlu olduğu ölçüyle sınırlar, tam rücu kuralı yoktur.","ayirt":"Rücu hakkı sınırsız mı yoksa çalışanın kusuru ölçüsünde mi?","paragraf":"TBK m.66/son","yanilgi":"Adam çalıştıranın ödediği tazminatın tamamını her koşulda çalışana rücu edebileceğini sanıyorsun."},"A":{"gercek":"Türk Borçlar Kanunu m.417/2 işverenin işyerinde her türlü önlemi alma ve araç gereç noksansız bulundurma yükümlülüğünü açıkça düzenler.","ayirt":"Bu ifade madde metninin birebir tekrarı mı?","paragraf":"TBK m.417/2","yanilgi":"İş sağlığı güvenliği önlemlerinin sadece iş kanunu kapsamında düzenlendiğini, Borçlar Kanununda ayrıca yer almadığını sanıyorsun."},"D":{"gercek":"TBK m.66/2 adam çalıştırana, seçim, talimat, gözetim ve denetimde gerekli özeni gösterdiğini ispat ederek sorumluluktan kurtulma imkânı tanır.","ayirt":"Kanun burada bir ispat imkânından söz ediyor mu?","paragraf":"TBK m.66/2","yanilgi":"Adam çalıştıranın sorumluluğunun kurtuluş kanıtı imkânı olmayan mutlak bir sorumluluk olduğunu sanıyorsun."},"B":{"gercek":"Aynı fıkra işçilere de alınan önlemlere uyma yükümlülüğü yükler, karşılıklı bir düzen kurulmuştur.","ayirt":"Madde hem işvereni hem işçiyi mi bağlıyor?","paragraf":"TBK m.417/2","yanilgi":"İşçinin önlemlere uyma yükümlülüğünün ayrı bir kanunda düzenlendiğini, bu maddede geçmediğini sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 109"},"kural":"5510 sayılı Kanun m.13/1-c, görevli olarak işyeri dışına gönderilen sigortalının asıl işini yapmaksızın geçen zamanını iş kazası hâli sayar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metnindeki her bendin şartını (yer, neden, süre, araç kaynağı) tek tek karşılaştır; şıklardaki tek kelime farkını yakala.","konu":"is kazası sayılan haller","tablo":{"satirlar":[["VERİLENLER","-","-"],["Madde numarası","13","-"],["HESAP","-","-"],["A) Sigortalının, işyeri dışında kendi özel işini görmek ama…","m.13/1-a","YANLIŞ ifade"],["B) İşveren tarafından yürütülmekte olan işle bağı bulunmaks…","m.13/1-b","YANLIŞ ifade"],["C) Bir işverene bağlı çalışan sigortalının, görevli olarak …","m.13/1-c","doğru ifade"],["D) Emziren kadın sigortalının, süt izni süresi dolduktan so…","m.13/1-d","YANLIŞ ifade"],["E) Sigortalının, kendi temin ettiği özel taşıtla işin yapıl…","m.13/1-e","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Bir işverene bağlı çalışan sigortalının, görevli olarak işyeri dışında başka bir yere gönderilmesi nedeniyle asıl işini yapmaksızın geçen zamanlarda meydana gelen olay.","E":"Sigortalının, kendi temin ettiği özel taşıtla işin yapıldığı yere gidiş gelişi sırasında meydana gelen olay.","A":"Sigortalının, işyeri dışında kendi özel işini görmek amacıyla bulunduğu sırada meydana gelen ve onu bedenen engelli hâle getiren olay.","D":"Emziren kadın sigortalının, süt izni süresi dolduktan sonra kendi isteğiyle işyerinde uzattığı zamanda meydana gelen olay.","B":"İşveren tarafından yürütülmekte olan işle bağı bulunmaksızın, bağımsız çalışan sigortalının dinlenme amacıyla gittiği yerde meydana gelen olay."},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.13 [1/2]","metin":"MADDE 13- İş kazası; a) Sigortalının işyerinde bulunduğu sırada, b) (Değişik: 17/4/2008-5754/8 md.) İşveren tarafından yürütülmekte olan iş nedeniyle sigortalı kendi adına ve hesabına bağımsız çalışıyorsa yürütmekte olduğu iş nedeniyle, c) Bir işverene bağlı olarak çalışan sigortalının, görevli olarak işyeri dışında başka bir yere gönderilmesi nedeniyle asıl işini yapmaksızın geçen zamanlarda, d) (Değişik: 17/4/2008-5754/8 md.) Bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamındaki emziren kadın sigortalının, iş mevzuatı gereğince çocuğuna süt vermek için ayrılan zamanlarda, e) Sigortalıların, işverence sağlanan bir taşıtla işin yapıldığı yere gidiş gelişi sırasında, meydana gelen ve sigortalıyı hemen veya sonradan bedenen ya da ruhen engelli hâle getiren olaydır.25 İş kazasının 4 üncü maddenin birinci fıkrasının; a) (a) bendi ile 5 inci madde kapsamında bulunan sigortalılar bakımından bunları çalıştıran işveren tarafından, o yer yetkili kolluk kuvvetlerine derhal ve Kuruma da en geç kazadan sonraki üç işgünü içinde, b) (b) bendi kapsamında bulunan sigortalı bakımından kendisi tarafından, bir ayı geçmemek şartıyla rahatsızlığının bildirim yapmaya engel olmadığı günden sonra üç işgünü içinde, c) (Mülga: 17/4/2008-5754/8 md.) (Değişik paragraf: 17/4/2008-5754/8 md.) iş kazası ve meslek hastalığı bildirgesi ile doğrudan ya da taahhütlü posta ile Kuruma bildirilmesi zorunludur. Bu fıkranın (a) bendinde belirtilen süre, iş kazasının işverenin kontrolü dışındaki yerlerde meydana gelmesi halinde, iş kazasının öğrenildiği tarihten itibaren başlar."},{"ad":"5510 s. SGK Kanunu m.13 [2/2]","metin":"Kuruma bildirilen olayın iş kazası sayılıp sayılmayacağı hakkında bir karara varılabilmesi için gerektiğinde, Kurumun denetim ve kontrol ile yetkilendirilen memurları tarafından veya Bakanlık iş müfettişleri vasıtasıyla soruşturma yapılabilir. Bu soruşturma sonunda yazılı olarak bildirilen hususların gerçeğe uymadığı ve olayın iş kazası olmadığı anlaşılırsa, Kurumca bu olay için yersiz olarak yapılmış bulunan ödemeler, ödemenin yapıldığı tarihten itibaren gerçeğe aykırı bildirimde bulunanlardan, 96 ncı madde hükmüne göre tahsil edilir. İş kazası ve meslek hastalığı bildirgesinin şekli ve içeriği, verilme usûlü ile bu Bu bölüm başlığı “Kısa Vadeli Sigorta Hükümleri” iken, 17/4/2008 tarihli ve 5754 sayılı Kanunun 65 inci maddesiyle metne işlendiği şekilde değiştirilmiştir. 25 25/4/2013 tarihli ve 6462 sayılı Kanunun 1 inci maddesiyle, bu bentte yer alan “özüre uğratan” ibaresi “engelli hâle getiren” şeklinde değiştirilmiştir. 24 maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir. Meslek hastalığının tanımı, bildirilmesi ve soruşturulması"}],"hakem":"Doğru sık (C), 5510 s.k. m.13/1-c\u0027de yer alan iş kazası hâliyle birebir örtüşmektedir."},"kayitlar":[],"sade":{"siklar":{"D":"Kanun yalnız mevzuat gereği ayrılan resmi süt iznini korur. Bu sürenin bitiminden sonra çalışanın kendi isteğiyle kaldığı ek zaman iş kazası kapsamına girmez.","E":"Gidiş-geliş kazaları yalnız işveren tarafından sağlanan taşıtlar için sayılır. Sigortalının kendi taşıtıyla yapılan gidiş-geliş bu hükmün dışında kalır.","A":"Sigortalı işyeri dışında özel işini yaparken kazaya uğrasa bile, kanun iş kazasını işyerinde bulunma şartını arar. Özel iş amaçlı işyeri dışında olunması bu kapsamdan çıkarır.","B":"Bağımsız çalışan için kanun işverenin yürütmekte olduğu işle bağlantı ister. Dinlenme amacıyla gidilen yerde olay işin kendisiyle ilişkili olmadığından iş kazası sayılmaz."},"dogru":"İşveren tarafından başka bir yere görevlendirilirken, asıl işi yapmayan süreler iş kazası sayılır. Diğer seçeneklerde ya işle ilgisiz aktiviteler ya da kendi sağlanan olmayan araçlar söz konusu olduğundan kapsam dışındadır.","sinav":"5510 Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 13. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 13. madde","tanim":"Sigortalının belirli durumlarda maruz kaldığı ve onu bedenen ya da ruhen engelli hâle getiren olay. Kanun iş kazasının hangi koşullarda sayılacağını sırayla açıklar.","ad":"İş kazası"},{"kaynak":"5510 s. SGK Kanunu 13. madde","tanim":"Bir işverene bağlı çalışanın, işveren tarafından işyeri dışında başka bir yere gönderilmesi durumu. Bu sırada asıl işini yapmayan zaman iş kazası kapsamına girer.","ad":"Görevli olarak işyeri dışında gönderilme"},{"kaynak":"5510 s. SGK Kanunu 13. madde","tanim":"Sigortalıyı hemen veya sonradan bedensel ya da ruhsal engelliliğe yol açan olay. İş kazasının tanımında bu sonucun meydana gelmesi zorunlu koşuldur.","ad":"Engelli hâle getiren olay"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027nun 13 üncü maddesine göre aşağıdaki hâllerden hangisi iş kazası sayılır?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-34","verilenler":[{"deger":"13","anlam":"İş kazası tanımının ve kapsamının yer aldığı kanun maddesinin numarası.","ad":"Madde numarası"}],"dayanak":"5510 sayılı Kanun m.13/1","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027daki bir mobilya fabrikasının işçisi Kemal, 3 Mart günü İzmir\u0027deki bayiye montaj için görevlendiriliyor. Kemal İzmir\u0027e vardığında henüz montaja başlamadan, bayinin deposunda beklerken bir raf üzerine düşüyor ve kolu kırılıyor.","anlatim":"Kemal o an fabrikadaki asıl işini yapmıyor, sadece görevli gönderildiği yerde bekliyor. Bu olay üzerinden beş ihtimali tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanun m.13\u0027te beş hâl sayılmış: işyerinde olma, bağımsız çalışanın işi nedeniyle olma, görevli gönderilip asıl işi yapmama, süt izni, işverenin sağladığı taşıtla gidiş geliş.","anlatim":"Kemal\u0027in kolu kırılması hangi bende girer, hangileri girmez, bunu göreceğiz. Şimdi beş ifadeyi bu olayda tek tek deneyelim.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.13/1-a","karar":"yanlış","anlatim":"Burada Kemal işyerinde değil, kendi özel işini görüyor. Kanun yalnız işyerinde bulunma hâlini sayıyor, bu durum ona girmiyor.","formul":"Şık A: Kemal, İzmir\u0027e gitmişken kendi özel eşyasını almak için çarşıya çıksa ve orada düşse, bunu iş kazası sayar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.13/1-b","karar":"yanlış","anlatim":"Bağımsız çalışanda kural, olayın yürüttüğü iş nedeniyle olmasını arar. Dinlenme sırasında olan, işle bağı olmayan olay bu bendin dışında kalır.","formul":"Şık B: Kemal bağımsız çalışan olsaydı ve İzmir\u0027de işiyle hiç ilgisi olmayan bir dinlenme yerinde kaza geçirseydi, iş kazası olur muydu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.13/1-c","karar":"doğru","anlatim":"Kanun tam olarak bu durumu tarif ediyor, görevli gönderilme ve asıl işini yapmaksızın geçen zaman. Kemal\u0027in olayı bu tarife birebir uyuyor.","formul":"Şık C: Kemal işverene bağlı çalışıyor, görevli olarak İzmir\u0027e gönderilmiş ve asıl işini henüz yapmadan beklerken düşmüş, bunu iş kazası sayar mısın?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.13/1-d","karar":"yanlış","anlatim":"Kanun yalnız iş mevzuatının tanıdığı süt izni süresini kapsıyor. İznin dışına taşan, kendi isteğiyle uzatılan süre bu bende girmiyor.","formul":"Şık D: Kemal\u0027in eşi de aynı fabrikada çalışan emziren bir işçi, süt izni bitmiş ama o kendi isteğiyle izni uzatmış ve o sırada kaza geçirmiş, bunu sayar mısın?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.13/1-e","karar":"yanlış","anlatim":"Kanun işverenin sağladığı taşıtla gidiş gelişi arıyor. Kemal kendi taşıtını kullandığı için bu bent onu kapsamıyor.","formul":"Şık E: Kemal kendi arabasıyla İzmir\u0027e gitseydi ve yolda kaza geçirseydi, bunu iş kazası sayar mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Kemal\u0027in olayı sadece görevli gönderilip asıl işini yapmadığı zaman dilimine uyduğu için iş kazasıdır. Kendine hep şunu sor: olay tam olarak hangi bendin kelimelerine harfiyen uyuyor?","doldur":[]}],"anahtar":[{"ornek":"görevli","kok":"görevl"},{"ornek":"gönderilen","kok":"gönder"},{"ornek":"kazası","kok":"kazası"},{"ornek":"bendin","kok":"bendin"},{"ornek":"işyeri","kok":"işyeri"},{"ornek":"sadece","kok":"sadece"}],"konuGiris":{"harita":"Ne zaman test edilir: olay hangi hâlde meydana geldiği sorulduğunda test edilir. Nasıl ölçülür: olayın kanunda sayılan beş hâlden birine uyup uymadığına bakılarak ölçülür. Nasıl kaydedilir: iş kazası ve meslek hastalığı bildirgesiyle Kuruma bildirilerek kaydedilir.","desen":"Soru genelde beş hâlden birini seçenek yapıp, kişisel araçla veya işle ilgisiz zamanda olan olayları çeldirici olarak sunar. Tuzak, işveren taşıtı ile kişisel taşıt arasındaki farkı karıştırmaktır. Bu soru m.13\u0027teki iş kazası hâlleri listesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Sigortalının işyerinde bulunduğu sırada meydana gelen olay","ad":"İşyerinde bulunma hâli","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Başka yere görevli gönderilen sigortalının o sürede yaşadığı olay","ad":"Görevli gönderilme hâli","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Süt izni sırasında meydana gelen olayın kaza sayılması","ad":"Emziren kadın izni hâli","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İşverenin sağladığı taşıtla işe gidiş dönüş sırasında olan olay","ad":"İşveren taşıtıyla gidiş geliş hâli","kim":"kanun sabitler"}],"sinavda":"Sınavda bir olay senaryosu verilir ve bunun iş kazası sayılıp sayılmadığı sorulur.","panel_ornek":"Bir kurye, işvereninin verdiği motosikletle depodan eve dönerken küçük bir kazaya karışıyor. Bu, iş için ayrılan araçla yol sırasında olduğu için iş kazası sayılır, tıpkı örneğin 15 dakikalık teslimat molası gibi işin bir parçasıdır. Oysa kuryenin akşam kendi arabasıyla arkadaşını gezdirirken yaptığı kaza bu kapsama girmez.","ornek":"Bir kurye, işvereninin verdiği motosikletle depodan eve dönerken küçük bir kazaya karışıyor. Bu, iş için ayrılan araçla yol sırasında olduğu için iş kazası sayılır, tıpkı örneğin 15 dakikalık teslimat molası gibi işin bir parçasıdır. Oysa kuryenin akşam kendi arabasıyla arkadaşını gezdirirken yaptığı kaza bu kapsama girmez.","yontemler":"Olayın beş hâlden hangisine girdiğini tek tek elemeyle bulmak en güvenli yöntemdir.","nedir":"İş kazası sayılan haller, sigortalının hangi durumlarda uğradığı olayın kaza sayılıp sağlık ve tazminat haklarını doğuracağını belirler. Sınav bu hallerin kanunda sayılan beş duruma uyup uymadığını ölçer."},"olay":"","tuzak":{"D":{"ad":"Süt İzni Kapsamı Tuzağı","metin":"Öğrenci emziren kadına tanınan her serbest zamanı kapsar sanır, oysa kanun yalnız mevzuat gereği ayrılan süt iznini kapsar. Doğrusu: iznin bitiminden sonraki gönüllü süre bu bende girmez."},"E":{"ad":"Taşıt Kaynağı Tuzağı","metin":"Öğrenci her işe gidiş-geliş kazasını kapsar sanır, kanun ise işverence sağlanan taşıtı şart koşar. Doğrusu: sigortalının kendi taşıtıyla yaptığı gidiş-geliş bu bent dışındadır."},"A":{"ad":"İşyeri Dışı Tuzağı","metin":"Öğrenci \u0027işyeri dışında olsa da olay çalışırken oldu\u0027 diye düşünür, oysa madde bu bentte sigortalının işyerinde bulunmasını şart koşar. Doğrusu: özel işle işyeri dışında bulunma bu bent kapsamına girmez."},"B":{"ad":"İş Bağı Tuzağı","metin":"Öğrenci bağımsız çalışanın her hâlini iş kazası sanır, ancak kanun yürütülmekte olan iş nedeniyle olmasını arar. Doğrusu: işle ilgisiz dinlenme zamanı iş kazası sayılmaz."}},"celdiriciYol":{"D":"m.13/1-d\u0027deki \u0027iş mevzuatı gereğince ayrılan süt izni\u0027 süresi, izin bitiminden sonraki gönüllü süreyle değiştirilmiştir (süre sınırı genişletilmiştir).","E":"m.13/1-e\u0027deki \u0027işverence sağlanan taşıt\u0027 unsuru \u0027kendi temin ettiği taşıt\u0027 ile değiştirilmiştir (taşıtın kaynağı unsuru ters çevrilmiştir).","A":"m.13/1-a\u0027daki \u0027işyerinde bulunduğu sırada\u0027 şartı yerine \u0027işyeri dışında özel iş\u0027 yazılmıştır (bent şartının yer unsuru değiştirilmiştir).","B":"m.13/1-b\u0027deki \u0027iş nedeniyle\u0027 bağı çıkarılıp yalnız bağımsız çalışma sıfatı bırakılmıştır (nedensellik unsuru atlanmıştır)."},"hap":"İş kazası sayılan haller 5510 sayılı Kanunun 13 üncü maddesinde beş bent halinde sayılmıştır; her bendin kendine özgü yer, neden ya da araç şartı vardır.","teshis":{"C":{"gercek":"m.13/1-c, işverene bağlı sigortalının görevli gönderildiği yerde asıl işini yapmaksızın geçen zamanı açıkça iş kazası hâli sayar.","ayirt":"Sigortalı görevli mi gönderildi ve asıl işini yapmıyor muydu?","paragraf":"5510 s.K. m.13/1-c","yanilgi":"Bu bendin görevlendirme ile asıl iş dışı zaman şartını gözden kaçırıp genel bir \u0027iş dışı olay\u0027 sanabilirsin."},"E":{"gercek":"m.13/1-e işverence sağlanan taşıtla gidiş-gelişi arar; sigortalının kendi taşıtı bu bende girmez.","ayirt":"Taşıtı işveren mi sağladı, yoksa sigortalı kendi mi temin etti?","paragraf":"5510 s.K. m.13/1-e","yanilgi":"Taşıtın kim tarafından sağlandığına bakmaksızın işe gidiş-gelişi otomatik kapsıyorsun."},"A":{"gercek":"m.13/1-a yalnız sigortalının işyerinde bulunduğu sırada meydana gelen olayı kapsar.","ayirt":"Olay işyerinde mi, yoksa dışarıda kendi işiyle mi meydana geldi?","paragraf":"5510 s.K. m.13/1-a","yanilgi":"İşyeri dışında olsa da çalışma amacıyla orada bulunmayı yeterli sayıyorsun."},"D":{"gercek":"m.13/1-d yalnız iş mevzuatı gereği ayrılan süt iznini kapsar, iznin dışına taşan süre kapsam dışıdır.","ayirt":"Bu süre mevzuatın tanıdığı süt izni süresi içinde mi?","paragraf":"5510 s.K. m.13/1-d","yanilgi":"Süt izni bitince de o zaman dilimini kanuni izin kapsamında sanıyorsun."},"B":{"gercek":"m.13/1-b yürütülmekte olan iş nedeniyle geçirilen olayı arar, işle ilgisiz zamanı kapsamaz.","ayirt":"Olay yürütülen işle nedensellik bağı taşıyor mu?","paragraf":"5510 s.K. m.13/1-b","yanilgi":"Bağımsız çalışanın her zaman diliminde geçirdiği olayı iş kazası sanıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 109"},"kural":"Madde 13/1-e yalnız işverence sağlanan bir taşıtla işe gidiş gelişi iş kazası sayar; sigortalının kendi özel aracıyla yaptığı yolculuk bu kapsamda değildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Beş halin kanundaki bentlerini (a-e) sırayla say, hangisinin metne ek bir koşul (işverence sağlanan taşıt gibi) taşıdığını gözden geçir.","konu":"is kazası sayılan haller","tablo":{"satirlar":[["A) Sigortalının işyerinde bulunduğu sırada meydana gelen ve…","m.13/1-a","doğru ifade"],["B) Kendi adına ve hesabına bağımsız çalışan sigortalının, y…","m.13/1-b","doğru ifade"],["C) Sigortalının kendi özel aracıyla işin yapıldığı yere gid…","m.13/1-e","YANLIŞ ifade"],["D) Görevli olarak işyeri dışında başka bir yere gönderilen …","m.13/1-c","doğru ifade"],["E) Emziren kadın sigortalının, çocuğuna süt vermek için ayr…","m.13/1-d","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Sigortalının kendi özel aracıyla işin yapıldığı yere gidiş gelişi sırasında meydana gelen olay","E":"Emziren kadın sigortalının, çocuğuna süt vermek için ayrılan zamanlarda meydana gelen olay","A":"Sigortalının işyerinde bulunduğu sırada meydana gelen ve onu bedenen ya da ruhen engelli hâle getiren olay","D":"Görevli olarak işyeri dışında başka bir yere gönderilen sigortalının, asıl işini yapmaksızın geçen zamanlarda meydana gelen olay","B":"Kendi adına ve hesabına bağımsız çalışan sigortalının, yürütmekte olduğu iş nedeniyle meydana gelen olay"},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.13 [1/2]","metin":"MADDE 13- İş kazası; a) Sigortalının işyerinde bulunduğu sırada, b) (Değişik: 17/4/2008-5754/8 md.) İşveren tarafından yürütülmekte olan iş nedeniyle sigortalı kendi adına ve hesabına bağımsız çalışıyorsa yürütmekte olduğu iş nedeniyle, c) Bir işverene bağlı olarak çalışan sigortalının, görevli olarak işyeri dışında başka bir yere gönderilmesi nedeniyle asıl işini yapmaksızın geçen zamanlarda, d) (Değişik: 17/4/2008-5754/8 md.) Bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamındaki emziren kadın sigortalının, iş mevzuatı gereğince çocuğuna süt vermek için ayrılan zamanlarda, e) Sigortalıların, işverence sağlanan bir taşıtla işin yapıldığı yere gidiş gelişi sırasında, meydana gelen ve sigortalıyı hemen veya sonradan bedenen ya da ruhen engelli hâle getiren olaydır.25 İş kazasının 4 üncü maddenin birinci fıkrasının; a) (a) bendi ile 5 inci madde kapsamında bulunan sigortalılar bakımından bunları çalıştıran işveren tarafından, o yer yetkili kolluk kuvvetlerine derhal ve Kuruma da en geç kazadan sonraki üç işgünü içinde, b) (b) bendi kapsamında bulunan sigortalı bakımından kendisi tarafından, bir ayı geçmemek şartıyla rahatsızlığının bildirim yapmaya engel olmadığı günden sonra üç işgünü içinde, c) (Mülga: 17/4/2008-5754/8 md.) (Değişik paragraf: 17/4/2008-5754/8 md.) iş kazası ve meslek hastalığı bildirgesi ile doğrudan ya da taahhütlü posta ile Kuruma bildirilmesi zorunludur. Bu fıkranın (a) bendinde belirtilen süre, iş kazasının işverenin kontrolü dışındaki yerlerde meydana gelmesi halinde, iş kazasının öğrenildiği tarihten itibaren başlar."},{"ad":"5510 s. SGK Kanunu m.13 [2/2]","metin":"Kuruma bildirilen olayın iş kazası sayılıp sayılmayacağı hakkında bir karara varılabilmesi için gerektiğinde, Kurumun denetim ve kontrol ile yetkilendirilen memurları tarafından veya Bakanlık iş müfettişleri vasıtasıyla soruşturma yapılabilir. Bu soruşturma sonunda yazılı olarak bildirilen hususların gerçeğe uymadığı ve olayın iş kazası olmadığı anlaşılırsa, Kurumca bu olay için yersiz olarak yapılmış bulunan ödemeler, ödemenin yapıldığı tarihten itibaren gerçeğe aykırı bildirimde bulunanlardan, 96 ncı madde hükmüne göre tahsil edilir. İş kazası ve meslek hastalığı bildirgesinin şekli ve içeriği, verilme usûlü ile bu Bu bölüm başlığı “Kısa Vadeli Sigorta Hükümleri” iken, 17/4/2008 tarihli ve 5754 sayılı Kanunun 65 inci maddesiyle metne işlendiği şekilde değiştirilmiştir. 25 25/4/2013 tarihli ve 6462 sayılı Kanunun 1 inci maddesiyle, bu bentte yer alan “özüre uğratan” ibaresi “engelli hâle getiren” şeklinde değiştirilmiştir. 24 maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir. Meslek hastalığının tanımı, bildirilmesi ve soruşturulması"}],"hakem":"Soru, 5510 sayılı Kanun m.13/1-e\u0027de tanımlanan iş kazası kapsamını test ediyor; doğru sık (C), yalnız işverence sağlanan taşıtla gidiş-gelişin iş kazası sayıldığını, kendi özel aracının kapsamda olmadığını doğru şekilde yansıtıyor."},"kayitlar":[],"sade":{"siklar":{"D":"Görevli olarak başka yere gönderilen sigortalının asıl işini yapmadığı zamanlarda meydana gelen olay, kanun tarafından iş kazası sayılır; bu şık doğru bir hâldir.","E":"Emziren kadının çocuğuna süt vermek için ayrılan zaman, kanun tarafından iş kazası hâli olarak düzenlenmiştir; bu şık doğru bir hâldir.","A":"İşyerinde bulunma sırasında meydana gelen ve engelli hâle getiren olay, kanun tarafından açıkça iş kazası olarak sayılır; bu şık soruya cevap olamaz.","B":"Kendi adına çalışan sigortalının işi nedeniyle meydana gelen olay, kanun tarafından iş kazası kapsamına alınmıştır; bu şık doğru bir hâldir."},"dogru":"Kanun, işverence sağlanan araçla gidiş gelişi iş kazası sayar. Sigortalının kendi özel arabasıyla işe gidişinde meydana gelen olay bu koruma kapsamı dışında kalır ve iş kazası sayılmaz.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 13. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 13. madde","tanim":"İşveren tarafından karşılanan ve sigortalının işe gidiş gelişi için kullanılan araç; bu araçla yapılan yolculuk iş kazası kapsamına girer.","ad":"İşverence sağlanan taşıt"},{"kaynak":"5510 s. SGK Kanunu 13. madde","tanim":"Sigortalının işini yaptığı yerde bulunması sırasında meydana gelen olaylar; iş kazası kapsamında korunan durumdur.","ad":"İşyerinde bulunma hâli"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027na göre, aşağıdaki hâllerden hangisinde meydana gelen olay iş kazası sayılmaz?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-34","verilenler":[],"dayanak":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu m.13/1-e","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir tekstil atölyesinde çalışan Mehmet, 14 Mart günü işverenin gönderdiği servis yerine kendi motosikletiyle işe gidiyor ve yolda düşüp kolunu kırıyor.","anlatim":"Aynı gün mesai arkadaşı Ayşe, işyerinde makine başında elini kesiyor. Bir başka arkadaşı Kemal ise şirket adına Konya\u0027ya görevlendirilmiş, otelde dinlenirken kalp krizi geçiriyor.","doldur":[]},{"formul":"Ne yapacağız: Kanun m.13/1\u0027de beş hâl sayılmış, bunların dışına çıkan olay iş kazası sayılmaz.","anlatim":"Mehmet\u0027in, Ayşe\u0027nin, Kemal\u0027in ve iki kişinin daha başına gelenleri bu beş bende tek tek uydurup bakacağız. Hangisi bu bentlerin dışında kalıyor, onu bulacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.13/1-a","karar":"doğru","anlatim":"Kanun işyerinde bulunma anını doğrudan kapsıyor, başka koşul aramıyor. Ayşe\u0027nin olayı bu bende tam oturuyor, iş kazasıdır.","formul":"Şık A: Ayşe işyerinde makine başında yaralandı, bunu iş kazası sayar mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.13/1-b","karar":"doğru","anlatim":"Kanun bunu da özellikle düzenlemiş, işveren tarafından yürütülen iş nedeniyle bağımsız çalışan da kapsama girer. Bu şık doğru bir kural cümlesidir.","formul":"Şık B: Kendi hesabına bağımsız çalışan bir sigortalı, yürüttüğü iş sırasında kazaya uğrarsa iş kazası sayar mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.13/1-e","karar":"yanlış","anlatim":"Kanun yalnız işverenin sağladığı taşıtla gidiş gelişi kapsıyor, kendi aracı bu bendin dışında kalıyor. Mehmet\u0027in kazası iş kazası sayılmaz.","formul":"Şık C: Mehmet kendi motosikletiyle işe giderken düştü, bunu iş kazası sayar mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.13/1-c","karar":"doğru","anlatim":"Kanun işyeri dışına görevli gönderilen sigortalının asıl işini yapmadığı zamanları da kapsıyor. Kemal\u0027in durumu bu bende girer, doğrudur.","formul":"Şık D: Kemal görevle gönderildiği Konya\u0027da, asıl işini yapmadığı bir sırada rahatsızlanırsa iş kazası sayar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.13/1-d","karar":"doğru","anlatim":"Kanun bu süreyi açıkça iş mevzuatı gereği ayrılan zaman olarak kapsama almış. Bu şık da doğru bir kural cümlesidir.","formul":"Şık E: Emziren bir kadın sigortalı, çocuğuna süt vermek için ayrıldığı zamanda kaza geçirirse iş kazası sayar mısın?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Beş bentten dördü kuralın içinde, yalnız kendi özel aracıyla gidiş geliş dışarıda kalıyor. Kendine hep şunu sor: taşıtı işveren mi sağladı, yoksa kendi aracı mıydı?","doldur":[]}],"anahtar":[{"ornek":"işverence","kok":"işvere"},{"ornek":"kazası","kok":"kazası"},{"ornek":"kapsamda","kok":"kapsam"},{"ornek":"aracıyla","kok":"aracıy"},{"ornek":"yalnız","kok":"yalnız"},{"ornek":"kalıyor","kok":"kalıyo"}],"konuGiris":{"harita":"Ne zaman test edilir: verilen bir olayın kanundaki beş halden hangisine girip girmediği sorulduğunda. Nasıl ölçülür: seçeneklerdeki durum işyerinde, iş nedeniyle, görevli gönderimde, emzirme izninde veya işveren taşıtında mı gerçekleşmiş diye bakılarak. Nasıl kaydedilir: işveren veya sigortalı tarafından Kuruma süresi içinde bildirim yapılarak.","desen":"Soru, kanunun a-e bentlerinde sayılmayan bir durumu (örneğin kişisel işle ilgisiz bir olay veya kendi aracıyla izinli gidiş) seçenek olarak verip iş kazası SAYILMAZ dedirtmeyi hedefler. Tuzak, işveren taşıtı ile kendi taşıtı arasındaki farkı veya görevli gönderim ile kişisel iş arasındaki farkı karıştırmaktır. Bu soru m.13/1 bentlerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"kanunun saydığı beş durumdan biriyle meydana gelen, bedence veya ruhça zarar veren olay","ad":"iş kazası hali","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"sigortalının fiilen işyerinde olduğu sırada gerçekleşen olay hali","ad":"işyerinde bulunma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işe gidiş gelişte işverenin sağladığı araçla yapılan yolculuk hali","ad":"işverence sağlanan taşıt","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"olayın Kuruma kaç işgünü içinde bildirileceğini gösteren süre kuralı","ad":"bildirim süresi","kim":"kanun sabitler"}],"sinavda":"Beş seçenekte farklı olaylar verilir, hangisinin kanundaki hallerden birine girmediği yani iş kazası sayılmadığı sorulur.","panel_ornek":"Kurye arkadaşın, şirketin verdiği motosikletle işe giderken kaza yapsa bu iş kazası sayılır. Ama izin gününde kendi motosikletiyle markete giderken kaza yapsa, bu iş kazası sayılmaz çünkü iş ile ilgisi yoktur.","ornek":"Kurye arkadaşın, şirketin verdiği motosikletle işe giderken kaza yapsa bu iş kazası sayılır. Ama izin gününde kendi motosikletiyle markete giderken kaza yapsa, bu iş kazası sayılmaz çünkü iş ile ilgisi yoktur.","yontemler":"Her seçeneği tek tek a-e bentleriyle eşleştir; hiçbirine uymayan seçenek doğru cevaptır.","nedir":"Bu konu, bir olayın hangi hallerde \u0027iş kazası\u0027 sayılacağını belirler. Sınav, kanunun saydığı beş halin dışında kalan bir durumu tuzak olarak sorup sorulmadığını ölçer."},"olay":"","tuzak":{"D":{"ad":"D Tuzağı","metin":"Asıl işini yapmadığı için bu zamanın kapsam dışı kalacağını düşünüyorsun. Doğrusu: madde 13/1-c görevli olarak başka yere gönderilme hâlini açıkça iş kazası sayar, bu şık doğru bir hâldir."},"E":{"ad":"E Tuzağı","metin":"Süt izninin işin bizzat yapılmadığı bir ara olduğu için istisna sayılacağını düşünüyorsun. Doğrusu: madde 13/1-d emziren kadının süt izni süresini iş kazası hâli olarak açıkça düzenler, bu şık doğru bir hâldir."},"A":{"ad":"A Tuzağı","metin":"İşyerinde bulunma hâlini kanundaki sayılı hâllerden biri olarak değil ayrıcalık sanıyorsun. Doğrusu: madde 13/1-a bu hâli açıkça iş kazası sayar, dolayısıyla soruya cevap olamaz."},"B":{"ad":"B Tuzağı","metin":"Bağımsız çalışan sigortalının kendi işi olduğu için kapsam dışı kalacağını düşünüyorsun. Doğrusu: madde 13/1-b bu durumu iş kazası saydığından bu şık doğru bir hâldir, aranan cevap değildir."}},"celdiriciYol":{},"hap":"5510 sayılı Kanun\u0027un 13 üncü maddesine göre işe gidiş gelişte iş kazası sayılabilmesi için taşıtın işverence sağlanmış olması şarttır; sigortalının kendi özel aracıyla yaptığı yolculuk bu kapsamda değildir.","teshis":{"C":{"gercek":"Madde 13/1-e yalnız işverence sağlanan taşıtla gidiş gelişi iş kazası sayar; sigortalının kendi özel aracı bu hükmün kapsamı dışındadır.","ayirt":"İşe gidiş gelişte kullanılan taşıtı işveren mi sağladı, yoksa sigortalı kendi aracını mı kullandı?","paragraf":"5510 s.K. m.13/1-e","yanilgi":"Bu şıkkı eleyen öğrenci, taşıtla gidiş gelişin her türlü aracı kapsadığını, aracın kime ait olduğunun önemsiz olduğunu sanır."},"E":{"gercek":"Madde 13/1-d emziren kadın sigortalının süt vermek için ayrılan zamanı açıkça iş kazası hâli sayar.","ayirt":"Olay, iş mevzuatı gereği ayrılan süt izni süresinde mi meydana geldi?","paragraf":"5510 s.K. m.13/1-d","yanilgi":"Süt izninin fiilen çalışılmayan bir zaman dilimi olduğu için kapsam dışı kalacağını sanıyorsun."},"A":{"gercek":"Madde 13/1-a sigortalının işyerinde bulunduğu sırada meydana gelen olayı doğrudan iş kazası sayar, ek koşul aramaz.","ayirt":"Olay işyerinde mi, işverenin sağladığı taşıtta mı, yoksa sigortalının kendi aracında mı meydana geldi?","paragraf":"5510 s.K. m.13/1-a","yanilgi":"İşyerinde bulunma hâlinin özel bir koşula bağlı olduğunu, dolayısıyla bazı durumlarda kapsam dışı kalabileceğini sanıyorsun."},"D":{"gercek":"Madde 13/1-c görevli olarak işyeri dışına gönderilen sigortalının asıl işini yapmaksızın geçen zamanlarını da iş kazası hâli sayar.","ayirt":"Olay, görevli olarak gönderilme sırasında mı meydana geldi?","paragraf":"5510 s.K. m.13/1-c","yanilgi":"Asıl işini yapmadığı zamanların iş kazası kapsamı dışında sayıldığını düşünüyorsun."},"B":{"gercek":"Madde 13/1-b işveren tarafından yürütülen iş nedeniyle bağımsız çalışan sigortalıyı da kapsama alır.","ayirt":"Olay, yürütülmekte olan iş nedeniyle mi meydana geldi?","paragraf":"5510 s.K. m.13/1-b","yanilgi":"Bağımsız çalışanın kendi hesabına çalışması nedeniyle bu hâlin iş kazası kapsamı dışında kalacağını düşünüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 107"},"kural":"m.6/5 uyarınca devreden veya devralan işveren iş sözleşmesini sırf işyerinin devri gerekçesiyle feshedemez ve devir işçi yönünden haklı fesih sebebi oluşturmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 107","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İş Kanunu m.6 sorularında \u0027devir = fesih sebebi\u0027 cümlesi görürsen otomatik yanlış işaretle, madde bunu açıkça yasaklar.","konu":"işyeri devri-is kanunu","tablo":{"satirlar":[["A) Devir tarihinde işyerinde mevcut olan iş sözleşmeleri bü…","m.6/1","doğru ifade"],["B) Devirden önce doğmuş ve devir tarihinde ödenmesi gereken…","m.6/3-4","doğru ifade"],["C) İşçinin hizmet süresinin esas alındığı haklarda devralan…","m.6/2","doğru ifade"],["D) İşyerinin devri, işçi yönünden haklı fesih sebebi oluştu…","m.6/5-6","YANLIŞ ifade"],["E) Tüzel kişiliğin birleşme veya katılma yoluyla sona ermes…","m.6/4","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşçinin hizmet süresinin esas alındığı haklarda devralan işveren, işçinin devreden işveren yanında işe başladığı tarihe göre işlem yapmakla yükümlüdür.","E":"Tüzel kişiliğin birleşme veya katılma yoluyla sona ermesi hâlinde devreden ve devralan işverenin birlikte sorumluluğuna ilişkin hükümler uygulanmaz.","A":"Devir tarihinde işyerinde mevcut olan iş sözleşmeleri bütün hak ve borçlarıyla devralan işverene geçer.","D":"İşyerinin devri, işçi yönünden haklı fesih sebebi oluşturur ve devralan işveren sırf bu gerekçeyle iş sözleşmesini feshedebilir.","B":"Devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devreden işverenin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır."},"kaynak":{"alinti":"te açıkça yer alan kuralın tam tersini söyleyerek (işyeri devri işçi için haklı fesih sebebi OLMAZ, devralan işveren devir sebebiyle feshedemez) soru tarafından istenen","liste":[{"ad":"İş K. (4857 s.K.) m.6","metin":"Madde 6 - İşyeri veya işyerinin bir bölümü hukukî bir işleme dayalı olarak başka birine devredildiğinde, devir tarihinde işyerinde veya bir bölümünde mevcut olan iş sözleşmeleri bütün hak ve borçları ile birlikte devralana geçer. Devralan işveren, işçinin hizmet süresinin esas alındığı haklarda, işçinin devreden işveren yanında işe başladığı tarihe göre işlem yapmakla yükümlüdür. Yukarıdaki hükümlere göre devir halinde, devirden önce doğmuş olan ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren birlikte sorumludurlar. Ancak bu yükümlülüklerden devreden işverenin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır. Tüzel kişiliğin birleşme veya katılma ya da türünün değişmesiyle sona erme halinde birlikte sorumluluk hükümleri uygulanmaz. Devreden veya devralan işveren iş sözleşmesini sırf işyerinin veya işyerinin bir bölümünün devrinden dolayı feshedemez ve devir işçi yönünden fesih için haklı sebep oluşturmaz. Devreden veya devralan işverenin ekonomik ve teknolojik sebeplerin yahut iş organizasyonu değişikliğinin gerekli kıldığı fesih hakları veya işçi ve işverenlerin haklı sebeplerden derhal fesih hakları saklıdır. Yukarıdaki hükümler, iflas dolayısıyla malvarlığının tasfiyesi sonucu işyerinin veya bir bölümünün başkasına devri halinde uygulanmaz. Geçici iş ilişkisi"},{"ad":"İş K. (4857 s.K.) m.2 [1/3]","metin":"Madde 2 - Bir iş sözleşmesine dayanarak çalışan gerçek kişiye işçi, işçi çalıştıran gerçek veya tüzel kişiye yahut tüzel kişiliği olmayan kurum ve kuruluşlara işveren, işçi ile işveren arasında kurulan ilişkiye iş ilişkisi denir. İşveren tarafından mal veya hizmet üretmek amacıyla maddî olan ve olmayan unsurlar ile işçinin birlikte örgütlendiği birime işyeri denir. İşverenin işyerinde ürettiği mal veya hizmet ile nitelik yönünden bağlılığı bulunan ve aynı yönetim altında örgütlenen yerler (işyerine bağlı yerler) ile dinlenme, çocuk emzirme, yemek, uyku, yıkanma, muayene ve bakım, beden ve meslekî eğitim ve avlu gibi diğer eklentiler ve araçlar da işyerinden sayılır. İşyeri, işyerine bağlı yerler, eklentiler ve araçlar ile oluşturulan iş organizasyonu kapsamında bir bütündür. (Ek fıkra: 23/7/2010-6009/48 md.; Mülga dördüncü fıkra: 20/6/2012-6331/37 md.) İşveren adına hareket eden ve işin, işyerinin ve işletmenin yönetiminde görev alan kimselere işveren vekili denir. İşveren vekilinin bu sıfatla işçilere karşı işlem ve yükümlülüklerinden doğrudan işveren sorumludur. Bu Kanunda işveren için öngörülen her çeşit sorumluluk ve zorunluluklar işveren vekilleri hakkında da uygulanır. İşveren vekilliği sıfatı, işçilere tanınan hak ve yükümlülükleri ortadan kaldırmaz. Bir işverenden, işyerinde yürüttüğü mal veya hizmet üretimine ilişkin yardımcı işlerinde veya asıl işin bir bölümünde işletmenin ve işin gereği ile teknolojik nedenlerle uzmanlık gerektiren işlerde iş alan ve bu iş için görevlendirdiği işçilerini sadece bu işyerinde aldığı işte çalıştıran diğer işveren ile iş aldığı işve…"}],"hakem":"Doğru sık, İş Kanunu m.6/5\u0027te açıkça yer alan kuralın tam tersini söyleyerek (işyeri devri işçi için haklı fesih sebebi OLMAZ, devralan işveren devir sebebiyle feshedemez) soru tarafından istenen \u0027yanlış ifade\u0027yi doğru şekilde belirlemektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Devralan işveren, kıdem tazminatı gibi hizmet süresine bağlı haklarda işçinin eski işverene başladığı tarihten saymak zorundadır. Kanun bunu emredici hükümle düzenlediği için doğrudur.","E":"Birleşme veya katılma yoluyla tüzel kişiliğin sona ermesi halinde birlikte sorumluluk hükümleri uygulanmaz. Kanun bu istisnayı düzenlediği için doğrudur.","A":"Devir tarihindeki iş sözleşmeleri bütün hak ve borçlarıyla devralan işverene geçer. Kanun bunu açıkça hükme bağladığı için doğrudur.","D":"İşyeri devri ne işveren ne işçi için tek başına fesih sebebi değildir. Bu şık kanunun tam tersini söylediği için yanlıştır.","B":"Devreden işverenin eski borçlardan sorumluluğu devir tarihinden sonra iki yıl ile sınırlıdır. Kanun bu iki yıllık süreti öngördüğü için doğrudur."},"dogru":"İş Kanunu, işyeri devrinde işverenlerin sırf bu devir gerekçesiyle sözleşmeyi feshedemeyeceğini ve devrin işçi için haklı fesih sebebi olmayacağını söyler. D şıkkı bunun tam tersini iddia eder, bu yüzden yanlıştır.","sinav":"İş Kanunu 6. madde uyarınca devreden veya devralan işveren iş sözleşmesini sırf işyerinin devri gerekçesiyle feshedemez ve devir işçi yönünden fesih için haklı sebep oluşturmaz.","kavramlar":[{"kaynak":"İş Kanunu 6. madde","tanim":"Bir işyerinin veya bir bölümünün hukuki bir işleme dayalı olarak başka bir işverene geçirilmesi. Devir tarihindeki iş sözleşmeleri tüm hak ve borçlarıyla devralan işverene geçer.","ad":"işyeri devri"},{"kaynak":"İş Kanunu 6. madde","tanim":"İşçinin işe başladığı tarihten itibaren geçen süreye dayalı olarak hesaplanan kıdem tazminatı gibi haklar. İşyeri devrinde devralan işveren, işçinin eski işverene başladığı tarihi esas almak zorundadır.","ad":"hizmet süresine bağlı haklar"},{"kaynak":"İş Kanunu 6. madde","tanim":"Devir öncesi doğmuş ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren her ikisinin de sorumlu olması. Devreden işverenin sorumluluğu devir tarihinden iki yıl ile sınırlıdır.","ad":"işverenler arasında birlikte sorumluluk"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"Bir işyerinin hukuki bir işleme dayalı olarak başka bir işverene devredilmesi durumuna ilişkin aşağıdaki ifadelerden hangisi 4857 sayılı İş Kanunu\u0027na göre yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-33","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.6","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Kartal\u0027daki bir tekstil atölyesi, 3 Mart 2023\u0027te devir sözleşmesiyle bütün işyerini komşu fabrikanın sahibine devrediyor; işyerinde o gün 40 işçi çalışıyor, bunlardan Ayşe 2015\u0027ten beri orada, en kıdemlisi.","anlatim":"Devralan işveren gelip \u0027ben yeni patronum, kurallar baştan başlıyor\u0027 diyor. Bu beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 3 Mart 2023 devir tarihine göre m.6\u0027daki beş sonucu (sözleşmenin geçişi, borç sorumluluğu, kıdem hesabı, fesih yasağı, birleşme istisnası) Ayşe ve arkadaşları üzerinden test edeceğiz.","anlatim":"Kural tek: devir işçiyi korumak için var, hiçbir taraf devri bahane edip işçiyi kaybetmemeli. Şimdi beş ifadeyi bu olayda deneyelim.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.6/1","karar":"doğru","anlatim":"Değil; 3 Mart\u0027ta mevcut olan bütün sözleşmeler hak ve borçlarıyla kendiliğinden devralana geçer. Ayşe\u0027nin sözleşmesi hiç kesintiye uğramaz.","formul":"Şık A: devralan patron \u0027iş sözleşmeleri benimle yeniden imzalanmalı, eskisi geçersiz\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.6/3-4","karar":"doğru","anlatim":"Devreden, devir tarihinden yani 3 Mart 2023\u0027ten itibaren iki yıl sınırlı sorumlu; sonrası devralanın üstünde kalır. İki yıl geçince devredenden istenemez.","formul":"Şık B: devirden önceki, örneğin Şubat ayı ücret farkından devreden patron ne kadar sorumlu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.6/2","karar":"doğru","anlatim":"Yanlış isteği doğru; kanun devralanı, Ayşe\u0027nin 2015\u0027teki işe giriş tarihini esas almaya zorlar. Kıdem tazminatı hesaplanırken 2015 baz alınır.","formul":"Şık C: yeni patron Ayşe\u0027nin kıdemini 3 Mart 2023\u0027ten başlatmak istiyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.6/5-6","karar":"yanlış","anlatim":"Geçerli değil; devir tek başına haklı fesih sebebi sayılmaz, sırf bu gerekçeyle fesih yasaktır. Ekonomik-teknik bir neden varsa o ayrı, ama sırf devir yetmez.","formul":"Şık D: yeni patron \u0027işyerini devraldım, bu yüzden Ayşe\u0027nin sözleşmesini feshediyorum\u0027 diyor, bu geçerli mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.6/4","karar":"doğru","anlatim":"İşlemez; kanun birleşme veya katılma yoluyla sona ermede birlikte sorumluluk hükmünü uygulamaz. Bu, üçüncü kişiye yapılan sıradan devirden farklıdır.","formul":"Şık E: atölye sahibi şirket bir başka şirketle birleşerek tüzel kişiliği sona eriyor, birlikte sorumluluk kuralı burada da mı işler?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Dört ifade kanunun aynen dediğini söylüyor, D ise kanunun yasakladığını serbestmiş gibi gösteriyor. Kendine sor: bu fesih işyerinin devrinden mi, yoksa ayrı bir ekonomik-teknik nedenden mi kaynaklanıyor?","doldur":[]}],"anahtar":[{"ornek":"devralana","kok":"devral"},{"ornek":"sözleşmeler","kok":"sözleş"},{"ornek":"devredenin","kok":"devred"},{"ornek":"tarihinden","kok":"tarihi"},{"ornek":"sebebi","kok":"sebebi"},{"ornek":"sorumluluğu","kok":"soruml"}],"konuGiris":{"harita":"Ne zaman test edilir: işyeri veya bir bölümü hukuki işlemle başka işverene geçtiğinde. Nasıl ölçülür: devir öncesi ve sonrası hangi hakların, hangi sürelerle kime geçtiği tek tek karşılaştırılarak. Nasıl kaydedilir: devir tarihi, devirden önceki borçlar ve sorumluluk süresi ayrı ayrı not edilir.","desen":"Sınav genelde devredenin sorumluluk süresini (2 yıl) başka bir süreyle değiştirerek ya da sınırsız gösterip yanlış seçenek üretir. Bir diğer tuzak, devrin fesih için haklı sebep oluşturduğunu söylemektir; kanun bunun tam tersini söyler. Bu soru m.6 hükmündeki süre ve fesih yasağı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşyerinin hukuki işlemle başka işverene geçmesi","ad":"Devir","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Devirden önceki borçlarda devredenin sorumlu olduğu süre","ad":"Birlikte sorumluluk süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İşçinin eski işveren yanındaki başlangıç tarihine göre hesaplanan kıdem","ad":"Hizmet süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Sırf devir nedeniyle iş sözleşmesinin sona erdirilememesi","ad":"Fesih yasağı","kim":"kanun sabitler"}],"sinavda":"Devir sonucu işçilik haklarına ilişkin ifadelerden hangisinin kanuna aykırı olduğu sorulur.","panel_ornek":"Bir kuaför salonunu 5 yıl çalıştıktan sonra başka bir işletmeciye satıyorsun; salon çalışanı olan kişi de yeni sahibiyle çalışmaya devam ediyor, kıdemi sıfırlanmıyor. Eski sahip, satıştan önceki 2 aylık maaş borcundan yeni sahiple birlikte sorumlu tutuluyor. Bu sorumluluk sonsuza dek değil, belli bir süreyle sınırlı.","ornek":"Bir kuaför salonunu 5 yıl çalıştıktan sonra başka bir işletmeciye satıyorsun; salon çalışanı olan kişi de yeni sahibiyle çalışmaya devam ediyor, kıdemi sıfırlanmıyor. Eski sahip, satıştan önceki 2 aylık maaş borcundan yeni sahiple birlikte sorumlu tutuluyor. Bu sorumluluk sonsuza dek değil, belli bir süreyle sınırlı.","yontemler":"Her seçenek m.6\u0027daki tek tek kurallarla (geçiş, süre, fesih yasağı, iflas istisnası) karşılaştırılıp aykırı olan bulunur.","nedir":"İşyerinin başka bir işverene hukuki bir işlemle devredilmesi durumunda işçilik haklarının ne olacağını düzenler; sınav bu devrin sonuçlarını doğru bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Kıdem Sıfırlama Tuzağı","metin":"öğrenci devralan işverenin işçinin kıdemini sıfırdan başlatabileceğini sanabilir. Doğrusu: m.6/2 gereği devralan işveren, hizmet süresine bağlı haklarda işçinin devreden işveren yanında işe başladığı tarihi esas almak zorundadır; ifade doğrudur."},"E":{"ad":"Katılma İstisnası Tuzağı","metin":"öğrenci birlikte sorumluluğun her devir türünde geçerli olduğunu düşünüp bu ifadeyi yanlış sayabilir. Doğrusu: m.6/4 gereği tüzel kişiliğin birleşme veya katılma ya da türünün değişmesiyle sona ermesi hâlinde birlikte sorumluluk hükümleri uygulanmaz; ifade doğrudur."},"A":{"ad":"Ne soruluyor","metin":"işyeri devrinde beş ifadeden hangisinin İş Kanunu m.6\u0027ya aykırı olduğu soruluyor. Kural: İş Kanunu m.6/1 uyarınca devir tarihinde mevcut olan iş sözleşmeleri bütün hak ve borçları ile birlikte devralana geçer. Doğrusu: bu ifade kanun metniyle birebir örtüştüğü için doğrudur, yanlış şık değildir."},"B":{"ad":"İki Yıl Tuzağı","metin":"öğrenci sınırın devralan işverene ait olduğunu düşünüp bu ifadeyi yanlış sayabilir. Doğrusu: m.6/3-4 uyarınca birlikte sorumluluk vardır ancak devreden işverenin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır; ifade doğrudur."}},"celdiriciYol":{},"hap":"İşyeri devrinde sözleşmeler kendiliğinden devralana geçer, devir tek başına fesih sebebi olamaz ve devredenin geçmiş borçlardan sorumluluğu devir tarihinden itibaren iki yılla sınırlıdır.","teshis":{"C":{"gercek":"İş Kanunu m.6/2 açıkça devralan işverenin, hizmet süresine bağlı haklarda işçinin devreden işveren yanındaki işe başlama tarihini esas almakla yükümlü olduğunu düzenler.","ayirt":"Kıdem tazminatı gibi haklarda esas alınacak tarih devir tarihi mi, işe giriş tarihi mi?","paragraf":"4857 sayılı İş Kanunu m.6/2","yanilgi":"Bu şıkkı yanlış sanan öğrenci, devralan işverenin işçinin kıdemini devir tarihinden itibaren yeniden saymaya başlayabileceğini düşünüyordur."},"E":{"gercek":"İş Kanunu m.6/4 açıkça tüzel kişiliğin birleşme veya katılma ya da türünün değişmesiyle sona ermesi hâlinde birlikte sorumluluk hükümlerinin uygulanmayacağını belirtir.","ayirt":"Olaydaki devir, üçüncü bir kişiye devir mi yoksa tüzel kişiliğin birleşme/tür değişikliği mi?","paragraf":"4857 sayılı İş Kanunu m.6/4","yanilgi":"Bu ifadeyi yanlış sanan öğrenci, birlikte sorumluluk kuralının istisnasız her tüzel kişi değişikliğinde uygulanacağını düşünüyordur."},"A":{"gercek":"İş Kanunu m.6/1\u0027e göre devir tarihinde mevcut iş sözleşmeleri kendiliğinden, bütün hak ve borçlarıyla devralana geçer; işçi onayı aranmaz.","ayirt":"Devirde sözleşmenin geçişi için işçinin ayrıca rıza vermesi gerekir mi?","paragraf":"4857 sayılı İş Kanunu m.6/1","yanilgi":"Bu ifadeyi eleyip yanlış şık sanan öğrenci, devirde iş sözleşmelerinin devam edip etmeyeceğinin işçinin onayına bağlı olduğunu düşünüyordur."},"D":{"gercek":"İş Kanunu m.6/5 devri sırf gerekçe göstererek yapılan feshi açıkça yasaklar; devir tek başına işçi yönünden haklı sebep oluşturmaz, ancak ekonomik/teknolojik nedenlere dayalı fesih hakları saklıdır.","ayirt":"Fesih işyerinin devrinden mi, yoksa devirle birlikte ortaya çıkan ayrı bir ekonomik-teknolojik nedenden mi kaynaklanıyor?","paragraf":"4857 sayılı İş Kanunu m.6/5-6","yanilgi":"Bu şıkkı doğru sanan öğrenci, işyeri devrinin başlı başına işletmesel bir değişiklik olduğunu ve bunun tek başına haklı fesih nedeni oluşturacağını düşünüyordur."},"B":{"gercek":"İş Kanunu m.6/3-4 uyarınca devirden önceki muaccel borçlardan iki işveren birlikte sorumludur ancak devredenin sorumluluğu devir tarihinden itibaren iki yılla sınırlıdır.","ayirt":"İki yıllık süre kimin sorumluluğunu sınırlıyor: devreden mi, devralan mı?","paragraf":"4857 sayılı İş Kanunu m.6/3-4","yanilgi":"Bu şıkkı yanlış sanan öğrenci, iki yıllık sınırın devralan işveren için değil sadece devreden işveren için var olduğunu unutmuş, sorumluluğun süresiz devam ettiğini sanıyordur."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 107"},"kural":"madde 6, devir tarihinde mevcut iş sözleşmelerinin bütün hak ve borçlarıyla devralana geçtiğini, devirden önce doğmuş borçlarda devredenin sorumluluğunun devir tarihinden itibaren iki yıl ile sınırlı olduğunu ve sırf işyeri devrinin fesih için haklı sebep oluşturmadığını düzenler.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 107","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Roman numaralı önerme sorularında her ifadeyi maddenin ilgili fıkrasıyla tek tek eşleştir, bir kelimenin (taraf, süre, istisna) değiştirilip değiştirilmediğine bak.","konu":"işyeri devri-is kanunu","tablo":{"satirlar":[["A) I, II ve III","m.6/1","doğru ifade"],["B) I, II ve IV","m.6/3","doğru ifade"],["C) I, III ve V","m.6/2","YANLIŞ ifade"],["D) II, IV ve V","m.6/5","doğru ifade"],["E) III, IV ve V","m.6/son","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"I, III ve V","E":"III, IV ve V","A":"I, II ve III","D":"II, IV ve V","B":"I, II ve IV"},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.6","metin":"Madde 6 - İşyeri veya işyerinin bir bölümü hukukî bir işleme dayalı olarak başka birine devredildiğinde, devir tarihinde işyerinde veya bir bölümünde mevcut olan iş sözleşmeleri bütün hak ve borçları ile birlikte devralana geçer. Devralan işveren, işçinin hizmet süresinin esas alındığı haklarda, işçinin devreden işveren yanında işe başladığı tarihe göre işlem yapmakla yükümlüdür. Yukarıdaki hükümlere göre devir halinde, devirden önce doğmuş olan ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren birlikte sorumludurlar. Ancak bu yükümlülüklerden devreden işverenin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır. Tüzel kişiliğin birleşme veya katılma ya da türünün değişmesiyle sona erme halinde birlikte sorumluluk hükümleri uygulanmaz. Devreden veya devralan işveren iş sözleşmesini sırf işyerinin veya işyerinin bir bölümünün devrinden dolayı feshedemez ve devir işçi yönünden fesih için haklı sebep oluşturmaz. Devreden veya devralan işverenin ekonomik ve teknolojik sebeplerin yahut iş organizasyonu değişikliğinin gerekli kıldığı fesih hakları veya işçi ve işverenlerin haklı sebeplerden derhal fesih hakları saklıdır. Yukarıdaki hükümler, iflas dolayısıyla malvarlığının tasfiyesi sonucu işyerinin veya bir bölümünün başkasına devri halinde uygulanmaz. Geçici iş ilişkisi"},{"ad":"İş K. (4857 s.K.) m.2 [1/3]","metin":"Madde 2 - Bir iş sözleşmesine dayanarak çalışan gerçek kişiye işçi, işçi çalıştıran gerçek veya tüzel kişiye yahut tüzel kişiliği olmayan kurum ve kuruluşlara işveren, işçi ile işveren arasında kurulan ilişkiye iş ilişkisi denir. İşveren tarafından mal veya hizmet üretmek amacıyla maddî olan ve olmayan unsurlar ile işçinin birlikte örgütlendiği birime işyeri denir. İşverenin işyerinde ürettiği mal veya hizmet ile nitelik yönünden bağlılığı bulunan ve aynı yönetim altında örgütlenen yerler (işyerine bağlı yerler) ile dinlenme, çocuk emzirme, yemek, uyku, yıkanma, muayene ve bakım, beden ve meslekî eğitim ve avlu gibi diğer eklentiler ve araçlar da işyerinden sayılır. İşyeri, işyerine bağlı yerler, eklentiler ve araçlar ile oluşturulan iş organizasyonu kapsamında bir bütündür. (Ek fıkra: 23/7/2010-6009/48 md.; Mülga dördüncü fıkra: 20/6/2012-6331/37 md.) İşveren adına hareket eden ve işin, işyerinin ve işletmenin yönetiminde görev alan kimselere işveren vekili denir. İşveren vekilinin bu sıfatla işçilere karşı işlem ve yükümlülüklerinden doğrudan işveren sorumludur. Bu Kanunda işveren için öngörülen her çeşit sorumluluk ve zorunluluklar işveren vekilleri hakkında da uygulanır. İşveren vekilliği sıfatı, işçilere tanınan hak ve yükümlülükleri ortadan kaldırmaz. Bir işverenden, işyerinde yürüttüğü mal veya hizmet üretimine ilişkin yardımcı işlerinde veya asıl işin bir bölümünde işletmenin ve işin gereği ile teknolojik nedenlerle uzmanlık gerektiren işlerde iş alan ve bu iş için görevlendirdiği işçilerini sadece bu işyerinde aldığı işte çalıştıran diğer işveren ile iş aldığı işve…"}],"hakem":"Soru, 4857 sayılı İş Kanunu m.6\u0027daki işyeri devri hükümlerini doğru ve güncellemeye tabi olmayan bir şekilde sınar; önermelerin doğruluğu kaynak metinle tam uyumludur."},"kayitlar":[],"sade":{"siklar":{"C":"İflas sonucu işyeri devredilirse kanun bu maddenin kurallarını uygulamaz, bu istisna gözden kaçırılmıştır; ek olarak tarih esası da yanlış.","E":"Burada hem yanlış tarih esası hem de iflas istisnasının atlanması vardır; iki hatalı önermeyi birlikte doğru sayıyor.","D":"İflas halinde devir kuralları çalışmaz ama bu seçenek onun uygulanacağını söylüyor ve bu kanunun açık istisnasını görmezden geliyor.","A":"Hizmet süresine bağlı haklar hesaplanırken esas tarih, işçinin yeni işverene değil eski işverene başladığı gündür; bu seçenek tarih esasını ters kullanıyor."},"dogru":"İşyeri devredilince iş sözleşmeleri tüm hakları ve borçlarıyla yeni işverene geçer. Eski işveren ödenmemiş borçlardan sorumlu kalır ama bu sorumluluk iki yılla sınırlıdır. Sırf işyeri devri nedeniyle iş sözleşmesi feshedilemez.","sinav":"İş Kanunu 6. madde","kavramlar":[{"kaynak":"İş Kanunu 6. madde","tanim":"İşyerinin veya bir bölümünün hukuki bir işleme dayanarak başka birine aktarılmasıdır; bu sırada iş sözleşmeleri ve borçlar otomatik olarak devralan işverene geçer.","ad":"işyeri devri"},{"kaynak":"İş Kanunu 6. madde","tanim":"İşçinin işverene başladığından itibaren geçen zaman dilimidir; hak hesaplamalarında işyeri devrinden sonra da eski işverene başlama tarihinden itibaren sayılmaya devam eder.","ad":"hizmet süresi"},{"kaynak":"İş Kanunu 6. madde","tanim":"İşyeri devredilmeden önce doğmuş ancak devir tarihinde ödenmesi gereken borçlardır; hem eski hem yeni işveren bu borçlardan sorumlu olur fakat eski işverenin sorumluluğu iki yılla sınırlanır.","ad":"devir öncesi borçlar"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"4857 sayılı İş Kanunu\u0027na göre işyeri devrine ilişkin: I. Devir tarihinde mevcut iş sözleşmeleri bütün hak ve borçlarıyla devralana geçer. II. Devirden önce doğmuş, devir tarihinde ödenmesi gereken borçlardan devredenin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır. III. Devralan işveren, hizmet süresine bağlı haklarda işçinin devralan yanında işe başladığı tarihe göre işlem yapar. IV. Devreden veya devralan işveren iş sözleşmesini sırf işyeri devri nedeniyle feshedemez. V. İflas nedeniyle malvarlığının tasfiyesi sonucu işyeri devrinde madde 6 hükümleri uygulanır. Yukarıdakilerden hangileri doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-zor/kp-33","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.6","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Kayseri\u0027de bir tekstil fabrikası, 14 Mart 2019\u0027da başka bir şirkete devrediliyor; devir tarihinde 40 işçinin sözleşmesi yürürlükte, biri 2017\u0027den kalma bir kıdem tazminatı borcu taşıyor.","anlatim":"Devralan şirket \u0027bu işçiler bana ne getirir\u0027 diye soruyor. Devreden ise devir sonrası sorumluluktan kaçmaya çalışıyor. Bu olayda beş farklı iddia var, hepsini tek tek test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: madde 6, devir anındaki sözleşmelerin bütün hak ve borçlarıyla devralana geçtiğini, eski borçlarda devredenin sorumluluğunun iki yılla sınırlı olduğunu, kıdem hesabında devreden yanındaki başlama tarihinin esas alındığını ve sırf devrin fesih sebebi olmadığını söyler; iflas tasfiyesinde ise madde 6 hiç uygulanmaz.","anlatim":"Bu kuralı beş ifadeyi bu fabrika olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.6/1","karar":"doğru","anlatim":"Devralan işveren yeni sözleşme yapmaya gerek duymadan devam eder. Madde 6 fıkra 1 bunu doğrudan söyler. Bu ifade doğrudur.","formul":"Şık A: 14 Mart\u0027ta yürürlükteki 40 sözleşme, bütün hak ve borçlarıyla otomatik olarak devralana mı geçer, yoksa yeniden mi imzalanmalı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.6/3","karar":"doğru","anlatim":"Devirden önce doğmuş borçlarda devredenin sorumluluğu iki yılla sınırlanır, sonrası devralana kalır. Bu, işçiyi korurken devredeni sonsuza dek bağlamayan bir denge kurar. Bu ifade doğrudur.","formul":"Şık B: 2017\u0027den kalma tazminat borcunda devreden şirket, devir tarihinden itibaren sadece iki yıl mı sorumlu olur?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.6/2","karar":"yanlış","anlatim":"Hayır, esas alınan tarih işçinin devreden yanındaki başlama tarihidir, devralan yanındaki tarih değil. Fabrika örneğinde işçinin 2015\u0027te devreden yanında başladığı tarih geçerli sayılır. Bu ifade yanlıştır.","formul":"Şık C: Kıdeme bağlı haklarda devralan şirket, işçinin kendi yanında işe başladığı tarihi mi esas alır?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.6/5","karar":"doğru","anlatim":"Sırf işyeri devri, ne devreden ne devralan için geçerli bir fesih sebebi sayılmaz. Fabrikadaki 40 işçi sadece devir yüzünden işten çıkarılamaz. Bu ifade doğrudur.","formul":"Şık D: Devralan şirket \u0027işyeri devri oldu, bazı işçileri çıkarayım\u0027 derse bu fesih geçerli olur mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.6/son","karar":"yanlış","anlatim":"Hayır, iflas nedeniyle malvarlığı tasfiyesi sonucu gerçekleşen devirlerde madde 6 hiç uygulanmaz. Bu istisna madde 6\u0027nın son fıkrasında açıkça yazar. Bu ifade yanlıştır.","formul":"Şık E: Fabrika iflas edip malvarlığı tasfiye sonucu devredilseydi, yine madde 6 hükümleri mi uygulanırdı?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✗","anlatim":"Doğru cevap I, II ve IV\u0027ü içeren B şıkkı, çünkü III ve V maddenin lafzını tersine çevirmiş. Kendine hep şunu sor: bu önerme kıdem tarihini mi karıştırıyor yoksa iflas istisnasını mı yok sayıyor?","doldur":[]}],"anahtar":[{"ornek":"devreden","kok":"devred"},{"ornek":"devralana","kok":"devral"},{"ornek":"tarihi","kok":"tarihi"},{"ornek":"doğrudan","kok":"doğrud"},{"ornek":"yanındaki","kok":"yanınd"},{"ornek":"borçlarıyla","kok":"borçla"}],"konuGiris":{"harita":"Ne zaman test edilir: işyeri hukuki bir işlemle başka işverene devredildiğinde. Nasıl ölçülür: devir tarihindeki sözleşmelerin, borçların ve kıdemin nasıl paylaşıldığı sorularak. Nasıl kaydedilir: madde 6\u0027daki sınır ve istisnalar (iki yıl, iflas hali) tek tek kontrol edilerek.","desen":"Bu soruda III. madde tuzağı vardır; kanun \u0027devreden yanında işe başladığı tarih\u0027 der, soru \u0027devralan yanında başladığı tarih\u0027 diyerek çeldirir. V. madde de tuzaktır çünkü iflas halinde madde 6 hükümleri UYGULANMAZ, soru tam tersini söyler. Bu soru madde 6\u0027nın istisna fıkrasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşyerinin hukuki işlemle başka işverene geçmesi","ad":"Devir","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Devirden önce doğan borçlarda devredenin sorumluluğunun süresi","ad":"Birlikte sorumluluk süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Hizmet süresine bağlı haklarda esas alınacak işe başlama tarihi","ad":"Kıdem esas alma tarihi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Sırf devir nedeniyle iş sözleşmesinin feshedilememesi kuralı","ad":"Fesih yasağı","kim":"kanun sabitler"}],"sinavda":"Beş önermeden hangilerinin madde 6\u0027ya uygun olduğu, doğru-yanlış ayrımı yapılarak sorulur.","panel_ornek":"Bir bakkal dükkanını başka birine devrediyorsun; dükkanda çalışan kasiyer de yeni sahibinin yanında çalışmaya devam eder, eski borçlarından eski sahip de bir süre sorumlu kalır. Yeni sahip sırf devir oldu diye kasiyeri kovamaz. Bu, gerçek hayattaki devir mantığının aynısı.","ornek":"Bir bakkal dükkanını başka birine devrediyorsun; dükkanda çalışan kasiyer de yeni sahibinin yanında çalışmaya devam eder, eski borçlarından eski sahip de bir süre sorumlu
