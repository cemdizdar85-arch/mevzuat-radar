it":[],"teori":true,"taktik":"Şıklarda tablo numarası aklına gelen meslek adları varsa hemen elemeye başla, kapsam dışı kalan tek şık genelde büro/idari nitelikli olandır.","konu":"fiili hizmet süresi zammı","tablo":{"satirlar":[["VERİLENLER","-","-"],["Madde numarası","40","-"],["HESAP","-","-"],["A) Çimento fabrikalarının otomatik fırınlarında pişirme işl…","p.tablo sıra 4","doğru ifade"],["B) Maden ocaklarının yer altı işlerinde çalışanlar","p.tablo sıra 10","doğru ifade"],["C) Yangın söndürme işlerinde çalışan itfaiye personeli","p.tablo sıra 15","doğru ifade"],["D) İşletmenin merkez binasında büro ve idari işlerde çalışa…","p.fıkra 1","YANLIŞ ifade"],["E) Radyoaktif ve radyoiyonizan maddelerle yapılan işlerde ç…","p.tablo sıra 11","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yangın söndürme işlerinde çalışan itfaiye personeli","E":"Radyoaktif ve radyoiyonizan maddelerle yapılan işlerde çalışanlar","A":"Çimento fabrikalarının otomatik fırınlarında pişirme işlerinde çalışanlar","D":"İşletmenin merkez binasında büro ve idari işlerde çalışan muhasebe memuru","B":"Maden ocaklarının yer altı işlerinde çalışanlar"},"kaynak":{"alinti":"a dayalı fiili hizmet süresi zammı uygulamasının kapsamını test etmektedir; doğru sık (işletme merkez binasında büro ve idari işlerde çalışan muhasebe memuru), kaynakta açıkça belirtilen","liste":[{"ad":"5510 s. SGK Kanunu m.40 [1/8]","metin":"MADDE 40- (Değişik: 17/4/2008-5754/25 md.) Aşağıda belirtilen işyerlerinde ve işlerde 4 üncü maddenin birinci fıkrasının (a) ve (c) bentleri kapsamında çalışan sigortalıların prim ödeme gün sayılarına, bu işyerlerinde ve işlerde geçen çalışma sürelerinin her 360 günü için karşılarında gösterilen gün sayıları, fiilî hizmet süresi zammı olarak eklenir. 360 günden eksik sürelere ait fiilî hizmet süresi zammı, 360 gün için eklenen fiilî hizmet süresi ile orantılı olarak belirlenir. Çalışmanın fiili hizmet süresi zammı kapsamında değerlendirilebilmesi için, tablonun (13) ve (14) numaralı sıralarında belirtilen sigortalılar hariç sigortalının kapsamdaki işyerleri ile birlikte belirtilen işlerde fiilen çalışması ve söz konusu işlerin risklerine maruz kalması şarttır. (Ek cümle: 10/9/2014-6552/42 md.) Tablonun (10) numaralı sırasında belirtilen sigortalıların, fiili hizmet süresi zammından yararlandırılacakları dönem içinde kalan; yıllık ücretli izin, sıhhi izin, hafta tatili, ulusal bayram ve genel tatil günleri ile eğitim, kurs, iş öncesi ve sonrası hazırlık 17/4/2008 tarihli ve 5754 sayılı Kanunun 65 inci maddesiyle birinci fıkrada yer alan “malûl kalan” ibaresi “malûl veya vazife malûlü olan” şeklinde değiştirilmiş; aynı Kanunun 66 ncı maddesiyle ikinci fıkrada yer alan “Malûllük” ibaresinden sonra gelmek üzere “, vazife malûllüğü” ibaresi eklenmiştir. 55 sürelerinde fiilen çalışma ve söz konusu işlerin risklerine maruz kalma şartı aranmaz. Aşağıdaki bentlerden birden fazlasına dahil olanlar için, en yüksek olan bentten fiilî hizmet süresi zammı uygulanır. Kapsamdaki İşler/İşye…"},{"ad":"5510 s. SGK Kanunu m.40 [2/8]","metin":"2) Kurşunlu madenlerden yahut içinde kurşun bulunan kül, maden köpüğü, kurşun fırın kurumu, üstübeç artığı ve benzeri maddelerden kurşun üretimi için yapılan izabe işlerinde çalışanlar. 3) Antimuan, kalay, bronz ve benzeri maddelerle yapılan kurşun alaşımı işlerinde çalışanlar. 4) Kurşun izabe fırınlarının teksif odalarında biriken kuru tozları kaldırma işlerinde çalışanlar. 2) Cam fabrika ve atölyeleri 1) Cam yapımında kullanılan ilkel maddeleri toz haline getirme, eleme, karıştırma ve kurutma işlerinde (bu işleri yapmak üzere tam kapalı odalar içinde otomatik makineli tesisat veya çalışma ortamındaki tozları sağlık için tehlike oluşturmayacak düzeye indiren havalandırma tesisatı bulunmadığı takdirde) çalışanlar. 2) Eritme işlerinde (otomatik besleme fırınlarıyla çalışılmadığı takdirde) çalışanlar. 3) Ateşçilik işlerinde çalışanlar. 4) Üfleme işlerinde (tamamen otomatik makinelerle yapılmadığı takdirde) çalışanlar. 5) Basınçla yapılan cam işlerinde (cam tazyiki işleri) çalışanlar. 6) Ayna camı sanatında potalı cam dökümü işlerinde (potalar kalıp masasına mekanik araçlarla taşınmadığı takdirde) çalışanlar. 7) Camı fırın başından alma işlerinde çalışanlar. 8) Yayma fırınlarında düzeltme işlerinde çalışanlar. 9) Traş işlerinde çalışanlar. 10) Asitle hak ve cilâlama işlerinde çalışanlar. 11) Basınçlı havayla kum püskürten cihazlarla yapılan işlerde (çalışma ortamındaki tozları Eklenecek Gün Sayısı 60 90 60 Kapsamdaki İşler/İşyerleri Kapsamdaki Sigortalılar Eklenecek Gün Sayısı sağlık için tehlike oluşturmayacak düzeye indiren havalandırma tesisatı bulunmadığı takdirde) çalışan…"}],"hakem":"Soru, 5510 s. SGK Kanunu m.40\u0027a dayalı fiili hizmet süresi zammı uygulamasının kapsamını test etmektedir; doğru sık (işletme merkez binasında büro ve idari işlerde çalışan muhasebe memuru), kaynakta açıkça belirtilen \u0027fiilen çalışması ve söz konusu işlerin risklerine maruz kalma şartı\u0027 kuralına uygun olarak tabloda sayılan riskli işlerden hiçbirine tabi olmadığından yararlanamaz."},"kayitlar":[],"sade":{"siklar":{"C":"Yangın söndürme ve itfaiye işleri tabloda 60 gün eklenmesi belirtilen riskli işler arasında yer almaktadır.","E":"Radyoaktif ve radyoiyonizan maddelerle yapılan işler tabloda 90 gün eklenmesi düzenlenmiş kapsamdaki işlerdendir.","A":"Çimento fabrikalarının otomatik fırınlarında pişirme işi tabloda açıkça sayılmış ve 60 gün eklenmesi öngörülmüştür.","B":"Maden ocaklarının yer altı işleri tabloda 180 gün eklenmesi düzenlenmiş ayrı bir kapsam kalemidir."},"dogru":"Kanun kapsamındaki riskli işlerde zammı almak için çalışanın o işi fiilen yapması ve risklere maruz kalması gerekir. Büro ve idari işler tabloda sayılan riskli işler arasında olmadığı için bu çalışan zammdan yararlanamaz.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 40. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 40. madde","tanim":"Kanun tarafından belirlenen riskli iş ve işyerlerde fiilen çalışan sigortalıların her 360 günlük çalışma sürelerine eklenen gün sayısı; risk grubuna göre 60 ile 180 gün arasında değişir.","ad":"fiili hizmet süresi zammı"},{"kaynak":"5510 s. SGK Kanunu 40. madde","tanim":"Sağlık ve güvenlik açısından tehlike oluşturan, kanunun 40. maddesindeki tabloda tek tek sayılan belirli işler ve işyerleri; çalışanların buralarda fiilen çalışması ve işin risklerine maruz kalması gerekir.","ad":"riskli iş ve işyerler"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027nun 40 ıncı maddesine göre aşağıdaki iş veya işyerlerinde çalışanlardan hangisi fiili hizmet süresi zammı uygulamasından yararlanamaz?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-30","verilenler":[{"deger":"40","anlam":"Söz konusu kanunun fiili hizmet süresi zammı uygulamasını düzenleyen hükmünün yeri; hangi çalışanların bu zamdan yararlanacağını gösterir.","ad":"Madde numarası"}],"dayanak":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu m.40, fıkra 1 ve tablo","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Kayseri\u0027de bir çimento fabrikasında 40 işçi çalışıyor, bunlardan 25\u0027i otomatik fırınlarda pişirme işinde, 15\u0027i ise merkez binada muhasebe ve idari işlerde 2018\u0027den beri görev yapıyor.","anlatim":"İşveren SGK\u0027ya prim gün sayılarını bildirirken kimin zam alacağını karıştırıyor. Fırın işçileri mi, büro personeli mi, yoksa hepsi mi fiili hizmet süresi zammı hak ediyor bakacağız.","doldur":[]},{"formul":"Ne yapacağız: madde 40, tabloda tek tek sayılan işlerde fiilen çalışıp riske maruz kalan sigortalıya her 360 gün için ekstra gün ekler; bu fabrikadaki beş farklı çalışan grubunu bu kurala tek tek sokacağız.","anlatim":"Kural bir kez: iş tabloda sayılmalı, sigortalı o işi fiilen yapmalı ve riske maruz kalmalı. Şimdi A\u0027dan E\u0027ye kadar beş ifadeyi bu fabrikanın olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"p.tablo sıra 4","karar":"doğru","anlatim":"Bu işçiler otomatik fırınlarda fiilen pişirme yapıyor, tam da tabloda sayılan iş bu. Evet, 60 gün eklersin.","formul":"Şık A: fırında pişirme işinde çalışan 25 işçiye 60 gün fiili hizmet zammı eklenir mi, sen ekler misin?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"p.tablo sıra 10","karar":"doğru","anlatim":"Yer altı işleri cıva ocakları hariç tabloda ayrıca sayılmış, fiilen yer altında çalışan bu kapsama girer. Evet, eklersin.","formul":"Şık B: aynı bölgede bir maden ocağında yer altında çalışan işçilere 180 gün eklenir mi, ekler misin?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"p.tablo sıra 15","karar":"doğru","anlatim":"İşyeri itfaiyesi olsun kamu itfaiyesi olsun, fiilen yangın söndürme işi yapan tabloda sayılmış. Evet, eklersin.","formul":"Şık C: fabrikanın kendi itfaiye ekibinde yangın söndürme işinde çalışana 60 gün eklenir mi, ekler misin?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"p.fıkra 1","karar":"yanlış","anlatim":"Bu memur fiilen fırın işine ya da tozlu ortama maruz kalmıyor, sadece büroda oturuyor. Madde 40 riske fiilen maruz kalmayı şart koyuyor, o yüzden eklemezsin.","formul":"Şık D: merkez binada muhasebe memuruna, fabrika riskli iş kolunda olduğu için fiili hizmet zammı eklenir mi, ekler misin?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"p.tablo sıra 11","karar":"doğru","anlatim":"Radyoaktif ve radyoiyonizan maddelerle iş, tabloda ayrı sırayla açıkça kapsama alınmış. Evet, eklersin.","formul":"Şık E: aynı işletmenin başka bir tesisinde radyoaktif madde ile çalışan teknisyene 90 gün eklenir mi, ekler misin?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Fabrikanın adı riskli olsa da, herkes otomatik kapsama girmez; kişi bizzat o riskli işi yapmalı. Kendine hep şunu sor: ben bu işin somut riskine fiilen maruz kalıyor muyum, yoksa sadece aynı işyerinde mi çalışıyorum?","doldur":[]}],"anahtar":[{"ornek":"fiilen","kok":"fiilen"},{"ornek":"tabloda","kok":"tablod"},{"ornek":"sayılan","kok":"sayıla"},{"ornek":"eklersin","kok":"eklers"},{"ornek":"çalışıp","kok":"çalışı"},{"ornek":"hizmet","kok":"hizmet"}],"konuGiris":{"harita":"Ne zaman uygulanır: Sigortalı kanunda sayılan işyerinde belirtilen riskli işte fiilen çalışıyorsa. Nasıl ölçülür: Her 360 gün çalışmaya karşılık gelen ek gün sayısı tablodan bulunur. Nasıl kaydedilir: Eksik sürelerde ek gün, 360 güne oranlanarak prim gün sayısına eklenir.","desen":"Soru genelde tablodaki işlerden birinde çalışan ama fiilen riskli işi yapmayan (örneğin büro işi yapan) kişiyi seçenek olarak koyar. Öğrenci işyeri adını görüp otomatik zam hakkı sanır, oysa fiilen çalışma şartı aranır. Bu soru m.40/1 fıkrasındaki \u0027fiilen çalışma ve risklere maruz kalma\u0027 şartından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Sigortalının riskli işte gerçekten çalışması gerektiğini ifade eder","ad":"Fiilen çalışma şartı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Her 360 gün çalışmaya karşılık eklenecek gün miktarı","ad":"Ek gün sayısı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Riskli işte fiilen çalışmayıp sadece işyerinde bulunan sigortalı","ad":"Kapsam dışı çalışan","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bazı sıralarda fiilen çalışma şartı aranmayan özel durum","ad":"Muafiyet istisnası","kim":"kanun sabitler"}],"sinavda":"Soru, belirtilen işyerlerinde çalışan kişiler arasından fiili hizmet süresi zammından yararlanamayacak olanı sormaktadır.","panel_ornek":"Bir markette 3 yıl boyunca sürekli soğuk hava deposunda çalışan komşun, çalıştığı her yıl için ekstra 15 gün kıdem kazanmış gibi düşünülebilir. Ama sadece ofiste evrak işi yapan biri aynı hakka sahip olmaz. Yani hak, fiilen o riskli işte çalışmaya bağlıdır, sadece o işyerinde bulunmak yetmez.","ornek":"Bir markette 3 yıl boyunca sürekli soğuk hava deposunda çalışan komşun, çalıştığı her yıl için ekstra 15 gün kıdem kazanmış gibi düşünülebilir. Ama sadece ofiste evrak işi yapan biri aynı hakka sahip olmaz. Yani hak, fiilen o riskli işte çalışmaya bağlıdır, sadece o işyerinde bulunmak yetmez.","yontemler":"Her seçenekte kişinin riskli işi fiilen yapıp yapmadığına bakılır; sadece işyeri adı yeterli değildir.","nedir":"Fiili hizmet süresi zammı, ağır ve riskli işlerde fiilen çalışan sigortalıya prim gün sayısına ek gün eklenmesidir. Sınav, bu ekin kimlere ve hangi şartla uygulandığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Meslek Adı Benzetme Tuzağı","metin":"itfaiye veya yangın söndürme işlerinde fiilen çalışmak tabloda 60 gün eklenen ayrı bir sıra olarak düzenlenmiştir. Doğrusu: bu grup kapsamdadır, öğrenci meslek prestijine bakıp yanılmamalıdır."},"E":{"ad":"Risk Kapsamı Tuzağı","metin":"radyoaktif ve radyoiyonizan maddelerle yapılan işler tabloda ayrı bir sırada 90 gün eklenerek düzenlenmiştir. Doğrusu: bu grup kapsamdadır, işin adı tabloda geçtiği için kapsam dışı sayılamaz."},"A":{"ad":"Ne soruluyor","metin":"beş çalışan grubundan hangisinin kanun kapsamı dışında kaldığı soruluyor. Ters Kapsam Tuzağı: çimento fabrikalarının otomatik fırınlarında pişirme işi kanunun 40 ıncı maddesindeki tabloda açıkça sayılmıştır ve 60 gün eklenir. Doğrusu: bu grup kapsamdadır, yanıt bu şık değildir."},"B":{"ad":"Yeraltı İşleri Tuzağı","metin":"maden ocağının yer altında yapılan işleri, tabloda ayrıca 180 gün eklenecek şekilde düzenlenmiş açık bir kapsam kalemidir. Doğrusu: bu grup kapsamdadır, kapsam dışı olan grup başka bir şıktır."}},"celdiriciYol":null,"hap":"Fiili hizmet süresi zammı, işin adına değil sigortalının tabloda sayılan riskli işte fiilen çalışıp o riske maruz kalmasına bağlıdır.","teshis":{"C":{"gercek":"Tablo, işyeri ayırt etmeksizin yangın söndürme işlerinde fiilen çalışanları 60 gün eklenerek kapsar.","ayirt":"Fiilen yangın söndürme işi mi yapılıyor?","paragraf":"5510 s.K. m.40, tablo sıra 15","yanilgi":"İtfaiyeciliğin sadece kamu görevlisi itfaiye teşkilatını kapsadığını, işyeri itfaiyesini kapsamadığını düşünüyorsun."},"E":{"gercek":"Tablo, radyoaktif ve radyoiyonizan maddeler veya korpüsküler emanasyon kaynaklarıyla yapılan işleri 90 gün eklenerek doğrudan kapsama almıştır.","ayirt":"Bu iş tabloda ayrı bir sıra numarasıyla sayılmış mı?","paragraf":"5510 s.K. m.40, tablo sıra 11","yanilgi":"Radyoaktif madde ile çalışmanın özel bir izne bağlı, dolayısıyla genel kapsam dışında ayrı bir rejim olduğunu düşünüyorsun."},"A":{"gercek":"Madde 40 tablosunda çimento fabrikalarının otomatik fırınlarda pişirme işleri açıkça 60 gün eklenen kapsamdaki işler arasında sayılmıştır.","ayirt":"Bu iş, tabloda madde madde sayılan risklerden biri mi?","paragraf":"5510 s.K. m.40, tablo sıra 4","yanilgi":"Çimento fabrikasında çalışan herkesin otomatik sayılmadığını, dolayısıyla kapsam dışı kalabileceğini düşünüyorsun."},"D":{"gercek":"Madde 40, sigortalının bizzat tabloda sayılan riskli işte fiilen çalışmasını ve o riske maruz kalmasını şart koşar; büro ve idari personel bu riske maruz kalmaz.","ayirt":"Ben bu işin somut riskine fiilen maruz kalıyor muyum, yoksa yalnız aynı işyerinde mi çalışıyorum?","paragraf":"5510 s.K. m.40, fıkra 1","yanilgi":"İşyerinin kapsamdaki bir sektörde (örneğin çimento, maden) faaliyet göstermesinin, o işyerindeki her çalışanı otomatik olarak kapsama soktuğunu sanıyorsun."},"B":{"gercek":"Tablo, cıva maden ocakları hariç maden ocakları ile kanalizasyon ve tünel yapımı gibi tüm yer altı işlerini 180 gün ekleyerek kapsar.","ayirt":"Çalışma fiilen yer altında mı geçiyor?","paragraf":"5510 s.K. m.40, tablo sıra 10","yanilgi":"Yer altı işlerinin sadece kömür madenine özgü olduğunu, diğer maden ocaklarını kapsamadığını sanıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 109"},"kural":"5510 sayılı Kanun m.40\u0027a eklenen cümleye göre tablonun (10) numaralı sırasındaki (yer altı işleri) sigortalıların, zamdan yararlandırılacağı dönem içindeki yıllık ücretli izin, sıhhi izin, hafta tatili, ulusal bayram-genel tatil ile eğitim-kurs ve iş öncesi-sonrası hazırlık sürelerinde fiilen çalışma ve risklere maruz kalma şartı aranmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Fiili hizmet süresi zammı sorularında önce sigortalının hangi sıra numarasında olduğunu, sonra o sıraya özgü istisnanın var olup olmadığını ayır; istisnayı başka sıraya taşıma.","konu":"fiili hizmet süresi zammı","tablo":{"satirlar":[["A) Türk Silahlı Kuvvetlerinde subay olarak görev yapan sigo…","m.40/1","YANLIŞ ifade"],["B) Çimento fabrikasının otomatik fırınlarında çalışan sigor…","m.40, ek cümle (6552/42 md.)","YANLIŞ ifade"],["C) Yer altında maden ocağı işinde çalışan sigortalının, fii…","m.40, ek cümle (6552/42 md.)","YANLIŞ ifade"],["D) Birden fazla fiili hizmet süresi zammı bendine dahil ola…","m.40/1, son fıkra","YANLIŞ ifade"],["E) Yer altında maden ocağı işinde çalışan sigortalının, fii…","m.40, ek cümle (6552/42 md.)","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yer altında maden ocağı işinde çalışan sigortalının, fiili hizmet süresi zammından yararlandırılacağı dönem içinde kullandığı eğitim ve kurs süresi, fiilen çalışma şartı arandığından zam kapsamı dışında kalır.","E":"Yer altında maden ocağı işinde çalışan sigortalının, fiili hizmet süresi zammından yararlandırılacağı dönem içinde kullandığı yıllık ücretli izin süresi için, fiilen çalışma ve risklere maruz kalma şartı aranmaksızın fiili hizmet süresi zammı uygulanır.","A":"Türk Silahlı Kuvvetlerinde subay olarak görev yapan sigortalıya fiili hizmet süresi zammı uygulanabilmesi için, ilgili işin risklerine fiilen maruz kalması şartı aranır.","D":"Birden fazla fiili hizmet süresi zammı bendine dahil olan sigortalıya, ilgili bentlerde öngörülen gün sayılarının toplamı uygulanır.","B":"Çimento fabrikasının otomatik fırınlarında çalışan sigortalının hafta tatili süresi, fiilen çalışma ve risklere maruz kalma şartı aranmaksızın fiili hizmet süresi zammı kapsamında değerlendirilir."},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.40 [1/8]","metin":"MADDE 40- (Değişik: 17/4/2008-5754/25 md.) Aşağıda belirtilen işyerlerinde ve işlerde 4 üncü maddenin birinci fıkrasının (a) ve (c) bentleri kapsamında çalışan sigortalıların prim ödeme gün sayılarına, bu işyerlerinde ve işlerde geçen çalışma sürelerinin her 360 günü için karşılarında gösterilen gün sayıları, fiilî hizmet süresi zammı olarak eklenir. 360 günden eksik sürelere ait fiilî hizmet süresi zammı, 360 gün için eklenen fiilî hizmet süresi ile orantılı olarak belirlenir. Çalışmanın fiili hizmet süresi zammı kapsamında değerlendirilebilmesi için, tablonun (13) ve (14) numaralı sıralarında belirtilen sigortalılar hariç sigortalının kapsamdaki işyerleri ile birlikte belirtilen işlerde fiilen çalışması ve söz konusu işlerin risklerine maruz kalması şarttır. (Ek cümle: 10/9/2014-6552/42 md.) Tablonun (10) numaralı sırasında belirtilen sigortalıların, fiili hizmet süresi zammından yararlandırılacakları dönem içinde kalan; yıllık ücretli izin, sıhhi izin, hafta tatili, ulusal bayram ve genel tatil günleri ile eğitim, kurs, iş öncesi ve sonrası hazırlık 17/4/2008 tarihli ve 5754 sayılı Kanunun 65 inci maddesiyle birinci fıkrada yer alan “malûl kalan” ibaresi “malûl veya vazife malûlü olan” şeklinde değiştirilmiş; aynı Kanunun 66 ncı maddesiyle ikinci fıkrada yer alan “Malûllük” ibaresinden sonra gelmek üzere “, vazife malûllüğü” ibaresi eklenmiştir. 55 sürelerinde fiilen çalışma ve söz konusu işlerin risklerine maruz kalma şartı aranmaz. Aşağıdaki bentlerden birden fazlasına dahil olanlar için, en yüksek olan bentten fiilî hizmet süresi zammı uygulanır. Kapsamdaki İşler/İşye…"},{"ad":"5510 s. SGK Kanunu m.40 [2/8]","metin":"2) Kurşunlu madenlerden yahut içinde kurşun bulunan kül, maden köpüğü, kurşun fırın kurumu, üstübeç artığı ve benzeri maddelerden kurşun üretimi için yapılan izabe işlerinde çalışanlar. 3) Antimuan, kalay, bronz ve benzeri maddelerle yapılan kurşun alaşımı işlerinde çalışanlar. 4) Kurşun izabe fırınlarının teksif odalarında biriken kuru tozları kaldırma işlerinde çalışanlar. 2) Cam fabrika ve atölyeleri 1) Cam yapımında kullanılan ilkel maddeleri toz haline getirme, eleme, karıştırma ve kurutma işlerinde (bu işleri yapmak üzere tam kapalı odalar içinde otomatik makineli tesisat veya çalışma ortamındaki tozları sağlık için tehlike oluşturmayacak düzeye indiren havalandırma tesisatı bulunmadığı takdirde) çalışanlar. 2) Eritme işlerinde (otomatik besleme fırınlarıyla çalışılmadığı takdirde) çalışanlar. 3) Ateşçilik işlerinde çalışanlar. 4) Üfleme işlerinde (tamamen otomatik makinelerle yapılmadığı takdirde) çalışanlar. 5) Basınçla yapılan cam işlerinde (cam tazyiki işleri) çalışanlar. 6) Ayna camı sanatında potalı cam dökümü işlerinde (potalar kalıp masasına mekanik araçlarla taşınmadığı takdirde) çalışanlar. 7) Camı fırın başından alma işlerinde çalışanlar. 8) Yayma fırınlarında düzeltme işlerinde çalışanlar. 9) Traş işlerinde çalışanlar. 10) Asitle hak ve cilâlama işlerinde çalışanlar. 11) Basınçlı havayla kum püskürten cihazlarla yapılan işlerde (çalışma ortamındaki tozları Eklenecek Gün Sayısı 60 90 60 Kapsamdaki İşler/İşyerleri Kapsamdaki Sigortalılar Eklenecek Gün Sayısı sağlık için tehlike oluşturmayacak düzeye indiren havalandırma tesisatı bulunmadığı takdirde) çalışan…"}],"hakem":"Doğru sık, 5510 s. Kanun m.40\u0027ın ek cümlesi (10/9/2014-6552/42 md.) tarafından açıkça desteklenmektedir; tablonun (10) numaralı sırasındaki (yer altı işleri) sigortalıların yıllık ücretli izin süresinde fiilen çalışma ve risklere maruz kalma şartı aranmaksızın fiili hizmet süresi zammı uygulanır."},"kayitlar":[],"sade":{"siklar":{"C":"Yer altı maden işçisinin eğitim ve kurs süresi, fiilen çalışma şartı aranmaksızın fiili hizmet süresi zammına dahil edilir; kanun bu süreleri açıkça kapsamına almıştır.","E":"Doğru seçenek, diğer şıklar gerekçeleri yukarıda verilmiştir.","A":"Türk Silahlı Kuvvetleri personeli fiili hizmet süresi zammında risklere maruz kalma şartından muaftır; kanun onları açıkça istisna tutmuştur.","D":"Birden fazla zammı bendin kapsamına giren işçiye, gün sayıları toplanmaz; yalnız en yüksek gün sayısını öngören bend uygulanır.","B":"Çimento fabrikasının otomatik fırınlarında çalışanlar, yıllık izin gibi süreler için şart aranmayan istisnadan yararlanmaz; bu istisna yalnız yer altı maden işçilerine tanınmıştır."},"dogru":"Yer altı maden işçisinin yıllık ücretli izin süresi fiili hizmet süresi zammına dahil edilir; bu süre için fiilen çalışma ve risk şartı aranmaz. Kanun bu işçilere özel istisna tanımıştır.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 40. madde ek cümle","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 40. madde","tanim":"Belirtilen tehlikeli işyerleri ve işlerde çalışan sigortalıların prim ödeme gün sayısına her 360 günü için eklenen ek gün sayısı.","ad":"fiili hizmet süresi zammı"},{"kaynak":"5510 s. SGK Kanunu 40. madde","tanim":"Sosyal Sigortalar Kanunu 40. maddenin tablosunun 10. sırasında belirtilen, fiili hizmet süresi zammı kapsamındaki işler.","ad":"yer altı maden işleri"},{"kaynak":"5510 s. SGK Kanunu 40. madde ek cümle","tanim":"Yer altı maden işçilerinin fiili hizmet süresi zammından yararlandırılacağı dönem içinde kullanmış olduğu ve fiilen çalışma ile risk şartı aranmaksızın zamma dahil edilen süre.","ad":"yıllık ücretli izin"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027na göre fiili hizmet süresi zammı uygulamasına ilişkin aşağıdaki ifadelerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-30","verilenler":[],"dayanak":"5510 sayılı Kanun m.40, fıkra 1 ve ek cümle (10/9/2014-6552/42 md.)","dogru":"E","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Zonguldak\u0027ta bir taşkömürü işletmesinde, yer altı maden ocağında 6 yıldır kazma işinde çalışan Bilal, 2023 yılında 21 gün yıllık ücretli izne çıkıyor.","anlatim":"İşveren, Bilal\u0027in bu 21 günlük izin süresini fiili hizmet süresi zammı hesabına katıp katmayacağını sana soruyor. Sen de kanunun ne dediğine bakacaksın.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanun m.40\u0027a göre kural iki katmanlı; genel kural fiilen çalışma ve risk şartı arar, ama (10) numaralı sıradaki yer altı işçileri için ek cümle bazı sürelerde bu şartı kaldırır. Bu tek olayda beş ifadeyi tek tek deneyeceğiz.","anlatim":"Beş şıkkı da Bilal\u0027in olayına ya da benzer bir olaya uygulayıp doğru mu yanlış mı karar vereceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.40/1","karar":"yanlış","anlatim":"Hayır, madde tablonun (13) ve (14) numaralı sıralarındaki sigortalıları bu şarttan hariç tutar. Subay bu istisna kapsamına girebilir, şart aranmayabilir.","formul":"Şık A: Bir subay için \u0027fiilen çalışma ve risk şartı her sigortalıya aranır\u0027 desen, doğru mu dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.40, ek cümle (6552/42 md.)","karar":"yanlış","anlatim":"Hayır, şartsız istisna sadece (10) numaralı sıradaki yer altı işçilerine tanınmıştır. Çimento işçisi bu istisnaya dahil değildir.","formul":"Şık B: Çimento fabrikasında hafta tatili süresinin şartsız zam kapsamına girdiğini söylesen, doğru mu olur?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.40, ek cümle (6552/42 md.)","karar":"yanlış","anlatim":"Hayır, ek cümle tam tersini söyler; eğitim, kurs ve hazırlık süreleri de şartsız zam kapsamına girer. Bilal bu süre için de zam alır.","formul":"Şık C: Bilal\u0027in eğitim-kurs süresinin, fiilen çalışma şartı arandığı için zam kapsamı dışında kaldığını söylesen, doğru mu olur?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.40/1, son fıkra","karar":"yanlış","anlatim":"Hayır, kanun toplama değil seçim yapar; en yüksek gün sayısı olan bent uygulanır. Toplama yapılsaydı Bilal haksız yere fazla gün alırdı.","formul":"Şık D: Bilal birden fazla bende girseydi, gün sayılarının toplanacağını söylesen, doğru mu olur?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.40, ek cümle (6552/42 md.)","karar":"doğru","anlatim":"Evet, ek cümle açıkça (10) numaralı sıradaki yer altı işçisinin yıllık ücretli izin süresini bu istisnaya dahil eder. Bilal maden ocağında çalıştığı için bu istisnadan yararlanır.","formul":"Şık E: Bilal\u0027in 21 günlük yıllık izninin, şart aranmaksızın fiili hizmet süresi zammına dahil edildiğini söylesen, doğru mu olur?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Genel kural şart arar ama (10) numaralı sıradaki yer altı işçisi için izin, tatil, eğitim gibi süreler istisnadır; kendine hep şunu sor: bu sigortalı (10) numaralı sırada mı ve bu süre ek cümlede sayılan sürelerden biri mi?","doldur":[]}],"anahtar":[{"ornek":"istisnadır","kok":"istisn"},{"ornek":"numaralı","kok":"numara"},{"ornek":"sürelerinde","kok":"sürele"},{"ornek":"süresi","kok":"süresi"},{"ornek":"sıradaki","kok":"sırada"},{"ornek":"işçisi","kok":"işçisi"}],"konuGiris":{"harita":"Ne zaman test edilir: sigortalının kapsamdaki işte fiilen çalışıp riske maruz kaldığı süre boyunca. Nasıl ölçülür: her 360 günlük fiili çalışma karşılığında kanunda belirlenen gün sayısı, eksik sürelerde orantılı olarak hesaplanır. Nasıl kaydedilir: hesaplanan ek gün sayısı sigortalının prim ödeme gün sayısına eklenerek kayıt altına alınır.","desen":"Sınav genelde fiili çalışma şartının hangi sigortalılarda aranmadığını (tablonun 10 ve 13-14 numaralı sıraları) karıştırarak sorar. Diğer bir tuzak, 360 günden eksik sürede zammın orantılı değil tam hesaplanacağı yanılgısıdır. Bu soru m.40 fıkra 1 ve ek cümle noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Sigortalının kapsamdaki işte gerçekten çalışması ve riske maruz kalması zorunluluğu","ad":"Fiili çalışma şartı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tam yıl çalışma karşılığı belirlenen ek gün sayısının hesaplanma temeli","ad":"360 gün oranı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"360 günlük çalışmadan sonra prim gün sayısına katılacak, toplam süreyi artıran ilave gün miktarı","ad":"Eklenecek gün sayısı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Birden fazla kapsama girenlerde yalnız en fazla gün sağlayan bendin uygulanması kuralı","ad":"En yüksek bent uygulaması","kim":"kanun sabitler"}],"sinavda":"Sigortalının çalıştığı işyeri ve süre verilir, hangi ifadenin doğru olduğu istenir.","panel_ornek":"Bir markette çalışan arkadaşın her 12 ayda bir 1 gün ekstra izin kazandığını düşün, yani çalıştığı süreye orantılı bonus birikiyor. 6 ay çalışırsa yarım gün, tam yıl çalışırsa tam gün kazanır. Fiili hizmet süresi zammı da böyle çalışılan süreyle orantılı ekleme yapar.","ornek":"Bir markette çalışan arkadaşın her 12 ayda bir 1 gün ekstra izin kazandığını düşün, yani çalıştığı süreye orantılı bonus birikiyor. 6 ay çalışırsa yarım gün, tam yıl çalışırsa tam gün kazanır. Fiili hizmet süresi zammı da böyle çalışılan süreyle orantılı ekleme yapar.","yontemler":"Kritik kural, fiilen çalışma ve riske maruz kalma şartının sadece tablonun 10, 13 ve 14 numaralı sıralarında aranmamasıdır.","nedir":"Fiili hizmet süresi zammı, riskli işlerde çalışanların prim gün sayısına ek gün eklenmesini sağlayan bir uygulamadır. Sınav bu ek günlerin hangi şarta bağlı olduğunu ve nasıl hesaplandığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Ters Okuma Tuzağı","metin":"Öğrenci ek cümledeki istisnayı tersine okuyup eğitim-kurs süresinde şart arandığını sanır. Doğrusu: Ek cümle (10) numaralı sıradaki sigortalılar için eğitim, kurs süresinde de fiilen çalışma ve risk şartı aranmayacağını düzenler."},"A":{"ad":"Fiilen Çalışma Şartı Tuzağı","metin":"Öğrenci genel kuralı (fiilen çalışma ve risklere maruz kalma şartı) tüm sigortalılara uygulanır sanır. Doğrusu: Kanun tablonun (13) numaralı sırasında yer alan Türk Silahlı Kuvvetleri personelini bu şarttan açıkça istisna tutmuştur, onlar için ayrıca fiilen risklere maruz kalma aranmaz."},"D":{"ad":"Toplama Tuzağı","metin":"Öğrenci birden fazla bende girmeyi, gün sayılarının toplanacağı şeklinde yorumlar. Doğrusu: Kanun birden fazla bende dahil olanlar için yalnızca en yüksek gün sayısını öngören bendin uygulanacağını belirtir, toplama yapılmaz."},"B":{"ad":"İstisnanın Kapsamını Genişletme Tuzağı","metin":"Öğrenci, hafta tatili gibi sürelerde şart aranmaması istisnasının tüm işkolları için geçerli olduğunu sanır. Doğrusu: Bu istisna yalnız tablonun (10) numaralı sırasındaki yer altı işlerinde çalışanlar için tanınmıştır, çimento fabrikası (4. sıra) bu istisnanın dışındadır."}},"celdiriciYol":{},"hap":"Fiili hizmet süresi zammında genel şart fiilen çalışma ve risklere maruz kalmadır; (13)-(14) sıraları bu şarttan tamamen, (10) sırası ise sayılan izin/tatil sürelerinde bu şarttan istisnadır ve birden fazla bende girenlere en yüksek bent uygulanır.","teshis":{"C":{"gercek":"Ek cümle açıkça eğitim, kurs, iş öncesi-sonrası hazırlık sürelerinde de fiilen çalışma ve risk şartı aranmayacağını söyler.","ayirt":"Madde metni bu süreyi \u0027şart aranır\u0027 mı yoksa \u0027şart aranmaz\u0027 listesine mi koymuş?","paragraf":"5510 s.K. m.40, ek cümle (6552/42 md.)","yanilgi":"Ek cümleyi tersine yorumlayıp eğitim-kurs süresinde şart arandığını sanıyorsun."},"E":{"gercek":"Ek cümle (10) numaralı sıradaki sigortalının yıllık ücretli izin süresini açıkça şartsız istisna kapsamına alır.","ayirt":"Sigortalı tablonun 10. sırasında mı ve süre ek cümlede sayılan sürelerden biri mi?","paragraf":"5510 s.K. m.40, ek cümle (6552/42 md.)","yanilgi":"Bu istisnanın da genel şarta tabi olduğunu düşünüp bu şıkkı elersin."},"A":{"gercek":"Madde 40, tablonun (13) ve (14) numaralı sıralarındaki sigortalıları bu şarttan açıkça hariç tutar.","ayirt":"Bu sigortalı tablonun 13 veya 14 numaralı sırasında mı, yoksa genel kural mı geçerli?","paragraf":"5510 s.K. m.40/1","yanilgi":"Fiilen çalışma ve risklere maruz kalma şartının istisnasız her sigortalıya uygulandığını sanıyorsun."},"D":{"gercek":"Kanun \u0027en yüksek olan bentten fiilî hizmet süresi zammı uygulanır\u0027 der, toplama değil seçim esastır.","ayirt":"Madde \u0027toplanır\u0027 mı diyor yoksa \u0027en yüksek olan\u0027 mı diyor?","paragraf":"5510 s.K. m.40/1, son fıkra","yanilgi":"Birden fazla bende girmenin gün sayılarını toplayarak zam getireceğini sanıyorsun."},"B":{"gercek":"Bu istisna yalnızca 6552/42 md. ile eklenen cümle uyarınca tablonun (10) numaralı sırası (yer altı işleri) için tanınmıştır.","ayirt":"Bu istisna hangi sıra numarasına özgü, sigortalı o sırada mı yer alıyor?","paragraf":"5510 s.K. m.40, ek cümle (6552/42 md.)","yanilgi":"İzin/tatil sürelerinde şart aranmaması istisnasının tüm işkollarına uygulandığını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 108"},"kural":"5510 sayılı Kanunun 18 inci maddesinin birinci fıkrasının (a), (b) ve (c) bentleri uyarınca geçici iş göremezlik ödeneği iş kazası ve meslek hastalığı, hastalık ve analık hallerinde verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 108","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklarda üç sigorta kolu sayıldığında hemen \u0027iş kazası-meslek hastalığı, hastalık, analık\u0027 üçlüsünü ara; bu üçlüden sapan her şık elenir.","konu":"geçici is göremezlik sigorta kolları","tablo":{"satirlar":[["A) İşsizlik sigortası, malûllük sigortası, yaşlılık sigortası","m.18/1","YANLIŞ ifade"],["B) İş kazası ve meslek hastalığı sigortası, hastalık sigort…","m.18/1(a)(b)(c)","doğru ifade"],["C) Hastalık sigortası, yaşlılık sigortası, ölüm sigortası","m.18/2","YANLIŞ ifade"],["D) Analık sigortası, malûllük sigortası, iş kazası ve mesle…","m.18/1","YANLIŞ ifade"],["E) İş kazası ve meslek hastalığı sigortası, işsizlik sigort…","m.18/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Hastalık sigortası, yaşlılık sigortası, ölüm sigortası","E":"İş kazası ve meslek hastalığı sigortası, işsizlik sigortası, hastalık sigortası","A":"İşsizlik sigortası, malûllük sigortası, yaşlılık sigortası","D":"Analık sigortası, malûllük sigortası, iş kazası ve meslek hastalığı sigortası","B":"İş kazası ve meslek hastalığı sigortası, hastalık sigortası, analık sigortası"},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.18 [1/3]","metin":"MADDE 18- Kurumca yetkilendirilen hekim veya sağlık kurullarından istirahat raporu alınmış olması şartıyla; a) İş kazası veya meslek hastalığı nedeniyle iş göremezliğe uğrayan sigortalıya her gün için, b) (Değişik: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (a) bendi ile 5 inci madde kapsamındaki sigortalılardan hastalık sigortasına tabi olanların hastalık sebebiyle iş göremezliğe uğraması halinde, iş göremezliğin başladığı tarihten önceki bir yıl içinde en az doksan gün kısa vadeli sigorta primi bildirilmiş olması şartıyla geçici iş göremezliğin üçüncü gününden başlamak üzere her gün için, c) (Değişik: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (a) bendi ile (b) bendinde belirtilen muhtarlar ile aynı bendin (1), (2) ve (4) numaralı alt bentleri kapsamındaki sigortalı kadının analığı halinde, doğumdan önceki bir yıl içinde en az doksan gün kısa vadeli sigorta primi bildirilmiş olması şartıyla, doğumdan önceki sekiz ve sonraki onaltı haftalık sürede, çoğul gebelik halinde ise doğumdan önceki sekiz haftalık süreye iki haftalık süre ilâve edilerek çalışmadığı her gün için,33 d) (Değişik: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (a) bendi ile (b) bendinde belirtilen muhtarlar ile aynı bendin (1), (2) ve (4) numaralı alt bentleri kapsamındaki sigortalı kadının, erken doğum yapması halinde doğumdan önce kullanamadığı çalıştırılamayacak süreler ile isteği ve hekimin onayıyla doğuma iki hafta kalıncaya kadar çalışması halinde, doğum sonrası istirahat süresine eklenen süreler için,3435 geçici iş göremezlik ödeneği verilir."},{"ad":"5510 s. SGK Kanunu m.18 [2/3]","metin":"(Değişik ikinci fıkra: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (b) 15/4/2021 tarihli ve 7316 sayılı Kanunun 9 uncu maddesiyle, bu bentte yer alan “üç aylık” ibaresi madde metninden çıkarılmıştır. 33 22/4/2026 tarihli ve 7578 sayılı Kanunun 19 uncu maddesiyle bu bentte yer alan “doğumdan önceki ve sonraki sekizer haftalık sürede” ibaresi “doğumdan önceki sekiz ve sonraki onaltı haftalık sürede” şeklinde değiştirilmiştir. 34 13/2/2011 tarihli ve 6111 sayılı Kanunun 29 uncu maddesiyle, bu bentte yer alan “sigortalı kadının isteği ve hekimin onayı ile doğuma üç hafta kalıncaya kadar çalışması halinde,” ibaresi “sigortalı kadının, erken doğum yapması halinde doğumdan önce kullanamadığı çalıştırılamayacak süreler ile isteği ve hekimin onayıyla doğuma üç hafta kalıncaya kadar çalışması halinde,” şeklinde değiştirilmiştir. 35 22/4/2026 tarihli ve 7578 sayılı Kanunun 19 uncu maddesiyle bu bentte yer alan “üç” ibaresi “iki” şeklinde değiştirilmiştir. 32 bendine göre sigortalı sayılanlara iş kazası veya meslek hastalığı ya da analık halinde geçici iş göremezlik ödeneği, genel sağlık sigortası dahil prim ve prime ilişkin her türlü borçlarının ödenmiş olması şartıyla yatarak tedavi süresince veya yatarak tedavi sonrası bu tedavinin gereği olarak istirahat raporu aldıkları sürede ödenir. Ancak bu maddenin birinci fıkrasının (c) bendine göre doğum öncesi ve doğum sonrası çalışmadığı sürelerde geçici iş göremezlik ödeneğinin ödenebilmesi için yatarak tedavi şartı aranmaz. (Değişik üçüncü fıkra: 17/4/2008-5754/11 md.) İş kazası, meslek hastalığı, hastalık ve sigortalı kadı…"}],"hakem":"5510 s. SGK Kanunu m.18/1(a)(b)(c) bentlerine göre geçici iş göremezlik ödeneği iş kazası ve meslek hastalığı, hastalık ve analık sigortası kollarında sağlanır; B şıkkı bu üç kolı eksiksiz ve doğru olarak sayıyor."},"kayitlar":[],"sade":{"siklar":{"C":"Hastalık doğru ancak yaşlılık ve ölüm uzun vadeli sigorta kollarıdır; bunlar geçici iş göremezlik değil aylık bağlarlar.","E":"İşsizlik sigortası ayrı bir kanunla düzenlenmiş sistem olup geçici iş göremezlik ödeneği sağlamaz; yerine hamilelik sigortası gelmelidir.","D":"Hamilelik ve iş kazası-meslek hastalığı doğru olsa da malûllük uzun vadeli sigorta koludur; yerine hastalık sigortası gelmelidir.","A":"Malûllük, yaşlılık ve işsizlik uzun vadeli sigorta kollarıdır veya ayrı bir kanunla düzenlenmiş sistemdir; geçici iş göremezlik ödeneği bunlarda değil, iş kazası-meslek hastalığı-hastalık-hamilelikte verilir."},"dogru":"Geçici iş göremezlik ödeneği, çalışan biri iş kazası, meslek hastalığı, hastalık veya hamilelik nedeniyle çalışamaz hale geldiğinde verilir. Bu üç durumda doktor raporu alınmış olması gerekir. İş kazası ve meslek hastalığında koşulsuz, hastalık ve hamilelikte ise önceki bir yıl içinde en az 90 gün prim ödenmişse ödeme yapılır.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 18. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 18. madde","tanim":"Çalışan kişinin iş kazası, meslek hastalığı, hastalık veya hamilelik nedeniyle çalışamaz hale gelmesi durumunda, doktor raporu şartıyla günlük kazancının bir kısmı olarak verilen parasal yardım.","ad":"Geçici iş göremezlik ödeneği"},{"kaynak":"5510 s. SGK Kanunu 18. madde","tanim":"İş kazası, meslek hastalığı, hastalık, hamilelik gibi kısa süreli risklere karşı yapılan sigorta; geçici iş göremezlik ödeneği bu sigorta kollarına bağlı olarak verilir.","ad":"Kısa vadeli sigorta"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027na göre kısa vadeli sigorta kollarından geçici iş göremezlik ödeneği sağlanan haller aşağıdakilerin hangisinde eksiksiz ve doğru olarak sayılmıştır?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-28","verilenler":[],"dayanak":"5510 sayılı SGK Kanunu m.18/1(a)(b)(c)","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir tekstil fabrikasında çalışan Ahmet, 3 Mart 2024\u0027te makinede parmağını sıkıştırıyor ve doktor ona 12 gün istirahat raporu veriyor.","anlatim":"Ahmet\u0027in iş göremediği bu 12 gün boyunca SGK ona bir ödenek bağlayacak mı, bağlayacaksa hangi sigorta kolundan bağlayacak, bunu çözeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanun madde 18\u0027e göre geçici iş göremezlik ödeneği sadece üç halde verilir: iş kazası-meslek hastalığı, hastalık, analık.","anlatim":"Şimdi beş şıktaki sigorta kolu listelerini Ahmet\u0027in olayına ve bu üçlü kurala tek tek uygulayacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.18/1","karar":"yanlış","anlatim":"Ahmet çalışıyor, işten çıkmadı; işsizlik sigortası zaten devreye girmez. Yaşlılık ve malûllük uzun vadeli koldur, aylık bağlar, günlük ödenek değil.","formul":"Şık A: patron \u0027Ahmet\u0027e işsizlik sigortasından ve yaşlılık sigortasından geçici ödenek bağlanır\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.18/1(a)(b)(c)","karar":"doğru","anlatim":"Madde 18/1(a) iş kazasını, (b) hastalığı, (c) analığı sayar; üçü de geçici iş göremezlik ödeneği bağlar. Ahmet\u0027in olayı tam bu üçlüye giriyor.","formul":"Şık B: muhasebeci \u0027Ahmet\u0027in parmak kazası iş kazası sigortasından, hastalık ve analık halleri de aynı maddeden ödenir\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.18/2","karar":"yanlış","anlatim":"Hastalık doğru ama yaşlılık ve ölüm sigortası aylık/gelir bağlar, geçici günlük ödenekle ilgisi yok. Ahmet\u0027in kazası bu iki kolu ilgilendirmez.","formul":"Şık C: personel şefi \u0027Ahmet\u0027e hastalık, yaşlılık, ölüm sigortasından ödenek çıkar\u0027 diyor, ona hak verir misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.18/1","karar":"yanlış","anlatim":"Analık ve iş kazası doğru ama malûllük sigortası uzun vadelidir, sürekli aylık bağlar. Ahmet\u0027in 12 günlük raporuna malûllük sigortası bakmaz.","formul":"Şık D: SGK memuru \u0027analık, malûllük, iş kazası sigortası üçü birden geçici ödenek verir\u0027 diyor, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.18/1","karar":"yanlış","anlatim":"İş kazası ve hastalık doğru ama işsizlik sigortası 4447 sayılı Kanuna tabidir, işsizlik ödeneği verir; geçici iş göremezlik değildir. Ahmet işini kaybetmedi zaten.","formul":"Şık E: sendika temsilcisi \u0027iş kazası, işsizlik, hastalık sigortası birlikte ödenek bağlar\u0027 diyor, kabul eder misin?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Ahmet\u0027in olayı sana gösteriyor ki geçici iş göremezlik ödeneği yalnız iş kazası-meslek hastalığı, hastalık ve analıkta çıkar; kendine hep şunu sor: bu kol bana günlük ödenek mi bağlıyor, yoksa aylık/gelir mi?","doldur":[]}],"anahtar":[{"ornek":"sigortası","kok":"sigort"},{"ornek":"hastalığı","kok":"hastal"},{"ornek":"kazası","kok":"kazası"},{"ornek":"göremezlik","kok":"göreme"},{"ornek":"geçici","kok":"geçici"},{"ornek":"ödeneği","kok":"ödeneğ"}],"konuGiris":{"harita":"Ne zaman test edilir: iş kazası, meslek hastalığı, hastalık ve analık hallerinin hangi şartlarla ödenek doğurduğu sorulduğunda. Nasıl ölçülür: madde 18\u0027deki dört halin (a,b,c,d) eksiksiz sayılıp sayılmadığına bakılarak. Nasıl kaydedilir: doğru şık, kanunda sayılan halleri hiçbirini eksik bırakmadan ve fazladan hal eklemeden veren şıktır.","desen":"Soru, madde 18\u0027deki dört halin (iş kazası/meslek hastalığı, hastalık, analık, erken doğum) hepsinin eksiksiz sayıldığı şıkkı bulmayı ister; tuzak şıklar bir veya iki hali eksik bırakır ya da kanunda olmayan bir hal ekler. Sınav arşivinde bu konu 1 dönemde soruldu. Bu soru m.18 [1/3] paragrafından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"yetkili hekim/sağlık kurulunca verilen, iş göremezliği belgeleyen rapor","ad":"istirahat raporu","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"hastalık ve analık halinde ödenek için aranan asgari kısa vadeli sigorta primi süresi","ad":"doksan gün prim şartı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"iş kazası, meslek hastalığı, hastalık veya analık nedeniyle çalışılamayan durum","ad":"geçici iş göremezlik hali","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"günlük kazancın yatarak tedavide yarısı, ayaktan tedavide üçte ikisi olan kısmı","ad":"ödenek oranı","kim":"kanun sabitler"}],"sinavda":"Soru, kısa vadeli sigorta kollarından geçici iş göremezlik ödeneği sağlanan hallerin eksiksiz sayıldığı şıkkı seçmeyi ister.","panel_ornek":"Bir arkadaşın kolunu kırdığı için 5 gün işe gidemedi ve o günler için işyeri ona maaş yerine küçük bir günlük yardım ödedi. Ama bu yardımı almak için önce doktordan resmi bir rapor alması gerekti. Rapor olmadan hiçbir ödeme yapılmıyor.","ornek":"Bir arkadaşın kolunu kırdığı için 5 gün işe gidemedi ve o günler için işyeri ona maaş yerine küçük bir günlük yardım ödedi. Ama bu yardımı almak için önce doktordan resmi bir rapor alması gerekti. Rapor olmadan hiçbir ödeme yapılmıyor.","yontemler":"Dört halin (iş kazası/meslek hastalığı, hastalık, analık, erken doğum) tamamının şıkta yer alıp almadığını tek tek kontrol et; eksik veya fazla hal içeren şıkları ele.","nedir":"Geçici iş göremezlik ödeneği, sigortalının iş kazası, meslek hastalığı, hastalık veya analık nedeniyle çalışamadığı günler için SGK tarafından bağlanan günlük ödemedir. Sınav bu hallerin hangi şartlarla ve hangi hallerde eksiksiz sayıldığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Yarım Doğru Tuzağı","metin":"Hastalık sigortası doğru olsa da yaşlılık ve ölüm sigortası uzun vadeli sigorta kollarına ait olup geçici iş göremezlik ödeneği vermez, aksine gelir ve aylık bağlar. Doğrusu: yalnız iş kazası-meslek hastalığı, hastalık ve analık sigortaları geçici iş göremezlik ödeneği sağlar."},"E":{"ad":"Sigorta Kolu Karıştırma Tuzağı","metin":"İşsizlik sigortası, 4447 sayılı Kanuna tabi ayrı bir sigorta kolu olup 5510 sayılı Kanunun 18 inci maddesi kapsamında geçici iş göremezlik ödeneği sağlamaz. Doğrusu: üçüncü kalem analık sigortası olmalıdır, işsizlik sigortası değil."},"D":{"ad":"Fazla Kalem Ekleme Tuzağı","metin":"Analık ve iş kazası-meslek hastalığı doğru olsa da malûllük sigortası kısa vadeli değil uzun vadeli sigorta koludur ve geçici iş göremezlik değil malûllük aylığı bağlar. Doğrusu: üçüncü kalem hastalık sigortası olmalıdır, malûllük sigortası değil."},"A":{"ad":"Uzun Vadeli Karıştırma Tuzağı","metin":"Malûllük ve yaşlılık uzun vadeli sigorta kollarındandır, işsizlik sigortası ise ayrı bir sigorta koludur; hiçbiri geçici iş göremezlik ödeneği sağlamaz. Doğrusu: geçici iş göremezlik yalnız iş kazası-meslek hastalığı, hastalık ve analık hallerinde ödenir."}},"celdiriciYol":{},"hap":"Geçici iş göremezlik ödeneği yalnız iş kazası-meslek hastalığı, hastalık ve analık sigortası kollarında sağlanır; bunlar dışındaki tüm kollar (malûllük, yaşlılık, ölüm, işsizlik) uzun vadeli veya ayrı bir sigorta koludur.","teshis":{"C":{"gercek":"Yaşlılık ve ölüm sigortaları uzun vadeli sigorta koludur, gelir/aylık bağlar; geçici iş göremezlik ödeneğiyle ilgisi yoktur.","ayirt":"Bu kol bana günlük ödenek mi bağlıyor yoksa ömür boyu aylık mı?","paragraf":"m.18/2","yanilgi":"Hastalık sigortasını doğru bildiğin için yanına yaşlılık ve ölüm sigortasını ekleyip listeyi tamamlayabileceğini sanıyorsun."},"E":{"gercek":"İşsizlik sigortası ayrı bir kanuna (4447 sayılı Kanun) tabidir ve işsizlik ödeneği verir, geçici iş göremezlik ödeneği vermez.","ayirt":"Bu ödenek işsizlik halinde mi yoksa çalışamama (istirahat) halinde mi bağlanıyor?","paragraf":"m.18/1","yanilgi":"İşsizlik sigortasının da kısa vadeli sigorta kolları içinde geçici iş göremezlik sağladığını sanıyorsun."},"A":{"gercek":"Madde 18, geçici iş göremezlik ödeneğini yalnız iş kazası-meslek hastalığı, hastalık ve analık hallerine bağlar; malûllük, yaşlılık ve işsizlik bu kapsamda değildir.","ayirt":"Bu sigorta kolu bana \u0027gün\u0027 esaslı geçici bir ödenek mi, yoksa \u0027aylık/gelir\u0027 mi bağlıyor?","paragraf":"m.18/1","yanilgi":"Kısa vadeli sigorta kollarını uzun vadeli olanlarla ve işsizlik sigortasıyla karıştırıyorsun."},"D":{"gercek":"Malûllük sigortası uzun vadeli sigorta kolu olup aylık bağlar; kısa vadeli kollar iş kazası-meslek hastalığı, hastalık ve analıktır.","ayirt":"Malûllük sigortası bana gün esaslı ödenek mi, yoksa sürekli aylık mı verir?","paragraf":"m.18/1","yanilgi":"Malûllük sigortasının da kısa vadeli sigorta kolları arasında olduğunu sanıyorsun."},"B":{"gercek":"5510 sayılı Kanunun 18 inci maddesinin (a), (b) ve (c) bentleri geçici iş göremezlik ödeneğini iş kazası-meslek hastalığı, hastalık ve analık hallerine bağlamıştır.","ayirt":"Madde 18\u0027in üç bendi hangi üç hali sayıyordu?","paragraf":"m.18/1(a)(b)(c)","yanilgi":"Üç kolu birden doğru saymanın fazla kolay göründüğünü düşünüp başka bir şıkka kayıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 108"},"kural":"5510 sayılı Kanun m.18/3\u0027e göre yatarak tedavide ödenek günlük kazancın yarısı, ayaktan tedavide üçte ikisidir; aynı dönemde birden çok hal (iş kazası, hastalık, analık) birleşirse en yüksek ödenek verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 108","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"İki tedavi türünün oranını (yarısı/üçte ikisi) ayrı ayrı hesapla, sonra \u0027en yükseği verilir\u0027 kuralını en son uygula.","konu":"geçici is göremezlik sigorta kolları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Günlük kazanç","2.400 TL","-"],["İş kazası - yatarak tedavi","yatarak tedavi","-"],["Hastalık - ayaktan tedavi, 90 gün prim şartı","90 gün prim şartı sağlanmış","-"],["HESAP","-","-"],["İş kazası ödeneği (yatarak, kazancın yarısı)","2.400 / 2","1.200"],["Hastalık ödeneği (ayaktan, kazancın üçte ikisi)","2.400 x 2/3","1.600"],["Haller birleşince en yüksek ödeneğin seçilmesi","Max(1.200 ; 1.600)","1.600"]],"basliklar":["Kalem","Hesap","Tutar"]},"siklar":{"C":"1.600","E":"2.800","A":"800","D":"2.400","B":"1.200"},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.18 [1/3]","metin":"MADDE 18- Kurumca yetkilendirilen hekim veya sağlık kurullarından istirahat raporu alınmış olması şartıyla; a) İş kazası veya meslek hastalığı nedeniyle iş göremezliğe uğrayan sigortalıya her gün için, b) (Değişik: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (a) bendi ile 5 inci madde kapsamındaki sigortalılardan hastalık sigortasına tabi olanların hastalık sebebiyle iş göremezliğe uğraması halinde, iş göremezliğin başladığı tarihten önceki bir yıl içinde en az doksan gün kısa vadeli sigorta primi bildirilmiş olması şartıyla geçici iş göremezliğin üçüncü gününden başlamak üzere her gün için, c) (Değişik: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (a) bendi ile (b) bendinde belirtilen muhtarlar ile aynı bendin (1), (2) ve (4) numaralı alt bentleri kapsamındaki sigortalı kadının analığı halinde, doğumdan önceki bir yıl içinde en az doksan gün kısa vadeli sigorta primi bildirilmiş olması şartıyla, doğumdan önceki sekiz ve sonraki onaltı haftalık sürede, çoğul gebelik halinde ise doğumdan önceki sekiz haftalık süreye iki haftalık süre ilâve edilerek çalışmadığı her gün için,33 d) (Değişik: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (a) bendi ile (b) bendinde belirtilen muhtarlar ile aynı bendin (1), (2) ve (4) numaralı alt bentleri kapsamındaki sigortalı kadının, erken doğum yapması halinde doğumdan önce kullanamadığı çalıştırılamayacak süreler ile isteği ve hekimin onayıyla doğuma iki hafta kalıncaya kadar çalışması halinde, doğum sonrası istirahat süresine eklenen süreler için,3435 geçici iş göremezlik ödeneği verilir."},{"ad":"5510 s. SGK Kanunu m.18 [2/3]","metin":"(Değişik ikinci fıkra: 17/4/2008-5754/11 md.) 4 üncü maddenin birinci fıkrasının (b) 15/4/2021 tarihli ve 7316 sayılı Kanunun 9 uncu maddesiyle, bu bentte yer alan “üç aylık” ibaresi madde metninden çıkarılmıştır. 33 22/4/2026 tarihli ve 7578 sayılı Kanunun 19 uncu maddesiyle bu bentte yer alan “doğumdan önceki ve sonraki sekizer haftalık sürede” ibaresi “doğumdan önceki sekiz ve sonraki onaltı haftalık sürede” şeklinde değiştirilmiştir. 34 13/2/2011 tarihli ve 6111 sayılı Kanunun 29 uncu maddesiyle, bu bentte yer alan “sigortalı kadının isteği ve hekimin onayı ile doğuma üç hafta kalıncaya kadar çalışması halinde,” ibaresi “sigortalı kadının, erken doğum yapması halinde doğumdan önce kullanamadığı çalıştırılamayacak süreler ile isteği ve hekimin onayıyla doğuma üç hafta kalıncaya kadar çalışması halinde,” şeklinde değiştirilmiştir. 35 22/4/2026 tarihli ve 7578 sayılı Kanunun 19 uncu maddesiyle bu bentte yer alan “üç” ibaresi “iki” şeklinde değiştirilmiştir. 32 bendine göre sigortalı sayılanlara iş kazası veya meslek hastalığı ya da analık halinde geçici iş göremezlik ödeneği, genel sağlık sigortası dahil prim ve prime ilişkin her türlü borçlarının ödenmiş olması şartıyla yatarak tedavi süresince veya yatarak tedavi sonrası bu tedavinin gereği olarak istirahat raporu aldıkları sürede ödenir. Ancak bu maddenin birinci fıkrasının (c) bendine göre doğum öncesi ve doğum sonrası çalışmadığı sürelerde geçici iş göremezlik ödeneğinin ödenebilmesi için yatarak tedavi şartı aranmaz. (Değişik üçüncü fıkra: 17/4/2008-5754/11 md.) İş kazası, meslek hastalığı, hastalık ve sigortalı kadı…"}],"hakem":"Doğru sık (1.600 TL), 5510 s. Kanun m.18/3\u0027teki yatarak tedavide yarısı, ayaktan tedavide üçte ikisi kuralı ve birleşme halinde en yüksek ödenek verilmesi kuralı kaynak metinde açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Ödenek hesaplanırken günlük kazancın tamamı değil, yatarak tedavide yarısı, ayaktan tedavide üçte ikisi esas alınır.","E":"İş kazası ve hastalık ödeneklerini toplayıp 2.800 TL hesapladınız; oysa birleşme durumunda ödenekler toplanmaz, en yüksek olan seçilir.","A":"Ayaktan tedavide ödenek oranını üçte bir olarak ters uygulamışsınız; doğru oran günlük kazancın üçte ikisidir.","B":"Yalnız iş kazası halini dikkate alıp aynı dönemde hastalık halinin de bulunduğunu ve bu durumlarda en yüksek ödeneğin seçileceğini göz ardı ettiniz."},"dogru":"Sigortalı aynı anda iş kazası (yatarak tedavi, günlük kazancın yarısı = 1.200 TL) ve hastalık (ayaktan tedavi, günlük kazancın üçte ikisi = 1.600 TL) nedeniyle işe yaramadığında, birden fazla hal birleştiğinde en yüksek ödenek ödenir; bu nedenle 1.600 TL verilir.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 18. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 18. madde","tanim":"İş kazası, meslek hastalığı, hastalık veya analık nedeniyle sigortalı çalışamadığı günler için yapılan ödemedir; tutarı tedavi şekline (yatarak veya ayaktan) göre günlük kazancının belli bir oranı olarak hesaplanır.","ad":"Geçici iş göremezlik ödeneği"},{"kaynak":"5510 s. SGK Kanunu 18. madde","tanim":"Sigortalıda aynı dönemde iş kazası, meslek hastalığı, hastalık ve analık hallerinden birkaçının aynı anda ortaya çıkması halinde en yüksek ödenek verilir; ödenekler toplanmaz.","ad":"Halların birleşmesi"},{"kaynak":"5510 s. SGK Kanunu 18. madde","tanim":"Hastalık sigortasına tabi sigortalının hastalık nedeniyle iş göremez hale gelmesinden önce bir yıl içinde en az doksan gün bildirilmesi gereken primdir.","ad":"Kısa vadeli sigorta primi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":{"bosluk":[[1,1],[1,2],[2,1],[2,2]],"tablo":{"basliklar":["Kalem","Hesap","Tutar"],"satirlar":[["İş kazası ödeneği (yatarak, kazancın yarısı)","3.000 / 2","1.500"],["Hastalık ödeneği (ayaktan, kazancın üçte ikisi)","3.000 x 2/3","2.000"],["Haller birleşince en yüksek ödeneğin seçilmesi","Max(1.500 ; 2.000)","2.000"]]},"tur":"tablo","soru":"Sigortalı B, aynı dönemde hem iş kazası geçirip yatarak tedavi görmüş hem de kısa vadeli sigorta primine tabi hastalığı nedeniyle ayaktan tedavi görmüştür (90 günlük prim şartı sağlanmıştır). Günlük kazancı 3.000 TL olan sigortalıya 5510 sayılı Kanun\u0027un 18 inci maddesine göre ödenecek geçici iş göremezlik ödeneğinin günlük tutarı kaç TL\u0027dir?","verilen":[[0,1],[0,2]],"hedef":"Tabloyu doldur ve B\u0027nin günlük geçici iş göremezlik ödeneği tutarının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Sigortalı A, aynı dönemde hem iş kazası geçirip yatarak tedavi görmüş hem de kısa vadeli sigorta primine tabi hastalığı nedeniyle ayaktan tedavi görmüştür (90 günlük prim şartı sağlanmıştır). Günlük kazancı 2.400 TL olan sigortalıya 5510 sayılı Kanun\u0027un 18 inci maddesine göre ödenecek geçici iş göremezlik ödeneğinin günlük tutarı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-28","verilenler":[{"deger":"2.400 TL","anlam":"Her iki ödenek hesabının tabanını oluşturan günlük kazançtır.","ad":"Günlük kazanç"},{"deger":"yatarak tedavi","anlam":"m.18/3 gereği yatarak tedavide ödenek günlük kazancın yarısıdır.","ad":"İş kazası - yatarak tedavi"},{"deger":"90 gün prim şartı sağlanmış","anlam":"Şartın sağlandığı zaten belirtilmiştir, hesaba ayrıca girmez; yalnız ayaktan tedavi oranı (üçte iki) uygulanır.","ad":"Hastalık - ayaktan tedavi, 90 gün prim şartı"}],"dayanak":"5510 sayılı Kanun m.18/3 (yatarak tedavide yarısı, ayaktan tedavide üçte ikisi ve hallerin birleşmesinde en yüksek ödenek kuralı)","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Verilen: Günlük kazanç 2.400 TL (soruda verilen); yatarak tedavi (iş kazası) hali (soruda verilen); ayaktan tedavi (hastalık) hali (soruda verilen); 90 gün prim şartı sağlanmış (soruda verilen)","anlatim":"Soru bize şunları vermiş: günlük kazanç 2.400 TL, sigortalı hem iş kazası geçirip yatarak tedavi görmüş hem de hastalık nedeniyle ayaktan tedavi görmüş, 90 günlük prim şartı sağlanmış.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kural: 5510 sayılı Kanun madde 18/3 → yatarak tedavide oran %50, ayaktan tedavide oran %66,67","anlatim":"Geçici iş göremezlik ödeneği nedir? Sigortalının çalışamadığı günler için Sosyal Güvenlik Kurumu\u0027nun ödediği günlük paradır. Hangi hastalık ya da kaza olduğuna göre oranı değişir.","doldur":[]},{"formul":"İş kazası ödeneği = Günlük kazanç / 2 = 2.400 (soruda verilen) / 2 = 1.200 TL","anlatim":"İş kazası yatarak tedavi görüyor, bu durumda ödenek kazancın yarısı. Bunu hesaplıyoruz çünkü kanun yatan hasta için yarı oran belirlemiş.","doldur":[[5,1],[5,2]]},{"formul":"Hastalık ödeneği = Günlük kazanç × 2/3 = 2.400 (soruda verilen) × 2/3 = 1.600 TL","anlatim":"Hastalık ayaktan tedavi görüyor, bu durumda ödenek kazancın üçte ikisi. Ayaktan tedavide oran daha yüksek çünkü sigortalı işe devam edemese de evde tedavi görüyor.","doldur":[[6,1],[6,2]]},{"formul":"Birleşme kuralı: aynı dönemde birden çok hal varsa büyük olan ödenek seçilir","anlatim":"Aynı dönemde iki hal birleşince ne olur? Kanun burada sigortalıyı korur, düşük olanı değil yüksek olanı öder.","doldur":[]},{"formul":"Ödenecek tutar = büyük olan: 1.200 (2. adımda bulduk) ile 1.600 (3. adımda bulduk) → 1.600 TL","anlatim":"Şimdi iki tutarı karşılaştırıyoruz, çünkü kanun birleşme halinde en yüksek ödeneğin verilmesini emrediyor. Hastalık ödeneği iş kazası ödeneğinden büyük çıktı.","doldur":[[7,1],[7,2]]},{"formul":"Sonuç = 1.600 TL (5. adımda bulduk)","anlatim":"Sonuç olarak sigortalıya günlük 1.600 TL geçici iş göremezlik ödeneği ödenir. Bu tutar hastalık halinden gelen daha yüksek ödenektir.","doldur":[]},{"formul":"Ters durum: iş kazası ödeneği hastalık ödeneğinden büyük olsaydı → iş kazası tutarı seçilir","anlatim":"Ters durumda iş kazası ödeneği daha yüksek çıksaydı ne olurdu? O zaman kanun iş kazası tutarını seçtirirdi, hastalık tutarı değil.","doldur":[]},{"formul":"Yanlış yol: 1.200 + 1.600 = 2.800 TL (HATALI) → doğrusu büyük olan: 1.200 ile 1.600 → 1.600 TL (5. adımda bulduk)","anlatim":"En sık hata: öğrenci iki ödeneği toplayıp 2.800 TL bulur, bu yanlıştır. Kanun toplama değil en yüksek olanı seçmeyi emreder.","doldur":[]}],"anahtar":[{"ornek":"hastalık","kok":"hastal"},{"ornek":"tedavide","kok":"tedavi"},{"ornek":"ödeneği","kok":"ödeneğ"},{"ornek":"kazası","kok":"kazası"},{"ornek":"yüksek","kok":"yüksek"},{"ornek":"ödeneklerinin","kok":"ödenek"}],"konuGiris":{"harita":"Ne zaman test edilir: yatarak ve ayaktan tedavi bir arada olduğunda hangi oranın uygulanacağı sorulduğunda. Nasıl ölçülür: günlük kazanç, tedavi türüne göre 1/2 veya 2/3 oranıyla çarpılarak. Nasıl kaydedilir: birden çok hal birleşirse en yüksek ödenek esas alınarak kaydedilir.","desen":"Soru, aynı kişide iş kazası (yatarak) ve hastalık (ayaktan) hallerinin birleşmesini kurgulayarak öğrencinin iki oranı da hesaplayıp en yükseğini seçip seçmediğini test eder. Tuzak, ayaktan tedavi oranının (2/3) yatarak tedaviden (1/2) yüksek çıkacağını fark etmemektir. Bu soru m.18 üçüncü fıkra ve hallerin birleşmesi kuralından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Ödeneğin hesabına esas alınan günlük kazanç tutarı","ad":"Günlük kazanç","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Günlük kazancın yarısının ödenmesi kuralı","ad":"Yatarak tedavi oranı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Günlük kazancın üçte ikisinin ödenmesi kuralı","ad":"Ayaktan tedavi oranı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Birden çok hal birleşirse en yüksek ödeneğin verilmesi ilkesi","ad":"Hallerin birleşmesi kuralı","kim":"kanun sabitler"}],"sinavda":"Günlük kazanç ve iki farklı tedavi hali verilir, ödenecek günlük ödenek tutarı istenir.","panel_ornek":"Arkadaşın hem elektrik faturasından hem su faturasından indirim kazandı ama tek indirim uygulanabiliyor, o da bakıyor hangisi daha yüksekse onu kullanıyor, 30 TL yerine 50 TL indirimi seçiyor. Aynı mantık iki hak birleşince en yükseği alma kuralı.","ornek":"Arkadaşın hem elektrik faturasından hem su faturasından indirim kazandı ama tek indirim uygulanabiliyor, o da bakıyor hangisi daha yüksekse onu kullanıyor, 30 TL yerine 50 TL indirimi seçiyor. Aynı mantık iki hak birleşince en yükseği alma kuralı.","yontemler":"Her hal için ilgili oran ayrı hesaplanır, sonra en yüksek olan tutar cevap olarak seçilir.","nedir":"Geçici iş göremezlik ödeneği, sigortalının çalışamadığı günler için Kurumca ödenen tazminattır. Sınav, hangi tedavi türünde günlük kazancın hangi oranla çarpılacağını ve hak birleşmesinde hangi ödeneğin verileceğini ölçer."},"olay":"iş kazası (yatarak) 2.400/2=1.200; hastalık (ayaktan) 2.400x2/3=1.600; ikisinden yüksek olan 1.600 seçilir.","tuzak":{"D":{"ad":"Kazancın Tamamı Tuzağı","metin":"Günlük kazancın tamamının ödenek olarak ödendiğini sandın. Doğrusu: ödenek oranı yatarak tedavide yarısı, ayaktan tedavide üçte ikisidir; kazancın tamamı ödenmez."},"E":{"ad":"Toplama Tuzağı","metin":"İş kazası ve hastalık ödeneklerini birbirine ekledin. Doğrusu: haller birleştiğinde ödenekler toplanmaz, yalnızca en yükseği ödenir."},"A":{"ad":"Oran Karıştırma Tuzağı","metin":"Ayaktan tedavideki üçte iki oranını üçte bir gibi uyguladın. Doğrusu: ayaktan tedavide günlük kazancın üçte ikisi esas alınır, oran ters uygulanmaz."},"B":{"ad":"Tekil Hal Tuzağı","metin":"Yalnız iş kazası nedeniyle yatarak tedavi ödeneğini esas alıp hastalık halini ve birleşme kuralını hesaba katmadın. Doğrusu: aynı dönemde birden çok hal birleşirse en yüksek ödenek dikkate alınır."}},"celdiriciYol":{"D":"2.400 x 1 = 2.400 (günlük kazancın tamamının ödendiğini sandın)","E":"1.200 + 1.600 = 2.800 (iki ödeneği toplanacak sandın)","A":"2.400 / 3 = 800 (üçte iki oranını üçte bir gibi ters uyguladın)","B":"2.400 / 2 = 1.200 (yalnız iş kazası halini esas alıp birleşme kuralını atladın)"},"hap":"Aynı dönemde birden çok hal (iş kazası, hastalık, analık) birleşirse geçici iş göremezlik ödeneklerinin en yükseği ödenir.","teshis":{"C":{"gercek":"m.18/3\u0027e göre haller birleşince en yüksek ödenek seçilir; burada 1.600 TL, 1.200 TL\u0027den yüksektir.","ayirt":"İki tutardan hangisi büyük ve kural hangisini seçmemi söylüyor?","paragraf":"m.18/3","yanilgi":"Birleşme kuralını atlayıp iki tutarı ayrı ayrı doğru şık sanabilir, hangisinin esas alınacağını karıştırırsın."},"E":{"gercek":"m.18/3 son cümle haller birleştiğinde toplama değil, en yüksek ödeneğin seçileceğini öngörür.","ayirt":"Kural toplama mı diyor, seçme mi diyor?","paragraf":"m.18/3 son cümle","yanilgi":"İki ayrı halin ödeneğinin toplanacağını sanıyorsun."},"A":{"gercek":"5510 s. Kanun m.18/3 ayaktan tedavide günlük kazancın üçte ikisini öngörür.","ayirt":"Ayaktan tedavide pay/payda hangi yönde, kazancı mı çarpıyorum yoksa bölüyor muyum?","paragraf":"m.18/3","yanilgi":"Ayaktan tedavi oranını üçte bir sanıyorsun."},"D":{"gercek":"Ödenek her koşulda kazancın bir kesridir (yarısı ya da üçte ikisi), tamamı değildir.","ayirt":"Ödenek oranı 1 mi yoksa 1/2 veya 2/3 mü?","paragraf":"m.18/3","yanilgi":"Ödeneğin günlük kazancın tamamı olduğunu sanıyorsun."},"B":{"gercek":"m.18/3 son cümle: haller birleşirse en yüksek ödenek verilir, tekil hal esas alınmaz.","ayirt":"Olayda birden fazla iş göremezlik hali var mı, varsa hangisi daha yüksek?","paragraf":"m.18/3 son cümle","yanilgi":"Yalnız ilk halin ödeneğini yeterli sanıyorsun, ikinci halin varlığını gözden kaçırıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 109"},"kural":"4447 sayılı Kanunun ek 6 ncı maddesine göre Esnaf Ahilik Sandığı ödeneği, nafaka borçları dışında haciz veya başkasına devir ve temlik edilemez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Roma rakamı ya da doğru/yanlış tipi haciz sorularında önce \u0027kimin lehine sınır\u0027 ve \u0027hangi tarihe göre\u0027 sorularını kendine sor; istisna kelimesini (nafaka) ve zaman yönünü (öncesi/sonrası) atlamak en sık düşülen tuzaktır.","konu":"haciz sınırı","tablo":{"satirlar":[["A) İşsizlik ödeneği hiçbir şekilde haciz veya başkasına dev…","m.50/2","YANLIŞ ifade"],["B) Esnaf Ahilik Sandığı ödeneği, nafaka borçları dışında ha…","ek m.6/5","doğru ifade"],["C) Genel ve katma bütçeli idarelerin müteahhide verdiği yap…","m.36/1","YANLIŞ ifade"],["D) Bir işverenin üçüncü kişiye olan borcu nedeniyle işyerin…","m.36/2","YANLIŞ ifade"],["E) Müteahhidin idarelerdeki her türlü teminat ve hakedişler…","m.36/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Genel ve katma bütçeli idarelerin müteahhide verdiği yapım işlerinde, işçilerin her hakediş dönemi için olan ücret alacaklarının tamamından, miktarına bakılmaksızın idarelere sorumluluk düşer.","E":"Müteahhidin idarelerdeki her türlü teminat ve hakedişleri üzerinde yapılacak haciz ve icra takibi, işçilerin ücret alacaklarını karşılayacak kısım ayrılmaksızın derhal hüküm ifade eder.","A":"İşsizlik ödeneği hiçbir şekilde haciz veya başkasına devir ve temlik edilemez; nafaka borçları için dahi haciz yapılamaz.","D":"Bir işverenin üçüncü kişiye olan borcu nedeniyle işyerindeki tesisat ve mallar üzerinde yapılacak haciz, hakedişin ödendiği tarihten sonraki üç aylık ücret alacaklarını karşılayacak kısım ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder.","B":"Esnaf Ahilik Sandığı ödeneği, nafaka borçları dışında haciz veya başkasına devir ve temlik edilemez."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.36 [1/2]","metin":"Madde 36 - Genel ve katma bütçeli dairelerle mahalli idareler veya kamu iktisadi teşebbüsleri yahut özel kanuna veya Cumhurbaşkanlığı kararnamesine dayanılarak kurulan banka ve kuruluşlar; asıl işverenler müteahhide verdikleri her türlü bina, köprü, hat ve yol inşası gibi yapım ve onarım işlerinde çalışan işçilerden müteahhit veya taşeronlarca ücretleri ödenmeyenlerin bulunup bulunmadığının kontrolü, ya da ücreti ödenmeyen işçinin başvurusu üzerine, ücretleri ödenmeyen varsa müteahhitten veya taşeronlardan istenecek bordrolara göre bu ücretleri bunların hakedişlerinden öderler.14 Bunun için hakediş ödeneceği ilgili idare tarafından işyerinde şantiye şefliği işyeri ilân tahtası veya işçilerin toplu bulunduğu yerler gibi işçilerin görebileceği yerlere yazılı ilân asılmak suretiyle duyurulur. Ücret alacağı olan işçilerin her hakediş dönemi için olan ücret alacaklarının üç aylık tutarından fazlası hakkında adı geçen idarelere herhangi bir sorumluluk düşmez. Anılan müteahhitlerin bu işverenlerdeki her çeşit teminat ve hakedişleri üzerinde yapılacak her türlü devir ve el değiştirme işlemleri veya haciz ve icra takibi bu işte çalışan işçilerin ücret alacaklarını karşılayacak kısım ayrıldıktan sonra, kalan kısım üzerinde hüküm ifade eder. Bir işverenin üçüncü kişiye karşı olan borçlarından dolayı işyerinde bulunan tesisat, malzeme, ham, yarı işlenmiş ve tam işlenmiş mallar ve başka kıymetler üzerinde yapılacak haciz ve icra takibi, bu işyerinde çalışan işçilerin icra kararının alındığı tarihten önceki üç aylık dönem içindeki ücret alacaklarını karşılayacak kısım ayrıldıktan sonra, …"},{"ad":"İş K. (4857 s.K.) m.36 [2/2]","metin":"(Değişik beşinci fıkra: 10/9/2014-6552/3 md.) İşverenler, alt işverene iş vermeleri 2/7/2018 tarihli ve 700 sayılı KHK’nin 145 inci maddesiyle, bu fıkrada yer alan “özel kanunla verilmiş yetkiye” ibaresi “Cumhurbaşkanlığı kararnamesine” şeklinde değiştirilmiştir. 14 hâlinde, bunların işçilerinin ücretlerinin ödenip ödenmediğini işçinin başvurusu üzerine veya aylık olarak resen kontrol etmekle ve varsa ödenmeyen ücretleri hak edişlerinden keserek işçilerin banka hesabına yatırmakla yükümlüdür. Ücret hesap pusulası"}],"hakem":"Soru, 4447 sayılı İşsizlik Sigortası Kanunu\u0027nun ek 6. maddesinde yer alan Esnaf Ahilik Sandığı ödeneğinin haciz sınırına ilişkin hükmünü sormakta; B şıkkı bu hükmü kaynak metinde birebir olduğu şekilde doğru olarak aktarmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"İdarenin işçi ücretleri için sınırsız sorumluluğu olduğunu düşünüyorsun ama sorumluluk sadece üç aylık ücret tutarıyla sınırlanmıştır. Daha fazlası için idareye borç düşmez.","E":"Müteahhidin hakedişine haciz konurken işçi ücretleri ayırmadan derhal uygulanır sanıyorsun ama kanun işçi alacakları ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder diyor.","D":"Üç aylık dönemin başlangıcını hakedişin ödeme tarihinden sonrasına koyuyorsun ama kanun icra kararının alındığı tarihten önceki üç ay demiştir. Tarih yönünü ters çevirmişsin.","A":"İşsizlik ödeneğini hiç haczedilmez sanıyorsun ama kanun nafaka borçları için haczedilebileceğini açıkça söylüyor. Mutlak koruma yok, nafaka istisnası var."},"dogru":"Esnaf Ahilik Sandığı ödeneği, nafaka borçları için haczedilebilir ama başka hiçbir nedenle haciz veya başkasına devredilmez. Bu kural kanunda açık şekilde yazılıdır.","sinav":"İşsizlik Sigortası Kanunu 50. madde ve İşsizlik Sigortası Kanunu ek 6. madde.","kavramlar":[{"kaynak":"İş Kanunu 36. madde","tanim":"Müteahhidin yapım işinde tamamladığı kısım için işverenden talep ettiği ödeme tutarıdır.","ad":"hakediş"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"4447 sayılı İşsizlik Sigortası Kanunu ve 4857 sayılı İş Kanunu\u0027nun haciz sınırına ilişkin hükümleri uyarınca aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-zor/kp-26","verilenler":[],"dayanak":"4447 s. İşsizlik Sigortası K. ek m.6/5, m.50/2; 4857 s. İş Kanunu m.36/1-2","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Kayseri\u0027de esnaf Mehmet Usta, dükkânını 15 Mart\u0027ta kapatıyor; işsiz kalıyor, faaliyeti sona eriyor.","anlatim":"Mehmet Usta prim borcu olmadığı için Esnaf Ahilik Sandığı ödeneğine hak kazanıyor. Aynı ay üç ayrı alacaklısı çıkıyor: bir tanesi eski kredi borcundan icra takibi başlatıyor, bir tanesi nafaka alacaklısı eski eşi. Bu beş şıktaki hükümlerin hangisinin bu tür ödemeler için doğru olduğunu göreceğiz.","doldur":[]},{"formul":"Ne yapacağız: Mehmet Usta\u0027nın alacağı Esnaf Ahilik Sandığı ödeneği, işsizlik ödeneği, ve ayrıca bir inşaat işçisinin hakediş alacağı üzerinden beş ifadeyi tek tek deneyeceğiz.","anlatim":"Kural şu: bu tür sosyal ödemeler kural olarak haczedilemez, ama nafaka borcu istisnadır. İnşaat işlerinde hakediş ve teminat haczi de ayrı bir sınıra tabidir. Şimdi A\u0027dan E\u0027ye bakalım.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.50/2","karar":"yanlış","anlatim":"Kanun işsizlik ödeneğini haciz ve devirden korur ama nafaka borcunu açıkça istisna tutar. Yani nafaka için haciz yapılabilir, bu ifade yanlış çünkü \u0027hiçbir şekilde\u0027 diyor.","formul":"Şık A: eski eşi nafaka alacağı için işsizlik ödeneğine haciz koydurmak istiyor, buna hiç izin yok mu dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"ek m.6/5","karar":"doğru","anlatim":"Kanun bu ödeneği de aynı mantıkla korur, nafaka dışında haciz ve temlik yasak. Mehmet Usta\u0027nın kredi borcu için haciz gelmez ama nafaka için gelir, bu ifade doğru.","formul":"Şık B: Mehmet Usta\u0027nın Esnaf Ahilik Sandığı ödeneğine kredi borcundan haciz gelir mi, nafaka borcundan gelir mi dersin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.36/1","karar":"yanlış","anlatim":"Kanun idarenin sorumluluğunu üç aylık ücret tutarıyla sınırlar, tamamı değil. Yani miktara bakılmaksızın tamamından sorumluluk yanlış bir ifade.","formul":"Şık C: idare, inşaat işçisinin hakediş dönemindeki ücretinin tamamından miktar sınırı olmaksızın sorumlu mu dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.36/2","karar":"yanlış","anlatim":"Kanun üç aylık dönemi icra kararının alındığı tarihten ÖNCEKİ döneme göre belirler, sonraki değil. Bu ifade yönü ters çevirdiği için yanlış.","formul":"Şık D: işçilerin üç aylık ücret alacağı, hakedişin ödendiği tarihten SONRAKİ döneme göre mi hesaplanır dersin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.36/1","karar":"yanlış","anlatim":"Kanun önce işçi ücret alacağını karşılayacak kısmın ayrılmasını, haczin ancak kalan kısım üzerinde hüküm ifade etmesini ister. Derhal ve ayrım yapılmadan uygulama yanlış bir ifade.","formul":"Şık E: müteahhidin hakedişi üzerindeki haciz, işçi alacağı ayrılmadan derhal uygulanır mı dersin?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru B, çünkü Esnaf Ahilik Sandığı ödeneği de işsizlik ödeneği gibi sadece nafaka borcuna açık, başka hiçbir alacağa kapalı. Kendine hep şunu sor: metinde \u0027dışında\u0027 mı yazıyor yoksa mutlak bir yasak mı, o kelime seni doğruya götürür.","doldur":[]}],"anahtar":[{"ornek":"nafaka","kok":"nafaka"},{"ornek":"ödeneği","kok":"ödeneğ"},{"ornek":"yanlış","kok":"yanlış"},{"ornek":"ahilik","kok":"ahilik"},{"ornek":"dışında","kok":"dışınd"},{"ornek":"sandığı","kok":"sandığ"}],"konuGiris":{"harita":"Ne zaman test edilir: işçi ücretine veya işsizlik ödeneğine haciz konulmak istendiğinde. Nasıl ölçülür: hangi gelir türü olduğuna ve hangi istisnanın (nafaka gibi) uygulandığına bakılarak. Nasıl kaydedilir: icra dosyasında haczedilebilir/haczedilemez kısım ayrı gösterilir.","desen":"Soru genelde işsizlik ödeneğinin haczedilemezliğini nafaka istisnasıyla karıştırtarak sorar. Diğer tuzak, hakediş/mal haczinde üç aylık ücret alacağının önceliğinin unutulmasıdır. Bu soru m.36 ve 4447 s.K. m.50 hükümlerinin karşılaştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İşsizlik ödeneği nafaka borcu dışında haczedilemez ve devredilemez.","ad":"işsizlik ödeneği haczi yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İşyerindeki malların haczinde önceki üç aylık işçi ücreti önce ayrılır.","ad":"üç aylık ücret alacağı önceliği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Nafaka borçları haciz yasağının tek istisnasıdır, her koşulda uygulanır.","ad":"nafaka istisnası","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Müteahhit hakedişindeki haciz, işçi ücret alacağı ayrıldıktan sonraki kısma uygulanır.","ad":"hakediş üzerindeki haciz sınırı","kim":"kanun sabitler"}],"sinavda":"Soruda haciz konusu gelir türü ve istisna durumu verilir, doğru hükmün hangisi olduğu sorulur.","panel_ornek":"Bir arkadaşının markette kasiyer olarak çalıştığını düşün, ona 15 bin lira maaş veriliyor ve bir alacaklısı bu maaşa haciz koymak istiyor. Kanun, maaşının tamamının değil, sadece belirli bir kısmının haczedilebileceğini söylüyor; yani onun elinde hep bir miktar para kalıyor. İşsizlik maaşı alsaydı ise durum daha da katıydı: o parayı neredeyse hiç haczedemezlerdi, sadece nafaka borcu istisnaydı.","ornek":"Bir arkadaşının markette kasiyer olarak çalıştığını düşün, ona 15 bin lira maaş veriliyor ve bir alacaklısı bu maaşa haciz koymak istiyor. Kanun, maaşının tamamının değil, sadece belirli bir kısmının haczedilebileceğini söylüyor; yani onun elinde hep bir miktar para kalıyor. İşsizlik maaşı alsaydı ise durum daha da katıydı: o parayı neredeyse hiç haczedemezlerdi, sadece nafaka borcu istisnaydı.","yontemler":"Gelirin türünü (ücret mi, işsizlik ödeneği mi) belirleyip ilgili istisnayı kanun metninden eşleştirmek yeterlidir.","nedir":"Haciz sınırı, işçi ücreti ve işsizlik ödeneği gibi gelirlerin borç yüzünden ne kadarının kesilebileceğini belirleyen kuraldır. Sınav bu istisnaların hangi hallerde geçerli olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Sınırsız Sorumluluk Tuzağı","metin":"İdarenin sorumluluğunu miktar sınırlaması olmaksızın tam kabul ediyorsun. Doğrusu, işçi ücret alacaklarının her hakediş dönemi için üç aylık tutarından fazlası hakkında idarelere herhangi bir sorumluluk düşmez; sorumluluk üç aylık tutarla sınırlıdır."},"E":{"ad":"Ayırma Şartını Atlama Tuzağı","metin":"Haczin hiçbir kesinti yapılmaksızın derhal uygulanacağını düşünüyorsun. Doğrusu, müteahhidin teminat ve hakedişleri üzerindeki haciz ve icra takibi, işçi ücret alacaklarını karşılayacak kısım ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder."},"D":{"ad":"Tarih ve Yön Karıştırma Tuzağı","metin":"Üç aylık dönemin başlangıcını hakedişin ödeme tarihinden sonrasına kaydırıyorsun. Doğrusu, üçüncü kişiye borç nedeniyle yapılan hacizde esas alınacak dönem icra kararının alındığı tarihten öncesidir."},"A":{"ad":"Nafaka İstisnasını Kaldırma Tuzağı","metin":"Kanun işsizlik ödeneğini haciz ve temlikten korur ama bu koruma mutlak değildir. Doğrusu, işsizlik ödeneği nafaka borçları dışında haczedilemez; nafaka borçları için haciz mümkündür."}},"celdiriciYol":{"C":"\u0027Üç aylık tutarından fazlası hakkında sorumluluk düşmez\u0027 cümlesini ters okuyup idareyi tüm tutardan sorumlu tutmak (sınırlama cümlesini tersine çevirme)","E":"\u0027Kısım ayrıldıktan sonra kalan kısım üzerinde hüküm ifade eder\u0027 şartını atlayıp haczin doğrudan ve kesintisiz uygulandığını varsaymak (ayırma koşulunu atlama)","D":"Üç aylık dönemin başlangıç noktasını icra kararı yerine hakediş ödeme tarihine bağlamak (zamanlama yönünü ters kurma)","A":"İşsizlik ödeneğinin haciz yasağını istisnasız okumak; \u0027nafaka borçları dışında\u0027 ibaresini atlayarak mutlak koruma sonucuna varmak (istisnayı görmezden gelme)"},"hap":"Haciz sınırı, işsizlik/Esnaf Ahilik ödeneklerinde nafaka istisnasıyla, İş Kanunu m.36\u0027da ise üç aylık ücret alacağının ayrılması koşuluyla korunur.","teshis":{"C":{"gercek":"İş Kanunu m.36/1 üç aylık tutardan fazlası için idareye sorumluluk düşmeyeceğini, yani sorumluluğun üç aylıkla sınırlı olduğunu belirtir.","ayirt":"Metinde \u0027fazlası hakkında sorumluluk düşmez\u0027 mi y
