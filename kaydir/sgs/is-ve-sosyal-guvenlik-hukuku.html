başka bir hüküme (toplu işçi çıkarma) aittir ve bu iki kavram karıştırılmıştır.","E":"Cinsiyet veya gebelik nedeniyle farklı işlem yasağı yalnız sözleşmenin yapılmasında değil; sözleşmenin uygulanması ve sona ermesinde de geçerlidir.","D":"Kanun aksini söyler: işveren esaslı sebep olmadıkça kısmî süreli işçiye tam süreli işçiden farklı işlem yapamaz; burada kural tersine çevrilmiştir.","B":"Maddenin başındaki genel kural (ispat işçiye aittir) tüm durumlar için mutlak değildir; işçi güçlü ihtimal gösterirse ispat yükü işverene kaymaktadır."},"dogru":"İşçi sendikaya üyelik nedeniyle ayrımcılığa uğradığını iddia edince, önce güçlü ihtimal gösteren bir durum ortaya koymak gerekir; bunu başarırsa işveren ihlalin olmadığını ispatlamak zorunda kalır.","sinav":"İş Kanunu 4857 sayılı Kanun 5. madde","kavramlar":[{"kaynak":"İş Kanunu 5. madde","tanim":"İşçi ayrımcılık iddiasında ihlalin varlığını güçlü bir biçimde gösteren bir durumu ortaya koyarsa, ispat yükü işverene geçer.","ad":"güçlü ihtimal karinesı"},{"kaynak":"İş Kanunu 5. madde","tanim":"Ayrımcılığa uğrayan işçi, yoksun bırakıldığı haklardan başka dört aya kadar ücreti tutarında tazminat talep edebilir.","ad":"ayrımcılık tazminatı"},{"kaynak":"İş Kanunu 5. madde","tanim":"İşveren kısmî süreli veya belirli süreli işçilere, tam süreli veya belirsiz süreli işçilerden farklı işlem yapabilmesi için bulunması gerekli olan hukuki sebeptir.","ad":"esaslı sebep"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2020/2"]},"oyun":null,"tip":"teori","soru":"Sendika üyesi bir işçi, sendikaya üye olduğu gerekçesiyle işveren tarafından ücretinde ayrımcılığa uğradığını ileri sürerek dava açmıştır. 4857 sayılı İş Kanunu\u0027na göre ispat yükü ve ayrımcılık tazminatına ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-09","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.5, son fıkra","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir tekstil fabrikasında çalışan Mehmet, sendikaya üye olduktan 2 ay sonra ücretine zam yapılmadığını, aynı kıdemdeki sendikasız arkadaşı Ahmet\u0027in ücretine %15 zam geldiğini fark eder.","anlatim":"Mehmet elindeki bordroları mahkemeye sunar. Ahmet\u0027in ücreti 18.000 TL\u0027ye çıkarken Mehmet\u0027inki 15.000 TL\u0027de kalmıştır.","doldur":[]},{"formul":"Ne yapacağız: Mehmet\u0027in ispat yükü nereye geçer, tazminatı kaç aylık olur, farklı işlem hangi hâllerde caiz, bunu beş ifadede tek tek deneyeceğiz.","anlatim":"4857 sayılı İş Kanunu m.5 bu olayın tam merkezinde durur. Şimdi A\u0027dan E\u0027ye kadar her cümleyi bu bordrolarla test edelim.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"4857 sayılı İş Kanunu m.5, son fıkra","karar":"doğru","anlatim":"Mehmet aynı kıdemdeki Ahmet\u0027le kendisi arasındaki zam farkını somut belgeyle gösterir. İş Kanunu m.5 son fıkra bu durumda ispat yükünü işverene devreder, işveren ayrımcılık olmadığını kanıtlamalıdır.","formul":"Şık A: Mehmet, bordro farkını mahkemeye gösterdi, bu ihlal ihtimalini güçlü biçimde ortaya koyar mı ve ispat yükü işverene geçer mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"4857 sayılı İş Kanunu m.5, son fıkra","karar":"yanlış","anlatim":"Mehmet somut bir karine sunduğu için kural burada değişir, genel ispat yükü kalkar. Madde metni istisnayı açıkça tanır, avukatın iddiası yanlıştır.","formul":"Şık B: İşveren avukatı \u0027ispat yükü her koşulda işçidedir, Mehmet\u0027in bordro farkı hiçbir şey değiştirmez\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"4857 sayılı İş Kanunu m.5 ve m.7","karar":"yanlış","anlatim":"Ayrımcılık tazminatı dört aya kadar ücret tutarıdır, sekiz aylık süre başka bir maddede toplu işçi çıkarma sonrası geçici iş ilişkisi yasağıyla ilgilidir. Avukat iki farklı hükmü karıştırmıştır.","formul":"Şık C: Mehmet\u0027in avukatı \u0027ayrımcılık tazminatı sekiz aylık ücret tutarında istenir\u0027 diyor, doğru mu söylüyor?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"4857 sayılı İş Kanunu m.5, fıkra 2","karar":"yanlış","anlatim":"Madde 5 ikinci fıkra, esaslı sebep olmadıkça kısmi süreli işçiye farklı işlem yapmayı yasaklar. İşverenin bu sözü kanuna aykırıdır.","formul":"Şık D: İşveren \u0027Mehmet kısmi süreli çalışsaydı esaslı sebep aramadan farklı ücret verirdim\u0027 diyor, bu kanuna uygun mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"4857 sayılı İş Kanunu m.5, fıkra 3","karar":"yanlış","anlatim":"Madde 5 üçüncü fıkra yasağı sözleşmenin kurulmasından sona ermesine kadar tüm aşamalara yayar. İşverenin bu savunması yanlıştır.","formul":"Şık E: İşveren \u0027ayrımcılık yasağı sadece işe alırken geçerlidir, fesihte uygulanmaz\u0027 diyor, buna güvenebilir mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Mehmet\u0027in somut bordro farkı, ispat yükünü işverene çeviren tek güçlü karinedir. Kendine hep şunu sor: işçi yalnızca iddia mı etti, yoksa elle tutulur bir karine mi sundu?","doldur":[]}],"anahtar":[{"ornek":"işverene","kok":"işvere"},{"ornek":"mehmet","kok":"mehmet"},{"ornek":"kanunu","kok":"kanunu"},{"ornek":"bordroları","kok":"bordro"},{"ornek":"gösteren","kok":"göster"},{"ornek":"karine","kok":"karine"}],"konuGiris":{"harita":"Ne zaman test edilir: işçi sendika üyeliği yüzünden ücrette veya işlemde ayrımcılığa uğradığını iddia ettiğinde. Nasıl ölçülür: önce işçi ihlal ihtimalini güçlü gösteren olguyu ortaya koyar, sonra ispat yükü işverene geçer. Nasıl kaydedilir: tazminat, işçinin dört aya kadar ücreti tutarıyla sınırlı olarak hesaplanır.","desen":"Sınav genelde ispat yükünün baştan işçide olduğunu ama güçlü emare gösterildiğinde işverene geçtiğini karıştırtır. Tazminat sınırının dört aylık ücret olduğu, altı ay ya da sınırsız gibi yanlış seçeneklerle çeldirilir. Bu soru m.5 son fıkra hükmü noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İş ilişkisinde sendika üyeliği gibi sebeplerle farklı işlem yapılamaması kuralı","ad":"ayrımcılık yasağı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"İşçinin ihlal ihtimalini gösteren, ispat yükünü ters çeviren olgu","ad":"güçlü emare","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"İddianın doğruluğunu kanıtlama zorunluluğunun hangi tarafa ait olduğu","ad":"ispat yükü","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"İhlal halinde işçiye ödenen, dört aylık ücreti aşamayan uygun tazminat","ad":"ayrımcılık tazminatı","kim":"kanun sabitler"}],"sinavda":"Sendika üyeliği nedeniyle ayrımcılık iddiasında ispat yükünün dağılımı ve tazminat üst sınırı sorulur.","panel_ornek":"Bir markette çalışan arkadaşın, izin günü değiştiği için müdürüyle tartışıyor ve haksızlığa uğradığını düşünüyor; ama bunu kanıtlamak ona mı düşer yoksa müdür mü açıklama yapmalı, işte tam bu tartışılıyor. Diyelim ki aylık maaşı 6.000 lira olsun, kanun azami tazminatı bu maaşın 4 katıyla sınırlıyor.","ornek":"Bir markette çalışan arkadaşın, izin günü değiştiği için müdürüyle tartışıyor ve haksızlığa uğradığını düşünüyor; ama bunu kanıtlamak ona mı düşer yoksa müdür mü açıklama yapmalı, işte tam bu tartışılıyor. Diyelim ki aylık maaşı 6.000 lira olsun, kanun azami tazminatı bu maaşın 4 katıyla sınırlıyor.","yontemler":"İşçi önce emareyi gösterir, ardından işveren ihlalin yokluğunu ispatlar; tazminat dört aylık ücreti geçemez.","nedir":"Sendikal güvence, işçinin sendika üyeliği ya da faaliyeti yüzünden ayrımcılığa uğramasını önleyen yasal korumadır. Sınav, ispat yükünün kime ait olduğunu ve tazminat sınırını ölçer."},"olay":"","tuzak":{"C":{"ad":"Tutar Karıştırma Tuzağı","metin":"öğrenci madde 7\u0027deki sekiz aylık süreyi ayrımcılık tazminatının tavanıyla karıştırır. Doğrusu: ayrımcılık tazminatı dört aya kadar ücret tutarındadır, sekiz ay farklı bir hükme (toplu işçi çıkarma) aittir."},"E":{"ad":"Kapsam Daraltma Tuzağı","metin":"öğrenci yasağı yalnız sözleşmenin kurulması aşamasıyla sınırlar. Doğrusu: yasak sözleşmenin yapılmasında, şartlarının oluşturulmasında, uygulanmasında ve sona ermesinde geçerlidir."},"D":{"ad":"Ters Kural Tuzağı","metin":"öğrenci madde metnindeki yasağı tersine çevirip işverene serbesti tanır. Doğrusu: işveren esaslı sebep olmadıkça kısmi süreli işçiye tam süreliye göre farklı işlem yapamaz."},"B":{"ad":"Genel Kural Tuzağı","metin":"öğrenci maddenin ilk cümlesindeki genel kuralı (ispat işçiye aittir) mutlak sanıp istisnayı yani güçlü ihtimal karinesini görmezden gelir. Doğrusu: işçi güçlü ihtimal gösterirse ispat yükü işverene geçer, kural mutlak değildir."}},"celdiriciYol":{},"hap":"İşçi güçlü ihtimal gösteren bir durum ortaya koyarsa ayrımcılık iddiasında ispat yükü işverene geçer.","teshis":{"D":{"gercek":"Madde 5 ikinci fıkra, esaslı sebep olmadıkça kısmi süreli işçiye farklı işlem yapılmasını yasaklar.","ayirt":"Metinde \u0027esaslı sebepler olmadıkça\u0027 ibaresi kimi koruyor, işvereni mi işçiyi mi?","paragraf":"4857 sayılı İş K. m.5, fıkra 2","yanilgi":"Kısmi süreli çalışanların tam süreli çalışanlara göre daha az korunduğunu, işverenin serbestçe ayrım yapabileceğini sanırsın."},"E":{"gercek":"Madde 5 üçüncü fıkra yasağı sözleşmenin yapılması, şartların oluşturulması, uygulanması ve sona ermesinin tamamına yayar.","ayirt":"Madde metni yasağı tek bir aşamayla mı sınırlıyor yoksa sözleşmenin tüm evrelerini mi kapsıyor?","paragraf":"4857 sayılı İş K. m.5, fıkra 3","yanilgi":"Ayrımcılık yasağının yalnızca işe alım aşamasında geçerli olduğunu, fesih aşamasında uygulanmayacağını sanırsın."},"A":{"gercek":"İş Kanunu m.5 son fıkra, işçi güçlü ihtimal gösteren bir durum ortaya koyduğunda ispat yükünü işverene devreder.","ayirt":"İşçi somut bir karine mi sundu, yoksa yalnızca iddiada mı bulundu?","paragraf":"4857 sayılı İş K. m.5, son fıkra","yanilgi":"Bu şıkkı elerken güçlü ihtimal karinesinin ayrı bir istisna olduğunu değil, genel ispat kuralının her olayda geçerli olduğunu düşünürsün."},"C":{"gercek":"Ayrımcılık tazminatı m.5 son fıkraya göre dört aya kadar ücret tutarındadır; sekiz ay ise toplu işçi çıkarma sonrası geçici iş ilişkisi yasağına ilişkindir.","ayirt":"Bu sayı hangi maddenin hangi konusunda geçiyor, tazminatla mı yoksa başka bir yasakla mı ilgili?","paragraf":"4857 sayılı İş K. m.5 ve m.7","yanilgi":"Kanunda geçen farklı bağlamdaki sekiz aylık süreyi tazminat tavanıyla aynı hüküm sanırsın."},"B":{"gercek":"Madde metni açıkça güçlü ihtimal karinesi hâlinde ispat yükünün işverene geçeceğini düzenler.","ayirt":"Kuralın \u0027ancak\u0027 bağlacından sonraki istisna cümlesini okudun mu?","paragraf":"4857 sayılı İş K. m.5, son fıkra","yanilgi":"İspat yükünün hiçbir koşulda değişmeyeceğini, istisnanın yalnızca teoride kaldığını sanırsın."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 108"},"kural":"5510 sayılı Kanun m.37 uyarınca evlenme ödeneği verilmesi halinde diğer hak sahiplerinin aylık veya gelirleri, ödenek verilen sürenin bitimini takip eden ödeme döneminden itibaren yeniden belirlenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 108","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklarda geçen \u0027ödendiği tarihten itibaren\u0027 ile \u0027sürenin bitimini takip eden dönemden itibaren\u0027 ifadelerini mutlaka ayır, kanun ikincisini kullanır.","konu":"uzun vadeli sigorta kolları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Evlenme ödeneği tutarı","iki yıllık aylık tutarı","-"],["HESAP","-","-"],["A) Diğer hak sahiplerinin aylık veya gelirleri, evlenme öde…","5510 s.K. m.37","doğru ifade"],["B) Diğer hak sahiplerinin aylık veya gelirleri, evlenme öde…","5510 s.K. m.37","YANLIŞ ifade"],["C) Kız çocuğunun iki yıl içinde yeniden hak sahibi olması h…","5510 s.K. m.37","YANLIŞ ifade"],["D) Kız çocuğunun iki yıl içinde yeniden hak sahibi olması h…","5510 s.K. m.37","YANLIŞ ifade"],["E) Evlenme ödeneği, kız çocuğunun ayrıca talepte bulunmasın…","5510 s.K. m.37","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kız çocuğunun iki yıl içinde yeniden hak sahibi olması halinde, iki yıllık sürenin sonuna kadar kendisine aylık bağlanmaya devam olunur.","E":"Evlenme ödeneği, kız çocuğunun ayrıca talepte bulunmasına gerek olmaksızın Kurum tarafından resen ödenir.","A":"Diğer hak sahiplerinin aylık veya gelirleri, evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren yeniden belirlenir.","D":"Kız çocuğunun iki yıl içinde yeniden hak sahibi olması halinde, bu süre boyunca genel sağlık sigortalısı sayılmaz.","B":"Diğer hak sahiplerinin aylık veya gelirleri, evlenme ödeneğinin ödendiği tarihten itibaren hemen yeniden belirlenir."},"kaynak":{"alinti":"Evlenme ödeneği verilmesi halinde, diğer hak sahiplerinin aylık veya gelirleri evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren 34 üncü maddeye göre yeniden belirlenir","liste":[{"ad":"5510 s. SGK Kanunu m.37 [1/2]","metin":"MADDE 37- (Değişik: 17/4/2008-5754/23 md.) Evlenmeleri nedeniyle, gelir veya aylıklarının kesilmesi gereken kız çocuklarına evlenmeleri ve talepte bulunmaları halinde almakta oldukları aylık veya gelirlerinin iki yıllık 17/4/2017 tarihli ve 690 sayılı KHK’nin 36 ncı maddesiyle, bu fıkrada yer alan “üçüncü fıkrasının (d) ve (e)” ibaresi “dördüncü fıkrasının (d), (e) ve (f)” şeklinde değiştirilmiş, daha sonra bu hüküm 1/2/2018 tarihli ve 7077 sayılı Kanunun 32 nci maddesiyle aynen kabul edilerek kanunlaşmıştır. 54 tutarı bir defaya mahsus olmak üzere evlenme ödeneği olarak peşin ödenir. Evlenme ödeneği alan hak sahibinin aylığının kesildiği tarihten itibaren iki yıl içerisinde yeniden hak sahibi olması halinde, iki yıllık sürenin sonuna kadar gelir veya aylık bağlanmaz, bu durumda olanlar 60 ıncı maddenin birinci fıkrasının (f) bendi kapsamında genel sağlık sigortalısı sayılır. Evlenme ödeneği verilmesi halinde, diğer hak sahiplerinin aylık veya gelirleri evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren 34 üncü maddeye göre yeniden belirlenir. İş kazası veya meslek hastalığı sonucu veya sürekli iş göremezlik geliri, malûllük, vazife malûllüğü veya yaşlılık aylığı almakta iken veya kendisi için en az 360 gün malûllük, yaşlılık ve ölüm sigortası primi bildirilmiş olup da ölen sigortalının hak sahiplerine Kurum Yönetim Kurulunca belirlenip Bakan tarafından onaylanan tarife üzerinden cenaze ödeneği ödenir. Cenaze ödeneği, sırasıyla sigortalının eşine, yoksa çocuklarına, o da yoksa ana babasına, o da yoksa kardeşlerine verilir."},{"ad":"5510 s. SGK Kanunu m.37 [2/2]","metin":"Cenaze ödeneğinin üçüncü fıkrada sayılanlara ödenememesi ve sigortalının cenazesinin gerçek veya tüzel kişiler tarafından kaldırılması durumunda, üçüncü fıkrada belirtilen tutarı geçmemek üzere belgelere dayanan masraflar, masrafı yapan gerçek veya tüzel kişilere ödenir. 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalı sayılanlardan ölenlerin hak sahiplerine kendi kurumları tarafından ilgili mevzuat gereği ölüm yardımı hariç cenaze gideri, cenaze nakil gideri ödeneği veya bu mahiyette bir ödemenin yapılması halinde, Kurum tarafından cenaze ödeneği ödenmez. Uzun vadeli sigorta kolları bakımından sigortalılık süresi"}],"hakem":"Doğru sık, 5510 sayılı Kanun m.37\u0027de açıkça yer alan \"Evlenme ödeneği verilmesi halinde, diğer hak sahiplerinin aylık veya gelirleri evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren 34 üncü maddeye göre yeniden belirlenir\" hükmü tarafından tam olarak desteklenmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Evlenme ödeneği alan kız, iki yıl boyunca hem ödeneği hem de aylığını almaya devam edecek diye düşünür. Hâlbuki kanun: iki yıllık sürenin sonuna kadar ona aylık bağlanmaz, yalnızca sağlık sigortası koruması devam eder.","E":"Ödeneğin otomatik olarak, talep olmaksızın ödeneceğini düşünür. Doğrusu: kız çocuğu talepte bulunmak zorundadır; aksi takdirde Kurum ödeme yapmaz.","D":"Sağlık sigortasının evlenme ödeneği döneminde kesildiğini zannetir. Gerçek: bu kişiler genel sağlık sigortalısı sayılmaya devam eder, koruma kesintisiz.","B":"Diğer hak sahiplerinin aylıkları ödeneğin ödendiği tarihte değişeceğini varsayar. Oysa kuralda açık: yeniden belirleme, iki yıllık sürenin sonunda gerçekleşir, peşin ödeme anından değil."},"dogru":"Evlenme ödeneği verildiğinde, ailede başka hak sahipleri varsa (ör. diğer çocuklar) onların aylıkları hemen değişmez. Değişim, evlenme ödeneğinin verildiği iki yıllık süre bittiğinde gerçekleşir. O zaman diğer hak sahiplerinin payları yeniden hesaplanır.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 37. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 37. madde","tanim":"Sigortalının evlenen kız çocuğuna, o çocuğun kesilecek aylığının iki yıllık tutarı, çocuğun talebi halinde peşin olarak ödenen sosyal sigorta yardımı.","ad":"Evlenme ödeneği"},{"kaynak":"5510 s. SGK Kanunu 37. madde","tanim":"Sigortalı veya emekli kişinin ölümü veya diğer sigorta olayları nedeniyle kanunla belirlenen koşullar altında sosyal sigorta haklarından yararlanma hakkı olan kişi (eş, çocuk, ana baba vb.).","ad":"Hak sahibi"},{"kaynak":"5510 s. SGK Kanunu 37. madde","tanim":"Aylık veya gelirin hesaplanıp ödendiği zaman aralığı; evlenme ödeneği verildikten sonra diğer hak sahiplerinin aylıkları yeniden belirlenirken bu dönem başlangıç noktası olur.","ad":"Ödeme dönemi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[{"yil":"2025/3","alinti":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu’na göre yukarıdakilerden hangileri uzun vadeli sigorta kolları içerisinde yer alır?"},{"yil":"2024/1","alinti":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu’na göre, uzun vadeli sigorta kollarının tamamı hangi seçenekte doğru gösterilmiştir?"}],"donemler":["2025/3","2024/1"]},"oyun":null,"tip":"teori","soru":"Sigortalının kız çocuğuna, evlenmesi nedeniyle kesilen aylığının iki yıllık tutarı, kendisinin talebi üzerine evlenme ödeneği olarak peşin ödenmiştir. Bu duruma ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-10","verilenler":[{"deger":"iki yıllık aylık tutarı","anlam":"Kız çocuğuna peşin ödenecek evlenme ödeneğinin hesap esası, kesilen aylığın iki yıllık tutarıdır.","ad":"Evlenme ödeneği tutarı"}],"dayanak":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu m.37","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Ayşe Hanım, SGK\u0027dan babasının vefatı nedeniyle aylık alan kız kardeşi Zeynep\u0027in 2023 yılında evlenmesi üzerine, Zeynep\u0027in aylığından pay artışı beklemektedir. Zeynep evlenirken talepte bulunmuş ve 2 yıllık aylığının toplamı olan 96.000 TL\u0027yi tek seferde evlenme ödeneği olarak almıştır.","anlatim":"Zeynep artık aylık almıyor, yerine peşin para aldı. Ayşe Hanım\u0027ın payı bu yüzden değişecek ama ne zaman değişeceği kritik.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanun m.37, Zeynep\u0027in 2 yıllık aylığını peşin öder, bu süre boyunca hak sahibi olmasa da sağlık güvencesi devam eder, diğerlerinin payı ise 2 yılın SONUNDA yeniden hesaplanır. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Zeynep\u0027in durumu ile diğer hak sahiplerinin durumunu birbirine karıştırmamak lazım. Beşini sırayla test edeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"5510 s.K. m.37","karar":"doğru","anlatim":"Evet, Zeynep\u0027in parası bitene kadar Ayşe bekler. Süre dolunca ilk ödeme döneminde pay büyür. Kanun tam olarak bunu söylüyor.","formul":"Şık A: Ayşe Hanım\u0027ın payı, Zeynep\u0027in 2 yıllık ödenek süresi bittikten sonraki ilk ödeme döneminden itibaren mi artacak, sen ne dersin?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"5510 s.K. m.37","karar":"yanlış","anlatim":"Hayır, ödeme günü ile payın yeniden hesaplanacağı gün aynı şey değil. Kanun ödeneğin bittiği süreyi esas alır, ödeme anını değil.","formul":"Şık B: Zeynep parayı aldığı gün Ayşe Hanım\u0027ın payının hemen artması gerekir mi, sence?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"5510 s.K. m.37","karar":"yanlış","anlatim":"Hayır, parayı zaten peşin aldı. 2 yıl dolana kadar tekrar aylık bağlanmaz, kanun bunu açıkça yasaklıyor.","formul":"Şık C: Zeynep 2 yıl dolmadan boşanıp yeniden hak sahibi olsa, bu 2 yıl boyunca ona ayrıca aylık bağlanır mı?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"5510 s.K. m.37","karar":"yanlış","anlatim":"Hayır, tam tersi olur. Kanun onu m.60/1-f bendi kapsamında genel sağlık sigortalısı sayar, güvence devam eder.","formul":"Şık D: Zeynep bu 2 yıl içinde yeniden hak sahibi olsa, sağlık sigortası kapsamı dışında mı kalır?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"5510 s.K. m.37","karar":"yanlış","anlatim":"Hayır, kanun \u0027talepte bulunmaları halinde\u0027 diyor, yani Zeynep\u0027in başvurusu şart. SGK res\u0027en ödeme yapmaz.","formul":"Şık E: Zeynep hiç başvurmasa, SGK evlenme ödeneğini kendiliğinden yatırır mı?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Tek doğru A: diğer hak sahiplerinin payı, ödenek süresinin bitimini takip eden ödeme döneminden itibaren yeniden belirlenir. Kendine sor: burada esas alınan şey ödemenin yapıldığı an mı, yoksa sürenin sona erdiği an mı?","doldur":[]}],"anahtar":[{"ornek":"ödenek","kok":"ödenek"},{"ornek":"zeynep","kok":"zeynep"},{"ornek":"döneminden","kok":"dönemi"},{"ornek":"yeniden","kok":"yenide"},{"ornek":"sahiplerinin","kok":"sahipl"},{"ornek":"belirlenir","kok":"belirl"}],"konuGiris":{"harita":"Ne zaman test edilir: kız çocuğunun evlenmesi nedeniyle aylığının kesilmesi ve talepte bulunması durumunda. Nasıl ölçülür: kesilen aylığın iki yıllık tutarının bir defaya mahsus peşin ödenmesiyle. Nasıl kaydedilir: hak sahibi iki yıl içinde tekrar hak sahibi olursa bu süre sonuna kadar yeniden aylık bağlanmaz.","desen":"Sınav genelde \u0027evlenme ödeneği bir defaya mahsustur, aylık bağlanmaya devam edilmez\u0027 bilgisini bozarak yanlış şık üretir. Tuzak, iki yıl içinde tekrar hak sahibi olma halinde yeniden aylık bağlanacağı yanılgısıdır; oysa kanun bu süre sonuna kadar bağlanmayacağını söyler. Bu soru m.37/1. fıkra noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Evlenen kız çocuğuna kesilen aylığın iki yıllık tutarının peşin ödenmesi","ad":"Evlenme ödeneği","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Evlenme ödeneği hesaplanırken esas alınan aylık miktarının süre çarpımı","ad":"İki yıllık tutar","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İki yıl içinde tekrar hak kazanılırsa yeni aylığın başlamayacağı durum","ad":"Yeniden hak sahipliği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Evlenme ödeneği alıp iki yıl içinde tekrar hak sahibi olanın sayıldığı sigorta türü","ad":"Genel sağlık sigortalılığı","kim":"kanun sabitler"}],"sinavda":"Soru, evlenme ödeneğinin peşin ödenme koşulunu ve süresini bilip bilmediğini sorar.","panel_ornek":"Bir arkadaşın, her ay aldığı 300 liralık burs desteğini evlenince kesiliyor ve üniversite ona bunun yerine tek seferde 2 yıllık toplamı olan 7.200 lirayı peşin veriyor. Yani düzenli ödeme durunca, biriken hak tek kalemde ödeniyor.","ornek":"Bir arkadaşın, her ay aldığı 300 liralık burs desteğini evlenince kesiliyor ve üniversite ona bunun yerine tek seferde 2 yıllık toplamı olan 7.200 lirayı peşin veriyor. Yani düzenli ödeme durunca, biriken hak tek kalemde ödeniyor.","yontemler":"En kritik kural: evlenme ödeneği bir defaya mahsustur ve iki yıllık aylık tutarını kapsar; bu süre içinde tekrar hak sahibi olunsa da yeni aylık bağlanmaz.","nedir":"Uzun vadeli sigorta kolları; malullük, yaşlılık, ölüm gibi durumlarda hak sahiplerine bağlanan gelir/aylık kurallarını düzenler. Sınav, evlenme ödeneği gibi özel hallerde hangi tutarın ve hangi süreyle ödendiğini bilip bilmediğini ölçer."},"olay":"yok.","tuzak":{"C":{"ad":"Ters Sonuç Tuzağı","metin":"öğrenci evlenme ödeneği alan kişinin iki yıl boyunca da aylık almaya devam edeceğini sanır. Doğrusu: iki yıllık süre içinde yeniden hak sahibi olunsa dahi bu sürenin sonuna kadar gelir veya aylık bağlanmaz."},"E":{"ad":"Belge/Şart Tuzağı","metin":"öğrenci ödeneğin otomatik olarak, herhangi bir başvuru olmadan verildiğini sanır. Doğrusu: evlenme ödeneği ancak hak sahibinin talepte bulunması halinde ödenir."},"D":{"ad":"Kapsam Tuzağı","metin":"öğrenci genel sağlık sigortası korumasının evlenme ödeneği süresince kesintiye uğradığını düşünür. Doğrusu: bu durumda olanlar 60 ıncı maddenin birinci fıkrasının (f) bendi kapsamında genel sağlık sigortalısı sayılır."},"B":{"ad":"Zamanlama Tuzağı","metin":"öğrenci evlenme ödeneğinin ödendiği anı esas alıp diğer hak sahiplerinin payının hemen değişeceğini düşünür. Doğrusu: yeniden belirleme, ödenek süresinin bitimini takip eden ödeme döneminden itibaren gerçekleşir, ödeme anından değil."}},"celdiriciYol":{},"hap":"Evlenme ödeneği verilince diğer hak sahiplerinin payı, ödenek süresinin BİTİMİNİ TAKİP EDEN ödeme döneminden itibaren yeniden belirlenir; ödenek alan kişi iki yıl boyunca genel sağlık sigortalısı sayılır ama aylık bağlanmaz.","teshis":{"C":{"gercek":"Kanun, iki yıllık sürenin sonuna kadar gelir veya aylık bağlanmayacağını açıkça belirtir; ödenek aylığın yerine geçer.","ayirt":"Evlenme ödeneği bir defalık peşin ödeme mi, yoksa aylığın devamı mı?","paragraf":"5510 s.K. m.37","yanilgi":"Evlenme ödeneği alan kişinin aynı zamanda aylık almaya devam edeceğini düşünüyorsun."},"E":{"gercek":"Kanun evlenme ödeneğinin ancak hak sahibinin \u0027talepte bulunması halinde\u0027 ödeneceğini şart koşar.","ayirt":"Ödenek için ayrıca bir talep şartı var mı, yok mu?","paragraf":"5510 s.K. m.37","yanilgi":"Ödeneğin idarece kendiliğinden, başvuru aranmaksızın verildiğini sanıyorsun."},"A":{"gercek":"5510 sayılı Kanun m.37, diğer hak sahiplerinin payının ödenek süresinin BİTİMİNİ TAKİP EDEN ödeme döneminden itibaren yeniden belirleneceğini emreder.","ayirt":"Yeniden belirleme, ödemenin yapıldığı gün mü yoksa sürenin sonu mu esas alınıyor?","paragraf":"5510 s.K. m.37","yanilgi":"Bu şıkkı doğru bulmakla birlikte zamanlamasını \u0027ödeme anı\u0027 ile karıştırma riskin var."},"D":{"gercek":"Kanun bu kişileri 60 ıncı maddenin birinci fıkrasının (f) bendi kapsamında genel sağlık sigortalısı sayar, güvence devam eder.","ayirt":"Aylık kesilmesi ile genel sağlık sigortası kapsamı aynı şey midir?","paragraf":"5510 s.K. m.37","yanilgi":"Aylığı kesilen kişinin sağlık güvencesinin de tamamen kalktığını sanıyorsun."},"B":{"gercek":"Kanun açıkça \u0027evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren\u0027 der; ödeme tarihi değil sürenin bitişi esastır.","ayirt":"Metinde \u0027ödendiği tarih\u0027 mi yoksa \u0027sürenin bitimi\u0027 mi geçiyor?","paragraf":"5510 s.K. m.37","yanilgi":"Ödeneğin ödendiği tarihi, hakların yeniden hesaplandığı tarih sanıyorsun."}},"verilen":[[1,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"6356 sayılı Kanunun 62 nci maddesinin ikinci fıkrasına göre yasağın kalkmasından itibaren altmış gün içinde altı iş günü önce karşı tarafa bildirilmek kaydıyla uygulamaya devam edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 62\u0027de kaç fıkra ve her fıkranın \u0027sürekli mi geçici mi\u0027 olduğunu ayırarak oku; süre ve bildirim rakamlarını (60 gün / 6 iş günü) diğer maddelerin sürelerine (30 gün gibi) karıştırma.","konu":"grev lokavt yasağı","tablo":{"satirlar":[["A) Yasağın kalkmasından itibaren altmış gün içinde, altı iş…","6356 s.K. m.62/2","doğru ifade"],["B) Yasağın kalkmasından itibaren altmış gün içinde herhangi…","6356 s.K. m.62/2","YANLIŞ ifade"],["C) Yasağın kalkmasından itibaren otuz gün içinde, altı iş g…","6356 s.K. m.62/2","YANLIŞ ifade"],["D) Yasak kalktıktan sonra yeniden yetki tespiti yapılmadıkç…","6356 s.K. m.62/2","YANLIŞ ifade"],["E) Bu işyerinde de can ve mal kurtarma işlerinde olduğu gib…","6356 s.K. m.62/1-2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yasağın kalkmasından itibaren otuz gün içinde, altı iş günü önce karşı tarafa bildirilmek kaydıyla grev ve lokavt uygulamasına devam edilir","E":"Bu işyerinde de can ve mal kurtarma işlerinde olduğu gibi süreklilik arz eden mutlak bir grev ve lokavt yasağı devam eder","A":"Yasağın kalkmasından itibaren altmış gün içinde, altı iş günü önce karşı tarafa bildirilmek kaydıyla grev ve lokavt uygulamasına devam edilir","D":"Yasak kalktıktan sonra yeniden yetki tespiti yapılmadıkça grev ve lokavt uygulanamaz, taraflar toplu görüşme sürecini baştan başlatmak zorundadır","B":"Yasağın kalkmasından itibaren altmış gün içinde herhangi bir bildirim yapılmaksızın grev ve lokavt uygulamasına doğrudan devam edilir"},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.62","metin":"MADDE 62 – (1) Can ve mal kurtarma işlerinde; cenaze işlerinde ve mezarlıklarda; şehir şebeke suyu, elektrik, doğal gaz, petrol üretimi, tasfiyesi ve dağıtımı ile nafta veya doğalgazdan başlayan petrokimya işlerinde; (…)11 Millî Savunma Bakanlığı ile Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığınca doğrudan işletilen işyerlerinde; kamu kuruluşlarınca yürütülen itfaiye (…)11 ve hastanelerde grev ve lokavt yapılamaz. (2) Cumhurbaşkanı, genel hayatı önemli ölçüde etkileyen doğa olaylarının gerçekleştiği yerlerde bu durumun devamı süresince yürürlükte kalmak kaydıyla gerekli gördüğü işyerlerinde grev ve lokavtı yasaklayabilir. Yasağın kalkmasından itibaren altmış gün içinde altı iş günü önce karşı tarafa bildirilmek kaydıyla grev ve lokavt uygulamasına devam edilir.12 (3) Başladığı yolculuğu yurt içindeki varış yerlerinde bitirmemiş deniz, hava, demir ve kara ulaştırma araçlarında grev ve lokavt yapılamaz. Anayasa Mahkemesinin 22/10/2014 tarihli ve E.: 2013/1, K.: 2014/161 sayılı Kararı ile, bu fıkrada yer alan “…bankacılık hizmetlerinde;…” ve “…ve şehir içi toplu taşıma hizmetlerinde…” ibareleri iptal edilmiştir. 12 2/7/2018 tarihli ve 700 sayılı Kanun Hükmünde Kararnamenin 197 nci maddesiyle bu fıkrada yer alan “Bakanlar Kurulu” ibaresi “Cumhurbaşkanı” şeklinde değiştirilmiştir. 11 Grev ve lokavtın ertelenmesi"}],"hakem":"Sorunun doğru şıkkı 6356 sayılı Kanun m.62/2\u0027de açıkça yer alan kurala dayanmaktadır: yasağın kalkmasından itibaren altmış gün içinde altı iş günü önce bildirim kaydıyla grev ve lokavta devam edilir."},"kayitlar":[],"sade":{"siklar":{"C":"Toplu görüşmelere ilişkin 30 günlük süreyi karıştırıyor. Bu maddenin süresi 60 gündür; 30 gün başka kurallar için geçerlidir.","E":"Can ve mal kurtarma gibi sürekli yasağı bununla karıştırıyor. Doğa olayı yasağı geçici ve kaldırılabilirdir; kalktıktan sonra bildirimle greve devam edilir.","D":"Yetki tespitinin düşeceğini sanıyor ama yasağın kalkması, yeni yetki kararı almayı gerektirmez. Sadece bildirim yapılırsa grev devam edebilir.","B":"Süreyi doğru bulsa da bildirim şartını atlıyor. 60 gün içinde kalsa bile 6 iş günü öncesinden karşı tarafa haber vermek zorunludur, böylece başlanamazsa doğru değil."},"dogru":"Cumhurbaşkanı doğa olayı nedeniyle koyduğu grev-lokavt yasağı kalktığında, işçi ve işveren yasağın kalkmasından sonraki 60 gün içinde 6 iş günü önceden karşı tarafa haber vererek greve devam edebilir.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 62. maddenin ikinci fıkrası","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 62. madde","tanim":"Cumhurbaşkanının genel hayatı önemli ölçüde etkileyen doğa olayları sırasında belirli işyerlerde grev ve lokavtı geçici olarak yasaklama yetkisi; yasak kalktığında bildirimle greve devam edilebilir.","ad":"doğa olayı nedeniyle geçici grev-lokavt yasağı"},{"kaynak":"Sendikalar ve TİS K. 62. madde","tanim":"Grev veya lokavt başlamadan önceki 6 iş günü içinde karşı tarafa resmi olarak haber verme yükümlülüğü.","ad":"bildirim şartı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2019/2"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre, Cumhurbaşkanının genel hayatı önemli ölçüde etkileyen bir doğa olayı nedeniyle belirli bir işyerinde grev ve lokavtı yasakladığı ve bu yasağın sonradan kalktığı bir olayda, grev ve lokavt uygulamasına devam edilmesi hangi kurala bağlıdır?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-11","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.62/1-2","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Karadeniz\u0027de bir sahil kasabasında sel felaketi genel hayatı etkileyince Cumhurbaşkanı, bir liman işletmesinde grev ve lokavtı yasaklıyor; 45 gün sonra sel etkisi geçip yasak kalkıyor.","anlatim":"İşçi sendikası ile işveren, yasak kalkar kalkmaz greve devam etmek istiyor. Ama iki taraf da \u0027şimdi ne yapmalıyız\u0027 diye tereddüt ediyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Ticaret Kanunu değil, 6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.62/2 uygulanacak; yasağın kalkmasından itibaren altmış gün içinde, altı iş günü önce bildirimle greve devam edilecek.","anlatim":"Bu kuralı beş ifadeyi bu olayda tek tek deneyerek sınayacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"6356 s.K. m.62/2","karar":"doğru","anlatim":"Sel etkisi geçtiğinde liman işçileri tam da bunu yapıyor: altmış günlük süre içinde altı iş günü önceden bildirim gönderiyorlar. Madde 62/2 ikinci cümle tam bunu söylüyor.","formul":"Şık A: sendika başkanı \u0027yasak kalktı, altmış gün içinde altı iş günü önce karşı tarafa haber verip greve devam edelim\u0027 diyor, doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"6356 s.K. m.62/2","karar":"yanlış","anlatim":"Liman işçileri hiç haber vermeden greve başlarsa madde 62/2\u0027deki \u0027kaydıyla\u0027 şartını ihlal eder. Bildirim zorunlu, atlanamaz.","formul":"Şık B: işveren temsilcisi \u0027bildirime gerek yok, yasak kalkar kalkmaz doğrudan greve başlarız\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"6356 s.K. m.62/2","karar":"yanlış","anlatim":"Liman olayında süre kırk beşinci günde değil altmış gün sınırı içinde sayılır, otuz gün değil. Otuz gün başka bir maddeye ait bir sayı, buraya karışmaz.","formul":"Şık C: hukuk müşaviri \u0027süre otuz gün, altı iş günü önceden haber verilir\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"6356 s.K. m.62/2","karar":"yanlış","anlatim":"Liman işçileri için yeni bir yetki süreci gerekmez, zaten yetki tespit edilmişti. Madde 62/2 sadece bildirimle devamı düzenler, baştan başlatmayı değil.","formul":"Şık D: liman müdürü \u0027yasak kalktı, önce yeni bir yetki tespiti yaptıralım, süreci baştan başlatalım\u0027 diyor, gerekli mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"6356 s.K. m.62/1-2","karar":"yanlış","anlatim":"Liman işletmesi hastane veya itfaiye gibi sürekli yasaklı listede değil, doğa olayının etkisiyle geçici yasaklanmıştı. Sel bitince yasak da bitiyor, mutlak yasak burada geçerli değil.","formul":"Şık E: liman işletmecisi \u0027burası da hastane gibi, sürekli yasaklı sayılır\u0027 diyor, haklı mı?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Liman olayında tek doğru yol, altmış gün içinde altı iş günü önce bildirimle greve devam etmek. Kendine hep şunu sor: bu süre altmış gün mü otuz gün mü, ve bildirim şart mı değil mi?","doldur":[]}],"anahtar":[{"ornek":"bildirimle","kok":"bildir"},{"ornek":"altmış","kok":"altmış"},{"ornek":"içinde","kok":"içinde"},{"ornek":"yasaklardan","kok":"yasakl"},{"ornek":"olayında","kok":"olayın"},{"ornek":"işçileri","kok":"işçile"}],"konuGiris":{"harita":"Ne zaman test edilir: Cumhurbaşkanının doğa olayı nedeniyle koyduğu grev-lokavt yasağı kalktığında test edilir. Nasıl ölçülür: yasağın kalkmasından itibaren işlemeye başlayan altmış günlük süre ve altı iş günü önceden bildirim şartıyla ölçülür. Nasıl kaydedilir: karşı tarafa yapılan bildirim tarihi ve yasağın kalkış tarihi esas alınarak değerlendirilir.","desen":"Sınav genelde yasağın kalkmasından sonra grev-lokavta devam edilmesinin hangi süre ve bildirim şartına bağlı olduğunu sorar; tuzak, altmış günlük süreyi altı iş günlük bildirim süresiyle karıştırtmaktır. Bazı sorularda yasağın kim tarafından konulduğu da (Cumhurbaşkanı) karıştırılır. Bu soru m.62/2 hükmünden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Cumhurbaşkanının genel hayatı etkileyen doğa olayı nedeniyle koyduğu geçici grev-lokavt engeli","ad":"doğa olayı yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"yasak kalktıktan sonra grev-lokavta dönülebilecek azami süre sınırı","ad":"altmış günlük süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"karşı tarafa uygulamaya devam edileceğinin önceden haber verilmesi süresi","ad":"altı iş günü bildirim","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"grev veya lokavt uygulayacak tarafın diğer tarafa yaptığı resmi haber verme işlemi","ad":"karşı tarafa bildirim","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Soru, doğa olayı nedeniyle konan yasağın kalktığı bir olayı verip devam şartının hangi kurala bağlı olduğunu ister.","panel_ornek":"Bir apartman yönetimi, deprem riski nedeniyle asansör bakımını üç ay durdurmuş, sonra risk kalkınca bakıma tekrar başlarken önce yöneticiye beş gün önceden haber vermiş. Yani bir engel kalksa bile eski işe dönüş belirli bir süre ve önceden bildirim şartına bağlanıyor.","ornek":"Bir apartman yönetimi, deprem riski nedeniyle asansör bakımını üç ay durdurmuş, sonra risk kalkınca bakıma tekrar başlarken önce yöneticiye beş gün önceden haber vermiş. Yani bir engel kalksa bile eski işe dönüş belirli bir süre ve önceden bildirim şartına bağlanıyor.","yontemler":"Metindeki iki sayıyı (altmış gün, altı iş günü) birbirine karıştırmadan doğru eşleştirmek en kritik noktadır.","nedir":"Grev lokavt yasağı, hangi işyerlerinde ve hangi hallerde grev-lokavtın uygulanamayacağını belirleyen düzenlemedir. Sınav, yasağın kalkması sonrası devam şartlarının süre ve bildirim kurallarını bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Süre Karıştırma Tuzağı","metin":"Toplu görüşmenin başlamasına ilişkin otuz günlük süreyi bu maddedeki altmış günlük süreyle karıştırıyorsun. Doğrusu: madde 62/2\u0027deki süre altmış gündür, otuz gün başka bir hükme aittir."},"E":{"ad":"İki Yasağın Karıştırılması Tuzağı","metin":"Madde 62/1\u0027deki sürekli mutlak yasak ile madde 62/2\u0027deki geçici ve kaldırılabilir Cumhurbaşkanı yasağını aynı kurum sanıyorsun. Doğrusu: doğa olayı yasağı geçicidir, kalktığında bildirimle devam edilebilir, mutlak yasak kapsamına girmez."},"D":{"ad":"Yetki Düşmesi Tuzağı","metin":"Grev-lokavt yasağının kalkmasını, yetki tespitinin düşmesi ve sürecin yeniden başlaması gerektiren farklı bir kurumla karıştırıyorsun. Doğrusu: madde 62/2 yalnız bildirimle devam etmeyi öngörür, yeni bir yetki süreci aranmaz."},"B":{"ad":"Bildirim Şartını Atlama Tuzağı","metin":"Süreyi doğru hatırlayıp bildirim yükümlülüğünü unutuyorsun. Doğrusu: altmış günlük süre içinde ayrıca altı iş günü önceden bildirim yapılması zorunludur."}},"celdiriciYol":{"C":"Toplu görüşmeye çağrı süresi olan otuz gün, madde 62/2\u0027deki altmış günün yerine konularak \u0027otuz gün + altı iş günü\u0027 kurgusu oluşturulur (süre kaynağı karıştırma)","E":"Madde 62/1\u0027deki mutlak-sürekli yasak listesi, madde 62/2\u0027deki geçici yasakla birleştirilerek \u0027süreklilik\u0027 sonucuna varılır (iki fıkranın birbirine karıştırılması)","D":"Yetki düşmesine ilişkin ayrı bir hükmün sonucu bu maddeye taşınarak \u0027yeniden yetki süreci\u0027 şartı eklenir (farklı madde kuralının yüklenmesi)","B":"Altmış günlük süreyi doğru okuyup bildirim şartını atlayarak \u0027süre yeterli\u0027 sonucuna varılır (bildirim katmanının atlanması)"},"hap":"6356 sayılı Kanun m.62/2\u0027de Cumhurbaşkanının koyduğu doğa olayı kaynaklı grev-lokavt yasağı kalktığında, altmış gün içinde altı iş günü önceden bildirimle uygulamaya devam edilir; bu geçici yasak, madde 62/1\u0027deki sürekli-mutlak yasaklardan ayrıdır.","teshis":{"C":{"gercek":"Madde 62/2\u0027de belirtilen süre açıkça altmış gündür, otuz gün başka bir hükme (toplu görüşmeye çağrı) aittir.","ayirt":"Bu süre hangi maddede, hangi olay için öngörülmüş?","paragraf":"6356 s.K. m.62/2","yanilgi":"Toplu görüşme sürecindeki otuz günlük süreyle bu maddedeki süreyi aynı kalıba oturtuyorsun."},"E":{"gercek":"Madde 62/1 belirli işyerlerinde daimi yasak koyar; madde 62/2 ise doğa olayının devamı süresince geçerli, kalkabilen bir yasaktır.","ayirt":"Bu yasak sürekli mi, yoksa bir olayın devamına bağlı geçici bir yasak mı?","paragraf":"6356 s.K. m.62/1-2","yanilgi":"Madde 62/1\u0027deki sürekli-mutlak yasak listesini madde 62/2\u0027deki geçici yasakla aynı kategoride görüyorsun."},"A":{"gercek":"6356 sayılı Kanun m.62/2 açıkça altmış günlük süre ve altı iş günü önceden bildirim şartını birlikte arar.","ayirt":"Yasağın kalkması tek başına yeterli mi, yoksa ayrıca bildirim mi gerekiyor?","paragraf":"6356 s.K. m.62/2","yanilgi":"Bu şıkkı eleyen öğrenci, geçici yasağın kalkmasından sonra hiçbir usul aranmadan sürecin kendiliğinden bittiğini düşünür."},"D":{"gercek":"Madde 62/2 yeni bir yetki süreci öngörmez, yalnız bildirimle devam etmeyi düzenler; yetki düşmesi tamamen ayrı bir kurumdur.","ayirt":"Bu madde yeni bir süreç mi başlatıyor, yoksa mevcut sürece devam mı öngörüyor?","paragraf":"6356 s.K. m.62/2","yanilgi":"Grev-lokavt yasağının kalkmasını yetki tespitinin düşmesiyle aynı hukuki sonuç sanıyorsun."},"B":{"gercek":"Madde metni bildirimi süreyle birlikte aynı cümlede \u0027kaydıyla\u0027 ifadesiyle şart koşar; bildirim olmadan devam mümkün değildir.","ayirt":"Maddede geçen \u0027kaydıyla\u0027 ibaresi neyi şart koşuyor?","paragraf":"6356 s.K. m.62/2","yanilgi":"Süreyi doğru bilip bildirim yükümlülüğünü gereksiz bir formalite sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 110"},"kural":"Türk Borçlar Kanunu m.415/2\u0027ye göre işçi kendi motorlu aracını işin gorulmesinde kullanıyorsa işveren, araca ilişkin vergiyi, zorunlu mali sorumluluk sigortası primini ve aracın yipranmasi karşılığında uygun bir tazminatı hizmet için kullanıldığı ölçüde ödemekle yükümlüdür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 110","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde numarasını değil ölçü kaydını (\u0027hizmet için kullanıldığı ölçüde\u0027) ve sayılan üç kalemi (vergi-sigorta-tazminat) birlikte ara.","konu":"alt isverenlik","tablo":{"satirlar":[["A) İşveren yalnızca işçiye işin görülmesi için gerekli araç…","m.413, m.415/2","YANLIŞ ifade"],["B) İşveren yalnızca aracın işletilmesi ve bakımı için gerek…","m.415/1-2","YANLIŞ ifade"],["C) İşveren, araca ilişkin vergiyi, zorunlu mali sorumluluk …","m.415/2","doğru ifade"],["D) Bu yükümlülüğün doğması için işçi ile işveren arasındaki…","m.415/2","YANLIŞ ifade"],["E) Bu giderlerden, işçiyi fiilen çalıştıran alt işveren değ…","m.415/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşveren, araca ilişkin vergiyi, zorunlu mali sorumluluk sigortası primini ve aracın yıpranması karşılığında uygun bir tazminatı, hizmet için kullanıldığı ölçüde işçiye ödemekle yükümlüdür.","E":"Bu giderlerden, işçiyi fiilen çalıştıran alt işveren değil, doğrudan asıl işveren sorumludur.","A":"İşveren yalnızca işçiye işin görülmesi için gerekli araç ve malzemeyi sağlamakla yükümlü olduğundan, işçinin kendi motorlu aracını kullanması hâlinde ayrıca bir ödeme yapma yükümlülüğü doğmaz.","D":"Bu yükümlülüğün doğması için işçi ile işveren arasındaki anlaşmanın yazılı şekilde yapılmış ve tarafların el yazısıyla imzalamış olması zorunludur.","B":"İşveren yalnızca aracın işletilmesi ve bakımı için gerekli olağan giderleri karşılamakla yükümlü olup, araca ilişkin vergi ve zorunlu mali sorumluluk sigortası primini ödemekle yükümlü değildir."},"kaynak":{"alinti":"","liste":[{"ad":"TBK (6098 s.K.) m.415","metin":"MADDE 415- İşçi, işin görülmesi için işverenle anlaşarak işverenin veya kendisinin sağladığı bir taşıma aracı kullanıyorsa, taşıtın işletilmesi ve bakımı için gerekli olağan giderler, hizmet için kullanıldığı ölçüde işverence karşılanır. İşçi işverenle anlaşarak, işin görülmesinde kendi motorlu aracını kullanıyorsa, işveren ayrıca bu araçla ilgili vergiyi, zorunlu mali sorumluluk sigortası primini ve aracın yıpranması karşılığında uygun bir tazminatı hizmet için kullanıldığı ölçüde işçiye ödemekle yükümlüdür. İşçi işverenle anlaşarak, hizmetin görülmesinde kendisine ait diğer taşıma araçlarını ve hayvanlarını kullanıyorsa işveren, bunların kullanma ve bakımı için gerekli olan olağan giderleri hizmet için kullanıldığı ölçüde karşılamakla yükümlüdür. 3. Giderlerin ödenmesi"},{"ad":"TTK (6102 s.K.) m.580 - GÜNCEL PARAMETRE ŞERHİ","metin":"GÜNCEL PARAMETRE ŞERHİ — TTK m.580: Madde metnindeki \u0027en az onbin Türk Lirası\u0027 tutarı GÜNCEL DEĞİLDİR. TTK m.580/2\u0027deki yetki (\u0027Bu maddede yazılı en az tutar, Cumhurbaşkanınca on katına kadar artırılabilir.\u0027) uyarınca, 7887 sayılı Cumhurbaşkanı Kararı (RG 25/11/2023, Sayı 32380; yürürlük maddesi RG 26/11/2023, Sayı 32381\u0027deki düzeltme ile) ile limited şirketler için en az esas sermaye tutarı 1/1/2024 tarihinden itibaren 50.000 TL\u0027ye artırılmıştır. Aynı Kararla anonim şirket en az esas sermayesi 250.000 TL\u0027ye, kayıtlı sermaye sistemini kabul etmiş halka açık olmayan anonim şirketlerde en az başlangıç sermayesi 500.000 TL\u0027ye yükseltilmiştir. Mevcut şirketler için uyum: TTK geçici m.15 (Ek: 23/5/2024-7511/17) uyarınca sermayesi bu tutarın altında kalan limited şirketler sermayelerini 31/12/2026 tarihine kadar yükseltmek zorundadır; aksi hâlde infisah etmiş sayılırlar."}],"hakem":"TBK m.415/2\u0027de işçinin kendi motorlu aracını işin görülmesinde kullandığı durumda işverenin vergi, zorunlu mali sorumluluk sigortası primi ve aracın yıpranması karşılığında tazminatı ödeme yükümlülüğü açıkça düzenlenmiştir."},"kayitlar":[],"sade":{"siklar":{"D":"Yazılı şekil veya el yazısı imza şartı aranmamaktadır. İşçinin işte kendi motorlu aracını kullanması yeterlidir.","E":"Yükümlülük işçiyle doğrudan sözleşme ilişkisinde olan alt işverene aittir. Asıl işveren değil, alt işveren sorumludur.","A":"Genel araç-malzeme sağlama kuralı motorlu araçlar için geçerli değildir. Motorlu araç özel düzenlemeye tabi olduğundan işveren ek ödeme yapmakla yükümlüdür.","B":"Vergi ve zorunlu sigortayı ödemek işverenin yükümlülüğünün sadece bir kısmıdır. Aynı zamanda aracın yıpranması için tazminat da ödemelidir."},"dogru":"İşçi kendi motorlu aracını işte kullanırsa, işveren sadece yakıt-bakım değil, araç vergisini, zorunlu sigortasını ve aracın yıpranmasını karşılamakla yükümlüdür. Bu üç kalem birlikte işverenin ödemesi gereken giderdir.","sinav":"Türk Borçlar Kanunu 415. madde ikinci paragraf uyarınca işçi kendi motorlu aracını işin görülmesinde kullanıyorsa işveren, araçla ilgili vergiyi, zorunlu mali sorumluluk sigortası primini ve aracın yıpranması karşılığında uygun bir tazminatı hizmet için kullanıldığı ölçüde işçiye ödemekle yükümlüdür.","kavramlar":[{"kaynak":"Türk Borçlar Kanunu 415. madde","tanim":"İşçinin kendi motorlu aracını işin görülmesinde kullandığında işverenin karşılaması gereken vergi, zorunlu mali sorumluluk sigortası primi ve aracın yıpranması tazminatıdır.","ad":"motorlu araç giderleri"},{"kaynak":"Türk Borçlar Kanunu 415. madde","tanim":"İşçi ile işveren arasında işin görülmesinde taşıma aracı kullanılması konusunda sağlanan mutabakattır ve yazılı şekil şartı aranmamaktadır.","ad":"işverle anlaşma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2019/3"]},"oyun":null,"tip":"teori","soru":"Bir inşaat işinde çalışan alt işveren işçisi, iş sözleşmesinde ayrıca kararlaştırılmamış olmakla birlikte alt işvereniyle anlaşarak kendi motorlu aracını işin görülmesinde kullanmaktadır. Türk Borçlar Kanunu hükümleri uyarınca bu duruma ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-12","verilenler":[],"dayanak":"Türk Borçlar Kanunu m.415/2 (motorlu araç kullanımında işverenin gider ödeme yükümlülüğü)","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir alt işveren, otoyol bakım işinde çalışan işçisi Hakan\u0027la sözleşmede yazmasa da anlaşıp, Hakan\u0027ın kendi 2019 model pikabını iş yerinde malzeme taşımak için kullanmasını kabul ediyor. Yıl sonunda araç için 3.200 TL vergi, 4.500 TL zorunlu sigorta primi çıkıyor, araç da hizmet nedeniyle epey yıpranmış.","anlatim":"İşveren bu giderleri karşılamalı mı, karşılamamalı mı, yoksa başka biri mi ödemeli? Bunu netleştireceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.415/2\u0027ye göre işçi kendi motorlu aracını işin görülmesinde kullanırsa, işveren araç vergisini, zorunlu mali sorumluluk sigortası primini ve yıpranma tazminatını hizmet için kullanıldığı ölçüde öder.","anlatim":"Hakan\u0027ın pikabı üzerinden beş ifadeyi tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.413, m.415/2","karar":"yanlış","anlatim":"Hakan kendi pikabını getirdi diye işveren yükümlülükten kurtulmuyor, tam tersine m.415/2 devreye giriyor. Genel kural araç sağlamaktır ama işçi kendi aracını kullanınca özel hüküm doğar.","formul":"Şık A: biri sana \u0027işveren sadece araç sağlamakla yükümlüdür, işçi kendi aracını getirirse işveren hiç ödeme yapmaz\u0027 derse, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.415/1-2","karar":"yanlış","anlatim":"Hakan\u0027ın pikabı motorlu araç olduğu için m.415/2 devrede, orada vergi ve sigorta primi açıkça sayılıyor. Bu ayrım motorlu araç olup olmamasına göre yapılır.","formul":"Şık B: \u0027işveren yalnız olağan bakım giderini öder, vergi ve sigortayı ödemez\u0027 diyen birine katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.415/2","karar":"doğru","anlatim":"Evet, tam olarak bu üç kalem birlikte istenir ve ödeme hizmet için kullanılan ölçüyle sınırlıdır. Bu, m.415/2\u0027nin doğrudan hükmü.","formul":"Şık C: işveren, Hakan\u0027ın pikabının vergisini, sigortasını ve yıpranma tazminatını hizmette kullanıldığı ölçüde ödemeli mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.415/2","karar":"yanlış","anlatim":"Hakan ile işveren sözlü anlaştı, sözleşmede bile yazmıyor ama yükümlülük yine doğuyor. Kanun burada hiç şekil şartı aramıyor.","formul":"Şık D: \u0027bu yükümlülük ancak yazılı ve el yazısıyla imzalanmış bir anlaşmayla doğar\u0027 diyen birine katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.415/2","karar":"yanlış","anlatim":"Hakan\u0027ın sözleşme tarafı alt işveren, gideri de o öder. Asıl işveren-alt işveren sorumluluğu bambaşka bir konu, burayla karıştırılmaz.","formul":"Şık E: \u0027bu giderlerden Hakan\u0027ı fiilen çalıştıran alt işveren değil, asıl işveren sorumludur\u0027 diyen birine katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"İşçi kendi motorlu aracını kullanınca işveren vergi, sigorta ve yıpranma tazminatını hizmet ölçüsünde öder; kendine hep şunu sor: araç motorlu mu ve kimin sözleşme tarafıyım?","doldur":[]}],"anahtar":[{"ornek":"işveren","kok":"işvere"},{"ornek":"kullanması","kok":"kullan"},{"ornek":"motorlu","kok":"motorl"},{"ornek":"aracını","kok":"aracın"},{"ornek":"sigortası","kok":"sigort"},{"ornek":"yükümlüdür","kok":"yüküml"}],"konuGiris":{"harita":"Ne zaman uygulanır: işçi işverenle anlaşarak kendi motorlu aracını işin görülmesinde kullandığında. Neyi kapsar: vergi, zorunlu mali sorumluluk sigortası primi ve yıpranma tazminatı hizmet için kullanıldığı ölçüde ödenir. Nasıl kararlaştırılır: ayrıca sözleşmede yazılı olması şart değildir, fiilen anlaşma yeterlidir.","desen":"Soru, işçinin kendi aracını kullanmasının sözleşmede ayrıca belirtilmemiş olmasına rağmen işverenin ödeme yükümlülüğünün doğup doğmadığını sorgular; tuzak, \u0027ayrıca kararlaştırılmadıysa yükümlülük yoktur\u0027 yanılgısıdır. Türk Borçlar Kanunu m.415 açıkça fiilen anlaşmanın yeterli olduğunu belirtir, yazılı şart aramaz. Bu soru Türk Borçlar Kanunu m.415 hükmünün ikinci fıkrası noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşveren veya işçinin sağladığı taşıtın işletilmesi, bakımı için gereken normal masraf","ad":"Olağan gider","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"İşçinin kendi motorlu aracını kullanması karşılığında araç aşınması için ödenen uygun bedel","ad":"Yıpranma tazminatı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Motorlu aracın kanunen zorunlu sigortası için ödenen prim tutarı","ad":"Zorunlu mali sorumluluk sigortası primi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Giderlerin yalnızca işte fiilen kullanılan kısım oranında karşılanması esası","ad":"Hizmet için kullanılma ölçüsü","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Soru, işçinin kendi motorlu aracını işverenle anlaşarak kullandığı bir olayı verir ve işverenin hangi ödemelerle yükümlü olduğunun tespitini ister.","panel_ornek":"Arkadaşın kendi motosikletiyle bir kargo firmasına kurye olarak çalışıyor, patronuyla sözlü anlaşmışlar. Motorun vergisi, sigortası ve yıpranması için firma ona ayda 300 lira ödüyor. Yani araç işçinin olsa da masrafı işveren üstleniyor.","ornek":"Arkadaşın kendi motosikletiyle bir kargo firmasına kurye olarak çalışıyor, patronuyla sözlü anlaşmışlar. Motorun vergisi, sigortası ve yıpranması için firma ona ayda 300 lira ödüyor. Yani araç işçinin olsa da masrafı işveren üstleniyor.","yontemler":"Metni satır satır oku, \u0027vergi, sigorta primi, yıpranma tazminatı\u0027 üçlüsünü ezberle; \u0027ayrıca kararlaştırılmamış olması\u0027 ifadesinin yükümlülüğü ortadan kaldırmadığını unutma.","nedir":"Bu konu, işçinin işverenle anlaşarak kendi aracını işte kullanması durumunda giderlerin kim tarafından karşılanacağını düzenler. Sınav, işverenin hangi kalemleri ödemekle yükümlü olduğunu bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"D":{"ad":"Şekil Şartı Uydurma Tuzağı","metin":"Öğrenci Türk Borçlar Kanunu m.14 ve m.15\u0027teki yazılı şekil ve el yazısı imza kuralını, giderlerin ödenmesi yükümlülüğüne şart olarak taşır. Doğrusu: m.415/2\u0027de bu yükümlülüğün doğması için yazılı şekil ya da imza şartı aranmaz, işin gorulmesinde araç kullanılması yeterlidir."},"E":{"ad":"Taraf Hatası Tuzağı","metin":"Öğrenci sorumluluğu, işçiyi fiilen çalıştıran işverenden alıp asıl işverene yükler. Doğrusu: Türk Borçlar Kanunu m.415/2\u0027deki yükümlülük, işçi ile hizmet sözleşmesinin taraflarindan biri olan (burada alt) işverene aittir."},"A":{"ad":"Genel Kural Tuzağı","metin":"Öğrenci Türk Borçlar Kanunu m.413\u0027teki genel araç-malzeme sağlama kuralını, motorlu taşıt kullanımına ilişkin özel düzenlemenin yerine koyar. Doğrusu: İşçi kendi motorlu aracını kullanırsa m.415/2\u0027deki özel hüküm uygulanır ve işveren ek ödeme yapmakla yükümlüdür."},"B":{"ad":"Kapsam Eksik Yükleme Tuzağı","metin":"Öğrenci m.415/1\u0027deki \u0027olağan taşıma aracı\u0027 kuralını motorlu araç için de geçerli sanıp vergi ve sigortayı dışarıda bırakır. Doğrusu: m.415/2 motorlu araç için ayrıca vergi, zorunlu mali sorumluluk sigortası ve yıpranma tazminatını da sayar."}},"celdiriciYol":null,"hap":"Alt işveren işçisinin kendi motorlu aracını işin görülmesinde kullanması hâlinde, Türk Borçlar Kanunu m.415/2 gereği işveren vergi, zorunlu mali sorumluluk sigortası primi ve yıpranma tazminatını hizmet için kullanıldığı ölçüde ödemekle yükümlüdür.","teshis":{"C":{"gercek":"TBK m.415/2 bu üç kalemi birlikte sayar ve ödemeyi hizmet için kullanıldığı ölçüyle sınırlar.","ayirt":"Madde üç kalemi mi sayıyor, ölçü kaydı var mı?","paragraf":"TBK m.415/2","yanilgi":"Bu şıkkı eleyen öğrenci, üç kalemin (vergi, sigorta, yıpranma tazminatı) birlikte ve sınırlı sayılmadığını, ayrıca ölçü sınırının aranmadığını düşünür."},"E":{"gercek":"Gider ödeme yükümlülüğü, işçi ile doğrudan hizmet sözleşmesinin tarafı olan (alt) işverene aittir; asıl işveren sorumluluğu ayrı bir müessesedir.","ayirt":"Bu yükümlülük hangi sözleşmenin tarafına aittir?","paragraf":"TBK m.415/2","yanilgi":"Alt işverenlik ilişkisinde her zaman asıl işverenin sorumlu olduğunu genelliyorsun."},"A":{"gercek":"TBK m.413 genel kuralı koyar, ancak işçi kendi motorlu aracını kullanırsa m.415/2 özel hükmü devreye girer ve işverene ayrı bir ödeme yükümlülüğü yükler.","ayirt":"Bu olayda araç işverenin mi işçinin mi, hangi maddeye giriyorum?","paragraf":"TBK m.413, m.415/2","yanilgi":"İş Kanunu\u0027nda düzenlenmeyen her konuda işverenin yalnız araç sağlama yükümlülüğü olduğunu, işçinin kendi aracını kullanmasının bu yükümlülüğü kaldırdığını sanıyorsun."},"D":{"gercek":"TBK m.14-15 yazılı şekil öngörülen sözleşmeler içindir; m.415/2\u0027deki gider ödeme yükümlülüğü ayrı yazılı şekle bağlanmamıştır.","ayirt":"Bu madde şekil şartı mı koyuyor yoksa sonuç kuralı mı?","paragraf":"TBK m.14, m.15, m.415/2","yanilgi":"Yazılı şekil ve imza kurallarının her borç ilişkisinde geçerlilik şartı olduğunu sanıyorsun."},"B":{"gercek":"TBK m.415/1 genel taşıma aracını, m.415/2 motorlu aracı ayrı düzenler; motorlu araçta vergi ve sigorta primi de işverene aittir.","ayirt":"Araç motorlu mu, o zaman fıkra 1 mi fıkra 2 mi uygulanır?","paragraf":"TBK m.415/1-2","yanilgi":"Motorlu araçla diğer taşıma araçlarını aynı kefeye koyup yalnız olağan bakım giderini yeterli sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 109"},"kural":"Esaslı bir neden olmadıkça birden fazla üst üste (zincirleme) yapılan belirli süreli iş sözleşmesi, başlangıçtan itibaren belirsiz süreli kabul edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 109","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Belirli süreli sözleşme sorularında önce şekil (yazılı), sonra objektif koşul, en son zincirleme-esaslı neden ayrımını sırayla kontrol et; tek eksik şart sözleşmeyi belirsiz süreliye çevirir.","konu":"belirli süreli is sözleşmesi","tablo":{"satirlar":[["A) Esaslı bir nedene dayanılarak zincirleme yapılan belirli…","m.11/3-4","YANLIŞ ifade"],["B) Belirli süreli iş sözleşmesi, işveren ile işçi arasında …","m.11/2","YANLIŞ ifade"],["C) İş ilişkisi bir süreye bağlı olarak yapılmamış olsa dahi…","m.11/1","YANLIŞ ifade"],["D) Belli bir işin tamamlanması gibi objektif bir koşul aran…","m.11/2","YANLIŞ ifade"],["E) Esaslı bir nedene dayanmaksızın zincirleme olarak yapıla…","m.11/3-4","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İş ilişkisi bir süreye bağlı olarak yapılmamış olsa dahi, taraflar sözleşmeyi belirli süreli olarak nitelendirdiklerinde sözleşme belirli süreli sayılır.","E":"Esaslı bir nedene dayanmaksızın zincirleme olarak yapılan belirli süreli iş sözleşmesi, başlangıcından itibaren belirsiz süreli iş sözleşmesi sayılır.","A":"Esaslı bir nedene dayanılarak zincirleme yapılan belirli süreli iş sözleşmeleri de, zincirleme yapıldıkları andan itibaren belirsiz süreli sayılır.","D":"Belli bir işin tamamlanması gibi objektif bir koşul aranmaksızın, sadece taraflarca bir süre kararlaştırılması belirli süreli iş sözleşmesi kurulması için yeterlidir.","B":"Belirli süreli iş sözleşmesi, işveren ile işçi arasında sözlü olarak da geçerli şekilde kurulabilir."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.11","metin":"Madde 11 - İş ilişkisinin bir süreye bağlı olarak yapılmadığı halde sözleşme belirsiz süreli sayılır. Belirli süreli işlerde veya belli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak işveren ile işçi arasında yazılı şekilde yapılan iş sözleşmesi belirli süreli iş sözleşmesidir. Belirli süreli iş sözleşmesi, esaslı bir neden olmadıkça, birden fazla üst üste (zincirleme) yapılamaz. Aksi halde iş sözleşmesi başlangıçtan itibaren belirsiz süreli kabul edilir. Esaslı nedene dayalı zincirleme iş sözleşmeleri, belirli süreli olma özelliğini korurlar. Belirli ve belirsiz süreli iş sözleşmesi ayırımın sınırları"}],"hakem":"Doğru sikk, İş K. m.11\u0027de yer alan esaslı neden olmaksızın zincirleme yapılan belirli süreli sözleşmelerin başlangıçtan itibaren belirsiz süreli kabul edilmesi kuralını kaynak metinden tam olarak desteklemektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Tarafların sözleşmeye verdikleri ad sayıda bağlayıcı olur zannedersin ama işveren ve işçi onu belirli süreli dese bile, gerçekte süreli değilse kanun belirsiz süreli sayar.","E":"Doğru cevap.","A":"Zincirlenmiş sözleşmelerin hepsi belirsiz süreli olacağını sanırsın ama sadece geçerli neden olmayan zincirlemeler belirsiz süreli hale gelir; geçerli nedenle yapılanlar belirli süreli kalır.","D":"Taraflar sadece bir süre kararlaştırsalar yeterli olur sanırsın ancak kanun belirli bir iş, bir işin bitişi ya da belirli bir olayın ortaya çıkması gibi nesnel bir koşul da gerektirir.","B":"Sözleşmenin yazılı şekil şartının önemsiz olduğunu düşünürsün oysa kanun belirli süreli iş sözleşmesinin işveren ve işçi arasında yazılı yapılmasını zorunlu kılar."},"dogru":"İşveren ile işçi sözleşmeyi birden fazla kez üst üste belirli süreli olarak yapıyorsa ve bunun için geçerli bir neden yoksa, sözleşme başından itibaren sonsuz süreli sayılır. Geçerli neden varsa belirli süreli olarak kalmaya devam eder.","sinav":"İş Kanunu 11. madde","kavramlar":[{"kaynak":"İş Kanunu 11. madde","tanim":"Belirli bir işte, belli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak işveren ile işçi arasında yazılı şekilde yapılan sözleşmedir.","ad":"Belirli süreli iş sözleşmesi"},{"kaynak":"İş Kanunu 11. madde","tanim":"Belirli süreli iş sözleşmesinin bitiminden sonra yeniden belirli süreli olarak birden fazla üst üste yapılmasıdır.","ad":"Zincirleme iş sözleşmesi"},{"kaynak":"İş Kanunu 11. madde","tanim":"Zincirleme yapılan belirli süreli iş sözleşmesinin belirli süreli olarak kalmasını sağlayan ve kanunca kabul edilen geçerli sebeptir.","ad":"Esaslı neden"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2017/1"]},"oyun":null,"tip":"teori","soru":"4857 sayılı İş Kanunu\u0027na göre belirli süreli iş sözleşmesinin kuruluşu ve zincirleme yapılması ile ilgili aşağıdaki ifadelerden hangisi kesinlikle doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-13","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.11","dogru":"E","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Bir tekstil atölyesinde, Kenan Usta 2019\u0027dan beri her yıl 1\u0027er yıllık \u0027belirli süreli\u0027 sözleşmeyle çalıştırılıyor; ortada mevsimlik iş, proje ya da özel bir olgu yok, sadece patron her yıl kağıt yeniliyor.","anlatim":"","doldur":[]},{"formul":"Ne yapacağız: Madde 11\u0027e göre süre yoksa sözleşme belirsizdir, objektif koşul + yazılı şekil varsa belirlidir, esaslı neden olmadan zincirleme yapılırsa sözleşme baştan itibaren belirsiz sayılır. Kenan Usta\u0027nın olayında beş ifadeyi tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.11/3-4","karar":"yanlış","anlatim":"Hayır, esaslı neden varsa zincirleme sözleşme belirli süreli kalmaya devam eder. Madde 11\u0027in son fıkrası bunu açıkça korur. Kenan\u0027ın işi mevsimlikse patron haklı çıkar.","formul":"Şık A: Diyelim Kenan Usta\u0027nın işi gerçekten mevsimlik, yani esaslı bir neden var; buna rağmen \u0027zincirleme yapıldı diye otomatik belirsiz oldu\u0027 der misin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.11/2","karar":"yanlış","anlatim":"Hayır, madde 11 açıkça yazılı şekil şartı koyar. Sözlü anlaşma belirli süreli sözleşmeyi doğurmaz, en fazla belirsiz süreli fiili çalışma sayılır. Kenan\u0027ın kağıdı yoksa zaten baştan sorun var.","formul":"Şık B: Patron, \u0027yazıya gerek yok, sözlü anlaştık ya\u0027 diyor; Kenan\u0027ın sözleşmesi geçerli belirli süreli sayılır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.11/1","karar":"yanlış","anlatim":"Hayır, kanun süreye bağlı olmayan iş ilişkisini kendiliğinden belirsiz sayar. Tarafların kağıda ne yazdığı bu emredici hükmü değiştiremez. Kenan\u0027ın işinde objektif koşul yoksa isim boş kalır.","formul":"Şık C: Kenan\u0027la patron kağıda \u0027bu sözleşme belirli süreli sözleşmedir\u0027 yazmışlar ama işin süreye bağlı hiçbir yanı yok; bu yazı sözleşmeyi belirli süreli yapar mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.11/2","karar":"yanlış","anlatim":"Hayır, madde 11 süre yanında mutlaka objektif koşul da ister. Salt süre yazmak yetmez, patron bu şıkta da yanılıyor. Kenan\u0027ın işinde böyle bir koşul yoksa sözleşme belirsizdir.","formul":"Şık D: Patron sadece \u00271 yıl\u0027 yazmış, ne mevsimlik iş ne proje ne özel olgu var; sırf süre yazmak Kenan\u0027ın sözleşmesini belirli süreli yapar mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.11/3-4","karar":"doğru","anlatim":"Evet, esaslı nedene dayanmayan zincirleme sözleşme madde 11 gereği başlangıçtan itibaren belirsiz süreli kabul edilir. Kenan Usta ilk günden beri belirsiz süreli işçi sayılır. Bu, kesin ve tartışmasız doğru sonuçtur.","formul":"Şık E: Kenan Usta\u0027nın işinde hiçbir esaslı neden yokken patron her yıl zincirleme belirli süreli sözleşme yapmış; bu durumda Kenan\u0027ın sözleşmesi 2019\u0027daki ilk günden itibaren belirsiz süreli mi sayılır?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Zincirlemede esaslı neden yoksa sözleşme baştan itibaren belirsiz süreli sayılır, tek doğru budur. Kendine sor: bu zincirlemenin arkasında gerçek bir objektif neden var mı, yoksa sadece kağıt mı yenileniyor?","doldur":[]}],"anahtar":[{"ornek":"süreli","kok":"süreli"},{"ornek":"belirsiz","kok":"belirs"},{"ornek":"sözleşmesi","kok":"sözleş"},{"ornek":"zincirleme","kok":"zincir"},{"ornek":"esaslı","kok":"esaslı"},{"ornek":"belirli","kok":"belirl"}],"konuGiris":{"harita":"Ne zaman test edilir: sözleşmenin kuruluş anındaki objektif koşulun varlığı incelenir. Nasıl ölçülür: zincirleme yapılan sözleşmelerde esaslı neden bulunup bulunmadığına bakılır. Nasıl kaydedilir: esaslı neden yoksa sözleşme başlangıçtan itibaren belirsiz süreli kabul edilir.","desen":"Sınav genellikle \u0027kesinlikle doğru\u0027 ifadesiyle öğrenciyi yazılı şekil şartını ve esaslı neden koşulunu karıştırmaya iter. Tuzak, zincirleme sözleşmenin her durumda belirsiz süreliye dönüşeceğini düşündürmektir; oysa esaslı neden varsa belirli süreli kalır. Bu soru m.11\u0027in zincirleme sözleşme fıkrasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"belirli bir işin bitimi veya belirli bir olgunun ortaya çıkması gibi somut sebep","ad":"objektif koşul","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"zincirleme sözleşmeyi belirli süreli tutabilen haklı, sürekli tekrarlanan gerekçe","ad":"esaslı neden","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"aynı taraflar arasında birden fazla üst üste yapılan belirli süreli sözleşme","ad":"zincirleme sözleşme","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"esaslı neden yokluğunda sözleşmenin baştan itibaren süresiz kabul edilmesi sonucu","ad":"belirsiz süreli sayılma","kim":"kanun sabitler"}],"sinavda":"Soru, belirli süreli sözleşmenin kuruluş şartları ile zincirleme halindeki sonucunu birlikte doğru ifade eden seçeneği bulmayı ister.","panel_ornek":"Bir arkadaşın yaz sezonunda 3 aylığına dondurmacıda çalışmak üzere yazılı sözleşme imzaladığını düşün. Sezon bitince işveren onu her yıl aynı gerekçeyle tekrar tekrar 3\u0027er aylık sözleşmeyle çalıştırırsa, esaslı bir neden yoksa bu sözleşme baştan itibaren belirsiz süreli sayılır. Yani \u0027geçici\u0027 demek her zaman gerçekten geçici olduğu anlamına gelmez.","ornek":"Bir arkadaşın yaz sezonunda 3 aylığına dondurmacıda çalışmak üzere yazılı sözleşme imzaladığını düşün. Sezon bitince işveren onu her yıl aynı gerekçeyle tekrar tekrar 3\u0027er aylık sözleşmeyle çalıştırırsa, esaslı bir neden yoksa bu sözleşme baştan itibaren belirsiz süreli sayılır. Yani \u0027geçici\u0027 demek her zaman gerçekten geçici olduğu anlamına gelmez.","yontemler":"Cevap seçeneklerinde \u0027her zincirleme belirsiz süreli olur\u0027 gibi kesin ifadelere dikkat edilmeli, esaslı neden istisnası göz ardı edilmemelidir.","nedir":"Belirli süreli iş sözleşmesi, işin süresi veya belirli bir işin bitimi gibi objektif bir koşula bağlı yapılan yazılı sözleşmedir. Sınav bu sözleşmenin kuruluş şartlarını ve esaslı neden olmadan zincirlenemeyeceğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"İrade Serbestisi Tuzağı","metin":"Tarafların sözleşmeye verdikleri isim veya nitelendirmenin bağlayıcı olduğunu düşünürsün. Doğrusu: İş ilişkisi bir süreye bağlı olarak yapılmadığı hâlde sözleşme kanunen belirsiz süreli sayılır, taraf iradesi bunu değiştiremez."},"A":{"ad":"Zincirleme Genellemesi Tuzağı","metin":"Zincirleme yapılan her belirli süreli sözleşmenin belirsiz süreleşeceğini düşünürsün. Doğrusu: Esaslı nedene dayalı zincirleme sözleşmeler belirli süreli olma özelliğini korur, yalnız esaslı neden yoksa belirsiz süreli sayılır."},"D":{"ad":"Objektif Koşul Atlama Tuzağı","metin":"Süre kararlaştırmanın tek başına yeterli olduğunu, objektif koşul aranmadığını sanırsın. Doğrusu: Belirli süreli iş sözleşmesi ancak belirli işlerde veya belli bir işin tamamlanması ya da belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak kurulabilir."},"B":{"ad":"Şekil Şartı Atlama Tuzağı","metin":"Sözleşmenin türünü belirleyenin yalnız süre unsuru olduğunu, şeklin önemsiz olduğunu sanırsın. Doğrusu: Kanun belirli süreli iş sözleşmesinin işveren ile işçi arasında yazılı şekilde yapılmasını arar."}},"celdiriciYol":{},"hap":"Esaslı nedene dayanmayan zincirleme belirli süreli iş sözleşmesi, başlangıcından itibaren belirsiz süreli sayılır; esaslı nedene dayalı zincirleme ise belirli süreli özelliğini korur.","teshis":{"C":{"gercek":"Kanun süreye bağlı olmayan iş ilişkisini doğrudan belirsiz süreli sayar; bu emredici hükmü taraf iradesi bertaraf edemez.","ayirt":"Kanunun kendisi mi yoksa tarafların adlandırması mı belirliyor diye kendine sor.","paragraf":"İş K. m.11/1","yanilgi":"Tarafların sözleşmeye verdiği ismin veya niyetin türü belirlediğini sanıyorsun."},"E":{"gercek":"Esaslı nedene DAYANMAYAN zincirleme belirli süreli sözleşmeler başlangıçtan itibaren belirsiz süreli sayılır; hüküm tam bu ayrımı kurar.","ayirt":"Zincirlemenin arkasında esaslı bir neden yok mu, o zaman sonuç ne olur diye kendine sor.","paragraf":"İş K. m.11/3-4","yanilgi":"Esaslı nedenin de zincirlemeyi engelleyeceğini, her hâlükârda sözleşmenin belirsiz süreli sayılacağını düşünerek bu şıkkı elersin."},"A":{"gercek":"Madde 11\u0027e göre esaslı nedene dayalı zincirleme sözleşmeler belirli süreli özelliğini korur; sonuç yalnız esaslı neden YOKSA doğar.","ayirt":"Zincirlemenin arkasında objektif/esaslı bir neden var mı diye kendine sor.","paragraf":"İş K. m.11/3-4","yanilgi":"Zincirlemenin kendisinin, sebebine bakılmaksızın sözleşmeyi belirsiz süreliye çevirdiğini sanıyorsun."},"D":{"gercek":"Belirli süreli sözleşme ancak belirli işlerde veya belli bir işin tamamlanması/olgunun ortaya çıkması gibi objektif koşula bağlı olarak kurulabilir.","ayirt":"Süreyi doğuran objektif bir iş/olgu var mı diye kendine sor.","paragraf":"İş K. m.11/2","yanilgi":"Süre belirtmenin tek başına belirli süreli sözleşme kurmaya yettiğini sanıyorsun."},"B":{"gercek":"Madde 11/2 açıkça yazılı şekli aramaktadır, şekle aykırılık sözleşmeyi belirli süreli saymaz.","ayirt":"Sözleşme yazılı mı diye kendine sor, sözlü anlatım yeterli değildir.","paragraf":"İş K. m.11/2","yanilgi":"Süre unsuru varsa şeklin önemsiz olduğunu, sözlü anlaşmanın yeterli olduğunu sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"Kapsam Karıştırma Tuzağı: olumlu tespitteki geniş bildirim yükümlülüğü, olumsuz tespite de uygulanır sanılır. Doğrusu: m.42/3\u0027e göre yetki şartlarının bulunmadığının tespiti yalnız başvuruyu yapan tarafa bildirilir, diğer taraflara bildirilmez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"İki fıkranın aynı konuyu (olumlu/olumsuz tespit) farklı muhataplarla düzenlediği maddelerde şıkları maddenin fıkra numarasıyla eşleştirerek kontrol et.","konu":"sendika yetkisi düşmesi","tablo":null,"siklar":{"C":"Yetkisiz toplu iş sözleşmesine ilişkin davada, talep hâlinde mahkeme sözleşmenin uygulanmasını dava sonuna kadar durdurabilir.","E":"Bir işçi sendikasının yetki şartlarına sahip olmadığının tespiti hâlinde bu bilgi, tıpkı olumlu tespitte olduğu gibi işkolundaki tüm ilgili taraflara bildirilir.","A":"Sigortalılığın başlangıcı ile sona ermesine ilişkin bildirimlerden yasal süresi içinde Sosyal Güvenlik Kurumuna yapılmayanlar, yetkili işçi sendikasının tespitinde dikkate alınmaz.","D":"Bakanlık, bir işçi sendikasının yetkili olduğunu tespit ettiğinde bu bildirimi o işkolundaki işçi sendikaları ile taraf işverene altı iş günü içinde yapar.","B":"Yetki belgesi bulunmaksızın yapılan toplu iş sözleşmesinin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde ilgililerce veya Bakanlıkça mahkemede dava yolu ile ileri sürülebilir."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.45","metin":"MADDE 45 – (1) Yetki belgesi bulunmaksızın yapılan bir toplu iş sözleşmesinde taraflardan birinin veya ikisinin yetki şartlarına sahip olmadığı ve bu nedenle sözleşmenin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde, ilgililerce veya Bakanlıkça mahkemede dava yolu ile ileri sürülebilir. (2) Talep hâlinde mahkeme, toplu iş sözleşmesinin uygulanmasını dava sonuna kadar durdurabilir. Toplu görüşmeye çağrı"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.42","metin":"MADDE 42 – (1) Toplu iş sözleşmesi yapmak isteyen işçi sendikası Bakanlığa başvurarak yetkili olduğunun tespitini ister. İşveren sendikası veya sendika üyesi olmayan işveren de Bakanlığa başvurarak yetkili işçi sendikasının tespitini isteyebilir. (2) Bakanlık, kayıtlarına göre başvuru tarihi itibarıyla bir işçi sendikasının yetkili olduğunu tespit ettiğinde, başvuruyu, işyeri veya işletmedeki işçi ve üye sayısını, o işkolunda kurulu işçi sendikaları ile taraf olacak işveren sendikası veya sendika üyesi olmayan işverene altı iş günü içinde bildirir. (3) İşçi sendikasının yetki şartlarına sahip olmadığının ya da işyerinde yetki şartlarına sahip bir işçi sendikasının bulunmadığının tespiti hâlinde, bu bilgiler sadece başvuruyu yapan tarafa bildirilir. (4) Sigortalılığın başlangıcı ile sona ermesine ilişkin bildirimlerden yasal süresi içinde Sosyal Güvenlik Kurumuna yapılmayanlar, yetkili işçi sendikasının tespitinde dikkate alınmaz. (5) Yetki tespiti ile ilgili usul ve esaslar Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir. Yetki itirazı7"}],"hakem":"Doğru sık m.42/3\u0027e dayanan kurala uygundur: yetki şartlarının bulunmadığının tespiti yalnız başvuruyu yapan tarafa bildirilir, işkolundaki tüm ilgili taraflara bildirilmez."},"kayitlar":[],"sade":{"siklar":{"C":"Mahkeme, taraf talep ettiğinde sözleşmenin uygulanmasını dava bitene kadar durdurmaya yetkilidir. Durdurma otomatik değil, talep ve mahkeme takdirine bağlıdır.","A":"Sosyal Güvenlik Kurumuna kanuni sürede bildirilmemiş sigortalılık kayıtları, yetki hesabından çıkarıldığı için yetki tespitinde dikkate alınmaz. Bu kural doğru uygulanmıştır.","D":"Yetkili sendika tespit edildiğinde, işkolundaki tüm diğer sendikalar ile işveren tarafa altı iş günü içinde bildirim yapılması kanunen öngörülen yükümlülüktür.","B":"Bakanlık hükümsüzlüğü tespit ettikten sonra kırk beş gün içinde mahkemede dava açma hakkı vardır. Bu süre uygun şekilde açıklanmıştır."},"dogru":"Yetkisiz sendikanın tespit edilmesi durumunda, bu bilgi yalnızca başvuran tarafa iletilir. Olumlu tespitte tüm ilgili taraflara (diğer sendikalar, işveren) bildirim yapılırken, olumsuz tespitte bu geniş bildirim yükümlülüğü yoktur.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 42. madde 3. fıkra","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 42. madde","tanim":"Bakanlığın, toplu iş sözleşmesi yapmak isteyen işçi sendikasının kanuni şartları taşıyıp taşımadığını resmi olarak belirleme işlemidir.","ad":"yetki tespiti"},{"kaynak":"Sendikalar ve TİS K. 45. madde","tanim":"Yetki belgesi olmaksızın veya yetki şartlarına sahip olmayan taraflar tarafından yapılan toplu iş sözleşmesidir ve hükümsüzdür.","ad":"yetkisiz toplu iş sözleşmesi"},{"kaynak":"Sendikalar ve TİS K. 42. madde","tanim":"Bakanlıkça bir işçi sendikasının yetkili olduğunun tespit edilmesi durumunda, bu bildirimin işkolundaki tüm sendikaları ve işveren tarafını kapsayan geniş kapsamlı bildirim yapılmasıdır.","ad":"olumlu yetki tespiti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027nun yetki tespiti ve yetkisiz toplu iş sözleşmesine ilişkin hükümleri birlikte değerlendirildiğinde, aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-16","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.42, m.45","dogru":"E","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[],"anahtar":[{"ornek":"bildirilir","kok":"bildir"},{"ornek":"tespitinde","kok":"tespit"},{"ornek":"olumsuz","kok":"olumsu"},{"ornek":"olumlu","kok":"olumlu"},{"ornek":"başvuru","kok":"başvur"},{"ornek":"yalnız","kok":"yalnız"}],"konuGiris":{"harita":"Yetki ne zaman test edilir: sendika Bakanlığa başvurup yetkili olduğunun tespitini istediğinde. Yetkisizlik nasıl ileri sürülür: tespitten itibaren belirli süre içinde mahkemede dava açılarak. Sonuç nasıl kaydedilir: mahkeme talep üzerine sözleşmenin uygulanmasını dava sonuna kadar durdurabilir.","desen":"Sınav, yetkisiz sözleşmenin ileri sürülme süresi ile bu talebin sonuçlarını karıştırır şekilde soru üretir; süre başlangıcının tespitten mi başvuru tarihinden mi hesaplanacağı tuzaktır. Sözleşmenin kendiliğinden değil ancak dava yoluyla geçersiz sayılabileceği noktası sıkça atlanır. Bu soru m.45 ve m.42 hükümlerinin birlikte değerlendirilmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"bir işçi sendikasının toplu sözleşme yapmaya yeterli üye sayısına sahip olduğunun belirlenmesi","ad":"yetki tespiti","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"yetki tespitine karşı ilgili tarafların mahkemeye başvurarak itiraz etmesi","ad":"yetki itirazı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"yetkisiz yapılan sözleşmenin geçersizliğinin mahkemede ileri sürülmesi","ad":"hükümsüzlük davası","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"dava sonuçlanana kadar sözleşmenin geçici olarak askıya alınması","ad":"uygulamanın durdurulması","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda yetki tespiti ve yetkisiz sözleşmeye ilişkin hükümler birlikte verilir, hangi ifadenin yanlış olduğu istenir.","panel_ornek":"Bir apartman yönetimi, toplantıda karar alabilmek için kat maliklerinin yarısından fazlasının imzasını arar; imza yetmezse alınan karar geçersiz sayılır ve itiraz edilebilir. Bu itiraz için on beş gün gibi kı
