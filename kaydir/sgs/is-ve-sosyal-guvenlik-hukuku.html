 tarihinde ödenmesi gereken borçlardan devreden işveren, devir tarihinden itibaren iki yıl süreyle devralan işverenle birlikte sorumludur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 107","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İşyeri devri sorularında \u0027devir=fesih sebebi\u0027, \u0027rıza aranır\u0027 ve \u0027kıdem sıfırlanır\u0027 cümlelerini otomatik yanlış işaretle; m.6\u0027nın istisnasız iki yıllık sorumluluk kuralını ara.","konu":"işyeri devri-is kanunu","tablo":{"satirlar":[["A) Devralan işveren, işyeri devrini gerekçe göstererek devr…","m.6","YANLIŞ ifade"],["B) Devreden işveren, devirden önce doğmuş ve devir tarihind…","m.6","doğru ifade"],["C) İşyeri devrinde iş sözleşmesinin devralan işverene geçme…","m.6","YANLIŞ ifade"],["D) Ekonomik ve teknolojik sebeplerin gerekli kıldığı fesih …","m.6","YANLIŞ ifade"],["E) İşçinin kıdeme bağlı hakları hesaplanırken yalnızca devr…","m.6","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşyeri devrinde iş sözleşmesinin devralan işverene geçmesi işçinin yazılı rızasına bağlıdır.","E":"İşçinin kıdeme bağlı hakları hesaplanırken yalnızca devralan işveren yanında geçen süre dikkate alınır, devreden işveren yanındaki süre hesaba katılmaz.","A":"Devralan işveren, işyeri devrini gerekçe göstererek devraldığı işçilerin iş sözleşmesini haklı nedenle derhal feshedebilir.","D":"Ekonomik ve teknolojik sebeplerin gerekli kıldığı fesih hakkı yalnız devreden işverene aittir, devralan işveren bu hakkı kullanamaz.","B":"Devreden işveren, devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devir tarihinden itibaren iki yıl süreyle devralan işverenle birlikte sorumludur."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.6","metin":"Madde 6 - İşyeri veya işyerinin bir bölümü hukukî bir işleme dayalı olarak başka birine devredildiğinde, devir tarihinde işyerinde veya bir bölümünde mevcut olan iş sözleşmeleri bütün hak ve borçları ile birlikte devralana geçer. Devralan işveren, işçinin hizmet süresinin esas alındığı haklarda, işçinin devreden işveren yanında işe başladığı tarihe göre işlem yapmakla yükümlüdür. Yukarıdaki hükümlere göre devir halinde, devirden önce doğmuş olan ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren birlikte sorumludurlar. Ancak bu yükümlülüklerden devreden işverenin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır. Tüzel kişiliğin birleşme veya katılma ya da türünün değişmesiyle sona erme halinde birlikte sorumluluk hükümleri uygulanmaz. Devreden veya devralan işveren iş sözleşmesini sırf işyerinin veya işyerinin bir bölümünün devrinden dolayı feshedemez ve devir işçi yönünden fesih için haklı sebep oluşturmaz. Devreden veya devralan işverenin ekonomik ve teknolojik sebeplerin yahut iş organizasyonu değişikliğinin gerekli kıldığı fesih hakları veya işçi ve işverenlerin haklı sebeplerden derhal fesih hakları saklıdır. Yukarıdaki hükümler, iflas dolayısıyla malvarlığının tasfiyesi sonucu işyerinin veya bir bölümünün başkasına devri halinde uygulanmaz. Geçici iş ilişkisi"},{"ad":"TTK (6102 s.K.) m.1192","metin":"MADDE 1192- (1) 1191 inci maddenin birinci fıkrası hükmüne halel gelmemek kaydıyla, bir navlun sözleşmesinde, sözleşmenin konusunu oluşturan bir taşımanın belirli bir kısmının taşıyandan başka bir kişi tarafından gerçekleştirileceğinin öngörülmüş olması durumunda, sözleşmeye, taşımanın ilgili bölümünde taşınan eşya fiilî taşıyanın hâkimiyetinde iken meydana gelecek zıya, hasar veya teslimdeki gecikmeden taşıyanın sorumlu olmayacağına ilişkin şart konabilir; şu kadar ki, sorumluluğu sınırlayan veya ortadan kaldıran bu tür anlaşmalar, yetkili Türk mahkemesinde fiilî taşıyan aleyhine dava açılamadığı hâllerde geçersizdir. Zıyaın, hasarın ve teslimdeki gecikmenin eşya fiilî taşıyanın hâkimiyetinde iken meydana geldiğini ispat yükü, taşıyana aittir. (2) Sorumluluğu sınırlayan veya ortadan kaldıran bir şartın geçerliği, fiilî taşıyanın adı, unvanı ve işyeri adresinin navlun sözleşmesinden anlaşılmasına bağlıdır. Navlun sözleşmesinin yapılması sırasında taşımayı gerçekleştirecek fiilî taşıyan belirlenmemişse, taşıyan, belirlendiği anda ve en geç eşyanın fiilî taşıyana teslimini takiben derhâl gönderilene fiilî taşıyanın adını, unvanını ve işyeri adresini bildirir. Bu bildirim yapılmadığı takdirde, taşıyanın sorumluluğu devam eder. (3) Fiilî taşıyan, eşyanın hâkimi olduğu sırada ortaya çıkan zıyadan, hasardan veya teslimdeki gecikmeden 1191 inci maddenin ikinci fıkrası uyarınca sorumludur. B) Taşıyanın hakları I- Navlun ödenmesini istem hakkı 1. Miktarı a) ölçü, tartı veya sayı üzerine navlun"}],"hakem":"İş Kanunu m.6\u0027da işyeri devrinde devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren birlikte sorumlu olduğu ve devreden işverenin sorumluluğunun devir tarihinden itibaren iki yıl ile sınırlı olduğu açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"İş sözleşmesinin devralana geçişini rıza gerektiren işlemlere benzetebilirsin. Oysa hukuki devirde işçinin rızası aranmaksızın sözleşme bütün hak ve borçlarıyla devralana geçer.","E":"Devrin işçinin kıdemini sıfırladığını, yalnız yeni işverenin yanındaki sürenin sayıldığını düşünebilirsin. Ancak kıdem hesaplanırken işçinin devreden işveren yanında işe başladığı tarih esas alınır.","D":"Ekonomik ve teknolojik fesih hakkının yalnız devreden işverene ait olduğunu sanabilirsin. Gerçekte bu hak hem devreden hem devralan işverene tanınmıştır.","A":"İşyeri devrinin tek başına haklı fesih sebebi olmadığını kaçırırsın. Yasada açıkça işveren devri gerekçe göstererek sözleşmeyi feshedemez."},"dogru":"İşyeri devredildiğinde, devreden işveren devirden önceki borçlardan sorumlu olmaya devam eder. Bu sorumluluk devralan işveren ile paylaşılır, ancak devreden işverenin sorumluluğu devir tarihinden itibaren iki yılla sınırlıdır.","sinav":"İş Kanunu 6. maddeye göre devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren birlikte sorumlu olup, devreden işverenin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır.","kavramlar":[{"kaynak":"İş Kanunu 6. madde","tanim":"İşyeri veya bir bölümü başka bir işverene devredilmeden önce ortaya çıkmış ve devir tarihinde ödenmesi gereken borçlardır. Bu borçlardan hem devreden hem devralan işveren sorumludur, ancak devreden işverenin sorumluluğu iki yılla sınırlıdır.","ad":"İşyeri devrinden doğmuş borçlar"},{"kaynak":"İş Kanunu 6. madde","tanim":"İşyeri veya işyerinin bir bölümünün hukuki bir işleme dayalı olarak başka bir kişiye devredilmesi. Devir sırasında devir tarihinde mevcut olan iş sözleşmeleri, işçinin rızası aranmaksızın bütün hak ve borçlarıyla devralana geçer.","ad":"İşyeri devri"},{"kaynak":"İş Kanunu 6. madde","tanim":"İşçinin işyerinde geçirdiği hizmet süresine bağlı olarak kazandığı haklar. İşyeri devrinde bu haklar hesaplanırken işçinin devreden işveren yanında işe başladığı tarih esas alınır.","ad":"Kıdeme bağlı haklar"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"İşyerinin bir bölümü başka bir işverene devredilmiştir. 4857 sayılı İş Kanunu\u0027na göre işyeri devrinin sonuçlarına ilişkin aşağıdaki ifadelerden hangisi her zaman doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-33","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.6","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir tekstil fabrikasının boyahane bölümü, 1 Mart 2023 tarihinde başka bir şirkete devredilir. Devirden önce, 15 Şubat 2023\u0027te muaccel olmuş 40.000 TL tutarında ödenmemiş fazla mesai alacağı vardır. İşçi Ahmet, 12 yıldır bu bölümde çalışmaktadır.","anlatim":"Devreden patron \u0027artık borç bende değil\u0027 diyor, devralan patron \u0027ben yeni geldim, bilmiyorum\u0027 diyor. Ahmet parasını kimden alacağını soruyor.","doldur":[]},{"formul":"Ne yapacağız: 4857 sayılı İş Kanunu m.6, işyeri devrinde iş sözleşmesinin kendiliğinden geçmesini, borçlardan iki yıl müteselsil sorumluluğu ve fesih haklarının saklı kalmasını düzenler. Beş ifadeyi Ahmet\u0027in olayında tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.6","karar":"yanlış","anlatim":"Devir tek başına fesih sebebi olamaz, sadece iş organizasyonundaki gerçek bir değişiklik fesih hakkı doğurur. Devralan patron sırf devri gerekçe gösterip Ahmet\u0027i atamaz. Bu yüzden ifade yanlıştır.","formul":"Şık A: Devralan patron, \u0027ben bu boyahaneyi devraldım, bu yeter, Ahmet\u0027in sözleşmesini haklı nedenle hemen feshedebilirim\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.6","karar":"doğru","anlatim":"Borç devirden önce doğmuş ve devir anında muaccel, tam kanunun aradığı şart bu. Devreden ve devralan, devir tarihinden itibaren iki yıl müteselsilen sorumludur. Ahmet parasını her ikisinden de isteyebilir.","formul":"Şık B: Ahmet, 15 Şubat\u0027taki fazla mesai alacağını hem eski hem yeni patrondan iki yıl boyunca isteyebilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.6","karar":"yanlış","anlatim":"İş sözleşmesi kanun gereği kendiliğinden devralan işverene geçer, işçinin ayrıca rıza vermesine gerek yoktur. Ahmet\u0027in imza atması şart değildir. Bu yüzden ifade yanlıştır.","formul":"Şık C: Devralan patron \u0027Ahmet yazılı olarak bana geçmeyi kabul etmezse sözleşmesi bende sayılmaz\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.6","karar":"yanlış","anlatim":"Ekonomik-teknolojik sebeplerin gerekli kıldığı fesih hakkı hem devredene hem devralana tanınmıştır. Devralan patron bu hakkı kullanabilir. Bu yüzden ifade yanlıştır.","formul":"Şık D: Fabrikada ekonomik kriz çıkar, devralan patron \u0027ekonomik sebeple fesih hakkı sadece eski patronunkiydi, ben kullanamam\u0027 diyor, haklı mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.6","karar":"yanlış","anlatim":"Kıdeme bağlı haklar, işçinin devreden işveren yanında işe başladığı tarihten itibaren kesintisiz hesaplanır. Ahmet\u0027in 12 yılı da hesaba girer. Bu yüzden ifade yanlıştır.","formul":"Şık E: Kıdem tazminatı hesaplanırken Ahmet\u0027in eski patron yanındaki 12 yılı sayılmaz, sadece devirden sonraki süre sayılır mı?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Devirde tek istisnasız kural, borçtan iki yıl birlikte sorumluluktur, gerisi hep saklı haklar ya da kendiliğinden geçiş meselesidir. Kendine sor: bu ifade \u0027her zaman\u0027 mı geçerli, yoksa bir tarafa özel bir imtiyaz mı tanıyor?","doldur":[]}],"anahtar":[{"ornek":"devralana","kok":"devral"},{"ornek":"devreden","kok":"devred"},{"ornek":"işveren","kok":"işvere"},{"ornek":"yanlıştır","kok":"yanlış"},{"ornek":"patron","kok":"patron"},{"ornek":"tarihinde","kok":"tarihi"}],"konuGiris":{"harita":"Ne zaman test edilir: işyeri veya bir bölümü başka işverene devredildiğinde. Nasıl ölçülür: devir tarihinden önce doğan borçlarda devreden ile devralanın birlikte sorumlu olup olmadığı ve sürenin sınırı ile ölçülür. Nasıl kaydedilir: iş sözleşmesi bütün hak ve borçlarıyla devralana geçmiş sayılır, hizmet süresi eski işe başlama tarihinden hesaplanır.","desen":"Sınav genelde \u0027devir işten çıkarma sebebi olabilir mi\u0027 veya \u0027devreden süresiz sorumlu mu\u0027 tuzağıyla sorar; öğrenci iki yıllık sınırı unutup süresiz sorumluluk seçebilir. Bir diğer tuzak, iflasla tasfiye halinde bu hükümlerin uygulanmamasıdır. Bu soru m.6 fıkra 3-4 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Devir tarihinden önceki borçlarda devredenin sorumluluğu iki yılla sınırlıdır","ad":"Devreden sorumluluğu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Devirden önce doğan ve devir anında ödenmesi gereken borçtan iki işveren birlikte sorumludur","ad":"Birlikte sorumluluk","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Devir tek başına iş sözleşmesinin feshi için haklı sebep sayılamaz","ad":"Fesih yasağı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Kıdeme bağlı haklarda esas alınan, işçinin devreden yanındaki ilk işe başlama tarihi","ad":"Hizmet süresi","kim":"kanun sabitler"}],"sinavda":"Soru, işyeri devrinin sonuçlarına dair ifadelerden hangisinin her zaman doğru olduğunu sorar, hesaplama istemez.","panel_ornek":"Bir arkadaşın çalıştığı kafe başka birine devrediliyor; yeni patron çalışanları kovamıyor, eski patron da devirden önceki 2 aylık maaş borcundan 2 yıl daha sorumlu kalıyor. Yani devir, işçinin hakkını sıfırlamıyor.","ornek":"Bir arkadaşın çalıştığı kafe başka birine devrediliyor; yeni patron çalışanları kovamıyor, eski patron da devirden önceki 2 aylık maaş borcundan 2 yıl daha sorumlu kalıyor. Yani devir, işçinin hakkını sıfırlamıyor.","yontemler":"Şıklarda \u0027süresiz sorumluluk\u0027, \u0027fesih hakkı doğar\u0027 gibi mutlaklık içeren ifadeler genelde yanlıştır; kanundaki iki yıllık sınır ve fesih yasağı cümlesi doğru şıktır.","nedir":"İşyeri devri, iş sözleşmelerinin devralana geçtiği ve tarafların sorumluluk sınırlarının belirlendiği bir İş Kanunu kurumudur. Sınav, devir halinde kimin neyden ne kadar sorumlu olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Kıyas Tuzağı","metin":"İş sözleşmesinin devralana geçmesini alacağın devrine benzeterek işçinin yazılı rızasının arandığını sanırsın. Doğrusu: İş Kanunu m.6 uyarınca devir tarihinde mevcut iş sözleşmeleri, işçinin rızası aranmaksızın bütün hak ve borçlarıyla devralana geçer."},"E":{"ad":"Süre Sıfırlama Tuzağı","metin":"İşyeri devrinin işçinin kıdemini sıfırladığını, yalnız devralan yanındaki sürenin sayılacağını sanırsın. Doğrusu: Kıdeme bağlı haklar hesaplanırken işçinin devreden işveren yanında işe başladığı tarih esas alınır."},"D":{"ad":"Taraf Sınırlama Tuzağı","metin":"Ekonomik ve teknolojik sebeplerin gerekli kıldığı fesih hakkının yalnız devreden işverene ait olduğunu sanırsın. Doğrusu: Bu fesih hakkı hem devreden hem devralan işverene tanınmış olup her ikisinin de haklı sebeple fesih hakları saklı tutulur."},"A":{"ad":"Ters Kural Tuzağı","metin":"İşyeri devrinin tek başına haklı fesih sebebi oluşturduğunu düşünürsün. Doğrusu: 4857 sayılı İş Kanunu m.6 uyarınca devir, işçi veya işveren yönünden derhal fesih için haklı sebep oluşturmaz."}},"celdiriciYol":{},"hap":"İşyeri devrinde iş sözleşmesi işçinin rızası aranmaksızın devralana geçer; devir tek başına haklı fesih sebebi değildir ve kıdem devreden işveren yanındaki başlangıçtan hesaplanır.","teshis":{"C":{"gercek":"4857 sayılı İş Kanunu m.6, iş sözleşmelerinin işçinin rızası aranmaksızın kendiliğinden ve bütün hak-borçlarıyla devralan işverene geçeceğini öngörür; bu, genel borçlar hukukundaki devir rejiminden ayrılan özel bir düzenlemedir.","ayirt":"Bu geçiş için işçinin ayrıca onay vermesi gerekiyor mu, yoksa kanun gereği kendiliğinden mi oluyor?","paragraf":"4857 sayılı İş Kanunu m.6","yanilgi":"İş sözleşmesinin devrini Türk Borçlar Kanunu\u0027ndaki alacağın temlikine kıyaslayıp işçinin rızasının şart olduğunu sanıyorsun."},"E":{"gercek":"4857 sayılı İş Kanunu m.6 ve ilgili kıdem hükümleri, işçinin kıdeme bağlı haklarının devreden işveren yanında işe başladığı tarihten itibaren kesintisiz hesaplanmasını öngörür.","ayirt":"Kıdem süresi devir tarihinden mi, yoksa işçinin devreden işveren yanında ilk işe başladığı tarihten mi başlatılıyor?","paragraf":"4857 sayılı İş Kanunu m.6","yanilgi":"İşyeri devrinin işçinin kıdemini sıfırlayıp yeniden başlattığını, kıdem tazminatı ve izin gibi hakların yalnız devralan yanındaki süreye göre hesaplanacağını sanıyorsun."},"A":{"gercek":"4857 sayılı İş Kanunu m.6 uyarınca devir işlemi, işçi ya da işveren yönünden derhal fesih için haklı sebep oluşturmaz; yalnız ekonomik, teknolojik ya da iş organizasyonundaki değişikliğe dayalı fesih hakları saklıdır.","ayirt":"Fesih sebebi olarak gösterilen şey işyeri devrinin kendisi mi, yoksa ayrı bir ekonomik-teknolojik gerekçe mi?","paragraf":"4857 sayılı İş Kanunu m.6","yanilgi":"İşyeri devrinin başlı başına devralan işverene haklı fesih hakkı verdiğini sanıyorsun."},"D":{"gercek":"4857 sayılı İş Kanunu m.6, bu tür fesih haklarını devreden ve devralan işverenin her ikisi için de saklı tutar; devir, hiçbir tarafın bu hakkını ortadan kaldırmaz.","ayirt":"Madde metni fesih hakkını tek bir tarafa mı hasrediyor, yoksa \u0027devreden veya devralan\u0027 diyerek her ikisine mi tanıyor?","paragraf":"4857 sayılı İş Kanunu m.6","yanilgi":"Ekonomik-teknolojik sebeplerin gerekli kıldığı fesih hakkının yalnızca eski işverene, yani devredene tanındığını sanıyorsun."},"B":{"gercek":"4857 sayılı İş Kanunu m.6, devirden önce doğmuş ve devir anında muaccel borçlardan devreden ve devralan işverenin devir tarihinden itibaren iki yıl süreyle müteselsilen sorumlu olduğunu düzenler.","ayirt":"Borç devir tarihinden önce mi doğmuş ve devir anında ödenmesi gereken bir borç mu, süre iki yıl mı işletiliyor?","paragraf":"4857 sayılı İş Kanunu m.6","yanilgi":"Bu şıkkı eleyen öğrenci, iki yıllık sorumluluğun yalnız devralan işverene ait olduğunu ya da sürenin bir yıl olduğunu sanır."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 109"},"kural":"5510 sayılı Kanun m.13/1-c, görevli olarak işyeri dışına gönderilen sigortalının asıl işini yapmaksızın geçen zamanını iş kazası hâli sayar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metnindeki her bendin şartını (yer, neden, süre, araç kaynağı) tek tek karşılaştır; şıklardaki tek kelime farkını yakala.","konu":"is kazası sayılan haller","tablo":{"satirlar":[["VERİLENLER","-","-"],["Madde numarası","13","-"],["HESAP","-","-"],["A) Sigortalının, işyeri dışında kendi özel işini görmek ama…","m.13/1-a","YANLIŞ ifade"],["B) İşveren tarafından yürütülmekte olan işle bağı bulunmaks…","m.13/1-b","YANLIŞ ifade"],["C) Bir işverene bağlı çalışan sigortalının, görevli olarak …","m.13/1-c","doğru ifade"],["D) Emziren kadın sigortalının, süt izni süresi dolduktan so…","m.13/1-d","YANLIŞ ifade"],["E) Sigortalının, kendi temin ettiği özel taşıtla işin yapıl…","m.13/1-e","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Bir işverene bağlı çalışan sigortalının, görevli olarak işyeri dışında başka bir yere gönderilmesi nedeniyle asıl işini yapmaksızın geçen zamanlarda meydana gelen olay.","E":"Sigortalının, kendi temin ettiği özel taşıtla işin yapıldığı yere gidiş gelişi sırasında meydana gelen olay.","A":"Sigortalının, işyeri dışında kendi özel işini görmek amacıyla bulunduğu sırada meydana gelen ve onu bedenen engelli hâle getiren olay.","D":"Emziren kadın sigortalının, süt izni süresi dolduktan sonra kendi isteğiyle işyerinde uzattığı zamanda meydana gelen olay.","B":"İşveren tarafından yürütülmekte olan işle bağı bulunmaksızın, bağımsız çalışan sigortalının dinlenme amacıyla gittiği yerde meydana gelen olay."},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.13 [1/2]","metin":"MADDE 13- İş kazası; a) Sigortalının işyerinde bulunduğu sırada, b) (Değişik: 17/4/2008-5754/8 md.) İşveren tarafından yürütülmekte olan iş nedeniyle sigortalı kendi adına ve hesabına bağımsız çalışıyorsa yürütmekte olduğu iş nedeniyle, c) Bir işverene bağlı olarak çalışan sigortalının, görevli olarak işyeri dışında başka bir yere gönderilmesi nedeniyle asıl işini yapmaksızın geçen zamanlarda, d) (Değişik: 17/4/2008-5754/8 md.) Bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamındaki emziren kadın sigortalının, iş mevzuatı gereğince çocuğuna süt vermek için ayrılan zamanlarda, e) Sigortalıların, işverence sağlanan bir taşıtla işin yapıldığı yere gidiş gelişi sırasında, meydana gelen ve sigortalıyı hemen veya sonradan bedenen ya da ruhen engelli hâle getiren olaydır.25 İş kazasının 4 üncü maddenin birinci fıkrasının; a) (a) bendi ile 5 inci madde kapsamında bulunan sigortalılar bakımından bunları çalıştıran işveren tarafından, o yer yetkili kolluk kuvvetlerine derhal ve Kuruma da en geç kazadan sonraki üç işgünü içinde, b) (b) bendi kapsamında bulunan sigortalı bakımından kendisi tarafından, bir ayı geçmemek şartıyla rahatsızlığının bildirim yapmaya engel olmadığı günden sonra üç işgünü içinde, c) (Mülga: 17/4/2008-5754/8 md.) (Değişik paragraf: 17/4/2008-5754/8 md.) iş kazası ve meslek hastalığı bildirgesi ile doğrudan ya da taahhütlü posta ile Kuruma bildirilmesi zorunludur. Bu fıkranın (a) bendinde belirtilen süre, iş kazasının işverenin kontrolü dışındaki yerlerde meydana gelmesi halinde, iş kazasının öğrenildiği tarihten itibaren başlar."},{"ad":"5510 s. SGK Kanunu m.13 [2/2]","metin":"Kuruma bildirilen olayın iş kazası sayılıp sayılmayacağı hakkında bir karara varılabilmesi için gerektiğinde, Kurumun denetim ve kontrol ile yetkilendirilen memurları tarafından veya Bakanlık iş müfettişleri vasıtasıyla soruşturma yapılabilir. Bu soruşturma sonunda yazılı olarak bildirilen hususların gerçeğe uymadığı ve olayın iş kazası olmadığı anlaşılırsa, Kurumca bu olay için yersiz olarak yapılmış bulunan ödemeler, ödemenin yapıldığı tarihten itibaren gerçeğe aykırı bildirimde bulunanlardan, 96 ncı madde hükmüne göre tahsil edilir. İş kazası ve meslek hastalığı bildirgesinin şekli ve içeriği, verilme usûlü ile bu Bu bölüm başlığı “Kısa Vadeli Sigorta Hükümleri” iken, 17/4/2008 tarihli ve 5754 sayılı Kanunun 65 inci maddesiyle metne işlendiği şekilde değiştirilmiştir. 25 25/4/2013 tarihli ve 6462 sayılı Kanunun 1 inci maddesiyle, bu bentte yer alan “özüre uğratan” ibaresi “engelli hâle getiren” şeklinde değiştirilmiştir. 24 maddenin uygulanmasına ilişkin usûl ve esaslar, Kurum tarafından çıkarılacak yönetmelikle düzenlenir. Meslek hastalığının tanımı, bildirilmesi ve soruşturulması"}],"hakem":"Doğru sık (C), 5510 s.k. m.13/1-c\u0027de yer alan iş kazası hâliyle birebir örtüşmektedir."},"kayitlar":[],"sade":{"siklar":{"D":"Kanun yalnız mevzuat gereği ayrılan resmi süt iznini korur. Bu sürenin bitiminden sonra çalışanın kendi isteğiyle kaldığı ek zaman iş kazası kapsamına girmez.","E":"Gidiş-geliş kazaları yalnız işveren tarafından sağlanan taşıtlar için sayılır. Sigortalının kendi taşıtıyla yapılan gidiş-geliş bu hükmün dışında kalır.","A":"Sigortalı işyeri dışında özel işini yaparken kazaya uğrasa bile, kanun iş kazasını işyerinde bulunma şartını arar. Özel iş amaçlı işyeri dışında olunması bu kapsamdan çıkarır.","B":"Bağımsız çalışan için kanun işverenin yürütmekte olduğu işle bağlantı ister. Dinlenme amacıyla gidilen yerde olay işin kendisiyle ilişkili olmadığından iş kazası sayılmaz."},"dogru":"İşveren tarafından başka bir yere görevlendirilirken, asıl işi yapmayan süreler iş kazası sayılır. Diğer seçeneklerde ya işle ilgisiz aktiviteler ya da kendi sağlanan olmayan araçlar söz konusu olduğundan kapsam dışındadır.","sinav":"5510 Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 13. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 13. madde","tanim":"Sigortalının belirli durumlarda maruz kaldığı ve onu bedenen ya da ruhen engelli hâle getiren olay. Kanun iş kazasının hangi koşullarda sayılacağını sırayla açıklar.","ad":"İş kazası"},{"kaynak":"5510 s. SGK Kanunu 13. madde","tanim":"Bir işverene bağlı çalışanın, işveren tarafından işyeri dışında başka bir yere gönderilmesi durumu. Bu sırada asıl işini yapmayan zaman iş kazası kapsamına girer.","ad":"Görevli olarak işyeri dışında gönderilme"},{"kaynak":"5510 s. SGK Kanunu 13. madde","tanim":"Sigortalıyı hemen veya sonradan bedensel ya da ruhsal engelliliğe yol açan olay. İş kazasının tanımında bu sonucun meydana gelmesi zorunlu koşuldur.","ad":"Engelli hâle getiren olay"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027nun 13 üncü maddesine göre aşağıdaki hâllerden hangisi iş kazası sayılır?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-34","verilenler":[{"deger":"13","anlam":"İş kazası tanımının ve kapsamının yer aldığı kanun maddesinin numarası.","ad":"Madde numarası"}],"dayanak":"5510 sayılı Kanun m.13/1","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027daki bir mobilya fabrikasının işçisi Kemal, 3 Mart günü İzmir\u0027deki bayiye montaj için görevlendiriliyor. Kemal İzmir\u0027e vardığında henüz montaja başlamadan, bayinin deposunda beklerken bir raf üzerine düşüyor ve kolu kırılıyor.","anlatim":"Kemal o an fabrikadaki asıl işini yapmıyor, sadece görevli gönderildiği yerde bekliyor. Bu olay üzerinden beş ihtimali tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanun m.13\u0027te beş hâl sayılmış: işyerinde olma, bağımsız çalışanın işi nedeniyle olma, görevli gönderilip asıl işi yapmama, süt izni, işverenin sağladığı taşıtla gidiş geliş.","anlatim":"Kemal\u0027in kolu kırılması hangi bende girer, hangileri girmez, bunu göreceğiz. Şimdi beş ifadeyi bu olayda tek tek deneyelim.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.13/1-a","karar":"yanlış","anlatim":"Burada Kemal işyerinde değil, kendi özel işini görüyor. Kanun yalnız işyerinde bulunma hâlini sayıyor, bu durum ona girmiyor.","formul":"Şık A: Kemal, İzmir\u0027e gitmişken kendi özel eşyasını almak için çarşıya çıksa ve orada düşse, bunu iş kazası sayar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.13/1-b","karar":"yanlış","anlatim":"Bağımsız çalışanda kural, olayın yürüttüğü iş nedeniyle olmasını arar. Dinlenme sırasında olan, işle bağı olmayan olay bu bendin dışında kalır.","formul":"Şık B: Kemal bağımsız çalışan olsaydı ve İzmir\u0027de işiyle hiç ilgisi olmayan bir dinlenme yerinde kaza geçirseydi, iş kazası olur muydu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.13/1-c","karar":"doğru","anlatim":"Kanun tam olarak bu durumu tarif ediyor, görevli gönderilme ve asıl işini yapmaksızın geçen zaman. Kemal\u0027in olayı bu tarife birebir uyuyor.","formul":"Şık C: Kemal işverene bağlı çalışıyor, görevli olarak İzmir\u0027e gönderilmiş ve asıl işini henüz yapmadan beklerken düşmüş, bunu iş kazası sayar mısın?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.13/1-d","karar":"yanlış","anlatim":"Kanun yalnız iş mevzuatının tanıdığı süt izni süresini kapsıyor. İznin dışına taşan, kendi isteğiyle uzatılan süre bu bende girmiyor.","formul":"Şık D: Kemal\u0027in eşi de aynı fabrikada çalışan emziren bir işçi, süt izni bitmiş ama o kendi isteğiyle izni uzatmış ve o sırada kaza geçirmiş, bunu sayar mısın?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.13/1-e","karar":"yanlış","anlatim":"Kanun işverenin sağladığı taşıtla gidiş gelişi arıyor. Kemal kendi taşıtını kullandığı için bu bent onu kapsamıyor.","formul":"Şık E: Kemal kendi arabasıyla İzmir\u0027e gitseydi ve yolda kaza geçirseydi, bunu iş kazası sayar mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Kemal\u0027in olayı sadece görevli gönderilip asıl işini yapmadığı zaman dilimine uyduğu için iş kazasıdır. Kendine hep şunu sor: olay tam olarak hangi bendin kelimelerine harfiyen uyuyor?","doldur":[]}],"anahtar":[{"ornek":"görevli","kok":"görevl"},{"ornek":"gönderilen","kok":"gönder"},{"ornek":"kazası","kok":"kazası"},{"ornek":"bendin","kok":"bendin"},{"ornek":"işyeri","kok":"işyeri"},{"ornek":"sadece","kok":"sadece"}],"konuGiris":{"harita":"Ne zaman test edilir: olay hangi hâlde meydana geldiği sorulduğunda test edilir. Nasıl ölçülür: olayın kanunda sayılan beş hâlden birine uyup uymadığına bakılarak ölçülür. Nasıl kaydedilir: iş kazası ve meslek hastalığı bildirgesiyle Kuruma bildirilerek kaydedilir.","desen":"Soru genelde beş hâlden birini seçenek yapıp, kişisel araçla veya işle ilgisiz zamanda olan olayları çeldirici olarak sunar. Tuzak, işveren taşıtı ile kişisel taşıt arasındaki farkı karıştırmaktır. Bu soru m.13\u0027teki iş kazası hâlleri listesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Sigortalının işyerinde bulunduğu sırada meydana gelen olay","ad":"İşyerinde bulunma hâli","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Başka yere görevli gönderilen sigortalının o sürede yaşadığı olay","ad":"Görevli gönderilme hâli","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Süt izni sırasında meydana gelen olayın kaza sayılması","ad":"Emziren kadın izni hâli","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İşverenin sağladığı taşıtla işe gidiş dönüş sırasında olan olay","ad":"İşveren taşıtıyla gidiş geliş hâli","kim":"kanun sabitler"}],"sinavda":"Sınavda bir olay senaryosu verilir ve bunun iş kazası sayılıp sayılmadığı sorulur.","panel_ornek":"Bir kurye, işvereninin verdiği motosikletle depodan eve dönerken küçük bir kazaya karışıyor. Bu, iş için ayrılan araçla yol sırasında olduğu için iş kazası sayılır, tıpkı örneğin 15 dakikalık teslimat molası gibi işin bir parçasıdır. Oysa kuryenin akşam kendi arabasıyla arkadaşını gezdirirken yaptığı kaza bu kapsama girmez.","ornek":"Bir kurye, işvereninin verdiği motosikletle depodan eve dönerken küçük bir kazaya karışıyor. Bu, iş için ayrılan araçla yol sırasında olduğu için iş kazası sayılır, tıpkı örneğin 15 dakikalık teslimat molası gibi işin bir parçasıdır. Oysa kuryenin akşam kendi arabasıyla arkadaşını gezdirirken yaptığı kaza bu kapsama girmez.","yontemler":"Olayın beş hâlden hangisine girdiğini tek tek elemeyle bulmak en güvenli yöntemdir.","nedir":"İş kazası sayılan haller, sigortalının hangi durumlarda uğradığı olayın kaza sayılıp sağlık ve tazminat haklarını doğuracağını belirler. Sınav bu hallerin kanunda sayılan beş duruma uyup uymadığını ölçer."},"olay":"","tuzak":{"D":{"ad":"Süt İzni Kapsamı Tuzağı","metin":"Öğrenci emziren kadına tanınan her serbest zamanı kapsar sanır, oysa kanun yalnız mevzuat gereği ayrılan süt iznini kapsar. Doğrusu: iznin bitiminden sonraki gönüllü süre bu bende girmez."},"E":{"ad":"Taşıt Kaynağı Tuzağı","metin":"Öğrenci her işe gidiş-geliş kazasını kapsar sanır, kanun ise işverence sağlanan taşıtı şart koşar. Doğrusu: sigortalının kendi taşıtıyla yaptığı gidiş-geliş bu bent dışındadır."},"A":{"ad":"İşyeri Dışı Tuzağı","metin":"Öğrenci \u0027işyeri dışında olsa da olay çalışırken oldu\u0027 diye düşünür, oysa madde bu bentte sigortalının işyerinde bulunmasını şart koşar. Doğrusu: özel işle işyeri dışında bulunma bu bent kapsamına girmez."},"B":{"ad":"İş Bağı Tuzağı","metin":"Öğrenci bağımsız çalışanın her hâlini iş kazası sanır, ancak kanun yürütülmekte olan iş nedeniyle olmasını arar. Doğrusu: işle ilgisiz dinlenme zamanı iş kazası sayılmaz."}},"celdiriciYol":{"D":"m.13/1-d\u0027deki \u0027iş mevzuatı gereğince ayrılan süt izni\u0027 süresi, izin bitiminden sonraki gönüllü süreyle değiştirilmiştir (süre sınırı genişletilmiştir).","E":"m.13/1-e\u0027deki \u0027işverence sağlanan taşıt\u0027 unsuru \u0027kendi temin ettiği taşıt\u0027 ile değiştirilmiştir (taşıtın kaynağı unsuru ters çevrilmiştir).","A":"m.13/1-a\u0027daki \u0027işyerinde bulunduğu sırada\u0027 şartı yerine \u0027işyeri dışında özel iş\u0027 yazılmıştır (bent şartının yer unsuru değiştirilmiştir).","B":"m.13/1-b\u0027deki \u0027iş nedeniyle\u0027 bağı çıkarılıp yalnız bağımsız çalışma sıfatı bırakılmıştır (nedensellik unsuru atlanmıştır)."},"hap":"İş kazası sayılan haller 5510 sayılı Kanunun 13 üncü maddesinde beş bent halinde sayılmıştır; her bendin kendine özgü yer, neden ya da araç şartı vardır.","teshis":{"C":{"gercek":"m.13/1-c, işverene bağlı sigortalının görevli gönderildiği yerde asıl işini yapmaksızın geçen zamanı açıkça iş kazası hâli sayar.","ayirt":"Sigortalı görevli mi gönderildi ve asıl işini yapmıyor muydu?","paragraf":"5510 s.K. m.13/1-c","yanilgi":"Bu bendin görevlendirme ile asıl iş dışı zaman şartını gözden kaçırıp genel bir \u0027iş dışı olay\u0027 sanabilirsin."},"E":{"gercek":"m.13/1-e işverence sağlanan taşıtla gidiş-gelişi arar; sigortalının kendi taşıtı bu bende girmez.","ayirt":"Taşıtı işveren mi sağladı, yoksa sigortalı kendi mi temin etti?","paragraf":"5510 s.K. m.13/1-e","yanilgi":"Taşıtın kim tarafından sağlandığına bakmaksızın işe gidiş-gelişi otomatik kapsıyorsun."},"A":{"gercek":"m.13/1-a yalnız sigortalının işyerinde bulunduğu sırada meydana gelen olayı kapsar.","ayirt":"Olay işyerinde mi, yoksa dışarıda kendi işiyle mi meydana geldi?","paragraf":"5510 s.K. m.13/1-a","yanilgi":"İşyeri dışında olsa da çalışma amacıyla orada bulunmayı yeterli sayıyorsun."},"D":{"gercek":"m.13/1-d yalnız iş mevzuatı gereği ayrılan süt iznini kapsar, iznin dışına taşan süre kapsam dışıdır.","ayirt":"Bu süre mevzuatın tanıdığı süt izni süresi içinde mi?","paragraf":"5510 s.K. m.13/1-d","yanilgi":"Süt izni bitince de o zaman dilimini kanuni izin kapsamında sanıyorsun."},"B":{"gercek":"m.13/1-b yürütülmekte olan iş nedeniyle geçirilen olayı arar, işle ilgisiz zamanı kapsamaz.","ayirt":"Olay yürütülen işle nedensellik bağı taşıyor mu?","paragraf":"5510 s.K. m.13/1-b","yanilgi":"Bağımsız çalışanın her zaman diliminde geçirdiği olayı iş kazası sanıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 108"},"kural":"İş Kanununun 18 inci maddesine göre sendika üyeliği geçerli fesih sebebi oluşturmaz (I doğru), ancak işyeri sendika temsilciliği yapmak da aynı bentte geçerli fesih sebebi sayılmaz, dolayısıyla II yanlıştır; 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendine göre sendika ve konfederasyon başkanlıkları ile yönetim kurullarına seçilenler bu bent kapsamında sigortalı sayılır (III doğru); aynı maddenin üçüncü fıkrasının (c) bendine göre (c) bendi kapsamındaki kişilerin kurduğu sendika ve konfederasyonların başkanlık ve yönetim kuruluna seçilip aylıksız izne ayrılanlar hakkında da (c) bendi hükümleri uygulanır (IV doğru); İş Kanununun 5 inci maddesine göre ispat yükü kural olarak işçidedir ancak işçi güçlü bir ihtimali ortaya koyarsa ispat yükü işverene geçer, bu nedenle V yanlıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 108","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Çoklu önermeli sorularda önce her roman rakamını TEK BAŞINA hangi maddeye bağladığını yaz, sonra şıklara bak; kombinasyon şıkları seni yanıltmasın.","konu":"sendika üyeliği","tablo":{"satirlar":[["A) I ve III","m.18","doğru ifade"],["B) II ve IV","m.18","YANLIŞ ifade"],["C) I, III ve IV","m.4/1-a","doğru ifade"],["D) II, III ve V","m.4/3-c","doğru ifade"],["E) I, IV ve V","m.5","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"I, III ve IV","E":"I, IV ve V","A":"I ve III","D":"II, III ve V","B":"II ve IV"},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.5","metin":"Madde 5 – (Ek: 6/2/2014-6518/57 md.) İş ilişkisinde dil, ırk, renk, cinsiyet, engellilik, siyasal düşünce, felsefî inanç, din ve mezhep ve benzeri sebeplere dayalı ayrım yapılamaz. İşveren, esaslı sebepler olmadıkça tam süreli çalışan işçi karşısında kısmî süreli çalışan işçiye, belirsiz süreli çalışan işçi karşısında belirli süreli çalışan işçiye farklı işlem yapamaz. İşveren, biyolojik veya işin niteliğine ilişkin sebepler zorunlu kılmadıkça, bir işçiye, iş sözleşmesinin yapılmasında, şartlarının oluşturulmasında, uygulanmasında ve sona ermesinde, cinsiyet veya gebelik nedeniyle doğrudan veya dolaylı farklı işlem yapamaz. Aynı veya eşit değerde bir iş için cinsiyet nedeniyle daha düşük ücret kararlaştırılamaz. İşçinin cinsiyeti nedeniyle özel koruyucu hükümlerin uygulanması, daha düşük bir ücretin uygulanmasını haklı kılmaz. İş ilişkisinde veya sona ermesinde yukarıdaki fıkra hükümlerine aykırı davranıldığında işçi, dört aya kadar ücreti tutarındaki uygun bir tazminattan başka yoksun bırakıldığı haklarını da talep edebilir. 2821 sayılı Sendikalar Kanununun 31 inci maddesi hükümleri saklıdır. 20 nci madde hükümleri saklı kalmak üzere işverenin yukarıdaki fıkra hükümlerine aykırı davrandığını işçi ispat etmekle yükümlüdür. Ancak, işçi bir ihlalin varlığı ihtimalini güçlü bir biçimde gösteren bir durumu ortaya koyduğunda, işveren böyle bir ihlalin mevcut olmadığını ispat etmekle yükümlü olur. İşyerinin veya bir bölümünün devri"},{"ad":"İş K. (4857 s.K.) m.18 [1/2]","metin":"Madde 18 - Otuz veya daha fazla işçi çalıştıran işyerlerinde en az altı aylık kıdemi olan işçinin belirsiz süreli iş sözleşmesini fesheden işveren, işçinin yeterliliğinden veya davranışlarından ya da işletmenin, işyerinin veya işin gereklerinden kaynaklanan geçerli bir sebebe dayanmak zorundadır. (Ek cümle: 10/9/2014-6552/2 md.) Yer altı işlerinde çalışan işçilerde kıdem şartı aranmaz. Altı aylık kıdem hesabında bu Kanunun 66 ncı maddesindeki süreler dikkate alınır. Özellikle aşağıdaki hususlar fesih için geçerli bir sebep oluşturmaz: a) Sendika üyeliği veya çalışma saatleri dışında veya işverenin rızası ile çalışma saatleri içinde sendikal faaliyetlere katılmak. b) İşyeri sendika temsilciliği yapmak. c) Mevzuattan veya sözleşmeden doğan haklarını takip veya yükümlülüklerini yerine getirmek için işveren aleyhine idari veya adli makamlara başvurmak veya bu hususta başlatılmış sürece katılmak.6 d) Irk, renk, cinsiyet, medeni hal, aile yükümlülükleri, hamilelik, doğum, din, siyasi görüş ve benzeri nedenler. e) 74 üncü maddede öngörülen ve kadın işçilerin çalıştırılmasının yasak olduğu sürelerde işe gelmemek. f) Hastalık veya kaza nedeniyle 25 inci maddenin (I) numaralı bendinin (b) alt bendinde öngörülen bekleme süresinde işe geçici devamsızlık. İşçinin altı aylık kıdemi, aynı işverenin bir veya değişik işyerlerinde geçen süreler birleştirilerek hesap edilir. İşverenin aynı işkolunda birden fazla işyerinin bulunması halinde, işyerinde çalışan işçi sayısı, bu işyerlerinde çalışan toplam işçi sayısına göre belirlenir."}],"hakem":"Sorunun doğru sıkkı (I, II // 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}

      const yolH='<div class="yol"><div class="yolCip">'+s.adimlar.map((x,q)=>'<span class="yc '+(q<j?'gecti':(q===j?'simdi':(q===hedefIdx?'hedef':'')))+'" title="'+esc(adimBaslik(x))+'">'+(q===hedefIdx&&q!==j?'🏁':(q+1))+'</span>').join('<span class="ycb"></span>')+'<span class="yolAd">'+esc(adimBaslik(a))+'</span></div>'
        +(a.giris?('<div class="neden">'+(((s.teori||(s.tablo&&s.tablo.basliklar&&s.tablo.basliklar[0]==='Adım')))
            ?'Önce konunun haritası: nedir, sınav nasıl sorar. Sonra kural, sonra şıklar kuralla tek tek sınanır; en sonda senin seçimin.'   // 07.09 Ö55(2): teori cümlesi (hesap kalıbı "verilenler, hesap, ters durum" teori soruda anlamsızdı)
            :'Önce konunun haritası: nedir, sınav ne sorar, hangi yöntem ne zaman. Sonra sorunun verilenleri, sonra hesap; hedef <b>'+esc(sonBas)+'</b>.')+'</div>')
          :(verilenAdimMi&&s.verilenler&&s.verilenler.length)?'<div class="neden">Önce elimizdekileri tanıyoruz: <b>'+s.verilenler.length+' verilen</b>. Hesap bloğundaki her satır bunlardan kurulacak; hedef <b>'+esc(sonBas)+'</b>.</div>'
          :son?'<div class="neden">Hedefe ulaştık: <b>'+esc(sonBas)+'</b>. Şimdi aynı yolu sen yürü.</div>'
          :(j>=hedefIdx?'<div class="neden">Hedef bulundu (<b>'+esc(sonBas)+'</b>). '+(a.kisi?'Bu adım <b>senin seçtiğin şıkkın</b> neden yanlış olduğunu gösterir.':'Bu adım, adayların en sık düştüğü yanlış yolu gösterir.')+'</div>'
          :(j+1===hedefIdx?'<div class="neden">Bu adım niye var? Burada bulduğumuz değer doğrudan hedefe götürür: sıradaki adım <b>'+esc(sonBas)+'</b>.</div>'
          :'<div class="neden">Bu adım niye var? Burada bulduğumuz değer sıradaki adımda (<b>'+esc(sonrakiBas)+'</b>) kullanılacak; hedef <b>'+esc(sonBas)+'</b>.</div>')))+'</div>';
      serit.innerHTML='<div class="adimK'+(son?' sonAdim':'')+(yon<0?' geri':'')+'"><div class="say"><span>ADIM '+(j+1)+' / '+s.adimlar.length+'</span><span class="baslik">'+esc(adimBaslik(a))+'</span></div><code class="mat0">'+fH+'</code><p>'+anlatimH+'</p>'+yolH+sonBtn+'</div>';
      // Cem 04.09 "numaralara basarak sayfa değiştirsek": yol haritası yuvarlakları tıklanınca o adıma gider
      serit.querySelectorAll('.yc').forEach((el,q)=>el.addEventListener('click',()=>adimGit(q-adimNo)));
      const bo=serit.querySelector('.bDersOyun'); if(bo){ bo.addEventListener('click',()=>{ ders.classList.remove('acik'); oyunKur(); oyun.classList.add('acik'); }); }
      const bb=serit.querySelector('.bDersBitti'); if(bb){ bb.addEventListener('click',()=>{ ders.classList.remove('acik'); const cA=k.querySelector('.cAnlat'); if(cA){ if(cA.offsetParent===null){ const bd=k.querySelector('.bDaha'); if(bd) bd.click(); } cA.click(); const ta=k.querySelector('.anlatK'); if(ta) setTimeout(()=>ta.focus(),200); } }); }
      // tablo: bu adimin hucreleri acilir ve yanar; onceki adimlarda acilanlar acik kalir
      tabloSar.querySelectorAll('td.vurgu,td.kaynakH').forEach(td=>{ td.classList.remove('vurgu'); td.classList.remove('kaynakH'); }); tabloSar.querySelectorAll('tr.kayit.vurguS').forEach(tr=>tr.classList.remove('vurguS'));
      // 06.09 Cem "5'ten 3'e dönünce 5'in cevabı kalıyor": açık hücre kümesi her adımda 0..j'den YENİDEN kurulur; geri gidince sonraki adımların hücresi tekrar kapanır
      acilan.clear(); for(let q=0;q<=j;q++){ (s.adimlar[q].doldur||[]).forEach(p=>acilan.add(p[0]+','+p[1])); }
      kaynakH.forEach(k=>acilan.add(k));   // formülde kullanılan hücre görünür olmalı
      if(son&&s.tablo){ s.tablo.satirlar.forEach((st,r)=>st.forEach((c,ci)=>{ if(ci>0) acilan.add(r+','+ci); })); }
      tabloSar.querySelectorAll('td[data-r]').forEach(td=>{ const key=td.dataset.r+','+td.dataset.c; if(acilan.has(key)){ if(td.classList.contains('gizliH')){ td.classList.remove('gizliH'); td.classList.add('acildi'); } } else if(td.classList.contains('acildi')){ td.classList.add('gizliH'); td.classList.remove('acildi'); } });
      (a.doldur||[]).forEach(p=>{ const td=tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]'); if(td) td.classList.add('vurgu'); });
      // 05.09 Cem "%80 çıktığını o rakamı tabloya doldurduğumuzu göstersek": sonuç formülden tablodaki hücreye UÇAR
      // 05.09 Cem "bir anda çözümler geliyor, sırayla çözüyor gibi yapsa": adımda birden çok hesap varsa formül kutuları
      // SIRAYLA belirir (900 ms arayla), her kutunun sonucu belirince kendi hücresine uçar; hücre uçuş bitene dek boş kalır.
      if(yon>=0&&j>0&&!verilenAdimMi&&!a.giris){
        const mats=[...serit.querySelectorAll('.mat')]; const hedefler=(a.doldur||[]).map(p=>tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]')).filter(Boolean);
        const cokKutu=mats.length>1; const adimBu=j;
        hedefler.forEach(td=>td.classList.add('bekliyor'));
        mats.forEach((m,q)=>{ if(q>0&&cokKutu){ m.classList.add('gizliMat'); } });
        hedefler.forEach((td,pi)=>{ const kaynakM=mats[Math.min(pi,Math.max(0,mats.length-1))]; const gecikme=cokKutu?pi*900:pi*120;
          setTimeout(()=>{ if(adimNo!==adimBu||!document.body.contains(td)){ td.classList.remove('bekliyor'); return; }
            if(kaynakM){ kaynakM.classList.remove('gizliMat'); kaynakM.classList.add('geldi'); }
            const kaynakEl=kaynakM?kaynakM.querySelector('.matSonuc'):null; const from=kaynakEl?kaynakEl.getBoundingClientRect():null, to=td.getBoundingClientRect();
            if(!from||!from.width||!to.width){ td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); return; }
            const u=document.createElement('div'); u.className='ucan'; u.textContent=td.textContent.trim()||kaynakEl.textContent.trim(); document.body.appendChild(u); u.style.left=from.left+'px'; u.style.top=from.top+'px';
            requestAnimationFrame(()=>{ u.style.transform='translate('+(to.left-from.left)+'px,'+(to.top-from.top)+'px) scale(.85)'; u.style.opacity='0.15'; });
            setTimeout(()=>{ u.remove(); td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); },650); }, gecikme); });
        // hedefi olmayan fazladan kutular da sırayla gelsin
        mats.forEach((m,q)=>{ if(q>=hedefler.length&&m.classList.contains('gizliMat')){ setTimeout(()=>{ if(adimNo===adimBu){ m.classList.remove('gizliMat'); m.classList.add('geldi'); } }, q*900); } });
      }
      kaynakH.forEach(k=>{ const [r,c]=k.split(','); const td=tabloSar.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]'); if(td) td.classList.add('kaynakH'); });
      // 06.09: VERİLENLER bloğu Adım 1'den sonra katlanır; bu adımın formülünde kullanılan verilen satırı açık kalır (mavi), başlık tıklanınca hepsi açılır
      tabloSar.querySelectorAll('tr.vblok').forEach(tr=>{ const td=tr.querySelector('td[data-r]'); const key=td?td.dataset.r+','+td.dataset.c:''; tr.classList.toggle('katli', j>0 && !kaynakH.has(key) && !hedef.has(key)); });
      let lej=tabloSar.querySelector('.lejant'); if(!lej){ lej=document.createElement('div'); lej.className='lejant'; tabloSar.appendChild(lej); }
      lej.innerHTML=kaynakH.size?'<i class="m"></i>nereden geldi <i class="a"></i>bu adımda bulundu':(hedef.size?'<i class="a"></i>bu adımda bulundu':''); lej.style.display=lej.innerHTML?'block':'none';
      // kayit satirlari: adimda anilan hesap kodu (uc hane; "100.000" icindeki 100 sayilmaz)
      const kodOf=x=>new Set([...(String(x.formul)+' '+String(x.anlatim)).matchAll(/(?<![\d.,])(\d{3})(?![\d.,]|\s*(?:TL|%|adet|gün|yıl|ay))/g)].map(m=>m[1]));
      const kodlar=kodOf(a);
      // gösterilen kayıt satırları da 0..j'den yeniden kurulur (geri gidince sonraki adımın satırı gizlenir)
      gosterilen.clear(); for(let q=0;q<=j;q++){ kodOf(s.adimlar[q]).forEach(c=>gosterilen.add(c)); }
      tabloSar.querySelectorAll('tr.kayit[data-kod]').forEach(tr=>{ const k2=tr.dataset.kod; const an=k2&&kodlar.has(k2); if(son){ gosterilen.add(k2); } tr.classList.toggle('goster',gosterilen.has(k2)); tr.classList.toggle('vurguS',!!an); });
      tabloSar.querySelectorAll('tr.ara').forEach(ara=>{ const gi=ara.dataset.grp; ara.classList.toggle('goster',[...tabloSar.querySelectorAll('tr.kayit[data-kod][data-grp="'+gi+'"]')].some(tr=>tr.classList.contains('goster'))); });
      adimBar.querySelectorAll('i').forEach(n=>{ const q=parseInt(n.dataset.j); n.classList.toggle('simdi',q===j); n.classList.toggle('gecti',q<j); });
      bOnce.disabled=(j===0); bSonra.disabled=son; bSonra.textContent=son?'Bitti ✓':'İleri ▶';
      const vurgu=tabloSar.querySelector('td.vurgu, tr.vurguS'); if(vurgu) vurgu.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    const adimGit=d=>{ const cur=s.adimlar[adimNo]; if(d>0&&cur&&tahminGerek(cur,adimNo,adimNo===s.adimlar.length-1)&&serit.querySelector('.tahminK')){ tahmin[adimNo]={atla:true}; adimGoster(adimNo,1); return; }   // 06.09: tahmin ekranında ileri = "göster"
      const j=Math.min(s.adimlar.length-1,Math.max(0,adimNo+d)); if(j===adimNo) return; adimGoster(j,d); };
    bOnce.addEventListener('click',()=>adimGit(-1)); bSonra.addEventListener('click',()=>adimGit(1));
    // fare tekerlegi, klavye oklari, parmakla yatay kaydirma (sola = ileri)
    let tekerKilit=0; serit.addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-tekerKilit<350) return; tekerKilit=t; adimGit((e.deltaY||e.deltaX)>0?1:-1); },{passive:false});
    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});

son.innerHTML='<div class="ust"><span>Nöbet bitti</span>'+noktalar(-1)+'<span>&nbsp;</span></div><div class="govde son" style="display:flex;flex-direction:column;justify-content:center"><div id="sonSkor"></div></div>';
akis.appendChild(son);
document.querySelectorAll('.skorCip,.kutuCip').forEach(b=>b.addEventListener('click',kutuEkraniAc)); skorCiz();
if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i').forEach(n=>n.classList.toggle('simdi',n.dataset.j==String(i)||(i>=SORULAR.length&&n.dataset.j==='son')));
  if(i<SORULAR.length&&durum.cevap[i]===undefined&&!durum.t0[i]) durum.t0[i]=Date.now();   // 06.09: karta gelince süre başlar
  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='PageDown'){ akis.scrollBy({top:akis.clientHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='PageUp'){ akis.scrollBy({top:-akis.clientHeight,behavior:'smooth'}); } });
