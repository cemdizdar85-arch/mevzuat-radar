kalır. Yeni sahip sırf devir oldu diye kasiyeri kovamaz. Bu, gerçek hayattaki devir mantığının aynısı.","yontemler":"Her önermeyi madde 6 metnindeki cümlelerle birebir karşılaştır; \u0027devreden\u0027 ile \u0027devralan\u0027 kelimelerinin yer değiştirip değiştirmediğine dikkat et.","nedir":"İşyeri devri, bir işyerinin başka bir işverene hukuki işlemle geçmesinde işçi haklarının akıbetini düzenler. Sınav, hangi hakların devralana geçtiğini ve sorumluluk sınırlarını bilip bilmediğini ölçer."},"olay":"I doğru, II doğru, III yanlış (esas alınan tarih devreden yanındaki işe başlama tarihidir), IV doğru, V yanlış (iflas halinde m.6 uygulanmaz).","tuzak":{"C":{"ad":"İstisna Atlama Tuzağı","metin":"V önermesi, iflas dolayısıyla malvarlığının tasfiyesi sonucu işyeri devrinde madde 6 hükümlerinin uygulanmayacağını gözden kaçırır; ayrıca III de hatalı tarih esasını içerir, bu nedenle kombinasyon yanlıştır."},"E":{"ad":"Çoğunluk Yanlış Tuzağı","metin":"bu kombinasyon III ve V gibi iki hatalı önermeyi birlikte doğru sayar; III\u0027te tarih esası ters kurulmuş, V\u0027te ise kanunun açıkça dışladığı iflas istisnası atlanmıştır."},"D":{"ad":"Tek Doğru Sanma Tuzağı","metin":"II ve IV doğru olsa da V önermesindeki \u0027iflas halinde de m.6 uygulanır\u0027 ifadesi kanundaki açık istisnayı görmezden gelir; iflasla malvarlığı tasfiyesinde madde 6 hükümleri uygulanmaz."},"A":{"ad":"Sıra Karıştırma Tuzağı","metin":"III önermesinde hizmet süresine bağlı haklarda esas alınacak tarih devralan yanında işe başlama değil, devreden yanında işe başlama tarihidir; bu ifade yanlış olduğu için doğru kombinasyona giremez."}},"celdiriciYol":{"C":"III ve V önermeleri birlikte doğru sayılırsa bu kombinasyon çıkar (hem tarih esası hem iflas istisnası atlandı)","E":"III ve V yanlış önermeleri IV ile birlikte doğru sayılırsa bu kombinasyon çıkar (iki farklı hata aynı şıkta birleşti)","D":"V önermesindeki iflas istisnası görmezden gelinip II, IV, V doğru sanılırsa bu kombinasyon çıkar (istisna fıkrası atlandı)","A":"III önermesi \u0027devralan yanında işe başlama tarihi\u0027 şeklinde okunursa doğru sanılır (tarih esası ters çevrildi)"},"hap":"İşyeri devrinde iş sözleşmeleri bütün hak ve borçlarıyla devralana geçer, kıdeme bağlı haklarda devreden yanındaki başlama tarihi esas alınır, devredenin sorumluluğu iki yılla sınırlıdır ve devir tek başına fesih sebebi oluşturmaz; iflas tasfiyesi sonucu devirlerde bu hükümler uygulanmaz.","teshis":{"C":{"gercek":"m.6 son fıkra, iflas dolayısıyla malvarlığının tasfiyesi sonucu işyeri devrinde bu hükümlerin uygulanmayacağını açıkça belirtir.","ayirt":"Bu devir, iflas tasfiyesi sonucu mu gerçekleşiyor; eğer öyleyse madde 6 hâlâ uygulanır mı?","paragraf":"m.6/son","yanilgi":"Devir hükümlerinin istisnasız her devir türünde, iflas tasfiyesinde dahi uygulandığını düşünüyorsun."},"E":{"gercek":"III\u0027te esas alınan tarih devreden yanındaki başlama tarihidir, V\u0027te ise iflas tasfiyesi m.6 kapsamı dışındadır; ikisi de yanlıştır.","ayirt":"Bu iki önermenin her biri madde metninin hangi kelimesini tersine çeviriyor?","paragraf":"m.6/2, m.6/son","yanilgi":"Doğru önermeleri elerken hem tarih esasını hem iflas istisnasını yanlış hatırlayıp geriye sadece IV\u0027ü doğru bırakmaya çalışıyorsun ama III ve V\u0027i de doğru sayıyorsun."},"A":{"gercek":"İş Kanunu m.6/2 fıkrasına göre devralan işveren, işçinin devreden işveren yanında işe başladığı tarihe göre işlem yapmakla yükümlüdür.","ayirt":"Kıdeme bağlı hak hesabında hangi işveren yanındaki tarih esas alınır, devreden mi devralan mı?","paragraf":"m.6/2","yanilgi":"Hizmet süresine bağlı hakların hesabında devralan işverenin yanındaki başlama tarihinin esas alındığını düşünüyorsun."},"D":{"gercek":"m.6 son fıkrası iflas nedeniyle malvarlığı tasfiyesi sonucu gerçekleşen devirleri madde 6 kapsamı dışında bırakır.","ayirt":"Devir, normal hukuki işlemle mi yoksa iflas tasfiyesiyle mi gerçekleşmiş?","paragraf":"m.6/son","yanilgi":"Kanunun devir hükümlerini istisnasız uyguladığını, iflas halinin ayrık tutulmadığını sanıyorsun."},"B":{"gercek":"m.6 fıkraları I, II ve IV önermelerini birebir doğrular: sözleşmeler bütün hak ve borçlarıyla geçer, devredenin sorumluluğu iki yılla sınırlıdır, sırf devir nedeniyle fesih yapılamaz.","ayirt":"Bu önerme maddenin lafzıyla birebir örtüşüyor mu, yoksa bir kelime değiştirilmiş mi?","paragraf":"m.6/1,3,5","yanilgi":"Bu şıkkı eleyen öğrenci, iki yıllık sorumluluk sınırının devralan işveren için de geçerli olduğunu düşünerek \u0027birlikte sorumluluk süresiz\u0027 okur ya da devrin doğrudan fesih hakkı doğurduğunu düşünür."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 107"},"kural":"4857 sayılı İş Kanunu m.6 uyarınca devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devreden işveren, devir tarihinden itibaren iki yıl süreyle devralan işverenle birlikte sorumludur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 107","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İşyeri devri sorularında \u0027devir=fesih sebebi\u0027, \u0027rıza aranır\u0027 ve \u0027kıdem sıfırlanır\u0027 cümlelerini otomatik yanlış işaretle; m.6\u0027nın istisnasız iki yıllık sorumluluk kuralını ara.","konu":"işyeri devri-is kanunu","tablo":{"satirlar":[["A) Devralan işveren, işyeri devrini gerekçe göstererek devr…","m.6","YANLIŞ ifade"],["B) Devreden işveren, devirden önce doğmuş ve devir tarihind…","m.6","doğru ifade"],["C) İşyeri devrinde iş sözleşmesinin devralan işverene geçme…","m.6","YANLIŞ ifade"],["D) Ekonomik ve teknolojik sebeplerin gerekli kıldığı fesih …","m.6","YANLIŞ ifade"],["E) İşçinin kıdeme bağlı hakları hesaplanırken yalnızca devr…","m.6","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşyeri devrinde iş sözleşmesinin devralan işverene geçmesi işçinin yazılı rızasına bağlıdır.","E":"İşçinin kıdeme bağlı hakları hesaplanırken yalnızca devralan işveren yanında geçen süre dikkate alınır, devreden işveren yanındaki süre hesaba katılmaz.","A":"Devralan işveren, işyeri devrini gerekçe göstererek devraldığı işçilerin iş sözleşmesini haklı nedenle derhal feshedebilir.","D":"Ekonomik ve teknolojik sebeplerin gerekli kıldığı fesih hakkı yalnız devreden işverene aittir, devralan işveren bu hakkı kullanamaz.","B":"Devreden işveren, devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devir tarihinden itibaren iki yıl süreyle devralan işverenle birlikte sorumludur."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.6","metin":"Madde 6 - İşyeri veya işyerinin bir bölümü hukukî bir işleme dayalı olarak başka birine devredildiğinde, devir tarihinde işyerinde veya bir bölümünde mevcut olan iş sözleşmeleri bütün hak ve borçları ile birlikte devralana geçer. Devralan işveren, işçinin hizmet süresinin esas alındığı haklarda, işçinin devreden işveren yanında işe başladığı tarihe göre işlem yapmakla yükümlüdür. Yukarıdaki hükümlere göre devir halinde, devirden önce doğmuş olan ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren birlikte sorumludurlar. Ancak bu yükümlülüklerden devreden işverenin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır. Tüzel kişiliğin birleşme veya katılma ya da türünün değişmesiyle sona erme halinde birlikte sorumluluk hükümleri uygulanmaz. Devreden veya devralan işveren iş sözleşmesini sırf işyerinin veya işyerinin bir bölümünün devrinden dolayı feshedemez ve devir işçi yönünden fesih için haklı sebep oluşturmaz. Devreden veya devralan işverenin ekonomik ve teknolojik sebeplerin yahut iş organizasyonu değişikliğinin gerekli kıldığı fesih hakları veya işçi ve işverenlerin haklı sebeplerden derhal fesih hakları saklıdır. Yukarıdaki hükümler, iflas dolayısıyla malvarlığının tasfiyesi sonucu işyerinin veya bir bölümünün başkasına devri halinde uygulanmaz. Geçici iş ilişkisi"},{"ad":"TTK (6102 s.K.) m.1192","metin":"MADDE 1192- (1) 1191 inci maddenin birinci fıkrası hükmüne halel gelmemek kaydıyla, bir navlun sözleşmesinde, sözleşmenin konusunu oluşturan bir taşımanın belirli bir kısmının taşıyandan başka bir kişi tarafından gerçekleştirileceğinin öngörülmüş olması durumunda, sözleşmeye, taşımanın ilgili bölümünde taşınan eşya fiilî taşıyanın hâkimiyetinde iken meydana gelecek zıya, hasar veya teslimdeki gecikmeden taşıyanın sorumlu olmayacağına ilişkin şart konabilir; şu kadar ki, sorumluluğu sınırlayan veya ortadan kaldıran bu tür anlaşmalar, yetkili Türk mahkemesinde fiilî taşıyan aleyhine dava açılamadığı hâllerde geçersizdir. Zıyaın, hasarın ve teslimdeki gecikmenin eşya fiilî taşıyanın hâkimiyetinde iken meydana geldiğini ispat yükü, taşıyana aittir. (2) Sorumluluğu sınırlayan veya ortadan kaldıran bir şartın geçerliği, fiilî taşıyanın adı, unvanı ve işyeri adresinin navlun sözleşmesinden anlaşılmasına bağlıdır. Navlun sözleşmesinin yapılması sırasında taşımayı gerçekleştirecek fiilî taşıyan belirlenmemişse, taşıyan, belirlendiği anda ve en geç eşyanın fiilî taşıyana teslimini takiben derhâl gönderilene fiilî taşıyanın adını, unvanını ve işyeri adresini bildirir. Bu bildirim yapılmadığı takdirde, taşıyanın sorumluluğu devam eder. (3) Fiilî taşıyan, eşyanın hâkimi olduğu sırada ortaya çıkan zıyadan, hasardan veya teslimdeki gecikmeden 1191 inci maddenin ikinci fıkrası uyarınca sorumludur. B) Taşıyanın hakları I- Navlun ödenmesini istem hakkı 1. Miktarı a) ölçü, tartı veya sayı üzerine navlun"}],"hakem":"İş Kanunu m.6\u0027da işyeri devrinde devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren birlikte sorumlu olduğu ve devreden işverenin sorumluluğunun devir tarihinden itibaren iki yıl ile sınırlı olduğu açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"İş sözleşmesinin devralana geçişini rıza gerektiren işlemlere benzetebilirsin. Oysa hukuki devirde işçinin rızası aranmaksızın sözleşme bütün hak ve borçlarıyla devralana geçer.","E":"Devrin işçinin kıdemini sıfırladığını, yalnız yeni işverenin yanındaki sürenin sayıldığını düşünebilirsin. Ancak kıdem hesaplanırken işçinin devreden işveren yanında işe başladığı tarih esas alınır.","D":"Ekonomik ve teknolojik fesih hakkının yalnız devreden işverene ait olduğunu sanabilirsin. Gerçekte bu hak hem devreden hem devralan işverene tanınmıştır.","A":"İşyeri devrinin tek başına haklı fesih sebebi olmadığını kaçırırsın. Yasada açıkça işveren devri gerekçe göstererek sözleşmeyi feshedemez."},"dogru":"İşyeri devredildiğinde, devreden işveren devirden önceki borçlardan sorumlu olmaya devam eder. Bu sorumluluk devralan işveren ile paylaşılır, ancak devreden işverenin sorumluluğu devir tarihinden itibaren iki yılla sınırlıdır.","sinav":"İş Kanunu 6. maddeye göre devirden önce doğmuş ve devir tarihinde ödenmesi gereken borçlardan devreden ve devralan işveren birlikte sorumlu olup, devreden işverenin sorumluluğu devir tarihinden itibaren iki yıl ile sınırlıdır.","kavramlar":[{"kaynak":"İş Kanunu 6. madde","tanim":"İşyeri veya bir bölümü başka bir işverene devredilmeden önce ortaya çıkmış ve devir tarihinde ödenmesi gereken borçlardır. Bu borçlardan hem devreden hem devralan işveren sorumludur, ancak devreden işverenin sorumluluğu iki yılla sınırlıdır.","ad":"İşyeri devrinden doğmuş borçlar"},{"kaynak":"İş Kanunu 6. madde","tanim":"İşyeri veya işyerinin bir bölümünün hukuki bir işleme dayalı olarak başka bir kişiye devredilmesi. Devir sırasında devir tarihinde mevcut olan iş sözleşmeleri, işçinin rızası aranmaksızın bütün hak ve borçlarıyla devralana geçer.","ad":"İşyeri devri"},{"kaynak":"İş Kanunu 6. madde","tanim":"İşçinin işyerinde geçirdiği hizmet süresine bağlı olarak kazandığı haklar. İşyeri devrinde bu haklar hesaplanırken işçinin devreden işveren yanında işe başladığı tarih esas alınır.","ad":"Kıdeme bağlı haklar"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"İşyerinin bir bölümü başka bir işverene devredilmiştir. 4857 sayılı İş Kanunu\u0027na göre işyeri devrinin sonuçlarına ilişkin aşağıdaki ifadelerden hangisi her zaman doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-33","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.6","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir tekstil fabrikasının boyahane bölümü, 1 Mart 2023 tarihinde başka bir şirkete devredilir. Devirden önce, 15 Şubat 2023\u0027te muaccel olmuş 40.000 TL tutarında ödenmemiş fazla mesai alacağı vardır. İşçi Ahmet, 12 yıldır bu bölümde çalışmaktadır.","anlatim":"Devreden patron \u0027artık borç bende değil\u0027 diyor, devralan patron \u0027ben yeni geldim, bilmiyorum\u0027 diyor. Ahmet parasını kimden alacağını soruyor.","doldur":[]},{"formul":"Ne yapacağız: 4857 sayılı İş Kanunu m.6, işyeri devrinde iş sözleşmesinin kendiliğinden geçmesini, borçlardan iki yıl müteselsil sorumluluğu ve fesih haklarının saklı kalmasını düzenler. Beş ifadeyi Ahmet\u0027in olayında tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.6","karar":"yanlış","anlatim":"Devir tek başına fesih sebebi olamaz, sadece iş organizasyonundaki gerçek bir değişiklik fesih hakkı doğurur. Devralan patron sırf devri gerekçe gösterip Ahmet\u0027i atamaz. Bu yüzden ifade yanlıştır.","formul":"Şık A: Devralan patron, \u0027ben bu boyahaneyi devraldım, bu yeter, Ahmet\u0027in sözleşmesini haklı nedenle hemen feshedebilirim\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.6","karar":"doğru","anlatim":"Borç devirden önce doğmuş ve devir anında muaccel, tam kanunun aradığı şart bu. Devreden ve devralan, devir tarihinden itibaren iki yıl müteselsilen sorumludur. Ahmet parasını her ikisinden de isteyebilir.","formul":"Şık B: Ahmet, 15 Şubat\u0027taki fazla mesai alacağını hem eski hem yeni patrondan iki yıl boyunca isteyebilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.6","karar":"yanlış","anlatim":"İş sözleşmesi kanun gereği kendiliğinden devralan işverene geçer, işçinin ayrıca rıza vermesine gerek yoktur. Ahmet\u0027in imza atması şart değildir. Bu yüzden ifade yanlıştır.","formul":"Şık C: Devralan patron \u0027Ahmet yazılı olarak bana geçmeyi kabul etmezse sözleşmesi bende sayılmaz\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.6","karar":"yanlış","anlatim":"Ekonomik-teknolojik sebeplerin gerekli kıldığı fesih hakkı hem devredene hem devralana tanınmıştır. Devralan patron bu hakkı kullanabilir. Bu yüzden ifade yanlıştır.","formul":"Şık D: Fabrikada ekonomik kriz çıkar, devralan patron \u0027ekonomik sebeple fesih hakkı sadece eski patronunkiydi, ben kullanamam\u0027 diyor, haklı mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.6","karar":"yanlış","anlatim":"Kıdeme bağlı haklar, işçinin devreden işveren yanında işe başladığı tarihten itibaren kesintisiz hesaplanır. Ahmet\u0027in 12 yılı da hesaba girer. Bu yüzden ifade yanlıştır.","formul":"Şık E: Kıdem tazminatı hesaplanırken Ahmet\u0027in eski patron yanındaki 12 yılı sayılmaz, sadece devirden sonraki süre sayılır mı?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Devirde tek istisnasız kural, borçtan iki yıl birlikte sorumluluktur, gerisi hep saklı haklar ya da kendiliğinden geçiş meselesidir. Kendine sor: bu ifade \u0027her zaman\u0027 mı geçerli, yoksa bir tarafa özel bir imtiyaz mı tanıyor?","doldur":[]}],"anahtar":[{"ornek":"devralana","kok":"devral"},{"ornek":"devreden","kok":"devred"},{"ornek":"işveren","kok":"işvere"},{"ornek":"yanlıştır","kok":"yanlış"},{"ornek":"patron","kok":"patron"},{"ornek":"tarihinde","kok":"tarihi"}],"konuGiris":{"harita":"Ne zaman test edilir: işyeri veya bir bölümü başka işverene devredildiğinde. Nasıl ölçülür: devir tarihinden önce doğan borçlarda devreden ile devralanın birlikte sorumlu olup olmadığı ve sürenin sınırı ile ölçülür. Nasıl kaydedilir: iş sözleşmesi bütün hak ve borçlarıyla devralana geçmiş sayılır, hizmet süresi eski işe başlama tarihinden hesaplanır.","desen":"Sınav genelde \u0027devir işten çıkarma sebebi olabilir mi\u0027 veya \u0027devreden süresiz sorumlu mu\u0027 tuzağıyla sorar; öğrenci iki yıllık sınırı unutup süresiz sorumluluk seçebilir. Bir diğer tuzak, iflasla tasfiye halinde bu hükümlerin uygulanmamasıdır. Bu soru m.6 fıkra 3-4 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Devir tarihinden önceki borçlarda devredenin sorumluluğu iki yılla sınırlıdır","ad":"Devreden sorumluluğu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Devirden önce doğan ve devir anında ödenmesi gereken borçtan iki işveren birlikte sorumludur","ad":"Birlikte sorumluluk","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Devir tek başına iş sözleşmesinin feshi için haklı sebep sayılamaz","ad":"Fesih yasağı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Kıdeme bağlı haklarda esas alınan, işçinin devreden yanındaki ilk işe başlama tarihi","ad":"Hizmet süresi","kim":"kanun sabitler"}],"sinavda":"Soru, işyeri devrinin sonuçlarına dair ifadelerden hangisinin her zaman doğru olduğunu sorar, hesaplama istemez.","panel_ornek":"Bir arkadaşın çalıştığı kafe başka birine devrediliyor; yeni patron çalışanları kovamıyor, eski patron da devirden önceki 2 aylık maaş borcundan 2 yıl daha sorumlu kalıyor. Yani devir, işçinin hakkını sıfırlamıyor.","ornek":"Bir arkadaşın çalıştığı kafe başka birine devrediliyor; yeni patron çalışanları kovamıyor, eski patron da devirden önceki 2 aylık maaş borcundan 2 yıl daha sorumlu kalıyor. Yani devir, işçinin hakkını sıfırlamıyor.","yontemler":"Şıklarda \u0027süresiz sorumluluk\u0027, \u0027fesih hakkı doğar\u0027 gibi mutlaklık içeren ifadeler genelde yanlıştır; kanundaki iki yıllık sınır ve fesih yasağı cümlesi doğru şıktır.","nedir":"İşyeri devri, iş sözleşmelerinin devralana geçtiği ve tarafların sorumluluk sınırlarının belirlendiği bir İş Kanunu kurumudur. Sınav, devir halinde kimin neyden ne kadar sorumlu olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Kıyas Tuzağı","metin":"İş sözleşmesinin devralana geçmesini alacağın devrine benzeterek işçinin yazılı rızasının arandığını sanırsın. Doğrusu: İş Kanunu m.6 uyarınca devir tarihinde mevcut iş sözleşmeleri, işçinin rızası aranmaksızın bütün hak ve borçlarıyla devralana geçer."},"E":{"ad":"Süre Sıfırlama Tuzağı","metin":"İşyeri devrinin işçinin kıdemini sıfırladığını, yalnız devralan yanındaki sürenin sayılacağını sanırsın. Doğrusu: Kıdeme bağlı haklar hesaplanırken işçinin devreden işveren yanında işe başladığı tarih esas alınır."},"D":{"ad":"Taraf Sınırlama Tuzağı","metin":"Ekonomik ve teknolojik sebeplerin gerekli kıldığı fesih hakkının yalnız devreden işverene ait olduğunu sanırsın. Doğrusu: Bu fesih hakkı hem devreden hem devralan işverene tanınmış olup her ikisinin de haklı sebeple fesih hakları saklı tutulur."},"A":{"ad":"Ters Kural Tuzağı","metin":"İşyeri devrinin tek başına haklı fesih sebebi oluşturduğunu düşünürsün. Doğrusu: 4857 sayılı İş Kanunu m.6 uyarınca devir, işçi veya işveren yönünden derhal fesih için haklı sebep oluşturmaz."}},"celdiriciYol":{},"hap":"İşyeri devrinde iş sözleşmesi işçinin rızası aranmaksızın devralana geçer; devir tek başına haklı fesih sebebi değildir ve kıdem devreden işveren yanındaki başlangıçtan hesaplanır.","teshis":{"C":{"gercek":"4857 sayılı İş Kanunu m.6, iş sözleşmelerinin işçinin rızası aranmaksızın kendiliğinden ve bütün hak-borçlarıyla devralan işverene geçeceğini öngörür; bu, genel borçlar hukukundaki devir rejiminden ayrılan özel bir düzenlemedir.","ayirt":"Bu geçiş için işçinin ayrıca onay vermesi gerekiyor mu, yoksa kanun gereği kendiliğinden mi oluyor?","paragraf":"4857 sayılı İş Kanunu m.6","yanilgi":"İş sözleşmesinin devrini Türk Borçlar Kanunu\u0027ndaki alacağın temlikine kıyaslayıp işçinin rızasının şart olduğunu sanıyorsun."},"E":{"gercek":"4857 sayılı İş Kanunu m.6 ve ilgili kıdem hükümleri, işçinin kıdeme bağlı haklarının devreden işveren yanında işe başladığı tarihten itibaren kesintisiz hesaplanmasını öngörür.","ayirt":"Kıdem süresi devir tarihinden mi, yoksa işçinin devreden işveren yanında ilk işe başladığı tarihten mi başlatılıyor?","paragraf":"4857 sayılı İş Kanunu m.6","yanilgi":"İşyeri devrinin işçinin kıdemini sıfırlayıp yeniden başlattığını, kıdem tazminatı ve izin gibi hakların yalnız devralan yanındaki süreye göre hesaplanacağını sanıyorsun."},"A":{"gercek":"4857 sayılı İş Kanunu m.6 uyarınca devir işlemi, işçi ya da işveren yönünden derhal fesih için haklı sebep oluşturmaz; yalnız ekonomik, teknolojik ya da iş organizasyonundaki değişikliğe dayalı fesih hakları saklıdır.","ayirt":"Fesih sebebi olarak gösterilen şey işyeri devrinin kendisi mi, yoksa ayrı bir ekonomik-teknolojik gerekçe mi?","paragraf":"4857 sayılı İş Kanunu m.6","yanilgi":"İşyeri devrinin başlı başına devralan işverene haklı fesih hakkı verdiğini sanıyorsun."},"D":{"gercek":"4857 sayılı İş Kanunu m.6, bu tür fesih haklarını devreden ve devralan işverenin her ikisi için de saklı tutar; devir, hiçbir tarafın bu hakkını ortadan kaldırmaz.","ayirt":"Madde metni fesih hakkını tek bir tarafa mı hasrediyor, yoksa \u0027devreden veya devralan\u0027 diyerek her ikisine mi tanıyor?","paragraf":"4857 sayılı İş Kanunu m.6","yanilgi":"Ekonomik-teknolojik sebeplerin gerekli kıldığı fesih hakkının yalnızca eski işverene, yani devredene tanındığını sanıyorsun."},"B":{"gercek":"4857 sayılı İş Kanunu m.6, devirden önce doğmuş ve devir anında muaccel borçlardan devreden ve devralan işverenin devir tarihinden itibaren iki yıl süreyle müteselsilen sorumlu olduğunu düzenler.","ayirt":"Borç devir tarihinden önce mi doğmuş ve devir anında ödenmesi gereken bir borç mu, süre iki yıl mı işletiliyor?","paragraf":"4857 sayılı İş Kanunu m.6","yanilgi":"Bu şıkkı eleyen öğrenci, iki yıllık sorumluluğun yalnız devralan işverene ait olduğunu ya da sürenin bir yıl olduğunu sanır."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 109"},"kural":"dul eşe %50, hak kazanan her çocuğa %25 hisse verilir; toplam hisse sigortalı aylığını aşarsa hak sahiplerinin aylıklarından orantılı indirim yapılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce her hak sahibinin hisse oranını doğru belirle, sonra toplamı sigortalı aylığıyla karşılaştır; aşıyorsa mutlaka katsayı uygula.","konu":"ölüm aylığı kesilmesi","tablo":{"satirlar":[["VERİLENLER","-"],["Sigortalı aylığı","24.000 TL"],["Hak sahibi sayısı","dul eş + 3 çocuk"],["HESAP","-"],["Dul eş hissesi (%50 x 24.000)","12.000"],["Çocuk başı hisse (%25 x 24.000)","6.000"],["Üç çocuğun toplam hissesi (6.000 x 3)","18.000"],["Toplam hisse (12.000 + 18.000)","30.000"],["İndirim katsayısı (24.000 / 30.000)","0,80"],["Çocuğun nihai aylığı (6.000 x 0,80)","4.800"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"6.000","E":"7.500","A":"4.000","D":"7.200","B":"4.800"},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.34 [1/3]","metin":"MADDE 34- Ölen sigortalının 33 üncü madde hükümlerine göre hesaplanacak aylığının; a) (Değişik: 17/4/2008-5754/21 md.) Dul eşine % 50\u0027si; aylık bağlanmış çocuğu bulunmayan dul eşine ise bu Kanunun 5 inci maddesinin birinci fıkrasının (a), (b) ve (e) bentleri hariç bu Kanun kapsamında veya yabancı bir ülke mevzuatı kapsamında çalışmaması veya kendi sigortalılığı nedeniyle gelir veya aylık bağlanmamış olması halinde % 75\u0027i, b) (Değişik: 17/4/2008-5754/21 md.) Bu Kanunun 5 inci maddesinin birinci fıkrasının (a), (b) ve (e) bentleri hariç bu Kanun kapsamında veya yabancı bir ülke mevzuatı kapsamında çalışmayan veya kendi sigortalılığı nedeniyle gelir veya aylık bağlanmamış çocuklardan; 1) 18 yaşını, lise ve dengi öğrenim görmesi halinde 20 yaşını, yüksek öğrenim yapması halinde 25 yaşını doldurmayanların veya, 17/4/2008 tarihli ve 5754 sayılı Kanunun 66 ncı maddesiyle; bu maddenin birinci fıkrasının (b) bendindeki “29 uncu” ibaresi “30 uncu” şeklinde değiştirilmiş, (a) bendine “malûllük” ibaresinden sonra gelmek üzere “, vazife malûllüğü” ibaresi eklenmiştir."},{"ad":"5510 s. SGK Kanunu m.34 [2/3]","metin":"53 2) Kurum Sağlık Kurulu kararı ile çalışma gücünü en az % 60 oranında yitirip malûl olduğu anlaşılanların veya, 3) Yaşları ne olursa olsun evli olmayan, evli olmakla beraber sonradan boşanan veya dul kalan kızlarının, her birine %25\u0027i, c) (b) bendinde belirtilen çocuklardan sigortalının ölümü ile anasız ve babasız kalan veya sonradan bu duruma düşenlerle, ana ve babaları arasında evlilik bağı bulunmayan veya sigortalının ölümü tarihinde evlilik bağı bulunmakla beraber ana veya babaları sonradan evlenenler ile kendisinden başka aylık alan hak sahibi bulunmayanların her birine %50\u0027si, d) (Değişik: 17/4/2008-5754/21 md.) Hak sahibi eş ve çocuklardan artan hisse bulunması halinde her türlü kazanç ve irattan elde etmiş olduğu gelirinin asgari ücretin net tutarından daha az olması ve diğer çocuklarından hak kazanılan gelir ve aylıklar hariç olmak üzere gelir ve/veya aylık bağlanmamış olması şartıyla ana ve babaya toplam %25\u0027i oranında; ana ve babanın 65 yaşın üstünde olması halinde ise artan hisseye bakılmaksızın yukarıdaki şartlarla toplam %25\u0027i, oranında aylık bağlanır. (Ek cümle: 21/3/2018-7103/66 md.) Ancak, hak sahibi çocuklardan 18 yaşını, lise ve dengi öğrenim görmesi halinde 20 yaşını, yükseköğrenim yapması halinde 25 yaşını doldurmayanların, bu Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamında sigortalı sayılmaları, bunlara aylık bağlanmasına engel oluşturmaz. Sigortalı tarafından evlât edinilmiş, tanınmış veya soy bağı düzeltilmiş veya babalığı hükme bağlanmış çocukları ile sigortalının ölümünden sonra doğan çocukları, bağlanacak aylıktan yukarıda beli…"}],"hakem":"Soru 5510 sayılı SGK Kanunu m.34 hükümlerine dayanan, ölüm aylığı dağılımında orantılı indirim kuralını test etmektedir; dul eşe %50, her çocuğa %25 hisse ilkesi ve toplam hisse sigortalı aylığını aştığında orantılı indirim yapılması kaynakta açıkça düzenlenmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Çocuğun payı %25 ile doğru bulunmuş (6.000 TL) ama orantılı indirimi hiç yapılmamış. Toplam hisse aylığı aştığında indirim zorunludur.","E":"Katsayı ters kurulmuş: 30.000÷24.000 yerine doğru oran 24.000÷30.000 olmalıdır.","D":"Çocuk hissesi yanlış %30 alınıp hesaplanmış. Kanun her çocuğa %25 öngörür.","A":"Dul eşe %75 uygulanmış; böylece toplam hisse 36.000 TL bulunup katsayı 0,667 çıkartılmış. Oysa aylık bağlanmış çocuğu olan dul eşe %50 uygulanır."},"dogru":"Dul eş %50, her çocuk %25 alır; toplam 30.000 TL aylığı aşar. Kanun bunu engeller: orantılı indirimi uygulanır (24.000÷30.000=0,80). Çocuk: 6.000×0,80=4.800 TL.","sinav":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 34. madde uyarınca hak sahibi bir çocuğa bağlanacak aylık tutarını hesaplayınız.","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 34. madde","tanim":"Hak sahiplerinin toplam aylıkları sigortalı aylığını aştığında, her hak sahibinin aylığından eşit oranda düşme yapılmasıdır.","ad":"Orantılı indirim"},{"kaynak":"5510 s. SGK Kanunu 34. madde","tanim":"Ölen sigortalının dul eşi, çocukları ve belirli şartları taşıyan ana-babası gibi kanunda tanımlanan ve aylık alma hakkı olan kişilerdir.","ad":"Hak sahibi"},{"kaynak":"5510 s. SGK Kanunu 34. madde","tanim":"Ölen sigortalının aylığından hak sahiplerinin kanunda belirtilen yüzde oranıdır.","ad":"Hisse"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":{"bosluk":[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Dul eş hissesi (%50 x 20.000)","10.000"],["Çocuk başı hisse (%25 x 20.000)","5.000"],["Üç çocuğun toplam hissesi (5.000 x 3)","15.000"],["Toplam hisse (10.000 + 15.000)","25.000"],["İndirim katsayısı (20.000 / 25.000)","0,80"],["Dul eşin nihai aylığı (10.000 x 0,80)","8.000"]]},"tur":"tablo","soru":"Ölen sigortalının 5510 sayılı Kanuna göre hesaplanan aylığı 20.000 TL\u0027dir. Hak sahipleri; aylık bağlanmış çocuğu bulunan dul eş ile hak kazanma şartlarını taşıyan üç çocuktur. Buna göre, hak sahibi dul eşe bağlanacak aylık kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve dul eşin nihai aylığının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Ölen sigortalının 5510 sayılı Kanuna göre hesaplanan aylığı 24.000 TL\u0027dir. Hak sahipleri; aylık bağlanmış çocuğu bulunan dul eş ile hak kazanma şartlarını taşıyan üç çocuktur. Buna göre, hak sahibi çocuklardan birine bağlanacak aylık kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-issgk-zor/kp-19","verilenler":[{"deger":"24.000 TL","anlam":"Ölen sigortalının 5510 s. Kanuna göre hesaplanan ve hak sahiplerine dağıtılacak toplam aylık tutarı; orantılı indirimde sınır olarak kullanılır.","ad":"Sigortalı aylığı"},{"deger":"dul eş + 3 çocuk","anlam":"Hisse hesabında dul eşe %50, her çocuğa %25 uygulanacak kişi sayısını belirler.","ad":"Hak sahibi sayısı"}],"dayanak":"5510 sayılı Kanun m.34/a, m.34/b ve son fıkra","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Verilen: Sigortalı aylığı 24.000 TL (soruda verilen); Hak sahipleri dul eş + 3 çocuk (soruda verilen)","anlatim":"Soru bize şunları vermiş: ölen sigortalının aylığı 24.000 TL, hak sahipleri de aylık bağlanmış çocuğu olan dul eş ve hak kazanma şartını taşıyan üç çocuk.","verilenAdim":true,"doldur":[[1,1],[2,1]]},{"formul":"Dul eş hissesi = %50 × 24.000 (soruda verilen) = 12.000 TL","anlatim":"Ölüm aylığında hak sahiplerine sigortalının aylığından hisse verilir - dul eşe %50, her çocuğa %25 pay düşer. Bu hisseler toplam aylığı aşarsa sonunda orantılı indirim yapılır, çünkü toplam ödeme sigortalının aylığından fazla olamaz.","doldur":[[4,1]]},{"formul":"Çocuk başı hisse = %25 × 24.000 (soruda verilen) = 6.000 TL","anlatim":"Şimdi çocuk başına düşen hisseyi hesaplıyoruz - her hak kazanan çocuğa aylığın %25\u0027i verilir. Bu oran kanunda sabit, kaç çocuk olursa olsun her biri için aynı yüzde uygulanır.","doldur":[[5,1]]},{"formul":"Üç çocuğun toplam hissesi = 6.000 (2. adımda bulduk) × 3 (soruda verilen) = 18.000 TL","anlatim":"Üç çocuğun toplam hissesini buluyoruz çünkü indirim hesabı için tüm hak sahiplerinin payını toplamamız gerekiyor. Her çocuk aynı tutarı aldığı için basit çarpım yeterli.","doldur":[[6,1]]},{"formul":"Toplam hisse = 12.000 (1. adımda bulduk) + 18.000 (3. adımda bulduk) = 30.000 TL","anlatim":"Dul eş ve üç çocuğun hisselerini topluyoruz - bu bize gerçek toplam hak talebini verir. Aşağıda bunu 24.000 ile karşılaştıracağız, çünkü kural burada devreye giriyor.","doldur":[[7,1]]},{"formul":"İndirim katsayısı = Sigortalı aylığı / Toplam hisse = 24.000 (soruda verilen) / 30.000 (4. adımda bulduk) = 0,80","anlatim":"Toplam hisse 30.000, sigortalının aylığı ise 24.000 - hisseler aylığı aştı. Bu yüzden bir indirim katsayısı buluyoruz, herkesin payı bu katsayıyla küçültülecek.","doldur":[[8,1]]},{"formul":"Çocuğun nihai aylığı = Çocuk başı hisse × İndirim katsayısı = 6.000 (2. adımda bulduk) × 0,80 (6. adımda bulduk) = 4.800 TL","anlatim":"Çocuğun ham hissesini 0,80 katsayıyla çarpıyoruz, çünkü toplam hisse aylığı aştığı için herkesin payı bu oranda kırpılıyor. Bu bize sorunun cevabını, çocuğun eline geçecek gerçek aylığı verir.","doldur":[[9,1]]},{"formul":"Sonuç = 4.800 TL (7. adımda bulduk)","anlatim":"Sonuç: hak sahibi çocuklardan birine bağlanacak aylık 4.800 TL\u0027dir. Bu tutar tabloda son satırda görülüyor.","doldur":[]},{"formul":"Ters durum: Toplam hisse ≤ Sigortalı aylığı → İndirim katsayısı = 1, çocuk payı = 6.000 (2. adımda bulduk)","anlatim":"Ters durumda: toplam hisse 24.000\u0027i aşmasaydı indirim yapılmaz, herkes ham hissesini tam alırdı. Yani katsayı hep 1 olurdu ve çocuk 6.000 TL alırdı.","doldur":[]},{"formul":"Yanlış yol: Çocuk payı = 6.000 (HATALI) → doğrusu 4.800 (7. adımda bulduk)","anlatim":"En sık hata: öğrenci indirim katsayısını unutup direkt çocuk başı hisseyi (6.000 TL) cevap olarak yazar. Oysa toplam hisse aylığı aştığı için mutlaka 0,80 ile çarpmak gerekir.","doldur":[]}],"anahtar":[{"ornek":"aylığını","kok":"aylığı"},{"ornek":"sigortalı","kok":"sigort"},{"ornek":"indirilir","kok":"indiri"},{"ornek":"katsayısı","kok":"katsay"},{"ornek":"sahiplerinin","kok":"sahipl"},{"ornek":"çocuğu","kok":"çocuğu"}],"konuGiris":{"harita":"Ne zaman test edilir: Sigortalı öldüğünde hak sahiplerine aylık bağlanırken. Nasıl ölçülür: Her hak sahibinin kanunda belirtilen yüzdesi, sigortalının hesaplanan aylığına uygulanarak bulunur. Nasıl kaydedilir: Hak sahiplerine bağlanan aylıkların toplamı, sigortalının aylığını aşıyorsa oranlı olarak indirilir.","desen":"Sınav, dul eş ve çocuk sayısının birlikte verildiği karma senaryolarla yüzdelerin doğru toplanıp toplanmadığını sorar. Tuzak, aylık bağlanmış çocuğu olan eşin %50 mi yoksa %75 mi alacağını karıştırmaktır. Bu soru m.34 hükmünden, dul eş ve üç çocuğa aylık paylaşımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Aylık bağlanmış çocuğu olan dul eşe verilen sigortalı aylığının yüzdesi","ad":"Dul eş payı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Hak kazanan her çocuğa verilen sigortalı aylığının yüzdesi","ad":"Çocuk payı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"33. madde hükümlerine göre hesaplanan, paylaşıma esas ana tutar","ad":"Sigortalı aylığı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Hak sahiplerine bağlanan aylıkların toplamının sigortalı aylığını aşamaması kuralı","ad":"Toplam sınır","kim":"kanun sabitler"}],"sinavda":"Sigortalının hesaplanan aylığı ile hak sahiplerinin kimler olduğu verilir, hak sahiplerinden birine düşen aylık tutarı istenir.","panel_ornek":"Bir ailede miras kalan 10 metrekarelik bir arsa, anne ve iki kardeş arasında paylaşılıyor: anneye yarısı, kardeşlerin her birine kalanın eşit payı düşüyor. Kim ne kadar pay alacağını hesaplarken önce toplam pay oranlarının 1\u0027i (yani tam arsayı) geçmediğinden emin olunur. Aslında bu, ölüm aylığı paylaşımındaki mantığın küçük bir örneğidir.","ornek":"Bir ailede miras kalan 10 metrekarelik bir arsa, anne ve iki kardeş arasında paylaşılıyor: anneye yarısı, kardeşlerin her birine kalanın eşit payı düşüyor. Kim ne kadar pay alacağını hesaplarken önce toplam pay oranlarının 1\u0027i (yani tam arsayı) geçmediğinden emin olunur. Aslında bu, ölüm aylığı paylaşımındaki mantığın küçük bir örneğidir.","yontemler":"Önce her hak sahibi grubunun yüzdesi belirlenir, sonra bu yüzdeler sigortalı aylığına uygulanır; toplamın aylığı aşmaması kritik kuraldır.","nedir":"Ölüm aylığı, sigortalının vefatı halinde hak sahiplerine bağlanan gelirin nasıl paylaşıldığını düzenler. Sınav, her hak sahibine düşen yüzdeyi ve toplam sınırı doğru hesaplayıp hesaplayamadığını ölçer."},"olay":"eş 12.000, çocuk başı 6.000, üç çocuk toplamı 18.000, genel toplam 30.000, katsayı 24.000/30.000=0,80, çocuk payı 6.000×0,80=4.800.","tuzak":{"C":{"ad":"Eksik Katman Tuzağı","metin":"Çocuk hissesini %25×24.000=6.000 TL bulup orantılı indirimi hiç uygulamadın. Doğrusu: toplam hisse sigortalı aylığını aştığından indirim şarttır."},"E":{"ad":"Ters Katsayı Tuzağı","metin":"İndirim katsayısını 30.000/24.000=1,25 olarak ters kurup 6.000×1,25=7.500 TL buldun. Doğrusu: katsayı sigortalı aylığının toplam hisseye oranıdır (24.000/30.000)."},"D":{"ad":"Oran Karışıklığı Tuzağı","metin":"Çocuk hissesini %25 yerine %30 alarak 24.000×0,30=7.200 TL buldun. Doğrusu: kanun çocuklara %25 hisse öngörür."},"A":{"ad":"Ters Oran Tuzağı","metin":"Aylık bağlanmış çocuğu bulunan dul eşe %75 verilir sanarak eş hissesini 18.000 TL, toplamı 36.000 TL, katsayıyı 0,667 alıp çocuk payını 4.000 TL buldun. Doğrusu: aylık bağlanmış çocuğu bulunan dul eşe %50 uygulanır."}},"celdiriciYol":{"C":"%25×24.000 = 6.000 (orantılı indirimi hiç uygulamadın)","E":"6.000×(30.000/24.000) = 7.500 (katsayıyı ters kurdun)","D":"%30×24.000 = 7.200 (çocuk hissesini %25 yerine %30 aldın)","A":"18.000 (eş %75) + 18.000 (3 çocuk) = 36.000; 24.000/36.000=0,667; 6.000×0,667=4.000 (eş oranını %75 aldın)"},"hap":"Hak sahiplerinin toplam hissesi sigortalı aylığını aşarsa, her hak sahibinin payı sigortalı aylığı/toplam hisse oranında orantılı olarak indirilir.","teshis":{"C":{"gercek":"m.34 son fıkra gereği toplam hisse sınırı aşarsa oranlı indirim şarttır; ham hisse nihai tutar değildir.","ayirt":"Toplam hisse ile sigortalı aylığını karşılaştırdım mı?","paragraf":"m.34 son fıkra","yanilgi":"Hisseleri hesaplayıp toplamın sınırı aştığını kontrol etmeden direkt çocuk payını nihai sanıyorsun."},"E":{"gercek":"m.34 son fıkra: katsayı sigortalı aylığının toplam hisseye bölünmesiyle bulunur (aylık ÷ toplam hisse), tersi değil.","ayirt":"Katsayıyı kurarken küçük olan (sigortalı aylığı) payda mı, pay mı oldu?","paragraf":"m.34 son fıkra","yanilgi":"Orantılı indirim katsayısını kurarken payı ve paydayı ters aldığını fark etmiyorsun."},"A":{"gercek":"5510 s. Kanun m.34/a: aylık bağlanmış çocuğu bulunmayan dul eşe %75, bulunan dul eşe %50 uygulanır.","ayirt":"Dul eşin aylık bağlanmış çocuğu var mı, yok mu diye kendine sordun mu?","paragraf":"m.34/a","yanilgi":"Aylık bağlanmış çocuğu bulunan dul eşin her zaman %75 aldığını sanıyorsun."},"D":{"gercek":"m.34/b: hak kazanan her çocuğa %25 hisse bağlanır.","ayirt":"Çocuk hissesi oranını maddeden mi aldım, yoksa aklımda kalan başka bir oran mı?","paragraf":"m.34/b","yanilgi":"Çocuk hissesinin %30 olduğunu sanıyorsun, malûllük ya da başka bir oranla karıştırıyorsun."},"B":{"gercek":"m.34 son fıkra: hak sahiplerine bağlanacak aylıkların toplamı sigortalıya ait aylığı geçemez, gerekirse orantılı indirim yapılır.","ayirt":"Bulduğum hisselerin toplamı sigortalı aylığını aşıyor mu, aşıyorsa katsayı kurdum mu?","paragraf":"m.34 son fıkra","yanilgi":"Toplam hissenin sigortalı aylığını aşamayacağını, aşarsa oran düşürüleceğini gözden kaçırıyorsun."}},"verilen":[[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"6356 sayılı Kanunun 45 inci maddesinin birinci fıkrasına göre yetki şartlarına sahip olunmadığı nedeniyle hükümsüzlük, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde dava yolu ile ileri sürülebilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Süre sorularında önce \u0027süre\u0027 rakamını, sonra ayrı olarak \u0027başlangıç anını\u0027 teker teker kontrol et; ikisi aynı şıkta doğru olmalı.","konu":"sendika yetkisi düşmesi","tablo":{"satirlar":[["A) Kırk beş gün içinde, Bakanlıkça durumun tespit edildiği …","6356 s.K. m.45/1","doğru ifade"],["B) Kırk beş gün içinde, açılan davanın sonuçlandığı tarihte…","6356 s.K. m.45/1","YANLIŞ ifade"],["C) Altı iş günü içinde, Bakanlıkça durumun tespit edildiği …","6356 s.K. m.42/2","YANLIŞ ifade"],["D) Altı iş günü içinde, işçi sendikasının Bakanlığa başvuru…","6356 s.K. m.42/1","YANLIŞ ifade"],["E) Kanunda böyle bir dava açma süresi öngörülmemiştir","6356 s.K. m.45/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Altı iş günü içinde, Bakanlıkça durumun tespit edildiği tarihten itibaren","E":"Kanunda böyle bir dava açma süresi öngörülmemiştir","A":"Kırk beş gün içinde, Bakanlıkça durumun tespit edildiği tarihten itibaren","D":"Altı iş günü içinde, işçi sendikasının Bakanlığa başvuru tarihinden itibaren","B":"Kırk beş gün içinde, açılan davanın sonuçlandığı tarihten itibaren"},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.45","metin":"MADDE 45 – (1) Yetki belgesi bulunmaksızın yapılan bir toplu iş sözleşmesinde taraflardan birinin veya ikisinin yetki şartlarına sahip olmadığı ve bu nedenle sözleşmenin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde, ilgililerce veya Bakanlıkça mahkemede dava yolu ile ileri sürülebilir. (2) Talep hâlinde mahkeme, toplu iş sözleşmesinin uygulanmasını dava sonuna kadar durdurabilir. Toplu görüşmeye çağrı"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.42","metin":"MADDE 42 – (1) Toplu iş sözleşmesi yapmak isteyen işçi sendikası Bakanlığa başvurarak yetkili olduğunun tespitini ister. İşveren sendikası veya sendika üyesi olmayan işveren de Bakanlığa başvurarak yetkili işçi sendikasının tespitini isteyebilir. (2) Bakanlık, kayıtlarına göre başvuru tarihi itibarıyla bir işçi sendikasının yetkili olduğunu tespit ettiğinde, başvuruyu, işyeri veya işletmedeki işçi ve üye sayısını, o işkolunda kurulu işçi sendikaları ile taraf olacak işveren sendikası veya sendika üyesi olmayan işverene altı iş günü içinde bildirir. (3) İşçi sendikasının yetki şartlarına sahip olmadığının ya da işyerinde yetki şartlarına sahip bir işçi sendikasının bulunmadığının tespiti hâlinde, bu bilgiler sadece başvuruyu yapan tarafa bildirilir. (4) Sigortalılığın başlangıcı ile sona ermesine ilişkin bildirimlerden yasal süresi içinde Sosyal Güvenlik Kurumuna yapılmayanlar, yetkili işçi sendikasının tespitinde dikkate alınmaz. (5) Yetki tespiti ile ilgili usul ve esaslar Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir. Yetki itirazı7"}],"hakem":"Soru, 6356 sayılı Kanunun 45/1. maddesinde açıkça yer alan yetki şartlarına sahip olmama nedeniyle toplu iş sözleşmesinin hükümsüzlüğü davasının Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde açılabileceği kuralını sormaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Altı iş günü başka bir işlemde (Bakanlığın taraflara bildirim süresi) kullanılır. Hükümsüzlük davasını açmak için gereken süre daha uzun olup kırk beş gündür.","E":"Kanun bu konuda açık bir hak düşürücü süre belirlemişti. Hükümsüzlükten söz ediliyorsa bunun süresi olmadığı yanlış bir sonuçtur.","D":"İşçi sendikasının Bakanlığa başvuru tarihi, yetki tespiti sürecinde önemli olsa da dava açmanın başlangıcı değildir. Hükümsüzlük davasının süresi Bakanlığın tespit tarihinden itibaren kırk beş gündür.","B":"Süreyi doğru biliyorsanız da başlangıç anını yanlış anlamış olabilirsiniz. Dava açma süresi davaların sonuçlanma tarihinden değil, Bakanlığın tespit ettiği tarihten itibaren sayılır."},"dogru":"Bakanlık tarafından yetki şartlarının olmadığı tespit edildikten sonra, toplu iş sözleşmesinin hükümsüz olduğu mahkemeye dava ile ileri sürülebilir. Bu davayı açmak için kırk beş günlük bir süre vardır ve bu süre Bakanlığın tespit tarihinden başlar.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 45. madde birinci fıkrasına göre, yetki şartlarına sahip olmadığı nedeniyle toplu iş sözleşmesinin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde dava yolu ile ileri sürülebilir.","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 45. madde","tanim":"Toplu iş sözleşmesinin yapılmasında taraflardan birinin yetki şartlarına sahip olmadığının tespit edilmesi durumunda, Bakanlık veya ilgililerce açılabilen ve sözleşmenin geçersiz kılınmasını amaçlayan dava.","ad":"hükümsüzlük davası"},{"kaynak":"Sendikalar ve TİS K. 42. madde","tanim":"Bakanlığın, işçi sendikasının toplu iş sözleşmesi yapma hakkına sahip olup olmadığını kayıtlarına göre tespit etmesi işlemidir.","ad":"yetki tespiti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre, taraflardan birinin yetki şartlarına sahip olmadığı gerekçesiyle toplu iş sözleşmesinin hükümsüzlüğü davası, Bakanlıkça durumun tespitinden itibaren kaç gün içinde açılabilir?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-16","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.45/1","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Bir tekstil fabrikasında işveren sendikası ile imzalanan toplu iş sözleşmesinin ardından Bakanlık, işçi sendikasının aslında yetki şartlarını taşımadığını 3 Mart tarihinde tespit ediyor.","anlatim":"İşçiler bu sözleşmenin geçersiz sayılmasını istiyor ama ne zaman dava açacaklarını bilmiyorlar. Bakanlığın tespit ettiği bu 3 Mart tarihi kilit nokta oluyor.","doldur":[]},{"formul":"Ne yapacağız: 6356 sayılı Kanun m.45/1\u0027e göre süre kırk beş gün, başlangıç anı Bakanlığın tespit tarihi olan 3 Mart.","anlatim":"Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"6356 s.K. m.45/1","karar":"doğru","anlatim":"Evet, m.45/1 açıkça bunu söylüyor; süre Bakanlığın tespitinden başlıyor. Bu olayda 3 Mart başlangıç, kırk beşinci gün son gün.","formul":"Şık A: birisi sana \u0027dava süresi kırk beş gün ve 3 Mart\u0027tan itibaren işler\u0027 diyor, doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"6356 s.K. m.45/1","karar":"yanlış","anlatim":"Hayır, dava henüz açılmamışken sonuçlanma tarihi olamaz, bu mantıksız bir başlangıç. Süre davayı açmak için verilmiştir, sonucundan başlamaz.","formul":"Şık B: birisi sana \u0027süre kırk beş gün ama başlangıç davanın sonuçlandığı tarih\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"6356 s.K. m.42/2","karar":"yanlış","anlatim":"Hayır, altı iş günü m.42/2\u0027deki Bakanlığın bildirim süresidir, taraflara yetki tespitini bildirme süresi. Hükümsüzlük davası süresiyle karıştırılmamalı.","formul":"Şık C: birisi sana \u0027süre altı iş günü ve 3 Mart\u0027tan itibaren işler\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"6356 s.K. m.42/1","karar":"yanlış","anlatim":"Hayır, başvuru tarihi m.42/1\u0027deki yetki tespiti talebinin başlangıcıdır. Bu, hükümsüzlük davasıyla ilgili bir tarih değildir.","formul":"Şık D: birisi sana \u0027süre altı iş günü ve işçi sendikasının başvuru tarihinden işler\u0027 diyor, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"6356 s.K. m.45/1","karar":"yanlış","anlatim":"Hayır, m.45/1\u0027de açıkça kırk beş günlük bir süre var. Fabrika işçileri bu süreyi kaçırırsa dava hakları düşer.","formul":"Şık E: birisi sana \u0027kanunda böyle bir süre yok\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Bu olayda tek doğru cevap süre kırk beş gün ve başlangıç Bakanlığın tespit tarihi. Kendine hep şunu sor: bu süre neyin başlangıcından işliyor, tespitten mi yoksa başka bir işlemden mi?","doldur":[]}],"anahtar":[{"ornek":"tespitinden","kok":"tespit"},{"ornek":"bakanlıkça","kok":"bakanl"},{"ornek":"başlangıç","kok":"başlan"},{"ornek":"hükümsüzlük","kok":"hüküms"},{"ornek":"tarihi","kok":"tarihi"},{"ornek":"davası","kok":"davası"}],"konuGiris":{"harita":"Ne zaman test edilir: Bakanlık yetki şartına uymazlığı tespit ettiğinde süre başlar. Nasıl ölçülür: Tespit tarihinden itibaren gün sayısı hesaplanır. Nasıl kaydedilir: Dava, bu süre içinde mahkemeye açılmış olarak kayda geçer.","desen":"Sınav genelde süreyi başka sürelerle (altı iş günü, yetki itirazı süreleri) karıştırmanızı hedefler. Soru m.45/1\u0027deki kırk beş günlük süreyi, m.42\u0027deki altı iş günlük bildirim süresiyle karıştırma tuzağı kurar. Bu soru m.45 hükmündeki dava açma süresi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Sendikanın toplu sözleşme yapabilmesi için taşıması gereken kanuni koşul","ad":"Yetki şartı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Yetki şartı eksikliği nedeniyle sözleşmenin geçersizliğinin ileri sürüldüğü dava","ad":"Hükümsüzlük davası","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Bakanlığın yetki şartı eksikliğini belirlediği tarih","ad":"Tespit tarihi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tespitten itibaren dava açma hakkının tanındığı yasal süre","ad":"Kırkbeş günlük süre","kim":"kanun sabitler"}],"sinavda":"Soruda Bakanlıkça tespit yapıldığı belirtilir ve dava açma süresinin gün sayısı istenir.","panel_ornek":"Diyelim ki oturduğun apartmanda yönetim, aidat borcunu tespit ettikten sonra komşuna itiraz için belli bir süre tanıyor; bu süre 10 gün. Süre geçince itiraz hakkı düşüyor, borç kesinleşiyor. Buradaki mantık, \u0027tespitten sonra başlayan süre\u0027 fikridir.","ornek":"Diyelim ki oturduğun apartmanda yönetim, aidat borcunu tespit ettikten sonra komşuna itiraz için belli bir süre tanıyor; bu süre 10 gün. Süre geçince itiraz hakkı düşüyor, borç kesinleşiyor. Buradaki mantık, \u0027tespitten sonra başlayan süre\u0027 fikridir.","yontemler":"Kanun metnindeki \u0027kırk beş gün\u0027 ifadesini diğer sürelerle (altı iş günü gibi) karıştırmamak en kritik noktadır.","nedir":"Bu konu, toplu iş sözleşmesinin geçerliliğini yetki şartı yönünden sorgulama süresini anlatır. Sınav, hükümsüzlük davasının açılabileceği süreyi ve bu sürenin başlangıcını bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Madde Karıştırma Tuzağı","metin":"öğrenci 42 nci maddedeki altı iş günlük bildirim süresini hükümsüzlük davası süresiyle karıştırıyor. Doğrusu: altı iş günü Bakanlığın taraflara bildirim süresidir, dava açma süresi kırk beş gündür."},"E":{"ad":"Süre Yokmuş Tuzağı","metin":"öğrenci kanunun bu konuda süre koymadığını düşünüyor çünkü hükümsüzlük kavramını süresiz bir geçersizlik sanıyor. Doğrusu: kanun açıkça kırk beş günlük hak düşürücü niteliktedeki dava açma süresini öngörmüştür."},"D":{"ad":"Çifte Karışıklık Tuzağı","metin":"öğrenci hem yanlış süreyi hem yanlış başlangıç anını (başvuru tarihini) bir araya getiriyor. Doğrusu: başvuru tarihi yetki tespiti sürecine ait bir andır, hükümsüzlük davası süresinin başlangıcı değildir."},"B":{"ad":"Ters Başlangıç Tuzağı","metin":"öğrenci süreyi doğru hatırlayıp başlangıç anını dava sonucuna bağlıyor, oysa süre davanın açılmasına ilişkindir, sonucuna değil. Doğrusu: kırk beş günlük süre Bakanlıkça tespitten itibaren işler, dava sonuçlanmasından itibaren değil."}},"celdiriciYol":{},"hap":"Yetki şartına sahip olmama nedeniyle hükümsüzlük davası, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde açılır.","teshis":{"C":{"gercek":"Altı iş günü m.42/2\u0027deki Bakanlık bildirim süresidir, hükümsüzlük davası süresi ayrı olarak kırk beş gündür.","ayirt":"Bu altı gün hangi işlem için, bildirim mi dava açma mı?","paragraf":"6356 s.K. m.42/2 - m.45/1","yanilgi":"Yetki sürecindeki altı iş günlük bildirim süresini hükümsüzlük davası süresi sanıyorsun."},"E":{"gercek":"Kanun m.45/1\u0027de açık ve belirli bir kırk beş günlük dava açma süresi öngörmüştür.","ayirt":"Madde metninde açıkça bir gün sayısı var mı?","paragraf":"6356 s.K. m.45/1","yanilgi":"Hükümsüzlüğü süresiz bir geçersizlik türü sanıp kanunun süre koymadığını düşünüyorsun."},"A":{"gercek":"6356 sayılı Kanun m.45/1 açıkça kırk beş günlük süreyi Bakanlıkça tespit tarihinden başlatır.","ayirt":"Süre hangi olaydan itibaren işliyor, tespitten mi sonuçtan mı?","paragraf":"6356 s.K. m.45/1","yanilgi":"Bu şıkkı eleyen öğrenci süre ile başlangıç anını ayrı ayrı doğru hatırlayamayıp ikisini birbirine karıştırdığını düşünür."},"D":{"gercek":"Başvuru tarihi yetki tespiti talebinin başlangıcıdır, hükümsüzlük davası süresiyle ilgisi yoktur.","ayirt":"Başvuru tarihi hangi sürecin başlangıcı, yetki tespitinin mi davanın mı?","paragraf":"6356 s.K. m.42/1 - m.45/1","yanilgi":"Hem yanlış süreyi hem yanlış başlangıç anını bir araya getirip yeni bir kural uyduruyorsun."},"B":{"gercek":"Süre davanın açılması için öngörülmüştür, başlangıcı Bakanlığın tespitidir; dava sonucu ayrı bir husustur.","ayirt":"Bu süre neyin başlangıcı, davanın açılması mı sonuçlanması mı?","paragraf":"6356 s.K. m.45/1","yanilgi":"Süreyi doğru bildiğini düşünüp başlangıç anını davanın sonuçlanmasına bağlıyorsun, oysa dava henüz açılmamışken sonuç olmaz."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"6356 sayılı Kanunun 45 inci maddesinin birinci fıkrasına göre yetkisiz yapılan toplu iş sözleşmesinin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde ilgililerce veya Bakanlıkça dava yolu ile ileri sürülebilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Süre ve taraf ifadesi geçen sorularda maddenin tamamını okumadan cevap verme; \u0027yalnızca\u0027, \u0027resen\u0027 gibi daraltıcı kelimeler genelde tuzak sinyalidir.","konu":"sendika yetkisi düşmesi","tablo":{"satirlar":[["A) Yetkisi olmadığı hâlde yapılan bir toplu iş sözleşmesini…","6356 s.K. m.45/1","doğru ifade"],["B) Yetkisi olmadığı hâlde yapılan bir toplu iş sözleşmesini…","6356 s.K. m.45/1","YANLIŞ ifade"],["C) Yetkisi olmadığı hâlde yapılan bir toplu iş sözleşmesini…","6356 s.K. m.45/1","YANLIŞ ifade"],["D) Talep aranmaksızın mahkeme, hükümsüzlük davası açıldığın…","6356 s.K. m.45/2","YANLIŞ ifade"],["E) Bakanlık, kayıtlarına göre bir işçi sendikasının yetkili…","6356 s.K. m.42/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yetkisi olmadığı hâlde yapılan bir toplu iş sözleşmesinin hükümsüzlüğü davası yalnızca Bakanlıkça açılabilir, ilgililerin bu davayı açma hakkı yoktur.","E":"Bakanlık, kayıtlarına göre bir işçi sendikasının yetkili olduğunu tespit ettiğinde bu tespiti başvuru tarihinden itibaren kırk beş gün içinde ilgili taraflara bildirir.","A":"Yetkisi olmadığı hâlde yapılan bir toplu iş sözleşmesinin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde ilgililerce veya Bakanlıkça mahkemede dava yolu ile ileri sürülebilir.","D":"Talep aranmaksızın mahkeme, hükümsüzlük davası açıldığında toplu iş sözleşmesinin uygulanmasını dava sonuna kadar resen durdurur.","B":"Yetkisi olmadığı hâlde yapılan bir toplu iş sözleşmesinin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren altmış gün içinde ilgililerce veya Bakanlıkça mahkemede dava yolu ile ileri sürülebilir."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.45","metin":"MADDE 45 – (1) Yetki belgesi bulunmaksızın yapılan bir toplu iş sözleşmesinde taraflardan birinin veya ikisinin yetki şartlarına sahip olmadığı ve bu nedenle sözleşmenin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde, ilgililerce veya Bakanlıkça mahkemede dava yolu ile ileri sürülebilir. (2) Talep hâlinde mahkeme, toplu iş sözleşmesinin uygulanmasını dava sonuna kadar durdurabilir. Toplu görüşmeye çağrı"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.42","metin":"MADDE 42 – (1) Toplu iş sözleşmesi yapmak isteyen işçi sendikası Bakanlığa başvurarak yetkili olduğunun tespitini ister. İşveren sendikası veya sendika üyesi olmayan işveren de Bakanlığa başvurarak yetkili işçi sendikasının tespitini isteyebilir. (2) Bakanlık, kayıtlarına göre başvuru tarihi itibarıyla bir işçi sendikasının yetkili olduğunu tespit ettiğinde, başvuruyu, işyeri veya işletmedeki işçi ve üye sayısını, o işkolunda kurulu işçi sendikaları ile taraf olacak işveren sendikası veya sendika üyesi olmayan işverene altı iş günü içinde bildirir. (3) İşçi sendikasının yetki şartlarına sahip olmadığının ya da işyerinde yetki şartlarına sahip bir işçi sendikasının bulunmadığının tespiti hâlinde, bu bilgiler sadece başvuruyu yapan tarafa bildirilir. (4) Sigortalılığın başlangıcı ile sona ermesine ilişkin bildirimlerden yasal süresi içinde Sosyal Güvenlik Kurumuna yapılmayanlar, yetkili işçi sendikasının tespitinde dikkate alınmaz. (5) Yetki tespiti ile ilgili usul ve esaslar Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir. Yetki itirazı7"}],"hakem":"Soru 6356 s.K. m.45/1\u0027de yer alan yetkisiz toplu iş sözleşmesinin hükümsüzlüğü ve dava süresi kuralını doğru olarak yansıtan A seçeneği DOĞRU olup, kural kaynak metinde açıkça desteklenmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Dava hakkını yalnız Bakanlığa vermişsin ama kanun ilgili taraflara da dava açma hakkı veriyor.","E":"Yetki tespiti bildirim süresiyle hükümsüzlük dava süresini karıştırmışsın; bildirim altı iş günü, dava süresi kırk beş gündür.","D":"Mahkemenin durdurmasını resen yapacağını sanmışsın ama kanun açıkça taraflardan talep gelmişse yapabilir diyor.","B":"Altmış gün yazılmış ama kanun kırk beş gün diyor; başka bir toplu iş uyuşmazlığı süresiyle karıştırılmış."},"dogru":"Yetkisiz yapılan toplu iş sözleşmesinin hükümsüzlüğü, Bakanlık durumu tespit ettikten sonra kırk beş gün içinde hem işçi sendikası gibi ilgili taraflar hem de Bakanlık mahkemeye dava açabilir.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 45. madde","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 45. madde","tanim":"Yetkisiz tarafça yapılan toplu iş sözleşmesinin hukuki geçerliliği olmadığını mahkemede ileri sürmek ve iptalini istenmek için açılan davadır.","ad":"Hükümsüzlük davası"},{"kaynak":"Sendikalar ve TİS K. 42. madde","tanim":"Bakanlık tarafından toplu iş sözleşmesi yapacak işçi sendikasının kanunun şartlarını karşılayıp karşılamadığının belirlenmesidir.","ad":"Yetki tespiti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre, yetki şartlarına sahip olmayan tarafça yapılan toplu iş sözleşmesinin hükümsüzlüğü ve yetki tespiti sürecine ilişkin aşağıdaki ifadelerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-zor/kp-16","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.45/1-2, m.42/2","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Bir tekstil fabrikasında yetki belgesi olmayan bir işçi sendikası, işverenle 1 Mart 2024\u0027te toplu iş sözleşmesi imzalıyor.","anlatim":"Bakanlık incelemede bu sendikanın yetki şartını taşımadığını görüyor ve durumu 10 Nisan 2024\u0027te tespit ediyor. Şimdi bu sözleşmenin hükümsüzlüğü nasıl ileri sürülecek, onu çözeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 6356 sayılı Kanun m.45/1\u0027e göre Bakanlıkça tespitten itibaren kırk beş gün içinde ilgililer veya Bakanlık dava açabilir.","anlatim":"10 Nisan tespitinden sonra kırk beş günlük süre işlemeye başlar, bu süre içinde dava açılmazsa hak düşer. Şimdi beş ifadeyi bu olayın rakamlarıyla tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"6356 s.K. m.45/1","karar":"doğru","anlatim":"Evet, m.45/1 tam olarak bunu söylüyor; süre kırk beş gün, dava hakkı ilgililerde ve Bakanlıkta. Bu olayda avukat doğru hesap yapmış.","formul":"Şık A: Fabrikadaki işveren avukatı \u002710 Nisan\u0027dan itibaren kırk beş gün içinde dava açabiliriz\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"6356 s.K. m.45/1","karar":"yanlış","anlatim":"Hayır, m.45/1\u0027de süre açıkça kırk beş gündür, altmış gün bu maddede geçmez. Muhasebeci başka bir süreçle karıştırıyor.","formul":"Şık B: Muhasebeci \u0027yanlış hatırlıyorsun, süre altmış gün\u0027 diyor, ona katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"6356 s.K. m.45/1","karar":"yanlış","anlatim":"Hayır, m.45/1 \u0027ilgililerce veya Bakanlıkça\u0027 diyor, yani fabrikadaki taraflar da dava açabilir. İşveren sendikası kendi hakkını gözden kaçırıyor.","formul":"Şık C: İşveren sendikası \u0027bu davayı sadece Bakanlık açabilir, biz açamayız\u0027 diye düşünüyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"6356 s.K. m.45/2","karar":"yanlış","anlatim":"Hayır, m.45/2 durdurmayı \u0027talep hâlinde\u0027 mahkemenin takdirine bırakır, resen durdurma yoktur. İşçi burada yanlış bir güvence taşıyor.","formul":"Şık D: Fabrika işçisi \u0027dava açılınca mahkeme sözleşmeyi otomatik durdurur\u0027 diyor, buna güvenir misin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"6356 s.K. m.42/2","karar":"yanlış","anlatim":"Hayır, bildirim süresi m.42/2\u0027ye göre altı iş günüdür, kırk beş gün başka bir işleme yani dava süresine aittir. Memur iki maddeyi birbirine karıştırıyor.","formul":"Şık E: Bakanlık memuru \u002710 Nisan tespitini kırk beş gün içinde taraflara bildiririm\u0027 diyor, bu doğru mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Bu olayda tek doğru cümle, kırk beş günlük süreyi ve ilgililer-Bakanlık dava ehliyetini birebir aktaran A\u0027dır. Kendine hep şunu sor: bu cümledeki süre ve taraf sayısı, madde metninde aynen mi yazıyor?","doldur":[]}],"anahtar":[{"ornek":"bakanlıkça","kok":"bakanl"},{"ornek":"ilgililerce","kok":"ilgili"},{"ornek":"tespitten","kok":"tespit"},{"ornek":"içinde","kok":"içinde"},{"ornek":"durdurabilir","kok":"durdur"},{"ornek":"sözleşmesinin","kok":"sözleş"}],"konuGiris":{"harita":"Ne zaman ileri sürülür: Bakanlıkça yetkisizlik durumunun tespitinden itibaren kırk beş gün içinde. Nasıl ileri sürülür: ilgililerce veya Bakanlıkça mahkemede dava açılarak. Ne olur: mahkeme talep halinde sözleşmenin uygulanmasını dava sonuna kadar durdurabilir.","desen":"Sınav genelde kırk beş günlük süreyi başka bir süreyle (altı iş günü gibi) karıştırtarak sorar. Bazı seçenekler dava açma hakkını yalnızca Bakanlığa vererek ilgilileri dışlar, bu yanlıştır. Bu soru m.45/1 ve m.45/2 hükümlerinin karıştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Toplu iş sözleşmesi yapabilmek için sendikanın taşıması gereken çoğunluk koşulu","ad":"Yetki şartı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tespitten itibaren dava açılabilecek kırk beş günlük yasal süre","ad":"Hükümsüzlük davası süresi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Mahkemenin talep üzerine sözleşme uygulamasını geçici olarak durdurması","ad":"Durdurma kararı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Yetkisizlik durumunun Bakanlıkça belirlenmesi işlemi","ad":"Bakanlık tespiti","kim":"kanun sabitler"}],"sinavda":"Soruda yetkisiz tarafça yapılan toplu iş sözleşmesinin hükümsüzlüğüne ilişkin süre ve dava hakkı sorulur.","panel_ornek":"Bir apartman yöneticiliği seçimi, aslında oy çoğunluğu şartını taşımayan biri tarafından yapılsa, diğer daire sahipleri bunu fark ettikten sonra belirli bir süre içinde itiraz edebilir. Örneğin 10 gün içinde itiraz etmezlerse seçim geçerli sayılabilir. Süre kaçırılırsa hak da kaçmış olur.","ornek":"Bir apartman yöneticiliği seçimi, aslında oy çoğunluğu şartını taşımayan biri tarafından yapılsa, diğer daire sahipleri bunu fark ettikten sonra belirli bir süre içinde itiraz edebilir. Örneğin 10 gün içinde itiraz etmezlerse seçim geçerli sayılabilir. Süre kaçırılırsa hak da kaçmış olur.","yontemler":"Kırk beş günlük süre ile altı iş günlük bildirim süresini karıştırmamak en kritik noktadır.","nedir":"Sendika yetkisi düşmesi, toplu iş sözleşmesini imzalayan tarafın yasal yetkiyi kaybetmesi ya da hiç taşımamasıdır. Sınav bu durumda hükümsüzlüğün nasıl ve hangi sürede ileri sürüleceğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Kapsam Tuzağı","metin":"dava açma yetkisini yalnız Bakanlığa hasrediyorsun. Doğrusu: madde 45/1\u0027e göre dava, ilgililerce veya Bakanlıkça açılabilir; ilgililerin dava hakkı vardır."},"E":{"ad":"Süre Karıştırma Tuzağı","metin":"yetki tespiti bildirim süresini hükümsüzlük dava süresiyle aynı sanıp kırk beş gün yazıyorsun. Doğrusu: madde 42/2\u0027ye göre bu bildirim süresi altı iş günüdür, kırk beş gün madde 45\u0027teki dava süresidir."},"D":{"ad":"Şart Atlama Tuzağı","metin":"mahkemenin durdurma kararını resen verdiğini sanıyorsun. Doğrusu: madde 45/2 açıkça \u0027talep hâlinde\u0027 demektedir, talep olmadan mahkeme durdurma kararı veremez."},"B":{"ad":"Süre Tuzağı","metin":"kırk beş günlük süreyi altmış gün sanıyorsun, başka bir toplu iş uyuşmazlığı süresiyle karıştırıyorsun. Doğrusu: madde 45/1\u0027de süre açıkça kırk beş gündür."}},"celdiriciYol":{"C":"Madde 45/1\u0027deki \u0027ilgililerce veya Bakanlıkça\u0027 ifadesindeki \u0027ilgililerce\u0027 kısmı çıkarılarak yalnız Bakanlığa dava hakkı tanınmış gibi yazılmıştır (kapsam daraltma).","E":"Madde 42/2\u0027deki altı iş günlük bildirim süresi, madde 45/1\u0027deki kırk beş günlük dava süresiyle karıştırılmıştır (madde karıştırma).","D":"Madde 45/2\u0027deki \u0027talep hâlinde\u0027 şartı atlanarak mahkemenin resen karar verdiği yazılmıştır (şart atlama).","B":"Kırk beş günlük hükümsüzlük dava süresi yerine altmış günlük başka bir toplu iş sözleşmesi süresiyle karıştırılarak yazılmıştır (süre tuzağı)."},"hap":"6356 sayılı Kanunda yetkisiz yapılan toplu iş sözleşmesinin hükümsüzlüğü, Bakanlıkça tespitten itibaren kırk beş gün içinde ilgililerce veya Bakanlıkça dava yoluyla ileri sürülür ve mahkeme yalnız talep hâlinde uygulamayı durdurabilir.","teshis":{"C":{"gercek":"m.45/1 \u0027ilgililerce veya Bakanlıkça\u0027 der, dava açma hakkı taraflara da tanınmıştır.","ayirt":"Madde \u0027veya\u0027 bağlacıyla birden fazla dava açma yetkilisi sayıyor mu?","paragraf":"6356 s.K. m.45/1","yanilgi":"Dava açma yetkisinin idari bir işlem olduğunu düşünüp yalnız Bakanlığa ait sanıyorsun."},"E":{"gercek":"m.42/2 bildirim süresini altı iş günü olarak belirler; kırk beş gün ise m.45\u0027teki farklı bir sürece aittir.","ayirt":"Bu süre hangi maddede hangi işlem için düzenlenmiş, iki maddeyi karıştırıyor muyum?","paragraf":"6356 s.K. m.42/2","yanilgi":"Yetki tespiti bildirim süresini hükümsüzlük dava süresiyle aynı sayıp kırk beş gün yazıyorsun."},"A":{"gercek":"6356 s.K. m.45/1 hükmü, süreyi kırk beş gün, dava ehliyetini ilgililer ve Bakanlık olarak birebir düzenler.","ayirt":"Madde metnindeki süre ve taraf ifadesi cümlede aynen mi korunmuş?","paragraf":"6356 s.K. m.45/1","yanilgi":"Bu şıkkı ele alan öğrenci, maddedeki süre ile taraf sayısının bir tuzak olduğunu düşünüp başka şıkka kayabiliyor."},"D":{"gercek":"m.45/2 durdurma kararını \u0027talep hâlinde\u0027 verilecek şekilde düzenler, resen yetki tanımaz.","ayirt":"Madde metninde durdurma kararından önce bir şart cümlesi var mı?","paragraf":"6356 s.K. m.45/2","yanilgi":"Mahkemenin kamu düzenini korumak için resen harekete geçtiğini varsayıyorsun."},"B":{"gercek":"m.45/1\u0027deki süre açıkça kırk beş gündür, altmış gün başka bir sürece (arabuluculuk sonrası grev kararı) aittir.","ayirt":"Bu süre hangi maddede, hangi işlem için yazılıyor, karıştırdığım başka süreyle aynı mı?","paragraf":"6356 s.K. m.45/1","yanilgi":"Toplu iş uyuşmazlıklarında sık geçen altmış günlük süreleri (grev kararı gibi) bu maddeyle karıştırıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"Kapsam Karıştırma Tuzağı: olumlu tespitteki geniş bildirim yükümlülüğü, olumsuz tespite de uygulanır sanılır. Doğrusu: m.42/3\u0027e göre yetki şartlarının bulunmadığının tespiti yalnız başvuruyu yapan tarafa bildirilir, diğer taraflara bildirilmez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"İki fıkranın aynı konuyu (olumlu/olumsuz tespit) farklı muhataplarla düzenlediği maddelerde şıkları maddenin fıkra numarasıyla eşleştirerek kontrol et.","konu":"sendika yetkisi düşmesi","tablo":null,"siklar":{"C":"Yetkisiz toplu iş sözleşmesine ilişkin davada, talep hâlinde mahkeme sözleşmenin uygulanmasını dava sonuna kadar durdurabilir.","E":"Bir işçi sendikasının yetki şartlarına sahip olmadığının tespiti hâlinde bu bilgi, tıpkı olumlu tespitte olduğu gibi işkolundaki tüm ilgili taraflara bildirilir.","A":"Sigortalılığın başlangıcı ile sona ermesine ilişkin bildirimlerden yasal süresi içinde Sosyal Güvenlik Kurumuna yapılmayanlar, yetkili işçi sendikasının tespitinde dikkate alınmaz.","D":"Bakanlık, bir işçi sendikasının yetkili olduğunu tespit ettiğinde bu bildirimi o işkolundaki işçi sendikaları ile taraf işverene altı iş günü içinde yapar.","B":"Yetki belgesi bulunmaksızın yapılan toplu iş sözleşmesinin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde ilgililerce veya Bakanlıkça mahkemede dava yolu ile ileri sürülebilir."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.45","metin":"MADDE 45 – (1) Yetki belgesi bulunmaksızın yapılan bir toplu iş sözleşmesinde taraflardan birinin veya ikisinin yetki şartlarına sahip olmadığı ve bu nedenle sözleşmenin hükümsüzlüğü, Bakanlıkça durumun tespitinden itibaren kırk beş gün içinde, ilgililerce veya Bakanlıkça mahkemede dava yolu ile ileri sürülebilir. (2) Talep hâlinde mahkeme, toplu iş sözleşmesinin uygulanmasını dava sonuna kadar durdurabilir. Toplu görüşmeye çağrı"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.42","metin":"MADDE 42 – (1) Toplu iş sözleşmesi yapmak isteyen işçi sendikası Bakanlığa başvurarak yetkili olduğunun tespitini ister. İşveren sendikası veya sendika üyesi olmayan işveren de Bakanlığa başvurarak yetkili işçi sendikasının tespitini isteyebilir. (2) Bakanlık, kayıtlarına göre başvuru tarihi itibarıyla bir işçi sendikasının yetkili olduğunu tespit ettiğinde, başvuruyu, işyeri veya işletmedeki işçi ve üye sayısını, o işkolunda kurulu işçi sendikaları ile taraf olacak işveren sendikası veya sendika üyesi olmayan işverene altı iş günü içinde bildirir. (3) İşçi sendikasının yetki şartlarına sahip olmadığının ya da işyerinde yetki şartlarına sahip bir işçi sendikasının bulunmadığının tespiti hâlinde, bu bilgiler sadece başvuruyu yapan tarafa bildirilir. (4) Sigortalılığın başlangıcı ile sona ermesine ilişkin bildirimlerden yasal süresi içinde Sosyal Güvenlik Kurumuna yapılmayanlar, yetkili işçi sendikasının tespitinde dikkate alınmaz. (5) Yetki tespiti ile ilgili usul ve esaslar Bakanlıkça çıkarılacak bir yönetmelikle düzenlenir. Yetki itirazı7"}],"hakem":"Doğru sık m.42/3\u0027e dayanan kurala uygundur: yetki şartlarının bulunmadığının tespiti yalnız başvuruyu yapan tarafa bildirilir, işkolundaki tüm ilgili taraflara bildirilmez."},"kayitlar":[],"sade":{"siklar":{"C":"Mahkeme, taraf talep ettiğinde sözleşmenin uygulanmasını dava bitene kadar durdurmaya yetkilidir. Durdurma otomatik değil, talep ve mahkeme takdirine bağlıdır.","A":"Sosyal Güvenlik Kurumuna kanuni sürede bildirilmemiş sigortalılık kayıtları, yetki hesabından çıkarıldığı için yetki tespitinde dikkate alınmaz. Bu kural doğru uygulanmıştır.","D":"Yetkili sendika tespit edildiğinde, işkolundaki tüm diğer sendikalar ile işveren tarafa altı iş günü içinde bildirim yapılması kanunen öngörülen yükümlülüktür.","B":"Bakanlık hükümsüzlüğü tespit ettikten sonra kırk beş gün içinde mahkemede dava açma hakkı vardır. Bu süre uygun şekilde açıklanmıştır."},"dogru":"Yetkisiz sendikanın tespit edilmesi durumunda, bu bilgi yalnızca başvuran tarafa iletilir. Olumlu tespitte tüm ilgili taraflara (diğer sendikalar, işveren) bildirim yapılırken, olumsuz tespitte bu geniş bildirim yükümlülüğü yoktur.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 42. madde 3. fıkra","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 42. madde","tanim":"Bakanlığın, toplu iş sözleşmesi yapmak isteyen işçi sendikasının kanuni şartları taşıyıp taşımadığını resmi olarak belirleme işlemidir.","ad":"yetki tespiti"},{"kaynak":"Sendikalar ve TİS K. 45. madde","tanim":"Yetki belgesi olmaksızın veya yetki şartlarına sahip olmayan taraflar tarafından yapılan toplu iş sözleşmesidir ve hükümsüzdür.","ad":"yetkisiz toplu iş sözleşmesi"},{"kaynak":"Sendikalar ve TİS K. 42. madde","tanim":"Bakanlıkça bir işçi sendikasının yetkili olduğunun tespit edilmesi durumunda, bu bildirimin işkolundaki tüm sendikaları ve işveren tarafını kapsayan geniş kapsamlı bildirim yapılmasıdır.","ad":"olumlu yetki tespiti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027nun yetki tespiti ve yetkisiz toplu iş sözleşmesine ilişkin hükümleri birlikte değerlendirildiğinde, aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-16","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.42, m.45","dogru":"E","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[],"anahtar":[{"ornek":"bildirilir","kok":"bildir"},{"ornek":"tespitinde","kok":"tespit"},{"ornek":"olumsuz","kok":"olumsu"},{"ornek":"olumlu","kok":"olumlu"},{"ornek":"başvuru","kok":"başvur"},{"ornek":"yalnız","kok":"yalnız"}],"konuGiris":{"harita":"Yetki ne zaman test edilir: sendika Bakanlığa başvurup yetkili olduğunun tespitini istediğinde. Yetkisizlik nasıl ileri sürülür: tespitten itibaren belirli süre içinde mahkemede dava açılarak. Sonuç nasıl kaydedilir: mahkeme talep üzerine sözleşmenin uygulanmasını dava sonuna kadar durdurabilir.","desen":"Sınav, yetkisiz sözleşmenin ileri sürülme süresi ile bu talebin sonuçlarını karıştırır şekilde soru üretir; süre başlangıcının tespitten mi başvuru tarihinden mi hesaplanacağı tuzaktır. Sözleşmenin kendiliğinden değil ancak dava yoluyla geçersiz sayılabileceği noktası sıkça atlanır. Bu soru m.45 ve m.42 hükümlerinin birlikte değerlendirilmesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"bir işçi sendikasının toplu sözleşme yapmaya yeterli üye sayısına sahip olduğunun belirlenmesi","ad":"yetki tespiti","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"yetki tespitine karşı ilgili tarafların mahkemeye başvurarak itiraz etmesi","ad":"yetki itirazı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"yetkisiz yapılan sözleşmenin geçersizliğinin mahkemede ileri sürülmesi","ad":"hükümsüzlük davası","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"dava sonuçlanana kadar sözleşmenin geçici olarak askıya alınması","ad":"uygulamanın durdurulması","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda yetki tespiti ve yetkisiz sözleşmeye ilişkin hükümler birlikte verilir, hangi ifadenin yanlış olduğu istenir.","panel_ornek":"Bir apartman yönetimi, toplantıda karar alabilmek için kat maliklerinin yarısından fazlasının imzasını arar; imza yetmezse alınan karar geçersiz sayılır ve itiraz edilebilir. Bu itiraz için on beş gün gibi kısa bir süre tanınır. Süre geçerse karar kesinleşir ve uygulanmaya devam eder.","ornek":"Bir apartman yönetimi, toplantıda karar alabilmek için kat maliklerinin yarısından fazlasının imzasını arar; imza yetmezse alınan karar geçersiz sayılır ve itiraz edilebilir. Bu itiraz için on beş gün gibi kısa bir süre tanınır. Süre geçerse karar kesinleşir ve uygulanmaya devam eder.","yontemler":"Metni madde madde karşılaştırıp hangi ifadenin kanun metnine ters düştüğünü bulmak gerekir; süre ve yetki mercii ayrımına dikkat edilmelidir.","nedir":"Sendika yetkisi, bir işçi sendikasının toplu iş sözleşmesi yapabilmesi için gereken üye çoğunluğu şartını taşıyıp taşımadığının belirlenmesidir. Sınav, bu yetkinin nasıl tespit edildiğini ve yetkisiz yapılan sözleşmenin sonucunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Kural","metin":"m.45/2\u0027ye göre mahkeme, talep hâlinde sözleşmenin uygulanmasını dava sonuna kadar durdurabilir. Zorunluluk Tuzağı: durdurmanın otomatik gerçekleştiği sanılır. Doğrusu: durdurma talebe bağlı ve mahkemenin takdirindedir, ifade doğrudur."},"A":{"ad":"Kural","metin":"6356 sayılı Kanun m.42/4\u0027e göre süresi içinde Sosyal Güvenlik Kurumuna bildirilmeyen sigortalılık kayıtları yetki tespitinde dikkate alınmaz. Bildirim Eksikliği Tuzağı: bu eksikliğin idari para cezasıyla sınırlı kalacağı düşünülür. Doğrusu: madde bu kaydı doğrudan yetki hesabından çıkarır, ifade doğrudur."},"D":{"ad":"Ne soruluyor","metin":"beş ifadeden hangisinin kanuna aykırı olduğu soruluyor. Kural: m.42/2\u0027ye göre olumlu yetki tespiti, o işkolundaki işçi sendikaları ile taraf işverene altı iş günü içinde bildirilir. Hesap: madde metninde bildirimin muhatapları ve süresi açıkça sayılmıştır. Doğrusu: bu bildirim yükümlülüğü altı iş günlük süreyle ve belirtilen muhataplarla sınırlı olarak doğru şekilde ifade edilmiştir."},"B":{"ad":"Kural","metin":"m.45/1\u0027e göre yetkisiz yapılan toplu iş sözleşmesinin hükümsüzlüğü, Bakanlıkça tespitten itibaren kırk beş gün içinde dava yoluyla ileri sürülür. Süre Karıştırma Tuzağı: bu süre yetki itirazı süresiyle karıştırılır. Doğrusu: kırk beş gün hükümsüzlük davasına özgü süredir, ifade doğrudur."}},"celdiriciYol":{},"hap":"Yetki tespitinde olumlu sonuç geniş çevreye (ilgili sendikalar ve işveren), olumsuz sonuç yalnız başvuru sahibine bildirilir.","teshis":{"C":{"gercek":"m.45/2 durdurmayı talep şartına bağlar, mahkemenin takdir yetkisi vardır.","ayirt":"Bu sonuç talep olmadan da gerçekleşir mi?","paragraf":"m.45/2","yanilgi":"Mahkemenin uygulamayı durdurmasının kendiliğinden ve zorunlu olduğunu düşünüyorsun."},"E":{"gercek":"m.42/3 olumsuz tespitin yalnız başvuruyu yapan tarafa bildirileceğini özel olarak düzenler; m.42/2\u0027deki geniş bildirim yalnız olumlu tespite özgüdür.","ayirt":"Bu bildirim olumlu tespit mi, olumsuz tespit mi?","paragraf":"m.42/2-3","yanilgi":"Yetki yokluğunun tespitinin de, yetki varlığının tespiti gibi geniş çevreye duyurulacağını sanıyorsun."},"A":{"gercek":"6356 sayılı Kanun m.42/4 açıkça bu bildirimlerin yetki tespitinde dikkate alınmayacağını söyler.","ayirt":"Bu eksik bildirim sayı hesabına mı, cezaya mı bağlanıyor?","paragraf":"m.42/4","yanilgi":"SGK\u0027ya geç bildirimin yalnız idari yaptırım doğuracağını, yetki hesabını etkilemeyeceğini sanıyorsun."},"D":{"gercek":"m.42/2 olumlu tespitte bildirimin işkolundaki işçi sendikalarına ve taraf işverene de yapılacağını düzenler.","ayirt":"Bu bildirim yalnız başvurana mı yoksa geniş bir çevreye mi gidiyor?","paragraf":"m.42/2","yanilgi":"Altı iş günlük bildirimin yalnız başvuru sahibine yapıldığını sanıyorsun."},"B":{"gercek":"m.45/1 bu süreyi açıkça hükümsüzlük iddiasının dava yoluyla ileri sürülmesine tahsis eder.","ayirt":"Bu süre hangi davaya, itiraza mı hükümsüzlüğe mi ait?","paragraf":"m.45/1","yanilgi":"Kırk beş günlük süreyi yetki itirazı süresiyle aynı zannediyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 109"},"kural":"5510 sayılı Kanun m.5/g\u0027ye göre bu işçiler istedikleri takdirde Türkiye\u0027de ikamet şartı ile 50 nci maddenin ikinci fıkrasının (a) bendindeki şartlar ARANMAKSIZIN isteğe bağlı sigorta hükümlerine tabi olur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 109","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İstisna cümlelerinde \u0027aranmaksızın\u0027 ile \u0027aranarak\u0027 ifadesinin yerini şıkta değiştirip değiştirmediğini tek tek kontrol et.","konu":"sigortalı sayilmayanlar","tablo":{"satirlar":[["A) Bu işçiler 4 üncü maddenin birinci fıkrasının (a) bendi …","5510 s.K. m.5/g, 1. cümle","doğru ifade"],["B) Bu işçilerin uzun vadeli sigorta kollarına tabi olmak is…","5510 s.K. m.5/g, 2. cümle","doğru ifade"],["C) Uzun vadeli sigorta kollarına isteğe bağlı tabi olan bu …","5510 s.K. m.5/g, 3. cümle","doğru ifade"],["D) Bu işçilerin uzun vadeli sigorta kollarına tabi olmak is…","5510 s.K. m.5/g, 2. cümle","YANLIŞ ifade"],["E) Bu kapsamda yurt dışındaki işyerlerinde çalışan sigortal…","5510 s.K. m.5/g, son cümle (6111 s.K. m.24 ek)","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Uzun vadeli sigorta kollarına isteğe bağlı tabi olan bu işçilerden, isteğe bağlı sigorta primi dışında ayrıca genel sağlık sigortası primi alınmaz.","E":"Bu kapsamda yurt dışındaki işyerlerinde çalışan sigortalıların ödedikleri isteğe bağlı sigorta primleri, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalılık sayılır.","A":"Bu işçiler 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılır ve haklarında kısa vadeli sigorta kolları ile genel sağlık sigortası hükümleri uygulanır.","D":"Bu işçilerin uzun vadeli sigorta kollarına tabi olmak istemeleri hâlinde, Türkiye\u0027de yasal ikamet şartı ile 50 nci maddenin iki
