<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".

   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. Koyu tema yalnız düğmeyle (data-theme="dark", tarayıcıda kc_tema) ya da ?tema=koyu ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}

.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}
#akis{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.kart{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;max-width:560px;margin:0 auto}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.78em;color:var(--dim);margin-bottom:8px}
.noktalar{display:flex;gap:5px}.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--cizgi);display:block}.noktalar i.ok{background:var(--yesil)}.noktalar i.yan{background:var(--kirmizi)}.noktalar i.simdi{outline:2px solid var(--mavi);outline-offset:1px}
.noktalar.cok{gap:3px;flex-wrap:wrap;max-width:58%;justify-content:center}.noktalar.cok i{width:5px;height:5px}
.tt.teori td:first-child{white-space:nowrap;font-weight:700;color:var(--dim);width:1%}
.sinavDil{font:inherit;font-size:.78em;color:var(--mavi);background:transparent;border:1px solid var(--cizgi);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer}
.sinavDilM{margin-top:6px;font-size:.86em;color:var(--dim);border-left:2px solid var(--cizgi);padding-left:8px}
.govde{flex:1;overflow-y:auto;padding-bottom:90px}
.rozet{display:inline-block;font-size:.72em;color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 50%,transparent);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}
.ipucu{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:.8em;pointer-events:none;animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.panel.acik{transform:translateY(0)}.tutamac{width:38px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 10px}
/* Cem 03.09 "gorunum boyle geliyor": KAPALI panel kartin altina (105%) kayiyor ve SONRAKI KARTIN ustune biniyordu.

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}

.ozet{font-size:.93em;margin:0 0 8px;line-height:1.45}.ozet b{color:var(--yesil)}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}

.cip2.ek{display:none}.cipler.acikEk .cip2.ek{display:inline-block}.cipler.acikEk .bDaha{color:var(--dim)}
.cipler .bDaha{border-style:dashed;color:var(--dim)}
.sek{display:none;margin-top:8px}.sek.acik{display:block;animation:gir .2s ease}
.panel{overscroll-behavior:contain}
.kavramL{margin:4px 0 8px;padding-left:18px}.kavramL li{margin:3px 0}.kavramL i{color:var(--dim);font-style:normal;font-size:.85em}
.panelBas{position:sticky;bottom:4px;display:block;margin:10px 0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:.84em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent)}

/* yanlis kutusu + hazirlik skoru */
.ustSag{display:flex;align-items:center;gap:6px}
.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}
.kutuEkran{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}.kutuEkran.acik{display:flex}
.kutuIc{background:var(--kart);width:min(100%,640px);max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 22px;border:1px solid var(--cizgi)}
@media(min-width:900px){.kutuEkran{align-items:center}.kutuIc{border-radius:18px}}
.kutuIc .basl{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}

.dersSat{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92em}.dersSat .bar{height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden}.dersSat .bar i{display:block;height:100%;background:var(--yesil)}
.kutuSat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.92em}
/* kaynak metni */
.kaynakAd{color:var(--mavi);font-weight:800;font-size:.85em;margin:8px 0 4px}.kaynakMetin{font-size:.9em;line-height:1.55;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px}.kaynakMetin mark{background:color-mix(in srgb,var(--altin) 35%,transparent);color:var(--yazi);padding:1px 2px;border-radius:3px}
/* sen anlat / t-hesabi / sinavda */
.ipnot{font-size:.84em;color:var(--dim);margin:2px 0 8px}
.anlatK{width:100%;background:var(--bg2);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 11px;font-size:.95em;font-family:inherit;resize:vertical}
.anlatSonuc{font-size:.92em;margin-top:8px;line-height:1.5}.anlatPuan{font-weight:800;font-size:1.05em;margin-bottom:4px}.anlatOrnek{margin-top:8px;border-left:4px solid var(--altin);padding:6px 10px;background:color-mix(in srgb,var(--altin) 8%,transparent);border-radius:0 8px 8px 0}
.tKutular{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:600px){.tKutular{grid-template-columns:1fr 1fr}}

.tGovde{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--yazi);min-height:88px}.tSol{border-right:2px solid var(--yazi);padding:6px 8px}.tSag{padding:6px 8px;text-align:right}

.cikmisK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.88em;color:var(--dim);line-height:1.45}.cikmisK .yil{display:inline-block;background:color-mix(in srgb,var(--mavi) 15%,transparent);color:var(--mavi);font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.85em}

.ogret{margin:4px 0 6px}.thpNot{font-size:.85em;color:var(--dim);margin:2px 0 8px}
.hesapK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.9em;line-height:1.45}.hesapK.yan{border-color:color-mix(in srgb,var(--kirmizi) 60%,transparent)}.hesapK.dog{border-color:color-mix(in srgb,var(--yesil) 60%,transparent)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.btn{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;font-size:.9em;cursor:pointer}.btn.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0}.btn.mavi{border-color:var(--mavi);color:var(--mavi)}
/* surukleme oyunu */

.oyun{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:20;overflow-y:auto}.oyun.acik{display:flex}

#akis,.govde,.tabloSar,.serit,.panel,.oyun{scrollbar-width:none}#akis::-webkit-scrollbar,.govde::-webkit-scrollbar,.tabloSar::-webkit-scrollbar,.serit::-webkit-scrollbar,.panel::-webkit-scrollbar,.oyun::-webkit-scrollbar{display:none}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

const SORULAR=[{"capa":{"kaynak":"SGS 2026/2 Soru 108"},"kural":"madde 17/3 uyarınca aynı işkolunda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok sendikaya üye olabilirken, madde 20/1 uyarınca bir sendika aynı zamanda yalnızca bir üst kuruluşa üye olabilir; aksi hâlde sonraki üyelik geçersizdir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 108","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 17\u0027deki işçi istisnasını madde 20\u0027deki üst kuruluş kuralına taşıma en sık düşülen tuzaktır, iki maddeyi ayrı oku.","konu":"sendika üyeliği","tablo":{"satirlar":[["A) Üst kuruluş üyeliğinden çekilme, üst kuruluşa yapılan bi…","m.20/2","YANLIŞ ifade"],["B) Aynı işkolunda farklı işverenlere ait işyerlerinde çalış…","m.20/1","YANLIŞ ifade"],["C) İşçi sendikasına üye olabilmek için on sekiz yaşını dold…","m.17/1","YANLIŞ ifade"],["D) Aynı işkolunda ve aynı zamanda farklı işverenlere ait iş…","m.17/3, m.20/1","doğru ifade"],["E) Aynı işkolunda ve aynı zamanda birden çok sendikaya üye …","m.17/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşçi sendikasına üye olabilmek için on sekiz yaşını doldurmuş ve işçi sayılıyor olmak gerekir.","E":"Aynı işkolunda ve aynı zamanda birden çok sendikaya üye olan işçinin bu sendikalara ilişkin tüm üyelikleri geçersiz sayılır.","A":"Üst kuruluş üyeliğinden çekilme, üst kuruluşa yapılan bildirim tarihinde derhal geçerlilik kazanır.","D":"Aynı işkolunda ve aynı zamanda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok işçi sendikasına üye olabilir; ancak bir sendika aynı anda yalnızca bir üst kuruluşa üye olabilir.","B":"Aynı işkolunda farklı işverenlere ait işyerlerinde çalışan işçiler için tanınan istisna, üst kuruluş üyeliği bakımından da geçerlidir ve bir sendika aynı anda birden fazla üst kuruluşa üye olabilir."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.17","metin":"MADDE 17 – (1) On beş yaşını dolduran ve bu Kanun hükümlerine göre işçi sayılanlar, işçi sendikalarına üye olabilir. (2) Bu Kanun anlamında işveren sayılanlar, işveren sendikalarına üye olabilir. (3) Sendikaya üye olmak serbesttir. Hiç kimse sendikaya üye olmaya veya olmamaya zorlanamaz. İşçi veya işverenler aynı işkolunda ve aynı zamanda birden çok sendikaya üye olamaz. Ancak aynı işkolunda ve aynı zamanda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok sendikaya üye olabilir. İşçi ve işverenlerin bu hükme aykırı şekilde birden çok sendikaya üye olmaları hâlinde sonraki üyelikler geçersizdir. (4) Bir işyerinde yardımcı işlerde çalışan işçiler de, işyerinin girdiği işkolunda kurulu bir sendikaya üye olabilir. (5) Sendikaya üyelik, Bakanlıkça sağlanacak elektronik başvuru sistemine e-Devlet kapısı üzerinden üyelik başvurusunda bulunulması ve sendika tüzüğünde belirlenen yetkili organın kabulü ile e-Devlet kapısı üzerinden kazanılır. Üyelik başvurusu, sendika tarafından otuz gün içinde reddedilmediği takdirde üyelik talebi kabul edilmiş sayılır. Haklı bir neden gösterilmeden üyelik başvurusu kabul edilmeyenler, bu kararın kendilerine tebliğinden itibaren otuz gün içinde dava açabilir. Mahkemenin kararı kesindir. Mahkemenin davacı lehine karar vermesi hâlinde üyelik, red kararının alındığı tarihte kazanılmış sayılır. Üyelik aidatı"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.20","metin":"MADDE 20 – (1) Üst kuruluş üyeliğine başvuru genel kurul kararına bağlıdır. Üst kuruluş üyeliği, tüzükte belirlenen yetkili organın kabulüyle kazanılır. Aynı zamanda birden fazla üst kuruluşa üye olunamaz. Aksi hâlde sonraki üyelikler geçersizdir. (2) Üst kuruluş üyeliğinden çekilme genel kurul kararına bağlıdır. Çekilme, üst kuruluşa bildirim tarihinden itibaren bir ay sonra geçerlilik kazanır. (3) Üst kuruluş üyeliğinden çıkarılma, üst kuruluş genel kurulu kararıyla olur. (4) Üye olma, üyelikten çekilme ve çıkarılma kararları, üst kuruluş tarafından bir ay içerisinde Bakanlığa bildirilir. Uluslararası işçi ve işveren kuruluşlarına üyelik"}],"hakem":"Dogru sikkin dayandigi her iki kural (m.17/3 ve m.20/1) kaynak metinde acikca yer almakta ve sorunun cevabini tam olarak desteklemektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Genel olarak on sekiz yaş erginlik sınırını sendika üyeliğine uygular. Doğrusu on beş yaşını dolduranlar işçi sendikasına üye olabilir.","E":"Çoklu üyelik durumunda tüm üyeliklerin geçersiz sayılacağını okur. Doğrusu yalnızca ilk üyelikten sonraki olanlar geçersizdir, ilk üyelik geçerli kalır.","A":"Çekilme bildirimi yapıldığında hemen geçerli olacağını düşünür. Doğrusu çekilme, bildirimin ardından bir ay sonra etkili hale gelir.","B":"İşçilerin çoklu üyelik hakkının sendikalar arası ilişkiye de uygulanacağını sanır. Doğrusu bir sendika hiçbir istisna olmaksızın yalnız bir üst kuruluşa üye olabilir."},"dogru":"Aynı işkolunda farklı işverenlere çalışan işçiler birden çok sendikaya üye olabilir. Ama bir sendika sadece bir üst kuruluşa üye olabilir. İşçi düzeyindeki çoklu üyelik izni, sendika düzeyinde geçmez.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 17. ve 20. maddelerine göre.","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 17. madde","tanim":"On beş yaşını dolduran ve işçi sayılan kişilerin, sendika tüzüğünün belirlediği yetkili organ tarafından kabul edilmesiyle e-Devlet üzerinden kazandığı statü.","ad":"İşçi sendikasına üyelik"},{"kaynak":"Sendikalar ve TİS K. 20. madde","tanim":"Bir sendikanın genel kurul kararıyla üst kuruluşa başvurması ve tüzükteki yetkili organ tarafından kabul edilmesiyle kazandığı üyelik ilişkisi.","ad":"Üst kuruluş üyeliği"},{"kaynak":"Sendikalar ve TİS K. 17. madde","tanim":"Bir işçi, aynı işkolunda birden fazla işverenin farklı işyerlerinde çalışıyorsa, her işyeri için ayrı sendikaya üye olabilir.","ad":"Aynı işkolunda farklı işverenlere ait işyerlerinde çalışan işçiler için istisna"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":["2026/1","2025/3","2025/2","2025/1","2016/1","2015/3"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre sendika üyeliği ve üst kuruluş üyeliğine ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-02","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.17/1, m.17/3, m.20/1, m.20/2","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: bir metal fabrikasında çalışan Kemal, aynı işkolunda hem A firmasında hem B firmasında yarı zamanlı çalışıyor ve iki ayrı işçi sendikasına üye oluyor; bu iki sendika da aynı üst kuruluşa mı yoksa farklı üst kuruluşlara mı üye olabilir tartışılıyor.","anlatim":"Kemal\u0027in iki sendikaya üyeliği tartışma konusu değil, asıl mesele sendikaların üst kuruluşla ilişkisi. Olay bize işçi düzeyi ile sendika düzeyinin farklı kurallara tabi olduğunu gösteriyor. Bu ayrımı beş ifadede tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: madde 17/3 işçiye çoklu sendika yasağına istisna tanır, madde 20/1 ise sendikaya çoklu üst kuruluş yasağını istisnasız koyar; şimdi beş ifadeyi Kemal\u0027in olayında tek tek deneyeceğiz.","anlatim":"Kural iki katmanlı: bir işçi şartlı olarak birden çok sendikaya üye olabilir ama bir sendika hiçbir şartla birden çok üst kuruluşa üye olamaz. Bu farkı unutursan hepsi karışır.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.20/2","karar":"yanlış","anlatim":"Hayır, olayda bildirim yapılsa bile üyelik o an bitmiyor. Madde 20/2 bir aylık bekleme süresi koyuyor. Çekilme ancak bildirimden bir ay sonra geçerlilik kazanır.","formul":"Şık A: Kemal\u0027in sendikası üst kuruluştan çekilme bildirimi yaptığı gün çekilme derhal geçerli olur mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.20/1","karar":"yanlış","anlatim":"Hayır, olayda işçiye tanınan çoklu üyelik hakkı sendikaya taşınmıyor. Madde 20/1 istisnasız biçimde tek üst kuruluş kuralı koyuyor. Sendika iki üst kuruluşa birden üye olamaz.","formul":"Şık B: Kemal\u0027in sendikası, işçi düzeyindeki istisnaya dayanarak aynı anda iki üst kuruluşa üye olabilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.17/1","karar":"yanlış","anlatim":"Evet olabilir ama şart on sekiz değil on beştir. Madde 17/1 on beş yaşını dolduran ve işçi sayılanı yeterli görür. Bu şık yaşı yanlış yazdığı için hatalı.","formul":"Şık C: Kemal on sekiz yaşında olmasa, örneğin on altı yaşında olsa yine de sendikaya üye olabilir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.17/3, m.20/1","karar":"doğru","anlatim":"Evet, tam olay bu. Madde 17/3 işçiye istisna tanırken madde 20/1 sendikaya istisnasız tek üst kuruluş kuralı koyuyor. İki katman birbirinden bağımsız çalışıyor.","formul":"Şık D: Kemal aynı işkolunda farklı işverenlerde çalıştığı için iki sendikaya üye olabilir, ama bu iki sendikadan her biri yine de sadece bir üst kuruluşa üye olabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.17/3","karar":"yanlış","anlatim":"Hayır, sadece sonraki üyelik geçersiz sayılır. Madde 17/3 ilk üyeliği korur, sonrakini iptal eder. Bütün üyelikleri silmek kanunun sözüne aykırı olur.","formul":"Şık E: Kemal aynı işkolunda aynı anda iki sendikaya üye olsa, kuraldışı bu iki üyeliğin ikisi de mi geçersiz sayılır?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Kemal\u0027in olayı sana işçi düzeyi ile sendika düzeyinin ayrı kurallara bağlı olduğunu öğretti. Kendine hep şunu sor: bu istisna işçiye mi yoksa sendikaya mı ait?","doldur":[]}],"anahtar":[{"ornek":"sendika","kok":"sendik"},{"ornek":"kuruluşa","kok":"kurulu"},{"ornek":"istisnası","kok":"istisn"},{"ornek":"üyelik","kok":"üyelik"},{"ornek":"olabilir","kok":"olabil"},{"ornek":"düzeyinde","kok":"düzeyi"}],"konuGiris":{"harita":"Ne zaman geçersiz sayılır: Aynı işkolunda aynı anda birden çok sendikaya üye olunduğunda sonraki üyelik geçersiz sayılır. Nasıl kazanılır: Üyelik, e-Devlet üzerinden başvuru ve yetkili organ kabulüyle kazanılır. Nasıl kaydedilir: Otuz gün içinde reddedilmeyen başvuru kabul edilmiş sayılır ve bu şekilde kayda geçer.","desen":"Sınav genellikle \u0027aynı işkolunda birden çok üyelik geçerli midir\u0027 veya \u0027üyelik ne zaman kazanılır\u0027 sorularıyla tuzak kurar. Bazı seçenekler otuz günlük ret süresini veya farklı işverenlere ait işyerlerinde çalışma istisnasını çarpıtır. Bu soru m.17 ve m.20\u0027deki üyelik kazanma ve çokluk yasağı hükümlerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"On beş yaşını dolduran işçi sayılanların sendikaya katılma hakkı","ad":"İşçi sendikası üyeliği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Aynı işkolunda aynı anda tek sendikaya üye olunabilmesi kuralı","ad":"Birden çok üyelik yasağı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Sendikanın başvuruyu reddedebileceği otuz günlük süre","ad":"Üyelik başvurusu ret süresi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Üst kuruluş tüzüğündeki yetkili organın üyeliği onaylaması","ad":"Üst kuruluş üyeliği kabulü","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soru kökünde sendika ve üst kuruluş üyeliğine dair bir durum verilir, doğru hükmü seçmeniz istenir.","panel_ornek":"Bir arkadaşın aynı anda iki farklı spor kulübüne üye olmak istiyor ama kulüp tüzüğü buna izin vermiyor. Sonradan yaptığı ikinci başvuru geçersiz sayılıyor, sadece ilk üyeliği geçerli kalıyor. Yani aynı anda iki yerde birden tam üyelik olmuyor.","ornek":"Bir arkadaşın aynı anda iki farklı spor kulübüne üye olmak istiyor ama kulüp tüzüğü buna izin vermiyor. Sonradan yaptığı ikinci başvuru geçersiz sayılıyor, sadece ilk üyeliği geçerli kalıyor. Yani aynı anda iki yerde birden tam üyelik olmuyor.","yontemler":"Metni madde madde karşılaştırarak hangi seçeneğin kanun lafzına birebir uyduğunu bulun; \u0027ancak\u0027 ve \u0027aksi hâlde\u0027 gibi istisna ifadelerine dikkat edin.","nedir":"Bu konu, işçi ve işverenlerin sendika ile üst kuruluşlara üyelik kural ve sınırlarını düzenler. Sınav, üyeliğin nasıl kazanıldığını ve hangi hallerde geçersiz sayıldığını bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Yaş Tuzağı","metin":"öğrenci iş hukukundaki genel erginlik yaşını (on sekiz) sendika üyeliğine uygular. Doğrusu: madde 17/1 açıkça on beş yaşını dolduran ve işçi sayılanların işçi sendikasına üye olabileceğini belirtir."},"E":{"ad":"Kapsam Tuzağı","metin":"öğrenci \u0027sonraki üyelikler geçersizdir\u0027 ifadesini tüm üyeliklerin geçersizliği şeklinde okur. Doğrusu: madde 17/3 yalnızca ilk üyelikten sonraki üyeliklerin geçersiz sayılacağını düzenler, ilk üyelik geçerliliğini korur."},"A":{"ad":"Zamanlama Tuzağı","metin":"öğrenci bildirimle birlikte çekilmenin anında sonuç doğurduğunu düşünür. Doğrusu: madde 20/2 uyarınca çekilme, bildirim tarihinden itibaren bir ay sonra geçerlilik kazanır."},"B":{"ad":"İstisnayı Taşıma Tuzağı","metin":"öğrenci işçi için tanınan çoklu üyelik istisnasının sendika-üst kuruluş ilişkisine de uygulanacağını sanır. Doğrusu: madde 20/1 hiçbir istisna öngörmeden bir sendikanın aynı anda birden fazla üst kuruluşa üye olamayacağını düzenler."}},"celdiriciYol":{},"hap":"İşçi düzeyinde farklı işverenlerde çalışanlara çoklu sendika üyeliği istisnası tanınır, ama bir sendika aynı anda yalnızca bir üst kuruluşa üye olabilir; bu istisnasızdır.","teshis":{"C":{"gercek":"Madde 17/1 işçi sendikasına üyelik için on beş yaşını doldurmuş ve işçi sayılmayı yeterli görür.","ayirt":"Kanun metninde hangi yaş açıkça yazılı?","paragraf":"m.17/1","yanilgi":"Sendika üyeliği için genel medeni erginlik yaşı olan on sekizi arıyorsun."},"E":{"gercek":"Madde 17/3 yalnızca sonraki üyelikleri geçersiz sayar, önceki (ilk) üyelik geçerliliğini korur.","ayirt":"Geçersizlik hangi üyelikler için, ilk mi sonraki mi?","paragraf":"m.17/3","yanilgi":"Geçersizlik sonucunun ilk üyeliği de kapsadığını sanıyorsun."},"D":{"gercek":"6356 sayılı Kanun m.17/3\u0027teki istisna yalnız işçi-sendika ilişkisine özgüdür; m.20/1 üst kuruluş için istisnasız tek üyelik kuralı koyar.","ayirt":"Bu istisna işçi düzeyinde mi yoksa sendika-üst kuruluş düzeyinde mi düzenlenmiş?","paragraf":"m.17/3, m.20/1","yanilgi":"Bu şıkkı elerken işçi düzeyindeki istisnayı üst kuruluşa da uygulanır sanıyorsun."},"B":{"gercek":"Madde 20/1 istisnasız biçimde bir sendikanın aynı anda birden fazla üst kuruluşa üye olamayacağını belirtir.","ayirt":"Bu kural işçiye mi sendikaya mı hitap ediyor?","paragraf":"m.20/1","yanilgi":"İşçi için tanınan çoklu üyelik istisnasının sendikalar arası ilişkiye de yansıdığını sanıyorsun."},"A":{"gercek":"Madde 20/2 çekilmenin bildirim tarihinden bir ay sonra geçerlilik kazanacağını öngörür.","ayirt":"Bildirim ile geçerlilik anı aynı gün mü, süre var mı?","paragraf":"m.20/2","yanilgi":"Bildirimin kendisinin hukuki sonucu anında doğurduğunu düşünüyorsun."}},"verilen":[],"donem":6,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 108"},"kural":"İş Kanununun 18 inci maddesine göre sendika üyeliği geçerli fesih sebebi oluşturmaz (I doğru), ancak işyeri sendika temsilciliği yapmak da aynı bentte geçerli fesih sebebi sayılmaz, dolayısıyla II yanlıştır; 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendine göre sendika ve konfederasyon başkanlıkları ile yönetim kurullarına seçilenler bu bent kapsamında sigortalı sayılır (III doğru); aynı maddenin üçüncü fıkrasının (c) bendine göre (c) bendi kapsamındaki kişilerin kurduğu sendika ve konfederasyonların başkanlık ve yönetim kuruluna seçilip aylıksız izne ayrılanlar hakkında da (c) bendi hükümleri uygulanır (IV doğru); İş Kanununun 5 inci maddesine göre ispat yükü kural olarak işçidedir ancak işçi güçlü bir ihtimali ortaya koyarsa ispat yükü işverene geçer, bu nedenle V yanlıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 108","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Çoklu önermeli sorularda önce her roman rakamını TEK BAŞINA hangi maddeye bağladığını yaz, sonra şıklara bak; kombinasyon şıkları seni yanıltmasın.","konu":"sendika üyeliği","tablo":{"satirlar":[["A) I ve III","m.18","doğru ifade"],["B) II ve IV","m.18","YANLIŞ ifade"],["C) I, III ve IV","m.4/1-a","doğru ifade"],["D) II, III ve V","m.4/3-c","doğru ifade"],["E) I, IV ve V","m.5","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"I, III ve IV","E":"I, IV ve V","A":"I ve III","D":"II, III ve V","B":"II ve IV"},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.5","metin":"Madde 5 – (Ek: 6/2/2014-6518/57 md.) İş ilişkisinde dil, ırk, renk, cinsiyet, engellilik, siyasal düşünce, felsefî inanç, din ve mezhep ve benzeri sebeplere dayalı ayrım yapılamaz. İşveren, esaslı sebepler olmadıkça tam süreli çalışan işçi karşısında kısmî süreli çalışan işçiye, belirsiz süreli çalışan işçi karşısında belirli süreli çalışan işçiye farklı işlem yapamaz. İşveren, biyolojik veya işin niteliğine ilişkin sebepler zorunlu kılmadıkça, bir işçiye, iş sözleşmesinin yapılmasında, şartlarının oluşturulmasında, uygulanmasında ve sona ermesinde, cinsiyet veya gebelik nedeniyle doğrudan veya dolaylı farklı işlem yapamaz. Aynı veya eşit değerde bir iş için cinsiyet nedeniyle daha düşük ücret kararlaştırılamaz. İşçinin cinsiyeti nedeniyle özel koruyucu hükümlerin uygulanması, daha düşük bir ücretin uygulanmasını haklı kılmaz. İş ilişkisinde veya sona ermesinde yukarıdaki fıkra hükümlerine aykırı davranıldığında işçi, dört aya kadar ücreti tutarındaki uygun bir tazminattan başka yoksun bırakıldığı haklarını da talep edebilir. 2821 sayılı Sendikalar Kanununun 31 inci maddesi hükümleri saklıdır. 20 nci madde hükümleri saklı kalmak üzere işverenin yukarıdaki fıkra hükümlerine aykırı davrandığını işçi ispat etmekle yükümlüdür. Ancak, işçi bir ihlalin varlığı ihtimalini güçlü bir biçimde gösteren bir durumu ortaya koyduğunda, işveren böyle bir ihlalin mevcut olmadığını ispat etmekle yükümlü olur. İşyerinin veya bir bölümünün devri"},{"ad":"İş K. (4857 s.K.) m.18 [1/2]","metin":"Madde 18 - Otuz veya daha fazla işçi çalıştıran işyerlerinde en az altı aylık kıdemi olan işçinin belirsiz süreli iş sözleşmesini fesheden işveren, işçinin yeterliliğinden veya davranışlarından ya da işletmenin, işyerinin veya işin gereklerinden kaynaklanan geçerli bir sebebe dayanmak zorundadır. (Ek cümle: 10/9/2014-6552/2 md.) Yer altı işlerinde çalışan işçilerde kıdem şartı aranmaz. Altı aylık kıdem hesabında bu Kanunun 66 ncı maddesindeki süreler dikkate alınır. Özellikle aşağıdaki hususlar fesih için geçerli bir sebep oluşturmaz: a) Sendika üyeliği veya çalışma saatleri dışında veya işverenin rızası ile çalışma saatleri içinde sendikal faaliyetlere katılmak. b) İşyeri sendika temsilciliği yapmak. c) Mevzuattan veya sözleşmeden doğan haklarını takip veya yükümlülüklerini yerine getirmek için işveren aleyhine idari veya adli makamlara başvurmak veya bu hususta başlatılmış sürece katılmak.6 d) Irk, renk, cinsiyet, medeni hal, aile yükümlülükleri, hamilelik, doğum, din, siyasi görüş ve benzeri nedenler. e) 74 üncü maddede öngörülen ve kadın işçilerin çalıştırılmasının yasak olduğu sürelerde işe gelmemek. f) Hastalık veya kaza nedeniyle 25 inci maddenin (I) numaralı bendinin (b) alt bendinde öngörülen bekleme süresinde işe geçici devamsızlık. İşçinin altı aylık kıdemi, aynı işverenin bir veya değişik işyerlerinde geçen süreler birleştirilerek hesap edilir. İşverenin aynı işkolunda birden fazla işyerinin bulunması halinde, işyerinde çalışan işçi sayısı, bu işyerlerinde çalışan toplam işçi sayısına göre belirlenir."}],"hakem":"Sorunun doğru sıkkı (I, III ve IV), kaynak metinde açıkça yer alan İş Kanunu m.18 ve SGK Kanunu m.4 hükümlerine dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Temsilciliği geçerli sebep ve ispat yükünü mutlak olarak işçiye yüklüyor; hem II hem V yanlış, doğru kombinasyon I, III ve IV\u0027tür.","E":"I ve IV\u0027ü doğru bulması isabetli ama ispat yükü işçi güçlü ihtimal gösterince işverene geçiyor; V yanlış, III eklenmesi gerekir.","A":"Başkanlığın sigortalılığını doğru görüyor ama (c) kapsamındaki kişinin başkanlığa seçilip izinli haldeki durumunu kaçırıyor; IV de doğru olması gerekir.","B":"Sendika temsilciliğini işten çıkarma sebebi sanıyor ama kanun bunu geçerli sebep olarak görmüyor; II hatalı, II ve V\u0027ten hiçbiri doğru değil."},"dogru":"Sendika üyeliği işten çıkarma sebebi değildir. Sendika temsilciliği de geçerli sebep sayılmaz. Sendika başkanı olacak kişi sigortalı sayılır ve (c) kapsamındaki kişi başkanlığa seçilip izinli olsa bile (c) bendinin kuralları geçerli kalır.","sinav":"İş Kanunu 18. madde ile Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 4. madde.","kavramlar":[{"kaynak":"İş Kanunu 18. madde","tanim":"İşçinin sendikaya üye olması veya sendikal faaliyetlere katılması nedeniyle işveren tarafından işten çıkarılamaması.","ad":"Sendika üyeliği koruması"},{"kaynak":"İş Kanunu 18. madde","tanim":"İşçinin işyerinde sendika temsilciliği yapması nedeniyle işveren tarafından işten çıkarılamaması.","ad":"Sendika temsilciliği koruması"},{"kaynak":"İş Kanunu 5. madde","tanim":"İşçi ihlalin varlığını güçlü bir şekilde gösteren durumu ortaya koyunca, ispat yükü işverene geçer.","ad":"Sendikal ayrımcılıkta ispat yükü dağılımı"},{"kaynak":"5510 s. SGK Kanunu 4. madde","tanim":"Kamu idaresinde kadro ve pozisyonda çalışıp (a) bendi kapsamına girenler gibi sigortalı olmayan kişiler bu bent kapsamında sigortalı sayılır.","ad":"Kamu idaresi (c) bendi sigortalılığı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":["2026/1","2025/3","2025/2","2025/1","2016/1","2015/3"]},"oyun":null,"tip":"teori","soru":"I. Sendika üyeliği geçerli fesih sebebi değildir. II. Sendika temsilciliği geçerli fesih sebebidir. III. Sendika başkanlığına seçilenler 4/1-a bendi kapsamında sigortalıdır. IV. (c) bendindeki kişi, sendikada başkanlığa seçilip izinliyse yine (c) bendine tabidir. V. Sendikal ayrımcılıkta ispat yükü daima yalnız işçidedir. Hangileri doğrudur?","kayitBaslik":"","id":"sgs-issgk-p30/kp-01","verilenler":[],"dayanak":"4857 s. İş Kanunu m.5, m.18; 5510 s. SGK Kanunu m.4/1-a, m.4/3-c","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027daki bir tekstil fabrikasında 14 Mart günü işveren, sendikaya üye 40 işçiden 3\u0027ünün iş sözleşmesini feshediyor; bunlardan biri işyeri sendika temsilcisi, biri sendika il başkanlığına yeni seçilmiş ve aylıksız izne ayrılmış, biri de kadın işçi olup \u0027aynı işe erkek arkadaşından 800 TL az ücret aldığını\u0027 iddia ediyor.","anlatim":"Bu üç işçinin durumu aynı anda masaya yatırılıyor.","doldur":[]},{"formul":"Ne yapacağız: 4857 sayılı Kanunun 5 inci ve 18 inci maddeleriyle 5510 sayılı Kanunun 4 üncü maddesini bu üç işçinin dosyasına tek tek uygulayacağız.","anlatim":"Sendika üyeliği, temsilcilik, başkanlık sigortalılığı, izinli başkanlık ve ispat yükü beş ayrı soru olarak karşımıza çıkıyor. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.18","karar":"doğru","anlatim":"İş Kanununun 18 inci maddesi sendika üyeliğini geçerli fesih sebebi saymaz, patron haksız. Sadece üye olmak feshi meşru kılmıyor.","formul":"Şık A: patron \u002740 işçiden sadece sendikaya üye olanları seçip çıkardım, bu geçerli sebeptir\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.18","karar":"yanlış","anlatim":"Hayır, 18 inci maddenin (b) bendi işyeri sendika temsilciliği yapmayı geçerli sebep saymayan haller arasında sayıyor. Temsilcilik koruma altında, tehdit değil.","formul":"Şık B: işyeri sendika temsilcisi olan işçi için \u0027zaten temsilcilik görevi başlı başına geçerli fesih sebebidir\u0027 diyorsun, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.4/1-a","karar":"doğru","anlatim":"5510 sayılı Kanunun 4 üncü maddesinin üçüncü fıkrasının (c) bendi değil, birinci fıkranın (a) bendi sendika ve konfederasyon başkanlıkları ile yönetim kurullarına seçilenleri kapsıyor. Bu işçi için evet, (4/1-a) doğru.","formul":"Şık C: sendika il başkanlığına seçilenlerin SGK\u0027da hangi bentte sigortalı sayılacağını soruyorlar, (4/1-a) mı dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.4/3-c","karar":"doğru","anlatim":"Evet, 5510 sayılı Kanunun 4 üncü maddesinin üçüncü fıkrasının (c) bendi bu kişilerin kurduğu sendikada başkanlığa seçilip aylıksız izne ayrılanları yine (c) bendinde tutuyor. Statü değişmiyor.","formul":"Şık D: aylıksız izne ayrılıp başkanlığa seçilen işçi zaten (c) bendinde sigortalıydı, izinden sonra da (c) bendinde mi kalır?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.5","karar":"yanlış","anlatim":"İş Kanununun 5 inci maddesi kural olarak ispatı işçiye verse de, işçi ihlal ihtimalini güçlü biçimde gösterirse yük işverene geçer. Yani \u0027daima yalnız işçide\u0027 demek yanlış.","formul":"Şık E: ücret ayrımcılığı iddia eden kadın işçi mahkemede hiçbir emare sunamasa da ispat yükü hep onda mı kalır?"},{"formul":"Kapanış: A ✓ B ✗ C ✓ D ✓ E ✗","anlatim":"Doğru üçlü I, III ve IV; yani C şıkkı kazanıyor. Kendine hep şunu sor: bu ifade bir \u0027geçerli sebep sayılmaz\u0027 listesinden mi, yoksa \u0027ispat yükü değişebilir\u0027 istisnasından mı bahsediyor?","doldur":[]}],"anahtar":[{"ornek":"sendika","kok":"sendik"},{"ornek":"maddesine","kok":"maddes"},{"ornek":"kanununun","kok":"kanunu"},{"ornek":"geçerli","kok":"geçerl"},{"ornek":"başkanlıkları","kok":"başkan"},{"ornek":"temsilciliği","kok":"temsil"}],"konuGiris":{"harita":"Ne zaman test edilir: bir işçi sendika üyeliği veya temsilciliği nedeniyle işten çıkarıldığında geçerli sebep olup olmadığı sorulduğunda. Nasıl ölçülür: madde 18\u0027deki \u0027geçerli sebep oluşturmaz\u0027 bentleriyle olayın karşılaştırılmasıyla. Nasıl kaydedilir: ayrımcılık iddiasında ispat yükünün önce işçide, güçlü emare varsa işverende olduğu kuralıyla.","desen":"Sınav sıklıkla \u0027sendika üyeliği geçerli fesih sebebi midir\u0027 ile \u0027temsilcilik geçerli fesih sebebi midir\u0027 önermelerini karıştırır, oysa ikisi de m.18\u0027de geçerli sebep sayılmaz. İspat yükü sorularında \u0027daima yalnız işçidedir\u0027 tuzağı kurulur, oysa güçlü emare varsa yük işverene geçer. Bu soru m.18 ve m.5 ispat yükü fıkrasının birlikte okunması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İşverenin iş sözleşmesini feshedebilmesi için dayanması gereken haklı gerekçe","ad":"Geçerli fesih sebebi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"İşçinin sendikaya üye olması veya sendikal etkinliklere katılması","ad":"Sendika üyeliği/faaliyeti","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"İşçinin işyerinde sendikayı temsil eden görevi üstlenmesi","ad":"İşyeri sendika temsilciliği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ayrımcılık iddiasında hangi tarafın kanıt sunmakla yükümlü olduğu kuralı","ad":"İspat yükü","kim":"kanun sabitler"}],"sinavda":"Soru; sendika üyeliği, temsilcilik, sigortalılık statüsü ve ispat yüküne dair beş önerme verip hangilerinin doğru olduğunu ister.","panel_ornek":"Bir arkadaşın apartmanda gönüllü site temsilcisi seçildi diye yönetim onu daireden çıkaramaz, çünkü bu görev yasal bir haktır. 5 yıldır o sitede oturuyor, aidatı ayda 250 TL.","ornek":"Bir arkadaşın apartmanda gönüllü site temsilcisi seçildi diye yönetim onu daireden çıkaramaz, çünkü bu görev yasal bir haktır. 5 yıldır o sitede oturuyor, aidatı ayda 250 TL.","yontemler":"Önce her önermeyi ilgili madde bendine tek tek eşleştir, sonra \u0027daima\u0027, \u0027yalnız\u0027 gibi mutlaklık ifadelerine dikkat et çünkü bunlar genelde yanlış önermeyi işaret eder.","nedir":"Sendika üyeliği konusu, işçinin sendikaya üye olması veya sendikal faaliyet yürütmesi yüzünden işten çıkarılıp çıkarılamayacağını inceler. Sınav, hangi sendikal davranışların geçerli fesih sebebi sayılmadığını ve ispat yükünün kime ait olduğunu ölçer."},"olay":"","tuzak":{"D":{"ad":"Çifte Yanılgı Tuzağı","metin":"Hem temsilcilik yapmayı geçerli fesih sebebi sayıyor hem ispat yükünün mutlak biçimde işçide kaldığını düşünüyorsun. Doğrusu: II ve V yanlıştır, doğru kombinasyon I, III ve IV\u0027tür."},"E":{"ad":"İspat Yükü Tuzağı","metin":"I ve IV\u0027ü doğru bulman isabetli ama ispat yükünün güçlü ihtimalde işverene geçtiğini gözden kaçırıp V\u0027i doğru sanıyorsun. Doğrusu: V yanlıştır, III eklenerek I, III ve IV seçilmelidir."},"A":{"ad":"Eksik Seçim Tuzağı","metin":"III\u0027ün 4/1-a sigortalılığını doğru bulup 4/1-c kapsamındaki kişinin aylıksız izinli başkanlığına ilişkin IV\u0027ü atlıyorsun. Doğrusu: IV de doğrudur, seçim I, III ve IV olmalıydı."},"B":{"ad":"Ters Kural Tuzağı","metin":"Sendika temsilciliği yapmayı geçerli fesih sebebi sanıyorsun; İş Kanununun 18 inci maddesi bunu açıkça geçerli sebep saymaz. Doğrusu: II yanlıştır, doğru kombinasyon I, III ve IV\u0027tür."}},"celdiriciYol":{"D":"II\u0027nin ters okunması ile V\u0027teki \u0027ispat yükü daima işçide\u0027 istisnasız kuralının kabul edilmesi birlikte işaretlenirse bu kombinasyona ulaşılır (çift hata)","E":"V\u0027teki ispat yükü istisnası (madde 5, güçlü ihtimal hâlinde işverene geçiş) atlanıp I ve IV ile birlikte V doğru sayılırsa bu kombinasyona ulaşılır (istisna atlama)","A":"IV maddesi (5510 m.4/3-c, aylıksız izinli başkanlık hükmü) listeye eklenmeden bırakılırsa I ve III ile yetinilir (eksik önerme seçimi)","B":"II önermesi \u0027temsilcilik = geçerli fesih sebebi\u0027 şeklinde ters okunup IV ile birleştirilirse bu kombinasyona ulaşılır (madde 18/b\u0027nin ters yorumu)"},"hap":"Sendika üyeliği ve işyeri sendika temsilciliği yapmak, İş Kanununun 18 inci maddesine göre işveren için geçerli fesih sebebi oluşturmaz; sendikal ayrımcılıkta ispat yükü kural olarak işçidedir ama işçi güçlü ihtimal gösterirse işverene geçer.","teshis":{"C":{"gercek":"18 inci madde sendika üyeliğini ve temsilciliği geçerli fesih sebebi saymaz; 5510 m.4 sendika yöneticiliğini ve izinli başkanlığı sigortalılık kapsamında tutar; m.5\u0027te ispat yükü mutlak değildir.","ayirt":"Her önermeyi ayrı maddeye bağlayıp tek tek doğru/yanlış işaretledim mi?","paragraf":"4857 s.K. m.5, m.18; 5510 s.K. m.4","yanilgi":"Bu şıkkı eleyen öğrenci ya bir maddeyi fazladan/eksik sayar ya da ispat yükü kuralını maddeyle karıştırır."},"E":{"gercek":"İş Kanununun 5 inci maddesi, işçi ihlal ihtimalini güçlü biçimde gösterirse ispat yükünün işverene geçeceğini düzenler; bu nedenle ispat yükü \u0027daima yalnız işçide\u0027 değildir.","ayirt":"İstisna cümlesini (\u0027ancak işçi ... güçlü bir biçimde gösterdiğinde\u0027) okudum mu?","paragraf":"4857 s.K. m.5","yanilgi":"Doğru iki maddeyi (I ve IV) bulduktan sonra ispat yükü konusunda kanunun getirdiği istisnayı gözden kaçırıp V\u0027i de doğru sayıyorsun."},"A":{"gercek":"5510 sayılı Kanunun 4 üncü maddesinin üçüncü fıkrasının (c) bendi, bu kapsamdaki kişilerin kurduğu sendikalarda başkanlığa seçilip aylıksız izne ayrılanları da (c) bendine tabi tutar.","ayirt":"Listede dördüncü bir madde var mı, onu atladım mı diye tekrar saydın mı?","paragraf":"5510 s.K. m.4/3-c","yanilgi":"Sen dört maddeyi tek tek doğru okuduğunu düşünüp listeyi tamamladığını sanıyorsun ama (c) bendindeki izinli başkanlık hükmünü hiç kontrol etmedin."},"D":{"gercek":"İş Kanununun 18/b bendi temsilciliği geçerli sebep saymaz; 5 inci madde işçi güçlü bir ihtimal ortaya koyduğunda ispat yükünün işverene geçeceğini öngörür.","ayirt":"İspat yükü kuralının \u0027daima\u0027 mı yoksa \u0027kural olarak, ama...\u0027 mı dediğine baktım mı?","paragraf":"4857 s.K. m.5, m.18","yanilgi":"Sendika temsilciliğini fesih sebebi sanman yanında, sendikal ayrımcılıkta işçinin hiçbir zaman güçlü ihtimal gösterip ispat yükünü işverene çeviremeyeceğini düşünüyorsun."},"B":{"gercek":"İş Kanununun 18 inci maddesinin (b) bendi, işyeri sendika temsilciliği yapmayı açıkça geçerli fesih sebebi saymaz.","ayirt":"Madde metninde \u0027geçerli sebep oluşturmaz\u0027 listesinde bu davranış var mıydı?","paragraf":"4857 s.K. m.18","yanilgi":"İşyeri sendika temsilciliğini de sendikal faaliyet gibi görüp bunun işveren için otomatik fesih sebebi oluşturacağını sanıyorsun."}},"verilen":[],"donem":6,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 108"},"kural":"6356 sayılı Kanunun 17 nci maddesinin birinci fıkrasına göre on beş yaşını dolduran ve Kanun hükümlerine göre işçi sayılanlar işçi sendikalarına üye olabilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 108","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Beş şıkta madde numarasını değil, hükmün yönünü (yasak mı serbest mi, kaç gün, hangi usul) karşılaştır; tek kelime değişse bile şık yanlış olur.","konu":"sendika üyeliği","tablo":{"satirlar":[["A) İşçi veya işverenler, aynı işkolunda ve aynı zamanda bir…","6356 s.K. m.17/3","YANLIŞ ifade"],["B) On beş yaşını dolduran ve bu Kanun hükümlerine göre işçi…","6356 s.K. m.17/1","doğru ifade"],["C) Haklı bir neden gösterilmeden üyelik başvurusu kabul edi…","6356 s.K. m.17/5","YANLIŞ ifade"],["D) Üst kuruluş üyeliği de, tıpkı sendika üyeliği gibi Bakan…","6356 s.K. m.20/1","YANLIŞ ifade"],["E) Bir işyerinde yardımcı işlerde çalışan işçiler, işyerini…","6356 s.K. m.17/4","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Haklı bir neden gösterilmeden üyelik başvurusu kabul edilmeyenler, bu kararın kendilerine tebliğinden itibaren altmış gün içinde dava açabilir.","E":"Bir işyerinde yardımcı işlerde çalışan işçiler, işyerinin girdiği işkoluna bakılmaksızın diledikleri işkolunda kurulu bir sendikaya üye olabilir.","A":"İşçi veya işverenler, aynı işkolunda ve aynı zamanda birden çok sendikaya üye olabilir.","D":"Üst kuruluş üyeliği de, tıpkı sendika üyeliği gibi Bakanlıkça sağlanan elektronik başvuru sistemine e-Devlet kapısı üzerinden kazanılır.","B":"On beş yaşını dolduran ve bu Kanun hükümlerine göre işçi sayılanlar, işçi sendikalarına üye olabilir."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.17","metin":"MADDE 17 – (1) On beş yaşını dolduran ve bu Kanun hükümlerine göre işçi sayılanlar, işçi sendikalarına üye olabilir. (2) Bu Kanun anlamında işveren sayılanlar, işveren sendikalarına üye olabilir. (3) Sendikaya üye olmak serbesttir. Hiç kimse sendikaya üye olmaya veya olmamaya zorlanamaz. İşçi veya işverenler aynı işkolunda ve aynı zamanda birden çok sendikaya üye olamaz. Ancak aynı işkolunda ve aynı zamanda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok sendikaya üye olabilir. İşçi ve işverenlerin bu hükme aykırı şekilde birden çok sendikaya üye olmaları hâlinde sonraki üyelikler geçersizdir. (4) Bir işyerinde yardımcı işlerde çalışan işçiler de, işyerinin girdiği işkolunda kurulu bir sendikaya üye olabilir. (5) Sendikaya üyelik, Bakanlıkça sağlanacak elektronik başvuru sistemine e-Devlet kapısı üzerinden üyelik başvurusunda bulunulması ve sendika tüzüğünde belirlenen yetkili organın kabulü ile e-Devlet kapısı üzerinden kazanılır. Üyelik başvurusu, sendika tarafından otuz gün içinde reddedilmediği takdirde üyelik talebi kabul edilmiş sayılır. Haklı bir neden gösterilmeden üyelik başvurusu kabul edilmeyenler, bu kararın kendilerine tebliğinden itibaren otuz gün içinde dava açabilir. Mahkemenin kararı kesindir. Mahkemenin davacı lehine karar vermesi hâlinde üyelik, red kararının alındığı tarihte kazanılmış sayılır. Üyelik aidatı"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.20","metin":"MADDE 20 – (1) Üst kuruluş üyeliğine başvuru genel kurul kararına bağlıdır. Üst kuruluş üyeliği, tüzükte belirlenen yetkili organın kabulüyle kazanılır. Aynı zamanda birden fazla üst kuruluşa üye olunamaz. Aksi hâlde sonraki üyelikler geçersizdir. (2) Üst kuruluş üyeliğinden çekilme genel kurul kararına bağlıdır. Çekilme, üst kuruluşa bildirim tarihinden itibaren bir ay sonra geçerlilik kazanır. (3) Üst kuruluş üyeliğinden çıkarılma, üst kuruluş genel kurulu kararıyla olur. (4) Üye olma, üyelikten çekilme ve çıkarılma kararları, üst kuruluş tarafından bir ay içerisinde Bakanlığa bildirilir. Uluslararası işçi ve işveren kuruluşlarına üyelik"}],"hakem":"Soru 6356 s.K. m.17(1) hükmünü doğru şekilde soruyor; B şıkkı kaynakta açıkça yer alan hüküm ile birebir örtüşmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Haklı neden olmaksızın başvurusu reddedilen kişi dava açmak için otuz günü vardır, altmış gün değildir.","E":"Yardımcı işlerde çalışan işçiler yalnızca işyerinin girdiği işkolunda kurulu sendikaya üye olabilir, dilediği işkolu seçme hakkı yoktur.","D":"Temel sendika üyeliği e-Devlet üzerinden kazanılırken, üst kuruluş üyeliği genel kurul ve yetkili organın kabulüne bağlıdır, e-Devlet sistemi burada rol oynamaz.","A":"Kanun aynı işkolunda birden çok sendikaya üyeliği yasaklar; ancak farklı işverenlerde çalışanlar için istisna vardır. Şık bunu görmezden gelip genel olarak izin verildiğini söyler."},"dogru":"On beş yaşını tamamlamış ve Kanun\u0027a göre işçi sayılan kişiler işçi sendikasına üye olabilir. Bu, Kanun\u0027un doğrudan hükmüdür.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 17. madde birinci fıkra","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 17. madde","tanim":"On beş yaşını dolduran ve Kanun hükümlerine göre işçi sayılanların, elektronik başvuru sistemi üzerinden başvuru yaparak ve sendika tarafından kabul edilerek kazandığı üyelik statüsü.","ad":"işçi sendikasına üyelik"},{"kaynak":"Sendikalar ve TİS K. 17. madde","tanim":"İşçi veya işverenlerin aynı işkolunda ve aynı zamanda birden çok sendikaya üye olamayacağı ilkesi; istisna olarak farklı işverenlere ait işyerlerinde çalışan işçiler bu kurala tabi değildir.","ad":"aynı işkolunda çoklu üyelik yasağı"},{"kaynak":"Sendikalar ve TİS K. 17. madde","tanim":"Haklı bir neden gösterilmeden üyelik başvurusu kabul edilmeyenler, bu kararın kendilerine tebliğinden itibaren otuz gün içinde dava açabilir.","ad":"üyelik başvurusunun reddine karşı dava açma süresi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":["2026/1","2025/3","2025/2","2025/1","2016/1","2015/3"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre işçi sendikasına üyelik hakkında aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-02","verilenler":[],"dayanak":"6356 s.K. m.17, m.20","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konfeksiyon işçisi Ayşe, 16 yaşında, bir tekstil fabrikasında dikişçi olarak çalışıyor. Aynı ay içinde iki farklı işçi sendikasına üyelik başvurusu yapıyor, biri onu reddediyor. Fabrikada temizlikçi olarak çalışan Mehmet de bir sendikaya üye olmak istiyor.","anlatim":"Bu olayda beş farklı üyelik meselesi var: çoklu üyelik, yaş şartı, dava süresi, üst kuruluş üyeliği ve yardımcı iş yapanın üyeliği. Şimdi bu beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 6356 sayılı Kanun m.17 ve m.20\u0027deki üyelik kurallarını, Ayşe ve Mehmet\u0027in olayına uygulayacağız. Şimdi bu beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural tek: üyelik serbesttir ama sınırları vardır; yaş, süre ve işkolu belirli. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"6356 s.K. m.17/3","karar":"yanlış","anlatim":"Hayır, olamaz; ikinci üyelik geçersiz sayılır. Kanun aynı işkolunda ve aynı zamanda birden çok sendikaya üyeliği yasaklıyor.","formul":"Şık A: Ayşe aynı işkolunda aynı anda iki sendikaya üye olabilir mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"6356 s.K. m.17/1","karar":"doğru","anlatim":"Evet, olabilir; on beş yaşını doldurmuş ve işçi sayılıyor. Bu tam olarak maddenin birebir hükmü, üye olmasına engel yok.","formul":"Şık B: Ayşe 16 yaşında olduğuna göre işçi sendikasına üye olabilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"6356 s.K. m.17/5","karar":"yanlış","anlatim":"Hayır, süre altmış değil otuz gün. Ayşe bunu bilmezse davasını süresinde açamaz ve hakkı düşer.","formul":"Şık C: Ayşe\u0027nin reddedilen üyeliği için tebliğden itibaren altmış gün içinde dava açması gerekir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"6356 s.K. m.20/1","karar":"yanlış","anlatim":"Hayır, üst kuruluş üyeliği genel kurul kararı ve tüzükteki yetkili organın kabulüyle olur, e-Devlet usulü değildir. Bu usul m.17/5\u0027te bireysel işçi üyeliğine özgüdür.","formul":"Şık D: Fabrikanın bağlı olduğu sendika üst kuruluşa üye olurken, tıpkı Ayşe gibi e-Devlet üzerinden mi üye olur?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"6356 s.K. m.17/4","karar":"yanlış","anlatim":"Hayır, Mehmet fabrikanın girdiği işkolunda kurulu sendikaya üye olabilir. Yardımcı iş yapması onu serbest seçim hakkına kavuşturmaz.","formul":"Şık E: Temizlikçi Mehmet, fabrikanın işkoluna bakmaksızın istediği işkolunda sendikaya üye olabilir mi?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru B: madde metniyle birebir örtüşen tek ifade oydu. Kendine sor: bu cümle kanunun lafzıyla kelimesi kelimesine uyuyor mu, yoksa bir sayı ya da usul değiştirilmiş mi?","doldur":[]}],"anahtar":[{"ornek":"üyeliği","kok":"üyeliğ"},{"ornek":"üyelik","kok":"üyelik"},{"ornek":"sendikaya","kok":"sendik"},{"ornek":"işkolunda","kok":"işkolu"},{"ornek":"kuruluş","kok":"kurulu"},{"ornek":"sayılı","kok":"sayılı"}],"konuGiris":{"harita":"Ne zaman kazanılır: Üyelik, e-Devlet üzerinden başvuru ve sendika yetkili organının kabulüyle kazanılır. Nasıl ölçülür: Otuz günlük ret süresinin geçip geçmediğine ve mahkeme kararına bakılır. Nasıl kaydedilir: Mahkeme davacı lehine karar verirse üyelik, ret kararının alındığı tarihten itibaren geçerli sayılır.","desen":"Sınav genelde üyeliğin ne zaman kazanıldığını (başvuru mu, kabul mü, otuz gün mü) karıştırır. Bir diğer tuzak, aynı işkolunda farklı işverenlerde çalışan işçilerin birden fazla sendikaya üye olabilmesi istisnasıdır. Bu soru m.17 fıkra 3 ve 5 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İşçinin e-Devlet kapısı üzerinden sendikaya yaptığı elektronik başvuru","ad":"Üyelik başvurusu","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Başvurunun reddedilmediği takdirde kabul sayıldığı süre","ad":"Otuz günlük ret süresi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Sendikanın başvuruyu reddetmesini hukuka uygun kılan gerekçe","ad":"Haklı neden","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Aynı işkolunda aynı anda tek sendikaya üye olunabileceği kuralı","ad":"Birden çok sendikaya üyelik yasağı","kim":"kanun sabitler"}],"sinavda":"Soru, sendika üyeliğinin kazanılma usulü ve sınırları hakkında hangi ifadenin doğru olduğunu sorar.","panel_ornek":"Bir gencin e-Devlet üzerinden üniversite kulübüne üyelik başvurusu yaptığını düşün, başvuru 10 gün içinde reddedilmezse otomatik üye sayılıyor. Kulüp yönetimi haklı sebep göstermeden reddederse genç 5 gün içinde itiraz edebiliyor. Bu, onayın hangi organdan geldiğini ve sürenin geçmesinin ne anlama geldiğini gösteriyor.","ornek":"Bir gencin e-Devlet üzerinden üniversite kulübüne üyelik başvurusu yaptığını düşün, başvuru 10 gün içinde reddedilmezse otomatik üye sayılıyor. Kulüp yönetimi haklı sebep göstermeden reddederse genç 5 gün içinde itiraz edebiliyor. Bu, onayın hangi organdan geldiğini ve sürenin geçmesinin ne anlama geldiğini gösteriyor.","yontemler":"Metni fıkra fıkra oku, kimin karar verdiği ile sürenin kime ait olduğunu ayır. En kritik kural: otuz gün içinde ret yoksa üyelik kendiliğinden kabul edilmiş sayılır.","nedir":"Sendika üyeliği, işçinin bir işkolunda kurulu sendikaya üye olma sürecini ve şartlarını düzenler. Sınav, üyeliğin kimin tarafından ve hangi usulle kazanıldığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Süre Tuzağı","metin":"Öğrenci dava açma süresini diğer iş hukuku sürelerinden biriyle karıştırıp altmış gün sanır. Doğrusu: Kanunda bu süre otuz gün olarak belirlenmiştir, altmış gün değildir."},"E":{"ad":"Kapsam Tuzağı","metin":"Öğrenci yardımcı iş yapan işçinin herhangi bir işkolunu seçebileceğini sanır. Doğrusu: Bu işçiler yalnızca işyerinin girdiği işkolunda kurulu bir sendikaya üye olabilir, serbest işkolu seçimi yoktur."},"D":{"ad":"Madde Karıştırma Tuzağı","metin":"Öğrenci, temel sendika üyeliğindeki e-Devlet usulünü üst kuruluş üyeliğine de uygulanmış sanır. Doğrusu: Üst kuruluş üyeliği genel kurul kararına bağlıdır ve tüzükte belirlenen yetkili organın kabulüyle kazanılır, e-Devlet kapısı burada aranmaz."},"A":{"ad":"Ters Kural Tuzağı","metin":"Kanun, aynı işkolunda ve aynı zamanda birden çok sendikaya üyeliği yasaklar; yalnız farklı işverenlere ait işyerlerinde çalışanlar için istisna vardır. Doğrusu: Bu şıktaki genel ifade kuralın tam tersidir, dolayısıyla yanlıştır."}},"celdiriciYol":{},"hap":"Aynı işkolunda ve aynı zamanda birden çok sendikaya üyelik yasaktır; üyelik e-Devlet kapısı üzerinden, üst kuruluş üyeliği ise genel kurul kararıyla kazanılır.","teshis":{"C":{"gercek":"6356 sayılı Kanun m.17/5, tebliğden itibaren otuz gün içinde dava açılabileceğini öngörür.","ayirt":"Metinde geçen süre gerçekten kaç gün olarak yazılmıştı?","paragraf":"6356 s.K. m.17/5","yanilgi":"Dava açma sürelerini genel olarak altmış gün sanıp buraya da uyguluyorsun."},"E":{"gercek":"6356 sayılı Kanun m.17/4, bu işçilerin işyerinin girdiği işkolunda kurulu bir sendikaya üye olabileceğini söyler, serbest seçim tanımaz.","ayirt":"İşkolu, işçinin kendi tercihiyle mi yoksa işyerinin girdiği işkoluyla mı belirlenir?","paragraf":"6356 s.K. m.17/4","yanilgi":"Yardımcı iş yapan işçinin işkolu seçiminde serbest olduğunu düşünüyorsun."},"A":{"gercek":"6356 sayılı Kanun m.17/3 aynı işkolunda ve aynı zamanda birden çok sendikaya üyeliği yasaklar; aksi hâlde sonraki üyelikler geçersiz sayılır.","ayirt":"Bu kural bir yasak mı koyuyor, yoksa serbestlik mi tanıyor?","paragraf":"6356 s.K. m.17/3","yanilgi":"Sendika üyeliğinde işçinin istediği kadar sendikaya birden üye olabileceğini düşünüyorsun."},"D":{"gercek":"6356 sayılı Kanun m.20/1, üst kuruluş üyeliğinin genel kurul kararına bağlı olarak tüzükteki yetkili organın kabulüyle kazanılacağını düzenler, e-Devlet usulü m.17/5\u0027e özgüdür.","ayirt":"Bu hüküm sendika üyeliğine mi yoksa üst kuruluş üyeliğine mi ait?","paragraf":"6356 s.K. m.20/1","yanilgi":"Temel üyelik usulünün üst kuruluş üyeliği için de geçerli olduğunu sanıyorsun."},"B":{"gercek":"6356 sayılı Kanun m.17/1, on beş yaşını dolduran ve işçi sayılanların işçi sendikalarına üye olabileceğini düzenler.","ayirt":"Bu cümle maddenin lafzıyla birebir örtüşüyor mu?","paragraf":"6356 s.K. m.17/1","yanilgi":"Bu ifadeyi çok basit bulup arkasında bir tuzak arıyorsun, hâlbuki madde metninin aynısı."}},"verilen":[],"donem":6,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"6356 sayılı Kanunun 39 üncü maddesinin yedinci fıkrasına göre işveren vekilleri ile toplu iş sözleşmesi görüşmelerine işvereni temsilen katılanlar toplu iş sözleşmesinden yararlanamaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Yararlanma sorularında önce \u0027kim yararlanamaz\u0027 istisnasını (işveren vekili, işvereni temsilen katılan) ara, çoğu zaman doğru şık orada gizlidir.","konu":"toplu is sözleşmesi","tablo":{"satirlar":[["A) Toplu iş sözleşmesinin imzalanması tarihinde taraf sendi…","m.39/2","doğru ifade"],["B) İmza tarihinden sonra sendikaya üye olanlar, üyeliklerin…","m.39/2","doğru ifade"],["C) İmza tarihinde taraf sendikaya üye olmayanlar, dayanışma…","m.39/4","doğru ifade"],["D) Toplu iş sözleşmesi görüşmelerine işvereni temsilen katı…","m.39/7","YANLIŞ ifade"],["E) Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi a…","m.39/3","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İmza tarihinde taraf sendikaya üye olmayanlar, dayanışma aidatı ödeyerek toplu iş sözleşmesinden yararlanabilir ve bunun için işçi sendikasının onayı aranmaz.","E":"Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren üyeler, iş sözleşmelerinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanır.","A":"Toplu iş sözleşmesinin imzalanması tarihinde taraf sendikaya üye olanlar, sözleşmenin yürürlük tarihinden itibaren yararlanır.","D":"Toplu iş sözleşmesi görüşmelerine işvereni temsilen katılan işveren vekilleri de, toplu iş sözleşmesinden diğer işçilerle aynı koşullarda yararlanır.","B":"İmza tarihinden sonra sendikaya üye olanlar, üyeliklerinin taraf işçi sendikasınca işverene bildirildiği tarihten itibaren yararlanır."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.34","metin":"MADDE 34 – (1) Bir toplu iş sözleşmesi aynı işkolunda bir veya birden çok işyerini kapsayabilir. (2) Bir gerçek ve tüzel kişiye veya bir kamu kurum ve kuruluşuna ait aynı işkolunda birden çok işyerinin bulunduğu işyerlerinde, toplu iş sözleşmesi ancak işletme düzeyinde yapılabilir. (3) Grup toplu iş sözleşmesi, tarafların anlaşması üzerine bir işçi sendikası ile bir işveren sendikası arasında, birden çok üye işverene ait aynı işkolunda kurulu işyerleri ve işletmeleri kapsamak üzere yapılır. (4) İşletme toplu iş sözleşmesi yapılacak işyerlerinin aranılan niteliğe sahip olup olmadıklarına ilişkin uyuşmazlıklar, işletme merkezinin bulunduğu yerdeki mahkemede on beş gün içinde karara bağlanır. (Değişik cümle: 12/10/2017-7036/32 md.) Karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi on beş gün içinde kesin olarak karar verir. Toplu iş sözleşmesinin şekli ve süresi"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.39","metin":"MADDE 39 – (1) Toplu iş sözleşmesinden taraf işçi sendikasının üyeleri yararlanır. (2) Toplu iş sözleşmesinden, sözleşmenin imzalanması tarihinde taraf sendikaya üye olanlar yürürlük tarihinden, imza tarihinden sonra üye olanlar ise üyeliklerinin taraf işçi sendikasınca işverene bildirildiği tarihten itibaren yararlanır. (3) Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren üyeler de, iş sözleşmelerinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanır. (4) Toplu iş sözleşmesinin imzası sırasında taraf işçi sendikasına üye olmayanlar, sonradan işyerine girip de üye olmayanlar veya imza tarihinde taraf işçi sendikasına üye olup da ayrılanlar veya çıkarılanların toplu iş sözleşmesinden yararlanabilmeleri, toplu iş sözleşmesinin tarafı olan işçi sendikasına dayanışma aidatı ödemelerine bağlıdır. Bunun için işçi sendikasının onayı aranmaz. Dayanışma aidatı ödemek suretiyle toplu iş sözleşmesinden yararlanma, talep tarihinden geçerlidir. (İptal dördüncü cümle:Anayasa Mahkemesinin 30/12/2020 tarihli ve E.:2020/57; K.:2020/83 sayılı Kararı ile) (5) Dayanışma aidatının miktarı, üyelik aidatından fazla olmamak kaydıyla sendika tüzüğünde belirlenir. (6) Faaliyeti durdurulmuş sendikalara dayanışma aidatı ödenmez. (7) Bu Kanun anlamında işveren vekilleri ile toplu iş sözleşmesi görüşmelerine işvereni temsilen katılanlar, toplu iş sözleşmesinden yararlanamaz. (8) Grev sonunda yapılan toplu iş sözleşmesinden, 65 inci maddeye göre zorunlu olarak çalışanlar dışında işyerinde çalışmış olanlar aksine hüküm bulunmadıkça yararlanamaz. Teşmil"}],"hakem":"Soru 6356 s.K. m.39/7\u0027ye dayanmakta; kaynak metinde bu madde açıkça yer almakta ve işveren vekilleri ile görüşmelerine katılanların toplu iş sözleşmesinden yararlanamayacağı belirtilmektedir; D şıkkı bu kurala aykırı bir ifade içermektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Dayanışma aidatı için sendika onayı gerekli zannediliyor. Kanun açıkça onayın aranmadığını düzenler.","E":"İş sözleşmesi sona erenler tamamen haksız zannediliyor. Kanun bunların sona erene kadar yararlanmaya devam edeceğini belirtir.","A":"İmza tarihi ile üyelik başlangıcı birleştiriliyor. Kanun açıkça imza tarihinde üye olanların yürürlük tarihinden itibaren yararlandığını söyler.","B":"Bildirim tarihinin ne anlama geldiği karıştırılıyor. Kanun imza sonrası üyelerin bildirim tarihinden itibaren yararlanacağını net şekilde belirtir."},"dogru":"İşveren vekilleri ve işvereni toplantılarda temsil edenler toplu iş sözleşmesinden hiç yararlanamaz. D şıkkı bunların \u0027diğer işçilerle aynı koşullarda\u0027 yararlandığını söylediği için kanuna aykırıdır.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 39. maddesinin yedinci fıkrasına göre işveren vekilleri ile toplu iş sözleşmesi görüşmelerine işvereni temsilen katılanlar, toplu iş sözleşmesinden yararlanamaz.","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 39. madde","tanim":"İmza sırasında sendikaya üye olmayan veya sonradan çıkan işçilerin toplu iş sözleşmesinden yararlanabilmesi için ödedikleri ücret.","ad":"Dayanışma aidatı"},{"kaynak":"Sendikalar ve TİS K. 39. madde","tanim":"Toplu iş sözleşmesi görüşmelerine işvereni temsilen katılan kişi.","ad":"İşveren vekili"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":["2026/2","2024/2","2021/1","2020/3","2019/2","2019/1"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre toplu iş sözleşmesinden yararlanmaya ilişkin aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-01","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.39/2, 39/3, 39/4, 39/7","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir metal fabrikasında 12 Mart 2023\u0027te toplu iş sözleşmesi imzalandı, yürürlük tarihi 1 Nisan 2023.","anlatim":"Fabrikada 40 işçi imza tarihinde sendika üyesi, 5 işçi sonradan üye oldu, 3 işçi de görüşmelere işvereni temsilen katılan vekil.","doldur":[]},{"formul":"Ne yapacağız: m.39\u0027daki beş kuralı bu fabrikanın rakamlarıyla tek tek test edeceğiz.","anlatim":"Kim ne zaman yararlanır, kim hiç yararlanamaz, bunu her şıkta ayrı ayrı kontrol edeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.39/2","karar":"doğru","anlatim":"Bu işçiler imza tarihinde zaten üye, yürürlük tarihinden itibaren yararlanır. Bu tam m.39/2\u0027nin ilk cümlesi.","formul":"Şık A: 12 Mart\u0027ta üye olan 40 işçi, sözleşme 1 Nisan\u0027da yürürlüğe girince mi yoksa imza anında mı yararlanmaya başlar?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.39/2","karar":"doğru","anlatim":"İmza sonrası üye olanlar, üyeliğin işverene bildirildiği tarihten itibaren yararlanır, yani 25 Mart\u0027tan itibaren. Metin bunu aynen söylüyor.","formul":"Şık B: 20 Mart\u0027ta işe giren bir işçi sendikaya üye oldu, bu üyelik işverene 25 Mart\u0027ta bildirildi; işçi ne zaman yararlanır?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.39/4","karar":"doğru","anlatim":"Kanun açıkça onay aranmaz diyor, işçi aidatı ödediği talep tarihinden itibaren yararlanmaya başlar. Fabrikada bu işçi hemen yararlanır.","formul":"Şık C: sendikaya üye olmayan bir işçi dayanışma aidatı ödemek istiyor, işçi sendikasının onayını beklemeli mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.39/7","karar":"yanlış","anlatim":"Kanun bu kişileri açıkça yararlanamaz diye sayıyor, hiçbir koşulda faydalanmazlar. Fabrikada bu 3 vekil sözleşme haklarından hiç yararlanamaz.","formul":"Şık D: görüşmelere işvereni temsilen katılan 3 vekil, diğer işçiler gibi toplu iş sözleşmesinden yararlanabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.39/3","karar":"doğru","anlatim":"Kanun bu ara dönemde ayrılan üyeleri de kapsıyor, ayrıldığı tarihe kadar yararlanır. Fabrikadaki bu işçi 20 Mart\u0027a kadar haklardan faydalanır.","formul":"Şık E: imza 12 Mart\u0027ta, yürürlük 1 Nisan\u0027da; bu arada 20 Mart\u0027ta işten ayrılan üye bu sözleşmeden yararlanır mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Dört şık gerçek üyelik veya dayanışma ilişkisini anlatıyor, D ise kanunun açıkça yasakladığı bir grubu \u0027yararlanır\u0027 diye göstererek yanlış oluyor. Kendine sor: bu kişi işveren tarafını mı temsil ediyordu, öyleyse hiç yararlanamaz.","doldur":[]}],"anahtar":[{"ornek":"yararlanamaz","kok":"yararl"},{"ornek":"İşveren","kok":"İşvere"},{"ornek":"sözleşmesi","kok":"sözleş"},{"ornek":"itibaren","kok":"itibar"},{"ornek":"temsilen","kok":"temsil"},{"ornek":"fabrikada","kok":"fabrik"}],"konuGiris":{"harita":"Ne zaman yararlanma başlar: üyelik tarihine göre yürürlük ya da bildirim tarihinden itibaren mi kazanılır sorusu sorulur. Nasıl ölçülür: taraf sendika üyeliği, dayanışma aidatı ödemesi ya da sözleşme dışı katılım kriterleriyle değerlendirilir. Nasıl kaydedilir: kimlerin yararlanamayacağı istisna listesiyle (işveren temsilcileri, grev dışında çalışanlar gibi) belirlenir.","desen":"Sınav genellikle yararlanma başlangıç tarihlerini (imza, yürürlük, bildirim) karıştırarak yanlış seçenek üretir. Sıkça dayanışma aidatı ile üyelik aidatı arasındaki fark ya da işveren temsilcilerinin durumu tuzak olarak kullanılır. Bu soru sendika üyeliği ve yararlanma koşullarını düzenleyen madde noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İmza tarihinde üye olanların sözleşme yürürlüğe girdiğinde hak kazanması","ad":"Yürürlük tarihinden yararlanma","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Üye olmayanın sözleşmeden yararlanmak için ödediği bedel","ad":"Dayanışma aidatı","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"İşveren vekili veya işvereni temsil edenlerin sözleşme haklarından dışlanması","ad":"Yararlanamayan kişiler","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Zorunlu çalışanlar dışında grev süresince çalışanların sözleşmeden yararlanamaması","ad":"Grev sonrası yararlanma","kim":"kanun sabitler"}],"sinavda":"Soruda toplu iş sözleşmesinden yararlanmaya ilişkin çeşitli durumlar verilir ve hangisinin yanlış olduğu istenir.","panel_ornek":"Bir apartman yönetimi, bina sakinleriyle ortak bir bakım anlaşması imzalar; anlaşma imzalandıktan sonra binaya taşınan yeni sakinler, yöneticiye bildirim yaptıkları tarihten itibaren bu anlaşmanın sağladığı haklardan yararlanır. Sonradan gelen biri bildirim yapmazsa haktan yararlanamaz. Buradaki mantık, katılımın belirli bir işlemle başlaması gerektiğidir.","ornek":"Bir apartman yönetimi, bina sakinleriyle ortak bir bakım anlaşması imzalar; anlaşma imzalandıktan sonra binaya taşınan yeni sakinler, yöneticiye bildirim yaptıkları tarihten itibaren bu anlaşmanın sağladığı haklardan yararlanır. Sonradan gelen biri bildirim yapmazsa haktan yararlanamaz. Buradaki mantık, katılımın belirli bir işlemle başlaması gerektiğidir.","yontemler":"Her seçenekteki tarih ve kişi grubunu tek tek kanundaki kurala göre kontrol edin; en kritik nokta \u0027imza-yürürlük-bildirim\u0027 tarihleri arasındaki farkı doğru ayırt etmektir.","nedir":"Toplu iş sözleşmesi, işçi ve işveren tarafları arasında imzalanan ve belirli işçilerin ondan yararlanma koşullarını düzenleyen bir anlaşmadır. Sınav, bu yararlanma koşullarını kimin ne zaman ve nasıl kazandığını doğru ayırt edip edemediğinizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Onay Şartı Tuzağı","metin":"öğrenci dayanışma aidatı için sendikanın onayının gerektiğini sanabilir. Doğrusu: madde 39/4 açıkça sendikanın onayının aranmadığını belirtir, ifade doğrudur."},"E":{"ad":"Süre Kapsamı Tuzağı","metin":"öğrenci iş sözleşmesi sona erenlerin haktan tamamen düştüğünü sanabilir. Doğrusu: madde 39/3 uyarınca bu kişiler iş sözleşmelerinin sona erdiği tarihe kadar yararlanmaya devam eder, ifade doğrudur."},"A":{"ad":"Ne soruluyor","metin":"toplu iş sözleşmesinden yararlanmaya ilişkin beş ifadeden hangisinin kanuna aykırı olduğu soruluyor. Kural: 6356 sayılı Kanunun 39 üncü maddesinin ikinci fıkrasına göre imza tarihinde taraf sendikaya üye olanlar yürürlük tarihinden itibaren yararlanır. Doğrusu: bu ifade kanunla birebir uyumludur, yanlış olan şık bu değildir."},"B":{"ad":"Zamanlama Tuzağı","metin":"öğrenci bildirim tarihini imza tarihiyle karıştırıp bu ifadeyi yanlış sanabilir. Doğrusu: madde 39/2 imza tarihinden sonra üye olanların işverene bildirim tarihinden itibaren yararlanacağını açıkça düzenler, ifade doğrudur."}},"celdiriciYol":{},"hap":"İşveren vekilleri ve toplu iş sözleşmesi görüşmelerine işvereni temsilen katılanlar, toplu iş sözleşmesinden yararlanamaz.","teshis":{},"verilen":[],"donem":6,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"6356 sayılı Kanun m.39/3\u0027e göre imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren taraf sendika üyesi, sözleşmesinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanmaya devam eder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Her zaman doğrudur\u0027 sorularında istisna barındırmayan, mutlak ifade taşıyan fıkrayı ara; \u0027aksine hüküm yoksa\u0027 veya \u0027onay aranmaz\u0027 gibi kesin kalıpları taşıyan cümle doğru olma ihtimali yüksektir.","konu":"toplu is sözleşmesi","tablo":{"satirlar":[["A) Toplu görüşmelere işvereni temsilen katılan kişi, görüşm…","m.39/7","YANLIŞ ifade"],["B) Dayanışma aidatı ödemek isteyen, imza tarihinde taraf se…","m.39/4","YANLIŞ ifade"],["C) Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi a…","m.39/3","doğru ifade"],["D) Aynı işverene ait, aynı işkolunda birden çok işyeri bulu…","m.34/2","YANLIŞ ifade"],["E) İmza tarihinden sonra taraf işçi sendikasına üye olan iş…","m.39/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren taraf sendika üyesi, iş sözleşmesinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanır.","E":"İmza tarihinden sonra taraf işçi sendikasına üye olan işçi, üyeliğinin işverene bildirilmesini beklemeksizin üyelik tarihinden itibaren sözleşmeden yararlanır.","A":"Toplu görüşmelere işvereni temsilen katılan kişi, görüşmeler sona erdikten sonra işçi sendikasına üye olursa toplu iş sözleşmesinden yararlanır.","D":"Aynı işverene ait, aynı işkolunda birden çok işyeri bulunması hâlinde, işletme düzeyinde toplu iş sözleşmesi şartı aranmaksızın bu işyerlerinden birinde işyeri düzeyinde toplu iş sözleşmesi yapılabilir.","B":"Dayanışma aidatı ödemek isteyen, imza tarihinde taraf sendikaya üye olmayan işçinin sözleşmeden yararlanabilmesi, taraf işçi sendikasının onayına bağlıdır."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.34","metin":"MADDE 34 – (1) Bir toplu iş sözleşmesi aynı işkolunda bir veya birden çok işyerini kapsayabilir. (2) Bir gerçek ve tüzel kişiye veya bir kamu kurum ve kuruluşuna ait aynı işkolunda birden çok işyerinin bulunduğu işyerlerinde, toplu iş sözleşmesi ancak işletme düzeyinde yapılabilir. (3) Grup toplu iş sözleşmesi, tarafların anlaşması üzerine bir işçi sendikası ile bir işveren sendikası arasında, birden çok üye işverene ait aynı işkolunda kurulu işyerleri ve işletmeleri kapsamak üzere yapılır. (4) İşletme toplu iş sözleşmesi yapılacak işyerlerinin aranılan niteliğe sahip olup olmadıklarına ilişkin uyuşmazlıklar, işletme merkezinin bulunduğu yerdeki mahkemede on beş gün içinde karara bağlanır. (Değişik cümle: 12/10/2017-7036/32 md.) Karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi on beş gün içinde kesin olarak karar verir. Toplu iş sözleşmesinin şekli ve süresi"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.39","metin":"MADDE 39 – (1) Toplu iş sözleşmesinden taraf işçi sendikasının üyeleri yararlanır. (2) Toplu iş sözleşmesinden, sözleşmenin imzalanması tarihinde taraf sendikaya üye olanlar yürürlük tarihinden, imza tarihinden sonra üye olanlar ise üyeliklerinin taraf işçi sendikasınca işverene bildirildiği tarihten itibaren yararlanır. (3) Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren üyeler de, iş sözleşmelerinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanır. (4) Toplu iş sözleşmesinin imzası sırasında taraf işçi sendikasına üye olmayanlar, sonradan işyerine girip de üye olmayanlar veya imza tarihinde taraf işçi sendikasına üye olup da ayrılanlar veya çıkarılanların toplu iş sözleşmesinden yararlanabilmeleri, toplu iş sözleşmesinin tarafı olan işçi sendikasına dayanışma aidatı ödemelerine bağlıdır. Bunun için işçi sendikasının onayı aranmaz. Dayanışma aidatı ödemek suretiyle toplu iş sözleşmesinden yararlanma, talep tarihinden geçerlidir. (İptal dördüncü cümle:Anayasa Mahkemesinin 30/12/2020 tarihli ve E.:2020/57; K.:2020/83 sayılı Kararı ile) (5) Dayanışma aidatının miktarı, üyelik aidatından fazla olmamak kaydıyla sendika tüzüğünde belirlenir. (6) Faaliyeti durdurulmuş sendikalara dayanışma aidatı ödenmez. (7) Bu Kanun anlamında işveren vekilleri ile toplu iş sözleşmesi görüşmelerine işvereni temsilen katılanlar, toplu iş sözleşmesinden yararlanamaz. (8) Grev sonunda yapılan toplu iş sözleşmesinden, 65 inci maddeye göre zorunlu olarak çalışanlar dışında işyerinde çalışmış olanlar aksine hüküm bulunmadıkça yararlanamaz. Teşmil"}],"hakem":"6356 sayılı Kanun m.39/3, imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren sendika üyelerinin sözleşmelerinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanacağını açıkça ve istisnasız hüküm altına almaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Aynı işverene ait aynı işkolundaki birden çok işyerinde toplu iş sözleşmesi sadece işletme düzeyinde yapılabilir; işyeri düzeyinde yapılamaz.","E":"İmza tarihinden sonra üye olan işçi, üyeliğin işverene bildirildiği tarihten yararlanmaya başlar; üyelik tarihinden değil.","A":"Görüşmelerde işvereni temsilen katılan kişi sonradan sendikaya üye olsa da hiçbir şekilde sözleşmeden yararlanamaz; bu yasak kuraldan muafiyet tanımaz.","B":"Dayanışma aidatı ödemeye karar veren işçi sendikasının onayını beklemeye gerek yoktur; talep tarihinden itibaren yararlanma başlar."},"dogru":"İmza ile yürürlük tarihi arasında işten ayrılan sendika üyesi, ayrılma tarihine kadar sözleşmeden yararlanmaya devam eder. Bu kural istisnaların tanımadığı mutlak bir hükümdür.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 39. madde 3. paragraf.","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 34. madde","tanim":"İşçi sendikası ile işveren veya işveren sendikası arasında, işçilerin çalışma koşullarını düzenlemek için yapılan sözleşme.","ad":"toplu iş sözleşmesi"},{"kaynak":"Sendikalar ve TİS K. 39. madde","tanim":"Toplu iş sözleşmesinin yapılmasında taraf olan sendikaya imza tarihinde kayıtlı olan işçi.","ad":"taraf sendika üyesi"},{"kaynak":"Sendikalar ve TİS K. 39. madde","tanim":"Toplu iş sözleşmesinin imzasında üye olmayan veya üyelikten ayrılan işçilerin, o sözleşmeden yararlanabilmesi için ödedikleri miktar.","ad":"dayanışma aidatı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":["2026/2","2024/2","2021/1","2020/3","2019/2","2019/1"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre toplu iş sözleşmesinin kapsamı ve sözleşmeden yararlanmaya ilişkin aşağıdaki durumlardan hangisi HER ZAMAN doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-01","verilenler":[],"dayanak":"6356 sayılı Kanun m.39/2, m.39/3, m.39/4, m.39/7 ve m.34/2","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konfeksiyon A.Ş.\u0027de TİS 5 Ocak 2024\u0027te imzalanıyor, yürürlük tarihi 1 Şubat 2024. Üye işçi Ayşe\u0027nin iş sözleşmesi 20 Ocak 2024\u0027te sona eriyor. Aynı işkolunda işverenin 3 ayrı işyeri daha var. Toplu görüşmelere işvereni temsilen katılan Mehmet, görüşmeler bitince sendikaya üye oluyor
