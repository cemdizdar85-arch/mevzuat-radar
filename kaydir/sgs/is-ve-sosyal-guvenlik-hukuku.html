k statüsünde sayılacağını sorar.","panel_ornek":"Bir arkadaşın, çalıştığı kafeden izin alıp 3 aylığına spor kulübü yönetim kuruluna seçiliyor. Kafedeki sigortası kesilmiyor, aynı kurallarla devam ediyor. \u0027Görev değişti ama statü aynı kaldı\u0027 mantığı burada da geçerli.","ornek":"Bir arkadaşın, çalıştığı kafeden izin alıp 3 aylığına spor kulübü yönetim kuruluna seçiliyor. Kafedeki sigortası kesilmiyor, aynı kurallarla devam ediyor. \u0027Görev değişti ama statü aynı kaldı\u0027 mantığı burada da geçerli.","yontemler":"Tek kural: sendika yönetimine seçilenler işyerinden ayrılsa da 4/a sigortalısı sayılmaya devam eder, madde metnini ezbere bilmek yeterlidir.","nedir":"Bu konu, işçi sendikası yönetimine seçilenlerin sigortalılık statüsünün devam edip etmediğini düzenler. Sınav, işyerinden ayrılmanın 4/a statüsünü bozup bozmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Statü Karıştırma Tuzağı","metin":"öğrenci işyerinden ayrılıp bağımsız çalıştığı için 4/1-b sigortalısı sanır. Doğrusu: kanun burada özel olarak 4/1-a hükümlerinin uygulanacağını belirtmiştir, statü değişmez."},"E":{"ad":"Taraf Karıştırma Tuzağı","metin":"öğrenci sendikayı işveren vekili sanır. Doğrusu: işveren vekilliği m.12\u0027de işveren adına iş yönetimini yürütenler için tanımlıdır, sendika yönetim kurulu üyeliğiyle ilgisi yoktur."},"D":{"ad":"Kapsam Karıştırma Tuzağı","metin":"öğrenci m.4/3-c\u0027deki kamu görevlisi sendika yöneticiliğine ilişkin aylıksız izin hükmünü işçi sendikası yöneticisine uygular. Doğrusu: aylıksız izin hükmü yalnız 4/1-c kapsamındaki kamu görevlileri için öngörülmüştür, işçi statüsündeki yönetici için değil."},"B":{"ad":"Sona Erme Tuzağı","metin":"öğrenci işyerinden fiilen ayrılmayı sigortalılığın son bulması sanır. Doğrusu: kanun bu kişileri açıkça 4/1-a kapsamında saymaya devam eder, sigortalılık kesilmez, yeniden tescil de gerekmez."}},"celdiriciYol":null,"hap":"İşçi sendikaları ve konfederasyonları ile sendika şubelerinin başkanlık ve yönetim kurullarına seçilenler, 5510 sayılı Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamındaki sigortalılıklarını görev süresince kesintisiz sürdürür.","teshis":{"C":{"gercek":"Madde metni açıkça bu kişileri 4/1-a bendine göre sigortalı sayılanlarla aynı hükümlere tabi tutar, (b) bendine atıf yoktur.","ayirt":"Metinde hangi bendin hükümleri uygulanıyor deniyor?","paragraf":"5510 s.K. m.4/2-a","yanilgi":"Bağımsız çalışan gibi göründüğü için 4/1-b sigortalısı sayıyorsun."},"E":{"gercek":"İşveren vekilliği, işveren adına işin/işyerinin yönetimini üstlenmeyi gerektirir; sendika yöneticiliğinin bununla ilgisi yoktur.","ayirt":"Bu kişi işveren adına iş mi yönetiyor?","paragraf":"5510 s.K. m.12","yanilgi":"Yönetim kuruluna seçilmeyi işveren vekilliğiyle karıştırıyorsun."},"A":{"gercek":"5510 s.K. m.4/2-a, sendika yöneticiliğine seçilenleri açıkça 4/1-a kapsamında sigortalı sayar; görev süresince statü korunur.","ayirt":"Kanun bu kişi için özel bir devam hükmü koymuş mu?","paragraf":"5510 s.K. m.4/2-a","yanilgi":"Bu şıkkı eleyen öğrenci, işyerinden fiziken ayrılmanın sigortalılığı otomatik bitireceğini düşünür."},"D":{"gercek":"Aylıksız izinli sayılma hükmü yalnız 4/1-c kapsamındaki kamu görevlisi sendika yöneticileri içindir; işçi statüsündeki (a) bendi sigortalıları için ayrı ve kesintisiz devam hükmü vardır.","ayirt":"Bu hüküm hangi bent için, kime yazılmış?","paragraf":"5510 s.K. m.4/3-c","yanilgi":"Farklı bir bentteki (kamu görevlisi) hükmü bu işçiye de uygulanır sanıyorsun."},"B":{"gercek":"Kanun, sendika yöneticiliğine seçilenler için 4/1-a hükümlerinin uygulanmaya devam edeceğini özel olarak düzenlemiştir; kesinti ya da yeniden tescil aranmaz.","ayirt":"Kanun bu durumu istisna olarak ayrıca düzenlemiş mi?","paragraf":"5510 s.K. m.4/2-a","yanilgi":"İşyerinden ayrılmayı sigortalılığın sona ermesiyle eş tutuyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 112"},"kural":"İş Kanunu m.5 son fıkraya göre işçi ihlal ihtimalini güçlü biçimde gösteren bir durumu ortaya koyarsa ispat yükü işverene geçer.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 112","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde birden fazla sayı (dört ay, sekiz ay gibi) geçen sorularda hangi sayının hangi hükme ait olduğunu maddeyi tekrar okuyarak eşleştir.","konu":"sendikal guvenceler","tablo":{"satirlar":[["A) İşçi, ihlalin varlığı ihtimalini güçlü bir biçimde göste…","4857 sayılı İş Kanunu m.5, son fıkra","doğru ifade"],["B) İş ilişkisinde ayrımcılık iddiasında ispat yükü her koşu…","4857 sayılı İş Kanunu m.5, son fıkra","YANLIŞ ifade"],["C) Ayrımcılık nedeniyle işçinin talep edebileceği tazminat,…","4857 sayılı İş Kanunu m.5 ve m.7","YANLIŞ ifade"],["D) İşveren, esaslı sebepler bulunmasa dahi tam süreli çalış…","4857 sayılı İş Kanunu m.5, fıkra 2","YANLIŞ ifade"],["E) Cinsiyet veya gebelik nedeniyle farklı işlem yapma yasağ…","4857 sayılı İş Kanunu m.5, fıkra 3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Ayrımcılık nedeniyle işçinin talep edebileceği tazminat, yoksun bırakıldığı diğer haklardan ayrı olarak sekiz aya kadar ücreti tutarındadır.","E":"Cinsiyet veya gebelik nedeniyle farklı işlem yapma yasağı yalnızca iş sözleşmesinin kurulması aşamasında geçerlidir; sözleşmenin sona ermesinde bu yasak uygulanmaz.","A":"İşçi, ihlalin varlığı ihtimalini güçlü bir biçimde gösteren bir durumu ortaya koyduğunda, işveren böyle bir ihlalin mevcut olmadığını ispat etmekle yükümlü olur.","D":"İşveren, esaslı sebepler bulunmasa dahi tam süreli çalışan işçi karşısında kısmi süreli çalışan işçiye farklı işlem yapabilir.","B":"İş ilişkisinde ayrımcılık iddiasında ispat yükü her koşulda işçiye aittir; işçinin güçlü ihtimal gösteren bir durum ortaya koyması ispat yükünü işverene geçirmez."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.5","metin":"Madde 5 – (Ek: 6/2/2014-6518/57 md.) İş ilişkisinde dil, ırk, renk, cinsiyet, engellilik, siyasal düşünce, felsefî inanç, din ve mezhep ve benzeri sebeplere dayalı ayrım yapılamaz. İşveren, esaslı sebepler olmadıkça tam süreli çalışan işçi karşısında kısmî süreli çalışan işçiye, belirsiz süreli çalışan işçi karşısında belirli süreli çalışan işçiye farklı işlem yapamaz. İşveren, biyolojik veya işin niteliğine ilişkin sebepler zorunlu kılmadıkça, bir işçiye, iş sözleşmesinin yapılmasında, şartlarının oluşturulmasında, uygulanmasında ve sona ermesinde, cinsiyet veya gebelik nedeniyle doğrudan veya dolaylı farklı işlem yapamaz. Aynı veya eşit değerde bir iş için cinsiyet nedeniyle daha düşük ücret kararlaştırılamaz. İşçinin cinsiyeti nedeniyle özel koruyucu hükümlerin uygulanması, daha düşük bir ücretin uygulanmasını haklı kılmaz. İş ilişkisinde veya sona ermesinde yukarıdaki fıkra hükümlerine aykırı davranıldığında işçi, dört aya kadar ücreti tutarındaki uygun bir tazminattan başka yoksun bırakıldığı haklarını da talep edebilir. 2821 sayılı Sendikalar Kanununun 31 inci maddesi hükümleri saklıdır. 20 nci madde hükümleri saklı kalmak üzere işverenin yukarıdaki fıkra hükümlerine aykırı davrandığını işçi ispat etmekle yükümlüdür. Ancak, işçi bir ihlalin varlığı ihtimalini güçlü bir biçimde gösteren bir durumu ortaya koyduğunda, işveren böyle bir ihlalin mevcut olmadığını ispat etmekle yükümlü olur. İşyerinin veya bir bölümünün devri"},{"ad":"TTK (6102 s.K.) m.478","metin":"MADDE 478- (1) İlk esas sözleşme ile veya esas sözleşme değiştirilerek bazı paylara imtiyaz tanınabilir. (2) İmtiyaz; kâr payı, tasfiye payı, rüçhan ve oy hakkı gibi haklarda, paya tanınan üstün bir hak veya kanunda öngörülmemiş yeni bir pay sahipliği hakkıdır. (3) 360 ıncı madde hükmü saklıdır. (4) (Ek: 26/6/2012-6335/25 md.) Sermayesinin yarısından fazlası tek başına veya birlikte; Devlet, il özel idaresi, belediye ve diğer kamu tüzel kişileri, sendikalar, dernekler, vakıflar, kooperatifler ve bunların üst kuruluşlarına ait anonim şirketlerde ve bu şirketlerin aynı oranda sermaye payına sahip oldukları iştiraklerinde; bunların sahip oldukları paylara tesis edilebilecek imtiyazlar hariç olmak üzere, diğer paylara, belirli bir grup oluşturan pay sahiplerine, belirli pay gruplarına ve azlığa bu Kanunda düzenlenen herhangi bir imtiyaz tesis edilemez. Bu hüküm, payları borsada işlem gören anonim şirketlere, 5411 sayılı Kanunun 3 üncü maddesinde tanımlanan kredi kuruluşlarına ve finansal kuruluşlara uygulanmaz. II - Oyda imtiyazlı paylar"}],"hakem":"İş Kanunu m.5 son fıkrası, sendikal ayrımcılık da dahil olmak üzere ayrımcılık iddiasında işçi güçlü ihtimal karinesini gösterdiğinde ispat yükünün işverene geçmesi kuralını açıkça içermektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Ayrımcılık tazminatı dört aya kadar ücreti tutarındadır; sekiz aylık tutar başka bir hüküme (toplu işçi çıkarma) aittir ve bu iki kavram karıştırılmıştır.","E":"Cinsiyet veya gebelik nedeniyle farklı işlem yasağı yalnız sözleşmenin yapılmasında değil; sözleşmenin uygulanması ve sona ermesinde de geçerlidir.","D":"Kanun aksini söyler: işveren esaslı sebep olmadıkça kısmî süreli işçiye tam süreli işçiden farklı işlem yapamaz; burada kural tersine çevrilmiştir.","B":"Maddenin başındaki genel kural (ispat işçiye aittir) tüm durumlar için mutlak değildir; işçi güçlü ihtimal gösterirse ispat yükü işverene kaymaktadır."},"dogru":"İşçi sendikaya üyelik nedeniyle ayrımcılığa uğradığını iddia edince, önce güçlü ihtimal gösteren bir durum ortaya koymak gerekir; bunu başarırsa işveren ihlalin olmadığını ispatlamak zorunda kalır.","sinav":"İş Kanunu 4857 sayılı Kanun 5. madde","kavramlar":[{"kaynak":"İş Kanunu 5. madde","tanim":"İşçi ayrımcılık iddiasında ihlalin varlığını güçlü bir biçimde gösteren bir durumu ortaya koyarsa, ispat yükü işverene geçer.","ad":"güçlü ihtimal karinesı"},{"kaynak":"İş Kanunu 5. madde","tanim":"Ayrımcılığa uğrayan işçi, yoksun bırakıldığı haklardan başka dört aya kadar ücreti tutarında tazminat talep edebilir.","ad":"ayrımcılık tazminatı"},{"kaynak":"İş Kanunu 5. madde","tanim":"İşveren kısmî süreli veya belirli süreli işçilere, tam süreli veya belirsiz süreli işçilerden farklı işlem yapabilmesi için bulunması gerekli olan hukuki sebeptir.","ad":"esaslı sebep"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2020/2"]},"oyun":null,"tip":"teori","soru":"Sendika üyesi bir işçi, sendikaya üye olduğu gerekçesiyle işveren tarafından ücretinde ayrımcılığa uğradığını ileri sürerek dava açmıştır. 4857 sayılı İş Kanunu\u0027na göre ispat yükü ve ayrımcılık tazminatına ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-09","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.5, son fıkra","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir tekstil fabrikasında çalışan Mehmet, sendikaya üye olduktan 2 ay sonra ücretine zam yapılmadığını, aynı kıdemdeki sendikasız arkadaşı Ahmet\u0027in ücretine %15 zam geldiğini fark eder.","anlatim":"Mehmet elindeki bordroları mahkemeye sunar. Ahmet\u0027in ücreti 18.000 TL\u0027ye çıkarken Mehmet\u0027inki 15.000 TL\u0027de kalmıştır.","doldur":[]},{"formul":"Ne yapacağız: Mehmet\u0027in ispat yükü nereye geçer, tazminatı kaç aylık olur, farklı işlem hangi hâllerde caiz, bunu beş ifadede tek tek deneyeceğiz.","anlatim":"4857 sayılı İş Kanunu m.5 bu olayın tam merkezinde durur. Şimdi A\u0027dan E\u0027ye kadar her cümleyi bu bordrolarla test edelim.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"4857 sayılı İş Kanunu m.5, son fıkra","karar":"doğru","anlatim":"Mehmet aynı kıdemdeki Ahmet\u0027le kendisi arasındaki zam farkını somut belgeyle gösterir. İş Kanunu m.5 son fıkra bu durumda ispat yükünü işverene devreder, işveren ayrımcılık olmadığını kanıtlamalıdır.","formul":"Şık A: Mehmet, bordro farkını mahkemeye gösterdi, bu ihlal ihtimalini güçlü biçimde ortaya koyar mı ve ispat yükü işverene geçer mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"4857 sayılı İş Kanunu m.5, son fıkra","karar":"yanlış","anlatim":"Mehmet somut bir karine sunduğu için kural burada değişir, genel ispat yükü kalkar. Madde metni istisnayı açıkça tanır, avukatın iddiası yanlıştır.","formul":"Şık B: İşveren avukatı \u0027ispat yükü her koşulda işçidedir, Mehmet\u0027in bordro farkı hiçbir şey değiştirmez\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"4857 sayılı İş Kanunu m.5 ve m.7","karar":"yanlış","anlatim":"Ayrımcılık tazminatı dört aya kadar ücret tutarıdır, sekiz aylık süre başka bir maddede toplu işçi çıkarma sonrası geçici iş ilişkisi yasağıyla ilgilidir. Avukat iki farklı hükmü karıştırmıştır.","formul":"Şık C: Mehmet\u0027in avukatı \u0027ayrımcılık tazminatı sekiz aylık ücret tutarında istenir\u0027 diyor, doğru mu söylüyor?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"4857 sayılı İş Kanunu m.5, fıkra 2","karar":"yanlış","anlatim":"Madde 5 ikinci fıkra, esaslı sebep olmadıkça kısmi süreli işçiye farklı işlem yapmayı yasaklar. İşverenin bu sözü kanuna aykırıdır.","formul":"Şık D: İşveren \u0027Mehmet kısmi süreli çalışsaydı esaslı sebep aramadan farklı ücret verirdim\u0027 diyor, bu kanuna uygun mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"4857 sayılı İş Kanunu m.5, fıkra 3","karar":"yanlış","anlatim":"Madde 5 üçüncü fıkra yasağı sözleşmenin kurulmasından sona ermesine kadar tüm aşamalara yayar. İşverenin bu savunması yanlıştır.","formul":"Şık E: İşveren \u0027ayrımcılık yasağı sadece işe alırken geçerlidir, fesihte uygulanmaz\u0027 diyor, buna güvenebilir mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Mehmet\u0027in somut bordro farkı, ispat yükünü işverene çeviren tek güçlü karinedir. Kendine hep şunu sor: işçi yalnızca iddia mı etti, yoksa elle tutulur bir karine mi sundu?","doldur":[]}],"anahtar":[{"ornek":"işverene","kok":"işvere"},{"ornek":"mehmet","kok":"mehmet"},{"ornek":"kanunu","kok":"kanunu"},{"ornek":"bordroları","kok":"bordro"},{"ornek":"gösteren","kok":"göster"},{"ornek":"karine","kok":"karine"}],"konuGiris":{"harita":"Ne zaman test edilir: işçi sendika üyeliği yüzünden ücrette veya işlemde ayrımcılığa uğradığını iddia ettiğinde. Nasıl ölçülür: önce işçi ihlal ihtimalini güçlü gösteren olguyu ortaya koyar, sonra ispat yükü işverene geçer. Nasıl kaydedilir: tazminat, işçinin dört aya kadar ücreti tutarıyla sınırlı olarak hesaplanır.","desen":"Sınav genelde ispat yükünün baştan işçide olduğunu ama güçlü emare gösterildiğinde işverene geçtiğini karıştırtır. Tazminat sınırının dört aylık ücret olduğu, altı ay ya da sınırsız gibi yanlış seçeneklerle çeldirilir. Bu soru m.5 son fıkra hükmü noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İş ilişkisinde sendika üyeliği gibi sebeplerle farklı işlem yapılamaması kuralı","ad":"ayrımcılık yasağı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"İşçinin ihlal ihtimalini gösteren, ispat yükünü ters çeviren olgu","ad":"güçlü emare","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"İddianın doğruluğunu kanıtlama zorunluluğunun hangi tarafa ait olduğu","ad":"ispat yükü","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"İhlal halinde işçiye ödenen, dört aylık ücreti aşamayan uygun tazminat","ad":"ayrımcılık tazminatı","kim":"kanun sabitler"}],"sinavda":"Sendika üyeliği nedeniyle ayrımcılık iddiasında ispat yükünün dağılımı ve tazminat üst sınırı sorulur.","panel_ornek":"Bir markette çalışan arkadaşın, izin günü değiştiği için müdürüyle tartışıyor ve haksızlığa uğradığını düşünüyor; ama bunu kanıtlamak ona mı düşer yoksa müdür mü açıklama yapmalı, işte tam bu tartışılıyor. Diyelim ki aylık maaşı 6.000 lira olsun, kanun azami tazminatı bu maaşın 4 katıyla sınırlıyor.","ornek":"Bir markette çalışan arkadaşın, izin günü değiştiği için müdürüyle tartışıyor ve haksızlığa uğradığını düşünüyor; ama bunu kanıtlamak ona mı düşer yoksa müdür mü açıklama yapmalı, işte tam bu tartışılıyor. Diyelim ki aylık maaşı 6.000 lira olsun, kanun azami tazminatı bu maaşın 4 katıyla sınırlıyor.","yontemler":"İşçi önce emareyi gösterir, ardından işveren ihlalin yokluğunu ispatlar; tazminat dört aylık ücreti geçemez.","nedir":"Sendikal güvence, işçinin sendika üyeliği ya da faaliyeti yüzünden ayrımcılığa uğramasını önleyen yasal korumadır. Sınav, ispat yükünün kime ait olduğunu ve tazminat sınırını ölçer."},"olay":"","tuzak":{"C":{"ad":"Tutar Karıştırma Tuzağı","metin":"öğrenci madde 7\u0027deki sekiz aylık süreyi ayrımcılık tazminatının tavanıyla karıştırır. Doğrusu: ayrımcılık tazminatı dört aya kadar ücret tutarındadır, sekiz ay farklı bir hükme (toplu işçi çıkarma) aittir."},"E":{"ad":"Kapsam Daraltma Tuzağı","metin":"öğrenci yasağı yalnız sözleşmenin kurulması aşamasıyla sınırlar. Doğrusu: yasak sözleşmenin yapılmasında, şartlarının oluşturulmasında, uygulanmasında ve sona ermesinde geçerlidir."},"D":{"ad":"Ters Kural Tuzağı","metin":"öğrenci madde metnindeki yasağı tersine çevirip işverene serbesti tanır. Doğrusu: işveren esaslı sebep olmadıkça kısmi süreli işçiye tam süreliye göre farklı işlem yapamaz."},"B":{"ad":"Genel Kural Tuzağı","metin":"öğrenci maddenin ilk cümlesindeki genel kuralı (ispat işçiye aittir) mutlak sanıp istisnayı yani güçlü ihtimal karinesini görmezden gelir. Doğrusu: işçi güçlü ihtimal gösterirse ispat yükü işverene geçer, kural mutlak değildir."}},"celdiriciYol":{},"hap":"İşçi güçlü ihtimal gösteren bir durum ortaya koyarsa ayrımcılık iddiasında ispat yükü işverene geçer.","teshis":{"D":{"gercek":"Madde 5 ikinci fıkra, esaslı sebep olmadıkça kısmi süreli işçiye farklı işlem yapılmasını yasaklar.","ayirt":"Metinde \u0027esaslı sebepler olmadıkça\u0027 ibaresi kimi koruyor, işvereni mi işçiyi mi?","paragraf":"4857 sayılı İş K. m.5, fıkra 2","yanilgi":"Kısmi süreli çalışanların tam süreli çalışanlara göre daha az korunduğunu, işverenin serbestçe ayrım yapabileceğini sanırsın."},"E":{"gercek":"Madde 5 üçüncü fıkra yasağı sözleşmenin yapılması, şartların oluşturulması, uygulanması ve sona ermesinin tamamına yayar.","ayirt":"Madde metni yasağı tek bir aşamayla mı sınırlıyor yoksa sözleşmenin tüm evrelerini mi kapsıyor?","paragraf":"4857 sayılı İş K. m.5, fıkra 3","yanilgi":"Ayrımcılık yasağının yalnızca işe alım aşamasında geçerli olduğunu, fesih aşamasında uygulanmayacağını sanırsın."},"A":{"gercek":"İş Kanunu m.5 son fıkra, işçi güçlü ihtimal gösteren bir durum ortaya koyduğunda ispat yükünü işverene devreder.","ayirt":"İşçi somut bir karine mi sundu, yoksa yalnızca iddiada mı bulundu?","paragraf":"4857 sayılı İş K. m.5, son fıkra","yanilgi":"Bu şıkkı elerken güçlü ihtimal karinesinin ayrı bir istisna olduğunu değil, genel ispat kuralının her olayda geçerli olduğunu düşünürsün."},"C":{"gercek":"Ayrımcılık tazminatı m.5 son fıkraya göre dört aya kadar ücret tutarındadır; sekiz ay ise toplu işçi çıkarma sonrası geçici iş ilişkisi yasağına ilişkindir.","ayirt":"Bu sayı hangi maddenin hangi konusunda geçiyor, tazminatla mı yoksa başka bir yasakla mı ilgili?","paragraf":"4857 sayılı İş K. m.5 ve m.7","yanilgi":"Kanunda geçen farklı bağlamdaki sekiz aylık süreyi tazminat tavanıyla aynı hüküm sanırsın."},"B":{"gercek":"Madde metni açıkça güçlü ihtimal karinesi hâlinde ispat yükünün işverene geçeceğini düzenler.","ayirt":"Kuralın \u0027ancak\u0027 bağlacından sonraki istisna cümlesini okudun mu?","paragraf":"4857 sayılı İş K. m.5, son fıkra","yanilgi":"İspat yükünün hiçbir koşulda değişmeyeceğini, istisnanın yalnızca teoride kaldığını sanırsın."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 108"},"kural":"5510 sayılı Kanun m.37\u0027ye göre 360 günlük prim şartı, sigortalının kendisi için bildirilmiş olması hâlinde aranır; iş kazası veya meslek hastalığı sonucu sürekli iş göremezlik geliri, malûllük, vazife malûllüğü veya yaşlılık aylığı almakta iken ölenler için bu şart aranmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 108","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Metinde \u0027veya\u0027 ile ayrılan istisna hâllerini, şıktaki \u0027her koşulda\u0027 gibi genelleyici ifadelerden ayırt et; genelleyici sözcük çoğunlukla tuzaktır.","konu":"uzun vadeli sigorta kolları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Kanun maddesi","37","-"],["HESAP","-","-"],["A) Cenaze ödeneği sırasıyla sigortalının eşine, yoksa çocuk…","m.37/3","doğru ifade"],["B) Cenaze ödeneğinin hak sahiplerine ödenememesi ve cenazen…","m.37/4","doğru ifade"],["C) Cenaze ödeneği ödenebilmesi, sigortalının ölüm tarihinde…","m.37/3","YANLIŞ ifade"],["D) 4 üncü maddenin birinci fıkrasının (c) bendi kapsamındak…","m.37/5","doğru ifade"],["E) Cenaze ödeneği tutarı, Kurum Yönetim Kurulunca belirleni…","m.37/3","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Cenaze ödeneği ödenebilmesi, sigortalının ölüm tarihinden önce her koşulda en az 360 gün malullük, yaşlılık ve ölüm sigortası primi bildirilmiş olması şartına bağlıdır.","E":"Cenaze ödeneği tutarı, Kurum Yönetim Kurulunca belirlenip Bakan tarafından onaylanan tarife üzerinden ödenir.","A":"Cenaze ödeneği sırasıyla sigortalının eşine, yoksa çocuklarına, o da yoksa ana ve babasına, o da yoksa kardeşlerine ödenir.","D":"4 üncü maddenin birinci fıkrasının (c) bendi kapsamındaki sigortalılardan ölenlerin hak sahiplerine kendi kurumlarınca cenaze gideri ödenmişse, Kurum tarafından ayrıca cenaze ödeneği ödenmez.","B":"Cenaze ödeneğinin hak sahiplerine ödenememesi ve cenazenin gerçek veya tüzel kişilerce kaldırılması halinde, belgeye dayanan masraflar bu kişilere ödenir."},"kaynak":{"alinti":"de düzenlenen cenaze ödeneğinin şartlarını test etmektedir; doğru sık (C), kanunun","liste":[{"ad":"5510 s. SGK Kanunu m.37 [1/2]","metin":"MADDE 37- (Değişik: 17/4/2008-5754/23 md.) Evlenmeleri nedeniyle, gelir veya aylıklarının kesilmesi gereken kız çocuklarına evlenmeleri ve talepte bulunmaları halinde almakta oldukları aylık veya gelirlerinin iki yıllık 17/4/2017 tarihli ve 690 sayılı KHK’nin 36 ncı maddesiyle, bu fıkrada yer alan “üçüncü fıkrasının (d) ve (e)” ibaresi “dördüncü fıkrasının (d), (e) ve (f)” şeklinde değiştirilmiş, daha sonra bu hüküm 1/2/2018 tarihli ve 7077 sayılı Kanunun 32 nci maddesiyle aynen kabul edilerek kanunlaşmıştır. 54 tutarı bir defaya mahsus olmak üzere evlenme ödeneği olarak peşin ödenir. Evlenme ödeneği alan hak sahibinin aylığının kesildiği tarihten itibaren iki yıl içerisinde yeniden hak sahibi olması halinde, iki yıllık sürenin sonuna kadar gelir veya aylık bağlanmaz, bu durumda olanlar 60 ıncı maddenin birinci fıkrasının (f) bendi kapsamında genel sağlık sigortalısı sayılır. Evlenme ödeneği verilmesi halinde, diğer hak sahiplerinin aylık veya gelirleri evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren 34 üncü maddeye göre yeniden belirlenir. İş kazası veya meslek hastalığı sonucu veya sürekli iş göremezlik geliri, malûllük, vazife malûllüğü veya yaşlılık aylığı almakta iken veya kendisi için en az 360 gün malûllük, yaşlılık ve ölüm sigortası primi bildirilmiş olup da ölen sigortalının hak sahiplerine Kurum Yönetim Kurulunca belirlenip Bakan tarafından onaylanan tarife üzerinden cenaze ödeneği ödenir. Cenaze ödeneği, sırasıyla sigortalının eşine, yoksa çocuklarına, o da yoksa ana babasına, o da yoksa kardeşlerine verilir."},{"ad":"5510 s. SGK Kanunu m.37 [2/2]","metin":"Cenaze ödeneğinin üçüncü fıkrada sayılanlara ödenememesi ve sigortalının cenazesinin gerçek veya tüzel kişiler tarafından kaldırılması durumunda, üçüncü fıkrada belirtilen tutarı geçmemek üzere belgelere dayanan masraflar, masrafı yapan gerçek veya tüzel kişilere ödenir. 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalı sayılanlardan ölenlerin hak sahiplerine kendi kurumları tarafından ilgili mevzuat gereği ölüm yardımı hariç cenaze gideri, cenaze nakil gideri ödeneği veya bu mahiyette bir ödemenin yapılması halinde, Kurum tarafından cenaze ödeneği ödenmez. Uzun vadeli sigorta kolları bakımından sigortalılık süresi"}],"hakem":"Soru, 5510 sayılı Kanun m.37\u0027de düzenlenen cenaze ödeneğinin şartlarını test etmektedir; doğru sık (C), kanunun \u0027her koşulda 360 gün şartı\u0027 ifadesinin yanlış olduğunu doğru şekilde belirtmiştir, zira kanun metni \u0027İş kazası veya meslek hastalığı sonucu veya sürekli iş göremezlik geliri, malûllük, vazife malûllüğü veya yaşlılık aylığı almakta iken\u0027 ölenler için bu şartı aramamaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Diğer kurumlar tarafından cenaze gideri ödenmiş olursa, Kurum ayrıca ödeme yapmaz. Kanun bu durum için mükerrerliği engeller.","E":"Tutar sabit bir sayı değil; Kurum Yönetim Kurulu belirler ve Bakan onaylar. Kanun yetki bu şekilde düzenlenmiştir.","A":"Ödeme sırası eş-çocuk-ana baba-kardeş şeklinde kanunda tam olarak böyle yazılıdır. Aday bunu yanlış düşünmese de sıranın doğru olduğunu kanından bilerek seçer.","B":"Hak sahiplerine ödenenemezse, masrafı yapan kişi veya kuruluşa belgeye dayalı tutarlar ödenir. Kanun bunu açıkça hükme bağlamıştır."},"dogru":"Cenaze ödeneği için 360 gün prim şartı her zaman geçerli değildir. İş kazası, meslek hastalığı veya emeklilik aylığı alanlar öldüğünde bu şart aranmaz; bu durumlarda şartsız ödenir.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 37. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 37. madde","tanim":"Cenaze ödeneğini alma hakkına sahip kişiler olup sigortalının eşi, çocukları, ana babası ve kardeşleridir.","ad":"hak sahibi"},{"kaynak":"5510 s. SGK Kanunu 37. madde","tanim":"Cenaze ödeneğinin bazı hallerde aranmayan, sigortalı için en az 360 gün malûllük yaşlılık ve ölüm sigortası priminin bildirilmesi koşuludur.","ad":"prim şartı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[{"yil":"2025/3","alinti":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu’na göre yukarıdakilerden hangileri uzun vadeli sigorta kolları içerisinde yer alır?"},{"yil":"2024/1","alinti":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu’na göre, uzun vadeli sigorta kollarının tamamı hangi seçenekte doğru gösterilmiştir?"}],"donemler":["2025/3","2024/1"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanununun 37 nci maddesinde düzenlenen cenaze ödeneğine ilişkin aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-zor/kp-10","verilenler":[{"deger":"37","anlam":"5510 sayılı Kanun içinde cenaze ödeneğinin hak şartlarını, miktarını ve ödeme koşullarını belirten hüküm.","ad":"Kanun maddesi"}],"dayanak":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu m.37","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Kasım 2023\u0027te bir tekstil fabrikasında forklift operatörü Mehmet Bey, iş kazası sonucu hayatını kaybediyor. SGK\u0027ya kaydına baktıklarında adına yalnızca 210 gün malullük-yaşlılık-ölüm primi bildirilmiş.","anlatim":"Aile SGK\u0027ya başvuruyor, cenaze ödeneği talep ediyor. İnsan kaynakları \u0027primi az, ödenek çıkmaz\u0027 diyor, sen bu iddiayı kontrol edeceksin.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanun m.37\u0027ye göre cenaze ödeneği ya 360 gün prim şartıyla ya da iş kazası/meslek hastalığı sonucu ölüm gibi istisna hâllerinde ödenir; Mehmet Bey\u0027in 210 günü bu yüzden hiç sorun değil.","anlatim":"Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"m.37/3","karar":"doğru","anlatim":"Kanun sırasıyla eş, yoksa çocuk, yoksa ana-baba, yoksa kardeş der; burada ödenek doğrudan eşe gider. Bu ifade metinle birebir örtüşüyor.","formul":"Şık A: Mehmet Bey\u0027in eşi ve çocukları var, kardeşi de var. SGK ödeneği kime öder, sıralamayı doğru mu biliyorsun?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"m.37/4","karar":"doğru","anlatim":"Hak sahibi bulunmazsa ve cenazeyi üçüncü kişi kaldırırsa, belgeye dayanan masraf o kişiye ödenir. Bu ifade de metne tamamen uygun.","formul":"Şık B: Mehmet Bey\u0027in kimsesi çıkmasa ve cenazesini komşusu belgeli masraflarla kaldırsa, SGK bu komşuya ödeme yapar mı?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"m.37/3","karar":"yanlış","anlatim":"Mehmet Bey iş kazası sonucu öldüğü için 360 gün şartı zaten aranmaz, bu istisna metinde açıkça yazar. \u0027Her koşulda\u0027 ifadesi bu istisnayı yok sayıyor, yani yanlış.","formul":"Şık C: İnsan kaynakları \u0027Mehmet Bey\u0027in 210 günü var, 360 gün şartı her koşulda arandığı için ödenek çıkmaz\u0027 diyor, katılır mısın?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"m.37/5","karar":"doğru","anlatim":"Kanun böyle bir durumda mükerrer ödemeyi engeller, kurum zaten ödemişse SGK ikinci kez ödemez. Bu ifade metinle birebir örtüşüyor.","formul":"Şık D: Mehmet Bey aslında 4/c kapsamında memur olsaydı ve kendi kurumu ölüm yardımı hariç cenaze gideri ödemiş olsaydı, SGK ayrıca cenaze ödeneği verir miydi?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"m.37/3","karar":"doğru","anlatim":"Kanun rakam vermez, tutarı Kurum Yönetim Kurulu belirler ve Bakan onaylar. Bu ifade de metne tam uygun.","formul":"Şık E: Aile \u0027ödenek tutarı kaç lira, kanunda yazıyor mu\u0027 diye soruyor, sen ne cevap verirsin?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Yanlış olan tek ifade C, çünkü 360 gün şartının istisnaları var ve \u0027her koşulda\u0027 bunu görmezden geliyor; kendine hep şunu sor: bu ölüm istisna hâllerinden biri mi, yoksa genel ölüm mü?","doldur":[]}],"anahtar":[{"ornek":"istisnadır","kok":"istisn"},{"ornek":"kazası","kok":"kazası"},{"ornek":"sonucu","kok":"sonucu"},{"ornek":"cenaze","kok":"cenaze"},{"ornek":"günlük","kok":"günlük"},{"ornek":"ödenek","kok":"ödenek"}],"konuGiris":{"harita":"Kim hak sahibidir: sırasıyla eş, çocuk, ana-baba, kardeş kontrol edilir. Ne zaman ödenir: ölen kişi belirli şartları (aylık alıyor olmak veya en az 360 gün prim) taşıyorsa ödenir. Nasıl belirlenir: tutar Kurum Yönetim Kurulunca belirlenip Bakan tarafından onaylanan tarifeye göre saptanır.","desen":"Soru genelde hak sahibi sırasını karıştırarak veya şartları eksik/fazla sayarak yanlış seçenek üretir (m.37, 3. fıkra). Bir diğer tuzak, 4/1-c kapsamındaki sigortalılar için kendi kurumu ödeme yaparsa Kurum\u0027un ayrıca ödeme yapmayacağı kuralının atlanmasıdır. Bu soru madde metnindeki sıralama ve istisna cümlelerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Ölen sigortalının hak sahiplerine bir kereye mahsus ödenen tutar","ad":"Cenaze ödeneği","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Ödeneğin verileceği kişilerin öncelik sıralaması: eş, çocuk, ana-baba, kardeş","ad":"Hak sahibi sırası","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Ölen sigortalı için aranan en az prim gün sayısı koşulu","ad":"360 gün prim şartı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Cenazeyi üçüncü kişi kaldırırsa belgeye dayalı masrafın ödenmesi kuralı","ad":"Masraf ödemesi istisnası","kim":"kanun sabitler"}],"sinavda":"Cenaze ödeneğine ilişkin ifadelerden hangisinin yanlış olduğu sorulur, madde metnindeki kurallarla karşılaştırma istenir.","panel_ornek":"Arkadaşının dedesi vefat ettiğinde ailesine devletten tek seferlik 5 bin lira gibi bir yardım yapıldığını düşün. Bu para eşe, o yoksa çocuklara, o da yoksa anne-babaya, o da yoksa kardeşlere sırayla verilir. Yani kim alacak diye bir öncelik sırası var, herkese birden bölünmüyor.","ornek":"Arkadaşının dedesi vefat ettiğinde ailesine devletten tek seferlik 5 bin lira gibi bir yardım yapıldığını düşün. Bu para eşe, o yoksa çocuklara, o da yoksa anne-babaya, o da yoksa kardeşlere sırayla verilir. Yani kim alacak diye bir öncelik sırası var, herkese birden bölünmüyor.","yontemler":"Şıkları madde metnindeki sıralama, şart ve istisna cümleleriyle tek tek eşleştirerek çelişen ifadeyi bulun.","nedir":"Cenaze ödeneği, ölen sigortalının yakınlarına Kurum tarafından bir defaya mahsus ödenen destek tutarıdır. Sınav, bu ödeneğin kimlere, hangi şartlarda ve hangi sırayla verildiğini bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"D":{"ad":"Mükerrerlik Tuzağı","metin":"Öğrenci Kurumun her durumda cenaze ödeneği ödediğini düşünüp bu şıkkı yanlış sanabilir. Doğrusu: 4/c kapsamındakilerin kurumu ölüm yardımı hariç cenaze gideri ödemişse Kurum ayrıca ödeme yapmaz, ifade doğrudur."},"E":{"ad":"Yetki Tuzağı","metin":"Öğrenci tutarın doğrudan kanunda sabit sayı olarak yazıldığını düşünüp bu şıkkı yanlış sanabilir. Doğrusu: Tutar Kurum Yönetim Kurulunca belirlenip Bakan tarafından onaylanan tarifeye göre belirlenir, ifade doğrudur."},"A":{"ad":"Sıra Tuzağı","metin":"Öğrenci bu sırayı yanlış zannedip yanlış şık olarak seçebilir. Doğrusu: Madde metninde ödeme sırası eş-çocuk-ana/baba-kardeş şeklinde aynen böyle sayılmıştır, ifade doğrudur."},"B":{"ad":"Üçüncü Kişi Tuzağı","metin":"Öğrenci cenaze ödeneğinin yalnız hak sahiplerine ödendiğini düşünüp bu şıkkı yanlış sanabilir. Doğrusu: Kanun, hak sahiplerine ödenememesi halinde masrafı yapan gerçek veya tüzel kişiye belgeye dayalı ödeme yapılmasını öngörür, ifade doğrudur."}},"celdiriciYol":{},"hap":"Cenaze ödeneğinde 360 günlük prim şartı yalnız genel ölüm hâlinde aranır; iş kazası/meslek hastalığı sonucu gelir veya malûllük-vazife malûllüğü-yaşlılık aylığı almakta iken ölenler bu şarttan istisnadır.","teshis":{"C":{"gercek":"İş kazası/meslek hastalığı sonucu gelir veya malûllük, vazife malûllüğü, yaşlılık aylığı almakta iken ölenler için 360 gün şartı aranmaz; bu şart yalnız genel ölüm hâlinde geçerlidir.","ayirt":"Metinde \u0027veya\u0027 ile sayılan istisna gruplarını \u0027her koşulda\u0027 ifadesiyle karıştırdım mı?","paragraf":"5510 s.K. m.37/3","yanilgi":"360 günlük prim şartının istisnasız her ölüm hâlinde arandığını sanıyorsun."},"E":{"gercek":"Tutar, Kurum Yönetim Kurulunca belirlenip Bakan tarafından onaylanan tarife üzerinden tespit edilir.","ayirt":"Kanun tutarı mı, yetkiyi mi düzenliyor?","paragraf":"5510 s.K. m.37/3","yanilgi":"Cenaze ödeneği tutarının kanunda doğrudan rakamla belirtildiğini sanıyorsun."},"A":{"gercek":"Madde 37 sırayı eş, çocuk, ana-baba, kardeş şeklinde belirler.","ayirt":"Metindeki \u0027sırasıyla\u0027 ibaresini gördüm mü?","paragraf":"5510 s.K. m.37/3","yanilgi":"Ödeme sırasının kanunda farklı yazıldığını, gerçekte önce çocuklara ödendiğini sanıyorsun."},"D":{"gercek":"4/c kapsamındakilere kendi kurumu ölüm yardımı hariç cenaze gideri ödemişse Kurum cenaze ödeneği ödemez.","ayirt":"Aynı gider için iki kurumdan ödeme yapılır mı diye kendime sordum mu?","paragraf":"5510 s.K. m.37/5","yanilgi":"Kurumun, başka bir kurum ödeme yapmış olsa da mükerrer cenaze ödeneği verebileceğini sanıyorsun."},"B":{"gercek":"Hak sahiplerine ödenememesi ve cenazenin üçüncü kişilerce kaldırılması hâlinde belgeye dayalı masraf bu kişiye ödenir.","ayirt":"Hak sahibi yoksa ödeme tamamen mi kaybolur, yoksa başka birine mi gider?","paragraf":"5510 s.K. m.37/4","yanilgi":"Cenaze ödeneğinin sadece kanuni hak sahiplerine ödenebileceğini, üçüncü kişiye hiç ödeme yapılamayacağını sanıyorsun."}},"verilen":[[1,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 108"},"kural":"5510 sayılı Kanun m.37 uyarınca evlenme ödeneği verilmesi halinde diğer hak sahiplerinin aylık veya gelirleri, ödenek verilen sürenin bitimini takip eden ödeme döneminden itibaren yeniden belirlenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 108","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklarda geçen \u0027ödendiği tarihten itibaren\u0027 ile \u0027sürenin bitimini takip eden dönemden itibaren\u0027 ifadelerini mutlaka ayır, kanun ikincisini kullanır.","konu":"uzun vadeli sigorta kolları","tablo":{"satirlar":[["VERİLENLER","-","-"],["Evlenme ödeneği tutarı","iki yıllık aylık tutarı","-"],["HESAP","-","-"],["A) Diğer hak sahiplerinin aylık veya gelirleri, evlenme öde…","5510 s.K. m.37","doğru ifade"],["B) Diğer hak sahiplerinin aylık veya gelirleri, evlenme öde…","5510 s.K. m.37","YANLIŞ ifade"],["C) Kız çocuğunun iki yıl içinde yeniden hak sahibi olması h…","5510 s.K. m.37","YANLIŞ ifade"],["D) Kız çocuğunun iki yıl içinde yeniden hak sahibi olması h…","5510 s.K. m.37","YANLIŞ ifade"],["E) Evlenme ödeneği, kız çocuğunun ayrıca talepte bulunmasın…","5510 s.K. m.37","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kız çocuğunun iki yıl içinde yeniden hak sahibi olması halinde, iki yıllık sürenin sonuna kadar kendisine aylık bağlanmaya devam olunur.","E":"Evlenme ödeneği, kız çocuğunun ayrıca talepte bulunmasına gerek olmaksızın Kurum tarafından resen ödenir.","A":"Diğer hak sahiplerinin aylık veya gelirleri, evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren yeniden belirlenir.","D":"Kız çocuğunun iki yıl içinde yeniden hak sahibi olması halinde, bu süre boyunca genel sağlık sigortalısı sayılmaz.","B":"Diğer hak sahiplerinin aylık veya gelirleri, evlenme ödeneğinin ödendiği tarihten itibaren hemen yeniden belirlenir."},"kaynak":{"alinti":"Evlenme ödeneği verilmesi halinde, diğer hak sahiplerinin aylık veya gelirleri evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren 34 üncü maddeye göre yeniden belirlenir","liste":[{"ad":"5510 s. SGK Kanunu m.37 [1/2]","metin":"MADDE 37- (Değişik: 17/4/2008-5754/23 md.) Evlenmeleri nedeniyle, gelir veya aylıklarının kesilmesi gereken kız çocuklarına evlenmeleri ve talepte bulunmaları halinde almakta oldukları aylık veya gelirlerinin iki yıllık 17/4/2017 tarihli ve 690 sayılı KHK’nin 36 ncı maddesiyle, bu fıkrada yer alan “üçüncü fıkrasının (d) ve (e)” ibaresi “dördüncü fıkrasının (d), (e) ve (f)” şeklinde değiştirilmiş, daha sonra bu hüküm 1/2/2018 tarihli ve 7077 sayılı Kanunun 32 nci maddesiyle aynen kabul edilerek kanunlaşmıştır. 54 tutarı bir defaya mahsus olmak üzere evlenme ödeneği olarak peşin ödenir. Evlenme ödeneği alan hak sahibinin aylığının kesildiği tarihten itibaren iki yıl içerisinde yeniden hak sahibi olması halinde, iki yıllık sürenin sonuna kadar gelir veya aylık bağlanmaz, bu durumda olanlar 60 ıncı maddenin birinci fıkrasının (f) bendi kapsamında genel sağlık sigortalısı sayılır. Evlenme ödeneği verilmesi halinde, diğer hak sahiplerinin aylık veya gelirleri evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren 34 üncü maddeye göre yeniden belirlenir. İş kazası veya meslek hastalığı sonucu veya sürekli iş göremezlik geliri, malûllük, vazife malûllüğü veya yaşlılık aylığı almakta iken veya kendisi için en az 360 gün malûllük, yaşlılık ve ölüm sigortası primi bildirilmiş olup da ölen sigortalının hak sahiplerine Kurum Yönetim Kurulunca belirlenip Bakan tarafından onaylanan tarife üzerinden cenaze ödeneği ödenir. Cenaze ödeneği, sırasıyla sigortalının eşine, yoksa çocuklarına, o da yoksa ana babasına, o da yoksa kardeşlerine verilir."},{"ad":"5510 s. SGK Kanunu m.37 [2/2]","metin":"Cenaze ödeneğinin üçüncü fıkrada sayılanlara ödenememesi ve sigortalının cenazesinin gerçek veya tüzel kişiler tarafından kaldırılması durumunda, üçüncü fıkrada belirtilen tutarı geçmemek üzere belgelere dayanan masraflar, masrafı yapan gerçek veya tüzel kişilere ödenir. 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında sigortalı sayılanlardan ölenlerin hak sahiplerine kendi kurumları tarafından ilgili mevzuat gereği ölüm yardımı hariç cenaze gideri, cenaze nakil gideri ödeneği veya bu mahiyette bir ödemenin yapılması halinde, Kurum tarafından cenaze ödeneği ödenmez. Uzun vadeli sigorta kolları bakımından sigortalılık süresi"}],"hakem":"Doğru sık, 5510 sayılı Kanun m.37\u0027de açıkça yer alan \"Evlenme ödeneği verilmesi halinde, diğer hak sahiplerinin aylık veya gelirleri evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren 34 üncü maddeye göre yeniden belirlenir\" hükmü tarafından tam olarak desteklenmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Evlenme ödeneği alan kız, iki yıl boyunca hem ödeneği hem de aylığını almaya devam edecek diye düşünür. Hâlbuki kanun: iki yıllık sürenin sonuna kadar ona aylık bağlanmaz, yalnızca sağlık sigortası koruması devam eder.","E":"Ödeneğin otomatik olarak, talep olmaksızın ödeneceğini düşünür. Doğrusu: kız çocuğu talepte bulunmak zorundadır; aksi takdirde Kurum ödeme yapmaz.","D":"Sağlık sigortasının evlenme ödeneği döneminde kesildiğini zannetir. Gerçek: bu kişiler genel sağlık sigortalısı sayılmaya devam eder, koruma kesintisiz.","B":"Diğer hak sahiplerinin aylıkları ödeneğin ödendiği tarihte değişeceğini varsayar. Oysa kuralda açık: yeniden belirleme, iki yıllık sürenin sonunda gerçekleşir, peşin ödeme anından değil."},"dogru":"Evlenme ödeneği verildiğinde, ailede başka hak sahipleri varsa (ör. diğer çocuklar) onların aylıkları hemen değişmez. Değişim, evlenme ödeneğinin verildiği iki yıllık süre bittiğinde gerçekleşir. O zaman diğer hak sahiplerinin payları yeniden hesaplanır.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 37. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 37. madde","tanim":"Sigortalının evlenen kız çocuğuna, o çocuğun kesilecek aylığının iki yıllık tutarı, çocuğun talebi halinde peşin olarak ödenen sosyal sigorta yardımı.","ad":"Evlenme ödeneği"},{"kaynak":"5510 s. SGK Kanunu 37. madde","tanim":"Sigortalı veya emekli kişinin ölümü veya diğer sigorta olayları nedeniyle kanunla belirlenen koşullar altında sosyal sigorta haklarından yararlanma hakkı olan kişi (eş, çocuk, ana baba vb.).","ad":"Hak sahibi"},{"kaynak":"5510 s. SGK Kanunu 37. madde","tanim":"Aylık veya gelirin hesaplanıp ödendiği zaman aralığı; evlenme ödeneği verildikten sonra diğer hak sahiplerinin aylıkları yeniden belirlenirken bu dönem başlangıç noktası olur.","ad":"Ödeme dönemi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[{"yil":"2025/3","alinti":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu’na göre yukarıdakilerden hangileri uzun vadeli sigorta kolları içerisinde yer alır?"},{"yil":"2024/1","alinti":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu’na göre, uzun vadeli sigorta kollarının tamamı hangi seçenekte doğru gösterilmiştir?"}],"donemler":["2025/3","2024/1"]},"oyun":null,"tip":"teori","soru":"Sigortalının kız çocuğuna, evlenmesi nedeniyle kesilen aylığının iki yıllık tutarı, kendisinin talebi üzerine evlenme ödeneği olarak peşin ödenmiştir. Bu duruma ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-10","verilenler":[{"deger":"iki yıllık aylık tutarı","anlam":"Kız çocuğuna peşin ödenecek evlenme ödeneğinin hesap esası, kesilen aylığın iki yıllık tutarıdır.","ad":"Evlenme ödeneği tutarı"}],"dayanak":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu m.37","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Ayşe Hanım, SGK\u0027dan babasının vefatı nedeniyle aylık alan kız kardeşi Zeynep\u0027in 2023 yılında evlenmesi üzerine, Zeynep\u0027in aylığından pay artışı beklemektedir. Zeynep evlenirken talepte bulunmuş ve 2 yıllık aylığının toplamı olan 96.000 TL\u0027yi tek seferde evlenme ödeneği olarak almıştır.","anlatim":"Zeynep artık aylık almıyor, yerine peşin para aldı. Ayşe Hanım\u0027ın payı bu yüzden değişecek ama ne zaman değişeceği kritik.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanun m.37, Zeynep\u0027in 2 yıllık aylığını peşin öder, bu süre boyunca hak sahibi olmasa da sağlık güvencesi devam eder, diğerlerinin payı ise 2 yılın SONUNDA yeniden hesaplanır. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Zeynep\u0027in durumu ile diğer hak sahiplerinin durumunu birbirine karıştırmamak lazım. Beşini sırayla test edeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"5510 s.K. m.37","karar":"doğru","anlatim":"Evet, Zeynep\u0027in parası bitene kadar Ayşe bekler. Süre dolunca ilk ödeme döneminde pay büyür. Kanun tam olarak bunu söylüyor.","formul":"Şık A: Ayşe Hanım\u0027ın payı, Zeynep\u0027in 2 yıllık ödenek süresi bittikten sonraki ilk ödeme döneminden itibaren mi artacak, sen ne dersin?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"5510 s.K. m.37","karar":"yanlış","anlatim":"Hayır, ödeme günü ile payın yeniden hesaplanacağı gün aynı şey değil. Kanun ödeneğin bittiği süreyi esas alır, ödeme anını değil.","formul":"Şık B: Zeynep parayı aldığı gün Ayşe Hanım\u0027ın payının hemen artması gerekir mi, sence?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"5510 s.K. m.37","karar":"yanlış","anlatim":"Hayır, parayı zaten peşin aldı. 2 yıl dolana kadar tekrar aylık bağlanmaz, kanun bunu açıkça yasaklıyor.","formul":"Şık C: Zeynep 2 yıl dolmadan boşanıp yeniden hak sahibi olsa, bu 2 yıl boyunca ona ayrıca aylık bağlanır mı?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"5510 s.K. m.37","karar":"yanlış","anlatim":"Hayır, tam tersi olur. Kanun onu m.60/1-f bendi kapsamında genel sağlık sigortalısı sayar, güvence devam eder.","formul":"Şık D: Zeynep bu 2 yıl içinde yeniden hak sahibi olsa, sağlık sigortası kapsamı dışında mı kalır?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"5510 s.K. m.37","karar":"yanlış","anlatim":"Hayır, kanun \u0027talepte bulunmaları halinde\u0027 diyor, yani Zeynep\u0027in başvurusu şart. SGK res\u0027en ödeme yapmaz.","formul":"Şık E: Zeynep hiç başvurmasa, SGK evlenme ödeneğini kendiliğinden yatırır mı?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Tek doğru A: diğer hak sahiplerinin payı, ödenek süresinin bitimini takip eden ödeme döneminden itibaren yeniden belirlenir. Kendine sor: burada esas alınan şey ödemenin yapıldığı an mı, yoksa sürenin sona erdiği an mı?","doldur":[]}],"anahtar":[{"ornek":"ödenek","kok":"ödenek"},{"ornek":"zeynep","kok":"zeynep"},{"ornek":"döneminden","kok":"dönemi"},{"ornek":"yeniden","kok":"yenide"},{"ornek":"sahiplerinin","kok":"sahipl"},{"ornek":"belirlenir","kok":"belirl"}],"konuGiris":{"harita":"Ne zaman test edilir: kız çocuğunun evlenmesi nedeniyle aylığının kesilmesi ve talepte bulunması durumunda. Nasıl ölçülür: kesilen aylığın iki yıllık tutarının bir defaya mahsus peşin ödenmesiyle. Nasıl kaydedilir: hak sahibi iki yıl içinde tekrar hak sahibi olursa bu süre sonuna kadar yeniden aylık bağlanmaz.","desen":"Sınav genelde \u0027evlenme ödeneği bir defaya mahsustur, aylık bağlanmaya devam edilmez\u0027 bilgisini bozarak yanlış şık üretir. Tuzak, iki yıl içinde tekrar hak sahibi olma halinde yeniden aylık bağlanacağı yanılgısıdır; oysa kanun bu süre sonuna kadar bağlanmayacağını söyler. Bu soru m.37/1. fıkra noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Evlenen kız çocuğuna kesilen aylığın iki yıllık tutarının peşin ödenmesi","ad":"Evlenme ödeneği","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Evlenme ödeneği hesaplanırken esas alınan aylık miktarının süre çarpımı","ad":"İki yıllık tutar","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İki yıl içinde tekrar hak kazanılırsa yeni aylığın başlamayacağı durum","ad":"Yeniden hak sahipliği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Evlenme ödeneği alıp iki yıl içinde tekrar hak sahibi olanın sayıldığı sigorta türü","ad":"Genel sağlık sigortalılığı","kim":"kanun sabitler"}],"sinavda":"Soru, evlenme ödeneğinin peşin ödenme koşulunu ve süresini bilip bilmediğini sorar.","panel_ornek":"Bir arkadaşın, her ay aldığı 300 liralık burs desteğini evlenince kesiliyor ve üniversite ona bunun yerine tek seferde 2 yıllık toplamı olan 7.200 lirayı peşin veriyor. Yani düzenli ödeme durunca, biriken hak tek kalemde ödeniyor.","ornek":"Bir arkadaşın, her ay aldığı 300 liralık burs desteğini evlenince kesiliyor ve üniversite ona bunun yerine tek seferde 2 yıllık toplamı olan 7.200 lirayı peşin veriyor. Yani düzenli ödeme durunca, biriken hak tek kalemde ödeniyor.","yontemler":"En kritik kural: evlenme ödeneği bir defaya mahsustur ve iki yıllık aylık tutarını kapsar; bu süre içinde tekrar hak sahibi olunsa da yeni aylık bağlanmaz.","nedir":"Uzun vadeli sigorta kolları; malullük, yaşlılık, ölüm gibi durumlarda hak sahiplerine bağlanan gelir/aylık kurallarını düzenler. Sınav, evlenme ödeneği gibi özel hallerde hangi tutarın ve hangi süreyle ödendiğini bilip bilmediğini ölçer."},"olay":"yok.","tuzak":{"C":{"ad":"Ters Sonuç Tuzağı","metin":"öğrenci evlenme ödeneği alan kişinin iki yıl boyunca da aylık almaya devam edeceğini sanır. Doğrusu: iki yıllık süre içinde yeniden hak sahibi olunsa dahi bu sürenin sonuna kadar gelir veya aylık bağlanmaz."},"E":{"ad":"Belge/Şart Tuzağı","metin":"öğrenci ödeneğin otomatik olarak, herhangi bir başvuru olmadan verildiğini sanır. Doğrusu: evlenme ödeneği ancak hak sahibinin talepte bulunması halinde ödenir."},"D":{"ad":"Kapsam Tuzağı","metin":"öğrenci genel sağlık sigortası korumasının evlenme ödeneği süresince kesintiye uğradığını düşünür. Doğrusu: bu durumda olanlar 60 ıncı maddenin birinci fıkrasının (f) bendi kapsamında genel sağlık sigortalısı sayılır."},"B":{"ad":"Zamanlama Tuzağı","metin":"öğrenci evlenme ödeneğinin ödendiği anı esas alıp diğer hak sahiplerinin payının hemen değişeceğini düşünür. Doğrusu: yeniden belirleme, ödenek süresinin bitimini takip eden ödeme döneminden itibaren gerçekleşir, ödeme anından değil."}},"celdiriciYol":{},"hap":"Evlenme ödeneği verilince diğer hak sahiplerinin payı, ödenek süresinin BİTİMİNİ TAKİP EDEN ödeme döneminden itibaren yeniden belirlenir; ödenek alan kişi iki yıl boyunca genel sağlık sigortalısı sayılır ama aylık bağlanmaz.","teshis":{"C":{"gercek":"Kanun, iki yıllık sürenin sonuna kadar gelir veya aylık bağlanmayacağını açıkça belirtir; ödenek aylığın yerine geçer.","ayirt":"Evlenme ödeneği bir defalık peşin ödeme mi, yoksa aylığın devamı mı?","paragraf":"5510 s.K. m.37","yanilgi":"Evlenme ödeneği alan kişinin aynı zamanda aylık almaya devam edeceğini düşünüyorsun."},"E":{"gercek":"Kanun evlenme ödeneğinin ancak hak sahibinin \u0027talepte bulunması halinde\u0027 ödeneceğini şart koşar.","ayirt":"Ödenek için ayrıca bir talep şartı var mı, yok mu?","paragraf":"5510 s.K. m.37","yanilgi":"Ödeneğin idarece kendiliğinden, başvuru aranmaksızın verildiğini sanıyorsun."},"A":{"gercek":"5510 sayılı Kanun m.37, diğer hak sahiplerinin payının ödenek süresinin BİTİMİNİ TAKİP EDEN ödeme döneminden itibaren yeniden belirleneceğini emreder.","ayirt":"Yeniden belirleme, ödemenin yapıldığı gün mü yoksa sürenin sonu mu esas alınıyor?","paragraf":"5510 s.K. m.37","yanilgi":"Bu şıkkı doğru bulmakla birlikte zamanlamasını \u0027ödeme anı\u0027 ile karıştırma riskin var."},"D":{"gercek":"Kanun bu kişileri 60 ıncı maddenin birinci fıkrasının (f) bendi kapsamında genel sağlık sigortalısı sayar, güvence devam eder.","ayirt":"Aylık kesilmesi ile genel sağlık sigortası kapsamı aynı şey midir?","paragraf":"5510 s.K. m.37","yanilgi":"Aylığı kesilen kişinin sağlık güvencesinin de tamamen kalktığını sanıyorsun."},"B":{"gercek":"Kanun açıkça \u0027evlenme ödeneği verilen sürenin bitimini takip eden ödeme döneminden itibaren\u0027 der; ödeme tarihi değil sürenin bitişi esastır.","ayirt":"Metinde \u0027ödendiği tarih\u0027 mi yoksa \u0027sürenin bitimi\u0027 mi geçiyor?","paragraf":"5510 s.K. m.37","yanilgi":"Ödeneğin ödendiği tarihi, hakların yeniden hesaplandığı tarih sanıyorsun."}},"verilen":[[1,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 110"},"kural":"4857 sayılı İş Kanunu m.41 uyarınca her bir saat fazla çalışma için normal ücretin saat başına düşen tutarı %50 zamlı ödenir; sabit yardımlar bu hesaba girmez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 110","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Ters sorularda önce doğru formülü kur, sonra verilen sonuçtan geriye giderek bilinmeyeni izole et; ek yardım gibi çeldirici kalemleri formüle hiç sokma.","konu":"fazla çalışma hükümleri","tablo":{"satirlar":[["VERİLENLER","-"],["Normal saat ücreti","120 TL"],["Yakacak yardımı","900 TL"],["Toplam fazla çalışma ücreti","5.400 TL"],["HESAP","-"],["Zamlı saat ücreti (120x1,5)","180"],["Fazla çalışma süresi (5.400/180)","30 saat"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"30","E":"45","A":"18","D":"36","B":"24"},"kaynak":{"alinti":"de açıkça desteklenmektedir; sabit yardımların hesaba girmemesi de kaynakta belirtilen","liste":[{"ad":"İş K. (4857 s.K.) m.41 [1/2]","metin":"Madde 41 - Ülkenin genel yararları yahut işin niteliği veya üretimin artırılması gibi nedenlerle fazla çalışma yapılabilir. Fazla çalışma, Kanunda yazılı koşullar çerçevesinde, haftalık kırkbeş saati aşan çalışmalardır. 63 üncü madde hükmüne göre denkleştirme esasının uygulandığı hallerde, işçinin haftalık ortalama çalışma süresi, normal haftalık iş süresini aşmamak koşulu ile, bazı haftalarda toplam kırkbeş saati aşsa dahi bu çalışmalar fazla çalışma sayılmaz. Her bir saat fazla çalışma için verilecek ücret normal çalışma ücretinin saat başına düşen miktarının yüzde elli yükseltilmesi suretiyle ödenir. Haftalık çalışma süresinin sözleşmelerle kırkbeş saatin altında belirlendiği durumlarda yukarıda belirtilen esaslar dahilinde uygulanan ortalama haftalık çalışma süresini aşan ve kırkbeş saate kadar yapılan çalışmalar fazla sürelerle çalışmalardır. Fazla sürelerle çalışmalarda, her bir saat fazla çalışma için verilecek ücret normal çalışma ücretinin saat başına düşen miktarının yüzde yirmibeş yükseltilmesiyle ödenir. Fazla çalışma veya fazla sürelerle çalışma yapan işçi isterse, bu çalışmalar karşılığı zamlı ücret yerine, fazla çalıştığı her saat karşılığında bir saat otuz dakikayı, fazla sürelerle çalıştığı her saat karşılığında bir saat onbeş dakikayı serbest zaman olarak kullanabilir. İşçi hak ettiği serbest zamanı altı ay zarfında, çalışma süreleri içinde ve ücretinde bir kesinti olmadan kullanır. 63 üncü maddenin son fıkrasında yazılı sağlık nedenlerine dayanan kısa veya sınırlı süreli işlerde ve 69 uncu maddede belirtilen gece çalışmasında fazla çalışma yapılamaz. Fazl…"},{"ad":"İş K. (4857 s.K.) m.41 [2/2]","metin":"(Ek fıkra: 10/9/2014-6552/4 md.) Bu Kanunun 42 nci ve 43 üncü maddelerinde sayılan hâller dışında yer altında maden işlerinde çalışan işçilere fazla çalışma yaptırılamaz. (Ek fıkra: 10/9/2014-6552/4 md.) Yer altında maden işlerinde çalışan işçilere, bu Kanunun 42 nci ve 43 üncü maddelerinde sayılan hâllerde haftalık otuz yedi buçuk saati aşan her bir saat fazla çalışma için verilecek ücret, normal çalışma ücretinin saat başına düşen miktarının yüzde yüzden az olmamak üzere arttırılması suretiyle ödenir.15 4/4/2015 tarihli ve 6645 sayılı Kanunun 34 üncü maddesiyle, bu fıkrada yer alan “haftalık otuz altı saati aşan” ibaresi “haftalık otuz yedi buçuk saati aşan” şeklinde değiştirilmiştir. 15 Fazla çalışma ve fazla sürelerle çalışmaların ne şekilde uygulanacağı çıkarılacak yönetmelikte gösterilir. Zorunlu nedenlerle fazla çalışma"}],"hakem":"Soru fazla çalışma ücretinin %50 zamla hesaplanması kuralına dayanmakta ve bu kural İş K. m.41\u0027de açıkça desteklenmektedir; sabit yardımların hesaba girmemesi de kaynakta belirtilen \u0027normal çalışma ücretinin saat başına düşen miktarı\u0027 tanımıyla tutarlıdır."},"kayitlar":[],"sade":{"siklar":{"D":"%25 zam uygulandığında bu sonuç çıkar; kanun %50 zam gerekli kılıyor.","E":"Zam uygulaması atlanıp doğrudan bölme yapıldığında bu rakam ortaya çıkıyor; %50 zamlı ücret kullanmak zorunludur.","A":"Yakacak yardımını saatlik ücrete dahil edip %100 zam uyguladığında çıkıyor; oysa yardım saate bağlı değildir ve zam oranı %50\u0027dir.","B":"Yakacak yardımını günlük tarife edip normal ücrete kattığında hesap bozuluyor; sabit yardımlar fazla çalışma ücretine esas değildir."},"dogru":"Normal saatlik ücreti 120 TL olan işçinin fazla çalışması için kanun %50 zam öngörüyor. Zamlı saat ücreti 120 × 1,5 = 180 TL olur. Tahakkuk eden 5.400 TL\u0027yi bu zamlı ücrete bölünce 30 saat çıkıyor. Yakacak yardımı saatlik ücrete eklenmez.","sinav":"İş Kanunu 41. madde uyarınca fazla çalışma ücretinde normal çalışma ücretinin saat başına düşen miktarının yüzde elli yükseltilmesi gerekir.","kavramlar":[{"kaynak":"İş Kanunu 41. madde","tanim":"Haftalık kırkbeş saati aşan çalışmalar olup, kanunda yazılı koşullar çerçevesinde yapılabilir.","ad":"Fazla çalışma"},{"kaynak":"İş Kanunu 41. madde","tanim":"Her bir saat fazla çalışma için verilecek ücret, normal ücretin saatlik tutarı üzerine %50 zam yapılmak suretiyle hesaplanır.","ad":"Normal çalışma ücretinin saat başına düşen miktarının yüzde elli yükseltilmesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":{"bosluk":[[1,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Zamlı saat ücreti (150x1,5)","225"],["Fazla çalışma süresi (6.750/225)","30 saat"]]},"tur":"tablo","soru":"İşçinin saat başına normal ücreti 150 TL, aylık sabit 700 TL yol yardımı vardır. İşveren zamlı ücret ödemeyi tercih etmiş, bu ay için 6.750 TL fazla çalışma ücreti tahakkuk ettirmiştir. İşçinin bu ay yaptığı fazla çalışma süresi kaç saattir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve fazla çalışma süresinin kaç saat olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"İşçinin saat başına normal ücreti 120 TL, aylık sabit 900 TL yakacak yardımı vardır. İşveren zamlı ücret ödemeyi tercih etmiş, bu ay için 5.400 TL fazla çalışma ücreti tahakkuk ettirmiştir. İşçinin bu ay yaptığı fazla çalışma süresi kaç saattir?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-29","verilenler":[{"deger":"120 TL","anlam":"Fazla çalışma zammının uygulanacağı taban saat ücretidir.","ad":"Normal saat ücreti"},{"deger":"900 TL","anlam":"Aylık sabit bir yardımdır, çalışılan saate bağlı olmadığı için fazla çalışma hesabına dahil edilmez, çeldiricidir.","ad":"Yakacak yardımı"},{"deger":"5.400 TL","anlam":"Sonuç olarak verilen tutardır; buradan geriye giderek fazla çalışma süresi bulunur.","ad":"Toplam fazla çalışma ücreti"}],"dayanak":"4857 sayılı İş Kanunu m.41/1","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Verilen: Normal saat ücreti 120 TL (soruda verilen); Sabit yakacak yardımı 900 TL (soruda verilen); Fazla çalışma ücreti tahakkuku 5.400 TL (soruda verilen); Zam oranı %50 (İş Kanunu m.41)","anlatim":"Soru bize şunları vermiş: saat başına normal ücret 120 TL (soruda verilen), aylık sabit yakacak yardımı 900 TL (soruda verilen), bu ay tahakkuk eden fazla çalışma ücreti 5.400 TL (soruda verilen).","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1]]},{"formul":"Kapsam: Fazla çalışma ücreti = zamlı saat ücreti × çalışılan saat; Dahil değil: sabit yakacak yardımı 900 TL (soruda verilen)","anlatim":"Fazla çalışma ücreti nedir? İşçinin normal mesai dışında çalıştığı saatler için ödenen ek ücrettir. İş Kanunu m.41\u0027e göre her saat için normal ücretin %50 fazlası ödenir.","doldur":[]},{"formul":"Zamlı saat ücreti = Normal saat ücreti × %150 = 120 (soruda verilen) × %150 = 180 TL","anlatim":"Önce zamlı saat ücretini buluyoruz, çünkü fazla çalışma bu tutar üzerinden ödenir. Normal ücretin %50 fazlası eklenir.","doldur":[[5,1]]},{"formul":"Fazla çalışma süresi = Toplam fazla çalışma ücreti / Zamlı saat ücreti = 5.400 (soruda verilen) / 180 (3. adımda bulduk) = 30 saat","anlatim":"Şimdi toplam fazla çalışma ücretini zamlı saat ücretine bölüyoruz, çünkü kaç saat çalışıldığını böyle buluruz. Sabit yardım bu bölüme hiç girmez.","doldur":[[6,1]]},{"formul":"Sonuç: Fazla çalışma süresi = 30 saat (4. adımda bulduk)","anlatim":"İşçi bu ay 30 saat fazla çalışma yapmış. Sonucu 5.400 TL\u0027lik tahakkukun 180 TL\u0027ye bölünmesiyle bulduk.","doldur":[]},{"formul":"Ters durum: süre verilmiş olsaydı → Fazla çalışma ücreti = Zamlı saat ücreti × saat sayısı","anlatim":"Ters durumda soru süreyi verip ücreti sorsaydı çarpma yapardık. Zamlı saat ücretiyle saat sayısını çarparsın.","doldur":[]},{"formul":"Yanlış yol: (5.400 + 900) / 180 = 35 saat (HATALI) → doğrusu 30 saat (4. adımda bulduk)","anlatim":"En sık hata, 900 TL\u0027lik sabit yakacak yardımını hesaba katıp 5.400 TL\u0027yi buna göre bölmek. Sabit yardım fazla çalışmayla ilgisiz, sadece normal saat ücreti zamlanır.","doldur":[]}],"anahtar":[{"ornek":"ücreti","kok":"ücreti"},{"ornek":"çalışma","kok":"çalışm"},{"ornek":"normal","kok":"normal"},{"ornek":"yardımlar","kok":"yardım"},{"ornek":"ödenir","kok":"ödenir"},{"ornek":"hesaba","kok":"hesaba"}],"konuGiris":{"harita":"Ne zaman test edilir: saat başına ücret ve toplam fazla çalışma tutarı verildiğinde çalışılan saat sorulduğunda. Nasıl ölçülür: zamlı saatlik ücret bulunup toplam tutar buna bölünerek. Nasıl kaydedilir: bulunan saat sayısı doğrudan cevap olarak yazılır.","desen":"Soru genelde saatlik ücret ve toplam tahakkuk tutarını verip fazla çalışma saatini sordurur; tuzak, yakacak yardımı gibi ücrete dahil olmayan sabit ödemelerin hesaba karıştırılmasıdır. Öğrenci yanlışlıkla yardım tutarını da işleme katabilir, oysa hesap yalnız saatlik ücret üzerinden yapılır. Bu soru m.41\u0027deki yüzde elli zamlı ücret kuralı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşçinin saat başına aldığı temel çalışma ücreti","ad":"Normal ücret","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"sen hesaplarsın","tanim":"Normal saatlik ücretin yüzde elli artırılmış hâli","ad":"Zamlı ücret","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Zamlı saatlik ücretin çalışılan fazla saatle çarpımı sonucu ödenen toplam para","ad":"Fazla çalışma tutarı","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Toplam fazla çalışma tutarının zamlı saatlik ücrete bölünmesiyle bulunan saat sayısı","ad":"Fazla çalışma süresi","kim":"kanun sabitler"}],"sinavda":"Saatlik normal ücret ve toplam fazla çalışma ücreti verilir, çalışılan fazla saat sayısı istenir.","panel_ornek":"Bir kurye normalde saatte 40 TL kazanıyor, hafta sonu ekstra teslimat yaptığında saatine yüzde elli zamlı yani 60 TL alıyor. Ay sonunda toplam 240 TL ekstra ödeme aldıysa, 240\u0027ı 60\u0027a bölerek 4 saat ekstra çalıştığını bulabilirsin.","ornek":"Bir kurye normalde saatte 40 TL kazanıyor, hafta sonu ekstra teslimat yaptığında saatine yüzde elli zamlı yani 60 TL alıyor. Ay sonunda toplam 240 TL ekstra ödeme aldıysa, 240\u0027ı 60\u0027a bölerek 4 saat ekstra çalıştığını bulabilirsin.","yontemler":"Önce normal saatlik ücret yüzde elli artırılarak zamlı saatlik ücret bulunur, sonra toplam tutar bu zamlı ücrete bölünür. Yakacak yardımı gibi sabit ek ödemeler bu hesaba katılmaz.","nedir":"Fazla çalışma hükümleri, haftalık 45 saati aşan çalışmaların ücretinin nasıl hesaplanacağını düzenler. Sınav, saatlik ücret üzerinden zamlı ücret hesabını yapabilmeni ölçer."},"olay":"Zamlı saat ücreti 120x1,5=180 TL; fazla çalışma süresi 5.400/180=30 saat.","tuzak":{"D":{"ad":"Oran Karıştırma Tuzağı","metin":"%50 zam yerine %25 zam uyguladın. Doğrusu: kanunda öngörülen zam oranı %50\u0027dir, başka bir oran uygulanamaz."},"E":{"ad":"Katman Atlama Tuzağı","metin":"Zam uygulamayı tamamen unutup tutarı doğrudan normal saat ücretine böldün. Doğrusu: fazla çalışma ücretinde %50 zam uygulaması zorunludur, atlanamaz."},"A":{"ad":"Çifte Katman Tuzağı","metin":"Hem yakacak yardımını saatlik ücrete ekleyip hem zam oranını %100 aldın; sonuçta hem tabanı hem oranı yanlış büyüttün. Doğrusu: yalnız normal saat ücretine kanunun öngördüğü %50 zam uygulanır, sabit yardımlar dahil edilmez."},"B":{"ad":"Ücrete Dahil Etme Tuzağı","metin":"Yakacak yardımını günlük tutara çevirip saatlik ücrete kattın, oysa bu kalem çalışılan saate bağlı değildir. Doğrusu: fazla çalışma ücretine esas saat ücreti yalnız çıplak normal ücrettir."}},"celdiriciYol":{"D":"120×1,25=150; 5.400/150=36 (zam oranını %25 aldı)","E":"5.400/120=45 (zam uygulamayı atladı)","A":"(120+900/30)×2=300; 5.400/300=18 (hem yakacak yardımını ücrete kattı hem zammı %100 aldı)","B":"(120+900/30)×1,5=225; 5.400/225=24 (yakacak yardımını ücrete kattı)"},"hap":"Fazla çalışma ücreti, yalnız normal saat ücretine %50 zam uygulanarak hesaplanır; sabit yardımlar bu hesaba dahil edilmez.","teshis":{"C":{"gercek":"m.41/1 fazla çalışma ücretinin normal ücretin saat başına düşen tutarının %50 fazlasıyla ödeneceğini belirtir; ücrete dahil olmayan yardımlar hesaba katılmaz.","ayirt":"Zam oranını ve hesaba giren tutarı doğru ayırdım mı?","paragraf":"m.41/1","yanilgi":"Zam oranını veya yakacak yardımının hesaba girmeyeceğini gözden kaçırıp başka şıkkı seçtin."},"E":{"gercek":"Fazla çalışma ücretinde %50 zam uygulaması zorunludur, atlanamaz.","ayirt":"Saatlik ücrete zam uyguladım mı?","paragraf":"m.41/1","yanilgi":"Zam uygulamanın isteğe bağlı olduğunu, atlanabileceğini düşündün."},"A":{"gercek":"m.41/1 yalnız çıplak saat ücretine %50 zam öngörür; sabit yardımlar hesaba girmez.","ayirt":"Bu ödeme çalışılan saate bağlı normal ücretin parçası mı yoksa sabit bir yardım mı?","paragraf":"m.41/1","yanilgi":"Yakacak yardımını da saatlik ücretin parçası sayıp üstüne zammı da abarttın."},"D":{"gercek":"Kanunda öngörülen zam oranı %50\u0027dir, başka bir oran uygulanamaz.","ayirt":"Zam oranı olarak kullandığım yüzde kanunda yazan mı?","paragraf":"m.41/1","yanilgi":"Zam oranını %50 yerine %25 olarak hatırladın."},"B":{"gercek":"Fazla çalışma ücretine esas saat ücreti yalnız normal çıplak ücrettir, ek yardımlar dahil edilmez.","ayirt":"Bu kalem işçinin her çalıştığı saat karşılığı mı ödeniyor?","paragraf":"m.41/1","yanilgi":"Yakacak yardımını günlüğe bölüp saatlik ücrete eklenebileceğini düşündün."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 110"},"kural":"4857 sayılı İş Kanunu\u0027na göre her bir saat fazla çalışma için verilecek ücret, normal çalışma ücretinin saat başına düşen miktarının %50 yükseltilmesi suretiyle ödenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 110","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Fazla çalışma ücreti sorularında önce saat başı zamlı ücreti bul, sonra saat sayısıyla çarp; ara adımı atlama.","konu":"fazla çalışma hükümleri","tablo":{"satirlar":[["VERİLENLER","-"],["Normal saat ücreti","100 TL"],["Fazla çalışma süresi","10 saat"],["HESAP","-"],["Normal saat ücreti","100"],["%50 zamlı fazla çalışma saat ücreti (100 + 100x%50)","150"],["Fazla çalışma ücreti toplamı (150 x 10 saat)","1500"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"1500","E":"2000","A":"500","D":"1600","B":"1000"},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.41 [1/2]","metin":"Madde 41 - Ülkenin genel yararları yahut işin niteliği veya üretimin artırılması gibi nedenlerle fazla çalışma yapılabilir. Fazla çalışma, Kanunda yazılı koşullar çerçevesinde, haftalık kırkbeş saati aşan çalışmalardır. 63 üncü madde hükmüne göre denkleştirme esasının uygulandığı hallerde, işçinin haftalık ortalama çalışma süresi, normal haftalık iş süresini aşmamak koşulu ile, bazı haftalarda toplam kırkbeş saati aşsa dahi bu çalışmalar fazla çalışma sayılmaz. Her bir saat fazla çalışma için verilecek ücret normal çalışma ücretinin saat başına düşen miktarının yüzde elli yükseltilmesi suretiyle ödenir. Haftalık çalışma süresinin sözleşmelerle kırkbeş saatin altında belirlendiği durumlarda yukarıda belirtilen esaslar dahilinde uygulanan ortalama haftalık çalışma süresini aşan ve kırkbeş saate kadar yapılan çalışmalar fazla sürelerle çalışmalardır. Fazla sürelerle çalışmalarda, her bir saat fazla çalışma için verilecek ücret normal çalışma ücretinin saat başına düşen miktarının yüzde yirmibeş yükseltilmesiyle ödenir. Fazla çalışma veya fazla sürelerle çalışma yapan işçi isterse, bu çalışmalar karşılığı zamlı ücret yerine, fazla çalıştığı her saat karşılığında bir saat otuz dakikayı, fazla sürelerle çalıştığı her saat karşılığında bir saat onbeş dakikayı serbest zaman olarak kullanabilir. İşçi hak ettiği serbest zamanı altı ay zarfında, çalışma süreleri içinde ve ücretinde bir kesinti olmadan kullanır. 63 üncü maddenin son fıkrasında yazılı sağlık nedenlerine dayanan kısa veya sınırlı süreli işlerde ve 69 uncu maddede belirtilen gece çalışmasında fazla çalışma yapılamaz. Fazl…"},{"ad":"İş K. (4857 s.K.) m.41 [2/2]","metin":"(Ek fıkra: 10/9/2014-6552/4 md.) Bu Kanunun 42 nci ve 43 üncü maddelerinde sayılan hâller dışında yer altında maden işlerinde çalışan işçilere fazla çalışma yaptırılamaz. (Ek fıkra: 10/9/2014-6552/4 md.) Yer altında maden işlerinde çalışan işçilere, bu Kanunun 42 nci ve 43 üncü maddelerinde sayılan hâllerde haftalık otuz yedi buçuk saati aşan her bir saat fazla çalışma için verilecek ücret, normal çalışma ücretinin saat başına düşen miktarının yüzde yüzden az olmamak üzere arttırılması suretiyle ödenir.15 4/4/2015 tarihli ve 6645 sayılı Kanunun 34 üncü maddesiyle, bu fıkrada yer alan “haftalık otuz altı saati aşan” ibaresi “haftalık otuz yedi buçuk saati aşan” şeklinde değiştirilmiştir. 15 Fazla çalışma ve fazla sürelerle çalışmaların ne şekilde uygulanacağı çıkarılacak yönetmelikte gösterilir. Zorunlu nedenlerle fazla çalışma"}],"hakem":"Soru, 4857 sayılı İş Kanunu m.41\u0027de düzenlenen fazla çalışma ücreti kuralını ölçmektedir; kaynak metinde kural açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Kanunda %50 zam yazılı olduğu halde %60 zam uyguladın. Her zam oranı yasallaştırılmış; onu değiştiremezsin.","E":"Ücreti iki katına çıkardın ama %50 zam bunu yapmaz. %50 artış yalnızca yarısı kadar eklemek demek; 100\u0027e 50 ekleyen 150 elde eder, 200 değil.","A":"Yalnız %50 zammı (50 TL) hesaplayıp 10 saate çarptın. Doğru yol; zammı normal ücrete ekleyerek saat başına 150 TL\u0027yi bulup çarpman gerekir.","B":"Fazla çalışmayı sanki normal ücrette yapılıyor sandın. Kanun fazla çalışmaya %50 zam uygulanacağını açıkça söylüyor."},"dogru":"Fazla çalışma saati başına normal ücretin %50 fazlası ödenir. Saat başı 100 TL\u0027nin %50 fazlası 150 TL\u0027dir. 10 saatin toplam ücreti 150 × 10 = 1500 TL\u0027dir.","sinav":"İş Kanunu 41. maddeye göre her bir saat fazla çalışma için verilecek ücret normal çalışma ücretinin saat başına düşen miktarının yüzde elli yükseltilmesi suretiyle ödenir.","kavramlar":[{"kaynak":"İş Kanunu 41. madde","tanim":"Haftalık 45 saati aşan çalışmalardır. Bu saatlerde işçi normal ücretin yüzde 50 kadarı fazla ödeme alır.","ad":"Fazla çalışma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":{"bosluk":[[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["Normal saat ücreti","80"],["%50 zamlı fazla çalışma saat ücreti (80 + 80x%50)","120"],["Fazla çalışma ücreti toplamı (120 x 6 saat)","720"]]},"tur":"tablo","soru":"Bir işçinin normal çalışma ücretinin saat başına düşen miktarı 80 TL\u0027dir. İşçi bir ay içinde 6 saat fazla çalışma yapmıştır. 4857 sayılı İş Kanunu\u0027na göre işçinin bu ay için hak ettiği fazla çalışma ücreti toplamı kaç TL\u0027dir?","verilen":[[0,1]],"hedef":"Tabloyu doldur ve fazla çalışma ücreti toplamının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir işçinin normal çalışma ücretinin saat başına düşen miktarı 100 TL\u0027dir. İşçi bir ay içinde 10 saat fazla çalışma yapmıştır. 4857 sayılı İş Kanunu\u0027na göre işçinin bu ay için hak ettiği fazla çalışma ücreti toplamı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-29","verilenler":[{"deger":"100 TL","anlam":"İşçinin bir saatlik normal çalışma karşılığı ücretidir, fazla çalışma ücretinin hesaplanacağı taban tutardır.","ad":"Normal saat ücreti"},{"deger":"10 saat","anlam":"İşçinin ay içinde yaptığı toplam fazla çalışma saatidir, zamlı saat ücretiyle çarpılarak toplam ücret bulunur.","ad":"Fazla çalışma süresi"}],"dayanak":"4857 sayılı İş Kanunu m.41 (fazla çalışma ücreti - saat başına düşen ücretin %50 yükseltilmesi)","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Verilen: Normal saat ücreti 100 TL (soruda verilen); Fazla çalışma süresi 10 saat (soruda verilen)","anlatim":"Soru bize normal saat ücretini vermiş. İşçi ayda 10 saat fazla çalışma yapmış, bunu da soru veriyor.","verilenAdim":true,"doldur":[[1,1],[2,1],[4,1]]},{"formul":"Zamlı saat ücreti = Normal saat ücreti + (Normal saat ücreti × %50) = 100 (soruda verilen) + (100 (soruda verilen) × %50) = 150 TL","anlatim":"4857 sayılı İş Kanunu\u0027na göre fazla çalışma saatinin ücreti, normal ücretin %50 zamlısı olur. Bu yüzden önce zamlı saat ücretini buluyoruz.","doldur":[[5,1]]},{"formul":"Fazla çalışma ücreti toplamı = Zamlı saat ücreti × Fazla çalışma süresi = 150 (2. adımda bulduk) × 10 (soruda verilen) = 1.500 TL","anlatim":"Şimdi zamlı saat ücretini çalışılan fazla saatle çarpıp toplam fazla çalışma ücretini buluyoruz. Çünkü işçiye her saat için bu zamlı tutar ödenir.","doldur":[[6,1]]},{"formul":"Sonuç = 1.500 TL (3. adımda bulduk)","anlatim":"Sonuç: işçinin bu ay hak ettiği fazla çalışma ücreti toplamı 1.500 TL\u0027dir. Bu tutar normal ücretin %50 zamlı halinden hesaplanmıştır.","doldur":[]},{"formul":"Ters durum: zam oranı %100 olsaydı → 100 + (100 × %100) = 200 TL, toplam 200 × 10 = 2.000 TL","anlatim":"Ters durumda: eğer kanun zam oranını %100 belirtseydi, saat ücreti 100 + 100 = 200 TL olur, toplam 2.000 TL çıkardı.","doldur":[]},{"formul":"Yanlış yol: 100 × 10 = 1.000 TL (HATALI) → doğrusu 1.500 TL (3. adımda bulduk)","anlatim":"En sık hata: bazı öğrenciler zammı unutup direkt 100 × 10 = 1.000 TL yazar. Bu yanlıştır, çünkü fazla çalışma saatinin %50 zamlı ödenmesi kanun gereğidir.","doldur":[]}],"anahtar":[{"ornek":"ücretinin","kok":"ücreti"},{"ornek":"çalışmanın","kok":"çalışm"},{"ornek":"normal","kok":"normal"},{"ornek":"ödenir","kok":"ödenir"},{"ornek":"saatinin","kok":"saatin"},{"ornek":"sayılı","kok":"sayılı"}],"konuGiris":{"harita":"Ne zaman test edilir: haftalık 45 saati aşan çalışmalarda fazla çalışma hükmü devreye girer. Nasıl ölçülür: normal saatlik ücret yüzde elli artırılarak fazla çalışma ücreti bulunur. Nasıl kaydedilir: fazla çalışma saati ile artırılmış saatlik ücret çarpılarak toplam tutar hesaplanır.","desen":"Sınav, saatlik ücrete direkt yüzde elli eklenip eklenmediğini ve bu tutarın fazla çalışılan saatle çarpılıp çarpılmadığını kontrol eder. Tuzak, öğrencinin sadece zam farkını hesaplayıp toplam ücreti unutmasıdır. Bu soru m.41\u0027deki yüzde elli zam kuralından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"haftalık kırkbeş saati aşan çalışma süresi","ad":"fazla çalışma","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"fazla çalışma saatine uygulanan yüzde elli artırım oranı","ad":"zam oranı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"işçinin bir saatlik çalışmasına karşılık gelen temel ücret","ad":"saatlik normal ücret","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"sen hesaplarsın","tanim":"artırılmış saatlik ücretin fazla çalışılan saatle çarpımı sonucu tutar","ad":"fazla çalışma ücreti","kim":"kanun sabitler"}],"sinavda":"Soru saatlik ücret ve fazla çalışılan saat sayısını verir, toplam fazla çalışma ücretinin bulunmasını ister.","panel_ornek":"Bir kargo şirketi çalışanının normal saatlik ücreti 40 TL\u0027dir; ayda 5 saat fazla mesai yaparsa bu saatler için normalden yüzde elli fazla ödeme alır. Yani her fazla saat için 40 TL değil 60 TL hesaba girer.","ornek":"Bir kargo şirketi çalışanının normal saatlik ücreti 40 TL\u0027dir; ayda 5 saat fazla mesai yaparsa bu saatler için normalden yüzde elli fazla ödeme alır. Yani her fazla saat için 40 TL değil 60 TL hesaba girer.","yontemler":"Saatlik ücret önce yüzde elli artırılır, sonra bu artırılmış tutar fazla çalışılan saat sayısıyla çarpılır.","nedir":"Fazla çalışma, haftalık 45 saati aşan çalışma için işçiye normal ücretin üzerinde zamlı ödeme yapılmasını düzenler. Sınav, bu zamlı ücretin doğru yüzdeyle hesaplanıp hesaplanamadığını ölçer."},"olay":"Saat başı fazla çalışma ücreti = 100 + (100 x %50) = 150 TL; toplam = 150 x 10 = 1.500 TL. Doğrusu, işçinin fazla çalışma ücreti toplamı 1.500 TL\u0027dir.","tuzak":{"D":{"ad":"Oran Karıştırma Tuzağı","metin":"Kanunun öngördüğü %50 zam oranı yerine %60 zam uyguladın. Doğrusu, kanunda öngörülen zam oranı %50\u0027dir, farklı bir yüzde uygulanamaz."},"E":{"ad":"Kat İle Yüzde Karıştırma Tuzağı","metin":"%50 zam yerine ücreti iki katına çıkardın, oranı kat sandın. Doğrusu, %50 zam ücreti iki katına çıkarmaz, yalnızca yarısı kadar artırır."},"A":{"ad":"Zam Tutarını Toplam Sanma Tuzağı","metin":"Yalnız %50 zam kısmını hesaplayıp normal ücreti eklemeyi unuttun. Doğrusu, fazla çalışma ücreti normal ücret üzerine %50 zam eklenerek bulunur."},"B":{"ad":"Zammı Yok Sayma Tuzağı","metin":"Fazla çalışmanın normal ücretle aynı ödendiğini düşünüp %50 zammı hiç hesaba katmadın. Doğrusu, fazla çalışma saatleri normal ücretten daha yüksek ödenir."}},"celdiriciYol":{"D":"(100 + 100 x %60) x 10 = 1600 (zam oranını %50 yerine %60 aldın)","E":"100 x 2 x 10 = 2000 (%50 zammı iki kat sandın)","A":"100 x %50 x 10 = 500 (sadece zam tutarını hesapladın, normal ücreti eklemedin)","B":"100 x 10 = 1000 (zammı hiç hesaba katmadın)"},"hap":"Fazla çalışmanın her bir saati için normal saat ücretinin %50 yükseltilmesiyle bulunan tutar ödenir.","teshis":{"C":{"gercek":"Kanun metni açıkça normal ücretin saat başına düşen miktarının %50 yükseltilmesini öngörür.","ayirt":"Zam oranı olarak metinde geçen sayı %50 mi diye kontrol et.","paragraf":"İş K. m.41 (fazla çalışma ücreti)","yanilgi":"Bu şıkkı eleyen öğrenci, zam oranını yanlış hatırlayıp farklı bir yüzde ya da kat uyguluyor."},"E":{"gercek":"%50 zam, ücreti 1,5 katına çıkarır; iki katına çıkarma %100 zam anlamına gelir.","ayirt":"%50 arttırmak, tutarı 1,5 katına mı yoksa 2 katına mı çıkarır diye hesapla.","paragraf":"İş K. m.41 (fazla çalışma ücreti)","yanilgi":"%50 zammı, ücretin iki katına çıkarılması gibi algılıyorsun."},"A":{"gercek":"Kanun, normal ücretin üzerine %50 zam eklenmesini öngörür; zam farkı tek başına ödeme tutarı değildir.","ayirt":"Fazla çalışma saatinde işçi hem normal ücretini hem de zammını alır mı diye kendine sor.","paragraf":"İş K. m.41 (fazla çalışma ücreti)","yanilgi":"Fazla çalışma ücretinin sadece zam farkından ibaret olduğunu, normal ücretin ayrıca ödenmediğini sanıyorsun."},"D":{"gercek":"Kanun metninde zam oranı açıkça %50 olarak belirtilmiştir, başka bir oran uygulanmaz.","ayirt":"Metinde geçen zam yüzdesi kaç, tekrar oku diye kendine sor.","paragraf":"İş K. m.41 (fazla çalışma ücreti)","yanilgi":"Kanunda geçen zam oranını tam hatırlamayıp farklı bir yüzdeyle işlem yapıyorsun."},"B":{"gercek":"Kanuna göre fazla çalışma saati normal saatten %50 daha yüksek ücretlendirilir.","ayirt":"Fazla çalışma normal mesaiyle aynı ücretle mi ödenir, yoksa zamlı mı ödenir diye sor.","paragraf":"İş K. m.41 (fazla çalışma ücreti)","yanilgi":"Fazla çalışmanın normal mesai gibi aynı ücretle ödendiğini, ekstra bir zam olmadığını düşünüyorsun."}},"verilen":[[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{"500":{"ad":"SERMAYE","tanim":"İşletmeye tahsis edilen veya işletmelerin ana sözleşmelerinde yer alan ve Ticaret Sicili\u0027ne tescil edilmiş bulunan sermaye tutarı bu hesapta yer alır. Kayıtlı sermaye sistemine alınan ortaklıklarda çıkarılmış sermaye gösterilir. Kayıtlı sermaye tavanı ayrıca dipnotlarda belirtilir."}}},{"capa":{"kaynak":"SGS 2024/3 Soru 109"},"kural":"madde 40\u0027a göre fiili hizmet süresi zammı yalnız tabloda tek tek sayılan iş ve işyerlerinde fiilen çalışıp o işin riskine maruz kalan sigortalılara tanınır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 109","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kay
