<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".

   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. Koyu tema yalnız düğmeyle (data-theme="dark", tarayıcıda kc_tema) ya da ?tema=koyu ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}

.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}
#akis{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.kart{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;max-width:560px;margin:0 auto}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.78em;color:var(--dim);margin-bottom:8px}
.noktalar{display:flex;gap:5px}.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--cizgi);display:block}.noktalar i.ok{background:var(--yesil)}.noktalar i.yan{background:var(--kirmizi)}.noktalar i.simdi{outline:2px solid var(--mavi);outline-offset:1px}
.noktalar.cok{gap:3px;flex-wrap:wrap;max-width:58%;justify-content:center}.noktalar.cok i{width:5px;height:5px}
.tt.teori td:first-child{white-space:nowrap;font-weight:700;color:var(--dim);width:1%}
.sinavDil{font:inherit;font-size:.78em;color:var(--mavi);background:transparent;border:1px solid var(--cizgi);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer}
.sinavDilM{margin-top:6px;font-size:.86em;color:var(--dim);border-left:2px solid var(--cizgi);padding-left:8px}
.govde{flex:1;overflow-y:auto;padding-bottom:90px}
.rozet{display:inline-block;font-size:.72em;color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 50%,transparent);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}
.ipucu{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:.8em;pointer-events:none;animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.panel.acik{transform:translateY(0)}.tutamac{width:38px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 10px}
/* Cem 03.09 "gorunum boyle geliyor": KAPALI panel kartin altina (105%) kayiyor ve SONRAKI KARTIN ustune biniyordu.

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}

.ozet{font-size:.93em;margin:0 0 8px;line-height:1.45}.ozet b{color:var(--yesil)}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}

.cip2.ek{display:none}.cipler.acikEk .cip2.ek{display:inline-block}.cipler.acikEk .bDaha{color:var(--dim)}
.cipler .bDaha{border-style:dashed;color:var(--dim)}
.sek{display:none;margin-top:8px}.sek.acik{display:block;animation:gir .2s ease}
.panel{overscroll-behavior:contain}
.kavramL{margin:4px 0 8px;padding-left:18px}.kavramL li{margin:3px 0}.kavramL i{color:var(--dim);font-style:normal;font-size:.85em}
.panelBas{position:sticky;bottom:4px;display:block;margin:10px 0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:.84em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent)}

/* yanlis kutusu + hazirlik skoru */
.ustSag{display:flex;align-items:center;gap:6px}
.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}
.kutuEkran{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}.kutuEkran.acik{display:flex}
.kutuIc{background:var(--kart);width:min(100%,640px);max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 22px;border:1px solid var(--cizgi)}
@media(min-width:900px){.kutuEkran{align-items:center}.kutuIc{border-radius:18px}}
.kutuIc .basl{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}

.dersSat{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92em}.dersSat .bar{height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden}.dersSat .bar i{display:block;height:100%;background:var(--yesil)}
.kutuSat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.92em}
/* kaynak metni */
.kaynakAd{color:var(--mavi);font-weight:800;font-size:.85em;margin:8px 0 4px}.kaynakMetin{font-size:.9em;line-height:1.55;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px}.kaynakMetin mark{background:color-mix(in srgb,var(--altin) 35%,transparent);color:var(--yazi);padding:1px 2px;border-radius:3px}
/* sen anlat / t-hesabi / sinavda */
.ipnot{font-size:.84em;color:var(--dim);margin:2px 0 8px}
.anlatK{width:100%;background:var(--bg2);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 11px;font-size:.95em;font-family:inherit;resize:vertical}
.anlatSonuc{font-size:.92em;margin-top:8px;line-height:1.5}.anlatPuan{font-weight:800;font-size:1.05em;margin-bottom:4px}.anlatOrnek{margin-top:8px;border-left:4px solid var(--altin);padding:6px 10px;background:color-mix(in srgb,var(--altin) 8%,transparent);border-radius:0 8px 8px 0}
.tKutular{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:600px){.tKutular{grid-template-columns:1fr 1fr}}

.tGovde{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--yazi);min-height:88px}.tSol{border-right:2px solid var(--yazi);padding:6px 8px}.tSag{padding:6px 8px;text-align:right}

.cikmisK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.88em;color:var(--dim);line-height:1.45}.cikmisK .yil{display:inline-block;background:color-mix(in srgb,var(--mavi) 15%,transparent);color:var(--mavi);font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.85em}

.ogret{margin:4px 0 6px}.thpNot{font-size:.85em;color:var(--dim);margin:2px 0 8px}
.hesapK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.9em;line-height:1.45}.hesapK.yan{border-color:color-mix(in srgb,var(--kirmizi) 60%,transparent)}.hesapK.dog{border-color:color-mix(in srgb,var(--yesil) 60%,transparent)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.btn{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;font-size:.9em;cursor:pointer}.btn.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0}.btn.mavi{border-color:var(--mavi);color:var(--mavi)}
/* surukleme oyunu */

.oyun{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:20;overflow-y:auto}.oyun.acik{display:flex}

#akis,.govde,.tabloSar,.serit,.panel,.oyun{scrollbar-width:none}#akis::-webkit-scrollbar,.govde::-webkit-scrollbar,.tabloSar::-webkit-scrollbar,.serit::-webkit-scrollbar,.panel::-webkit-scrollbar,.oyun::-webkit-scrollbar{display:none}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

const SORULAR=[{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"6356 sayılı Kanun m.39/3\u0027e göre imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren taraf sendika üyesi, sözleşmesinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanmaya devam eder.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Her zaman doğrudur\u0027 sorularında istisna barındırmayan, mutlak ifade taşıyan fıkrayı ara; \u0027aksine hüküm yoksa\u0027 veya \u0027onay aranmaz\u0027 gibi kesin kalıpları taşıyan cümle doğru olma ihtimali yüksektir.","konu":"toplu is sözleşmesi","tablo":{"satirlar":[["A) Toplu görüşmelere işvereni temsilen katılan kişi, görüşm…","m.39/7","YANLIŞ ifade"],["B) Dayanışma aidatı ödemek isteyen, imza tarihinde taraf se…","m.39/4","YANLIŞ ifade"],["C) Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi a…","m.39/3","doğru ifade"],["D) Aynı işverene ait, aynı işkolunda birden çok işyeri bulu…","m.34/2","YANLIŞ ifade"],["E) İmza tarihinden sonra taraf işçi sendikasına üye olan iş…","m.39/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren taraf sendika üyesi, iş sözleşmesinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanır.","E":"İmza tarihinden sonra taraf işçi sendikasına üye olan işçi, üyeliğinin işverene bildirilmesini beklemeksizin üyelik tarihinden itibaren sözleşmeden yararlanır.","A":"Toplu görüşmelere işvereni temsilen katılan kişi, görüşmeler sona erdikten sonra işçi sendikasına üye olursa toplu iş sözleşmesinden yararlanır.","D":"Aynı işverene ait, aynı işkolunda birden çok işyeri bulunması hâlinde, işletme düzeyinde toplu iş sözleşmesi şartı aranmaksızın bu işyerlerinden birinde işyeri düzeyinde toplu iş sözleşmesi yapılabilir.","B":"Dayanışma aidatı ödemek isteyen, imza tarihinde taraf sendikaya üye olmayan işçinin sözleşmeden yararlanabilmesi, taraf işçi sendikasının onayına bağlıdır."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.34","metin":"MADDE 34 – (1) Bir toplu iş sözleşmesi aynı işkolunda bir veya birden çok işyerini kapsayabilir. (2) Bir gerçek ve tüzel kişiye veya bir kamu kurum ve kuruluşuna ait aynı işkolunda birden çok işyerinin bulunduğu işyerlerinde, toplu iş sözleşmesi ancak işletme düzeyinde yapılabilir. (3) Grup toplu iş sözleşmesi, tarafların anlaşması üzerine bir işçi sendikası ile bir işveren sendikası arasında, birden çok üye işverene ait aynı işkolunda kurulu işyerleri ve işletmeleri kapsamak üzere yapılır. (4) İşletme toplu iş sözleşmesi yapılacak işyerlerinin aranılan niteliğe sahip olup olmadıklarına ilişkin uyuşmazlıklar, işletme merkezinin bulunduğu yerdeki mahkemede on beş gün içinde karara bağlanır. (Değişik cümle: 12/10/2017-7036/32 md.) Karar hakkında istinaf yoluna başvurulması hâlinde bölge adliye mahkemesi on beş gün içinde kesin olarak karar verir. Toplu iş sözleşmesinin şekli ve süresi"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.39","metin":"MADDE 39 – (1) Toplu iş sözleşmesinden taraf işçi sendikasının üyeleri yararlanır. (2) Toplu iş sözleşmesinden, sözleşmenin imzalanması tarihinde taraf sendikaya üye olanlar yürürlük tarihinden, imza tarihinden sonra üye olanlar ise üyeliklerinin taraf işçi sendikasınca işverene bildirildiği tarihten itibaren yararlanır. (3) Toplu iş sözleşmesinin imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren üyeler de, iş sözleşmelerinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanır. (4) Toplu iş sözleşmesinin imzası sırasında taraf işçi sendikasına üye olmayanlar, sonradan işyerine girip de üye olmayanlar veya imza tarihinde taraf işçi sendikasına üye olup da ayrılanlar veya çıkarılanların toplu iş sözleşmesinden yararlanabilmeleri, toplu iş sözleşmesinin tarafı olan işçi sendikasına dayanışma aidatı ödemelerine bağlıdır. Bunun için işçi sendikasının onayı aranmaz. Dayanışma aidatı ödemek suretiyle toplu iş sözleşmesinden yararlanma, talep tarihinden geçerlidir. (İptal dördüncü cümle:Anayasa Mahkemesinin 30/12/2020 tarihli ve E.:2020/57; K.:2020/83 sayılı Kararı ile) (5) Dayanışma aidatının miktarı, üyelik aidatından fazla olmamak kaydıyla sendika tüzüğünde belirlenir. (6) Faaliyeti durdurulmuş sendikalara dayanışma aidatı ödenmez. (7) Bu Kanun anlamında işveren vekilleri ile toplu iş sözleşmesi görüşmelerine işvereni temsilen katılanlar, toplu iş sözleşmesinden yararlanamaz. (8) Grev sonunda yapılan toplu iş sözleşmesinden, 65 inci maddeye göre zorunlu olarak çalışanlar dışında işyerinde çalışmış olanlar aksine hüküm bulunmadıkça yararlanamaz. Teşmil"}],"hakem":"6356 sayılı Kanun m.39/3, imza tarihi ile yürürlük tarihi arasında iş sözleşmesi sona eren sendika üyelerinin sözleşmelerinin sona erdiği tarihe kadar toplu iş sözleşmesinden yararlanacağını açıkça ve istisnasız hüküm altına almaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Aynı işverene ait aynı işkolundaki birden çok işyerinde toplu iş sözleşmesi sadece işletme düzeyinde yapılabilir; işyeri düzeyinde yapılamaz.","E":"İmza tarihinden sonra üye olan işçi, üyeliğin işverene bildirildiği tarihten yararlanmaya başlar; üyelik tarihinden değil.","A":"Görüşmelerde işvereni temsilen katılan kişi sonradan sendikaya üye olsa da hiçbir şekilde sözleşmeden yararlanamaz; bu yasak kuraldan muafiyet tanımaz.","B":"Dayanışma aidatı ödemeye karar veren işçi sendikasının onayını beklemeye gerek yoktur; talep tarihinden itibaren yararlanma başlar."},"dogru":"İmza ile yürürlük tarihi arasında işten ayrılan sendika üyesi, ayrılma tarihine kadar sözleşmeden yararlanmaya devam eder. Bu kural istisnaların tanımadığı mutlak bir hükümdür.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 39. madde 3. paragraf.","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 34. madde","tanim":"İşçi sendikası ile işveren veya işveren sendikası arasında, işçilerin çalışma koşullarını düzenlemek için yapılan sözleşme.","ad":"toplu iş sözleşmesi"},{"kaynak":"Sendikalar ve TİS K. 39. madde","tanim":"Toplu iş sözleşmesinin yapılmasında taraf olan sendikaya imza tarihinde kayıtlı olan işçi.","ad":"taraf sendika üyesi"},{"kaynak":"Sendikalar ve TİS K. 39. madde","tanim":"Toplu iş sözleşmesinin imzasında üye olmayan veya üyelikten ayrılan işçilerin, o sözleşmeden yararlanabilmesi için ödedikleri miktar.","ad":"dayanışma aidatı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":["2026/2","2024/2","2021/1","2020/3","2019/2","2019/1"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre toplu iş sözleşmesinin kapsamı ve sözleşmeden yararlanmaya ilişkin aşağıdaki durumlardan hangisi HER ZAMAN doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-01","verilenler":[],"dayanak":"6356 sayılı Kanun m.39/2, m.39/3, m.39/4, m.39/7 ve m.34/2","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konfeksiyon A.Ş.\u0027de TİS 5 Ocak 2024\u0027te imzalanıyor, yürürlük tarihi 1 Şubat 2024. Üye işçi Ayşe\u0027nin iş sözleşmesi 20 Ocak 2024\u0027te sona eriyor. Aynı işkolunda işverenin 3 ayrı işyeri daha var. Toplu görüşmelere işvereni temsilen katılan Mehmet, görüşmeler bitince sendikaya üye oluyor.","anlatim":"Bu tek olayda beş farklı kişi var, her biri ayrı bir kural sorusu doğuruyor. Rakamlar ve tarihler hep aynı olayda geçecek.","doldur":[]},{"formul":"Ne yapacağız: m.39 ve m.34\u0027teki kuralları bu tarihlere ve kişilere uygulayacağız; hangi ifade HER ZAMAN doğru çıkıyor bulacağız.","anlatim":"İmza tarihi, yürürlük tarihi, üyelik tarihi ve işyeri sayısı hep bu olaydaki gibi somut olacak. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.39/7","karar":"yanlış","anlatim":"m.39/7 mutlak bir yasak koyar, görüşmelerde işvereni temsil eden kişi hiçbir zaman yararlanamaz. Sonradan üye olması bu yasağı kaldırmaz.","formul":"Şık A: Mehmet, toplu görüşmelerde işvereni temsil etti ve görüşmeler bitince sendikaya üye oldu; bu Mehmet\u0027i TİS\u0027ten yararlandırır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.39/3","karar":"doğru","anlatim":"m.39/3 imza ile yürürlük arasında sözleşmesi sona eren üyeyi, sona erme tarihine kadar korur. Bu kural istisnasız ve mutlak işler.","formul":"Şık C: Ayşe\u0027nin iş sözleşmesi 20 Ocak\u0027ta sona eriyor, imza 5 Ocak, yürürlük 1 Şubat; Ayşe 20 Ocak\u0027a kadar TİS\u0027ten yararlanır mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.39/4","karar":"yanlış","anlatim":"m.39/4 açıkça onay aranmadığını söyler, sadece dayanışma aidatı ödenmesi yeterlidir. Yararlanma talep tarihinden itibaren başlar.","formul":"Şık B: Üye olmayan bir işçi dayanışma aidatı ödemek istiyor, taraf sendikanın onayı gerekir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.34/2","karar":"yanlış","anlatim":"m.34/2 gereği aynı işverene ait aynı işkolunda birden çok işyeri varsa TİS ancak işletme düzeyinde yapılabilir. İşyeri düzeyi seçeneği burada tamamen kapanır.","formul":"Şık D: İşverenin aynı işkolunda 4 işyeri varsa, bunlardan birinde işyeri düzeyinde TİS yapılabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.39/2","karar":"yanlış","anlatim":"m.39/2\u0027ye göre imza sonrası üye olanlar üyeliğin işverene bildirildiği tarihten itibaren yararlanır. Bildirim şartı beklenmeden yararlanma başlamaz.","formul":"Şık E: İmza sonrası üye olan işçi, üyeliği işverene bildirilmeden hemen sözleşmeden yararlanır mı?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Sadece imza-yürürlük arasında sözleşmesi sona eren üyeyi koruyan kural mutlaktır, gerisi hep bir şarta bağlıdır. Kendine sor: bu ifade herhangi bir koşula bağlı mı, yoksa istisnasız mı işliyor?","doldur":[]}],"anahtar":[{"ornek":"tarihi","kok":"tarihi"},{"ornek":"sözleşmesinin","kok":"sözleş"},{"ornek":"yararlanma","kok":"yararl"},{"ornek":"yürürlük","kok":"yürürl"},{"ornek":"olayda","kok":"olayda"},{"ornek":"işyeri","kok":"işyeri"}],"konuGiris":{"harita":"Ne zaman test edilir: Kapsam ve yararlanma koşullarının hangi durumda \u0027her zaman doğru\u0027 olduğu sorulduğunda test edilir. Nasıl ölçülür: Madde 34 ve 39\u0027daki istisnasız kurallar ile şarta bağlı kurallar ayırt edilerek ölçülür. Nasıl kaydedilir: Doğru seçenek, hiçbir istisnası olmayan kural cümlesi olarak kaydedilir.","desen":"Sınav genellikle m.39\u0027daki şarta bağlı yararlanma durumlarını (dayanışma aidatı, imza sonrası üyelik) \u0027her zaman doğru\u0027 gibi gösterip yanıltır. Doğru seçenek, istisnasız kesin kuralı içerir; diğerleri şarta bağlıdır. Bu soru m.34 ve m.39 hükümlerinin kapsam-yararlanma ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Aynı işverene ait birden çok işyerinde zorunlu uygulanan sözleşme türü","ad":"İşletme toplu iş sözleşmesi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Üye olmayanın sözleşmeden yararlanmak için ödediği bedel","ad":"Dayanışma aidatı","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Üyenin sözleşme haklarından fiilen faydalanmaya başladığı an","ad":"Yararlanma tarihi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Birden çok işverene ait işyerlerini kapsayan anlaşmalı sözleşme türü","ad":"Grup toplu iş sözleşmesi","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Soruda toplu iş sözleşmesinin kapsamı ve yararlanma koşullarına dair durumlar verilir, hangisinin istisnasız doğru olduğu istenir.","panel_ornek":"Bir apartmanda 5 daire sahibi ortak bir bahçe bakım anlaşması yapıyor; anlaşmaya sonradan katılan komşu, aidatını ödemeden faydalanamıyor. Aidat ödeyen komşu ise ödeme tarihinden itibaren bahçe hizmetinden yararlanıyor. Ödemeyen ise hiç yararlanamıyor, bu net bir kural.","ornek":"Bir apartmanda 5 daire sahibi ortak bir bahçe bakım anlaşması yapıyor; anlaşmaya sonradan katılan komşu, aidatını ödemeden faydalanamıyor. Aidat ödeyen komşu ise ödeme tarihinden itibaren bahçe hizmetinden yararlanıyor. Ödemeyen ise hiç yararlanamıyor, bu net bir kural.","yontemler":"Her seçenekte \u0027her zaman\u0027 ifadesinin şarta bağlı olup olmadığını kontrol et; şart içeren seçenekleri hemen ele.","nedir":"Toplu iş sözleşmesi, işkolu/işletme düzeyinde uygulanan ve kimlerin yararlanacağını belirleyen bir sözleşme türüdür. Sınav, kapsam kuralları ile yararlanma koşullarının hangi durumda kesin uyguladığını ölçer."},"olay":"","tuzak":{"D":{"ad":"İşyeri-İşletme Kesişimi Tuzağı","metin":"işletme düzeyi şartının esnetilebileceğini, tarafların anlaşmasıyla işyeri düzeyinde de yapılabileceğini düşünürsün. Doğrusu: m.34/2 gereği aynı işverene ait aynı işkolundaki birden çok işyerinde toplu iş sözleşmesi ANCAK işletme düzeyinde yapılabilir."},"E":{"ad":"Tarih Karışıklığı Tuzağı","metin":"yararlanmanın üyelik tarihinden başladığını sanırsın. Doğrusu: m.39/2\u0027ye göre imza tarihinden sonra üye olanlar, üyeliğin taraf işçi sendikasınca işverene BİLDİRİLDİĞİ tarihten itibaren yararlanır, üyelik tarihinden değil."},"A":{"ad":"İstisnanın Zamanla Kalkması Tuzağı","metin":"işveren vekili sıfatının sonradan üyelikle ortadan kalkacağını sanırsın. Doğrusu: m.39/7 mutlak bir yasaktır; TİS görüşmelerine işvereni temsilen katılan kişi hiçbir şekilde o sözleşmeden yararlanamaz."},"B":{"ad":"Onay Tuzağı","metin":"dayanışma aidatı ödeyerek yararlanmanın sendikanın iznine bağlı olduğunu düşünürsün. Doğrusu: m.39/4\u0027e göre bunun için işçi sendikasının onayı aranmaz, yararlanma talep tarihinden itibaren geçerli olur."}},"celdiriciYol":{},"hap":"Toplu iş sözleşmesinin işyeri/işletme düzeyindeki kapsamı ile sözleşmeden yararlanma kuralları birbirinden bağımsız iki kural setidir; biri diğerinin istisnası sayılamaz.","teshis":{"D":{"gercek":"m.34/2 gereği aynı işverene ait aynı işkolunda birden çok işyeri varsa TİS ancak işletme düzeyinde yapılabilir, işyeri düzeyi kapanır.","ayirt":"Bu işverenin aynı işkolunda başka işyeri var mı?","paragraf":"6356 s.K. m.34/2","yanilgi":"İşletme düzeyi şartının tercihe bağlı olduğunu düşünürsün."},"E":{"gercek":"m.39/2\u0027ye göre imza sonrası üye olanlar, üyeliğin işverene BİLDİRİLDİĞİ tarihten itibaren yararlanır.","ayirt":"Üyelik işverene ne zaman bildirildi?","paragraf":"6356 s.K. m.39/2","yanilgi":"Yararlanmanın üyelik anından başladığını sanırsın."},"A":{"gercek":"m.39/7 mutlak bir yasaktır, TİS görüşmelerinde işvereni temsil eden kişi hiçbir zaman o sözleşmeden yararlanamaz.","ayirt":"Bu kişi görüşmelerde işvereni mi temsil etti?","paragraf":"6356 s.K. m.39/7","yanilgi":"İşveren vekili/temsilci istisnasının sonradan üyelikle kalkacağını sanırsın."},"C":{"gercek":"m.39/3\u0027e göre imza-yürürlük arası sona eren üye, sözleşmesinin sona erdiği tarihe kadar TİS\u0027ten yararlanmaya devam eder.","ayirt":"Sözleşme, imza ile yürürlük tarihi arasında mı sona erdi ve kişi o an üye miydi?","paragraf":"6356 s.K. m.39/3","yanilgi":"Bu şıkkı eleyen öğrenci, sözleşme sona erdiğinde tüm hakların da anında biteceğini sanır."},"B":{"gercek":"m.39/4 açıkça onay aranmadığını, yararlanmanın talep tarihinden geçerli olduğunu belirtir.","ayirt":"Kanun burada bir onay şartı koymuş mu?","paragraf":"6356 s.K. m.39/4","yanilgi":"Dayanışma aidatının sendika onayına bağlı olduğunu düşünürsün."}},"verilen":[],"donem":6,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 108"},"kural":"madde 17/3 uyarınca aynı işkolunda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok sendikaya üye olabilirken, madde 20/1 uyarınca bir sendika aynı zamanda yalnızca bir üst kuruluşa üye olabilir; aksi hâlde sonraki üyelik geçersizdir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 108","sonDonem":5,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 17\u0027deki işçi istisnasını madde 20\u0027deki üst kuruluş kuralına taşıma en sık düşülen tuzaktır, iki maddeyi ayrı oku.","konu":"sendika üyeliği","tablo":{"satirlar":[["A) Üst kuruluş üyeliğinden çekilme, üst kuruluşa yapılan bi…","m.20/2","YANLIŞ ifade"],["B) Aynı işkolunda farklı işverenlere ait işyerlerinde çalış…","m.20/1","YANLIŞ ifade"],["C) İşçi sendikasına üye olabilmek için on sekiz yaşını dold…","m.17/1","YANLIŞ ifade"],["D) Aynı işkolunda ve aynı zamanda farklı işverenlere ait iş…","m.17/3, m.20/1","doğru ifade"],["E) Aynı işkolunda ve aynı zamanda birden çok sendikaya üye …","m.17/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşçi sendikasına üye olabilmek için on sekiz yaşını doldurmuş ve işçi sayılıyor olmak gerekir.","E":"Aynı işkolunda ve aynı zamanda birden çok sendikaya üye olan işçinin bu sendikalara ilişkin tüm üyelikleri geçersiz sayılır.","A":"Üst kuruluş üyeliğinden çekilme, üst kuruluşa yapılan bildirim tarihinde derhal geçerlilik kazanır.","D":"Aynı işkolunda ve aynı zamanda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok işçi sendikasına üye olabilir; ancak bir sendika aynı anda yalnızca bir üst kuruluşa üye olabilir.","B":"Aynı işkolunda farklı işverenlere ait işyerlerinde çalışan işçiler için tanınan istisna, üst kuruluş üyeliği bakımından da geçerlidir ve bir sendika aynı anda birden fazla üst kuruluşa üye olabilir."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.17","metin":"MADDE 17 – (1) On beş yaşını dolduran ve bu Kanun hükümlerine göre işçi sayılanlar, işçi sendikalarına üye olabilir. (2) Bu Kanun anlamında işveren sayılanlar, işveren sendikalarına üye olabilir. (3) Sendikaya üye olmak serbesttir. Hiç kimse sendikaya üye olmaya veya olmamaya zorlanamaz. İşçi veya işverenler aynı işkolunda ve aynı zamanda birden çok sendikaya üye olamaz. Ancak aynı işkolunda ve aynı zamanda farklı işverenlere ait işyerlerinde çalışan işçiler birden çok sendikaya üye olabilir. İşçi ve işverenlerin bu hükme aykırı şekilde birden çok sendikaya üye olmaları hâlinde sonraki üyelikler geçersizdir. (4) Bir işyerinde yardımcı işlerde çalışan işçiler de, işyerinin girdiği işkolunda kurulu bir sendikaya üye olabilir. (5) Sendikaya üyelik, Bakanlıkça sağlanacak elektronik başvuru sistemine e-Devlet kapısı üzerinden üyelik başvurusunda bulunulması ve sendika tüzüğünde belirlenen yetkili organın kabulü ile e-Devlet kapısı üzerinden kazanılır. Üyelik başvurusu, sendika tarafından otuz gün içinde reddedilmediği takdirde üyelik talebi kabul edilmiş sayılır. Haklı bir neden gösterilmeden üyelik başvurusu kabul edilmeyenler, bu kararın kendilerine tebliğinden itibaren otuz gün içinde dava açabilir. Mahkemenin kararı kesindir. Mahkemenin davacı lehine karar vermesi hâlinde üyelik, red kararının alındığı tarihte kazanılmış sayılır. Üyelik aidatı"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.20","metin":"MADDE 20 – (1) Üst kuruluş üyeliğine başvuru genel kurul kararına bağlıdır. Üst kuruluş üyeliği, tüzükte belirlenen yetkili organın kabulüyle kazanılır. Aynı zamanda birden fazla üst kuruluşa üye olunamaz. Aksi hâlde sonraki üyelikler geçersizdir. (2) Üst kuruluş üyeliğinden çekilme genel kurul kararına bağlıdır. Çekilme, üst kuruluşa bildirim tarihinden itibaren bir ay sonra geçerlilik kazanır. (3) Üst kuruluş üyeliğinden çıkarılma, üst kuruluş genel kurulu kararıyla olur. (4) Üye olma, üyelikten çekilme ve çıkarılma kararları, üst kuruluş tarafından bir ay içerisinde Bakanlığa bildirilir. Uluslararası işçi ve işveren kuruluşlarına üyelik"}],"hakem":"Dogru sikkin dayandigi her iki kural (m.17/3 ve m.20/1) kaynak metinde acikca yer almakta ve sorunun cevabini tam olarak desteklemektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Genel olarak on sekiz yaş erginlik sınırını sendika üyeliğine uygular. Doğrusu on beş yaşını dolduranlar işçi sendikasına üye olabilir.","E":"Çoklu üyelik durumunda tüm üyeliklerin geçersiz sayılacağını okur. Doğrusu yalnızca ilk üyelikten sonraki olanlar geçersizdir, ilk üyelik geçerli kalır.","A":"Çekilme bildirimi yapıldığında hemen geçerli olacağını düşünür. Doğrusu çekilme, bildirimin ardından bir ay sonra etkili hale gelir.","B":"İşçilerin çoklu üyelik hakkının sendikalar arası ilişkiye de uygulanacağını sanır. Doğrusu bir sendika hiçbir istisna olmaksızın yalnız bir üst kuruluşa üye olabilir."},"dogru":"Aynı işkolunda farklı işverenlere çalışan işçiler birden çok sendikaya üye olabilir. Ama bir sendika sadece bir üst kuruluşa üye olabilir. İşçi düzeyindeki çoklu üyelik izni, sendika düzeyinde geçmez.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 17. ve 20. maddelerine göre.","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 17. madde","tanim":"On beş yaşını dolduran ve işçi sayılan kişilerin, sendika tüzüğünün belirlediği yetkili organ tarafından kabul edilmesiyle e-Devlet üzerinden kazandığı statü.","ad":"İşçi sendikasına üyelik"},{"kaynak":"Sendikalar ve TİS K. 20. madde","tanim":"Bir sendikanın genel kurul kararıyla üst kuruluşa başvurması ve tüzükteki yetkili organ tarafından kabul edilmesiyle kazandığı üyelik ilişkisi.","ad":"Üst kuruluş üyeliği"},{"kaynak":"Sendikalar ve TİS K. 17. madde","tanim":"Bir işçi, aynı işkolunda birden fazla işverenin farklı işyerlerinde çalışıyorsa, her işyeri için ayrı sendikaya üye olabilir.","ad":"Aynı işkolunda farklı işverenlere ait işyerlerinde çalışan işçiler için istisna"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":6,"ornekler":[],"donemler":["2026/1","2025/3","2025/2","2025/1","2016/1","2015/3"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre sendika üyeliği ve üst kuruluş üyeliğine ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-02","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.17/1, m.17/3, m.20/1, m.20/2","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: bir metal fabrikasında çalışan Kemal, aynı işkolunda hem A firmasında hem B firmasında yarı zamanlı çalışıyor ve iki ayrı işçi sendikasına üye oluyor; bu iki sendika da aynı üst kuruluşa mı yoksa farklı üst kuruluşlara mı üye olabilir tartışılıyor.","anlatim":"Kemal\u0027in iki sendikaya üyeliği tartışma konusu değil, asıl mesele sendikaların üst kuruluşla ilişkisi. Olay bize işçi düzeyi ile sendika düzeyinin farklı kurallara tabi olduğunu gösteriyor. Bu ayrımı beş ifadede tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: madde 17/3 işçiye çoklu sendika yasağına istisna tanır, madde 20/1 ise sendikaya çoklu üst kuruluş yasağını istisnasız koyar; şimdi beş ifadeyi Kemal\u0027in olayında tek tek deneyeceğiz.","anlatim":"Kural iki katmanlı: bir işçi şartlı olarak birden çok sendikaya üye olabilir ama bir sendika hiçbir şartla birden çok üst kuruluşa üye olamaz. Bu farkı unutursan hepsi karışır.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.20/2","karar":"yanlış","anlatim":"Hayır, olayda bildirim yapılsa bile üyelik o an bitmiyor. Madde 20/2 bir aylık bekleme süresi koyuyor. Çekilme ancak bildirimden bir ay sonra geçerlilik kazanır.","formul":"Şık A: Kemal\u0027in sendikası üst kuruluştan çekilme bildirimi yaptığı gün çekilme derhal geçerli olur mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.20/1","karar":"yanlış","anlatim":"Hayır, olayda işçiye tanınan çoklu üyelik hakkı sendikaya taşınmıyor. Madde 20/1 istisnasız biçimde tek üst kuruluş kuralı koyuyor. Sendika iki üst kuruluşa birden üye olamaz.","formul":"Şık B: Kemal\u0027in sendikası, işçi düzeyindeki istisnaya dayanarak aynı anda iki üst kuruluşa üye olabilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.17/1","karar":"yanlış","anlatim":"Evet olabilir ama şart on sekiz değil on beştir. Madde 17/1 on beş yaşını dolduran ve işçi sayılanı yeterli görür. Bu şık yaşı yanlış yazdığı için hatalı.","formul":"Şık C: Kemal on sekiz yaşında olmasa, örneğin on altı yaşında olsa yine de sendikaya üye olabilir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.17/3, m.20/1","karar":"doğru","anlatim":"Evet, tam olay bu. Madde 17/3 işçiye istisna tanırken madde 20/1 sendikaya istisnasız tek üst kuruluş kuralı koyuyor. İki katman birbirinden bağımsız çalışıyor.","formul":"Şık D: Kemal aynı işkolunda farklı işverenlerde çalıştığı için iki sendikaya üye olabilir, ama bu iki sendikadan her biri yine de sadece bir üst kuruluşa üye olabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.17/3","karar":"yanlış","anlatim":"Hayır, sadece sonraki üyelik geçersiz sayılır. Madde 17/3 ilk üyeliği korur, sonrakini iptal eder. Bütün üyelikleri silmek kanunun sözüne aykırı olur.","formul":"Şık E: Kemal aynı işkolunda aynı anda iki sendikaya üye olsa, kuraldışı bu iki üyeliğin ikisi de mi geçersiz sayılır?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Kemal\u0027in olayı sana işçi düzeyi ile sendika düzeyinin ayrı kurallara bağlı olduğunu öğretti. Kendine hep şunu sor: bu istisna işçiye mi yoksa sendikaya mı ait?","doldur":[]}],"anahtar":[{"ornek":"sendika","kok":"sendik"},{"ornek":"kuruluşa","kok":"kurulu"},{"ornek":"istisnası","kok":"istisn"},{"ornek":"üyelik","kok":"üyelik"},{"ornek":"olabilir","kok":"olabil"},{"ornek":"düzeyinde","kok":"düzeyi"}],"konuGiris":{"harita":"Ne zaman geçersiz sayılır: Aynı işkolunda aynı anda birden çok sendikaya üye olunduğunda sonraki üyelik geçersiz sayılır. Nasıl kazanılır: Üyelik, e-Devlet üzerinden başvuru ve yetkili organ kabulüyle kazanılır. Nasıl kaydedilir: Otuz gün içinde reddedilmeyen başvuru kabul edilmiş sayılır ve bu şekilde kayda geçer.","desen":"Sınav genellikle \u0027aynı işkolunda birden çok üyelik geçerli midir\u0027 veya \u0027üyelik ne zaman kazanılır\u0027 sorularıyla tuzak kurar. Bazı seçenekler otuz günlük ret süresini veya farklı işverenlere ait işyerlerinde çalışma istisnasını çarpıtır. Bu soru m.17 ve m.20\u0027deki üyelik kazanma ve çokluk yasağı hükümlerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"On beş yaşını dolduran işçi sayılanların sendikaya katılma hakkı","ad":"İşçi sendikası üyeliği","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Aynı işkolunda aynı anda tek sendikaya üye olunabilmesi kuralı","ad":"Birden çok üyelik yasağı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Sendikanın başvuruyu reddedebileceği otuz günlük süre","ad":"Üyelik başvurusu ret süresi","kim":"meslek kuruluşu düzenler"},{"kaynak":"kuraldan bilinir","tanim":"Üst kuruluş tüzüğündeki yetkili organın üyeliği onaylaması","ad":"Üst kuruluş üyeliği kabulü","kim":"meslek kuruluşu düzenler"}],"sinavda":"Soru kökünde sendika ve üst kuruluş üyeliğine dair bir durum verilir, doğru hükmü seçmeniz istenir.","panel_ornek":"Bir arkadaşın aynı anda iki farklı spor kulübüne üye olmak istiyor ama kulüp tüzüğü buna izin vermiyor. Sonradan yaptığı ikinci başvuru geçersiz sayılıyor, sadece ilk üyeliği geçerli kalıyor. Yani aynı anda iki yerde birden tam üyelik olmuyor.","ornek":"Bir arkadaşın aynı anda iki farklı spor kulübüne üye olmak istiyor ama kulüp tüzüğü buna izin vermiyor. Sonradan yaptığı ikinci başvuru geçersiz sayılıyor, sadece ilk üyeliği geçerli kalıyor. Yani aynı anda iki yerde birden tam üyelik olmuyor.","yontemler":"Metni madde madde karşılaştırarak hangi seçeneğin kanun lafzına birebir uyduğunu bulun; \u0027ancak\u0027 ve \u0027aksi hâlde\u0027 gibi istisna ifadelerine dikkat edin.","nedir":"Bu konu, işçi ve işverenlerin sendika ile üst kuruluşlara üyelik kural ve sınırlarını düzenler. Sınav, üyeliğin nasıl kazanıldığını ve hangi hallerde geçersiz sayıldığını bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Yaş Tuzağı","metin":"öğrenci iş hukukundaki genel erginlik yaşını (on sekiz) sendika üyeliğine uygular. Doğrusu: madde 17/1 açıkça on beş yaşını dolduran ve işçi sayılanların işçi sendikasına üye olabileceğini belirtir."},"E":{"ad":"Kapsam Tuzağı","metin":"öğrenci \u0027sonraki üyelikler geçersizdir\u0027 ifadesini tüm üyeliklerin geçersizliği şeklinde okur. Doğrusu: madde 17/3 yalnızca ilk üyelikten sonraki üyeliklerin geçersiz sayılacağını düzenler, ilk üyelik geçerliliğini korur."},"A":{"ad":"Zamanlama Tuzağı","metin":"öğrenci bildirimle birlikte çekilmenin anında sonuç doğurduğunu düşünür. Doğrusu: madde 20/2 uyarınca çekilme, bildirim tarihinden itibaren bir ay sonra geçerlilik kazanır."},"B":{"ad":"İstisnayı Taşıma Tuzağı","metin":"öğrenci işçi için tanınan çoklu üyelik istisnasının sendika-üst kuruluş ilişkisine de uygulanacağını sanır. Doğrusu: madde 20/1 hiçbir istisna öngörmeden bir sendikanın aynı anda birden fazla üst kuruluşa üye olamayacağını düzenler."}},"celdiriciYol":{},"hap":"İşçi düzeyinde farklı işverenlerde çalışanlara çoklu sendika üyeliği istisnası tanınır, ama bir sendika aynı anda yalnızca bir üst kuruluşa üye olabilir; bu istisnasızdır.","teshis":{"C":{"gercek":"Madde 17/1 işçi sendikasına üyelik için on beş yaşını doldurmuş ve işçi sayılmayı yeterli görür.","ayirt":"Kanun metninde hangi yaş açıkça yazılı?","paragraf":"m.17/1","yanilgi":"Sendika üyeliği için genel medeni erginlik yaşı olan on sekizi arıyorsun."},"E":{"gercek":"Madde 17/3 yalnızca sonraki üyelikleri geçersiz sayar, önceki (ilk) üyelik geçerliliğini korur.","ayirt":"Geçersizlik hangi üyelikler için, ilk mi sonraki mi?","paragraf":"m.17/3","yanilgi":"Geçersizlik sonucunun ilk üyeliği de kapsadığını sanıyorsun."},"D":{"gercek":"6356 sayılı Kanun m.17/3\u0027teki istisna yalnız işçi-sendika ilişkisine özgüdür; m.20/1 üst kuruluş için istisnasız tek üyelik kuralı koyar.","ayirt":"Bu istisna işçi düzeyinde mi yoksa sendika-üst kuruluş düzeyinde mi düzenlenmiş?","paragraf":"m.17/3, m.20/1","yanilgi":"Bu şıkkı elerken işçi düzeyindeki istisnayı üst kuruluşa da uygulanır sanıyorsun."},"B":{"gercek":"Madde 20/1 istisnasız biçimde bir sendikanın aynı anda birden fazla üst kuruluşa üye olamayacağını belirtir.","ayirt":"Bu kural işçiye mi sendikaya mı hitap ediyor?","paragraf":"m.20/1","yanilgi":"İşçi için tanınan çoklu üyelik istisnasının sendikalar arası ilişkiye de yansıdığını sanıyorsun."},"A":{"gercek":"Madde 20/2 çekilmenin bildirim tarihinden bir ay sonra geçerlilik kazanacağını öngörür.","ayirt":"Bildirim ile geçerlilik anı aynı gün mü, süre var mı?","paragraf":"m.20/2","yanilgi":"Bildirimin kendisinin hukuki sonucu anında doğurduğunu düşünüyorsun."}},"verilen":[],"donem":6,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 109"},"kural":"İş Kanunu m.11 esaslı neden olmadan zincirleme belirli süreli sözleşmeyi başlangıçtan itibaren belirsiz süreli sayar; ayrıca işyeri devri sözleşmenin nispiliği ilkesinin istisnasıdır, devralan işçilerin sözleşmesine devreden ile birlikte taraf olur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 109","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İki kuralın kesiştiği olaylarda önce her kuralı ayrı ayrı uygula, sonra sonuçları birleştir; tek kuralla cevaplama.","konu":"is sözleşmesi turleri","tablo":{"satirlar":[["A) Esaslı neden olmadan yapılan zincirleme belirli süreli s…","m.11; istisna-5","doğru ifade"],["B) İşyeri devri, sözleşmenin nispiliği ilkesinin mutlak biç…","istisna-5","YANLIŞ ifade"],["C) Esaslı neden olmaksızın zincirleme yapılan belirli sürel…","m.11","YANLIŞ ifade"],["D) İşyeri devri, tarafların iradesi dışında borç doğurduğun…","istisna-5","YANLIŞ ifade"],["E) Zincirleme belirli süreli sözleşme esaslı nedene dayansa…","istisna-5","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Esaslı neden olmaksızın zincirleme yapılan belirli süreli sözleşme belirli süreli olma özelliğini korur; işyeri devri bu özelliği etkilemez.","E":"Zincirleme belirli süreli sözleşme esaslı nedene dayansa da dayanmasa da devir halinde yalnız devralan işletme sorumlu olur, devreden işveren sorumluluktan kurtulur.","A":"Esaslı neden olmadan yapılan zincirleme belirli süreli sözleşme başlangıçtan itibaren belirsiz süreli sayılır ve işyerini devralan (B) işletmesi bu sözleşmeye devreden ile birlikte taraf olur.","D":"İşyeri devri, tarafların iradesi dışında borç doğurduğundan sözleşmenin nispiliği ilkesinin bir istisnası değil, bu ilkenin doğrudan uygulanmasıdır.","B":"İşyeri devri, sözleşmenin nispiliği ilkesinin mutlak biçimde korunduğu bir haldir; bu nedenle (B) işletmesi işçinin sözleşmesine taraf olmaz, sözleşme yalnız (A) ile devam eder."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.11","metin":"Madde 11 - İş ilişkisinin bir süreye bağlı olarak yapılmadığı halde sözleşme belirsiz süreli sayılır. Belirli süreli işlerde veya belli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak işveren ile işçi arasında yazılı şekilde yapılan iş sözleşmesi belirli süreli iş sözleşmesidir. Belirli süreli iş sözleşmesi, esaslı bir neden olmadıkça, birden fazla üst üste (zincirleme) yapılamaz. Aksi halde iş sözleşmesi başlangıçtan itibaren belirsiz süreli kabul edilir. Esaslı nedene dayalı zincirleme iş sözleşmeleri, belirli süreli olma özelliğini korurlar. Belirli ve belirsiz süreli iş sözleşmesi ayırımın sınırları"},{"ad":"TEORI - Sozlesmenin nispiligi ilkesi ve istisnalari","metin":"Sözleşmenin NİSPİLİĞİ (görecelilik) ilkesi, bir sözleşmenin yalnız tarafları arasında hüküm ve sonuç doğurmasını, üçüncü kişiler bakımından ne borç ne de kural olarak hak yaratmamasını ifade eder. Bu ilke borçlar hukukunun temel taşıdır: kimse iradesi dışında bir sözleşmeyle borç altına sokulamaz. İSTİSNALARI (üçüncü kişiye etki doğuran hâller): (1) ÜÇÜNCÜ KİŞİ YARARINA SÖZLEŞME — eksik üçüncü kişi yararına sözleşmede edim üçüncü kişiye ifa edilir ancak talep hakkı alacaklıdadır; TAM üçüncü kişi yararına sözleşmede üçüncü kişi borçludan ifayı DOĞRUDAN talep edebilir (hayat sigortasında lehtar tipik örnektir). (2) ÜÇÜNCÜ KİŞİNİN FİİLİNİ ÜSTLENME — burada üçüncü kişi borç altına girmez; üstlenen, üçüncü kişi edimi yerine getirmezse zararı gidermeyi taahhüt eder. (3) TAPUYA ŞERH EDİLEN KİŞİSEL HAKLAR — önalım, alım, geri alım, kira ve satış vaadi sözleşmelerinin tapu kütüğüne şerhi, bu kişisel hakkı sonraki maliklere karşı ileri sürülebilir kılar (eşyaya bağlı borç etkisi). (4) TAŞINMAZ SATIŞINDA VE KİRADA HALEFİYET — kiralananın el değiştirmesinde yeni malikin kira sözleşmesinin tarafı hâline gelmesi. (5) İŞLETMENİN/İŞ YERİNİN DEVRİ — devralanın işçilerin iş sözleşmelerine tarafı olarak halef olması ve devreden ile birlikte sorumluluğu. (6) SÖZLEŞME DEVRİ VE BORCUN ÜSTLENİLMESİ (alacaklının rızasıyla). (7) MİRASÇILARA GEÇİŞ — kişiye sıkı sıkıya bağlı olmayan sözleşme ilişkilerinin külli halefiyetle mirasçılara intikali. (8) EŞYAYA BAĞLI HAKLAR VE İRTİFAK/TAŞINMAZ YÜKÜ gibi aynı etkiyle üçüncü kişilere karşı ileri sürülebilen ilişkiler. Ayrıca üçüncü kişiyi koruyucu etkili söz…"}],"hakem":"Doğru sık, İş Kanunu m.11\u0027de açıkça yer alan esaslı neden olmadan zincirleme belirli süreli sözleşmenin başlangıçtan itibaren belirsiz süreli sayılması kuralı ile kaynak metinde detaylı anlatılan işletme/iş yeri devrinin sözleşmenin nispiliği ilkesinin istisnası olarak devralan işletmeyi sözleşmeye taraf kılan hükümlere dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Esaslı neden olmadan üst üste yapılan belirli süreli sözleşme niteliği değiştirir; kanun bunu belirsiz süreli saymakla bu tür zincirleme sözleşmeyi engeller, devir bunu değiştirmez.","E":"İşyeri devrinde devralan sözleşmeye taraf olmakla birlikte, devreden işveren de sorumluluğundan kurtulmaz; her ikisi birlikte sorumluluk taşır.","D":"İşyeri devri tarafların iradesi dışında üçüncü kişiye (devralana) etki doğurduğu için nispilik ilkesinin kendisi değil tam aksine istisnasıdır; ilkenin uygulanması değil, istisnai hâlidir.","B":"Sözleşmenin nispiliği ilkesi normal halde üçüncü kişileri korur; ancak işyeri devri tam olarak bu ilkenin istisnasıdır ve devralan işçinin sözleşmesine taraf hâline gelir, sözleşme A ile yalnız devam etmez."},"dogru":"İşveren üst üste üç kez haklı neden olmaksızın belirli süreli sözleşme yaptığı için bu sözleşme baştan itibaren belirsiz süreli kabul edilir. İşyeri devredilince yeni işletme, eski işletme ile birlikte bu belirsiz süreli sözleşmenin tarafı olur.","sinav":"İş Kanunu 11. madde esaslı neden olmadan zincirleme belirli süreli sözleşmeyi başlangıçtan itibaren belirsiz süreli sayar ve işyeri devri sözleşmenin nispiliği ilkesinin istisnası olarak devralana halefiyeti sağlar.","kavramlar":[{"kaynak":"İş Kanunu 11. madde","tanim":"Haklı bir sebep gösterilmeksizin aynı işçi ile arka arkaya birden fazla kez belirli süreli sözleşme yapılmasıdır; bu durumda sözleşme başlangıçtan itibaren belirsiz süreli kabul edilir.","ad":"Esaslı neden olmadan zincirleme belirli süreli iş sözleşmesi"},{"kaynak":"TEORI","tanim":"Bir sözleşmenin yalnız tarafları arasında hüküm doğurması, üçüncü kişiler bakımından borç yaratmamasını ifade eder; kimse iradesi dışında bir sözleşmeyle borç altına sokulamaz.","ad":"Sözleşmenin nispiliği ilkesi"},{"kaynak":"TEORI","tanim":"İşletme veya işyeri el değiştirdiğinde devralanın işçilerin iş sözleşmelerine taraf hâline gelmesi ve devreden ile birlikte sorumlu olmasıdır; sözleşmenin nispiliği ilkesinin istisnasıdır.","ad":"İşletme/işyeri devri halefiyeti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":5,"ornekler":[],"donemler":["2026/1","2025/2","2022/1","2019/2","2017/3"]},"oyun":null,"tip":"teori","soru":"İşveren (A), işçisiyle esaslı bir neden bulunmaksızın üst üste üç kez belirli süreli iş sözleşmesi yapmış; son sözleşme devam ederken işyerini (B) işletmesine devretmiştir. Bu olaya ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-04","verilenler":[],"dayanak":"İş Kanunu (4857 s.K.) m.11; sözleşmenin nispiliği ilkesi ve istisnaları (işletme/iş yeri devri)","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: (C) Tekstil A.Ş., 2019-2021 arası satış elemanı Ayşe ile arka arkaya üç kez, hiçbir mevsimlik/proje gerekçesi olmadan 1\u0027er yıllık belirli süreli sözleşme imzalamış. 2021\u0027de üçüncü sözleşme sürerken işyerini (D) Perakende Ltd.\u0027ye devretmiş.","anlatim":"Ayşe işe devam ediyor ama artık maaş bordrosu (D)\u0027den geliyor.","doldur":[]},{"formul":"Ne yapacağız: önce Ayşe\u0027nin sözleşmesinin türüne bakacağız (esaslı neden var mı?), sonra devrin bu sözleşmeye etkisini soracağız; beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Tek olayda iki soru gizli: sözleşme ne, devir ne yapıyor. Beşini de bu iki soruya göre tartacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.11; istisna-5","karar":"doğru","anlatim":"Ayşe\u0027nin arka arkaya üç sözleşmesinde hiç esaslı neden yok, bu yüzden sözleşme başlangıçtan itibaren belirsiz süreli sayılır. Ayrıca işyeri devri nispiliğin istisnasıdır, (D) devralan olarak (C) ile birlikte bu sözleşmenin tarafı olur.","formul":"Şık A: Ayşe\u0027nin sözleşmesi baştan belirsiz süreli sayılır mı, ve (D) bu sözleşmeye (C) ile birlikte taraf olur mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"istisna-5","karar":"yanlış","anlatim":"Hayır, işletme devri tam da nispiliğin sekiz istisnasından biri. Ayşe\u0027nin sözleşmesi (D)\u0027yi de bağlar, mutlaklık burada çöker.","formul":"Şık B: Nispilik ilkesi burada mutlak mı işler, yani (D) hiçbir şekilde Ayşe\u0027nin sözleşmesine taraf olmaz mı diyeceksin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.11","karar":"yanlış","anlatim":"Hayır, esaslı neden yoksa zincirleme sözleşme belirli süreli kalamaz; kanun bunu açıkça belirsiz süreliye çevirir. Ayşe\u0027nin olayında bu koruma hiç işlemez.","formul":"Şık C: Ayşe\u0027nin sözleşmesi esaslı neden yokluğuna rağmen belirli süreli özelliğini korur mu diyeceksin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"istisna-5","karar":"yanlış","anlatim":"Hayır, ilke sözleşmeyi taraflarla sınırlar; (D) sözleşmenin tarafı değilken bağlanıyorsa bu tam olarak istisnadır. İlkenin kendisiyle istisnasını karıştırma.","formul":"Şık D: İşyeri devrini nispilik ilkesinin istisnası değil, ilkenin doğrudan uygulanması mı sayacaksın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"istisna-5","karar":"yanlış","anlatim":"Hayır, işletme devrinde devralan sözleşmeye taraf olur ama devreden işveren de kural olarak birlikte sorumlu kalır. Ayşe\u0027nin olayında (C) sahneden tamamen silinmez.","formul":"Şık E: Devirden sonra yalnız (D) mi sorumlu olur, (C) sorumluluktan tamamen kurtulur mu diyeceksin?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Ayşe\u0027nin olayında iki kural aynı anda çalışıyor: zincirleme sözleşme belirsizleşir, devir de devralanı taraf yapar. Kendine hep şunu sor: bu olayda tek kural mı yeterli, yoksa birden fazla kural üst üste mi işliyor?","doldur":[]}],"anahtar":[{"ornek":"sözleşme","kok":"sözleş"},{"ornek":"süreli","kok":"süreli"},{"ornek":"devralan","kok":"devral"},{"ornek":"istisnasıdır","kok":"istisn"},{"ornek":"belirsiz","kok":"belirs"},{"ornek":"birlikte","kok":"birlik"}],"konuGiris":{"harita":"Ne zaman belirsiz süreli sayılır: esaslı neden olmadan üst üste yapılan belirli süreli sözleşmelerde baştan itibaren. Nasıl ölçülür: sözleşmenin zincirleme yapılıp yapılmadığı ve objektif/esaslı bir nedenin bulunup bulunmadığına bakılarak. Nasıl kaydedilir: işyeri devrinde işçinin sözleşmesi kesintisiz biçimde devralana geçer.","desen":"Soru, üst üste esaslı nedensiz belirli süreli sözleşme yapılmasını işyeri devriyle birleştirerek iki kuralın aynı anda uygulanmasını ister. Öğrenciler genelde devri fark edip sözleşmenin türünü unutur ya da tersini yapar. Bu soru İş Kanunu m.11 ve işyeri devri/nispilik istisnası noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Objektif koşula bağlı, yazılı yapılan, süresi önceden belli sözleşme","ad":"Belirli süreli iş sözleşmesi","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Zincirleme belirli süreli sözleşmeyi haklı kılan objektif gerekçe","ad":"Esaslı neden","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Esaslı neden yoksa sözleşme başlangıçtan itibaren belirsiz süreli sayılır","ad":"Zincirleme sözleşme sonucu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Devralanın işçinin sözleşmesine halef olup devredenle birlikte sorumlu olması","ad":"İşyeri devri","kim":"kanun sabitler"}],"sinavda":"Zincirleme belirli süreli sözleşme hikâyesi ve ardından işyeri devri verilip sözleşmenin hukuki niteliği ile devralanın durumu sorulur.","panel_ornek":"Bir arkadaşın market marketiyle üç kez üst üste 1\u0027er aylık sözleşme imzaladığını, esaslı bir gerekçe olmadan yenilendiğini düşün. Dördüncü ayda market el değiştirse bile onun hakları yeni sahibiyle devam eder. Süreklilik esas alınır, kağıt üzerindeki \u0027geçici\u0027 etiketine bakılmaz.","ornek":"Bir arkadaşın market marketiyle üç kez üst üste 1\u0027er aylık sözleşme imzaladığını, esaslı bir gerekçe olmadan yenilendiğini düşün. Dördüncü ayda market el değiştirse bile onun hakları yeni sahibiyle devam eder. Süreklilik esas alınır, kağıt üzerindeki \u0027geçici\u0027 etiketine bakılmaz.","yontemler":"Önce zincirleme sözleşmenin esaslı nedene dayanıp dayanmadığını belirle, sonra devrin bu belirlenmiş türü değiştirmediğini, sadece tarafını değiştirdiğini uygula.","nedir":"İş sözleşmesi türleri, işçi ile işveren arasındaki bağın süreye bağlı olup olmadığını sınıflar. Sınav, zincirleme belirli süreli sözleşmenin ne zaman belirsiz süreliye dönüştüğünü ölçer."},"olay":"hesaplama gerektirmez, iki kuralın birlikte uygulanmasıdır.","tuzak":{"C":{"ad":"Zincirleme Sözleşme Tuzağı","metin":"öğrenci esaslı neden aranmadan da zincirleme belirli süreli sözleşmenin niteliğini koruduğunu sanır. Doğrusu: esaslı neden yoksa sözleşme başlangıçtan itibaren belirsiz süreli kabul edilir."},"E":{"ad":"Tek Taraflı Sorumluluk Tuzağı","metin":"öğrenci devirle devredenin sorumluluğunun tamamen sona erdiğini sanır. Doğrusu: işyeri devrinde devralan işçi sözleşmelerine taraf olur ancak devreden ile birlikte sorumluluk devam eder."},"D":{"ad":"Kavram Karışıklığı Tuzağı","metin":"öğrenci istisna ile ilkenin kendisini birbirine karıştırıp devri ilkenin uygulanması sanır. Doğrusu: işyeri devri, tarafların iradesi dışında üçüncü kişiye (devralana) etki doğurduğu için tam olarak nispiliğin istisnasıdır."},"B":{"ad":"Nispiliğin Mutlaklığı Tuzağı","metin":"öğrenci nispilik ilkesini istisnasız mutlak sanıp işyeri devrinde de üçüncü kişiye etki doğmayacağını düşünür. Doğrusu: işyeri/işletme devri, nispilik ilkesinin açık istisnalarından biridir; devralan işçinin sözleşmesine halef olur."}},"celdiriciYol":null,"hap":"Esaslı neden olmadan zincirleme yapılan belirli süreli sözleşme başlangıçtan itibaren belirsiz süreli sayılır ve işyeri devrinde devralan bu sözleşmeye devreden ile birlikte taraf olur.","teshis":{"C":{"gercek":"İş K. m.11 esaslı bir neden olmadıkça birden fazla üst üste belirli süreli sözleşme yapılamayacağını, aksi halde sözleşmenin başlangıçtan itibaren belirsiz süreli sayılacağını açıkça düzenler.","ayirt":"Zincirleme sözleşmenin arkasında esaslı bir neden var mı?","paragraf":"İş K. m.11","yanilgi":"Esaslı neden şartını atlayıp her zincirleme sözleşmenin belirli süreli kalacağını sanıyorsun."},"E":{"gercek":"İşletmenin/iş yerinin devrinde devralan işçi sözleşmelerine halef olur, ancak devreden işveren ile birlikte sorumluluk kural olarak devam eder.","ayirt":"Devir, sorumluluğu devralana mı devrediyor yoksa devredenle birlikte mi sürdürüyor?","paragraf":"Nispilik ilkesi istisnası - işletme devri (birlikte sorumluluk)","yanilgi":"Devirle devredenin tüm sorumluluğunun bittiğini, sadece devralanın sorumlu kalacağını sanıyorsun."},"A":{"gercek":"İş K. m.11 esaslı neden aranan zincirleme belirli süreli sözleşmeyi düzenler; nispilik ilkesinin istisnaları arasında işletme/iş yeri devri de sayılır ve devralanın işçi sözleşmesine halef olması bunun sonucudur.","ayirt":"Bu olayda birden fazla kural birlikte mi işliyor, yoksa tek kural mı yeterli?","paragraf":"İş K. m.11; nispilik ilkesi istisnaları","yanilgi":"Bu şıkkı eleyen, iki kuralın (zincirleme sözleşme + işyeri devri) aynı olayda birlikte uygulanabileceğini fark edemez, birini tek başına yeterli sanır."},"D":{"gercek":"Kural, sözleşmenin taraflarını bağlar; devralanın taraf olmayan bir sözleşmeden etkilenmesi tam olarak nispiliğin istisnasıdır, ilkenin uygulanması değildir.","ayirt":"Bu sonuç ilkenin kendisinden mi, yoksa ilkeye getirilen istisnadan mı doğuyor?","paragraf":"Nispilik ilkesi ve istisnaları","yanilgi":"İstisna ile ilkenin kendisini birbirine karıştırıp devri ilkenin doğal sonucu sanıyorsun."},"B":{"gercek":"Nispilik ilkesinin sekiz istisnasından biri işletmenin/iş yerinin devridir; devralan işçilerin sözleşmesine taraf olur.","ayirt":"Bu ilkenin istisnası olan bir hal mi var, yoksa saf nispilik mi uygulanıyor?","paragraf":"Nispilik ilkesi istisnası - işletme devri","yanilgi":"Nispilik ilkesini mutlak sanıp hiçbir hâlde üçüncü kişiye etki doğmayacağını düşünüyorsun."}},"verilen":[],"donem":5,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 53"},"kural":"41 inci madde ikinci fıkrasına göre (a) bendinde bulunanlar için oran %32\u0027dir; üçüncü fıkranın (b) bendine göre (i) bendine göre borçlananlar 4/1-a\u0027ya göre sigortalılık süresi sayılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 53","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Borçlanma sorularında önce \u0027bu kişi borçlanmadan önce hangi bentteydi\u0027 diye sor, oran ve statü ona göre birlikte belirlenir.","konu":"hizmet borçlanması","tablo":{"satirlar":[["VERİLENLER","-","-"],["Kanunun maddesi","41","-"],["HESAP","-","-"],["A) Borçlanma tutarı, seçilecek günlük kazancın %45\u0027i üzerin…","p.41/2, p.41/3-b","YANLIŞ ifade"],["B) Borçlanma tutarı, seçilecek günlük kazancın %32\u0027si üzeri…","p.41/2, p.41/3-b","doğru ifade"],["C) Borçlanma tutarı, seçilecek günlük kazancın %45\u0027i üzerin…","p.41/2","YANLIŞ ifade"],["D) Borçlanma tutarı, seçilecek günlük kazancın %32\u0027si üzeri…","p.41/3-b","YANLIŞ ifade"],["E) Çocuğunun yaşaması şartı arandığından borçlanma tutarı %…","p.41/1-b dipnot 65","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Borçlanma tutarı, seçilecek günlük kazancın %45\u0027i üzerinden hesaplanır ve borçlanılan süre 4 üncü maddenin birinci fıkrasının (a) bendine göre sigortalılık süresi sayılır","E":"Çocuğunun yaşaması şartı arandığından borçlanma tutarı %39 oranı üzerinden hesaplanır","A":"Borçlanma tutarı, seçilecek günlük kazancın %45\u0027i üzerinden hesaplanır ve borçlanılan süre 4 üncü maddenin birinci fıkrasının (c) bendine göre değerlendirilir","D":"Borçlanma tutarı, seçilecek günlük kazancın %32\u0027si üzerinden hesaplanır ve borçlanılan süre 4 üncü maddenin birinci fıkrasının (c) bendine göre değerlendirilir","B":"Borçlanma tutarı, seçilecek günlük kazancın %32\u0027si üzerinden hesaplanır ve borçlanılan süre 4 üncü maddenin birinci fıkrasının (a) bendine göre sigortalılık süresi sayılır"},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.41 [1/3]","metin":"MADDE 41- Bu Kanuna göre sigortalı sayılanların; a) (Değişik: 10/9/2014-6552/43 md.) Kanunları gereği verilen ücretsiz doğum ya da analık izni süreleri ile 4 üncü maddenin birinci fıkrasının (a), (b) ve (c) bentleri kapsamındaki sigortalı kadının, üç defaya mahsus olmak üzere doğum tarihinden sonra iki yıllık süreyi geçmemek kaydıyla borçlanılacak sürelerde uzun vadeli sigorta kolları açısından sigortalı sayılmaması ve çocuğunun yaşaması şartlarıyla talepte bulunulan süreleri, b) Er veya erbaş olarak silâh altında veya yedek subay, yedek astsubay okulunda geçen süreleri,65 c) 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında olanların, personel mevzuatına göre aylıksız izin süreleri, d) Sigortalı olmaksızın doktora öğrenimi veya tıpta uzmanlık için yurt içinde veya yurt dışında geçirdikleri normal doktora veya uzmanlık öğrenim süreleri, e) Sigortalı olmaksızın avukatlık stajını yapanların normal staj süreleri, f) Sigortalı iken herhangi bir suçtan tutuklanan veya gözaltına alınanlardan bu suçtan dolayı beraat edenlerin tutuklulukta veya gözaltında geçen süreleri, g) Grev ve lokavtta geçen süreleri (…)66, h) Hekimlerin fahrî asistanlıkta geçen süreleri, ı) Seçim kanunları gereğince görevlerinden istifa edenlerin, istifa ettikleri tarih ile seçimin yapıldığı tarihi takip eden ay başına kadar açıkta geçirdikleri süreleri, i) (Ek: 13/2/2011-6111/30 md.) Bu bendin yürürlüğe girdiği tarihten sonraki sürelere ilişkin olmak üzere, 4857 sayılı Kanuna göre kısmi süreli iş sözleşmesi ile çalışan sigortalıların, kısmi süreli çalıştıkları aylara ait eksik süreleri, j) (Ek: 4/7/201…"},{"ad":"5510 s. SGK Kanunu m.41 [2/3]","metin":"dönenlerden yükümlü bulunduğu mecburi hizmet süresini tamamlamış olanların, yurt dışında resmî öğrenci olarak geçirmiş oldukları öğrenim sürelerinin 18 yaşının tamamlanmasından sonraki döneme ait olan kısmı, kendilerinin veya hak sahiplerinin yazılı talepte bulunmaları ve talep tarihinde 82 nci maddeye göre belirlenen prime esas günlük kazanç alt ve üst sınırları arasında olmak üzere, kendilerince belirlenecek günlük kazancın (a) bendinde bulunanlar için %32’si diğerleri için %45’i üzerinden hesaplanacak primlerini borcun tebliği tarihinden itibaren bir ay içinde ödemeleri şartı ile borçlandırılarak, borçlandırılan süreleri sigortalılıklarına sayılır. (Ek cümle: 13/2/2011-6111/30 md.) (i) bendi kapsamında borçlanılacak sürelere ilişkin genel sağlık sigortası primlerinin ödenmiş olması halinde, genel sağlık sigortası primi ödenmiş bu 25/6/2019 tarihli ve 7179 sayılı Kanunun 62 nci maddesiyle; bu bende “yedek subay” ibaresinden sonra gelmek üzere “, yedek astsubay” ibaresi eklenmiştir. 66 17/4/2008 tarihli ve 5754 sayılı Kanunun 67 nci maddesiyle; bu bentte yer alan “ve Kurumca kabul edilecek sektörel veya genel ekonomik kriz dönemlerinde işvereni tarafından ücretsiz izinli sayılanların, her yıl için 3 ayı geçmemek üzere bu süreleri” ibaresi yürürlükten kaldırılmıştır. 65 sürelere ilişkin borçlanma tutarı %39 oranı üzerinden hesaplanır. 67 Bir ay içinde ödenmeyen borçlanmalar için ise yeni başvuru şartı aranır. Primi ödenmeyen borçlanma süreleri hizmetten sayılmaz. Borçlanma sürelerinin ne şekilde belgeleneceğini belirlemeye Kurum yetkilidir. Bu Kanuna göre tespit edilen sigo…"}],"hakem":"Doğru sık, 5510 sayılı Kanunun 41. maddesinin 2. fıkrasında açıkça yer alan %32 oranı ve 3. fıkranın (i) bendinde belirtilen 4/1-a statüsü kurallarına dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"%45 oranı kısmi süreli çalışanlara değil, sigortalı olmayan başka kişilere uygulanır; doğru oran %32\u0027dir.","E":"%39 oranı ve çocuk şartı sadece doğum borçlanmasına ilişkindir, kısmi süreli çalışma borçlanmasında uygulanmaz.","D":"Oran doğru ama (c) bendi aylıksız izine özgüdür; kısmi süreli çalışan (a) bendine göre değerlendirilir.","A":"Kısmi süreli çalışan zaten normal sigortalı olduğu için %45 oranı ve (c) bendi uygulanmaz; bunlar sadece diğer kişiler ve aylıksız izin için geçerlidir."},"dogru":"Kısmi süreli çalışan eksik günlerini borçlanırken seçtiği günlük kazancın %32\u0027si üzerinden prim öder ve bu süre normal çalışan olarak sigortalılık süresi sayılır. Yasa bunu kısmi süreli çalışanlar için özel olarak belirlemiştir.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 41. madde ikinci fıkrasının (i) bendi ve üçüncü fıkrasının (i) bendine göre.","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 41. madde","tanim":"Çalışanın, sigortalı olarak sayılmayan ancak belirtilen dönemlerdeki eksik gün veya sürelerine ilişkin primini ödeyerek bu süreleri sigortalılık süresi olarak kabul ettirebilmesidir.","ad":"Borçlanma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/1","2019/3","2016/1"]},"oyun":null,"tip":"teori","soru":"4857 sayılı Kanuna göre kısmi süreli iş sözleşmesiyle çalışan sigortalının, kısmi süreli çalıştığı aylara ait eksik günlerini 5510 sayılı Kanunun 41 inci maddesine göre borçlanması hakkında aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-07","verilenler":[{"deger":"41","anlam":"5510 sayılı Kanunda sigortalıların eksik gün borçlanması işlemlerinin usulünü belirleyen hüküm.","ad":"Kanunun maddesi"}],"dayanak":"5510 sayılı Kanun m.41/2 ve m.41/3-b","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Zeynep, bir mağazada haftada 3 gün, günde 4 saat çalışıyor. 2023 yılında 4857 sayılı Kanuna göre kısmi süreli iş sözleşmesiyle çalıştığı aylarda ayda 12 gün eksik kalmış, toplam 96 gün eksik gün birikmiş. Zeynep bu 96 günü 5510 sayılı Kanunun 41 inci maddesine göre borçlanmak istiyor, SGK\u0027ya dilekçe veriyor.","anlatim":"Zeynep\u0027in eksik günleri kısmi süreli çalışmadan kaynaklanıyor, bu tam olarak 41 inci madde birinci fıkra (i) bendinin durumu. SGK ona iki şey söyleyecek: hangi oranla ödeyeceği ve bu sürenin hangi statüde sayılacağı.","doldur":[]},{"formul":"Ne yapacağız: Zeynep\u0027in 96 günü için SGK, seçtiği günlük kazancın yüzde kaçını isteyecek ve bu günleri 4 üncü maddenin hangi bendine göre değerlendirecek, beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Madde ikinci fıkrada oranı ikiye ayırıyor: (a) bendinde bulunanlar %32, diğerleri %45. Üçüncü fıkrada da (i) bendi borçlanması 4/1-a\u0027ya bağlanıyor; şimdi A\u0027dan E\u0027ye sırayla bakalım.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"p.41/2, p.41/3-b","karar":"yanlış","anlatim":"Zeynep kısmi süreli işçi, yani zaten 4/1-a sigortalısı; oranı %45 değil %32 olur. Üstelik (i) bendi borçlananlar hiçbir zaman 4/1-c\u0027ye değil 4/1-a\u0027ya bağlanır.","formul":"Şık A: SGK memuru Zeynep\u0027e \u0027oranın %45, statün de 4/1-c olacak\u0027 diyor, bu doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"p.41/2, p.41/3-b","karar":"doğru","anlatim":"Zeynep\u0027in kısmi süreli çalışması onu (a) bendinde bulunan kişi yapar, madde ikinci fıkraya göre oran %32\u0027dir. Üçüncü fıkra da (i) bendini açıkça 4/1-a\u0027ya bağlar, yani bu ifade tam uyuyor.","formul":"Şık B: SGK memuru Zeynep\u0027e \u0027%32 ödeyeceksin, süre 4/1-a sayılacak\u0027 diyor, bu doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"p.41/2","karar":"yanlış","anlatim":"Statü kısmı doğru ama oran yanlış; Zeynep (a) bendinde sayıldığı için %32 uygulanır, %45 sadece (a) dışındakilere.","formul":"Şık C: SGK memuru \u0027%45 ödeyeceksin ama statün 4/1-a olacak\u0027 diyor, bu doğru mu?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"p.41/3-b","karar":"yanlış","anlatim":"Oran doğru ama statü yanlış; (c) ve (ı) bentleri 4/1-c\u0027ye gider, ama Zeynep\u0027in dayandığı (i) bendi ayrıca 4/1-a\u0027ya gider.","formul":"Şık D: SGK memuru \u0027%32 ödeyeceksin, statün 4/1-c olacak\u0027 diyor, bu doğru mu?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"p.41/1-b dipnot 65","karar":"yanlış","anlatim":"Çocuk şartı sadece doğum borçlanmasına ait, %39 oranı da er-erbaşlık borçlanmasına özgü; Zeynep\u0027in kısmi süreli borçlanmasında bunların hiçbiri aranmaz.","formul":"Şık E: SGK memuru \u0027çocuğun yaşaması şartı var, oran %39\u0027 diyor, bu doğru mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Zeynep zaten kısmi süreli çalışırken 4/1-a sigortalısıydı, borçlanma bu statüyü ve %32 oranını değiştirmedi. Kendine sor: bu kişi borçlanmadan önce hangi bentte sigortalıydı, yoksa hiç sigortalı değil miydi?","doldur":[]}],"anahtar":[{"ornek":"bendine","kok":"bendin"},{"ornek":"borçlanmasında","kok":"borçla"},{"ornek":"zeynep","kok":"zeynep"},{"ornek":"sigortalılık","kok":"sigort"},{"ornek":"süreli","kok":"süreli"},{"ornek":"ikinci","kok":"ikinci"}],"konuGiris":{"harita":"Ne zaman borçlanılır: kısmi süreli çalışılan aylardaki eksik günler için. Nasıl hesaplanır: seçilen günlük kazancın belirli yüzdesi üzerinden. Nasıl kaydedilir: primi bir ay içinde ödenirse hizmetten sayılır, ödenmezse sayılmaz.","desen":"Sınav genelde bir ayda ödenmeyen borçlanmanın hizmetten sayılmayacağını ve yeniden başvuru gerektiğini sorar. Tuzak, borçlanılan sürenin hangi sigortalılık türüne (a bendi) sayılacağını karıştırmaktır. Bu soru m.41/i bendi ve bir aylık ödeme kuralı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"4857 sayılı Kanuna göre haftalık çalışma süresinin kısmen yapılması","ad":"Kısmi süreli çalışma","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"soruda verilir","tanim":"kısmi çalışılan ayda tam ayı tamamlamayan borçlanılabilir gün sayısı","ad":"Eksik gün","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"seçilen günlük kazancın belirlenen yüzdesi üzerinden hesaplanan tutar","ad":"Borçlanma primi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"borcun tebliğinden itibaren primin ödenmesi gereken süre","ad":"Bir aylık ödeme süresi","kim":"kanun sabitler"}],"sinavda":"Soru, kısmi süreli çalışan sigortalının eksik gün borçlanmasına ilişkin doğru kuralı seçmeyi ister.","panel_ornek":"Bir genç, part-time çalıştığı 3 ayda eksik kalan 10 günü sonradan parayla tamamlayıp emekliliğe saydırabiliyor. Bu, eksik günü sonradan \u0027satın alma\u0027 mantığıdır.","ornek":"Bir genç, part-time çalıştığı 3 ayda eksik kalan 10 günü sonradan parayla tamamlayıp emekliliğe saydırabiliyor. Bu, eksik günü sonradan \u0027satın alma\u0027 mantığıdır.","yontemler":"En kritik kural: borç bir ay içinde ödenmezse hizmetten sayılmaz ve yeni başvuru gerekir.","nedir":"Hizmet borçlanması, sigortalı sayılmayan ya da eksik geçen bazı sürelerin prim ödenerek hizmete katılmasıdır. Sınav, hangi sürenin borçlanılabileceğini ve borç priminin hangi orandan hesaplandığını ölçer."},"olay":"kısmi süreli çalışan zaten 4/1-a kapsamındadır, bu nedenle %32 oranı ve (a) statüsü birlikte uygulanır.","tuzak":{"C":{"ad":"Oran Genelleme Tuzağı","metin":"statüyü doğru bulup \u0027sigortalı olmayanlar\u0027 için öngörülen %45 oranını, zaten 4/1-a sigortalısı olan kısmi süreli çalışana uyguladın. Doğrusu: (i) bendi kapsamındakiler %32 oranına tabidir, %45 yalnız (a) bendi dışında kalanlar içindir."},"E":{"ad":"Farklı Bent Yükleme Tuzağı","metin":"doğum borçlanmasına özgü %39 oranını ve çocuğun yaşaması şartını, kısmi süreli çalışma borçlanmasına taşıdın. Doğrusu: %39 oranı yalnız er-erbaşlık ile yedek subaylık borçlanmasına, çocuk şartı yalnız doğum borçlanmasına ilişkindir."},"D":{"ad":"Statü Karıştırma Tuzağı","metin":"oranı doğru bulmana rağmen istatü ataması için (c) bendini seçtin; oysa (c) bendi aylıksız izin borçlanmasına özgüdür. Doğrusu: (i) bendine göre borçlananlar 4/1-a bendine göre sigortalılık süresi sayılır."},"A":{"ad":"Bent Karıştırma Tuzağı","metin":"(ı) bendindeki seçim nedeniyle istifa borçlanmasının statüsünü ve \u0027diğerleri\u0027 oranını (i) bendine uyguladın. Doğrusu: (i) bendi borçlananlar zaten 4/1-a sigortalısıdır, %32 oranı ve (a) statüsü uygulanır."}},"celdiriciYol":null,"hap":"Kısmi süreli çalışma borçlanmasında (i bendi) oran %32\u0027dir ve süre 4/1-a bendine göre sigortalılık süresi sayılır; çünkü kişi zaten (a) bendi sigortalısıdır.","teshis":{"C":{"gercek":"Madde metni oranı ikiye ayırır: (a) bendinde bulunanlar %32, diğerleri %45; kısmi süreli çalışan (a) bendindedir.","ayirt":"Bu kişi (a) bendinde mi yoksa (a) dışında mı sayılıyor?","paragraf":"5510 s.K m.41/2","yanilgi":"%45 oranının yalnız hiç sigortalılığı olmayanlara ait olduğunu unutup genel oran sanırsın."},"E":{"gercek":"%39 oranı yalnız er-erbaşlık ve yedek subaylık/astsubaylık süresi borçlanmasına, çocuk şartı yalnız doğum borçlanmasına ilişkindir; kısmi süreli borçlanmada bu şartlar aranmaz.","ayirt":"Bu oran hangi bendin dipnotunda geçiyor, olayımdaki bent bu mu?","paragraf":"5510 s.K m.41/1-b dipnot 65","yanilgi":"Kanunda geçen tek özel oranın (%39) her borçlanmaya uygulandığını sanırsın."},"A":{"gercek":"41 inci madde üçüncü fıkrası her bendi ayrı statüye bağlar; (c) ve (ı) bentleri 4/1-c\u0027ye, (i) bendi 4/1-a\u0027ya gider.","ayirt":"Bu süre hangi bende dayanıyor, o bent hangi statüye yönlendiriliyor?","paragraf":"5510 s.K m.41/3-b","yanilgi":"Bütün borçlanma türlerinin aynı statüye bağlandığını sanıyorsun."},"D":{"gercek":"Üçüncü fıkranın (b) bendi yalnız (c) ve (ı) bentlerini 4/1-c\u0027ye bağlar; (i) bendi ayrıca 4/1-a\u0027ya bağlanır.","ayirt":"Bu bent (b) fıkrasının hangi cümlesinde sayılıyor?","paragraf":"5510 s.K m.41/3-b","yanilgi":"Oranı tutturunca statüyü de doğru sandığın için kontrol etmeyi bırakırsın."},"B":{"gercek":"41 inci madde ikinci fıkrasında (a) bendinde bulunanlar için oran %32\u0027dir; üçüncü fıkrada (i) bendi borçlananlar 4/1-a\u0027ya göre değerlendirilir.","ayirt":"Bu kişi borçlanmadan önce de 4/1-a sigortalısı mıydı?","paragraf":"5510 s.K m.41/2, m.41/3-b","yanilgi":"Kısmi süreli çalışanın zaten sigortalı olduğunu, borçlanmanın yalnız eksik günü tamamladığını gözden kaçırırsın."}},"verilen":[[1,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 112"},"kural":"İş Kanunu m.5 son fıkraya göre işçi ihlal ihtimalini güçlü biçimde gösteren bir durumu ortaya koyarsa ispat yükü işverene geçer.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 112","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde birden fazla sayı (dört ay, sekiz ay gibi) geçen sorularda hangi sayının hangi hükme ait olduğunu maddeyi tekrar okuyarak eşleştir.","konu":"sendikal guvenceler","tablo":{"satirlar":[["A) İşçi, ihlalin varlığı ihtimalini güçlü bir biçimde göste…","4857 sayılı İş Kanunu m.5, son fıkra","doğru ifade"],["B) İş ilişkisinde ayrımcılık iddiasında ispat yükü her koşu…","4857 sayılı İş Kanunu m.5, son fıkra","YANLIŞ ifade"],["C) Ayrımcılık nedeniyle işçinin talep edebileceği tazminat,…","4857 sayılı İş Kanunu m.5 ve m.7","YANLIŞ ifade"],["D) İşveren, esaslı sebepler bulunmasa dahi tam süreli çalış…","4857 sayılı İş Kanunu m.5, fıkra 2","YANLIŞ ifade"],["E) Cinsiyet veya gebelik nedeniyle farklı işlem yapma yasağ…","4857 sayılı İş Kanunu m.5, fıkra 3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Ayrımcılık nedeniyle işçinin talep edebileceği tazminat, yoksun bırakıldığı diğer haklardan ayrı olarak sekiz aya kadar ücreti tutarındadır.","E":"Cinsiyet veya gebelik nedeniyle farklı işlem yapma yasağı yalnızca iş sözleşmesinin kurulması aşamasında geçerlidir; sözleşmenin sona ermesinde bu yasak uygulanmaz.","A":"İşçi, ihlalin varlığı ihtimalini güçlü bir biçimde gösteren bir durumu ortaya koyduğunda, işveren böyle bir ihlalin mevcut olmadığını ispat etmekle yükümlü olur.","D":"İşveren, esaslı sebepler bulunmasa dahi tam süreli çalışan işçi karşısında kısmi süreli çalışan işçiye farklı işlem yapabilir.","B":"İş ilişkisinde ayrımcılık iddiasında ispat yükü her koşulda işçiye aittir; işçinin güçlü ihtimal gösteren bir durum ortaya koyması ispat yükünü işverene geçirmez."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.5","metin":"Madde 5 – (Ek: 6/2/2014-6518/57 md.) İş ilişkisinde dil, ırk, renk, cinsiyet, engellilik, siyasal düşünce, felsefî inanç, din ve mezhep ve benzeri sebeplere dayalı ayrım yapılamaz. İşveren, esaslı sebepler olmadıkça tam süreli çalışan işçi karşısında kısmî süreli çalışan işçiye, belirsiz süreli çalışan işçi karşısında belirli süreli çalışan işçiye farklı işlem yapamaz. İşveren, biyolojik veya işin niteliğine ilişkin sebepler zorunlu kılmadıkça, bir işçiye, iş sözleşmesinin yapılmasında, şartlarının oluşturulmasında, uygulanmasında ve sona ermesinde, cinsiyet veya gebelik nedeniyle doğrudan veya dolaylı farklı işlem yapamaz. Aynı veya eşit değerde bir iş için cinsiyet nedeniyle daha düşük ücret kararlaştırılamaz. İşçinin cinsiyeti nedeniyle özel koruyucu hükümlerin uygulanması, daha düşük bir ücretin uygulanmasını haklı kılmaz. İş ilişkisinde veya sona ermesinde yukarıdaki fıkra hükümlerine aykırı davranıldığında işçi, dört aya kadar ücreti tutarındaki uygun bir tazminattan başka yoksun bırakıldığı haklarını da talep edebilir. 2821 sayılı Sendikalar Kanununun 31 inci maddesi hükümleri saklıdır. 20 nci madde hükümleri saklı kalmak üzere işverenin yukarıdaki fıkra hükümlerine aykırı davrandığını işçi ispat etmekle yükümlüdür. Ancak, işçi bir ihlalin varlığı ihtimalini güçlü bir biçimde gösteren bir durumu ortaya koyduğunda, işveren böyle bir ihlalin mevcut olmadığını ispat etmekle yükümlü olur. İşyerinin veya bir bölümünün devri"},{"ad":"TTK (6102 s.K.) m.478","metin":"MADDE 478- (1) İlk esas sözleşme ile veya esas sözleşme değiştirilerek bazı paylara imtiyaz tanınabilir. (2) İmtiyaz; kâr payı, tasfiye payı, rüçhan ve oy hakkı gibi haklarda, paya tanınan üstün bir hak veya kanunda öngörülmemiş yeni bir pay sahipliği hakkıdır. (3) 360 ıncı madde hükmü saklıdır. (4) (Ek: 26/6/2012-6335/25 md.) Sermayesinin yarısından fazlası tek başına veya birlikte; Devlet, il özel idaresi, belediye ve diğer kamu tüzel kişileri, sendikalar, dernekler, vakıflar, kooperatifler ve bunların üst kuruluşlarına ait anonim şirketlerde ve bu şirketlerin aynı oranda sermaye payına sahip oldukları iştiraklerinde; bunların sahip oldukları paylara tesis edilebilecek imtiyazlar hariç olmak üzere, diğer paylara, belirli bir grup oluşturan pay sahiplerine, belirli pay gruplarına ve azlığa bu Kanunda düzenlenen herhangi bir imtiyaz tesis edilemez. Bu hüküm, payları borsada işlem gören anonim şirketlere, 5411 sayılı Kanunun 3 üncü maddesinde tanımlanan kredi kuruluşlarına ve finansal kuruluşlara uygulanmaz. II - Oyda imtiyazlı paylar"}],"hakem":"İş Kanunu m.5 son fıkrası, sendikal ayrımcılık da dahil olmak üzere ayrımcılık iddiasında işçi güçlü ihtimal karinesini gösterdiğinde ispat yükünün işverene geçmesi kuralını açıkça içermektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Ayrımcılık tazminatı dört aya kadar ücreti tutarındadır; sekiz aylık tutar
