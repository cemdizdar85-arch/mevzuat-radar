metin":"teşmilin sona ermesinin ayrı bir Cumhurbaşkanı kararına bağlı olduğunu düşünüyorsun. Doğrusu: m.40/7 gereği yeni toplu iş sözleşmesi yapılmasıyla teşmil uygulaması kendiliğinden sona erer."},"D":{"ad":"Çift Kural Atlama Tuzağı","metin":"hem yetki başvurusunun teşmili etkilemediğini hem de Yüksek Hakem Kurulu görüşünün gerekmediğini birlikte varsayıyorsun. Doğrusu: yetki süreci teşmili engeller ve karar öncesi Yüksek Hakem Kurulu görüşü alınması zorunludur."},"B":{"ad":"Onay Atlama Tuzağı","metin":"teşmil kararının yalnız yetki durumuna bağlı olduğunu, Yüksek Hakem Kurulu görüşünün her halde gerekmediğini düşünüyorsun. Doğrusu: teşmil kararı zaten bu işyeri için hiç alınamaz, ayrıca m.40/1 gereği Yüksek Hakem Kurulu görüşü şarttır."}},"celdiriciYol":{},"hap":"Yetki için başvurulduktan sonra işlem tamamlanıncaya veya yetki belgesi devam ettiği sürece, kapsama giren işyerinde teşmil kararı alınamaz.","teshis":{"C":{"gercek":"m.40/2 yürürlük tarihinin yayım tarihinden önce olamayacağını düzenler.","ayirt":"Yürürlük tarihi yayım tarihinden önce olabilir mi?","paragraf":"m.40/2","yanilgi":"Teşmil kararının geçmişe etkili yayımlanabileceğini sanıyorsun."},"E":{"gercek":"m.40/7 yeni toplu iş sözleşmesi yapılmasıyla teşmilin kendiliğinden sona ereceğini söyler.","ayirt":"Yeni sözleşme yapıldığında teşmil otomatik mi biter?","paragraf":"m.40/7","yanilgi":"Teşmilin sona ermesinin ayrı bir idari karara bağlı olduğunu sanıyorsun."},"A":{"gercek":"m.40/6 yetki süreci devam eden işyerinde teşmil kararı alınmasını açıkça yasaklar.","ayirt":"Bu işyerinde şu an yetki süreci mi işliyor?","paragraf":"m.40/6","yanilgi":"Bu şıkkı eleyen öğrenci, yetki başvurusunun teşmil kararına engel olmadığını sanır."},"D":{"gercek":"Her iki kural da birlikte uygulanır: yetki süreci teşmili engeller, ayrıca Yüksek Hakem Kurulu görüşü şarttır.","ayirt":"Bu olayda hangi iki kural aynı anda devrede?","paragraf":"m.40/1,6","yanilgi":"Yetki sürecinin teşmile etkisiz olduğunu ve Yüksek Hakem Kurulu görüşünün gerekmediğini birlikte düşünüyorsun."},"B":{"gercek":"m.40/1 Cumhurbaşkanının teşmil kararı almadan önce Yüksek Hakem Kurulunun görüşünü alması zorunludur.","ayirt":"Karar öncesi hangi kurulun görüşü alınıyor?","paragraf":"m.40/1","yanilgi":"Teşmil kararının yürürlüğe girmesi için Yüksek Hakem Kurulu görüşünün şart olmadığını sanıyorsun."}},"verilen":[[1,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 107"},"kural":"Türk Borçlar Kanunu madde 408\u0027e göre işveren işgörme edimini kusuruyla engeller veya kabulde temerrüde düşerse işçiye ücretini öder ve edimin sonradan ifasını isteyemez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 107","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde \u0027ancak\u0027 bağlacından sonra gelen indirim kalemlerinin sayısını (giderler + kazanılan yarar + kaçınılan yarar) tek tek say, şıklardan biri eksik kalem sayıyorsa yanlıştır.","konu":"ücretin ise hasredilmesi","tablo":{"satirlar":[["A) İşveren, işgörme ediminin yerine getirilmesini kusuruyla…","TBK m.408","doğru ifade"],["B) İşçinin bu engelleme sebebiyle yapmaktan kurtulduğu gide…","TBK m.408","YANLIŞ ifade"],["C) İşçinin başka bir iş yaparak fiilen kazandığı yararlar ü…","TBK m.408","YANLIŞ ifade"],["D) İşveren, edimi kabulde temerrüde düşse dahi ücret ödeme …","TBK m.408","YANLIŞ ifade"],["E) İşveren işgörme edimini kabulde temerrüde düşerse, işçin…","TBK m.408","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşçinin başka bir iş yaparak fiilen kazandığı yararlar ücretinden indirilir; ancak kazanmaktan bilerek kaçındığı yararlar işverenin risk alanına girmediğinden indirim konusu yapılamaz.","E":"İşveren işgörme edimini kabulde temerrüde düşerse, işçinin bu sebeple yapmaktan kurtulduğu giderler ile başka iş yaparak kazandığı veya kazanmaktan bilerek kaçındığı yararların tamamı, işçinin ücretine ayrıca ilave edilir.","A":"İşveren, işgörme ediminin yerine getirilmesini kusuruyla engeller veya edimi kabulde temerrüde düşerse işçiye ücretini ödemekle yükümlüdür; ancak işçiden bu edimini daha sonra yerine getirmesini isteyemez.","D":"İşveren, edimi kabulde temerrüde düşse dahi ücret ödeme borcundan kurtulabilmek için işçiden bu edimin daha sonra ifasını talep edebilir.","B":"İşçinin bu engelleme sebebiyle yapmaktan kurtulduğu giderler ücretinden indirilir; ancak başka bir işte çalışarak elde ettiği kazanç, işverenin edimini ifa etmemesinden bağımsız bir hukuki ilişkiden doğduğu için ücretten indirilemez."},"kaynak":{"alinti":"","liste":[{"ad":"TBK (6098 s.K.) m.408","metin":"MADDE 408- İşveren, işgörme ediminin yerine getirilmesini kusuruyla engellerse veya edimi kabulde temerrüde düşerse, işçiye ücretini ödemekle yükümlü olup, işçiden bu edimini daha sonra yerine getirmesini isteyemez. Ancak, işçinin bu engelleme sebebiyle yapmaktan kurtulduğu giderler ile başka bir iş yaparak kazandığı veya kazanmaktan bilerek kaçındığı yararlar ücretinden indirilir. b. İşçinin çalışmayı durdurması hâlinde"}],"hakem":"Soru, TBK m.408\u0027de düzenlenen işveren temerrüdünde ücret ödeme yükümlülüğü ve edimin sonradan ifasının istenelemeyeceği kuralını doğru olarak soruyor ve A şıkkı kaynaktan tamamen desteklenen bu kuralı yansıtıyor."},"kayitlar":[],"sade":{"siklar":{"C":"Yanınız: sadece fiilen kazandığı parayı indirim kalemi saydınız, bilerek kaçındığı yararı işverenin sorumluluğu dışı gördünüz. Doğrusu: bilerek kaçınılan yararlar da indirim konusudur.","E":"Yanınız: indirim kalemlerini işçi lehine ek ödeme sandınız. Doğrusu: kurtulduğu giderler ve başka işten kazandığı yararlar ücretTEN indirilir, ücrete EKLENMEz.","D":"Yanınız: temerrüde düşen işverenin ücret ödemekten kurtulmak için edimin sonradan ifasını talep edebileceğini düşündünüz. Doğrusu: kanun işverene bu hakkı tanımaz.","B":"Yanınız: işçinin başka işten kazandığı parayı ayrı bir ilişki sayıp indirim dışı bıraktınız. Doğrusu: hem kurtulduğu giderler hem başka işten elde edilen kazanç birlikte ücretten indirilir."},"dogru":"İşveren işi kabulde temerrüde düşerse işçiye ücret ödemek zorundadır. İşçi bu dönemde yaptığı başka işten kazandığı para veya giderleri azaltmışsa ücretinden indirilir. İşveren, işçiden geçmiş edimi sonradan yerine getirmesini isteyemez.","sinav":"Türk Borçlar Kanunu 408. madde","kavramlar":[{"kaynak":"Türk Borçlar Kanunu 408. madde","tanim":"İşveren işçinin çalışmasını kusuruyla engellemesi veya işçiyi çalıştırmamak suretiyle işgörme edimini kabulde gecikmesi durumudur.","ad":"işgörme ediminin kabulde temerrüt"},{"kaynak":"Türk Borçlar Kanunu 408. madde","tanim":"İşveren işgörme edimini kabulde temerrüde düştüğünde, işçinin bu dönemde yapmaktan kurtulduğu giderler ile başka iş yaparak kazandığı veya kazanmaktan kaçındığı yararlar ücretinden indirilmesidir.","ad":"ücretin işe hasredilmesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"6098 sayılı Türk Borçlar Kanunu\u0027na göre işverenin işgörme edimini kabulde temerrüdü ve ücretin işe hasredilmesi ile ilgili aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-zor/kp-23","verilenler":[],"dayanak":"6098 sayılı Türk Borçlar Kanunu madde 408","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir tekstil atölyesinde makine operatörü Hakan, 3 Mart 2024\u0027te işe geldiğinde patron kapıyı kilitli tutuyor ve \u0027sipariş azaldı, seni içeri almıyorum\u0027 diyor.","anlatim":"Hakan çalışmak istiyor ama işveren onu kabul etmiyor. Bu ay boyunca Hakan başka bir yerde günlük 200 lira kazanıyor. Aynı zamanda atölyeye gidip gelmek için harcayacağı 50 liralık yol parasından da kurtuluyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu madde 408\u0027e göre işveren temerrüde düşerse ücreti öder, edimin sonradan ifasını isteyemez; işçinin kurtulduğu gider ile kazandığı veya kazanmaktan bilerek kaçındığı yarar ücretten indirilir. Şimdi beş ifadeyi Hakan\u0027ın olayında tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TBK m.408","karar":"doğru","anlatim":"Hayır, patron ücreti öder ama geçmiş ayın işini sonradan Hakan\u0027dan isteyemez. Madde 408 bu talebi açıkça yasaklar.","formul":"Şık A: patron aylık ücreti öder ama \u0027gelecek ay bu ayın işini de yap\u0027 diyebilir mi, Hakan\u0027dan geçmişin edimini isteyebilir mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TBK m.408","karar":"yanlış","anlatim":"Hayır, kanun ikisini de aynı cümlede sayar, ikisi de indirim kalemidir. Başka işten kazanç ayrı ilişki olduğu için muaf tutulmaz.","formul":"Şık B: Hakan\u0027ın yol parasından kurtulması ücretinden düşülür de, başka yerde kazandığı 200 lira \u0027ayrı bir hukuki ilişki\u0027 diye görmezden gelinir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TBK m.408","karar":"yanlış","anlatim":"Hayır, kanun \u0027kazanmaktan bilerek kaçındığı\u0027 yararı da fiilen kazandığıyla eşit sayar. İkisi de indirilir, biri risk alanı dışında değildir.","formul":"Şık C: Hakan fiilen 200 lira kazanıyor ama komşu atölyedeki bir işi bilerek reddettiyse, o reddettiği kazanç hiç hesaba girmez mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TBK m.408","karar":"yanlış","anlatim":"Hayır, işveren temerrüde düşünce bu haktan zaten vazgeçmiş sayılır. Madde 408 böyle bir talep hakkı tanımaz.","formul":"Şık D: patron, ücreti ödemekten kurtulmak için \u0027Hakan bu işi bana sonradan yapsın\u0027 diyerek edimin ifasını talep edebilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TBK m.408","karar":"yanlış","anlatim":"Hayır, bu kalemler ücretten düşülen indirim kalemleridir, ücrete eklenen tutar değildir. Madde metninde fiil \u0027indirilir\u0027dir, \u0027ilave edilir\u0027 değildir.","formul":"Şık E: yol parasından kurtulma ve dışarıdan kazanç, Hakan\u0027ın ücretine ayrıca eklenen bir bonus müdür?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"İşveren temerrüde düşerse ücreti öder, geçmişin işini isteyemez, ama kurtulunan gider ile kazanılan ya da bilerek kaçınılan yarar ücretten indirilir. Kendine hep şunu sor: kanun \u0027indirilir\u0027 mi diyor \u0027ilave edilir\u0027 mi diyor?","doldur":[]}],"anahtar":[{"ornek":"indirilir","kok":"indiri"},{"ornek":"İşveren","kok":"İşvere"},{"ornek":"edimini","kok":"edimin"},{"ornek":"temerrüde","kok":"temerr"},{"ornek":"isteyemez","kok":"isteye"},{"ornek":"ücretini","kok":"ücreti"}],"konuGiris":{"harita":"Ne zaman test edilir: işveren işçinin çalışmasını kusuruyla engellediğinde veya kabulde temerrüde düştüğünde test edilir. Nasıl ölçülür: işçinin bu süre için ücrete hak kazanıp kazanmadığı ve hangi kalemlerin indirileceği ölçülür. Nasıl kaydedilir: işçiye ödenecek net ücret, tasarruf edilen giderler ve başka işten kazanılan/kaçınılan yararlar düşülerek hesaplanır.","desen":"Sınav, işçinin sonradan çalışmasını isteyip isteyemeyeceği ile ücretin tam mı yoksa indirimli mi ödeneceğini karıştırarak sorar. Tuzak, \u0027ücret hiç ödenmez\u0027 veya \u0027edim sonradan istenebilir\u0027 gibi yanlış seçeneklerle kurulur. Bu soru m.408 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İşverenin işçinin çalışmasını kusuruyla kabul etmemesi durumu","ad":"İşgörme ediminin kabulde temerrüdü","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İşverenin temerrüt süresinde işçiye ücret ödeme borcu","ad":"Ücret ödeme yükümlülüğü","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"İşçinin çalışmadığı için yapmaktan kurtulduğu masraflar","ad":"Tasarruf edilen giderler","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"soruda verilir","tanim":"İşçinin bu süre başka iş yaparak kazandığı veya kasten kaçındığı gelir","ad":"Başka işten kazanılan/kaçınılan yarar","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Soruda işverenin temerrüdü anlatılır ve işçinin ücret hakkının hangi kalemlerle sınırlı olacağı sorulur.","panel_ornek":"Bir kafede çalışırken patronun seni 3 gün eve gönderip gelme demesi gibi düşün; o gün gelmeni istemedi diye maaşından kesinti yapamaz. Ama sen o 3 günde başka bir yerde çalışıp 150 lira kazandıysan, bu 150 lira senin normal maaşından düşülür.","ornek":"Bir kafede çalışırken patronun seni 3 gün eve gönderip gelme demesi gibi düşün; o gün gelmeni istemedi diye maaşından kesinti yapamaz. Ama sen o 3 günde başka bir yerde çalışıp 150 lira kazandıysan, bu 150 lira senin normal maaşından düşülür.","yontemler":"Kritik kural: işveren edimi sonradan isteyemez, ancak işçinin tasarruf ettiği gider ile başka işten kazandığı/kaçındığı yarar ücretten indirilir.","nedir":"Bu konu, işverenin işçiyi çalıştırmayı kabulde temerrüde düşmesi durumunda ücretin ne olacağını düzenler. Sınav, bu durumda işçinin ücret hakkının devam edip etmediğini ve hangi kalemlerin bu ücretten düşüleceğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Fiili Kazanç Tuzağı","metin":"öğrenci sadece fiilen elde edilen kazancı indirim kalemi sanır, kazanmaktan bilerek kaçınılan yararı işverenin risk alanı dışında görür. Doğrusu: madde 408 kazanmaktan bilerek kaçınılan yararı da ücretten indirilecek kalemler arasında sayar."},"E":{"ad":"Yön Tersine Çevirme Tuzağı","metin":"öğrenci indirim kalemlerini ücrete ilave edilen kalemlerle karıştırır, kurtulunan gider ve elde edilen/kaçınılan yararı işçi lehine ek ödeme sanır. Doğrusu: bu kalemler ücrete ilave edilmez, tam tersine ücretten indirilir."},"D":{"ad":"Sonradan İfa Tuzağı","metin":"öğrenci temerrüde düşen işverenin, ücret borcundan kurtulmak için işçiden edimin sonradan yerine getirilmesini isteyebileceğini düşünür. Doğrusu: kanun işverene bu talep hakkını tanımaz, işveren ücreti ödemek zorundadır."},"B":{"ad":"Kısmi İndirim Tuzağı","metin":"öğrenci yalnız \u0027kurtulduğu giderler\u0027 kalemini indirim sanır, başka işten elde edilen kazancı ayrı bir hukuki ilişki sayıp indirim dışı bırakır. Doğrusu: madde 408 hem kurtulduğu giderleri hem başka iş yaparak kazandığı yararları birlikte indirim kalemi sayar."}},"celdiriciYol":{},"hap":"İşveren işgörme edimini kabulde temerrüde düşerse işçiye ücretini öder, edimin sonradan ifasını isteyemez; işçinin kurtulduğu giderler ile kazandığı veya kazanmaktan bilerek kaçındığı yararlar ise ücretten indirilir.","teshis":{"C":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"E":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"A":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"D":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""},"B":{"gercek":"","ayirt":"","paragraf":"","yanilgi":""}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 111"},"kural":"İş Kanunu m.26\u0027ya göre fesih hakkı, öğrenmeden itibaren 6 iş günü ve fiilin gerçekleşmesinden itibaren 1 yıl geçmedikçe kullanılabilir; süresi içinde fesheden tarafın diğer taraftan tazminat hakkı saklıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 111","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Süre sorularında önce hangi sürenin öğrenme gününden, hangisinin fiil tarihinden başladığını ayır, sonra tazminatın kime ait olduğunu madde cümlesinin öznesinden oku.","konu":"ücretin odenmemesi haklı fesih","tablo":{"satirlar":[["VERİLENLER","-","-"],["öğrenmeden feshe kadar geçen süre","5 iş günü","-"],["fiilden feshe kadar geçen süre","11 ay","-"],["ödenmeyen ücret dönemi","üç aylık ücret","-"],["HESAP","-","-"],["A) İşçi (A)\u0027nın feshi, hem 6 iş günlük hem de 1 yıllık süre…","m.26/I","doğru ifade"],["B) 6 iş günlük süre şartı yalnızca işveren tarafından yapıl…","m.26/I","YANLIŞ ifade"],["C) İşçi (A) ücretini alamayarak zarar gördüğünden olayda ma…","m.26/I","YANLIŞ ifade"],["D) 6 iş günlük süre, işçinin ihlali öğrendiği tarihten deği…","m.26/I","YANLIŞ ifade"],["E) Süresi içinde fesheden tarafın kendisi tazminat isteyeme…","m.26/son","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşçi (A) ücretini alamayarak zarar gördüğünden olayda maddi çıkar sağlama hali gerçekleşmiş sayılır ve bu nedenle 1 yıllık süre işçi (A)\u0027nın feshinde uygulanmaz.","E":"Süresi içinde fesheden tarafın kendisi tazminat isteyemez, madde yalnızca fesih yapılan tarafın tazminat hakkını korur; bu nedenle işçi (A) tazminat talep edemez.","A":"İşçi (A)\u0027nın feshi, hem 6 iş günlük hem de 1 yıllık süre koşulunu birlikte sağladığından haklı fesih niteliğindedir ve işçi (A)\u0027nın işverenden tazminat hakkı saklıdır.","D":"6 iş günlük süre, işçinin ihlali öğrendiği tarihten değil fiilin gerçekleştiği tarihten başlar; bu nedenle işçi (A)\u0027nın feshi 5 iş günlük süreye göre değerlendirilemez.","B":"6 iş günlük süre şartı yalnızca işveren tarafından yapılan fesihlerde uygulanır; işçi feshinde tek ölçü 1 yıllık süredir, bu nedenle işçi (A)\u0027nın feshi süre yönünden incelenemez."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.26","metin":"Madde 26 - 24 ve 25 inci maddelerde gösterilen ahlak ve iyiniyet kurallarına uymayan hallere dayanarak işçi veya işveren için tanınmış olan sözleşmeyi fesih yetkisi, iki taraftan birinin bu çeşit davranışlarda bulunduğunu diğer tarafın öğrendiği günden başlayarak altı iş günü geçtikten ve her halde fiilin gerçekleşmesinden itibaren bir yıl sonra kullanılamaz. Ancak işçinin olayda maddi çıkar sağlaması halinde bir yıllık süre uygulanmaz. Bu haller sebebiyle işçi yahut işverenden iş sözleşmesini yukarıdaki fıkrada öngörülen süre içinde feshedenlerin diğer taraftan tazminat hakları saklıdır. Yeni iş arama izni"}],"hakem":"Soru İş Kanunu m.26\u0027daki ücretin ödenmemesi halinde haklı fesih koşullarını doğru şekilde ölçmektedir; işçinin 5 iş günü ve 11 ay içinde feshetmesi her iki süre koşulunu sağladığından haklı fesih niteliğindedir ve tazminat hakkı saklıdır."},"kayitlar":[],"sade":{"siklar":{"C":"İşçinin ücretini alamamış olması maddi çıkar sağlama istisnaını (fiilin işleyeni koruyan kurala) dönüştürür sanılır; oysa istisna işçi tarafından kasıtlı çıkar sağlamayı ifade eder, mağduriyet farklıdır.","E":"Fesheden tarafın tazminat hakkı yoktur sanılır; oysa madde süresi içinde fesheden tarafın \u0027diğer taraftan tazminat hakları saklıdır\u0027 der ve işçi de bu hakka sahiptir.","D":"6 iş günlük süresi fiilin tarihinden başlar sanılır; oysa diğer tarafın ihlali ÖĞRENDİĞİ günden başlar, 1 yıllık süre için fiilin tarihi geçerlidir.","B":"6 iş günlük süresi yalnızca işveren feshine özgü sanılır; oysa madde işçi veya işveren feshlerinde aynı süreli koşulu her iki taraf için de uygulamıştır."},"dogru":"İşçi ücretin ödenmediğini öğrendiği günden 5 iş günü içinde, ayrıca olayın gerçekleşmesinden 11 ay içinde fesih yaptığından her iki süre koşulunu da sağlamıştır. Bu nedenle fesih haklıdır ve işçi işverenden tazminat isteyebilir.","sinav":"İş Kanunu 26. madde","kavramlar":[{"kaynak":"İş Kanunu 26. madde","tanim":"Ahlak ve iyiniyet kurallarına uymayan davranışlar nedeniyle kanunda tanınan belirli süreler içinde yapılan iş sözleşmesi feshidir; süre koşulları sağlanırsa fesih geçerli ve karşı taraftan tazminat isteme hakkı doğar.","ad":"haklı fesih"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"İşveren, işçi (A)\u0027nın üç aylık ücretini ödememiştir. İşçi (A), ücretinin ödenmediğini öğrendiği günden itibaren 5 iş günü, fiilin gerçekleştiği tarihten itibaren ise 11 ay sonra iş sözleşmesini haklı nedenle feshetmiştir. Bu bilgilere göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t2-issgk-cokzor/kp-11","verilenler":[{"deger":"5 iş günü","anlam":"6 iş günlük hak düşürücü süreyle karşılaştırılacak süredir; bu süre dolmadığı için fesih hakkı düşmemiştir.","ad":"öğrenmeden feshe kadar geçen süre"},{"deger":"11 ay","anlam":"1 yıllık hak düşürücü süreyle karşılaştırılacak süredir; bu süre de dolmadığı için fesih hakkı düşmemiştir.","ad":"fiilden feshe kadar geçen süre"},{"deger":"üç aylık ücret","anlam":"haklı fesih nedenini oluşturan ihlalin konusudur, süre hesabına doğrudan girmez.","ad":"ödenmeyen ücret dönemi"}],"dayanak":"İş Kanunu (4857 s.K.) m.26","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Kumaş fabrikasında işçi (B), 3 Ocak 2023\u0027te patronunun kendisine hakaret ettiğini öğrenir. Öğrendiği günden itibaren 4 iş günü sonra, olayın gerçekleştiği tarihten itibaren ise 8 ay sonra iş sözleşmesini haklı nedenle feshetmiştir.","anlatim":"","doldur":[]},{"formul":"Ne yapacağız: İş Kanunu m.26\u0027ya göre fesih hakkı, öğrenmeden itibaren 6 iş günü ve fiilin gerçekleşmesinden itibaren 1 yıl geçmedikçe kullanılabilir; işçi (B)\u0027nin 4 gün ve 8 ay olan süreleri bu iki sınırı da aşmadığından feshi haklıdır. Şimdi bu beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[5,1],[5,2]],"sik":"A","paragraf":"m.26/I","karar":"doğru","anlatim":"İşçi (B) 4 gün ve 8 ay içinde feshetmiş, yani her iki süre koşulu da sağlanmış. Madde 26 iki sınırı birlikte arar ve süresi içinde fesheden tarafın tazminat hakkını korur.","formul":"Şık A: birisi sana \u0027işçi (B) hem 6 iş günü hem 1 yıl sınırını aştığı için feshi haklıdır ve tazminat hakkı da saklıdır\u0027 derse, katılır mısın?"},{"doldur":[[6,1],[6,2]],"sik":"B","paragraf":"m.26/I","karar":"yanlış","anlatim":"Madde metni \u0027işçi veya işveren için tanınmış fesih yetkisi\u0027 der, ikisini ayırmaz. İşçi (B)\u0027nin feshi de aynı 6 gün ve 1 yıl kuralına tabidir.","formul":"Şık B: birisi sana \u00276 iş günlük süre sadece işveren feshinde uygulanır, işçi (B)\u0027nin feshi süre yönünden incelenemez\u0027 derse, katılır mısın?"},{"doldur":[[7,1],[7,2]],"sik":"C","paragraf":"m.26/I","karar":"yanlış","anlatim":"Maddi çıkar sağlama istisnası, ihlali yapan tarafın kendi eyleminden fayda sağlamasıdır. İşçi (B) burada mağdur, çıkar sağlayan değil.","formul":"Şık C: birisi sana \u0027işçi (B) hakarete uğrayarak zarar gördüğü için maddi çıkar sağlamış sayılır, 1 yıllık süre uygulanmaz\u0027 derse, katılır mısın?"},{"doldur":[[8,1],[8,2]],"sik":"D","paragraf":"m.26/I","karar":"yanlış","anlatim":"6 iş günlük süre öğrenme gününden başlar, işçi (B) hakareti öğrendiği 3 Ocak\u0027tan sayar. 1 yıllık süre ise fiil tarihinden başlar, ikisi farklı andan işler.","formul":"Şık D: birisi sana \u00276 iş günlük süre fiilin gerçekleştiği tarihten başlar, işçi (B)\u0027nin feshi bu süreye göre değerlendirilemez\u0027 derse, katılır mısın?"},{"doldur":[[9,1],[9,2]],"sik":"E","paragraf":"m.26/son","karar":"yanlış","anlatim":"Madde, süresi içinde fesheden tarafın DA diğer taraftan tazminat hakkının saklı olduğunu söyler. İşçi (B) fesheden taraf olduğu için hak ondadır.","formul":"Şık E: birisi sana \u0027süresinde fesheden işçi (B) kendisi tazminat isteyemez, hak sadece karşı tarafa aittir\u0027 derse, katılır mısın?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"İşçi (B) örneğinde gördüğün gibi iki süre birlikte kontrol edilir ve fesheden taraf tazminatını kaybetmez; kendine hep şunu sor: her iki süre de dolmamış mı?","doldur":[]}],"anahtar":[{"ornek":"fesheden","kok":"feshed"},{"ornek":"tarafın","kok":"tarafı"},{"ornek":"tazminat","kok":"tazmin"},{"ornek":"içinde","kok":"içinde"},{"ornek":"süresi","kok":"süresi"},{"ornek":"öğrenme","kok":"öğrenm"}],"konuGiris":{"harita":"Ne zaman test edilir: iki farklı fesih süresinin (öğrenme ve fiilin gerçekleşmesi) aynı olayda beraber işletilip işletilmediği sorulduğunda. Nasıl ölçülür: soruda verilen gün ve ay sayıları kanundaki üst sınırlarla karşılaştırılarak. Nasıl kaydedilir: sonuç \u0027süresinde fesih\u0027 ya da \u0027süre aşımı nedeniyle geçersiz fesih\u0027 şeklinde belirlenir.","desen":"Soru, öğrenme süresinin altı iş günü, olay süresinin bir yıl olduğunu ve bu iki sürenin birlikte işlediğini test eder. Tuzak, öğrenme süresinin aşılıp aşılmadığına bakılmadan sadece bir yıllık sürenin dolup dolmadığına odaklanmaktır. Bu soru m.26 hükmündeki iki ayrı sürenin birlikte değerlendirilmesi noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"diğer tarafın davranışı öğrendiği günden başlayan altı iş günlük hak düşürücü süre","ad":"öğrenme süresi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"fiilin gerçekleştiği tarihten itibaren işleyen bir yıllık azami süre","ad":"olay süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işçinin olayda maddi çıkar sağlaması halinde bir yıllık sürenin uygulanmaması","ad":"maddi çıkar istisnası","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"ahlak ve iyiniyet kurallarına aykırılık nedeniyle tanınan bildirimsiz derhal fesih yetkisi","ad":"haklı fesih","kim":"mahkeme ya da idare karar verir"}],"sinavda":"Öğrenme tarihinden ve fiilin gerçekleştiği tarihten itibaren geçen süreler verilir, feshin süresinde olup olmadığı istenir.","panel_ornek":"Kiraladığın evde ev sahibi sözleşmeyi bozmak istiyor; bunu öğrendiğin andan itibaren 6 gün, olay tarihinden itibaren 1 yıl içinde bildirmen gerekiyor diyelim. Sen öğrendiğin günden 3 gün, olaydan 8 ay sonra bildirsen sorun olmaz ama süreyi aşarsan hakkın düşer.","ornek":"Kiraladığın evde ev sahibi sözleşmeyi bozmak istiyor; bunu öğrendiğin andan itibaren 6 gün, olay tarihinden itibaren 1 yıl içinde bildirmen gerekiyor diyelim. Sen öğrendiğin günden 3 gün, olaydan 8 ay sonra bildirsen sorun olmaz ama süreyi aşarsan hakkın düşer.","yontemler":"Önce altı iş günlük öğrenme süresinin aşılıp aşılmadığına, sonra bir yıllık olay süresinin aşılıp aşılmadığına bakılır; ikisinden biri aşılmışsa fesih süresinde sayılmaz.","nedir":"Ücretin ödenmemesi, işçiye haklı nedenle fesih hakkı veren durumlardan biridir. Sınav, bu hakkın hangi süre içinde kullanılması gerektiğini ölçer."},"olay":"5 iş günü altı iş günü sınırını, 11 ay bir yıllık sınırı aşmamıştır.","tuzak":{"C":{"ad":"Maddi Çıkar İstisnası Tuzağı","metin":"mağdur tarafın zarar görmesi maddi çıkar sağlama sanılır. Doğrusu: istisna, fiili işleyen tarafın kendi davranışından çıkar sağlamasına ilişkindir; işçinin ücretini alamamış olması bu istisnayı doğurmaz."},"E":{"ad":"Tazminat Hakkı Tuzağı","metin":"madde metnindeki \u0027diğer taraf\u0027 ifadesi fesheden tarafı dışlıyor sanılır. Doğrusu: \u0027diğer taraftan tazminat hakları saklıdır\u0027 ibaresi, süresi içinde fesheden tarafın karşı taraftan tazminat isteyebileceğini gösterir."},"D":{"ad":"Başlangıç Anı Tuzağı","metin":"6 iş günlük sürenin fiilin gerçekleştiği tarihten başladığı düşünülür. Doğrusu: bu süre diğer tarafın ihlali ÖĞRENDİĞİ günden başlar; fiilin gerçekleştiği tarih sadece 1 yıllık sürenin başlangıcıdır."},"B":{"ad":"Süre Ayrımı Tuzağı","metin":"6 iş günlük sürenin sadece işveren fesihlerine özgü olduğu düşünülür. Doğrusu: madde metni \u0027işçi veya işveren\u0027 ayrımı yapmadan her iki tarafın feshi için aynı 6 iş günü ve 1 yıl ölçütünü birlikte uygular."}},"celdiriciYol":{},"hap":"İş Kanunu m.26\u0027daki 6 iş günlük ve 1 yıllık süreler işçi-işveren feshinde birlikte ve ayrı başlangıç anlarıyla (öğrenme/fiil) uygulanır; süresi içinde fesheden tarafın da tazminat hakkı saklıdır.","teshis":{"C":{"gercek":"Maddi çıkar sağlama istisnası, ihlali işleyen tarafın kendi eyleminden fayda sağlamasına ilişkindir; mağdur olan tarafa uygulanmaz.","ayirt":"Çıkar sağlayan taraf ihlali yapan mı, yoksa ondan zarar gören mi diye ayır.","paragraf":"m.26/I","yanilgi":"Zarar görmüş olan tarafın da maddi çıkar sağlamış sayılacağını sanırsın."},"E":{"gercek":"Madde, süresi içinde fesheden tarafın DA diğer taraftan tazminat hakkının saklı kaldığını düzenler; hak fesheden içindir.","ayirt":"\u0027Diğer taraftan tazminat hakları saklıdır\u0027 ifadesindeki \u0027diğer taraftan\u0027 kelimesi kimden alınacağını mı, kimin hakkı olduğunu mu gösteriyor diye oku.","paragraf":"m.26/son","yanilgi":"Tazminat hakkının sadece fesih yapılan (karşı) tarafa ait olduğunu, fesheden tarafın hak kazanamayacağını sanırsın."},"A":{"gercek":"İş Kanunu m.26, fesih hakkının kullanılabilmesi için hem 6 iş günlük hem 1 yıllık sürenin birlikte dolmamış olmasını arar; aksi halde fesih hakkı düşer.","ayirt":"Öğrenme tarihinden 6 iş günü VE fiil tarihinden 1 yıl, ikisi de dolmadı mı diye kendine sor.","paragraf":"m.26/I","yanilgi":"Süre koşulunun tek bir sınırla (ya öğrenme ya fiil tarihi) ölçüldüğünü, ikisinin birlikte arandığını fark etmeyen öğrenci bu şıkkı zayıf bulur."},"D":{"gercek":"Madde, 6 iş günlük süreyi \u0027diğer tarafın öğrendiği günden\u0027, 1 yıllık süreyi ise \u0027fiilin gerçekleşmesinden\u0027 başlatır; ikisinin başlangıç anı farklıdır.","ayirt":"Hangi sürenin öğrenme gününden, hangisinin fiil tarihinden başladığını ayrı ayrı say.","paragraf":"m.26/I","yanilgi":"6 iş günlük sürenin fiilin gerçekleştiği andan başladığını sanırsın, oysa bu 1 yıllık sürenin başlangıcıdır."},"B":{"gercek":"Madde 26, \u0027işçi veya işveren için tanınmış fesih yetkisi\u0027 ifadesiyle her iki tarafı da aynı süre rejimine bağlar.","ayirt":"Madde metni tarafları ayırıyor mu, yoksa \u0027işçi veya işveren\u0027 diye birlikte mi anıyor diye bak.","paragraf":"m.26/I","yanilgi":"6 iş günlük sürenin yalnızca işveren fesihlerine ait özel bir kural olduğunu sanırsın."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}}];

  const o=s.olcum||{}; const tip=s.tip||'teori'; const ders=String(s.ders||'');
  if(o.sim&&o.sim.dogru===false) return {k:'alarm',ad:'🔴 Alarm',neden:'Nöbetçi öğrencisi bu anlatımla ikizi çözemedi; dikkat ister'};
  if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}

   +(KUTU.kutu.length?KUTU.kutu.map(x=>{ const i=SORULAR.findIndex(s=>s.id===x.id); return '<div class="kutuSat"><div><b>'+esc(x.konu)+'</b> <span class="ipnot" style="display:inline">· '+(x.tur>=2?'2. tur (7 gün)':'1. tur (2 gün)')+' · '+gunStr(x.due)+'</span></div>'+(x.due<=t&&i>=0?'<button class="btn mavi kutuCoz" data-i="'+i+'">Şimdi çöz</button>':'')+'</div>'; }).join(''):'<p class="ipnot">Kutu boş. Yanlış yaptığın her soru buraya düşer ve 2 gün sonra geri gelir.</p>')
   +'<div class="btnrow" style="margin-top:14px"><button class="btn" id="kutuIleri">⏩ Demo: 2 gün ileri sar</button><button class="btn gri" id="kutuSifirla">Verileri sıfırla</button></div>'
   +'<p class="ipnot">Nasıl çalışır: yanlış → kutuya girer, 2 gün sonra geri gelir; o gün doğru bilirsen 7 gün sonra bir kez daha gelir; onu da bilirsen kutudan çıkar ve ustalık tam sayılır.</p></div>';
  e.classList.add('acik');
  e.querySelector('#kutuKapat').addEventListener('click',()=>e.classList.remove('acik'));
  e.querySelector('#kutuIleri').addEventListener('click',()=>{ KUTU.ileri+=2*GUN; kutuKaydet(); kutuEkraniAc(); skorCiz(); });
  e.querySelector('#kutuSifirla').addEventListener('click',()=>{ if(confirm('Skor, kutu ve seri sıfırlansın mı?')){ KUTU.kayit=[]; KUTU.kutu=[]; KUTU.ileri=0; kutuKaydet(); location.reload(); } });
  e.querySelectorAll('.kutuCoz').forEach(b=>b.addEventListener('click',()=>{ e.classList.remove('acik'); kartSifirla(parseInt(b.dataset.i)); }));
}

  function ipucuAyir(t){ let ad=String(t||'').replace(/\s*\((?:-|\+)\)/g,''); const ipuclari=[]; const kalan=[];
    ad=ad.replace(/\s*\(([^()]*)\)/g,(m,ic)=>{ if(!/\d/.test(ic)) return m; const parcalar=ic.split(/\s*[,;]\s*/); const hesap=parcalar.filter(p=>/hesab/i.test(p)&&!/[×x*\/+\-]\s*\d/.test(p)); const form=parcalar.filter(p=>!hesap.includes(p)); if(form.length) ipuclari.push(form.join(', ')); return hesap.length?' ('+hesap.join(', ')+')':''; });

  function tabloOyunKur(){

    const soruSayi=new Set([...String(o.soru||'').matchAll(/\d{1,3}(?:\.\d{3})*(?:,\d+)?/g)].map(m=>m[0].replace(/\./g,'').replace(',','.')));
    const normV=t=>String(t||'').replace(/\s*(TL|₺|kg|adet|%)\s*$/i,'').replace(/^%\s*/,'').replace(/\./g,'').replace(',','.').replace(/[^\d.\-]/g,'');
    const ver=new Set(); const bos=new Set();

    const cipler=[...gercek.map(t=>({t,d:0})),...celdirici.map(t=>({t,d:1}))]; for(let i=cipler.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cipler[i],cipler[j]]=[cipler[j],cipler[i]]; }

      const yolH='<div class="yol"><div class="yolCip">'+s.adimlar.map((x,q)=>'<span class="yc '+(q<j?'gecti':(q===j?'simdi':(q===hedefIdx?'hedef':'')))+'" title="'+esc(adimBaslik(x))+'">'+(q===hedefIdx&&q!==j?'🏁':(q+1))+'</span>').join('<span class="ycb"></span>')+'<span class="yolAd">'+esc(adimBaslik(a))+'</span></div>'
        +(a.giris?('<div class="neden">'+(((s.teori||(s.tablo&&s.tablo.basliklar&&s.tablo.basliklar[0]==='Adım')))
            ?'Önce konunun haritası: nedir, sınav nasıl sorar. Sonra kural, sonra şıklar kuralla tek tek sınanır; en sonda senin seçimin.'   // 07.09 Ö55(2): teori cümlesi (hesap kalıbı "verilenler, hesap, ters durum" teori soruda anlamsızdı)
            :'Önce konunun haritası: nedir, sınav ne sorar, hangi yöntem ne zaman. Sonra sorunun verilenleri, sonra hesap; hedef <b>'+esc(sonBas)+'</b>.')+'</div>')
          :(verilenAdimMi&&s.verilenler&&s.verilenler.length)?'<div class="neden">Önce elimizdekileri tanıyoruz: <b>'+s.verilenler.length+' verilen</b>. Hesap bloğundaki her satır bunlardan kurulacak; hedef <b>'+esc(sonBas)+'</b>.</div>'
          :son?'<div class="neden">Hedefe ulaştık: <b>'+esc(sonBas)+'</b>. Şimdi aynı yolu sen yürü.</div>'
          :(j>=hedefIdx?'<div class="neden">Hedef bulundu (<b>'+esc(sonBas)+'</b>). '+(a.kisi?'Bu adım <b>senin seçtiğin şıkkın</b> neden yanlış olduğunu gösterir.':'Bu adım, adayların en sık düştüğü yanlış yolu gösterir.')+'</div>'
          :(j+1===hedefIdx?'<div class="neden">Bu adım niye var? Burada bulduğumuz değer doğrudan hedefe götürür: sıradaki adım <b>'+esc(sonBas)+'</b>.</div>'
          :'<div class="neden">Bu adım niye var? Burada bulduğumuz değer sıradaki adımda (<b>'+esc(sonrakiBas)+'</b>) kullanılacak; hedef <b>'+esc(sonBas)+'</b>.</div>')))+'</div>';
      serit.innerHTML='<div class="adimK'+(son?' sonAdim':'')+(yon<0?' geri':'')+'"><div class="say"><span>ADIM '+(j+1)+' / '+s.adimlar.length+'</span><span class="baslik">'+esc(adimBaslik(a))+'</span></div><code class="mat0">'+fH+'</code><p>'+anlatimH+'</p>'+yolH+sonBtn+'</div>';
      // Cem 04.09 "numaralara basarak sayfa değiştirsek": yol haritası yuvarlakları tıklanınca o adıma gider
      serit.querySelectorAll('.yc').forEach((el,q)=>el.addEventListener('click',()=>adimGit(q-adimNo)));
      const bo=serit.querySelector('.bDersOyun'); if(bo){ bo.addEventListener('click',()=>{ ders.classList.remove('acik'); oyunKur(); oyun.classList.add('acik'); }); }
      const bb=serit.querySelector('.bDersBitti'); if(bb){ bb.addEventListener('click',()=>{ ders.classList.remove('acik'); const cA=k.querySelector('.cAnlat'); if(cA){ if(cA.offsetParent===null){ const bd=k.querySelector('.bDaha'); if(bd) bd.click(); } cA.click(); const ta=k.querySelector('.anlatK'); if(ta) setTimeout(()=>ta.focus(),200); } }); }
      // tablo: bu adimin hucreleri acilir ve yanar; onceki adimlarda acilanlar acik kalir
      tabloSar.querySelectorAll('td.vurgu,td.kaynakH').forEach(td=>{ td.classList.remove('vurgu'); td.classList.remove('kaynakH'); }); tabloSar.querySelectorAll('tr.kayit.vurguS').forEach(tr=>tr.classList.remove('vurguS'));
      // 06.09 Cem "5'ten 3'e dönünce 5'in cevabı kalıyor": açık hücre kümesi her adımda 0..j'den YENİDEN kurulur; geri gidince sonraki adımların hücresi tekrar kapanır
      acilan.clear(); for(let q=0;q<=j;q++){ (s.adimlar[q].doldur||[]).forEach(p=>acilan.add(p[0]+','+p[1])); }
      kaynakH.forEach(k=>acilan.add(k));   // formülde kullanılan hücre görünür olmalı
      if(son&&s.tablo){ s.tablo.satirlar.forEach((st,r)=>st.forEach((c,ci)=>{ if(ci>0) acilan.add(r+','+ci); })); }
      tabloSar.querySelectorAll('td[data-r]').forEach(td=>{ const key=td.dataset.r+','+td.dataset.c; if(acilan.has(key)){ if(td.classList.contains('gizliH')){ td.classList.remove('gizliH'); td.classList.add('acildi'); } } else if(td.classList.contains('acildi')){ td.classList.add('gizliH'); td.classList.remove('acildi'); } });
      (a.doldur||[]).forEach(p=>{ const td=tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]'); if(td) td.classList.add('vurgu'); });
      // 05.09 Cem "%80 çıktığını o rakamı tabloya doldurduğumuzu göstersek": sonuç formülden tablodaki hücreye UÇAR
      // 05.09 Cem "bir anda çözümler geliyor, sırayla çözüyor gibi yapsa": adımda birden çok hesap varsa formül kutuları
      // SIRAYLA belirir (900 ms arayla), her kutunun sonucu belirince kendi hücresine uçar; hücre uçuş bitene dek boş kalır.
      if(yon>=0&&j>0&&!verilenAdimMi&&!a.giris){
        const mats=[...serit.querySelectorAll('.mat')]; const hedefler=(a.doldur||[]).map(p=>tabloSar.querySelector('td[data-r="'+p[0]+'"][data-c="'+p[1]+'"]')).filter(Boolean);
        const cokKutu=mats.length>1; const adimBu=j;
        hedefler.forEach(td=>td.classList.add('bekliyor'));
        mats.forEach((m,q)=>{ if(q>0&&cokKutu){ m.classList.add('gizliMat'); } });
        hedefler.forEach((td,pi)=>{ const kaynakM=mats[Math.min(pi,Math.max(0,mats.length-1))]; const gecikme=cokKutu?pi*900:pi*120;
          setTimeout(()=>{ if(adimNo!==adimBu||!document.body.contains(td)){ td.classList.remove('bekliyor'); return; }
            if(kaynakM){ kaynakM.classList.remove('gizliMat'); kaynakM.classList.add('geldi'); }
            const kaynakEl=kaynakM?kaynakM.querySelector('.matSonuc'):null; const from=kaynakEl?kaynakEl.getBoundingClientRect():null, to=td.getBoundingClientRect();
            if(!from||!from.width||!to.width){ td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); return; }
            const u=document.createElement('div'); u.className='ucan'; u.textContent=td.textContent.trim()||kaynakEl.textContent.trim(); document.body.appendChild(u); u.style.left=from.left+'px'; u.style.top=from.top+'px';
            requestAnimationFrame(()=>{ u.style.transform='translate('+(to.left-from.left)+'px,'+(to.top-from.top)+'px) scale(.85)'; u.style.opacity='0.15'; });
            setTimeout(()=>{ u.remove(); td.classList.remove('bekliyor'); td.classList.add('indi'); setTimeout(()=>td.classList.remove('indi'),700); },650); }, gecikme); });
        // hedefi olmayan fazladan kutular da sırayla gelsin
        mats.forEach((m,q)=>{ if(q>=hedefler.length&&m.classList.contains('gizliMat')){ setTimeout(()=>{ if(adimNo===adimBu){ m.classList.remove('gizliMat'); m.classList.add('geldi'); } }, q*900); } });
      }
      kaynakH.forEach(k=>{ const [r,c]=k.split(','); const td=tabloSar.querySelector('td[data-r="'+r+'"][data-c="'+c+'"]'); if(td) td.classList.add('kaynakH'); });
      // 06.09: VERİLENLER bloğu Adım 1'den sonra katlanır; bu adımın formülünde kullanılan verilen satırı açık kalır (mavi), başlık tıklanınca hepsi açılır
      tabloSar.querySelectorAll('tr.vblok').forEach(tr=>{ const td=tr.querySelector('td[data-r]'); const key=td?td.dataset.r+','+td.dataset.c:''; tr.classList.toggle('katli', j>0 && !kaynakH.has(key) && !hedef.has(key)); });
      let lej=tabloSar.querySelector('.lejant'); if(!lej){ lej=document.createElement('div'); lej.className='lejant'; tabloSar.appendChild(lej); }
      lej.innerHTML=kaynakH.size?'<i class="m"></i>nereden geldi <i class="a"></i>bu adımda bulundu':(hedef.size?'<i class="a"></i>bu adımda bulundu':''); lej.style.display=lej.innerHTML?'block':'none';
      // kayit satirlari: adimda anilan hesap kodu (uc hane; "100.000" icindeki 100 sayilmaz)
      const kodOf=x=>new Set([...(String(x.formul)+' '+String(x.anlatim)).matchAll(/(?<![\d.,])(\d{3})(?![\d.,]|\s*(?:TL|%|adet|gün|yıl|ay))/g)].map(m=>m[1]));
      const kodlar=kodOf(a);
      // gösterilen kayıt satırları da 0..j'den yeniden kurulur (geri gidince sonraki adımın satırı gizlenir)
      gosterilen.clear(); for(let q=0;q<=j;q++){ kodOf(s.adimlar[q]).forEach(c=>gosterilen.add(c)); }
      tabloSar.querySelectorAll('tr.kayit[data-kod]').forEach(tr=>{ const k2=tr.dataset.kod; const an=k2&&kodlar.has(k2); if(son){ gosterilen.add(k2); } tr.classList.toggle('goster',gosterilen.has(k2)); tr.classList.toggle('vurguS',!!an); });
      tabloSar.querySelectorAll('tr.ara').forEach(ara=>{ const gi=ara.dataset.grp; ara.classList.toggle('goster',[...tabloSar.querySelectorAll('tr.kayit[data-kod][data-grp="'+gi+'"]')].some(tr=>tr.classList.contains('goster'))); });
      adimBar.querySelectorAll('i').forEach(n=>{ const q=parseInt(n.dataset.j); n.classList.toggle('simdi',q===j); n.classList.toggle('gecti',q<j); });
      bOnce.disabled=(j===0); bSonra.disabled=son; bSonra.textContent=son?'Bitti ✓':'İleri ▶';
      const vurgu=tabloSar.querySelector('td.vurgu, tr.vurguS'); if(vurgu) vurgu.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    const adimGit=d=>{ const cur=s.adimlar[adimNo]; if(d>0&&cur&&tahminGerek(cur,adimNo,adimNo===s.adimlar.length-1)&&serit.querySelector('.tahminK')){ tahmin[adimNo]={atla:true}; adimGoster(adimNo,1); return; }   // 06.09: tahmin ekranında ileri = "göster"
      const j=Math.min(s.adimlar.length-1,Math.max(0,adimNo+d)); if(j===adimNo) return; adimGoster(j,d); };
    bOnce.addEventListener('click',()=>adimGit(-1)); bSonra.addEventListener('click',()=>adimGit(1));
    // fare tekerlegi, klavye oklari, parmakla yatay kaydirma (sola = ileri)
    let tekerKilit=0; serit.addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-tekerKilit<350) return; tekerKilit=t; adimGit((e.deltaY||e.deltaX)>0?1:-1); },{passive:false});
    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});

son.innerHTML='<div class="ust"><span>Nöbet bitti</span>'+noktalar(-1)+'<span>&nbsp;</span></div><div class="govde son" style="display:flex;flex-direction:column;justify-content:center"><div id="sonSkor"></div></div>';
akis.appendChild(son);
document.querySelectorAll('.skorCip,.kutuCip').forEach(b=>b.addEventListener('click',kutuEkraniAc)); skorCiz();
if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i').forEach(n=>n.classList.toggle('simdi',n.dataset.j==String(i)||(i>=SORULAR.length&&n.dataset.j==='son')));
  if(i<SORULAR.length&&durum.cevap[i]===undefined&&!durum.t0[i]) durum.t0[i]=Date.now();   // 06.09: karta gelince süre başlar
  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='PageDown'){ akis.scrollBy({top:akis.clientHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='PageUp'){ akis.scrollBy({top:-akis.clientHeight,behavior:'smooth'}); } });
