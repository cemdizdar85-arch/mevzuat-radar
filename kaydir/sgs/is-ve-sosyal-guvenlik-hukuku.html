nci fıkrasının (a) bendindeki şartların birlikte arandığı isteğe bağlı sigorta hükümleri uygulanır.","B":"Bu işçilerin uzun vadeli sigorta kollarına tabi olmak istemeleri hâlinde, Türkiye\u0027de yasal olarak ikamet etme şartı aranmaksızın haklarında isteğe bağlı sigorta hükümleri uygulanır."},"kaynak":{"alinti":"de yer alan kuralı yanlış sunarak yanlış ifadeyi doğru tanımlamaktadır; kaynakta açıkça","liste":[{"ad":"5510 s. SGK Kanunu m.5 [1/4]","metin":"MADDE 5- Kısa ve uzun vadeli sigorta kolları bakımından aşağıda sayılan kişiler hakkında uygulanacak sigorta kolları şunlardır: 2/7/2018 tarihli ve 703 sayılı Kanun Hükmünde Kararnamenin 203 üncü maddesiyle bu bentte yer alan “Başbakan,” ibaresinden sonra gelmek üzere “Cumhurbaşkanı yardımcıları,” ibaresi eklenmiştir. 6 2/1/2017 tarihli ve 680 sayılı KHK’nin 73 üncü maddesiyle bu bentte yer alan “Türk Silâhlı Kuvvetleri” ibaresi “Milli Savunma Bakanlığı” şeklinde değiştirilmiş, daha sonra bu hüküm 1/2/2018 tarihli ve 7072 sayılı Kanunun 71 inci maddesiyle aynen kabul edilerek kanunlaşmıştır. 7 12/7/2013 tarihli ve 6495 sayılı Kanunun 39 uncu maddesiyle, bu bendin sonuna “ile polis nasbedilmek üzere Polis Meslek Eğitim Merkezlerinde polislik eğitimine tabi tutulan adaylar” ibaresi eklenmiştir. 8 2/1/2017 tarihli ve 680 sayılı KHK’nin 73 üncü maddesiyle bu fıkrada yer alan “(d) ve (e)” ibaresi “(d), (e) ve (f)” şeklinde değiştirilmiş, daha sonra bu hüküm 1/2/2018 tarihli ve 7072 sayılı Kanunun 71 inci maddesiyle aynen kabul edilerek kanunlaşmıştır. 5 a) Hizmet akdi ile çalışmamakla birlikte, ceza infaz kurumları ile tutukevleri bünyesinde oluşturulan tesis, atölye ve benzeri ünitelerde çalıştırılan hükümlü ve tutuklular hakkında, iş kazası ve meslek hastalığı ile analık sigortası uygulanır ve bunlar, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılırlar."},{"ad":"5510 s. SGK Kanunu m.5 [2/4]","metin":"b) (Değişik: 13/2/2011-6111/24 md.) 5/6/1986 tarihli ve 3308 sayılı Meslekî Eğitim Kanununda belirtilen aday çırak, çırak ve işletmelerde meslekî eğitim gören öğrenciler hakkında iş kazası ve meslek hastalığı ile hastalık sigortası; meslekî ve teknik ortaöğretim ile yükseköğrenimleri sırasında staja tabi tutulan öğrenciler, mesleki ve teknik ortaöğretim sırasında tamamlayıcı eğitim ya da alan eğitimi gören öğrenciler, kamu kurum ve kuruluşları tarafından desteklenen projelerde görevli bursiyerler ile 2547 sayılı Yükseköğretim Kanununun 46 ncı maddesine tabi olarak kısmi zamanlı çalıştırılan öğrencilerden aylık prime esas kazanç tutarı, 82 nci maddeye göre belirlenen günlük prime esas kazanç alt sınırının otuz katından fazla olmayanlar hakkında ise iş kazası ve meslek hastalığı sigortası uygulanır. Bu bentte sayılanlar, 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalı sayılırlar ve bunlardan bakmakla yükümlü olunan kişi durumunda olmayanlar hakkında ayrıca genel sağlık sigortası hükümleri uygulanır.910 c) (Değişik: 17/4/2008-5754/3 md.) (Değişik birinci ve ikinci cümle: 12/7/20136495/96 md.) Harp malulleri ile 2330 sayılı Nakdi Tazminat ve Aylık Bağlanması Hakkında Kanuna veya 2330 sayılı Kanun hükümleri veya 8/6/1949 tarihli ve 5434 sayılı Kanunun 56 ncı maddesi uygulanarak aylık bağlanmasını gerektiren kanunlara göre vazife malullüğü aylığı bağlanmış malullerden, 4 üncü maddenin birinci fıkrasının (a), (b) ve (c) bentleri kapsamında sigortalı olarak çalışmaya başlayanların aylıkları kesilmez."}],"hakem":"Sorunun doğru şıkkı (D), 5510 s. SGK Kanunu m.5/g\u0027de yer alan kuralı yanlış sunarak yanlış ifadeyi doğru tanımlamaktadır; kaynakta açıkça \u0027Türkiye\u0027de yasal olarak ikamet etme şartı ile aynı fıkranın (a) bendinde belirtilen şartlar aranmaksızın\u0027 denilmekte, bu da şartların birlikte DEĞİL ayrı ayrı uygulanacağını göstermektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Uzun vadeli sigorta seçenlere ekstra sağlık sigortası primi yüklenmez; kanun bu gruptan sadece bir tür prim alınacağını düzenler.","E":"Yurt dışında ödenen isteğe bağlı sigorta primleri özel olarak ana sigortalı kapsamında sayılır; ayrı bir grup oluşturmaz.","A":"Yurt dışında çalıştırılan işçiler temel kısa vadeli sigorta ve sağlık hizmetlerine tabi tutulur. Bu ayırım kanunla belirlenen doğru bir uygulamadır.","D":"Kanun bu işçilere ikamet şartını arayan kolaylaştırılmış sistem sunar, ama D başka şartlar daha ekleneceğini söylüyor. Bu istisnayı yanlış tersine çevirmiştir.","B":"Uzun vadeli sigorta isteyenler için kanun açıkça ikamet şartını araştırmıyor, tam tersine bu şartı gözardı ediyor. İfade doğrudur."},"dogru":"Yurt dışında çalıştırılan Türk işçileri uzun vadeli sigorta isterse, sadece Türkiye\u0027de ikamet şartı aranan kolaylaştırılmış sisteme girebilirler. D şıkkı ikamet şartına ek olarak başka şartlar da getiriyor, bu yüzden yanlıştır.","sinav":"Sosyal Güvenlik Kanunu 5. madde (g) bendi","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 5. madde","tanim":"Sigortalı olmak isteyen kişilerin gönüllü olarak seçebildiği, uzun vadeli sigorta kollarından yararlanmalarını sağlayan sigorta türü.","ad":"İsteğe bağlı sigorta"},{"kaynak":"5510 s. SGK Kanunu 5. madde","tanim":"İş kazası, meslek hastalığı ve analık haline karşı sağlanan sigorta kollarıdır.","ad":"Kısa vadeli sigorta kolları"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Kanunun 5 inci maddesinin (g) bendine göre, sosyal güvenlik sözleşmesi olmayan ülkelerde iş üstlenen işverenlerce yurt dışındaki işyerlerinde çalıştırılmak üzere götürülen Türk işçilerinin sigortalılık statüsüne ilişkin aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-20","verilenler":[],"dayanak":"5510 sayılı Kanun m.5/g","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da merkezi olan ABC İnşaat, sosyal güvenlik sözleşmesi bulunmayan Katar\u0027daki bir şantiyeye 40 Türk işçi götürüyor. İşçilerden Mehmet, Türkiye\u0027de ikametini sürdürüyor, sözleşmeyi imzalıyor ve 2024 yılında yurt dışında çalışmaya başlıyor.","anlatim":"Mehmet\u0027in hem kısa vadeli hem uzun vadeli sigorta hakları, m.5/g\u0027nin farklı cümlelerinde ayrı ayrı düzenleniyor. Şimdi bu tek olayda beş cümleyi tek tek göreceğiz.","doldur":[]},{"formul":"Ne yapacağız: Mehmet 4/1-a kapsamında sigortalı sayılıyor, kısa vadeli sigorta ve genel sağlık sigortası doğrudan uygulanıyor; uzun vadeli için isteğe bağlı sigortaya girmek isterse ikamet şartı ile m.50/2-a şartı ARANMAKSIZIN tabi oluyor, ayrıca genel sağlık sigortası primi de alınmıyor.","anlatim":"Bu tek kural iskeletini Mehmet\u0027in dosyasında beş ifadeyle tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"5510 s.K. m.5/g, 1. cümle","karar":"doğru","anlatim":"Mehmet Katar\u0027a götürülür götürülmez birinci cümle onu 4/1-a kapsamında sigortalı sayar. Kısa vadeli sigorta kolları ve genel sağlık sigortası ayrıca şart aranmadan işler.","formul":"Şık A: Mehmet için \u0027kısa vadeli sigorta kolları ile genel sağlık sigortası zaten doğrudan uygulanır\u0027 desen doğru mu dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"5510 s.K. m.5/g, 2. cümle","karar":"doğru","anlatim":"İkinci cümle bu grup için ikamet şartını açıkça aramaz, isteğe bağlı sigorta hükümleri şartsız uygulanır. Mehmet Türkiye\u0027de otursa da oturmasa da fark etmez.","formul":"Şık B: Mehmet uzun vadeli sigorta kollarına girmek istese, \u0027Türkiye\u0027de ikamet şartı aranmaz\u0027 desen doğru mu olur?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"5510 s.K. m.5/g, 3. cümle","karar":"doğru","anlatim":"Üçüncü cümle bu grup için özel bir istisna getirir, ayrıca genel sağlık sigortası primi alınmayacağını söyler. Mehmet sadece isteğe bağlı sigorta primini öder.","formul":"Şık C: Mehmet isteğe bağlı sigorta primi öderken \u0027ayrıca genel sağlık sigortası primi de alınır mı\u0027 diye sorsa, hayır dersen doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"5510 s.K. m.5/g, 2. cümle","karar":"yanlış","anlatim":"İkinci cümle tam tersini söyler, bu iki şart Mehmet için birlikte değil hiç aranmaz. Muhasebeci istisnayı genel kurala çevirip yanılır.","formul":"Şık D: Muhasebeci \u0027Mehmet\u0027in isteğe bağlı sigortaya girmesi için hem ikamet şartı hem m.50/2-a şartı birlikte aranır\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"5510 s.K. m.5/g, son cümle (6111 s.K. m.24 ek)","karar":"doğru","anlatim":"Son cümle ek hüküm ile bu primleri açıkça 4/1-a bendi kapsamında sigortalılık sayar. Mehmet\u0027in dosyası bu bende göre işlenir.","formul":"Şık E: Mehmet\u0027in ödediği isteğe bağlı sigorta primleri, 4/1-a kapsamında sigortalılık sayılır mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Mehmet\u0027in dosyasında istisna hep \u0027şart aranmaksızın\u0027 yönünde çalışır, D bunu tersine çevirdiği için yanlıştır. Kendine hep şunu sor: metin \u0027aranmaksızın\u0027 mı diyor \u0027aranarak\u0027 mı?","doldur":[]}],"anahtar":[{"ornek":"sigorta","kok":"sigort"},{"ornek":"mehmet","kok":"mehmet"},{"ornek":"aranmaksizin","kok":"aranma"},{"ornek":"vadeli","kok":"vadeli"},{"ornek":"isteğe","kok":"isteğe"},{"ornek":"sağlık","kok":"sağlık"}],"konuGiris":{"harita":"Ne zaman uygulanır: kişi, sözleşmesi olmayan bir ülkeye işveren tarafından çalıştırılmak üzere götürüldüğünde. Nasıl belirlenir: kanun bu kişileri hangi sigortalı statüsüne alacağını doğrudan söyler. Nasıl kaydedilir: işveren bu durumu Kuruma bildirmekle yükümlüdür.","desen":"Sınav genelde bu istisna maddesinin kapsamını diğer sigortalı sayılan gruplarla karıştırtır. Tuzak, kişinin hangi sigorta koluna değil hangi statüye tabi olduğunu sormaktır. Bu soru madde 5 bent (g) düzenlemesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Türkiye ile sosyal güvenlik anlaşması bulunmayan devlet","ad":"Sözleşmesiz ülke","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Yurt dışında iş alıp işçi götüren taraf","ad":"İş üstlenen işveren","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Kişinin hangi sigorta koluna tabi kabul edildiği durumu","ad":"Sigortalı sayılma","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Yurt dışına çalıştırılmak üzere götürülen Türk vatandaşı","ad":"Türk işçi","kim":"mükellef / işveren beyan eder"}],"sinavda":"Soruda bir istisna grubu tanımı verilir ve bu gruba ait yanlış bilgiyi bulmanız istenir.","panel_ornek":"Bir arkadaşın sözleşmesiz bir ülkeye iş için gönderiliyor ve orada üç yıl çalışacak. Türkiye\u0027deki eski işvereni onun sigortasıyla artık ilgilenmiyor çünkü orada kendi ülkesinin kurallarına tabi olabiliyor. Bu durumda kimin sigortalı sayılıp sayılmayacağı ayrı bir kural ile belirleniyor.","ornek":"Bir arkadaşın sözleşmesiz bir ülkeye iş için gönderiliyor ve orada üç yıl çalışacak. Türkiye\u0027deki eski işvereni onun sigortasıyla artık ilgilenmiyor çünkü orada kendi ülkesinin kurallarına tabi olabiliyor. Bu durumda kimin sigortalı sayılıp sayılmayacağı ayrı bir kural ile belirleniyor.","yontemler":"Metindeki \u0027sözleşme olmayan ülke\u0027 ifadesini gördüğünüzde doğrudan bu istisna maddesini düşünün.","nedir":"Bu konu, hangi kişilerin sosyal sigorta kapsamı dışında sayıldığını belirler. Sınav, istisna gruplarını ve bunların statüsünü karıştırmadan bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Prim Katmanı Tuzağı","metin":"İsteğe bağlı sigortaya girenlerden her hâlükârda ayrıca genel sağlık sigortası primi alınacağını sanırsın. Doğrusu: madde bu kapsamda isteğe bağlı sigortadan yararlananlardan ayrıca genel sağlık sigortası primi alınmayacağını özel olarak düzenler; ifade doğrudur."},"E":{"ad":"Bent Sanma Tuzağı","metin":"İsteğe bağlı sigorta primi ödeyenlerin her zaman genel isteğe bağlı sigortalılar gibi ayrı bir bentte sayılacağını düşünüp bu cümleyi yanlış sanırsın. Doğrusu: madde bu primleri özel olarak 4/1-a bendi kapsamında sigortalılık sayar; ifade doğrudur."},"A":{"ad":"Kapsam Tuzağı","metin":"Bu bendin sözleşmesiz ülke istisnası olduğunu düşünüp kısa vadeli sigorta kolları ile genel sağlık sigortası uygulamasının da istisna olduğunu sanırsın. Doğrusu: madde metni bu işçileri doğrudan 4/1-a kapsamında sayar ve kısa vadeli sigorta kolları ile genel sağlık sigortası hükümlerini uygulanır kılar; ifade doğrudur, yanlış şık değildir."},"B":{"ad":"İstisna Karıştırma Tuzağı","metin":"İsteğe bağlı sigortanın her zaman ikamet şartına bağlı olduğunu düşünüp bu cümleyi yanlış sanırsın. Doğrusu: kanun bu özel grup için ikamet şartını açıkça arar demez, tam tersine ikamet şartı aranmaksızın der; ifade doğrudur."}},"celdiriciYol":{"not":"Teori sorusudur, sayısal hesap yolu yoktur; D şıkkı, B/D yakın-şık çiftinde m.5/g 2. cümledeki \u0027aranmaksızın\u0027 ibaresinin \u0027aranarak\u0027 şeklinde tersine çevrilmesiyle üretilmiştir; A, C, E ise ayrı cümlelerin birebir doğru aktarımıdır."},"hap":"Sosyal güvenlik sözleşmesi olmayan ülkede çalıştırılan Türk işçileri 4/1-a kapsamında kısa vadeli sigorta kolları ve genel sağlık sigortasına tabidir; uzun vadeli kollara geçiş isterlerse ikamet ve m.50/2-a şartları ARANMAKSIZIN isteğe bağlı sigortaya girerler ve ayrıca genel sağlık sigortası primi ödemezler.","teshis":{"C":{"gercek":"m.5/g üçüncü cümle, bu kapsamda isteğe bağlı sigorta hükümlerinden yararlananlardan ayrıca genel sağlık sigortası primi alınmayacağını özel olarak düzenler.","ayirt":"Madde \u0027ayrıca genel sağlık sigortası primi alınmaz\u0027 der mi, demez mi?","paragraf":"5510 s.K. m.5/g, 3. cümle","yanilgi":"İsteğe bağlı sigortaya giren herkesten ayrıca genel sağlık sigortası primi alınacağını sanıyorsun."},"E":{"gercek":"m.5/g son cümle (6111 s.K. eki), bu primleri özel olarak 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında sigortalılık sayar.","ayirt":"Ek cümlede hangi bent açıkça anılıyor, (a) mı (b) mi?","paragraf":"5510 s.K. m.5/g, son cümle (6111 s.K. m.24 ek)","yanilgi":"İsteğe bağlı sigorta primi ödeyenlerin otomatik olarak genel isteğe bağlı sigortalı bendinde sayılacağını düşünüyorsun."},"A":{"gercek":"m.5/g birinci cümle bu işçileri doğrudan 4/1-a kapsamında sigortalı sayar ve kısa vadeli sigorta kolları ile genel sağlık sigortasını uygulanır kılar.","ayirt":"Madde birinci cümlede hangi sigorta kollarını \u0027doğrudan\u0027 uyguluyor?","paragraf":"5510 s.K. m.5/g, 1. cümle","yanilgi":"Bu bendin istisnai niteliğinin, kısa vadeli sigorta kolları ve genel sağlık sigortası uygulamasını da istisnaya çevirdiğini sanıyorsun."},"D":{"gercek":"m.5/g ikinci cümle açıkça \u0027Türkiye\u0027de yasal olarak ikamet etme şartı ile aynı fıkranın (a) bendinde belirtilen şartlar aranmaksızın\u0027 der; şartlar birlikte aranmaz, tam tersine ikisi de aranmaz.","ayirt":"Metinde \u0027aranmaksızın\u0027 kelimesi hangi şartları kapsıyor, hepsini mi yoksa bir kısmını mı?","paragraf":"5510 s.K. m.5/g, 2. cümle","yanilgi":"İsteğe bağlı sigortanın genel şartlarının (ikamet + m.50/2-a) bu istisnai grup için de geçerli olduğunu, istisnanın yalnız kapsam yönünden olduğunu sanıyorsun."},"B":{"gercek":"m.5/g ikinci cümle, bu grup için Türkiye\u0027de ikamet şartını açıkça aramaz; şart aranmaksızın isteğe bağlı sigorta hükümleri uygulanır.","ayirt":"Bu cümlede \u0027şart aranmaksızın\u0027 mı yoksa \u0027şart aranarak\u0027 mı deniyor?","paragraf":"5510 s.K. m.5/g, 2. cümle","yanilgi":"İsteğe bağlı sigortanın genel kuralındaki ikamet şartının, bu özel gruba da aynen uygulandığını sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 111"},"kural":"5510 sayılı Kanunun 6 ncı maddesinin birinci fıkrasının (a) bendine göre işverenin işyerinde ücretsiz çalışan eşi 4 üncü ve 5 inci maddelere göre sigortalı sayılmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 111","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 6\u0027daki her bendi okurken parantez içindeki istisna cümlesini ayrıca okuyun; sınav çoğu zaman o istisnayı sorar.","konu":"sosyal sigortalı sayilma","tablo":{"satirlar":[["VERİLENLER","-","-"],["Ev hizmeti süre eşiği","10 gün","-"],["Yurt dışı görevlendirme süre sınırı","3 ay","-"],["Yaş şartı istisnası","18 yaş","-"],["HESAP","-","-"],["A) İşverenin işyerinde ücretsiz olarak çalışan eşi","5510 s.K. m.6/a","doğru ifade"],["B) Ev hizmetlerinde, ücretle aynı kişi yanında ay içinde 10…","5510 s.K. m.6/c","YANLIŞ ifade"],["C) Yaşlılık aylığı almaktayken bu aylığı kesilerek 4 üncü m…","5510 s.K. m.6/n","YANLIŞ ifade"],["D) Meslek okulunu bitirip Türk Medenî Kanunu hükümlerine gö…","5510 s.K. m.6, son fıkra","YANLIŞ ifade"],["E) Yabancı bir ülkede kurulu bir kuruluş tarafından Türkiye…","5510 s.K. m.6/e","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yaşlılık aylığı almaktayken bu aylığı kesilerek 4 üncü maddenin birinci fıkrasının (b) bendi kapsamında çalışanlar","E":"Yabancı bir ülkede kurulu bir kuruluş tarafından Türkiye\u0027ye dört ay süreyle gönderilen ve o ülkede sosyal sigortaya tabi olduğunu belgeleyen kişi","A":"İşverenin işyerinde ücretsiz olarak çalışan eşi","D":"Meslek okulunu bitirip Türk Medenî Kanunu hükümlerine göre mahkemece ergin kılınmak suretiyle öğrenimiyle ilgili görevde çalışan 17 yaşındaki kişi","B":"Ev hizmetlerinde, ücretle aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışanlar"},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.6 [1/4]","metin":"MADDE 6- Bu Kanunun kısa ve uzun vadeli sigorta kolları hükümlerinin uygulanmasında; a) İşverenin işyerinde ücretsiz çalışan eşi, b) Aynı konutta birlikte yaşayan ve üçüncü derece dahil bu dereceye kadar hısımlar arasında ve aralarına dışardan başka kimse katılmaksızın, yaşadıkları konut içinde yapılan işlerde çalışanlar, c) (Değişik: 17/4/2008-5754/4 md.) Ev hizmetlerinde çalışanlar (Kanunun ek 9 uncu maddesinin ikinci fıkrası kapsamında sigortalı olanlar ile ücretle aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışanlar hariç),12 d) Askerlik hizmetlerini er ve erbaş olarak yapmakta olanlar ile yedek subay ve yedek astsubay okulu öğrencileri,13 e) (Değişik: 10/9/2014-6552/40 md.) Uluslararası sosyal güvenlik sözleşmeleri hükümleri saklı kalmak kaydıyla; yabancı bir ülkede kurulu herhangi bir kuruluş tarafından ve o kuruluş adına ve hesabına Türkiye’ye üç ayı geçmemek üzere bir iş için gönderilen ve yabancı ülkede sosyal sigortaya tabi olduğunu belgeleyen kişiler ile Türkiye’de kendi adına ve hesabına bağımsız çalışanlardan, yurt dışında ikamet eden ve o ülke sosyal güvenlik 4/4/2015 tarihli ve 6645 sayılı Kanunun 44 üncü maddesiyle, bu bentte yer alan “bunlardan bakmakla yükümlü olunan kişi durumunda olmayanlar hakkında ayrıca” ibaresi madde metninden çıkarılmıştır. 12 10/9/2014 tarihli ve 6552 sayılı Kanunun 40 ıncı maddesiyle, bu bentte yer alan “(ücretle ve sürekli olarak çalışanlar hariç)” ibaresi 1/4/2015 tarihinde yürürlüğe girmek üzere “(Kanunun ek 9 uncu maddesinin ikinci fıkrası kapsamında sigortalı olanlar ile ücretle aynı kişi yanında ay içinde 10 g…"},{"ad":"5510 s. SGK Kanunu m.6 [2/4]","metin":"13 25/6/2019 tarihli ve 7179 sayılı Kanunun 62 nci maddesiyle bu bende “yedek subay” ibaresinden sonra gelmek üzere “ve yedek astsubay” ibaresi eklenmiştir. 11 mevzuatına tabi olanlar, f) (…)14 yüksek okullarda fiilen normal eğitim süreleri içinde yapılan, tatbikî mahiyetteki yapım ve üretim işlerinde çalışan öğrenciler, g) Sağlık hizmet sunucuları tarafından işe alıştırılmakta olan veya rehabilite edilen, hasta veya malûller, h) (Değişik: 17/4/2008-5754/4 md.) 4 üncü maddenin birinci fıkrasının (b) ve (c) bentleri gereği sigortalı sayılması gerekenlerden 18 yaşını doldurmamış olanlar, ı) Kamu idarelerinde ve Kanunun ek 5 inci maddesi kapsamında sayılanlar hariç olmak üzere, tarım işlerinde veya orman işlerinde hizmet akdiyle süreksiz işlerde çalışanlar ile tarımda kendi adına ve hesabına bağımsız çalışanlardan; tarımsal faaliyette bulunan ve yıllık tarımsal faaliyet gelirlerinden, bu faaliyete ilişkin masraflar düşüldükten sonra kalan tutarın aylık ortalamasının, bu Kanunda tanımlanan prime esas günlük kazanç alt sınırının otuz katından az olduğunu belgeleyenler ile 65 yaşını dolduranlardan talepte bulunanlar,15 j) (Mülga: 17/4/2008-5754/4 md.) k) (Değişik: 17/4/2008-5754/4 md.) Kendi adına ve hesabına bağımsız çalışanlardan gelir vergisinden muaf olup, esnaf ve sanatkâr siciline kayıtlı olanlardan, aylık faaliyet gelirlerinden bu faaliyetine ilişkin masraflar düşüldükten sonra kalan tutarı, prime esas günlük kazanç alt sınırının otuz katından az olduğunu belgeleyenler, l) Kamu idarelerinin dış temsilciliklerinde istihdam edilen ve temsilciliğin bulunduğu ülkede sürekli ik…"}],"hakem":"Soru, 5510 sayılı Kanun m.6/a bendine dayanan, işverenin işyerinde ücretsiz çalışan eşinin sigortalı sayılmadığı kuralını doğru olarak soruyor ve cevap kaynakta açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Yaşlılık aylığı almaktayken kesilmeksizin çalışanlar istisnadır, ancak aylığı kesilerek çalışanlar normal sigortalı sayılır.","E":"Yurt dışından gönderilen kişilere ilişkin istisna sadece üç ayı geçmemek üzere gönderilenler içindir; dört ayı geçerse sigortalı sayılır.","D":"Meslek okulunu bitirip mahkemece ergin kılınan kişilerde 18 yaş şartı aranmaz; bu kişi sigortalı sayılır.","B":"Ev hizmetlerinde çalışanlar normal istisnadır, ancak kanun ücretle aynı kişi yanında ayda 10 gün ve daha fazla çalışanları bu istisnanın dışında bırakır; bu kişiler sigortalı sayılır."},"dogru":"İşverenin işyerinde ücretsiz çalışan eşi kanun tarafından açıkça sigortalı sayılmaz olarak belirtilmiştir. Diğer şıklardaki kişiler belirli koşulları sağladıklarında sigortalı sayılırlar.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 6. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 6. madde","tanim":"İşveren tarafından işyerinde ücret ödenmeksizin çalıştırılan eş; sosyal sigorta kapsamı dışında tutulmuş kişidir.","ad":"İşverenin işyerinde ücretsiz çalışan eşi"},{"kaynak":"5510 s. SGK Kanunu 6. madde","tanim":"Ev işlerinde çalışanlar genel olarak sigorta dışındadır ancak ücretle aynı kişi yanında ayda 10 gün ve daha fazla çalışanlar bu istisna kapsamı dışında bırakılır.","ad":"Ev hizmetlerinde çalışanlar istisnası"},{"kaynak":"5510 s. SGK Kanunu 6. madde","tanim":"Meslek veya sanat okulu bitiren kişinin mahkemece reşit olarak kabul edilmesi; bu durumda 18 yaş şartı aranmaz.","ad":"Ergin kılınma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027na göre aşağıdakilerden hangisi Kanunun 4 üncü ve 5 inci maddelerine göre sigortalı sayılmaz?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-24","verilenler":[{"deger":"10 gün","anlam":"Ay içinde bu süre ve üzerinde ücretle çalışanlar ev hizmeti istisnasının dışında kalır ve sigortalı sayılır.","ad":"Ev hizmeti süre eşiği"},{"deger":"3 ay","anlam":"Bu süreyi geçmeyen görevlendirmeler istisna kapsamındadır; E şıkkındaki 4 aylık süre bu sınırı aştığı için kişi sigortalı sayılır.","ad":"Yurt dışı görevlendirme süre sınırı"},{"deger":"18 yaş","anlam":"Normalde 18 yaşını doldurmamış olanlar sigortalı sayılmaz, ancak ergin kılınarak öğrenimle ilgili görevde çalışanlarda bu şart aranmaz.","ad":"Yaş şartı istisnası"}],"dayanak":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu m.6","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da mobilya atölyesi işleten Hasan Bey\u0027in eşi Ayşe Hanım, dükkânda kasada oturuyor; hiç maaş almıyor. Aynı sokakta ev temizliğine giden Zeynep Hanım ise ayda 12 gün bir evde çalışıp ücret alıyor. Emekli Kemal Bey, aylığı kesilerek Bağ-Kur\u0027lu esnaf olarak dükkân açmış. 17 yaşındaki Mehmet, mahkeme kararıyla ergin kılınıp meslek lisesinde staj görevinde çalışıyor. Almanya\u0027daki bir firma, mühendis Ali\u0027yi 4 ay süreyle Türkiye\u0027ye gönderiyor, Ali orada sigortalı olduğunu belgeliyor.","anlatim":"Beş kişi de farklı gerekçeyle \u0027ben sigortalı mıyım\u0027 diye soruyor. Kanun her birine ayrı bir cevap veriyor.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanunun 6 ncı maddesi bazı kişileri 4 üncü ve 5 inci maddelere göre sigortalı SAYMAZ, ama her bentte kendi şartı var. Şimdi bu beş kişiyi tek tek 6 ncı maddenin bentlerine sokacağız.","anlatim":"Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[5,1],[5,2]],"sik":"A","paragraf":"5510 s.K. m.6/a","karar":"doğru","anlatim":"m.6/a hiçbir şart aramadan işverenin ücretsiz çalışan eşini istisna tutar. Ayşe Hanım\u0027ın durumu tam bu bende girer. Bu yüzden ifade doğrudur.","formul":"Şık A: Ayşe Hanım hiç ücret almadan eşinin dükkânında çalışıyor, bu kişi sigortalı sayılmaz mı?"},{"doldur":[[6,1],[6,2]],"sik":"B","paragraf":"5510 s.K. m.6/c","karar":"yanlış","anlatim":"m.6/c\u0027nin parantezi 10 gün ve üstü ücretle çalışanları istisna dışında bırakır, yani onları sigortalı yapar. Zeynep Hanım 12 gün çalıştığı için sigortalıdır, sigortasız sayılmaz. Bu ifade yanlıştır.","formul":"Şık B: Zeynep Hanım ayda 12 gün ücretle ev hizmetinde çalışıyor, bu kişi sigortasız mı sayılır?"},{"doldur":[[7,1],[7,2]],"sik":"C","paragraf":"5510 s.K. m.6/n","karar":"yanlış","anlatim":"m.6/n yalnız aylığı kesilmeksizin çalışanları istisna tutar. Kemal Bey\u0027in aylığı kesildiği için o bendin dışında kalır ve normal sigortalı olur. Bu ifade yanlıştır.","formul":"Şık C: Kemal Bey\u0027in yaşlılık aylığı KESİLEREK Bağ-Kur\u0027lu çalışıyor, bu kişi sigortasız mı sayılır?"},{"doldur":[[8,1],[8,2]],"sik":"D","paragraf":"5510 s.K. m.6, son fıkra","karar":"yanlış","anlatim":"m.6\u0027nın son fıkrası ergin kılınıp öğrenimle ilgili görevde çalışanlarda 18 yaş şartını aramaz. Mehmet ergin kılındığı için 18 yaş istisnasına giremez, normal sigortalı sayılır. Bu ifade yanlıştır.","formul":"Şık D: Mehmet mahkemece ergin kılınmış, 17 yaşında ve öğrenimiyle ilgili görevde çalışıyor, sigortasız mı sayılır?"},{"doldur":[[9,1],[9,2]],"sik":"E","paragraf":"5510 s.K. m.6/e","karar":"yanlış","anlatim":"m.6/e istisnası yalnız üç ayı geçmeyen görevlendirmeler içindir. Ali\u0027nin görevlendirmesi dört ay sürdüğü için istisna dışında kalır ve sigortalı sayılır. Bu ifade yanlıştır.","formul":"Şık E: Ali, Almanya\u0027daki firma tarafından 4 aylığına gönderildi ve orada sigortalı olduğunu belgeliyor, sigortasız mı sayılır?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Sadece ücretsiz çalışan eş şartsız istisnadır, diğer dört bentte hep bir süre ya da hal şartı devreye girer. Kendine hep şunu sor: bu bentte bir sayı ya da koşul var mı, varsa olay o koşulu karşılıyor mu?","doldur":[]}],"anahtar":[{"ornek":"sigortalı","kok":"sigort"},{"ornek":"istisnası","kok":"istisn"},{"ornek":"çalışan","kok":"çalışa"},{"ornek":"sayılı","kok":"sayılı"},{"ornek":"yanlıştır","kok":"yanlış"},{"ornek":"bendin","kok":"bendin"}],"konuGiris":{"harita":"Hangi kişiler istisna kapsamındadır: işverenin eşi, yakın hısımlar arası ev içi işler, askerlik yapanlar gibi belirli gruplar. Nasıl ayırt edilir: kişinin işin niteliği, yakınlık derecesi ve süresi kurala uyup uymadığına bakılarak belirlenir. Nasıl uygulanır: bu kişiler kısa ve uzun vadeli sigorta kollarından hiçbir şekilde yararlanamaz.","desen":"Sorular genellikle seçeneklerde gerçek sigortalı bir grup ile istisna kapsamındaki bir grubu karıştırarak sorulur. Tuzak, ev içi yakın hısım ilişkisi ile normal işçi statüsünün birbirine benzetilmesinden gelir. Bu soru istisna listesindeki gruplarla gerçek sigortalıları ayırt etme noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"belirli koşullardaki çalışanların sigortalı sayılmadığı hal","ad":"istisna kapsamı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"aynı konutta yaşayan akrabalar arası iş ilişkisinin sınırı","ad":"hısımlık derecesi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"konutta günlük ev işlerini yapan, belirli gün sınırının altındaki kişi","ad":"ev hizmeti çalışanı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"er, erbaş ve yedek subay adaylarının sigorta dışı sayılması","ad":"askerlik hizmeti istisnası","kim":"kanun sabitler"}],"sinavda":"Seçeneklerden biri seçilerek hangisinin sigortalı sayılmadığı tespit edilmesi istenir.","panel_ornek":"Komşun sana günde birkaç saat bahçe işi için yardım ediyor ve karşılığında haftada 50 lira alıyor; bu tür yakın çevre içi küçük yardımlaşmalar resmi sigorta sistemine girmez. Aynı şekilde ailenin kendi evinde birbirine yaptığı işler de bu kapsamda sayılmaz.","ornek":"Komşun sana günde birkaç saat bahçe işi için yardım ediyor ve karşılığında haftada 50 lira alıyor; bu tür yakın çevre içi küçük yardımlaşmalar resmi sigorta sistemine girmez. Aynı şekilde ailenin kendi evinde birbirine yaptığı işler de bu kapsamda sayılmaz.","yontemler":"Öğrenci önce kişinin işin niteliğini, sonra yakınlık ya da süre şartını kontrol etmelidir; tek kritik nokta, istisna listesindeki tanıma tam uyup uymadığıdır.","nedir":"Bu konu, Kanunun sigorta kapsamı dışında saydığı istisnai çalışan gruplarını tanımlar. Sınav, hangi durumdaki kişinin sigortalı sayılmayacağını ayırt edebilmeyi ölçer."},"olay":"","tuzak":{"C":{"ad":"Yön Ters Çevirme Tuzağı","metin":"öğrenci aylığın kesilip kesilmemesini karıştırır. Doğrusu: madde 6/n bendine göre yaşlılık aylığı almaktayken bu aylık KESİLMEKSİZİN 4/b kapsamında çalışanlar sayılmaz; aylığı kesilerek çalışanlar ise normal şekilde sigortalıdır."},"E":{"ad":"Süre Sınırı Tuzağı","metin":"öğrenci yurt dışından gönderilen herkesin süresine bakmaksızın istisna kapsamında olduğunu sanır. Doğrusu: madde 6/e bendindeki istisna yalnız Türkiye\u0027ye ÜÇ AYI GEÇMEMEK üzere gönderilenler içindir; dört ay süreyle gönderilen bu kişi istisna dışında kalıp sigortalı sayılır."},"D":{"ad":"Yaş İstisnası Tuzağı","metin":"öğrenci 18 yaşını doldurmayan herkesin sigortasız sayıldığını düşünür. Doğrusu: madde 6\u0027nın son fıkrasına göre ergin kılınarak öğrenimiyle ilgili görevde çalışanlarda 18 yaş şartı aranmaz, bu kişi sigortalı sayılır."},"B":{"ad":"Ev Hizmeti İstisnası Tuzağı","metin":"öğrenci ev hizmetlerinde çalışanların hep sayılmadığını sanır. Doğrusu: madde 6/c bendi, ücretle aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışanları bu istisnanın DIŞINDA bırakır, yani bu kişiler sigortalı sayılır."}},"celdiriciYol":null,"hap":"5510 sayılı Kanunun 6 ncı maddesindeki sigortalı sayılmama halleri sınırlı sayıdadır ve her bendin parantez içi istisnası asıl kuralı tersine çevirir.","teshis":{"C":{"gercek":"m.6/n bendi yalnız aylığı KESİLMEKSİZİN 4/b kapsamında çalışmayı sigortasız sayar; aylık kesilerek çalışan kişi normal sigortalıdır.","ayirt":"Bu kişinin yaşlılık aylığı çalışırken kesildi mi, yoksa ödenmeye devam mı ediyor?","paragraf":"5510 s.K. m.6/n","yanilgi":"Aylığın kesilip kesilmemesi ayrımını atlayıp \u0027aylık alan çalışamaz zaten sigortasızdır\u0027 diye genelliyorsun."},"E":{"gercek":"m.6/e bendindeki istisna yalnız üç ayı geçmeyen görevlendirmeler içindir; üç ayı aşan görevlendirme normal sigortalılığı doğurur.","ayirt":"Görevlendirme süresi üç ayı geçiyor mu, geçmiyor mu?","paragraf":"5510 s.K. m.6/e","yanilgi":"Yurt dışından gönderilme halini süre sınırı olmadan istisna sanıyorsun."},"A":{"gercek":"5510 sayılı Kanun m.6/a, işverenin işyerinde ücretsiz çalışan eşini doğrudan ve istisnasız sigortalı sayılmama kapsamına alır.","ayirt":"Bu kişiye herhangi bir ücret ödeniyor mu, yoksa tamamen karşılıksız mı çalışıyor?","paragraf":"5510 s.K. m.6/a","yanilgi":"Bu bendi de diğerleri gibi \u0027istisnası olan bir kural\u0027 sanıp gözden kaçırıyorsun."},"D":{"gercek":"m.6\u0027nın son fıkrası, ergin kılınıp öğrenimle ilgili görevde çalışanlarda 18 yaş şartını aramaz; bu kişi sigortalıdır.","ayirt":"Bu kişi Türk Medenî Kanunu\u0027na göre mahkemece ergin kılındı mı ve görev öğrenimiyle ilgili mi?","paragraf":"5510 s.K. m.6, son fıkra","yanilgi":"18 yaş şartını mutlak bir kural sanıp istisna fıkrasını görmüyorsun."},"B":{"gercek":"m.6/c bendi ay içinde 10 gün ve daha fazla ücretle çalışanları istisna dışında bırakır, bu kişiler 4 üncü madde kapsamında sigortalıdır.","ayirt":"Bu kişi ayda kaç gün ve ne karşılığında çalışıyor, 10 gün eşiğini aşıyor mu?","paragraf":"5510 s.K. m.6/c","yanilgi":"Ev hizmetlerinde çalışan herkesin sigortasız olduğunu ezberlemişsin, parantez içindeki istisnayı atlıyorsun."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 111"},"kural":"Madde 6/c\u0027ye göre ev hizmetlerinde çalışanlar, ücretle aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışanlar hariç olmak üzere sigortalı sayılmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 111","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 6 sorularında \u0027hariç\u0027, \u0027az\u0027, \u0027muaf\u0027 gibi şart kelimelerinin yönünü ters çeviren şıkka dikkat et; şart sağlanıyor mu diye tek tek kontrol et.","konu":"sosyal sigortalı sayilma","tablo":{"satirlar":[["VERİLENLER","-","-"],["Madde numarası (Kanun maddesi)","6","-"],["Referans madde numarası (ilk)","4","-"],["Referans madde numarası (ikinci)","5","-"],["HESAP","-","-"],["A) İşverenin işyerinde ücretli olarak çalıştırılan eşi","m.6/1-a","YANLIŞ ifade"],["B) Ev hizmetlerinde bir kişi yanında ay içinde 10 günden az…","m.6/1-c","doğru ifade"],["C) Ev hizmetlerinde aynı kişi yanında ay içinde 10 gün ve d…","m.6/1-c","YANLIŞ ifade"],["D) Tarımsal faaliyet gelirinin, prime esas günlük kazanç al…","m.6/1-ı","doğru ifade"],["E) Esnaf ve sanatkâr siciline kayıtlı olup gelir vergisinde…","m.6/1-k","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Ev hizmetlerinde aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışan kişi","E":"Esnaf ve sanatkâr siciline kayıtlı olup gelir vergisinden muaf olmayan, kendi adına ve hesabına bağımsız çalışan kişi","A":"İşverenin işyerinde ücretli olarak çalıştırılan eşi","D":"Tarımsal faaliyet gelirinin, prime esas günlük kazanç alt sınırının otuz katından fazla olduğunu belgeleyen süreksiz tarım işçisi","B":"Ev hizmetlerinde bir kişi yanında ay içinde 10 günden az süreyle çalışan kişi"},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.6 [1/4]","metin":"MADDE 6- Bu Kanunun kısa ve uzun vadeli sigorta kolları hükümlerinin uygulanmasında; a) İşverenin işyerinde ücretsiz çalışan eşi, b) Aynı konutta birlikte yaşayan ve üçüncü derece dahil bu dereceye kadar hısımlar arasında ve aralarına dışardan başka kimse katılmaksızın, yaşadıkları konut içinde yapılan işlerde çalışanlar, c) (Değişik: 17/4/2008-5754/4 md.) Ev hizmetlerinde çalışanlar (Kanunun ek 9 uncu maddesinin ikinci fıkrası kapsamında sigortalı olanlar ile ücretle aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışanlar hariç),12 d) Askerlik hizmetlerini er ve erbaş olarak yapmakta olanlar ile yedek subay ve yedek astsubay okulu öğrencileri,13 e) (Değişik: 10/9/2014-6552/40 md.) Uluslararası sosyal güvenlik sözleşmeleri hükümleri saklı kalmak kaydıyla; yabancı bir ülkede kurulu herhangi bir kuruluş tarafından ve o kuruluş adına ve hesabına Türkiye’ye üç ayı geçmemek üzere bir iş için gönderilen ve yabancı ülkede sosyal sigortaya tabi olduğunu belgeleyen kişiler ile Türkiye’de kendi adına ve hesabına bağımsız çalışanlardan, yurt dışında ikamet eden ve o ülke sosyal güvenlik 4/4/2015 tarihli ve 6645 sayılı Kanunun 44 üncü maddesiyle, bu bentte yer alan “bunlardan bakmakla yükümlü olunan kişi durumunda olmayanlar hakkında ayrıca” ibaresi madde metninden çıkarılmıştır. 12 10/9/2014 tarihli ve 6552 sayılı Kanunun 40 ıncı maddesiyle, bu bentte yer alan “(ücretle ve sürekli olarak çalışanlar hariç)” ibaresi 1/4/2015 tarihinde yürürlüğe girmek üzere “(Kanunun ek 9 uncu maddesinin ikinci fıkrası kapsamında sigortalı olanlar ile ücretle aynı kişi yanında ay içinde 10 g…"},{"ad":"5510 s. SGK Kanunu m.6 [2/4]","metin":"13 25/6/2019 tarihli ve 7179 sayılı Kanunun 62 nci maddesiyle bu bende “yedek subay” ibaresinden sonra gelmek üzere “ve yedek astsubay” ibaresi eklenmiştir. 11 mevzuatına tabi olanlar, f) (…)14 yüksek okullarda fiilen normal eğitim süreleri içinde yapılan, tatbikî mahiyetteki yapım ve üretim işlerinde çalışan öğrenciler, g) Sağlık hizmet sunucuları tarafından işe alıştırılmakta olan veya rehabilite edilen, hasta veya malûller, h) (Değişik: 17/4/2008-5754/4 md.) 4 üncü maddenin birinci fıkrasının (b) ve (c) bentleri gereği sigortalı sayılması gerekenlerden 18 yaşını doldurmamış olanlar, ı) Kamu idarelerinde ve Kanunun ek 5 inci maddesi kapsamında sayılanlar hariç olmak üzere, tarım işlerinde veya orman işlerinde hizmet akdiyle süreksiz işlerde çalışanlar ile tarımda kendi adına ve hesabına bağımsız çalışanlardan; tarımsal faaliyette bulunan ve yıllık tarımsal faaliyet gelirlerinden, bu faaliyete ilişkin masraflar düşüldükten sonra kalan tutarın aylık ortalamasının, bu Kanunda tanımlanan prime esas günlük kazanç alt sınırının otuz katından az olduğunu belgeleyenler ile 65 yaşını dolduranlardan talepte bulunanlar,15 j) (Mülga: 17/4/2008-5754/4 md.) k) (Değişik: 17/4/2008-5754/4 md.) Kendi adına ve hesabına bağımsız çalışanlardan gelir vergisinden muaf olup, esnaf ve sanatkâr siciline kayıtlı olanlardan, aylık faaliyet gelirlerinden bu faaliyetine ilişkin masraflar düşüldükten sonra kalan tutarı, prime esas günlük kazanç alt sınırının otuz katından az olduğunu belgeleyenler, l) Kamu idarelerinin dış temsilciliklerinde istihdam edilen ve temsilciliğin bulunduğu ülkede sürekli ik…"}],"hakem":"5510 s. Kanun m.6/c bendinde ev hizmetlerinde çalışanlar genel olarak sigortalı sayılmaz; ancak ücretle aynı kişi yanında ay içinde 10 gün ve daha fazla süreyle çalışanlar istisna olup, 10 günden az çalışan kişi sigortalı sayılmaz kuralı kaynakta açıkça yer almaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Ev hizmetinde ayda 10 gün ve daha fazla çalışan kişi istisnanın istisnası olarak sigortalı sayılır.","E":"Gelir vergisinden muaf olmayan esnaf bağımsız çalışan olarak sigortalı sayılır; muaf olanlar istisnadır.","D":"Tarımsal geliri otuz kat alt sınırdan fazla olan süreksiz tarım işçisi sigortalı sayılır; yalnız az olanlar istisnadır.","A":"İşverenin işyerinde ücretli çalışan eşi normal sigortalıdır; yalnız ücretsiz çalışan eş sigortalı sayılmaz."},"dogru":"Ev hizmetinde ayda 10 günden az çalışan kişi sigortalı sayılmaz. 10 gün ve üzeri çalışan kişi ya da muaf tutulan diğer gruplar (ücretli eş, yüksek gelirli tarım işçisi, vergi ödeyen esnaf) sigortalı sayılır.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 6. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 6. madde","tanim":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu kapsamında sigorta güvencesine sahip olan kişi.","ad":"Sigortalı"},{"kaynak":"5510 s. SGK Kanunu 6. madde","tanim":"Sosyal sigorta priminin hesaplanmasında esas alınan asgari günlük kazanç tutarı.","ad":"Prime esas günlük kazanç alt sınırı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027nun 6 ncı maddesine göre, 4 üncü ve 5 inci maddelere göre sigortalı sayılması gereken kişilerden hangisi kısa ve uzun vadeli sigorta kolları bakımından sigortalı sayılmaz?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-24","verilenler":[{"deger":"6","anlam":"Kanunun hangi bölümünde sigortalı olmama hallerinin tanımlandığını gösteren madde; sorunun cevabı bu maddede yer alır.","ad":"Madde numarası (Kanun maddesi)"},{"deger":"4","anlam":"Kanunun sigortalı sayılması gereken kişileri tanımlayan ilk madde; 6. maddede istisnalar bu maddeden hareketle belirlenir.","ad":"Referans madde numarası (ilk)"},{"deger":"5","anlam":"Kanunun sigortalı sayılması gereken kişileri tanımlayan ikinci madde; 6. maddede istisnalar bu maddeden hareketle belirlenir.","ad":"Referans madde numarası (ikinci)"}],"dayanak":"5510 sayılı Kanun m.6/1 (a), (c), (ı), (k) bentleri","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da yaşayan Ayşe Hanım, mahalledeki bir ailenin evinde ayda 8 gün temizliğe gidiyor ve karşılığında 2.400 TL alıyor.","anlatim":"Ayşe her ay aynı sayıda gün, aynı evde çalışıyor ama 10 günü hiç bulmuyor. SGK bu durumu madde 6 açısından değerlendirecek. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 5510 sayılı Kanun m.6, kimi kişileri kısa ve uzun vadeli sigorta kollarından sigortalı saymaz; ama her istisnanın kendi şartı var.","anlatim":"Ayşe\u0027nin 8 günü, m.6/1-c\u0027deki 10 gün eşiğinin altında kalıyor. Şimdi A\u0027dan E\u0027ye kadar bu beş ifadeyi Ayşe\u0027nin ve benzer olayların üzerinden tek tek deneyeceğiz.","doldur":[]},{"doldur":[[5,1],[5,2]],"sik":"A","paragraf":"m.6/1-a","karar":"yanlış","anlatim":"Madde 6/1-a yalnız ücretsiz çalışan eşi kapsar, burada eşe ücret ödeniyor. Ayşe\u0027nin olayına benzese de bu kişi normal işçi sigortalısıdır, işveren yanılıyor.","formul":"Şık A: işveren, ücret ödediği eşini \u0027zaten eşim, sigortasız olur\u0027 diyerek bildirmiyor, haklı mı?"},{"doldur":[[6,1],[6,2]],"sik":"B","paragraf":"m.6/1-c","karar":"doğru","anlatim":"Madde 6/1-c ev hizmetinde çalışanları sigortasız sayar, istisnası yalnız 10 gün ve üzeri çalışanlardır. Ayşe 8 günle bu istisnanın dışında kaldığı için genel kural işler ve işveren haklıdır.","formul":"Şık B: Ayşe gibi biri ayda 8 gün ev hizmetinde çalışıyor, işveren \u0027seni sigortalı yapmama gerek yok\u0027 diyor, haklı mı?"},{"doldur":[[7,1],[7,2]],"sik":"C","paragraf":"m.6/1-c","karar":"yanlış","anlatim":"Madde 6/1-c\u0027de 10 gün ve daha fazla çalışanlar hariç tutulmuş, yani bu kişi istisnanın istisnasına girer. Bu kişi aslında 4/a kapsamında sigortalıdır, işveren yanılıyor.","formul":"Şık C: aynı evde ayda 12 gün çalışan başka bir kadın için işveren \u0027o da sigortasız\u0027 diyor, doğru mu?"},{"doldur":[[8,1],[8,2]],"sik":"D","paragraf":"m.6/1-ı","karar":"doğru","anlatim":"Madde 6/1-ı tam bu şartı arıyor, gelirini belgeleyen süreksiz tarım işçisi sigortalı sayılmaz. Bu kişi doğru söylüyor.","formul":"Şık D: tarımsal geliri otuz kat alt sınırın altında kalan süreksiz bir tarım işçisi \u0027ben sigortasızım\u0027 diyor, doğru mu?"},{"doldur":[[9,1],[9,2]],"sik":"E","paragraf":"m.6/1-k","karar":"yanlış","anlatim":"Madde 6/1-k istisnası yalnız gelir vergisinden muaf olan esnafı kapsar. Bu kişi muaf olmadığı için 4/b kapsamında sigortalıdır, yanılıyor.","formul":"Şık E: esnaf siciline kayıtlı ama gelir vergisinden muaf olmayan biri \u0027ben de sigortasızım\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✓ E ✗","anlatim":"Soru \u0027sigortalı sayılmaz\u0027 diyeni sorduğu için tek doğru cevap B, ev hizmetinde 10 günden az çalışan. Kendine hep şunu sor: bu kişi istisnanın şartını gerçekten dolduruyor mu, yoksa istisnanın istisnasına mı giriyor?","doldur":[]}],"anahtar":[{"ornek":"sigortalı","kok":"sigort"},{"ornek":"istisna","kok":"istisn"},{"ornek":"çalışanlar","kok":"çalışa"},{"ornek":"sayılmama","kok":"sayılm"},{"ornek":"hizmetlerinde","kok":"hizmet"},{"ornek":"işveren","kok":"işvere"}],"konuGiris":{"harita":"Ne zaman istisna uygulanır: kişi kanunda sayılan özel bir gruba girdiğinde uygulanır. Nasıl belirlenir: kişinin durumu istisna listesindeki tanıma uyup uymadığına bakılarak belirlenir. Nasıl kaydedilir: bu kişiler sigortalı sayılmadığından kısa ve uzun vadeli sigorta kollarına kayıt yapılmaz.","desen":"Sınav, istisna listesindeki bentlerden birini örnek kişi olarak verip bunun sigortalı sayılıp sayılmadığını sordurur. Tuzak, listedeki benzer görünen ama farklı koşullu maddeleri karıştırmaktır. Bu soru m.6 istisna fıkrası noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"belirli çalışma biçimlerinin genel sigortalılık kapsamı dışında tutulması","ad":"istisna hali","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"iş kazası, hastalık, malullük ve yaşlılık gibi riskleri kapsayan sigorta grupları","ad":"kısa ve uzun vadeli sigorta kolları","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"işverenin eşi gibi yakınının karşılıksız işyerinde çalışması durumu","ad":"ücretsiz aile çalışması","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"düzenli olmayan, belirli koşullu tarım veya orman işinde çalışma biçimi","ad":"süreksiz tarım işi","kim":"mükellef / işveren beyan eder"}],"sinavda":"Soru bir kişinin çalışma durumunu tarif eder ve bu kişinin sigortalı sayılıp sayılmadığının seçilmesini ister.","panel_ornek":"Bir apartmanda oturan üç kardeş, evlerinin içindeki temizlik işini kendi aralarında yapıyor, dışarıdan kimse çağırmıyorlar. Bu durum günlük hayatta \u0027aile içi iş\u0027 sayılır ve resmi bir çalışma ilişkisi gibi değerlendirilmez. Aynı mantıkla bazı çalışma biçimleri kanunda özel olarak korumanın dışında bırakılmıştır.","ornek":"Bir apartmanda oturan üç kardeş, evlerinin içindeki temizlik işini kendi aralarında yapıyor, dışarıdan kimse çağırmıyorlar. Bu durum günlük hayatta \u0027aile içi iş\u0027 sayılır ve resmi bir çalışma ilişkisi gibi değerlendirilmez. Aynı mantıkla bazı çalışma biçimleri kanunda özel olarak korumanın dışında bırakılmıştır.","yontemler":"Her seçenek istisna listesindeki bentlerle tek tek karşılaştırılmalı, tanıma tam uyan seçenek işaretlenmelidir.","nedir":"Bu konu, hangi çalışanların kanunun kısa ve uzun vadeli sigorta koruması dışında tutulduğunu belirler. Sınav, istisna listesindeki kişileri genel sigortalılık kuralından ayırt edebilmeyi ölçer."},"olay":"Ayda 10 günden az çalışma bu istisnanın istisnası kapsamına girmediğinden genel kural uygulanır.","tuzak":{"C":{"ad":"10 Gün Eşiği Tuzağı","metin":"Ev hizmetinde çalışmayı tek başına sigortasızlık nedeni sanırsın. Doğrusu: Madde 6/c\u0027de sayılan 10 gün ve üzeri çalışma istisnanın istisnasıdır; bu kişiler 4 üncü maddenin (a) bendi kapsamında sigortalı sayılır."},"E":{"ad":"Muafiyet Şartı Tuzağı","metin":"Esnaf siciline kayıtlı olmayı tek başına yeterli sanırsın. Doğrusu: Madde 6/k yalnız gelir vergisinden MUAF olan esnafı kapsar; muaf olmayan kişi 4 üncü maddenin (b) bendi kapsamında sigortalı sayılır."},"D":{"ad":"Gelir Sınırı Tuzağı","metin":"Süreksiz tarım işini tek başına sigortasızlık nedeni sanırsın. Doğrusu: Madde 6/ı yalnız tarımsal faaliyet gelirinin otuz kat alt sınırdan AZ olduğunu belgeleyenleri kapsar; geliri fazla olan kişi sigortalı sayılır."},"A":{"ad":"Eş İstisnası Tuzağı","metin":"İşverenin eşi olmayı tek başına sigortasızlık nedeni sanırsın. Doğrusu: Madde 6/a yalnız işyerinde ÜCRETSİZ çalışan eşi kapsar; ücretli çalıştırılan eş 4 üncü maddenin birinci fıkrasının (a) bendi kapsamında normal sigortalıdır."}},"celdiriciYol":{},"hap":"5510 sayılı Kanun m.6\u0027daki sigortalı sayılmama halleri çoğu bentte bir istisna şartına (gün, tutar, muafiyet) bağlıdır; şart sağlanmazsa kişi yine 4 üncü veya 5 inci madde kapsamında sigortalı sayılır.","teshis":{"C":{"gercek":"Madde 6/c\u0027de 10 gün ve daha fazla çalışanlar istisnanın istisnası olarak hariç tutulmuş ve 4/a kapsamında sigortalı sayılmıştır.","ayirt":"Çalışma süresi ayda 10 günü buluyor mu, aşıyor mu?","paragraf":"5510 s.K. m.6/1-c","yanilgi":"Ev hizmetinde çalışmanın süresine bakmaksızın hep sigortasızlık sonucu doğurduğunu sanıyorsun."},"E":{"gercek":"Madde 6/k yalnız gelir vergisinden muaf olan ve belirli gelir sınırının altında kalan esnafı kapsar; muaf olmayan kişi 4/b kapsamında sigortalıdır.","ayirt":"Kişi gelir vergisinden muaf mı, değil mi?","paragraf":"5510 s.K. m.6/1-k","yanilgi":"Esnaf siciline kayıtlı olmayı, gelir vergisi durumuna bakmaksızın sigortasızlık için yeterli sanıyorsun."},"A":{"gercek":"Madde 6/a yalnız ücretsiz çalışan eşi kapsar; ücret ödeniyorsa istisna uygulanmaz ve kişi normal işçi sigortalısıdır.","ayirt":"Eş, işyerinde ücret alıyor mu, almıyor mu?","paragraf":"5510 s.K. m.6/1-a","yanilgi":"Eşin işyerinde çalışmasının kendiliğinden sigortasızlık sebebi olduğunu düşünüyorsun."},"D":{"gercek":"Madde 6/ı yalnız tarımsal faaliyet gelirinin otuz kat alt sınırdan az olduğunu belgeleyenleri kapsar; bu sınırı aşanlar istisna dışında kalır.","ayirt":"Belgelenen tarımsal gelir otuz kat sınırın altında mı, üstünde mi?","paragraf":"5510 s.K. m.6/1-ı","yanilgi":"Tarımda süreksiz çalışmanın tek başına, gelir düzeyine bakılmaksızın sigortasızlık getirdiğini düşünüyorsun."},"B":{"gercek":"Madde 6/c\u0027ye göre 10 gün ve üzeri çalışanlar hariç tutulduğundan, 10 günden az çalışanlar için genel kural (sigortalı sayılmama) geçerlidir.","ayirt":"Bu kişi ayda 10 gün eşiğinin altında mı çalışıyor?","paragraf":"5510 s.K. m.6/1-c","yanilgi":"Ev hizmetinde çalışan herkesin, kaç gün çalıştığına bakılmaksızın sigortasız sayıldığını düşünenler bu şıkkı gözden kaçırır."}},"verilen":[[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 108"},"kural":"6356 sayılı Kanun m.40/6 uyarınca yetki için başvurulduktan sonra işlem tamamlanıncaya kadar veya yetki belgesi alındıktan sonra yetki devam ettiği sürece, kapsama giren işyerleri için teşmil kararı alınamaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 108","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Teşmil sorularında önce \u0027yetki süreci var mı\u0027 kontrol edilir; varsa teşmil kararı hiç tartışılmadan elenir.","konu":"teşmil kararı","tablo":{"satirlar":[["VERİLENLER","-","-"],["Yetki durumu","başvuru yapılmış, belge alınmamış","-"],["HESAP","-","-"],["A) Yetki başvurusu sürecinde olduğundan, işlem tamamlanınca…","p.40/6","doğru ifade"],["B) Yetki belgesi alınmadığı sürece teşmil kararı, Yüksek Ha…","p.40/1","YANLIŞ ifade"],["C) Teşmil kararının yürürlük tarihi, Resmî Gazete\u0027de yayım …","p.40/2","YANLIŞ ifade"],["D) Yetki başvurusu teşmil kararı alınmasını etkilemez; Cumh…","p.40/1,6","YANLIŞ ifade"],["E) Teşmil kararı alındıktan sonra işyerinde yeni toplu iş s…","p.40/7","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Teşmil kararının yürürlük tarihi, Resmî Gazete\u0027de yayım tarihinden önceki bir tarih olarak belirlenebilir.","E":"Teşmil kararı alındıktan sonra işyerinde yeni toplu iş sözleşmesi yapılması, teşmilin sona ermesi için ayrıca Cumhurbaşkanı kararı gerektirir.","A":"Yetki başvurusu sürecinde olduğundan, işlem tamamlanıncaya kadar bu işyeri için teşmil kararı alınamaz.","D":"Yetki başvurusu teşmil kararı alınmasını etkilemez; Cumhurbaşkanı, Yüksek Hakem Kurulunun görüşünü almaksızın teşmil kararı alabilir.","B":"Yetki belgesi alınmadığı sürece teşmil kararı, Yüksek Hakem Kurulunun onayı olmaksızın doğrudan yürürlüğe girer."},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.40","metin":"MADDE 40 – (1) Cumhurbaşkanı; teşmili yapılacak işyerinin kurulu bulunduğu işkolunda en çok üyeye sahip sendikanın yapmış olduğu bir toplu iş sözleşmesini, o işkolundaki işçi veya işveren sendikalarının veya ilgili işverenlerden birinin ya da Çalışma ve Sosyal Güvenlik Bakanının talebi üzerine, Yüksek Hakem Kurulunun görüşünü aldıktan sonra tamamen veya kısmen ya da zorunlu değişiklikleri yaparak, o işkolunda toplu iş sözleşmesi bulunmayan işyeri veya işyerlerine teşmil edebilir. Yüksek Hakem Kurulu bu konudaki görüşünü on beş iş günü içinde bildirir.4 (2) Teşmil kararında teşmilin gerekçesi açıklanır. Yürürlüğe gireceği tarih de belirtilmek suretiyle teşmil kararı Resmî Gazete’de yayımlanır, ancak yürürlük tarihi Resmî Gazete’de yayım tarihinden önceki bir tarih olarak belirlenemez. (3) Teşmil edilen toplu iş sözleşmesinin sona ermesi ile teşmil kararı da ortadan kalkar. (4) Cumhurbaşkanı teşmil kararını, gerekçesini de açıklayarak gerekli gördüğünde yürürlükten kaldırabilir.5 (5) Toplu iş sözleşmesinin, tarafların hak ve borçlarını düzenleyen hükümleri ile özel hakeme başvurma hakkındaki hükümleri teşmil edilemez. (6) Yetki için başvurulduktan sonra bu işlem tamamlanıncaya kadar veya yetki belgesi alındıktan sonra yetki devam ettiği sürece, kapsama giren işyerleri için teşmil kararı alınamaz. (7) Toplu iş sözleşmesinin teşmil edildiği işletme veya işyerinde her zaman yetki için başvurulabilir ve yeni toplu iş sözleşmesinin yapılmasıyla birlikte teşmil uygulaması kendiliğinden sona erer. SEKİZİNCİ BÖLÜM Toplu İş Sözleşmesinin Yapılması Yetki"},{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.48","metin":"MADDE 48 – (1) Toplu görüşmenin sonunda bir anlaşmaya varılırsa dört nüsha olarak düzenlenecek olan toplu iş sözleşmesi, taraf temsilcilerince imzalanır ve iki nüshası altı iş günü içinde çağrıyı yapan tarafça görevli makama tevdi edilir. Görevli makam sözleşmenin bir nüshasını Bakanlığa gönderir. (2) İşveren, bir toplu iş sözleşmesi veya toplu iş sözleşmesi hükmündeki özel hakem veya Yüksek Hakem Kurulu kararı ile toplu hak uyuşmazlıklarında verilmiş mahkeme veya özel hakem kararlarını, işyeri veya işyerlerinde işçiler tarafından görülebilecek yerlere asmakla yükümlüdür. DOKUZUNCU BÖLÜM Toplu İş Uyuşmazlıklarının Çözümü Uyuşmazlığın tespiti"}],"hakem":"Soru, teşmil kararının alınabilirliğine ilişkin koşulları sormakta; doğru sık (A), 6356 sayılı Kanun m.40/6\u0027da açıkça belirtilen ve yetki başvurusu sürecinde teşmil engelini doğru ifade etmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Teşmil kararının yürürlük tarihi, Resmî Gazete\u0027de yayımlandığı tarihten önceki bir tarih olamaz. Geçmişe etkili yürürlüğe girmesi yasaktır.","E":"Yeni toplu iş sözleşmesi yapılınca teşmil uygulaması kendiliğinden sona erer; ayrı bir Cumhurbaşkanı kararına gerek yoktur.","D":"Yetki süreci teşmil kararını engeller ve bu arada Yüksek Hakem Kurulu görüşü de şarttır. İki kural birlikte çalışır, çünkü yetki başvurusu yapıldığında teşmil kararı alınamaz.","B":"Teşmil kararı, Yüksek Hakem Kurulu görüşü olmaksızın alınamaz. Kanun, böyle bir işyeri için hiç teşmil kararı alınmasını engellediği için, görüş alınmadan doğrudan yürürlüğe giriş söz konusu bile değildir."},"dogru":"İşyerinde yetki belgesi alınması için başvuru devam ediyor. Kanun, yetki süreci tamamlanıncaya kadar bu işyeri için teşmil kararı alınmasını yasaklıyor. Bu nedenle şu an teşmil kararı alınamaz.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 40. madde 6. fıkrası.","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 40. madde","tanim":"En çok üyeye sahip sendikanın yaptığı toplu iş sözleşmesinin, toplu iş sözleşmesi bulunmayan başka işyerlerine uygulanması.","ad":"teşmil"},{"kaynak":"Sendikalar ve TİS K. 40. madde","tanim":"Bir sendikanın, belirli bir işyerinde toplu iş sözleşmesi yapmaya yetkili olduğunu gösteren resmi belge.","ad":"yetki belgesi"},{"kaynak":"Sendikalar ve TİS K. 40. madde","tanim":"Cumhurbaşkanı tarafından teşmil kararı alınmadan önce alınması zorunlu olan, ilgili kurumun tavsiyesidir.","ad":"Yüksek Hakem Kurulu görüşü"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"İnşaat işkolundaki bir işyerinde toplu iş sözleşmesi yetkisi için başvuru yapılmış, yetki belgesi henüz alınmamıştır. Aynı işkolunda en çok üyeye sahip sendikanın yaptığı toplu iş sözleşmesinin bu işyerine teşmili istenmektedir. 6356 sayılı Kanuna göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t2-issgk-cokzor/kp-09","verilenler":[{"deger":"başvuru yapılmış, belge alınmamış","anlam":"m.40/6 kapsamında teşmil kararı engelini tetikleyen olgu","ad":"Yetki durumu"}],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.40/1, m.40/2, m.40/6, m.40/7","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: tekstil işkolundaki bir fabrikada 3 Mart\u0027ta yetki başvurusu yapılmış, henüz yetki belgesi çıkmamış. Aynı işkolunda en çok üyeye sahip sendika, başka bir işverenle yaptığı toplu iş sözleşmesinin bu fabrikaya teşmilini istiyor.","anlatim":"Fabrikada yetki süreci daha sonuçlanmadı, ama teşmil talebi masada. Cumhurbaşkanına \u0027bu fabrikaya teşmil kararı çıkar mısın\u0027 diye soruluyor.","doldur":[]},{"formul":"Ne yapacağız: 6356 sayılı Kanun m.40 teşmil kararının nasıl alınacağını, hangi hallerde alınamayacağını ve nasıl sona ereceğini düzenliyor. Bu fabrikanın rakamlarıyla beş ifadeyi tek tek deneyeceğiz.","anlatim":"Kuralın omurgası şu: Yüksek Hakem Kurulu görüşü alınır, yürürlük tarihi geriye gidemez, yeni sözleşme yapılınca teşmil kendiliğinden biter, ama yetki süreci sürerken teşmil yasaktır. Şimdi A\u0027dan E\u0027ye bu fabrikada test edelim.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"p.40/6","karar":"doğru","anlatim":"Fabrikada yetki süreci hâlâ işliyor, işlem tamamlanmadı. m.40/6 tam bunu yasaklıyor: yetki için başvurulduktan sonra işlem bitmeden kapsama giren işyeri için teşmil kararı alınamaz.","formul":"Şık A: fabrikada yetki başvurusu daha sonuçlanmadan Cumhurbaşkanı bu işyeri için teşmil kararı alabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"p.40/1","karar":"yanlış","anlatim":"Cumhurbaşkanı teşmil kararı vermeden önce Yüksek Hakem Kurulunun görüşünü almak zorunda, bu şart hiçbir durumda kalkmıyor. Bu fabrikada da önce kurul görüşü gerekir.","formul":"Şık B: yetki belgesi yokken teşmil kararı, Yüksek Hakem Kurulunun onayı olmadan doğrudan yürürlüğe girer mi?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"p.40/2","karar":"yanlış","anlatim":"Kanun burada net: yürürlük tarihi yayım tarihinden önceki bir tarih olamaz. Fabrika için çıkacak karar da yayım tarihinden önceye çekilemez.","formul":"Şık C: teşmil kararının yürürlük tarihi Resmî Gazete\u0027de yayım tarihinden önceki bir tarih olarak belirlenebilir mi?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"p.40/1,6","karar":"yanlış","anlatim":"İkisi de yanlış: yetki süreci teşmili engelliyor, ayrıca kurul görüşü de her zaman şart. Fabrikada bu iki kural birlikte devrede, ikisini de görmezden gelemezsin.","formul":"Şık D: yetki başvurusu teşmil kararını etkilemez, Cumhurbaşkanı Yüksek Hakem Kurulunun görüşünü almadan karar alabilir mi diyor, doğru mu?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"p.40/7","karar":"yanlış","anlatim":"Hayır, m.40/7 açık: yeni toplu iş sözleşmesi yapılınca teşmil kendiliğinden sona eriyor. Fabrikada yeni sözleşme imzalandığı an teşmil otomatik biter, ayrı bir karara gerek yok.","formul":"Şık E: teşmil kararından sonra fabrikada yeni toplu iş sözleşmesi yapılırsa, teşmilin sona ermesi için ayrıca Cumhurbaşkanı kararı gerekir mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Fabrikada yetki süreci bitmeden teşmil kararı hiç çıkmaz, doğru şık bu yüzden A. Kendine hep şunu sor: bu işyerinde şu an yetki süreci mi işliyor?","doldur":[]}],"anahtar":[{"ornek":"teşmil","kok":"teşmil"},{"ornek":"fabrikada","kok":"fabrik"},{"ornek":"süreci","kok":"süreci"},{"ornek":"kararı","kok":"kararı"},{"ornek":"görüşü","kok":"görüşü"},{"ornek":"tarihi","kok":"tarihi"}],"konuGiris":{"harita":"Ne zaman teşmil kararı alınamaz: yetki başvurusu tamamlanana kadar veya yetki belgesi geçerliyken. Nasıl karar verilir: Cumhurbaşkanı, Yüksek Hakem Kurulunun görüşünü aldıktan sonra karar verir. Nasıl sona erer: teşmil edilen toplu iş sözleşmesinin sona ermesiyle veya yeni sözleşme yapılmasıyla kendiliğinden biter.","desen":"Sınav, yetki başvurusu devam ederken teşmil kararı alınıp alınamayacağını sorarak öğrenciyi süreçlerin çakışması konusunda test eder. Tuzak, öğrencinin en çok üyeli sendika şartını yeterli sanıp yetki sürecinin engelleyici etkisini gözden kaçırmasıdır. Bu soru m.40/6 fıkrası noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"bir işkolundaki toplu iş sözleşmesinin başka işyerlerine uygulanmasını sağlayan idari karar","ad":"t
