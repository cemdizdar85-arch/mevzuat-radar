.","anlatim":"Bu tek olayda beş farklı kişi var, her biri ayrı bir kural sorusu doğuruyor. Rakamlar ve tarihler hep aynı olayda geçecek.","doldur":[]},{"formul":"Ne yapacağız: m.39 ve m.34\u0027teki kuralları bu tarihlere ve kişilere uygulayacağız; hangi ifade HER ZAMAN doğru çıkıyor bulacağız.","anlatim":"İmza tarihi, yürürlük tarihi, üyelik tarihi ve işyeri sayısı hep bu olaydaki gibi somut olacak. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.39/7","karar":"yanlış","anlatim":"m.39/7 mutlak bir yasak koyar, görüşmelerde işvereni temsil eden kişi hiçbir zaman yararlanamaz. Sonradan üye olması bu yasağı kaldırmaz.","formul":"Şık A: Mehmet, toplu görüşmelerde işvereni temsil etti ve görüşmeler bitince sendikaya üye oldu; bu Mehmet\u0027i TİS\u0027ten yararlandırır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.39/3","karar":"doğru","anlatim":"m.39/3 imza ile yürürlük arasında sözleşmesi sona eren üyeyi, sona erme tarihine kadar korur. Bu kural istisnasız ve mutlak işler.","formul":"Şık C: Ayşe\u0027nin iş sözleşmesi 20 Ocak\u0027ta sona eriyor, imza 5 Ocak, yürürlük 1 Şubat; Ayşe 20 Ocak\u0027a kadar TİS\u0027ten yararlanır mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.39/4","karar":"yanlış","anlatim":"m.39/4 açıkça onay aranmadığını söyler, sadece dayanışma aidatı ödenmesi yeterlidir. Yararlanma talep tarihinden itibaren başlar.","formul":"Şık B: Üye olmayan bir işçi dayanışma aidatı ödemek istiyor, taraf sendikanın onayı gerekir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.34/2","karar":"yanlış","anlatim":"m.34/2 gereği aynı işverene ait aynı işkolunda birden çok işyeri varsa TİS ancak işletme düzeyinde yapılabilir. İşyeri düzeyi seçeneği burada tamamen kapanır.","formul":"Şık D: İşverenin aynı işkolunda 4 işyeri varsa, bunlardan birinde işyeri düzeyinde TİS yapılabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.39/2","karar":"yanlış","anlatim":"m.39/2\u0027ye göre imza sonrası üye olanlar üyeliğin işverene bildirildiği tarihten itibaren yararlanır. Bildirim şartı beklenmeden yararlanma başlamaz.","formul":"Şık E: İmza sonrası üye olan işçi, üyeliği işverene bildirilmeden hemen sözleşmeden yararlanır mı?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Sadece imza-yürürlük arasında sözleşmesi sona eren üyeyi koruyan kural mutlaktır, gerisi hep bir şarta bağlıdır. Kendine sor: bu ifade herhangi bir koşula bağlı mı, yoksa istisnasız mı işliyor?","doldur":[]}],"anahtar":[{"ornek":"tarihi","kok":"tarihi"},{"ornek":"sözleşmesinin","kok":"sözleş"},{"ornek":"yararlanma","kok":"yararl"},{"ornek":"yürürlük","kok":"yürürl"},{"ornek":"olayda","kok":"olayda"},{"ornek":"işyeri","kok":"işyeri"}],"konuGiris":{"harita":"Ne zaman test edilir: Kapsam ve yararlanma koşullarının hangi durumda \u0027her zaman doğru\u0027 olduğu sorulduğunda test edilir. Nasıl ölçülür: Madde 34 ve 39\u0027daki istisnasız kurallar ile şarta bağlı kurallar ayırt edilerek ölçülür. Nasıl kaydedilir: Doğru seçenek, hiçbir istisnası olmayan kural cümlesi olarak kaydedilir.","desen":"Sınav genellikle m.39\u0027daki şarta bağlı yararlanma durumlarını (dayanışma aidatı, imza sonrası üyelik) \u0027her zaman doğru\u0027 gibi gösterip yanıltır. Doğru seçenek, istisnasız kesin kuralı içerir; diğerleri şarta bağlıdır. Bu soru m.34 ve m.39 hükümlerinin kapsam-yararlanma ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Aynı işverene ait birden çok işyerinde zorunlu uygulanan sözleşme türü","ad":"İşletme toplu iş sözleşmesi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Üye olmayanın sözleşmeden yararlanmak için ödediği bedel","ad":"Dayanışma aidatı","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Üyenin sözleşme haklarından fiilen faydalanmaya başladığı an","ad":"Yararlanma tarihi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Birden çok işverene ait işyerlerini kapsayan anlaşmalı sözleşme türü","ad":"Grup toplu iş sözleşmesi","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Soruda toplu iş sözleşmesinin kapsamı ve yararlanma koşullarına dair durumlar verilir, hangisinin istisnasız doğru olduğu istenir.","panel_ornek":"Bir apartmanda 5 daire sahibi ortak bir bahçe bakım anlaşması yapıyor; anlaşmaya sonradan katılan komşu, aidatını ödemeden faydalanamıyor. Aidat ödeyen komşu ise ödeme tarihinden itibaren bahçe hizmetinden yararlanıyor. Ödemeyen ise hiç yararlanamıyor, bu net bir kural.","ornek":"Bir apartmanda 5 daire sahibi ortak bir bahçe bakım anlaşması yapıyor; anlaşmaya sonradan katılan komşu, aidatını ödemeden faydalanamıyor. Aidat ödeyen komşu ise ödeme tarihinden itibaren bahçe hizmetinden yararlanıyor. Ödemeyen ise hiç yararlanamıyor, bu net bir kural.","yontemler":"Her seçenekte \u0027her zaman\u0027 ifadesinin şarta bağlı olup olmadığını kontrol et; şart içeren seçenekleri hemen ele.","nedir":"Toplu iş sözleşmesi, işkolu/işletme düzeyinde uygulanan ve kimlerin yararlanacağını belirleyen bir sözleşme türüdür. Sınav, kapsam kuralları ile yararlanma koşullarının hangi durumda kesin uyguladığını ölçer."},"olay":"","tuzak":{"D":{"ad":"İşyeri-İşletme Kesişimi Tuzağı","metin":"işletme düzeyi şartının esnetilebileceğini, tarafların anlaşmasıyla işyeri düzeyinde de yapılabileceğini düşünürsün. Doğrusu: m.34/2 gereği aynı işverene ait aynı işkolundaki birden çok işyerinde toplu iş sözleşmesi ANCAK işletme düzeyinde yapılabilir."},"E":{"ad":"Tarih Karışıklığı Tuzağı","metin":"yararlanmanın üyelik tarihinden başladığını sanırsın. Doğrusu: m.39/2\u0027ye göre imza tarihinden sonra üye olanlar, üyeliğin taraf işçi sendikasınca işverene BİLDİRİLDİĞİ tarihten itibaren yararlanır, üyelik tarihinden değil."},"A":{"ad":"İstisnanın Zamanla Kalkması Tuzağı","metin":"işveren vekili sıfatının sonradan üyelikle ortadan kalkacağını sanırsın. Doğrusu: m.39/7 mutlak bir yasaktır; TİS görüşmelerine işvereni temsilen katılan kişi hiçbir şekilde o sözleşmeden yararlanamaz."},"B":{"ad":"Onay Tuzağı","metin":"dayanışma aidatı ödeyerek yararlanmanın sendikanın iznine bağlı olduğunu düşünürsün. Doğrusu: m.39/4\u0027e göre bunun için işçi sendikasının onayı aranmaz, yararlanma talep tarihinden itibaren geçerli olur."}},"celdiriciYol":{},"hap":"Toplu iş sözleşmesinin işyeri/işletme düzeyindeki kapsamı ile sözleşmeden yararlanma kuralları birbirinden bağımsız iki kural setidir; biri diğerinin istisnası sayılamaz.","teshis":{"D":{"gercek":"m.34/2 gereği aynı işverene ait aynı işkolunda birden çok işyeri varsa TİS ancak işletme düzeyinde yapılabilir, işyeri düzeyi kapanır.","ayirt":"Bu işverenin aynı işkolunda başka işyeri var mı?","paragraf":"6356 s.K. m.34/2","yanilgi":"İşletme düzeyi şartının tercihe bağlı olduğunu düşünürsün."},"E":{"gercek":"m.39/2\u0027ye göre imza sonrası üye olanlar, üyeliğin işverene BİLDİRİLDİĞİ tarihten itibaren yararlanır.","ayirt":"Üyelik işverene ne zaman bildirildi?","paragraf":"6356 s.K. m.39/2","yanilgi":"Yararlanmanın üyelik anından başladığını sanırsın."},"A":{"gercek":"m.39/7 mutlak bir yasaktır, TİS görüşmelerinde işvereni temsil eden kişi hiçbir zaman o sözleşmeden yararlanamaz.","ayirt":"Bu kişi görüşmelerde işvereni mi temsil etti?","paragraf":"6356 s.K. m.39/7","yanilgi":"İşveren vekili/temsilci istisnasının sonradan üyelikle kalkacağını sanırsın."},"C":{"gercek":"m.39/3\u0027e göre imza-yürürlük arası sona eren üye, sözleşmesinin sona erdiği tarihe kadar TİS\u0027ten yararlanmaya devam eder.","ayirt":"Sözleşme, imza ile yürürlük tarihi arasında mı sona erdi ve kişi o an üye miydi?","paragraf":"6356 s.K. m.39/3","yanilgi":"Bu şıkkı eleyen öğrenci, sözleşme sona erdiğinde tüm hakların da anında biteceğini sanır."},"B":{"gercek":"m.39/4 açıkça onay aranmadığını, yararlanmanın talep tarihinden geçerli olduğunu belirtir.","ayirt":"Kanun burada bir onay şartı koymuş mu?","paragraf":"6356 s.K. m.39/4","yanilgi":"Dayanışma aidatının sendika onayına bağlı olduğunu düşünürsün."}},"verilen":[],"donem":6,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 109"},"kural":"Madde 11\u0027e göre esaslı bir neden olmadıkça belirli süreli sözleşme zincirleme yapılamaz, aksi halde sözleşme başlangıçtan itibaren belirsiz süreli kabul edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 109","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 11 sorularında \u0027esaslı neden var mı yok mu\u0027 ayrımını önce yap, sonuç ona göre değişir.","konu":"is sözleşmesi turleri","tablo":{"satirlar":[["A) Esaslı nedene dayalı olarak zincirleme yapılan iş sözleş…","İş K. m.11/3-4","YANLIŞ ifade"],["B) Zincirleme sözleşme belirsiz süreli sayılırsa bu dönüşüm…","İş K. m.11/3","YANLIŞ ifade"],["C) Belirli bir işin tamamlanması gibi objektif bir koşula b…","İş K. m.11/2","YANLIŞ ifade"],["D) Süreye bağlı olmaksızın kurulan bir iş sözleşmesi de tar…","İş K. m.11/1","YANLIŞ ifade"],["E) Esaslı bir neden olmadan üst üste yapılan belirli süreli…","İş K. m.11/3","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Belirli bir işin tamamlanması gibi objektif bir koşula bağlı yapılan iş sözleşmesi, yazılı şekil şartı aranmaksızın sözlü olarak da kurulabilir.","E":"Esaslı bir neden olmadan üst üste yapılan belirli süreli iş sözleşmesi, başlangıcından itibaren belirsiz süreli iş sözleşmesi kabul edilir.","A":"Esaslı nedene dayalı olarak zincirleme yapılan iş sözleşmeleri de bu durumda belirli süreli olma özelliğini kaybeder ve belirsiz süreliye döner.","D":"Süreye bağlı olmaksızın kurulan bir iş sözleşmesi de taraflarca anlaşılarak belirli süreli iş sözleşmesi sayılabilir.","B":"Zincirleme sözleşme belirsiz süreli sayılırsa bu dönüşüm yalnızca son yenilenen sözleşme bakımından, yani en son yapılan tarihten itibaren geçerli olur."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.11","metin":"Madde 11 - İş ilişkisinin bir süreye bağlı olarak yapılmadığı halde sözleşme belirsiz süreli sayılır. Belirli süreli işlerde veya belli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak işveren ile işçi arasında yazılı şekilde yapılan iş sözleşmesi belirli süreli iş sözleşmesidir. Belirli süreli iş sözleşmesi, esaslı bir neden olmadıkça, birden fazla üst üste (zincirleme) yapılamaz. Aksi halde iş sözleşmesi başlangıçtan itibaren belirsiz süreli kabul edilir. Esaslı nedene dayalı zincirleme iş sözleşmeleri, belirli süreli olma özelliğini korurlar. Belirli ve belirsiz süreli iş sözleşmesi ayırımın sınırları"}],"hakem":"Soru, İş Kanunu m.11\u0027de yer alan esaslı neden olmaksızın zincirleme belirli süreli sözleşmelerin başlangıçtan itibaren belirsiz süreli kabul edileceği kuralını doğru olarak ölçmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Belirli bir işin tamamlanmasına bağlı sözleşmenin sözlü yapılabileceğini sanır. Oysa bu tür sözleşmeler yazılı şekilde yapılmak zorundadır.","A":"Geçerli bir nedene dayalı zincirleme sözleşmelerin belirsiz süreliye dönüşeceğini sanır. Oysa kanunda geçerli nedene dayalı zincirleme sözleşmeler belirli süreli kalır.","D":"Taraflar anlaşarak süreli olmayan ilişkiyi belirli süreli hale getirebileceklerini düşünür. Oysa kanun, süresi belirtilmemişse sözleşme kanunen belirsiz süreli sayılır; taraf iradesi bunu değiştiremez.","B":"Dönüşümün sadece son sözleşmeden başlayarak geçerli olacağını düşünür. Oysa hiçbir neden yoksa tüm sözleşme başlangıcından itibaren belirsiz süreli sayılır."},"dogru":"İşçiyle üst üste üç kez belirli süreli sözleşme yapılmışsa ve hiçbir geçerli neden yoksa, kanun bu sözleşmeyi başından itibaren belirsiz süreli sayar. İşçi belirsiz süreli işçi haklarından yararlanır.","sinav":"İş Kanunu 11. madde uyarınca esaslı bir neden olmaksızın üst üste yapılan belirli süreli iş sözleşmesi başlangıçtan itibaren belirsiz süreli iş sözleşmesi kabul edilir.","kavramlar":[{"kaynak":"İş Kanunu 11. madde","tanim":"Belirli bir dönem, belirli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşulların gerçekleşmesine kadar süren ve işveren ile işçi arasında yazılı şekilde yapılan sözleşme.","ad":"Belirli süreli iş sözleşmesi"},{"kaynak":"İş Kanunu 11. madde","tanim":"Belirli süreli iş sözleşmesinin, esaslı bir neden olmaksızın birden fazla kez arka arkaya yenilenerek yapılması durumu.","ad":"Zincirleme sözleşme"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":5,"ornekler":[],"donemler":["2026/1","2025/2","2022/1","2019/2","2017/3"]},"oyun":null,"tip":"teori","soru":"Bir işçiyle, esaslı bir neden bulunmaksızın art arda üç kez belirli süreli iş sözleşmesi yapılmıştır. 4857 sayılı İş Kanunu\u0027na göre bu duruma ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-zor/kp-04","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.11","dogru":"E","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da mobilya atölyesi sahibi Turgut Bey, işçi Kemal ile 2019, 2020 ve 2021 yıllarında art arda üçer kez birer yıllık \u0027belirli süreli\u0027 iş sözleşmesi imzalıyor; ortada belirli bir işin bitmesi gibi esaslı bir neden yok, sadece kıdem tazminatından kaçınma isteği var.","anlatim":"Kemal 2022\u0027de işten çıkarılınca \u0027ben aslında belirsiz süreli çalışıyordum\u0027 diyor. Bu olay tam da Madde 11\u0027in zincirleme yasağı hükmünü tetikliyor.","doldur":[]},{"formul":"Ne yapacağız: Kemal\u0027in üç sözleşmesine bakıp \u0027esaslı neden var mı, yoksa zincirleme mi\u0027 diye soracağız; esaslı neden yoksa sözleşme başlangıcından itibaren belirsiz sayılır.","anlatim":"Şimdi beş ifadeyi bu atölye olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"İş K. m.11/3-4","karar":"yanlış","anlatim":"Hayır, esaslı nedene dayalı zincirleme sözleşmeler belirli süreli özelliğini korur. Kemal\u0027in olayında esaslı neden yok, ama olsaydı sonuç değişirdi.","formul":"Şık A: Turgut Bey \u0027benim zincirlemem esaslı nedene dayansaydı da yine belirsiz süreliye dönerdi\u0027 diyor, haklı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"İş K. m.11/3","karar":"yanlış","anlatim":"Hayır, kanun \u0027başlangıçtan itibaren\u0027 der; yani Kemal\u0027in ilk sözleşmesi olan 2019\u0027dan beri belirsiz süreli sayılır. Dönüşüm geçmişe işler.","formul":"Şık B: Kemal\u0027in avukatı \u0027dönüşüm sadece 2021\u0027deki son sözleşmeden itibaren geçerli olur\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"İş K. m.11/2","karar":"yanlış","anlatim":"Hayır, objektif koşula bağlı belirli süreli sözleşme yazılı şekilde yapılmak zorunda. Sözlü yapılsaydı bu sözleşme geçerli bir belirli süreli sayılmazdı.","formul":"Şık C: Turgut Bey \u0027ben Kemal\u0027le objektif koşula bağlı sözleşmeyi sözlü de yapabilirdim\u0027 diyor, haklı mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"İş K. m.11/1","karar":"yanlış","anlatim":"Hayır, süreye bağlı kurulmayan sözleşme kanunen belirsiz süreli sayılır. Taraflar isim koysa da hukuki nitelik değişmez.","formul":"Şık D: Turgut Bey ile Kemal \u0027süreye bağlamadık ama biz buna belirli süreli diyoruz\u0027 diye anlaşsalar, bu geçerli olur mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"İş K. m.11/3","karar":"doğru","anlatim":"Evet, esaslı neden olmadan zincirleme yapılan sözleşme başlangıcından itibaren belirsiz süreli kabul edilir. Kemal\u0027in olayı tam bu hükmün örneği.","formul":"Şık E: Kemal \u0027benim 2019\u0027dan beri ki çalışmam esaslı neden yokken üst üste yapıldığı için baştan beri belirsiz süreliydi\u0027 diyor, haklı mı?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Zincirlemenin arkasında esaslı bir neden yoksa sözleşme baştan beri belirsiz süreli sayılır, bunu unutma. Kendine hep şunu sor: bu zincirlemenin arkasında gerçek bir esaslı neden var mı?","doldur":[]}],"anahtar":[{"ornek":"süreli","kok":"süreli"},{"ornek":"sözleşme","kok":"sözleş"},{"ornek":"zincirleme","kok":"zincir"},{"ornek":"esaslı","kok":"esaslı"},{"ornek":"belirsiz","kok":"belirs"},{"ornek":"belirli","kok":"belirl"}],"konuGiris":{"harita":"Ne zaman belirsiz süreli sayılır: esaslı bir neden olmadan zincirleme belirli süreli sözleşme yapıldığında. Nasıl ölçülür: sözleşmelerin objektif koşula mı yoksa keyfi tekrara mı dayandığına bakılarak. Nasıl kaydedilir: dönüşüm başlangıç tarihinden itibaren geçerli sayılır, ilk sözleşmeye kadar geriye işler.","desen":"Sınav genelde art arda kaç kez yapıldığı, esaslı neden olup olmadığı ve dönüşümün hangi tarihten geçerli olduğu üzerinden şık kurar. Tuzak, \u0027esaslı nedene dayanan zincirleme sözleşme de belirsiz olur mu\u0027 sorusudur; oysa esaslı nedenli zincirleme belirli süreli kalır. Bu soru m.11\u0027in üçüncü ve dördüncü cümlesi noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Objektif bir koşula bağlı, yazılı yapılan, süresi önceden belli sözleşme","ad":"Belirli süreli iş sözleşmesi","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Sözleşmenin tekrarını haklı kılan objektif, işin niteliğinden doğan sebep","ad":"Esaslı neden","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Aynı taraflar arasında art arda birden fazla belirli süreli sözleşme yapılması","ad":"Zincirleme sözleşme","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Esaslı neden yokken zincirleme yapılan sözleşmenin baştan itibaren süresiz kabul edilmesi","ad":"Belirsiz süreli sayılma","kim":"kanun sabitler"}],"sinavda":"Soruda esaslı neden bulunmaksızın art arda yapılan belirli süreli sözleşme sayısı verilir, sonucun hukuki niteliği istenir.","panel_ornek":"Bir kafe, sırf yaz sezonu için üç ay boyunca aynı garsonla art arda beş kez \u0027iki haftalık\u0027 sözleşme imzalasa, mahkeme bu ilişkiyi tek bir sürekli çalışma sayar. Çünkü ortada mevsim bitince tekrar başlayacak farklı bir iş yoktur, sadece aynı işin bölünmüş halidir. Bu yüzden yapay bölme geçersiz sayılır.","ornek":"Bir kafe, sırf yaz sezonu için üç ay boyunca aynı garsonla art arda beş kez \u0027iki haftalık\u0027 sözleşme imzalasa, mahkeme bu ilişkiyi tek bir sürekli çalışma sayar. Çünkü ortada mevsim bitince tekrar başlayacak farklı bir iş yoktur, sadece aynı işin bölünmüş halidir. Bu yüzden yapay bölme geçersiz sayılır.","yontemler":"Kritik kural: esaslı neden yoksa zincirleme sözleşme başlangıçtan itibaren belirsiz süreli sayılır, ileriye değil geriye işler.","nedir":"İş sözleşmesi türleri, işçi ile işverenin çalışma ilişkisini süreye bağlı olup olmadığına göre sınıflandırır. Sınav, hangi koşulda sözleşmenin belirsiz süreliye dönüştüğünü ölçer."},"olay":"","tuzak":{"C":{"ad":"Şekil Şartı Tuzağı","metin":"Objektif koşula bağlı sözleşmenin sözlü kurulabileceğini sanıyorsun. Doğrusu: Bu sözleşme işveren ile işçi arasında yazılı şekilde yapılmak zorundadır."},"A":{"ad":"Zincirleme Tuzağı","metin":"Esaslı nedene dayalı zincirleme sözleşmelerin belirsiz süreliye döneceğini sanıyorsun. Doğrusu: Madde 11 uyarınca esaslı nedene dayalı zincirleme sözleşmeler belirli süreli olma özelliğini korur."},"D":{"ad":"Kapsam Tuzağı","metin":"Sürenin taraf iradesiyle belirlenebileceğini sanıyorsun. Doğrusu: İş ilişkisi bir süreye bağlı olarak yapılmadıysa sözleşme kanunen belirsiz süreli sayılır, taraf iradesi bunu değiştiremez."},"B":{"ad":"Zamanlama Tuzağı","metin":"Dönüşümün yalnızca son yenilemeden itibaren gerçekleştiğini sanıyorsun. Doğrusu: Esaslı neden yoksa sözleşme başlangıcından itibaren belirsiz süreli kabul edilir."}},"celdiriciYol":null,"hap":"Esaslı neden olmadan zincirleme yapılan belirli süreli sözleşme, başlangıcından itibaren belirsiz süreli sayılır.","teshis":{"C":{"gercek":"Madde 11 bu sözleşmeyi \u0027yazılı şekilde yapılan\u0027 sözleşme olarak tanımlar; yazılı şekil kurucu unsurdur.","ayirt":"Metinde \u0027yazılı şekilde\u0027 ibaresini gördün mü?","paragraf":"İş K. m.11/2","yanilgi":"Objektif koşula bağlı sözleşmenin de diğer belirsiz süreli sözleşmeler gibi şekle tabi olmadığını sanıyorsun."},"E":{"gercek":"Madde 11 açıkça esaslı neden yokluğunda zincirlemeyi yaptırıma bağlar: sözleşme başlangıcından itibaren belirsiz süreli sayılır.","ayirt":"Zincirlemenin arkasında esaslı bir neden yoksa kanunun öngördüğü sonuç nedir diye sordun mu?","paragraf":"İş K. m.11/3","yanilgi":"Bu şıkkı elerken zincirleme yasağının yalnız \u0027sık tekrar\u0027 göstergesi olduğunu, hukuki sonucunun ağır olmadığını sanıyorsun."},"A":{"gercek":"Madde 11\u0027e göre esaslı nedene dayalı zincirleme sözleşmeler belirli süreli olma özelliğini korur; yaptırım yalnız esaslı neden YOKSA uygulanır.","ayirt":"Zincirlemenin arkasında gerçek bir esaslı neden var mı diye sordun mu?","paragraf":"İş K. m.11/3-4","yanilgi":"Esaslı nedene dayalı zincirlemenin de belirsiz süreliye dönüştüğünü sanıyorsun."},"D":{"gercek":"İş ilişkisi bir süreye bağlı olarak kurulmadıysa sözleşme kanunen belirsiz süreli sayılır; bu nitelendirme taraf iradesinden bağımsızdır.","ayirt":"Sözleşmede gerçek bir süre veya objektif koşul var mı, yoksa yalnızca isim mi verilmiş diye sordun mu?","paragraf":"İş K. m.11/1","yanilgi":"Belirli-belirsiz süreli ayrımının taraf iradesiyle serbestçe belirlenebileceğini sanıyorsun."},"B":{"gercek":"Kanun metni açıkça \u0027başlangıçtan itibaren belirsiz süreli kabul edilir\u0027 der; dönüşüm geçmişe etkilidir.","ayirt":"Kanun \u0027başlangıçtan itibaren\u0027 mi diyor, \u0027bundan böyle\u0027 mi diyor diye metne baktın mı?","paragraf":"İş K. m.11/3","yanilgi":"Dönüşümün geriye değil ileriye, son sözleşmeden itibaren işlediğini sanıyorsun."}},"verilen":[],"donem":5,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/1 Soru 109"},"kural":"İş Kanunu m.11 esaslı neden olmadan zincirleme belirli süreli sözleşmeyi başlangıçtan itibaren belirsiz süreli sayar; ayrıca işyeri devri sözleşmenin nispiliği ilkesinin istisnasıdır, devralan işçilerin sözleşmesine devreden ile birlikte taraf olur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/1 Soru 109","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İki kuralın kesiştiği olaylarda önce her kuralı ayrı ayrı uygula, sonra sonuçları birleştir; tek kuralla cevaplama.","konu":"is sözleşmesi turleri","tablo":{"satirlar":[["A) Esaslı neden olmadan yapılan zincirleme belirli süreli s…","m.11; istisna-5","doğru ifade"],["B) İşyeri devri, sözleşmenin nispiliği ilkesinin mutlak biç…","istisna-5","YANLIŞ ifade"],["C) Esaslı neden olmaksızın zincirleme yapılan belirli sürel…","m.11","YANLIŞ ifade"],["D) İşyeri devri, tarafların iradesi dışında borç doğurduğun…","istisna-5","YANLIŞ ifade"],["E) Zincirleme belirli süreli sözleşme esaslı nedene dayansa…","istisna-5","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Esaslı neden olmaksızın zincirleme yapılan belirli süreli sözleşme belirli süreli olma özelliğini korur; işyeri devri bu özelliği etkilemez.","E":"Zincirleme belirli süreli sözleşme esaslı nedene dayansa da dayanmasa da devir halinde yalnız devralan işletme sorumlu olur, devreden işveren sorumluluktan kurtulur.","A":"Esaslı neden olmadan yapılan zincirleme belirli süreli sözleşme başlangıçtan itibaren belirsiz süreli sayılır ve işyerini devralan (B) işletmesi bu sözleşmeye devreden ile birlikte taraf olur.","D":"İşyeri devri, tarafların iradesi dışında borç doğurduğundan sözleşmenin nispiliği ilkesinin bir istisnası değil, bu ilkenin doğrudan uygulanmasıdır.","B":"İşyeri devri, sözleşmenin nispiliği ilkesinin mutlak biçimde korunduğu bir haldir; bu nedenle (B) işletmesi işçinin sözleşmesine taraf olmaz, sözleşme yalnız (A) ile devam eder."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.11","metin":"Madde 11 - İş ilişkisinin bir süreye bağlı olarak yapılmadığı halde sözleşme belirsiz süreli sayılır. Belirli süreli işlerde veya belli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak işveren ile işçi arasında yazılı şekilde yapılan iş sözleşmesi belirli süreli iş sözleşmesidir. Belirli süreli iş sözleşmesi, esaslı bir neden olmadıkça, birden fazla üst üste (zincirleme) yapılamaz. Aksi halde iş sözleşmesi başlangıçtan itibaren belirsiz süreli kabul edilir. Esaslı nedene dayalı zincirleme iş sözleşmeleri, belirli süreli olma özelliğini korurlar. Belirli ve belirsiz süreli iş sözleşmesi ayırımın sınırları"},{"ad":"TEORI - Sozlesmenin nispiligi ilkesi ve istisnalari","metin":"Sözleşmenin NİSPİLİĞİ (görecelilik) ilkesi, bir sözleşmenin yalnız tarafları arasında hüküm ve sonuç doğurmasını, üçüncü kişiler bakımından ne borç ne de kural olarak hak yaratmamasını ifade eder. Bu ilke borçlar hukukunun temel taşıdır: kimse iradesi dışında bir sözleşmeyle borç altına sokulamaz. İSTİSNALARI (üçüncü kişiye etki doğuran hâller): (1) ÜÇÜNCÜ KİŞİ YARARINA SÖZLEŞME — eksik üçüncü kişi yararına sözleşmede edim üçüncü kişiye ifa edilir ancak talep hakkı alacaklıdadır; TAM üçüncü kişi yararına sözleşmede üçüncü kişi borçludan ifayı DOĞRUDAN talep edebilir (hayat sigortasında lehtar tipik örnektir). (2) ÜÇÜNCÜ KİŞİNİN FİİLİNİ ÜSTLENME — burada üçüncü kişi borç altına girmez; üstlenen, üçüncü kişi edimi yerine getirmezse zararı gidermeyi taahhüt eder. (3) TAPUYA ŞERH EDİLEN KİŞİSEL HAKLAR — önalım, alım, geri alım, kira ve satış vaadi sözleşmelerinin tapu kütüğüne şerhi, bu kişisel hakkı sonraki maliklere karşı ileri sürülebilir kılar (eşyaya bağlı borç etkisi). (4) TAŞINMAZ SATIŞINDA VE KİRADA HALEFİYET — kiralananın el değiştirmesinde yeni malikin kira sözleşmesinin tarafı hâline gelmesi. (5) İŞLETMENİN/İŞ YERİNİN DEVRİ — devralanın işçilerin iş sözleşmelerine tarafı olarak halef olması ve devreden ile birlikte sorumluluğu. (6) SÖZLEŞME DEVRİ VE BORCUN ÜSTLENİLMESİ (alacaklının rızasıyla). (7) MİRASÇILARA GEÇİŞ — kişiye sıkı sıkıya bağlı olmayan sözleşme ilişkilerinin külli halefiyetle mirasçılara intikali. (8) EŞYAYA BAĞLI HAKLAR VE İRTİFAK/TAŞINMAZ YÜKÜ gibi aynı etkiyle üçüncü kişilere karşı ileri sürülebilen ilişkiler. Ayrıca üçüncü kişiyi koruyucu etkili söz…"}],"hakem":"Doğru sık, İş Kanunu m.11\u0027de açıkça yer alan esaslı neden olmadan zincirleme belirli süreli sözleşmenin başlangıçtan itibaren belirsiz süreli sayılması kuralı ile kaynak metinde detaylı anlatılan işletme/iş yeri devrinin sözleşmenin nispiliği ilkesinin istisnası olarak devralan işletmeyi sözleşmeye taraf kılan hükümlere dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"Esaslı neden olmadan üst üste yapılan belirli süreli sözleşme niteliği değiştirir; kanun bunu belirsiz süreli saymakla bu tür zincirleme sözleşmeyi engeller, devir bunu değiştirmez.","E":"İşyeri devrinde devralan sözleşmeye taraf olmakla birlikte, devreden işveren de sorumluluğundan kurtulmaz; her ikisi birlikte sorumluluk taşır.","D":"İşyeri devri tarafların iradesi dışında üçüncü kişiye (devralana) etki doğurduğu için nispilik ilkesinin kendisi değil tam aksine istisnasıdır; ilkenin uygulanması değil, istisnai hâlidir.","B":"Sözleşmenin nispiliği ilkesi normal halde üçüncü kişileri korur; ancak işyeri devri tam olarak bu ilkenin istisnasıdır ve devralan işçinin sözleşmesine taraf hâline gelir, sözleşme A ile yalnız devam etmez."},"dogru":"İşveren üst üste üç kez haklı neden olmaksızın belirli süreli sözleşme yaptığı için bu sözleşme baştan itibaren belirsiz süreli kabul edilir. İşyeri devredilince yeni işletme, eski işletme ile birlikte bu belirsiz süreli sözleşmenin tarafı olur.","sinav":"İş Kanunu 11. madde esaslı neden olmadan zincirleme belirli süreli sözleşmeyi başlangıçtan itibaren belirsiz süreli sayar ve işyeri devri sözleşmenin nispiliği ilkesinin istisnası olarak devralana halefiyeti sağlar.","kavramlar":[{"kaynak":"İş Kanunu 11. madde","tanim":"Haklı bir sebep gösterilmeksizin aynı işçi ile arka arkaya birden fazla kez belirli süreli sözleşme yapılmasıdır; bu durumda sözleşme başlangıçtan itibaren belirsiz süreli kabul edilir.","ad":"Esaslı neden olmadan zincirleme belirli süreli iş sözleşmesi"},{"kaynak":"TEORI","tanim":"Bir sözleşmenin yalnız tarafları arasında hüküm doğurması, üçüncü kişiler bakımından borç yaratmamasını ifade eder; kimse iradesi dışında bir sözleşmeyle borç altına sokulamaz.","ad":"Sözleşmenin nispiliği ilkesi"},{"kaynak":"TEORI","tanim":"İşletme veya işyeri el değiştirdiğinde devralanın işçilerin iş sözleşmelerine taraf hâline gelmesi ve devreden ile birlikte sorumlu olmasıdır; sözleşmenin nispiliği ilkesinin istisnasıdır.","ad":"İşletme/işyeri devri halefiyeti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":5,"ornekler":[],"donemler":["2026/1","2025/2","2022/1","2019/2","2017/3"]},"oyun":null,"tip":"teori","soru":"İşveren (A), işçisiyle esaslı bir neden bulunmaksızın üst üste üç kez belirli süreli iş sözleşmesi yapmış; son sözleşme devam ederken işyerini (B) işletmesine devretmiştir. Bu olaya ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-04","verilenler":[],"dayanak":"İş Kanunu (4857 s.K.) m.11; sözleşmenin nispiliği ilkesi ve istisnaları (işletme/iş yeri devri)","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: (C) Tekstil A.Ş., 2019-2021 arası satış elemanı Ayşe ile arka arkaya üç kez, hiçbir mevsimlik/proje gerekçesi olmadan 1\u0027er yıllık belirli süreli sözleşme imzalamış. 2021\u0027de üçüncü sözleşme sürerken işyerini (D) Perakende Ltd.\u0027ye devretmiş.","anlatim":"Ayşe işe devam ediyor ama artık maaş bordrosu (D)\u0027den geliyor.","doldur":[]},{"formul":"Ne yapacağız: önce Ayşe\u0027nin sözleşmesinin türüne bakacağız (esaslı neden var mı?), sonra devrin bu sözleşmeye etkisini soracağız; beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Tek olayda iki soru gizli: sözleşme ne, devir ne yapıyor. Beşini de bu iki soruya göre tartacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.11; istisna-5","karar":"doğru","anlatim":"Ayşe\u0027nin arka arkaya üç sözleşmesinde hiç esaslı neden yok, bu yüzden sözleşme başlangıçtan itibaren belirsiz süreli sayılır. Ayrıca işyeri devri nispiliğin istisnasıdır, (D) devralan olarak (C) ile birlikte bu sözleşmenin tarafı olur.","formul":"Şık A: Ayşe\u0027nin sözleşmesi baştan belirsiz süreli sayılır mı, ve (D) bu sözleşmeye (C) ile birlikte taraf olur mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"istisna-5","karar":"yanlış","anlatim":"Hayır, işletme devri tam da nispiliğin sekiz istisnasından biri. Ayşe\u0027nin sözleşmesi (D)\u0027yi de bağlar, mutlaklık burada çöker.","formul":"Şık B: Nispilik ilkesi burada mutlak mı işler, yani (D) hiçbir şekilde Ayşe\u0027nin sözleşmesine taraf olmaz mı diyeceksin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.11","karar":"yanlış","anlatim":"Hayır, esaslı neden yoksa zincirleme sözleşme belirli süreli kalamaz; kanun bunu açıkça belirsiz süreliye çevirir. Ayşe\u0027nin olayında bu koruma hiç işlemez.","formul":"Şık C: Ayşe\u0027nin sözleşmesi esaslı neden yokluğuna rağmen belirli süreli özelliğini korur mu diyeceksin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"istisna-5","karar":"yanlış","anlatim":"Hayır, ilke sözleşmeyi taraflarla sınırlar; (D) sözleşmenin tarafı değilken bağlanıyorsa bu tam olarak istisnadır. İlkenin kendisiyle istisnasını karıştırma.","formul":"Şık D: İşyeri devrini nispilik ilkesinin istisnası değil, ilkenin doğrudan uygulanması mı sayacaksın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"istisna-5","karar":"yanlış","anlatim":"Hayır, işletme devrinde devralan sözleşmeye taraf olur ama devreden işveren de kural olarak birlikte sorumlu kalır. Ayşe\u0027nin olayında (C) sahneden tamamen silinmez.","formul":"Şık E: Devirden sonra yalnız (D) mi sorumlu olur, (C) sorumluluktan tamamen kurtulur mu diyeceksin?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Ayşe\u0027nin olayında iki kural aynı anda çalışıyor: zincirleme sözleşme belirsizleşir, devir de devralanı taraf yapar. Kendine hep şunu sor: bu olayda tek kural mı yeterli, yoksa birden fazla kural üst üste mi işliyor?","doldur":[]}],"anahtar":[{"ornek":"sözleşme","kok":"sözleş"},{"ornek":"süreli","kok":"süreli"},{"ornek":"devralan","kok":"devral"},{"ornek":"istisnasıdır","kok":"istisn"},{"ornek":"belirsiz","kok":"belirs"},{"ornek":"birlikte","kok":"birlik"}],"konuGiris":{"harita":"Ne zaman belirsiz süreli sayılır: esaslı neden olmadan üst üste yapılan belirli süreli sözleşmelerde baştan itibaren. Nasıl ölçülür: sözleşmenin zincirleme yapılıp yapılmadığı ve objektif/esaslı bir nedenin bulunup bulunmadığına bakılarak. Nasıl kaydedilir: işyeri devrinde işçinin sözleşmesi kesintisiz biçimde devralana geçer.","desen":"Soru, üst üste esaslı nedensiz belirli süreli sözleşme yapılmasını işyeri devriyle birleştirerek iki kuralın aynı anda uygulanmasını ister. Öğrenciler genelde devri fark edip sözleşmenin türünü unutur ya da tersini yapar. Bu soru İş Kanunu m.11 ve işyeri devri/nispilik istisnası noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Objektif koşula bağlı, yazılı yapılan, süresi önceden belli sözleşme","ad":"Belirli süreli iş sözleşmesi","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Zincirleme belirli süreli sözleşmeyi haklı kılan objektif gerekçe","ad":"Esaslı neden","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Esaslı neden yoksa sözleşme başlangıçtan itibaren belirsiz süreli sayılır","ad":"Zincirleme sözleşme sonucu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Devralanın işçinin sözleşmesine halef olup devredenle birlikte sorumlu olması","ad":"İşyeri devri","kim":"kanun sabitler"}],"sinavda":"Zincirleme belirli süreli sözleşme hikâyesi ve ardından işyeri devri verilip sözleşmenin hukuki niteliği ile devralanın durumu sorulur.","panel_ornek":"Bir arkadaşın market marketiyle üç kez üst üste 1\u0027er aylık sözleşme imzaladığını, esaslı bir gerekçe olmadan yenilendiğini düşün. Dördüncü ayda market el değiştirse bile onun hakları yeni sahibiyle devam eder. Süreklilik esas alınır, kağıt üzerindeki \u0027geçici\u0027 etiketine bakılmaz.","ornek":"Bir arkadaşın market marketiyle üç kez üst üste 1\u0027er aylık sözleşme imzaladığını, esaslı bir gerekçe olmadan yenilendiğini düşün. Dördüncü ayda market el değiştirse bile onun hakları yeni sahibiyle devam eder. Süreklilik esas alınır, kağıt üzerindeki \u0027geçici\u0027 etiketine bakılmaz.","yontemler":"Önce zincirleme sözleşmenin esaslı nedene dayanıp dayanmadığını belirle, sonra devrin bu belirlenmiş türü değiştirmediğini, sadece tarafını değiştirdiğini uygula.","nedir":"İş sözleşmesi türleri, işçi ile işveren arasındaki bağın süreye bağlı olup olmadığını sınıflar. Sınav, zincirleme belirli süreli sözleşmenin ne zaman belirsiz süreliye dönüştüğünü ölçer."},"olay":"hesaplama gerektirmez, iki kuralın birlikte uygulanmasıdır.","tuzak":{"C":{"ad":"Zincirleme Sözleşme Tuzağı","metin":"öğrenci esaslı neden aranmadan da zincirleme belirli süreli sözleşmenin niteliğini koruduğunu sanır. Doğrusu: esaslı neden yoksa sözleşme başlangıçtan itibaren belirsiz süreli kabul edilir."},"E":{"ad":"Tek Taraflı Sorumluluk Tuzağı","metin":"öğrenci devirle devredenin sorumluluğunun tamamen sona erdiğini sanır. Doğrusu: işyeri devrinde devralan işçi sözleşmelerine taraf olur ancak devreden ile birlikte sorumluluk devam eder."},"D":{"ad":"Kavram Karışıklığı Tuzağı","metin":"öğrenci istisna ile ilkenin kendisini birbirine karıştırıp devri ilkenin uygulanması sanır. Doğrusu: işyeri devri, tarafların iradesi dışında üçüncü kişiye (devralana) etki doğurduğu için tam olarak nispiliğin istisnasıdır."},"B":{"ad":"Nispiliğin Mutlaklığı Tuzağı","metin":"öğrenci nispilik ilkesini istisnasız mutlak sanıp işyeri devrinde de üçüncü kişiye etki doğmayacağını düşünür. Doğrusu: işyeri/işletme devri, nispilik ilkesinin açık istisnalarından biridir; devralan işçinin sözleşmesine halef olur."}},"celdiriciYol":null,"hap":"Esaslı neden olmadan zincirleme yapılan belirli süreli sözleşme başlangıçtan itibaren belirsiz süreli sayılır ve işyeri devrinde devralan bu sözleşmeye devreden ile birlikte taraf olur.","teshis":{"C":{"gercek":"İş K. m.11 esaslı bir neden olmadıkça birden fazla üst üste belirli süreli sözleşme yapılamayacağını, aksi halde sözleşmenin başlangıçtan itibaren belirsiz süreli sayılacağını açıkça düzenler.","ayirt":"Zincirleme sözleşmenin arkasında esaslı bir neden var mı?","paragraf":"İş K. m.11","yanilgi":"Esaslı neden şartını atlayıp her zincirleme sözleşmenin belirli süreli kalacağını sanıyorsun."},"E":{"gercek":"İşletmenin/iş yerinin devrinde devralan işçi sözleşmelerine halef olur, ancak devreden işveren ile birlikte sorumluluk kural olarak devam eder.","ayirt":"Devir, sorumluluğu devralana mı devrediyor yoksa devredenle birlikte mi sürdürüyor?","paragraf":"Nispilik ilkesi istisnası - işletme devri (birlikte sorumluluk)","yanilgi":"Devirle devredenin tüm sorumluluğunun bittiğini, sadece devralanın sorumlu kalacağını sanıyorsun."},"A":{"gercek":"İş K. m.11 esaslı neden aranan zincirleme belirli süreli sözleşmeyi düzenler; nispilik ilkesinin istisnaları arasında işletme/iş yeri devri de sayılır ve devralanın işçi sözleşmesine halef olması bunun sonucudur.","ayirt":"Bu olayda birden fazla kural birlikte mi işliyor, yoksa tek kural mı yeterli?","paragraf":"İş K. m.11; nispilik ilkesi istisnaları","yanilgi":"Bu şıkkı eleyen, iki kuralın (zincirleme sözleşme + işyeri devri) aynı olayda birlikte uygulanabileceğini fark edemez, birini tek başına yeterli sanır."},"D":{"gercek":"Kural, sözleşmenin taraflarını bağlar; devralanın taraf olmayan bir sözleşmeden etkilenmesi tam olarak nispiliğin istisnasıdır, ilkenin uygulanması değildir.","ayirt":"Bu sonuç ilkenin kendisinden mi, yoksa ilkeye getirilen istisnadan mı doğuyor?","paragraf":"Nispilik ilkesi ve istisnaları","yanilgi":"İstisna ile ilkenin kendisini birbirine karıştırıp devri ilkenin doğal sonucu sanıyorsun."},"B":{"gercek":"Nispilik ilkesinin sekiz istisnasından biri işletmenin/iş yerinin devridir; devralan işçilerin sözleşmesine taraf olur.","ayirt":"Bu ilkenin istisnası olan bir hal mi var, yoksa saf nispilik mi uygulanıyor?","paragraf":"Nispilik ilkesi istisnası - işletme devri","yanilgi":"Nispilik ilkesini mutlak sanıp hiçbir hâlde üçüncü kişiye etki doğmayacağını düşünüyorsun."}},"verilen":[],"donem":5,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 53"},"kural":"Genel İşsizlik Tuzağı: Kanundaki tüm \u0027çalışılmayan süreler\u0027 borçlanılır sanırsın; oysa madde yalnız sınırlı sayıda özel hali (askerlik, staj, doktora, tutukluluk, grev-lokavt, kısmi süreli eksik gün vb.) sayar, genel işsizlik süresi bunlar arasında değildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 53","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Hizmet borçlanması sorularında dört şık genelde maddenin bentlerinden birebir alınır, beşinci şık maddede hiç yer almayan genel bir hal olur; şıkları teker teker (a)-(j) bentleriyle eşleştir.","konu":"hizmet borçlanması","tablo":null,"siklar":{"C":"Grev ve lokavtta geçen süreler","E":"Sigortalı iken herhangi bir suçtan tutuklanıp bu suçtan beraat edenlerin tutuklulukta geçen süreleri","A":"Er veya erbaş olarak silah altında ya da yedek subay, yedek astsubay okulunda geçen süreler","D":"Sigortalı olarak çalışmaya başlamadan önce, herhangi bir işte çalışmaksızın işsiz geçirilen süreler","B":"Sigortalı olmaksızın avukatlık stajını yapanların normal staj süreleri"},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.41 [1/3]","metin":"MADDE 41- Bu Kanuna göre sigortalı sayılanların; a) (Değişik: 10/9/2014-6552/43 md.) Kanunları gereği verilen ücretsiz doğum ya da analık izni süreleri ile 4 üncü maddenin birinci fıkrasının (a), (b) ve (c) bentleri kapsamındaki sigortalı kadının, üç defaya mahsus olmak üzere doğum tarihinden sonra iki yıllık süreyi geçmemek kaydıyla borçlanılacak sürelerde uzun vadeli sigorta kolları açısından sigortalı sayılmaması ve çocuğunun yaşaması şartlarıyla talepte bulunulan süreleri, b) Er veya erbaş olarak silâh altında veya yedek subay, yedek astsubay okulunda geçen süreleri,65 c) 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında olanların, personel mevzuatına göre aylıksız izin süreleri, d) Sigortalı olmaksızın doktora öğrenimi veya tıpta uzmanlık için yurt içinde veya yurt dışında geçirdikleri normal doktora veya uzmanlık öğrenim süreleri, e) Sigortalı olmaksızın avukatlık stajını yapanların normal staj süreleri, f) Sigortalı iken herhangi bir suçtan tutuklanan veya gözaltına alınanlardan bu suçtan dolayı beraat edenlerin tutuklulukta veya gözaltında geçen süreleri, g) Grev ve lokavtta geçen süreleri (…)66, h) Hekimlerin fahrî asistanlıkta geçen süreleri, ı) Seçim kanunları gereğince görevlerinden istifa edenlerin, istifa ettikleri tarih ile seçimin yapıldığı tarihi takip eden ay başına kadar açıkta geçirdikleri süreleri, i) (Ek: 13/2/2011-6111/30 md.) Bu bendin yürürlüğe girdiği tarihten sonraki sürelere ilişkin olmak üzere, 4857 sayılı Kanuna göre kısmi süreli iş sözleşmesi ile çalışan sigortalıların, kısmi süreli çalıştıkları aylara ait eksik süreleri, j) (Ek: 4/7/201…"},{"ad":"5510 s. SGK Kanunu m.41 [2/3]","metin":"dönenlerden yükümlü bulunduğu mecburi hizmet süresini tamamlamış olanların, yurt dışında resmî öğrenci olarak geçirmiş oldukları öğrenim sürelerinin 18 yaşının tamamlanmasından sonraki döneme ait olan kısmı, kendilerinin veya hak sahiplerinin yazılı talepte bulunmaları ve talep tarihinde 82 nci maddeye göre belirlenen prime esas günlük kazanç alt ve üst sınırları arasında olmak üzere, kendilerince belirlenecek günlük kazancın (a) bendinde bulunanlar için %32’si diğerleri için %45’i üzerinden hesaplanacak primlerini borcun tebliği tarihinden itibaren bir ay içinde ödemeleri şartı ile borçlandırılarak, borçlandırılan süreleri sigortalılıklarına sayılır. (Ek cümle: 13/2/2011-6111/30 md.) (i) bendi kapsamında borçlanılacak sürelere ilişkin genel sağlık sigortası primlerinin ödenmiş olması halinde, genel sağlık sigortası primi ödenmiş bu 25/6/2019 tarihli ve 7179 sayılı Kanunun 62 nci maddesiyle; bu bende “yedek subay” ibaresinden sonra gelmek üzere “, yedek astsubay” ibaresi eklenmiştir. 66 17/4/2008 tarihli ve 5754 sayılı Kanunun 67 nci maddesiyle; bu bentte yer alan “ve Kurumca kabul edilecek sektörel veya genel ekonomik kriz dönemlerinde işvereni tarafından ücretsiz izinli sayılanların, her yıl için 3 ayı geçmemek üzere bu süreleri” ibaresi yürürlükten kaldırılmıştır. 65 sürelere ilişkin borçlanma tutarı %39 oranı üzerinden hesaplanır. 67 Bir ay içinde ödenmeyen borçlanmalar için ise yeni başvuru şartı aranır. Primi ödenmeyen borçlanma süreleri hizmetten sayılmaz. Borçlanma sürelerinin ne şekilde belgeleneceğini belirlemeye Kurum yetkilidir. Bu Kanuna göre tespit edilen sigo…"}],"hakem":"5510 m.41\u0027de borçlanılabilecek süreler sınırlı olarak sayılmıştır (askerlik, doktora, staj, tutukluluk, grev-lokavt, kısmi süreli eksik gün vb.); genel işsizlik süresi bu listede yer almadığından borçlanılamaz."},"kayitlar":[],"sade":{"siklar":{"C":"Grev ve lokavtta geçen süreler kanunun 41/1-g bendinde borçlanılabilecek süreler arasında açıkça düzenlenmiştir.","E":"Sigortalı iken tutuklanan ve beraat eden kişinin tutukluluk süresi kanunun 41/1-f bendinde borçlanılabilir süreler arasında sayılır.","A":"Askerlik ve askeri okulda geçen süreler kanunun 41/1-b bendinde açıkça borçlanılabilecek süreler olarak sayılmıştır.","B":"Sigortalı olmaksızın yapılan avukatlık stajının normal süresi kanunun 41/1-e bendinde borçlanılabilir süreler arasında yer alır."},"dogru":"Kanun borçlanılabilecek süreleri sınırlı sayıda saymıştır: askerlik, staj, doktora, tutukluluk, grev-lokavt gibi. İşe başlamadan önce hiçbir işte çalışmaksızın geçirilen genel işsizlik süresi bu listede yoktur. Borçlanılamaz.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 41. madde","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 41. madde","tanim":"Sigortalılar tarafından, hizmet sürelerine eklenmek üzere, kanunun 41. maddesinde sınırlı olarak sayılan ve prim ödenmesi koşuluyla sigortalılık olarak değerlendirilen süreler.","ad":"Borçlanılabilecek süreler"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/1","2019/3","2016/1"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027nun 41 inci maddesine göre, aşağıdaki sürelerden hangisi sigortalılar tarafından borçlanılabilecek hizmet sürelerinden değildir?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-07","verilenler":[],"dayanak":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu m.41/1","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[],"anahtar":[{"ornek":"süreleri","kok":"sürele"},{"ornek":"borçlanılabilecek","kok":"borçla"},{"ornek":"bentler","kok":"bentle"},{"ornek":"sayıda","kok":"sayıda"},{"ornek":"sınırlı","kok":"sınırl"},{"ornek":"İşsizlik","kok":"İşsizl"}],"konuGiris":{"harita":"Ne zaman test edilir: sürelerin sayılıp sayılmayacağı listesi verilip \u0027değildir\u0027 sorusu sorulduğunda. Nasıl ölçülür: verilen sürenin kanunda sayılan bentlerden biri olup olmadığına bakılarak. Nasıl kaydedilir: borçlanılan süre, primi ödendiğinde ilgili sigortalılık statüsüne göre hizmetten sayılır.","desen":"Soru genelde kanunda sayılan sürelerin bir listesini verip aralarına sayılmayan bir süreyi (ör. ücretsiz izin, işsizlik dönemi) sızdırır. Tuzak, benzer görünen ama listede olmayan bir süreyi doğru gibi göstermektir. Bu soru madde 41 fıkra 1\u0027deki sayma listesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"kanunun saydığı, sigortasız geçmiş olup sonradan hizmete katılabilen dönem","ad":"borçlanılabilir süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"borçlanma bedelinin hesaplandığı yüzde oranı, bent türüne göre değişir","ad":"prim oranı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"borçlanma bedelinin üzerinden hesaplandığı günlük kazanç tutarı","ad":"prime esas kazanç","kim":"mükellef / işveren beyan eder"},{"kaynak":"kuraldan bilinir","tanim":"borçlanılan gün sayısı kadar geriye çekilen ilk sigortalılık tarihi","ad":"sigortalılık başlangıcı","kim":"kanun sabitler"}],"sinavda":"Soruda çeşitli süreler sayılır ve hangisinin borçlanılabilir listede olmadığı istenir.","panel_ornek":"Bir genç, üniversite yıllarında çalışmadığı 2 yıllık dönemi düşünsün; bu boşluk emekliliğe sayılmıyor. Sonradan bu 2 yıl için aylık 300 lira gibi bir bedel ödeyip o süreyi hizmetten saydırabilir. Yani geçmişte sigortasız geçen zaman, sonradan para ödeyerek \u0027satın alınabilir\u0027.","ornek":"Bir genç, üniversite yıllarında çalışmadığı 2 yıllık dönemi düşünsün; bu boşluk emekliliğe sayılmıyor. Sonradan bu 2 yıl için aylık 300 lira gibi bir bedel ödeyip o süreyi hizmetten saydırabilir. Yani geçmişte sigortasız geçen zaman, sonradan para ödeyerek \u0027satın alınabilir\u0027.","yontemler":"Kanunda sayılan bentleri (doğum izni, askerlik, doktora, avukatlık stajı, tutukluluk, grev-lokavt, fahri asistanlık, seçim istifası, kısmi süreli çalışma, yurt dışı öğrenim) ezbere bilmek gerekir. Listede olmayan her süre \u0027değildir\u0027 cevabıdır.","nedir":"Hizmet borçlanması, sigortalı sayılmayan bazı geçmiş sürelerin sonradan prim ödenerek emeklilik hesabına dahil edilmesidir. Sınav, hangi sürelerin borçlanılabileceğini ve hangisinin bu listede olmadığını ayırt etmeyi ölçer."},"olay":"","tuzak":{"C":{"ad":"Ne soruluyor","metin":"Beş süreden hangisinin borçlanma kapsamı dışında kaldığı soruluyor. Kural: 5510 sayılı Kanun m.41/1 borçlanılabilecek süreleri bentler halinde sınırlı olarak sayar; bu sayımda yer almayan genel nitelikli süreler borçlanılamaz. Hesap: - Doğrusu: İşe girmeden önce, herhangi bir işte çalışmaksızın geçirilen genel işsizlik süresi maddede sayılan bentlerden hiçbirine girmediği için borçlanılamaz."},"E":{"ad":"Tutukluluk Tuzağı","metin":"Beraat eden kişinin tutuklulukta geçen süresinin borçlanma dışı kaldığını düşünürsün. Doğrusu: Madde 41/1-f, sigortalı iken tutuklanan veya gözaltına alınıp bu suçtan beraat edenlerin tutuklulukta veya gözaltında geçen sürelerini borçlanılabilecek süreler arasında sayar."},"A":{"ad":"Askerlik Tuzağı","metin":"Askerlik süresinin borçlanma dışında sayılacağını düşünürsün. Doğrusu: 5510 sayılı Kanunun 41 inci maddesinin birinci fıkrasının (b) bendi, er veya erbaş olarak silah altında veya yedek subay, yedek astsubay okulunda geçen süreleri açıkça borçlanılabilecek süreler arasında sayar."},"B":{"ad":"Meslek Stajı Tuzağı","metin":"Avukatlık stajının sigortalılık doğurduğunu, dolayısıyla borçlanmaya konu olamayacağını sanırsın. Doğrusu: Madde 41/1-e, sigortalı olmaksızın yapılan avukatlık stajının normal staj süresini borçlanılabilecek süreler arasında düzenler."}},"celdiriciYol":{"not":"Bu soru teori tipindedir, sayısal hesap içermez; yanlış şıklar kanunda gerçekten sayılan sürelerin doğru ifadeleridir, doğru şık ise kanunda sayılmayan genel bir süredir."},"hap":"5510 sayılı Kanunun 41 inci maddesi borçlanılabilecek süreleri sınırlı sayıda (numerus clausus) bentler halinde sayar; bentlerde yer almayan genel çalışılmayan süreler borçlanmaya konu olamaz.","teshis":{"C":{"gercek":"m.41/1-g, grev ve lokavtta geçen süreleri borçlanılabilir süreler arasında sayar.","ayirt":"Bu hal maddenin bentlerinde ayrıca yazılı mı?","paragraf":"m.41/1-g","yanilgi":"Grev-lokavt süresinin işçinin kusuru sayılıp borçlanma dışı bırakıldığını düşünüyorsun."},"E":{"gercek":"m.41/1-f, sigortalı iken tutuklanıp beraat edenlerin tutukluluk/gözaltı süresini borçlanılabilir süreler arasında sayar.","ayirt":"Kişi bu suçtan beraat etmiş mi, bu şart maddede aranıyor mu?","paragraf":"m.41/1-f","yanilgi":"Tutukluluk süresinin, beraat etse dahi hizmetten sayılamayacağını düşünüyorsun."},"A":{"gercek":"5510 s.K. m.41/1-b, er/erbaş ve yedek subay/astsubay okulu sürelerini açıkça borçlanılabilir sayar.","ayirt":"Bu süre maddenin bentlerinden birinde tek tek sayılmış mı?","paragraf":"m.41/1-b","yanilgi":"Askerlik süresinin hizmet borçlanmasına konu olamayacağını düşünüyorsun."},"D":{"gercek":"5510 s.K. m.41/1 (a)\u0027dan (j)\u0027ye kadar yalnız belirli özel süreleri borçlanılabilir sayar; genel işsizlik süresi bu bentlerin hiçbirine girmez.","ayirt":"Bu süre maddenin (a)-(j) bentlerinden birinde açıkça sayılmış mı, yoksa genel bir varsayım mı?","paragraf":"m.41/1","yanilgi":"Kanunun çalışılmayan her süreyi genel olarak borçlanmaya açtığını sanıyorsun; oysa madde sınırlı sayıda (numerus clausus) hal sayar ve genel işsizlik süresi bunlar arasında yer almaz."},"B":{"gercek":"m.41/1-e, sigortalı olmaksızın geçirilen avukatlık staj süresini borçlanılabilir süreler arasında sayar.","ayirt":"Bu süre sigortalı olmadan mı geçirilmiş, madde bunu ayrıca mı düzenlemiş?","paragraf":"m.41/1-e","yanilgi":"Avukatlık stajının kendiliğinden sigortalılık doğurduğunu ve bu yüzden borçlanılamayacağını sanıyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 53"},"kural":"41 inci madde ikinci fıkrasına göre (a) bendinde bulunanlar için oran %32\u0027dir; üçüncü fıkranın (b) bendine göre (i) bendine göre borçlananlar 4/1-a\u0027ya göre sigortalılık süresi sayılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 53","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Borçlanma sorularında önce \u0027bu kişi borçlanmadan önce hangi bentteydi\u0027 diye sor, oran ve statü ona göre birlikte belirlenir.","konu":"hizmet borçlanması","tablo":{"satirlar":[["VERİLENLER","-","-"],["Kanunun maddesi","41","-"],["HESAP","-","-"],["A) Borçlanma tutarı, seçilecek günlük kazancın %45\u0027i üzerin…","p.41/2, p.41/3-b","YANLIŞ ifade"],["B) Borçlanma tutarı, seçilecek günlük kazancın %32\u0027si üzeri…","p.41/2, p.41/3-b","doğru ifade"],["C) Borçlanma tutarı, seçilecek günlük kazancın %45\u0027i üzerin…","p.41/2","YANLIŞ ifade"],["D) Borçlanma tutarı, seçilecek günlük kazancın %32\u0027si üzeri…","p.41/3-b","YANLIŞ ifade"],["E) Çocuğunun yaşaması şartı arandığından borçlanma tutarı %…","p.41/1-b dipnot 65","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Borçlanma tutarı, seçilecek günlük kazancın %45\u0027i üzerinden hesaplanır ve borçlanılan süre 4 üncü maddenin birinci fıkrasının (a) bendine göre sigortalılık süresi sayılır","E":"Çocuğunun yaşaması şartı arandığından borçlanma tutarı %39 oranı üzerinden hesaplanır","A":"Borçlanma tutarı, seçilecek günlük kazancın %45\u0027i üzerinden hesaplanır ve borçlanılan süre 4 üncü maddenin birinci fıkrasının (c) bendine göre değerlendirilir","D":"Borçlanma tutarı, seçilecek günlük kazancın %32\u0027si üzerinden hesaplanır ve borçlanılan süre 4 üncü maddenin birinci fıkrasının (c) bendine göre değerlendirilir","B":"Borçlanma tutarı, seçilecek günlük kazancın %32\u0027si üzerinden hesaplanır ve borçlanılan süre 4 üncü maddenin birinci fıkrasının (a) bendine göre sigortalılık süresi sayılır"},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.41 [1/3]","metin":"MADDE 41- Bu Kanuna göre sigortalı sayılanların; a) (Değişik: 10/9/2014-6552/43 md.) Kanunları gereği verilen ücretsiz doğum ya da analık izni süreleri ile 4 üncü maddenin birinci fıkrasının (a), (b) ve (c) bentleri kapsamındaki sigortalı kadının, üç defaya mahsus olmak üzere doğum tarihinden sonra iki yıllık süreyi geçmemek kaydıyla borçlanılacak sürelerde uzun vadeli sigorta kolları açısından sigortalı sayılmaması ve çocuğunun yaşaması şartlarıyla talepte bulunulan süreleri, b) Er veya erbaş olarak silâh altında veya yedek subay, yedek astsubay okulunda geçen süreleri,65 c) 4 üncü maddenin birinci fıkrasının (c) bendi kapsamında olanların, personel mevzuatına göre aylıksız izin süreleri, d) Sigortalı olmaksızın doktora öğrenimi veya tıpta uzmanlık için yurt içinde veya yurt dışında geçirdikleri normal doktora veya uzmanlık öğrenim süreleri, e) Sigortalı olmaksızın avukatlık stajını yapanların normal staj süreleri, f) Sigortalı iken herhangi bir suçtan tutuklanan veya gözaltına alınanlardan bu suçtan dolayı beraat edenlerin tutuklulukta veya gözaltında geçen süreleri, g) Grev ve lokavtta geçen süreleri (…)66, h) Hekimlerin fahrî asistanlıkta geçen süreleri, ı) Seçim kanunları gereğince görevlerinden istifa edenlerin, istifa ettikleri tarih ile seçimin yapıldığı tarihi takip eden ay başına kadar açıkta geçirdikleri süreleri, i) (Ek: 13/2/2011-6111/30 md.) Bu bendin yürürlüğe girdiği tarihten sonraki sürelere ilişkin olmak üzere, 4857 sayılı Kanuna göre kısmi süreli iş sözleşmesi ile çalışan sigortalıların, kısmi süreli çalıştıkları aylara ait eksik süreleri, j) (Ek: 4/7/201…"},{"ad":"5510 s. SGK Kanunu m.41 [2/3]","metin":"dönenlerden yükümlü bulunduğu mecburi hizmet süresini tamamlamış olanların, yurt dışında resmî öğrenci olarak geçirmiş oldukları öğrenim sürelerinin 18 yaşının tamamlanmasından sonraki döneme ait olan kısmı, kendilerinin veya hak sahiplerinin yazılı talepte bulunmaları ve talep tarihinde 82 nci maddeye göre belirlenen prime esas günlük kazanç alt ve üst sınırları arasında olmak üzere, kendilerince belirlenecek günlük kazancın (a) bendinde bulunanlar için %32’si diğerleri için %45’i üzerinden hesaplanacak primlerini borcun tebliği tarihinden itibaren bir ay içinde ödemeleri şartı ile borçlandırılarak, borçlandırılan süreleri sigortalılıklarına sayılır. (Ek cümle: 13/2/2011-6111/30 md.) (i) bendi kapsamında borçlanılacak sürelere ilişkin genel sağlık sigortası primlerinin ödenmiş olması halinde, genel sağlık sigortası primi ödenmiş bu 25/6/2019 tarihli ve 7179 sayılı Kanunun 62 nci maddesiyle; bu bende “yedek subay” ibaresinden sonra gelmek üzere “, yedek astsubay” ibaresi eklenmiştir. 66 17/4/2008 tarihli ve 5754 sayılı Kanunun 67 nci maddesiyle; bu bentte yer alan “ve Kurumca kabul edilecek sektörel veya genel ekonomik kriz dönemlerinde işvereni tarafından ücretsiz izinli sayılanların, her yıl için 3 ayı geçmemek üzere bu süreleri” ibaresi yürürlükten kaldırılmıştır. 65 sürelere ilişkin borçlanma tutarı %39 oranı üzerinden hesaplanır. 67 Bir ay içinde ödenmeyen borçlanmalar için ise yeni başvuru şartı aranır. Primi ödenmeyen borçlanma süreleri hizmetten sayılmaz. Borçlanma sürelerinin ne şekilde belgeleneceğini belirlemeye Kurum yetkilidir. Bu Kanuna göre tespit edilen sigo…"}],"hakem":"Doğru sık, 5510 sayılı Kanunun 41. maddesinin 2. fıkrasında açıkça yer alan %32 oranı ve 3. fıkranın (i) bendinde belirtilen 4/1-a statüsü kurallarına dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"C":"%45 oranı kısmi süreli çalışanlara değil, sigortalı olmayan başka kişilere uygulanır; doğru oran %32\u0027dir.","E":"%39 oranı ve çocuk şartı sadece doğum borçlanmasına ilişkindir, kısmi süreli çalışma borçlanmasında uygulanmaz.","D":"Oran doğru ama (c) bendi aylıksız izine özgüdür; kısmi süreli çalışan (a) bendine göre değerlendirilir.","A":"Kısmi süreli çalışan zaten normal sigortalı olduğu için %45 oranı ve (c) bendi uygulanmaz; bunlar sadece diğer kişiler ve aylıksız izin için geçerlidir."},"dogru":"Kısmi süreli çalışan eksik günlerini borçlanırken seçtiği günlük kazancın %32\u0027si üzerinden prim öder ve bu süre normal çalışan olarak sigortalılık süresi sayılır. Yasa bunu kısmi süreli çalışanlar için özel olarak belirlemiştir.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 41. madde ikinci fıkrasının (i) bendi ve üçüncü fıkrasının (i) bendine göre.","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 41. madde","tanim":"Çalışanın, sigortalı olarak sayılmayan ancak belirtilen dönemlerdeki eksik gün veya sürelerine ilişkin primini ödeyerek bu süreleri sigortalılık süresi olarak kabul ettirebilmesidir.","ad":"Borçlanma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/1","2019/3","2016/1"]},"oyun":null,"tip":"teori","soru":"4857 sayılı Kanuna göre kısmi süreli iş sözleşmesiyle çalışan sigortalının, kısmi süreli çalıştığı aylara ait eksik günlerini 5510 sayılı Kanunun 41 inci maddesine göre borçlanması hakkında aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-07","verilenler":[{"deger":"41","anlam":"5510 sayılı Kanunda sigortalıların eksik gün borçlanması işlemlerinin usulünü belirleyen hüküm.","ad":"Kanunun maddesi"}],"dayanak":"5510 sayılı Kanun m.41/2 ve m.41/3-b","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Zeynep, bir mağazada haftada 3 gün, günde 4 saat çalışıyor. 2023 yılında 4857 sayılı Kanuna göre kısmi süreli iş sözleşmesiyle çalıştığı aylarda ayda 12 gün eksik kalmış, toplam 96 gün eksik gün birikmiş. Zeynep bu 96 günü 5510 sayılı Kanunun 41 inci maddesine göre borçlanmak istiyor, SGK\u0027ya dilekçe veriyor.","anlatim":"Zeynep\u0027in eksik günleri kısmi süreli çalışmadan kaynaklanıyor, bu tam olarak 41 inci madde birinci fıkra (i) bendinin durumu. SGK ona iki şey söyleyecek: hangi oranla ödeyeceği ve bu sürenin hangi statüde sayılacağı.","doldur":[]},{"formul":"Ne yapacağız: Zeynep\u0027in 96 günü için SGK, seçtiği günlük kazancın yüzde kaçını isteyecek ve bu günleri 4 üncü maddenin hangi bendine göre değerlendirecek, beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Madde ikinci fıkrada oranı ikiye ayırıyor: (a) bendinde bulunanlar %32, diğerleri %45. Üçüncü fıkrada da (i) bendi borçlanması 4/1-a\u0027ya bağlanıyor; şimdi A\u0027dan E\u0027ye sırayla bakalım.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"p.41/2, p.41/3-b","karar":"yanlış","anlatim":"Zeynep kısmi süreli işçi, yani zaten 4/1-a sigortalısı; oranı %45 değil %32 olur. Üstelik (i) bendi borçlananlar hiçbir zaman 4/1-c\u0027ye değil 4/1-a\u0027ya bağlanır.","formul":"Şık A: SGK memuru Zeynep\u0027e \u0027oranın %45, statün de 4/1-c olacak\u0027 diyor, bu doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"p.41/2, p.41/3-b","karar":"doğru","anlatim":"Zeynep\u0027in kısmi süreli çalışması onu (a) bendinde bulunan kişi yapar, madde ikinci fıkraya göre oran %32\u0027dir. Üçüncü fıkra da (i) bendini açıkça 4/1-a\u0027ya bağlar, yani bu ifade tam uyuyor.","formul":"Şık B: SGK memuru Zeynep\u0027e \u0027%32 ödeyeceksin, süre 4/1-a sayılacak\u0027 diyor, bu doğru mu?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"p.41/2","karar":"yanlış","anlatim":"Statü kısmı doğru ama oran yanlış; Zeynep (a) bendinde sayıldığı için %32 uygulanır, %45 sadece (a) dışındakilere.","formul":"Şık C: SGK memuru \u0027%45 ödeyeceksin ama statün 4/1-a olacak\u0027 diyor, bu doğru mu?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"p.41/3-b","karar":"yanlış","anlatim":"Oran doğru ama statü yanlış; (c) ve (ı) bentleri 4/1-c\u0027ye gider, ama Zeynep\u0027in dayandığı (i) bendi ayrıca 4/1-a\u0027ya gider.","formul":"Şık D: SGK memuru \u0027%32 ödeyeceksin, statün 4/1-c olacak\u0027 diyor, bu doğru mu?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"p.41/1-b dipnot 65","karar":"yanlış","anlatim":"Çocuk şartı sadece doğum borçlanmasına ait, %39 oranı da er-erbaşlık borçlanmasına özgü; Zeynep\u0027in kısmi süreli borçlanmasında bunların hiçbiri aranmaz.","formul":"Şık E: SGK memuru \u0027çocuğun yaşaması şartı var, oran %39\u0027 diyor, bu doğru mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Zeynep zaten kısmi süreli çalışırken 4/1-a sigortalısıydı, borçlanma bu statüyü ve %32 oranını değiştirmedi. Kendine sor: bu kişi borçlanmadan önce hangi bentte sigortalıydı, yoksa hiç sigortalı değil miydi?","doldur":[]}],"anahtar":[{"ornek":"bendine","kok":"bendin"},{"ornek":"borçlanmasında","kok":"borçla"},{"ornek":"zeynep","kok":"zeynep"},{"ornek":"sigortalılık","kok":"sigort"},{"ornek":"süreli","kok":"süreli"},{"ornek":"ikinci","kok":"ikinci"}],"konuGiris":{"harita":"Ne zaman borçlanılır: kısmi süreli çalışılan aylardaki eksik günler için. Nasıl hesaplanır: seçilen günlük kazancın belirli yüzdesi üzerinden. Nasıl kaydedilir: primi bir ay içinde ödenirse hizmetten sayılır, ödenmezse sayılmaz.","desen":"Sınav genelde bir ayda ödenmeyen borçlanmanın hizmetten sayılmayacağını ve yeniden başvuru gerektiğini sorar. Tuzak, borçlanılan sürenin hangi sigortalılık türüne (a bendi) sayılacağını karıştırmaktır. Bu soru m.41/i bendi ve bir aylık ödeme kuralı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"4857 sayılı Kanuna göre haftalık çalışma süresinin kısmen yapılması","ad":"Kısmi süreli çalışma","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"soruda verilir","tanim":"kısmi çalışılan ayda tam ayı tamamlamayan borçlanılabilir gün sayısı","ad":"Eksik gün","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"seçilen günlük kazancın belirlenen yüzdesi üzerinden hesaplanan tutar","ad":"Borçlanma primi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"borcun tebliğinden itibaren primin ödenmesi gereken süre","ad":"Bir aylık ödeme süresi","kim":"kanun sabitler"}],"sinavda":"Soru, kısmi süreli çalışan sigortalının eksik gün borçlanmasına ilişkin doğru kuralı seçmeyi ister.","panel_ornek":"Bir genç, part-time çalıştığı 3 ayda eksik kalan 10 günü sonradan parayla tamamlayıp emekliliğe saydırabiliyor. Bu, eksik günü sonradan \u0027satın alma\u0027 mantığıdır.","ornek":"Bir genç, part-time çalıştığı 3 ayda eksik kalan 10 günü sonradan parayla tamamlayıp emekliliğe saydırabiliyor. Bu, eksik günü sonradan \u0027satın alma\u0027 mantığıdır.","yontemler":"En kritik kural: borç bir ay içinde ödenmezse hizmetten sayılmaz ve yeni başvuru gerekir.","nedir":"Hizmet borçlanması, sigortalı sayılmayan ya da eksik geçen bazı sürelerin prim ödenerek hizmete katılmasıdır. Sınav, hangi sürenin borçlanılabileceğini ve borç priminin hangi orandan hesaplandığını ölçer."},"olay":"kısmi süreli çalışan zaten 4/1-a kapsamındadır, bu nedenle %32 oranı ve (a) statüsü birlikte uygulanır.","tuzak":{"C":{"ad":"Oran Genelleme Tuzağı","metin":"statüyü doğru bulup \u0027sigortalı olmayanlar\u0027 için öngörülen %45 oranını, zaten 4/1-a sigortalısı olan kısmi süreli çalışana uyguladın. Doğrusu: (i) bendi kapsamındakiler %32 oranına tabidir, %45 yalnız (a) bendi dışında kalanlar içindir."},"E":{"ad":"Farklı Bent Yükleme Tuzağı","metin":"doğum borçlanmasına özgü %39 oranını ve çocuğun yaşaması şartını, kısmi süreli çalışma borçlanmasına taşıdın. Doğrusu: %39 oranı yalnız er-erbaşlık ile yedek subaylık borçlanmasına, çocuk şartı yalnız doğum borçlanmasına ilişkindir."},"D":{"ad":"Statü Karıştırma Tuzağı","metin":"oranı doğru bulmana rağmen istatü ataması için (c) bendini seçtin; oysa (c) bendi aylıksız izin borçlanmasına özgüdür. Doğrusu: (i) bendine göre borçlananlar 4/1-a bendine göre sigortalılık süresi sayılır."},"A":{"ad":"Bent Karıştırma Tuzağı","metin":"(ı) bendindeki seçim nedeniyle istifa borçlanmasının statüsünü ve \u0027diğerleri\u0027 oranını (i) bendine uyguladın. Doğrusu: (i) bendi borçlananlar zaten 4/1-a sigortalısıdır, %32 oranı ve (a) statüsü uygulanır."}},"celdiriciYol":null,"hap":"Kısmi süreli çalışma borçlanmasında (i bendi) oran %32\u0027dir ve süre 4/1-a bendine göre sigortalılık süresi sayılır; çünkü kişi zaten (a) bendi sigortalısıdır.","teshis":{"C":{"gercek":"Madde metni oranı ikiye ayırır: (a) bendinde bulunanlar %32, diğerleri %45; kısmi süreli çalışan (a) bendindedir.","ayirt":"Bu kişi (a) bendinde mi yoksa (a) dışında mı sayılıyor?","paragraf":"5510 s.K m.41/2","yanilgi":"%45 oranının yalnız hiç sigortalılığı olmayanlara ait olduğunu unutup genel oran sanırsın."},"E":{"gercek":"%39 oranı yalnız er-erbaşlık ve yedek subaylık/astsubaylık süresi borçlanmasına, çocuk şartı yalnız doğum borçlanmasına ilişkindir; kısmi süreli borçlanmada bu şartlar aranmaz.","ayirt":"Bu oran hangi bendin dipnotunda geçiyor, olayımdaki bent bu mu?","paragraf":"5510 s.K m.41/1-b dipnot 65","yanilgi":"Kanunda geçen tek özel oranın (%39) her borçlanmaya uygulandığını sanırsın."},"A":{"gercek":"41 inci madde üçüncü fıkrası her bendi ayrı statüye bağlar; (c) ve (ı) bentleri 4/1-c\u0027ye, (i) bendi 4/1-a\u0027ya gider.","ayirt":"Bu süre hangi bende dayanıyor, o bent hangi statüye yönlendiriliyor?","paragraf":"5510 s.K m.41/3-b","yanilgi":"Bütün borçlanma türlerinin aynı statüye bağlandığını sanıyorsun."},"D":{"gercek":"Üçüncü fıkranın (b) bendi yalnız (c) ve (ı) bentlerini 4/1-c\u0027ye bağlar; (i) bendi ayrıca 4/1-a\u0027ya bağlanır.","ayirt":"Bu bent (b) fıkrasının hangi cümlesinde sayılıyor?","paragraf":"5510 s.K m.41/3-b","yanilgi":"Oranı tutturunca statüyü de doğru sandığın için kontrol etmeyi bırakırsın."},"B":{"gercek":"41 inci madde ikinci fıkrasında (a) bendinde bulunanlar için oran %32\u0027dir; üçüncü fıkrada (i) bendi borçlananlar 4/1-a\u0027ya göre değerlendirilir.","ayirt":"Bu kişi borçlanmadan önce de 4/1-a sigortalısı mıydı?","paragraf":"5510 s.K m.41/2, m.41/3-b","yanilgi":"Kısmi süreli çalışanın zaten sigortalı olduğunu, borçlanmanın yalnız eksik günü tamamladığını gözden kaçırırsın."}},"verilen":[[1,1]],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 110"},"kural":"m.4/1-c aile ekonomisi sınırları içindeki tarımla ilgili yapı işlerini istisna sayarken, m.4/2-d tarım işletmelerinde yapılan yapı işlerini bu istisnadan ayırarak İş Kanunu hükümlerine tabi kılar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 110","sonDonem":3,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"m.4 sorularında önce istisnalar fıkrasını, sonra \u0027şu kadar ki\u0027 fıkrasını ayrı ayrı oku; ikisini aynı işe uygulamaya çalışma.","konu":"İs kanunu kapsamı","tablo":{"satirlar":[["A) 50 ve daha az işçi çalıştırılan tarım işlerinin yapıldığ…","İş K. m.4/1-b","YANLIŞ ifade"],["B) Kıyılarda gemilerden karaya ve karadan gemilere yapılan …","İş K. m.4/2-a","YANLIŞ ifade"],["C) Rehabilite edilenler hakkındaki işler, çalışma şartların…","İş K. m.4/1-h","YANLIŞ ifade"],["D) Ev hizmetlerinde çalışanlar, işveren vekili sayılmaları …","İş K. m.4/1-e","YANLIŞ ifade"],["E) Tarım işletmelerinde yapılan yapı işleri, İş Kanunu hükü…","İş K. m.4/2-d","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Rehabilite edilenler hakkındaki işler, çalışma şartlarına ilişkin özel koruma sağlanması amacıyla İş Kanunu hükümlerine tabi tutulmuştur.","E":"Tarım işletmelerinde yapılan yapı işleri, İş Kanunu hükümlerine tabidir.","A":"50 ve daha az işçi çalıştırılan tarım işlerinin yapıldığı işyerlerinde yürütülen işler, İş Kanunu hükümlerine tabidir.","D":"Ev hizmetlerinde çalışanlar, işveren vekili sayılmaları nedeniyle İş Kanunu kapsamına girer.","B":"Kıyılarda gemilerden karaya ve karadan gemilere yapılan yükleme boşaltma işleri, deniz taşıma işi kapsamında değerlendirilerek İş Kanunu kapsamı dışında tutulur."},"kaynak":{"alinti":"teki istisna ve istisnanın istisnasını doğru ölçüyor; doğru sık m.4/2-d","liste":[{"ad":"İş K. (4857 s.K.) m.4 [1/2]","metin":"Madde 4 -Aşağıda belirtilen işlerde ve iş ilişkilerinde bu Kanun hükümleri uygulanmaz; a) Deniz ve hava taşıma işlerinde, b) 50\u0027den az işçi çalıştırılan (50 dahil) tarım ve orman işlerinin yapıldığı işyerlerinde veya işletmelerinde, c) Aile ekonomisi sınırları içinde kalan tarımla ilgili her çeşit yapı işleri, d) Bir ailenin üyeleri ve 3 üncü dereceye kadar (3 üncü derece dahil) hısımları arasında dışardan başka biri katılmayarak evlerde ve el sanatlarının yapıldığı işlerde, e) Ev hizmetlerinde, f) (…)4 çıraklar hakkında, g) Sporcular hakkında, 10/9/2014 tarihli ve 6552 sayılı Kanunun 1 inci maddesiyle, bu fıkrada yer alan “altı iş günü” ibareleri “otuz iş günü” şeklinde değiştirilmiştir. 3 10/9/2014 tarihli ve 6552 sayılı Kanunun 1 inci maddesiyle, bu fıkranın beşinci cümlesinin değiştirilmesi hüküm altına alınmış olmakla birlikte, iki cümle şeklindeki düzenleme yerine işlenmiştir. 4 20/6/2012 tarihli ve 6331 sayılı Kanunun 37 nci maddesiyle, bu bentte yer alan “İş sağlığı ve güvenliği hükümleri saklı kalmak üzere” ibaresi madde metninden çıkarılmıştır. 2 h) Rehabilite edilenler hakkında, ı) 507 sayılı Esnaf ve Sanatkârlar Kanununun 2 nci maddesinin tarifine uygun üç kişinin çalıştığı işyerlerinde."},{"ad":"İş K. (4857 s.K.) m.4 [2/2]","metin":"Şu kadar ki; a) Kıyılarda veya liman ve iskelelerde gemilerden karaya ve karadan gemilere yapılan yükleme ve boşaltma işleri, b) Havacılığın bütün yer tesislerinde yürütülen işler, c) Tarım sanatları ile tarım aletleri, makine ve parçalarının yapıldığı atölye ve fabrikalarda görülen işler, d) Tarım işletmelerinde yapılan yapı işleri, e) Halkın faydalanmasına açık veya işyerinin eklentisi durumunda olan park ve bahçe işleri, f) Deniz İş Kanunu kapsamına girmeyen ve tarım işlerinden sayılmayan, denizlerde çalışan su ürünleri üreticileri ile ilgili işler, Bu Kanun hükümlerine tabidir. Eşit davranma ilkesi"}],"hakem":"Soru İş Kanunu m.4\u0027teki istisna ve istisnanın istisnasını doğru ölçüyor; doğru sık m.4/2-d\u0027ye açıkça dayanan ve kaynakta yer alan hüküme dayanıyor."},"kayitlar":[],"sade":{"siklar":{"C":"Rehabilite edilenler hakkındaki işler kanun kapsamı dışında tutulmuştur; koruma diğer mevzuatlarla sağlanır. Özel koruma amacı, kanuna tabi olmayı gerektirmez.","E":"Tarım işletmelerinde yapılan yapı işleri kanunun istisnaları içinde yer almadığı için kanuna tabidir.","A":"50 ve daha az işçi çalıştırılan tarım işleri kanun kapsamı dışındadır; yanlışlıkla kapsamda sanılmıştır. Madde 4, bu işleri açıkça istisna saymıştır.","D":"Ev hizmetleri kanun kapsamı dışında istisna sayılmıştır. İşveren vekilliği kavramı ev hizmetlerinde söz konusu değildir.","B":"Deniz taşıma işi istisna olsa da, kıyı ve liman yükleme boşaltma işleri istisnanın istisnası sayılarak kanuna tabi kılınmıştır. Deniz işi ile yükleme boşaltma farklı durumlardır."},"dogru":"Tarım işletmelerinde yapılan yapı işleri kanunun kapsamı dışı istisnalardan değildir; tam tersine kanuna tabi tutulmuştur. Aile ekonomisi sınırları içindeki tarım yapı işleri istisna iken, işletme ölçeğindeki tarım yapı işleri kanunun koruma hükümlerine uygundur.","sinav":"İş Kanunu 4. madde uyarınca tarım işletmelerinde yapılan yapı işleri İş Kanunu hükümlerine tabidir.","kavramlar":[{"kaynak":"İş Kanunu 4. madde","tanim":"Bir ailenin kendi ihtiyaçları doğrultusunda, ticari amaç gütmeksizin yürüttüğü tarım yapı işleridir. Bu işler İş Kanunun kapsamı dışındadır.","ad":"Aile ekonomisi sınırları içinde kalan tarımla ilgili yapı işleri"},{"kaynak":"İş Kanunu 4. madde","tanim":"Ticari ölçekte işletilen tarım alanlarında yapılan yapı işleridir. Bu işler kanunun istisnaları içinde yer almadığı için İş Kanunu hükümlerine tabidir.","ad":"Tarım işletmelerinde yapılan yapı işleri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[{"yil":"2025/3","alinti":"Aşağıdaki işçilerden hangisi 4857 sayılı İş Kanunu’nun kapsamında yer almaz?"},{"yil":"2018/1","alinti":"Aşağıdakilerden hangisi 4857 sayılı İş Kanunu’nun kapsamı dışındadır?"}],"donemler":["2025/3","2018/3","2018/1"]},"oyun":null,"tip":"teori","soru":"4857 sayılı İş Kanununun kapsamı ve kapsam dışında kalan işlere ilişkin m.4 hükmü uyarınca aşağıdaki ifadelerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-a6-issgk-cokzor-r1/kp-06","verilenler":[],"dayanak":"İş Kanunu (4857 s.K.) m.4/2-d","dogru":"E","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Antalya\u0027da bir tarım işletmesi, 2024 yılında 30 dönümlük serasının yanına yeni bir depo binası inşa ediyor. İnşaatta 12 işçi çalışıyor, aynı işletmenin tarla işlerinde de 40 işçi var.","anlatim":"İşveren \u0027zaten tarım işletmesiyiz, tüm işlerimiz kanundan istisna\u0027 diye düşünüyor. İşyerinde birden fazla iş türü var: tarla işi, yapı işi, bir de ayrıca ev hizmetinde çalışan bir bahçıvan. Her işi tek tek m.4\u0027e göre ayıracağız.","doldur":[]},{"formul":"Ne yapacağız: m.4/1\u0027deki istisnalar ile m.4/2\u0027deki \u0027istisnanın istisnası\u0027 işleri bu işletmenin somut işlerine uygulayacağız.","anlatim":"40 işçilik tarla işi, 50 dahil sınırının altında mı üstünde mi bakacağız. Depo inşaatı ile yükleme-boşaltma gibi işleri de ayrı ayrı test edeceğiz. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"İş K. m.4/1-b","karar":"yanlış","anlatim":"40 işçi 50 dahil sınırının altında, bu yüzden tarla işi kanundan istisna sayılır. İşveren yanılıyor, bu iş İş Kanunu\u0027na tabi değildir.","formul":"Şık A: işletme \u0027tarla işimizde 40 işçi var, 50\u0027den az, kanuna tabiyiz\u0027 diyor, doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"İş K. m.4/2-a","karar":"yanlış","anlatim":"Kıyıda gemiden karaya, karadan gemiye yükleme boşaltma işi ayrıca sayılıp kanuna tabi kılınmış. Deniz taşıma istisnası bu işi kapsamaz.","formul":"Şık B: işletme limanda ürünlerini gemiye yüklerken \u0027bu iş deniz taşıma sayılır, kanun dışı\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"İş K. m.4/1-h","karar":"yanlış","anlatim":"m.4/1-h rehabilite edilenler hakkındaki işleri doğrudan istisna sayıyor. Koruma amacı istisnayı ortadan kaldırmaz, tam tersi kanundan çıkarır.","formul":"Şık C: işletmede rehabilite programıyla çalıştırılan bir kişi var, \u0027bu kişi özel koruma için kanun kapsamına girer\u0027 diyorsun, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"İş K. m.4/1-e","karar":"yanlış","anlatim":"Kanun ev hizmetlerini iş türü olarak istisna tutuyor, çalışanın sıfatına bakmıyor. İşveren vekilliği burada istisnayı değiştirmez.","formul":"Şık D: bahçıvan ev hizmetinde çalışıyor ve işverenin işlerini de yönetiyor, \u0027işveren vekili sayılır, kanuna girer\u0027 diyorsun, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"İş K. m.4/2-d","karar":"doğru","anlatim":"m.4/1-c istisnası yalnız aile ekonomisi sınırındaki yapı işlerini kapsar, bir tarım işletmesi bünyesindeki yapı işi ayrı tutulup kanuna bağlanmış. Bu işçiler İş Kanunu hükümlerine tabidir.","formul":"Şık E: depo inşaatı işçileri \u0027biz tarım işletmesindeyiz, yapı işimiz de istisna\u0027 diyor, sen ne dersin?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"İşletme tarım işletmesi olsa da her işi kendi türüne göre ayrı test edilir. Kendine sor: bu iş aile ekonomisi sınırında mı, yoksa bir işletme bünyesinde mi yapılıyor?","doldur":[]}],"anahtar":[{"ornek":"istisnalar","kok":"istisn"},{"ornek":"işlerini","kok":"işleri"},{"ornek":"sınırının","kok":"sınırı"},{"ornek":"kanunu","kok":"kanunu"},{"ornek":"işletmelerinde","kok":"işletm"},{"ornek":"ekonomisi","kok":"ekonom"}],"konuGiris":null,"olay":"yok.","tuzak":{"C":{"ad":"Yanlış Gerekçe Tuzağı","metin":"Özel koruma amacını kanuna tabi olmakla eş tutuyorsun. Doğrusu: m.4/1-h rehabilite edilenler hakkındaki işleri açıkça İş Kanunu kapsamı dışında bırakır; koruma başka mevzuatla sağlanır."},"A":{"ad":"Ters Kural Tuzağı","metin":"50 ve daha az işçi çalıştırılan tarım işlerini istisna iken kanuna tabi sanıyorsun. Doğrusu: m.4/1-b bu işleri açıkça İş Kanunu kapsamı dışında bırakır, işçi sayısı 50 dahil olduğu için istisna geçerlidir."},"D":{"ad":"Kavram Kayması Tuzağı","metin":"İşveren vekili kavramını ev hizmetlerine taşıyarak kapsama sokuyorsun. Doğrusu: m.4/1-e ev hizmetlerini açıkça istisna sayar, işveren vekilliğiyle ilgisi yoktur."},"B":{"ad":"Genelleme Tuzağı","metin":"Deniz taşıma istisnasını yükleme boşaltma işine de uyguluyorsun. Doğrusu: m.4/2-a kıyı, liman ve iskelelerdeki yükleme boşaltma işlerini istisnanın istisnası sayarak İş Kanunu hükümlerine tabi kılar."}},"celdiriciYol":{},"hap":"İş Kanunu m.4/1\u0027deki istisnalar, aynı maddenin ikinci fıkrasında (\u0027şu kadar ki\u0027) sayılan işler için geçerli değildir; bu işler kanuna tabidir.","teshis":{"C":{"gercek":"İş Kanunu m.4/1-h rehabilite edilenler hakkındaki işleri açıkça istisna kabul eder.","ayirt":"Madde metninde bu iş istisnalar fıkrasında mı sayılıyor?","paragraf":"İş K. m.4/1-h","yanilgi":"Koruma amaçlı düzenlemenin otomatik olarak kanun kapsamına girdiğini sanıyorsun."},"E":{"gercek":"İş Kanunu m.4/2-d, tarım işletmelerinde yapılan yapı işlerini istisnanın istisnası sayarak kanuna tabi kılar; m.4/1-c\u0027deki istisna yalnız aile ekonomisi sınırları içindeki yapı işlerini kapsar.","ayirt":"İş, aile ekonomisi sınırında mı yoksa bir tarım işletmesi bünyesinde mi yapılıyor?","paragraf":"İş K. m.4/2-d","yanilgi":"Aile ekonomisi sınırları içindeki tarım yapı işleri istisnasını tüm tarım yapı işlerine genişletip bu şıkkı da yanlış sanıyorsun."},"A":{"gercek":"İş Kanunu m.4/1-b, 50 dahil ve altında işçi çalıştırılan tarım ve orman işyerlerini kapsam dışı bırakır.","ayirt":"İşçi sayısı 50\u0027yi aşıyor mu, aşmıyorsa istisna mı geçerli?","paragraf":"İş K. m.4/1-b","yanilgi":"50 ve daha az işçi çalıştırılan tarım işlerini de kanun kapsamına girer sanıyorsun."},"D":{"gercek":"İş Kanunu m.4/1-e ev hizmetlerini istisna sayar; işveren vekilliği ayrı bir kavramdır ve bu istisnayı etkilemez.","ayirt":"Sorulan iş türü mü, çalışanın sıfatı mı istisnayı belirliyor?","paragraf":"İş K. m.4/1-e","yanilgi":"İşveren vekili sıfatının ev hizmetlerini kapsam içine çekeceğini düşünüyorsun."},"B":{"gercek":"İş Kanunu m.4/2-a, kıyı ve liman yükleme boşaltma işlerini istisnadan ayırıp kanuna tabi kılar.","ayirt":"Bu iş fiilen taşıma mı yoksa taşımaya bağlı yükleme-boşaltma mı?","paragraf":"İş K. m.4/2-a","yanilgi":"Deniz taşıma istisnasının yükleme boşaltma işlerini de kapsadığını düşünüyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 110"},"kural":"Türk Borçlar Kanunu m.415/2\u0027ye göre işçi kendi motorlu aracını işin gorulmesinde kullanıyorsa işveren, araca ilişkin vergiyi, zorunlu mali sorumluluk sigortası primini ve aracın yipranmasi karşılığında uygun bir tazminatı hizmet için kullanıldığı ölçüde ödemekle yükümlüdür.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 110","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde numarasını değil
