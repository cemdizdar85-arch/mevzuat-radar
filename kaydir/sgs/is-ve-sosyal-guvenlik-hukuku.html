çalıştırılan işçi sayısı, işyerinde çalıştırılan işçi sayısının dörtte birini geçemez. Ancak, on ve daha az işçi çalıştırılan işyerlerinde beş işçiye kadar geçici iş ilişkisi kurulabilir. İşçi sayısının tespitinde, kısmi süreli iş sözleşmesine göre çalışanlar, çalışma süreleri dikkate alınarak tam süreli çalışmaya dönüştürülür. Geçici işçi sağlama sözleşmesi ile çalışan işçi, 30 uncu maddenin uygulanmasında özel istihdam bürosu ve geçici işçi çalıştıran işverenin işçi sayısına dâhil edilmez. Geçici işçi çalıştıran işveren, iş sözleşmesi feshedilen işçisini fesih tarihinden itibaren altı ay geçmeden geçici iş ilişkisi kapsamında çalıştıramaz. Geçici işçi, geçici işçi çalıştıran işverenden özel istihdam bürosunun hizmet bedeline mahsup edilmek üzere avans veya borç alamaz. Geçici işçi çalıştıran işveren; a) İşin gereği ve geçici işçi sağlama sözleşmesine uygun olarak geçici işçisine talimat verme yetkisine sahiptir. b) İşyerindeki açık iş pozisyonlarını geçici işçisine bildirmek ve Türkiye İş Kurumu tarafından istenecek belgeleri belirlenen sürelerle sakl…"}],"hakem":"Soru 4857 s.K. m.7\u0027nin geçici iş ilişkisinin süre ve yenileme sınırlarını soruyor; C seçeneği ev hizmetlerinde (c bendi) dört ay ve iki defa yenileme iddia ediyor, ancak kaynakta c bendinin \u0027süre sınırı olmaksızın\u0027 kurulabileceği açıkça yazılıdır, dolayısıyla C yanlıştır."},"kayitlar":[],"sade":{"siklar":{"D":"Dönemsellik arz eden iş artışlarında kurulan sözleşme, mevsimlik işler hariç tutulması nedeniyle sekiz ay ve iki yenileme sınırlamasına tabi değildir, ifade doğrudur.","E":"Geçici işçi çalıştıran işveren, belirtilen sürenin sonunda aynı iş için altı ay geçmediği sürece yeniden geçici işçi çalıştıramaz; bu altı aylık bekleme süresi zorunludur.","A":"İş sağlığı ve güvenliği bakımından acil işler, dört ay süreli ve en fazla iki defa yenileme kuralına tabi olup, bu açıklama kanuna tamamen uyar.","B":"Mevsimlik tarım işlerinde süre sınırı yoktur; sözleşme kanunda açıkça süresiz olarak kurulabilir."},"dogru":"Ev hizmetlerinde geçici işçi sağlama sözleşmesi kanuna göre süre sınırı olmaksızın yapılabilir. Oysa C şıkkında dört ay süreli ve iki defa yenilenebilir denildiği için kanuna aykırıdır.","sinav":"İş Kanunu 7. madde","kavramlar":[{"kaynak":"İş Kanunu 7. madde","tanim":"Özel istihdam bürosu ile işveren arasında yapılan ve işçinin geçici olarak işverene devri ile gerçekleşen yazılı sözleşmedir.","ad":"Geçici işçi sağlama sözleşmesi"},{"kaynak":"İş Kanunu 7. madde","tanim":"Belirli mevsimlerde yapılan tarım işleri olup, geçici işçi sağlama sözleşmesi için süre sınırı yoktur.","ad":"Mevsimlik tarım işleri"},{"kaynak":"İş Kanunu 7. madde","tanim":"Evde yapılan hizmet işleri olup, geçici işçi sağlama sözleşmesi için süre sınırı yoktur.","ad":"Ev hizmetleri"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/1","2015/1"]},"oyun":null,"tip":"teori","soru":"4857 sayılı İş Kanunu\u0027nun 7 nci maddesinde, özel istihdam bürosu aracılığıyla kurulan geçici iş ilişkisinin süre ve yenileme sınırları bentler hâlinde düzenlenmiştir. Buna göre aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-14","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.7/2 (b,c bentleri) ve m.7/3-4 (süre ve yenileme kuralı)","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[],"anahtar":[{"ornek":"bentlerinde","kok":"bentle"},{"ornek":"bendinde","kok":"bendin"},{"ornek":"yenilenir","kok":"yenile"},{"ornek":"sözleşmesi","kok":"sözleş"},{"ornek":"geçici","kok":"geçici"},{"ornek":"kanuna","kok":"kanuna"}],"konuGiris":{"harita":"Ne zaman test edilir: hangi hâlde geçici iş ilişkisinin süresiz, hangisinde süreli kurulabileceği sorulduğunda test edilir. Nasıl ölçülür: bentlere göre süre ve yenileme sayısının doğru eşleştirilmesiyle ölçülür. Nasıl kaydedilir: geçici işçi sağlama sözleşmesinde başlangıç-bitiş tarihi ve yenileme sayısı yazılı olarak kaydedilir.","desen":"Sınav genellikle (b) ve (c) bentlerindeki süresiz hâl ile diğer bentlerdeki dört aylık süreyi karıştırtmayı hedefler. Ayrıca sekiz aylık toplam sürenin (g) bendini kapsamadığı ve altı aylık bekleme süresinin unutulması sık tuzaktır. Bu soru m.7 üçüncü fıkra hükümlerinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Mevsimlik tarım işleri ve ev hizmetlerinde süre sınırı yoktur","ad":"Süre sınırı olmaksızın hâller","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Diğer bentlerde geçici işçi sağlama sözleşmesinin azami ilk süresi","ad":"Dört aylık süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İki yenilemeyle birlikte ulaşılabilecek azami toplam süre","ad":"Sekiz aylık toplam süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Sürenin sonunda aynı iş için yeniden geçici işçi çalıştırma yasağı süresi","ad":"Altı aylık bekleme süresi","kim":"kanun sabitler"}],"sinavda":"Soru, madde metnindeki bentlerden birinin süre veya yenileme kuralını yanlış aktaran seçeneği bulmayı ister.","panel_ornek":"Bir arkadaşın kısa süreli bir kiralık evde oturuyor: sözleşme 4 ay için yapılmış ve en fazla 2 kez uzatılabiliyor, toplamda 8 ayı geçemiyor. Süre dolunca aynı evi tekrar kiralaması için 6 ay beklemesi gerekiyor. Yani kanunda bazı işlerde süresiz, bazılarında sınırlı ve tekrar bekleme şartlı düzenlemeler var, buradaki mantık aynı.","ornek":"Bir arkadaşın kısa süreli bir kiralık evde oturuyor: sözleşme 4 ay için yapılmış ve en fazla 2 kez uzatılabiliyor, toplamda 8 ayı geçemiyor. Süre dolunca aynı evi tekrar kiralaması için 6 ay beklemesi gerekiyor. Yani kanunda bazı işlerde süresiz, bazılarında sınırlı ve tekrar bekleme şartlı düzenlemeler var, buradaki mantık aynı.","yontemler":"Her bendin süresini ezberlerken \u0027süresiz olanlar b ve c, diğerleri 4+4=8 ay\u0027 şeklinde gruplama yapılmalı, (g) bendinin sekiz aylık sınıra dahil olmadığı özellikle hatırlanmalıdır.","nedir":"Bu konu, geçici iş ilişkisinin özel istihdam bürosu aracılığıyla hangi hâllerde, ne kadar süre ve kaç kez kurulabileceğini düzenler. Sınav, süre sınırlarını ve yenileme kurallarını doğru hatırlayıp hatırlamadığını ölçer."},"olay":"","tuzak":{"D":{"ad":"Bent Ayrımı Tuzağı","metin":"öğrenci g bendinin de diğer bentler gibi sekiz ay ve iki yenileme sınırına tabi olduğunu düşünebilir. Doğrusu: madde 7/4 açıkça \u0027ikinci fıkranın (g) bendi hariç\u0027 ifadesiyle g bendini bu yenileme sınırlamasının dışında tutar, ifade doğrudur."},"E":{"ad":"Süre Sıfırlama Tuzağı","metin":"öğrenci sürenin sonunda hemen yeniden sözleşme kurulabileceğini düşünebilir. Doğrusu: madde 7/3 son cümlesi altı aylık bekleme süresini açıkça öngörür, ifade doğrudur."},"A":{"ad":"Ne soruluyor","metin":"beş ifadeden hangisinin madde metnine aykırı olduğu soruluyor. A Tuzağı: bu ifade zaten madde 7/3\u0027teki (e) bendine tam uyar, öğrenci burada hata arayıp vaktini kaybeder. Doğrusu: e bendindeki iş sağlığı ve güvenliği bakımından acil işler diğer bentlerle birlikte dört aylık süre sınırına tabidir, ifade doğrudur."},"B":{"ad":"Mevsimlik-Süresiz Sanma Tuzağı","metin":"öğrenci b bendindeki mevsimlik tarım işlerinin de dört ay sınırına tabi olduğunu sanabilir. Doğrusu: madde 7/3 açıkça b ve c bentlerinde süre sınırı olmaksızın sözleşme kurulabileceğini belirtir, ifade doğrudur."}},"celdiriciYol":{},"hap":"Geçici işçi sağlama sözleşmesi b ve c bentlerinde süre sınırsız, a bendinde hâlin devamınca, diğer bentlerde en fazla dört ay ve g bendi hariç toplam sekiz ayı geçmemek üzere iki defa yenilenir.","teshis":{"C":{"gercek":"Ev hizmetleri c bendinde sayılmıştır; madde 7/3\u0027e göre b ve c bentlerinde süre sınırı yoktur, dört aylık sınır ve yenileme kuralı yalnız diğer bentlere uygulanır.","ayirt":"Bu hâl hangi bentte sayılıyor ve o bent b-c grubunda mı, d-e-f-g grubunda mı?","paragraf":"İş K. m.7/2-c, 7/3","yanilgi":"Ev hizmetlerini d,e,f,g bentleriyle aynı gruba koyup dört ay ve iki yenileme sınırını buraya da uyguluyorsun."},"E":{"gercek":"Madde 7/3 son cümlesi, sürenin sonunda aynı iş için altı ay geçmedikçe yeniden geçici işçi çalıştırılamayacağını açıkça düzenler.","ayirt":"Madde metninde sürenin bitiminden sonrasına ilişkin bir bekleme cümlesi var mı?","paragraf":"İş K. m.7/3 son cümle","yanilgi":"Sürenin bitiminde işverenin hemen yeni bir geçici işçi sağlama sözleşmesi kurabileceğini sanıyorsun."},"A":{"gercek":"Madde 7/2-e ve 7/3 birlikte okunduğunda e bendi diğer bentlerle (d,e,f) birlikte dört aylık genel süreye tabidir.","ayirt":"Bu bent, madde 7/3\u0027te sayılan üç grup (a; b-c; d-e-f-g) hangisine giriyor?","paragraf":"İş K. m.7/2-e, 7/3","yanilgi":"Bu şıkkı seçerek e bendindeki acil işler hâlinin dört ay kuralına dahil olmadığını sanıyorsun."},"D":{"gercek":"Madde 7/4 açıkça \u0027ikinci fıkranın (g) bendi hariç\u0027 diyerek dönemsellik arz eden iş artışlarını bu yenileme sınırlamasının dışında bırakır.","ayirt":"Madde metninde g bendi için özel bir istisna cümlesi var mı?","paragraf":"İş K. m.7/4","yanilgi":"g bendinin de diğer bentlerle aynı sekiz ay-iki yenileme sınırına tabi olduğunu düşünerek bu şıkkı yanlış sanıyorsun."},"B":{"gercek":"Madde 7/3, b ve c bentlerinde süre sınırı olmaksızın sözleşme kurulabileceğini açıkça belirtir.","ayirt":"Bu hâl b/c bendinde mi, yoksa d-e-f-g grubunda mı sayılıyor?","paragraf":"İş K. m.7/3","yanilgi":"Mevsimlik işlerin hepsinin dört ay sınırına bağlı olduğunu, b ve c bentlerinin ayrık tutulmadığını sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"6356 sayılı Kanun m.62/1 uyarınca şehir şebeke suyu, elektrik, doğal gaz üretimi, tasfiyesi ve dağıtımı işlerinde grev ve lokavt yapılamaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Grev-lokavt yasağı sorularında önce kanunda hâlâ yazılı olanla Anayasa Mahkemesince iptal edilmiş ibareleri ayır, iptal edilenler artık yasak değildir.","konu":"grev lokavt yasağı","tablo":{"satirlar":[["A) Şehir şebeke suyu, elektrik ve doğal gaz üretimi, tasfiy…","m.62/1","doğru ifade"],["B) Bankacılık hizmetlerinin yürütüldüğü işyerlerinde","m.62/3, AYM E.2013/1 K.2014/161","YANLIŞ ifade"],["C) Şehir içi toplu taşıma hizmetlerinin yürütüldüğü işyerle…","m.62/3, AYM E.2013/1 K.2014/161","YANLIŞ ifade"],["D) Başladığı yolculuğu yurt içindeki varış yerinde bitirmiş…","m.62/3","YANLIŞ ifade"],["E) Cumhurbaşkanınca grev ve lokavtın yasaklandığı yerde, ya…","m.62/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Şehir içi toplu taşıma hizmetlerinin yürütüldüğü işyerlerinde","E":"Cumhurbaşkanınca grev ve lokavtın yasaklandığı yerde, yasağın kalkmasından itibaren doksan gün içinde altı iş günü önceden bildirimle grev ve lokavta devam edilmesinde","A":"Şehir şebeke suyu, elektrik ve doğal gaz üretimi, tasfiyesi ve dağıtımı işlerinde","D":"Başladığı yolculuğu yurt içindeki varış yerinde bitirmiş olan kara ulaştırma araçlarında","B":"Bankacılık hizmetlerinin yürütüldüğü işyerlerinde"},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.62","metin":"MADDE 62 – (1) Can ve mal kurtarma işlerinde; cenaze işlerinde ve mezarlıklarda; şehir şebeke suyu, elektrik, doğal gaz, petrol üretimi, tasfiyesi ve dağıtımı ile nafta veya doğalgazdan başlayan petrokimya işlerinde; (…)11 Millî Savunma Bakanlığı ile Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığınca doğrudan işletilen işyerlerinde; kamu kuruluşlarınca yürütülen itfaiye (…)11 ve hastanelerde grev ve lokavt yapılamaz. (2) Cumhurbaşkanı, genel hayatı önemli ölçüde etkileyen doğa olaylarının gerçekleştiği yerlerde bu durumun devamı süresince yürürlükte kalmak kaydıyla gerekli gördüğü işyerlerinde grev ve lokavtı yasaklayabilir. Yasağın kalkmasından itibaren altmış gün içinde altı iş günü önce karşı tarafa bildirilmek kaydıyla grev ve lokavt uygulamasına devam edilir.12 (3) Başladığı yolculuğu yurt içindeki varış yerlerinde bitirmemiş deniz, hava, demir ve kara ulaştırma araçlarında grev ve lokavt yapılamaz. Anayasa Mahkemesinin 22/10/2014 tarihli ve E.: 2013/1, K.: 2014/161 sayılı Kararı ile, bu fıkrada yer alan “…bankacılık hizmetlerinde;…” ve “…ve şehir içi toplu taşıma hizmetlerinde…” ibareleri iptal edilmiştir. 12 2/7/2018 tarihli ve 700 sayılı Kanun Hükmünde Kararnamenin 197 nci maddesiyle bu fıkrada yer alan “Bakanlar Kurulu” ibaresi “Cumhurbaşkanı” şeklinde değiştirilmiştir. 11 Grev ve lokavtın ertelenmesi"}],"hakem":"Soru 6356 s.K. m.62/1\u0027de açıkça yazılı olan grev ve lokavt yasağı konusunu ölçüyor; doğru sık (A) kaynakta tam olarak belirtilen yasak kapsamında yer alıyor."},"kayitlar":[],"sade":{"siklar":{"C":"Şehir içi toplu taşıma hizmetlerindeki yasak da aynı Anayasa Mahkemesi kararıyla kaldırılmış, yasak uygulanmaktan çıkarılmıştır.","E":"Cumhurbaşkanın yasaklamasından sonra grev yapmak isteyenler doksan değil altmış gün içinde bildirim yapmalı, bu süre çok kısadır.","D":"Ulaştırma araçlarında yasak, yolculuğunu henüz bitirmemiş araçlar içindir; varış yerine ulaşmış araçta grev yapılabilir.","B":"Bankacılık hizmetlerinde grev yasağı Anayasa Mahkemesi tarafından 2014 yılında iptal edilmiş olup, bugün artık bu işler yasak kapsamında değildir."},"dogru":"Su, elektrik ve doğal gaz gibi temel hizmetler yapılan işyerlerde grev ve lokavt yapılamaz. Bu işler kanunda mutlak olarak yasaklanmıştır.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 62. maddeye göre şehir şebeke suyu, elektrik ve doğal gaz üretimi, tasfiyesi ve dağıtımı işlerinde grev ve lokavt yapılamaz.","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 62. madde","tanim":"Kanun tarafından hiçbir koşulda grev ve lokavt yapılamayan işyerleri ve hizmetlerdir.","ad":"Mutlak yasak işler"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2019/2"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre, aşağıdaki hâllerden hangisinde grev ve lokavt yapılması yasaktır?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-11","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.62; Anayasa Mahkemesi 22/10/2014 tarihli, E.:2013/1, K.:2014/161 sayılı Kararı","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Bursa\u0027da bir doğal gaz dağıtım şirketinde işçiler sendika üzerinden 15 Mart tarihinde greve çıkmak istiyor, aynı gün 40 kilometre ötede bir şehir içi otobüs işletmesinde de sürücüler greve hazırlanıyor.","anlatim":"İkisi de kamuya hizmet veren işler ama kanun ikisine aynı gözle bakmıyor. Şimdi bu olayda hangi işyerinde grev yasak, hangisinde serbest, onu çözeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 6356 sayılı Kanun m.62\u0027de sayılan mutlak yasak işleri (can kurtarma, cenaze, su-elektrik-doğal gaz, petrokimya, hastane) bu olayın rakamlarıyla eşleştireceğiz.","anlatim":"Madde üç fıkradan oluşuyor: birinci fıkra kalıcı yasak listesi, ikinci fıkra Cumhurbaşkanı yasağı ve süresi, üçüncü fıkra ulaştırma araçları. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.62/1","karar":"doğru","anlatim":"Olayda şirket doğal gaz üretimi, tasfiyesi ve dağıtımı yapıyor, bu iş m.62/1\u0027de sayılan işlerden biri. Kanun burada grev ve lokavtı doğrudan yasaklıyor.","formul":"Şık A: doğal gaz şirketindeki işçiler grev yapabilir mi, sen ne dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.62/3, AYM E.2013/1 K.2014/161","karar":"yanlış","anlatim":"Bankacılık ibaresi eskiden m.62/3\u0027te yasaklıydı ama Anayasa Mahkemesi 22 Ekim 2014 tarihli kararıyla bu ibareyi metinden çıkardı. Bugün bankada grev yasak değil.","formul":"Şık B: aynı şehirdeki bir bankada çalışanlar grev yaparsa yasağa takılır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.62/3, AYM E.2013/1 K.2014/161","karar":"yanlış","anlatim":"Şehir içi toplu taşıma ibaresi de aynı Anayasa Mahkemesi kararıyla m.62/3\u0027ten silindi. Otobüs sürücüleri artık serbestçe grev yapabilir.","formul":"Şık C: otobüs sürücüleri şehir içi toplu taşımada grev yaparsa yasak ihlal edilmiş olur mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.62/3","karar":"yanlış","anlatim":"m.62/3 yasağı sadece yolculuğunu varış yerinde bitirmemiş araçlara uygular. Yolculuk bitmişse bu araç yasak kapsamının dışında kalır.","formul":"Şık D: yolculuğunu İstanbul\u0027a ulaştırıp indirmiş bir otobüs firmasında grev yasak mıdır?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.62/2","karar":"yanlış","anlatim":"m.62/2 bu süreyi altmış gün olarak belirliyor, doksan gün değil. Süre yanlış yazıldığı için bu ifade uygulanamaz.","formul":"Şık E: Cumhurbaşkanı yasağı kaldırdıktan sonra doksanıncı günde altı iş günü önceden bildirimle greve devam edilebilir mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Tek doğru mutlak yasak listesindeki su-elektrik-doğal gaz işi, diğer dördü ya iptal edilmiş ibare ya yanlış süre ya da koşulu eksik anlatılmış hâl. Kendine sor: bu ibare hâlâ madde metninde mi duruyor yoksa Anayasa Mahkemesi tarafından silinmiş mi?","doldur":[]}],"anahtar":[{"ornek":"mahkemesi","kok":"mahkem"},{"ornek":"anayasa","kok":"anayas"},{"ornek":"yasağı","kok":"yasağı"},{"ornek":"listesinden","kok":"listes"},{"ornek":"lokavt","kok":"lokavt"},{"ornek":"olayda","kok":"olayda"}],"konuGiris":{"harita":"Ne zaman test edilir: kanunda sayılan işyerlerinden hangisinde grev-lokavt yasak sorulduğunda. Nasıl ölçülür: seçeneklerdeki işyerinin m.62\u0027deki sayılan yerler listesine girip girmediği tespit edilerek. Nasıl kaydedilir: yasak kapsamındaki işyeri doğrudan kanun maddesindeki liste ile eşleştirilerek.","desen":"Sorular genelde m.62\u0027deki sayılan işyerleri listesinden (hastane, itfaiye, elektrik-su-gaz dağıtımı, cenaze işleri) birini seçenek yaparak yasak olup olmadığını sorar. Tuzak, Anayasa Mahkemesi\u0027nce iptal edilen bankacılık ve şehir içi toplu taşıma gibi eski maddelerin hâlâ yasakmış gibi seçeneklerde sunulmasıdır. Bu soru m.62 fıkra 1 ve iptal kararı notundan geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Belirli işyerlerinde grev-lokavt uygulanamayacağının kanunla belirlenmesi","ad":"Grev ve lokavt yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Afet, kaza gibi durumlarda hayat ve mülk kurtarmaya yönelik faaliyetler","ad":"Can ve mal kurtarma işleri","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Doğa olayı nedeniyle belirli işyerlerinde geçici olarak yasak konulması","ad":"Cumhurbaşkanı kararıyla ek yasak","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Yolculuğu bitirmemiş deniz, hava, demir, kâra araçlarında grev-lokavt engeli","ad":"Ulaştırma araçlarında yasak","kim":"kanun sabitler"}],"sinavda":"Soru, birkaç işyeri veya faaliyet türü seçeneği verir ve bunlardan hangisinde grev-lokavt yasak olduğunu sorar.","panel_ornek":"Bir mahallede elektrik kesintisi olduğunda 3 saat sonra elektrikler geri gelir ama hastanede jeneratör devreye girer. Çünkü hastane ve elektrik dağıtımı gibi hizmetler hiç durmamalıdır; bu yüzden oradaki işçiler grev yapamaz. Günlük hayatta fark etmesek de bazı hizmetler kesintiye hiç tahammül edemez.","ornek":"Bir mahallede elektrik kesintisi olduğunda 3 saat sonra elektrikler geri gelir ama hastanede jeneratör devreye girer. Çünkü hastane ve elektrik dağıtımı gibi hizmetler hiç durmamalıdır; bu yüzden oradaki işçiler grev yapamaz. Günlük hayatta fark etmesek de bazı hizmetler kesintiye hiç tahammül edemez.","yontemler":"Kanunda tek tek sayılan işyerleri listesini ezberden bilmek gerekir; iptal edilmiş ibareleri (bankacılık, şehir içi toplu taşıma) yasak sanmamak kritik kuraldır.","nedir":"Grev lokavt yasağı, toplumsal hayat için hayatı önemdeki bazı işlerde grev-lokavt uygulanamayacağını düzenler. Sınav bu yasak kapsamına giren işyerlerini ayırt etmeyi ölçer."},"olay":"","tuzak":{"C":{"ad":"Yürürlükten Kalkmış Metin Tuzağı","metin":"\u0027şehir içi toplu taşıma hizmetleri\u0027 ibaresini de yasak sayarsın. Doğrusu: bu ibare de aynı Anayasa Mahkemesi kararıyla iptal edilmiş olup artık yasak kapsamında değildir."},"E":{"ad":"Süre Hatası Tuzağı","metin":"bildirim süresini doksan gün sanırsın. Doğrusu: m.62/2 uyarınca bu süre yasağın kalkmasından itibaren altmış gündür, doksan gün değildir."},"D":{"ad":"Koşulu Tersine Çevirme Tuzağı","metin":"ulaştırma araçlarında grev yasağını her durumda geçerli sanırsın. Doğrusu: yasak, yolculuğunu varış yerinde BİTİRMEMİŞ araçlar içindir; yolculuğunu bitirmiş araçta yasak uygulanmaz."},"B":{"ad":"Kısmi İptal Tuzağı","metin":"madde metninde eskiden yer alan \u0027bankacılık hizmetleri\u0027 ibaresini hâlâ yürürlükte sanırsın. Doğrusu: Anayasa Mahkemesinin 22/10/2014 tarihli kararıyla bu ibare iptal edilmiş, bankacılıkta yasak kalkmıştır."}},"celdiriciYol":{},"hap":"6356 sayılı Kanunun m.62\u0027sinde sayılan mutlak grev-lokavt yasağı listesinden bankacılık ve şehir içi toplu taşıma hizmetleri, Anayasa Mahkemesi kararıyla çıkarılmıştır.","teshis":{"C":{"gercek":"Aynı Anayasa Mahkemesi kararıyla \u0027şehir içi toplu taşıma hizmetleri\u0027 ibaresi de metinden çıkarılmıştır.","ayirt":"Metinde bu ibarenin yanında iptal dipnotu var mı?","paragraf":"6356 s.K. m.62/3, AYM E.2013/1 K.2014/161","yanilgi":"Toplu taşımanın kamu hizmeti niteliği yüzünden hâlâ yasak listesinde olduğunu sanırsın."},"E":{"gercek":"m.62/2 bu süreyi altmış gün olarak belirler, altmış günün sonunda değil içinde altı iş günü önceden bildirimle devam edilir.","ayirt":"Metinde yazan sayı gerçekten altmış mı, yoksa başka bir maddeden süreyle mi karıştırıyorum?","paragraf":"6356 s.K. m.62/2","yanilgi":"Erteleme sonrası bildirim süresini diğer iş hukuku sürelerinden birine (ör. doksan gün) benzeterek karıştırırsın."},"A":{"gercek":"m.62/1 şehir şebeke suyu, elektrik, doğal gaz üretimi, tasfiyesi ve dağıtımı işlerini açıkça mutlak yasak kapsamına alır.","ayirt":"Bu işyeri madde metninde hâlâ sayılıyor mu, yoksa iptal mi edildi?","paragraf":"6356 s.K. m.62/1","yanilgi":"Bu şıkkı kanunda sayılan tek istisna zannedip diğer benzer şıkları da otomatik doğru sayarsın."},"D":{"gercek":"m.62/3 yasağı yalnız yolculuğunu varış yerinde bitirmemiş araçlarla sınırlar; yolculuk bitmişse yasak uygulanmaz.","ayirt":"Araç yolculuğunu tamamladı mı, hâlâ yolda mı?","paragraf":"6356 s.K. m.62/3","yanilgi":"Ulaştırma araçlarında yasağı koşulsuz, her seferinde geçerli sanırsın."},"B":{"gercek":"Anayasa Mahkemesinin 22/10/2014 tarihli E.:2013/1, K.:2014/161 sayılı kararı bu ibareyi iptal etmiştir.","ayirt":"Bu ibare hakkında bir Anayasa Mahkemesi iptal kararı var mı?","paragraf":"6356 s.K. m.62/3, AYM E.2013/1 K.2014/161","yanilgi":"Bankacılık hizmetlerinde grev yasağının hâlen yürürlükte olduğunu düşünürsün."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"Anayasa Mahkemesinin 22/10/2014 tarihli ve E.:2013/1, K.:2014/161 sayılı kararıyla madde 62/3\u0027teki \u0027bankacılık hizmetlerinde\u0027 ibaresi iptal edilmiştir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Grev-lokavt yasağı sorularında önce maddenin hangi fıkrasından bahsedildiğine, sonra o fıkrada Anayasa Mahkemesi tarafından iptal edilmiş bir ibare olup olmadığına bak.","konu":"grev lokavt yasağı","tablo":{"satirlar":[["VERİLENLER","-","-"],["Madde Numarası","62","-"],["HESAP","-","-"],["A) Şehir şebeke suyu işlerinin yürütüldüğü işyerinde","6356 s.K. m.62/1","YANLIŞ ifade"],["B) Bankacılık hizmetlerinin yürütüldüğü işyerinde","AYM 22/10/2014 E.2013/1 K.2014/161; m.62/3","doğru ifade"],["C) Kamu kuruluşlarınca yürütülen hastanelerde","6356 s.K. m.62/1","YANLIŞ ifade"],["D) Başladığı yolculuğu yurt içindeki varış yerinde bitirmem…","6356 s.K. m.62/3","YANLIŞ ifade"],["E) Millî Savunma Bakanlığınca doğrudan işletilen işyerinde","6356 s.K. m.62/1","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kamu kuruluşlarınca yürütülen hastanelerde","E":"Millî Savunma Bakanlığınca doğrudan işletilen işyerinde","A":"Şehir şebeke suyu işlerinin yürütüldüğü işyerinde","D":"Başladığı yolculuğu yurt içindeki varış yerinde bitirmemiş deniz ulaştırma aracında","B":"Bankacılık hizmetlerinin yürütüldüğü işyerinde"},"kaynak":{"alinti":"nın birlikte değerlendirilmesini ister; kaynak metinde bu karar açıkça yer almakta ve m.62/3","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.62","metin":"MADDE 62 – (1) Can ve mal kurtarma işlerinde; cenaze işlerinde ve mezarlıklarda; şehir şebeke suyu, elektrik, doğal gaz, petrol üretimi, tasfiyesi ve dağıtımı ile nafta veya doğalgazdan başlayan petrokimya işlerinde; (…)11 Millî Savunma Bakanlığı ile Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığınca doğrudan işletilen işyerlerinde; kamu kuruluşlarınca yürütülen itfaiye (…)11 ve hastanelerde grev ve lokavt yapılamaz. (2) Cumhurbaşkanı, genel hayatı önemli ölçüde etkileyen doğa olaylarının gerçekleştiği yerlerde bu durumun devamı süresince yürürlükte kalmak kaydıyla gerekli gördüğü işyerlerinde grev ve lokavtı yasaklayabilir. Yasağın kalkmasından itibaren altmış gün içinde altı iş günü önce karşı tarafa bildirilmek kaydıyla grev ve lokavt uygulamasına devam edilir.12 (3) Başladığı yolculuğu yurt içindeki varış yerlerinde bitirmemiş deniz, hava, demir ve kara ulaştırma araçlarında grev ve lokavt yapılamaz. Anayasa Mahkemesinin 22/10/2014 tarihli ve E.: 2013/1, K.: 2014/161 sayılı Kararı ile, bu fıkrada yer alan “…bankacılık hizmetlerinde;…” ve “…ve şehir içi toplu taşıma hizmetlerinde…” ibareleri iptal edilmiştir. 12 2/7/2018 tarihli ve 700 sayılı Kanun Hükmünde Kararnamenin 197 nci maddesiyle bu fıkrada yer alan “Bakanlar Kurulu” ibaresi “Cumhurbaşkanı” şeklinde değiştirilmiştir. 11 Grev ve lokavtın ertelenmesi"}],"hakem":"Soru, 6356 s.K. m.62 ve Anayasa Mahkemesi 22/10/2014 tarihli Kararı\u0027nın birlikte değerlendirilmesini ister; kaynak metinde bu karar açıkça yer almakta ve m.62/3\u0027teki \u0027bankacılık hizmetlerinde\u0027 ibaresinin iptal edildiği belirtilmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Kamu hastaneleri maddenin birinci fıkrasında sayılan yasak işyerleri arasında kalmıştır. İptal kararı hastaneleri kapsamaz.","E":"Millî Savunma Bakanlığı tarafından doğrudan işletilen işyerleri yasaklı hizmetler arasında hâlâ yer almaktadır. Burada grev ve lokavt yapılamaz.","D":"Yurt içi varış yerine ulaşmamış ulaştırma araçları (deniz, hava, demir, kâra) hâlâ yasak kapsamındadır. Sadece şehir içi toplu taşıma istisnası iptal edilmiştir.","A":"Şehir şebeke suyu işleri yasaklı faaliyetler arasında hâlâ sayılmaktadır. Bu işyerlerinde grev ve lokavt yapılamaz."},"dogru":"Anayasa Mahkemesi bankacılık hizmetlerinde grev ve lokavt yasağını kaldırmıştır. Diğer tüm seçeneklerdeki işyerlerde yasak hâlâ geçerlidir. Bankacılık hizmetlerinde grev ve lokavt yapılabilir.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 62. madde ve Anayasa Mahkemesi Kararı E.: 2013/1, K.: 2014/161","kavramlar":[]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2019/2"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu’nun 62 nci maddesi ve buna ilişkin Anayasa Mahkemesi kararı birlikte değerlendirildiğinde, aşağıdaki işyerlerinden hangisinde grev ve lokavt yapılması yasak değildir?","kayitBaslik":"","id":"sgs-t1-issgk-zor/kp-11","verilenler":[{"deger":"62","anlam":"6356 sayılı Kanun\u0027da grev ve lokavt yasağını belirleyen madde; işyerlerine göre yasaklılık koşullarını içerir.","ad":"Madde Numarası"}],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.62; Anayasa Mahkemesi 22/10/2014 tarihli, E.:2013/1, K.:2014/161 sayılı Kararı","dogru":"B","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: bir bankada 14 Mart günü sendika grev kararı asıyor, banka müdürü \u0027burada grev yasak, mahkemeye gideriz\u0027 diyor.","anlatim":"Aslında bu banka 2014\u0027te Anayasa Mahkemesinin verdiği kararla artık yasak listesinden çıkmış bir işyeri. Müdür eski metni biliyor, güncel metni bilmiyor.","doldur":[]},{"formul":"Ne yapacağız: 6356 sayılı Kanun m.62\u0027de beş tür işyeri sayılıyor, biz her birinin hâlâ yasaklı mı yoksa iptalle serbest mi olduğuna bakacağız.","anlatim":"Kural şu: m.62/1\u0027deki liste hâlâ tam yürürlükte, m.62/3\u0027te ise sadece iki ibare -bankacılık ve şehir içi toplu taşıma- Anayasa Mahkemesince iptal edilmiş. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"6356 s.K. m.62/1","karar":"yanlış","anlatim":"Hayır, şehir şebeke suyu işleri m.62/1\u0027de sayılan, iptal kararının dokunmadığı bir kalem. Burada grev ve lokavt hâlâ yasak.","formul":"Şık A: bir su idaresi işçisi \u0027ben şehir şebeke suyunda çalışıyorum, grev hakkım var\u0027 diyor, haklı mı?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"AYM 22/10/2014 E.2013/1 K.2014/161; m.62/3","karar":"doğru","anlatim":"Katılmam, çünkü 22 Ekim 2014 tarihli Anayasa Mahkemesi kararı m.62/3\u0027teki \u0027bankacılık hizmetlerinde\u0027 ibaresini iptal etti. Bankacılık artık yasak listesinde değil, grev serbest.","formul":"Şık B: banka müdürü \u0027bankacılıkta grev yasak\u0027 diyor, katılır mısın?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"6356 s.K. m.62/1","karar":"yanlış","anlatim":"Yanlış düşünüyor; hastaneler m.62/1\u0027de ayrı bir kalem ve iptal kararı hastaneleri hiç kapsamıyor. Kamu hastanelerinde grev ve lokavt hâlâ yasak.","formul":"Şık C: bir kamu hastanesi çalışanı \u0027bizde de bankacılık gibi iptal edildi, grev yapabilirim\u0027 diyor, doğru mu?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"6356 s.K. m.62/3","karar":"yanlış","anlatim":"Değil, çünkü iptal kararı bu fıkranın sadece bankacılık ve şehir içi toplu taşıma ibarelerini kaldırdı. Varış yerine ulaşmamış deniz aracı hükmü aynen yürürlükte, grev yasak.","formul":"Şık D: yurt içi seferini tamamlamamış bir gemide tayfa grev ilan ediyor, yasal mı?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"6356 s.K. m.62/1","karar":"yanlış","anlatim":"Mümkün değil, bu işyeri m.62/1\u0027de sayılan ve iptal kararından hiç etkilenmeyen bir kalem. Burada grev ve lokavt yasak.","formul":"Şık E: Millî Savunma Bakanlığının doğrudan işlettiği bir fabrikada işçiler grev hazırlığında, mümkün mü?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru B, çünkü iptal edilen ibare sadece bankacılık ve şehir içi toplu taşımayı kapsıyor. Kendine hep şunu sor: bu kalem m.62/1\u0027de mi yoksa m.62/3\u0027ün iptal edilen iki ibaresi içinde mi?","doldur":[]}],"anahtar":[{"ornek":"kararıyla","kok":"kararı"},{"ornek":"bankacılık","kok":"bankac"},{"ornek":"mahkemesi","kok":"mahkem"},{"ornek":"anayasa","kok":"anayas"},{"ornek":"hizmetlerinde","kok":"hizmet"},{"ornek":"lokavt","kok":"lokavt"}],"konuGiris":{"harita":"Hangi işyerlerinde uygulanır: Kanunda sayılan kamu hizmeti niteliğindeki işyerlerinde uygulanır. Nasıl belirlenir: Kanun maddesi ve Anayasa Mahkemesi\u0027nin iptal kararları birlikte değerlendirilerek belirlenir. Nasıl sınanır: Verilen işyeri listesinden hangisinin yasak kapsamı dışında kaldığı seçtirilerek sınanır.","desen":"Soru genellikle kanunda sayılan işyerleri ile Anayasa Mahkemesi\u0027nin iptal ettiği bankacılık ve şehir içi toplu taşıma ibarelerini karıştırarak tuzak kurar. Öğrenci iptal edilen ibareleri hâlâ yasak sanıp yanlış seçeneği işaretleyebilir. Bu soru m.62 metni ile AYM\u0027nin 2014 tarihli iptal kararının birlikte okunması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Belirli işyerlerinde grev ve lokavtın hiç yapılamaması durumu","ad":"Grev lokavt yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kanun maddesindeki bazı ibarelerin iptal edilerek yasak kapsamından çıkarılması","ad":"Anayasa Mahkemesi iptal kararı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"Doğa olayları nedeniyle geçici olarak konulan ek grev lokavt yasağı","ad":"Cumhurbaşkanı yasağı","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Yolculuğunu tamamlamamış araçlarda grev lokavt yapılamaması kuralı","ad":"Ulaştırma araçları istisnası","kim":"kanun sabitler"}],"sinavda":"Soruda işyeri listesi verilir, hangisinde grev lokavt yapılmasının yasak OLMADIĞI istenir.","panel_ornek":"Bir apartmanda su kesintisi olduğunda yönetim, tüm daireleri etkileyeceği için tesisatçıyı hemen çağırır, işi ertelemez. Çünkü 20 dairenin ortak ihtiyacı 3 kişilik bir aksaklığa feda edilemez. Bazı işler de toplumun geneline dokunduğu için hiç durdurulamaz.","ornek":"Bir apartmanda su kesintisi olduğunda yönetim, tüm daireleri etkileyeceği için tesisatçıyı hemen çağırır, işi ertelemez. Çünkü 20 dairenin ortak ihtiyacı 3 kişilik bir aksaklığa feda edilemez. Bazı işler de toplumun geneline dokunduğu için hiç durdurulamaz.","yontemler":"Kanun metnindeki sayılan işyerlerini ezberlemek yerine, Anayasa Mahkemesi\u0027nin iptal ettiği ibareleri (bankacılık, şehir içi toplu taşıma) ayrı tutmak kritik kuraldır.","nedir":"Grev lokavt yasağı, toplumun temel ihtiyaçlarını kesintiye uğratmamak için bazı işyerlerinde grev ve lokavtın kanunen yasaklanmasıdır. Sınav, hangi işyerinin bu yasak kapsamında olduğunu ve Anayasa Mahkemesi\u0027nin iptal ettiği istisnaları bilip bilmediğinizi ölçer."},"olay":"İptal edilen ibare metinden düşer, kalan hükümde bankacılık hizmetleri anılmaz.","tuzak":{"C":{"ad":"Güncelliğini Kaybetmiş Sanma Tuzağı","metin":"Öğrenci Anayasa Mahkemesi kararının hastaneleri de kapsadığını zannederek buraya işaretler. Doğrusu: Kamu kuruluşlarınca yürütülen hastaneler madde 62/1\u0027de hâlâ sayılıdır, iptal kararı bu hizmeti kapsamaz."},"E":{"ad":"Kurum Karıştırma Tuzağı","metin":"Öğrenci Millî Savunma Bakanlığı işyerlerini genel kamu hizmeti kapsamında sanıp iptal edilen bankacılık/toplu taşıma istisnasıyla karıştırır. Doğrusu: Millî Savunma Bakanlığı, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığınca doğrudan işletilen işyerleri madde 62/1\u0027de sayılı yasak kapsamındadır."},"D":{"ad":"Kısmi Okuma Tuzağı","metin":"Öğrenci ulaştırma araçlarına ilişkin fıkradan sadece iptal edilen ibareleri (bankacılık, şehir içi toplu taşıma) hatırlar ama maddenin asıl gövdesini (yolculuğunu bitirmemiş araçlar) unutup burayı da iptal sanır. Doğrusu: Yurt içi varış yerine ulaşmamış deniz, hava, demir ve kâra ulaştırma araçlarında yasak madde metninde aynen durmaktadır."},"A":{"ad":"Şehir Şebekesi Tuzağı","metin":"Öğrenci maddede sayılan tüm hizmetlerin güncelliğini sorgulamadan hepsini yasak sanır. Doğrusu: Şehir şebeke suyu işleri madde 62/1\u0027de hâlâ sayılmakta olup grev ve lokavt yasağı geçerlidir."}},"celdiriciYol":null,"hap":"6356 sayılı Kanun m.62\u0027de sayılan grev-lokavt yasağı kalemleri hâlâ geçerlidir; Anayasa Mahkemesi kararıyla yalnızca m.62/3\u0027teki \u0027bankacılık hizmetlerinde\u0027 ve \u0027şehir içi toplu taşıma hizmetlerinde\u0027 ibareleri iptal edilmiştir.","teshis":{"C":{"gercek":"İptal kararı yalnız \u0027bankacılık hizmetlerinde\u0027 ve \u0027şehir içi toplu taşıma hizmetlerinde\u0027 ibarelerini kapsar; kamu kuruluşlarınca yürütülen hastaneler m.62/1\u0027de ayrı ve hâlâ geçerli bir yasak kalemidir.","ayirt":"İptal edilen iki ibarenin dışında kalan yasak kalemleri karıştırıyor muyum?","paragraf":"6356 s.K. m.62/1","yanilgi":"Hastanelerin de iptal kararı kapsamına girdiğini, dolayısıyla artık serbest olduğunu düşünüyorsun."},"E":{"gercek":"Millî Savunma Bakanlığı, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığınca doğrudan işletilen işyerleri m.62/1\u0027de sayılan ve iptal kararından etkilenmeyen bir yasak kalemidir.","ayirt":"Bu işyeri türü iptal edilen iki ibareden biri mi, değil mi?","paragraf":"6356 s.K. m.62/1","yanilgi":"Millî Savunma Bakanlığı işyerlerinin de iptal kapsamına giren bir kamu hizmeti türü olduğunu düşünüyorsun."},"A":{"gercek":"Madde 62/1\u0027de sayılan şehir şebeke suyu işleri hâlâ yürürlükte olan bir yasak kalemidir; iptal kararı bu fıkrayı değil üçüncü fıkradaki iki ibareyi kapsar.","ayirt":"İptal kararı hangi fıkrayı ve hangi ibareyi kapsıyor, bunu ayırt ettim mi?","paragraf":"6356 s.K. m.62/1","yanilgi":"Maddede sayılan bütün hizmetlerin güncelliğinin aynı olduğunu, hiçbirinin değişmediğini düşünüyorsun."},"D":{"gercek":"Madde 62/3\u0027te sadece \u0027bankacılık hizmetlerinde\u0027 ve \u0027şehir içi toplu taşıma hizmetlerinde\u0027 ibareleri iptal edilmiştir; yurt içi varış yerine ulaşmamış araçlara ilişkin asıl hüküm aynen yürürlüktedir.","ayirt":"İptal kararı fıkranın tamamını mı yoksa sadece belirli ibareleri mi kapsıyor?","paragraf":"6356 s.K. m.62/3","yanilgi":"Ulaştırma araçlarına ilişkin tüm fıkranın Anayasa Mahkemesi kararıyla iptal edildiğini sanıyorsun."},"B":{"gercek":"Anayasa Mahkemesinin 22/10/2014 tarihli, E.:2013/1, K.:2014/161 sayılı kararıyla m.62/3\u0027teki \u0027bankacılık hizmetlerinde\u0027 ibaresi iptal edilmiş, bu hizmette grev ve lokavt serbest hâle gelmiştir.","ayirt":"Bu ibare hâlâ madde metninde yürürlükte mi, yoksa iptal edilip metinden düşmüş mü?","paragraf":"AYM 22/10/2014, E.:2013/1, K.:2014/161; 6356 s.K. m.62/3","yanilgi":"Bankacılık hizmetlerinin de diğer temel kamu hizmetleri gibi hâlâ yasak listesinde olduğunu sanıyorsun."}},"verilen":[[1,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 108"},"kural":"6356 sayılı Kanunun 62 nci maddesinin ikinci fıkrasına göre yasağın kalkmasından itibaren altmış gün içinde altı iş günü önce karşı tarafa bildirilmek kaydıyla uygulamaya devam edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 108","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 62\u0027de kaç fıkra ve her fıkranın \u0027sürekli mi geçici mi\u0027 olduğunu ayırarak oku; süre ve bildirim rakamlarını (60 gün / 6 iş günü) diğer maddelerin sürelerine (30 gün gibi) karıştırma.","konu":"grev lokavt yasağı","tablo":{"satirlar":[["A) Yasağın kalkmasından itibaren altmış gün içinde, altı iş…","6356 s.K. m.62/2","doğru ifade"],["B) Yasağın kalkmasından itibaren altmış gün içinde herhangi…","6356 s.K. m.62/2","YANLIŞ ifade"],["C) Yasağın kalkmasından itibaren otuz gün içinde, altı iş g…","6356 s.K. m.62/2","YANLIŞ ifade"],["D) Yasak kalktıktan sonra yeniden yetki tespiti yapılmadıkç…","6356 s.K. m.62/2","YANLIŞ ifade"],["E) Bu işyerinde de can ve mal kurtarma işlerinde olduğu gib…","6356 s.K. m.62/1-2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Yasağın kalkmasından itibaren otuz gün içinde, altı iş günü önce karşı tarafa bildirilmek kaydıyla grev ve lokavt uygulamasına devam edilir","E":"Bu işyerinde de can ve mal kurtarma işlerinde olduğu gibi süreklilik arz eden mutlak bir grev ve lokavt yasağı devam eder","A":"Yasağın kalkmasından itibaren altmış gün içinde, altı iş günü önce karşı tarafa bildirilmek kaydıyla grev ve lokavt uygulamasına devam edilir","D":"Yasak kalktıktan sonra yeniden yetki tespiti yapılmadıkça grev ve lokavt uygulanamaz, taraflar toplu görüşme sürecini baştan başlatmak zorundadır","B":"Yasağın kalkmasından itibaren altmış gün içinde herhangi bir bildirim yapılmaksızın grev ve lokavt uygulamasına doğrudan devam edilir"},"kaynak":{"alinti":"","liste":[{"ad":"Sendikalar ve TİS K. (6356 s.K.) m.62","metin":"MADDE 62 – (1) Can ve mal kurtarma işlerinde; cenaze işlerinde ve mezarlıklarda; şehir şebeke suyu, elektrik, doğal gaz, petrol üretimi, tasfiyesi ve dağıtımı ile nafta veya doğalgazdan başlayan petrokimya işlerinde; (…)11 Millî Savunma Bakanlığı ile Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığınca doğrudan işletilen işyerlerinde; kamu kuruluşlarınca yürütülen itfaiye (…)11 ve hastanelerde grev ve lokavt yapılamaz. (2) Cumhurbaşkanı, genel hayatı önemli ölçüde etkileyen doğa olaylarının gerçekleştiği yerlerde bu durumun devamı süresince yürürlükte kalmak kaydıyla gerekli gördüğü işyerlerinde grev ve lokavtı yasaklayabilir. Yasağın kalkmasından itibaren altmış gün içinde altı iş günü önce karşı tarafa bildirilmek kaydıyla grev ve lokavt uygulamasına devam edilir.12 (3) Başladığı yolculuğu yurt içindeki varış yerlerinde bitirmemiş deniz, hava, demir ve kara ulaştırma araçlarında grev ve lokavt yapılamaz. Anayasa Mahkemesinin 22/10/2014 tarihli ve E.: 2013/1, K.: 2014/161 sayılı Kararı ile, bu fıkrada yer alan “…bankacılık hizmetlerinde;…” ve “…ve şehir içi toplu taşıma hizmetlerinde…” ibareleri iptal edilmiştir. 12 2/7/2018 tarihli ve 700 sayılı Kanun Hükmünde Kararnamenin 197 nci maddesiyle bu fıkrada yer alan “Bakanlar Kurulu” ibaresi “Cumhurbaşkanı” şeklinde değiştirilmiştir. 11 Grev ve lokavtın ertelenmesi"}],"hakem":"Sorunun doğru şıkkı 6356 sayılı Kanun m.62/2\u0027de açıkça yer alan kurala dayanmaktadır: yasağın kalkmasından itibaren altmış gün içinde altı iş günü önce bildirim kaydıyla grev ve lokavta devam edilir."},"kayitlar":[],"sade":{"siklar":{"C":"Toplu görüşmelere ilişkin 30 günlük süreyi karıştırıyor. Bu maddenin süresi 60 gündür; 30 gün başka kurallar için geçerlidir.","E":"Can ve mal kurtarma gibi sürekli yasağı bununla karıştırıyor. Doğa olayı yasağı geçici ve kaldırılabilirdir; kalktıktan sonra bildirimle greve devam edilir.","D":"Yetki tespitinin düşeceğini sanıyor ama yasağın kalkması, yeni yetki kararı almayı gerektirmez. Sadece bildirim yapılırsa grev devam edebilir.","B":"Süreyi doğru bulsa da bildirim şartını atlıyor. 60 gün içinde kalsa bile 6 iş günü öncesinden karşı tarafa haber vermek zorunludur, böylece başlanamazsa doğru değil."},"dogru":"Cumhurbaşkanı doğa olayı nedeniyle koyduğu grev-lokavt yasağı kalktığında, işçi ve işveren yasağın kalkmasından sonraki 60 gün içinde 6 iş günü önceden karşı tarafa haber vererek greve devam edebilir.","sinav":"Sendikalar ve Toplu İş Sözleşmesi Kanunu 62. maddenin ikinci fıkrası","kavramlar":[{"kaynak":"Sendikalar ve TİS K. 62. madde","tanim":"Cumhurbaşkanının genel hayatı önemli ölçüde etkileyen doğa olayları sırasında belirli işyerlerde grev ve lokavtı geçici olarak yasaklama yetkisi; yasak kalktığında bildirimle greve devam edilebilir.","ad":"doğa olayı nedeniyle geçici grev-lokavt yasağı"},{"kaynak":"Sendikalar ve TİS K. 62. madde","tanim":"Grev veya lokavt başlamadan önceki 6 iş günü içinde karşı tarafa resmi olarak haber verme yükümlülüğü.","ad":"bildirim şartı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2019/2"]},"oyun":null,"tip":"teori","soru":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu\u0027na göre, Cumhurbaşkanının genel hayatı önemli ölçüde etkileyen bir doğa olayı nedeniyle belirli bir işyerinde grev ve lokavtı yasakladığı ve bu yasağın sonradan kalktığı bir olayda, grev ve lokavt uygulamasına devam edilmesi hangi kurala bağlıdır?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-11","verilenler":[],"dayanak":"6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.62/1-2","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Karadeniz\u0027de bir sahil kasabasında sel felaketi genel hayatı etkileyince Cumhurbaşkanı, bir liman işletmesinde grev ve lokavtı yasaklıyor; 45 gün sonra sel etkisi geçip yasak kalkıyor.","anlatim":"İşçi sendikası ile işveren, yasak kalkar kalkmaz greve devam etmek istiyor. Ama iki taraf da \u0027şimdi ne yapmalıyız\u0027 diye tereddüt ediyor.","doldur":[]},{"formul":"Ne yapacağız: Türk Ticaret Kanunu değil, 6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanunu m.62/2 uygulanacak; yasağın kalkmasından itibaren altmış gün içinde, altı iş günü önce bildirimle greve devam edilecek.","anlatim":"Bu kuralı beş ifadeyi bu olayda tek tek deneyerek sınayacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"6356 s.K. m.62/2","karar":"doğru","anlatim":"Sel etkisi geçtiğinde liman işçileri tam da bunu yapıyor: altmış günlük süre içinde altı iş günü önceden bildirim gönderiyorlar. Madde 62/2 ikinci cümle tam bunu söylüyor.","formul":"Şık A: sendika başkanı \u0027yasak kalktı, altmış gün içinde altı iş günü önce karşı tarafa haber verip greve devam edelim\u0027 diyor, doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"6356 s.K. m.62/2","karar":"yanlış","anlatim":"Liman işçileri hiç haber vermeden greve başlarsa madde 62/2\u0027deki \u0027kaydıyla\u0027 şartını ihlal eder. Bildirim zorunlu, atlanamaz.","formul":"Şık B: işveren temsilcisi \u0027bildirime gerek yok, yasak kalkar kalkmaz doğrudan greve başlarız\u0027 diyor, katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"6356 s.K. m.62/2","karar":"yanlış","anlatim":"Liman olayında süre kırk beşinci günde değil altmış gün sınırı içinde sayılır, otuz gün değil. Otuz gün başka bir maddeye ait bir sayı, buraya karışmaz.","formul":"Şık C: hukuk müşaviri \u0027süre otuz gün, altı iş günü önceden haber verilir\u0027 diyor, doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"6356 s.K. m.62/2","karar":"yanlış","anlatim":"Liman işçileri için yeni bir yetki süreci gerekmez, zaten yetki tespit edilmişti. Madde 62/2 sadece bildirimle devamı düzenler, baştan başlatmayı değil.","formul":"Şık D: liman müdürü \u0027yasak kalktı, önce yeni bir yetki tespiti yaptıralım, süreci baştan başlatalım\u0027 diyor, gerekli mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"6356 s.K. m.62/1-2","karar":"yanlış","anlatim":"Liman işletmesi hastane veya itfaiye gibi sürekli yasaklı listede değil, doğa olayının etkisiyle geçici yasaklanmıştı. Sel bitince yasak da bitiyor, mutlak yasak burada geçerli değil.","formul":"Şık E: liman işletmecisi \u0027burası da hastane gibi, sürekli yasaklı sayılır\u0027 diyor, haklı mı?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Liman olayında tek doğru yol, altmış gün içinde altı iş günü önce bildirimle greve devam etmek. Kendine hep şunu sor: bu süre altmış gün mü otuz gün mü, ve bildirim şart mı değil mi?","doldur":[]}],"anahtar":[{"ornek":"bildirimle","kok":"bildir"},{"ornek":"altmış","kok":"altmış"},{"ornek":"içinde","kok":"içinde"},{"ornek":"yasaklardan","kok":"yasakl"},{"ornek":"olayında","kok":"olayın"},{"ornek":"işçileri","kok":"işçile"}],"konuGiris":{"harita":"Ne zaman test edilir: Cumhurbaşkanının doğa olayı nedeniyle koyduğu grev-lokavt yasağı kalktığında test edilir. Nasıl ölçülür: yasağın kalkmasından itibaren işlemeye başlayan altmış günlük süre ve altı iş günü önceden bildirim şartıyla ölçülür. Nasıl kaydedilir: karşı tarafa yapılan bildirim tarihi ve yasağın kalkış tarihi esas alınarak değerlendirilir.","desen":"Sınav genelde yasağın kalkmasından sonra grev-lokavta devam edilmesinin hangi süre ve bildirim şartına bağlı olduğunu sorar; tuzak, altmış günlük süreyi altı iş günlük bildirim süresiyle karıştırtmaktır. Bazı sorularda yasağın kim tarafından konulduğu da (Cumhurbaşkanı) karıştırılır. Bu soru m.62/2 hükmünden geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Cumhurbaşkanının genel hayatı etkileyen doğa olayı nedeniyle koyduğu geçici grev-lokavt engeli","ad":"doğa olayı yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"yasak kalktıktan sonra grev-lokavta dönülebilecek azami süre sınırı","ad":"altmış günlük süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"karşı tarafa uygulamaya devam edileceğinin önceden haber verilmesi süresi","ad":"altı iş günü bildirim","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"grev veya lokavt uygulayacak tarafın diğer tarafa yaptığı resmi haber verme işlemi","ad":"karşı tarafa bildirim","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Soru, doğa olayı nedeniyle konan yasağın kalktığı bir olayı verip devam şartının hangi kurala bağlı olduğunu ister.","panel_ornek":"Bir apartman yönetimi, deprem riski nedeniyle asansör bakımını üç ay durdurmuş, sonra risk kalkınca bakıma tekrar başlarken önce yöneticiye beş gün önceden haber vermiş. Yani bir engel kalksa bile eski işe dönüş belirli bir süre ve önceden bildirim şartına bağlanıyor.","ornek":"Bir apartman yönetimi, deprem riski nedeniyle asansör bakımını üç ay durdurmuş, sonra risk kalkınca bakıma tekrar başlarken önce yöneticiye beş gün önceden haber vermiş. Yani bir engel kalksa bile eski işe dönüş belirli bir süre ve önceden bildirim şartına bağlanıyor.","yontemler":"Metindeki iki sayıyı (altmış gün, altı iş günü) birbirine karıştırmadan doğru eşleştirmek en kritik noktadır.","nedir":"Grev lokavt yasağı, hangi işyerlerinde ve hangi hallerde grev-lokavtın uygulanamayacağını belirleyen düzenlemedir. Sınav, yasağın kalkması sonrası devam şartlarının süre ve bildirim kurallarını bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Süre Karıştırma Tuzağı","metin":"Toplu görüşmenin başlamasına ilişkin otuz günlük süreyi bu maddedeki altmış günlük süreyle karıştırıyorsun. Doğrusu: madde 62/2\u0027deki süre altmış gündür, otuz gün başka bir hükme aittir."},"E":{"ad":"İki Yasağın Karıştırılması Tuzağı","metin":"Madde 62/1\u0027deki sürekli mutlak yasak ile madde 62/2\u0027deki geçici ve kaldırılabilir Cumhurbaşkanı yasağını aynı kurum sanıyorsun. Doğrusu: doğa olayı yasağı geçicidir, kalktığında bildirimle devam edilebilir, mutlak yasak kapsamına girmez."},"D":{"ad":"Yetki Düşmesi Tuzağı","metin":"Grev-lokavt yasağının kalkmasını, yetki tespitinin düşmesi ve sürecin yeniden başlaması gerektiren farklı bir kurumla karıştırıyorsun. Doğrusu: madde 62/2 yalnız bildirimle devam etmeyi öngörür, yeni bir yetki süreci aranmaz."},"B":{"ad":"Bildirim Şartını Atlama Tuzağı","metin":"Süreyi doğru hatırlayıp bildirim yükümlülüğünü unutuyorsun. Doğrusu: altmış günlük süre içinde ayrıca altı iş günü önceden bildirim yapılması zorunludur."}},"celdiriciYol":{"C":"Toplu görüşmeye çağrı süresi olan otuz gün, madde 62/2\u0027deki altmış günün yerine konularak \u0027otuz gün + altı iş günü\u0027 kurgusu oluşturulur (süre kaynağı karıştırma)","E":"Madde 62/1\u0027deki mutlak-sürekli yasak listesi, madde 62/2\u0027deki geçici yasakla birleştirilerek \u0027süreklilik\u0027 sonucuna varılır (iki fıkranın birbirine karıştırılması)","D":"Yetki düşmesine ilişkin ayrı bir hükmün sonucu bu maddeye taşınarak \u0027yeniden yetki süreci\u0027 şartı eklenir (farklı madde kuralının yüklenmesi)","B":"Altmış günlük süreyi doğru okuyup bildirim şartını atlayarak \u0027süre yeterli\u0027 sonucuna varılır (bildirim katmanının atlanması)"},"hap":"6356 sayılı Kanun m.62/2\u0027de Cumhurbaşkanının koyduğu doğa olayı kaynaklı grev-lokavt yasağı kalktığında, altmış gün içinde altı iş günü önceden bildirimle uygulamaya devam edilir; bu geçici yasak, madde 62/1\u0027deki sürekli-mutlak yasaklardan ayrıdır.","teshis":{"C":{"gercek":"Madde 62/2\u0027de belirtilen süre açıkça altmış gündür, otuz gün başka bir hükme (toplu görüşmeye çağrı) aittir.","ayirt":"Bu süre hangi maddede, hangi olay için öngörülmüş?","paragraf":"6356 s.K. m.62/2","yanilgi":"Toplu görüşme sürecindeki otuz günlük süreyle bu maddedeki süreyi aynı kalıba oturtuyorsun."},"E":{"gercek":"Madde 62/1 belirli işyerlerinde daimi yasak koyar; madde 62/2 ise doğa olayının devamı süresince geçerli, kalkabilen bir yasaktır.","ayirt":"Bu yasak sürekli mi, yoksa bir olayın devamına bağlı geçici bir yasak mı?","paragraf":"6356 s.K. m.62/1-2","yanilgi":"Madde 62/1\u0027deki sürekli-mutlak yasak listesini madde 62/2\u0027deki geçici yasakla aynı kategoride görüyorsun."},"A":{"gercek":"6356 sayılı Kanun m.62/2 açıkça altmış günlük süre ve altı iş günü önceden bildirim şartını birlikte arar.","ayirt":"Yasağın kalkması tek başına yeterli mi, yoksa ayrıca bildirim mi gerekiyor?","paragraf":"6356 s.K. m.62/2","yanilgi":"Bu şıkkı eleyen öğrenci, geçici yasağın kalkmasından sonra hiçbir usul aranmadan sürecin kendiliğinden bittiğini düşünür."},"D":{"gercek":"Madde 62/2 yeni bir yetki süreci öngörmez, yalnız bildirimle devam etmeyi düzenler; yetki düşmesi tamamen ayrı bir kurumdur.","ayirt":"Bu madde yeni bir süreç mi başlatıyor, yoksa mevcut sürece devam mı öngörüyor?","paragraf":"6356 s.K. m.62/2","yanilgi":"Grev-lokavt yasağının kalkmasını yetki tespitinin düşmesiyle aynı hukuki sonuç sanıyorsun."},"B":{"gercek":"Madde metni bildirimi süreyle birlikte aynı cümlede \u0027kaydıyla\u0027 ifadesiyle şart koşar; bildirim olmadan devam mümkün değildir.","ayirt":"Maddede geçen \u0027kaydıyla\u0027 ibaresi neyi şart koşuyor?","paragraf":"6356 s.K. m.62/2","yanilgi":"Süreyi doğru bilip bildirim yükümlülüğünü gereksiz bir formalite sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 107"},"kural":"emsal işçi önce işyerinde aynı/benzer işte çalışan tam süreli işçidir; böyle bir işçi yoksa o işkolunda şartlara uygun işyerinde çalışan tam süreli işçi esas alınır, sıralama tam tersi değildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 107","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Emsal işçi tanımında sıralamayı (önce işyeri, sonra işkolu) tersine çeviren şıklara dikkat et.","konu":"kısmı süreli is sözleşmesi","tablo":{"satirlar":[["A) Kısmi süreli çalışan işçinin ücret ve paraya ilişkin böl…","m.13/3","doğru ifade"],["B) Kısmi süreli iş sözleşmesiyle çalıştırılan işçi, ayrımı …","m.13/2","doğru ifade"],["C) İşyerinde çalışan işçilerin kısmi süreliden tam süreliye…","m.13/5","doğru ifade"],["D) Emsal işçi belirlenirken işyerinde aynı veya benzer işte…","m.13/4","YANLIŞ ifade"],["E) Mecburi ilköğretim çağının başladığı tarihi takip eden a…","m.13/6","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşyerinde çalışan işçilerin kısmi süreliden tam süreliye veya tam süreliden kısmi süreliye geçirilme istekleri işverence dikkate alınır ve boş yerler zamanında duyurulur.","E":"Mecburi ilköğretim çağının başladığı tarihi takip eden ay başına kadar kısmi süreli çalışma talebinde bulunan işçinin bu talebi işveren tarafından karşılanır ve bu talep geçerli fesih nedeni sayılmaz.","A":"Kısmi süreli çalışan işçinin ücret ve paraya ilişkin bölünebilir menfaatleri, tam süreli emsal işçiye göre çalıştığı süreye orantılı olarak ödenir.","D":"Emsal işçi belirlenirken işyerinde aynı veya benzer işte tam süreli çalıştırılan işçi bulunmasa dahi öncelikle işyeri dışından herhangi bir işçi esas alınır, işkolundaki emsal işçi ancak son çare olarak dikkate alınır.","B":"Kısmi süreli iş sözleşmesiyle çalıştırılan işçi, ayrımı haklı kılan bir neden olmadıkça salt sözleşmenin kısmi süreli olmasından dolayı tam süreli emsal işçiye göre farklı işleme tabi tutulamaz."},"kaynak":{"alinti":"teki emsal işçi belirleme sırasını (işyeri içi tam süreli → işkolu emsali) ters çevirerek yanlış bir ifade sunmaktadır; bu nedenle","liste":[{"ad":"İş K. (4857 s.K.) m.13 [1/2]","metin":"Madde 13 - İşçinin normal haftalık çalışma süresinin, tam süreli iş sözleşmesiyle çalışan emsal işçiye göre önemli ölçüde daha az belirlenmesi durumunda sözleşme kısmî süreli iş sözleşmesidir. Kısmî süreli iş sözleşmesi ile çalıştırılan işçi, ayırımı haklı kılan bir neden olmadıkça, salt iş sözleşmesinin kısmî süreli olmasından dolayı tam süreli emsal işçiye göre farklı işleme tâbi tutulamaz. Kısmî süreli çalışan işçinin ücret ve paraya ilişkin bölünebilir menfaatleri, tam süreli emsal işçiye göre çalıştığı süreye orantılı olarak ödenir. Emsal işçi, işyerinde aynı veya benzeri işte tam süreli çalıştırılan işçidir. İşyerinde böyle bir işçi bulunmadığı takdirde, o işkolunda şartlara uygun işyerinde aynı veya benzer işi üstlenen tam süreli iş sözleşmesiyle çalıştırılan işçi esas alınır. İşyerinde çalışan işçilerin, niteliklerine uygun açık yer bulunduğunda kısmî süreliden tam süreliye veya tam süreliden kısmî süreliye geçirilme istekleri işverence dikkate alınır ve boş yerler zamanında duyurulur. (Ek fıkra: 29/1/2016-6663/21 md.) Bu kanunun 74 üncü maddesinde öngörülen izinlerin bitiminden sonra mecburi ilköğretim çağının başladığı tarihi takip eden ay başına kadar bu maddeye göre ebeveynlerden biri kısmi süreli çalışma talebinde bulunabilir. Bu talep işveren tarafından karşılanır ve geçerli fesih nedeni sayılmaz. Bu fıkra kapsamında kısmi süreli çalışmaya başlayan işçi, aynı çocuk için bir daha bu haktan faydalanmamak üzere tam zamanlı çalışmaya dönebilir. Kısmi süreli çalışmaya geçen işçinin tam zamanlı çalışmaya başlaması durumunda yerine işe alınan işçinin iş sözleşmesi ke…"},{"ad":"İş K. (4857 s.K.) m.13 [2/2]","metin":"Ebeveynlerden birinin çalışmaması hâlinde, çalışan eş kısmi süreli çalışma talebinde bulunamaz. Üç yaşını doldurmamış bir çocuğu eşiyle birlikte veya münferiden evlat edinenler de çocuğun fiilen teslim edildiği tarihten itibaren bu haktan faydalanır. (Ek fıkra: 29/1/2016-6663/21 md.) Beşinci fıkra kapsamında hangi sektör veya işlerde kısmi çalışma yapılabileceği ile uygulamaya ilişkin usul ve esaslar Çalışma ve Sosyal Güvenlik Bakanlığınca çıkarılacak yönetmelikle belirlenir. Çağrı üzerine çalışma ve uzaktan çalışma5"}],"hakem":"Doğru sık (D), İş Kanunu m.13\u0027teki emsal işçi belirleme sırasını (işyeri içi tam süreli → işkolu emsali) ters çevirerek yanlış bir ifade sunmaktadır; bu nedenle \u0027yanlış\u0027 sorusuna doğru cevaptır."},"kayitlar":[],"sade":{"siklar":{"C":"Kanun işverenin işçilerin geçiş taleplerini dikkate almasını ve boş yerleri duyurmasını öngörür; talep sonuç almak zorunda değildir, ifade maddeye uyar.","E":"Çocuğu olan ebeveyn için kısmi süreli çalışma talebi işveren tarafından karşılanacak ve geçerli fesih nedeni sayılmayacaktır; maddenin lafzı bunu açıkça düzenler.","A":"Kısmi süreli işçinin ücret ve diğer paraya ilişkin yararları, çalışma süresine orantılı olarak verilmesi kanunun lafzına uyar; yanlış şık değildir.","B":"Eşit işlem ilkesi doğrudan maddenin metninde yer almıştır; ayırımı haklı kılan bir neden olmadıkça farklı muamele yapılamaz, bu ifade doğrudur."},"dogru":"Kanun emsal işçiyi seçerken önce işyerde aynı veya benzer işte tam süreli çalışan kişiyi esas alır. Böyle biri yoksa o zaman işkolundaki emsal aranır. D şıkkı bu sıralamanın tam tersini söyler, bu yüzden yanlıştır.","sinav":"İş Kanunu 13. madde","kavramlar":[{"kaynak":"İş Kanunu 13. madde","tanim":"İşçinin normal haftalık çalışma süresinin tam süreli emsal işçiye göre önemli ölçüde daha az olmasıyla yapılan iş sözleşmesidir.","ad":"Kısmi süreli iş sözleşmesi"},{"kaynak":"İş Kanunu 13. madde","tanim":"Emsal işçi seçiminde öncelik işyerinde aynı veya benzer işte tam süreli çalışan kişiye verilir; işyerde böyle kişi yoksa o işkolunda aynı işi yapan tam süreli işçi esas alınır.","ad":"Emsal işçi"},{"kaynak":"İş Kanunu 13. madde","tanim":"Kısmi süreli çalışanın ücret ve paraya ilişkin bölünebilir menfaatleri tam süreli emsal işçiye göre çalıştığı süreye orantılı olarak ödenir.","ad":"Orantılı ödeme"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2015/2"]},"oyun":null,"tip":"teori","soru":"4857 sayılı İş Kanununun 13 üncü maddesinde düzenlenen kısmi süreli iş sözleşmesine ilişkin aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-08","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.13/4","dogru":"D","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Bir tekstil fabrikasında Ayşe Hanım haftada 20 saat kısmi süreli çalışıyor, aynı bölümde Mehmet Bey ise haftada 40 saat tam süreli çalışıyor.","anlatim":"İşveren Ayşe Hanım\u0027ın ikramiyesini, izinlerini ve emsal işçi tespitini nasıl yapacağını soruyor. Fabrikada bu konularda beş farklı uygulama öneriliyor.","doldur":[]},{"formul":"Ne yapacağız: m.13\u0027teki beş kuralı bu fabrikadaki Ayşe Hanım\u0027ın durumuna uygulayıp hangisinin kanuna aykırı olduğunu bulacağız.","anlatim":"Kural şu: kısmi süreli işçiye orantılı ödeme yapılır, ayrımcılık yasaktır, emsal işçi önce işyerinden aranır, geçiş istekleri dikkate alınır, ilköğretim öncesi talep karşılanır. Şimdi bu beş ifadeyi Ayşe Hanım\u0027ın olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.13/3","karar":"doğru","anlatim":"Ayşe Hanım tam süreli Mehmet Bey\u0027in yarısı kadar çalışıyor, o yüzden ikramiyesi de yarısı olur. Kanun bölünebilir menfaatlerin çalışma süresine orantılı ödenmesini açıkça söylüyor.","formul":"Şık A: muhasebeci \u0027Ayşe Hanım\u0027ın yıl sonu ikramiyesini 20/40 oranında, yani yarısını ödeyelim\u0027 diyor, doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.13/2","karar":"doğru","anlatim":"Hayır, sadece kısmi süreli olduğu için farklı işlem yapılamaz; haklı bir neden gösterilmeden yemek kartı kesilemez. Kanun ayrımı haklı kılan neden olmadıkça eşit işlem ister.","formul":"Şık B: yeni işe alınan bir kısmi süreli işçiye \u0027sen kısmi çalışıyorsun, yemek kartın olmasın\u0027 diyorlar, bu haklı bir gerekçe olmadan yapılabilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.13/5","karar":"doğru","anlatim":"Evet, kanun burada mutlak bir hak vermiyor, sadece isteğin dikkate alınmasını ve boş yerlerin duyurulmasını istiyor. İK\u0027nın yaptığı tam da bu.","formul":"Şık C: Ayşe Hanım tam süreliye geçmek istiyor, İK \u0027senin isteğini not ettik, boş kadro açılırsa duyururuz\u0027 diyor, bu yeterli mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.13/4","karar":"yanlış","anlatim":"Yanlış, kanun önce işyeri içinde aynı işi yapan tam süreli işçiyi arar; işyerinde yoksa işkoluna bakılır. İK\u0027nın kurduğu sıra tam ters, önce işyerine bakılmalı.","formul":"Şık D: fabrikada Ayşe Hanım gibi çalışan başka kimse yok, İK \u0027emsal işçiyi doğrudan işkolundaki başka bir fabrikadan seçelim, işyeri içi arama gereksiz\u0027 diyor, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.13/6","karar":"doğru","anlatim":"Hayır, kanun bu talebin işverence karşılanacağını açıkça söylüyor, red hakkı yok. Ayrıca bu talep geçerli fesih nedeni de sayılmaz.","formul":"Şık E: Ayşe Hanım\u0027ın 5 yaşındaki çocuğu var, ilköğretime başlamadan önce kısmi çalışma talep ediyor, işveren \u0027bu talebi reddedebilirim\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Tek yanlış D, çünkü kanun emsal işçiyi önce işyeri içinde arar, işkolu dışarısı ancak işyerinde emsal bulunmazsa devreye girer. Kendine hep şunu sor: kanun önce işyerini mi arıyor yoksa doğrudan dışarıyı mı işaret ediyor?","doldur":[]}],"anahtar":[{"ornek":"işyerinde","kok":"işyeri"},{"ornek":"süreli","kok":"süreli"},{"ornek":"işkolunda","kok":"işkolu"},{"ornek":"çalışan","kok":"çalışa"},{"ornek":"açıkça","kok":"açıkça"},{"ornek":"alınır","kok":"alınır"}],"konuGiris":{"harita":"Ne zaman kısmi süreli sayılır: haftalık çalışma süresi emsal tam süreli işçiye göre önemli ölçüde azsa. Nasıl ölçülür: ücret ve bölünebilir menfaatler çalışılan süreye orantılı hesaplanır, ayrımcılık yasağı aranır. Nasıl kaydedilir/uygulanır: ebeveyn kısmi çalışma talebi işverence karşılanır ve geçerli fesih nedeni sayılmaz.","desen":"Sınav genelde \u0027yanlış olanı bulun\u0027 formatında, madde metnindeki bir kuralın tersini seçenek yapar; örneğin \u0027ayrımcılık haklı nedenle bile yasaktır\u0027 gibi çarpıtma sık görülür. Diğer tuzak, ebeveyn talebinin işveren tarafından reddedilebileceğini söylemektir, oysa m.13 bu talebin karşılanacağını ve geçerli fesih nedeni sayılmayacağını belirtir. Bu soru m.13 fıkra sıralaması (p.13) noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"İşyerinde aynı/benzer işte tam süreli çalışan işçi","ad":"Emsal işçi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Haklı neden yoksa kısmi süreli işçiye farklı işlem yapılamaması","ad":"Eşit işlem yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ücret ve bölünebilir menfaatlerin çalışılan süreye göre paylaştırılması","ad":"Orantılı ödeme","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Belirli izin sonrası bir ebeveynin talep edebileceği kısmi çalışma hakkı","ad":"Ebeveyn kısmi çalışma talebi","kim":"kanun sabitler"}],"sinavda":"Kısmi süreli iş sözleşmesine ilişkin beş önerme verilir ve hangisinin kanun metnine aykırı olduğu sorulur.","panel_ornek":"Bir arkadaşın haftada 2 gün, diğeri haftada 5 gün aynı kafede çalışıyor. İkisi de saat başı 50 lira alıyor ama 2 günlük olan ay sonunda daha az gün karşılığı ödeme alıyor; bu orantılı ödemedir, ayrımcılık değildir.","ornek":"Bir arkadaşın haftada 2 gün, diğeri haftada 5 gün aynı kafede çalışıyor. İkisi de saat başı 50 lira alıyor ama 2 günlük olan ay sonunda daha az gün karşılığı ödeme alıyor; bu orantılı ödemedir, ayrımcılık değildir.","yontemler":"Her seçeneği madde metnindeki cümlelerle birebir karşılaştır; \u0027salt kısmi süreli olduğu için\u0027 ifadesi geçen seçeneklere dikkat et.","nedir":"Kısmi süreli iş sözleşmesi, işçinin haftalık çalışma süresinin emsal tam süreli işçiye göre önemli ölçüde az olduğu sözleşme türüdür. Sınav bu sözleşmedeki eşit işlem, orantılı ödeme ve ebeveyn hakkı kurallarının doğru bilinip bilinmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Talep Sırası Tuzağı","metin":"öğrenci bu geçiş isteklerinin işveren için bağlayıcı bir zorunluluk olduğunu sanabilir; oysa madde yalnız dikkate alınmasını ve boş yerlerin duyurulmasını öngörür, bu haliyle metne uygundur, yanlış şık bu değildir."},"E":{"ad":"Ebeveyn İzni Kapsamı Tuzağı","metin":"öğrenci bu talebin işverence reddedilebileceğini ya da geçerli fesih nedeni sayılabileceğini düşünebilir. Doğrusu: madde bu talebin işverence karşılanacağını ve geçerli fesih nedeni sayılmayacağını açıkça düzenler, ifade doğrudur."},"A":{"ad":"Ne soruluyor","metin":"beş ifadeden hangisinin İş Kanununun 13 üncü maddesine aykırı olduğu soruluyor. Kural: kısmi süreli çalışanın ücret ve paraya ilişkin bölünebilir menfaatleri çalıştığı süreye orantılı ödenir. Doğrusu: bu ifade maddenin lafzına uygundur, yanlış şık değildir."},"B":{"ad":"Ayrımcılık Yasağı Tuzağı","metin":"öğrenci bu ilkenin madde metninde yer almadığını, sonradan yargı içtihadıyla geldiğini sanır. Doğrusu: eşit işlem ilkesi doğrudan 13 üncü maddede düzenlenmiştir, ifade doğrudur."}},"celdiriciYol":null,"hap":"Kısmi süreli iş sözleşmesinde emsal işçi önce işyerinde, yoksa işkolunda aynı/benzer işte çalışan tam süreli işçidir.","teshis":{"C":{"gercek":"m.13/5 yalnız \u0027dikkate alınır ve boş yerler duyurulur\u0027 der, mutlak geçiş hakkı yaratmaz.","ayirt":"Madde işverene emir mi veriyor yoksa yalnız dikkate alma yükümü mü?","paragraf":"m.13/5","yanilgi":"Geçiş isteklerinin işveren için mutlak bağlayıcı bir hak olduğunu sanıyorsun."},"E":{"gercek":"m.13/6 bu talebin işverence karşılanacağını ve geçerli fesih nedeni sayılmayacağını açıkça hükme bağlar.","ayirt":"Madde \u0027karşılanır\u0027 mı diyor yoksa \u0027karşılanabilir\u0027 mi diyor?","paragraf":"m.13/6","yanilgi":"Bu talebin işverenin takdirine bağlı olduğunu, reddedilebileceğini sanıyorsun."},"A":{"gercek":"İş Kanunu m.13/3 bu orantılı ödemeyi doğrudan düzenler.","ayirt":"Bu ifade doğrudan maddenin cümlesi mi, yoksa benim yorumum mu?","paragraf":"m.13/3","yanilgi":"Bölünebilir menfaatlerin orantılı ödenmesi kuralının madde metninde geçmediğini, uygulamadan türetildiğini sanıyorsun."},"D":{"gercek":"m.13/4 emsal işçiyi önce işyerinde, işyerinde yoksa işkolunda arar; sıralama şıkta tersine çevrilmiştir.","ayirt":"Kanun önce işyerini mi arıyor, yoksa işyeri dışını mı önceliyor?","paragraf":"m.13/4","yanilgi":"Emsal işçi tespitinde önce işkolundaki dış işçinin, işyerindeki işçinin ise ikincil olduğunu sanıyorsun."},"B":{"gercek":"m.13/2 haklı neden olmadıkça farklı işlem yasağını açıkça koyar.","ayirt":"Ayrımı haklı kılan neden var mı sorusu maddenin kendisinde mi soruluyor?","paragraf":"m.13/2","yanilgi":"Eşit işlem ilkesinin bu maddede değil genel ilkelerde düzenlendiğini sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 112"},"kural":"5510 sayılı Kanun m.4/2-a gereği, birinci fıkranın (a) bendine göre sigortalı sayılanlara ilişkin hükümler, işçi sendikaları ve konfederasyonları ile sendika şubelerinin başkanlıkları ve yönetim kurullarına seçilenler hakkında da uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 112","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde metninde \u0027hakkında da uygulanır\u0027 ifadesi geçen bent varsa, o bent hangi statüyü koruyorsa cevap odur; farklı bentteki istisnayı (kamu görevlisi/aylıksız izin) karıştırma.","konu":"sendikal guvenceler","tablo":{"satirlar":[["A) Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi k…","5510 s.K. m.4/2-a","doğru ifade"],["B) Sigortalılığı, işyerinden ayrıldığı tarih itibarıyla ken…","5510 s.K. m.4/2-a","YANLIŞ ifade"],["C) Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendi k…","5510 s.K. m.4/2-a","YANLIŞ ifade"],["D) Kamu görevlisi statüsünde bulunuyorsa, aylıksız izne ayr…","5510 s.K. m.4/3-c","YANLIŞ ifade"],["E) Seçildiği sendika, işveren vekili konumuna geçtiğinden d…","5510 s.K. m.12","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kanunun 4 üncü maddesinin birinci fıkrasının (b) bendi kapsamında kendi nam ve hesabına çalışan sigortalı sayılır.","E":"Seçildiği sendika, işveren vekili konumuna geçtiğinden dolayı sendika kişinin primlerini işveren sıfatıyla öder.","A":"Kanunun 4 üncü maddesinin birinci fıkrasının (a) bendi kapsamındaki sigortalılığı, bu görevi sürdürdüğü sürece devam eder.","D":"Kamu görevlisi statüsünde bulunuyorsa, aylıksız izne ayrılmış kabul edilerek sigortalılığı bu süre boyunca durur.","B":"Sigortalılığı, işyerinden ayrıldığı tarih itibarıyla kendiliğinden sona erer ve göreve seçildiğinde yeniden tescil işlemi yapılması zorunludur."},"kaynak":{"alinti":"","liste":[{"ad":"5510 s. SGK Kanunu m.4 [1/4]","metin":"MADDE 4- (Değişik: 17/4/2008-5754/2 md.) Bu Kanunun kısa ve uzun vadeli sigorta kolları uygulaması bakımından; a) Hizmet akdi ile bir veya birden fazla işveren tarafından çalıştırılanlar, b) Köy ve mahalle muhtarları ile hizmet akdine bağlı olmaksızın kendi adına ve hesabına bağımsız çalışanlardan ise; 1) Ticarî kazanç veya serbest meslek kazancı nedeniyle gerçek veya basit usûlde gelir vergisi mükellefi olanlar, 2) Gelir vergisinden muaf olup, esnaf ve sanatkâr siciline kayıtlı olanlar, 3) Anonim şirketlerin yönetim kurulu üyesi olan ortakları, sermayesi paylara 25/3/2020 tarihli ve 7226 sayılı Kanunun 44 üncü maddesiyle bu fıkrada yer alan “alanlar ve bu Kanunun ek 9 uncu maddesinin birinci fıkrasına tabi olarak çalışanlardan” ibaresi “alanlardan” şeklinde değiştirilmiştir. 4 bölünmüş komandit şirketlerin komandite ortakları, diğer şirket ve donatma iştiraklerinin ise tüm ortakları, 4) Tarımsal faaliyette bulunanlar, c) Kamu idarelerinde; 1) Bu maddenin birinci fıkrasının (a) bendine tabi olmayanlardan, kadro ve pozisyonlarda sürekli olarak çalışıp ilgili kanunlarında (a) bendi kapsamına girenler gibi sigortalı olması öngörülmemiş olanlar, 2) Bu maddenin birinci fıkrasının (a) ve (b) bentlerine tabi olmayanlardan, sözleşmeli olarak çalışıp ilgili kanunlarında (a) bendi kapsamına girenler gibi sigortalı olması öngörülmemiş olanlar ile 657 sayılı Devlet Memurları Kanununun 86 ncı maddesi uyarınca açıktan vekil atananlar, sigortalı sayılırlar."},{"ad":"5510 s. SGK Kanunu m.4 [2/4]","metin":"Birinci fıkranın (a) bendi gereği sigortalı sayılanlara ilişkin hükümler; a) İşçi sendikaları ve konfederasyonları ile sendika şubelerinin başkanlıkları ve yönetim kurullarına seçilenler, b) Bir veya birden fazla işveren tarafından çalıştırılan; film, tiyatro, sahne, gösteri, ses ve saz sanatçıları ile müzik, resim, heykel, dekoratif ve benzeri diğer uğraşları içine alan bütün güzel sanat kollarında çalışanlar ile düşünürler ve yazarlar, c) Mütekabiliyet esasına dayalı olarak uluslararası sosyal güvenlik sözleşmesi yapılmış ülke uyruğunda olanlar hariç olmak üzere, yabancı uyruklu kişilerden hizmet akdi ile çalışanlar, d) 2/7/1941 tarihli ve 4081 sayılı Çiftçi Mallarının Korunması Hakkında Kanuna göre çalıştırılanlar, e) 24/4/1930 tarihli ve 1593 sayılı Umumi Hıfzısıhha Kanununda belirtilen umumî kadınlar, f) Milli Eğitim Bakanlığı tarafından düzenlenen kurslarda usta öğretici olarak çalıştırılanlar, kamu idarelerinde ders ücreti karşılığı görev verilenler ile 657 sayılı Devlet Memurları Kanununun 4 üncü maddesinin (C) bendi kapsamında çalıştırılanlar, g) (Ek: 11/10/2011-KHK-665/29 md.) Türkiye İş Kurumu tarafından düzenlenen Toplum Yararına Çalışma Programlarından yararlananlar, hakkında da uygulanır. (Ek cümle: 11/10/2011-KHK-665/29 md.) Bu fıkranın (g) bendinde sayılanlar için Türkiye İş Kurumu prim ödeme yükümlüsü olmakla birlikte bu Kanun kapsamında işyeri ve işveren sayılmaz. Birinci fıkranın (b) bendi gereği sigortalı sayılanlara ilişkin hükümler; 10/7/1953 tarihli ve 6132 sayılı At Yarışları Hakkında Kanuna tabi jokey ve antrenörler hakkında da uygulanır."}],"hakem":"5510 s. SGK Kanunu m.4/2-a\u0027da işçi sendikaları yönetim kurullarına seçilenler için 4/1-a kapsamındaki sigortalılık hükümlerinin uygulanacağı açıkça düzenlenmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Sendika yönetim kurulu üyesi işyerinden ayrıldığında bağımsız çalışan statüsüne geçtiği sanılabilir; ancak kanun burada özel olarak işçi sigortalısı hükümlerinin uygulanacağını belirtir, statü değişmez.","E":"Sendika yönetim kurulu üyesi olursa sendikanın işveren konumu kazanıp primlerini ödeceği sanılabilir; oysa sendika yönetim kurulu üyeliğinin işveren vekilliğiyle hiçbir ilgisi yoktur.","D":"Kamu görevlisinin sendika yönetim kurulunda aylıksız izne ayrılma hükmü vardır diye düşünülebilir; ama bu hüküm yalnız kamu görevlileri için geçerlidir, işçi statüsündeki sendika yöneticisine uygulanmaz.","B":"İşçinin fiilen işyerinden ayrılması sigortalılığın sona erdiğini düşündürebilir; oysa kanun bu kişileri açıkça işçi sigortalı olarak tutmaya devam eder, ne sigortalılık kesilir ne yeniden tescil yapılması gerekir."},"dogru":"Sendika yönetim kuruluna seçilen işçi, işyerinden ayrılsa da kanun onu işçi sigortalı saymaya devam eder. Sigortalılığı görev süresince hiç kesilmez, kesintisiz devam eder.","sinav":"Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu 4. madde, ikinci fıkra (a) bendi.","kavramlar":[{"kaynak":"5510 s. SGK Kanunu 4. madde","tanim":"Bir veya birden fazla işveren tarafından hizmet akdine bağlı olarak çalıştırılan kişi. Bu kanun kapsamında sigorta koruması altındadır.","ad":"Hizmet akdi ile çalışan (işçi)"},{"kaynak":"5510 s. SGK Kanunu 4. madde","tanim":"İşçi sendikaları ve konfederasyonları ile sendika şubelerinin başkanlıkları ve yönetim kurullarına seçilen kişi. Kanun bu kişilerin işçi sigortalılığının görev süresince devam etmesini öngörür.","ad":"İşçi sendikası yönetim kurulu üyesi"},{"kaynak":"5510 s. SGK Kanunu 4. madde","tanim":"Sigortalı statüsünün kırılmaksızın devam etmesi. Bu durumda kişi primlerini ödeyen ve sigorta hakkından yararlanan kişi olmaya devam eder.","ad":"Sigortalılığın devamı"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2020/2"]},"oyun":null,"tip":"teori","soru":"5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu\u0027na göre, bir işçi sendikasının yönetim kuruluna seçilerek çalıştığı işyerinden ayrılan kişinin sigortalılık statüsüne ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-09","verilenler":[],"dayanak":"5510 sayılı Kanun m.4/2-a","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Ankara\u0027da bir tekstil fabrikasında 6 yıldır çalışan işçi Kemal, 2021 martında bağlı olduğu işçi sendikasının yönetim kuruluna seçilir ve fabrikadaki işine fiilen gelmemeye başlar.","anlatim":"Kemal artık işyerinde çalışmıyor ama sendika yöneticiliği devam ediyor. Onun 5510 sayılı Kanun karşısındaki sigortalılık statüsü ne olacak, bunu çözeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 5510 s.K. m.4/2-a, sendika yönetim kuruluna seçilenleri 4/1-a sigortalısı sayar; Kemal\u0027in statüsü görev süresince aynen devam eder. Beş ifadeyi Kemal\u0027in olayında tek tek deneyeceğiz.","anlatim":"Kural tek: kanun bu kişiler için özel devam hükmü koymuş. Şimdi A\u0027dan E\u0027ye sırayla bakalım.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"5510 s.K. m.4/2-a","karar":"doğru","anlatim":"5510 s.K. m.4/2-a bunu açıkça söylüyor; sendika yönetim kuruluna seçilenler hakkında 4/1-a hükümleri uygulanmaya devam eder. Kemal işyerinden fiziken ayrılsa da statüsü değişmez.","formul":"Şık A: Kemal\u0027in 4/1-a sigortalılığı, yönetim kurulu üyeliği sürdüğü müddetçe kesintisiz devam eder mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"5510 s.K. m.4/2-a","karar":"yanlış","anlatim":"Kanun bu durumu istisna sayıp devam hükmü koyduğu için sigortalılık kesilmez. Yeniden tescil gerekmez, statü sürer.","formul":"Şık B: Kemal işyerinden ayrıldığı için sigortalılığı kendiliğinden biter, göreve seçilince yeniden tescil mi gerekir?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"5510 s.K. m.4/2-a","karar":"yanlış","anlatim":"Madde metni açıkça 4/1-a hükümlerinin uygulanacağını söylüyor, (b) bendine hiç atıf yapmıyor. Kemal\u0027in statüsü işçi statüsü olarak kalır.","formul":"Şık C: Kemal artık kendi nam ve hesabına çalışan biri gibi 4/1-b sigortalısı mı sayılır?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"5510 s.K. m.4/3-c","karar":"yanlış","anlatim":"Aylıksız izin hükmü yalnız kamu görevlisi sendika yöneticileri için, yani 4/1-c kapsamındakiler için geçerli. Kemal işçi, bu hüküm ona uygulanmaz.","formul":"Şık D: Kemal kamu görevlisi olsaydı aylıksız izinli sayılıp sigortalılığı durur muydu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"5510 s.K. m.12","karar":"yanlış","anlatim":"Sendika yöneticiliği, işveren adına iş yönetmek değildir; işveren vekilliği ayrı bir kavramdır. Kemal\u0027in primleri bu kuralla ilgisizdir.","formul":"Şık E: Sendika, Kemal\u0027i seçtiği için işveren vekili konumuna geçer ve primlerini işveren sıfatıyla öder mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Kanun sendika yöneticiliğine seçilen işçiyi 4/1-a sigortalısı saymaya devam eder, bu tek istisna hükmüdür. Kendine sor: bu hüküm hangi bent için, kime yazılmış?","doldur":[]}],"anahtar":[{"ornek":"sendikaları","kok":"sendik"},{"ornek":"yönetim","kok":"yöneti"},{"ornek":"sigortalılıklarını","kok":"sigort"},{"ornek":"statüsü","kok":"statüs"},{"ornek":"seçilenler","kok":"seçile"},{"ornek":"uygulanır","kok":"uygula"}],"konuGiris":{"harita":"Ne zaman test edilir: işçi sendikası yönetimine seçilip işyerinden ayrılan kişinin statüsü sorulduğunda. Nasıl ölçülür: madde 4/2-a hükmünün doğru bentle eşleştirilmesiyle. Nasıl kaydedilir: kişi 4/a (hizmet akdiyle çalışan) sigortalısı sayılmaya devam eder.","desen":"Sınav genelde şıklarda \u0027sigortası kesilir\u0027, \u00274/b olur\u0027 gibi yanlış seçenekler koyar, doğrusu 4/a statüsünün devamıdır. Öğrenciler sendika görevini işten ayrılma sanıp sigortalılığın son bulduğunu düşünür, bu tuzaktır. Bu soru m.4/2-a fıkrasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Hizmet akdiyle bir veya birden fazla işveren tarafından çalıştırılan kişi","ad":"4/a sigortalısı","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"İşçi sendikası veya şubesinin başkanlık ya da yönetimine gelme durumu","ad":"sendika yönetim kuruluna seçilme","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Sendika yönetimine seçilenlerin 4/a hükümlerine tabi sayılmasını düzenleyen fıkra","ad":"4/2-a hükmü","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İşyerinden ayrılsa bile sigortalılık türünün değişmeden sürmesi","ad":"statü devamlılığı","kim":"kanun sabitler"}],"sinavda":"Soru, sendika yönetimine seçilen kişinin hangi sigortalılı
