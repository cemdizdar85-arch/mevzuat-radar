ölçü kaydını (\u0027hizmet için kullanıldığı ölçüde\u0027) ve sayılan üç kalemi (vergi-sigorta-tazminat) birlikte ara.","konu":"alt isverenlik","tablo":{"satirlar":[["A) İşveren yalnızca işçiye işin görülmesi için gerekli araç…","m.413, m.415/2","YANLIŞ ifade"],["B) İşveren yalnızca aracın işletilmesi ve bakımı için gerek…","m.415/1-2","YANLIŞ ifade"],["C) İşveren, araca ilişkin vergiyi, zorunlu mali sorumluluk …","m.415/2","doğru ifade"],["D) Bu yükümlülüğün doğması için işçi ile işveren arasındaki…","m.415/2","YANLIŞ ifade"],["E) Bu giderlerden, işçiyi fiilen çalıştıran alt işveren değ…","m.415/2","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İşveren, araca ilişkin vergiyi, zorunlu mali sorumluluk sigortası primini ve aracın yıpranması karşılığında uygun bir tazminatı, hizmet için kullanıldığı ölçüde işçiye ödemekle yükümlüdür.","E":"Bu giderlerden, işçiyi fiilen çalıştıran alt işveren değil, doğrudan asıl işveren sorumludur.","A":"İşveren yalnızca işçiye işin görülmesi için gerekli araç ve malzemeyi sağlamakla yükümlü olduğundan, işçinin kendi motorlu aracını kullanması hâlinde ayrıca bir ödeme yapma yükümlülüğü doğmaz.","D":"Bu yükümlülüğün doğması için işçi ile işveren arasındaki anlaşmanın yazılı şekilde yapılmış ve tarafların el yazısıyla imzalamış olması zorunludur.","B":"İşveren yalnızca aracın işletilmesi ve bakımı için gerekli olağan giderleri karşılamakla yükümlü olup, araca ilişkin vergi ve zorunlu mali sorumluluk sigortası primini ödemekle yükümlü değildir."},"kaynak":{"alinti":"","liste":[{"ad":"TBK (6098 s.K.) m.415","metin":"MADDE 415- İşçi, işin görülmesi için işverenle anlaşarak işverenin veya kendisinin sağladığı bir taşıma aracı kullanıyorsa, taşıtın işletilmesi ve bakımı için gerekli olağan giderler, hizmet için kullanıldığı ölçüde işverence karşılanır. İşçi işverenle anlaşarak, işin görülmesinde kendi motorlu aracını kullanıyorsa, işveren ayrıca bu araçla ilgili vergiyi, zorunlu mali sorumluluk sigortası primini ve aracın yıpranması karşılığında uygun bir tazminatı hizmet için kullanıldığı ölçüde işçiye ödemekle yükümlüdür. İşçi işverenle anlaşarak, hizmetin görülmesinde kendisine ait diğer taşıma araçlarını ve hayvanlarını kullanıyorsa işveren, bunların kullanma ve bakımı için gerekli olan olağan giderleri hizmet için kullanıldığı ölçüde karşılamakla yükümlüdür. 3. Giderlerin ödenmesi"},{"ad":"TTK (6102 s.K.) m.580 - GÜNCEL PARAMETRE ŞERHİ","metin":"GÜNCEL PARAMETRE ŞERHİ — TTK m.580: Madde metnindeki \u0027en az onbin Türk Lirası\u0027 tutarı GÜNCEL DEĞİLDİR. TTK m.580/2\u0027deki yetki (\u0027Bu maddede yazılı en az tutar, Cumhurbaşkanınca on katına kadar artırılabilir.\u0027) uyarınca, 7887 sayılı Cumhurbaşkanı Kararı (RG 25/11/2023, Sayı 32380; yürürlük maddesi RG 26/11/2023, Sayı 32381\u0027deki düzeltme ile) ile limited şirketler için en az esas sermaye tutarı 1/1/2024 tarihinden itibaren 50.000 TL\u0027ye artırılmıştır. Aynı Kararla anonim şirket en az esas sermayesi 250.000 TL\u0027ye, kayıtlı sermaye sistemini kabul etmiş halka açık olmayan anonim şirketlerde en az başlangıç sermayesi 500.000 TL\u0027ye yükseltilmiştir. Mevcut şirketler için uyum: TTK geçici m.15 (Ek: 23/5/2024-7511/17) uyarınca sermayesi bu tutarın altında kalan limited şirketler sermayelerini 31/12/2026 tarihine kadar yükseltmek zorundadır; aksi hâlde infisah etmiş sayılırlar."}],"hakem":"TBK m.415/2\u0027de işçinin kendi motorlu aracını işin görülmesinde kullandığı durumda işverenin vergi, zorunlu mali sorumluluk sigortası primi ve aracın yıpranması karşılığında tazminatı ödeme yükümlülüğü açıkça düzenlenmiştir."},"kayitlar":[],"sade":{"siklar":{"D":"Yazılı şekil veya el yazısı imza şartı aranmamaktadır. İşçinin işte kendi motorlu aracını kullanması yeterlidir.","E":"Yükümlülük işçiyle doğrudan sözleşme ilişkisinde olan alt işverene aittir. Asıl işveren değil, alt işveren sorumludur.","A":"Genel araç-malzeme sağlama kuralı motorlu araçlar için geçerli değildir. Motorlu araç özel düzenlemeye tabi olduğundan işveren ek ödeme yapmakla yükümlüdür.","B":"Vergi ve zorunlu sigortayı ödemek işverenin yükümlülüğünün sadece bir kısmıdır. Aynı zamanda aracın yıpranması için tazminat da ödemelidir."},"dogru":"İşçi kendi motorlu aracını işte kullanırsa, işveren sadece yakıt-bakım değil, araç vergisini, zorunlu sigortasını ve aracın yıpranmasını karşılamakla yükümlüdür. Bu üç kalem birlikte işverenin ödemesi gereken giderdir.","sinav":"Türk Borçlar Kanunu 415. madde ikinci paragraf uyarınca işçi kendi motorlu aracını işin görülmesinde kullanıyorsa işveren, araçla ilgili vergiyi, zorunlu mali sorumluluk sigortası primini ve aracın yıpranması karşılığında uygun bir tazminatı hizmet için kullanıldığı ölçüde işçiye ödemekle yükümlüdür.","kavramlar":[{"kaynak":"Türk Borçlar Kanunu 415. madde","tanim":"İşçinin kendi motorlu aracını işin görülmesinde kullandığında işverenin karşılaması gereken vergi, zorunlu mali sorumluluk sigortası primi ve aracın yıpranması tazminatıdır.","ad":"motorlu araç giderleri"},{"kaynak":"Türk Borçlar Kanunu 415. madde","tanim":"İşçi ile işveren arasında işin görülmesinde taşıma aracı kullanılması konusunda sağlanan mutabakattır ve yazılı şekil şartı aranmamaktadır.","ad":"işverle anlaşma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2019/3"]},"oyun":null,"tip":"teori","soru":"Bir inşaat işinde çalışan alt işveren işçisi, iş sözleşmesinde ayrıca kararlaştırılmamış olmakla birlikte alt işvereniyle anlaşarak kendi motorlu aracını işin görülmesinde kullanmaktadır. Türk Borçlar Kanunu hükümleri uyarınca bu duruma ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-12","verilenler":[],"dayanak":"Türk Borçlar Kanunu m.415/2 (motorlu araç kullanımında işverenin gider ödeme yükümlülüğü)","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir alt işveren, otoyol bakım işinde çalışan işçisi Hakan\u0027la sözleşmede yazmasa da anlaşıp, Hakan\u0027ın kendi 2019 model pikabını iş yerinde malzeme taşımak için kullanmasını kabul ediyor. Yıl sonunda araç için 3.200 TL vergi, 4.500 TL zorunlu sigorta primi çıkıyor, araç da hizmet nedeniyle epey yıpranmış.","anlatim":"İşveren bu giderleri karşılamalı mı, karşılamamalı mı, yoksa başka biri mi ödemeli? Bunu netleştireceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Borçlar Kanunu m.415/2\u0027ye göre işçi kendi motorlu aracını işin görülmesinde kullanırsa, işveren araç vergisini, zorunlu mali sorumluluk sigortası primini ve yıpranma tazminatını hizmet için kullanıldığı ölçüde öder.","anlatim":"Hakan\u0027ın pikabı üzerinden beş ifadeyi tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.413, m.415/2","karar":"yanlış","anlatim":"Hakan kendi pikabını getirdi diye işveren yükümlülükten kurtulmuyor, tam tersine m.415/2 devreye giriyor. Genel kural araç sağlamaktır ama işçi kendi aracını kullanınca özel hüküm doğar.","formul":"Şık A: biri sana \u0027işveren sadece araç sağlamakla yükümlüdür, işçi kendi aracını getirirse işveren hiç ödeme yapmaz\u0027 derse, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.415/1-2","karar":"yanlış","anlatim":"Hakan\u0027ın pikabı motorlu araç olduğu için m.415/2 devrede, orada vergi ve sigorta primi açıkça sayılıyor. Bu ayrım motorlu araç olup olmamasına göre yapılır.","formul":"Şık B: \u0027işveren yalnız olağan bakım giderini öder, vergi ve sigortayı ödemez\u0027 diyen birine katılır mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.415/2","karar":"doğru","anlatim":"Evet, tam olarak bu üç kalem birlikte istenir ve ödeme hizmet için kullanılan ölçüyle sınırlıdır. Bu, m.415/2\u0027nin doğrudan hükmü.","formul":"Şık C: işveren, Hakan\u0027ın pikabının vergisini, sigortasını ve yıpranma tazminatını hizmette kullanıldığı ölçüde ödemeli mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.415/2","karar":"yanlış","anlatim":"Hakan ile işveren sözlü anlaştı, sözleşmede bile yazmıyor ama yükümlülük yine doğuyor. Kanun burada hiç şekil şartı aramıyor.","formul":"Şık D: \u0027bu yükümlülük ancak yazılı ve el yazısıyla imzalanmış bir anlaşmayla doğar\u0027 diyen birine katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.415/2","karar":"yanlış","anlatim":"Hakan\u0027ın sözleşme tarafı alt işveren, gideri de o öder. Asıl işveren-alt işveren sorumluluğu bambaşka bir konu, burayla karıştırılmaz.","formul":"Şık E: \u0027bu giderlerden Hakan\u0027ı fiilen çalıştıran alt işveren değil, asıl işveren sorumludur\u0027 diyen birine katılır mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"İşçi kendi motorlu aracını kullanınca işveren vergi, sigorta ve yıpranma tazminatını hizmet ölçüsünde öder; kendine hep şunu sor: araç motorlu mu ve kimin sözleşme tarafıyım?","doldur":[]}],"anahtar":[{"ornek":"işveren","kok":"işvere"},{"ornek":"kullanması","kok":"kullan"},{"ornek":"motorlu","kok":"motorl"},{"ornek":"aracını","kok":"aracın"},{"ornek":"sigortası","kok":"sigort"},{"ornek":"yükümlüdür","kok":"yüküml"}],"konuGiris":{"harita":"Ne zaman uygulanır: işçi işverenle anlaşarak kendi motorlu aracını işin görülmesinde kullandığında. Neyi kapsar: vergi, zorunlu mali sorumluluk sigortası primi ve yıpranma tazminatı hizmet için kullanıldığı ölçüde ödenir. Nasıl kararlaştırılır: ayrıca sözleşmede yazılı olması şart değildir, fiilen anlaşma yeterlidir.","desen":"Soru, işçinin kendi aracını kullanmasının sözleşmede ayrıca belirtilmemiş olmasına rağmen işverenin ödeme yükümlülüğünün doğup doğmadığını sorgular; tuzak, \u0027ayrıca kararlaştırılmadıysa yükümlülük yoktur\u0027 yanılgısıdır. Türk Borçlar Kanunu m.415 açıkça fiilen anlaşmanın yeterli olduğunu belirtir, yazılı şart aramaz. Bu soru Türk Borçlar Kanunu m.415 hükmünün ikinci fıkrası noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"İşveren veya işçinin sağladığı taşıtın işletilmesi, bakımı için gereken normal masraf","ad":"Olağan gider","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"İşçinin kendi motorlu aracını kullanması karşılığında araç aşınması için ödenen uygun bedel","ad":"Yıpranma tazminatı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Motorlu aracın kanunen zorunlu sigortası için ödenen prim tutarı","ad":"Zorunlu mali sorumluluk sigortası primi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Giderlerin yalnızca işte fiilen kullanılan kısım oranında karşılanması esası","ad":"Hizmet için kullanılma ölçüsü","kim":"taraflar sözleşmeyle belirler"}],"sinavda":"Soru, işçinin kendi motorlu aracını işverenle anlaşarak kullandığı bir olayı verir ve işverenin hangi ödemelerle yükümlü olduğunun tespitini ister.","panel_ornek":"Arkadaşın kendi motosikletiyle bir kargo firmasına kurye olarak çalışıyor, patronuyla sözlü anlaşmışlar. Motorun vergisi, sigortası ve yıpranması için firma ona ayda 300 lira ödüyor. Yani araç işçinin olsa da masrafı işveren üstleniyor.","ornek":"Arkadaşın kendi motosikletiyle bir kargo firmasına kurye olarak çalışıyor, patronuyla sözlü anlaşmışlar. Motorun vergisi, sigortası ve yıpranması için firma ona ayda 300 lira ödüyor. Yani araç işçinin olsa da masrafı işveren üstleniyor.","yontemler":"Metni satır satır oku, \u0027vergi, sigorta primi, yıpranma tazminatı\u0027 üçlüsünü ezberle; \u0027ayrıca kararlaştırılmamış olması\u0027 ifadesinin yükümlülüğü ortadan kaldırmadığını unutma.","nedir":"Bu konu, işçinin işverenle anlaşarak kendi aracını işte kullanması durumunda giderlerin kim tarafından karşılanacağını düzenler. Sınav, işverenin hangi kalemleri ödemekle yükümlü olduğunu bilip bilmediğinizi ölçer."},"olay":"","tuzak":{"D":{"ad":"Şekil Şartı Uydurma Tuzağı","metin":"Öğrenci Türk Borçlar Kanunu m.14 ve m.15\u0027teki yazılı şekil ve el yazısı imza kuralını, giderlerin ödenmesi yükümlülüğüne şart olarak taşır. Doğrusu: m.415/2\u0027de bu yükümlülüğün doğması için yazılı şekil ya da imza şartı aranmaz, işin gorulmesinde araç kullanılması yeterlidir."},"E":{"ad":"Taraf Hatası Tuzağı","metin":"Öğrenci sorumluluğu, işçiyi fiilen çalıştıran işverenden alıp asıl işverene yükler. Doğrusu: Türk Borçlar Kanunu m.415/2\u0027deki yükümlülük, işçi ile hizmet sözleşmesinin taraflarindan biri olan (burada alt) işverene aittir."},"A":{"ad":"Genel Kural Tuzağı","metin":"Öğrenci Türk Borçlar Kanunu m.413\u0027teki genel araç-malzeme sağlama kuralını, motorlu taşıt kullanımına ilişkin özel düzenlemenin yerine koyar. Doğrusu: İşçi kendi motorlu aracını kullanırsa m.415/2\u0027deki özel hüküm uygulanır ve işveren ek ödeme yapmakla yükümlüdür."},"B":{"ad":"Kapsam Eksik Yükleme Tuzağı","metin":"Öğrenci m.415/1\u0027deki \u0027olağan taşıma aracı\u0027 kuralını motorlu araç için de geçerli sanıp vergi ve sigortayı dışarıda bırakır. Doğrusu: m.415/2 motorlu araç için ayrıca vergi, zorunlu mali sorumluluk sigortası ve yıpranma tazminatını da sayar."}},"celdiriciYol":null,"hap":"Alt işveren işçisinin kendi motorlu aracını işin görülmesinde kullanması hâlinde, Türk Borçlar Kanunu m.415/2 gereği işveren vergi, zorunlu mali sorumluluk sigortası primi ve yıpranma tazminatını hizmet için kullanıldığı ölçüde ödemekle yükümlüdür.","teshis":{"C":{"gercek":"TBK m.415/2 bu üç kalemi birlikte sayar ve ödemeyi hizmet için kullanıldığı ölçüyle sınırlar.","ayirt":"Madde üç kalemi mi sayıyor, ölçü kaydı var mı?","paragraf":"TBK m.415/2","yanilgi":"Bu şıkkı eleyen öğrenci, üç kalemin (vergi, sigorta, yıpranma tazminatı) birlikte ve sınırlı sayılmadığını, ayrıca ölçü sınırının aranmadığını düşünür."},"E":{"gercek":"Gider ödeme yükümlülüğü, işçi ile doğrudan hizmet sözleşmesinin tarafı olan (alt) işverene aittir; asıl işveren sorumluluğu ayrı bir müessesedir.","ayirt":"Bu yükümlülük hangi sözleşmenin tarafına aittir?","paragraf":"TBK m.415/2","yanilgi":"Alt işverenlik ilişkisinde her zaman asıl işverenin sorumlu olduğunu genelliyorsun."},"A":{"gercek":"TBK m.413 genel kuralı koyar, ancak işçi kendi motorlu aracını kullanırsa m.415/2 özel hükmü devreye girer ve işverene ayrı bir ödeme yükümlülüğü yükler.","ayirt":"Bu olayda araç işverenin mi işçinin mi, hangi maddeye giriyorum?","paragraf":"TBK m.413, m.415/2","yanilgi":"İş Kanunu\u0027nda düzenlenmeyen her konuda işverenin yalnız araç sağlama yükümlülüğü olduğunu, işçinin kendi aracını kullanmasının bu yükümlülüğü kaldırdığını sanıyorsun."},"D":{"gercek":"TBK m.14-15 yazılı şekil öngörülen sözleşmeler içindir; m.415/2\u0027deki gider ödeme yükümlülüğü ayrı yazılı şekle bağlanmamıştır.","ayirt":"Bu madde şekil şartı mı koyuyor yoksa sonuç kuralı mı?","paragraf":"TBK m.14, m.15, m.415/2","yanilgi":"Yazılı şekil ve imza kurallarının her borç ilişkisinde geçerlilik şartı olduğunu sanıyorsun."},"B":{"gercek":"TBK m.415/1 genel taşıma aracını, m.415/2 motorlu aracı ayrı düzenler; motorlu araçta vergi ve sigorta primi de işverene aittir.","ayirt":"Araç motorlu mu, o zaman fıkra 1 mi fıkra 2 mi uygulanır?","paragraf":"TBK m.415/1-2","yanilgi":"Motorlu araçla diğer taşıma araçlarını aynı kefeye koyup yalnız olağan bakım giderini yeterli sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 110"},"kural":"Kanuna göre asıl iş, işletmenin ve işin gereği ile teknolojik nedenlerle uzmanlık gerektiren işlerde bölünerek alt işverene verilebilir; bu ilişki yalnız yardımcı işlerle sınırlı değildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 110","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Yalnızca\u0027, \u0027hiçbir\u0027, \u0027her zaman\u0027 gibi mutlak ifadeler taşıyan şıklar kanundaki istisnaları göz ardı ediyor olabilir, önce istisna arayın.","konu":"alt isverenlik","tablo":{"satirlar":[["A) Asıl işveren, alt işverenin işçilerine karşı o işyeri il…","p.22(2. fıkra)","doğru ifade"],["B) Asıl işverenin işçilerinin alt işveren tarafından işe al…","p.22(2. fıkra)","doğru ifade"],["C) Asıl işveren-alt işveren ilişkisi yalnızca işyerinde yür…","p.22(2. fıkra)","YANLIŞ ifade"],["D) Daha önce o işyerinde çalıştırılan bir kimse ile alt işv…","p.22(2. fıkra)","doğru ifade"],["E) Asıl işveren-alt işveren ilişkisinin muvazaalı işleme da…","p.22(2. fıkra)","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Asıl işveren-alt işveren ilişkisi yalnızca işyerinde yürütülen mal veya hizmet üretimine ilişkin yardımcı işlerde kurulabilir; asıl işin hiçbir bölümü alt işverene devredilemez.","E":"Asıl işveren-alt işveren ilişkisinin muvazaalı işleme dayandığının tespiti halinde, alt işverenin işçileri başlangıçtan itibaren asıl işverenin işçisi sayılır.","A":"Asıl işveren, alt işverenin işçilerine karşı o işyeri ile ilgili olarak İş Kanunundan, iş sözleşmesinden veya alt işverenin taraf olduğu toplu iş sözleşmesinden doğan yükümlülüklerinden alt işveren ile birlikte sorumludur.","D":"Daha önce o işyerinde çalıştırılan bir kimse ile alt işveren ilişkisi kurulamaz; aksi halde bu ilişki muvazaalı işleme dayandığı kabul edilir.","B":"Asıl işverenin işçilerinin alt işveren tarafından işe alınarak çalıştırılmaya devam ettirilmesi suretiyle hakları kısıtlanamaz."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.2 [1/3]","metin":"Madde 2 - Bir iş sözleşmesine dayanarak çalışan gerçek kişiye işçi, işçi çalıştıran gerçek veya tüzel kişiye yahut tüzel kişiliği olmayan kurum ve kuruluşlara işveren, işçi ile işveren arasında kurulan ilişkiye iş ilişkisi denir. İşveren tarafından mal veya hizmet üretmek amacıyla maddî olan ve olmayan unsurlar ile işçinin birlikte örgütlendiği birime işyeri denir. İşverenin işyerinde ürettiği mal veya hizmet ile nitelik yönünden bağlılığı bulunan ve aynı yönetim altında örgütlenen yerler (işyerine bağlı yerler) ile dinlenme, çocuk emzirme, yemek, uyku, yıkanma, muayene ve bakım, beden ve meslekî eğitim ve avlu gibi diğer eklentiler ve araçlar da işyerinden sayılır. İşyeri, işyerine bağlı yerler, eklentiler ve araçlar ile oluşturulan iş organizasyonu kapsamında bir bütündür. (Ek fıkra: 23/7/2010-6009/48 md.; Mülga dördüncü fıkra: 20/6/2012-6331/37 md.) İşveren adına hareket eden ve işin, işyerinin ve işletmenin yönetiminde görev alan kimselere işveren vekili denir. İşveren vekilinin bu sıfatla işçilere karşı işlem ve yükümlülüklerinden doğrudan işveren sorumludur. Bu Kanunda işveren için öngörülen her çeşit sorumluluk ve zorunluluklar işveren vekilleri hakkında da uygulanır. İşveren vekilliği sıfatı, işçilere tanınan hak ve yükümlülükleri ortadan kaldırmaz. Bir işverenden, işyerinde yürüttüğü mal veya hizmet üretimine ilişkin yardımcı işlerinde veya asıl işin bir bölümünde işletmenin ve işin gereği ile teknolojik nedenlerle uzmanlık gerektiren işlerde iş alan ve bu iş için görevlendirdiği işçilerini sadece bu işyerinde aldığı işte çalıştıran diğer işveren ile iş aldığı işve…"},{"ad":"İş K. (4857 s.K.) m.2 [2/3]","metin":"Bu ilişkide asıl işveren, alt işverenin işçilerine karşı o işyeri ile ilgili olarak bu Kanundan, iş sözleşmesinden veya alt işverenin taraf olduğu toplu iş sözleşmesinden doğan yükümlülüklerinden alt işveren ile birlikte sorumludur. Asıl işverenin işçilerinin alt işveren tarafından işe alınarak çalıştırılmaya devam ettirilmesi suretiyle hakları kısıtlanamaz veya daha önce o işyerinde çalıştırılan kimse ile alt işveren ilişkisi kurulamaz. Aksi halde ve genel olarak asıl işveren alt işveren ilişkisinin muvazaalı işleme dayandığı kabul edilerek alt işverenin işçileri başlangıçtan itibaren asıl işverenin işçisi sayılarak işlem görürler. İşletmenin ve işin gereği ile teknolojik nedenlerle uzmanlık gerektiren işler dışında asıl iş bölünerek alt işverenlere verilemez. (Ek fıkra: 1/7/2006-5538/18 md.) Kanuna veya Cumhurbaşkanlığı kararnamesine dayanılarak kurulan kamu kurum ve kuruluşları ile bunların doğrudan veya dolaylı olarak sermayesinin en az yüzde ellisine sahip oldukları ortaklıklarda, 4734 sayılı Kamu İhale Kanunu veya diğer kanun hükümleri çerçevesinde, hizmet alımı amacıyla yapılan sözleşmeler gereğince, yüklenici aracılığıyla çalıştırılanlar, bu şekilde çalışmış olmalarına dayanarak;1 a) Bu kurum, kuruluş ve ortaklıklara ait kadro veya pozisyonlara atanmaya, b) Bu kurum, kuruluş ve ortaklıklara ait işyerlerinin kadro veya pozisyonlarında çalışanlar için toplu iş sözleşmesi, personel kanunları veya ilgili diğer mevzuat hükümlerine göre belirlenen her türlü malî haklar ile sosyal yardımlardan yararlanmaya, hak kazanamazlar."}],"hakem":"Doğru şık (C), İş Kanunu m.2\u0027nin açık hükmüne aykırıdır; kanuna göre asıl iş, uzmanlık gerektiren hallerde bölünerek alt işverene verilebilir, yalnızca yardımcı işlerle sınırlı değildir."},"kayitlar":[],"sade":{"siklar":{"D":"Daha önce işyerinde çalışan kişiyle alt işveren ilişkisi kurulması muvazaa karinesi doğurur; kanun bu durumu açıkça yasaklayarak muvazaa varsayımı getirmiş, ifade doğrudur.","E":"Muvazaalı ilişki tespit edildiğinde işçiler başlangıçtan itibaren asıl işverenin işçisi sayılarak işlem görür; bu geriye dönük etki kanunun emridir, ifade doğrudur.","A":"Asıl işveren\u0027in alt işveren işçilerine karşı birlikte sorumluluğu kanunun açık hükmüdür ve metinde bu yükümlülük doğru aktarılmıştır.","B":"Asıl işverenin işçilerinin alt işverene devredilmek suretiyle haklarının kısıtlanması kanunca yasaklanmıştır; ifade bu yasağı doğru anlatır."},"dogru":"Kanun asıl işin sadece yardımcı işlerle sınırlı olmadığını, işletmenin gereği ve uzmanlık gerektiren hallerde asıl işin bir bölümünün de alt işverene verilebileceğini düzenler. C şıkkı bu kuralın tersini söylediği için yanlıştır.","sinav":"İş Kanunu 2. madde","kavramlar":[{"kaynak":"İş Kanunu 2. madde","tanim":"Bir işverenden işyerinde yürüttüğü mal veya hizmet üretimine ilişkin yardımcı işlerinde veya işletmenin gereği ile uzmanlık gerektiren işlerde iş alan diğer işverenle kurduğu ilişki.","ad":"asıl işveren-alt işveren ilişkisi"},{"kaynak":"İş Kanunu 2. madde","tanim":"Asıl işveren-alt işveren ilişkisinin kanunun yasakladığı şekillerde kurulması halinde bu ilişki muvazaa sayılarak alt işverenin işçileri başlangıçtan itibaren asıl işverenin işçisi kabul edilir.","ad":"muvazaalı işlem"},{"kaynak":"İş Kanunu 2. madde","tanim":"Asıl işverenin, alt işverenin işçilerine karşı işyeri ile ilgili yükümlülüklerden alt işveren ile birlikte sorumlu olması.","ad":"birlikte sorumluluk"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2024/3","2019/3"]},"oyun":null,"tip":"teori","soru":"4857 sayılı İş Kanunu\u0027na göre asıl işveren-alt işveren ilişkisine dair aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-12","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.2, fıkra 6-7","dogru":"C","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Bursa\u0027da bir tekstil fabrikası, dokuma makinelerinin bakım-onarımını 15 işçilik bir alt işverene 01.03.2023 tarihinde devrediyor.","anlatim":"Fabrika sahibi \u0027ben sadece bakım işini verdim, üretimin kendisini vermedim\u0027 diyor. Bu ilişki İş Kanunu m.2\u0027deki asıl işveren-alt işveren tanımına tam uyuyor. Şimdi bu tek olayda beş farklı iddiayı test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Bu bakım-onarım olayında kanunun beş kuralını (sorumluluk, hak kısıtlama, işin bölünme sınırı, eski işçi yasağı, muvazaa sonucu) tek tek deneyeceğiz.","anlatim":"Kanun asıl işvereni alt işverenin işçilerine karşı sorumlu tutar, bazı işlemleri yasaklar ve asıl işin bölünmesine sınır koyar. Beş ifadeyi bu bakım-onarım olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.22(2. fıkra)","karar":"doğru","anlatim":"Evet, dersin; çünkü kanun asıl işvereni o işyeriyle ilgili doğan yükümlülüklerden alt işverenle birlikte sorumlu tutar. Bu ifade kanuna tam uygun, yani doğru bir ifade.","formul":"Şık A: Alt işverenin bakım işçilerinden biri fazla mesai alacağını isteyince, fabrika sahibi \u0027o benim işçim değil, alt işveren ödesin\u0027 diyor. Sen fabrika sahibine \u0027sen de birlikte sorumlusun\u0027 der misin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.22(2. fıkra)","karar":"doğru","anlatim":"Evet dersin; çünkü kanun, asıl işverenin işçisinin alt işverene devredilerek haklarının kısıtlanmasını açıkça yasaklar. Bu ifade doğrudur, kanunun lafzıyla birebir örtüşür.","formul":"Şık B: Fabrika, kendi eski dokuma işçilerinden birini işten çıkarıp aynı işi yapması için alt işverene devrediyor ve hakları düşüyor. Sen buna \u0027bu kanuna aykırı\u0027 der misin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.22(2. fıkra)","karar":"yanlış","anlatim":"Hayır dersin; çünkü kanun, işletmenin ve işin gereği ile teknolojik nedenlerle uzmanlık gerektiren hallerde asıl işin bir bölümünün de alt işverene verilebileceğini kabul eder. Yasak olan, bu şartlar dışında asıl işi bölmektir, yani bu ifade yanlıştır.","formul":"Şık C: Fabrika müdürü \u0027bakım-onarım dışında, üretim hattının bir bölümünü de uzmanlık gerektirdiği için alt işverene verebilirim\u0027 diyor. Sen ona \u0027hayır, asıl işin hiçbir kısmı devredilemez\u0027 der misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.22(2. fıkra)","karar":"doğru","anlatim":"Evet dersin; çünkü kanun, daha önce o işyerinde çalıştırılan kişiyle alt işveren ilişkisi kurulmasını yasaklar ve bunu muvazaa sayar. Bu ifade doğrudur.","formul":"Şık D: Fabrika, geçen yıl kendi bünyesinde çalışan bir bakım ustasıyla şimdi alt işveren sözleşmesi kuruyor. Sen buna \u0027bu ilişki muvazaalı sayılır\u0027 der misin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.22(2. fıkra)","karar":"doğru","anlatim":"Evet dersin; çünkü kanun muvazaa tespitinde işçilerin başlangıçtan itibaren asıl işverenin işçisi sayılacağını açıkça söyler. Bu ifade doğrudur.","formul":"Şık E: İş müfettişi bu bakım-onarım ilişkisini muvazaalı bulursa, sen \u002715 işçi başlangıçtan beri fabrikanın işçisi sayılır\u0027 der misin?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Tek yanlış olan C\u0027dir, çünkü asıl iş tamamen bölünmez değildir, uzmanlık gerektiren hallerde bölünebilir. Kendine sor: kanun \u0027hiçbir bölümü devredilemez\u0027 mi diyor, yoksa \u0027şu şartlarla bölünebilir\u0027 mi diyor?","doldur":[]}],"anahtar":[{"ornek":"işverenlik","kok":"işvere"},{"ornek":"dersin","kok":"dersin"},{"ornek":"ilişkisi","kok":"ilişki"},{"ornek":"gerektiren","kok":"gerekt"},{"ornek":"uzmanlık","kok":"uzmanl"},{"ornek":"verilebilir","kok":"verile"}],"konuGiris":{"harita":"Ne zaman test edilir: bir işveren, işinin bir bölümünü veya yardımcı işini başka bir işverene verdiğinde. Nasıl ölçülür: asıl işin uzmanlık/teknoloji gerektiren bölünebilir bir parçası olup olmadığına ve muvazaa şartlarının varlığına bakılarak. Nasıl kaydedilir: muvazaa tespit edilirse alt işveren işçileri başlangıçtan itibaren asıl işverenin işçisi sayılır.","desen":"Sorular genelde \u0027hangisi yanlıştır\u0027 formatında, asıl işin serbestçe bölünebileceği ya da sorumluluğun sadece alt işverende olduğu gibi yanlış öncülleri doğru gibi sunar. Tuzak, muvazaa halinde işçinin baştan itibaren asıl işveren işçisi sayılması detayının atlanmasıdır. Bu soru m.2 fıkra 6-7 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Yardımcı iş veya uzmanlık gerektiren asıl iş bölümünün başka işverene verilmesiyle kurulan ilişki","ad":"Asıl işveren-alt işveren ilişkisi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Asıl işverenin, alt işveren işçilerine karşı yükümlülüklerden birlikte sorumlu olması","ad":"Müteselsil sorumluluk","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Alt işverenlik ilişkisinin gerçek olmayıp işçi haklarını kısıtlamak için kurulması hali","ad":"Muvazaa","kim":"mahkeme ya da idare karar verir"},{"kaynak":"kuraldan bilinir","tanim":"Uzmanlık/teknoloji gereği olmayan asıl işin alt işverene verilememesi kuralı","ad":"Asıl işin bölünme yasağı","kim":"kanun sabitler"}],"sinavda":"Asıl işveren-alt işveren ilişkisine dair beş önerme verilir ve kanuna aykırı olan seçilir.","panel_ornek":"Bir kafe sahibi, temizlik işini dışarıdan 3 kişilik bir ekiple anlaşarak yaptırıyor; ama bu ekip aynı zamanda kafenin kendi eski çalışanlarıysa ve sadece işveren değiştirilmiş gibi görünüyorsa, hukuken bu gerçek bir taşeronluk sayılmaz. \u0027Ha, bu demek\u0027 - görünüşte iş bölüşümü var ama esasta aynı işveren devam ediyor.","ornek":"Bir kafe sahibi, temizlik işini dışarıdan 3 kişilik bir ekiple anlaşarak yaptırıyor; ama bu ekip aynı zamanda kafenin kendi eski çalışanlarıysa ve sadece işveren değiştirilmiş gibi görünüyorsa, hukuken bu gerçek bir taşeronluk sayılmaz. \u0027Ha, bu demek\u0027 - görünüşte iş bölüşümü var ama esasta aynı işveren devam ediyor.","yontemler":"Her önermeyi \u0027kanunun aynen söylediği mi\u0027 testinden geçir; sorumluluk, bölünme yasağı ve muvazaa sonucunu ezbere bil.","nedir":"Alt işverenlik, bir işverenin işinin bir bölümünü başka bir işverene devretmesiyle kurulan hukuki ilişkidir. Sınav burada asıl işverenin sorumluluğunun sınırlarını ve muvazaa şartlarını ölçer."},"olay":"","tuzak":{"D":{"ad":"D Tuzağı","metin":"Öğrenci bu kuralı sadece muvazaa sonucunu düzenleyen ayrı bir hüküm sanıp cümleyi hatalı bulabilir. Doğrusu: Daha önce işyerinde çalışan kişiyle alt işveren ilişkisi kurulması yasaktır ve bu durum muvazaa karinesi doğurur, ifade doğrudur."},"E":{"ad":"E Tuzağı","metin":"Öğrenci muvazaa tespitinin yalnızca ileriye etkili sonuç doğurduğunu sanabilir. Doğrusu: Kanun, muvazaalı ilişkide işçilerin başlangıçtan itibaren asıl işverenin işçisi sayılacağını düzenler, ifade doğrudur."},"A":{"ad":"A Tuzağı","metin":"Bu şık sanki eksik gibi görünse de kanun metnindeki birlikte sorumluluk kuralını doğru aktarır. Doğrusu: Asıl işveren, alt işveren işçilerine karşı o işyeriyle ilgili yükümlülüklerden alt işveren ile birlikte sorumludur, bu ifade doğrudur."},"B":{"ad":"B Tuzağı","metin":"Öğrenci bu cümlenin eksik bir istisna içerdiğini düşünüp yanlış işaretleyebilir. Doğrusu: Kanun, asıl işverenin işçilerinin alt işverene devredilerek haklarının kısıtlanmasını açıkça yasaklar, ifade doğrudur."}},"celdiriciYol":{},"hap":"Alt işverenlik ilişkisi yalnızca yardımcı işlerle sınırlı değildir; işletmenin ve işin gereği ile teknolojik nedenlerle uzmanlık gerektiren hallerde asıl işin bir bölümü de alt işverene verilebilir.","teshis":{"C":{"gercek":"Kanun, işletmenin ve işin gereği ile teknolojik nedenlerle uzmanlık gerektiren işlerde asıl işin bir bölümünün de alt işverene verilebileceğini düzenler; yasak olan bu şartlar dışında asıl işi bölmektir.","ayirt":"Kanun asıl işi hiç mi bölünmez diyor, yoksa belirli şartlarla bölünebilir mi diyor, hangisini okudun?","paragraf":"İş K. m.2/7","yanilgi":"Alt işverenliğin sadece yardımcı işlerle sınırlı olduğunu, asıl işin hiçbir şekilde bölünemeyeceğini sanıyorsun."},"E":{"gercek":"Kanun, muvazaalı ilişkide işçilerin başlangıçtan itibaren asıl işverenin işçisi sayılacağını açıkça öngörür.","ayirt":"Sonucun geçmişe mi yoksa ileriye mi etkili olduğunu metinde ara.","paragraf":"İş K. m.2/7","yanilgi":"Muvazaa tespitinin yalnızca tespit tarihinden sonra hüküm doğurduğunu sanıyorsun."},"A":{"gercek":"4857 sayılı İş Kanunu m.2/6, asıl işvereni alt işverenin işçilerine karşı doğan yükümlülüklerden alt işveren ile birlikte sorumlu tutar.","ayirt":"Bu cümlede \u0027birlikte sorumluluk\u0027 ifadesi var mı diye kendine sor.","paragraf":"İş K. m.2/6","yanilgi":"Asıl işverenin sorumluluğunun sadece alt işverene ait olduğunu, kendisinin sorumlu tutulamayacağını düşünüyorsun."},"D":{"gercek":"Aynı işyerinde daha önce çalıştırılan kişiyle alt işveren ilişkisi kurulması, ilişkinin muvazaalı sayılmasına yol açar.","ayirt":"Bu cümle bir yasak mı koyuyor, yasağın sonucu ne diye kendine sor.","paragraf":"İş K. m.2/7","yanilgi":"Bu kuralın sadece işe alım usulüyle ilgili olduğunu, muvazaa sonucu doğurmadığını sanıyorsun."},"B":{"gercek":"Kanun, asıl işverenin işçilerinin alt işverene devredilerek haklarının kısıtlanmasını açıkça yasaklamıştır.","ayirt":"Bu cümle işçi haklarının kısıtlanmasını mı yasaklıyor, yoksa serbest mi bırakıyor diye bak.","paragraf":"İş K. m.2/7","yanilgi":"Bu hükmün yalnızca yeni işe alınan işçileri kapsadığını, mevcut çalışanları korumadığını sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 109"},"kural":"İş Kanunu m.11\u0027e göre esaslı bir neden olmadıkça belirli süreli iş sözleşmesi birden fazla üst üste yapılamaz, aksi halde sözleşme başlangıçtan itibaren belirsiz süreli kabul edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 109","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Zincirleme sözleşme sorularında önce \u0027esaslı neden var mı?\u0027 sorusunu kendine sor, sonuç oradan çıkar.","konu":"belirli süreli is sözleşmesi","tablo":{"satirlar":[["VERİLENLER","-","-"],["Sözleşme sayısı","üç kez","-"],["Esaslı neden durumu","bulunmamaktadır","-"],["HESAP","-","-"],["A) Esaslı neden bulunmadığından iş sözleşmesi başlangıçtan …","m.11/3-4","doğru ifade"],["B) Zincirleme yapılan sözleşmeler esaslı nedene dayanmasa d…","m.11/4","YANLIŞ ifade"],["C) Sözleşme yalnızca son yenilendiği tarihten itibaren beli…","m.11/3","YANLIŞ ifade"],["D) İş ilişkisi süreye bağlı kurulduğundan sözleşme, yazılı …","m.11/2","YANLIŞ ifade"],["E) Objektif koşul bulunmadığından sözleşme kendiliğinden so…","m.11/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Sözleşme yalnızca son yenilendiği tarihten itibaren belirsiz süreli sayılır.","E":"Objektif koşul bulunmadığından sözleşme kendiliğinden sona erer, ayrıca fesih bildirimine gerek kalmaz.","A":"Esaslı neden bulunmadığından iş sözleşmesi başlangıçtan itibaren belirsiz süreli sayılır.","D":"İş ilişkisi süreye bağlı kurulduğundan sözleşme, yazılı şekil şartı aranmaksızın belirli süreli sayılır.","B":"Zincirleme yapılan sözleşmeler esaslı nedene dayanmasa da belirli süreli olma özelliğini korur."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.11","metin":"Madde 11 - İş ilişkisinin bir süreye bağlı olarak yapılmadığı halde sözleşme belirsiz süreli sayılır. Belirli süreli işlerde veya belli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak işveren ile işçi arasında yazılı şekilde yapılan iş sözleşmesi belirli süreli iş sözleşmesidir. Belirli süreli iş sözleşmesi, esaslı bir neden olmadıkça, birden fazla üst üste (zincirleme) yapılamaz. Aksi halde iş sözleşmesi başlangıçtan itibaren belirsiz süreli kabul edilir. Esaslı nedene dayalı zincirleme iş sözleşmeleri, belirli süreli olma özelliğini korurlar. Belirli ve belirsiz süreli iş sözleşmesi ayırımın sınırları"}],"hakem":"Soru, İş Kanunu m.11\u0027de açıkça yer alan esaslı neden olmaksızın zincirleme belirli süreli sözleşmelerin başlangıçtan itibaren belirsiz süreli sayılması kuralını doğru ölçmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Kanun belirsiz süreli sayılmanın ilk sözleşme tarihine kadar geriye etkili olacağını belirtir, son yenileme tarihinden değil.","E":"Soru sözleşmenin niteliğinin değişmesine ilişkindir, sona ermesi veya fesih bildirimine ilişkin değildir.","D":"Belirli süreli sözleşme yazılı şekilde yapılması şartı, süreli olma niteliğinden bağımsız ve zorunludur.","B":"Zincirleme sözleşmeler yalnızca esaslı nedene dayalı olursa belirli süreli özelliğini korur; burada esaslı neden yoktur."},"dogru":"Yayınevi çevirmeni art arda üç kez belirli süreli sözleşmeyle işe almışsa ama buna gerekçe sunmamışsa, bu sözleşmeler hukuki olarak baştan belirsiz süreli sayılır. Çünkü kanun, belirli süreli sözleşmeleri zincirleme yapmak için mutlaka esaslı bir nedene dayandırılmasını şart koşar.","sinav":"İş Kanunu 11. madde esaslı bir neden olmaksızın belirli süreli iş sözleşmesinin zincirleme yapılması halinde sözleşmenin başlangıçtan itibaren belirsiz süreli kabul edilmesini öngörmektedir.","kavramlar":[{"kaynak":"İş Kanunu 11. madde","tanim":"Belirli bir süre, belli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak işveren ile işçi arasında yazılı şekilde yapılan iş sözleşmesidir.","ad":"belirli süreli iş sözleşmesi"},{"kaynak":"İş Kanunu 11. madde","tanim":"Belirli süreli iş sözleşmesinin birden fazla üst üste yapılmasıdır; esaslı bir neden olmaksızın yapılırsa sözleşme başlangıçtan belirsiz süreli sayılır.","ad":"zincirleme iş sözleşmesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2017/1"]},"oyun":null,"tip":"teori","soru":"Bir yayınevi, çevirmen ile aynı iş için esaslı bir neden bulunmaksızın art arda üç kez yazılı belirli süreli iş sözleşmesi yapmıştır. 4857 sayılı İş Kanunu\u0027na göre bu sözleşmenin hukuki niteliği aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t1-issgk-kolay/kp-13","verilenler":[{"deger":"üç kez","anlam":"aynı iş için art arda kaç kez belirli süreli sözleşme yapıldığını gösterir, zincirleme koşulunu tetikler","ad":"Sözleşme sayısı"},{"deger":"bulunmamaktadır","anlam":"zincirleme sözleşmenin belirli süreli kalıp kalamayacağını belirleyen temel şart","ad":"Esaslı neden durumu"}],"dayanak":"İş Kanunu (4857 s.K.) m.11","dogru":"A","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: bir dershane, matematik öğretmeni Kaan ile 2021, 2022 ve 2023 yıllarında art arda üç kez, hiçbir objektif gerekçe göstermeden birer yıllık yazılı belirli süreli iş sözleşmesi imzalamıştır.","anlatim":"Kaan aynı işi yapıyor, iş kalıcı ama sözleşme hep bir yıllık yazılıp duruyor. Ortada belli bir işin bitmesi ya da mevsimlik bir durum yok, sadece tekrar tekrar aynı kâğıt imzalanıyor.","doldur":[]},{"formul":"Ne yapacağız: İş Kanunu m.11\u0027e göre esaslı neden yoksa zincirleme belirli süreli sözleşme başlangıçtan itibaren belirsiz süreli sayılır; Kaan\u0027ın üç sözleşmesini de bu kuralla test edip beş ifadeyi tek tek deneyeceğiz.","anlatim":"Kural tek: esaslı neden yoksa zincirleme yasak ve sonuç geriye, ilk güne kadar belirsiz süreli. Şimdi beş ifadeyi Kaan\u0027ın olayına uygulayalım.","doldur":[]},{"doldur":[[4,1],[4,2]],"sik":"A","paragraf":"m.11/3-4","karar":"doğru","anlatim":"Kaan\u0027ın üç sözleşmesinde de esaslı bir neden yok, sadece tekrar tekrar yazılı belirli süreli imzalanmış. Kanun bu durumda sözleşmeyi 2021\u0027deki ilk imzadan itibaren belirsiz süreli sayar.","formul":"Şık A: dershane müdürü \u0027Kaan\u0027ın sözleşmesi zaten en baştan beri belirsiz süreliymiş\u0027 diyor, buna katılır mısın?"},{"doldur":[[5,1],[5,2]],"sik":"B","paragraf":"m.11/4","karar":"yanlış","anlatim":"Kaan\u0027ın olayında tam tersi oluyor, esaslı neden yok ve bu yüzden belirli süreli özellik korunmuyor. Koruma sadece esaslı nedene dayalı zincirlemede geçerli.","formul":"Şık B: bir avukat \u0027esaslı neden olmasa da zincirleme yapıldıysa sözleşme yine belirli süreli kalır\u0027 diyor, doğru mu?"},{"doldur":[[6,1],[6,2]],"sik":"C","paragraf":"m.11/3","karar":"yanlış","anlatim":"Kanun geriye dönük çalışıyor, yani sonuç 2023\u0027ten değil 2021\u0027deki ilk sözleşmeden itibaren geçerli. Kaan başından beri belirsiz süreli işçi sayılır.","formul":"Şık C: biri \u0027Kaan\u0027ın sözleşmesi ancak 2023\u0027teki son yenilemeden itibaren belirsiz süreli olur\u0027 diyor, sen ne dersin?"},{"doldur":[[7,1],[7,2]],"sik":"D","paragraf":"m.11/2","karar":"yanlış","anlatim":"Kaan\u0027ın sözleşmeleri zaten yazılı yapılmış ama mesele bu değil, kanun yazılı şekli belirli süreli olmanın ayrı bir şartı olarak arıyor. Yazılı şekil olmadan süre kararlaştırılsa da belirli süreli sözleşmeden söz edilemez.","formul":"Şık D: müdür \u0027madem süreye bağlı yapılmış, yazılı olmasa da belirli süreli sayılır\u0027 diyor, katılır mısın?"},{"doldur":[[8,1],[8,2]],"sik":"E","paragraf":"m.11/3","karar":"yanlış","anlatim":"Madde sözleşmeyi bitirmiyor, sadece türünü belirsiz süreliye çeviriyor. Kaan\u0027ın işten çıkarılması gerekirse artık belirsiz süreli işçi gibi fesih ve ihbar kurallarına tabi olur.","formul":"Şık E: bir arkadaşı \u0027zaten objektif koşul yoktu, üçüncü yılın sonunda sözleşme kendiliğinden bitti, ayrı fesih gerekmez\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Kaan\u0027ın olayında esaslı neden yoksa zincirleme sözleşme baştan itibaren belirsiz süreli sayılır. Kendine hep şunu sor: bu yenilemenin arkasında gerçekten objektif, esaslı bir neden var mıydı?","doldur":[]}],"anahtar":[{"ornek":"süreli","kok":"süreli"},{"ornek":"sözleşmesi","kok":"sözleş"},{"ornek":"esaslı","kok":"esaslı"},{"ornek":"belirsiz","kok":"belirs"},{"ornek":"belirli","kok":"belirl"},{"ornek":"yazılıp","kok":"yazılı"}],"konuGiris":{"harita":"Ne zaman test edilir: esaslı neden olmaksızın art arda belirli süreli sözleşme yapıldığında test edilir. Nasıl ölçülür: zincirleme sözleşmenin başlangıç tarihinden itibaren niteliği değerlendirilir. Nasıl kaydedilir: sözleşme başlangıçtan itibaren belirsiz süreli kabul edilir.","desen":"Sınav genelde \u0027art arda üç/dört kez\u0027 ve \u0027esaslı neden yok\u0027 ifadesiyle tuzak kurar, öğrenci sözleşmenin belirli kalacağını düşünür. Doğru cevap her zaman başlangıçtan itibaren belirsiz süreli sayılmasıdır, sonradan değil. Bu soru m.11\u0027deki zincirleme sözleşme kuralı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"objektif bir süreye veya işin bitimine bağlı yazılı sözleşme","ad":"belirli süreli iş sözleşmesi","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"zincirleme sözleşmeyi haklı kılan objektif, işin niteliğinden kaynaklanan sebep","ad":"esaslı neden","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"aynı taraflar arasında art arda yapılan birden fazla belirli süreli sözleşme","ad":"zincirleme sözleşme","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"esaslı neden yoksa sözleşmenin başlangıçtan itibaren süresiz kabul edilmesi sonucu","ad":"belirsiz süreli sayılma","kim":"kanun sabitler"}],"sinavda":"Esaslı neden olmaksızın art arda yapılan belirli süreli sözleşmelerin hukuki niteliği sorulur, hesaplama istenmez.","panel_ornek":"Bir kafe, garsonunu esaslı bir sebep olmadan üst üste dört kez birer aylık sözleşmeyle çalıştırıyor. Aslında iş sürekli aynı iş, mevsimlik ya da geçici bir durum yok. Bu durumda hukuken artık ilk günden beri süresiz çalışıyormuş gibi sayılır.","ornek":"Bir kafe, garsonunu esaslı bir sebep olmadan üst üste dört kez birer aylık sözleşmeyle çalıştırıyor. Aslında iş sürekli aynı iş, mevsimlik ya da geçici bir durum yok. Bu durumda hukuken artık ilk günden beri süresiz çalışıyormuş gibi sayılır.","yontemler":"Esaslı neden var mı yok mu kontrol edilir; yoksa sözleşme baştan itibaren belirsiz süreli kabul edilir, sonradan dönüşüm değildir.","nedir":"Belirli süreli iş sözleşmesi, işin objektif olarak süreye ya da bir işin bitimine bağlı olduğu hallerde yazılı yapılan sözleşmedir. Sınav, esaslı neden yokken zincirleme yapılan sözleşmenin hukuki sonucunu bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Zamanlama Tuzağı","metin":"öğrenci belirsiz süreli sayılmanın son yenileme tarihinden itibaren işleyeceğini düşünür. Doğrusu: kanun \u0027başlangıçtan itibaren\u0027 der, yani ilk sözleşme tarihine kadar geriye etkilidir."},"E":{"ad":"Sonuç Türü Tuzağı","metin":"öğrenci hukuki nitelik değişimini sözleşmenin sona ermesiyle karıştırır. Doğrusu: kanun sözleşmenin sona ermesini değil, niteliğinin belirsiz süreliye dönüşmesini düzenler; fesih hükümleri ayrıca uygulanır."},"D":{"ad":"Şekil Şartı Tuzağı","metin":"öğrenci süreye bağlılığın yazılı şekil şartını ortadan kaldırdığını sanır. Doğrusu: belirli süreli iş sözleşmesi ancak yazılı şekilde yapılırsa bu nitelikte kabul edilir; şekil şartı süreye bağlılıktan bağımsızdır."},"B":{"ad":"Koruma Tuzağı","metin":"öğrenci \u0027zincirleme sözleşme = korunur\u0027 cümlesini koşulsuz sanır. Doğrusu: madde metninde bu koruma yalnız esaslı nedene dayalı zincirleme sözleşmeler için geçerlidir, olayda esaslı neden yoktur."}},"celdiriciYol":null,"hap":"Esaslı neden olmadan zincirleme yapılan belirli süreli iş sözleşmesi, başlangıcından itibaren belirsiz süreli sayılır.","teshis":{"C":{"gercek":"Kanun \u0027başlangıçtan itibaren belirsiz süreli kabul edilir\u0027 der, yani ilk sözleşme tarihine kadar geçerlidir.","ayirt":"Sonuç, ilk sözleşme tarihinden mi işliyor yoksa son yenilemeden mi?","paragraf":"İş K. m.11/3","yanilgi":"Belirsiz süreliliğin ileriye değil geriye etkili olduğunu unutuyorsun."},"E":{"gercek":"Madde, sözleşmeyi sona erdirmez, yalnız türünü belirsiz süreliye çevirir; sona erme ayrı fesih kurallarına tabidir.","ayirt":"Kanun burada sözleşmenin bitmesinden mi, türünün değişmesinden mi bahsediyor?","paragraf":"İş K. m.11/3","yanilgi":"Niteliğin değişmesini sözleşmenin otomatik sona ermesiyle karıştırıyorsun."},"A":{"gercek":"İş Kanunu m.11/3-4 esaslı neden yoksa zincirlemeyi yasaklar ve sözleşmeyi başlangıçtan itibaren belirsiz süreli sayar.","ayirt":"Her yenilemede objektif/esaslı bir neden gerçekten var mıydı?","paragraf":"İş K. m.11/3-4","yanilgi":"Bu şıkkı eleyen öğrenci, esaslı neden şartının sadece ilk sözleşme için değil her yenilemede aranması gerektiğini gözden kaçırır."},"D":{"gercek":"Belirli süreli iş sözleşmesi ancak yazılı yapılırsa bu sıfatı taşır; şekil şartı süreden bağımsız ayrı bir unsurdur.","ayirt":"Sözleşme yazılı mı yapılmış, yoksa sadece süre mi kararlaştırılmış?","paragraf":"İş K. m.11/2","yanilgi":"Süreye bağlılığın yazılı şekil şartını gereksiz kıldığını düşünüyorsun."},"B":{"gercek":"Koruma yalnızca esaslı nedene dayalı zincirleme için geçerlidir; esaslı neden yoksa sözleşme belirsiz süreli sayılır.","ayirt":"Zincirlemenin arkasında objektif/esaslı bir gerekçe var mı?","paragraf":"İş K. m.11/4","yanilgi":"Zincirleme sözleşmenin her zaman belirli süreli kalacağını sanıyorsun."}},"verilen":[[1,1],[2,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 109"},"kural":"Esaslı bir neden olmadıkça birden fazla üst üste (zincirleme) yapılan belirli süreli iş sözleşmesi, başlangıçtan itibaren belirsiz süreli kabul edilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 109","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Belirli süreli sözleşme sorularında önce şekil (yazılı), sonra objektif koşul, en son zincirleme-esaslı neden ayrımını sırayla kontrol et; tek eksik şart sözleşmeyi belirsiz süreliye çevirir.","konu":"belirli süreli is sözleşmesi","tablo":{"satirlar":[["A) Esaslı bir nedene dayanılarak zincirleme yapılan belirli…","m.11/3-4","YANLIŞ ifade"],["B) Belirli süreli iş sözleşmesi, işveren ile işçi arasında …","m.11/2","YANLIŞ ifade"],["C) İş ilişkisi bir süreye bağlı olarak yapılmamış olsa dahi…","m.11/1","YANLIŞ ifade"],["D) Belli bir işin tamamlanması gibi objektif bir koşul aran…","m.11/2","YANLIŞ ifade"],["E) Esaslı bir nedene dayanmaksızın zincirleme olarak yapıla…","m.11/3-4","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İş ilişkisi bir süreye bağlı olarak yapılmamış olsa dahi, taraflar sözleşmeyi belirli süreli olarak nitelendirdiklerinde sözleşme belirli süreli sayılır.","E":"Esaslı bir nedene dayanmaksızın zincirleme olarak yapılan belirli süreli iş sözleşmesi, başlangıcından itibaren belirsiz süreli iş sözleşmesi sayılır.","A":"Esaslı bir nedene dayanılarak zincirleme yapılan belirli süreli iş sözleşmeleri de, zincirleme yapıldıkları andan itibaren belirsiz süreli sayılır.","D":"Belli bir işin tamamlanması gibi objektif bir koşul aranmaksızın, sadece taraflarca bir süre kararlaştırılması belirli süreli iş sözleşmesi kurulması için yeterlidir.","B":"Belirli süreli iş sözleşmesi, işveren ile işçi arasında sözlü olarak da geçerli şekilde kurulabilir."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.11","metin":"Madde 11 - İş ilişkisinin bir süreye bağlı olarak yapılmadığı halde sözleşme belirsiz süreli sayılır. Belirli süreli işlerde veya belli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak işveren ile işçi arasında yazılı şekilde yapılan iş sözleşmesi belirli süreli iş sözleşmesidir. Belirli süreli iş sözleşmesi, esaslı bir neden olmadıkça, birden fazla üst üste (zincirleme) yapılamaz. Aksi halde iş sözleşmesi başlangıçtan itibaren belirsiz süreli kabul edilir. Esaslı nedene dayalı zincirleme iş sözleşmeleri, belirli süreli olma özelliğini korurlar. Belirli ve belirsiz süreli iş sözleşmesi ayırımın sınırları"}],"hakem":"Doğru sikk, İş K. m.11\u0027de yer alan esaslı neden olmaksızın zincirleme yapılan belirli süreli sözleşmelerin başlangıçtan itibaren belirsiz süreli kabul edilmesi kuralını kaynak metinden tam olarak desteklemektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Tarafların sözleşmeye verdikleri ad sayıda bağlayıcı olur zannedersin ama işveren ve işçi onu belirli süreli dese bile, gerçekte süreli değilse kanun belirsiz süreli sayar.","E":"Doğru cevap.","A":"Zincirlenmiş sözleşmelerin hepsi belirsiz süreli olacağını sanırsın ama sadece geçerli neden olmayan zincirlemeler belirsiz süreli hale gelir; geçerli nedenle yapılanlar belirli süreli kalır.","D":"Taraflar sadece bir süre kararlaştırsalar yeterli olur sanırsın ancak kanun belirli bir iş, bir işin bitişi ya da belirli bir olayın ortaya çıkması gibi nesnel bir koşul da gerektirir.","B":"Sözleşmenin yazılı şekil şartının önemsiz olduğunu düşünürsün oysa kanun belirli süreli iş sözleşmesinin işveren ve işçi arasında yazılı yapılmasını zorunlu kılar."},"dogru":"İşveren ile işçi sözleşmeyi birden fazla kez üst üste belirli süreli olarak yapıyorsa ve bunun için geçerli bir neden yoksa, sözleşme başından itibaren sonsuz süreli sayılır. Geçerli neden varsa belirli süreli olarak kalmaya devam eder.","sinav":"İş Kanunu 11. madde","kavramlar":[{"kaynak":"İş Kanunu 11. madde","tanim":"Belirli bir işte, belli bir işin tamamlanması veya belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak işveren ile işçi arasında yazılı şekilde yapılan sözleşmedir.","ad":"Belirli süreli iş sözleşmesi"},{"kaynak":"İş Kanunu 11. madde","tanim":"Belirli süreli iş sözleşmesinin bitiminden sonra yeniden belirli süreli olarak birden fazla üst üste yapılmasıdır.","ad":"Zincirleme iş sözleşmesi"},{"kaynak":"İş Kanunu 11. madde","tanim":"Zincirleme yapılan belirli süreli iş sözleşmesinin belirli süreli olarak kalmasını sağlayan ve kanunca kabul edilen geçerli sebeptir.","ad":"Esaslı neden"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2017/1"]},"oyun":null,"tip":"teori","soru":"4857 sayılı İş Kanunu\u0027na göre belirli süreli iş sözleşmesinin kuruluşu ve zincirleme yapılması ile ilgili aşağıdaki ifadelerden hangisi kesinlikle doğrudur?","kayitBaslik":"","id":"sgs-t1-issgk-cokzor/kp-13","verilenler":[],"dayanak":"4857 sayılı İş Kanunu m.11","dogru":"E","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Bir tekstil atölyesinde, Kenan Usta 2019\u0027dan beri her yıl 1\u0027er yıllık \u0027belirli süreli\u0027 sözleşmeyle çalıştırılıyor; ortada mevsimlik iş, proje ya da özel bir olgu yok, sadece patron her yıl kağıt yeniliyor.","anlatim":"","doldur":[]},{"formul":"Ne yapacağız: Madde 11\u0027e göre süre yoksa sözleşme belirsizdir, objektif koşul + yazılı şekil varsa belirlidir, esaslı neden olmadan zincirleme yapılırsa sözleşme baştan itibaren belirsiz sayılır. Kenan Usta\u0027nın olayında beş ifadeyi tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.11/3-4","karar":"yanlış","anlatim":"Hayır, esaslı neden varsa zincirleme sözleşme belirli süreli kalmaya devam eder. Madde 11\u0027in son fıkrası bunu açıkça korur. Kenan\u0027ın işi mevsimlikse patron haklı çıkar.","formul":"Şık A: Diyelim Kenan Usta\u0027nın işi gerçekten mevsimlik, yani esaslı bir neden var; buna rağmen \u0027zincirleme yapıldı diye otomatik belirsiz oldu\u0027 der misin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.11/2","karar":"yanlış","anlatim":"Hayır, madde 11 açıkça yazılı şekil şartı koyar. Sözlü anlaşma belirli süreli sözleşmeyi doğurmaz, en fazla belirsiz süreli fiili çalışma sayılır. Kenan\u0027ın kağıdı yoksa zaten baştan sorun var.","formul":"Şık B: Patron, \u0027yazıya gerek yok, sözlü anlaştık ya\u0027 diyor; Kenan\u0027ın sözleşmesi geçerli belirli süreli sayılır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.11/1","karar":"yanlış","anlatim":"Hayır, kanun süreye bağlı olmayan iş ilişkisini kendiliğinden belirsiz sayar. Tarafların kağıda ne yazdığı bu emredici hükmü değiştiremez. Kenan\u0027ın işinde objektif koşul yoksa isim boş kalır.","formul":"Şık C: Kenan\u0027la patron kağıda \u0027bu sözleşme belirli süreli sözleşmedir\u0027 yazmışlar ama işin süreye bağlı hiçbir yanı yok; bu yazı sözleşmeyi belirli süreli yapar mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.11/2","karar":"yanlış","anlatim":"Hayır, madde 11 süre yanında mutlaka objektif koşul da ister. Salt süre yazmak yetmez, patron bu şıkta da yanılıyor. Kenan\u0027ın işinde böyle bir koşul yoksa sözleşme belirsizdir.","formul":"Şık D: Patron sadece \u00271 yıl\u0027 yazmış, ne mevsimlik iş ne proje ne özel olgu var; sırf süre yazmak Kenan\u0027ın sözleşmesini belirli süreli yapar mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.11/3-4","karar":"doğru","anlatim":"Evet, esaslı nedene dayanmayan zincirleme sözleşme madde 11 gereği başlangıçtan itibaren belirsiz süreli kabul edilir. Kenan Usta ilk günden beri belirsiz süreli işçi sayılır. Bu, kesin ve tartışmasız doğru sonuçtur.","formul":"Şık E: Kenan Usta\u0027nın işinde hiçbir esaslı neden yokken patron her yıl zincirleme belirli süreli sözleşme yapmış; bu durumda Kenan\u0027ın sözleşmesi 2019\u0027daki ilk günden itibaren belirsiz süreli mi sayılır?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Zincirlemede esaslı neden yoksa sözleşme baştan itibaren belirsiz süreli sayılır, tek doğru budur. Kendine sor: bu zincirlemenin arkasında gerçek bir objektif neden var mı, yoksa sadece kağıt mı yenileniyor?","doldur":[]}],"anahtar":[{"ornek":"süreli","kok":"süreli"},{"ornek":"belirsiz","kok":"belirs"},{"ornek":"sözleşmesi","kok":"sözleş"},{"ornek":"zincirleme","kok":"zincir"},{"ornek":"esaslı","kok":"esaslı"},{"ornek":"belirli","kok":"belirl"}],"konuGiris":{"harita":"Ne zaman test edilir: sözleşmenin kuruluş anındaki objektif koşulun varlığı incelenir. Nasıl ölçülür: zincirleme yapılan sözleşmelerde esaslı neden bulunup bulunmadığına bakılır. Nasıl kaydedilir: esaslı neden yoksa sözleşme başlangıçtan itibaren belirsiz süreli kabul edilir.","desen":"Sınav genellikle \u0027kesinlikle doğru\u0027 ifadesiyle öğrenciyi yazılı şekil şartını ve esaslı neden koşulunu karıştırmaya iter. Tuzak, zincirleme sözleşmenin her durumda belirsiz süreliye dönüşeceğini düşündürmektir; oysa esaslı neden varsa belirli süreli kalır. Bu soru m.11\u0027in zincirleme sözleşme fıkrasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"belirli bir işin bitimi veya belirli bir olgunun ortaya çıkması gibi somut sebep","ad":"objektif koşul","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"zincirleme sözleşmeyi belirli süreli tutabilen haklı, sürekli tekrarlanan gerekçe","ad":"esaslı neden","kim":"mahkeme ya da idare karar verir"},{"kaynak":"soruda verilir","tanim":"aynı taraflar arasında birden fazla üst üste yapılan belirli süreli sözleşme","ad":"zincirleme sözleşme","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"esaslı neden yokluğunda sözleşmenin baştan itibaren süresiz kabul edilmesi sonucu","ad":"belirsiz süreli sayılma","kim":"kanun sabitler"}],"sinavda":"Soru, belirli süreli sözleşmenin kuruluş şartları ile zincirleme halindeki sonucunu birlikte doğru ifade eden seçeneği bulmayı ister.","panel_ornek":"Bir arkadaşın yaz sezonunda 3 aylığına dondurmacıda çalışmak üzere yazılı sözleşme imzaladığını düşün. Sezon bitince işveren onu her yıl aynı gerekçeyle tekrar tekrar 3\u0027er aylık sözleşmeyle çalıştırırsa, esaslı bir neden yoksa bu sözleşme baştan itibaren belirsiz süreli sayılır. Yani \u0027geçici\u0027 demek her zaman gerçekten geçici olduğu anlamına gelmez.","ornek":"Bir arkadaşın yaz sezonunda 3 aylığına dondurmacıda çalışmak üzere yazılı sözleşme imzaladığını düşün. Sezon bitince işveren onu her yıl aynı gerekçeyle tekrar tekrar 3\u0027er aylık sözleşmeyle çalıştırırsa, esaslı bir neden yoksa bu sözleşme baştan itibaren belirsiz süreli sayılır. Yani \u0027geçici\u0027 demek her zaman gerçekten geçici olduğu anlamına gelmez.","yontemler":"Cevap seçeneklerinde \u0027her zincirleme belirsiz süreli olur\u0027 gibi kesin ifadelere dikkat edilmeli, esaslı neden istisnası göz ardı edilmemelidir.","nedir":"Belirli süreli iş sözleşmesi, işin süresi veya belirli bir işin bitimi gibi objektif bir koşula bağlı yapılan yazılı sözleşmedir. Sınav bu sözleşmenin kuruluş şartlarını ve esaslı neden olmadan zincirlenemeyeceğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"İrade Serbestisi Tuzağı","metin":"Tarafların sözleşmeye verdikleri isim veya nitelendirmenin bağlayıcı olduğunu düşünürsün. Doğrusu: İş ilişkisi bir süreye bağlı olarak yapılmadığı hâlde sözleşme kanunen belirsiz süreli sayılır, taraf iradesi bunu değiştiremez."},"A":{"ad":"Zincirleme Genellemesi Tuzağı","metin":"Zincirleme yapılan her belirli süreli sözleşmenin belirsiz süreleşeceğini düşünürsün. Doğrusu: Esaslı nedene dayalı zincirleme sözleşmeler belirli süreli olma özelliğini korur, yalnız esaslı neden yoksa belirsiz süreli sayılır."},"D":{"ad":"Objektif Koşul Atlama Tuzağı","metin":"Süre kararlaştırmanın tek başına yeterli olduğunu, objektif koşul aranmadığını sanırsın. Doğrusu: Belirli süreli iş sözleşmesi ancak belirli işlerde veya belli bir işin tamamlanması ya da belirli bir olgunun ortaya çıkması gibi objektif koşullara bağlı olarak kurulabilir."},"B":{"ad":"Şekil Şartı Atlama Tuzağı","metin":"Sözleşmenin türünü belirleyenin yalnız süre unsuru olduğunu, şeklin önemsiz olduğunu sanırsın. Doğrusu: Kanun belirli süreli iş sözleşmesinin işveren ile işçi arasında yazılı şekilde yapılmasını arar."}},"celdiriciYol":{},"hap":"Esaslı nedene dayanmayan zincirleme belirli süreli iş sözleşmesi, başlangıcından itibaren belirsiz süreli sayılır; esaslı nedene dayalı zincirleme ise belirli süreli özelliğini korur.","teshis":{"C":{"gercek":"Kanun süreye bağlı olmayan iş ilişkisini doğrudan belirsiz süreli sayar; bu emredici hükmü taraf iradesi bertaraf edemez.","ayirt":"Kanunun kendisi mi yoksa tarafların adlandırması mı belirliyor diye kendine sor.","paragraf":"İş K. m.11/1","yanilgi":"Tarafların sözleşmeye verdiği ismin veya niyetin türü belirlediğini sanıyorsun."},"E":{"gercek":"Esaslı nedene DAYANMAYAN zincirleme belirli süreli sözleşmeler başlangıçtan itibaren belirsiz süreli sayılır; hüküm tam bu ayrımı kurar.","ayirt":"Zincirlemenin arkasında esaslı bir neden yok mu, o zaman sonuç ne olur diye kendine sor.","paragraf":"İş K. m.11/3-4","yanilgi":"Esaslı nedenin de zincirlemeyi engelleyeceğini, her hâlükârda sözleşmenin belirsiz süreli sayılacağını düşünerek bu şıkkı elersin."},"A":{"gercek":"Madde 11\u0027e göre esaslı nedene dayalı zincirleme sözleşmeler belirli süreli özelliğini korur; sonuç yalnız esaslı neden YOKSA doğar.","ayirt":"Zincirlemenin arkasında objektif/esaslı bir neden var mı diye kendine sor.","paragraf":"İş K. m.11/3-4","yanilgi":"Zincirlemenin kendisinin, sebebine bakılmaksızın sözleşmeyi belirsiz süreliye çevirdiğini sanıyorsun."},"D":{"gercek":"Belirli süreli sözleşme ancak belirli işlerde veya belli bir işin tamamlanması/olgunun ortaya çıkması gibi objektif koşula bağlı olarak kurulabilir.","ayirt":"Süreyi doğuran objektif bir iş/olgu var mı diye kendine sor.","paragraf":"İş K. m.11/2","yanilgi":"Süre belirtmenin tek başına belirli süreli sözleşme kurmaya yettiğini sanıyorsun."},"B":{"gercek":"Madde 11/2 açıkça yazılı şekli aramaktadır, şekle aykırılık sözleşmeyi belirli süreli saymaz.","ayirt":"Sözleşme yazılı mı diye kendine sor, sözlü anlatım yeterli değildir.","paragraf":"İş K. m.11/2","yanilgi":"Süre unsuru varsa şeklin önemsiz olduğunu, sözlü anlaşmanın yeterli olduğunu sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 107"},"kural":"İş Kanunu m.7/3 fıkrasına göre geçici işçi sağlama sözleşmesi, ikinci fıkranın (g) bendi HARİÇ toplam sekiz ayı geçmemek üzere en fazla iki defa yenilenebilir; g bendi bu sekiz aylık ve iki yenileme sınırlamasının dışında bırakılmıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 107","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Hariç\u0027 ibaresi geçen cümlelerde önce hangi bendin dışarıda bırakıldığını işaretle, sonra diğer şıkları o istisnaya göre eleyerek ilerle.","konu":"fazla çalışma","tablo":{"satirlar":[["VERİLENLER","-","-"],["İş Kanununda geçici iş ilişkisinin düzenlendiği madde","7","-"],["HESAP","-","-"],["A) Özel istihdam bürosu aracılığıyla mevsimlik tarım işleri…","İş K. m.7/3","doğru ifade"],["B) Ev hizmetlerinde kurulan geçici iş ilişkisinde de süre s…","İş K. m.7/3","doğru ifade"],["C) Holding bünyesi içinde işçisini geçici olarak devreden i…","İş K. m.7/5","doğru ifade"],["D) İşletmenin ortalama mal ve hizmet üretim kapasitesinin ö…","İş K. m.7/3","doğru ifade"],["E) Mevsimlik işler hariç dönemsellik arz eden iş artışı ned…","İş K. m.7/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Holding bünyesi içinde işçisini geçici olarak devreden işveren ile kurulan geçici iş ilişkisi, yazılı olarak altı ayı geçmemek üzere kurulur ve en fazla iki defa yenilenebilir.","E":"Mevsimlik işler hariç dönemsellik arz eden iş artışı nedeniyle kurulan geçici işçi sağlama sözleşmesi de diğer bentlerdeki gibi toplam sekiz ayı geçmemek üzere en fazla iki defa yenilenerek uygulanır.","A":"Özel istihdam bürosu aracılığıyla mevsimlik tarım işlerinde kurulan geçici iş ilişkisinde süre sınırı aranmaz.","D":"İşletmenin ortalama mal ve hizmet üretim kapasitesinin öngörülemeyen şekilde artması nedeniyle kurulan geçici işçi sağlama sözleşmesi en fazla dört ay süreyle kurulur ve toplam sekiz ayı geçmemek üzere en fazla iki defa yenilenebilir.","B":"Ev hizmetlerinde kurulan geçici iş ilişkisinde de süre sınırı aranmaksızın sözleşme yapılabilir."},"kaynak":{"alinti":"","liste":[{"ad":"İş K. (4857 s.K.) m.7 [1/5]","metin":"Madde 7 - (Değişik: 6/5/2016-6715/1 md.) Geçici iş ilişkisi, özel istihdam bürosu aracılığıyla ya da holding bünyesi içinde veya aynı şirketler topluluğuna bağlı başka bir işyerinde görevlendirme yapılmak suretiyle kurulabilir. Özel istihdam bürosu aracılığıyla geçici iş ilişkisi, Türkiye İş Kurumunca izin verilen özel istihdam bürosunun bir işverenle geçici işçi sağlama sözleşmesi yaparak bir işçisini geçici olarak bu işverene devri ile; a) Bu Kanunun 13 üncü maddesinin beşinci fıkrası ile 74 üncü maddesinde belirtilen hâllerde, işçinin askerlik hizmeti hâlinde ve iş sözleşmesinin askıda kaldığı diğer hâllerde, b) Mevsimlik tarım işlerinde, c) Ev hizmetlerinde, d) İşletmenin günlük işlerinden sayılmayan ve aralıklı olarak gördürülen işlerde, e) İş sağlığı ve güvenliği bakımından acil olan işlerde veya üretimi önemli ölçüde etkileyen zorlayıcı nedenlerin ortaya çıkması hâlinde, f) İşletmenin ortalama mal ve hizmet üretim kapasitesinin geçici iş ilişkisi kurulmasını gerektirecek ölçüde ve öngörülemeyen şekilde artması hâlinde, g) Mevsimlik işler hariç dönemsellik arz eden iş artışları hâlinde, kurulabilir. Geçici işçi sağlama sözleşmesi ikinci fıkranın (a) bendinde sayılan hâllerin devamı süresince, (b) ve (c) bentlerinde sayılan hâllerde süre sınırı olmaksızın, diğer bentlerde sayılan hâllerde ise en fazla dört ay süreyle kurulabilir. Yapılan bu sözleşme ikinci fıkranın (g) bendi hariç toplam sekiz ayı geçmemek üzere en fazla iki defa yenilenebilir. Geçici işçi çalıştıran işveren, belirtilen sürenin sonunda aynı iş için altı ay geçmedikçe yeniden geçici işçi çalıştıramaz."},{"ad":"İş K. (4857 s.K.) m.7 [2/5]","metin":"Bu Kanunun 29 uncu maddesi kapsamında toplu işçi çıkarılan işyerlerinde sekiz ay süresince, kamu kurum ve kuruluşlarında ve yer altında maden çıkarılan işyerlerinde bu maddenin ikinci fıkrası kapsamında geçici iş ilişkisi kurulamaz. Geçici işçi çalıştıran işveren, grev ve lokavtın uygulanması sırasında 18/10/2012 tarihli ve 6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanununun 65 inci maddesi hükümleri saklı kalmak kaydıyla geçici iş ilişkisiyle işçi çalıştıramaz. İkinci fıkranın (f) bendi kapsamında geçici iş ilişkisi ile çalıştırılan işçi sayısı, işyerinde çalıştırılan işçi sayısının dörtte birini geçemez. Ancak, on ve daha az işçi çalıştırılan işyerlerinde beş işçiye kadar geçici iş ilişkisi kurulabilir. İşçi sayısının tespitinde, kısmi süreli iş sözleşmesine göre çalışanlar, çalışma süreleri dikkate alınarak tam süreli çalışmaya dönüştürülür. Geçici işçi sağlama sözleşmesi ile çalışan işçi, 30 uncu maddenin uygulanmasında özel istihdam bürosu ve geçici işçi çalıştıran işverenin işçi sayısına dâhil edilmez. Geçici işçi çalıştıran işveren, iş sözleşmesi feshedilen işçisini fesih tarihinden itibaren altı ay geçmeden geçici iş ilişkisi kapsamında çalıştıramaz. Geçici işçi, geçici işçi çalıştıran işverenden özel istihdam bürosunun hizmet bedeline mahsup edilmek üzere avans veya borç alamaz. Geçici işçi çalıştıran işveren; a) İşin gereği ve geçici işçi sağlama sözleşmesine uygun olarak geçici işçisine talimat verme yetkisine sahiptir. b) İşyerindeki açık iş pozisyonlarını geçici işçisine bildirmek ve Türkiye İş Kurumu tarafından istenecek belgeleri belirlenen sürelerle sakl…"}],"hakem":"Soru, İş Kanunu m.7\u0027de geçici iş ilişkisinin kuruluş halleri ve süre sınırlarını doğru biçimde ölçmektedir; dogru sik (E), kaynakta açıkça belirtilen (g) bendinin sekiz ay ve iki yenileme sınırından istisna tutulduğunu yanlışlıkla bendin kapsamında bu sınırların uygulanır gibi göstererek hatalı bir ifade içermektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Holding içi devir yazılı olarak altı ayı geçmemek üzere kurulur ve en fazla iki defa yenilenebilir; ifade doğrudur.","E":"Dönemsellik arz eden iş artışında (g bendi) sekiz ay ve iki yenileme sınırı geçerli değildir; fakat şık bu sınırlamaların uygulandığını söylemekte olup yanlıştır.","A":"Mevsimlik tarım işlerinde (b bendi) süre sınırı olmaksızın sözleşme kurulabilir; ifade doğrudur.","D":"Öngörülemeyen kapasite artışında (f bendi) dört ay kurulur ve toplam sekiz ayı geçmemek üzere iki defa yenilenebilir; ifade doğrudur.","B":"Ev hizmetlerinde (c bendi) de süre sınırı aranmaksızın sözleşme yapılabilir; ifade doğrudur."},"dogru":"Dönemsellik arz eden iş artışında (g bendi) kurulan sözleşme, diğer bentlerin aksine sekiz ay ve iki yenileme sınırına tabi değildir. E şıkkı bu sınırlamaların aynı şekilde uygulandığını söylediği için yanlıştır.","sinav":"İş Kanunu 7. madde","kavramlar":[{"kaynak":"İş Kanunu 7. madde","tanim":"Özel istihdam bürosu aracılığıyla veya holding bünyesi içinde, belirli hallerde ve sürelerle kurulan, yazılı olarak düzenlenmiş iş ilişkisidir.","ad":"Geçici iş ilişkisi"},{"kaynak":"İş Kanunu 7. madde","tanim":"Özel istihdam bürosu ile işçi çalıştıran işveren arasında yazılı olarak yapılan ve işçisinin geçici olarak devrine ilişkin sözleşmedir.","ad":"Geçici işçi sağlama sözleşmesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/1","2015/1"]},"oyun":null,"tip":"teori","soru":"4857 sayılı İş Kanununun 7 nci maddesinde geçici iş ilişkisinin kuruluş hâlleri ve süre sınırları düzenlenmiştir. Buna göre aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t2-issgk-cokzor/kp-05","verilenler":[{"deger":"7","anlam":"İş Kanununda geçici iş ilişkisinin kuruluş şartları ve azami süre limitlerinin belirtildiği hukuki düzenlemenin bulunduğu madde numarası.","ad":"İş Kanununda geçici iş ilişkisinin düzenlendiği madde"}],"dayanak":"4857 sayılı İş Kanunu m.7/3 ve m.7/5","dogru":"E","oyunBonus":null,"ders":"İş ve Sosyal Güvenlik Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir tekstil fabrikası, 1 Mart\u0027ta sipariş patlaması yaşıyor. Fabrika özel istihdam bürosundan 10 işçi istiyor; sözleşmede \u0027mevsimlik olmayan dönemsel iş artışı\u0027 yazıyor.","anlatim":"Fabrika müdürü bu sözleşmeyi diğer geçici işçi sözleşmeleri gibi sekiz ay sınırına tabi sanıyor. Aslında bu bent kanunda ayrı bir yere konmuş. Bu farkı beş şıkta tek tek göreceğiz.","doldur":[]},{"formul":"Ne yapacağız: m.7/3\u0027e göre (a) hâlin devamınca, (b)-(c) süre sınırsız, diğerleri dört ay ve toplam sekiz ay iki yenileme; ama (g) bendi bu sekiz ay sınırından hariç.","anlatim":"Bu fabrikanın sözleşmesi (g) bendine giriyor, yani genel sekiz aylık kurala tabi değil. Şimdi beş ifadeyi bu olayın mantığıyla tek tek deneyeceğiz.","doldur":[]},{"doldur":[[3,1],[3,2]],"sik":"A","paragraf":"İş K. m.7/3","karar":"doğru","anlatim":"Evet, (b) bendi mevsimlik tarım işlerini süre sınırı olmadan bırakır. Bu doğru bir ifadedir.","formul":"Şık A: Fabrika mevsimlik tarım işinde işçi alsaydı, \u0027süre sınırı yok\u0027 der miydin?"},{"doldur":[[4,1],[4,2]],"sik":"B","paragraf":"İş K. m.7/3","karar":"doğru","anlatim":"Hayır, (c) bendi ev hizmetlerinde de süre sınırı aramaz. Bu ifade doğrudur.","formul":"Şık B: Fabrikanın sahibi evine de bir hizmetçi almak istese, süre sınırı arar mısın?"},{"doldur":[[5,1],[5,2]],"sik":"C","paragraf":"İş K. m.7/5","karar":"doğru","anlatim":"Evet, m.7/5 fıkrası holding içi devri ayrı düzenler: altı ay, en fazla iki yenileme. Bu ifade doğrudur.","formul":"Şık C: Fabrika holding bünyesinde bir işçisini başka şirkete devretse, altı ay ve iki yenileme der misin?"},{"doldur":[[6,1],[6,2]],"sik":"D","paragraf":"İş K. m.7/3","karar":"doğru","anlatim":"Evet, (f) bendi genel kurala tabidir, (g) gibi istisna değildir. Bu ifade doğrudur.","formul":"Şık D: Kapasite artışı nedeniyle kurulan (f) bendi sözleşmesi de dört ay, toplam sekiz ay iki yenileme mi der?"},{"doldur":[[7,1],[7,2]],"sik":"E","paragraf":"İş K. m.7/3","karar":"yanlış","anlatim":"Hayır, kanun açıkça \u0027(g) bendi hariç\u0027 diyor; bu bent sekiz aylık sınırın dışında bırakılmış. Bu ifade yanlıştır.","formul":"Şık E: Fabrikanın dönemsel iş artışı sözleşmesi de diğerleri gibi sekiz ay ve iki yenilemeye mi tabi dersin?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Bütün bentler sekiz ay sınırına girer, tek (g) bendi bu sınırın dışında kalır. Kendine hep şunu sor: bu olay tam olarak (g) bendine mi giriyor, girmiyorsa sekiz ay kuralı geçerli mi?","doldur":[]}],"anahtar":[{"ornek":"sınırına","kok":"sınırı"},{"ornek":"sözleşmesinde","kok":"sözleş"},{"ornek":"yenilenebilir","kok":"yenile"},{"ornek":"dışında","kok":"dışınd"},{"ornek":"doğrudur","kok":"doğrud"},{"ornek":"bırakılmıştır","kok":"bırakı"}],"konuGiris":{"harita":"Ne zaman test edilir: Geçici iş ilişkisinin hangi hâllerde kurulabileceği ve süre sınırları sorulduğunda test edilir. Nasıl ölçülür: Madde 7\u0027deki bentler ve süre/sayı sınırlarının doğru eşleştirilmesiyle ölçülür. Nasıl kaydedilir: Doğru/yanlış şık seçimiyle, hangi ifadenin kanuna aykırı olduğu tespit edilerek kaydedilir.","desen":"Sınav genellikle bentlere göre değişen süre sınırlarını (dört ay, sekiz ay, süresiz) karıştırarak yanlış şık üretir. Sıkça (f) bendindeki dörtte bir işçi oranı ile mevsimlik/ev hizmetlerindeki süresizlik hükmü karıştırılır. Bu soru m.7 fıkra 3-4 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Özel istihdam bürosu ile işveren arasında işçi devrini sağlayan yazılı sözleşme","ad":"Geçici işçi sağlama sözleşmesi","kim":"taraflar sözleşmeyle belirler"},{"kaynak":"kuraldan bilinir","tanim":"Belirli hâllerde geçici işçi sağlama sözleşmesinin en fazla kurulabileceği süre","ad":"Dört aylık süre sınırı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Yenilemelerle birlikte ulaşılabilecek en üst toplam çalışma süresi","ad":"Sekiz aylık toplam süre","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Süre sonunda aynı iş için yeniden geçici işçi çalıştırılamayacak bekleme dönemi","ad":"Altı ay bekleme süresi","kim":"kanun sabitler"}],"sinavda":"Madde 7\u0027deki hâller ve süre sınırlarına ilişkin ifadelerden hangisinin yanlış olduğu sorulur.","panel_ornek":"Bir arkadaşın kiralık dairede önce 6 aylık kısa dönem sözleşmesi yapıp, sonra bunu ancak 2 kez uzatabiliyor, üçüncü sefer için yeni bir sözleşme gerekiyor. Yani sözleşme sonsuza kadar uzatılamıyor, kanunda belirli tekrar sınırı var.","ornek":"Bir arkadaşın kiralık dairede önce 6 aylık kısa dönem sözleşmesi yapıp, sonra bunu ancak 2 kez uzatabiliyor, üçüncü sefer için yeni bir sözleşme gerekiyor. Yani sözleşme sonsuza kadar uzatılamıyor, kanunda belirli tekrar sınırı var.","yontemler":"Her bendin süre sınırını (süresiz, dört ay, sekiz ay) ayrı ayrı ezberlemek yerine, hangi hâllerin süresiz olduğunu (mevsimlik tarım, ev hizmetleri) ayırt etmek en kritik noktadır.","nedir":"Bu konu, geçici iş ilişkisinin hangi hâllerde ve ne kadar süreyle kurulabileceğini düzenler. Sınav, sürelerin ve sınırların doğru hatırlanıp hatırlanmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Sistem Karıştırma Tuzağı","metin":"Holding içi devrin de özel istihdam bürosu sistemindeki dört aylık genel sınıra tabi olduğunu sanırsın. Doğrusu: m.7/5 fıkrasına göre holding içi devirde süre altı ayı geçmemek üzere kurulur ve en fazla iki defa yenilenir, ifade doğrudur."},"A":{"ad":"Bent Karıştırma Tuzağı","metin":"Mevsimlik tarım işlerini askerlik/askıya alma hâlleriyle karıştırıp burada da dört aylık süre sınırı arandığını düşünürsün. Doğrusu: (b) ve (c) bentlerinde süre sınırı olmaksızın sözleşme kurulabilir, ifade doğrudur."},"D":{"ad":"İstisna Sanma Tuzağı","metin":"f bendinin de g bendi gibi sekiz aylık sınırdan muaf olduğunu sanırsın. Doğrusu: f bendi genel kurala tabidir, dört ay süreyle kurulur ve toplam sekiz ayı geçmemek üzere iki defa yenilenir, ifade doğrudur."},"B":{"ad":"Genel Kural Yanılgısı","metin":"Dört aylık genel süre sınırının tüm bentlerde geçerli olduğunu sanıp ev hizmetlerinde de süre arandığını düşünürsün. Doğrusu: (c) bendinde de süre sınırı yoktur, ifade doğrudur."}},"celdiriciYol":null,"hap":"Geçici işçi sağlama sözleşmesinde (g) bendi hariç tüm bentler toplam sekiz ayı geçmemek üzere en fazla iki defa yenilenebilir.","teshis":{"C":{"gercek":"m.7/5 fıkrası holding içi devri ayrı düzenler: altı ay süreyle kurulur, en fazla iki defa yenilenir.","ayirt":"Bu olay özel istihdam bürosu aracılığıyla mı, yoksa işverenin doğrudan devriyle mi kuruldu?","paragraf":"İş K. m.7/5","yanilgi":"Holding içi devrin de özel istihdam bürosu sistemindeki dört aylık genel sınıra tabi olduğunu sanırsın."},"E":{"gercek":"m.7/3 fıkrası açıkça \u0027(g) bendi hariç toplam sekiz ayı geçmemek üzere\u0027 der; g bendi bu sınırlamanın dışındadır.","ayirt":"Cümlede \u0027(g) bendi hariç\u0027 ibaresi geçiyor mu, ben bunu atladım mı?","paragraf":"İş K. m.7/3","yanilgi":"g bendinin de diğer bentler gibi sekiz ay ve iki yenileme sınırına tabi olduğunu sanıp bu ifadeyi doğru zannedersin."},"A":{"gercek":"m.7/3 fıkrasına göre (b) ve (c) bentlerinde süre sınırı olmaksızın sözleşme kurulabilir.","ayirt":"Bu bent süre sınırı olmayan iki bentten biri mi?","paragraf":"İş K. m.7/3","yanilgi":"Mevsimlik tarım işlerinde de dört aylık genel süre sınırının uygulandığını sanırsın."},"D":{"gercek":"f bendi genel kurala tabidir: dört ay süreyle kurulur, toplam sekiz ayı geçmemek üzere iki defa yenilenir.","ayirt":"Bu bent, sekiz ay sınırından hariç tutulan (g) bendi mi?","paragraf":"İş K. m.7/3","yanilgi":"f bendinin g bendi gibi sekiz ay sınırından istisna tutulduğunu sanırsın."},"B":{"gercek":"(c) bendi süre sınırı aranmayan bentlerdendir.","ayirt":"Bu iş türü (b) veya (c) bendinde mi sayılıyor?","paragraf":"İş K. m.7/3","yanilgi":"Ev hizmetlerinin de dört aylık genel sınıra tabi olduğunu düşünürsün."}},"verilen":[[1,1]],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 107"},"kural":"Ne soruluyor: Doğrusu: madde 7/3\u0027e göre ev hizmetleri c bendinde sayılmıştır ve bu bentte süre sınırı yoktur; dört aylık süre ile iki defa yenileme kuralı yalnız d, e, f, g bentlerine uygulanır, dolayısıyla C ifadesi kanuna aykırıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 107","sonDonem":2,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Madde 7\u0027deki bent gruplarını (a / b-c / d-e-f-g) ayrı ayrı ezberle; soru bir bendi başka bir gruba kaydırarak yanlış kurar.","konu":"fazla çalışma","tablo":null,"siklar":{"C":"Ev hizmetlerinde kurulan geçici işçi sağlama sözleşmesi en fazla dört ay süreyle kurulabilir ve en fazla iki defa yenilenebilir.","E":"Geçici işçi çalıştıran işveren, belirtilen sürenin sonunda aynı iş için altı ay geçmedikçe yeniden geçici işçi çalıştıramaz.","A":"İş sağlığı ve güvenliği bakımından acil olan işlerde kurulan geçici işçi sağlama sözleşmesi en fazla dört ay süreyle kurulabilir.","D":"Mevsimlik işler hariç dönemsellik arz eden iş artışları hâlinde kurulan sözleşme, sekiz ayı geçmemek üzere iki defa yenilenme kuralına tabi değildir.","B":"Mevsimlik tarım işlerinde kurulan geçici işçi sağlama sözleşmesi süre sınırı olmaksızın kurulabilir."},"kaynak":{"alinti":"nin geçici iş ilişkisinin süre ve yenileme sınırlarını soruyor; C seçeneği ev hizmetlerinde (c bendi) dört ay ve iki defa yenileme iddia ediyor, ancak kaynakta c bendinin","liste":[{"ad":"İş K. (4857 s.K.) m.7 [1/5]","metin":"Madde 7 - (Değişik: 6/5/2016-6715/1 md.) Geçici iş ilişkisi, özel istihdam bürosu aracılığıyla ya da holding bünyesi içinde veya aynı şirketler topluluğuna bağlı başka bir işyerinde görevlendirme yapılmak suretiyle kurulabilir. Özel istihdam bürosu aracılığıyla geçici iş ilişkisi, Türkiye İş Kurumunca izin verilen özel istihdam bürosunun bir işverenle geçici işçi sağlama sözleşmesi yaparak bir işçisini geçici olarak bu işverene devri ile; a) Bu Kanunun 13 üncü maddesinin beşinci fıkrası ile 74 üncü maddesinde belirtilen hâllerde, işçinin askerlik hizmeti hâlinde ve iş sözleşmesinin askıda kaldığı diğer hâllerde, b) Mevsimlik tarım işlerinde, c) Ev hizmetlerinde, d) İşletmenin günlük işlerinden sayılmayan ve aralıklı olarak gördürülen işlerde, e) İş sağlığı ve güvenliği bakımından acil olan işlerde veya üretimi önemli ölçüde etkileyen zorlayıcı nedenlerin ortaya çıkması hâlinde, f) İşletmenin ortalama mal ve hizmet üretim kapasitesinin geçici iş ilişkisi kurulmasını gerektirecek ölçüde ve öngörülemeyen şekilde artması hâlinde, g) Mevsimlik işler hariç dönemsellik arz eden iş artışları hâlinde, kurulabilir. Geçici işçi sağlama sözleşmesi ikinci fıkranın (a) bendinde sayılan hâllerin devamı süresince, (b) ve (c) bentlerinde sayılan hâllerde süre sınırı olmaksızın, diğer bentlerde sayılan hâllerde ise en fazla dört ay süreyle kurulabilir. Yapılan bu sözleşme ikinci fıkranın (g) bendi hariç toplam sekiz ayı geçmemek üzere en fazla iki defa yenilenebilir. Geçici işçi çalıştıran işveren, belirtilen sürenin sonunda aynı iş için altı ay geçmedikçe yeniden geçici işçi çalıştıramaz."},{"ad":"İş K. (4857 s.K.) m.7 [2/5]","metin":"Bu Kanunun 29 uncu maddesi kapsamında toplu işçi çıkarılan işyerlerinde sekiz ay süresince, kamu kurum ve kuruluşlarında ve yer altında maden çıkarılan işyerlerinde bu maddenin ikinci fıkrası kapsamında geçici iş ilişkisi kurulamaz. Geçici işçi çalıştıran işveren, grev ve lokavtın uygulanması sırasında 18/10/2012 tarihli ve 6356 sayılı Sendikalar ve Toplu İş Sözleşmesi Kanununun 65 inci maddesi hükümleri saklı kalmak kaydıyla geçici iş ilişkisiyle işçi çalıştıramaz. İkinci fıkranın (f) bendi kapsamında geçici iş ilişkisi ile
