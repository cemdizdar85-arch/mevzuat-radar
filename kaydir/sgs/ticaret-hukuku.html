<script>
const SORULAR=[{"capa":{"kaynak":"SGS 2025/2 Soru 123"},"kural":"Türk Ticaret Kanununun 395 inci maddesinin ikinci fıkrasına göre pay sahibi olmayan yönetim kurulu üyeleri şirketten hiçbir surette nakit borçlanamaz; yönetim kurulu kararı bu yasağı ortadan kaldırmaz.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 123","sonDonem":7,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Madde 375 ve madde 395 hükümlerini karıştıran şıklarda önce hangi maddeden bahsedildiğini ayır, sonra \u0027karar alınırsa olur mu\u0027 sorusunu sor.","konu":"anonim şirket yönetim kurulu yetkisi","tablo":{"satirlar":[["A) Şirketin üst düzeyde yönetimi ve bununla ilgili talimatl…","m.375/1-a","doğru ifade"],["B) Yönetim kurulu üyesi, genel kuruldan izin almadan şirket…","m.395/1","doğru ifade"],["C) Pay sahibi olmayan yönetim kurulu üyesi, yönetim kurulu …","m.395/2","YANLIŞ ifade"],["D) Muhasebenin, finans denetiminin ve gerekli finansal plan…","m.375/1-c","doğru ifade"],["E) Şirketin borca batık hâle gelmesi durumunda mahkemeye bi…","m.375/1-g","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Pay sahibi olmayan yönetim kurulu üyesi, yönetim kurulu kararıyla şirketten nakit borçlanabilir.","E":"Şirketin borca batık hâle gelmesi durumunda mahkemeye bildirimde bulunulması yönetim kurulunun devredilemez görevidir.","A":"Şirketin üst düzeyde yönetimi ve bununla ilgili talimatların verilmesi yönetim kurulunun devredilemez ve vazgeçilemez görevidir.","D":"Muhasebenin, finans denetiminin ve gerekli finansal planlama düzeninin kurulması yönetim kurulunun devredilemez görevidir.","B":"Yönetim kurulu üyesi, genel kuruldan izin almadan şirketle kendisi adına bir işlem yaparsa şirket bu işlemin batıl olduğunu ileri sürebilir."},"kaynak":{"alinti":"Pay sahibi olmayan yönetim kurulu üyeleri şirkete nakit borçlanamaz","liste":[{"ad":"TTK (6102 s.K.) m.375","metin":"MADDE 375- (1) Yönetim kurulunun devredilemez ve vazgeçilemez görev ve yetkileri şunlardır: a) Şirketin üst düzeyde yönetimi ve bunlarla ilgili talimatların verilmesi. b) Şirket yönetim teşkilatının belirlenmesi. c) Muhasebe, finans denetimi ve şirketin yönetiminin gerektirdiği ölçüde, finansal planlama için gerekli düzenin kurulması. d) (Değişik:23/5/2024-7511/14 md.) Şube müdürleri hariç olmak üzere müdürlerin ve aynı işleve sahip kişilerin atanmaları ve görevden alınmaları. e) Yönetimle görevli kişilerin, özellikle kanunlara, esas sözleşmeye, iç yönergelere ve yönetim kurulunun yazılı talimatlarına uygun hareket edip etmediklerinin üst gözetimi. f) Pay, yönetim kurulu karar ve genel kurul toplantı ve müzakere defterlerinin tutulması, yıllık faaliyet raporunun ve kurumsal yönetim açıklamasının düzenlenmesi ve genel kurula sunulması, genel kurul toplantılarının hazırlanması ve genel kurul kararlarının yürütülmesi. g) Borca batıklık durumunun varlığında mahkemeye bildirimde bulunulması. 3. Sermayenin kaybı, borca batık olma durumu a) Çağrı ve bildirim yükümü"},{"ad":"TTK (6102 s.K.) m.395","metin":"MADDE 395- (1) Yönetim kurulu üyesi, genel kuruldan izin almadan, şirketle kendisi veya başkası adına herhangi bir işlem yapamaz; aksi hâlde, şirket yapılan işlemin batıl olduğunu ileri sürebilir. Diğer taraf böyle bir iddiada bulunamaz. (2) (Değişik: 26/6/2012-6335/17 md.) Pay sahibi olmayan yönetim kurulu üyeleri ile yönetim kurulu üyelerinin pay sahibi olmayan 393 üncü maddede sayılan yakınları şirkete nakit borçlanamaz. Bu kişiler için şirket kefalet, garanti ve teminat veremez, sorumluluk yüklenemez, bunların borçlarını devralamaz. Aksi hâlde, şirkete borçlanılan tutar için şirket alacaklıları bu kişileri, şirketin yükümlendirildiği tutarda şirket borçları için doğrudan takip edebilir. (3) 202 nci madde hükmü saklı kalmak şartıyla, şirketler topluluğuna dâhil şirketler birbirlerine kefil olabilir ve garanti verebilirler. (4) Bankacılık Kanununun özel hükümleri saklıdır. VII - Rekabet yasağı"}],"hakem":"TTK m.395/2 açıkça \u0027Pay sahibi olmayan yönetim kurulu üyeleri şirkete nakit borçlanamaz\u0027 hükmü içerir ve \u0027Aksi hâlde\u0027 cezai sonuç öngörür; yönetim kurulu kararı bu yasağı kaldıramaz."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/2","2017/1"]},"oyun":null,"tip":"teori","soru":"6102 sayılı Türk Ticaret Kanunu\u0027na göre anonim şirket yönetim kurulu ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-ticaret-p30/kp-01","verilenler":[],"dayanak":"Türk Ticaret Kanunu m.375, m.395","dogru":"C","oyunBonus":null,"ders":"Ticaret Hukuku","adimlar":[{"formul":"Olay: Kartal Metal A.Ş.\u0027de yönetim kurulu üyesi Hakan Bey, pay sahibi değil; 15 Mart 2023\u0027te yönetim kurulu toplantısında kararla şirketten 80.000 TL nakit çekiyor.","anlatim":"Şirketin muhasebe müdürü bu işlemi kayıtlara geçiriyor, kimse itiraz etmiyor. Bu tek olayda beş ifadeyi tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Ticaret Kanunu m.375 devredilemez görevleri, m.395 ise izinsiz işlem ve nakit borçlanma yasağını düzenliyor; Kartal Metal olayında Hakan Bey\u0027in 80.000 TL\u0027lik borçlanması ve yönetim kurulunun diğer görevleri bu maddelere göre test edilecek.","anlatim":"Kural: kanunun sayılan bentleri kapalı liste, yasaklar ise organ kararıyla dahi kalkmıyor. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.375/1-a","karar":"doğru","anlatim":"Hayır, devredemez; bu görev kanunda açıkça sayılmış. Türk Ticaret Kanunu bu yetkiyi yönetim kurulunun elinden alınamayacak bir görev sayıyor.","formul":"Şık A: Kartal Metal\u0027in genel müdürü \u0027üst düzey yönetim ve talimat verme işini bir komiteye devredelim\u0027 diyor, yönetim kurulu bunu devredebilir mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.395/1","karar":"doğru","anlatim":"Evet, sürebilir; kanun bu hakkı sadece şirkete tanıyor, karşı taraf bu iddiayı öne süremez. Kartal Metal burada haklı çıkar.","formul":"Şık B: Hakan Bey genel kuruldan izin almadan şirketle kendi adına bir alım-satım sözleşmesi yapsa, şirket bu işlemin batıl olduğunu ileri sürebilir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.395/2","karar":"yanlış","anlatim":"Hayır, olmaz; pay sahibi olmayan üye hiçbir şekilde nakit borçlanamaz. Yönetim kurulu kararı bu yasağı kaldırmıyor, Kartal Metal\u0027deki 80.000 TL işlem kanuna aykırı.","formul":"Şık C: Yönetim kurulu karar alıp Hakan Bey\u0027in 80.000 TL nakit çekmesini onaylıyor, bu borçlanma geçerli olur mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.375/1-c","karar":"doğru","anlatim":"Hayır, yapamaz; bu düzenin kurulması yönetim kurulunun devredilemez görevi. Kartal Metal\u0027de bu görev yine kurulda kalır.","formul":"Şık D: Muhasebe müdürü \u0027finansal planlama düzenini dışarıdan bir danışmana devredelim\u0027 diyor, yönetim kurulu bunu yapabilir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.375/1-g","karar":"doğru","anlatim":"Evet, zorunlu; bu bildirim de devredilemez görevler arasında sayılıyor. Başka bir organ bu görevi üstlenemez.","formul":"Şık E: Kartal Metal borca batık hâle gelse, mahkemeye bildirimi yönetim kurulu yapmak zorunda mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Kartal Metal olayında yanlış olan tek şey Hakan Bey\u0027in nakit borçlanmasının kararla geçerli sayılması. Kendine hep şunu sor: bu yasağı kaldıran bir organ kararı kanunda tanınmış mı?","doldur":[]}],"anahtar":[{"ornek":"kurulunun","kok":"kurulu"},{"ornek":"yönetim","kok":"yöneti"},{"ornek":"kararı","kok":"kararı"},{"ornek":"yasağı","kok":"yasağı"},{"ornek":"borçlanma","kok":"borçla"},{"ornek":"devredilemez","kok":"devred"}],"konuGiris":{"harita":"Ne zaman test edilir: yönetim kurulunun hangi yetkiyi devredebileceği, hangisini devredemeyeceği sorulduğunda test edilir. Nasıl ölçülür: madde metnindeki \u0027devredilemez\u0027 listesi ile \u0027genel kuruldan izin\u0027 şartının karıştırılıp karıştırılmadığına bakılarak ölçülür. Nasıl kaydedilir: doğru cevap, kanun maddesindeki ifadenin birebir veya anlamca aynısı olarak seçilir.","desen":"Sorular genellikle m.375\u0027teki devredilemez yetkiler listesine ekleme yaparak yanlış bir madde uydurur, örneğin denetçi atamayı yönetim kuruluna verir. Bir diğer tuzak, m.395\u0027teki borçlanma yasağının kapsamını genişletip pay sahibi üyelere de uygulamaktır. Bu soru p.375 ve p.395 maddelerinin karıştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Yönetim kurulunun başkasına bırakamayacağı üst düzey yönetim görevleri","ad":"Devredilemez yetki","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Pay sahibi olmayan üyenin şirketten nakit borç alamaması kuralı","ad":"Nakit borçlanma yasağı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Üyenin şirketle kendi adına işlem yapabilmesi için gereken onay şartı","ad":"Genel kuruldan izin","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İzinsiz yapılan işlemin şirket tarafından geçersiz sayılabilmesi hali","ad":"Batıl işlem","kim":"kanun sabitler"}],"sinavda":"Soruda yönetim kuruluyla ilgili birkaç ifade sıralanır ve kanuna göre yanlış olan ifade seçilmesi istenir.","panel_ornek":"10 daireli bir apartmanda yönetici, 3 bin liralık ortak gider kararını tek başına alıp diğer yöneticilere danışmadan uygulayamaz; bu karar kurulun ortak yetkisindedir. Yönetici ayrıca kendi dairesinin tadilatını apartman parasından karşılayamaz, önce kurulun onayını almalıdır.","ornek":"10 daireli bir apartmanda yönetici, 3 bin liralık ortak gider kararını tek başına alıp diğer yöneticilere danışmadan uygulayamaz; bu karar kurulun ortak yetkisindedir. Yönetici ayrıca kendi dairesinin tadilatını apartman parasından karşılayamaz, önce kurulun onayını almalıdır.","yontemler":"Her ifadeyi tek tek m.375 ve m.395 metniyle karşılaştırıp maddeden sapan tek cümleyi bulmak en güvenli yöntemdir; \u0027devredilemez\u0027 ile \u0027izin şartı\u0027 kavramlarını birbirine karıştırmamak kritik kuraldır.","nedir":"Bu konu, anonim şirket yönetim kurulunun hangi yetkileri devredemeyeceğini ve üyelerin şirketle işlem yaparken uyması gereken sınırları öğretir. Sınav, bu devredilemez yetkilerin ve yasakların kanun maddesine göre doğru-yanlış ayrımını yapabilme becerisini ölçer."},"olay":"","tuzak":{"D":{"ad":"Görev Sınırı Tuzağı","metin":"Muhasebe ve finansal planlama düzeninin kurulmasının alt kademeye devredilebilir teknik bir iş olduğunu sanıp yanlış seçtin. Doğrusu: Türk Ticaret Kanununun 375 inci maddesinin birinci fıkrasının (c) bendi bu görevi devredilemez ve vazgeçilemez sayar, ifade doğrudur."},"E":{"ad":"Bildirim Yükümü Tuzağı","metin":"Borca batıklık bildiriminin yalnızca denetçinin veya genel kurulun görevi olduğunu sanıp bu ifadeyi yanlış zannettin. Doğrusu: Türk Ticaret Kanununun 375 inci maddesinin birinci fıkrasının (g) bendi bildirimi yönetim kurulunun devredilemez görevleri arasında sayar, ifade doğrudur."},"A":{"ad":"Kapsam Yanılgısı","metin":"Üst düzey yönetim ve talimat verme yetkisinin sıradan bir yönetim işi olduğunu sanıp bu ifadeyi yanlış seçtin. Doğrusu: bu görev Türk Ticaret Kanununun 375 inci maddesinin birinci fıkrasının (a) bendine göre devredilemez ve vazgeçilemez bir görevdir, ifade doğrudur."},"B":{"ad":"Hüküm Karıştırma Tuzağı","metin":"Kendisiyle işlem yapma yasağının sonucunun kesin hükümsüzlük olduğunu sanıp cümleyi hatalı zannettin. Doğrusu: Türk Ticaret Kanununun 395 inci maddesinin birinci fıkrası aynen bu şekilde düzenlenmiştir, ifade doğrudur."}},"celdiriciYol":{},"hap":"Yönetim kurulunun devredilemez görevleri Türk Ticaret Kanununun 375 inci maddesinde, pay sahibi olmayan üyelerin şirketten borçlanma yasağı ise 395 inci maddesinde kapalı liste olarak düzenlenmiştir; yönetim kurulu kararı bu yasakları kaldırmaz.","teshis":{"C":{"gercek":"Türk Ticaret Kanununun 395 inci maddesinin ikinci fıkrası, pay sahibi olmayan yönetim kurulu üyelerinin şirketten nakit borçlanmasını kararla dahi mümkün kılmayan mutlak bir yasak olarak düzenler.","ayirt":"Bu yasağı kaldıran herhangi bir organ kararı kanunda tanınmış mı?","paragraf":"m.395/2","yanilgi":"Yönetim kurulu kararı alınırsa nakit borçlanma yasağının kalkacağını sanıyorsun."},"E":{"gercek":"Türk Ticaret Kanununun 375 inci maddesinin birinci fıkrasının (g) bendi mahkemeye bildirimi yönetim kurulunun devredilemez görevi olarak düzenler.","ayirt":"Bildirim yükümü kanunda hangi organa yüklenmiş?","paragraf":"m.375/1-g","yanilgi":"Borca batıklık bildirimini denetçinin ya da genel kurulun sorumluluğu sanıyorsun."},"A":{"gercek":"Türk Ticaret Kanununun 375 inci maddesi üst düzey yönetimi ve talimat vermeyi açıkça yönetim kurulunun devredilemez ve vazgeçilemez görevi sayar.","ayirt":"Bu yetki kanunda sayılan altı-yedi maddelik kapalı listede mi yer alıyor?","paragraf":"m.375/1-a","yanilgi":"Üst düzey yönetimi genel bir idari faaliyet sanıp devredilemez görevler listesinde olmadığını düşünüyorsun."},"D":{"gercek":"Türk Ticaret Kanununun 375 inci maddesinin birinci fıkrasının (c) bendi bu düzenin kurulmasını devredilemez görevler arasında sayar.","ayirt":"Bu görev 375 inci maddedeki kapalı listede açıkça yazıyor mu?","paragraf":"m.375/1-c","yanilgi":"Muhasebe ve finansal planlama düzenini teknik/idari bir iş sayıp devredilebileceğini düşünüyorsun."},"B":{"gercek":"Türk Ticaret Kanununun 395 inci maddesinin birinci fıkrası, izinsiz işlemi şirketin batıl ileri sürebileceği bir işlem olarak düzenler; karşı taraf bu iddiayı ileri süremez.","ayirt":"Batıl olduğunu ileri sürme hakkı yalnız şirkete mi tanınmış?","paragraf":"m.395/1","yanilgi":"İzinsiz kendisiyle işlem yapmanın sonucunu \u0027kesin hükümsüzlük\u0027 terimiyle karıştırıp cümleyi yanlış sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 102"},"kural":"Türk Ticaret Kanununun 59 uncu maddesi uyarınca ilana hükmün kesinleşmesinden SONRA karar verilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 102","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Hangisi yanlıştır\u0027 sorularında tek maddenin fıkrasını unsur unsur ayır (istem-gider-zaman-yetki-nitelik) ve her şıkkı o unsurla eşleştirip tek kelime farkını yakala.","konu":"haksız rekabet davalari","tablo":{"satirlar":[["A) İlana karar verilebilmesi için davayı kazanan tarafın bu…","m.59/1","doğru ifade"],["B) İlan giderleri, davada haksız çıkan taraftan alınır.","m.59/1","doğru ifade"],["C) Mahkeme, hükmün kesinleşmesini beklemeden ilana karar ve…","m.59/1","YANLIŞ ifade"],["D) İlanın şeklini ve kapsamını mahkeme belirler.","m.59/1","doğru ifade"],["E) Mahkeme, şartlar gerçekleşse dahi ilana karar verip verm…","m.59/1","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Mahkeme, hükmün kesinleşmesini beklemeden ilana karar verip uygulatabilir.","E":"Mahkeme, şartlar gerçekleşse dahi ilana karar verip vermemekte takdir yetkisine sahiptir.","A":"İlana karar verilebilmesi için davayı kazanan tarafın bu yönde bir istemde bulunması gerekir.","D":"İlanın şeklini ve kapsamını mahkeme belirler.","B":"İlan giderleri, davada haksız çıkan taraftan alınır."},"kaynak":{"alinti":"hükmün kesinleşmesinden sonra ilan edilmesine karar verebilir","liste":[{"ad":"TTK (6102 s.K.) m.59","metin":"MADDE 59- (1) Mahkeme, davayı kazanan tarafın istemiyle, gideri haksız çıkan taraftan alınmak üzere, hükmün kesinleşmesinden sonra ilan edilmesine de karar verebilir. İlanın şeklini ve kapsamını mahkeme belirler. V - Zamanaşımı"},{"ad":"TTK (6102 s.K.) m.590","metin":"MADDE 590- (1) Şirketin kuruluşu hakkındaki hükümlere ve özellikle sermayenin ayın olarak konması ve bir işletme ile ayınların devralınmasına dair kurallara uymak şartıyla esas sermaye artırılabilir. 2. Rüçhan hakkı"}],"hakem":"TTK m.59\u0027da açıkça \u0027hükmün kesinleşmesinden sonra ilan edilmesine karar verebilir\u0027 denildiğinden, \u0027kesinleşmeyi beklemeden ilana karar verip uygulatabilir\u0027 ifadesi kanuna doğrudan aykırıdır."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2024/3","2020/1","2016/3"]},"oyun":null,"tip":"teori","soru":"Türk Ticaret Kanunu\u0027na göre, haksız rekabet davasını kazanan tarafın istemi üzerine mahkemenin hükmün ilanına karar vermesine ilişkin aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-ticaret-p30/kp-02","verilenler":[],"dayanak":"Türk Ticaret Kanunu (6102 s.K.) madde 59","dogru":"C","oyunBonus":null,"ders":"Ticaret Hukuku","adimlar":[{"formul":"Olay: Konya\u0027da bir mobilya fabrikası, rakip firmasına açtığı haksız rekabet davasını kazanıyor. Mahkeme 12 Mart 2023\u0027te hükmü veriyor, ama karar 3 Mayıs 2023\u0027te kesinleşiyor. Fabrika sahibi 20 Mart\u0027ta, yani karar henüz kesinleşmeden, \u0027hemen gazeteye ilan verelim\u0027 diye avukatını arıyor.","anlatim":"Bu olayda beş ayrı iddia var, hepsini tek tek test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Türk Ticaret Kanunu madde 59/1\u0027e göre mahkeme, davayı kazananın isteği üzerine, gideri kaybedenden alınmak üzere, hükmün kesinleşmesinden sonra ilana karar verebilir; şeklini ve kapsamını da mahkeme belirler. Bu tek cümledeki beş unsuru fabrika olayında tek tek deneyeceğiz.","anlatim":"Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"m.59/1","karar":"doğru","anlatim":"Hayır, madde açıkça \u0027davayı kazanan tarafın istemiyle\u0027 der. Fabrika sahibi istemezse ilan hiç gündeme gelmez. Bu yüzden ifade doğrudur.","formul":"Şık A: fabrika sahibi hiç talepte bulunmasa, mahkeme kendiliğinden ilana karar verir mi?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"m.59/1","karar":"doğru","anlatim":"Kanun gideri haksız çıkan taraftan alır, yani burada rakip firma öder. Fabrika sahibi kazandığı için cebinden para çıkmaz. İfade doğrudur.","formul":"Şık B: ilan masrafını fabrika sahibi mi öder, yoksa rakip firma mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"m.59/1","karar":"yanlış","anlatim":"Hayır, madde \u0027hükmün kesinleşmesinden sonra\u0027 der. 20 Mart\u0027ta kesinleşme yok, 3 Mayıs\u0027ta var; önce beklenecek. Bu yüzden ifade yanlıştır.","formul":"Şık C: 20 Mart\u0027ta, karar daha kesinleşmeden, mahkeme ilana karar verip hemen uygulatabilir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"m.59/1","karar":"doğru","anlatim":"Hayır, madde bu belirlemeyi mahkemenin takdirine bırakır. Mahkeme fabrika olayında şeklini ve kapsamını kendisi çizer. İfade doğrudur.","formul":"Şık D: ilanın hangi gazetede, kaç satır, ne kapsamda yapılacağını kanun mu belirliyor?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"m.59/1","karar":"doğru","anlatim":"Evet, madde \u0027karar verebilir\u0027 der, zorunluluk değil yetki tanır. Mahkeme şartlar tamam olsa da ilana karar vermeyebilir. İfade doğrudur.","formul":"Şık E: kesinleşme gerçekleşse bile mahkeme \u0027ilana gerek yok\u0027 diyebilir mi?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Yanlış olan tek nokta, ilanın kesinleşme beklenmeden yapılabileceği iddiası. Kendine sor: ilan, hüküm kesinleşmeden önce mi sonra mı yapılabiliyor?","doldur":[]}],"anahtar":[{"ornek":"kesinleşmesinden","kok":"kesinl"},{"ornek":"mahkeme","kok":"mahkem"},{"ornek":"doğrudur","kok":"doğrud"},{"ornek":"fabrika","kok":"fabrik"},{"ornek":"haksız","kok":"haksız"},{"ornek":"hükmün","kok":"hükmün"}],"konuGiris":{"harita":"Ne zaman istenir: hüküm kesinleşmesinden sonra, davayı kazanan tarafın talebiyle istenir. Nasıl belirlenir: ilanın şeklini ve kapsamını mahkeme kendisi belirler. Kim öder: ilan gideri haksız çıkan taraftan alınır.","desen":"Sınav genelde ilanın hükmün kesinleşmesinden ÖNCE mi SONRA mı yapılacağını karıştırarak sorar. Bir diğer tuzak, ilan giderinin davayı açan tarafa yüklendiği ifadesidir; oysa gider haksız çıkan taraftan alınır. Bu soru Türk Ticaret Kanunu m.59 hükmünden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kazanan tarafın talebiyle mahkemenin hükmü ilan ettirmesi kararı","ad":"İlan kararı","kim":"mahkeme belirler"},{"kaynak":"kuraldan bilinir","tanim":"İlan kararının uygulanabilmesi için hükmün kesinleşmiş olması şartı","ad":"Kesinleşme","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İlan masrafının haksız çıkan taraftan tahsil edilmesi kuralı","ad":"İlan gideri","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İlanın nasıl ve nerede yapılacağının mahkemece tayini","ad":"İlanın şekli","kim":"mahkeme belirler"}],"sinavda":"Soruda ilan kararına ilişkin birkaç ifade verilir ve bunlardan hangisinin kanuna aykırı olduğu istenir.","panel_ornek":"Bir apartman yönetimi, komşu dükkanla açtığı davayı kazanınca mahallede 5 ilan panosuna asılmasını istedi. Masrafı davayı kaybeden komşu ödedi, pano sayısını ve şeklini yönetim kurulu değil mahkeme belirledi.","ornek":"Bir apartman yönetimi, komşu dükkanla açtığı davayı kazanınca mahallede 5 ilan panosuna asılmasını istedi. Masrafı davayı kaybeden komşu ödedi, pano sayısını ve şeklini yönetim kurulu değil mahkeme belirledi.","yontemler":"Doğrudan madde metninin kelimesi kelimesine karşılaştırılması gerekir; en kritik nokta \u0027kesinleşmeden sonra\u0027 ve \u0027gideri haksız çıkan taraftan alınır\u0027 ifadelerinin değiştirilip değiştirilmediğidir.","nedir":"Haksız rekabet davasında davayı kazanan tarafın istemiyle mahkemenin hükmü ilan ettirmesi konusudur. Sınav, ilan kararının şartlarını ve kimin karar verdiğini bilip bilmediğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Kapsam Tuzağı","metin":"İlanın şeklini kanunun kendisinin doğrudan, sabit biçimde belirlediğini sanırsın. Doğrusu: Kanun ilanın şekil ve kapsamını belirleme yetkisini mahkemeye bırakır; bu ifade doğrudur."},"E":{"ad":"Takdir Tuzağı","metin":"Şartlar oluşunca mahkemenin ilana karar vermek zorunda olduğunu sanırsın. Doğrusu: Madde \u0027karar verebilir\u0027 der, bu mahkemenin takdir yetkisidir; ifade doğrudur."},"A":{"ad":"İstem Tuzağı","metin":"Mahkemenin ilana kendiliğinden, taraf talebi olmadan da karar verebileceğini sanıp bu ifadeyi yanlış işaretlersin. Doğrusu: Kanun ilanı ancak davayı kazanan tarafın istemine bağlar, bu ifade doğrudur ve aranan yanlış ifade değildir."},"B":{"ad":"Gider Tuzağı","metin":"İlan giderinin devlet ya da davacı tarafından karşılanacağını sanıp bu ifadeyi işaretlersin. Doğrusu: Kanuna göre ilan gideri, davada haksız çıkan taraftan alınır; bu ifade doğrudur."}},"celdiriciYol":null,"hap":"Haksız rekabet davasını kazanan tarafın istemiyle mahkeme, hükmün kesinleşmesinden SONRA ilanına karar verebilir; gideri haksız çıkan taraf öder.","teshis":{"C":{"gercek":"Madde 59/1 açıkça \u0027hükmün kesinleşmesinden sonra\u0027 der; kesinleşme öncesi ilan kanuna aykırıdır.","ayirt":"İlan, hüküm kesinleşmeden önce mi sonra mı yapılabiliyor?","paragraf":"m.59/1","yanilgi":"İlanın etkili olması için kesinleşmeyi beklemeden hemen yapılması gerektiğini düşünüyorsun."},"E":{"gercek":"Madde \u0027karar verebilir\u0027 ifadesiyle mahkemeye takdir yetkisi tanır, zorunluluk öngörmez.","ayirt":"Bu bir zorunluluk mu, yoksa mahkemenin takdirinde mi?","paragraf":"m.59/1","yanilgi":"Şartlar oluşunca mahkemenin ilana karar vermek zorunda olduğunu sanıyorsun."},"A":{"gercek":"Madde 59/1, ilan kararını açıkça davayı kazanan tarafın istemine bağlar.","ayirt":"Bu unsur talebe mi bağlı, yoksa mahkeme kendiliğinden mi karar veriyor?","paragraf":"m.59/1","yanilgi":"Mahkemenin ilana taraf istemi olmadan da resen karar verebileceğini sanıyorsun."},"D":{"gercek":"Madde 59/1 bu belirlemeyi mahkemenin takdirine bırakır.","ayirt":"Şekli ve kapsamı kim belirliyor, kanun mu mahkeme mi?","paragraf":"m.59/1","yanilgi":"İlanın şekil ve kapsamının kanunda sabit biçimde belirlendiğini sanıyorsun."},"B":{"gercek":"Madde 59/1 gereği gider, haksız çıkan taraftan alınır.","ayirt":"Gideri kim öder, kazanan mı kaybeden mi?","paragraf":"m.59/1","yanilgi":"İlan giderinin kazanan tarafa ya da devlete ait olduğunu sanıyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 122"},"kural":"Türk Ticaret Kanununun 373 üncü maddesinin ikinci fıkrasına göre tescilden sonra ortaya çıkan seçim veya atamaya ilişkin hukuki sakatlık, ancak üçüncü kişinin bunu bildiği ispatlanırsa şirkete karşı ileri sürülebilir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 122","sonDonem":6,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Temsil sorularında her şıkkı m.371-373\u0027ün hangi fıkrasına karşılık geldiğini belirleyip \u0027tescil edildi mi\u0027, \u0027bilen taraf var mı\u0027 sorularını sor.","konu":"anonim şirket temsili","tablo":{"satirlar":[["A) Ahmet\u0027in işletme konusu dışında yaptığı ve karşı tarafın…","m.371/2","YANLIŞ ifade"],["B) Ahmet ve Beste\u0027nin şirket işleri sırasında işledikleri b…","m.371/5","YANLIŞ ifade"],["C) Temsil yetkisinin ticaret siciline tescilinden sonra ort…","m.373/2","doğru ifade"],["D) Esas sözleşmenin ilan edilmiş olması tek başına, üçüncü …","m.371/2 son cümle","YANLIŞ ifade"],["E) Ahmet\u0027in temsil yetkisi, ticaret siciline tescil ve ilan…","m.371/3","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Temsil yetkisinin ticaret siciline tescilinden sonra ortaya çıkan bir seçim sakatlığı, bunu bilmeyen üçüncü kişilere karşı ileri sürülemez.","E":"Ahmet\u0027in temsil yetkisi, ticaret siciline tescil ve ilan edilse dahi yalnızca şirket merkezinin işlerine özgülenerek sınırlandırılamaz.","A":"Ahmet\u0027in işletme konusu dışında yaptığı ve karşı tarafın bu durumu bildiği bir sözleşme, şirketi bağlar.","D":"Esas sözleşmenin ilan edilmiş olması tek başına, üçüncü kişinin işlemin işletme konusu dışında olduğunu bildiğinin ispatı için yeterli delildir.","B":"Ahmet ve Beste\u0027nin şirket işleri sırasında işledikleri bir haksız fiilden, kusurları bulunmadıkça şirket sorumlu tutulamaz."},"kaynak":{"alinti":"","liste":[{"ad":"TTK (6102 s.K.) m.371 [1/2]","metin":"MADDE 371- (1) Temsile yetkili olanlar şirketin amacına ve işletme konusuna giren her tür işleri ve hukuki işlemleri, şirket adına yapabilir ve bunun için şirket unvanını kullanabilirler. Kanuna ve esas sözleşmeye aykırı işlemler dolayısıyla şirketin rücû hakkı saklıdır. (2) Temsile yetkili olanların, üçüncü kişilerle, işletme konusu dışında yaptığı işlemler de 23/5/2024 tarihli 7511 sayılı Kanunun 13 üncü maddesi ile bu fıkranın birinci cümlesinde yer alan “Yönetim kurulu her yıl üyeleri arasından” ibaresi “Yönetim kurulu, üyeleri arasından” şeklinde değiştirilmiştir. 50 şirketi bağlar; meğerki, üçüncü kişinin, işlemin işletme konusu dışında bulunduğunu bildiği veya durumun gereğinden, bilebilecek durumda bulunduğu ispat edilsin. Şirket esas sözleşmesinin ilan edilmiş olması, bu hususun ispatı açısından, tek başına yeterli delil değildir. (3) Temsil yetkisinin sınırlandırılması, iyiniyet sahibi üçüncü kişilere karşı hüküm ifade etmez; ancak, temsil yetkisinin sadece merkezin veya bir şubenin işlerine özgülendiğine veya birlikte kullanılmasına ilişkin tescil ve ilan edilen sınırlamalar geçerlidir. (4) Temsile yetkili kişiler tarafından yapılan işlemin esas sözleşmeye veya genel kurul kararına aykırı olması, iyiniyet sahibi üçüncü kişilerin o işlemden dolayı şirkete başvurmalarına engel değildir. (5) Temsile veya yönetime yetkili olanların, görevlerini yaptıkları sırada işledikleri haksız fiillerden şirket sorumludur. Şirketin rücû hakkı saklıdır. (6) Sözleşmenin yapılması sırasında, şirket tek pay sahibi tarafından ister temsil edilsin ister edilmesin, tek pay sahipli anoni…"},{"ad":"TTK (6102 s.K.) m.371 [2/2]","metin":"Bu şart piyasa şartlarına göre günlük, önemsiz ve sıradan işlemlere ilişkin sözleşmelerde uygulanmaz. (7) (Ek: 10/9/2014 - 6552/131 md.) Yönetim kurulu, yukarıda belirtilen temsilciler dışında, temsile yetkili olmayan yönetim kurulu üyelerini veya şirkete hizmet akdi ile bağlı olanları sınırlı yetkiye sahip ticari vekil veya diğer tacir yardımcıları olarak atayabilir. Bu şekilde atanacak olanların görev ve yetkileri, 367 nci maddeye göre hazırlanacak iç yönergede açıkça belirlenir. Bu durumda iç yönergenin tescil ve ilanı zorunludur. İç yönerge ile ticari vekil ve diğer tacir yardımcıları atanamaz. Bu fıkra uyarınca yetkilendirilen ticari vekil veya diğer tacir yardımcıları da ticaret siciline tescil ve ilan edilir. Bu kişilerin, şirkete ve üçüncü kişilere verecekleri her tür zarardan dolayı yönetim kurulu müteselsilen sorumludur. 3. İmza şekli"}],"hakem":"TTK m.373(2) açıkça tescilden sonra ortaya çıkan seçim/atama sakatlığının şirket tarafından üçüncü kişilere ancak sakatlığın bilindiğinin ispat edilmesi şartıyla ileri sürülebileceğini düzenlemektedir; bilmeyen iyiniyetli kişiye karşı ileri sürülemez."},"kayitlar":[],"sade":null,"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2025/3","2024/3"]},"oyun":null,"tip":"teori","soru":"Esas sözleşmesinde temsile ilişkin özel bir düzenleme bulunmayan ABC Anonim Şirketinin temsile yetkili iki yönetim kurulu üyesi Ahmet ve Beste\u0027dir. Buna göre şirketin temsiline ilişkin aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-ticaret-p30/kp-03","verilenler":[],"dayanak":"Türk Ticaret Kanunu m.371, m.373","dogru":"C","oyunBonus":null,"ders":"Ticaret Hukuku","adimlar":[{"formul":"Olay: XYZ Tekstil A.Ş.\u0027de yönetim kurulu, temsile yetkili iki üyeyi 3 Mart 2023\u0027te seçiyor ve bu karar aynı ay ticaret siciline tescil edilip ilan ediliyor.","anlatim":"Aradan 8 ay geçiyor, kasım ayında bu seçimin aslında usulsüz yapıldığı ortaya çıkıyor. Şirketle sözleşme imzalayan tedarikçi Kemal bu usulsüzlükten hiç haberdar değil.","doldur":[]},{"formul":"Ne yapacağız: Türk Ticaret Kanunu m.373/2, tescilden sonra ortaya çıkan seçim sakatlığının ancak üçüncü kişinin bunu bildiği ispatlanırsa ileri sürülebi // 06.09 seviye: ölçümden türer (bkz. kart kurulumu). k = sınıf anahtarı, ad = ekran adı (Nöbet dili: Isınma / Nöbet / Alarm), neden = ipucu.
function seviyeHesapla(s){
  const o=s.olcum||{}; const tip=s.tip||'teori'; const ders=String(s.ders||'');
  if(o.sim&&o.sim.dogru===false) return {k:'alarm',ad:'🔴 Alarm',neden:'Nöbetçi öğrencisi bu anlatımla ikizi çözemedi; dikkat ister'};
  if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

const GUN=86400000; const KUTU={ kayit:[], kutu:[], oyun:[], ileri:0 };   // ileri: demo icin "zaman ileri sarma" (ms)
try{ KUTU.kayit=JSON.parse(localStorage.getItem('kc_kayit')||'[]'); KUTU.kutu=JSON.parse(localStorage.getItem('kc_kutu')||'[]'); KUTU.oyun=JSON.parse(localStorage.getItem('kc_oyun')||'[]'); KUTU.ileri=parseInt(localStorage.getItem('kc_ileri')||'0')||0; }catch(e){}
const simdi=()=>Date.now()+KUTU.ileri;
function kutuKaydet(){ try{ localStorage.setItem('kc_kayit',JSON.stringify(KUTU.kayit.slice(-500))); localStorage.setItem('kc_kutu',JSON.stringify(KUTU.kutu)); localStorage.setItem('kc_oyun',JSON.stringify(KUTU.oyun.slice(-500))); localStorage.setItem('kc_ileri',String(KUTU.ileri)); }catch(e){} }
// 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}
function skorCiz(){ const sk=skorHesapla(); const vade=KUTU.kutu.filter(x=>x.due<=simdi()).length; const azVeri=KUTU.kayit.length<5; document.querySelectorAll('.skorCip').forEach(el=>{ el.textContent=azVeri?'🎯 —':('🎯 %'+sk.toplam); el.title=azVeri?'Hazırlık skoru 5 sorudan sonra görünür':'Hazırlık skoru'; }); /* 05.09: ilk yanlıştan sonra "%4" görmek caydırıcı; 5 cevaptan önce yüzde yok */ document.querySelectorAll('.kutuCip').forEach(el=>{ el.textContent='📥 '+KUTU.kutu.length+(vade?' ·'+vade+' hazır':''); el.classList.toggle('hazir',vade>0); }); }
function kartSifirla(i){ const k=akis.children[i]; if(!k) return; delete durum.cevap[i]; k.querySelectorAll('.sik').forEach(x=>{ x.disabled=false; x.classList.remove('dogru','yanlis'); }); const p=k.querySelector('.panel'); p.classList.remove('acik'); k.querySelectorAll('.sek').forEach(x=>x.classList.remove('acik')); k.querySelectorAll('.cip2').forEach(x=>x.classList.remove('acik')); k.querySelector('.ipucu').style.display=''; document.querySelectorAll('.noktalar i[data-j="'+i+'"]').forEach(n=>{ n.classList.remove('ok','yan'); }); k.scrollIntoView({behavior:'smooth'}); }
function kutuEkraniAc(){
  let e=document.getElementById('kutuEkran'); if(!e){ e=document.createElement('div'); e.id='kutuEkran'; e.className='kutuEkran'; document.body.appendChild(e); }
  const sk=skorHesapla(); const t=simdi();
  const gunStr=ms=>{ const d=Math.ceil((ms-t)/GUN); return d<=0?'<b style="color:var(--yesil)">şimdi hazır</b>':(d+' gün sonra'); };
  e.innerHTML='<div class="kutuIc"><div class="basl"><span>🎯 Hazırlık skoru ve yanlış kutusu</span><button class="btn" id="kutuKapat" style="padding:5px 10px">✕</button></div>'
   +'<div class="skorBuyuk">%'+sk.toplam+'</div><div class="ipnot">Sınav DNA’sı ağırlıklı: çok çıkan konudaki yanlış daha çok düşürür. Çözülen '+sk.cozulen+' / '+sk.n+' konu · Sen çöz: '+sk.oyunTam+' ipuçsuz (tam puan) · '+sk.oyunIpuclu+' ipuçlu (yarım puan).</div>'
   +sk.ders.map(d=>'<div class="dersSat"><span>'+esc(d.ad)+'</span><div class="bar"><i style="width:'+d.yuzde+'%"></i></div><b>%'+d.yuzde+'</b></div>').join('')
   +'<div class="et" style="margin-top:14px">📥 Yanlış kutusu ('+KUTU.kutu.length+')</div>'
   +(KUTU.kutu.length?KUTU.kutu.map(x=>{ const i=SORULAR.findIndex(s=>s.id===x.id); return '<div class="kutuSat"><div><b>'+esc(x.konu)+'</b> <span class="ipnot" style="display:inline">· '+(x.tur>=2?'2. tur (7 gün)':'1. tur (2 gün)')+' · '+gunStr(x.due)+'</span></div>'+(x.due<=t&&i>=0?'<button class="btn mavi kutuCoz" data-i="'+i+'">Şimdi çöz</button>':'')+'</div>'; }).join(''):'<p class="ipnot">Kutu boş. Yanlış yaptığın her soru buraya düşer ve 2 gün sonra geri gelir.</p>')
   +'<div class="btnrow" style="margin-top:14px"><button class="btn" id="kutuIleri">⏩ Demo: 2 gün ileri sar</button><button class="btn gri" id="kutuSifirla">Verileri sıfırla</button></div>'
   +'<p class="ipnot">Nasıl çalışır: yanlış → kutuya girer, 2 gün sonra geri gelir; o gün doğru bilirsen 7 gün sonra bir kez daha gelir; onu da bilirsen kutudan çıkar ve ustalık tam sayılır.</p></div>';
  e.classList.add('acik');
  e.querySelector('#kutuKapat').addEventListener('click',()=>e.classList.remove('acik'));
  e.querySelector('#kutuIleri').addEventListener('click',()=>{ KUTU.ileri+=2*GUN; kutuKaydet(); kutuEkraniAc(); skorCiz(); });
  e.querySelector('#kutuSifirla').addEventListener('click',()=>{ if(confirm('Skor, kutu ve seri sıfırlansın mı?')){ KUTU.kayit=[]; KUTU.kutu=[]; KUTU.ileri=0; kutuKaydet(); location.reload(); } });
  e.querySelectorAll('.kutuCoz').forEach(b=>b.addEventListener('click',()=>{ e.classList.remove('acik'); kartSifirla(parseInt(b.dataset.i)); }));

    const cipler=[...gercek.map(t=>({t,d:0})),...celdirici.map(t=>({t,d:1}))]; for(let i=cipler.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cipler[i],cipler[j]]=[cipler[j],cipler[i]]; }

    // fare tekerlegi, klavye oklari, parmakla yatay kaydirma (sola = ileri)
    let tekerKilit=0; serit.addEventListener('wheel',e=>{ e.preventDefault(); const t=Date.now(); if(t-tekerKilit<350) return; tekerKilit=t; adimGit((e.deltaY||e.deltaX)>0?1:-1); },{passive:false});
    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});
// --- son kart
const son=document.createElement('section'); son.className='kart son';
son.innerHTML='<div class="ust"><span>Nöbet bitti</span>'+noktalar(-1)+'<span>&nbsp;</span></div><div class="govde son" style="display:flex;flex-direction:column;justify-content:center"><div id="sonSkor"></div></div>';
akis.appendChild(son);
document.querySelectorAll('.skorCip,.kutuCip').forEach(b=>b.addEventListener('click',kutuEkraniAc)); skorCiz();
if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i').forEach(n=>n.classList.toggle('simdi',n.dataset.j==String(i)||(i>=SORULAR.length&&n.dataset.j==='son')));
  if(i<SORULAR.length&&durum.cevap[i]===undefined&&!durum.t0[i]) durum.t0[i]=Date.now();   // 06.09: karta gelince süre başlar
  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='PageDown'){ akis.scrollBy({top:akis.clientHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='PageUp'){ akis.scrollBy({top:-akis.clientHeight,behavior:'smooth'}); } });
</script></body></html>
