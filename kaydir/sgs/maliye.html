şılığında mal veya hizmet alınmadığı için transfer harcamasıdır, reel harcama değildir. C şıkkı faiz giderlerini reel harcama sayarak kuralı çiğnemektedir.","sinav":"Ekonomik sınıflandırmada faiz giderleri karşılığında mal veya hizmet alınmadığı için transfer harcaması sayılır, reel harcama değildir.","kavramlar":[{"kaynak":"TEORI","tanim":"Devletin karşılığında mal veya hizmet edindiği, üretim faktörü kullandığı ve millî gelire doğrudan katkı sağlayan harcamadır.","ad":"Reel harcama"},{"kaynak":"TEORI","tanim":"Karşılığında mal veya hizmet alınmayan, satın alma gücünün karşılıksız olarak bir kesimden ötekine aktarıldığı harcamadır.","ad":"Transfer harcaması"},{"kaynak":"TEORI","tanim":"Kamu harcamasının hangi kamu hizmetine alanına (savunma, eğitim, sağlık gibi) yöneldiğini gösteren sınıflandırmadır.","ad":"Fonksiyonel sınıflandırma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/2","2018/2","2017/2"]},"oyun":null,"tip":"teori","soru":"Kamu harcamalarının ekonomik ve fonksiyonel sınıflandırmasına ilişkin ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-gk-pilot2-maliye-zor/kp-01","verilenler":[],"dayanak":"TEORİ - kamu harcamaları sınıflandırma (ekonomik sınıflandırma: cari-yatırım-transfer; reel-transfer ayrımı), mevzuat maddesi yok","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Belediye 2023 yılında 40.000 TL borç faizi öder, 60.000 TL memur maaşı verir, 25.000 TL yol yapımına harcar.","anlatim":"Bu üç ödeme aynı bütçede ama farklı kutulara yazılıyor. Maaş ve yol harcaması bir mal-hizmet karşılığı, faiz ise karşılıksız bir aktarım. Şimdi bu olayın üzerinden beş ifadeyi tek tek süzeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Ekonomik sınıflandırma harcamayı cari, yatırım, transfer diye üçe böler; fonksiyonel sınıflandırma ise \u0027hangi hizmet alanına\u0027 sorusunu sorar; idari sınıflandırma \u0027hangi kurum\u0027 sorusunu sorar.","anlatim":"Belediyenin maaşı cari, yolu yatırım, faizi transfer kutusuna gider. Beş ifadeyi bu üçlü ayrımın içinde, bu olayın rakamlarıyla tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TEORİ - kamu harcamaları sınıflandırma","karar":"doğru","anlatim":"Fonksiyonel sınıflandırma maaşın hangi hizmete (idari, sosyal, savunma vb.) gittiğini gösterir, hangi kurumun ödediğini değil. Belediye bu maaşı hangi hizmet için verdiyse fonksiyonel kutu ona göre dolar.","formul":"Şık A: bu 60.000 TL maaş için \u0027burada fonksiyonel sınıflandırma bana kurumu değil hizmet alanını gösterir\u0027 desem doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TEORİ - kamu harcamaları sınıflandırma","karar":"doğru","anlatim":"İdari sınıflandırma sadece \u0027belediye ödedi\u0027 der, hizmetin niteliğine girmez. Bu ayrım kurumu gösteren kutuyla hizmeti gösteren kutunun ayrı olduğunu doğrular.","formul":"Şık B: \u0027idari sınıflandırma bu harcamayı yapan birimi gösterir ama hizmetin ne olduğunu söylemez\u0027 desem doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TEORİ - kamu harcamalarinin turleri / ekonomik sınıflandırma","karar":"yanlış","anlatim":"Reel harcamada devlet karşılığında bir mal veya hizmet alır; faizde karşılığında hiçbir şey alınmaz, sadece borç verene ödeme yapılır. Bu yüzden faiz reel değil, transfer harcamasıdır; müdürün önerisi yanlış.","formul":"Şık C: müdür \u0027bu 40.000 TL faizi reel harcama sayalım, çünkü devlet parayı harcadı\u0027 derse, kabul eder misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TEORİ - kamu harcamalarinin turleri","karar":"doğru","anlatim":"Maaş cari, yol yatırım, faiz transfer; üç grup burada tam karşılığını buluyor. Bu üçlü ayrım ekonomik sınıflandırmanın standart iskeletidir.","formul":"Şık D: \u0027ekonomik sınıflandırmada bu üç ödeme cari, yatırım, transfer diye üç gruba girer\u0027 desem doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TEORİ - kamu harcamaları sınıflandırma","karar":"doğru","anlatim":"Aynı ödeme iki farklı sınıflandırmada aynı anda yer alabilir, çünkü boyutlar birbirini dışlamaz. Ekonomik boyut \u0027ne tür etki\u0027, fonksiyonel boyut \u0027ne için\u0027 sorusuna cevap verir, ikisi birlikte kullanılır.","formul":"Şık E: emekli maaşı ödesin belediye, \u0027ekonomik açıdan transfer, fonksiyonel açıdan sosyal güvenlik\u0027 desem doğru mu?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Faiz ödemesi karşılıksız olduğu için reel değil transfer harcamasıdır, bunu unutunca C tuzağına düşersin. Kendine hep şunu sor: bu ödemenin karşılığında devlet bir mal veya hizmet mi alıyor?","doldur":[]}],"anahtar":[{"ornek":"karşılığında","kok":"karşıl"},{"ornek":"hizmet","kok":"hizmet"},{"ornek":"harcamasıdır","kok":"harcam"},{"ornek":"transfer","kok":"transf"},{"ornek":"sınıflandırmada","kok":"sınıfl"},{"ornek":"ekonomik","kok":"ekonom"}],"konuGiris":{"harita":"Ne zaman test edilir: bir harcama türünün cari/yatırım/transfer ayrımına doğru yerleştirilip yerleştirilmediği sorulduğunda. Nasıl ölçülür: harcamanın karşılığında üretim/mal-hizmet olup olmadığına ve milli gelire doğrudan girip girmediğine bakılarak. Nasıl kaydedilir: bütçe sınıflandırmasında cari, yatırım, transfer başlıkları altında ayrı kalemler olarak kaydedilir.","desen":"Sınav sıklıkla cari harcamayı gerçek harcamayla özdeşleştirip \u0027tüm gerçek harcamalar caridir\u0027 tuzağı kurar, oysa yatırım da gerçek harcamadır. Ayrıca transferin milli gelire doğrudan katkı sağlamadığı bilgisi tersine çevrilerek yanlış şık üretilir. Bu soru p.28\u0027deki cari-gerçek ayrımı ve transferin milli gelire girmemesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Personel giderleri ve mal-hizmet alımlarını kapsayan bütçe kategorisi","ad":"Cari harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Sermaye ve altyapı oluşturan bina, yol, baraj gibi kalemler","ad":"Yatırım harcaması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Karşılıksız satın alma gücü aktarımı, üretim gerçekleşmez, milli gelire girmez","ad":"Transfer harcaması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Mal-hizmet satın alınıp üretim faktörü kullanılan, milli gelire doğrudan giren harcama","ad":"Gerçek (reel) harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Ekonomik ve fonksiyonel sınıflandırmaya dair birkaç ifade verilir, öğrenciden yanlış olanı bulması istenir.","panel_ornek":"Sen ayda 300 lira harçlığını market alışverişine (mal-hizmet) harcarsan bu senin normal tüketimindir; ama arkadaşına karşılıksız 50 lira borç verirsen bu bir \u0027transfer\u0027dir, senin ürettiğin bir şey yoktur, sadece para el değiştirmiştir. İşte devlet de böyle: bina yaptırırsa gerçek harcama, emekli maaşı öderse transfer harcamasıdır.","ornek":"Sen ayda 300 lira harçlığını market alışverişine (mal-hizmet) harcarsan bu senin normal tüketimindir; ama arkadaşına karşılıksız 50 lira borç verirsen bu bir \u0027transfer\u0027dir, senin ürettiğin bir şey yoktur, sadece para el değiştirmiştir. İşte devlet de böyle: bina yaptırırsa gerçek harcama, emekli maaşı öderse transfer harcamasıdır.","yontemler":"Her ifadeyi \u0027üretim var mı, milli gelire giriyor mu\u0027 sorusuyla test et; cari-gerçek ayrımını asla eşitleme.","nedir":"Kamu harcamaları sınıflandırması, devletin harcamalarını ekonomik niteliğine (cari-yatırım-transfer) ve hizmet alanına (fonksiyonel) göre gruplamayı inceler. Sınav, bir harcama kaleminin hangi sınıfa girdiğini ve bu ayrımın gerekçesini doğru bilip bilmediğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Üçlü Grup Tuzağı","metin":"Bu şıkkı eleyen öğrenci ekonomik sınıflandırmanın ikili (cari-yatırım) olduğunu sanır. Doğrusu: ekonomik sınıflandırma cari, yatırım ve transfer olmak üzere üç ana grup içerir; ifade doğrudur."},"E":{"ad":"Çapraz Sınıflandırma Tuzağı","metin":"Bu şıkkı eleyen öğrenci bir harcamanın tek bir sınıflandırmaya girdiğini, çapraz okunamayacağını düşünür. Doğrusu: emekli aylığı aynı anda ekonomik olarak transfer, fonksiyonel olarak sosyal güvenlik harcamasıdır; ifade doğrudur."},"A":{"ad":"Karışık Ölçüt Tuzağı","metin":"Bu şıkkı eleyen öğrenci fonksiyonel sınıflandırmayı ekonomik sınıflandırmayla karıştırıp yanlış sanır. Doğrusu: fonksiyonel sınıflandırma harcamanın hangi hizmet alanına (sağlık, eğitim, savunma) yöneldiğini gösterir; bu ifade doğrudur."},"B":{"ad":"Kurum-Hizmet Karıştırma Tuzağı","metin":"Bu şıkkı eleyen öğrenci idari sınıflandırmanın da hizmet türünü gösterdiğini düşünür. Doğrusu: idari sınıflandırma yalnız sorumlu kurumu gösterir, hizmetin niteliğine değinmez; ifade doğrudur."}},"celdiriciYol":{"D":"Ekonomik sınıflandırmayı iki gruba (cari-yatırım) indirip transfer grubunu atlama hatasına dayanır (kapsam eksik sayma).","E":"Bir harcamanın tek boyutlu sınıflandırılacağı, çapraz okunamayacağı yanılgısına dayanır (çapraz sınıflandırma reddi).","A":"Fonksiyonel ölçütü idari ölçütle karıştırıp \u0027kurumu gösterir\u0027 sanma hatasına dayanır (ölçüt karıştırma).","B":"İdari ölçütü fonksiyonel ölçütle karıştırıp \u0027hizmeti gösterir\u0027 sanma hatasına dayanır (ölçüt karıştırma)."},"hap":"Faiz giderleri karşılığında mal/hizmet alınmadığı için ekonomik sınıflandırmada reel değil, transfer harcamasıdır.","teshis":{"C":{"gercek":"Reel harcamada karşılığında üretim faktörü/mal-hizmet alınır; faiz ödemesinde karşılıksız satın alma gücü aktarımı vardır, bu yüzden faiz transfer harcamasıdır.","ayirt":"Bu ödemenin karşılığında devlet bir mal veya hizmet mi elde ediyor?","paragraf":"TEORİ - kamu harcamalarinin turleri / ekonomik sınıflandırma","yanilgi":"Faiz ödemesinin devlete bir hizmet ya da mal sağladığını düşünüp onu reel harcama sanırsın."},"E":{"gercek":"Analitik bütçe sınıflandırması boyutları birlikte kullanır; emekli aylığı ekonomik olarak transfer, fonksiyonel olarak sosyal güvenliktir.","ayirt":"Bu harcamayı hem \u0027ne tür etki\u0027 hem \u0027ne için\u0027 sorusuyla ayrı ayrı sınıflandırabiliyor muyum?","paragraf":"TEORİ - kamu harcamaları sınıflandırma","yanilgi":"Bir harcamanın aynı anda iki farklı sınıflandırmada (ekonomik ve fonksiyonel) yer alamayacağını düşünürsün."},"A":{"gercek":"Fonksiyonel sınıflandırma harcamanın yöneldiği kamu hizmetine (savunma, sağlık, eğitim) göre yapılır.","ayirt":"Bu ölçüt \u0027kim yaptı\u0027 mı yoksa \u0027ne için yapıldı\u0027 mı sorusuna cevap veriyor?","paragraf":"TEORİ - kamu harcamaları sınıflandırma","yanilgi":"Fonksiyonel sınıflandırmanın kurumu değil hizmet alanını gösterdiğini gözden kaçırıp bu ifadeyi şüpheli görürsün."},"D":{"gercek":"Ekonomik sınıflandırma cari, yatırım (sermaye) ve transfer harcamaları olmak üzere üç ana gruba ayrılır.","ayirt":"Ekonomik sınıflandırmada kaç ana grup sayıyorum?","paragraf":"TEORİ - kamu harcamaları sınıflandırma","yanilgi":"Ekonomik sınıflandırmanın sadece cari-yatırım ikilisinden oluştuğunu düşünüp transferin ayrı bir grup olduğunu unutursun."},"B":{"gercek":"İdari (kurumsal) sınıflandırma yalnızca sorumlu kurumu gösterir, hizmet türünü göstermez.","ayirt":"Bu bilgi bana kurumu mu yoksa hizmeti mi anlatıyor?","paragraf":"TEORİ - kamu harcamaları sınıflandırma","yanilgi":"İdari sınıflandırmanın da hizmetin niteliğini gösterdiğini sanıp bu doğru ifadeyi yanlış işaretlersin."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 99"},"kural":"transfer harcaması, devletin karşılığında mal veya hizmet almadan satın alma gücünü karşılıksız aktardığı ödemedir; emekli aylığı bu tanımın klasik örneğidir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 99","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Harcamanın karşılığında bir mal/hizmet üretimi var mı diye sor; varsa reel (cari/yatırım), yoksa transfer harcamasıdır.","konu":"kamu harcamaları sınıflandırma","tablo":{"satirlar":[["A) Bir devlet hastanesinde çalışan hemşireye ödenen aylık m…","p.cari-yatirim","YANLIŞ ifade"],["B) Yeni bir devlet hastanesi binasının yapımı için müteahhi…","p.cari-yatirim","YANLIŞ ifade"],["C) Hastanede kullanılan tıbbi cihazların bakım ve onarımı i…","p.cari-yatirim","YANLIŞ ifade"],["D) Emekli olan bir kamu görevlisine her ay ödenen emekli ay…","p.transfer-siniflandirma","doğru ifade"],["E) Hastane için satın alınan yeni görüntüleme cihazının bed…","p.cari-yatirim","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Hastanede kullanılan tıbbi cihazların bakım ve onarımı için yapılan ödeme","E":"Hastane için satın alınan yeni görüntüleme cihazının bedeli","A":"Bir devlet hastanesinde çalışan hemşireye ödenen aylık maaş","D":"Emekli olan bir kamu görevlisine her ay ödenen emekli aylığı","B":"Yeni bir devlet hastanesi binasının yapımı için müteahhide ödenen inşaat bedeli"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - kamu harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok, analitik bütçe sınıflandırması 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu uygulamasıdır). TANIM VE KURAL: Kamu harcamaları üç temel ölçüte göre sınıflandırılır. (1) İDARİ (KURUMSAL) SINIFLANDIRMA: Harcamayı hangi kurumun yaptığına bakar (bakanlıklar, üniversiteler). Kimin sorumlu olduğunu gösterir, hizmetin niteliğini göstermez. (2) FONKSİYONEL (İŞLEVSEL) SINIFLANDIRMA: Harcamanın hangi kamu hizmetine yöneldiğine bakar; uluslararası standartta on ana işlev vardır: genel kamu hizmetleri, savunma, kamu düzeni ve güvenlik, ekonomik işler, çevre koruma, iskân ve toplum refahı, sağlık, dinlenme–kültür–din, eğitim, sosyal güvenlik ve sosyal yardım. (3) EKONOMİK SINIFLANDIRMA: Harcamanın ekonomiye etkisine bakar: cari harcamalar (personel, mal ve hizmet alımı), yatırım (sermaye) harcamaları, transfer harcamaları (cari ve sermaye transferleri), faiz giderleri, borç verme. Bir başka kesit REEL–TRANSFER ayrımıdır: reel harcamada devlet karşılığında mal veya hizmet alır (maaş, bina), transferde karşılıksız satın alma gücü aktarır (emekli aylığı, faiz, sübvansiyon). ANALİTİK BÜTÇE SINIFLANDIRMASI dört boyutu birlikte kullanır: kurumsal, fonksiyonel, finansman tipi (genel bütçe, özel bütçe, döner sermaye, dış proje kredisi gibi) ve ekonomik. KÜÇÜK ÖRNEK: Bir devlet hastanesinin hemşire maaşı: kurumsal olarak Sağlık Bakanlığı, fonksiyonel olarak sağlık, ekonomik olarak cari (personel) harcamadır; emekli aylığı ödemesi ekonomik olarak transferdir, fonksiyonel olarak sosyal güvenlik. SINAV TUZAĞI: (1) Fonksiyonel sınıflandırma \u0027ne için\u0027, ekonomik s…"},{"ad":"TEORI - kamu harcamalari siniflandirma (cari-yatirim)","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Ekonomik sınıflandırmada kamu harcamaları üç ana gruba ayrılır. CARİ HARCAMALAR: Kamu hizmetinin o yıl içinde üretilmesi için yapılan, faydası genellikle bir malî yılla sınırlı, TÜKETİM niteliğindeki harcamalardır: personel giderleri (maaş, ücret), sosyal güvenlik kurumuna devlet primi, mal ve hizmet alımları (kırtasiye, elektrik, kira, bakım). YATIRIM (SERMAYE) HARCAMALARI: Faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamalardır: bina, yol, baraj, makine ve teçhizat alımı, büyük onarım. TRANSFER HARCAMALARI: Karşılığında mal veya hizmet alınmayan, satın alma gücünün bir kesimden ötekine KARŞILIKSIZ aktarıldığı harcamalardır: emekli aylıkları, sosyal yardımlar, tarımsal destekler, sübvansiyonlar, borç faizi ödemeleri, KİT\u0027lere görev zararı ödemeleri. Cari ve yatırım harcamaları birlikte REEL (gerçek) HARCAMA sayılır; çünkü devlet karşılığında mal veya hizmet edinir ve millî gelire doğrudan katkı yapar. Transfer harcaması millî gelire doğrudan girmez, gelir dağılımını değiştirir. KÜÇÜK ÖRNEK: Bir okulun öğretmen maaşı cari, okul binasının yapımı yatırım, öğrencilere ödenen burs transferdir. Devletin iç borç faizi ödemesi transferdir. SINAV TUZAĞI: (1) Faiz ödemesi TRANSFER harcamasıdır; sınav bunu cari veya yatırım diye vermeye çalışır. (2) Eğitim ve sağlık harcamaları iktisadi anlamda \u0027beşeri sermaye yatırımı\u0027 sayılsa da bütçe sınıflandırmasında personel ve mal-hizmet kalemleri CARİdir. (3) Makine ve teçhizat alımı yatırım, aynı makinenin bakımı caridir; ancak ömrünü uzatan büyük onarım yatırım sayı…"}],"hakem":"Soru, kamu harcamalarının ekonomik sınıflandırmasında transfer harcaması tanımını ölçmektedir; emekli aylığı, karşılığında mal/hizmet alınmayan karşılıksız satın alma gücü aktarımı olarak kaynak metinde açıkça tanımlanmıştır."},"kayitlar":[],"sade":{"siklar":{"C":"Bakım ve onarım harcaması karşılığında hizmet alındığı için cari (mal ve hizmet alımı) harcamasıdır.","E":"Görüntüleme cihazı bedeli karşılığında devlet dayanıklı bir varlık edinir; bu yatırım harcamasıdır, transfer değildir.","A":"Hemşirenin maaşı devletin emek hizmeti karşılığında ödediği cari harcamadır; karşılıksız bir aktarım değildir.","B":"İnşaat bedeli karşılığında devlet bir bina (sermaye varlığı) edinir; bu yatırım harcamasıdır, transfer değildir."},"dogru":"Transfer harcaması, devlet karşılığında mal veya hizmet almadan satın alma gücünü karşılıksız aktarmasıdır. Emekli aylığı tam bu tanıma uyar: devlet emekliye para verir ama karşılığında üretim faktörü veya mal elde etmez.","sinav":"Transfer harcaması, devletin karşılığında mal veya hizmet almadan satın alma gücünü karşılıksız olarak aktardığı ödemelerdir.","kavramlar":[{"kaynak":"TEORI","tanim":"Devletin karşılığında mal veya hizmet almadan satın alma gücünü bir kesimden ötekine karşılıksız olarak aktarmasıdır.","ad":"Transfer harcaması"},{"kaynak":"TEORI","tanim":"Devletin karşılığında mal veya hizmet satın alarak millî gelire doğrudan katkı yapması; cari ve yatırım harcamalarını kapsar.","ad":"Reel harcama"},{"kaynak":"TEORI","tanim":"Faydası genellikle bir malî yılla sınırlı, tüketim niteliğindeki harcamalar; personel giderleri ve mal-hizmet alımlarını içerir.","ad":"Cari harcama"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/2","2018/2","2017/2"]},"oyun":null,"tip":"teori","soru":"Aşağıdaki kamu harcamalarından hangisi transfer harcaması niteliğindedir?","kayitBaslik":"","id":"sgs-t1-genel-maliye-kolay/kp-02","verilenler":[],"dayanak":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu - analitik bütçe ekonomik sınıflandırması; Teori Notu - kamu harcamalarının türleri","dogru":"D","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Ankara\u0027da bir devlet hastanesinde 2023 yılında dört farklı ödeme yapılıyor: hemşire maaşı, yeni bina inşaatı, cihaz bakımı ve emekli müdürün aylığı.","anlatim":"Hastane yönetimi bu dört ödemeyi bütçede nereye yazacağını soruyor. Sen de her birinin karşılığında bir mal veya hizmet alınıp alınmadığına bakacaksın.","doldur":[]},{"formul":"Ne yapacağız: transfer harcaması, karşılığında mal veya hizmet alınmadan yapılan karşılıksız aktarımdır; beş ödemeyi bu tanıma tek tek vuracağız.","anlatim":"Emekli aylığı mı, maaş mı, inşaat mı, bakım mı, cihaz alımı mı; hangisinde devlet karşılığında bir şey almıyor bulacağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.cari-yatirim","karar":"yanlış","anlatim":"Hastane bu ödeme karşılığında hemşirenin emeğini alıyor, yani bir hizmet ediniyor. Bu yüzden personel gideri cari harcamadır, transfer değildir.","formul":"Şık A: hemşireye ödenen maaşı transfer harcaması sayar mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.cari-yatirim","karar":"yanlış","anlatim":"Bina yapımı karşılığında hastane kalıcı bir varlık ediniyor, sermaye stoku artıyor. Bu yatırım harcamasıdır, transfer değildir.","formul":"Şık B: müteahhide ödenen inşaat bedelini transfer harcaması sayar mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.cari-yatirim","karar":"yanlış","anlatim":"Bakım karşılığında hastane bir hizmet alıyor, cihazı yeniden kullanılabilir hale getiriyor. Bu mal ve hizmet alımı olduğu için caridir, transfer değildir.","formul":"Şık C: cihaz bakım-onarım ödemesini transfer harcaması sayar mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.transfer-siniflandirma","karar":"doğru","anlatim":"Bu ödeme karşılığında bugün hastane hiçbir mal veya hizmet almıyor, sadece satın alma gücü aktarılıyor. Emekli aylığı tam da bu yüzden dolaysız transfer harcamasıdır.","formul":"Şık D: emekli müdüre ödenen aylığı transfer harcaması sayar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.cari-yatirim","karar":"yanlış","anlatim":"Bu para karşılığında hastane elde uzun ömürlü bir donanım tutuyor. Bu yatırım harcamasıdır, transfer değildir.","formul":"Şık E: yeni görüntüleme cihazının bedelini transfer harcaması sayar mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✓ E ✗","anlatim":"Tek doğru cevap emekli aylığıdır çünkü karşılığında hiçbir mal veya hizmet alınmıyor. Kendine hep şunu sor: bu ödeme karşılığında bugün bir şey üretiliyor mu, üretilmiyor mu?","doldur":[]}],"anahtar":[{"ornek":"karşılığında","kok":"karşıl"},{"ornek":"hizmet","kok":"hizmet"},{"ornek":"transfer","kok":"transf"},{"ornek":"harcamasıdır","kok":"harcam"},{"ornek":"hastane","kok":"hastan"},{"ornek":"aylığı","kok":"aylığı"}],"konuGiris":{"harita":"Hangi harcamanın transfer olduğu, karşılığında mal/hizmet alınıp alınmadığına bakılarak test edilir. Ekonomik sınıflandırma tablosunda cari, yatırım, transfer, faiz, borç verme kalemleri altında kaydedilir. Karşılıksız aktarım olup olmadığı örnek harcama listesi üzerinden değerlendirilir.","desen":"Sınav en çok faiz ödemesini transfer değil cari veya yatırım gibi göstererek tuzak kurar; oysa faiz her zaman transfer harcamasıdır. Ayrıca yatırım (bina, makine) ile transfer (burs, sübvansiyon) karıştırılır çünkü ikisi de büyük tutarlı görünebilir. Bu soru p.28 faiz-transfer ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Karşılığında mal veya hizmet alınmadan yapılan karşılıksız aktarım","ad":"Transfer harcaması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Devletin karşılığında mal veya hizmet edindiği harcama türü","ad":"Reel harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"O yıl içinde tüketilen personel ve mal-hizmet alım gideri","ad":"Cari harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Harcamanın ekonomiye etkisine göre yapılan gruplandırma türü","ad":"Ekonomik sınıflandırma","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Seçeneklerde beş farklı harcama türü verilir, sizden karşılığında mal/hizmet alınmayanı yani transfer olanı bulmanız istenir.","panel_ornek":"Anneni bir arkadaşına 50 lira borç verdiğini düşün, karşılığında ondan hiçbir şey almıyorsun, sadece parayı aktarıyorsun. Ama markete gidip 50 liraya ekmek alsan, karşılığında bir şey elde ediyorsun. İşte devlet de bazı ödemelerde (emekli maaşı gibi) karşılıksız para aktarır, bazılarında (maaş, bina gibi) karşılığında bir şey alır.","ornek":"Anneni bir arkadaşına 50 lira borç verdiğini düşün, karşılığında ondan hiçbir şey almıyorsun, sadece parayı aktarıyorsun. Ama markete gidip 50 liraya ekmek alsan, karşılığında bir şey elde ediyorsun. İşte devlet de bazı ödemelerde (emekli maaşı gibi) karşılıksız para aktarır, bazılarında (maaş, bina gibi) karşılığında bir şey alır.","yontemler":"Her seçenek için \u0027devlet bu ödeme karşılığında bir şey elde ediyor mu?\u0027 sorusunu sor; cevap hayırsa transferdir. Faiz, emekli aylığı, sübvansiyon, sosyal yardım hep transferdir; maaş, bina, makine hiçbir zaman transfer değildir.","nedir":"Bu konu devletin harcamalarını kurumuna, hizmet alanına ve ekonomiye etkisine göre nasıl ayırdığını anlatır. Sınav, karşılığında mal/hizmet alınmayan \u0027transfer\u0027 harcamayı diğerlerinden ayırt edip edemediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Bakım-Onarım Tuzağı","metin":"Onarım harcaması küçük ve tekrarlı olduğu için transfer sanılabilir. Doğrusu: karşılığında hizmet alındığından bu cari (mal ve hizmet alımı) harcamasıdır."},"E":{"ad":"Sermaye Malı Tuzağı","metin":"Cihaz bedelinin tek seferlik büyük bir ödeme olması transfer izlenimi verir. Doğrusu: karşılığında dayanıklı bir varlık (cihaz) edinildiği için bu yatırım (sermaye) harcamasıdır."},"A":{"ad":"Personel Maliyeti Tuzağı","metin":"Öğrenci hemşire maaşını devletin karşılıksız bir ödemesi sanır. Doğrusu: bu ödeme karşılığında emek hizmeti alındığından cari (gerçek) harcamadır, transfer değildir."},"B":{"ad":"Yatırım-Transfer Karışımı Tuzağı","metin":"İnşaat bedelinin devletten çıkan bir para olması onu transfer zannettirir. Doğrusu: karşılığında bina (sermaye varlığı) edinildiği için bu yatırım harcamasıdır."}},"celdiriciYol":{"C":"Bakım-onarımı süreklilik arz eden küçük ödeme sandığından transfer sayarsın (cari-transfer karışımı).","E":"Cihaz bedelini tek seferlik büyük ödeme olduğu için transfer sayarsın (yatırım-transfer karışımı).","A":"Personel maaşını \u0027devletten çıkan karşılıksız para\u0027 olarak okursan transfer sanırsın (cari-transfer karışımı).","B":"İnşaat bedelini büyük tutar olduğu için doğrudan transfer sayarsın (yatırım-transfer karışımı)."},"hap":"Karşılığında mal veya hizmet alınmadan yapılan karşılıksız ödemeler transfer harcamasıdır.","teshis":{"C":{"gercek":"Bakım-onarım hizmet alımıdır, karşılığında iş/hizmet edinildiği için mal ve hizmet alımı kalemiyle cari harcama sayılır; yalnız ömrü uzatan büyük onarım yatırım sayılır.","ayirt":"Bu ödeme mevcut bir varlığı yeniden mi kullanılır hale getiriyor, yoksa karşılığı yok mu?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","yanilgi":"Bakım-onarım gibi süreklilik arz eden küçük ödemeleri karşılıksız aktarım sanıyorsun."},"E":{"gercek":"Makine ve teçhizat alımı, sermaye stokunu artıran ve faydası uzun yıllara yayılan bir yatırım harcamasıdır, karşılığında somut bir donanım edinilir.","ayirt":"Bu para karşılığında elde tutulan, uzun ömürlü bir varlık var mı?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","yanilgi":"Tek seferlik büyük bir alım olduğu için bunu karşılıksız bir devlet yardımı gibi görüyorsun."},"A":{"gercek":"Cari harcama, kamu hizmetinin üretimi için o yıl yapılan tüketim harcamasıdır; personel gideri karşılığında emek hizmeti alındığından cari/reeldir.","ayirt":"Bu ödemenin karşılığında devlet bir emek veya mal hizmeti aldı mı?","paragraf":"Teori Notu - kamu harcamalarının türleri","yanilgi":"Devletten çıkan her düzenli ödemeyi transfer harcaması sanıyorsun."},"D":{"gercek":"Transfer harcaması, devletin karşılığında mal veya hizmet almadan satın alma gücünü karşılıksız aktardığı ödemedir; emekli aylığı tipik dolaysız transferdir.","ayirt":"Bu ödeme karşılığında bugün üretilen bir mal veya hizmet var mı?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Emekli aylığını da \u0027devlet bir çalışana ödeme yapıyor\u0027 diye cari harcama sanabilirsin, oysa karşılığında güncel bir hizmet üretimi yoktur."},"B":{"gercek":"Yatırım harcaması, faydası birden çok yıla yayılan ve sermaye stokunu artıran harcamadır; bina yapımı karşılığında somut bir varlık edinilir.","ayirt":"Bu harcama sonucunda devletin mülkiyetinde kalıcı bir varlık oluştu mu?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","yanilgi":"Büyük tutarlı bir ödemeyi otomatik olarak transfer harcaması kategorisine koyuyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 99"},"kural":"Faydası birden çok yıla yayılan ve sermaye stokunu artıran büyük onarım harcamaları ekonomik sınıflandırmada yatırım harcaması sayılır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 99","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıkta \u0027her durumda\u0027, \u0027doğrudan katkı yapar\u0027 gibi kesin ifadeler geçiyorsa önce istisnayı ara; ölçüt adlarını (idari/fonksiyonel/ekonomik) tanımlarıyla eşleştirerek çöz.","konu":"kamu harcamaları sınıflandırma","tablo":{"satirlar":[["A) Devletin ödediği iç borç faizi, ekonomik sınıflandırmada…","p.transfer-faiz","YANLIŞ ifade"],["B) Bir harcamanın hangi bakanlık tarafından yapıldığını gös…","p.idari-fonksiyonel","YANLIŞ ifade"],["C) Eğitim ve sağlık alanında yapılan harcamalar, beşeri ser…","p.cari-egitim-saglik","YANLIŞ ifade"],["D) Emekli aylığı ödemeleri, karşılığında üretim faktörü kul…","p.reel-transfer","YANLIŞ ifade"],["E) Bir kamu hastanesinde yapılan ve binanın ömrünü uzatan b…","p.yatirim-onarim","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Eğitim ve sağlık alanında yapılan harcamalar, beşeri sermayeye katkısı nedeniyle ekonomik sınıflandırmada her durumda yatırım harcaması olarak kabul edilir.","E":"Bir kamu hastanesinde yapılan ve binanın ömrünü uzatan büyük onarım harcaması, sermaye stokunu artırdığından yatırım harcaması sayılır.","A":"Devletin ödediği iç borç faizi, ekonomik sınıflandırmada cari harcama olarak kabul edilir.","D":"Emekli aylığı ödemeleri, karşılığında üretim faktörü kullanıldığından milli gelire doğrudan katkı yapan reel harcamadır.","B":"Bir harcamanın hangi bakanlık tarafından yapıldığını gösteren ayrım, fonksiyonel sınıflandırmadır."},"kaynak":{"alinti":"faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamalar: bina, yol, baraj, makine ve teçhizat alımı, büyük onarım","liste":[{"ad":"TEORI - kamu harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok, analitik bütçe sınıflandırması 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu uygulamasıdır). TANIM VE KURAL: Kamu harcamaları üç temel ölçüte göre sınıflandırılır. (1) İDARİ (KURUMSAL) SINIFLANDIRMA: Harcamayı hangi kurumun yaptığına bakar (bakanlıklar, üniversiteler). Kimin sorumlu olduğunu gösterir, hizmetin niteliğini göstermez. (2) FONKSİYONEL (İŞLEVSEL) SINIFLANDIRMA: Harcamanın hangi kamu hizmetine yöneldiğine bakar; uluslararası standartta on ana işlev vardır: genel kamu hizmetleri, savunma, kamu düzeni ve güvenlik, ekonomik işler, çevre koruma, iskân ve toplum refahı, sağlık, dinlenme–kültür–din, eğitim, sosyal güvenlik ve sosyal yardım. (3) EKONOMİK SINIFLANDIRMA: Harcamanın ekonomiye etkisine bakar: cari harcamalar (personel, mal ve hizmet alımı), yatırım (sermaye) harcamaları, transfer harcamaları (cari ve sermaye transferleri), faiz giderleri, borç verme. Bir başka kesit REEL–TRANSFER ayrımıdır: reel harcamada devlet karşılığında mal veya hizmet alır (maaş, bina), transferde karşılıksız satın alma gücü aktarır (emekli aylığı, faiz, sübvansiyon). ANALİTİK BÜTÇE SINIFLANDIRMASI dört boyutu birlikte kullanır: kurumsal, fonksiyonel, finansman tipi (genel bütçe, özel bütçe, döner sermaye, dış proje kredisi gibi) ve ekonomik. KÜÇÜK ÖRNEK: Bir devlet hastanesinin hemşire maaşı: kurumsal olarak Sağlık Bakanlığı, fonksiyonel olarak sağlık, ekonomik olarak cari (personel) harcamadır; emekli aylığı ödemesi ekonomik olarak transferdir, fonksiyonel olarak sosyal güvenlik. SINAV TUZAĞI: (1) Fonksiyonel sınıflandırma \u0027ne için\u0027, ekonomik s…"},{"ad":"TEORI - kamu harcamalari siniflandirma (cari-yatirim)","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Ekonomik sınıflandırmada kamu harcamaları üç ana gruba ayrılır. CARİ HARCAMALAR: Kamu hizmetinin o yıl içinde üretilmesi için yapılan, faydası genellikle bir malî yılla sınırlı, TÜKETİM niteliğindeki harcamalardır: personel giderleri (maaş, ücret), sosyal güvenlik kurumuna devlet primi, mal ve hizmet alımları (kırtasiye, elektrik, kira, bakım). YATIRIM (SERMAYE) HARCAMALARI: Faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamalardır: bina, yol, baraj, makine ve teçhizat alımı, büyük onarım. TRANSFER HARCAMALARI: Karşılığında mal veya hizmet alınmayan, satın alma gücünün bir kesimden ötekine KARŞILIKSIZ aktarıldığı harcamalardır: emekli aylıkları, sosyal yardımlar, tarımsal destekler, sübvansiyonlar, borç faizi ödemeleri, KİT\u0027lere görev zararı ödemeleri. Cari ve yatırım harcamaları birlikte REEL (gerçek) HARCAMA sayılır; çünkü devlet karşılığında mal veya hizmet edinir ve millî gelire doğrudan katkı yapar. Transfer harcaması millî gelire doğrudan girmez, gelir dağılımını değiştirir. KÜÇÜK ÖRNEK: Bir okulun öğretmen maaşı cari, okul binasının yapımı yatırım, öğrencilere ödenen burs transferdir. Devletin iç borç faizi ödemesi transferdir. SINAV TUZAĞI: (1) Faiz ödemesi TRANSFER harcamasıdır; sınav bunu cari veya yatırım diye vermeye çalışır. (2) Eğitim ve sağlık harcamaları iktisadi anlamda \u0027beşeri sermaye yatırımı\u0027 sayılsa da bütçe sınıflandırmasında personel ve mal-hizmet kalemleri CARİdir. (3) Makine ve teçhizat alımı yatırım, aynı makinenin bakımı caridir; ancak ömrünü uzatan büyük onarım yatırım sayı…"}],"hakem":"Soru kamu harcamaları ekonomik sınıflandırmasında büyük onarım harcamasının yatırım sayılmasını soruyor; kaynak metinde açıkça \u0027faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamalar: bina, yol, baraj, makine ve teçhizat alımı, büyük onarım\u0027 tanımı yer almakta ve aynı metinde \u0027makine ve teçhizat alımı yatırım, aynı makinenin bakımı caridir; ancak ömrünü uzatan büyük onarım yatırım sayılır\u0027 kural açıklanmıştır."},"kayitlar":[],"sade":{"siklar":{"C":"Eğitim ve sağlık alanındaki personel maaşları ve mal-hizmet alımları cari harcamadır. Yalnız bina ve donanım alımları yatırım sayılır.","E":"Büyük onarım harcaması sermaye stokunu artırdığından yatırım harcaması sayılır; bu cevap doğrudur.","A":"İç borç faizi her yıl düzenli ödenen bir gider gibi görünse de, karşılığında mal veya hizmet alınmadığından transfer harcamasıdır, cari değildir.","D":"Emekli aylığı karşılıksız satın alma gücü aktarımı olduğundan transfer harcamasıdır ve milli gelire doğrudan girmez, reel değildir.","B":"Harcamayı hangi kurumun yaptığını gösteren ayrım idari (kurumsal) sınıflandırmadır. Fonksiyonel sınıflandırma hizmetin türüne (sağlık, eğitim, savunma gibi) bakar."},"dogru":"Büyük onarım harcaması, binanın ömrünü uzatarak sermaye stokunu artırdığından yatırım harcaması sayılır. Rutin bakımdan farklı olarak faydası birden çok yıla yayılır. Bu nedenle E şıkkı doğrudur.","sinav":"Kamu Malî Yönetimi ve Kontrol Kanunu uygulamasında ekonomik sınıflandırmaya göre faydası birden çok yıla yayılan ve sermaye stokunu artıran büyük onarım harcamaları yatırım harcaması sayılır.","kavramlar":[{"kaynak":"TEORI","tanim":"Faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamalar; bina, yol, makine alımı ve büyük onarım bunlara dahildir.","ad":"Yatırım (sermaye) harcaması"},{"kaynak":"TEORI","tanim":"Karşılığında mal veya hizmet alınmayan, satın alma gücünün bir kesimden ötekine karşılıksız aktarıldığı harcamalar; emekli aylıkları, sosyal yardımlar ve borç faizi ödemeleri bunlara dahildir.","ad":"Transfer harcaması"},{"kaynak":"TEORI","tanim":"Kamu harcamasının ekonomiye etkisine bakarak sınıflandırılması; cari harcamalar, yatırım harcamaları, transfer harcamaları, faiz giderleri ve borç verme olarak ayrılır.","ad":"Ekonomik sınıflandırma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/2","2018/2","2017/2"]},"oyun":null,"tip":"teori","soru":"Kamu harcamalarının sınıflandırılmasına ilişkin aşağıdaki ifadelerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-a6-maliye-zor-r1/kp-03","verilenler":[],"dayanak":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu - analitik bütçe sınıflandırması uygulaması; öğreti - kamu harcamaları ekonomik/reel-transfer ayrımı","dogru":"E","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Sivas\u0027ta bir devlet hastanesinde 2023 yılında üç ayrı ödeme yapılıyor: 40 hemşirenin maaşı 3.000.000 lira, 15 yıllık iç borçlanmaya karşılık 500.000 lira faiz ödemesi ve çatısı akan, ömrünü 10 yıl uzatan bir onarım için 2.000.000 lira.","anlatim":"Bu üç ödeme aynı hastanede yapılıyor ama her biri farklı bir kutuya giriyor. Sen bu kutuları doğru yerleştirebiliyor musun, bunu göreceğiz.","doldur":[]},{"formul":"Ne yapacağız: Ekonomik sınıflandırmada üç kutu var, cari, yatırım, transfer; hastanenin maaşı cari, faiz transferdir, onarım ise ömür uzatıyorsa yatırımdır. Beş ifadeyi bu hastane olayının mantığıyla tek tek deneyeceğiz.","anlatim":"Kural tek: karşılığında mal veya hizmet alınıyor mu, yoksa sadece bir alacak mı kapatılıyor? Şimdi sırayla bakalım.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.transfer-faiz","karar":"yanlış","anlatim":"Faiz ödemesinde devlet karşılığında hiçbir mal veya hizmet almıyor, sadece bir borcu ödüyor. Bu yüzden faiz cari değil, transfer harcamasıdır.","formul":"Şık A: hastanenin muhasebecisi \u0027bu 500.000 liralık faiz ödemesini cari harcama olarak yazalım\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.idari-fonksiyonel","karar":"yanlış","anlatim":"Hangi bakanlığın harcadığı bilgisi kurumsal (idari) sınıflandırmadır, fonksiyonel değildir. Fonksiyonel sınıflandırma \u0027sağlık hizmeti\u0027 gibi hizmet alanını gösterir, kurumu değil.","formul":"Şık B: birisi \u0027hastanenin Sağlık Bakanlığı\u0027na bağlı olması, harcamanın fonksiyonel sınıflandırmasını gösterir\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.cari-egitim-saglik","karar":"yanlış","anlatim":"Beşeri sermaye kavramı iktisadi bir yorumdur, bütçe sınıflandırmasını değiştirmez. Hemşire maaşı personel gideridir, yani cari harcamadır, her durumda değil.","formul":"Şık C: biri \u0027hemşire maaşları beşeri sermayeye katkı sağladığı için yatırım harcamasıdır\u0027 diyor, buna imza atar mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.reel-transfer","karar":"yanlış","anlatim":"Emekli aylığında da hastanenin faiz ödemesinde olduğu gibi karşılığında mal veya hizmet alınmaz, üretim faktörü kullanılmaz. Bu yüzden emekli aylığı reel harcama değil, transfer harcamasıdır.","formul":"Şık D: biri \u0027emekli aylığı karşılığında üretim faktörü kullanıldığı için reel harcamadır\u0027 diyor, hastanenin faiz ödemesiyle aynı mantığı burada da kurar mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.yatirim-onarim","karar":"doğru","anlatim":"Bu onarım hastanenin sermaye stokunu artırıyor, sadece eski hâline getirmiyor, ömrünü uzatıyor. Bu yüzden büyük onarım yatırım harcamasıdır, bakım gideriyle karıştırma.","formul":"Şık E: muhasebeci \u0027çatı onarımı 10 yıl ömür uzattığı için bunu yatırım harcaması yazalım\u0027 diyor, onaylar mısın?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Hastane örneğinde tek doğru kutu, ömrünü uzatan onarımın yatırım sayılmasıydı. Kendine hep şunu sor: bu ödeme karşılığında bir mal veya hizmet alındı mı, yoksa sadece bir alacak mı kapatıldı?","doldur":[]}],"anahtar":[{"ornek":"harcamasıdır","kok":"harcam"},{"ornek":"hizmet","kok":"hizmet"},{"ornek":"onarım","kok":"onarım"},{"ornek":"karşılığında","kok":"karşıl"},{"ornek":"yatırım","kok":"yatırı"},{"ornek":"sadece","kok":"sadece"}],"konuGiris":{"harita":"Ne zaman test edilir: bir harcama örneği verilip \u0027bu hangi sınıflandırmaya girer\u0027 sorulduğunda. Nasıl ölçülür: örneğin kurumsal mı (kim), fonksiyonel mi (ne için), ekonomik mi (ne tür etki) olduğu doğru eşleştirilir mi diye. Nasıl kaydedilir: analitik bütçe sınıflandırmasında kurumsal, fonksiyonel, finansman tipi ve ekonomik kod birlikte kaydedilir.","desen":"Sınav genelde bir harcama örneği (maaş, faiz, bina yapımı gibi) verip hangi sınıflandırmaya girdiğini sorar; tuzak, faiz ödemesini reel harcama gibi göstermeye çalışmaktır (p.savunma/eğitim örneği). İkinci tuzak, eğitim-sağlık harcamalarını \u0027yatırım\u0027 sayıp personel giderini cari saymamaktır. Bu soru fonksiyonel-ekonomik-kurumsal sınıflandırmaların çaprazlanması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Harcamayı yapan kurumu gösterir, hizmetin niteliğini göstermez","ad":"İdari (kurumsal) sınıflandırma","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Harcamanın yöneldiği kamu hizmeti alanını gösterir (eğitim, sağlık gibi)","ad":"Fonksiyonel sınıflandırma","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Harcamanın cari, yatırım veya transfer türünde olduğunu gösterir","ad":"Ekonomik sınıflandırma","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Karşılığında mal veya hizmet alınmadan yapılan karşılıksız aktarma","ad":"Transfer harcaması","kim":"kanun sabitler"}],"sinavda":"Bir harcama türü ya da örnek verilir, bunun hangi sınıflandırmaya (idari/fonksiyonel/ekonomik) ait olduğu ya da doğru/yanlış ifadenin hangisi olduğu sorulur.","panel_ornek":"Bir aile ayda 3 kez para harcar diyelim: 50 lira market (tüketim), 20 lira çocuğun okul kitabı için (amaç), 10 lira da geçen ay aldığı borcun faizi (karşılıksız aktarma). Aynı 3 harcamayı \u0027kim yaptı, ne için yaptı, ne tür etki yaptı\u0027 diye üç farklı şekilde sorabilirsin. Devlet bütçesi de böyle üç farklı gözlükle bakılarak sınıflanır.","ornek":"Bir aile ayda 3 kez para harcar diyelim: 50 lira market (tüketim), 20 lira çocuğun okul kitabı için (amaç), 10 lira da geçen ay aldığı borcun faizi (karşılıksız aktarma). Aynı 3 harcamayı \u0027kim yaptı, ne için yaptı, ne tür etki yaptı\u0027 diye üç farklı şekilde sorabilirsin. Devlet bütçesi de böyle üç farklı gözlükle bakılarak sınıflanır.","yontemler":"Tek kritik kural: \u0027kim yaptı\u0027 idari, \u0027ne için\u0027 fonksiyonel, \u0027ne tür etki\u0027 ekonomiktir; faiz her zaman transferdir, reel değildir.","nedir":"Kamu harcamaları sınıflandırması, devletin yaptığı harcamaların kim tarafından, hangi amaçla ve ne tür etki için yapıldığını gösteren üç ayrı bakış açısıdır. Sınav bu üç bakış açısını (idari, fonksiyonel, ekonomik) birbirine karıştırıp karıştırmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Aşırı Genelleme Tuzağı","metin":"Eğitim ve sağlığın iktisadi anlamda \u0027beşeri sermaye yatırımı\u0027 sayılmasını, bütçe sınıflandırmasında da hep yatırım kabul edilir şeklinde genişletirsin. Doğrusu: Bu alanlardaki personel ve mal-hizmet alımı kalemleri caridir, yalnız bina-donanım gibi kalemler yatırımdır."},"A":{"ad":"Cari-Transfer Karıştırma Tuzağı","metin":"Faizi personel veya mal-hizmet gideri gibi düzenli bir ödeme olduğu için cari sanırsın. Doğrusu: İç borç faizi karşılığında mal veya hizmet alınmadığından ekonomik sınıflandırmada transfer harcamasıdır."},"D":{"ad":"Reel-Transfer Karıştırma Tuzağı","metin":"Devlet parayı ödediği için karşılığında bir şey aldığını, dolayısıyla reel harcama olduğunu düşünürsün. Doğrusu: Emekli aylığı karşılıksız satın alma gücü aktarımıdır, transfer harcamasıdır ve milli gelire doğrudan girmez."},"B":{"ad":"Ölçüt Karıştırma Tuzağı","metin":"\u0027Kim yaptı\u0027 sorusunu fonksiyonel sınıflandırmanın konusu sanırsın. Doğrusu: Harcamayı yapan kurumu gösteren ayrım idari (kurumsal) sınıflandırmadır, fonksiyonel sınıflandırma hizmetin türüne bakar."}},"celdiriciYol":{"D":"Ödeme fiilen yapıldığı için karşılığında üretim faktörü kullanıldığı varsayılır (Reel-Transfer Karıştırma Tuzağı - doğrusu transfer harcamasıdır)","A":"Faiz düzenli ödeme olduğundan mal-hizmet alımı gibi cari harcama sayılır (Cari-Transfer Karıştırma Tuzağı - doğrusu transfer harcamasıdır)","C":"Eğitim ve sağlığın iktisadi faydası bütçe kategorisiyle eşleştirilir (Aşırı Genelleme Tuzağı - doğrusu personel/mal-hizmet kalemleri caridir)","B":"Harcamayı yapan kurum bilgisi hizmet alanı bilgisiyle eşleştirilir (Ölçüt Karıştırma Tuzağı - doğrusu idari/kurumsal sınıflandırmadır)"},"hap":"Karşılığında mal veya hizmet alınıp alınmadığına bakılır: alınıyorsa reel (cari ya da yatırım), alınmıyorsa transfer harcamasıdır; sermaye stokunu artıran her onarım ve inşa yatırımdır.","teshis":{"D":{"gercek":"Reel harcamada devlet mal veya hizmet satın alıp üretim faktörü kullanır ve bu tutar milli gelire doğrudan girer; emekli aylığında karşılığında üretim yoktur, sadece satın alma gücü aktarılır.","ayirt":"Bu ödeme karşılığında bir mal veya hizmet üretimi gerçekleşti mi, yoksa sadece gelir mi el değiştirdi?","paragraf":"Reel-transfer harcama ayrımı","yanilgi":"Devlet parayı fiilen ödediği için bunun karşılığında bir üretim faktörü kullanıldığını, dolayısıyla reel harcama olduğunu düşünüyorsun."},"E":{"gercek":"Bakım-onarımın büyük çoğunluğu caridir ancak varlığın ömrünü uzatan/kapasitesini artıran büyük onarım, sermaye stokunu artırdığı için yatırım harcamasıdır.","ayirt":"Bu harcama sadece varlığı eski haline mi getiriyor, yoksa ömrünü/kapasitesini mi artırıyor?","paragraf":"Ekonomik sınıflandırma - yatırım harcamaları","yanilgi":"Onarım harcamasının hep cari (bakım-onarım) gideri olduğunu, hiçbir onarımın yatırım sayılamayacağını düşünüp bu şıkkı elersin."},"A":{"gercek":"Ekonomik sınıflandırmada faiz ödemesi, karşılığında mal veya hizmet alınmadığı için transfer harcamasıdır; cari harcama karşılığında tüketim malı veya hizmet alınan harcamadır.","ayirt":"Bu ödeme karşılığında devlet bir mal veya hizmet mi satın aldı, yoksa sadece bir alacağı mı ödedi?","paragraf":"Ekonomik sınıflandırma - transfer harcamaları","yanilgi":"Faizi düzenli tekrar eden bir ödeme olduğu için personel veya mal-hizmet gideri gibi cari harcama sanıyorsun."},"C":{"gercek":"Bütçe sınıflandırmasında eğitim ve sağlığın personel ve mal-hizmet alımı kalemleri caridir; yalnız okul/hastane binası, donanım gibi kalemler yatırım harcamasıdır.","ayirt":"Bu tutar bir maaş/kırtasiye gideri mi, yoksa bina/donanım gibi kalıcı bir varlık mı yaratıyor?","paragraf":"Ekonomik sınıflandırma - cari/yatırım ayrımı","yanilgi":"Eğitim ve sağlığın ekonomik faydasını (beşeri sermaye) bütçe sınıflandırmasındaki \u0027yatırım\u0027 kategorisiyle aynı şey sanıp bu alandaki her harcamayı yatırım sayıyorsun."},"B":{"gercek":"İdari (kurumsal) sınıflandırma harcamayı yapan kurumu gösterir; fonksiyonel sınıflandırma harcamanın hangi hizmet alanına (savunma, eğitim, sağlık vb.) yöneldiğini gösterir.","ayirt":"Soru \u0027kim yaptı\u0027 mı yoksa \u0027ne için yapıldı\u0027 mı diye mi soruyor?","paragraf":"Analitik bütçe sınıflandırması - idari/fonksiyonel ayrımı","yanilgi":"Sınıflandırma ölçütlerinin isimlerini birbirine karıştırıp \u0027kim yaptı\u0027 sorusunu fonksiyonel sınıflandırmaya bağlıyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 99"},"kural":"ekonomik sınıflandırmada personel giderleri cari harcama grubuna girer, çünkü hizmet o yıl içinde üretilir ve karşılığında üretim faktörü (emek) kullanılmıştır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 99","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Soru kökünde \u0027ekonomik sınıflandırma\u0027 geçiyorsa şıklardaki fonksiyonel ve kurumsal ifadeleri hemen ele, geriye cari-yatırım-transfer üçlüsü kalır.","konu":"kamu harcamaları sınıflandırma","tablo":{"satirlar":[["A) Cari harcama","p.28","doğru ifade"],["B) Yatırım (sermaye) harcaması","p.28","YANLIŞ ifade"],["C) Transfer harcaması","p.22","YANLIŞ ifade"],["D) Fonksiyonel sınıflandırmada sağlık hizmeti harcaması","p.28(fonksiyonel)","YANLIŞ ifade"],["E) Kurumsal (idari) sınıflandırmada Sağlık Bakanlığı harcam…","p.28(kurumsal)","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Transfer harcaması","E":"Kurumsal (idari) sınıflandırmada Sağlık Bakanlığı harcaması","A":"Cari harcama","D":"Fonksiyonel sınıflandırmada sağlık hizmeti harcaması","B":"Yatırım (sermaye) harcaması"},"kaynak":{"alinti":"","liste":[{"ad":"Teori Notu - kamu harcamalari","metin":"Tetikte Teori Notu (maliye literatürünün yerleşik tanımı): Kamu harcamaları ekonomik ayrımda cari (personel, mal-hizmet alımı), yatırım (sermaye oluşumu) ve transfer (karşılıksız aktarım: emekli aylığı, sosyal yardım, faiz, sübvansiyon) harcamalarıdır; transferler GSYH\u0027ye doğrudan katma değer yazmaz. Reel harcama kaynak kullanır, transfer satın alma gücünü yeniden dağıtır. Kamu harcamalarının sürekli artışını Wagner kanunu (gelişmeyle birlikte kamu faaliyeti genişler) ve Peacock-Wiseman sıçrama tezi (savaş/kriz sonrası harcama eski düzeye inmez) açıklar. Tam kamusal mal iki özellik taşır: tüketimde RAKİPSİZLİK (birinin tüketimi diğerini azaltmaz) ve DIŞLANAMAZLIK (bedel ödemeyen engellenemez) — milli savunma tipik örnektir; bedavacılık (free-rider) sorunu yüzünden piyasa üretemez, devlet üstlenir. Yarı kamusal mallar (eğitim, sağlık) hem kişisel hem toplumsal fayda (pozitif dışsallık) doğurur. Dışsallık, bir birimin faaliyetinin fiyat mekanizması dışında üçüncü kişileri etkilemesidir; negatif dışsallık (kirlilik) vergiyle (Pigou vergisi), pozitif dışsallık sübvansiyonla içselleştirilir. Erdemli mal, devletin tüketimini özendirdiği maldır."},{"ad":"Teori Notu - kamu harcamalarinin turleri","metin":"Tetikte Teori Notu (maliye teorisi - kamu harcamaları sınıflandırması): Kamu harcamaları en temelde gerçek (reel) harcamalar ve transfer harcamaları olarak ikiye ayrılır; fark, karşılık ilişkisindedir. Gerçek harcamada devlet bir mal veya hizmet satın alır, karşılığında üretim faktörü kullanılmış olur ve bu tutar milli gelir hesaplarına doğrudan girer; memur maaşı, okul inşaatı için ödenen bedel, kırtasiye alımı bu türdendir. Transfer harcamasında ise karşılıksız bir satın alma gücü aktarımı vardır, üretim gerçekleşmez; emekli aylığı, sosyal yardım, iç borç faiz ödemesi, ihracat teşviki bu gruba girer ve milli gelire doğrudan katkısı yoktur, sadece gelir dağılımını değiştirir. Küçük bir örnekle: devlet 100 birim karşılığında yol yapım hizmeti satın alırsa bu tutar milli gelir hesabına girer; aynı devlet 100 birim emekli aylığı öderse bu tutar milli gelire doğrudan girmez, çünkü karşılığında üretim yoktur. Bütçe sınıflandırması açısından harcamalar cari, yatırım ve transfer olmak üzere üçe ayrılır; cari harcama personel giderleri ile mal-hizmet alımlarını, yatırım harcaması sermaye ve altyapı oluşturan bina-yol-baraj gibi kalemleri, transfer harcaması ise karşılıksız ödemeleri kapsar. Cari harcama ile gerçek harcama sık karıştırılır; cari bir bütçe kategorisidir, gerçek ise iktisadi bir niteliktir, cari harcamaların büyük bölümü gerçek harcamadır ama tüm gerçek harcamalar cari değildir, yatırım harcaması da gerçek harcama sayılır. Verimli-verimsiz tartışmasında klasik görüş, üretime doğrudan katkı sağlamayan transfer harcamalarını verimsiz, mal-hizmet üretimine dönüşen gerçe…"}],"hakem":"Hemşire maaşı kamu harcamalarının ekonomik sınıflandırmasında cari harcama grubuna girer; kaynak metni personel giderlerinin cari harcama olduğunu açıkça desteklemektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Transfer harcamada devlet karşılıksız satın alma gücü aktarır (emekli aylığı, sosyal yardım gibi). Hemşire maaşı ise karşılığında emek hizmeti alındığı için reel harcamadır, transfer değildir.","E":"Kurumsal sınıflandırma harcamayı yapan kurumu (Sağlık Bakanlığı) gösterir, sorumluluğu belirtir. Harcamanın ekonomik türünü (cari, yatırım, transfer) göstermez.","D":"Fonksiyonel sınıflandırma harcamanın hangi kamu hizmetine yöneldiğini gösterir; sağlık alanına mı, eğitime mi sorunu cevaplar. Soru ekonomik sınıflandırmayı soruyor, bunlar farklı boyutlardır.","B":"Yatırım harcaması bina, yol, baraj gibi depolayıcı sermaye varlıkları edinimini kapsar. Hemşire maaşı karşılığında maddi bir varlık oluşmaz, bu yüzden yatırım değildir."},"dogru":"Hemşire maaşı cari harcamadır, çünkü devlet hemşirenin emeğini karşılığında satın alır ve bu hizmet o yıl içinde üretilir. Cari harcamalar kamu hizmetinin yıllık işletme maliyetini oluşturur.","sinav":"Kamu Malî Yönetimi ve Kontrol Kanunu uygulamasındaki ekonomik sınıflandırmada personel giderleri cari harcama grubuna girer.","kavramlar":[{"kaynak":"TEORI","tanim":"Kamu hizmetinin o yıl içinde üretilmesi için yapılan, faydası genellikle bir malî yılla sınırlı harcamalar; personel giderleri, mal ve hizmet alımlarını kapsar.","ad":"Cari harcama"},{"kaynak":"TEORI","tanim":"Devlet karşılığında mal veya hizmet aldığı, üretim faktörü kullandığı ve milli gelire doğrudan katkı yapan harcama; cari ve yatırım harcamaları reel harcamadır.","ad":"Reel harcama"},{"kaynak":"TEORI","tanim":"Karşılığında mal veya hizmet alınmayan, satın alma gücünün karşılıksız olarak bir kesimden ötekine aktarıldığı harcamalar; emekli aylıkları, sosyal yardımlar, faiz ödemeleri buna örnek.","ad":"Transfer harcama"},{"kaynak":"TEORI","tanim":"Kamu harcamalarının ekonomiye etkisine göre ayrılması; cari harcama, yatırım harcaması, transfer harcaması, faiz giderleri, borç verme kategorilerine göre sınıflandırılır.","ad":"Ekonomik sınıflandırma"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[],"donemler":["2025/2","2018/2","2017/2"]},"oyun":null,"tip":"teori","soru":"Bir devlet hastanesinde görev yapan hemşireye o yıl içinde ödenen maaş tutarı, kamu harcamalarının ekonomik sınıflandırmasında aşağıdaki gruplardan hangisine girer?","kayitBaslik":"","id":"sgs-gk-pilot2-maliye-kolay/kp-01","verilenler":[],"dayanak":"TEORİ - kamu harcamaları sınıflandırma (ekonomik sınıflandırma; 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu uygulaması)","dogru":"A","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: bir belediye hastanesinde çalışan hemşire Ayşe Hanım\u0027a 2023 yılında toplam 480.000 TL maaş ödendi.","anlatim":"Bu para her ay düzenli çıktı, karşılığında hemşire hizmet üretti. Şimdi bu ödemenin ekonomik sınıflandırmadaki yerini bulacağız.","doldur":[]},{"formul":"Ne yapacağız: 480.000 TL\u0027lik bu ödemeyi cari, yatırım, transfer, fonksiyonel ve kurumsal kutulardan hangisine koyacağımıza bakacağız.","anlatim":"Kural şu: personel gideri karşılığında emek kullanılmışsa cari harcamadır, karşılıksızsa transferdir, bina-yol gibi sermaye oluşturuyorsa yatırımdır. Şimdi beş ifadeyi bu 480.000 TL üzerinde tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.28","karar":"doğru","anlatim":"Ayşe Hanım karşılığında emek verdi, hizmet o yıl tüketildi, sermaye oluşmadı. Personel gideri cari harcama grubuna girer.","formul":"Şık A: bu 480.000 TL\u0027yi cari harcama kutusuna mı koyarsın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.28","karar":"yanlış","anlatim":"Yatırım, bina-yol-baraj gibi sermaye oluşturan kalemler içindir; maaş ödemesi hiçbir kalıcı varlık oluşturmaz. Bu yüzden yatırım harcaması diyemezsin.","formul":"Şık B: müdür \u0027bu maaşı yatırım harcaması yazalım\u0027 derse kabul eder misin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.22","karar":"yanlış","anlatim":"Transferde karşılığında hiçbir emek veya mal yoktur, oysa burada hemşire fiilen çalışmış, hizmet üretmiştir. Karşılığı olan ödeme transfer değil gerçek harcamadır.","formul":"Şık C: birisi \u0027bu maaş karşılıksız bir transfer, çünkü hastane parası devletten geliyor\u0027 derse ona katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.28(fonksiyonel)","karar":"yanlış","anlatim":"Bu ifade doğru bilgi ama soru ekonomik sınıflandırmayı, yani harcamanın türünü sordu. Doğru cümle yanlış kutuya cevap verir, o yüzden bu şık soruyu karşılamaz.","formul":"Şık D: \u0027bu ödeme fonksiyonel sınıflandırmada sağlık hizmeti harcamasıdır\u0027 desen bu cevap soruya uyar mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.28(kurumsal)","karar":"yanlış","anlatim":"Bu da doğru bir gözlem ama soru \u0027kim ödedi\u0027 değil \u0027ne tür ödeme\u0027 diye sordu. Kurumsal sınıflandırma harcamayı yapan kurumu gösterir, ekonomik niteliğini göstermez.","formul":"Şık E: \u0027bu ödeme kurumsal sınıflandırmada Sağlık Bakanlığı harcamasıdır\u0027 desen olur mu?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Hemşirenin maaşı emek karşılığı ödendiği ve o yıl tüketildiği için cari harcamadır, gerisi başka sınıflandırma sorularına cevap verir. Kendine hep şunu sor: bu ödeme sonucunda yeni bir varlık mı oluştu, karşılıksız mı verildi, yoksa emek mi kullanıldı?","doldur":[]}],"anahtar":[{"ornek":"karşılıksız","kok":"karşıl"},{"ornek":"harcama","kok":"harcam"},{"ornek":"sınıflandırmada","kok":"sınıfl"},{"ornek":"hizmet","kok":"hizmet"},{"ornek":"ekonomik","kok":"ekonom"},{"ornek":"oluşturan","kok":"oluştu"}],"konuGiris":{"harita":"Ne zaman test edilir: bir kamu görevlisine yapılan ödemenin hangi harcama grubuna girdiği sorulduğunda. Nasıl ölçülür: ödemenin bir hizmet karşılığı mı yoksa karşılıksız bir aktarım mı olduğuna bakılarak. Nasıl kaydedilir: bütçede cari, yatırım ya da transfer başlıklarından birinin altında sınıflandırılarak.","desen":"Sınav genelde bir meslek grubuna (hemşire, memur, öğretmen) ödenen maaşı vererek bunun transfer mi cari mi olduğunu sorar; tuzak, maaşın karşılıksız bir yardım gibi algılanıp transfer sanılmasıdır. Oysa maaş bir hizmetin karşılığıdır, dolayısıyla gerçek ve cari harcamadır. Bu soru cari-gerçek harcama ile transfer harcamasının karıştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Personel giderleri ile mal-hizmet alımlarını kapsayan bütçe kategorisi","ad":"Cari harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Karşılığında üretim faktörü kullanılan, milli gelire doğrudan giren harcama","ad":"Gerçek (reel) harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Karşılıksız satın alma gücü aktarımı, üretim gerçekleşmez","ad":"Transfer harcaması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Kamu çalışanına hizmeti karşılığında ödenen maaş tutarı","ad":"Personel gideri","kim":"işletme yönetimi tahmin eder ya da belirler"}],"sinavda":"Bir kamu görevlisine ödenen maaşın hangi ekonomik harcama grubuna girdiği sorulur, işlem yapılmaz sadece kavram sınıflandırması istenir.","panel_ornek":"Bir markette kasada çalışan komşun her ay 15 bin lira maaş alıyor; bu maaş onun ürettiği hizmetin karşılığı, yani gerçek bir emek karşılığı ödeme. Buna karşılık dedesine bağlanan 5 bin liralık emekli maaşı hiçbir hizmet karşılığı değil, sadece bir gelir aktarımı. İşte bu ikisi arasındaki fark, kamu harcamalarının sınıflandırılmasındaki mantığın aynısı.","ornek":"Bir markette kasada çalışan komşun her ay 15 bin lira maaş alıyor; bu maaş onun ürettiği hizmetin karşılığı, yani gerçek bir emek karşılığı ödeme. Buna karşılık dedesine bağlanan 5 bin liralık emekli maaşı hiçbir hizmet karşılığı değil, sadece bir gelir aktarımı. İşte bu ikisi arasındaki fark, kamu harcamalarının sınıflandırılmasındaki mantığın aynısı.","yontemler":"Kritik kural: ödeme bir hizmet karşılığıysa cari/gerçek harcamadır, karşılıksızsa transferdir; maaş her zaman hizmet karşılığı olduğu için cari harcama grubuna girer.","nedir":"Kamu harcamaları sınıflandırması, devletin yaptığı harcamaların ekonomik niteliğine göre gruplandırılmasıdır. Sınav bir harcama kaleminin cari, yatırım ya da transfer grubundan hangisine girdiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Reel-Transfer Karıştırması Tuzağı","metin":"öğrenci devletin yaptığı her ödemeyi transfer zanneder. Doğrusu: maaş karşılığında hemşirenin emek hizmeti alınır, bu reel (gerçek) harcamadır; transfer emekli aylığı gibi karşılıksız aktarımlarda görülür."},"E":{"ad":"İdari Sınıflandırma Karıştırması Tuzağı","metin":"öğrenci \u0027hangi kurum öder\u0027 sorusuyla \u0027ne tür harcama\u0027 sorusunu karıştırır. Doğrusu: kurumsal sınıflandırma sorumlu kurumu gösterir, harcamanın ekonomik niteliğini göstermez."},"D":{"ad":"Sınıflandırma Türü Karıştırması Tuzağı","metin":"öğrenci \u0027sağlık hizmeti\u0027 ifadesini görünce ekonomik sınıflandırmayı fonksiyonel sınıflandırmayla karıştırır. Doğrusu: hizmetin hangi alana yöneldiği fonksiyonel sınıflandırmanın konusudur, soru ekonomik sınıflandırmayı sormaktadır."},"B":{"ad":"Yatırım Tuzağı","metin":"öğrenci kamu hizmeti için yapılan her ödemeyi sermaye oluşumu sanır. Doğrusu: yatırım harcaması bina-yol gibi sermaye varlığı edinimini kapsar, maaş ödemesi sermaye oluşturmaz, cari harcamadır."}},"celdiriciYol":{},"hap":"Ekonomik sınıflandırmada personel ve mal-hizmet alımı cari, sermaye oluşturan harcama yatırım, karşılıksız aktarım transfer harcamasıdır; fonksiyonel \u0027ne için\u0027, kurumsal \u0027kim\u0027 sorusuna cevap verir.","teshis":{"C":{"gercek":"Reel harcamada devlet karşılığında üretim faktörü (burada emek) kullanır; transfer ise emekli aylığı, faiz gibi karşılıksız satın alma gücü aktarımıdır.","ayirt":"Bu ödemenin karşılığında devlete sunulan bir emek veya mal var mı?","paragraf":"TEORİ - kamu harcamalarinin turleri","yanilgi":"Devletin yaptığı ödemede karşılığında somut bir mal teslimi görmediğin için bunu karşılıksız transfer sanıyorsun."},"E":{"gercek":"Kurumsal (idari) sınıflandırma harcamayı yapan kurumu gösterir (Sağlık Bakanlığı), harcamanın ekonomik niteliğini göstermez; soru ekonomik sınıflandırmayı sormaktadır.","ayirt":"Soru \u0027kim ödedi\u0027 mi yoksa \u0027ne tür bir ödeme\u0027 mi diye soruyor?","paragraf":"TEORİ - kamu harcamalari siniflandirma","yanilgi":"\u0027Devlet hastanesi\u0027 ifadesini görünce sorunun hangi kurumun harcadığını sorduğunu sanıyorsun."},"A":{"gercek":"Ekonomik sınıflandırmada personel giderleri ve mal-hizmet alımları cari harcama grubunu oluşturur; bu, teori notundaki temel üçlü ayrımın ilk unsurudur.","ayirt":"Bu ödeme o yıl tüketilen bir hizmet için mi yapıldı, yoksa kalıcı bir varlık mı oluşturdu?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (ekonomik sınıflandırma)","yanilgi":"Bu şıkkı eleyen öğrenci, personel giderinin de bir kamu hizmeti karşılığı olduğu için ayrı bir kategoriye girmesi gerektiğini düşünür."},"D":{"gercek":"Fonksiyonel sınıflandırma hizmetin hangi alana yöneldiğini (sağlık, eğitim) gösterir; soru ise ekonomik sınıflandırmayı, yani harcamanın türünü (cari/yatırım/transfer) sormaktadır.","ayirt":"Soru \u0027hangi hizmet için\u0027 mi yoksa \u0027ne tür bir harcama\u0027 mı diye soruyor?","paragraf":"TEORİ - kamu harcamalari siniflandirma","yanilgi":"\u0027Sağlık\u0027 kelimesini görünce sorunun fonksiyonel sınıflandırmayı sorduğunu sanıyorsun."},"B":{"gercek":"Yatırım harcaması sermaye/altyapı oluşturan bina-yol-baraj gibi kalemleri kapsar; maaş ödemesi sermaye oluşturmaz.","ayirt":"Bu ödeme sonucunda devletin bilançosuna yeni bir fiziki varlık girdi mi?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","yanilgi":"Kamu tarafından yapılan her harcamayı, hizmet kamusal olduğu için otomatik olarak yatırım sanıyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 96"},"kural":"Yön Tersine Çevirme Tuzağı: öğrenci dolaysız vergilerin de fiyata gömülü olabileceğini karıştırıp bu ifadeyi doğru sanır. Doğrusu: dolaysız vergiler doğrudan hissedildiği için mali anesteziye dolaylı vergilerden DAHA AZ uygundur; ifade yön olarak tersine çevrilmiştir, yanlış şık budur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 96","sonDonem":0,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Mali anestezi sorularında hep \u0027dolaylı vergi = daha uygun, dolaysız vergi = daha az uygun\u0027 yönünü kontrol et; ters çevrilmiş cümle yanlış şıktır.","konu":"mali anestezi","tablo":null,"siklar":{"C":"Kaynakta kesinti yöntemi, mükellefin vergiye karşı tepkisini azaltarak mali anesteziyi güçlendirir.","E":"Mali sürüklenme, mükelleflerin enflasyon nedeniyle üst gelir dilimlerine kaymasını ifade eder ve mali anesteziden farklı bir kavramdır.","A":"Mali anestezi, mükellefin ödediği vergiyi hissetmeden ödemesi durumunu ifade eder.","D":"Dolaysız vergiler, mükellef tarafından doğrudan hissedildiği için mali anesteziye dolaylı vergilerden daha uygundur.","B":"Dolaylı vergiler fiyata gömülü olduğundan mali anesteziye dolaysız vergilere göre daha uygundur."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Kamu harcamalarinin artis nedenleri ve mali anestezi","metin":"TEORİ (maliye; mevzuat maddesi yok). KAMU HARCAMALARININ ARTIŞI: GÖRÜNÜŞTE artış nedenleri — para değerinin düşmesi (enflasyon), bütçe tekniğindeki değişme (safi bütçeden gayri safi bütçeye geçiş), ülke sınırlarının ve nüfusun büyümesi, aynı ekonomiden parasal ekonomiye geçiş; GERÇEK artış nedenleri — askeri harcamalar, teknolojik gelişme, sosyal devlet anlayışı, kentleşme, nüfus artışı ve yaşlanması, devletin ekonomik faaliyet alanının genişlemesi. WAGNER KANUNU (kamu harcamalarının artışı kanunu): gelir arttıkça kamu harcamaları gelirden HIZLI artar (kamu hizmetleri gelir esnekliği \u003e 1 olan üstün mallardır). PEACOCK-WİSEMAN SIÇRAMA (yer değiştirme) TEZİ: harcamalar düz artmaz; savaş-kriz gibi olağanüstü dönemlerde vergi tahammül düzeyi yükselir, harcamalar sıçrar ve kriz bitince eski düzeye inmez (yer değiştirme + inceleme etkisi + yoğunlaşma etkisi). Baumol\u0027un maliyet hastalığı: verimliliği artmayan kamu hizmetlerinde ücretler özel sektörle birlikte artınca birim maliyet yükselir. MALİ ANESTEZİ (vergi uyuşturması): mükellefin vergiyi hissetmeden ödemesi — fiyata gömülü dolaylı vergiler (KDV, ÖTV) ve kaynakta kesinti; vergiye tepkiyi azaltır. MALİ SÜRÜKLENME (fiscal drag): enflasyonla nominal gelirler artınca mükelleflerin artan oranlı tarifede üst dilimlere kayması ve reel vergi yükünün kanun değişmeden artması; çözümü dilimlerin enflasyona endekslenmesidir. MALİ RANT: enflasyonun devlet borcunun reel değerini eritmesi. SINAV TUZAĞI: (1) Wagner \u0027kamu harcamaları GSYH\u0027den hızlı artar\u0027 der; \u0027aynı hızda\u0027 şıkkı yanlış. (2) Peacock-Wiseman\u0027ın anahtar kelimesi SIÇRAMA ve vergi…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [3/3]","metin":"3 2/7/2018 tarihli ve 703 sayılı Kanun Hükmünde Kararnamenin 213 üncü maddesiyle (h) bendinde yer alan “Kanunlarına” ibaresinden sonra gelmek üzere “veya Cumhurbaşkanlığı kararnamelerine” ibaresi eklenmiş ve (j) bendinde yer alan “ilgili kanunlarında” ibaresinden sonra gelmek üzere “veya Cumhurbaşkanlığı kararnamelerinde” ibaresi eklenmiştir. 2 İKİNCİ BÖLÜM Kamu Maliyesi Kamu maliyesi"}],"hakem":"Sorunun D şıkkı (dolaysız vergiler mali anesteziye dolaylı vergilerden daha uygun) gerçekten yanlıştır; kaynak metni mali anestezinin dolaylı vergilerde görüldüğünü, dolaysız vergilerin hissedildiğini açıkça belirtir."},"kayitlar":[],"sade":{"siklar":{"C":"Kaynakta kesinti, mükellefin vergiyle doğrudan temasını azaltır ve tepkisini kırır. Mali anesteziyi güçlendiren doğru bir mekanizmadır.","E":"Mali sürüklenme enflasyonla nominal gelirin artması sonucu vergi dilimlerinin yukarısına kayış anlamına gelir. Mali anesteziden tamamen ayrı bir kavramdır.","A":"Mali anestezi tanımı tam olarak bunu ifade eder: vergiyi hissettirmeden ödeme. Tanıma uyduğu için doğru.","B":"Dolaylı vergiler (KDV, ÖTV) fiyaya gömülü olur ve tüketici bunu ayrı görmez. Bu mali anesteziye tam uygun bir açıklamadır."},"dogru":"Dolaysız vergiler doğrudan hissedildiği için mali anesteziye DAHA AZ uygundur; şık tam tersi söylüyor. Mali anestezi dolaylı vergilerde (fiyaya gömülü) gerçekleşir, dolaysız vergilerde değil.","sinav":"Mali anestezi, mükellefin vergiyi hissetmeden ödemesi durumudur; dolaylı vergiler fiyaya gömülü olduğundan mali anesteziye uygunken, dolaysız vergiler doğrudan hissedildiği için mali anesteziye uymaz.","kavramlar":[{"kaynak":"TEORI","tanim":"Mükellefin ödediği vergiyi hissetmeden ödemesi durumu; fiyaya gömülü dolaylı vergiler ve kaynakta kesinti yoluyla gerçekleşir.","ad":"Mali anestezi"},{"kaynak":"TEORI","tanim":"Fiyaya gömülü olan ve tüketici tarafından ayrı olarak görülmeyen vergi türüdür (KDV, ÖTV gibi).","ad":"Dolaylı vergi"},{"kaynak":"TEORI","tanim":"Vergi mükellefi tarafından doğrudan ödenmeyen, kaynak noktasında kesilerek toplanan vergi yöntemidir.","ad":"Kaynakta kesinti"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":3,"ornekler":[{"yil":"2020/3","alinti":"Mali anestezi etkisinin aşağıdaki vergilerden hangisinde daha yüksek olması beklenir?"},{"yil":"2019/1","alinti":"Emekten elde edilen gelirin sermaye gelirlerine göre daha düşük oranda vergilendirilmesine verilen ad aşağıdakilerden hangisidir?"},{"yil":"2015/2","alinti":"Mali yükümlülüklerin, özellikle vergilerin, vergiyi ödeyenler tarafından farkına varılmadan yerine getirilmesine ne denir?"}],"donemler":["2020/3","2019/1","2015/2"]},"oyun":null,"tip":"teori","soru":"Mali anestezi (vergi uyuşturması) kavramına ilişkin aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-a6-maliye-zor-r1/kp-02","verilenler":[],"dayanak":"TEORİ - Kamu Harcamalarının Artış Nedenleri ve Mali Anestezi (öğreti notu)","dogru":"D","oyunBonus":null,"ders":"Maliye","adimlar":[],"anahtar":[{"ornek":"vergilerin","kok":"vergil"},{"ornek":"dolaysız","kok":"dolays"},{"ornek":"hissedildiği","kok":"hissed"},{"ornek":"doğrudan","kok":"doğrud"},{"ornek":"dolaylı","kok":"dolayl"},{"ornek":"tersine","kok":"tersin"}],"konuGiris":{"harita":"Ne zaman test edilir: dolaylı-dolaysız vergi ayrımı ve kamu harcaması teorileri karıştırılarak sorulduğunda. Nasıl ölçülür: doğru-yanlış eşleştirme şeklinde, kavramın hangi vergi türünde geçerli olduğu sorularak. Nasıl kaydedilir: sınavda ayrı bir hesaplama yoktur, kavramsal tanım bilgisiyle işaretlenir.","desen":"Sınav genelde \u0027aynı hızda artar\u0027 gibi Wagner kanununu bozan ifadeleri mali anesteziyle karıştırıp yanlış şık üretir. Bir diğer tuzak, mali anesteziyi dolaysız vergilere (gelir vergisi gibi) atfetmektir; oysa bu vergiler hissedilir. Bu soru p.28\u0027deki \u0027mali anestezi dolaylı vergilerde görülür\u0027 cümlesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Mükellefin vergiyi ödediğini hissetmeden ödemesi durumu","ad":"Mali anestezi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Fiyata gömülü, tüketici hissetmeden ödediği vergi türü (KDV, ÖTV)","ad":"Dolaylı vergi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Toplumun vergi yüküne karşı gösterdiği katlanma sınırı","ad":"Vergi tahammül düzeyi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Enflasyonla nominal gelir artışının mükellefi üst vergi dilimine kaydırması","ad":"Mali sürüklenme","kim":"kanun sabitler"}],"sinavda":"Soruda mali anesteziyle ilgili beş ifade verilir ve hangisinin yanlış olduğu istenir.","panel_ornek":"Markette aldığın 50 liralık bir ürünün içine gizlice 9 lira vergi eklenmiş olsa bunu fark etmezsin; parayı öderken \u0027vergi ödüyorum\u0027 hissi yaşamazsın. İşte bu duygusuzluk hali mali anestezidir.","ornek":"Markette aldığın 50 liralık bir ürünün içine gizlice 9 lira vergi eklenmiş olsa bunu fark etmezsin; parayı öderken \u0027vergi ödüyorum\u0027 hissi yaşamazsın. İşte bu duygusuzluk hali mali anestezidir.","yontemler":"Tek kritik kural: mali anestezi sadece dolaylı vergilerde (KDV, ÖTV) geçerlidir, dolaysız vergilerde vergi hissedilir.","nedir":"Mali anestezi, mükellefin ödediği vergiyi hissetmemesi durumunu anlatan bir maliye kavramıdır. Sınav bu kavramın hangi vergi türünde görüldüğünü ve diğer kamu harcaması teorileriyle karışıp karışmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Kaynakta Kesinti Tuzağı","metin":"öğrenci stopajın vergi bilincini artırdığını sanabilir. Doğrusu: kaynakta kesinti mükellefin vergiyle doğrudan temasını azaltır, dolayısıyla mali anesteziyi güçlendiren doğru bir ifadedir."},"E":{"ad":"Kavram Karıştırma Tuzağı","metin":"öğrenci mali sürüklenmeyi mali anesteziyle aynı kavram sanabilir. Doğrusu: mali sürüklenme enflasyon nedeniyle üst dilime kaymayı anlatır, mali anesteziden ayrı bir kavramdır; ifade doğrudur."},"A":{"ad":"Ne soruluyor","metin":"mali anestezi kavramının hangi ifadeye uymadığı soruluyor. Kural: mali anestezi, mükellefin vergiyi ödediğini hissetmeden ödemesidir. Doğrusu: bu ifade tanıma birebir uyduğu için doğrudur, yanlış şık değildir."},"B":{"ad":"Dolaylı Vergi Tuzağı","metin":"öğrenci dolaylı vergilerin mali anesteziyle ilişkisini ters kurabileceğini düşünüp bu şıkkı yanlış sanabilir. Doğrusu: dolaylı vergiler fiyata gömülü olduğundan mali anesteziye tam uygun bilgidir, doğru şıktır."}},"celdiriciYol":{},"hap":"Mali anestezi, dolaylı vergilerin ve kaynakta kesintinin mükellefte yarattığı vergi uyuşturmasıdır; dolaysız vergiler doğrudan hissedildiği için buna daha az uygundur.","teshis":{"C":{"gercek":"Kaynakta kesinti mükellefin vergiyle doğrudan teması olmadan ödemeyi tamamlamasını sağlar, tepkiyi azaltır.","ayirt":"Bu yöntemde mükellef parayı kendi elinden mi çıkarıyor?","paragraf":"TEORİ - Mali Anestezi","yanilgi":"Kaynakta kesintinin vergi bilincini artıracağını, dolayısıyla mali anesteziyi zayıflatacağını sanıyorsun."},"E":{"gercek":"Mali sürüklenme, enflasyon nedeniyle nominal gelir artışının artan oranlı tarifede üst dilime kaymaya yol açmasıdır; mali anesteziden ayrı bir kavramdır.","ayirt":"Burada konu vergiyi hissetmemek mi, yoksa tarifede dilim değiştirmek mi?","paragraf":"TEORİ - Mali Sürüklenme","yanilgi":"Mali sürüklenme ile mali anesteziyi aynı olay sanıp bu şıkkı yanlış görüyorsun."},"A":{"gercek":"Mali anestezi, mükellefin vergi yükünü fark etmeden taşımasıdır; bu tanım kaynakta birebir yer alır.","ayirt":"Bu cümle mali anestezinin temel tanımını mı veriyor?","paragraf":"TEORİ - Kamu Harcamalarının Artış Nedenleri ve Mali Anestezi","yanilgi":"Mali anestezinin sadece dolaylı vergilerle ilgili özel bir teknik terim olmadığını, genel tanımının yanlış olabileceğini düşünüyorsun."},"D":{"gercek":"Kaynak açıkça dolaysız vergilerin doğrudan hissedildiğini, mali anesteziye dolaylı vergilere göre DAHA AZ uygun olduğunu belirtir; bu şık yönü ters çevirmiştir.","ayirt":"Mükellef bu vergiyi öderken cebinden çıkan parayı doğrudan görüyor mu?","paragraf":"TEORİ - Mali Anestezi","yanilgi":"Dolaysız vergilerin de gizli biçimde ödendiğini, dolayısıyla mali anesteziye uygun olduğunu düşünüyorsun."},"B":{"gercek":"Kaynak, KDV ve ÖTV gibi fiyata gömülü dolaylı vergilerin mali anesteziye örnek olduğunu açıkça belirtir.","ayirt":"Vergi fiyatın içine mi gizleniyor, yoksa ayrıca mı tahsil ediliyor?","paragraf":"TEORİ - Mali Anestezi","yanilgi":"Dolaylı vergilerin fiyata gömülü olmasının mali anestezi ile ilişkisini rastgele bir detay sanıyorsun."}},"verilen":[],"donem":3,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 100"},"kural":"Operasyonel açık, nominal açıktan faizin enflasyon telafisi kısmının düşülmesiyle bulunur; birincil açığa yalnız reel faiz eklenir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 100","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce birincil açığı (nominal-faiz) bul, sonra reel faizi (faiz-prim) ekle; ara sonuçları karıştırma.","konu":"operasyonel açık","tablo":{"satirlar":[["VERİLENLER","-"],["Nominal açık","200 TL"],["Faiz ödemesi","90 TL"],["Enflasyon primi","50 TL"],["HESAP","-"],["Birincil açık (200-90)","110"],["Reel faiz (90-50)","40"],["Operasyonel açık (110+40)","150"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"160","E":"250","A":"110","D":"200","B":"150"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - operasyonel acik","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Aynı bütçe için birkaç açık ölçüsü hesaplanır. GELENEKSEL (NOMİNAL) AÇIK: Toplam harcama − toplam gelir; faiz ödemeleri dahil. BİRİNCİL (FAİZ DIŞI) AÇIK veya FAZLA: Faiz ödemeleri hariç harcama − gelir; hükümetin o yıl kendi kararlarıyla yönetebildiği dengeyi gösterir, borç sürdürülebilirliğinin temel göstergesidir. OPERASYONEL (İŞLEMSEL) AÇIK: Yüksek enflasyon ortamında nominal faiz ödemelerinin büyük kısmı, borcun reel değerindeki aşınmayı telafi eden ENFLASYON PRİMİdir; bu kısım gerçek bir kaynak transferi sayılmaz. Operasyonel açık = birincil açık + REEL faiz ödemeleri; başka deyişle nominal açıktan faizin enflasyon telafisi kısmı çıkarılır. Enflasyon yüksekken nominal açık gerçek malî durumu abartır, operasyonel açık düzeltir. YAPISAL AÇIK: Ekonomi potansiyel üretim düzeyindeyken oluşacak açık; konjonktürden arındırılmış, politikadan kaynaklanan kısım. KONJONKTÜREL AÇIK: Durgunlukta vergilerin düşmesi ve işsizlik ödemelerinin artmasıyla otomatik oluşan kısım. KÜÇÜK ÖRNEK: Nominal açık 100, faiz ödemesi 60 ve bu faizin 45\u0027i enflasyon telafisi ise birincil açık 100 − 60 = 40, reel faiz 60 − 45 = 15, operasyonel açık 40 + 15 = 55 olur. Nominal 100 görünen açığın gerçek yükü 55\u0027tir. SINAV TUZAĞI: (1) Birincil açık faizin TAMAMINI dışlar, operasyonel açık yalnız enflasyon telafisi kısmını dışlar (reel faizi içerir). (2) Operasyonel açık yüksek enflasyon ülkeleri için anlamlıdır; düşük enflasyonda nominal açığa yaklaşır. (3) Birincil fazla vermek, borcun millî gelire oranını düşürmenin ön koşuludur; \u0027nominal denge\u0027 değil \u0027…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.4","metin":"Madde 4- Kamu maliyesi; gelirlerin toplanması, harcamaların yapılması, açıkların finansmanı, kamunun varlık ve borçları ile diğer yükümlülüklerinin yönetimini kapsar. Kamu maliyesi, merkezden ve yerinden yönetim esaslarına göre yürütülür. Kamu idarelerinin görevleri, ilgili kanunlarında veya Cumhurbaşkanlığı kararnamelerinde açık olarak belirlenir ve kaynakların dağıtımında esas alınır.4 Kamu maliyesinin temel ilkeleri"}],"hakem":"Soru operasyonel açık tanımını ve hesaplamasını kaynak metinde tam olarak desteklenen kurala göre doğru ölçmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Enflasyon primini (50) çıkarmak yerine birincil açığa eklenmiş (110 + 50 = 160); doğru işlem reel faiz (faiz − prim) eklemektir.","E":"Enflasyon priminin çıkarılması yerine nominal açığa eklenmiş (200 + 50); prim nominal açıktan düşülmelidir.","D":"Nominal açık enflasyon düzeltmesi yapılmadan kullanılmış; yüksek enflasyonda gerçek yükü göstermez.","A":"Yalnız birincil açık (200 − 90) bulunmuş, reel faiz (90 − 50 = 40) eklenmemiş; operasyonel açık reel faiz  → doğrusu 150 (4. adımda bulduk)","anlatim":"En sık hata: reel faizi eklemeyi unutup birincil açığı operasyonel açık sanmak. Ama enflasyon primi hariç tutulan reel faiz kısmı mutlaka eklenmeli.","doldur":[]}],"anahtar":[{"ornek":"enflasyon","kok":"enflas"},{"ornek":"nominal","kok":"nomina"},{"ornek":"açıktan","kok":"açıkta"},{"ornek":"birincil","kok":"birinc"},{"ornek":"operasyonel","kok":"operas"},{"ornek":"faizin","kok":"faizin"},{"ornek":"150","kok":"150"}],"konuGiris":{"harita":"Ne zaman test edilir: nominal açık, faiz ödemesi ve faizin enflasyon primi verildiğinde. Nasıl ölçülür: önce faizin tamamı çıkarılıp birincil açık bulunur, sonra reel faiz eklenir. Nasıl kaydedilir: tek bir TL tutarı olarak sonuç yazılır, ara adımlar gösterilmez.","desen":"Sınav genelde nominal açık, toplam faiz ve enflasyon primini verip operasyonel açığı sordurur; tuzak, öğrencinin faizin tamamını değil sadece enflasyon primini çıkarması gerektiğini unutmasıdır. Bazı sorularda birincil açık ile operasyonel açık karıştırılır, birincil faizin tamamını dışlar. Bu soru, nominal açıktan faizin enflasyon telafisi kısmının düşülmesi noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Toplam harcama ile toplam gelir arasındaki fark, faiz dahil.","ad":"Nominal açık","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Faiz ödemeleri tamamen hariç tutularak bulunan açık.","ad":"Birincil açık","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Faizin, borcun reel değer aşınmasını telafi eden kısmı.","ad":"Enflasyon primi","kim":"piyasa fiyatlar"},{"kaynak":"sen hesaplarsın","tanim":"Nominal faizden enflasyon priminin çıkarılmasıyla kalan kısım.","ad":"Reel faiz","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Nominal açık, toplam faiz ödemesi ve faizin enflasyon primi verilip operasyonel açık istenir.","panel_ornek":"Arkadaşın 12.000 TL kirasını her ay ödüyor, bunun 5.000 TL\u0027si s
