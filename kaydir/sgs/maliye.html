rumlarının kendi hizmetlerini finanse etmek için belirli bir gruptan zorunlu topladığı gelirlerdir. Sınav, bu gelirin vergiden ve harçtan farkını ve hangi kurumların topladığını ölçer."},"olay":"","tuzak":{"D":{"ad":"Devlet Kurumu Tuzağı","metin":"Maliye Bakanlığını dahil edip Sosyal Güvenlik Kurumunu dışarıda bırakıyorsun. Doğrusu: sosyal güvenlik primi klasik parafiskal gelir örneğidir; Maliye Bakanlığı geliri parafiskal değildir."},"E":{"ad":"Vergi-Parafiskal Karışıklığı","metin":"devletin topladığı zorunlu geliri karşılıksız olsa da parafiskal sanıyorsun. Doğrusu: parafiskal gelir karşılıklıdır ve toplayan taraf devlet değil kamu kurumu niteliğindeki kuruluştur; Maliye Bakanlığı bu tanıma girmez."},"A":{"ad":"Kapsam Daraltma Tuzağı","metin":"Baroyu (IV) listeden çıkarıyorsun çünkü meslek kuruluşu örneğini yalnız ticaret/sanayi odasıyla sınırlı sanıyorsun. Doğrusu: baro da kamu kurumu niteliğindeki meslek kuruluşudur, topladığı aidat parafiskal gelirdir."},"B":{"ad":"Genel Bütçe Karışıklığı Tuzağı","metin":"Maliye Bakanlığının topladığı geliri de parafiskal sanıyorsun. Doğrusu: Maliye Bakanlığı devlet adına vergi toplar; bu gelir genel bütçeye giren vergi geliridir, parafiskal değildir."}},"celdiriciYol":{},"hap":"Parafiskal gelir; kamu kurumu niteliğindeki meslek kuruluşları ile sosyal güvenlik kurumlarının, hizmetin finansmanı için ilgililerden zorunlu topladığı, karşılığı olan ve kendi bütçesine giren gelirdir.","teshis":{"C":{"gercek":"Sosyal Güvenlik Kurumu, Ticaret ve Sanayi Odası ve Baro; kamu kurumu niteliğindeki kuruluş olarak ilgililerden zorunlu ve karşılıklı gelir toplar, bu gelirler kendi bütçelerine girer.","ayirt":"Bu kurum devlet mi, yoksa kamu kurumu niteliğinde ayrı bir kuruluş mu; topladığı gelir kendi bütçesine mi giriyor?","paragraf":"TEORİ - Parafiskal Gelirler","yanilgi":"Bu şıkkı eleyen öğrenci, baronun ya da odanın da devlet kurumu sayılıp genel bütçeye gelir yazdığını düşünür."},"E":{"gercek":"Vergi karşılıksızdır ve devlet tarafından genel bütçeye toplanır; parafiskal gelir ise karşılıklıdır ve kamu kurumu niteliğindeki kuruluşça toplanır.","ayirt":"Bu geliri devlet mi topluyor, ödeyen karşılığında bir hizmetten yararlanıyor mu?","paragraf":"TEORİ - Parafiskal Gelirler","yanilgi":"Zorunlu olarak toplanan her geliri parafiskal sanıyorsun, karşılıksız olup olmadığına ve kimin topladığına bakmıyorsun."},"A":{"gercek":"Kamu kurumu niteliğindeki her meslek kuruluşunun üyelerinden topladığı aidat parafiskal gelirdir; baro da bu gruba girer.","ayirt":"Bu kuruluş, mensuplarına hizmet karşılığında zorunlu aidat mı topluyor?","paragraf":"TEORİ - Parafiskal Gelirler","yanilgi":"Parafiskal gelir örneklerinin yalnız ticaret ve sanayi odalarından ibaret olduğunu, baronun bu kapsama girmediğini düşünüyorsun."},"D":{"gercek":"Sosyal güvenlik primleri, tanımdaki \u0027ilgililerden zorunlu ve karşılıklı toplanan, kurum bütçesine giren gelir\u0027 unsurunu tam karşılar.","ayirt":"Bu prim, ödeyene ileride bir hizmet (emeklilik, sağlık) karşılığı sağlıyor mu?","paragraf":"TEORİ - Parafiskal Gelirler","yanilgi":"Sosyal Güvenlik Kurumunun parafiskal gelir tanımının en tipik örneği olduğunu unutup onu listeden çıkarıyorsun."},"B":{"gercek":"Parafiskal gelir devlet bütçesine değil, ilgili kamu kurumunun kendi bütçesine girer; Maliye Bakanlığı geliri genel bütçeye giren vergi gelidir.","ayirt":"Bu gelir devletin genel bütçesine mi, yoksa kurumun kendi bütçesine mi giriyor?","paragraf":"TEORİ - Parafiskal Gelirler","yanilgi":"Maliye Bakanlığının topladığı her geliri parafiskal sanıyorsun, kurumun devlet bütçesine mi yoksa kendi bütçesine mi gelir yazdığına bakmıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 97"},"kural":"parafiskal gelirler karşılıklıdır, belirli gruptan zorunlu toplanır ve devlet bütçesine değil topluyan kamu kurumu niteliğindeki kuruluşun kendi bütçesine girer.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 97","sonDonem":3,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Parafiskal gelir sorusunda önce \u0027kim topluyor, hangi bütçeye giriyor\u0027 ikilisini kontrol et; devlet ya da genel bütçe geçen şık daima yanlıştır.","konu":"parafiskal gelirler","tablo":{"satirlar":[["A) Her ikisi de karşılığında hizmet sunulan zorunlu gelirle…","TEORI - Parafiskal gelirler","doğru ifade"],["B) Her ikisi de 5018 sayılı Kamu Malî Yönetimi Kanununun ge…","5018 s.K. m.3","YANLIŞ ifade"],["C) Her ikisi de devlet tarafından toplanıp genel bütçeye ge…","TEORI - Parafiskal gelirler","YANLIŞ ifade"],["D) Her ikisi de karşılıksızdır; ödeyen kişi ödediği tutar k…","TEORI - Parafiskal gelirler","YANLIŞ ifade"],["E) Her ikisi de kanuna veya kanunun verdiği yetkiye dayanma…","TEORI - Parafiskal gelirler","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Her ikisi de devlet tarafından toplanıp genel bütçeye gelir kaydedilir, bu yönüyle harç ve resimden farksızdır.","E":"Her ikisi de kanuna veya kanunun verdiği yetkiye dayanma zorunluluğu taşımaz, ilgili kurum kendi iç kararıyla bu geliri belirleyebilir.","A":"Her ikisi de karşılığında hizmet sunulan zorunlu gelirlerdir; toplanan tutarlar devlet bütçesine değil ilgili kurumun kendi bütçesine kaydedilir.","D":"Her ikisi de karşılıksızdır; ödeyen kişi ödediği tutar karşılığında doğrudan bir hizmetten yararlanmaz.","B":"Her ikisi de 5018 sayılı Kamu Malî Yönetimi Kanununun genel yönetim kapsamına giren kamu idaresi sayılır ve bu nedenle merkezî bütçeyle ilişkilendirilir."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Parafiskal gelirler","metin":"TEORİ (maliye, mevzuat maddesi yok). TANIM: parafiskal gelirler, kamu kurumu niteliğindeki MESLEK KURULUŞLARI ile SOSYAL GÜVENLİK KURUMLARININ, sundukları hizmetlerin finansmanı için İLGİLİLERDEN zorunlu olarak topladığı gelirlerdir. ÖRNEKLER: sosyal güvenlik primleri, ticaret/sanayi odası aidatlari, baro aidatlari, TÜRMOB-SMMM odası aidatlari. BEŞ ÖZELLİK: (1) ZORUNLUDUR - ilgili gruba dahil olan ödemek zorundadır, (2) KARŞILIĞI VARDIR - ödeyen kişi kurumun hizmetinden yararlanır (vergiden ayrıldığı en önemli nokta), (3) DEVLET BÜTÇESİNE GİRMEZ - ilgili kurumun kendi bütçesine gelir yazılır, (4) BELİRLİ BİR GRUPTAN toplanır, toplumun tamamından değil, (5) KANUNLA veya kanunun verdiği yetkiye dayanılarak konulur. VERGİDEN FARKI: vergi KARŞILIKSIZDIR ve GENEL BÜTÇEYE girer; parafiskal gelir KARŞILIKLIDIR ve ÖZEL BÜTÇEYE/kurum bütçesine girer. HARÇ VE RESİMDEN FARKI: harç ve resim de karşılıklıdır ama DEVLET BÜTÇESİNE girer ve devlet tarafından toplanır; parafiskal geliri toplayan devlet değil, KAMU KURUMU NİTELİĞİNDEKİ KURULUŞTUR. SINAV TUZAĞI: \u0027karşılıksızdır\u0027 seçeneği parafiskal gelir için YANLIŞTIR - karşılıksızlık verginin özelliğidir. \u0027Genel bütçeye dahildir\u0027 seçeneği de yanlıştır."},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [1/3]","metin":"Madde 3- Münhasıran bu Kanunun uygulanmasında; a) Genel yönetim kapsamındaki kamu idareleri: Uluslararası sınıflandırmalara göre belirlenmiş olan, merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri, b) Merkezî yönetim kapsamındaki kamu idareleri: Bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerini, c) Düzenleyici ve denetleyici kurumlar: Bu Kanuna ekli (III) sayılı cetvelde yer alan kurumları, 22/12/2005 tarihli ve 5436 sayılı Kanunun 10 uncu maddesiyle, bu fıkraya \"25\" ibaresinden sonra gelmek üzere, \"42\" ibaresi; \"43\" ibaresinden sonra gelmek üzere, \"44\" ibaresi ve \"76\" ibaresinden sonra gelmek üzere, \"78\" ibaresi eklenmiştir. 1 d) Sosyal güvenlik kurumları: Bu Kanuna ekli (IV) sayılı cetvelde yer alan kamu kurumlarını, e) Mahallî idare: Yetkileri belirli bir coğrafi alan ve hizmetlerle sınırlı olarak kamusal faaliyet gösteren belediye, il özel idaresi ile bunlara bağlı veya bunların kurdukları veya üye oldukları birlik ve idareleri,2 f) Bütçe: Belirli bir dönemdeki gelir ve gider tahminleri ile bunların uygulanmasına ilişkin hususları gösteren ve usulüne uygun olarak yürürlüğe konulan belgeyi, g) Kamu kaynakları: Borçlanma suretiyle elde edilen imkânlar dahil kamuya ait gelirler, taşınır ve taşınmazlar, hesaplarda bulunan para, alacak ve haklar ile her türlü değerleri, h) Kamu gideri: Kanunlarına veya Cumhurbaşkanlığı kararnamelerine dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, sosyal güvenlik katkı payları, iç ve dış borç faizleri, borçlanma genel giderleri, borçlanma araçlarının iskontolu…"}],"hakem":"Soru parafiskal gelirler konusunu doğru ölçüyor; doğru sikk (A) kaynak metinden desteklenen beş özelliği (zorunluluk, karşılıklılık, devlet bütçesine girmemesi) her iki gelir türü için de geçerli olarak sunuyor."},"kayitlar":[],"sade":{"siklar":{"C":"Harç ve resim devlet tarafından toplanıp genel bütçeye girerken, parafiskal geliri toplayan devlet değil kamu kurumudur ve gelir o kurumun kendi bütçesine girer; iki gelir türü farklı bütçe yapılarına sahiptir.","E":"Her iki gelir türü de kanuna veya kanunun verdiği yetkiye dayanarak konulur; kurumun serbest iç kararıyla belirlenemez ve kanunilik ilkesi her ikisinde de geçerlidir.","D":"Parafiskal gelirlerde karşılıklılık vardır; ödeyen kişi kurumun hizmetinden yararlanır ve bu, karşılıksızlık özelliği olan vergiden ayrı bir niteliktir.","B":"Sosyal güvenlik kurumu Kamu Malî Yönetimi Kanunu kapsamında kamu idaresi sayılsa da, meslek odaları bu kapsamda değildir; bu özellik her ikisi için birden geçerli değildir."},"dogru":"Sosyal güvenlik primleri ile meslek odası aidatları ikisi de belirli bir gruptan zorunlu olarak toplanır ve ödeyen kişi kurumun hizmetinden yararlanır; önemli olan her iki gelir de devlet bütçesine değil, toplayan kurumun kendi bütçesine kaydedilir.","sinav":"Kamu Malî Yönetimi Kanunu 3. madde","kavramlar":[{"kaynak":"TEORI","tanim":"Kamu kurumu niteliğindeki meslek kuruluşları ile sosyal güvenlik kurumlarının, sundukları hizmetlerin finansmanı için ilgililerden zorunlu olarak topladığı, toplandığı kişilerin kurumun hizmetinden yararlandığı gelirdir.","ad":"Parafiskal gelir"},{"kaynak":"Kamu Malî Yönetimi K. 3. madde","tanim":"Kamu Malî Yönetimi Kanunu uyarınca merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri kapsamında yer alan idareler.","ad":"Genel yönetim kapsamındaki kamu idaresi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[{"yil":"2025/1","alinti":"Türk vergi sisteminde yer alan ve aşağıda sayılan vergilerden hangisi “servet veya servet transferi” üzerinden alınmaktadır?"},{"yil":"2024/1","alinti":"Kamu gelirleri ile ilgili aşağıdakilerden hangisi doğrudur?"}],"donemler":["2025/1","2024/1"]},"oyun":null,"tip":"teori","soru":"Sosyal güvenlik kurumlarının topladığı primler ile bir meslek odasının üyelerinden aldığı aidatlar karşılaştırıldığında, aşağıdakilerden hangisi HER İKİSİ için de her zaman doğrudur?","kayitBaslik":"","id":"sgs-a6-maliye-cokzor-r1/kp-09","verilenler":[],"dayanak":"TEORI - Parafiskal gelirler; Kamu Malî Yönetimi K. (5018 s.K.) m.3","dogru":"A","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Bir mühendis, 2024 Mart ayında bağlı olduğu Odaya 1.200 lira aidat ödedi; aynı ay SGK\u0027ya da 3.500 lira prim kesildi.","anlatim":"İkisi de zorunlu, ikisi de belirli bir gruptan alınıyor. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Odanın 1.200 lirası Oda\u0027nın kendi bütçesine, SGK\u0027nın 3.500 lirası SGK\u0027nın kendi bütçesine girer; devlet bütçesine girmez. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Mühendis parasını ödedikten sonra bu para nereye yazılıyor, ona bakacağız. Karşılığında bir hizmet var mı, ona bakacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TEORI - Parafiskal gelirler","karar":"doğru","anlatim":"Oda mühendise mesleki hizmet sunar, SGK ona sağlık ve emeklilik hizmeti sunar; ikisi de karşılıklı. 1.200 lira Oda bütçesine, 3.500 lira SGK bütçesine girer, devlet bütçesine değil.","formul":"Şık A: mühendisin ödediği hem Oda aidatı hem SGK primi, her ikisinin kendi kurum bütçesine girdiğini ve karşılığında hizmet aldığını söylüyor; katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"5018 s.K. m.3","karar":"yanlış","anlatim":"SGK, 5018 sayılı Kanun madde 3\u0027te sosyal güvenlik kurumu olarak genel yönetim kapsamına girer, ama meslek Odası bu tanımda yok. İkisi için birden \u0027her zaman doğru\u0027 demek yanlış olur.","formul":"Şık B: biri sana \u0027ikisi de 5018 sayılı Kanunun genel yönetim kapsamındaki idare sayılır, bu yüzden merkezi bütçeyle ilişkilendirilir\u0027 diyor, kabul eder misin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TEORI - Parafiskal gelirler","karar":"yanlış","anlatim":"Mühendisin 1.200 lirası devletin eline hiç geçmiyor, direkt Oda\u0027ya gidiyor. Harç ve resmi devlet toplar ve genel bütçeye koyar, burada öyle bir şey yok.","formul":"Şık C: \u0027ikisi de devlet tarafından toplanıp genel bütçeye gelir kaydedilir, harç ve resimden farksızdır\u0027 diyen arkadaşına ne dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TEORI - Parafiskal gelirler","karar":"yanlış","anlatim":"Mühendis SGK primiyle sağlık ve emeklilik hakkı kazanıyor, Oda aidatıyla mesleki hizmetten yararlanıyor. Karşılıksızlık vergiye ait bir özellik, buraya uymuyor.","formul":"Şık D: \u0027mühendis ödediği parayla hiçbir hizmetten yararlanmaz, karşılıksızdır\u0027 diyorlar, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TEORI - Parafiskal gelirler","karar":"yanlış","anlatim":"Hem SGK primi hem Oda aidatı kanunla veya kanunun verdiği yetkiyle konulur, Oda kendi keyfine göre aidat koyamaz. Bu yüzden ifade yanlış.","formul":"Şık E: \u0027bu gelirler kanuna dayanmak zorunda değil, kurum kendi kararıyla belirleyebilir\u0027 diyen birine ne cevap verirsin?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Mühendisin ödediği para karşılıksız değil, devlete gitmiyor, kanunsuz da alınmıyor; tek ortak ve her zaman geçerli özellik kendi kurum bütçesine giren karşılıklı zorunlu gelir olması. Kendine sor: bu parayı toplayan devlet mi, yoksa hizmeti sunan kurum mu?","doldur":[]}],"anahtar":[{"ornek":"karşılıklıdır","kok":"karşıl"},{"ornek":"devlet","kok":"devlet"},{"ornek":"bütçesine","kok":"bütçes"},{"ornek":"hizmet","kok":"hizmet"},{"ornek":"mühendis","kok":"mühend"},{"ornek":"zorunlu","kok":"zorunl"}],"konuGiris":null,"olay":"","tuzak":{"C":{"ad":"Bütçe Türü Tuzağı","metin":"öğrenci harç ve resmin devlet tarafından toplanıp genel bütçeye girmesiyle parafiskal geliri karıştırır. Doğrusu: parafiskal geliri toplayan devlet değil kamu kurumu niteliğindeki kuruluştur ve gelir kurumun kendi bütçesine girer."},"E":{"ad":"Kanunilik Tuzağı","metin":"parafiskal gelirler de tıpkı vergi gibi kanunla veya kanunun verdiği yetkiye dayanılarak konulur, kurumun serbest iç kararıyla belirlenemez. Doğrusu: kanunilik şartı her ikisinde de aranır."},"D":{"ad":"Vergi Karışımı Tuzağı","metin":"karşılıksızlık verginin özelliğidir, parafiskal gelirde ödeyen kişi kurumun sunduğu hizmetten yararlanır. Doğrusu: parafiskal gelir karşılıklıdır."},"B":{"ad":"Kapsam Karıştırma Tuzağı","metin":"SGK 5018 sayılı Kanunun m.3 hükmüne göre genel yönetim kapsamındaki kamu idaresi sayılır ama meslek odaları bu kapsamda değildir; ikisi için birden \u0027her zaman\u0027 demek yanlıştır. Doğrusu: bu özellik ortak değil, yalnız SGK için geçerlidir."}},"celdiriciYol":{},"hap":"Parafiskal gelir karşılıklıdır, belirli gruptan zorunlu toplanır ve topluyan kamu kurumu niteliğindeki kuruluşun kendi bütçesine girer; devlet toplamaz, genel bütçeye girmez.","teshis":{"C":{"gercek":"Harç ve resim devlet tarafından toplanıp devlet bütçesine girer; parafiskal geliri toplayan devlet değil kamu kurumu niteliğindeki kuruluştur ve gelir o kurumun bütçesine girer.","ayirt":"Bu geliri fiilen toplayan devlet mi yoksa ayrı bir kamu kurumu mu?","paragraf":"TEORI - Parafiskal gelirler","yanilgi":"Harç ve resmin devlet eliyle genel bütçeye girmesini parafiskal gelire de uyguluyorsun."},"E":{"gercek":"Parafiskal gelirler de vergi gibi kanunla veya kanunun verdiği yetkiye dayanılarak konulur.","ayirt":"Bu gelirin alınmasına dayanak olan bir kanun veya kanuni yetki var mı?","paragraf":"TEORI - Parafiskal gelirler","yanilgi":"Parafiskal gelirin kurumun iç kararıyla serbestçe konulabileceğini sanıyorsun."},"A":{"gercek":"Parafiskal gelir, kaynağa göre karşılıklıdır, belirli gruptan zorunlu toplanır ve topluyan kurumun kendi bütçesine girer; 5018\u0027deki kapsam ayrı bir sınıflandırmadır.","ayirt":"Bu geliri devlet mi topluyor, yoksa ilgili kamu kurumu mu; girdiği bütçe genel bütçe mi, kurum bütçesi mi?","paragraf":"TEORI - Parafiskal gelirler","yanilgi":"Bu şıkkı eleyen öğrenci, SGK\u0027nın 5018 kapsamında sayılmasının parafiskal gelirin bütçeye giriş kuralını da değiştirdiğini sanıyor."},"D":{"gercek":"Parafiskal gelirde ödeyen kişi kurumun sunduğu hizmetten yararlanır; karşılıksızlık yalnız verginin özelliğidir.","ayirt":"Ödeyen kişi bu ödeme karşılığında somut bir hizmetten yararlanıyor mu?","paragraf":"TEORI - Parafiskal gelirler","yanilgi":"Vergideki karşılıksızlık ilkesini parafiskal gelire de taşıyorsun."},"B":{"gercek":"5018 sayılı Kanun m.3/a-d\u0027ye göre sosyal güvenlik kurumları genel yönetim kapsamındadır; meslek kuruluşları bu tanımda sayılmaz.","ayirt":"Bu kurum 5018\u0027in ekli cetvellerinde veya sosyal güvenlik kurumları tanımında açıkça sayılıyor mu?","paragraf":"Kamu Malî Yönetimi K. (5018 s.K.) m.3","yanilgi":"5018 sayılı Kanunun genel yönetim tanımına SGK\u0027nın girmesini görüp meslek odalarının da aynı kapsamda olduğunu varsayıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununun 3 üncü maddesine göre merkezî yönetim kapsamındaki kamu idareleri kanuna ekli birinci, ikinci ve üçüncü sayılı cetvellerde yer alan idarelerdir; düzenleyici ve denetleyici kurumlar üçüncü sayılı cetvelde sayılır. Dolayısıyla bu kurumlar merkezi yönetimin içindedir ancak genel bütçeden ve özel bütçeden ayrı bir cetvelde gösterilir.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Bütçe türü sorularında kurumu cetvel numarasıyla eşleştir; cetvel bilinince şıkların dördü elenir.","konu":"5018 bütçe turleri","tablo":{"satirlar":[["VERİLENLER","-"],["Cetveller","Birinci genel bütçe, ikinci özel bütçe, üçüncü düzenleyici ve denetleyici kurum"],["Dördüncü cetvel","Sosyal güvenlik kurumları"],["HESAP","-"],["Ne soruluyor","5018 sayılı Kanuna göre düzenleyici ve denetleyici kurumların bütçeleri hangi grupta yer alır?"],["Kural","5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununun 3 üncü maddesine göre merkezî yönetim kapsamındaki kamu idareleri kanuna ekli birinci, ikinci ve üçüncü sayılı cetvellerde yer alan idarelerdir; düzenleyici ve denetleyici kurumlar üçüncü sayılı cetvelde sayılır. Dolayısıyla bu kurumlar merkezi yönetimin içindedir ancak genel bütçeden ve özel bütçeden ayrı bir cetvelde gösterilir."],["Doğru şık","A) Merkezi yönetim bütçesi içinde, ayrı bir cetvelde"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Mahalli idare bütçeleri içinde","E":"Genel yönetim dışında, bağımsız bir bütçe türü olarak","A":"Merkezi yönetim bütçesi içinde, ayrı bir cetvelde","D":"Genel bütçe içinde, ayrı bir bölüm olarak","B":"Sosyal güvenlik kurumu bütçeleri içinde"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - butce hazirlama sureci","metin":"TEORİ (maliye; dayanak 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu\u0027nun bütçenin hazırlanması ve kabulüne ilişkin hükümleri ile Anayasa\u0027nın bütçe maddeleri). TANIM VE KURAL: Bütçe süreci HAZIRLIK, KABUL, UYGULAMA ve DENETİM aşamalarından oluşur; malî yıl takvim yılıdır. HAZIRLIK AŞAMASI: Süreç ORTA VADELİ PROGRAM ile başlar; ardından ORTA VADELİ MALÎ PLAN (gelecek üç yılın gelir ve gider tahminleri, hedef açık ve borçlanma durumu, ödenek teklif tavanları) hazırlanır. Sonra BÜTÇE ÇAĞRISI ve ekindeki BÜTÇE HAZIRLAMA REHBERİ ile YATIRIM GENELGESİ ve YATIRIM PROGRAMI HAZIRLAMA REHBERİ yayımlanır. Kamu idareleri stratejik planları ve performans programlarıyla uyumlu gider tekliflerini hazırlar; gelir teklifleri merkezi olarak hazırlanır. Teklifler değerlendirilip merkezi yönetim bütçe kanun teklifi oluşturulur. KABUL AŞAMASI: Merkezi yönetim bütçe kanun teklifi malî yılbaşından EN AZ YETMİŞ BEŞ GÜN ÖNCE TBMM\u0027ye sunulur. Teklif önce PLAN VE BÜTÇE KOMİSYONUnda (elli beş gün), sonra GENEL KURULda (kalan sürede) görüşülür ve malî yılbaşından önce kabul edilir. Bütçe kanunu yasama organının yürütmeye verdiği bir yıllık harcama iznidir; bütçe kanunlarına bütçeyle ilgisiz hüküm konulamaz. Bütçe süresinde kabul edilemezse geçici bütçe uygulanır. UYGULAMA VE DENETİM: Ödenekler kullanılır; yıl sonunda KESİN HESAP KANUNU ile Sayıştay denetimi yasama denetimini tamamlar. KÜÇÜK ÖRNEK: Bir bakanlık, rehberdeki ödenek tavanlarını aşan teklif hazırlarsa teklif merkezi değerlendirmede tavana çekilir; TBMM kabul etmeden hiçbir ödenek harcanamaz. SINAV TUZAĞI: (1) Sıra: OVP → OVMP → bütçe çağr…"},{"ad":"TEORI - 5018 butce turleri","metin":"TEORİ (maliye; dayanak 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu, bütçe türleri ve kapsam hükümleri). TANIM VE KURAL: 5018 sayılı Kanun kamu idarelerinin bütçelerini GENEL YÖNETİM çatısı altında üç ana türe ayırır. (1) MERKEZİ YÖNETİM BÜTÇESİ: Kanuna ekli cetvellerdeki idareleri kapsar ve kendi içinde üçe ayrılır: GENEL BÜTÇE (I sayılı cetvel: devlet tüzel kişiliğine dahil idareler, bakanlıklar, TBMM, yüksek mahkemeler), ÖZEL BÜTÇE (II sayılı cetvel: belirli bir kamu hizmeti için kurulan, gelir tahsis edilen, ayrı tüzel kişilikli idareler; üniversiteler, YÖK, TÜBİTAK gibi), DÜZENLEYİCİ VE DENETLEYİCİ KURUM BÜTÇESİ (III sayılı cetvel: SPK, BDDK, RTÜK, Rekabet Kurumu gibi bağımsız kurumlar). (2) SOSYAL GÜVENLİK KURUMU BÜTÇELERİ (IV sayılı cetvel: Sosyal Güvenlik Kurumu ve Türkiye İş Kurumu). (3) MAHALLÎ İDARE BÜTÇELERİ (il özel idareleri, belediyeler ve bağlı idareleri, mahallî idare birlikleri). Merkezi yönetim bütçesi TBMM\u0027de kanunla kabul edilir; sosyal güvenlik ve mahallî idare bütçeleri kendi yetkili organlarınca kabul edilir ve merkezi yönetim bütçe kanununa girmez. KÜÇÜK ÖRNEK: Bir devlet üniversitesinin bütçesi özel bütçedir; Rekabet Kurumunun bütçesi düzenleyici ve denetleyici kurum bütçesidir; bir belediyenin bütçesi mahallî idare bütçesidir ve TBMM onayından geçmez. SINAV TUZAĞI: (1) GENEL BÜTÇE ile GENEL YÖNETİM aynı şey değildir: genel yönetim üç türün toplamıdır, genel bütçe merkezi yönetimin bir alt türüdür. (2) Kamu iktisadi teşebbüsleri (KİT) bu bütçe türlerinin hiçbirine girmez. (3) Düzenleyici ve denetleyici kurumlar merkezi yönetim İÇİNDEDİR ama ayr…"}],"hakem":"Soru 5018 m.3\u0027te tanımlanan düzenleyici ve denetleyici kurum bütçesinin merkezi yönetim içinde III. sayılı cetvelde yer aldığını sorulmakta; kaynak metni bu kuralı açıkça desteklemektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Mahalli idareler (belediyeler ve il özel idareleri) merkezi yönetimin dışında, tamamen ayrı bir bütçe grubu oluştururlar. Düzenleyici ve denetleyici kurumlar merkezi yönetimin parçasıdır.","E":"Düzenleyici ve denetleyici kurumlar genel yönetimin içinde merkezi yönetim tarafında yer alır, dışında değildir. Genel yönetim dışında kalan birimler (örneğin kamu iktisadi teşebbüsleri) vardır ama bu kurumlar genel yönetimin içindedir.","D":"Genel bütçe birinci cetvelde yer alır ve merkezi yönetimin yalnızca bir alt türüdür. Düzenleyici ve denetleyici kurumlar bundan ayrı üçüncü cetvelde gösterilir.","B":"Sosyal güvenlik kurumları dördüncü cetvelde gösterilir; bunlar merkezi yönetim bütçesinin dışında, ayrı bir yönetim kolu olarak yer alır. Düzenleyici ve denetleyici kurumlar sosyal güvenlik kurumları değildir."},"dogru":"Düzenleyici ve denetleyici kurumlar (Rekabet Kurumu, Radyo Televizyon Üst Kurulu gibi) merkezi yönetimin içinde yer alırlar. Ancak genel bütçe ve özel bütçeden ayrı olarak, üçüncü cetvelde kendi aralarında gösterilir.","sinav":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu\u0027na göre düzenleyici ve denetleyici kurumlar merkezi yönetim bütçesine dahil olup, kanuna ekli üçüncü sayılı cetvelde ayrı bir cetvelde yer alır.","kavramlar":[{"kaynak":"TEORI","tanim":"Kanunla kurulan, idari ve malî özerkliği bulunan, belirli kamu hizmetlerini denetleyen ve düzenleyen kurul ve kurumlar (SPK, BDDK, RTÜK, Rekabet Kurumu gibi).","ad":"Düzenleyici ve Denetleyici Kurumlar"},{"kaynak":"TEORI","tanim":"5018 sayılı Kanuna ekli üç cetveldeki (genel bütçe, özel bütçe, düzenleyici ve denetleyici kurum bütçeleri) idarelerin bütçelerinden oluşan ve tek bir kanunla TBMM\u0027de kabul edilen bütçe türü.","ad":"Merkezi Yönetim Bütçesi"},{"kaynak":"TEORI","tanim":"Merkezi yönetim bütçesine dahil idarelerin gruplanması; birinci cetvelde genel bütçeli idareler, ikinci cetvelde özel bütçeli idareler, üçüncü cetvelde düzenleyici ve denetleyici kurumlar yer alır.","ad":"Cetveller"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"5018 sayılı Kanuna göre düzenleyici ve denetleyici kurumların bütçeleri hangi grupta yer alır?","kayitBaslik":"","id":"sgs-t4-maliye-zor/kp-13","verilenler":[{"deger":"Birinci genel bütçe, ikinci özel bütçe, üçüncü düzenleyici ve denetleyici kurum","anlam":"Merkezi yönetimin alt türlerini gösterir.","ad":"Cetveller"},{"deger":"Sosyal güvenlik kurumları","anlam":"Merkezi yönetimin değil genel yönetimin ayrı bir grubudur.","ad":"Dördüncü cetvel"}],"dayanak":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu m.3: merkezî yönetim kapsamındaki kamu idareleri kanuna ekli birinci, ikinci ve üçüncü sayılı cetvellerde yer alan kamu idarelerini, düzenleyici ve denetleyici kurumlar üçüncü sayılı cetvelde yer alan kurumları, sosyal güvenlik kurumları dördünc : OVP → OVMP → bütçe çağr…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.1","metin":"Madde 1- Bu Kanunun amacı, kalkınma planları ve programlarda yer alan politika ve hedefler doğrultusunda kamu kaynaklarının etkili, ekonomik ve verimli bir şekilde elde edilmesi ve kullanılmasını, hesap verebilirliği ve malî saydamlığı sağlamak üzere, kamu malî yönetiminin yapısını ve işleyişini, kamu bütçelerinin hazırlanmasını, uygulanmasını, tüm malî işlemlerin muhasebeleştirilmesini, raporlanmasını ve malî kontrolü düzenlemektir. Kapsam"}],"hakem":"Soru 5018 s.K. m.75\u0027e (bütçenin kabulü - 75 gün ve 55 gün) dayanmakta, hesaplama doğru (75-55=20), kural kaynaktan açıkça desteklenmekte, ders/konu/tek anlam/güncellik/atif tamamı uyumludur."},"kayitlar":[],"sade":{"siklar":{"C":"Matematikte 75\u0027ten 45 çıkarırsanız 30 bulursunuz ama soruda Komisyon süresi 55 gün olarak belirtilmiştir.","E":"Yılbaşı öncesi toplam 75 günlük sunum süresinin tamamını Genel Kurul süresi sanarsanız 75 dersiniz. Oysa Komisyon süresi bundan çıkartılmalıdır.","D":"Komisyonda görüşülen 55 günü doğrudan Genel Kurul süresi sanarsanız 55 dersiniz. Oysa bu 55 gün Komisyona aittir, Genel Kurul payı başkadır.","A":"Komisyon süresinin 60 gün olduğu yanılgısıyla 75\u0027ten 60 çıkarsanız 15 bulursunuz. Ama Komisyon süresi tam olarak 55 gündür."},"dogru":"Teklif yılbaşından 75 gün önce TBMM\u0027ye sunulur, Komisyonda 55 gün görüşülür. Kalan süre Genel Kurulda görüşülebilecek azami süredir: 75 − 55 = 20 gün.","sinav":"Kamu Malî Yönetimi ve Kontrol Kanunu\u0027nun bütçe kabul aşamasında merkezi yönetim bütçe kanun teklifi malî yılbaşından en az 75 gün önce TBMM\u0027ye sunulur, Plan ve Bütçe Komisyonunda en fazla 55 gün görüşülür, teklifin Genel Kurulda görüşülebileceği azami süre 20 gündür.","kavramlar":[{"kaynak":"TEORI","tanim":"Kamu idarelerinin gider teklifleri ve gelir tahminleri değerlendirilerek oluşturulan, TBMM tarafından kabul edilmesi gereken bütçe tasarısıdır.","ad":"Merkezi yönetim bütçe kanun tekli vermiş: teklif yılbaşından en az 75 gün önce TBMM\u0027ye sunulur. Komisyonda ise en fazla 55 gün görüşülür.","verilenAdim":true,"doldur":[[1,1],[2,1],[4,1],[5,1]]},{"formul":"Genel Kurul süresi = TBMM\u0027ye sunum süresi − Komisyon süresi = 75 (soruda verilen) − 55 (soruda verilen) = 20 gün","anlatim":"5018 sayılı Kanun\u0027a göre toplam süre 75 gün, bunun bir kısmı Komisyonda geçiyor. Kalan gün Genel Kurula ait olan azami süredir.","doldur":[[6,1]]},{"formul":"Sağlama: 55 (soruda verilen) + 20 (2. adımda bulduk) = 75 (soruda verilen) ✓","anlatim":"Sağlama yapalım: Komisyon 55 gün, Genel Kurul 20 gün, toplayınca 75 günü vermeli. Bu da sunum süresiyle eşleşiyor, demek ki doğru bulduk.","doldur":[]},{"formul":"Sonuç: Genel Kurul süresi = 20 gün","anlatim":"Sonuç olarak teklifin Genel Kurulda görüşülebileceği azami süre 20 gündür. Bu süre Anayasa\u0027da değil, 5018 sayılı Kanun\u0027da düzenlenmiştir.","doldur":[]},{"formul":"Yanlış yol: 75 + 55 = 130 gün (HATALI) → doğrusu 75 − 55 = 20 gün (2. adımda bulduk)","anlatim":"En sık hata: öğrenci 75 ile 55\u0027i toplayıp 130 gün bulur ama soru \u0027kalan süreyi\u0027 istiyor. Toplama değil çıkarma yapılması gerektiği kaçırılır.","doldur":[]}],"anahtar":[{"ornek":"komisyonda","kok":"komisy"},{"ornek":"görüşülür","kok":"görüşü"},{"ornek":"teklifi","kok":"teklif"},{"ornek":"yılbaşından","kok":"yılbaş"},{"ornek":"sunulur","kok":"sunulu"},{"ornek":"toplayınca","kok":"toplay"}],"konuGiris":{"harita":"Ne zaman test edilir: TBMM\u0027ye sunulan bütçe kanun teklifinin kabul sürecindeki gün sayıları sorulduğunda. Nasıl ölçülür: yasada belirtilen toplam süreden komisyon süresi çıkarılarak Genel Kurul süresi bulunur. Nasıl kaydedilir: 5018 sayılı Kanun\u0027daki sabit gün sayıları üzerinden basit çıkarma işlemiyle hesaplanır.","desen":"Sınav genellikle 75 gün ve 55 gün sayılarını verip aradaki farkı sordurur; tuzak, öğrencinin bu iki sayıyı toplamasıdır (p.28). Bazen hazırlık aşamalarının sırası da sorulur ama bu soru sayısal fark üzerine kurulu. Bu soru 5018 sayılı Kanun\u0027un kabul aşamasındaki süre sınırları noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Bütçe kanun teklifinin TBMM\u0027ye sunulacağı en az gün sayısı","ad":"Malî yılbaşı öncesi sunum süresi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Teklifin komisyonda görüşülebileceği en fazla gün sayısı","ad":"Plan ve Bütçe Komisyonu süresi","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Toplam sunum süresinden komisyon süresi çıkarılarak bulunan kalan süre","ad":"Genel Kurul süresi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Yürütmenin TBMM\u0027ye sunduğu, harcama izni veren bütçe belgesi","ad":"Merkezi yönetim bütçe kanun teklifi","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda TBMM\u0027ye sunum süresi ve komisyon süresi verilir, Genel Kurulda görüşülebilecek azami gün sayısı istenir.","panel_ornek":"Bir arkadaşın kirayı 10 ay içinde ödemesi gerekiyor: ilk 6 ay maaşından kesip biriktiriyor, kalan 4 ayda geri kalan borcu tamamlıyor. Toplam süre sabit, sadece iki dönem arasında paylaşım değişiyor.","ornek":"Bir arkadaşın kirayı 10 ay içinde ödemesi gerekiyor: ilk 6 ay maaşından kesip biriktiriyor, kalan 4 ayda geri kalan borcu tamamlıyor. Toplam süre sabit, sadece iki dönem arasında paylaşım değişiyor.","yontemler":"Toplam süreden komisyon süresi çıkarılır; kalan sayı Genel Kurul süresidir.","nedir":"Bütçe hazırlama süreci, merkezi yönetim bütçesinin nasıl hazırlanıp TBMM\u0027de kabul edildiğini anlatan aşamalardır. Sınav bu aşamaların sırasını ve kanundaki süre sınırlarını ölçer."},"olay":"75-55=20.","tuzak":{"C":{"ad":"Aritmetik Hata Tuzağı","metin":"75\u0027ten 55 yerine 45 düşersen 30 bulursun. Doğrusu: Doğru çıkarma 75-55=20\u0027dir."},"E":{"ad":"Toplam Süre Tuzağı","metin":"Yılbaşı öncesi toplam sunum süresini Genel Kurul süresi sanırsan 75 dersin. Doğrusu: 75 gün TBMM\u0027ye sunumdan yılbaşına kalan toplam süredir, Genel Ku ,"dogru":"Bütçe hazırlanmaya başlamadan önce gelecek üç yılın gelir-gider hedeflerini belirleyen orta vadeli program yazılır; bu belge diğer tüm bütçe belgelerine temel oluşturur.","sinav":"Bütçe süreci hazırlık aşaması orta vadeli program ile başlar; ardından orta vadeli mali plan, bütçe çağrısı ve bütçe hazırlama rehberi hazırlanır.","kavramlar":[{"kaynak":"Kamu Malî Yönetimi K. 3. madde","tanim":"Kamu idarelerinin orta ve uzun vadeli amaçlarını, temel ilke ve politikalarını, hedef ve önceliklerini, performans ölçütlerini ve kaynak dağılımlarını belirten plandır.","ad":"Orta vadeli program"},{"kaynak":"TEORI","tanim":"Gelecek üç yılın gelir ve gider tahminleri, hedef açık, borçlanma durumu ve ödenek teklif tavanlarını gösteren plandır.","ad":"Orta vadeli mali plan"},{"kaynak":"TEORI","tanim":"Hazırlık, kabul, uygulama ve denetim aşamalarından oluşan ve mali yılda yürütülen süreçtir.","ad":"Bütçe süreci"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"Bütçe sürecinde aşağıdakilerden hangisi en önce hazırlanır?","kayitBaslik":"","id":"sgs-t4-maliye-zor/kp-12","verilenler":[{"deger":"Orta vadeli program, orta vadeli mali plan, bütçe çağrısı ve rehberi","anlam":"Belgelerin yayımlanma sırasıdır.","ad":"Hazırlık sırası"},{"deger":"Üç yıllık gelir gider tahminleri ve ödenek tavanları","anlam":"İdare tekliflerinin sınırını belirler.","ad":"Mali plan içeriği"}],"dayanak":"Teori notu: bütçe hazırlama süreci — süreç orta vadeli program ile başlar, ardından orta vadeli mali plan hazırlanır ve gelecek üç yılın gelir gider tahminleri, hedef açık ve ödenek teklif tavanları belirlenir, sonra bütçe çağrısı ve ekindeki bütçe hazırlama rehberi ile yatırım genelgesi ve yatırım programı hazırlama rehberi yayımlanır; kamu idareleri stratejik plan ve performans programlarıyla uyumlu gider tekliflerini hazırlar ve merkezi yönetim bütçe kanun teklifi oluşturulur","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Adım 1 = Orta vadeli program makro hedefleri koyar","anlatim":"Büyüme, enflasyon ve açık hedefleri bu belgede belirlenir.","doldur":[]},{"formul":"Adım 2 = Orta vadeli mali plan ödenek teklif tavanlarını verir","anlatim":"Gelecek üç yılın gelir ve gider tahminleri ile hedef açık burada yer alır.","doldur":[[5,1]]},{"formul":"Adım 3 = Bütçe çağrısı ve rehberler yayımlanır, idareler teklif hazırlar","anlatim":"Yatırım genelgesi ve yatırım programı hazırlama rehberi de bu aşamada yayımlanır. Teklifler değerlendirilerek kanun teklifi oluşturulur.","doldur":[[6,1]]}],"anahtar":[{"ornek":"hazırlık","kok":"hazırl"},{"ornek":"program","kok":"progra"},{"ornek":"yatırım","kok":"yatırı"},{"ornek":"rehberi","kok":"rehber"},{"ornek":"vadeli","kok":"vadeli"},{"ornek":"tekliflerini","kok":"teklif"}],"konuGiris":{"harita":"Ne zaman test edilir: hazırlık aşamasının sıralaması sorulduğunda test edilir. Nasıl ölçülür: hangi belgenin diğerinden önce geldiği doğru sıralanarak ölçülür. Nasıl kaydedilir: süreç Orta Vadeli Program\u0027dan başlayıp Genel Kurul kabulüne kadar aşama aşama takip edilir.","desen":"Soru genelde hazırlık aşamasının ilk adımını veya doğru sıralamasını sorar; öğrenciler bütçe çağrısını veya idare tekliflerini başa koyup tuzağa düşer. TBMM\u0027ye sunulan kanun teklifiyle sürecin başlangıcı sık karıştırılır. Bu soru hazırlık aşamasının sıralaması noktasından geliyor (p.28).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Hazırlık sürecini başlatan, genel politika hedeflerini koyan ilk belge","ad":"Orta Vadeli Program","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Gelecek üç yılın gelir gider tahminleri ile ödenek tavanlarını gösteren belge","ad":"Orta Vadeli Malî Plan","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"İdarelerin teklif hazırlarken uyacağı kuralları belirleyen resmi genelge","ad":"Bütçe Çağrısı ve Rehberi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tüm idare tekliflerinin birleştirildiği, TBMM\u0027ye sunulan nihai belge","ad":"Merkezi Yönetim Bütçe Kanun Teklifi","kim":"kanun sabitler"}],"sinavda":"Soru bütçe sürecinin hazırlık aşamasındaki belgelerin sırasını verir ve hangisinin ilk olduğunu ister.","panel_ornek":"Bir arkadaşın ev kiralamadan önce önce ne kadar maaş alacağını tahmin eder, sonra hangi semtte oturacağına karar verir, en son kirayı öder. Sıra bozulursa plan da bozulur; mesela önce kirayı ödeyip sonra bütçe yapamaz.","ornek":"Bir arkadaşın ev kiralamadan önce önce ne kadar maaş alacağını tahmin eder, sonra hangi semtte oturacağına karar verir, en son kirayı öder. Sıra bozulursa plan da bozulur; mesela önce kirayı ödeyip sonra bütçe yapamaz.","yontemler":"Sıralamayı ezberlemek yerine mantık kurulur: önce genel politika (OVP), sonra sayısal çerçeve (OVMP), sonra uygulama rehberi, en son teklif. Tek kritik kural: OVP her zaman ilk sıradadır.","nedir":"Bütçe hazırlama süreci, devletin gelir-gider tahminlerinin hangi sırayla ve kim tarafından hazırlandığını anlatır. Sınav burada hangi belgenin en önce geldiğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Sıra Tuzağı","metin":"Yatırım genelgesi bütçe çağrısıyla aynı aşamada, programlardan sonra yayımlanır. Doğrusu: ilk belge orta vadeli programdır."},"E":{"ad":"Sıra Tuzağı","metin":"Bütçe hazırlama rehberi bütçe çağrısının ekidir. Doğrusu: ilk belge orta vadeli programdır."},"A":{"ad":"Sıra Tuzağı","metin":"Bütçe çağrısı, orta vadeli program ve orta vadeli mali plandan sonra yayımlanır. Doğrusu: süreç orta vadeli programla başlar."},"B":{"ad":"Sıra Tuzağı","metin":"Orta vadeli mali plan, orta vadeli programın ardından hazırlanır. Doğrusu: ilk belge orta vadeli programdır."}},"celdiriciYol":{},"hap":"Bütçe süreci belgeyle değil politikayla başlar: önce orta vadeli program, sonra mali plan, en son bütçe belgeleri gelir.","teshis":{"C":{"gercek":"Süreç önce makro politika çerçevesiyle başlar; orta vadeli program hedefleri koyar, mali plan bu hedeflere göre ödenek tavanlarını verir, bütçe belgeleri en son gelir.","ayirt":"İlk belge hedefleri mi, ödenekleri mi belirliyor?","paragraf":"Bütçe hazırlama süreci notu","yanilgi":"Bu şıkkı eleyen öğrenci, bütçe sürecinin doğrudan bütçe belgeleriyle başladığını düşünür."},"E":{"gercek":"Bütçe hazırlama rehberi bütçe çağrısının ekidir.","ayirt":"Belge tek başına mı yayımlanıyor?","paragraf":"Bütçe hazırlama süreci notu","yanilgi":"Rehberi bağımsız bir başlangıç belgesi sanıyorsun."},"A":{"gercek":"Çağrı yapılmadan önce makro çerçeve ve ödenek tavanları belirlenir.","ayirt":"Tavanlar belirlenmeden çağrı yapılabilir mi?","paragraf":"Bütçe hazırlama süreci notu","yanilgi":"Süreci idarelere yapılan çağrıyla başlatıyorsun."},"D":{"gercek":"Yatırım genelgesi ve rehberi bütçe çağrısıyla birlikte, programlardan sonra yayımlanır.","ayirt":"Belge hangi aşamada yayımlanıyor?","paragraf":"Bütçe hazırlama süreci notu","yanilgi":"Yatırım belgelerini sürecin başında sanıyorsun."},"B":{"gercek":"Önce orta vadeli program, sonra orta vadeli mali plan gelir.","ayirt":"Hangi belge makro çerçeveyi çiziyor?","paragraf":"Bütçe hazırlama süreci notu","yanilgi":"İki orta vadeli belgeyi aynı anda hazırlanıyor sanıyorsun."}},"verilen":[[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 96"},"kural":"Dolaylı vergiler objektiftir, mükellefin kişisel ve ailevi durumu dikkate alınmaz; bu ölçüt yalnız gelir ve servet üzerinden alınan dolaysız vergilerde uygulanır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 96","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Kişisel durum\u0027 ibaresi geçen şıkkı dolaylı vergide değil dolaysız vergide ara; bu ayrım sınavın en sık kurduğu tuzaktır.","konu":"dolaylı vergiler ozellikleri","tablo":{"satirlar":[["A) Vergiyi kanunen ödeyen ile vergi yükünü fiilen taşıyan k…","TEORİ - Dolaylı Vergilerin Özellikleri","doğru ifade"],["B) Herkes aynı oranı ödediği halde, düşük gelirlinin geliri…","TEORİ - Tersine Artan Oranlı Etki","doğru ifade"],["C) Verginin alınmasında mükellefin kişisel ve ailevi durumu…","TEORİ - Dolaylı/Dolaysız Vergi Ayrımı","YANLIŞ ifade"],["D) Verginin fiyatın içine gizlenmesi nedeniyle mükellef üze…","TEORİ - Mali Anestezi","doğru ifade"],["E) Az sayıda satıcıdan tahsil edildiğinden toplanması görec…","TEORİ - Tahsil Kolaylığı ve Verimlilik","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Verginin alınmasında mükellefin kişisel ve ailevi durumu esas alınır.","E":"Az sayıda satıcıdan tahsil edildiğinden toplanması görece kolay ve verimlidir.","A":"Vergiyi kanunen ödeyen ile vergi yükünü fiilen taşıyan kişi birbirinden farklı olabilir.","D":"Verginin fiyatın içine gizlenmesi nedeniyle mükellef üzerinde hissedilen tepki düşüktür.","B":"Herkes aynı oranı ödediği halde, düşük gelirlinin gelirine oranla katlandığı yük daha fazladır."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - dolayli vergiler ozellikleri","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: DOLAYLI VERGİLER mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü vergilerdir: katma değer vergisi, özel tüketim vergisi, gümrük vergisi, banka ve sigorta muameleleri vergisi, özel iletişim vergisi, damga vergisi. DOLAYSIZ VERGİLER gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınır: gelir vergisi, kurumlar vergisi, motorlu taşıtlar vergisi, emlak vergisi, veraset ve intikal vergisi. DOLAYLI VERGİLERİN ÖZELLİKLERİ: (1) YANSITILABİLİR: Kanuni mükellef (satıcı) vergiyi fiyata ekleyerek nihai tüketiciye aktarır; vergiyi fiilen taşıyan ile ödeyen ayrıdır. (2) TERSİNE ARTAN ORANLI (regresif) ETKİ: Herkes aynı oranı öder ama düşük gelirli gelirinin daha büyük kısmını tüketime ayırdığından vergi yükü gelire göre azalır; bu yüzden adaletsiz sayılır. (3) MALÎ ANESTEZİ: Vergi fiyatın içinde olduğundan hissedilmez, direnç düşüktür. (4) TAHSİLİ KOLAY VE VERİMLİ: Az sayıda satıcıdan toplanır, kaçak görece azdır, hasılat konjonktüre hızlı tepki verir. (5) Kişisel durumu dikkate almaz (objektif vergi). (6) Esnekliği düşük mallarda yansıma tüketiciye, yüksek mallarda satıcıya kalır. KÜÇÜK ÖRNEK: Asgari ücretli ile yüksek gelirli aynı ekmeği alırken aynı KDV\u0027yi öder; ödenen vergi asgari ücretlinin gelirine oranla daha büyüktür. SINAV TUZAĞI: (1) Katma değer vergisi ARTAN ORANLI değildir; tek ya da birkaç düz oran uygulanır, etkisi tersine artan oranlıdır. (2) Motorlu taşıtlar vergisi ve emlak vergisi DOLAYSIZdır (servet vergisi). (3) \u0027Dolaylı vergiler adaletli, dolaysız vergiler ver…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.27 [1/2]","metin":"Madde 27- Niteliğinden dolayı malî yılla sınırlı tutulamayan ve sürekliliği bulunan aşağıdaki iş ve hizmetler için; her iş itibarıyla, bütçelerinde öngörülen ödeneklerin yüzde ellisini, izleyen yılın Haziran ayını geçmemek ve yüklenme süresi on iki ayı aşmamak üzere, ilgili üst yöneticinin onayıyla ertesi yıla geçen yüklenmelere girişilebilir: a) Türk Silahlı Kuvvetlerinin yapım, onarım, etüt ve proje işleri, araştırma-geliştirme projeleri, giyecek ve yiyecek alımları, makine-teçhizat, silah-mühimmat-teçhizat alımlarıyla 2/7/2018 tarihli ve 703 sayılı Kanun Hükmünde Kararnamenin 213 üncü maddesiyle bu fıkranın birinci cümlesinde yer alan “sözleşme esaslarına veya kanun” ibaresinden sonra gelmek üzere “veya Cumhurbaşkanlığı kararnamesi” ibaresi eklenmiştir. 43 bunların bakım, onarım ve imalat işleri. b) Yiyecek, yakacak, akaryakıt ve madeni yağ ihtiyaçları. c) Temini ve korunması güç olan ilaç, aşı, serum ve tıbbi sarf malzemeleri. d) Süreli yayın alımı, taşıma, koruma ve güvenlik, temizlik ve yemek hizmetleri.44 e) (Değişik: 22/12/2005-5436/10 md.) Taşıtların malî sorumluluk sigortası ile yurt dışından tedariki yapılan silah, silah-teçhizat ve mühimmat sevkinin her türlü riske karşı sigortalanması amacıyla yaptırılan nakliyat sigortası. f) (Değişik: 22/12/2005-5436/10 md.) Makine-teçhizat, yol ve otoyol, bilgisayar ve haberleşme sistemlerinin bakım işleri; her türlü onarım işleri ile elektronik bilgi erişim hizmetleri."}],"hakem":"Dolaylı vergilerin ortak özelliklerine ilişkin soru, kaynak metinde açıkça tanımlanan ve listelenen özelliklere (yansıtılabilir, regresif etki, malî anestezi, tahsili kolay, objektif/kişisel durum dikkate almaz) dayanmakta; C şıkkı (kişisel ve ailevi durumun esas alınması) bu özelliklerle çelişmekte ve soruya doğru cevap oluşturmaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Vergi fiyatın içinde olduğundan hissedilmez ve dirençle karşılaşmaz. Mali anestezi dolaylı vergilerin kendi özelliğidir, doğrudur.","E":"Az sayıda satıcıdan toplanması vergiyi tahsili kolay ve verimli kılar. Dolaylı vergilerin verimlilik özelliğidir, doğrudur.","A":"Satıcı vergisini fiyata ekleyip alıcıya aktarabilir. Bu, dolaylı vergilerin yansıtılabilir özelliğidir ve doğrudur.","B":"Aynı oranı ödese de düşük gelirli kişi gelirinin daha büyük kısmını tükettiğinden, vergi yükü ona daha ağır basar. Dolaylı vergilerin regresif etkisini anlatır, doğrudur."},"dogru":"Dolaylı vergiler mal ve hizmet satışına gömülü vergilerdir. Kişinin gelir durumuna, yaşına, ailesi olup olmamasına bakmadan aynı oranda uygulanırlar. Kişisel durumu dikkate almak yalnız gelir vergisi gibi dolaysız vergilerin özelliğidir.","sinav":"Dolaylı vergilerin ortak özelliklerine ilişkin olarak, mükellefin kişisel ve ailevi durumunun esas alınması bu vergiler için söylenemez; bu ölçüt yalnız gelir ve servet üzerinden alınan dolaysız vergilerde uygulanır.","kavramlar":[{"kaynak":"TEORI","tanim":"Mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü vergilerdir. Kanuni mükellef satıcı olup, vergiyi fiyata ekleyerek nihai tüketiciye aktarır.","ad":"Dolaylı vergiler"},{"kaynak":"TEORI","tanim":"Gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınan vergilerdir. Mükellefin yaşı, ailesi, gelir düzeyi gibi özel durumları dikkate alınır.","ad":"Dolaysız vergiler"},{"kaynak":"TEORI","tanim":"Vergi fiyatın içine gömülü olduğundan tüketici tarafından direkt olarak hissedilmemesi, dolayısıyla vergi konusunda direnç düşük kalmasıdır.","ad":"Mali anestezi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Dolaylı vergilerin ortak özelliklerine ilişkin olarak aşağıdakilerden hangisi bu vergiler için söylenemez?","kayitBaslik":"","id":"sgs-t1-genel-maliye-cokzor/kp-22","verilenler":[],"dayanak":"TEORİ - Vergileme İlkeleri ve Temel Vergi Kavramları (Öğreti Notu)","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Ahmet, İzmir\u0027de küçük bir bakkal işletiyor. 15 Mart\u0027ta bir kilo şeker satarken 2 TL katma değer vergisini fiyata ekliyor, hem asgari ücretli müşteri hem de zengin müşteri aynı 2 TL\u0027yi ödüyor.","anlatim":"Ahmet vergiyi devlete o yatırıyor ama parayı cebinden değil müşterinin cebinden çıkarıyor. Bu dolaylı vergi mantığının tam kendisi.","doldur":[]},{"formul":"Ne yapacağız: Ahmet\u0027in bakkalındaki bu 2 TL KDV üzerinden dolaylı vergilerin beş özelliğini tek tek test edeceğiz; hangisi bu vergiye uymuyor bulacağız.","anlatim":"Kural şu: dolaylı vergi yansıtılır, tersine artan oranlıdır, hissedilmez, tahsili kolaydır, kişisel duruma bakmaz. Beş ifadeyi Ahmet\u0027in bakkalında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TEORİ - Dolaylı Vergilerin Özellikleri","karar":"doğru","anlatim":"Ahmet kanuni mükellef, müşteri fiili yüklenici; ikisi ayrı kişi. Bu yansıtılabilirlik dolaylı vergilerin temel özelliği.","formul":"Şık A: Ahmet vergiyi devlete öduyor ama şekeri alan müşteri parayı fiilen taşıyor, bu doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TEORİ - Tersine Artan Oranlı Etki","karar":"doğru","anlatim":"Asgari ücretli gelirinin büyük kısmını tüketime ayırır, zengin ayırmaz. Bu yüzden aynı oran, gelire göre tersine artan bir yük yaratır.","formul":"Şık B: Asgari ücretli müşteri de zengin müşteri de aynı 2 TL\u0027yi öderken, asgari ücretlinin gelirine oranla yükü daha ağır mı biner?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TEORİ - Dolaylı/Dolaysız Vergi Ayrımı","karar":"yanlış","anlatim":"Hayır, Ahmet kime satarsa satsın aynı oranı uygular, kişisel-ailevi durum burada hiç sorulmaz. Bu ölçüt sadece gelir ve servet vergilerinde, yani dolaysız vergilerde geçerli.","formul":"Şık C: Ahmet müşteriden \u0027senin evli çocuklu olman, gelirin az olması bu KDV\u0027yi düşürür mü\u0027 diye sorsa, cevap değişir mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TEORİ - Mali Anestezi","karar":"doğru","anlatim":"Fiyatın içine gizlendiği için müşteri ayrı bir tepki göstermiyor, sanki sadece şeker parası ödemiş gibi. Bu mali anestezi dediğimiz şey.","formul":"Şık D: Müşteri fişi görmeden şekeri alıp gidiyor, o 2 TL\u0027yi ayrı bir vergi olarak hissediyor mu yoksa fiyatın içinde mi kayboluyor?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TEORİ - Tahsil Kolaylığı ve Verimlilik","karar":"doğru","anlatim":"Devlet tek tek tüketiciyi kovalamak yerine az sayıda satıcıdan toplar, iş kolaylaşır ve hasılat verimli akar. Bu da dolaylı vergilerin bilinen üstünlüğü.","formul":"Şık E: Devlet bu KDV\u0027yi milyonlarca müşteriden değil, sadece Ahmet gibi satıcılardan tahsil ediyor; bu tahsili kolaylaştırır mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Ahmet\u0027in bakkalındaki KDV kimin ailesi kaç kişi diye sormaz, sadece şekere bakar; kişisel durum sorgusu dolaysız vergilerin işidir. Kendine hep şunu sor: bu vergi kime değil, neye bakıyor?","doldur":[]}],"anahtar":[{"ornek":"vergiler","kok":"vergil"},{"ornek":"dolaylı","kok":"dolayl"},{"ornek":"kişisel","kok":"kişise"},{"ornek":"sadece","kok":"sadece"},{"ornek":"ailevi","kok":"ailevi"},{"ornek":"mükellefin","kok":"mükell"}],"konuGiris":{"harita":"Ne zaman test edilir: dolaylı vergilerin hangi özelliği taşımadığı ya da hangi verginin dolaylı olmadığı sorulduğunda. Nasıl ölçülür: yansıma, tersine artan oranlılık, malî anestezi ve tahsil kolaylığı gibi özelliklerin doğru vergiyle eşleşip eşleşmediğine bakılır. Nasıl kaydedilir: doğru cevap, listedeki özelliklerden HANGİSİNİN dolaylı vergiye ait olmadığını gösteren şık olarak işaretlenir.","desen":"Tuzak, KDV\u0027nin artan oranlı sanılması ya da motorlu taşıtlar/emlak vergisinin dolaylı vergi sayılmasıdır; oysa bunlar servet üzerinden alınan dolaysız vergilerdir. Bir diğer tuzak \u0027dolaylı adaletli, dolaysız verimli\u0027 cümlesinin tersten kurulmasıdır. Arşivde bu konu 1 dönemde soruldu. Bu soru dolaylı vergilerin özellikleri maddesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Vergiyi ödeyen satıcının, yükü fiyata ekleyip tüketiciye aktarması","ad":"Yansıma","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Aynı oran herkese uygulanırken düşük gelirlinin yükünün oransal olarak daha ağır kalması","ad":"Tersine artan oranlılık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Vergi fiyata gömülü olduğundan mükellefin bunu hissetmemesi","ad":"Malî anestezi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Mükellefin kişisel gelir ya da servet durumunun hesaba katılmaması","ad":"Objektif vergi","kim":"kanun sabitler"}],"sinavda":"Soruda dolaylı vergi özelliklerine ait beş ifade verilir, hangisinin bu vergilere ait OLMADIĞI sorulur.","panel_ornek":"Bir markette 40 liralık deterjanı alan hem asgari ücretli hem de zengin müşteri aynı KDV\u0027yi öder. Ama bu 40 lira asgari ücretlinin gelirine oranla çok daha büyük bir paydır, zenginin gelirine oranla küçüktür.","ornek":"Bir markette 40 liralık deterjanı alan hem asgari ücretli hem de zengin müşteri aynı KDV\u0027yi öder. Ama bu 40 lira asgari ücretlinin gelirine oranla çok daha büyük bir paydır, zenginin gelirine oranla küçüktür.","yontemler":"Her şıkta önce verginin dolaylı mı dolaysız mı olduğunu belirle, sonra özelliği o vergiyle eşleştir; tek bir uyumsuz eşleşme cevaptır.","nedir":"Dolaylı vergiler mal ve hizmet alışverişi üzerinden alınıp fiyata gömülen vergilerdir. Bu soru bu vergilerin ortak özelliklerini sınav düzeyinde bilip bilmediğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Mali Anestezi Tuzağı","metin":"D\u0027yi işaretleyen öğrenci hissedilmeme etkisini dolaysız vergiye mal eder. Doğrusu: vergi fiyata gömülü olduğundan direnç düşüktür, bu dolaylı verginin kendi özelliğidir."},"E":{"ad":"Verimlilik Tuzağı","metin":"E\u0027yi işaretleyen öğrenci tahsil kolaylığını adaletle karıştırıp bunun dolaylı vergiye ait olmadığını düşünür. Doğrusu: az sayıda satıcıdan toplanması dolaylı vergiyi tahsili kolay ve verimli kılar, bu doğru bir özelliktir."},"A":{"ad":"Yansıma Tuzağı","metin":"A\u0027yı işaretleyen öğrenci yansıtılabilirliği dolaysız vergilere özgü sanır. Doğrusu: kanuni mükellefin vergiyi fiyata ekleyip nihai tüketiciye aktarması dolaylı vergilerin tam da özelliğidir, bu ifade doğrudur."},"B":{"ad":"Regresif Etki Tuzağı","metin":"B\u0027yi işaretleyen öğrenci tersine artan oranlı etkiyi dolaysız vergilere ait sanır. Doğrusu: düz oranlı dolaylı vergide düşük gelirli gelirinin daha büyük kısmını tükettiğinden yük gelire göre azalır, bu doğru bir özelliktir."}},"celdiriciYol":null,"hap":"Dolaylı vergiler objektiftir; mükellefin kişisel-ailevi durumunu değil, harcamayı vergilendirir.","teshis":{"C":{"gercek":"Dolaylı vergiler mal ve hizmet üzerinden objektif olarak alınır; kişisel-ailevi durum yalnız gelir/servet vergilerinde (dolaysız vergilerde) esas alınır.","ayirt":"Bu vergi kimin aldığına değil neyin alındığına mı bakıyor?","paragraf":"TEORİ - Dolaylı/Dolaysız Vergi Ayrımı","yanilgi":"Kişisel/ailevi durumun dikkate alınmasını genel bir vergi ilkesi sanıp dolaylı vergiye de uyguluyorsun."},"E":{"gercek":"Az sayıda satıcıdan toplanması dolaylı vergiyi tahsili kolay ve konjonktüre duyarlı, verimli bir gelir kaynağı yapar.","ayirt":"Bu vergiyi devle irli aynı ekmeği alırken aynı KDV\u0027yi öder; ödenen vergi asgari ücretlinin gelirine oranla daha büyüktür. SINAV TUZAĞI: (1) Katma değer vergisi ARTAN ORANLI değildir; tek ya da birkaç düz oran uygulanır, etkisi tersine artan oranlıdır. (2) Motorlu taşıtlar vergisi ve emlak vergisi DOLAYSIZdır (servet vergisi). (3) \u0027Dolaylı vergiler adaletli, dolaysız vergiler ver…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.27 [1/2]","metin":"Madde 27- Niteliğinden dolayı malî yılla sınırlı tutulamayan ve sürekliliği bulunan aşağıdaki iş ve hizmetler için; her iş itibarıyla, bütçelerinde öngörülen ödeneklerin yüzde ellisini, izleyen yılın Haziran ayını geçmemek ve yüklenme süresi on iki ayı aşmamak üzere, ilgili üst yöneticinin onayıyla ertesi yıla geçen yüklenmelere girişilebilir: a) Türk Silahlı Kuvvetlerinin yapım, onarım, etüt ve proje işleri, araştırma-geliştirme projeleri, giyecek ve yiyecek alımları, makine-teçhizat, silah-mühimmat-teçhizat alımlarıyla 2/7/2018 tarihli ve 703 sayılı Kanun Hükmünde Kararnamenin 213 üncü maddesiyle bu fıkranın birinci cümlesinde yer alan “sözleşme esaslarına veya kanun” ibaresinden sonra gelmek üzere “veya Cumhurbaşkanlığı kararnamesi” ibaresi eklenmiştir. 43 bunların bakım, onarım ve imalat işleri. b) Yiyecek, yakacak, akaryakıt ve madeni yağ ihtiyaçları. c) Temini ve korunması güç olan ilaç, aşı, serum ve tıbbi sarf malzemeleri. d) Süreli yayın alımı, taşıma, koruma ve güvenlik, temizlik ve yemek hizmetleri.44 e) (Değişik: 22/12/2005-5436/10 md.) Taşıtların malî sorumluluk sigortası ile yurt dışından tedariki yapılan silah, silah-teçhizat ve mühimmat sevkinin her türlü riske karşı sigortalanması amacıyla yaptırılan nakliyat sigortası. f) (Değişik: 22/12/2005-5436/10 md.) Makine-teçhizat, yol ve otoyol, bilgisayar ve haberleşme sistemlerinin bakım işleri; her türlü onarım işleri ile elektronik bilgi erişim hizmetleri."}],"hakem":"Soru dolaylı vergiler özelliklerini ölçmektedir; motorlu taşıtlar vergisinin dolaysız (servet) vergi olduğu kaynak metinde açıkça tanımlanmıştır ve B şıkkı (yanlış olduğu için doğru cevap) bu tanımla tutarlıdır."},"kayitlar":[],"sade":{"siklar":{"C":"Herkes aynı oranı ödemesine rağmen düşük gelirli daha büyük payını tüketime ayırdığından vergi yükü gelire göre azalır; tersine artan oranlı etki gerçekten oluşur.","E":"Dolaylı vergiler mükellefin gelir, aile durumu gibi kişisel koşullarına bakılmaksızın alındığından objektif vergilerdir; bu ifade doğrudur.","A":"Katma değer vergisi mal ve hizmetlerin satışı üzerinden fiyatın içine gömülü alınan vergiler arasında sayıldığından dolaylı vergidir; bu ifade doğrudur.","D":"Vergi fiyatın içinde olduğundan hissedilmez; bu malî anestezi etkisi dolaylı vergilerin asıl özelliğidir.","B":"Motorlu taşıtlar vergisi servet vergisi olup mükellefin kişisel durumuna bakılarak alınan dolaysız vergilerdendir; bu ifade yanlıştır."},"dogru":"Motorlu taşıtlar vergisi servet üzerinden alınan bir vergidir; dolaysız vergiler arasında yer alır. Soruda dolaylı vergilerin özelliklerine aykırı olan şık sorulduğu için bu yanlış cevaptır.","sinav":"Motorlu taşıtlar vergisi dolaysız bir vergidir, dolaylı değildir.","kavramlar":[{"kaynak":"TEORI","tanim":"Mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü vergilerdir. Kanuni mükellef bu vergiyi fiyata ekleyerek nihai tüketiciye aktarır.","ad":"Dolaylı vergiler"},{"kaynak":"TEORI","tanim":"Gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınan vergilerdir. Fiili yükümlü ile kanuni mükellef aynı kişidir.","ad":"Dolaysız vergiler"},{"kaynak":"TEORI","tanim":"Aynı vergi oranı uygulanmasına rağmen düşük gelirli kişilerin gelirinin daha büyük kısmının vergi yükü altında kalması sonucudur.","ad":"Tersine artan oranlı etki"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Dolaylı vergilerin özelliklerine ilişkin aşağıdakilerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-genel-maliye-zor/kp-22","verilenler":[],"dayanak":"TEORİ - dolaylı vergiler özellikleri (öğreti notu)","dogru":"B","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Bir belediye, sınırları içindeki bakkaldan alınan ekmekte %1 KDV alıyor; aynı gün araç sahibi Ahmet\u0027ten de motorlu taşıtlar vergisi tahsil ediyor.","anlatim":"Bakkaldaki ekmeği hem asgari ücretli hem de zengin aynı fiyattan alıp aynı KDV\u0027yi ödüyor. Ahmet\u0027in arabası için ödediği vergi ise arabaya sahip olmasından doğuyor, alışveriş yapmasından değil.","doldur":[]},{"formul":"Ne yapacağız: bu olayda geçen KDV ve motorlu taşıtlar vergisini, beş şıktaki ifadelerle tek tek karşılaştıracağız.","anlatim":"Kural basit: mal-hizmet işlemi üzerinden alınan vergi dolaylıdır, servet ya da gelir üzerinden kişisel duruma bakılmaksızın alınan vergi dolaysızdır. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.KDV-listesi","karar":"doğru","anlatim":"Ekmeği kim alırsa alsın fiyatın içinde gizli bu vergi ödeniyor, bu tam bir mal-hizmet işlemi vergisi. KDV listedeki dolaylı vergilerin başında sayılıyor.","formul":"Şık A: bakkaldaki ekmekten alınan KDV\u0027yi \u0027dolaylı vergidir\u0027 diye işaretler misin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.dolaysız-liste","karar":"yanlış","anlatim":"Ahmet bu vergiyi bir alışveriş yaptığı için değil, arabaya sahip olduğu için ödüyor; yani servet üzerinden alınıyor. Kaynak bu vergiyi açıkça dolaysız vergiler arasında sayıyor.","formul":"Şık B: Ahmet\u0027in arabası için ödediği motorlu taşıtlar vergisini \u0027dolaylı vergidir\u0027 diye işaretler misin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.tersine-artan-oranlı","karar":"doğru","anlatim":"Asgari ücretli geliri içinde bu vergi daha büyük bir pay tutuyor, zenginde ise küçük bir pay. Oran aynı olsa da yük ters yönde artıyor, kural bunu tersine artan oranlı diye adlandırıyor.","formul":"Şık C: asgari ücretli ile zenginin aynı ekmekte aynı KDV\u0027yi ödemesi \u0027tersine artan oranlı etki yaratır\u0027 der misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.malî-anestezi","karar":"doğru","anlatim":"Ekmeği alan kişi çoğu zaman verginin varlığını hissetmiyor çünkü fiyata gömülü. Bu duygusuzluk hâli kaynakta tam olarak malî anestezi diye geçiyor.","formul":"Şık D: bakkaldaki müşterinin fiyatın içindeki KDV\u0027yi fark etmemesine \u0027malî anestezi\u0027 der misin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.objektif-vergi","karar":"doğru","anlatim":"Kim olursa olsun, ne kadar geliri olursa olsun ekmeği alan aynı KDV\u0027yi öder. Kişisel durum burada hiç sorulmuyor, kural buna objektif vergi diyor.","formul":"Şık E: bakkaldaki KDV\u0027nin asgari ücretliye de zengine de aynı şekilde uygulanmasını \u0027mükellefin kişisel durumunu dikkate almayan objektif vergi\u0027 der misin?"},{"formul":"Kapanış: A ✓ B ✗ C ✓ D ✓ E ✓","anlatim":"Bu vergiyi mükellef bir alışveriş yaptığı için mi, yoksa bir şeye sahip olduğu için mi ödüyor diye kendine sor.","doldur":[]}],"anahtar":[{"ornek":"vergisi","kok":"vergis"},{"ornek":"üzerinden","kok":"üzerin"},{"ornek":"ekmeği","kok":"ekmeği"},{"ornek":"servet","kok":"servet"},{"ornek":"dolaysızdır","kok":"dolays"},{"ornek":"ödüyor","kok":"ödüyor"}],"konuGiris":{"harita":"Hangi vergi türü sorulur: KDV, ÖTV, gümrük vergisi gibi harcama üzerinden alınan vergiler mi yoksa gelir-servet vergisi mi diye ayrılır. Nasıl ölçülür: verginin yansıtılabilir, tersine artan oranlı, mali anestezili ve tahsili kolay olup olmadığı kontrol edilir. Nasıl kaydedilir: soru köklerinde \u0027özelliklerinden değildir\u0027 veya \u0027hangisi dolaylı vergidir\u0027 şeklinde işaretlenir.","desen":"Sınav sıkça KDV\u0027yi artan oranlı gösterip yanlış seçenek yapar; oysa KDV düz orandır, etkisi tersine artan oranlıdır. Motorlu taşıtlar ve emlak vergisi dolaysız olduğu halde dolaylıymış gibi sunulur. Bu soru dolaylı-dolaysız vergi ayrımının karıştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kanuni mükellefin vergiyi fiyata ekleyip tüketiciye aktarması","ad":"Yansıma","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Düşük gelirlinin gelirine göre daha fazla vergi yükü taşıması","ad":"Tersine artan oranlılık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Vergi fiyatın içinde olduğundan tüketicinin fark etmemesi","ad":"Mali anestezi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Mükellefin kişisel gelir durumuna bakılmadan alınan vergi","ad":"Objektif vergi","kim":"kanun sabitler"}],"sinavda":"Soru kökünde dolaylı vergilerin özellikleri listelenir ve bunlardan hangisinin yanlış/değil olduğu istenir.","panel_ornek":"Bir gençlik kafede 40 TL\u0027lik içeceğin fiyatına gizli KDV eklenmiştir; hem 5 bin TL maaşla çalışan hem 50 bin TL kazanan aynı 40 TL\u0027yi öder. Düşük gelirlinin bu ödeme gelirine oranı çok daha büyüktür, işte bu tersine artan oranlı etkidir.","ornek":"Bir gençlik kafede 40 TL\u0027lik içeceğin fiyatına gizli KDV eklenmiştir; hem 5 bin TL maaşla çalışan hem 50 bin TL kazanan aynı 40 TL\u0027yi öder. Düşük gelirlinin bu ödeme gelirine oranı çok daha büyüktür, işte bu tersine artan oranlı etkidir.","yontemler":"Her seçeneği yansıma, tersine artan oranlılık, mali anestezi ve tahsil kolaylığı kriterlerinden birine bağla; uymayanı yanlış işaretle.","nedir":"Dolaylı vergiler, mal ve hizmetlerin fiyatına gömülü olarak alınan vergilerdir (KDV, ÖTV, gümrük vergisi gibi). Sınav bu vergilerin ortak özelliklerini ve dolaysız vergilerden farkını ölçer."},"olay":"Yok.","tuzak":{"C":{"ad":"Servet Vergisi Tuzağı","metin":"Öğrenci burada da bir servet unsuru arayıp bu ifadeyi yanlış sanabilir, oysa cümle doğru tanımlanmıştır. Doğrusu: Herkesin aynı oranı ödemesine karşın düşük gelirlinin tüketime ayırdığı payın büyük olması nedeniyle dolaylı vergiler tersine artan oranlı etki yaratır."},"E":{"ad":"Sübjektiflik Tuzağı","metin":"Öğrenci dolaylı vergilerin de bir şekilde kişisel durumu gözettiğini düşünüp bu ifadeyi yanlış sanabilir. Doğrusu: Dolaylı vergiler mükellefin kişisel durumuna bakılmaksızın alındığından objektif vergi olarak nitelenir, ifade doğrudur."},"D":{"ad":"Kavram Karıştırma Tuzağı","metin":"Öğrenci malî anesteziyi dolaysız vergilere ait bir özellik sanıp bu şıkkı yanlış işaretleyebilir. Doğrusu: Vergi fiyatın içine gizlendiğinden hissedilmemesi, yani malî anestezi, tam olarak dolaylı vergilerin özelliğidir."},"A":{"ad":"Ne soruluyor","metin":"Beş ifadeden hangisinin dolaylı vergi özelliklerine aykırı olduğu soruluyor. Kural: Mal ve hizmetlerin üretim, satış ve tüketimi üzerinden fiyatın içine gömülü olarak alınan katma değer vergisi dolaylı vergi grubundadır. Doğrusu: Bu ifade doğrudur, dolayısıyla aranan yanlış şık bu değildir."}},"celdiriciYol":{},"hap":"Katma değer vergisi, özel tüketim vergisi ve gümrük vergisi dolaylıdır; motorlu taşıtlar vergisi ile emlak vergisi servet üzerinden alındığı için dolaysızdır.","teshis":{"C":{"gercek":"Herkes aynı oranı ödese de düşük gelirlinin harcanabilir gelirine oranı daha yüksek olduğundan dolaylı vergilerde tersine artan oranlı (regresif) etki doğar.","ayirt":"Vergi yükü gelire oranlandığında düşük gelirlide daha mı ağır kalıyor?","paragraf":"Maliye - tersine artan oranlı etki","yanilgi":"Tersine artan oranlı etkiyi dolaysız vergilere özgü sanıp bu ifadeyi yanlış işaretledin."},"E":{"gercek":"Dolaylı vergiler mükellefin kişisel/ailevi durumuna bakılmaksızın alınan objektif (gayri şahsi) vergilerdir; kişisellik dolaysız vergilerin özelliğidir.","ayirt":"Bu verginin miktarı mükellefin kişisel durumuna göre mi değişiyor, yoksa herkes için sabit mi?","paragraf":"Maliye - objektif vergi niteliği","yanilgi":"Dolaylı vergilerde de bir şekilde mükellefin durumu gözetiliyor sanıp bu ifadeyi yanlış saydın."},"A":{"gercek":"Mal ve hizmet üretimi, satışı ve tüketimi üzerinden fiyata gömülü alınan tüm vergiler (KDV, Ö
