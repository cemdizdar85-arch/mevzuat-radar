rcamayı cari sayıyorsun."},"D":{"gercek":"Ayrım harcamanın varlığın ömrünü uzatıp uzatmadığına bakar; uzatıyorsa sermaye stoku artar ve harcama yatırım olur, uzatmıyorsa cari kalır.","ayirt":"Varlığın ömrü uzadı mı?","paragraf":"Kamu harcamaları sınıflandırması notu","yanilgi":"Bu şıkkı eleyen öğrenci, onarım ve bakımı aynı iş sayıp ikisini de aynı gruba koyar."},"B":{"gercek":"Olağan bakım faydası bir yılla sınırlı olduğu için caridir.","ayirt":"Faydası kaç yıl sürüyor?","paragraf":"Kamu harcamaları sınıflandırması notu","yanilgi":"Fiziki varlıkla ilgili her harcamayı yatırım sayıyorsun."}},"verilen":[[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 95"},"kural":"transfer harcamasında devlet karşılığında mal veya hizmet almaz; borç faizi bu yüzden transferdir ve reel harcama grubuna girmez.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 95","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıkta \u0027her durumda / her zaman / ikisi de\u0027 gibi mutlaklık ifadesi varsa önce kaynaktaki istisnayı ara (büyük onarım, faiz gibi).","konu":"kamu harcamaları sınıflandırma (cari-yatırım)","tablo":{"satirlar":[["A) Bir makinenin ömrünü uzatan büyük onarım gideri, mal ve …","TEORİ-kamu harcamaları sınıflandırma (cari-yatırım), sınav tuzağı (3)","YANLIŞ ifade"],["B) Devletin iç borç faizi ödemesi, karşılığında mal veya hi…","TEORİ-transfer harcamaları sınıflandırma","doğru ifade"],["C) Eğitim hizmetinde öğretmenlere ödenen maaşlar, beşeri se…","TEORİ-kamu harcamaları sınıflandırma (cari-yatırım), sınav tuzağı (2)","YANLIŞ ifade"],["D) Emekli aylıkları, karşılığında bir üretim faktörü satın …","TEORİ-transfer harcamaları sınıflandırma","YANLIŞ ifade"],["E) Bina yapım harcaması ile aynı binanın olağan bakım harca…","TEORİ-kamu harcamaları sınıflandırma (cari-yatırım)","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Eğitim hizmetinde öğretmenlere ödenen maaşlar, beşeri sermayeye yatırım niteliği taşıdığından bütçe sınıflandırmasında yatırım harcaması sayılır.","E":"Bina yapım harcaması ile aynı binanın olağan bakım harcaması, faydası birden çok yıla yayıldığından ikisi de yatırım harcaması olarak sınıflandırılır.","A":"Bir makinenin ömrünü uzatan büyük onarım gideri, mal ve hizmet alımı niteliğinde olduğundan her durumda cari harcama sayılır.","D":"Emekli aylıkları, karşılığında bir üretim faktörü satın alınmamasına karşın millî gelire doğrudan katkı yaptığından reel harcama sayılır.","B":"Devletin iç borç faizi ödemesi, karşılığında mal veya hizmet alınmadığından transfer harcaması olarak sınıflandırılır ve reel harcama niteliği taşımaz."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - kamu harcamalari siniflandirma (cari-yatirim)","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Ekonomik sınıflandırmada kamu harcamaları üç ana gruba ayrılır. CARİ HARCAMALAR: Kamu hizmetinin o yıl içinde üretilmesi için yapılan, faydası genellikle bir malî yılla sınırlı, TÜKETİM niteliğindeki harcamalardır: personel giderleri (maaş, ücret), sosyal güvenlik kurumuna devlet primi, mal ve hizmet alımları (kırtasiye, elektrik, kira, bakım). YATIRIM (SERMAYE) HARCAMALARI: Faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamalardır: bina, yol, baraj, makine ve teçhizat alımı, büyük onarım. TRANSFER HARCAMALARI: Karşılığında mal veya hizmet alınmayan, satın alma gücünün bir kesimden ötekine KARŞILIKSIZ aktarıldığı harcamalardır: emekli aylıkları, sosyal yardımlar, tarımsal destekler, sübvansiyonlar, borç faizi ödemeleri, KİT\u0027lere görev zararı ödemeleri. Cari ve yatırım harcamaları birlikte REEL (gerçek) HARCAMA sayılır; çünkü devlet karşılığında mal veya hizmet edinir ve millî gelire doğrudan katkı yapar. Transfer harcaması millî gelire doğrudan girmez, gelir dağılımını değiştirir. KÜÇÜK ÖRNEK: Bir okulun öğretmen maaşı cari, okul binasının yapımı yatırım, öğrencilere ödenen burs transferdir. Devletin iç borç faizi ödemesi transferdir. SINAV TUZAĞI: (1) Faiz ödemesi TRANSFER harcamasıdır; sınav bunu cari veya yatırım diye vermeye çalışır. (2) Eğitim ve sağlık harcamaları iktisadi anlamda \u0027beşeri sermaye yatırımı\u0027 sayılsa da bütçe sınıflandırmasında personel ve mal-hizmet kalemleri CARİdir. (3) Makine ve teçhizat alımı yatırım, aynı makinenin bakımı caridir; ancak ömrünü uzatan büyük onarım yatırım sayı…"},{"ad":"TEORI - kamu harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok, analitik bütçe sınıflandırması 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu uygulamasıdır). TANIM VE KURAL: Kamu harcamaları üç temel ölçüte göre sınıflandırılır. (1) İDARİ (KURUMSAL) SINIFLANDIRMA: Harcamayı hangi kurumun yaptığına bakar (bakanlıklar, üniversiteler). Kimin sorumlu olduğunu gösterir, hizmetin niteliğini göstermez. (2) FONKSİYONEL (İŞLEVSEL) SINIFLANDIRMA: Harcamanın hangi kamu hizmetine yöneldiğine bakar; uluslararası standartta on ana işlev vardır: genel kamu hizmetleri, savunma, kamu düzeni ve güvenlik, ekonomik işler, çevre koruma, iskân ve toplum refahı, sağlık, dinlenme–kültür–din, eğitim, sosyal güvenlik ve sosyal yardım. (3) EKONOMİK SINIFLANDIRMA: Harcamanın ekonomiye etkisine bakar: cari harcamalar (personel, mal ve hizmet alımı), yatırım (sermaye) harcamaları, transfer harcamaları (cari ve sermaye transferleri), faiz giderleri, borç verme. Bir başka kesit REEL–TRANSFER ayrımıdır: reel harcamada devlet karşılığında mal veya hizmet alır (maaş, bina), transferde karşılıksız satın alma gücü aktarır (emekli aylığı, faiz, sübvansiyon). ANALİTİK BÜTÇE SINIFLANDIRMASI dört boyutu birlikte kullanır: kurumsal, fonksiyonel, finansman tipi (genel bütçe, özel bütçe, döner sermaye, dış proje kredisi gibi) ve ekonomik. KÜÇÜK ÖRNEK: Bir devlet hastanesinin hemşire maaşı: kurumsal olarak Sağlık Bakanlığı, fonksiyonel olarak sağlık, ekonomik olarak cari (personel) harcamadır; emekli aylığı ödemesi ekonomik olarak transferdir, fonksiyonel olarak sosyal güvenlik. SINAV TUZAĞI: (1) Fonksiyonel sınıflandırma \u0027ne için\u0027, ekonomik s…"}],"hakem":"Doğru şık, transfer harcamasının tanımı (karşılığında mal/hizmet alınmayan) ve faiz ödemesinin bu kategoriye girmesini, ayrıca reel harcama niteliği taşımamasını kaynak metinden tam destekli olarak ifade etmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Öğretmen maaşı ekonomik sınıflandırmada personel gideri olduğundan cari harcamadır; beşeri sermaye yatırımı iktisadi kavram olsa da bütçe sınıflandırmasında yatırım sayılmaz.","E":"Bina yapımı sermaye stokunu artırdığından yatırım, olağan bakım ise tüketim niteliğinde olduğundan cari harcamadır; ikisi aynı sınıfta değildir.","D":"Emekli aylığı karşılıksız aktarım olup millî gelirin bileşimini değiştirir ama doğrudan artırmaz; bu yüzden transfer harcamasıdır, reel değildir.","A":"Büyük onarım makine ömrünü uzattığından yatırım harcamasıdır. Cari harcama sadece olağan, rutin bakım gideridir."},"dogru":"Devlet borç faizi ödediğinde karşılığında mal veya hizmet almaz, sadece ödeme yapar. Bu yüzden transfer harcamasıdır ve millî gelire doğrudan katkı yapmadığından reel harcama değildir.","sinav":"Kamu harcamalarının ekonomik sınıflandırmasında cari, yatırım ve transfer harcamaları ile reel-transfer ayrımı Kamu Malî Yönetimi ve Kontrol Kanunu analitik bütçe sınıflandırması çerçevesinde ele alınır.","kavramlar":[{"kaynak":"TEORI","tanim":"Devletin karşılığında mal veya hizmet almadan satın alma gücünü bir kesimden ötekine karşılıksız aktarmasıdır; millî gelirin bileşimini değiştirir ama doğrudan artırmaz.","ad":"Transfer harcaması"},{"kaynak":"TEORI","tanim":"Cari ve yatırım harcamaları birlikte reel harcama sayılır; devlet karşılığında mal veya hizmet edinir ve millî gelire doğrudan katkı yapar.","ad":"Reel harcama"},{"kaynak":"TEORI","tanim":"Bir makinenin veya varlığın ömrünü uzatan, faydası birden çok yıla yayılan onarım gideri olup yatırım harcaması sayılır.","ad":"Büyük onarım"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Kamu harcamalarının ekonomik sınıflandırmasında cari, yatırım ve transfer harcamaları ile reel-transfer ayrımına ilişkin olarak aşağıdaki ifadelerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-maliye-cokzor/kp-08","verilenler":[],"dayanak":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım); TEORİ - transfer harcamaları sınıflandırma","dogru":"B","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Belediye Su İşleri Dairesi\u0027nde 2019 yılında görev yapan muhasebe uzmanı Elif, yıl sonu bütçe raporunu hazırlarken üç kalemle karşılaşır: 40 yıllık su arıtma tesisinin 850.000 TL\u0027lik büyük onarımı, belediyenin 2018\u0027de aldığı 5.000.000 TL\u0027lik iç borca ilişkin 300.000 TL faiz ödemesi ve tesis çalışanlarına ödenen 1.200.000 TL maaş.","anlatim":"Elif bu üç kalemi hangi ekonomik sınıfa yazacağını çözmeye çalışır. Aynı belediyede bu yıl bir de eski su pompasının yağ değişimi ve küçük bakımı için 40.000 TL harcanmış. Elif tüm bu kalemleri doğru kutuya koymak zorunda.","doldur":[]},{"formul":"Ne yapacağız: Kural şu, devlet karşılığında mal veya hizmet alırsa bu reel harcamadır (cari ya da yatırım); karşılığında hiçbir şey almadan parayı aktarırsa bu transfer harcamasıdır. Elif\u0027in elindeki 850.000 TL büyük onarım, 300.000 TL faiz, 1.200.000 TL maaş ve 40.000 TL küçük bakım kalemlerini bu kurala göre beş ifadeyi tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TEORİ-kamu harcamaları sınıflandırma (cari-yatırım), sınav tuzağı (3)","karar":"yanlış","anlatim":"Bakım-onarım kelimesi seni yanıltır ama burada tesisin ömrünü uzatan BÜYÜK bir onarım var. Sermaye stokunu artırdığı için bu yatırım harcamasıdır, cari değil.","formul":"Şık A: Elif, \u0027bu 850.000 TL\u0027lik büyük onarım sonuçta bir mal-hizmet alımı, o zaman cari harcama yazayım\u0027 diyor, doğru mu düşünüyor?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TEORİ-transfer harcamaları sınıflandırma","karar":"doğru","anlatim":"Elif tam doğru düşünüyor. Faiz ödemesinde devlet karşılığında mal veya hizmet almaz, bu yüzden malî transfer harcamasıdır ve reel harcama grubuna girmez.","formul":"Şık B: Elif, \u0027bu 300.000 TL faiz ödemesinde karşılığında hiçbir mal ya da hizmet almadık, bunu transfer yazayım ve reel harcama saymayayım\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TEORİ-kamu harcamaları sınıflandırma (cari-yatırım), sınav tuzağı (2)","karar":"yanlış","anlatim":"İktisadi anlamda öyle sansan da bütçe sınıflandırmasında personel gideri her zaman caridir. Yatırım kalemi bina, makine, teçhizat gibi sermaye stokuna eklenen varlıklardır.","formul":"Şık C: Elif, \u00271.200.000 TL maaş çalışanların bilgi ve becerisine yani beşeri sermayeye yatırım, o zaman yatırım harcaması sayayım\u0027 diyor, katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TEORİ-transfer harcamaları sınıflandırma","karar":"yanlış","anlatim":"Emekli aylığı karşılıksız bir aktarımdır, karşılığında devlet bir üretim faktörü almaz. Millî gelirin dağılımını değiştirir ama millî geliri doğrudan artırmaz, bu yüzden transferdir.","formul":"Şık D: Elif emekli olmuş eski bir çalışana ödenen aylığı görüp \u0027bu para millî gelire doğrudan katkı yapıyor, reel harcama sayayım\u0027 diyor, doğru mu düşünüyor?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TEORİ-kamu harcamaları sınıflandırma (cari-yatırım)","karar":"yanlış","anlatim":"Aynı varlığa yapılan her gideri tek torbaya koyamazsın. Büyük onarım yeni varlık yaratıp sermaye stokunu artırdığı için yatırımdır, olağan küçük bakım ise o yılın tüketimidir ve caridir.","formul":"Şık E: Elif, \u002740.000 TL\u0027lik küçük bakım ile 850.000 TL\u0027lik büyük onarım aynı tesise ait, ikisini de yatırım harcaması yazayım\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Elif\u0027in elindeki dört kalemin üçünde ilk sezgisi yanılttı, sadece faiz ödemesinde doğru düşündü. Kendine hep şu soruyu sor: bu ödeme karşılığında devlet bir mal, hizmet veya üretim faktörü mi elde ediyor, yoksa parayı karşılıksız mı aktarıyor?","doldur":[]}],"anahtar":[{"ornek":"karşılığında","kok":"karşıl"},{"ornek":"harcamada","kok":"harcam"},{"ornek":"transferde","kok":"transf"},{"ornek":"devlet","kok":"devlet"},{"ornek":"yatırım","kok":"yatırı"},{"ornek":"hizmet","kok":"hizmet"}],"konuGiris":{"harita":"Ne zaman test edilir: harcamanın karşılığında mal/hizmet alınıp alınmadığı ya da faydasının süresi sorgulandığında. Nasıl ölçülür: harcamanın karşılığı var mı (reel) yoksa karşılıksız aktarım mı (transfer) olduğuna, faydasının bir yılı mı yoksa birden çok yılı mı kapsadığına bakılarak. Nasıl kaydedilir: bütçede ekonomik sınıflandırma kodları altında cari, yatırım, transfer olarak ayrı kalemlerde.","desen":"Sınav en çok faiz ödemesini cari veya yatırım gibi göstermeye çalışır, doğrusu faiz her zaman transferdir (p.28). Ayrıca eğitim-sağlık gibi kalemler ekonomik değil hizmet olarak yatırım sayılabilir gibi tuzak kurulur, oysa personel gideri caridir. Bu soru cari-yatırım-transfer ile reel-transfer ayrımının karıştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"O yıl içinde üretilen hizmetin tüketim niteliğindeki maliyeti, personel ve mal-hizmet alımı","ad":"Cari harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Faydası birden çok yıla yayılan, sermaye stokunu artıran harcama","ad":"Yatırım (sermaye) harcaması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Karşılığında mal veya hizmet alınmadan yapılan karşılıksız aktarım","ad":"Transfer harcaması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Devletin karşılığında mal veya hizmet edindiği, millî gelire doğrudan katkı yapan harcama türü","ad":"Reel harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soru cari, yatırım, transfer ve reel harcama tanımlarından birini örnekle verip doğru sınıfı seçmenizi ister.","panel_ornek":"Arkadaşın ayda 30 lira kira ödüyor (tüketim gibi, cari); yeni bir bisiklet için 90 lira biriktiriyor (sermaye, yatırım); büyükannesine hiçbir şey karşılığında değil sadece 15 lira harçlık veriyor (karşılıksız, transfer). Bu üç ödemenin niteliği tamamen farklıdır.","ornek":"Arkadaşın ayda 30 lira kira ödüyor (tüketim gibi, cari); yeni bir bisiklet için 90 lira biriktiriyor (sermaye, yatırım); büyükannesine hiçbir şey karşılığında değil sadece 15 lira harçlık veriyor (karşılıksız, transfer). Bu üç ödemenin niteliği tamamen farklıdır.","yontemler":"Önce \u0027karşılığında mal/hizmet var mı\u0027 sorusunu sor: varsa reel (cari ya da yatırım), yoksa transfer; sonra faydanın süresine bakarak cari-yatırımı ayır.","nedir":"Kamu harcamaları ekonomik sınıflandırmada cari, yatırım ve transfer olarak ayrılır; cari ve yatırım reel harcama sayılırken transfer karşılıksız aktarımdır. Sınav bu üç grubun hangi örneğe karşılık geldiğini ve faiz ödemesi gibi tuzak kalemleri ayırt etmenizi ölçer."},"olay":"","tuzak":{"C":{"ad":"Beşeri Sermaye Tuzağı","metin":"Öğrenci iktisadi anlamdaki \u0027insana yatırım\u0027 söylemini bütçe sınıflandırmasına taşır. Doğrusu: bütçe sınıflandırmasında öğretmen maaşı personel gideri olduğundan caridir, yatırım değildir."},"E":{"ad":"Hesap Seçimi Tuzağı","metin":"Öğrenci \u0027bina ile ilgili her gider yatırımdır\u0027 diye genellemeye gider. Doğrusu: yapım harcaması sermaye stokunu artırdığından yatırım, olağan bakım ise tüketim niteliğinde olduğundan caridir; ikisi aynı sınıfta değildir."},"D":{"ad":"Reel-Transfer Karışıklığı Tuzağı","metin":"Öğrenci \u0027harcama yapıldı, o zaman millî gelire girer\u0027 diye düşünür. Doğrusu: emekli aylığı karşılıksız aktarımdır, millî gelirin bileşimini değiştirir ama millî gelire doğrudan katkı yapmaz; bu yüzden transferdir, reel değildir."},"A":{"ad":"Büyük Onarım Tuzağı","metin":"Öğrencinin aklında \u0027bakım-onarım = cari\u0027 kalıbı vardır ve bunu istisnasız uygular. Doğrusu: kaynakta ömrü uzatan BÜYÜK onarım yatırım sayılır, cari olan sadece olağan bakımdır."}},"celdiriciYol":{"C":"Eğitim harcamasının iktisadi etkisi (beşeri sermaye) ile bütçe sınıflandırma kalemi birbirine karıştırılır =\u003e personel gideri yatırım sayılır (katman karışıklığı)","E":"Aynı varlığa ait olma ortak noktası yeterli görülür, harcamanın yeni varlık yaratıp yaratmadığı sorgulanmaz =\u003e bakım da yatırım sayılır (kapsam genişletilir)","D":"Harcamanın yapılmış olması tek başına reel harcama ölçütü sanılır, karşılık şartı kontrol edilmez =\u003e emekli aylığı reel sayılır (tanım atlanır)","A":"Bakım-onarım ifadesi görülür, ömrü uzatıp uzatmadığı kontrol edilmeden \u0027mal-hizmet alımı\u0027 kalıbına sokulur =\u003e cari denir (büyük onarım istisnası atlanır)"},"hap":"Reel harcamada devlet karşılığında mal veya hizmet/üretim faktörü alır (cari+yatırım), transferde karşılıksız satın alma gücü aktarılır; faiz ve emekli aylığı her zaman transferdir.","teshis":{"C":{"gercek":"İktisadi anlamda beşeri sermaye yatırımı olsa da bütçe sınıflandırmasında personel gideri caridir; yatırım kalemi bina/teçhizat alımıdır.","ayirt":"Bu ödeme bir üretim faktörünün o yılki hizmetinin bedeli mi, yoksa sermaye stokuna eklenen bir varlık mı?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım), sınav tuzağı (2)","yanilgi":"Eğitimin geleceğe yatırım olduğunu düşünüp öğretmen maaşını yatırım harcaması sanırsın."},"E":{"gercek":"Yapım harcaması sermaye stokuna eklenen yeni bir varlık yaratır ve yatırımdır; olağan bakım ise o yılın tüketimidir ve caridir.","ayirt":"Bu harcama sonucunda yeni bir varlık mı oluşuyor, yoksa var olan varlık aynı durumda mı tutuluyor?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","yanilgi":"Aynı varlıkla ilgili her gideri tek kalemde toplayıp hepsini yatırım sayarsın."},"A":{"gercek":"Kaynağa göre olağan bakım caridir ama ömrü uzatan BÜYÜK onarım, sermaye stokunu artırdığından yatırım sayılır.","ayirt":"Bu onarım varlığın ömrünü/kapasitesini mi artırıyor, yoksa sadece çalışır tutuyor mu?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım), sınav tuzağı (3)","yanilgi":"Bakım-onarım kelimesini görünce hiç ayrım yapmadan \u0027bu cari\u0027 diye işaretliyorsun."},"D":{"gercek":"Emekli aylığı karşılıksız bir aktarımdır; millî gelirin bileşimini/dağılımını değiştirir ama millî geliri doğrudan artırmaz, bu yüzden transferdir.","ayirt":"Bu ödeme karşılığında devlete bir mal, hizmet veya üretim faktörü mi geçiyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Devletten para çıktığı için bunu millî gelire doğrudan katkı yapan reel harcama sayarsın."},"B":{"gercek":"Faiz ödemesinde devlet karşılığında mal veya hizmet almaz; bu nedenle malî transfer harcamasıdır, reel harcamaya girmez.","ayirt":"Bu ödeme karşılığında devlet bir mal veya hizmet elde ediyor mu?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım); TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Faiz ödemesini \u0027devlet borcunu ödüyor, bu onun kendi harcaması\u0027 diye reel harcama sanıp elersin."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 95"},"kural":"Cari harcamalar, kamu hizmetinin o yıl içinde üretilmesi için yapılan tüketim niteliğindeki, personel giderleri ile mal ve hizmet alımlarını kapsayan harcamalardır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/3 Soru 95","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklarda \u0027maaş/ödeme/ödenek\u0027 gibi benzer kelimeler görürsen, önce \u0027karşılığında devlet bir mal ya da hizmet mi alıyor\u0027 sorusunu sor; alıyorsa reel (cari/yatırım), almıyorsa transferdir.","konu":"kamu harcamaları sınıflandırma (cari-yatırım)","tablo":{"satirlar":[["A) Bir üniversitenin yeni derslik binası inşaatı için yapıl…","TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","YANLIŞ ifade"],["B) Emekli öğretim üyelerine ödenen emekli aylıkları","TEORİ - transfer harcamaları sınıflandırma","YANLIŞ ifade"],["C) Devlet hastanesinde çalışan hemşirelerin aylık maaş ödem…","TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","doğru ifade"],["D) Çiftçilere ödenen tarımsal destekleme primi","TEORİ - transfer harcamaları sınıflandırma","YANLIŞ ifade"],["E) İç borç anaparasına ilişkin faiz ödemesi","TEORİ - transfer harcamaları sınıflandırma","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Devlet hastanesinde çalışan hemşirelerin aylık maaş ödemeleri","E":"İç borç anaparasına ilişkin faiz ödemesi","A":"Bir üniversitenin yeni derslik binası inşaatı için yapılan ödeme","D":"Çiftçilere ödenen tarımsal destekleme primi","B":"Emekli öğretim üyelerine ödenen emekli aylıkları"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - kamu harcamalari siniflandirma (cari-yatirim)","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Ekonomik sınıflandırmada kamu harcamaları üç ana gruba ayrılır. CARİ HARCAMALAR: Kamu hizmetinin o yıl içinde üretilmesi için yapılan, faydası genellikle bir malî yılla sınırlı, TÜKETİM niteliğindeki harcamalardır: personel giderleri (maaş, ücret), sosyal güvenlik kurumuna devlet primi, mal ve hizmet alımları (kırtasiye, elektrik, kira, bakım). YATIRIM (SERMAYE) HARCAMALARI: Faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamalardır: bina, yol, baraj, makine ve teçhizat alımı, büyük onarım. TRANSFER HARCAMALARI: Karşılığında mal veya hizmet alınmayan, satın alma gücünün bir kesimden ötekine KARŞILIKSIZ aktarıldığı harcamalardır: emekli aylıkları, sosyal yardımlar, tarımsal destekler, sübvansiyonlar, borç faizi ödemeleri, KİT\u0027lere görev zararı ödemeleri. Cari ve yatırım harcamaları birlikte REEL (gerçek) HARCAMA sayılır; çünkü devlet karşılığında mal veya hizmet edinir ve millî gelire doğrudan katkı yapar. Transfer harcaması millî gelire doğrudan girmez, gelir dağılımını değiştirir. KÜÇÜK ÖRNEK: Bir okulun öğretmen maaşı cari, okul binasının yapımı yatırım, öğrencilere ödenen burs transferdir. Devletin iç borç faizi ödemesi transferdir. SINAV TUZAĞI: (1) Faiz ödemesi TRANSFER harcamasıdır; sınav bunu cari veya yatırım diye vermeye çalışır. (2) Eğitim ve sağlık harcamaları iktisadi anlamda \u0027beşeri sermaye yatırımı\u0027 sayılsa da bütçe sınıflandırmasında personel ve mal-hizmet kalemleri CARİdir. (3) Makine ve teçhizat alımı yatırım, aynı makinenin bakımı caridir; ancak ömrünü uzatan büyük onarım yatırım sayı…"},{"ad":"TEORI - kamu harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok, analitik bütçe sınıflandırması 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu uygulamasıdır). TANIM VE KURAL: Kamu harcamaları üç temel ölçüte göre sınıflandırılır. (1) İDARİ (KURUMSAL) SINIFLANDIRMA: Harcamayı hangi kurumun yaptığına bakar (bakanlıklar, üniversiteler). Kimin sorumlu olduğunu gösterir, hizmetin niteliğini göstermez. (2) FONKSİYONEL (İŞLEVSEL) SINIFLANDIRMA: Harcamanın hangi kamu hizmetine yöneldiğine bakar; uluslararası standartta on ana işlev vardır: genel kamu hizmetleri, savunma, kamu düzeni ve güvenlik, ekonomik işler, çevre koruma, iskân ve toplum refahı, sağlık, dinlenme–kültür–din, eğitim, sosyal güvenlik ve sosyal yardım. (3) EKONOMİK SINIFLANDIRMA: Harcamanın ekonomiye etkisine bakar: cari harcamalar (personel, mal ve hizmet alımı), yatırım (sermaye) harcamaları, transfer harcamaları (cari ve sermaye transferleri), faiz giderleri, borç verme. Bir başka kesit REEL–TRANSFER ayrımıdır: reel harcamada devlet karşılığında mal veya hizmet alır (maaş, bina), transferde karşılıksız satın alma gücü aktarır (emekli aylığı, faiz, sübvansiyon). ANALİTİK BÜTÇE SINIFLANDIRMASI dört boyutu birlikte kullanır: kurumsal, fonksiyonel, finansman tipi (genel bütçe, özel bütçe, döner sermaye, dış proje kredisi gibi) ve ekonomik. KÜÇÜK ÖRNEK: Bir devlet hastanesinin hemşire maaşı: kurumsal olarak Sağlık Bakanlığı, fonksiyonel olarak sağlık, ekonomik olarak cari (personel) harcamadır; emekli aylığı ödemesi ekonomik olarak transferdir, fonksiyonel olarak sosyal güvenlik. SINAV TUZAĞI: (1) Fonksiyonel sınıflandırma \u0027ne için\u0027, ekonomik s…"}],"hakem":"Soru kamu harcamalarının ekonomik sınıflandırmasında cari harcamayı doğru tanımlamakta, C seçeneği (hemşire maaşı) tanıma tam uygun cari harcamadır."},"kayitlar":[],"sade":{"siklar":{"D":"Tarımsal destekleme primi fiyat mekanizması üzerinden verilen karşılıksız aktarım olduğundan iktisadi ve dolaylı transfer harcamasıdır.","E":"İç borç faizi karşılığında mal veya hizmet alınmayan mali transfer harcamasıdır, millî geliri doğrudan artırmaz.","A":"Derslik binası inşaatı faydası birden çok yıla yayıldığından ve sermaye stokunu artırdığından yatırım harcamasıdır, cari değildir.","B":"Emekli aylığı karşılığında o yıl mal veya hizmet alınmadığından, kişiye doğrudan ödenen transfer harcamasıdır."},"dogru":"Hemşire maaşı, o yıl içinde hizmet üretmek karşılığında ödenen personel gideridir. Cari harcamalar tüketim niteliğinde ve faydası bir mali yılda sona eren harcamalarıdır. Diğer seçenekler bina (yatırım), emekli aylığı, destekleme ve faiz (transfer) olduğundan cari değildir.","sinav":"Ekonomik sınıflandırmada cari harcamalar, kamu hizmetinin o yıl içinde üretilmesi için yapılan tüketim niteliğindeki personel giderleri ile mal ve hizmet alımlarıdır.","kavramlar":[{"kaynak":"TEORI","tanim":"Kamu hizmetinin o yıl içinde üretilmesi için yapılan, faydası genellikle bir mali yılla sınırlı, tüketim niteliğindeki personel giderleri ile mal ve hizmet alımlarıdır.","ad":"Cari harcama"},{"kaynak":"TEORI","tanim":"Faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamadır; bina, yol, makine ve teçhizat alımı örnek verir.","ad":"Yatırım harcaması"},{"kaynak":"TEORI","tanim":"Devletin karşılığında mal veya hizmet almadan satın alma gücünü bir kesimden ötekine karşılıksız aktarmasıdır; emekli aylığı, sosyal yardım, faiz ödemesi örnek verir.","ad":"Transfer harcaması"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Kamu harcamalarının ekonomik sınıflandırmasında, aşağıdaki harcama kalemlerinden hangisi cari harcama niteliğindedir?","kayitBaslik":"","id":"sgs-t1-genel-maliye-zor/kp-08","verilenler":[],"dayanak":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım); TEORİ - transfer harcamaları sınıflandırma","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Bir belediyede muhasebe müdürü 2023 bütçesini kalem kalem sınıflandırıyor: Ayşe Hemşire\u0027nin maaşı 25.000 TL, yeni yapılan spor tesisi için 3.000.000 TL, emekli memur Kemal Bey\u0027e 12.000 TL emekli aylığı, çiftçi Hasan\u0027a 8.000 TL destekleme primi ve geçen yılın iç borcuna 50.000 TL faiz ödemesi yapılmış.","anlatim":"Beş farklı ödeme var, hepsi para çıkışı ama ekonomik niteliği farklı. Müdür her birine \u0027cari mi, yatırım mı, transfer mi\u0027 diye bakıyor.","doldur":[]},{"formul":"Ne yapacağız: Cari harcama, o yıl içinde hizmet üretmek için yapılan tüketim niteliğindeki personel ve mal-hizmet giderdir; yatırım faydası yıllara yayılan sermaye harcamasıdır; transfer karşılığında mal-hizmet alınmadan yapılan karşılıksız aktarımdır. Beş ödemeyi bu üçlü ölçekte tek tek deneyeceğiz.","anlatim":"Kural tek: karşılığında o yıl hizmet üretimi var mı, uzun ömürlü varlık mı ediniliyor, yoksa hiçbir şey alınmadan mı aktarılıyor. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","karar":"yanlış","anlatim":"Tesis yıllarca kullanılacak bir varlık, bu yüzden faydası bu yılla sınırlı değil. Bina yapımı sermaye stokunu artırdığı için yatırım harcamasıdır, cari değildir.","formul":"Şık A: müdür \u0027spor tesisi inşaatı için ödediğimiz 3.000.000 TL cari harcamadır\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TEORİ - transfer harcamaları sınıflandırma","karar":"yanlış","anlatim":"Düzenlilik cari yapmaz, karşılığında hizmet alınıp alınmaması yapar. Emekli aylığında belediye hiçbir hizmet almadan parayı aktarıyor, bu yüzden transfer harcamasıdır.","formul":"Şık B: müdür \u0027Kemal Bey\u0027in emekli aylığı cari harcamadır, çünkü her ay düzenli ödeniyor\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","karar":"doğru","anlatim":"Ayşe o yıl çalışıp fiilen hizmet üretiyor, belediye karşılığında iş gücü alıyor. Bu tam anlamıyla personel gideri, yani cari harcamadır.","formul":"Şık C: müdür \u0027Ayşe Hemşire\u0027nin 25.000 TL maaşı cari harcamadır\u0027 diyor, sen ne dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TEORİ - transfer harcamaları sınıflandırma","karar":"yanlış","anlatim":"Prim üretimi teşvik etse de belediye Hasan\u0027dan bir mal veya hizmet satın almıyor. Fiyat mekanizması üzerinden yapılan bu ödeme karşılıksız aktarım, yani transfer harcamasıdır.","formul":"Şık D: müdür \u0027Hasan\u0027a verdiğimiz destekleme primi de cari harcamadır, çünkü üretimi destekliyor\u0027 diyor, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TEORİ - transfer harcamaları sınıflandırma","karar":"yanlış","anlatim":"Tekrar etmesi cari yapmaz, burada da karşılığında mal veya hizmet alınmıyor. Faiz ödemesi klasik bir transfer harcamasıdır, cari değildir.","formul":"Şık E: müdür \u0027iç borca ödediğimiz 50.000 TL faiz cari harcamadır, çünkü her yıl tekrar ediyor\u0027 diyor, doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Beş ödemeden tek cari olan, o yıl gerçek hizmet üretimi karşılığı ödenen hemşire maaşı. Kendine hep şunu sor: bu ödemenin karşılığında devletin eline o yıl bir mal veya hizmet mi geçiyor, yoksa para sadece elden ele mi geçiyor?","doldur":[]}],"anahtar":[{"ornek":"hizmet","kok":"hizmet"},{"ornek":"harcamalarının","kok":"harcam"},{"ornek":"karşılığında","kok":"karşıl"},{"ornek":"transfer","kok":"transf"},{"ornek":"aktarımlar","kok":"aktarı"},{"ornek":"yatırım","kok":"yatırı"}],"konuGiris":{"harita":"Ne zaman test edilir: bir harcama kalemi verilip cari mi, yatırım mı, transfer mi olduğu sorulduğunda. Nasıl ölçülür: harcamanın karşılığında mal/hizmet alınıp alınmadığına ve faydasının bir yılı aşıp aşmadığına bakılır. Nasıl kaydedilir: analitik bütçede ekonomik sınıflandırma kodu altında ayrı kalem olarak gösterilir.","desen":"Sınav sıklıkla faiz ödemesini cari veya yatırım gibi göstererek tuzak kurar, oysa faiz her zaman transferdir. Bir diğer tuzak eğitim-sağlık harcamalarını \u0027yatırım\u0027 sanmaktır, ama bütçede personel ve mal-hizmet kalemleri caridir. Bu soru p.28\u0027deki cari-transfer ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"O yıl içinde tüketilen, faydası bir yılla sınırlı hizmet üretim gideri","ad":"Cari harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Faydası birden çok yıla yayılan, sermaye stokunu artıran harcama","ad":"Yatırım harcaması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Karşılığında mal/hizmet alınmadan satın alma gücünün karşılıksız aktarılması","ad":"Transfer harcaması","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Devletin karşılığında mal veya hizmet edindiği cari ve yatırım harcamaları toplamı","ad":"Reel harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Seçeneklerde verilen harcama kalemlerinden hangisinin cari harcama niteliğinde olduğu sorulur.","panel_ornek":"Her ay ev kirası ve elektrik faturası ödersin, bu senin o ayki tüketimindir; ama bir bisiklet alsan yıllarca kullanırsın, o da yatırım gibidir. Arkadaşına karşılıksız 50 lira harçlık verirsen bu da transferdir.","ornek":"Her ay ev kirası ve elektrik faturası ödersin, bu senin o ayki tüketimindir; ama bir bisiklet alsan yıllarca kullanırsın, o da yatırım gibidir. Arkadaşına karşılıksız 50 lira harçlık verirsen bu da transferdir.","yontemler":"Kalemde bir mal veya hizmet alımı/tüketimi varsa ve fayda o yılla sınırlıysa cari; karşılıksız aktarımsa transferdir.","nedir":"Kamu harcamaları ekonomik olarak cari, yatırım ve transfer diye sınıflandırılır. Sınav bu üç grubu ayırt edip yanlış eşleştirmeyi yakalamanı ölçer."},"olay":"","tuzak":{"D":{"ad":"Dolaylı-İktisadi Transfer Tuzağı","metin":"Öğrenci destekleme primini üretime doğrudan katkı sağlayan bir mal-hizmet alımı sanır. Doğrusu: destekleme primi fiyat mekanizması üzerinden verilen karşılıksız bir aktarım olduğundan dolaylı ve iktisadi nitelikli transfer harcamasıdır."},"E":{"ad":"Mali Transfer Tuzağı","metin":"Öğrenci devletin kendi borcunu ödemesini reel bir harcama sanır. Doğrusu: faiz ödemesi karşılığında mal veya hizmet alınmayan mali transfer harcamasıdır, reel harcama değildir."},"A":{"ad":"Yatırım-Cari Karışıklığı Tuzağı","metin":"Öğrenci binayı büyük tutarlı bir gider sanıp cari zanneder. Doğrusu: bina inşaatı sermaye stokunu artırır, faydası birden çok yılı kapsar, bu nedenle yatırım harcamasıdır."},"B":{"ad":"Dolaysız Transfer Tuzağı","metin":"Öğrenci maaş kelimesine takılıp emekli aylığını personel gideri sanır. Doğrusu: emekli aylığı karşılığında mal veya hizmet alınmadan kişiye doğrudan ödenen dolaysız transfer harcamasıdır."}},"celdiriciYol":{"D":"Çiftçiye yapılan ödeme bir \u0027mal alımı\u0027 gibi okunur (fiyat mekanizması üzerinden yapılan dolaylı transfer niteliği atlanır).","E":"Borç ödemesi \u0027devletin harcaması\u0027 olduğu için reel sanılır (karşılığında mal-hizmet alınmadığı için transfer olduğu atlanır).","A":"Bina ödemesi tek kalemde büyük tutarlı olduğu için \u0027yıl içi gider\u0027 sanılır (yatırım-cari ayrımının fayda süresi ölçütü atlanır).","B":"Aylık düzenli ödeme olması personel gideriyle karıştırılır (transferde karşılık alınmadığı gözden kaçırılır)."},"hap":"Kamu harcamalarının ekonomik sınıflandırmasında personel ile mal-hizmet alımları caridir; karşılığında bir varlık edinilen harcamalar yatırım, karşılıksız aktarımlar ise transfer harcamasıdır.","teshis":{"C":{"gercek":"Cari harcama, o yıl içinde hizmet üretmek için yapılan personel ve mal-hizmet giderini kapsar; hemşire çalışıp hizmet ürettiği için bu gider caridir.","ayirt":"Bu ödeme karşılığında kamu bir hizmet üretimi elde ediyor mu?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","yanilgi":"Hemşire maaşının da bir \u0027kamu görevlisine yapılan aktarım\u0027 olduğunu, dolayısıyla transfer sayılabileceğini düşünüyorsun."},"E":{"gercek":"Faiz ödemesinde devlet karşılığında mal veya hizmet almaz; bu, mali nitelikli bir transfer harcamasıdır.","ayirt":"Bu ödeme sonucunda devletin eline geçen bir mal veya hizmet var mı?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Devletin kendi borcunu ödemesini bir çeşit gerçek ekonomik işlem, dolayısıyla reel harcama sanıyorsun."},"A":{"gercek":"Faydası birden çok yıla yayılan ve sermaye stokunu artıran her harcama, tutarına bakılmaksızın yatırım harcamasıdır.","ayirt":"Bu harcamanın faydası bu yılla mı sınırlı, yoksa gelecek yıllara da mı taşınıyor?","paragraf":"TEORİ - kamu harcamaları sınıflandırma (cari-yatırım)","yanilgi":"Binanın büyük ve tek seferlik bir ödeme olmasını cari harcamanın büyüklüğü sanıyorsun."},"D":{"gercek":"Destekleme primi fiyat mekanizması üzerinden yapılan, karşılığında mal-hizmet alınmayan dolaylı ve iktisadi transfer harcamasıdır.","ayirt":"Devlet burada bir şey satın mı alıyor, yoksa piyasa fiyatını etkileyerek mi destek veriyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Destekleme priminin üretimi teşvik ettiğini görüp bunu doğrudan mal-hizmet alımı sanıyorsun."},"B":{"gercek":"Emekli aylığı, devletin karşılığında hizmet almadan yaptığı dolaysız bir transfer harcamasıdır.","ayirt":"Bu ödeme karşılığında devlet bir hizmet ya da mal alıyor mu, yoksa satın alma gücünü mü aktarıyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Aylık kelimesini gördüğün için bunu personel gideri gibi cari sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"Kamu harcamaları ekonomik sınıflandırmada cari, yatırım ve transfer olarak üçe ayrılır. Cari harcamalar personel giderleri ile mal ve hizmet alımlarıdır; yatırım harcamaları bina, yol, makine ve teçhizat gibi sermaye stokunu artıran kalemlerdir; transfer harcamaları karşılığında mal veya hizmet alınmayan, satın alma gücünün karşılıksız aktarıldığı harcamalardır ve emekli aylıkları, sosyal yardımlar, sübvansiyonlar ile borç faizi ödemeleri bu gruptadır.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Harcama türü sorularında her kalem için tek soru sor: devlet bu ödemenin karşılığında bir şey aldı mı, aldıysa fayda kaç yıl sürüyor.","konu":"kamu harcamaları sınıflandırma (cari-yatırım)","tablo":{"satirlar":[["VERİLENLER","-"],["Cari harcama","Personel gideri, mal ve hizmet alımı"],["Yatırım harcaması","Bina, yol, makine ve teçhizat"],["Transfer harcaması","Emekli aylığı, sosyal yardım, borç faizi"],["HESAP","-"],["Ne soruluyor","Ekonomik sınıflandırmaya göre aşağıdaki kamu harcamalarından hangisi transfer harcamasıdır?"],["Kural","Kamu harcamaları ekonomik sınıflandırmada cari, yatırım ve transfer olarak üçe ayrılır. Cari harcamalar personel giderleri ile mal ve hizmet alımlarıdır; yatırım harcamaları bina, yol, makine ve teçhizat gibi sermaye stokunu artıran kalemlerdir; transfer harcamaları karşılığında mal veya hizmet alınmayan, satın alma gücünün karşılıksız aktarıldığı harcamalardır ve emekli aylıkları, sosyal yardımlar, sübvansiyonlar ile borç faizi ödemeleri bu gruptadır."],["Doğru şık","E) İç borç faizi ödemesi"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Kırtasiye alımı","E":"İç borç faizi ödemesi","A":"Öğretmen maaşı","D":"Makine ve teçhizat alımı","B":"Okul binası yapımı"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - kamu harcamalari siniflandirma (cari-yatirim)","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Ekonomik sınıflandırmada kamu harcamaları üç ana gruba ayrılır. CARİ HARCAMALAR: Kamu hizmetinin o yıl içinde üretilmesi için yapılan, faydası genellikle bir malî yılla sınırlı, TÜKETİM niteliğindeki harcamalardır: personel giderleri (maaş, ücret), sosyal güvenlik kurumuna devlet primi, mal ve hizmet alımları (kırtasiye, elektrik, kira, bakım). YATIRIM (SERMAYE) HARCAMALARI: Faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamalardır: bina, yol, baraj, makine ve teçhizat alımı, büyük onarım. TRANSFER HARCAMALARI: Karşılığında mal veya hizmet alınmayan, satın alma gücünün bir kesimden ötekine KARŞILIKSIZ aktarıldığı harcamalardır: emekli aylıkları, sosyal yardımlar, tarımsal destekler, sübvansiyonlar, borç faizi ödemeleri, KİT\u0027lere görev zararı ödemeleri. Cari ve yatırım harcamaları birlikte REEL (gerçek) HARCAMA sayılır; çünkü devlet karşılığında mal veya hizmet edinir ve millî gelire doğrudan katkı yapar. Transfer harcaması millî gelire doğrudan girmez, gelir dağılımını değiştirir. KÜÇÜK ÖRNEK: Bir okulun öğretmen maaşı cari, okul binasının yapımı yatırım, öğrencilere ödenen burs transferdir. Devletin iç borç faizi ödemesi transferdir. SINAV TUZAĞI: (1) Faiz ödemesi TRANSFER harcamasıdır; sınav bunu cari veya yatırım diye vermeye çalışır. (2) Eğitim ve sağlık harcamaları iktisadi anlamda \u0027beşeri sermaye yatırımı\u0027 sayılsa da bütçe sınıflandırmasında personel ve mal-hizmet kalemleri CARİdir. (3) Makine ve teçhizat alımı yatırım, aynı makinenin bakımı caridir; ancak ömrünü uzatan büyük onarım yatırım sayı…"},{"ad":"TEORI - kamu harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok, analitik bütçe sınıflandırması 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu uygulamasıdır). TANIM VE KURAL: Kamu harcamaları üç temel ölçüte göre sınıflandırılır. (1) İDARİ (KURUMSAL) SINIFLANDIRMA: Harcamayı hangi kurumun yaptığına bakar (bakanlıklar, üniversiteler). Kimin sorumlu olduğunu gösterir, hizmetin niteliğini göstermez. (2) FONKSİYONEL (İŞLEVSEL) SINIFLANDIRMA: Harcamanın hangi kamu hizmetine yöneldiğine bakar; uluslararası standartta on ana işlev vardır: genel kamu hizmetleri, savunma, kamu düzeni ve güvenlik, ekonomik işler, çevre koruma, iskân ve toplum refahı, sağlık, dinlenme–kültür–din, eğitim, sosyal güvenlik ve sosyal yardım. (3) EKONOMİK SINIFLANDIRMA: Harcamanın ekonomiye etkisine bakar: cari harcamalar (personel, mal ve hizmet alımı), yatırım (sermaye) harcamaları, transfer harcamaları (cari ve sermaye transferleri), faiz giderleri, borç verme. Bir başka kesit REEL–TRANSFER ayrımıdır: reel harcamada devlet karşılığında mal veya hizmet alır (maaş, bina), transferde karşılıksız satın alma gücü aktarır (emekli aylığı, faiz, sübvansiyon). ANALİTİK BÜTÇE SINIFLANDIRMASI dört boyutu birlikte kullanır: kurumsal, fonksiyonel, finansman tipi (genel bütçe, özel bütçe, döner sermaye, dış proje kredisi gibi) ve ekonomik. KÜÇÜK ÖRNEK: Bir devlet hastanesinin hemşire maaşı: kurumsal olarak Sağlık Bakanlığı, fonksiyonel olarak sağlık, ekonomik olarak cari (personel) harcamadır; emekli aylığı ödemesi ekonomik olarak transferdir, fonksiyonel olarak sosyal güvenlik. SINAV TUZAĞI: (1) Fonksiyonel sınıflandırma \u0027ne için\u0027, ekonomik s…"}],"hakem":"Soru ekonomik sınıflandırmada transfer harcamasını tanımlayan ve kaynakta açıkça desteklenen kuralı ölçüyor; doğru sikk (E) iç borç faizi ödemesi transfer harcamasının tanımı ile tam olarak eşleşiyor."},"kayitlar":[],"sade":{"siklar":{"C":"Kırtasiye alımı, kağıt ve kalem gibi mal satın almaktır. Devlet karşılığında o yıl tüketilen malları alır; bu cari harcamadır.","A":"Öğretmen maaşı, bir kamu görevlisinin aylık ücretidir. Devlet karşılığında o yıl içinde bir hizmet alır; bu cari harcamadır, transfer değildir.","D":"Makine ve teçhizat alımı, ülkenin üretim gücünü artıran varlık edinmektir. Devlet karşılığında maddi bir varlık satın alır; bu yatırım harcamasıdır.","B":"Okul binası yapımı, uzun yıllar kullanılacak bir varlık oluşturur. Devlet karşılığında maddi bir mal edinir; bu yatırım harcamasıdır."},"dogru":"İç borç faizi ödemesi, devletin borç aldığı parayı geri öderken ödediği faizdir. Devlet buna karşılık hiçbir mal veya hizmet almaz, sadece parayı başkasından başkasına aktarır. Bu yüzden transfer harcamasıdır.","sinav":"Ekonomik sınıflandırmaya göre transfer harcaması, karşılığında mal veya hizmet alınmayan, satın alma gücünün karşılıksız aktarıldığı harcamadır; iç borç faizi ödemesi bu tanıma uyar.","kavramlar":[{"kaynak":"TEORI","tanim":"Devletin karşılığında mal veya hizmet almadan, satın alma gücünü bir kesimden başka bir kesime karşılıksız olarak aktarmasıdır. Emekli aylıkları, sosyal yardımlar, sübvansiyonlar ve borç faizi ödemeleri bu gruba girer.","ad":"Transfer harcaması"},{"kaynak":"TEORI","tanim":"Kamu hizmetinin o yıl içinde üretilmesi için yapılan, faydası genellikle bir malî yılla sınırlı, tüketim niteliğindeki harcamadır. Personel giderleri ile mal ve hizmet alımları buna dahildir.","ad":"Cari harcama"},{"kaynak":"TEORI","tanim":"Faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamadır. Bina, yol, makine ve teçhizat alımı bu gruba girer.","ad":"Yatırım harcaması"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Ekonomik sınıflandırmaya göre aşağıdaki kamu harcamalarından hangisi transfer harcamasıdır?","kayitBaslik":"","id":"sgs-t4-maliye-kolay/kp-05","verilenler":[{"deger":"Personel gideri, mal ve hizmet alımı","anlam":"Faydası bir mali yılla sınırlı tüketim harcamasıdır.","ad":"Cari harcama"},{"deger":"Bina, yol, makine ve teçhizat","anlam":"Sermaye stokunu artıran harcamadır.","ad":"Yatırım harcaması"},{"deger":"Emekli aylığı, sosyal yardım, borç faizi","anlam":"Karşılığında mal veya hizmet alınmayan harcamadır.","ad":"Transfer harcaması"}],"dayanak":"Teori notu: kamu harcamaları sınıflandırması (cari-yatırım) — ekonomik sınıflandırmada cari harcamalar kamu hizmetinin o yıl üretilmesi için yapılan personel giderleri ile mal ve hizmet alımlarıdır, yatırım harcamaları faydası birden çok yıla yayılan ve sermaye stokunu artıran bina, yol, makine ve teçhizat alımlarıdır, transfer harcamaları karşılığında mal veya hizmet alınmayan ve satın alma gücünün karşılıksız aktarıldığı emekli aylıkları, sosyal yardımlar, sübvansiyonlar ve borç faizi ödemeleridir; cari ve yatırım harcamaları birlikte reel harcama sayılır","dogru":"E","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Ölçüt 1 = Devlet karşılığında mal veya hizmet aldı mı","anlatim":"Almadıysa harcama transferdir; aldıysa cari ya da yatırım ayrımına geçilir.","doldur":[]},{"formul":"Ölçüt 2 = Faydası bir yılla mı sınırlı, birden çok yıla mı yayılıyor","anlatim":"Bir yılla sınırlıysa cari, birden çok yıla yayılıyorsa yatırım harcamasıdır.","doldur":[[6,1]]},{"formul":"Sonuç = İç borç faizi ödemesi karşılıksız olduğu için transfer harcamasıdır","anlatim":"Cari ve yatırım harcamaları reel harcamadır ve milli gelire doğrudan katkı yapar; transfer harcaması gelir dağılımını değiştirir.","doldur":[[7,1]]}],"anahtar":[{"ornek":"harcamasının","kok":"harcam"},{"ornek":"transfer","kok":"transf"},{"ornek":"yatırım","kok":"yatırı"},{"ornek":"karşılıksızlıktır","kok":"karşıl"},{"ornek":"hizmet","kok":"hizmet"},{"ornek":"personel","kok":"person"}],"konuGiris":{"harita":"Ne zaman test edilir: harcamanın karşılığında mal veya hizmet alınıp alınmadığına bakılırken. Nasıl ölçülür: harcamanın cari, yatırım yoksa transfer grubuna girip girmediği tanımla eşleştirilerek belirlenir. Nasıl kaydedilir: bütçede ekonomik sınıflandırma kodu altında ilgili kaleme yazılır.","desen":"Sınav en çok faiz ödemesini cari veya yatırım gibi göstererek şaşırtır, doğrusu faizin transfer olmasıdır. Bazı seçeneklerde eğitim-sağlık gibi beşeri yatırım sayılan hizmetler tuzak olarak yatırım gösterilir ama bütçede bunlar personel-mal hizmet yani caridir. Bu soru p.28 reel-transfer ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"O yıl tüketilen, karşılığı mal-hizmet olan gider; personel, mal-hizmet alımı","ad":"Cari harcama","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Sermaye stokunu artıran, faydası birden çok yıla yayılan harcama","ad":"Yatırım harcaması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Karşılığında mal veya hizmet alınmadan yapılan karşılıksız aktarım","ad":"Transfer harcaması","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Cari ve yatırımın birlikte adı; devlet karşılığında mal veya hizmet edinir","ad":"Reel harcama","kim":"kanun sabitler"}],"sinavda":"Seçeneklerden hangisinin karşılığında mal veya hizmet alınmadan yapıldığı, yani hangisinin transfer olduğu sorulur.","panel_ornek":"Amcanın emekli maaşı her ay hesabına yatıyor, karşılığında hiçbir iş görmüyor; bu tam bir transfer gibi düşün. Kirasını ödediği ev sahibine verdiği 3.000 lira ise karşılığında oturma hakkı aldığı için normal bir mal-hizmet gideri sayılır.","ornek":"Amcanın emekli maaşı her ay hesabına yatıyor, karşılığında hiçbir iş görmüyor; bu tam bir transfer gibi düşün. Kirasını ödediği ev sahibine verdiği 3.000 lira ise karşılığında oturma hakkı aldığı için normal bir mal-hizmet gideri sayılır.","yontemler":"Her seçenek için \u0027devlet buna karşılık bir şey alıyor mu?\u0027 sorusunu sor; alıyorsa cari/yatırım, almıyorsa transferdir.","nedir":"Kamu harcamaları ekonomik sınıflandırmada cari, yatırım ve transfer diye üçe ayrılır. Sınav bu üç grubun hangi harcamayı kapsadığını ayırt etmeni ölçer."},"olay":"","tuzak":{"C":{"ad":"Tür Tuzağı","metin":"Mal ve hizmet alımı cari harcamadır. Doğrusu: aranan şık borç faizi ödemesidir."},"A":{"ad":"Tür Tuzağı","metin":"Personel gideri cari harcamadır. Doğrusu: transfer harcaması iç borç faizi ödemesidir."},"D":{"ad":"Tür Tuzağı","metin":"Makine ve teçhizat alımı sermaye stokunu artırdığı için yatırım harcamasıdır. Doğrusu: aranan şık borç faizi ödemesidir."},"B":{"ad":"Tür Tuzağı","metin":"Bina yapımı faydası birden çok yıla yayıldığı için yatırım harcamasıdır. Doğrusu: aranan şık borç faizi ödemesidir."}},"celdiriciYol":{},"hap":"Transfer harcamasının tek ölçüsü karşılıksızlıktır: devlet karşılığında mal veya hizmet almıyorsa harcama transferdir.","teshis":{"C":{"gercek":"Mal ve hizmet alımları tutarı ne olursa olsun cari harcamadır.","ayirt":"Alım tüketim mi, sermaye mi?","paragraf":"Kamu harcamaları sınıflandırması notu","yanilgi":"Küçük tutarlı alımları sınıflandırma dışı sanıyorsun."},"E":{"gercek":"Faiz ödemesinde devlet karşılığında mal veya hizmet almaz; satın alma gücü karşılıksız aktarıldığı için kalem transfer harcamasıdır.","ayirt":"Devlet karşılığında bir şey aldı mı?","paragraf":"Kamu harcamaları sınıflandırması notu","yanilgi":"Bu şıkkı eleyen öğrenci, faiz ödemesini devletin katlandığı bir cari gider sayar."},"A":{"gercek":"Bütçe sınıflandırmasında personel ve mal hizmet kalemleri caridir.","ayirt":"Kalem personel gideri mi?","paragraf":"Kamu harcamaları sınıflandırması notu","yanilgi":"Eğitim harcamasını beşeri sermaye yatırımı sayıp yatırım grubuna koyuyorsun."},"D":{"gercek":"Makine ve teçhizat alımı yatırım, aynı makinenin bakımı caridir.","ayirt":"Kalem varlık mı ediniyor?","paragraf":"Kamu harcamaları sınıflandırması notu","yanilgi":"Makine alımını cari gider sanıyorsun."},"B":{"gercek":"Bina yapımı sermaye stokunu artırdığı için yatırım harcamasıdır.","ayirt":"Faydası kaç yıla yayılıyor?","paragraf":"Kamu harcamaları sınıflandırması notu","yanilgi":"Okulla ilgili her harcamayı aynı gruba koyuyorsun."}},"verilen":[[5,1],[1,1],[2,1],[3,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 98"},"kural":"Hesap verme sorumluluğu, kaynakları kullananların bunları etkili, ekonomik, verimli ve hukuka uygun kullanmaktan yetkili organlara karşı sorumlu tutulmasıdır; saydamlık bunun ön koşulu olan bilgi açıklığıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 98","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Cümlede \u0027kamuoyuna açıklama/açık olma\u0027 geçiyorsa saydamlık, \u0027sorumlu tutulma/hesap verme\u0027 geçiyorsa hesap verebilirliktir.","konu":"mali saydamlık","tablo":{"satirlar":[["A) Genel yönetim kapsamındaki idarelerce sağlanan teşvik ve…","5018 s.K. m.7","YANLIŞ ifade"],["B) Kamu kaynaklarını kullananların, bu kaynakların etkili, …","5018 s.K. m.8","doğru ifade"],["C) Kamu hesaplarının standart bir muhasebe sistemi ve genel…","5018 s.K. m.7","YANLIŞ ifade"],["D) Stratejik planlar ile bütçelerin hazırlanması, yetkili o…","5018 s.K. m.7","YANLIŞ ifade"],["E) Kamu görevlilerinin görev, yetki ve sorumluluklarının aç…","5018 s.K. m.7","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Kamu hesaplarının standart bir muhasebe sistemi ve genel kabul görmüş muhasebe ilkelerine uygun olarak tutulması","E":"Kamu görevlilerinin görev, yetki ve sorumluluklarının açık olarak tanımlanması","A":"Genel yönetim kapsamındaki idarelerce sağlanan teşvik ve desteklemelerin bir yılı geçmemek üzere belirli dönemler itibarıyla kamuoyuna açıklanması","D":"Stratejik planlar ile bütçelerin hazırlanması, yetkili organlarda görüşülmesi, uygulanması ve uygulama sonuçlarının kamuoyuna açık olması","B":"Kamu kaynaklarını kullananların, bu kaynakların etkili, ekonomik, verimli ve hukuka uygun kullanılmasından Türkiye Büyük Millet Meclisi ve Sayıştay karşısında sorumlu tutulması"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - mali saydamlik","metin":"TEORİ (maliye; dayanak 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu\u0027nun malî saydamlık ve hesap verme sorumluluğu hükümleri). TANIM VE KURAL: MALÎ SAYDAMLIK, kamu kaynaklarının elde edilmesi ve kullanılmasına ilişkin her türlü bilginin, denetimin sağlanması amacıyla, kamuoyuna ZAMANINDA, DOĞRU ve ANLAŞILIR biçimde açık olmasıdır. 5018 sayılı Kanun saydamlığın sağlanması için başlıca şu gerekleri sayar: (1) Görev, yetki ve sorumlulukların açık olarak tanımlanması. (2) Hükümet politikaları, kalkınma planları, yıllık programlar, stratejik planlar ile bütçelerin hazırlanması, yetkili organlarda görüşülmesi, uygulanması ve uygulama sonuçlarının kamuoyuna açık ve ulaşılabilir olması. (3) Genel yönetim kapsamındaki idarelerce sağlanan teşvik ve desteklemelerin bir yılı geçmemek üzere belirli dönemler itibarıyla kamuoyuna açıklanması. (4) Kamu hesaplarının standart bir muhasebe sistemi ve genel kabul görmüş muhasebe ilkelerine uygun olarak tutulması. Uluslararası çerçeve IMF\u0027nin Malî Saydamlık İyi Uygulamalar Tüzüğüdür. HESAP VERME SORUMLULUĞU ile ilişkisi: Saydamlık bilgiyi açar; hesap verebilirlik, kaynakları kullananların bu kaynakların etkili, ekonomik, verimli ve hukuka uygun kullanılmasından sorumlu tutulmasıdır. Saydamlık hesap verebilirliğin ÖN KOŞULUdur. KÜÇÜK ÖRNEK: Bir bakanlığın faaliyet raporunu ve kesin hesabını yayımlaması saydamlık; raporda gösterilen sapmalardan üst yöneticinin TBMM ve Sayıştay karşısında sorumlu olması hesap verebilirliktir. SINAV TUZAĞI: (1) Saydamlık ve hesap verebilirlik aynı şey değildir; biri bilgi, öteki sorumluluktur. (2) Teşvik ve dest…"}],"hakem":"Soru 5018 sayılı Kanun\u0027un malî saydamlık (m.7) ve hesap verme sorumluluğu (m.8) ayrımını test ediyor; B seçeneği (yetkili organlara karşı sorumlu tutulma) hesap verme sorumluluğunun tanımı olup, kaynak metinde bu ayrım açıkça yapılmıştır."},"kayitlar":[],"sade":{"siklar":{"C":"Standart muhasebe sistemi ve genel kabul görmüş ilkelerle hesap tutulması bilginin güvenilirliğini sağlar; bu da saydamlığın dört gereğinden biridir, hesap verme sorumluluğu değildir.","E":"Görev, yetki ve sorumlulukların açık tanımlanması saydamlığın ilk şartı olup, tanımlanmasıyla fiilen sorulmasını karıştırmamalı; bu da saydamlık gereğidir.","D":"Plan ve bütçe hazırlıktan sonuçlara kadar kamuoyuna açık olması bilgiye erişimi sağlar; saydamlığın dört gereğinden biridir, sorumluluk ilişkisi değildir.","A":"Teşvik ve desteklemelerin belirli aralıklarla kamuoyuna açıklanması bilginin yayımlanmasıdır; bu saydamlığın dört gereğinden biridir, sorumluluk ilişkisi değildir."},"dogru":"Hesap verme sorumluluğu, kamu kaynağını kullananların bu kaynakları etkili ve hukuka uygun kullandıklarını yetkili organlara (Meclis ve Sayıştay) kanıtlamalarıdır. Diğer şıklar hep bilgi açıklığı yani saydamlık düzenler.","sinav":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu\u0027na göre hesap verme sorumluluğunun konusu, kaynakları kullananların bu kaynakların etkili, ekonomik, verimli ve hukuka uygun kullanılmasından yetkili organlara karşı sorumlu tutulmasıdır.","kavramlar":[{"kaynak":"TEORI","tanim":"Kamu kaynaklarının elde edilmesi ve kullanılmasına ilişkin her türlü bilginin, kamuoyuna zamanında, doğru ve anlaşılır biçimde açık olmasıdır.","ad":"Malî saydamlık"},{"kaynak":"TEORI","tanim":"Kamu kaynağını kullananların bu kaynakları etkili, ekonomik, verimli ve hukuka uygun kullandıklarından yetkili organlara (Türkiye Büyük Millet Meclisi ve Sayıştay) karşı sorumlu tutulmasıdır.","ad":"Hesap verme sorumluluğu"},{"kaynak":"TEORI","tanim":"Görev ve yetkilerin tanımlanması, plan ve bütçe sürecinin açıklığı, teşvik ve desteklemelerin açıklanması, standart muhasebe sistemi kullanılmasıdır.","ad":"Saydamlığın dört gerekliliği"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2025/2","alinti":"Kamu kaynaklarının elde edilmesi ve kullanılmasında denetiminin sağlanması amacıyla kamuoyunun zamanında bilgilendirilmesi aşağıda yer alan kavramlardan hangisi ile açıklanır?"}],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu\u0027na göre aşağıdaki ifadelerden hangisi, malî saydamlığın değil hesap verme sorumluluğunun konusunu oluşturur?","kayitBaslik":"","id":"sgs-t1-genel-maliye-cokzor/kp-06","verilenler":[],"dayanak":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu m.7 (malî saydamlık) ve m.8 (hesap verme sorumluluğu)","dogru":"B","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Deniz Belediyesi 2023 yılında küçük esnafa 4 milyon lira teşvik verdi, bunu 6 ayda bir kamuoyuna açıkladı; yıl sonunda kesin hesabında 400 bin liralık sapma çıktı ve belediye başkanı bu sapma yüzünden Sayıştay karşısına çıktı.","anlatim":"","doldur":[]},{"formul":"Ne yapacağız: Bu olayda hangi işlem bilgiyi açar (saydamlık), hangi işlem birini sorumlu tutar (hesap verme sorumluluğu) ayıracağız. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"5018 s.K. m.7","karar":"yanlış","anlatim":"Belediye burada sadece bilgi açıklıyor, kimseyi hesaba çekmiyor. Teşvik açıklaması saydamlığın dört gereğinden biridir. Bu ifade saydamlığa girer, hesap vermeye değil.","formul":"Şık A: belediye teşviki 6 ayda bir kamuoyuna açıklıyor, bu hesap verme sorumluluğu mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"5018 s.K. m.8","karar":"doğru","anlatim":"Burada başkan bir merci karşısında hesaba çekiliyor, sadece bilgi açıklamıyor. Kaynağın etkili, ekonomik, verimli kullanılmasından sorumlu tutulmak tam olarak budur. Bu ifade hesap verme sorumluluğunun kendisidir.","formul":"Şık B: başkan 400 bin liralık sapma yüzünden Sayıştay karşısına çıkıyor, bu hesap verme sorumluluğu mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"5018 s.K. m.7","karar":"yanlış","anlatim":"Standart muhasebe sistemine uygunluk sadece bilginin doğru üretilmesini sağlar, kimseyi hesaba çekmez. Bu, saydamlığın dört gereğinden biridir. Yani bu ifade saydamlığa girer.","formul":"Şık C: belediye kesin hesabını standart muhasebe ilkelerine göre tutuyor, bu hesap verme sorumluluğu mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"5018 s.K. m.7","karar":"yanlış","anlatim":"Bu süreç baştan sona bilgi paylaşımıdır, kimse burada bir merci karşısında sorumlu tutulmuyor. Plan-bütçe sürecinin açık olması saydamlığın gereklerinden biridir. Bu ifade de saydamlığa girer.","formul":"Şık D: belediyenin stratejik planı hazırlanıp meclise sunulup uygulama sonuçları kamuoyuna açıklanıyor, bu hesap verme sorumluluğu mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"5018 s.K. m.7","karar":"yanlış","anlatim":"Görev ve yetkinin tanımlanması sadece kim ne yapacak sorusuna cevap verir, henüz kimseyi hesaba çekmez. Bu tanımlama saydamlığın ilk gereğidir. Fiilen hesap sorulması bundan ayrı bir aşamadır.","formul":"Şık E: belediyedeki mali işler müdürünün görev ve yetkileri yönetmelikte açıkça tanımlanıyor, bu hesap verme sorumluluğu mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Sadece B\u0027de biri bir merci karşısında sorumlu tutuluyor, diğerlerinde bilgi açıklanıyor. Kendine hep şunu sor: bu cümlede biri hesaba mı çekiliyor, yoksa sadece bilgi mi açılıyor?","doldur":[]}],"anahtar":[{"ornek":"saydamlık","kok":"saydam"},{"ornek":"sorumlu","kok":"soruml"},{"ornek":"sadece","kok":"sadece"},{"ornek":"hesaba","kok":"hesaba"},{"ornek":"karşısında","kok":"karşıs"},{"ornek":"gereğinden","kok":"gereği"}],"konuGiris":{"harita":"Ne zaman test edilir: Kanundaki saydamlık unsurlari ile hesap verme sorumluluğu birbirine karıştırılarak sorulur. Nasıl ayırt edilir: Bilgiyi açan madde saydamlık, kaynağı kullananın sorumlu tutulması hesap verebilirliktir. Nasıl hatirlanir: Saydamlık önce gelir, hesap verebilirliğin on koşuludur.","desen":"Soru genellikle saydamlık unsurlarından olanı ya da olmayanı sorar, burada ise tersine hesap verebilirlige ait olanı sordurarak tuzak kurar. Öğrenci saydamlık listesini ezberleyip sık seçeneği orada arayabilir, oysa doğru cevap sorumluluk tarafındadır. Bu soru saydamlık ve hesap verebilirlik ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kamu kaynaklarına ilişkin bilginin zamanında, doğru, anlaşılır şekilde açık olması","ad":"Mali saydamlık","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Kaynak kullananların etkili ve hukuka uygun kullanımdan sorumlu tutulması","ad":"Hesap verme sorumluluğu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Verilen destek ve tesviklerin belirli aralıklarla kamuoyuna duyurulması","ad":"Teşvik ve destekleme açıklaması","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kamu hesaplarının ortak ilkelere göre tutulması zorunluluğu","ad":"Standart muhasebe sistemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soru, saydamlık unsurlarını sayarak aralarindan hesap verebilirlige ait olanı secmemizi ister.","panel_ornek":"Bir apartman yöneticisi her ay aidat gelir gider dokumunu panoya aşarsa bu saydamliktir; ama parayı yanlış harcadiginda kat maliklerine hesap vermesi ayrı bir konudur. Diyelim yönetici 3 bin lira topladı, 200 lirası kayıp çıktı, bunu izah etmesi gerekir. Panoya asma bilgi paylasimidir, izah etme ise sorumluluktur.","ornek":"Bir apartman yöneticisi her ay aidat gelir gider dokumunu panoya aşarsa bu saydamliktir; ama parayı yanlış harcadiginda kat maliklerine hesap vermesi ayrı bir konudur. Diyelim yönetici 3 bin lira topladı, 200 lirası kayıp çıktı, bunu izah etmesi gerekir. Panoya asma bilgi paylasimidir, izah etme ise sorumluluktur.","yontemler":"Her seçeneği \u0027bu bilgi acikligimi yoksa sorumluluk mu\u0027 diye sorgula; bilgiyi açan saydamlık, kişiyi sorumlu tutan hesap verebilirliktir.","nedir":"Mali saydamlık, kamu kaynaklarının nasıl elde edilip harcandigina dair bilginin halka açık olmasıdır. Sınav, bu açıklığın hangi unsurlardan oluştuğunu ve hesap verme sorumluluğundan farkını ölçer."},"olay":"","tuzak":{"C":{"ad":"Muhasebe Standardı Tuzağı","metin":"Standart muhasebe sistemi kullanılması, bilgi üretiminin güvenilirliğini sağladığı için saydamlık gereğidir, sorumluluk ilişkisi değildir. Doğrusu: Bu unsur da saydamlığın dört gereğinden biridir, hesap verme sorumluluğunun konusu değildir."},"E":{"ad":"Görev Tanımı Tuzağı","metin":"Görev, yetki ve sorumlulukların tanımlanması saydamlığın ilk şartı olup, bu tanımların fiilen hesap sorulmasıyla karıştırılmamalıdır. Doğrusu: Görev ve yetkilerin açık tanımlanması saydamlık gereğidir, hesap verme sorumluluğunun kendisi değildir."},"D":{"ad":"Süreç Açıklığı Tuzağı","metin":"Plan ve bütçe sürecinin tüm aşamalarının kamuoyuna açık olması bilgiye erişimi düzenler, sorumluluk ilişkisini değil. Doğrusu: Bu, malî saydamlığın 5018 sayılı Kanunda sayılan gereklerinden biridir."},"A":{"ad":"Kapsam Karıştırma Tuzağı","metin":"Bu madde 5018 sayılı Kanunda saydamlığın sağlanması için sayılan dört gerekten biridir, sorumluluk değil bilgi açıklığı düzenler. Doğrusu: Teşvik ve desteklemelerin açıklanması malî saydamlığın unsurudur, hesap verme sorumluluğunun değil."}},"celdiriciYol":null,"hap":"Saydamlık bilgiyi açar, hesap verebilirlik o bilgiye dayanarak birini yetkili organ karşısında sorumlu tutar.","teshis":{"C":{"gercek":"Standart muhasebe sistemi ve genel kabul görmüş ilkelere uygunluk, saydamlığın dört gereğinden biridir.","ayirt":"Bu, bilginin doğru üretilmesini mi yoksa birinin sorumlu tutulmasını mı sağlıyor?","paragraf":"5018 s.K. m.7","yanilgi":"Standart muhasebe sistemini bir denetim/sorumluluk mekanizması sanıyorsun."},"E":{"gercek":"Görev, yetki ve sorumlulukların tanımlanması saydamlığın ilk gereğidir; fiilen hesap sorulması ayrı bir aşamadır.","ayirt":"Tanımlanmak ile sorumlu tutulmak aynı şey mi?","paragraf":"5018 s.K. m.7","yanilgi":"Görev ve yetkilerin tanımlanmasını, o kişinin fiilen hesap vermesiyle aynı şey sanıyorsun."},"A":{"gercek":"5018 sayılı Kanun bu açı uka uygun kullanılmasından sorumlu tutulmasıdır.","ad":"Hesap verme sorumluluğu"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2025/2","alinti":"Kamu kaynaklarının elde edilmesi ve kullanılmasında denetiminin sağlanması amacıyla kamuoyunun zamanında bilgilendirilmesi aşağıda yer alan kavramlardan hangisi ile açıklanır?"}],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu\u0027na göre malî saydamlığın sağlanması için gereken unsurlardan hangisi değildir?","kayitBaslik":"","id":"sgs-t1-genel-maliye-zor/kp-06","verilenler":[],"dayanak":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu, malî saydamlık ve hesap verme sorumluluğu hükümleri","dogru":"E","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Ankara\u0027daki bir devlet hastanesi 2023 kesin hesabını ve 15 milyon liralık teşvik ödemesini Mart ayında kamuoyuna açıklıyor, ama başhekim \u0027kaynak kullanımından ben sorumlu değilim\u0027 diyor.","anlatim":"Hastane bilgiyi açıklıyor, bu bir şey; başhekimin sorumluluğu ise başka bir şey. 5018 sayılı Kanun bu ikisini ayrı tutar.","doldur":[]},{"formul":"Ne yapacağız: 5018 sayılı Kanun\u0027a göre malî saydamlık dört unsurdan oluşur; bu hastane olayında beş ifadeyi tek tek deneyeceğiz.","anlatim":"Görev-yetki tanımı, süreç açıklığı, teşvik açıklaması, standart muhasebe - bunlar saydamlık. Kaynağı kullanandan hesap sorulması ise ayrı bir kavram. Beş ifadeyi bu hastane olayında tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"5018 s.K. malî saydamlık hükümleri (3)","karar":"doğru","anlatim":"Kanun teşvik ve desteklemelerin bir yılı geçmemek üzere belirli dönemler itibarıyla açıklanmasını istiyor. Yıllık açıklama bu sınırı karşılıyor. Evet, bu saydamlık unsuru olarak sayılır.","formul":"Şık A: hastane 15 milyonluk teşvik ödemesini her yıl bir kez açıklıyor, bu saydamlık gereğini yerine getiriyor mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"5018 s.K. malî saydamlık hükümleri (2)","karar":"doğru","anlatim":"Kanun sadece bütçenin sonucunu değil, hazırlık-görüşme-uygulama-sonuç zincirinin tamamının açık olmasını ister. Hastane olayı tam bu zinciri gösteriyor. Evet, saydamlık unsurudur.","formul":"Şık B: hastanenin stratejik planından uygulama sonuçlarına kadar her aşama kamuoyuna açık, bu saydamlık mı sağlanıyor?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"5018 s.K. malî saydamlık hükümleri (4)","karar":"doğru","anlatim":"Kanun kamu hesaplarının standart muhasebe sistemine uygunluğunu doğrudan saydamlık gereği sayar. Hastane bunu yapıyorsa saydamlığa hizmet ediyor. Evet, doğru bir unsur.","formul":"Şık C: hastanenin muhasebesi standart bir sisteme ve genel kabul görmüş ilkelere uygun tutuluyor, bu saydamlık sağlıyor mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"5018 s.K. malî saydamlık hükümleri (1)","karar":"doğru","anlatim":"Kanun\u0027un sıraladığı ilk gerek tam olarak budur: görev-yetki-sorumlulukların açık tanımı. Hastane bunu yapmışsa saydamlık sağlanıyor demektir. Evet, doğru unsur.","formul":"Şık D: hastanede kimin hangi görev, yetki ve sorumluluğa sahip olduğu açıkça tanımlanmış, bu saydamlık unsuru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"5018 s.K. malî saydamlık ve hesap verme sorumluluğu hükümleri","karar":"yanlış","anlatim":"Bu ifade bilgi açıklamıyor, birini sorumlu tutmaktan bahsediyor. Kaynağı kullananın sorumlu tutulması hesap verme sorumluluğunun tanımıdır, saydamlığın değil. Yanlış, bu saydamlık unsuru sayılmaz.","formul":"Şık E: başhekim \u0027kaynakları etkili, ekonomik, verimli ve hukuka uygun kullanmaktan ben sorumlu tutulmam\u0027 diyor, bu doğru olsa saydamlık unsuru sayılır mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Dört unsur bilgiyi açık tutmakla ilgili, beşincisi ise birini sorumlu tutmakla ilgili, o yüzden ayrı kavramdır. Kendine sor: bu ifade bir bilgiyi mi açıklıyor yoksa birini mi sorumlu tutuyor?","doldur":[]}],"anahtar":[{"ornek":"saydamlık","kok":"saydam"},{"ornek":"sorumlu","kok":"soruml"},{"ornek":"kullanımından","kok":"kullan"},{"ornek":"hastane","kok":"hastan"},{"ornek":"tanımıdır","kok":"tanımı"},{"ornek":"bilgiyi","kok":"bilgiy"}],"konuGiris":{"harita":"Ne zaman test edilir: 5018 sayılı Kanun\u0027un saydamlık hükümleri sorulduğunda test edilir. Nasıl ölçülür: sayılan unsurlardan hangisinin kanunda yer almadığı bulunarak ölçülür. Nasıl kaydedilir: doğru cevap, saydamlık unsuru olmayan seçeneğin işaretlenmesiyle kaydedilir.","desen":"Soru genellikle sayılan dört unsurdan birini değiştirip yanlış bir ifade ekler ya da hesap verebilirlik kavramını saydamlık unsuruymuş gibi gösterir. Tuzak, teşvik açıklama süresinin \u0027bir yılı geçmemek üzere\u0027 olduğunu bilmemekten doğar. Bu soru p.28 saydamlık unsurları listesi noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kamu kaynaklarına ilişkin bilgilerin zamanında, doğru, anlaşılır açıklanmasıdır.","ad":"Mali saydamlık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kaynağı kullananların etkili ve hukuka uygun kullanımdan sorumlu tutulmasıdır.","ad":"Hesap verme sorumluluğu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Teşviklerin bir yılı geçmemek üzere kamuoyuna açıklanmasıdır.","ad":"Teşvik ve destekleme açıklaması","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kamu hesaplarının genel kabul görmüş ilkelere uygun tutulmasıdır.","ad":"Standart muhasebe sistemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda dört saydamlık unsuru sayılır ve bunlardan hangisinin kanunda yer almadığı istenir.","panel_ornek":"Bir apartman yönetimi, aidat gelirlerini ve hangi işe ne kadar harcandığını her ay panoya aşarsa bu saydamlıktır. Diyelim toplanan aidat 50 lira, harcanan 40 lira; kalan 10 lira da panoda gösterilir. Sakinler bu sayede yöneticiden hesap sorabilir hale gelir.","ornek":"Bir apartman yönetimi, aidat gelirlerini ve hangi işe ne kadar harcandığını her ay panoya aşarsa bu saydamlıktır. Diyelim toplanan aidat 50 lira, harcanan 40 lira; kalan 10 lira da panoda gösterilir. Sakinler bu sayede yöneticiden hesap sorabilir hale gelir.","yontemler":"Dört unsuru (görev tanımı, planların açıklığı, teşvik açıklaması, standart muhasebe) ezberleyip hesap verebilirlik gibi benzer ama farklı kavramları eleyerek çözülür.","nedir":"Mali saydamlık, kamu kaynaklarının elde edilmesi ve kullanılmasına dair bilgilerin kamuoyuna açık olmasıdır. Sınav, 5018 sayılı Kanun\u0027a göre bu saydamlığı sağlayan unsurları bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Muhasebe Standardı Tuzağı","metin":"Saydamlığı yalnız kamuoyuna açıklama sanıp muhasebe sisteminin standardını konuyla ilgisiz görürsün. Doğrusu: Kamu hesaplarının standart muhasebe sistemine ve genel kabul görmüş ilkelere uygun tutulması Kanun\u0027da açıkça saydamlık unsuru olarak sayılır."},"A":{"ad":"Süre Tuzağı","metin":"Teşvik ve desteklemelerin açıklanma süresinin belirsiz ya da sürekli olduğunu sanıp bu ifadeyi kanunla bağdaşmaz görürsün. Doğrusu: Kanun bu açıklamayı bir yılı geçmemek üzere belirli dönemler itibarıyla öngörür, bu gerçek bir saydamlık unsurudur."},"D":{"ad":"Görev Tanımı Tuzağı","metin":"Görev-yetki tanımını saydamlıktan çok kurumsal düzenleme konusu sanıp dışarıda bırakırsın. Doğrusu: Görev, yetki ve sorumlulukların açık tanımlanması Kanun\u0027da malî saydamlığın ilk sayılan unsurudur."},"B":{"ad":"Süreç Kapsamı Tuzağı","metin":"Saydamlığı yalnız bütçenin son halinin yayımlanması sanıp hazırlık ve uygulama aşamalarını kapsam dışı bırakırsın. Doğrusu: Kanun, politika ve bütçelerin hazırlanmasından uygulama sonuçlarına kadar tüm sürecin açık olmasını saydamlık unsuru sayar."}},"celdiriciYol":{},"hap":"Malî saydamlık bilgiyi açar, hesap verebilirlik ise kaynak kullanımından sorumlu tutulmaktır; saydamlık hesap verebilirliğin ön koşuludur.","teshis":{"C":{"gercek":"Kamu hesaplarının standart muhasebe
