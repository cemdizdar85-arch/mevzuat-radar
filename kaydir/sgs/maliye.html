<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light dark"><title>Tetikte · Kaydır-Çöz</title>
<style>
/* 09.09 AÇIK TEMA — Cem 30.08 "site rengini beyaz yaptık, burası siyah kalmış", 09.09 "bas: açık tema".

   Zemin SAF BEYAZ (Cem 09.09 "soru kısımlarını beyaz yapacaktık"; UWorld/Becker ölçümü beyaz), kart/panel beyaz + çizgi, ikincil yüzey --bg2 kâğıt tonu. Koyu tema yalnız düğmeyle (data-theme="dark", tarayıcıda kc_tema) ya da ?tema=koyu ile; işletim sistemi izlenmez, site de izlemiyor. */
:root{--bg:#ffffff;--bg2:#f4f2ee;--kart:#ffffff;--cizgi:#e6e2da;--yazi:#16191d;--metin:#16191d;--dim:#4b5563;--mavi:#1d4ed8;--yesil:#146f35;--kirmizi:#b91c1c;--altin:#a04a08;--ustYazi:#ffffff}

.temaB{position:fixed;left:10px;bottom:10px;z-index:45;width:34px;height:34px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-vitrin] .temaB{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--yazi);font-family:Segoe UI,system-ui,Arial,sans-serif;overflow:hidden}
#akis{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.kart{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:14px 14px 0;max-width:560px;margin:0 auto}
.ust{display:flex;justify-content:space-between;align-items:center;font-size:.78em;color:var(--dim);margin-bottom:8px}
.noktalar{display:flex;gap:5px}.noktalar i{width:8px;height:8px;border-radius:50%;background:var(--cizgi);display:block}.noktalar i.ok{background:var(--yesil)}.noktalar i.yan{background:var(--kirmizi)}.noktalar i.simdi{outline:2px solid var(--mavi);outline-offset:1px}
.noktalar.cok{gap:3px;flex-wrap:wrap;max-width:58%;justify-content:center}.noktalar.cok i{width:5px;height:5px}
.tt.teori td:first-child{white-space:nowrap;font-weight:700;color:var(--dim);width:1%}
.sinavDil{font:inherit;font-size:.78em;color:var(--mavi);background:transparent;border:1px solid var(--cizgi);border-radius:999px;padding:1px 8px;margin-left:6px;cursor:pointer}
.sinavDilM{margin-top:6px;font-size:.86em;color:var(--dim);border-left:2px solid var(--cizgi);padding-left:8px}
.govde{flex:1;overflow-y:auto;padding-bottom:90px}
.rozet{display:inline-block;font-size:.72em;color:var(--altin);border:1px solid color-mix(in srgb,var(--altin) 50%,transparent);border-radius:20px;padding:2px 9px;margin-bottom:8px}
.soru{font-weight:600;font-size:1.02em;line-height:1.45;margin:0 0 12px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:12px;padding:12px 13px;margin:7px 0;font-size:.95em;cursor:pointer;transition:transform .08s}.sik:active{transform:scale(.985)}
.sik b{color:var(--dim);margin-right:6px}.sik.dogru{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 12%,transparent)}.sik.yanlis{border-color:var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 12%,transparent)}.sik:disabled{cursor:default}
.ipucu{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:.8em;pointer-events:none;animation:zipla 1.6s ease-in-out infinite}
@keyframes zipla{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
/* alt panel: cevap */
.panel{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .28s ease;overflow-y:auto;padding:12px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.panel.acik{transform:translateY(0)}.tutamac{width:38px;height:4px;border-radius:4px;background:var(--cizgi);margin:0 auto 10px}
/* Cem 03.09 "gorunum boyle geliyor": KAPALI panel kartin altina (105%) kayiyor ve SONRAKI KARTIN ustune biniyordu.

.panel{visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s}.panel.acik{visibility:visible;transition:transform .28s ease,visibility 0s}
.kart{overflow:hidden}
.geri{border-left:4px solid var(--kirmizi);background:color-mix(in srgb,var(--kirmizi) 8%,transparent);padding:9px 11px;border-radius:0 10px 10px 0;margin:6px 0 10px;font-size:.95em}.geri.ok{border-color:var(--yesil);background:color-mix(in srgb,var(--yesil) 8%,transparent)}.geri b{margin-right:4px}
.et{color:var(--mavi);font-weight:800;font-size:.75em;letter-spacing:.3px;text-transform:uppercase;margin-top:8px}.panel p{margin:3px 0 6px;font-size:.95em;line-height:1.45}
.hap{border-left:4px solid var(--altin);background:color-mix(in srgb,var(--altin) 8%,transparent);padding:8px 11px;border-radius:0 10px 10px 0;font-weight:600;font-size:.93em;margin:8px 0}

.ozet{font-size:.93em;margin:0 0 8px;line-height:1.45}.ozet b{color:var(--yesil)}
.cipler{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.cip2{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:20px;padding:7px 12px;font-size:.84em;cursor:pointer}.cip2.acik{border-color:var(--mavi);color:var(--mavi)}.cip2.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0;margin-left:auto}

.cip2.ek{display:none}.cipler.acikEk .cip2.ek{display:inline-block}.cipler.acikEk .bDaha{color:var(--dim)}
.cipler .bDaha{border-style:dashed;color:var(--dim)}
.sek{display:none;margin-top:8px}.sek.acik{display:block;animation:gir .2s ease}
.panel{overscroll-behavior:contain}
.kavramL{margin:4px 0 8px;padding-left:18px}.kavramL li{margin:3px 0}.kavramL i{color:var(--dim);font-style:normal;font-size:.85em}
.panelBas{position:sticky;bottom:4px;display:block;margin:10px 0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);font:inherit;font-size:.84em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 14px color-mix(in srgb,var(--bg) 70%,transparent)}

/* yanlis kutusu + hazirlik skoru */
.ustSag{display:flex;align-items:center;gap:6px}
.seviye{font-size:.72em;border:1px solid var(--cizgi);border-radius:12px;padding:1px 8px;margin-left:6px;white-space:nowrap;color:var(--yazi);background:var(--kart)}
.seviye.sv-alarm{border-color:var(--kirmizi)}.seviye.sv-nobet{border-color:var(--altin)}.seviye.sv-isinma{border-color:var(--yesil)}
.ilerleme{height:3px;background:color-mix(in srgb,var(--cizgi) 60%,transparent);margin:0 0 6px}.ilerleme i{display:block;height:100%;background:var(--mavi);transition:width .3s}.ustCip{background:var(--kart);color:var(--yazi);border:1px solid var(--cizgi);border-radius:14px;padding:2px 8px;font-size:.85em;cursor:pointer}.ustCip.hazir{border-color:var(--yesil);color:var(--yesil)}
.kutuEkran{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40;align-items:flex-end;justify-content:center}.kutuEkran.acik{display:flex}
.kutuIc{background:var(--kart);width:min(100%,640px);max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 18px 22px;border:1px solid var(--cizgi)}
@media(min-width:900px){.kutuEkran{align-items:center}.kutuIc{border-radius:18px}}
.kutuIc .basl{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}

.dersSat{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:.92em}.dersSat .bar{height:8px;background:var(--cizgi);border-radius:4px;overflow:hidden}.dersSat .bar i{display:block;height:100%;background:var(--yesil)}
.kutuSat{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.92em}
/* kaynak metni */
.kaynakAd{color:var(--mavi);font-weight:800;font-size:.85em;margin:8px 0 4px}.kaynakMetin{font-size:.9em;line-height:1.55;max-height:260px;overflow-y:auto;background:var(--bg);border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px}.kaynakMetin mark{background:color-mix(in srgb,var(--altin) 35%,transparent);color:var(--yazi);padding:1px 2px;border-radius:3px}
/* sen anlat / t-hesabi / sinavda */
.ipnot{font-size:.84em;color:var(--dim);margin:2px 0 8px}
.anlatK{width:100%;background:var(--bg2);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 11px;font-size:.95em;font-family:inherit;resize:vertical}
.anlatSonuc{font-size:.92em;margin-top:8px;line-height:1.5}.anlatPuan{font-weight:800;font-size:1.05em;margin-bottom:4px}.anlatOrnek{margin-top:8px;border-left:4px solid var(--altin);padding:6px 10px;background:color-mix(in srgb,var(--altin) 8%,transparent);border-radius:0 8px 8px 0}
.tKutular{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:600px){.tKutular{grid-template-columns:1fr 1fr}}

.tGovde{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--yazi);min-height:88px}.tSol{border-right:2px solid var(--yazi);padding:6px 8px}.tSag{padding:6px 8px;text-align:right}

.cikmisK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.88em;color:var(--dim);line-height:1.45}.cikmisK .yil{display:inline-block;background:color-mix(in srgb,var(--mavi) 15%,transparent);color:var(--mavi);font-weight:800;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.85em}

.ogret{margin:4px 0 6px}.thpNot{font-size:.85em;color:var(--dim);margin:2px 0 8px}
.hesapK{border:1px solid var(--cizgi);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:.9em;line-height:1.45}.hesapK.yan{border-color:color-mix(in srgb,var(--kirmizi) 60%,transparent)}.hesapK.dog{border-color:color-mix(in srgb,var(--yesil) 60%,transparent)}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}.btn{background:var(--bg);color:var(--yazi);border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;font-size:.9em;cursor:pointer}.btn.ana{background:var(--yesil);color:var(--ustYazi);font-weight:800;border:0}.btn.mavi{border-color:var(--mavi);color:var(--mavi)}
/* surukleme oyunu */

.oyun{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:var(--bg);display:none;flex-direction:column;padding:14px;z-index:20;overflow-y:auto}.oyun.acik{display:flex}

#akis,.govde,.tabloSar,.serit,.panel,.oyun{scrollbar-width:none}#akis::-webkit-scrollbar,.govde::-webkit-scrollbar,.tabloSar::-webkit-scrollbar,.serit::-webkit-scrollbar,.panel::-webkit-scrollbar,.oyun::-webkit-scrollbar{display:none}

<script>
// 09.09 tema + vitrin: varsayılan açık (site), koyu yalnız düğmeyle; ?tema=koyu|acik zorlar; ?vitrin=1 = ana sayfa vitrini
// (düğme gizli, kasaya cevap/kâğıt YAZMAZ ki "en çok yanıltan soru" ölçümü vitrin tıklamasıyla kirlenmesin).
const VITRIN=/[?&]vitrin=1/.test(location.search);
(function(){ const d=document.documentElement; const q=(location.search.match(/[?&]tema=(koyu|acik)/)||[])[1]; let t=null; try{ t=localStorage.getItem('kc_tema'); }catch(e){}
  if(q==='koyu') t='dark'; else if(q==='acik') t='light';
  if(t==='dark') d.setAttribute('data-theme','dark'); else d.removeAttribute('data-theme');
  if(VITRIN) d.setAttribute('data-vitrin','1');
  document.addEventListener('DOMContentLoaded',()=>{ const b=document.getElementById('temaB'); if(!b) return;
    const ikon=()=>{ const koyu=d.getAttribute('data-theme')==='dark'; b.textContent=koyu?'☀':'☾'; b.setAttribute('aria-label',koyu?'Açık temaya geç':'Koyu temaya geç'); };

const SORULAR=[{"capa":{"kaynak":"çıkmış soru"},"kural":"Gayrisafilik (safi olmama) ilkesi, bütçede gelirler ve giderlerin birbirinden mahsup edilmeden tam ve brüt tutarlarıyla ayrı ayrı gösterilmesini gerektirir; bir kurumun tahsilat gideri, tahsil ettiği gelirden düşülüp net yazılamaz, ikisi de ayrı ayrı bütçeye girer. Amaç yasama organının bütçeyi tam görebilmesidir, çünkü mahsuplaşma gerçek büyüklükleri gizler.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Bütçe ilkesi ihlali sorularında yapılan işlemi tek fiille adlandır: mahsup, bütçe dışına çıkarma, ayrı bütçe kurma ya da izinsiz harcama.","konu":"bütçe ilkeleri","tablo":{"satirlar":[["VERİLENLER","-"],["Yapılan işlem","Giderin gelirden indirilerek net gösterilmesi"],["İhlal edilen kural","Brüt gösterim zorunluluğu"],["HESAP","-"],["Ne soruluyor","Bu uygulama hangi bütçe ilkesine aykırıdır?"],["Kural","Gayrisafilik (safi olmama) ilkesi, bütçede gelirler ve giderlerin birbirinden mahsup edilmeden tam ve brüt tutarlarıyla ayrı ayrı gösterilmesini gerektirir; bir kurumun tahsilat gideri, tahsil ettiği gelirden düşülüp net yazılamaz, ikisi de ayrı ayrı bütçeye girer. Amaç yasama organının bütçeyi tam görebilmesidir, çünkü mahsuplaşma gerçek büyüklükleri gizler."],["Doğru şık","D) Gayrisafilik ilkesi"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Yıllık olma ilkesi","E":"Önceden izin ilkesi","A":"Genellik ilkesi","D":"Gayrisafilik ilkesi","B":"Birlik ilkesi"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Butce ilkeleri: gayrisafilik (safi olmama)","metin":"TEORİ (maliye; çerçevesi 5018 sayılı Kanun\u0027un bütçe ilkelerinde). GAYRİSAFİLİK (SAFİ OLMAMA) İLKESİ: bütçede gelirler ve giderler BİRBİRİNDEN MAHSUP EDİLMEDEN, TAM VE BRÜT tutarlarıyla ayrı ayrı gösterilir. Örneğin bir kurumun tahsilat gideri, tahsil ettiği gelirden düşülüp \u0027net\u0027 yazılamaz; ikisi de ayrı ayrı bütçeye girer. AMAÇ: parlamentonun bütçeyi TAM OLARAK görebilmesi ve denetleyebilmesidir; mahsuplaşma gerçek büyüklükleri gizler. DİĞER KLASİK BÜTÇE İLKELERİ: (1) GENELLİK - tüm gelir ve giderler bütçede yer alır, bütçe dışı işlem olmaz. (2) BİRLİK - tüm gelir ve giderler TEK bir bütçede toplanır. (3) ANLAŞILABİLİRLİK/AÇIKLIK - bütçe herkesin anlayabilecegi sadelikte olur. (4) DOĞRULUK - tahminler gerçeğe uygun yapılır. (5) SAMIMIYET - tahminler bilerek yanlış yapılmaz. (6) ÖNCEDEN İZİN - harcama yapılmadan ÖNCE yasama organının izni alınır. (7) YILLIK OLMA - bütçe bir yıllık dönem için hazırlanır. (8) ALENİYET (KAMUOYUNA AÇIKLIK) - bütçe süreci ve sonuçları kamuoyuna açıktır. (9) TAHSİS (AYRIM) - ödenekler tahsis edildiği amaç dışında kullanılamaz. (10) DENKLİK - gelir ve giderlerin denk olması (klasik görüş). ADEM-I TAHSİS İLKESİ: belirli bir gelirin belirli bir gidere bağlanmamasıdır; gayrisafilikle karıştırılmamalıdır. SINAV TUZAĞI: gayrisafilik MAHSUP YAPILMAMASI, genellik ise HİÇBİR İŞLEMİN BÜTÇE DIŞI KALMAMASIDIR - ikisi farklı ilkelerdir."},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.1","metin":"Madde 1- Bu Kanunun amacı, kalkınma planları ve programlarda yer alan politika ve hedefler doğrultusunda kamu kaynaklarının etkili, ekonomik ve verimli bir şekilde elde edilmesi ve kullanılmasını, hesap verebilirliği ve malî saydamlığı sağlamak üzere, kamu malî yönetiminin yapısını ve işleyişini, kamu bütçelerinin hazırlanmasını, uygulanmasını, tüm malî işlemlerin muhasebeleştirilmesini, raporlanmasını ve malî kontrolü düzenlemektir. Kapsam"}],"hakem":"Soru gayrisafilik ilkesini doğru tanımlamakta; kaynak metinde açıkça bu ilke tanımlanmış ve tahsilat gideri örneği verilmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Yıllık olma ilkesi, bütçenin bir takvim yılı için hazırlanmasıdır. Giderin gelirden indirilmesi ile yıl süresi hiçbir ilişkisi yoktur.","E":"Önceden izin ilkesi, harcama yapılmadan önce yasama organının onayını gerektirir. Soruda harcama yapıldığı, sadece gidiş şekli (net gösterim) sorunludur.","A":"Genellik ilkesi, gelir ve giderlerin bütçe dışında kalmamasını ister. Soruda kalemler bütçede yer almıştır, sadece netleştirilmiştir; bu farklı bir ilkenin ihlalidir.","B":"Birlik ilkesi, tüm gelir ve giderlerin tek bir bütçede toplanmasını ister. Burada mahsuplaşma sorunu vardır, birlik değil."},"dogru":"Bütçede gelirler ve giderler birbirinden indirilerek (mahsup edilerek) gösterilemez; her ikisi de tam tutarlarıyla ayrı ayrı yer almalıdır. Aksi takdirde parlamentonun gerçek rakamları görmesi ve denetlemesi zorlaşır. Bu kuralı gayrisafilik ilkesi gerektirir.","sinav":"Kamu Malî Yönetimi Kanunu 5018 sayılı Kanun\u0027un bütçe ilkeleri kapsamında gayrisafilik (safi olmama) ilkesi ihlal edilmiştir.","kavramlar":[{"kaynak":"TEORI","tanim":"Bütçede gelirler ve giderler birbirinden mahsup edilmeden tam ve brüt tutarlarıyla ayrı ayrı gösterilmesidir. Amaç, parlamentonun bütçeyi tam olarak görebilmesi ve denetleyebilmesidir.","ad":"Gayrisafilik (safi olmama) ilkesi"},{"kaynak":"Kamu Malî Yönetimi K. 3. madde","tanim":"Kanunlara dayanılarak toplanan vergi, resim, harç, faiz, zam, ceza, taşınır ve taşınmazlardan elde edilen gelirler ile hizmet karşılığı ve diğer gelirleridir.","ad":"Kamu geliri"},{"kaynak":"Kamu Malî Yönetimi K. 3. madde","tanim":"Kanunlarına dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, katkı payları, borç faizleri, transferler, bağış ve yardımlar ile diğer giderleridir.","ad":"Kamu gideri"}]},"cikmis":{"pencereDonemler":[],"kopru":4,"ornekler":[],"donemler":["2025/1","2019/3","2015/3","2015/1"]},"oyun":null,"tip":"teori","soru":"Bir kamu idaresinin tahsilat gideri, topladığı gelirden indirilerek bütçeye net tutarla gösterilmiştir. Bu uygulama hangi bütçe ilkesine aykırıdır?","kayitBaslik":"","id":"sgs-t4-maliye-zor/kp-01","verilenler":[{"deger":"Giderin gelirden indirilerek net gösterilmesi","anlam":"Mahsuplaşma anlamına gelir.","ad":"Yapılan işlem"},{"deger":"Brüt gösterim zorunluluğu","anlam":"Gayrisafilik ilkesinin gereğidir.","ad":"İhlal edilen kural"}],"dayanak":"Teori notu: bütçe ilkeleri, gayrisafilik (safi olmama) — bütçede gelirler ve giderler birbirinden mahsup edilmeden tam ve brüt tutarlarıyla ayrı ayrı gösterilir, bir kurumun tahsilat gideri tahsil ettiği gelirden düşülüp net yazılamaz, amaç yasama organının bütçeyi tam olarak görebilmesi ve denetleyebilmesidir çünkü mahsuplaşma gerçek büyüklükleri gizler; genellik ilkesi hiçbir işlemin bütçe dışı kalmamasını ister ve gayrisafilikle karıştırılmamalıdır","dogru":"D","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Adım 1 = Yapılan işlem mahsuplaşmadır","anlatim":"Gider gelirden indirilmiş ve bütçeye net tutar yazılmıştır.","doldur":[]},{"formul":"Adım 2 = Gayrisafilik ilkesi brüt gösterimi zorunlu kılar","anlatim":"Gelir ve gider ayrı ayrı, tam tutarlarıyla bütçeye girer.","doldur":[[5,1]]},{"formul":"Adım 3 = Karışan ilke genelliktir, o bütçe dışı kalmayı yasaklar","anlatim":"Burada kalemler bütçededir, sorun gösterim biçimindedir; bu yüzden ihlal edilen ilke gayrisafiliktir.","doldur":[[6,1]]}],"anahtar":[{"ornek":"bütçeye","kok":"bütçey"},{"ornek":"gösterim","kok":"göster"},{"ornek":"gayrisafilik","kok":"gayris"},{"ornek":"gelirden","kok":"gelird"},{"ornek":"tutarlarıyla","kok":"tutarl"},{"ornek":"bütçede","kok":"bütçed"}],"konuGiris":{"harita":"Ne zaman test edilir: soru bir mahsuplaşma/net gösterim durumu anlattığında test edilir. Nasıl ölçülür: hangi klasik ilkenin (gayrisafilik mi, genellik mi, birlik mi) ihlal edildiğinin ayırt edilmesiyle ölçülür. Nasıl kaydedilir: doğru ilkenin adı seçenekten işaretlenerek kaydedilir.","desen":"Soru genellikle bir kurumun gelirinden bir gideri düşüp net göstermesini anlatır ve öğrenciyi genellik ile gayrisafiliği karıştırmaya iter. Tuzak, \u0027bütçe dışı kalma\u0027 ile \u0027mahsup edilme\u0027 durumlarının farklı ilkeler olduğunu ayırt ettirmektir (p.28). Bu soru mahsuplaşma/net gösterim tuzağı noktasından geliyor.","terimler":[{"kaynak":"k m":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 95","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İlke isimleri yakın göründüğünde şıktaki fiile bak: \u0027mahsup edilmeden brüt gösterilir\u0027 gayrisafiliktir, diğer fiiller baska bir ilkeye aittir.","konu":"bütçe ilkeleri","tablo":{"satirlar":[["A) Bütçede yer alan gelirler ve giderler, birbirinden mahsu…","5018 sayılı Kanun - gayrisafilik","doğru ifade"],["B) Bütçe kapsamına giren kamu idarelerinin tüm gelir ve gid…","5018 sayılı Kanun - genellik","YANLIŞ ifade"],["C) Belirli bir kamu gelirinin, önceden belirlenmiş belirli …","5018 sayılı Kanun - adem-i tahsis","YANLIŞ ifade"],["D) Bütçede öngörülen gelirler ile giderlerin birbirine eşit…","5018 sayılı Kanun - denklik","YANLIŞ ifade"],["E) Kamu idarelerinin tüm gelir ve giderlerinin, ayrı ayrı b…","5018 sayılı Kanun - birlik","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Belirli bir kamu gelirinin, önceden belirlenmiş belirli bir kamu giderine tahsis edilmemesi esastır.","E":"Kamu idarelerinin tüm gelir ve giderlerinin, ayrı ayrı bütçeler yerine tek bir bütçe içinde toplanması esastır.","A":"Bütçede yer alan gelirler ve giderler, birbirinden mahsup edilmeksizin tam ve brüt tutarlarıyla ayrı ayrı gösterilir.","D":"Bütçede öngörülen gelirler ile giderlerin birbirine eşit olması esastır.","B":"Bütçe kapsamına giren kamu idarelerinin tüm gelir ve giderlerinin herhangi bir istisna olmaksızın bütçede yer alması gerekir."},"kaynak":{"alinti":"gelirler ve giderler birbirinden mahsup edilmeksizin tam ve brüt tutarlarıyla ayrı ayrı gösterilir","liste":[{"ad":"TEORI - Butce ilkeleri: gayrisafilik (safi olmama)","metin":"TEORİ (maliye; çerçevesi 5018 sayılı Kanun\u0027un bütçe ilkelerinde). GAYRİSAFİLİK (SAFİ OLMAMA) İLKESİ: bütçede gelirler ve giderler BİRBİRİNDEN MAHSUP EDİLMEDEN, TAM VE BRÜT tutarlarıyla ayrı ayrı gösterilir. Örneğin bir kurumun tahsilat gideri, tahsil ettiği gelirden düşülüp \u0027net\u0027 yazılamaz; ikisi de ayrı ayrı bütçeye girer. AMAÇ: parlamentonun bütçeyi TAM OLARAK görebilmesi ve denetleyebilmesidir; mahsuplaşma gerçek büyüklükleri gizler. DİĞER KLASİK BÜTÇE İLKELERİ: (1) GENELLİK - tüm gelir ve giderler bütçede yer alır, bütçe dışı işlem olmaz. (2) BİRLİK - tüm gelir ve giderler TEK bir bütçede toplanır. (3) ANLAŞILABİLİRLİK/AÇIKLIK - bütçe herkesin anlayabilecegi sadelikte olur. (4) DOĞRULUK - tahminler gerçeğe uygun yapılır. (5) SAMIMIYET - tahminler bilerek yanlış yapılmaz. (6) ÖNCEDEN İZİN - harcama yapılmadan ÖNCE yasama organının izni alınır. (7) YILLIK OLMA - bütçe bir yıllık dönem için hazırlanır. (8) ALENİYET (KAMUOYUNA AÇIKLIK) - bütçe süreci ve sonuçları kamuoyuna açıktır. (9) TAHSİS (AYRIM) - ödenekler tahsis edildiği amaç dışında kullanılamaz. (10) DENKLİK - gelir ve giderlerin denk olması (klasik görüş). ADEM-I TAHSİS İLKESİ: belirli bir gelirin belirli bir gidere bağlanmamasıdır; gayrisafilikle karıştırılmamalıdır. SINAV TUZAĞI: gayrisafilik MAHSUP YAPILMAMASI, genellik ise HİÇBİR İŞLEMİN BÜTÇE DIŞI KALMAMASIDIR - ikisi farklı ilkelerdir."}],"hakem":"Soru bütçe ilkelerinden gayrisafilik ilkesini soruyor; A şıkkı kaynakta açıkça tanımlanan \u0027gelirler ve giderler birbirinden mahsup edilmeksizin tam ve brüt tutarlarıyla ayrı ayrı gösterilir\u0027 kuralını doğru olarak ifade ediyor."},"kayitlar":[],"sade":{"siklar":{"C":"Adem-i tahsis ilkesinin tanımıdır. Bir gelirin belirli bir gidere bağlanmamasını anlatır; gayrisafilik ise gelirlerle giderlerin mahsup yapılmadan brüt gösterilmesidir.","E":"Birlik ilkesinin tanımıdır. Tüm gelir ve giderlerin tek bir bütçede toplanmasını öngörür; gayrisafilik kalemlerin mahsup edilmeden ayrı gösterilmesini gerektirir.","D":"Denklik ilkesine aittir. Gelir ve giderlerin eşit olması gerektiğini söyler; gayrisafilik tutarların brüt ve ayrı gösterilmesiyle ilgilidir.","B":"Genellik ilkesinin tanımıdır. Bu ilke hiçbir işlemin bütçe dışında kalmamasını öngörür; gayrisafilik ise mahsup edilmeyip ayrı gösterilme meselesidir."},"dogru":"Gayrisafilik ilkesi, bütçedeki gelir ve giderlerin birbirinden düşülmeden (mahsup edilmeden) tam tutarlarıyla ayrı ayrı yazılmasını gerektirir. Bu sayede parlamentonun gerçek rakamları görebilmesi ve denetim yapabilmesi sağlanır.","sinav":"Kamu Malî Yönetimi ve Kontrol Kanunu bütçe ilkelerine göre gayrisafilik ilkesi, bütçede gelirler ve giderler birbirinden mahsup edilmeksizin tam ve brüt tutarlarıyla ayrı ayrı gösterilir.","kavramlar":[{"kaynak":"TEORI","tanim":"Bütçede gelirler ve giderler birbirinden mahsup edilmeden tam ve brüt tutarlarıyla ayrı ayrı gösterilir; amacı parlamentonun bütçeyi tam olarak görebilmesi ve denetleyebilmesidir.","ad":"gayrisafilik (safi olmama) ilkesi"},{"kaynak":"TEORI","tanim":"Bir gelirin tahsil maliyetini o gelirden düşüp net tutarını göstermek; gayrisafilik ilkesi bu uygulamayı yasaklar.","ad":"mahsup etme"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":["2025/1","2019/3","2015/3","2015/1"]},"oyun":null,"tip":"teori","soru":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununda düzenlenen bütçe ilkelerinden gayrisafilik (safi olmama) ilkesine ilişkin açıklamalardan hangisi doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-maliye-zor/kp-01","verilenler":[],"dayanak":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu - bütce ilkeleri (öğreti notu)","dogru":"A","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Belediyenin su işletmesi 2023\u0027te 8 milyon lira tahsilat yapıyor, tahsilat için de 500 bin lira gider harcıyor.","anlatim":"Muhasebeci \u0027net 7,5 milyon yazalım\u0027 diyor. Bütçe uzmanı buna itiraz ediyor. Bu olayda beş ilke iddiasını tek tek test edeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 8 milyon gelir ve 500 bin gider birbirinden mahsup edilmeden, tam ve brüt tutarlarıyla ayrı ayrı bütçeye girecek.","anlatim":"Kural tek: gayrisafilik ilkesi mahsuplaşmayı yasaklar, her kalem brüt görünür. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"5018 sayılı Kanun - gayrisafilik","karar":"doğru","anlatim":"Bu tam olarak olayın çözümü, 8 milyon ve 500 bin ayrı ayrı görünecek. Mahsuplaşma parlamentonun gerçek büyüklüğü görmesini engeller.","formul":"Şık A: uzman \u0027ikisini de ayrı ayrı brüt yaz, mahsup etme\u0027 diyor, doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"5018 sayılı Kanun - genellik","karar":"yanlış","anlatim":"Bu genellik ilkesi, bütçe dışı işlem kalmaması demek. Olaydaki mahsup yasağıyla ilgisi yok, farklı ilke.","formul":"Şık B: biri \u0027belediyenin tüm gelir gideri istisnasız bütçede olmalı\u0027 diyor, bu gayrisafilik mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"5018 sayılı Kanun - adem-i tahsis","karar":"yanlış","anlatim":"Bu adem-i tahsis ilkesi, belirli gelirin belirli gidere bağlanmaması. Olayda mahsup değil tahsis konu ediliyor, karışıklık burada.","formul":"Şık C: biri \u0027su geliri sadece su giderine ayrılsın\u0027 diyor, bu gayrisafilik mi?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"5018 sayılı Kanun - denklik","karar":"yanlış","anlatim":"Bu denklik ilkesi, klasik görüşteki eşitlik kuralı. Olayda 8 milyon ile 500 bin eşit değil, sorun brüt gösterimde.","formul":"Şık D: biri \u0027gelir gider eşit olsun\u0027 diyor, bu gayrisafilik mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"5018 sayılı Kanun - birlik","karar":"yanlış","anlatim":"Bu birlik ilkesi, tek bütçe sayısıyla ilgili. Olaydaki 8 milyon ve 500 bin zaten aynı bütçede, mesele mahsup yasağı.","formul":"Şık E: biri \u0027belediyenin tüm işlemleri tek bütçede toplansın\u0027 diyor, bu gayrisafilik mi?"},{"formul":"Kapanış: A ✓ B ✗ C ✗ D ✗ E ✗","anlatim":"Gayrisafilik sadece mahsup yasağıdır, diğer ilkeler kapsam, tahsis, eşitlik ve bütçe sayısıyla ilgili. Kendine sor: cümle \u0027mahsup edilmeden brüt gösterilir\u0027 mi diyor, yoksa başka bir şey mi anlatıyor?","doldur":[]}],"anahtar":[{"ornek":"mahsup","kok":"mahsup"},{"ornek":"olayda","kok":"olayda"},{"ornek":"ilkesine","kok":"ilkesi"},{"ornek":"tahsis","kok":"tahsis"},{"ornek":"milyon","kok":"milyon"},{"ornek":"gösterilmesidir","kok":"göster"}],"konuGiris":{"harita":"Ne zaman test edilir: bütçe hazırlanıp gelir-gider kalemleri yasama organına sunulurken. Nasıl ölçülür: her gelir ve giderin mahsup edilmeden ayrı ayrı ve brüt olarak yer alıp almadığına bakılarak. Nasıl kaydedilir: gelirler ve giderler bütçede birbirinden bağımsız, tam tutarlarıyla ayrı satırlarda gösterilir.","desen":"Tuzak, gayrisafiliği genellik ilkesiyle veya adem-i tahsis ilkesiyle karıştırmaktır; gayrisafilik mahsup yapılmaması, genellik ise hiçbir işlemin bütçe dışı kalmamasıdır. Şıklarda \u0027net tutar yazılır\u0027 ifadesi doğru gibi sunulup yanlış seçenek olarak konur. Bu soru gayrisafiliğin diğer klasik bütçe ilkeleriyle ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Gelir ve giderlerin mahsup edilmeden brüt tutarlarıyla ayrı gösterilmesi","ad":"Gayrisafilik (safi olmama)","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tüm gelir ve giderlerin bütçe içinde yer alması, bütçe dışı işlem olmaması","ad":"Genellik ilkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Belirli bir gelirin belirli bir gidere bağlanmaması","ad":"Adem-i tahsis ilkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tüm gelir ve giderlerin tek bir bütçede toplanması","ad":"Birlik ilkesi","kim":"kanun sabitler"}],"sinavda":"Soruda gayrisafilik ilkesine ilişkin açıklamalar verilir ve doğru tanımı seçmeniz istenir.","panel_ornek":"Bir öğrenci market kasasında çalışıyor: ayda 50 lira maaş alıyor, ayrıca kırdığı bir bardağın 5 lirası maaştan düşülmüyor, ikisi de ayrı ayrı bordroya yazılıyor. İşte gayrisafilik de tam böyle; kesinti yapıp \u0027net 45 lira\u0027 yazmak yasaktır, iki tutar da ayrı görünür.","ornek":"Bir öğrenci market kasasında çalışıyor: ayda 50 lira maaş alıyor, ayrıca kırdığı bir bardağın 5 lirası maaştan düşülmüyor, ikisi de ayrı ayrı bordroya yazılıyor. İşte gayrisafilik de tam böyle; kesinti yapıp \u0027net 45 lira\u0027 yazmak yasaktır, iki tutar da ayrı görünür.","yontemler":"Şıkları elerken \u0027mahsup/net\u0027 kelimesi geçen ifadenin yanlış olduğunu, \u0027ayrı ayrı brüt gösterim\u0027 ifadesinin doğru olduğunu bil.","nedir":"Gayrisafilik, kamu bütçesinde gelir ve giderlerin birbirinden mahsup edilmeden brüt tutarlarıyla gösterilmesidir. Sınav bu ilkenin diğer bütçe ilkeleriyle (genellik, birlik, tahsis) karıştırılıp karıştırılmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Adem-i Tahsis Tuzağı","metin":"Bu ifade belirli bir gelirin belirli bir gidere bağlanmamasını anlatan adem-i tahsis ilkesidir. Doğrusu: Gayrisafilik, gelir-gider bağlantısıyla değil mahsup yasağıyla ilgilidir."},"E":{"ad":"Birlik Tuzağı","metin":"Bu ifade birlik ilkesinin tanımıdır, tüm gelir ve giderlerin tek bütcede toplanmasını anlatır. Doğrusu: Gayrisafilik bütcenin tekliğiyle değil, kalemlerin mahsup edilmeden ayrı gösterilmesiyle ilgilidir."},"D":{"ad":"Denklik Tuzağı","metin":"Bu ifade klasik bütce teorisindeki denklik ilkesinin tanımıdır, gelir-gider eşitliğini öngörür. Doğrusu: Gayrisafilik denklikle değil, tutarların brüt gösterilmesiyle ilgilidir."},"B":{"ad":"Genellik Tuzağı","metin":"Bu ifade genellik ilkesinin tanımıdır, hiçbir işlemin bütce dışında kalmamasını anlatır. Doğrusu: Gayrisafilik kapsam değil, kalemlerin mahsup edilmeden brüt gösterilmesi meselesidir."}},"celdiriciYol":{},"hap":"Gayrisafilik, gelir ve giderin mahsup edilmeden BRÜT gösterilmesidir; kapsam (genellik), tahsis (adem-i tahsis), eşitlik (denklik) ve sayı (birlik) ile karıştırılmaz.","teshis":{"C":{"gercek":"Belirli gelirin belirli gidere bağlanmaması adem-i tahsis ilkesidir, gayrisafilikten ayrıdır.","ayirt":"Cümle bir gelirin bir gidere \u0027tahsisinden\u0027 mi bahsediyor, yoksa \u0027mahsup edilmemesinden\u0027 mi?","paragraf":"5018 sayılı Kanun - bütce ilkeleri (öğreti notu)","yanilgi":"Gelir-gider bağlantısının kesilmesini gayrisafilik sanıyorsun."},"E":{"gercek":"Tüm gelir ve giderlerin tek bütcede toplanması birlik ilkesidir; gayrisafilik mahsup yasağıdır.","ayirt":"Cümle bütcenin \u0027sayısından\u0027 mı bahsediyor, yoksa kalemlerin \u0027brüt gösteriminden\u0027 mi?","paragraf":"5018 sayılı Kanun - bütce ilkeleri (öğreti notu)","yanilgi":"Tek bütcede toplanmayı gayrisafilik sanıyorsun."},"A":{"gercek":"Gayrisafilik, mahsup yapılmadan gelir ve giderin brüt gösterilmesidir; bu tam olarak o tanımdır.","ayirt":"Cümlede \u0027mahsup edilmeden brüt gösterilir\u0027 ifadesi var mı?","paragraf":"5018 sayılı Kanun - bütce ilkeleri (öğreti notu)","yanilgi":"Bu ifadenin çok genel goründüğü için başka bir ilkenin de tanımı olabileceğini düşünüp eliyorsun."},"D":{"gercek":"Gelir-gider eşitliği klasik görüşteki denklik ilkesidir; gayrisafilik brüt gösterim kuralıdır.","ayirt":"Cümle \u0027eşit olması\u0027 mı diyor, yoksa \u0027ayrı ayrı brüt gösterilmesi\u0027 mi?","paragraf":"5018 sayılı Kanun - bütce ilkeleri (öğreti notu)","yanilgi":"Gelir-gider esitliğini gayrisafilikle karıştırıyorsun."},"B":{"gercek":"Genellik, hiçbir gelir/giderin bütce dışında kalmamasıdır; gayrisafilik ise kalemlerin netleştirilmeden gösterilmesidir.","ayirt":"Cümle \u0027kapsam dışı kalmaz\u0027 mı diyor yoksa \u0027netleştirilmeden gösterilir\u0027 mi diyor?","paragraf":"5018 sayılı Kanun - bütce ilkeleri (öğreti notu)","yanilgi":"Kapsam dışı işlem kalmaması ile mahsup yapılmamasını aynı ilke sanıyorsun."}},"verilen":[],"donem":4,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"Adem-i tahsis ilkesi, belirli bir gelirin belirli bir gidere bağlanmamasını, yani bütün gelirlerin havuzda toplanıp bütün giderlerin bu havuzdan karşılanmasını ifade eder ve gayrisafilikle karıştırılmamalıdır. Gayrisafilik gelir ve giderin mahsup edilmeden brüt gösterilmesi, genellik hiçbir işlemin bütçe dışı kalmaması, birlik ise tek bütçede toplanmadır.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"İlke sorularında ilkenin yasakladığı davranışı tek fiille yaz: mahsup etmek, bütçe dışına çıkarmak, tahsis etmek ya da ayrı bütçe kurmak.","konu":"bütçe ilkeleri","tablo":{"satirlar":[["VERİLENLER","-"],["Anlatılan kural","Gelirin belirli bir gidere bağlanmaması"],["Karışan ilke","Gayrisafilik"],["HESAP","-"],["Ne soruluyor","Belirli bir gelirin belirli bir gidere tahsis edilmemesi hangi ilke ile ifade edilir?"],["Kural","Adem-i tahsis ilkesi, belirli bir gelirin belirli bir gidere bağlanmamasını, yani bütün gelirlerin havuzda toplanıp bütün giderlerin bu havuzdan karşılanmasını ifade eder ve gayrisafilikle karıştırılmamalıdır. Gayrisafilik gelir ve giderin mahsup edilmeden brüt gösterilmesi, genellik hiçbir işlemin bütçe dışı kalmaması, birlik ise tek bütçede toplanmadır."],["Doğru şık","B) Adem-i tahsis ilkesi"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Genellik ilkesi","E":"Doğruluk ilkesi","A":"Gayrisafilik (safi olmama) ilkesi","D":"Birlik ilkesi","B":"Adem-i tahsis ilkesi"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Butce ilkeleri: gayrisafilik (safi olmama)","metin":"TEORİ (maliye; çerçevesi 5018 sayılı Kanun\u0027un bütçe ilkelerinde). GAYRİSAFİLİK (SAFİ OLMAMA) İLKESİ: bütçede gelirler ve giderler BİRBİRİNDEN MAHSUP EDİLMEDEN, TAM VE BRÜT tutarlarıyla ayrı ayrı gösterilir. Örneğin bir kurumun tahsilat gideri, tahsil ettiği gelirden düşülüp \u0027net\u0027 yazılamaz; ikisi de ayrı ayrı bütçeye girer. AMAÇ: parlamentonun bütçeyi TAM OLARAK görebilmesi ve denetleyebilmesidir; mahsuplaşma gerçek büyüklükleri gizler. DİĞER KLASİK BÜTÇE İLKELERİ: (1) GENELLİK - tüm gelir ve giderler bütçede yer alır, bütçe dışı işlem olmaz. (2) BİRLİK - tüm gelir ve giderler TEK bir bütçede toplanır. (3) ANLAŞILABİLİRLİK/AÇIKLIK - bütçe herkesin anlayabilecegi sadelikte olur. (4) DOĞRULUK - tahminler gerçeğe uygun yapılır. (5) SAMIMIYET - tahminler bilerek yanlış yapılmaz. (6) ÖNCEDEN İZİN - harcama yapılmadan ÖNCE yasama organının izni alınır. (7) YILLIK OLMA - bütçe bir yıllık dönem için hazırlanır. (8) ALENİYET (KAMUOYUNA AÇIKLIK) - bütçe süreci ve sonuçları kamuoyuna açıktır. (9) TAHSİS (AYRIM) - ödenekler tahsis edildiği amaç dışında kullanılamaz. (10) DENKLİK - gelir ve giderlerin denk olması (klasik görüş). ADEM-I TAHSİS İLKESİ: belirli bir gelirin belirli bir gidere bağlanmamasıdır; gayrisafilikle karıştırılmamalıdır. SINAV TUZAĞI: gayrisafilik MAHSUP YAPILMAMASI, genellik ise HİÇBİR İŞLEMİN BÜTÇE DIŞI KALMAMASIDIR - ikisi farklı ilkelerdir."},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.1","metin":"Madde 1- Bu Kanunun amacı, kalkınma planları ve programlarda yer alan politika ve hedefler doğrultusunda kamu kaynaklarının etkili, ekonomik ve verimli bir şekilde elde edilmesi ve kullanılmasını, hesap verebilirliği ve malî saydamlığı sağlamak üzere, kamu malî yönetiminin yapısını ve işleyişini, kamu bütçelerinin hazırlanmasını, uygulanmasını, tüm malî işlemlerin muhasebeleştirilmesini, raporlanmasını ve malî kontrolü düzenlemektir. Kapsam"}],"hakem":"Soru bütçe ilkeleri kapsamında adem-i tahsis ilkesini tanımlamakta, kaynak metinde bu ilke açıkça tanımlanmış ve doğru seçenek (B) ile eşleşmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Genellik ilkesi, hiçbir gelir ve giderin bütçe dışında kalmaması gerektiğini ifade eder. Sorulan ise gelirin gidere tahsis edilmemesi konusudur.","E":"Doğruluk ilkesi, tahminlerin gerçeğe uygun yapılmasını ifade eder. Sorulan ise gelirin gidere tahsis edilmemesi ilkesidir.","D":"Birlik ilkesi, tüm gelir ve giderlerin tek bir bütçede toplanmasını ister. Ancak sorulan, gelirin belirli gidere bağlanmaması yani adem-i tahsistir.","A":"Gayrisafilik ilkesi, gelir ve giderleri mahsup edilmeden brüt tutarlarıyla ayrı ayrı göstermek anlamındadır. Sorulan ise gelirlerin giderlere bağlanmaması, yani havuzda toplanmasıdır."},"dogru":"Belirli bir gelirin belirli bir gidere bağlanmaması, yani tüm gelirlerin havuzda toplanıp tüm giderlerin oradan karşılanması adem-i tahsis ilkesiyle ifade edilir. Bu, gelir ve gideri mahsup etmeden gösterme anlamına gelen gayrisafilikten farklıdır.","sinav":"Kamu Malî Yönetimi Kanunu 5018 sayılı Kanunun bütçe ilkeleri kapsamında, adem-i tahsis ilkesi belirli bir gelirin belirli bir gidere bağlanmaması anlamına gelir.","kavramlar":[{"kaynak":"TEORI","tanim":"Belirli bir gelirin belirli bir gidere bağlanmaması, tüm gelirlerin havuzda toplanıp tüm giderlerin bu havuzdan karşılanması ilkesidir.","ad":"Adem-i tahsis ilkesi"},{"kaynak":"TEORI","tanim":"Bütçede gelirler ve giderler birbirinden mahsup edilmeden, tam ve brüt tutarlarıyla ayrı ayrı gösterilmesi ilkesidir.","ad":"Gayrisafilik ilkesi"},{"kaynak":"TEORI","tanim":"Tüm gelir ve giderlerin bütçede yer alması, hiçbir işlemin bütçe dışında kalmaması ilkesidir.","ad":"Genellik ilkesi"}]},"cikmis":{"pencereDonemler":[],"kopru":4,"ornekler":[],"donemler":["2025/1","2019/3","2015/3","2015/1"]},"oyun":null,"tip":"teori","soru":"Belirli bir gelirin belirli bir gidere tahsis edilmemesi hangi ilke ile ifade edilir?","kayitBaslik":"","id":"sgs-t4-maliye-cokzor/kp-01","verilenler":[{"deger":"Gelirin belirli bir gidere bağlanmaması","anlam":"Adem-i tahsis ilkesinin tanımıdır.","ad":"Anlatılan kural"},{"deger":"Gayrisafilik","anlam":"Mahsup yasağıyla ilgilidir, tahsisle değil.","ad":"Karışan ilke"}],"dayanak":"Teori notu: bütçe ilkeleri — adem-i tahsis ilkesi belirli bir gelirin belirli bir gidere bağlanmamasıdır ve gayrisafilikle karıştırılmamalıdır; gayrisafilik gelir ve giderlerin mahsup edilmeden tam ve brüt tutarlarıyla gösterilmesi, genellik tüm gelir ve giderlerin bütçede yer alması ve bütçe dışı işlem olmaması, birlik tüm gelir ve giderlerin tek bir bütçede toplanması, doğruluk tahminlerin gerçeğe uygun yapılmasıdır","dogru":"B","oyunBonus":null,"ders":"Maliye","adi i ve denetleyebilmesi sağlanır.","sinav":"Kamu Malî Yönetimi Kanunu 5018 sayılı Kanun\u0027un bütçe ilkelerine göre gayrisafilik ilkesi, bütçede gelirler ve giderlerin birbirinden mahsup edilmeden tam ve brüt tutarlarıyla ayrı ayrı gösterilmesini öngörür.","kavramlar":[{"kaynak":"TEORI","tanim":"Bütçede gelirler ve giderlerin birbirinden mahsup edilmeden tam ve brüt tutarlarıyla ayrı ayrı gösterilmesi ilkesidir; amaç parlamentonun bütçeyi tam olarak görebilmesi ve denetleyebilmesidir.","ad":"Gayrisafilik ilkesi"},{"kaynak":"TEORI","tanim":"Gelirler ve giderlerin birbirinden çıkarılarak net tutarla gösterilmesidir; gayrisafilik ilkesi bunu yasaklar.","ad":"Mahsup"},{"kaynak":"TEORI","tanim":"Tüm gelir ve giderlerin bütçede yer almasını ve bütçe dışı işlem yapılmamasını öngören ilkedir.","ad":"Genellik ilkesi"}]},"cikmis":{"pencereDonemler":[],"kopru":4,"ornekler":[],"donemler":["2025/1","2019/3","2015/3","2015/1"]},"oyun":null,"tip":"teori","soru":"Bütçede gelir ve giderlerin birbirinden mahsup edilmeden tam ve brüt tutarlarıyla gösterilmesini öngören ilke aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t4-maliye-kolay/kp-01","verilenler":[{"deger":"Mahsup edilmeden, tam ve brüt","anlam":"Gayrisafilik ilkesinin tanımıdır.","ad":"İstenen gösterim"},{"deger":"Yasama organının bütçeyi tam görebilmesi","anlam":"İlkenin denetim gerekçesidir.","ad":"Amaç"}],"dayanak":"Teori notu: bütçe ilkeleri, gayrisafilik (safi olmama) — bütçede gelirler ve giderler birbirinden mahsup edilmeden tam ve brüt tutarlarıyla ayrı ayrı gösterilir, amaç yasama organının bütçeyi tam olarak görebilmesi ve denetleyebilmesidir; genellik ilkesi tüm gelir ve giderlerin bütçede yer almasını, birlik ilkesi tek bütçede toplanmayı, tahsis ilkesi ödeneklerin amacı dışında kullanılmamasını, aleniyet ilkesi sürecin kamuoyuna açık olmasını öngörür","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"İlke = Gayrisafilik, yani gelir ve giderin mahsup edilmeden brüt gösterilmesi","anlatim":"Bir kurumun tahsilat gideri, tahsil ettiği gelirden düşülüp net yazılamaz; ikisi de ayrı ayrı bütçeye girer.","doldur":[]},{"formul":"Amaç = Yasama organının bütçeyi tam görmesi ve denetlemesi","anlatim":"Mahsuplaşma gerçek büyüklükleri gizlediği için denetimi zayıflatır.","doldur":[[5,1]]},{"formul":"Karışan ilkeler = Genellik, birlik, tahsis, aleniyet","anlatim":"Genellik bütçe dışı işlem olmamasını, birlik tek bütçede toplanmayı, tahsis ödeneğin amacı dışında kullanılmamasını, aleniyet kamuoyuna açıklığı ister.","doldur":[[6,1]]}],"anahtar":[{"ornek":"ilkesi","kok":"ilkesi"},{"ornek":"mahsup","kok":"mahsup"},{"ornek":"bütçede","kok":"bütçed"},{"ornek":"genellik","kok":"genell"},{"ornek":"olmama","kok":"olmama"},{"ornek":"ödeneğin","kok":"ödeneğ"}],"konuGiris":{"harita":"Ne zaman test edilir: bütçenin hazırlanma ve gösterim ilkeleri sorulduğunda test edilir. Nasıl ölçülür: verilen tanımın hangi ilkenin ifadesi olduğu eşleştirilerek ölçülür. Nasıl kaydedilir: sınavda ilke isimleri ile tanımları arasındaki fark not edilerek çalışılır.","desen":"Sınav genellikle gayrisafilik ile genellik ilkesini karıştırtmaya çalışır; genellik hiçbir işlemin bütçe dışı kalmaması, gayrisafilik ise mahsup yapılmamasıdır. Bazı sorularda adem-i tahsis ilkesi de gayrisafilikle karıştırılan bir çelme olarak sunulur. Bu soru gayrisafilik ile genellik ilkesinin ayrımı noktasından geliyor (p.28, 4 dönemde soruldu).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Gelir ve giderlerin mahsup edilmeden brüt tutarlarıyla ayrı gösterilmesi","ad":"Gayrisafilik ilkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tüm gelir ve giderlerin bütçe içinde yer alması, bütçe dışı işlem olmaması","ad":"Genellik ilkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bir gelirin belirli bir gidere bağlanmaması, gayrisafilikle karıştırılmaması","ad":"Adem-i tahsis ilkesi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tüm gelir ve giderlerin tek bir bütçede toplanması","ad":"Birlik ilkesi","kim":"kanun sabitler"}],"sinavda":"Soruda bir bütçe ilkesinin tanımı verilir ve bu tanımın hangi ilkeye ait olduğu istenir.","panel_ornek":"Bir öğrenci kantinde kitap satıyor: kitabı 30 liraya alıp 45 liraya satıyor. Eğer sadece \u002715 lira kâr ettim\u0027 derse gerçek alış-satış tutarlarını gizlemiş olur; oysa 30 lira gider, 45 lira gelir olarak ayrı ayrı yazılmalıdır.","ornek":"Bir öğrenci kantinde kitap satıyor: kitabı 30 liraya alıp 45 liraya satıyor. Eğer sadece \u002715 lira kâr ettim\u0027 derse gerçek alış-satış tutarlarını gizlemiş olur; oysa 30 lira gider, 45 lira gelir olarak ayrı ayrı yazılmalıdır.","yontemler":"Tanımdaki anahtar kelimeye bak: \u0027mahsup edilmeden brüt gösterim\u0027 geçiyorsa cevap gayrisafiliktir, \u0027bütçe dışı kalmama\u0027 geçiyorsa genelliktir.","nedir":"Bütçe ilkeleri, kamu bütçesinin hangi kurallara göre hazırlanıp gösterileceğini belirler. Sınav bu ilkelerin adını ve tanımını birbirinden ayırt edebilmeni ölçer."},"olay":"","tuzak":{"D":{"ad":"İlke Tuzağı","metin":"Tahsis ilkesi ödeneklerin tahsis edildiği amaç dışında kullanılmamasını ister. Doğrusu: aranan ilke gayrisafiliktir."},"E":{"ad":"İlke Tuzağı","metin":"Aleniyet ilkesi bütçe sürecinin ve sonuçlarının kamuoyuna açık olmasını öngörür. Doğrusu: aranan ilke gayrisafiliktir."},"A":{"ad":"İlke Tuzağı","metin":"Genellik ilkesi bütün gelir ve giderlerin bütçede yer almasını, bütçe dışı işlem yapılmamasını ister. Doğrusu: mahsup yasağı gayrisafilik ilkesidir."},"B":{"ad":"İlke Tuzağı","metin":"Birlik ilkesi bütün gelir ve giderlerin tek bir bütçede toplanmasını öngörür. Doğrusu: aranan ilke gayrisafiliktir."}},"celdiriciYol":{},"hap":"Gayrisafilik mahsup yasağıdır; genellik ise hiçbir işlemin bütçe dışı kalmamasıdır. İkisi farklı ilkelerdir.","teshis":{"C":{"gercek":"Mahsuplaşma gerçek büyüklükleri gizler ve yasama denetimini zayıflatır; bu yüzden ilke gelir ve giderin brüt gösterilmesini zorunlu kılar.","ayirt":"Rakam net mi, brüt mü gösteriliyor?","paragraf":"Bütçe ilkeleri notu","yanilgi":"Bu şıkkı eleyen öğrenci, net gösterimin daha anlaşılır olacağını düşünüp mahsuplaşmayı meşru sayar."},"E":{"gercek":"Aleniyet sürecin kamuoyuna açıklığıdır, mahsup yasağı değildir.","ayirt":"İlke kime karşı açıklık istiyor?","paragraf":"Bütçe ilkeleri notu","yanilgi":"Şeffaflığı gösterim kuralıyla eşitliyorsun."},"A":{"gercek":"Genellik hiçbir işlemin bütçe dışı kalmamasıdır, gayrisafilik ise mahsup yapılmamasıdır.","ayirt":"Sorun bütçe dışı kalma mı, netleştirme mi?","paragraf":"Bütçe ilkeleri notu","yanilgi":"Genellik ile gayrisafiliği aynı ilke sanıyorsun."},"D":{"gercek":"Tahsis ödeneğin amacıyla, gayrisafilik gösterim biçimiyle ilgilidir.","ayirt":"İlke amaçla mı, gösterimle mi ilgili?","paragraf":"Bütçe ilkeleri notu","yanilgi":"Tahsis ile gayrisafiliği karıştırıyorsun."},"B":{"gercek":"Birlik, gelir ve giderlerin tek bir bütçede toplanmasıdır.","ayirt":"Kaç bütçe var?","paragraf":"Bütçe ilkeleri notu","yanilgi":"Birlik ilkesini kalemlerin brüt gösterilmesi sanıyorsun."}},"verilen":[[4,1],[1,1],[2,1]],"donem":4,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 95"},"kural":"gayrisafilik, gelir ve giderlerin birbirinden mahsup edilmeksizin tam ve brüt tutarlarıyla ayrı ayrı bütçeye alınmasıdır; amaç parlamentonun bütçeyi tam görüp denetleyebilmesidir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 95","sonDonem":1,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"5018 sayılı Kanun\u0027un bütçe ilkeleri sorularında her şıkkı önce hangi ilkeye ait olduğunu tek kelimeyle etiketleyip öyle ele; benzeşen tanımlar bu şekilde ayrışır.","konu":"bütçe ilkeleri","tablo":{"satirlar":[["A) Tüm gelir ve giderlerin, herhangi bir işlem bütçe dışınd…","genellik ilkesi (öğreti notu)","YANLIŞ ifade"],["B) Belirli bir gelirin, belirli bir gideri karşılamak amacı…","adem-i tahsis ilkesi (öğreti notu)","YANLIŞ ifade"],["C) Gelir ve giderlerin birbirinden mahsup edilmeksizin, tam…","gayrisafilik ilkesi (öğreti notu)","doğru ifade"],["D) Tüm gelir ve giderlerin, tek bir bütçe içinde toplanarak…","birlik ilkesi (öğreti notu)","YANLIŞ ifade"],["E) Onaylanan ödeneklerin, tahsis edildiği amaç dışında kull…","tahsis (ayrım) ilkesi (öğreti notu)","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Gelir ve giderlerin birbirinden mahsup edilmeksizin, tam ve brüt tutarlarıyla ayrı ayrı gösterilmesidir.","E":"Onaylanan ödeneklerin, tahsis edildiği amaç dışında kullanılamamasıdır.","A":"Tüm gelir ve giderlerin, herhangi bir işlem bütçe dışında bırakılmaksızın bütçede yer almasıdır.","D":"Tüm gelir ve giderlerin, tek bir bütçe içinde toplanarak gösterilmesidir.","B":"Belirli bir gelirin, belirli bir gideri karşılamak amacıyla önceden tahsis edilmemesidir."},"kaynak":{"alinti":"gelir ve giderlerin birbirinden mahsup edilmeksizin tam ve brüt tutarlarıyla ayrı ayrı gösterilmesi","liste":[{"ad":"TEORI - Butce ilkeleri: gayrisafilik (safi olmama)","metin":"TEORİ (maliye; çerçevesi 5018 sayılı Kanun\u0027un bütçe ilkelerinde). GAYRİSAFİLİK (SAFİ OLMAMA) İLKESİ: bütçede gelirler ve giderler BİRBİRİNDEN MAHSUP EDİLMEDEN, TAM VE BRÜT tutarlarıyla ayrı ayrı gösterilir. Örneğin bir kurumun tahsilat gideri, tahsil ettiği gelirden düşülüp \u0027net\u0027 yazılamaz; ikisi de ayrı ayrı bütçeye girer. AMAÇ: parlamentonun bütçeyi TAM OLARAK görebilmesi ve denetleyebilmesidir; mahsuplaşma gerçek büyüklükleri gizler. DİĞER KLASİK BÜTÇE İLKELERİ: (1) GENELLİK - tüm gelir ve giderler bütçede yer alır, bütçe dışı işlem olmaz. (2) BİRLİK - tüm gelir ve giderler TEK bir bütçede toplanır. (3) ANLAŞILABİLİRLİK/AÇIKLIK - bütçe herkesin anlayabilecegi sadelikte olur. (4) DOĞRULUK - tahminler gerçeğe uygun yapılır. (5) SAMIMIYET - tahminler bilerek yanlış yapılmaz. (6) ÖNCEDEN İZİN - harcama yapılmadan ÖNCE yasama organının izni alınır. (7) YILLIK OLMA - bütçe bir yıllık dönem için hazırlanır. (8) ALENİYET (KAMUOYUNA AÇIKLIK) - bütçe süreci ve sonuçları kamuoyuna açıktır. (9) TAHSİS (AYRIM) - ödenekler tahsis edildiği amaç dışında kullanılamaz. (10) DENKLİK - gelir ve giderlerin denk olması (klasik görüş). ADEM-I TAHSİS İLKESİ: belirli bir gelirin belirli bir gidere bağlanmamasıdır; gayrisafilikle karıştırılmamalıdır. SINAV TUZAĞI: gayrisafilik MAHSUP YAPILMAMASI, genellik ise HİÇBİR İŞLEMİN BÜTÇE DIŞI KALMAMASIDIR - ikisi farklı ilkelerdir."}],"hakem":"Soru, 5018 sayılı Kanun çerçevesinde gayrisafilik ilkesinin tanımını soruyor; C şıkkı \u0027gelir ve giderlerin birbirinden mahsup edilmeksizin tam ve brüt tutarlarıyla ayrı ayrı gösterilmesi\u0027 tanımını vermiş olup, bu kaynak metindeki \u0027BIRBIRINDEN MAHSUP EDILMEDEN, TAM VE BRUT tutarlariyla ayri ayri gosterilir\u0027 tanımıyla tam uyum içerisindedir."},"kayitlar":[],"sade":{"siklar":{"D":"Tüm gelir-giderleri tek bütçede toplamak birlik ilkesinin tanımıdır. Gayrisafilik mahsup yapılmamasını, birlik ise tek bütçede toplanmayı anlatır.","E":"Ödeneklerin tahsis edildiği amaç dışında kullanılamaması tahsis ilkesidir. Gayrisafilik gelir-gider mahsubunu düzenlerken, bu ilke ödenek harcanma amacını sınırlar.","A":"Tüm işlemlerin bütçede yer alması, bütün gelir-giderleri kapsama konusudur; bu genellik ilkesidir. Gayrisafilik ise mahsup yapılıp yapılmaması meselesidir.","B":"Geliri belirli bir gidere bağlamamak, adem-i tahsis ilkesidir. Gayrisafilik mahsup etmeme meselesi olup bu iki ilke birbirinden farklıdır."},"dogru":"Gayrisafilik, gelir ve giderleri birbirinden çıkarmadan (mahsup etmeden) tam tutarlarıyla ayrı ayrı bütçeye koymak demektir. Böylece parlamentonun gerçek rakamları görebilmesi ve denetlemesi sağlanır.","sinav":"Kamu Malî Yönetimi ve Kontrol Kanunu çerçevesinde gayrisafilik ilkesi, gelir ve giderlerin birbirinden mahsup edilmeksizin tam ve brüt tutarlarıyla ayrı ayrı gösterilmesidir.","kavramlar":[{"kaynak":"TEORI","tanim":"Bütçeye konulan gelir ve giderlerin birbirinden çıkarılmaksızın tam ve brüt tutarlarıyla ayrı ayrı gösterilmesi ilkesidir. Amaç, parlamentonun gerçek büyüklükleri görebilmesi ve denetlemesidir.","ad":"Gayrisafilik (safi olmama) ilkesi"},{"kaynak":"TEORI","tanim":"Gelir veya giderleri birbirinden çıkarmak, net tutarlar göstermek anlamına gelmektedir.","ad":"Mahsup"},{"kaynak":"TEORI","tanim":"Belirli bir gelirin belirli bir gidere bağlanmayarak, gelir ve giderlerin bağımsız olarak değerlendirilmesi ilkesidir.","ad":"Adem-i tahsis ilkesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":["2025/1","2019/3","2015/3","2015/1"]},"oyun":null,"tip":"teori","soru":"Bütçe ilkelerine ilişkin ifadelerden hangisi, 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu çerçevesinde gayrisafilik (safi olmama) ilkesinin tanımına karşılık gelir?","kayitBaslik":"","id":"sgs-a6-maliye-cokzor-r1/kp-01","verilenler":[],"dayanak":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu - bütçe ilkeleri (öğreti notu)","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Ankara Su ve Kanalizasyon İdaresi 2023\u0027te vatandaştan 40 milyon TL su bedeli tahsil ediyor, bu tahsilat için de 6 milyon TL tahsilat gideri yapıyor.","anlatim":"Muhasebeci \u0027zaten net kâr 34 milyon TL, bunu yazalım\u0027 diyor. Bütçe uzmanı buna itiraz ediyor.","doldur":[]},{"formul":"Ne yapacağız: Kural şu; 40 milyon gelir ve 6 milyon gider birbirinden mahsup edilmeden, ayrı ayrı ve brüt olarak bütçeye girer, net 34 milyon yazılmaz. Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Her şıkkı bu 40 milyon - 6 milyon örneğine uygulayacağız, hangisi tam bu \u0027mahsupsuz brüt gösterim\u0027 kuralını anlatıyor bakacağız.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"genellik ilkesi (öğreti notu)","karar":"yanlış","anlatim":"Bu, hiçbir işlemin bütçe dışı kalmaması demek, yani genellik ilkesi. 40 milyonun içeride olması ayrı mesele, net mi brüt mü yazıldığı ayrı mesele.","formul":"Şık A: birisi diyor ki \u0027bu idarenin hiçbir geliri veya gideri bütçe dışında bırakılamaz\u0027, bu ifade gayrisafiliğin tanımı mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"adem-i tahsis ilkesi (öğreti notu)","karar":"yanlış","anlatim":"Bu, gelirin bir gidere önceden bağlanmaması, yani adem-i tahsis ilkesi. Kaynak metin bunu gayrisafilikle karıştırma diye açıkça uyarıyor.","formul":"Şık B: birisi diyor ki \u0027bu 40 milyonluk su geliri önceden belirli bir gideri karşılamak üzere ayrılamaz\u0027, bu ifade gayrisafiliğin tanımı mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"gayrisafilik ilkesi (öğreti notu)","karar":"doğru","anlatim":"Evet, tam olarak bu. Muhasebecinin 34 milyon net yazma isteğini reddeden kural budur, amaç parlamentonun gerçek büyüklükleri görmesidir.","formul":"Şık C: birisi diyor ki \u002740 milyon gelir ve 6 milyon gider birbirinden mahsup edilmeden, tam ve brüt tutarlarıyla ayrı ayrı gösterilir\u0027, bu ifade gayrisafiliğin tanımı mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"birlik ilkesi (öğreti notu)","karar":"yanlış","anlatim":"Bu, bütçe sayısıyla ilgili, tek bütçe mi çok bütçe mi sorusu, yani birlik ilkesi. Mahsup yapılıp yapılmadığıyla hiç ilgisi yok.","formul":"Şık D: birisi diyor ki \u0027bu idarenin tüm gelir ve giderleri tek bir bütçe içinde toplanır\u0027, bu ifade gayrisafiliğin tanımı mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"tahsis (ayrım) ilkesi (öğreti notu)","karar":"yanlış","anlatim":"Bu, ödeneğin harcama amacını sınırlar, yani tahsis ilkesi. Gösterim biçimiyle, mahsup yapılıp yapılmamasıyla ilgisi yok.","formul":"Şık E: birisi diyor ki \u0027bu 6 milyonluk tahsilat gideri ödeneği, tahsis edildiği amaç dışında kullanılamaz\u0027, bu ifade gayrisafiliğin tanımı mı?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Gayrisafilik sadece \u0027mahsupsuz-brüt gösterim\u0027 demektir, başka hiçbir ilkeyle karıştırılmaz. Kendine hep şunu sor: bu ifade \u0027işlem içeride mi kalıyor\u0027 sorusuna mı, yoksa \u0027tutar net mi brüt mü yazılıyor\u0027 sorusuna mı cevap veriyor?","doldur":[]}],"anahtar":[{"ornek":"mahsup","kok":"mahsup"},{"ornek":"milyon","kok":"milyon"},{"ornek":"ilkesi","kok":"ilkesi"},{"ornek":"tahsis","kok":"tahsis"},{"ornek":"gayrisafilik","kok":"gayris"},{"ornek":"sorusu","kok":"sorusu"}],"konuGiris":null,"olay":"","tuzak":{"D":{"ad":"Birlik Tuzağı","metin":"\u0027tek bütçede toplama\u0027 ifadesi gayrisafilikle aynı paragrafta anlatılmıştır. Doğrusu: bu tanım birlik ilkesine aittir, mahsup yapılıp yapılmamasıyla ilgili değildir."},"E":{"ad":"Tahsis (Ayrım) Tuzağı","metin":"ödeneğin amaç dışı kullanılamaması ifadesi bütçe disiplini çağrıştırdığı için gayrisafilikle karıştırılır. Doğrusu: bu tahsis ilkesidir, gelir-gider mahsubunu değil ödenek kullanım amacını sınırlar."},"A":{"ad":"Genellik Tuzağı","metin":"öğrenci \u0027hiçbir işlem dışarıda kalmaz\u0027 ifadesini gayrisafilikle karıştırır. Doğrusu: bu tanım genellik ilkesine aittir, gayrisafilik mahsup yapılmamasını değil kapsamı düzenler."},"B":{"ad":"Adem-i Tahsis Tuzağı","metin":"gelir-gider bağlanmaması ifadesi gayrisafilikle görsel olarak benzer görünür. Doğrusu: gelirin belirli bir gidere bağlanmaması adem-i tahsis ilkesidir, mahsupla ilgisi yoktur."}},"celdiriciYol":null,"hap":"Gayrisafilik mahsup yapılmamasını, genellik kapsamı, birlik tekliği, adem-i tahsis gelir-gider bağlantısızlığını, tahsis ilkesi ise ödenek amacını düzenler; beşi ayrı ilkedir.","teshis":{"C":{"gercek":"Kaynak metin gayrisafiliği açıkça \u0027gelir ve giderler mahsup edilmeden, tam ve brüt tutarlarıyla ayrı ayrı gösterilir\u0027 şeklinde tanımlar; amaç parlamento denetimidir.","ayirt":"Bu ifadede \u0027mahsup edilmeden, brüt\u0027 kelimeleri var mı?","paragraf":"5018 sayılı Kanun - bütçe ilkeleri (öğreti notu)","yanilgi":"Bu tanımı \u0027çok genel/klişe\u0027 bulup daha spesifik görünen bir başka ilkeyi doğru sanabilirsin."},"E":{"gercek":"Tahsis (ayrım) ilkesi ödeneğin kullanım amacını sınırlar; gayrisafilik ise gösterim/mahsup meselesidir, kaynakta ayrı maddelerde anılır.","ayirt":"Kural \u0027ödenek nereye harcanabilir\u0027 mi diyor, yoksa \u0027tutar net mi brüt mü yazılır\u0027 mı diyor?","paragraf":"5018 sayılı Kanun - bütçe ilkeleri (öğreti notu)","yanilgi":"Ödeneğin amacı dışında kullanılamamasını, gelir-giderin mahsupsuz gösterilmesiyle aynı disiplin kuralı sanıyorsun."},"A":{"gercek":"Genellik ilkesi kapsamı (hiçbir işlem bütçe dışı kalmaz), gayrisafilik ise gösterim biçimini (mahsupsuz-brüt) düzenler; kaynak metinde iki ilke ayrıca ayrılır.","ayirt":"Bu ifade \u0027her şey içeride mi\u0027 sorusuna mı, yoksa \u0027net mi brüt mü gösteriliyor\u0027 sorusuna mı cevap veriyor?","paragraf":"5018 sayılı Kanun - bütçe ilkeleri (öğreti notu)","yanilgi":"Bütçede hiçbir kalemin dışarıda kalmamasını, gelir-gider tutarlarının brüt yazılmasıyla aynı şey sanıyorsun."},"D":{"gercek":"Birlik ilkesi bütçelerin sayısını (tek bütçe) düzenler, gayrisafilik ise kalemlerin gösterim biçimini düzenler; farklı sorulara cevap verirler.","ayirt":"Soru \u0027kaç bütçe var\u0027 mı soruyor, yoksa \u0027tutarlar nasıl yazılıyor\u0027 mu?","paragraf":"5018 sayılı Kanun - bütçe ilkeleri (öğreti notu)","yanilgi":"Tüm gelir-giderlerin \u0027tek çatı altında\u0027 toplanmasını, bunların \u0027net değil brüt\u0027 yazılması ile aynı kural sanıyorsun."},"B":{"gercek":"Adem-i tahsis, gelirin belirli bir gidere özgülenmemesidir; gayrisafilikle karıştırılmaması kaynak metinde açıkça belirtilir.","ayirt":"Burada tartışılan şey \u0027gelir hangi gidere bağlı\u0027 mı, yoksa \u0027tutar mahsup mu edildi\u0027 mi?","paragraf":"5018 sayılı Kanun - bütçe ilkeleri (öğreti notu)","yanilgi":"Bir gelirin bir gidere bağlanmamasını, o gelir-giderin ayrı ayrı brüt gösterilmesiyle özdeşleştiriyorsun."}},"verilen":[],"donem":4,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 95"},"kural":"Gayrisafilik ilkesine göre bütçede gelir ve giderler birbirinden mahsup edilmeden brüt tutarlarıyla ayrı ayrı gösterilir; mahsuplaşma parlamentonun denetimini gizleyeceğinden yasaktır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 95","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Hangisi yanlıştır\u0027 sorusunda önce her cümlenin hangi bütçe ilkesine ait olduğunu etiketle, sonra o ilkenin tanımına uyup uymadığını kontrol et.","konu":"bütçe ilkeleri","tablo":{"satirlar":[["A) Otopark işletme gideri, elde edilen gelirden düşülerek y…","5018 s.K. - gayrisafilik ilkesi","YANLIŞ ifade"],["B) Otopark işletmeciliğinden doğan gelir ve gider kalemleri…","5018 s.K. - genellik ilkesi","doğru ifade"],["C) Otopark geliri ile otopark giderinin herhangi bir mahsup…","5018 s.K. - gayrisafilik ilkesi","doğru ifade"],["D) Otopark işletmeciliğinden elde edilen gelir, belirli bir…","5018 s.K. - adem-i tahsis ilkesi","doğru ifade"],["E) Otopark işletme gideri için harcama yapılmadan önce yasa…","5018 s.K. - önceden izin ilkesi","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Otopark geliri ile otopark giderinin herhangi bir mahsuplaşma yapılmaksızın gayri safi tutarlarıyla ayrı ayrı bütçede gösterilmesi esastır.","E":"Otopark işletme gideri için harcama yapılmadan önce yasama organının izninin alınması gerekir.","A":"Otopark işletme gideri, elde edilen gelirden düşülerek yalnızca net tutar üzerinden bütçeye yansıtılır.","D":"Otopark işletmeciliğinden elde edilen gelir, belirli bir harcama kalemine tahsis edilmeksizin genel bütçe geliri olarak değerlendirilir.","B":"Otopark işletmeciliğinden doğan gelir ve gider kalemleri, kapsam dışında bırakılmaksızın bütçede yer almak zorundadır."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Butce ilkeleri: gayrisafilik (safi olmama)","metin":"TEORİ (maliye; çerçevesi 5018 sayılı Kanun\u0027un bütçe ilkelerinde). GAYRİSAFİLİK (SAFİ OLMAMA) İLKESİ: bütçede gelirler ve giderler BİRBİRİNDEN MAHSUP EDİLMEDEN, TAM VE BRÜT tutarlarıyla ayrı ayrı gösterilir. Örneğin bir kurumun tahsilat gideri, tahsil ettiği gelirden düşülüp \u0027net\u0027 yazılamaz; ikisi de ayrı ayrı bütçeye girer. AMAÇ: parlamentonun bütçeyi TAM OLARAK görebilmesi ve denetleyebilmesidir; mahsuplaşma gerçek büyüklükleri gizler. DİĞER KLASİK BÜTÇE İLKELERİ: (1) GENELLİK - tüm gelir ve giderler bütçede yer alır, bütçe dışı işlem olmaz. (2) BİRLİK - tüm gelir ve giderler TEK bir bütçede toplanır. (3) ANLAŞILABİLİRLİK/AÇIKLIK - bütçe herkesin anlayabilecegi sadelikte olur. (4) DOĞRULUK - tahminler gerçeğe uygun yapılır. (5) SAMIMIYET - tahminler bilerek yanlış yapılmaz. (6) ÖNCEDEN İZİN - harcama yapılmadan ÖNCE yasama organının izni alınır. (7) YILLIK OLMA - bütçe bir yıllık dönem için hazırlanır. (8) ALENİYET (KAMUOYUNA AÇIKLIK) - bütçe süreci ve sonuçları kamuoyuna açıktır. (9) TAHSİS (AYRIM) - ödenekler tahsis edildiği amaç dışında kullanılamaz. (10) DENKLİK - gelir ve giderlerin denk olması (klasik görüş). ADEM-I TAHSİS İLKESİ: belirli bir gelirin belirli bir gidere bağlanmamasıdır; gayrisafilikle karıştırılmamalıdır. SINAV TUZAĞI: gayrisafilik MAHSUP YAPILMAMASI, genellik ise HİÇBİR İŞLEMİN BÜTÇE DIŞI KALMAMASIDIR - ikisi farklı ilkelerdir."}],"hakem":"Soru 5018\u0027de düzenlenen bütçe ilkelerini ölçüyor, gayrisafilik ilkesi kaynakta açıkça tanımlanmış, yanlış ifade (A) bu ilkeye aykırı olduğu için doğru cevaptır."},"kayitlar":[],"sade":{"siklar":{"C":"Gayrisafilik ilkesini tam olarak anlatır: gelir ve gider mahsup edilmeksizin brüt tutarlarıyla ayrı gösterilir, bu doğrudur.","E":"Önceden izin ilkesi harcama yapılmadan antes yasama organının izninin alınmasını gerektirir; bu doğru bir ifadedir.","D":"Adem-i tahsis ilkesi belirli bir gelirin belirli bir gidere bağlanmamasıdır; bu cümle o ilkeyi doğru anlatır, gayrisafilikle ilgisi yoktur.","B":"Genellik ilkesi tüm gelir ve giderlerin bütçede yer alması gerektiğini söyler; bu cümle bu ilkeyi doğru anlatır, yanlış değildir."},"dogru":"Gayrisafilik ilkesi gelen parayı ve çıkan parayı birbirinden çıkarmadan, tam tutarlarıyla ayrı ayrı göstermeyi zorunlu kılar. Otopark gelirinden gideri düşüp yalnızca net tutarı yazarsanız, bu ilkeyi ihlal edersiniz.","sinav":"Kamu Malî Yönetimi ve Kontrol Kanunu\u0027nun gayrisafilik ilkesine göre bütçede gelirler ve giderler mahsup edilmeden brüt tutarlarıyla ayrı ayrı gösterilmesi gerekir.","kavramlar":[{"kaynak":"TEORI","tanim":"Bütçede gelirler ve giderler birbirinden mahsup edilmeden, tam ve brüt tutarlarıyla ayrı ayrı gösterilmesidir; amaç parlamentonun gerçek tutarları görmesi ve denetlemesidir.","ad":"Gayrisafilik (safi olmama) ilkesi"},{"kaynak":"TEORI","tanim":"Tüm gelir ve giderlerin bütçede yer alması, bütçe dışı işlem olmaması kuralıdır.","ad":"Genellik ilkesi"},{"kaynak":"TEORI","tanim":"Belirli bir gelirin belirli bir gidere bağlanmaması, gelirin genel bütçe geliri olarak değerlendirilmesi demektir.","ad":"Adem-i tahsis ilkesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":4,"ornekler":[],"donemler":["2025/1","2019/3","2015/3","2015/1"]},"oyun":null,"tip":"teori","soru":"Bir belediyenin otopark işletmeciliğinden elde ettiği gelir ile bu hizmetin işletme giderine ilişkin olarak, 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununda düzenlenen bütçe ilkeleri bakımından aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-a6-maliye-zor-r1/kp-01","verilenler":[],"dayanak":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu - bütçe ilkeleri (gayrisafilik/genellik/adem-i tahsis/önceden izin)","dogru":"A","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: bir belediyenin otoparkı var; 2023 yılında otopark geliri 900.000 TL, işletme gideri 300.000 TL olmuş.","anlatim":"Muhasebeci diyor ki \u0027zaten 600.000 TL kâr var, bütçeye sadece bu net tutarı yazalım.\u0027 Belediye meclisi buna itiraz ediyor.","doldur":[]},{"formul":"Ne yapacağız: 5018 sayılı Kanundaki bütçe ilkelerini bu 900.000 TL gelir, 300.000 TL gider üzerinden test edeceğiz.","anlatim":"Kural şu: gelir ve gider birbirinden mahsup edilmeden brüt gösterilir, ayrıca hiçbir işlem bütçe dışı kalmaz. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"5018 s.K. - gayrisafilik ilkesi","karar":"yanlış","anlatim":"Hayır, bu net gösterim gayrisafilik ilkesine aykırıdır. 900.000 TL gelir ve 300.000 TL gider ayrı ayrı, brüt olarak bütçeye girmeliydi.","formul":"Şık A: muhasebeci 300.000 TL gideri 900.000 TL gelirden düşüp sadece 600.000 TL\u0027yi bütçeye yazıyor, doğru mu yapıyor?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"5018 s.K. - genellik ilkesi","karar":"doğru","anlatim":"Evet, doğru; bu genellik ilkesidir. Otopark işletmesinden doğan tüm gelir ve gider kalemleri bütçeye girer, bütçe dışı kalamaz.","formul":"Şık B: meclis üyesi diyor ki \u0027bu 900.000 TL gelir ve 300.000 TL gider hiçbir şekilde bütçe dışı bırakılamaz, ikisi de bütçede yer almak zorunda\u0027 — bu doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"5018 s.K. - gayrisafilik ilkesi","karar":"doğru","anlatim":"Evet, doğru; bu tam olarak gayrisafilik ilkesinin gerektirdiği şey. Bu ifade A\u0027nın tam tersini, yani doğrusunu anlatıyor.","formul":"Şık C: biri diyor ki \u0027900.000 TL gelir ile 300.000 TL gider herhangi bir mahsup yapılmaksızın ayrı ayrı, gayri safi tutarlarıyla gösterilmeli\u0027 — bu doğru mu?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"5018 s.K. - adem-i tahsis ilkesi","karar":"doğru","anlatim":"Evet, doğru; bu adem-i tahsis ilkesidir. Belirli bir gelir belirli bir gidere bağlanamaz, otopark geliri genel havuza girer.","formul":"Şık D: biri diyor ki \u0027900.000 TL otopark geliri sadece o otoparkın 300.000 TL\u0027lik giderine tahsis edilmez, genel bütçe geliri sayılır\u0027 — bu doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"5018 s.K. - önceden izin ilkesi","karar":"doğru","anlatim":"Evet, zorunda; bu önceden izin ilkesidir. Harcama yapılmadan önce yasama organının, burada meclisin, onayı şarttır.","formul":"Şık E: belediye başkanı 300.000 TL\u0027lik işletme giderini harcamadan önce meclisten izin almak zorunda mı?"},{"formul":"Kapanış: A ✗ B ✓ C ✓ D ✓ E ✓","anlatim":"Tek yanlış olan A\u0027dır çünkü gideri gelirden düşüp net göstermek gayrisafilik ilkesini çiğner. Kendine hep şunu sor: cümle mahsup yapılıp yapılmadığından mı, yoksa bütçe dışı kalıp kalmamasından mı bahsediyor?","doldur":[]}],"anahtar":[{"ornek":"ilkesine","kok":"ilkesi"},{"ornek":"gösterilmesidir","kok":"göster"},{"ornek":"mahsup","kok":"mahsup"},{"ornek":"gayrisafilik","kok":"gayris"},{"ornek":"belirli","kok":"belirl"},{"ornek":"bütçeye","kok":"bütçey"}],"konuGiris":{"harita":"Ne zaman test edilir: bütçe hazırlanırken gelir-gider kayıtlarının şekli belirlenirken. Nasıl ölçülür: gelir ve giderin ayrı mı yoksa mahsup edilerek mi gösterildiğine bakılarak. Nasıl kaydedilir: her ilkeye özgü ayrı bir kural olarak, birbirine karıştırılmadan kaydedilir.","desen":"Sınav, otopark geliri ile işletme giderinin mahsup edilip edilemeyeceğini sorarak gayrisafiliği genellikle karıştırtmaya çalışır (p.28). Öğrenci, \u0027gelir gidere bağlanamaz\u0027 ifadesini adem-i tahsis yerine gayrisafilik sanabilir. Bu soru gayrisafilik ile genellik ve adem-i tahsis ilkelerinin karıştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Gelir ve giderin mahsup edilmeden brüt tutarlarıyla ayrı gösterilmesi","ad":"Gayrisafilik","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Tüm gelir ve giderlerin bütçe dışı kalmadan bütçede yer alması","ad":"Genellik","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Belirli bir gelirin belirli bir gidere bağlanmaması ilkesi","ad":"Adem-i tahsis","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Tüm gelir ve giderlerin tek bir bütçede toplanması","ad":"Birlik","kim":"kanun sabitler"}],"sinavda":"Soruda belediyenin otopark geliri ve gideri verilir, hangi ifadenin bütçe ilkeleri bakımından yanlış olduğu istenir.","panel_ornek":"Bir öğrenci kantin işletir; 50 liralık malzeme alıp 90 liraya satar. Kâr olarak sadece 40 lira yazamaz, 90 lira gelir ve 50 lira gider ayrı ayrı deftere işlenmelidir. İşte bu, mahsup yapmadan tam tutarları göstermektir.","ornek":"Bir öğrenci kantin işletir; 50 liralık malzeme alıp 90 liraya satar. Kâr olarak sadece 40 lira yazamaz, 90 lira gelir ve 50 lira gider ayrı ayrı deftere işlenmelidir. İşte bu, mahsup yapmadan tam tutarları göstermektir.","yontemler":"Her seçenekteki ifadeyi tek tek hangi ilkeye ait olduğunu belirleyerek ayıklamak gerekir; gelir-gider mahsubu geçen seçenek gayrisafilikle ilgilidir.","nedir":"Bütçe ilkeleri, kamu gelir ve giderlerinin bütçede nasıl gösterileceğini belirleyen kurallardır. Sınav, gayrisafilik, genellik gibi ilkelerin birbirinden ayırt edilip edilemediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Birlik-Gayrisafilik Karıştırma Tuzağı","metin":"Brüt gösterimi tüm gelir ve giderin TEK bütçede toplanması yani birlik ilkesi sanıp bu doğru cümleyi yanlış işaretlersin. Doğrusu: Bu cümle gayrisafilik ilkesini doğru anlatır, mahsup yapılmamıştır."},"E":{"ad":"Önceden İzin Karıştırma Tuzağı","metin":"Harcama öncesi yasama izni kuralını bütçe denkliğiyle karıştırıp bu doğru cümleyi eler misin diye tereddüt edersin. Doğrusu: Bu cümle önceden izin ilkesini doğru anlatır, harcama öncesi meclis izni gereklidir."},"D":{"ad":"Adem-i Tahsis Karıştırma Tuzağı","metin":"Gelirin belirli bir gidere bağlanmaması kuralını mahsup yasağıyla aynı sanıp bu doğru cümleyi yanlış işaretlersin. Doğrusu: Bu cümle adem-i tahsis ilkesini doğru anlatır, gayrisafilikle ilgisi yoktur."},"B":{"ad":"Genellik-Gayrisafilik Karıştırma Tuzağı","metin":"Kapsam dışı bırakılmama ifadesini mahsuplaşma yasağıyla karıştırıp bu doğru cümleyi yanlış sanırsın. Doğrusu: Bu cümle genellik ilkesini doğru anlatır, tüm kalemler bütçede yer alır."}},"celdiriciYol":{},"hap":"Gayrisafilik, gelir ve giderin mahsup edilmeden brüt gösterilmesidir; genellik hiçbir kalemin bütçe dışı kalmaması, adem-i tahsis ise gelirin belirli bir gidere bağlanmamasıdır.","teshis":{"D":{"gercek":"Bu ifade adem-i tahsis ilkesini doğru anlatır; gayrisafilik mahsup yasağıdır, adem-i tahsis gelir-gider bağlantısızlığıdır.","ayirt":"Cümle \u0027tutarlar mahsup mu ediliyor\u0027 mu diyor, yoksa \u0027gelir belirli bir gidere mi bağlanıyor\u0027 mu diyor?","paragraf":"5018 s.K. bütçe ilkeleri - adem-i tahsis","yanilgi":"Gelirin belirli bir gidere bağlanmamasını da mahsup yapılmaması gibi görüyorsun."},"E":{"gercek":"Bu ifade önceden izin ilkesini doğru anlatır; harcama yapılmadan önce yasama organının onayı şarttır.","ayirt":"Cümle \u0027harcamadan önce izin mi var\u0027 mı diyor, yoksa \u0027gelir-gider dengesi mi\u0027 diyor?","paragraf":"5018 s.K. bütçe ilkeleri - önceden izin","yanilgi":"Harcama öncesi izin kuralını denklik ilkesiyle aynı zannediyorsun."},"A":{"gercek":"Gayrisafilik ilkesi gereği gelir ve gider ayrı ayrı brüt gösterilir; gideri gelirden düşüp net yazmak bu ilkeye aykırıdır.","ayirt":"Cümlede gelir ile gider birbirinden düşülüyor mu, yoksa ayrı ayrı mı gösteriliyor?","paragraf":"5018 s.K. bütçe ilkeleri - gayrisafilik","yanilgi":"Bu cümlenin de doğru bir ilke anlattığını düşünüp elersin, oysa burada gelir ve gider açıkça mahsup edilmiştir."},"C":{"gercek":"Bu ifade gayrisafilik ilkesinin brüt gösterim kuralını doğru anlatır; birlik ilkesi ayrı bir kuraldır, tüm gelir ve giderin tek bütçede toplanmasını ister.","ayirt":"Cümle \u0027mahsup yapılmıyor mu\u0027 mu soruyor, yoksa \u0027tek bütçede mi toplanıyor\u0027 mu soruyor?","paragraf":"5018 s.K. bütçe ilkeleri - gayrisafilik/birlik","yanilgi":"Mahsup yapılmamasının aynı zamanda tüm kalemlerin tek bütçede toplanması anlamına geldiğini, yani bunun birlik ilkesi olduğunu düşünüyorsun."},"B":{"gercek":"Bu ifade genellik ilkesini doğru anlatır: tüm gelir ve gider bütçede yer alır, bütçe dışı işlem olmaz.","ayirt":"Cümle \u0027brüt mü gösteriliyor\u0027 mu diyor, yoksa \u0027kapsam dışı mı kalıyor\u0027 mu diyor?","paragraf":"5018 s.K. bütçe ilkeleri - genellik/gayrisafilik","yanilgi":"Kapsam dışı kalmama ifadesini gördüğünde bunun da mahsup yasağıyla ilgili olduğunu sanıyorsun."}},"verilen":[],"donem":4,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/2 Soru 99"},"kural":"ekonomik sınıflandırmada reel harcama karşılığında mal veya hizmet edinilen harcamadır; faiz giderinde karşılığında bir mal-hizmet alımı yoktur, bu yüzden faiz giderleri transfer harcamasıdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 99","sonDonem":6,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Önce \u0027kim/ne için/ne tür etki\u0027 üçlüsünü zihninde ayır, sonra faiz-emekli-sübvansiyon gibi klasik transfer örneklerini reel harcamayla karıştıran şıkkı ara.","konu":"kamu harcamaları sınıflandırma","tablo":{"satirlar":[["A) Fonksiyonel sınıflandırma, kamu harcamasının hangi kamu …","TEORİ - kamu harcamaları sınıflandırma","doğru ifade"],["B) İdari sınıflandırma, harcamayı gerçekleştiren kurumu esa…","TEORİ - kamu harcamaları sınıflandırma","doğru ifade"],["C) Ekonomik sınıflandırmada faiz giderleri, karşılığında ma…","TEORİ - kamu harcamalarinin turleri / ekonomik sınıflandırma","YANLIŞ ifade"],["D) Ekonomik sınıflandırmada harcamalar cari, yatırım ve tra…","TEORİ - kamu harcamalarinin turleri","doğru ifade"],["E) Emekli aylığı ödemesi, ekonomik açıdan transfer, fonksiy…","TEORİ - kamu harcamaları sınıflandırma","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Ekonomik sınıflandırmada faiz giderleri, karşılığında mal veya hizmet alınmadığı için reel harcama sayılır.","E":"Emekli aylığı ödemesi, ekonomik açıdan transfer, fonksiyonel açıdan sosyal güvenlik harcamasıdır.","A":"Fonksiyonel sınıflandırma, kamu harcamasının hangi kamu hizmeti alanına yöneldiğini gösterir.","D":"Ekonomik sınıflandırmada harcamalar cari, yatırım ve transfer harcamaları olmak üzere gruplanır.","B":"İdari sınıflandırma, harcamayı gerçekleştiren kurumu esas alır ve hizmetin niteliğini göstermez."},"kaynak":{"alinti":"","liste":[{"ad":"Teori Notu - kamu harcamalari","metin":"Tetikte Teori Notu (maliye literatürünün yerleşik tanımı): Kamu harcamaları ekonomik ayrımda cari (personel, mal-hizmet alımı), yatırım (sermaye oluşumu) ve transfer (karşılıksız aktarım: emekli aylığı, sosyal yardım, faiz, sübvansiyon) harcamalarıdır; transferler GSYH\u0027ye doğrudan katma değer yazmaz. Reel harcama kaynak kullanır, transfer satın alma gücünü yeniden dağıtır. Kamu harcamalarının sürekli artışını Wagner kanunu (gelişmeyle birlikte kamu faaliyeti genişler) ve Peacock-Wiseman sıçrama tezi (savaş/kriz sonrası harcama eski düzeye inmez) açıklar. Tam kamusal mal iki özellik taşır: tüketimde RAKİPSİZLİK (birinin tüketimi diğerini azaltmaz) ve DIŞLANAMAZLIK (bedel ödemeyen engellenemez) — milli savunma tipik örnektir; bedavacılık (free-rider) sorunu yüzünden piyasa üretemez, devlet üstlenir. Yarı kamusal mallar (eğitim, sağlık) hem kişisel hem toplumsal fayda (pozitif dışsallık) doğurur. Dışsallık, bir birimin faaliyetinin fiyat mekanizması dışında üçüncü kişileri etkilemesidir; negatif dışsallık (kirlilik) vergiyle (Pigou vergisi), pozitif dışsallık sübvansiyonla içselleştirilir. Erdemli mal, devletin tüketimini özendirdiği maldır."},{"ad":"Teori Notu - kamu harcamalarinin turleri","metin":"Tetikte Teori Notu (maliye teorisi - kamu harcamaları sınıflandırması): Kamu harcamaları en temelde gerçek (reel) harcamalar ve transfer harcamaları olarak ikiye ayrılır; fark, karşılık ilişkisindedir. Gerçek harcamada devlet bir mal veya hizmet satın alır, karşılığında üretim faktörü kullanılmış olur ve bu tutar milli gelir hesaplarına doğrudan girer; memur maaşı, okul inşaatı için ödenen bedel, kırtasiye alımı bu türdendir. Transfer harcamasında ise karşılıksız bir satın alma gücü aktarımı vardır, üretim gerçekleşmez; emekli aylığı, sosyal yardım, iç borç faiz ödemesi, ihracat teşviki bu gruba girer ve milli gelire doğrudan katkısı yoktur, sadece gelir dağılımını değiştirir. Küçük bir örnekle: devlet 100 birim karşılığında yol yapım hizmeti satın alırsa bu tutar milli gelir hesabına girer; aynı devlet 100 birim emekli aylığı öderse bu tutar milli gelire doğrudan girmez, çünkü karşılığında üretim yoktur. Bütçe sınıflandırması açısından harcamalar cari, yatırım ve transfer olmak üzere üçe ayrılır; cari harcama personel giderleri ile mal-hizmet alımlarını, yatırım harcaması sermaye ve altyapı oluşturan bina-yol-baraj gibi kalemleri, transfer harcaması ise karşılıksız ödemeleri kapsar. Cari harcama ile gerçek harcama sık karıştırılır; cari bir bütçe kategorisidir, gerçek ise iktisadi bir niteliktir, cari harcamaların büyük bölümü gerçek harcamadır ama tüm gerçek harcamalar cari değildir, yatırım harcaması da gerçek harcama sayılır. Verimli-verimsiz tartışmasında klasik görüş, üretime doğrudan katkı sağlamayan transfer harcamalarını verimsiz, mal-hizmet üretimine dönüşen gerçe…"}],"hakem":"Soru, kamu harcamalarının ekonomik sınıflandırmasındaki reel-transfer ayrımını ölçüyor; C şıkkı faiz giderlerini reel harcama olarak tanımladığı için yanlıştır, çünkü faiz karşılıksız bir transfer harcamasıdır."},"kayitlar":[],"sade":{"siklar":{"D":"Ekonomik sınıflandırma cari, yatırım ve transfer olmak üzere üç ana grubu içerir; bu doğrudur. İkili ayrım yanılgısını düşüren adaya tuzak kurar.","E":"Emekli aylığı aynı anda ekonomik olarak transfer, fonksiyonel olarak sosyal güvenlik harcamasıdır; bu çapraz sınıflandırma doğru tanımlanmıştır. Her harcama tek sınıflandırmaya girmez, birden çok ölçüte göre kodlanabilir.","A":"Fonksiyonel sınıflandırma harcamanın hangi hizmet alanına (sağlık, eğitim, savunma) yöneldiğini gösterir; bu doğrudur. Sınav bu sınıflandırmayı kurumsal sınıflandırmayla karıştırtmak ister.","B":"İdari sınıflandırma harcamayı yapan kurumu gösterir ve hizmetin niteliğini göstermez; bu doğru tanımıdır. Bir şık faydaları ile sınırlandırılmasıyla yanıltmak amaçlanır."},"dogru":"Faiz giderleri kar
