tası. f) (Değişik: 22/12/2005-5436/10 md.) Makine-teçhizat, yol ve otoyol, bilgisayar ve haberleşme sistemlerinin bakım işleri; her türlü onarım işleri ile elektronik bilgi erişim hizmetleri."}],"hakem":"Soru dolaylı vergilerin özelliklerini ölçmekte, B seçeneği (ödeme gücüne göre alınması) dolaysız vergilerin özelliği olup dolaylı vergilerin özelliklerinden değildir; kaynak metinde bu ayrım açıkça tanımlanmıştır."},"kayitlar":[],"sade":{"siklar":{"C":"Mali anestezi (vergiyi hissettirmeme) dolaylı verginin tanınmış özelliğidir; sorunun cevabı değildir.","E":"Tahsilin kolay ve verimli olması dolaylı vergilerin avantajlarındandır; az sayıda satıcıdan toplanır, bu özellik mevcuttur.","D":"Tersine artan oranlı etki dolaylı vergilerin bilinen sonucudur; aynı oranı ödeyen düşük gelirli daha fazla yük taşır, bu yanlış değildir.","A":"Yansıtılabilirlik dolaylı verginin temel özelliğidir; satıcı vergiyi fiyata ekleyerek nihai tüketiciye aktarır, bu sebeple yanlış değildir."},"dogru":"Dolaylı vergiler fiyata gömülü olduğu için yansıtılabilir, mali anestezi yaratır, tahsili kolay ve tersine artan oranlı etki doğurur. Ancak kişinin ödeme gücüne bakılması dolaysız vergilerin (gelir, servet vergisi) özelliğidir, dolaylı vergiler objektiftir.","sinav":"Kamu Malî Yönetimi Kanunu madde 27-34-48\u0027de (5018 sayılı) tanımlanan dolaylı vergiler yansıtılabilir, mali anestezi yaratıcı, tahsili verimli ve tersine artan oranlı etki doğurur; ödeme gücüne göre alınma ise dolaysız vergilerin niteliğidir.","kavramlar":[{"kaynak":"TEORI","tanim":"Mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü vergilerdir. Kanuni mükellef ile fiilen ödeyeni farklıdır.","ad":"Dolaylı vergiler"},{"kaynak":"TEORI","tanim":"Vergi fiyatın içinde olduğundan tüketici tarafından hissedilmemesi, buna karşı direnç düşük olmasıdır.","ad":"Mali anestezi"},{"kaynak":"TEORI","tanim":"Herkes aynı oranı ödese de düşük gelirli kişilerin gelirinin daha büyük kısmı tüketime gittikçe vergi yükü gelire göre azalmasıdır.","ad":"Tersine artan oranlı etki"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Aşağıdakilerden hangisi dolaylı vergilerin özelliklerinden değildir?","kayitBaslik":"","id":"sgs-t4-maliye-kolay/kp-17","verilenler":[{"deger":"Yansıtılabilirlik, tersine artan oranlı etki, mali anestezi, kolay tahsil","anlam":"Not bunları tek tek sayar.","ad":"Dolaylı verginin özellikleri"},{"deger":"Ödeme gücünün ve kişisel durumun dikkate alınması","anlam":"Sorunun aradığı, listede yer almayan niteliktir.","ad":"Dolaysız verginin niteliği"}],"dayanak":"Teori notu: dolaylı vergilerin özellikleri — dolaylı vergiler yansıtılabilir, tersine artan oranlı etki doğurur, mali anestezi yaratır, tahsili kolay ve verimlidir, kişisel durumu dikkate almaz ve esnekliği düşük mallarda yansıma tüketiciye kalır; dolaysız vergiler ise gelir ve servet üzerinden mükellefin kişisel durumuna bakılarak alınır ve ödeme gücünü izlediği için adaletli sayılır","dogru":"B","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Özellik 1 ve 2 = Yansıtılabilirlik ve tersine artan oranlı etki","anlatim":"Kanuni mükellef vergiyi fiyata ekleyerek aktarır; herkes aynı oranı ödediği için düşük gelirlinin yükü göreli olarak ağırlaşır.","doldur":[]},{"formul":"Özellik 3 ve 4 = Mali anestezi ve kolay tahsil","anlatim":"Vergi fiyatın içinde olduğundan hissedilmez, direnç düşüktür; az sayıda satıcıdan toplandığı için tahsili verimlidir.","doldur":[[5,1]]},{"formul":"Listede olmayan = Ödeme gücünün dikkate alınması","anlatim":"Bu nitelik dolaysız vergilere aittir. Dolaylı vergi objektiftir, kişisel durumu hiç hesaba katmaz.","doldur":[[6,1]]}],"anahtar":[{"ornek":"vergiler","kok":"vergil"},{"ornek":"dolaylı","kok":"dolayl"},{"ornek":"verimlidir","kok":"veriml"},{"ornek":"durumu","kok":"durumu"},{"ornek":"dolaysız","kok":"dolays"},{"ornek":"niteliğidir","kok":"niteli"}],"konuGiris":{"harita":"Ne zaman test edilir: dolaylı vergilerin ortak özelliklerini sayan ya da bunlardan olmayanı bulan sorularda. Nasıl ölçülür: yansıma, mali anestezi, tersine artan oranlılık ve tahsil kolaylığı kavramlarının doğru eşleştirilmesiyle. Nasıl kaydedilir: bu bir işlem konusu değildir, kavramsal ayırt etme sorusu olarak sorulur.","desen":"Sınav genelde KDV\u0027nin artan oranlı olduğunu ya da motorlu taşıtlar/emlak vergisinin dolaylı olduğunu iddia ederek tuzak kurar; bunlar terstir. \u0027Dolaylı vergiler adaletli, dolaysız verimlidir\u0027 ifadesi de yer değiştirilmiş bir tuzaktır. Bu soru dolaylı vergilerin altı temel özelliğinin karıştırılması noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kanuni mükellefin vergiyi fiyata ekleyip nihai tüketiciye aktarması","ad":"Yansıma","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Düşük gelirlinin vergi yükünün gelirine göre daha fazla olması","ad":"Tersine artan oranlılık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Vergi fiyata gömülü olduğu için hissedilmemesi durumu","ad":"Malî anestezi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Mükellefin kişisel durumunun dikkate alınmaması ilkesi","ad":"Objektif vergi","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soru, dolaylı vergilerin özelliklerinden hangisinin doğru ya da yanlış olduğunu sıralayarak sorar.","panel_ornek":"Markette aldığın 20 liralık bir çikolatanın fiyatına satıcı zaten KDV\u0027yi eklemiştir; sen ayrı bir vergi ödediğini fark etmezsin. Yanındaki kişi ayda 3.000 lira kazansa da 30.000 lira kazansa da aynı çikolata için aynı KDV\u0027yi öder, yani gelirine göre vergi oranı değişmez.","ornek":"Markette aldığın 20 liralık bir çikolatanın fiyatına satıcı zaten KDV\u0027yi eklemiştir; sen ayrı bir vergi ödediğini fark etmezsin. Yanındaki kişi ayda 3.000 lira kazansa da 30.000 lira kazansa da aynı çikolata için aynı KDV\u0027yi öder, yani gelirine göre vergi oranı değişmez.","yontemler":"Her seçeneği yansıma, mali anestezi, tersine artan oranlılık ve tahsil kolaylığı listesiyle tek tek karşılaştır; listeye uymayan ya da tersi ifade edilen seçenek cevaptır.","nedir":"Dolaylı vergiler, mal ve hizmet alışverişi üzerinden fiyatın içine gizlenerek alınan vergilerdir. Sınav, bu vergilerin yansıma, adalet ve tahsil açısından hangi ortak özelliklere sahip olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Özellik Tuzağı","metin":"Mali anestezi, verginin fiyat içinde hissedilmemesidir ve dolaylı vergiye aittir. Doğrusu: aranan şık ödeme gücüdür."},"E":{"ad":"Özellik Tuzağı","metin":"Tahsilin kolay ve verimli olması dolaylı verginin sayılan üstünlüklerindendir. Doğrusu: aranan şık ödeme gücüdür."},"D":{"ad":"Özellik Tuzağı","metin":"Tersine artan oranlı etki dolaylı verginin bilinen sonucudur. Doğrusu: aranan şık ödeme gücüdür."},"A":{"ad":"Özellik Tuzağı","metin":"Yansıtılabilirlik dolaylı verginin birinci özelliğidir. Doğrusu: dolaylı vergi ödeme gücünü dikkate almaz."}},"celdiriciYol":{},"hap":"Dolaylı vergi verimlidir ama adaletsizdir; ödeme gücü ölçütü dolaysız verginin işidir.","teshis":{"C":{"gercek":"Vergi fiyatın içinde olduğu için hissedilmez; bu dolaylı vergiye özgüdür.","ayirt":"Mükellef vergiyi ayrı bir ödeme olarak görüyor mu?","paragraf":"Dolaylı vergiler notu","yanilgi":"Mali anesteziyi dolaysız vergiye bağlıyorsun."},"E":{"gercek":"Dolaylı vergiler az sayıda satıcıdan toplandığı için tahsili kolay ve verimlidir.","ayirt":"Vergi kaç noktadan toplanıyor?","paragraf":"Dolaylı vergiler notu","yanilgi":"Verimliliği yalnız dolaysız vergiye bağlıyorsun."},"A":{"gercek":"Yansıtma dolaylı verginin ayırt edici özelliğidir, listede yer alır.","ayirt":"Vergi başkasına aktarılabiliyor mu?","paragraf":"Dolaylı vergiler notu","yanilgi":"Yansıtmayı her vergide mümkün sanıyorsun."},"D":{"gercek":"Oran düz olduğu hâlde düşük gelirlinin yükü göreli olarak ağırlaşır; bu etkiye tersine artan oranlılık denir.","ayirt":"Etki mi, tarife mi konuşuluyor?","paragraf":"Dolaylı vergiler notu","yanilgi":"Tersine artan oranlılığı tarifenin yapısı sanıyorsun."},"B":{"gercek":"Dolaylı vergide oran herkes için aynıdır ve mükellefin geliri hesaba katılmaz; ödeme gücü ölçütü dolaysız vergilerin niteliğidir.","ayirt":"Vergi kişinin gelirine göre değişiyor mu?","paragraf":"Dolaylı vergiler notu","yanilgi":"Bu şıkkı eleyen öğrenci, her verginin bir biçimde ödeme gücünü izlediğini düşünür."}},"verilen":[[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"Kamu harcamalarındaki artış görünüşte ve gerçek olmak üzere ikiye ayrılır. Görünüşte artış, paranın değer kaybetmesi, bütçe tekniğindeki değişme, ülke sınırlarının ve nüfusun büyümesi ile aynı ekonomiden parasal ekonomiye geçiş gibi sebeplerle rakamların büyümesidir ve reel bir genişleme yoktur. Gerçek artış ise askeri harcamalar, teknolojik gelişme, sosyal devlet anlayışı, kentleşme ve devletin faaliyet alanının genişlemesi gibi fiili genişlemedir.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Artış sorularında her şıkkı tek soruyla sına: devlet fiilen daha fazla iş mi yapıyor, yoksa yalnız rakam mı büyüdü.","konu":"kamu harcamaları reel artış","tablo":{"satirlar":[["VERİLENLER","-"],["Görünüşte artış","Paranın değer kaybı, bütçe tekniğinin değişmesi, nüfus ve sınır büyümesi"],["Gerçek artış","Görev alanının genişlemesi, yeni hizmetler, savunma ve sosyal yükler"],["HESAP","-"],["Ne soruluyor","Kamu harcamalarındaki artışın görünüşte artış sayılmasına yol açan durum aşağıdakilerden hangisidir?"],["Kural","Kamu harcamalarındaki artış görünüşte ve gerçek olmak üzere ikiye ayrılır. Görünüşte artış, paranın değer kaybetmesi, bütçe tekniğindeki değişme, ülke sınırlarının ve nüfusun büyümesi ile aynı ekonomiden parasal ekonomiye geçiş gibi sebeplerle rakamların büyümesidir ve reel bir genişleme yoktur. Gerçek artış ise askeri harcamalar, teknolojik gelişme, sosyal devlet anlayışı, kentleşme ve devletin faaliyet alanının genişlemesi gibi fiili genişlemedir."],["Doğru şık","D) Paranın değer kaybetmesi"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Yeni kamu hizmetlerinin üstlenilmesi","E":"Askeri harcamaların artması","A":"Devletin görev alanının genişlemesi","D":"Paranın değer kaybetmesi","B":"Sosyal güvenlik yüklerinin artması"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Wagner Kanunu (kamu harcamalarinin artisi)","metin":"TEORİ (maliye, mevzuat maddesi yok). WAGNER KANUNU (Adolph Wagner): sanayileşme ve ekonomik kalkınma ilerledikçe KAMU HARCAMALARININ MİLLÎ GELİR İÇİNDEKİ PAYI SÜREKLİ ARTAR. Bu bir eğilim yasasıdır, kaçınılmaz görülür. GEREKÇELERİ: (1) sanayileşme ve sehirlesmeyle birlikte adalet, güvenlik, düzenleme gibi İDARİ ve HUKUKİ hizmetlere ihtiyacin artması, (2) eğitim, sağlık, kültür gibi hizmetlerin GELİR ESNEKLİĞİNİN YÜKSEK olması (refah arttıkça talep daha hızlı artar - lüks mal niteliği), (3) ölçek ekonomisi gerektiren büyük yatırımların (altyapı, ulaştırma) özel kesimce karsilanamamasi. ARTIŞIN AYRIMI (sinavlik): GÖRÜNÜRDE (NOMİNAL) ARTIŞ - enflasyon, paranın değer kaybı, nüfus artışı veya bütçe usulünün değişmesi (safi bütçeden gayrisafi bütçeye geçiş) nedeniyle rakamların büyümesidir; REEL bir genişleme yoktur. GERÇEK (REEL) ARTIŞ - devletin görev alanının genişlemesi, yeni hizmetlerin üstlenilmesi, savunma-sosyal güvenlik yüklerinin artması gibi FİİLİ genişlemedir. DİĞER AÇIKLAMALAR: PEACOCK-WİSEMAN SIÇRAMA TEZİ - harcamalar düzgün değil, savaş/kriz gibi büyük sarsintilarda SIÇRAYARAK artar ve kriz bitince eski düzeye TAM DÖNMEZ (yer değiştirme etkisi). LEVİATHAN modeli ise artışı bir SAPMA olarak görüp anayasal sınırlama önerir. SINAV TUZAĞI: Wagner artışı KAÇINILMAZ ve DOĞAL görür; Leviathan ise SINIRLANDIRILMASI GEREKEN bir sorun sayar - ikisi aynı şey değildir. Ayrıca Wagner\u0027in ölçütü MUTLAK harcama tutarı değil, MİLLÎ GELİR İÇİNDEKİ PAYDIR."},{"ad":"TEORI - Kamu harcamalarinin artis nedenleri ve mali anestezi","metin":"TEORİ (maliye; mevzuat maddesi yok). KAMU HARCAMALARININ ARTIŞI: GÖRÜNÜŞTE artış nedenleri — para değerinin düşmesi (enflasyon), bütçe tekniğindeki değişme (safi bütçeden gayri safi bütçeye geçiş), ülke sınırlarının ve nüfusun büyümesi, aynı ekonomiden parasal ekonomiye geçiş; GERÇEK artış nedenleri — askeri harcamalar, teknolojik gelişme, sosyal devlet anlayışı, kentleşme, nüfus artışı ve yaşlanması, devletin ekonomik faaliyet alanının genişlemesi. WAGNER KANUNU (kamu harcamalarının artışı kanunu): gelir arttıkça kamu harcamaları gelirden HIZLI artar (kamu hizmetleri gelir esnekliği \u003e 1 olan üstün mallardır). PEACOCK-WİSEMAN SIÇRAMA (yer değiştirme) TEZİ: harcamalar düz artmaz; savaş-kriz gibi olağanüstü dönemlerde vergi tahammül düzeyi yükselir, harcamalar sıçrar ve kriz bitince eski düzeye inmez (yer değiştirme + inceleme etkisi + yoğunlaşma etkisi). Baumol\u0027un maliyet hastalığı: verimliliği artmayan kamu hizmetlerinde ücretler özel sektörle birlikte artınca birim maliyet yükselir. MALİ ANESTEZİ (vergi uyuşturması): mükellefin vergiyi hissetmeden ödemesi — fiyata gömülü dolaylı vergiler (KDV, ÖTV) ve kaynakta kesinti; vergiye tepkiyi azaltır. MALİ SÜRÜKLENME (fiscal drag): enflasyonla nominal gelirler artınca mükelleflerin artan oranlı tarifede üst dilimlere kayması ve reel vergi yükünün kanun değişmeden artması; çözümü dilimlerin enflasyona endekslenmesidir. MALİ RANT: enflasyonun devlet borcunun reel değerini eritmesi. SINAV TUZAĞI: (1) Wagner \u0027kamu harcamaları GSYH\u0027den hızlı artar\u0027 der; \u0027aynı hızda\u0027 şıkkı yanlış. (2) Peacock-Wiseman\u0027ın anahtar kelimesi SIÇRAMA ve vergi…"}],"hakem":"Soru Wagner Kanunu kapsamında kamu harcamalarındaki görünüşte artışın nedenini soruyor; kaynak metni paranın değer kaybetmesini görünüşte artışın açık bir sebebi olarak tanımladığından dogru sık tamamen desteklenmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Yeni hizmetlerin üstlenilmesi (örneğin yeni bir hastane açmak) devletin fiili genişlemesidir ve gerçek artış yaratır. Soruda sadece sayıların büyümesi sorgulanıyor.","E":"Askeri harcamaların artması ülkenin savunma kapasitesini gerçekten güçlendirir, reel bir artıştır. Soruda paranın değerinin düşmesinden kaynaklanan görünüşte artış aranıyor.","A":"Devletin görev alanının genişlemesi (örneğin yeni bir kamu kurumu açması) gerçek bir artıştır, çünkü fiilen yeni harcamalar ortaya çıkar. Soruda görünüşte artış aranıyor.","B":"Sosyal güvenlik yüklerinin artması (daha fazla emekli, artan katkı oranları) gerçek artış nedenidir, devlet fiilen daha fazla para harcıyor. Soruda sadece sayılar şişip de reel bir genişleme olmayan durum aranıyor."},"dogru":"Paranın değer kaybetmesi (enflasyon) nedeniyle bütçe rakamları büyür ama gerçek anlamda devletin harcaması artmamıştır. Sadece aynı hizmetler daha pahalı hale geldiği için sayılar şişer.","sinav":"Kamu harcamalarındaki görünüşte artış paranın değer kaybetmesinden kaynaklanır.","kavramlar":[{"kaynak":"TEORI","tanim":"Paranın değer kaybetmesi, bütçe tekniğindeki değişme, ülke sınırlarının ve nüfusun büyümesi gibi sebeplerle bütçe rakamlarının büyümesi; reel bir genişleme yoktur.","ad":"Görünüşte artış"},{"kaynak":"TEORI","tanim":"Askeri harcamalar, teknolojik gelişme, sosyal devlet anlayışı, kentleşme ve devletin faaliyet alanının genişlemesi gibi fiili genişlemedir.","ad":"Gerçek artış"},{"kaynak":"TEORI","tanim":"Sanayileşme ve ekonomik kalkınma ilerledikçe kamu harcamalarının milli gelir içindeki payı sürekli artar.","ad":"Wagner kanunu"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[],"donemler":["2024/3"]},"oyun":null,"tip":"teori","soru":"Kamu harcamalarındaki artışın görünüşte artış sayılmasına yol açan durum aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t4-maliye-kolay/kp-04","verilenler":[{"deger":"Paranın değer kaybı, bütçe tekniğinin değişmesi, nüfus ve sınır büyümesi","anlam":"Rakamlar büyür ama reel genişleme yoktur.","ad":"Görünüşte artış"},{"deger":"Görev alanının genişlemesi, yeni hizmetler, savunma ve sosyal yükler","anlam":"Devletin fiili genişlemesidir.","ad":"Gerçek artış"}],"dayanak":"Teori notu: Wagner Kanunu ve kamu harcamalarının artışı — görünüşte (nominal) artış enflasyon, paranın değer kaybı, nüfus artışı veya bütçe usulünün değişmesi nedeniyle rakamların büyümesidir ve reel bir genişleme yoktur; gerçek (reel) artış devletin görev alanının genişlemesi, yeni hizmetlerin üstlenilmesi, savunma ve sosyal güvenlik yüklerinin artması gibi fiili genişlemedir; Wagner\u0027in ölçütü mutlak harcama tutarı değil milli gelir içindeki paydır","dogru":"D","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Ayrım = Görünüşte artış ve gerçek artış","anlatim":"İki tür arasındaki fark, devletin sunduğu hizmetin hacminin değişip değişmediğidir.","doldur":[]},{"formul":"Görünüşte artış = Paranın değer kaybı, bütçe tekniğinin değişmesi, nüfus ve sınır büyümesi","anlatim":"Bu sebeplerde rakam büyür, reel genişleme yoktur.","doldur":[[5,1]]},{"formul":"Gerçek artış = Görev alanının genişlemesi, yeni hizmetler, savunma ve sosyal yükler","anlatim":"Wagner bu artışı kaçınılmaz görür ve ölçütü milli gelir içindeki pay olarak alır.","doldur":[[6,1]]}],"anahtar":[{"ornek":"genişleme","kok":"genişl"},{"ornek":"devlet","kok":"devlet"},{"ornek":"harcama","kok":"harcam"},{"ornek":"büyümesi","kok":"büyüme"},{"ornek":"gerçekten","kok":"gerçek"},{"ornek":"değişme","kok":"değişm"}],"konuGiris":{"harita":"Ne zaman test edilir: kamu harcamalarındaki artışın nedenleri sorulduğunda test edilir. Nasıl ölçülür: artışın enflasyon, nüfus, bütçe tekniği değişimi gibi nominal bir nedene mi yoksa devletin görev alanının fiilen genişlemesine mi bağlı olduğuna bakılarak ayrılır. Nasıl kaydedilir: soru kökünde geçen neden, görünüşte/gerçek artış listesinden eşleştirilerek şıkka yansıtılır.","desen":"Soru genelde \u0027görünüşte artış\u0027 ile \u0027gerçek artış\u0027 nedenlerini karıştırtarak sorar; enflasyon veya bütçe usulü değişimi gibi nominal nedenler gerçek artış gibi sunulup tuzak kurulur. Bazı şıklarda savunma harcaması gibi gerçek artış nedenleri görünüşte artışla karıştırılır. Bu soru Wagner Kanunu ve kamu harcamalarının artış nedenleri (p.arşiv) noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Enflasyon, nüfus artışı veya bütçe tekniği değişimiyle oluşan rakamsal büyüme","ad":"Görünüşte (nominal) artış","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Devletin görev alanının fiilen genişlemesiyle oluşan hizmet artışı","ad":"Gerçek (reel) artış","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Safi bütçeden gayrisafi bütçeye geçişle rakamların büyümesi","ad":"Bütçe tekniği değişimi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Kalkınmayla kamu harcamalarının milli gelirdeki payının sürekli artması eğilimi","ad":"Wagner Kanunu","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soru kökünde bir artış nedeni verilir ve bunun görünüşte artış mı gerçek artış mı sayıldığı sorulur.","panel_ornek":"Kira sözleşmen 2000 liradan 2200 liraya çıktı ama zam sadece enflasyon farkı, ev büyümedi, ev sahibi sana ekstra oda vermedi. Yani rakam arttı ama gerçekte elde ettiğin şey aynı kaldı; buna \u0027görünüşte artış\u0027 denir.","ornek":"Kira sözleşmen 2000 liradan 2200 liraya çıktı ama zam sadece enflasyon farkı, ev büyümedi, ev sahibi sana ekstra oda vermedi. Yani rakam arttı ama gerçekte elde ettiğin şey aynı kaldı; buna \u0027görünüşte artış\u0027 denir.","yontemler":"En kritik kural: rakam büyümesi enflasyon, nüfus ya da bütçe tekniği kaynaklıysa görünüşte artıştır; devletin görev alanı fiilen genişlediyse gerçek artıştır.","nedir":"Kamu harcamalarındaki artışın gerçek bir hizmet genişlemesi mi yoksa sadece rakamsal büyüme mi olduğu ayrımını inceler. Sınav, artışın hangi nedenle \u0027görünüşte\u0027 sayıldığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Ayrım Tuzağı","metin":"Yeni hizmetlerin üstlenilmesi devletin fiili genişlemesidir. Doğrusu: aranan sebep paranın değer kaybetmesidir."},"E":{"ad":"Ayrım Tuzağı","metin":"Askeri harcamaların artması gerçek artış sebeplerinden biridir. Doğrusu: görünüşte artış paranın değer kaybetmesinden doğar."},"A":{"ad":"Ayrım Tuzağı","metin":"Görev alanının genişlemesi gerçek artış sebeplerindendir. Doğrusu: görünüşte artışın sebebi paranın değer kaybetmesidir."},"B":{"ad":"Ayrım Tuzağı","metin":"Sosyal güvenlik yüklerinin artması gerçek artıştır. Doğrusu: görünüşte artışın sebebi paranın değer kaybetmesidir."}},"celdiriciYol":{},"hap":"Harcama rakamının büyümesi tek başına kamunun büyüdüğünü göstermez; ölçü, hizmetin hacminin gerçekten artıp artmadığıdır.","teshis":{"C":{"gercek":"Yeni hizmet üstlenmek devletin faaliyet alanını fiilen genişletir.","ayirt":"Yeni bir hizmet eklendi mi?","paragraf":"Wagner Kanunu notu","yanilgi":"Yeni hizmetleri de nominal büyüme sayıyorsun."},"E":{"gercek":"Savunma yükünün artması gerçek artış sebepleri arasında sayılır.","ayirt":"Harcamanın kendisi mi büyüdü?","paragraf":"Wagner Kanunu notu","yanilgi":"Askeri harcamaları teknik bir kalem sanıyorsun."},"A":{"gercek":"Devletin görev alanının genişlemesi harcamayı fiilen büyütür, bu gerçek artıştır.","ayirt":"Devlet yeni bir iş mi üstlendi?","paragraf":"Wagner Kanunu notu","yanilgi":"Her artışı aynı torbaya koyuyorsun."},"D":{"gercek":"Enflasyon rakamları büyütür ama devletin sunduğu hizmetin hacmi değişmez; bu yüzden bu artış görünüşte kalır.","ayirt":"Hizmetin miktarı arttı mı, yalnız fiyatı mı?","paragraf":"Wagner Kanunu notu","yanilgi":"Bu şıkkı eleyen öğrenci, harcama rakamı büyüdüğü için her durumda kamunun gerçekten büyüdüğünü düşünür."},"B":{"gercek":"Sosyal güvenlik yükünün artması hizmetin kendisinin büyümesidir.","ayirt":"Hizmetin hacmi arttı mı?","paragraf":"Wagner Kanunu notu","yanilgi":"Sosyal harcamaları rakamsal büyüme sanıyorsun."}},"verilen":[[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"Cari ve yatırım harcamaları birlikte reel harcama sayılır, çünkü devlet karşılığında mal veya hizmet edinir ve bu harcamalar milli gelire doğrudan katkı yapar. Transfer harcamaları ise karşılığında mal veya hizmet alınmayan, satın alma gücünün karşılıksız aktarıldığı harcamalardır; milli gelire doğrudan girmez, gelir dağılımını değiştirir.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Reel ve transfer ayrımında tek soru yeter: devlet bu ödemenin karşılığında bir mal ya da hizmet aldı mı.","konu":"kamu harcamaları sınıflandırma (cari-yatırım)","tablo":{"satirlar":[["VERİLENLER","-"],["Reel harcama","Cari ve yatırım harcamaları"],["Transfer harcaması","Karşılıksız aktarım"],["HESAP","-"],["Ne soruluyor","Kamu harcamalarından hangisi milli gelire doğrudan katkı yapmaz?"],["Kural","Cari ve yatırım harcamaları birlikte reel harcama sayılır, çünkü devlet karşılığında mal veya hizmet edinir ve bu harcamalar milli gelire doğrudan katkı yapar. Transfer harcamaları ise karşılığında mal veya hizmet alınmayan, satın alma gücünün karşılıksız aktarıldığı harcamalardır; milli gelire doğrudan girmez, gelir dağılımını değiştirir."],["Doğru şık","B) Transfer harcaması"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Bina yapımı","E":"Mal ve hizmet alımı","A":"Personel gideri","D":"Makine alımı","B":"Transfer harcaması"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - kamu harcamalari siniflandirma (cari-yatirim)","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Ekonomik sınıflandırmada kamu harcamaları üç ana gruba ayrılır. CARİ HARCAMALAR: Kamu hizmetinin o yıl içinde üretilmesi için yapılan, faydası genellikle bir malî yılla sınırlı, TÜKETİM niteliğindeki harcamalardır: personel giderleri (maaş, ücret), sosyal güvenlik kurumuna devlet primi, mal ve hizmet alımları (kırtasiye, elektrik, kira, bakım). YATIRIM (SERMAYE) HARCAMALARI: Faydası birden çok yıla yayılan, ülkenin sermaye stokunu artıran harcamalardır: bina, yol, baraj, makine ve teçhizat alımı, büyük onarım. TRANSFER HARCAMALARI: Karşılığında mal veya hizmet alınmayan, satın alma gücünün bir kesimden ötekine KARŞILIKSIZ aktarıldığı harcamalardır: emekli aylıkları, sosyal yardımlar, tarımsal destekler, sübvansiyonlar, borç faizi ödemeleri, KİT\u0027lere görev zararı ödemeleri. Cari ve yatırım harcamaları birlikte REEL (gerçek) HARCAMA sayılır; çünkü devlet karşılığında mal veya hizmet edinir ve millî gelire doğrudan katkı yapar. Transfer harcaması millî gelire doğrudan girmez, gelir dağılımını değiştirir. KÜÇÜK ÖRNEK: Bir okulun öğretmen maaşı cari, okul binasının yapımı yatırım, öğrencilere ödenen burs transferdir. Devletin iç borç faizi ödemesi transferdir. SINAV TUZAĞI: (1) Faiz ödemesi TRANSFER harcamasıdır; sınav bunu cari veya yatırım diye vermeye çalışır. (2) Eğitim ve sağlık harcamaları iktisadi anlamda \u0027beşeri sermaye yatırımı\u0027 sayılsa da bütçe sınıflandırmasında personel ve mal-hizmet kalemleri CARİdir. (3) Makine ve teçhizat alımı yatırım, aynı makinenin bakımı caridir; ancak ömrünü uzatan büyük onarım yatırım sayı…"},{"ad":"TEORI - kamu harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok, analitik bütçe sınıflandırması 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu uygulamasıdır). TANIM VE KURAL: Kamu harcamaları üç temel ölçüte göre sınıflandırılır. (1) İDARİ (KURUMSAL) SINIFLANDIRMA: Harcamayı hangi kurumun yaptığına bakar (bakanlıklar, üniversiteler). Kimin sorumlu olduğunu gösterir, hizmetin niteliğini göstermez. (2) FONKSİYONEL (İŞLEVSEL) SINIFLANDIRMA: Harcamanın hangi kamu hizmetine yöneldiğine bakar; uluslararası standartta on ana işlev vardır: genel kamu hizmetleri, savunma, kamu düzeni ve güvenlik, ekonomik işler, çevre koruma, iskân ve toplum refahı, sağlık, dinlenme–kültür–din, eğitim, cari harcamalar (personel, mal ve hizmet alımı), yatırım (sermaye) harcamaları, transfer harcamaları (cari ve sermaye transferleri), faiz giderleri, borç verme. Bir başka kesit REEL–TRANSFER ayrımıdır: reel harcamada devlet karşılığında mal veya hizmet alır (maaş, bina), transferde karşılıksız satın alma gücü aktarır (emekli aylığı, faiz, sübvansiyon). ANALİTİK BÜTÇE SINIFLANDIRMASI dört boyutu birlikte kullanır: kurumsal, fonksiyonel, finansman tipi (genel bütçe, özel bütçe, döner sermaye, dış proje kredisi gibi) ve ekonomik. KÜÇÜK ÖRNEK: Bir devlet hastanesinin hemşire maaşı: kurumsal olarak Sağlık Bakanlığı, fonksiyonel olarak sağlık, ekonomik olarak cari (personel) harcamadır; emekli aylığı ödemesi ekonomik olarak transferdir, fonksiyonel olarak sosyal güvenlik. SINAV TUZAĞI: (1) Fonksiyonel sınıflandırma \u0027ne için\u0027, ekonomik s…"}],"hakem":"Soru, kamu harcamaları ekonomik sınıflandırmasında büyük onarım ile bakım harcamasının yeri soruyor; doğru sik (D) \u0027Büyük onarım yatırım, bakım cari harcamadır\u0027 kaynak metinde açıkça desteklenmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Eşleştirme ters yapılmıştır; büyük onarım yatırım, bakım caridir.","E":"Her iki kalemde de devlet karşılığında mal veya hizmet almaktadır; transfer harcamada ise karşılıksız aktarım yapılır.","A":"Her iki kalem de cari sayılmaz; büyük onarım makinenin ömrünü uzattığı için sermaye stokunu artırır ve yatırımdır.","B":"Olağan bakım bir yıl içinde tüketilir, faydası bir malî yılla sınırlı olduğu için cari harcamadır."},"dogru":"Bakım harcaması faydası bir yılla sınırlı olduğu için cari harcamadır. Büyük onarım ise makinenin ömrünü uzattığı için sermaye stokunu artırır ve yatırım harcamasıdır.","sinav":"Ekonomik sınıflandırmada büyük onarım yatırım harcaması, olağan bakım ise cari harcama niteliğindedir.","kavramlar":[{"kaynak":"TEORI","tanim":"Kamu hizmetinin o yıl içinde üretilmesi için yapılan, faydası bir malî yılla sınırlı tüketim niteliğindeki harcamadır; personel gider
