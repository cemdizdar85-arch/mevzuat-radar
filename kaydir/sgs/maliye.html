adece zam farkı, gerçek kullanım bedeli değil. Bu zam farkını çıkardığında arkadaşının \u0027gerçek\u0027 kira yükünü görürsün, işte operasyonel açık da böyle bir ayıklama yapar.","ornek":"Arkadaşın 12.000 TL kirasını her ay ödüyor, bunun 5.000 TL\u0027si sadece zam farkı, gerçek kullanım bedeli değil. Bu zam farkını çıkardığında arkadaşının \u0027gerçek\u0027 kira yükünü görürsün, işte operasyonel açık da böyle bir ayıklama yapar.","yontemler":"Önce birincil açık = nominal açık − toplam faiz bulunur, sonra reel faiz = toplam faiz − enflasyon primi eklenir; toplam operasyonel açığı verir.","nedir":"Operasyonel açık, yüksek enflasyon dönemlerinde nominal faiz ödemesindeki enflasyon telafisi kısmını çıkararak bütçenin gerçek yükünü gösterir. Sınav bu düzeltmenin hangi kalemden yapıldığını ölçer."},"olay":"Birincil açık=200-90=110; Reel faiz=90-50=40; Operasyonel açık=110+40=150.","tuzak":{"C":{"ad":"Ters İşaret Tuzağı","metin":"Enflasyon primini çıkarmak yerine birincil açığa eklersen 110+50=160 bulursun; oysa reel faiz (faiz-prim) eklenmelidir. Doğrusu: Reel faiz=90-50=40 eklenerek 150 bulunur."},"E":{"ad":"Ters Yön Toplama Tuzağı","metin":"Enflasyon primini nominal açıktan düşmek yerine üzerine eklersen 200+50=250 bulursun. Doğrusu: Prim nominal açıktan düşülerek operasyonel açığa ulaşılır."},"D":{"ad":"Düzeltme Yapmama Tuzağı","metin":"Enflasyonun etkisini hiç ayıklamadan nominal açığı operasyonel açık sanırsın. Doğrusu: Yüksek enflasyonda nominal açık gerçek yükü abartır, düzeltme yapılmalıdır."},"A":{"ad":"Faizin Tamamını Dışlama Tuzağı","metin":"Nominal açıktan yalnız faiz ödemesinin tamamını düşüp reel faizi eklemeyi unutursan bu, operasyonel açığı değil birincil açığı verir. Doğrusu: 200-90=110 birincil açıktır, operasyonel açık için reel faiz eklenmelidir."}},"celdiriciYol":{"C":"200-90+50=160 (enflasyon primini çıkarmak yerine topladın)","E":"200+50=250 (enflasyon primini nominal açığa ekledin, düşmedin)","D":"200=200 (enflasyon düzeltmesini hiç yapmadın)","A":"200-90=110 (reel faizi eklemeden birincil açıkta kaldın)"},"hap":"Operasyonel açık = birincil açık + reel faiz; yani nominal açıktan yalnız enflasyon primi düşülür, faizin tamamı değil.","teshis":{"C":{"gercek":"Enflasyon primi, nominal faizden çıkarılarak reel faiz bulunur; toplama işlemi ters yöndür.","ayirt":"Primi çıkarıyor muyum, yoksa yanlışlıkla topluyor muyum?","paragraf":"Teori - operasyonel açık","yanilgi":"Enflasyon primini düşülecek kalem değil eklenecek kalem sanıyorsun."},"E":{"gercek":"Enflasyon primi nominal açıktan düşülerek gerçek (operasyonel) yük bulunur, üzerine eklenmez.","ayirt":"Primi açığa mı ekledim, açıktan mı düştüm?","paragraf":"Teori - operasyonel açık","yanilgi":"Enflasyon priminin açığı azaltacağını değil artıracağını sanıyorsun."},"A":{"gercek":"Birincil açık faizin tamamını dışlar; operasyonel açık ise yalnız enflasyon primini dışlayıp reel faizi içerir.","ayirt":"Faizin hepsini mi yoksa sadece enflasyon kısmını mı çıkardım?","paragraf":"Teori - operasyonel açık","yanilgi":"Operasyonel açığı birincil açıkla aynı şey sanıyorsun, faizin tamamını dışlıyorsun."},"D":{"gercek":"Nominal açık, enflasyonun faiz üzerindeki telafi etkisini içerdiği için yüksek enflasyonda gerçek yükü abartır.","ayirt":"Enflasyon telafisini ayıkladım mı?","paragraf":"Teori - operasyonel açık","yanilgi":"Yüksek enflasyonda hiç düzeltme yapmadan nominal açığı gerçek yük sanıyorsun."},"B":{"gercek":"Operasyonel açık = birincil açık + reel faiz ödemeleri; yani nominal açıktan yalnız enflasyon primi düşülür.","ayirt":"Reel faizi (faiz-prim) birincil açığa ekledim mi?","paragraf":"Teori - operasyonel açık","yanilgi":"Bu şıkkı eleyen öğrenci reel faizin de açığa dahil olduğunu unutup nominal ya da birincil açığı yeterli sanıyor."}},"verilen":[[5,0],[5,1],[1,1],[2,1],[3,1]],"donem":2,"hesaplar":{"110":{"ad":"HİSSE SENETLERİ","tanim":"Geçici olarak, elde tutulan hisse senetleri bu hesapta izlenir. Menkul Kıymetler Hesaplarının İşleyişi: Menkul kıymetler edinildiğinde alış bedeli üzerinden yukarıdaki hesaplara borç, elden çıkartıldığında ise, aynı bedel ile alacak kaydedilir."},"150":{"ad":"İLK MADDE VE MALZEME","tanim":"Üretimde veya diğer faaliyetlerde kullanılmak üzere işletmede bulundurulan hammadde, yardımcı madde, işletme malzemesi, ambalaj malzemesi ve diğer malzemelerin izlendiği hesaptır."},"250":{"ad":"ARAZİ VE ARSALAR","tanim":"İşletmeye ait her türlü arazi ve arsaların izlendiği hesaptır. İşleyişi (250-256 için ortak): Maddi duran varlıklar hesapları satınalma, devir, inşa veya imal bedelleriyle borçlandırılır. Satılan, devredilen; kullanma yeteneğini kaybedenler ise, alacak kaydı ile hesaplardan çıkarılır."}}},{"capa":{"kaynak":"SGS 2024/2 Soru 100"},"kural":"Operasyonel açık = birincil açık + reel faiz; nominal açık = birincil açık + toplam (nominal) faiz ödemesi.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/2 Soru 100","sonDonem":2,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Faizin hangi türü (reel/nominal/enflasyon telafisi) sorulan açığın hangi katmanına ait, önce onu ayır; sonra tek tek ekle-çıkar.","konu":"operasyonel açık","tablo":{"satirlar":[["VERİLENLER","-"],["Operasyonel açık","70"],["Nominal faiz ödemesi","80"],["Reel faiz ödemesi","30"],["Konjonktürel açık","15"],["HESAP","-"],["Birincil açık (70 - 30)","40"],["Nominal açık (40 + 80)","120"]],"basliklar":["Kalem","Tutar"]},"siklar":{"C":"120","E":"150","A":"70","D":"135","B":"100"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - operasyonel acik","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Aynı bütçe için birkaç açık ölçüsü hesaplanır. GELENEKSEL (NOMİNAL) AÇIK: Toplam harcama − toplam gelir; faiz ödemeleri dahil. BİRİNCİL (FAİZ DIŞI) AÇIK veya FAZLA: Faiz ödemeleri hariç harcama − gelir; hükümetin o yıl kendi kararlarıyla yönetebildiği dengeyi gösterir, borç sürdürülebilirliğinin temel göstergesidir. OPERASYONEL (İŞLEMSEL) AÇIK: Yüksek enflasyon ortamında nominal faiz ödemelerinin büyük kısmı, borcun reel değerindeki aşınmayı telafi eden ENFLASYON PRİMİdir; bu kısım gerçek bir kaynak transferi sayılmaz. Operasyonel açık = birincil açık + REEL faiz ödemeleri; başka deyişle nominal açıktan faizin enflasyon telafisi kısmı çıkarılır. Enflasyon yüksekken nominal açık gerçek malî durumu abartır, operasyonel açık düzeltir. YAPISAL AÇIK: Ekonomi potansiyel üretim düzeyindeyken oluşacak açık; konjonktürden arındırılmış, politikadan kaynaklanan kısım. KONJONKTÜREL AÇIK: Durgunlukta vergilerin düşmesi ve işsizlik ödemelerinin artmasıyla otomatik oluşan kısım. KÜÇÜK ÖRNEK: Nominal açık 100, faiz ödemesi 60 ve bu faizin 45\u0027i enflasyon telafisi ise birincil açık 100 − 60 = 40, reel faiz 60 − 45 = 15, operasyonel açık 40 + 15 = 55 olur. Nominal 100 görünen açığın gerçek yükü 55\u0027tir. SINAV TUZAĞI: (1) Birincil açık faizin TAMAMINI dışlar, operasyonel açık yalnız enflasyon telafisi kısmını dışlar (reel faizi içerir). (2) Operasyonel açık yüksek enflasyon ülkeleri için anlamlıdır; düşük enflasyonda nominal açığa yaklaşır. (3) Birincil fazla vermek, borcun millî gelire oranını düşürmenin ön koşuludur; \u0027nominal denge\u0027 değil \u0027…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.4","metin":"Madde 4- Kamu maliyesi; gelirlerin toplanması, harcamaların yapılması, açıkların finansmanı, kamunun varlık ve borçları ile diğer yükümlülüklerinin yönetimini kapsar. Kamu maliyesi, merkezden ve yerinden yönetim esaslarına göre yürütülür. Kamu idarelerinin görevleri, ilgili kanunlarında veya Cumhurbaşkanlığı kararnamelerinde açık olarak belirlenir ve kaynakların dağıtımında esas alınır.4 Kamu maliyesinin temel ilkeleri"}],"hakem":"Soru operasyonel açık kavramını doğru ölçüyor, kaynak metindeki kural tam olarak uygulanıyor ve hesap doğru."},"kayitlar":[],"sade":{"siklar":{"D":"Konjonktürel açığı (15) sonuca eklersin, sanki nominal açığın parçasıymış gibi. Oysa konjonktürel açık başka bir sınıflandırma, nominal açık hesabına girmez.","E":"Birincil açığı bulurken reel faiz yerine nominal faizi çıkarıp sonra yine nominal faizi eklersin. Operasyonel açıktan yalnız reel faiz çıkarılmalı.","A":"Operasyonel açığı direkt nominal açık sanırsın. Ama bu rakam yalnız reel faizi içerir; nominal açığa ulaşmak için tüm faiz ödenmelerini eklemelisin.","B":"Reel faiz yerine nominal faizin enflasyon telafisi kısmını (50) kullanıp birincil açığı yanlış hesaplarsın. Soruda reel faiz ayrıca 30 olarak veriliyor."},"dogru":"Operasyonel açık (70) reel faizi içerdiği için, önce buna reel faizi çıkarıp birincil açığı bulmalısın (70 − 30 = 40). Sonra birincil açığa nominal faizi ekle (40 + 80 = 120). Bu, hükümetin gerçek borçlanma ihtiyacını gösterir.","sinav":"Operasyonel açık ve nominal faiz ödemesi verildiğinde, birincil açık ile geleneksel (nominal) bütçe açığını sırasıyla hesaplayarak bulunur.","kavramlar":[{"kaynak":"TEORI","tanim":"Bütçenin gerçek yükünü göstermek için, nominal faizin enflasyon telafisi kısmı çıkarılmış açık. Reel faiz ödemeleri ve birincil açık toplamıyla bulunur; yüksek enflasyon dönemlerinde hükümetin fiili borçlanma ihtiyacını yansıtır.","ad":"Operasyonel açık"},{"kaynak":"TEORI","tanim":"Toplam harcamadan toplam gelir çıkarıldığında bulunur; faiz ödemeleri tamamen içerilir ve hükümetin yıllık finansman ihtiyacını gösterir.","ad":"Geleneksel (nominal) bütçe açığı"},{"kaynak":"TEORI","tanim":"Bütçe açığından faiz ödemeleri hariç tutulmuş kısım; hükümetin kendi kararlarıyla kontrol edebildiği dengeyi ve borç sürdürülebilirliğini gösteren temel göstergedir.","ad":"Birincil (faiz dışı) açık"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2026/1","2024/2"]},"oyun":{"bosluk":[[0,1],[1,1]],"tablo":{"basliklar":["Kalem","Tutar"],"satirlar":[["Birincil açık (90 - 25)","65"],["Nominal açık (65 + 60)","125"]]},"tur":"tablo","soru":"Bir ülkenin 2026 yılı bütçesinde operasyonel açık 90, nominal faiz ödemesi 60, reel faiz ödemesi 25 ve konjonktürel açık 10 olarak hesaplanmıştır. Bu verilere göre aynı döneme ait birincil (faiz dışı) bütçe açığı kaç TL\u0027dir?","verilen":[],"hedef":"Tabloyu doldur ve birincil açığın kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir ülkenin 2026 yılı bütçesinde operasyonel açık 70, nominal faiz ödemesi 80, reel faiz ödemesi 30 ve konjonktürel açık 15 olarak hesaplanmıştır. Bu verilere göre aynı döneme ait geleneksel (nominal) bütçe açığı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-genel-maliye-cokzor/kp-04","verilenler":[{"deger":"70","anlam":"Nominal faizin yalnız enflasyon telafisi kısmı düşülerek bulunan düzeltilmiş açık; birincil açık + reel faize eşittir.","ad":"Operasyonel açık"},{"deger":"80","anlam":"Bütçede fiilen ödenen toplam faiz; nominal açığı bulurken birincil açığa eklenir.","ad":"Nominal faiz ödemesi"},{"deger":"30","anlam":"Nominal faizin enflasyon telafisi dışında kalan kısmı; operasyonel açıktan çıkarılarak birincil açığa inilir.","ad":"Reel faiz ödemesi"},{"deger":"15","anlam":"Durgunluk kaynaklı otomatik açık bileşeni; nominal/operasyonel açık hesabına dahil değildir, çeldiricidir.","ad":"Konjonktürel açık"}],"dayanak":"Maliye Teorisi - Bütçe Açığı Ölçüleri (Öğreti Notu, Operasyonel Açık)","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Verilen: Operasyonel açık 70 (soruda verilen); Nominal faiz ödemesi 80 (soruda verilen); Reel faiz ödemesi 30 (soruda verilen); Konjonktürel açık 15 (soruda verilen)","anlatim":"Soru bize şunları vermiş: operasyonel açık 70, nominal faiz 80, reel faiz 30, konjonktürel açık 15.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Operasyonel açık = Birincil açık + Reel faiz","anlatim":"Operasyonel açık nedir? Birincil açığa reel faiz eklenerek bulunan açıktır, enflasyondan arındırılmış faiz yükünü gösterir.","doldur":[]},{"formul":"Dahil değil: Konjonktürel açık 15 (soruda verilen)","anlatim":"Konjonktürel açık burada tuzak, çünkü nominal açık hesabına girmiyor. Soru sadece dikkat dağıtmak için vermiş.","doldur":[]},{"formul":"Birincil açık = Operasyonel açık − Reel faiz = 70 (soruda verilen) − 30 (soruda verilen) = 40","anlatim":"Şimdi biz hesaplıyoruz: birincil açığı bulmak için operasyonel açıktan reel faizi çıkarıyoruz.","doldur":[[6,1]]},{"formul":"Nominal açık = Birincil açık + Nominal faiz","anlatim":"Nominal açık nedir? Birincil açığa nominal faiz eklenerek bulunur, gerçek faiz yükünü kapsar.","doldur":[]},{"formul":"Nominal açık = Birincil açık + Nominal faiz = 40 (4. adımda bulduk) + 80 (soruda verilen) = 120","anlatim":"Şimdi birincil açığa nominal faizi ekleyip nominal açığı buluyoruz. Bu bizim aradığımız sonuç.","doldur":[[7,1]]},{"formul":"Sonuç: Nominal (geleneksel) bütçe açığı = 120 (5. adımda bulduk)","anlatim":"Sonuç: geleneksel bütçe açığı 120 TL çıktı. Bu değer nominal açıkla aynı kavramı ifade eder.","doldur":[]},{"formul":"Ters durum: konjonktürel açık istenseydi → Operasyonel açık − Potansiyel açık kullanılırdı","anlatim":"Ters durumda konjonktürel açık soruluyorsa reel faiz değil, operasyonel açıkla potansiyel açık karşılaştırılır. Burada o yola hiç girilmez.","doldur":[]},{"formul":"Yanlış yol: 40 + 80 + 15 = 135 (HATALI) → doğrusu 120 (6. adımda bulduk)","anlatim":"En sık hata: öğrenci konjonktürel açığı 15\u0027i de toplama katıyor. Bu yanlış çünkü konjonktürel açık nominal açık formülünde yer almaz.","doldur":[]}],"anahtar":[{"ornek":"nominal","kok":"nomina"},{"ornek":"birincil","kok":"birinc"},{"ornek":"operasyonel","kok":"operas"},{"ornek":"konjonktürel","kok":"konjon"},{"ornek":"açıkla","kok":"açıkla"},{"ornek":"yükünü","kok":"yükünü"},{"ornek":"120","kok":"120"}],"konuGiris":{"harita":"Ne zaman test edilir: Yüksek enflasyon ortamında nominal, birincil ve operasyonel açık arasındaki fark sorulduğunda. Nasıl ölçülür: Operasyonel açık = birincil açık + reel faiz ödemesi formülüyle hesaplanır. Nasıl kaydedilir: Sınavda verilen nominal faiz, reel faiz, birincil ya da operasyonel açık değerlerinden istenen büyüklük geriye doğru çıkarılarak bulunur.","desen":"Soru genelde operasyonel açık formülünü tersine çevirip nominal açığı buldurur; öğrenci reel faizi doğrudan nominal faizden çıkarma tuzağına düşer (p.28 küçük örnek). Konjonktürel açık verisi genelde çözüme dahil edilmeyen bir çeldiricidir, öğrenci onu formüle katma hatası yapar. Bu soru operasyonel açık = birincil açık + reel faiz kuralının tersine uygulanması noktasından geliyor.","terimler":[{"kaynak":"sen hesaplarsın","tanim":"Toplam harcama ile toplam gelir farkı, faiz ödemeleri dahil hesaplanan açık","ad":"Geleneksel (nominal) açık","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"sen hesaplarsın","tanim":"Faiz ödemeleri hariç harcama ile gelir arasındaki fark","ad":"Birincil (faiz dışı) açık","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Nominal faizden enflasyon telafisi kısmı çıkarılınca kalan gerçek faiz yükü","ad":"Reel faiz ödemesi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"soruda verilir","tanim":"Birincil açığa reel faiz ödemesinin eklenmesiyle bulunan düzeltilmiş açık","ad":"Operasyonel açık","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Operasyonel açık, nominal faiz ve reel faiz verilip geleneksel (nominal) bütçe açığı istenir.","panel_ornek":"Bir arkadaşın 12.000 TL kirasına, kira artışının sadece enflasyonu telafi eden 5.000 TL\u0027lik kısmını \u0027gerçek yük değil\u0027 diye ayrı tutması gibi düşün; geri kalan 7.000 TL onun gerçek ek maliyetidir. Operasyonel açık da böyle, faizin enflasyon payını gerçek yükten ayırır.","ornek":"Bir arkadaşın 12.000 TL kirasına, kira artışının sadece enflasyonu telafi eden 5.000 TL\u0027lik kısmını \u0027gerçek yük değil\u0027 diye ayrı tutması gibi düşün; geri kalan 7.000 TL onun gerçek ek maliyetidir. Operasyonel açık da böyle, faizin enflasyon payını gerçek yükten ayırır.","yontemler":"Önce birincil açık = operasyonel açık - reel faiz ile bulunur, sonra nominal açık = birincil açık + nominal faiz ile hesaplanır. Konjonktürel açık bu işleme dahil edilmez, çeldiricidir.","nedir":"Operasyonel açık, yüksek enflasyonda nominal faiz ödemesinin enflasyon telafisi kısmını dışlayarak bütçenin gerçek yükünü gösteren ölçüdür. Sınav, nominal açık - birincil açık - operasyonel açık arasındaki farkı ve enflasyon payını ayırt etmeni ölçer."},"olay":"Birincil açık = 70 - 30 = 40; Nominal açık = 40 + 80 = 120.","tuzak":{"D":{"ad":"Kapsam Tuzağı","metin":"Konjonktürel açığı, sanki operasyonel/nominal açığın bir parçasıymış gibi doğru sonuca eklersin. Doğrusu: konjonktürel açık ayrı bir sınıflandırmadır, nominal açık hesabına girmez."},"E":{"ad":"Faiz Ölçüsü Tuzağı","metin":"Birincil açığı bulurken reel faiz yerine toplam nominal faizi düşer, sonra tekrar toplam faizi eklersin. Doğrusu: birincil açığa ulaşmak için operasyonel açıktan yalnız reel faiz çıkarılır, nominal faiz değil."},"A":{"ad":"Katman Atlama Tuzağı","metin":"Operasyonel açığı hiç düzeltmeden doğrudan nominal açık sanırsın. Doğrusu: operasyonel açık yalnız reel faizi içerir, önce birincil açığa inip sonra toplam faizle nominal açığa çıkmak gerekir."},"B":{"ad":"Reel Faiz Karıştırma Tuzağı","metin":"Enflasyon telafisi tutarını (50) reel faiz sanıp birincil açığı 70-50=20 bulursun. Doğrusu: reel faiz soruda ayrıca 30 olarak verilmiştir, enflasyon telafisi reel faize dahil değildir."}},"celdiriciYol":{"D":"120 + 15 = 135 (konjonktürel açığı nominal açığa dahil etme)","E":"70 + 80 = 150 (reel faiz yerine toplam nominal faizi ekleme)","A":"Operasyonel açık doğrudan nominal açık sayılır = 70 (katman atlama, düzeltme geri alınmadı)","B":"(70 - 50) + 80 = 100 (enflasyon telafisi tutarını reel faiz sanma)"},"hap":"Operasyonel açık = Birincil açık + Reel faiz; Nominal açık = Birincil açık + Nominal (toplam) faiz.","teshis":{"C":{"gercek":"Operasyonel açık = birincil açık + reel faiz olduğundan birincil açık = operasyonel açık - reel faiz; nominal açık ise birincil açık + toplam faizdir.","ayirt":"Birincil açığı bulmadan doğrudan nominal açığa geçebilir miyim?","paragraf":"Öğreti notu - Operasyonel Açık formülü","yanilgi":"Bu şıkkı eleyen öğrenci, operasyonel açıktan nominal açığa iki adımda (önce reel faizi çıkar, sonra nominal faizi ekle) gidilmesi gerektiğini atlar."},"E":{"gercek":"Operasyonel açıktan birincil açığa inerken yalnız reel faiz çıkarılır; nominal faiz yalnızca son adımda, birincil açığa eklenerek nominal açık bulunur.","ayirt":"Çıkardığım faiz reel mi, nominal mi?","paragraf":"Öğreti notu - Operasyonel Açık formülü","yanilgi":"Birincil açığı bulurken operasyonel açıktan nominal faizi düşülmesi gerektiğini sanıyorsun."},"A":{"gercek":"Operasyonel açık, nominal açıktan yalnızca faizin enflasyon telafisi kısmının çıkarılmasıyla bulunan ARA bir ölçüdür; nominal açığın kendisi değildir.","ayirt":"Bu açık, faizin TAMAMINI mı yoksa yalnız reel kısmını mı içeriyor?","paragraf":"Öğreti notu - Operasyonel Açık tanımı","yanilgi":"Operasyonel açığın zaten nominal açığa eşit ya da onun yerine geçebilecek bir ölçü olduğunu sanıyorsun."},"D":{"gercek":"Konjonktürel açık, yapısal açıkla birlikte açığın NEDENİNE göre yapılan ayrı bir sınıflandırmadır; nominal/operasyonel açık hesaplamasına girmez.","ayirt":"Bu veri, faiz-enflasyon ilişkisiyle mi yoksa konjonktürle mi ilgili?","paragraf":"Öğreti notu - Konjonktürel açık tanımı","yanilgi":"Konjonktürel açığın da toplam bütçe açığının bir bileşeni olduğunu ve dolayısıyla nominal açığa eklenmesi gerektiğini düşünüyorsun."},"B":{"gercek":"Reel faiz, nominal faizden enflasyon telafisinin çıkarılmasıyla bulunur; soruda reel faiz ayrıca verildiğinden bu iki tutar birbirine karıştırılmaz.","ayirt":"Elimdeki 30 mü reel faiz, yoksa enflasyon telafisi mi?","paragraf":"Öğreti notu - Reel faiz tanımı","yanilgi":"Enflasyon telafisi tutarını reel faiz zannedip birincil açığı ondan hesaplıyorsun."}},"verilen":[[6,0],[6,1],[7,0],[7,1],[1,1],[2,1],[3,1],[4,1]],"donem":2,"hesaplar":{"100":{"ad":"Kasa","tanim":"Bu hesap, işletmenin elinde bulunan ulusal ve yabancı paraların TL. karşılığının izlenmesi için kullanılır. İşleyişi : Tahsil olunan para tutarları borç, ödemeler ve bankaya yatırılan para tutarları alacak kaydedilir. Hesap daima borç bakiyesi verir veya sıfır olur. Hiçbir şekilde alacak bakiyesi vermez."},"150":{"ad":"İLK MADDE VE MALZEME","tanim":"Üretimde veya diğer faaliyetlerde kullanılmak üzere işletmede bulundurulan hammadde, yardımcı madde, işletme malzemesi, ambalaj malzemesi ve diğer malzemelerin izlendiği hesaptır."},"135":{"ad":"PERSONELDEN ALACAKLAR","tanim":"İşletmeye dahil personel ve işçinin işletmeye olan çeşitli borçlarını kapsar. İşleyişi: Bu hesaba, alacağın doğması halinde borç, tahsili halinde ise alacak kaydedilir."},"120":{"ad":"Alıcılar","tanim":"Bu hesap, işletmenin faaliyet konusunu oluşturan mal ve hizmet satışlarından kaynaklanan senetsiz alacaklarının izlenmesi için kullanılır. İşleyişi : Senetsiz alacağın doğması ile bu hesaba borç, tahsil edilmesi halinde (ödemeler, aktarmalar ve hesaben mahsuplar dahil) alacak kaydedilir."}}},{"capa":{"kaynak":"SGS 2024/3 Soru 96"},"kural":"Etkinlik, artan oranlı vergi tarifesinin derecesine ve kamu harcamalarının/kamu kesiminin büyüklüğüne bağlıdır; düz oranlı sistemde ve küçük kamu kesiminde etki zayıflar.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 96","sonDonem":0,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\u0027Her zaman doğrudur\u0027 kökünde tek bir koşula bağlı ifadeleri değil, kaynaktaki İKİ unsuru (tarife derecesi + kamu büyüklüğü) birlikte taşıyan şıkkı ara.","konu":"otomatik istikrarlandırıcı","tablo":{"satirlar":[["A) Otomatik istikrarlandırıcılar konjonktürle aynı yönde ha…","Öğreti notu - Otomatik istikrarlandırıcılar","YANLIŞ ifade"],["B) Etkinlik derecesi, gelir vergisi tarifesinin artan oranl…","Öğreti notu - Otomatik istikrarlandırıcılar","doğru ifade"],["C) İradi politikadan farkı, tanıma ve karar gecikmesini taş…","Öğreti notu - Otomatik istikrarlandırıcılar","YANLIŞ ifade"],["D) Ekonomik daralma döneminde devreye girebilmesi için ayrı…","Öğreti notu - Otomatik istikrarlandırıcılar","YANLIŞ ifade"],["E) Dalgalanmayı tamamen ortadan kaldırarak konjonktürel ist…","Öğreti notu - Otomatik istikrarlandırıcılar","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"İradi politikadan farkı, tanıma ve karar gecikmesini taşımamakla birlikte uygulama gecikmesine sahip olmasıdır.","E":"Dalgalanmayı tamamen ortadan kaldırarak konjonktürel istikrarı kesin biçimde sağlar.","A":"Otomatik istikrarlandırıcılar konjonktürle aynı yönde hareket ederek ekonomik dalgalanmayı pekiştirir.","D":"Ekonomik daralma döneminde devreye girebilmesi için ayrı bir yasal düzenleme veya karar alınması gerekir.","B":"Etkinlik derecesi, gelir vergisi tarifesinin artan oranlılık derecesine ve kamu kesiminin büyüklüğüne bağlı olarak değişir."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Otomatik istikrarlandiricilar","metin":"TEORİ (maliye, mevzuat maddesi yok). TANIM: ekonomik dalgalanmaları, AYRICA BİR KARAR VEYA YASA GEREKMEKSİZİN, KENDİLİĞİNDEN yumuşatan bütçe unsurlarıdır. BASLICALARI: (1) ARTAN ORANLI GELİR VERGİSİ - genişleme döneminde gelirler artınca mükellefler üst dilimlere geçer, vergi hasılatı gelirden HIZLI artar ve talep frenlenir; daralmada tersi olur. (2) İŞSİZLİK SİGORTASI VE SOSYAL YARDIMLAR - işsizlik artınca ödemeler otomatik artar, harcanabilir gelir desteklenir. (3) KURUMLAR VERGİSİ - kâr dalgalanmasiyla birlikte hareket eder. (4) TARIMSAL DESTEKLEME (fiyat desteği) - fiyat düşüşünde otomatik devreye girer. ÖZELLİKLERİ: GECİKME YOKTUR (tanıma, karar ve uygulama gecikmesi bulunmaz) - iradi (discretionary) politikanın en büyük zayıflığı olan gecikmeleri ortadan kaldırır. Etkisi SINIRLIDIR; dalgalanmayı ÖNLEMEZ, YUMUŞATIR. İRADİ POLİTİKADAN FARKI: iradi politika yeni bir karar/yasa gerektirir (vergi oranı değişikliği, yeni harcama programı) ve gecikmelidir; otomatik istikrarlandırıcı mevcut sistemin içine gomulmustur. SINAV TUZAĞI: otomatik istikrarlandırıcılar KONJONKTÜRE TERS (kontra-sıklık) çalışır. Ayrıca ETKİNLİĞİ ARTAN ORANLILIĞIN DERECESİNE bağlıdır - düz oranlı (tek oranlı) vergi sisteminde istikrarlandırıcı etki ZAYIFLAR. Kamu harcamalarının büyüklüğü de etkiyi artırır; küçük kamu kesimi olan ekonomilerde otomatik istikrar zayıftır."}],"hakem":"Soru otomatik istikrarlandırıcıların etkinliğini belirleyen unsurları soruyor; B seçeneği artan oranlılık ve kamu kesimi büyüklüğünü birlikte değerlendirerek her zaman doğru bir ilişki kuruyor; kaynak metinde bu iki unsur açıkça etkinliği belirleyen faktörler olarak tanımlanmıştır."},"kayitlar":[],"sade":{"siklar":{"C":"Tanıma ve karar gecikmesi olmasa da uygulama gecikmesi var diye düşünülür ama yanlıştır; sistem sisteme gömülü olduğundan üç gecikme de yoktur. İradi politikayla karıştırılırsa bu tuzağa düşülür.","E":"Dalgalanmayı tamamen ortadan kaldırmaz, sadece yumuşatır; etkisi sınırlıdır. Etkinlik mükemmel olmadığı halde mutlak başarı iddia edilirse hata olur.","D":"Otomatik istikrarlandırıcı tanımı gereği kendiliğinden devreye girer, ayrı karar veya yasa beklemez. İradi politikaya özgü olan karar alma gerekliliği bunu hasır diye sunmak yanılgı yaratır.","A":"Otomatik istikrarlandırıcılar ekonomide daralma olunca vergi geliri azalıp harcamalar artarak talep destekler; yani dalgalanmaya karşı çalışır, onu pekiştirmez. Sık öğrenci bu mekanizmayı ters anlayıp elenir."},"dogru":"Otomatik istikrarlandırıcılar ne kadar artan oranlı vergi kullanırsa ve kamu kesimi ne kadar büyükse o kadar güçlü çalışır. Her iki unsur birlikte etkinliği belirler, bu yüzden B şıkkı her zaman doğrudur.","sinav":"Otomatik istikrarlandırıcılar gelir vergisinin artan oranlılık derecesi ile kamu kesiminin büyüklüğüne bağlı olarak etkinlik gösterir.","kavramlar":[{"kaynak":"TEORI","tanim":"Ekonomik dalgalanmaları ayrıca bir karar veya yasa gerekmeksizin kendiliğinden yumuşatan bütçe unsurlarıdır; tanıma, karar ve uygulama gecikmesi yoktur.","ad":"Otomatik istikrarlandırıcı"},{"kaynak":"TEORI","tanim":"Genişleme döneminde gelirler artınca mükelleflerin üst vergi dilimlerine geçmesiyle vergi hasılatı gelirden hızlı artar; bu da talep frenlenir ve dalgalanma yumuşatılır.","ad":"Artan oranlı gelir vergisi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[],"donemler":["2021/1","2019/2"]},"oyun":null,"tip":"teori","soru":"Otomatik istikrarlandırıcıların iradi politikadan farkı ve etkinliğini belirleyen unsurlar birlikte değerlendirildiğinde, aşağıdaki ifadelerden hangisi HER ZAMAN doğrudur?","kayitBaslik":"","id":"sgs-a6-maliye-cokzor-r1/kp-07","verilenler":[],"dayanak":"Maliye - Öğreti notu (Otomatik istikrarlandırıcılar); mevzuat maddesi yoktur, teorik kavram.","dogru":"B","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Bir ülkede 2022\u0027de ekonomi hızla büyüyor, gelirler artıyor, artan oranlı gelir vergisi tarifesinde çalışanlar üst dilimlere kayıyor, vergi hasılatı gelirden daha hızlı artıyor.","anlatim":"Kimse meclise gitmedi, kimse yeni bir kanun çıkarmadı. Vergi tarifesi zaten oradaydı, gelir artınca kendisi devreye girdi. Bu, otomatik istikrarlandırıcının canlı örneği.","doldur":[]},{"formul":"Ne yapacağız: bu olayda beş ifadeyi tek tek test edeceğiz; hangisi HER ZAMAN doğru kalıyor bakacağız.","anlatim":"Otomatik istikrarlandırıcı kendiliğinden, gecikmesiz ve konjonktüre ters çalışır ama etkisi sınırlıdır ve tarife derecesine, kamu büyüklüğüne bağlıdır. Şimdi A\u0027dan E\u0027ye bu olayda beş ifadeyi tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Öğreti notu - Otomatik istikrarlandırıcılar","karar":"yanlış","anlatim":"Hayır, tam tersi: ekonomi büyürken vergiyi artırıp talebi soğutuyor, yani konjonktüre ters çalışıyor. Aynı yönde hareket etseydi dalgalanmayı pekiştirirdi ama böyle değil.","formul":"Şık A: büyüme döneminde vergi hasılatı artıp talebi frenlerken, bu mekanizma ekonomiyle aynı yönde mi hareket ediyor dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Öğreti notu - Otomatik istikrarlandırıcılar","karar":"doğru","anlatim":"Evet, düz oranlı sistemde ve küçük kamu kesiminde istikrarlandırıcı etki zayıflar; demek ki etkinlik bu iki unsura bağlı. Bu bağımlılık her durumda geçerli olduğu için ifade her zaman doğru.","formul":"Şık B: bu ülke tarifeyi düz oranlıya çevirse ya da kamu kesimini küçültse, etkinlik değişir mi?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Öğreti notu - Otomatik istikrarlandırıcılar","karar":"yanlış","anlatim":"Hayır, uygulama gecikmesi de yok; tarife sisteme gömülü, gelir artınca kendisi işliyor. Üç gecikmenin hepsi ortadan kalkmış, sadece ikisi değil.","formul":"Şık C: bu vergi tarifesi devreye girerken tanıma ve karar gecikmesi yok diyorsun ama uygulamada hâlâ bir bekleme mi var?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Öğreti notu - Otomatik istikrarlandırıcılar","karar":"yanlış","anlatim":"Hayır, tanım gereği ayrıca karar veya yasa gerekmeden kendiliğinden işler. Yeni yasa gerektiren şey iradi politikadır, otomatik istikrarlandırıcı değil.","formul":"Şık D: daralma başladığında bu tarifenin devreye girmesi için meclisin yeni bir yasa çıkarması gerekir mi?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Öğreti notu - Otomatik istikrarlandırıcılar","karar":"yanlış","anlatim":"Hayır, sadece yumuşatıyor, dalgalanmayı önlemiyor. Etkisi sınırlı, kesin istikrar sağlamıyor.","formul":"Şık E: vergi hasılatındaki bu otomatik artış, ekonomideki dalgalanmayı tamamen sıfırlıyor mu?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Bu olayda tek her zaman doğru kalan şey, etkinliğin tarife derecesine ve kamu büyüklüğüne bağlı olması. Kendine sor: bu ifade tarife düz oranlı olsa da, kamu küçük olsa da hâlâ geçerli mi?","doldur":[]}],"anahtar":[{"ornek":"istikrarlandırıcılar","kok":"istikr"},{"ornek":"tarifesinin","kok":"tarife"},{"ornek":"oranlılığın","kok":"oranlı"},{"ornek":"gecikmesiz","kok":"gecikm"},{"ornek":"büyüklüğüne","kok":"büyükl"},{"ornek":"kesiminin","kok":"kesimi"}],"konuGiris":null,"olay":"","tuzak":{"C":{"ad":"Kısmi Gecikme Tuzağı","metin":"Öğrenci sadece tanıma ve karar gecikmesinin olmadığını hatırlar, uygulama gecikmesinin de bulunmadığını atlar. Doğrusu: Otomatik istikrarlandırıcılarda tanıma, karar VE uygulama gecikmesinin hiçbiri yoktur, mekanizma sisteme gömülüdür."},"E":{"ad":"Mutlak Önleme Tuzağı","metin":"Öğrenci yumuşatma etkisini dalgalanmanın tamamen ortadan kalkması olarak yorumlar. Doğrusu: Etkisi sınırlıdır; dalgalanmayı önlemez, sadece yumuşatır."},"D":{"ad":"İrade Karışıklığı Tuzağı","metin":"Öğrenci otomatik istikrarlandırıcıyı iradi politikayla karıştırıp yeni bir kararın gerektiğini düşünür. Doğrusu: Tanımı itibarıyla kendiliğinden, herhangi bir karar veya yasa gerekmeksizin devreye girer."},"A":{"ad":"Ters Yön Tuzağı","metin":"Öğrenci istikrarlandırıcının konjonktürle birlikte büyüdüğünü, yani onu güçlendirdiğini düşünür. Doğrusu: Otomatik istikrarlandırıcılar konjonktüre TERS (kontra-sıklık) çalışır, dalgalanmayı büyütmez frenler."}},"celdiriciYol":{"C":"Sadece tanıma ve karar gecikmesinin yokluğu genellenip uygulama gecikmesi unutulmuş = eksik gecikme kuralı (katman atlama)","E":"Yumuşatma etkisi mutlak önleme olarak genellenmiş = sınırlı etki kuralının abartılması (mutlaklaştırma hatası)","D":"Otomatik mekanizma iradi politika ile karıştırılmış = karar/yasa gerektirmeme kuralının ters okunması (irade karışıklığı)","A":"Konjonktürle aynı yönde hareket ettiği varsayımı = kontra-sıklık kuralının ters okunması (yön hatası)"},"hap":"Otomatik istikrarlandırıcılar, karar/yasa gerektirmeksizin kendiliğinden ve gecikmesiz çalışır; konjonktüre ters yönde hareket eder ve etkisi artan oranlılığın derecesiyle kamu kesiminin büyüklüğüne bağlı olarak sınırlıdır.","teshis":{"C":{"gercek":"Otomatik istikrarlandırıcı sisteme gömülü olduğu için tanıma, karar ve uygulama gecikmesinin üçü de yoktur.","ayirt":"Devreye girmesi için herhangi bir aşamada insan kararı bekleniyor mu?","paragraf":"Öğreti notu - Otomatik istikrarlandırıcılar","yanilgi":"Gecikmesizliğin sadece tanıma ve karar aşamasına ait olduğunu, uygulamada hâlâ gecikme kaldığını sanıyorsun."},"E":{"gercek":"Etkisi sınırlıdır, dalgalanmayı önlemez, sadece şiddetini yumuşatır.","ayirt":"Bu mekanizma dalgalanmayı yok mu ediyor, yoksa sadece frenliyor mu?","paragraf":"Öğreti notu - Otomatik istikrarlandırıcılar","yanilgi":"Yumuşatma etkisini dalgalanmanın sıfırlanması, yani tam istikrar sağlanması olarak okuyorsun."},"A":{"gercek":"Otomatik istikrarlandırıcılar konjonktüre ters (kontra-sıklık) çalışır; genişlemede vergiyi artırıp talebi frenler, daralmada tersini yapar.","ayirt":"Bu unsur ekonomiyle aynı yönde mi, tersi yönde mi hareket ediyor?","paragraf":"Öğreti notu - Otomatik istikrarlandırıcılar","yanilgi":"Otomatik mekanizmanın konjonktürle aynı yönde büyüyerek etkiyi artırdığını sanıyorsun."},"D":{"gercek":"Tanım gereği ayrıca bir karar veya yasa gerekmeksizin kendiliğinden devreye girer; yeni karar gerektiren iradi politikadır.","ayirt":"Bu mekanizmanın çalışması için meclisten ya da hükümetten yeni bir işlem gerekiyor mu?","paragraf":"Öğreti notu - Otomatik istikrarlandırıcılar","yanilgi":"Otomatik istikrarlandırıcı ile iradi politikayı aynı kefeye koyup daralmada yeni bir kanun gerektiğini düşünüyorsun."},"B":{"gercek":"Etkinlik artan oranlılığın derecesine ve kamu harcamalarının büyüklüğüne bağlıdır; düz oranlı sistemde ve küçük kamu kesiminde etki zayıflar.","ayirt":"Bu ifade tarife yapısı ve kamu büyüklüğü değişse de her zaman geçerli mi?","paragraf":"Öğreti notu - Otomatik istikrarlandırıcılar","yanilgi":"Bu şıkkı eleyen öğrenci, etkinliğin sabit olduğunu, tarife yapısından ve kamu büyüklüğünden bağımsız sandığını düşünüyor."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 97"},"kural":"parafiskal gelirler karşılıklıdır ve devletin genel bütçesine değil ilgili kamu kurumunun kendi bütçesine girer; karşılıksızlık ve genel bütçeye girme özellikleri vergiye aittir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 97","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıkta \u0027karşılıksız\u0027 veya \u0027genel bütçe\u0027 kelimesini görürsen önce bunun vergi tanımından sızıp sızmadığını kontrol et.","konu":"parafiskal gelir","tablo":{"satirlar":[["A) Parafiskal gelirler, ilgili gruba dahil olanlardan kanun…","TEORİ - Parafiskal Gelirler","doğru ifade"],["B) Ödeyen kişi, karşılığında ilgili kurumun sunduğu hizmett…","TEORİ - Parafiskal Gelirler","doğru ifade"],["C) Toplanan tutarlar devlet bütçesine değil, ilgili kamu ku…","TEORİ - Parafiskal Gelirler","doğru ifade"],["D) Toplumun tamamından değil, yalnızca belirli bir meslek v…","TEORİ - Parafiskal Gelirler","doğru ifade"],["E) Vergi gibi karşılıksızdır ve devletin genel bütçesine ge…","TEORİ - Parafiskal Gelirler","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Toplanan tutarlar devlet bütçesine değil, ilgili kamu kurumu niteliğindeki kuruluşun kendi bütçesine gelir kaydedilir.","E":"Vergi gibi karşılıksızdır ve devletin genel bütçesine gelir olarak yazılır.","A":"Parafiskal gelirler, ilgili gruba dahil olanlardan kanunla veya kanunun verdiği yetkiyle zorunlu olarak toplanır.","D":"Toplumun tamamından değil, yalnızca belirli bir meslek veya sigorta grubuna dahil olanlardan alınır.","B":"Ödeyen kişi, karşılığında ilgili kurumun sunduğu hizmetten yararlanır; bu yönüyle vergiden ayrılır."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Parafiskal gelirler","metin":"TEORİ (maliye, mevzuat maddesi yok). TANIM: parafiskal gelirler, kamu kurumu niteliğindeki MESLEK KURULUŞLARI ile SOSYAL GÜVENLİK KURUMLARININ, sundukları hizmetlerin finansmanı için İLGİLİLERDEN zorunlu olarak topladığı gelirlerdir. ÖRNEKLER: sosyal güvenlik primleri, ticaret/sanayi odası aidatlari, baro aidatlari, TÜRMOB-SMMM odası aidatlari. BEŞ ÖZELLİK: (1) ZORUNLUDUR - ilgili gruba dahil olan ödemek zorundadır, (2) KARŞILIĞI VARDIR - ödeyen kişi kurumun hizmetinden yararlanır (vergiden ayrıldığı en önemli nokta), (3) DEVLET BÜTÇESİNE GİRMEZ - ilgili kurumun kendi bütçesine gelir yazılır, (4) BELİRLİ BİR GRUPTAN toplanır, toplumun tamamından değil, (5) KANUNLA veya kanunun verdiği yetkiye dayanılarak konulur. VERGİDEN FARKI: vergi KARŞILIKSIZDIR ve GENEL BÜTÇEYE girer; parafiskal gelir KARŞILIKLIDIR ve ÖZEL BÜTÇEYE/kurum bütçesine girer. HARÇ VE RESİMDEN FARKI: harç ve resim de karşılıklıdır ama DEVLET BÜTÇESİNE girer ve devlet tarafından toplanır; parafiskal geliri toplayan devlet değil, KAMU KURUMU NİTELİĞİNDEKİ KURULUŞTUR. SINAV TUZAĞI: \u0027karşılıksızdır\u0027 seçeneği parafiskal gelir için YANLIŞTIR - karşılıksızlık verginin özelliğidir. \u0027Genel bütçeye dahildir\u0027 seçeneği de yanlıştır."},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [1/3]","metin":"Madde 3- Münhasıran bu Kanunun uygulanmasında; a) Genel yönetim kapsamındaki kamu idareleri: Uluslararası sınıflandırmalara göre belirlenmiş olan, merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri, b) Merkezî yönetim kapsamındaki kamu idareleri: Bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerini, c) Düzenleyici ve denetleyici kurumlar: Bu Kanuna ekli (III) sayılı cetvelde yer alan kurumları, 22/12/2005 tarihli ve 5436 sayılı Kanunun 10 uncu maddesiyle, bu fıkraya \"25\" ibaresinden sonra gelmek üzere, \"42\" ibaresi; \"43\" ibaresinden sonra gelmek üzere, \"44\" ibaresi ve \"76\" ibaresinden sonra gelmek üzere, \"78\" ibaresi eklenmiştir. 1 d) Sosyal güvenlik kurumları: Bu Kanuna ekli (IV) sayılı cetvelde yer alan kamu kurumlarını, e) Mahallî idare: Yetkileri belirli bir coğrafi alan ve hizmetlerle sınırlı olarak kamusal faaliyet gösteren belediye, il özel idaresi ile bunlara bağlı veya bunların kurdukları veya üye oldukları birlik ve idareleri,2 f) Bütçe: Belirli bir dönemdeki gelir ve gider tahminleri ile bunların uygulanmasına ilişkin hususları gösteren ve usulüne uygun olarak yürürlüğe konulan belgeyi, g) Kamu kaynakları: Borçlanma suretiyle elde edilen imkânlar dahil kamuya ait gelirler, taşınır ve taşınmazlar, hesaplarda bulunan para, alacak ve haklar ile her türlü değerleri, h) Kamu gideri: Kanunlarına veya Cumhurbaşkanlığı kararnamelerine dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, sosyal güvenlik katkı payları, iç ve dış borç faizleri, borçlanma genel giderleri, borçlanma araçlarının iskontolu…"}],"hakem":"Soru parafiskal gelirler konusunu ölçmektedir; dogru sik (E), parafiskal gelirin vergiden ayrılan temel özelliklerini (karşılıklılık ve özel bütçeye girme) doğru şekilde ortaya koyarak yanlış ifadeyi tanımlamakta; tüm kapılar açıktır."},"kayitlar":[],"sade":{"siklar":{"C":"Parafiskal gelirler devlet bütçesine değil ilgili meslek veya sigorta kurumunun kendi bütçesine gelir olarak kaydedilir, ifade doğrudur.","E":"Bu ifade yanlıştır çünkü parafiskal gelirler karşılıksız değil karşılıklıdır ve devletin genel bütçesine değil ilgili kurumun kendi bütçesine girer; bu özellikler vergiye aittir.","A":"Zorunlu olma parafiskal gelirlerin de bir özelliğidir. Metinde belirtildiği üzere parafiskal gelirler kanunla veya kanunun verdiği yetkiyle ilgili gruptan zorunlu olarak toplanır, ifade doğrudur.","D":"Parafiskal gelirler yalnız ilgili meslek grubuna veya sigorta grubuna dahil olanlardan toplanır, toplumun tamamından alınmaz; ifade doğrudur.","B":"Parafiskal gelirin vergiden ayrıldığı temel nokta tam da karşılıklı olmasıdır. Ödeyen kişi karşılığında kurumun hizmetinden yararlandığı için bu ifade doğrudur."},"dogru":"E şıkkı yanlıştır. Parafiskal gelirler karşılıklıdır (ödeyen kişi hizmetten yararlanır) ve devletin genel bütçesine değil ilgili kurumun kendi bütçesine girer. Karşılıksızlık ve genel bütçeye girme özellikleri vergiye aittir.","sinav":"Parafiskal gelirler Kamu Malî Yönetimi Kanunu 5018 madde 3 tanımına göre karşılıklı gelirlerdir ve ilgili kamu kurumunun kendi bütçesine girer; karşılıksızlık ve devlet genel bütçesine girme özellikleri vergilere aittir.","kavramlar":[{"kaynak":"TEORI","tanim":"Kamu kurumu niteliğindeki meslek kuruluşları ile sosyal güvenlik kurumlarının sundukları hizmetlerin finansmanı için ilgililerden zorunlu olarak topladığı, karşılıklı ve ilgili kurumun kendi bütçesine giren gelirdir.","ad":"Parafiskal gelir"},{"kaynak":"TEORI","tanim":"Parafiskal gelir ödeyenin karşılığında ilgili kamu kurumunun sunduğu hizmetten yararlanması; bu özellik parafiskal geliri vergiden ayıran en önemli noktadır.","ad":"Karşılıklılık"},{"kaynak":"TEORI","tanim":"Kamu kurumu niteliğinde olup parafiskal gelir toplayarak sosyal güvenlik hizmeti sunan kurulardır.","ad":"Sosyal güvenlik kurumu"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[{"yil":"2026/1","alinti":"Aşağıdakilerden hangisi bir parafiskal kamu geliridir?"},{"yil":"2024/3","alinti":"Yukarıdakilerden hangisi/hangileri parafiskal bir kamu geliri değildir?"}],"donemler":["2026/1","2024/3"]},"oyun":null,"tip":"teori","soru":"Parafiskal gelirler; kamu kurumu niteliğindeki meslek kuruluşları ile sosyal güvenlik kurumlarının sundukları hizmetin finansmanı için ilgililerden topladığı gelirlerdir. Buna göre parafiskal gelirlerle ilgili aşağıdaki ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-genel-maliye-zor/kp-03","verilenler":[],"dayanak":"TEORİ - Parafiskal Gelirler (öğreti notu)","dogru":"E","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: TÜRMOB\u0027a bağlı bir SMMM odası, üyesi olan 900 mali müşavirden 2024 yılında kişi başı 3.000 lira aidat topladı; bu para hemen odanın kendi banka hesabına yattı, devlet bütçesine tek kuruş gönderilmedi.","anlatim":"Bu aidat parafiskal gelirin klasik örneği. Aynı 900 kişi ve 3.000 liralık aidat üzerinden beş ifadeyi tek tek süzeceğiz.","doldur":[]},{"formul":"Ne yapacağız: 900 üye, kişi başı 3.000 lira, toplam 2.700.000 lira odanın kendi bütçesine girdi; şimdi beş ifadeyi bu rakamlar üzerinden deneyeceğiz.","anlatim":"Parafiskal gelir zorunlu, karşılıklı, kendi bütçesine giren, belirli gruptan alınan, kanuna dayanan bir gelir türü. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TEORİ - Parafiskal Gelirler","karar":"doğru","anlatim":"Oda üyesi olan herkes bu 3.000 lirayı ödemek zorunda, kanunun verdiği yetkiyle konulmuş bir zorunluluk bu. Toplumun geneline değil, sadece bu meslek grubuna uygulanan mecburi bir kesinti.","formul":"Şık A: müdür \u0027bu 900 mali müşavir aidatı ödemek zorunda mı, yoksa isteyen öder mi?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TEORİ - Parafiskal Gelirler","karar":"doğru","anlatim":"Evet, üye bu parayı öderken odanın mesleki denetim, belge onayı gibi hizmetlerinden yararlanıyor. Bu karşılıklılık parafiskal geliri vergiden ayıran en kritik nokta.","formul":"Şık B: müdür \u0027900 üye bu 3.000 lirayı öderken karşılığında bir şey alıyor mu?\u0027 diye soruyor, karşılıklı mı bu ödeme?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TEORİ - Parafiskal Gelirler","karar":"doğru","anlatim":"Bu para direkt odanın kendi bütçesine gelir yazıldı, devlet hazinesine bir kuruş girmedi. Parafiskal geliri toplayan kurum devlet değil, kamu kurumu niteliğindeki oda.","formul":"Şık C: müdür \u00272.700.000 lira devlet bütçesine mi gitti, yoksa odanın kendi hesabına mı?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TEORİ - Parafiskal Gelirler","karar":"doğru","anlatim":"Sadece bu 900 kişilik mali müşavir grubundan topladık, toplumun tamamı bu aidatla hiç ilgilenmedi. Parafiskal gelir belirli bir mesleğe veya sigorta grubuna özgüdür.","formul":"Şık D: müdür \u0027bu aidatı Türkiye\u0027deki herkesten mi topladık, yoksa sadece mali müşavirlerden mi?\u0027 diye soruyor."},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TEORİ - Parafiskal Gelirler","karar":"yanlış","anlatim":"Hayır, bu para karşılıklıydı ve odanın kendi bütçesine yazıldı, genel bütçeye hiç girmedi. Karşılıksızlık ve genel bütçeye girme vergiye ait özellikler, parafiskal gelire uymuyor.","formul":"Şık E: müdür \u0027bu 2.700.000 lira karşılıksız mı alındı ve genel bütçeye mi yazıldı?\u0027 diye soruyor, katılır mısın?"}],"anahtar":[{"ornek":"karşılıklıdır","kok":"karşıl"},{"ornek":"parafiskal","kok":"parafi"},{"ornek":"bütçesine","kok":"bütçes"},{"ornek":"bütçeye","kok":"bütçey"},{"ornek":"kurumunun","kok":"kurumu"},{"ornek":"gelirin","kok":"geliri"}],"konuGiris":{"harita":"Ne test edilir: parafiskal gelirin vergiden ve harç/resimden ayırt edici özellikleri sorulur. Nasıl ölçülür: beş temel özellik (zorunluluk, karşılıklılık, bütçeye girmeme, belirli grup, kanuni dayanak) üzerinden doğru-yanlış ayrımı yapılır. Nasıl kaydedilir: hangi kurumun bütçesine girdiği ve kimin topladığı bilgisiyle sınıflandırılır.","desen":"Soru genelde parafiskal gelirin tanımını verip \u0027yanlış olanı\u0027 seçtirir; tuzak seçenek genellikle \u0027karşılıksızdır\u0027 ya da \u0027genel bütçeye girer\u0027 ifadesidir. Bu iki özellik aslında vergiye ait olduğu için parafiskal gelire yanlış atfedilmiş olur. Bu soru, parafiskal gelirin vergiden ayrıldığı karşılıklılık ve bütçe noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"meslek kuruluşları ve sosyal güvenlik kurumlarının hizmet için topladığı zorunlu gelir","ad":"Parafiskal gelir","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"ödeyenin karşılığında ilgili kurumun hizmetinden yararlanması durumu","ad":"Karşılıklılık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"karşılıksız ve genel bütçeye giren zorunlu kamu geliri","ad":"Vergi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"karşılıklı ama devlet tarafından toplanıp devlet bütçesine giren gelir","ad":"Harç ve resim","kim":"kanun sabitler"}],"sinavda":"Parafiskal gelirin tanımı verilir ve bu tanıma uymayan yanlış ifadenin seçilmesi istenir.","panel_ornek":"Apartmanınızda oturanlar, asansör bakımı için her ay 50 lira aidat öder ve bu para doğrudan apartman yönetimine gider, belediyeye değil. Ödemeyen komşu bu bakım hizmetinden de yararlanamaz. Bu aidat, tıpkı parafiskal gelir gibi belirli bir gruptan toplanır ve karşılığında hizmet sunulur.","ornek":"Apartmanınızda oturanlar, asansör bakımı için her ay 50 lira aidat öder ve bu para doğrudan apartman yönetimine gider, belediyeye değil. Ödemeyen komşu bu bakım hizmetinden de yararlanamaz. Bu aidat, tıpkı parafiskal gelir gibi belirli bir gruptan toplanır ve karşılığında hizmet sunulur.","yontemler":"Vergi ile parafiskal geliri karıştırmamak için \u0027karşılıksız mı karşılıklı mı, genel bütçeye mi kurum bütçesine mi\u0027 sorusunu sor. En kritik kural: parafiskal gelir devlet tarafından değil, ilgili kamu kurumu niteliğindeki kuruluş tarafından toplanır.","nedir":"Parafiskal gelir, meslek kuruluşları ile sosyal güvenlik kurumlarının hizmet finansmanı için ilgililerden zorunlu topladığı geliri anlatır. Sınav bu gelirin vergiden ve harçtan farkını ayırt etmeni ölçer."},"olay":"","tuzak":{"C":{"ad":"Bütçe Tuzağı","metin":"Kamu kurumunun kendi bütçesini devlet bütçesiyle aynı sanırsın. Doğrusu: bu gelirler ilgili meslek veya sigorta kurumunun kendi bütçesine girer, ifade doğrudur."},"A":{"ad":"Zorunluluk Tuzağı","metin":"Zorunlu olmasını yalnız vergiye özgü sanıp bu ifadeyi yanlış işaretlersin. Doğrusu: parafiskal gelirler de kanunla ilgili gruptan zorunlu olarak toplanır, ifade doğrudur."},"D":{"ad":"Kapsam Tuzağı","metin":"Belirli gruptan toplanmasını toplumun tamamına yayıldığı şeklinde okursun. Doğrusu: parafiskal gelir yalnız ilgili gruptan alınır, ifade doğrudur."},"B":{"ad":"Karşılık Tuzağı","metin":"Hizmetten yararlanma şartını yalnız harç-resme özgü sanırsın. Doğrusu: parafiskal gelirin vergiden ayrıldığı temel nokta tam da bu karşılıklı olma özelliğidir, ifade doğrudur."}},"celdiriciYol":{},"hap":"Parafiskal gelir karşılıklıdır ve kendi kurumunun bütçesine girer; karşılıksızlık ile genel bütçeye girme vergiye özgüdür.","teshis":{"C":{"gercek":"Parafiskal gelir, devlet bütçesine değil ilgili kamu kurumu niteliğindeki kuruluşun kendi bütçesine gelir yazılır.","ayirt":"Bu para genel bütçeye mi giriyor, yoksa kurumun kendi kasasına mı?","paragraf":"TEORİ - Parafiskal Gelirler","yanilgi":"Kamu kurumu bütçesini devlet bütçesiyle özdeşleştirip bu doğru ifadeyi yanlış sanırsın."},"E":{"gercek":"Karşılıksızlık ve genel bütçeye girme vergiye özgüdür; parafiskal gelir karşılıklıdır ve kendi kurum bütçesine girer.","ayirt":"Bu tanım vergiye mi ait, yoksa parafiskal gelire mi?","paragraf":"TEORİ - Parafiskal Gelirler","yanilgi":"Karşılıksızlık ve genel bütçeye girme özelliklerini parafiskal gelire de uygulanır sanırsın."},"A":{"gercek":"Parafiskal gelirler ilgili gruba dahil olanlardan kanunla veya kanunun verdiği yetkiyle zorunlu olarak toplanır.","ayirt":"Bu ödeme bir gruba mecburi mi konulmuş, kanuna mı dayanıyor?","paragraf":"TEORİ - Parafiskal Gelirler","yanilgi":"Zorunlu ödeme deyince aklına hep vergi geliyor, parafiskal gelirin de zorunlu olabileceğini gözden kaçırıyorsun."},"D":{"gercek":"Parafiskal gelir toplumun tamamından değil, yalnızca ilgili meslek veya sigorta grubuna dahil olanlardan alınır.","ayirt":"Bu ödemeyi toplumun tamamı mı, yoksa belirli bir grup mu yapıyor?","paragraf":"TEORİ - Parafiskal Gelirler","yanilgi":"Belirli bir gruptan toplanmasını genel bir vergi gibi herkesten alındığı şeklinde yorumlarsın."},"B":{"gercek":"Parafiskal gelirde ödeyen kişi kurumun hizmetinden yararlanır; bu, vergiden ayrıldığı en önemli noktadır.","ayirt":"Ödediğim karşılığında somut bir hizmet alıyor muyum?","paragraf":"TEORİ - Parafiskal Gelirler","yanilgi":"Karşılıklılığı yalnız harç ve resme özgü sanıp bu doğru ifadeyi eleyebilirsin."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 97"},"kural":"parafiskal gelir kanunla konur, karşılıklıdır, belirli gruptan toplanır ve toplayan kurumun kendi bütçesine gelir yazılır; bu son özellik idarenin 5018 sayılı Kanundaki bütçe sınıflandırmasından bağımsızdır.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 97","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"5018 sayılı Kanundaki \u0027genel yönetim kapsamı\u0027 sınıflandırmasını, gelirin hangi bütçeye kaydedildiği sorusuyla karıştırma; bunlar iki ayrı katmandır.","konu":"parafiskal gelir","tablo":{"satirlar":[["A) Sosyal güvenlik kurumu genel yönetim kapsamında sayıldığ…","Teori - Parafiskal gelirler","YANLIŞ ifade"],["B) Primler karşılıksız olarak toplandığından, hukuki niteli…","Teori - Parafiskal gelirler","YANLIŞ ifade"],["C) Primler toplumun tamamından değil belirli bir gruptan to…","Teori - Parafiskal gelirler","YANLIŞ ifade"],["D) Primler devlet tarafından toplandığından, harç ve resiml…","Teori - Parafiskal gelirler","YANLIŞ ifade"],["E) Primler kanunla konulmuş olmakla birlikte, ilgili kamu k…","Teori - Parafiskal gelirler; 5018 s.K. m.3/a,d","doğru ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Primler toplumun tamamından değil belirli bir gruptan toplandığından, nitelik olarak harç ve resimle özdeştir.","E":"Primler kanunla konulmuş olmakla birlikte, ilgili kamu kurumunun kendi bütçesine gelir olarak kaydedilir ve devlet bütçesine dahil edilmez.","A":"Sosyal güvenlik kurumu genel yönetim kapsamında sayıldığından, toplanan primler devlet bütçesine gelir olarak kaydedilir.","D":"Primler devlet tarafından toplandığından, harç ve resimlerle aynı bütçeye dahil edilir.","B":"Primler karşılıksız olarak toplandığından, hukuki nitelik itibarıyla vergiyle aynı kategoridedir."},"kaynak":{"alinti":"DEVLET BUTCESINE GIRMEZ - ilgili kurumun kendi butcesine gelir yazilir","liste":[{"ad":"TEORI - Parafiskal gelirler","metin":"TEORİ (maliye, mevzuat maddesi yok). TANIM: parafiskal gelirler, kamu kurumu niteliğindeki MESLEK KURULUŞLARI ile SOSYAL GÜVENLİK KURUMLARININ, sundukları hizmetlerin finansmanı için İLGİLİLERDEN zorunlu olarak topladığı gelirlerdir. ÖRNEKLER: sosyal güvenlik primleri, ticaret/sanayi odası aidatlari, baro aidatlari, TÜRMOB-SMMM odası aidatlari. BEŞ ÖZELLİK: (1) ZORUNLUDUR - ilgili gruba dahil olan ödemek zorundadır, (2) KARŞILIĞI VARDIR - ödeyen kişi kurumun hizmetinden yararlanır (vergiden ayrıldığı en önemli nokta), (3) DEVLET BÜTÇESİNE GİRMEZ - ilgili kurumun kendi bütçesine gelir yazılır, (4) BELİRLİ BİR GRUPTAN toplanır, toplumun tamamından değil, (5) KANUNLA veya kanunun verdiği yetkiye dayanılarak konulur. VERGİDEN FARKI: vergi KARŞILIKSIZDIR ve GENEL BÜTÇEYE girer; parafiskal gelir KARŞILIKLIDIR ve ÖZEL BÜTÇEYE/kurum bütçesine girer. HARÇ VE RESİMDEN FARKI: harç ve resim de karşılıklıdır ama DEVLET BÜTÇESİNE girer ve devlet tarafından toplanır; parafiskal geliri toplayan devlet değil, KAMU KURUMU NİTELİĞİNDEKİ KURULUŞTUR. SINAV TUZAĞI: \u0027karşılıksızdır\u0027 seçeneği parafiskal gelir için YANLIŞTIR - karşılıksızlık verginin özelliğidir. \u0027Genel bütçeye dahildir\u0027 seçeneği de yanlıştır."},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [1/3]","metin":"Madde 3- Münhasıran bu Kanunun uygulanmasında; a) Genel yönetim kapsamındaki kamu idareleri: Uluslararası sınıflandırmalara göre belirlenmiş olan, merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri, b) Merkezî yönetim kapsamındaki kamu idareleri: Bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerini, c) Düzenleyici ve denetleyici kurumlar: Bu Kanuna ekli (III) sayılı cetvelde yer alan kurumları, 22/12/2005 tarihli ve 5436 sayılı Kanunun 10 uncu maddesiyle, bu fıkraya \"25\" ibaresinden sonra gelmek üzere, \"42\" ibaresi; \"43\" ibaresinden sonra gelmek üzere, \"44\" ibaresi ve \"76\" ibaresinden sonra gelmek üzere, \"78\" ibaresi eklenmiştir. 1 d) Sosyal güvenlik kurumları: Bu Kanuna ekli (IV) sayılı cetvelde yer alan kamu kurumlarını, e) Mahallî idare: Yetkileri belirli bir coğrafi alan ve hizmetlerle sınırlı olarak kamusal faaliyet gösteren belediye, il özel idaresi ile bunlara bağlı veya bunların kurdukları veya üye oldukları birlik ve idareleri,2 f) Bütçe: Belirli bir dönemdeki gelir ve gider tahminleri ile bunların uygulanmasına ilişkin hususları gösteren ve usulüne uygun olarak yürürlüğe konulan belgeyi, g) Kamu kaynakları: Borçlanma suretiyle elde edilen imkânlar dahil kamuya ait gelirler, taşınır ve taşınmazlar, hesaplarda bulunan para, alacak ve haklar ile her türlü değerleri, h) Kamu gideri: Kanunlarına veya Cumhurbaşkanlığı kararnamelerine dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, sosyal güvenlik katkı payları, iç ve dış borç faizleri, borçlanma genel giderleri, borçlanma araçlarının iskontolu…"}],"hakem":"Soru parafiskal gelirin tanımı ve özellikleri üzerinde doğru şekilde kurgulanmıştır; E seçeneği kaynak metindeki \u0027DEVLET BUTCESINE GIRMEZ - ilgili kurumun kendi butcesine gelir yazilir\u0027 kuralı ile tutarlıdır."},"kayitlar":[],"sade":{"siklar":{"C":"Belirli gruptan toplanmak hem parafiskal gelir hem harç/resim için geçerlidir; ayırıcı unsur toplayan kurum ve girdiği bütçedir.","A":"Genel yönetim kapsamına dahil olmak ile devlet bütçesine gelir kaydedilmek aynı şey değildir; parafiskal gelirler kurumun kendi bütçesine yazılır.","D":"Harç ve resmi devlet toplar devlet bütçesine girer; parafiskal geliri kamu kurumu toplar kendi bütçesine kaydeder.","B":"Parafiskal gelir tam da karşılıklı olması nedeniyle vergiden ayrılır; vergi karşılıksızdır."},"dogru":"Sosyal güvenlik primleri, kanunla konulmuş olsa da parafiskal gelir özelliği taşıdığından devlet bütçesine değil, kurumun kendi bütçesine kaydedilir. Kurumun genel yönetim kapsamında sayılması, bu gelir niteliğini değiştirmez.","sinav":"Kamu Malî Yönetimi ve Kontrol Kanunu 3. madde ile parafiskal gelir tanımı gereğince, sosyal güvenlik primlerinin kurumun kendi bütçesine gelir olarak kaydedilmesi ve devlet bütçesine dahil edilmemesi, bütçe kapsamı sınıflandırmasından bağımsız bir niteliktir.","kavramlar":[{"kaynak":"TEORI","tanim":"Kamu kurumu niteliğindeki meslek kuruluşları ve sosyal güvenlik kurumlarının, sundukları hizmetlerin finansmanı için ilgili gruptan zorunlu olarak topladığı, toplayan kurumun kendi bütçesine kaydedilen, karşılıklı gelirlerdir.","ad":"Parafiskal gelir"},{"kaynak":"Kamu Malî Yönetimi K. 3. madde","tanim":"Kamu Malî Yönetimi ve Kontrol Kanunu\u0027nun tanımladığı genel yönetim kapsamındaki kamu idareleri arasında yer alan, sosyal güvenlik primlerini toplayan kurumlar.","ad":"Sosyal güvenlik kurumu"},{"kaynak":"Kamu Malî Yönetimi K. 3. madde","tanim":"Uluslararası sınıflandırmalara göre belirlenmiş merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri içeren idareler.","ad":"Genel yönetim kapsamındaki kamu idaresi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[{"yil":"2026/1","alinti":"Aşağıdakilerden hangisi bir parafiskal kamu geliridir?"},{"yil":"2024/3","alinti":"Yukarıdakilerden hangisi/hangileri parafiskal bir kamu geliri değildir?"}],"donemler":["2026/1","2024/3"]},"oyun":null,"tip":"teori","soru":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu, sosyal güvenlik kurumlarını genel yönetim kapsamındaki kamu idaresi olarak saymaktadır. Bu durumda sosyal güvenlik kurumlarınca toplanan sosyal güvenlik primlerinin parafiskal gelir niteliği açısından aşağıdakilerden hangisi her zaman doğrudur?","kayitBaslik":"","id":"sgs-t1-genel-maliye-cokzor/kp-03","verilenler":[],"dayanak":"Teori - Parafiskal gelirler (öğreti notu); 5018 sayılı Kamu Malî Yönetimi Kanunu m.3/a,d","dogru":"E","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: TOBB\u0027a bağlı bir ticaret odası, 2023 yılında bölgesindeki 4.000 tüccardan toplam 12 milyon TL yıllık oda aidatı topluyor.","anlatim":"Bu para tüccarlardan zorunlu olarak alınıyor ama karşılığında oda onlara belge, kayıt gibi hizmet veriyor. Bu 12 milyon TL, ticaret odasının kendi bütçesine mi giriyor, devletin bütçesine mi?","doldur":[]},{"formul":"Ne yapacağız: Bu 12 milyon TL parafiskal gelirdir; beş özelliği var: zorunlu, karşılıklı, belirli gruptan, kanunla konulmuş, kurumun kendi bütçesine giriyor. Şimdi soruda geçen beş ifadeyi bu olaydaki 12 milyon TL üzerinden tek tek deneyeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Teori - Parafiskal gelirler","karar":"yanlış","anlatim":"Genel yönetim kapsamına girmek ayrı bir sınıflandırmadır, gelirin nereye kaydedileceğini belirlemez. Bu 12 milyon TL yine odanın kendi bütçesine yazılırdı, devlete gitmezdi.","formul":"Şık A: birisi sana \u00275018 sayılı Kanun ticaret odasını genel yönetim kapsamına alsaydı, bu 12 milyon TL devlet bütçesine gelir yazılırdı\u0027 diyor, katılır mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Teori - Parafiskal gelirler","karar":"yanlış","anlatim":"Tüccar bu parayı ödeyince odanın hizmetinden yararlanıyor, yani karşılığı var. Vergide karşılık yoktur, burada olay tam tersi işliyor.","formul":"Şık B: müdür \u0027tüccarlar bu parayı karşılıksız ödüyor, bu yüzden vergi gibi sayalım\u0027 diyor, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Teori - Parafiskal gelirler","karar":"yanlış","anlatim":"Belirli gruptan toplanmak parafiskal gelirin de özelliği, bu tek başına harç-resme özdeşlik kanıtı olmaz. Ayrımı yapan şey toplayan kurum ve girdiği bütçe.","formul":"Şık C: biri \u0027sadece tüccarlardan alınıyor, toplumun tamamından değil, o zaman harç ve resim gibidir\u0027 diyor, sen ne dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Teori - Parafiskal gelirler","karar":"yanlış","anlatim":"12 milyon TL\u0027yi devlet toplamıyor, ticaret odası kendisi topluyor. Harç ve resmi toplayan devletin kendisidir, burada durum farklı.","formul":"Şık D: \u0027devlet bu parayı topladığına göre harç ve resimlerle aynı bütçeye girer\u0027 diyor birisi, katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Teori - Parafiskal gelirler; 5018 s.K. m.3/a,d","karar":"doğru","anlatim":"5018 sayılı Kanun SGK\u0027yı genel yönetim kapsamına alsa da bu bütçe sınıflandırmasıdır, gelirin kaydı ayrı iştir. Parafiskal gelir hep kurumun kendi bütçesine yazılır, tıpkı bu 12 milyon TL gibi.","formul":"Şık E: \u0027aidat kanunla konulmuş olsa da bu 12 milyon TL odanın kendi bütçesine yazılır, devlet bütçesine girmez\u0027 diyor biri, doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✗ D ✗ E ✓","anlatim":"Genel yönetim kapsamında sayılmak ile gelirin hangi bütçeye kaydedildiği apayrı iki mesele. Kendine hep şunu sor: bu geliri kim topluyor ve hangi bütçeye giriyor?","doldur":[]}],"anahtar":[{"ornek":"bütçesine","kok":"bütçes"},{"ornek":"devlet","kok":"devlet"},{"ornek":"karşılıklıdır","kok":"karşıl"},{"ornek":"gelirin","kok":"geliri"},{"ornek":"parafiskal","kok":"parafi"},{"ornek":"milyon","kok":"milyon"}],"konuGiris":{"harita":"Ne zaman test edilir: sosyal güvenlik kurumları veya meslek odaları gelirlerinin vergiden farkı sorulduğunda. Nasıl ölçülür: gelirin karşılıklı olup olmadığı, hangi bütçeye girdiği ve kimin topladığı kontrol edilerek. Nasıl kaydedilir: parafiskal gelir devlet bütçesine değil, ilgili kamu kurumu niteliğindeki kuruluşun kendi bütçesine gelir yazılır.","desen":"Soru, sosyal güvenlik kurumlarının genel yönetim kapsamında sayılmasından hareketle primlerin devlet bütçesine gireceği yanılgısını kurar. Aslında bu kurumlar kendi bütçesine sahiptir ve prim geliri oraya yazılır, genel bütçeye girmez. Bu soru parafiskal gelirin karşılıklı ve kurum bütçesine ait olma özelliği noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek kuruluşu veya sosyal güvenlik kurumunun ilgili gruptan topladığı karşılıklı zorunlu gelir","ad":"Parafiskal gelir","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ödeyen kişinin kurumun sunduğu hizmetten doğrudan yararlanması durumu","ad":"Karşılıklılık","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Merkezî yönetim, sosyal güvenlik kurumları ve mahallî idareleri kapsayan sınıflandırma","ad":"Genel yönetim kapsamı","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Vergi, resim, harç ve sosyal güvenlik primi gibi kanuna dayanan tüm tahsilatları kapsayan üst kavram","ad":"Kamu geliri","kim":"kanun sabitler"}],"sinavda":"Sosyal güvenlik kurumlarının genel yönetim kapsamında sayıldığı bilgisi verilir ve toplanan primlerin parafiskal gelir niteliği açısından her zaman doğru olan özelliği istenir.","panel_ornek":"Bir spor kulübüne üye olan herkesin aylık 50 lira aidat ödemesi zorunludur ve bu para kulübün kendi bütçesine gider, devlete gitmez. Ödeyen kişi karşılığında salon, antrenman gibi hizmetlerden yararlanır. Kulüp üyesi olmayan biri bu parayı ödemez, yani herkesten değil sadece belirli gruptan alınır.","ornek":"Bir spor kulübüne üye olan herkesin aylık 50 lira aidat ödemesi zorunludur ve bu para kulübün kendi bütçesine gider, devlete gitmez. Ödeyen kişi karşılığında salon, antrenman gibi hizmetlerden yararlanır. Kulüp üyesi olmayan biri bu parayı ödemez, yani herkesten değil sadece belirli gruptan alınır.","yontemler":"Öğrenci önce geliri karşılıklı mı karşılıksız mı diye ayırmalı, sonra hangi bütçeye girdiğine bakmalıdır. Genel yönetim kapsamında sayılmak, geliri genel bütçeye dahil etmez.","nedir":"Parafiskal gelir, kamu kurumu niteliğindeki meslek kuruluşları ile sosyal güvenlik kurumlarının hizmetlerini finanse etmek için ilgili gruptan zorunlu olarak topladığı geliri ifade eder. Sınav bu gelirin vergiden ve harçtan hangi noktalarda ayrıldığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Kapsam Karıştırma Tuzağı","metin":"Belirli bir gruptan toplanmayı harç/resmin özelliği sanıyorsun. Doğrusu: hem parafiskal gelir hem harç/resim belirli kişilerden alınabilir; ayırıcı unsur toplayan kurum ve girdiği bütçedir, kapsam tek başına ayırt edici değildir."},"A":{"ad":"Genel Yönetim Kapsamı Tuzağı","metin":"5018 sayılı Kanunun SGK\u0027yı \u0027genel yönetim\u0027 saymasını, primlerin de otomatik olarak devlet bütçesine gireceği şeklinde okuyorsun. Doğrusu: bütçe kapsamına dahil olmak, gelirin devlet bütçesine yazılması ile aynı şey değildir; parafiskal gelir kurumun kendi bütçesine gelir kaydedilir."},"D":{"ad":"Toplayan Kurum Tuzağı","metin":"Harç ve resmi devletin topladığını, parafiskal geliri de aynı devletin topladığını sanıyorsun. Doğrusu: harç ve resmi devlet toplar ve devlet bütçesine girer; parafiskal geliri devlet değil, kamu kurumu niteliğindeki meslek kuruluşu veya sosyal güvenlik kurumu toplar."},"B":{"ad":"Karşılıksızlık Tuzağı","metin":"Vergi ile parafiskal geliri aynı torbaya koyuyorsun. Doğrusu: parafiskal gelirin ayırt edici özelliği tam da karşılıklı olmasıdır; ödeyen kişi kurumun hizmetinden yararlanır, karşılıksızlık verginin özelliğidir."}},"celdiriciYol":{"C":"\u0027Belirli gruptan toplama\u0027 ortak özelliğini harç/resmin ayırt edici unsuru sanma hatasından türer.","A":"5018 s.K. m.3/a\u0027daki \u0027genel yönetim kapsamı\u0027 tanımını, gelirin kaydedildiği bütçeyle aynı sayma hatasından türer (bütçe kapsamı ≠ gelir kaydı).","D":"\u0027Toplayan taraf\u0027 ile \u0027girilen bütçe\u0027 ilişkisini ters kurma hatasından türer; harç/resimde toplayan da devlettir, parafiskalde değildir.","B":"Öğretideki \u0027zorunluluk\u0027 ortak özelliğini \u0027karşılıksızlık\u0027 ile karıştırma hatasından türer; oysa karşılıksızlık yalnız vergiye özgüdür."},"hap":"Parafiskal gelir karşılıklıdır, kanunla konur, belirli bir gruptan toplanır ve ilgili kamu kurumunun kendi bütçesine gelir yazılır; devlet bütçesine girmez.","teshis":{"C":{"gercek":"Belirli gruptan toplanma parafiskal gelirin de özelliğidir; ayırıcı unsur toplayan kurum ve girdiği bütçedir.","ayirt":"Bu geliri kim topluyor ve hangi bütçeye giriyor?","paragraf":"Teori - Parafiskal gelirler","yanilgi":"Belirli gruptan toplanmayı harç/resmin ayırt edici niteliği sanıyorsun."},"E":{"gercek":"Bütçe kapsamı sınıflandırması ile gelirin hangi bütçeye kaydedildiği ayrı konulardır; parafiskal gelir kanunla konulur ama kurumun kendi bütçesine yazılır.","ayirt":"İdarenin bütçe kapsamındaki yeri ile topladığı gelirin kaydedildiği bütçe aynı şey mi?","paragraf":"Teori - Parafiskal gelirler; 5018 s.K. m.3/a,d","yanilgi":"SGK\u0027nın 5018 sayılı Kanunda genel yönetim kapsamında sayılmasını gördüğünde bu şıkkın yanlış olması gerektiğini düşünüyorsun."},"A":{"gercek":"Bütçe kapsamına dahil olmak ayrı bir sınıflandırmadır; parafiskal gelirin devlet bütçesine girmemesi öğretinin temel ayırt edici özelliğidir.","ayirt":"Bu gelir hangi kurumun kendi bütçesine yazılıyor, devletin genel bütçesine mi?","paragraf":"Teori - Parafiskal gelirler; 5018 s.K. m.3/a","yanilgi":"5018 sayılı Kanunun SGK\u0027yı genel yönetim kapsamına alması, sana primlerin devlet bütçesine gireceğini düşündürüyor."},"D":{"gercek":"Harç ve resmi devlet toplar ve devlet bütçesine girer; parafiskal geliri devlet değil kamu kurumu niteliğindeki kuruluş toplar.","ayirt":"Bu geliri toplayan devletin kendisi mi, yoksa ayrı bir kamu kurumu mu?","paragraf":"Teori - Parafiskal gelirler","yanilgi":"Karşılıklı olan her geliri devletin topladığını sanıyorsun."},"B":{"gercek":"Parafiskal gelir karşılıklıdır; ödeyen kişi hizmetten yararlanır, vergi ise karşılıksızdır.","ayirt":"Bu parayı ödeyen kişi karşılığında bir hizmetten yararlanıyor mu?","paragraf":"Teori - Parafiskal gelirler","yanilgi":"Zorunlu ödeme olduğu için vergiyle aynı şey olduğunu sanıyorsun."}},"verilen":[],"donem":2,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/1 Soru 97"},"kural":"parafiskal gelir, kamu kurumu niteliğindeki meslek kuruluşları ile sosyal güvenlik kurumlarının, sundukları hizmetin finansmanı için ilgililerden zorunlu olarak topladığı, karşılığı bulunan ve kendi bütçelerine giren gelirlerdir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/1 Soru 97","sonDonem":3,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Roma rakamlı sorularda önce kesin yanlışı (Maliye Bakanlığı) ele, kalan şıklardan doğru kombinasyon kendiliğinden çıkar.","konu":"parafiskal gelirler","tablo":{"satirlar":[["A) I ve II","TEORİ - Parafiskal Gelirler","YANLIŞ ifade"],["B) II ve III","TEORİ - Parafiskal Gelirler","YANLIŞ ifade"],["C) I, II ve IV","TEORİ - Parafiskal Gelirler","doğru ifade"],["D) II, III ve IV","TEORİ - Parafiskal Gelirler","YANLIŞ ifade"],["E) I, III ve IV","TEORİ - Parafiskal Gelirler","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"I, II ve IV","E":"I, III ve IV","A":"I ve II","D":"II, III ve IV","B":"II ve III"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - Parafiskal gelirler","metin":"TEORİ (maliye, mevzuat maddesi yok). TANIM: parafiskal gelirler, kamu kurumu niteliğindeki MESLEK KURULUŞLARI ile SOSYAL GÜVENLİK KURUMLARININ, sundukları hizmetlerin finansmanı için İLGİLİLERDEN zorunlu olarak topladığı gelirlerdir. ÖRNEKLER: sosyal güvenlik primleri, ticaret/sanayi odası aidatlari, baro aidatlari, TÜRMOB-SMMM odası aidatlari. BEŞ ÖZELLİK: (1) ZORUNLUDUR - ilgili gruba dahil olan ödemek zorundadır, (2) KARŞILIĞI VARDIR - ödeyen kişi kurumun hizmetinden yararlanır (vergiden ayrıldığı en önemli nokta), (3) DEVLET BÜTÇESİNE GİRMEZ - ilgili kurumun kendi bütçesine gelir yazılır, (4) BELİRLİ BİR GRUPTAN toplanır, toplumun tamamından değil, (5) KANUNLA veya kanunun verdiği yetkiye dayanılarak konulur. VERGİDEN FARKI: vergi KARŞILIKSIZDIR ve GENEL BÜTÇEYE girer; parafiskal gelir KARŞILIKLIDIR ve ÖZEL BÜTÇEYE/kurum bütçesine girer. HARÇ VE RESİMDEN FARKI: harç ve resim de karşılıklıdır ama DEVLET BÜTÇESİNE girer ve devlet tarafından toplanır; parafiskal geliri toplayan devlet değil, KAMU KURUMU NİTELİĞİNDEKİ KURULUŞTUR. SINAV TUZAĞI: \u0027karşılıksızdır\u0027 seçeneği parafiskal gelir için YANLIŞTIR - karşılıksızlık verginin özelliğidir. \u0027Genel bütçeye dahildir\u0027 seçeneği de yanlıştır."},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [1/3]","metin":"Madde 3- Münhasıran bu Kanunun uygulanmasında; a) Genel yönetim kapsamındaki kamu idareleri: Uluslararası sınıflandırmalara göre belirlenmiş olan, merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri, b) Merkezî yönetim kapsamındaki kamu idareleri: Bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerini, c) Düzenleyici ve denetleyici kurumlar: Bu Kanuna ekli (III) sayılı cetvelde yer alan kurumları, 22/12/2005 tarihli ve 5436 sayılı Kanunun 10 uncu maddesiyle, bu fıkraya \"25\" ibaresinden sonra gelmek üzere, \"42\" ibaresi; \"43\" ibaresinden sonra gelmek üzere, \"44\" ibaresi ve \"76\" ibaresinden sonra gelmek üzere, \"78\" ibaresi eklenmiştir. 1 d) Sosyal güvenlik kurumları: Bu Kanuna ekli (IV) sayılı cetvelde yer alan kamu kurumlarını, e) Mahallî idare: Yetkileri belirli bir coğrafi alan ve hizmetlerle sınırlı olarak kamusal faaliyet gösteren belediye, il özel idaresi ile bunlara bağlı veya bunların kurdukları veya üye oldukları birlik ve idareleri,2 f) Bütçe: Belirli bir dönemdeki gelir ve gider tahminleri ile bunların uygulanmasına ilişkin hususları gösteren ve usulüne uygun olarak yürürlüğe konulan belgeyi, g) Kamu kaynakları: Borçlanma suretiyle elde edilen imkânlar dahil kamuya ait gelirler, taşınır ve taşınmazlar, hesaplarda bulunan para, alacak ve haklar ile her türlü değerleri, h) Kamu gideri: Kanunlarına veya Cumhurbaşkanlığı kararnamelerine dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, sosyal güvenlik katkı payları, iç ve dış borç faizleri, borçlanma genel giderleri, borçlanma araçlarının iskontolu…"}],"hakem":"Soru parafiskal gelir tanımını ve kapsamını doğru ölçmektedir; doğru sık kaynak metinde yer alan tanım ve örneklere tamamen uygundur."},"kayitlar":[],"sade":{"siklar":{"D":"Maliye Bakanlığını dahil ediyor, Sosyal Güvenlik Kurumunu dışarıda bırakıyor. Sosyal güvenlik primi klasik parafiskal gelir örneğidir; Maliye geliri parafiskal değildir.","E":"Maliye Bakanlığını parafiskal sanıyor. Parafiskal gelir toplayan devlet değil, kamu kurumu niteliğindeki kuruluştur; devlet tarafından toplanan zorunlu gelir parafiskal olmaz.","A":"Baroyu dışarıda bırakıyor. Oysa baro da kamu kurumu niteliğindeki meslek kuruluşu olup topladığı aidatlar parafiskal gelirdir.","B":"Maliye Bakanlığının gelirini parafiskal sanıyor. Maliye topladığı vergi genel bütçeye girer ve bu parafiskal değildir."},"dogru":"Parafiskal gelir, sosyal güvenlik kurumları ve meslek kuruluşlarının (baro, ticaret odası gibi) sundukları hizmetler için topladıkları zorunlu gelirdir ve ilgili kurumun kendi bütçesine girer. Maliye Bakanlığı devlet adına vergi toplar; bu genel bütçeye giren vergi geliridir, parafiskal değildir.","sinav":"Parafiskal gelir, kamu kurumu niteliğindeki meslek kuruluşları ile sosyal güvenlik kurumlarının sundukları hizmetlerin finansmanı için ilgililerden zorunlu olarak topladığı, karşılığı bulunan ve kendi bütçelerine giren gelirlerdir.","kavramlar":[{"kaynak":"TEORI","tanim":"Kamu kurumu niteliğindeki meslek kuruluşları ile sosyal güvenlik kurumlarının sundukları hizmetlerin finansmanı için ilgililerden zorunlu olarak topladığı, karşılığı bulunan ve kendi bütçelerine giren gelirdir.","ad":"Parafiskal gelir"},{"kaynak":"TEORI","tanim":"Baro, Ticaret ve Sanayi Odası gibi kamu kurumu niteliğinde faaliyet gösteren ve üyelerinden aidatlar toplayan kuruluştur.","ad":"Meslek kuruluşu"},{"kaynak":"TEORI","tanim":"Sosyal güvenlik primlerini toplayan ve ilgililere sosyal güvenlik hizmetlerini sunan kamu kurumudur.","ad":"Sosyal güvenlik kurumu"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":2,"ornekler":[{"yil":"2025/1","alinti":"Türk vergi sisteminde yer alan ve aşağıda sayılan vergilerden hangisi “servet veya servet transferi” üzerinden alınmaktadır?"},{"yil":"2024/1","alinti":"Kamu gelirleri ile ilgili aşağıdakilerden hangisi doğrudur?"}],"donemler":["2025/1","2024/1"]},"oyun":null,"tip":"teori","soru":"Aşağıdaki kurumlardan hangilerinin topladığı gelir parafiskal gelir niteliğindedir? I. Sosyal Güvenlik Kurumu II. Ticaret ve Sanayi Odası III. Maliye Bakanlığı IV. Baro","kayitBaslik":"","id":"sgs-a6-maliye-zor-r1/kp-08","verilenler":[],"dayanak":"TEORİ - Parafiskal Gelirler (Maliye teorisi, öğreti notu)","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: İstanbul\u0027da bir mühendis, çalıştığı ilde bulunan Ticaret ve Sanayi Odasına 2024 yılı için 3.200 TL yıllık aidat ödüyor; aynı ay Sosyal Güvenlik Kurumuna 1.850 TL prim, Baroya 900 TL aidat gidiyor.","anlatim":"Bu üç ödeme de birer kanuni zorunluluk, hepsi ayrı bütçelere giriyor.","doldur":[]},{"formul":"Ne yapacağız: Sosyal Güvenlik Kurumu, Ticaret ve Sanayi Odası, Maliye Bakanlığı, Baro - bu dört kurumun topladığı gelirin parafiskal olup olmadığına bakacağız.","anlatim":"Parafiskal gelir zorunlu, karşılıklı ve kurumun kendi bütçesine giren geliri anlatıyor. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"TEORİ - Parafiskal Gelirler","karar":"yanlış","anlatim":"Baro da mühendisin verdiği örnekteki gibi mensuplarından zorunlu aidat topluyor, kendi bütçesine gelir yazıyor. Baroyu çıkarmak yanlış olur.","formul":"Şık A: \u0027Sadece Sosyal Güvenlik Kurumu ve Ticaret ve Sanayi Odası parafiskaldır\u0027 desen, Baroyu dışarıda bırakırsın, doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"TEORİ - Parafiskal Gelirler","karar":"yanlış","anlatim":"Maliye Bakanlığının topladığı vergi genel bütçeye girer, karşılıksızdır. Bu ifade yanlış.","formul":"Şık B: \u0027Ticaret ve Sanayi Odası ile Maliye Bakanlığı parafiskaldir\u0027 desen, Maliye Bakanlığını içeri alırsın, doğru mu?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"TEORİ - Parafiskal Gelirler","karar":"doğru","anlatim":"Prim, oda aidatı ve baro aidatı; üçü de zorunlu, karşılıklı, kendi bütçesine giren gelir. Bu üçlü tam tanıma uyuyor.","formul":"Şık C: \u0027Sosyal Güvenlik Kurumu, Ticaret ve Sanayi Odası ve Baro parafiskaldir\u0027 desen, olayımızdaki üç ödemeyi birlikte doğrular mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"TEORİ - Parafiskal Gelirler","karar":"yanlış","anlatim":"Maliye Bakanlığı geliri genel bütçeye giden vergi geliridir, listede olmamalı. Ayrıca Sosyal Güvenlik Kurumu\u0027nun eksik kalması da hatalı, ifade yanlış.","formul":"Şık D: \u0027Ticaret ve Sanayi Odası, Maliye Bakanlığı ve Baro parafiskaldir\u0027 desen, mühendisin ödediği primi listeden çıkarırsın, doğru mu?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"TEORİ - Parafiskal Gelirler","karar":"yanlış","anlatim":"Vergi karşılıksızdır ve devlet tarafından toplanır, mühendisin oda aidatına benzemez. Maliye Bakanlığı burada olamaz, ifade yanlış.","formul":"Şık E: \u0027Sosyal Güvenlik Kurumu, Maliye Bakanlığı ve Baro parafiskaldir\u0027 desen, Maliye Bakanlığını yine içeri alırsın, doğru mu?"},{"formul":"Kapanış: A ✗ B ✗ C ✓ D ✗ E ✗","anlatim":"Mühendisin üç ödemesi (prim, oda aidatı, baro aidatı) parafiskal gelirin tam örneği, Maliye Bakanlığı\u0027nın vergisi asla değil. Kendine sor: bu gelir devlet bütçesine mi giriyor, yoksa kurumun kendi bütçesine mi?","doldur":[]}],"anahtar":[{"ornek":"karşılığı","kok":"karşıl"},{"ornek":"bütçesine","kok":"bütçes"},{"ornek":"zorunlu","kok":"zorunl"},{"ornek":"kurumu","kok":"kurumu"},{"ornek":"aidatı","kok":"aidatı"},{"ornek":"parafiskal","kok":"parafi"}],"konuGiris":{"harita":"Ne zaman test edilir: hangi kurumların topladığı gelirin parafiskal sayılıp sayılmayacağı sorulduğunda. Nasıl ölçülür: gelirin karşılıklı olup olmadığı ve genel bütçeye girip girmediği kontrol edilerek. Nasıl kaydedilir: parafiskal gelir toplayan kurumun kendi özel bütçesine gelir olarak yazılır.","desen":"Soru genellikle dört-beş kurum sayıp hangilerinin parafiskal gelir topladığını sorar; Maliye Bakanlığı gibi genel bütçeye vergi toplayan kurum çelik tuzak olarak eklenir. SGK, oda ve baro doğru seçenek olurken Maliye Bakanlığı yanlış seçenektir çünkü topladığı vergi karşılıksızdır ve genel bütçeye girer. Bu soru parafiskal gelirin \u0027karşılıklı olma\u0027 ve \u0027genel bütçeye girmeme\u0027 özelliği noktasından geliyor (2 dönemde çıkmış).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Meslek kuruluşu ve SGK\u0027nın ilgili gruptan topladığı zorunlu, karşılıklı gelir","ad":"Parafiskal gelir","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Ödeyen kişi kurumun sunduğu hizmetten fiilen yararlanır","ad":"Karşılıklılık","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Oda, baro gibi kanunla kurulmuş, aidat toplayan meslek örgütü","ad":"Kamu kurumu niteliğinde meslek kuruluşu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Toplanan gelirin devlet genel bütçesine değil kurumun kendi bütçesine girmesi","ad":"Genel bütçe dışılık","kim":"kanun sabitler"}],"sinavda":"Dört kurum/kuruluş sayılır ve bunlardan hangilerinin topladığı gelirin parafiskal nitelikte olduğu sorulur.","panel_ornek":"Bir spor kulübüne üye olduğunda her ay 50 lira aidat ödersin, bu parayı devlet değil kulüp yönetimi toplar ve kendi hesabında kullanır. Karşılığında sen kulübün tesislerinden yararlanırsın. Ödemezsen üyeliğin devam etmez, yani zorunludur.","ornek":"Bir spor kulübüne üye olduğunda her ay 50 lira aidat ödersin, bu parayı devlet değil kulüp yönetimi toplar ve kendi hesabında kullanır. Karşılığında sen kulübün tesislerinden yararlanırsın. Ödemezsen üyeliğin devam etmez, yani zorunludur.","yontemler":"Her kurum için \u0027karşılıklı mı, belirli gruptan mı, genel bütçe dışı mı\u0027 sorusu tek tek sorulur; Maliye Bakanlığı gibi genel bütçeye gelir toplayanlar hemen elenir.","nedir":"Parafiskal gelirler, kamu kurumu niteliğindeki meslek kuruluşları ile sosyal güvenlik ku
