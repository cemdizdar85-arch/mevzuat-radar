ları kullananların bu kaynakları etkili, ekonomik, verimli ve hukuka uygun kullanmaktan sorumlu tutulması ise hesap verme sorumluluğudur, ikisi aynı kavram değildir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 98","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"\"Hangisi yanlıştır\" sorularında önce Kanun\u0027un saydığı dört gerçek unsuru (görev-yetki, planlar-bütçeler, teşvikler, muhasebe sistemi) hızla say, kalan şık kavram karıştırmasıdır.","konu":"mali saydamlık","tablo":{"satirlar":[["A) Genel yönetim kapsamındaki idarelerce sağlanan teşvik ve…","p.(3) teşvik açıklama","doğru ifade"],["B) Kamu hesaplarının standart bir muhasebe sistemi ve genel…","p.(4) muhasebe standardı","doğru ifade"],["C) Görev, yetki ve sorumlulukların açık olarak tanımlanmış …","p.(1) görev-yetki tanımı","doğru ifade"],["D) Saydamlık, yalnız uygulama sonuçlarının değil, planların…","p.(2) süreç açıklığı","doğru ifade"],["E) Malî saydamlık, kaynakları kullananların bu kaynakları h…","hesap verme sorumluluğu ilişkisi","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Görev, yetki ve sorumlulukların açık olarak tanımlanmış olması malî saydamlığın unsurlarından biridir.","E":"Malî saydamlık, kaynakları kullananların bu kaynakları hukuka uygun kullanmaktan sorumlu tutulmasını ifade eder; bu nedenle hesap verme sorumluluğu ile aynı kavramdır.","A":"Genel yönetim kapsamındaki idarelerce sağlanan teşvik ve desteklemelerin bir yılı geçmemek üzere belirli dönemler itibarıyla kamuoyuna açıklanması, saydamlığın gereklerindendir.","D":"Saydamlık, yalnız uygulama sonuçlarının değil, planların ve bütçelerin hazırlanma ve görüşülme aşamalarının da kamuoyuna açık olmasını gerektirir.","B":"Kamu hesaplarının standart bir muhasebe sistemi ve genel kabul görmüş muhasebe ilkelerine uygun olarak tutulması saydamlığın sağlanması için aranır."},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - mali saydamlik","metin":"TEORİ (maliye; dayanak 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu\u0027nun malî saydamlık ve hesap verme sorumluluğu hükümleri). TANIM VE KURAL: MALÎ SAYDAMLIK, kamu kaynaklarının elde edilmesi ve kullanılmasına ilişkin her türlü bilginin, denetimin sağlanması amacıyla, kamuoyuna ZAMANINDA, DOĞRU ve ANLAŞILIR biçimde açık olmasıdır. 5018 sayılı Kanun saydamlığın sağlanması için başlıca şu gerekleri sayar: (1) Görev, yetki ve sorumlulukların açık olarak tanımlanması. (2) Hükümet politikaları, kalkınma planları, yıllık programlar, stratejik planlar ile bütçelerin hazırlanması, yetkili organlarda görüşülmesi, uygulanması ve uygulama sonuçlarının kamuoyuna açık ve ulaşılabilir olması. (3) Genel yönetim kapsamındaki idarelerce sağlanan teşvik ve desteklemelerin bir yılı geçmemek üzere belirli dönemler itibarıyla kamuoyuna açıklanması. (4) Kamu hesaplarının standart bir muhasebe sistemi ve genel kabul görmüş muhasebe ilkelerine uygun olarak tutulması. Uluslararası çerçeve IMF\u0027nin Malî Saydamlık İyi Uygulamalar Tüzüğüdür. HESAP VERME SORUMLULUĞU ile ilişkisi: Saydamlık bilgiyi açar; hesap verebilirlik, kaynakları kullananların bu kaynakların etkili, ekonomik, verimli ve hukuka uygun kullanılmasından sorumlu tutulmasıdır. Saydamlık hesap verebilirliğin ÖN KOŞULUdur. KÜÇÜK ÖRNEK: Bir bakanlığın faaliyet raporunu ve kesin hesabını yayımlaması saydamlık; raporda gösterilen sapmalardan üst yöneticinin TBMM ve Sayıştay karşısında sorumlu olması hesap verebilirliktir. SINAV TUZAĞI: (1) Saydamlık ve hesap verebilirlik aynı şey değildir; biri bilgi, öteki sorumluluktur. (2) Teşvik ve dest…"}],"hakem":"Soru 5018 sayılı Kanun\u0027un malî saydamlık ve hesap verme sorumluluğu hükümlerine dayanmakta; E şıkkı saydamlık ile hesap verme sorumluluğunu aynı kavram olarak sunarak yanlış bir ifade içermektedir; kaynak metinde bu ikisinin farklı kavramlar olduğu (saydamlık bilgiyi açar, hesap verebilirlik sorumluluğu ifade eder) açıkça belirtilmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Görev, yetki ve sorumlulukların açık tanımlanması saydamlığın ilk ve temel gereğidir. Bu şık doğru bir ifadedir.","A":"Teşvik ve desteklemelerin bir yılı geçmemek üzere belirli dönemler itibarıyla kamuoyuna açıklanması, Kanun\u0027un aradığı gerçek bir saydamlık unsurudur. Bu şık doğru bilgiyi taşır.","D":"Saydamlık yalnız uygulama sonuçlarını değil, hazırlanma ve görüşülme aşamalarını da kapsar. Tüm sürecin kamuoyuna açık olması gerekir, bu şık doğrudur.","B":"Standart muhasebe sistemi ve genel kabul görmüş ilkelere uygunluk, Kanun\u0027da saydamlığın sağlanması için aranmaktadır. Bu şık doğrudur."},"dogru":"Saydamlık, kamu kaynaklarıyla ilgili bilgiyi açık tutmaktır. Hesap verme sorumluluğu ise kaynakları kullananları bu kaynakları doğru şekilde kullanmaktan sorumlu tutmaktır. İkisi farklı kavramlardır, biri bilgi açıklığı, öteki sorumluluktur.","sinav":"Kamu Malî Yönetimi ve Kontrol Kanunu\u0027na göre malî saydamlık bilgiyi açık tutmayı; hesap verme sorumluluğu ise kaynakları kullananların bu kaynakları etkili, ekonomik, verimli ve hukuka uygun kullanmaktan sorumlu tutulmasını ifade eder ve ikisi aynı kavram değildir.","kavramlar":[{"kaynak":"TEORI","tanim":"Kamu kaynaklarının elde edilmesi ve kullanılmasına ilişkin her türlü bilginin kamuoyuna zamanında, doğru ve anlaşılır biçimde açık olmasıdır.","ad":"Malî saydamlık"},{"kaynak":"TEORI","tanim":"Kaynakları kullananların bu kaynakları etkili, ekonomik, verimli ve hukuka uygun şekilde kullanmaktan sorumlu tutulmasıdır.","ad":"Hesap verme sorumluluğu"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2025/2","alinti":"Kamu kaynaklarının elde edilmesi ve kullanılmasında denetiminin sağlanması amacıyla kamuoyunun zamanında bilgilendirilmesi aşağıda yer alan kavramlardan hangisi ile açıklanır?"}],"donemler":["2025/2"]},"oyun":null,"tip":"teori","soru":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu\u0027na göre malî saydamlığa ilişkin ifadelerden hangisi yanlıştır?","kayitBaslik":"","id":"sgs-t1-genel-maliye-kolay/kp-06","verilenler":[],"dayanak":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu, malî saydamlık ve hesap verme sorumluluğu hükümleri","dogru":"E","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Bir belediye 2019 yılında 40 firmaya toplam 6 milyon lira teşvik desteği veriyor, bunu 8 ay sonra internet sitesinde ilan ediyor. Belediye başkanı da \u0027zaten bütçemi yayımlıyorum, saydamlık ile hesap verme sorumluluğu benim için aynı şey\u0027 diyor.","anlatim":"","doldur":[]},{"formul":"Ne yapacağız: 5018 sayılı Kanun\u0027a göre saydamlık, görev-yetki tanımından teşviklerin açıklanmasına, muhasebe standardına ve süreç açıklığına kadar birden çok gereği kapsıyor; ama hesap verme sorumluluğuyla aynı kavram değil. Bu belediyenin uygulamalarını beş ifadeyle tek tek test edeceğiz.","anlatim":"","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.(3) teşvik açıklama","karar":"doğru","anlatim":"Kanun teşvik ve desteklemelerin bir yılı geçmemek üzere açıklanmasını istiyor, 8 ay bu sınırın içinde. Belediyenin uygulaması kurala uygun, ifade doğru.","formul":"Şık A: belediye teşvikleri 8 ay sonra açıklıyor, sen \u0027bu süre uygundur\u0027 der misin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.(4) muhasebe standardı","karar":"doğru","anlatim":"Kanun bu şartı ayrıca sayıyor, muhasebenin standart olması saydamlığın aracı. Bu yüzden ifade doğru, kontrol edilmesi gerekir.","formul":"Şık B: belediye muhasebesini standart bir sisteme ve genel kabul görmüş ilkelere göre tutuyor mu, saydamlık için buna bakar mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.(1) görev-yetki tanımı","karar":"doğru","anlatim":"Görev, yetki ve sorumlulukların açık tanımlanması Kanun\u0027un ilk saydığı gerek. Belirsizlik varsa saydamlık zaten sağlanamaz, ifade doğru.","formul":"Şık C: belediyede kimin hangi işten sorumlu olduğu net değil, sen bunun saydamlık sorunu olduğunu söyler misin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.(2) süreç açıklığı","karar":"doğru","anlatim":"Kanun hazırlık, görüşme, uygulama ve sonuç aşamalarının hepsinin açık olmasını ister. Başkan yanılıyor ama ifadenin kendisi, kuralı doğru anlatıyor.","formul":"Şık D: belediye başkanı \u0027sadece sonuç raporunu açıklıyorum, plan aşaması gizli olabilir\u0027 diyor, buna katılır mısın?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"hesap verme sorumluluğu ilişkisi","karar":"yanlış","anlatim":"Saydamlık bilgiyi açık, doğru ve zamanında sunmaktır; hesap verme sorumluluğu ise kaynağı kullananın bundan sorumlu tutulmasıdır. İkisi ayrı kavram, başkan yanılıyor, ifade yanlış.","formul":"Şık E: başkan \u0027saydamlık ile hesap verme sorumluluğu benim için aynı şey\u0027 diyor, sen ona katılır mısın?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✓ E ✗","anlatim":"Belediyenin bütün uygulamaları saydamlığın gereklerine uyuyor, tek sorun başkanın kavram karışıklığı. Kendine sor: bu cümle bilgiyi mi açıklıyor, yoksa bir sorumluluk mu yüklüyor?","doldur":[]}],"anahtar":[{"ornek":"sorumluluğu","kok":"soruml"},{"ornek":"saydamlık","kok":"saydam"},{"ornek":"bilgiyi","kok":"bilgiy"},{"ornek":"başkan","kok":"başkan"},{"ornek":"uygulaması","kok":"uygula"},{"ornek":"kullananların","kok":"kullan"}],"konuGiris":{"harita":"Ne zaman test edilir: Bütçe hazırlığından uygulama sonuçlarına kadar tüm sürecin kamuoyuna açık olup olmadığı değerlendirilirken test edilir. Nasıl ölçülür: Görev-yetki tanımlarının açıklığı, plan ve bütçelerin ulaşılabilirliği, teşvik-desteklerin belirli aralıklarla açıklanması ve standart muhasebe sistemi uygulanması kriterleriyle ölçülür. Nasıl kaydedilir: Şıklardan hangisinin bu dört gereğe uymadığı ya da saydamlığı hesap verebilirlikle karıştırdığı tespit edilerek işaretlenir.","desen":"Sınav genellikle dört gerekten birini bozarak ya da saydamlığı hesap verebilirlikle eşitleyerek yanlış şıkkı gizler. Teşvik ve desteklerin açıklanma süresi olan bir yılı geçmemek üzere ifadesi sıkça değiştirilir. Bu soru saydamlığın unsurlarını sayan kural cümlesinden geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kamu kaynaklarına ilişkin bilginin kamuoyuna açık olması","ad":"Malî saydamlık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kaynağı kullananın etkili ve hukuka uygun kullanımdan sorumlu tutulması","ad":"Hesap verme sorumluluğu","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Bir yılı geçmemek üzere belirli dönemlerde kamuoyuna duyurulması","ad":"Teşvik ve destekleme açıklaması","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kamu hesaplarının ortak ilkelere göre tutulması gerekliliği","ad":"Standart muhasebe sistemi","kim":"Tekdüzen hesap planı ya da standart tanımlar"}],"sinavda":"Soruda malî saydamlığın gerekleri sıralanır ve bunlardan hangisinin kanuna göre saydamlık unsuru olmadığı ya da hangi ifadenin yanlış olduğu sorulur.","panel_ornek":"Bir apartman yönetimi her ay aidat gelir-gider dökümünü panoya asıyor ve kapıcı maaşının 9 bin liradan 10 bin liraya çıktığını sakinlere önceden duyuruyor. Bu, hiçbir sakin sormadan bilgiye ulaşabilmesi demek, yani saydamlık böyle bir şey. Ama yöneticinin bu parayı doğru harcamaktan sorumlu tutulması ayrı bir konu.","ornek":"Bir apartman yönetimi her ay aidat gelir-gider dökümünü panoya asıyor ve kapıcı maaşının 9 bin liradan 10 bin liraya çıktığını sakinlere önceden duyuruyor. Bu, hiçbir sakin sormadan bilgiye ulaşabilmesi demek, yani saydamlık böyle bir şey. Ama yöneticinin bu parayı doğru harcamaktan sorumlu tutulması ayrı bir konu.","yontemler":"Tek kritik kural: saydamlık bilgiyi açar, hesap verebilirlik ise sorumluluğu doğurur; ikisi birbirinin yerine konursa şık yanlış olur.","nedir":"Malî saydamlık, kamu kaynaklarının nasıl elde edilip kullanıldığına dair bilgilerin kamuoyuna zamanında, doğru ve anlaşılır biçimde açık olmasıdır. Sınav bu açıklığın hangi unsurlarla sağlandığını ve neyin buna dahil olmadığını ölçer."},"olay":"","tuzak":{"C":{"ad":"C Tuzağı","metin":"Görev-yetki tanımının saydamlıkla değil örgütlenmeyle ilgili sanılmasıdır. Doğrusu: Görev, yetki ve sorumlulukların açık tanımlanması saydamlığın ilk gereğidir, ifade doğrudur."},"A":{"ad":"A Tuzağı","metin":"Bu ifade doğru bilgiyi taşıdığı için öğrenci burayı yanlış sanabilir. Doğrusu: Teşvik ve desteklemelerin bir yılı geçmemek üzere açıklanması Kanun\u0027un aradığı gerçek bir unsurdur, bu şık doğrudur."},"D":{"ad":"D Tuzağı","metin":"Saydamlığın yalnız uygulama sonucu raporlarını kapsadığı sanılır. Doğrusu: Saydamlık hazırlıktan uygulama sonuçlarına kadar tüm süreci kapsar, bu şık doğru bir ifadedir."},"B":{"ad":"B Tuzağı","metin":"Muhasebe standardı konusunun saydamlıkla ilgisiz sanılması hatasıdır. Doğrusu: Standart muhasebe sistemi ve genel kabul görmüş ilkelere uygunluk, Kanun\u0027da saydamlığın gereği sayılmıştır."}},"celdiriciYol":{},"hap":"Malî saydamlık bilgiyi açar, hesap verme sorumluluğu ise o bilgiden doğan sorumluluğu yükler; saydamlık hesap verebilirliğin ön koşuludur.","teshis":{"C":{"gercek":"Görev, yetki ve sorumlulukların açık tanımlanması, Kanun\u0027un saydamlık için ilk saydığı unsurdur.","ayirt":"Bu açıklık, denetim ve bilgilendirmeye mi hizmet ediyor?","paragraf":"5018 s.K. saydamlık hükümleri","yanilgi":"Görev-yetki tanımını örgütlenme konusu sanıp saydamlık dışı görüyorsun."},"E":{"gercek":"Saydamlık bilgiyi açar, hesap verebilirlik ise kaynağı kullananı bu kullanımdan sorumlu tutar; saydamlık hesap verebilirliğin ön koşuludur, aynısı değildir.","ayirt":"Bu cümle bilgiyi mi açıklıyor yoksa bir sorumluluk mu yüklüyor?","paragraf":"5018 s.K. saydamlık ve hesap verme sorumluluğu hükümleri","yanilgi":"Saydamlık ile hesap verme sorumluluğunu aynı kavram sanıyorsun çünkü ikisi de bir arada anılır."},"A":{"gercek":"5018 sayılı Kanun, teşvik ve desteklemelerin bir yılı geçmemek üzere kamuoyuna açıklanmasını saydamlığın gereği sayar.","ayirt":"Bu cümle bir bilgiyi mi açıklıyor, bir sorumluluğu mu yüklüyor?","paragraf":"5018 s.K. saydamlık hükümleri","yanilgi":"Doğru bir tanımı, aşırı ayrıntılı göründüğü için yanlış sanıyorsun."},"D":{"gercek":"Saydamlık, hazırlıktan uygulama sonuçlarına kadar bütün sürecin kamuoyuna açık olmasını kapsar.","ayirt":"Bu açıklık yalnız sonu mu, süreci mi kapsıyor?","paragraf":"5018 s.K. saydamlık hükümleri","yanilgi":"Saydamlığı yalnızca sonuç raporlarının yayımlanması sanıyorsun."},"B":{"gercek":"Standart muhasebe sistemi ve genel kabul görmüş ilkeler, Kanun\u0027da saydamlığın sağlanması için sayılan gereklerdendir.","ayirt":"Bu unsur bilgiyi mi doğru ve anlaşılır kılıyor?","paragraf":"5018 s.K. saydamlık hükümleri","yanilgi":"Muhasebe standardını teknik bir ayrıntı sayıp saydamlıkla ilgisiz görüyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"Mali uyumun kalitesi büyüklüğüyle değil bileşimi ve kalıcılığıyla ölçülür. Personel ve destek gibi cari harcamaların kısılmasına dayanan harcama taraflı uyum yapısal harcama eğilimini değiştirdiği için daha kalıcıdır; özelleştirme, af ve tahsilatın öne çekilmesi gibi bir kerelik gelirler açığı geçici düşürür ve yapısal uyum sayılmaz.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Karşılaştırmalı uyum sorularında her ülkenin kullandığı kalemi yaz ve tekrarlanabilirliğini sor; tekrarlanamayan kaynak düşük kalite demektir.","konu":"mali uyum kalitesi","tablo":{"satirlar":[["VERİLENLER","-"],["Birinci ülkenin yolu","Cari harcama kısıntısı"],["İkinci ülkenin yolu","Bir kerelik özelleştirme geliri"],["HESAP","-"],["Ne soruluyor","Buna göre aşağıdakilerden hangisi doğrudur?"],["Kural","Mali uyumun kalitesi büyüklüğüyle değil bileşimi ve kalıcılığıyla ölçülür. Personel ve destek gibi cari harcamaların kısılmasına dayanan harcama taraflı uyum yapısal harcama eğilimini değiştirdiği için daha kalıcıdır; özelleştirme, af ve tahsilatın öne çekilmesi gibi bir kerelik gelirler açığı geçici düşürür ve yapısal uyum sayılmaz."],["Doğru şık","A) Birinci ülkenin uyumu daha kalıcı ve yüksek kalitelidir"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"İki uyum da aynı kalitededir, çünkü büyüklükleri eşittir","E":"Birinci ülkenin uyumu büyümeyi zayıflattığı için düşük kalitelidir","A":"Birinci ülkenin uyumu daha kalıcı ve yüksek kalitelidir","D":"İkinci ülkenin uyumu yapısal reform sayılır","B":"İkinci ülkenin uyumu daha kalıcıdır"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - mali uyum kalitesi","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: MALÎ UYUM (malî konsolidasyon), bütçe açığını ve kamu borcunu sürdürülebilir düzeye indirmek için kamu gelir ve giderlerinde yapılan kalıcı düzeltmedir. Aynı büyüklükteki iki uyum farklı KALİTEde olabilir; kalite uyumun BİLEŞİMİ ve KALICILIĞI ile ölçülür. HARCAMA TARAFLI UYUM: Cari harcamaların (personel, transfer, sübvansiyon) kısılmasına dayanan uyum daha KALICI sayılır; çünkü yapısal harcama eğilimini değiştirir ve özel kesime alan açar. VERGİ TARAFLI UYUM: Vergi oranlarını artırarak sağlanan uyum daha kolay geri döner, yatırım ve çalışma isteğini zayıflatır, kayıt dışılığı özendirir; kalitesi düşük sayılır. YATIRIM KESİNTİSİ: Kamu yatırımlarını kesmek açığı hızla kapatır ama uzun dönem büyümeyi ve gelecekteki vergi tabanını zayıflatır; en düşük kaliteli uyum yollarından biridir. Bir kerelik gelirler (özelleştirme, af, tahsilatın öne çekilmesi) açığı geçici düşürür, yapısal uyum sayılmaz. İyi uyum ayrıca vergi tabanını genişleten, istisnaları daraltan ve harcama etkinliğini artıran yapısal reformlarla desteklenir. KÜÇÜK ÖRNEK: İki ülke açığını millî gelirin yüzde ikisi kadar azaltıyor. Birincisi kamu istihdamını ve verimsiz sübvansiyonları kısarak, ikincisi tek seferlik özelleştirme geliri ve yatırım kesintisiyle yapıyorsa birincinin uyumu kalıcı ve yüksek kaliteli, ikincinin geçici ve düşük kalitelidir. SINAV TUZAĞI: (1) Malî uyumun büyüklüğü ile kalitesi ayrı kavramlardır. (2) Yatırım kısarak sağlanan uyum kısa vadede etkili görünür ama kalitesizdir. (3) Vergi artışına dayalı uyumun kalıcılığı düşüktür; \u0027vergi artışı…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [3/3]","metin":"3 2/7/2018 tarihli ve 703 sayılı Kanun Hükmünde Kararnamenin 213 üncü maddesiyle (h) bendinde yer alan “Kanunlarına” ibaresinden sonra gelmek üzere “veya Cumhurbaşkanlığı kararnamelerine” ibaresi eklenmiş ve (j) bendinde yer alan “ilgili kanunlarında” ibaresinden sonra gelmek üzere “veya Cumhurbaşkanlığı kararnamelerinde” ibaresi eklenmiştir. 2 İKİNCİ BÖLÜM Kamu Maliyesi Kamu maliyesi"}],"hakem":"Soru mali uyum kalitesinin tanım ve kurallarını doğru şekilde sormuş, dayanak metinde bu kural açıkça tanımlanmış ve örneklenmiştir."},"kayitlar":[],"sade":{"siklar":{"C":"Eşit büyüklükteki iki açık düzelmesi de farklı kalitede olabilir; kalite harcama eğilimini değiştirip değiştirmediğine bakılır, sayılar aynı olsa bile.","E":"Büyümeyi zayıflatan yol kamu yatırımlarını kesmektir; cari harcama (personel, destek) kısıntısı büyümeyi zayıflatmaz, aksine birinci ülkenin uyumunu yüksek kaliteli yapar.","D":"Özelleştirme geliri, harcama eğilimini değiştirmediği için yapısal reform sayılmaz; yapısal olan cari harcamaları kesen birinci ülkenin yoludur.","B":"İkinci ülkenin geliri tek sefer (özelleştirme) kullandığı için uyumu ertesi yıl ortadan kalkar; kalıcı olan birinci ülkenin uyumudur."},"dogru":"İki ülke de açığı aynı oranda azaltsalar da, birincisi cari harcamaları (personel, destekler) kısarak yapısal değişim sağladığı için uyumu kalıcı; ikincisi tek seferlik özelleştirme geliriyle geçici çözüm bulduğu için uyumu ertesi yıl geri döner.","sinav":"Malî uyumun kalitesi büyüklüğü değil bileşimi ve kalıcılığı ile ölçülür; cari harcamaların kısılması yapısal harcama eğilimini değiştirdiği için daha kalıcı uyum sağlarken, bir kerelik gelirler (özelleştirme) geçici düşürüm sağlar ve yapısal uyum sayılmaz.","kavramlar":[{"kaynak":"TEORI","tanim":"Bütçe açığını ve kamu borcunu sürdürülebilir düzeye indirmek için kamu gelir ve giderlerinde yapılan kalıcı düzeltmedir.","ad":"Malî uyum"},{"kaynak":"TEORI","tanim":"Cari harcamaların (personel, transfer, sübvansiyon) kısılmasına dayanan uyum; yapısal harcama eğilimini değiştirdiği için daha kalıcı sayılır.","ad":"Harcama taraflı uyum"},{"kaynak":"TEORI","tanim":"Özelleştirme, af ve tahsilatın öne çekilmesi gibi kaynaklar; açığı geçici düşürür, yapısal uyum sayılmaz.","ad":"Bir kerelik gelirler"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[{"yil":"2025/3","alinti":"Aşağıdakilerden hangisi kamu açığının azaltılmasına yönelik olarak uygulamaya konulan gelir ve harcama politikalarının ülkenin ekonomik ve sosyal gelişmesine ne düzeyde katkı verdiğiyle ilgilenmekte ve uygulanan bir ekonomik programda kamu açıklarının veya bütçe açıklarının düşürülme şekli olarak tanımlanmaktadır?"}],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"İki ülke bütçe açığını milli gelirin yüzde ikisi kadar azaltmıştır. Birinci ülke kamu istihdamını ve verimsiz destekleri kısmış, ikinci ülke yalnız özelleştirme geliri kullanmıştır. Buna göre aşağıdakilerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t4-maliye-zor/kp-03","verilenler":[{"deger":"Cari harcama kısıntısı","anlam":"Yapısal harcama eğilimini değiştirir.","ad":"Birinci ülkenin yolu"},{"deger":"Bir kerelik özelleştirme geliri","anlam":"Açığı geçici olarak düşürür.","ad":"İkinci ülkenin yolu"}],"dayanak":"Teori notu: mali uyum kalitesi — aynı büyüklükteki iki uyum farklı kalitede olabilir ve kalite uyumun bileşimi ile kalıcılığı ile ölçülür; cari harcamaların kısılmasına dayanan harcama taraflı uyum daha kalıcı sayılır çünkü yapısal harcama eğilimini değiştirir ve özel kesime alan açar; bir kerelik gelirler olan özelleştirme, af ve tahsilatın öne çekilmesi açığı geçici düşürür ve yapısal uyum sayılmaz, kamu yatırımlarını kesmek ise uzun dönem büyümeyi zayıflattığı için en düşük kaliteli yollarda elir ve giderlerinde yapılan kalıcı düzeltmedir.","ad":"Malî uyum (malî konsolidasyon)"},{"kaynak":"TEORI","tanim":"Kamu yatırımlarını kesmek açığı hızla kapatır ama uzun dönem büyümeyi ve gelecekteki vergi tabanını zayıflatır; en düşük kaliteli uyum yollarından biridir.","ad":"Yatırım kesintisi"},{"kaynak":"TEORI","tanim":"Malî uyumun büyüklüğü değil, uyumun bileşimi ve kalıcılığı ile ölçülür.","ad":"Uyumun kalitesi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2025/3","alinti":"Aşağıdakilerden hangisi kamu açığının azaltılmasına yönelik olarak uygulamaya konulan gelir ve harcama politikalarının ülkenin ekonomik ve sosyal gelişmesine ne düzeyde katkı verdiğiyle ilgilenmekte ve uygulanan bir ekonomik programda kamu açıklarının veya bütçe açıklarının düşürülme şekli olarak tanımlanmaktadır?"}],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Bir ülke, bütçe açığını millî gelirin belirli bir yüzdesi kadar azaltmak amacıyla malî uyum (malî konsolidasyon) programı uygulamaktadır. Aşağıdaki unsurlardan hangisi bu uyumun kalitesini artıran bir özellik taşımaz?","kayitBaslik":"","id":"sgs-t1-genel-maliye-kolay/kp-07","verilenler":[],"dayanak":"Teori - mali uyum kalitesi (öğreti notu, mevzuat maddesi yok)","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Bir belediye, 2023 yılında bütçe açığını millî gelirin yüzde bir buçuğu kadar azaltmak için yol ve okul yapım yatırımlarını 40 milyon liradan 10 milyon liraya düşürüyor.","anlatim":"Açık gerçekten hızla kapanıyor, bütçe raporunda rakam güzel görünüyor. Ama arkasında yatan sorun şu: bu para gelecekteki büyümeyi mi besliyordu?","doldur":[]},{"formul":"Ne yapacağız: Aynı açık kapatma miktarı beş farklı yolla sağlanabilir; her yolun kalıcılığı ve yapısal etkisi ayrı ayrı tartılır. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kalite, açığın büyüklüğüyle değil, tedbirin kalıcı ve yapısal olmasıyla ölçülür. Yatırım kesintisi, vergi artışı, bir kerelik gelir gibi kalemler farklı kalite taşır.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Teori - mali uyum kalitesi","karar":"doğru","anlatim":"Bu, oran artışı değil taban genişletmesi; yapısal bir düzeltme sayılır. Böyle reformlar kalıcı gelir sağlar ve kaliteyi yükseltir.","formul":"Şık A: belediye vergi tabanını genişletip istisnaları daraltıyor, bunu kaliteyi artıran bir adım sayar mısın?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Teori - mali uyum kalitesi","karar":"doğru","anlatim":"Cari harcama kısıntısı yapısal harcama eğilimini değiştirir, bu yüzden kalıcı sayılır. Böyle bir tedbir uyumun kalitesini yükseltir.","formul":"Şık B: belediye kadrolu personel sayısını ve verimsiz sübvansiyonları kalıcı olarak azaltıyor, kaliteyi artırır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Teori - mali uyum kalitesi","karar":"yanlış","anlatim":"Açık hızlı kapanır ama gelecekteki büyüme ve vergi tabanı zayıflar. Bu yüzden yatırım kesintisi en düşük kaliteli uyum yollarından biridir.","formul":"Şık C: belediye yol ve okul yatırımlarını 40 milyondan 10 milyona indiriyor, bunu kaliteli bir uyum sayar mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Teori - mali uyum kalitesi","karar":"doğru","anlatim":"Harcama etkinliğini artıran yapısal reform tek seferlik değil, sürekli bir iyileştirmedir. Bu tür reformlar uyumun kalıcılığını destekler.","formul":"Şık D: belediye harcama sürecini gözden geçirip etkinliği artıran yapısal reformlar uyguluyor, kaliteyi artırır mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Teori - mali uyum kalitesi","karar":"doğru","anlatim":"Bu gelir bir kerelik af veya özelleştirme geliri gibi geçici değil, her yıl tekrar eden yapısal bir gelirdir. Böyle kalıcı gelir artışı kaliteyi yükseltir.","formul":"Şık E: belediye vergi denetimini güçlendirip her yıl tekrar eden kalıcı gelir artışı sağlıyor, kaliteyi artırır mı?"},{"formul":"Kapanış: A ✓ B ✓ C ✗ D ✓ E ✓","anlatim":"Kalite hızda değil kalıcılıkta ve yapısal etkide gizli, yatırım kesintisi bu ikisini de zayıflatır. Kendine hep şunu sor: bu tedbir gelecekteki büyümeyi ve vergi tabanını besliyor mu, yoksa törpülüyor mu?","doldur":[]}],"anahtar":[{"ornek":"kalitesi","kok":"kalite"},{"ornek":"yapısal","kok":"yapısa"},{"ornek":"kalıcı","kok":"kalıcı"},{"ornek":"yatırım","kok":"yatırı"},{"ornek":"harcama","kok":"harcam"},{"ornek":"büyümeyi","kok":"büyüme"}],"konuGiris":{"harita":"Ne zaman test edilir: bütçe açığını azaltma yollarının kalitesi karşılaştırılırken sorulur. Nasıl ölçülür: uygulanan tedbirin kalıcılığı ve harcama-vergi bileşimine bakılarak değerlendirilir. Nasıl kaydedilir: soru şıklarında hangi unsurun kaliteyi artırmadığı işaretlenerek cevaplanır.","desen":"Soru, şıklardan birinde yatırım kesintisi veya vergi artışını \u0027kaliteyi artıran unsur\u0027 gibi sunarak tuzak kurar. Öğrenci, uyumun büyüklüğü ile kalitesini karıştırıp yanlış şıkkı seçebilir. Bu soru, harcama-vergi bileşiminin kalıcılığı noktasından geliyor (p. teori, 1 dönem çıkmış).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Açığı ve borcu sürdürülebilir düzeye indiren kalıcı gelir-gider düzeltmesi","ad":"Malî uyum (konsolidasyon)","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Cari harcamaların kısılmasıyla sağlanan, yapısal ve kalıcı sayılan uyum türü","ad":"Harcama taraflı uyum","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Vergi oranı artışıyla sağlanan, kolay geri dönen düşük kaliteli uyum","ad":"Vergi taraflı uyum","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Özelleştirme veya af gibi açığı geçici düşüren, yapısal sayılmayan gelir","ad":"Bir kerelik gelir","kim":"piyasa fiyatlar"}],"sinavda":"Soru, mali uyum programının unsurlarını sıralar ve kaliteyi artırmayan tek unsuru sorar.","panel_ornek":"Bir genç, market masrafını azaltmak için ya gereksiz aylık üyelikleri kalıcı olarak iptal eder ya da bir seferlik eşyalarını satıp şürür.","teshis":{"C":{"gercek":"Yatırım kesintisi açığı hızlı kapatır ama büyümeyi ve gelecekteki vergi tabanını zayıflatır; en düşük kaliteli uyum yollarından biridir.","ayirt":"Bu tedbir açığı kapatırken gelecekteki büyüme ve vergi tabanını mı zayıflatıyor?","paragraf":"Teori - mali uyum kalitesi","yanilgi":"Açığın hızlı kapanmasını kaliteyle karıştırıp yatırım kesintisini de \u0027başarılı uyum\u0027 sayarsın."},"E":{"gercek":"Vergi tabanını genişleten kalıcı denetim geliri, bir kerelik gelirlerden farklı olarak yapısal ve kalite artırıcıdır.","ayirt":"Bu gelir her yıl tekrar mı ediyor, yoksa tek seferlik mi?","paragraf":"Teori - mali uyum kalitesi","yanilgi":"Denetimle sağlanan kalıcı gelir artışını, af veya özelleştirme gibi bir kerelik gelir zannediyorsun."},"A":{"gercek":"Vergi tabanını genişleten, istisnaları daraltan yapısal reformlar iyi uyumu destekleyen unsurlardır; oran artışından farklıdır.","ayirt":"Bu değişiklik oranı mı artırıyor yoksa tabanı mı genişletiyor?","paragraf":"Teori - mali uyum kalitesi","yanilgi":"İstisna daraltmayı da bir tür \u0027vergi yükü artışı\u0027 sayıp kalite düşürücü zannediyorsun."},"D":{"gercek":"Harcama etkinliğini artıran yapısal reformlar uyumun kalıcılığını destekleyen unsurlardandır.","ayirt":"Bu düzenleme tek seferlik mi yoksa harcama sürecini yapısal olarak mı değiştiriyor?","paragraf":"Teori - mali uyum kalitesi","yanilgi":"Harcama etkinliği reformlarını da geçici bir tasarruf önlemi gibi görüp düşük kaliteli sayarsın."},"B":{"gercek":"Cari harcamaların (personel, sübvansiyon) kalıcı kısılması yapısal harcama eğilimini değiştirdiği için kalıcı ve yüksek kaliteli uyum sayılır.","ayirt":"Kısılan harcama cari mi, yatırım mı?","paragraf":"Teori - mali uyum kalitesi","yanilgi":"Cari harcama kısıntısını yatırım kısıntısıyla aynı sonucu verir sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/3 Soru 100"},"kural":"yatırım kesintisi açığı hızla kapatır ama uzun dönem büyümeyi ve gelecekteki ve . Aynı büyüklükteki iki uyum farklı KALİTEde olabilir; kalite uyumun BİLEŞİMİ ve KALICILIĞI ile ölçülür. HARCAMA TARAFLI UYUM: Cari harcamaların (personel, transfer, sübvansiyon) kısılmasına dayanan uyum daha KALICI sayılır; çünkü yapısal harcama eğilimini değiştirir ve özel kesime alan açar. VERGİ TARAFLI UYUM: Vergi oranlarını artırarak sağlanan uyum daha kolay geri döner, yatırım ve çalışma isteğini zayıflatır, kayıt dışılığı özendirir; kalitesi düşük sayılır. YATIRIM KESİNTİSİ: Kamu yatırımlarını kesmek açığı hızla kapatır ama uzun dönem büyümeyi ve gelecekteki vergi tabanını zayıflatır; en düşük kaliteli uyum yollarından biridir. Bir kerelik gelirler (özelleştirme, af, tahsilatın öne çekilmesi) açığı geçici düşürür, yapısal uyum sayılmaz. İyi uyum ayrıca vergi tabanını genişleten, istisnaları daraltan ve harcama etkinliğini artıran yapısal reformlarla desteklenir. KÜÇÜK ÖRNEK: İki ülke açığını millî gelirin yüzde ikisi kadar azaltıyor. Birincisi kamu istihdamını ve verimsiz sübvansiyonları kısarak, ikincisi tek seferlik özelleştirme geliri ve yatırım kesintisiyle yapıyorsa birincinin uyumu kalıcı ve yüksek kaliteli, ikincinin geçici ve düşük kalitelidir. SINAV TUZAĞI: (1) Malî uyumun büyüklüğü ile kalitesi ayrı kavramlardır. (2) Yatırım kısarak sağlanan uyum kısa vadede etkili görünür ama kalitesizdir. (3) Vergi artışına dayalı uyumun kalıcılığı düşüktür; \u0027vergi artışı…"}],"hakem":"Soru mali uyum kalitesi konusunu ölçmekte, kaynak metni açıkça \u0027kamu yatırımlarını kesmek açığı hızla kapatır ama uzun dönem büyümeyi ve gelecekteki vergi tabanını zayıflatır; en düşük kaliteli uyum yollarından biridir\u0027 ifadesiyle D seçeneğini doğru ve zamanında değerlendirmektedir."},"kayitlar":[],"sade":{"siklar":{"C":"Harcama etkinliğini artıran reformlar (boşa harcanan parayı azaltmak gibi) kaliteyi artıran yapısal önlemlerdendir.","E":"Uyumun harcama eğilimini kalıcı biçimde değiştirmesi tam olarak yüksek kaliteli malî uyumun tanımıdır.","A":"Cari harcamaları (personel, transfer) kalıcı olarak kesmek devletin yapısal harcama alışkanlığını değiştirir ve kaliteyi artırır; bu nedenle bu şık yanlış cevap değildir.","B":"Vergi tabanını genişletmek ve istisnaları azaltmak yapısal reformlar sayılır ve uyumun kalitesini artırır."},"dogru":"Kamu yatırımlarını kesmek açığı hızlı kapatır ama gelecekteki ekonomik büyümeyi ve vergi gelirlerini zayıflatır. Bu nedenle kısa vadeli etkili olsa da, uzun vadede devletin gelir kaynağını ve ekonomiyi hasara uğrattığı için kalitesiz bir uyum yöntemidir.","sinav":"Kamu yatırımlarının kesilmesi, bütçe açığını hızla kapatsa da uzun dönem büyümeyi ve gelecekteki vergi tabanını zayıflattığından malî uyumun en düşük kaliteli yollarından biridir.","kavramlar":[{"kaynak":"TEORI","tanim":"Bütçe açığını ve kamu borcunu sürdürülebilir düzeye indirmek için kamu gelir ve giderlerinde yapılan kalıcı düzeltmedir. Aynı büyüklükteki iki uyum farklı kalitede olabilir.","ad":"Malî uyum (malî konsolidasyon)"},{"kaynak":"TEORI","tanim":"Malî uyumun bileşimi ve kalıcılığı ile ölçülür. Cari harcama kesintisine dayanan uyum daha kalıcı sayılırken, yatırım kesintisi en düşük kaliteli yoldur.","ad":"Uyumun kalitesi"},{"kaynak":"TEORI","tanim":"Devletin uzun dönemde almışa aldığı harcama alışkanlığıdır. Cari gider kesintileri bu eğilimi kalıcı biçimde değiştirir.","ad":"Yapısal harcama eğilimi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[{"yil":"2025/3","alinti":"Aşağıdakilerden hangisi kamu açığının azaltılmasına yönelik olarak uygulamaya konulan gelir ve harcama politikalarının ülkenin ekonomik ve sosyal gelişmesine ne düzeyde katkı verdiğiyle ilgilenmekte ve uygulanan bir ekonomik programda kamu açıklarının veya bütçe açıklarının düşürülme şekli olarak tanımlanmaktadır?"}],"donemler":["2025/3"]},"oyun":null,"tip":"teori","soru":"Bütçe açığını sürdürülebilir düzeye indirmek amacıyla yapılan mali uyumun (mali konsolidasyonun) kalitesi tartışılırken aşağıdakilerden hangisi bu kaliteyi artıran bir unsur olarak kabul edilmez?","kayitBaslik":"","id":"sgs-t1-genel-maliye-zor/kp-07","verilenler":[],"dayanak":"TEORİ - Mali Uyum (Konsolidasyon) Öğreti Notu","dogru":"D","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Belde Belediyesi bütçe açığını millî gelirin %2\u0027si kadar azaltmak için üç yıllık plan yapıyor; 2019\u0027da 40 milyon lira tutan yol ve köprü yatırımını 8 milyon liraya düşürüyor.","anlatim":"Belediye açığı hemen kapatıyor çünkü yatırım parası büyük ve kesmesi kolay. Ama bu para geleceğin altyapısı ve vergi tabanı için harcanacak paraydı. Şimdilik rakam güzel görünüyor, kalıcılığı ayrı mesele.","doldur":[]},{"formul":"Ne yapacağız: Belediyenin uyumu büyüklük olarak %2 ama kalite bambaşka bir soru; beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kalite, harcamanın hangi kalemden kısıldığına ve bu kısıntının kalıcı olup olmadığına bakar. Personel mi, transfer mi, yatırım mı kesiliyor, bunu ayırt edeceğiz. Beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"Öğreti notu - Harcama Taraflı Uyum","karar":"doğru","anlatim":"Evet, artırır; çünkü cari harcama kısıntısı belediyenin yapısal harcama alışkanlığını değiştirir. Bu kısıntı özel kesime de alan açar, geri dönmesi zor bir tercih. Kaynağa göre bu kalıcı ve yüksek kaliteli uyum sayılır.","formul":"Şık A: belediye başkanı \u0027personel sayısını kalıcı olarak azaltalım, transfer ödemelerini de kısalım\u0027 diyor, bu kaliteyi artırır mı?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"Öğreti notu - İyi Uyumu Destekleyen Yapısal Reformlar","karar":"doğru","anlatim":"Evet, artırır; bu oran artışı değil, tabanı büyüten yapısal bir reform. İstisnaları daraltmak kayıt dışı kalan alanı küçültür. Kaynak böyle reformları kaliteyi destekleyen unsur sayıyor.","formul":"Şık B: mali müşavir \u0027imar vergisindeki istisnaları daraltıp tabanı genişletelim\u0027 diyor, bu kaliteyi artırır mı?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"Öğreti notu - İyi Uyumu Destekleyen Yapısal Reformlar","karar":"doğru","anlatim":"Evet, artırır; harcama etkinliğini yükseltmek verimlilik reformudur. Kesinti değil, aynı hizmeti daha az kaynakla üretmektir. Bu da kaliteyi destekleyen bir unsur olarak sayılıyor.","formul":"Şık C: kontrol memuru \u0027ihale süreçlerini iyileştirip aynı işi daha ucuza yaptıralım\u0027 diyor, bu kaliteyi artırır mı?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"Öğreti notu - Yatırım Kesintisi","karar":"yanlış","anlatim":"Hayır, artırmaz; yatırım kesintisi açığı hızlı kapatır ama uzun dönem büyümeyi ve gelecekteki vergi tabanını zayıflatır. Belde Belediyesi bugün rahatlar, yarın gelir kaybeder. Kaynağa göre bu en düşük kaliteli uyum yollarından biri.","formul":"Şık D: belediye başkanı \u0027yol köprü yatırımını 40 milyondan 8 milyona indirip açığı hemen kapatalım\u0027 diyor, kaliteyi artırır mı?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"Öğreti notu - Harcama Taraflı Uyum","karar":"doğru","anlatim":"Evet, artırır; kalıcı değişim tam olarak kalitenin ölçütü. Bir dönem sonra eski harcama alışkanlığına dönülmemesi önemli. Kaynak bunu temel kriter kabul ediyor.","formul":"Şık E: denetçi \u0027bu uyum belediyenin harcama eğilimini kalıcı biçimde değiştiriyor mu\u0027 diye soruyor, bu kaliteyi artıran bir unsur mu?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Belde Belediyesi\u0027nin yatırım kesintisi rakamda güzel ama kalitede en zayıf yol, çünkü büyüklük ile kalite ayrı şeyler. Kendine hep şunu sor: bu kısıntı yapısal ve kalıcı mı, yoksa hızlı ama geri dönüşü kolay bir çözüm mü?","doldur":[]}],"anahtar":[{"ornek":"kaliteyi","kok":"kalite"},{"ornek":"harcama","kok":"harcam"},{"ornek":"yatırım","kok":"yatırı"},{"ornek":"kalıcılığı","kok":"kalıcı"},{"ornek":"kısıntısı","kok":"kısınt"},{"ornek":"kesintisi","kok":"kesint"}],"konuGiris":{"harita":"Ne zaman test edilir: Malî uyumun büyüklüğü ile kalitesinin ayrı kavramlar olduğu vurgulanan cı çözüm, ikincisi geçici bir rahatlamadır; ikisi de borcu aynı miktarda azaltsa da kalitesi farklıdır.","yontemler":"Harcama kısıntısını kalıcı ve kaliteli, vergi artışı ile yatırım kesintisini geçici ve kalitesiz olarak eşleştir; bir kerelik gelirleri hep kalitesiz say.","nedir":"Mali uyum kalitesi, bütçe açığını kapatmak için yapılan düzeltmenin kalıcı mı geçici mi olduğunu inceler. Sınav, hangi tür harcama/gelir tercihinin kaliteyi düşürdüğünü ölçer."},"olay":"","tuzak":{"C":{"ad":"Reform Ayrımı Tuzağı","metin":"harcama etkinliği artışını, harcama kesintisiyle karıştırıp yanlış sayabilir. Doğrusu: harcama etkinliğini artıran yapısal reformlar kaliteyi artıran unsurlardandır."},"E":{"ad":"Kalıcılık Karıştırma Tuzağı","metin":"yapısal değişimi geçici bir önlemle eşdeğer sanabilir. Doğrusu: uyumun harcama eğilimini kalıcı biçimde değiştirmesi tam olarak kaliteyi artıran temel ölçüttür."},"A":{"ad":"Ne soruluyor","metin":"kaliteyi artırmayan unsur soruluyor. Kural: Cari harcamaların (personel, transfer, sübvansiyon) kısılmasına dayanan uyum kalıcı sayılır, çünkü yapısal harcama eğilimini değiştirir. Doğrusu: bu unsur kaliteyi artırır, dolayısıyla bu şık yanlış cevap değildir."},"B":{"ad":"Vergi Tabanı Tuzağı","metin":"öğrenci vergiyle ilgili her unsuru \u0027vergi artışı\u0027 sanıp kalitesiz zanneder. Doğrusu: vergi tabanını genişletme ve istisna daraltma yapısal reform sayılır, kaliteyi artırır."}},"celdiriciYol":{},"hap":"Mali uyumun büyüklüğü değil bileşimi ve kalıcılığı kaliteyi belirler; cari harcama kısıntısı ve yapısal reformlar kaliteyi artırırken, yatırım kesintisi ve bir kerelik gelirler kaliteyi düşürür.","teshis":{"C":{"gercek":"Harcama etkinliğini artıran reformlar, iyi uyumu destekleyen yapısal unsurlar arasında sayılır.","ayirt":"Bu unsur harcamanın miktarını mı yoksa verimliliğini mi hedefliyor?","paragraf":"Öğreti notu - İyi Uyumu Destekleyen Yapısal Reformlar","yanilgi":"Harcama etkinliğini artırmayı, harcamaları rastgele kısmakla aynı kategoriye atan farklı yöntemler karşılaştırılırken kalite sorgulanır. Nasıl ölçülür: Uyumun bileşimi (harcama mı vergi mi yatırım kesintisi mi) ve kalıcılığı ile ölçülür. Nasıl kaydedilir: Ayrı bir tutar değil, yöntemin türüne göre \u0027kalıcı-kalıcı değil\u0027 şeklinde nitelendirilir.","desen":"Soru genelde hangi uyum yönteminin en kaliteli olduğunu sorar ve seçeneklere vergi artışı, yatırım kesintisi, bir kerelik gelir gibi tuzaklar koyar. Doğru cevap her zaman cari harcama kısıntısına dayanan yapısal uyumdur. Bu soru p.28\u0027deki \u0027kalite bileşim ve kalıcılıkla ölçülür\u0027 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Bütçe açığını sürdürülebilir düzeye indiren kalıcı gelir-gider düzeltmesi","ad":"Malî uyum","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Cari harcamaların kısılmasıyla sağlanan, kalıcı sayılan uyum türü","ad":"Harcama taraflı uyum","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Vergi oranı artışıyla sağlanan, kolay geri dönen düşük kaliteli uyum","ad":"Vergi taraflı uyum","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Özelleştirme veya af gibi geçici, yapısal olmayan açık kapatma yolu","ad":"Bir kerelik gelir","kim":"piyasa fiyatlar"}],"sinavda":"Soru, açığı azaltan farklı yöntemleri verir ve en kaliteli/kalıcı uyumu seçmeni ister.","panel_ornek":"Bir arkadaşın markete gidip her ay kahve alışkanlığını azaltarak 50 TL tasarruf etmesi kalıcıdır; bir kerelik eski eşyalarını satıp 50 TL kazanması ise geçicidir. İkisi de aynı tutarı sağlar ama biri sürekli bütçe dengesi kurar, öbürü sadece o ay için işe yarar.","ornek":"Bir arkadaşın markete gidip her ay kahve alışkanlığını azaltarak 50 TL tasarruf etmesi kalıcıdır; bir kerelik eski eşyalarını satıp 50 TL kazanması ise geçicidir. İkisi de aynı tutarı sağlar ama biri sürekli bütçe dengesi kurar, öbürü sadece o ay için işe yarar.","yontemler":"En kritik kural: kalıcılığı en yüksek yöntem cari harcama (personel, transfer, sübvansiyon) kısıntısıdır; vergi artışı ve yatırım kesintisi düşük kalitelidir.","nedir":"Mali uyum kalitesi, bütçe açığını kapatmak için seçilen yöntemin kalıcı mı geçici mi olduğunu gösteren bir ölçüttür. Sınav aynı büyüklükteki uyumların hangisinin daha kalıcı ve yapısal olduğunu ölçer."},"olay":"","tuzak":{"C":{"ad":"Kalıcılık Tuzağı","metin":"Vergi artışına dayalı uyum kolay geri döner ve kayıt dışılığı özendirir. Doğrusu: en kaliteli yol cari harcamaların kısılmasıdır."},"E":{"ad":"Kalıcılık Tuzağı","metin":"Tahsilatın öne çekilmesi geliri yalnız zamanda kaydırır. Doğrusu: en kaliteli yol cari harcamaların kısılmasıdır."},"A":{"ad":"Kalıcılık Tuzağı","metin":"Bir kerelik gelirler açığı geçici düşürür, yapısal uyum sayılmaz. Doğrusu: en kalıcı yol cari harcamaların kısılmasıdır."},"B":{"ad":"Kalıcılık Tuzağı","metin":"Yatırım kesintisi açığı hızla kapatır ama uzun dönem büyümeyi ve gelecekteki vergi tabanını zayıflatır. Doğrusu: en kaliteli yol cari harcamaların kısılmasıdır."}},"celdiriciYol":{},"hap":"Mali uyumda büyüklük değil bileşim belirleyicidir; cari harcama kısıntısı kalıcı, vergi artışı ve yatırım kesintisi geçici sayılır.","teshis":{"C":{"gercek":"Vergi artışına dayalı uyum yatırım ve çalışma isteğini zayıflatır, kolay geri döner.","ayirt":"Uyum kalıcı mı?","paragraf":"Mali uyum kalitesi notu","yanilgi":"Gelir artırmayı en güvenli yol sanıyorsun."},"E":{"gercek":"Tahsilatın öne çekilmesi geliri zamanda kaydırır, yapısal bir düzeltme değildir.","ayirt":"Gelir gerçekten arttı mı?","paragraf":"Mali uyum kalitesi notu","yanilgi":"Nakit akışını düzeltmeyi uyum sanıyorsun."},"A":{"gercek":"Bir kerelik gelirler yapısal düzeltme yaratmaz, ertesi yıl açık geri gelir.","ayirt":"Gelir tekrarlanabilir mi?","paragraf":"Mali uyum kalitesi notu","yanilgi":"Açığı kapatan her yolu başarı sayıyorsun."},"D":{"gercek":"Kalite ölçüsü uygulanabilirlik değil kalıcılıktır; cari harcama kısıntısı yapısal harcama eğilimini değiştirdiği için en kalıcı uyum sayılır.","ayirt":"Uyum yapısal mı, geçici mi?","paragraf":"Mali uyum kalitesi notu","yanilgi":"Bu şıkkı eleyen öğrenci, harcama kısıntısının siyasi olarak zor olduğu için gerçekçi bir yol sayılmayacağını düşünür."},"B":{"gercek":"Yatırım kesintisi bugünkü açığı kapatırken gelecekteki büyümeyi ve vergi tabanını zayıflatır.","ayirt":"Uyum geleceği güçlendiriyor mu?","paragraf":"Mali uyum kalitesi notu","yanilgi":"Hızlı sonucu yüksek kalite sanıyorsun."}},"verilen":[[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2026/2 Soru 95"},"kural":"5018 sayılı Kanuna göre merkezi yönetim bütçesi (I), (II) ve (III) sayılı cetvellerdeki idarelerden oluşur; sosyal güvenlik kurumları (IV) sayılı cetvelde ayrı sayılmış olup merkezi yönetim bütçesinin dışındadır, ancak mahallî idarelerle birlikte genel yönetimi oluşturur.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2026/2 Soru 95","sonDonem":1,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Şıklarda bir sosyal güvenlik kurumu veya belediye görürsen, önce onu kontrol et; cetvellerde sayılmayan tek tip bunlardır.","konu":"merkezi yönetim bütçesi kapsamı","tablo":{"satirlar":[["A) Sayıştay","p.(I) sayılı cetvel","YANLIŞ ifade"],["B) Karayolları Genel Müdürlüğü","p.(II) sayılı cetvel","YANLIŞ ifade"],["C) Rekabet Kurumu","p.(III) sayılı cetvel","YANLIŞ ifade"],["D) Sosyal Güvenlik Kurumu","p.m.3 ve ekli cetveller","doğru ifade"],["E) Yükseköğretim Kurulu","p.(II) sayılı cetvel","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Rekabet Kurumu","E":"Yükseköğretim Kurulu","A":"Sayıştay","D":"Sosyal Güvenlik Kurumu","B":"Karayolları Genel Müdürlüğü"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - merkezi yonetim butcesi kapsami","metin":"TEORİ (maliye; dayanak 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu\u0027nun kapsam ve bütçe türleri hükümleri). TANIM VE KURAL: MERKEZİ YÖNETİM BÜTÇESİ, 5018 sayılı Kanuna ekli üç cetveldeki idarelerin bütçelerinden oluşur ve tek bir kanunla (merkezi yönetim bütçe kanunu) TBMM\u0027de kabul edilir. (I) SAYILI CETVEL – GENEL BÜTÇELİ İDARELER: Devlet tüzel kişiliğine dahil idareler; Cumhurbaşkanlığı, TBMM, bakanlıklar, Anayasa Mahkemesi, Yargıtay, Danıştay, Sayıştay, Hazine ve Maliye Bakanlığına bağlı kuruluşlar gibi. Gelirleri ve giderleri tek hazinede toplanır. (II) SAYILI CETVEL – ÖZEL BÜTÇELİ İDARELER: Bir bakanlığa bağlı veya ilgili, belirli bir kamu hizmetini yürütmek üzere kurulan, gelir tahsis edilen, ayrı tüzel kişiliği bulunan idareler; üniversiteler, YÖK, ÖSYM, TÜBİTAK, Karayolları Genel Müdürlüğü gibi. (III) SAYILI CETVEL – DÜZENLEYİCİ VE DENETLEYİCİ KURUMLAR: Kanunla kurulan, idari ve malî özerkliği bulunan kurul ve kurumlar; SPK, BDDK, RTÜK, Rekabet Kurumu, Kamu İhale Kurumu, Kamu Gözetimi Kurumu gibi. Bu kurumlar merkezi yönetim bütçesine dahildir ancak kanunun bazı hükümlerinden muaftır. KAPSAM DIŞI: Sosyal güvenlik kurumları (IV sayılı cetvel) ve mahallî idareler merkezi yönetim bütçesinde YER ALMAZ; ancak merkezi yönetimle birlikte GENEL YÖNETİMİ oluştururlar. KİT\u0027ler hiçbirine girmez. KÜÇÜK ÖRNEK: Sayıştay ve bir üniversite merkezi yönetim bütçesinin içinde (biri genel, öteki özel bütçe); Sosyal Güvenlik Kurumu ve İzmir Büyükşehir Belediyesi merkezi yönetim bütçesinin dışında, genel yönetimin içindedir. SINAV TUZAĞI: (1) \u0027Merkezi yönetim bütçesi\u0027 üç cetveldir; \u0027…"},{"ad":"Merkezi Takas Kuruluslarinin Kurulus ve Calisma Esaslari Hakkinda Genel Yonetmelik m.1","metin":"MADDE 1 – (Değişik:RG-5/12/2019-30969) (1) Bu Yönetmeliğin amacı, 6/12/2012 tarihli ve 6362 sayılı Sermaye Piyasası Kanununun 77 nci ve 78 inci maddeleri çerçevesinde merkezi takas kuruluşlarına ve merkezi takas kuruluşları tarafından verilebilecek merkezi karşı taraf hizmetine ilişkin esasları belirlemektir. Kapsam"}],"hakem":"Soru 5018 sayılı Kanuna ekli cetvellere dayanan merkezi yönetim bütçesi kapsamı kuralını ölçer; doğru sık (D) Sosyal Güvenlik Kurumu kaynakta (IV. cetvel) açıkça kapsam dışı olarak tanımlanmıştır."},"kayitlar":[],"sade":{"siklar":{"C":"Rekabet Kurumu idari ve malî özerkliği olsa da üçüncü cetvede düzenleyici kurum olarak merkezi yönetim bütçesi içinde sayılır.","E":"Yükseköğretim Kurulu düzenleyici kuruma benzer görünse de ikinci cetvelde özel bütçeli idare olarak merkezi yönetim bütçesinin içindedir.","A":"Sayıştay yargı organı gibi görünse de birinci cetvelde genel bütçeli idare olarak merkezi yönetim bütçesinin içindedir.","B":"Karayolları Genel Müdürlüğü ayrı tüzel kişiliği olmasına rağmen ikinci cetvelde özel bütçeli idare olup merkezi yönetim bütçesine dahildir."},"dogru":"Sosyal Güvenlik Kurumu merkezi yönetim bütçesi kapsamında değildir. Kanun merkezi yönetim bütçesini üç cetvelde saysalar da, sosyal güvenlik kurumları dördüncü cetvelde ayrı tutulmuştur. Genel yönetimin içinde olsa da, bütçe kapsamı dışındadır.","sinav":"Kamu Malî Yönetimi ve Kontrol Kanunu\u0027na ekli cetvellerde merkezi yönetim bütçesi kapsamını belirleyen hükümlere göre.","kavramlar":[{"kaynak":"TEORI","tanim":"5018 sayılı Kanuna ekli üç cetveldeki (genel bütçeli idareler, özel bütçeli idareler, düzenleyici ve denetleyici kurumlar) idarelerin bütçelerinden oluşan ve tek bir kanunla TBMM\u0027de kabul edilen bütçe.","ad":"Merkezi yönetim bütçesi"},{"kaynak":"TEORI","tanim":"Devlet tüzel kişiliğine dahil olan, gelirleri ve giderleri tek hazinede toplanan idareler (bakanlıklar, Sayıştay, mahkemeler gibi).","ad":"Genel bütçeli idareler"},{"kaynak":"TEORI","tanim":"Bir bakanlığa bağlı, belirli bir kamu hizmetini yürütmek üzere kurulan, ayrı tüzel kişiliği bulunan idareler (üniversiteler, Karayolları Genel Müdürlüğü gibi).","ad":"Özel bütçeli idareler"},{"kaynak":"TEORI","tanim":"Kanunla kurulan, idari ve malî özerkliği bulunan kurul ve kurumlar (Rekabet Kurumu, SPK gibi) merkezi yönetim bütçesine dahildir ancak bazı kanun hükümlerinden muaftır.","ad":"Düzenleyici ve denetleyici kurumlar"},{"kaynak":"TEORI","tanim":"Dördüncü cetvelde sayılan ve merkezi yönetim bütçesi kapsamı dışında kalan ancak genel yönetimi oluşturan kuruluşlar.","ad":"Sosyal güvenlik kurumları"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/2"]},"oyun":null,"tip":"teori","soru":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanununa ekli cetvellerde, merkezi yönetim bütçesi kapsamındaki idareler genel bütçeli, özel bütçeli ve düzenleyici-denetleyici kurumlar olarak üç cetvelde sayılmıştır. Buna göre aşağıdakilerden hangisi merkezi yönetim bütçesi kapsamında yer almaz?","kayitBaslik":"","id":"sgs-t1-genel-maliye-kolay/kp-12","verilenler":[],"dayanak":"5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu, m.3 ve ekli (I), (II), (III), (IV) sayılı cetveller","dogru":"D","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Ankara\u0027da bir kamu maliyecisi 2024 merkezi yönetim bütçe kanunu tasarısını hazırlıyor; masasında beş kurum listesi var: Sayıştay, Karayolları Genel Müdürlüğü, Rekabet Kurumu, Sosyal Güvenlik Kurumu ve Yükseköğretim Kurulu.","anlatim":"Maliyeci her birini tek tek cetvellere yerleştirecek. Biri listeye hiç girmeyecek.","doldur":[]},{"formul":"Ne yapacağız: 5018 sayılı Kanuna ekli (I), (II) ve (III) sayılı cetvellerdeki idareler merkezi yönetim bütçesini oluşturur; sosyal güvenlik kurumları (IV) sayılı cetvelde ayrı sayılır ve dışarıda kalır.","anlatim":"Maliyeci beş kurumu bu üç cetvelde arayacak, bulamazsa dışarı çıkaracak. Şimdi beş ifadeyi bu olayda tek tek deneyeceğiz.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.(I) sayılı cetvel","karar":"yanlış","anlatim":"Sayıştay (I) sayılı cetvelde genel bütçeli idareler arasında sayılır. Yargı bağımsızlığı bütçe türünü değiştirmez, listeye içeride kalır.","formul":"Şık A: maliyeci \u0027Sayıştay yargı bağımsızlığı olan bir kurum, bütçe dışına yazayım mı?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.(II) sayılı cetvel","karar":"yanlış","anlatim":"Karayolları Genel Müdürlüğü (II) sayılı cetvelde özel bütçeli idare olarak sayılır. Ayrı gelir tahsisi onu merkezi yönetim bütçesinin dışına çıkarmaz.","formul":"Şık B: maliyeci \u0027Karayolları Genel Müdürlüğü\u0027nün ayrı geliri var, dışarı mı koyayım?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.(III) sayılı cetvel","karar":"yanlış","anlatim":"Rekabet Kurumu (III) sayılı cetvelde düzenleyici-denetleyici kurum olarak sayılır. Özerklik sadece bazı hükümlerden muafiyet sağlar, kapsam dışına çıkarmaz.","formul":"Şık C: maliyeci \u0027Rekabet Kurumu özerk, bütçeden muaf mı sayayım?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.m.3 ve ekli cetveller","karar":"doğru","anlatim":"Sosyal Güvenlik Kurumu (IV) sayılı cetvelde ayrı bir kategoridedir, üç cetvelden hiçbirine girmez. O yüzden merkezi yönetim bütçesi kapsamında değildir, genel yönetim içindedir.","formul":"Şık D: maliyeci \u0027Sosyal Güvenlik Kurumu da kamu idaresi, üç cetvelden birine yazayım mı?\u0027 diye soruyor, sen ne dersin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.(II) sayılı cetvel","karar":"yanlış","anlatim":"Yükseköğretim Kurulu (II) sayılı cetvelde özel bütçeli idare olarak sayılır, (III) sayılı cetvele girmez. Kurul adı taşıması onu düzenleyici-denetleyici kurum yapmaz.","formul":"Şık E: maliyeci \u0027Yükseköğretim Kurulu adı Kurul, düzenleyici-denetleyici mi sayayım?\u0027 diye soruyor, sen ne dersin?"},{"formul":"Kapanış: A ✓ B ✓ C ✓ D ✗ E ✓","anlatim":"Sosyal Güvenlik Kurumu (IV) sayılı cetvelde ayrı durduğu için tek dışarıda kalan oydu. Kendine hep bu soruyu sor: bu idare üç cetvelden birinde mi sayılıyor, yoksa dördüncü ayrı kategoride mi?","doldur":[]}],"anahtar":[{"ornek":"sayılı","kok":"sayılı"},{"ornek":"cetvellerdeki","kok":"cetvel"},{"ornek":"yönetim","kok":"yöneti"},{"ornek":"bütçesi","kok":"bütçes"},{"ornek":"merkezi","kok": nem":3,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Şıklarda parayı kimin, nasıl aldığına bak: doğrudan kişiye nakit gidiyorsa dolaysız, piyasa fiyatı üzerinden destekleniyorsa dolaylıdır.","konu":"transfer harcamaları sınıflandırma","tablo":null,"siklar":{"C":"Üniversite öğrencilerine karşılıksız burs verilmesi","E":"Dul ve yetimlere aylık bağlanması","A":"Emekli olan kişilere Sosyal Güvenlik Kurumu aracılığıyla düzenli aylık bağlanması","D":"Çiftçiden belirlenen destekleme fiyatı üzerinden ürün satın alınması","B":"Dar gelirli ailelere nakdi sosyal yardım yapılması"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - transfer harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: TRANSFER HARCAMASI, devletin karşılığında mal veya hizmet almadan satın alma gücünü bir kesimden ötekine KARŞILIKSIZ aktarmasıdır. Reel harcamadan farkı budur: reel harcamada devlet üretim faktörü veya mal satın alır ve millî gelire doğrudan katkı yapar; transfer millî gelirin bileşimini ve dağılımını değiştirir, doğrudan artırmaz. SINIFLANDIRMA: (1) DOLAYSIZ–DOLAYLI: Dolaysız transfer, kişilere doğrudan ödenir (emekli aylığı, dul ve yetim aylığı, sosyal yardım, burs); dolaylı transfer, fiyat mekanizması üzerinden yapılır (tarım ürünü destekleme alımı, sübvansiyon, vergi indirimi yoluyla destek). (2) GELİR TRANSFERİ – SERMAYE TRANSFERİ: Gelir transferi tüketimi finanse eder (sosyal yardım); sermaye transferi yatırımı finanse eder (KİT\u0027lere sermaye aktarımı, yatırım teşviki). (3) İKTİSADİ – SOSYAL – MALÎ TRANSFERLER: İktisadi transferler üretimi ve fiyatı etkiler (sübvansiyon, ihracat desteği); sosyal transferler gelir dağılımını düzeltir (yardımlar, sosyal güvenlik ödemeleri); malî transferler kamu borcunun faizi ve benzeri ödemelerdir. (4) İÇ – DIŞ TRANSFER: Yurt içi kesimlere veya yurt dışına (dış yardım, uluslararası kuruluş aidatı) yapılan transferler. (5) VERİMLİ – VERİMSİZ: Üretim kapasitesini artıran (yatırım teşvi  Buna göre aşağıdakilerden hangisi dolaylı transfer harcamasına örnektir?","kayitBaslik":"","id":"sgs-t1-genel-maliye-kolay/kp-10","verilenler":[],"dayanak":"TEORI - transfer harcamaları sınıflandırma (Öğreti notu)","dogru":"D","oyunBonus":null,"ders":"Maliye","adimlar":[],"anahtar":[{"ornek":"transfer","kok":"transf"},{"ornek":"dolaylı","kok":"dolayl"},{"ornek":"kişiye","kok":"kişiye"},{"ornek":"harcama","kok":"harcam"},{"ornek":"dolaysızdır","kok":"dolays"},{"ornek":"doğrudan","kok":"doğrud"}],"konuGiris":{"harita":"Ne zaman test edilir: dolaysız-dolaylı transfer örnekleri karıştırılınca test edilir. Nasıl ölçülür: ödemenin kişiye direkt mi yoksa fiyat/piyasa üzerinden mi yapıldığına bakılarak ölçülür. Nasıl kaydedilir: örnekler ezbere değil, ödeme yolunun mantığıyla ayırt edilerek kaydedilir.","desen":"Soru şıklarda emekli aylığı, burs gibi dolaysız örnekleri dolaylı gibi göstermeye çalışır. Tuzak, sübvansiyon ve destekleme alımının fiyat üzerinden yapıldığını fark ettirmemektir (p.28). Bu soru dolaysız-dolaylı transfer ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Kişiye doğrudan yapılan ödemedir, fiyat aracı yoktur","ad":"Dolaysız transfer","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Fiyat mekanizması üzerinden yapılan, doğrudan kişiye ulaşmayan destektir","ad":"Dolaylı transfer","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Üreticiye fiyat üzerinden verilen dolaylı destek, örneğin destekleme alımı","ad":"Sübvansiyon","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Devletin karşılığında mal veya hizmet aldığı, transfer olmayan harcamadır","ad":"Reel harcama","kim":"kanun sabitler"}],"sinavda":"Şıklarda çeşitli transfer harcaması örnekleri verilir, dolaylı transfer olan seçilmesi istenir.","panel_ornek":"Komşun market alışverişinde direkt indirim kuponu kullanıyor, fiyat zaten düşük görünüyor; sen ise kardeşine cebinden elden 30 lira harçlık veriyorsun. İkisi de karşılıksız ama yöntemleri farklı, biri fiyattan biri elden.","ornek":"Komşun market alışverişinde direkt indirim kuponu kullanıyor, fiyat zaten düşük görünüyor; sen ise kardeşine cebinden elden 30 lira harçlık veriyorsun. İkisi de karşılıksız ama yöntemleri farklı, biri fiyattan biri elden.","yontemler":"Ödeme kişiye elden mi gidiyor yoksa fiyat/piyasa üzerinden mi işliyor sorusunu sor; fiyat üzerinden ise dolaylıdır.","nedir":"Transfer harcaması, devletin karşılığında mal veya hizmet almadan yaptığı karşılıksız ödemedir. Sınav bu ödemenin doğrudan kişiye mi yoksa fiyat mekanizması üzerinden mi yapıldığını ölçer."},"olay":"","tuzak":{"C":{"ad":"Ne soruluyor","metin":"Dolaylı transfer harcamasına örnek verilmesi isteniyor. Kural: Dolaylı transfer, fiyat mekanizması üzerinden yapılan; tarım ürünü destekleme alımı, sübvansiyon gibi işlemlerdir. Hesap: Çiftçiden piyasa fiyatı yerine belirlenen destekleme fiyatıyla ürün alınması, satın alma gücünün fiyat üzerinden karşılıksız aktarılmasıdır. Doğrusu: Bu işlem dolaylı transfer harcamasıdır."},"E":{"ad":"Malî Transfer Tuzağı","metin":"Dul-yetim aylığı, borç faizi gibi malî transfer sanılıp dolaylı kategorisine sokulmaya çalışılır. Doğrusu: Bu ödeme kişiye doğrudan yapıldığından dolaysız transferdir."},"A":{"ad":"Kurum Aracılığı Tuzağı","metin":"Ödeme Sosyal Güvenlik Kurumu üzerinden yapıldığı için dolaylı sanılır. Doğrusu: para nihai olarak kişiye doğrudan ulaştığından bu dolaysız bir transferdir."},"B":{"ad":"Sınıflandırma Karışıklığı Tuzağı","metin":"\u0027Sosyal yardım\u0027 ifadesindeki \u0027sosyal\u0027 kelimesi iktisadi-sosyal-mali ayrımındaki sosyal transferle karıştırılır. Doğrusu: sosyal yardım kişiye doğrudan ödendiği için dolaysız transferdir."}},"celdiriciYol":{},"hap":"Dolaylı transfer fiyat mekanizması üzerinden yapılır; kişiye doğrudan ödenen her transfer dolaysızdır.","teshis":{"C":{"gercek":"Burs karşılığında devlete mal veya hizmet dönmez, kişiye doğrudan ödenir; kaynak metin bursu dolaysız transfer örneği sayar.","ayirt":"Bu ödeme karşılığında devlet bir mal/hizmet mi alıyor, yoksa karşılıksız mı veriyor; kime gidiyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Bursu eğitim hizmetine karşılık verilen bir bedel sanıp reel harcama ya da dolaylı transfer zannediyorsun."},"E":{"gercek":"Kaynak metin dul ve yetim aylığını dolaysız transfer örneği olarak sayar; malî transfer borç faizi gibi ödemeleri kapsar.","ayirt":"Bu ödeme kamu borcunun bir sonucu mu, yoksa doğrudan kişiye yapılan bir sosyal ödeme mi?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Dul-yetim aylığını borç faizi gibi malî transfer kategorisine sokup dolaylı sanıyorsun."},"A":{"gercek":"Dolaysız-dolaylı ayrımı ödemenin fiyat mekanizmasından geçip geçmediğine bakar; kurumun sadece aracı olması sonucu değiştirmez.","ayirt":"Bu para, piyasa fiyatını değiştirerek mi yoksa doğrudan kişinin cebine mi gidiyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Ödeme bir kurum üzerinden gittiği için bunun dolaylı transfer olduğunu düşünüyorsun."},"D":{"gercek":"Kaynak metin tarım ürünü destekleme alımını fiyat mekanizması üzerinden yapılan dolaylı transfere örnek gösterir.","ayirt":"Ödeme piyasadaki fiyatı etkileyerek mi yapılıyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Bu şıkkı elersen, destekleme alımını doğrudan kişiye ödeme gibi görüp dolaysız sanmışsındır."},"B":{"gercek":"Sosyal yardım kaynak metninde açıkça dolaysız transfer örneği olarak sayılır; kişiye doğrudan ödenir.","ayirt":"Ödeme fiyat üzerinden mi yoksa kişiye elden mi yapılıyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"\u0027Sosyal\u0027 kelimesini görünce bunu sosyal-iktisadi-mali ayrımıyla karıştırıp dolaylı sanıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 99"},"kural":"Fiyat mekanizması üzerinden yapılan aktarım dolaylı transferdir; üretimi ve fiyatı etkileyen aktarım iktisadi transferdir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 99","sonDonem":3,"sim":null,"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Örnek olayda \u0027kime\u0027 ve \u0027nasıl\u0027 ödendiğine bak: doğrudan kişiye mi, yoksa fiyat üzerinden mi; sonra amacı üretim mi gelir dağılımı mı sorusuyla ikinci ekseni belirle.","konu":"transfer harcamaları sınıflandırma","tablo":{"satirlar":[["A) Dolaysız ve sosyal transfer harcamasıdır","p.28","YANLIŞ ifade"],["B) Dolaylı ve iktisadi transfer harcamasıdır","p.28","doğru ifade"],["C) Dolaysız ve iktisadi transfer harcamasıdır","p.28","YANLIŞ ifade"],["D) Dolaylı ve sosyal transfer harcamasıdır","p.28","YANLIŞ ifade"],["E) Reel harcama niteliğinde bir yatırım harcamasıdır","p.28","YANLIŞ ifade"]],"basliklar":["Şık","Kaynak","Karar"]},"siklar":{"C":"Dolaysız ve iktisadi transfer harcamasıdır","E":"Reel harcama niteliğinde bir yatırım harcamasıdır","A":"Dolaysız ve sosyal transfer harcamasıdır","D":"Dolaylı ve sosyal transfer harcamasıdır","B":"Dolaylı ve iktisadi transfer harcamasıdır"},"kaynak":{"alinti":"(fiyat mekanizması üzerinden) ve","liste":[{"ad":"TEORI - transfer harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: TRANSFER HARCAMASI, devletin karşılığında mal veya hizmet almadan satın alma gücünü bir kesimden ötekine KARŞILIKSIZ aktarmasıdır. Reel harcamadan farkı budur: reel harcamada devlet üretim faktörü veya mal satın alır ve millî gelire doğrudan katkı yapar; transfer millî gelirin bileşimini ve dağılımını değiştirir, doğrudan artırmaz. SINIFLANDIRMA: (1) DOLAYSIZ–DOLAYLI: Dolaysız transfer, kişilere doğrudan ödenir (emekli aylığı, dul ve yetim aylığı, sosyal yardım, burs); dolaylı transfer, fiyat mekanizması üzerinden yapılır (tarım ürünü destekleme alımı, sübvansiyon, vergi indirimi yoluyla destek). (2) GELİR TRANSFERİ – SERMAYE TRANSFERİ: Gelir transferi tüketimi finanse eder (sosyal yardım); sermaye transferi yatırımı finanse eder (KİT\u0027lere sermaye aktarımı, yatırım teşviki). (3) İKTİSADİ – SOSYAL – MALÎ TRANSFERLER: İktisadi transferler üretimi ve fiyatı etkiler (sübvansiyon, ihracat desteği); sosyal transferler gelir dağılımını düzeltir (yardımlar, sosyal güvenlik ödemeleri); malî transferler kamu borcunun faizi ve benzeri ödemelerdir. (4) İÇ – DIŞ TRANSFER: Yurt içi kesimlere veya yurt dışına (dış yardım, uluslararası kuruluş aidatı) yapılan transferler. (5) VERİMLİ – VERİMSİZ: Üretim kapasitesini artıran (yatırım teşviki) ve artırmayan (tüketim yardımı) transferler. KÜÇÜK ÖRNEK: Çiftçiye ödenen destekleme primi iktisadi ve dolaylı transfer; yaşlılık aylığı sosyal ve dolaysız transfer; devlet tahvili faizi malî transferdir. Bir hastanenin doktor maaşı ise transfer değil reel (cari) harcamadır. SINAV TUZAĞI: (1) Faiz öde…"},{"ad":"TEORI - kamu harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok, analitik bütçe sınıflandırması 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu uygulamasıdır). TANIM VE KURAL: Kamu harcamaları üç temel ölçüte göre sınıflandırılır. (1) İDARİ (KURUMSAL) SINIFLANDIRMA: Harcamayı hangi kurumun yaptığına bakar (bakanlıklar, üniversiteler). Kimin sorumlu olduğunu gösterir, hizmetin niteliğini göstermez. (2) FONKSİYONEL (İŞLEVSEL) SINIFLANDIRMA: Harcamanın hangi kamu hizmetine yöneldiğine bakar; uluslararası standartta on ana işlev vardır: genel kamu hizmetleri, savunma, kamu düzeni ve güvenlik, ekonomik işler, çevre koruma, iskân ve toplum refahı, sağlık, dinlenme–kültür–din, eğitim, sosyal güvenlik ve sosyal yardım. (3) EKONOMİK SINIFLANDIRMA: Harcamanın ekonomiye etkisine bakar: cari harcamalar (personel, mal ve hizmet alımı), yatırım (sermaye) harcamaları, transfer harcamaları (cari ve sermaye transferleri), faiz giderleri, borç verme. Bir başka kesit REEL–TRANSFER ayrımıdır: reel harcamada devlet karşılığında mal veya hizmet alır (maaş, bina), transferde karşılıksız satın alma gücü aktarır (emekli aylığı, faiz, sübvansiyon). ANALİTİK BÜTÇE SINIFLANDIRMASI dört boyutu birlikte kullanır: kurumsal, fonksiyonel, finansman tipi (genel bütçe, özel bütçe, döner sermaye, dış proje kredisi gibi) ve ekonomik. KÜÇÜK ÖRNEK: Bir devlet hastanesinin hemşire maaşı: kurumsal olarak Sağlık Bakanlığı, fonksiyonel olarak sağlık, ekonomik olarak cari (personel) harcamadır; emekli aylığı ödemesi ekonomik olarak transferdir, fonksiyonel olarak sosyal güvenlik. SINAV TUZAĞI: (1) Fonksiyonel sınıflandırma \u0027ne için\u0027, ekonomik s…"}],"hakem":"Soru, transfer harcamalarının sınıflandırılması konusunun özünü ölçüyor; tarım ürünü destekleme alımı, kaynak metinde \"dolaylı transfer\" (fiyat mekanizması üzerinden) ve \"iktisadi transfer\" (üretimi ve fiyatı etkileyen) olarak açıkça tanımlanmış, B seçeneği bu tanımlara tam uygundur."},"kayitlar":[],"sade":{"siklar":{"C":"İşlem fiilen çiftçiye para verilmektedir diye düşünülse de aktarım fiyat farkı yoluyla gerçekleştiğinden dolaylı transferdir, dolaysız değildir.","E":"Devlet ürünü fiilen alsa da ödenen fazla bedel karşılıksız satın alma gücü aktarımıdır; bu yüzden transfer harcamasıdır, reel harcama değildir.","D":"Çiftçiyi desteklemesi sosyal amaçlı olsa da üretim ve fiyatı doğrudan etkilediğinden bu iktisadi transferdir; sosyal transfer sadece gelir dağılımını düzeltmeye yönelik olmalıdır.","A":"Destekleme alımı çiftçiye doğrudan para ödeyerek değil fiyat farkıyla yapıldığı için dolaysız değildir; ayrıca gelir dağılımını düzeltme amacı olmadığı için sosyal transferdir değildir."},"dogru":"Devlet piyasa fiyatının üzerinde alım yaparak, fiyat farkı aracılığıyla (dolaylı olarak) çiftçiye gelir aktarır ve üretimi etkilediğinden (iktisadi olarak) bu bir dolaylı ve iktisadi transfer harcamasıdır.","sinav":"Tarım ürünleri destekleme alımında piyasa fiyatının üzerinde satın alma, fiyat mekanizması üzerinden yapıldığı için dolaylı transfer; üretim ve fiyatı etkilediği için iktisadi transferdir.","kavramlar":[{"kaynak":"TEORI","tanim":"Devletin karşılığında mal veya hizmet almadan satın alma gücünü bir kesimden ötekine karşılıksız aktarması. Reel harcamadan farkı, millî gelire doğrudan katkı yapmayıp gelir dağılımını değiştirmesidir.","ad":"Transfer harcaması"},{"kaynak":"TEORI","tanim":"Fiyat mekanizması üzerinden yapılan transfer harcaması. Örneğin tarım ürünü destekleme alımı, sübvansiyon, vergi indirimi yoluyla destek.","ad":"Dolaylı transfer"},{"kaynak":"TEORI","tanim":"Üretimi ve fiyatı etkileyen transfer harcaması. Sübvansiyon, ihracat desteği, tarımsal destekler bu kategoriye girer.","ad":"İktisadi transfer"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Devlet, tarım ürünleri destekleme alım fiyatını piyasa fiyatının üzerinde belirleyerek çiftçiden ürünü bu fiyattan satın almaktadır. Bu uygulama transfer harcamalarının sınıflandırılmasında aşağıdakilerden hangisinde doğru nitelendirilmiştir?","kayitBaslik":"","id":"sgs-t1-genel-maliye-zor/kp-10","verilenler":[],"dayanak":"TEORİ - transfer harcamaları sınıflandırma (dolaysız-dolaylı, iktisadi-sosyal-mali transfer ayrımı)","dogru":"B","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Olay: Belediye, süt üreticisinden litre başına piyasada 8 lira olan sütü 12 liradan alıyor. 2023 yılında 100.000 litre alım yapılıyor ve fark 400.000 lira tutuyor.","anlatim":"Burada devlet üreticiye doğrudan çek yazmıyor, piyasa fiyatının üstünde alım yaparak parayı fiyat mekanizması üzerinden aktarıyor. Bu olayda beş sınıflandırma ifadesini tek tek deneyeceğiz.","doldur":[]},{"formul":"Ne yapacağız: Bu 400.000 liralık farkı iki eksende sınıflandıracağız — aktarım biçimi (dolaysız mı dolaylı mı) ve aktarımın amacı (sosyal mi iktisadi mi). Beş ifadeyi bu olayda tek tek deneyeceğiz.","anlatim":"Kural şu: fiyat üzerinden yapılan aktarım dolaylı, kişiye doğrudan yapılan aktarım dolaysızdır. Üretimi ve fiyatı etkileyen aktarım iktisadi, gelir dağılımını düzelten aktarım sosyaldir.","doldur":[]},{"doldur":[[0,1],[0,2]],"sik":"A","paragraf":"p.28","karar":"yanlış","anlatim":"Üreticiye yardım amaçlı gibi görünüyor ama ödeme fiyat farkı üzerinden yani dolaylı yapılıyor. Ayrıca üretimi teşvik ettiği için sosyal değil iktisadi transferdir.","formul":"Şık A: Sen bu 400.000 lirayı \u0027dolaysız ve sosyal transfer\u0027 diye kayda geçiriyorsun, doğru mu?"},{"doldur":[[1,1],[1,2]],"sik":"B","paragraf":"p.28","karar":"doğru","anlatim":"Evet, para üreticiye doğrudan değil fiyat farkı yoluyla aktarılıyor, bu dolaylıdır. Fark üretim ve fiyat kararını etkilediği için de iktisadidir.","formul":"Şık B: Muhasebeci sana \u0027bu dolaylı ve iktisadi transferdir\u0027 diyor, onaylar mısın?"},{"doldur":[[2,1],[2,2]],"sik":"C","paragraf":"p.28","karar":"yanlış","anlatim":"İktisadi kısmı doğru ama dolaysız yanlış; para kişiye maaş gibi elden ödenmiyor, fiyat mekanizmasından geçerek ulaşıyor. Dolaysız transfer emekli aylığı gibi doğrudan ödemelerdir.","formul":"Şık C: Bir stajyer \u0027para çiftçinin eline geçiyor, dolaysızdır ama iktisadidir\u0027 diyor, katılır mısın?"},{"doldur":[[3,1],[3,2]],"sik":"D","paragraf":"p.28","karar":"yanlış","anlatim":"Dolaylı kısmı doğru çünkü fiyat üzerinden aktarım var. Ama sosyal yanlış, çünkü bu gelir dağılımını düzeltmiyor, üretimi ve fiyatı etkiliyor, yani iktisadi olmalı.","formul":"Şık D: Denetçi raporunda \u0027dolaylı ve sosyal transfer harcamasıdır\u0027 yazıyor, düzeltir misin?"},{"doldur":[[4,1],[4,2]],"sik":"E","paragraf":"p.28","karar":"yanlış","anlatim":"Hayır, reel harcamada ödenen bedel piyasa değerine eşit olur ve devlet karşılığında gerçek bir varlık edinir. Burada piyasa üstü fazla ödeme karşılıksız bir aktarım, yani transferdir, yatırım değil.","formul":"Şık E: Bütçe uzmanı \u0027devlet ürünü satın aldı, bu bir yatırım harcamasıdır\u0027 diyor, kabul eder misin?"},{"formul":"Kapanış: A ✗ B ✓ C ✗ D ✗ E ✗","anlatim":"Tek doğru B: destekleme alımı fiyat üzerinden yapıldığı için dolaylı, üretimi etkilediği için iktisadi transferdir. Kendine hep şunu sor: bu ödeme kişiye doğrudan mı gidiyor yoksa fiyat farkı mı, ve amacı gelir dağıtmak mı yoksa üretimi yönlendirmek mi?","doldur":[]}],"anahtar":[{"ornek":"aktarımdır","kok":"aktarı"},{"ornek":"transfer","kok":"transf"},{"ornek":"üretimi","kok":"üretim"},{"ornek":"iktisadi","kok":"iktisa"},{"ornek":"üzerinden","kok":"üzerin"},{"ornek":"dolaylı","kok":"dolayl"}],"konuGiris":{"harita":"Ne zaman test edilir: Devletin bir kesime karşılıksız kaynak aktardığı bir örnek verildiğinde bunun hangi transfer türü olduğu sorulur. Nasıl ölçülür: Aktarımın kişiye direkt mi yoksa fiyat mekanizması üzerinden mi yapıldığına ve üretimi mi gelir dağılımını mı etkilediğine bakılır. Nasıl kaydedilir: Bütçede ekonomik sınıflandırmada \u0027transfer harcamaları\u0027 kalemi altında, dolaylı/dolaysız ve iktisadi/sosyal alt başlıklarıyla değerlendirilir.","desen":"Soru, destekleme alım fiyatının piyasa üstünde belirlenmesini dolaylı ve iktisadi transfer olarak tanıma bağlar; öğrenciler bunu dolaysız sosyal yardımla karıştırır. Tuzak, paranın kişiye değil fiyat üzerinden aktarılmasını fark etmemektir. Bu soru dolaylı-dolaysız ve iktisadi-sosyal transfer ayrımı noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Karşılığında mal veya hizmet alınmadan yapılan karşılıksız aktarım","ad":"Transfer harcaması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Kişiye değil fiyat mekanizması üzerinden yapılan destek","ad":"Dolaylı transfer","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Üretimi ve fiyatı etkileyen destek türü","ad":"İktisadi transfer","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Devletin karşılığında mal veya hizmet aldığı harcama türü","ad":"Reel harcama","kim":"kanun sabitler"}],"sinavda":"Soru bir destekleme alım uygulamasını verir ve bunun transfer sınıflandırmasındaki doğru nitelendirmesini ister.","panel_ornek":"Arkadaşın bir bakkala gidip 10 liralık ekmeği 15 liraya sattığını, aradaki 5 lirayı devletin bakkala ödediğini düşün; sen ekmeği yine piyasadan alıyorsun ama fiyat farkı görünmeden kapatılıyor. Bu, parayı doğrudan senin cebine koymadan fiyat üzerinden yapılan bir destek örneğidir.","ornek":"Arkadaşın bir bakkala gidip 10 liralık ekmeği 15 liraya sattığını, aradaki 5 lirayı devletin bakkala ödediğini düşün; sen ekmeği yine piyasadan alıyorsun ama fiyat farkı görünmeden kapatılıyor. Bu, parayı doğrudan senin cebine koymadan fiyat üzerinden yapılan bir destek örneğidir.","yontemler":"Aktarım kişiye direkt mi yapılıyor yoksa fiyat üzerinden mi yapılıyor sorusunu sor; fiyat üzerinden ise dolaylı, üretimi etkiliyorsa iktisadi transferdir.","nedir":"Transfer harcamaları, devletin karşılığında mal veya hizmet almadan yaptığı karşılıksız aktarımların sınıflandırılmasını inceler. Sınav bu aktarımın dolaylı mı dolaysız mı, iktisadi mi sosyal mi olduğunu ayırt edebilmeni ölçer."},"olay":"","tuzak":{"C":{"ad":"Doğrudan Ödeme Tuzağı","metin":"İşlemin çiftçiye para verilerek yapıldığını düşünüp dolaysız transfer sanırsın. Doğrusu: Aktarım fiyat farkı yoluyla yani dolaylı olarak gerçekleşir."},"E":{"ad":"Karşılık Alma Tuzağı","metin":"Devletin ürünü fiilen aldığını görüp reel/yatırım harcaması sanırsın. Doğrusu: Ödenen fazla bedel karşılıksız satın alma gücü aktarımıdır, bu yüzden transfer harcamasıdır, reel harcama değildir."},"D":{"ad":"Sosyal Amaç Tuzağı","metin":"Çiftçiyi desteklediği için sosyal transfer sanırsın. Doğrusu: Üretimi ve fiyatı etkilediği için bu bir iktisadi transferdir, sosyal transfer gelir dağılımını düzeltmeye yöneliktir."},"A":{"ad":"Amaç Karıştırma Tuzağı","metin":"Destekleme priminin gelir dağılımını düzelttiğini düşünüp sosyal transfer sayarsın, ayrıca kişiye doğrudan ödeme sanırsın. Doğrusu: Fiyat mekanizması üzerinden yapıldığı için dolaylı, üretimi etkilediği için iktisadi transferdir."}},"celdiriciYol":{"C":"Çiftçiye para gittiği görülüp dolaysız işaretlenir (fiyat farkı yoluyla aktarım katmanı atlanır)","E":"Ürünün fiilen alındığı görülüp reel/yatırım işaretlenir (karşılıksız fazla ödeme katmanı atlanır)","D":"Destek amacının sosyal olduğu sanılır, üretim etkisi katmanı atlanır","A":"Doğrudan ödeme algısı + yardım amacı bir araya gelince öğrenci sosyal-dolaysız çiftini işaretler (fiyat mekanizması katmanı atlanır)"},"hap":"Transfer harcaması karşılığında mal veya hizmet alınmadan yapılan aktarımdır; kişiye doğrudan ödenirse dolaysız, fiyat mekanizması üzerinden yapılırsa dolaylı, üretimi etkilerse iktisadi, gelir dağılımını düzeltirse sosyal transferdir.","teshis":{"C":{"gercek":"Dolaysız transfer kişiye doğrudan ödenir (emekli aylığı, burs); destekleme alımı fiyat farkı yoluyla yani dolaylı yapılır.","ayirt":"Ödeme bir maaş/yardım kalemi gibi mi yapılıyor, yoksa piyasa fiyatı mı değiştiriliyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Çiftçinin eline para geçtiğini görünce bunun doğrudan ödeme, yani dolaysız transfer olduğunu sanıyorsun."},"E":{"gercek":"Reel harcamada ödenen bedel piyasa değerine eşittir; piyasa üstü fazla ödeme karşılıksız satın alma gücü aktarımıdır, yani transferdir.","ayirt":"Ödenen bedelin tamamı mal karşılığı mı, yoksa piyasa fiyatını aşan kısmı karşılıksız mı aktarılıyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Devletin ürünü fiilen satın aldığını görünce karşılığında mal alındığını, dolayısıyla reel harcama olduğunu sanıyorsun."},"A":{"gercek":"Sosyal transfer gelir dağılımını düzeltmeye yönelirken iktisadi transfer üretim ve fiyatı etkiler; destekleme alımı üretimi etkilediği için iktisadidir.","ayirt":"Bu ödeme gelir dağılımını mı düzeltiyor, üretim kararını mı etkiliyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Destekleme priminin çiftçiye yardım amaçlı olduğunu görünce onu sosyal transfer, doğrudan ödendiğini sanıp dolaysız transfer zannediyorsun."},"D":{"gercek":"Sosyal transfer gelir dağılımını düzeltir (sosyal yardım); destekleme alımı üretim ve fiyatı etkilediği için iktisadi transferdir.","ayirt":"Bu harcama gelir dağılımını mı düzeltiyor, üretimi mi teşvik ediyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Çiftçiye destek verildiğini görünce bunun sosyal amaçlı olduğunu, dolayısıyla sosyal transfer olduğunu düşünüyorsun."},"B":{"gercek":"Dolaylı transfer fiyat mekanizması üzerinden yapılır (sübvansiyon, destekleme alımı); iktisadi transfer üretimi ve fiyatı etkiler.","ayirt":"Ödeme doğrudan kişiye mi gidiyor, yoksa fiyat farkı üzerinden mi aktarılıyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Bu şıkkı elersen, fiyat üzerinden yapılan aktarımı dolaysız transferle karıştırıyorsundur."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2025/2 Soru 99"},"kural":"Kişiye/kuruma fiyat mekanizması olmadan doğrudan ödeme yapılması dolaysız transferi, yatırımı finanse etmesi sermaye transferini gösterir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2025/2 Soru 99","sonDonem":3,"sim":null,"hakem":"EVET","aritmetik":null},"kayit":[],"teori":false,"taktik":"Sınıflandırma sorularında önce \u0027karşılığında mal/hizmet var mı\u0027 sorusuyla transfer olup olmadığına bak, sonra ayrı ayrı \u0027nasıl ödendi\u0027 ve \u0027neyi finanse etti\u0027 sorularını cevapla.","konu":"transfer harcamaları sınıflandırma","tablo":null,"siklar":{"C":"Dolaysız transfer ve sermaye transferi niteliğindedir","E":"Reel harcama niteliğindedir, transfer harcaması değildir","A":"Dolaylı transfer ve sermaye transferi niteliğindedir","D":"Sosyal transfer ve gelir transferi niteliğindedir","B":"Dolaysız transfer ve gelir transferi niteliğindedir"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - transfer harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: TRANSFER HARCAMASI, devletin karşılığında mal veya hizmet almadan satın al
