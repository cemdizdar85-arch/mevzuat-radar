ma gücünü bir kesimden ötekine KARŞILIKSIZ aktarmasıdır. Reel harcamadan farkı budur: reel harcamada devlet üretim faktörü veya mal satın alır ve millî gelire doğrudan katkı yapar; transfer millî gelirin bileşimini ve dağılımını değiştirir, doğrudan artırmaz. SINIFLANDIRMA: (1) DOLAYSIZ–DOLAYLI: Dolaysız transfer, kişilere doğrudan ödenir (emekli aylığı, dul ve yetim aylığı, sosyal yardım, burs); dolaylı transfer, fiyat mekanizması üzerinden yapılır (tarım ürünü destekleme alımı, sübvansiyon, vergi indirimi yoluyla destek). (2) GELİR TRANSFERİ – SERMAYE TRANSFERİ: Gelir transferi tüketimi finanse eder (sosyal yardım); sermaye transferi yatırımı finanse eder (KİT\u0027lere sermaye aktarımı, yatırım teşviki). (3) İKTİSADİ – SOSYAL – MALÎ TRANSFERLER: İktisadi transferler üretimi ve fiyatı etkiler (sübvansiyon, ihracat desteği); sosyal transferler gelir dağılımını düzeltir (yardımlar, sosyal güvenlik ödemeleri); malî transferler kamu borcunun faizi ve benzeri ödemelerdir. (4) İÇ – DIŞ TRANSFER: Yurt içi kesimlere veya yurt dışına (dış yardım, uluslararası kuruluş aidatı) yapılan transferler. (5) VERİMLİ – VERİMSİZ: Üretim kapasitesini artıran (yatırım teşviki) ve artırmayan (tüketim yardımı) transferler. KÜÇÜK ÖRNEK: Çiftçiye ödenen destekleme primi iktisadi ve dolaylı transfer; yaşlılık aylığı sosyal ve dolaysız transfer; devlet tahvili faizi malî transferdir. Bir hastanenin doktor maaşı ise transfer değil reel (cari) harcamadır. SINAV TUZAĞI: (1) Faiz öde…"},{"ad":"TEORI - kamu harcamalari siniflandirma","metin":"TEORİ (maliye; mevzuat maddesi yok, analitik bütçe sınıflandırması 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu uygulamasıdır). TANIM VE KURAL: Kamu harcamaları üç temel ölçüte göre sınıflandırılır. (1) İDARİ (KURUMSAL) SINIFLANDIRMA: Harcamayı hangi kurumun yaptığına bakar (bakanlıklar, üniversiteler). Kimin sorumlu olduğunu gösterir, hizmetin niteliğini göstermez. (2) FONKSİYONEL (İŞLEVSEL) SINIFLANDIRMA: Harcamanın hangi kamu hizmetine yöneldiğine bakar; uluslararası standartta on ana işlev vardır: genel kamu hizmetleri, savunma, kamu düzeni ve güvenlik, ekonomik işler, çevre koruma, iskân ve toplum refahı, sağlık, dinlenme–kültür–din, eğitim, sosyal güvenlik ve sosyal yardım. (3) EKONOMİK SINIFLANDIRMA: Harcamanın ekonomiye etkisine bakar: cari harcamalar (personel, mal ve hizmet alımı), yatırım (sermaye) harcamaları, transfer harcamaları (cari ve sermaye transferleri), faiz giderleri, borç verme. Bir başka kesit REEL–TRANSFER ayrımıdır: reel harcamada devlet karşılığında mal veya hizmet alır (maaş, bina), transferde karşılıksız satın alma gücü aktarır (emekli aylığı, faiz, sübvansiyon). ANALİTİK BÜTÇE SINIFLANDIRMASI dört boyutu birlikte kullanır: kurumsal, fonksiyonel, finansman tipi (genel bütçe, özel bütçe, döner sermaye, dış proje kredisi gibi) ve ekonomik. KÜÇÜK ÖRNEK: Bir devlet hastanesinin hemşire maaşı: kurumsal olarak Sağlık Bakanlığı, fonksiyonel olarak sağlık, ekonomik olarak cari (personel) harcamadır; emekli aylığı ödemesi ekonomik olarak transferdir, fonksiyonel olarak sosyal güvenlik. SINAV TUZAĞI: (1) Fonksiyonel sınıflandırma \u0027ne için\u0027, ekonomik s…"}],"hakem":"Soru transfer harcamaları sınıflandırması konusunun temel kurallarını (dolaysız-dolayli, gelir-sermaye transferi ayrımı) doğru ölçüyor; C sikki (Dolaysız transfer ve sermaye transferi) kaynak metinde açıkça desteklenen kural ve tanımlara dayanan doğru cevaptır."},"kayitlar":[],"sade":{"siklar":{"D":"Üretim ve yatırımı etkileyen bu aktarım iktisadi transfer niteliğindedir; sosyal yardım değildir ve sosyal transfer sınıflaması burada uygulanmaz.","E":"Soru açıkça belirttiği gibi ödeme karşılığında hiçbir mal veya hizmet alınmadığından bu reel harcama değil, transfer harcamasıdır.","A":"Sübvansiyon gibi piyasa fiyatı üzerinden yapılan aktarımlar dolaylı transferdir. Burada ise para doğrudan kuruma verildiğinden dolaysızlıktan söz etmek yanlıştır.","B":"Transfer tüketim harcamasını değil, burada yatırım (üretim tesisi kurma) amaçlı olduğundan sermaye transferidir; gelir transferi değildir."},"dogru":"Devlet doğrudan nakit para verdiği için bu dolaysız transferdir. Yatırım tesisi kurması için para aktarıldığı için sermaye transferidir. İkisi birlikte değerlendirilince dolaysız sermaye transferi cevabı doğrudur.","sinav":"Kamu Malî Yönetimi ve Kontrol Kanunu 5018 sayılı Kanun uyarınca ekonomik sınıflandırmada karşılığında mal veya hizmet alınmayan, satın alma gücünün karşılıksız aktarıldığı harcamalar transfer harcamasıdır.","kavramlar":[{"kaynak":"TEORI","tanim":"Devletin karşılığında mal veya hizmet almadan satın alma gücünü bir kesimden ötekine karşılıksız aktarması; millî geliri doğrudan artırmaz, bileşimini ve dağılımını değiştirir.","ad":"Transfer harcaması"},{"kaynak":"TEORI","tanim":"Kişilere veya kurumlara fiyat mekanizması kullanılmadan doğrudan ödeme yapılan transfer harcaması; emekli aylıkları, sosyal yardımlar bunun örnekleridir.","ad":"Dolaysız transfer"},{"kaynak":"TEORI","tanim":"Yatırımı finanse eden transfer harcaması; alıcının sermaye stokunu artıran veya mal varlığını arttıran aktarımlardır.","ad":"Sermaye transferi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2026/1"]},"oyun":null,"tip":"teori","soru":"Devlet, sürekli zarar eden bir kamu iktisadi teşebbüsüne yeni üretim tesisi kurması için doğrudan nakit sermaye aktarmıştır; bu ödeme karşılığında herhangi bir mal veya hizmet alınmamaktadır. Söz konusu harcama, transfer harcamaları sınıflandırmasına göre aşağıdakilerden hangisinde doğru nitelendirilmiştir?","kayitBaslik":"","id":"sgs-t1-genel-maliye-cokzor/kp-10","verilenler":[],"dayanak":"TEORİ - transfer harcamaları sınıflandırma (öğreti notu)","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[],"anahtar":[{"ornek":"transfer","kok":"transf"},{"ornek":"yatırımı","kok":"yatırı"},{"ornek":"mekanizmasız","kok":"mekani"},{"ornek":"sermaye","kok":"sermay"},{"ornek":"doğrudan","kok":"doğrud"},{"ornek":"finanse","kok":"finans"}],"konuGiris":{"harita":"Ne zaman test edilir: bir devlet ödemesinin karşılığında mal/hizmet alınıp alınmadığı sorulduğunda. Nasıl ölçülür: ödemenin tüketimi mi yatırımı mı finanse ettiğine bakılarak (gelir mi sermaye mi transferi) belirlenir. Nasıl kaydedilir: ekonomik sınıflandırmada \u0027transfer harcamaları\u0027 kalemi altında, alt türüyle (sermaye transferi) etiketlenir.","desen":"Soru, sürekli zarar eden bir KİT\u0027e yeni tesis kurması için karşılıksız nakit verilmesini anlatır; öğrenci bunu \u0027reel harcama\u0027 veya \u0027gelir transferi\u0027 ile karıştırmaya itilir. Doğru cevap, ödemenin yatırımı finanse ettiği için \u0027sermaye transferi\u0027 olduğunu görmektir. Bu soru transfer harcamaları sınıflandırma p.28 noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Karşılığında mal veya hizmet alınmayan karşılıksız ödeme","ad":"Transfer harcaması","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Yatırımı finanse eden karşılıksız aktarım, örneğin KİT\u0027e sermaye desteği","ad":"Sermaye transferi","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Tüketimi finanse eden karşılıksız aktarım, örneğin sosyal yardım","ad":"Gelir transferi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Devletin karşılığında mal veya hizmet aldığı harcama türü","ad":"Reel harcama","kim":"kanun sabitler"}],"sinavda":"Karşılığında mal/hizmet alınmayan, yatırım amaçlı bir devlet ödemesi anlatılır ve bu ödemenin transfer sınıflandırmasındaki doğru türü sorulur.","panel_ornek":"Bir hayır kurumu, ihtiyaç sahibi bir aileye kirasını ödemesi için 2 defa 300 TL karşılıksız yardım yapıyor; aile bu parayla kuruma hiçbir şey satmıyor ya da hizmet vermiyor. Aynı mantıkla devlet de bazen hiçbir mal/hizmet almadan para aktarır; işte bu \u0027transfer harcaması\u0027dır.","ornek":"Bir hayır kurumu, ihtiyaç sahibi bir aileye kirasını ödemesi için 2 defa 300 TL karşılıksız yardım yapıyor; aile bu parayla kuruma hiçbir şey satmıyor ya da hizmet vermiyor. Aynı mantıkla devlet de bazen hiçbir mal/hizmet almadan para aktarır; işte bu \u0027transfer harcaması\u0027dır.","yontemler":"Önce \u0027karşılığında mal/hizmet var mı\u0027 sorusuyla transfer mi reel mi olduğu ayrılır; sonra \u0027tüketim mi yatırım mı finanse ediyor\u0027 sorusuyla gelir/sermaye transferi ayrımı yapılır.","nedir":"Transfer harcamaları, devletin karşılığında mal veya hizmet almadan yaptığı karşılıksız ödemelerdir. Sınav, bu harcamanın hangi alt türde (gelir/sermaye, dolaysız/dolaylı) sınıflandığını ölçer."},"olay":"Doğrudan ödeme + yatırım amacı birlikte değerlendirilir.","tuzak":{"D":{"ad":"Boyut Karıştırma Tuzağı","metin":"İktisadi-sosyal-mali transfer ayrımını gelir-sermaye ayrımıyla harmanlayıp KİT\u0027e yardımı sosyal transfer sanırsın. Doğrusu: üretim ve yatırımı etkileyen bu aktarım iktisadi transfer, finansman amacı bakımından da sermaye transferidir; sosyallik burada söz konusu değildir."},"E":{"ad":"Karşılıksızlık Atlama Tuzağı","metin":"Devletin para verdiği için mal/hizmet aldığını, dolayısıyla reel harcama olduğunu düşünürsün. Doğrusu: ödeme karşılığında hiçbir mal veya hizmet alınmadığı açıkça belirtildiğinden bu bir transfer harcamasıdır, reel harcama değildir."},"A":{"ad":"Fiyat Mekanizması Tuzağı","metin":"Sübvansiyon örneğindeki gibi piyasa fiyatı üzerinden yapılan bir aktarım olduğunu düşünürsün. Doğrusu: para doğrudan kuruma verildiği için ödeme dolaysızdır, dolaylılık burada yoktur."},"B":{"ad":"Tüketim-Yatırım Karıştırma Tuzağı","metin":"Transferin cari (tüketim) harcamayı finanse ettiğini sanırsın. Doğrusu: aktarım üretim tesisi kurmak yani yatırım amaçlı olduğundan sermaye transferidir."}},"celdiriciYol":{"D":"İktisadi-sosyal-mali üçlü ayrımı ile dolaysız-dolaylı ayrımını birleştirip yardımı otomatik olarak \u0027sosyal\u0027 etiketlersin, sonra gelir transferiyle eşleştirirsin (boyut karıştırma).","E":"Devletten kuruma para çıktığı için bunu otomatik olarak \u0027devlet bir şey satın aldı\u0027 şeklinde okur, karşılıksızlık şartını gözden kaçırırsın (reel-transfer ayrımını atlama).","A":"Ödemenin kuruma yapıldığını görüp sübvansiyon örneğiyle karıştırarak \u0027fiyat mekanizması üzerinden yapılmış\u0027 sonucuna ulaşırsın (dolaysız-dolaylı ayrımını atlama).","B":"Sermaye aktarımının kuruma doğrudan gittiğini doğru görsen de amacı (yatırım) okumadan \u0027her doğrudan ödeme gelirdir\u0027 hatasına düşersin (gelir-sermaye ayrımını atlama)."},"hap":"Transfer harcaması karşılıksızdır; doğrudan ve fiyat mekanizmasız yapılırsa dolaysız, yatırımı finanse ediyorsa sermaye transferidir; bu ölçütler aynı işlemde birlikte değerlendirilir.","teshis":{"C":{"gercek":"Transfer harcamaları aynı anda birden çok ölçütle sınıflandırılır; doğrudan ödeme dolaysızlığı, yatırım amacı ise sermaye transferini birlikte belirler.","ayirt":"Ödeme nasıl yapıldı (doğrudan mı, fiyat üzerinden mi) ve hangi amaca hizmet etti (tüketim mi, yatırım mı)?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Bu şıkkı eleyen öğrenci, tek bir sınıflandırma ölçütünün (yalnız dolaysız ya da yalnız sermaye) yeteceğini düşünüp diğer boyutu gözden kaçırır."},"E":{"gercek":"Reel harcamada devlet karşılığında mal veya hizmet edinir; soruda açıkça mal/hizmet alınmadığı belirtildiğinden işlem karşılıksız aktarım, yani transferdir.","ayirt":"Devlet bu ödeme karşılığında elle tutulur bir mal veya hizmet mi almıştır?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Devletin para çıkışı olduğu her işlemde karşılığında bir şey alındığını, dolayısıyla reel harcama olduğunu düşünüyorsun."},"A":{"gercek":"Dolaylı transfer fiyat mekanizması üzerinden yapılır (destekleme alımı, sübvansiyon); burada nakit doğrudan kuruma aktarılmıştır, fiyat müdahalesi yoktur.","ayirt":"Bu para kuruma doğrudan mı gitti, yoksa bir fiyat/piyasa işlemi üzerinden mi aktarıldı?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Devletten kuruma giden her destek parasını, tarım desteklemesi gibi fiyat üzerinden yapılan bir ödeme sanıyorsun."},"D":{"gercek":"Sosyal transfer gelir dağılımını düzeltir (emekli aylığı, sosyal yardım); üretimi ve fiyatı etkileyen KİT\u0027e sermaye aktarımı iktisadi transferdir, ayrıca amaç yatırım olduğundan sermaye transferidir.","ayirt":"Bu para bireyin gelirini mi düzeltiyor, yoksa bir üretim biriminin yatırımını mı finanse ediyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"KİT\u0027e yapılan her yardımı, gelir dağılımını düzelten bir sosyal yardım gibi görüyorsun."},"B":{"gercek":"Gelir transferi tüketimi, sermaye transferi yatırımı finanse eder; burada amaç yeni üretim tesisi kurmaktır, bu yatırım finansmanıdır.","ayirt":"Bu ödeme günlük tüketimi mi, yoksa bir yatırım projesini mi finanse ediyor?","paragraf":"TEORİ - transfer harcamaları sınıflandırma","yanilgi":"Transferin amacını değil, sadece kime gittiğini önemseyip her doğrudan ödemeyi gelir transferi sayıyorsun."}},"verilen":[],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"Dolaylı vergiler mal ve hizmetlerin fiyatına gömülüdür; mükellef vergiyi ayrı bir ödeme olarak hissetmediği için vergiye karşı direnç düşüktür ve buna mali anestezi denir. Dolaysız vergiler ise beyanla ödendiği ve mükellefin kişisel durumunu izlediği için hissedilir.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Direnç sorularında verginin ne zaman ve nasıl ödendiğini sor; ayrı bir ödeme anı varsa direnç yüksek, yoksa düşüktür.","konu":"vergi ozellikleri","tablo":{"satirlar":[["VERİLENLER","-"],["Gözlenen sonuç","Vergiye karşı direncin düşük olması"],["Sebep","Verginin fiyata gömülü olması"],["HESAP","-"],["Ne soruluyor","Dolaylı vergilerde vergiye karşı direncin düşük olmasının sebebi aşağıdakilerden hangisidir?"],["Kural","Dolaylı vergiler mal ve hizmetlerin fiyatına gömülüdür; mükellef vergiyi ayrı bir ödeme olarak hissetmediği için vergiye karşı direnç düşüktür ve buna mali anestezi denir. Dolaysız vergiler ise beyanla ödendiği ve mükellefin kişisel durumunu izlediği için hissedilir."],["Doğru şık","A) Verginin fiyat içinde hissedilmemesi"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Mükellefin kişisel durumunun dikkate alınması","E":"Verginin yalnız lüks mallardan alınması","A":"Verginin fiyat içinde hissedilmemesi","D":"Verginin doğrudan beyanla ödenmesi","B":"Verginin artan oranlı olması"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - dolayli vergiler ozellikleri","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: DOLAYLI VERGİLER mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü vergilerdir: katma değer vergisi, özel tüketim vergisi, gümrük vergisi, banka ve sigorta muameleleri vergisi, özel iletişim vergisi, damga vergisi. DOLAYSIZ VERGİLER gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınır: gelir vergisi, kurumlar vergisi, motorlu taşıtlar vergisi, emlak vergisi, veraset ve intikal vergisi. DOLAYLI VERGİLERİN ÖZELLİKLERİ: (1) YANSITILABİLİR: Kanuni mükellef (satıcı) vergiyi fiyata ekleyerek nihai tüketiciye aktarır; vergiyi fiilen taşıyan ile ödeyen ayrıdır. (2) TERSİNE ARTAN ORANLI (regresif) ETKİ: Herkes aynı oranı öder ama düşük gelirli gelirinin daha büyük kısmını tüketime ayırdığından vergi yükü gelire göre azalır; bu yüzden adaletsiz sayılır. (3) MALÎ ANESTEZİ: Vergi fiyatın içinde olduğundan hissedilmez, direnç düşüktür. (4) TAHSİLİ KOLAY VE VERİMLİ: Az sayıda satıcıdan toplanır, kaçak görece azdır, hasılat konjonktüre hızlı tepki verir. (5) Kişisel durumu dikkate almaz (objektif vergi). (6) Esnekliği düşük mallarda yansıma tüketiciye, yüksek mallarda satıcıya kalır. KÜÇÜK ÖRNEK: Asgari ücretli ile yüksek gelirli aynı ekmeği alırken aynı KDV\u0027yi öder; ödenen vergi asgari ücretlinin gelirine oranla daha büyüktür. SINAV TUZAĞI: (1) Katma değer vergisi ARTAN ORANLI değildir; tek ya da birkaç düz oran uygulanır, etkisi tersine artan oranlıdır. (2) Motorlu taşıtlar vergisi ve emlak vergisi DOLAYSIZdır (servet vergisi). (3) \u0027Dolaylı vergiler adaletli, dolaysız vergiler ver…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [1/3]","metin":"Madde 3- Münhasıran bu Kanunun uygulanmasında; a) Genel yönetim kapsamındaki kamu idareleri: Uluslararası sınıflandırmalara göre belirlenmiş olan, merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri, b) Merkezî yönetim kapsamındaki kamu idareleri: Bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerini, c) Düzenleyici ve denetleyici kurumlar: Bu Kanuna ekli (III) sayılı cetvelde yer alan kurumları, 22/12/2005 tarihli ve 5436 sayılı Kanunun 10 uncu maddesiyle, bu fıkraya \"25\" ibaresinden sonra gelmek üzere, \"42\" ibaresi; \"43\" ibaresinden sonra gelmek üzere, \"44\" ibaresi ve \"76\" ibaresinden sonra gelmek üzere, \"78\" ibaresi eklenmiştir. 1 d) Sosyal güvenlik kurumları: Bu Kanuna ekli (IV) sayılı cetvelde yer alan kamu kurumlarını, e) Mahallî idare: Yetkileri belirli bir coğrafi alan ve hizmetlerle sınırlı olarak kamusal faaliyet gösteren belediye, il özel idaresi ile bunlara bağlı veya bunların kurdukları veya üye oldukları birlik ve idareleri,2 f) Bütçe: Belirli bir dönemdeki gelir ve gider tahminleri ile bunların uygulanmasına ilişkin hususları gösteren ve usulüne uygun olarak yürürlüğe konulan belgeyi, g) Kamu kaynakları: Borçlanma suretiyle elde edilen imkânlar dahil kamuya ait gelirler, taşınır ve taşınmazlar, hesaplarda bulunan para, alacak ve haklar ile her türlü değerleri, h) Kamu gideri: Kanunlarına veya Cumhurbaşkanlığı kararnamelerine dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, sosyal güvenlik katkı payları, iç ve dış borç faizleri, borçlanma genel giderleri, borçlanma araçlarının iskontolu…"}],"hakem":"Soru dolaylı vergilerin özellikleri konusunda doğru bir kural soruyor, kaynak metinde açık desteği var, ders ve konu uyumlu, tek anlam, güncel ve teoriye dayalı."},"kayitlar":[],"sade":{"siklar":{"C":"Kişisel durumun dikkate alınması dolaysız vergilerin (gelir, kurumlar vergisi gibi) niteliğidir. Dolaylı vergiler objektiftir ve bu sebep direnci düşürmez.","E":"Dolaylı vergiler temel tüketim mallarını da kapsar, yalnız lüks mallardan alınmaz. Bu sebep direncin düşüklüğünü açıklamaz.","D":"Beyanla ödeme dolaysız vergilerde görülür ve vergiye karşı direnci artırır. Dolaylı vergiler beyan gerektirmez.","B":"Dolaylı vergiler düz oranlı uygulanır, artan oranlı değildir; etkisi tersine artan oranlıdır. Direncin düşüklüğünün sebebi bu değildir."},"dogru":"Dolaylı vergiler fiyatın içine gömülü olduğu için mükellef vergiyi ayrı bir ödeme olarak hissetmez. Mali anestezi denilen bu durum vergiye karşı direnci düşürür.","sinav":"Dolaylı vergilerde vergiye karşı direncin düşük olmasının sebebi verginin fiyat içinde hissedilmemesidir.","kavramlar":[{"kaynak":"TEORI","tanim":"Mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü vergilerdir.","ad":"Dolaylı vergiler"},{"kaynak":"TEORI","tanim":"Vergi fiyatın içinde olduğundan hissedilmez ve direnç düşüktür.","ad":"Mali anestezi"},{"kaynak":"TEORI","tanim":"Kanuni mükellef (satıcı) vergiyi fiyata ekleyerek nihai tüketiciye aktarır; vergiyi fiilen taşıyan ile ödeyen ayrı olur.","ad":"Yansıtılabilirlik"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[],"donemler":["2025/1"]},"oyun":null,"tip":"teori","soru":"Dolaylı vergilerde vergiye karşı direncin düşük olmasının sebebi aşağıdakilerden hangisidir?","kayitBaslik":"","id":"sgs-t4-maliye-cokzor/kp-06","verilenler":[{"deger":"Vergiye karşı direncin düşük olması","anlam":"Mali anestezi olarak adlandırılır.","ad":"Gözlenen sonuç"},{"deger":"Verginin fiyata gömülü olması","anlam":"Ayrı bir ödeme anı bulunmamasını sağlar.","ad":"Sebep"}],"dayanak":"Teori notu: dolaylı vergilerin özellikleri — dolaylı vergiler fiyatın içine gömülü vergilerdir, mali anestezi yaratır çünkü vergi fiyatın içinde olduğundan hissedilmez ve direnç düşüktür; ayrıca yansıtılabilir, tersine artan oranlı etki doğurur, tahsili kolay ve verimlidir, kişisel durumu dikkate almayan objektif vergilerdir","dogru":"A","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Adım 1 = Dolaylı vergi fiyatın içine gömülüdür","anlatim":"Tüketici ödeme yaparken vergiyi ayrı bir kalem olarak hissetmez.","doldur":[]},{"formul":"Adım 2 = Hissedilmeyen yük düşük direnç doğurur","anlatim":"Bu sonuca mali anestezi ya da vergi uyuşturması denir.","doldur":[[5,1]]},{"formul":"Karşıt = Dolaysız vergi beyanla ödenir ve hissedilir","anlatim":"Gelir ve kurumlar vergisinde mükellef ödediği tutarı açıkça görür, bu yüzden direnç yüksektir.","doldur":[[6,1]]}],"anahtar":[{"ornek":"anestezi","kok":"aneste"},{"ornek":"mükellef","kok":"mükell"},{"ornek":"direnç","kok":"direnç"},{"ornek":"vergiyi","kok":"vergiy"},{"ornek":"hissetmediği","kok":"hisset"},{"ornek":"gömülü","kok":"gömülü"}],"konuGiris":{"harita":"Ne zaman test edilir: dolaylı vergilerin özellikleri sorulduğunda test edilir. Nasıl ölçülür: doğru özelliğin (mali anestezi) şıklar arasından ayırt edilmesiyle ölçülür. Nasıl kaydedilir: doğru şık işaretlenerek, tuzak şıklar (adalet, yansıma başka biçimde) elenerek kaydedilir.","desen":"Soru genellikle dolaylı vergilerin hangi özelliğinin doğru/yanlış olduğunu sorar; KDV\u0027nin artan oranlı olduğu yanılgısı ve motorlu taşıtlar vergisinin dolaylı sayılması sık tuzaktır. Adalet-verimlilik yer değiştirmesi de klasik hatadır. Bu soru mali anestezi kavramından geliyor (p.dolaylı vergiler ozellikleri).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Verginin fiyata gömülü olup hissedilmemesi durumu","ad":"Mali anestezi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Kanuni mükellefin vergiyi fiyata ekleyip tüketiciye aktarması","ad":"Yansıma","kim":"piyasa fiyatlar"},{"kaynak":"kuraldan bilinir","tanim":"Düşük gelirlinin vergi yükünün gelire göre daha ağır olması","ad":"Tersine artan oranlılık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Mükellefin vergiyi hissedip tepki verme derecesi","ad":"Vergiye karşı direnç","kim":"kanun sabitler"}],"sinavda":"Soruda dolaylı vergilerin bir özelliği tanımlanır ve bu özelliğin adı ya da doğru açıklaması istenir.","panel_ornek":"Markette aldığın 20 liralık çikolatanın fiyatına gizlice 3 lira vergi eklenmiş, sen bunu fark etmeden ödüyorsun. Maaşından kesilen vergiyi ise açıkça görüp içerleyebiliyorsun. İşte bu görünmezlik, direncin düşük olmasının sebebidir.","ornek":"Markette aldığın 20 liralık çikolatanın fiyatına gizlice 3 lira vergi eklenmiş, sen bunu fark etmeden ödüyorsun. Maaşından kesilen vergiyi ise açıkça görüp içerleyebiliyorsun. İşte bu görünmezlik, direncin düşük olmasının sebebidir.","yontemler":"Şıkları elerken \u0027kişisel durum dikkate alınmaz mı\u0027 ve \u0027fiyata gömülü mü\u0027 sorularını sor; doğru cevap hep görünmezlik/mali anestezi ile ilgilidir.","nedir":"Vergi özellikleri konusu, vergilerin dolaylı/dolaysız gibi türlere göre farklı davranış göstermesini inceler. Sınav, hangi verginin hangi özelliğe (yansıma, adalet, direnç) sahip olduğunu bilip bilmediğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Ayrım Tuzağı","metin":"Kişisel durumun dikkate alınması dolaysız vergilerin niteliğidir. Doğrusu: sebep verginin fiyata gömülü olmasıdır."},"E":{"ad":"Kapsam Tuzağı","metin":"Dolaylı vergiler temel tüketim mallarını da kapsar. Doğrusu: sebep verginin fiyata gömülü olmasıdır."},"D":{"ad":"Ayrım Tuzağı","metin":"Beyanla ödeme dolaysız vergilerde görülür ve direnci artırır. Doğrusu: sebep verginin fiyata gömülü olmasıdır."},"B":{"ad":"Yapı Tuzağı","metin":"Dolaylı vergiler artan oranlı değildir, düz oranlıdır ve etkisi tersine artan oranlıdır. Doğrusu: sebep verginin hissedilmemesidir."}},"celdiriciYol":{},"hap":"Mali anestezi verginin görünmezliğidir: fiyata gömülü vergi ayrı bir ödeme anı yaratmadığı için direnç doğurmaz.","teshis":{"C":{"gercek":"Dolaylı vergi objektiftir ve kişisel durumu hiç dikkate almaz.","ayirt":"Vergi kişiye göre değişiyor mu?","paragraf":"Dolaylı vergiler notu","yanilgi":"Dolaylı vergiyi kişiselleştirilmiş sanıyorsun."},"E":{"gercek":"Katma değer vergisi temel tüketim mallarını da kapsar; etkisi bu yüzden tersine artan oranlıdır.","ayirt":"Vergi hangi mallardan alınıyor?","paragraf":"Dolaylı vergiler notu","yanilgi":"Dolaylı vergiyi lüks tüketimle sınırlıyorsun."},"A":{"gercek":"Vergi fiyatın içinde tahsil edildiği için ayrı bir ödeme anı yoktur; hissedilmeyen yükün siyasi ve toplumsal direnci de düşük olur.","ayirt":"Mükellef vergiyi ayrı bir ödeme olarak yapıyor mu?","paragraf":"Dolaylı vergiler notu","yanilgi":"Bu şıkkı eleyen öğrenci, tüketicinin fatura üzerindeki vergiyi gördüğü için dirençte fark olmayacağını düşünür."},"D":{"gercek":"Beyanla ödeme mükellefin vergiyi açıkça hissetmesine yol açar ve direnci artırır.","ayirt":"Ödeme beyanla mı, fiyat içinde mi yapılıyor?","paragraf":"Dolaylı vergiler notu","yanilgi":"Beyan usulünü dolaylı vergiye bağlıyorsun."},"B":{"gercek":"Dolaylı vergide tek ya da birkaç düz oran uygulanır; artan oranlılık gelir vergisinin özelliğidir.","ayirt":"Oran matraha göre değişiyor mu?","paragraf":"Dolaylı vergiler notu","yanilgi":"Dolaylı vergiyi artan oranlı sanıyorsun."}},"verilen":[[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"Dolaylı vergiler yansıtılabilir; kanuni mükellef vergiyi fiyata ekleyerek nihai tüketiciye aktarır ve vergiyi fiilen taşıyan ile ödeyen ayrılır. Yansımanın kime kalacağını esneklik belirler: esnekliği düşük mallarda yansıma tüketiciye, esnekliği yüksek mallarda satıcıya kalır.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Yansıma sorularında iki tarafın esnekliğini karşılaştır: esnekliği düşük olan taraf yükü taşır.","konu":"vergi ozellikleri","tablo":{"satirlar":[["VERİLENLER","-"],["Malın niteliği","Talebi esnek olmayan mal"],["Verginin türü","Tüketim üzerinden alınan dolaylı vergi"],["HESAP","-"],["Ne soruluyor","Talebi esnek olmayan bir malda tüketim vergisi getirildiğinde verginin yükü ağırlıklı olarak kime kalır?"],["Kural","Dolaylı vergiler yansıtılabilir; kanuni mükellef vergiyi fiyata ekleyerek nihai tüketiciye aktarır ve vergiyi fiilen taşıyan ile ödeyen ayrılır. Yansımanın kime kalacağını esneklik belirler: esnekliği düşük mallarda yansıma tüketiciye, esnekliği yüksek mallarda satıcıya kalır."],["Doğru şık","C) Ağırlıklı olarak tüketiciye kalır"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Ağırlıklı olarak tüketiciye kalır","E":"Malın esnekliği yansımayı etkilemez, yük daima satıcıdadır","A":"Tamamen satıcıya kalır","D":"Yarı yarıya paylaşılır","B":"Tamamen devlete kalır"},"kaynak":{"alinti":"esnekliği düşük mallarda yansıma tüketiciye","liste":[{"ad":"TEORI - dolayli vergiler ozellikleri","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: DOLAYLI VERGİLER mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü vergilerdir: katma değer vergisi, özel tüketim vergisi, gümrük vergisi, banka ve sigorta muameleleri vergisi, özel iletişim vergisi, damga vergisi. DOLAYSIZ VERGİLER gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınır: gelir vergisi, kurumlar vergisi, motorlu taşıtlar vergisi, emlak vergisi, veraset ve intikal vergisi. DOLAYLI VERGİLERİN ÖZELLİKLERİ: (1) YANSITILABİLİR: Kanuni mükellef (satıcı) vergiyi fiyata ekleyerek nihai tüketiciye aktarır; vergiyi fiilen taşıyan ile ödeyen ayrıdır. (2) TERSİNE ARTAN ORANLI (regresif) ETKİ: Herkes aynı oranı öder ama düşük gelirli gelirinin daha büyük kısmını tüketime ayırdığından vergi yükü gelire göre azalır; bu yüzden adaletsiz sayılır. (3) MALÎ ANESTEZİ: Vergi fiyatın içinde olduğundan hissedilmez, direnç düşüktür. (4) TAHSİLİ KOLAY VE VERİMLİ: Az sayıda satıcıdan toplanır, kaçak görece azdır, hasılat konjonktüre hızlı tepki verir. (5) Kişisel durumu dikkate almaz (objektif vergi). (6) Esnekliği düşük mallarda yansıma tüketiciye, yüksek mallarda satıcıya kalır. KÜÇÜK ÖRNEK: Asgari ücretli ile yüksek gelirli aynı ekmeği alırken aynı KDV\u0027yi öder; ödenen vergi asgari ücretlinin gelirine oranla daha büyüktür. SINAV TUZAĞI: (1) Katma değer vergisi ARTAN ORANLI değildir; tek ya da birkaç düz oran uygulanır, etkisi tersine artan oranlıdır. (2) Motorlu taşıtlar vergisi ve emlak vergisi DOLAYSIZdır (servet vergisi). (3) \u0027Dolaylı vergiler adaletli, dolaysız vergiler ver…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [1/3]","metin":"Madde 3- Münhasıran bu Kanunun uygulanmasında; a) Genel yönetim kapsamındaki kamu idareleri: Uluslararası sınıflandırmalara göre belirlenmiş olan, merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri, b) Merkezî yönetim kapsamındaki kamu idareleri: Bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerini, c) Düzenleyici ve denetleyici kurumlar: Bu Kanuna ekli (III) sayılı cetvelde yer alan kurumları, 22/12/2005 tarihli ve 5436 sayılı Kanunun 10 uncu maddesiyle, bu fıkraya \"25\" ibaresinden sonra gelmek üzere, \"42\" ibaresi; \"43\" ibaresinden sonra gelmek üzere, \"44\" ibaresi ve \"76\" ibaresinden sonra gelmek üzere, \"78\" ibaresi eklenmiştir. 1 d) Sosyal güvenlik kurumları: Bu Kanuna ekli (IV) sayılı cetvelde yer alan kamu kurumlarını, e) Mahallî idare: Yetkileri belirli bir coğrafi alan ve hizmetlerle sınırlı olarak kamusal faaliyet gösteren belediye, il özel idaresi ile bunlara bağlı veya bunların kurdukları veya üye oldukları birlik ve idareleri,2 f) Bütçe: Belirli bir dönemdeki gelir ve gider tahminleri ile bunların uygulanmasına ilişkin hususları gösteren ve usulüne uygun olarak yürürlüğe konulan belgeyi, g) Kamu kaynakları: Borçlanma suretiyle elde edilen imkânlar dahil kamuya ait gelirler, taşınır ve taşınmazlar, hesaplarda bulunan para, alacak ve haklar ile her türlü değerleri, h) Kamu gideri: Kanunlarına veya Cumhurbaşkanlığı kararnamelerine dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, sosyal güvenlik katkı payları, iç ve dış borç faizleri, borçlanma genel giderleri, borçlanma araçlarının iskontolu…"}],"hakem":"Soru dolaylı vergiler konusunun özü olan esneklik-yansıma ilişkisini ölçmektedir; cevap C (tüketiciye kalır) kaynak metinde açıkça belirtilen \u0027esnekliği düşük mallarda yansıma tüketiciye\u0027 kuralına dayanmaktadır."},"kayitlar":[],"sade":{"siklar":{"D":"Verginin paylaşımı her malın esnekliğine göre farklı olur; yarı yarıya kural sadece bazı hallerde geçerlidir, esnek olmayan talepte tüketiciye kayar.","E":"Esneklik tam tersine, verginin kime düşeceğini belirleyen ana faktördür; düşük esneklik yükü tüketiciye çeker, yüksek esneklik satıcıya bırakır.","A":"Satıcı vergiyi fiyata ekleyip geçiştirebildiğinde yükü taşımaz; bu sadece talep çok esnek (insanlar fiyat artınca almayı bırakıyor) olduğunda olur, esnek olmayan talepte olmaz.","B":"Devlet vergiyi tahsil eden alacaklıdır ama yükü taşıyan taraf değildir; vergi geliri devlete gider ama maliyeti tüketiciyi ezer."},"dogru":"Tüketim vergisi konulduğunda, malın talebine az sayıda insan ihtiyaç duyuyorsa (esnek olmayan talep), insanlar ne olursa olsun almaya devam eder; satıcı vergiyi fiyata ekler ve tüketici ödemeye devam eder, yük tüketiciye kalır.","sinav":"Talep esnekliğinin düşük olduğu mallarda tüketim vergisinin yansıması tüketiciye doğru gerçekleştiğinden verginin yükü ağırlıklı olarak tüketiciye kalır.","kavramlar":[{"kaynak":"TEORI","tanim":"Mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü ve satıcı tarafından devlete ödenen vergi; vergiyi fiilen taşıyan kişi (tüketici) ile ödeyen (satıcı) farklıdır.","ad":"Dolaylı vergi"},{"kaynak":"TEORI","tanim":"Satıcının kanuni olarak ödediği verginin bir kısmını veya tamamını fiyata ekleyerek alıcıya (tüketiciye) aktarması olayıdır; esneklik yansımanın boyutunu belirler.","ad":"Vergi yansıması"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[],"donemler":["2025/1"]},"oyun":null,"tip":"teori","soru":"Talebi esnek olmayan bir malda tüketim vergisi getirildiğinde verginin yükü ağırlıklı olarak kime kalır?","kayitBaslik":"","id":"sgs-t4-maliye-zor/kp-06","verilenler":[{"deger":"Talebi esnek olmayan mal","anlam":"Fiyat artsa da alım miktarı fazla değişmez.","ad":"Malın niteliği"},{"deger":"Tüketim üzerinden alınan dolaylı vergi","anlam":"Yansıtılabilir nitelikte olduğu için yük aktarılabilir.","ad":"Verginin türü"}],"dayanak":"Teori notu: dolaylı vergilerin özellikleri — dolaylı vergiler yansıtılabilir, kanuni mükellef vergiyi fiyata ekleyerek nihai tüketiciye aktarır ve vergiyi fiilen taşıyan ile ödeyen ayrıdır; esnekliği düşük mallarda yansıma tüketiciye, esnekliği yüksek mallarda satıcıya kalır; dolaylı vergiler ayrıca tersine artan oranlı etki doğurur, mali anestezi yaratır ve kişisel durumu dikkate almaz","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Adım 1 = Dolaylı vergi yansıtılabilir bir vergidir","anlatim":"Kanuni mükellef ile vergiyi fiilen taşıyan kişi farklı olabilir.","doldur":[]},{"formul":"Adım 2 = Yansımanın yönünü esneklik belirler","anlatim":"Esnekliği düşük tarafın vergiden kaçınma imkanı yoktur, yük ona kalır.","doldur":[[5,1]]},{"formul":"Adım 3 = Talep esnek değilse yük ağırlıklı olarak tüketiciye geçer","anlatim":"Tüketici fiyat artsa da alımını kısamadığı için satıcı vergiyi fiyata yansıtabilir.","doldur":[[6,1]]}],"anahtar":[{"ornek":"esneklik","kok":"esnekl"},{"ornek":"vergiyi","kok":"vergiy"},{"ornek":"tüketiciye","kok":"tüketi"},{"ornek":"yansımanın","kok":"yansım"},{"ornek":"taşıyan","kok":"taşıya"},{"ornek":"satıcıya","kok":"satıcı"}],"konuGiris":{"harita":"Ne zaman test edilir: talebi esnek olmayan bir malda tüketim vergisi konduğunda yük dağılımı sorulduğunda. Nasıl ölçülür: malın talep esnekliği düşükse verginin tüketiciye yansıma oranı yüksek kabul edilir. Nasıl kaydedilir: soru metninde doğrudan \u0027ağırlıklı olarak tüketiciye kalır\u0027 sonucu seçilerek yanıtlanır.","desen":"Sınav genelde esnekliği düşük malda yükün satıcıya kaldığı şıkkını tuzak olarak koyar; doğrusu tüketiciye kalmasıdır. Bazı sorularda esnek mal ile karıştırılıp cevap tersine çevrilir. Bu soru dolaylı vergilerin yansıma özelliği noktasından geliyor (p.28).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Mal ve hizmet üzerinden alınan, fiyata gömülü vergi türü","ad":"Dolaylı vergi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Kanuni mükellefin vergiyi fiyata ekleyip nihai tüketiciye aktarması","ad":"Yansıma","kim":"piyasa fiyatlar"},{"kaynak":"soruda verilir","tanim":"Fiyat değişiminde tüketicinin talebini ne kadar azalttığını gösteren ölçü","ad":"Talep esnekliği","kim":"işletme yönetimi tahmin eder ya da belirler"},{"kaynak":"kuraldan bilinir","tanim":"Verginin fiilen kimin gelirinden karşılandığını gösteren pay","ad":"Vergi yükü","kim":"piyasa fiyatlar"}],"sinavda":"Talebi esnek olmayan bir malda konan tüketim vergisinin yükünün kime kaldığı sorulur.","panel_ornek":"Sokağındaki tek eczane ilacın fiyatını 5 liradan 6 liraya çıkarsa, zorunlu ilacı almaya mecbur olduğun için yine alırsın; eczaneci zam yükünü sana kolayca aktarır. İşte esnekliği düşük bir talepte fiyat artışının faturası büyük ölçüde sana kesilir.","ornek":"Sokağındaki tek eczane ilacın fiyatını 5 liradan 6 liraya çıkarsa, zorunlu ilacı almaya mecbur olduğun için yine alırsın; eczaneci zam yükünü sana kolayca aktarır. İşte esnekliği düşük bir talepte fiyat artışının faturası büyük ölçüde sana kesilir.","yontemler":"Esneklik düştükçe tüketiciye yansıma artar; malın esnek/esnek olmama durumu cevabı belirler.","nedir":"Talebi esnek olmayan mallarda konulan dolaylı vergi, fiyat artışına rağmen tüketicinin alımdan vazgeçemediği için yükün büyük kısmının tüketiciye kalmasını ifade eder. Sınav bu yansıma yönünün esnekliğe göre nasıl değiştiğini ölçer."},"olay":"","tuzak":{"D":{"ad":"Ölçü Tuzağı","metin":"Paylaşım esnekliklere göre değişir, sabit bir yarı yarıya kural yoktur. Doğrusu: esnek olmayan talepte yük tüketiciye kayar."},"E":{"ad":"Kural Tuzağı","metin":"Esneklik yansımanın belirleyicisidir. Doğrusu: esneklik yükün kimde kalacağını belirler."},"A":{"ad":"Yön Tuzağı","metin":"Yükün satıcıda kalması talebin esnek olduğu mallarda görülür. Doğrusu: esnek olmayan talepte yük tüketiciye kalır."},"B":{"ad":"Kavram Tuzağı","metin":"Devlet verginin alacaklısıdır, yükü taşıyan taraf değildir. Doğrusu: yük ağırlıklı olarak tüketiciye kalır."}},"celdiriciYol":{},"hap":"Vergiyi kimin ödediğini kanun, kimin taşıdığını esneklik belirler; talep esnek değilse yük tüketiciye kalır.","teshis":{"C":{"gercek":"Talebi esnek olmayan malda tüketici fiyat artsa da alımını azaltamaz; satıcı vergiyi fiyata yansıtabilir ve yük tüketiciye geçer.","ayirt":"Talep fiyata ne kadar duyarlı?","paragraf":"Dolaylı vergiler notu","yanilgi":"Bu şıkkı eleyen öğrenci, verginin kanunen satıcıdan alındığı için yükün de satıcıda kalacağını düşünür."},"E":{"gercek":"Esneklik yansımanın yönünü belirleyen temel ölçüttür.","ayirt":"Esneklik yüksek mi, düşük mü?","paragraf":"Dolaylı vergiler notu","yanilgi":"Esnekliği yansımayla ilgisiz sanıyorsun."},"A":{"gercek":"Dolaylı vergide ödeyen ile taşıyan ayrıdır; kimin taşıyacağını esneklik belirler.","ayirt":"Tüketici fiyat artınca alımını kısabiliyor mu?","paragraf":"Dolaylı vergiler notu","yanilgi":"Kanuni mükellefi her zaman yükü taşıyan taraf sanıyorsun."},"D":{"gercek":"Paylaşım arz ve talep esnekliklerinin oranına göre değişir.","ayirt":"Hangi taraf daha esnek?","paragraf":"Dolaylı vergiler notu","yanilgi":"Yansımayı sabit bir paylaşım kuralı sanıyorsun."},"B":{"gercek":"Devlet vergiyi tahsil eder; yük piyasada taraflar arasında paylaşılır.","ayirt":"Yük kimin cebinden çıkıyor?","paragraf":"Dolaylı vergiler notu","yanilgi":"Verginin alacaklısı ile yükü taşıyanı karıştırıyorsun."}},"verilen":[[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"Dolaysız vergiler gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınır; gelir vergisi, kurumlar vergisi, motorlu taşıtlar vergisi, emlak vergisi ve veraset ve intikal vergisi bu gruptadır. Dolaylı vergiler ise mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınır, fiyata gömülüdür, yansıtılabilir, mali anestezi yaratır, tersine artan oranlı etki doğurur ve kişisel durumu dikkate almaz.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Dolaylı ve dolaysız ayrımında tek soru yeter: vergi fiyata gömülüp başkasına aktarılabiliyor mu; aktarılabiliyorsa dolaylıdır.","konu":"vergi ozellikleri","tablo":{"satirlar":[["VERİLENLER","-"],["Dolaysız vergiler","Gelir, kurumlar, emlak, motorlu taşıtlar, veraset ve intikal"],["Dolaylı vergiler","Katma değer, özel tüketim, gümrük, damga"],["HESAP","-"],["Ne soruluyor","Dolaysız vergilerle ilgili aşağıdaki ifadelerden hangisi doğrudur?"],["Kural","Dolaysız vergiler gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınır; gelir vergisi, kurumlar vergisi, motorlu taşıtlar vergisi, emlak vergisi ve veraset ve intikal vergisi bu gruptadır. Dolaylı vergiler ise mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınır, fiyata gömülüdür, yansıtılabilir, mali anestezi yaratır, tersine artan oranlı etki doğurur ve kişisel durumu dikkate almaz."],["Doğru şık","B) Mükellefin kişisel durumu dikkate alınarak alınır"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Mali anestezi etkisi yaratır","E":"Kanuni mükellef vergiyi fiyata ekleyerek nihai tüketiciye yansıtır","A":"Fiyatın içine gömülüdür","D":"Tersine artan oranlı etki doğurur","B":"Mükellefin kişisel durumu dikkate alınarak alınır"},"kaynak":{"alinti":"mükellefin kişisel durumuna bakılarak alınır","liste":[{"ad":"TEORI - dolayli vergiler ozellikleri","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: DOLAYLI VERGİLER mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü vergilerdir: katma değer vergisi, özel tüketim vergisi, gümrük vergisi, banka ve sigorta muameleleri vergisi, özel iletişim vergisi, damga vergisi. DOLAYSIZ VERGİLER gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınır: gelir vergisi, kurumlar vergisi, motorlu taşıtlar vergisi, emlak vergisi, veraset ve intikal vergisi. DOLAYLI VERGİLERİN ÖZELLİKLERİ: (1) YANSITILABİLİR: Kanuni mükellef (satıcı) vergiyi fiyata ekleyerek nihai tüketiciye aktarır; vergiyi fiilen taşıyan ile ödeyen ayrıdır. (2) TERSİNE ARTAN ORANLI (regresif) ETKİ: Herkes aynı oranı öder ama düşük gelirli gelirinin daha büyük kısmını tüketime ayırdığından vergi yükü gelire göre azalır; bu yüzden adaletsiz sayılır. (3) MALÎ ANESTEZİ: Vergi fiyatın içinde olduğundan hissedilmez, direnç düşüktür. (4) TAHSİLİ KOLAY VE VERİMLİ: Az sayıda satıcıdan toplanır, kaçak görece azdır, hasılat konjonktüre hızlı tepki verir. (5) Kişisel durumu dikkate almaz (objektif vergi). (6) Esnekliği düşük mallarda yansıma tüketiciye, yüksek mallarda satıcıya kalır. KÜÇÜK ÖRNEK: Asgari ücretli ile yüksek gelirli aynı ekmeği alırken aynı KDV\u0027yi öder; ödenen vergi asgari ücretlinin gelirine oranla daha büyüktür. SINAV TUZAĞI: (1) Katma değer vergisi ARTAN ORANLI değildir; tek ya da birkaç düz oran uygulanır, etkisi tersine artan oranlıdır. (2) Motorlu taşıtlar vergisi ve emlak vergisi DOLAYSIZdır (servet vergisi). (3) \u0027Dolaylı vergiler adaletli, dolaysız vergiler ver…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [1/3]","metin":"Madde 3- Münhasıran bu Kanunun uygulanmasında; a) Genel yönetim kapsamındaki kamu idareleri: Uluslararası sınıflandırmalara göre belirlenmiş olan, merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri, b) Merkezî yönetim kapsamındaki kamu idareleri: Bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerini, c) Düzenleyici ve denetleyici kurumlar: Bu Kanuna ekli (III) sayılı cetvelde yer alan kurumları, 22/12/2005 tarihli ve 5436 sayılı Kanunun 10 uncu maddesiyle, bu fıkraya \"25\" ibaresinden sonra gelmek üzere, \"42\" ibaresi; \"43\" ibaresinden sonra gelmek üzere, \"44\" ibaresi ve \"76\" ibaresinden sonra gelmek üzere, \"78\" ibaresi eklenmiştir. 1 d) Sosyal güvenlik kurumları: Bu Kanuna ekli (IV) sayılı cetvelde yer alan kamu kurumlarını, e) Mahallî idare: Yetkileri belirli bir coğrafi alan ve hizmetlerle sınırlı olarak kamusal faaliyet gösteren belediye, il özel idaresi ile bunlara bağlı veya bunların kurdukları veya üye oldukları birlik ve idareleri,2 f) Bütçe: Belirli bir dönemdeki gelir ve gider tahminleri ile bunların uygulanmasına ilişkin hususları gösteren ve usulüne uygun olarak yürürlüğe konulan belgeyi, g) Kamu kaynakları: Borçlanma suretiyle elde edilen imkânlar dahil kamuya ait gelirler, taşınır ve taşınmazlar, hesaplarda bulunan para, alacak ve haklar ile her türlü değerleri, h) Kamu gideri: Kanunlarına veya Cumhurbaşkanlığı kararnamelerine dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, sosyal güvenlik katkı payları, iç ve dış borç faizleri, borçlanma genel giderleri, borçlanma araçlarının iskontolu…"}],"hakem":"Soru dolaysız vergilerin tanımsal özelliğini soruyor; B sikki kaynakta açıkça desteklenen \u0027mükellefin kişisel durumuna bakılarak alınır\u0027 kuralını doğru ifade ediyor."},"kayitlar":[],"sade":{"siklar":{"C":"Mali anestezi etkisi, verginin fiyat içinde olması nedeniyle insanlar tarafından hissedilmemesidir ve bu dolaylı vergilerin sonucudur. Dolaysız vergiler ise mükellef tarafından açıkça hissedilir.","E":"Yansıtma (vergiyi fiyata ekleme ve tüketiciye aktarma) dolaylı vergilerin ayırıcı özelliğidir. Dolaysız vergi mükellef üzerinde kalır ve yansıtılmaz.","D":"Tersine artan oranlı etki dolaylı vergilerde görülür; düşük gelirli kişiler gelirlerine oranla daha fazla vergi öderler. Dolaysız vergiler ödeme gücüne göre ayarlanır, bu etkiye neden olmaz.","A":"Fiyatın içine gömülü olmak dolaylı vergilerin temel özelliğidir; dolaysız vergiler bu şekilde gizli değildir. Dolaysız vergi mükellef tarafından doğrudan hissedilir ve ödenir."},"dogru":"Dolaysız vergiler gelir ve servet üzerinden alınır ve mükellefin kişisel durumu (yaşı, bakmakla yükümlü olduğu kişi sayısı, gelir düzeyi gibi) göz önüne alınarak hesaplanır. Dolaysız vergilere gelir vergisi, kurumlar vergisi, emlak vergisi örnek verilebilir.","sinav":"Dolaysız vergiler gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınırken; dolaylı vergiler mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınır.","kavramlar":[{"kaynak":"TEORI","tanim":"Gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınan vergidir. Gelir vergisi, kurumlar vergisi, motorlu taşıtlar vergisi, emlak vergisi ve veraset ve intikal vergisi bu gruba dahildir.","ad":"Dolaysız vergi"},{"kaynak":"TEORI","tanim":"Mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü vergilerdir. Kanuni mükellef vergiyi fiyata ekleyerek nihai tüketiciye yansıtır.","ad":"Dolaylı vergi"},{"kaynak":"TEORI","tanim":"Vergi fiyatın içinde olduğundan hissedilmez ve vergi mükellefi tarafından fark edilmez.","ad":"Mali anestezi"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[],"donemler":["2025/1"]},"oyun":null,"tip":"teori","soru":"Dolaysız vergilerle ilgili aşağıdaki ifadelerden hangisi doğrudur?","kayitBaslik":"","id":"sgs-t4-maliye-kolay/kp-06","verilenler":[{"deger":"Gelir, kurumlar, emlak, motorlu taşıtlar, veraset ve intikal","anlam":"Gelir ve servet üzerinden alınır, yansıtılamaz.","ad":"Dolaysız vergiler"},{"deger":"Katma değer, özel tüketim, gümrük, damga","anlam":"Harcama üzerinden alınır, fiyata gömülüdür.","ad":"Dolaylı vergiler"}],"dayanak":"Teori notu: dolaylı vergilerin özellikleri — dolaysız vergiler gelir ve servet üzerinden, mükellefin kişisel durumuna bakılarak alınır; dolaylı vergiler mal ve hizmetlerin üretimi, satışı ve tüketimi üzerinden alınan, fiyatın içine gömülü, yansıtılabilir, mali anestezi yaratan, tersine artan oranlı etki doğuran ve kişisel durumu dikkate almayan objektif vergilerdir","dogru":"B","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Ölçüt = Vergi yansıtılabiliyor mu","anlatim":"Yansıtılabiliyorsa dolaylı, mükellefin üzerinde kalıyorsa dolaysızdır.","doldur":[]},{"formul":"Dolaylı vergi = Fiyata gömülü, mali anestezi yaratan, tersine artan oranlı etki doğuran objektif vergi","anlatim":"Tahsili kolay ve verimlidir, kişisel durumu dikkate almaz. Katma değer ve özel tüketim vergisi bu gruptadır.","doldur":[[5,1]]},{"formul":"Dolaysız vergi = Gelir ve servet üzerinden, kişisel duruma bakılarak alınır","anlatim":"Ödeme gücünü izlediği için adaletli sayılır. Gelir, kurumlar, emlak ve motorlu taşıtlar vergileri bu gruptadır.","doldur":[[6,1]]}],"anahtar":[{"ornek":"vergisi","kok":"vergis"},{"ornek":"dolaylı","kok":"dolayl"},{"ornek":"durumuna","kok":"durumu"},{"ornek":"dolaysız","kok":"dolays"},{"ornek":"vergiler","kok":"vergil"},{"ornek":"gruptadır","kok":"grupta"}],"konuGiris":{"harita":"Ne zaman test edilir: bir vergi listesi verilip \u0027dolaylı mı dolaysız mı\u0027 ya da \u0027özelliği doğru mu\u0027 sorulduğunda. Nasıl ölçülür: verginin mükellefin kişisel durumuna bakılıp bakılmadığı ve yansıtılabilir olup olmadığı üzerinden. Nasıl kaydedilir: doğru-yanlış cümle seçimiyle, hesaplama yoktur.","desen":"Sınav çoğunlukla \u0027motorlu taşıtlar vergisi ya da emlak vergisi dolaylıdır\u0027 gibi ters bir ifadeyle tuzak kurar; oysa bunlar servet vergisi olup dolaysızdır. Ayrıca \u0027dolaylı vergiler adaletli, dolaysız verimlidir\u0027 cümlesi de terstir, doğrusu tam tersidir. Bu soru dolaylı-dolaysız vergi tanımı ve örnek listesi noktasından geliyor (p.28).","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Gelir ve servet üzerinden, kişisel duruma bakılarak alınan vergi","ad":"Dolaysız vergi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Kanuni mükellefin vergiyi fiyata ekleyip tüketiciye aktarması","ad":"Yansıma","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"kuraldan bilinir","tanim":"Aynı oranın düşük gelirlide daha büyük yük oluşturması etkisi","ad":"Tersine artan oranlılık","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Vergi fiyata gömülü olduğu için hissedilmemesi durumu","ad":"Malî anestezi","kim":"kanun sabitler"}],"sinavda":"Vergi türleri listelenip dolaysız vergilere ait doğru ifadenin seçilmesi istenir.","panel_ornek":"Bir gençlik kart aidatı 30 TL olsun, herkes aynı 30 TL\u0027yi öder; kartı çok kullanan da az kullanan da aynı tutarı verir. Ama bu 30 TL, cebine 3000 TL koyan biri için cebine 300 TL koyana göre çok daha küçük bir yüktür. Yani sabit tutar herkeste aynı ama gerçek yük gelire göre değişir; işte dolaylı vergideki tersine artan oranlı etki tam bu mantık.","ornek":"Bir gençlik kart aidatı 30 TL olsun, herkes aynı 30 TL\u0027yi öder; kartı çok kullanan da az kullanan da aynı tutarı verir. Ama bu 30 TL, cebine 3000 TL koyan biri için cebine 300 TL koyana göre çok daha küçük bir yüktür. Yani sabit tutar herkeste aynı ama gerçek yük gelire göre değişir; işte dolaylı vergideki tersine artan oranlı etki tam bu mantık.","yontemler":"Vergiyi mükellefin kişisel durumuna göre mi yoksa mal/hizmet üzerinden mi alındığına bakarak sınıflandır; motorlu taşıtlar ve emlak vergisini dolaysız kabul et.","nedir":"Vergi özellikleri konusu, verginin kim üzerinden ve nasıl alındığına göre dolaylı-dolaysız ayrımını inceler. Sınav bu ayrımın hangi vergiye ait olduğunu ve hangi özelliğin doğru eşleştiğini ölçer."},"olay":"","tuzak":{"C":{"ad":"Ayrım Tuzağı","metin":"Mali anestezi, verginin fiyat içinde hissedilmemesidir ve dolaylı vergilere aittir. Doğrusu: dolaysız vergi hissedilir."},"E":{"ad":"Ayrım Tuzağı","metin":"Yansıtma dolaylı vergilerin temel özelliğidir. Doğrusu: dolaysız vergi mükellefin üzerinde kalır."},"D":{"ad":"Ayrım Tuzağı","metin":"Tersine artan oranlı etki dolaylı vergilerin sonucudur. Doğrusu: dolaysız vergiler ödeme gücünü izler."},"A":{"ad":"Ayrım Tuzağı","metin":"Fiyatın içine gömülü olmak dolaylı vergilerin özelliğidir. Doğrusu: dolaysız vergi kişisel duruma bakılarak alınır."}},"celdiriciYol":{},"hap":"Dolaysız vergi kişiyi, dolaylı vergi işlemi görür; yansıtma, mali anestezi ve tersine artan oranlılık dolaylı verginin üç imzasıdır.","teshis":{"C":{"gercek":"Mali anestezi fiyata gömülü dolaylı vergilerde görülür.","ayirt":"Mükellef vergiyi hissediyor mu?","paragraf":"Dolaylı vergiler notu","yanilgi":"Mali anesteziyi bütün vergilere yayıyorsun."},"E":{"gercek":"Dolaysız vergilerde kanuni mükellef ile vergiyi fiilen taşıyan aynı kişidir.","ayirt":"Vergi başkasına aktarılabiliyor mu?","paragraf":"Dolaylı vergiler notu","yanilgi":"Yansıtmayı her vergi için mümkün sanıyorsun."},"A":{"gercek":"Gelir ve servet vergileri fiyat içinde gizlenmez, mükellefin kendisinden alınır.","ayirt":"Vergi fiyatın içinde mi?","paragraf":"Dolaylı vergiler notu","yanilgi":"Bütün vergilerin fiyata girdiğini düşünüyorsun."},"D":{"gercek":"Tersine artan oranlı etki, herkesin aynı oranı ödediği dolaylı vergilerde doğar.","ayirt":"Oran herkes için aynı mı?","paragraf":"Dolaylı vergiler notu","yanilgi":"Bütün vergilerin düşük gelirliyi daha çok yorduğunu sanıyorsun."},"B":{"gercek":"Kişisel durumun dikkate alınıp alınmaması vergileri sübjektif ve objektif diye ayıran temel ölçüttür; dolaysız vergiler bu ölçüde mükellefin durumunu izler.","ayirt":"Vergi kişinin durumuna göre değişiyor mu?","paragraf":"Dolaylı vergiler notu","yanilgi":"Bu şıkkı eleyen öğrenci, kişisel durumun yalnız indirim ve istisnalarla ilgili olduğunu, verginin türüyle ilgisi olmadığını düşünür."}},"verilen":[[4,1],[1,1],[2,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"SGS 2024/3 Soru 100"},"kural":"Advalorem vergide matrah parasal değerdir ve KDV matrahı, ÖTV dahil satış bedelidir.","olcum":{"pencere":7,"hesapKod":0,"capa":"SGS 2024/3 Soru 100","sonDonem":4,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"hesap"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":false,"taktik":"Önce matraha hangi tutarların dahil olduğunu (ÖTV dahil mi) sorudan çıkar, sonra tek adımda oranı uygula.","konu":"vergi siniflandirmasi","tablo":{"satirlar":[["VERİLENLER","-"],["Satış miktarı","2.000 litre"],["Maktu ÖTV","3 TL/litre"],["ÖTV hariç satış bedeli","44.000 TL"],["KDV oranı","%20"],["HESAP","-"],["ÖTV tutarı (spesifik vergi, 2.000x3)","6.000"],["KDV matrahı (44.000+6.000)","50.000"],["Katma Değer Vergisi (advalorem, 50.000x%20)","10.000"]],"basliklar":["Kalem","Tutar (TL)"]},"siklar":{"C":"10.000","E":"16.000","A":"6.000","D":"11.200","B":"8.800"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - vergi siniflandirmasi","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Vergiler farklı ölçütlere göre sınıflandırılır. (1) YANSIMAYA GÖRE: Dolaysız vergiler (gelir, kurumlar, emlak, motorlu taşıtlar, veraset ve intikal) mükellefin üzerinde kalır; dolaylı vergiler (KDV, ÖTV, gümrük, BSMV, damga) fiyat yoluyla başkasına yansıtılır. (2) KONUSUNA GÖRE: Gelir üzerinden alınan vergiler (gelir, kurumlar), servet üzerinden alınan vergiler (emlak, motorlu taşıtlar, veraset ve intikal), harcama üzerinden alınan vergiler (KDV, ÖTV, gümrük). (3) MATRAHIN ÖLÇÜLMESİNE GÖRE: SPESİFİK (miktar esaslı) vergide matrah ağırlık, hacim, adet gibi fiziki ölçüdür (litre başına ÖTV); ADVALOREM (değer esaslı) vergide matrah parasal değerdir (KDV, gelir vergisi). (4) MÜKELLEFİN DURUMUNA GÖRE: ŞAHSİ (sübjektif) vergi mükellefin kişisel ve ailevi durumunu dikkate alır (gelir vergisinde asgari geçim indirimi, sakatlık indirimi gibi); GAYRİŞAHSİ (objektif) vergi yalnız konuya bakar (KDV, emlak vergisi). (5) KAPSAMINA GÖRE: Genel vergi bütün gelir veya harcamayı kapsar (gelir vergisi, KDV); özel vergi belirli bir kalemi hedefler (ÖTV, motorlu taşıtlar vergisi). (6) ORAN YAPISINA GÖRE: Artan oranlı (matrah büyüdükçe oran artar: gelir vergisi tarifesi), düz (tek) oranlı (kurumlar vergisi), azalan oranlı. KÜÇÜK ÖRNEK: Akaryakıtta litre başına maktu ÖTV spesifik, aynı ürünün satış bedeli üzerinden alınan KDV advaloremdir; veraset ve intikal vergisi servet transferi üzerinden alınan, artan oranlı, dolaysız bir vergidir. SINAV TUZAĞI: (1) Emlak ve motorlu taşıtlar vergisi harcama değil SERVET vergisidir. (2) Kurumlar vergisi düz…"},{"ad":"KDVK (3065 s.K.) m.28","metin":"Madde 28 – (Değişik : 3/12/1988 - 3505/23 md.) Katma değer vergisi oranı, vergiye tabi her bir işlem için % 10\u0027dur. Cumhurbaşkanı bu oranı, dört katına kadar artırmaya, % 1 \u0027e kadar indirmeye, bu oranlar dahilinde muhtelif mal ve hizmetler ile bazı malların perakende safhası ve inşaatın yapıldığı arsanın veya konutun vergi değeri ve bulunduğu yeri esas alarak konut teslimleri için farklı vergi oranları tespit etmeye yetkilidir. ÜÇÜNCÜ BÖLÜM İndirim Vergi indirimi:7677"}],"hakem":"Soru vergi sınıflandırması (spesifik-advalorem ayrımı) konusunu ölçüyor; advalorem vergide matrahın parasal değer olduğu kuralı kaynak metinde açıkça yer almakta, KDV matrahının ÖTV dahil olması kuralı KDVK m.28\u0027den çıkmaktadır; hesap doğru, sık tutarlı ve güncel."},"kayitlar":[],"sade":{"siklar":{"D":"ÖTV tutarını matraha iki kez ekleyip (44.000+6.000+6.000=56.000) %20 uygulayarak 11.200 TL hesapladın; oysa ÖTV yalnız bir kez matraha eklenir.","E":"Doğru hesapladığın 10.000 TL KDV\u0027ye ayrıca 6.000 TL ÖTV ekleyip toplam vergi yükünü advalorem vergi sandın; ÖTV ve KDV ayrı vergilerdir, soru yalnız KDV tutarını soruyor.","A":"Litre başına 3 TL maktu ÖTV tutarı olan 6.000 TL\u0027yi doğru hesapladın ama bu miktar esaslı verginin kendisidir; sorulan advalorem KDV değildir.","B":"KDV\u0027yi 44.000 TL üzerinden %20 oranında hesaplayıp 8.800 TL buldun; ancak soru matrahın ÖTV\u0027yi kapsadığını açıkça belirttiğinden 6.000 TL\u0027yi matraha katman gerekiyordu."},"dogru":"Motorinin satış fiyatı 44.000 TL\u0027ye litre başına 3 TL maktu ÖTV (2.000×3=6.000 TL) eklenir, toplam 50.000 TL matrah oluşur. Bu matraha %20 oranında KDV uygulanınca 10.000 TL çıkar.","sinav":"Katma Değer Vergisi Kanunu 28. madde uyarınca, matrah ÖTV dahil satış bedeli olduğunda advalorem KDV tutarı hesaplanır.","kavramlar":[{"kaynak":"TEORI","tanim":"Matrahı ağırlık, hacim, adet gibi fiziki ölçü birimiyle belirlenen vergidir; örneğin litre başına sabit tutarda alınan ÖTV.","ad":"Spesifik (miktar esaslı) vergi"},{"kaynak":"TEORI","tanim":"Matrahı parasal değerle belirlenen vergidir; verginin uygulanacağı tutara bağlı olarak hesaplanır.","ad":"Advalorem (değer esaslı) vergi"}]},"cikmis":{"pencereDonemler":["2026/2","2026/1","2025/3","2025/2","2025/1","2024/3","2024/2"],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":{"bosluk":[[1,1],[2,1]],"tablo":{"basliklar":["Kalem","Tutar (TL)"],"satirlar":[["ÖTV tutarı (spesifik vergi, 1.500x4)","6.000"],["KDV matrahı (36.000+6.000)","42.000"],["Katma Değer Vergisi (advalorem, 42.000x%20)","8.400"]]},"tur":"tablo","soru":"Bir akaryakıt satışında 1.500 litre benzine, litre başına 4 TL maktu (spesifik) Özel Tüketim Vergisi uygulanmıştır. ÖTV hariç satış bedeli 36.000 TL, Katma Değer Vergisi oranı %20\u0027dir ve matrah ÖTV\u0027yi de kapsar.","verilen":[[0,1]],"hedef":"Tabloyu doldur ve değer esasına (advalorem) göre hesaplanan Katma Değer Vergisi tutarının kaç TL olduğunu bul.","not":"İkiz soru: aynı yöntem, yeni rakamlar. Boş hücreleri sen doldur."},"tip":"hesap","soru":"Bir akaryakıt satışında 2.000 litre motorine, litre başına 3 TL maktu (spesifik) Özel Tüketim Vergisi uygulanmıştır. ÖTV hariç satış bedeli 44.000 TL, Katma Değer Vergisi oranı %20\u0027dir ve matrah ÖTV\u0027yi de kapsar. Değer esasına (advalorem) göre hesaplanan Katma Değer Vergisi tutarı kaç TL\u0027dir?","kayitBaslik":"","id":"sgs-t1-genel-maliye-kolay/kp-11","verilenler":[{"deger":"2.000 litre","anlam":"ÖTV tutarının hesaplanacağı fiziki miktar (spesifik vergi tabanı)","ad":"Satış miktarı"},{"deger":"3 TL/litre","anlam":"Litre başına sabit tutar; spesifik verginin birim tutarı","ad":"Maktu ÖTV"},{"deger":"44.000 TL","anlam":"KDV matrahının ÖTV eklenmeden önceki başlangıç tutarı","ad":"ÖTV hariç satış bedeli"},{"deger":"%20","anlam":"Advalorem vergi oranı, matraha uygulanacak yüzde","ad":"KDV oranı"}],"dayanak":"Katma Değer Vergisi Kanunu m.28; TEORİ - vergi sınıflandırması (spesifik/advalorem ayrımı)","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Verilen: Miktar 2.000 litre (soruda verilen); Birim ÖTV 3 TL (soruda verilen); ÖTV hariç satış bedeli 44.000 TL (soruda verilen); KDV oranı %20 (soruda verilen)","anlatim":"Soru bize şunları vermiş: 2.000 litre motorin, litre başına 3 TL maktu ÖTV, ÖTV hariç satış bedeli 44.000 TL ve KDV oranı %20. Matrahın ÖTV\u0027yi de kapsadığı ayrıca söylenmiş.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"ÖTV tutarı = Miktar × Birim ÖTV = 2.000 (soruda verilen) × 3 (soruda verilen) = 6.000 TL","anlatim":"ÖTV nedir? Petrol gibi ürünlerde miktar üzerinden alınan özel bir vergidir, burada litre başına sabit tutarla (maktu) hesaplanıyor.","doldur":[[6,1]]},{"formul":"KDV matrahı = ÖTV hariç satış bedeli + ÖTV tutarı = 44.000 (soruda verilen) + 6.000 (2. adımda bulduk) = 50.000 TL","anlatim":"Şimdi biz hesaplıyoruz: KDV matrahı bulunurken ÖTV hariç bırakılmaz, çünkü advalorem KDV\u0027nin matrahı ÖTV dahil satış bedelidir. Dikkat: matraha sadece 44.000 TL değil, ÖTV de eklenir.","doldur":[[7,1]]},{"formul":"Katma Değer Vergisi = KDV matrahı × %20 = 50.000 (3. adımda bulduk) × %20 = 10.000 TL","anlatim":"Katma Değer Vergisi nedir? Mal ve hizmet teslimlerinde matrah üzerinden hesaplanan, alacak niteliğinde bir vergidir; burada advalorem yani değer esaslı hesaplanıyor.","doldur":[[8,1]]},{"formul":"Sonuç: Katma Değer Vergisi = 10.000 TL","anlatim":"Sonuç: değer esasına göre hesaplanan Katma Değer Vergisi tutarı 10.000 TL\u0027dir. Bu tutar matraha ÖTV\u0027nin eklenmesiyle doğru çıkar.","doldur":[]},{"formul":"Yanlış yol: 44.000 × %20 = 8.800 TL (HATALI) → doğrusu 50.000 × %20 = 10.000 TL (4. adımda bulduk)","anlatim":"En sık hata: öğrenci KDV\u0027yi ÖTV hariç 44.000 TL üzerinden hesaplar, bu yanlıştır çünkü matrah ÖTV dahil olmalıdır.","doldur":[]}],"anahtar":[{"ornek":"matrahı","kok":"matrah"},{"ornek":"hesaplanır","kok":"hesapl"},{"ornek":"advalorem","kok":"advalo"},{"ornek":"üzerinden","kok":"üzerin"},{"ornek":"vergide","kok":"vergid"},{"ornek":"bedelidir","kok":"bedeli"}],"konuGiris":{"harita":"Ne zaman test edilir: bir malın satışında hem miktara bağlı hem değere bağlı vergi birlikte verildiğinde. Nasıl ölçülür: spesifik vergi miktar/hacim üzerinden sabit tutarla, advalorem vergi ise parasal matrah üzerinden oranla hesaplanır. Nasıl kaydedilir: önce spesifik vergi tutarı bulunur, matraha eklenir, sonra advalorem vergi bu toplam matrah üzerinden oranla hesaplanır.","desen":"Soru, spesifik ÖTV\u0027nin önce matraha eklenip, KDV\u0027nin bu toplam üzerinden advalorem şekilde hesaplanmasını test eder; tuzak, ÖTV\u0027yi matraha eklemeden direkt satış bedeli üzerinden KDV almaktır. Çıkmış arşivde bu tip 1 dönemde soruldu, tuzak noktası ÖTV\u0027nin matraha dahil olup olmadığının atlanmasıdır. Bu soru p.28 (KDVK m.28) ve spesifik-advalorem ayrımı noktasından geliyor.","terimler":[{"kaynak":"soruda verilir","tanim":"Miktar, ağırlık veya hacim gibi fiziki ölçüye göre sabit tutarla alınan vergi","ad":"Spesifik (maktu) vergi","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Parasal matrah üzerinden oran uygulanarak hesaplanan vergi","ad":"Advalorem (değer esaslı) vergi","kim":"kanun sabitler"},{"kaynak":"sen hesaplarsın","tanim":"Verginin üzerinden hesaplandığı parasal veya fiziki taban değer","ad":"Matrah","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Matraha uygulanan, kanunla belirlenen yüzdelik vergi katsayısı","ad":"KDV oranı","kim":"kanun sabitler"}],"sinavda":"Litre miktarı, litre başı maktu ÖTV, ÖTV hariç satış bedeli ve KDV oranı verilir; advalorem esasa göre KDV tutarı istenir.","panel_ornek":"Bir su faturasında sabit su tüketim ücretine ek olarak, tüketilen metreküp başına sabit bir çevre katkı payı eklenir; sonra bu toplam üzerinden %10 hizmet bedeli hesaplanır. Metreküp başına sabit tutar spesifik, toplam üzerinden alınan yüzdelik ise advalorem mantığa örnektir.","ornek":"Bir su faturasında sabit su tüketim ücretine ek olarak, tüketilen metreküp başına sabit bir çevre katkı payı eklenir; sonra bu toplam üzerinden %10 hizmet bedeli hesaplanır. Metreküp başına sabit tutar spesifik, toplam üzerinden alınan yüzdelik ise advalorem mantığa örnektir.","yontemler":"Önce spesifik ÖTV tutarı (litre x birim ÖTV) bulunur, ÖTV hariç bedele eklenerek KDV matrahı oluşturulur; sonra bu matraha KDV oranı uygulanır.","nedir":"Vergi sınıflandırması, vergilerin yansıma, matrah ölçüm biçimi, mükellef durumu gibi ölçütlere göre gruplanmasıdır. Sınav bu ölçütlerin hangi vergiye karşılık geldiğini ve matrah hesabında spesifik-advalorem farkını ölçer."},"olay":"ÖTV=2.000x3=6.000; KDV matrahı=44.000+6.000=50.000; KDV=50.000x0,20=10.000.","tuzak":{"D":{"ad":"Çifte Sayma Tuzağı","metin":"ÖTV tutarını matraha bir kez yetmezmiş gibi iki kez ekleyip (44.000+6.000+6.000) üzerinden oranı uyguladın. Doğrusu: ÖTV yalnızca bir kez matraha eklenir, matrah 50.000 TL\u0027de kalır."},"E":{"ad":"Vergi Üstüne Vergi Tuzağı","metin":"Doğru hesapladığın 10.000 TL KDV\u0027ye ayrıca ÖTV tutarını (6.000 TL) ekleyerek toplam vergi yükünü tek bir advalorem vergi tutarı sandın. Doğrusu: ÖTV ve KDV ayrı vergilerdir, soru yalnız KDV tutarını sormaktadır."},"A":{"ad":"Spesifik-Advalorem Karıştırma Tuzağı","metin":"2.000 litre x 3 TL\u0027yi hesaplayıp bulduğun 6.000 TL\u0027yi doğrudan sorulan vergi sandın; oysa bu tutar miktar esaslı (spesifik) ÖTV\u0027dir, advalorem KDV değildir. Doğrusu: ÖTV tutarı yalnız KDV matrahına eklenecek bir ara adımdır."},"B":{"ad":"Eksik Matrah Tuzağı","metin":"KDV\u0027yi yalnız 44.000 TL\u0027lik satış bedeli üzerinden hesaplayıp ÖTV\u0027yi matraha katmadın. Doğrusu: soruda matrahın ÖTV\u0027yi de kapsadığı açıkça belirtildiğinden KDV matrahı 44.000+6.000=50.000 TL olmalıdır."}},"celdiriciYol":{"D":"(44.000+6.000+6.000) x 0,20 = 11.200 (ÖTV tutarını matraha iki kez ekledin)","E":"(44.000+6.000) x 0,20 + 6.000 = 16.000 (ÖTV\u0027yi ayrıca vergi tutarına toplayarak çifte saydın)","A":"2.000 x 3 = 6.000 (spesifik vergiyi/ÖTV tutarını advalorem KDV sandın)","B":"44.000 x 0,20 = 8.800 (ÖTV\u0027yi KDV matrahına eklemeyi unuttun)"},"hap":"Spesifik vergi matrahı fiziki ölçüye (litre, adet), advalorem vergi matrahı parasal değere dayanır; KDV matrahı ÖTV dahil tutar üzerinden hesaplanır.","teshis":{"C":{"gercek":"Advalorem vergi parasal değer üzerinden hesaplanır; burada matrah ÖTV dahil 50.000 TL, KDV ise bu matrahın %20\u0027sidir.","ayirt":"Oranı hangi tutara (matrah) uyguladım, matrah doğru mu kuruldu?","paragraf":"Katma Değer Vergisi Kanunu m.28; TEORİ - vergi sınıflandırması","yanilgi":"Bu şıkkı eleyen öğrenci, ÖTV\u0027nin matraha eklenmesi gerektiğini gözden kaçırıyor ya da oranı yanlış tutara uyguluyor."},"E":{"gercek":"ÖTV ve KDV ayrı vergilerdir; ÖTV spesifik, KDV advaloremdir ve soru yalnız KDV tutarını sormaktadır.","ayirt":"Soru hangi tek vergiyi (KDV) sordu, iki vergiyi mi topladım?","paragraf":"TEORİ - vergi sınıflandırması (yansımaya/konusuna göre)","yanilgi":"ÖTV ile KDV\u0027nin aynı vergi olduğunu ya da toplamlarının \u0027advalorem vergi tutarı\u0027 sayılacağını düşünüyorsun."},"A":{"gercek":"Spesifik vergide matrah fiziki ölçüdür (litre, adet); advalorem vergide matrah parasal değerdir. ÖTV burada spesifik, KDV advaloremdir.","ayirt":"Bu tutar bir miktara mı (litre) yoksa parasal değere mi dayanıyor?","paragraf":"TEORİ - vergi sınıflandırması (matrahın ölçülmesine göre)","yanilgi":"Litre başına hesapladığın maktu tutarın kendisinin sorulan advalorem vergi olduğunu sanıyorsun."},"D":{"gercek":"ÖTV, KDV matrahına yalnızca bir kez dahil edilir; matrah tek bir düzeltilmiş toplamdır.","ayirt":"Aynı tutarı hesaplamada birden fazla kez mi kullandım?","paragraf":"TEORİ - vergi sınıflandırması (matrahın ölçülmesine göre)","yanilgi":"ÖTV\u0027yi hem \u0027satış bedeline eklenen kalem\u0027 hem de \u0027ayrıca eklenmesi gereken ikinci kalem\u0027 sanıp iki kez topluyorsun."},"B":{"gercek":"Katma Değer Vergisi Kanunu m.28 uyarınca oran vergiye tabi işlem bedeli üzerinden uygulanır; soru matrahın ÖTV dahil olduğunu açıkça belirtir.","ayirt":"Soru matraha hangi kalemlerin dahil olduğunu söylüyor mu?","paragraf":"Katma Değer Vergisi Kanunu m.28","yanilgi":"KDV matrahının yalnız satış bedelinden ibaret olduğunu, ÖTV\u0027nin matraha girmediğini düşünüyorsun."}},"verilen":[[6,1],[7,1],[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"Matrahın ölçülmesine göre spesifik (miktar esaslı) vergide matrah ağırlık, hacim, adet gibi fiziki bir ölçüdür ve litre başına alınan özel tüketim vergisi buna örnektir; advalorem (değer esaslı) vergide matrah parasal değerdir ve katma değer vergisi ile gelir vergisi bu gruptadır.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Vergi türü sorularında ayrımın dayandığı ölçütü önce yaz: mükellef, matrah, konu ya da oran; şıklar hep bu ölçütler karıştırılarak kurulur.","konu":"vergi siniflandirmasi","tablo":{"satirlar":[["VERİLENLER","-"],["Ölçüt","Matrahın ölçülmesi"],["Örnek","Litre başına özel tüketim vergisi"],["HESAP","-"],["Ne soruluyor","Matrahı ağırlık, hacim veya adet gibi miktar üzerinden belirlenen vergilere ne ad verilir?"],["Kural","Matrahın ölçülmesine göre spesifik (miktar esaslı) vergide matrah ağırlık, hacim, adet gibi fiziki bir ölçüdür ve litre başına alınan özel tüketim vergisi buna örnektir; advalorem (değer esaslı) vergide matrah parasal değerdir ve katma değer vergisi ile gelir vergisi bu gruptadır."],["Doğru şık","C) Spesifik vergi"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Spesifik vergi","E":"Sübjektif vergi","A":"Advalorem vergi","D":"Nispi vergi","B":"Objektif vergi"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - vergi siniflandirmasi","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Vergiler farklı ölçütlere göre sınıflandırılır. (1) YANSIMAYA GÖRE: Dolaysız vergiler (gelir, kurumlar, emlak, motorlu taşıtlar, veraset ve intikal) mükellefin üzerinde kalır; dolaylı vergiler (KDV, ÖTV, gümrük, BSMV, damga) fiyat yoluyla başkasına yansıtılır. (2) KONUSUNA GÖRE: Gelir üzerinden alınan vergiler (gelir, kurumlar), servet üzerinden alınan vergiler (emlak, motorlu taşıtlar, veraset ve intikal), harcama üzerinden alınan vergiler (KDV, ÖTV, gümrük). (3) MATRAHIN ÖLÇÜLMESİNE GÖRE: SPESİFİK (miktar esaslı) vergide matrah ağırlık, hacim, adet gibi fiziki ölçüdür (litre başına ÖTV); ADVALOREM (değer esaslı) vergide matrah parasal değerdir (KDV, gelir vergisi). (4) MÜKELLEFİN DURUMUNA GÖRE: ŞAHSİ (sübjektif) vergi mükellefin kişisel ve ailevi durumunu dikkate alır (gelir vergisinde asgari geçim indirimi, sakatlık indirimi gibi); GAYRİŞAHSİ (objektif) vergi yalnız konuya bakar (KDV, emlak vergisi). (5) KAPSAMINA GÖRE: Genel vergi bütün gelir veya harcamayı kapsar (gelir vergisi, KDV); özel vergi belirli bir kalemi hedefler (ÖTV, motorlu taşıtlar vergisi). (6) ORAN YAPISINA GÖRE: Artan oranlı (matrah büyüdükçe oran artar: gelir vergisi tarifesi), düz (tek) oranlı (kurumlar vergisi), azalan oranlı. KÜÇÜK ÖRNEK: Akaryakıtta litre başına maktu ÖTV spesifik, aynı ürünün satış bedeli üzerinden alınan KDV advaloremdir; veraset ve intikal vergisi servet transferi üzerinden alınan, artan oranlı, dolaysız bir vergidir. SINAV TUZAĞI: (1) Emlak ve motorlu taşıtlar vergisi harcama değil SERVET vergisidir. (2) Kurumlar vergisi düz…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [1/3]","metin":"Madde 3- Münhasıran bu Kanunun uygulanmasında; a) Genel yönetim kapsamındaki kamu idareleri: Uluslararası sınıflandırmalara göre belirlenmiş olan, merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri, b) Merkezî yönetim kapsamındaki kamu idareleri: Bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerini, c) Düzenleyici ve denetleyici kurumlar: Bu Kanuna ekli (III) sayılı cetvelde yer alan kurumları, 22/12/2005 tarihli ve 5436 sayılı Kanunun 10 uncu maddesiyle, bu fıkraya \"25\" ibaresinden sonra gelmek üzere, \"42\" ibaresi; \"43\" ibaresinden sonra gelmek üzere, \"44\" ibaresi ve \"76\" ibaresinden sonra gelmek üzere, \"78\" ibaresi eklenmiştir. 1 d) Sosyal güvenlik kurumları: Bu Kanuna ekli (IV) sayılı cetvelde yer alan kamu kurumlarını, e) Mahallî idare: Yetkileri belirli bir coğrafi alan ve hizmetlerle sınırlı olarak kamusal faaliyet gösteren belediye, il özel idaresi ile bunlara bağlı veya bunların kurdukları veya üye oldukları birlik ve idareleri,2 f) Bütçe: Belirli bir dönemdeki gelir ve gider tahminleri ile bunların uygulanmasına ilişkin hususları gösteren ve usulüne uygun olarak yürürlüğe konulan belgeyi, g) Kamu kaynakları: Borçlanma suretiyle elde edilen imkânlar dahil kamuya ait gelirler, taşınır ve taşınmazlar, hesaplarda bulunan para, alacak ve haklar ile her türlü değerleri, h) Kamu gideri: Kanunlarına veya Cumhurbaşkanlığı kararnamelerine dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, sosyal güvenlik katkı payları, iç ve dış borç faizleri, borçlanma genel giderleri, borçlanma araçlarının iskontolu…"}],"hakem":"Soru vergi sınıflandırması kuralını (matrahın ölçülmesine göre spesifik/advalorem ayrımı) doğru ve tek anlamlı olarak soruyor; cevap C (Spesifik vergi) kaynak metinde açıkça tanımlanan kuralla tam uyumlu."},"kayitlar":[],"sade":{"siklar":{"D":"Nispi vergi oranla hesaplanan vergidir; sorunun tanımı oran yapısı değil matrah ölçüsü ile ilgili.","E":"Sübjektif vergi mükellefin ailevi durumunu dikkate alan vergidir; bu tanım matrah ölçüsü ile ilgili değil.","A":"Advalorem vergide matrah parasal değerdir, fiziki ölçü değil. Sorunun tanımı advaloremi değil.","B":"Objektif vergi mükellefin kişisel durumuna bakmayan vergidir; bu tanım matrahın nasıl ölçüldüğü ile ilgili değil."},"dogru":"Spesifik vergide matrah litre, kilogram, adet gibi fiziki ölçülerle belirlenir; advalorem vergide para cinsinden değerle belirlenir. Sorulan tanım spesifik vergiyi anlatıyor.","sinav":"Matrahı ağırlık, hacim veya adet gibi miktar üzerinden belirlenen vergilere spesifik vergi adı verilir.","kavramlar":[{"kaynak":"TEORI","tanim":"Matrahı ağırlık, hacim, adet gibi fiziki bir ölçü biriminde belirlenen vergidir. Litre başına alınan özel tüketim vergisi örneğidir.","ad":"Spesifik vergi"},{"kaynak":"TEORI","tanim":"Matrahı parasal değer cinsinden belirlenen vergidir. Katma değer vergisi ve gelir vergisi örneğidir.","ad":"Advalorem vergi"},{"kaynak":"TEORI","tanim":"Verginin hesaplanmasına esas olan konu veya değerdir; spesifik vergide fiziki ölçü, advalorem vergide para cinsinden değer olabilir.","ad":"Matrah"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"Matrahı ağırlık, hacim veya adet gibi miktar üzerinden belirlenen vergilere ne ad verilir?","kayitBaslik":"","id":"sgs-t4-maliye-kolay/kp-07","verilenler":[{"deger":"Matrahın ölçülmesi","anlam":"Spesifik ve advalorem ayrımını yapan ölçüttür.","ad":"Ölçüt"},{"deger":"Litre başına özel tüketim vergisi","anlam":"Fiziki ölçüye dayandığı için spesifiktir.","ad":"Örnek"}],"dayanak":"Teori notu: vergi sınıflandırması — matrahın ölçülmesine göre spesifik (miktar esaslı) vergide matrah ağırlık, hacim, adet gibi fiziki ölçüdür, advalorem (değer esaslı) vergide matrah parasal değerdir; akaryakıtta litre başına maktu özel tüketim vergisi spesifik, aynı ürünün satış bedeli üzerinden alınan katma değer vergisi advaloremdir; spesifik ve advalorem ayrımı matrahın ölçü birimine dayanır, verginin dolaylı olmasına değil","dogru":"C","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Ölçüt = Matrahın neyle ölçüldüğü","anlatim":"Matrah fiziki bir birimse spesifik, parasal değerse advalorem vergiden söz edilir.","doldur":[]},{"formul":"Spesifik = Ağırlık, hacim, adet gibi fiziki ölçü","anlatim":"Litre başına alınan maktu özel tüketim vergisi tipik örnektir.","doldur":[[5,1]]},{"formul":"Advalorem = Parasal değer üzerinden yüzde","anlatim":"Katma değer vergisi ve gelir vergisi bu gruptadır. Enflasyonda spesifik verginin reel hasılatı erir, advalorem kendini günceller.","doldur":[[6,1]]}],"anahtar":[{"ornek":"matrah","kok":"matrah"},{"ornek":"vergisi","kok":"vergis"},{"ornek":"vergide","kok":"vergid"},{"ornek":"spesifik","kok":"spesif"},{"ornek":"advalorem","kok":"advalo"},{"ornek":"örnektir","kok":"örnekt"}],"konuGiris":{"harita":"Ne zaman test edilir: Vergiler matrahın nasıl ölçüldüğü sorulduğunda test edilir. Nasıl ölçülür: Matrah ağırlık, hacim veya adet gibi fiziki bir birimle mi yoksa parasal değerle mi belirlendiğine bakılarak ölçülür. Nasıl kaydedilir: Kayıt değil, sınavda doğru terimin (spesifik/advalorem) seçilmesi istenir.","desen":"Soru genelde spesifik ve advalorem ayrımını, dolaylı-dolaysız ayrımıyla karıştırtmaya çalışır; bu ikisi farklı ölçütlerdir. Emlak ve motorlu taşıtlar vergisi servet vergisi sayılır, harcama vergisi değildir; bu da ayrı bir tuzaktır. Bu soru matrahın ölçülmesine göre sınıflandırma (p.28) noktasından geliyor.","terimler":[{"kaynak":"kuraldan bilinir","tanim":"Matrahı ağırlık, hacim, adet gibi fiziki ölçüye dayanan vergi.","ad":"Spesifik vergi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Matrahı parasal (değer esaslı) tutara dayanan vergi.","ad":"Advalorem vergi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","
