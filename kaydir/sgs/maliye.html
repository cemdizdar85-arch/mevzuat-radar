0 litre","anlam":"Toplam vergisiz bedel ve toplam özel tüketim vergisini bulmak için kullanılan miktar.","ad":"Satılan miktar"}],"dayanak":"3065 sayılı Katma Değer Vergisi Kanunu m.28; miktar esaslı ve değer esaslı vergi ayrımı - Maliye teorisi","dogru":"D","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Verilen: Vergisiz birim fiyat 20 TL/litre (soruda verilen); Özel tüketim vergisi 5 TL/litre (soruda verilen); Miktar 200 litre (soruda verilen); Katma değer vergisi oranı %20 (soruda verilen)","anlatim":"Soru bize şunları vermiş: litre başına 5 TL özel tüketim vergisi, vergisiz bedel litre başına 20 TL, 200 litre satış ve katma değer vergisi oranı %20.","verilenAdim":true,"doldur":[[1,1],[2,1],[3,1],[4,1]]},{"formul":"Toplam vergisiz satış bedeli = Miktar × Birim fiyat = 200 (soruda verilen) × 20 (soruda verilen) = 4.000","anlatim":"Önce 200 litrenin vergisiz tutarını buluyoruz, çünkü her verginin üzerine bina edileceği taban bu.","doldur":[[6,1]]},{"formul":"Toplam özel tüketim vergisi = Miktar × Litre başı vergi = 200 (soruda verilen) × 5 (soruda verilen) = 1.000","anlatim":"Özel tüketim vergisi miktar esaslı, yani litre sayısıyla sabit tutarın çarpımı. Oran değil sabit tutar kullanılır, dikkat.","doldur":[[7,1]]},{"formul":"Katma değer vergisi matrahı = Vergisiz bedel + Özel tüketim vergisi = 4.000 (2. adımda bulduk) + 1.000 (3. adımda bulduk) = 5.000","anlatim":"Katma değer vergisi matrahı nedir? Katma değer vergisinin hesaplanacağı tabandır. Burada vergisiz bedel ile özel tüketim vergisi toplanarak bulunur, çünkü soru öyle söylüyor.","doldur":[[8,1]]},{"formul":"Katma değer vergisi = Matrah × %20 = 5.000 (4. adımda bulduk) × %20 = 1.000","anlatim":"Katma değer vergisi nedir? Mal ve hizmet teslimlerinde matrah üzerinden hesaplanan dolaylı vergidir. Burada matrahın %20\u0027si alınır.","doldur":[[9,1]]},{"formul":"Toplam satış fiyatı = Vergisiz bedel + Özel tüketim vergisi + Katma değer vergisi = 4.000 (2. adımda bulduk) + 1.000 (3. adımda bulduk) + 1.000 (5. adımda bulduk) = 6.000","anlatim":"Şimdi tüm parçaları topluyoruz, çünkü soru vergiler dahil toplam satış fiyatını istiyor.","doldur":[[10,1]]},{"formul":"Ters durum: özel tüketim vergisi matrahtan hariç tutulsaydı → Katma değer vergisi matrahı = 4.000, vergi = 800","anlatim":"Ters durumda: eğer katma değer vergisi yalnız vergisiz bedel üzerinden hesaplansaydı, matraha özel tüketim vergisi eklenmezdi.","doldur":[]},{"formul":"Yanlış yol: 4.000 × %20 = 800 (HATALI) → doğrusu 1.000 (5. adımda bulduk)","anlatim":"En sık hata: katma değer vergisini sadece vergisiz bedel üzerinden hesaplamak, özel tüketim vergisini matraha eklememektir.","doldur":[]}],"anahtar":[{"ornek":"vergisi","kok":"vergis"},{"ornek":"matraha","kok":"matrah"},{"ornek":"hesaplanır","kok":"hesapl"},{"ornek":"üzerinden","kok":"üzerin"},{"ornek":"tüketim","kok":"tüketi"},{"ornek":"esaslı","kok":"esaslı"}],"konuGiris":{"harita":"Ne zaman test edilir: dolaylı-dolaysız, spesifik-advalorem gibi ayrımların bir işlem üzerinde birlikte uygulandığı sorularda. Nasıl ölçülür: önce miktar esaslı vergi miktar ile çarpılır, sonra değer esaslı vergi bu ara toplam üzerinden hesaplanır. Nasıl kaydedilir: toplam satış fiyatı, vergisiz bedel + spesifik vergi + advalorem vergi olarak bulunur.","desen":"Soru genelde spesifik ve advalorem vergiyi aynı işlemde art arda hesaplatarak matrah karışıklığı yaratır. Öğrenci genelde KDV\u0027yi vergisiz bedel üzerinden değil, ÖTV dahil tutar üzerinden hesaplamayı unutur. Bu soru matrahın ölçülmesine göre sınıflandırma ve sıralı vergi hesabı noktasından geliyor (p.arşiv, 1 dönem).","terimler":[{"kaynak":"soruda verilir","tanim":"Matrahı ağırlık, hacim, adet gibi fiziki ölçü olan vergi türü","ad":"Spesifik vergi","kim":"kanun sabitler"},{"kaynak":"soruda verilir","tanim":"Matrahı parasal değer olan, oranla hesaplanan vergi türü","ad":"Advalorem vergi","kim":"kanun sabitler"},{"kaynak":"kuraldan bilinir","tanim":"Fiyat yoluyla nihai tüketiciye yansıtılan vergi türü","ad":"Dolaylı vergi","kim":"Tekdüzen hesap planı ya da standart tanımlar"},{"kaynak":"soruda verilir","tanim":"Herhangi bir vergi eklenmeden önceki mal veya hizmet fiyatı","ad":"Vergisiz bedel","kim":"piyasa fiyatlar"}],"sinavda":"Miktar esaslı vergi tutarı, oran ve vergisiz bedel verilir; toplam vergili satış fiyatı istenir.","panel_ornek":"Bir arkadaşın kargo şirketi ürün başına sabit 3 TL taşıma bedeli, ayrıca ürün bedeli üzerinden %10 hizmet bedeli alıyor. Sabit tutar spesifik, yüzdelik tutar advalorem mantığıyla işler; ikisi ayrı ayrı hesaplanıp toplanır.","ornek":"Bir arkadaşın kargo şirketi ürün başına sabit 3 TL taşıma bedeli, ayrıca ürün bedeli üzerinden %10 hizmet bedeli alıyor. Sabit tutar spesifik, yüzdelik tutar advalorem mantığıyla işler; ikisi ayrı ayrı hesaplanıp toplanır.","yontemler":"Önce spesifik vergi miktarla çarpılır, sonra vergisiz bedel ile bu tutar toplanıp advalorem vergi oranı bu ara toplama uygulanır; en kritik kural KDV matrahının ÖTV dahil ara toplam olmasıdır.","nedir":"Vergi sınıflandırması, vergilerin yansıma, konu ve matrah ölçüsüne göre gruplandırılmasıdır. Sınav bu gruplandırmayı ve spesifik-advalorem matrah hesabını ölçer."},"olay":"Vergisiz bedel 200×20=4.000; özel tüketim vergisi 200×5=1.000; katma değer vergisi matrahı 4.000+1.000=5.000; katma değer vergisi 5.000×0,20=1.000; toplam 4.000+1.000+1.000=6.000.","tuzak":{"C":{"ad":"Sıra Tuzağı","metin":"Katma değer vergisini özel tüketim vergisi matraha girmeden hesaplar, sonra özel tüketim vergisini ayrıca eklersin. Doğrusu: Önce matrah birleştirilir, sonra vergi hesaplanır."},"E":{"ad":"Çift Sayım Tuzağı","metin":"Özel tüketim vergisi tutarını hem matrahta hem sonuçta iki kez toplarsın. Doğrusu: Özel tüketim vergisi toplam fiyata yalnızca bir kez eklenir."},"A":{"ad":"Matrah Tuzağı","metin":"Özel tüketim vergisini hiç hesaba katmadan katma değer vergisini yalnız vergisiz bedel üzerinden bulursun. Doğrusu: Katma değer vergisi matrahına özel tüketim vergisi de dahildir."},"B":{"ad":"Eksik Katman Tuzağı","metin":"Özel tüketim vergisini eklersin ama katma değer vergisini hesaplamayı unutursun. Doğrusu: Her iki vergi de toplam fiyata eklenmelidir."}},"celdiriciYol":{"C":"4.000 + 1.000 + (4.000×0,20) = 5.800 (katma değer vergisi matrahına özel tüketim vergisini dahil etmeme)","E":"4.000 + 1.000 + 1.000 + 1.000 = 7.000 (özel tüketim vergisi tutarını sonuca iki kez ekleme)","A":"4.000 + (4.000×0,20) = 4.800 (özel tüketim vergisini hesaba katmadan katma değer vergisi hesaplama)","B":"4.000 + 1.000 = 5.000 (katma değer vergisini hiç hesaplamama)"},"hap":"Miktar esaslı (spesifik) vergi matraha girer, değer esaslı vergi bu birleşik matrah üzerinden hesaplanır.","teshis":{"C":{"gercek":"Katma değer vergisi matraha giren tutarlar netleştikten sonra hesaplanmalıdır; sıra değişirse matrah eksik kalır.","ayirt":"Katma değer vergisini hesaplamadan önce matrahı tam olarak oluşturdum mu?","paragraf":"Maliye teorisi - vergi sınıflandırması","yanilgi":"Vergileri hesaplama sırasının sonucu değiştirmeyeceğini düşünüyorsun."},"E":{"gercek":"Her vergi kalemi nihai fiyata yalnızca bir kez dahil edilir; matrahta yer alan tutar sonuçta tekrar eklenmez.","ayirt":"Aynı tutarı hesabın birden fazla adımında kullanıp kullanmadığımı kontrol ettim mi?","paragraf":"Maliye teorisi - vergi sınıflandırması","yanilgi":"Bir tutarı birden fazla aşamada tekrar eklemenin doğruluğu artıracağını sanıyorsun."},"A":{"gercek":"Özel tüketim vergisi katma değer vergisi matrahına dahil edilen bir tutardır, bu yüzden önce matraha eklenir.","ayirt":"Katma değer vergisini hesaplamadan önce matraha hangi tutarları eklediğimi kontrol ettim mi?","paragraf":"Maliye teorisi - vergi sınıflandırması","yanilgi":"Miktar esaslı vergiyi katma değer vergisinden ayrı, hesaba girmeyen bir kalem sanıyorsun."},"D":{"gercek":"3065 sayılı Katma Değer Vergisi Kanununun 28 inci maddesi çerçevesinde belirlenen oran, özel tüketim vergisi dahil matrah üzerinden uygulanır.","ayirt":"Matrahı oluştururken tüm miktar esaslı vergileri dahil ettim mi?","paragraf":"3065 s.K. m.28","yanilgi":"Bu şıkkı eleyen öğrenci, özel tüketim vergisinin matraha girmeyip yalnızca ayrı bir kalem olduğunu düşünür."},"B":{"gercek":"Soruda iki farklı vergi katmanı vardır; her ikisi de nihai fiyata dahil edilmelidir.","ayirt":"Sorudaki her vergi türünü tek tek hesapladım mı, sonucu topladım mı?","paragraf":"Maliye teorisi - vergi sınıflandırması","yanilgi":"Bir vergi türünü hesapladıktan sonra sonucu bulduğunu sanıp diğer vergiyi hesaplamayı atlıyorsun."}},"verilen":[[6,1],[7,1],[1,1],[2,1],[3,1],[4,1]],"donem":1,"hesaplar":{}},{"capa":{"kaynak":"çıkmış soru"},"kural":"Matrahın ölçülmesine göre spesifik vergide matrah ağırlık, hacim, adet gibi fiziki bir ölçüdür ve vergi bu ölçü başına maktu tutarla alınır; advalorem vergide matrah parasal değerdir. Fiyatlar yükselirken maktu tutar kanunla değiştirilmedikçe sabit kaldığı için spesifik verginin reel hasılatı erir, advalorem vergi ise matrahı fiyatla birlikte büyüdüğü için kendini günceller.","olcum":{"pencere":null,"hesapKod":0,"capa":"","sonDonem":null,"sim":{"model":"claude-sonnet-5","dogru":true,"tur":"teori"},"hakem":"EVET","aritmetik":0},"kayit":[],"teori":true,"taktik":"Enflasyon etkisi sorularında matrahın fiyata bağlı olup olmadığını sor; bağlıysa hasılat korunur, değilse erir.","konu":"vergi siniflandirmasi","tablo":{"satirlar":[["VERİLENLER","-"],["Spesifik vergi","Matrah fiziki ölçü, vergi maktu tutar"],["Advalorem vergi","Matrah parasal değer"],["HESAP","-"],["Ne soruluyor","Enflasyon ortamında spesifik verginin reel hasılatı neden erir?"],["Kural","Matrahın ölçülmesine göre spesifik vergide matrah ağırlık, hacim, adet gibi fiziki bir ölçüdür ve vergi bu ölçü başına maktu tutarla alınır; advalorem vergide matrah parasal değerdir. Fiyatlar yükselirken maktu tutar kanunla değiştirilmedikçe sabit kaldığı için spesifik verginin reel hasılatı erir, advalorem vergi ise matrahı fiyatla birlikte büyüdüğü için kendini günceller."],["Doğru şık","B) Matrahı fiziki ölçü olduğu için tutar kendini güncellemez"]],"basliklar":["Adım","İçerik"]},"siklar":{"C":"Vergi artan oranlı tarifeye tabi olduğu için","E":"Mükellefin kişisel durumu dikkate alındığı için","A":"Matrahı parasal değer olduğu için oran otomatik yükselir","D":"Vergi dolaysız olduğu için yansıtılamaz","B":"Matrahı fiziki ölçü olduğu için tutar kendini güncellemez"},"kaynak":{"alinti":"","liste":[{"ad":"TEORI - vergi siniflandirmasi","metin":"TEORİ (maliye; mevzuat maddesi yok). TANIM VE KURAL: Vergiler farklı ölçütlere göre sınıflandırılır. (1) YANSIMAYA GÖRE: Dolaysız vergiler (gelir, kurumlar, emlak, motorlu taşıtlar, veraset ve intikal) mükellefin üzerinde kalır; dolaylı vergiler (KDV, ÖTV, gümrük, BSMV, damga) fiyat yoluyla başkasına yansıtılır. (2) KONUSUNA GÖRE: Gelir üzerinden alınan vergiler (gelir, kurumlar), servet üzerinden alınan vergiler (emlak, motorlu taşıtlar, veraset ve intikal), harcama üzerinden alınan vergiler (KDV, ÖTV, gümrük). (3) MATRAHIN ÖLÇÜLMESİNE GÖRE: SPESİFİK (miktar esaslı) vergide matrah ağırlık, hacim, adet gibi fiziki ölçüdür (litre başına ÖTV); ADVALOREM (değer esaslı) vergide matrah parasal değerdir (KDV, gelir vergisi). (4) MÜKELLEFİN DURUMUNA GÖRE: ŞAHSİ (sübjektif) vergi mükellefin kişisel ve ailevi durumunu dikkate alır (gelir vergisinde asgari geçim indirimi, sakatlık indirimi gibi); GAYRİŞAHSİ (objektif) vergi yalnız konuya bakar (KDV, emlak vergisi). (5) KAPSAMINA GÖRE: Genel vergi bütün gelir veya harcamayı kapsar (gelir vergisi, KDV); özel vergi belirli bir kalemi hedefler (ÖTV, motorlu taşıtlar vergisi). (6) ORAN YAPISINA GÖRE: Artan oranlı (matrah büyüdükçe oran artar: gelir vergisi tarifesi), düz (tek) oranlı (kurumlar vergisi), azalan oranlı. KÜÇÜK ÖRNEK: Akaryakıtta litre başına maktu ÖTV spesifik, aynı ürünün satış bedeli üzerinden alınan KDV advaloremdir; veraset ve intikal vergisi servet transferi üzerinden alınan, artan oranlı, dolaysız bir vergidir. SINAV TUZAĞI: (1) Emlak ve motorlu taşıtlar vergisi harcama değil SERVET vergisidir. (2) Kurumlar vergisi düz…"},{"ad":"Kamu Malî Yönetimi K. (5018 s.K.) m.3 [1/3]","metin":"Madde 3- Münhasıran bu Kanunun uygulanmasında; a) Genel yönetim kapsamındaki kamu idareleri: Uluslararası sınıflandırmalara göre belirlenmiş olan, merkezî yönetim kapsamındaki kamu idareleri, sosyal güvenlik kurumları ve mahallî idareleri, b) Merkezî yönetim kapsamındaki kamu idareleri: Bu Kanuna ekli (I), (II) ve (III) sayılı cetvellerde yer alan kamu idarelerini, c) Düzenleyici ve denetleyici kurumlar: Bu Kanuna ekli (III) sayılı cetvelde yer alan kurumları, 22/12/2005 tarihli ve 5436 sayılı Kanunun 10 uncu maddesiyle, bu fıkraya \"25\" ibaresinden sonra gelmek üzere, \"42\" ibaresi; \"43\" ibaresinden sonra gelmek üzere, \"44\" ibaresi ve \"76\" ibaresinden sonra gelmek üzere, \"78\" ibaresi eklenmiştir. 1 d) Sosyal güvenlik kurumları: Bu Kanuna ekli (IV) sayılı cetvelde yer alan kamu kurumlarını, e) Mahallî idare: Yetkileri belirli bir coğrafi alan ve hizmetlerle sınırlı olarak kamusal faaliyet gösteren belediye, il özel idaresi ile bunlara bağlı veya bunların kurdukları veya üye oldukları birlik ve idareleri,2 f) Bütçe: Belirli bir dönemdeki gelir ve gider tahminleri ile bunların uygulanmasına ilişkin hususları gösteren ve usulüne uygun olarak yürürlüğe konulan belgeyi, g) Kamu kaynakları: Borçlanma suretiyle elde edilen imkânlar dahil kamuya ait gelirler, taşınır ve taşınmazlar, hesaplarda bulunan para, alacak ve haklar ile her türlü değerleri, h) Kamu gideri: Kanunlarına veya Cumhurbaşkanlığı kararnamelerine dayanılarak yaptırılan iş, alınan mal ve hizmet bedelleri, sosyal güvenlik katkı payları, iç ve dış borç faizleri, borçlanma genel giderleri, borçlanma araçlarının iskontolu…"}],"hakem":"Soru vergi sınıflandırması teorisinin spesifik-advalorem ayrımını ve enflasyon etkisini ölçüyor; B seçeneği kaynak metindeki kuralla (matrah fiziki ölçü olduğu için tutar kendini güncellemez) tam uyumludur."},"kayitlar":[],"sade":{"siklar":{"C":"Artan oran yapısı ile matrahın fiziki veya parasal ölçü olması farklı ayrımlar. Spesifik verginin reel hasılatı erimesinin sebebi oran değil, matrahın fiziki ölçü olmasıdır.","E":"Kişisel durum ölçütü (asgari geçim indirimi gibi) şahsi vergiler için geçerli. Spesifik–advalorem ayrımı mükellefin durumundan bağımsız, matrah ölçüsüne dayalıdır.","D":"Yansıtılıp yansıtılmama (dolaysız–dolaylı) ile matrah ölçüsü ilgisiz. Spesifik vergi hem dolaysız hem dolaylı olabilir; sorun matrahın fiziki ölçü olmasıdır.","A":"Parasal değer matrahı advalorem vergiye aittir ve advalorem vergi enflasyonda kendini günceller. Spesifik vergi matrahı fiziki ölçüdür, değer değil."},"dogru":"Spesifik vergide matrah litre, kilo, adet gibi fiziki bir ölçüdür ve vergi bu ölçü başına maktu (sabit) tutarla alınır. Enflasyon sırasında bu tutarı kanun değiştirilmedikçe sabit kalır, reel değeri erir. Advalorem vergi matrahı parasal değer olduğu için fiyatla birlikte otomatik büyür.","sinav":"Teori — Vergi Sınıflandırması — Matrahın ölçülmesine göre spesifik vergide matrah fiziki ölçü (ağırlık, hacim, adet), advalorem vergide matrah parasal değerdir; enflasyonda maktu tutar kanunla değişmediği sürece sabit kalır.","kavramlar":[{"kaynak":"TEORI","tanim":"Matrahı ağırlık, hacim, adet gibi fiziki bir ölçü birimiyle belirlenen ve bu ölçü başına maktu tutarla alınan vergidir.","ad":"Spesifik vergi"},{"kaynak":"TEORI","tanim":"Matrahı parasal değer olarak belirlenen vergidir; fiyatlar yükselirse matrah da kendini otomatik güncelleştirir.","ad":"Advalorem vergi"},{"kaynak":"TEORI","tanim":"Verginin hesaplanmasının temel alındığı konu veya miktardır; fiziki ölçü (spesifik) veya parasal değer (advalorem) biçiminde olabilir.","ad":"Matrah"}]},"cikmis":{"pencereDonemler":[],"kopru":1,"ornekler":[],"donemler":["2024/2"]},"oyun":null,"tip":"teori","soru":"Enflasyon ortamında spesifik verginin reel hasılatı neden erir?","kayitBaslik":"","id":"sgs-t4-maliye-zor/kp-07","verilenler":[{"deger":"Matrah fiziki ölçü, vergi maktu tutar","anlam":"Fiyat değişince tutar kendiliğinden değişmez.","ad":"Spesifik vergi"},{"deger":"Matrah parasal değer","anlam":"Fiyat yükselince matrah da büyüdüğü için hasılat korunur.","ad":"Advalorem vergi"}],"dayanak":"Teori notu: vergi sınıflandırması ve vergileme ilkeleri — spesifik vergide matrah ağırlık, hacim, adet gibi fiziki ölçüdür ve vergi maktu tutarla alınır, advalorem vergide matrah parasal değerdir ve vergi yüzde olarak hesaplanır; enflasyonda spesifik verginin reel hasılatı erir, advalorem vergi ise kendini günceller","dogru":"B","oyunBonus":null,"ders":"Maliye","adimlar":[{"formul":"Adım 1 = Spesifik vergide matrah fiziki ölçüdür","anlatim":"Litre, kilogram ya da adet başına maktu tutar alınır.","doldur":[]},{"formul":"Adım 2 = Maktu tutar fiyat yükselse de kendiliğinden değişmez","anlatim":"Tutarın büyümesi için kanun ya da idari karar gerekir.","doldur":[[5,1]]},{"formul":"Sonuç = Enflasyonda spesifik verginin reel hasılatı erir","anlatim":"Advalorem vergide matrah parasal değer olduğu için fiyat yükseldikçe hasılat da büyür ve reel değer korunur.","doldur":[[6,1]]}],"anahtar":[{"ornek":"matrah","kok":"matrah"},{"ornek":"vergide","kok":"vergid"},{"ornek":"spesifik","kok":"spesif"},{"ornek":"hasılatı","kok":"hasıla"},{"ornek":"fiyatla","kok":"fiyatl"},{"ornek":"advalorem","kok":"advalo"}],"konuGiris":{"harita":"Ne zaman test edilir: spesifik ve advalorem vergi ayrımı, matrahın fiziki mi parasal mı olduğu sorulduğunda test edilir. Nasıl ölçülür: verginin miktar esaslı (litre, adet, kg) mi yoksa değer esaslı (tutar üzerinden yüzde) mi olduğuna bakılarak ölçülür. Nasıl kaydedilir: soruda verilen vergi türü örneğinin (örn. litre başına ÖTV) hangi sınıfa girdiği tanım karşılaştırmasıyla belirlenir.","desen":"Soru genelde spesifik verginin sabit tutarlı yapısı ile enflasyonun fiyatları artırması arasındaki çelişkiyi sorar; öğrenci advalorem ile karıştırırsa yanılır. Tuzak, spesifik verginin nominal olarak sabit kalırken reel değerinin düşmesini ilişkilendirememektir ( // 06.09 seviye: ölçümden türer (bkz. kart kurulumu). k = sınıf anahtarı, ad = ekran adı (Nöbet dili: Isınma / Nöbet / Alarm), neden = ipucu.
function seviyeHesapla(s){
  const o=s.olcum||{}; const tip=s.tip||'teori'; const ders=String(s.ders||'');
  if(o.sim&&o.sim.dogru===false) return {k:'alarm',ad:'🔴 Alarm',neden:'Nöbetçi öğrencisi bu anlatımla ikizi çözemedi; dikkat ister'};
  if(tip==='hesap'&&/Maliyet|Mali Tablolar/.test(ders)) return {k:'alarm',ad:'🔴 Alarm',neden:'Ölçüm: Maliyet ve Mali Tablolar hesap soruları sınavın en zorları'};
  if(tip==='teori') return {k:'isinma',ad:'🟢 Isınma',neden:'Teori sorusu: kuralı bil, olayı eşle'};
  return {k:'nobet',ad:'🟡 Nöbet',neden:(tip==='kayit'?'Kayıt sorusu: hesap ve taraf seçimi':'Hesap sorusu: verilenleri sırayla işle')};
}

const GUN=86400000; const KUTU={ kayit:[], kutu:[], oyun:[], ileri:0 };   // ileri: demo icin "zaman ileri sarma" (ms)
try{ KUTU.kayit=JSON.parse(localStorage.getItem('kc_kayit')||'[]'); KUTU.kutu=JSON.parse(localStorage.getItem('kc_kutu')||'[]'); KUTU.oyun=JSON.parse(localStorage.getItem('kc_oyun')||'[]'); KUTU.ileri=parseInt(localStorage.getItem('kc_ileri')||'0')||0; }catch(e){}
const simdi=()=>Date.now()+KUTU.ileri;
function kutuKaydet(){ try{ localStorage.setItem('kc_kayit',JSON.stringify(KUTU.kayit.slice(-500))); localStorage.setItem('kc_kutu',JSON.stringify(KUTU.kutu)); localStorage.setItem('kc_oyun',JSON.stringify(KUTU.oyun.slice(-500))); localStorage.setItem('kc_ileri',String(KUTU.ileri)); }catch(e){} }
// 05.09 Cem "ipucu sayısını Hazırlık Skoru'na yansıt": Sen çöz sonucu kaydedilir — tam (ipuçsuz) = +0,25 ustalık,
// ipuçlu = +0,12, doğruları göster = 0. Yanlış Kutusu'na girmez; yalnız skora işler.
function oyunKaydet(s,sonuc){ KUTU.oyun.push({id:s.id,sonuc:sonuc,t:simdi()}); kutuKaydet(); skorCiz(); }
function cevapKaydet(s,dogruMu){
  KUTU.kayit.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,dogru:dogruMu,t:simdi()});
  const k=KUTU.kutu.find(x=>x.id===s.id);
  if(!dogruMu){ if(k){ k.tur=1; k.due=simdi()+2*GUN; k.yanlis=(k.yanlis||0)+1; } else { KUTU.kutu.push({id:s.id,konu:s.konu,ders:s.ders,donem:s.donem,tur:1,due:simdi()+2*GUN,yanlis:1}); } }
  else if(k){ if(k.tur>=2){ KUTU.kutu=KUTU.kutu.filter(x=>x.id!==s.id); } else { k.tur=2; k.due=simdi()+7*GUN; } }
  kutuKaydet(); skorCiz();
}
function skorHesapla(){
  // konu ustaligi: kutuda -> 0,3 (tur2: 0,6); son cevap dogru ve kutuda degil -> 1; hic cozulmemis -> 0. Agirlik = konunun cikmis donem sayisi (sinav DNA'si).
  const konular={}; SORULAR.forEach(s=>{ konular[s.id]={ders:s.ders,w:Math.max(1,s.donem||1),u:0,cozuldu:false}; });
  KUTU.kayit.forEach(r=>{ const k=konular[r.id]; if(k){ k.cozuldu=true; k.u=r.dogru?1:0; } });
  KUTU.kutu.forEach(x=>{ const k=konular[x.id]; if(k){ k.u=x.tur>=2?0.6:0.3; } });
  const sonOyun={}; KUTU.oyun.forEach(o=>{ sonOyun[o.id]=o.sonuc; }); let oyTam=0,oyIp=0;
  Object.entries(konular).forEach(([id,k])=>{ const o=sonOyun[id]; if(o==='tam'){ k.u=Math.min(1,k.u+0.25); oyTam++; } else if(o==='ipuclu'){ k.u=Math.min(1,k.u+0.12); oyIp++; } });
  const ders={}; let tw=0,tu=0,cz=0; Object.values(konular).forEach(k=>{ if(!ders[k.ders]) ders[k.ders]={w:0,u:0,n:0,c:0}; ders[k.ders].w+=k.w; ders[k.ders].u+=k.w*k.u; ders[k.ders].n++; if(k.cozuldu){ ders[k.ders].c++; cz++; } tw+=k.w; tu+=k.w*k.u; });
  return { toplam: tw?Math.round(tu/tw*100):0, cozulen:cz, n:SORULAR.length, oyunTam:oyTam, oyunIpuclu:oyIp, ders:Object.entries(ders).map(([ad,d])=>({ad,yuzde:d.w?Math.round(d.u/d.w*100):0,cozulen:d.c,n:d.n})) };
}
function skorCiz(){ const sk=skorHesapla(); const vade=KUTU.kutu.filter(x=>x.due<=simdi()).length; const azVeri=KUTU.kayit.length<5; document.querySelectorAll('.skorCip').forEach(el=>{ el.textContent=azVeri?'🎯 —':('🎯 %'+sk.toplam); el.title=azVeri?'Hazırlık skoru 5 sorudan sonra görünür':'Hazırlık skoru'; }); /* 05.09: ilk yanlıştan sonra "%4" görmek caydırıcı; 5 cevaptan önce yüzde yok */ document.querySelectorAll('.kutuCip').forEach(el=>{ el.textContent='📥 '+KUTU.kutu.length+(vade?' ·'+vade+' hazır':''); el.classList.toggle('hazir',vade>0); }); }
function kartSifirla(i){ const k=akis.children[i]; if(!k) return; delete durum.cevap[i]; k.querySelectorAll('.sik').forEach(x=>{ x.disabled=false; x.classList.remove('dogru','yanlis'); }); const p=k.querySelector('.panel'); p.classList.remove('acik'); k.querySelectorAll('.sek').forEach(x=>x.classList.remove('acik')); k.querySelectorAll('.cip2').forEach(x=>x.classList.remove('acik')); k.querySelector('.ipucu').style.display=''; document.querySelectorAll('.noktalar i[data-j="'+i+'"]').forEach(n=>{ n.classList.remove('ok','yan'); }); k.scrollIntoView({behavior:'smooth'}); }
function kutuEkraniAc(){
  let e=document.getElementById('kutuEkran'); if(!e){ e=document.createElement('div'); e.id='kutuEkran'; e.className='kutuEkran'; document.body.appendChild(e); }
  const sk=skorHesapla(); const t=simdi();
  const gunStr=ms=>{ const d=Math.ceil((ms-t)/GUN); return d<=0?'<b style="color:var(--yesil)">şimdi hazır</b>':(d+' gün sonra'); };
  e.innerHTML='<div class="kutuIc"><div class="basl"><span>🎯 Hazırlık skoru ve yanlış kutusu</span><button class="btn" id="kutuKapat" style="padding:5px 10px">✕</button></div>'
   +'<div class="skorBuyuk">%'+sk.toplam+'</div><div class="ipnot">Sınav DNA’sı ağırlıklı: çok çıkan konudaki yanlış daha çok düşürür. Çözülen '+sk.cozulen+' / '+sk.n+' konu · Sen çöz: '+sk.oyunTam+' ipuçsuz (tam puan) · '+sk.oyunIpuclu+' ipuçlu (yarım puan).</div>'
   +sk.ders.map(d=>'<div class="dersSat"><span>'+esc(d.ad)+'</span><div class="bar"><i style="width:'+d.yuzde+'%"></i></div><b>%'+d.yuzde+'</b></div>').join('')
   +'<div class="et" style="margin-top:14px">📥 Yanlış kutusu ('+KUTU.kutu.length+')</div>'
   +(KUTU.kutu.length?KUTU.kutu.map(x=>{ const i=SORULAR.findIndex(s=>s.id===x.id); return '<div class="kutuSat"><div><b>'+esc(x.konu)+'</b> <span class="ipnot" style="display:inline">· '+(x.tur>=2?'2. tur (7 gün)':'1. tur (2 gün)')+' · '+gunStr(x.due)+'</span></div>'+(x.due<=t&&i>=0?'<button class="btn mavi kutuCoz" data-i="'+i+'">Şimdi çöz</button>':'')+'</div>'; }).join(''):'<p class="ipnot">Kutu boş. Yanlış yaptığın her soru buraya düşer ve 2 gün sonra geri gelir.</p>')
   +'<div class="btnrow" style="margin-top:14px"><button class="btn" id="kutuIleri">⏩ Demo: 2 gün ileri sar</button><button class="btn gri" id="kutuSifirla">Verileri sıfırla</button></div>'
   +'<p class="ipnot">Nasıl çalışır: yanlış → kutuya girer, 2 gün sonra geri gelir; o gün doğru bilirsen 7 gün sonra bir kez daha gelir; onu da bilirsen kutudan çıkar ve ustalık tam sayılır.</p></div>';
  e.classList.add('acik');
  e.querySelector('#kutuKapat').addEventListener('click',()=>e.classList.remove('acik'));
  e.querySelector('#kutuIleri').addEventListener('click',()=>{ KUTU.ileri+=2*GUN; kutuKaydet(); kutuEkraniAc(); skorCiz(); });
  e.querySelector('#kutuSifirla').addEventListener('click',()=>{ if(confirm('Skor, kutu ve seri sıfırlansın mı?')){ KUTU.kayit=[]; KUTU.kutu=[]; KUTU.ileri=0; kutuKaydet(); location.reload(); } });
  e.querySelectorAll('.kutuCoz').forEach(b=>b.addEventListener('click',()=>{ e.classList.remove('acik'); kartSifirla(parseInt(b.dataset.i)); }));
}

    let sx=null; serit.addEventListener('pointerdown',e=>{ sx=e.clientX; }); serit.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>50) adimGit(dx<0?1:-1); });
    document.addEventListener('keydown',e=>{ if(!ders.classList.contains('acik')) return; if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); adimGit(1); } if(e.key==='ArrowLeft'){ e.preventDefault(); adimGit(-1); } if(e.key==='Escape'){ ders.classList.remove('acik'); } });
    bDers.addEventListener('click',()=>{ dersKur(); ders.classList.add('acik'); });
    ders.querySelector('.bDersKapat').addEventListener('click',()=>ders.classList.remove('acik'));
  }
});
// --- son kart
const son=document.createElement('section'); son.className='kart son';
son.innerHTML='<div class="ust"><span>Nöbet bitti</span>'+noktalar(-1)+'<span>&nbsp;</span></div><div class="govde son" style="display:flex;flex-direction:column;justify-content:center"><div id="sonSkor"></div></div>';
akis.appendChild(son);
document.querySelectorAll('.skorCip,.kutuCip').forEach(b=>b.addEventListener('click',kutuEkraniAc)); skorCiz();
if(!durum.t0) durum.t0={}; durum.t0[0]=Date.now();   // ilk kart: süre sayfa açılınca başlar
akis.addEventListener('scroll',()=>{ const i=Math.round(akis.scrollTop/akis.clientHeight); document.querySelectorAll('.noktalar i').forEach(n=>n.classList.toggle('simdi',n.dataset.j==String(i)||(i>=SORULAR.length&&n.dataset.j==='son')));
  if(i<SORULAR.length&&durum.cevap[i]===undefined&&!durum.t0[i]) durum.t0[i]=Date.now();   // 06.09: karta gelince süre başlar
  if(i>=SORULAR.length){ const c=Object.keys(durum.cevap).length; document.getElementById('sonSkor').innerHTML='<div class="buyuk">'+durum.dogru+' / '+SORULAR.length+'</div><div class="seri">🔥 Denk serisi: '+durum.seri+'</div><p style="color:var(--dim);font-size:.9em">'+(SORULAR.length-durum.dogru)+' yanlış kutuya girdi, 2 gün sonra yeniden gelir.</p><div class="skorBuyuk" style="font-size:2.2em">🎯 Hazırlık %'+skorHesapla().toplam+'</div><button class="btn mavi" onclick="kutuEkraniAc()">📥 Yanlış kutusu ('+KUTU.kutu.length+')</button><div class="paylas">Tetikte · Kaydır-Çöz<br><b>'+durum.dogru+'/'+SORULAR.length+' doğru · seri '+durum.seri+'</b><br><span style="color:var(--dim)">Yanlışını böyle öğrenirsin.</span></div><button class="btn ana" onclick="akis.scrollTo({top:0,behavior:\'smooth\'})">Baştan ▲</button>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'||e.key==='PageDown'){ akis.scrollBy({top:akis.clientHeight,behavior:'smooth'}); } if(e.key==='ArrowUp'||e.key==='PageUp'){ akis.scrollBy({top:-akis.clientHeight,behavior:'smooth'}); } });
/* 09.09 derin bağlantı (ana sayfa kartı → günün sorusu): #s=<sıra> kartını açar; yoksa baştan. */
window.addEventListener('load',function(){ try{ var m=location.hash.match(/#s=(\d+)/); var a=document.getElementById('akis'); if(m&&a&&a.children[+m[1]]) a.scrollTo({top:a.children[+m[1]].offsetTop,behavior:'instant'}); }catch(e){} });
