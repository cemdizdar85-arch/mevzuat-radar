<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Meydan okuma sahnesi v2</title>
<!-- 21.10.2026 Cem'in getirdiği revizyon: "test ekranı gibi; yazılım hissi ver". Uygulama penceresi çerçevesi (Tetikte üst çubuğu),
     soru üzerinde tarama çizgisi, "Hata tespit edildi" uyarısı (kısa kayma efekti), keskin yazı tipi Inter. Renk marka: lacivert + kehribar.
     Kare kare çizilir: bas.js her kare için kare(t) çağırır. Yazılar kur(veri) ile md'den gelir.
     GÜVENLİ ALAN (Meta Reels 9:16): üst %14, alt %35, yanlar %6 yazısız → 360×640'ta x 22–338, y 90–416. Çerçeve süsü taşabilir, yazı taşamaz. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
  :root{ --zemin:#0b1626; --zemin2:#12223a; --kart:#16273f; --cizgi:#2a3b57; --ink:#f4f6fa; --soluk:#9fb0c8;
         --amber:#f5a524; --amber2:#ffc24b; --kirmizi:#f87171; --yesil:#4ade80; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:360px; height:640px; overflow:hidden; color:var(--ink); font-family:Inter,"Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(circle at 80% 8%, color-mix(in srgb,var(--amber) 16%,transparent), transparent 42%),
      radial-gradient(circle at 10% 90%, color-mix(in srgb,#3b82f6 14%,transparent), transparent 45%),
      repeating-linear-gradient(0deg, color-mix(in srgb,var(--soluk) 6%,transparent) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, color-mix(in srgb,var(--soluk) 6%,transparent) 0 1px, transparent 1px 24px),
      var(--zemin); }
  #alan{ position:absolute; left:22px; top:90px; width:316px; height:326px; }
  #pencere{ position:absolute; inset:0; border-radius:14px; background:color-mix(in srgb,var(--kart) 92%,transparent);
    border:1px solid color-mix(in srgb,var(--amber) 35%,var(--cizgi));
    box-shadow:0 0 0 1px color-mix(in srgb,#000 40%,transparent), 0 18px 40px color-mix(in srgb,#000 55%,transparent), 0 0 30px color-mix(in srgb,var(--amber) 12%,transparent);
    overflow:hidden; display:flex; flex-direction:column; }
  #cubuk{ flex:none; height:30px; display:flex; align-items:center; gap:6px; padding:0 10px; border-bottom:1px solid var(--cizgi);
    background:color-mix(in srgb,var(--zemin2) 90%,transparent); }
  #logo{ width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px var(--amber); }
  #marka{ font-weight:800; font-size:11.5px; letter-spacing:-.3px; }
  #ders{ font-size:9px; font-weight:600; color:var(--soluk); margin-left:4px; white-space:nowrap; }
  #sure{ margin-left:auto; width:22px; height:22px; border-radius:50%; border:2px solid var(--amber); color:var(--amber);
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  #ilerle{ position:absolute; left:0; top:30px; height:2px; background:var(--amber); }
  #icerik{ position:relative; flex:1; padding:8px 10px 8px; display:flex; flex-direction:column; min-height:0; }
  #soru{ font-size:10.4px; line-height:1.42; font-weight:500; color:var(--ink); overflow:hidden; position:relative; }
  #tarama{ position:absolute; left:0; right:0; height:16px; pointer-events:none;
    background:linear-gradient(180deg, transparent, color-mix(in srgb,var(--amber) 30%,transparent) 60%, var(--amber2) 92%, transparent); }
  #kutular{ display:flex; flex-direction:column; gap:5px; }
  .kutu{ border-radius:9px; padding:6px 9px; }
  #hata{ align-self:flex-start; font-size:9.5px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:#fff;
    background:var(--kirmizi); border-radius:6px; padding:3px 8px; margin-bottom:5px; }
  #tuzak{ background:color-mix(in srgb,var(--kirmizi) 14%,transparent); border:1px solid var(--kirmizi); }
  #tuzak b{ display:block; color:var(--kirmizi); font-size:12.5px; font-weight:800; margin-bottom:2px; }
  #tuzak span{ font-size:10.5px; line-height:1.35; color:#ffe1e1; }
  #dogrusu{ background:color-mix(in srgb,var(--yesil) 12%,transparent); border:1px solid var(--yesil); }
  #dogrusu i{ display:block; font-style:normal; font-size:8.5px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--yesil); opacity:.85; }
  #dogrusu b{ display:block; color:var(--yesil); font-size:12.5px; font-weight:800; margin:1px 0 2px; }
  #dogrusu span{ font-size:10.5px; line-height:1.35; color:#dcffe9; }
  #siklar{ margin-top:auto; display:flex; flex-direction:column; gap:4px; padding-top:6px; }
  .sik{ border:1px solid var(--cizgi); background:color-mix(in srgb,var(--zemin) 70%,transparent); border-radius:8px; padding:4px 9px;
    font-size:10.6px; font-weight:700; }
  .sik.yanlis{ background:color-mix(in srgb,var(--kirmizi) 22%,transparent); border-color:var(--kirmizi); color:#ffd6d6; }
  .sik.dogru{ background:color-mix(in srgb,var(--yesil) 18%,transparent); border-color:var(--yesil); color:#d4ffe4; }
  .perde{ position:absolute; inset:0; z-index:5; }
  .perde .ic{ position:absolute; left:22px; top:90px; width:316px; height:326px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:14px; }
  #acilis{ background:color-mix(in srgb,var(--zemin) 94%,transparent); }
  #acilis p{ font-size:28px; line-height:1.15; font-weight:900; letter-spacing:-1px; }
  #acilis p em{ font-style:normal; color:var(--kirmizi); }
  #kapanis{ background:var(--zemin); }
  #kapanis p{ font-size:24px; font-weight:800; line-height:1.2; letter-spacing:-.6px; }
  #kapanis .adres{ font-size:21px; color:var(--amber2); letter-spacing:0; }
  #lamba{ width:20px; height:20px; border-radius:50%; background:var(--amber); }
  .etiketP{ font-size:10px; font-weight:600; color:color-mix(in srgb,var(--ink) 70%,transparent); position:absolute; top:0; left:0; }
</style>
</head>
<body>
<div id="alan">
  <div id="pencere">
    <div id="cubuk"><span id="logo"></span><span id="marka"></span><span id="ders"></span><span id="sure">7</span></div>
    <div id="ilerle"></div>
    <div id="icerik">
      <div id="soru"><span id="soruMetin"></span><div id="tarama"></div></div>
      <div id="kutular">
        <div id="hata"></div>
        <div class="kutu" id="tuzak"><b></b><span></span></div>
        <div class="kutu" id="dogrusu"><i></i><b></b><span></span></div>
      </div>
      <div id="siklar"></div>
    </div>
  </div>
</div>
<div class="perde" id="acilis"><div class="ic"><span class="etiketP"></span><p></p></div></div>
<div class="perde" id="kapanis"><div class="ic"><span class="etiketP"></span><div id="lamba"></div><p id="kapanisCumle"></p><p class="adres" id="adres"></p></div></div>
<script>
var Z = { acilisSon:2.0, sayacBas:2.0, sayacSon:9.0, yanlis:9.0, dogru:10.0, kutuBas:10.0, kapanisBas:16.0, son:19.0 };
var $ = function(id){ return document.getElementById(id); };
var V = null, SORU_H = 0;
function e(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function kur(v){
  V = v; if (v.Z) for (var z in v.Z) Z[z] = v.Z[z];
  Array.prototype.forEach.call(document.querySelectorAll('.etiketP'), function(x){ x.textContent = v.etiket; });
  /* açılışta "N'ü yanlış yaptı" kırmızı */
  $('acilis').querySelector('p').innerHTML = e(v.acilis).replace(/(\d+['’]?\S* yanlış yaptı)/, '<em>$1</em>');
  $('marka').textContent = v.arayuz[0]; $('ders').textContent = v.arayuz[1]; $('hata').textContent = v.arayuz[2];
  $('dogrusu').querySelector('i').textContent = v.arayuz[3];
  $('soruMetin').textContent = v.soru;
  $('siklar').innerHTML = '';
  v.siklar.forEach(function(s){ var d = document.createElement('div'); d.className = 'sik'; d.dataset.h = s.h; d.textContent = s.h + ') ' + s.m; $('siklar').appendChild(d); });
  $('tuzak').querySelector('b').textContent = v.tuzakAd; $('tuzak').querySelector('span').textContent = v.tuzakNeden;
  $('dogrusu').querySelector('b').textContent = v.dogrusu; $('dogrusu').querySelector('span').textContent = v.kural;
  $('kapanisCumle').textContent = v.kapanis; $('adres').textContent = v.adres;
  SORU_H = $('soru').scrollHeight;
  return true;
}
function arada(t, a, b){ return Math.max(0, Math.min(1, (t - a) / (b - a))); }
function yum(x){ return x * x * (3 - 2 * x); }
function kare(t){
  var ac = 1 - yum(arada(t, Z.acilisSon - 0.2, Z.acilisSon));
  $('acilis').style.opacity = ac; $('acilis').style.display = ac > 0 ? 'block' : 'none';
  /* pencere açılışta hafif büyüyerek gelir */
  var pg = yum(arada(t, Z.acilisSon - 0.2, Z.acilisSon + 0.25));
  $('pencere').style.transform = 'scale(' + (0.96 + 0.04 * pg).toFixed(4) + ')';
  var kalan = Math.max(0, Z.sayacSon - Math.max(t, Z.sayacBas));
  $('sure').textContent = t < Z.sayacSon ? String(Math.ceil(kalan - 1e-9)) : '0';
  $('sure').style.opacity = t >= Z.sayacSon ? 0.4 : 1;
  $('sure').style.borderColor = kalan <= 3 && t < Z.sayacSon ? 'var(--kirmizi)' : 'var(--amber)';
  $('sure').style.color = kalan <= 3 && t < Z.sayacSon ? 'var(--kirmizi)' : 'var(--amber)';
  $('ilerle').style.width = (100 * (1 - kalan / (Z.sayacSon - Z.sayacBas))).toFixed(2) + '%';
  /* tarama çizgisi: soru metni üstünden iki kez geçer */
  var tg = arada(t, Z.sayacBas + 0.1, Z.sayacBas + 2.3);
  var tur = (tg * 2) % 1;
  $('tarama').style.display = (tg > 0 && tg < 1) ? 'block' : 'none';
  $('tarama').style.top = (tur * Math.max(0, SORU_H - 16)).toFixed(1) + 'px';
  Array.prototype.forEach.call(document.querySelectorAll('.sik'), function(el){
    el.classList.toggle('yanlis', t >= Z.yanlis && el.dataset.h === V.fisiltiHarf);
    el.classList.toggle('dogru', t >= Z.dogru && el.dataset.h === V.dogruHarf);
    el.style.display = (t >= Z.kutuBas && el.dataset.h !== V.fisiltiHarf && el.dataset.h !== V.dogruHarf) ? 'none' : '';
  });
  var yEl = document.querySelector('.sik[data-h="' + V.fisiltiHarf + '"]');
  var tit = t >= Z.yanlis && t < Z.yanlis + 0.35 ? Math.abs(Math.sin((t - Z.yanlis) * 60)) * 2 * (1 - (t - Z.yanlis) / 0.35) : 0;
  if (yEl) yEl.style.transform = 'translateY(' + tit.toFixed(2) + 'px)';
  /* soru kapanır, kutular girer */
  var kapan = yum(arada(t, Z.kutuBas, Z.kutuBas + 0.3)), kutu = yum(arada(t, Z.kutuBas + 0.3, Z.kutuBas + 0.6));
  $('soru').style.opacity = 1 - kapan; $('soru').style.height = (SORU_H * (1 - kapan)).toFixed(1) + 'px';
  $('kutular').style.display = kutu > 0 ? 'flex' : 'none'; $('kutular').style.opacity = kutu;
  /* hata rozeti: ilk 0,4 sn kayma (RGB ayrışması) */
  var gl = t >= Z.kutuBas + 0.3 && t < Z.kutuBas + 0.7 ? (Math.sin((t - Z.kutuBas) * 90) > 0 ? 1 : -1) * (1 - (t - Z.kutuBas - 0.3) / 0.4) : 0;
  $('hata').style.transform = 'translateX(' + (gl * 2).toFixed(2) + 'px)';
  $('hata').style.textShadow = gl ? (gl * 1.5).toFixed(1) + 'px 0 #22d3ee, ' + (-gl * 1.5).toFixed(1) + 'px 0 #facc15' : 'none';
  var dg = yum(arada(t, Z.kutuBas + 1.4, Z.kutuBas + 1.85)); $('dogrusu').style.opacity = dg;
  var kp = yum(arada(t, Z.kapanisBas, Z.kapanisBas + 0.35));
  $('kapanis').style.opacity = kp; $('kapanis').style.display = kp > 0 ? 'block' : 'none';
  var nabiz = 0.5 + 0.5 * Math.cos((t - Z.kapanisBas) * Math.PI / 1.1);
  $('lamba').style.boxShadow = '0 0 0 ' + (6 + 4 * nabiz).toFixed(1) + 'px color-mix(in srgb,var(--amber) 18%,transparent), 0 0 ' + (20 + 14 * nabiz).toFixed(0) + 'px color-mix(in srgb,var(--amber) 65%,transparent)';
}
/* Güvenli alan: görünür yazılar x 22–338, y 90–416 içinde mi; içerik kutusu taşıyor mu */
function alanDisi(){
  var hata = [];
  var secici = '#cubuk,#soru,#kutular .kutu,#hata,.sik,#acilis p,#kapanis p,.etiketP,#lamba';
  Array.prototype.forEach.call(document.querySelectorAll(secici), function(el){
    var ata = el.closest('.perde'); if (ata && ata.style.display === 'none') return;
    if (el.closest('#kutular') && $('kutular').style.display === 'none') return;
    if (parseFloat(getComputedStyle(el).opacity) === 0 || el.offsetHeight < 1 || el.style.display === 'none') return;
    var r = el.getBoundingClientRect();
    if (r.left < 21.5 || r.right > 338.5 || r.top < 89.5 || r.bottom > 416.5) hata.push((el.id || el.className || el.tagName) + ' ' + [r.left, r.top, r.right, r.bottom].map(function(x){ return x.toFixed(0); }).join(','));
  });
  var ic = $('icerik'); if (ic.scrollHeight > ic.clientHeight + 1) hata.push('#icerik kırpılıyor ' + ic.scrollHeight + '>' + ic.clientHeight);
  return hata;
}
window.kur = kur; window.kare = kare; window.alanDisi = alanDisi; window.Z = Z;
</script>
</body>
</html>
