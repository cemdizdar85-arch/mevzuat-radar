<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sınav Nöbeti kural karuseli</title>
<!-- 21.10.2026 Sınav Nöbeti karuseli (1080×1350). Kare 1 kapak [rozet, başlık, alt]; diğerleri [no, başlık, gövde, (kaynak)].
     Satırlar bas.js'ten (pazarlama/reklam/<dosya>.md "## Kare k"). -->
<style>
:root{--zemin:#0f1b2d;--zemin2:#16263e;--ink:#fbfaf8;--soluk:#b7c2d3;--cizgi:#2a3b57;--amber:#f5a524;--amber2:#ffc24b;--kirmizi:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--zemin);font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink)}
.kart{width:1080px;height:1350px;position:relative;overflow:hidden;padding:84px 88px 0;display:flex;flex-direction:column;
  background:radial-gradient(circle at 88% 8%,color-mix(in srgb,var(--amber) 14%,transparent),transparent 42%),var(--zemin)}
.sayfa{position:absolute;right:88px;top:92px;font-size:26px;font-weight:700;color:var(--soluk)}
.rozet{align-self:flex-start;font-size:27px;font-weight:800;letter-spacing:2.5px;color:var(--zemin);background:var(--amber);border-radius:14px;padding:10px 22px}
.kapak h1{font-size:118px;line-height:1.0;font-weight:800;letter-spacing:-3.5px;margin:auto 0 40px}
.kapak h1 em{font-style:normal;color:var(--kirmizi)}
.kapak .alt{font-size:46px;font-weight:700;color:var(--amber2);margin-bottom:auto}
.no{width:120px;height:120px;border-radius:50%;background:var(--amber);color:var(--zemin);font-size:68px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:30px}
.kural h2{font-size:100px;line-height:1.02;font-weight:800;letter-spacing:-3px;margin:60px 0 44px}
.kural p{font-size:44px;line-height:1.4;color:var(--soluk)}
.kural .kaynak{margin-top:auto;font-size:26px;line-height:1.45;background:var(--zemin2);border-radius:18px;padding:22px 26px;color:var(--soluk)}
.dip{padding:24px 0 40px;margin-top:40px;border-top:2px solid var(--cizgi);display:flex;justify-content:space-between;align-items:center}
.dip .et{font-size:24px;font-weight:700;color:var(--soluk);letter-spacing:1px}.dip .logo{height:54px}
.bos{margin-top:auto}
.kural .no{margin-top:auto}   /* içerik dikeyde ortalansın (alt yarı boş kalıyordu) */
.kural p{font-size:48px}
</style>
</head>
<body>
<section class="kart" id="kart"></section>
<script>
var LOGO='<svg class="logo" viewBox="30 0 290 110" aria-label="Tetikte"><defs><linearGradient id="aA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5a524"/><stop offset="1" stop-color="#ffc24b"/></linearGradient><radialGradient id="hA" cx="50%" cy="50%" r="50%"><stop offset="52%" stop-color="#f5a524" stop-opacity=".26"/><stop offset="100%" stop-color="#f5a524" stop-opacity="0"/></radialGradient></defs><circle cx="62" cy="60" r="34" fill="url(#hA)"/><circle cx="62" cy="60" r="19" fill="url(#aA)"/><text x="112" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1.4" textLength="181" lengthAdjust="spacingAndGlyphs" fill="#fbfaf8">tetıkte</text><circle cx="197" cy="30" r="7" fill="url(#aA)"/></svg>';
/* sayı ile sonraki kelime ayrı satıra düşmesin ("165 dakika", "13 Kasım", "7 kural") */
function e(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/(\d) (?=\p{L})/gu, '$1 '); }
function kur(k, n, S, ust){
  var K = document.getElementById('kart'); var no = '<div class="sayfa">' + k + '/' + n + '</div>';
  var dip = '<div class="dip"><span class="et">' + e(ust) + '</span>' + LOGO + '</div>';
  if (k === 1) {
    K.className = 'kart kapak';
    /* "hesap makinesi" kırmızı vurgulu */
    var bas = e(S[1]).replace(/(hesap makinesi)/i, '<em>$1</em>');
    K.innerHTML = '<div class="rozet">' + e(S[0]) + '</div>' + no + '<h1>' + bas + '</h1><div class="alt">' + e(S[2]) + '</div>' + dip;
  } else {
    K.className = 'kart kural';
    K.innerHTML = no + '<div class="no">' + e(S[0]) + '</div><h2>' + e(S[1]) + '</h2><p>' + e(S[2]) + '</p>'
      + (S[3] ? '<div class="kaynak">' + e(S[3]) + '</div>' : '<div class="bos"></div>') + dip;
  }
  return K.scrollHeight <= K.clientHeight + 1;
}
window.kur = kur;
</script>
</body>
</html>
