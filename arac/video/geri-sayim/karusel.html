<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Geri sayım karuseli</title>
<!-- 21.10.2026 "Geri Sayım · her akşam bir tuzak" Instagram karuseli, 5 kare 1080×1350. Satırlar bas.js'ten gelir
     (pazarlama/reklam/instagram-geri-sayim-tuzak-N.md "## Kare k" bölümleri); kur(k, satirlar) kareyi çizer. -->
<style>
:root{--zemin:#0f1b2d;--zemin2:#16263e;--ink:#fbfaf8;--soluk:#b7c2d3;--cizgi:#2a3b57;--amber:#f5a524;--amber2:#ffc24b;--kirmizi:#f87171;--yesil:#4ade80}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--zemin);font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink)}
.kart{width:1080px;height:1350px;position:relative;overflow:hidden;padding:80px 84px 0;display:flex;flex-direction:column;
  background:radial-gradient(circle at 88% 8%,color-mix(in srgb,var(--amber) 14%,transparent),transparent 42%),var(--zemin)}
.rozet{align-self:flex-start;font-size:28px;font-weight:800;letter-spacing:2.5px;color:var(--zemin);background:var(--amber);border-radius:14px;padding:10px 22px;margin-bottom:auto}
.ust{font-size:28px;font-weight:800;letter-spacing:2px;color:var(--soluk);text-transform:uppercase;margin-bottom:34px}
.sayfa{position:absolute;right:84px;top:88px;font-size:26px;font-weight:700;color:var(--soluk)}
/* 1 kapak */
.k1 .buyuk{font-size:150px;line-height:.98;font-weight:800;letter-spacing:-5px}
.k1 .buyuk em{font-style:normal;color:var(--amber2);display:block}
.k1 .orta{font-size:62px;font-weight:800;letter-spacing:-1.5px;margin:40px 0 18px}
.k1 .kucuk{font-size:40px;color:var(--yesil);font-weight:700;margin-bottom:auto}
/* 2 soru */
.k2 .soru{font-size:37px;line-height:1.38;margin-bottom:34px}
.k2 .siklar{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:auto}
.k2 .sik{background:var(--zemin2);border:3px solid var(--cizgi);border-radius:20px;padding:18px 26px;font-size:40px;font-weight:800}
.k2 .sik:last-child{grid-column:1 / span 2}
.cagri{font-size:38px;font-weight:800;color:var(--amber2);margin:30px 0 0}
/* 3 tuzaklar */
.k3 h2,.k4 h2{font-size:84px;line-height:1.02;font-weight:800;letter-spacing:-2.5px;margin-bottom:40px}
.k3 .tz{display:flex;gap:26px;align-items:flex-start;background:var(--zemin2);border-left:8px solid var(--kirmizi);border-radius:18px;padding:22px 28px;margin-bottom:20px}
.k3 .tz{padding:28px 30px;margin-bottom:24px}
.k3 .tz b{font-size:60px;color:var(--kirmizi);line-height:1;min-width:52px}
.k3 .tz p{font-size:35px;line-height:1.32}.k3 .tz p strong{display:block;font-size:40px;color:var(--ink);margin-bottom:6px}
.k3 .tz p span{color:var(--soluk)}
/* 4 doğrusu */
.k4 h2{color:var(--yesil)}
.k4 .adim{font-size:42px;line-height:1.35;padding:20px 0;border-bottom:2px solid var(--cizgi)}
.k4 .adim span{color:var(--soluk);display:block;font-size:30px;font-weight:700;letter-spacing:.5px}
.k4 .dayanak{margin-top:34px;font-size:31px;line-height:1.45;color:var(--soluk);background:var(--zemin2);border-radius:18px;padding:22px 26px;margin-bottom:auto}
/* 5 kapanış */
.k5{align-items:center;text-align:center;justify-content:center}
.k5 .yarin{font-size:96px;font-weight:800;letter-spacing:-2.5px;line-height:1.05;color:var(--amber2);margin-bottom:60px}
.k5 .soz{font-size:52px;font-weight:800;line-height:1.2;max-width:820px;margin-bottom:60px}
.k5 .adres{font-size:44px;font-weight:800;color:var(--amber2)}
.k5 .logo{height:96px;margin-bottom:50px}
.dip{padding:24px 0 40px;margin-top:30px;border-top:2px solid var(--cizgi);display:flex;justify-content:space-between;align-items:center}
.dip .et{font-size:22px;color:var(--soluk)}.dip .logo{height:54px}
.k5 .dip{position:absolute;left:84px;right:84px;bottom:0}
</style>
</head>
<body>
<section class="kart" id="kart"></section>
<script>
var LOGO='<svg class="logo" viewBox="30 0 290 110" aria-label="Tetikte"><defs><linearGradient id="aA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5a524"/><stop offset="1" stop-color="#ffc24b"/></linearGradient><radialGradient id="hA" cx="50%" cy="50%" r="50%"><stop offset="52%" stop-color="#f5a524" stop-opacity=".26"/><stop offset="100%" stop-color="#f5a524" stop-opacity="0"/></radialGradient></defs><circle cx="62" cy="60" r="34" fill="url(#hA)"/><circle cx="62" cy="60" r="19" fill="url(#aA)"/><text x="112" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1.4" textLength="181" lengthAdjust="spacingAndGlyphs" fill="#fbfaf8">tetıkte</text><circle cx="197" cy="30" r="7" fill="url(#aA)"/></svg>';
function e(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function kur(k, S, rozet){
  var K = document.getElementById('kart'); K.className = 'kart k' + k; var h = '';
  var dip = '<div class="dip"><span class="et">Reklam · tetikte.com</span>' + LOGO + '</div>';
  var no = '<div class="sayfa">' + k + '/5</div>';
  if (k === 1) {
    var p = S[1].split(' '); var son = p.splice(-2).join(' ');   /* "31 gün." alt satırda, kehribar */
    h = '<div class="rozet">' + e(S[0]) + '</div>' + no + '<div class="buyuk">' + e(p.join(' ')) + '<em>' + e(son) + '</em></div>'
      + '<div class="orta">' + e(S[2]) + '</div><div class="kucuk">' + e(S[3]) + '</div>' + dip;
  } else if (k === 2) {
    h = '<div class="ust">' + e(rozet) + ' · ' + e(S[0]) + '</div>' + no + '<p class="soru">' + e(S[1]) + '</p><div class="siklar">'
      + S.slice(2, 7).map(function(s){ return '<div class="sik">' + e(s) + '</div>'; }).join('') + '</div><p class="cagri">' + e(S[7]) + '</p>' + dip;
  } else if (k === 3) {
    h = '<div class="ust">' + e(rozet) + '</div>' + no + '<h2>' + e(S[0]) + '</h2>' + S.slice(1).map(function(s){
      var m = /^([A-E]) · ([^:]+): (.+)$/.exec(s); return '<div class="tz"><b>' + m[1] + '</b><p><strong>' + e(m[2]) + '</strong><span>' + e(m[3]) + '</span></p></div>'; }).join('') + '<div style="margin-bottom:auto"></div>' + dip;
  } else if (k === 4) {
    h = '<div class="ust">' + e(rozet) + '</div>' + no + '<h2>' + e(S[0]) + '</h2>' + S.slice(1, -1).map(function(s){
      var i = s.indexOf(': '); return '<div class="adim"><span>' + e(s.slice(0, i)) + '</span>' + e(s.slice(i + 2)) + '</div>'; }).join('')
      + '<div class="dayanak">' + e(S[S.length - 1]) + '</div>' + dip;
  } else {
    h = no + LOGO + '<div class="yarin">' + e(S[0]).replace(/ · /, '<br>').replace(/(Tuzak) (\d+)/, '$1&nbsp;$2') + '</div><div class="soz">' + e(S[1]) + '</div><div class="adres">' + e(S[2]) + '</div>' + dip;
  }
  K.innerHTML = h;
  return K.scrollHeight <= K.clientHeight + 1;
}
window.kur = kur;
</script>
</body>
</html>
