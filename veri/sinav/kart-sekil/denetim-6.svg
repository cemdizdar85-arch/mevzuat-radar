<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 295" width="760" height="295" role="img" aria-label="Hangi görüş?" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><text x="20" y="32" font-size="18" font-weight="700"  fill="currentColor">Hangi görüş?</text><rect x="23" y="54" width="244" height="41" rx="10" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="34" y="78" font-size="13" font-weight="700"  fill="currentColor">Neden</text><rect x="273" y="54" width="229" height="41" rx="10" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="284" y="78" font-size="13" font-weight="700"  fill="currentColor">Etki önemli, yaygın değil</text><rect x="508" y="54" width="229" height="41" rx="10" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="519" y="78" font-size="13" font-weight="700"  fill="currentColor">Etki önemli ve yaygın</text><rect x="23" y="101" width="244" height="60" rx="10" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="34" y="125" font-size="13"   fill="currentColor">Yanlışlık tespit edildi (kanıt</text><text x="34" y="144" font-size="13"   fill="currentColor">elde edildi)</text><rect x="273" y="101" width="229" height="60" rx="10" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/><text x="387.5" y="137" font-size="16" font-weight="700" text-anchor="middle" fill="currentColor">Sınırlı olumlu</text><rect x="508" y="101" width="229" height="60" rx="10" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/><text x="622.5" y="137" font-size="16" font-weight="700" text-anchor="middle" fill="currentColor">Olumsuz</text><rect x="23" y="167" width="244" height="60" rx="10" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="34" y="191" font-size="13"   fill="currentColor">Yeterli ve uygun kanıt elde</text><text x="34" y="210" font-size="13"   fill="currentColor">edilemedi (muhtemel etki)</text><rect x="273" y="167" width="229" height="60" rx="10" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/><text x="387.5" y="203" font-size="16" font-weight="700" text-anchor="middle" fill="currentColor">Sınırlı olumlu</text><rect x="508" y="167" width="229" height="60" rx="10" fill="currentColor" fill-opacity="0.02" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/><text x="622.5" y="203" font-size="16" font-weight="700" text-anchor="middle" fill="currentColor">Görüş vermekten kaçınma</text><text x="20" y="249" font-size="12.5"   fill="currentColor" fill-opacity="0.72">Önemli bir yanlışlık yoksa ve kanıt yeterliyse: olumlu görüş. İki satırın sınırlı olumlu görüşü aynı</text><text x="20" y="268" font-size="12.5"   fill="currentColor" fill-opacity="0.72">adı taşır ama gerekçesi farklıdır: biri tespit edilmiş yanlışlık, öbürü kanıt eksikliği.</text></svg>
