<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 495" width="760" height="495" role="img" aria-label="60 gün, iki ayrı 10 gün; fesih ile görevin geri alınması ayrı" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><text x="20" y="32" font-size="18" font-weight="700"  fill="currentColor">60 gün, iki ayrı 10 gün; fesih ile görevin geri alınması ayrı</text><text x="20" y="70" font-size="13" font-weight="700"  fill="currentColor">A · SÖZLEŞME YAPMA</text><rect x="34" y="82" width="278" height="37" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="46" y="104" font-size="14"   fill="currentColor">Denetçi seçilir</text><line x1="318" y1="100.5" x2="345" y2="100.5" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6"/><path d="M344,95.5 L352,100.5 L344,105.5 Z" fill="currentColor" fill-opacity="0.6"/><rect x="356" y="82" width="384" height="37" rx="10" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/><text x="368" y="104" font-size="14" font-weight="700"  fill="currentColor">en geç 60 gün: yazılı sözleşme</text><rect x="34" y="127" width="278" height="56" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="46" y="149" font-size="14"   fill="currentColor">İşletme, denetimi üstlenenin yazılı</text><text x="46" y="168" font-size="14"   fill="currentColor">ihtarına rağmen kaçınır</text><line x1="318" y1="155" x2="345" y2="155" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6"/><path d="M344,150 L352,155 L344,160 Z" fill="currentColor" fill-opacity="0.6"/><rect x="356" y="127" width="384" height="56" rx="10" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/><text x="368" y="149" font-size="14" font-weight="700"  fill="currentColor">durumu izleyen 10 gün: Kuruma bildirim</text><text x="20" y="215" font-size="13" font-weight="700"  fill="currentColor">B · DENETÇİNİN SÖZLEŞMEYİ FESHETMESİ</text><rect x="34" y="227" width="278" height="56" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="46" y="249" font-size="14"   fill="currentColor">Haklı sebep YA DA denetçiye karşı</text><text x="46" y="268" font-size="14"   fill="currentColor">görevden alınma davası</text><line x1="318" y1="255" x2="345" y2="255" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6"/><path d="M344,250 L352,255 L344,260 Z" fill="currentColor" fill-opacity="0.6"/><rect x="356" y="227" width="384" height="56" rx="10" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-opacity="0.35" stroke-width="2"/><text x="368" y="249" font-size="14" font-weight="700"  fill="currentColor">fesih</text><line x1="24" y1="309.5" x2="45" y2="309.5" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6"/><path d="M44,304.5 L52,309.5 L44,314.5 Z" fill="currentColor" fill-opacity="0.6"/><rect x="54" y="291" width="686" height="37" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="66" y="313" font-size="14"   fill="currentColor">10 gün içinde: fesih ve gerekçeleri yazılı olarak Kuruma bildirilir</text><line x1="24" y1="364" x2="45" y2="364" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.6"/><path d="M44,359 L52,364 L44,369 Z" fill="currentColor" fill-opacity="0.6"/><rect x="54" y="336" width="686" height="56" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="66" y="358" font-size="14"   fill="currentColor">çalışma notları ve gerekli tüm bilgiler, yerine geçecek denetim kuruluşuna ya da denetim</text><text x="66" y="377" font-size="14"   fill="currentColor">üstlenen bağımsız denetçiye teslim edilir</text><text x="20" y="424" font-size="13" font-weight="700"  fill="currentColor">C · DENETLEME GÖREVİNİN DENETİMİ ÜSTLENENDEN GERİ ALINMASI (fesihten ayrı bir işlem)</text><rect x="34" y="436" width="706" height="37" rx="10" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="46" y="458" font-size="14"   fill="currentColor">Yalnız TTK m.399/4'te öngörüldüğü şekilde VE başka bir denetçi atanmışsa</text></svg>
