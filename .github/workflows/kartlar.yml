# Bu dosyanin GitHub'daki yolu: .github/workflows/kartlar.yml
# HAP KART MOTORU: her sabah gunun RG tebliglerini indirir, cift-okuma + hakem
# sistemiyle hap kartlari uretir, kartlar.html + arsivi yayinlar.
# GEREKSINIM: repo Settings -> Secrets and variables -> Actions -> ANTHROPIC_API_KEY
# (secret yoksa is zarifce atlanir, hata vermez).
name: Hap Kartlar

on:
  # 30.07 — ELLE TETIK YOLU. Bu dosyada push tetigi HIC yoktu; zamanlayici
  # gelmeyince (yeni eklenen cron'lar ilk gun ateslenmeyebiliyor - GitHub'in
  # bilinen gecikmesi; bugun 03:00 UTC tetigi gelmedi, kart nobeti 26.07'de
  # kaldi) robotu ateslemenin HICBIR yolu kalmiyordu. Artik bu dosyaya
  # dokunan push kosuyu baslatir.
  # NOT: bugun API tavani dolu (429) - kosu teblig bulursa kirmizi bitebilir;
  # bu BEKLENEN ve zararsizdir, telafi adimi 1 Agustos'ta acigi kapatir.
  push:
    paths:
      - '.github/workflows/kartlar.yml'
  # ===================================================================
  #  BU ZAMANLAYICI KAPATILMAZ.  (Cem, 29.07.2026: "hicbir zaman
  #  kapanmasin bu")
  #
  #  27.07'de tasarruf icin KAPATILMISTI ve sonucu takip edilmedi:
  #  robot 26.07'den beri kosmadi, vitrinde 11.07 tarihli kart kaldi.
  #  "Isinin nobetcisi" diyen bir markanin nobeti duraklatilmis olamaz -
  #  urunun kendisi bu.
  #
  #  Butce sikisirsa BASKA kalem kisilir; bu kosu kisilmaz. Gunun RG'sinde
  #  ilgili teblig yoksa zaten API'ye gitmeden cikiyor (asagidaki kontrol),
  #  yani sakin gunlerde maliyeti sifirdir.
  # ===================================================================
  schedule:
    # 29.07 Cem: "RG gece yayinlaniyor, 8 gec bence daha erkene alalim".
    # 03:00 UTC = 06:00 Turkiye. RG gece yarisi civari yayimlandigi icin sabah
    # altida icerik hazir; musavir masaya oturdugunda kart onunde olur.
    - cron: "7 0 * * *"      # 03:07 TR - ana nobet (Cem 31.07: sabah 5te hepsi bitmis olacak)
    # IKINCI NOBET: mukerrer sayilar gun icinde de cikabiliyor. Sabahki kosu
    # onlari goremez. 12:00 UTC = 15:00 Turkiye'de bir kez daha bakilir.
    # Maliyeti yok denecek kadar az: o gun yeni teblig yoksa API'ye hic gitmez.
    - cron: "7 12 * * *"     # 15:00 Turkiye - mukerrer nobeti
    # 02.08 YEDEK NOBETLER (Cem: "bugun 02.08 ama siteye giren 01.08 gorecek").
    # GitHub'in zamanlayicisi yogun saatlerde kosuyu ATLAYABILIYOR (01.08'de
    # 03:07 kosusu hic ateslenmedi, ana sayfa gun boyu bir gun geride gorundu).
    # Ucu de idempotent: o gun kart uretilmisse ikinci kosu API'ye hic gitmez,
    # yani yedek nobetin maliyeti sifirdir. Kor kalmaktansa bos kosmak yeg.
    - cron: "20 3 * * *"     # 06:20 TR - 1. yedek
    - cron: "20 6 * * *"     # 09:20 TR - 2. yedek (musavir masaya oturdugunda kart hazir)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kart:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Gunun tarihi (TR)
        id: g
        run: echo "gun=$(TZ=Europe/Istanbul date +%d-%m-%Y)" >> "$GITHUB_OUTPUT"

      # ================= TELAFI (kacirilan gunler) =========================
      # Cem, 29.07: "eskiden gormedigi gun varsa onu ekleyelim".
      # Robot 27.07'de kapatildi, 26.07'den beri kosmadi ve o gunler bir daha
      # hic taranmadi - kapali gecen her gun kalici bir bosluk birakiyordu.
      # Artik her kosu, GERIYE DONUK 7 GUNE bakip arsivi olmayan gunu de
      # indiriyor. Robot bir sure durursa, ilk kosuda bosluk kendiliginden
      # kapanir; kimsenin elle telafi etmesi gerekmez.
      # En fazla 5 gun telafi edilir - bir aylik bosluk tek kosuda kapanmaya
      # calisirsa hem uzun surer hem maliyeti one yigar.
      - name: Telafi - taranmamis gunleri indir
        shell: pwsh
        run: |
          $telafi = 0
          foreach($i in 1..7){
            if($telafi -ge 5){ Write-Host "Telafi siniri (5 gun) doldu - kalani yarinki kosu tamamlar."; break }
            $g = (Get-Date).AddDays(-$i).ToString('dd-MM-yyyy')
            if(Test-Path "motor/arsiv/$g"){ continue }
            Write-Host "TELAFI: $g taranmamis, indiriliyor."
            try { ./motor/rg-indir.ps1 -Gun $g; $telafi++ } catch { Write-Host ("  $g indirilemedi: {0}" -f $_.Exception.Message) }
          }
          Write-Host "Telafi edilen gun: $telafi"

      # BUGUN HER KOSUDA YENIDEN INDIRILIR. Arsiv klasoru var diye atlanirsa
      # ogleden sonra cikan MUKERRER sayilar sonsuza kadar kacar - telafi
      # dongusu "klasor var" deyip gecer. Bugun icin klasor varligi yeterli
      # olcut degildir.
      - name: Gunun tebliglerini indir
        shell: pwsh
        run: ./motor/rg-indir.ps1 -Gun ${{ steps.g.outputs.gun }}

      - name: Hap kartlari uret (cift okuma + hakem)
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AWS_API_KEY: ${{ secrets.ANTHROPIC_AWS_API_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ANTHROPIC_AWS_WORKSPACE_ID: ${{ secrets.ANTHROPIC_AWS_WORKSPACE_ID }}
        run: |
          if (-not $env:ANTHROPIC_API_KEY) { Write-Host "ANTHROPIC_API_KEY secret'i yok - kart uretimi atlandi. (Repo Settings -> Secrets -> Actions -> New repository secret)"; exit 0 }
          $gun = "${{ steps.g.outputs.gun }}"
          $klasor = "motor/arsiv/$gun"
          # TELAFI EDILEN GUNLER DE ISLENIR: yalniz bugunu islemek, kapali gecen
          # gunlerin tebliglerini indirip rafta birakmak olurdu.
          # ARSIVDE DURUP ISLENMEMIS HER GUN. Son 7 gunle sinirlamak yetmiyordu:
          # 01, 03 ve 04 Temmuz'un teblIgleri indirilmis ama kart HIC uretilmemis
          # (13 teblig rafta kalmis). Indirme yapilip urune donusmemis is,
          # yapilmamis istir. Artik butun arsiv taraniyor.
          # Kosu basina EN FAZLA 5 gun: birikmis bosluk tek kosuda kapanmaya
          # calisirsa maliyeti one yigar. Kalani ertesi gun kapanir.
          # MUKERRER TUZAGI: "kart klasoru var" olcutu bugun icin yanlis. Ogleden
          # sonra yeni teblig cikarsa klasor zaten vardir ve gun bir daha hic
          # islenmez. Bu yuzden BUGUN her zaman aday; gecmis gunler yalnizca
          # karti yoksa aday.
          $bugun = (Get-Date).ToString('dd-MM-yyyy')
          $adaylar = @(Get-ChildItem "motor/arsiv" -Directory -ErrorAction SilentlyContinue |
            Where-Object {
              (Get-ChildItem $_.FullName -Filter *.htm -ErrorAction SilentlyContinue) -and
              ($_.Name -eq $bugun -or -not (Test-Path ("motor/kartlar/" + $_.Name)))
            } |
            Sort-Object { try { [datetime]::ParseExact($_.Name,'dd-MM-yyyy',$null) } catch { [datetime]'1900-01-01' } } -Descending)
          $islenecek = New-Object System.Collections.Generic.List[string]
          foreach($a in $adaylar){ if($islenecek.Count -ge 5){ break }; $islenecek.Add($a.Name) }
          if($adaylar.Count -gt $islenecek.Count){
            Write-Host ("Bekleyen gun: {0} - bu kosuda {1} tanesi islenecek, kalani yarin." -f $adaylar.Count, $islenecek.Count)
          }
          if($islenecek.Count -eq 0){ Write-Host "Islenecek gun yok - ilgilendiren teblig cikmamis. Kart uretilmedi."; exit 0 }
          Write-Host ("Islenecek gun: " + ($islenecek -join ', '))
          foreach($g in $islenecek){ ./motor/kart-toplu.ps1 -Gun $g }

      # 16.08 KOR-KALMA NOBETCISI: kart-toplu 0 kart uretip API/uretim dustuyse
      # (veri/kart-uretim-durum.json sonuc='api-hatasi'), robot "RG sakin" diye
      # YALAN soylemesin -- adim KIRMIZI biter + Cem'e mail. Boylece 11 gun
      # sessizce bos kalmaz (14.08: 2 ilgili teblig vardi, "sakin" denmisti).
      - name: Kor-kalma nobetcisi (0 kart = sakin mi, uretim dususu mu)
        if: always()
        shell: pwsh
        run: |
          $y = "veri/kart-uretim-durum.json"
          if (-not (Test-Path $y)) { Write-Host "Durum dosyasi yok (kart uretimi hic kosmadi ya da atlandi) - gecildi."; exit 0 }
          $d = Get-Content $y -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host ("Kart uretim durumu: {0} - gun {1}, kart {2}, hata {3}" -f $d.sonuc, $d.gun, $d.uretilenKart, $d.hataliCagri)
          if ("$($d.sonuc)" -eq 'api-hatasi') {
            Write-Host "::error::KOR KALMA - kart uretimi API/uretim hatasiyla dustu ($($d.hataliCagri) hata, 0 kart). 'RG sakin' DEGIL. Muhtemel API tavani/AWS anahtari."
            $p = @{ access_key='5b227e56-94fb-4123-a39a-4286f63db14a'; subject='TETIKTE - Hap kart URETILEMEDI (kor kalma, uretim dustu)'; from_name='Tetikte Nobetci'; email='cemdizdar85@hotmail.com'; message="Gun $($d.gun): islenen madde vardi ama $($d.hataliCagri) API/uretim hatasi, 0 kart. 'RG sakin' degil. Muhtemel API tavani ya da AWS anahtari eksik. Kosu: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" } | ConvertTo-Json
            try { Invoke-RestMethod -Uri 'https://api.web3forms.com/submit' -Method Post -ContentType 'application/json' -Body $p | Out-Null } catch { Write-Host "mail gitmedi: $($_.Exception.Message)" }
            exit 1
          }
          Write-Host "Kor-kalma nobetcisi: temiz (0 kart varsa gercekten sakin RG gunu)."

      - name: Yapisal denetci (kart yayini oncesi guvenlik)
        shell: pwsh
        run: ./arac/yapisal-denetci.ps1

      # NOBET DAMGASI: kart ciksin cikmasin her kosuda bugunun tarihi yazilir;
      # kartlar.html bu dosyayi okuyup "son tarama: X" rozetini gosterir.
      # Boylece RG sakin gunlerde site "olu" degil "nobette" gorunur.
      - name: Nobet damgasi (son tarama tarihi)
        run: |
          mkdir -p veri
          echo "{\"sonTarama\":\"$(TZ=Europe/Istanbul date +%d.%m.%Y)\"}" > veri/kart-durum.json

      # ARAC NOBETCISI (29.07). Sayfalar kanun MADDESINE yaslanir ve
      # dayanak-nobetci onlari koruyor. Ama arac VERISI teblig ve
      # Cumhurbaskani kararlarina yaslaniyor; madde damgasi onlari GORMUYOR.
      # Daha kotusu: bu dosyalarin hicbiri otomatik beslenmemis - hepsi bir
      # kere indirilmis yerel Excel'lerden uretilmis. Yani Ithalat Rejimi
      # Karari degistiginde GTIP verimiz SESSIZCE eskiyordu.
      # Hash nobeti kurulamiyor (izlenecek sabit adres yok), bu yuzden RG
      # TETIGI: kart robotu zaten RG'yi tariyor, basliklarda anahtar gecerse
      # ilgili dosya "eskimis olabilir" diye isaretlenir.
      # Rapor URETILIR ama burada kirmizi verilmez - once kartlar yayinlansin.
      - name: Arac nobetcisi (RG'de ilgili yayin var mi)
        continue-on-error: true
        shell: pwsh
        run: ./motor/arac-nobetci.ps1

      - name: Degisiklik varsa yayinla
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          # 29.07 IKI KUSUR DUZELTILDI.
          # (1) veri/kartlar-guncel.json BU LISTEDE YOKTU. Sitenin okudugu dosya
          #     bu; robot kart uretse bile commit edilmiyordu, o yuzden vitrinde
          #     11.07 tarihli kart kalmisti. Listeye yazilmayan dosya sessizce
          #     kaybolur - bu hata bu gece ucuncu kez cikti.
          # (2) COMMIT MESAJI HER GUN "kartlar uretildi" DIYORDU, hicbir kart
          #     uretilmedigi gunlerde bile. Robot kendi sonucunu dogrulamadan
          #     zafer ilan ediyordu. Artik mesaj SAYIYOR: kac kart var, kart
          #     dosyasi degisti mi.
          for f in kartlar.html arsiv/ motor/kartlar/ motor/hafiza/ motor/arsiv/ \
                   veri/kart-durum.json veri/kartlar-guncel.json \
                   veri/arac-uyari.json veri/arac-nobet-log.txt; do
            git add "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "Degisiklik yok - commit atilmadi."
            exit 0
          fi
          BUGUN=$(TZ=Europe/Istanbul date +%d.%m.%Y)
          if git diff --cached --name-only | grep -q "veri/kartlar-guncel.json"; then
            ADET=$(grep -o '"baslik"' veri/kartlar-guncel.json 2>/dev/null | wc -l | tr -d ' ')
            MESAJ="Hap kartlar: $BUGUN - $ADET kart uretildi"
          else
            MESAJ="Hap kartlar: $BUGUN - kart uretilmedi (RG sakin / ilgili teblig yok), nobet damgasi guncellendi"
          fi
          git commit -m "$MESAJ"
          git pull --rebase || true
          git push
      # KIRMIZI KAPI (29.07). Kartlar yayinlandiktan SONRA calisir: vitrin
      # her halukarda guncellenir, ama eskiyen arac verisi varsa kosu KIRMIZI
      # biter ve GM gorur. Bu depoda dort katman "kuruldu ama kimse gormedi"
      # diye bekledi - sessiz rapor okunmuyor.
      - name: KAPI — eskimis arac verisi var mi
        if: always()
        shell: pwsh
        run: |
          $y = 'veri/arac-uyari.json'
          if(-not (Test-Path $y)){ Write-Host "Uyari dosyasi yok (kart uretilmemis olabilir). Gecildi."; exit 0 }
          $u = Get-Content $y -Raw -Encoding UTF8 | ConvertFrom-Json
          if([int]$u.etkilenen_dosya -eq 0){ Write-Host "TEMIZ: bugunku RG'de arac verisini ilgilendiren yayin yok."; exit 0 }
          Write-Host ("KIRMIZI: {0} arac verisi ESKIMIS OLABILIR (RG gunu {1})" -f $u.etkilenen_dosya, $u.rg_gun)
          foreach($x in $u.uyarilar){
            Write-Host ("  {0}  <- {1}" -f $x.dosya, $x.kaynak_ad)
            Write-Host ("      hasat: {0}   eslesen yayin: {1}" -f $x.hasat, $x.eslesme_sayisi)
          }
          Write-Host ""
          Write-Host "Bu dosyalar OTOMATIK BESLENMIYOR - kaynagin guncel hali indirilip"
          Write-Host "hasat betigi yeniden kosulmali. Ayrinti: veri/arac-uyari.json"
          Write-Host "NOT: bu bir TRIPWIRE'dir - yanlis alarm verebilir, GM okuyup karar verir."
          exit 1
