# THP listesi maliyet olcumu — 0 USD, API yok, yazma yok.
# Cem: "ucuzlatma yolu: THP listesini yalniz hesap kodu gereken sorulara koymak
# - olculmedi." Bu is o olcumu yapar; karar Cem'in.
name: THP Liste Maliyet Olcumu (0 USD)
on:
  push:
    paths: ['motor/thp-liste-maliyet-olcum.ps1', '.github/workflows/thp-liste-maliyet-olcum.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thp-liste-maliyet-olcum
  cancel-in-progress: false
jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/thp-liste-maliyet-olcum.ps1
      - name: Commit (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/thp-liste-maliyet-raporu.json ]; then echo "!! RAPOR YOK"; exit 1; fi
          git add veri/thp-liste-maliyet-raporu.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "THP liste maliyet olcumu [veri-operasyonu]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 7; done
          echo "!! PUSH TUTMADI"; exit 1
