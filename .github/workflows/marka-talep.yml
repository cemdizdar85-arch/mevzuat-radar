# ============================================================================
#  MARKA TALEP KUYRUGU (20.08.2026)
#  tetikte.com/marka-portfoy.html'de "Firmanin markalarini getir" diyen ziyaretci
#  Supabase'e bir talep birakir (RPC marka_talep_ac). TMview CORS'a kapali oldugu
#  icin sorguyu tarayici yapamaz -> bu is akisi kuyrugu isler, sonucu yazar,
#  e-posta birakildiysa raporu yollar. Sayfa jetonla sonucu okur.
#  Sik kosar (5 dk) ama isi yoksa saniyeler surer: bekleyen talep yoksa cikar.
# ============================================================================
name: Marka talep kuyrugu

on:
  schedule:
    # 29.08 OLCULDU: burada '*/5' yaziyor ama GERCEK arasi 2-7 SAAT.
    # GitHub zamanlanmis isleri yogunlukta kisiyor (bu depoda 124 workflow var).
    # Sayfa ise kullaniciya "genelde yarim saat" diyordu - YANLIS SOZ idi.
    # Cron BIRAKILDI (sessiz gunlerde taban), ama asil tetik artik push.
    - cron: '*/5 * * * *'
  # PUSH TETIGI (29.08, Cem: "arcelik yazdim birsey gelmedi, anlamadim"):
  # Bu depoya gunde onlarca push oluyor (botlar rapor isliyor - son 24 saatte
  # 53 yayin kosusu). Kuyruk her push'ta bosaltilinca bekleme SAATLERDEN
  # DAKIKALARA iner.
  # DONGU RISKI YOK: bu is akisi depoya commit ATMIYOR, sonucu Supabase'e
  # yaziyor - yani kendi kendini tetikleyemez.
  # MALIYET 0: depo PUBLIC, Actions ucretsiz; bos kuyrukta is hemen biter.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mod:
        description: 'talep = bekleyen sorgular · rakip = rakip nobeti taramasi'
        required: false
        default: 'talep'
        type: choice
        options: [talep, rakip]

concurrency:
  group: marka-talep
  cancel-in-progress: false

jobs:
  kuyruk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bekleyen talepleri isle (TMview -> Supabase)
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          if ('${{ github.event.inputs.mod }}' -eq 'rakip') {
            ./motor/marka-portfoy-hasat.ps1 -Rakip
          } else {
            ./motor/marka-portfoy-hasat.ps1 -YalnizTalep -TalepAdet 40
          }
