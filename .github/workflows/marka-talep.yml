# ============================================================================
#  MARKA TALEP KUYRUGU (20.08.2026)
#  tetikte.com/marka-portfoy.html'de "Firmanin markalarini getir" diyen ziyaretci
#  Supabase'e bir talep birakir (RPC marka_talep_ac). TMview CORS'a kapali oldugu
#  icin sorguyu tarayici yapamaz -> bu is akisi kuyrugu isler, sonucu yazar,
#  e-posta birakildiysa raporu yollar. Sayfa jetonla sonucu okur.
#  Sik kosar (5 dk) ama isi yoksa saniyeler surer: bekleyen talep yoksa cikar.
# ============================================================================
name: Marka talep kuyrugu

on:
  schedule:
    # 29.08 OLCULDU: burada '*/5' yaziyor ama GERCEK arasi 2-7 SAAT.
    # GitHub zamanlanmis isleri yogunlukta kisiyor (bu depoda 124 workflow var).
    # Sayfa ise kullaniciya "genelde yarim saat" diyordu - YANLIS SOZ idi.
    # Cron BIRAKILDI (sessiz gunlerde taban), ama asil tetik artik push.
    - cron: '*/5 * * * *'
  # PUSH TETIGI (29.08, Cem: "arcelik yazdim birsey gelmedi, anlamadim"):
  #
  # 🔴 30.08 OLCUM DUZELTMESI - ASAGIDAKI "gunde onlarca push" GEREKCESI EKSIK:
  # GitHub, Actions'in KENDI bot'unun (GITHUB_TOKEN ile) attigi push'lardan
  # YENI IS AKISI TETIKLEMEZ (sonsuz dongu korumasi). Bu depodaki push'larin
  # neredeyse tamami bot'un rapor commit'leri -> ONLAR TETIKLEMIYOR.
  # OLCULDU: kosular 00:17/00:18/00:19 (hepsi INSAN push'i), ardindan gelen
  # 00:21/00:23/00:24 BOT push'lari hicbir kosu baslatmadi.
  # Yani push tetigi yalniz insan/PAT push'inda calisir; sessiz gunlerde
  # bekleme yine cron'a (2-7 saat) duser.
  # GERCEK COZUM: Supabase Database Webhook -> repository_dispatch (Cem'in
  # panelinden). Bu satir o kurulana kadar KISMI bir iyilestirmedir.
  # Bu depoya gunde onlarca push oluyor (botlar rapor isliyor - son 24 saatte
  # 53 yayin kosusu). Kuyruk her push'ta bosaltilinca bekleme SAATLERDEN
  # DAKIKALARA iner.
  # DONGU RISKI YOK: bu is akisi depoya commit ATMIYOR, sonucu Supabase'e
  # yaziyor - yani kendi kendini tetikleyemez.
  # MALIYET 0: depo PUBLIC, Actions ucretsiz; bos kuyrukta is hemen biter.
  #
  # 🔴 30.08: PUSH TETIGI KALDIRILDI. Iki olculmus zarari vardi, faydasi yoktu:
  #   1) Bot push'lari zaten tetiklemiyordu (yukarida olculdu) -> fayda YOK.
  #   2) Kod uzerinde calisirken ard arda insan push'i attigimda her push yeni
  #      kosu acti; concurrency 'cancel-in-progress: false' oldugu icin bekleyen
  #      kosular BIRBIRINI IPTAL ETTI. Olculdu: 00:46, 00:54, 01:12, 01:17,
  #      01:18 kosularinin BESI DE 'cancelled' - kuyruk hic islenmedi, EGE
  #      SERAMIK talebi saatlerce 'bekliyor' kaldi.
  #   3) Ayrica kod duzenlerken kaynaga (TMview) bosuna istek attirdi; 30.08'de
  #      TMview bizi bot korumasina aldi.
  # ASIL TETIK asagidaki repository_dispatch (Supabase webhook).
  # ASIL TETIK (30.08): Supabase'te bir marka talebi ACILIR ACILMAZ bu is akisi
  # disaridan cagrilir -> kuyrukta bekleme SANIYELERE iner. Cron kisitlanabiliyor,
  # bot push'lari tetiklemiyor; guvenilir tek yol bu.
  # Kuran SQL: veri/sql-marka-talep-webhook.sql (marka_talep INSERT tetigi -> pg_net
  # -> GitHub repository_dispatch). Cem'in yapmasi gereken tek sey token uretmek.
  repository_dispatch:
    types: [marka-talep]
  workflow_dispatch:
    inputs:
      mod:
        description: 'talep = bekleyen sorgular · rakip = rakip nobeti taramasi'
        required: false
        default: 'talep'
        type: choice
        options: [talep, rakip]

concurrency:
  group: marka-talep
  cancel-in-progress: false

jobs:
  kuyruk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bekleyen talepleri isle (TMview -> Supabase)
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          if ('${{ github.event.inputs.mod }}' -eq 'rakip') {
            ./motor/marka-portfoy-hasat.ps1 -Rakip
          } else {
            ./motor/marka-portfoy-hasat.ps1 -YalnizTalep -TalepAdet 40
          }
