# ============================================================================
#  ALACAK ILANI OKUMA PILOTU - ELLE TETIKLENIR (29.08.2026)
#
#  NEDEN AYRI DOSYA: bu bir NOBET DEGIL, bir DENEYDIR. Gunluk akisa (kaynak.yml)
#  girmemeli - her koşuda para/kota harcar ve sonucu ELLE degerlendirilir.
#  Actions > "Alacak ilani okuma pilotu" > Run workflow ile calisir.
#
#  ANAHTAR SORUNU: pilot SUPABASE_SERVICE_KEY + GEMINI_API_KEY ister. Ikisi de
#  depo secret'inda VAR ama yerel makinede yok. Bu akis sayesinde Cem tek dugmeye
#  basar, anahtar hic disari cikmaz.
#
#  MALIYET (29.08 olcumu): 4 kovada 746 metinli ilan · 916 bin karakter
#  (~305 bin token girdi). Gemini bedava kotasiyla 0 TL; kota biterse Haiku'ya
#  duser, o da 1 dolardan az. Betik once Gemini dener (bkz api-tavan-engeli).
#
#  CIKTI: veri/alacak-okuma-pilot.json + koşu kutugunde kova bazli uyum tablosu
#  ve ilk 10 uyusmazlik (alintilariyla). Sonuc ARTEFAKT olarak da yuklenir.
#  Rapor depoya COMMIT EDILMEZ - deney ciktisi, veri degil.
# ============================================================================
name: Alacak ilani okuma pilotu

# 29.08 KUSUR: supheli listesi commit'lendi ama PUSH 403 verdi
# ("Permission to ... denied to github-actions[bot]"). Depodaki commit eden
# akislarin hepsinde bu blok var; buraya konmamisti. Liste uretildi ama
# kayboldu - tam da onlemek istedigim sey.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      hepsi:
        description: '4 kovanin TAMAMINI oku (746 ilan). Hayir dersen ADET kadar ornek alinir.'
        type: boolean
        default: false
      hakem:
        description: 'HAKEM TURU: okuma ile regex ayrisan ilanlari IKINCI KEZ okut, hangisi hakli karar ver'
        type: boolean
        default: false
      hakem_yaz:
        description: 'HAKEM KARARINI DAMGAYA YAZ (hakem acikken; belirsiz hedefliler atlanir)'
        type: boolean
        default: false
      tum:
        description: 'TUM ARSIV: 14 karar durumunun TAMAMINI oku (~5.900 ilan, ~4 saat, ~6 dolar)'
        type: boolean
        default: false
      kovalar:
        description: 'Yalniz belirli kovalar (virgullu, or: kesin_muhlet,gecici_muhlet). Bos = varsayilan 6 kova'
        default: ''
      ilanlar:
        description: 'HEDEFLI: yalniz bu ilan_no lari oku (virgullu, or: ILN02289717,ILN02350965). Doluysa kova secimi ATLANIR.'
        default: ''
      onbellek:
        description: 'Onbellegi kullan (ayni ilani iki kez okuma). Kapatirsan her ilan yeniden okunur.'
        type: boolean
        default: true
      adet:
        description: 'hepsi=false ise kac ilan okunsun (kovalara esit bolunur)'
        default: '100'

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Pilotu kos
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEPSI: ${{ inputs.hepsi && '1' || '0' }}
          HAKEM: ${{ inputs.hakem && '1' || '0' }}
          HAKEM_YAZ: ${{ inputs.hakem_yaz && '1' || '0' }}
          TUM: ${{ inputs.tum && '1' || '0' }}
          KOVALAR: ${{ inputs.kovalar }}
          ILANLAR: ${{ inputs.ilanlar }}
          ONBELLEK: ${{ inputs.onbellek && '1' || '0' }}
          ADET: ${{ inputs.adet }}
        run: ./motor/alacak-ilan-okuyucu-pilot.ps1

      # Ham rapor depoya girmez; artefakt olarak indirilir ve elle incelenir.
      # 30.08: YEDEK DOSYASI DA BURAYA EKLENDI. Yazma turu her kosuda
      # veri/alacak-hakem-yedek.json uretiyordu (damgalarin ONCEKI hali) ama bu
      # dosya ne commit ediliyor ne yukleniyordu - runner silinince kayboluyordu.
      # 29.08'de 815 damga yazildi ve GERI DONUS DOSYASI YOKTU; ancak ham
      # rapordan yeniden kurulabildi. Yazma geri alinamiyorsa yazilmamali.
      - name: Raporu artefakt olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alacak-okuma-pilot
          path: |
            veri/alacak-okuma-pilot.json
            veri/alacak-hakem-yedek.json
            veri/alacak-okuma-onbellek.json
          if-no-files-found: warn
          retention-days: 90

      # 29.08: SUPHELI LISTESI artefakt DEGIL, kalici veri. Kosu gecince
      # kaybolmamali - regex damgasinin yanildigi yeri bulmanin en ucuz yolu.
      # Yalniz bu tek dosya commit edilir; ham rapor (metin parcalari daha uzun)
      # artefaktta kalir.
      - name: Supheli damga listesini depoya yaz
        if: success()
        shell: bash
        run: |
          if [ ! -f veri/alacak-supheli-damga.json ]; then echo "dosya yok, atlandi"; exit 0; fi
          git config user.name  "tetikte-robot"
          git config user.email "robot@tetikte.com"
          git add veri/alacak-supheli-damga.json
          # 30.08: yedek de depoya. Artefakt 90 gun tutar, depo kalicidir -
          # "hangi damga neydi" sorusunun cevabi bir daha kaybolmasin.
          if [ -f veri/alacak-hakem-yedek.json ]; then git add veri/alacak-hakem-yedek.json; fi
          # 30.08: onbellek de depoya. Bu dosya olmadan her yazma turu arsivi
          # ikinci kez bastan okuyor (~95 dk + iki kat para).
          if [ -f veri/alacak-okuma-onbellek.json ]; then git add veri/alacak-okuma-onbellek.json; fi
          if git diff --cached --quiet; then echo "degisiklik yok"; exit 0; fi
          N=$(node -e "console.log(JSON.parse(require('fs').readFileSync('veri/alacak-supheli-damga.json','utf8')).supheli)")
          Y=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('veri/alacak-hakem-yedek.json','utf8')).adet)}catch(e){console.log(0)}")
          git commit -m "Supheli damga $N kayit · yazma yedegi $Y kayit [okuma-pilotu]"
          # 29.08: PUSH 'fetch first' ile REDDEDILDI - kosu 20 dk suruyor ve o
          # arada baska commit'ler (robot ya da diger oturum) geliyor. Depoda iki
          # is akisi paralel calisiyor; tek seferlik push YETMEZ. Rebase edip
          # birkac kez dene - kaybolan liste bir daha kaybolmasin.
          # 30.08 KUSUR: burada REBASE vardi ve muhlet turunda CAKISTI:
          #   "error: could not apply ... Supheli damga 257 kayit"
          # Sebep: bu uc dosya her kosuda BASTAN yazilan robot ciktisi. Iki kosu
          # ust uste gelince git satir satir birlestirmeye calisiyor - oysa
          # birlestirilecek bir sey yok, EN YENI KOSU dogrudur. Olcum ve kasaya
          # yazma basariliydi; yalniz bu adim dustu ve 2.872 kayitlik onbellek
          # kayboldu (artefakta da konmamisti).
          # COZUM: rebase yerine "ana telin ustune yeniden yaz". Dosyalar
          # calisma kopyasinda duruyor; commit cozulup ana telin tepesine
          # yeniden konuyor, cakisma dogmuyor.
          for deneme in 1 2 3; do
            if git push origin HEAD:main; then echo "push OK (deneme $deneme)"; exit 0; fi
            echo "push reddedildi, ana telin ustune yeniden yazilacak ($deneme/3)"
            git fetch origin main || exit 1
            git reset --soft origin/main
            git add veri/alacak-supheli-damga.json
            [ -f veri/alacak-hakem-yedek.json ]   && git add veri/alacak-hakem-yedek.json
            [ -f veri/alacak-okuma-onbellek.json ] && git add veri/alacak-okuma-onbellek.json
            if git diff --cached --quiet; then echo "degisiklik kalmadi"; exit 0; fi
            git commit -m "Supheli damga $N kayit · yazma yedegi $Y kayit [okuma-pilotu]"
            sleep 5
          done
          echo "3 denemede de push edilemedi"; exit 1
