# .github/workflows/goc-nobeti.yml — GOC NOBETCISI
#
# NEDEN VAR (29.08.2026, Cem "1.2 yap")
# 28.08'de olculdu: alacak-radari.html kasadan 'secilenGun' / 'turIlk' / 'turGun'
# okuyordu ama o alanlari ureten goc Supabase'de BASILMAMISTI. Sayfa cokmedi -
# SUSTU: kapsam serhini basmadi, "iflas arsivi yalniz 4,7 aylik" uyarisi hic
# gorunmedi. Yani kusur ekranda BELLI OLMUYORDU ve haftalarca surebilirdi.
#
# CI depoyu denetler, KASAYI denetlemez. Goc dosyasi depoda duruyor olmasi
# basildigi anlamina gelmiyor - "yazildi" ile "basildi" arasi denetimsizdi.
# Bu nobetci her gun canli uctan cagirip sayfanin okudugu anahtarlarin
# gercekten geldigini dogrular.
#
# SECRET ISTEMEZ: sayfalarin zaten icinde tasidigi acik (publishable) anahtarla
# calisir - yani "anahtar yok" diye KOR'e dusmez.
# YAZMAZ: manifestodaki yasakli ad listesi (uyari_teyit, marka_talep_ac,
# alacak_yaz...) civatali; nobetci salt okur.
#
# Kutuk: radar-app/sql/UYGULANDI.md · Manifesto: radar-app/sql/goc-manifesto.json
name: Goc Nobetcisi

on:
  schedule:
    - cron: "35 4 * * *"    # 07:35 TR — CI kirmizi nobetcisinden hemen sonra
  workflow_dispatch:
  push:
    paths:
      # Goc ya da manifesto degistiginde ANINDA kos: yeni alan eklenip goc
      # basilmadiysa aradan gun gecmesin.
      - 'radar-app/sql/**'
      - 'motor/goc-nobetcisi.ps1'
      - 'alacak-radari.html'
      - 'uyari-teyit.html'
      # Nobetcinin KENDI tarifi degistiginde de kosar - 29.08'de bu satir yoktu
      # ve nobetciye yapilan duzeltme dogrulanamadan bekledi.
      - '.github/workflows/goc-nobeti.yml'

permissions:
  contents: write     # raporu depoya isler

jobs:
  nobet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sayfalarin okudugu anahtarlar kasadan geliyor mu
        shell: pwsh
        run: ./motor/goc-nobetcisi.ps1

      # Rapor KIRMIZI olsa da yayinlanir - "kor kalma" kurali: nobetcinin
      # kendi ciktisi gorunmezse nobetci de kor kalmis olur.
      #
      # ⚠ 29.08 OLCULDU: bu adimin ilk hali "git push || true" yaziyordu. Ilk
      # kosuda nobetci CALISTI ve olctu, adim "success" dondu, ama rapor depoya
      # HIC ISLENMEDI - itme sessizce dustu ve || true yuttu. Yani korlugu
      # onlemesi gereken adimin kendisi kor kaldi. Artik: itme birden fazla
      # denenir (robotlar dakikada bir itiyor, yarisma normaldir) ve hepsi
      # duserse adim ACIKCA KIRMIZI yanar.
      - name: Raporu yayinla (kirmizi olsa da)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/goc-nobeti-raporu.json
          if git diff --cached --quiet; then
            echo "Rapor degismedi - islenecek bir sey yok."
            exit 0
          fi
          git commit -m "Goc nobeti raporu [veri-operasyonu]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Rapor islendi (deneme $i)."
              exit 0
            fi
            echo "Deneme $i dustu (robot itmesi olabilir), tekrar denenecek."
            sleep $((i * 7))
          done
          echo "::error::Goc nobeti raporu 5 denemede islenemedi - nobetcinin ciktisi gorunmuyor (kor kalma)."
          exit 1
