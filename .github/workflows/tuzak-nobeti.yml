# .github/workflows/tuzak-nobeti.yml — TUZAK NOBETCISI CI KAPISI
#
# 12.09.2026, Cem "1.2.3 ucunu de yap" (GM onerisi 2).
#
# NIYE VAR
#   Nobetci bugune kadar YALNIZ `motor/oturum.ps1 -Kapat` icinde kosuyordu.
#   Yani kapi ancak BIR OTURUM duzgun kapanirsa isliyordu. Kapidan HIC gecmeyen
#   uc yol vardi:
#     1) robotlarin dogrudan ana tele attigi commit'ler
#     2) akis dosyalari (.github/workflows/*.yml) - nobetci onlari hic taramiyordu
#     3) oturum kapanisi atlanan / -Birak ile gecilen isler
#   K6'nin bedelini odeyen yara tam da 2. yoldaydi: yayin-bas.yml'deki
#   `git push ... 2>&1`. Push GERCEKTEN gecti, akis yine kirmizi dustu ve
#   16 dakikalik odenmis is "basarisiz" gorundu.
#
# ⛔ TUM DEPOYU TARAMIYOR - VE BU BILEREK.
#   Depoda 173 eski bulgu var (K2 76 · K5 44 · K4 32 · K1 14 · K3 7); hepsi
#   ayri is emri. Tum depoyu tarayan bir kapi ILK GUN kirmiziya civilenir,
#   kimse bakmaz, kapi kapali sayilir. (Ayni hata artifact nobetcisinde
#   yasanmisti.) Bu yuzden yalniz O ITMEDE DEGISEN dosyalara bakilir.
#
# ⛔ Cikis kodu zaten YALNIZ 🔴 ZARARLI bulguda 1'dir; "riskli ama bugun
#   zararsiz" bulgular uyari kalir ve kapiyi dusurmez.
#
# ⛔ windows-latest SART: nobetci PS 5.1 tuzaklarini olcuyor ve kendisi de
#   PS 5.1 betigi (BOM, -cmatch, AST). ubuntu'da pwsh farkli davranir.
name: Tuzak nobetcisi (CI kapisi)

on:
  push:
    paths:
      - '**.ps1'
      - '.github/workflows/**.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read           # son YESIL kosuyu bulmak icin (asagida, 27.09)

concurrency:
  group: tuzak-nobeti-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nobet:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # $Ref'i cozebilmek icin gecmis gerekli

      - name: Degisen dosyalarda tuzak ara
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ⛔ 27.09.2026 — KIRMIZI UNUTULUYORDU. Olculdu: 12.09-25.09 arasi 7 kosu
          #   KIRMIZI dustu; her birinde bir SONRAKI itme yalniz KENDI farkina
          #   (event.before) baktigi icin yesile dondu, bulgu gozden kayboldu.
          #   27.09'da 7 kirmizinin 5 bulgusu (4 dosya) depoda HALA duruyordu;
          #   25.09 kirmizisi (oturum.ps1 K6) iki gun sonra butun oturumlari kilitledi.
          #   Iptal edilen 6 kosunun (cancel-in-progress) farki ise HIC taranmadi.
          # COZUM: Ref = bu akisin ana teldeki SON YESIL kosusunun commit'i.
          #   Bulgu duzeltilene kadar her kosu onu yeniden gorur -> kirmizi KALICI.
          #   Iptal edilen kosularin farki da bir sonrakine dahil olur.
          # Bulamazsa (ilk kosu / gh hatasi / son yesil HEAD'in atasi degil)
          #   eski davranis: github.event.before. Hangisi secildi, gunluge yazilir.
          # GORMEZ: son yesilden ONCE giren bulgular (27.09 oncesi 5 bulgu) -
          #   onlar ayri is emri; bu adim yalniz yenisinin kaybolmasini onler.
          $ref = "${{ github.event.before }}"
          $kaynak = 'event.before'
          $yesil = "$(gh run list --workflow tuzak-nobeti.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')".Trim()
          if($yesil){
            git merge-base --is-ancestor $yesil HEAD
            if($LASTEXITCODE -eq 0){ $ref = $yesil; $kaynak = 'son yesil kosu' }
            else { "UYARI: son yesil $yesil HEAD'in atasi degil - event.before kullaniliyor" }
          } else { "UYARI: son yesil kosu bulunamadi - event.before kullaniliyor" }
          "Ref: $ref ($kaynak) · aradaki commit: $(git rev-list --count "$ref..HEAD")"
          ./arac/tuzak-nobetcisi.ps1 -Ref $ref

      - name: Kapi dustuyse ne yapilir
        if: failure()
        shell: powershell
        run: |
          "ZARARLI tuzak bulundu - yukaridaki dosya:satir listesine bak."
          "Bilerek bozuk test verisiyse: # nobetci:gec  ya da"
          "  # nobetci:bolge-basla ... # nobetci:bolge-bitir  (GEREKCESI YAZILARAK)"
          "Kural listesi: mevzuat-radar/CLAUDE.md > 'Bilinen tuzagi tekrar yazmak'"
          exit 1
