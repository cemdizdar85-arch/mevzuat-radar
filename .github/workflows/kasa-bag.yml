# .github/workflows/kasa-bag.yml — KASA BAGI (Katman 1 + Katman 5)
# Kasadaki her soruyu dayandigi kanun maddesine baglar ve o maddenin o andaki
# metninin parmak izini soruya yazar. Boylece Katman 3 bir maddenin degistigini
# gordugunde KIME haber verecegini bilir.
# UCRETSIZDIR: hicbir API cagrisi yok, yalniz Supabase okuma/yazma.
#
# Kolonlar yoksa (veri/sql-yayin-kapisi.sql calistirilmadiysa) betik YAZMAZ,
# yalniz olcum raporu cikarir ve 3 ile doner.
name: Kasa Bagi

on:
  workflow_dispatch:
    inputs:
      yaz:
        description: "Kasaya gercekten yazsin mi? (kapali = yalniz olcum)"
        type: boolean
        default: false
  push:
    paths:
      - 'motor/kasa-bag.ps1'
      - 'veri/kasa-bag-emir.json'

permissions:
  contents: write

concurrency:
  group: kasa-bag
  cancel-in-progress: false

jobs:
  bagla:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Bagi kur
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Yazma ASLA kendiliginden olmaz. Iki yolu var: workflow_dispatch +
          # yaz=true, ya da veri/kasa-bag-emir.json icinde onayli ve damgasiz
          # bir emir. Kasa duzeltme ve profesor kanallarindaki duzenin aynisi:
          # yazili emir, tek kullanim, damga. Damgali emir bir daha kosmaz.
          $yaz = '${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.yaz }}' -eq 'true'
          $emirNo = 0
          $eYol = 'veri/kasa-bag-emir.json'
          if(-not $yaz -and (Test-Path $eYol)){
            $e = Get-Content $eYol -Raw -Encoding UTF8 | ConvertFrom-Json
            $a = @($e.emirler | Where-Object { $_.yaz -eq $true -and -not $_.uygulandi })
            if($a.Count -gt 0){ $yaz = $true; $emirNo = [int]$a[0].no; Write-Host ("EMIR #{0}: {1}" -f $a[0].no, $a[0].gerekce) }
          }
          if($yaz){ ./motor/kasa-bag.ps1 -yaz } else { ./motor/kasa-bag.ps1 }
          $kod = $LASTEXITCODE
          if($emirNo -gt 0 -and $kod -eq 0){
            $e = Get-Content $eYol -Raw -Encoding UTF8 | ConvertFrom-Json
            foreach($x in $e.emirler){ if([int]$x.no -eq $emirNo){ $x | Add-Member -NotePropertyName uygulandi -NotePropertyValue (Get-Date -Format 'dd.MM.yyyy HH:mm') -Force } }
            [IO.File]::WriteAllText($eYol, ($e | ConvertTo-Json -Depth 8), (New-Object Text.UTF8Encoding($false)))
            Write-Host "Emir #$emirNo damgalandi."
          }
          $global:LASTEXITCODE = $kod
          # kolon yoksa 3 doner: kirmizi degil, "henuz kurulamadi" demektir
          if($LASTEXITCODE -eq 3){ Write-Host "Kolonlar bekleniyor - SQL calistirilinca kurulacak."; exit 0 }
          exit $LASTEXITCODE
      - name: Raporu commit'le
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in veri/kasa-bag.json veri/kasa-bag-emir.json; do
            if [ -f "$f" ]; then git add "$f" || true; fi
          done
          git diff --cached --quiet || git commit -m "Kasa bagi raporu [veri-operasyonu]"
          git pull --rebase --autostash || true
          git push || true
