# ============================================================================
#  MOBIL - iOS CIHAZ PROVASI (iPhone simulatoru)  (16.10.2026, Cem "hepsini deneyelim, Play Store gibi")
#
#  Ne yapar: mobil-ios.yml ile AYNI icerik (hazirla.js) + ayni Info.plist ayarlariyla iOS uygulamasini
#  simulator icin derler (Release, imzasiz, magaza derlemesiyle ayni Xcode), iPhone simulatorune kurar,
#  Appium XCUITest ile mobil/cihaz-akis-ios.js'i kosar: tanitim, 4 sekme, ornek soru (sikka dokun, alt
#  dugmeler + Sonraki), seviye testi 3 soru, her ekranda ✕ ortulme + kapanma, donma, iPhone'da satis
#  dugmesi yok, cokme yok. IKI iOS SURUMUNDE: 18 ve 26 (Apple incelemesi guncel iOS'ta yapar).
#
#  mobil-ios.yml her derlemeden ONCE bunu cagirir (workflow_call); prova kirmiziysa App Store'a YUKLEME YOK
#  (Cem 16.10: "her iOS derlemesinden once bu prova kosulsun").
#
#  WebDriverAgent: GitHub'in Xcode 26.x simulator platformunda lib_TestingInterop.dylib YOK -> WDA Xcode 26
#  ile derlenemiyor (16.10 kosu 5-6). WDA Xcode 16.4 ile BIR KEZ derlenir, iki simulatore de hazir uygulama
#  olarak kurulur (usePreinstalledWDA) -> iOS 26'da derleme gerekmez.
#
#  Bedel: 0 TL (depo public, macOS dakikasi ucretsiz). App Store'a YUKLEMEZ.
#  Kanit: ekran goruntuleri SIFRELI artifact (mobil-cihaz-prova.yml ile ayni RSA anahtari).
#  GORMEZ: girisli uye akisi (✕'li bildirimler orada), gercek telefon, iPad, imzali derleme.
# ============================================================================
name: Mobil - iOS cihaz provasi (simulator)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  prova:
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        ios: ['18', '26']
    defaults:
      run:
        shell: bash
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      # Uygulama magaza derlemesiyle (mobil-ios.yml) AYNI Xcode ile derlenir.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Icerik kapisi oz-sinavi + icerik derleme
        working-directory: mobil
        env:
          TT_DERLEME: ${{ github.run_number }}
        run: |
          node hazirla-sinavi.js
          node hazirla.js
          # YALNIZ PROVA: sayfa kumandasi (cihaz-akis-ios.js kopru sunucusuna baglanir). mobil-ios.yml'in derle isi CAGIRMAZ.
          node prova-kumanda-kur.js

      - name: Paketler
        working-directory: mobil
        run: npm ci --no-audit --no-fund

      - name: iOS projesi (mobil-ios.yml ile ayni)
        working-directory: mobil
        run: |
          node -e "const f='capacitor.config.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.ios=Object.assign({},c.ios,{webContentsDebuggingEnabled:true});fs.writeFileSync(f,JSON.stringify(c,null,2));"
          npx cap add ios --packagemanager SPM
          node ikon-uret.js
          npx capacitor-assets generate --ios --assetPath kaynak/uretilen
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
          # YALNIZ PROVA: sayfa kumandasi Mac'teki 127.0.0.1:8777'ye http ile baglanir (ATS izni)
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.googleusercontent.apps.472072608563-3m6597u5ib74119tpe7cmmfr77dq80ft" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:1 string com.tetikte.app" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string 472072608563-3m6597u5ib74119tpe7cmmfr77dq80ft.apps.googleusercontent.com" ios/App/App/Info.plist

      - name: Simulator icin derle (Release, imzasiz)
        working-directory: mobil/ios/App
        run: |
          SURUM=$(node -p "require('../../package.json').version")
          if [ -d App.xcworkspace ]; then PROJE="-workspace App.xcworkspace"; else PROJE="-project App.xcodeproj"; fi
          xcodebuild $PROJE -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            PRODUCT_BUNDLE_IDENTIFIER=com.tetikte.app CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$SURUM" CURRENT_PROJECT_VERSION=${{ github.run_number }} build > "$RUNNER_TEMP/derle.log" 2>&1 \
            || { tail -60 "$RUNNER_TEMP/derle.log"; echo "::error title=derleme::simulator derlemesi dustu"; exit 1; }
          test -d "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/App.app"
          xcodebuild -version

      - name: Appium + WebDriverAgent (Xcode 16.4 ile, hazir uygulama)
        run: |
          npm i -g appium@3 --no-audit --no-fund
          appium driver install xcuitest
          appium --version; appium driver list --installed 2>&1 | tail -2
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          appium driver run xcuitest build-wda --sdk=$(xcrun --sdk iphonesimulator --show-sdk-version) > "$RUNNER_TEMP/wda.log" 2>&1 \
            || { grep -E "error:|BUILD" "$RUNNER_TEMP/wda.log" | head -20; echo "::error title=wda::WebDriverAgent derlenemedi"; exit 1; }
          WDA_APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "WebDriverAgentRunner-Runner.app" -path "*iphonesimulator*" | head -1)
          test -n "$WDA_APP" || { echo "::error title=wda::WebDriverAgentRunner-Runner.app bulunamadi"; exit 1; }
          echo "WDA_APP=$WDA_APP" >> $GITHUB_ENV; echo "WDA: $WDA_APP"
          # iOS 26 calisma ortami yalniz Xcode 26 ile surulur -> geri don; iOS 18 Xcode 16.4'te kalir
          if [ "${{ matrix.ios }}" = "26" ]; then sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer; fi
          xcodebuild -version

      - name: iPhone simulatorunu ac + kur (iOS ${{ matrix.ios }})
        run: |
          xcrun simctl list runtimes | grep -i ios
          UDID=$(xcrun simctl list devices available -j | IOS="${{ matrix.ios }}" node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')).devices;
            const l=Object.entries(d).filter(([k])=>new RegExp('iOS-'+process.env.IOS+'-').test(k)).sort(([a],[b])=>b.localeCompare(a,undefined,{numeric:true})).flatMap(([k,v])=>v.map(x=>({...x,os:k})));
            const s=l.find(x=>/^iPhone 16$/.test(x.name))||l.find(x=>/^iPhone \d+$/.test(x.name))||l.find(x=>/^iPhone/.test(x.name));
            if(!s){console.error('iOS '+process.env.IOS+' simulatoru YOK');process.exit(1);}
            console.error('simulator: '+s.name+' · '+s.os.split('.').pop()); console.log(s.udid);")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/App.app"
          xcrun simctl install "$UDID" "$WDA_APP"
          nohup appium --log "$RUNNER_TEMP/appium.log" --log-level info > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:4723/status > /dev/null || { echo "::error title=appium::sunucu acilmadi"; exit 1; }

      - name: Simulatorde prova (iOS ${{ matrix.ios }})
        run: |
          node mobil/cihaz-akis-ios.js kanit || echo "PROVA_KIRMIZI=1" >> $GITHUB_ENV
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i "^App" || echo "cokme raporu yok"

      - name: Appium gunlugu (hata satirlari)
        if: always()
        run: grep -iE "error|fail" "$RUNNER_TEMP/appium.log" | grep -viE "password|token" | tail -25 || true

      - name: Kaniti sifrele (RSA + AES)
        if: always()
        run: |
          mkdir -p cikti
          if [ -d kanit ]; then
            tar czf kanit.tgz kanit
            openssl rand -hex 32 > anahtar.txt
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in kanit.tgz -out cikti/kanit.tgz.enc -pass file:anahtar.txt
            openssl pkeyutl -encrypt -pubin -inkey mobil/prova-acik.pem -pkeyopt rsa_padding_mode:oaep -in anahtar.txt -out cikti/anahtar.bin.enc
            rm -f anahtar.txt kanit.tgz
            ls -la cikti
          fi

      - name: Sifreli kanit (3 gun)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-prova-${{ github.run_number }}-ios${{ matrix.ios }}
          path: cikti/*.enc
          retention-days: 3
          if-no-files-found: warn

      - name: Prova kirmiziysa isi KIRMIZI bitir
        if: ${{ env.PROVA_KIRMIZI == '1' }}
        run: |
          echo "::error title=ios provasi::iOS ${{ matrix.ios }} - en az bir adim dustu - gunlukte DUSTU satirlarina bak"
          exit 1
