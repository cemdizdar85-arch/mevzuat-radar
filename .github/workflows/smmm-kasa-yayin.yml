# SMMM (BITIRME) KASA YAYINI — AYRI IS, TEK SIRA (23.09.2026, Cem "1.2.3 ucunu de yap" - madde 3)
#
# NIYE AYRI: kasa yayini (arac/smmm-kasa-yayin.ps1 -Yaz) eskiden HER bulut uretim kosusunun sonunda
# calisiyordu. Olculdu (23.09): 12 kosu ayni gece 12 kez butun kasayi bastan yazdi, adim tek basina
# 30+ dk suruyor ve 350 dk is tavanina yaklasiyordu; 04:04 cokusunde w8 uretimini BITIRMIS ama bu adimda
# dusmustu. Yayin her seferinde butun kasayi yazdigi icin (idempotent, upsert + bayat silme) TEK kosu yeter.
#
# NASIL: bulut-uretim.yml sonunda yalniz bu isi TETIKLER. concurrency grubu tek sira tutar ve
# cancel-in-progress KAPALI: GitHub bir grupta en fazla 1 kosan + 1 bekleyen tutar, daha yeni bekleyen
# eskisinin yerine gecer. 12 tetik = 1 kosu + en fazla 1 ek kosu. Yarim yayin olmaz (kosan kesilmez).
# Ayrica her sabah bir kez kendiliginden kosar: coken kosu yayini hic tetikleyemese de kasa guncellenir.
#
# BEDEL 0 — model cagrisi YOK. Gunluge yalniz sayi basilir, soru metni basilmaz (bulut guvenligi kurali 2).
# 🚫 BU IS SUNU GORMEZ: uretim kosusu hic bitmezse (sonuc ambara yazilamadiysa) o sorular zaten ambarda
#   yoktur; yayin ambarda olani yayinlar.
name: SMMM Kasa Yayini (0 USD)

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'      # 07:20 TR - gece koşularından sonra guvenlik agi

concurrency:
  group: smmm-kasa-yayin
  cancel-in-progress: false

# 03.10.2026 (Cem "1. yap"): kabuk kurulumu (-SiteKabuk) buraya tasindi -> kaydir/smmm kabuklarini itmek icin yazma izni.
#   Itilen yalniz kaydir/smmm/*.html (SORUSUZ kabuk; motor/kasa-kabuk.js esdegerlik kapisi) + arac/kasa-modu.json.
permissions:
  contents: write

jobs:
  yayin:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 03.10: kabuk itmesinde merge icin gecmis gerekli (yayin-bas.yml ile ayni)

      # 23.09 KAPI-HAD: yayin sarti guncel had tutarlarini veri/sinav/had-guncel.json'dan okur (ambardaki kanun serhleri).
      # Once tazelenir; duserse eski dosya kalir (kapi eski had ile calisir, yayin DURMAZ).
      - name: Guncel had tutarlarini tazele (KAPI-HAD)
        shell: powershell
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./arac/had-tutar-tarama.ps1 -YalnizHad

      - name: Bitirme sorularini kilitli kasaya yaz
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $ErrorActionPreference = 'Continue'   # alt surecin stderr satiri adimi dusurmesin; cikis kodu asagida okunur
          # 03.10.2026 (Cem "1. yap"): -SiteKabuk -> ders sayfalari depoda SORUSUZ KABUK olarak yeni kaliple kurulur.
          #   Neden: kalip (motor/kaydir-coz.ps1 $html) degisince bitirme sayfalari ancak bu makinede saatler suren yerel
          #   -SiteKabuk kosusuyla yenileniyordu (03.10'da iki yerel deneme 2 saat sinirina takildi; demo dugmesi, "Bilmiyorum"
          #   bitirme sayfalarina gecemedi). Kabuk yazilamazsa (kasa ile sayfa alan alan esdegersiz) betik sayfayi SILER,
          #   depoya soru icerigi gitmez. Kabuk kapisinin gunluge bastigi yalniz kimlik/sira (motor/kasa-kabuk.js esdeger()).
          & powershell -NoProfile -File ./arac/smmm-kasa-yayin.ps1 -Yaz -SiteKabuk
          $kod = $LASTEXITCODE
          "kasa yayini cikis kodu: $kod"
          if($kod){ "::error::bitirme kasa yayini dustu ($kod) - sorular ambarda duruyor; yeniden: gh workflow run smmm-kasa-yayin.yml"; exit $kod }

      # 03.10.2026: yeni kalipla kurulan bitirme kabuklarini it. Yalniz kaydir/smmm + arac/kasa-modu.json.
      #   Kabukta soru icerigi yok (data-kasa-sayfa isareti + boyut kapisi betikte); yine de itmeden once ikinci kez bakilir.
      #   Stderr YONLENDIRME YOK (K6 - yayin-bas.yml "Degisen varsa ite" notu): basarili push bile adimi olduruyordu.
      - name: Bitirme kabuklarini it
        shell: powershell
        run: |
          git config user.name  "tetikte-robot"
          git config user.email "bildirim@tetikte.com"
          git config merge.tetikte-robot.name "Tetikte robot ciktisi: cakismada yereldeki korunur"
          git config merge.tetikte-robot.driver true
          foreach($f in Get-ChildItem kaydir/smmm -Filter *.html){
            $ham = [IO.File]::ReadAllText($f.FullName, [Text.Encoding]::UTF8)
            if($f.Name -ne 'index.html' -and ($ham -notmatch 'data-kasa-sayfa=' -or $ham -match 'const SORULAR=\[\{')){ "::error::KABUK DEGIL: $($f.Name) - soru icerigi depoya gitmesin diye ITILMEDI"; exit 1 }
          }
          git add kaydir/smmm arac/kasa-modu.json
          $degisen = @(git diff --cached --name-only)
          if(-not $degisen.Count){ "kabuklarda degisiklik yok - commit ATILMADI"; exit 0 }
          "degisen dosya: $($degisen.Count)"
          git commit -m "Bitirme kabuklari yeni kaliple (smmm-kasa-yayin kosusu ${{ github.run_number }})"
          for($i=1; $i -le 5; $i++){
            git push origin HEAD:main | Out-Null
            if($LASTEXITCODE -eq 0){ "itildi (deneme $i)"; exit 0 }
            git fetch origin main -q
            git merge origin/main --no-edit -q
            $cakisma = @(git diff --name-only --diff-filter=U)
            if($cakisma.Count){ "::error::itme cakismasi: $($cakisma -join ', ') - elle bakilmali"; exit 1 }
            Start-Sleep -Seconds (5 * $i)
          }
          "::error::5 denemede itilemedi"; exit 1
