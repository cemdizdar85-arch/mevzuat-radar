# .github/workflows/bulut-uretim.yml — SORU URETIMI BULUTTA
#
# 12.09.2026, Cem "bulut hattini simdi kuralim, bagimsiz denetim ve SPK da var".
#
# NIYE: uretim Cem'in dizustune bagliydi. Olculdu (11.09 gecesi): 8 es zamanli
# surecte RAM doluyor (bos 736 MB, takas 2.385 MB) ve makine kapaninca uretim
# duruyor. Uc yerel durum 11.09'da ambara tasindi (kalip_parti, bedel_kaydi,
# konu_koprusu) - bu akis o tasimanin karsiligi: bulut ayni yerden okur, ayni
# yere yazar.
#
# ⛔ NEDEN windows-latest, ubuntu DEGIL:
#    Olculdu - motor/kalip-parti-uret.ps1'de 22, kalip-kosucu.ps1'de 5 yerde
#    TERS BOLULU yol var ('veri\fabrika\...'). Linux'ta bunlar tek bir dosya
#    ADI olur, klasor olmaz; uretim sessizce yanlis yere bakar. Ayrica hat
#    PowerShell 5.1 icin yazildi. Windows runner ikisini de karsiliyor.
#    (Public depoda Actions dakikasi ucretsiz; windows runner daha yavas ama
#     darbogaz zaten model cagrisi, CPU degil.)
#
# ⛔ SONUC YUKLEME ADIMI if: always() — uretim yarida kalsa (tavan, zaman asimi,
#    iptal) bile ODENEN IS AMBARA YAZILIR. Bu olmazsa saatlerce koşan ve parasi
#    odenmis partiler runner ile birlikte silinir. "Yarim kosu = iki kez odeme"
#    dersi 11.09'da yazildi, burada kapiya cevrildi.
#
# FREN: motor/kalip-parti-uret.ps1 icindeki KAPI-BAKIYE her parti ONCESI
# Anthropic bakiyesini yokluyor; yetmezse parti HIC BASLAMIYOR. Yerel dosyaya
# bagli olmadigi icin bulutta da calisir. (Aylik tavan 11.09'da Cem karariyla
# kapi olmaktan cikarildi: "bakiye kadar harcayacak ve istedigimiz soru kadar
# basacak".)
#
# ⛔ ELLE TETIKLENIR. cron YOK - para harcayan bir akis kendiliginden kosmaz.
name: Bulut Uretim (soru basimi)
# 16.09: kosu adi PLANI tasir; parti cakisma kapisi koşan islerin planini buradan okur.
run-name: "Bulut Uretim | ${{ inputs.plan }} | halka ${{ inputs.zincir }}"

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan dosyasi (depo icinde, or. veri/sinav/plan-sgs-c3-ince-anlik.json)"
        required: true
        type: string
      paralel:
        description: "Es zamanli parti sayisi (1-40; toplu partiler ~%2 CPU yedigi icin yuksek deger guvenli, kosucuda BOS RAM kapisi var)"
        required: false
        default: "6"
        type: string
      indir_parti:
        description: "Parti onbellegini ambardan indir (ikiz denetimi icin gerekli)"
        required: false
        default: true
        type: boolean
      # ⛔⭐ 12.09.2026 — TOPLU KUYRUK PARCA BOYU DISARI ACILDI.
      #   motor/api-hedef.ps1:480'deki 09.09 olcumu: Anthropic kuyrugu KUCUK partileri
      #   one aliyor - 8/30/36/83 istekli partiler 3-15 dk'da islendi, 62 ve 96 istekli
      #   olanlar 20 dk'da SIFIRDI. O yuzden istekler MEVZUAT_TOPLU_PARCA boyunda
      #   parcalara bolunup birlikte gonderiliyor (varsayilan 30).
      #   ⚠ Bu ayar YALNIZ bir fazda parca boyundan COK istek varsa fark yaratir.
      #     8 soruluk bir parti icin 30 da 15 de TEK parcadir - olcum yapmaz.
      #   BOS birakilirsa kod varsayilani (30) gecerlidir; hicbir sey degismez.
      # ⭐ A/B SONUCU (13.09.2026, ayni anda kosan iki esit plan):
      #     plan-d2a · parca 30 (varsayilan) · 62 parti / 326 soru -> 74 dk
      #     plan-d2b · parca 15              · 63 parti / 334 soru -> 83 dk
      #   PARCA 30 %12 DAHA HIZLI. Kucuk parca HIZLANDIRMIYOR, yavaslatiyor:
      #   bir faz ancak IKI parcanin da donmesiyle tamamlanir, yani en yavas
      #   parcayi beklersin; tek parca olsa tek bekleme olurdu.
      #   "Kucuk parti kuyrukta one gecer" sezgisi 30'un ALTINDA artik islemiyor
      #   (09.09 olcumu 62 ve 96 istekli partiler icin dogruydu; 30 zaten esigin altinda).
      #   ⛔ VARSAYILAN 30'DA KALIYOR. Bu girdi artik olcum araci, ayar degil.
      toplu_parca:
        description: "Toplu kuyruk parca boyu (bos = 30). OLCULDU 13.09: 30 > 15 (74 dk vs 83 dk). Degistirmeden once yeni bir A/B kos."
        required: false
        default: ""
        type: string
      # 16.09.2026 (Cem "soru basmayi buluta tasiyalim"): toplu kuyruk bir isin 350 dk tavanini asabiliyor.
      # Is o zaman ANLIK yola dusmez (MEVZUAT_TOPLU_ANLIKSIZ), kendini ayni planla yeniden tetikler; bu sayac kacinci halka oldugunu tutar.
      zincir:
        description: "Otomatik yeniden tetikleme sayaci (elle 0 birak). 10'a varinca zincir durur."
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  actions: write     # 16.09: toplu kuyruk bitmediyse is kendini yeniden tetikler (workflow_dispatch)

# Iki bulut kosusu ayni anda ayni partiye yazarsa kayit bozulur.
# ⛔⭐ 12.09.2026 — ES ZAMANLILIK PLAN BAZINA CEVRILDI (Cem: gece SGS'yi bitirmek)
#   Onceden group 'bulut-uretim' idi: ikinci kosu PARALEL DEGIL KUYRUKTA bekliyordu.
#   Olculdu: B kosusu 94 parti / 95 dakika. Gece hedefi ~3.500 parti-soru; tek
#   kosuda 9+ saat, GitHub'in 350 dakikalik is tavanini asar ve yarida kesilir.
#   Depo PUBLIC, GitHub 20 es zamanli is veriyor -> ayrik planlar paralel kosar.
#
#   NIYE GUVENLI (olculdu):
#     · her parti KENDI onbellek dosyasina yazar (motor/kalip-kosucu.ps1 satir ~106)
#     · ayrik planlarda etiket kumeleri kesismez -> ayni dosyaya iki kosu yazmaz
#     · bedel defteri tekillestirmesi (zaman+etiket+tutar) ucludur; ayrik
#       etiketlerde mukerrer satir dogmaz
#   ⛔ SART: AYRI PLAN DOSYALARI + AYRI ETIKET ONEKI. Ayni plani iki kez
#     basmak ya da ayni oneki paylasmak TOPLU HASAT TUZAGINI acar (bkz.
#     motor/plandan-parti-kur.ps1 > EtiketOn). Bu yuzden grup PLAN ADINDAN
#     turetiliyor: ayni plan iki kez dispatch edilirse yine KUYRUGA girer.
concurrency:
  group: bulut-uretim-${{ inputs.plan }}
  cancel-in-progress: false

jobs:
  uret:
    runs-on: windows-latest
    timeout-minutes: 350        # GitHub is tavani 360; yukleme adimina pay birakildi
    env:
      # 16.09 (Cem "depoda soru icerigi kalmasin"): sinav calisma dosyalari gizli depoya (tetikte-kasa) tasiniyor.
      # Anahtar (KASA_OKUMA_TOKEN, yalniz tetikte-kasa contents:read) Cem tarafindan eklenince adim kendiliginden calisir; yokken is AYNEN eskisi gibi.
      KASA_VAR: ${{ secrets.KASA_OKUMA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Gizli kasa (anahtar varsa)
        if: env.KASA_VAR == 'true'
        uses: actions/checkout@v4
        with:
          repository: cemdizdar85-arch/tetikte-kasa
          token: ${{ secrets.KASA_OKUMA_TOKEN }}
          path: _kasa

      - name: Kasa dosyalarini calisma agacina koy (anahtar varsa)
        if: env.KASA_VAR == 'true'
        shell: powershell
        run: |
          # Kasadaki veri/ agaci depodaki ayni yollara kopyalanir; kosucu ve uretici yol degistirmeden okur.
          # Yalniz dosya SAYISI yazilir (icerik gunluge basilmaz - bulut guvenligi kurali 2).
          if(Test-Path _kasa/veri){ $n=@(Get-ChildItem _kasa/veri -Recurse -File).Count; Copy-Item -Path _kasa/veri/* -Destination veri -Recurse -Force; "kasadan kopyalanan dosya: $n" } else { "kasa bos (veri/ yok)" }

      - name: Sirlar yerinde mi (kosmadan once DUR)
        shell: powershell
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $eksik=@()
          if(-not "$env:ANTHROPIC_API_KEY"){ $eksik+='ANTHROPIC_API_KEY' }
          if(-not "$env:SUPABASE_SERVICE_KEY"){ $eksik+='SUPABASE_SERVICE_KEY' }
          if($eksik.Count){ throw ("GitHub Secret eksik: " + ($eksik -join ', ') + ". Depo > Settings > Secrets > Actions") }
          "sirlar tamam · plan: ${{ inputs.plan }} · paralel: ${{ inputs.paralel }}"
          if(-not (Test-Path "${{ inputs.plan }}")){ throw "plan dosyasi depoda yok: ${{ inputs.plan }}" }

      - name: Durumu ambardan indir (kopru + defter + parti onbellegi)
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Kopru: uretici KONU SECIMINI bundan yapar. Yoksa "kopru disi sentez"
          # yoluna duser, dayanak BOS kalir ve KAYNAK-EKSIK reti artar (11.09'da
          # 777 ret, tum retlerin %54'u tam bu aileydi).
          # 13.09 SMMM: kopru ve parti sinavi PLANDAN okunur (eskiden sabit SGS'ydi -> SMMM plani bulutta
          # SIFIR konu adayi bulurdu; olculdu: SMMM'nin 6 partisi ambarda sinav=SGS diye durur).
          # Karisik sinavli plan REDDEDILIR: parti-senkron -Yukle tek sinav etiketi basar.
          $planSatirlari = @((Get-Content "${{ inputs.plan }}" -Raw -Encoding UTF8 | ConvertFrom-Json))
          $planSinavlari = @($planSatirlari | ForEach-Object { if($_.PSObject.Properties['sinav'] -and "$($_.sinav)"){ "$($_.sinav)" } else { 'SGS' } } | Sort-Object -Unique)
          if($planSinavlari.Count -ne 1){ throw ("Plan birden fazla sinav iceriyor ({0}) - sinav basina ayri plan kosun" -f ($planSinavlari -join ', ')) }
          $planSinavi = $planSinavlari[0]
          "PLAN SINAVI: $planSinavi"
          "PLAN_SINAVI=$planSinavi" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          ./arac/kopru-senkron.ps1 -Indir -Yaz -Sinav $planSinavi
          # 16.09: gonderilmis toplu parti kimlikleri (yeniden koşuda BEDAVA hasat / kuyruktakine baglanma; cift odeme yok)
          ./arac/bekleyen-senkron.ps1 -Indir
          # Isin baslangici: toplu bekleme bu andan 290 dk sonra kesilir. 17.09 OLCULDU (35119974812): 320/335 butcesinde yukleme adimina 8 dk kaldi,
          # 152 partinin 36'si yazilabildi, bekleyen kaydi hic yazilmadi. Butce: SON_AN 290 · Uret 305 · yukleme ~40 dk.
          "MEVZUAT_TOPLU_SON_AN=$((Get-Date).ToUniversalTime().AddMinutes(290).ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          # Defter: harcama kaydi tek yerden gorulsun
          ./arac/bedel-senkron.ps1 -Indir -Yaz
          if ("${{ inputs.indir_parti }}" -eq "true") {
            # Parti onbellegi: ikiz denetimi kardes partilere bakar
            # 16.09: bitirme planinda yalniz smmm- partileri iner (kardes ikiz denetimi icin yeterli; 1.064 yerine ~34 parti)
            if($planSinavi -eq 'SMMM'){ ./arac/parti-senkron.ps1 -Indir -Yaz -Sinav $planSinavi -OnEk 'smmm-' } else { ./arac/parti-senkron.ps1 -Indir -Yaz -Sinav $planSinavi }
          } else {
            "parti onbellegi ATLANDI (ikiz denetimi zayif kosar)"
          }
          # 13.09 OLCULDU (kosu 34772474588): sondaki -Yukle, basta INDIRILEN ve hic degismeyen partileri de geri yukluyordu
          # (indirme dosya saatini yeniler -> "yerel daha yeni" sayilir). Kosu surerken baska oturumun guncelledigi 5 bitirme
          # partisi eski icerikle ezildi. Cozum: indirmeden hemen sonra her partinin parmak izi alinir; sonda yalniz izi degisen
          # ya da yeni olusan parti yuklenir.
          $iz=[ordered]@{}
          foreach($f in @(Get-ChildItem veri/fabrika -Filter 'kalip-parti-*.json' -ErrorAction SilentlyContinue)){ $iz[$f.Name]=(Get-FileHash $f.FullName -Algorithm SHA256).Hash }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'parti-onizi.json'),(ConvertTo-Json -InputObject $iz -Compress),[Text.UTF8Encoding]::new($false))
          "parti parmak izi alindi: $($iz.Count) dosya"

      - name: Uret
        shell: powershell
        # 16.09 OLCULDU (35083827921): adim is tavanina (350) takilinca is IPTAL sayildi, zincir adimi (!cancelled) atlandi.
        # Adimin kendi tavani 335 dk: asilirsa adim BASARISIZ olur (iptal degil) -> yukleme ve zincir adimlari yine kosar.
        # 17.09: 335 yuklemeye yer birakmiyordu (35119974812) -> 305
        timeout-minutes: 305
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Bos girdi = degisken hic yok sayilir; api-hedef.ps1 kendi varsayilanini (30) kullanir.
          MEVZUAT_TOPLU_PARCA: ${{ inputs.toplu_parca }}
          # 16.09 Cem "hep toplu, ucuza bekle": bekleme anlik yola dusmez; SON_AN'da surec 75 ile biter, zincir devam ettirir.
          MEVZUAT_TOPLU_BEKLE_DK: "1440"
          MEVZUAT_TOPLU_ANLIKSIZ: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          # 16.09 PARTI CAKISMA KAPISI: bu isten ONCE baslamis, hala kosan bulut islerinin planlarindaki etiketler atlanir
          # (ayni partiyi iki is yazarsa son yazan oncekini siler). Atlanan parti zincirle sonraki halkada kosar.
          $atla=@()
          try{
            $buKosu=[long]"${{ github.run_id }}"
            # 17.09 OLCULDU: @(... | ConvertFrom-Json) PS 5.1'de diziyi TEK oge sarar -> [long]$k.databaseId her koşuda patliyordu,
            # kapi hic calismadi ("cakisma kapisi okunamadi ... Int64"). Once degiskene, sonra acarak.
            $kosanJson=(gh run list --workflow=bulut-uretim.yml --status in_progress --limit 50 --json databaseId,displayTitle) | ConvertFrom-Json
            $kosanlar=@($kosanJson | ForEach-Object { $_ })
            foreach($k in $kosanlar){
              if([long]$k.databaseId -ge $buKosu){ continue }
              $m=[regex]::Match("$($k.displayTitle)",'Bulut Uretim \| (\S+) \| halka')
              if(-not $m.Success){ continue }
              $digerPlan=$m.Groups[1].Value
              if($digerPlan -eq "${{ inputs.plan }}" -or -not (Test-Path $digerPlan)){ continue }
              foreach($r in @((Get-Content $digerPlan -Raw -Encoding UTF8 | ConvertFrom-Json))){ if("$($r.etiket)"){ $atla+="$($r.etiket)" } }
            }
          }catch{ "cakisma kapisi okunamadi: $($_.Exception.Message) (atlama yok)" }
          $env:MEVZUAT_ATLA_ETIKET=(@($atla | Sort-Object -Unique) -join ',')
          "cakisma kapisi: koşan islerden $(@($atla | Sort-Object -Unique).Count) etiket bu kosuda atlanir"
          if("$env:MEVZUAT_TOPLU_PARCA" -match '^\d+$'){ "TOPLU PARCA BOYU: $env:MEVZUAT_TOPLU_PARCA (girdiden)" }
          else { "TOPLU PARCA BOYU: kod varsayilani (30)" }
          ./motor/kalip-kosucu.ps1 -Plan "${{ inputs.plan }}" -Paralel ${{ inputs.paralel }}

      - name: Sonucu ambara yaz (KOSU DUSSE BILE)
        if: always()
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # ⛔ if: always() — uretim yarida kalsa bile ODENEN IS yazilir.
          # 13.09: sinav etiketi plandan (PLAN_SINAVI ilk adimda yazildi). Bos kalirsa eski varsayilan SGS.
          $ps = "$env:PLAN_SINAVI".Trim(); if(-not $ps){ $ps = 'SGS' }
          # 17.09: EN ONCE toplu parti kaydi (kucuk, kritik): adim yarida kesilse bile sonraki halka odenmis partileri hasat eder.
          # Ambar yavasken (17.09 00:45 504 goruldu) hata parti yuklemesini DURDURMAZ; sonda bir kez daha denenir.
          $bekleyenTamam=$false
          try{ ./arac/bekleyen-senkron.ps1 -Yukle; $bekleyenTamam=$true }catch{ "bekleyen kaydi ilk deneme dustu: $($_.Exception.Message) (sonda yeniden)" }
          # 13.09: yalniz bu kosuda DEGISEN ya da YENI olusan parti yuklenir (indirmedeki parmak izine gore).
          # Iz dosyasi yoksa (indirme adimi hic kosmadiysa) eski davranis: sinavin butun yerel partileri.
          $izYol = Join-Path $env:RUNNER_TEMP 'parti-onizi.json'
          if(Test-Path $izYol){
            $onIz = @{}; $izJ = Get-Content $izYol -Raw -Encoding UTF8 | ConvertFrom-Json
            foreach($p in $izJ.PSObject.Properties){ $onIz[$p.Name] = "$($p.Value)" }
            $degisen = @(foreach($f in @(Get-ChildItem veri/fabrika -Filter 'kalip-parti-*.json' -ErrorAction SilentlyContinue)){
              $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
              if(-not $onIz.ContainsKey($f.Name) -or $onIz[$f.Name] -ne $h){ $f.BaseName -replace '^kalip-parti-','' } })
            "degisen/yeni parti: $($degisen.Count) (indirilen: $($onIz.Count))"
            foreach($et in $degisen){ ./arac/parti-senkron.ps1 -Yukle -Yaz -Sinav $ps -Etiket $et }
          } else {
            "parmak izi yok - eski davranis: butun yerel partiler"
            ./arac/parti-senkron.ps1 -Yukle -Yaz -Sinav $ps
          }
          try{ ./arac/bedel-senkron.ps1 -Yukle -Yaz }catch{ "bedel defteri yuklenemedi: $($_.Exception.Message)" }
          # 16.09: bu koşuda gonderilen toplu parti kimlikleri ambara (sonraki halka bunlari hasat eder / bekler).
          # 17.09: basta yazilmis olsa da tekrar (birlestirme, zarar yok); 3 deneme, artan bekleme.
          foreach($deneme in 1..3){ try{ ./arac/bekleyen-senkron.ps1 -Yukle; $bekleyenTamam=$true; break }catch{ "bekleyen kaydi deneme $deneme dustu: $($_.Exception.Message)"; Start-Sleep -Seconds (20*$deneme) } }
          if(-not $bekleyenTamam){ throw "BEKLEYEN TOPLU KAYDI AMBARA YAZILAMADI - sonraki halka odenmis partileri goremez" }

      # 16.09 Cem "basilan bitirme sorulari dogrudan kilitli kasaya gitsin" (GM onerisi 1): SMMM plani bitince (halka yarim
      # kalsa da) yayin sartindan + ret kutugunden + ikiz suzgecinden gecen bitirme sorulari paket_soru'ya (sinav=smmm) yazilir.
      # Sayfa runner'da sql-yerel/ altinda kurulur ve silinir; depoya/artifact'a icerik GITMEZ; ekrana yalniz sayi basilir.
      # Idempotent: ayni soru yeniden yazilir (upsert), yayindan dusen soru kasadan silinir. SGS planinda bu adim KOSMAZ.
      - name: Bitirme sorularini kilitli kasaya yaz (yalniz SMMM plani)
        if: always() && !cancelled() && env.PLAN_SINAVI == 'SMMM'
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $ErrorActionPreference = 'Continue'   # alt surecin stderr satiri adimi dusurmesin; cikis kodu asagida okunur
          & powershell -NoProfile -File ./arac/smmm-kasa-yayin.ps1 -Yaz
          $kod = $LASTEXITCODE
          "kasa yayini cikis kodu: $kod"
          if($kod){ "::error::bitirme kasa yayini dustu ($kod) - sorular ambarda duruyor, adim elle yeniden kosulabilir: powershell -File arac/smmm-kasa-yayin.ps1 -Yaz"; exit $kod }

      - name: Toplu kuyruk bitmediyse ayni plani yeniden tetikle
        if: always() && !cancelled()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Uretici bekleme dolunca "TOPLU ANLIKSIZ" yazip 75 ile cikar. Boyle bir satir varsa is bitmemistir.
          # 17.09 OLCULDU: kredi bitince partiler KAPI-BAKIYE ile dustu, bu adim yalniz 'TOPLU ANLIKSIZ' aradigi icin "plan tamamlandi"
          # dedi ve is YESIL bitti (~1.800 soru yarim). Kosucu artik bakiye-bitti.log / hata-cikan.log yazar; ikisi de YARIM sayilir.
          $bakiye = @(Get-ChildItem veri/fabrika/kosucu-log -Recurse -File -Filter 'bakiye-bitti.log' -ErrorAction SilentlyContinue | Select-String -Pattern 'YARIM')
          $hatali = @(Get-ChildItem veri/fabrika/kosucu-log -Recurse -File -Filter 'hata-cikan.log' -ErrorAction SilentlyContinue | Select-String -Pattern 'YARIM')
          if($bakiye.Count){
            "::error::ANTHROPIC BAKIYESI BITTI - plan YARIM kaldi ($($bakiye.Count) parti). Zincir yeniden tetiklenmedi (kredisiz halka bos doner). Kredi yuklenince ayni plani elle baslat: gh workflow run bulut-uretim.yml -f plan=${{ inputs.plan }} -f paralel=${{ inputs.paralel }}"
            exit 1
          }
          $yarim = @(Get-ChildItem veri/fabrika/kosucu-log -Recurse -File -ErrorAction SilentlyContinue | Select-String -Pattern 'TOPLU ANLIKSIZ' -List)
          "yarim kalan parti gunlugu: $($yarim.Count) · hatayla biten parti: $($hatali.Count)"
          if(-not $yarim.Count){
            if($hatali.Count){ "::error::$($hatali.Count) parti hata koduyla bitti - plan TAMAMLANMADI, elle bakilmali (yeniden tetiklenmedi)"; exit 1 }
            "plan tamamlandi - yeniden tetikleme yok"; exit 0
          }
          $halka = 0; [void][int]::TryParse("${{ inputs.zincir }}", [ref]$halka)
          if($halka -ge 10){ "ZINCIR TAVANI (10) - yeniden tetiklenmedi. Elle bakilmali."; exit 1 }
          $sonraki = $halka + 1
          gh workflow run bulut-uretim.yml --ref main -f plan="${{ inputs.plan }}" -f paralel="${{ inputs.paralel }}" -f indir_parti=true -f toplu_parca="${{ inputs.toplu_parca }}" -f zincir="$sonraki"
          "yeniden tetiklendi: halka $sonraki (ayni plan; concurrency grubu bu is bitince baslatir)"
          if($hatali.Count){ "::error::$($hatali.Count) parti hata koduyla bitti - zincir surdu ama bu halka KIRMIZI"; exit 1 }

