# .github/workflows/site-yayin.yml — SİTE YAYINI (BEYAZ LİSTE) — 08.10.2026
#
# NEDEN: tetikte.com "Deploy from branch" ile deponun KÖKÜNDEN yayınlanıyordu; deponun tamamı herkese açıktı
# (/CLAUDE.md, /motor/*.ps1, /radar-app/sql/*, /veri/*.md, motor/cikti/ 354 HTML — 08.10 ölçüldü).
# Bu akış yayına YALNIZ arac/site-beyaz-liste.txt'e uyan dosyaları koyar (arac/site-yayin.js).
#
# NE ZAMAN KOŞAR
#   - elle push (push tetiği)
#   - ana tele iten HER robot akışı bittiğinde (workflow_run). Robotlar GITHUB_TOKEN ile itiyor ve bu itmeler
#     "push" tetiğini ÇALIŞTIRMAZ; liste dogrula.yml'de denetlenir (TETIK), --tetik-yaz ile yeniden üretilir.
#   - her 30 dakikada bir yedek koşu (workflow_run kaçarsa)
#   - elle (workflow_dispatch) — "zorla: true" son yayın aynı olsa da yeniden dağıtır
#
# DAĞITIM YALNIZ Pages kaynağı "GitHub Actions" iken yapılır (API: build_type == workflow). Kaynak hâlâ
# "Deploy from branch" ise akış yalnız yayın klasörünü kurar + denetler; siteye dokunmaz.
# Geçiş ve geri dönüş: SITE-YAYIN-GECIS.md (depo kökü; kendisi yayına çıkmaz)
#
# DURDURAN: YASAK (iç dosya yayına girdi) · ZORUNLU (index/404/CNAME/robots/harita/canlı tarama sayfası yok).
# DURDURMAYAN (uyarı): KOPUK (sayfanın andığı dosya listede yok) · TETIK (yeni iten robot listede yok) —
#   bunlar dogrula.yml'de KIRMIZI düşer; bir kopuk başvuru yüzünden bütün robot verisinin siteye çıkması durmasın.
# 🚫 GÖRMEZ: sayfanın çalışıp çalışmadığı (canli-tarama.yml) · dizgeyle kurulan yollar (arac/site-esdegerlik.js).
name: Site Yayini (beyaz liste)

