      # <<< TETIK LISTESI
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      zorla:
        description: "Son yayin ayni olsa da yeniden dagit"
        type: boolean
        default: false

permissions:
  contents: read

# Tek yayın kuyruğu: koşan dağıtım yarıda kesilmez, en yeni bekleyen koşu sonra gelir.
concurrency:
  group: site-yayin
  cancel-in-progress: false

jobs:
  kur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read          # Pages kaynağı (build_type) okunur
      deployments: read    # son dağıtılan commit okunur
    outputs:
      dagit: ${{ steps.karar.outputs.dagit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # workflow_run/schedule'da da ana telin EN SON hâli
          fetch-depth: 1

      - name: Dagitim karari
        id: karar
        env:
          GH_TOKEN: ${{ github.token }}
          OLAY: ${{ github.event_name }}
          ZORLA: ${{ inputs.zorla }}
        run: |
          R="${{ github.repository }}"
          BAS=$(git rev-parse HEAD)
          TUR=$(gh api "repos/$R/pages" --jq .build_type 2>/dev/null || echo okunamadi)
          echo "Pages kaynagi: $TUR · ana tel: $BAS"
          if [ "$TUR" != "workflow" ]; then
            echo "dagit=hayir" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages kaynagi '$TUR' (GitHub Actions degil) - yalniz kur + denetim, siteye dokunulmadi."
            exit 0
          fi
          # Son BASARILI dagitim (yarida kalan/dusen dagitim "yayinda" sayilmaz)
          SON=""
          for SATIR in $(gh api "repos/$R/deployments?environment=github-pages&per_page=15" --jq '.[] | "\(.id):\(.sha)"' 2>/dev/null); do
            DURUM=$(gh api "repos/$R/deployments/${SATIR%%:*}/statuses?per_page=1" --jq '.[0].state' 2>/dev/null || echo "")
            if [ "$DURUM" = "success" ]; then SON="${SATIR#*:}"; break; fi
          done
          echo "Son dagitilan: ${SON:-yok}"
          if [ "$OLAY" = "workflow_dispatch" ] && [ "$ZORLA" = "true" ]; then echo "dagit=evet" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$SON" ] || [ "$OLAY" = "push" ]; then echo "dagit=evet" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$SON" = "$BAS" ]; then echo "dagit=hayir" >> "$GITHUB_OUTPUT"; echo "Ana tel zaten yayinda."; exit 0; fi
          # Aradaki degisiklik site dosyasina dokunuyor mu? (karsilastirma 300 dosyayi asarsa: dagit)
          gh api "repos/$R/compare/$SON...$BAS" --jq '.files | length, (.[].filename)' > "$RUNNER_TEMP/fark.txt" 2>/dev/null || echo "300" > "$RUNNER_TEMP/fark.txt"
          N=$(head -1 "$RUNNER_TEMP/fark.txt")
          SITE=$(tail -n +2 "$RUNNER_TEMP/fark.txt" | node arac/site-yayin.js --eslesir | wc -l)
          AYAR=$(tail -n +2 "$RUNNER_TEMP/fark.txt" | grep -c -E '^arac/site-(beyaz-liste\.txt|yayin\.js)$' || true)
          echo "Degisen $N dosya · site dosyasi $SITE · yayin ayari $AYAR"
          if [ "$N" -ge 300 ] || [ "$SITE" -gt 0 ] || [ "$AYAR" -gt 0 ]; then echo "dagit=evet" >> "$GITHUB_OUTPUT"; else echo "dagit=hayir" >> "$GITHUB_OUTPUT"; fi

      - name: Yayin klasorunu kur + denetle
        run: node arac/site-yayin.js --kur _site --denetim --tetik --uyari KOPUK,TETIK

      - name: Yayin paketini yukle
        if: steps.karar.outputs.dagit == 'evet'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  dagit:
    needs: kur
    if: needs.kur.outputs.dagit == 'evet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - name: GitHub Pages'e dagit
        id: dagitim
        uses: actions/deploy-pages@v4
