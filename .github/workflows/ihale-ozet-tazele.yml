# ============================================================================
#  İHALE ÖZETLERİNİ TAZELE — özet betiği değişince çıktı da değişsin
#
#  NEDEN VAR (30.08.2026): O gün motor/ihale-firma-ozet.ps1 ve
#  ihale-idare-ozet.ps1'deki anahtar üretimi düzeltildi (kültüre bağlı
#  .ToUpper() + -replace'in "I" harfini silmesi). Ama çıktı dosyaları
#  ESKİ, bozuk anahtarlarla üretilmiş hâlde kaldı ve onları tazeleyecek
#  hiçbir tetik yoktu:
#    · ihale-yutma.yml       -> yalnız workflow_dispatch (elle), 6 şeritli
#                               saatlerce süren backfill; özet için ağır
#    · ihale-gunluk-tamlik   -> günlük ama önce bülten indirmeye girişir
#  Yani "betiği düzelttim" ile "veri düzeldi" arasında köprü yoktu.
#
#  BU AKIŞ SADECE ÖZET ÜRETİR: kasadan okur, üç özeti yeniden hesaplar,
#  değişmişse depoya yazar. PDF indirme YOK, model çağrısı YOK, maliyet 0.
#
#  push tetikleyicisi bilerek dar: yalnız özet betikleri ya da bu akış
#  değişince koşar. Böylece bir daha "betik düzeldi ama veri eski kaldı"
#  durumu oluşmaz.
#
#  Sonunda firma adı denetimi de koşar (arac/ihale-firma-adi-denetimi.ps1):
#  yeni özette "özel adı kayıp yüklenici" sayısı ARTMIŞSA akış kırmızı
#  biter - ayrıştırıcı ya da anahtar üretimi bozulmuş demektir.
# ============================================================================
name: Ihale ozetlerini tazele

on:
  push:
    paths:
      - 'motor/ihale-firma-ozet.ps1'
      - 'motor/ihale-idare-ozet.ps1'
      - 'motor/ihale-sonuc-ozet.ps1'
      - '.github/workflows/ihale-ozet-tazele.yml'
  workflow_dispatch:

# Yutma koşarken kasadan aynı anda okumasın; sırayla çalışsınlar.
concurrency:
  group: ihale-yutma
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tazele:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ozetleri yeniden uret (kasadan okur, PDF indirmez)
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ./motor/ihale-sonuc-ozet.ps1 -Yaz
          ./motor/ihale-firma-ozet.ps1 -Yaz
          ./motor/ihale-idare-ozet.ps1 -Yaz

      - name: Firma adi denetimi (ozel adi kayip yuklenici artti mi)
        shell: pwsh
        continue-on-error: true   # rapor her halukarda yazilsin; sonuc asagida
        run: ./arac/ihale-firma-adi-denetimi.ps1

      # 30.08: denetim IKN'leri OZETTEN okuyor ve ozet IhaleTavan(10) ile
      # kirpiyor - "Ticaret Limited Sirketi" 295 ilana sahipken elde 10 IKN
      # kaliyordu. Olculdu: ozetten 249, kasadan 1.380 ilan (6 KAT fark).
      # Bu adim HAM KASADAN tam listeyi cikarir; onarim turunun girdisi odur.
      - name: Kesik firma adlarinin TAM IKN listesi (kasadan, tavansiz)
        shell: pwsh
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./arac/ihale-kesik-ikn-cikar.ps1

      # 30.08 TESHIS ADIMI: "Depoya yaz" uc kez ust uste dustu ve sebebi
      # gorulemedi (Actions gunlugunu okumak depo yoneticisi yetkisi ister;
      # tahminle uc duzeltme denendi, ucu de tutmadi). Tahmin etmeyi birakip
      # OLCUM kondu: once KUCUK bir kutuk dosyasi yazilip itilir.
      #   bu adim GECERSE  -> push yetkisi ve hat saglam; sorun ozet
      #                       dosyalarinda (boyut ya da cakisma)
      #   bu adim DUSERSE  -> sorun push'un kendisinde
      # Kutuk her kosuda uzerine yazilir, depoyu sismez.
      - name: TESHIS - kucuk kutuk dosyasini it
        continue-on-error: true
        run: |
          git config user.name  "tetikte-robot"
          git config user.email "robot@tetikte.com"
          mkdir -p veri
          {
            echo "son kosu : $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo "kosu no  : ${{ github.run_number }}"
            echo "--- uretilen ozet dosyalari ---"
            for f in veri/ihale-sonuc-ozet.json veri/ihale-firma-ozet.json veri/ihale-idare-ozet.json; do
              if [ -f "$f" ]; then echo "$f  $(wc -c < "$f") bayt"; else echo "$f  YOK"; fi
            done
            echo "--- calisma agaci ---"
            git status --short | head -20
          } > veri/ihale-ozet-tazele-log.txt
          git add veri/ihale-ozet-tazele-log.txt
          if git diff --staged --quiet; then
            echo "kutuk degismedi"
          else
            git commit -m "Ozet tazeleme kutugu [veri-operasyonu]"
            for d in 1 2 3; do
              git pull --rebase --autostash origin main && git push && { echo "KUTUK ITILDI"; break; }
              echo "kutuk denemesi $d dustu"; sleep 4
            done
          fi

      - name: Depoya yaz
        run: |
          git config user.name  "tetikte-robot"
          git config user.email "robot@tetikte.com"
          # 30.08: .gitattributes'teki "merge=tetikte-robot" kurali driver
          # git config'de TANIMLI DEGILSE sessizce yok sayilir - yerelde
          # motor/oturum.ps1 kuruyor ama CI'da kimse kurmuyordu. Ozet
          # dosyalari buyuk ve robotlar sik yaziyor; rebase cakisirsa pull
          # duser, 5 deneme de duser ve adim KIRMIZI olur. Driver burada
          # kuruluyor: cakisma cikmaz, yerel surum kalir, bir sonraki kosu
          # zaten yeniden uretir.
          git config merge.tetikte-robot.name "Tetikte robot ciktisi"
          git config merge.tetikte-robot.driver true
          # 30.08: ilk surumde dosyalar TEK "git add" cagrisinda ve "\" satir
          # devamiyla veriliyordu; adim dustu ve ozetler depoya girmedi.
          # Artik her dosya AYRI eklenir - biri yoksa digerleri yine eklenir -
          # ve ne oldugu gunluge yazilir (kor kalma kurali: adim dustugunde
          # "neden" gorunmeliydi, gorunmuyordu).
          for f in veri/ihale-sonuc-ozet.json veri/ihale-firma-ozet.json veri/ihale-idare-ozet.json veri/ihale-kesik-firma-adi.json veri/ihale-kesik-ikn.json; do
            if [ -f "$f" ]; then git add "$f" && echo "eklendi: $f"; else echo "YOK (atlandi): $f"; fi
          done
          echo "--- staged ---"; git diff --staged --name-only
          if git diff --staged --quiet; then
            echo "ozetler degismedi"
          else
            git commit -m "Ihale ozetleri tazelendi (duzeltilmis anahtar) [veri-operasyonu]"
            basarili=0
            for deneme in 1 2 3 4 5; do
              # Neden dustugu GORUNSUN: pull ve push ciktilari gunluge basilir.
              # Ilk surumde adim sessizce kirmizi bitiyordu ve sebep
              # anlasilamiyordu (log yetkisi olmayan sebebi goremez).
              if git pull --rebase --autostash origin main 2>&1; then
                if git push 2>&1; then basarili=1; break; fi
                echo "PUSH reddedildi (deneme $deneme)"
              else
                echo "PULL/REBASE dustu (deneme $deneme)"
                git rebase --abort 2>/dev/null || true
              fi
              sleep 5
            done
            if [ "$basarili" != "1" ]; then
              echo "--- 5 denemede de yayinlanamadi ---"
              git status --short | head -20
              exit 1
            fi
          fi
