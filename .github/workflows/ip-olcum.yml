# ============================================================================
#  IP ÖLÇÜMÜ — "kaynak siteler GitHub sunucusundan iniyor mu?"
#
#  NEDEN VAR (Cem 30.08): "bilgisayarım açık olmasa da çalışsın, tatile gitsem
#  olmayacak mı?" Günlük indirme işi Cem'in dizüstünde koşuyor ve TEK sebebi
#  şu kayıt: 05.08.2026'da mevzuat.gov.tr GitHub runner IP'lerini ENGELLİYORDU
#  (runner'dan 6/6 başarısız, aynı adresler Cem'in makinesinden 6/6 HTTP 200).
#
#  AMA O KANIT ESKİDİ. Siteler değişir. Bu akış tek soruyu ölçer:
#  BUGÜN runner'dan iniyor mu? İniyorsa laptop bağımlılığı tamamen biter.
#
#  ÖLÇÜM DİSİPLİNİ: "HTTP 200 geldi" YETMEZ. Bu depoda ölçüldü - mevzuat.gov.tr
#  ölü adrese 200 + HTML döndürüyor ("yumuşak 404"), SPK portalı bilinmeyen
#  /api/ yoluna 200 + SPA kabuğu veriyor. Bu yüzden her hedefte ÜÇ şey birden
#  bakılır: HTTP kodu · içerik tipi · gerçek imza (%PDF / JSON / HTML).
#
#  Sonuç depoya yazılır (veri/ip-olcum-raporu.md) - Actions logu admin kilitli.
# ============================================================================
name: IP olcumu (kaynak siteler runner'dan iniyor mu)

on:
  # 30.08 — TEK KOSU KARAR VERDIRMEZ. Raporun kendi uyarisi: bir site gecici
  # engel/oran siniri uyguluyor olabilir. Bu yuzden olcum GUNUN FARKLI
  # SAATLERINDE tekrarlanir ve sonuclar UST USTE BIRIKIR (gecmis tablosu).
  # Sunucu kiralama karari tek kosuya degil, birkac kosunun ortak sonucuna
  # dayanmali.
  schedule:
    - cron: '30 5 * * *'    # 08:30 TR
    - cron: '30 17 * * *'   # 20:30 TR
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ip-olcum.yml'

permissions:
  contents: write

jobs:
  olc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HEDEFLERI OLC
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          R=veri/ip-olcum-raporu.md
          BLOK=/tmp/ip-blok.md
          IP=$(curl -s -m 20 https://api.ipify.org || echo "?")
          {
            echo "## Koşu $(date -u '+%Y-%m-%d %H:%M') UTC · çıkış IP \`$IP\`"
            echo ""
            echo "| # | Hedef | HTTP | İçerik tipi | Bayt | İmza | Sonuç |"
            echo "|---|---|---|---|---:|---|---|"
          } > $BLOK
          R=$BLOK

          # ad|url|beklenen_imza(PDF|JSON|HTML)
          # NOT: burada HEREDOC KULLANILMAZ. Ilk denemede kullandim ve akis
          # HIC KOSMADI: heredoc govdesi 0. sutundan basliyor, bu da YAML'in
          # "|" blok girintisini kiriyor -> workflow ayristirilamiyor, is bile
          # olusmuyor (API'de jobs listesi BOS, ad yerine dosya yolu gorunuyor).
          # Dizi kullanmak girintiyi korur.
          HEDEFLER=(
            "mevzuat.gov.tr GeneratePdf (Teblig III-39.1)|https://www.mevzuat.gov.tr/File/GeneratePdf?mevzuatNo=19131&mevzuatTur=Teblig&mevzuatTertip=5|PDF"
            "mevzuat.gov.tr MevzuatMetin (SPKn 6362)|https://www.mevzuat.gov.tr/MevzuatMetin/1.5.6362.pdf|PDF"
            "resmigazete.gov.tr ana sayfa|https://www.resmigazete.gov.tr|HTML"
            "resmigazete.gov.tr fihrist (gunluk tarama kaynagi)|https://www.resmigazete.gov.tr/fihrist?tarih=2026-08-29&mukerrer=0|HTML"
            "ekap.kik.gov.tr bulten indirme (IHALE kaynagi)|https://ekap.kik.gov.tr/ekap/ilan/bultenindirme.aspx|HTML"
            "api.ted.europa.eu arama (yurtdisi ihale)|https://api.ted.europa.eu/v3/notices/search|JSON"
            "mevzuat.spk.gov.tr API (Search/All)|https://mevzuat.spk.gov.tr/api/Search/All|JSON"
            "mevzuat.spk.gov.tr belge (Teblig III-52.1)|https://mevzuat.spk.gov.tr/api/mevzuat/File/167|PDF"
            "spl.com.tr calisma notu sayfasi|https://spl.com.tr/sinav-calisma-notlari/|HTML"
            "spl.com.tr calisma notu PDF (1001)|https://spl.com.tr/wp-content/uploads/2026/07/1001_MKT_300062026_202607140951.pdf|PDF"
            "tspb.org.tr Meslek Kurallari PDF|https://tspb.org.tr/wp-content/uploads/2025/06/TSPB_Meslek-Kurallari-Duzenlemesi.pdf|PDF"
            "spk.gov.tr dosya arama|https://spk.gov.tr/Web/DosyaAra?page=1&text=s%C4%B1nav|HTML"
            "kgk.gov.tr standart PDF (TFRS 10, Kirmizi Kitap)|https://kgk.gov.tr/Portalv2Uploads/files/Duyurular/v2/TMS_TFRS_Setleri/2026/Kirmizi_Kitap/TFRS/TFRS%2010.pdf|PDF"
            "kgk.gov.tr denetim standardi (BDS 200)|https://kgk.gov.tr/Portalv2Uploads/files/Duyurular/v2/TDS/TDS_2025_Seti/BDS%20200_2025.pdf|PDF"
            # --- 30.08: VPS KARARI ICIN EKLENDI --------------------------------
            # Soru: 94,99 TL/ay sunucu SADECE mevzuat.gov.tr icin kiralanacak.
            # Once sunu olcelim: (a) domainin TAMAMI mi engelli yoksa yalniz
            # dosya uclari mi, (b) TLS'siz iniyor mu, (c) ayni icerik BASKA
            # kaynaktan alinabiliyor mu.
            # YEREL OLCUM (Cem'in makinesi, TR IP - hepsi 200):
            #   www5.tbmm.gov.tr/kanunlar/k6362.html  ->  64.046 bayt
            #   mevzuat.gov.tr 1.5.6362.pdf           -> 1.482.842 bayt
            # TBMM metninde "(Değişik", "(Ek:", "(Mülga" isareti SIFIR - yani
            # kanun KABUL EDILDIGI HALIYLE duruyor, sonraki degisiklikler
            # islenmemis. mevzuat.gov.tr'nin degeri KONSOLIDE metin olmasi.
            # Bu yuzden TBMM YEDEK DEGIL; asagida yine de olculuyor ki
            # "denemedik" denmesin.
            "mevzuat.gov.tr ana sayfa (domainin TAMAMI mi engelli)|https://www.mevzuat.gov.tr|HTML"
            "mevzuat.gov.tr TLS'siz (http)|http://www.mevzuat.gov.tr|HTML"
            "TBMM kanun metni (OZGUN hal - konsolide DEGIL)|https://www5.tbmm.gov.tr/kanunlar/k6362.html|HTML"
            "resmigazete arsiv sayfasi (ozgun yayim)|https://www.resmigazete.gov.tr/eskiler/2012/12/20121230-1.htm|HTML"
            "gib.gov.tr mevzuat (vergi tarafi)|https://www.gib.gov.tr/gibmevzuat|HTML"
            "mevzuat.adalet.gov.tr|https://mevzuat.adalet.gov.tr|HTML"
          )
          i=0
          for satir in "${HEDEFLER[@]}"; do
            IFS='|' read -r ad url bek <<< "$satir"
            [ -z "$ad" ] && continue
            i=$((i+1))
            out=$(curl -s -m 45 -L -A "$UA" -H "Referer: https://www.mevzuat.gov.tr/" \
                  -o /tmp/h.bin -w "%{http_code}|%{content_type}|%{size_download}" "$url" || echo "000||0")
            kod=$(echo "$out" | cut -d'|' -f1)
            tip=$(echo "$out" | cut -d'|' -f2 | cut -d';' -f1)
            boy=$(echo "$out" | cut -d'|' -f3)
            imza="?"
            if head -c 4 /tmp/h.bin 2>/dev/null | grep -q '%PDF'; then imza="PDF"
            elif head -c 1 /tmp/h.bin 2>/dev/null | grep -qE '\[|\{'; then imza="JSON"
            elif head -c 400 /tmp/h.bin 2>/dev/null | grep -qi '<html\|<!doctype'; then imza="HTML"
            else imza="bilinmiyor"; fi
            # 30.08: TEK BIR "INMEDI" YETMIYOR. "Baglanti hic kurulmadi" (IP engeli)
            # ile "erisim var ama bu adres GET/imza beklentisine uymadi" (or. POST
            # isteyen API) BAMBASKA seylerdir - ilki sunucu kiralamayi gerektirir,
            # ikincisi sadece istegin duzeltilmesini. Ayni satira yazmak yanlis
            # karar verdirir.
            if [ "$kod" = "200" ] && [ "$imza" = "$bek" ] && [ "$boy" -gt 500 ]; then sonuc="✅ İNDİ"
            elif [ "$kod" = "000" ]; then sonuc="❌ ENGEL — bağlantı kurulamadı"
            else sonuc="⚠️ ERİŞİM VAR — kod $kod, imza $imza (istek düzeltilmeli)"; fi
            echo "| $i | $ad | $kod | $tip | $boy | $imza (beklenen $bek) | $sonuc |" >> $R
            echo "[$sonuc] $ad -> kod=$kod tip=$tip boyut=$boy imza=$imza"
            sleep 2
          done

          # --- POST HEDEFLERI ------------------------------------------------
          # 30.08 DERSI - YANLIS OLCUM YANLIS KARAR VERDIRDI: ilan.gov.tr ve TED
          # once GET ile olculdu; ilan.gov.tr "000" (ENGEL), TED "405" dondu ve
          # rapor "bu kaynaklar buluttan inmiyor, TR-IP'li sunucu gerekir" dedi.
          # YANLISTI. Ikisi de POST API'dir. Kanit git kutugunde: iki ardisik CI
          # kosusunun urettigi veri/ihale-yurtici.json arasinda 18 ilan degismis -
          # yani ilan.gov.tr GitHub runner'indan CALISIYOR.
          # KURAL: bir kaynagi, uretimde KULLANILAN yontemle olc. GET ile olculup
          # "engelli" denen kaynak, POST ile calisiyor olabilir.
          # ad|url|govde|user-agent|timeout  -> UA ve sure de URETIMDEKI ile AYNI olmali.
          # 30.08 ikinci ders: POST'a cevirmek yetmedi, ilan.gov.tr yine 000 dedi.
          # Sebep sure: uretimdeki betik -TimeoutSec 90 kullaniyor, olcum 45'te
          # kesiyordu. Site runner'dan YAVAS cevap veriyor; 45 sn'de "engel",
          # 90 sn'de "iniyor" gorunuyor. Yani "engel" hukmu ayar farkindan
          # doguyordu. Kaynak dosyasinin kendi damgasi da CI'yi dogruluyor:
          # veri/ihale-yurtici.json "Son cekim: 29.08.2026 17:44" - aksam kosusu.
          POST_HEDEF=(
            "ilan.gov.tr AdsByFilter (ALACAK+IHALE kaynagi)|https://www.ilan.gov.tr/api/api/services/app/Ad/AdsByFilter|{\"skipCount\":0,\"maxResultCount\":1}|Mozilla/5.0 (MevzuatRadar-IhaleRobotu)|120"
            "api.ted.europa.eu arama (yurtdisi ihale)|https://api.ted.europa.eu/v3/notices/search|{\"query\":\"classification-cpv IN (45000000)\",\"fields\":[\"publication-number\"],\"limit\":1,\"page\":1}|$UA|90"
          )
          for satir in "${POST_HEDEF[@]}"; do
            IFS='|' read -r ad url govde pua psure <<< "$satir"
            i=$((i+1))
            out=$(curl -s -m "$psure" -X POST -A "$pua" -H "Content-Type: application/json" -H "Accept: application/json" \
                  -d "$govde" -o /tmp/p.bin -w "%{http_code}|%{content_type}|%{size_download}" "$url" || echo "000||0")
            kod=$(echo "$out" | cut -d'|' -f1)
            tip=$(echo "$out" | cut -d'|' -f2 | cut -d';' -f1)
            boy=$(echo "$out" | cut -d'|' -f3)
            if head -c 1 /tmp/p.bin 2>/dev/null | grep -qE '\[|\{'; then imza="JSON"; else imza="bilinmiyor"; fi
            if [ "$kod" = "200" ] && [ "$imza" = "JSON" ]; then sonuc="✅ İNDİ (POST)"
            elif [ "$kod" = "000" ]; then sonuc="❌ ENGEL — bağlantı kurulamadı"
            else sonuc="⚠️ ERİŞİM VAR — kod $kod (gövde/parametre düzeltilmeli)"; fi
            echo "| $i | $ad | $kod | $tip | $boy | $imza (POST) | $sonuc |" >> $BLOK
            echo "[$sonuc] $ad -> kod=$kod tip=$tip boyut=$boy"
            sleep 2
          done

          echo "" >> $BLOK

          # --- BIRIKIMLI RAPOR: yeni kosu EN USTE, eskiler altta kalir --------
          # Tek kosu karar verdirmez; sunucu kiralama karari birkac kosunun
          # ortak sonucuna dayanmali. Bu yuzden eski bloklar SILINMEZ.
          HEDEF=veri/ip-olcum-raporu.md
          {
            echo "# IP ÖLÇÜMÜ — kaynak siteler runner'dan iniyor mu?"
            echo ""
            echo "> **Bu dosya BİRİKİMLİDİR** — her koşu en üste eklenir, eskiler silinmez."
            echo "> Soru: günlük indirme Cem'in dizüstünden çıkabilir mi?"
            echo "> Ölçüt: HTTP 200 YETMEZ — içerik tipi ve gerçek imza da doğrulanır"
            echo "> (bu depoda ölçüldü: ölü adres 200+HTML, bilinmeyen API yolu 200+SPA kabuğu döner)."
            echo ""
            echo "**Nasıl okunur:** hepsi ✅ → indirme CI'ya taşınır, laptop bağımlılığı biter ·"
            echo "yalnız mevzuat.gov.tr ❌ → sadece o site için TR-IP çözümü gerekir ·"
            echo "hepsi ❌ → TR-IP'li sunucu şart."
            echo ""
            echo "> ⚠️ **BİR SATIRA \"ENGEL\" DEMEDEN ÖNCE ÜRETİM ARACI SATIRINA BAK.**"
            echo "> 30.08'de ölçüldü: \`ilan.gov.tr\` curl ile üç koşuda da \`000\` (ENGEL) dedi —"
            echo "> POST'a çevrilince de, süre 120 sn'ye çıkarılınca da, üretimin User-Agent'ıyla da."
            echo "> **Aynı koşuda, aynı runner'dan, PowerShell/.NET ile 200 ve 81 kayıt indi.**"
            echo "> Yani \"engel\" hükmü sitenin değil, ÖLÇÜM ARACININ sonucuydu (TLS parmak izi)."
            echo "> Tabloda \`üretim aracı (pwsh/.NET)\` satırları bu yüzden var: curl satırıyla"
            echo "> çelişirlerse **doğru olan üretim aracı satırıdır** — üretim hattı onu kullanıyor."
            echo ">"
            echo "> Aynı sınav mevzuat.gov.tr'ye de uygulandı: o **iki araçla da inmedi**."
            echo "> Yani TR-IP ihtiyacı gerçek, ama **tek kaynağa** iniyor."
            echo ""
            cat $BLOK
            if [ -f "$HEDEF" ]; then
              sed -n '/^## Koşu/,$p' "$HEDEF" | head -400
            fi
          } > /tmp/ip-tam.md
          mv /tmp/ip-tam.md "$HEDEF"
          echo "--- BU KOSU ---"; cat $BLOK

      # ======================================================================
      #  ARAÇ DA YÖNTEMİN PARÇASI (30.08 üçüncü ders)
      #
      #  ilan.gov.tr curl ile 000 veriyor - POST'a çevirince de, süreyi 120'ye
      #  çıkarınca da, üretimin User-Agent'ıyla da. Buna karşılık üretim hattı
      #  ÇALIŞIYOR ve kanıtı somut: veri/ihale-yurtici.json'u mevzuat-radar-bot
      #  yazıyor, dosyanın kendi damgası "Son çekim: 29.08.2026 17:44" (akşam
      #  koşusunun içi) ve iki ardışık CI koşusu arasında 18 ilan değişmiş.
      #
      #  Geriye tek fark kalıyor: ARAÇ. Üretim PowerShell/.NET'in
      #  Invoke-RestMethod'unu kullanıyor, ölçüm curl'ü. Site büyük olasılıkla
      #  TLS parmak izine bakıyor - curl'ü eliyor, .NET'i geçiriyor.
      #
      #  Bu yüzden aynı hedef bir de üretimin aracıyla ölçülür. İki satır
      #  çelişirse doğru olan, üretimle aynı araç+yöntem+süre olanıdır.
      # ======================================================================
      - name: URETIM ARACIYLA OLC (PowerShell/.NET)
        if: always()
        shell: pwsh
        run: |
          $sonuc = @()
          # POST hedefleri
          $postHedef = @(
            @{ ad='ilan.gov.tr AdsByFilter'; url='https://www.ilan.gov.tr/api/api/services/app/Ad/AdsByFilter';
               govde='{"skipCount":0,"maxResultCount":1}'; ua='Mozilla/5.0 (MevzuatRadar-IhaleRobotu)' }
          )
          # GET hedefleri — mevzuat.gov.tr BURADA. curl ile 000 veriyor ve
          # 05.08'den beri "TR-IP'li sunucu şart" hükmünün TEK dayanağı o.
          # ilan.gov.tr aynı hükmü aldı ve üretim aracıyla ölçülünce ÇÖKTÜ.
          # Aynı sınav mevzuat.gov.tr'ye de uygulanır: eğer .NET ile iniyorsa
          # sunucu kiralamaya hiç gerek yok demektir.
          $getHedef = @(
            @{ ad='mevzuat.gov.tr GeneratePdf (Teblig III-39.1)'; bek='PDF';
               url='https://www.mevzuat.gov.tr/File/GeneratePdf?mevzuatNo=19131&mevzuatTur=Teblig&mevzuatTertip=5' },
            @{ ad='mevzuat.gov.tr MevzuatMetin (SPKn 6362)'; bek='PDF';
               url='https://www.mevzuat.gov.tr/MevzuatMetin/1.5.6362.pdf' },
            # 30.08 Cem: "biz bunu Resmî Gazete'den yapamıyor muyuz?"
            # RG hattı zaten buluttan besleniyor (veri/rg-nobeti.json'u bot her
            # gün yazıyor) ama curl ölçümünde 000 çıktı - ilan.gov.tr ile aynı
            # yanılgı. Üretim aracıyla ölçülmeden "RG de engelli" denemez.
            @{ ad='resmigazete.gov.tr ana sayfa'; bek='HTML';
               url='https://www.resmigazete.gov.tr' },
            @{ ad='resmigazete.gov.tr fihrist (gunluk taramanin kaynagi)'; bek='HTML';
               url='https://www.resmigazete.gov.tr/fihrist?tarih=2026-08-29&mukerrer=0' }
          )
          $TARAYICI_UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'

          foreach($h in $postHedef){
            try {
              $y = Invoke-RestMethod -Method Post -Uri $h.url `
                    -Headers @{ "Accept"="application/json"; "User-Agent"=$h.ua } `
                    -Body ([System.Text.Encoding]::UTF8.GetBytes($h.govde)) `
                    -ContentType "application/json" -TimeoutSec 90
              $n = 0
              foreach($p in $y.PSObject.Properties){ if($p.Value -is [array] -and $p.Value.Count -gt $n){ $n = $p.Value.Count } }
              if($y.result){ foreach($p in $y.result.PSObject.Properties){ if($p.Value -is [array] -and $p.Value.Count -gt $n){ $n = $p.Value.Count } } }
              $sonuc += "| — | $($h.ad) — **üretim aracı (pwsh/.NET)** | 200 | application/json | — | JSON (POST) | ✅ İNDİ ($n kayıt) |"
              Write-Host "[INDI] $($h.ad) -> $n kayit"
            } catch {
              $m = "$($_.Exception.Message)" -replace '\|','/'; if($m.Length -gt 90){ $m = $m.Substring(0,90) }
              $sonuc += "| — | $($h.ad) — **üretim aracı (pwsh/.NET)** | — | — | — | — | ❌ İNMEDİ ($m) |"
              Write-Host "[INMEDI] $($h.ad) -> $m"
            }
          }

          foreach($h in $getHedef){
            try {
              $w = Invoke-WebRequest -Uri $h.url -Headers @{ "User-Agent"=$TARAYICI_UA; "Referer"="https://www.mevzuat.gov.tr/" } `
                    -UseBasicParsing -TimeoutSec 90
              $bayt = if($w.RawContentLength){ $w.RawContentLength } else { $w.Content.Length }
              # "200 geldi" YETMEZ: mevzuat.gov.tr ölü adrese 200 + HTML döner.
              $imza = 'bilinmiyor'
              try {
                $ilk = $w.Content
                if($ilk -is [byte[]]){
                  $imza = if(($ilk[0] -eq 0x25) -and ($ilk[1] -eq 0x50)){ 'PDF' }
                          elseif(($ilk[0] -eq 0x3C)){ 'HTML' } else { 'bilinmiyor' }
                } elseif("$ilk".StartsWith('%PDF')){ $imza = 'PDF' }
                elseif("$ilk" -match '(?i)^\s*<(!doctype|html)'){ $imza = 'HTML' }
                else { $imza = 'bilinmiyor' }
              } catch {}
              $iyi = ($w.StatusCode -eq 200 -and $imza -eq $h.bek -and $bayt -gt 500)
              $isaret = if($iyi){ '✅ İNDİ' } else { "⚠️ $($w.StatusCode) ama imza $imza (beklenen $($h.bek))" }
              $sonuc += "| — | $($h.ad) — **üretim aracı (pwsh/.NET)** | $($w.StatusCode) | — | $bayt | $imza | $isaret |"
              Write-Host "[$isaret] $($h.ad) -> $bayt bayt, imza=$imza"
            } catch {
              $m = "$($_.Exception.Message)" -replace '\|','/'; if($m.Length -gt 90){ $m = $m.Substring(0,90) }
              $sonuc += "| — | $($h.ad) — **üretim aracı (pwsh/.NET)** | — | — | — | — | ❌ İNMEDİ ($m) |"
              Write-Host "[INMEDI] $($h.ad) -> $m"
            }
          }
          $hedef = 'veri/ip-olcum-raporu.md'
          $ic = Get-Content $hedef -Raw -Encoding UTF8
          # bu koşunun tablosunun sonuna ekle (ilk boş satırdan önce)
          $ek = ($sonuc -join "`n") + "`n"
          $ic = $ic -replace '(?s)(## Koşu[^\n]*\n\n\|[^\n]*\n\|[^\n]*\n(?:\|[^\n]*\n)+)', ('$1' + $ek)
          Set-Content $hedef -Value $ic -Encoding UTF8 -NoNewline

      - name: RAPORU DEPOYA BAS
        if: always()
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/ip-olcum-raporu.md || true
          if git diff --staged --quiet; then
            echo "rapor degismedi"
          else
            git commit -m "IP olcumu: kaynak siteler runner'dan iniyor mu [veri-operasyonu]" -- veri/ip-olcum-raporu.md
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
