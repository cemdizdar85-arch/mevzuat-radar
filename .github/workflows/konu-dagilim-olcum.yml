# Konu dagilim olcumu — 0 USD, API yok, yazma yok.
# Cem: "sinavda hangi konu fazla soruluyorsa ondan fazla soru sor dedik -
# hangi konularda yigilma var?" Kasadaki GERCEK dagilim, uretim-kotasi.json
# icindeki HEDEF (12 donem TESMER kitapcigindan olculmus) ile karsilastirilir.
name: Konu Dagilim Olcumu (0 USD)
on:
  push:
    paths: ['motor/konu-dagilim-olcum.ps1', '.github/workflows/konu-dagilim-olcum.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: konu-dagilim-olcum
  cancel-in-progress: false
jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/konu-dagilim-olcum.ps1
      - name: Commit (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/konu-dagilim-raporu.json ]; then echo "!! RAPOR YOK"; exit 1; fi
          git add veri/konu-dagilim-raporu.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Konu dagilim olcumu [veri-operasyonu]"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 7; done
          echo "!! PUSH TUTMADI"; exit 1
