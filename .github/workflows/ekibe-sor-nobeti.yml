# .github/workflows/ekibe-sor-nobeti.yml — "EKİBE SOR" NÖBETİ (10.10.2026, Cem "1.2.3 üçünü de yap")
#
# NEDEN: ilk "Ekibe sor" sorusunda (#1, 09.10) destek@ haberi de, öğrenciye cevap maili de GİTMEDİ. İkisi de tarayıcının
# isteğine bağlıydı (öğrencinin ateşle-unut ekip_haber isteği · yöneticinin panelden ekip_cevap isteği). Bu nöbet
# tarayıcıdan bağımsız: nobetci-sor fonksiyonunun 'ekip_nobet' işlemi (yalnız servis anahtarı) haberi gitmemiş
# bekleyen sorulara destek@ haberini, cevaplanıp maili gitmemiş sorulara üye mailini gönderir.
# Günlüğe yalnız SAYI basılır (kişi verisi, soru metni yok). Ücretli model çağrısı YOK (yalnız Resend maili).
# 🚫 GÖRMEZ: GitHub cron'u gecikebilir/atlanabilir (01.10 ölçümü: 29 saatte 6 koşu) — panel düğmesi ve tarayıcı yolu
#    duruyor, nöbet yalnız yedek · Resend "kabul etti" ≠ öğrencinin kutusuna düştü.
name: Ekibe Sor Nobeti

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ekibe-sor-nobeti
  cancel-in-progress: false

jobs:
  nobet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bekleyen haber ve cevapları gönder
        env:
          SK: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          sonuc=$(curl -sS -m 60 -X POST "https://bjrleanjpyujtajmazxn.supabase.co/functions/v1/nobetci-sor" \
            -H "Content-Type: application/json" -H "x-servis: $SK" -d '{"islem":"ekip_nobet"}')
          echo "sonuc: $sonuc"
          echo "$sonuc" | grep -q '"success":true' || { echo "::error::nöbet cevabı başarısız"; exit 1; }
          if echo "$sonuc" | grep -Eq '"(haber_hata|cevap_hata|adres_yok|tesekkur_hata)":[1-9]'; then echo "::error::gönderilemeyen var"; exit 1; fi

  # 10.10 (Cem "1.2.3" madde 3): panelde "Hatalı (öğrenci haklı)" işaretlenen soru → <sinav>-elle-ret.json → sınavın kasa yayını.
  # Önce yalnız SAYI sorulur; aktarılacak yoksa depo çekilmez (10 dakikada bir koşuyor). Damga push BAŞARILI olunca vurulur.
  hakli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Aktarılacak haklı itiraz var mı
        id: say
        env:
          SK: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          n=$(curl -sS -m 30 "https://bjrleanjpyujtajmazxn.supabase.co/rest/v1/ekibe_soru?select=id&itiraz_hakli=is.true&ret_aktarim=is.null" \
            -H "apikey: $SK" -H "Authorization: Bearer $SK" | jq 'length')
          echo "aktarılacak: $n"; echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.say.outputs.n != '0'
      - uses: actions/setup-node@v4
        if: steps.say.outputs.n != '0'
        with:
          node-version: "20"
      - name: Elle rete yaz, gönder, yayını tetikle, damgala
        if: steps.say.outputs.n != '0'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node arac/ekip-hakli-aktar.js --sinav
          node arac/ekip-hakli-aktar.js
          degisen=$(git diff --name-only -- veri/sinav/smmm-elle-ret.json veri/sinav/sgs-elle-ret.json veri/sinav/kgk-elle-ret.json)
          if [ -n "$degisen" ]; then
            git config user.name  "tetikte-robot"
            git config user.email "bildirim@tetikte.com"
            git add $degisen
            git commit -m "Ekibe sor: haklı itiraz elle rete işlendi [veri-operasyonu]"
            itildi=0
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then itildi=1; echo "itildi (deneme $i)"; break; fi
              git pull --rebase --autostash origin main || { git rebase --abort; echo "::error::elle ret birlestirilemedi"; exit 1; }
              sleep 5
            done
            [ "$itildi" = 1 ] || { echo "::error::push 5 denemede basarisiz"; exit 1; }
            echo "$degisen" | grep -q smmm- && gh workflow run smmm-kasa-yayin.yml && echo "smmm yayın tetiklendi" || true
            echo "$degisen" | grep -q sgs-  && gh workflow run yayin-bas.yml -f parti_indir=true && echo "sgs yayın tetiklendi" || true
            echo "$degisen" | grep -q kgk-  && gh workflow run kgk-kasa-yayin.yml && echo "kgk yayın tetiklendi" || true
          else
            echo "liste değişmedi (hepsi zaten listede ya da tanınmayan önek)"
          fi
          node arac/ekip-hakli-aktar.js --damga
