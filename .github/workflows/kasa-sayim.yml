# .github/workflows/kasa-sayim.yml — KASA SAYIMI
# GM yerelde ANON anahtarla calisir; soru_havuzu RLS ile kapali oldugu icin
# kasadaki soru sayisini OLCEMEZ. Bu is akisi SERVICE anahtariyla sayar ve
# sonucu veri/kasa-sayim.json olarak depoya yazar; GM oradan okur.
# UCRETSIZDIR: hicbir API cagrisi yok, yalniz Supabase okuma.
name: Kasa Sayimi

on:
  # 29.07 — CRON EKLENDI (Cem: "atladigim bir sey varsa hepsi otomatik").
  # Eski tetik yalniz elle/push idi; kasa sayimi gunlerce bayat kalabiliyordu
  # ve GM eski rakamla plan kuruyordu. PARA HARCAMAZ: yalniz Supabase okuma.
  schedule:
    - cron: "30 5 * * *"    # 08:30 TR — gunun taze sayimi
  workflow_dispatch:
  push:
    paths:
      - 'motor/kasa-sayim.ps1'
      - '.github/workflows/kasa-sayim.yml'

permissions:
  contents: write

concurrency:
  group: kasa-sayim
  cancel-in-progress: false

jobs:
  say:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kasayi say
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Yeni bir uretim hattinin ILK partisini hedefli okumak icin. Ders
          # basina 3 soruluk genel dokum "seviye dogru mu" sorusunu cevaplamaz.
          # Hat dogrulaninca bu iki satir bosaltilir ya da sonraki hatta cevrilir.
          PILOT_SINAV: SGS
          PILOT_DERS: Finansal Muhasebe
        run: ./motor/kasa-sayim.ps1
      - name: Raporu commit'le
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          # Bu listeye yazilmayan dosya SESSIZCE kaybolur: is akisi yesil biter,
          # dosya uretilir, hicbir yere gitmez. yeni-uretim-ornek.json bir kosu
          # boyunca tam boyle kayboldu.
          # 30.07 GUVENLIK: pilot-ornek.json + yeni-uretim-ornek.json +
          # kasa-ornek.json listeden CIKARILDI ve .gitignore'a alindi.
          # Ucu de kasadan (yayin suzgeci OLMADAN) tam soru metni tasiyordu -
          # depo PUBLIC. 745-soru dersinin devami: GM okumasi artik yerel
          # kosuyla yapilir (betik dosyalari hala uretir, yalnizca push edilmez).
          for f in veri/kasa-sayim.json veri/pilot-kuyrugu.json veri/kasa-log.txt veri/denetim-kuyrugu.json veri/koku-izli.json; do
            if [ -f "$f" ]; then git add "$f" || true; fi
          done
          git diff --cached --quiet || git commit -m "Kasa sayimi guncellendi [veri-operasyonu]"
          git push || true
