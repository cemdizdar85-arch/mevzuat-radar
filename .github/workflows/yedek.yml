# .github/workflows/yedek.yml — HAFTALIK KASA YEDEGI
# Supabase'deki kritik tablolari (dokumanlar, firmalar/leads vb.) JSON olarak
# ceker, SIFRELER ve GitHub Actions ARTIFACT kasasina koyar (90 gun saklanir).
# 08.09.2026 DUZELTME: eski not "artifact ozeldir" diyordu - YANLISTI. Public
# repoda artifact'i herkes indirir; bu yuzden dokum artik RSA-4096 acik anahtarla
# sifrelenir (asagida). API maliyeti sifir. Felaket gunu: son artifact indirilir,
# Cem'in ozel anahtariyla cozulur (motor/alacak-kasa-yedek-coz.ps1 yontemi), geri yuklenir.
name: Haftalik Yedek

on:
  schedule:
    - cron: "19 0 * * 6"      # cumartesi 03:19 TR
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yedek.yml"   # akis degisince bir kez kosar (sifreleme teyidi)

permissions:
  contents: read

jobs:
  yedek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase tablolarini dok
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $KEY = $env:SUPABASE_SERVICE_KEY
          if(-not $KEY){ Write-Host "SERVICE KEY yok - yedek atlandi."; exit 0 }
          # 08.09: Supabase, gizli anahtari TARAYICI benzeri User-Agent ile reddediyor
          # ("Forbidden use of secret API key in browser"); pwsh'in varsayilan UA'si
          # "Mozilla/5.0 ..." oldugu icin 8. kosuda her tablo sessizce 'atlandi' ve
          # 1.332 baytlik BOS yedek cikti. UA acikca verilir; sifir satirli dokum kapi.
          $H = @{ apikey=$KEY; Authorization="Bearer $KEY"; 'User-Agent'='MevzuatRadar-HaftalikYedek' }
          $SB = "https://bjrleanjpyujtajmazxn.supabase.co"
          New-Item -ItemType Directory -Force _yedek | Out-Null
          $toplamSatir = 0
          foreach($tablo in @('dokumanlar','firmalar','mukellefler','belgeler','leads','rate_log')){
            try {
              $tum = New-Object System.Collections.Generic.List[object]
              $ofset = 0
              while($true){
                $r = Invoke-RestMethod -Uri "$SB/rest/v1/${tablo}?select=*&limit=1000&offset=$ofset" -Headers $H -TimeoutSec 120
                if(-not $r -or @($r).Count -eq 0){ break }
                $tum.AddRange(@($r)); if(@($r).Count -lt 1000){ break }; $ofset += 1000
              }
              $tum.ToArray() | ConvertTo-Json -Depth 8 | Out-File "_yedek/$tablo.json" -Encoding utf8
              $toplamSatir += $tum.Count
              Write-Host ("{0}: {1} satir yedeklendi" -f $tablo, $tum.Count)
            } catch { Write-Host ("{0}: atlandi ({1})" -f $tablo, $_.Exception.Message) }
          }
          Write-Host ("TOPLAM: {0} satir" -f $toplamSatir)
          # KAPI: bos yedek "yedek var" sanilmasin (08.09 dersi)
          if ($toplamSatir -lt 1000) { throw ("YEDEK BOS/EKSIK: toplam {0} satir - kasaya erisim kirik olabilir" -f $toplamSatir) }
      # 08.09.2026 (Cem: "butun veriler kimsenin ulasamadigi yerde olacak"):
      # Ustteki "artifact ozeldir" HUKMU YANLISTI. GitHub belgesi: artifact'i
      # "read access" olan herkes indirir; PUBLIC repoda bu HERKESTIR. 7 kosu
      # (248 MB) firmalar/mukellefler/leads/belgeler dokumunu SIFRESIZ koymustu.
      # Artik dokum tek arsivde toplanir, AES-256 ile sifrelenir, AES anahtari
      # RSA-4096 ACIK anahtarla zarflanir (motor/anahtar/alacak-yedek.pub). Cozen
      # OZEL anahtar yalniz Cem'de (C:\TETIKTE-YEDEK\anahtar\alacak-yedek.key +
      # ikinci kopya). Cozme: motor/alacak-kasa-yedek-coz.ps1 ile ayni yontem
      # (once .k.enc zarfi, sonra .enc dosyasi; cikan .tgz acilir).
      - name: Sifrele (AES-256 arsiv + RSA-4096 anahtar zarfi)
        run: |
          set -e
          n=$(ls _yedek/*.json 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then echo "dokum yok - sifrelenecek bir sey yok"; exit 1; fi
          tar czf supabase-yedek.tgz -C _yedek .
          openssl rand -base64 32 > k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in supabase-yedek.tgz -out supabase-yedek.tgz.enc -pass file:k
          openssl pkeyutl -encrypt -pubin -inkey motor/anahtar/alacak-yedek.pub -in k -out supabase-yedek.tgz.k.enc
          rm -rf _yedek supabase-yedek.tgz k
          mkdir -p _sifreli && mv supabase-yedek.tgz.enc supabase-yedek.tgz.k.enc _sifreli/
          ls -la _sifreli
      - name: Artifact olarak sakla (SIFRELI, 90 gun)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-yedek-${{ github.run_number }}
          path: _sifreli/
          retention-days: 90
          if-no-files-found: error
