# .github/workflows/onarim-motoru.yml
# VARSAYILAN KURU KOSU = 0 USD. Motor kimin neyi eksik oldugunu sayar ve 10
# ornek istemi dosyaya yazar; hicbir API cagrisi YAPMAZ.
# Parali pilot yalniz veri/tetik/onarim-pilot.txt degistiginde ve SINIR ile
# kosar - kaza ile tam kasa kosmaz (Cem: "bir kez calistirip birakalim").
name: Onarim Motoru (varsayilan 0 USD)

on:
  push:
    paths:
      # 03.08: motor/yml push'lari ARTIK TETIKLEMIYOR. Sebep: her kod duzeltmesi
      # ~25 dakikalik bir KURU kosu baslatiyordu; Cem'in asil partisi onun
      # arkasinda kuyrukta bekliyor ve ona "cancel'a bas" dedirtiyorduk (uc kez
      # oldu). Kuru olcum gerektiginde workflow_dispatch ile elle kosulur.
      # Tetik dosyasi tek kapi: icinde BAS varsa parali, yoksa kuru.
      - 'veri/tetik/onarim-pilot.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onarim-motoru
  cancel-in-progress: false

jobs:
  kos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # tetik kapisi HEAD~1 karsilastirmasi yapiyor; sig checkout ile HEAD~1 YOKTUR

      - name: Tetigi denetle
        id: kapi
        run: |
          # KOR KALMA: eskiden "2>/dev/null" hatayi yutuyordu. Sig checkout'ta
          # HEAD~1 YOKTUR, komut duserdi ve kapi sessizce "pilot yok" derdi -
          # tetik dosyasi push'lanmis olsa bile. Artik ne gordugunu YAZIYOR.
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "!! HEAD~1 YOK (sig checkout) - tetik okunamadi, KURU kosuluyor."
            echo "pilot=hayir" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "--- bu push'ta degisen dosyalar ---"
          git diff --name-only HEAD~1 HEAD
          echo "-----------------------------------"
          # 03.08 - KAPI ICERIGE BAKAR OLDU. Eskiden yalnizca "dosya degisti mi"
          # diye bakiyordu; tetik dosyasina "BEKLEMEDE, kosma" yazmak bile kosuyu
          # BASLATIYORDU. Artik dosyanin ICINDE "BAS" gecmesi sart - yani parayi
          # harcatan sey bir DEGISIKLIK degil, acik bir IZINDIR.
          if ! git diff --name-only HEAD~1 HEAD | grep -q 'veri/tetik/onarim-pilot.txt'; then
            echo "pilot=hayir" >> $GITHUB_OUTPUT; echo "KURU KOSU - tetik dosyasi degismemis."; exit 0
          fi
          if grep -qE '(^|[^A-Za-z])BAS([^A-Za-z]|$)' veri/tetik/onarim-pilot.txt; then
            echo "pilot=evet" >> $GITHUB_OUTPUT; echo "PARALI PILOT (sinir 200) - dosyada acik izin var."
          else
            echo "pilot=hayir" >> $GITHUB_OUTPUT
            echo "KURU KOSU - tetik dosyasi degismis AMA icinde 'BAS' izni yok. Para harcanmaz."
          fi

      - name: Kuru kosu (0 USD)
        if: steps.kapi.outputs.pilot != 'evet'
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/onarim-motoru.ps1

      - name: PILOT 200 soru (PARALI)
        if: steps.kapi.outputs.pilot == 'evet'
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}   # 16.08 yedek hat: Anthropic limiti dolunca otomatik gecis
        run: ./motor/onarim-motoru.ps1 -uygula -sinir 200

      - name: Raporu commit'le (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          # 03.08: pilot kostu, PARA HARCANDI, rapor push yarisini kaybetti ve
          # "|| true" bunu SUSTURDU - fatura rakamlarini kaybettik. Bir daha olmaz:
          # rapor yoksa veya push 3 denemede tutmazsa adim KIRMIZI biter.
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          # YALNIZ rapor (sayilar) commit'lenir; soru icerigi depoya girmez.
          if [ ! -f veri/onarim-motor-raporu.json ]; then echo "!! RAPOR YOK"; exit 1; fi
          git add veri/onarim-motor-raporu.json
          git diff --cached --quiet || git commit -m "Onarim motoru raporu [veri-operasyonu]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push denemesi $i tutmadi"; sleep 7
          done
          echo "!! PUSH TUTMADI - PARALI kosunun raporu depoya yazilamadi."; exit 1
