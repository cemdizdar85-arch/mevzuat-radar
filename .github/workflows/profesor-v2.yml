# .github/workflows/profesor-v2.yml — PROFESOR v2 (KATMAN 2)
#
# PARA HARCAYAN IS AKISI. Bu yuzden tek bir kapisi var: veri/profesor-emir.json.
# Betigin kendisi degistiginde KOSMAZ (o hata daha once yasandi: bir yazim
# duzeltmesi parali bir partiyi baslatmisti). Yalnizca EMIR dosyasi degisince
# kosar, emirde onay=true ve uygulandi=null ise calisir, bitince damgalanir.
# Damgali emir bir daha kosmaz - ayni parayi iki kez harcamak imkansiz.
#
# 28.07: BUTUN ACIK EMIRLER SIRAYLA kosuluyor. Eski hali yalniz ILK acik emri
# kosuyordu; ikinci emir hicbir zaman atesnlenmezdi cunku robotun kendi commit'i
# (GITHUB_TOKEN) yeni bir kosu TETIKLEMEZ. Yani "iki is birak, ikisi de yapilsin"
# demek mumkun degildi - bunu emir yazarken degil, kosu bitince fark ederdik.
name: Profesor v2

on:
  workflow_dispatch:
    inputs:
      olcum:
        description: "true = PARA HARCAMAZ; kasadaki yayin bekleyen sorularin hakem maliyetini olcer"
        required: false
        default: "false"
  push:
    paths:
      - 'veri/profesor-emir.json'

permissions:
  contents: write

concurrency:
  group: profesor-v2
  cancel-in-progress: false

jobs:
  yargila:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # 02.08 Cem: "sorular ne zaman kontrolden gecip sisteme girecek?" — cevabin
      # rakami bu adimdan cikar. OLCUM modu PARA HARCAMAZ: kasadaki yayin
      # bekleyen sorulari sayar, hakem maliyetini ve suresini tahmin eder.
      - name: OLCUM (para harcamaz) — hakem maliyeti
        if: ${{ github.event.inputs.olcum == 'true' }}
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./motor/profesor-v2.ps1 -olcum -kaynak kasa -sinir 0

      - name: Acik emirleri sirayla kos
        if: ${{ github.event.inputs.olcum != 'true' }}
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $yol = 'veri/profesor-emir.json'
          $e = Get-Content $yol -Raw -Encoding UTF8 | ConvertFrom-Json
          $acik = @($e.emirler | Where-Object { $_.onay -eq $true -and -not $_.uygulandi })
          if($acik.Count -eq 0){ Write-Host "Bekleyen onayli emir yok - hicbir sey yapilmadi, 0 USD."; exit 0 }
          Write-Host ("Acik emir: {0}" -f $acik.Count)

          foreach($x in $acik){
            Write-Host ""
            Write-Host ("===== EMIR #{0} ({1}) - tahmini {2} USD" -f $x.no, $x.emir, $x.tahmini_usd)
            Write-Host ("      {0}" -f $x.gerekce)
            $cikti = "veri/profesor-rapor-$($x.no).json"
            $kurtar = if($x.PSObject.Properties['kurtar']){ "$($x.kurtar)" } else { "" }
            $idler  = if($x.PSObject.Properties['idler']){ "$($x.idler)" } else { "" }
            $odak   = if($x.PSObject.Properties['odak']){ "$($x.odak)" } else { "genel" }
            $ok = $true
            try {
              ./motor/profesor-v2.ps1 -calistir -kaynak "$($x.kaynak)" -sinir ([int]$x.sinir) `
                 -model "$($x.model)" -kurtar $kurtar -idler $idler -odak $odak -cikti $cikti
              if($LASTEXITCODE -ne 0){ $ok = $false }
            } catch { $ok = $false; Write-Host ("EMIR #{0} DUSTU: {1}" -f $x.no, $_.Exception.Message) }

            # kosunun kendi logunu emir bazinda sakla (ustune yazilmasin)
            if(Test-Path 'veri/profesor-log.txt'){ Copy-Item 'veri/profesor-log.txt' "veri/profesor-log-$($x.no).txt" -Force }

            # BASARILI kosu damgalanir (ayni para iki kez harcanmaz).
            # BASARISIZ kosu yalniz 'deneme' sayacini artirir; 3. denemede emir
            # kendini kapatir - sonsuz dongude para yakilmaz, insan bakar.
            if($ok){
              $x | Add-Member -NotePropertyName uygulandi -NotePropertyValue (Get-Date -Format 'dd.MM.yyyy HH:mm') -Force
              Write-Host ("EMIR #{0} BASARILI, damgalandi." -f $x.no)
            } else {
              $d = 0; if($x.PSObject.Properties['deneme']){ $d = [int]$x.deneme }
              $d++
              $x | Add-Member -NotePropertyName deneme -NotePropertyValue $d -Force
              $x | Add-Member -NotePropertyName son_hata -NotePropertyValue (Get-Date -Format 'dd.MM.yyyy HH:mm') -Force
              if($d -ge 3){
                $x | Add-Member -NotePropertyName uygulandi -NotePropertyValue "KAPATILDI: 3 denemede kosmadi, insan baksin" -Force
                Write-Host ("EMIR #{0} 3 denemede kosmadi - KAPATILDI." -f $x.no)
              } else {
                Write-Host ("EMIR #{0} dustu (deneme {1}/3) - emir acik kaliyor." -f $x.no, $d)
              }
              # Bir emir duserse SONRAKINE GECILMEZ: ayni kusur muhtemelen onu da
              # dusurur ve ust uste para yakar.
              Write-Host "Sonraki emirlere GECILMIYOR."
              [IO.File]::WriteAllText($yol, ($e | ConvertTo-Json -Depth 8), (New-Object Text.UTF8Encoding($false)))
              exit 1
            }
            [IO.File]::WriteAllText($yol, ($e | ConvertTo-Json -Depth 8), (New-Object Text.UTF8Encoding($false)))
          }

      - name: Raporlari ve HATA DEFTERINI commit'le
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          # 28.07: 'git add a b c' icinde c YOKSA git HICBIRINI eklemez, yalniz
          # hata verir - '|| true' de bunu susturur. Iki kosu bu yuzden hata
          # defterini commit'lemedi. Her dosya AYRI eklenir.
          for f in veri/profesor-emir.json veri/profesor-hata.json veri/profesor-log.txt veri/profesor-rapor-*.json veri/profesor-log-*.txt; do
            if [ -f "$f" ]; then git add "$f" || true; fi
          done
          git diff --cached --quiet || git commit -m "Profesor v2 kosusu [veri-operasyonu]"
          git pull --rebase || true
          git push || true
