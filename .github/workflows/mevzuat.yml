# .github/workflows/mevzuat.yml — GÜNLÜK KANUN AYNASI
# Cem: "günlük tazeleme lazım, RG günlük çıkıyor." Her gün her kanunun
# mevzuat.gov.tr KONSOLİDE (güncel) metnini çeker, hash'ler; DEĞİŞENİ (kanun
# güncellendi/madde iptal) yeniden yutup Supabase'e yükler + son_senkron damgası.
# Değişmeyeni atlar. Böylece EZBER değil, güncel kaynağın günlük aynası.
name: Günlük Kanun Aynası

on:
  # 29.07 — ZAMANLAYICI GERI ACILDI.
  # 27.07'de "KREDI-BEKLIYOR" notuyla kapatilmisti, ama sebep yanlisti:
  # aynanin kendisi PARA HARCAMIYOR (mevzuat-yut.ps1'de tek bir API cagrisi
  # yok; indirme + pdftotext). Kapatilma sebebi, paral cevap hakemi adiminin
  # kosulunun 'schedule'i de icermesiydi - yani ayna acilinca hakem de
  # aciliyordu. O kosul ayrildi (asagida), hakem artik yalniz elle kosuyor.
  # Ayna bu sistemin TEMELI: ambarin tazeligi, madde damgasi, dayanak
  # nobetcisi ve teblig damgasi hepsi gunluk kosuya bagli.
  schedule:
    # 29.07 — Cem: "Resmî Gazete gece yayımlanıyor, bunu erkene alalım."
    # Kart robotu 06:00'da nöbete kalkıyor; ayna ondan SONRA koşmalı ki
    # o günün RG'sini gören kartlarla aynı günü görsün.
    - cron: "11 0 * * *"     # 03:11 TR - sabah aynasi
    - cron: "11 13 * * *"    # 16:00 Türkiye — ikinci tur (konsolide metin
                            # mevzuat.gov.tr'ye gün içinde de düşebiliyor;
                            # tek tur kaçırırsa ikincisi telafi eder)
  # 28.07 (Cem: "kanun maddesi yutmam lazim"): manifest veya durum dosyasi degisince
  # hasat KENDILIGINDEN kossun. Yeni kanun eklemek ya da bir kanunun damgasini silip
  # yeniden yutturmak icin artik elle tetiklemeye gerek yok. Indirme + pdftotext
  # ucretsizdir; PARALI olan tek adim (cevap hakemi) zaten 'hakem' girdisine bagli
  # ve push tetiginde varsayilan olarak KAPALI gelir.
  push:
    paths:
      - 'veri/mevzuat-kaynaklar.json'   # yeni kanun/yonetmelik/teblig eklendi
      - 'veri/mevzuat/_durum.json'      # damga silindi -> o kanun yeniden yutulsun
      - 'motor/mevzuat-yut.ps1'         # parcalayici degisti -> yeniden yut
      - 'veri/mevzuat-hazir/**'         # RG'den elle hazirlanan ekli metin eklendi
      - '.github/workflows/mevzuat.yml' # indirme adimi degisti
  workflow_dispatch:
    inputs:
      hakem:
        description: "Cevap hakemi kossun mu? (PARALI - Haiku API). Hasat icin GEREKMEZ."
        type: boolean
        default: false
      zorla:
        description: "Hash'e bakmadan TUM kanunlari yeniden yut (parcalayici degisince gerekir)"
        type: boolean
        default: false

permissions:
  contents: write

# ES-ZAMANLI KOSU YASAK (16.07.2026 dersi): iki kosu yaristi, ikisi de yedek
# yoldan VUK 509'u yukledi -> 364 = 2x182 cift kayit. Kuyruga al, iptal etme.
concurrency:
  group: mevzuat-ayna
  cancel-in-progress: false

jobs:
  mevzuat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pdftotext kur (poppler-utils)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Kanun PDF indir + metne dok
        env:
          ZORLA: ${{ inputs.zorla && '1' || '0' }}
        run: |
          mkdir -p _txt
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          # while read: JSON string degerlerindeki bosluklardan word-split olmaz (jq satir-satir)
          # 03.08 KOK SEBEP DUZELTMESI: 02.08'de manifeste 528 seyrek teblig
          # eklendi; bu adim HEPSINI arka arkaya indirmeye kalkti ve 10:07
          # kosusu ambara TEK teblig yazamadi (mevzuat.gov.tr seri yagmuru
          # kesiyor). Uc duzeltme:
          #  (1) SEYREK filtresi artik BASH'te de var: seyrek=true olup daha
          #      once yutulmus (_durum'da olan) kaynak pazar/ZORLA disinda
          #      INDIRILMEZ (mevzuat-yut zaten atliyordu; indirme yuku kalkti).
          #  (2) Ilk kez inecek seyrek kaynak sayisi kosu basina 120 ile
          #      sinirli + her GeneratePdf arasinda 2 sn bekleme - 528'lik
          #      birikim 4-5 kosuda sakin sakin dolar, yagmur kesilmez.
          #  (3) HAZIR METIN istisnasi: veri/mevzuat-hazir/<slug>.txt depoda
          #      varsa indirme hic yapilmaz, dosya dogrudan kullanilir
          #      (RG'den elle hazirlanan ekli tebligler: VUK 577 EK listesi,
          #      asgari ucret karari gibi).
          SEYREK_YENI=0; SEYREK_TAVAN=120
          jq -c '.kanunlar[]' veri/mevzuat-kaynaklar.json | while read -r row; do
            slug=$(echo "$row" | jq -r '.slug')
            pid=$(echo "$row" | jq -r '.pdfId')
            seyrek=$(echo "$row" | jq -r '.seyrek // false')
            if [ -f "veri/mevzuat-hazir/$slug.txt" ]; then
              cp "veri/mevzuat-hazir/$slug.txt" "_txt/$slug.txt"; echo "HAZIR $slug (depodan)"; continue
            fi
            if [ "$seyrek" = "true" ] && [ "${ZORLA:-0}" != "1" ] && [ "$(date -u +%u)" != "7" ]; then
              if jq -e --arg s "$slug" 'has($s)' veri/mevzuat/_durum.json >/dev/null 2>&1; then
                continue   # seyrek + zaten yutulmus -> bu kosuda indirme yok
              fi
              SEYREK_YENI=$((SEYREK_YENI+1))
              if [ "$SEYREK_YENI" -gt "$SEYREK_TAVAN" ]; then continue; fi   # kalani sonraki kosuya
            fi
            # G7:/G9: onekleri = yonetmelik/teblig (GeneratePdf ucundan); digerleri kanun (MevzuatMetin)
            case "$pid" in
              G7:*) url="https://www.mevzuat.gov.tr/File/GeneratePdf?mevzuatNo=${pid#G7:}&mevzuatTur=KurumVeKurulusYonetmeligi&mevzuatTertip=5"; sleep 2 ;;
              G9:*) url="https://www.mevzuat.gov.tr/File/GeneratePdf?mevzuatNo=${pid#G9:}&mevzuatTur=Teblig&mevzuatTertip=5"; sleep 2 ;;
              *)    url="https://www.mevzuat.gov.tr/MevzuatMetin/$pid.pdf" ;;
            esac
            code=$(curl -s -L -o "_txt/$slug.pdf" -w "%{http_code}" -H "User-Agent: $UA" -H "Referer: https://www.mevzuat.gov.tr/" "$url" --max-time 240 || echo "000")
            if [ "$code" = "200" ]; then
              pdftotext -enc UTF-8 "_txt/$slug.pdf" "_txt/$slug.txt" && echo "OK $slug" || echo "PDFTOTEXT FAIL $slug"
            else
              echo "INDIRME HATASI $slug ($code) - atlandi"
            fi
          done
          echo "indirme adimi tamam: $(ls _txt/*.txt 2>/dev/null | wc -l) metin"
      - name: Yut + hash + yukle (degiseni)
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ZORLA: ${{ inputs.zorla && '1' || '0' }}   # hash'e bakmadan hepsini yeniden yut
        run: ./motor/mevzuat-yut.ps1
      # KATMAN 3 — RG NOBETI. Damga bugune kadar KANUN bazindaydi: bir kanun
      # degisince "degisti" diyorduk ama HANGI MADDE degisti bilmiyorduk;
      # bilmeyince de o maddeye dayanan sorulari ayiramiyorduk. Sonuc: Resmi
      # Gazete'de bir oran/sure degisiyor, kasadaki soru ESKI HALIYLE yayinda
      # kaliyor. Sitenin en sinsi hata kaynagi budur - cunku soru yazildigi gun
      # DOGRUYDU. Artik her (kanun, madde) ciftinin metni ayri parmak izleniyor
      # ve hasattan hemen sonra karsilastiriliyor.
      # PARA HARCAMAZ: yalniz ambar okur, hash hesaplar, rapor yazar.
      #
      # 29.07 - EMNIYET KEMERI BAGLANDI (-uygula). Betik 28.07'de yazilirken
      # kasada 'yayin' kolonu YOKTU, bu yuzden sadece RAPOR uretiyordu: "su
      # madde degisti, ona dayanan sorular yayindan cekilmeli" diyor ama
      # cekmiyordu. Kolon o gunden beri VAR (butun uretim yayin=false ile
      # dusuyor) - yani katman aylarca takili ama baglanmamis duracakti.
      # Betik kolonu KOSU ANINDA kontrol ediyor; yoksa uyarip geciyor, bu
      # yuzden acmak guvenli.
      # SIMDI ACMAK ICIN EN IYI AN: madde-degisim.json'da degisen=0
      # (15.184 madde parmak izlendi, ilk kurulum). Yani bugun hicbir soru
      # cekilmeyecek - kemer bos yolda baglaniyor, virajda degil.
      - name: Madde damgasi (Katman 3 — RG nobeti)
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/madde-damga.ps1 -uygula
      # Raporu URETIR ama burada kirmizi vermez - once hasat commit'lensin.
      # Kirmizi, commit'in ARKASINDAKI kapida verilir.
      - name: Dayanak nobetcisi (hangi SAYFALAR etkilendi)
        continue-on-error: true
        shell: pwsh
        run: ./motor/dayanak-nobetci.ps1
      # TEBLIG DAMGASI (29.07). Cem: "bunu zaten biz sistemde yok mu, Resmi
      # Gazete her gun iniyor, indirebildiklerimizi indirip kontrol
      # saglayabiliriz." Hakliydi - mekanizma vardi, EKSIK OLAN KAPSAMDI:
      # bu ayna her gun konsolide PDF indirip hash'liyor ama listesinde
      # yalniz KANUNLAR vardi. GTIP aracinin kalbi olan 43 gozetim TEBLIGI
      # hic girmemisti, 11.07'den beri degisip degismedikleri bilinmiyordu.
      # Tespit (hash) BEDAVA burada; ayristirma (tablo->GTIP/kiymet) API
      # gerektirir ve yalniz degisiklik varsa kosar.
      - name: Teblig damgasi (gozetim tebligleri degisti mi)
        continue-on-error: true
        shell: pwsh
        run: ./motor/teblig-damgasi.ps1
      # ZINCIRIN SON HALKASI (29.07). Madde damgasi degisen maddeye dayanan
      # SORULARI yayindan cekiyor - ama SAYFALAR icin oyle bir bag yoktu.
      # Bedeli goruldu: KVKK sayfasi 11.07'de sablondan yazildi, kanun ambara
      # 27.07'de girdi, m.9'un 2024 degisikligi kimse fark etmeden aylarca
      # yayinda kaldi. Nobetci artik "su madde degisti -> su sayfalar etkilendi"
      # diyor. Kosuyu KIRMIZI bitirir: bu depoda dort katman "kuruldu ama
      # kimse gormedi" diye bekledi, sessiz rapor okunmuyor.
      # Commit adiminin ONUNDE degil ARKASINDA durur ki kirmizi bitse bile
      # hasat verisi kaydedilmis olsun.
      - name: Degisen madde-belgelerini commit et
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A veri/mevzuat/ || true
          if [ -f veri/madde-degisim.json ]; then git add veri/madde-degisim.json || true; fi
          if [ -f veri/dayanak-uyari.json ]; then git add veri/dayanak-uyari.json || true; fi
          if [ -f veri/dayanak-nobet-log.txt ]; then git add veri/dayanak-nobet-log.txt || true; fi
          if [ -f veri/teblig-damga.json ]; then git add veri/teblig-damga.json || true; fi
          if [ -f veri/teblig-damga-log.txt ]; then git add veri/teblig-damga-log.txt || true; fi
          git add veri/yeniden-dogrula.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Degisiklik yok - commit yok."
          else
            git commit -m "Günlük kanun aynası: değişen kanun(lar) yeniden yutuldu $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push || echo "UYARI: push olmadi (uzak dal ilerlemis olabilir) - veri Supabase'de guvende, sonraki kosu telafi eder."
          fi
      # KIRMIZI KAPI. Rapor commit'lendikten SONRA calisir: veri kaydedilmis
      # olur, ama etkilenen sayfa varsa kosu KIRMIZI biter ve GM gorur.
      # Sessiz rapor okunmaz - bu depoda dort katman tam bu yuzden aylarca
      # "kurulmus ama calismiyor" halde bekledi.
      - name: KAPI — dayanagi degisen sayfa var mi
        shell: pwsh
        run: |
          $y = 'veri/dayanak-uyari.json'
          if(-not (Test-Path $y)){ Write-Host "Uyari dosyasi yok - nobetci kosmamis ya da atlamis. Gecildi."; exit 0 }
          $u = Get-Content $y -Raw -Encoding UTF8 | ConvertFrom-Json
          if([int]$u.etkilenen_sayfa -eq 0){ Write-Host "TEMIZ: dayanagi degisen sayfa yok."; exit 0 }
          Write-Host ("KIRMIZI: {0} sayfanin dayandigi madde DEGISTI." -f $u.etkilenen_sayfa)
          foreach($x in $u.uyarilar){
            Write-Host ("  {0}" -f $x.sayfa)
            foreach($m in $x.maddeler){ Write-Host ("      <- {0}" -f $m) }
          }
          Write-Host ""
          Write-Host "Bu sayfalar OKUNUP GUNCELLENMEDEN dogru sayilmaz. Ayrinti: veri/dayanak-uyari.json"
          exit 1
      - name: KAPI — gozetim tebligi degisti mi
        if: always()
        shell: pwsh
        run: |
          $y = 'veri/teblig-damga.json'
          if(-not (Test-Path $y)){ Write-Host "Damga dosyasi yok - gecildi."; exit 0 }
          $t = Get-Content $y -Raw -Encoding UTF8 | ConvertFrom-Json
          if($t.ilk_kurulum -eq $true){ Write-Host "Ilk kurulum - karsilastirilacak onceki hal yok."; exit 0 }
          $d = @($t.degisen)
          if($d.Count -eq 0){ Write-Host ("TEMIZ: {0} gozetim tebliginin hicbiri degismemis." -f $t.izlenen); exit 0 }
          Write-Host ("KIRMIZI: {0} gozetim tebligi DEGISTI - veri/gtip-durum.json ESKIDI." -f $d.Count)
          foreach($x in $d){ Write-Host ("  mevzuatNo {0}  ({1} -> {2} bayt)  {3}" -f $x.mevzuatNo, $x.eski_boyut, $x.yeni_boyut, $x.url) }
          Write-Host ""
          Write-Host "YAPILACAK: tablo-hasat.ps1 yeniden kosmali (API gerekir)."
          Write-Host "O kosana kadar GTIP aracindaki gozetim verisi ESKIDIR - arac hasat tarihini ekranda gosteriyor."
          exit 1
      # GUVEN KATMANI C: hasat VE commit sonrasi retrieval sigortasi — altin
      # setteki her soru icin beklenen kaynak top-6'da bulunmali. Dusen vaka =
      # kirmizi kosu = GitHub e-postasi. Commit'ten SONRA kosar: kapinin isi
      # alarm vermek, hasat verisini rehin almak degil.
      - name: Ambar altin testi (retrieval kapisi)
        shell: pwsh
        run: ./motor/ambar-testi.ps1
      # Gunun 8 vakasi uctan uca (net-cevap + Haiku hakem, 0-10 puan). Anahtar
      # tanimli degilse script kendini atlar; retrieval kapisi yine de kosuyor.
      # 27.07 PARA MUSLUGU: bu is akisinin tek PARALI adimi budur (Haiku hakem).
      # Hasat/yut/yukle adimlarinin hepsi bedava. Elle kosturmak istedigimizde
      # hasadi ucretsiz alabilmek icin hakem VARSAYILAN OLARAK KAPALI; acmak
      # icin workflow_dispatch'te hakem=true secilir. Cron ile kosarsa (kredi
      # gelince acilinca) eskisi gibi kosar.
      # 28.07 KRITIK DUZELTME (Cem: "bosa para harcatma"): eski kosul
      #   github.event_name != 'workflow_dispatch' || inputs.hakem == true
      # idi. O gun tek tetik cron + elle oldugu icin sorun cikarmiyordu. Bugun PUSH
      # tetigi eklendi; push'ta event_name='push' oldugundan kosulun ILK yarisi DOGRU
      # olur ve bu PARALI adim HER PUSH'TA sessizce koserdi. Artik acik ve dar:
      # yalniz cron ile, ya da elle hakem=true secilirse koser. PUSH ASLA PARA HARCAMAZ.
      # 29.07 — ZAMANLAYICIDAN AYRILDI. Eskiden kosul 'schedule' iceriyordu;
      # yani gunluk aynayi acmak PARALI hakemi de her gun acmak demekti ve bu
      # yuzden 27.07'de IKISI BIRDEN kapatildi. Oysa aynanin kendisi BEDAVA
      # (indirme + pdftotext, API yok) ve ambarin tazeligi, madde damgasi,
      # dayanak nobetcisi, teblig damgasi HEPSI ona bagli. Iki gun boyunca
      # kanun aynasi hic kosmadi ve bunun sebebi olmayan bir maliyetti.
      # Artik hakem YALNIZ elle istendiginde kosar; ayna serbest.
      - name: Cevap hakemi (orneklem) — PARALI, yalniz elle
        if: github.event_name == 'workflow_dispatch' && inputs.hakem == true
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./motor/cevap-hakemi.ps1
