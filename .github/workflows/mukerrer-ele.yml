# .github/workflows/mukerrer-ele.yml — 0 USD
# VARSAYILAN OLCUM: kim kalir kim elenir, hicbir sey yazilmaz.
# UYGULAMA yalniz veri/tetik/mukerrer-ele.txt degistiginde kosar (Cem onayi).
# Sira kurali: ONCE BEDAVA ELEME, SONRA PARALI YAZIM - elenecek soruya para verilmez.
name: Mukerrer Eleme (0 USD)

on:
  push:
    paths:
      - 'motor/mukerrer-ele.ps1'
      - '.github/workflows/mukerrer-ele.yml'
      - 'veri/tetik/mukerrer-ele.txt'     # UYGULAMA tetigi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mukerrer-ele
  cancel-in-progress: false

jobs:
  ele:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # tetik kapisi HEAD~1 karsilastirmasi yapiyor; sig checkout ile HEAD~1 YOKTUR
      - name: Tetigi denetle
        id: kapi
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q 'veri/tetik/mukerrer-ele.txt'; then
            echo "uygula=evet" >> $GITHUB_OUTPUT; echo "UYGULAMA modu."
          else
            echo "uygula=hayir" >> $GITHUB_OUTPUT; echo "OLCUM modu."
          fi
      - name: Olcum
        if: steps.kapi.outputs.uygula != 'evet'
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/mukerrer-ele.ps1
      - name: Uygula
        if: steps.kapi.outputs.uygula == 'evet'
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/mukerrer-ele.ps1 -yaz
      - name: Raporu commit'le (kor kalma kurali)
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f veri/mukerrer-eleme-raporu.json ]; then git add veri/mukerrer-eleme-raporu.json || true; fi
          git diff --cached --quiet || git commit -m "Mukerrer eleme raporu [veri-operasyonu]"
          git pull --rebase || true
          git push || true
