# .github/workflows/gorsel-backfill.yml — GORSEL BACKFILL (Batch %50)
# Kasadaki tablosuz analiz sorularina exhibit tablosu uretir (Cem 24.07:
# "hepsinde olsun"). Push (script degisince) + gunluk gece kosusu.
name: Gorsel Backfill

on:
  workflow_dispatch:
  # KREDI-BEKLIYOR 27.07 (kredi yuklenince ac)
  # schedule:
    #- cron: "17 2 * * *"    # gece 05:17 TR - gunun yeni sorulari da gorsellensin
  # 28.07 PUSH TETIGI KAPATILDI (Cem: "bosa para harcatma"). Adim PARALIDIR
  # (Haiku Batch ile exhibit tablosu uretimi). Betigin kendisi degisince kosuyordu;
  # kod duzeltmesi para harcamamali. Artik yalniz workflow_dispatch.
  #
  # push:
  #   paths:
  #     - 'motor/gorsel-backfill.ps1'

permissions:
  contents: write

concurrency:
  group: gorsel-backfill
  cancel-in-progress: false

jobs:
  gorselle:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Tablosuz sorulara exhibit uret (Batch %50)
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # 25.07: cikti her durumda dosyaya (kirmizi kosu logu admin-only - tani icin sart)
        run: |
          $cikti = ./motor/gorsel-backfill.ps1 *>&1 | Out-String
          $kod = $LASTEXITCODE
          Write-Host $cikti
          "SON KOSU $(Get-Date -Format 'dd.MM HH:mm') exit=$kod`n$cikti" | Out-File veri/gorsel-backfill-son-log.txt -Encoding utf8
          exit $kod
      - name: Raporu kaydet
        if: always()
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add veri/gorsel-backfill-rapor.json veri/gorsel-backfill-son-log.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "rapor degisiklik yok"; exit 0; fi
          git commit -m "Gorsel backfill raporu"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 12; done
          echo "rapor pushlanamadi"; exit 1
