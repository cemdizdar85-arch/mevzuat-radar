# Sinav + ders envanteri — 0 USD, API yok, yazma yok.
# Cem: "staja baslama ve smmm bitirme ayri ayri bakalim, karistirmayalim."
# Bu is her seyi SINAV bazinda ayri sayar; onceki iki olcum (konu-dagilim,
# bosluk-dogrulama) sinav alanini filtrelemiyordu.
name: Sinav Ders Envanteri (0 USD)
on:
  push:
    paths: ['motor/sinav-ders-envanteri.ps1', '.github/workflows/sinav-ders-envanteri.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sinav-ders-envanteri
  cancel-in-progress: false
jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/sinav-ders-envanteri.ps1
      - name: Commit (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/sinav-ders-envanteri.json ]; then echo "!! RAPOR YOK"; exit 1; fi
          git add veri/sinav-ders-envanteri.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Sinav ders envanteri [veri-operasyonu]"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 7; done
          echo "!! PUSH TUTMADI"; exit 1
