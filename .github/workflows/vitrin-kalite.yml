# Bu dosyanin GitHub'daki yolu: .github/workflows/vitrin-kalite.yml
# NEDEN VAR (06.10.2026, Cem "2 yap" — "vitrin aracini GitHub'a tasi"):
#   Seviye testi sonucunda ucretsiz gosterilen Nobetci anlatimlarinin kalite listesi (public.vitrin_aciklama_dislanan)
#   bugune kadar Cem'in bilgisayarinda ELLE kosuyordu. 06.10'da iki olay yasandi:
#   (1) yerel ag kopuklugu araci yazma adiminda kesti, tablo bos kaldi (arac artik once-yaz-sonra-sil);
#   (2) onarilan sorular liste disina alinip arac koşunca, kasa yayini bitmeden vitrine dondu (sira sorunu).
#   Cozum: arac kasa yayini BITTIGINDE bulutta kendiliginden kosar (workflow_run), bilgisayara bagli degildir.
# GUNLUK PUBLIC: arac yalniz sayi ve kural kodu basar (soru metni YOK); anahtar secrets'tan, yazdirilmaz.
# 🚫 GORMEZ: elle okumanin bulacagi icerik kusurlari (yanlis madde/olgu) — onlar arac/vitrin-elle-ret.json'a elle girer.
name: Vitrin kalite listesi (Nobetci anlatimi)
on:
  workflow_run:
    workflows: ["Yayin (havuz kur + sayfa bas + ite)", "SMMM Kasa Yayini (0 USD)"]
    types: [completed]       # yayinin son "ite" adimi dusse de kasa yuklenmis olabilir -> sonuca bakmadan kosar
  schedule:
    - cron: "30 3 * * *"     # 06:30 TR emniyet agi (workflow_run kacarsa)
  workflow_dispatch:
permissions:
  contents: write          # 06.10: ana sayfa soru listesi (veri/vitrin-hesap.json) depoya işlenir
concurrency:
  group: vitrin-kalite
  cancel-in-progress: false
jobs:
  kalite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kalite listesini yaz
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then echo "SUPABASE_SERVICE_KEY tanimli degil"; exit 1; fi
          # ag hatasina karsi bir kez daha dene (arac her adimda tabloyu en az eski hali kadar dolu birakir)
          node arac/vitrin-aciklama-kalite.js || { echo "ilk deneme dustu, 30 sn sonra tekrar"; sleep 30; node arac/vitrin-aciklama-kalite.js; }
      # 06.10 (Cem "otomatikleştiremiyor muyuz"): ana sayfa kahraman kartının soruları. Dışlama listesi az önce tazelendi;
      # ücretsizden çıkan / dışlanan soru burada düşer. Mail atmaz; sabah kontrolü tek satır yazar.
      - name: Ana sayfa soru listesi
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          node motor/vitrin-hesap.js --sinav
          node motor/vitrin-hesap.js
      # 07.10 (Cem "takıldığın konular"): seviye testi raporunun konu adları (kimlik -> düzgün Türkçe ad). Set/havuz/eşleme
      # değişince tazelenir; adı olmayan soruda rapor konu göstermez. Bedel 0, günlüğe yalnız sayı.
      - name: Seviye testi konu adları
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          node motor/seviye-konu-ad.js --sinav
          node motor/seviye-konu-ad.js
      - name: Depoya işle
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@tetikte.com"
          git add veri/vitrin-hesap.json veri/ornek-soru.json veri/sinav/kaydir-secim/ornek-sgs-secim.json veri/sinav/kaydir-secim/ornek-smmm-secim.json veri/seviye/konu-ad.json || true   # 08.10: + 5 örnek soru (ornek-sorular.html, kaydir/vitrin/ornek-*.html)
          git diff --cached --quiet && { echo "değişiklik yok"; exit 0; }
          git commit -m "Ana sayfa soru listesi [veri-operasyonu]"
          for i in 1 2 3 4 5; do
            if git push; then echo "işlendi (deneme $i)"; break; fi
            git pull --rebase --autostash || true
            sleep $((i*15))
          done
