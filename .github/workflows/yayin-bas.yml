# .github/workflows/yayin-bas.yml — HAVUZU KUR, SAYFALARI BAS, SITEYE IT
#
# 12.09.2026, Cem: "ben bilgisayari kapatsam bile etkilenmiyor deme artik"
#
# NIYE: olctum ve cevap "hayir"di. Uretim buluta tasinmisti ama YAYIN adimi
# Cem'in makinesinde kaliyordu:
#     bulut uretir -> ambara yazar -> (BURADA DURUYOR) -> Cem acar -> siteye cikar
# Yani bulutta uretilen soru, makine acilana kadar ogrenciye gorunmuyordu.
# Bu akis o son halkayi da buluta alir. Artik zincirin tamami makineden bagimsiz:
#     bulut-uretim.yml -> ambar -> yayin-bas.yml -> tetikte.com
#
# ⛔ windows-latest, ubuntu DEGIL: motor/kaydir-coz.ps1 ve zinciri ters bolulu
#    yol kullaniyor ('veri\fabrika\...'); Linux'ta bunlar tek dosya ADI olur.
#    (Ayni sebep bulut-uretim.yml'de de yazili.)
#
# ⛔ BOS COMMIT ATILMAZ: sayfalar degismediyse commit YOK. Depo kuralı - robot
#    ciktisi her kosuda "degismis" gorunurse kapanis denetimi takilir ve
#    robotlar bos commit uretir.
#
# ⚠ ITME CAKISMASI: robotlar ana tele dakikalar icinde yaziyor. Push reddedilirse
#   fetch+merge ile 5 kez denenir (motor/oturum.ps1'deki desenin aynisi).
name: Yayin (havuz kur + sayfa bas + ite)

on:
  workflow_dispatch:
    inputs:
      parti_indir:
        description: "Parti onbellegini ambardan indir (bulut uretiminden sonra GEREKLI)"
        required: false
        default: true
        type: boolean
      taban_tazele:
        description: "ISTISNA: cevap dagilimi TABANINI bu kosunun olcumune esitle (kotulesmeyi KABUL ET). Gerekce zorunlu."
        required: false
        default: false
        type: boolean
      taban_gerekce:
        description: "taban_tazele=true ise ZORUNLU: niye kotulesme kabul edildi"
        required: false
        default: ""
        type: string
  # ⭐ 12.09.2026 — ZINCIRIN SON HALKASI. Cem: "ben bilgisayari kapatsam bile
  #   etkilenmiyor deme artik". Uretim bitiyordu ama yayin ELLE basiliyordu:
  #       bulut uretir -> ambara yazar -> (DURUYOR) -> biri gelir -> siteye cikar
  #   Artik uretim YESIL bitince yayin kendiliginden kosar:
  #       bulut-uretim.yml ✓ -> yayin-bas.yml -> tetikte.com
  #   ⛔ `types: [completed]` + asagidaki `if` sarttir: workflow_run KIRMIZI
  #      bitiste DE tetiklenir; suzmezsek dusen uretimden sonra yayin kosar.
  #   ⛔ workflow_run YALNIZ ana teldeki akis dosyasindan tetiklenir - dalda
  #      denemesi bos yere ugrastirir.
  workflow_run:
    workflows: ["Bulut Uretim (soru basimi)"]
    types: [completed]

permissions:
  contents: write        # sayfalari depoya itecek

concurrency:
  group: yayin-bas
  cancel-in-progress: false

jobs:
  yayin:
    # Elle basilirsa her zaman kosar; zincirden gelirse YALNIZ uretim YESILSE.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # merge icin gecmis gerekli

      - name: Sir yerinde mi
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if(-not "$env:SUPABASE_SERVICE_KEY"){ throw 'SUPABASE_SERVICE_KEY secret yok.' }
          "sir tamam"

      - name: Parti onbellegini ambardan indir
        # ⛔ Zincirden gelisde `inputs` YOKTUR (null) - sadece `inputs.parti_indir`
        #   yazilsaydi bu adim atlanir, yayin BAYAT onbellekle kosardi. Uretimden
        #   sonra indirme ZORUNLU; o yuzden workflow_run'da her zaman acik.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.parti_indir }}
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./arac/parti-senkron.ps1 -Indir -Yaz

      - name: Havuzu kur (yayin sartini saglayan her soru secilir)
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./arac/havuz-kur.ps1 -Yaz

      - name: Sayfalari bas (Kaydir-Coz)
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./arac/sgs-650-bas.ps1

      # ⛔⭐ 12.09.2026 CEM KURALI: "kural koyalim bundan sonra kacmasin"
      #   Cevap dagilimi kapisi ITMEDEN ONCE kosar - bozulmus bir dagilim
      #   siteye CIKMAZ. Kapi CIRCIR: her dersin o anki ki-karesi taban olarak
      #   kayitli; yalnizca bir ders TABANINDAN KOTUYE giderse duser. Yani
      #   bugunku birikim (fmuh 63,4 · maliyet 49,0 · mta 42,2) kapiyi bloke
      #   etmez, ama yeni bozulma iceri giremez. Ders duzeldikce taban
      #   kendiliginden asagi cekilir, geri yukselmez.
      #   Olcum: basili sayfalardan ders ders harf sayimi. Hedef %20 -
      #   gercek SGS anahtari olculdu (595 cevap, ki-kare 0,6).
      # ⛔ TABAN TAZELEMESI NIYE BURADA, YERELDE DEGIL: taban, kosunun KENDI
      #   bastigi sayfalardan olculmeli. 12.09'da tabani yerelde n=1.805
      #   fotografindan almistim; sayfalar o sirada 2.079'a cikmisti ve kapi
      #   bu zamanlama farki yuzunden de kirmiziya dondu. Tazeleme kosu icinde
      #   yapilirsa olcum ile taban AYNI ANIN fotografi olur.
      - name: Cevap dagilimi kapisi (ders ders, circir)
        shell: powershell
        run: |
          $tazele = "${{ inputs.taban_tazele }}" -eq 'true'
          $gerekce = "${{ inputs.taban_gerekce }}"
          if($tazele){
            if(-not $gerekce.Trim()){ throw 'taban_tazele=true ama taban_gerekce BOS. Istisna gerekcesiz yapilmaz.' }
            "ISTISNA: taban tazelenecek · gerekce: $gerekce"
            ./arac/cevap-dagilimi-olc.ps1 -Yaz -TabanTazele -Gerekce $gerekce
          } else {
            ./arac/cevap-dagilimi-olc.ps1 -Yaz -Kapi
          }

      - name: Degisen varsa ite
        shell: powershell
        run: |
          git config user.name  "tetikte-robot"
          git config user.email "bildirim@tetikte.com"
          git add kaydir/sgs veri/sinav/kaydir-secim veri/cevap-dagilimi.json
          $degisen = @(git diff --cached --name-only)
          if(-not $degisen.Count){ "degisiklik yok - commit ATILMADI"; exit 0 }
          "degisen dosya: $($degisen.Count)"
          git commit -m "Yayin: havuz tazelendi (bulut kosusu ${{ github.run_number }})"
          for($i=1; $i -le 5; $i++){
            # ⛔ STDERR YONLENDIRMESI YAZMA - NE `2>&1` NE `2>$null`.
            #    PS 5.1 yerel komutun stderr'ini NativeCommandError kaydina
            #    cevirir; GitHub'in `shell: powershell` sarmalayicisi
            #    $ErrorActionPreference='stop' koydugu icin bu SONLANDIRICI olur.
            #    git ilerlemesini ("To https://github.com/...") stderr'e yazar ->
            #    BASARILI push bile adimi oldurur.
            #    12.09 kosu #1 tam boyle dustu: commit 96620788 ATILDI, push
            #    GECTI (merge-base ile olculdu), akis yine de kirmizi oldu ve
            #    16 dakikalik odenmis is "basarisiz" gorundu.
            #    ⭐ OLCULDU (klon uzerinde, stderr'e yazan `git checkout -b`):
            #       yonlendirme YOK -> GECTI · 2>&1 -> DUSTU · 2>$null -> DUSTU
            #    Ilk duzeltmemde `2>$null` yazmistim; olcum onu da OLDURDUGUNU
            #    soyledi. Dogru care: yonlendirmeyi HIC yazmamak. stderr dogrudan
            #    kutuge akar (zaten okumak istedigimiz sey), karar $LASTEXITCODE.
            #    Kural artik mekanik: arac/tuzak-nobetcisi.ps1 > K6-STDERR.
            git push origin HEAD:main | Out-Null
            if($LASTEXITCODE -eq 0){ "itildi (deneme $i)"; exit 0 }
            git fetch origin main -q
            git merge origin/main --no-edit -q
            $cakisma = @(git diff --name-only --diff-filter=U)
            if($cakisma.Count){ throw "itmede cakisma - elle coz: $($cakisma -join ', ')" }
            Start-Sleep -Seconds 4
          }
          throw 'push 5 denemede basarisiz'

      - name: Ozet
        if: always()
        shell: powershell
        run: |
          $y='veri/sinav/kaydir-secim/sgs-650-secim.json'
          if(Test-Path $y){
            $ham=Get-Content $y -Raw -Encoding UTF8|ConvertFrom-Json
            $s=@($ham)
            "HAVUZ: $($s.Count) soru"
          } else { "secim dosyasi yok" }
