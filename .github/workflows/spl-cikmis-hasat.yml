# ============================================================================
#  SPL CIKMIS SINAV ARSIVI - HASAT (kesif + indir + ayristir + karne)
#
#  Runner'da kosar cunku ARSIV TR AGINDAN ENGELLI (olcum: web.archive.org
#  DNS cozuluyor 207.241.237.3, TCP 443 acilmiyor). Ayrica olculdu ki
#  SPL'nin 2010-2014 sinav PDF'lerinin RESMI kopyalari artik 404 - tek
#  kopya arsivde. Ayrinti: motor/spl-cikmis-indir.ps1 basligi.
#
#  BU AKIS AMBARA YAZMAZ. Ayristirici -tani (salt olcum) modunda kosar.
#
#  ----------------------------------------------------------------------
#  31.08 - NEDEN ADIMLAR BU KADAR PARCALI VE NEDEN HER ADIM GUNLUK YAZIYOR
#
#  4. kosuda su yasandi: INDIR adimi BASARILI gorundu, "INDIRME RAPORUNU
#  BAS" adimi da BASARILI gorundu, ama ana telde rapor DEGISMEDI (hala bir
#  onceki deneme kosusunun 10 dosyalik raporu duruyordu). Yani adim yesildi,
#  is olmamisti.
#
#  Sebep gorulemedi cunku Actions GUNLUK METNI depo yoneticisi yetkisi ister
#  (kimliksiz istek 403 doner); `gh auth login` bu makinede henuz yapilmadi.
#  Kimliksiz API yalnizca ADIM SONUCLARINI veriyor.
#
#  Bu yuzden iki sey degisti:
#   (1) Git isi TEK blok degil, DORT AYRI ADIM (ekle/commit/rebase/push).
#       Hangisinin dustugu adim sonucundan okunur - gunluk metni gerekmez.
#   (2) Her pwsh adimi ciktisini veri/ altina GUNLUK DOSYASI olarak yazar ve
#       o gunlukler depoya basilir. Boylece "kapi neden dustu" sorusunun
#       cevabi depoda durur. (Ev kurali: kapi neden dustugunu SOYLEMELI.)
#
#  NOT: veri/spl-hasat-*-log.txt dosyalari GECICIDIR. `gh auth login` bir kez
#  yapilirsa Actions gunlugu dogrudan okunur ve bu dosyalar kaldirilir.
#
#  Ayrica `git add a b c || true` deseni terk edildi: git add pathspec'lerden
#  BIRI bile yoksa HICBIRINI eklemez ve `|| true` bunu yutar - "eklendi"
#  saniliyor, sonra "degisiklik yok" deniyor. Artik dosyalar TEK TEK eklenir.
# ============================================================================
name: SPL cikmis sinav arsivi hasati

env:
  TAVAN: '0'           # 0 = tamami · deneme icin kucuk tut
  # MOD: 'tani' = SALT OLCUM (ambara yazmaz) · 'yaz' = AMBARA YUT.
  # Once 'tani' kosar ve karne okunur; ayristirmanin bu kitapciklarda ne
  # verdigi GORULMEDEN 'yaz'a gecilmez - yarim yutma boyle olur.
  MOD: 'tani'

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/spl-cikmis-hasat.yml'
      - 'motor/spl-cikmis-indir.ps1'

permissions:
  contents: write

concurrency:
  group: spl-cikmis-hasat
  cancel-in-progress: false

jobs:
  hasat:
    runs-on: ubuntu-latest
    # 31.08: ilk tam kosu 120 dakikayi asti ve HICBIR rapor yazilamadi -
    # is tavana carpinca `if: always()` adimlari da kosmaz, cikti kaybolur.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: PDF ARACLARI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-tur
          mkdir -p veri
          pdftotext -v 2> veri/spl-hasat-00-arac-log.txt || true

      - name: KESIF (adres listesi tazele)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pwsh -File motor/spl-cikmis-kesif.ps1 *>&1 |
            Tee-Object -FilePath veri/spl-hasat-01-kesif-log.txt
          "CIKIS KODU: $LASTEXITCODE" | Add-Content veri/spl-hasat-01-kesif-log.txt

      - name: INDIR
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pwsh -File motor/spl-cikmis-indir.ps1 -Tavan ([int]$env:TAVAN) *>&1 |
            Tee-Object -FilePath veri/spl-hasat-02-indir-log.txt
          "CIKIS KODU: $LASTEXITCODE" | Add-Content veri/spl-hasat-02-indir-log.txt

      - name: AYRISTIR (salt olcum - ambara YAZMAZ)
        if: always()
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $ErrorActionPreference = 'Continue'
          $log = 'veri/spl-hasat-03-ayristir-log.txt'
          if(Test-Path _kaynak/spl-cikmis){
            $n = @(Get-ChildItem _kaynak/spl-cikmis -Filter *.pdf).Count
            "ayristirilacak PDF: $n" | Set-Content $log
            if($n -gt 0){
              $bayrak = if("$env:MOD" -eq 'yaz'){ '-yaz' } else { '-tani' }
              "mod: $bayrak" | Add-Content $log
              pwsh -File motor/cikmis-soru-ayristir.ps1 -klasor _kaynak/spl-cikmis -sinavAdi 'SPK Lisanslama' $bayrak *>&1 |
                Tee-Object -FilePath $log -Append
            }
          } else { 'indirme klasoru yok' | Set-Content $log }
          "CIKIS KODU: $LASTEXITCODE" | Add-Content $log

      - name: KARNE ("yarim yutmadik" kapisi)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pwsh -File motor/spl-cikmis-karne.ps1 *>&1 |
            Tee-Object -FilePath veri/spl-hasat-04-karne-log.txt
          "CIKIS KODU: $LASTEXITCODE" | Add-Content veri/spl-hasat-04-karne-log.txt

      # --- GIT: DORT AYRI ADIM ------------------------------------------
      - name: GIT 1 - EKLE
        if: always()
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          echo "dal: $(git rev-parse --abbrev-ref HEAD)"
          for f in veri/spl-cikmis-indirme.json veri/spl-cikmis-envanteri.json \
                   veri/SPL-CIKMIS-KESIF.md veri/spl-cikmis-karne.json \
                   veri/SPL-CIKMIS-KARNE.md veri/cikmis-soru-ayrisma.json \
                   veri/cikmis-soru-bosluk-haritasi.json \
                   veri/spl-hasat-00-arac-log.txt veri/spl-hasat-01-kesif-log.txt \
                   veri/spl-hasat-02-indir-log.txt veri/spl-hasat-03-ayristir-log.txt \
                   veri/spl-hasat-04-karne-log.txt; do
            if [ -f "$f" ]; then git add -- "$f" && echo "eklendi: $f"; else echo "YOK: $f"; fi
          done
          echo "--- staged ---"
          git diff --staged --name-only

      - name: GIT 2 - COMMIT
        if: always()
        run: |
          if git diff --staged --quiet; then
            echo "staged degisiklik yok"
          else
            git commit -m "SPL cikmis sinav arsivi hasat raporu [veri-operasyonu]"
            git log -1 --format='%h %s'
          fi

      - name: GIT 3 - REBASE
        if: always()
        run: |
          git fetch origin main
          # --autostash ŞART. 9. koşuda bu adım düştü ve raporun tamamı
          # kayboldu: koşu sırasında betiklerin dokunduğu ama commit'lenmeyen
          # başka bir izlenen dosya kaldığında rebase "unstaged changes" ile
          # reddediyor. Tek blokken bu `|| sleep 5` içinde yutuluyordu —
          # adım YEŞİL görünüyor, ana telde hiçbir şey yok.
          git status --short | head -30
          git rebase --autostash origin/main
          git log -1 --format='%h %s'

      - name: GIT 4 - PUSH
        if: always()
        run: git push origin HEAD:main
