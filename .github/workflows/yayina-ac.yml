# .github/workflows/yayina-ac.yml — YAYINA ACMA (elle tetiklenir)
# Cem onayi 02.08: hakemden 3/3 gecen sorular yayina acilir. Otomatik cron YOK
# ve olmayacak: yayin karari GM'nin, robotun degil.
name: Yayina Ac

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yayina-ac
  cancel-in-progress: false

jobs:
  ac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yayina ac (3/3 gecenler)
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/yayina-ac.ps1
      - name: Raporu commit'le (kor kalma)
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f veri/yayina-acma-raporu.json ]; then git add veri/yayina-acma-raporu.json || true; fi
          git diff --cached --quiet || git commit -m "Yayina acma raporu [veri-operasyonu]"
          git pull --rebase || true
          git push || true
