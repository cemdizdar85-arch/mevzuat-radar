# Bu dosyanin GitHub'daki yolu: .github/workflows/kaynak.yml
# Kaynak Nobetcisi: resmi kaynaklari haftalik izler; degisince Cem'e mail atar
# ve (deterministik olanlari) yeniden hasat edip commit'ler.
name: Kaynak Nobetcisi

on:
  schedule:
    - cron: "13 0 * * *"     # 03:13 TR (sabah cekimi)
    # 30.07 Cem karari: ihalede gun ici ilan cok, tek sabah cekimi yetmez -
    # aksam cekimi eklendi. Sayfadaki soz de bu: "sabah-aksam otomatik".
    - cron: "13 14 * * *"    # 14:00 UTC = 17:00 Turkiye (aksam cekimi)
  workflow_dispatch:        # elle de calistirilabilir

permissions:
  contents: write

jobs:
  nobet:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: pdftotext kur (gecikme zammi PDF parse icin)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Kaynak nobetcisini calistir
        shell: pwsh
        run: ./arac/kaynak-nobetcisi.ps1

      - name: Yurt ici ihale listesi (ilan.gov.tr acik API — gunluk yenile)
        shell: pwsh
        run: ./motor/ihale-yurtici-hasat.ps1 -Adet 100

      - name: Yurt disi ihale listesi (AB TED acik API — sektor sektor aktif ihaleler)
        shell: pwsh
        run: ./motor/ihale-ted-hasat.ps1

      - name: Iflas/konkordato ilanlari (ilan.gov.tr — alacak radari canli besleme)
        shell: pwsh
        run: ./motor/alacak-ilan-hasat.ps1 -Adet 60

      # Borclu firma adi + (tek/gecerli) VKN'yi ilan.gov.tr detayindan cek. Canli
      # besleme her gun yenilendigi icin HEMEN ardindan kosar. Dort kontrol kapisi
      # yanlis firma gostermeyi engeller (emin degilse bos birakir).
      - name: Alacak ilanlarina borclu adi + VKN ekle
        continue-on-error: true
        shell: pwsh
        run: ./motor/alacak-borclu-cek.ps1

      # 19.08 Cem onayi: Cagri Radari - TUBITAK + KOSGEB + AB (Ufuk Avrupa) acik
      # destek cagrilari (destekler.html canli bolum + tesvik sihirbazi "diger
      # kapilar"). Gunde BIR cekim yeter (cagrilar saatlik degismez) -> yalniz
      # sabah. Betik uc kaynak birden olculemezse 1 ile cikar; tek kaynak
      # dusmesinde eski veri korunur (kor kalma kurali betigin icinde).
      - name: Cagri Radari - acik destek cagrilari (yalniz sabah)
        id: cagri
        if: github.event.schedule != '13 14 * * *'
        continue-on-error: true
        shell: pwsh
        run: ./motor/cagri-hasat.ps1

      - name: Cagri hasadi dustuyse Cem'e haber ver
        if: steps.cagri.outcome == 'failure'
        shell: pwsh
        run: |
          $p = @{ access_key='5b227e56-94fb-4123-a39a-4286f63db14a'; subject='TETIKTE - Cagri Radari hasadi dustu'; from_name='Tetikte Nobetci'; email='cemdizdar85@hotmail.com'; message="Cagri Radari hasadi (TUBITAK+KOSGEB+AB) uc kaynagin ucunde de olcum yapamadi ya da beklenmedik hata verdi; veri/cagri-radar.json GUNCELLENMEDI (eski veri durur). Muhtemel sebep: kaynak sayfa yapisi degisti ya da GitHub IP engeli. Kosu: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" } | ConvertTo-Json
          try { Invoke-RestMethod -Uri 'https://api.web3forms.com/submit' -Method Post -ContentType 'application/json' -Body $p | Out-Null } catch { Write-Host "mail gitmedi: $($_.Exception.Message)" }

      # 13.08 Cem onayi: Kamu Ihale Bulteni'nden iptal + duzeltme ilanlari.
      # YALNIZ SABAH CEKIMINDE: bulten gunde bir yayimlanir, uc tur ~30 MB indirir;
      # aksam tekrar cekmek KIK sunucusuna bosuna yuk. (Elle tetiklemede de kosar.)
      #
      # continue-on-error BILINCLI: mevzuat indiricisinde GitHub Actions IP'si
      # engellenmisti, ayni risk burada da var. Bu adim duserse yurt ici/disi ihale
      # verisi ve diger hasatlar COMMIT'LENSIN - tek kaynak yuzunden gun kaybedilmez.
      # Ama sessiz kalmasin: asagidaki adim duserse Cem'e mail gider.
      # 14.08 TESHIS: ilk kosuda dort bulten de "SSL connection could not be
      # established" verdi. Sebep TAHMIN EDILMEZ, olculur: asagidaki adim KIK'in
      # TLS el sikismasini ve sertifikasini dokuyor. Ubuntu'nun OpenSSL 3 politikasi
      # (SECLEVEL=2) eski sifre takimlarini reddediyorsa burada gorunur.
      - name: TESHIS — KIK ucuna TLS el sikismasi
        if: github.event.schedule != '13 14 * * *'
        continue-on-error: true
        run: |
          echo "--- openssl s_client ---"
          timeout 25 openssl s_client -connect ekap.kik.gov.tr:443 -servername ekap.kik.gov.tr </dev/null 2>&1 | head -30 || true
          echo "--- curl (varsayilan) ---"
          curl -sS -o /dev/null -w "http=%{http_code} tls=%{ssl_verify_result}\n" --max-time 25 https://ekap.kik.gov.tr/ekap/ilan/bultenindirme.aspx || true
          echo "--- openssl surumu / seclevel ---"
          openssl version -a | head -3
          grep -n "SECLEVEL\|CipherString\|MinProtocol" /etc/ssl/openssl.cnf || true

      # 14.08: curl calisiyor ama Invoke-WebRequest calismiyorsa suclu PowerShell'in
      # TLS ayaridir. Bu adim ayarlari TEK TEK dener - hangisinin tuttugu olculur.
      - name: TESHIS — PowerShell TLS ayarlari
        if: github.event.schedule != '13 14 * * *'
        continue-on-error: true
        shell: pwsh
        run: ./motor/tls-teshis.ps1

      - name: Kamu Ihale Bulteni — iptal + duzeltme (yalniz sabah)
        id: bulten
        if: github.event.schedule != '13 14 * * *'
        continue-on-error: true
        shell: pwsh
        run: ./motor/ihale-bulten-hasat.ps1 -Turler Mal,Yapim,Hizmet,Danismanlik -Yaz

      # 14.08 Cem: "kimler katilabilir, kac tane, ne istiyorlar — HAP olarak
      # gorsunler". Bulten ilan METNINDEN cikarilir; ayni ZIP'ler zaten yukaridaki
      # adimda indirildi, ek istek YOK. Havuz BIRIKIMLIDIR: ihaleler 7-40 gun
      # onceden ilan edildigi icin tek gunluk bulten yetmez, her gun uzerine eklenir.
      - name: Kamu Ihale Bulteni — ilan metni ayristir (hap bilgi)
        id: bultenilan
        if: github.event.schedule != '13 14 * * *' && steps.bulten.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./motor/ihale-ilan-ayristir.ps1 -Yaz

      # 14.08 BULGUSU: bulten ZIP'inde IKI PDF varmis (ilanlar + SONUC ilanlari);
      # 12 MB'lik sonuc bultenini her gun cope atiyormusuz. Icinde yaklasik
      # maliyet, sozlesme bedeli, kazanan firma ve teklif sayisi var - yani
      # "bu is gercekte kaca yapiliyor" sorusunun cevabi. Ek istek YOK, ayni ZIP.
      - name: Kamu Ihale Bulteni — SONUC ilanlari (yaklasik maliyet + kazanan)
        id: bultensonuc
        if: github.event.schedule != '13 14 * * *' && steps.bulten.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./motor/ihale-sonuc-ayristir.ps1 -Yaz

      # Ham sonuc verisi 1,7 MB - siteye OZET gider (kirim medyani + rekabet).
      # Kartlar "bu is gercekte kaca yapiliyor" satirini bundan cizer.
      - name: Sonuc ilanlarindan ozet uret (karta giden veri)
        id: bultenozet
        if: github.event.schedule != '13 14 * * *' && steps.bultensonuc.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./motor/ihale-sonuc-ozet.ps1 -Yaz

      # Rakip firma analizi (firma-analizi.html): sonuc ilanlarindaki yuklenici
      # firmalari gruplayip "firma -> kazandigi ihaleler" ozeti uretir.
      - name: Rakip firma analizi ozeti
        id: firmaozet
        if: github.event.schedule != '13 14 * * *' && steps.bultensonuc.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./motor/ihale-firma-ozet.ps1 -Yaz

      # Idare analizi (idare-analizi.html): sonuc ilanlarini KURUM bazinda
      # gruplayip "idare -> actigi ihaleler, calistigi firmalar, ort teklif" ozeti.
      - name: Idare analizi ozeti
        id: idareozet
        if: github.event.schedule != '13 14 * * *' && steps.bultensonuc.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./motor/ihale-idare-ozet.ps1 -Yaz

      # TBB Risk Merkezi aylik bulten izleme (alacak-radari makro resmi katman).
      # Erken cikar; yeni bulten yoksa hizli doner. Yeni bulten cikinca Cem'e
      # "teyit et" maili atar (rakam infografik oldugu icin elle teyitli).
      - name: Risk Merkezi bulten izle
        if: github.event.schedule != '13 14 * * *'
        continue-on-error: true
        shell: pwsh
        run: ./motor/risk-merkezi-hasat.ps1

      # Marka Izleme (watch): TMview (TR) uzerinden son gunlerin marka basvurulari.
      # Istemci (marka-izleme.html) kullanicinin markasiyla benzerlik motorundan
      # eslestirir. TMview 10.000 tavani var; gunluk kosu en yeniyi ceker.
      - name: Marka izleme - yeni basvurular (TMview TR)
        if: github.event.schedule != '13 14 * * *'
        continue-on-error: true
        shell: pwsh
        run: ./motor/marka-izleme-hasat.ps1 -Yaz

      # #6 logo/gorsel benzerlik: figuratif basvurularin kucuk gorselinden dHash
      # (ImageMagick, ubuntu'da kurulu). Incremental+tavanli; istemci yuklenen
      # logoyu bununla Hamming'le karsilastirir. Indeksten SONRA kosar.
      - name: Marka logo hash (dHash - gorsel benzerlik)
        if: github.event.schedule != '13 14 * * *'
        continue-on-error: true
        shell: pwsh
        run: ./motor/marka-logo-hash.ps1 -Adet 500

      # #4 per-user watch: kullanicilarin markalarini yeni basvurulara karsi tara,
      # benzer cikaninca marka_uyari'ya yaz (panel gosterir) + RESEND acikSA mail.
      # Indeksten SONRA kosar. Anahtar yoksa kendini atlar.
      - name: Marka watch - kullanici markalari (Supabase + mail)
        if: github.event.schedule != '13 14 * * *'
        continue-on-error: true
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: ./motor/marka-watch-kullanici.ps1

      # Portfoy oto-durum: kullanici markalarinin TURKPATENT durumunu izle,
      # degisince (tescil/ret/devir) ya da yenileme yaklasinca uyar.
      - name: Marka portfoy oto-durum (Supabase + TMview)
        if: github.event.schedule != '13 14 * * *'
        continue-on-error: true
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: ./motor/marka-portfoy-durum.ps1

      - name: Bulten adimi dustuyse Cem'e haber ver
        if: steps.bulten.outcome == 'failure' || steps.bultenilan.outcome == 'failure' || steps.bultensonuc.outcome == 'failure'
        shell: pwsh
        run: |
          $p = @{ access_key='5b227e56-94fb-4123-a39a-4286f63db14a'; subject='TETIKTE - Kamu Ihale Bulteni hasadi dustu'; from_name='Tetikte Nobetci'; email='cemdizdar85@hotmail.com'; message="Kamu Ihale Bulteni adimlarindan biri dustu (hasat: ${{ steps.bulten.outcome }} / ilan: ${{ steps.bultenilan.outcome }} / sonuc: ${{ steps.bultensonuc.outcome }}). Digerleri kosmaya devam etti. Muhtemel sebep: KIK ucu GitHub IP'sini engelliyor ya da bulten metin yapisi degisti. Kosu: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" } | ConvertTo-Json
          try { Invoke-RestMethod -Uri 'https://api.web3forms.com/submit' -Method Post -ContentType 'application/json' -Body $p | Out-Null } catch { Write-Host "mail gitmedi: $($_.Exception.Message)" }

      - name: Yapisal denetci (imkansiz/celisik veri — patlarsa commit YOK)
        shell: pwsh
        run: ./arac/yapisal-denetci.ps1

      - name: Nokta-kontrol (regresyon testi — patlarsa commit YOK)
        shell: pwsh
        run: ./arac/nokta-kontrol.ps1

      - name: Degisiklik varsa yayinla
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add veri/.kaynak-hash.json 2>/dev/null || true
          git add veri/*.json
          git diff --cached --quiet || git commit -m "Kaynak nobetcisi: kaynak/veri guncellendi ($(date +%d.%m.%Y))"
          git pull --rebase || true
          git push
