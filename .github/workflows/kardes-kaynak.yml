# Kardes kaynak cikarimi — 0 USD. Konu kumelerini ELLE degil kasadan olcerek cikarir.
# Cikti motor tarafindan okunur; boylece "elle liste" tek dayanak olmaktan cikar.
name: Kardes Kaynak Cikarimi (0 USD)
on:
  push:
    paths: ['motor/kardes-kaynak-cikar.ps1', '.github/workflows/kardes-kaynak.yml']
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 2'
permissions:
  contents: write
concurrency:
  group: kardes-kaynak
  cancel-in-progress: false
jobs:
  cikar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/kardes-kaynak-cikar.ps1
      - name: Commit (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/kardes-kaynak-raporu.json ]; then echo "!! RAPOR YOK"; exit 1; fi
          git add veri/kardes-kaynak.json veri/kardes-kaynak-raporu.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Kardes kaynak kumeleri [veri-operasyonu]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 7; done
          echo "!! PUSH TUTMADI"; exit 1
