# .github/workflows/duyuru-nobetcisi.yml — KURUM DUYURU NOBETCISI + SINAV NOBETI (0 USD)
# 14.01.2026 TURMOB YK karari (0,25 goturme + hesap makinesi yasagi) RG'de
# yayimlanmadigi icin ayna goremedi - kurum duyurulari ayri kanaldi ve
# izlenmiyordu. Bu nobetci TESMER/KGK/SGK/TURKPATENT/TURMOB (+GIB kirmizi
# aday) duyurularini tarar; yeniler veri/duyuru-yeni.json'a duser.
# 05.10.2026 SINAV NOBETI (Cem "Sinav Nobeti haber hattini kuralim"):
#  - gunde 1 -> 06:15-22:15 TR arasi 2 saatte bir (GitHub cron'u saatlerce gecikebilir - olculdu: site-nobeti 3-6 sa)
#  - yeni SINAV duyurusu (baslik suzgeci) -> Cem'e mail (arac/alarm-maili.ps1, Resend)
#  - motor/sinav-nobeti.js -> veri/sinav-nobeti.json + sinav-nobeti.html (sitede kaynakli liste)
#  - Instagram gorseli bulutta BASILMAZ (artifact yok kurali); yerelde: node motor/sinav-nobeti-gorsel.js
# 09.10.2026 TELEGRAM: yeni sinav duyurusu ayni kosuda t.me/tetiktecom kanalina (motor/sinav-nobeti-telegram.js; damga
#  veri/sinav-nobeti.json'da -> ayni duyuru iki kez gitmez). Anahtar: secret TELEGRAM_BOT_TOKEN (gh secret set TELEGRAM_BOT_TOKEN).
name: Duyuru Nobetcisi (0 USD)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3-19/2 * * *'   # 06:15, 08:15 ... 22:15 TR
permissions:
  contents: write
concurrency:
  group: duyuru-nobetcisi
  cancel-in-progress: false
jobs:
  nobet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Nobet kos
        shell: pwsh
        env:
          RESEND_KEY:  ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: ./motor/duyuru-nobetcisi.ps1 -Mail
      - name: Sinav Nobeti sayfasi + Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 09.10: yeni sinav duyurusu t.me/tetiktecom'a; secret yoksa KOR yazar, dusmez
        run: node motor/sinav-nobeti.js
      - name: Sonuc commit
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/duyuru-durum.json veri/duyuru-yeni.json veri/sinav-nobeti.json sinav-nobeti.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Duyuru nobeti + Sinav Nobeti sayfasi [veri-operasyonu]"
          git pull --rebase --autostash || true
          git push || true
