# .github/workflows/kapi-tarama.yml — HAZIR SORU KAPI TARAMASI (0 USD, model çağrısı YOK)
# NEDEN (Cem 30.10): yerel kapı taramaları (ön denetim + alıntı + çizim) laptopta bellek darlığından kesiliyordu.
# Girdi: ambardaki hazır dosyalar (__hazir/*, arac/hazir-senkron.ps1). Çıktı: ambarda __kapi/<ad> (kapı çıktıları).
# Depo herkese açık → günlüğe yalnız sayı basılır, soru metni/kapı ayrıntısı depoya ve artifact'e GİRMEZ.
# Yerelde okuma: powershell -NoProfile -File arac/kapi-tarama.ps1 -Indir -Desen '<önek>' -Klasor <klasör>
name: Kapi Taramasi (0 USD)

on:
  workflow_dispatch:
    inputs:
      desen:
        description: "hazır dosya adı deseni (regex, ör. ^hazir-smmm-bicim-spk-)"
        required: true
      sinav:
        description: "ikiz havuzu için parti sınavı (SMMM / SGS / KGK)"
        required: true
        default: SMMM

permissions:
  contents: read

concurrency:
  group: kapi-tarama-${{ inputs.desen }}
  cancel-in-progress: false

jobs:
  tara:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      KASA_VAR: ${{ secrets.KASA_OKUMA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Gizli kasa (anahtar varsa)
        if: env.KASA_VAR == 'true'
        uses: actions/checkout@v4
        with:
          repository: cemdizdar85-arch/tetikte-kasa
          token: ${{ secrets.KASA_OKUMA_TOKEN }}
          path: _kasa

      - name: Kasa dosyalarini calisma agacina koy (anahtar varsa)
        if: env.KASA_VAR == 'true'
        shell: powershell
        run: |
          if(Test-Path _kasa/veri){ $n=@(Get-ChildItem _kasa/veri -Recurse -File).Count; Copy-Item -Path _kasa/veri/* -Destination veri -Recurse -Force; "kasadan kopyalanan dosya: $n" } else { "kasa bos (veri/ yok)" }

      - name: Hazir dosyalar + ikiz havuzu (ambardan)
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GIRDI_SINAV: ${{ inputs.sinav }}
        run: |
          ./arac/hazir-senkron.ps1 -Indir | Select-Object -Last 1
          if("$env:GIRDI_SINAV" -eq 'SMMM'){ ./arac/parti-senkron.ps1 -Indir -Yaz -Sinav SMMM -OnEk 'smmm-' | Select-Object -Last 2 }
          elseif("$env:GIRDI_SINAV" -eq 'KGK'){ ./arac/parti-senkron.ps1 -Indir -Yaz -Sinav KGK -OnEk 'kgk-' | Select-Object -Last 2 }
          else { ./arac/parti-senkron.ps1 -Indir -Yaz -Sinav SGS | Select-Object -Last 2 }

      - name: Kapilar
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GIRDI_DESEN: ${{ inputs.desen }}
        run: |
          ./arac/kapi-tarama.ps1 -Desen "$env:GIRDI_DESEN" -Klasor "$env:RUNNER_TEMP\kapi" -Ambar
