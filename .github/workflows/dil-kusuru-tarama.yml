# Dil kusuru taramasi — 0 USD, API yok, yazma yok.
# Cem'in taslakta yakaladigi uc dil kusurunu TEK kosuda olcer:
# uydurma sikistirilmis terim ("cok donemli"), eski terim (ozellikle kehribar
# kartta), tekrarlayan senaryo isimleri.
name: Dil Kusuru Taramasi (0 USD)
on:
  push:
    paths: ['motor/dil-kusuru-tarama.ps1', '.github/workflows/dil-kusuru-tarama.yml', 'veri/tetik/dil-kusuru.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dil-kusuru-tarama
  cancel-in-progress: false
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $yaz = ''
          if(Test-Path veri/tetik/dil-kusuru.txt){ $yaz = (Get-Content veri/tetik/dil-kusuru.txt | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim() }
          if($yaz -match 'yaz'){ ./motor/dil-kusuru-tarama.ps1 -yaz } else { ./motor/dil-kusuru-tarama.ps1 }
      - name: Commit (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          # 07.08 dersi: bot commit yagmurunda pull --rebase rapor dosyasinda
          # cakisip mid-rebase kaliyordu (16:09 vakasi). Yeni usul idempotent:
          # her denemede origin/main'e sifirla, raporu ustune koy, commit+push.
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/dil-kusuru-raporu.json ]; then echo "!! RAPOR YOK"; exit 1; fi
          cp veri/dil-kusuru-raporu.json /tmp/dil-raporu.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dil-raporu.json veri/dil-kusuru-raporu.json
            git add veri/dil-kusuru-raporu.json
            git diff --cached --quiet || git commit -m "Dil kusuru taramasi [veri-operasyonu]"
            git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          echo "!! PUSH TUTMADI"; exit 1
