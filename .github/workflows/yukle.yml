# .github/workflows/yukle.yml — MEVZUAT TAM YÜKLEME (elle tetiklenir, felaket kurtarma)
# veri/mevzuat/*.json'daki TÜM kanun madde-belgelerini Supabase 'dokumanlar'
# tablosuna baştan yükler (önce tur=kanun-madde siler, sonra toplu ekler).
# NE ZAMAN: tablo bozulursa / çift kayıt şüphesi / elle eklenen kürasyon
# dosyası (ör. 1475 kıdem m.14) ambara girecekse. Günlük işi DEĞİL —
# günlük tazeleme Kanun Aynası'nın işi (mevzuat.yml).
name: Mevzuat Tam Yukleme

on:
  workflow_dispatch:
  # ==========================================================================
  # 30.08.2026 — PUSH TETIGI KALDIRILDI (Cem onayi). ELLE TETIKLENIR.
  #
  # NEDEN: bu dosyanin KENDI BASLIGI "elle tetiklenir, felaket kurtarma,
  # gunluk isi DEGIL" diyor. Ama push tetigi yuzunden veri/mevzuat/ altina
  # yazan HER commit bu SIL-YAZ robotunu uyandiriyordu.
  #
  # OLCULEN ZARAR (30.08): rutin iki commit'im (mevzuat-kaynaklar.json ve
  # mevzuat-yut.ps1) bu akisi tetikledi, kosu 'cancelled' oldu - yani SILME
  # ile GERI YAZMA arasinda kesildi. Ambar 43.821 -> 36.014 dustu:
  #     standart-madde 8.643 -> 4.449  (-4.194)
  #     kanun-madde   33.846 -> 30.673 (-3.173)
  #     teori-notu       281 ->    223
  # Ayni sinif kiyim 27.08'de de yasanmis ve ders yaziya dokulmustu.
  # Iki kez ayni sekilde vuran bir tetik, kolaylik degil TUZAKTIR.
  #
  # Bundan sonra: Actions > "Mevzuat Tam Yukleme" > Run workflow ile ELLE.
  # Felaket kurtarma araci, felaket sebebi olmamali.
  #
  # ESKI HALI (kayit icin):
  #   push:
  #     paths: [ 'veri/mevzuat/**', 'motor/mevzuat-yukle.ps1',
  #              '.github/workflows/yukle.yml' ]
  # ==========================================================================

permissions:
  contents: read

concurrency:
  group: mevzuat-ayna          # Kanun Aynası ile aynı kuyruk: aynı tabloya yarışmasınlar
  cancel-in-progress: false

jobs:
  yukle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tam yükleme (sil + baştan ekle)
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/mevzuat-yukle.ps1
