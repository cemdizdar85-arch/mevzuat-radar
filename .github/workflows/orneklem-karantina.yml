# .github/workflows/orneklem-karantina.yml — ORNEKLEM KARANTINACISI (0 USD)
# 06.08 uc-orneklem denetiminde yakalanan kusurlu kartlari (SHA256 imzayla
# eslesip) yayindan ceker. Cem onayi #17. Varsayilan olcum; yaz=true ile ceker.
name: Orneklem Karantina (0 USD)
on:
  push:
    paths:
      - 'veri/tetik/orneklem-karantina.txt'
  workflow_dispatch:
    inputs:
      yaz: { description: 'true = gercekten yayindan cek', required: false, default: 'false' }
permissions:
  contents: write
concurrency:
  group: orneklem-karantina
  cancel-in-progress: false
jobs:
  karantina:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Karantina kos
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          $yaz = '${{ github.event.inputs.yaz }}'
          if(-not $yaz -and (Test-Path veri/tetik/orneklem-karantina.txt)){
            $yaz = (Get-Content veri/tetik/orneklem-karantina.txt | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          }
          if($yaz -match 'yaz|true'){ ./motor/orneklem-karantina.ps1 -yaz } else { ./motor/orneklem-karantina.ps1 }
      - name: Sonuc commit
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/orneklem-karantina-sonuc.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Orneklem karantina sonucu [veri-operasyonu]"
          git pull --rebase --autostash || true
          git push || true
