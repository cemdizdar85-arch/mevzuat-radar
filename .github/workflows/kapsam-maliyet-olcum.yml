# Kapsam ve maliyet olcumu — 0 USD, API yok, yazma yok.
# Cem: "benim 4.334 sorum yok, diger sorulari nasil yapacagiz?"
# Dort kapsam senaryosunda kac soru islenir ve fatura ne olur - karar icin rakam.
name: Kapsam Maliyet Olcumu (0 USD)
on:
  push:
    paths: ['motor/kapsam-maliyet-olcum.ps1', '.github/workflows/kapsam-maliyet-olcum.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kapsam-maliyet-olcum
  cancel-in-progress: false
jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/kapsam-maliyet-olcum.ps1
      - name: Commit (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/kapsam-maliyet-raporu.json ]; then echo "!! RAPOR YOK"; exit 1; fi
          git add veri/kapsam-maliyet-raporu.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Kapsam maliyet olcumu [veri-operasyonu]"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 7; done
          echo "!! PUSH TUTMADI"; exit 1
