# YONETMELIK KURTARMA (05.08) — 0 USD.
#
# NEDEN AYRI HAT: gunluk ayna ("mevzuat-ayna" grubu) OLUM SARMALINDA - son 5
# kosunun besi de 6 saat tavaninda iptal oldu (03.08 12:42'den beri), _durum
# hic commit'lenmedigi icin her kosu 650 kaynagi bastan indiriyor. 6 SMMM
# yonetmeligi o batakta sonsuza dek bekler. Bu hat: KENDI concurrency grubu,
# YALNIZ 6 kaynak, ~3 dakika. Ayni anda ayna kosarsa Supabase'e yarismasin
# diye yine de dar tutuldu: yalniz bu 6 slug'in kayitlarina dokunur.
#
# ZINCIR: indir(6) -> pdftotext -> mevzuat-yut.ps1 SADECE=6 slug (ambara da
# kendisi yukler) -> commit (json + _durum) -> _durum degisince
# yonetmelik-ambar-sayim.yml OTOMATIK kosar (yutma-kapsama kapisi).
name: Yonetmelik Kurtarma (0 USD)
on:
  push:
    paths:
      - '.github/workflows/yonetmelik-kurtar.yml'
      - 'veri/tetik/yonetmelik-kurtar.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yonetmelik-kurtar
  cancel-in-progress: false
jobs:
  kurtar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: pdftotext kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: 6 yonetmeligi hazirla (once HAZIR metin, yoksa indir)
        run: |
          set -e
          mkdir -p _txt
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          ok=0
          # 05.08 DERS: ilk kosuda 6/6 indirme BASARISIZ oldu - mevzuat.gov.tr
          # GitHub runner IP'lerini engelliyor (gunluk aynanin 2 gunluk olum
          # sarmalinin kok nedeni de bu). PDF'ler Cem'in makinesinden (TR IP)
          # indirilip veri/mevzuat-hazir/'a kondu. Once oradan alinir;
          # dosya yoksa indirme yine denenir (ilerisi icin).
          for cift in "bd-yonetmelik:16907" "smmm-disiplin-yon:7033" "smmm-sinav-yon:7043" "smmm-staj-yon:7025" "smmm-calisma-yon:4650" "smmm-odalar-yon:4649"; do
            slug="${cift%%:*}"; no="${cift##*:}"
            if [ -s "veri/mevzuat-hazir/$slug.txt" ]; then
              cp "veri/mevzuat-hazir/$slug.txt" "_txt/$slug.txt"
              echo "HAZIR $slug ($(wc -c < _txt/$slug.txt) bayt, depodan)"; ok=$((ok+1)); continue
            fi
            url="https://www.mevzuat.gov.tr/File/GeneratePdf?mevzuatNo=${no}&mevzuatTur=KurumVeKurulusYonetmeligi&mevzuatTertip=5"
            code=$(curl -s -L -o "_txt/$slug.pdf" -w "%{http_code}" -H "User-Agent: $UA" -H "Referer: https://www.mevzuat.gov.tr/" "$url" --max-time 240 || echo "000")
            if [ "$code" = "200" ] && pdftotext -enc UTF-8 "_txt/$slug.pdf" "_txt/$slug.txt"; then
              echo "OK $slug ($(wc -c < _txt/$slug.txt) bayt)"; ok=$((ok+1))
            else
              echo "INDIRME HATASI $slug (HTTP $code)"
            fi
            sleep 2
          done
          echo "hazirlanan: $ok/6"
          # SESSIZ BASARISIZLIK YASAK: hicbiri yoksa is KIRMIZI biter.
          [ "$ok" -ge 1 ] || exit 1
      - name: Yut + ambara yukle (SADECE 6 slug)
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SADECE: "bd-yonetmelik,smmm-disiplin-yon,smmm-sinav-yon,smmm-staj-yon,smmm-calisma-yon,smmm-odalar-yon"
        run: ./motor/mevzuat-yut.ps1
      - name: Commit (SESSIZ BASARISIZLIK YASAK)
        run: |
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A veri/mevzuat/ || true
          git diff --cached --quiet || git commit -m "Yonetmelik kurtarma: 6 SMMM yonetmeligi yutuldu [veri-operasyonu]"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 7; done
          echo "!! PUSH TUTMADI"; exit 1
