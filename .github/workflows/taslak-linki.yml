# .github/workflows/taslak-linki.yml — TASLAK LINK POSTACISI (0 USD)
# Ozel kovadaki denetim taslaklarina SURELI imzali link uretir ve Cem'in
# e-postasina (Resend, arac/alarm-maili.ps1 — 04.09.2026'da web3forms'tan cikti)
# gonderir. Linkler 24 saat gecerlidir; repoya YAZILMAZ (sizinti olmasin).
# Tetik dosyasinin islenmemis son satirlari dosya adlaridir.
name: Taslak Linki (0 USD)
on:
  push:
    paths:
      - 'veri/tetik/taslak-linki.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linkle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Imzali linkleri uret ve maille
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          # KOR KALMA KURALI: bu kanal hatasini da MAILLE bildirir - loglar kilitli.
          $ErrorActionPreference = 'Stop'
          function Postala([string]$konu, [string]$mesaj){
            ./arac/alarm-maili.ps1 -Konu $konu -Mesaj $mesaj -Sert
            if($LASTEXITCODE -ne 0){ throw "alarm maili gitmedi (Resend)" }
          }
          try {
            $STOR = "https://bjrleanjpyujtajmazxn.supabase.co/storage/v1"
            $SK = @{ apikey=$env:SUPABASE_SERVICE_KEY; Authorization="Bearer $($env:SUPABASE_SERVICE_KEY)"; 'Content-Type'='application/json' }
            $dosyalar = @(Get-Content veri/tetik/taslak-linki.txt -Encoding UTF8 | Where-Object { $_.Trim() -and $_ -notmatch '^#' } | Select-Object -Last 6)
            $satirlar = @()
            foreach($d in $dosyalar){
              $ad = $d.Trim()
              try {
                $r = Invoke-RestMethod -Uri "$STOR/object/sign/onarim-taslak/$ad" -Method Post -Headers $SK -Body '{"expiresIn":86400}' -TimeoutSec 60
                $url = "$STOR$($r.signedURL)"
                $satirlar += "$ad (24 saat gecerli):`n$url`n"
                Write-Host "imzalandi: $ad"
              } catch { Write-Host "IMZALANAMADI: $ad"; $satirlar += "$ad : LINK URETILEMEDI: $($_.Exception.Message)`n" }
            }
            $mesaj = "Okuma taslaklarinin linkleri (tiklayinca tarayicida acilir; 24 saat gecerli, kimseyle paylasma):`n`n" + ($satirlar -join "`n")
            Postala 'TASLAK LINKLERI - okuma turu' $mesaj
            Write-Host "MAIL GONDERILDI ($($dosyalar.Count) link)."
          } catch {
            try { Postala 'TASLAK POSTACISI HATA' ("Kanal dustu: " + $_.Exception.Message + " | satir " + $_.InvocationInfo.ScriptLineNumber) } catch {}
            throw
          }
