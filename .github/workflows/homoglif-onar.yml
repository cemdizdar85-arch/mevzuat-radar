# .github/workflows/homoglif-onar.yml — HOMOGLIF ONARIMI
# Kiril harf sizintisini deterministik duzeltir (model yok, 0 USD).
# TETIK: veri/tetik/homoglif-uygula.txt push'u -> -uygula ile YAZAR.
# Betigin kendi push'u tetiklemez (kazara yazma olmasin diye bilincli).
name: Homoglif Onarimi

on:
  workflow_dispatch:
  push:
    paths:
      - 'veri/tetik/homoglif-uygula.txt'

permissions:
  contents: write

concurrency:
  group: homoglif-onar
  cancel-in-progress: false

jobs:
  onar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Homoglifleri duzelt (-uygula)
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/homoglif-onar.ps1 -uygula
      - name: Raporu commit'le (kor kalma kurali)
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f veri/homoglif-onarim.json ]; then git add veri/homoglif-onarim.json || true; fi
          git diff --cached --quiet || git commit -m "Homoglif onarimi [veri-operasyonu]"
          git pull --rebase || true
          git push || true
