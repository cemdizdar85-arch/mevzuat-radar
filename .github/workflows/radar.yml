# Bu dosyanin GitHub'daki yolu SU OLMALI: .github/workflows/radar.yml
# (Kurulum: GitHub'da Add file -> Create new file -> yol kutusuna
#  .github/workflows/radar.yml yaz -> bu icerigi yapistir -> Commit)
name: Gunluk RG Taramasi

on:
  schedule:
    - cron: "56 0 * * *"   # 03:56 TR
  workflow_dispatch:        # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: RG taramasini calistir
        shell: pwsh
        run: ./arac/rg-tarama.ps1

      - name: Degisiklik varsa yayinla
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radar.html
          if [ -f veri/firsat-guncel.json ]; then git add veri/firsat-guncel.json || true; fi
          git diff --cached --quiet || git commit -m "Gunluk RG taramasi ($(date +%d.%m.%Y))"
          # 30.07: pull--rebase VARDI ama yine dustu - rebase ile push arasindaki
          # saniyede baska robot push'layinca yaris kaybediliyor. Denemeli dongu.
          git pull --rebase --autostash || true
          n=0; until git push; do n=$((n+1)); [ $n -ge 4 ] && exit 1; sleep 5; git pull --rebase --autostash || true; done
      # 13.08 KOR KALMA SIGORTASI (Cem: "haber beklemeden") - kirmizi kosu aninda mail
      - name: KIRMIZI NOBETCI - dususte Cem'e mail
        if: failure()
        shell: pwsh
        run: |
          $p = @{ access_key='5b227e56-94fb-4123-a39a-4286f63db14a'; subject='TETIKTE ROBOT KIRMIZI - radar dustu'; from_name='Tetikte Nobetci'; email='cemdizdar85@hotmail.com'; message="radar.yml KIRMIZI bitti. Kosu: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" } | ConvertTo-Json
          try { Invoke-RestMethod -Uri 'https://api.web3forms.com/submit' -Method Post -ContentType 'application/json' -Body $p | Out-Null } catch { Write-Host "mail gitmedi: $($_.Exception.Message)" }
