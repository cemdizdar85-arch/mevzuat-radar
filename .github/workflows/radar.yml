# Bu dosyanin GitHub'daki yolu SU OLMALI: .github/workflows/radar.yml
# (Kurulum: GitHub'da Add file -> Create new file -> yol kutusuna
#  .github/workflows/radar.yml yaz -> bu icerigi yapistir -> Commit)
name: Gunluk RG Taramasi

on:
  schedule:
    - cron: "56 0 * * *"   # 03:56 TR
  workflow_dispatch:        # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: RG taramasini calistir
        shell: pwsh
        run: ./arac/rg-tarama.ps1

      - name: Degisiklik varsa yayinla
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radar.html
          if [ -f veri/firsat-guncel.json ]; then git add veri/firsat-guncel.json || true; fi
          git diff --cached --quiet || git commit -m "Gunluk RG taramasi ($(date +%d.%m.%Y))"
          # 30.07: pull--rebase VARDI ama yine dustu - rebase ile push arasindaki
          # saniyede baska robot push'layinca yaris kaybediliyor. Denemeli dongu.
          git pull --rebase || true
          n=0; until git push; do n=$((n+1)); [ $n -ge 4 ] && exit 1; sleep 5; git pull --rebase || true; done