# Bu dosyanin GitHub'daki yolu SU OLMALI: .github/workflows/radar.yml
# (Kurulum: GitHub'da Add file -> Create new file -> yol kutusuna
#  .github/workflows/radar.yml yaz -> bu icerigi yapistir -> Commit)
name: Gunluk RG Taramasi

on:
  schedule:
    # ==========================================================================
    # 25.08 ERKEN NOBET - SIRA HATASI DUZELTMESI (zincir-haritasi.ps1 buldu)
    #
    # BULGU: bu is akisi veri/rg-destek-cagri.json'u YAZAR; kaynak.yml onu OKUR.
    # Ama cron'lar tersti - URETICI, TUKETICIDEN 43 DK SONRA zamanlanmisti:
    #     kaynak.yml  03:13 TR  (okur)
    #     radar.yml   03:56 TR  (yazar)
    # Gercek kosuda da oyle oldu (25.08): kaynak 04:49->05:04, radar 05:09.
    # Yani kaynak her sabah DUNUN havuzunu okuyordu.
    #
    # DUZELTME: mevcut nobet KALDI, oncesine bir nobet EKLENDI (22:00 UTC =
    # 01:00 TR). Ekleme yapmak, mevcut saati kaydirmaktan guvenli:
    #   * RG o saatte YAYIMLANMISSA -> havuz dolar, kaynak'in 04:49 kosusu
    #     TAZE veriyi okur. Sira duzelir.
    #   * YAYIMLANMAMISSA -> tarama 0 yeni bulur; havuz BIRIKIMLIDIR
    #     (rg-tarama.ps1 eski kayitlari okuyup birlestirir, silmez), yani
    #     KAYIP OLMAZ ve 03:56 nobeti isi eskisi gibi yapar. Bugunkunden
    #     KOTU OLAMAZ.
    # Gecikme payi: kaynak'in cron'u 00:13 UTC; bu nobet 22:00 UTC. GitHub
    # 40-100 dk geciktirse bile arada saatler var.
    #
    # AYRICA DENEY: kartlar.yml'e eklenen 01:10 TR nobetiyle ayni soruyu sorar -
    # "RG gece yarisindan hemen sonra hazir mi?" Birkac gun sonra ikisinin
    # ciktisi bu soruyu OLCUMLE cevaplayacak.
    # ==========================================================================
    - cron: "0 22 * * *"   # 01:00 TR (ertesi gun) - ERKEN nobet, kaynak.yml'den ONCE
    - cron: "56 0 * * *"   # 03:56 TR
  workflow_dispatch:        # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: RG taramasini calistir
        shell: pwsh
        run: ./arac/rg-tarama.ps1

      - name: Degisiklik varsa yayinla
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radar.html
          if [ -f veri/firsat-guncel.json ]; then git add veri/firsat-guncel.json || true; fi
          git diff --cached --quiet || git commit -m "Gunluk RG taramasi ($(date +%d.%m.%Y))"
          # 30.07: pull--rebase VARDI ama yine dustu - rebase ile push arasindaki
          # saniyede baska robot push'layinca yaris kaybediliyor. Denemeli dongu.
          git pull --rebase --autostash || true
          n=0; until git push; do n=$((n+1)); [ $n -ge 4 ] && exit 1; sleep 5; git pull --rebase --autostash || true; done
      # 13.08 KOR KALMA SIGORTASI (Cem: "haber beklemeden") - kirmizi kosu aninda mail
      - name: KIRMIZI NOBETCI - dususte Cem'e mail
        if: failure()
        shell: pwsh
        run: |
          $p = @{ access_key='5b227e56-94fb-4123-a39a-4286f63db14a'; subject='TETIKTE ROBOT KIRMIZI - radar dustu'; from_name='Tetikte Nobetci'; email='cemdizdar85@hotmail.com'; message="radar.yml KIRMIZI bitti. Kosu: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" } | ConvertTo-Json
          try { Invoke-RestMethod -Uri 'https://api.web3forms.com/submit' -Method Post -ContentType 'application/json' -Body $p | Out-Null } catch { Write-Host "mail gitmedi: $($_.Exception.Message)" }
