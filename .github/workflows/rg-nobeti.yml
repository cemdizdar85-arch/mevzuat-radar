# .github/workflows/rg-nobeti.yml — KATMAN 3'UN SON HALKASI
#
# Uc parca ayri ayri calisiyordu ama ARALARINDA BAG YOKTU:
#   madde damgasi -> hangi madde degisti biliyor
#   kasa bagi     -> hangi soru hangi maddeye dayaniyor biliyor (4.101 soru)
#   yayin kapisi  -> soruyu silmeden durdurabiliyor
# Bu is akisi zinciri kapatiyor: madde degisti -> bagli sorular yayindan cekilir.
#
# UCRETSIZDIR: API cagrisi yok, yalniz Supabase.
# Hasat is akisinin (mevzuat.yml) ARDINDAN kosar; oradaki madde-damga adimi
# veri/madde-degisim.json'u ureten adimdir.
name: RG Nobeti

on:
  workflow_dispatch:
    inputs:
      uygula:
        description: "Etkilenen sorulari gercekten yayindan ceksin mi? (kapali = yalniz olcum)"
        type: boolean
        default: false
  # 29.07 — CRON EKLENDI. Eski tetik yalniz push'tu ve madde-degisim.json'u
  # ROBOT yaziyor; GITHUB_TOKEN ile yapilan robot push'lari yeni is akisi
  # TETIKLEMEZ. Yani bu nobet fiilen HIC kosmayacakti - karne ayni tuzaktan
  # hic kosmamisti (29.07'de bulundu). Ayna 07:00/16:00 TR'de kosuyor;
  # nobet birer saat arkasindan gelir. PARA HARCAMAZ.
  # ==========================================================================
  # 25.08 - SAATE DEGIL OLAYA BAGLANDI. OLCULEN SIRA BOZUKLUGU:
  #
  # Bu nobet mevzuat.yml'nin urettigi veri/madde-degisim.json'u okur; o yuzden
  # cron'lari "aynadan biraz sonra" diye elle secilmisti (ayna 03:11, nobet
  # 03:39). AMA GitHub zamanlanmis isleri 40-100 dk GECIKTIRIYOR ve gecikme
  # her is icin FARKLI. 25.08 gecesi olculdu (TR):
  #     Kanun Aynasi   basladi 04:49
  #     RG Nobeti      basladi 05:05   <-- 16 dk sonra
  #     Kanun Aynasi'nin commit adimi ~55. dakikada (05:44 civari)
  # Yani nobet, aynanin madde-degisim.json'u YAZMASINDAN ~40 DK ONCE kosuyor
  # ve DUNUN dosyasini okuyordu. Fark BUYUYOR da: teblig damgasi artik
  # GeneratePdf kullaniyor ve o adim tek basina 34 dk suruyor.
  #
  # COZUM: takvim tahmini yerine workflow_run. Ayna BITTIGINDE koser -
  # gecikme ne olursa olsun sira GARANTI. Bu, bir bagimliligi "umut ederek"
  # degil "bildirerek" kurmaktir.
  # ==========================================================================
  workflow_run:
    workflows: ["Günlük Kanun Aynası"]
    types: [completed]
  schedule:
    # EMNIYET AGI: ayna hic kosmazsa (GitHub cron'u bazen ATLIYOR) nobet yine
    # de gunde bir bakar. Tek cron yeter; digerleri artik gereksiz cunku asil
    # tetik workflow_run.
    - cron: "45 6 * * *"    # 09:45 TR - emniyet
  push:
    paths:
      - 'veri/madde-degisim.json'
      - 'motor/rg-nobeti.ps1'

permissions:
  contents: write

concurrency:
  group: rg-nobeti
  cancel-in-progress: false

jobs:
  nobet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Nobet
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Hasat sonrasi otomatik tetikte CEKME YAPILIR - nobetin isi budur.
          # Elle tetikte varsayilan olcumdur, bilerek acilir.
          #
          # 25.08 KRITIK DUZELTME: kosul yalnizca 'push' idi. AMA robot push'lari
          # (GITHUB_TOKEN ile) yeni is akisi TETIKLEMEZ - bu zaten 29.07'de
          # ogrenilmis ve cron o yuzden eklenmisti. Sonuc: 'push' dali FIILEN
          # HIC CALISMADI, cron dali da uygula=false demek oldugu icin bu nobet
          # BUGUNE KADAR TEK BIR SORU BILE YAYINDAN CEKMEDI. Zincirin son halkasi
          # kurulmus ama BAGLANMAMISTI (bu depoda dordunc kez ayni desen).
          # workflow_run = "ayna bitti, taze madde-degisim.json hazir" demektir;
          # otomatik cekmenin DOGRU yeri burasidir.
          $uygula = ('${{ github.event_name }}' -eq 'push') -or
                    ('${{ github.event_name }}' -eq 'workflow_run') -or
                    ('${{ inputs.uygula }}' -eq 'true')
          if($uygula){ ./motor/rg-nobeti.ps1 -uygula } else { ./motor/rg-nobeti.ps1 }
          $k = $LASTEXITCODE
          # 2 = esik asildi: kirmizi degil, "insan baksin" demektir. Kosuyu
          # kirmizi yapmiyoruz ama rapor commit'lenip gorunur oluyor.
          if($k -eq 2){ Write-Host "ESIK ASILDI - cekme yapilmadi, rapora bak."; exit 0 }
          exit $k
      - name: Raporu commit'le
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f veri/rg-nobeti.json ]; then git add veri/rg-nobeti.json || true; fi
          git diff --cached --quiet || git commit -m "RG nobeti raporu [veri-operasyonu]"
          git pull --rebase --autostash || true
          git push || true
