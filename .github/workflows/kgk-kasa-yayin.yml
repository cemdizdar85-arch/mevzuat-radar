# KGK (BAGIMSIZ DENETCILIK) KASA YAYINI — AYRI IS, TEK SIRA (27.09.2026, Cem "1.2.3 ucunu de yap")
#
# NIYE: arac/kgk-kasa-yayin.ps1 modul modul Kaydir-Coz sayfasi kurar (motor/kaydir-coz.ps1); yerel makinede
# sayfa basina ~55-60 dk surdu (27.09 olcumu, 6 soruluk sayfa dahil) -> 5 modul ~5 saat. Bulutta kosar.
# SMMM esi: smmm-kasa-yayin.yml (ayni desen: tek sira, cancel-in-progress kapali, gunluge yalniz sayi).
#
# GIRDILER
#   yaz        : false (varsayilan) = KURU kosu, paket_soru'ya YAZMAZ, yalniz sayim. true = kilitli kasaya yazar (Cem onayi).
#   site_kabuk : true = kaydir/kgk/<slug>.html SORUSUZ kabuk sayfalari + arac/kasa-modu.json kurulur ve depoya
#                commit'lenir (motor/kasa-kabuk.js esdegerlik kapisi; kabuk yazilamazsa sayfa silinir, depoya soru icerigi girmez).
#                Yalniz yaz=true ile anlamli.
# BEDEL 0 — model cagrisi YOK. Gunluge soru metni basilmaz (bulut guvenligi kurali 2).
# 🚫 GORMEZ: bulutta KOSAN kgk partilerini (arac/bulut-kosan-etiketler.ps1) — yayinci onlari atlar, is bitince tekrar kosulmali.
#   Menu/index/sinav giris kapisi (site kolu) bu isin disinda.
name: KGK Kasa Yayini (0 USD)

on:
  workflow_dispatch:
    inputs:
      yaz:
        description: "true = kilitli kasaya (paket_soru, sinav=kgk) yaz. false = kuru kosu"
        required: false
        default: false
        type: boolean
      site_kabuk:
        description: "true = kaydir/kgk kabuk sayfalarini kur ve depoya commit'le (yaz=true ile)"
        required: false
        default: false
        type: boolean

concurrency:
  group: kgk-kasa-yayin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  yayin:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Guncel had tutarlarini tazele (KAPI-HAD)
        shell: powershell
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./arac/had-tutar-tarama.ps1 -YalnizHad

      - name: KGK sorularini kilitli kasaya yaz (ya da kuru kos)
        shell: powershell
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YAZ: ${{ inputs.yaz }}
          KABUK: ${{ inputs.site_kabuk }}
        run: |
          $ErrorActionPreference = 'Continue'
          $argListe = @()
          if($env:YAZ -eq 'true'){ $argListe += '-Yaz' }
          if($env:YAZ -eq 'true' -and $env:KABUK -eq 'true'){ $argListe += '-SiteKabuk' }
          "KGK kasa yayini: $(if($argListe.Count){ $argListe -join ' ' } else { 'KURU' })"
          $bas = Get-Date
          & powershell -NoProfile -File ./arac/kgk-kasa-yayin.ps1 @argListe
          $kod = $LASTEXITCODE
          "kgk kasa yayini cikis kodu: $kod · sure $([math]::Round(((Get-Date)-$bas).TotalMinutes)) dk"
          if($kod){ "::error::KGK kasa yayini dustu ($kod) - sorular ambarda duruyor"; exit $kod }

      - name: Kabuk sayfalarini depoya bas (yalniz site_kabuk)
        if: ${{ inputs.yaz && inputs.site_kabuk }}
        shell: powershell
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add kaydir/kgk arac/kasa-modu.json
          # 27.09 KILIT: kasa-modu.json'daki her kaydir/kgk satirinin sayfasi AYNI commit'te depoda olmali. Ilk kosuda
          #   sayfalar .gitignore yuzunden girmedi, liste girdi -> yayin-bas "dosya yok" ile SGS yayinini dusururdu (geri alindi).
          $liste = @((Get-Content arac/kasa-modu.json -Raw -Encoding UTF8 | ConvertFrom-Json).sayfalar | Where-Object { "$_" -like 'kaydir/kgk/*' })
          $izli = @(git ls-files kaydir/kgk) + @(git diff --staged --name-only -- kaydir/kgk)
          $eksik = @($liste | Where-Object { $izli -notcontains $_ })
          if($eksik.Count){ git reset -q; "::error::kasa-modu.json'da olup depoya girmeyen KGK sayfasi: $($eksik -join ', ') - COMMIT YOK"; exit 1 }
          git diff --staged --quiet
          if($LASTEXITCODE -eq 0){ "degisiklik yok - commit yok."; exit 0 }
          git commit -m "KGK kasa kabuk sayfalari (kgk-kasa-yayin.yml) [veri-operasyonu]"
          foreach($i in 1..3){ git pull --rebase --autostash origin main; git push; if($LASTEXITCODE -eq 0){ break }; Start-Sleep 5 }

      # 13.10.2026 (site kolu, KGK uye deneyimi; KGK koluna not dusuldu): "Soru coz" dizini (veri/soru-dizini.json -> sorular.html
      #   ders sayilari, ogrenci.html KGK modul karti, calisma-ozet.js KGK onerisi) yalniz yayin-bas.yml'de kuruluyordu; KGK kasasi
      #   bu akisla yazildiginda dizin bir sonraki SGS yayinina kadar BAYAT kaliyordu (13.10 olculdu: 10.10 dizininde FY sayfasi yoktu).
      #   Kalip yayin-bas.yml "Soru dizini" + "Degisen varsa ite" adimlari. Kurulamazsa YAYIN DURMAZ (eski dizin kalir, uyari).
      #   Yalniz yaz=true: kuru kosu kasayi degistirmez, dizin de degismez.
      - name: Soru dizini (yalniz yaz)
        if: ${{ inputs.yaz }}
        shell: bash
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node motor/soru-dizini.js || echo "::warning::soru dizini kurulamadi - eski dizin kaldi (yayin suruyor)"

      - name: Soru dizinini ite (yalniz yaz)
        if: ${{ inputs.yaz }}
        shell: powershell
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          # yayin-bas.yml 13.09 dersi: .gitattributes `merge=tetikte-robot` surucusu runner'da tanimli degilse SESSIZCE hicbir sey yapmaz
          git config merge.tetikte-robot.name "Tetikte robot ciktisi: cakismada yereldeki korunur"
          git config merge.tetikte-robot.driver true
          git add veri/soru-dizini.json
          git diff --staged --quiet
          if($LASTEXITCODE -eq 0){ "soru dizini degismedi - commit yok."; exit 0 }
          git commit -m "KGK kasa yayini: soru dizini tazelendi (kgk-kasa-yayin.yml) [veri-operasyonu]"
          $ok = $false
          foreach($i in 1..3){ git pull --rebase --autostash origin main; git push; if($LASTEXITCODE -eq 0){ $ok = $true; break }; Start-Sleep 5 }
          if(-not $ok){ "::warning::soru dizini itilemedi (3 deneme) - bir sonraki yayin-bas.yml kosusu tazeler" }
