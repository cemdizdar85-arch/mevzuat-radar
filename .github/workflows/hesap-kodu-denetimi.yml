# .github/workflows/hesap-kodu-denetimi.yml — 0 USD, API cagrisi YOK
# Kasadaki TUM hesap kodu iddialarini Tekduzen Hesap Plani'na karsi denetler.
# Cem'in "gormedigim yerlerde neler var?" sorusunun ilk cevabi.
name: Hesap Kodu Denetimi (0 USD)

on:
  push:
    paths:
      - 'motor/hesap-kodu-denetimi.ps1'
      - '.github/workflows/hesap-kodu-denetimi.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # her pazartesi 03:17 UTC - sessizce nobet tutar

permissions:
  contents: write

concurrency:
  group: hesap-kodu-denetimi
  cancel-in-progress: false

jobs:
  denetle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Denetle
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/hesap-kodu-denetimi.ps1
      - name: Raporu commit'le (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          # 03.08 dersi: eski hali her adimi "|| true" ile susturuyordu. Kosu
          # YESIL bitti, rapor hic gelmedi, kimse duymadi. Cem'in sordugu
          # "gormedigim hatayi nasil engellerim" sorusunun ta kendisi.
          # Artik: rapor yoksa VEYA push tutmazsa adim KIRMIZI biter.
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/hesap-kodu-denetimi.json ]; then
            echo "!! RAPOR URETILMEDI - script sessizce cikmis olabilir."; exit 1
          fi
          git add veri/hesap-kodu-denetimi.json
          git diff --cached --quiet || git commit -m "Hesap kodu denetimi [veri-operasyonu]"
          # push yarisi kaybedilirse 3 kez dene, yine olmazsa KIRMIZI
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push denemesi $i tutmadi, tekrar..."
            sleep 5
          done
          echo "!! PUSH TUTMADI - rapor depoya yazilamadi."; exit 1
      # 13.08 KOR KALMA SIGORTASI (Cem: "haber beklemeden") - kirmizi kosu aninda mail
      - name: KIRMIZI NOBETCI - dususte Cem'e mail
        if: failure()
        shell: pwsh
        run: |
          $p = @{ access_key='5b227e56-94fb-4123-a39a-4286f63db14a'; subject='TETIKTE ROBOT KIRMIZI - hesap-kodu-denetimi dustu'; from_name='Tetikte Nobetci'; email='cemdizdar85@hotmail.com'; message="hesap-kodu-denetimi.yml KIRMIZI bitti. Kosu: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" } | ConvertTo-Json
          try { Invoke-RestMethod -Uri 'https://api.web3forms.com/submit' -Method Post -ContentType 'application/json' -Body $p | Out-Null } catch { Write-Host "mail gitmedi: $($_.Exception.Message)" }
