# .github/workflows/kurulus-maliyet-nobeti.yml — KURULUS MALIYET NOBETCISI
#
# NEDEN VAR (08.09.2026): kurulus-nobeti.html "kaca mal olur" sorusuna 2026
# tarifeleriyle cevap veriyor (veri/kurulus-maliyet.json). Tarifeler yilbasinda
# ve bazen yil ortasinda degisir. Bu nobetci ayda iki kez kaynaklari kollar:
# PDF hash + HTML sayfada beklenen rakamlar. Degisince KIRMIZI + Cem'e mail;
# rapor veri/kurulus-maliyet-nobeti.json (kor kalma kurali: kirmizi olsa da yayinlanir).
name: Kurulus Maliyet Nobetcisi

on:
  schedule:
    - cron: "15 6 1,15 * *"    # ayin 1'i ve 15'i, 09:15 TR
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kurulus-maliyet-nobeti.yml'
      - 'motor/kurulus-maliyet-nobeti.ps1'
      - 'veri/kurulus-maliyet.json'

permissions:
  contents: write

concurrency:
  group: kurulus-maliyet-nobeti
  cancel-in-progress: false

env:
  RESEND_KEY: ${{ secrets.RESEND_KEY }}
  RESEND_FROM: ${{ secrets.RESEND_FROM }}

jobs:
  nobet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kaynaklari kolla
        id: nobet
        shell: pwsh
        run: ./motor/kurulus-maliyet-nobeti.ps1

      - name: Kirmiziysa Cem'e mail
        if: failure() && steps.nobet.outcome == 'failure'
        shell: pwsh
        run: |
          ./arac/alarm-maili.ps1 -Konu 'TETIKTE - Kurulus maliyeti kaynagi degisti (tarife?)' -Mesaj "Kurulus maliyet nobetcisi kaynakta degisim ya da inmeyen kaynak buldu. Hangi kaynak, ne bekleniyordu: veri/kurulus-maliyet-nobeti.json. Tarife degistiyse veri/kurulus-maliyet.json elle guncellenir, PDF icin motor/kurulus-maliyet-nobeti.ps1 -Taban kosulur. Kosu: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Raporu yayinla (kirmizi olsa da)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/kurulus-maliyet-nobeti.json ]; then
            echo "::warning title=kurulus maliyet nobeti rapor::rapor dosyasi yok - nobetci sona ulasamadi"
            exit 0
          fi
          git add veri/kurulus-maliyet-nobeti.json
          if git diff --cached --quiet; then
            echo "Rapor degismedi - islenecek bir sey yok."
            exit 0
          fi
          git commit -m "Kurulus maliyet nobeti raporu [veri-operasyonu]"
          for i in 1 2 3 4 5; do
            if cikti=$(git pull --rebase --autostash origin main 2>&1) && cikti2=$(git push origin HEAD:main 2>&1); then
              echo "Rapor islendi (deneme $i)."
              exit 0
            fi
            echo "::warning title=kurulus maliyet nobeti yayin $i::${cikti:0:300} ${cikti2:0:200}"
            sleep $((i * 7))
          done
          echo "::error::Kurulus maliyet nobeti raporu 5 denemede islenemedi (kor kalma)."
          exit 1
