# ============================================================================
#  AMBAR KAPILARI (CI) — laptop kapalıyken de koşan günlük ölçüm zinciri
#
#  NEDEN VAR (Cem 30.08): "bilgisayarım açık olmasa da çalışsın, tatile gitsem
#  olmayacak mı?" Günlük zincirin TAMAMI Cem'in dizüstündeydi. Ölçüldü
#  (veri/ip-olcum-raporu.md, runner IP 52.173.162.33):
#     mevzuat.gov.tr  -> HTTP 000, bağlantı bile kurulamıyor (ENGELLİ)
#     diğer 6 hedef   -> hepsi iniyor
#  Yani laptopa ZORUNLU olan tek iş mevzuat.gov.tr indirmesi. Bu dört adım
#  yalnız Supabase ile konuşuyor; burada koşabilirler ve koşmalılar.
#
#  SIRA ÖNEMLİ: kapı ENVANTERDEN ÖNCE. Envanterin "TAM MI" sütunu kapının
#  "ölçtüğüm kaynaklar" listesine bağlı; kapı koşmazsa envanter bir gün eski
#  raporu okur ve 30.08'de kapattığımız "sahte TAM" kusuru geri gelir.
#
#  SAAT: 08:00 UTC = 11:00 TR. Yerel indirici 09:30 TR'de mevzuat aynasını
#  tazeliyor; kapılar ONDAN SONRA ölçmeli, yoksa bir gün eski ambarı ölçer.
#
#  KAPI KIRMIZI DÖNSE BİLE zincir devam eder (continue-on-error): ölçüm
#  raporları YAZILMALI. Kırmızı en sonda ayrı adımda görünür - sessiz kalmaz.
# ============================================================================
name: Ambar kapilari (0 USD, laptopsuz)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ambar-kapilari.yml'
      - 'motor/butunluk-kapisi.ps1'
      - 'motor/ambar-envanteri.ps1'
      - 'motor/kaynak-kok.ps1'

permissions:
  contents: write

jobs:
  kapilar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: ANAHTAR VAR MI (yoksa olcum YAPILMAZ)
        shell: pwsh
        run: |
          if(-not $env:SUPABASE_SERVICE_KEY){
            Write-Host 'KOR: SUPABASE_SERVICE_KEY secret yok - olcum yapilamaz.'
            Write-Host '  Sessiz "temiz" DENMEZ; kosu burada durur.'
            exit 1
          }
          Write-Host 'anahtar var.'

      # 30.08 GERILEME (olculdu, ilk CI kosusunda cikti): bu adim ONCE YOKTU ve
      # envanterin "Surum olculen" sutunu 40 -> 0 dustu. Sebep: surum kapisinin
      # ciktisi veri/fabrika/surum-tazeligi-karnesi.json GITIGNORE'da; CI'da o
      # dosya olmadigi icin envanter surum sutununu HIC olcemedi ve YERELDEN
      # DAHA KOTU bir envanteri origin/main'e bastim.
      # DERS: bir adimi CI'ya tasirken GIRDISININ orada olup olmadigini da olc.
      # Cozum: surum kapisi da ayni kosuda ONCE kosar - karneyi kendisi uretir.
      # Bu mumkun cunku olculdu (ip-olcum): kgk.gov.tr runner'dan INIYOR
      # (TFRS 10 538 KB · BDS 200 1,25 MB, iki farkli runner IP'siyle).
      - name: SURUM TAZELIGI (kgk.gov.tr - runner'dan iniyor, olculdu)
        continue-on-error: true
        shell: pwsh
        run: ./motor/surum-tazeligi.ps1

      - name: ONCEKI DELIK SAYISINI SAKLA
        if: always()
        shell: pwsh
        run: |
          $onceki = -1
          if(Test-Path 'veri/butunluk-raporu.json'){
            try { $onceki = [int](Get-Content 'veri/butunluk-raporu.json' -Raw | ConvertFrom-Json).kaynak_sorunlu } catch {}
          }
          "ONCEKI_SORUNLU=$onceki" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "onceki sorunlu kaynak: $onceki"

      - name: BUTUNLUK KAPISI (tum kaynaklar)
        id: kapi
        continue-on-error: true
        shell: pwsh
        run: ./motor/butunluk-kapisi.ps1 -hepsi

      - name: AMBAR ENVANTERI (tek dogru sayfa)
        if: always()
        shell: pwsh
        run: ./motor/ambar-envanteri.ps1

      - name: VERI KATALOGU
        if: always()
        continue-on-error: true
        shell: pwsh
        run: ./motor/veri-katalogu.ps1

      - name: SAGLIK KARNESI
        if: always()
        continue-on-error: true
        shell: pwsh
        run: ./motor/saglik-karnesi.ps1

      - name: SONUCLARI DEPOYA BAS
        if: always()
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in veri/butunluk-raporu.json veri/AMBAR-ENVANTERI.md veri/saglik-karnesi.json veri/veri-katalogu.json; do
            [ -f "$f" ] && git add "$f" 2>/dev/null || true
          done
          if git diff --staged --quiet; then
            echo "degisiklik yok - commit yok."
          else
            git commit -m "Ambar kapilari (CI): butunluk + envanter tazelendi [veri-operasyonu]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi

      # 30.08 — "SUREKLI KIRMIZI KAPI, KAPI DEGILDIR" (ev kurali).
      # Ilk kosuda bu adim dustu ve DUSMEYE DEVAM EDERDI: kapi her gun 300+
      # delik buluyor (mevcut borc). Her sabah kirmizi yanan bir akis birkac
      # gunde GURULTU olur ve kimse bakmaz - yani nobetci degersizlesir.
      # Dogru olcut: borc BUYUDU MU? Sabit borc icin kirmizi yanilmaz;
      # yeni delik ciktiginda yanar. Sabit borc ayrica gorunur kalir (yazilir).
      - name: KAPI SONUCU (borc BUYUDUYSE kirmizi)
        if: always()
        shell: pwsh
        run: |
          $simdi = -1
          if(Test-Path 'veri/butunluk-raporu.json'){
            try { $simdi = [int](Get-Content 'veri/butunluk-raporu.json' -Raw | ConvertFrom-Json).kaynak_sorunlu } catch {}
          }
          $onceki = [int]"$env:ONCEKI_SORUNLU"
          Write-Host ("butunluk kapisi adimi : {0}" -f "${{ steps.kapi.outcome }}")
          Write-Host ("sorunlu kaynak        : onceki {0} -> simdi {1}" -f $onceki, $simdi)
          if($simdi -lt 0){
            Write-Host 'KOR: rapor okunamadi - "temiz" DENMEZ.'
            exit 1
          }
          if($onceki -ge 0 -and $simdi -gt $onceki){
            Write-Host ("KIRMIZI: borc BUYUDU (+{0}). Yeni delikler veri/butunluk-raporu.json is_listesi icinde." -f ($simdi-$onceki))
            exit 1
          }
          if($simdi -gt 0){
            Write-Host ("SARI (kirmizi degil): {0} sorunlu kaynak DURUYOR ama artmadi - bilinen borc." -f $simdi)
            Write-Host '  Tasnif edilmeden "kusurumuz var" da denmez, "temiz" de. Is listesi raporda.'
          } else {
            Write-Host 'YESIL: sorunlu kaynak yok.'
          }
