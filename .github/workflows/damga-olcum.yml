# ============================================================================
#  ALACAK DAMGA OLCUMU - ELLE TETIKLENIR, SALT OKUMA (29.08.2026)
#
#  2026-08-29-alacak-ret-iflas-metinden.sql goçünün BOYUTUNU basmadan once
#  olcer. Hicbir sey degistirmez - ne kasada ne depoda. Ciktisi yalniz kosu
#  kutugunde gorunur.
#
#  Neden ayri akis: bu bir NOBET degil, KARAR ONCESI OLCUM. Gunluk akisa
#  girmemeli; goç basilmadan once bir kez, basildiktan sonra bir kez kosar.
# ============================================================================
name: Alacak damga olcumu (salt okuma)

on:
  workflow_dispatch:
    inputs:
      yaz:
        description: 'DAMGALARI GERCEKTEN GUNCELLE (kapaliyken yalniz olcer, hicbir sey degistirmez)'
        type: boolean
        default: false
      kesif:
        description: 'KESIF: ret_kaldirma kovasinin icinde ne var? (yalniz analiz, damgalama YOK)'
        type: boolean
        default: false

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Damga olcumu / onarimi
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YAZ: ${{ inputs.yaz && '1' || '0' }}
          KESIF: ${{ inputs.kesif && '1' || '0' }}
        run: ./motor/alacak-damga-olcum.ps1

      # Yazma yapildiysa GERI DONUS YOLU artefakt olarak saklanir. Depoya
      # commit edilmez: icinde ilan_no listesi var, kasa disina cikmasin.
      - name: Damga yedegini artefakt olarak sakla
        if: always() && inputs.yaz
        uses: actions/upload-artifact@v4
        with:
          name: alacak-damga-yedek
          path: veri/alacak-damga-yedek.json
          if-no-files-found: warn
          retention-days: 90
