# Tablo format taramasi — 0 USD. "27 bin sorumuz var, onlarda da degistirecegiz"
# talimatinin ilk adimi: once ISI OLCMEK (kac soru, kacI deterministik 0 USD
# donusturulebilir), sonra Cem'in onayiyla donusturme.
name: Tablo Format Taramasi (0 USD)
on:
  push:
    paths: ['motor/tablo-format-tarama.ps1', '.github/workflows/tablo-format-tarama.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tablo-format-tarama
  cancel-in-progress: false
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/tablo-format-tarama.ps1
      - name: Commit (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/tablo-format-taramasi-raporu.json ]; then echo "!! RAPOR YOK"; exit 1; fi
          git add veri/tablo-format-taramasi.json veri/tablo-format-taramasi-raporu.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Tablo format taramasi [veri-operasyonu]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 7; done
          echo "!! PUSH TUTMADI"; exit 1
