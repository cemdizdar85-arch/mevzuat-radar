# .github/workflows/sinav-analiz.yml — SINAV HARITASI ANALIZ ROBOTU
# SGS kitapciklarini Claude'a PDF olarak okutur (cift okuma + hakem),
# soru basina ders/konu etiketi cikarir, sayimlari sgs-analiz.json'a yazar.
# Kosum basina en fazla 3 donem isler (maliyet/sure kontrolu) — 6 donem
# icin 2 kez calistir. Manuel tetik (Run workflow) ile kosar.
name: Sinav Analizi

on:
  # KREDI-BEKLIYOR 27.07 (kredi yuklenince ac)
  # schedule:
    #- cron: "43 3 * * *"    # 06:43 TR — gunde 2 tur (tenha dakika: :00/:30 cronlari 23.07 gecesi atlandi)
    #- cron: "43 10 * * *"   # 13:43 TR — kuyruktaki Yeterlilik kitapciklari daha hizli erisin
  workflow_dispatch:
  # PARA HARCAYAN IS AKISI. Tek kapisi emir dosyasi - betigin kendisi
  # degistiginde KOSMAZ. O tuzak bu depoda dort kez yasandi: bir yazim
  # duzeltmesi parali bir partiyi baslatiyordu.
  push:
    paths:
      - 'veri/sinav-analiz-emir.json'

permissions:
  contents: write

concurrency:
  group: sinav-analiz
  cancel-in-progress: false

jobs:
  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 29.07: kitapciklar artik modele PDF olarak GONDERILMIYOR; yerelde
      # pdftotext ile metne cevrilip metin gonderiliyor. PDF girisi sayfa
      # basina token yakiyordu ve 169 kitapcik butcenin buyuk kismini tek
      # adima gomerdi. pdftotext bedava.
      - name: pdftotext kur (poppler-utils)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Emri oku
        id: emir
        shell: pwsh
        run: |
          $y = 'veri/sinav-analiz-emir.json'
          if(-not (Test-Path $y)){ "kos=hayir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append; exit 0 }
          $e = Get-Content $y -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host ("Emir dosyasinda {0} kayit var." -f @($e.emirler).Count)
          foreach($z in $e.emirler){ Write-Host ("   #{0} onay={1} uygulandi={2} limit={3}" -f $z.no, $z.onay, $z.uygulandi, $z.limit) }
          $a = @($e.emirler | Where-Object { $_.onay -eq $true -and -not $_.uygulandi })
          if($a.Count -eq 0){ Write-Host "Bekleyen onayli emir yok - 0 USD."; "kos=hayir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append; exit 0 }
          $x = $a[0]
          Write-Host ("EMIR #{0}: {1}" -f $x.no, $x.gerekce)
          "kos=evet"                | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "no=$($x.no)"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "limit=$($x.limit)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "model=$($x.model)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sinav=$($x.sinav)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "donemmin=$($x.donem_min)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Kitapciklari analiz et (cift okuma + hakem) — PARALI
        if: steps.emir.outputs.kos == 'evet' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALIZ_LIMIT: ${{ steps.emir.outputs.limit }}
          ANALIZ_MODEL: ${{ steps.emir.outputs.model }}
          ANALIZ_SINAV: ${{ steps.emir.outputs.sinav }}
          ANALIZ_DONEM_MIN: ${{ steps.emir.outputs.donemmin }}
        run: ./motor/sinav-analiz.ps1
      - name: Emri damgala
        if: always() && steps.emir.outputs.kos == 'evet'
        shell: pwsh
        run: |
          $y = 'veri/sinav-analiz-emir.json'
          $e = Get-Content $y -Raw -Encoding UTF8 | ConvertFrom-Json
          $no = [int]'${{ steps.emir.outputs.no }}'
          foreach($x in $e.emirler){ if([int]$x.no -eq $no){ $x | Add-Member -NotePropertyName uygulandi -NotePropertyValue (Get-Date -Format 'dd.MM.yyyy HH:mm') -Force } }
          [IO.File]::WriteAllText($y, ($e | ConvertTo-Json -Depth 8), (New-Object Text.UTF8Encoding($false)))
      # 29.07 - KARNE AYNI KOSUDA YENILENIR, TETIGE GUVENILMEZ.
      # Karne is akisi "veri/sgs-analiz.json degisince kos" diye kurulmustu ama
      # o dosyayi BU ROBOT yaziyor ve GITHUB_TOKEN ile yapilan robot push'lari
      # yeni is akisi TETIKLEMEZ. Sonuc: 15 donem analiz edildi (8,23 USD),
      # karne eskimis kaldi ve yeni konular kotaya hic girmeyecekti.
      # Zincirin halkasini tetige degil, ayni kosuya bagliyoruz.
      # PARA HARCAMAZ: karne yalniz ambar okur.
      - name: Karneyi yenile (yeni konular kotaya girebilsin)
        if: always() && steps.emir.outputs.kos == 'evet'
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/konu-kaynak-karnesi.ps1
      - name: Sonuclari kaydet
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f veri/konu-kaynak-karnesi.json ]; then git add veri/konu-kaynak-karnesi.json || true; fi
          # 29.07: fatura ve LOG da commit'lenir. Kosu #13 "basarili" dondu ama
          # hicbir kitapcik islemedi; sebebi okunamadi cunku ne log ne fatura
          # commit'leniyordu. Actions loglari admin-kilitli - kanal kendi
          # kaydini tutmuyorsa kurulmus sayilmaz.
          for f in veri/sgs-analiz.json veri/smmm-analiz.json veri/sinav-arsiv.json veri/sinav-analiz-fatura.json veri/sinav-analiz-log.txt veri/sinav-analiz-emir.json; do git add "$f" 2>/dev/null || true; done
          git diff --cached --quiet || git commit -m "Sinav analizi: SGS donem etiketleme ($(TZ=Europe/Istanbul date +%d.%m.%Y))"
          git pull --rebase origin main || true
          git push || true
