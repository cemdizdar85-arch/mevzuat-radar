# Terim taramasi — 0 USD. Cem'in "sadece bu degil, benzeri her sey" itirazinin cevabi.
# Tek tek yamalamak yerine SINIFIN TAMAMINI tarar, aday listesi cikarir.
name: Terim Taramasi (0 USD)
on:
  push:
    paths: ['motor/terim-taramasi.ps1', '.github/workflows/terim-taramasi.yml']
  workflow_dispatch:
  schedule:
    - cron: '50 3 * * 3'
permissions:
  contents: write
concurrency:
  group: terim-taramasi
  cancel-in-progress: false
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/terim-taramasi.ps1
      - name: Commit (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/terim-taramasi-raporu.json ]; then echo "!! RAPOR YOK"; exit 1; fi
          git add veri/terim-adaylari.json 2>/dev/null || true
          git add veri/terim-taramasi-raporu.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Terim adaylari [veri-operasyonu]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 7; done
          echo "!! PUSH TUTMADI"; exit 1
