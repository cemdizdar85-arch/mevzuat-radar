# Formul eksik taramasi — 0 USD, kasaya yazmaz. Cem'in "formullu sorularda
# formulle anlatmak lazim, 28 bin soruyu geriye dogru duzeltelim" talimatinin
# ILK adimi: once gercek sayiyi olcmek (kac soru, hangi dersler).
name: Formul Eksik Taramasi (0 USD)
on:
  push:
    paths: ['motor/formul-eksik-tarama.ps1', '.github/workflows/formul-eksik-tarama.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: formul-eksik-tarama
  cancel-in-progress: false
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: ./motor/formul-eksik-tarama.ps1
      - name: Commit (SESSIZ BASARISIZLIK YASAK)
        if: always()
        run: |
          set -e
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -f veri/formul-eksik-taramasi-raporu.json ]; then echo "!! RAPOR YOK"; exit 1; fi
          git add veri/formul-eksik-taramasi.json 2>/dev/null || true
          git add veri/formul-eksik-taramasi-raporu.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Formul eksik taramasi [veri-operasyonu]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 7; done
          echo "!! PUSH TUTMADI"; exit 1
