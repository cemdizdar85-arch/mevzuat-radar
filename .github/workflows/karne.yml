# .github/workflows/karne.yml — KONU-KAYNAK KARNESI
#
# NEDEN VAR: karne "parali muslugun on sarti" olarak kuruldu ama IS AKISI YOKTU -
# elle kosuluyordu. Sonucu 29.07'de gorundu: 15 yeni SGS donemi analiz edildi
# (donem 20 -> 35, gercek soru 2.557 -> 4.484) ve o donemlerin konulari karnede
# YOK; karne hala 20 donemlik halini gosteriyor. Kota o karneden kuruldugu icin
# yeni konular uretime hic girmeyecekti - 8,23 USD odenmis analiz bosa gidecekti.
#
# Karnenin kendi kurali: "parali parti kosmadan ONCE bu karneye bakilir;
# KAYNAK YOK ve MEVZUAT-DISI satirlarina fabrika SOKULMAZ."
# Kural ancak karne TAZEYSE ise yarar.
#
# PARA HARCAMAZ: hicbir API cagrisi yok, yalniz Supabase okuma + yerel dosya.
name: Konu-Kaynak Karnesi

on:
  # 16.09: haftalik zamanlama - robot push'lari bu akisi tetiklemedigi icin KGK/SMMM karneleri 30.08'den beri bayat kaldi
  schedule:
    - cron: "0 0 * * 0"    # pazar 03:00 TR
  workflow_dispatch:
  push:
    paths:
      - 'veri/sgs-analiz.json'          # yeni donem analiz edildi -> karne eskidi
      - 'veri/smmm-analiz.json'
      - 'veri/kgk-analiz.json'
      - 'motor/konu-kaynak-karnesi.ps1'
      - '.github/workflows/karne.yml'   # elle tetikleme yolu (asagidaki nota bak)

# UYARI - BU TETIK TEK BASINA YETMEZ:
# GITHUB_TOKEN ile yapilan robot push'lari yeni is akisi TETIKLEMEZ. Yani
# sinav-analiz robotu veri/sgs-analiz.json'i guncelledi diye karne KENDILIGINDEN
# kosmaz; bu tuzaga 29.07'de dusuldu (analiz bitti, karne eskimis kaldi ve
# 8,23 USD'lik yeni konular kotaya girmeyecekti).
# Kalici cozum secenekleri: (a) sinav-analiz.yml'in sonuna karne adimini
# dogrudan eklemek, (b) PAT ile push. Simdilik bu dosyayi degistirip push
# etmek elle tetikleme yoludur.

permissions:
  contents: write

concurrency:
  group: karne
  cancel-in-progress: false

jobs:
  karne:
    # 16.09 (Cem "1.2.3 ucunude yap"): UC SINAV. Eskiden yalniz SGS kosuyordu; KGK ve SMMM karneleri 30.08'den beri
    # hic yenilenmedi (yerelde elle uretilmislerdi). Ayni betik KARNE_GIRDI/KARNE_CIKTI ile uc arsivi olcer.
    # max-parallel 1: uc is ayni veri/karne-log.txt'ye yazar; sirayla kosar, cakisma olmaz. KGK ~2,5 saat surer.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sinav: SGS
            girdi: sgs-analiz.json
            cikti: konu-kaynak-karnesi.json
          - sinav: SMMM
            girdi: smmm-analiz.json
            cikti: konu-kaynak-karnesi-smmm.json
          - sinav: KGK
            girdi: kgk-analiz.json
            cikti: konu-kaynak-karnesi-kgk.json
    steps:
      - uses: actions/checkout@v4
      - name: Karneyi yenile (${{ matrix.sinav }})
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KARNE_GIRDI: ${{ matrix.girdi }}
          KARNE_CIKTI: ${{ matrix.cikti }}
        run: ./motor/konu-kaynak-karnesi.ps1
      # 16.09 (Cem "1 ve 2 yap"): ders karnesi SGS karnesinden türer (dosya okur, ağ/API yok). 30.08'den beri hiçbir robot koşturmuyordu.
      - name: Ders karnesini yenile (yalnız SGS)
        if: matrix.sinav == 'SGS'
        shell: pwsh
        run: ./motor/ders-karnesi.ps1
      - name: Karneyi commit'le (${{ matrix.sinav }})
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          # Bu listeye yazilmayan dosya SESSIZCE kaybolur - is akisi yesil biter,
          # dosya uretilir, hicbir yere gitmez.
          for f in "veri/${{ matrix.cikti }}" veri/karne-log.txt $([ "${{ matrix.sinav }}" = "SGS" ] && echo veri/ders-karnesi.json); do
            if [ -f "$f" ]; then git add "$f" || true; fi
          done
          git diff --cached --quiet || git commit -m "Konu-kaynak karnesi yenilendi (${{ matrix.sinav }}) [veri-operasyonu]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i * 7))
          done
          echo "::error::Karne (${{ matrix.sinav }}) 5 denemede islenemedi"
          exit 1