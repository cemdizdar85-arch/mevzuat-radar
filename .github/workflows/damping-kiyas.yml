# Bu dosyanin GitHub'daki yolu: .github/workflows/damping-kiyas.yml
#
# DAMPING KIYAS NOBETI — "hasat yesil kostu" ile "veri tam" ayni sey degil.
#
# NEDEN VAR (30.08.2026):
# damping-hasat.ps1 aylardir YESIL kosuyordu ve 141 kayit uretiyordu. Kimse
# "kac olmali?" diye sormadigi icin, Ticaret Bakanligi'nin resmi listesindeki
# 273 satirin 132'sinin dustugu goruldu — klima, agir ticari lastik, sicak
# haddelenmis yassi celik, pet film dahil 27 urun sitede "damping onlemi yok"
# gorunuyordu. Sebep tek karakterdi: paylasilan metin okuyucusunda (?s) yoktu,
# Bakanlik'in alt alta yazdigi coklu-GTIP hucreleri BOS okunuyordu.
#
# Bu nobet o sorunun kendiliginden sorulmasi icindir:
#   ambardaki (kod,ulke) ciftleri  <->  Bakanlik listesindeki (kod,ulke) ciftleri
#
# KIRMIZI OLCUSU:
#   EKSIK > 0   : Bakanlik'ta olup bizde olmayan cift var  -> hasat kor kalmis
#   FAZLA > 0   : bizde olup Bakanlik'ta olmayan cift var  -> onlem kalkmis ya da
#                 ambarda uydurma kayit var; ikisi de insan gozu ister
#   Betik hata verirse (link bulunamadi / sayfa degismis) de KIRMIZI — sessizce
#   "kaynak yok" deyip gecmek YASAK (kor kalma kurali).
#
# NOBETCI YAZMAZ, OLCER: veri/*.json'a dokunmaz. Tazeleme isi yanveri.yml'de.
# PARA HARCAMAZ: yalniz ticaret.gov.tr'den bir sayfa + iki xlsx iner, LLM yok.
name: Damping Kiyas Nobeti

on:
  schedule:
    # 08:30 TR HER GUN — yanveri nobeti (07:20) veriyi tazeledikten sonra
    # "tazelenen sey TAM MI" diye sorar. 30.08.2026 Cem: "sorusturma gunluk yap."
    # Sebep: yeni bir damping sorusturmasi acildigi gun ithalatcinin karari
    # degisir; haftalik kontrol o gunu 6 gun geciktirir.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write   # yalniz veri/damping-pencere-bildirim.json kutugu icin (nobet verisi YAZMAZ)

jobs:
  kiyas:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kiyas (Bakanlik listesi <-> veri/gtip-damping.json)
        continue-on-error: true
        run: |
          # ONCE ESKI RAPORU SIL: rapor depoda kayitli. Betik cokerse eski dosya
          # yerinde kalir ve karar adimi onu TAZE sanip "YESIL" derdi - sessiz yalan.
          rm -f motor/cikti/damping-kiyas.json
          node motor/damping-kiyas.js 2>&1 | tee kiyas-cikti.txt

      - name: Karar + gerekirse mail
        shell: pwsh
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          $ciktiVar = Test-Path 'motor/cikti/damping-kiyas.json'
          $eksik = -1; $fazla = -1; $sEksik = $null; $sFazla = $null; $ozet = ''
          if($ciktiVar){
            $r = Get-Content 'motor/cikti/damping-kiyas.json' -Raw -Encoding UTF8 | ConvertFrom-Json
            $eksik = [int]$r.ozet.EKSIK_cift
            $fazla = [int]$r.ozet.FAZLA_cift
            # sorusturma ambari (veri/damping-sorusturma.json) — dosya yoksa null gelir
            if($null -ne $r.ozet.SORUSTURMA_EKSIK){ $sEksik = [int]$r.ozet.SORUSTURMA_EKSIK; $sFazla = [int]$r.ozet.SORUSTURMA_FAZLA }
            $sSatir = if($null -eq $sEksik){ '(ambar dosyasi YOK)' } else { "ambar $($r.ozet.sorusturma_ambar_kayit) kayit / EKSIK $sEksik / FAZLA $sFazla" }
            $ozet  = "ONLEM AMBARI`n  Bakanlik: $($r.ozet.bakanlik_satir) satir / $($r.ozet.bakanlik_kod_ulke_cifti) cift / $($r.ozet.bakanlik_urun) urun`n  Ambar   : $($r.ozet.bizim_kayit) kayit / $($r.ozet.bizim_kod_ulke_cifti) cift`n  EKSIK: $eksik  FAZLA: $fazla`n`nSORUSTURMA AMBARI`n  Bakanlik: $($r.ozet.devam_eden_sorusturma_satir) satir`n  $sSatir`n`n12 ayda suresi dolacak: $($r.ozet.on_iki_ayda_dolacak)"
          }
          $log = if(Test-Path 'kiyas-cikti.txt'){ (Get-Content 'kiyas-cikti.txt' -Raw) } else { '(cikti yok)' }

          # KOR KALMA: rapor hic uretilmediyse de kirmizi — "olcemedim" sessizce gecilmez.
          # Sorusturma ambari HENUZ YOKSA (null) o kalem kirmizi yapmaz; VARSA sifir olmali.
          $kirmizi = (-not $ciktiVar) -or ($eksik -ne 0) -or ($fazla -ne 0) `
                     -or (($null -ne $sEksik) -and (($sEksik -ne 0) -or ($sFazla -ne 0)))

          if($kirmizi){
            $konu = if(-not $ciktiVar){ 'TETIKTE KIRMIZI - damping kiyasi KOSAMADI' }
                    else { "TETIKTE KIRMIZI - damping ambari (onlem E:$eksik F:$fazla · sorusturma E:$sEksik F:$sFazla)" }
            $ornek = ''
            if($ciktiVar -and $r.eksikOrnek){ $ornek = "`n`nEKSIK ornekler:`n" + (($r.eksikOrnek | Select-Object -First 15 | ForEach-Object { "  $($_.kod) | $($_.ulke) | $($_.urun)" }) -join "`n") }
            $govde = "Damping kiyas nobeti KIRMIZI.`n`n$ozet$ornek`n`nOnarim: motor/damping-hasat.ps1 kaynaktan yeniden kosulur (yanveri-onarici -Kaynak damping -Uygula).`nKosu: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`n--- betik ciktisi ---`n$log"
            ./arac/alarm-maili.ps1 -Konu $konu -Mesaj $govde
            Write-Host "KIRMIZI - alarm adimi bitti."
            exit 1
          }
          Write-Host "YESIL - ambar Bakanlik listesiyle birebir."
          Write-Host $ozet

      # ---- NGGS BASVURU PENCERESI (takvim, kapi DEGIL) ----
      # Kesin onlem 5 yilda kalkar; yerli uretici nihai gozden gecirme talebini
      # sure bitiminden EN GEC 3 AY ONCE vermek zorundadir (Yonetmelik m.35/2).
      # O gun kacarsa onlem KENDILIGINDEN kalkar. Robot hatirlatmazsa kimse
      # hatirlamaz - 30.08 olcumu: ilk pencere 17.10.2026'da kapaniyor.
      - name: NGGS basvuru penceresi (takvim hatirlatmasi)
        if: always()
        shell: pwsh
        env:
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          node motor/damping-pencere.js --gun 60 | Tee-Object -FilePath pencere-cikti.txt
          if(-not (Test-Path 'motor/cikti/damping-pencere.json')){ Write-Host 'pencere raporu uretilemedi'; exit 0 }
          $p = Get-Content 'motor/cikti/damping-pencere.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          # GUNLUK KOSUYORUZ AMA HER GUN MAIL ATMIYORUZ.
          # Esik gunune TAM esitlik ararsak (kalan -eq 30) tek bir atlanan kosu
          # bildirimi tamamen kacirir - GitHub cron'u gecikebilir/atlayabilir.
          # Bu yuzden KUTUK tutulur: her onlem icin en son hangi esikte haber
          # verildigi yazilir; kalan gun daha kucuk bir esige DUSTUGUNDE bir kez
          # daha haber verilir. Kosu atlansa da esik kacmaz, tekrar da olmaz.
          $esikler = @(60,30,14,7,3,1)
          $kutukYol = 'veri/damping-pencere-bildirim.json'
          $kutuk = @{}
          if(Test-Path $kutukYol){
            try { (Get-Content $kutukYol -Raw -Encoding UTF8 | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $kutuk[$_.Name] = [int]$_.Value } } catch { $kutuk = @{} }
          }
          $uyar = @()
          foreach($s in $p.basvuruPenceresiAcilan){
            $kalan = [int]$s.basvurayaGun
            $uygun = @($esikler | Where-Object { $kalan -le $_ })      # kalan gunun altina dustugu esikler
            if(-not $uygun.Count){ continue }
            $simdiki = ($uygun | Measure-Object -Minimum).Minimum       # en dar esik
            $anahtar = "$($s.urun)|$($s.sureDolumu)"
            $onceki = if($kutuk.ContainsKey($anahtar)){ $kutuk[$anahtar] } else { 9999 }
            if($simdiki -lt $onceki){ $uyar += $s; $kutuk[$anahtar] = $simdiki }
          }
          if(-not $uyar.Count){ Write-Host "Pencere: yeni esige dusen onlem yok, mail atilmadi."; exit 0 }
          ($kutuk | ConvertTo-Json) | Set-Content $kutukYol -Encoding utf8
          git config user.name  "mevzuat-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add $kutukYol
          git diff --cached --quiet          # fark VARSA cikis kodu 1 dondurur
          if($LASTEXITCODE -ne 0){
            git commit -m "Damping pencere bildirim kutugu [veri-operasyonu]" | Out-Null
            git pull --rebase --autostash 2>&1 | Out-Null
            git push 2>&1 | Out-Null
          }
          $satirlar = ($uyar | ForEach-Object {
            "  $($_.basvurayaGun) GUN KALDI - son gun $($_.basvuruSonGunu) | $($_.urun) | $($_.ulkeler -join ', ') | teblig $($_.teblig) | onlemin suresi $($_.sureDolumu) tarihinde doluyor"
          }) -join "`n"
          $govde = "Dampinge karsi onlemde NIHAI GOZDEN GECIRME basvuru penceresi kapanmak uzere.`n`nYonetmelik m.35/2: talep, yururluk suresinin sona ermesinden EN GEC 3 AY ONCE Ticaret Bakanligi Ithalat Genel Mudurlugu'ne yazili verilir. Kacirilirsa onlem kendiliginden kalkar.`n`n$satirlar`n`nBu bir bilgilendirmedir; basvuruyu YERLI URETICI yapar (destek esigi: m.20/3).`nKosu: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./arac/alarm-maili.ps1 -Konu "TETIKTE TAKVIM - NGGS basvuru penceresi ($($uyar.Count) onlem)" -Mesaj $govde
