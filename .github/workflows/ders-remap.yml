name: ders-remap
# Kasadaki SGS sorularinin ders etiketini resmi TURMOB kirilimina oturtur.
# Sozluk tabanli, API'siz (ucretsiz). Gunluk kosar ki yeni tasinan sorular da
# resmi ders adini alsin.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * *"   # 02:37 TR
  push:
    paths:
      - "motor/ders-remap.ps1"

permissions:
  contents: write

concurrency:
  group: ders-remap
  cancel-in-progress: false

jobs:
  remap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Git kimligi
        run: |
          git config user.name "tetikte-robot"
          git config user.email "robot@tetikte.local"

      - name: Ders remap
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # tani sigortasi: hata olsa da log dosyasi OLUSUR ve sonraki adim commit'ler
          try {
            ./motor/ders-remap.ps1 *>&1 | Out-String | Set-Content -Path veri/ders-remap-son-log.txt
          } catch {
            "HATA: $($_ | Out-String)" | Set-Content -Path veri/ders-remap-son-log.txt
            exit 1
          }

      - name: Rapor ve log commit
        if: always()
        shell: pwsh
        run: |
          git add -A veri/
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m "robot: ders remap raporu"
            $n=0
            while($n -lt 4){
              git push; if($LASTEXITCODE -eq 0){ break }
              git pull --no-rebase -X ours; $n++
            }
          }
          exit 0
