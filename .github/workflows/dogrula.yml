          # 03.10: YARIM-TR olcum araci (Y1 yarim Turkce "borcunu", Y2 Turkce harfsiz "ogrenci"; KAPI-TR'nin <60 karakter korlugu).
          # Yalniz OLCUM, uretime/yayina bagli degil. 14 vaka; once bozulmamis oz-sinav, sonra 6 mutasyon KIRMIZI (03.10 olculdu). Ag yok.
          - { ad: "Yarim Turkce taramasi OZ-SINAVI + MUTASYON (YARIM-TR)",
              kabuk: bash, komut: "node arac/yarim-turkce-tarama.js --sinav --mutasyon" }
          # 30.09: SikSirala sik siralarken teshis/celdirici/sade'yi de tasiyor mu (aciklama kaymasi kokunun bir kismi). GORMEZ: adim ici harf atfi.
          - { ad: "SikSirala OZ-SINAVI (siralamada aciklama kaymasi yok)",
              kabuk: pwsh, komut: "./arac/siksirala-sinavi.ps1" }
          # 30.09 Cem "b yap": aciklama hakemi yeni uretime bagli. Yeni/eski ayrimi, aday secimi, secim kurali, butce freni (ag/para yok)
          # + karar yaziminin baska alana dokunmamasi. GORMEZ: gercek toplu gonderim/hasat.
          - { ad: "Aciklama hakemi uretim baglantisi OZ-SINAVI",
              kabuk: pwsh, komut: "./arac/aciklama-hakemi-uretim-sinavi.ps1" }
          - { ad: "Aciklama hakemi uretim baglantisi MUTASYON (3 kural bozulunca sinav duser mi)",
              kabuk: pwsh, komut: "./arac/aciklama-hakemi-uretim-sinavi.ps1 -Mutasyon" }
          - { ad: "Aciklama hakemi karar yazimi OZ-SINAVI (diziler/BOM korunur, baska alan degismez)",
              kabuk: bash, komut: "node arac/aciklama-hakem-yaz.js --sinav" }
          # 26.09 kisa sinav / en cok cikanlar (mobil/uygulama/uygulama-karma.js): soru secimi dengeli mi,
          # tekrar yok mu, cevap sorunun gercek dersine mi yaziliyor, 1000+ satir sayfalaniyor mu. GORMEZ: RLS/ag.
          - { ad: "Mobil kisa sinav secimi OZ-SINAVI",
              kabuk: bash, komut: "node mobil/karma-sinavi.js" }
          - { ad: "Mobil kisa sinav MUTASYON (denge/sayfalama bozulunca sinav duser mi)",
              kabuk: bash, komut: "! KR_MUTASYON=denge node mobil/karma-sinavi.js && ! KR_MUTASYON=sayfalama node mobil/karma-sinavi.js" }
          # 24.09 (Cem "1 ve 3 yap"): fark.html "30.000'den fazla", tuzak.html "29.000'den fazla soru"
          # yaziyordu; sitede 7.117 soru vardi (Ticari Reklam Yon. m.9: ispat reklam verende).
          # Yayindaki soru sayisi iddiasini kaydir/<sinav>/index.html ile kiyaslar. Her push'ta
          # kosar: yayindan soru cekilip sayi duserse eski dogru cumle de KIRMIZI olur.
          # GORMEZ: gorseldeki yazi, JS ile kurulan sayi, depo disi metin (dosya basinda tam liste).
          - { ad: "Sayi iddiasi kapisi (sitede yazan soru sayisi gercek mi)",
              kabuk: bash, komut: "node arac/sayi-iddia-kapisi.js" }
          - { ad: "Sayi iddiasi kapisi OZ-SINAVI",
              kabuk: bash, komut: "node arac/sayi-iddia-kapisi.js --sinav" }
          # 29.09 (Cem "reklam metni kapisini kur"): pazarlama/reklam/*.md - yasak soz,
          # "Reklam" ve YZ ibaresi, kurum adi, canli deneme uyarisi, soru sayisi iddiasi.
          # GORMEZ: dosyaya yazilmamis gorsel yazisi, Meta paneline elle yazilan metin.
          - { ad: "Reklam metni kapisi (Instagram/Meta reklam metni)",
              kabuk: bash, komut: "node arac/reklam-metni-kapisi.js" }
          - { ad: "Reklam metni kapisi OZ-SINAVI",
              kabuk: bash, komut: "node arac/reklam-metni-kapisi.js --sinav" }
          - { ad: "Reklam metni kapisi MUTASYON (her kural bozulunca oz-sinav dusmeli)",
              kabuk: bash, komut: "for m in kelime kurum reklam yz sayi gec beyan yorum; do ! REK_MUTASYON=$m node arac/reklam-metni-kapisi.js --sinav >/dev/null || exit 1; done" }

          # 29.08 (Cem "2 yap"): kurulu kapilarin hicbiri "bu sayfa gercekten
          # aciliyor mu" diye sormuyordu. Kontrast kapisi RENGI, koku olcer
          # DILI, renk sabiti KAYNAK METNI denetler. O gun marka-rapor.html'in
          # kagit div'inde IKI id oldugu icin sayfanin acilmadigi ortaya cikti
          # (sonsuza kadar "Rapor yukleniyor..."), ayni kusur marka-app ve
          # evrak-app'te de vardi. Uc kapi da yesil koşuyordu.
          # Bu kapi her sayfayi ACAR: yakalanmamis hata / asili kalan yuklenme
          # metni / izinsiz dis kaynak / 404 alt kaynak arar.
          - { ad: "Acilis kapisi (sayfa gercekten aciliyor mu)",
              kabuk: bash, komut: "node arac/acilis-kapisi.js",
              rapor: "veri/acilis-raporu.json" }

          # 01.10 (Cem "1.2.3 ucunu de yap"): 7a42436b'deki uzun fiyat satiri satin-al.html'de
          # telefonda fiyat sutununu 441px'e tasirdi ("2.490 T..." kesik); sayfa yana KAYMIYORDU,
          # hicbir kapi telefona bakmiyordu, elle olcumde bulundu. Bu kapi koku .html'leri 375px
          # mobil oykunmeyle acar: A) sayfa yana kayiyor mu B) icerik kesik mi. CIRCIR:
          # veri/mobil-tasma-taban.json (01.10: 66 sayfanin 2'si, kartlar + toplu-gtip).
          # Gercek vakayla olculdu: 7a42436b surumu KIRMIZI, duzeltilmis surum YESIL.
          # GORMEZ: 375 disi genislik, tiklayinca acilan icerik, kaydir/ alti (dosya basinda tam liste).
          - { ad: "Mobil tasma kapisi (telefonda 375px icerik kesik mi)",
              kabuk: bash, komut: "node arac/mobil-tasma-kapisi.js",
              rapor: "veri/mobil-tasma-raporu.json" }
          # 9 vaka (5'i yanlis alarm vakasi); 6 mutasyon (esik, kaydirilabilir kap, tam gizli slayt,
          # fixed, bos sus, yatay kayma) her birinde KIRMIZI (01.10 yerelde olculdu).
          - { ad: "Mobil tasma kapisi OZ-SINAVI + MUTASYON",
              kabuk: bash, komut: "node arac/mobil-tasma-kapisi.js --sinav --mutasyon" }
          # 03.10 (Cem "1.2.3"): canli tarama robotunun (canli-tarama.yml) oz-sinavi - 10 vaka (temiz, tasma,
          # alt menu ORTME = 03.10 ana sayfa vakasi, eksik oge, JS hatasi, menu yeri, eski/yeni kalip,
          # Nobetci akisi saglam/kancasiz); 7 mutasyonun 7'si KIRMIZI (03.10 yerelde olculdu). data: sayfalar, ag gerekmez.
          - { ad: "Canli tarama OZ-SINAVI + MUTASYON",
              kabuk: bash, komut: "node motor/canli-tarama.js --sinav --mutasyon" }
          # 03.10: sure-nobeti.yml oz-sinavi - 6 vaka (sabit, hizlanma, 2,5 kat ALARM, kucuk adim gurultusu, +16 dk ama 2 kat alti,
          # gecmis yetersiz KOR); 2 mutasyon (kat, esik) KIRMIZI (03.10 yerelde olculdu). Ag gerekmez.
          - { ad: "Sure nobetcisi OZ-SINAVI + MUTASYON",
              kabuk: bash, komut: "node motor/sure-nobetcisi.js --sinav --mutasyon" }

          # 04.10 (Cem "1.2 yap"): vitrin EKSIK BASIM kapisi (secim 70 / sayfa 66 olayi) + havuz omru. 12 vaka;
          # mutasyon VK_MUTASYON=esit (kiyas hep tamam) -> sinav KIRMIZI olmali (04.10 yerelde olculdu: cikis 2).
          - { ad: "Vitrin kart OZ-SINAVI + MUTASYON",
              kabuk: bash, komut: "node motor/vitrin-kart.js --sinav && ! VK_MUTASYON=esit node motor/vitrin-kart.js --sinav && ! VK_MUTASYON=kucuk node motor/vitrin-kart.js --sinav" }

          # 12.09 (Cem "1.2.3 ucunu de yap"): ana sayfanin Nobetci kutusu
          # "son robot kosusu 07.09 - 5 gun once" yazip KIRMIZI yandi. ROBOT
          # HIC GUN ATLAMAMISTI: damga izi 04.09-12.09 gunde iki kosu, bosluk
          # yok; canli dosya 12.09 09:20'ydi. Ekrandaki govde 07.09 21:49'du
          # (parmak izi rg_karti=2, yalniz o tek commit'te). Kok neden: sayfa
          # veriyi acilista BIR KEZ cekiyor ama bayatlik hukmunu O ANKI SAATLE
          # kuruyordu - tarayicida kalmis eski kopya robotu SUCLUYORDU.
          # Uc tur bu yanlis teshise gitti.
          # Uc sayfa duzeltildi (index/pano/durum, ortak motor tazelik.js);
          # bu kapi DORDUNCUSUNU onluyor. Kural yorumda kalirsa unutulur -
          # bugun tam bu yuzden unutulmustu.
          # Taban: veri/tazelik-borcu.json (8 sayfa SARI, is emri). Defterde
          # OLMAYAN yeni ihlal KIRMIZI. Bedel 0 - yalniz dosya okur.
          - { ad: "Tazelik kapisi (iddia ile kanit ayni anda tazelenir)",
              kabuk: bash, komut: "node arac/tazelik-kapisi.js" }

          # 30.08: damping oranlari kaynak Excel'den UC AYRI bicimde iniyor
          # ("%38,26-%45,99" / "21,12%-28,87%" / "0.29" = Excel ondaligi %29).
          # Okuyucu yalnizca birincisini taniyordu; 141 kaydin 30'u SESSIZCE
          # sifir sayiliyor, 140 GTIP kodunda "damping yok" gorunuyordu. En
          # buyugu %56,50 (Cin, 8415.83 klima, teblig 2022/1) - arac cezali
          # menseyi "en avantajli" diye oneriyordu. Bu kapi yeni bir bicim
          # girerse KIRMIZI yanar; sessiz sifira geri donulmesin.
          # 07.09: kapi kutugunu (4. katman) yaziyordu ama rapor alani bos oldugu
          # icin yayinlanmiyordu; sebep runner'da kayboluyordu. Artik yayinlanir.
          - { ad: "Damping oran kapisi (okunamayan onlem orani kalmasin)",
              kabuk: bash, komut: "node arac/damping-oran-kapisi.js",
              rapor: "veri/damping-oran-log.txt" }

          # 08.10.2026 KAYNAK ETIKETI (?k=) - gruplara/Instagram'a atilan linkten kac ziyaret / test / uye geldi.
          # Anon yazma yolu actigi icin (acilis guvenlik denetimi 2.6) iki taraf da sinanir:
          #  - istemci: menu.js KAYNAK-ETIKETI blogu sahte tarayicida (etiketsiz -> 0 istek, suzgec, oturumda 1,
          #    30 gun, uyelik <= 2 gun + jeton) + 8 mutasyon
          #  - sunucu: goc GERCEK Postgres'te (runner'da kurulu), gercek anon/authenticated rolleriyle + 10 mutasyon
          - { ad: "Kaynak etiketi istemci OZ-SINAVI",
              kabuk: bash, komut: "node arac/kaynak-etiketi-sinavi.js" }
          - { ad: "Kaynak etiketi istemci MUTASYON (her bozma kirmizi)",
              kabuk: bash, komut: "node arac/kaynak-etiketi-sinavi.js --mutasyon" }
          - { ad: "Kaynak sayaci sunucu OZ-SINAVI + MUTASYON (Postgres)",
              kabuk: bash, komut: "bash arac/kaynak-sayac-sinavi.sh" }

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # diff-bekcisi HEAD~1 ile kiyas yapar

      # Kabuk matristen geliyor. Tek adimda "shell: ${{ }}" yazmak yerine iki
      # ayri adim + if kullanildi: shell alaninda ifade destegi surume bagli,
      # bu yol her surumde calisir ve gunlukte hangi kabugun kostugu gorunur.
      - name: "Denetci (pwsh)"
        if: matrix.kapi.kabuk == 'pwsh'
        shell: pwsh
        run: ${{ matrix.kapi.komut }}

      - name: "Denetci (bash)"
        if: matrix.kapi.kabuk == 'bash'
        shell: bash
        run: ${{ matrix.kapi.komut }}

      # KOR KALMA: kapi kirmizi olsa da raporu yayinlanir. Yoksa CI'da
      # dustugunde sebebini yalniz depo yoneticisi gorebiliyor.
      - name: "Raporu yayinla (kirmizi olsa da)"
        if: always() && matrix.kapi.rapor != ''
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "${{ matrix.kapi.rapor }}" || true
          git diff --cached --quiet || git commit -m "Kontrast raporu [veri-operasyonu]"
          git pull --rebase --autostash || true
          git push || true
