# Bu dosyanin GitHub'daki yolu: .github/workflows/dogrula.yml
# DOGRULAMA KAPISI (Katman 1): HER push'ta butun denetciler kosar.
# Amac: yanlis/celisik veri ana dala girer girmez KIRMIZI X + Cem'e mail.
# (Onceden dogrulama yalniz robotun gunluk isinde vardi; elle push'lar denetimsizdi.)
#
# ============================================================================
# 25.08 — TEK IS, ON BIR ADIM  ->  ON IKI BAGIMSIZ IS
#
# NEDEN DEGISTI
# Hepsi TEK bir isin ardisik adimlariydi. GitHub bir adim duserse ardindakileri
# CALISTIRMAZ, "skipped" gecer. O gun tam olarak bu oldu:
#   10. adim (veri bekcisi) sahte alarmla dustu
#   -> 11-14 arasi adimlar hic kosmadi: koku olcer, otomasyon denetimi ve
#      ayni gun kurulan IKI GORUNUM KAPISI.
# Yani sekiz saat boyunca dort kapi VARDI ama YOKTU. Daha kotusu: kapi
# 19.08'den beri kirmiziydi ve kalici kirmizi olunca kimse bakmiyordu.
#
# SIMDIKI YAPI
# Her denetci KENDI isinde kosar, "fail-fast: false" ile birbirini iptal
# etmez. Bir kapi kirmizi olsa bile digerlerinin sonucunu GORURSUN; hangi
# kapinin dustugu is listesinde tek bakista okunur.
#
# BEDELI: her is ayri checkout yapar (~10 sn). Depo PUBLIC oldugu icin
# Actions dakikasi bedava; kazanc paralel kostuklari icin toplam sure de
# kisaliyor. Kaybedilen sey yok.
#
# YENI DENETCI EKLEMEK: asagidaki "kapilar" matrisine bir satir ekle.
#   - { ad: "...", kabuk: pwsh, komut: "./arac/yeni-denetci.ps1" }
# Eklendikten SONRA kosuyu acip o isin gercekten kostugunu gor - kapiyi
# kurmak kostugu anlamina gelmez.
# ============================================================================
name: Dogrulama Kapisi

on:
  push:
    branches: [ main ]     # SIR BEKCISI her push'ta calissin diye paths filtresi kaldirildi
  workflow_dispatch:

# 30.08 OLCUMU: bu akis her push'ta kosuyor ve 13 is birden aciyor. O gun
# arka arkaya 10+ push atildi; kosular ust uste bindi, birbirinin adimlarini
# yarida kesti ve API'de conclusion'i BOS ("") isler birakti - yani "dustu mu,
# iptal mi oldu" ayirt edilemiyordu. Kapinin kendisi de okunamaz hale geliyor.
#
# Ayni dal icin tek kosu yeter: son push'un durumu gecerli olandir, aradaki
# ara durumlar zaten yayinlanmiyor. Yenisi eskisini iptal eder.
#
# NOT: burada cancel-in-progress DOGRU secim, cunku bu akis VERI YAZMIYOR -
# yalniz denetliyor ve rapor birakiyor. Veri yazan akislarda (kaynak.yml,
# ihale-yutma) iptal etmek yarim is birakirdi; oralarda cancel-in-progress
# KAPALI ve concurrency yalniz siraya sokmak icin kullaniliyor.
concurrency:
  group: dogrula-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Sir bekcisi ayri duruyor: satir ici cok satirli bash betigi, matrise
  #     sigmaz. Depo PUBLIC oldugu icin bu kapi en kritik olanidir.
  sir-bekcisi:
    name: "Sir bekcisi (anahtar sizintisi — depo PUBLIC!)"
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Anahtar sizinti taramasi
        run: |
          # API anahtari / servis anahtari / uzun JWT desenleri tracked dosyalarda aranir.
          # sb_publishable_ anahtari kasten HARIC: o publishable'dir, sitede acik durur.
          #
          # 17.08 DUZELTME - 'service_role' KELIMESI desenden CIKARILDI.
          # Kapi en az 6 kosudur (#1192-#1197) kirmizi bitiyordu ve sebebi tek bir
          # SEY DEGILDI: veri/sql-marka-uyari.sql + sql-marka-durum.sql icindeki
          # UC ACIKLAMA SATIRI ("-- Yazma yalniz service_role (robot) ile").
          # service_role, Supabase'in hazir POSTGRES ROL ADI; sizabilecek sey rolun
          # adi degil ANAHTARI. Anahtarin iki bicimi var, ikisi de kapsanir:
          #   - eski tip: JWT (asagidaki eyJhbGciOi... deseni)
          #   - yeni tip: sb_secret_... (bu turda EKLENDI; simdilik 0 bulgu)
          # Surekli kirmizi kapi kapi degildir - kimse okumaz. Kelime yerine
          # ANAHTAR BICIMI aranir; kapsama daralmiyor, yanlis alarm bitiyor.
          desenler='sk-ant-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|re_[A-Za-z0-9]{20,}|eyJhbGciOi[A-Za-z0-9_-]{60,}\.[A-Za-z0-9_-]{60,}\.[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}'
          bulunan=$(git grep -I -nE "$desenler" -- . ':!*.md' ':!.github/workflows/dogrula.yml' || true)
          if [ -n "$bulunan" ]; then
            echo "SIR BEKCISI KIRMIZI — olasi anahtar sizintisi:"
            echo "$bulunan"
            exit 1
          fi
          echo "Sir bekcisi temiz."

  # --- geri kalan on denetci: her biri kendi isinde, birbirinden bagimsiz
  kapilar:
    name: ${{ matrix.kapi.ad }}
    runs-on: ubuntu-latest
    permissions:
      contents: write     # yalniz "rapor" alani olan kapi depoya yazar
    strategy:
      fail-fast: false     # BIRI DUSSE DIGERLERI YINE OLCSUN - bu dosyanin varlik sebebi
      matrix:
        kapi:
          - { ad: "Diff bekcisi (kazayla veri silme freni)",
              kabuk: pwsh, komut: "./arac/diff-bekcisi.ps1" }

          - { ad: "Yapisal denetci (imkansiz/celisik veri)",
              kabuk: pwsh, komut: "./arac/yapisal-denetci.ps1" }

          # 21.09.2026 - KAPININ KENDI OZ-SINAVI. Yapisal denetci Kural 1'i
          # sabit bir "ikincil kaynak" LISTESIYLE uyguluyor; o liste mesru
          # veriyle cakisabilir. Nitekim cakisti: ihale-firma-ozet.json'daki
          # 19.724 firmadan ikisi KPMG ve PwC olunca denetci firmanin ADINI
          # kaynak sandi, "Degisiklik varsa yayinla" adimi 4 gun hic calismadi
          # ve o kosularin tum hasadi kayboldu. Duzeltme ad alanlarini tarama
          # disi birakti; bu sinav duzeltmenin kapiyi ZAYIFLATMADIGINI olcer
          # (ad alaninda gecer, kaynak/not/url alaninda YAKALAR - 10 vaka).
          - { ad: "Yapisal denetci OZ-SINAVI (ad alani != kaynak)",
              kabuk: pwsh, komut: "./arac/yapisal-denetci-sinavi.ps1" }

          # 21.09.2026 - Nobetcinin kendi korlugu icin sinav. "Ust uste N
          # kirmizi" olcusu ilk yesilde duruyordu; kaynak.yml'in "F S F S F S
          # F S F S" deseninde seri hep 1'de kaldi ve 5 gunluk ariza hic
          # gorulmedi. Oran olcusu eklendi; bu sinav ikisinin de calistigini
          # VE yanlis alarm uretmedigini olcer (10 vaka).
          - { ad: "CI kirmizi nobetcisi OZ-SINAVI (donusumlu ariza korlugu)",
              kabuk: pwsh, komut: "./arac/ci-kirmizi-nobetcisi-sinavi.ps1" }

          # 21.09.2026 - Sayacin kendi sinavi. Dayanak alintisi sayaci 20.09'da
          # kuruldu, "olcuyorum" dedi; 21.09'da olculdu ki karsilastirmayi BOS
          # METINLE yapiyordu (baktigi alan modelin cevabinda hic yoktu). w5
          # kosusunda 277 denemenin 277'si AL-TUTMAZ, AL-TAM sifir cikti ve bu
          # "model uyduruyor" gibi okunabilirdi. Sinav GERCEK fonksiyonu AST ile
          # cikarip kosar (replika YASAK) ve bos paketin artik AL-OLCULEMEDI
          # dondugunu dogrular - 10 vaka, yakalama + yanlis alarm birlikte.
          - { ad: "Dayanak alintisi sayaci OZ-SINAVI (bos paket != TUTMAZ)",
              kabuk: pwsh, komut: "./arac/alinti-sayaci-sinavi.ps1" }

          # 21.09.2026 - Kapi bir LISTEYLE calisiyor, liste mesru veriyle cakisabilir
          # (kural md. 5). Burada cakisma somut: "kaynak reddi almis konu" ile "calisan
          # konu" ayni olabilir. Olculdu - sartsiz "kaynak reddi >= 2" deseydik 120 konu
          # duserdi ve bunlarin 215 YAYINA GIRMIS sorusu vardi. Kapi "VE yayina giren = 0"
          # sartiyla kuruldu; bu sinav o sartin yerinde durdugunu olcer (11 vaka, 5'i
          # yanlis alarm vakasi). GERCEK fonksiyon AST ile cikarilip kosulur.
          - { ad: "Kisir/kaynak-borcu secimi OZ-SINAVI (calisan konuyu dusurmez)",
              kabuk: pwsh, komut: "./arac/kisir-konu-sinavi.ps1" }

          # 22.09.2026 - Ders eslemesi bir AD YAZIMI yuzunden 58 odenmis soruyu ambara
          # sokmadi: 439 parti etiketinin 5'i ('-vergi'/'-hukuk' yazimli) cozulemiyordu ve
          # yayinci onlari sessizce "ders cozulemedi" diye dusuruyordu. Harita artik tek
          # dosyada; bu sinav hem 24 vakayi hem YEREL ETIKETLERIN TAMAMINI tarar ve
          # cozulemeyeni KOR diye bildirir (kapsam olcusu).
          - { ad: "SMMM ders adi OZ-SINAVI (etiket -> ders, kapsam dahil)",
              kabuk: pwsh, komut: "./arac/smmm-ders-adi-sinavi.ps1" }

          # 22.09.2026 - Ikiz olcusu artik HEM uretimde HEM yayinda ayni dosyadan geliyor.
          # Onceden iki ayri cetvel vardi: yayin ucyu harf + soru VE dogru sik, uretim ise
          # >=4 harfli kelime + yalniz soru. Olculdu - yayinin ikiz saydigi 78 ciftte uretim
          # cetveli 0,33'e kadar iniyordu; ambara girmeyen 107 sorunun 24'unu yalniz yayin
          # cetveli yakaliyordu (yazildi, hakemden gecti, parasi odendi, sonra elendi).
          # Sinav 11 vaka: yakalama + yanlis alarm + sinir + on suzgec esiginin guvenli olmasi.
          # 24.09.2026: +9 vaka ANLAMCA IKIZ (IkizAnlamMi: ayni ders+konu+ilk kaynak, soru>=0,40, dogru sik>=0,60,
          # sik yazili ve rakamlari ayni). Mutasyonla olculdu: rakam/harf/grup/sik/soru sarti kaldirilinca KIRMIZI (5/5).
          - { ad: "Ikiz olcusu OZ-SINAVI (uretim ve yayin TEK cetvel)",
              kabuk: pwsh, komut: "./arac/ikiz-olcusu-sinavi.ps1" }

          # 24.09.2026 - Uretimde ANLAMCA IKIZ (KAPI-B): kalip-parti-uret.ps1 CALISTIRILMAZ (para harcar); gercek
          # BenzerlikKusur AST ile yuklenir, sahte parti/havuz/ambar paketiyle cagrilir. 7 vaka. Mutasyonla olculdu:
          # havuz kontrolu / parti kontrolu / ambar paketi yedegi kaldirilinca KIRMIZI (3/3).
          - { ad: "Uretim ikiz kapisi OZ-SINAVI (anlamca ikiz hakemden once dursun)",
              kabuk: pwsh, komut: "./arac/uretim-ikiz-sinavi.ps1" }

          # 24.09.2026 - KAPI-KC: bitirme sorusu Kaydir-Coz alanlari (her sik aciklamasi, yanlis sik teshisi, sade,
          # adimlar, dayanak) eksiksiz degilse yayina girmez. Esdegerlik (butun SMMM taslaklari): yalniz sitede eksik
          # bulunan 11 soruyu dusurdu, fazlasi 0. Mutasyonla olculdu: aciklama/teshis/dayanak kontrolu kaldirilinca ve
          # ", dizi" donusu (K3) yazilinca KIRMIZI (4/4).
          - { ad: "Kaydir-Coz eksiksizlik kapisi OZ-SINAVI (Nobetci bos kart gostermesin)",
              kabuk: pwsh, komut: "./arac/kc-kapisi-sinavi.ps1" }

          # 23.09.2026 - Kor kapisi PARA harcayan ureticinin ortasinda duruyor. Olculdu:
          # kor cozum 262 soruda cevap anahtarindan farkli buldu, sonra yine 2. hakem (261),
          # adimlar (157), simulasyon (153) odendi - yayina giren 0. Kapi gevserse ayni para
          # yine yanar, sikilasirsa saglam soru anlatimsiz kalir. 11 vaka: SGS'ye dokunmama +
          # durdurmasi gereken + durdurmamasi gereken + bayat kaynakli + onay sonrasi degisen soru.
          - { ad: "Kor kapisi OZ-SINAVI (yanlisligi belli soruya para verme)",
              kabuk: pwsh, komut: "./arac/kor-kapisi-sinavi.ps1" }

          # 23.09.2026 - Odenmis is kaydi. 04:04-04:12 UTC GitHub makineleri coktu, 12 basim
          # kosusu dustu; parti kayitlari yalniz makinede oldugu icin w9/w10'un odenmis sonuclari
          # sahipsiz kaldi. Kayit artik gonderildigi anda ambara, parti basina AYRI satira yaziliyor
          # (tek satirda 12 kosu birbirini ezerdi). Sinav: govde dogru mu, soru metni tasimiyor mu,
          # birlestirme hic kayit kaybetmiyor mu - 9 vaka.
          - { ad: "Bekleyen parti ambar kaydi OZ-SINAVI (cokuste odenmis is kaybolmasin)",
              kabuk: pwsh, komut: "./arac/bekleyen-ambar-sinavi.ps1" }

          # 23.09.2026 - Coken kosunun bedeli. Harcama kosunun BELLEGINDE birikiyor, deftere
          # yalniz sonda yaziliyordu; 04:04 cokusunde w9/w10 hic satir yazamadi, butce kapisi
          # o planlari 0 USD sayip yeniden izin verdi. Artik ara kayit + kapatici var. Sinav:
          # anahtar (faz eki atilir, halkalar ayri), govde (SISTEM, soru metni yok), kapatici
          # karari (yalniz kapanmamis + eski + tutarli kayit; kosmakta olana dokunmaz) - 13 vaka.
          - { ad: "Bedel ara kaydi OZ-SINAVI (coken kosunun harcamasi deftere girsin)",
              kabuk: pwsh, komut: "./arac/bedel-ara-sinavi.ps1" }

          # 23.09.2026 - Dalga dongusu KONU DENETIMI (CLAUDE.md SINAV kurali 7). Cem'e gosterilen
          # "DENETIM:" satirini bu denetim uretir; bozulursa sessizce YESIL der, para yanlis konuya
          # gider. GERCEK betik -DenetimKok ile gecici klasorde kosulur (replika yok). 14 vaka:
          # 9 ihlal turu tek tek + 4 yanlis alarm (Turkce harf, tam sinir, y-onekli ders) + silme.
          # Mutasyonla olculdu: ESKI kontrolu / asim kontrolu / silme kapatilinca sinav KIRMIZI.
          - { ad: "SMMM dalga konu denetimi OZ-SINAVI (yanlis konuya dalga acilmasin)",
              kabuk: pwsh, komut: "./arac/smmm-dalga-dongu-sinavi.ps1" }

          # 23.09.2026 - VUK m.370 yanlis alarmi: 689 soru yayindan cekildi. Iki kok: (1) ayristirici
          # "(Mülga: ...; Yeniden duzenleme: ...)" serhini mulga sanip maddeyi atiyordu - 15 madde ambara hic
          # girmemisti; (2) nobetci "damga farkli"yi "metin degisti" sayiyordu, 7 maddede yalniz parca dizilisi
          # kaymisti. Iki sinav: ayristiricinin serh kurali (5 vaka, ambara DOKUNMAZ) + damga degisim turu
          # (15 vaka: gercek degisiklik kacmasin + dizilis/ayri kayit alarm vermesin).
          - { ad: "Mevzuat ayristirici OZ-SINAVI (mulga serhinin SON islemi)",
              kabuk: pwsh, komut: "./motor/mevzuat-yut.ps1 -OzSinav" }
          - { ad: "Damga degisim turu OZ-SINAVI (dizilis kaymasi soru cekmesin)",
              kabuk: pwsh, komut: "./arac/damga-degisim-sinavi.ps1" }

          # 23.09.2026 - Engel dogrulama araci (yayindan cekilen soruyu KANITLA geri acar) ayni gun iki kez yanlis
          # kanit uretti: cmd '^' kacisi alarm SONRASI tabani okuttu; kelime cok-kumesi sira korudu. 13 vaka:
          # dizilis/damga, dipnot ayiklama (tutar/tarih/bent/sira DOKUNULMAZ), tarih, '^' gerilemesi.
          # Mutasyonla olculdu: caret geri, damga kontrolu yok, dipnot her sayiyi siler -> sinav KIRMIZI.
          - { ad: "Engel dogrulama OZ-SINAVI (yanlis kanitla soru geri acilmasin)",
              kabuk: pwsh, komut: "./arac/mevzuat-degisti-dogrula-sinavi.ps1" }

          # 23.09.2026 - Nobetci artik paketinde degisen madde bulunan ama degisen kisma DEGMEYEN soruyu cekmiyor
          # (TTK gec. m.7: 93 sorudan 91'i degmiyordu). Kural yanlis kurulursa GERCEK degisiklik yayinda kalir.
          # 14 vaka: oran/sure/iptal edilen hukum YAKALANIR, ilgisiz soru ve metin ayni CEKILMEZ, soz dizimi ve
          # yalniz serh -> BELIRSIZ (hepsi cekilir). Mutasyonla olculdu: sayi sozcugu / sayilar / belirsiz kaldirilinca KIRMIZI.
          - { ad: "Soru etki OZ-SINAVI (degisen kisma degmeyen soru cekilmez, gercek degisiklik kacmaz)",
              kabuk: pwsh, komut: "./arac/soru-etki-sinavi.ps1" }

          # 23.09.2026 - KAPI-HAD bitirme yayin sartinda soru dusurur (yanlis yasal had tutari). Had taramasi 34 supheli
          # vermisti (31'i saglam) - kapi DAR kuruldu: tutar had ifadesiyle dogrudan tanimli + ayni baglam ya da madde
          # aciktan aniliyor + varsayim degil. 11 vaka; butun SMMM (4.862) esdegerlik provasinda yalniz bilinen 2 kusur dustu.
          # Mutasyonla olculdu: varsayim / madde anilmasi / baglam sarti kaldirilinca KIRMIZI.
          - { ad: "KAPI-HAD OZ-SINAVI (yanlis had tutari yayina girmesin)",
              kabuk: pwsh, komut: "./arac/had-kapisi-sinavi.ps1" }

          # 23.09.2026 - Model konu kontrolu dogru etiketlilerin %17'sine HAYIR dedi; yeniden etiketleme yalniz
          # HAYIR + ELLE ORNEKLEM (max(5, %10), tamami okunmus, yanlis <= %10, model sonucu degismemis) ile yazar.
          # 14 vaka. Mutasyonla olculdu: damga / okunmamis / yanlis orani / ornekleme-yok kontrolu kaldirilinca KIRMIZI.
          - { ad: "Konu orneklem kapisi OZ-SINAVI (model HAYIR dedi diye etiket elle bakilmadan degismesin)",
              kabuk: pwsh, komut: "./arac/konu-orneklem-kapisi-sinavi.ps1" }

          # 23.09.2026 - Commit mesaji "su dosyayi degistirdim" diyor, dosya commit'te mi? O gun iki degisiklik
          # "yapildi" diye gonderildi ama dosyaya girmemisti (cc4b6a6e CLAUDE.md). 41 iddiada 1 gercek, 0 yanlis alarm.
          # Mutasyon: komut ornegi ayiklamasi kaldirilinca KIRMIZI.
          - { ad: "Commit iddia denetimi OZ-SINAVI (anilan dosya commit'te olmali)",
              kabuk: pwsh, komut: "./arac/commit-iddia-denetimi.ps1 -Sinav" }

          # 24.09.2026 - Pazarlamada "cozenlerin %X'i su sikki secti" cumlesinin tek kaynagi. Olculmemis "en cok denen"
          # iddiasi yerine gercek oran; n < esik ise AZ VERI (videoda yuzde soylenmez). 4 vaka, ag yok.
          # Mutasyonla olculdu: esik / yuzde paydasi / gecersiz secim / canli dizi kaymasi -> sinav KIRMIZI.
          - { ad: "Sik dagilimi OZ-SINAVI (az veriyle yuzde soylenmesin)",
              kabuk: pwsh, komut: "./arac/sik-dagilimi.ps1 -Sinav" }

          - { ad: "Eksik dosya kapisi (cagrilan dosya depoda mi)",
              kabuk: pwsh, komut: "./arac/eksik-dosya-kapisi.ps1" }

          - { ad: "Nokta-kontrol (bilinen kod -> dogru cevap)",
              kabuk: pwsh, komut: "./arac/nokta-kontrol.ps1" }

          - { ad: "API ceviri testi (yedek hat; cagri YOK)",
              kabuk: pwsh, komut: "./arac/api-ceviri-testi.ps1" }

          - { ad: "Kimlik denetimi (Supabase betigi kimliksiz kalmasin)",
              kabuk: pwsh, komut: "./arac/kimlik-denetimi.ps1" }

          - { ad: "Veri bekcisi (cekilen json var mi / parse / dolu mu)",
              kabuk: pwsh, komut: "./arac/veri-bekcisi.ps1" }

          - { ad: "Koku olcer (YZ izi - jargon/klise kapisi)",
              kabuk: pwsh, komut: "./arac/koku-olcer.ps1" }

          # 17.08 - Cem: "sitede otomatik guncellenmeyen veri kalmasin."
          # Sitenin okudugu her veri/*.json icin sorar: ureten betik var mi, onu
          # cagiran workflow var mi. Bilinen eksikler veri/otomasyon-borcu.json'da
          # gerekcesiyle kayitli ve kapiyi dusurmez - kapinin isi YENI elle
          # beslenen dosya eklenmesini engellemek.
          - { ad: "Otomasyon denetimi (yeni veri elle beslenmesin)",
              kabuk: pwsh, komut: "./arac/otomasyon-denetimi.ps1" }

          # 01.09 - Cem: "SQL kapisini kur."
          # O gun depoya CALISTIRILAMAZ bir SQL girdi: "$" yerine tek "$"
          # yazilmisti (yamayi kabuk uzerinden yazarken bash bir dolari yedi).
          # JS'e node --check, PowerShell'e parser vardi; SQL'e HICBIR SEY yoktu.
          # Kapi 52 .sql dosyasini yurur: kapanmamis dolar tirnagi, yalniz duran
          # $, parantez dengesi, BOM. Adlandirilmis tirnaklari ($fn$...$fn$)
          # gercekten ayristirir - ilk surumum onlari bilmedigi icin 24 yanlis
          # alarm vermisti ve GURULTULU KAPI, KAPI DEGILDIR.
          # Kapinin kendi oz-sinavi var (8 ornek); o dusserse olcum yapilmaz.
          - { ad: "SQL kapisi (calistirilamaz SQL depoya girmesin)",
              kabuk: bash, komut: "node arac/sql-kapisi.js" }

          # 23.09 - e-posta onayi kapatildi (23.09), sahte hesap acmak kolaylasti.
          # Saatlik uye alarmi (uye-alarmi.yml) yalniz SAYI okur, esik asilinca Cem'e
          # mail atar. Oz-sinav 15 vaka: 8 seviye (sinir alti YANLIS ALARM VERMEMELI
          # dahil) + 7 mail tekrari (ayni seviye 6 sa icinde ikinci mail yok,
          # yukselirse hemen). Ag'a gitmez.
          - { ad: "Uye alarmi oz-sinavi (sahte hesap dalgasi esikleri)",
              kabuk: pwsh, komut: "./motor/uye-alarmi.ps1 -Sinav" }

          # 25.08 - acik temaya gecerken 551 kontrast kirigi cikti; hepsinin koku
          # renklerin SABIT yazilmis olmasiydi. Iki kapi: biri SEBEBI (sabit renk
          # eklenmesini), digeri SONUCU (okunmayan metni) yakalar.
          - { ad: "Renk sabiti denetcisi (sabit renk borcu artamaz)",
              kabuk: pwsh, komut: "./arac/renk-sabiti-denetcisi.ps1" }

          # 30.08: marka varliklari (favicon, ikonlar, paylasim kartlari)
          # favicon.svg + logo.svg'den TURETILIYOR. Logo degisip varliklar
          # yeniden basilmazsa sonuc sessiz ve utandirici olur: sekmede eski
          # logo, paylasimda yeni logo, iPhone ana ekraninda bir ucuncusu.
          # Hicbir kapi bunu yakalamaz - sayfalar acilir, konsol temizdir,
          # kontrast dogrudur. Olcut: kaynaklarin SHA-256 parmak izi
          # (veri/marka-varlik-kunyesi.json). Byte kiyasi ISE YARAMIYOR -
          # Chrome ayni SVG'den her kosuda birebir ayni PNG uretmiyor
          # (olculdu: 11,5 KB / 10,8 KB); git kutugu de ise yaramiyor -
          # bu akis fetch-depth:2 ile SIG klon yapiyor.
          - { ad: "Marka varlik kapisi (ikon/kart kaynaktan geri kalmasin)",
              kabuk: pwsh, komut: "./arac/marka-varlik-kapisi.ps1" }

          # 30.08: PowerShell'in -match/.ToLower() IgnoreCase icin
          # CurrentCulture kullanir. tr-TR'de "IFLASINA".ToLower() -> "ıflasına"
          # olur ve 'iflas' arayan desen ISKALAR; en-US runner'da ise
          # "İNKILAP" -> "i̇nkilap" (i + U+0307) olur ve -replace 'İ' bulamaz.
          # Ayni kod iki makinede iki farkli sonuc verir ve kusur SESSIZDIR.
          # Iki kez canli yasandi: alacak damgasinda 456 kaydin 456'si yanlis
          # "desteksiz" gorundu (gercekte 32); ders-karnesi'nde 6 vakanin 4'u
          # eslesmiyordu. Circir: mevcut borc taban, YENI ekleme kirmizi.
          - { ad: "Turkce katlama nobetcisi (I ile i karistiran eslestirme)",
              kabuk: pwsh, komut: "./arac/turkce-katlama-nobetcisi.ps1" }

          # 30.08: veri/ihale-firma-ozet.json'da EN BUYUK kayit bir firma
          # DEGIL: "Ticaret Limited Sirketi" - 295 ihale, 2,97 MILYAR TL.
          # Firma adinin OZEL AD kismi kayip; ilgisiz onlarca firma tek
          # kayitta toplaniyor ve Firma Analizi araci "bu firma 295 ihale
          # kazandi" diyor. Olculdu: 115 kayit, 1.431 ihale, 7,94 milyar TL.
          # Kapi CIRCIR: mevcut borc taban, ARTIS kirmizi - ayristirici
          # bozulursa (PDF dizgisi degisirse) hemen goruluyor.
          - { ad: "Ihale firma adi denetimi (ozel adi kayip yuklenici)",
              kabuk: pwsh, komut: "./arac/ihale-firma-adi-denetimi.ps1",
              rapor: "veri/ihale-kesik-firma-adi.json" }

          # 30.08: veri/ihale-kesik-firma-adi.json'a CAKISMA ISARETLI bir surum
          # itildi (autostash birlestirmesi cozulmeden commit'lendi) ve uzerine
          # iki kosu daha yapildi - kimse fark etmedi. Bu dosyalari SITE okuyor;
          # bozuk JSON = sayfa sessizce bos. Kapi 1.515 dosyayi tarar: cakisma
          # isareti + yapi (baslangic/bitis) herkese, tam parse 2 MB altina.
          # Buyukler ATLANIR ama atlandigi YAZILIR - "olculmedi" ile "temiz"
          # karismasin. ~40 sn surer.
          - { ad: "JSON butunluk kapisi (cakisma isareti / bozuk veri dosyasi)",
              kabuk: pwsh, komut: "./arac/json-butunluk-kapisi.ps1" }

          # ubuntu-latest imajinda Google Chrome hazir gelir; ek kurulum yok.
          # Bagimlilik da yok - Node'un yerlesik fetch + WebSocket'i ile dogrudan
          # Chrome DevTools protokolu konusulur. ~4 dk surer, en yavas kapi.
          # "rapor" verilen kapi ciktisini depoya isler - KOR KALMA kurali.
          # Kapi CI'da dustugunde gunlugu okumak DEPO YONETICISI yetkisi
          # istiyor; yetkisi olmayan NEDEN dustugunu goremiyor. Rapor depoda
          # durursa herkes gorur.
          - { ad: "Kontrast kapisi (okunmayan metin yayina cikmasin)",
              kabuk: bash, komut: "node arac/kontrast-kapisi.js",
              rapor: "veri/kontrast-raporu.json" }
          # 23.09: koyu gecis artik kuralla kurulur (stil-acik bagli her sayfa - KOYU_BEKLEYEN);
          # liste kurucunun oz-sinavi (Chrome gerekmez, saniyeler).
          - { ad: "Kontrast kapisi oz-sinavi (koyu gecis listesi)",
              kabuk: bash, komut: "node arac/kontrast-kapisi.js --sinav" }
          # 23.09: haftalik :root kopya uyarisinin (root-jeton-tarama.yml) oz-sinavi - saniyeler
          - { ad: "Root jeton taramasi OZ-SINAVI (eski jeton kopyasi yeni mi)",
              kabuk: bash, komut: "node arac/root-jeton-tarama.js --sinav" }
          # 23.09: kasa kabugu + yayin "tam basildi mi" kapisi. Oz-sinavi hic bu matriste degildi;
          # 18.09'da kapi yayini 5 gun durdurdu. Ag yok, saniyeler.
          - { ad: "Kasa kabugu OZ-SINAVI (kabuk + tam-mi onek suzgeci)",
              kabuk: bash, komut: "node motor/kasa-kabuk.js --sinav" }
          # 25.09 (Cem "1.2.3 uc hamle"): magaza uygulamasi (mobil/) yalniz KASA MODUNDAKI sorusuz
          # kabuklari tasir, satis baglantisi tasimaz. Kapilar mobil/hazirla.js'te; bu sinav gercek
          # betigi 9 sahte depoda + gercek depoda kosar, ayrica paket kurali (kapsar) ve kasa sorgusu
          # bicimi paket-kapisi.js / kasa-yukle.js ile ayni mi olcer. Ag yok, saniyeler.
          # GORMEZ: yerel Android/iOS derlemesini, kasa RLS'ini, cihazda calismayi.
          - { ad: "Mobil uygulama icerik kapisi OZ-SINAVI (kasa + sizinti + satis)",
              kabuk: bash, komut: "node mobil/hazirla-sinavi.js" }
          # Kural 8: kapilar tek tek kor edilir, her birinde sinav KIRMIZI dusmeli (4/4).
          - { ad: "Mobil uygulama icerik kapisi MUTASYON (5 kapi kor edilince sinav duser mi)",
              kabuk: bash, komut: "node mobil/hazirla-sinavi.js --mutasyon" }
          # 25.09 (Cem "1 ve 2 yap"): uygulama ici satin alma. radar-app/edge/magaza-dogrula.ts'in saf
          # karar blogu (kime ne tanimlanir, ne reddedilip iade edilir) GERCEK kodundan kosar; bitis
          # tarihi fiyat-motoru.js ile, paket kurali paket-kapisi.js ile, magaza fiyati site fiyati/0,85
          # ile, satilan ders adlari kasadaki adlarla ayni mi olculur. Ag yok, saniyeler.
          # GORMEZ: Google API'nin gercek yaniti, Supabase yazimi (canli prova ister).
          - { ad: "Mobil satin alma karari OZ-SINAVI (hak karari + fiyat + tarih esligi)",
              kabuk: bash, komut: "node mobil/magaza-sinavi.js" }
          - { ad: "Mobil satin alma karari MUTASYON (5 kural bozulunca sinav duser mi)",
              kabuk: bash, komut: "node mobil/magaza-sinavi.js --mutasyon" }
          # 24.09 (Cem "1 ve 3 yap"): fark.html "30.000'den fazla", tuzak.html "29.000'den fazla soru"
          # yaziyordu; sitede 7.117 soru vardi (Ticari Reklam Yon. m.9: ispat reklam verende).
          # Yayindaki soru sayisi iddiasini kaydir/<sinav>/index.html ile kiyaslar. Her push'ta
          # kosar: yayindan soru cekilip sayi duserse eski dogru cumle de KIRMIZI olur.
          # GORMEZ: gorseldeki yazi, JS ile kurulan sayi, depo disi metin (dosya basinda tam liste).
          - { ad: "Sayi iddiasi kapisi (sitede yazan soru sayisi gercek mi)",
              kabuk: bash, komut: "node arac/sayi-iddia-kapisi.js" }
          - { ad: "Sayi iddiasi kapisi OZ-SINAVI",
              kabuk: bash, komut: "node arac/sayi-iddia-kapisi.js --sinav" }

          # 29.08 (Cem "2 yap"): kurulu kapilarin hicbiri "bu sayfa gercekten
          # aciliyor mu" diye sormuyordu. Kontrast kapisi RENGI, koku olcer
          # DILI, renk sabiti KAYNAK METNI denetler. O gun marka-rapor.html'in
          # kagit div'inde IKI id oldugu icin sayfanin acilmadigi ortaya cikti
          # (sonsuza kadar "Rapor yukleniyor..."), ayni kusur marka-app ve
          # evrak-app'te de vardi. Uc kapi da yesil koşuyordu.
          # Bu kapi her sayfayi ACAR: yakalanmamis hata / asili kalan yuklenme
          # metni / izinsiz dis kaynak / 404 alt kaynak arar.
          - { ad: "Acilis kapisi (sayfa gercekten aciliyor mu)",
              kabuk: bash, komut: "node arac/acilis-kapisi.js",
              rapor: "veri/acilis-raporu.json" }

          # 12.09 (Cem "1.2.3 ucunu de yap"): ana sayfanin Nobetci kutusu
          # "son robot kosusu 07.09 - 5 gun once" yazip KIRMIZI yandi. ROBOT
          # HIC GUN ATLAMAMISTI: damga izi 04.09-12.09 gunde iki kosu, bosluk
          # yok; canli dosya 12.09 09:20'ydi. Ekrandaki govde 07.09 21:49'du
          # (parmak izi rg_karti=2, yalniz o tek commit'te). Kok neden: sayfa
          # veriyi acilista BIR KEZ cekiyor ama bayatlik hukmunu O ANKI SAATLE
          # kuruyordu - tarayicida kalmis eski kopya robotu SUCLUYORDU.
          # Uc tur bu yanlis teshise gitti.
          # Uc sayfa duzeltildi (index/pano/durum, ortak motor tazelik.js);
          # bu kapi DORDUNCUSUNU onluyor. Kural yorumda kalirsa unutulur -
          # bugun tam bu yuzden unutulmustu.
          # Taban: veri/tazelik-borcu.json (8 sayfa SARI, is emri). Defterde
          # OLMAYAN yeni ihlal KIRMIZI. Bedel 0 - yalniz dosya okur.
          - { ad: "Tazelik kapisi (iddia ile kanit ayni anda tazelenir)",
              kabuk: bash, komut: "node arac/tazelik-kapisi.js" }

          # 30.08: damping oranlari kaynak Excel'den UC AYRI bicimde iniyor
          # ("%38,26-%45,99" / "21,12%-28,87%" / "0.29" = Excel ondaligi %29).
          # Okuyucu yalnizca birincisini taniyordu; 141 kaydin 30'u SESSIZCE
          # sifir sayiliyor, 140 GTIP kodunda "damping yok" gorunuyordu. En
          # buyugu %56,50 (Cin, 8415.83 klima, teblig 2022/1) - arac cezali
          # menseyi "en avantajli" diye oneriyordu. Bu kapi yeni bir bicim
          # girerse KIRMIZI yanar; sessiz sifira geri donulmesin.
          # 07.09: kapi kutugunu (4. katman) yaziyordu ama rapor alani bos oldugu
          # icin yayinlanmiyordu; sebep runner'da kayboluyordu. Artik yayinlanir.
          - { ad: "Damping oran kapisi (okunamayan onlem orani kalmasin)",
              kabuk: bash, komut: "node arac/damping-oran-kapisi.js",
              rapor: "veri/damping-oran-log.txt" }

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # diff-bekcisi HEAD~1 ile kiyas yapar

      # Kabuk matristen geliyor. Tek adimda "shell: ${{ }}" yazmak yerine iki
      # ayri adim + if kullanildi: shell alaninda ifade destegi surume bagli,
      # bu yol her surumde calisir ve gunlukte hangi kabugun kostugu gorunur.
      - name: "Denetci (pwsh)"
        if: matrix.kapi.kabuk == 'pwsh'
        shell: pwsh
        run: ${{ matrix.kapi.komut }}

      - name: "Denetci (bash)"
        if: matrix.kapi.kabuk == 'bash'
        shell: bash
        run: ${{ matrix.kapi.komut }}

      # KOR KALMA: kapi kirmizi olsa da raporu yayinlanir. Yoksa CI'da
      # dustugunde sebebini yalniz depo yoneticisi gorebiliyor.
      - name: "Raporu yayinla (kirmizi olsa da)"
        if: always() && matrix.kapi.rapor != ''
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "${{ matrix.kapi.rapor }}" || true
          git diff --cached --quiet || git commit -m "Kontrast raporu [veri-operasyonu]"
          git pull --rebase --autostash || true
          git push || true
