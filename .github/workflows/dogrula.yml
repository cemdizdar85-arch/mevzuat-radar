# Bu dosyanin GitHub'daki yolu: .github/workflows/dogrula.yml
# DOGRULAMA KAPISI (Katman 1): HER push'ta yapisal denetci + nokta-kontrol kosar.
# Amac: yanlis/celisik veri ana dala girer girmez KIRMIZI X + Cem'e mail.
# (Onceden dogrulama yalniz robotun gunluk isinde vardi; elle push'lar denetimsizdi.)
name: Dogrulama Kapisi

on:
  push:
    branches: [ main ]     # SIR BEKCISI her push'ta calissin diye paths filtresi kaldirildi
  workflow_dispatch:

jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # diff-bekcisi HEAD~1 ile kiyas yapar

      - name: Sir bekcisi (anahtar sizinti taramasi — depo PUBLIC!)
        run: |
          # API anahtari / servis anahtari / uzun JWT desenleri tracked dosyalarda aranir.
          # sb_publishable_ anahtari kasten HARIC: o publishable'dir, sitede acik durur.
          #
          # 17.08 DUZELTME - 'service_role' KELIMESI desenden CIKARILDI.
          # Kapi en az 6 kosudur (#1192-#1197) kirmizi bitiyordu ve sebebi tek bir
          # SEY DEGILDI: veri/sql-marka-uyari.sql + sql-marka-durum.sql icindeki
          # UC ACIKLAMA SATIRI ("-- Yazma yalniz service_role (robot) ile").
          # service_role, Supabase'in hazir POSTGRES ROL ADI; sizabilecek sey rolun
          # adi degil ANAHTARI. Anahtarin iki bicimi var, ikisi de kapsanir:
          #   - eski tip: JWT (asagidaki eyJhbGciOi... deseni)
          #   - yeni tip: sb_secret_... (bu turda EKLENDI; simdilik 0 bulgu)
          # Surekli kirmizi kapi kapi degildir - kimse okumaz. Kelime yerine
          # ANAHTAR BICIMI aranir; kapsama daralmiyor, yanlis alarm bitiyor.
          desenler='sk-ant-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|re_[A-Za-z0-9]{20,}|eyJhbGciOi[A-Za-z0-9_-]{60,}\.[A-Za-z0-9_-]{60,}\.[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}'
          bulunan=$(git grep -I -nE "$desenler" -- . ':!*.md' ':!.github/workflows/dogrula.yml' || true)
          if [ -n "$bulunan" ]; then
            echo "SIR BEKCISI KIRMIZI — olasi anahtar sizintisi:"
            echo "$bulunan"
            exit 1
          fi
          echo "Sir bekcisi temiz."

      - name: Diff bekcisi (kazayla veri silme freni)
        shell: pwsh
        run: ./arac/diff-bekcisi.ps1

      - name: Yapisal denetci (imkansiz/celisik veri)
        shell: pwsh
        run: ./arac/yapisal-denetci.ps1

      - name: Nokta-kontrol (bilinen kod -> dogru cevap regresyonu)
        shell: pwsh
        run: ./arac/nokta-kontrol.ps1

      - name: API ceviri testi (Anthropic <-> OpenRouter yedek hatti; cagri YOK)
        shell: pwsh
        run: ./arac/api-ceviri-testi.ps1

      - name: Kimlik denetimi (Supabase cagiran betik kimliksiz kalmasin)
        shell: pwsh
        run: ./arac/kimlik-denetimi.ps1

      - name: "Veri bekcisi (her sayfanin cektigi json - var mi / parse / dolu mu)"
        shell: pwsh
        run: ./arac/veri-bekcisi.ps1

      - name: "Koku olcer (YZ izi - jargon/klise kapisi, emoji/unlem raporu)"
        shell: pwsh
        run: ./arac/koku-olcer.ps1

      # 17.08 - Cem: "sitede otomatik guncellenmeyen veri kalmasin."
      # Sitenin okudugu her veri/*.json icin sorar: ureten betik var mi, onu
      # cagiran workflow var mi. Yoksa KIRMIZI. Bilinen eksikler
      # veri/otomasyon-borcu.json'da gerekcesiyle kayitli ve kapiyi dusurmez -
      # kapinin isi YENI elle beslenen dosya eklenmesini engellemek.
      - name: "Otomasyon denetimi (yeni veri dosyasi elle beslenmesin)"
        shell: pwsh
        run: ./arac/otomasyon-denetimi.ps1
