# .github/workflows/uyari.yml  —  Radar uyarı robotu
# Her sabah firmaları profiline göre tarar, YENİ eşleşmeyi firma_uyarilari'na
# yazar (panel "🔔 Radar uyarıların" gösterir); RESEND takılıysa mail de atar.
# ÜCRETSİZ: AI çağrısı yok — Supabase okuma/yazma + depo dosyaları.
# GEREKSİNİM: SUPABASE_SERVICE_KEY (takılı), RESEND_KEY + RESEND_FROM (opsiyonel).
# 30.07: push tetiği + özet commit'i eklendi — 23.07'den beri betik depoda
# olmadığı için cron her sabah boşa düşüyordu ve İZ BIRAKMIYORDU (kör kalma).
name: Radar Uyarı Robotu

on:
  schedule:
    - cron: "0 7 * * *"     # 07:00 UTC = 10:00 TR (ihale + kart hasadından sonra)
  workflow_dispatch:
  push:
    paths:
      - 'motor/uyari-robotu.ps1'
      - '.github/workflows/uyari.yml'

permissions:
  contents: write

concurrency:
  group: uyari-robotu
  cancel-in-progress: false

jobs:
  uyari:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uyari robotu
        shell: pwsh
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: ./motor/uyari-robotu.ps1
      - name: Ozeti commit'le (kor kalma kurali - yalniz SAYILAR, kisisel veri yok)
        if: always()
        run: |
          git config user.name  "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f veri/uyari-ozet.json ]; then git add veri/uyari-ozet.json || true; fi
          git diff --cached --quiet || git commit -m "Uyari robotu ozeti [veri-operasyonu]"
          git pull --rebase || true
          git push || true