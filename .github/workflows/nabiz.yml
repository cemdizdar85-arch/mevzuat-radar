# .github/workflows/nabiz.yml — NABIZ NÖBETÇİSİ v2 (robotların robotu)
# Iki katman: (1) her kritik robotun son BASARILI kosusunun yasi,
# (2) robotlarin yazdigi dosyalardaki tarih damgalarinin tazeligi
# ("yesil kosu != tam veri" dersi). Kirmizi = exit 1 (GitHub sahibine
# hata maili) + Resend/web3forms uzerinden alarm maili.
# Rapor veri/nabiz-raporu.json'a her kosuda yazilir (kor kalma).
name: Nabiz Nobetcisi

on:
  schedule:
    # 31.07 Cem: "sabah 10 cok gec; sabah 5'te her sey kontrol edilmis ve
    # duzeltilmis olmali." Dortlu vardiya (TR saati):
    - cron: "7 1 * * *"     # 04:07 TR — gece kosulari kontrol + KURTARMA
    - cron: "37 2 * * *"    # 05:37 TR — dogrulama; kurtarma tutmadiysa ESKALASYON maili
    - cron: "7 9 * * *"     # 12:07 TR — sabah robotlari (06-10 TR) bittikten sonra yoklama
    - cron: "52 15 * * *"   # 18:52 TR — aksam cekimlerinden sonra yoklama
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # v3: kacirilan vardiyayi workflow_dispatch ile KENDISI kurtarir

jobs:
  nabiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Robot nabizlarini ve veri damgalarini olc
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: ./motor/nabiz-nobetcisi.ps1
      - name: Raporu yayinla (kirmizi olsa da — kor kalma)
        if: always()
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/nabiz-raporu.json || true
          git diff --cached --quiet || git commit -m "Nabiz raporu [veri-operasyonu]"
          git pull --rebase --autostash || true
          git push || true
