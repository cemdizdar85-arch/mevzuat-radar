name: Marka Bulteni
# ============================================================================
#  Cem (30.08.2026): "ŞU AN ARKADA SİSTEMDEN İNDİRİYORUZ, O YAPIYORSA BUNU
#  YAPALIM MI? KARARINI SEN VER."  -> Karar: EVET, ana hat bu olacak.
#
#  KARARIN ÖLÇÜLMÜŞ GEREKÇESİ (30.08):
#   · TMview aynasi : 3 kosu, 3 BASARISIZ, 0 kayit. Kaynak bizi bot korumasina
#     aldi - HTTP 200 donup govdede engel sayfasi veriyor, hem bizim IP'den
#     hem GitHub'dan. Yani "arkada iniyor" sanilan sey aslinda INMIYORDU.
#   · Resmi Marka Bulteni : 477 MB PDF 5 dk 17 sn'de indi, 3.520 sayfadan
#     7.860 kayit cikti, dort alanin dordu de %100 dolu. Engel yok.
#   · Hukuken ASIL olan bu: itiraz suresi (SMK m.18, iki ay) bultenin YAYIM
#     tarihinden isler. TMview bunun ikinci elden kopyasidir.
#
#  SIKLIK: Bulten ayda iki cikiyor (498 -> 12.08, 499 -> 27.08). Gunde bir
#  bakmak fazlasiyla yeter; yeni bulten yoksa is saniyeler icinde biter.
#  Yutulmus bulten tekrar INDIRILMEZ - bunun kontrolu marka_bulten_kutuk
#  tablosundan okunur (robot icinde, 'durum=bitti' suzgeci). Bu satir bir kez
#  KONTROL YOKKEN yazilmisti; belge olmayan bir davranisi anlatiyordu ve
#  gunluk kosu her gece 477 MB'i bosuna indirecekti.
#
#  MALIYET 0: depo PUBLIC (Actions ucretsiz), kaynak kimliksiz/CAPTCHA'siz.
#
#  ILK KURULUM (Cem'in eli, bir kez):
#    veri/sql-marka-bulten.sql -> Supabase SQL Editor
# ============================================================================
on:
  schedule:
    # 30.08: 05:40 TR -> 02:10 TR. Indirme gunduz kostugunda canli arama
    # coktu (5 aramadan 4'u zaman asimi; indirme yokken 1,5 sn). Toplu
    # indirme artik yalniz gece; sabaha site serbest kaliyor.
    - cron: '10 23 * * *'     # 02:10 TR
  workflow_dispatch:
    inputs:
      mod:
        description: 'son = en yeni bulteni yut · gecmis = son N bulteni yut · liste = yalniz bak · zorla = yutulmus olsa da yeniden yut'
        type: choice
        options: [son, gecmis, liste, zorla]
        default: son
      adet:
        description: 'gecmis modunda kac bulten (en yeniden geriye)'
        default: '263'

concurrency:
  group: marka-bulten
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bulten:
    runs-on: ubuntu-latest
    timeout-minutes: 260      # robot 230'da kendisi durur, bu son emniyet        # bulten basi ~8 dk; 6 bulten rahat siger
    steps:
      - uses: actions/checkout@v4

      # pdftotext (poppler) ubuntu kosucusunda HAZIR GELMEZ - kurulmali.
      # Bu satir olmadan robot "pdftotext calistirilamadi" diye duser.
      - name: pdftotext kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Bulten hasadi
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Is 350 dk'da kesilir; robot 320'de KENDISI durup kutugu tutarli
          # birakir. Zorla kesilme yarim inen PDF birakir ve o bulten bosa gider.
          # 230 dk: 02:10'da baslayan kosu ~06:00 TR'de kendi isteğiyle durur.
          # Zorla kesilme yarim inen PDF birakir; kaynak devam desteklemiyor.
          SURE_DK: "230"
        run: |
          # Zamanlanmis kosunun varsayilani GECMIS: 263 bultenin listesini
          # alir, 'bitti' olanlari atlar, kalanlari yutar. Yeni cikan bulten de
          # bu listede oldugu icin ayri bir 'son' kosusuna gerek yok.
          mod='${{ github.event.inputs.mod }}'; [ -z "$mod" ] && mod=gecmis
          # 31.08: yedek 6 -> 263. Zamanlanmis kosu input GONDERMEZ, bu satir
          # devreye girer. Dugmedeki varsayilani 263 yapip burayi 6 birakinca
          # gece kosusu 248 bulten beklerken "yutulacak yeni bulten yok" dedi.
          adet='${{ github.event.inputs.adet }}'; [ -z "$adet" ] && adet=263
          echo "mod: $mod"
          case "$mod" in
            liste)  node motor/marka-bulten-hasat.js --liste ;;
            gecmis) node motor/marka-bulten-hasat.js --son "$adet" ;;
            zorla)  node motor/marka-bulten-hasat.js --son "$adet" --zorla ;;
            *)      node motor/marka-bulten-hasat.js --son 1 ;;
          esac

      # NOBET UYARILARI - yutmadan SONRA kosar.
      # Sira onemli: once bulten ambara girer, sonra haber gider. Tersi olsa
      # yeni bultendeki basvurular bir TUR gecikirdi; itiraz suresi iki ay ve
      # uzatilamiyor, bir tur gecikme musteriye hak kaybettirebilir.
      # if: always() -> yutma kismen dusse bile INEN bultenler icin haber gider.
      # MUTABAKAT NOBETCISI - "kutuk mu dogru, tablo mu?"
      # Sayac artik KUTUKTEN okuyor (tabloyu saymak zaman asimina dusuyordu).
      # Bu hizli ama bir varsayima dayaniyor: robot kac kayit yazdigini dogru
      # yazdi. Varsayim kirilirsa ekran "7.860" der, tabloda 7.400 vardir ve
      # kimse fark etmez - eksik markalar icin uyari gitmez, itiraz suresi
      # sessizce akar. Nobetci o bosluğu kapatir.
      # continue-on-error: nobetci KIRMIZI yansa bile indirme zinciri durmaz;
      # kirmizi rapora ve kutuge yazilir, is akisi ozetinde gorunur.
      - name: Mutabakat nobetcisi
        if: always()
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node motor/marka-mutabakat.js

      - name: Nobet uyarilari
        if: always()
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: node motor/marka-uyari.js

      # Kor kalma kurali: kirmizi olsa da ne gordugumuz depoda dursun.
      - name: Raporu yayinla (kirmizi olsa da)
        if: always()
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/marka-bulten-raporu.json || true
          git add veri/marka-mutabakat-raporu.json || true
          git diff --cached --quiet || git commit -m "Marka bulteni raporu [veri-operasyonu]"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then echo "rapor islendi (deneme $i)"; break; fi
            echo "push tutmadi (deneme $i)"; sleep 7
          done
