# ============================================================================
#  SINAV TEK SAYFA (0 USD, laptopsuz)
#
#  NEDEN VAR (02.09.2026, Cem): "sınavla ilgili her şey tek yerden, hızlı,
#  güvenilir, kaybolmadan". 31.08 Excel haritası masaüstünde donuk kalmıştı;
#  bu akış aynı sayfayı her sabah depoda yeniden kurar.
#
#  SAAT: 05:30 UTC = 08:30 TR. Girdileri üreten robotlar daha erken koşuyor
#  (kasa-sayim 00:41 UTC, parti-liste 00:26, soru-dayanak 03:40). Ambar
#  kapıları 08:00 UTC'de koşar; onun çıktısı ertesi sabahki sayfaya girer
#  (bir gün gecikme kabul: sayfa zaten damgayı yanına yazıyor).
#
#  Betik ağ kullanmaz, yalnız depodaki JSON'ları birleştirir. İçerik aynıysa
#  dosyaya dokunmaz (RaporYaz) — boş commit üretmez.
# ============================================================================
name: Sinav tek sayfa (0 USD, laptopsuz)

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'motor/sinav-tek-sayfa.ps1'
      - 'arac/tek-sayfa-kutuk-kapisi.ps1'
      - '.github/workflows/sinav-tek-sayfa.yml'
      - 'veri/kasa-sayim.json'
      - 'veri/ders-profili.json'
      - 'veri/sinav/sgs-konu-es.json'
      - 'arac/sgs-konu-kapsama.js'
      - 'arac/kgk-konu-kapsama.js'
      - 'veri/sinav/kgk-konu-es.json'

permissions:
  contents: write

jobs:
  tek-sayfa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 25.09 (Cem "gm önerilerini sen yap"): SGS konu kapsama — ders · konu · son 10 yıl · sitede · eksik.
      # Eşleme sözlüğü veri/sinav/sgs-konu-es.json; model/ağ yok. Dosyada zaman damgası yok → değişmezse commit yok.
      - name: SGS KONU KAPSAMA
        run: node arac/sgs-konu-kapsama.js

      # 27.09 (Cem "1.2.3"): KGK konu kapsama — hedef/sitede/eksik; tek sayfanın KGK kotası buradan. Site sayımı paket_soru (servis anahtarı);
      # ekrana yalnız sayı basar. Anahtar yoksa site KÖR yazılır ve özet dosyası YAZILMAZ (eski kalır).
      - name: KGK KONU KAPSAMA
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node arac/kgk-konu-kapsama.js

      - name: TEK SAYFAYI KUR
        shell: pwsh
        run: ./motor/sinav-tek-sayfa.ps1

      - name: KAPI — sayfa üretildi mi, bayat girdi kaç
        shell: pwsh
        run: |
          if(-not (Test-Path 'veri/sinav-tek-sayfa.json')){ Write-Host 'KOR: sayfa üretilmedi.'; exit 1 }
          $j = Get-Content 'veri/sinav-tek-sayfa.json' -Raw | ConvertFrom-Json
          $bayat = @($j.kaynak_sagligi | Where-Object { $_.durum -ne 'TAZE' })
          Write-Host ("girdi: {0} · taze olmayan: {1}" -f @($j.kaynak_sagligi).Count, $bayat.Count)
          foreach($b in $bayat){ Write-Host ("  {0,-22} {1,-28} {2}" -f $b.ad, $b.durum, $b.dosya) }
          Write-Host 'Bayat girdi kapıyı düşürmez (bilinen borç, sayfada ⚠ ile görünür); KIRIK girdi düşürür.'
          if(@($bayat | Where-Object { $_.durum -like 'KIRIK*' }).Count){ exit 1 }

      # 16.09 (Cem "1 ve 2 yap"): girdi kütüğü doğru mu? Kayıtlı üretici dosyayı gerçekten bu biçimde yazıyor mu, robot onu çağırıp
      # commit'liyor mu. 16.09 elle denetimi 5 yanlış kayıt buldu; ikisi koşturulunca güncel dosyayı eziyordu. Kırmızı = kütük düzeltilmeli.
      - name: KAPI — girdi kütüğü (üretici/robot doğru mu)
        shell: pwsh
        run: |
          ./arac/tek-sayfa-kutuk-kapisi.ps1 -Sinama
          ./arac/tek-sayfa-kutuk-kapisi.ps1
      - name: SONUCU DEPOYA BAS
        if: always()
        run: |
          git config user.name "mevzuat-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add veri/SINAV-TEK-SAYFA.md veri/sinav-tek-sayfa.json veri/sinav/SGS-KAPSAMA.md veri/sinav/KGK-KAPSAMA.md veri/sinav/kgk-kapsama-ozet.json veri/sinav/sgs-kapsama-ozet.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "degisiklik yok - commit yok."
          else
            git commit -m "Sinav tek sayfa tazelendi [veri-operasyonu]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break || sleep 5
            done
          fi
