# .github/workflows/erken-kayit-kapat.yml — SGS "SON 20 GÜN" ERKEN KAYIT KODLARINI KAPATIR (27.10.2026, Cem: 400 TL, 1 Kasım 23:59'a kadar)
#
# Kodlar elçi altyapısında açıldı (elciler tablosu, Tetikte'nin kendi kanal kodları, komisyon ödenmez):
#   ERKEN400 · INSTA400 · GOOGLE400 · TELEGRAM400
# Bu iş 1 Kasım 2026 23:59 TR'de (20:59 UTC) dördünü aktif=false yapar ve geri okur; geri okumada aktif kalan varsa KIRMIZI biter.
# Neden zamanlanmış iş: indirim süresi kampanya koşullarında yazılı (Ticari Reklam Yön. m.14/1 başlangıç-bitiş); elle kapatmayı
# unutmak süresi geçmiş indirimi açık bırakır. Yıl kapısı: 2026 dışındaki 1 Kasım'larda hiçbir şey yapmaz.
# Elle erken çalıştırma (workflow_dispatch) da aynı işi yapar.
name: Erken Kayit Kodlarini Kapat (1 Kasim 2026 23:59 TR)
on:
  schedule:
    - cron: '59 20 1 11 *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kapat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kodlari kapat ve geri oku
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ "$(date -u +%Y)" != "2026" ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "2026 degil - atlandi"; exit 0; fi
          B='https://bjrleanjpyujtajmazxn.supabase.co/rest/v1/elciler'
          F='kod=in.(ERKEN400,INSTA400,GOOGLE400,TELEGRAM400)'
          curl -sS --fail -X PATCH "$B?$F" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d '{"aktif": false}'
          acik=$(curl -sS --fail "$B?$F&aktif=eq.true&select=kod" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          echo "geri okuma (aktif kalan): $acik"
          if [ "$acik" != "[]" ]; then echo "AKTIF KOD KALDI - KIRMIZI"; exit 1; fi
          echo "4 erken kayit kodu kapatildi"
